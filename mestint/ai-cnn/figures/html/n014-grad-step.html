<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradienslépés a szintvonalakon – η hatása</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#999;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#888;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(300px,60vw)}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;max-width:520px;height:auto;display:block;margin:auto}
</style></head><body>
<div class="ctl">
 <label>lépésköz η <input id="eta" type="range" min="0.01" max="0.8" step="0.01" value="0.1"><output id="ev">0,1</output></label>
 <button id="step" type="button">Következő lépés</button>
 <button id="reset" type="button">Vissza (1 lépés)</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 440 440" role="img" aria-label="Szintvonalak és a gradienslépések pályája"></svg>
<script>
const $=id=>document.getElementById(id);
const f=(a,b)=>(a-1)**2+2*(b+1)**2, gr=(a,b)=>[2*(a-1),4*(b+1)];
const L=40,R=420,T=20,B=400, xmin=-1,xmax=3,ymin=-3,ymax=1;
const sx=x=>L+(x-xmin)/(xmax-xmin)*(R-L), sy=y=>B-(y-ymin)/(ymax-ymin)*(B-T);
const c=(v,d=3)=>(+v.toFixed(d)).toString().replace(".",",").replace("-","−");
let n=1;
function draw(){
  const eta=+$("eta").value; $("ev").textContent=c(eta,2);
  const fg=getComputedStyle(document.body).color;
  let g=`<defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="${fg}"/></marker></defs>`;
  for(let x=-1;x<=3;x++) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${B}" stroke="var(--grid)"/><text x="${sx(x)}" y="${B+16}" text-anchor="middle" fill="${fg}" font-size="12">${c(x)}</text>`;
  for(let y=-3;y<=1;y++) g+=`<line x1="${L}" x2="${R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${c(y)}</text>`;
  g+=`<g clip-path="url(#cp)">`;
  for(const lv of [0.5,1,2,3,4.5]){const rx=Math.sqrt(lv)*(R-L)/(xmax-xmin), ry=Math.sqrt(lv/2)*(B-T)/(ymax-ymin);
    g+=`<ellipse cx="${sx(1)}" cy="${sy(-1)}" rx="${rx}" ry="${ry}" fill="none" stroke="${fg}" stroke-width="${lv===3?1.8:0.8}"/>`+
       `<text x="${sx(1)}" y="${sy(-1)-ry-3}" text-anchor="middle" fill="${fg}" font-size="11">${c(lv)}</text>`}
  let w=[2,-2], pts=[w], hist=[f(...w)];
  for(let k=0;k<n;k++){const d=gr(...w); w=[w[0]-eta*d[0],w[1]-eta*d[1]]; pts.push(w); hist.push(f(...w))}
  for(let k=0;k<pts.length-1;k++) g+=`<line x1="${sx(pts[k][0])}" y1="${sy(pts[k][1])}" x2="${sx(pts[k+1][0])}" y2="${sy(pts[k+1][1])}" stroke="${fg}" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>`;
  pts.forEach((p,k)=>g+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="${k?4:5}" fill="${k?'var(--bg)':fg}" stroke="${fg}" stroke-width="1.5"/>`);
  g+=`<line x1="${sx(2)}" y1="${sy(-2)}" x2="${sx(2+2/5)}" y2="${sy(-2-4/5)}" stroke="${fg}" stroke-width="2.4" marker-end="url(#ah)"/>`;
  g+=`<path d="M${sx(1)},${sy(-1)-8}l2.4,5.6h6l-4.8,3.6l1.8,6l-5.4,-3.6l-5.4,3.6l1.8,-6l-4.8,-3.6h6z" fill="${fg}"/></g>`;
  $("v").innerHTML=g;
  const last=pts[pts.length-1], fl=hist[hist.length-1];
  $("info").innerHTML=`${n}. lépés után: w = (${c(last[0])}; ${c(last[1])}), f = <b>${c(fl,4)}</b> (kezdetben 3). `+
    (eta>5/9?"η &gt; 5/9: már egy lépés után a veszteség <b>nő</b>.":eta>=0.5?"0,5 ≤ η ≤ 5/9: az első lépés még csökkenti f-et, de |1−4η| ≥ 1, ezért a további lépések nem konvergálnak.":eta>0.25?"0,25 &lt; η &lt; 0,5: a w₂ irányban előjelet vált (cikcakk), de konvergál.":"η ≤ 0,25: mindkét irányban előjelváltás nélkül közelít.")+
    " Vastag nyíl: ∇f(w⁽⁰⁾) 1/5 méretben.";
}
$("eta").addEventListener("input",draw);
$("step").onclick=()=>{if(n<30)n++;draw()};
$("reset").onclick=()=>{n=1;draw()};
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
