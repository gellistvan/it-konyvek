<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scatter-add 1D-ben</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--d:#e6e6e6;--pad:#d0d0d0;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--d:#3a3a3a;--pad:#444;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
button,select{font:inherit;padding:3px 10px}
#info{margin:4px 0 6px;min-height:2.6em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <button id="play">Lejátszás</button><button id="step">Lépés</button><button id="reset">Újra</button>
 <label>művelet <select id="op"><option value="add" selected>scatter-add (+=)</option><option value="set">felülírás (=)</option></select></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Kimeneti gradiens cellák nyilakkal a bemeneti gradiens celláira"></svg>
<p style="font-size:12px;color:var(--mut)">H = 4, k = 3, p = 1, s = d = 1, K = [1, 1, 1], D = [1, 2, 3, 4]. A ciklusrend: külső i (kimeneti index), belső a (kernelpozíció); a cél u = i + a − 1. A paddingcellára eső hozzájárulás eldobódik.</p>
<script>
const $=id=>document.getElementById(id);
const D=[1,2,3,4],K=[1,1,1],H=4,k=3,p=1;
const steps=[];for(let i=0;i<H;i++)for(let a=0;a<k;a++)steps.push([i,a,i+a-p]);
let t=0,timer=null;
function state(){const dX=[0,0,0,0];const op=$("op").value;
  for(let s=0;s<t;s++){const [i,a,u]=steps[s];if(u<0||u>=H)continue;const v=D[i]*K[a];if(op==="add")dX[u]+=v;else dX[u]=v;}return dX;}
function draw(){
  const dX=state(),fg=getComputedStyle(document.body).color,sx=80,X0=110,W=X0+6*sx,Hh=230;
  const cx=u=>X0+u*sx;let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W-40} ${Hh}"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="${fg}"/></marker></defs>`;
  for(let i=0;i<H;i++){g+=`<rect x="${cx(i)-22}" y="20" width="44" height="40" fill="var(--d)" stroke="${fg}"/><text x="${cx(i)}" y="46" text-anchor="middle" font-size="17" fill="${fg}">${D[i]}</text><text x="${cx(i)}" y="14" text-anchor="middle" font-size="12" fill="${fg}">D[${i}]</text>`;}
  for(let u=-1;u<=H;u++){const pad=u<0||u>=H;g+=`<rect x="${cx(u)-22}" y="150" width="44" height="40" fill="${pad?'var(--pad)':'none'}" stroke="${fg}" ${pad?'stroke-dasharray="5 3"':''}/><text x="${cx(u)}" y="176" text-anchor="middle" font-size="${pad?12:17}" fill="${fg}">${pad?'pad':dX[u]}</text><text x="${cx(u)}" y="206" text-anchor="middle" font-size="12" fill="${fg}">u=${u<0?'−1':u}</text>`;}
  for(let s=0;s<t;s++){const [i,a,u]=steps[s],pad=u<0||u>=H,cur=s===t-1;
    g+=`<line x1="${cx(i)}" y1="62" x2="${cx(u)}" y2="146" stroke="${cur?'var(--acc)':fg}" stroke-width="${cur?3.5:1.2}" ${pad?'stroke-dasharray="5 4" opacity=".55"':''} marker-end="url(#m)"/>`;}
  g+=`<text x="${X0-60}" y="46" text-anchor="end" font-size="12" fill="${fg}">D</text><text x="${X0-60}" y="176" text-anchor="end" font-size="12" fill="${fg}">dX</text>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Kimeneti gradiens cellák nyilakkal a bemeneti gradiens celláira" ')+"</svg>";
  let msg;
  if(t===0)msg="Kezdetben dX = (0, 0, 0, 0). Nyomd meg a Lépés vagy a Lejátszás gombot.";
  else{const [i,a,u]=steps[t-1];const op=$("op").value==="add"?"+=":"=";
    msg=(u<0||u>=H)?`lépés ${t}/12: i=${i}, a=${a} → u=${u<0?'−1':u}: paddingcella, a hozzájárulás eldobva.`
      :`lépés ${t}/12: i=${i}, a=${a} → dX[${u}] ${op} D[${i}]·K[${a}] = ${D[i]*K[a]}`;}
  msg+=` &nbsp; dX = (<b>${dX.join(", ")}</b>)`;
  if(t===steps.length)msg+=$("op").value==="add"?" — helyes eredmény: dX[1] = 1 + 2 + 3 = 6.":" — hibás: dX[1] = 3, csak az utolsó írás maradt meg.";
  $("info").innerHTML=msg;
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás";}
$("step").onclick=()=>{stop();if(t<steps.length){t++;draw();}};
$("reset").onclick=()=>{stop();t=0;draw();};
$("play").onclick=()=>{if(timer){stop();return;}if(t>=steps.length)t=0;$("play").textContent="Szünet";
  timer=setInterval(()=>{t++;draw();if(t>=steps.length)stop();},800);};
$("op").oninput=()=>{draw();};
t=steps.length;draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
