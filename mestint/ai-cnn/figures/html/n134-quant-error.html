<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kvantálási hiba és telítés</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--band:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--band:#3a3a3a}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:2px 8px;margin-right:4px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>skála s <input id="s" type="range" min="0.05" max="1" step="0.05" value="0.25"><output></output></label>
 <label>zero point z <input id="z" type="range" min="-20" max="20" step="1" value="0"><output></output></label>
 <label>vizsgált r <input id="r" type="range" min="-40" max="40" step="0.01" value="1.37"><output></output></label>
 <div><div style="font-size:13px">r-tartomány</div>
  <button type="button" data-v="-0.25,1.5">[−0,25; 1,5]</button><button type="button" data-v="30,34">[30; 34]</button><button type="button" data-v="-40,40">[−40; 40]</button></div>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="A kvantálási hiba r függvényében"></svg>
<script>
const $=id=>document.getElementById(id), QMIN=-128, QMAX=127;
let lo=-0.25, hi=1.5;
const fmt=(x,d=4)=>(+x.toFixed(d)).toString().replace(".",",").replace("-","−");
function rint(y){const f=Math.floor(y), d=y-f; if(Math.abs(d-0.5)<1e-12) return (f%2===0)?f:f+1; return Math.round(y);}
function deq(r,s,z){const qu=rint(r/s+z), q=Math.min(QMAX,Math.max(QMIN,qu)); return {qu,q,rh:s*(q-z)};}
function draw(){
  const s=+$("s").value, z=+$("z").value, r=+$("r").value;
  ["s","z","r"].forEach(i=>$(i).nextElementSibling.textContent=fmt(+$(i).value,2));
  const o=deq(r,s,z), sat=o.qu<QMIN||o.qu>QMAX;
  $("info").innerHTML=`q<sub>u</sub> = ${o.qu}, q = ${o.q}, r̂ = ${fmt(o.rh)}, r̂ − r = <b>${fmt(o.rh-r)}</b>`+
   ` (korlát s/2 = ${fmt(s/2)}); ${sat?"<b>telített</b>: a korlát nem érvényes":"telítetlen"}; `+
   `reprezentálható tartomány [${fmt(s*(QMIN-z))}; ${fmt(s*(QMAX-z))}]`;
  const W=640,H=300,L=56,R=12,T=12,B=36, N=1500;
  const pts=[]; let ymin=-s/2, ymax=s/2;
  for(let i=0;i<=N;i++){const x=lo+(hi-lo)*i/N, e=deq(x,s,z).rh-x; pts.push([x,e]); ymin=Math.min(ymin,e); ymax=Math.max(ymax,e);}
  const pad=(ymax-ymin)*0.1||0.1; ymin-=pad; ymax+=pad;
  const X=x=>L+(x-lo)/(hi-lo)*(W-L-R), Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  const fg=getComputedStyle(document.body).color;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  g+=`<rect x="${L}" y="${Y(s/2)}" width="${W-L-R}" height="${Y(-s/2)-Y(s/2)}" fill="var(--band)"/>`;
  [s/2,-s/2].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${fg}" stroke-dasharray="5 4"/>`);
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--mut)" stroke-width="0.5"/>`;
  let d=""; pts.forEach((p,i)=>{const prev=pts[i-1]; const jump=prev&&Math.abs(p[1]-prev[1])>s*0.6; d+=(i===0||jump?"M":"L")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)+" ";});
  g+=`<path d="${d}" fill="none" stroke="${fg}" stroke-width="1.6"/>`;
  [s*(QMAX-z),s*(QMIN-z)].forEach(v=>{if(v>lo&&v<hi) g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${H-B}" stroke="${fg}" stroke-dasharray="2 3"/>`;});
  if(r>=lo&&r<=hi) g+=`<circle cx="${X(r)}" cy="${Y(o.rh-r)}" r="5" fill="var(--bg)" stroke="${fg}" stroke-width="2"/>`;
  for(let k=0;k<=4;k++){const xv=lo+(hi-lo)*k/4, yv=ymin+(ymax-ymin)*k/4;
    g+=`<text x="${X(xv)}" y="${H-B+16}" font-size="12" text-anchor="middle" fill="${fg}">${fmt(xv,2)}</text>`;
    g+=`<text x="${L-6}" y="${Y(yv)+4}" font-size="12" text-anchor="end" fill="${fg}">${fmt(yv,3)}</text>`;}
  g+=`<text x="${(W+L)/2}" y="${H-4}" font-size="13" text-anchor="middle" fill="${fg}">r</text>`;
  g+=`<text x="14" y="${(H-B)/2}" font-size="13" fill="${fg}" transform="rotate(-90 14 ${(H-B)/2})" text-anchor="middle">r̂ − r</text>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="A kvantálási hiba r függvényében" ')+"</svg>";
}
["s","z","r"].forEach(i=>$(i).addEventListener("input",draw));
document.querySelectorAll("button[data-v]").forEach(b=>b.addEventListener("click",()=>{[lo,hi]=b.dataset.v.split(",").map(Number);draw();}));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
