<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Az optimális diszkriminátor két sűrűség között</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e3e3e3;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>p<sub>g</sub> középértéke <input id="mg" type="range" min="-2" max="4" step="0.05" value="1.5"><output></output></label>
 <label>p<sub>g</sub> szórása <input id="sg" type="range" min="0.4" max="2" step="0.05" value="1"><output></output></label>
 <label>vizsgált x <input id="x" type="range" min="-4" max="5.5" step="0.05" value="0.75"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 400" role="img" aria-label="Felül a valós és a generált sűrűség, alul az optimális diszkriminátor"></svg>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
const pdf=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
const X0=50,X1=585,xmin=-4,xmax=5.5, sx=x=>X0+(x-xmin)/(xmax-xmin)*(X1-X0);
const TP={y0:170,y1:12,max:0.85}, BT={y0:360,y1:200,max:1};
const sy=(p,v)=>p.y0-v/p.max*(p.y0-p.y1);
function path(f,p){let d="";for(let i=0;i<=380;i++){const x=xmin+i*(xmax-xmin)/380;d+=(i?"L":"M")+sx(x).toFixed(1)+","+sy(p,Math.min(f(x),p.max*1.05)).toFixed(1)}return d}
function axes(p,ticks,lab,fg){let h=`<line x1="${X0}" x2="${X1}" y1="${p.y0}" y2="${p.y0}" stroke="${fg}"/><line x1="${X0}" x2="${X0}" y1="${p.y0}" y2="${p.y1}" stroke="${fg}"/>`;
  ticks.forEach(t=>h+=`<line x1="${X0}" x2="${X1}" y1="${sy(p,t)}" y2="${sy(p,t)}" stroke="var(--grid)"/><text x="${X0-5}" y="${sy(p,t)+4}" text-anchor="end" font-size="11" fill="${fg}">${fmt(t,1).replace(",0","")}</text>`);
  return h+`<text x="${X0+6}" y="${p.y1+12}" font-size="12" fill="${fg}">${lab}</text>`}
function draw(){
  const mg=+$("mg").value, sg=+$("sg").value, x=+$("x").value;
  $("mg").nextElementSibling.textContent=fmt(mg,2);$("sg").nextElementSibling.textContent=fmt(sg,2);$("x").nextElementSibling.textContent=fmt(x,2);
  const D=t=>{const a=pdf(t,0,1),b=pdf(t,mg,sg);return a+b>0?a/(a+b):0.5};
  $("info").innerHTML=`p<sub>data</sub>(x) = ${fmt(pdf(x,0,1),4)}, p<sub>g</sub>(x) = ${fmt(pdf(x,mg,sg),4)} → D*(x) = <b>${fmt(D(x),4)}</b>`+
    (Math.abs(mg)<1e-9&&Math.abs(sg-1)<1e-9?" (p<sub>g</sub> = p<sub>data</sub>: D* ≡ 1/2)":"");
  const fg=getComputedStyle(document.body).color;
  let h=axes(TP,[0,0.2,0.4,0.6,0.8],"sűrűség",fg)+axes(BT,[0,0.5,1],"D*(x)",fg);
  for(let t=-4;t<=5;t++)h+=`<text x="${sx(t)}" y="${BT.y0+16}" text-anchor="middle" font-size="11" fill="${fg}">${fmt(t,0)}</text>`;
  h+=`<path d="${path(t=>pdf(t,0,1),TP)}" fill="none" stroke="${fg}" stroke-width="2.2"/>`;
  h+=`<path d="${path(t=>pdf(t,mg,sg),TP)}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-dasharray="7 4"/>`;
  h+=`<text x="${X1-4}" y="${TP.y1+12}" text-anchor="end" font-size="12" fill="${fg}">folytonos: p_data = N(0;1) · szaggatott: p_g</text>`;
  h+=`<line x1="${X0}" x2="${X1}" y1="${sy(BT,0.5)}" y2="${sy(BT,0.5)}" stroke="var(--mut)" stroke-dasharray="2 3"/>`;
  h+=`<path d="${path(D,BT)}" fill="none" stroke="${fg}" stroke-width="2.6"/>`;
  h+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${TP.y1}" y2="${BT.y0}" stroke="var(--mut)" stroke-dasharray="1 3"/>`;
  h+=`<circle cx="${sx(x)}" cy="${sy(BT,D(x))}" r="6" fill="var(--acc)" stroke="${fg}"/>`;
  $("v").innerHTML=h;
}
["mg","sg","x"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
