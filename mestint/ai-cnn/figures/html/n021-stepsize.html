<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lépésköz és stabilitás – F(W) = ½(3W−9)² + 0,1W²</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#999;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#888;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(300px,60vw)}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>lépésköz η <input id="eta" type="range" min="0.01" max="0.3" step="0.01" value="0.05"><output id="ev">0,05</output></label>
 <button id="play" type="button">Lejátszás</button><button id="step" type="button">Lépés</button><button id="reset" type="button">Vissza</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A gradienslépések pályája a parabolán"></svg>
<script>
const $=id=>document.getElementById(id), F=W=>0.5*(3*W-9)**2+0.1*W*W, Ws=27/9.2;
const L=50,R=545,T=12,B=270, xmin=-6,xmax=10,ymin=0,ymax=230;
const sx=x=>L+(x-xmin)/(xmax-xmin)*(R-L), sy=y=>B-(Math.min(y,ymax*1.2)-ymin)/(ymax-ymin)*(B-T);
const c=(v,d=3)=>(+v.toFixed(d)).toLocaleString("hu-HU",{maximumFractionDigits:d}).replace("-","−");
let t=0, timer=null;
function traj(eta,n){let W=[0];for(let k=0;k<n;k++){const w=W[W.length-1];W.push(w-eta*(9.2*w-27))}return W}
function draw(){
  const eta=+$("eta").value; $("ev").textContent=c(eta,2);
  const fg=getComputedStyle(document.body).color, W=traj(eta,t);
  let g=`<defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath></defs>`;
  for(let x=-5;x<=10;x+=5) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${B}" stroke="var(--grid)"/><text x="${sx(x)}" y="${B+16}" text-anchor="middle" fill="${fg}" font-size="12">${c(x)}</text>`;
  for(let y=0;y<=200;y+=50) g+=`<line x1="${L}" x2="${R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${y}</text>`;
  let p=[];for(let k=0;k<=160;k++){const x=xmin+(xmax-xmin)*k/160;p.push(sx(x)+","+sy(F(x)))}
  g+=`<g clip-path="url(#cp)"><polyline points="${p.join(" ")}" fill="none" stroke="var(--mut)" stroke-width="2"/>`;
  g+=`<polyline points="${W.map(w=>sx(w)+","+sy(F(w))).join(" ")}" fill="none" stroke="${fg}" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  W.forEach((w,k)=>g+=`<circle cx="${sx(w)}" cy="${sy(F(w))}" r="${k===W.length-1?5:3.5}" fill="${k===W.length-1?fg:'var(--bg)'}" stroke="${fg}" stroke-width="1.4"/>`);
  g+=`<text x="${sx(Ws)}" y="${sy(F(Ws))+4}" text-anchor="middle" fill="${fg}" font-size="16">★</text></g>`;
  g+=`<text x="${R}" y="${T+14}" text-anchor="end" fill="${fg}" font-size="12">2/F″ = 2/9,2 ≈ 0,2174</text>`;
  $("v").innerHTML=g;
  const q=1-eta*9.2, w=W[W.length-1];
  $("info").innerHTML=`t = ${t}: W = ${c(w)}, F(W) = <b>${c(F(w))}</b> · 1 − ηF″ = ${c(q,2)} · `+
    (eta<2/9.2-1e-9?(q<0?"oszcilláló, de konvergens (F csökken)":"monoton konvergens"):eta>2/9.2+1e-9?"<b>divergens</b>: F lépésenként nő":"határeset");
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").onclick=()=>{if(timer){stop();return} if(t>=12)t=0; $("play").textContent="Szünet";
  timer=setInterval(()=>{t++;draw();if(t>=12)stop()},500)};
$("step").onclick=()=>{stop();if(t<12)t++;draw()};
$("reset").onclick=()=>{stop();t=0;draw()};
$("eta").addEventListener("input",()=>{stop();t=0;draw()});
t=8;draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
