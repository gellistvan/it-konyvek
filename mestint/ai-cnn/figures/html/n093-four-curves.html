<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Négy gradienslépés-görbe</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>lépésköz η (log skála) <input id="le" type="range" min="-6" max="0.4" step="0.01" value="-0.30103"><output id="eo"></output></label>
 <label>előre beállított
  <span><button data-e="0.5">0,5</button><button data-e="0.000001">10⁻⁶</button><button data-e="2">2</button><button data-e="2.1">2,1</button></span></label>
 <label>lejátszás (t = 0…20)
  <span><button id="play">Lejátszás</button><button id="step">Lépés</button><button id="reset">Elejére</button></span></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="Veszteség és paraméter a lépések függvényében"></svg>
<script>
const $=id=>document.getElementById(id);
let eta=0.5, tShow=20, timer=null;
const fmt=(x,d)=>x.toFixed(d).replace(".",",").replace("-","−");
function seq(e){const th=[10];for(let t=0;t<20;t++)th.push(th[t]-e*(th[t]-2));return th}
function panel(x0,y0,w,h,ymin,ymax,vals,ylab,ticks,log){
  const X=t=>x0+t/20*w, Y=v=>{let u=log?Math.log10(Math.max(v,1e-11)):v;u=Math.min(ymax,Math.max(ymin,u));return y0+h-(u-ymin)/(ymax-ymin)*h};
  let s=`<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="none" stroke="var(--mut)"/>`;
  ticks.forEach(v=>{const y=Y(log?Math.pow(10,v):v);s+=`<line x1="${x0-4}" x2="${x0}" y1="${y}" y2="${y}" stroke="currentColor"/><text x="${x0-6}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor">${log?"10^"+v:fmt(v,0)}</text>`});
  for(let t=0;t<=20;t+=5)s+=`<text x="${X(t)}" y="${y0+h+14}" text-anchor="middle" font-size="11" fill="currentColor">${t}</text>`;
  s+=`<text x="${x0+w/2}" y="${y0+h+30}" text-anchor="middle" font-size="12" fill="currentColor">lépés t</text>`;
  s+=`<text x="${x0}" y="${y0-8}" font-size="12" fill="currentColor">${ylab}</text>`;
  let p="";for(let t=0;t<=tShow;t++)p+=(t?"L":"M")+X(t).toFixed(1)+" "+Y(vals[t]).toFixed(1);
  s+=`<path d="${p}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;
  for(let t=0;t<=tShow;t++)s+=`<circle cx="${X(t)}" cy="${Y(vals[t])}" r="3.5" fill="var(--acc)"/>`;
  return s}
function draw(){
  $("eo").textContent="η = "+(eta<1e-3?eta.toExponential(1).replace(".",","):fmt(eta,3));
  const th=seq(eta), L=th.map(v=>0.5*(v-2)*(v-2));
  let s=panel(60,24,300,220,-11,4,L,"veszteség L_t (log skála)",[-10,-6,-2,2],true);
  s+=panel(440,24,300,220,-30,34,th,"paraméter θ_t",[-30,-10,2,10,30],false);
  $("v").innerHTML=s;
  const q=Math.abs(1-eta), kind=eta<1e-3?"lapos (alig mozdul)":q<1?"konvergens":Math.abs(q-1)<1e-9?"oszcilláló (|1−η| = 1)":"divergens (|1−η| > 1)";
  $("info").innerHTML=`t = ${tShow}: θ<sub>t</sub> = ${fmt(th[tShow],4)}, L<sub>t</sub> = ${L[tShow]<1e-3&&L[tShow]>0?L[tShow].toExponential(2).replace(".",","):fmt(L[tShow],4)}; |1−η| = ${fmt(q,3)} → <b>${kind}</b>`;
}
$("le").addEventListener("input",()=>{eta=Math.pow(10,+$("le").value);draw()});
document.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>{eta=+b.dataset.e;$("le").value=Math.log10(eta);draw()}));
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").addEventListener("click",()=>{if(timer){stop();return}
  if(tShow>=20)tShow=0;$("play").textContent="Szünet";
  timer=setInterval(()=>{if(tShow>=20){stop();return}tShow++;draw()},350);draw()});
$("step").addEventListener("click",()=>{stop();tShow=tShow>=20?0:tShow+1;draw()});
$("reset").addEventListener("click",()=>{stop();tShow=0;draw()});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
