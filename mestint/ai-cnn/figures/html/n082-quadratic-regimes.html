<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lépésméret-tartományok kvadratikus függvényen</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--grid:#ddd;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--grid:#3a3a3a;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}select{font:inherit}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>lépésméret η <input id="e" type="range" min="0" max="0.7" step="0.01" value="0.1"><output></output></label>
 <label>görbület a <select id="a"><option>1</option><option>2</option><option selected>4</option></select></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="A θ_t sorozat a lépésszám függvényében"></svg>
<p style="font-size:12px;color:var(--mut)">f(θ) = (a/2)·θ², θ<sub>0</sub> = 3, θ<sub>t+1</sub> = (1 − ηa)·θ<sub>t</sub>, t = 0…10. A függőleges tengely ±25-nél le van vágva.</p>
<script>
const $=id=>document.getElementById(id);
const c=v=>(+v.toPrecision(5)).toString().replace(".",",").replace("-","−");
function draw(){
  const e=+$("e").value,a=+$("a").value,q=1-e*a;$("e").nextElementSibling.textContent=e.toFixed(2).replace(".",",");
  const T=10,th=[...Array(T+1)].map((_,t)=>3*q**t);
  let reg;const eps=1e-9;
  if(e<=eps)reg="η = 0: nincs mozgás";
  else if(Math.abs(e-1/a)<eps)reg="η = 1/a: egy lépésben az optimumban";
  else if(e<1/a)reg="0 < η < 1/a: monoton csökkenés";
  else if(Math.abs(e-2/a)<eps)reg="η = 2/a: állandó amplitúdójú oszcilláció";
  else if(e<2/a)reg="1/a < η < 2/a: csillapodó oszcilláció";
  else reg="η > 2/a: előjelváltó divergencia";
  $("info").innerHTML=`szorzó 1 − ηa = <b>${c(q)}</b>; tartomány: <b>${reg}</b>; θ<sub>1..3</sub> = ${th.slice(1,4).map(c).join("; ")}`;
  const W=600,H=300,ml=48,mr=12,mt=10,mb=36,fg=getComputedStyle(document.body).color,lim=25;
  const X=t=>ml+(W-ml-mr)*t/T,Y=v=>mt+(H-mt-mb)*(lim-Math.max(-lim,Math.min(lim,v)))/(2*lim);
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  for(let v=-20;v<=20;v+=10)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="${fg}">${v<0?'−'+(-v):v}</text>`;
  for(let t=0;t<=T;t+=2)g+=`<text x="${X(t)}" y="${H-mb+16}" text-anchor="middle" font-size="12" fill="${fg}">${t}</text>`;
  g+=`<text x="${(W+ml)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="${fg}">lépés t</text>`;
  g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="${fg}" stroke-width="1"/>`;
  g+=`<path d="${th.map((v,t)=>(t?'L':'M')+X(t).toFixed(1)+','+Y(v).toFixed(1)).join('')}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;
  th.forEach((v,t)=>{g+=`<circle cx="${X(t)}" cy="${Y(v)}" r="4" fill="var(--acc)"/>`;});
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="A θ_t sorozat a lépésszám függvényében" ')+"</svg>";
}
["e","a"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
