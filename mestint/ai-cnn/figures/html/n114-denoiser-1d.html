<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bayes-optimális denoiser 1D-ben</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e3e3e3;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>zajszórás σ <input id="sg" type="range" min="0.2" max="2" step="0.05" value="1"><output></output></label>
 <label>megfigyelés y <input id="y" type="range" min="-3" max="4" step="0.05" value="0.7"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 340" role="img" aria-label="A g* denoiser görbéje, az identitás és a konstans 0,5 becslés"></svg>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
const X0=50,X1=585,Y0=300,Y1=12, xmin=-3,xmax=4,ymin=-0.5,ymax=1.5;
const sx=x=>X0+(x-xmin)/(xmax-xmin)*(X1-X0), sy=y=>Y0-(y-ymin)/(ymax-ymin)*(Y0-Y1);
const g=(y,s)=>1/(1+Math.exp(-(y-0.5)/(s*s)));
function path(f){let d="";for(let i=0;i<=350;i++){const x=xmin+i*(xmax-xmin)/350;let v=f(x);
  v=Math.max(ymin-1,Math.min(ymax+1,v));d+=(i?"L":"M")+sx(x).toFixed(1)+","+sy(v).toFixed(1)}return d}
function draw(){
  const s=+$("sg").value, y=+$("y").value;
  $("sg").nextElementSibling.textContent=fmt(s,2);$("y").nextElementSibling.textContent=fmt(y,2);
  const gy=g(y,s);
  $("info").innerHTML=`g*(y) = 1/(1+e<sup>−(y−0,5)/σ²</sup>) = <b>${fmt(gy,4)}</b> &nbsp;(identitás: ${fmt(y,2)}, konstans: 0,5); `+
    `poszterior variancia p(1−p) = ${fmt(gy*(1-gy),4)}`;
  const fg=getComputedStyle(document.body).color;
  let h=`<defs><clipPath id="c"><rect x="${X0}" y="${Y1}" width="${X1-X0}" height="${Y0-Y1}"/></clipPath></defs>`;
  for(let t=-0.5;t<=1.5001;t+=0.5)h+=`<line x1="${X0}" x2="${X1}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)"/><text x="${X0-6}" y="${sy(t)+4}" text-anchor="end" font-size="12" fill="${fg}">${fmt(t,1).replace(",0","")}</text>`;
  for(let t=-3;t<=4;t++)h+=`<text x="${sx(t)}" y="${Y0+16}" text-anchor="middle" font-size="12" fill="${fg}">${fmt(t,0)}</text>`;
  h+=`<line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="${fg}"/><line x1="${X0}" x2="${X0}" y1="${Y0}" y2="${Y1}" stroke="${fg}"/>`;
  h+=`<text x="${(X0+X1)/2}" y="${Y0+34}" text-anchor="middle" font-size="13" fill="${fg}">megfigyelés y</text>`;
  h+=`<g clip-path="url(#c)">`;
  h+=`<path d="${path(x=>x)}" fill="none" stroke="${fg}" stroke-dasharray="2 4" stroke-width="1.6"/>`;
  h+=`<path d="${path(()=>0.5)}" fill="none" stroke="var(--mut)" stroke-dasharray="7 5" stroke-width="1.4"/>`;
  h+=`<path d="${path(x=>g(x,1))}" fill="none" stroke="var(--mut)" stroke-width="1"/>`;
  h+=`<path d="${path(x=>g(x,s))}" fill="none" stroke="${fg}" stroke-width="3"/>`;
  h+=`<line x1="${sx(y)}" x2="${sx(y)}" y1="${Y0}" y2="${Y1}" stroke="var(--mut)" stroke-dasharray="1 3"/>`;
  h+=`<circle cx="${sx(y)}" cy="${sy(gy)}" r="6" fill="var(--acc)" stroke="${fg}"/></g>`;
  h+=`<text x="${X0+8}" y="${Y1+14}" font-size="12" fill="${fg}">vastag: g*(y) a választott σ-val · vékony: σ = 1 · pontozott: identitás · szaggatott: 0,5</text>`;
  $("v").innerHTML=h;
}
["sg","y"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
