<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Likelihood és mintaminőség 1D-ben</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e3e3e3;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
.b{display:flex;gap:6px;align-items:end}button{font:inherit;padding:2px 8px}
</style></head><body>
<div class="ctl">
 <label>modell varianciája σ² (log skála) <input id="lv" type="range" min="-2" max="1" step="any" value="0.60206"><output></output></label>
 <label>modell középértéke μ <input id="mu" type="range" min="-1.5" max="1.5" step="0.05" value="0"><output></output></label>
 <div class="b"><button id="w">széles N(0;4)</button><button id="s">éles N(0;0,01)</button><button id="o">σ² = 1</button></div>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 300" role="img" aria-label="Az állítható Gauss-modell sűrűsége a két adatponttal"></svg>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
const logn=(x,m,v)=>-0.5*Math.log(2*Math.PI*v)-(x-m)**2/(2*v);
const X0=50,X1=585,Y0=265,Y1=12,xmin=-4,xmax=4,ymax=4.5;
const sx=x=>X0+(x-xmin)/(xmax-xmin)*(X1-X0), sy=y=>Y0-Math.min(y,ymax+0.3)/ymax*(Y0-Y1);
function draw(){
  const v=10**(+$("lv").value), mu=+$("mu").value;
  $("lv").nextElementSibling.textContent=fmt(v,v<0.1?3:2);$("mu").nextElementSibling.textContent=fmt(mu,2);
  const ll=(logn(-1,mu,v)+logn(1,mu,v))/2;
  $("info").innerHTML=`átlagos log-sűrűség a ±1 adaton: <b>${fmt(ll,3)}</b> (széles N(0;4): −1,737; éles N(0;0,01): −48,616; a legjobb μ=0 mellett σ²=1: −1,419)`;
  const fg=getComputedStyle(document.body).color;
  let h=`<defs><clipPath id="c"><rect x="${X0}" y="${Y1-4}" width="${X1-X0}" height="${Y0-Y1+4}"/></clipPath></defs>`;
  for(let t=0;t<=4;t++)h+=`<line x1="${X0}" x2="${X1}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)"/><text x="${X0-6}" y="${sy(t)+4}" text-anchor="end" font-size="12" fill="${fg}">${t}</text>`;
  for(let t=-4;t<=4;t++)h+=`<text x="${sx(t)}" y="${Y0+16}" text-anchor="middle" font-size="12" fill="${fg}">${fmt(t,0)}</text>`;
  h+=`<line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="${fg}"/><line x1="${X0}" x2="${X0}" y1="${Y0}" y2="${Y1}" stroke="${fg}"/>`;
  const p=(m,va,dash,w,col)=>{let d="";for(let i=0;i<=600;i++){const x=xmin+i*(xmax-xmin)/600;d+=(i?"L":"M")+sx(x).toFixed(1)+","+sy(Math.exp(logn(x,m,va))).toFixed(1)}
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:""}/>`};
  h+=`<g clip-path="url(#c)">`+p(0,4,"2 4",1,"var(--mut)")+p(0,0.01,"2 4",1,"var(--mut)")+p(mu,v,"",2.6,"var(--acc)")+`</g>`;
  [-1,1].forEach(x=>h+=`<circle cx="${sx(x)}" cy="${Y0}" r="7" fill="${fg}"/>`);
  h+=`<text x="${X1-4}" y="${Y1+14}" text-anchor="end" font-size="12" fill="${fg}">vastag: állított modell · halvány pontozott: a két referenciamodell · pont: adat</text>`;
  $("v").innerHTML=h;
}
["lv","mu"].forEach(i=>$(i).addEventListener("input",draw));
const set=(lv,mu)=>{$("lv").value=lv;$("mu").value=mu;draw()};
$("w").onclick=()=>set(Math.log10(4),0);$("s").onclick=()=>set(-2,0);$("o").onclick=()=>set(0,0);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
