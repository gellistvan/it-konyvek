<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Float16 tartomány és loss-skálázás</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>gradiens g (log₁₀) <input id="g" type="range" min="-9" max="0" step="0.1" value="-6"><output></output></label>
 <label>skála S = 2^k <input id="k" type="range" min="0" max="24" step="1" value="16"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 210" role="img" aria-label="A float16 tartományai és a skálázott gradiens"></svg>
<script>
const $=id=>document.getElementById(id);
const L10=Math.log10, lo=-9, hi=6, X=v=>40+(v-lo)/(hi-lo)*680;
const SUB=Math.pow(2,-24), NORM=Math.pow(2,-14), MAX=65504, UND=Math.pow(2,-25);
const fmt=v=>v===0?"0":(v<1e-3||v>=1e5?v.toExponential(3):v.toPrecision(5)).replace(".",",");
function band(v){return v<UND?"alulcsordulás → 0":v<NORM?"subnormal (pontosságvesztés)":v<=MAX?"normált":"túlcsordulás → inf"}
function draw(){
  const lg=+$("g").value, k=+$("k").value, g=Math.pow(10,lg), S=Math.pow(2,k), gs=g*S;
  $("g").nextElementSibling.textContent="g = "+fmt(g); $("k").nextElementSibling.textContent="S = 2^"+k+" = "+S;
  const B=[[lo,L10(UND),"→ 0","url(#hx)"],[L10(UND),L10(NORM),"subnormal","url(#hd)"],[L10(NORM),L10(MAX),"normált","var(--fill)"],[L10(MAX),hi,"inf","url(#hs)"]];
  let s=`<defs><pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0L8 8M8 0L0 8" stroke="var(--mut)"/></pattern><pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="var(--mut)"/></pattern><pattern id="hs" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8L8 0" stroke="var(--mut)"/></pattern></defs>`;
  B.forEach(b=>{s+=`<rect x="${X(b[0])}" y="40" width="${X(b[1])-X(b[0])}" height="60" fill="${b[3]}" stroke="currentColor"/><text x="${(X(b[0])+X(b[1]))/2}" y="32" text-anchor="middle" font-size="12" fill="currentColor">${b[2]}</text>`});
  for(let e=lo;e<=hi;e++)s+=`<line x1="${X(e)}" x2="${X(e)}" y1="140" y2="146" stroke="currentColor"/><text x="${X(e)}" y="160" text-anchor="middle" font-size="11" fill="currentColor">${e}</text>`;
  s+=`<line x1="${X(lo)}" x2="${X(hi)}" y1="140" y2="140" stroke="currentColor"/><text x="380" y="180" text-anchor="middle" font-size="12" fill="currentColor">log₁₀ |érték|</text>`;
  const cl=v=>Math.min(hi,Math.max(lo,v));
  const x1=X(cl(lg)), x2=X(cl(L10(gs)));
  s+=`<circle cx="${x1}" cy="70" r="7" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>`;
  s+=`<path d="M${x1} 70 Q ${(x1+x2)/2} 10 ${x2} 70" fill="none" stroke="currentColor" stroke-width="1.6"/>`;
  s+=`<circle cx="${x2}" cy="70" r="7" fill="${gs>MAX?'var(--warn)':'currentColor'}"/>`;
  s+=`<text x="${x1}" y="122" text-anchor="middle" font-size="11" fill="currentColor">g</text><text x="${x2}" y="122" text-anchor="middle" font-size="11" fill="currentColor">S·g</text>`;
  $("v").innerHTML=s;
  $("info").innerHTML=`g = ${fmt(g)}: <b>${band(g)}</b>; S·g = ${fmt(gs)}: <b>${band(gs)}</b>`+(gs>MAX?` — <span style="color:var(--warn)">túlcsordulás! A GradScaler ilyenkor kihagyja a lépést és csökkenti S-t.</span>`:"");
}
["g","k"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
