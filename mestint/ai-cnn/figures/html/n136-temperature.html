<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hőmérsékleti softmax</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--c0:#333;--c1:#999;--c2:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--c0:#ddd;--c1:#888;--c2:#1b1b1b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>hőmérséklet T <input id="T" type="range" min="0.25" max="10" step="0.25" value="2"><output></output></label>
 <label>tanár logitja z<sub>t,0</sub> <input id="z0" type="range" min="-3" max="5" step="0.1" value="2.5"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="A tanár és a diák hőmérsékleti eloszlása"></svg>
<script>
const $=id=>document.getElementById(id);
const fmt=(x,d=4)=>x.toFixed(d).replace(".",",").replace("-","−");
function sm(z,T){const m=Math.max(...z.map(v=>v/T)), e=z.map(v=>Math.exp(v/T-m)), s=e.reduce((a,b)=>a+b); return e.map(v=>v/s);}
function draw(){
  const T=+$("T").value, Zt=[+$("z0").value,0,-0.5], Zs=[1.2,0.3,-0.9];
  $("T").nextElementSibling.textContent=fmt(T,2); $("z0").nextElementSibling.textContent=fmt(Zt[0],1);
  const q=sm(Zt,T), p=sm(Zs,T);
  const H=-q.reduce((a,v)=>a+(v>0?v*Math.log(v):0),0);
  const kl=q.reduce((a,v,i)=>a+v*Math.log(v/p[i]),0);
  $("info").innerHTML=`tanár q = (${q.map(v=>fmt(v)).join("; ")}), diák p = (${p.map(v=>fmt(v)).join("; ")})<br>`+
    `H(q) = ${fmt(H,3)} nat (max ln 3 = 1,099); KL(q‖p) = ${fmt(kl,4)}; T² · KL = ${fmt(T*T*kl,4)}`;
  const W=600,Hh=280,L=44,B=40,T0=14, fg=getComputedStyle(document.body).color;
  const Y=v=>T0+(1-v)*(Hh-T0-B);
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}"><defs><pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.2"/></pattern><pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${fg}"/></pattern></defs>`;
  for(let k=0;k<=5;k++){const v=k/5; g+=`<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--mut)" stroke-width="0.4"/><text x="${L-6}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="${fg}">${fmt(v,1)}</text>`;}
  const groups=[["tanár q",q,false],["diák p",p,true]], fills=["var(--c0)","var(--c1)","var(--c2)"], pats=["","url(#h1)","url(#h2)"];
  groups.forEach(([name,vals,dash],gi)=>{const x0=L+30+gi*270;
    vals.forEach((v,c)=>{const x=x0+c*72;
      g+=`<rect x="${x}" y="${Y(v)}" width="60" height="${Y(0)-Y(v)}" fill="${fills[c]}" stroke="${fg}" ${dash?'stroke-dasharray="5 3"':''}/>`;
      if(pats[c]) g+=`<rect x="${x}" y="${Y(v)}" width="60" height="${Y(0)-Y(v)}" fill="${pats[c]}"/>`;
      g+=`<text x="${x+30}" y="${Y(v)-4}" font-size="12" text-anchor="middle" fill="${fg}">${fmt(v,3)}</text>`;
      g+=`<text x="${x+30}" y="${Hh-B+15}" font-size="12" text-anchor="middle" fill="${fg}">c=${c}</text>`;});
    g+=`<text x="${x0+102}" y="${Hh-6}" font-size="13" text-anchor="middle" fill="${fg}">${name} (T = ${fmt(T,2)})</text>`;});
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="A tanár és a diák hőmérsékleti eloszlása" ')+"</svg>";
}
["T","z0"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
