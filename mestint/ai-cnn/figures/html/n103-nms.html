<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMS küszöb</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
svg{max-width:560px;margin:0 auto}</style></head><body>
<div class="ctl">
 <label>IoU-küszöb τ <input id="t" type="range" min="0.3" max="0.7" step="0.01" value="0.5"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 380" role="img" aria-label="Öt doboz NMS után"></svg>
<script>
const $=id=>document.getElementById(id);
const B={A:[[0,0,5,5],.6],B:[[0,0,10,10],.9],C:[[20,20,30,30],.5],D:[[2,2,12,12],.85],E:[[1,1,9,9],.9]};
const names=Object.keys(B), K=11, X=v=>40+v*K, Y=v=>20+v*K;
const area=b=>(b[2]-b[0])*(b[3]-b[1]);
function iou(a,b){const w=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])),h=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1])),i=w*h;return i/(area(a)+area(b)-i)}
function nms(tau){const order=[...names].sort((p,q)=>(B[q][1]-B[p][1])||(area(B[q][0])-area(B[p][0]))||(names.indexOf(p)-names.indexOf(q)));
  const keep=[],dead=new Map();for(const n of order){if(dead.has(n))continue;keep.push(n);
    for(const m of order)if(!dead.has(m)&&!keep.includes(m)){const v=iou(B[n][0],B[m][0]);if(v>=tau)dead.set(m,[n,v])}}return [order,keep,dead]}
const dash={A:"",B:"",C:"",D:"8 4",E:"2 3"}, lw={A:1,B:3,C:1,D:2,E:2};
function draw(){
  const tau=+$("t").value;$("t").nextElementSibling.textContent=tau.toFixed(2).replace(".",",");
  const [order,keep,dead]=nms(tau);let s="";
  for(let v=0;v<=30;v+=5)s+=`<text x="${X(v)}" y="${Y(31.5)+12}" text-anchor="middle" font-size="11" fill="currentColor">${v}</text><text x="${X(0)-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor">${v}</text>`;
  const lab={A:[2,17],B:[15,1],C:[21,18.5],D:[15,14],E:[15,6.5]}, tip={A:[2.5,5],B:[10,0.5],C:[25,20],D:[12,11],E:[9,6]};
  for(const n of names){const [b,sc]=B[n],gone=dead.has(n),col=gone?"var(--mut)":"currentColor";
    s+=`<rect x="${X(b[0])}" y="${Y(b[1])}" width="${(b[2]-b[0])*K}" height="${(b[3]-b[1])*K}" fill="none" stroke="${col}" stroke-width="${lw[n]}" stroke-dasharray="${dash[n]}"/>`;
    if(gone)s+=`<path d="M${X(b[0])} ${Y(b[1])}L${X(b[2])} ${Y(b[3])}M${X(b[0])} ${Y(b[3])}L${X(b[2])} ${Y(b[1])}" stroke="var(--mut)" stroke-width="1.4"/>`;
    s+=`<line x1="${X(tip[n][0])}" y1="${Y(tip[n][1])}" x2="${X(lab[n][0])}" y2="${Y(lab[n][1])}" stroke="${col}" stroke-width="0.7"/><text x="${X(lab[n][0])+2}" y="${Y(lab[n][1])+4}" font-size="12" fill="${col}">${n} (s=${String(sc).replace(".",",")})${gone?" elnyomva":""}</text>`}
  $("v").innerHTML=s;
  const why=[...dead].map(([m,[n,v]])=>`${m}: IoU(${n},${m}) = ${v.toFixed(4).replace(".",",")} ≥ τ`).join("; ");
  $("info").innerHTML=`sorrend: ${order.join(", ")} &nbsp;→&nbsp; <b>keep = {${keep.join(", ")}}</b>`+(why?` &nbsp;(${why})`:" (semmi sem nyomódik el)");
}
$("t").addEventListener("input",draw);draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
