<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NT-Xent – hőmérsékletfüggés</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e3e3e3;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
label{display:flex;flex-direction:column;font-size:13px;max-width:420px}output{font-weight:600}
#info{margin:6px 0}svg{width:100%;height:auto;display:block}
.wrap{display:grid;grid-template-columns:3fr 2fr;gap:10px;align-items:start}
@media (max-width:560px){.wrap{grid-template-columns:1fr}}
</style></head><body>
<label>hőmérséklet τ (log skála) <input id="t" type="range" min="-1.7" max="2" step="0.01" value="0"><output></output></label>
<div id="info" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 420 270" role="img" aria-label="l0 és l1 a tau függvényében, log3 aszimptotával"></svg>
<svg id="m" viewBox="0 0 250 270" role="img" aria-label="Softmax-sorok hőtérképe a nevezőmaszkkal"></svg>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
const S=[[1,.8,0,.6],[.8,1,.6,.96],[0,.6,1,.8],[.6,.96,.8,1]], P=[1,0,3,2];
function rowSoft(i,t){const js=[0,1,2,3].filter(j=>j!==i), mx=Math.max(...js.map(j=>S[i][j]));
  const e=[0,1,2,3].map(j=>j===i?0:Math.exp((S[i][j]-mx)/t)), z=e.reduce((a,b)=>a+b,0);return e.map(v=>v/z)}
const loss=(i,t)=>-Math.log(rowSoft(i,t)[P[i]]);
const X0=44,X1=410,Y0=235,Y1=10, lx0=Math.log10(0.02), lx1=2;
const sx=t=>X0+(Math.log10(t)-lx0)/(lx1-lx0)*(X1-X0), sy=v=>Y0-v/6*(Y0-Y1);
function curve(i){let d="";for(let k=0;k<=300;k++){const t=10**(lx0+k*(lx1-lx0)/300);
  d+=(k?"L":"M")+sx(t).toFixed(1)+","+sy(Math.min(7,loss(i,t))).toFixed(1)}return d}
const C0=curve(0),C1=curve(1);
function draw(){
  const t=10**(+$("t").value); $("t").nextElementSibling.textContent=fmt(t,t<0.1?3:2);
  const l=[0,1,2,3].map(i=>loss(i,t)), L=l.reduce((a,b)=>a+b,0)/4;
  $("info").innerHTML=`τ = ${fmt(t,3)}: ℓ<sub>0</sub> = ℓ<sub>2</sub> = <b>${fmt(l[0],4)}</b>, ℓ<sub>1</sub> = ℓ<sub>3</sub> = <b>${fmt(l[1],4)}</b>, L = <b>${fmt(L,4)}</b> (log 3 = 1,0986)`;
  const fg=getComputedStyle(document.body).color;
  let h=`<defs><clipPath id="c"><rect x="${X0}" y="${Y1}" width="${X1-X0}" height="${Y0-Y1}"/></clipPath></defs>`;
  for(let v=0;v<=6;v++)h+=`<line x1="${X0}" x2="${X1}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--grid)"/><text x="${X0-5}" y="${sy(v)+4}" text-anchor="end" font-size="11" fill="${fg}">${v}</text>`;
  [[0.1,"0,1"],[1,"1"],[10,"10"],[100,"100"]].forEach(([v,s])=>h+=`<text x="${sx(v)}" y="${Y0+15}" text-anchor="middle" font-size="11" fill="${fg}">${s}</text>`);
  h+=`<text x="${(X0+X1)/2}" y="${Y0+31}" text-anchor="middle" font-size="12" fill="${fg}">τ (log skála)</text>`;
  h+=`<line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="${fg}"/><line x1="${X0}" x2="${X0}" y1="${Y0}" y2="${Y1}" stroke="${fg}"/>`;
  h+=`<g clip-path="url(#c)"><line x1="${X0}" x2="${X1}" y1="${sy(Math.log(3))}" y2="${sy(Math.log(3))}" stroke="var(--mut)" stroke-dasharray="2 3"/>`;
  h+=`<path d="${C0}" fill="none" stroke="${fg}" stroke-width="2.2"/><path d="${C1}" fill="none" stroke="${fg}" stroke-width="2.2" stroke-dasharray="7 4"/>`;
  h+=`<line x1="${sx(t)}" x2="${sx(t)}" y1="${Y0}" y2="${Y1}" stroke="var(--mut)" stroke-dasharray="1 3"/>`;
  [0,1].forEach(i=>h+=`<circle cx="${sx(t)}" cy="${sy(Math.min(6.5,l[i]))}" r="5" fill="var(--acc)" stroke="${fg}"/>`);
  h+=`</g><text x="${X1-4}" y="${Y1+14}" text-anchor="end" font-size="11" fill="${fg}">folytonos: ℓ₀ · szaggatott: ℓ₁ · pontozott: log 3</text>`;
  $("v").innerHTML=h;
  // softmax-sorok
  let m=`<text x="125" y="14" text-anchor="middle" font-size="12" fill="${fg}">softmax-sorok (nevezőmaszkkal)</text>`;
  const c=50,x0=25,y0=30;
  for(let i=0;i<4;i++){const p=rowSoft(i,t);for(let j=0;j<4;j++){const x=x0+j*c,y=y0+i*c;
    if(i===j){m+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="var(--bg)" stroke="${fg}"/><line x1="${x}" y1="${y}" x2="${x+c}" y2="${y+c}" stroke="${fg}"/><line x1="${x+c}" y1="${y}" x2="${x}" y2="${y+c}" stroke="${fg}"/>`;continue}
    const g=Math.round(255*(1-0.85*p[j]));
    m+=`<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="rgb(${g},${g},${g})" stroke="${fg}" stroke-width="${j===P[i]?4:1}"/>`+
       `<text x="${x+c/2}" y="${y+c/2+4}" text-anchor="middle" font-size="12" fill="${g<128?'#fff':'#000'}">${fmt(p[j],2)}</text>`}}
  m+=`<text x="125" y="${y0+4*c+18}" text-anchor="middle" font-size="11" fill="${fg}">vastag keret: pozitív pár; ℓᵢ = −log(keretes cella)</text>`;
  $("m").innerHTML=m;
}
$("t").addEventListener("input",draw);draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
