<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Horgony-matching 2×2-es rácson</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
svg{max-width:440px;margin:0 auto}</style></head><body>
<div class="ctl">
 <label>GT x<sub>min</sub> <input id="x" type="range" min="0" max="23" value="10"><output></output></label>
 <label>GT y<sub>min</sub> <input id="y" type="range" min="0" max="23" value="10"><output></output></label>
 <label>GT oldalhossz <input id="s" type="range" min="2" max="24" value="12"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 400 400" role="img" aria-label="Négy cellahorgony és a GT doboz IoU-értékei"></svg>
<script>
const $=id=>document.getElementById(id), K=15, O=20, TP=0.5, TN=0.4;
const fmt=(v,d)=>v.toFixed(d).replace(".",",");
function iou(a,b){const w=Math.max(0,Math.min(a[2],b[2])-Math.max(a[0],b[0])),h=Math.max(0,Math.min(a[3],b[3])-Math.max(a[1],b[1])),i=w*h;
  return i/((a[2]-a[0])*(a[3]-a[1])+(b[2]-b[0])*(b[3]-b[1])-i)}
const set=a=>a.length?"{"+a.join(", ")+"}":"∅";
const names={"0,0":"bal felső","0,1":"jobb felső","1,0":"bal alsó","1,1":"jobb alsó"};
function draw(){
  const v={};["x","y","s"].forEach(i=>{v[i]=+$(i).value;$(i).nextElementSibling.textContent=v[i]});
  const g=[v.x,v.y,Math.min(24,v.x+v.s),Math.min(24,v.y+v.s)];
  let s="",P=[],N=[],I=[];
  for(let r=0;r<2;r++)for(let c=0;c<2;c++){const a=[12*c,12*r,12*c+12,12*r+12],u=iou(a,g),k=names[r+","+c];
    const cls=u>=TP?"P":u<TN?"N":"I";(cls==="P"?P:cls==="N"?N:I).push(k);
    s+=`<rect x="${O+a[0]*K}" y="${O+a[1]*K}" width="${12*K}" height="${12*K}" fill="${cls==="P"?"var(--fill)":"none"}" stroke="currentColor" stroke-dasharray="6 4"/>`;
    s+=`<text x="${O+a[0]*K+90}" y="${O+a[1]*K+(r?150:40)}" text-anchor="middle" font-size="13" fill="currentColor">IoU = ${fmt(u,3)} (${cls})</text>`}
  s+=`<rect x="${O+g[0]*K}" y="${O+g[1]*K}" width="${(g[2]-g[0])*K}" height="${(g[3]-g[1])*K}" fill="none" stroke="currentColor" stroke-width="3"/>`;
  $("v").innerHTML=s;
  $("info").innerHTML=`GT = (${g.join("; ")}); τ<sub>pos</sub> = 0,5, τ<sub>neg</sub> = 0,4 → P = ${set(P)}, N = ${set(N)}, I = ${set(I)}`+
    (P.length===0?" — <b>nincs pozitív horgony</b> (sok detektor ilyenkor a legjobb IoU-jú horgonyt kényszeríti pozitívra).":"");
}
["x","y","s"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
