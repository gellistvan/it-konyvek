<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Határkezelés: valid, zero, circular</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#666;--orig:#e6e6e6;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--orig:#3a3a3a;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
select,button{font:inherit}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>mód <select id="mode"><option value="valid">valid</option><option value="zero" selected>zero</option><option value="circular">circular</option></select></label>
 <label>p (padding) <input id="p" type="range" min="0" max="3" value="1"><output></output></label>
 <label>K (kernelhossz) <input id="K" type="range" min="1" max="5" value="3"><output></output></label>
 <label>ablak j <input id="j" type="range" min="0" max="8" value="0"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Kiterjesztett jel és kernelablak"></svg>
<p style="font-size:12px;color:var(--mut)">Jel: x = (1, 2, 3), összegző kernel w = (1, …, 1). Sraffozott, szaggatott cella: kitöltött (külső) érték; vastag keret: a kiválasztott y<sub>j</sub> ablaka. Valid módban a padding nem használt.</p>
<script>
const $=id=>document.getElementById(id);
const x=[1,2,3], H=x.length;
function ext(u,mode){ if(u>=0&&u<H) return x[u]; if(mode==="zero") return 0; return x[((u%H)+H)%H]; }
function draw(){
  const mode=$("mode").value, K=+$("K").value; let p=+$("p").value;
  ["p","K","j"].forEach(i=>$(i).nextElementSibling.textContent=$(i).value);
  const pe=mode==="valid"?0:p, n=H+2*pe-K+1, hout=Math.max(0,n);
  $("j").max=Math.max(0,hout-1); let j=Math.min(+$("j").value,Math.max(0,hout-1)); $("j").value=j; $("j").nextElementSibling.textContent=j;
  const y=[]; for(let i=0;i<hout;i++){let s=0;for(let r=0;r<K;r++) s+=ext(i-pe+r,mode); y.push(s);}
  $("info").innerHTML=`H<sub>out</sub> = H + 2p − K + 1 = <b>${hout}</b>`+(hout? `; y = (<b>${y.join("; ")}</b>)`:" — <b>nincs érvényes kimenet</b>")+
    (hout? `; y<sub>${j}</sub> = ${[...Array(K)].map((_,r)=>ext(j-pe+r,mode)).join(" + ")} = <b>${y[j]}</b>`:"");
  const C=44, lo=-p, hi=H-1+p, X0=20, W=X0*2+(hi-lo+1)*C, Hh=150, fg=getComputedStyle(document.body).color;
  const cx=u=>X0+(u-lo)*C;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}"><defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1" opacity=".45"/></pattern></defs>`;
  for(let u=lo;u<=hi;u++){const out=u<0||u>=H; if(mode==="valid"&&out) continue;
    g+=`<rect x="${cx(u)}" y="40" width="${C}" height="${C}" fill="${out?'url(#h)':'var(--orig)'}" stroke="${fg}" ${out?'stroke-dasharray="5 3"':''}/>`;
    g+=`<text x="${cx(u)+C/2}" y="${40+C/2+6}" text-anchor="middle" font-size="18" fill="${fg}" font-weight="600">${ext(u,mode)}</text>`;
    g+=`<text x="${cx(u)+C/2}" y="${40+C+16}" text-anchor="middle" font-size="12" fill="var(--mut)">${u<0?'−'+(-u):u}</text>`;}
  if(hout){const a=j-pe; g+=`<rect x="${cx(a)-3}" y="37" width="${K*C+6}" height="${C+6}" fill="none" stroke="var(--acc)" stroke-width="4"/>`;
    g+=`<text x="${cx(a)+K*C/2}" y="28" text-anchor="middle" font-size="13" fill="${fg}">y${String.fromCharCode(8320+j)} ablaka</text>`;}
  if(mode==="circular"&&p>0) g+=`<text x="${W/2}" y="${Hh-12}" text-anchor="middle" font-size="12" fill="${fg}">gyűrű: a bal külső cellák a jobb szél, a jobb külsők a bal szél értékeit ismétlik (u mod ${H})</text>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Kiterjesztett jel és kernelablak" ')+"</svg>";
}
["mode","p","K","j"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
