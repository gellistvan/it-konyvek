<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IoU fél-nyílt és inkluzív konvencióban</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>B₁ kezdete <input id="a0" type="range" min="0" max="7" value="1"><output></output></label>
 <label>B₁ vége <input id="a1" type="range" min="0" max="7" value="4"><output></output></label>
 <label>B₂ kezdete <input id="b0" type="range" min="0" max="7" value="3"><output></output></label>
 <label>B₂ vége <input id="b1" type="range" min="0" max="7" value="6"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="Két doboz pixelrácson fél-nyílt és inkluzív konvencióval"></svg>
<script>
const $=id=>document.getElementById(id), ids=["a0","a1","b0","b1"], N=8, C=36;
function cells(lo,hi,inc){const r=[];for(let i=lo;i<(inc?hi+1:hi);i++)if(i>=0&&i<N)r.push(i);return r}
function sq(lo,hi,inc){const s=new Set();cells(lo,hi,inc).forEach(r=>cells(lo,hi,inc).forEach(c=>s.add(r*N+c)));return s}
function gcd(a,b){return b?gcd(b,a%b):a}
function frac(n,d){if(d===0)return "nem definiált (0/0)";const g=gcd(n,d)||1;return `${n/g}/${d/g} ≈ ${(n/d).toFixed(3).replace(".",",")}`}
function panel(x0,inc,v,title){
  const s1=sq(v.a0,v.a1,inc), s2=sq(v.b0,v.b1,inc);let s=`<text x="${x0}" y="18" font-size="13" font-weight="600" fill="currentColor">${title}</text>`;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const k=r*N+c,i1=s1.has(k),i2=s2.has(k);
    const f=i1&&i2?"currentColor":i1?"url(#p1)":i2?"url(#p2)":"none";
    s+=`<rect x="${x0+c*C}" y="${30+r*C}" width="${C}" height="${C}" fill="${f}" stroke="var(--mut)" stroke-width="0.6"/>`}
  for(let i=0;i<N;i++)s+=`<text x="${x0+i*C+C/2}" y="${30+N*C+14}" text-anchor="middle" font-size="11" fill="currentColor">${i}</text>`;
  let n=0;s1.forEach(k=>{if(s2.has(k))n++});const u=s1.size+s2.size-n;
  s+=`<text x="${x0}" y="${30+N*C+34}" font-size="12" fill="currentColor">A₁=${s1.size}, A₂=${s2.size}, metszet ${n}, IoU = ${frac(n,u)}</text>`;
  return [s,n,u]}
function draw(){
  const v={};ids.forEach(i=>{v[i]=+$(i).value;$(i).nextElementSibling.textContent=v[i]});
  let s=`<defs><pattern id="p1" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 7L7 0" stroke="currentColor"/></pattern><pattern id="p2" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7" stroke="currentColor"/></pattern></defs>`;
  const A=panel(10,false,v,`fél-nyílt [${v.a0};${v.a1})² és [${v.b0};${v.b1})²`), B=panel(400,true,v,`inkluzív [${v.a0};${v.a1}]² és [${v.b0};${v.b1}]²`);
  $("v").innerHTML=s+A[0]+B[0];
  const bad=v.a1<=v.a0||v.b1<=v.b0;
  $("info").innerHTML=(bad?"<b>Figyelem:</b> fél-nyílt konvencióban a vég ≤ kezdet üres dobozt ad. ":"")+
    `IoU fél-nyílt: <b>${frac(A[1],A[2])}</b>; inkluzív: <b>${frac(B[1],B[2])}</b> — /// csak B₁, \\\\\\ csak B₂, teli: metszet.`;
}
ids.forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
