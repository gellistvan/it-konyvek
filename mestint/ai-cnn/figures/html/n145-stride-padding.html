<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stride, padding, dilation 2D-ben</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--pad:#dcdcdc;--hit:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--pad:#444;--hit:#777}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:2px 10px;margin-right:4px}
#info{margin:6px 0}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>H = W (bemenet) <input id="H" type="range" min="3" max="8" value="5"><output></output></label>
 <label>k (kernel) <input id="k" type="range" min="1" max="4" value="3"><output></output></label>
 <label>s (stride) <input id="s" type="range" min="1" max="3" value="2"><output></output></label>
 <label>p (padding) <input id="p" type="range" min="0" max="2" value="1"><output></output></label>
 <label>d (dilation) <input id="d" type="range" min="1" max="3" value="1"><output></output></label>
</div>
<div><button type="button" id="play">Lejátszás</button><button type="button" id="step">Lépés</button><button type="button" id="back">Vissza az elejére</button></div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Paddingelt bemenet, aktuális ablak és kimeneti rács"></svg>
<script>
const $=id=>document.getElementById(id), ids=["H","k","s","p","d"];
let pos=0, timer=null;
function params(){const v={};ids.forEach(i=>{v[i]=+$(i).value;$(i).nextElementSibling.textContent=v[i];});
  v.N=v.H+2*v.p; v.ext=v.d*(v.k-1)+1; const n=v.N-v.ext; v.Ho=n<0?0:Math.floor(n/v.s)+1; return v;}
function draw(){
  const v=params(), {H,k,s,p,d,N,ext,Ho}=v, tot=Ho*Ho;
  if(pos>=tot) pos=0;
  const i=Math.floor(pos/Math.max(Ho,1)), j=pos%Math.max(Ho,1);
  const rows=[...Array(k)].map((_,u)=>i*s+u*d), cols=[...Array(k)].map((_,w)=>j*s+w*d);
  $("info").innerHTML=`H<sub>out</sub> = ⌊(H+2p−d(k−1)−1)/s⌋+1 = ⌊(${H}+${2*p}−${d*(k-1)}−1)/${s}⌋+1 = <b>${Ho}</b>`+
    (tot? `; aktuális kimenet Y[${i},${j}]: a paddingelt tömb ${rows.join(", ")}. sorát és ${cols.join(", ")}. oszlopát olvassa (i·s+u·d)`:" — <b>nincs érvényes ablak</b>");
  const C=30, X0=24, Y0=24, gap=60, W=X0+N*C+gap+Math.max(Ho,1)*C+20, Hh=Y0+Math.max(N,Ho)*C+20, fg=getComputedStyle(document.body).color;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}">`;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const pad=r<p||r>=H+p||c<p||c>=H+p, hit=tot&&rows.includes(r)&&cols.includes(c);
    const val=pad?0:(r-p)*H+(c-p)+1;
    g+=`<rect x="${X0+c*C}" y="${Y0+r*C}" width="${C}" height="${C}" fill="${hit?'var(--hit)':pad?'var(--pad)':'none'}" stroke="${fg}" stroke-width="0.6"/>`;
    g+=`<text x="${X0+c*C+C/2}" y="${Y0+r*C+C/2+4}" text-anchor="middle" font-size="11" fill="${fg}">${val}</text>`;}
  for(let t=0;t<N;t++){g+=`<text x="${X0+t*C+C/2}" y="${Y0-6}" text-anchor="middle" font-size="10" fill="${fg}">${t}</text><text x="${X0-6}" y="${Y0+t*C+C/2+4}" text-anchor="end" font-size="10" fill="${fg}">${t}</text>`;}
  if(tot){g+=`<rect x="${X0+cols[0]*C}" y="${Y0+rows[0]*C}" width="${ext*C}" height="${ext*C}" fill="none" stroke="${fg}" stroke-width="3"/>`;}
  const ox=X0+N*C+gap;
  for(let r=0;r<Ho;r++)for(let c=0;c<Ho;c++){const cur=r===i&&c===j;
    g+=`<rect x="${ox+c*C}" y="${Y0+r*C}" width="${C}" height="${C}" fill="${cur?'var(--hit)':'none'}" stroke="${fg}" stroke-width="${cur?3:0.6}"/>`;}
  g+=`<text x="${X0+N*C/2}" y="${Hh-4}" text-anchor="middle" font-size="12" fill="${fg}">bemenet ${N}×${N} (szürke: padding)</text>`;
  g+=`<text x="${ox+Ho*C/2}" y="${Y0+Ho*C+16}" text-anchor="middle" font-size="12" fill="${fg}">kimenet ${Ho}×${Ho}</text>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Paddingelt bemenet, aktuális ablak és kimeneti rács" ')+"</svg>";
}
function stop(){if(timer){clearInterval(timer);timer=null;$("play").textContent="Lejátszás";}}
function step(){const v=params(); const tot=v.Ho*v.Ho; if(!tot) return; pos++; if(pos>=tot){pos=tot-1; stop();} draw();}
$("step").onclick=()=>{stop();step();};
$("back").onclick=()=>{stop();pos=0;draw();};
$("play").onclick=()=>{if(timer){stop();return;} const v=params(); if(pos>=v.Ho*v.Ho-1) pos=-1; $("play").textContent="Szünet"; step(); timer=setInterval(step,700);};
ids.forEach(i=>$(i).addEventListener("input",()=>{stop();pos=0;draw();}));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
