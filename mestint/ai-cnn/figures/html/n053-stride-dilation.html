<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stride, dilation, padding – mintavételi pozíciók</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#666;--pad:#d9d9d9;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--pad:#444;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>H (bemenet) <input id="H" type="range" min="3" max="12" value="6"><output></output></label>
 <label>k (kernel) <input id="k" type="range" min="1" max="5" value="3"><output></output></label>
 <label>s (stride) <input id="s" type="range" min="1" max="4" value="2"><output></output></label>
 <label>d (dilation) <input id="d" type="range" min="1" max="4" value="1"><output></output></label>
 <label>p (padding) <input id="p" type="range" min="0" max="3" value="1"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Mintavételi pozíciók ablakonként"></svg>
<script>
const $=id=>document.getElementById(id), ids=["H","k","s","d","p"];
function draw(){
  const v={};ids.forEach(i=>{v[i]=+$(i).value;$(i).nextElementSibling.textContent=v[i]});
  const {H,k,s,d,p}=v, ext=d*(k-1)+1, lo=-p, hi=H-1+p, n=H+2*p-ext;
  const hout=n<0?0:Math.floor(n/s)+1;
  $("info").innerHTML=`effektív kiterjedés ℓ = d(k−1)+1 = <b>${ext}</b>; H<sub>out</sub> = ⌊(H+2p−ℓ)/s⌋+1 = <b>${hout}</b>`+
    (hout===0?" — <b>nincs érvényes ablak</b>":"");
  const C=34, X0=70, rows=hout+1, W=X0+(hi-lo+1)*C+190, Hh=60+rows*30;
  const css=getComputedStyle(document.body), fg=css.color;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}">`;
  const cx=x=>X0+(x-lo)*C+C/2;
  for(let x=lo;x<=hi;x++){const pad=x<0||x>H-1;
    g+=`<rect x="${cx(x)-C/2}" y="8" width="${C}" height="${C}" fill="${pad?'var(--pad)':'none'}" stroke="${fg}"/>`+
       `<text x="${cx(x)}" y="30" text-anchor="middle" fill="${fg}" font-size="13">${x<0?'−'+(-x):x}</text>`}
  for(let j=0;j<rows;j++){const y=64+j*30, ok=j<hout, pos=[...Array(k)].map((_,r)=>j*s-p+d*r);
    g+=`<text x="${X0-8}" y="${y+4}" text-anchor="end" fill="${fg}" font-size="13">j=${j}</text>`;
    g+=`<line x1="${cx(pos[0])}" x2="${cx(pos[k-1])}" y1="${y}" y2="${y}" stroke="${fg}" ${ok?'':'stroke-dasharray="5 4"'}/>`;
    for(let x=pos[0];x<=pos[k-1];x++){const hit=pos.includes(x);
      if(hit||ok) g+=`<circle cx="${cx(x)}" cy="${y}" r="${hit?7:5}" fill="${hit&&ok?fg:'var(--bg)'}" stroke="${hit?fg:'var(--mut)'}" stroke-width="1.5"/>`}
    if(!ok) g+=`<text x="${cx(pos[k-1])+14}" y="${y+4}" fill="${fg}" font-size="13">érvénytelen: ${pos[k-1]} &gt; ${hi}</text>`;
  }
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Mintavételi pozíciók ablakonként" ')+"</svg>";
}
ids.forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
