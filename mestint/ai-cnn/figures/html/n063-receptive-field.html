<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recepciós mező rétegenként</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
table{border-collapse:collapse;margin-bottom:6px}td,th{padding:2px 8px;text-align:center;font-size:13px}
input[type=number]{width:3.4em;font:inherit}button{font:inherit;padding:2px 8px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div><button id="pa">(a) dilation 1–2–4</button> <button id="pb">(b) kézi példa</button></div>
<table aria-label="Rétegparaméterek"><thead><tr><th>réteg</th><th>k</th><th>d</th><th>s</th><th>F<sub>l</sub></th><th>J<sub>l</sub></th></tr></thead><tbody id="tb"></tbody></table>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Rétegenkénti mintavételi pozíciók"></svg>
<script>
const $=id=>document.getElementById(id);
let spec=[[3,1,1],[3,2,1],[3,4,1]];
function table(){ $("tb").innerHTML=spec.map((r,l)=>`<tr><td>${l+1}.</td>`+r.map((v,c)=>`<td><input type="number" min="${c===0?1:1}" max="${c===0?7:c===1?6:3}" value="${v}" data-l="${l}" data-c="${c}" aria-label="${l+1}. réteg ${'kds'[c]}"></td>`).join("")+`<td id="F${l}"></td><td id="J${l}"></td></tr>`).join("");
  document.querySelectorAll("#tb input").forEach(e=>e.addEventListener("input",()=>{const v=Math.max(+e.min,Math.min(+e.max,+e.value||1));spec[+e.dataset.l][+e.dataset.c]=v;draw();}));}
function draw(){
  const L=spec.length, FJ=[[1,1]];
  spec.forEach(([k,d,s])=>{const [F,J]=FJ[FJ.length-1];FJ.push([F+(k-1)*d*J,J*s]);});
  spec.forEach((_,l)=>{$("F"+l).textContent=FJ[l+1][0];$("J"+l).textContent=FJ[l+1][1];});
  const sets={};sets[L]=[0];
  for(let l=L;l>0;l--){const [k,d,s]=spec[l-1],S=new Set();sets[l].forEach(q=>{for(let r=0;r<k;r++)S.add(q*s+d*r);});sets[l-1]=[...S].sort((a,b)=>a-b);}
  const F=FJ[L][0];
  $("info").innerHTML=`F<sub>l</sub> = F<sub>l−1</sub> + (k<sub>l</sub>−1)·d<sub>l</sub>·J<sub>l−1</sub>, J<sub>l</sub> = J<sub>l−1</sub>·s<sub>l</sub> → a kimeneti neuron mezeje <b>F = ${F}</b> bemeneti pozíció, a kimeneti rács lépésköze <b>J = ${FJ[L][1]}</b>; ténylegesen használt bemeneti pozíció: ${sets[0].length}.`;
  const fg=getComputedStyle(document.body).color, X0=20, W=Math.max(520,X0*2+F*26), dx=(W-2*X0)/Math.max(F,1), Hh=70+L*70;
  const px=(l,q)=>X0+(q*FJ[l][1]+(FJ[l][0]-1)/2)*dx+dx/2, py=l=>40+(L-l)*0+l*70;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${Hh}">`;
  g+=`<line x1="${X0}" x2="${X0+F*dx}" y1="22" y2="22" stroke="${fg}"/><text x="${X0+F*dx/2}" y="16" text-anchor="middle" font-size="12" fill="${fg}">F = ${F}</text>`;
  for(let l=L;l>0;l--){const [k,d,s]=spec[l-1];sets[l].forEach(q=>{for(let r=0;r<k;r++){const c=q*s+d*r;
    g+=`<line x1="${px(l,q)}" y1="${py(l)}" x2="${px(l-1,c)}" y2="${py(l-1)}" stroke="var(--mut)" ${l%2?'':'stroke-dasharray="4 3"'}/>`;}});}
  for(let l=0;l<=L;l++){sets[l].forEach(q=>{const x=px(l,q),y=py(l);
    g+= l===0?`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${fg}"/>`:`<circle cx="${x}" cy="${y}" r="6" fill="${l===L?fg:'var(--bg)'}" stroke="${fg}" stroke-width="1.5"/>`;});
    g+=`<text x="${W-4}" y="${py(l)-10}" text-anchor="end" font-size="11" fill="var(--mut)">${l===0?'bemenet':l+'. réteg'}</text>`;}
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Rétegenkénti mintavételi pozíciók" ')+"</svg>";
}
$("pa").onclick=()=>{spec=[[3,1,1],[3,2,1],[3,4,1]];table();draw();};
$("pb").onclick=()=>{spec=[[3,1,1],[2,1,2],[3,2,1]];table();draw();};
table();draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
