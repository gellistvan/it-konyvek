<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anomáliapontszámok és küszöb</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--acc:#c55a11}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#777;--acc:#f0a060}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
label{display:block}input[type=range]{width:100%}#out{margin:6px 0;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}button{font:inherit;margin-right:6px}
</style></head><body>
<label>küszöb τ (log skálán): <b id="tv"></b><input id="t" type="range" min="0" max="1000" step="1"></label>
<div><button id="reset">a validáción választott τ</button><button id="best">hibátlan szétválasztás a teszten</button></div>
<div id="out" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 300" role="img" aria-label="Pontszámok négy csoportban, függőleges küszöbvonallal"></svg>
<script>
const D={"s_va_n": [0.011567, 0.011995, 0.017822, 0.018418, 0.011317, 0.010517, 0.015242, 0.014412, 0.011631, 0.01194, 0.015216, 0.014513, 0.01919, 0.018534, 0.014391, 0.015769, 0.011216, 0.011186, 0.01026, 0.011566, 0.009341, 0.009811, 0.011662, 0.012735, 0.009526, 0.009868, 0.01274, 0.012556, 0.016168, 0.016229, 0.015981, 0.015171, 0.020183, 0.019891, 0.016311, 0.014722, 0.011581, 0.012235, 0.018675, 0.019898, 0.01003, 0.010119, 0.019905, 0.019853, 0.015653, 0.015906, 0.011779, 0.01228, 0.014319, 0.015423, 0.02107, 0.021819, 0.017711, 0.018002, 0.012281, 0.012749, 0.010381, 0.010731, 0.016662, 0.017175], "s_va_a": [0.082049, 0.089626, 0.085434, 0.083623, 0.072057, 0.084762, 0.072524, 0.078692, 0.074432, 0.078768, 0.070429, 0.07599, 0.087907, 0.089576, 0.071463, 0.084804, 0.070347, 0.078434, 0.080824, 0.070638, 0.067643, 0.065596, 0.076602, 0.07238, 0.071124, 0.084217, 0.078887, 0.083802, 0.081703, 0.087712, 0.088017, 0.076882, 0.092906, 0.087486, 0.081409, 0.08352, 0.071532, 0.081106, 0.08706, 0.089461, 0.074496, 0.070198, 0.087969, 0.092392, 0.080251, 0.088778, 0.077314, 0.077871, 0.066626, 0.077522, 0.090614, 0.086682, 0.092014, 0.080915, 0.067794, 0.080347, 0.069362, 0.078093, 0.076886, 0.078676], "s_te": [0.017948, 0.018041, 0.01509, 0.016226, 0.011793, 0.01177, 0.011123, 0.011039, 0.010771, 0.01114, 0.012123, 0.012104, 0.016314, 0.015238, 0.012167, 0.01316, 0.018219, 0.017472, 0.013967, 0.014428, 0.019872, 0.020474, 0.012531, 0.012758, 0.016457, 0.016231, 0.016877, 0.016237, 0.014059, 0.014544, 0.010648, 0.011672, 0.009488, 0.010131, 0.016978, 0.016367, 0.017844, 0.018752, 0.010022, 0.008823, 0.010238, 0.011074, 0.017991, 0.01919, 0.011162, 0.011165, 0.019764, 0.020542, 0.009302, 0.010348, 0.011579, 0.011146, 0.018801, 0.019641, 0.010203, 0.009614, 0.015761, 0.01664, 0.011844, 0.011404], "s_co": [0.048136, 0.042453, 0.045719, 0.047174, 0.040742, 0.043477, 0.033258, 0.039849, 0.035622, 0.041153, 0.038528, 0.042134, 0.049304, 0.049056, 0.046026, 0.04284, 0.050165, 0.051323, 0.043365, 0.049725, 0.048522, 0.054095, 0.037932, 0.03639, 0.047639, 0.04312, 0.043906, 0.047518, 0.04394, 0.045049, 0.03908, 0.040765, 0.038668, 0.036742, 0.045725, 0.044266, 0.046117, 0.053587, 0.039095, 0.044192, 0.041558, 0.040342, 0.05305, 0.052526, 0.041322, 0.044798, 0.051136, 0.052488, 0.042085, 0.038934, 0.039445, 0.043933, 0.04925, 0.052179, 0.041632, 0.038644, 0.04348, 0.045927, 0.043562, 0.041472]}, TAU0=0.043708;
const all=[].concat(D.s_va_n,D.s_va_a,D.s_te,D.s_co), lo=Math.log10(Math.min(...all))-0.05, hi=Math.log10(Math.max(...all))+0.05;
const X0=170,X1=700, xs=v=>X0+(Math.log10(v)-lo)/(hi-lo)*(X1-X0), fromS=p=>10**(lo+p/1000*(hi-lo)), toS=v=>Math.round((Math.log10(v)-lo)/(hi-lo)*1000);
const G=[["validációs normál",D.s_va_n,0],["validációs szint. anomália",D.s_va_a,1],["teszt tiszta",D.s_te,0],["teszt korrupt",D.s_co,1]];
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647-0.5;
const J=G.map(g=>g[1].map(()=>rnd()*22));
const fmt=x=>x.toFixed(4).replace(".",",");
function draw(){
  const tau=fromS(+t.value), fg=getComputedStyle(document.body).color;
  let s="";
  // ticks
  for(let e=Math.ceil(lo*2)/2;e<=hi;e+=0.5){const x=xs(10**e);s+=`<line x1="${x}" x2="${x}" y1="20" y2="262" stroke="var(--mut)" stroke-opacity=".3"/><text x="${x}" y="280" font-size="12" text-anchor="middle" fill="${fg}">${(10**e).toPrecision(2).replace(".",",")}</text>`}
  D.s_te.forEach((a,i)=>{s+=`<line x1="${xs(a)}" y1="${170+J[2][i]}" x2="${xs(D.s_co[i])}" y2="${230+J[3][i]}" stroke="var(--mut)" stroke-width=".5"/>`});
  G.forEach((g,k)=>{const y=50+k*60;
    s+=`<text x="${X0-10}" y="${y+4}" text-anchor="end" font-size="13" fill="${fg}">${g[0]}</text>`;
    g[1].forEach((v,i)=>{const x=xs(v),yy=y+J[k][i],above=v>tau;
      s+=g[2]?`<path d="M${x},${yy-5}L${x+5},${yy+4}L${x-5},${yy+4}Z" fill="${above?fg:'var(--bg)'}" stroke="${fg}"/>`
             :`<circle cx="${x}" cy="${yy}" r="4" fill="${above?'var(--acc)':'var(--bg)'}" stroke="${fg}"/>`})});
  const xt=xs(tau);s+=`<line x1="${xt}" x2="${xt}" y1="14" y2="262" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 4"/>`;
  s+=`<text x="${X0}" y="296" font-size="12" fill="${fg}">pontszám s (MSE, log skála) · τ feletti jelölő kitöltött = „anomália” döntés</text>`;
  v.innerHTML=s;
  const c=(a,f)=>a.filter(f).length, TN=c(D.s_te,x=>x<=tau),FP=60-TN,FN=c(D.s_co,x=>x<=tau),TP=60-FN;
  const vfp=c(D.s_va_n,x=>x>tau)/60, vfn=c(D.s_va_a,x=>x<=tau)/60;
  tv.textContent=fmt(tau);
  out.innerHTML=`teszt: TN=${TN}, FP=${FP}, FN=<b>${FN}</b>, TP=${TP} · validációs költség 0,5·3·FN-arány+0,5·1·FP-arány = ${(1.5*vfn+0.5*vfp).toFixed(3).replace(".",",")} · az AUC (1,0) nem függ τ-tól`;
}
const t=document.getElementById("t"),v=document.getElementById("v"),out=document.getElementById("out"),tv=document.getElementById("tv");
t.value=toS(TAU0);t.addEventListener("input",draw);
document.getElementById("reset").onclick=()=>{t.value=toS(TAU0);draw()};
document.getElementById("best").onclick=()=>{const m=(Math.max(...D.s_te)+Math.min(...D.s_co))/2;t.value=toS(m);draw()};
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
