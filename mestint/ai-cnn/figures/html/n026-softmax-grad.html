<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logit, softmax és logitgradiens</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--bar:#bbb;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--bar:#666;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:6px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:13px}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>z₀ <input id="z0" type="range" min="-4" max="4" step="0.1" value="2"><output></output></label>
 <label>z₁ <input id="z1" type="range" min="-4" max="4" step="0.1" value="-1"><output></output></label>
 <label>z₂ <input id="z2" type="range" min="-4" max="4" step="0.1" value="0.5"><output></output></label>
</div>
<div class="row"><label style="flex-direction:row;gap:6px">célosztály y
 <select id="y"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label>
 <button id="reset" type="button">Kézi példa (2; −1; 0,5)</button></div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 250" role="img" aria-label="Logit, softmax és gradiens oszlopdiagram"></svg>
<script>
const $=id=>document.getElementById(id), ids=["z0","z1","z2"];
const c=(v,d=4)=>v.toFixed(d).replace(".",",").replace("-","−");
function panel(x0,title,vals,lo,hi,y,fg){
  const W=200,T=30,B=210, sy=v=>B-(v-lo)/(hi-lo)*(B-T);
  let g=`<text x="${x0+W/2}" y="16" text-anchor="middle" fill="${fg}" font-size="13">${title}</text>`;
  g+=`<line x1="${x0}" x2="${x0+W}" y1="${sy(0)}" y2="${sy(0)}" stroke="${fg}"/>`;
  vals.forEach((v,k)=>{const cx=x0+35+k*65, top=Math.min(sy(v),sy(0)), h=Math.abs(sy(v)-sy(0)), tg=k===y;
    g+=`<rect x="${cx-20}" y="${top}" width="40" height="${Math.max(h,0.5)}" fill="${tg?'url(#hat)':'var(--bar)'}" stroke="${fg}"/>`;
    g+=`<text x="${cx}" y="${v>=0?sy(v)-5:sy(v)+14}" text-anchor="middle" fill="${fg}" font-size="12">${c(v,Math.abs(v)<10?4:2)}</text>`;
    g+=`<text x="${cx}" y="${B+30}" text-anchor="middle" fill="${fg}" font-size="12">${k}${tg?" (cél)":""}</text>`});
  return g}
function draw(){
  const z=ids.map(i=>+$(i).value); ids.forEach((i,k)=>$(i).nextElementSibling.textContent=c(z[k],1));
  const y=+$("y").value, m=Math.max(...z), e=z.map(v=>Math.exp(v-m)), S=e.reduce((a,b)=>a+b), p=e.map(v=>v/S);
  const g=p.map((v,k)=>v-(k===y?1:0)), fg=getComputedStyle(document.body).color;
  let s=`<defs><pattern id="hat" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--bg)"/><line x1="0" y1="0" x2="0" y2="8" stroke="${fg}" stroke-width="2"/></pattern></defs>`;
  s+=panel(10,"(a) logit z",z,-4.5,4.5,y,fg)+panel(230,"(b) softmax p",p,0,1.15,y,fg)+panel(450,"(c) gradiens p − e_y",g,-1.1,1.1,y,fg);
  $("v").innerHTML=s;
  $("info").innerHTML=`L = −log p<sub>y</sub> = <b>${c(-Math.log(p[y]))}</b> · Σ(p<sub>j</sub> − δ<sub>jy</sub>) = ${c(Math.abs(g.reduce((a,b)=>a+b))<5e-13?0:g.reduce((a,b)=>a+b))} · a célosztály gradiense mindig ≤ 0, a többié ≥ 0`;
}
ids.forEach(i=>$(i).addEventListener("input",draw)); $("y").addEventListener("change",draw);
$("reset").onclick=()=>{$("z0").value=2;$("z1").value=-1;$("z2").value=0.5;$("y").value=2;draw()};
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
