<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szelő és érintő – q(x) = x², a = 3</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#999;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#888;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(320px,60vw)}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>lépésköz h <input id="h" type="range" min="-2" max="2" step="0.05" value="1"><output id="hv">1</output></label>
 <button id="play" type="button">Lejátszás (h → 0)</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="A parabola, az érintő és a h-hoz tartozó szelő"></svg>
<script>
const $=id=>document.getElementById(id), f=x=>x*x, a=3;
const X0=50,X1=540,Y0=310,Y1=10, xmin=0.5,xmax=6,ymin=0,ymax=32;
const sx=x=>X0+(x-xmin)/(xmax-xmin)*(X1-X0), sy=y=>Y0-(y-ymin)/(ymax-ymin)*(Y0-Y1);
const c=v=>(Math.round(v*1000)/1000).toString().replace(".",",").replace("-","−");
function line(m,ls,w,col){return `<line x1="${sx(xmin)}" y1="${sy(f(a)+m*(xmin-a))}" x2="${sx(xmax)}" y2="${sy(f(a)+m*(xmax-a))}" stroke="${col}" stroke-width="${w}" ${ls}/>`}
function draw(){
  let h=+$("h").value; $("hv").textContent=c(h);
  const fg=getComputedStyle(document.body).color;
  let g=`<defs><clipPath id="cp"><rect x="${X0}" y="${Y1}" width="${X1-X0}" height="${Y0-Y1}"/></clipPath></defs>`;
  for(let x=1;x<=6;x++) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${Y1}" y2="${Y0}" stroke="var(--grid)"/><text x="${sx(x)}" y="${Y0+18}" text-anchor="middle" fill="${fg}" font-size="12">${x}</text>`;
  for(let y=0;y<=30;y+=5) g+=`<line x1="${X0}" x2="${X1}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${X0-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${y}</text>`;
  let pts=[];for(let k=0;k<=120;k++){const x=xmin+(xmax-xmin)*k/120;pts.push(sx(x)+","+sy(f(x)))}
  g+=`<g clip-path="url(#cp)"><polyline points="${pts.join(" ")}" fill="none" stroke="${fg}" stroke-width="2"/>`;
  g+=line(6,"",5,"var(--mut)");
  if(Math.abs(h)>1e-9) g+=line(6+h,'stroke-dasharray="7 5"',1.6,fg);
  g+=`</g><circle cx="${sx(a)}" cy="${sy(9)}" r="5" fill="${fg}"/>`;
  if(Math.abs(h)>1e-9) g+=`<circle cx="${sx(a+h)}" cy="${sy(f(a+h))}" r="5" fill="var(--bg)" stroke="${fg}" stroke-width="1.5"/>`;
  g+=`<text x="${X0+8}" y="${Y1+16}" fill="${fg}" font-size="12">vastag szürke: érintő (meredekség 6) · szaggatott: szelő</text>`;
  $("v").innerHTML=g;
  $("info").innerHTML=Math.abs(h)<1e-9?"h = 0: a differenciahányados nincs értelmezve; a határérték az érintő meredeksége, <b>6</b>.":
    `D<sub>h</sub>q(3) = ((3+h)² − 9)/h = 6 + h = <b>${c(6+h)}</b>; eltérés az érintőtől: ${c(h)}`;
}
let timer=null;
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás (h → 0)"}
$("play").onclick=()=>{if(timer){stop();return}
  if(Math.abs(+$("h").value)<0.05) $("h").value=2;
  $("play").textContent="Szünet";
  timer=setInterval(()=>{let h=+$("h").value; h=h>0?Math.max(0.05,h*0.93):Math.min(-0.05,h*0.93);
    $("h").value=h; draw(); if(Math.abs(h)<=0.05) stop()},80)};
$("h").addEventListener("input",()=>{stop();draw()});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
