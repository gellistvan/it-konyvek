<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hőmérséklet és log loss</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--fill:#e2e2e2;--acc:#1f4e79;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--fill:#3a3a3a;--acc:#8fb8e8;--warn:#ff7b7b}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
button{font:inherit;padding:3px 10px;margin-right:6px}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>hőmérséklet T <input id="T" type="range" min="0.3" max="3" step="0.005" value="1"><output></output></label>
 <label>rácspontok <span><button data-t="0.5">0,5</button><button data-t="0.75">0,75</button><button data-t="1">1</button><button data-t="2">2</button><button data-t="0.705">min</button></span></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 320" role="img" aria-label="Validációs log loss a hőmérséklet függvényében"></svg>
<script>
const $=id=>document.getElementById(id);
const Z=[[2.0,0.5,-0.5],[0.2,1.8,-0.3],[2.5,1.8,0.2]], y=[0,1,1];
const fmt=(v,d)=>v.toFixed(d).replace(".",",");
function probs(z,T){const u=z.map(v=>v/T),m=Math.max(...u),e=u.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b);return e.map(v=>v/s)}
function loss(T){return -Z.reduce((a,z,i)=>a+Math.log(probs(z,T)[y[i]]),0)/3}
const X=T=>60+(T-0.3)/2.7*620, Yv=L=>270-(L-0.5)/0.38*240;
let curve="";for(let i=0;i<=540;i++){const T=0.3+i*0.005;curve+=(i?"L":"M")+X(T).toFixed(1)+" "+Yv(loss(T)).toFixed(1)}
function draw(){
  const T=+$("T").value;$("T").nextElementSibling.textContent=fmt(T,3);
  let s=`<rect x="60" y="30" width="620" height="240" fill="none" stroke="var(--mut)"/>`;
  [0.5,1,1.5,2,2.5,3].forEach(t=>s+=`<text x="${X(t)}" y="288" text-anchor="middle" font-size="11" fill="currentColor">${fmt(t,1)}</text>`);
  [0.55,0.65,0.75,0.85].forEach(l=>s+=`<text x="54" y="${Yv(l)+4}" text-anchor="end" font-size="11" fill="currentColor">${fmt(l,2)}</text>`);
  s+=`<text x="370" y="308" text-anchor="middle" font-size="12" fill="currentColor">hőmérséklet T</text><text x="60" y="22" font-size="12" fill="currentColor">validációs log loss</text>`;
  s+=`<path d="${curve}" fill="none" stroke="currentColor" stroke-width="2"/>`;
  [0.5,0.75,1,1.25,1.5,2].forEach(t=>s+=`<circle cx="${X(t)}" cy="${Yv(loss(t))}" r="4" fill="var(--acc)"/>`);
  s+=`<line x1="${X(T)}" x2="${X(T)}" y1="30" y2="270" stroke="var(--mut)" stroke-dasharray="4 3"/><circle cx="${X(T)}" cy="${Yv(loss(T))}" r="7" fill="var(--bg)" stroke="currentColor" stroke-width="2"/>`;
  $("v").innerHTML=s;
  const p=probs(Z[2],T);
  $("info").innerHTML=`T = ${fmt(T,3)}: L<sub>val</sub>(T) = <b>${fmt(loss(T),6)}</b>; a 3. minta (cél 1) valószínűségei p = [${p.map(v=>fmt(v,3)).join("; ")}], vesztesége ${fmt(-Math.log(p[1]),3)}. Az argmax (0) nem változik.`;
}
$("T").addEventListener("input",draw);
document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{$("T").value=b.dataset.t;draw()}));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
