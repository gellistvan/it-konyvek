<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Csúszó ablak – cross-correlation és konvolúció</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--hi:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--hi:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px;font-size:13px}
label{display:flex;gap:6px;align-items:center}button{font:inherit;padding:3px 10px}
#info{margin:4px 0 6px;min-height:2.8em;font-variant-numeric:tabular-nums}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>sor i <input id="i" type="range" min="0" max="1" step="1" value="0"><output>0</output></label>
 <label>oszlop j <input id="j" type="range" min="0" max="1" step="1" value="0"><output>0</output></label>
 <label><input type="radio" name="op" value="corr" checked> cross-correlation K⋆X</label>
 <label><input type="radio" name="op" value="conv"> konvolúció K∗X = R(K)⋆X</label>
 <button id="next" type="button">Következő ablak</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 210" role="img" aria-label="A bemenet, a kernel és a kimenet rácsa a kijelölt ablakkal"></svg>
<script>
const X=[[0.2,0.5,0.1],[0.8,0.3,0.6],[0.4,0.9,0.7]], K=[[1,0],[-2,3]], RK=[[3,-2],[0,1]];
const $=id=>document.getElementById(id), c=v=>(Math.round(v*100)/100).toString().replace(".",",").replace("-","−");
const C=46;
function grid(x0,y0,M,hl,fg,title){let g=`<text x="${x0+M[0].length*C/2}" y="${y0-10}" text-anchor="middle" fill="${fg}" font-size="13">${title}</text>`;
  M.forEach((r,a)=>r.forEach((v,b)=>{const on=hl&&hl(a,b);
    g+=`<rect x="${x0+b*C}" y="${y0+a*C}" width="${C}" height="${C}" fill="${on?'var(--bg)':'var(--bg)'}" stroke="${on?'var(--hi)':fg}" stroke-width="${on?3.5:1}"/>`+
       `<text x="${x0+b*C+C/2}" y="${y0+a*C+C/2+5}" text-anchor="middle" fill="${fg}" font-size="14" font-weight="${on?700:400}">${c(v)}</text>`}));return g}
function out(Kk){return [0,1].map(i=>[0,1].map(j=>Kk[0][0]*X[i][j]+Kk[0][1]*X[i][j+1]+Kk[1][0]*X[i+1][j]+Kk[1][1]*X[i+1][j+1]))}
function draw(){
  const i=+$("i").value, j=+$("j").value, conv=document.querySelector('input[name=op]:checked').value==="conv";
  $("i").nextElementSibling.textContent=i; $("j").nextElementSibling.textContent=j;
  const Kk=conv?RK:K, Y=out(Kk), fg=getComputedStyle(document.body).color;
  let g=grid(10,40,X,(a,b)=>a>=i&&a<i+2&&b>=j&&b<j+2,fg,"X (3×3)");
  g+=grid(200,63,Kk,()=>true,fg,conv?"R(K) (180°-kal forgatott K)":"K");
  g+=grid(420,63,Y,(a,b)=>a===i&&b===j,fg,conv?"K∗X":"K⋆X");
  g+=`<text x="170" y="112" text-anchor="middle" fill="${fg}" font-size="20">⊙</text><text x="370" y="112" text-anchor="middle" fill="${fg}" font-size="20">→</text>`;
  $("v").innerHTML=g;
  const terms=[[0,0],[0,1],[1,0],[1,1]].map(([a,b])=>`${c(Kk[a][b])}·${c(X[i+a][j+b])}`);
  $("info").innerHTML=`${conv?"K∗X":"K⋆X"}[${i},${j}] = ${terms.join(" + ").replace(/\+ −/g,"− ")} = <b>${c(Y[i][j])}</b>`;
}
["i","j"].forEach(id=>$(id).addEventListener("input",draw));
document.querySelectorAll('input[name=op]').forEach(r=>r.addEventListener("change",draw));
$("next").onclick=()=>{let k=(+$("i").value*2+ +$("j").value+1)%4;$("i").value=Math.floor(k/2);$("j").value=k%2;draw()};
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
