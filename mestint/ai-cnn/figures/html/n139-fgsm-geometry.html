<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FGSM és l2-optimum geometriája</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;max-width:520px;height:auto;display:block;margin:auto}
</style></head><body>
<div class="ctl">
 <label>g iránya (fok) <input id="a" type="range" min="-180" max="180" step="1" value="-34"><output></output></label>
 <label>|g|<sub>2</sub> <input id="n" type="range" min="0.5" max="5" step="0.05" value="3.6"><output></output></label>
 <label>ε (budget) <input id="e" type="range" min="0.2" max="1" step="0.05" value="1"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Négyzet és kör alakú budget, gradiens és optimumok"></svg>
<script>
const $=id=>document.getElementById(id);
let init=true;
const fmt=(x,d=3)=>x.toFixed(d).replace(".",",").replace("-","−");
function draw(){
  const ang=+$("a").value*Math.PI/180, n=+$("n").value, eps=+$("e").value;
  $("a").nextElementSibling.textContent=$("a").value+"°"; $("n").nextElementSibling.textContent=fmt(n,2); $("e").nextElementSibling.textContent=fmt(eps,2);
  // kezdőállapot: g=(3;-2) -> szög -33,69°, |g|=3,606; a csúszkák kerekítése miatt közelítő
  let g=[n*Math.cos(ang), n*Math.sin(ang)];
  if(init) g=[3,-2];
  const sg=g.map(v=>Math.abs(v)<1e-12?0:Math.sign(v)), dinf=sg.map(v=>eps*v);
  const g2=Math.hypot(g[0],g[1]), d2=g.map(v=>eps*v/g2);
  const vinf=eps*(Math.abs(g[0])+Math.abs(g[1])), v2=eps*g2;
  $("info").innerHTML=`g = (${fmt(g[0])}; ${fmt(g[1])}); FGSM δ* = (${fmt(dinf[0],2)}; ${fmt(dinf[1],2)}), gᵀδ* = ε‖g‖₁ = <b>${fmt(vinf)}</b>; `+
    `ℓ₂-optimum (${fmt(d2[0])}; ${fmt(d2[1])}), gᵀδ = ε‖g‖₂ = <b>${fmt(v2)}</b>; arány ${fmt(vinf/v2)} (≤ √2)`;
  const S=420, c=S/2, k=S/4.4, P=(x,y)=>[c+x*k, c-y*k], fg=getComputedStyle(document.body).color;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}">`;
  s+=`<line x1="0" x2="${S}" y1="${c}" y2="${c}" stroke="var(--mut)" stroke-width="0.5"/><line y1="0" y2="${S}" x1="${c}" x2="${c}" stroke="var(--mut)" stroke-width="0.5"/>`;
  // szintvonalak g^T delta = const
  [-0.5,0,0.5,v2/vinf,1].forEach(f=>{const val=f*vinf; // pontok: g^T x = val
    const u=[-g[1]/g2, g[0]/g2], base=g.map(v=>v*val/(g2*g2));
    const A=P(base[0]-3*u[0],base[1]-3*u[1]), B=P(base[0]+3*u[0],base[1]+3*u[1]);
    s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="var(--mut)" stroke-dasharray="2 3"/>`;});
  const q=P(-eps,eps); s+=`<rect x="${q[0]}" y="${q[1]}" width="${2*eps*k}" height="${2*eps*k}" fill="none" stroke="${fg}" stroke-width="2"/>`;
  s+=`<circle cx="${c}" cy="${c}" r="${eps*k}" fill="none" stroke="${fg}" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  const ge=P(g[0]/g2*1.7, g[1]/g2*1.7);
  s+=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker></defs>`;
  s+=`<line x1="${c}" y1="${c}" x2="${ge[0]}" y2="${ge[1]}" stroke="${fg}" stroke-width="2" marker-end="url(#ar)"/><text x="${ge[0]+6}" y="${ge[1]+4}" font-size="13" fill="${fg}">g</text>`;
  const a=P(dinf[0],dinf[1]), b=P(d2[0],d2[1]);
  s+=`<rect x="${a[0]-6}" y="${a[1]-6}" width="12" height="12" fill="${fg}"/><text x="${a[0]+9}" y="${a[1]+16}" font-size="12" fill="${fg}">FGSM (ℓ∞)</text>`;
  s+=`<circle cx="${b[0]}" cy="${b[1]}" r="6" fill="var(--bg)" stroke="${fg}" stroke-width="2"/><text x="${b[0]-10}" y="${b[1]-10}" font-size="12" text-anchor="end" fill="${fg}">ℓ₂-optimum</text>`;
  $("v").outerHTML=s.replace("<svg ",'<svg id="v" role="img" aria-label="Négyzet és kör alakú budget, gradiens és optimumok" ')+"</svg>";
}
["a","n","e"].forEach(i=>$(i).addEventListener("input",()=>{init=false;draw();}));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
