<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReLU-interpoláns – intervallumszám és hiba</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(320px,60vw)}
#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl"><label>intervallumok száma n <input id="n" type="range" min="2" max="40" step="1" value="10"><output id="nv">10</output></label></div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 400" role="img" aria-label="A szinuszfüggvény, a töröttvonalas ReLU-interpoláns és a hiba"></svg>
<script>
const $=id=>document.getElementById(id), f=x=>Math.sin(2*Math.PI*x);
const c=(v,d=6)=>v.toFixed(d).replace(".",",");
const L=55,R=590, T1=10,B1=230, T2=260,B2=375;
const sx=x=>L+x*(R-L), sy1=y=>B1-(y+1.2)/2.4*(B1-T1);
function draw(){
  const n=+$("n").value; $("nv").textContent=n;
  const fg=getComputedStyle(document.body).color, h=1/n, bound=h*h/8*4*Math.PI**2;
  const M=1001; let xs=[],yt=[],ya=[],er=[];
  for(let i=0;i<M;i++){const x=i/(M-1), k=Math.min(n-1,Math.floor(x*n)), x0=k*h, x1=(k+1)*h;
    const a=f(x0)+(f(x1)-f(x0))*(x-x0)/h; xs.push(x);yt.push(f(x));ya.push(a);er.push(Math.abs(a-f(x)))}
  const emax=Math.max(...er), emaxPlot=Math.max(bound,emax)*1.25, sy2=y=>B2-y/emaxPlot*(B2-T2);
  let g="";
  for(let x=0;x<=1.0001;x+=0.2){g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T1}" y2="${B2}" stroke="var(--grid)"/><text x="${sx(x)}" y="${B2+16}" text-anchor="middle" fill="${fg}" font-size="12">${c(x,1).replace(",0","")}</text>`}
  for(const y of [-1,0,1]) g+=`<line x1="${L}" x2="${R}" y1="${sy1(y)}" y2="${sy1(y)}" stroke="var(--grid)"/><text x="${L-6}" y="${sy1(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${y}</text>`;
  const pl=(Y,s)=>xs.map((x,i)=>sx(x)+","+s(Y[i])).join(" ");
  g+=`<polyline points="${pl(yt,sy1)}" fill="none" stroke="${fg}" stroke-width="3"/>`;
  g+=`<polyline points="${pl(ya,sy1)}" fill="none" stroke="var(--mut)" stroke-width="1.6" stroke-dasharray="6 4"/>`;
  for(let k=0;k<=n;k++) g+=`<circle cx="${sx(k*h)}" cy="${sy1(f(k*h))}" r="3.5" fill="var(--bg)" stroke="${fg}" stroke-width="1.3"/>`;
  g+=`<line x1="${L}" x2="${R}" y1="${B2}" y2="${B2}" stroke="${fg}"/>`;
  g+=`<polyline points="${pl(er,sy2)}" fill="none" stroke="${fg}" stroke-width="1.3"/>`;
  g+=`<line x1="${L}" x2="${R}" y1="${sy2(bound)}" y2="${sy2(bound)}" stroke="${fg}" stroke-dasharray="6 4"/>`;
  g+=`<text x="${R}" y="${sy2(bound)-5}" text-anchor="end" fill="${fg}" font-size="12">korlát (h²/8)·4π²</text>`;
  g+=`<text x="${L+4}" y="${T2+2}" fill="${fg}" font-size="12">|f − A| (az y-skála n-nel változik)</text>`;
  g+=`<text x="${L+4}" y="${T1+14}" fill="${fg}" font-size="12">vastag: sin(2πx) · szaggatott: ReLU-interpoláns (n+1 töréspont)</text>`;
  $("v").innerHTML=g;
  $("info").innerHTML=`n = ${n}, h = ${c(h,4)}: max |f − A| az 1001 pontos rácson = <b>${c(emax)}</b> (float64; a labor float32-ben n = 10-re 0,048944), korlát = ${c(bound)}; rejtett ReLU-egységek: n + 1 = ${n+1} (a laborban n = 10 esetén width = 12)`;
}
$("n").addEventListener("input",draw); draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
