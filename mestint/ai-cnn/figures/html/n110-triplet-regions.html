<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Triplet-geometria – kemény, félig kemény, könnyű negatív</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#666;--hard:#c9c9c9;--semi:#ececec;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--hard:#4a4a4a;--semi:#2e2e2e;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block;touch-action:none}
button{font:inherit;padding:2px 8px}
</style></head><body>
<div class="ctl">
 <label>negatív x <input id="nx" type="range" min="-2.5" max="2.5" step="0.01" value="0"><output></output></label>
 <label>negatív y <input id="ny" type="range" min="-1.6" max="1.6" step="0.01" value="0.5"><output></output></label>
 <label>margin α <input id="al" type="range" min="0" max="1" step="0.05" value="0.2"><output></output></label>
 <label>Kiinduló pontok <span><button id="b1">n₁</button> <button id="b2">n₂</button> <button id="b3">n₃</button></span></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 380" role="img" aria-label="Anchor, pozitív és a húzható negatív pont két koncentrikus körrel"></svg>
<script>
const $=id=>document.getElementById(id);
const S=100, OX=260, OY=190; // 1 egység = 100 px
const fx=x=>OX+x*S, fy=y=>OY-y*S;
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
function draw(){
  const nx=+$("nx").value, ny=+$("ny").value, al=+$("al").value;
  $("nx").nextElementSibling.textContent=fmt(nx,2);
  $("ny").nextElementSibling.textContent=fmt(ny,2);
  $("al").nextElementSibling.textContent=fmt(al,2);
  const dap2=1, r1=1, r2=Math.sqrt(dap2+al), dan2=nx*nx+ny*ny, dan=Math.sqrt(dan2);
  const L=Math.max(0,dap2-dan2+al);
  const kind=dan<r1?"kemény negatív":(dan<r2?"félig kemény negatív":"könnyű negatív");
  $("info").innerHTML=`D<sub>an</sub> = <b>${fmt(dan,3)}</b>; r<sub>2</sub> = √(1+α) = ${fmt(r2,3)}; `+
    `L = [1 − ${fmt(dan2,4)} + ${fmt(al,2)}]<sub>+</sub> = <b>${fmt(L,4)}</b> → <b>${kind}</b>`+
    (L>0?" (aktív triplet)":" (nem aktív, nincs gradiens)");
  const fg=getComputedStyle(document.body).color;
  let g=`<defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">`+
    `<line x1="0" y1="0" x2="0" y2="8" stroke="${fg}" stroke-width="1.2"/></pattern>`+
    `<pattern id="d" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${fg}"/></pattern></defs>`;
  g+=`<circle cx="${OX}" cy="${OY}" r="${r2*S}" fill="url(#d)" stroke="${fg}" stroke-width="2" stroke-dasharray="7 5"/>`;
  g+=`<circle cx="${OX}" cy="${OY}" r="${r1*S}" fill="var(--bg)" stroke="none"/>`;
  g+=`<circle cx="${OX}" cy="${OY}" r="${r1*S}" fill="url(#h)" stroke="${fg}" stroke-width="2"/>`;
  g+=`<circle cx="${OX}" cy="${OY}" r="7" fill="${fg}"/><text x="${OX-10}" y="${OY-12}" text-anchor="end" fill="${fg}" font-size="15" paint-order="stroke" stroke="var(--bg)" stroke-width="4">a</text>`;
  g+=`<rect x="${fx(1)-7}" y="${fy(0)-7}" width="14" height="14" fill="${fg}"/><text x="${fx(1)+12}" y="${fy(0)+18}" fill="${fg}" font-size="15" paint-order="stroke" stroke="var(--bg)" stroke-width="4">p</text>`;
  g+=`<line x1="${OX}" y1="${OY}" x2="${fx(nx)}" y2="${fy(ny)}" stroke="var(--acc)" stroke-dasharray="3 3"/>`;
  const X=fx(nx), Y=fy(ny);
  g+=`<polygon id="neg" points="${X},${Y-11} ${X-10},${Y+7} ${X+10},${Y+7}" fill="var(--bg)" stroke="${fg}" stroke-width="2.5" style="cursor:grab"/>`;
  g+=`<text x="${X+13}" y="${Y-8}" fill="${fg}" font-size="14" paint-order="stroke" stroke="var(--bg)" stroke-width="4">n (L = ${fmt(L,4)})</text>`;
  g+=`<text x="10" y="370" fill="${fg}" font-size="12">sraffozott: kemény (D_an &lt; 1) · pontozott gyűrű: félig kemény · üres: könnyű (L=0). A negatív húzható.</text>`;
  $("v").innerHTML=g;
}
["nx","ny","al"].forEach(i=>$(i).addEventListener("input",draw));
const preset=(x,y)=>{$("nx").value=x;$("ny").value=y;draw()};
$("b1").onclick=()=>preset(0,0.5);$("b2").onclick=()=>preset(0,-1.05);$("b3").onclick=()=>preset(2,0);
let drag=false;
const toWorld=e=>{const r=$("v").getBoundingClientRect(),k=600/r.width;
  return [((e.clientX-r.left)*k-OX)/S, (OY-(e.clientY-r.top)*k)/S]};
$("v").addEventListener("pointerdown",e=>{drag=true;$("v").setPointerCapture(e.pointerId);move(e)});
$("v").addEventListener("pointermove",e=>{if(drag)move(e)});
$("v").addEventListener("pointerup",()=>{drag=false});
function move(e){const [x,y]=toWorld(e);
  $("nx").value=Math.max(-2.5,Math.min(2.5,x)).toFixed(2);$("ny").value=Math.max(-1.6,Math.min(1.6,y)).toFixed(2);draw()}
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
