<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elutasítási küszöb és konfidencia</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--rej:#ececec;--acc:#c55a11}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#777;--rej:#333;--acc:#f0a060}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
input[type=range]{width:100%}#out{margin:6px 0;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}button{font:inherit}
</style></head><body>
<label>elutasítási küszöb τ: <b id="tv"></b><input id="t" type="range" min="0.334" max="1" step="any"></label>
<button id="reset">a validáción választott τ (95% cél-coverage)</button>
<div id="out" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 360" role="img" aria-label="Négy konfidencia-hisztogram a küszöbvonallal"></svg>
<script>
const D={"val": [0.94892, 0.951692, 0.89686, 0.761562, 0.954359, 0.947138, 0.779478, 0.737438, 0.89318, 0.904128, 0.852044, 0.820885, 0.862449, 0.877976, 0.891304, 0.859413, 0.899901, 0.916725, 0.980606, 0.976011, 0.910373, 0.941707, 0.987714, 0.98615, 0.761728, 0.820063, 0.963885, 0.959442, 0.898522, 0.910337, 0.998382, 0.998601, 0.996956, 0.997119, 0.999397, 0.999313, 0.962055, 0.959797, 0.998794, 0.997014, 0.963924, 0.97745, 0.998216, 0.998347, 0.988982, 0.975237, 0.998946, 0.997623, 0.985362, 0.98693, 0.760383, 0.763355, 0.844551, 0.899778, 0.946738, 0.969106, 0.85456, 0.874551, 0.822809, 0.858411], "noise": [0.999299, 0.970901, 0.987875, 0.989861, 0.99754, 0.997232, 0.90141, 0.992028, 0.99707, 0.99474, 0.656855, 0.862414, 0.996809, 0.99472, 0.999975, 0.992, 0.998375, 0.966536, 0.973661, 0.999852, 0.996083, 0.999912, 0.944239, 0.93605, 0.979387, 0.993975, 0.6558, 0.997131, 0.999861, 0.973188, 0.999607, 0.807023, 0.747945, 0.918637, 0.672733, 0.998813, 0.95406, 0.997522, 0.998083, 0.998356, 0.863132, 0.992092, 0.998773, 0.989593, 0.987952, 0.990059, 0.986234, 0.871095, 0.998223, 0.988227, 0.998855, 0.990967, 0.99957, 0.994009, 0.919994, 0.999475, 0.940525, 0.861775, 0.999529, 0.962051, 0.997116, 0.974276, 0.999632, 0.993526, 0.999878, 0.997889, 0.97883, 0.995366, 0.971014, 0.950972, 0.993155, 0.760031, 0.999032, 0.967257, 0.737426, 0.962284, 0.995108, 0.692623, 0.989563, 0.996401], "const": [0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0.999991, 0. const X0=20,X1=600,lo=1/3,xs=c=>X0+(c-lo)/(1-lo)*(X1-X0),nb=33,bw=(1-lo)/nb;
const pct=x=>(100*x).toFixed(1).replace(".",",")+"%";
const t=document.getElementById("t"),v=document.getElementById("v"),out=document.getElementById("out"),tv=document.getElementById("tv");
function draw(){
  const tau=+t.value,fg=getComputedStyle(document.body).color;let s="";
  G.forEach((g,k)=>{const y0=10+k*82,H=60,cnt=new Array(nb).fill(0);
    g[1].forEach(c=>cnt[Math.min(nb-1,Math.floor((c-lo)/bw))]++);const m=Math.max(...cnt);
    s+=`<rect x="${X0}" y="${y0}" width="${xs(tau)-X0}" height="${H}" fill="var(--rej)"/>`;
    cnt.forEach((n,i)=>{if(!n)return;const h=n/m*H;s+=`<rect x="${xs(lo+i*bw)}" y="${y0+H-h}" width="${xs(lo+bw)-X0-1}" height="${h}" fill="none" stroke="${fg}"/>`});
    const r=g[1].filter(c=>c<tau).length/g[1].length;
    s+=`<text x="${X0+4}" y="${y0+12}" font-size="12" fill="${fg}">${g[0]} (${g[1].length})</text><text x="${X1+12}" y="${y0+36}" font-size="12" text-anchor="start" fill="${fg}">elutasítva: ${pct(r)}</text>`;
    s+=`<line x1="${X0}" x2="${X1}" y1="${y0+H}" y2="${y0+H}" stroke="var(--mut)"/>`});
  s+=`<line x1="${xs(tau)}" x2="${xs(tau)}" y1="4" y2="320" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 4"/>`;
  [1/3,.5,.7,.9,1].forEach(c=>s+=`<text x="${xs(c)}" y="340" font-size="12" text-anchor="middle" fill="${fg}">${c===1/3?"1/3":String(c).replace(".",",")}</text>`);
  s+=`<text x="${(X0+X1)/2}" y="356" font-size="12" text-anchor="middle" fill="${fg}">softmax-konfidencia · szürke sáv: elutasítva (c &lt; τ)</text>`;
  v.innerHTML=s;tv.textContent=tau.toFixed(4).replace(".",",");
  const cov=D.val.filter(c=>c>=tau).length/60,ood=[].concat(D.noise,D.const,D.board),rej=ood.filter(c=>c<tau).length/ood.length;
  out.innerHTML=`validációs coverage: <b>${pct(cov)}</b> · OOD-elutasítás összesen: <b>${pct(rej)}</b> (200 kép)`;
}
t.value=TAU0;t.addEventListener("input",draw);document.getElementById("reset").onclick=()=>{t.value=TAU0;draw()};draw();
