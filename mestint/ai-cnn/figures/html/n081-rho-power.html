<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rétegenkénti skálaszorzó hatványozódása</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--grid:#ddd;--acc:#c55a11}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--grid:#3a3a3a;--acc:#f4a261}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>saját ρ <input id="r" type="range" min="0.80" max="1.20" step="0.01" value="0.95"><output></output></label>
 <label>L<sub>max</sub> (rétegszám) <input id="L" type="range" min="10" max="100" step="5" value="50"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="A ρ^L görbék logaritmikus függőleges tengelyen"></svg>
<p style="font-size:12px;color:var(--mut)">Szaggatott: ρ = 0,9; vastag folytonos: ρ = 1; pont-vonal: ρ = 1,1; színes: a csúszkával állított saját ρ. A függőleges tengely logaritmikus, 10<sup>−3</sup>…10<sup>3</sup> (a tartományon kívüli rész levágva).</p>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d=4)=>{if(v>=1000||v<1e-3)return v.toExponential(2).replace(".",",").replace("e+","·10^").replace("e-","·10^−");return (+v.toPrecision(d)).toString().replace(".",",");};
function draw(){
  const r=+$("r").value,Lm=+$("L").value;$("r").nextElementSibling.textContent=r.toFixed(2).replace(".",",");$("L").nextElementSibling.textContent=Lm;
  const W=600,H=320,ml=56,mr=14,mt=12,mb=40,fg=getComputedStyle(document.body).color;
  const X=l=>ml+(W-ml-mr)*l/Lm, Y=v=>{const lv=Math.max(-3.2,Math.min(3.2,Math.log10(v)));return mt+(H-mt-mb)*(3-lv)/6;};
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><clipPath id="c"><rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}"/></clipPath></defs>`;
  for(let e=-3;e<=3;e++){g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(10**e)}" y2="${Y(10**e)}" stroke="var(--grid)"/><text x="${ml-6}" y="${Y(10**e)+4}" text-anchor="end" font-size="12" fill="${fg}">10${e<0?'⁻':''}${'⁰¹²³'[Math.abs(e)]}</text>`;}
  for(let l=0;l<=Lm;l+=Lm>50?20:10){g+=`<text x="${X(l)}" y="${H-mb+16}" text-anchor="middle" font-size="12" fill="${fg}">${l}</text>`;}
  g+=`<text x="${(W+ml)/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="${fg}">rétegszám L</text>`;
  const path=(rho,attrs)=>{let d="";for(let l=0;l<=Lm;l++)d+=(l?"L":"M")+X(l).toFixed(1)+","+Y(rho**l).toFixed(1);return `<path d="${d}" fill="none" clip-path="url(#c)" ${attrs}/>`;};
  g+=path(0.9,`stroke="${fg}" stroke-dasharray="6 4" stroke-width="1.6"`)+path(1.0,`stroke="${fg}" stroke-width="3"`)+path(1.1,`stroke="${fg}" stroke-dasharray="8 3 2 3" stroke-width="1.6"`)+path(r,`stroke="var(--acc)" stroke-width="2.4"`);
  g+=`<line x1="${ml}" x2="${ml}" y1="${mt}" y2="${H-mb}" stroke="${fg}"/><line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" stroke="${fg}"/>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="A ρ^L görbék logaritmikus függőleges tengelyen" ')+"</svg>";
  $("info").innerHTML=`L = ${Lm} réteg után: 0,9<sup>${Lm}</sup> ≈ <b>${fmt(0.9**Lm)}</b>, 1,1<sup>${Lm}</sup> ≈ <b>${fmt(1.1**Lm)}</b>, saját ρ<sup>L</sup> = ${r.toFixed(2).replace(".",",")}<sup>${Lm}</sup> ≈ <b>${fmt(r**Lm)}</b>`;
}
["r","L"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
