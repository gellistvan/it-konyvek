<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padding-mód és eltolási ekvivariancia</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.panel{font-size:13px;text-align:center}
.g{display:grid;gap:0;margin-top:4px}
.g>*{width:26px;height:26px;border:1px solid var(--mut);box-sizing:border-box;background:var(--bg);padding:0;margin:0}
.g .on{background:var(--fg)}
.g .df{outline:3px double var(--fg);outline-offset:-4px}
.g button:focus-visible{outline:3px solid #4a90d9;outline-offset:-3px}
select{font:inherit}#info{margin:8px 0}
</style></head><body>
<div style="margin-bottom:6px">Padding-mód <select id="mode"><option value="constant">zero</option><option value="edge" selected>replicate</option><option value="reflect">reflect</option></select>
 · a bemeneti delta helye: kattints a 3×3-as rácsra (eltolás: 1 oszlop jobbra)</div>
<div class="wrap">
 <div class="panel">bemenet X (3×3)<div class="g" id="gx" style="grid-template-columns:repeat(3,26px)"></div></div>
 <div class="panel">A = T(X) (5×5)<div class="g" id="ga" style="grid-template-columns:repeat(5,26px)"></div></div>
 <div class="panel">B = T(τX)<div class="g" id="gb" style="grid-template-columns:repeat(5,26px)"></div></div>
 <div class="panel">C = τ(T X)<div class="g" id="gc" style="grid-template-columns:repeat(5,26px)"></div></div>
 <div class="panel">e = |B − C|<div class="g" id="ge" style="grid-template-columns:repeat(5,26px)"></div></div>
</div>
<div id="info" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
let dr=0, dc=1;
function idx(t,mode){ // t: paddingelt index -1..3 -> eredeti 0..2
  if(t>=0&&t<=2) return t;
  if(mode==="constant") return null;
  if(mode==="edge") return t<0?0:2;
  return t<0?-t:4-t; // reflect: -1->1, 3->1
}
function img(r0,c0,mode){const A=[];for(let r=0;r<5;r++){A.push([]);for(let c=0;c<5;c++){const R=idx(r-1,mode),C=idx(c-1,mode);A[r].push(R===r0&&C===c0?1:0);}}return A;}
function cells(id,M,diff){const el=$(id);el.innerHTML="";M.forEach((row,r)=>row.forEach((v,c)=>{const d=document.createElement("div");if(v)d.className="on";if(diff&&diff[r][c])d.classList.add("df");el.appendChild(d);}));}
function draw(){
  const mode=$("mode").value, A=img(dr,dc,mode), inside=dc+1<=2;
  const B=inside?img(dr,dc+1,mode):null;
  const C=A.map(row=>[0].concat(row.slice(0,4))), lost=A.map(row=>row[4]).some(v=>v);
  const gx=$("gx");gx.innerHTML="";
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const b=document.createElement("button");b.type="button";if(r===dr&&c===dc)b.className="on";
    b.setAttribute("aria-label",`delta a (${r}; ${c}) helyre`);b.setAttribute("aria-pressed",r===dr&&c===dc?"true":"false");b.onclick=()=>{dr=r;dc=c;draw();$("gx").children[r*3+c].focus();};gx.appendChild(b);}
  cells("ga",A);
  if(!B){["gb","gc","ge"].forEach(i=>$(i).innerHTML="");$("info").innerHTML=`A delta a (${dr}; ${dc}) helyen van: jobbra tolva kilépne a 3×3-as bemenetből, ezért az összevetés itt nem értelmezett.`;return;}
  const E=B.map((row,r)=>row.map((v,c)=>Math.abs(v-C[r][c])));
  cells("gb",B,E);cells("gc",C,E);cells("ge",E);
  const pos=[];E.forEach((row,r)=>row.forEach((v,c)=>{if(v)pos.push(`(${r}; ${c})`);}));
  const name={constant:"zero",edge:"replicate",reflect:"reflect"}[mode];
  $("info").innerHTML=`${name} padding, delta (${dr}; ${dc}) → (${dr}; ${dc+1}): `+(pos.length?`B ≠ C a(z) <b>${pos.join(", ")}</b> pozíció(ko)n`:"<b>B = C</b>, az ekvivariancia itt teljesül")+
    (lost?"; az A képének 4. oszlopa a tolásnál kilép az 5×5-ös ablakból (ablakon kívül)":"");
}
$("mode").addEventListener("change",draw);draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
