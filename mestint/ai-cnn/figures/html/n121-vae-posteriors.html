<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAE – prior, posterior és közelítő posterior</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#777;--grid:#e3e3e3;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa;--grid:#333;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}button{font:inherit;padding:2px 8px;justify-self:start}
</style></head><body>
<div class="ctl">
 <label>q középértéke μ <input id="mu" type="range" min="-1.5" max="1.5" step="0.01" value="0.2"><output></output></label>
 <label>q szórásnégyzete σ² <input id="vr" type="range" min="0.02" max="1.5" step="0.01" value="0.25"><output></output></label>
 <button id="opt">q := valódi posterior</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 320" role="img" aria-label="Prior, valódi posterior és a csúszkákkal állítható közelítő posterior sűrűsége"></svg>
<script>
const $=id=>document.getElementById(id);
const fmt=(v,d)=>v.toFixed(d).replace(".",",").replace("-","−");
// kézi példa: W=(1;−0,5), σ_d²=0,16, x=(0,4;−0,2)
const W=[1,-0.5], sd2=0.16, x=[0.4,-0.2];
const WW=W[0]*W[0]+W[1]*W[1], Wx=W[0]*x[0]+W[1]*x[1];
const v=1/(1+WW/sd2), m=v*Wx/sd2;
// log p(x): N(0, sd2 I + W W^T)
const C=[[sd2+W[0]*W[0],W[0]*W[1]],[W[0]*W[1],sd2+W[1]*W[1]]], det=C[0][0]*C[1][1]-C[0][1]*C[1][0];
const quad=(C[1][1]*x[0]*x[0]-2*C[0][1]*x[0]*x[1]+C[0][0]*x[1]*x[1])/det;
const logpx=-Math.log(2*Math.PI)-0.5*Math.log(det)-0.5*quad;
const pdf=(z,mu,va)=>Math.exp(-((z-mu)**2)/(2*va))/Math.sqrt(2*Math.PI*va);
const X0=50,X1=585,Y0=285,Y1=12, zmin=-3,zmax=3,ymax=2.0;
const sx=z=>X0+(z-zmin)/(zmax-zmin)*(X1-X0), sy=y=>Y0-Math.min(y,ymax+0.2)/ymax*(Y0-Y1);
function path(mu,va){let d="";for(let i=0;i<=300;i++){const z=zmin+i*(zmax-zmin)/300;d+=(i?"L":"M")+sx(z).toFixed(1)+","+sy(pdf(z,mu,va)).toFixed(1)}return d}
function draw(){
  const mu=+$("mu").value, va=+$("vr").value;
  $("mu").nextElementSibling.textContent=fmt(mu,2);$("vr").nextElementSibling.textContent=fmt(va,2);
  const klPost=0.5*(va/v+(mu-m)**2/v-1+Math.log(v/va));
  const klPrior=0.5*(va+mu*mu-1-Math.log(va));
  const elbo=logpx-klPost;
  $("info").innerHTML=`log p(x) = ${fmt(logpx,6)} (rögzített) · KL(q‖p(z|x)) = <b>${fmt(klPost,6)}</b> · `+
    `ELBO = log p(x) − KL = <b>${fmt(elbo,6)}</b> · KL(q‖prior) = ${fmt(klPrior,6)}`;
  const fg=getComputedStyle(document.body).color;
  let h=`<defs><clipPath id="c"><rect x="${X0}" y="${Y1}" width="${X1-X0}" height="${Y0-Y1}"/></clipPath></defs>`;
  for(let t=0;t<=2.0001;t+=0.5)h+=`<line x1="${X0}" x2="${X1}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)"/><text x="${X0-6}" y="${sy(t)+4}" text-anchor="end" font-size="12" fill="${fg}">${fmt(t,1).replace(",0","")}</text>`;
  for(let t=-3;t<=3;t++)h+=`<text x="${sx(t)}" y="${Y0+16}" text-anchor="middle" font-size="12" fill="${fg}">${fmt(t,0)}</text>`;
  h+=`<line x1="${X0}" x2="${X1}" y1="${Y0}" y2="${Y0}" stroke="${fg}"/><line x1="${X0}" x2="${X0}" y1="${Y0}" y2="${Y1}" stroke="${fg}"/>`;
  h+=`<g clip-path="url(#c)"><path d="${path(0,1)}" fill="none" stroke="${fg}" stroke-dasharray="2 4" stroke-width="1.8"/>`;
  h+=`<path d="${path(m,v)}" fill="none" stroke="${fg}" stroke-width="3"/>`;
  h+=`<path d="${path(mu,va)}" fill="none" stroke="var(--acc)" stroke-dasharray="8 5" stroke-width="2.4"/></g>`;
  h+=`<text x="${X0+8}" y="${Y1+14}" font-size="12" fill="${fg}">pontozott: prior N(0;1) · vastag: valódi posterior N(${fmt(m,4)}; ${fmt(v,4)}) · szaggatott: q</text>`;
  $("v").innerHTML=h;
}
["mu","vr"].forEach(i=>$(i).addEventListener("input",draw));
$("opt").onclick=()=>{$("mu").value=m.toFixed(2);$("vr").value=v.toFixed(2);draw()};
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
