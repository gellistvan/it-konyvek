<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Az SVD három lépése – A = [[1,1],[0,1]]</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--acc:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--acc:#8fb8e8}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}
input[type=range]{width:min(320px,60vw)}button{font:inherit;padding:3px 10px}
#info{margin:4px 0 6px;min-height:2.6em}svg{width:100%;max-width:460px;height:auto;display:block;margin:auto}
</style></head><body>
<div class="ctl">
 <label>lépés t <input id="t" type="range" min="0" max="3" step="0.01" value="0"><output id="tv">0,00</output></label>
 <button id="play" type="button">Lejátszás</button>
 <button id="step" type="button">Következő lépés</button>
 <button id="reset" type="button">Vissza</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="-2.2 -2.2 4.4 4.4" role="img" aria-label="Az egységkör képe az SVD lépései során"></svg>
<script>
// A = U Σ Vᵀ, numpy SVD, előjelek rögzítve (U, V forgatás): v1 szöge 58,28°, u1 szöge 31,72°
const s1=(1+Math.sqrt(5))/2, s2=(Math.sqrt(5)-1)/2;
const av=Math.atan2(0.85065081,0.52573111), au=Math.atan2(0.52573111,0.85065081);
const rot=a=>[[Math.cos(a),-Math.sin(a)],[Math.sin(a),Math.cos(a)]];
const mul=(A,B)=>[[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],
                  [A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
const ap=(M,p)=>[M[0][0]*p[0]+M[0][1]*p[1],M[1][0]*p[0]+M[1][1]*p[1]];
function M(t){ // 0..1: Vᵀ forgatás, 1..2: Σ nyújtás, 2..3: U forgatás
  const a=Math.min(t,1), b=Math.min(Math.max(t-1,0),1), c=Math.min(Math.max(t-2,0),1);
  const S=[[1+b*(s1-1),0],[0,1+b*(s2-1)]];
  return mul(rot(c*au),mul(S,rot(-a*av)));
}
const $=id=>document.getElementById(id), fmt=x=>x.toFixed(3).replace(".",",").replace("-","−");
const names=["x: egységkör","Vᵀx: forgatás (−58,3°)","ΣVᵀx: nyújtás (σ₁ = 1,618, σ₂ = 0,618)","UΣVᵀx = Ax: forgatás (+31,7°)"];
function draw(){
  const t=+$("t").value; $("tv").textContent=t.toFixed(2).replace(".",",");
  const m=M(t), fg=getComputedStyle(document.body).color;
  let pts=[];for(let k=0;k<=96;k++){const a=2*Math.PI*k/96;const p=ap(m,[Math.cos(a),Math.sin(a)]);pts.push(p[0].toFixed(4)+","+(-p[1]).toFixed(4))}
  const v1=[0.52573111,0.85065081], v2=[-0.85065081,0.52573111];
  const a1=ap(m,v1), a2=ap(m,v2), e=ap(m,[1,0]);
  const arrow=(p,dash,w)=>`<line x1="0" y1="0" x2="${p[0]}" y2="${-p[1]}" stroke="${fg}" stroke-width="${w}" ${dash?'stroke-dasharray="0.08 0.06"':''} marker-end="url(#ah)"/>`;
  let g=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="${fg}"/></marker></defs>`;
  g+=`<line x1="-2.1" x2="2.1" y1="0" y2="0" stroke="var(--mut)" stroke-width="0.01"/><line y1="-2.1" y2="2.1" x1="0" x2="0" stroke="var(--mut)" stroke-width="0.01"/>`;
  g+=`<circle r="1" fill="none" stroke="var(--mut)" stroke-width="0.015" stroke-dasharray="0.06 0.05"/>`;
  g+=`<polyline points="${pts.join(" ")}" fill="none" stroke="${fg}" stroke-width="0.03"/>`;
  g+=arrow(a1,false,0.035)+arrow(a2,true,0.025);
  g+=`<path d="M${e[0]},${-e[1]-0.08}l0.07,0.12h-0.14z" fill="var(--bg)" stroke="${fg}" stroke-width="0.015"/>`;
  $("v").innerHTML=g;
  const k=Math.min(3,Math.max(0,Math.ceil(t-1e-9))), n1=Math.hypot(...a1), n2=Math.hypot(...a2);
  $("info").innerHTML=`<b>${names[k]}</b> · `+
   `‖v₁ képe‖ = ${fmt(n1)}, ‖v₂ képe‖ = ${fmt(n2)}`+(t>=3?` · ‖A‖₂ = σ₁ ≈ 1,618`:"");
}
let timer=null;
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").onclick=()=>{ if(timer){stop();return}
  if(+$("t").value>=3) $("t").value=0;
  $("play").textContent="Szünet";
  timer=setInterval(()=>{let t=+$("t").value+0.02; if(t>=3){t=3;stop()} $("t").value=t; draw()},40)};
$("step").onclick=()=>{stop();$("t").value=Math.min(3,Math.floor(+$("t").value+1e-9)+1);draw()};
$("reset").onclick=()=>{stop();$("t").value=0;draw()};
$("t").addEventListener("input",()=>{stop();draw()});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
