<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kis kernelek stackje: recepciós mező és útszám</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#666}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#aaa}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;max-width:520px;height:auto;display:block;margin:auto}
</style></head><body>
<div class="ctl">
 <label>rétegek száma L <input id="L" type="range" min="1" max="3" value="2"><output></output></label>
 <label>kernelméret k <input id="k" type="range" min="3" max="7" step="2" value="3"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Útszám-hőtérkép a bemeneti mezőn"></svg>
<p style="font-size:12px;color:var(--mut)">Stride 1, dilation 1. Cellánként: hány úton jut el a bemeneti pixel a kimeneti pixelhez (a csupa-1 k×k mag L-szeres önkonvolúciója). Az útszám a hatásos mező alakjára utal, nem a súlyra.</p>
<script>
const $=id=>document.getElementById(id);
function conv1(a,k){const n=a.length+k-1,o=Array(n).fill(0);for(let i=0;i<a.length;i++)for(let r=0;r<k;r++)o[i+r]+=a[i];return o;}
function draw(){
  const L=+$("L").value,k=+$("k").value;$("L").nextElementSibling.textContent=L;$("k").nextElementSibling.textContent=k;
  let a=[1];for(let l=0;l<L;l++)a=conv1(a,k);const F=a.length,mx=a[(F-1)/2]**2;
  const sum=a.reduce((s,v)=>s+v,0)**2;
  $("info").innerHTML=`F = 1 + L(k−1) = <b>${F}</b>; súlyok (C=1, bias nélkül): stack ${L}·${k*k} = <b>${L*k*k}</b>, egyetlen ${F}×${F}-es réteg: <b>${F*F}</b>; az utak összege ${sum}, a közép ${mx}.`;
  const fg=getComputedStyle(document.body).color,c=Math.min(56,480/F),W=F*c+4;
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${W}">`;
  for(let i=0;i<F;i++)for(let j=0;j<F;j++){const v=a[i]*a[j],s=1-0.8*v/mx,col=Math.round(255*s);
    g+=`<rect x="${2+j*c}" y="${2+i*c}" width="${c}" height="${c}" fill="rgb(${col},${col},${col})" stroke="${fg}" stroke-width=".6"/>`;
    if(c>=22)g+=`<text x="${2+j*c+c/2}" y="${2+i*c+c/2+4}" text-anchor="middle" font-size="${Math.min(13,c/2.6)}" fill="${s>0.45?'#000':'#fff'}">${v}</text>`;}
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Útszám-hőtérkép a bemeneti mezőn" ')+"</svg>";
}
["L","k"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
