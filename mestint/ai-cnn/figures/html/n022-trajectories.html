<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradienslépés-pálya – f(x) = x₁² + 3x₂²</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(300px,60vw)}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;max-width:500px;height:auto;display:block;margin:auto}
</style></head><body>
<div class="ctl">
 <label>lépésköz η <input id="eta" type="range" min="0.05" max="0.6" step="0.01" value="0.25"><output id="ev">0,25</output></label>
 <button id="play" type="button">Lejátszás</button><button id="step" type="button">Lépés</button><button id="reset" type="button">Vissza</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 420 470" role="img" aria-label="Szintvonalak és a gradienslépések pályája"></svg>
<script>
const $=id=>document.getElementById(id), f=(a,b)=>a*a+3*b*b;
const L=40,R=410,T=10,B=432, xmin=-1,xmax=2.5,ymin=-1.5,ymax=2.5;
const sx=x=>L+(x-xmin)/(xmax-xmin)*(R-L), sy=y=>B-(y-ymin)/(ymax-ymin)*(B-T);
const c=(v,d=4)=>(+v.toFixed(d)).toLocaleString("hu-HU",{maximumFractionDigits:d}).replace("-","−");
let t=4, timer=null;
function path(eta,n){let P=[[2,-1]];for(let k=0;k<n;k++){const [a,b]=P[P.length-1];P.push([a-eta*2*a,b-eta*6*b])}return P}
function draw(){
  const eta=+$("eta").value; $("ev").textContent=c(eta,2);
  const fg=getComputedStyle(document.body).color, P=path(eta,t);
  let g=`<defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath></defs>`;
  for(let x=-1;x<=2.5;x+=0.5) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${B}" stroke="var(--grid)"/>`+(x%1===0?`<text x="${sx(x)}" y="${B+16}" text-anchor="middle" fill="${fg}" font-size="12">${c(x)}</text>`:"");
  for(let y=-1.5;y<=2.5;y+=0.5) g+=`<line x1="${L}" x2="${R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/>`+(y%1===0?`<text x="${L-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${c(y)}</text>`:"");
  g+=`<g clip-path="url(#cp)">`;
  for(const lv of [1,4,7,12]) g+=`<ellipse cx="${sx(0)}" cy="${sy(0)}" rx="${Math.sqrt(lv)*(R-L)/(xmax-xmin)}" ry="${Math.sqrt(lv/3)*(B-T)/(ymax-ymin)}" fill="none" stroke="var(--mut)" stroke-width="${lv===7?1.6:0.8}"/>`;
  g+=`<polyline points="${P.map(p=>sx(p[0])+","+sy(p[1])).join(" ")}" fill="none" stroke="${fg}" stroke-width="1.5" ${eta>1/3?'stroke-dasharray="6 4"':''}/>`;
  P.forEach((p,k)=>g+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="${k===P.length-1?5:3.5}" fill="${k===P.length-1?fg:'var(--bg)'}" stroke="${fg}" stroke-width="1.4"/>`);
  g+=`<text x="${sx(0)}" y="${sy(0)+5}" text-anchor="middle" fill="${fg}" font-size="15">★</text></g>`;
  $("v").innerHTML=g;
  const [a,b]=P[P.length-1], q2=1-6*eta;
  const out=(a<xmin||a>xmax||b<ymin||b>ymax)?" (a látható tartományon kívül)":"";
  $("info").innerHTML=`t = ${t}: x = (${c(a)}; ${c(b)})${out}, f = <b>${c(f(a,b))}</b> · x₂-tényező 1 − 6η = ${c(q2,2)}, 2/L = 1/3 · `+
    (eta<1/3-1e-9?"konvergál":eta>1/3+1e-9?"<b>divergál</b> az x₂ irányban":"határeset: |1 − 6η| = 1, az x₂ előjelet vált, de nem csökken");
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").onclick=()=>{if(timer){stop();return} if(t>=10)t=0; $("play").textContent="Szünet";
  timer=setInterval(()=>{t++;draw();if(t>=10)stop()},600)};
$("step").onclick=()=>{stop();if(t<10)t++;draw()};
$("reset").onclick=()=>{stop();t=0;draw()};
$("eta").addEventListener("input",()=>{stop();t=0;draw()});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
