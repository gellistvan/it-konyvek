<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momentum és sima SGD – f = ½(x₁² + 10x₂²)</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#999;--grid:#e6e6e6;--b:#555}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#777;--grid:#333;--b:#bbb}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-bottom:6px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
.btn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}button{font:inherit;padding:3px 10px}
#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>SGD lépésköz η <input id="es" type="range" min="0.01" max="0.21" step="0.01" value="0.18"><output></output></label>
 <label>momentum lépésköz η <input id="em" type="range" min="0.01" max="0.2" step="0.01" value="0.1"><output></output></label>
 <label>momentum β <input id="b" type="range" min="0" max="0.95" step="0.05" value="0.5"><output></output></label>
</div>
<div class="btn"><button id="play" type="button">Lejátszás</button><button id="step" type="button">Lépés</button><button id="reset" type="button">Vissza</button></div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 260" role="img" aria-label="Sima és momentumos SGD pályája a szintvonalakon"></svg>
<script>
const $=id=>document.getElementById(id), f=(a,b)=>0.5*(a*a+10*b*b);
const L=45,R=590,T=10,B=230,xmin=-1,xmax=9,ymin=-1.6,ymax=1.6;
const sx=x=>L+(x-xmin)/(xmax-xmin)*(R-L), sy=y=>B-(y-ymin)/(ymax-ymin)*(B-T);
const c=(v,d=3)=>(+v.toFixed(d)).toLocaleString("hu-HU",{maximumFractionDigits:d}).replace("-","−");
let t=15,timer=null;const N=40;
function sgd(eta,n){let p=[8,1],P=[p];for(let k=0;k<n;k++){p=[p[0]-eta*p[0],p[1]-eta*10*p[1]];P.push(p)}return P}
function mom(eta,b,n){let p=[8,1],m=[0,0],P=[p];for(let k=0;k<n;k++){m=[b*m[0]+p[0],b*m[1]+10*p[1]];p=[p[0]-eta*m[0],p[1]-eta*m[1]];P.push(p)}return P}
function path(P,dash,fill,fg){
  let g=`<polyline points="${P.map(p=>sx(p[0])+","+sy(p[1])).join(" ")}" fill="none" stroke="${fg}" stroke-width="1.4" ${dash}/>`;
  P.forEach(p=>g+=fill==="sq"?`<rect x="${sx(p[0])-3.5}" y="${sy(p[1])-3.5}" width="7" height="7" fill="var(--bg)" stroke="${fg}"/>`:`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="3.2" fill="${fg}"/>`);
  return g}
function draw(){
  ["es","em","b"].forEach(i=>$(i).nextElementSibling.textContent=c(+$(i).value,2));
  const fg=getComputedStyle(document.body).color, S=sgd(+$("es").value,t), M=mom(+$("em").value,+$("b").value,t);
  let g=`<defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath></defs>`;
  for(let x=0;x<=8;x+=2) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${B}" stroke="var(--grid)"/><text x="${sx(x)}" y="${B+16}" text-anchor="middle" fill="${fg}" font-size="12">${x}</text>`;
  for(const y of [-1,0,1]) g+=`<line x1="${L}" x2="${R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${c(y)}</text>`;
  g+=`<g clip-path="url(#cp)">`;
  for(const lv of [1,4,16,37]) g+=`<ellipse cx="${sx(0)}" cy="${sy(0)}" rx="${Math.sqrt(2*lv)*(R-L)/(xmax-xmin)}" ry="${Math.sqrt(2*lv/10)*(B-T)/(ymax-ymin)}" fill="none" stroke="var(--mut)"/>`;
  g+=path(S,"","ci",fg)+path(M,'stroke-dasharray="6 4"',"sq","var(--b)")+`</g>`;
  g+=`<text x="${R-4}" y="${T+14}" text-anchor="end" fill="${fg}" font-size="12">● sima SGD (folytonos) · □ momentum (szaggatott)</text>`;
  $("v").innerHTML=g;
  const s=S[S.length-1], m=M[M.length-1];
  $("info").innerHTML=`t = ${t}: f(SGD) = <b>${c(f(...s))}</b>, f(momentum) = <b>${c(f(...m))}</b>`+
    (+$("es").value>=0.2?" · SGD: η ≥ 2/L = 0,2, az x₂ irány nem konvergál":"")+
    (+$("b").value>=0.85?" · nagy β: a momentum túllő és lassan csillapodó oszcillációt ad":"");
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").onclick=()=>{if(timer){stop();return} if(t>=N)t=0; $("play").textContent="Szünet";
  timer=setInterval(()=>{t++;draw();if(t>=N)stop()},350)};
$("step").onclick=()=>{stop();if(t<N)t++;draw()};
$("reset").onclick=()=>{stop();t=0;draw()};
["es","em","b"].forEach(i=>$(i).addEventListener("input",()=>{stop();draw()}));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
