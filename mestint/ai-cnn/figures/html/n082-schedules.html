<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning rate pályák a laborban</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#888;--grid:#ddd;--c1:#1f4e79;--c2:#c55a11}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#999;--grid:#3a3a3a;--c1:#8fb8e8;--c2:#f4a261}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 14px;margin-bottom:8px}
label{display:flex;flex-direction:column;font-size:13px}output{font-weight:600}
#info{margin:4px 0 6px}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>warmup (epoch) <input id="w" type="range" min="0" max="5" value="3"><output></output></label>
 <label>lépcsőhossz (epoch) <input id="s" type="range" min="5" max="20" value="15"><output></output></label>
 <label>γ (step decay) <input id="g" type="range" min="0.1" max="0.9" step="0.1" value="0.1"><output></output></label>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" role="img" aria-label="Tanulási ráta az optimizer-lépés függvényében"></svg>
<p style="font-size:12px;color:var(--mut)">8 lépés/epoch, 40 epoch = 320 optimizer-lépés, η<sub>0</sub> = 10<sup>−3</sup>. Fekete vízszintes: konstans; szaggatott (kék): warmup + cosine a labor LambdaLR-képletével, η<sub>min</sub> = 0; lépcsős (narancs): step decay. Lineáris skála.</p>
<script>
const $=id=>document.getElementById(id);
const SPE=8,TOT=320,E0=1e-2;
function draw(){
  const we=+$("w").value,se=+$("s").value,ga=+$("g").value;
  $("w").nextElementSibling.textContent=we;$("s").nextElementSibling.textContent=se;$("g").nextElementSibling.textContent=ga.toFixed(1).replace(".",",");
  const WU=we*SPE,T=TOT-WU,SL=se*SPE;
  const cos=k=>E0*(k<WU?(k+1)/WU:0.5*(1+Math.cos(Math.PI*(k-WU)/T)));
  const stp=k=>E0*ga**Math.floor(k/SL);
  const W=600,H=300,ml=52,mr=12,mt=10,mb=36,fg=getComputedStyle(document.body).color;
  const X=k=>ml+(W-ml-mr)*k/TOT,Y=v=>mt+(H-mt-mb)*(1-v/1.1e-2);
  let g=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  for(let v=0;v<=1.0001;v+=0.2)g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v*1e-2)}" y2="${Y(v*1e-2)}" stroke="var(--grid)"/><text x="${ml-6}" y="${Y(v*1e-2)+4}" text-anchor="end" font-size="12" fill="${fg}">${(+v.toFixed(1)).toString().replace(".",",")}</text>`;
  for(let k=0;k<=TOT;k+=80)g+=`<text x="${X(k)}" y="${H-mb+16}" text-anchor="middle" font-size="12" fill="${fg}">${k}</text>`;
  g+=`<text x="${(W+ml)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="${fg}">optimizer-lépés k (η ×10⁻²)</text>`;
  const path=(f,attr)=>{let d="";for(let k=0;k<TOT;k++)d+=(k?"L":"M")+X(k).toFixed(1)+","+Y(f(k)).toFixed(1);return `<path d="${d}" fill="none" ${attr}/>`;};
  g+=path(()=>E0,`stroke="${fg}" stroke-width="2"`)+path(cos,`stroke="var(--c1)" stroke-width="2.2" stroke-dasharray="7 4"`)+path(stp,`stroke="var(--c2)" stroke-width="2"`);
  if(WU>0)g+=`<line x1="${X(WU)}" x2="${X(WU)}" y1="${mt}" y2="${H-mb}" stroke="var(--mut)" stroke-dasharray="2 3"/>`;
  $("v").outerHTML=g.replace("<svg ",'<svg id="v" role="img" aria-label="Tanulási ráta az optimizer-lépés függvényében" ')+"</svg>";
  const steps=[];for(let k=SL;k<TOT;k+=SL)steps.push(k);
  const f=v=>v.toExponential(2).replace(".",",").replace("e-","·10^−");
  $("info").innerHTML=`warmup ${WU} lépés; cosine: η(k=${Math.max(WU-1,0)}) = ${f(cos(Math.max(WU-1,0)))}, η(319) = <b>${f(cos(319))}</b>; step decay lépcsők: k = <b>${steps.join(", ")||"—"}</b>, végérték ${f(stp(319))}`;
}
["w","s","g"].forEach(i=>$(i).addEventListener("input",draw));draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
