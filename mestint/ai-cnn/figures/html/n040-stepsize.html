<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lépésköz a parabolán – L(w) = (w−2)² + 1</title>
<style>
:root{--fg:#1a1a1a;--bg:#fff;--mut:#999;--grid:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#e8e8e8;--bg:#1b1b1b;--mut:#888;--grid:#333}}
body{margin:0;padding:10px;font:14px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{display:flex;gap:8px;align-items:center;font-size:13px}input[type=range]{width:min(300px,60vw)}
button{font:inherit;padding:3px 10px}#info{margin:4px 0 6px;min-height:2.8em}svg{width:100%;height:auto;display:block}
</style></head><body>
<div class="ctl">
 <label>lépésköz α <input id="al" type="range" min="0.05" max="1.2" step="0.05" value="0.25"><output id="av">0,25</output></label>
 <button id="play" type="button">Lejátszás</button><button id="step" type="button">Lépés</button><button id="reset" type="button">Vissza</button>
</div>
<div id="info" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A parabola és a gradienslépések sorozata"></svg>
<script>
const $=id=>document.getElementById(id), LB=w=>0.5*((w-1)**2+(w-3)**2);
const L=45,R=550,T=10,B=265,xmin=-4,xmax=8,ymin=0,ymax=40;
const sx=x=>L+(x-xmin)/(xmax-xmin)*(R-L), sy=y=>B-(y-ymin)/(ymax-ymin)*(B-T);
const c=(v,d=4)=>(+v.toFixed(d)).toLocaleString("hu-HU",{maximumFractionDigits:d}).replace("-","−");
let t=3,timer=null;const N=12;
function traj(a,n){let w=[0];for(let k=0;k<n;k++){const x=w[w.length-1];w.push(x-a*(2*x-4))}return w}
function draw(){
  const a=+$("al").value; $("av").textContent=c(a,2);
  const fg=getComputedStyle(document.body).color, W=traj(a,t);
  let g=`<defs><clipPath id="cp"><rect x="${L}" y="${T}" width="${R-L}" height="${B-T}"/></clipPath></defs>`;
  for(let x=-4;x<=8;x+=2) g+=`<line x1="${sx(x)}" x2="${sx(x)}" y1="${T}" y2="${B}" stroke="var(--grid)"/><text x="${sx(x)}" y="${B+16}" text-anchor="middle" fill="${fg}" font-size="12">${c(x)}</text>`;
  for(let y=0;y<=40;y+=10) g+=`<line x1="${L}" x2="${R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--grid)"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end" fill="${fg}" font-size="12">${y}</text>`;
  let p=[];for(let k=0;k<=160;k++){const x=xmin+(xmax-xmin)*k/160;p.push(sx(x)+","+sy(LB(x)))}
  g+=`<g clip-path="url(#cp)"><polyline points="${p.join(" ")}" fill="none" stroke="var(--mut)" stroke-width="2"/>`;
  g+=`<polyline points="${W.map(w=>sx(w)+","+sy(LB(w))).join(" ")}" fill="none" stroke="${fg}" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  W.forEach((w,k)=>g+=`<circle cx="${sx(w)}" cy="${sy(LB(w))}" r="${k===W.length-1?5:3.5}" fill="${k===W.length-1?fg:'var(--bg)'}" stroke="${fg}" stroke-width="1.4"/>`);
  g+=`<circle cx="${sx(2)}" cy="${sy(1)}" r="3" fill="${fg}"/></g>`;
  $("v").innerHTML=g;
  const w=W[W.length-1], q=1-2*a;
  $("info").innerHTML=`t = ${t}: w = ${c(w)}, L = <b>${c(LB(w))}</b> · w<sub>t+1</sub> = (1 − 2α)w<sub>t</sub> + 4α, 1 − 2α = ${c(q,2)} · `+
   (Math.abs(a-0.5)<1e-9?"α = 1/L″: egy lépésben a minimumban":a<0.5?"monoton konvergál":a<1-1e-9?"oszcillálva konvergál":Math.abs(a-1)<1e-9?"α = 2/L″: tiszta oszcilláció (0 ↔ 4, L = 5)":"<b>divergál</b>");
}
function stop(){clearInterval(timer);timer=null;$("play").textContent="Lejátszás"}
$("play").onclick=()=>{if(timer){stop();return} if(t>=N)t=0; $("play").textContent="Szünet";
  timer=setInterval(()=>{t++;draw();if(t>=N)stop()},600)};
$("step").onclick=()=>{stop();if(t<N)t++;draw()};
$("reset").onclick=()=>{stop();t=0;draw()};
$("al").addEventListener("input",()=>{stop();t=0;draw()});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
