<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV-cache és naiv újraszámítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="bad" onchange="badMode=this.checked; show(k)"> cache visszaadása elfelejtve (19.4.2.1, első tipikus hiba)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Generálási lépésenként a naiv módszer teljes figyelemmátrixa és a KV-cache növekvő K/V puffere, műveletszámlálóval."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított műveletszámok (pontszorzatok száma; a naiv változat a teljes t×t mátrixot számolja, a maszk utána nulláz), egy fej, nem mérés. A kódpanel a 19.4.2.1 kv_cache_attention függvényének rövidített változata.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 1, "ph": 0, "line": 2, "naive": 1, "cache": 1, "msg": "t = 1: az új k_1, v_1 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 1, D)."}, {"t": 1, "ph": 1, "line": 8, "naive": 1, "cache": 1, "msg": "t = 1: q_1 · K (1×1 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 1, KV-cache: 1."}, {"t": 2, "ph": 0, "line": 2, "naive": 5, "cache": 3, "msg": "t = 2: az új k_2, v_2 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 2, D)."}, {"t": 2, "ph": 1, "line": 8, "naive": 5, "cache": 3, "msg": "t = 2: q_2 · K (1×2 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 5, KV-cache: 3."}, {"t": 3, "ph": 0, "line": 2, "naive": 14, "cache": 6, "msg": "t = 3: az új k_3, v_3 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 3, D)."}, {"t": 3, "ph": 1, "line": 8, "naive": 14, "cache": 6, "msg": "t = 3: q_3 · K (1×3 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 14, KV-cache: 6."}, {"t": 4, "ph": 0, "line": 2, "naive": 30, "cache": 10, "msg": "t = 4: az új k_4, v_4 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 4, D)."}, {"t": 4, "ph": 1, "line": 8, "naive": 30, "cache": 10, "msg": "t = 4: q_4 · K (1×4 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 30, KV-cache: 10."}, {"t": 5, "ph": 0, "line": 2, "naive": 55, "cache": 15, "msg": "t = 5: az új k_5, v_5 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 5, D)."}, {"t": 5, "ph": 1, "line": 8, "naive": 55, "cache": 15, "msg": "t = 5: q_5 · K (1×5 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 55, KV-cache: 15."}, {"t": 6, "ph": 0, "line": 2, "naive": 91, "cache": 21, "msg": "t = 6: az új k_6, v_6 sor a pufferbe kerül (torch.cat), a cache alakja (B, H, 6, D)."}, {"t": 6, "ph": 1, "line": 8, "naive": 91, "cache": 21, "msg": "t = 6: q_6 · K (1×6 pontszám), return a frissített cache-sel. Pontszorzatok eddig – naiv: 91, KV-cache: 21."}];
const CODE = ["def kv_cache_attention(q, k_new, v_new, k_cache, v_cache):", "    # q, k_new, v_new: (B, H, 1, D); k_cache: (B, H, L_past, D)", "    k_full = torch.cat([k_cache, k_new], dim=2)   # (B, H, L_past+1, D)", "    v_full = torch.cat([v_cache, v_new], dim=2)", "    scores = torch.matmul(q, k_full.transpose(-2, -1)) / (D ** 0.5)   # (B, H, 1, L_past+1)", "    attn = torch.softmax(scores, dim=-1)", "    out = torch.matmul(attn, v_full)               # (B, H, 1, D)", "    new_k_cache = k_full; new_v_cache = v_full", "    return out, new_k_cache, new_v_cache           # a frissített cache-t vissza kell adni!"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let badMode = false;
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), wr = css("--hl2");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  svg.appendChild(defs);
  const t = s.t, c = 30;
  function box(x, y, fill, txt, dash, tc){ el("rect", {x: x, y: y, width: c, height: c, fill: fill, stroke: fg, "stroke-width": 1, "stroke-dasharray": dash || ""}); if (txt) el("text", {x: x + c/2, y: y + c/2 + 5, "text-anchor": "middle", "font-size": 12, fill: tc || fg}, txt); }
  // naiv
  el("text", {x: 20, y: 22, "font-size": 14, "font-weight": "bold"}, "naiv újraszámítás");
  for (let i = 0; i < t; i++){
    box(20, 40 + i*c, "url(#pdiag)", "k" + (i+1)); box(20 + c + 4, 40 + i*c, "url(#pdiag)", "v" + (i+1));
    for (let j = 0; j < t; j++) box(100 + j*c, 40 + i*c, j <= i ? "url(#pdiag)" : css("--cellhl"), j <= i ? "" : "−∞", j <= i ? "" : "2 2");
  }
  el("text", {x: 20, y: 40 + 6*c + 22, "font-size": 13}, `t×t = ${t}×${t} QKᵀ + K, V mind újra`);
  el("text", {x: 20, y: 40 + 6*c + 44, "font-size": 15}, "pontszorzatok: Σ l² = " + s.naive);
  // cache
  const len = badMode ? 1 : t, cnt = badMode ? t : s.cache;
  const X = 350;
  el("text", {x: X, y: 22, "font-size": 14, "font-weight": "bold"}, "KV-cache");
  for (let i = 0; i < len; i++){
    const isNew = i === len - 1, idx = badMode ? t : i + 1;
    const f = isNew ? (s.ph === 0 ? css("--hl") : fg) : css("--bg");
    box(X, 40 + i*c, f, "k" + idx, "", isNew ? css("--bg") : fg); box(X + c + 4, 40 + i*c, f, "v" + idx, "", isNew ? css("--bg") : fg);
  }
  el("text", {x: X, y: 40 + 6*c + 22, "font-size": 13}, `puffer hossza: ${len}  → alak (B, H, ${len}, D)`);
  if (s.ph === 1){
    for (let j = 0; j < len; j++) box(X + 90 + j*c, 40, "url(#pdiag)", "");
    el("text", {x: X + 90, y: 40 + c + 18, "font-size": 12, fill: mu}, `q${t}·Kᵀ: 1×${len} pontszám`);
  }
  el("text", {x: X, y: 40 + 6*c + 44, "font-size": 15}, "pontszorzatok: Σ l = " + cnt);
  if (badMode) el("text", {x: X, y: 40 + 6*c + 66, "font-size": 13, fill: wr, "font-weight": "bold"}, "HIBA: a cache nincs visszaadva – a modell csak az utolsó tokent látja!");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
