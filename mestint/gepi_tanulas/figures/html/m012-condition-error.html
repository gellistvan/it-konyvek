<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatív hiba és kondíciószám</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="e">σ_oszl kitevője</label><input id="e" type="range" min="-12" max="-2" step="2" value="-6" aria-label="A zajszórás kitevője">
<b id="ev">−6</b>
<label><input id="noisy" type="checkbox"> zajos b (σ_δ = 10⁻¹⁰)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 325" role="img" aria-label="Log-log ábra: az lstsq hibapontjai 1 meredekségű, a normálegyenleté 2 meredekségű egyenes mentén nőnek, majd 1 körül telítődnek; a kiválasztott zajszint pontja kiemelve"></svg>

<p class="small">Számított, nem mérés; seedfüggő (a 4.4 labor beállítása: N = 200, d = 20, default_rng(42), NumPy 2.3.5). A referencia-egyenesek κε és κ²ε (ε = 2,2·10⁻¹⁶). A „zajos b” kapcsoló előre számított második adatsort mutat (σ_δ = 10⁻¹⁰): az lstsq hibáját ekkor az adathiba (≈ κ·‖δb‖/‖b‖) uralja.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const DATA = {clean: [{"sig": 0.01, "kappa": 250.52632837113032, "lstsq": 1.0036459143749419e-14, "normal": 3.8211862439103295e-12, "inv": 3.899212303369308e-12}, {"sig": 0.0001, "kappa": 25857.743138031754, "lstsq": 1.5913880276383314e-12, "normal": 6.91182891640249e-08, "inv": 7.078500003690691e-08}, {"sig": 1e-06, "kappa": 2584713.317852766, "lstsq": 7.275663051527399e-11, "normal": 0.0007231498994269568, "inv": 0.0007511316838591544}, {"sig": 1e-08, "kappa": 250552846.38581613, "lstsq": 1.0296717536402886e-08, "normal": 8.13809564711736, "inv": 8.010667296748032}, {"sig": 1e-10, "kappa": 25082104852.428375, "lstsq": 4.975568148195466e-07, "normal": null, "inv": null}, {"sig": 1e-12, "kappa": 2584841647796.5767, "lstsq": 8.305656561778972e-05, "normal": 0.6946146556694922, "inv": 0.6770254458393826}], noisy: [{"sig": 0.01, "kappa": 250.52632837113032, "lstsq": 4.4153156895987765e-10, "normal": 4.3933688910967816e-10, "inv": 4.3892198769489526e-10}, {"sig": 0.0001, "kappa": 25077.893235387717, "lstsq": 4.943987611867762e-08, "normal": 7.806702291636017e-08, "inv": 9.345473404949534e-08}, {"sig": 1e-06, "kappa": 2567655.6350010536, "lstsq": 3.1686736310719635e-06, "normal": 0.0005990695175586819, "inv": 0.0007696980756748812}, {"sig": 1e-08, "kappa": 254000216.15796277, "lstsq": 0.0004024545991626539, "normal": 1.2076937685972209, "inv": 0.8182456182359357}, {"sig": 1e-10, "kappa": 26940711118.844334, "lstsq": 0.055049813720410457, "normal": 1.031938365724174, "inv": 1.0050366926859438}, {"sig": 1e-12, "kappa": 2652419959177.088, "lstsq": 6.108272799696314, "normal": 60.14587048224417, "inv": 46.20965845573162}]}, EPS = 2.220446049250313e-16;
let ex = -6, noisy = false;
const sup = n => "10" + String(n).split("").map(ch => "⁰¹²³⁴⁵⁶⁷⁸⁹"["0123456789".indexOf(ch)] || (ch === "-" ? "⁻" : ch)).join("");
const L = 70, R = 620, T = 15, B = 285;
const X = k => L + (R - L) * (Math.log10(k) - 2) / 11, Y = v => B - (B - T) * (Math.log10(v) + 16) / 18;
const SER = [{k: "lstsq", n: "lstsq (SVD)", d: "", m: "o", c: "--fg"}, {k: "normal", n: "normálegyenlet (solve)", d: "7 4", m: "^", c: "--hl"},
             {k: "inv", n: "inv(AᵀA)", d: "2 3", m: "s", c: "--hl2"}];
function mark(m, x, y, col, big){ const r = big ? 7 : 4.5;
  if (m === "o") el("circle", {cx: x, cy: y, r, fill: css("--bg"), stroke: col, "stroke-width": 2});
  else if (m === "^") el("path", {d: `M${x} ${y - r}L${x + r} ${y + r * 0.8}L${x - r} ${y + r * 0.8}Z`, fill: col});
  else el("rect", {x: x - r * 0.8, y: y - r * 0.8, width: r * 1.6, height: r * 1.6, fill: "none", stroke: col, "stroke-width": 2}); }
const e10 = v => { if (v === null) return "szinguláris (LinAlgError)"; const e = Math.floor(Math.log10(v)), m = v / 10 ** e; return fmt(m, 1) + "·" + sup(e); };
function draw(){
  svg.innerHTML = "";
  const D = DATA[noisy ? "noisy" : "clean"];
  for (let e = 2; e <= 13; e++){ el("line", {x1: X(10 ** e), y1: T, x2: X(10 ** e), y2: B, stroke: css("--grid"), "stroke-width": 0.5});
    if (e % 2 === 0) el("text", {x: X(10 ** e), y: B + 15, "text-anchor": "middle", "font-size": 11}, sup(e)); }
  for (let e = -16; e <= 2; e += 2){ el("line", {x1: L, y1: Y(10 ** e), x2: R, y2: Y(10 ** e), stroke: css("--grid"), "stroke-width": 0.5});
    el("text", {x: L - 4, y: Y(10 ** e) + 4, "text-anchor": "end", "font-size": 11}, sup(e)); }
  el("rect", {x: L, y: T, width: R - L, height: B - T, fill: "none", stroke: css("--fg")});
  el("text", {x: (L + R) / 2, y: B + 30, "text-anchor": "middle", "font-size": 12}, "κ₂(A)");
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "relatív hiba");
  el("line", {x1: X(1e2), y1: Y(1e2 * EPS), x2: X(1e13), y2: Y(1e13 * EPS), stroke: css("--muted")});
  el("line", {x1: X(1e2), y1: Y(1e4 * EPS), x2: X(1e9), y2: Y(1e18 * EPS), stroke: css("--muted"), "stroke-dasharray": "6 4"});
  el("text", {x: X(2e11), y: Y(2e11 * EPS) - 6, "font-size": 11, fill: css("--muted"), "text-anchor": "end"}, "κε (1-es meredekség)");
  el("text", {x: X(1e6), y: Y(1e12 * EPS) - 8, "font-size": 11, fill: css("--muted"), "text-anchor": "end"}, "κ²ε (2-es meredekség)");
  el("line", {x1: L, y1: Y(1), x2: R, y2: Y(1), stroke: css("--muted"), "stroke-dasharray": "8 3 2 3"});
  el("text", {x: L + 4, y: Y(1) - 4, "font-size": 11, fill: css("--muted")}, "telítődés (1)");
  SER.forEach((s, i) => { const col = css(s.c); let d = "";
    D.forEach(r => { if (r[s.k] !== null) d += (d ? "L" : "M") + X(r.kappa).toFixed(1) + " " + Y(r[s.k]).toFixed(1); else d += " "; });
    // szakadás a szinguláris pontnál
    let pth = "", started = false; D.forEach(r => { if (r[s.k] === null){ started = false; return; } pth += (started ? "L" : "M") + X(r.kappa).toFixed(1) + " " + Y(r[s.k]).toFixed(1); started = true; });
    el("path", {d: pth, fill: "none", stroke: col, "stroke-width": 1.8, "stroke-dasharray": s.d});
    D.forEach(r => { if (r[s.k] !== null) mark(s.m, X(r.kappa), Y(r[s.k]), col, Math.abs(Math.log10(r.sig) - ex) < 0.1);
      else { const x = X(r.kappa), y = Y(30); el("path", {d: `M${x - 5} ${y - 5}l10 10M${x + 5} ${y - 5}l-10 10`, stroke: css("--fg"), "stroke-width": 2}); } });
    el("line", {x1: 440, y1: 225 + i * 18, x2: 470, y2: 225 + i * 18, stroke: col, "stroke-width": 2, "stroke-dasharray": s.d}); mark(s.m, 455, 225 + i * 18, col, false);
    el("text", {x: 476, y: 229 + i * 18, "font-size": 11}, s.n); });
  el("rect", {x: 432, y: 212, width: 180, height: 62, fill: "none", stroke: css("--grid")});
  const r = D.find(q => Math.abs(Math.log10(q.sig) - ex) < 0.1);
  el("line", {x1: X(r.kappa), y1: T, x2: X(r.kappa), y2: B, stroke: css("--hl2"), "stroke-width": 1, "stroke-dasharray": "3 3"});
  const sing = D.some(q => q.normal === null) ? 1 : 0;
  if (sing){ const q = D.find(q => q.normal === null); el("text", {x: X(q.kappa) + 8, y: Y(30) + 4, "font-size": 11}, "szinguláris"); }
  document.getElementById("ev").textContent = String(ex).replace("-", "−");
  status.textContent = `σ_oszl = ${sup(ex)}: κ(A) = ${e10(r.kappa)}, κ(A)² = ${e10(r.kappa * r.kappa)}; relatív hiba – lstsq: ${e10(r.lstsq)}, normálegyenlet: ${e10(r.normal)}, inv: ${e10(r.inv)}` + (noisy ? " (zajos b: az lstsq hibáját az adathiba uralja)." : ".");
}
document.getElementById("e").oninput = e => { ex = +e.target.value; draw(); };
document.getElementById("noisy").onchange = e => { noisy = e.target.checked; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
