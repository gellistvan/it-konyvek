<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FP32, FP16, BF16 kerekítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Bevitel">
<label>érték <input id="x" type="text" value="1e-7" style="width:10em" aria-label="Kerekítendő szám (pl. 1e-7 vagy 0,1)"></label>
<button type="button" data-v="1e-8">1e-8</button><button type="button" data-v="1e-7">1e-7</button>
<button type="button" data-v="1e-5">1e-5</button><button type="button" data-v="0.1">0,1</button>
<button type="button" data-v="65520">65 520</button><button type="button" data-v="3.14159">π≈</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 220" role="img" aria-label="Egy beírt szám FP32, FP16 és BF16 bitmintája, kerekített értéke és relatív hibája"></svg>

<p class="small">Számított: IEEE 754-szerű kerekítés (round-to-nearest-even) a bemenet → FP32 → FP16/BF16 úton, ahogy a torch.tensor(x).half() / .bfloat16() teszi; a statikus ábra szkriptje numpy float16-tal és bitművelettel ellenőrzi. Az FP16 legnagyobb véges értéke 65 504; 65 520-tól +∞.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const F = {FP32: [8, 23], FP16: [5, 10], BF16: [8, 7]};
function f32(x){ return Math.fround(x); }
function rnd(v, eb, mb){
  if (v === 0 || !isFinite(v)) return v;
  const a = Math.abs(v), sg = Math.sign(v), bias = Math.pow(2, eb - 1) - 1, emin = 1 - bias, maxfin = (2 - Math.pow(2, -mb)) * Math.pow(2, bias);
  let e = Math.floor(Math.log2(a)); if (Math.pow(2, e) > a) e--; if (Math.pow(2, e + 1) <= a) e++;
  e = Math.max(e, emin);
  const q = Math.pow(2, e - mb), r = a / q; let n = Math.floor(r); const d = r - n;
  if (d > 0.5 || (d === 0.5 && n % 2 === 1)) n++;
  const res = n * q; return sg * (res > maxfin ? Infinity : res);
}
function bits(v, eb, mb){
  const bias = Math.pow(2, eb - 1) - 1, emin = 1 - bias; let s = (v < 0 || Object.is(v, -0)) ? 1 : 0, a = Math.abs(v), E, M;
  if (!isFinite(a)) { E = Math.pow(2, eb) - 1; M = 0; }
  else if (a === 0) { E = 0; M = 0; }
  else if (a < Math.pow(2, emin)) { E = 0; M = Math.round(a / Math.pow(2, emin - mb)); }
  else { let e = Math.floor(Math.log2(a)); if (Math.pow(2, e) > a) e--; if (Math.pow(2, e + 1) <= a) e++; E = e + bias; M = Math.round((a / Math.pow(2, e) - 1) * Math.pow(2, mb)); }
  return [String(s), E.toString(2).padStart(eb, "0"), M.toString(2).padStart(mb, "0")];
}
function sci(v){ if (v === 0) return "0"; if (!isFinite(v)) return v > 0 ? "+∞ (túlcsordulás)" : "−∞";
  const a = Math.abs(v); if (a >= 1e-3 && a < 1e6) return String(+v.toPrecision(12)).replace(".", ",");
  return v.toExponential(7).replace(".", ",").replace("e", "·10^").replace("+", "").replace("-", "−"); }
function draw(){
  const raw = document.getElementById("x").value.trim().replace(",", ".").replace(/\s/g, "");
  const x = Number(raw);
  svg.innerHTML = "";
  if (!isFinite(x)) { status.textContent = "Nem értelmezhető szám."; return; }
  const x32 = f32(x), rows = [];
  let y = 26;
  el("text", {x: 8, y: 16, "font-size": 12, fill: css("--muted")}, "bemenet → FP32 → FP16 / BF16 (round-to-nearest-even, mint a torch .half() / .bfloat16())");
  ["FP32", "FP16", "BF16"].forEach(name => {
    const [eb, mb] = F[name], v = name === "FP32" ? x32 : rnd(x32, eb, mb), B = bits(v, eb, mb);
    const rel = x === 0 ? 0 : Math.abs(v - x) / Math.abs(x);
    el("text", {x: 8, y: y + 20, "font-size": 14, "font-weight": "bold"}, name);
    let cx = 60; const cw = name === "FP32" ? 16 : 16;
    [[B[0], css("--fill2")], [B[1], css("--fill")], [B[2], css("--cell")]].forEach(([str, fill], part) => {
      for (const ch of str){ el("rect", {x: cx, y: y + 4, width: cw - 1, height: 22, fill: fill, stroke: css("--line"), "stroke-width": part === 0 ? 1.6 : 0.8});
        el("text", {x: cx + cw / 2 - 0.5, y: y + 20, "text-anchor": "middle", "font-size": 12, "font-family": "ui-monospace,monospace"}, ch); cx += cw; }
      cx += 6; });
    el("text", {x: 60, y: y + 44, "font-size": 12}, `érték: ${sci(v)}   relatív hiba: ${x === 0 ? "0" : (isFinite(rel) ? (rel === 0 ? "0" : rel.toExponential(2).replace(".", ",").replace("e", "·10^").replace("-", "−")) : "∞")}` +
      (v === 0 && x !== 0 ? "   → ALULCSORDULT (0)" : "") + (!isFinite(v) && isFinite(x) ? "   → TÚLCSORDULT" : "") +
      (v !== 0 && isFinite(v) && Math.abs(v) < Math.pow(2, 2 - Math.pow(2, eb - 1)) ? "   (szubnormál)" : ""));
    rows.push(`${name}: ${sci(v)}`);
    y += 62;
  });
  el("text", {x: 60, y: y + 4, "font-size": 11, fill: css("--muted")}, "sötét = előjel, középszürke = exponens, világos = mantissza");
  status.textContent = `x = ${sci(x)} → ` + rows.join(" · ");
}
document.getElementById("x").addEventListener("input", draw);
document.querySelectorAll("button[data-v]").forEach(bt => bt.addEventListener("click", () => { document.getElementById("x").value = bt.dataset.v; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
