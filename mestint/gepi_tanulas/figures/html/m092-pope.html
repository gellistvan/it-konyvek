<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POPE-metrikák és igen-hajlam</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
  <label for="tp">igen-hajlam a pozitívokon: TP = <b id="tpv">82</b></label><input id="tp" type="range" min="0" max="100" value="82">
  <label for="fp">igen-hajlam a negatívokon: FP = <b id="fpv">35</b></label><input id="fp" type="range" min="0" max="100" value="35">
</div>
<div class="ctl"><button id="all">mindenre igen</button><button id="ref">szöveg példája</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 290" role="img" aria-label="POPE konfúziós mátrix (TP 82, FP 35, FN 18, TN 65) és öt metrika: precision 0,70, recall 0,82, F1 0,76, accuracy 0,735, yes-arány 0,585."></svg>

<p class="small">100 pozitív és 100 negatív kérdés; szemléltető számpélda, nem mérés. A szaggatott vonal a yes-aránynál 0,5 – a kiegyensúlyozott kérdéskészlet valódi pozitív aránya.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const tpEl = document.getElementById("tp"), fpEl = document.getElementById("fp");
function draw(){
  const tp = +tpEl.value, fp = +fpEl.value, fn = 100 - tp, tn = 100 - fp;
  document.getElementById("tpv").textContent = tp; document.getElementById("fpv").textContent = fp;
  const prec = tp + fp ? tp / (tp + fp) : NaN, rec = tp / 100, f1 = tp ? 2 * tp / (2 * tp + fp + fn) : 0;
  const acc = (tp + tn) / 200, yes = (tp + fp) / 200;
  svg.innerHTML = "";
  const defs = el("defs", {});
  [["h1", 45], ["h2", -45]].forEach(([id, r]) => { const p = el("pattern", {id: id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: `rotate(${r})`}, undefined, defs);
    el("line", {x1: 0, y1: 0, x2: 0, y2: 7, stroke: css("--fg"), "stroke-width": 1.2}, undefined, p); });
  const pd = el("pattern", {id: "dots", width: 7, height: 7, patternUnits: "userSpaceOnUse"}, undefined, defs);
  el("circle", {cx: 3.5, cy: 3.5, r: 1.2, fill: css("--fg")}, undefined, pd);
  const x0 = 110, y0 = 40, c = 100;
  const cells = [[0, 0, "TP", tp, css("--fg")], [0, 1, "FP", fp, "url(#h1)"], [1, 0, "FN", fn, "url(#h2)"], [1, 1, "TN", tn, "url(#dots)"]];
  cells.forEach(([r, q, l, v, f]) => {
    el("rect", {x: x0 + q * c, y: y0 + r * c, width: c, height: c, fill: f, stroke: css("--line"), "stroke-width": 1.5});
    if (l !== "TP") el("rect", {x: x0 + q * c + 22, y: y0 + r * c + 36, width: 56, height: 28, fill: css("--bg")});
    el("text", {x: x0 + q * c + 50, y: y0 + r * c + 56, "text-anchor": "middle", "font-size": 16, "font-weight": "bold", fill: l === "TP" ? css("--bg") : css("--fg")}, `${l}=${v}`);
  });
  el("text", {x: x0 + 50, y: y0 - 10, "text-anchor": "middle", "font-size": 13}, "pozitív (100)");
  el("text", {x: x0 + 150, y: y0 - 10, "text-anchor": "middle", "font-size": 13}, "negatív (100)");
  el("text", {x: x0 - 8, y: y0 + 55, "text-anchor": "end", "font-size": 13}, "modell: igen");
  el("text", {x: x0 - 8, y: y0 + 155, "text-anchor": "end", "font-size": 13}, "modell: nem");
  const names = ["precision", "recall", "F1", "accuracy", "yes-arány"], vals = [prec, rec, f1, acc, yes];
  const bx = 360, by = 250, H = 200, bw = 40;
  el("line", {x1: bx - 10, y1: by, x2: bx + 270, y2: by, stroke: css("--line")});
  [0, 0.5, 1].forEach(t => { el("text", {x: bx - 14, y: by - t * H + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, fmt(t, 1));
    el("line", {x1: bx - 10, y1: by - t * H, x2: bx + 270, y2: by - t * H, stroke: css("--grid"), "stroke-dasharray": "2 3"}); });
  names.forEach((n, i) => { const v = isFinite(vals[i]) ? vals[i] : 0, x = bx + i * 54;
    el("rect", {x: x, y: by - v * H, width: bw, height: v * H, fill: i < 4 ? css("--fill2") : css("--bg"), stroke: css("--line")});
    el("text", {x: x + bw / 2, y: by - v * H - 5, "text-anchor": "middle", "font-size": 12}, fmt(vals[i], i >= 3 ? 3 : 2));
    el("text", {x: x + bw / 2, y: by + 16, "text-anchor": "middle", "font-size": 11}, n); });
  const xr = bx + 4 * 54 - 6;
  el("line", {x1: xr, y1: by - 0.5 * H, x2: xr + bw + 12, y2: by - 0.5 * H, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 3"});
  el("text", {x: bx + 272, y: by - 0.5 * H + 4, "text-anchor": "start", "font-size": 11, fill: css("--muted")}, "0,5");
  status.textContent = `TP = ${tp}, FP = ${fp}, FN = ${fn}, TN = ${tn} → precision ${fmt(prec, 2)}, recall ${fmt(rec, 2)}, F1 ${fmt(f1, 2)}, accuracy ${fmt(acc, 3)}, yes-arány ${fmt(yes, 3)}` + (Math.abs(yes - 0.5) > 0.1 ? " – a yes-arány messze van a 0,5-től: válaszhajlam-torzítás." : ".");
}
tpEl.oninput = draw; fpEl.oninput = draw;
document.getElementById("all").onclick = () => { tpEl.value = 100; fpEl.value = 100; draw(); };
document.getElementById("ref").onclick = () => { tpEl.value = 82; fpEl.value = 35; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
