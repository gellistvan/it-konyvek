<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-fold foldtérképek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button class="sp" data-k="a" onclick="pick('a')">(a) KFold</button><button class="sp" data-k="b" onclick="pick('b')">(b) KFold + shuffle</button><button class="sp" data-k="c" onclick="pick('c')">(c) Stratified (X_imb)</button><button class="sp" data-k="c2" onclick="pick('c2')">(c) KFold (X_imb)</button><button class="sp" data-k="d" onclick="pick('d')">(d) GroupKFold</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Foldtérkép: a sorok a foldok, az oszlopok a minták; a validációs cellák sötétek, a tanító cellák világosak, alatta a címkék és csoportos felosztásnál a csoportazonosítók sávja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A foldok a fejezet kódjainak kimenetei (scikit-learn 1.9.1); más verzióban a keverés eredménye eltérhet. Az L_k értékeket itt nem számoljuk: a lap a felosztás szerkezetét mutatja.</p>

  const sp = SPL[s.sp], n = sp.y.length, K = sp.folds.length, hasG = !!sp.g;
  svg.setAttribute("viewBox", "0 0 640 " + (110 + K * 34 + (hasG ? 40 : 0))); svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), bg = css("--bg"), X0 = 70, W = 550, cw = W / n;
  el("text", {x: 4, y: 18, "font-size": 14, "font-weight": "bold"}, sp.name);
  sp.folds.forEach((v, k) => {
    const yy = 34 + k * 34, vs = new Set(v), cur = (k === s.k);
    el("text", {x: X0 - 8, y: yy + 17, "text-anchor": "end", "font-size": 13, "font-weight": cur ? "bold" : "normal"}, "Fold " + k);
    if (n <= 40) for (let i = 0; i < n; i++) el("rect", {x: X0 + i * cw + 1, y: yy, width: cw - 2, height: 24,
        fill: vs.has(i) ? fg : css("--cellhl"), opacity: (s.k < 0 || s.k >= K || cur) ? 1 : 0.45});
    else { el("rect", {x: X0, y: yy, width: W, height: 24, fill: css("--cellhl"), opacity: (s.k < 0 || s.k >= K || cur) ? 1 : 0.45});
      let d = ""; v.forEach(i => { d += `M${(X0 + i * cw).toFixed(2)},${yy}v24`; });
      el("path", {d: d, stroke: fg, "stroke-width": Math.max(cw, 0.6), opacity: (s.k < 0 || s.k >= K || cur) ? 1 : 0.45}); }
    if (cur) el("rect", {x: X0 - 3, y: yy - 3, width: W + 6, height: 30, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  });
  const ly = 34 + K * 34 + 14;
  el("text", {x: X0 - 8, y: ly + 5, "text-anchor": "end", "font-size": 13}, "y");
  if (n <= 40) sp.y.forEach((c, i) => el("circle", {cx: X0 + (i + 0.5) * cw, cy: ly, r: 6, fill: c ? fg : bg, stroke: fg}));
  else { let d = ""; sp.y.forEach((c, i) => { if (c) d += `M${(X0 + (i + 0.5) * cw).toFixed(2)},${ly - 8}v16`; });
    el("path", {d: d, stroke: fg, "stroke-width": 1}); el("text", {x: X0 + W, y: ly + 26, "text-anchor": "end", "font-size": 12, fill: mu}, "függőleges vonás: y = 1 (pozitív)"); }
  if (hasG) {
    const gy = ly + 18, pats = ["none", "url(#g1)", "url(#g2)", "url(#g3)"];
    const defs = el("defs", {});
    defs.innerHTML = `<pattern id="g1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.2"/></pattern><pattern id="g2" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="${fg}"/></pattern><pattern id="g3" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${fg}" stroke-width="1"/></pattern>`;
    el("text", {x: X0 - 8, y: gy + 15, "text-anchor": "end", "font-size": 13}, "csop.");
    sp.g.forEach((g, i) => el("rect", {x: X0 + i * cw + 1, y: gy, width: cw - 2, height: 20, fill: pats[g], stroke: fg, "stroke-width": 0.8}));
    [0, 1, 2, 3].forEach(g => el("text", {x: X0 + (5 * g + 2.5) * cw, y: gy + 36, "text-anchor": "middle", "font-size": 12}, "csoport " + g));
  }
  if (s.k >= 0 && s.k < K) {
    const v = sp.folds[s.k], yv = v.map(i => sp.y[i]), pos = yv.reduce((a, b) => a + b, 0) / v.length;
    const ph = ["", "validációs fold kiválasztása", "tanítás a többi " + (K - 1) + " foldon (" + (n - v.length) + " minta)", "kiértékelés: L_" + s.k][s.ph];
    let idx = n <= 40 ? "[" + v.join(" ") + "]" : `${v.length} index: [${v.slice(0, 8).join(" ")} …]`;
    let lab = n <= 40 ? ", valid címkék [" + yv.join(" ") + "]" : `, ebből pozitív ${yv.reduce((a, b) => a + b, 0)}`;
    let gtxt = sp.g ? `, valid csoportok {${[...new Set(v.map(i => sp.g[i]))].join(", ")}}, tanító csoportok {${[...new Set(sp.g.filter((g, i) => !v.includes(i)))].join(", ")}}` : "";
    status.textContent = `Fold ${s.k} – ${ph}: valid indexek ${idx}${lab}, pozitív arány ${hu(pos, 3)}${gtxt}`;
  }
}
window.addEventListener("load", () => { document.querySelectorAll("button.sp").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === "a")); show(1); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
