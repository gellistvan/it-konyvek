<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batch méret: áteresztőképesség és késleltetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
  <label for="tf">t_fix = <b id="tfv">0,050</b> ms</label><input id="tf" type="range" min="0" max="1" step="0.005" value="0.05">
  <label for="tm">t_minta alsó korlátja = <b id="tmv">0,0020</b> ms</label><input id="tm" type="range" min="0.0005" max="0.01" step="0.0005" value="0.002">
  <label for="slo">SLO = <b id="slov">0,50</b> ms</label><input id="slo" type="range" min="0.05" max="2" step="0.05" value="0.5">
</div>
<div class="ctl"><label for="meas">Saját mérés (soronként „N; t_batch ms”, pl. 8; 0,09):</label></div>
<div class="ctl"><textarea id="meas" rows="3" style="flex:1;min-width:260px;font:13px ui-monospace,monospace" aria-label="Saját mérés"></textarea>
<button id="reset">alapértékek</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 402" role="img" aria-label="Felső panel: az áteresztőképesség a batch mérettel előbb gyorsan nő, majd telítődik; alsó panel: a kötegidő nő, a vízszintes SLO-vonal kijelöli a legnagyobb megengedett batch méretet."></svg>

<p class="small">Analitikus modell, nem mérés: t_batch(N) = t_fix + N·max(t_min; 0,02/N). Alapértékek: t_fix = 0,05 ms, t_min = 0,002 ms; N = 1: 0,07 ms, Q ≈ 14,3; N = 64: 0,178 ms, Q ≈ 359,6 minta/ms. A saját mérésed (×) görbéje ettől eltér.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const NB = [1, 2, 4, 8, 16, 32, 64, 128, 256], C = 0.02;
const g = id => document.getElementById(id);
function tb(n, tf, tm){ return tf + n * Math.max(tm, C / n); }
function meas(){ return g("meas").value.split(/\n/).map(l => l.trim()).filter(l => l).map(l => l.split(/[;\t ]+/).map(x => parseFloat(x.replace(",", ".")))).filter(p => p.length >= 2 && p[0] >= 1 && isFinite(p[1]) && p[1] > 0); }
function draw(){
  const tf = +g("tf").value, tm = +g("tm").value, slo = +g("slo").value;
  g("tfv").textContent = fmt(tf, 3); g("tmv").textContent = fmt(tm, 4); g("slov").textContent = fmt(slo, 2);
  const T = NB.map(n => tb(n, tf, tm)), Q = NB.map((n, i) => n / T[i]), M = meas();
  const ok = NB.filter((n, i) => T[i] <= slo), nslo = ok.length ? Math.max(...ok) : null;
  svg.innerHTML = "";
  const L = 70, R = 610, lx = n => L + Math.log2(n) / 8 * (R - L);
  const qmax = Math.max(...Q, ...M.map(p => p[0] / p[1])) * 1.12, tmax = Math.max(...T, slo, ...M.map(p => p[1])) * 1.12;
  const panels = [[20, 170, qmax, "Q(N) [minta/ms]", Q, "-", 1], [210, 360, tmax, "t_batch(N) [ms]", T, "6 4", 0]];
  panels.forEach(([y0, y1, mx, lab, V, dash, isQ]) => {
    const yy = v => y1 - v / mx * (y1 - y0);
    [0, 0.25, 0.5, 0.75, 1].forEach(f => { el("line", {x1: L, x2: R, y1: yy(f * mx), y2: yy(f * mx), stroke: css("--grid")});
      el("text", {x: L - 6, y: yy(f * mx) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, fmt(f * mx, isQ ? 0 : 2)); });
    el("text", {x: 12, y: (y0 + y1) / 2, "font-size": 12, transform: `rotate(-90 12 ${(y0 + y1) / 2})`, "text-anchor": "middle"}, lab);
    el("polyline", {points: NB.map((n, i) => `${lx(n)},${yy(V[i])}`).join(" "), fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": dash});
    NB.forEach((n, i) => isQ ? el("circle", {cx: lx(n), cy: yy(V[i]), r: 4, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5})
      : el("rect", {x: lx(n) - 4, y: yy(V[i]) - 4, width: 8, height: 8, fill: css("--fill2"), stroke: css("--fg")}));
    M.forEach(p => { const v = isQ ? p[0] / p[1] : p[1];
      el("text", {x: lx(p[0]), y: yy(v) + 5, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "×"); });
    if (!isQ) { el("line", {x1: L, x2: R, y1: yy(slo), y2: yy(slo), stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "2 3"});
      el("text", {x: L + 4, y: yy(slo) - 4, "font-size": 11, fill: css("--hl")}, `SLO ${fmt(slo, 2)} ms`);
      if (nslo) el("circle", {cx: lx(nslo), cy: yy(T[NB.indexOf(nslo)]), r: 9, fill: "none", stroke: css("--hl"), "stroke-width": 2}); }
  });
  NB.forEach(n => el("text", {x: lx(n), y: 378, "text-anchor": "middle", "font-size": 11}, String(n)));
  el("text", {x: (L + R) / 2, y: 396, "text-anchor": "middle", "font-size": 12}, "batch méret N (log₂ skála)");
  const i1 = 0, i64 = NB.indexOf(64);
  status.textContent = `N = 1: t_batch = ${fmt(T[i1], 3)} ms, Q ≈ ${fmt(Q[i1], 1)} minta/ms; N = 64: t_batch = ${fmt(T[i64], 3)} ms, Q ≈ ${fmt(Q[i64], 1)} minta/ms; ` +
    (nslo ? `a legnagyobb N az SLO-n belül: ${nslo} (${fmt(T[NB.indexOf(nslo)], 3)} ms).` : "egyik N sem fér az SLO alá.") + (M.length ? ` Saját mérés: ${M.length} pont (×).` : "");
}
["tf", "tm", "slo"].forEach(id => g(id).oninput = draw);
g("meas").oninput = draw;
g("reset").onclick = () => { g("tf").value = 0.05; g("tm").value = 0.002; g("slo").value = 0.5; g("meas").value = ""; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
