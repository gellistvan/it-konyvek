<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centrált és hátranéző mozgóablak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>ablak = <span id="wv">5</span> <input id="w" type="range" min="3" max="9" value="5" oninput="show(k)" aria-label="ablakméret"></label><label><input id="ct" type="checkbox" checked onchange="show(k)"> center=True</label><label>split <select id="sp" onchange="show(k)"><option value="time">időbeli (14 | 15)</option><option value="rand">véletlen</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idősor; a kiemelt naphoz tartozó ablak cellái alatta. Centrált ablaknál a kiemelt nap után is két napot fed le, hátranézőnél csak a korábbi napokat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">20 napos véletlen bolyongás (default_rng(0)). A lépés a kiemelt napot (2–17) választja; a kezdőállapot a 14. nap, 5-ös centrált ablak. A pandas rolling ablaka center=True mellett [t − w//2, t + (w − 1)//2], egyébként [t − w + 1, t]; hiányos ablaknál NaN. Számított példa.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 2, "line": 1, "msg": ""}, {"t": 3, "line": 1, "msg": ""}, {"t": 4, "line": 1, "msg": ""}, {"t": 5, "line": 1, "msg": ""}, {"t": 6, "line": 1, "msg": ""}, {"t": 7, "line": 1, "msg": ""}, {"t": 8, "line": 1, "msg": ""}, {"t": 9, "line": 1, "msg": ""}, {"t": 10, "line": 1, "msg": ""}, {"t": 11, "line": 1, "msg": ""}, {"t": 12, "line": 1, "msg": ""}, {"t": 13, "line": 1, "msg": ""}, {"t": 14, "line": 1, "msg": ""}, {"t": 15, "line": 1, "msg": ""}, {"t": 16, "line": 1, "msg": ""}, {"t": 17, "line": 1, "msg": ""}];
const CODE = ["s = df['y']                                   # napi sor, 20 nap", "feat = s.rolling(5, center=True).mean()      # a 14. napon a 12–16. nap átlaga"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const S = [0.1257, -0.0064, 0.634, 0.7389, 0.2033, 0.5649, 1.8689, 2.816, 2.1122, 0.8468, 0.2235, 0.2648, -2.0602, -2.279, -3.5249, -4.2572, -4.8014, -5.1177, -4.7061, -3.6636], RT = [0, 2, 7, 8, 12, 17];

function fmt(x, d){ let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
const V = id => document.getElementById(id);
function win(t, w, c){ return c ? [t - Math.floor(w / 2), t + Math.floor((w - 1) / 2)] : [t - w + 1, t]; }
function isTest(d){ return V("sp").value === "time" ? d > 14 : RT.includes(d); }
window.addEventListener("load", () => show(12));   // kezdőállapot: a 14. nap
function render(s){
  const t = s.t, w = +V("w").value, c = V("ct").checked;
  V("wv").textContent = w;
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="ph" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${fg}" stroke-width="1"/></pattern>`
    + `<pattern id="pd" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="${fg}"/></pattern>`;
  const X0 = 40, DX = 29, lo = Math.min(...S) - 0.3, hi = Math.max(...S) + 0.3, ty = v => 40 + (hi - v) / (hi - lo) * 140, tx = d => X0 + d * DX;
  // split-jelölés
  for (let d = 0; d < 20; d++) if (isTest(d)) el("rect", {x: tx(d) - DX/2, y: 28, width: DX, height: 160, fill: css("--cellhl"), opacity: 0.6});
  if (V("sp").value === "time") { el("line", {x1: tx(14.5), y1: 22, x2: tx(14.5), y2: 270, stroke: fg, "stroke-width": 3}); el("text", {x: tx(14.5) + 4, y: 20, "font-size": 12}, "t_cut"); }
  el("text", {x: X0, y: 16, "font-size": 12, fill: mu}, "szürke háttér = tesztnap" + (V("sp").value === "rand" ? " (véletlen split, seed 1)" : " (időbeli split)"));
  let p = ""; S.forEach((v, d) => p += (d ? "L" : "M") + tx(d) + "," + ty(v).toFixed(1));
  el("path", {d: p, fill: "none", stroke: mu, "stroke-width": 1.4});
  S.forEach((v, d) => el("circle", {cx: tx(d), cy: ty(v), r: 2.6, fill: mu}));
  const [a, b] = win(t, w, c);
  for (let d = Math.max(0, a); d <= Math.min(19, b); d++) el("rect", {x: tx(d) - DX/2 + 1, y: 200, width: DX - 2, height: 24, fill: d === t ? fg : (d > t ? "url(#pd)" : "url(#ph)"), stroke: fg, "stroke-width": 0.8});
  for (let d = 0; d < 20; d++) el("text", {x: tx(d), y: 244, "text-anchor": "middle", "font-size": 11, "font-weight": d === t ? "bold" : "normal"}, String(d));
  el("text", {x: X0 + 10 * DX, y: 262, "text-anchor": "middle", "font-size": 12}, "nap");
  const ok = a >= 0 && b < 20, nf = Math.max(0, Math.min(19, b) - t);
  let val = NaN; if (ok) { let sm = 0; for (let d = a; d <= b; d++) sm += S[d]; val = sm / w; el("rect", {x: tx(t) - 6, y: ty(val) - 6, width: 12, height: 12, transform: `rotate(45 ${tx(t)} ${ty(val)})`, fill: css("--bg"), stroke: fg, "stroke-width": 2}); }
  let nt = 0; if (!isTest(t)) for (let d = Math.max(0, a); d <= Math.min(19, b); d++) if (isTest(d)) nt++;
  status.textContent = `${t}. nap (${isTest(t) ? "tesztnap" : "tanítónap"}), ablak ${w}, center=${c ? "True" : "False"}: a jellemző a(z) ${a}. naptól a(z) ${b}. napig használ adatot` + (ok ? "" : " (hiányos ablak → NaN)") + `; ebből ${nf} nap a predikció pillanata után` + (nt ? `; ${nt} tesztnap kerül ennek a tanítósornak a jellemzőjébe` : "") + (ok ? `; érték = ${fmt(val, 3)}.` : ".");
  const L1 = document.getElementById("L1");
  if (L1) L1.textContent = `feat = s.rolling(${w}${c ? ", center=True" : ""}).mean()      # a ${t}. napon a ${a}–${b}. nap átlaga`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
