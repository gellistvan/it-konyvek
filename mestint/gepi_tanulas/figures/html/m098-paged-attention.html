<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PagedAttention blokktábla</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
  <button id="gx">X: token generálása</button><button id="gy">Y: token generálása</button>
  <button id="dx">X kész</button><button id="dy">Y kész</button><button id="rs">alapállapot</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 278" role="img" aria-label="Bal oldalon két 16 cellás sáv sok üres cellával; jobb oldalon nem szomszédos fizikai blokkok, amelyeket egy blokktábla rendel a két kérés logikai blokkjaihoz."></svg>

<p class="small">Szemléltető modell (nem a vLLM kódja): blokkméret 4 token, 8 fizikai blokk, max_model_len = 16; az új blokk a legkisebb sorszámú szabad blokk. Sraffozott = lefoglalt, de üres cella; szaggatott keret = szabad blokk.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const BS = 4, MAXLEN = 16, NP = 8, INIT = {"X": {"n": 10, "table": [5, 1, 7], "done": false}, "Y": {"n": 6, "table": [2, 6], "done": false}};
let R;
function reset(){ R = JSON.parse(JSON.stringify(INIT)); draw("Alapállapot: X 10 token [5, 1, 7], Y 6 token [2, 6]."); }
function freeList(){ const used = new Set(); for (const k in R) R[k].table.forEach(b => used.add(b)); return [...Array(NP).keys()].filter(b => !used.has(b)); }
function gen(k){ const r = R[k];
  if (r.done) return draw(`${k} már befejeződött (blokkjai felszabadultak).`);
  if (r.n >= MAXLEN) return draw(`${k} elérte a max_model_len = ${MAXLEN} tokent.`);
  let msg = "";
  if (r.n % BS === 0) { const f = freeList(); if (!f.length) return draw("Nincs szabad fizikai blokk – a kiszolgálónak preempcióval kellene helyet csinálnia.");
    r.table.push(f[0]); msg = ` A ${r.table.length - 1}. logikai blokk megtelt → új fizikai blokk: ${f[0]}.`; }
  r.n += 1; draw(`${k}: +1 token (${r.n}).` + msg); }
function done(k){ const r = R[k]; const fr = r.table.slice(); r.table = []; r.n = 0; r.done = true; draw(`${k} kész: felszabadult blokkok [${fr.join(", ")}].`); }
function draw(msg){
  svg.innerHTML = "";
  const col = {X: css("--fill2"), Y: css("--fill")};
  const defs = el("defs", {}), pat = el("pattern", {id: "hh", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--fg"), "stroke-width": 1}, undefined, pat);
  el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, "Folytonos előfoglalás (16 token/kérés)");
  let contig = 0;
  ["X", "Y"].forEach((k, q) => { const r = R[k], y = 40 + q * 60;
    el("text", {x: 10, y: y + 18, "font-size": 14, "font-weight": "bold"}, k);
    for (let c = 0; c < MAXLEN; c++) { const used = c < r.n;
      el("rect", {x: 30 + c * 16, y: y, width: 16, height: 26, fill: r.done ? css("--bg") : (used ? col[k] : "url(#hh)"), stroke: css("--line"), "stroke-width": 0.6}); }
    if (!r.done) contig += MAXLEN - r.n;
    el("text", {x: 30, y: y + 44, "font-size": 12, fill: css("--muted")}, r.done ? "kész – a sáv felszabadult" : `${r.n} token, ${MAXLEN - r.n} kihasználatlan`); });
  el("text", {x: 10, y: 180, "font-size": 13}, `kihasználatlan cella: ${contig}`);
  el("text", {x: 330, y: 20, "font-size": 14, "font-weight": "bold"}, "PagedAttention (blokk = 4 token)");
  const owner = {}; let paged = 0;
  ["X", "Y"].forEach(k => R[k].table.forEach((pb, lb) => { const fill = Math.min(BS, R[k].n - lb * BS); owner[pb] = [k, lb, fill]; paged += BS - fill; }));
  for (let pb = 0; pb < NP; pb++) { const y = 34 + pb * 26;
    el("text", {x: 512, y: y + 16, "text-anchor": "end", "font-size": 12}, String(pb));
    for (let c = 0; c < BS; c++) { const o = owner[pb];
      el("rect", {x: 518 + c * 18, y: y, width: 18, height: 20, fill: o ? (c < o[2] ? col[o[0]] : "url(#hh)") : css("--bg"), stroke: o ? css("--line") : css("--muted"), "stroke-width": 0.8, "stroke-dasharray": o ? "" : "3 2"}); }
    el("text", {x: 596, y: y + 15, "font-size": 12, fill: owner[pb] ? css("--fg") : css("--muted")}, owner[pb] ? `${owner[pb][0]}/${owner[pb][1]}` : "szabad"); }
  el("text", {x: 330, y: 44, "font-size": 12, fill: css("--muted")}, "blokktábla");
  let i = 0;
  ["X", "Y"].forEach(k => R[k].table.forEach((pb, lb) => { const y = 54 + i * 22; i++;
    el("rect", {x: 330, y: y, width: 90, height: 18, fill: col[k], stroke: css("--line"), "stroke-width": 0.6});
    el("text", {x: 336, y: y + 13, "font-size": 12}, `${k}: ${lb} → ${pb}`);
    el("line", {x1: 420, y1: y + 9, x2: 494, y2: 34 + pb * 26 + 10, stroke: css("--fg"), "stroke-width": 1, "stroke-dasharray": k === "Y" ? "4 3" : ""}); }));
  const fl = freeList();
  el("text", {x: 330, y: 254, "font-size": 13}, `foglalt blokk: ${NP - fl.length}, szabad: ${fl.length} [${fl.join(", ")}]`);
  el("text", {x: 330, y: 270, "font-size": 13}, `kihasználatlan cella: ${paged}`);
  status.textContent = `${msg} Blokktábla: X [${R.X.table.join(", ")}], Y [${R.Y.table.join(", ")}]; kihasználatlan cella: blokkos ${paged}, folytonos előfoglalásnál ${contig}.`;
}
document.getElementById("gx").onclick = () => gen("X"); document.getElementById("gy").onclick = () => gen("Y");
document.getElementById("dx").onclick = () => done("X"); document.getElementById("dy").onclick = () => done("Y");
document.getElementById("rs").onclick = reset;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw(status.textContent.split(" Blokktábla")[0]));
reset();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
