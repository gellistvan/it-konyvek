  el("line", {x1: tx(0), y1: ty(0), x2: tx(1), y2: ty(1), stroke: fg, "stroke-dasharray": "2 4"});

["nb", "st", "s_base", "s_cal"].forEach(id => document.getElementById(id).addEventListener("change", () => { sel = null; draw(); }));
