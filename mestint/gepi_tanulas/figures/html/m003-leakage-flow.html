<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szivárgó és helyes előfeldolgozási sorrend</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalon a skálázó a teljes adaton illesztődik, ezért a teszt átlaga és szórása is bekerül; jobb oldalon előbb vágunk, és a skálázó csak a 800 tanítómintán illesztődik; alul a Pipeline foldonkénti illesztése."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti ábra (nincs mért adat). Szaggatott keret: a szándékosan hibás ág; folytonos: a helyes ág. A kódpanel a 2.3.5.1 két kódblokkja; a kiemelt sorok az aktuális lépéshez tartoznak (a hibás blokk egyetlen sora a 2–3. lépés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 1, "line": 13, "more": [14], "msg": "1. lépés – mindkét ág a teljes X-ből indul (1000 × 10)."}, {"st": 2, "line": 16, "more": [17, 18, 2], "msg": "2. lépés – hibás: a skálázó a TELJES adaton illesztődik (μ, σ a tesztsorokat is tartalmazza); helyes: előbb vágunk."}, {"st": 3, "line": 19, "more": [2], "msg": "3. lépés – hibás: transform(X); helyes: a fit csak a 800 tanítósoron fut (μ_train, σ_train), a tesztből nincs információáramlás."}, {"st": 4, "line": 19, "more": [20], "msg": "4. lépés – hibás: csak most vágunk; helyes: a tanító- és a tesztrész is a μ_train, σ_train paraméterekkel transzformálódik."}, {"st": 5, "line": 19, "more": [20], "msg": "5. lépés – hibás: a teszt statisztikája már benne van a skálázóban (szivárgás); helyes: LR.fit a tanítón, predict_proba a teszten. Pipeline + CV-nél ugyanez foldonként."}];
const CODE = ["# SZÁNDÉKOSAN HIBÁS – a skálázó a teljes adaton illesztődik, mielőtt vágnánk", "from sklearn.preprocessing import StandardScaler", "X_leak = StandardScaler().fit_transform(X)       # a teszt adat átlaga/szórása is bekerül", "", "# Helyes: előbb vágás, a pipeline fit csak a tanítón fut (nem futtatva)", "from sklearn.datasets import make_classification", "from sklearn.linear_model import LogisticRegression", "from sklearn.metrics import roc_auc_score", "from sklearn.model_selection import train_test_split", "from sklearn.pipeline import make_pipeline", "from sklearn.preprocessing import StandardScaler", "", "SEED = 42", "X, y = make_classification(n_samples=1000, n_features=10, n_informative=8,", "                           n_redundant=0, random_state=SEED)", "model = make_pipeline(StandardScaler(), LogisticRegression(max_iter=1000))", "X_train, X_test, y_train, y_test = train_test_split(", "    X, y, test_size=0.2, random_state=SEED, stratify=y", ")", "model.fit(X_train, y_train)      # a StandardScaler itt, csak a tanítón illesztődik", "test_pred = model.predict_proba(X_test)[:, 1]", "print(\"teszt ROC AUC:\", roc_auc_score(y_test, test_pred))   # csak a sorrendet szemlélteti"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return Number(v).toFixed(d).replace(".", ",").replace("-", "−"); }
function patterns(){
  const defs = document.createElementNS(NS, "defs"), f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<pattern id="pdense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${f}" stroke-width="1"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
}

const G = {"W": 900, "H": 600, "FS": 16.5, "nodes": [["L1", 60, 52, 280, 46, "Teljes X (1000×10)", "L", 1], ["L2", 60, 124, 280, 58, "StandardScaler.fit(X):\nμ, σ a teljes adatból", "L", 2], ["L3", 60, 208, 280, 46, "transform(X) → X_leak", "L", 3], ["L4", 60, 280, 280, 46, "train_test_split", "L", 4], ["L5a", 60, 352, 130, 46, "Train 800", "L", 5], ["L5b", 210, 352, 130, 46, "Test 200", "L", 5], ["R1", 480, 52, 390, 46, "Teljes X (1000×10)", "R", 1], ["R2", 480, 124, 390, 46, "train_test_split(stratify=y)", "R", 2], ["R3a", 480, 226, 200, 58, "Train 800 → fit:\nμ_train, σ_train", "R", 3], ["R3b", 720, 226, 150, 58, "Test 200", "R", 3], ["R4", 480, 308, 390, 46, "transform(μ_train, σ_train)", "R", 4], ["R5a", 480, 378, 180, 58, "LR.fit(train)", "R", 5], ["R5b", 680, 378, 190, 58, "LR.predict_proba\n(test)", "R", 5]], "edges": [[[[200.0, 98], [200.0, 124]], "dash", 2], [[[200.0, 182], [200.0, 208]], "dash", 3], [[[200.0, 254], [200.0, 280]], "dash", 4], [[[140.0, 326], [125.0, 352]], "dash", 5], [[[275.0, 326], [275.0, 352]], "dash", 5], [[[340, 375], [385, 375], [385, 153], [340, 153]], "leak", 5], [[[675.0, 98], [675.0, 124]], "solid", 2], [[[580.0, 170], [580.0, 226]], "solid", 3], [[[795.0, 170], [795.0, 226]], "solid", 3], [[[720, 255], [680, 255]], "cross", 3], [[[580.0, 284], [580.0, 308]], "solid", 4], [[[795.0, 284], [795.0, 308]], "solid", 4], [[[570.0, 354], [570.0, 378]], "solid", 5], [[[775.0, 354], [775.0, 378]], "solid", 5]], "texts": [[200, 30, "SZÁNDÉKOSAN HIBÁS", 17.5, "middle", 0, "bold"], [675, 30, "HELYES", 17.5, "middle", 0, "bold"], [412, 264, "a teszt statisztikája bekerül", 16.0, "middle", 5, "rot"], [690, 187, "nincs információ-", 16.0, "middle", 3, ""], [690, 207, "áramlás a tesztből", 16.0, "middle", 3, ""], [450, 458, "Pipeline + cross_val_score: minden foldon a scaler csak a 4/5 tanítórészen illesztődik", 16.5, "middle", 5, ""]], "fy": 472, "fh": 20};
window.addEventListener("load", () => show(4));
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${G.W} ${G.H}`); patterns();
  (s.more || []).forEach(i => { const L = document.getElementById("L" + i); if (L) L.classList.add("on"); });
  const on = st => st <= s.st, cur = st => st === s.st;
  G.edges.forEach(([pts, st, step]) => {
    if (!on(step)) return;
    const w = st === "leak" ? 3.2 : (cur(step) ? 2.4 : 1.4), col = cur(step) ? css("--hl2") : css("--fg");
    el("polyline", {points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: col, "stroke-width": w,
      "stroke-dasharray": st === "solid" || st === "cross" ? "" : "7 4"});
    const [p, q] = [pts[pts.length - 2], pts[pts.length - 1]], a = Math.atan2(q[1] - p[1], q[0] - p[0]);
    el("path", {d: `M${q[0]} ${q[1]} L${q[0] - 11 * Math.cos(a - 0.4)} ${q[1] - 11 * Math.sin(a - 0.4)} L${q[0] - 11 * Math.cos(a + 0.4)} ${q[1] - 11 * Math.sin(a + 0.4)} Z`, fill: col});
    if (st === "cross") { const mx = (pts[0][0] + pts[1][0]) / 2, my = (pts[0][1] + pts[1][1]) / 2;
      el("path", {d: `M${mx - 7} ${my - 9} L${mx + 7} ${my + 9} M${mx - 7} ${my + 9} L${mx + 7} ${my - 9}`, stroke: col, "stroke-width": 2.4}); }
  });
  G.nodes.forEach(([id, x, y, w, h, lab, br, st]) => {
    const vis = on(st);
    el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: cur(st) ? css("--cellhl") : (br === "R" ? css("--cell") : css("--code")),
      stroke: vis ? css("--fg") : css("--muted"), "stroke-width": cur(st) ? 3 : 1.5, "stroke-dasharray": br === "L" ? "7 4" : "", opacity: vis ? 1 : 0.25});
    lab.split("\n").forEach((t, i, A) => el("text", {x: x + w / 2, y: y + h / 2 + 6 + (i - (A.length - 1) / 2) * 19, "text-anchor": "middle", "font-size": G.FS, opacity: vis ? 1 : 0.25}, t));
  });
  G.texts.forEach(([x, y, t, fs, anc, st, ex]) => { if (!on(st)) return;
    const a = {x: x, y: y + 6, "text-anchor": anc, "font-size": fs}; if (ex === "bold") a["font-weight"] = "bold";
    if (ex === "rot") a.transform = `rotate(-90 ${x} ${y})`;
    el("text", a, t); });
  if (on(5)) for (let r = 0; r < 5; r++) { const y = G.fy + r * (G.fh + 3);
    el("text", {x: 196, y: y + 15, "text-anchor": "end", "font-size": G.FS - 1}, `${r + 1}. split`);
    for (let j = 0; j < 5; j++) el("rect", {x: 205 + j * 62, y: y, width: 60, height: G.fh, fill: j === r ? "url(#pdiag)" : css("--cell"), stroke: css("--fg")});
  }
  if (on(5)) { el("rect", {x: 540, y: G.fy + 8, width: 26, height: G.fh, fill: css("--cell"), stroke: css("--fg")}); el("text", {x: 574, y: G.fy + 23, "font-size": G.FS - 1}, "tanítórész: scaler.fit + transform");
    el("rect", {x: 540, y: G.fy + 48, width: 26, height: G.fh, fill: "url(#pdiag)", stroke: css("--fg")}); el("text", {x: 574, y: G.fy + 63, "font-size": G.FS - 1}, "validációs fold: csak transform"); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
