<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI/CT pipeline és registry</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="st_prev" type="button">◀ Lépés</button><button id="st_next" type="button">Lépés ▶</button><input id="st" type="range" min="0" max="7" value="0" aria-label="Lépés"><span id="st_cnt" class="small"></span><label>kapu <select id="gate"><option value="ok">átmegy</option><option value="fail">elbukik</option></select></label><label>champion <select id="champ"><option value="v3">v3 (kiadva)</option><option value="rb">v2 (visszagörgetve)</option></select></label></div>
<div class="ctl"><label>mért accuracy <input id="acc" type="range" min="0.70" max="1.00" step="0.01" value="0.93" aria-label="Mért accuracy"> <b id="accv">0,93</b></label><button id="rel" type="button">Kiadás</button><button id="rbk" type="button">Visszagörgetés</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 560" role="img" aria-label="Folyamatábra: commit, teszt, adatkontraktus, tanítás, naplózás, kiadási kapu; csak a kapun átment modell kap registry-verziót; a kiadás és a visszagörgetés a champion alias átállítása"></svg>

const CODE = ["Step(name=\"checkout\", cmd=\"git clone ...\")", "Step(name=\"pytest\", cmd=\"pytest tests/ -q\")", "check_contract(X)   # séma: 4 oszlop, címkék {0, 1, 2}; ValueError → a CI leáll", "model = RandomForestClassifier(n_estimators=100, random_state=RANDOM_STATE)", "model.fit(X_train, y_train)", "acc = accuracy_score(y_test, y_pred); mlflow.log_metric(\"accuracy\", acc)", "mlflow.sklearn.log_model(sk_model=model, artifact_path=\"model\", signature=signature)", "if acc >= MIN_ACC:   # MIN_ACC = 0.8", "    mv = mlflow.register_model(f\"runs:/{run.info.run_id}/model\", MODEL_NAME)", "    client.set_registered_model_alias(MODEL_NAME, \"candidate\", mv.version)", "# kiadás (emberi jóváhagyás után):", "client.set_registered_model_alias(MODEL_NAME, \"champion\", mv.version)", "# visszagörgetés: client.set_registered_model_alias(MODEL_NAME, \"champion\", \"2\")"], STEP_LINES = {"1": [0], "2": [1], "3": [2], "4": [3, 4], "5": [5, 6], "6": [7], "7": [8, 9], "8": [10, 11]}, MIN_ACC = 0.8;
["gate", "champ"].forEach(i => document.getElementById(i).closest("label").style.display = "none");
const pre = document.createElement("pre"); pre.className = "cmd"; pre.id = "code"; pre.setAttribute("aria-label", "Kód");
pre.innerHTML = CODE.map((l, i) => `<span id="L${i}" style="display:block;padding:0 4px">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
document.getElementById("v").after(pre);
const acc = document.getElementById("acc");
acc.addEventListener("input", () => { document.getElementById("accv").textContent = (+acc.value).toFixed(2).replace(".", ",");
  setCtl("gate", +acc.value >= MIN_ACC - 1e-9 ? "ok" : "fail"); });
document.getElementById("rel").onclick = () => { const s = document.getElementById("st"); s.value = 7; setCtl("champ", "v3"); };
document.getElementById("rbk").onclick = () => { const s = document.getElementById("st"); s.value = 7; setCtl("champ", "rb"); };
post = function(D, vals){
  let lines = STEP_LINES[vals.st];
  if (vals.gate === "fail" && +vals.st >= 7) lines = [7];
  if (vals.gate === "ok" && vals.st === "8" && vals.champ === "rb") lines = [12];
  CODE.forEach((_, i) => { const s = document.getElementById("L" + i); const on = lines.includes(i);
    s.style.outline = on ? "2px solid " + dg_css("--hl") : "none"; s.style.fontWeight = on ? "bold" : "normal"; });
  const a = (+acc.value).toFixed(2).replace(".", ",");
  if (+vals.st >= 6) statusEl.textContent += ` (mért accuracy: ${a})`;
  if (vals.gate === "fail" && document.activeElement && document.activeElement.id === "rel") statusEl.textContent += " Kiadás nem lehetséges: nincs v3.";
};

function draw(){
  const vals={}; CONTROLS.forEach(c=>vals[c.id]=ctlVal(c));
  CONTROLS.filter(c=>c.type==="step").forEach(c=>{document.getElementById(c.id+"_cnt").textContent=
     (+document.getElementById(c.id).value+1)+"/"+c.options.length+" – "+c.options[+document.getElementById(c.id).value][1];});
  const S=STATES[CONTROLS.filter(c=>c.id!==STAGE_CTL).map(c=>vals[c.id]).join("|")];
  const D=JSON.parse(JSON.stringify(S.D));
  if(STAGE_CTL){const sv=+vals[STAGE_CTL];
    ["nodes","edges","texts"].forEach(f=>{D[f]=(D[f]||[]).filter(o=>!(o.stage>sv));
      D[f].forEach(o=>{if(o.stage===sv){if(f==="texts")o.bold=true; else o.hl=true;}});});}
  const out=dg_draw(svgEl,D);
  [...D.nodes,...D.edges].forEach(o=>{ if(o.act&&out[o.id]){const g=out[o.id];
     g.setAttribute("data-act","1"); g.setAttribute("tabindex","0"); g.setAttribute("role","button");
     g.setAttribute("aria-label",o.actlabel||o.id);
     const f=()=>setCtl(o.act.ctl,o.act.val); g.addEventListener("click",f);
     g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});}});
  statusEl.textContent=(S.msgs&&STAGE_CTL)?S.msgs[+vals[STAGE_CTL]]:S.msg;
  const ce=document.getElementById("cmd"); if(ce)ce.textContent=S.cmd||"";
  if(post)post(D,vals,out);
}
CONTROLS.forEach(c=>{const e=document.getElementById(c.id);
  e.addEventListener(c.type==="step"?"input":"change",draw);
  if(c.type==="step"){const n=c.options.length;
    document.getElementById(c.id+"_prev").onclick=()=>{e.value=Math.max(0,+e.value-1);draw();};
    document.getElementById(c.id+"_next").onclick=()=>{e.value=Math.min(n-1,+e.value+1);draw();};}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
// kezdőállapot URL-hashből (pl. #st=4&miss=1) – ellenőrzéshez/hivatkozáshoz
try{(location.hash||"").slice(1).split("&").forEach(p=>{const [a,b]=p.split("="); const c=CONTROLS.find(x=>x.id===a);
  if(!c||b===undefined)return; const e=document.getElementById(a);
  if(c.type==="step")e.value=+b; else if(c.type==="check")e.checked=(b==="1"); else e.value=decodeURIComponent(b);});}catch(err){}
draw();
</script>
