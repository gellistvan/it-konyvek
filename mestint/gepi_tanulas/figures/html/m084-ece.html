<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megbízhatósági diagram és ECE</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>binek száma M = <span id="Mv">5</span> <input id="M" type="range" min="5" max="15" value="5"></label><button id="q6">6. kérdés</button><button id="rs">Alapállapot</button><span class="small">Húzd az oszlop tetejét (acc) vagy a hisztogram oszlopát (|B_m|); billentyű: ←/→ bin, ↑/↓ acc, +/− mintaszám.</span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 420" role="img" aria-label="Öt oszlop a binek pontosságával, mellettük az átló a tökéletes kalibrációhoz; a legfelső binben a 0,9-es konfidenciához 0,7-es pontosság tartozik, a hozzájárulás 0,02; az ECE 0,056."></svg>

<p class="small">Szintetikus adat (N = 100, M = 5), nem mérés. M ≠ 5 esetén a binek a [0,5; 1] tartomány egyenletes felosztásai, conf = binközép, acc = conf − 0,05 kezdőértékkel.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const D = {"bins": [{"lo": 0.5, "hi": 0.6, "n": 30, "conf": 0.55, "acc": 0.53}, {"lo": 0.6, "hi": 0.7, "n": 25, "conf": 0.65, "acc": 0.6}, {"lo": 0.7, "hi": 0.8, "n": 20, "conf": 0.75, "acc": 0.7}, {"lo": 0.8, "hi": 0.9, "n": 15, "conf": 0.85, "acc": 0.8}, {"lo": 0.9, "hi": 1.0, "n": 10, "conf": 0.9, "acc": 0.7}], "ece": 0.05600000000000002};

let B = JSON.parse(JSON.stringify(D.bins)), sel = 4, steps6 = null;
const X0 = 70, Y0 = 20, W = 520, H = 250, HY = 310, HH = 70;
function tx(v){ return X0 + (v - 0.5) / 0.5 * W; }
function ty(v){ return Y0 + H - (v - 0.4) / 0.6 * H; }
function reset(M){
  B = [];
  for (let m = 0; m < M; m++) { const lo = 0.5 + 0.5 * m / M, hi = 0.5 + 0.5 * (m + 1) / M, c = (lo + hi) / 2;
    B.push({lo: lo, hi: hi, n: Math.round(100 / M), conf: Math.round(c * 1000) / 1000, acc: Math.round((c - 0.05) * 100) / 100}); }
  sel = M - 1;
}
function f(x, d){ return fmt(x, d).replace(/,?0+$/, "").replace(/,$/, "") || "0"; }
function draw(){
  svg.innerHTML = ""; svg.appendChild(defs);
  const Nn = B.reduce((s, b) => s + b.n, 0);
  el("line", {x1: tx(0.5), y1: ty(0.5), x2: tx(1), y2: ty(1), stroke: css("--fg"), "stroke-dasharray": "6 4"});
  [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1].forEach(v => { el("text", {x: X0 - 6, y: ty(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 1));
    el("line", {x1: X0, y1: ty(v), x2: X0 + W, y2: ty(v), stroke: css("--grid"), "stroke-width": 0.6}); });
  el("text", {x: 16, y: Y0 + H / 2, "font-size": 12, "text-anchor": "middle", transform: "rotate(-90 16 " + (Y0 + H / 2) + ")"}, "acc / conf");
  const mx = Math.max(1, ...B.map(b => b.n));
  B.forEach((b, m) => {
    const x = tx(b.lo) + 2, w = tx(b.hi) - tx(b.lo) - 4, on = m === sel;
    el("rect", {x: x, y: ty(b.acc), width: w, height: ty(0.4) - ty(b.acc), fill: on ? css("--fill2") : css("--fill"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 2.5 : 1});
    const g1 = Math.min(ty(b.acc), ty(b.conf)), g2 = Math.max(ty(b.acc), ty(b.conf));
    el("rect", {x: x, y: g1, width: w, height: g2 - g1, fill: "url(#hatch)", stroke: css("--line"), "stroke-width": 0.8});
    el("line", {x1: x, y1: ty(b.conf), x2: x + w, y2: ty(b.conf), stroke: css("--fg"), "stroke-width": 2.5});
    const grip = el("rect", {x: x, y: ty(b.acc) - 6, width: w, height: 12, fill: "transparent", class: "drag", tabindex: 0, "aria-label": "acc, bin " + (m + 1)});
    grip.addEventListener("pointerdown", ev => { sel = m; drag = {m: m, kind: "acc"}; svg.setPointerCapture(ev.pointerId); draw(); });
    grip.addEventListener("focus", () => { if (sel !== m) { sel = m; draw(); } });
    const hb = HY + HH - b.n / Math.max(40, mx) * HH;
    el("rect", {x: x, y: hb, width: w, height: HY + HH - hb, fill: css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: x + w / 2, y: hb - 3, "text-anchor": "middle", "font-size": 10}, String(b.n));
    const g2r = el("rect", {x: x, y: hb - 6, width: w, height: 12, fill: "transparent", class: "drag"});
    g2r.addEventListener("pointerdown", ev => { sel = m; drag = {m: m, kind: "n"}; svg.setPointerCapture(ev.pointerId); draw(); });
    if (B.length <= 8) el("text", {x: x + w / 2, y: ty(Math.max(b.acc, b.conf)) - 6, "text-anchor": "middle", "font-size": 10}, f(b.n / Nn * Math.abs(b.acc - b.conf), 4));
  });
  el("text", {x: X0, y: HY - 8, "font-size": 11, fill: css("--muted")}, "|B_m| (a hisztogram oszlopának teteje húzható)");
  [0.5, 0.6, 0.7, 0.8, 0.9, 1].forEach(v => el("text", {x: tx(v), y: HY + HH + 16, "text-anchor": "middle", "font-size": 11}, f(v, 1)));
  el("text", {x: X0 + W / 2, y: HY + HH + 32, "text-anchor": "middle", "font-size": 12}, "konfidencia (vastag vonal: conf(B_m), sraffozott: rés)");
  const terms = B.map(b => b.n / Nn * Math.abs(b.acc - b.conf)), ece = terms.reduce((s, t) => s + t, 0);
  const b = B[sel];
  if (steps6) { status.textContent = steps6; steps6 = null; }
  else status.textContent = "N = " + Nn + ", ECE = Σ |B_m|/N · |acc − conf| = " + B.map((q, m) => f(q.n / Nn, 3) + "·" + f(Math.abs(q.acc - q.conf), 3)).join(" + ") + " = " + fmt(ece, 4) +
    "   | kiválasztott bin [" + f(b.lo, 3) + "; " + f(b.hi, 3) + "): " + b.n + " minta, conf " + f(b.conf, 3) + ", acc " + f(b.acc, 3) + " → " + f(b.n / Nn, 3) + " · |" + f(b.acc, 3) + " − " + f(b.conf, 3) + "| = " + f(terms[sel], 4);
}
let drag = null;
svg.addEventListener("pointermove", ev => { if (!drag) return; const p = svgPt(ev), b = B[drag.m];
  if (drag.kind === "acc") b.acc = Math.round(Math.max(0.4, Math.min(1, 0.4 + (Y0 + H - p.y) / H * 0.6)) * 100) / 100;
  else b.n = Math.max(0, Math.min(60, Math.round((HY + HH - p.y) / HH * Math.max(40, ...B.map(q => q.n)))));
  draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
document.addEventListener("keydown", ev => { const b = B[sel]; if (!b) return;
  if (ev.key === "ArrowUp") { b.acc = Math.min(1, Math.round((b.acc + 0.01) * 100) / 100); ev.preventDefault(); }
  else if (ev.key === "ArrowDown") { b.acc = Math.max(0.4, Math.round((b.acc - 0.01) * 100) / 100); ev.preventDefault(); }
  else if (ev.key === "+") b.n += 1; else if (ev.key === "-") b.n = Math.max(0, b.n - 1);
  else if (ev.key === "ArrowRight") sel = Math.min(B.length - 1, sel + 1); else if (ev.key === "ArrowLeft") sel = Math.max(0, sel - 1);
  else return; draw(); });
document.getElementById("M").addEventListener("input", e => { document.getElementById("Mv").textContent = e.target.value;
  if (+e.target.value === 5) B = JSON.parse(JSON.stringify(D.bins)); else reset(+e.target.value); sel = B.length - 1; draw(); });
document.getElementById("q6").addEventListener("click", () => {
  document.getElementById("M").value = 5; document.getElementById("Mv").textContent = 5;
  B = JSON.parse(JSON.stringify(D.bins)); sel = 4;
  steps6 = "6. kérdés: (1) |B_m|/N = 10/100 = 0,1; (2) |acc − conf| = |0,7 − 0,9| = 0,2; (3) 0,1 · |0,7 − 0,9| = 0,02. " +
           "A többi binnel együtt: ECE = 0,3·0,02 + 0,25·0,05 + 0,2·0,05 + 0,15·0,05 + 0,1·0,2 = 0,056.";
  draw(); });
document.getElementById("rs").addEventListener("click", () => { document.getElementById("M").value = 5; document.getElementById("Mv").textContent = 5; B = JSON.parse(JSON.stringify(D.bins)); sel = 4; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const defs = document.createElementNS(NS, "defs");
defs.innerHTML = '<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.2"/></pattern>';
svg.style.color = "var(--fg)";
draw();
document.body.dataset.selfcheck = Math.abs(B.reduce((s, b) => s + b.n / 100 * Math.abs(b.acc - b.conf), 0) - D.ece) < 1e-12 ? "OK" : "ELTÉRÉS";

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
