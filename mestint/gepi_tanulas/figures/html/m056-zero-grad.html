<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A .grad felhalmozódása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="zg" type="checkbox" checked> zero_grad() be</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két idővonal; a felsőn a gradiens minden backward után 7, az alsón 7, 14, 21-re nő"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított érték az autograd szabálya szerint (a levél tenzor .grad-jához a backward hozzáad), nem mérés. Az optimizer.step() szándékosan kimarad, hogy x = 2 maradjon és a számok követhetők legyenek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: x = 2, x.grad = None (még nem volt backward).", "line": 0, "j": -1, "zero": true, "vals": []}, {"msg": "1. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 0, "zero": true, "vals": ["None"], "skip": false}, {"msg": "1. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 1, "zero": true, "vals": ["None", "None"], "skip": false}, {"msg": "1. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 2, "zero": true, "vals": ["None", "None", "7"], "skip": false}, {"msg": "2. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 3, "zero": true, "vals": ["None", "None", "7", "None"], "skip": false}, {"msg": "2. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 4, "zero": true, "vals": ["None", "None", "7", "None", "None"], "skip": false}, {"msg": "2. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 5, "zero": true, "vals": ["None", "None", "7", "None", "None", "7"], "skip": false}, {"msg": "3. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 6, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None"], "skip": false}, {"msg": "3. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 7, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None", "None"], "skip": false}, {"msg": "3. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 8, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None", "None", "7"], "skip": false}];
const CODE = ["x = torch.tensor(2.0, requires_grad=True)", "optimizer = torch.optim.SGD([x], lr=0.1)", "for it in range(3):", "    optimizer.zero_grad()      # „zero_grad() nélkül”: ez a sor kimarad", "    y = x**2 + 3*x", "    y.backward()", "    print(x.grad)              # optimizer.step() kihagyva"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SON = [{"msg": "Kezdet: x = 2, x.grad = None (még nem volt backward).", "line": 0, "j": -1, "zero": true, "vals": []}, {"msg": "1. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 0, "zero": true, "vals": ["None"], "skip": false}, {"msg": "1. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 1, "zero": true, "vals": ["None", "None"], "skip": false}, {"msg": "1. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 2, "zero": true, "vals": ["None", "None", "7"], "skip": false}, {"msg": "2. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 3, "zero": true, "vals": ["None", "None", "7", "None"], "skip": false}, {"msg": "2. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 4, "zero": true, "vals": ["None", "None", "7", "None", "None"], "skip": false}, {"msg": "2. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 5, "zero": true, "vals": ["None", "None", "7", "None", "None", "7"], "skip": false}, {"msg": "3. iteráció: optimizer.zero_grad() → x.grad = None", "line": 3, "j": 6, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None"], "skip": false}, {"msg": "3. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 7, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None", "None"], "skip": false}, {"msg": "3. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 8, "zero": true, "vals": ["None", "None", "7", "None", "None", "7", "None", "None", "7"], "skip": false}], SOFF = [{"msg": "Kezdet: x = 2, x.grad = None (még nem volt backward).", "line": 0, "j": -1, "zero": false, "vals": []}, {"msg": "1. iteráció: zero_grad() kihagyva → x.grad marad None", "line": 3, "j": 0, "zero": false, "vals": ["None"], "skip": true}, {"msg": "1. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: None)", "line": 4, "j": 1, "zero": false, "vals": ["None", "None"], "skip": false}, {"msg": "1. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(7.)", "line": 5, "j": 2, "zero": false, "vals": ["None", "None", "7"], "skip": false}, {"msg": "2. iteráció: zero_grad() kihagyva → x.grad marad 7", "line": 3, "j": 3, "zero": false, "vals": ["None", "None", "7", "7"], "skip": true}, {"msg": "2. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: 7)", "line": 4, "j": 4, "zero": false, "vals": ["None", "None", "7", "7", "7"], "skip": false}, {"msg": "2. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(14.)", "line": 5, "j": 5, "zero": false, "vals": ["None", "None", "7", "7", "7", "14"], "skip": false}, {"msg": "3. iteráció: zero_grad() kihagyva → x.grad marad 14", "line": 3, "j": 6, "zero": false, "vals": ["None", "None", "7", "7", "7", "14", "14"], "skip": true}, {"msg": "3. iteráció: y = x² + 3x = 10 (forward; a .grad nem változik: 14)", "line": 4, "j": 7, "zero": false, "vals": ["None", "None", "7", "7", "7", "14", "14", "14"], "skip": false}, {"msg": "3. iteráció: y.backward() → x.grad += 7; print(x.grad) → tensor(21.)", "line": 5, "j": 8, "zero": false, "vals": ["None", "None", "7", "7", "7", "14", "14", "14", "21"], "skip": false}];
const zb = document.getElementById("zg");
zb.onchange = () => setSteps(zb.checked ? SON : SOFF);
function render(s){
  svg.setAttribute("viewBox", "0 0 640 190"); svg.innerHTML = "";
  const names = ["zero_grad()", "forward", "backward()"];
  el("text", {x: 10, y: 22, "font-size": 13, "font-weight": "bold"}, s.zero ? "zero_grad()-dal" : "zero_grad() nélkül");
  for (let j = 0; j < 9; j++){ const it = Math.floor(j / 3), st = j % 3, x = 20 + j * 66 + it * 8, done = j <= s.j, cur = j === s.j;
    const skip = st === 0 && !s.zero;
    if (st === 0) el("text", {x: x + 96, y: 48, "font-size": 12, "text-anchor": "middle", fill: css("--muted")}, `${it + 1}. iteráció`);
    el("rect", {x, y: 58, width: 60, height: 28, rx: 5, fill: cur ? css("--cellhl") : css("--cell"), stroke: skip ? css("--muted") : css("--line"), "stroke-dasharray": skip ? "4 3" : "", "stroke-width": cur ? 3 : 1.2});
    el("text", {x: x + 30, y: 77, "font-size": 11, "text-anchor": "middle", fill: skip ? css("--muted") : css("--fg")}, skip ? "kihagyva" : names[st]);
    if (done){ const v = s.vals[j], acc = st === 2 && v !== "7" && v !== "None";
      el("rect", {x: x + 4, y: 100, width: 52, height: 34, rx: 5, fill: acc ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": acc ? 3.5 : 1.2});
      el("text", {x: x + 30, y: 123, "font-size": 15, "text-anchor": "middle", "font-weight": acc ? "bold" : "normal"}, v);
      if (st === 0 && s.zero && j > 0) el("line", {x1: x + 8, y1: 130, x2: x + 52, y2: 104, stroke: css("--fg"), "stroke-width": 1.5}); } }
  el("text", {x: 10, y: 160, "font-size": 12, fill: css("--muted")}, "felső sor: a ciklus lépése; alsó sor: x.grad a lépés után (áthúzott: nullázás, vastag keret: felhalmozott érték)");
  el("text", {x: 10, y: 180, "font-size": 12, fill: css("--muted")}, "y = x² + 3x, x = 2 → dy/dx = 7; PyTorch 2.x: zero_grad() a .grad-ot None-ra állítja");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
