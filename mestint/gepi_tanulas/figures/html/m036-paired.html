<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páros különbségek és korrigált CI</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>ismétlések R: <input id="r" type="range" min="1" max="10" step="1" value="3" aria-label="ismétlések száma"> <span id="rv">3</span></label><label><input id="corr" type="checkbox" checked> korrigált (Nadeau–Bengio) CI</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 330" role="img" aria-label="Bal: összekötő vonalak a két modell foldonkénti AUC-je között; jobb: a különbségek pontjai 0 körül és a naiv vagy korrigált 95%-os konfidenciaintervallum."></svg>

<p class="small">Mért: a 10.4.7 labor (load_breast_cancer, LR vs. RF, RepeatedStratifiedKFold(5, R, random_state=42), scikit-learn 1.9.1); R = 1…10 előre futtatva, a t-próbák a böngészőben számolódnak (SciPy-val egyeztetve). R = 1-nél n = 5.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const D = {"a":[0.9950867998689814,0.9977071732721913,0.9851190476190477,1.0,0.9986586183769282,0.9990173599737963,0.9950867998689813,0.9854497354497355,0.9953703703703703,0.9966465459423206,0.998689813298395,0.9947592531935802,0.9986772486772486,0.988095238095238,0.9912810194500337,0.9977071732721913,0.9954143465443825,0.9983465608465608,0.9980158730158729,0.9916163648558014,0.9977071732721913,0.9885358663609565,0.9953703703703703,0.9960317460317459,0.9963112005365526,1.0,0.9921388797903701,0.9894179894179894,1.0,0.9798792756539236,0.990501146413364,1.0,0.9874338624338624,0.9970238095238095,0.999664654594232,0.9793645594497216,1.0,1.0,0.9986772486772486,0.9966465459423205,0.9996724533245988,0.996069439895185,0.9950396825396824,0.9867724867724867,0.999664654594232,0.998689813298395,0.9977071732721913,0.9966931216931216,0.986441798941799,1.0],"b":[0.9983622666229938,0.9785456927612185,0.9788359788359788,0.9945436507936507,0.9924547283702214,0.9980347199475925,0.9957418932197838,0.9894179894179893,0.9917328042328043,0.9730046948356808,0.9726498526039961,1.0,1.0,0.9918981481481481,0.9869215291750503,0.991320013101867,0.9914837864395677,0.9963624338624338,0.9799933862433862,0.9912810194500336,0.9723223059285949,0.9783819194235179,0.9993386243386243,0.9917328042328042,0.9993293091884642,0.9981984932852931,0.9849328529315428,0.9818121693121693,0.9945436507936507,0.9859154929577465,0.9808385194890272,0.9983622666229938,0.9837962962962963,0.9932208994708995,0.9976525821596245,0.9854241729446447,0.9977071732721913,0.9986772486772487,0.9953703703703703,0.9733400402414487,0.9985260399606944,0.9967245332459875,0.972718253968254,0.9915674603174603,0.9924547283702213,0.9931215198165738,0.9977071732721914,0.9747023809523809,0.9928902116402117,0.9912810194500336],"q":[null,2.7764451051977987,2.2621571628540993,2.1447866879169273,2.093024054408263,2.0638985616280205,2.045229642132703,2.032244509317718,2.0226909200367604,2.0153675744437636,2.0095752371292397]};
const CHECK = {"1": [0.13199769821757656, 0.2765213929989124], "2": [0.0768189186474821, 0.3133736537747763], "3": [0.06645873319221447, 0.3766031335730936], "4": [0.016757012024161036, 0.2977337024894185], "5": [0.007016895119126288, 0.2844198220017029], "6": [0.003439188280956755, 0.28348186625107596], "7": [0.0010577643703235657, 0.25952425635029513], "8": [0.0006294844739142173, 0.26910763050114694], "9": [0.0003287540460621956, 0.2716439833525236], "10": [0.00013759804998865016, 0.26565283589604827]};

let sel = -1;
function lgam(x){ const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015; for (const q of c) s += q / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function betacf(a, b, x){ let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < 1e-30) d = 1e-30; d = 1 / d; let h = d;
  for (let m = 1; m <= 200; m++) { const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2)); d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2)); d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d; const del = d * c; h *= del; if (Math.abs(del - 1) < 1e-12) break; } return h; }
function ibeta(a, b, x){ if (x <= 0) return 0; if (x >= 1) return 1; const bt = Math.exp(lgam(a + b) - lgam(a) - lgam(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b; }
function p2(t, df){ return ibeta(df / 2, 0.5, df / (df + t * t)); }
function st(R){ const a = D.a.slice(0, 5 * R), b = D.b.slice(0, 5 * R), d = a.map((v, i) => v - b[i]), n = d.length;
  const m = d.reduce((s, v) => s + v, 0) / n, s = Math.sqrt(d.reduce((q, v) => q + (v - m) * (v - m), 0) / (n - 1));
  const fc = Math.sqrt(1 / n + 1 / 4), tn = m / (s / Math.sqrt(n)), tc = m / (fc * s), q = D.q[R];
  return {a, b, d, n, m, s, tn, tc, pn: p2(tn, n - 1), pc: p2(tc, n - 1), cin: [m - q * s / Math.sqrt(n), m + q * s / Math.sqrt(n)], cic: [m - q * fc * s, m + q * fc * s]}; }
// önellenőrzés: a JS p-értékek egyeznek a SciPy-éval
for (const R in CHECK) { const S = st(+R); if (Math.abs(S.pn - CHECK[R][0]) > 1e-6 || Math.abs(S.pc - CHECK[R][1]) > 1e-6) console.error("p-érték eltérés", R); }
const rs = document.getElementById("r"), cm = document.getElementById("corr");
function draw(){
  svg.innerHTML = "";
  const R = +rs.value, S = st(R), corr = cm.checked, fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  // (a) slope chart
  const lo = Math.min(...S.a, ...S.b) - 0.002, hi = Math.max(...S.a, ...S.b) + 0.002, Y0 = 30, H = 280;
  const ty = v => Y0 + H - (v - lo) / (hi - lo) * H, xa = 90, xb = 230;
  el("text", {x: 160, y: 18, "text-anchor": "middle", "font-size": 13}, "foldonkénti AUC (kattints egy vonalra)");
  for (let i = 0; i < S.n; i++) { const on = i === sel, r = Math.floor(i / 5);
    const ln = el("line", {x1: xa, y1: ty(S.a[i]), x2: xb, y2: ty(S.b[i]), stroke: on ? hl : fg, "stroke-width": on ? 3 : 1, "stroke-dasharray": ["", "6 3", "2 3", "8 3 2 3"][r % 4], style: "cursor:pointer"});
    ln.addEventListener("click", () => { sel = i; draw(); });
    el("circle", {cx: xa, cy: ty(S.a[i]), r: 4, fill: css("--bg"), stroke: fg});
    el("path", {d: `M${xb},${ty(S.b[i]) - 5} l4.5,8 h-9 z`, fill: fg}); }
  el("text", {x: xa, y: Y0 + H + 18, "text-anchor": "middle", "font-size": 12}, "LR (○)"); el("text", {x: xb, y: Y0 + H + 18, "text-anchor": "middle", "font-size": 12}, "RF (▲)");
  el("text", {x: xa - 30, y: ty(hi - 0.002) + 4, "text-anchor": "end", "font-size": 11}, fmt(hi - 0.002, 3)); el("text", {x: xa - 30, y: ty(lo + 0.002) + 4, "text-anchor": "end", "font-size": 11}, fmt(lo + 0.002, 3));
  // (b) d_i és CI
  const X0 = 320, W = 340, dl = -0.03, dh = 0.045, tx = v => X0 + (v - dl) / (dh - dl) * W;
  el("text", {x: X0 + W / 2, y: 18, "text-anchor": "middle", "font-size": 13}, "d_i = AUC(LR) − AUC(RF)");
  el("line", {x1: X0, y1: 250, x2: X0 + W, y2: 250, stroke: mu});
  [-0.02, 0, 0.02, 0.04].forEach(v => el("text", {x: tx(v), y: 266, "text-anchor": "middle", "font-size": 11}, fmt(v, 2)));
  el("line", {x1: tx(0), y1: 30, x2: tx(0), y2: 250, stroke: fg}); el("line", {x1: tx(0.01), y1: 30, x2: tx(0.01), y2: 250, stroke: fg, "stroke-dasharray": "2 3"});
  el("text", {x: tx(0.01) + 3, y: 42, "font-size": 11}, "Δ_min = 0,01");
  S.d.forEach((v, i) => { const yj = 70 + ((i * 37) % 90); el("circle", {cx: tx(Math.max(dl, Math.min(dh, v))), cy: yj, r: i === sel ? 6 : 4, fill: i === sel ? hl : css("--bg"), stroke: fg}); });
  const ci = corr ? S.cic : S.cin, yc = 205;
  el("line", {x1: tx(Math.max(dl, ci[0])), y1: yc, x2: tx(Math.min(dh, ci[1])), y2: yc, stroke: fg, "stroke-width": corr ? 5 : 2});
  [ci[0], ci[1]].forEach(v => el("line", {x1: tx(Math.max(dl, Math.min(dh, v))), y1: yc - 8, x2: tx(Math.max(dl, Math.min(dh, v))), y2: yc + 8, stroke: fg, "stroke-width": 2}));
  el("rect", {x: tx(S.m) - 4, y: yc - 4, width: 8, height: 8, fill: hl});
  el("text", {x: X0 + W / 2, y: yc + 26, "text-anchor": "middle", "font-size": 12}, (corr ? "korrigált" : "naiv") + ` 95% CI: [${fmt(ci[0], 4)}; ${fmt(ci[1], 4)}]`);
  document.getElementById("rv").textContent = R;
  const p = corr ? S.pc : S.pn;
  let dec = S.pc < 0.05 ? (Math.abs(S.m) > 0.01 ? `nyertes: ${S.m > 0 ? "LR" : "RF"}` : "statisztikailag kimutatható, de gyakorlatilag nem releváns") : "nem állítunk különbséget";
  let msg = `n = ${S.n}, d̄ = ${fmt(S.m, 4)}, s_d = ${fmt(S.s, 4)}; naiv t = ${fmt(S.tn, 3)}, p = ${fmt(S.pn, 3)}; korrigált t = ${fmt(S.tc, 3)}, p = ${fmt(S.pc, 3)}; döntés (korrigált próba, Δ_min = 0,01): ${dec}`;
  if (sel >= 0 && sel < S.n) msg += ` | ${Math.floor(sel / 5) + 1}. ismétlés ${sel % 5 + 1}. fold: LR ${fmt(S.a[sel], 4)}, RF ${fmt(S.b[sel], 4)}, d = ${fmt(S.d[sel], 4)}`;
  status.textContent = msg;
}
rs.oninput = () => { if (sel >= 5 * +rs.value) sel = -1; draw(); };
cm.onchange = draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
