<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoPE: forgatás és relatív pontszorzat</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Pozíciók">
  <label>m (query) = <b id="mv">0</b> <input id="m" type="range" min="0" max="20" value="0" aria-label="query pozíció m"></label>
  <label>n (key) = <b id="nv">5</b> <input id="n" type="range" min="0" max="20" value="5" aria-label="key pozíció n"></label>
</div>
<div class="ctl">
  <label><input type="radio" name="mode" id="both" checked> mindkettőt forgat (helyes)</label>
  <label><input type="radio" name="mode" id="onlyq"> csak q-t forgat (hibás)</label>
  <label><input type="checkbox" id="lock"> Δ rögzítése (m léptetése n-t is lépteti)</label>
  <button id="p1">(0, 5)</button><button id="p2">(3, 8)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 350" role="img" aria-label="Egységkör a forgatott q és k vektorral, a közbezárt szög ívével és a pontszorzat értékével."></svg>

<p class="small">Egy dimenziópár (i = 0, θ₀ = 1 rad); számított mintaadat, nem mérés. A (0, 5) és (3, 8) gomb a statikus ábra két paneljét állítja be; hibás módban (csak q-t forgatjuk) a pontszorzat már az abszolút pozíciótól is függ.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function hu(x, d){ return fmt(x, d); }
function patterns(){
  let defs = document.getElementById("pdefs"); if (defs) defs.remove();
  defs = document.createElementNS(NS, "defs"); defs.id = "pdefs"; const f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${f}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`;
  svg.insertBefore(defs, svg.firstChild);
}
function hlLine(i){ document.querySelectorAll("pre#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const Q = [1.0, 0.5], K = [0.8, 0.6], TH = 1.0;
const mS = document.getElementById("m"), nS = document.getElementById("n");
const lock = document.getElementById("lock"), onlyq = document.getElementById("onlyq");
let lastM = +mS.value;
function rot(v, a){ return [v[0]*Math.cos(a) - v[1]*Math.sin(a), v[0]*Math.sin(a) + v[1]*Math.cos(a)]; }
function arrowTo(cx, cy, s, v, stroke, dash, w, mk){ el("line", {x1: cx, y1: cy, x2: cx + s*v[0], y2: cy - s*v[1], stroke: stroke, "stroke-width": w, "stroke-dasharray": dash || "", "marker-end": "url(#" + mk + ")"}); }
function draw(){
  const m = +mS.value, n = +nS.value, both = !onlyq.checked;
  document.getElementById("mv").textContent = m; document.getElementById("nv").textContent = n;
  svg.innerHTML = ""; patterns();
  const cx = 200, cy = 175, s = 120, fg = css("--fg");
  el("circle", {cx: cx, cy: cy, r: s, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 3"});
  el("line", {x1: cx - s - 20, y1: cy, x2: cx + s + 20, y2: cy, stroke: css("--grid")});
  el("line", {x1: cx, y1: cy - s - 20, x2: cx, y2: cy + s + 20, stroke: css("--grid")});
  const q = rot(Q, m*TH), k = both ? rot(K, n*TH) : K.slice();
  arrowTo(cx, cy, s, Q, css("--muted"), "", 1, "ah");
  arrowTo(cx, cy, s, K, css("--muted"), "5 3", 1, "ah");
  arrowTo(cx, cy, s, q, fg, "", 3, "ah");
  arrowTo(cx, cy, s, k, css("--hl"), "7 4", 2.6, "ah3");
  const a1 = Math.atan2(q[1], q[0]); let d = Math.atan2(k[1], k[0]) - a1;
  d = ((d + Math.PI) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI) - Math.PI;
  const r = 45, N = 40; let p = "";
  for (let j = 0; j <= N; j++){ const a = a1 + d*j/N; p += (j ? "L" : "M") + (cx + r*Math.cos(a)).toFixed(1) + "," + (cy - r*Math.sin(a)).toFixed(1); }
  el("path", {d: p, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
  const mid = a1 + d/2;
  el("text", {x: cx + 68*Math.cos(mid), y: cy - 68*Math.sin(mid) + 4, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, fmt(Math.abs(d)*180/Math.PI, 1) + "°");
  const nq = Math.hypot(q[0], q[1]);
  el("text", {x: cx + 1.2*s*q[0]/nq, y: cy - 1.2*s*q[1]/nq + 4, "text-anchor": "middle", "font-size": 14}, "R_m q");
  el("text", {x: cx + 1.22*s*k[0], y: cy - 1.22*s*k[1] + 4, "text-anchor": "middle", "font-size": 14, fill: css("--hl")}, both ? "R_n k" : "k (nem forgatott)");
  const sc = q[0]*k[0] + q[1]*k[1];
  // jobb oldali tábla
  const x0 = 390; let y = 60;
  const rows = [["m", m], ["n", n], ["Δ = n − m", n - m], ["q forgatása", fmt(m*TH, 2) + " rad"], ["k forgatása", both ? fmt(n*TH, 2) + " rad" : "nincs (hibás)"], ["közbezárt szög", fmt(Math.abs(d)*180/Math.PI, 2) + "°"], ["⟨R_m q, R_n k⟩", fmt(sc, 4)]];
  rows.forEach(([a, b], i) => { el("text", {x: x0, y: y + 30*i, "font-size": 14}, a); el("text", {x: x0 + 220, y: y + 30*i, "font-size": 14, "text-anchor": "end", "font-weight": i === 6 ? "bold" : "normal"}, String(b)); });
  el("text", {x: x0, y: y + 30*7 + 10, "font-size": 12, fill: css("--muted")}, "szürke: q, k forgatás előtt");
  el("text", {x: x0, y: y + 30*7 + 28, "font-size": 12, fill: css("--muted")}, "q = (1; 0,5), k = (0,8; 0,6), θ₀ = 1 rad");
  status.innerHTML = `m = ${m}, n = ${n}, Δ = ${n - m}: q_rot·k_rot = <b>${fmt(sc, 4)}</b>` + (both ? " (csak Δ-tól függ)" : ' <span class="warn">– hibás mód: k nincs forgatva, az érték Δ rögzítése mellett is változik</span>');
}
mS.oninput = () => { const m = +mS.value; if (lock.checked){ const nn = +nS.value + (m - lastM); if (nn < 0 || nn > 20){ mS.value = lastM; return; } nS.value = nn; } lastM = +mS.value; draw(); };
nS.oninput = () => { lastM = +mS.value; draw(); };
document.getElementById("both").onchange = draw; onlyq.onchange = draw;
document.getElementById("p1").onclick = () => { mS.value = 0; nS.value = 5; lastM = 0; draw(); };
document.getElementById("p2").onclick = () => { mS.value = 3; nS.value = 8; lastM = 3; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
