<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online softmax blokkonként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label><input type="checkbox" id="norm" checked onchange="normMode=this.checked; show(k)"> normált o_new (képlet); kikapcsolva: normálatlan o_i (pszeudokód)</label>
<span style="flex-basis:100%"></span>
<label>logitok: <input id="sin" size="22" value="1; 3; 2; 5; 0; 4" aria-label="logitsor"></label>
<label>értékek v: <input id="vin" size="22" value="10; 20; 30; 40; 50; 60" aria-label="értéksor"></label>
<button onclick="applyInput()">Betöltés</button><span id="inmsg" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Blokkonként feldolgozott logitsor; a futó maximum, nevező és kimenet lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított példa, nem mérés; blokkméret 2. A kódpanel a 19.4.3.2 pszeudokódjának belső ciklusa (rövidítve). A normált o a 19.4.3.1 képlete, a normálatlan o_i a pszeudokód akkumulátora; a kettő a végső l-lel való osztás után egyezik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"j": -1, "ph": 0, "m": null, "l": 0.0, "acc": 0.0, "o": null, "alpha": null, "line": 2, "msg": "Kezdés: m = −∞, l = 0, o = 0 (a teljes L×L mátrix sosem kerül a HBM-be)."}, {"j": 0, "ph": 1, "m": null, "l": 0.0, "acc": 0.0, "o": null, "alpha": null, "mloc": 3, "line": 5, "msg": "1. blokk: s = (1, 3), lokális maximum m_local = 3."}, {"j": 0, "ph": 2, "m": 3, "l": 1.1353352832366128, "acc": 21.353352832366127, "o": 18.807970779778824, "alpha": 0.0, "mloc": 3, "line": 10, "msg": "1. blokk: m_new = 3, α = 0,0000, l = 1,1353, o = 18,81"}, {"j": 1, "ph": 1, "m": 3, "l": 1.1353352832366128, "acc": 21.353352832366127, "o": 18.807970779778824, "alpha": null, "mloc": 5, "line": 5, "msg": "2. blokk: s = (2, 5), lokális maximum m_local = 5."}, {"j": 1, "ph": 2, "m": 5, "l": 1.2034379904932107, "acc": 44.38347410465551, "o": 36.88056589144708, "alpha": 0.1353352832366127, "mloc": 5, "line": 10, "msg": "2. blokk: m_new = 5, α = 0,1353, l = 1,2034, o = 36,88"}, {"j": 2, "ph": 1, "m": 5, "l": 1.2034379904932107, "acc": 44.38347410465551, "o": 36.88056589144708, "alpha": null, "mloc": 4, "line": 5, "msg": "3. blokk: s = (0, 4), lokális maximum m_local = 4."}, {"j": 2, "ph": 2, "m": 5, "l": 1.5780553786637386, "acc": 66.79313792489633, "o": 42.32623191047658, "alpha": 1.0, "mloc": 4, "line": 10, "msg": "3. blokk: m_new = 5, α = 1,0000, l = 1,5781, o = 42,33"}, {"j": 3, "ph": 3, "m": 5, "l": 1.5780553786637386, "acc": 66.79313792489633, "o": 42.32623191047658, "alpha": null, "line": 12, "msg": "Vége: o = 66,7931 / 1,5781 = 42,33 – egyezik a teljes softmax súlyozott átlagával."}];
const CODE = ["m_i = torch.full(stat_shape, -float('inf'))     # futó maximum", "l_i = torch.zeros(stat_shape)                    # futó nevező", "o_i = torch.zeros_like(q_block)                  # normálatlan akkumulátor", "for j in range(0, L, block_size):", "    s_block = torch.matmul(q_block, k_block.transpose(-2, -1)) * scale", "    m_local = s_block.max(dim=-1, keepdim=True).values", "    p_local = torch.exp(s_block - m_local); l_local = p_local.sum(dim=-1, keepdim=True)", "    m_new = torch.maximum(m_i, m_local.squeeze(-1))", "    alpha = torch.exp(m_i - m_new)", "    l_i_new = alpha * l_i + torch.exp(m_local.squeeze(-1) - m_new) * l_local.squeeze(-1)", "    o_i = alpha.unsqueeze(-1) * o_i + torch.exp(m_local.squeeze(-1) - m_new).unsqueeze(-1) * torch.matmul(p_local, v_block)", "    m_i = m_new; l_i = l_i_new", "o_i = o_i / l_i.unsqueeze(-1)                    # a végén egyszer normálunk"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let normMode = true;
function hu(x, d){ if (x === null || x === undefined) return "—"; if (!isFinite(x)) return "−∞"; return Number(x).toFixed(d).replace(".", ",").replace("-", "−"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  svg.appendChild(defs);
  const SS = CUR.s, VV = CUR.v, nb = Math.ceil(SS.length / 2), Lq = SS.length;
  // bal: L×L logitmátrix csempékre bontva (nb×nb), a mi sorunk az első Q-blokkban
  const cs = Math.min(36, 216 / Lq), gx = 20, gy = 60;
  el("text", {x: gx, y: gy - 30, "font-size": 13}, `L×L = ${Lq}×${Lq} logitmátrix, ${nb}×${nb} csempe`);
  el("text", {x: gx, y: gy - 12, "font-size": 12, fill: mu}, "(halvány: a HBM-ben soha nem tárolt rész)");
  for (let r = 0; r < Lq; r++) for (let c = 0; c < Lq; c++){
    const tb = Math.floor(c / 2), qb = Math.floor(r / 2);
    let fill = css("--bg"), op = 0.25;
    if (qb === 0 && tb < s.j) { fill = "url(#pdiag)"; op = 0.8; }
    if (qb === 0 && tb === s.j && s.ph < 3) { fill = css("--cellhl"); op = 1; }
    el("rect", {x: gx + c*cs, y: gy + r*cs, width: cs, height: cs, fill: fill, stroke: mu, "stroke-width": 0.6, opacity: op});
  }
  for (let b = 0; b <= nb; b++){
    el("line", {x1: gx + b*2*cs, y1: gy, x2: gx + b*2*cs, y2: gy + Lq*cs, stroke: fg, "stroke-width": 1.2});
    el("line", {x1: gx, y1: gy + b*2*cs, x2: gx + Lq*cs, y2: gy + b*2*cs, stroke: fg, "stroke-width": 1.2});
  }
  if (s.j >= 0 && s.j < nb) el("rect", {x: gx + s.j*2*cs, y: gy, width: 2*cs, height: Math.min(2, Lq)*cs, fill: "none", stroke: css("--hl"), "stroke-width": 4});
  el("text", {x: gx - 6, y: gy + cs/2 + 4, "font-size": 11, "text-anchor": "end"}, "q₁");
  el("text", {x: gx, y: gy + Lq*cs + 18, "font-size": 12, fill: mu}, "aktuális (i, j) csempe: vastag keret");
  // jobb: a sor oszlopdiagramja
  const bx = 300, by = 220, bw = 40, sc = 26, smax = Math.max(...SS), smin = Math.min(0, ...SS);
  const Ysc = val => by - (val - smin) * sc * 5 / Math.max(1, smax - smin);
  el("line", {x1: bx - 6, y1: Ysc(smin), x2: bx + SS.length*bw, y2: Ysc(smin), stroke: fg});
  SS.forEach((val, i) => {
    const b = Math.floor(i / 2);
    let fill = css("--bg"), dash = "4 3";
    if (b < s.j || s.ph === 3) { fill = "url(#pdiag)"; dash = ""; }
    if (b === s.j && s.ph < 3) { fill = css("--cellhl"); dash = ""; }
    const y = Ysc(val), y0 = Ysc(smin);
    el("rect", {x: bx + i*bw + 5, y: Math.min(y, y0), width: bw - 10, height: Math.abs(y0 - y), fill: fill, stroke: fg, "stroke-dasharray": dash});
    el("text", {x: bx + i*bw + bw/2, y: y0 + 16, "font-size": 12, "text-anchor": "middle"}, "s" + (i+1) + "=" + hu(val, Number.isInteger(val) ? 0 : 1));
    el("text", {x: bx + i*bw + bw/2, y: y0 + 31, "font-size": 11, "text-anchor": "middle", fill: mu}, "v=" + hu(VV[i], Number.isInteger(VV[i]) ? 0 : 1));
  });
  if (s.m !== null && s.m !== undefined){ const y = Ysc(s.m); el("line", {x1: bx - 6, y1: y, x2: bx + SS.length*bw, y2: y, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"}); el("text", {x: bx + SS.length*bw + 4, y: y + 4, "font-size": 12, fill: css("--hl2")}, "m=" + hu(s.m, Number.isInteger(s.m) ? 0 : 2)); }
  // táblázat
  const tx = 285, ty = 30;
  const oTxt = normMode ? ["o (normált)", hu(s.o, 2)] : ["o_i (normálatlan)", hu(s.acc, 4)];
  const rows = [["m", s.m === null ? "−∞" : hu(s.m, Number.isInteger(s.m) ? 0 : 4)], ["α", hu(s.alpha, 4)], ["l", hu(s.l, 4)], oTxt];
  rows.forEach(([a, b], i) => { el("text", {x: tx + i*76, y: ty, "font-size": 12, fill: mu}, a); el("text", {x: tx + i*76, y: ty + 18, "font-size": 15, "font-weight": "bold"}, b); });
  if (s.ph === 3) el("text", {x: tx, y: ty + 40, "font-size": 12.5}, normMode ? "o = " + hu(s.o, 4) + " (teljes softmax: " + hu(CUR.full, 4) + ")" : "végső osztás: " + hu(s.acc, 4) + " / " + hu(s.l, 4) + " = " + hu(s.o, 4));
}
let CUR = {"s": [1, 3, 2, 5, 0, 4], "v": [10, 20, 30, 40, 50, 60], "full": 42.326231910476565};
function genSteps(sv, vv){
  const st = []; const nb = Math.ceil(sv.length / 2); let m = -Infinity, l = 0, acc = 0;
  st.push({j: -1, ph: 0, m: null, l: 0, acc: 0, o: null, alpha: null, line: 2, msg: "Kezdés: m = −∞, l = 0, o = 0 (a teljes L×L mátrix sosem kerül a HBM-be)."});
  for (let j = 0; j < nb; j++){
    const blk = []; for (let i = 2*j; i < Math.min(sv.length, 2*j + 2); i++) blk.push(i);
    const ml = Math.max(...blk.map(i => sv[i]));
    st.push({j: j, ph: 1, m: m > -Infinity ? m : null, l: l, acc: acc, o: l ? acc / l : null, alpha: null, line: 5, msg: `${j+1}. blokk: s = (${blk.map(i => hu(sv[i], Number.isInteger(sv[i]) ? 0 : 2)).join(", ")}), lokális maximum m_local = ${hu(ml, Number.isInteger(ml) ? 0 : 2)}.`});
    const mn = Math.max(m, ml), alpha = m > -Infinity ? Math.exp(m - mn) : 0;
    l = alpha * l + blk.reduce((a, i) => a + Math.exp(sv[i] - mn), 0);
    acc = alpha * acc + blk.reduce((a, i) => a + Math.exp(sv[i] - mn) * vv[i], 0);
    m = mn;
    st.push({j: j, ph: 2, m: m, l: l, acc: acc, o: acc / l, alpha: alpha, line: 10, msg: `${j+1}. blokk: m_new = ${hu(m, Number.isInteger(m) ? 0 : 4)}, α = ${hu(alpha, 4)}, l = ${hu(l, 4)}, o = ${hu(acc / l, 2)}`});
  }
  st.push({j: nb, ph: 3, m: m, l: l, acc: acc, o: acc / l, alpha: null, line: 12, msg: `Vége: o = ${hu(acc, 4)} / ${hu(l, 4)} = ${hu(acc / l, 2)} – egyezik a teljes softmax súlyozott átlagával.`});
  return st;
}
function applyInput(){
  const parse = id => document.getElementById(id).value.split(/[;\s]+/).filter(x => x).map(x => parseFloat(x.replace(",", ".")));
  const sv = parse("sin"), vv = parse("vin");
  const msg = document.getElementById("inmsg");
  if (sv.length < 2 || sv.length > 12 || sv.some(x => !isFinite(x)) || vv.length !== sv.length || vv.some(x => !isFinite(x))){ msg.textContent = "2–12 logit és ugyanannyi érték kell (pontosvesszővel elválasztva)."; return; }
  msg.textContent = "";
  const mx = Math.max(...sv), w = sv.map(x => Math.exp(x - mx)), Z = w.reduce((a, b) => a + b, 0);
  CUR = {s: sv, v: vv, full: w.reduce((a, x, i) => a + x * vv[i], 0) / Z};
  setSteps(genSteps(sv, vv));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
