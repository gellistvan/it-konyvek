<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétlépcsős rétegzett vágás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>1. test_size: <input id="t1" type="range" min="0.1" max="0.4" step="0.05" value="0.2" oninput="upd()" aria-label="első test_size"> <span id="t1v">0,20</span></label> <label>2. test_size: <input id="t2" type="range" min="0.1" max="0.4" step="0.05" value="0.25" oninput="upd()" aria-label="második test_size"> <span id="t2v">0,25</span></label> <label><input id="strat" type="checkbox" checked onchange="upd()"> stratify</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három sáv: a 150 soros Iris-adat 120 tanító-validációs és 30 teszt sorra, majd a 120 sor 90 tanító és 30 validációs sorra oszlik; minden részben az osztályok aránya egyenlő."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Rétegzett esetben a darabszámok a scikit-learn szabálya szerint (n_test = ⌈test_size · n⌉, osztályonként arányosan); a kezdőállapot a scikit-learn 1.9.1, random_state=42 eredménye. Kikapcsolt stratify esetén seedelt, szemléltető keverés (nem a scikit-learn sorrendje).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 0, "line": 0, "msg": ""}, {"st": 1, "line": 2, "msg": ""}, {"st": 2, "line": 4, "msg": ""}];
const CODE = ["X, y = load_iris(return_X_y=True)   # X: (150, 4), y: (150,)", "X_tv, X_test, y_tv, y_test = train_test_split(", "    X, y, test_size=0.20, random_state=42, stratify=y)", "X_train, X_val, y_train, y_val = train_test_split(", "    X_tv, y_tv, test_size=0.25, random_state=42, stratify=y_tv)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return Number(v).toFixed(d).replace(".", ",").replace("-", "−"); }
function patterns(){
  const defs = document.createElementNS(NS, "defs"), f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<pattern id="pdense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${f}" stroke-width="1"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
}

function v(id){ return +document.getElementById(id).value; }
function strat(counts, ts){
  const n = counts.reduce((a, b) => a + b, 0), nt = Math.ceil(ts * n - 1e-9);
  const ex = counts.map(c => c * nt / n), base = ex.map(Math.floor);
  let rem = nt - base.reduce((a, b) => a + b, 0);
  const ord = counts.map((c, i) => i).sort((a, b) => (ex[b] - base[b]) - (ex[a] - base[a]));
  for (let j = 0; j < rem; j++) base[ord[j]]++;
  return [counts.map((c, i) => c - base[i]), base];
}
function rnd(counts, ts, seed){   // keverés seedelt LCG-vel (szemléltető, nem a scikit-learn sorrendje)
  const lab = []; counts.forEach((c, i) => { for (let j = 0; j < c; j++) lab.push(i); });
  let s = seed >>> 0; const r = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  for (let i = lab.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = lab[i]; lab[i] = lab[j]; lab[j] = t; }
  const nt = Math.ceil(ts * lab.length - 1e-9), a = [0, 0, 0], b = [0, 0, 0];
  lab.forEach((c, i) => { if (i < nt) b[c]++; else a[c]++; });
  return [a, b];
}
window.addEventListener("load", () => show(STEPS.length - 1));   // kezdőállapot = a statikus ábra (2. vágás után)
function upd(){ document.getElementById("t1v").textContent = hu(v("t1"), 2); document.getElementById("t2v").textContent = hu(v("t2"), 2); show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330"); patterns();
  const t1 = v("t1"), t2 = v("t2"), st = document.getElementById("strat").checked;
  const full = [50, 50, 50];
  const [tv, te] = st ? strat(full, t1) : rnd(full, t1, 42);
  const [tr, va] = st ? strat(tv, t2) : rnd(tv, t2, 43);
  const sc = 3.6, X0 = 150, fills = [css("--bg"), "url(#pdiag)", "url(#pdot)"];
  const sum = a => a.reduce((p, q) => p + q, 0);
  function bar(x, y, c, title, dash){
    let xx = x;
    c.forEach((n, i) => { if (n > 0) { el("rect", {x: xx, y: y, width: n * sc, height: 34, fill: fills[i], stroke: css("--fg"), "stroke-width": 0.5});
      el("rect", {x: xx + n * sc / 2 - 11, y: y + 9, width: 22, height: 16, fill: css("--bg")});
      el("text", {x: xx + n * sc / 2, y: y + 22, "text-anchor": "middle", "font-size": 12}, String(n)); } xx += n * sc; });
    el("rect", {x: x, y: y, width: sum(c) * sc, height: 34, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": dash ? "6 4" : ""});
    el("text", {x: x + sum(c) * sc / 2, y: y - 6, "text-anchor": "middle", "font-size": 12.5}, title);
  }
  const rowY = [40, 140, 240];
  el("text", {x: 140, y: rowY[0] + 22, "text-anchor": "end", "font-size": 13}, "teljes adat");
  bar(X0, rowY[0], full, "X, y (150)");
  if (s.st >= 1) { el("text", {x: 140, y: rowY[1] + 22, "text-anchor": "end", "font-size": 13}, "1. vágás");
    bar(X0, rowY[1], tv, `X_tv (${sum(tv)})`); bar(X0 + sum(tv) * sc + 8, rowY[1], te, `X_test (${sum(te)})`); }
  if (s.st >= 2) { el("text", {x: 140, y: rowY[2] + 22, "text-anchor": "end", "font-size": 13}, "2. vágás");
    bar(X0, rowY[2], tr, `X_train (${sum(tr)})`); bar(X0 + sum(tr) * sc + 4, rowY[2], va, `X_val (${sum(va)})`);
    bar(X0 + sum(tv) * sc + 8, rowY[2], te, `X_test (${sum(te)})`, true);
    el("text", {x: X0 + sum(tv) * sc + 8 + sum(te) * sc / 2, y: rowY[2] + 72, "text-anchor": "middle", "font-size": 12}, "változatlan: nem nyúlunk hozzá");
    [[0, sum(tr)], [sum(tr) * sc + 4, sum(va)], [sum(tv) * sc + 8, sum(te)]].forEach(([dx, n]) =>
      el("text", {x: X0 + dx + n * sc / 2, y: rowY[2] + 54, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, hu(100 * n / 150, 0) + "%"));
    el("text", {x: X0, y: rowY[2] + 76, "text-anchor": "start", "font-size": 13, "font-weight": "bold"}, `${hu(1 - t1, 2)} · ${hu(t2, 2)} = ${hu(sum(va) / 150, 3)} (val aránya)`);
  }
  ["0. osztály", "1. osztály", "2. osztály"].forEach((t, i) => { el("rect", {x: 420 + i * 110, y: 4, width: 18, height: 14, fill: fills[i], stroke: css("--fg")}); el("text", {x: 442 + i * 110, y: 16, "font-size": 12}, t); });
  const names = ["teljes adat: 150 sor (50/50/50)", `1. vágás: X_tv ${sum(tv)} (${tv.join("/")}), test ${sum(te)} (${te.join("/")})`, ""];
  status.textContent = s.st < 2 ? names[s.st] + (st ? "" : " · stratify KI: seedelt keverés") :
    `train ${sum(tr)} (${hu(100 * sum(tr) / 150, 0)}%), val ${sum(va)} (${hu(100 * sum(va) / 150, 0)}%), test ${sum(te)} (${hu(100 * sum(te) / 150, 0)}%) · osztályok: train ${tr.join("/")}, val ${va.join("/")}, test ${te.join("/")}` + (st ? "" : " · stratify KI: az arányok eltérnek");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
