<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p-normák és az L1 ritkító hatása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="p">p =</label><input id="p" type="range" min="0.5" max="8" step="0.05" value="1" aria-label="A norma p kitevője">
<b id="pv">1,00</b><button id="pinf">p = ∞</button>
<label for="r">sugár r =</label><input id="r" type="range" min="0.2" max="2" step="0.05" value="1" aria-label="A korlát sugara">
<b id="rv">1,00</b><button id="reset">Alaphelyzet</button>
</div>
<div id="warn" class="warn" aria-live="polite"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 320" role="img" aria-label="Bal oldalt a p-norma egységgömbje a p csúszkával; jobb oldalt a veszteség ellipszisei, az L1-rombusz és az L2-kör, a két kényszeres optimummal"></svg>

<p class="small">Modellszámítás, nem mérés: f(w) = (w − ŵ)ᵀ H (w − ŵ), H = diag(2; 1). A kényszeres optimum pontos számítás (L1: csúcsok és élek, L2: KKT-feltétel). A kiemelt ellipszisek a két optimumon mennek át: folytonos = L1, szaggatott = L2.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const H = [2.0, 1.0]; let wh = [1.5, 0.5].slice(), p = 1, pinf = false, r = 1;
// (a) panel: x ∈ [-1,5; 1,5] → 20..300; (b) panel: w ∈ [-1,6; 2,6] → 340..620
const A = {x0: 20, y0: 20, s: 280 / 3, c: 1.5};
const B = {x0: 340, y0: 20, s: 280 / 4.2, lo: -1.6, hi: 2.6};
const ax = x => A.x0 + (x + A.c) * A.s, ay = y => A.y0 + (A.c - y) * A.s;
const bx = x => B.x0 + (x - B.lo) * B.s, by = y => B.y0 + (B.hi - y) * B.s;
function ballPts(pp, R, fx, fy){ let d = ""; for (let i = 0; i <= 360; i++){ const t = i * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  let x, y; if (pp === Infinity){ const m = Math.max(Math.abs(c), Math.abs(s)); x = c / m; y = s / m; }
  else { x = Math.sign(c) * Math.pow(Math.abs(c), 2 / pp); y = Math.sign(s) * Math.pow(Math.abs(s), 2 / pp); }
  d += (i ? "L" : "M") + fx(R * x).toFixed(1) + " " + fy(R * y).toFixed(1); } return d + "Z"; }
const f = w => H[0] * (w[0] - wh[0]) ** 2 + H[1] * (w[1] - wh[1]) ** 2;
function l1opt(R){
  if (Math.abs(wh[0]) + Math.abs(wh[1]) <= R) return wh.slice();
  const V = [[R, 0], [0, R], [-R, 0], [0, -R]]; let best = null, bf = Infinity;
  const tryp = w => { const v = f(w); if (v < bf - 1e-12){ bf = v; best = w; } };
  V.forEach(tryp);
  for (let i = 0; i < 4; i++){ const a = V[i], b = V[(i + 1) % 4], d = [b[0] - a[0], b[1] - a[1]];
    let t = (H[0] * d[0] * (wh[0] - a[0]) + H[1] * d[1] * (wh[1] - a[1])) / (H[0] * d[0] ** 2 + H[1] * d[1] ** 2);
    t = Math.min(1, Math.max(0, t)); tryp([a[0] + t * d[0], a[1] + t * d[1]]); }
  return best; }
function l2opt(R){
  if (Math.hypot(wh[0], wh[1]) <= R) return wh.slice();
  let lo = 0, hi = 1e6; for (let i = 0; i < 200; i++){ const mu = (lo + hi) / 2;
    if (Math.hypot(H[0] * wh[0] / (H[0] + mu), H[1] * wh[1] / (H[1] + mu)) > R) lo = mu; else hi = mu; }
  return [H[0] * wh[0] / (H[0] + hi), H[1] * wh[1] / (H[1] + hi)]; }
function ell(c, dash, w){ el("ellipse", {cx: bx(wh[0]), cy: by(wh[1]), rx: Math.sqrt(c / H[0]) * B.s, ry: Math.sqrt(c / H[1]) * B.s,
  fill: "none", stroke: css("--muted"), "stroke-width": w || 1, "stroke-dasharray": dash || ""}); }
const P = v => "(" + fmt(v[0], 2) + "; " + fmt(v[1], 2) + ")";
function draw(){
  svg.innerHTML = "";
  // (a)
  el("rect", {x: A.x0, y: A.y0, width: 280, height: 280, fill: "none", stroke: css("--grid")});
  el("line", {x1: ax(-1.5), y1: ay(0), x2: ax(1.5), y2: ay(0), stroke: css("--grid")});
  el("line", {x1: ax(0), y1: ay(-1.5), x2: ax(0), y2: ay(1.5), stroke: css("--grid")});
  el("path", {d: ballPts(1, 1, ax, ay), fill: "none", stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": "2 3"});
  el("path", {d: ballPts(2, 1, ax, ay), fill: "none", stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": "6 4"});
  const pp = pinf ? Infinity : p;
  el("path", {d: ballPts(pp, 1, ax, ay), fill: "none", stroke: pp < 1 ? css("--hl2") : css("--hl"), "stroke-width": 2.6});
  el("text", {x: A.x0 + 6, y: A.y0 + 16, "font-size": 13}, "(a) ‖x‖_p = 1, p = " + (pinf ? "∞" : fmt(p, 2)));
  el("text", {x: A.x0 + 6, y: A.y0 + 272, "font-size": 11, fill: css("--muted")}, "halvány: p = 1 (pontozott), p = 2 (szaggatott)");
  [[1,0],[0,1],[-1,0],[0,-1]].forEach(v => el("circle", {cx: ax(v[0]), cy: ay(v[1]), r: 3, fill: css("--fg")}));
  // (b)
  el("rect", {x: B.x0, y: B.y0, width: 280, height: 280, fill: "none", stroke: css("--grid")});
  el("line", {x1: bx(B.lo), y1: by(0), x2: bx(B.hi), y2: by(0), stroke: css("--grid")});
  el("line", {x1: bx(0), y1: by(B.lo), x2: bx(0), y2: by(B.hi), stroke: css("--grid")});
  const w1 = l1opt(r), w2 = l2opt(r);
  [0.15, 0.6, 2.5].forEach(c => ell(c, "", 0.8));
  ell(f(w1), "", 1.6); ell(f(w2), "5 3", 1.6);
  el("path", {d: ballPts(1, r, bx, by), fill: css("--fill"), "fill-opacity": 0.6, stroke: css("--fg"), "stroke-width": 2.4});
  el("path", {d: ballPts(2, r, bx, by), fill: "none", stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("circle", {cx: bx(w1[0]), cy: by(w1[1]), r: 7, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2.5});
  const tx = bx(w2[0]), ty = by(w2[1]);
  el("path", {d: `M${tx} ${ty - 8}L${tx + 7} ${ty + 5}L${tx - 7} ${ty + 5}Z`, fill: css("--hl"), stroke: css("--fg")});
  const h = el("g", {class: "drag", tabindex: 0, role: "button", "aria-label": "Az OLS-optimum ŵ húzható pontja (nyilakkal is mozgatható)"});
  el("circle", {cx: bx(wh[0]), cy: by(wh[1]), r: 12, fill: "transparent"}, undefined, h);
  el("path", {d: `M${bx(wh[0]) - 8} ${by(wh[1])}h16M${bx(wh[0])} ${by(wh[1]) - 8}v16`, stroke: css("--fg"), "stroke-width": 2.5}, undefined, h);
  el("text", {x: bx(wh[0]) + 10, y: by(wh[1]) - 8, "font-size": 12}, "ŵ (húzd)");
  el("text", {x: B.x0 + 6, y: B.y0 + 16, "font-size": 13}, "(b) min f(w) a korláton, r = " + fmt(r, 2));
  el("text", {x: B.x0 + 6, y: B.y0 + 272, "font-size": 11, fill: css("--muted")}, "○ L1-optimum   ▲ L2-optimum   H = diag(2; 1)");
  h.addEventListener("pointerdown", e => { drag = true; h.setPointerCapture(e.pointerId); });
  h.addEventListener("keydown", e => { const d = {ArrowLeft: [-.05, 0], ArrowRight: [.05, 0], ArrowUp: [0, .05], ArrowDown: [0, -.05]}[e.key];
    if (d){ e.preventDefault(); wh[0] += d[0]; wh[1] += d[1]; draw(); svg.querySelector("g.drag").focus(); } });
  const z = v => Math.abs(v) < 1e-9;
  const n0 = (z(w1[0]) ? 1 : 0) + (z(w1[1]) ? 1 : 0);
  status.textContent = `ŵ = ${P(wh)}. L1: w = ${P(w1)} – ${n0 ? n0 + " nulla koordináta (ritka)" : "nem ritka"}; ` +
    `L2: w = ${P(w2)}; f(L1) = ${fmt(f(w1), 3)}, f(L2) = ${fmt(f(w2), 3)}.`;
  document.getElementById("warn").textContent = (!pinf && p < 1) ? "p < 1: nem norma (a gömb nem konvex, a háromszög-egyenlőtlenség sérül)." : "";
}
let drag = false;
svg.addEventListener("pointermove", e => { if (!drag) return; const q = svgPt(e);
  wh = [Math.max(-1.5, Math.min(2.5, B.lo + (q.x - B.x0) / B.s)), Math.max(-1.5, Math.min(2.5, B.hi - (q.y - B.y0) / B.s))]; draw(); });
window.addEventListener("pointerup", () => { drag = false; });
const pe = document.getElementById("p"), re = document.getElementById("r");
pe.oninput = () => { pinf = false; p = +pe.value; document.getElementById("pv").textContent = fmt(p, 2); draw(); };
document.getElementById("pinf").onclick = () => { pinf = true; document.getElementById("pv").textContent = "∞"; draw(); };
re.oninput = () => { r = +re.value; document.getElementById("rv").textContent = fmt(r, 2); draw(); };
document.getElementById("reset").onclick = () => { wh = [1.5, 0.5].slice(); p = 1; pinf = false; r = 1; pe.value = 1; re.value = 1;
  document.getElementById("pv").textContent = "1,00"; document.getElementById("rv").textContent = "1,00"; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
