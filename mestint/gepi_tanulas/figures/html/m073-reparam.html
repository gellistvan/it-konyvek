<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reparaméterezési trükk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="radio" name="pm" checked onchange="mode='R'; show(k)"> reparaméterezés</label>
<label><input type="radio" name="pm" onchange="mode='L'; show(k)"> mintavétel a gráfban (nem tanul)</label>
<button onclick="newEps()">új ε</button><span id="epsinfo" class="small" aria-live="polite">ε = 1,5 (könyvi példa)</span>
<button onclick="EPSV=1.5; seedN=0; document.getElementById('epsinfo').textContent='ε = 1,5 (könyvi példa)'; show(k)">ε = 1,5</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Számítási gráf: a mintavételi csomópont megszakítja a gradienst, a reparaméterezett z = μ + σ·ε alakban a gradiens μ-ig és σ-ig jut."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egydimenziós számpélda (számított): μ = 0,5, σ = 0,2, ε = 1,5 → z = 0,8. Az „új ε” gomb rögzített kezdőértékű álvéletlen-generátorral húz. Kód: a 20.1.8 VAE forward és reparameterize metódusa.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "fw", "node": "x", "line": 0, "idx": 0, "msg": "Előremenet: a bemenet x."}, {"ph": "fw", "node": "enc", "line": 1, "idx": 1, "msg": "Az encoder (φ) kimenete két fej: μ és log σ²."}, {"ph": "fw", "node": "mu", "line": 1, "idx": 2, "msg": "μ = 0,5 és log σ² = ln 0,04 ≈ −3,219 (egy latens dimenzió)."}, {"ph": "fw", "node": "sig", "line": 6, "idx": 3, "msg": "σ = exp(0,5 · log σ²) = 0,2."}, {"ph": "fw", "node": "eps", "line": 7, "idx": 4, "msg": "ε ~ N(0, 1) külső zajbemenet: ε = 1,5 (konstansként kezeljük)."}, {"ph": "fw", "node": "z", "line": 8, "idx": 5, "msg": "z = μ + σ·ε = 0,5 + 0,2 · 1,5 = 0,8."}, {"ph": "fw", "node": "dec", "line": 3, "idx": 6, "msg": "A decoder (θ) a z-ből rekonstruál: x̂."}, {"ph": "fw", "node": "xh", "line": 9, "idx": 7, "msg": "Veszteség: −ELBO (rekonstrukció + KL)."}, {"ph": "bw", "node": "dec", "line": 10, "idx": 8, "msg": "Visszaterjesztés: ∂L/∂z a decoderen át."}, {"ph": "bw", "node": "mu", "line": 10, "idx": 9, "msg": "z → μ él: ∂z/∂μ = 1, a gradiens eljut μ-ig."}, {"ph": "bw", "node": "sig", "line": 10, "idx": 10, "msg": "z → σ él: ∂z/∂σ = ε = 1,5; σ → log σ²: ∂σ/∂log σ² = 0,5·σ = 0,1."}, {"ph": "bw", "node": "enc", "line": 10, "idx": 11, "msg": "μ és log σ² gradiense az encoder (φ) paramétereihez jut."}];
const CODE = ["def forward(self, x):", "    mu, logvar = self.encode(x)          # mindkettő (N, latent_dim)", "    z = self.reparameterize(mu, logvar)", "    px = self.decode(z)", "    return px, mu, logvar", "def reparameterize(self, mu, logvar):", "    std = torch.exp(0.5 * logvar)   # shape: (N, latent_dim)", "    eps = torch.randn_like(std)     # shape: (N, latent_dim)", "    return mu + eps * std           # shape: (N, latent_dim)", "loss = vae_loss(x, px, mu, logvar)      # negatív ELBO / minta", "loss.backward()"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let mode = "R", EPSV = 1.5, seedN = 0;
const MU = 0.5, SIGV = 0.2, G = {"R": {"x": [4.6, 9.2], "enc": [4.6, 8.0], "mu": [2.2, 6.6], "lv": [8.0, 6.6], "sig": [8.4, 5.2], "eps": [10.3, 3.6], "z": [4.6, 3.6], "dec": [4.6, 2.2], "xh": [4.6, 0.9]}, "L": {"x": [5, 9.2], "enc": [5, 8.0], "mu": [2.2, 6.6], "lv": [7.8, 6.6], "z": [5, 4.2], "dec": [5, 2.2], "xh": [5, 0.9]}, "V": {"mu": [0.95, 6.6, "\u03bc = 0,5", "right"], "lv": [9.25, 6.6, "\u2248 \u22123,219", "left"], "sig": [11.0, 4.6, "\u03c3 = 0,2", "center"], "eps": [10.3, 2.65, "\u03b5 = 1,5", "center"], "z": [6.9, 3.0, "z = 0,8", "left"]}};
function hu2(x, d){ return Number(x).toFixed(d).replace(".", ",").replace("-", "−"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 420");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), wr = css("--hl2");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${wr}"/></marker><pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;
  svg.appendChild(defs);
  const P = G[mode], X = v => 30 + (v + 0.8) * 46, Y = v => 400 - v * 40;
  const z = MU + SIGV * EPSV;
  const fwDone = new Set(), bwDone = new Set();
  for (let i = 0; i <= s.idx; i++){ const q = STEPS_ALL[i]; if (q.ph === "fw"){ fwDone.add(q.node); if (q.node === "mu") fwDone.add("lv"); if (mode === "L" && (q.node === "sig" || q.node === "eps")) fwDone.add("z"); } else bwDone.add(q.node); }
  const LBL = {x: "x", enc: "encoder (φ)", mu: "μ", lv: "log σ²", sig: "σ = exp(0,5·log σ²)", eps: "ε ~ N(0, 1)", z: mode === "R" ? "z = μ + σ⊙ε" : "z ~ N(μ, σ²)", dec: "decoder (θ)", xh: "x̂ → −ELBO"};
  const HW = {}; Object.keys(P).forEach(id => { HW[id] = id === "eps" ? [70, 22] : (mode === "L" && id === "z") ? [70, 44] : [Math.max(26, LBL[id].length * 4.3 + 10), 14]; });
  function clip(a, b){ // a→b szakasz, mindkét végén a doboz szélére vágva
    const ax = X(P[a][0]), ay = Y(P[a][1]), bx = X(P[b][0]), by = Y(P[b][1]), dx = bx - ax, dy = by - ay;
    const f = id => Math.min(HW[id][0] / Math.max(1e-9, Math.abs(dx)), HW[id][1] / Math.max(1e-9, Math.abs(dy)));
    const ta = f(a), tb = f(b);
    return [ax + dx * ta, ay + dy * ta, bx - dx * (tb + 0.01), by - dy * (tb + 0.01)];
  }
  const E = mode === "R" ? [["x","enc"],["enc","mu"],["enc","lv"],["lv","sig"],["mu","z"],["sig","z"],["eps","z"],["z","dec"],["dec","xh"]] : [["x","enc"],["enc","mu"],["enc","lv"],["mu","z"],["lv","z"],["z","dec"],["dec","xh"]];
  E.forEach(([a, b]) => { const c = clip(a, b); el("line", {x1: c[0], y1: c[1], x2: c[2], y2: c[3], stroke: fg, "stroke-width": 1.5, "marker-end": "url(#ma)", opacity: fwDone.has(b) ? 1 : 0.3}); });
  Object.keys(P).forEach(id => {
    const x = X(P[id][0]), y = Y(P[id][1]), on = fwDone.has(id), cur = s.node === id || (s.node === "mu" && id === "lv" && s.ph === "fw");
    const st = cur ? hl : fg, sw = cur ? 3.2 : 1.4, op = on ? 1 : 0.45, [hw, hh] = HW[id];
    if (mode === "L" && id === "z"){ el("ellipse", {cx: x, cy: y, rx: hw, ry: hh, fill: "url(#pdot)", stroke: st, "stroke-width": sw, opacity: op}); el("rect", {x: x - 52, y: y - 12, width: 104, height: 24, fill: css("--bg")}); }
    else if (id === "eps"){ el("polygon", {points: `${x-hw},${y} ${x},${y-hh} ${x+hw},${y} ${x},${y+hh}`, fill: css("--bg"), stroke: st, "stroke-width": sw, "stroke-dasharray": "5 3", opacity: op}); }
    else el("rect", {x: x - hw, y: y - hh, width: 2 * hw, height: 2 * hh, rx: 6, fill: (id === "x" || id === "xh") ? css("--cellhl") : css("--bg"), stroke: st, "stroke-width": sw, opacity: op});
    el("text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 13.5, opacity: op}, LBL[id]);
  });
  if (mode === "R") Object.keys(G.V).forEach(id => { if (!fwDone.has(id) && !(id === "lv" && fwDone.has("mu"))) return; const [vx, vy, t, ha] = G.V[id];
    const txt = id === "eps" ? "ε = " + hu2(EPSV, 2) : id === "z" ? "z = " + hu2(z, 2) : t;
    el("text", {x: X(vx), y: Y(vy) + 5, "text-anchor": ha === "left" ? "start" : ha === "right" ? "end" : "middle", "font-size": 12.5, fill: mu}, txt); });
  function back(x0, y0, x1, y1, lab, lx, ly, anc){ el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: wr, "stroke-width": 2.4, "stroke-dasharray": "7 4", "marker-end": "url(#mb)"}); if (lab){ const t = el("text", {x: lx, y: ly, "font-size": 13, fill: wr, "font-weight": "bold", "text-anchor": anc || "start"}, lab); } }
  const zx = X(P.z[0]), zy = Y(P.z[1]);
  if (bwDone.has("dec")) back(X(P.xh[0]) - 70, Y(P.xh[1]) - 2, X(P.xh[0]) - 70, zy + HW.z[1] + 4, "∂L/∂z", X(P.xh[0]) - 78, (Y(P.xh[1]) + zy) / 2, "end");
  if (mode === "R"){
    if (bwDone.has("mu")) back(zx - 60, zy - 16, X(P.mu[0]) - 4, Y(P.mu[1]) + 18, "∂z/∂μ = 1", X(P.mu[0]) - 30, (zy + Y(P.mu[1])) / 2 + 4, "end");
    if (bwDone.has("sig")) back(zx + 60, zy - 16, X(P.sig[0]) - 70, Y(P.sig[1]) + 18, "∂z/∂σ = ε = " + hu2(EPSV, 2), X(P.sig[0]) - 40, (zy + Y(P.sig[1])) / 2 + 12, "start");
    if (bwDone.has("enc")){ back(X(P.mu[0]) + 12, Y(P.mu[1]) - 16, X(P.enc[0]) - 50, Y(P.enc[1]) + 16, "", 0, 0); back(X(P.lv[0]) - 12, Y(P.lv[1]) - 16, X(P.enc[0]) + 50, Y(P.enc[1]) + 16, "", 0, 0); }
  } else if (bwDone.has("mu") || bwDone.has("sig") || bwDone.has("enc")){
    const cx = X(P.xh[0]) - 70, cy = zy;
    el("line", {x1: cx - 14, y1: cy - 14, x2: cx + 14, y2: cy + 14, stroke: fg, "stroke-width": 4}); el("line", {x1: cx - 14, y1: cy + 14, x2: cx + 14, y2: cy - 14, stroke: fg, "stroke-width": 4});
    el("text", {x: zx + 80, y: zy - 4, "font-size": 13, fill: wr, "font-weight": "bold"}, "a mintavételen nem jut át");
    el("text", {x: zx + 80, y: zy + 14, "font-size": 13, fill: wr, "font-weight": "bold"}, "gradiens: μ és σ nem tanul");
  }
}
let STEPS_ALL = [{"ph": "fw", "node": "x", "line": 0, "idx": 0, "msg": "Előremenet: a bemenet x."}, {"ph": "fw", "node": "enc", "line": 1, "idx": 1, "msg": "Az encoder (φ) kimenete két fej: μ és log σ²."}, {"ph": "fw", "node": "mu", "line": 1, "idx": 2, "msg": "μ = 0,5 és log σ² = ln 0,04 ≈ −3,219 (egy latens dimenzió)."}, {"ph": "fw", "node": "sig", "line": 6, "idx": 3, "msg": "σ = exp(0,5 · log σ²) = 0,2."}, {"ph": "fw", "node": "eps", "line": 7, "idx": 4, "msg": "ε ~ N(0, 1) külső zajbemenet: ε = 1,5 (konstansként kezeljük)."}, {"ph": "fw", "node": "z", "line": 8, "idx": 5, "msg": "z = μ + σ·ε = 0,5 + 0,2 · 1,5 = 0,8."}, {"ph": "fw", "node": "dec", "line": 3, "idx": 6, "msg": "A decoder (θ) a z-ből rekonstruál: x̂."}, {"ph": "fw", "node": "xh", "line": 9, "idx": 7, "msg": "Veszteség: −ELBO (rekonstrukció + KL)."}, {"ph": "bw", "node": "dec", "line": 10, "idx": 8, "msg": "Visszaterjesztés: ∂L/∂z a decoderen át."}, {"ph": "bw", "node": "mu", "line": 10, "idx": 9, "msg": "z → μ él: ∂z/∂μ = 1, a gradiens eljut μ-ig."}, {"ph": "bw", "node": "sig", "line": 10, "idx": 10, "msg": "z → σ él: ∂z/∂σ = ε = 1,5; σ → log σ²: ∂σ/∂log σ² = 0,5·σ = 0,1."}, {"ph": "bw", "node": "enc", "line": 10, "idx": 11, "msg": "μ és log σ² gradiense az encoder (φ) paramétereihez jut."}];
function newEps(){
  seedN += 1; let a = 1234567 + seedN * 7919; const r = () => { a = (a * 1103515245 + 12345) % 2147483648; return (a + 0.5) / 2147483648; };
  EPSV = Math.sqrt(-2 * Math.log(r())) * Math.cos(2 * Math.PI * r());
  document.getElementById("epsinfo").textContent = `ε = ${hu2(EPSV, 3)} (húzás #${seedN}), z = ${hu2(0.5 + 0.2 * EPSV, 3)}, ∂z/∂σ = ${hu2(EPSV, 3)}`;
  show(k);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
