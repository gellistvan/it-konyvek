<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XOR a rejtett térben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lépések">
<button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span>
<label><input id="norelu" type="checkbox"> ReLU nélkül</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 380" role="img" aria-label="Az XOR négy pontja a síkon; lépésenként átkerülnek a ReLU rejtett réteg terébe, ahol egy egyenes elválasztja az osztályokat"></svg>

<p class="small">Számított, pontos érték: a 15.2.7 kézi példája, h₁ = ReLU(x₁ + x₂), h₂ = ReLU(x₁ + x₂ − 1), y = h₁ − 2h₂. ▲ y = 1, ○ y = 0. Egy pont fölé víve (vagy Tab-bal kijelölve) az állapotsor a leképezést mutatja.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const XS = [[0, 0], [0, 1], [1, 0], [1, 1]], Y = [0, 1, 1, 0];
let step = 0, t = 1, raf = null, relu = true;
const R = v => relu ? Math.max(0, v) : v;
function hid(x){ return [R(x[0] + x[1]), R(x[0] + x[1] - 1)]; }
const lo = [-0.4, -1.3], hi = [2.4, 1.4], L = 60, Rr = 600, T = 20, B = 330;
const PX = v => L + (Rr - L) * (v - lo[0]) / (hi[0] - lo[0]), PY = v => B - (B - T) * (v - lo[1]) / (hi[1] - lo[1]);
function draw(){
  svg.innerHTML = "";
  for (let v = -1; v <= 2; v++){ el("line", {x1: PX(v), y1: T, x2: PX(v), y2: B, stroke: css("--grid")}); el("text", {x: PX(v), y: B + 16, "font-size": 12, "text-anchor": "middle"}, String(v)); }
  for (let v = -1; v <= 1; v++){ el("line", {x1: L, y1: PY(v), x2: Rr, y2: PY(v), stroke: css("--grid")}); el("text", {x: L - 6, y: PY(v) + 4, "font-size": 12, "text-anchor": "end"}, String(v)); }
  const inH = step >= 2 || (step === 1 && t > 0.5);
  el("text", {x: (L + Rr) / 2, y: B + 34, "font-size": 13, "text-anchor": "middle"}, step === 0 ? "x₁" : (relu ? "h₁ = ReLU(x₁ + x₂)" : "h₁ = x₁ + x₂"));
  el("text", {x: 16, y: (T + B) / 2, "font-size": 13, "text-anchor": "middle", transform: `rotate(-90 16 ${(T + B) / 2})`}, step === 0 ? "x₂" : (relu ? "h₂ = ReLU(x₁ + x₂ − 1)" : "h₂ = x₁ + x₂ − 1"));
  if (step === 0){ [[0, "x₁ + x₂ = 0"], [1, "x₁ + x₂ = 1"]].forEach(([c, lab]) => {
      el("line", {x1: PX(c + 1.3), y1: PY(-1.3), x2: PX(c - 1.4), y2: PY(1.4), stroke: css("--muted"), "stroke-dasharray": "6 4", "stroke-width": 1.4});
      el("text", {x: PX(c + 0.35) + 6, y: PY(-0.35) + 4, "font-size": 11, fill: css("--muted")}, lab); }); }
  if (step === 2 && relu){ el("line", {x1: PX(-0.4), y1: PY((-0.4 - 0.5) / 2), x2: PX(2.4), y2: PY((2.4 - 0.5) / 2), stroke: css("--fg"), "stroke-width": 2.5});
    el("text", {x: PX(1.45), y: PY(0.12), "font-size": 13}, "h₁ − 2h₂ = 0,5"); }
  if (step === 2 && !relu){ el("line", {x1: PX(-0.3), y1: PY(-1.3), x2: PX(2.4), y2: PY(1.4), stroke: css("--muted"), "stroke-dasharray": "3 3"});
    el("text", {x: PX(-0.3), y: PY(1.2), "font-size": 13, fill: css("--hl2")}, "ReLU nélkül: mind a 4 pont a h₂ = h₁ − 1 egyenesen;");
    el("text", {x: PX(-0.3), y: PY(1.2) + 17, "font-size": 13, fill: css("--hl2")}, "a címkék sorrendje rajta 0, 1, 1, 0 → nem szeparálható"); }
  const seen = {};
  XS.forEach((x, i) => {
    const h = hid(x), s = step === 0 ? 0 : (step === 1 ? t : 1), p = [x[0] + (h[0] - x[0]) * s, x[1] + (h[1] - x[1]) * s];
    const key = p.map(v => v.toFixed(3)).join(","), dup = seen[key] || 0; seen[key] = dup + 1;
    const cx = PX(p[0]) + dup * 7, cy = PY(p[1]) - dup * 7, out = h[0] - 2 * h[1];
    const g = el("g", {tabindex: 0, class: "pt"});
    if (Y[i] === 1) el("path", {d: `M${cx} ${cy - 11}l10 18h-20z`, fill: css("--fg")}, undefined, g);
    else el("circle", {cx, cy, r: 9, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2.2}, undefined, g);
    const info = `(${x[0]}; ${x[1]}) → (h₁; h₂) = (${fmt(h[0], 0)}; ${fmt(h[1], 0)}) → y = ${fmt(out, 0)}`;
    el("title", {}, info, g);
    g.addEventListener("mouseenter", () => status.textContent = info); g.addEventListener("focus", () => status.textContent = info);
    if (step === 2 || step === 0){ el("text", {x: cx + 13, y: cy - 10, "font-size": 12}, step === 0 ? `(${x[0]},${x[1]})` : (dup ? "" : (relu ? `y = ${fmt(out, 0)}` : `kimenet ${fmt(out, 0)} (cél ${Y[i]})`))); }
  });
  if (step === 2 && relu) el("text", {x: PX(1) + 14, y: PY(0) + 22, "font-size": 12}, "×2: (0,1) és (1,0)");
  document.getElementById("cnt").textContent = `${step + 1}/3`;
  status.textContent = [
    "1. lépés – bemeneti tér: az XOR két osztálya átlósan áll, egyetlen egyenes nem választja el őket. (Vidd az egeret egy pont fölé.)",
    relu ? "2. lépés – a rejtett réteg a pontokat a (h₁, h₂) = (ReLU(x₁+x₂), ReLU(x₁+x₂−1)) helyre viszi: (0,0), (1,0) kétszer, (2,1)." : "2. lépés – ReLU nélkül h = (x₁+x₂, x₁+x₂−1): a pontok egy egyenesre képeződnek.",
    relu ? "3. lépés – a kimenet y = h₁ − 2h₂ lineáris a rejtett térben; a h₁ − 2h₂ = 0,5 egyenes elválasztja az osztályokat: y = 0, 1, 1, 0." : "3. lépés – ReLU nélkül az egész háló lineáris marad: az egy egyenesre eső 0, 1, 1, 0 sorrendet egy küszöb sem választja szét."][step];
}
function go(s){ step = Math.max(0, Math.min(2, s)); if (raf) cancelAnimationFrame(raf); raf = null;
  if (step === 1){ t = 0; const t0 = performance.now(); const f = now => { t = Math.min(1, (now - t0) / 900); draw(); if (t < 1) raf = requestAnimationFrame(f); else raf = null; }; raf = requestAnimationFrame(f); }
  else { t = 1; draw(); } }
document.getElementById("prev").onclick = () => go(step - 1);
document.getElementById("next").onclick = () => go(step + 1);
document.getElementById("norelu").onchange = e => { relu = !e.target.checked; go(step); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
