<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RLHF PPO-iteráció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>β = <span id="bv">0,10</span> <input id="beta" type="range" min="0.01" max="1" step="0.01" value="0.1" aria-label="KL-együttható β"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy PPO-iteráció adatfolyama: prompt, generálás, a policy és a referencia log-probjai, a reward modell és a value fej, token-reward, GAE és PPO-frissítés; alatta a token-reward tábla."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A token-rewardok a 23.3.5 token_rewards függvényének átiratából számolva (B = 2, L = 3); a torch-kód nincs futtatva. Kiemelt (vastag, színes) keret: az aktuális lépés; szaggatott keret: fagyasztott modell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"box": "gen", "cols": ["mask"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "line": -1, "beta": 0.1, "msg": "1. Minta: a prompt batchre a π_θ válaszokat generál; y: (B, L) = (2, 3), mask: (2, 3) – a 2. sor utolsó tokenje padding."}, {"box": "eval", "cols": ["mask", "lp"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "line": -1, "beta": 0.1, "msg": "2. Kiértékelés: π_θ és a fagyasztott π_ref tokenenkénti log-prob (2, 3); a fagyasztott r_φ skalárja válaszonként: r_φ = (1; 2); V_ψ: (2, 3)."}, {"box": "kl", "cols": ["mask", "lp", "kl"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "line": 3, "beta": 0.1, "msg": "3. KL-büntetés minden valódi tokenen: −β·(log π_θ − log π_ref)·mask = −0,10·0,1 = −0,010; paddingon 0."}, {"box": "rew", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": 5, "beta": 0.1, "msg": "4. Az utolsó valódi tokenre (last = mask.sum − 1 = (2; 1)) hozzáadjuk r_φ-t: [−0,01; −0,01; 0,99] | [−0,01; 1,99; 0,00]"}, {"box": "gae", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": 6, "beta": 0.1, "msg": "5. Előnyök: a GAE a token-rewardokból és a V_ψ értékekből tokenenként A_t-t és R̂_t-t számol (2, 3)."}, {"box": "ppo", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": -1, "beta": 0.1, "msg": "6. PPO-frissítés: K epoch mini-batch frissítés a begyűjtött adaton (clip-célfüggvény) – csak π_θ (LoRA) és V_ψ tanul."}, {"box": "log", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": -1, "beta": 0.1, "msg": "7. Kiírás: átlagos reward, átlagos KL és mintaszövegek; a következő iteráció új rolloutot gyűjt."}];
const CODE = ["def token_rewards(rm_score, old_log_prob, ref_log_prob, mask, beta):", "    \"\"\"A KL-büntetés a rewardba kerül (4.2. szakasz): r_t = -beta*KL_t, az utolsó", "    valódi tokenen + a reward modell skaláris pontszáma (jobbra paddelt batch).\"\"\"", "    r = -beta * (old_log_prob - ref_log_prob) * mask         # [B, L]", "    last = mask.sum(dim=1).long() - 1                        # [B]", "    r[torch.arange(r.size(0)), last] += rm_score             # rm_score: [B]", "    return r   # a GAE ebből számolja az advantage-t ([B, L]) és a hozamot"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const INIT = [{"box": "gen", "cols": ["mask"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "line": -1, "beta": 0.1, "msg": "1. Minta: a prompt batchre a π_θ válaszokat generál; y: (B, L) = (2, 3), mask: (2, 3) – a 2. sor utolsó tokenje padding."}, {"box": "eval", "cols": ["mask", "lp"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "line": -1, "beta": 0.1, "msg": "2. Kiértékelés: π_θ és a fagyasztott π_ref tokenenkénti log-prob (2, 3); a fagyasztott r_φ skalárja válaszonként: r_φ = (1; 2); V_ψ: (2, 3)."}, {"box": "kl", "cols": ["mask", "lp", "kl"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "line": 3, "beta": 0.1, "msg": "3. KL-büntetés minden valódi tokenen: −β·(log π_θ − log π_ref)·mask = −0,10·0,1 = −0,010; paddingon 0."}, {"box": "rew", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": 5, "beta": 0.1, "msg": "4. Az utolsó valódi tokenre (last = mask.sum − 1 = (2; 1)) hozzáadjuk r_φ-t: [−0,01; −0,01; 0,99] | [−0,01; 1,99; 0,00]"}, {"box": "gae", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": 6, "beta": 0.1, "msg": "5. Előnyök: a GAE a token-rewardokból és a V_ψ értékekből tokenenként A_t-t és R̂_t-t számol (2, 3)."}, {"box": "ppo", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": -1, "beta": 0.1, "msg": "6. PPO-frissítés: K epoch mini-batch frissítés a begyűjtött adaton (clip-célfüggvény) – csak π_θ (LoRA) és V_ψ tanul."}, {"box": "log", "cols": ["mask", "lp", "kl", "r"], "mask": [["valódi", "valódi", "valódi"], ["valódi", "valódi", "pad"]], "kl": [["−0,01", "−0,01", "−0,01"], ["−0,01", "−0,01", "0,00"]], "r": [["−0,01", "−0,01", "0,99"], ["−0,01", "1,99", "0,00"]], "line": -1, "beta": 0.1, "msg": "7. Kiírás: átlagos reward, átlagos KL és mintaszövegek; a következő iteráció új rolloutot gyűjt."}];

const MASK = [[1, 1, 1], [1, 1, 0]], RM = [1, 2];
function h2(x, d){ let s = x.toFixed(d === undefined ? 2 : d); if (+s === 0) s = s.replace("-", ""); return s.replace(".", ",").replace("-", "−"); }
function stepsJS(beta){
  const kl = MASK.map(r => r.map(m => -beta * 0.1 * m));
  const rr = kl.map(r => r.slice());
  MASK.forEach((r, b) => { const last = r.reduce((a, c) => a + c, 0) - 1; rr[b][last] += RM[b]; });
  const tab = m => m.map(r => r.map(v => h2(v)));
  const msk = MASK.map(r => r.map(v => v ? "valódi" : "pad"));
  return [
    {box: "gen", cols: ["mask"], mask: msk, line: -1, beta: beta, msg: "1. Minta: a prompt batchre a π_θ válaszokat generál; y: (B, L) = (2, 3), mask: (2, 3) – a 2. sor utolsó tokenje padding."},
    {box: "eval", cols: ["mask", "lp"], mask: msk, line: -1, beta: beta, msg: "2. Kiértékelés: π_θ és a fagyasztott π_ref tokenenkénti log-prob (2, 3); a fagyasztott r_φ skalárja válaszonként: r_φ = (1; 2); V_ψ: (2, 3)."},
    {box: "kl", cols: ["mask", "lp", "kl"], mask: msk, kl: tab(kl), line: 3, beta: beta, msg: "3. KL-büntetés minden valódi tokenen: −β·(log π_θ − log π_ref)·mask = −" + h2(beta) + "·0,1 = " + h2(-beta * 0.1, 3) + "; paddingon 0."},
    {box: "rew", cols: ["mask", "lp", "kl", "r"], mask: msk, kl: tab(kl), r: tab(rr), line: 5, beta: beta, msg: "4. Az utolsó valódi tokenre (last = mask.sum − 1 = (2; 1)) hozzáadjuk r_φ-t: " + tab(rr).map(r => "[" + r.join("; ") + "]").join(" | ")},
    {box: "gae", cols: ["mask", "lp", "kl", "r"], mask: msk, kl: tab(kl), r: tab(rr), line: 6, beta: beta, msg: "5. Előnyök: a GAE a token-rewardokból és a V_ψ értékekből tokenenként A_t-t és R̂_t-t számol (2, 3)."},
    {box: "ppo", cols: ["mask", "lp", "kl", "r"], mask: msk, kl: tab(kl), r: tab(rr), line: -1, beta: beta, msg: "6. PPO-frissítés: K epoch mini-batch frissítés a begyűjtött adaton (clip-célfüggvény) – csak π_θ (LoRA) és V_ψ tanul."},
    {box: "log", cols: ["mask", "lp", "kl", "r"], mask: msk, kl: tab(kl), r: tab(rr), line: -1, beta: beta, msg: "7. Kiírás: átlagos reward, átlagos KL és mintaszövegek; a következő iteráció új rolloutot gyűjt."}];
}
function B(x, y, w, h, t, kind, on){
  el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: kind === "f" ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : (kind === "t" ? 2.4 : 1), "stroke-dasharray": kind === "f" ? "5 3" : ""});
  t.split("\n").forEach((s, i, a) => el("text", {x: x + w / 2, y: y + h / 2 + 5 + (i - (a.length - 1) / 2) * 15, "text-anchor": "middle", "font-size": 12}, s));
}
function A(x1, y1, x2, y2, dash){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": dash ? "6 4" : "", "marker-end": "url(#ah)"}); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 400");
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  const on = k => s.box === k;
  B(10, 10, 110, 40, "prompt batch", "n", false);
  B(160, 10, 130, 40, "π_θ generál\ny: (B, L)", "t", on("gen"));
  B(10, 90, 140, 40, "π_θ log-prob\n(B, L)", "t", on("eval") || on("kl"));
  B(165, 90, 140, 40, "π_ref log-prob\n(fagyasztott)", "f", on("eval") || on("kl"));
  B(320, 90, 140, 40, "r_φ skalár (B,)\n(fagyasztott)", "f", on("eval") || on("rew"));
  B(475, 90, 150, 40, "V_ψ (B, L)", "t", on("eval") || on("gae"));
  B(60, 170, 170, 44, "token-reward\n−β·KL_t (+ r_φ az utolsón)", "n", on("kl") || on("rew"));
  B(260, 170, 140, 44, "GAE: A_t, R̂_t", "n", on("gae"));
  B(430, 170, 190, 44, "K epoch mini-batch PPO\n→ π_θ (LoRA), V_ψ", "t", on("ppo") || on("log"));
  A(120, 30, 160, 30); A(225, 50, 80, 90); A(225, 50, 235, 90); A(225, 50, 390, 90); A(225, 50, 550, 90);
  A(80, 130, 120, 170); A(235, 130, 160, 170); A(390, 130, 220, 170); A(230, 192, 260, 192); A(400, 192, 430, 192); A(550, 130, 350, 170);
  A(620, 180, 290, 30, true);
  // tábla
  const cols = s.cols, X = 20, Y = 250;
  el("text", {x: X, y: Y, "font-size": 12, "font-weight": "bold"}, "B = 2, L = 3, β = " + h2(s.beta) + ", log π_θ − log π_ref = 0,1, r_φ = (1; 2)");
  const hd = ["", "t = 1", "t = 2", "t = 3"];
  hd.forEach((h, j) => el("text", {x: X + (j ? 200 + (j - 1) * 130 : 0), y: Y + 24, "font-size": 12, "font-weight": "bold"}, h));
  let yy = Y + 44;
  const rowsOf = [];
  for (let b = 0; b < 2; b++) {
    rowsOf.push(["mask, " + (b + 1) + ". sor", s.mask[b]]);
    if (cols.includes("kl")) rowsOf.push(["−β·KL_t, " + (b + 1) + ". sor", s.kl[b]]);
    if (cols.includes("r")) rowsOf.push(["token-reward, " + (b + 1) + ". sor", s.r[b], b]);
  }
  rowsOf.forEach(r => { el("text", {x: X, y: yy, "font-size": 12}, r[0]);
    r[1].forEach((v, j) => { const last = r.length > 2 && j === MASK[r[2]].reduce((a, c) => a + c, 0) - 1;
      el("text", {x: X + 200 + j * 130, y: yy, "font-size": 12, "font-weight": last ? "bold" : "normal", fill: last ? css("--hl2") : css("--fg")}, v); });
    yy += 17; });
}
document.getElementById("beta").addEventListener("input", e => { document.getElementById("bv").textContent = h2(+e.target.value); const cur = k; setSteps(stepsJS(+e.target.value)); show(cur); });
document.body.dataset.selfcheck = JSON.stringify(stepsJS(0.1)) === JSON.stringify(INIT) ? "OK" : "ELTÉRÉS";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
