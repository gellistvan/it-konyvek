<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagging: az átlag varianciája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label for="rho">ρ</label><input id="rho" type="range" min="0" max="1" step="0.05" value="0.3"><b id="rv"></b>
<label for="bb">B</label><input id="bb" type="range" min="1" max="500" step="1" value="100"><b id="bv"></b>
<label><input id="mf" type="checkbox"> max_features csökkentése (illusztratív: ρ felére)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 335" role="img" aria-label="Az átlag varianciája a fák számának függvényében logaritmikus tengelyen, a ρ és a B csúszkával; a ρσ² padló szaggatott vonallal"></svg>

<p class="small">Számított a képletből, nem mérés: Var = ρσ² + (1 − ρ)σ²/B, σ² = 1. A „max_features csökkentése” kapcsoló csak szemléltetés (ρ felezése): a jellemző-mintavétel valóban csökkenti a fák korrelációját, de a mértéke adat- és modellfüggő, nem mért kapcsolat.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

let rho = 0.3, B = 100, mf = false;
const L = Math.log10, X = b => 60 + (L(b) / L(500)) * 520, Yv = v => 290 - v * 250;
const V = (b, r) => r + (1 - r) / b;
function draw(){
  svg.innerHTML = "";
  const r = mf ? rho / 2 : rho;
  el("rect", {x: 60, y: 40, width: 520, height: 250, fill: "none", stroke: css("--grid")});
  [1, 2, 5, 10, 20, 50, 100, 200, 500].forEach(b => { el("line", {x1: X(b), y1: 40, x2: X(b), y2: 290, stroke: css("--grid")});
    el("text", {x: X(b), y: 306, "text-anchor": "middle", "font-size": 12}, String(b)); });
  [0, 0.25, 0.5, 0.75, 1].forEach(v => el("text", {x: 52, y: Yv(v) + 4, "text-anchor": "end", "font-size": 12}, fmt(v, 2)));
  [0, 0.1, 0.3, 0.6, 1].forEach(q => { let d = ""; for (let i = 0; i <= 200; i++){ const b = Math.pow(500, i / 200); d += (i ? "L" : "M") + X(b).toFixed(1) + " " + Yv(V(b, q)).toFixed(1); }
    el("path", {d, fill: "none", stroke: css("--muted"), "stroke-width": 1}); });
  let d = ""; for (let i = 0; i <= 200; i++){ const b = Math.pow(500, i / 200); d += (i ? "L" : "M") + X(b).toFixed(1) + " " + Yv(V(b, r)).toFixed(1); }
  el("line", {x1: 60, y1: Yv(r), x2: 580, y2: Yv(r), stroke: css("--hl2"), "stroke-dasharray": "4 3", "stroke-width": 1.5});
  el("path", {d, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  el("circle", {cx: X(B), cy: Yv(V(B, r)), r: 7, fill: css("--hl2"), stroke: css("--fg")});
  el("text", {x: 576, y: Yv(r) - 6, "text-anchor": "end", "font-size": 12, fill: css("--hl2")}, "padló ρσ² = " + fmt(r, 3));
  el("text", {x: 320, y: 326, "text-anchor": "middle", "font-size": 12}, "fák száma B (log skála)");
  el("text", {x: 64, y: 30, "font-size": 12, fill: css("--muted")}, "halvány: ρ = 0; 0,1; 0,3; 0,6; 1   kék: aktuális ρ   σ² = 1");
  status.textContent = `ρ = ${fmt(r, 3)}${mf ? " (illusztratív: a csúszka ρ-jának fele)" : ""}, B = ${B}: ρσ² = ${fmt(r, 3)}, ` +
    `(1−ρ)σ²/B = ${fmt((1 - r) / B, 3)}, összesen Var = ${fmt(V(B, r), 3)}.`;
  document.getElementById("rv").textContent = fmt(rho, 2); document.getElementById("bv").textContent = B;
}
document.getElementById("rho").oninput = e => { rho = +e.target.value; draw(); };
document.getElementById("bb").oninput = e => { B = +e.target.value; draw(); };
document.getElementById("mf").onchange = e => { mf = e.target.checked; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
