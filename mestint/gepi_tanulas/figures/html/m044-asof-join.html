<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point-in-time (as-of) join</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>direction <select id="dir" onchange="show(k)"><option>backward</option><option>forward</option><option>nearest</option></select></label><label>a kiemelt predikció ideje: <span id="tpv">—</span> <input id="tp" type="range" min="0" max="64" value="21" oninput="onSlide()" aria-label="predikciós időpont"></label><button onclick="T = D.PRED.map(p => p[1]); show(k)">időpontok visszaállítása</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal két entitással; a predikciós időpontokból visszafelé mutató nyilak a legutolsó korábbi jellemzőértékre mutatnak, a 7-es entitás február 20-i értéke áthúzva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 12.4.15 kódjának adatai; a backward/forward/nearest eredményt a kód futtatása adja (pandas 3.1.1, venv), a lap ugyanezt a szabályt alkalmazza (allow_exact_matches=True; nearest döntetlennél a korábbit). A csúszkával az aktuális lépés predikciós időpontja mozgatható.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"r": -1, "ph": "all", "line": 0, "msg": ""}, {"r": 0, "ph": "cand", "line": 3, "msg": ""}, {"r": 0, "ph": "pick", "line": 3, "msg": ""}, {"r": 1, "ph": "cand", "line": 3, "msg": ""}, {"r": 1, "ph": "pick", "line": 3, "msg": ""}, {"r": 2, "ph": "cand", "line": 3, "msg": ""}, {"r": 2, "ph": "pick", "line": 3, "msg": ""}, {"r": 3, "ph": "done", "line": 4, "msg": ""}];
const CODE = ["entity_sorted = entity_df.sort_values('as_of')        # (3, 2): 42@01-15, 7@02-01, 42@02-15", "for name, g in feature_df.groupby('feature_name'):     # feature_df: (6, 4), hosszú formátum", "    g_sorted = g.sort_values('as_of')[['entity_key', 'as_of', 'value']].rename(columns={'value': name})", "    wide = pd.merge_asof(wide, g_sorted, on='as_of', by='entity_key', direction='backward')", "# wide: (3, 4) – entity_key, as_of, avg_amount_7d, customer_value_30d"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const D = {"FEAT": {"42|customer_value_30d": [[6, "2023-12-31", 120.0], [37, "2024-01-31", 145.0]], "42|avg_amount_7d": [[16, "2024-01-10", 55.0]], "7|customer_value_30d": [[26, "2024-01-20", 50.0], [57, "2024-02-20", 99.0]], "7|avg_amount_7d": [[31, "2024-01-25", 40.0]]}, "PRED": [["42", 21, "2024-01-15"], ["7", 38, "2024-02-01"], ["42", 52, "2024-02-15"]], "D0": "2023-12-25", "XMAX": 64, "RES": {"pandas": "3.1.1", "backward": [{"entity_key": "42", "as_of": "2024-01-15", "avg_amount_7d": 55.0, "customer_value_30d": 120.0}, {"entity_key": "7", "as_of": "2024-02-01", "avg_amount_7d": 40.0, "customer_value_30d": 50.0}, {"entity_key": "42", "as_of": "2024-02-15", "avg_amount_7d": 55.0, "customer_value_30d": 145.0}], "backward_columns": ["entity_key", "as_of", "avg_amount_7d", "customer_value_30d"], "forward": [{"entity_key": "42", "as_of": "2024-01-15", "avg_amount_7d": null, "customer_value_30d": 145.0}, {"entity_key": "7", "as_of": "2024-02-01", "avg_amount_7d": null, "customer_value_30d": 99.0}, {"entity_key": "42", "as_of": "2024-02-15", "avg_amount_7d": null, "customer_value_30d": null}], "forward_columns": ["entity_key", "as_of", "avg_amount_7d", "customer_value_30d"], "nearest": [{"entity_key": "42", "as_of": "2024-01-15", "avg_amount_7d": 55.0, "customer_value_30d": 120.0}, {"entity_key": "7", "as_of": "2024-02-01", "avg_amount_7d": 40.0, "customer_value_30d": 50.0}, {"entity_key": "42", "as_of": "2024-02-15", "avg_amount_7d": 55.0, "customer_value_30d": 145.0}], "nearest_columns": ["entity_key", "as_of", "avg_amount_7d", "customer_value_30d"]}};

const V = id => document.getElementById(id);
const NM = ["avg_amount_7d", "customer_value_30d"], LANES = [["42","customer_value_30d"],["42","avg_amount_7d"],["7","customer_value_30d"],["7","avg_amount_7d"]];
let T = D.PRED.map(p => p[1]);           // húzható predikciós időpontok (nap a 2023-12-25 óta)
function ds(n){ const t = new Date(Date.UTC(2023, 11, 25 + n)); return t.toISOString().slice(0, 10); }
function f1(v){ return v === null ? "NaN" : v.toFixed(1).replace(".", ","); }
function dir(){ return V("dir").value; }
function asof(e, t, nm, dr){ let c = D.FEAT[e + "|" + nm];
  if (dr === "backward") { c = c.filter(x => x[0] <= t); return c.length ? c[c.length - 1] : null; }
  if (dr === "forward") { c = c.filter(x => x[0] >= t); return c.length ? c[0] : null; }
  let b = null; c.forEach(x => { const s = [Math.abs(x[0] - t), x[0] > t ? 1 : 0]; if (!b || s[0] < b.s[0] || (s[0] === b.s[0] && s[1] < b.s[1])) b = {x, s}; }); return b.x; }
function order(){ return [0, 1, 2].sort((a, b) => T[a] - T[b] || a - b); }
function onSlide(){ const r = cur(); if (r >= 0) { T[r] = +V("tp").value; } show(k); }
function cur(){ const s = STEPS[k]; return s.r >= 0 && s.r < 3 ? order()[s.r] : -1; }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 420"); svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  const X0 = 190, W = 490, tx = n => X0 + n / D.XMAX * W, Y = {}; LANES.forEach((l, i) => Y[l.join("|")] = 50 + i * 52 + (i >= 2 ? 22 : 0));
  LANES.forEach(l => { const y = Y[l.join("|")]; el("line", {x1: X0, y1: y, x2: X0 + W, y2: y, stroke: mu, "stroke-width": 0.8}); el("text", {x: X0 - 8, y: y + 4, "text-anchor": "end", "font-size": 12}, l[0] + " / " + l[1]); });
  ["2024-01-01", "2024-02-01"].forEach(sd => { const n = Math.round((Date.parse(sd) - Date.parse("2023-12-25")) / 864e5); el("line", {x1: tx(n), y1: 268, x2: tx(n), y2: 274, stroke: mu}); el("text", {x: tx(n), y: 288, "text-anchor": "middle", "font-size": 11, fill: mu}, sd); });
  el("line", {x1: X0, y1: 268, x2: X0 + W, y2: 268, stroke: mu});
  const o = order(), dr = dir(), r = cur(), nDone = s.ph === "all" ? 3 : (s.ph === "done" ? 3 : s.r + (s.ph === "pick" ? 1 : 0));
  const showAll = s.ph === "all";
  // predikciós vonalak
  o.forEach((pi, j) => { const [e] = D.PRED[pi], t = T[pi], ys = NM.map(n => Y[e + "|" + n]);
    const on = pi === r; el("line", {x1: tx(t), y1: Math.min(...ys) - 22, x2: tx(t), y2: Math.max(...ys) + 16, stroke: on ? hl : fg, "stroke-width": on ? 2.5 : 1.2, "stroke-dasharray": "6 4"});
    el("text", {x: tx(t), y: Math.min(...ys) - 26, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, `${e} @ ${ds(t).slice(5)}`); });
  // jelölt-halmaz kiemelése és kiválasztás
  const chosen = new Set(), leak = new Set();
  o.forEach((pi, j) => { const [e] = D.PRED[pi], t = T[pi];
    if (!(showAll || j < nDone || (pi === r))) return;
    NM.forEach(nm => { const y = Y[e + "|" + nm];
      if (pi === r && s.ph === "cand") { D.FEAT[e + "|" + nm].forEach(x => { const ok = dr === "backward" ? x[0] <= t : (dr === "forward" ? x[0] >= t : true); if (ok) el("rect", {x: tx(x[0]) - 13, y: y - 13, width: 26, height: 26, fill: "none", stroke: hl, "stroke-width": 2, "stroke-dasharray": "3 2"}); }); return; }
      const a = asof(e, t, nm, dr); if (!a) return; chosen.add(e + "|" + nm + "|" + a[0]); if (a[0] > t) leak.add(e + "|" + nm + "|" + a[0]);
      const x1 = tx(t), x2 = tx(a[0]) + (a[0] < t ? 10 : -10);
      el("path", {d: `M${x1},${y - 4} Q${(x1 + x2) / 2},${y - 26} ${x2},${y - 6}`, fill: "none", stroke: a[0] > t ? h2 : fg, "stroke-width": 1.6});
      el("circle", {cx: x2, cy: y - 6, r: 2.5, fill: a[0] > t ? h2 : fg}); }); });
  for (const key in D.FEAT) { const y = Y[key]; D.FEAT[key].forEach(x => { const id = key + "|" + x[0], c = chosen.has(id), lk = leak.has(id);
    el("circle", {cx: tx(x[0]), cy: y, r: 9, fill: c ? mu : css("--bg"), stroke: lk ? h2 : fg, "stroke-width": c ? 3.2 : 1.2, "stroke-dasharray": lk ? "4 2" : ""});
    if (!c) el("line", {x1: tx(x[0]) - 8, y1: y + 4, x2: tx(x[0]) + 8, y2: y - 4, stroke: fg, "stroke-width": 1});
    el("text", {x: tx(x[0]), y: y + 24, "text-anchor": "middle", "font-size": 11}, f1(x[2]) + " (" + x[1].slice(5) + ")"); }); }
  // eredménytábla
  const ty0 = 312; el("text", {x: 20, y: ty0, "font-size": 12, "font-weight": "bold"}, "wide (" + dr + "):");
  ["entity_key", "as_of", "avg_amount_7d", "customer_value_30d"].forEach((h, j) => el("text", {x: 160 + j * 135, y: ty0, "font-size": 12, "font-weight": "bold"}, h));
  o.forEach((pi, j) => { const [e] = D.PRED[pi], t = T[pi], y = ty0 + 22 * (j + 1);
    if (!(showAll || j < nDone)) { el("text", {x: 160, y, "font-size": 12, fill: mu}, "…"); return; }
    const cells = [e, ds(t)].concat(NM.map(nm => { const a = asof(e, t, nm, dr); return a ? f1(a[2]) + (a[0] > t ? " ⚠ szivárgás" : "") : "NaN"; }));
    cells.forEach((c, jj) => el("text", {x: 160 + jj * 135, y, "font-size": 12, fill: c.includes("⚠") ? h2 : fg, "font-weight": c.includes("⚠") ? "bold" : "normal"}, c)); });
  // állapotsor
  let msg;
  if (s.ph === "all" || s.ph === "done") msg = `direction="${dr}": ` + o.map(pi => { const [e] = D.PRED[pi], t = T[pi]; return `(${e}, ${ds(t).slice(5)}) → ` + NM.map(nm => { const a = asof(e, t, nm, dr); return a ? f1(a[2]) : "NaN"; }).join(" / "); }).join("; ") + (leak.size ? " – a forward/nearest jövőbeli értéket is behozhat: szivárgás!" : "");
  else { const [e] = D.PRED[r], t = T[r];
    msg = `${s.r + 1}. sor (${e} @ ${ds(t)}): ` + NM.map(nm => { const c = D.FEAT[e + "|" + nm], a = asof(e, t, nm, dr);
      const cand = c.filter(x => dr === "backward" ? x[0] <= t : (dr === "forward" ? x[0] >= t : true)).map(x => x[1].slice(5) + "→" + f1(x[2]));
      return s.ph === "cand" ? `${nm}: jelöltek {${cand.join(", ") || "∅"}}${dr === "backward" ? " (τ ≤ t)" : (dr === "forward" ? " (τ ≥ t)" : " (mind)")}` : `${nm}: ${a ? (dr === "backward" ? "max τ ≤ t" : (dr === "forward" ? "min τ ≥ t" : "legközelebbi τ")) + " = " + a[1] + " → " + f1(a[2]) + (a[0] > t ? " (JÖVŐBELI – szivárgás)" : "") : "nincs jelölt → NaN"}`; }).join("; "); }
  status.textContent = msg;
  V("tp").disabled = r < 0; if (r >= 0) V("tp").value = T[r];
  V("tpv").textContent = r >= 0 ? ds(T[r]) : "—";
  const L3 = document.getElementById("L3"); if (L3) L3.textContent = `    wide = pd.merge_asof(wide, g_sorted, on='as_of', by='entity_key', direction='${dr}')`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
