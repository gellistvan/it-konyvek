<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety evaluation: a munkafolyamat</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra: fenyegetési modell, taxonómia, prompt-adathalmaz, mutátor, generáló modell; a modell kimenete a rendszerszűrőbe és külön a független harm-evaluatorba fut; mindkettő a mérőszámokba, majd elemzés és jelentés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat (29.4.3), nem mérés. Szaggatott keret: rendszerszűrő; dupla keret: független kiértékelő. A dobozra kattintva (vagy Enter) az adott lépés szövege és a labor kódsora jelenik meg. A kód a 29.4 labor (nem futtatott) pszeudokódjának összefoglalása.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Fenyegetési modell meghatározása: ki a támadó, milyen hozzáférése van, milyen tartalom káros, mi a szervezet policy-je.", "line": 0, "k": 1}, {"msg": "2. Kockázati taxonómia felvétele: a releváns kategóriák (laborban 5: hate, violence, self-harm, dangerous-instructions, harassment) példapromptokkal.", "line": 0, "k": 2}, {"msg": "3. Prompt-adathalmaz létrehozása: manuális, template-alapú vagy generált (mutált) promptok, deduplikációval és hasheléssel; a mutátor az egyetlen véletlen folyamat (seed = 0, p = 0,5).", "line": 3, "k": 3}, {"msg": "4. Modell lekérdezése rögzített paraméterekkel: temperature, top_p, seed, rendszerutasítás; a modell kimenetét a rendszerszűrő engedi át vagy blokkolja.", "line": 4, "k": 4}, {"msg": "5. Annotáció: független harm-evaluator (emberi címke vagy validált, kalibrált osztályozó) – NEM azonos a rendszerszűrővel.", "line": 6, "k": 5}, {"msg": "6. Mérőszámok: ASR, a modell elutasítási aránya és a szűrő blokkolási aránya külön, átlagos/maximális harm, lefedettség, Wilson-intervallum.", "line": 7, "k": 6}, {"msg": "7. Elemzés: kategóriánkénti bontás konfidencia-intervallummal, hibaminták, korlátok; a szűrő mindkét irányú hibája.", "line": 8, "k": 7}, {"msg": "8. Jelentés: JSON + notebook + lockfile + prompt-hashek, a korlátok felsorolásával.", "line": 9, "k": 8}];
const CODE = ["categories = [\"hate\", \"violence\", \"self-harm\", \"dangerous-instructions\", \"harassment\"]", "BLOCKED_TERMS = [\"bomba\", \"erőszak\", \"gyűlöl\", \"ölj\", \"önkárosítás\", \"zaklat\", \"fegyver\"]", "rng = np.random.default_rng(0)", "prompts = [mutate_prompt(p, rng, p=0.5) for p in base_prompts]   # + dedup, hash", "responses = [mock_policy(p) for p in prompts]                   # π_θ, paraméterek rögzítve", "blocked = [not is_safe(r) for r in responses]                    # rendszerszűrő", "harm = ground_truth_harm   # független annotáció (laborban: minden prompt káros)", "m = asr(blocked, harm), filter_block_rate(blocked), model_refusal_rate(refused)", "# kategóriánkénti bontás + Wilson-intervallum", "json.dump(report, f)       # + notebook, lockfile, prompt-hashek"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = [{"id": "s1", "x": 0.0, "y": 11.8, "w": 7.0, "h": 3.1, "t": "1. Fenyegetési\nmodell (támadó,\nhozzáférés, policy)", "st": "n", "step": 1}, {"id": "s2", "x": 8.0, "y": 11.8, "w": 7.0, "h": 3.1, "t": "2. Kockázati\ntaxonómia\n(laborban 5 kat.)", "st": "n", "step": 2}, {"id": "s3", "x": 16.0, "y": 11.8, "w": 7.0, "h": 3.1, "t": "3. Prompt-adat-\nhalmaz (template,\nmutáció, jailbreak;\ndedup, hash)", "st": "n", "step": 3}, {"id": "mut", "x": 24.0, "y": 11.8, "w": 7.0, "h": 3.1, "t": "Mutátor\n(seed = 0, p = 0,5)", "st": "aux", "step": null}, {"id": "s4", "x": 24.0, "y": 7.9, "w": 7.0, "h": 3.1, "t": "4. Generáló modell\nπ_θ (temperature,\ntop_p, seed,\nsystem prompt)", "st": "n", "step": 4}, {"id": "flt", "x": 24.0, "y": 4.3, "w": 7.0, "h": 2.6, "t": "Rendszerszűrő\n(LexicalBlocklist,\nis_safe)", "st": "filter", "step": null}, {"id": "s5", "x": 8.5, "y": 4.3, "w": 11.0, "h": 2.6, "t": "5. Független harm-evaluator s_φ\n(emberi címke / validált,\nkalibrált osztályozó, τ küszöb)", "st": "eval", "step": 5}, {"id": "s6", "x": 22.0, "y": 0.0, "w": 9.0, "h": 3.0, "t": "6. Mérőszámok: ASR,\nszűrő-blokkolás,\nelutasítás, átl./max.\nharm, lefedettség, CI", "st": "n", "step": 6}, {"id": "s7", "x": 11.5, "y": 0.0, "w": 9.0, "h": 3.0, "t": "7. Elemzés:\nkategóriánként (CI-vel),\nhibaminták, a szűrő\nkét irányú hibája", "st": "n", "step": 7}, {"id": "s8", "x": 0.0, "y": 0.0, "w": 10.0, "h": 3.0, "t": "8. Jelentés: JSON +\nnotebook + lockfile +\nprompt-hashek, korlátok", "st": "n", "step": 8}];
const EDG = [["s1", "r", "s2", "l"], ["s2", "r", "s3", "l"], ["s3", "r", "mut", "l"], ["mut", "b", "s4", "t"], ["s4", "b", "flt", "t"], ["flt", "b", "s6", "t"], ["s6", "l", "s7", "r"], ["s7", "l", "s8", "r"]], XE = [[24.0, 9.5, 14.25, 6.9], [17.0, 4.3, 23.5, 3.0]];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const KX = 20, KY = 20.5, sx = v => 8 + v * KX, sy = v => 322 - v * KY;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const ctr = (b, sd) => sd === "l" ? [b.x, b.y + b.h / 2] : sd === "r" ? [b.x + b.w, b.y + b.h / 2] : sd === "t" ? [b.x + b.w / 2, b.y + b.h] : [b.x + b.w / 2, b.y];
  const by = id => G.find(b => b.id === id);
  const ln = (p, q) => el("line", {x1: sx(p[0]), y1: sy(p[1]), x2: sx(q[0]), y2: sy(q[1]), stroke: css("--fg"), "stroke-width": 1.3, "marker-end": "url(#ah)"});
  EDG.forEach(([a, sa, b, sb]) => ln(ctr(by(a), sa), ctr(by(b), sb)));
  XE.forEach(e => ln([e[0], e[1]], [e[2], e[3]]));
  el("line", {x1: sx(19.5), y1: sy(5.0), x2: sx(24.0), y2: sy(5.0), stroke: css("--fg"), "stroke-dasharray": "5 4"});
  el("line", {x1: sx(21.5), y1: sy(4.5), x2: sx(22.0), y2: sy(5.5), stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: sx(21.75), y: sy(5.9), "text-anchor": "middle", "font-size": 9}, "nem azonos");
  el("text", {x: sx(19.0), y: sy(8.9), "text-anchor": "middle", "font-size": 9}, "válasz");
  el("text", {x: sx(27.8), y: sy(3.9), "font-size": 9}, "blokkolt /"); el("text", {x: sx(27.8), y: sy(3.9) + 11, "font-size": 9}, "átengedett");
  ["szaggatott keret: rendszerszűrő (termék része)", "dupla keret: független kiértékelő (mérés része)", "szürke: mutátor; laborban π_θ = mock_policy,", "szűrő = is_safe"].forEach((t, i) => el("text", {x: sx(0), y: sy(10.4) + 13 * i, "font-size": 10, fill: css("--muted")}, t));
  G.forEach(b => {
    const on = b.step === s.k, done = b.step && b.step < s.k;
    const r = el("rect", {x: sx(b.x), y: sy(b.y + b.h), width: b.w * KX, height: b.h * KY, rx: 6,
      fill: on ? css("--cellhl") : b.st === "aux" ? css("--code") : css("--bg"), stroke: on ? css("--hl") : css("--fg"),
      "stroke-width": on ? 3 : 1.2, "stroke-dasharray": b.st === "filter" ? "6 4" : "", tabindex: b.step ? 0 : -1, role: b.step ? "button" : "", "aria-label": b.step ? `${b.step}. lépés` : ""});
    if (b.st === "eval") el("rect", {x: sx(b.x) + 4, y: sy(b.y + b.h) + 4, width: b.w * KX - 8, height: b.h * KY - 8, rx: 4, fill: "none", stroke: on ? css("--hl") : css("--fg")});
    const lines = b.t.split("\n");
    lines.forEach((t, i) => el("text", {x: sx(b.x + b.w / 2), y: sy(b.y + b.h / 2) + (i - (lines.length - 1) / 2) * 11.5 + 3.5, "text-anchor": "middle", "font-size": 9.5, "font-weight": on ? "bold" : "normal"}, t));
    if (b.step){ r.style.cursor = "pointer"; const go = () => { stop(); show(b.step - 1); };
      r.addEventListener("click", go); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } }); }
    if (done) el("text", {x: sx(b.x) + 6, y: sy(b.y + b.h) + 11, "font-size": 10, fill: css("--muted")}, "✓");
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
