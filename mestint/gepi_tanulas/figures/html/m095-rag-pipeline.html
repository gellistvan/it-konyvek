<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini RAG-labor lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="qq">lekérdezés:</label><input id="qq" type="text" value="Mikor nyílt meg a budapesti metró?" style="flex:1;min-width:220px;font:inherit">
<label for="tk">TOP_K = <b id="tkv">3</b></label><input id="tk" type="range" min="1" max="5" value="3" style="max-width:110px">
<label for="tm">TOP_M = <b id="tmv">2</b></label><input id="tm" type="range" min="1" max="5" value="2" style="max-width:110px"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt dokumentumkártyából a retrieval d1, d3, d2-t tartja meg; az idf-rerank d3-at 2,120, d1-et 1,427 ponttal rangsorolja; a válasz a d3 mondata."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor kódjának átirata (kulcsszavas retrieval, idf-súlyozott rerank, extraktív generátor); számított, a Python-változat helyben lefutott. Próbáld ki a TOP_K = 1 beállítást: a d3 a retrievalben kiesik, és a reranker nem tudja visszahozni.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"q": ["budapesti", "metró", "nyílt"], "scores": [2, 1, 2, 0, 1], "ret": [0, 2, 1], "RR": {"0": 1.4271163556401458, "2": 2.120263536200091, "1": 0.9162907318741551}, "top": [2, 0], "K": 3, "M": 2, "ph": 0, "line": 0, "msg": "tokenizálás: q = {budapesti, metró, nyílt} (stopszavak és írásjelek nélkül)"}, {"q": ["budapesti", "metró", "nyílt"], "scores": [2, 1, 2, 0, 1], "ret": [0, 2, 1], "RR": {"0": 1.4271163556401458, "2": 2.120263536200091, "1": 0.9162907318741551}, "top": [2, 0], "K": 3, "M": 2, "ph": 1, "line": 3, "msg": "retrieval: d1=2, d3=2, d2=1 → top-3 = [d1, d3, d2]"}, {"q": ["budapesti", "metró", "nyílt"], "scores": [2, 1, 2, 0, 1], "ret": [0, 2, 1], "RR": {"0": 1.4271163556401458, "2": 2.120263536200091, "1": 0.9162907318741551}, "top": [2, 0], "K": 3, "M": 2, "ph": 2, "line": 6, "msg": "rerank (idf): d1≈1,427, d3≈2,120, d2≈0,916 → top-2 = [d3, d1]"}, {"q": ["budapesti", "metró", "nyílt"], "scores": [2, 1, 2, 0, 1], "ret": [0, 2, 1], "RR": {"0": 1.4271163556401458, "2": 2.120263536200091, "1": 0.9162907318741551}, "top": [2, 0], "K": 3, "M": 2, "ph": 3, "line": 7, "msg": "generálás: válasz = d3 szövege: „A budapesti metró első vonala 1896-ban indult.”"}];
const CODE = ["def tokenize(text): return {w for w in re.findall(r'\\w+', text.lower()) if w not in STOP}", "def retrieve_kw(query, k):", "    scores = np.array([len(q_tokens & toks) for toks in doc_tokens])", "    idx = np.argsort(-scores, kind='stable')[:k]; return idx, scores[idx]", "def rerank_kw(query, cand_idx, m):", "    scores = np.array([sum(idf[w] for w in q_tokens & doc_tokens[i]) for i in cand_idx])", "    order = np.argsort(-scores, kind='stable')[:m]; return order, scores[order]", "def generate_extractive(query, context_docs): return context_docs[0]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DOCS = ["A Budapesti Állatkert 1866-ban nyílt meg.", "A Széchenyi gyógyfürdő 1913-ban nyílt meg.", "A budapesti metró első vonala 1896-ban indult.", "A budai várnegyed a világörökség része.", "A Duna budapesti szakasza a világörökség része."], IDS = ["d1","d2","d3","d4","d5"], STOP = new Set(["a","az","meg","mikor"]), REL = 2;
function tok(t){ return new Set((t.toLowerCase().match(/[\p{L}\p{N}_]+/gu) || []).filter(w => !STOP.has(w))); }
const DT = DOCS.map(tok), DF = {};
DT.forEach(s => s.forEach(w => DF[w] = (DF[w] || 0) + 1));
const IDF = {}; for (const w in DF) IDF[w] = Math.log(DOCS.length / DF[w]);
function f3(x){ return x.toFixed(3).replace(".", ","); }
function stableDesc(idx, sc){ return idx.map((i, p) => [sc[p], p, i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]); }
function ragSteps(query, K, M){
  const q = tok(query), qt = [...q];
  const scores = DT.map(s => [...s].filter(w => q.has(w)).length);
  const ret = stableDesc([0,1,2,3,4], scores).slice(0, K).map(x => x[2]);
  const rr = ret.map(i => [...DT[i]].filter(w => q.has(w)).reduce((a, w) => a + IDF[w], 0));
  const ord = stableDesc(ret, rr).slice(0, M), top = ord.map(x => x[2]);
  const RR = {}; ret.forEach((i, p) => RR[i] = rr[p]);
  const base = {q: qt, scores: scores, ret: ret, RR: RR, top: top, K: K, M: M};
  return [
    Object.assign({}, base, {ph: 0, line: 0, msg: `tokenizálás: q = {${qt.join(", ")}} (stopszavak és írásjelek nélkül)`}),
    Object.assign({}, base, {ph: 1, line: 3, msg: `retrieval: ${ret.map(i => IDS[i] + "=" + scores[i]).join(", ")} → top-${K} = [${ret.map(i => IDS[i]).join(", ")}]` + (ret.includes(REL) ? "" : " – a releváns d3 kiesett!")}),
    Object.assign({}, base, {ph: 2, line: 6, msg: `rerank (idf): ${ret.map(i => IDS[i] + "≈" + f3(RR[i])).join(", ")} → top-${M} = [${top.map(i => IDS[i]).join(", ")}]`}),
    Object.assign({}, base, {ph: 3, line: 7, msg: `generálás: válasz = ${IDS[top[0]]} szövege: „${DOCS[top[0]]}”` + (top[0] === REL ? "" : " – a reranker a kiesett d3-at nem tudja visszahozni (25.3.10).")}),
  ];
}
function rerun(){ const K = +document.getElementById("tk").value, M = +document.getElementById("tm").value;
  document.getElementById("tkv").textContent = K; document.getElementById("tmv").textContent = M;
  setSteps(ragSteps(document.getElementById("qq").value, K, M)); }
["tk", "tm"].forEach(id => document.getElementById(id).oninput = rerun);
document.getElementById("qq").oninput = rerun;
function card(x, y, w, h, lines, o){ o = o || {};
  el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: o.fill || css("--cell"), stroke: css("--line"), "stroke-width": o.lw || 1, "stroke-dasharray": o.dash || ""});
  lines.forEach((l, q) => el("text", {x: x + 6, y: y + 15 + q * 15, "font-size": 12, "font-weight": q === 0 && o.bold ? "bold" : "normal"}, l));
  if (o.strike) { el("line", {x1: x + 3, y1: y + 3, x2: x + w - 3, y2: y + h - 3, stroke: css("--fg"), "stroke-width": 1.5});
    el("line", {x1: x + 3, y1: y + h - 3, x2: x + w - 3, y2: y + 3, stroke: css("--fg"), "stroke-width": 1.5}); } }
function render(s){
  svg.setAttribute("viewBox", "0 0 860 312");
  svg.innerHTML = "";
  const q = new Set(s.q), X = [5, 260, 440, 640];
  ["1. tokenizálás + átfedés", "2. retrieval top-" + s.K, "3. idf-rerank top-" + s.M, "4. válasz"].forEach((h, c) =>
    el("text", {x: X[c], y: 16, "font-size": 13, "font-weight": c === s.ph ? "bold" : "normal", fill: c === s.ph ? css("--hl") : css("--fg")}, h));
  el("text", {x: 5, y: 34, "font-size": 12, fill: css("--muted")}, `q = {${s.q.join(", ")}}`);
  DOCS.forEach((d, i) => { const m = [...DT[i]].filter(w => q.has(w));
    card(X[0], 42 + i * 50, 240, 44, [`${IDS[i]}: ${d.length > 34 ? d.slice(0, 33) + "…" : d}`, s.ph >= 1 || s.ph === 0 ? `egyezik: ${m.join(", ") || "—"}  → ${s.scores[i]}` : ""],
      {lw: i === REL ? 3 : 1, strike: s.ph >= 1 && !s.ret.includes(i)}); });
  if (s.ph >= 1) s.ret.forEach((i, r) => card(X[1], 42 + r * 50, 165, 44, [`${r + 1}. ${IDS[i]} (átfedés ${s.scores[i]})`], {lw: i === REL ? 3 : 1}));
  if (s.ph >= 2) s.ret.slice().sort((a, b) => s.RR[b] - s.RR[a] || s.ret.indexOf(a) - s.ret.indexOf(b)).forEach((i, r) => {
    const inTop = s.top.includes(i);
    card(X[2], 42 + r * 50, 185, 44, [`${r + 1}. ${IDS[i]} ≈ ${f3(s.RR[i])}`, [...DT[i]].filter(w => q.has(w)).map(w => w + " " + f3(IDF[w])).join(" + ")],
      {lw: i === REL ? 3 : 1, dash: inTop ? "" : "5 3", fill: inTop ? css("--cell") : css("--cellhl")}); });
  if (s.ph >= 3) { const d = DOCS[s.top[0]], w = d.split(" "), l1 = w.slice(0, Math.ceil(w.length / 2)).join(" "), l2 = w.slice(Math.ceil(w.length / 2)).join(" ");
    card(X[3], 42, 210, 62, [`„${l1}`, `${l2}” (${IDS[s.top[0]]})`], {lw: s.top[0] === REL ? 3 : 1, bold: true});
    el("text", {x: X[3], y: 125, "font-size": 12, fill: css("--muted")}, "extraktív: a rerank top-1 szövege"); }
  [[248, 258], [428, 438], [628, 638]].forEach(([a, b], c) => { if (s.ph > c) el("line", {x1: a, y1: 64, x2: b, y2: 64, stroke: css("--fg"), "stroke-width": 2}); });
  el("text", {x: 5, y: 306, "font-size": 12, fill: css("--muted")}, "vastag keret = releváns d3 · áthúzott = kiesik a retrievalben · szaggatott/szürke = nem fér a top-M-be");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
