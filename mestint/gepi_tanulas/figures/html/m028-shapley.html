<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapley-érték sorrendenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>v(∅) <input class="vs" data-s="" type="number" step="0.5" value="10" style="width:4.2em"></label><label>v(A) <input class="vs" data-s="A" type="number" step="0.5" value="14" style="width:4.2em"></label><label>v(B) <input class="vs" data-s="B" type="number" step="0.5" value="12" style="width:4.2em"></label><label>v(C) <input class="vs" data-s="C" type="number" step="0.5" value="10" style="width:4.2em"></label><label>v(AB) <input class="vs" data-s="AB" type="number" step="0.5" value="18" style="width:4.2em"></label><label>v(AC) <input class="vs" data-s="AC" type="number" step="0.5" value="15" style="width:4.2em"></label><label>v(BC) <input class="vs" data-s="BC" type="number" step="0.5" value="13" style="width:4.2em"></label><label>v(ABC) <input class="vs" data-s="ABC" type="number" step="0.5" value="20" style="width:4.2em"></label> <button id="vreset">Alapérték</button><script>
function readV(){ const V = {}; document.querySelectorAll(".vs").forEach(i => { V[i.dataset.s] = +i.value; }); return V; }
document.querySelectorAll(".vs").forEach(i => i.addEventListener("change", () => setSteps(buildSteps(readV()))));
document.getElementById("vreset").addEventListener("click", () => { const D = {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}; document.querySelectorAll(".vs").forEach(i => { i.value = D[i.dataset.s]; }); setSteps(buildSteps(D)); });
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalt a nyolc részhalmazból álló háló az aktuális sorrend útjával; jobbra a hat sorrend marginális növekményei sávokként, végül az átlagolt Shapley-értékek"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított játékpélda (8.4.4). A Shapley-érték a 3! = 6 sorrend menti marginális hozzájárulások átlaga, ez megegyezik a súlyozott részhalmaz-képlettel. A v(S)-táblázat szerkeszthető; a φ-k és az összeg élőben újraszámolódnak (hatékonyság: φ_A + φ_B + φ_C = v(ABC) − v(∅)).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiindulás: v(∅) = 10, v(ABC) = 20. Lépésenként egy sorrend: a jellemzőket ebben a sorrendben adjuk hozzá, és feljegyezzük a növekményeket.", "line": 0, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": -1}, {"msg": "1. sorrend A→B→C: ΔA = 4, ΔB = 4, ΔC = 2 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 0, "m": {"A": 4, "B": 4, "C": 2}, "o": ["A", "B", "C"]}, {"msg": "2. sorrend A→C→B: ΔA = 4, ΔC = 1, ΔB = 5 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 1, "m": {"A": 4, "C": 1, "B": 5}, "o": ["A", "C", "B"]}, {"msg": "3. sorrend B→A→C: ΔB = 2, ΔA = 6, ΔC = 2 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 2, "m": {"B": 2, "A": 6, "C": 2}, "o": ["B", "A", "C"]}, {"msg": "4. sorrend B→C→A: ΔB = 2, ΔC = 1, ΔA = 7 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 3, "m": {"B": 2, "C": 1, "A": 7}, "o": ["B", "C", "A"]}, {"msg": "5. sorrend C→A→B: ΔC = 0, ΔA = 5, ΔB = 5 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 4, "m": {"C": 0, "A": 5, "B": 5}, "o": ["C", "A", "B"]}, {"msg": "6. sorrend C→B→A: ΔC = 0, ΔB = 3, ΔA = 7 (összeg 10)", "line": 3, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 5, "m": {"C": 0, "B": 3, "A": 7}, "o": ["C", "B", "A"]}, {"msg": "Átlagolás: φ_A = 5,5, φ_B = 3,5, φ_C = 1; összeg = 10 = v(ABC) − v(∅) = 10", "line": 5, "V": {"": 10, "A": 14, "B": 12, "C": 10, "AB": 18, "AC": 15, "BC": 13, "ABC": 20}, "r": 6, "phi": {"A": 5.5, "B": 3.5, "C": 1.0}}];
const CODE = ["for sorrend in permutációk(A, B, C):        # 3! = 6 sorrend", "    S = ∅", "    for j in sorrend:", "        Δ_j = v(S ∪ {j}) − v(S); S = S ∪ {j}  # marginális növekmény", "φ_j = átlag(Δ_j) a 6 sorrend felett         # = súlyozott részhalmaz-képlet", "ellenőrzés: φ_A + φ_B + φ_C = v(ABC) − v(∅)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fmt(x, d){ let t = x.toFixed(d); if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, ""); return t.replace(".", ",").replace("-", "−"); }
const FE = ["A", "B", "C"], ORDS = [["A","B","C"],["A","C","B"],["B","A","C"],["B","C","A"],["C","A","B"],["C","B","A"]];
const POSL = {"": [150, 280], A: [50, 200], B: [150, 200], C: [250, 200], AB: [50, 120], AC: [150, 120], BC: [250, 120], ABC: [150, 40]};
const kk = S => S.split("").sort().join("");
function buildSteps(V){
  const st = [], acc = {A: [], B: [], C: []};
  st.push({msg: "Kiindulás: v(∅) = " + fmt(V[""], 2) + ", v(ABC) = " + fmt(V["ABC"], 2) + ". Lépésenként egy sorrend: a jellemzőket ebben a sorrendben adjuk hozzá, és feljegyezzük a növekményeket.", line: 0, V, r: -1});
  ORDS.forEach((o, r) => { let cur = ""; const m = {}; o.forEach(f => { m[f] = V[kk(cur + f)] - V[kk(cur)]; cur += f; acc[f].push(m[f]); });
    st.push({msg: `${r + 1}. sorrend ${o.join("→")}: ` + o.map(f => `Δ${f} = ${fmt(m[f], 2)}`).join(", ") + ` (összeg ${fmt(m.A + m.B + m.C, 2)})`, line: 3, V, r, m, o}); });
  const phi = {}; FE.forEach(f => phi[f] = acc[f].reduce((a, b) => a + b, 0) / 6);
  const sum = phi.A + phi.B + phi.C, ok = Math.abs(sum - (V["ABC"] - V[""])) < 1e-9;
  st.push({msg: `Átlagolás: φ_A = ${fmt(phi.A, 3)}, φ_B = ${fmt(phi.B, 3)}, φ_C = ${fmt(phi.C, 3)}; összeg = ${fmt(sum, 3)} ${ok ? "=" : "≠"} v(ABC) − v(∅) = ${fmt(V["ABC"] - V[""], 3)}`,
    line: 5, V, r: 6, phi});
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = "";
  const V = s.V, path = s.o ? s.o.reduce((a, f) => { a.push(kk(a[a.length - 1] + f)); return a; }, [""]) : [];
  el("text", {x: 10, y: 18, "font-size": 13}, "részhalmaz-háló v(S)");
  for (const S in POSL) FE.forEach(f => { if (S.indexOf(f) < 0){ const T = kk(S + f), p = POSL[S], q = POSL[T];
    const on = path.indexOf(S) >= 0 && path.indexOf(T) === path.indexOf(S) + 1;
    el("line", {x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 4 : 1});
    const vt = p[0] === q[0], fr = vt ? 0.5 : 0.32;
    el("text", {x: p[0] + fr * (q[0] - p[0]) + 7, y: p[1] + fr * (q[1] - p[1]) + 4, "text-anchor": "start", "font-size": 11, "font-weight": on ? "bold" : "normal", fill: on ? css("--hl2") : css("--muted")}, "+" + fmt(V[T] - V[S], 2)); } });
  for (const S in POSL){ const p = POSL[S], on = path.indexOf(S) >= 0;
    el("rect", {x: p[0] - 26, y: p[1] - 17, width: 52, height: 34, rx: 6, fill: on ? css("--cellhl") : css("--bg"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: p[0], y: p[1] - 2, "text-anchor": "middle", "font-size": 12}, S || "∅");
    el("text", {x: p[0], y: p[1] + 13, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, fmt(V[S], 2)); }
  // sávok
  const tot = Math.max(1e-9, V["ABC"] - V[""]), sc = 300 / Math.max(tot, 1), x0 = 380;
  el("text", {x: 330, y: 18, "font-size": 13}, "marginális növekmények sorrendenként");
  const fillOf = f => f === "A" ? css("--fg") : (f === "B" ? "url(#hb)" : "url(#hc)");
  const defs = el("defs", {});
  [["hb", "rotate(45)", "line"], ["hc", "", "circle"]].forEach(([id, tr, sh]) => { const pt = el("pattern", {id, width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: tr});
    defs.appendChild(pt); pt.appendChild(sh === "line" ? el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--fg"), "stroke-width": 1.2}) : el("circle", {cx: 3, cy: 3, r: 1.1, fill: css("--fg")})); });
  ORDS.forEach((o, r) => { const y = 32 + r * 34; if (r > s.r && s.r < 6) { el("text", {x: x0 - 6, y: y + 17, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, o.join("→")); return; }
    el("text", {x: x0 - 6, y: y + 17, "text-anchor": "end", "font-size": 12, "font-weight": r === s.r ? "bold" : "normal"}, o.join("→"));
    let cur = "", x = x0; o.forEach(f => { const d = V[kk(cur + f)] - V[kk(cur)]; cur += f; const wd = Math.max(0, d) * sc;
      el("rect", {x, y: y + 4, width: wd, height: 22, fill: css("--bg"), stroke: css("--line")});
      el("rect", {x, y: y + 4, width: wd, height: 22, fill: fillOf(f), stroke: css("--line")});
      if (wd > 18){ if (f !== "A") el("rect", {x: x + wd / 2 - 17, y: y + 8, width: 34, height: 15, fill: css("--bg")});
        el("text", {x: x + wd / 2, y: y + 20, "text-anchor": "middle", "font-size": 11, fill: f === "A" ? css("--bg") : css("--fg"), "font-weight": "bold"}, f + " " + fmt(d, 2)); }
      x += wd; }); });
  if (s.phi){ const y = 32 + 6 * 34 + 8; let x = x0;
    el("text", {x: x0 - 6, y: y + 17, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, "átlag φ");
    FE.forEach(f => { const wd = Math.max(0, s.phi[f]) * sc; el("rect", {x, y: y + 4, width: wd, height: 22, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2});
      el("rect", {x, y: y + 4, width: wd, height: 22, fill: fillOf(f), stroke: css("--hl2"), "stroke-width": 2});
      el("text", {x: x + wd / 2, y: y + 44, "text-anchor": "middle", "font-size": 12}, "φ" + f + " = " + fmt(s.phi[f], 3)); x += wd; }); }
  el("text", {x: 330, y: 322, "font-size": 11, fill: css("--muted")}, "A tömör, B sraffozott, C pontozott; a sor hossza v(ABC) − v(∅)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
