<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairness-trade-off: közös vagy csoportonkénti küszöb</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Küszöbök">
<label for="t1">t₁ (A = 1) =</label><input id="t1" type="range" min="-1.5" max="2.5" step="0.01" value="0.5"><b id="t1v"></b>
<label for="t0">t₀ (A = 0) =</label><input id="t0" type="range" min="-1.5" max="2.5" step="0.01" value="0.5"><b id="t0v"></b>
<label><input id="com" type="checkbox" checked> közös küszöb</label>
</div>
<div class="ctl" role="group" aria-label="Adatmodell">
<label for="mu">μ =</label><input id="mu" type="range" min="0.2" max="3" step="0.05" value="1"><b id="muv"></b>
<label for="p1">p₁ =</label><input id="p1" type="range" min="0.05" max="0.95" step="0.01" value="0.8"><b id="p1v"></b>
<label for="p0">p₀ =</label><input id="p0" type="range" min="0.05" max="0.95" step="0.01" value="0.9"><b id="p0v"></b>
<button id="dp">DP kiegyenlítése</button><button id="back">vissza</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 310" role="img" aria-label="Bal oldalon a két csoport alapráta-súlyozott osztályfeltételes sűrűségei a küszöbvonallal; jobb oldalon a csoportonkénti TPR, FPR, kiválasztási arány és PPV oszlopai, alattuk DPD, EqOD és PPV-különbség"></svg>

<p class="small">Számított, nem mérés: a 29.3 labor szintetikus modellje, x | Y ~ N(μY, 1), Ŷ = 1, ha x ≥ t_A; P(Ŷ = 1 | A) = TPR·p_A + FPR·(1 − p_A), PPV = TPR·p_A / P(Ŷ = 1 | A); EqOD = max(|ΔTPR|, |ΔFPR|). A „DP kiegyenlítése” gomb t₁-et csökkenti, amíg a kiválasztási arányok egyeznek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const g = id => document.getElementById(id);
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
const Phi = z => 0.5 * (1 + erf(z / Math.SQRT2)), phi = z => Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
function M(t, mu, p){ const tpr = 1 - Phi(t - mu), fpr = 1 - Phi(t), sel = tpr * p + fpr * (1 - p); return {tpr, fpr, sel, ppv: sel > 0 ? tpr * p / sel : NaN}; }
let note = "";
function draw(){
  if (g("com").checked) g("t0").value = g("t1").value;
  const t1 = +g("t1").value, t0 = +g("t0").value, mu = +g("mu").value, p1 = +g("p1").value, p0 = +g("p0").value;
  [["t1v", t1], ["t0v", t0], ["muv", mu], ["p1v", p1], ["p0v", p0]].forEach(([id, v]) => g(id).textContent = fmt(v, 2));
  const a = M(t1, mu, p1), b = M(t0, mu, p0);
  const dpd = Math.abs(a.sel - b.sel), eq = Math.max(Math.abs(a.tpr - b.tpr), Math.abs(a.fpr - b.fpr));
  svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1"/></pattern>`;
  svg.appendChild(defs);
  // bal: két sor sűrűség
  const L = 20, W = 290, X = x => L + W * (x + 3) / 7;
  [[p1, t1, "A = 1", a, 20], [p0, t0, "A = 0", b, 160]].forEach(([p, t, lab, m, top]) => {
    const H = 110, Y = v => top + H - H * v / 0.42;
    let d1 = "", d0 = "", s1 = `M${X(t)} ${Y(0)}`, s0 = `M${X(t)} ${Y(0)}`;
    for (let i = 0; i <= 200; i++){ const x = -3 + 7 * i / 200, f1 = p * phi(x - mu), f0 = (1 - p) * phi(x);
      d1 += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(f1).toFixed(1); d0 += (i ? "L" : "M") + X(x).toFixed(1) + " " + Y(f0).toFixed(1);
      if (x >= t){ s1 += "L" + X(x).toFixed(1) + " " + Y(f1).toFixed(1); s0 += "L" + X(x).toFixed(1) + " " + Y(f0).toFixed(1); } }
    s1 += `L${X(4)} ${Y(0)}Z`; s0 += `L${X(4)} ${Y(0)}Z`;
    el("path", {d: s1, fill: css("--fill2"), stroke: "none"}); el("path", {d: s0, fill: "url(#hh)", stroke: "none"});
    el("path", {d: d1, fill: "none", stroke: css("--fg"), "stroke-width": 1.8}); el("path", {d: d0, fill: "none", stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": "6 4"});
    el("line", {x1: L, y1: Y(0), x2: L + W, y2: Y(0), stroke: css("--fg")});
    if (t >= -3 && t <= 4) el("line", {x1: X(t), y1: top + 10, x2: X(t), y2: Y(0), stroke: css("--hl"), "stroke-width": 2});
    el("text", {x: L, y: top, "font-size": 12, "font-weight": "bold"}, lab);
    el("text", {x: L + W, y: top, "text-anchor": "end", "font-size": 11}, `t = ${fmt(t, 2)}: TPR ${fmt(m.tpr, 3)}, FPR ${fmt(m.fpr, 3)}`);
    [-2, 0, 2, 4].forEach(v => el("text", {x: X(v), y: Y(0) + 13, "text-anchor": "middle", "font-size": 10}, fmt(v, 0)));
  });
  el("text", {x: L, y: 300, "font-size": 11, fill: css("--muted")}, "folytonos: p_A·φ(x − μ) (Y = 1), szaggatott: (1 − p_A)·φ(x) (Y = 0)");
  // jobb: oszlopok
  const L2 = 360, W2 = 260, B = 250, Yb = v => B - 200 * v;
  el("line", {x1: L2, y1: B, x2: L2 + W2, y2: B, stroke: css("--fg")});
  [0, 0.5, 1].forEach(v => { el("text", {x: L2 - 4, y: Yb(v) + 4, "text-anchor": "end", "font-size": 10}, fmt(v, 1)); el("line", {x1: L2, y1: Yb(v), x2: L2 + W2, y2: Yb(v), stroke: css("--grid")}); });
  ["tpr", "fpr", "sel", "ppv"].forEach((k, i) => { const cx = L2 + W2 * (i + 0.5) / 4;
    [[a, "url(#hh)", -24], [b, css("--fill2"), 2]].forEach(([m, f, dx]) => { const v = isFinite(m[k]) ? m[k] : 0;
      el("rect", {x: cx + dx, y: Yb(v), width: 22, height: B - Yb(v), fill: f, stroke: css("--fg")});
      el("text", {x: cx + dx + 11, y: Yb(v) - 4, "text-anchor": "middle", "font-size": 9.5}, fmt(v, 2)); });
    el("text", {x: cx, y: B + 14, "text-anchor": "middle", "font-size": 11}, ["TPR", "FPR", "kiválasztás", "PPV"][i]); });
  el("rect", {x: L2 + 10, y: 18, width: 12, height: 10, fill: "url(#hh)", stroke: css("--fg")}); el("text", {x: L2 + 26, y: 27, "font-size": 11}, "A = 1");
  el("rect", {x: L2 + 80, y: 18, width: 12, height: 10, fill: css("--fill2"), stroke: css("--fg")}); el("text", {x: L2 + 96, y: 27, "font-size": 11}, "A = 0");
  el("text", {x: L2, y: 285, "font-size": 12}, `DPD ${fmt(dpd, 3)}, EqOD ${fmt(eq, 3)}, PPV-különbség ${fmt(Math.abs(a.ppv - b.ppv), 3)}`);
    status.textContent = `t1 = ${fmt(t1, 2)}, t0 = ${fmt(t0, 2)}: TPR ${fmt(a.tpr, 3)}/${fmt(b.tpr, 3)}, FPR ${fmt(a.fpr, 3)}/${fmt(b.fpr, 3)}, ` +
    `kiválasztás ${fmt(a.sel, 3)}/${fmt(b.sel, 3)}, PPV ${fmt(a.ppv, 3)}/${fmt(b.ppv, 3)}, DPD ${fmt(dpd, 3)}, EqOD ${fmt(eq, 3)}` + (note ? " – " + note : "");
}
["t1", "t0", "mu", "p1", "p0"].forEach(id => g(id).addEventListener("input", () => { if (id === "t0") g("com").checked = false; note = ""; draw(); }));
g("com").addEventListener("change", () => { note = ""; draw(); });
g("dp").onclick = () => { g("com").checked = false; const t0 = +g("t0").value, mu = +g("mu").value, p1 = +g("p1").value, p0 = +g("p0").value;
  const target = M(t0, mu, p0).sel; let lo = -6, hi = 6; for (let i = 0; i < 100; i++){ const mid = (lo + hi) / 2; if (M(mid, mu, p1).sel > target) lo = mid; else hi = mid; }
  const t = (lo + hi) / 2; g("t1").min = Math.min(-1.5, t); g("t1").value = t; note = "DP kiegyenlítve: a kiválasztási arányok egyeznek, de a TPR/FPR már eltér (EqOD > 0)."; draw(); };
g("back").onclick = () => { g("t1").value = 0.5; g("t0").value = 0.5; g("com").checked = true; g("mu").value = 1; g("p1").value = 0.8; g("p0").value = 0.9; note = ""; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
