<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEFT beavatkozási pontok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Módszer"><button class="m" data-m="prompt" aria-pressed="false">Prompt</button><button class="m" data-m="adapter" aria-pressed="false">Adapter</button><button class="m" data-m="lora" aria-pressed="false">LoRA</button><button class="m" data-m="all" aria-pressed="true">mind</button></div><div class="ctl"><label>l = <span id="lv"></span> <input id="l" type="range" min="1" max="100" value="20"></label><label>r_adapter = <span id="rav"></span> <input id="ra" type="range" min="8" max="128" step="8" value="48"></label><label>r_LoRA = <span id="rlv"></span> <input id="rl" type="range" min="1" max="64" value="8"></label></div><div class="ctl"><label>d = <span id="dv"></span> <input id="d" type="range" min="256" max="4096" step="256" value="768"></label><label>rétegek = <span id="Lv"></span> <input id="L" type="range" min="4" max="48" step="4" value="12"></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 50 640 450" role="img" aria-label="Transformer-blokk befagyasztott elemekkel; a prompt tuning a bemenet elé tesz tanítható vektorokat, az adapter a blokk kimenetére palacknyakat, a LoRA a W_q és W_v mellé B·A mellékágat; alul a paraméterszámok log skálán."></svg>

<p class="small">Paraméterszámok a fejezet képleteivel: prompt l·d; adapter 2rd + r (blokkonként egy); LoRA 2·d·r mátrixonként, a W_q és W_v mátrixon. Számított, nem mért.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const INIT = {"prompt": 15360, "adapter_one": 73776, "adapter": 885312, "lora_one": 12288, "lora": 294912};
let mode = "all";
function sp(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function cnt(d, L, l, ra, rl){ return {prompt: l * d, adapter_one: 2 * ra * d + ra, adapter: L * (2 * ra * d + ra), lora_one: 2 * d * rl, lora: L * 2 * 2 * d * rl}; }
function bx(x, y, w, h, t, kind, on){
  el("rect", {x: x, y: y, width: w, height: h, rx: 5, fill: kind === "f" ? "url(#hatch)" : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": kind === "t" ? (on ? 3.5 : 2.5) : 1});
  if (t) el("text", {x: x + w / 2, y: y + h / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": kind === "t" ? "bold" : "normal"}, t);
}
function draw(){
  const g = id => +document.getElementById(id).value;
  const d = g("d"), L = g("L"), l = g("l"), ra = g("ra"), rl = g("rl");
  ["d", "L", "l", "ra", "rl"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  const c = cnt(d, L, l, ra, rl), on = m => mode === "all" || mode === m;
  svg.innerHTML = '<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="' + css("--fill") + '"/><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.2"/></pattern></defs>';
  const X = 230, W = 200, ln = (x1, y1, x2, y2) => el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.4});
  bx(X, 360, W, 30, "tokenek", "n", false);
  bx(X, 310, W, 34, "beágyazás", "f", false);
  bx(X, 220, W, 70, "", "f", false); el("text", {x: X + W / 2, y: 282, "text-anchor": "middle", "font-size": 13}, "MHA");
  ["W_q", "W_k", "W_v"].forEach((t, i) => bx(X + 10 + i * 66, 236, 52, 28, t, "n", false));
  bx(X, 175, W, 28, "Add & Norm", "f", false);
  bx(X, 115, W, 44, "FFN", "f", false);
  bx(X, 70, W, 28, "Add & Norm", "f", false);
  [[360, 344], [310, 290], [220, 203], [175, 159], [115, 98]].forEach(a => ln(X + W / 2, a[0], X + W / 2, a[1]));
  if (on("prompt")) { for (let i = 0; i < 4; i++) bx(20 + i * 46, 360, 40, 30, i === 2 ? "…" : "P" + (i === 3 ? l : i + 1), "t", mode === "prompt");
    ln(110, 360, X + 20, 344);
    el("text", {x: 20, y: 408, "font-size": 12}, "prompt: l·d = " + l + "·" + d + " = " + sp(c.prompt)); }
  if (on("adapter")) { bx(500, 130, 130, 60, "", "t", mode === "adapter");
    el("text", {x: 565, y: 155, "text-anchor": "middle", "font-size": 12}, d + "→" + ra + "→" + d);
    el("text", {x: 565, y: 175, "text-anchor": "middle", "font-size": 11}, "GELU (+ skip)");
    ln(X + W, 228, 520, 190); ln(500, 160, X + W, 189);
    el("text", {x: 520, y: 300, "font-size": 12}, "adapter: 2rd + r =");
    el("text", {x: 520, y: 316, "font-size": 12}, sp(c.adapter_one) + " × " + L + " =");
    el("text", {x: 520, y: 332, "font-size": 12, "font-weight": "bold"}, sp(c.adapter)); }
  if (on("lora")) { bx(150, 236, 64, 28, "B·A", "t", mode === "lora"); ln(214, 250, X + 10, 250);
    bx(446, 236, 64, 28, "B·A", "t", mode === "lora"); ln(X + 142 + 52, 250, 446, 250);
    el("text", {x: 20, y: 300, "font-size": 12}, "LoRA: 2·d·r = " + sp(c.lora_one));
    el("text", {x: 20, y: 316, "font-size": 12}, "× 2 (q, v) × " + L + " =");
    el("text", {x: 20, y: 332, "font-size": 12, "font-weight": "bold"}, sp(c.lora)); }
  // összesítő, log skála
  const lg = v => (Math.log10(Math.max(v, 1)) - 3) / 5 * 380;
  el("text", {x: 130, y: 428, "font-size": 10, fill: css("--muted")}, "tanítható paraméter, log skála 10³ … 10⁸ (" + L + " réteg)");
  [["prompt", c.prompt], ["LoRA (q, v)", c.lora], ["adapter", c.adapter]].forEach((a, i) => { const y = 434 + i * 20;
    el("text", {x: 20, y: y + 13, "font-size": 12}, a[0]);
    el("rect", {x: 130, y: y + 2, width: Math.max(2, lg(a[1])), height: 14, fill: css("--fill2"), stroke: css("--line")});
    el("text", {x: 136 + Math.max(2, lg(a[1])), y: y + 14, "font-size": 12}, sp(a[1])); });
  const notes = {prompt: "Prompt tuning: l tokennel rövidebb a hasznos kontextus.", adapter: "Adapter: minden blokkban extra számítás → extra késleltetés.", lora: "LoRA: W₀ + (α/r)·B·A beolvasztható, nincs extra késleltetés.", all: "Mind: prompt " + sp(c.prompt) + ", LoRA " + sp(c.lora) + ", adapter " + sp(c.adapter) + "."};
  status.textContent = notes[mode] + " (d = " + d + ", " + L + " réteg; tanítható: prompt " + sp(c.prompt) + ", LoRA " + sp(c.lora) + ", adapter " + sp(c.adapter) + ")";
}
document.querySelectorAll("button.m").forEach(b => b.addEventListener("click", () => { mode = b.dataset.m;
  document.querySelectorAll("button.m").forEach(q => q.setAttribute("aria-pressed", q === b)); draw(); }));
["d", "L", "l", "ra", "rl"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
const c0 = cnt(768, 12, 20, 48, 8), c1 = cnt(1024, 32, 20, 64, 8);
document.body.dataset.selfcheck = (c0.prompt === INIT.prompt && c0.lora === INIT.lora && c0.adapter === INIT.adapter && c1.adapter === 4196352) ? "OK" : "ELTÉRÉS";

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
