<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Captioning kereszt-figyelem</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span id="info" class="small">Kattints egy patch-re a súlyért.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kauzális maszk és kereszt-figyelem a captioning-dekóderben: a szöveg minden pozíciója 9 képpatch fölötti súlyeloszlást ad; a kutya szónál a súly a kutyát tartalmazó patch-eken koncentrálódik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, kézzel választott súlyok (soronkénti softmax), nem modellkimenet. A kód a 24.2.3 MiniCaptioner forward-metódusának rövidített változata.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "line": 6, "msg": "t = 1: a(z) „[BOS]” pozíció a maszk szerint az 1…1. tokent látja (1 engedett cella); a kereszt-figyelem 9 súlya (összeg 1) – legnagyobb a(z) 7. és 8. patch-en; cél: kutya"}, {"t": 1, "line": 6, "msg": "t = 2: a(z) „kutya” pozíció a maszk szerint az 1…2. tokent látja (2 engedett cella); a kereszt-figyelem 9 súlya (összeg 1) – legnagyobb a(z) 7. és 8. patch-en; cél: fut"}, {"t": 2, "line": 6, "msg": "t = 3: a(z) „fut” pozíció a maszk szerint az 1…3. tokent látja (3 engedett cella); a kereszt-figyelem 9 súlya (összeg 1) – legnagyobb a(z) 7. és 8. patch-en; cél: [EOS]"}, {"t": 3, "line": 6, "msg": "t = 4: a(z) „[EOS]” pozíció a maszk szerint az 1…4. tokent látja (4 engedett cella); a kereszt-figyelem 9 súlya (összeg 1) – legnagyobb a(z) 1. és 2. patch-en; cél: — (az utolsó logit nem kap célt)"}];
const CODE = ["def forward(self, visual_feats, text_ids, visual_pad_mask=None):", "    V = self.vis_proj(visual_feats)   # (N, P, d_model)", "    X = self.txt_embed(text_ids)      # (N, L, d_model)", "    L = X.size(1)", "    causal = torch.triu(torch.ones(L, L, dtype=torch.bool), diagonal=1)  # True = tiltott", "    X, _ = self.self_attn(X, X, X, attn_mask=causal)", "    H, _ = self.cross_attn(query=X, key=V, value=V, key_padding_mask=visual_pad_mask)", "    logits = self.lm_head(H)          # (N, L, vocab_size)", "    return logits"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const A = [[0.1014, 0.1014, 0.1014, 0.112, 0.112, 0.112, 0.1238, 0.1238, 0.112], [0.0185, 0.0185, 0.0185, 0.0555, 0.075, 0.0305, 0.4104, 0.336, 0.0372], [0.0271, 0.0271, 0.0271, 0.0545, 0.0736, 0.0994, 0.2985, 0.2444, 0.1483], [0.1382, 0.1382, 0.1382, 0.1024, 0.1024, 0.1024, 0.0927, 0.0927, 0.0927]]; const TOK = ["[BOS]", "kutya", "fut", "[EOS]"]; const TGT = ["kutya", "fut", "[EOS]", "—"];

function h2(x){ return x.toFixed(2).replace(".", ","); }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330");
  svg.innerHTML = "";
  const t = s.t;
  // maszk 4x4
  const MX = 20, MY = 50, c = 34;
  el("text", {x: MX, y: 30, "font-size": 12, "font-weight": "bold"}, "kauzális maszk (L × L)");
  for (let i = 0; i < 4; i++) { el("text", {x: MX + 4 * c + 6, y: MY + i * c + 22, "font-size": 11, "font-weight": i === t ? "bold" : "normal"}, TOK[i]);
    for (let j = 0; j < 4; j++) { const ban = j > i, on = i === t;
      el("rect", {x: MX + j * c, y: MY + i * c, width: c, height: c, fill: ban ? css("--bg") : (on ? css("--hl2") : css("--cellhl")), stroke: css("--line"), "stroke-width": 0.7});
      if (ban) el("line", {x1: MX + j * c, y1: MY + (i + 1) * c, x2: MX + (j + 1) * c, y2: MY + i * c, stroke: css("--muted")}); } }
  el("text", {x: MX, y: MY + 4 * c + 18, "font-size": 11, fill: css("--muted")}, "áthúzott: tiltott (−∞)");
  el("text", {x: MX, y: MY + 4 * c + 40, "font-size": 12}, "cél (eltolva): " + TOK[t] + " → " + TGT[t]);
  el("text", {x: MX, y: MY + 4 * c + 60, "font-size": 12}, "shape: A (N, L, P) = (1, 4, 9)");
  // kép 3x3 patch, a súly átlátszósággal
  const IX = 220, IY = 40, pc = 54;
  el("text", {x: IX, y: 30, "font-size": 12, "font-weight": "bold"}, "kép: 9 patch (kutya: 7–8.)");
  for (let k = 0; k < 9; k++) { const r = Math.floor(k / 3), q = k % 3, x = IX + q * pc, y = IY + r * pc;
    el("rect", {x: x, y: y, width: pc, height: pc, fill: r === 0 ? "#e8e8e8" : r === 1 ? "#b8c4cc" : "#d8cfb8", stroke: "#000", "stroke-width": 0.6});
    const ov = el("rect", {x: x, y: y, width: pc, height: pc, fill: css("--hl2"), opacity: Math.min(0.85, A[t][k] * 1.6), style: "cursor:pointer"});
    ov.addEventListener("click", () => { document.getElementById("info").textContent = "patch " + (k + 1) + ": A[" + (t + 1) + ", " + (k + 1) + "] = " + h2(A[t][k]); });
    el("text", {x: x + 4, y: y + 13, "font-size": 11, fill: "#000", "pointer-events": "none"}, String(k + 1)); }
  el("ellipse", {cx: IX + 54, cy: IY + 2 * pc + 30, rx: 30, ry: 11, fill: "#333", "pointer-events": "none"});
  el("circle", {cx: IX + 88, cy: IY + 2 * pc + 20, r: 9, fill: "#333", "pointer-events": "none"});
  // hőtérkép 4x9
  const HX = 432, HY = 50, hc = 25;
  el("text", {x: HX, y: 30, "font-size": 12, "font-weight": "bold"}, "súlyok A[0] (L × P), szemléltető");
  for (let i = 0; i < 4; i++) { el("text", {x: HX - 4, y: HY + i * hc + 18, "text-anchor": "end", "font-size": 10, "font-weight": i === t ? "bold" : "normal"}, TOK[i]);
    for (let k = 0; k < 9; k++) { const g = Math.round(255 - 180 * Math.min(1, A[i][k] / 0.5));
      el("rect", {x: HX + k * hc, y: HY + i * hc, width: hc, height: hc, fill: "rgb(" + g + "," + g + "," + g + ")", stroke: i === t ? css("--hl2") : "#000", "stroke-width": i === t ? 2 : 0.5});
      el("text", {x: HX + k * hc + hc / 2, y: HY + i * hc + 17, "text-anchor": "middle", "font-size": 8, fill: g < 140 ? "#fff" : "#000"}, h2(A[i][k])); } }
  for (let k = 0; k < 9; k++) el("text", {x: HX + k * hc + hc / 2, y: HY + 4 * hc + 14, "text-anchor": "middle", "font-size": 10}, String(k + 1));
  const sum = A[t].reduce((a, b) => a + b, 0);
  el("text", {x: HX, y: HY + 4 * hc + 34, "font-size": 11}, "aktuális sor összege: " + h2(sum));
  // sáv: aktuális sor
  for (let k = 0; k < 9; k++) { const h = A[t][k] * 160;
    el("rect", {x: HX + k * hc + 4, y: 300 - h, width: hc - 8, height: h, fill: css("--hl2"), stroke: css("--line"), "stroke-width": 0.5}); }
  el("line", {x1: HX, y1: 300, x2: HX + 9 * hc, y2: 300, stroke: css("--line")});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
