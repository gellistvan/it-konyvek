<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamikus batching idővonalon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
  <label for="mb">max_batch = <b id="mbv">4</b></label><input id="mb" type="range" min="1" max="8" value="4">
  <label for="mw">max_wait = <b id="mwv">5</b> ms</label><input id="mw" type="range" min="0" max="10" value="5">
  <label for="tp">kötegidő = <b id="tpv">3</b> ms</label><input id="tp" type="range" min="1" max="5" value="3">
</div>
<div class="ctl">
  <label><input type="radio" name="src" id="fix" checked> fix minta (10 kérés)</label>
  <label><input type="radio" name="src" id="poi"> Poisson-érkezés (20 kérés, seed 0)</label>
  <label for="rt">ráta = <b id="rtv">0,4</b> kérés/ms</label><input id="rt" type="range" min="0.1" max="1.5" step="0.1" value="0.4">
</div>
<div class="ctl"><button id="play">▶ Lejátszás</button><button id="end">teljes idővonal</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 350" role="img" aria-label="Tíz kérés idősávja; négy köteg 3, 14, 23 és 29 ms-kor indul, kettő megtelés, kettő időkorlát miatt; a magányos kérések 5 ms-ot várnak."></svg>

<p class="small">Szimuláció, nem mérés: egyetlen kiszolgáló, állandó kötegidő. Sraffozott = várakozás (a késleltetés része), teli = feldolgozás. A max_wait növelése nagyobb átlagos köteget, de nagyobb késleltetést ad; p95 a legközelebbi rang módszerével.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const FIX = [0, 1, 2, 3, 9, 20, 21, 22, 23, 24], g = id => document.getElementById(id);
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function arrivals(){ if (g("fix").checked) return FIX.slice();
  const r = rng(0), lam = +g("rt").value, out = []; let t = 0;
  for (let i = 0; i < 20; i++) { out.push(Math.round(t * 10) / 10); t += -Math.log(1 - r()) / lam; } return out; }
function simulate(arr, maxb, maxw, tp){
  let i = 0, free = -Infinity; const n = arr.length, B = [], R = new Array(n);
  while (i < n) { const a0 = arr[i], full = i + maxb - 1 < n ? arr[i + maxb - 1] : Infinity, trig = Math.min(full, a0 + maxw);
    let why = full <= a0 + maxw ? "tele" : "időkorlát"; const st = Math.max(trig, free); if (st > trig) why = "szerver foglalt";
    let j = i; while (j < n && j - i < maxb && arr[j] <= st) j++;
    const mem = []; for (let q = i; q < j; q++) { mem.push(q); R[q] = [st, st + tp]; }
    B.push([st, st + tp, mem, why]); free = st + tp; i = j; }
  return [B, R];
}
let T = Infinity, timer = null, SIM = null;
function compute(){ ["mb","mw","tp"].forEach(id => g(id + "v").textContent = g(id).value); g("rtv").textContent = fmt(+g("rt").value, 1);
  const arr = arrivals(); SIM = [arr].concat(simulate(arr, +g("mb").value, +g("mw").value, +g("tp").value)); }
function draw(){
  const [arr, B, R] = SIM, n = arr.length, tmax = Math.max(35, Math.ceil(Math.max(...R.map(r => r[1])) / 5) * 5);
  svg.innerHTML = "";
  const L = 105, Rr = 600, top = 40, rowh = Math.min(26, 300 / n), xs = t => L + t / tmax * (Rr - L);
  svg.setAttribute("viewBox", `0 0 640 ${top + n * rowh + 50}`);
  const defs = el("defs", {}), pat = el("pattern", {id: "hh", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--fg"), "stroke-width": 1.2}, undefined, pat);
  for (let t = 0; t <= tmax; t += 5) { el("line", {x1: xs(t), x2: xs(t), y1: top - 6, y2: top + n * rowh, stroke: css("--grid")});
    el("text", {x: xs(t), y: top + n * rowh + 16, "text-anchor": "middle", "font-size": 11}, String(t)); }
  el("text", {x: (L + Rr) / 2, y: top + n * rowh + 34, "text-anchor": "middle", "font-size": 12}, "idő [ms]");
  B.forEach((b, bi) => { if (b[0] > T) return; el("line", {x1: xs(b[0]), x2: xs(b[0]), y1: top - 6, y2: top + n * rowh, stroke: css("--hl"), "stroke-dasharray": "4 3", "stroke-width": 1.4});
    el("text", {x: xs(b[0]), y: top - 10 - (bi % 2) * 14, "text-anchor": "middle", "font-size": 11, fill: css("--hl")}, `${bi + 1}: ${b[3]}`); });
  arr.forEach((a, k) => { const y = top + k * rowh, h = rowh * 0.62, [s, e] = R[k];
    el("text", {x: L - 6, y: y + rowh / 2 + 4, "text-anchor": "end", "font-size": 11}, `@${fmt(a, a % 1 ? 1 : 0)} ms`);
    if (a > T) return;
    const w1 = Math.min(s, T) - a; if (w1 > 0) el("rect", {x: xs(a), y: y + (rowh - h) / 2, width: xs(a + w1) - xs(a), height: h, fill: "url(#hh)", stroke: css("--line"), "stroke-width": 0.8});
    if (T > s) el("rect", {x: xs(s), y: y + (rowh - h) / 2, width: xs(Math.min(e, T)) - xs(s), height: h, fill: css("--fg"), stroke: css("--line"), "stroke-width": 0.8});
    if (T >= e) el("text", {x: xs(e) + 4, y: y + rowh / 2 + 4, "font-size": 11}, `${fmt(e - a, 1)} ms`); });
  if (isFinite(T)) el("line", {x1: xs(T), x2: xs(T), y1: top - 6, y2: top + n * rowh, stroke: css("--hl2"), "stroke-width": 2});
  const lat = arr.map((a, k) => R[k][1] - a), srt = lat.slice().sort((x, y) => x - y), p95 = srt[Math.ceil(0.95 * n) - 1];
  const avg = lat.reduce((x, y) => x + y, 0) / n, span = Math.max(...R.map(r => r[1])) - arr[0];
  status.textContent = `${B.length} köteg (indulás: ${B.map(b => fmt(b[0], 1)).join(", ")} ms); átlagos kötegméret ${fmt(n / B.length, 2)}; ` +
    `késleltetés átlag ${fmt(avg, 2)} ms, p95 ${fmt(p95, 1)} ms; áteresztőképesség ${fmt(n / span, 3)} kérés/ms` + (isFinite(T) ? ` · t = ${fmt(T, 1)} ms` : "") + ".";
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
function all(){ stopPlay(); compute(); T = Infinity; draw(); }
["mb","mw","tp","rt"].forEach(id => g(id).oninput = all); ["fix","poi"].forEach(id => g(id).onchange = all);
g("end").onclick = all;
g("play").onclick = () => { if (timer) { stopPlay(); return; } const tend = Math.max(...SIM[2].map(r => r[1])); T = 0; g("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { T += 0.5; if (T >= tend) { T = Infinity; stopPlay(); } draw(); }, 80); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
compute(); draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
