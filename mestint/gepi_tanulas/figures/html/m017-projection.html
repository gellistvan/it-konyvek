<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legkisebb négyzetek mint vetítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="t0">θ′₀ =</label><input id="t0" type="range" min="-1" max="3" step="0.01" value="0.5" aria-label="Theta vessző nulla (tengelymetszet)"><b id="t0v"></b>
<label for="t1">θ′₁ =</label><input id="t1" type="range" min="-1" max="2" step="0.01" value="1" aria-label="Theta vessző egy (meredekség)"><b id="t1v"></b>
<button id="opt">Optimum</button><button id="reset">Alaphelyzet</button>
<span class="small">A 3D nézet üres részen húzva forog; a narancs pont a síkon húzható.</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 400" role="img" aria-label="Forgatható 3D nézet: az X oszlopterének síkja két oszlopvektorral, az y vektor, a vetülete és a merőleges reziduál, valamint egy húzható síkbeli pont hosszabb hibavektorral"></svg>

<p class="small">Számított, nem mérés. X̃ = [[1, 0], [1, 1], [1, 2]], y = (1; 2; 2); a sík az X̃ oszloptere. Az optimumban θ̂ = (7/6; 1/2) ≈ (1,1667; 0,5), ‖r‖² = 1/6 és X̃ᵀr = 0; minden más θ′-nél a négyzetes hiba nagyobb.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

function P3(p, rot){
  const a = rot.az * Math.PI / 180, e = rot.el * Math.PI / 180;
  const x1 = p[0] * Math.cos(a) - p[1] * Math.sin(a);
  const y1 = p[0] * Math.sin(a) + p[1] * Math.cos(a);
  return [x1, p[2] * Math.cos(e) + y1 * Math.sin(e), y1 * Math.cos(e) - p[2] * Math.sin(e)];
}

const XT = [[1, 0], [1, 1], [1, 2]], Yv = [1, 2, 2], THH = [7 / 6, 0.5];
let tp = [0.5, 1], rot = {az: -105, el: 35}, drag = null, last = null;
const C = [250, 265], S = 125;
function pr(p){ const v = P3(p, rot); return [C[0] + S * v[0], C[1] - S * v[1]]; }
const mul = t => XT.map(r => r[0] * t[0] + r[1] * t[1]);
const sub = (a, b) => a.map((v, i) => v - b[i]);
function arrow(p0, p1, w, dash, col){
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, h = 10;
  el("line", {x1: p0[0], y1: p0[1], x2: p1[0] - ux * h * 0.7, y2: p1[1] - uy * h * 0.7, stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  el("path", {d: `M${p1[0]} ${p1[1]}L${p1[0] - ux * h - uy * h * 0.4} ${p1[1] - uy * h + ux * h * 0.4}L${p1[0] - ux * h + uy * h * 0.4} ${p1[1] - uy * h - ux * h * 0.4}Z`, fill: col}); }
function draw(){
  svg.innerHTML = "";
  const bg = el("rect", {x: 0, y: 0, width: 640, height: 400, fill: "transparent", class: "drag"});
  bg.addEventListener("pointerdown", e => { drag = "rot"; last = [e.clientX, e.clientY]; e.preventDefault(); });
  // tengelyek
  [[1.5, 0, 0, "1."], [0, 1.8, 0, "2."], [0, 0, 1.5, "3. megfigyelés"]].forEach(v => { const a = pr([0, 0, 0]), b = pr(v.slice(0, 3));
    el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--grid"), "stroke-width": 1}); el("text", {x: b[0] + 4, y: b[1], "font-size": 11, fill: css("--muted")}, v[3]); });
  const a1 = [1, 1, 1], a2 = [0, 1, 2], P = (s, t) => [s * a1[0] + t * a2[0], s * a1[1] + t * a2[1], s * a1[2] + t * a2[2]];
  const pl = [P(-0.25, -0.2), P(1.45, -0.2), P(1.45, 1.1), P(-0.25, 1.1)].map(pr);
  el("path", {d: "M" + pl.map(p => p.join(" ")).join("L") + "Z", fill: css("--fill"), "fill-opacity": 0.65, stroke: css("--muted")});
  for (let k = 0; k <= 8; k++){ const s = -0.25 + 1.7 * k / 8, A = pr(P(s, -0.2)), B = pr(P(s, 1.1)); el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: css("--muted"), "stroke-width": 0.4}); }
  const O = pr([0, 0, 0]), col = css("--fg"), hl = css("--hl"), h2 = css("--hl2");
  arrow(O, pr(a1), 1.6, "", col); arrow(O, pr(a2), 1.6, "", col);
  const A1 = pr(a1), A2 = pr(a2);
  el("text", {x: A1[0] + 5, y: A1[1] + 14, "font-size": 12}, "1. oszlop (1; 1; 1)"); el("text", {x: A2[0] - 8, y: A2[1] + 4, "font-size": 12, "text-anchor": "end"}, "2. oszlop (0; 1; 2)");
  const yh = mul(THH), q = mul(tp), Yp = pr(Yv), Yh = pr(yh), Q = pr(q);
  arrow(O, Yp, 3.2, "", col); arrow(O, Yh, 2.2, "7 4", hl); arrow(Yh, Yp, 2.2, "2 4", col);
  el("line", {x1: Q[0], y1: Q[1], x2: Yp[0], y2: Yp[1], stroke: h2, "stroke-width": 1.6});
  el("text", {x: Yp[0] + 6, y: Yp[1] - 6, "font-size": 12}, "y = (1; 2; 2)");
  el("text", {x: Yh[0] + 8, y: Yh[1] + 16, "font-size": 12, fill: hl}, "ŷ");
  const g = el("g", {class: "drag", tabindex: 0, role: "button", "aria-label": "A síkbeli X̃θ′ pont, húzható (nyilakkal is)"});
  el("circle", {cx: Q[0], cy: Q[1], r: 12, fill: "transparent"}, undefined, g);
  el("circle", {cx: Q[0], cy: Q[1], r: 6, fill: h2, stroke: col}, undefined, g);
  el("text", {x: Q[0] + 9, y: Q[1] - 8, "font-size": 12, fill: h2}, "X̃θ′", g);
  g.addEventListener("pointerdown", e => { drag = "pt"; e.preventDefault(); e.stopPropagation(); });
  g.addEventListener("keydown", e => { const d = {ArrowLeft: [-.05, 0], ArrowRight: [.05, 0], ArrowUp: [0, .05], ArrowDown: [0, -.05]}[e.key];
    if (d){ e.preventDefault(); tp = [tp[0] + d[0], tp[1] + d[1]]; sync(); svg.querySelector("g.drag").focus(); } });
  const e = sub(Yv, q), sse = e.reduce((s, v) => s + v * v, 0), g0 = e[0] + e[1] + e[2], g1 = e[1] + 2 * e[2];
  status.textContent = `θ′ = (${fmt(tp[0], 4)}; ${fmt(tp[1], 4)}): ‖y − X̃θ′‖² = ${fmt(sse, 4)} (optimum: 1/6 ≈ 0,1667); X̃ᵀ(y − X̃θ′) = (${fmt(g0, 4)}; ${fmt(g1, 4)})` +
    (Math.abs(g0) < 5e-4 && Math.abs(g1) < 5e-4 ? " – merőleges a síkra: ez az optimum θ̂ = (7/6; 1/2)." : " – nem merőleges, a hiba nagyobb.");
  document.getElementById("t0v").textContent = fmt(tp[0], 2); document.getElementById("t1v").textContent = fmt(tp[1], 2);
}
function sync(){ document.getElementById("t0").value = tp[0]; document.getElementById("t1").value = tp[1]; draw(); }
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (drag === "rot"){ rot.az -= (ev.clientX - last[0]) * 0.5; rot.el = Math.max(-10, Math.min(85, rot.el + (ev.clientY - last[1]) * 0.4)); last = [ev.clientX, ev.clientY]; draw(); return; }
  // a képernyőpont → θ′: a vetítés lineáris, ezért a 2×2-es rendszer pontosan megoldható
  const m = svgPt(ev), O = pr([0, 0, 0]), c0 = pr([1, 1, 1]), c1 = pr([0, 1, 2]);
  const a = c0[0] - O[0], b = c1[0] - O[0], c = c0[1] - O[1], d = c1[1] - O[1], det = a * d - b * c;
  if (Math.abs(det) < 1e-6) return;
  const px = m.x - O[0], py = m.y - O[1];
  tp = [Math.max(-1, Math.min(3, (d * px - b * py) / det)), Math.max(-1, Math.min(2, (-c * px + a * py) / det))]; sync(); });
window.addEventListener("pointerup", () => { drag = null; });
document.getElementById("t0").oninput = e => { tp[0] = +e.target.value; draw(); };
document.getElementById("t1").oninput = e => { tp[1] = +e.target.value; draw(); };
document.getElementById("opt").onclick = () => { tp = THH.slice(); sync(); };
document.getElementById("reset").onclick = () => { tp = [0.5, 1]; rot = {az: -105, el: 35}; sync(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
