<style>

  const pts = D.X.map((x, i) => { const p = pr([x[0], x[1], x[0]*x[0] + x[1]*x[1]]); return [p, D.y[i]]; });
  pts.sort((a, b) => b[0][2] - a[0][2]);
  pts.forEach(([p, y]) => {
    if (y) el("path", {d: `M${p[0]},${p[1]-4} l4,7 h-8 z`, fill: fg}, undefined, g3);
    else el("circle", {cx: p[0], cy: p[1], r: 3.2, fill: css("--bg"), stroke: fg, "stroke-width": 1}, undefined, g3);
  });
  el("text", {x: 160, y: 395, "text-anchor": "middle", "font-size": 12}, "z = " + fmt(D.Z0, 2) + " sík: a ▲ alatta, a ○ felette", g3);
  // --- jobb: döntési határ ---
  const g = D.gammas[gi], C = D.Cs[Ci], st = D.S[gi + "|" + Ci];
  const X0 = 340, Y0 = 40, W = 340, n = D.G, gx = D.gx, lo = gx[0], hi = gx[n - 1];
  const tx = v => X0 + (v - lo) / (hi - lo) * W, ty = v => Y0 + W - (v - lo) / (hi - lo) * W;
  const cw = W / (n - 1);
  let dpath = "";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (st.s[i * n + j] === "1")
    dpath += `M${(tx(gx[j]) - cw / 2).toFixed(1)},${(ty(gx[i]) - cw / 2).toFixed(1)}h${(cw+0.6).toFixed(2)}v${(cw+0.6).toFixed(2)}h-${(cw+0.6).toFixed(2)}z`;
  el("rect", {x: X0, y: Y0, width: W, height: W, fill: css("--bg"), stroke: fg});
  el("path", {d: dpath, fill: fill, "fill-opacity": 0.7, stroke: "none"});
  ["-1", "0", "1"].forEach(lv => st.L[lv].forEach(seg => {
    el("polyline", {points: seg.map(p => tx(p[0]).toFixed(1) + "," + ty(p[1]).toFixed(1)).join(" "), fill: "none", stroke: fg,
      "stroke-width": lv === "0" ? 2.2 : 1.2, "stroke-dasharray": lv === "0" ? "" : "6 4"});
  }));
  const sv = new Set(st.sv);
  D.X.forEach((x, i) => {
    const px = tx(x[0]), py = ty(x[1]);
    if (sv.has(i)) el("circle", {cx: px, cy: py, r: 6.5, fill: "none", stroke: muted, "stroke-width": 1});
    if (D.y[i]) el("path", {d: `M${px},${py-4} l4,7 h-8 z`, fill: fg});
    else el("circle", {cx: px, cy: py, r: 3, fill: css("--bg"), stroke: fg, "stroke-width": 1});
  });
  el("text", {x: X0 + W / 2, y: Y0 - 10, "text-anchor": "middle", "font-size": 13}, `RBF-SVC: γ = ${gtxt(g)}, C = ${fmt(C, C < 1 ? 1 : 0)}`);
  el("text", {x: X0 + W / 2, y: Y0 + W + 18, "text-anchor": "middle", "font-size": 12}, "folytonos: f = 0, szaggatott: f = ±1, karika: SV");
  document.getElementById("gv").textContent = gtxt(g);
  status.textContent = `γ = ${gtxt(g)}, C = ${fmt(C, C < 1 ? 1 : 0)}: támogató vektorok ${st.n}/140, tanítópontosság ${fmt(st.tr, 3)}, validációs pontosság ${fmt(st.va, 3)}`
    + (g <= 0.01 ? " – kis γ: a kernel közel konstans, a határ közel lineáris (alulillesztés)" : g >= 30 ? " – nagy γ: csipkézett határ, sok SV, a validációs pontosság romlik" : "");
}
gs.oninput = () => { gi = +gs.value; draw(); };
cs.onchange = () => { Ci = +cs.value; draw(); };
let drag = null;
svg.addEventListener("pointerdown", e => { const p = svgPt(e); if (p.x < 320) { drag = [e.clientX, e.clientY, rot.az, rot.el]; svg.setPointerCapture(e.pointerId); } });
svg.addEventListener("pointermove", e => { if (!drag) return; rot.az = drag[2] + (e.clientX - drag[0]) * 0.5; rot.el = Math.max(-5, Math.min(85, drag[3] + (e.clientY - drag[1]) * 0.4)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
document.getElementById("rl").onclick = () => { rot.az -= 15; draw(); };
document.getElementById("rr").onclick = () => { rot.az += 15; draw(); };
document.getElementById("ru").onclick = () => { rot.el = Math.min(85, rot.el + 10); draw(); };
document.getElementById("rd").onclick = () => { rot.el = Math.max(-5, rot.el - 10); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
