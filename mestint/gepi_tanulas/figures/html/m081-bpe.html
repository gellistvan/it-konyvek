<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPE két egyesítése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód: <select id="mode"><option value="train" selected>tanítás (számlálás → választás → átírás)</option><option value="tok">tokenize lejátszása</option></select></label><label>döntetlennél: <select id="tie"><option value="first" selected>az elsőként előforduló pár (itt: ab)</option><option value="last">az utolsóként előforduló jelölt (itt: bc)</option></select></label><label>korpusz (| választja el a szövegeket, szóköz a tokeneket): <input id="corp" size="28" value="a b c a b | a b c | b c a"></label><label>célszókincs: <input id="tgt" type="number" min="2" max="30" value="5" style="width:4em"></label><label>tokenize szöveg: <input id="txt" size="10" value="abcabc"></label><button id="go">Újraszámolás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A háromsoros korpusz tokenjei és a szomszédos párok gyakorisága; először az ab, majd az abc token jön létre, a harmadik szövegben a b c a változatlan marad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A tanítási vázlat a fejezet leírásának átirata (párszámlálás → mohó választás → balról jobbra átírás); a tokenize a 22.1.4 pszeudokódja. A döntetlen-szabály implementációfüggő; a fejezet az elsőként előfordulót választja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "count", "corp": [["a", "b", "c", "a", "b"], ["a", "b", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": null, "vocab": ["a", "b", "c"], "merges": [], "hl": [], "line": 3, "msg": "1. számlálás: ab: 3, bc: 3, ca: 2"}, {"ph": "choose", "corp": [["a", "b", "c", "a", "b"], ["a", "b", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": ["a", "b"], "vocab": ["a", "b", "c"], "merges": [], "hl": [], "line": 4, "msg": "ab: 3, bc: 3, ca: 2 – döntetlen, választás: ab"}, {"ph": "merge", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": ["a", "b"], "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [[0, 2], [0], []], "line": 6, "msg": "1. átírás: a b → ab; korpusz: ab c ab | ab c | b c a; szókincs: {a, b, c, ab}"}, {"ph": "count", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": null, "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [], "line": 3, "msg": "2. számlálás: (ab, c): 2, (c, ab): 1, bc: 1, ca: 1"}, {"ph": "choose", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": ["ab", "c"], "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [], "line": 4, "msg": "(ab, c): 2, (c, ab): 1, bc: 1, ca: 1 – választás: (ab, c)"}, {"ph": "merge", "corp": [["abc", "ab"], ["abc"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": ["ab", "c"], "vocab": ["a", "b", "c", "ab", "abc"], "merges": [["a", "b"], ["ab", "c"]], "hl": [[0], [0], []], "line": 6, "msg": "2. átírás: ab c → abc; korpusz: abc ab | abc | b c a; szókincs: {a, b, c, ab, abc}"}];
const CODE = ["function train_bpe(corpus, vocab_size):        # tanítás (vázlat)", "    vocab = set(all_symbols(corpus)); merge_list = []", "    while len(vocab) < vocab_size:", "        counts = count_adjacent_pairs(corpus)", "        (u, v) = argmax(counts)               # döntetlen: a választott szabály", "        corpus = replace_pair(corpus, u, v)   # u v → uv, balról jobbra", "        vocab.add(u + v); merge_list.append((u, v))", "    return vocab, merge_list", " ", "function tokenize(s):                           # 22.1.4", "    tokens = list_of_bytes(s)", "    for (u, v) in merge_list:", "        new_tokens = []", "        i = 0", "        while i < len(tokens):", "            if i + 1 < len(tokens) and tokens[i] == u and tokens[i+1] == v:", "                new_tokens.append(u + v)", "                i += 2", "            else:", "                new_tokens.append(tokens[i])", "                i += 1", "        tokens = new_tokens", "    return tokens"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const INIT = {"train": [{"ph": "count", "corp": [["a", "b", "c", "a", "b"], ["a", "b", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": null, "vocab": ["a", "b", "c"], "merges": [], "hl": [], "line": 3, "msg": "1. számlálás: ab: 3, bc: 3, ca: 2"}, {"ph": "choose", "corp": [["a", "b", "c", "a", "b"], ["a", "b", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": ["a", "b"], "vocab": ["a", "b", "c"], "merges": [], "hl": [], "line": 4, "msg": "ab: 3, bc: 3, ca: 2 – döntetlen, választás: ab"}, {"ph": "merge", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["a", "b", 3], ["b", "c", 3], ["c", "a", 2]], "sel": ["a", "b"], "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [[0, 2], [0], []], "line": 6, "msg": "1. átírás: a b → ab; korpusz: ab c ab | ab c | b c a; szókincs: {a, b, c, ab}"}, {"ph": "count", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": null, "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [], "line": 3, "msg": "2. számlálás: (ab, c): 2, (c, ab): 1, bc: 1, ca: 1"}, {"ph": "choose", "corp": [["ab", "c", "ab"], ["ab", "c"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": ["ab", "c"], "vocab": ["a", "b", "c", "ab"], "merges": [["a", "b"]], "hl": [], "line": 4, "msg": "(ab, c): 2, (c, ab): 1, bc: 1, ca: 1 – választás: (ab, c)"}, {"ph": "merge", "corp": [["abc", "ab"], ["abc"], ["b", "c", "a"]], "counts": [["ab", "c", 2], ["c", "ab", 1], ["b", "c", 1], ["c", "a", 1]], "sel": ["ab", "c"], "vocab": ["a", "b", "c", "ab", "abc"], "merges": [["a", "b"], ["ab", "c"]], "hl": [[0], [0], []], "line": 6, "msg": "2. átírás: ab c → abc; korpusz: abc ab | abc | b c a; szókincs: {a, b, c, ab, abc}"}], "tok": [{"ph": "tok", "toks": ["a", "b", "c", "a", "b", "c"], "new": [], "i": -1, "m": -1, "line": 10, "msg": "tokens = list_of_bytes(\"abcabc\") = a b c a b c"}, {"ph": "tok", "toks": ["a", "b", "c", "a", "b", "c"], "new": ["ab"], "i": 0, "j": 2, "m": 0, "line": 16, "msg": "1. fúzió (a, b): i = 0, tokens[i] tokens[i+1] = a b → összevonás, i += 2"}, {"ph": "tok", "toks": ["a", "b", "c", "a", "b", "c"], "new": ["ab", "c"], "i": 2, "j": 1, "m": 0, "line": 19, "msg": "1. fúzió (a, b): i = 2, a(z) c változatlanul átmásolva, i += 1"}, {"ph": "tok", "toks": ["a", "b", "c", "a", "b", "c"], "new": ["ab", "c", "ab"], "i": 3, "j": 2, "m": 0, "line": 16, "msg": "1. fúzió (a, b): i = 3, tokens[i] tokens[i+1] = a b → összevonás, i += 2"}, {"ph": "tok", "toks": ["a", "b", "c", "a", "b", "c"], "new": ["ab", "c", "ab", "c"], "i": 5, "j": 1, "m": 0, "line": 19, "msg": "1. fúzió (a, b): i = 5, a(z) c változatlanul átmásolva, i += 1"}, {"ph": "tok", "toks": ["ab", "c", "ab", "c"], "new": [], "i": -1, "m": 0, "line": 21, "msg": "1. fúzió vége: tokens = ab c ab c"}, {"ph": "tok", "toks": ["ab", "c", "ab", "c"], "new": ["abc"], "i": 0, "j": 2, "m": 1, "line": 16, "msg": "2. fúzió (ab, c): i = 0, tokens[i] tokens[i+1] = ab c → összevonás, i += 2"}, {"ph": "tok", "toks": ["ab", "c", "ab", "c"], "new": ["abc", "abc"], "i": 2, "j": 2, "m": 1, "line": 16, "msg": "2. fúzió (ab, c): i = 2, tokens[i] tokens[i+1] = ab c → összevonás, i += 2"}, {"ph": "tok", "toks": ["abc", "abc"], "new": [], "i": -1, "m": 1, "line": 21, "msg": "2. fúzió vége: tokens = abc abc"}, {"ph": "tok", "toks": ["abc", "abc"], "new": [], "i": -1, "m": 2, "line": 22, "msg": "return: abc abc (2 token)"}]};

function plabel(u, v){ return (u.length === 1 && v.length === 1) ? u + v : "(" + u + ", " + v + ")"; }
function trainJS(texts, target, tie){
  let corp = texts.map(t => t.trim().split(/\s+/).filter(x => x.length));
  corp = corp.filter(r => r.length);
  const vocab = [];
  corp.forEach(r => r.forEach(t => { if (!vocab.includes(t)) vocab.push(t); }));
  const merges = [], out = [];
  let guard = 0;
  while (vocab.length < target && guard++ < 40) {
    const c = new Map();
    corp.forEach(r => { for (let i = 0; i + 1 < r.length; i++) { const key = r[i] + "\u0001" + r[i + 1]; c.set(key, (c.get(key) || 0) + 1); } });
    if (!c.size) break;
    const kk = merges.length + 1;
    const cl = [...c.entries()].map(([key, n]) => { const q = key.split("\u0001"); return [q[0], q[1], n]; });
    const snap = () => corp.map(r => r.slice());
    out.push({ph: "count", corp: snap(), counts: cl, sel: null, vocab: vocab.slice(), merges: merges.map(m => m.slice()), hl: [], line: 3,
              msg: kk + ". számlálás: " + cl.map(q => plabel(q[0], q[1]) + ": " + q[2]).join(", ")});
    const mx = Math.max(...cl.map(q => q[2]));
    const cands = cl.filter(q => q[2] === mx);
    const pq = tie === "first" ? cands[0] : cands[cands.length - 1];
    const u = pq[0], v = pq[1];
    out.push({ph: "choose", corp: snap(), counts: cl, sel: [u, v], vocab: vocab.slice(), merges: merges.map(m => m.slice()), hl: [], line: 4,
              msg: cl.map(q => plabel(q[0], q[1]) + ": " + q[2]).join(", ") + (cands.length > 1 ? " – döntetlen, választás: " : " – választás: ") + plabel(u, v)});
    const hls = [];
    corp = corp.map(r => { const o = [], pos = []; let i = 0;
      while (i < r.length) { if (i + 1 < r.length && r[i] === u && r[i + 1] === v) { pos.push(o.length); o.push(u + v); i += 2; } else { o.push(r[i]); i += 1; } }
      hls.push(pos); return o; });
    if (!vocab.includes(u + v)) vocab.push(u + v);
    merges.push([u, v]);
    out.push({ph: "merge", corp: snap(), counts: cl, sel: [u, v], vocab: vocab.slice(), merges: merges.map(m => m.slice()), hl: hls, line: 6,
              msg: kk + ". átírás: " + u + " " + v + " → " + u + v + "; korpusz: " + corp.map(r => r.join(" ")).join(" | ") + "; szókincs: {" + vocab.join(", ") + "}"});
  }
  if (!out.length) out.push({ph: "count", corp: corp, counts: [], sel: null, vocab: vocab, merges: [], hl: [], line: 2, msg: "Nincs mit egyesíteni (a szókincs már elérte a célméretet, vagy nincs szomszédos pár)."});
  return out;
}
function tokJS(text, merges){
  let toks = Array.from(text);
  const out = [{ph: "tok", toks: toks.slice(), new: [], i: -1, m: -1, line: 10, msg: 'tokens = list_of_bytes("' + text + '") = ' + toks.join(" ")}];
  merges.forEach((mv, mi) => {
    const u = mv[0], v = mv[1], nw = []; let i = 0;
    while (i < toks.length) {
      if (i + 1 < toks.length && toks[i] === u && toks[i + 1] === v) { nw.push(u + v);
        out.push({ph: "tok", toks: toks.slice(), new: nw.slice(), i: i, j: 2, m: mi, line: 16, msg: (mi + 1) + ". fúzió (" + u + ", " + v + "): i = " + i + ", tokens[i] tokens[i+1] = " + u + " " + v + " → összevonás, i += 2"}); i += 2; }
      else { nw.push(toks[i]);
        out.push({ph: "tok", toks: toks.slice(), new: nw.slice(), i: i, j: 1, m: mi, line: 19, msg: (mi + 1) + ". fúzió (" + u + ", " + v + "): i = " + i + ", a(z) " + toks[i] + " változatlanul átmásolva, i += 1"}); i += 1; }
    }
    toks = nw;
    out.push({ph: "tok", toks: toks.slice(), new: [], i: -1, m: mi, line: 21, msg: (mi + 1) + ". fúzió vége: tokens = " + toks.join(" ")});
  });
  out.push({ph: "tok", toks: toks.slice(), new: [], i: -1, m: merges.length, line: 22, msg: "return: " + toks.join(" ") + " (" + toks.length + " token)"});
  return out;
}
let MERGES = INIT.train[INIT.train.length - 1].merges;
function tw(t){ return 26 + 11 * (t.length - 1); }
function tokRow(row, x, y, hl, label){
  if (label) el("text", {x: x - 8, y: y + 19, "text-anchor": "end", "font-size": 13}, label);
  row.forEach((t, i) => { const w = tw(t), on = hl && hl.includes(i);
    el("rect", {x: x, y: y, width: w, height: 28, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x + w / 2, y: y + 19, "text-anchor": "middle", "font-size": 14, "font-weight": on ? "bold" : "normal"}, t);
    x += w + 5; });
  return x;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  if (s.ph === "tok") {
    el("text", {x: 20, y: 30, "font-size": 14, "font-weight": "bold"}, "tokenize – fúziós lista: " + MERGES.map((m, i) => (i + 1) + ". (" + m[0] + ", " + m[1] + ")").join("  "));
    MERGES.forEach((m, i) => { if (i === s.m) el("rect", {x: 18, y: 38, width: 604, height: 4, fill: css("--hl")}); });
    el("text", {x: 20, y: 90, "font-size": 13, fill: css("--muted")}, "tokens");
    const x0 = 120; let x = x0; const cx = [];
    s.toks.forEach((t, i) => { const w = tw(t), on = s.i >= 0 && (i === s.i || (s.j === 2 && i === s.i + 1));
      el("rect", {x: x, y: 70, width: w, height: 30, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2});
      el("text", {x: x + w / 2, y: 91, "text-anchor": "middle", "font-size": 15}, t);
      el("text", {x: x + w / 2, y: 116, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
      cx.push(x + w / 2); x += w + 5; });
    if (s.i >= 0) { el("text", {x: cx[s.i], y: 62, "text-anchor": "middle", "font-size": 13, fill: css("--hl2"), "font-weight": "bold"}, "i = " + s.i + " ▼"); }
    el("text", {x: 20, y: 170, "font-size": 13, fill: css("--muted")}, "new_tokens");
    tokRow(s.new, x0, 150, s.new.length ? [s.new.length - 1] : [], "");
    if (s.line === 22) el("text", {x: 20, y: 250, "font-size": 15, "font-weight": "bold"}, "Eredmény: " + s.toks.join(" | "));
    return;
  }
  el("text", {x: 20, y: 22, "font-size": 13, "font-weight": "bold"}, "korpusz");
  s.corp.forEach((r, i) => tokRow(r, 52, 34 + i * 38, s.ph === "merge" ? s.hl[i] : (s.sel ? (() => { const o = []; for (let q = 0; q + 1 < r.length; q++) if (r[q] === s.sel[0] && r[q + 1] === s.sel[1]) { o.push(q, q + 1); } return o; })() : []), (i + 1) + "."));
  const top = 34 + s.corp.length * 38 + 10;
  // párszámok oszlopdiagramja (jobb oldal)
  const X = 350; el("text", {x: X, y: 22, "font-size": 13, "font-weight": "bold"}, s.ph === "merge" ? "párszámok (az átírás előtt)" : "szomszédos párok");
  const mx = Math.max(1, ...s.counts.map(q => q[2]));
  s.counts.slice(0, 9).forEach((q, k) => { const y = 34 + k * 24, on = s.sel && q[0] === s.sel[0] && q[1] === s.sel[1];
    el("text", {x: X + 70, y: y + 14, "text-anchor": "end", "font-size": 12, "font-weight": on ? "bold" : "normal"}, "(" + q[0] + ", " + q[1] + ")");
    el("rect", {x: X + 76, y: y + 2, width: q[2] / mx * 110, height: 16, fill: on ? css("--hl2") : css("--cellhl"), stroke: css("--line"), "stroke-width": on ? 2 : 0.8});
    el("text", {x: X + 82 + q[2] / mx * 110, y: y + 15, "font-size": 12}, String(q[2]) + (on ? " ← választás" : "")); });
  const yb = Math.max(top, 34 + Math.min(9, s.counts.length) * 24 + 10) + 10;
  el("text", {x: 20, y: yb + 14, "font-size": 13}, "szókincs: {" + s.vocab.join(", ") + "}  (" + s.vocab.length + " elem)");
  el("text", {x: 20, y: yb + 36, "font-size": 13}, "fúziós lista: " + (s.merges.length ? s.merges.map((m, i) => (i + 1) + ". (" + m[0] + ", " + m[1] + ")").join("   ") : "üres"));
  svg.setAttribute("viewBox", "0 0 640 " + Math.max(200, yb + 50));
}
function rebuild(){
  const mode = document.getElementById("mode").value;
  const texts = document.getElementById("corp").value.split("|");
  const target = +document.getElementById("tgt").value, tie = document.getElementById("tie").value;
  const tr = trainJS(texts, target, tie);
  MERGES = tr[tr.length - 1].merges || [];
  if (mode === "train") setSteps(tr);
  else setSteps(tokJS(document.getElementById("txt").value.replace(/\s+/g, ""), MERGES));
}
["mode", "tie", "tgt"].forEach(id => document.getElementById(id).addEventListener("change", rebuild));
document.getElementById("go").addEventListener("click", rebuild);
(function selfcheck(){
  const a = JSON.stringify(trainJS(["a b c a b", "a b c", "b c a"], 5, "first")), b = JSON.stringify(INIT.train);
  const c = JSON.stringify(tokJS("abcabc", INIT.train[5].merges)), d = JSON.stringify(INIT.tok);
  document.body.dataset.selfcheck = (a === b ? "train-OK" : "train-ELTÉRÉS") + "/" + (c === d ? "tok-OK" : "tok-ELTÉRÉS");
})();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
