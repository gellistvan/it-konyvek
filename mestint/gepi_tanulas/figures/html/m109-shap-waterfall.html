<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHAP waterfall: a hitelpélda felbontása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="ord">Sorrend:</label><select id="ord"><option value="tab">táblázat szerinti</option><option value="abs">|φ| szerint csökkenő</option></select>
<span class="small">A végösszeg mindkét sorrendben 0,71 (additivitás).</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Waterfall-ábra: 0,32-es alapértékből a jövedelem +0,21, a hitelösszeg −0,14, az életkor +0,18, a mulasztások −0,06 és az egyéb +0,20 lépésekkel 0,71-es predikció."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, nem mért értékek (29.1.5), valószínűségi skála. Tömör sáv: növeli, sraffozott: csökkenti a predikciót.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Alapérték: E[f(X)] = 0,32 (az átlagos predikció a háttéradaton).", "k": 0, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 0}, {"msg": "havi jövedelem: 0,32 + 0,21 = 0,53", "k": 1, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 1}, {"msg": "hitel összege: 0,53 − 0,14 = 0,39", "k": 2, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 1}, {"msg": "életkor: 0,39 + 0,18 = 0,57", "k": 3, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 1}, {"msg": "korábbi mulasztások: 0,57 − 0,06 = 0,51", "k": 4, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 1}, {"msg": "egyéb: 0,51 + 0,20 = 0,71", "k": 5, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 1}, {"msg": "Predikció: 0,32 + Σφ = 0,71 = f(x).", "k": 6, "order": [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]], "line": 2}];
const CODE = ["f(x) = φ0                 # E[f(X)] a háttéradaton", "f(x) += φ_j               # a következő jellemző SHAP-értéke", "assert f(x) == φ0 + Σ φ_j  # additivitás (local accuracy)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v){ return v.toFixed(2).replace(".", ",").replace("-", "−"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern>`;
  svg.appendChild(defs);
  const ord = s.order, n = ord.length;
  let cm = 0.32, mx = 0.8; ord.forEach(f => { cm += f[1]; mx = Math.max(mx, Math.ceil(cm * 10 - 1e-9) / 10); });
  const L = 190, R = 540, X = v => L + (R - L) * (v - 0.2) / (mx - 0.2), rh = 36, top = 14, H = 22;
  for (let t = 0.2; t <= mx + 0.001; t += 0.1){ el("line", {x1: X(t), y1: top, x2: X(t), y2: top + rh * (n + 2), stroke: css("--muted"), "stroke-width": 0.4});
    el("text", {x: X(t), y: top + rh * (n + 2) + 14, "text-anchor": "middle", "font-size": 11}, hu(t).slice(0, 3)); }
  el("text", {x: (L + R) / 2, y: top + rh * (n + 2) + 30, "text-anchor": "middle", "font-size": 12}, "predikció (elfogadási valószínűség)");
  el("line", {x1: X(0.32), y1: top, x2: X(0.32), y2: top + rh * (n + 2), stroke: css("--fg"), "stroke-dasharray": "5 4"});
  const yc = i => top + rh * i + rh / 2;
  el("text", {x: L - 8, y: yc(0) + 4, "text-anchor": "end", "font-size": 12}, "E[f(X)] = 0,32");
  el("rect", {x: X(0.2), y: yc(0) - H / 2, width: X(0.32) - X(0.2), height: H, fill: css("--cellhl"), stroke: css("--fg")});
  let c = 0.32;
  ord.forEach((f, j) => { const [name, v] = f, y = yc(j + 1);
    const at = {x: L - 8, y: y + (name === "életkor" || name === "egyéb" ? -1 : 4), "text-anchor": "end", "font-size": 12}; if (j + 1 === s.k){ at.fill = css("--hl"); at["font-weight"] = "bold"; }
    el("text", at, name);
    if (j + 1 <= s.k){ const a = X(c), b = X(c + v), tp = v > 0 ? -7 : 7;
      const d = `M${a} ${y - H / 2}L${b + tp} ${y - H / 2}L${b} ${y}L${b + tp} ${y + H / 2}L${a} ${y + H / 2}Z`;
      el("path", {d, fill: v > 0 ? css("--fg") : "url(#hh)", stroke: css("--fg"), "stroke-width": j + 1 === s.k ? 2.5 : 1});
      el("text", {x: Math.max(a, b) + 6, y: y + 4, "font-size": 12}, (v > 0 ? "+" : "−") + hu(Math.abs(v)) + " (" + hu(c) + " → " + hu(c + v) + ")");
      if (name === "életkor") el("text", {x: L - 8, y: y + 17, "text-anchor": "end", "font-size": 10, "font-style": "italic", fill: css("--hl2")}, "⚠ jogilag érzékeny");
      if (name === "egyéb") el("text", {x: L - 8, y: y + 17, "text-anchor": "end", "font-size": 10, "font-style": "italic", fill: css("--hl2")}, "összevont – bontandó");
    }
    c += v; });
  const yf = yc(n + 1);
  el("text", {x: L - 8, y: yf + 4, "text-anchor": "end", "font-size": 12}, "f(x)");
  if (s.k === n + 1){ el("rect", {x: X(0.2), y: yf - H / 2, width: X(c) - X(0.2), height: H, fill: css("--cellhl"), stroke: css("--fg"), "stroke-width": 2});
    el("line", {x1: X(c), y1: top, x2: X(c), y2: top + rh * (n + 2), stroke: css("--fg"), "stroke-dasharray": "5 4"});
    el("text", {x: X(c) + 6, y: yf + 4, "font-size": 12, "font-weight": "bold"}, "= " + hu(c)); }
}
const FEATS = [["havi jövedelem", 0.21], ["hitel összege", -0.14], ["életkor", 0.18], ["korábbi mulasztások", -0.06], ["egyéb", 0.2]];
function stepsFor(order){
  const st = [{msg: "Alapérték: E[f(X)] = 0,32 (az átlagos predikció a háttéradaton).", k: 0, order, line: 0}]; let c = 0.32;
  order.forEach((f, j) => { const nc = c + f[1]; st.push({msg: `${f[0]}: ${hu(c)} ${f[1] > 0 ? "+" : "−"} ${hu(Math.abs(f[1]))} = ${hu(nc)}`, k: j + 1, order, line: 1}); c = nc; });
  st.push({msg: `Predikció: 0,32 + Σφ = ${hu(c)} = f(x).`, k: order.length + 1, order, line: 2}); return st; }
document.getElementById("ord").addEventListener("change", e => {
  const o = e.target.value === "abs" ? FEATS.slice().sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])) : FEATS.slice();
  setSteps(stepsFor(o)); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
