<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negatívok száma: akkumuláció, all-gather, GradCache</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Mód">
  <button id="ma" aria-pressed="true">(a) akkumuláció</button>
  <button id="mb" aria-pressed="false">(b) all-gather</button>
  <button id="mc" aria-pressed="false">(c) GradCache</button>
</div>
<div class="ctl">
  <label for="n">helyi batch n = <b id="nv">4</b></label><input id="n" type="range" min="2" max="16" value="4">
  <label for="p">eszközök / lépések = <b id="pv">2</b></label><input id="p" type="range" min="1" max="8" value="2">
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 350" role="img" aria-label="Logitmátrix blokkszerkezete a három módszernél; negatív/sor 3, 7 és 7 az n = 4, 2 rész esetén."></svg>

<p class="small">Sötét cella = pozitív pár (főátló); szürke = helyben számolt negatív; sraffozott = all-gatherrel kapott oszlop; üres = nem kerül a nevezőbe. A kezdeti veszteség egyenletes logitoknál ln(oszlopszám). Szemléltető, nem mérés; n = 64, 4 GPU mellett (b) 255 negatív/sor.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

let mode = "a";
const nEl = document.getElementById("n"), pEl = document.getElementById("p");
function kind(i, j, n){ const bi = Math.floor(i / n), bj = Math.floor(j / n);
  if (i === j) return "pos"; if (mode === "a") return bi === bj ? "local" : "none";
  if (mode === "b") return bi === bj ? "local" : "gather"; return "local"; }
function draw(){
  const n = +nEl.value, P = +pEl.value, N = n * P;
  document.getElementById("nv").textContent = n; document.getElementById("pv").textContent = P;
  ["a","b","c"].forEach(m => document.getElementById("m" + m).setAttribute("aria-pressed", m === mode));
  svg.innerHTML = "";
  const S = 300, x0 = 70, y0 = 30, c = S / N;
  // sraffozás-minta
  const defs = el("defs", {});
  const pat = el("pattern", {id: "h", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--fg"), "stroke-width": 1.4}, undefined, pat);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const k = kind(i, j, n), x = x0 + j * c, y = y0 + i * c;
    const a = {x: x, y: y, width: c, height: c, stroke: css("--line"), "stroke-width": N > 48 ? 0 : 0.4};
    if (k === "none") { a.fill = css("--bg"); a.stroke = css("--grid"); }
    else if (k === "gather") a.fill = "url(#h)";
    else if (k === "local") a.fill = css("--fill2");
    else { a.fill = css("--fg"); }
    el("rect", a);
  }
  if (mode !== "c") for (let b = 1; b < P; b++) {
    el("line", {x1: x0 + b * n * c, y1: y0, x2: x0 + b * n * c, y2: y0 + S, stroke: css("--hl2"), "stroke-width": 2});
    el("line", {x1: x0, y1: y0 + b * n * c, x2: x0 + S, y2: y0 + b * n * c, stroke: css("--hl2"), "stroke-width": 2});
  }
  el("rect", {x: x0, y: y0, width: S, height: S, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
  el("text", {x: x0 + S / 2, y: y0 - 10, "text-anchor": "middle", "font-size": 13}, "szövegek (oszlop) →");
  el("text", {x: x0 - 14, y: y0 + S / 2, "text-anchor": "middle", "font-size": 13, transform: `rotate(-90 ${x0 - 14} ${y0 + S / 2})`}, "képek (sor) →");
  const cols = mode === "a" ? n : N, neg = cols - 1;
  const lx = x0 + S + 30;
  const lines = [
    ["Effektív batch", `${N} pár (${n} × ${P})`],
    ["Nevező (oszlop/sor)", `${cols}`],
    ["Negatív / sor", `${neg}`],
    ["Logitmátrix egyszerre", mode === "a" ? `${n} × ${n} (lépésenként)` : mode === "b" ? `${n} × ${N} (eszközönként)` : `${N} × ${N} (egy eszközön)`],
    ["Kezdeti veszteség ln(N)", fmt(Math.log(cols), 3)],
  ];
  lines.forEach((l, q) => { el("text", {x: lx, y: y0 + 20 + q * 46, "font-size": 13, fill: css("--muted")}, l[0]);
    el("text", {x: lx, y: y0 + 40 + q * 46, "font-size": 17, "font-weight": "bold"}, l[1]); });
  const why = {a: "Az akkumulációs lépések mini-batchei nem látják egymást: a blokkon kívüli cellák kimaradnak.",
    b: "Minden eszköz a saját n sorát a teljes N oszloppal számolja; a sraffozott oszlopok a többi eszköz beágyazásai.",
    c: "Egy eszközön a teljes N × N mátrix: 1. menet no_grad beágyazás, veszteség, beágyazás-gradiens; 2. menet chunkonként backward."}[mode];
  status.textContent = `Mód ${mode}: n = ${n}, ${P} rész → negatív/sor = ${neg}, kezdeti veszteség ≈ ln ${cols} = ${fmt(Math.log(cols), 3)}. ${why}`;
}
["a","b","c"].forEach(m => document.getElementById("m" + m).onclick = () => { mode = m; draw(); });
nEl.oninput = draw; pEl.oninput = draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
