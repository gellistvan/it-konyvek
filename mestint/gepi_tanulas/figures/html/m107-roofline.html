<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roofline-modell</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="GPU">
<label>GPU <select id="gpu"><option value="a100" selected>A100 (312 TFLOP/s, 2 TB/s)</option><option value="h100">H100 SXM (≈ 989 TFLOP/s, 3,35 TB/s)</option><option value="l4">L4 (≈ 121 TFLOP/s, 0,3 TB/s)</option><option value="own">saját</option></select></label>
<label>F <input id="f" type="range" min="1" max="3.3" step="any" value="2.4942"> <b id="fv"></b> TFLOP/s</label>
<label>B <input id="b" type="range" min="-1" max="0.7" step="any" value="0.30103"> <b id="bv"></b> TB/s</label>
</div>
<div class="ctl" role="group" aria-label="Művelet">
<label>matmul n (M = N = K) <input id="n" type="number" min="1" max="65536" value="4096" style="width:6em"></label>
<label>bájt/elem <select id="by"><option value="2" selected>2 (FP16/BF16)</option><option value="4">4 (FP32)</option></select></label>
<label>mért TFLOP/s <input id="meas" type="text" value="" placeholder="pl. labor mérés" style="width:7em"></label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Log-log roofline: ferde sávszélesség-tető és vízszintes számítási tető, könyökpont az egyensúlyi intenzitásnál; matmul és ReLU pontok, állítható GPU-paraméterekkel"></svg>

<p class="small">Számított modell, nem mérés: P = min(F, B·I). Az A100/H100/L4 értékek adatlapi nagyságrendek (dense FP16 tensor core), ellenőrizendők a használt kártya adatlapján. A matmul intenzitása ideális (minden mátrix egyszer olvasva/írva); a mért értéket a labor futtatása adja.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const G = {a100: [312, 2], h100: [989, 3.35], l4: [121, 0.3]};
const E = {}; ["gpu", "f", "b", "n", "by", "meas"].forEach(i => E[i] = document.getElementById(i));
E.gpu.addEventListener("change", () => { if (E.gpu.value !== "own"){ const [f, b] = G[E.gpu.value]; E.f.value = Math.log10(f); E.b.value = Math.log10(b); } draw(); });
["f", "b"].forEach(i => E[i].addEventListener("input", () => { E.gpu.value = "own"; draw(); }));
["n", "by", "meas"].forEach(i => E[i].addEventListener("input", draw));
function draw(){
  const F = Math.pow(10, +E.f.value), B = Math.pow(10, +E.b.value), n = Math.max(1, +E.n.value || 1), by = +E.by.value;
  document.getElementById("fv").textContent = fmt(F, F < 100 ? 1 : 0); document.getElementById("bv").textContent = fmt(B, 2);
  const Is = F / B, Imm = 2 * n * n * n / (by * 3 * n * n), Pmm = Math.min(F, B * Imm);
  svg.innerHTML = "";
  const L = 60, R = 620, T = 20, Bt = 290, xl = -1, xh = 4, yl = -2, yh = 3.3;
  const X = i => L + (R - L) * (Math.log10(i) - xl) / (xh - xl), Y = p => Bt - (Bt - T) * (Math.log10(p) - yl) / (yh - yl);
  el("rect", {x: L, y: T, width: R - L, height: Bt - T, fill: "none", stroke: css("--grid")});
  for (let e = xl; e <= xh; e++){ el("line", {x1: X(10 ** e), x2: X(10 ** e), y1: T, y2: Bt, stroke: css("--grid"), "stroke-dasharray": "2 3"});
    el("text", {x: X(10 ** e), y: Bt + 15, "text-anchor": "middle", "font-size": 11}, String(10 ** e).replace(".", ",")); }
  for (let e = -2; e <= 3; e++){ el("line", {x1: L, x2: R, y1: Y(10 ** e), y2: Y(10 ** e), stroke: css("--grid"), "stroke-dasharray": "2 3"});
    el("text", {x: L - 5, y: Y(10 ** e) + 4, "text-anchor": "end", "font-size": 11}, String(10 ** e).replace(".", ",")); }
  el("text", {x: (L + R) / 2, y: Bt + 32, "text-anchor": "middle", "font-size": 12}, "aritmetikai intenzitás I [FLOP/bájt]");
  el("text", {x: 14, y: (T + Bt) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + Bt) / 2})`}, "TFLOP/s");
  let d = ""; for (let k = 0; k <= 200; k++){ const i = 10 ** (xl + (xh - xl) * k / 200); const p = Math.min(F, B * i); d += (k ? "L" : "M") + X(i).toFixed(1) + " " + Math.max(T, Y(p)).toFixed(1); }
  el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 3});
  if (Is >= 0.1 && Is <= 1e4){ el("line", {x1: X(Is), x2: X(Is), y1: T, y2: Bt, stroke: css("--muted"), "stroke-dasharray": "6 4"});
    el("text", {x: X(Is) + 4, y: Bt - 8, "font-size": 11, fill: css("--muted")}, "I* = " + fmt(Is, 0)); }
  const pts = [["ReLU FP16", 0.25, "tri"], ["ReLU FP32", 0.125, "tri"], [`matmul n=${n}`, Imm, "circ"]];
  pts.forEach(([lab, i, sh]) => { if (i < 0.1 || i > 1e4) return; const p = Math.min(F, B * i), x = X(i), y = Y(p);
    if (sh === "tri") el("path", {d: `M${x} ${y - 7}L${x + 6} ${y + 5}L${x - 6} ${y + 5}Z`, fill: css("--hl2"), stroke: css("--fg")});
    else el("circle", {cx: x, cy: y, r: 6, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
    el("text", {x: x + 8, y: y + (sh === "tri" ? 18 : 16), "font-size": 11}, lab); });
  const m = Number(String(E.meas.value).replace(",", "."));
  let extra = "";
  if (E.meas.value.trim() && isFinite(m) && m > 0){ const x = X(Math.min(1e4, Math.max(0.1, Imm)));
    el("rect", {x: x - 6, y: Y(m) - 6, width: 12, height: 12, fill: css("--hl"), stroke: css("--fg")});
    el("text", {x: x - 8, y: Y(m) + 4, "text-anchor": "end", "font-size": 11, fill: css("--hl")}, "mért");
    extra = ` Mért ${fmt(m, 1)} TFLOP/s → a tető ${fmt(100 * m / Pmm, 1)}%-a.`; }
  status.textContent = `I* = F/B = ${fmt(Is, 0)} FLOP/bájt. matmul n = ${n}: I = 2n³/(${by}·3n²) ≈ ${fmt(Imm, 1)} FLOP/bájt → ` +
    `${Imm >= Is ? "compute-bound" : "memory-bound"}, felső korlát ${fmt(Pmm, 1)} TFLOP/s. ReLU FP16 (I = 0,25): ≤ ${fmt(Math.min(F, B * 0.25), 2)} TFLOP/s.` + extra;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
E.f.value = Math.log10(312); E.b.value = Math.log10(2);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
