<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sűrűség és valószínűség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="s">σ =</label><input id="s" type="range" min="0.1" max="3" step="0.05" value="1" aria-label="Szórás">
<b id="sv">1,00</b>
<label for="a">a =</label><input id="a" type="range" min="-4" max="4" step="0.01" value="-0.5" aria-label="Az intervallum bal határa">
<label for="b">b =</label><input id="b" type="range" min="-4" max="4" step="0.01" value="0.5" aria-label="Az intervallum jobb határa">
<button id="shrink">Intervallum zsugorítása 0-ra</button><button id="reset">Alaphelyzet</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Harang alakú sűrűséggörbe húzható a és b határral, a köztük lévő terület kiemelve; mellette S alakú eloszlásfüggvény, a két érték különbségével"></svg>

<p class="small">Számított, nem mérés: normális eloszlás, várható érték 0, szórás σ. A valószínűség a sűrűség alatti terület, illetve F(b) − F(a); az f(0) magasság csak sűrűség (valószínűség per egységnyi hossz). A „zsugorítás” gombbal b − a → 0: a valószínűség 0-hoz tart, f(0) nem változik.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

// erf: |x| < 3-ra Taylor-sor, fölötte lánctört az erfc-re (≈ 1e-12 pontos)
function erf(x){ const s = Math.sign(x); x = Math.abs(x);
  if (x < 3){ let sum = x, term = x, n = 0; while (Math.abs(term) > 1e-17 * Math.abs(sum)){ n++; term *= -x * x / n; sum += term / (2 * n + 1); if (n > 200) break; }
    return s * 2 / Math.sqrt(Math.PI) * sum; }
  // lánctört az erfc-re
  let f = 0; for (let k = 60; k >= 1; k--) f = k / 2 / (x + f);
  return s * (1 - Math.exp(-x * x) / Math.sqrt(Math.PI) / (x + f)); }
let sg = 1, A = -0.5, Bv = 0.5, timer = null, drag = null;
const pdf = (x, s) => Math.exp(-0.5 * (x / s) ** 2) / (s * Math.sqrt(2 * Math.PI));
const cdf = (x, s) => 0.5 * (1 + erf(x / (s * Math.SQRT2)));
const L1 = 40, R1 = 310, L2 = 360, R2 = 630, T = 30, B = 280;
const X1 = x => L1 + (R1 - L1) * (x + 4) / 8, X2 = x => L2 + (R2 - L2) * (x + 4) / 8;
function draw(){
  svg.innerHTML = "";
  const ymax = Math.max(0.5, pdf(0, sg) * 1.15), Y1 = v => B - (B - T) * v / ymax, Y2 = v => B - (B - T) * v;
  [[L1, R1, "(a) sűrűség, P = terület"], [L2, R2, "(b) eloszlásfüggvény F(x)"]].forEach(([l, r, t]) => {
    el("line", {x1: l, y1: B, x2: r, y2: B, stroke: css("--fg")}); el("line", {x1: l, y1: B, x2: l, y2: T, stroke: css("--fg")});
    el("text", {x: l, y: 18, "font-size": 13}, t);
    for (let v = -4; v <= 4; v += 2) el("text", {x: l + (r - l) * (v + 4) / 8, y: B + 15, "text-anchor": "middle", "font-size": 11}, fmt(v, 0)); });
  const yt = ymax > 2 ? 1 : 0.1;
  for (let v = 0; v <= ymax + 1e-9; v += yt) el("text", {x: L1 - 4, y: Y1(v) + 4, "text-anchor": "end", "font-size": 10}, fmt(v, yt < 1 ? 1 : 0));
  for (let v = 0; v <= 1.001; v += 0.25) el("text", {x: L2 - 4, y: Y2(v) + 4, "text-anchor": "end", "font-size": 10}, fmt(v, 2));
  const a = Math.min(A, Bv), b = Math.max(A, Bv);
  let d = `M${X1(a)} ${B}`; for (let i = 0; i <= 120; i++){ const x = a + (b - a) * i / 120; d += `L${X1(x).toFixed(1)} ${Y1(pdf(x, sg)).toFixed(1)}`; } d += `L${X1(b)} ${B}Z`;
  el("path", {d, fill: css("--fill2"), stroke: "none"});
  let c = "", e = ""; for (let i = 0; i <= 400; i++){ const x = -4 + 8 * i / 400;
    c += (i ? "L" : "M") + X1(x).toFixed(1) + " " + Y1(pdf(x, sg)).toFixed(1); e += (i ? "L" : "M") + X2(x).toFixed(1) + " " + Y2(cdf(x, sg)).toFixed(1); }
  el("path", {d: c, fill: "none", stroke: css("--fg"), "stroke-width": 2}); el("path", {d: e, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("line", {x1: X1(0), y1: B, x2: X1(0), y2: Y1(pdf(0, sg)), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "6 3"});
  el("text", {x: X1(0) + 6, y: Y1(pdf(0, sg)) + 2, "font-size": 12, fill: css("--hl")}, "f(0) = " + fmt(pdf(0, sg), 4));
  [["a", a], ["b", b]].forEach(([n, v]) => { const g = el("g", {class: "drag"});
    el("line", {x1: X1(v), y1: B, x2: X1(v), y2: T + 10, stroke: css("--hl2"), "stroke-width": 2}, undefined, g);
    el("rect", {x: X1(v) - 8, y: T + 10, width: 16, height: B - T - 10, fill: "transparent"}, undefined, g);
    el("text", {x: X1(v), y: T + 6, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, n, g);
    g.addEventListener("pointerdown", ev => { drag = n; ev.preventDefault(); });
    [Y2(cdf(v, sg))].forEach(yy => { el("line", {x1: L2, y1: yy, x2: X2(v), y2: yy, stroke: css("--muted"), "stroke-dasharray": "2 3"});
      el("line", {x1: X2(v), y1: B, x2: X2(v), y2: yy, stroke: css("--muted"), "stroke-dasharray": "2 3"});
      el("text", {x: L2 + 4, y: yy - 4, "font-size": 11}, `F(${fmt(v, 2)}) = ${fmt(cdf(v, sg), 4)}`); }); });
  const xb = X2(Math.min(3.2, b + 1.2));
  el("line", {x1: xb, y1: Y2(cdf(a, sg)), x2: xb, y2: Y2(cdf(b, sg)), stroke: css("--hl2"), "stroke-width": 3});
  el("text", {x: xb + 5, y: (Y2(cdf(a, sg)) + Y2(cdf(b, sg))) / 2 + 4, "font-size": 12, fill: css("--hl2")}, fmt(cdf(b, sg) - cdf(a, sg), 4));
  const Pab = cdf(b, sg) - cdf(a, sg);
  status.textContent = `σ = ${fmt(sg, 2)}: f(0) = ${fmt(pdf(0, sg), 4)}, P(${fmt(a, 2)} ≤ X ≤ ${fmt(b, 2)}) = ${fmt(Pab, 4)}, F(b) − F(a) = ${fmt(Pab, 4)}` +
    (pdf(0, sg) > 1 ? " – a sűrűség 1-nél nagyobb, mégsem valószínűség." : ".");
  document.getElementById("a").value = A; document.getElementById("b").value = Bv; document.getElementById("sv").textContent = fmt(sg, 2);
}
svg.addEventListener("pointermove", ev => { if (!drag) return; const q = svgPt(ev); const v = Math.max(-4, Math.min(4, (q.x - L1) / (R1 - L1) * 8 - 4));
  if (drag === "a") A = v; else Bv = v; draw(); });
window.addEventListener("pointerup", () => { drag = null; });
function stop(){ if (timer){ clearInterval(timer); timer = null; } }
document.getElementById("s").oninput = e => { sg = +e.target.value; draw(); };
document.getElementById("a").oninput = e => { stop(); A = +e.target.value; draw(); };
document.getElementById("b").oninput = e => { stop(); Bv = +e.target.value; draw(); };
document.getElementById("shrink").onclick = () => { stop(); let w = Math.max(Math.abs(A), Math.abs(Bv), 0.5);
  timer = setInterval(() => { w *= 0.85; if (w < 1e-3){ w = 0; stop(); } A = -w; Bv = w; draw(); }, 80); };
document.getElementById("reset").onclick = () => { stop(); sg = 1; A = -0.5; Bv = 0.5; document.getElementById("s").value = 1; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
