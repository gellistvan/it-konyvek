<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétirányú InfoNCE</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>τ = <span id="tv">0,10</span> <input id="tau" type="range" min="0.01" max="1" step="0.01" value="0.1" aria-label="hőmérséklet τ"></label><label>mátrix: <select id="mat"><option value="ex" selected>példa (B = 4)</option><option value="uni">egyenletes, minden cos = 0 (B = 4)</option><option value="r8">véletlen (B = 8, rögzített seed)</option></select></label><span id="info" class="small">Kattints egy cellára.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4 × 4 hasonlósági mátrix, a főátlóban a pozitív párok; a veszteség a sorok és oszlopok szerinti softmax diagonális elemeinek negatív logaritmusából áll."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított: a 24.1.3 clip_loss függvényének átirata (F.cross_entropy = átlagos −log softmax a helyes indexen). A véletlen B = 8 mátrix rögzített seedű szemléltetés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "cos", "k": -1, "line": 0, "msg": "1. Koszinusz-mátrix (4 × 4): sor = kép, oszlop = szöveg; a főátló a pozitív pár."}, {"ph": "S", "k": -1, "line": 1, "msg": "2. Osztás τ-val: S = cos / 0,10; a főátló: 8,00; 7,00; 6,00; 7,50"}, {"ph": "row", "k": 0, "line": 3, "msg": "3. Sor-softmax, kép 1: p = 0,996 a helyes szövegre, −log p = 0,004"}, {"ph": "row", "k": 1, "line": 3, "msg": "3. Sor-softmax, kép 2: p = 0,977 a helyes szövegre, −log p = 0,023"}, {"ph": "row", "k": 2, "line": 3, "msg": "3. Sor-softmax, kép 3: p = 0,961 a helyes szövegre, −log p = 0,040"}, {"ph": "row", "k": 3, "line": 3, "msg": "3. Sor-softmax, kép 4: p = 0,994 a helyes szövegre, −log p = 0,006"}, {"ph": "col", "k": 0, "line": 4, "msg": "4. Oszlop-softmax (logits.t()), szöveg 1: p = 0,997 a helyes képre, −log p = 0,003"}, {"ph": "col", "k": 1, "line": 4, "msg": "4. Oszlop-softmax (logits.t()), szöveg 2: p = 0,985 a helyes képre, −log p = 0,015"}, {"ph": "col", "k": 2, "line": 4, "msg": "4. Oszlop-softmax (logits.t()), szöveg 3: p = 0,933 a helyes képre, −log p = 0,070"}, {"ph": "col", "k": 3, "line": 4, "msg": "4. Oszlop-softmax (logits.t()), szöveg 4: p = 0,994 a helyes képre, −log p = 0,006"}, {"ph": "sum", "k": -1, "line": 5, "msg": "5. L_kép→szöveg = 0,018, L_szöveg→kép = 0,023, L = (0,018 + 0,023) / 2 = 0,021"}];
const CODE = ["def clip_loss(logits):", "    B = logits.size(0)", "    labels = torch.arange(B, device=logits.device)", "    loss_img2txt = F.cross_entropy(logits, labels)", "    loss_txt2img = F.cross_entropy(logits.t(), labels)", "    return (loss_img2txt + loss_txt2img) / 2.0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const EX = [[0.8, 0.1, 0.05, 0.2], [0.15, 0.7, 0.3, 0.0], [0.05, 0.25, 0.6, 0.1], [0.1, 0.05, 0.2, 0.75]];

let COSM = EX, TAU = 0.1;
function h3(x, d){ let s = x.toFixed(d); if (+s === 0) s = s.replace("-", ""); return s.replace(".", ",").replace("-", "−"); }
function lse(v){ const m = Math.max(...v); return m + Math.log(v.reduce((s, x) => s + Math.exp(x - m), 0)); }
function lossJS(C, tau){ const B = C.length, S = C.map(r => r.map(v => v / tau));
  const a = S.map((r, i) => lse(r) - r[i]);
  const b = S.map((_, j) => lse(S.map(r => r[j])) - S[j][j]);
  const la = a.reduce((s, x) => s + x, 0) / B, lb = b.reduce((s, x) => s + x, 0) / B;
  return {S: S, a: a, b: b, la: la, lb: lb, l: (la + lb) / 2}; }
function stepsJS(C, tau){ const B = C.length, R = lossJS(C, tau), out = [];
  out.push({ph: "cos", k: -1, line: 0, msg: "1. Koszinusz-mátrix (" + B + " × " + B + "): sor = kép, oszlop = szöveg; a főátló a pozitív pár."});
  out.push({ph: "S", k: -1, line: 1, msg: "2. Osztás τ-val: S = cos / " + h3(tau, 2) + "; a főátló: " + R.S.map((r, i) => h3(r[i], 2)).join("; ")});
  for (let i = 0; i < B; i++) out.push({ph: "row", k: i, line: 3, msg: "3. Sor-softmax, kép " + (i + 1) + ": p = " + h3(Math.exp(-R.a[i]), 3) + " a helyes szövegre, −log p = " + h3(R.a[i], 3)});
  for (let j = 0; j < B; j++) out.push({ph: "col", k: j, line: 4, msg: "4. Oszlop-softmax (logits.t()), szöveg " + (j + 1) + ": p = " + h3(Math.exp(-R.b[j]), 3) + " a helyes képre, −log p = " + h3(R.b[j], 3)});
  out.push({ph: "sum", k: -1, line: 5, msg: "5. L_kép→szöveg = " + h3(R.la, 3) + ", L_szöveg→kép = " + h3(R.lb, 3) + ", L = (" + h3(R.la, 3) + " + " + h3(R.lb, 3) + ") / 2 = " + h3(R.l, 3)});
  return out; }
function rnd8(){ let s = 12345; const r = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  return Array.from({length: 8}, (_, i) => Array.from({length: 8}, (_, j) => Math.round((i === j ? 0.5 + 0.4 * r() : 0.4 * r() - 0.1) * 100) / 100)); }
function render(s){
  const B = COSM.length, R = lossJS(COSM, TAU), c = B > 4 ? 40 : 62, X = 90, Y = 40;
  svg.setAttribute("viewBox", "0 0 640 " + (Y + B * c + 60));
  svg.innerHTML = "";
  const showS = s.ph !== "cos", M = showS ? R.S : COSM, mx = Math.max(...M.flat().map(Math.abs)) || 1;
  // softmax-valószínűségek az aktuális sorhoz / oszlophoz
  let P = null;
  if (s.ph === "row") { const r = R.S[s.k], z = lse(r); P = r.map(v => Math.exp(v - z)); }
  if (s.ph === "col") { const col = R.S.map(r => r[s.k]), z = lse(col); P = col.map(v => Math.exp(v - z)); }
  for (let i = 0; i < B; i++) for (let j = 0; j < B; j++) {
    const v = M[i][j], g = Math.round(255 - 150 * Math.abs(v) / mx);
    const act = (s.ph === "row" && i === s.k) || (s.ph === "col" && j === s.k);
    const r = el("rect", {x: X + j * c, y: Y + i * c, width: c, height: c, fill: "rgb(" + g + "," + g + "," + g + ")", stroke: act ? css("--hl2") : "#000", "stroke-width": act ? 2.5 : 0.6, style: "cursor:pointer"});
    r.addEventListener("click", () => { document.getElementById("info").textContent = "S[" + (i + 1) + "," + (j + 1) + "] = cos/τ = " + h3(COSM[i][j], 2) + " / " + h3(TAU, 2) + " = " + h3(R.S[i][j], 2) + (i === j ? " (pozitív pár)" : ""); });
    el("text", {x: X + j * c + c / 2, y: Y + i * c + c / 2 + 5, "text-anchor": "middle", "font-size": B > 4 ? 10 : 13, fill: g < 140 ? "#fff" : "#000", "pointer-events": "none"}, h3(v, showS ? 1 : 2));
  }
  for (let i = 0; i < B; i++) el("rect", {x: X + i * c, y: Y + i * c, width: c, height: c, fill: "none", stroke: css("--fg"), "stroke-width": 3.2, "pointer-events": "none"});
  for (let i = 0; i < B; i++) { el("text", {x: X - 6, y: Y + i * c + c / 2 + 4, "text-anchor": "end", "font-size": 11}, "kép " + (i + 1));
    el("text", {x: X + i * c + c / 2, y: Y - 6, "text-anchor": "middle", "font-size": 11}, "sz. " + (i + 1)); }
  el("text", {x: X, y: 16, "font-size": 12, "font-weight": "bold"}, showS ? "S = cos / τ, τ = " + h3(TAU, 2) : "cos-mátrix");
  const PX = X + B * c + 40, BW = Math.max(60, 640 - PX - 150);
  if (P) { el("text", {x: PX, y: Y - 6, "font-size": 12}, s.ph === "row" ? "softmax a " + (s.k + 1) + ". sorban" : "softmax a " + (s.k + 1) + ". oszlopban");
    P.forEach((p, q) => { const yy = Y + q * c + c / 2;
      el("rect", {x: PX, y: yy - 8, width: Math.max(1, p * BW), height: 16, fill: q === s.k ? css("--hl2") : css("--cellhl"), stroke: css("--line"), "stroke-width": 0.6});
      el("text", {x: PX + Math.max(1, p * BW) + 6, y: yy + 5, "font-size": 11}, h3(p, 3) + (q === s.k ? "  −log = " + h3(-Math.log(p), 3) : "")); }); }
  if (s.ph === "sum") { const t = [["kép→szöveg", R.a, R.la], ["szöveg→kép", R.b, R.lb]];
    t.forEach((q, n) => { el("text", {x: PX, y: Y + n * 70, "font-size": 12, "font-weight": "bold"}, q[0] + ": L = " + h3(q[2], 3));
      el("text", {x: PX, y: Y + n * 70 + 18, "font-size": 11}, "−log p_ii: " + q[1].map(v => h3(v, 3)).join("; ")); });
    el("text", {x: PX, y: Y + 150, "font-size": 13, "font-weight": "bold"}, "L = " + h3(R.l, 3)); }
}
function rebuild(){ TAU = +document.getElementById("tau").value; document.getElementById("tv").textContent = h3(TAU, 2);
  const m = document.getElementById("mat").value;
  COSM = m === "ex" ? EX : m === "uni" ? EX.map(r => r.map(() => 0)) : rnd8();
  const cur = k; setSteps(stepsJS(COSM, TAU)); show(Math.min(cur, STEPS.length - 1)); }
document.getElementById("tau").addEventListener("input", rebuild);
document.getElementById("mat").addEventListener("change", rebuild);
document.body.dataset.selfcheck = JSON.stringify(stepsJS(EX, 0.1)) === JSON.stringify(STEPS) ? "OK" : "ELTÉRÉS";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
