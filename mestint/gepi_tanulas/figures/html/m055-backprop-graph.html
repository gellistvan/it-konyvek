<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backprop számítási gráf lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="nums" type="checkbox"> számokkal (a labor seed = 42 mátrixai)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Számítási gráf X-től L-ig; alatta a gradiensek visszafelé, mindegyik mellett az alak és a felhasznált forward-érték"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 15.3.8 labor XOR-hálója (N = 4, d = 2, h = 4, C = 1). Folytonos: forward, szaggatott: backward, pontozott: felhasznált cache-elt érték. A számok a labor kódjával, default_rng(42) inicializálással számítva (a gradienseket központi differencia ellenőrzi); számított érték, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiindulás: X (4×2), Y (4×1), W1 (4×2), b1 (4,), W2 (1×4), b2 (1,) – default_rng(42) inicializálás.", "on": ["X", "P1", "P2"], "line": -1, "num": [["W1", ["  0,152  −0,520", "  0,375   0,470", " −0,976  −0,651", "  0,064  −0,158"]], ["W2", [" −0,008  −0,427   0,440   0,389"]]]}, {"msg": "Forward 1: Z1 = X W1ᵀ + b1, alak (4, 2)·(2, 4) → (4, 4); cache: X, Z1.", "on": ["X", "P1", "Z1"], "line": 0, "num": [["Z1", ["  0,000   0,000   0,000   0,000", " −0,520   0,470  −0,651  −0,158", "  0,152   0,375  −0,976   0,064", " −0,368   0,846  −1,627  −0,094"]]]}, {"msg": "Forward 2: H = tanh(Z1), elemenként, (4, 4); cache: H.", "on": ["Z1", "H"], "line": 1, "num": [["H", ["  0,000   0,000   0,000   0,000", " −0,478   0,438  −0,572  −0,157", "  0,151   0,359  −0,751   0,064", " −0,352   0,689  −0,926  −0,094"]]]}, {"msg": "Forward 3: Z2 = H W2ᵀ + b2, (4, 4)·(4, 1) → (4, 1); cache: W2.", "on": ["H", "P2", "Z2"], "line": 2, "num": [["Z2", ["  0,000", " −0,496", " −0,460", " −0,734"]]]}, {"msg": "Forward 4: Ŷ = σ(Z2) (4, 1), L = BCE-átlag, skalár = 0,7514", "on": ["Z2", "L"], "line": 4, "num": [["Ŷ", ["  0,500", "  0,379", "  0,387", "  0,324"]], ["L", ["0,7514"]]]}, {"msg": "Backward 1: Δ2 = ∂L/∂Z2 = (Ŷ − Y)/N, alak (4, 1).", "on": ["L", "D2"], "line": 5, "num": [["Δ2", ["  0,125", " −0,155", " −0,153", "  0,081"]]]}, {"msg": "Backward 2: dW2 = Δ2ᵀ H → (1, 4) [cache: H]; db2 = ΣΔ2 → (1,); dH = Δ2 W2 → (4, 4) [cache: W2].", "on": ["D2", "dP2", "dH", "H", "P2"], "line": 6, "num": [["dW2 (1, 4)", ["  0,023  −0,067   0,129   0,007"]], ["db2 (1,)", [" −0,103"]]]}, {"msg": "Backward 3: dZ1 = dH ⊙ (1 − tanh²(Z1)), elemenként, (4, 4) [cache: Z1].", "on": ["dH", "dZ1", "Z1"], "line": 9, "num": [["dZ1", [" −0,001  −0,053   0,055   0,049", "  0,001   0,054  −0,046  −0,059", "  0,001   0,057  −0,029  −0,059", " −0,001  −0,018   0,005   0,031"]]]}, {"msg": "Backward 4: dW1 = dZ1ᵀ X → (4, 2) [cache: X]; db1 = ΣdZ1 → (4,). A shape-ek egyeznek a táblázattal.", "on": ["dZ1", "dP1", "X"], "line": 10, "num": [["dW1 (4, 2)", ["  0,001   0,000", "  0,039   0,035", " −0,024  −0,041", " −0,028  −0,028"]], ["db1 (4,)", ["  0,001   0,039  −0,015  −0,038"]]]}];
const CODE = ["Z1 = X @ W1.T + b1.T          # (N, h)", "H = np.tanh(Z1)               # (N, h)", "Z2 = H @ W2.T + b2.T          # (N, C)", "Y_hat = 1.0 / (1.0 + np.exp(-Z2))   # szigmoid, (N, C)", "L = -np.mean(np.sum(y * np.log(Y_hat + eps) + (1.0 - y) * np.log(1.0 - Y_hat + eps), axis=1))", "dZ2 = (Y_hat - y) / N         # (N, C)", "dW2 = dZ2.T @ H               # (C, h)", "db2 = dZ2.sum(axis=0)         # (C,)", "dH = dZ2 @ W2                 # (N, h)", "dZ1 = dH * (1.0 - np.tanh(Z1) ** 2)  # (N, h)", "dW1 = dZ1.T @ X               # (h, d)", "db1 = dZ1.sum(axis=0)         # (h,)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GEO = {"nodes": {"X": [0.0, 2.2, "e", ["X", "(4×2)"], 1.6, 1.0], "P1": [1.3, 3.75, "r", ["W1 (4×2)", "b1 (4,)"], 2.3, 1.0], "Z1": [2.6, 2.2, "e", ["Z1", "(4×4)"], 1.6, 1.0], "H": [5.0, 2.2, "e", ["H", "(4×4)"], 1.6, 1.0], "P2": [6.3, 3.75, "r", ["W2 (1×4)", "b2 (1,)"], 2.3, 1.0], "Z2": [7.6, 2.2, "e", ["Z2", "(4×1)"], 1.6, 1.0], "L": [10.4, 2.2, "e", ["L", "skalár"], 1.6, 1.0], "D2": [8.8, 0.2, "e", ["Δ2 = (Ŷ−Y)/N", "(4×1)"], 2.3, 1.0], "dH": [5.0, 0.2, "e", ["dH = Δ2·W2", "(4×4)"], 2.15, 1.0], "dZ1": [2.6, 0.2, "e", ["dZ1 = dH ⊙", "(1−tanh²Z1)", "(4×4)"], 2.2, 1.3], "dP2": [6.6, -1.45, "r", ["dW2 = Δ2ᵀH (1×4)", "db2 = ΣΔ2 (1,)"], 2.95, 1.0], "dP1": [0.6, -1.45, "r", ["dW1 = dZ1ᵀX (4×2)", "db1 = ΣdZ1 (4,)"], 2.95, 1.0]}, "edges": [["X", "Z1", "f", "lineáris"], ["P1", "Z1", "f", ""], ["Z1", "H", "f", "tanh"], ["H", "Z2", "f", "lineáris"], ["P2", "Z2", "f", ""], ["Z2", "L", "f", "σ + BCE"], ["L", "D2", "b", ""], ["D2", "dH", "b", ""], ["D2", "dP2", "b", ""], ["dH", "dZ1", "b", ""], ["dZ1", "dP1", "b", ""], ["H", "dP2", "c", ""], ["P2", "dH", "c", ""], ["Z1", "dZ1", "c", ""], ["X", "dP1", "c", ""]]};
const numBox = document.getElementById("nums");
numBox.onchange = () => show(k);
function render(s){
  svg.setAttribute("viewBox", "0 0 760 " + (numBox.checked ? 420 : 300));
  svg.innerHTML = "";
  const X = v => 30 + (v + 1) * 58, Y = v => 30 + (4.4 - v) * 40;
  const defs = el("defs", {});
  [["af", css("--fg")], ["ab", css("--hl2")]].forEach(([id, c]) => { const m = document.createElementNS(NS, "marker");
    [["id", id], ["viewBox", "0 0 10 10"], ["refX", 9], ["refY", 5], ["markerWidth", 9], ["markerHeight", 9], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0 0L10 5L0 10z"); p.setAttribute("fill", c); m.appendChild(p); defs.appendChild(m); });
  function bd(n, to){ const [x, y, sh, , w, h] = GEO.nodes[n], dx = to[0] - x, dy = to[1] - y;
    const t = sh === "e" ? 1 / Math.sqrt((dx / (w / 2)) ** 2 + (dy / (h / 2)) ** 2) : Math.min(dx ? Math.abs(w / 2 / dx) : 9, dy ? Math.abs(h / 2 / dy) : 9);
    return [x + dx * t, y + dy * t]; }
  GEO.edges.forEach(([a, b, st, lab]) => { const p0 = bd(a, GEO.nodes[b]), p1 = bd(b, GEO.nodes[a]);
    const on = s.on.includes(a) && s.on.includes(b);
    const at = {x1: X(p0[0]), y1: Y(p0[1]), x2: X(p1[0]), y2: Y(p1[1]), "stroke-width": on ? 3 : 1.5};
    if (st === "f") Object.assign(at, {stroke: css("--fg"), "marker-end": "url(#af)"});
    else if (st === "b") Object.assign(at, {stroke: css("--hl2"), "stroke-dasharray": "7 4", "marker-end": "url(#ab)"});
    else Object.assign(at, {stroke: css("--hl"), "stroke-dasharray": "2 4"});
    el("line", at);
    if (lab) el("text", {x: (X(p0[0]) + X(p1[0])) / 2, y: (Y(p0[1]) + Y(p1[1])) / 2 + 16, "font-size": 11, "text-anchor": "middle"}, lab); });
  for (const n in GEO.nodes){ const [x, y, sh, lines, w, h] = GEO.nodes[n], on = s.on.includes(n), bwd = ["D2", "dH", "dZ1", "dP1", "dP2"].includes(n);
    const at = {fill: on ? css("--cellhl") : css("--cell"), stroke: bwd ? css("--hl2") : css("--line"), "stroke-width": on ? 3.2 : 1.3};
    if (sh === "e") el("ellipse", Object.assign({cx: X(x), cy: Y(y), rx: w * 30, ry: h * 20}, at));
    else el("rect", Object.assign({x: X(x - w / 2), y: Y(y + h / 2), width: w * 60, height: h * 40, rx: 6}, at));
    lines.forEach((t, i) => el("text", {x: X(x), y: Y(y) + (i - (lines.length - 1) / 2) * 14 + 4, "font-size": 12, "text-anchor": "middle", "font-weight": on ? "bold" : "normal"}, t)); }
  el("text", {x: 6, y: Y(3.0), "font-size": 12, "font-weight": "bold"}, "forward");
  el("text", {x: 6, y: Y(0.75), "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "backward");
  if (numBox.checked){ let x0 = 20, y0 = 320;
    el("text", {x: x0, y: y0 - 8, "font-size": 12, fill: css("--muted")}, "Számított értékek (default_rng(42), nem mérés):");
    s.num.forEach(([name, rows]) => { el("text", {x: x0, y: y0 + 10, "font-size": 12, "font-weight": "bold"}, name);
      rows.forEach((r, i) => el("text", {x: x0, y: y0 + 26 + i * 15, "font-size": 12, "font-family": "ui-monospace,monospace", "xml:space": "preserve", style: "white-space:pre"}, r));
      x0 += Math.max(140, rows[0].length * 7.6 + 20); }); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
