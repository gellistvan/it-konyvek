<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impurity-mértékek és gain</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Gyerekcsomópontok">
<label for="pl">p<sub>L</sub></label><input id="pl" type="range" min="0" max="1" step="0.01" value="0.55"><b id="plv"></b>
<label for="pr">p<sub>R</sub></label><input id="pr" type="range" min="0" max="1" step="0.01" value="0.85"><b id="prv"></b>
<button id="reset">Alaphelyzet</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 345" role="img" aria-label="A Gini, az entrópia és a misclassification error görbéje; két csúszkával állítható gyerekarányok, a húr és a gain függőleges szakaszként"></svg>

<p class="small">Számított görbék; egyenlő súlyú gyerekek, a szülő aránya a két gyerekarány átlaga. Gain = impurity(szülő) − a gyerekek átlagos impurityje (a görbe és a húr különbsége).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const gini = p => 2 * p * (1 - p), mis = p => 1 - Math.max(p, 1 - p);
const ent = p => (p <= 0 || p >= 1) ? 0 : -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p));
let pl = 0.55, pr = 0.85;
const X = v => 60 + v * 560, Yv = v => 300 - v * 260;
function draw(){
  svg.innerHTML = "";
  el("rect", {x: 60, y: 40, width: 560, height: 260, fill: "none", stroke: css("--grid")});
  [0, 0.25, 0.5, 0.75, 1].forEach(v => { el("text", {x: X(v), y: 318, "text-anchor": "middle", "font-size": 12}, fmt(v, 2));
    el("text", {x: 52, y: Yv(v) + 4, "text-anchor": "end", "font-size": 12}, fmt(v, 2)); });
  const curves = [[gini, css("--fg"), "", 2.4], [ent, css("--hl"), "7 4", 2], [p => ent(p) / 2, css("--hl"), "3 3", 1], [mis, css("--fg"), "2 4", 2.4]];
  curves.forEach(([f, c, da, w]) => { let d = ""; for (let i = 0; i <= 200; i++){ const p = i / 200; d += (i ? "L" : "M") + X(p).toFixed(1) + " " + Yv(f(p)).toFixed(1); }
    el("path", {d, fill: "none", stroke: c, "stroke-width": w, "stroke-dasharray": da}); });
  const pm = (pl + pr) / 2;
  el("line", {x1: X(pl), y1: 40, x2: X(pl), y2: 300, stroke: css("--grid")}); el("line", {x1: X(pr), y1: 40, x2: X(pr), y2: 300, stroke: css("--grid")});
  el("line", {x1: X(pm), y1: 40, x2: X(pm), y2: 300, stroke: css("--hl2"), "stroke-dasharray": "4 3"});
  [[gini, "Gini"], [ent, "H"], [mis, "ME"]].forEach(([f, n]) => {
    el("line", {x1: X(pl), y1: Yv(f(pl)), x2: X(pr), y2: Yv(f(pr)), stroke: css("--hl2"), "stroke-width": 1.6});
    const hc = (f(pl) + f(pr)) / 2;
    el("line", {x1: X(pm), y1: Yv(f(pm)), x2: X(pm), y2: Yv(hc), stroke: css("--hl2"), "stroke-width": 4});
    el("circle", {cx: X(pm), cy: Yv(f(pm)), r: 4, fill: css("--fg")});
    el("circle", {cx: X(pm), cy: Yv(hc), r: 4, fill: css("--hl2")}); });
  el("text", {x: 60, y: 14, "font-size": 12}, "— Gini   - - entrópia (bit)   · · H/2   ⋯ misclassification   narancs: húr és gain");
  el("text", {x: X(pm), y: 34, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "szülő p = " + fmt(pm, 3));
  el("text", {x: 340, y: 336, "text-anchor": "middle", "font-size": 12}, "p (pozitív arány)");
  const g = f => f(pm) - (f(pl) + f(pr)) / 2;
  status.textContent = `p_L = ${fmt(pl, 2)}, p_R = ${fmt(pr, 2)}, szülő p = ${fmt(pm, 3)} (egyenlő súlyok). Gain – Gini: ${fmt(g(gini), 3)}; ` +
    `entrópia: ${fmt(g(ent), 3)} bit; misclassification: ${fmt(g(mis), 3)}` + (Math.abs(g(mis)) < 1e-12 ? " (a két gyerek a többségi osztály ugyanazon oldalán van)." : ".");
  document.getElementById("plv").textContent = fmt(pl, 2); document.getElementById("prv").textContent = fmt(pr, 2);
}
document.getElementById("pl").oninput = e => { pl = +e.target.value; draw(); };
document.getElementById("pr").oninput = e => { pr = +e.target.value; draw(); };
document.getElementById("reset").onclick = () => { pl = 0.55; pr = 0.85; document.getElementById("pl").value = pl; document.getElementById("pr").value = pr; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
