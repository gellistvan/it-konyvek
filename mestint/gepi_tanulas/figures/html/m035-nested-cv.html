<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beágyazott keresztvalidáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Sávdiagram a tanító–teszt felosztásról, öt külső fold sorral és egy kibontott külső foldon belüli három belső folddal, mellette folyamatábra a belső keresésről, a külső kiértékelésről és a külön végső modellről."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 10.3.5 kódjának futtatása (load_breast_cancer, 80/20 split random_state=42, scikit-learn 1.9.1): a foldonkénti legjobb paraméterek és AUC-k mért értékek. A sávok sematikusan egymás mellett; a StratifiedKFold valójában kevert indexeket ad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "k": -1, "fits": 0, "line": 3, "msg": "1) A teszthalmaz (114) leválasztása: a nested CV egyik lépésben sem látja.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 2, "k": 0, "fits": 0, "line": 4, "msg": "2) 1. külső fold: 364 külső tanító, 91 külső validációs (teszt szerep).", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 3, "k": 0, "fits": 0, "line": 8, "msg": "3) A 364 külső tanítóminta 3 belső foldra oszlik (≈243 tanító / ≈121 validációs).", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 4, "k": 0, "fits": 108, "line": 9, "msg": "4) Belső keresés: 36 jelölt × 3 belső fold = 108 illesztés (csak a 364 mintán).", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 5, "k": 0, "fits": 108, "line": 9, "msg": "5) Legjobb λ₁: n_estimators=200, max_depth=5, min_samples_split=2 (belső AUC 0,9911).", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 6, "k": 0, "fits": 109, "line": 10, "msg": "6) Refit a 364 külső tanítón, majd AUC₁ = 0,9892 a 91 külső validációs mintán.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 7, "k": 1, "fits": 218, "line": 10, "msg": "7) 2. külső fold: 108 belső illesztés + refit; legjobb λ: n_estimators=100, max_depth=None, min_samples_split=2; AUC_2 = 0,9979.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 7, "k": 2, "fits": 327, "line": 10, "msg": "7) 3. külső fold: 108 belső illesztés + refit; legjobb λ: n_estimators=50, max_depth=None, min_samples_split=2; AUC_3 = 0,9879.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 7, "k": 3, "fits": 436, "line": 10, "msg": "7) 4. külső fold: 108 belső illesztés + refit; legjobb λ: n_estimators=200, max_depth=None, min_samples_split=2; AUC_4 = 0,9750.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 7, "k": 4, "fits": 545, "line": 10, "msg": "7) 5. külső fold: 108 belső illesztés + refit; legjobb λ: n_estimators=50, max_depth=5, min_samples_split=5; AUC_5 = 1,0000.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}, {"ph": 8, "k": 5, "fits": 545, "line": 11, "msg": "8) Nested becslés: az 5 külső AUC átlaga 0,990 ± 0,009 (545 illesztés). A végső modell külön ág: GridSearchCV a teljes 455 tanítón, majd egyszeri teszt a 114 mintán.", "aucs": [0.9892, 0.9979, 0.9879, 0.975, 1.0]}];
const CODE = ["outer_cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)", "inner_cv = StratifiedKFold(n_splits=3, shuffle=True, random_state=42)", "outer_scores = []", "# A nested CV a tanító részen (X_train, y_train) fut; az X_test érintetlen marad.", "for tr_idx, va_idx in outer_cv.split(X_train, y_train):", "    X_tr, X_va = X_train[tr_idx], X_train[va_idx]", "    y_tr, y_va = y_train[tr_idx], y_train[va_idx]", "    search = GridSearchCV(RandomForestClassifier(random_state=42),", "                          param_grid, cv=inner_cv, scoring=\"roc_auc\")", "    search.fit(X_tr, y_tr)          # 36 × 3 belső illesztés + 1 refit", "    outer_scores.append(search.score(X_va, y_va))", "print(f\"Nested CV AUC: {np.mean(outer_scores):.4f} (szórás: {np.std(outer_scores):.4f})\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return v.toFixed(d).replace(".", ","); }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 360"); svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2"), cell = css("--cell"), chl = css("--cellhl");
  const X0 = 90, sc = 0.7;
  function bar(x, y, n, fill, txt, extra){ const r = el("rect", Object.assign({x: x, y: y, width: n * sc, height: 22, fill: fill, stroke: fg, "stroke-width": 1}, extra || {}));
    if (txt) el("text", {x: x + n * sc / 2, y: y + 15, "text-anchor": "middle", "font-size": 12, fill: fill === fg ? css("--bg") : fg}, txt); return r; }
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="pdt" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${fg}"/></pattern><pattern id="pdg" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.2"/></pattern>`;
  el("text", {x: X0 - 8, y: 30, "text-anchor": "end", "font-size": 12}, "adat");
  bar(X0, 15, 455, cell, "tanító 455"); bar(X0 + 455 * sc, 15, 114, "url(#pdt)", "", {}); el("text", {x: X0 + 455 * sc + 57 * sc, y: 52, "text-anchor": "middle", "font-size": 11}, "teszt 114 (érintetlen)");
  if (s.ph >= 2) for (let k = 0; k < 5; k++) {
    const y = 62 + k * 28, act = (k === s.k) || s.ph === 8 || (s.ph >= 7 && k < s.k);
    el("text", {x: X0 - 8, y: y + 15, "text-anchor": "end", "font-size": 12, "font-weight": k === s.k ? "bold" : "normal"}, "külső " + (k + 1));
    for (let j = 0; j < 5; j++) bar(X0 + j * 91 * sc, y, 91, j === k ? fg : chl, j === k ? "91" : "", {opacity: act ? 1 : 0.35});
    if (k === s.k && s.ph < 8) el("rect", {x: X0 - 3, y: y - 3, width: 455 * sc + 6, height: 28, fill: "none", stroke: hl, "stroke-width": 2.5});
    if ((s.ph >= 6 && k <= s.k) || s.ph === 8) el("text", {x: X0 + 455 * sc + 8, y: y + 15, "font-size": 12}, "AUC = " + hu(s.aucs[k], 4));
  }
  if (s.ph >= 3 && s.ph <= 7) {
    const k = Math.min(s.k, 4), sizes = [122, 121, 121];
    el("text", {x: 10, y: 222, "font-size": 12}, `a(z) ${k + 1}. külső fold tanító része (364) → belső foldok:`);
    for (let i = 0; i < 3; i++) { const y = 230 + i * 26; let x = X0;
      el("text", {x: X0 - 8, y: y + 15, "text-anchor": "end", "font-size": 12}, "belső " + (i + 1));
      sizes.forEach((n, j) => { bar(x, y, n * 364 / 364, j === i ? "url(#pdg)" : cell, j === i ? String(n) : ""); x += n * sc; }); }
  }
  // folyamat
  const boxes = [["belső keresés 36 × 3", 4], ["legjobb λ_k", 5], ["refit + külső AUC_k", 6], ["átlag: nested becslés", 8]];
  boxes.forEach(([t, ph], i) => { const y = 70 + i * 50, on = s.ph === ph || (ph === 6 && s.ph === 7);
    el("rect", {x: 545, y: y, width: 150, height: 32, rx: 6, fill: on ? chl : cell, stroke: on ? hl : fg, "stroke-width": on ? 2.5 : 1});
    el("text", {x: 620, y: y + 21, "text-anchor": "middle", "font-size": 12}, t);
    if (i < 3) el("line", {x1: 620, y1: y + 32, x2: 620, y2: y + 50, stroke: fg}); });
  el("text", {x: 620, y: 40, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, `illesztések: ${s.fits}`);
  el("text", {x: 620, y: 56, "text-anchor": "middle", "font-size": 11, fill: mu}, "végén: 5·36·3 + 5 = 545");
  if (s.ph === 8) { el("rect", {x: 545, y: 285, width: 150, height: 54, rx: 6, fill: cell, stroke: hl, "stroke-width": 2.5, "stroke-dasharray": "6 4"});
    el("text", {x: 620, y: 303, "text-anchor": "middle", "font-size": 12}, "végső modell (külön):");
    el("text", {x: 620, y: 318, "text-anchor": "middle", "font-size": 12}, "GridSearchCV a 455-ön");
    el("text", {x: 620, y: 333, "text-anchor": "middle", "font-size": 12}, "→ egyszeri teszt (114)"); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
