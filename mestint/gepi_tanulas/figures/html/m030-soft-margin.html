<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lágy margó és az α-osztályok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>

  const hx = u => HX + (u - ulo) / (uhi - ulo) * HW, hy = l => HY + HH - (l - llo) / (lhi - llo) * HH;
  el("text", {x: HX + HW / 2, y: HY - 22, "text-anchor": "middle", "font-size": 13}, "hinge loss: ℓ = max(0, 1 − y f)");
  el("line", {x1: hx(ulo), y1: hy(0), x2: hx(uhi), y2: hy(0), stroke: mu});
  el("line", {x1: hx(0), y1: hy(0), x2: hx(0), y2: hy(lhi), stroke: mu});
  el("polyline", {points: `${hx(ulo)},${hy(1 - ulo)} ${hx(1)},${hy(0)} ${hx(uhi)},${hy(0)}`.replace(/NaN/g, "0"), fill: "none", stroke: fg, "stroke-width": 2});
  el("circle", {cx: hx(1), cy: hy(0), r: 3, fill: fg});
  el("text", {x: hx(1) + 6, y: hy(0) - 8, "font-size": 12}, "töréspont: y f = 1");
  el("text", {x: hx(uhi), y: hy(0) + 30, "text-anchor": "end", "font-size": 12}, "y f →");
  [0, 1, 2, 3].forEach(l => el("text", {x: hx(ulo) - 4, y: hy(l) + 4, "text-anchor": "end", "font-size": 11}, String(l)));
  [-2, -1, 0, 1, 2, 3].forEach(u => el("text", {x: hx(u), y: hy(0) + 44, "text-anchor": "middle", "font-size": 11}, fmt(u, 0)));
  // jelmagyarázat
  const L = [["α = 0: nem SV (üres, vékony)", 0], ["0 < α < C: a margón (vastag keret)", 1], ["α = C: margón belül / hibás (teli)", 2]];
  L.forEach(([t, c], j) => { const yy = 350 + j * 20;
    el("circle", {cx: HX + 6, cy: yy - 4, r: 5, fill: c === 2 ? fg : bg, stroke: c === 0 ? mu : fg, "stroke-width": c === 1 ? 2.6 : 1});
    el("text", {x: HX + 18, y: yy, "font-size": 12}, t); });
  el("text", {x: HX, y: 330, "font-size": 12}, "▲ y = +1, ● y = −1; szakasz: ξ");
  if (sel >= 0) {
    const yf = D.y[sel] * F.f[sel], xi = Math.max(0, 1 - yf), a = F.a[sel], c = F.cl[sel];
    const u = Math.max(ulo, Math.min(uhi, yf));
    el("circle", {cx: hx(u), cy: hy(Math.min(lhi, xi)), r: 6, fill: css("--hl2"), stroke: fg});
    const caseTxt = ["(1) α = 0: margón kívül vagy a margón, ξ = 0", "(2) 0 < α < C: pontosan a margón, ξ = 0", "(3) α = C: " + (xi > 1 ? "rossz oldalon (ξ > 1)" : "margón belül (0 ≤ ξ ≤ 1)")][c];
    status.textContent = `C = ${ctxt(F.C)}, ${sel}. pont (y = ${D.y[sel] > 0 ? "+1" : "−1"}): y·f = ${fmt(yf, 3)}, ξ = max(0, 1 − y f) = ${fmt(xi, 3)}, α = ${fmt(a, 4)} → eset ${caseTxt}`;
  } else status.textContent = `C = ${ctxt(F.C)}: margó 2/‖w‖ = ${fmt(2 / Math.sqrt(ww), 2)}, támogató vektorok: ${n1} a margón, ${n2} α = C. Kattints egy pontra!`;
  document.getElementById("cv").textContent = ctxt(F.C);
}
cs.oninput = () => { ci = +cs.value; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
