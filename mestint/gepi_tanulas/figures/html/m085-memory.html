<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memóriaigény: FT, LoRA, QLoRA</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>paraméterszám: <select id="P"><option value="1">1B</option><option value="7" selected>7B</option><option value="13">13B</option><option value="65">65B</option></select></label><label><input id="ms" type="checkbox"> fp32 mesterpéldány (+4 bájt / tanított paraméter)</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 350" role="img" aria-label="Halmozott oszlopok: teljes finomhangolás 84 GB (súly 14, gradiens 14, Adam 56), LoRA kb. 14 GB, QLoRA kb. 3,5 GB; referenciavonalak 24, 48 és 80 GB-nál."></svg>

<p class="small">Számított, nem mért; aktivációk, keretrendszer-rezsi és az NF4 kvantálási konstansai nélkül; adapter = a paraméterszám 0,1%-a, 12 bájt/adapterparaméter (bf16 súly + bf16 gradiens + fp32 m, v).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const COMP = [["suly", "súly (törzs)"], ["grad", "gradiens"], ["adam", "Adam m, v (fp32)"], ["adapter", "adapter + grad. + Adam"]]; const FRAC = 0.001;
function mem(P, master){ const a = P * FRAC, m4 = master ? 4 : 0;
  return {"Teljes FT": {suly: 2 * P, grad: 2 * P, adam: (8 + m4) * P, adapter: 0},
          "LoRA": {suly: 2 * P, grad: 0, adam: 0, adapter: (12 + m4) * a},
          "QLoRA": {suly: 0.5 * P, grad: 0, adam: 0, adapter: (12 + m4) * a}}; }
function draw(){
  const P = +document.getElementById("P").value * 1e9, ms = document.getElementById("ms").checked;
  const M = mem(P, ms), names = Object.keys(M);
  const tots = names.map(n => COMP.reduce((s, c) => s + M[n][c[0]], 0) / 1e9);
  const ymax = Math.max(100, Math.max(...tots) * 1.12);
  svg.innerHTML = '<defs><pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="' + css("--cell") + '"/><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--fg") + '" stroke-width="1.3"/></pattern>' +
    '<pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="' + css("--cell") + '"/><circle cx="3" cy="3" r="1.1" fill="' + css("--fg") + '"/></pattern></defs>';
  const fills = {suly: css("--fill2"), grad: "url(#h1)", adam: "url(#h2)", adapter: css("--hl2")};
  const X0 = 70, Y0 = 20, H = 270, W = 400, ty = v => Y0 + H - v / ymax * H;
  const step = ymax > 300 ? 100 : ymax > 150 ? 50 : 20;
  for (let v = 0; v <= ymax; v += step) { el("line", {x1: X0, y1: ty(v), x2: X0 + W, y2: ty(v), stroke: css("--grid"), "stroke-width": 0.6});
    el("text", {x: X0 - 6, y: ty(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); }
  el("text", {x: 16, y: Y0 + H / 2, "text-anchor": "middle", "font-size": 12, transform: "rotate(-90 16 " + (Y0 + H / 2) + ")"}, "GB (10⁹ bájt)");
  names.forEach((n, i) => { const x = X0 + 30 + i * 130; let b = 0;
    COMP.forEach(c => { const v = M[n][c[0]] / 1e9; if (v <= 0) return;
      const h = Math.max(c[0] === "adapter" ? 2 : 0, ty(b) - ty(b + v));
      el("rect", {x: x, y: ty(b) - h, width: 80, height: h, fill: fills[c[0]], stroke: css("--line"), "stroke-width": 1}); b += v; });
    el("text", {x: x + 40, y: ty(b) - 8, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, fmt(b, b >= 50 ? 1 : 2) + " GB");
    el("text", {x: x + 40, y: Y0 + H + 18, "text-anchor": "middle", "font-size": 12}, n); });
  [24, 48, 80].forEach(g => { if (g > ymax) return; el("line", {x1: X0, y1: ty(g), x2: X0 + W, y2: ty(g), stroke: css("--hl"), "stroke-width": 1.4, "stroke-dasharray": "7 4"});
    el("text", {x: X0 + W + 4, y: ty(g) + 4, "font-size": 11, fill: css("--hl")}, g + " GB-os GPU"); });
  let lx = 20; COMP.forEach(c => { el("rect", {x: lx, y: 330, width: 14, height: 12, fill: fills[c[0]], stroke: css("--line")});
    el("text", {x: lx + 20, y: 340, "font-size": 11}, c[1]); lx += 30 + c[1].length * 6.2; });
  const q = M["QLoRA"].suly / 1e9;
  status.textContent = (P / 1e9) + "B paraméter" + (ms ? ", fp32 mesterpéldánnyal" : "") + ": teljes FT " + fmt(tots[0], 1) + " GB, LoRA ≈ " + fmt(tots[1], 2) + " GB, QLoRA ≈ " + fmt(tots[2], 2) + " GB (ebből NF4 súly " + fmt(q, 1) + " GB" + (q < 48 ? ", a 48 GB-os vonal alatt" : "") + "). Számított, aktivációk nélkül.";
}
["P", "ms"].forEach(id => document.getElementById(id).addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
