<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broadcasting szabálya</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A shape: <input id="sa" value="4,5" size="8" aria-label="az első tömb shape-je"></label> <label>B shape: <input id="sb" value="5" size="8" aria-label="a második tömb shape-je"></label> <button onclick="go()">Számol</button> <button onclick="preset('4,5', '5', 0)">(1) (N,d)−(d,)</button> <button onclick="preset('4,1', '5', 1)">(2) (N,1)+(d,)</button> <button onclick="preset('4,3', '4', 2)">(3) (N,3)+(N,)</button> <button onclick="preset('4,3', '4,1', 3)">(4) v[:, None]</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két shape jobbra igazítva; a hiányzó dimenzió 1-gyel kitöltve; az 1-es dimenzió kiterjesztése a rácson, vagy a nem kompatibilis jobb szélső pár kiemelése és a ValueError."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A NumPy broadcasting-szabálya (jobbra igazítás, hiányzó dimenzió = 1, egyenlő vagy 1-es dimenzió kompatibilis). A rajzon N = 4, d = 5. Saját shape: vesszővel elválasztva (pl. 4,3 és 4), majd „Számol”.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [4, 5], "b": [5], "ph": 1, "line": 0, "msg": "1. jobbra igazítás: (4,5) és (5,) dimenzióit a jobb szélről párosítjuk"}, {"a": [4, 5], "b": [5], "ph": 2, "line": 0, "msg": "2. a hiányzó dimenziók 1-gyel: A → (4, 5), B → (1, 5)"}, {"a": [4, 5], "b": [5], "ph": 3, "line": 0, "msg": "3. kiterjesztés: eredmény: (4, 5)"}];
const CODE = ["X - mean                 # (N,d) - (d,) -> (N,d)", "col + row                # (N,1) + (d,) -> (N,d)", "M + v                    # (N,3) + (N,) -> ValueError", "M + v[:, None]           # (N,3) + (N,1) -> (N,3)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return Number(v).toFixed(d).replace(".", ",").replace("-", "−"); }
function patterns(){
  const defs = document.createElementNS(NS, "defs"), f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<pattern id="pdense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${f}" stroke-width="1"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
}

window.addEventListener("load", () => show(2));
function parse(t){ const v = t.split(",").map(x => x.trim()).filter(x => x !== "").map(Number); return v.every(x => Number.isInteger(x) && x >= 0) && v.length ? v : null; }
function bc(a, b){ const n = Math.max(a.length, b.length), pa = Array(n - a.length).fill(1).concat(a), pb = Array(n - b.length).fill(1).concat(b);
  const res = []; let bad = -1;
  for (let i = n - 1; i >= 0; i--) { const x = pa[i], y = pb[i]; if (x === y || x === 1 || y === 1) res.unshift(Math.max(x, y)); else { bad = i; break; } }
  return {pa: pa, pb: pb, res: bad >= 0 ? null : res, bad: bad}; }
function sh(a){ return "(" + a.join(",") + (a.length === 1 ? "," : "") + ")"; }
function stepsFor(a, b, line){ const r = bc(a, b);
  return [{a: a, b: b, ph: 1, line: line, msg: `1. jobbra igazítás: ${sh(a)} és ${sh(b)} dimenzióit a jobb szélről párosítjuk`},
          {a: a, b: b, ph: 2, line: line, msg: `2. a hiányzó dimenziók 1-gyel: A → (${r.pa.join(", ")}), B → (${r.pb.join(", ")})`},
          {a: a, b: b, ph: 3, line: line, msg: r.res ? `3. kiterjesztés: eredmény: (${r.res.join(", ")})` : `3. ValueError: operands could not be broadcast together with shapes (${a.join(",")}) (${b.join(",")}${b.length === 1 ? "," : ""})`}]; }
function preset(a, b, line){ document.getElementById("sa").value = a; document.getElementById("sb").value = b; go(line); }
function go(line){ const a = parse(document.getElementById("sa").value), b = parse(document.getElementById("sb").value);
  if (!a || !b) { status.textContent = "Adj meg vesszővel elválasztott nemnegatív egészeket, pl. 4,3"; return; }
  setSteps(stepsFor(a, b, line === undefined ? -1 : line)); show(2); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 290"); patterns();
  const r = bc(s.a, s.b), n = r.pa.length, cw = 46;
  // shape-tábla
  const tx = 30, colx = i => tx + 60 + (i + (6 - n)) * cw;
  [["A", s.a, r.pa], ["B", s.b, r.pb]].forEach(([nm, o, p], row) => {
    const y = 40 + row * 34; el("text", {x: tx, y: y, "font-size": 16, "font-weight": "bold"}, nm + ":");
    p.forEach((v, i) => { const miss = i < n - o.length; if (s.ph === 1 && miss) return;
      el("text", {x: colx(i), y: y, "text-anchor": "middle", "font-size": 16, "font-family": "monospace", fill: miss ? css("--muted") : css("--fg")}, String(v)); });
  });
  el("line", {x1: tx, y1: 92, x2: colx(n - 1) + 24, y2: 92, stroke: css("--line")});
  if (s.ph === 3) {
    if (r.res) r.res.forEach((v, i) => el("text", {x: colx(i), y: 116, "text-anchor": "middle", "font-size": 16, "font-family": "monospace", "font-weight": "bold"}, String(v)));
    else { el("rect", {x: colx(r.bad) - 20, y: 18, width: 40, height: 64, fill: "none", stroke: css("--fg"), "stroke-width": 3, "stroke-dasharray": "6 3"});
      el("text", {x: colx(r.bad), y: 116, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, `${r.pa[r.bad]} ≠ ${r.pb[r.bad]}`); }
  }
  el("text", {x: tx, y: 116, "font-size": 16}, s.ph === 3 ? (r.res ? "=" : "×") : "");
  el("text", {x: tx, y: 150, "font-size": 12, fill: css("--muted")}, "← balra       a dimenziók párosítása       jobbra (utolsó tengely) →");
  // rácsok (csak 1–2 dimenzió, legfeljebb 8×8 cellánál)
  const two = x => x.length === 1 ? [1, x[0]] : x;
  if (s.a.length > 2 || s.b.length > 2 || [...s.a, ...s.b].some(v => v > 8)) { el("text", {x: 400, y: 240, "text-anchor": "middle", "font-size": 13}, "(rács csak legfeljebb 2 dimenzióra és 8 elemre)"); return; }
  const c = 20, top = 175;
  function grid(x0, shp, R, C, fill, bad){ const [r0, c0] = shp;
    for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) { const o = i < r0 && j < c0;
      el("rect", {x: x0 + j * c, y: top + i * c, width: c, height: c, fill: o ? fill : css("--bg"), stroke: css("--fg"), "stroke-width": o ? 1.2 : 0.8, "stroke-dasharray": o ? "" : "2 2"}); }
    if (bad) el("rect", {x: x0 - 4, y: top - 4, width: c0 * c + 8, height: r0 * c + 8, fill: "none", stroke: css("--fg"), "stroke-width": 3, "stroke-dasharray": "6 3"});
    return x0 + C * c; }
  const A2 = two(s.a), B2 = two(s.b), RS = r.res ? two(r.res) : null, ex = s.ph === 3 && RS;
  let x = 230;
  x = grid(x, A2, ex ? RS[0] : A2[0], ex ? RS[1] : A2[1], css("--cellhl"), false);
  el("text", {x: x + 18, y: top + 50, "text-anchor": "middle", "font-size": 22}, s.line === 0 ? "−" : "+"); x += 36;
  x = grid(x, B2, ex ? RS[0] : B2[0], ex ? RS[1] : B2[1], "url(#pdiag)", s.ph === 3 && !r.res);
  if (ex) { el("text", {x: x + 18, y: top + 50, "text-anchor": "middle", "font-size": 22}, "="); x += 36; grid(x, RS, RS[0], RS[1], css("--muted"), false); }
  el("text", {x: 30, y: top + 20, "font-size": 12}, "folytonos: eredeti cella");
  el("text", {x: 30, y: top + 38, "font-size": 12}, "pontozott: kiterjesztett másolat");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
