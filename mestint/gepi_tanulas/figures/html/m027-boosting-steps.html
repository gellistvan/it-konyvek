<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boosting négy ponton</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="eta">η =</label><input id="eta" type="range" min="0.1" max="1" step="0.05" value="0.5" aria-label="Tanulási ráta">
<b id="etav">0,5</b><span class="small">(a lépések újraszámolódnak)</span>
<script>document.getElementById("eta").addEventListener("input", e => { const v = +e.target.value;
 document.getElementById("etav").textContent = String(v).replace(".", ","); setSteps(runJS(v)); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy pont, a lépcsős F_m modell és a maradékok; alul a maradékok oszlopai és a rájuk illesztett döntési csonk; lépésenként m = 0-tól 10-ig"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított példa (8.3.2): x = 1…4, y = 2, 4, 6, 12, négyzetes veszteség, döntési csonk. η = 0,5-nél a lépések a scikit-learn 1.9.1 GradientBoostingRegressor(max_depth=1, learning_rate=0.5) staged_predict eredményével egyeznek; η = 1-nél F_1 = (4; 4; 4; 12).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "m=0: F=(6; 6; 6; 6), maradék=(−4; −2; 0; 6), MSE=14; következő csonk: vágás 3,5, levélértékek −2; 6", "line": 0, "m": 0, "F": [6.0, 6.0, 6.0, 6.0], "r": [-4.0, -2.0, 0.0, 6.0], "mse": 14.0, "t": 3.5, "a": -2.0, "b": 6.0}, {"msg": "m=1: F=(5; 5; 5; 9), maradék=(−3; −1; 1; 3), MSE=5; következő csonk: vágás 2,5, levélértékek −2; 2", "line": 3, "m": 1, "F": [5.0, 5.0, 5.0, 9.0], "r": [-3.0, -1.0, 1.0, 3.0], "mse": 5.0, "t": 2.5, "a": -2.0, "b": 2.0}, {"msg": "m=2: F=(4; 4; 6; 10), maradék=(−2; 0; 0; 2), MSE=2; következő csonk: vágás 1,5, levélértékek −2; 0,667", "line": 3, "m": 2, "F": [4.0, 4.0, 6.0, 10.0], "r": [-2.0, 0.0, 0.0, 2.0], "mse": 2.0, "t": 1.5, "a": -2.0, "b": 0.6666666666666666}, {"msg": "m=3: F=(3; 4,333; 6,333; 10,333), maradék=(−1; −0,333; −0,333; 1,667), MSE=1; következő csonk: vágás 3,5, levélértékek −0,556; 1,667", "line": 3, "m": 3, "F": [3.0, 4.333333333333333, 6.333333333333333, 10.333333333333334], "r": [-1.0, -0.33333333333333304, -0.33333333333333304, 1.666666666666666], "mse": 0.9999999999999994, "t": 3.5, "a": -0.5555555555555554, "b": 1.666666666666666}, {"msg": "m=4: F=(2,722; 4,056; 6,056; 11,167), maradék=(−0,722; −0,056; −0,056; 0,833), MSE=0,306; következő csonk: vágás 3,5, levélértékek −0,278; 0,833", "line": 3, "m": 4, "F": [2.7222222222222223, 4.055555555555555, 6.055555555555555, 11.166666666666668], "r": [-0.7222222222222223, -0.05555555555555536, -0.05555555555555536, 0.8333333333333321], "mse": 0.3055555555555551, "t": 3.5, "a": -0.2777777777777777, "b": 0.8333333333333321}, {"msg": "m=5: F=(2,583; 3,917; 5,917; 11,583), maradék=(−0,583; 0,083; 0,083; 0,417), MSE=0,132; következő csonk: vágás 1,5, levélértékek −0,583; 0,194", "line": 3, "m": 5, "F": [2.5833333333333335, 3.9166666666666665, 5.916666666666666, 11.583333333333334], "r": [-0.5833333333333335, 0.08333333333333348, 0.08333333333333393, 0.4166666666666661], "mse": 0.1319444444444444, "t": 1.5, "a": -0.5833333333333335, "b": 0.1944444444444445}, {"msg": "m=6: F=(2,292; 4,014; 6,014; 11,681), maradék=(−0,292; −0,014; −0,014; 0,319), MSE=0,047; következő csonk: vágás 3,5, levélértékek −0,106; 0,319", "line": 3, "m": 6, "F": [2.291666666666667, 4.013888888888888, 6.013888888888888, 11.680555555555555], "r": [-0.29166666666666696, -0.013888888888888395, -0.013888888888888395, 0.31944444444444464], "mse": 0.04687500000000007, "t": 3.5, "a": -0.10648148148148125, "b": 0.31944444444444464}, {"msg": "m=7: F=(2,238; 3,961; 5,961; 11,84), maradék=(−0,238; 0,039; 0,039; 0,16), MSE=0,021; következő csonk: vágás 1,5, levélértékek −0,238; 0,079", "line": 3, "m": 7, "F": [2.2384259259259265, 3.960648148148148, 5.960648148148148, 11.840277777777779], "r": [-0.23842592592592649, 0.03935185185185208, 0.03935185185185208, 0.15972222222222143], "mse": 0.021363811728395077, "t": 1.5, "a": -0.23842592592592649, "b": 0.0794753086419752}, {"msg": "m=8: F=(2,119; 4; 6; 11,88), maradék=(−0,119; −0; −0; 0,12), MSE=0,007; következő csonk: vágás 3,5, levélértékek −0,04; 0,12", "line": 3, "m": 8, "F": [2.1192129629629632, 4.000385802469135, 6.000385802469135, 11.880015432098766], "r": [-0.11921296296296324, -0.0003858024691352213, -0.0003858024691352213, 0.11998456790123413], "mse": 0.007152081189986273, "t": 3.5, "a": -0.03999485596707789, "b": 0.11998456790123413}, {"msg": "m=9: F=(2,099; 3,98; 5,98; 11,94), maradék=(−0,099; 0,02; 0,02; 0,06), MSE=0,004; következő csonk: vágás 1,5, levélértékek −0,099; 0,033", "line": 3, "m": 9, "F": [2.0992155349794244, 3.9803883744855963, 5.980388374485596, 11.940007716049383], "r": [-0.09921553497942437, 0.019611625514403652, 0.019611625514404096, 0.059992283950617065], "mse": 0.0035530070563748206, "t": 1.5, "a": -0.09921553497942437, "b": 0.03307184499314161}, {"msg": "m=10: F=(2,05; 3,997; 5,997; 11,957), maradék=(−0,05; 0,003; 0,003; 0,043), MSE=0,001; következő csonk: vágás 1,5, levélértékek −0,05; 0,017", "line": 3, "m": 10, "F": [2.049607767489712, 3.9969242969821672, 5.996924296982167, 11.956543638545954], "r": [-0.049607767489712185, 0.003075703017832776, 0.00307570301783322, 0.04345636145404619], "mse": 0.0010920764610614676, "t": 1.5, "a": -0.049607767489712185, "b": 0.016535922496570727}];
const CODE = ["F_0(x) = ȳ                                   # inicializálás", "r_i = y_i − F_{m−1}(x_i)                     # pszeudo-maradék", "h_m = csonk(x, r): vágás + levélátlagok     # fa a maradékra", "F_m = F_{m−1} + η · h_m                      # zsugorított lépés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const XS = [1, 2, 3, 4], YS = [2, 4, 6, 12];
function fmt(x, d){ let t = x.toFixed(d); if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, ""); if (t === "-0") t = "0"; return t.replace(".", ",").replace("-", "−"); }
function stumpJS(r){ let best = null; for (let q = 0; q < 3; q++){ const t = (XS[q] + XS[q + 1]) / 2;
    const L = r.filter((v, i) => XS[i] <= t), R = r.filter((v, i) => XS[i] > t), mL = L.reduce((a, b) => a + b, 0) / L.length, mR = R.reduce((a, b) => a + b, 0) / R.length;
    const imp = L.length * R.length / r.length * (mL - mR) ** 2; if (!best || imp > best[0] + 1e-12) best = [imp, t, mL, mR]; } return best.slice(1); }
function runJS(eta){ let F = [6, 6, 6, 6]; const out = []; const fv = v => "(" + v.map(x => fmt(x, 3)).join("; ") + ")";
  for (let m = 0; m <= 10; m++){ const r = YS.map((y, i) => y - F[i]); const [t, a, b] = stumpJS(r); const mse = r.reduce((s, v) => s + v * v, 0) / 4;
    out.push({m, F: F.slice(), r, mse, t, a, b, line: m === 0 ? 0 : 3,
      msg: `m=${m}: F=${fv(F)}, maradék=${fv(r)}, MSE=${fmt(mse, 3)}; következő csonk: vágás ${fmt(t, 1)}, levélértékek ${fmt(a, 3)}; ${fmt(b, 3)}`});
    F = F.map((f, i) => f + eta * (XS[i] <= t ? a : b)); }
  return out; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const px = x => 70 + (x - 0.5) * 120, py = v => 170 - v * 11, pr = v => 255 - v * 9;
  el("rect", {x: 70, y: 20, width: 480, height: 150, fill: "none", stroke: css("--muted")});
  el("rect", {x: 70, y: 190, width: 480, height: 125, fill: "none", stroke: css("--muted")});
  [0, 4, 8, 12].forEach(v => el("text", {x: 62, y: py(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)));
  [-6, 0, 6].forEach(v => el("text", {x: 62, y: pr(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 0)));
  XS.forEach((x, i) => { el("text", {x: px(x), y: 328, "text-anchor": "middle", "font-size": 12}, "x = " + x);
    el("line", {x1: px(x), y1: py(s.F[i]), x2: px(x), y2: py(YS[i]), stroke: css("--muted"), "stroke-dasharray": "2 3", "stroke-width": 1.5}); });
  const bnd = [0.5, 1.5, 2.5, 3.5, 4.5]; let d = "";
  for (let i = 0; i < 4; i++) d += (i ? "L" : "M") + px(bnd[i]) + " " + py(s.F[i]) + "L" + px(bnd[i + 1]) + " " + py(s.F[i]);
  el("path", {d, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  XS.forEach((x, i) => el("circle", {cx: px(x), cy: py(YS[i]), r: 6, fill: css("--fg")}));
  el("text", {x: 76, y: 36, "font-size": 12}, "● y   kék: F_m   pontozott: maradék   (m = " + s.m + ")");
  el("line", {x1: 70, y1: pr(0), x2: 550, y2: pr(0), stroke: css("--line")});
  XS.forEach((x, i) => el("rect", {x: px(x) - 18, y: Math.min(pr(0), pr(s.r[i])), width: 36, height: Math.abs(s.r[i]) * 9, fill: css("--cellhl"), stroke: css("--line")}));
  el("path", {d: `M${px(0.5)} ${pr(s.a)}L${px(s.t)} ${pr(s.a)}L${px(s.t)} ${pr(s.b)}L${px(4.5)} ${pr(s.b)}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "7 4"});
  el("text", {x: 76, y: 206, "font-size": 12}, "szürke: maradék r   narancs szaggatott: a következő csonk h_{m+1} (vágás " + fmt(s.t, 1) + ")");
  // MSE-mini
  el("text", {x: 560, y: 36, "font-size": 12}, "MSE");
  STEPS.forEach((q, j) => { const hh = Math.min(120, q.mse / 14 * 120); el("rect", {x: 560 + j * 7, y: 160 - hh, width: 5, height: hh, fill: j === s.m ? css("--hl2") : css("--muted")}); });
  el("text", {x: 560, y: 176, "font-size": 11, fill: css("--muted")}, "m = 0…10");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
