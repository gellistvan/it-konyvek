<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eltolás és kauzális maszk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>T = <span id="Tv">6</span> <input id="T" type="range" min="3" max="10" value="6" aria-label="Sorozathossz T"></label><label>B = <span id="Bv">1</span> <input id="B" type="range" min="1" max="4" value="1" aria-label="Batch méret B"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a bemeneti tokenek, alul az eggyel eltolt célok; jobbra egy alsó háromszög alakú figyelemmaszk, az aktuális pozíció sora kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A softmax-oszlopok szemléltető, determinisztikus képletből számolt eloszlást mutatnak, nem modellkimenetet. A kód a 22.2.2 vázlata (nem futtatható illusztráció).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"T": 6, "B": 1, "t": 1, "p": [0.0583, 0.5264, 0.1586, 0.0749, 0.1235, 0.0583], "line": 6, "msg": "t = 1: a(z) 1. pozíció logitja (V hosszú vektor) az x2 = „A” tokent jósolja; látható inputok: x1; szemléltető p(x2) = 0,526, −log p = 0,642"}, {"T": 6, "B": 1, "t": 2, "p": [0.1159, 0.0548, 0.4942, 0.1489, 0.0703, 0.1159], "line": 6, "msg": "t = 2: a(z) 2. pozíció logitja (V hosszú vektor) az x3 = „macska” tokent jósolja; látható inputok: x1, x2; szemléltető p(x3) = 0,494, −log p = 0,705"}, {"T": 6, "B": 1, "t": 3, "p": [0.0737, 0.1215, 0.0574, 0.5178, 0.156, 0.0737], "line": 6, "msg": "t = 3: a(z) 3. pozíció logitja (V hosszú vektor) az x4 = „ül” tokent jósolja; látható inputok: x1, x2, x3; szemléltető p(x4) = 0,518, −log p = 0,658"}, {"T": 6, "B": 1, "t": 4, "p": [0.1441, 0.0681, 0.1122, 0.053, 0.4785, 0.1441], "line": 6, "msg": "t = 4: a(z) 4. pozíció logitja (V hosszú vektor) az x5 = „a” tokent jósolja; látható inputok: x1, x2, x3, x4; szemléltető p(x5) = 0,478, −log p = 0,737"}, {"T": 6, "B": 1, "t": 5, "p": [0.0927, 0.1528, 0.0722, 0.119, 0.0562, 0.5072], "line": 6, "msg": "t = 5: a(z) 5. pozíció logitja (V hosszú vektor) az x6 = „szőnyegen” tokent jósolja; látható inputok: x1, x2, x3, x4, x5; szemléltető p(x6) = 0,507, −log p = 0,679"}, {"T": 6, "B": 1, "t": 0, "p": [], "line": 8, "msg": "reshape: logits (1, 5, V) → (5, V), target_ids (1, 5) → (5,); M = B(T−1) = 1·5 = 5"}, {"T": 6, "B": 1, "t": -1, "p": [], "line": 7, "msg": "cross_entropy: az M = 5 sor mindegyikén softmax a V-dimenzión, a veszteség a −log p(cél) átlaga"}];
const CODE = ["# Illusztráció, nem futtatható utasítás.", "import torch.nn.functional as F", "# B: batch méret, T: szekvencia hossz, V: szókincs méret.", "input_ids = tokens[:, :-1]      # (B, T-1)", "target_ids = tokens[:, 1:]      # (B, T-1)", " ", "logits = model(input_ids)       # (B, T-1, V)", "loss = F.cross_entropy(", "    logits.reshape(-1, V),", "    target_ids.reshape(-1)", ")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const WORDS = ["<bos>", "A", "macska", "ül", "a", "szőnyegen", "és", "dorombol", "halkan", "<eos>"];
const INIT = [{"T": 6, "B": 1, "t": 1, "p": [0.0583, 0.5264, 0.1586, 0.0749, 0.1235, 0.0583], "line": 6, "msg": "t = 1: a(z) 1. pozíció logitja (V hosszú vektor) az x2 = „A” tokent jósolja; látható inputok: x1; szemléltető p(x2) = 0,526, −log p = 0,642"}, {"T": 6, "B": 1, "t": 2, "p": [0.1159, 0.0548, 0.4942, 0.1489, 0.0703, 0.1159], "line": 6, "msg": "t = 2: a(z) 2. pozíció logitja (V hosszú vektor) az x3 = „macska” tokent jósolja; látható inputok: x1, x2; szemléltető p(x3) = 0,494, −log p = 0,705"}, {"T": 6, "B": 1, "t": 3, "p": [0.0737, 0.1215, 0.0574, 0.5178, 0.156, 0.0737], "line": 6, "msg": "t = 3: a(z) 3. pozíció logitja (V hosszú vektor) az x4 = „ül” tokent jósolja; látható inputok: x1, x2, x3; szemléltető p(x4) = 0,518, −log p = 0,658"}, {"T": 6, "B": 1, "t": 4, "p": [0.1441, 0.0681, 0.1122, 0.053, 0.4785, 0.1441], "line": 6, "msg": "t = 4: a(z) 4. pozíció logitja (V hosszú vektor) az x5 = „a” tokent jósolja; látható inputok: x1, x2, x3, x4; szemléltető p(x5) = 0,478, −log p = 0,737"}, {"T": 6, "B": 1, "t": 5, "p": [0.0927, 0.1528, 0.0722, 0.119, 0.0562, 0.5072], "line": 6, "msg": "t = 5: a(z) 5. pozíció logitja (V hosszú vektor) az x6 = „szőnyegen” tokent jósolja; látható inputok: x1, x2, x3, x4, x5; szemléltető p(x6) = 0,507, −log p = 0,679"}, {"T": 6, "B": 1, "t": 0, "p": [], "line": 8, "msg": "reshape: logits (1, 5, V) → (5, V), target_ids (1, 5) → (5,); M = B(T−1) = 1·5 = 5"}, {"T": 6, "B": 1, "t": -1, "p": [], "line": 7, "msg": "cross_entropy: az M = 5 sor mindegyikén softmax a V-dimenzión, a veszteség a −log p(cél) átlaga"}];
function tok(t){ return t <= WORDS.length ? WORDS[t - 1] : "x" + t; }
function r4(v){ return Math.round(v * 10000) / 10000; }
function distJS(t, T){
  const z = []; for (let j = 1; j <= T; j++) z.push(j === t + 1 ? 2.2 : 0.25 * ((j * 7 + t * 3) % 5));
  const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0);
  return e.map(v => r4(v / s));
}
function f3(x){ return x.toFixed(3).replace(".", ","); }
function stepsJS(T, B){
  const M = B * (T - 1), out = [];
  for (let t = 1; t < T; t++) {
    const p = distJS(t, T), pt = p[t], vis = [];
    for (let i = 1; i <= t; i++) vis.push("x" + i);
    out.push({T: T, B: B, t: t, p: p, line: 6, msg: "t = " + t + ": a(z) " + t + ". pozíció logitja (V hosszú vektor) az x" + (t + 1) + " = „" + tok(t + 1) + "” tokent jósolja; látható inputok: " + vis.join(", ") + "; szemléltető p(x" + (t + 1) + ") = " + f3(pt) + ", −log p = " + f3(-Math.log(pt))});
  }
  out.push({T: T, B: B, t: 0, p: [], line: 8, msg: "reshape: logits (" + B + ", " + (T - 1) + ", V) → (" + M + ", V), target_ids (" + B + ", " + (T - 1) + ") → (" + M + ",); M = B(T−1) = " + B + "·" + (T - 1) + " = " + M});
  out.push({T: T, B: B, t: -1, p: [], line: 7, msg: "cross_entropy: az M = " + M + " sor mindegyikén softmax a V-dimenzión, a veszteség a −log p(cél) átlaga"});
  return out;
}
function render(s){
  svg.innerHTML = "";
  const T = s.T, n = T - 1, w = Math.min(52, 330 / n), x0 = 110;
  svg.setAttribute("viewBox", "0 0 660 360");
  const rowsY = [60, 150, 240];
  el("text", {x: x0 - 8, y: rowsY[0] + 20, "text-anchor": "end", "font-size": 12}, "input (B, T−1)");
  el("text", {x: x0 - 8, y: rowsY[1] + 20, "text-anchor": "end", "font-size": 12}, "logits (B, T−1, V)");
  el("text", {x: x0 - 8, y: rowsY[2] + 20, "text-anchor": "end", "font-size": 12}, "target (B, T−1)");
  for (let t = 1; t <= n; t++) {
    const x = x0 + (t - 1) * w, vis = s.t > 0 && t <= s.t, cur = t === s.t;
    el("rect", {x: x + 2, y: rowsY[0], width: w - 4, height: 30, fill: vis ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": vis ? 2.2 : 1});
    el("text", {x: x + w / 2, y: rowsY[0] + 20, "text-anchor": "middle", "font-size": 13}, "x" + t);
    el("text", {x: x + w / 2, y: rowsY[0] - 6, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, tok(t).slice(0, 7));
    el("rect", {x: x + 2, y: rowsY[1], width: w - 4, height: 30, fill: css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": cur ? "" : "3 2"});
    el("text", {x: x + w / 2, y: rowsY[1] + 20, "text-anchor": "middle", "font-size": 13}, "z" + t);
    el("line", {x1: x + w / 2, y1: rowsY[0] + 32, x2: x + w / 2, y2: rowsY[1] - 2, stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("line", {x1: x + w / 2, y1: rowsY[1] + 32, x2: x + w / 2, y2: rowsY[2] - 2, stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 2.5 : 1});
    el("rect", {x: x + 2, y: rowsY[2], width: w - 4, height: 30, fill: css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3.5 : 1.6});
    el("text", {x: x + w / 2, y: rowsY[2] + 20, "text-anchor": "middle", "font-size": 13, "font-weight": cur ? "bold" : "normal"}, "x" + (t + 1));
    el("text", {x: x + w / 2, y: rowsY[2] + 46, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, tok(t + 1).slice(0, 7));
  }
  el("text", {x: 20, y: 330, "font-size": 13, "font-weight": "bold"}, "B = " + s.B + ", T = " + T + "  →  M = B(T−1) = " + (s.B * n) + ";  logits.reshape(−1, V): (" + (s.B * n) + ", V),  target: (" + (s.B * n) + ",)");
  // maszk
  const mx = 470, my = 40, c = Math.min(18, 150 / n);
  el("text", {x: mx, y: my - 10, "font-size": 12}, "kauzális maszk (" + n + "×" + n + ")");
  for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
    const ban = j > i, on = i === s.t;
    el("rect", {x: mx + (j - 1) * c, y: my + (i - 1) * c, width: c, height: c, fill: ban ? css("--bg") : (on ? css("--hl2") : css("--cellhl")), stroke: css("--line"), "stroke-width": 0.6});
    if (ban) el("line", {x1: mx + (j - 1) * c, y1: my + i * c, x2: mx + j * c, y2: my + (i - 1) * c, stroke: css("--muted"), "stroke-width": 0.8});
  }
  el("text", {x: mx, y: my + n * c + 14, "font-size": 10, fill: css("--muted")}, "sötét: engedett, áthúzott: −∞");
  if (s.t > 0) {
    const by = 250, bw = 170 / T;
    el("text", {x: mx, y: by - 52, "font-size": 11}, "szemléltető softmax (nem mért)");
    s.p.forEach((v, j) => { const h = v * 60, tg = j === s.t;
      el("rect", {x: mx + j * bw, y: by - h, width: bw - 2, height: h, fill: tg ? css("--hl2") : css("--cellhl"), stroke: css("--line"), "stroke-width": 0.6});
      el("text", {x: mx + j * bw + bw / 2, y: by + 12, "text-anchor": "middle", "font-size": 9}, "x" + (j + 1)); });
    el("text", {x: mx, y: by + 30, "font-size": 12}, "cél x" + (s.t + 1) + ": p = " + f3(s.p[s.t]) + ", −log p = " + f3(-Math.log(s.p[s.t])));
  }
}
function upd(){
  const T = +document.getElementById("T").value, B = +document.getElementById("B").value;
  document.getElementById("Tv").textContent = T; document.getElementById("Bv").textContent = B;
  setSteps(stepsJS(T, B));
}
document.getElementById("T").addEventListener("input", upd);
document.getElementById("B").addEventListener("input", upd);
document.body.dataset.selfcheck = JSON.stringify(stepsJS(6, 1)) === JSON.stringify(INIT) ? "OK" : "ELTÉRÉS";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
