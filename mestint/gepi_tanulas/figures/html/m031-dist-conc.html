<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Távolságkoncentráció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>d (log, 1…1000): <input id="d" type="range" min="0" max="3" step="0.05" value="1" aria-label="dimenzió, logaritmikus skálán 1 és 1000 között"> <span id="dv">10</span></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="A normált páronkénti távolságok hisztogramja a választott dimenzióban; d növelésével a hisztogram egyre keskenyebb az 1 körül, és a legtávolabbi és legközelebbi szomszéd aránya 1 felé tart."></svg>

<p class="small">Két független U(0,1)^d pont, 5000 pár, rögzített seedű PRNG (mulberry32, seed 12345; a 100 pontos minta seed 777). Szimuláció, nem mérés. Az elméleti érték: CV(D²) = √(7/(5d)) (9.3.9).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

function prng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ds = document.getElementById("d"), NP = 5000, BINS = 52, BMAX = 2.6;
function dval(){ return Math.max(1, Math.round(Math.pow(10, +ds.value))); }
function draw(){
  const d = dval(), r = prng(12345);
  const D = new Float64Array(NP); let s1 = 0, s2 = 0, q1 = 0, q2 = 0;
  for (let i = 0; i < NP; i++) { let a = 0; for (let j = 0; j < d; j++) { const u = r() - r(); a += u * u; } D[i] = Math.sqrt(a); s1 += a; s2 += a * a; q1 += D[i]; q2 += a; }
  const m2 = s1 / NP, v2 = s2 / NP - m2 * m2, cv2 = Math.sqrt(Math.max(0, v2)) / m2;
  const m1 = q1 / NP, v1 = q2 / NP - m1 * m1, cv1 = Math.sqrt(Math.max(0, v1)) / m1;
  const h = new Array(BINS).fill(0);
  for (let i = 0; i < NP; i++) { const b = Math.floor(D[i] / m1 / BMAX * BINS); if (b >= 0 && b < BINS) h[b]++; }
  // 100 pontos minta: az első pont legtávolabbi / legközelebbi szomszédjának aránya
  const r2 = prng(777), P = []; for (let i = 0; i < 100; i++) { const p = new Float64Array(d); for (let j = 0; j < d; j++) p[j] = r2(); P.push(p); }
  let dmin = Infinity, dmax = 0;
  for (let i = 1; i < 100; i++) { let a = 0; for (let j = 0; j < d; j++) { const u = P[0][j] - P[i][j]; a += u * u; } a = Math.sqrt(a); dmin = Math.min(dmin, a); dmax = Math.max(dmax, a); }
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), X0 = 50, Y0 = 20, W = 560, H = 240;
  const bw = BMAX / BINS, dens = h.map(c => c / NP / bw), top = Math.max(2, Math.max(...dens) * 1.3);
  const tx = v => X0 + v / BMAX * W, ty = v => Y0 + H - v / top * H;
  el("line", {x1: X0, y1: Y0 + H, x2: X0 + W, y2: Y0 + H, stroke: mu}); el("line", {x1: X0, y1: Y0, x2: X0, y2: Y0 + H, stroke: mu});
  let p = `M${tx(0)},${ty(0)}`; dens.forEach((v, i) => { p += `V${ty(v).toFixed(1)}H${tx((i + 1) * bw).toFixed(1)}`; }); p += `V${ty(0)}`;
  el("path", {d: p, fill: css("--fill"), stroke: fg, "stroke-width": 1.5});
  el("line", {x1: tx(1), y1: Y0, x2: tx(1), y2: Y0 + H, stroke: fg, "stroke-dasharray": "4 4"});
  [0, 0.5, 1, 1.5, 2, 2.5].forEach(v => el("text", {x: tx(v), y: Y0 + H + 16, "text-anchor": "middle", "font-size": 12}, fmt(v, v % 1 ? 1 : 0)));
  el("text", {x: X0 + W / 2, y: Y0 + H + 34, "text-anchor": "middle", "font-size": 13}, "normált távolság D / átlag(D)");
  el("text", {x: X0 - 8, y: Y0 + 8, "text-anchor": "end", "font-size": 12}, fmt(top, 1));
  el("text", {x: X0 - 8, y: Y0 + H, "text-anchor": "end", "font-size": 12}, "0");
  el("text", {x: X0 + W - 4, y: Y0 + 14, "text-anchor": "end", "font-size": 13}, `d = ${d}: ${NP} pár hisztogramja`);
  el("text", {x: X0 + W - 4, y: Y0 + 32, "text-anchor": "end", "font-size": 12}, `100 pontos minta: legtávolabbi / legközelebbi szomszéd = ${fmt(dmax / dmin, 2)}`);
  const th = Math.sqrt(7 / (5 * d));
  document.getElementById("dv").textContent = d;
  status.textContent = `d = ${d}, E[D²] = d/6 = ${fmt(d / 6, 3)} (szimulált ${fmt(m2, 3)}); CV(D²) elméleti ${fmt(th, 4)} / szimulált ${fmt(cv2, 4)}; CV(D) szimulált ${fmt(cv1, 4)} (≈ ½√(7/(5d)) = ${fmt(th / 2, 4)}); d_max/d_min = ${fmt(dmax / dmin, 2)}`;
}
ds.oninput = draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
