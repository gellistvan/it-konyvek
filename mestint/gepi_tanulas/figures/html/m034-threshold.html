:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}

  if (!manual) { const xt = H0[0] + Math.min(1, t) * H0[2]; el("line", {x1: xt, y1: H0[1] - 2, x2: xt, y2: H0[1] + H0[3], stroke: hl, "stroke-width": 2.5}); }
  document.getElementById("tv").textContent = t > 1 ? "> 1" : fmt(t, 2);
  const pre = manual ? "Kézi példa (10.2.3)" : `τ = ${t > 1 ? "> 1" : fmt(t, 2)}`;
  status.textContent = `${pre}: TP = ${tp}, FP = ${fp}, TN = ${tn}, FN = ${fn}; Precision = ${isFinite(prec) ? fmt(prec, 3) : "nem definiált (nincs pozitív predikció)"}, Recall (TPR) = ${fmt(rec, 3)}, FPR = ${fmt(fpr, 3)}, F1 = ${isFinite(f1) ? fmt(f1, 3) : "—"}, Accuracy = ${fmt(acc, 3)}` + (manual ? `, Specificity = ${fmt(tn / (tn + fp), 3)}` : "");
}
ts.oninput = () => { manual = false; draw(); };
document.getElementById("b0").onclick = () => { manual = false; ts.value = 0; draw(); };
document.getElementById("b1").onclick = () => { manual = false; ts.value = 1.01; draw(); };
document.getElementById("b5").onclick = () => { manual = false; ts.value = 0.5; draw(); };
document.getElementById("bm").onclick = () => { manual = true; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
