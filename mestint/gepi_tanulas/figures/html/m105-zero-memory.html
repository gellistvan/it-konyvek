<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeRO memória-felosztás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
<label>N <input id="n" type="range" min="0" max="1000" step="1" value="649" aria-label="Paraméterszám (logaritmikus, 0,1–70 milliárd)"> <b id="nv"></b> milliárd</label>
<label>P <input id="p" type="range" min="1" max="64" step="1" value="8"> <b id="pv"></b></label>
<label>GPU-kapacitás <input id="cap" type="range" min="8" max="192" step="8" value="80"> <b id="capv"></b> GB</label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 325" role="img" aria-label="Halmozott oszlopok: paraméter, gradiens és optimizer-állapot dolgozónként DDP, ZeRO-1, ZeRO-2 és ZeRO-3 esetén, GPU-kapacitás vonallal; N, P és a kapacitás állítható"></svg>

<p class="small">Számított, nem mérés: FP32 AdamW, a 28.1.7 táblázatának képletei (GB = 10⁹ bájt), aktivációk és az all-gather puffer nélkül. A GPU-kapacitás példaérték.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const E = {n: document.getElementById("n"), p: document.getElementById("p"), cap: document.getElementById("cap")};
const NPOS = 649;
function nVal(){ return +E.n.value === NPOS ? 7 : Math.pow(10, -1 + (+E.n.value / 1000) * (Math.log10(70) + 1)); }
function draw(){
  const N = nVal() * 1e9, P = +E.p.value, cap = +E.cap.value;
  document.getElementById("nv").textContent = fmt(N / 1e9, N < 1e9 ? 2 : 1);
  document.getElementById("pv").textContent = P; document.getElementById("capv").textContent = cap;
  const p = 4 * N / 1e9, g = 4 * N / 1e9, o = 8 * N / 1e9;
  const R = [["DDP", [p, g, o]], ["ZeRO-1", [p, g, o / P]], ["ZeRO-2", [p, g / P, o / P]], ["ZeRO-3 / FSDP", [p / P, g / P, o / P]]];
  const ymax = Math.max(16 * N / 1e9, cap) * 1.15;
  svg.innerHTML = "";
  el("defs", {}).innerHTML = `<pattern id="hd" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css('--fg')}" stroke-width="1.2"/></pattern>` +
    `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${css('--fg')}"/></pattern>`;
  const L = 70, Rr = 620, T = 30, B = 300, Y = v => B - (B - T) * v / ymax, bw = 80;
  el("line", {x1: L, x2: Rr, y1: B, y2: B, stroke: css("--fg")});
  const stepv = Math.pow(10, Math.floor(Math.log10(ymax / 5))), tick = [1, 2, 5].map(m => m * stepv).find(t => ymax / t <= 7) || stepv * 10;
  for (let v = 0; v <= ymax; v += tick){ el("line", {x1: L, x2: Rr, y1: Y(v), y2: Y(v), stroke: css("--grid"), "stroke-dasharray": "2 3"});
    el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, tick < 1 ? 1 : 0)); }
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "GB / dolgozó");
  const fills = [css("--fill2"), "url(#hd)", "url(#hp)"];
  const fits = [];
  R.forEach(([name, v], i) => {
    const x = L + 30 + i * 135; let acc = 0;
    v.forEach((h, j) => { el("rect", {x, y: Y(acc + h), width: bw, height: Y(acc) - Y(acc + h), fill: fills[j], stroke: css("--fg"), "stroke-width": 1.2}); acc += h; });
    const ok = acc <= cap; fits.push(name + (ok ? " ✓" : " ✗"));
    el("text", {x: x + bw / 2, y: Y(acc) - 6, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: ok ? css("--fg") : css("--hl2")}, fmt(acc, acc < 10 ? 2 : 1) + " GB");
    el("text", {x: x + bw / 2, y: B + 16, "text-anchor": "middle", "font-size": 12}, name);
  });
  el("line", {x1: L, x2: Rr, y1: Y(cap), y2: Y(cap), stroke: css("--hl2"), "stroke-width": 1.6, "stroke-dasharray": "7 4"});
  el("text", {x: Rr, y: Y(cap) - 5, "text-anchor": "end", "font-size": 11, fill: css("--hl2")}, "GPU-kapacitás " + cap + " GB");
  el("rect", {x: L + 4, y: 6, width: 14, height: 12, fill: fills[0], stroke: css("--fg")}); el("text", {x: L + 22, y: 16, "font-size": 11}, "paraméter 4N B");
  el("rect", {x: L + 150, y: 6, width: 14, height: 12, fill: fills[1], stroke: css("--fg")}); el("text", {x: L + 168, y: 16, "font-size": 11}, "gradiens 4N B");
  el("rect", {x: L + 290, y: 6, width: 14, height: 12, fill: fills[2], stroke: css("--fg")}); el("text", {x: L + 308, y: 16, "font-size": 11}, "optimizer-állapot 8N B");
  status.textContent = `N = ${fmt(N / 1e9, 2)}·10⁹, P = ${P}: DDP ${fmt(16 * N / 1e9, 1)}, ZeRO-1 ${fmt((8 * N + 8 * N / P) / 1e9, 1)}, ZeRO-2 ${fmt((4 * N + 12 * N / P) / 1e9, 1)}, ZeRO-3/FSDP ${fmt(16 * N / P / 1e9, 2)} GB. Belefér a ${cap} GB-ba: ${fits.join(", ")} (aktivációk nélkül!).`;
}
["n", "p", "cap"].forEach(i => E[i].addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
