<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konvolúció és max pooling lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label for="st">stride: <b id="stv">1</b></label><input id="st" type="range" min="1" max="2" value="1" style="max-width:80px">
<label for="pd">padding: <b id="pdv">0</b></label><input id="pd" type="range" min="0" max="1" value="0" style="max-width:80px">
<label for="ks">kernel: <b id="ksv">3</b>×<b id="ksv2">3</b></label><input id="ks" type="range" min="1" max="3" value="3" style="max-width:90px">
<label><input id="fl" type="checkbox"> valódi konvolúció (kernel megfordítva)</label>
<span id="shp" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 5×5-ös bemeneten csúszó 3×3-as ablak, a Sobel-kernel és a kimenet cellánként; utána 2×2-es max pooling a 4×4-es példán."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet 17.1.4-es példája: X = 0…24, Sobel G_x, stride 1, padding 0 → minden kimenet 8 (a kernel nincs megfordítva, cross-correlation). Kernelméret 1–2-nél a Sobel-kernel bal felső k×k szelete szerepel. A „valódi konvolúció” a kernelt 180°-kal forgatja: minden kimenet −8.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "conv", "i": 0, "j": 0, "line": 6, "msg": "i=0, j=0: window = X_pad[0:3, 0:3], y[0,0] = 8"}, {"ph": "conv", "i": 0, "j": 1, "line": 6, "msg": "i=0, j=1: window = X_pad[0:3, 1:4], y[0,1] = 8"}, {"ph": "conv", "i": 0, "j": 2, "line": 6, "msg": "i=0, j=2: window = X_pad[0:3, 2:5], y[0,2] = 8"}, {"ph": "conv", "i": 1, "j": 0, "line": 6, "msg": "i=1, j=0: window = X_pad[1:4, 0:3], y[1,0] = 8"}, {"ph": "conv", "i": 1, "j": 1, "line": 6, "msg": "i=1, j=1: window = X_pad[1:4, 1:4], y[1,1] = 8"}, {"ph": "conv", "i": 1, "j": 2, "line": 6, "msg": "i=1, j=2: window = X_pad[1:4, 2:5], y[1,2] = 8"}, {"ph": "conv", "i": 2, "j": 0, "line": 6, "msg": "i=2, j=0: window = X_pad[2:5, 0:3], y[2,0] = 8"}, {"ph": "conv", "i": 2, "j": 1, "line": 6, "msg": "i=2, j=1: window = X_pad[2:5, 1:4], y[2,1] = 8"}, {"ph": "conv", "i": 2, "j": 2, "line": 6, "msg": "i=2, j=2: window = X_pad[2:5, 2:5], y[2,2] = 8"}, {"ph": "pool", "i": 0, "j": 0, "line": 11, "msg": "max pooling i=0, j=0: window = x[0:2, 0:2], y[0,0] = 6"}, {"ph": "pool", "i": 0, "j": 1, "line": 11, "msg": "max pooling i=0, j=1: window = x[0:2, 2:4], y[0,1] = 8"}, {"ph": "pool", "i": 1, "j": 0, "line": 11, "msg": "max pooling i=1, j=0: window = x[2:4, 0:2], y[1,0] = 14"}, {"ph": "pool", "i": 1, "j": 1, "line": 11, "msg": "max pooling i=1, j=1: window = x[2:4, 2:4], y[1,1] = 16"}];
const CODE = ["x_pad = np.pad(x, ((pad, pad), (pad, pad)), mode=\"constant\", constant_values=0)", "H_out = (H + 2 * pad - kH) // stride + 1", "W_out = (W + 2 * pad - kW) // stride + 1", "for i in range(H_out):", "    for j in range(W_out):", "        window = x_pad[i*stride : i*stride + kH, j*stride : j*stride + kW]", "        y[i, j] = np.sum(window * w)", "# max_pool2d_single_channel(x, pool_size=2, stride=2):", "for i in range(H_out):", "    for j in range(W_out):", "        window = x[i*stride : i*stride + kH, j*stride : j*stride + kW]", "        y[i, j] = np.max(window)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const X0 = Array.from({length: 5}, (_, i) => Array.from({length: 5}, (_, j) => 5 * i + j));
const KER0 = [[-1, 0, 1], [-2, 0, 2], [-1, 0, 1]];
const XP0 = Array.from({length: 4}, (_, i) => Array.from({length: 4}, (_, j) => 4 * i + j + 1));
let P = {st: 1, pd: 0, k: 3, fl: false};
function kern(){ let w = KER0.slice(0, P.k).map(r => r.slice(0, P.k)); if (P.fl) w = w.slice().reverse().map(r => r.slice().reverse()); return w; }
function xpad(){ const n = 5 + 2 * P.pd; return Array.from({length: n}, (_, i) => Array.from({length: n}, (_, j) => { const a = i - P.pd, b = j - P.pd; return (a >= 0 && a < 5 && b >= 0 && b < 5) ? X0[a][b] : null; })); }
function convOut(){ const w = kern(), xp = xpad(), n = Math.floor((5 + 2 * P.pd - P.k) / P.st) + 1, y = [];
  for (let i = 0; i < n; i++) { y.push([]); for (let j = 0; j < n; j++) { let s = 0; for (let u = 0; u < P.k; u++) for (let v = 0; v < P.k; v++) s += (xp[i * P.st + u][j * P.st + v] || 0) * w[u][v]; y[i].push(s); } } return y; }
function mk(){ const y = convOut(), st = [];
  for (let i = 0; i < y.length; i++) for (let j = 0; j < y.length; j++) { const r0 = i * P.st, c0 = j * P.st;
    st.push({ph: "conv", i, j, line: 6, msg: `i=${i}, j=${j}: window = X_pad[${r0}:${r0 + P.k}, ${c0}:${c0 + P.k}], y[${i},${j}] = ${y[i][j]}`.replace(/-/g, "−")}); }
  const pm = [[6, 8], [14, 16]];
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) st.push({ph: "pool", i, j, line: 11, msg: `max pooling i=${i}, j=${j}: window = x[${2 * i}:${2 * i + 2}, ${2 * j}:${2 * j + 2}], y[${i},${j}] = ${pm[i][j]}`});
  return st; }
function shapeInfo(){ const n = Math.floor((5 + 2 * P.pd - P.k) / P.st) + 1;
  document.getElementById("shp").textContent = `H_out = ⌊(5 + 2·${P.pd} − ${P.k}) / ${P.st}⌋ + 1 = ${n}  →  kimenet ${n}×${n}`; }
function upd(){ P = {st: +document.getElementById("st").value, pd: +document.getElementById("pd").value, k: +document.getElementById("ks").value, fl: document.getElementById("fl").checked};
  document.getElementById("stv").textContent = P.st; document.getElementById("pdv").textContent = P.pd;
  document.getElementById("ksv").textContent = P.k; document.getElementById("ksv2").textContent = P.k; shapeInfo(); setSteps(mk()); }
["st", "pd", "ks", "fl"].forEach(id => document.getElementById(id).addEventListener("input", upd));
function cell(x, y, c, txt, o){ o = o || {};
  el("rect", {x, y, width: c, height: c, fill: o.fill || css("--cell"), stroke: css("--line"), "stroke-width": o.sw || 1});
  if (o.hatch) el("rect", {x, y, width: c, height: c, fill: "url(#" + o.hatch + ")", stroke: "none"});
  if (txt !== undefined && txt !== null) el("text", {x: x + c / 2, y: y + c / 2 + 5, "text-anchor": "middle", "font-size": o.fs || 14, "font-weight": o.bold ? "bold" : "normal"}, String(txt).replace(/-/g, "−")); }
function defs(){ const d = el("defs", {});
  [["hA", "M0,8 L8,0"], ["hB", "M0,0 L8,8"], ["hC", "M0,4 L8,4"], ["hD", "M4,0 L4,8"]].forEach(([id, p]) => {
    const pt = document.createElementNS(NS, "pattern"); pt.setAttribute("id", id); pt.setAttribute("width", 8); pt.setAttribute("height", 8); pt.setAttribute("patternUnits", "userSpaceOnUse");
    const ph = document.createElementNS(NS, "path"); ph.setAttribute("d", p); ph.setAttribute("stroke", css("--muted")); ph.setAttribute("stroke-width", 1.2); pt.appendChild(ph); d.appendChild(pt); }); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = ""; defs();
  if (s.ph === "conv") {
    const xp = xpad(), n = xp.length, c = 34, x0 = 20, y0 = 40, w = kern(), y = convOut();
    el("text", {x: x0, y: 24, "font-size": 13}, `X_pad (${n}×${n}${P.pd ? ", szürke mintás: nulla-padding" : ""})`);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const inw = i >= s.i * P.st && i < s.i * P.st + P.k && j >= s.j * P.st && j < s.j * P.st + P.k;
      cell(x0 + j * c, y0 + i * c, c, xp[i][j] === null ? 0 : xp[i][j], {fill: inw ? css("--cellhl") : css("--cell"), hatch: xp[i][j] === null ? "hD" : null, fs: 13});
      if (inw) { const kv = w[i - s.i * P.st][j - s.j * P.st]; el("text", {x: x0 + j * c + c - 3, y: y0 + i * c + c - 3, "text-anchor": "end", "font-size": 9, fill: css("--hl2")}, ("·" + kv).replace(/-/g, "−")); }
    }
    el("rect", {x: x0 + s.j * P.st * c, y: y0 + s.i * P.st * c, width: P.k * c, height: P.k * c, fill: "none", stroke: css("--hl"), "stroke-width": 4});
    const kx = x0 + n * c + 40;
    el("text", {x: kx, y: 24, "font-size": 13}, P.fl ? "kernel (180°-kal forgatva)" : "kernel (Sobel G_x szelete)");
    for (let u = 0; u < P.k; u++) for (let v = 0; v < P.k; v++) cell(kx + v * c, y0 + u * c, c, w[u][v], {fs: 13});
    const ox = kx + Math.max(P.k * c, 150) + 40;
    el("text", {x: ox, y: 24, "font-size": 13}, `kimenet Y (${y.length}×${y.length})`);
    for (let i = 0; i < y.length; i++) for (let j = 0; j < y.length; j++) {
      const done = i < s.i || (i === s.i && j <= s.j), cur = i === s.i && j === s.j;
      cell(ox + j * c, y0 + i * c, c, done ? y[i][j] : "", {hatch: cur ? "hA" : null, sw: cur ? 3 : 1, bold: cur, fs: 13});
    }
    const xpv = xp, terms = [];
    for (let u = 0; u < P.k; u++) for (let v = 0; v < P.k; v++) { const a = xpv[s.i * P.st + u][s.j * P.st + v] || 0; terms.push(a * w[u][v]); }
    const sum = terms.reduce((a, b) => a + b, 0);
    el("text", {x: 20, y: 300, "font-size": 13}, (`y[${s.i},${s.j}] = ` + terms.join(" + ") + ` = ${sum}`).replace(/\+ -/g, "− ").replace(/-/g, "−"));
  } else {
    const c = 40, x0 = 40, y0 = 50, pm = [[6, 8], [14, 16]], hs = ["hA", "hB", "hC", "hD"];
    el("text", {x: x0, y: 30, "font-size": 13}, "max pooling 2×2, stride 2 (4×4 bemenet: 1…16)");
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const b = Math.floor(i / 2) * 2 + Math.floor(j / 2), cur = Math.floor(i / 2) === s.i && Math.floor(j / 2) === s.j;
      cell(x0 + j * c, y0 + i * c, c, XP0[i][j], {fill: cur ? css("--cellhl") : css("--cell"), hatch: hs[b]});
      if (XP0[i][j] === pm[Math.floor(i / 2)][Math.floor(j / 2)] && cur) el("circle", {cx: x0 + j * c + c / 2, cy: y0 + i * c + c / 2, r: 15, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
    }
    el("rect", {x: x0 + 2 * s.j * c, y: y0 + 2 * s.i * c, width: 2 * c, height: 2 * c, fill: "none", stroke: css("--hl"), "stroke-width": 4});
    const ox = 340;
    el("text", {x: ox, y: 30, "font-size": 13}, "kimenet (2×2)");
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const done = i < s.i || (i === s.i && j <= s.j);
      cell(ox + j * c, y0 + i * c, c, done ? pm[i][j] : "", {hatch: hs[i * 2 + j], sw: (i === s.i && j === s.j) ? 3 : 1, bold: true}); }
    el("text", {x: 20, y: 300, "font-size": 13}, "H_out = ⌊(4 − 2) / 2⌋ + 1 = 2; a pooling csúszkái nem változnak (2×2, stride 2)");
  }
}
shapeInfo();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
