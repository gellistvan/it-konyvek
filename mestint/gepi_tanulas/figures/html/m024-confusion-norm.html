<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfúziós mátrix normalizálása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="radiogroup" aria-label="Nézet">
<label><input type="radio" name="v" value="abs" checked> Abszolút</label>
<label><input type="radio" name="v" value="row"> Sor-normalizált (recall-szerkezet)</label>
<label><input type="radio" name="v" value="col"> Oszlop-normalizált (precízió-szerkezet)</label>
</div><p class="small">Kattints egy cellára (vagy Tab + Enter) a számításhoz.</p>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 400" role="img" aria-label="Háromosztályos konfúziós mátrix hőtérképe abszolút, sor- vagy oszlop-normalizált nézetben; a cellára kattintva az állapotsor kiírja a számítást"></svg>

<p class="small">Számított példa (7.4.1): sorok = valós, oszlopok = predikált osztály, 0-tól számozva. Sor-normalizálás: hova kerültek az i. osztály mintái (recall-szerkezet); oszlop-normalizálás: miből áll a j-nek prediktált csoport (precízió-szerkezet).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const C = [[45, 3, 2], [2, 50, 8], [1, 5, 34]]; let view = "abs", sel = [1, 2];
const rs = C.map(r => r.reduce((a, b) => a + b, 0)), cs = [0, 1, 2].map(j => C.reduce((a, r) => a + r[j], 0));
const val = (i, j) => view === "abs" ? C[i][j] : view === "row" ? C[i][j] / rs[i] : C[i][j] / cs[j];
function explain(i, j){
  const pct = v => fmt(100 * v, 1) + " %";
  if (view === "abs") return `${i}→${j}: ${C[i][j]} minta (sorösszeg ${rs[i]}, oszlopösszeg ${cs[j]}).` + (i === j ? " Főátló: helyes predikció." : "");
  if (view === "row") return `${i}→${j}: ${C[i][j]}/${rs[i]} = ${fmt(C[i][j] / rs[i], 3)} – a ${i}. osztály mintáinak ${pct(C[i][j] / rs[i])}-a ` +
    (i === j ? "helyesen a saját osztályába került (recall)." : `a ${j}. osztályba került.`);
  return `${i}→${j}: ${C[i][j]}/${cs[j]} = ${fmt(C[i][j] / cs[j], 3)} – a ${j}-nek prediktált minták ${pct(C[i][j] / cs[j])}-a ` +
    (i === j ? "valóban ilyen (precízió)." : `valójában ${i}-es.`);
}
function draw(){
  svg.innerHTML = ""; const x0 = 120, y0 = 50, w = 100;
  el("text", {x: x0 + 150, y: 22, "text-anchor": "middle", "font-size": 13}, "predikált osztály");
  el("text", {x: 30, y: y0 + 150, "font-size": 13, transform: `rotate(-90 30 ${y0 + 150})`, "text-anchor": "middle"}, "valós osztály");
  for (let i = 0; i < 3; i++){ el("text", {x: x0 + i * w + w / 2, y: y0 - 8, "text-anchor": "middle", "font-size": 13}, String(i));
    el("text", {x: x0 - 12, y: y0 + i * w + w / 2 + 5, "text-anchor": "end", "font-size": 13}, String(i)); }
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++){
    const v = val(i, j), sh = view === "abs" ? v / 50 : v, g = Math.round(255 - 190 * sh);
    const dark = g < 115, on = sel[0] === i && sel[1] === j;
    const r = el("rect", {x: x0 + j * w, y: y0 + i * w, width: w, height: w, fill: `rgb(${g},${g},${g})`, stroke: css("--line"),
      "stroke-width": i === j ? 4 : 1, tabindex: 0, role: "button", "aria-label": `cella ${i}→${j}`, style: "cursor:pointer"});
    if ((i === 1 && j === 2) || (i === 2 && j === 1)) el("rect", {x: x0 + j * w + 7, y: y0 + i * w + 7, width: w - 14, height: w - 14, fill: "none", stroke: dark ? "#fff" : "#000", "stroke-dasharray": "2 3", "stroke-width": 1.5, "pointer-events": "none"});
    if (on) el("rect", {x: x0 + j * w + 3, y: y0 + i * w + 3, width: w - 6, height: w - 6, fill: "none", stroke: css("--hl2"), "stroke-width": 4, "pointer-events": "none"});
    el("text", {x: x0 + j * w + w / 2, y: y0 + i * w + w / 2 + 7, "text-anchor": "middle", "font-size": 20, fill: dark ? "#fff" : "#000", "pointer-events": "none"},
      view === "abs" ? String(v) : fmt(v, 3));
    const pick = () => { sel = [i, j]; draw(); };
    r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); } });
  }
  const sx = x0 + 3 * w + 20;
  if (view === "row") { el("text", {x: sx, y: y0 + 150, "font-size": 13}, "→ soronként ∑ = 1");
    for (let i = 0; i < 3; i++) el("text", {x: sx, y: y0 + i * w + w / 2 + 5, "font-size": 12, fill: css("--muted")}, "÷ " + rs[i]); }
  if (view === "col") { el("text", {x: x0 + 150, y: y0 + 3 * w + 38, "text-anchor": "middle", "font-size": 13}, "↓ oszloponként ∑ = 1");
    for (let j = 0; j < 3; j++) el("text", {x: x0 + j * w + w / 2, y: y0 + 3 * w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "÷ " + cs[j]); }
  el("text", {x: sx, y: y0 + 20, "font-size": 12, fill: css("--muted")}, "vastag keret: főátló");
  el("text", {x: sx, y: y0 + 38, "font-size": 12, fill: css("--muted")}, "pontozott: 1→2 és 2→1");
  status.textContent = explain(sel[0], sel[1]);
}
document.querySelectorAll('input[name="v"]').forEach(r => r.onchange = e => { view = e.target.value; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
