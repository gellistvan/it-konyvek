<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Környezetleírás és futtatási napló</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="upd" type="checkbox" onchange="show(k)"> „pandas frissítés” forgatókönyv</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A pyproject.toml-ból uv lock készít uv.lock-ot, abból uv sync építi a .venv-et, a futtatás run_log.json-t ír, amelyet az uv.lock verzióival vetünk össze."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti ábra; a verziók a 3.4 fejezet példái (numpy 2.2.6, scikit-learn 1.5.2). A „pandas frissítés” forgatókönyvben a 2.3.x helyőrző, nem konkrét kiadás. A szkript neve (env_log.py) szemléltető: a labor szkriptje írja a run_log.json-t.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 1, "line": 0, "msg": "1. uv add: a pyproject.toml-ba kézzel/parancssorból írt szándék (tartomány-megszorítások)."}, {"st": 2, "line": 1, "msg": "2. uv lock: a teljes feloldott fa pontos verziókkal (a scipy tranzitív függőség is) → uv.lock (git)."}, {"st": 3, "line": 2, "msg": "3. uv sync --frozen: a .venv pontosan a uv.lock alapján épül; a .venv nem kerül verziókezelésbe."}, {"st": 4, "line": 3, "msg": "4. uv run python env_log.py: a futtatás a ténylegesen betöltött verziókat a run_log.json-ba írja (mért)."}, {"st": 5, "line": 4, "msg": "5. összevetés: a run_log.json numpy-verziója (2.2.6) egyezik a uv.lock-éval (2.2.6) → a környezet azonos."}];
const CODE = ["uv add \"numpy>=2.0,<3\" \"pandas>=2.2,<4\"", "uv lock                      # a feloldott függőségi fa → uv.lock", "uv sync --frozen             # a .venv pontosan a uv.lock szerint", "uv run python env_log.py     # a futás run_log.json-t ír", "# összevetés: numpy a uv.lock-ban == numpy a run_log.json-ban?"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return Number(v).toFixed(d).replace(".", ",").replace("-", "−"); }
function patterns(){
  const defs = document.createElementNS(NS, "defs"), f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<pattern id="pdense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${f}" stroke-width="1"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
}

const G = {"W": 900, "H": 350, "FS": 16, "BWS": [204, 178, 150, 180], "BY": 78, "BH": 168, "XS": [4, 266, 502, 710], "nodes": [["pyproject.toml", ["numpy>=2.0,<3", "pandas>=2.2,<4", "kézzel írt", "(szándék)"], "git", 1], ["uv.lock", ["numpy 2.2.6", "scikit-learn 1.5.2", "scipy (tranzitív)", "generált"], "git", 2], [".venv", ["telepített", "csomagok", "generált", "(gitignore)"], "ignore", 3], ["run_log.json", ["numpy: 2.2.6", "seed: 42", "measured_mean", "a futás írja (mért)"], "git", 4]], "cmds": [["uv lock", 2], ["uv sync\n--frozen", 3], ["uv run python\nenv_log.py", 4]]};
window.addEventListener("load", () => show(4));
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${G.W} ${G.H}`);
  const up = document.getElementById("upd").checked;
  const L0 = document.getElementById("L0"); if (L0) L0.textContent = up ? 'uv add "pandas>=2.3,<4"      # pandas-frissítés: a pyproject.toml módosul' : 'uv add "numpy>=2.0,<3" "pandas>=2.2,<4"';
  const nodes = JSON.parse(JSON.stringify(G.nodes));
  if (up) { nodes[0][1][1] = "pandas>=2.3,<4"; nodes[1][1][2] = "pandas 2.3.x (új)"; nodes[3][1][2] = "pandas: 2.3.x"; }
  const cur = st => st === s.st, on = st => st <= s.st;
  nodes.forEach(([title, lines, frame, st], i) => { const x = G.XS[i], BW = G.BWS[i], vis = on(st);
    const sw = cur(st) ? 3 : 1.5, col = cur(st) ? css("--hl2") : (vis ? css("--fg") : css("--muted"));
    el("rect", {x: x, y: G.BY, width: BW, height: G.BH, rx: 6, fill: cur(st) ? css("--cellhl") : css("--cell"), stroke: col, "stroke-width": sw, "stroke-dasharray": frame === "ignore" ? "2 3" : "", opacity: vis ? 1 : 0.3});
    if (frame === "git") el("rect", {x: x + 5, y: G.BY + 5, width: BW - 10, height: G.BH - 10, rx: 4, fill: "none", stroke: col, "stroke-width": 1, opacity: vis ? 1 : 0.3});
    el("text", {x: x + BW / 2, y: G.BY + 31, "text-anchor": "middle", "font-size": G.FS, "font-weight": "bold", opacity: vis ? 1 : 0.3}, title);
    lines.forEach((t, j) => el("text", {x: x + BW / 2, y: G.BY + 63 + j * 26, "text-anchor": "middle", "font-size": G.FS - 1.5, "font-family": j < 2 && frame !== "ignore" ? "monospace" : "inherit", opacity: vis ? 1 : 0.3}, t));
  });
  G.cmds.forEach(([lab, st], i) => { if (!on(st)) return; const x0 = G.XS[i] + G.BWS[i], x1 = G.XS[i + 1], y = G.BY + G.BH / 2, col = cur(st) ? css("--hl2") : css("--fg");
    el("line", {x1: x0 + 2, y1: y, x2: x1 - 10, y2: y, stroke: col, "stroke-width": cur(st) ? 3 : 1.6});
    el("path", {d: `M${x1 - 1} ${y} L${x1 - 12} ${y - 6} L${x1 - 12} ${y + 6} Z`, fill: col});
    lab.split("\n").forEach((t, j, A) => el("text", {x: (x0 + x1) / 2, y: G.BY - 10 - (A.length - 1 - j) * 18, "text-anchor": "middle", "font-size": G.FS - 2, "font-family": "monospace"}, t)); });
  if (on(5)) { const xr = G.XS[3] + G.BWS[3] / 2, xl = G.XS[1] + G.BWS[1] / 2, yb = G.BY + G.BH, col = cur(5) ? css("--hl2") : css("--fg");
    el("polyline", {points: `${xr},${yb} ${xr},${yb + 30} ${xl},${yb + 30} ${xl},${yb + 10}`, fill: "none", stroke: col, "stroke-width": cur(5) ? 3 : 1.6, "stroke-dasharray": "7 4"});
    el("path", {d: `M${xl} ${yb + 1} L${xl - 6} ${yb + 12} L${xl + 6} ${yb + 12} Z`, fill: col});
    el("text", {x: (xl + xr) / 2, y: yb + 52, "text-anchor": "middle", "font-size": G.FS - 1}, up ? "összevetés: numpy 2.2.6 = 2.2.6, pandas 2.3.x = 2.3.x" : "összevetés: numpy 2.2.6 = 2.2.6 ✓"); }
  el("text", {x: 10, y: G.H - 8, "font-size": 13, fill: css("--muted")}, "kettős keret: verziókezelésben (git) · pontozott keret: .gitignore");
  if (up && s.st === 5) status.textContent = "pandas-frissítés: a pyproject.toml módosul → uv lock újragenerálja a uv.lock-ot (pandas 2.3.x) → uv sync → az új futás run_log.json-ja már az új pandas-verziót mutatja; a régi és az új eredmény csak a verzióváltás ismeretében hasonlítható össze.";
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
