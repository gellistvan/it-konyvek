<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Párosított foldkülönbségek és konfidenciaintervallum</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>d̄: <input id="dm" type="range" min="0" max="0.04" step="0.001" value="0.025" oninput="show(k)" aria-label="átlagos különbség"> <span id="dmv">0,025</span></label> <label>s<sub>d</sub>: <input id="sd" type="range" min="0.002" max="0.03" step="0.001" value="0.01" oninput="show(k)" aria-label="a különbségek mintaszórása"> <span id="sdv">0,010</span></label></div><div class="ctl"><span>n<sub>teszt</sub>/n<sub>tanító</sub>:</span> <label><input type="radio" name="rt" value="0.1111111111111111"  onchange="show(k)"> 1/9 (10-fold)</label> <label><input type="radio" name="rt" value="0.25" checked onchange="show(k)"> 1/4 (5-fold)</label> <label><input type="radio" name="rt" value="0.5"  onchange="show(k)"> 1/2 (3-fold)</label> <button onclick="preset(0.025, 0.01)">Könyv példája</button> <button onclick="preset(0.015, 0.01)">d̄ = 0,015</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Számegyenes a 25 párosított különbséggel, az átlaggal, a keskeny naiv és a széles korrigált intervallummal, valamint a 0,01-es és 0,02-es döntési küszöbökkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illusztratív, nem mért adat: a 25 különbség a fejezet számpéldájához igazított, seed-42 normális minta (az aktuális d̄-re és s_d-re skálázva). n = 25 rögzített (t₂₄ ≈ 2,064); a fold-választó csak az n_teszt/n_tanító arányt változtatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(v, d){ return Number(v).toFixed(d).replace(".", ",").replace("-", "−"); }
function patterns(){
  const defs = document.createElementNS(NS, "defs"), f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<pattern id="pdense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${f}" stroke-width="1"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
}

const DI = [0.409229, -1.208763, 0.945552, 1.174304, -2.304973, -1.524246, 0.196405, -0.337932, 0.022367, -0.98383, 1.100706, 0.978449, 0.122033, 1.398919, 0.605106, -0.991349, 0.486277, -1.111179, 1.099565, -0.01749, -0.17985, -0.776736, 1.513588, -0.143353, -0.472797], Zc = 1.959963984540054, T24 = 2.0638985616280205;
function g(id){ return +document.getElementById(id).value; }
function preset(dm, sd){ document.getElementById("dm").value = dm; document.getElementById("sd").value = sd; show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 250"); patterns();
  const dm = g("dm"), sd = g("sd"), ratio = +document.querySelector('input[name="rt"]:checked').value;
  document.getElementById("dmv").textContent = hu(dm, 3); document.getElementById("sdv").textContent = hu(sd, 3);
  const hn = Zc * sd / 5, hc = T24 * Math.sqrt(1 / 25 + ratio) * sd;
  const nl = dm - hn, nu = dm + hn, cl = dm - hc, cu = dm + hc;
  const X = v => 40 + (v + 0.01) / 0.07 * 720;
  el("line", {x1: X(-0.01), y1: 210, x2: X(0.06), y2: 210, stroke: css("--line")});
  for (let t = -0.01; t <= 0.0601; t += 0.01) { el("line", {x1: X(t), y1: 210, x2: X(t), y2: 216, stroke: css("--line")}); el("text", {x: X(t), y: 230, "text-anchor": "middle", "font-size": 12}, hu(t, 2)); }
  el("text", {x: 400, y: 248, "text-anchor": "middle", "font-size": 12}, "különbség d (AUC)");
  // a 25 pont a könyv mintájából, az aktuális átlagra/szórásra skálázva
  DI.forEach((z, i) => el("circle", {cx: X(dm + sd * z), cy: 76 + ((i * 37) % 11 - 5) * 2.2, r: 4, fill: css("--bg"), stroke: css("--fg")}));
  el("line", {x1: X(dm), y1: 30, x2: X(dm), y2: 210, stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: X(dm), y: 24, "text-anchor": "middle", "font-size": 12}, "d̄ = " + hu(dm, 4));
  el("rect", {x: X(nl), y: 105, width: X(nu) - X(nl), height: 16, fill: css("--muted"), stroke: css("--fg")});
  el("text", {x: Math.min(X(nu) + 6, 560), y: 118, "font-size": 12}, `naiv, z·s/√n: [${hu(nl, 4)}; ${hu(nu, 4)}]`);
  el("rect", {x: X(cl), y: 145, width: X(cu) - X(cl), height: 24, fill: "url(#pdiag)", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  el("text", {x: Math.min(X(cu) + 6, 560), y: 162, "font-size": 12}, `Nadeau–Bengio: [${hu(cl, 4)}; ${hu(cu, 4)}]`);
  [[0.01, "alsó határ küszöb 0,01"], [0.02, "hatásnagyság-küszöb 0,02"]].forEach(([v, t], i) => {
    el("line", {x1: X(v), y1: 30, x2: X(v), y2: 210, stroke: css("--fg"), "stroke-dasharray": "2 3"});
    el("text", {x: X(v) - 4, y: 44 + i * 16, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, t); });
  const c1 = dm >= 0.02 - 1e-12, c2 = cl >= 0.01 - 1e-12, ok = c1 && c2;
  const why = ok ? "" : " (ok: " + [c1 ? "" : "átlag < 0,02", c2 ? "" : "korrigált alsó < 0,01"].filter(x => x).join(", ") + ")";
  status.textContent = `naiv: [${hu(nl, 4)}; ${hu(nu, 4)}], korrigált: [${hu(cl, 4)}; ${hu(cu, 4)}] · átlag ≥ 0,02: ${c1 ? "igen" : "nem"} · korrigált alsó ≥ 0,01: ${c2 ? "igen" : "nem"} · döntés: ${ok ? "választjuk" : "nem választjuk" + why}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
