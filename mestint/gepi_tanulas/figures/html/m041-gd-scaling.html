<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GD nyers és standardizált jellemzőkön</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>jellemzők <select id="md" onchange="rebuild()"><option value="raw">nyers</option><option value="std">standardizált</option></select></label><label>η/λ_max = <span id="rtv">0,90</span> <input id="rt" type="range" min="10" max="190" value="90" step="5" oninput="rebuild()" aria-label="eta per lambda max"></label><label>lépésszám = <span id="nsv">30</span> <input id="ns" type="range" min="1" max="200" value="30" oninput="rebuild()" aria-label="lépésszám"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szintvonal-térkép a w1, w2 síkon a gradiens-ereszkedés pályájával; nyers jellemzőknél erősen elnyúlt ellipszisek és lassan haladó pálya, standardizáltnál közel kör alakú szintvonalak és gyors konvergencia."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">N = 200, default_rng(0), x1 ~ N(0, 1), x2 ~ N(0, 10²), y = 3x1 + 0,5x2 + ε, intercept nélkül; L(w) = ‖Xw − y‖²/N. Kondíciószám nyers ≈ 115,1, standardizált ≈ 1,139. η/λ_max > 1 felett a pálya a meredek irányban cikkcakkos, 2 felett divergálna (a csúszka 1,9-nél megáll). Számított modell, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "line": 0, "msg": "lépés 0: L(w) = 34,761, ‖w − w*‖ = 3,1086"}, {"i": 1, "line": 1, "msg": "lépés 1: L(w) = 9,781, ‖w − w*‖ = 3,0467"}, {"i": 2, "line": 1, "msg": "lépés 2: L(w) = 9,399, ‖w − w*‖ = 3,0225"}, {"i": 3, "line": 1, "msg": "lépés 3: L(w) = 9,266, ‖w − w*‖ = 2,9988"}, {"i": 4, "line": 1, "msg": "lépés 4: L(w) = 9,137, ‖w − w*‖ = 2,9754"}, {"i": 5, "line": 1, "msg": "lépés 5: L(w) = 9,010, ‖w − w*‖ = 2,9521"}, {"i": 6, "line": 1, "msg": "lépés 6: L(w) = 8,885, ‖w − w*‖ = 2,9290"}, {"i": 7, "line": 1, "msg": "lépés 7: L(w) = 8,762, ‖w − w*‖ = 2,9061"}, {"i": 8, "line": 1, "msg": "lépés 8: L(w) = 8,641, ‖w − w*‖ = 2,8834"}, {"i": 9, "line": 1, "msg": "lépés 9: L(w) = 8,522, ‖w − w*‖ = 2,8609"}, {"i": 10, "line": 1, "msg": "lépés 10: L(w) = 8,405, ‖w − w*‖ = 2,8385"}, {"i": 11, "line": 1, "msg": "lépés 11: L(w) = 8,289, ‖w − w*‖ = 2,8163"}, {"i": 12, "line": 1, "msg": "lépés 12: L(w) = 8,176, ‖w − w*‖ = 2,7943"}, {"i": 13, "line": 1, "msg": "lépés 13: L(w) = 8,064, ‖w − w*‖ = 2,7725"}, {"i": 14, "line": 1, "msg": "lépés 14: L(w) = 7,954, ‖w − w*‖ = 2,7508"}, {"i": 15, "line": 1, "msg": "lépés 15: L(w) = 7,845, ‖w − w*‖ = 2,7293"}, {"i": 16, "line": 1, "msg": "lépés 16: L(w) = 7,739, ‖w − w*‖ = 2,7079"}, {"i": 17, "line": 1, "msg": "lépés 17: L(w) = 7,633, ‖w − w*‖ = 2,6868"}, {"i": 18, "line": 1, "msg": "lépés 18: L(w) = 7,530, ‖w − w*‖ = 2,6658"}, {"i": 19, "line": 1, "msg": "lépés 19: L(w) = 7,428, ‖w − w*‖ = 2,6449"}, {"i": 20, "line": 1, "msg": "lépés 20: L(w) = 7,328, ‖w − w*‖ = 2,6242"}, {"i": 21, "line": 1, "msg": "lépés 21: L(w) = 7,229, ‖w − w*‖ = 2,6037"}, {"i": 22, "line": 1, "msg": "lépés 22: L(w) = 7,132, ‖w − w*‖ = 2,5834"}, {"i": 23, "line": 1, "msg": "lépés 23: L(w) = 7,036, ‖w − w*‖ = 2,5632"}, {"i": 24, "line": 1, "msg": "lépés 24: L(w) = 6,942, ‖w − w*‖ = 2,5431"}, {"i": 25, "line": 1, "msg": "lépés 25: L(w) = 6,850, ‖w − w*‖ = 2,5232"}, {"i": 26, "line": 1, "msg": "lépés 26: L(w) = 6,758, ‖w − w*‖ = 2,5035"}, {"i": 27, "line": 1, "msg": "lépés 27: L(w) = 6,669, ‖w − w*‖ = 2,4839"}, {"i": 28, "line": 1, "msg": "lépés 28: L(w) = 6,580, ‖w − w*‖ = 2,4645"}, {"i": 29, "line": 1, "msg": "lépés 29: L(w) = 6,493, ‖w − w*‖ = 2,4453"}, {"i": 30, "line": 1, "msg": "lépés 30: L(w) = 6,407, ‖w − w*‖ = 2,4261"}];
const CODE = ["w = np.zeros(2); eta = ratio / lam_max      # lam_max: H = 2 X^T X / N legnagyobb sajátértéke", "for t in range(steps): w = w - eta * (2 / N) * X.T @ (X @ w - y)   # X: (200, 2), w: (2,), y: (200,)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const D = {"raw": {"H": [[1.8481955614248031, -1.3063115370044154], [-1.3063115370044154, 211.80865493707063]], "b": [5.007962828454809, 103.14180348392873], "ws": [3.0672036053809864, 0.5058741672846834], "Ls": 0.9920194507918987, "lmin": 1.8400683941194131, "lmax": 211.81678210437602, "lim": [[-0.3, 3.6], [-0.6, 1.6]]}, "std": {"H": [[2.000000000000001, -0.12981401774923768], [-0.12981401774923768, 2.0000000000000004]], "b": [5.222667548794352, 9.992201877586588], "ws": [2.948035579838423, 5.187449110336558], "Ls": 1.1453029993020993, "lmin": 1.8701859822507627, "lmax": 2.1298140177492386, "lim": [[-0.6, 3.9], [-0.6, 5.8]]}};

function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function mode(){ return document.getElementById("md").value; }
function ratio(){ return +document.getElementById("rt").value / 100; }
function nst(){ return +document.getElementById("ns").value; }
function Lw(M, w){ const d0 = w[0] - M.ws[0], d1 = w[1] - M.ws[1]; return M.Ls + 0.5 * (M.H[0][0]*d0*d0 + 2*M.H[0][1]*d0*d1 + M.H[1][1]*d1*d1); }
function path(){ const M = D[mode()], eta = ratio() / M.lmax; let w = [0, 0]; const P = [w];
  for (let t = 0; t < nst(); t++) { const g0 = M.H[0][0]*w[0] + M.H[0][1]*w[1] - M.b[0], g1 = M.H[1][0]*w[0] + M.H[1][1]*w[1] - M.b[1];
    w = [w[0] - eta * g0, w[1] - eta * g1]; P.push(w); } return P; }
let P = path();
function rebuild(){ document.getElementById("rtv").textContent = fmt(ratio(), 2); document.getElementById("nsv").textContent = nst();
  P = path(); const M = D[mode()];
  setSteps(P.map((w, i) => ({i, line: i ? 1 : 0, msg: ""}))); }
function render(s){
  svg.setAttribute("viewBox", "0 0 790 365"); svg.innerHTML = "";
  const M = D[mode()], fg = css("--fg"), mu = css("--muted"), hl = css("--hl");
  const [xl, yl] = M.lim, X0 = 50, Y0 = 10, H = 320, sc = H / (yl[1] - yl[0]), W = (xl[1] - xl[0]) * sc;
  const tx = v => X0 + (v - xl[0]) * sc, ty = v => Y0 + H - (v - yl[0]) * sc;
  const cp = el("clipPath", {id: "cp"}); const r0 = document.createElementNS(NS, "rect"); r0.setAttribute("x", X0); r0.setAttribute("y", Y0); r0.setAttribute("width", W); r0.setAttribute("height", H); cp.appendChild(r0);
  el("rect", {x: X0, y: Y0, width: W, height: H, fill: "none", stroke: mu});
  // szintvonalak: L = L* + c·λmin/2 ellipszisek a sajátvektorok mentén
  const a = M.H[0][0], b = M.H[0][1], d = M.H[1][1], tr = (a + d) / 2, det = Math.sqrt(((a - d) / 2) ** 2 + b * b);
  const l1 = tr + det, l2 = tr - det, ang = Math.atan2(l1 - a, b || 1e-12);
  const g = el("g", {"clip-path": "url(#cp)"});
  [0.25, 1, 3, 8, 20, 50, 120].forEach(c => { const dl = c * M.lmin / 2; const r1 = Math.sqrt(2 * dl / l1), r2 = Math.sqrt(2 * dl / l2);
    let p = ""; for (let k = 0; k <= 180; k++) { const t = 2 * Math.PI * k / 180, u = r1 * Math.cos(t), v = r2 * Math.sin(t);
      const x = M.ws[0] + u * Math.cos(ang) - v * Math.sin(ang), y = M.ws[1] + u * Math.sin(ang) + v * Math.cos(ang); p += (k ? "L" : "M") + tx(x).toFixed(1) + "," + ty(y).toFixed(1); }
    const e = document.createElementNS(NS, "path"); e.setAttribute("d", p); e.setAttribute("fill", "none"); e.setAttribute("stroke", mu); e.setAttribute("stroke-width", 0.8); g.appendChild(e); });
  const pp = P.slice(0, s.i + 1).map(w => tx(w[0]).toFixed(1) + "," + ty(w[1]).toFixed(1)).join(" ");
  const pl = document.createElementNS(NS, "polyline"); pl.setAttribute("points", pp); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", fg); pl.setAttribute("stroke-width", 1.4); g.appendChild(pl);
  P.slice(0, s.i + 1).forEach((w, i) => { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", tx(w[0])); c.setAttribute("cy", ty(w[1])); c.setAttribute("r", i === s.i ? 5 : 2.5); c.setAttribute("fill", i === s.i ? hl : fg); g.appendChild(c); });
  el("text", {x: tx(M.ws[0]), y: ty(M.ws[1]) + 6, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "×");
  [xl, yl].forEach((lim, j) => { for (let v = Math.ceil(lim[0]); v <= lim[1]; v++) { if (j === 0) el("text", {x: tx(v), y: Y0 + H + 16, "text-anchor": "middle", "font-size": 11}, fmt(v, 0)); else el("text", {x: X0 - 6, y: ty(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 0)); } });
  el("text", {x: X0 + W / 2, y: Y0 + H + 32, "text-anchor": "middle", "font-size": 12}, "w₁");
  el("text", {x: 14, y: Y0 + H / 2, "font-size": 12}, "w₂");
  const kx = X0 + W + 20;
  el("text", {x: kx, y: 40, "font-size": 13, "font-weight": "bold"}, mode() === "raw" ? "nyers jellemzők" : "standardizált");
  el("text", {x: kx, y: 62, "font-size": 12}, `kondíciószám = ${fmt(M.lmax / M.lmin, M.lmax / M.lmin > 10 ? 1 : 3)}`);
  el("text", {x: kx, y: 82, "font-size": 12}, `η = ${fmt(ratio(), 2)} / λ_max`);
  el("text", {x: kx, y: 102, "font-size": 12}, `λ_max = ${fmt(M.lmax, 3)}`);
  el("text", {x: kx, y: 130, "font-size": 12, fill: mu}, "× minimum w*");
  el("text", {x: kx, y: 150, "font-size": 12, fill: mu}, "kezdőpont (0, 0)");
  const w = P[s.i], e = Math.hypot(w[0] - M.ws[0], w[1] - M.ws[1]);
  status.textContent = `lépés ${s.i}/${P.length - 1}: w = (${fmt(w[0], 3)}; ${fmt(w[1], 3)}), L(w) = ${fmt(Lw(M, w), 3)}, ‖w − w*‖ = ${e < 1e-3 ? e.toExponential(2).replace(".", ",") : fmt(e, 4)}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
