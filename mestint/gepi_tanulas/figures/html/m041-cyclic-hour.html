<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciklikus órakódolás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>periódus <select id="per" onchange="onPer()"><option value="24">24 óra</option><option value="7">7 nap</option><option value="12">12 hónap (1–12)</option></select></label><label>t = <span id="tv">23</span> <input id="t" type="range" min="0" max="23" value="23" oninput="draw()" aria-label="t"></label><label>t' = <span id="uv">0</span> <input id="u" type="range" min="0" max="23" value="0" oninput="draw()" aria-label="t vessző"></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 300" role="img" aria-label="Bal oldalon számegyenes 0-tól 23-ig, a két végpont távol; jobb oldalon egységkör a 24 órával, a 23 és 0 óra szomszédos pontok."></svg>
<pre id="code" aria-label="Kód"><span id="L0"></span><span id="L1"></span></pre>
<p class="small">Számított érték: a húrtávolság 2·sin(Δθ/2), ahol Δθ = 2π·min(|t − t'|, T − |t − t'|)/T. A t = 23, t' = 0 kezdőállapotban 0,261; t' = 11-nél (12 óra különbség) 2,000; 11 óra különbségnél (pl. t = 0, t' = 11) 1,983.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const PER = {"24": {T: 24, lo: 0, name: "óra", col: "hour"}, "7": {T: 7, lo: 0, name: "nap", col: "day_of_week"}, "12": {T: 12, lo: 1, name: "hónap", col: "month"}};
const tS = document.getElementById("t"), uS = document.getElementById("u"), pS = document.getElementById("per");
function cfg(){ const P = PER[pS.value]; [tS, uS].forEach(s => { s.min = P.lo; s.max = P.lo + P.T - 1; }); return P; }
function onPer(){ const P = cfg(); tS.value = P.lo + P.T - 1; uS.value = P.lo; draw(); }
function draw(){
  const P = cfg(), T = P.T, t = +tS.value, u = +uS.value;
  document.getElementById("tv").textContent = t; document.getElementById("uv").textContent = u;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl");
  // számegyenes
  const L0 = 30, L1 = 330, LY = 150, sx = v => L0 + (v - P.lo) / (T - 1) * (L1 - L0);
  el("text", {x: 180, y: 40, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "lineáris kódolás");
  el("line", {x1: L0, y1: LY, x2: L1, y2: LY, stroke: fg, "stroke-width": 1.4});
  for (let h = P.lo; h < P.lo + T; h++) { el("line", {x1: sx(h), y1: LY - 5, x2: sx(h), y2: LY + 5, stroke: fg});
    if (T <= 12 || (h - P.lo) % 3 === 0 || h === P.lo + T - 1) el("text", {x: sx(h), y: LY + 22, "text-anchor": "middle", "font-size": 12}, String(h)); }
  el("line", {x1: sx(t), y1: LY - 40, x2: sx(u), y2: LY - 40, stroke: hl, "stroke-width": 2});
  el("text", {x: (sx(t) + sx(u)) / 2, y: LY - 48, "text-anchor": "middle", "font-size": 13}, `|t − t'| = ${Math.abs(t - u)}`);
  el("rect", {x: sx(t) - 6, y: LY - 6, width: 12, height: 12, fill: css("--bg"), stroke: fg, "stroke-width": 2});
  el("rect", {x: sx(u) - 6, y: LY - 6, width: 12, height: 12, fill: fg, stroke: fg});
  el("text", {x: 180, y: LY + 55, "text-anchor": "middle", "font-size": 12, fill: mu}, `${P.name} (t), egyetlen lineáris tengely`);
  // egységkör
  const CX = 510, CY = 165, R = 115, pt = v => [CX + R * Math.cos(2 * Math.PI * v / T), CY - R * Math.sin(2 * Math.PI * v / T)];
  el("text", {x: CX, y: 28, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "ciklikus kódolás (cos, sin)");
  el("line", {x1: CX - R - 20, y1: CY, x2: CX + R + 20, y2: CY, stroke: mu, "stroke-width": 0.6});
  el("line", {x1: CX, y1: CY - R - 20, x2: CX, y2: CY + R + 20, stroke: mu, "stroke-width": 0.6});
  el("circle", {cx: CX, cy: CY, r: R, fill: "none", stroke: mu});
  for (let h = P.lo; h < P.lo + T; h++) { const [x, y] = pt(h); el("circle", {cx: x, cy: y, r: 3, fill: mu});
    if (T <= 12 || (h - P.lo) % 3 === 0) { const [a, b] = [CX + (R + 16) * Math.cos(2 * Math.PI * h / T), CY - (R + 16) * Math.sin(2 * Math.PI * h / T)]; el("text", {x: a, y: b + 4, "text-anchor": "middle", "font-size": 11}, String(h)); } }
  const A = pt(t), B = pt(u);
  el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: hl, "stroke-width": 3});
  el("rect", {x: A[0] - 6, y: A[1] - 6, width: 12, height: 12, fill: css("--bg"), stroke: fg, "stroke-width": 2});
  el("rect", {x: B[0] - 6, y: B[1] - 6, width: 12, height: 12, fill: fg});
  el("text", {x: CX + R + 6, y: CY + R + 22, "font-size": 11, fill: mu, "text-anchor": "end"}, "x_cos →");
  el("text", {x: CX - R - 18, y: CY - R - 6, "font-size": 11, fill: mu}, "↑ x_sin");
  const d = Math.abs(t - u) % T, dm = Math.min(d, T - d), dth = 360 * dm / T, ch = 2 * Math.sin(Math.PI * dm / T);
  status.textContent = `T = ${T}: t = ${t}, t' = ${u}; lineáris távolság |t − t'| = ${Math.abs(t - u)}; szögkülönbség Δθ = ${fmt(dth, 1)}°; húrtávolság 2·sin(Δθ/2) = ${fmt(ch, 3)}`;
  const f = (v) => fmt(v, 4);
  const lines = [`df['${P.col}_sin'] = np.sin(2 * np.pi * df['${P.col}'] / ${T})   # t = ${t}: ${f(Math.sin(2*Math.PI*t/T))},  t' = ${u}: ${f(Math.sin(2*Math.PI*u/T))}`,
                 `df['${P.col}_cos'] = np.cos(2 * np.pi * df['${P.col}'] / ${T})   # t = ${t}: ${f(Math.cos(2*Math.PI*t/T))},  t' = ${u}: ${f(Math.cos(2*Math.PI*u/T))}`];
  const c = document.getElementById("code"); c.innerHTML = "";
  lines.forEach(l => { const s = document.createElement("span"); s.textContent = l; s.className = "on"; c.appendChild(s); });
}
draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
