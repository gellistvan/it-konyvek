<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA-mellékág</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>rang r: <select id="r"><option>1</option><option>2</option><option>4</option><option selected>8</option><option>16</option><option>64</option></select></label><label>α: <select id="a"><option>8</option><option selected>16</option><option>32</option></select></label><label><input id="rs" type="checkbox"> α/√r (rsLoRA) az α/r helyett</label><span class="small">Kattints egy blokkra a shape-ért.</span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 670 366" role="img" aria-label="Az X bemenet egy befagyasztott W0 ágon és egy A, B mátrixokból álló r szélességű tanítható ágon halad át, a két kimenet összege Y; alul a teljes és a LoRA-paraméterszám aránya."></svg>

<p class="small">d_be = d_ki = 4096. Az alsó ág rajzolt szélessége r logaritmusával nő (vizuális jelzés, nem arányos).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const D = {"d": 4096, "init": {"full": 16777216, "lora": 65536, "ratio": 256.0, "scale": 2.0}};

let info = "";
function sp(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function blk(x, y, w, h, label, shape, frozen, train){
  const g = el("g", {tabindex: 0, style: "cursor:pointer", role: "button", "aria-label": label + " " + shape});
  el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: frozen ? "url(#hatch)" : css("--cell"), stroke: css("--line"), "stroke-width": train ? 3 : 1.2}, undefined, g);
  el("text", {x: x + w / 2, y: y + h / 2 - 2, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, label, g);
  el("text", {x: x + w / 2, y: y + h / 2 + 15, "text-anchor": "middle", "font-size": 11}, shape, g);
  const go = () => { info = label + ": " + shape + (frozen ? " – befagyasztva" : train ? " – tanítható" : ""); draw(); };
  g.addEventListener("click", go); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
}
function arr(x1, y1, x2, y2){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.4, "marker-end": "url(#ah)"}); }
function draw(){
  const r = +document.getElementById("r").value, a = +document.getElementById("a").value, rs = document.getElementById("rs").checked;
  const full = D.d * D.d, p = 2 * D.d * r, sc = rs ? a / Math.sqrt(r) : a / r;
  svg.innerHTML = '<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="' + css("--fill") + '"/><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.4"/></pattern>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  blk(10, 110, 80, 60, "X", "(N × " + D.d + ")", false, false);
  blk(170, 20, 230, 70, "W₀ᵀ", "(" + D.d + " × " + D.d + ")", true, false);
  const bw = Math.max(6, Math.min(50, 6 + 7 * Math.log2(r)));   // ág szélessége ~ log r (vizuális)
  const bh = 110, xa = 120, xm = xa + bw + 50, xb = xm + 110, sx = xb + bw + 50;
  blk(xa, 170, bw + 30, bh, "Aᵀ", D.d + "×" + r, false, true);
  blk(xm, 200, 80, 50, "N×" + r, "köztes", false, false);
  blk(xb, 170, bw + 30, bh, "Bᵀ", r + "×" + D.d, false, true);
  el("rect", {x: sx, y: 205, width: 92, height: 40, rx: 6, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: sx + 46, y: 230, "text-anchor": "middle", "font-size": 13}, (rs ? "α/√r = " : "α/r = ") + fmt(sc, 3).replace(/,?0+$/, ""));
  el("circle", {cx: 545, cy: 140, r: 16, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
  el("text", {x: 545, y: 146, "text-anchor": "middle", "font-size": 20}, "+");
  blk(580, 110, 80, 60, "Y", "(N × " + D.d + ")", false, false);
  arr(90, 130, 170, 60); arr(90, 150, xa, 220); arr(xa + bw + 30, 225, xm, 225); arr(xm + 80, 225, xb, 225);
  arr(xb + bw + 30, 225, sx, 225); arr(sx + 92, 220, 532, 150); arr(400, 55, 532, 132); arr(561, 140, 580, 140);
  el("text", {x: xa, y: 300, "font-size": 11, fill: css("--muted")}, "vastag keret: tanítható; sraffozott: befagyasztva; init.: B = 0 → ΔW = 0");
  // paraméterszám-sáv
  const W = 620;
  el("rect", {x: 20, y: 322, width: W, height: 16, fill: "url(#hatch)", stroke: css("--line")});
  el("rect", {x: 20, y: 344, width: Math.max(1.5, W * p / full), height: 16, fill: css("--fg")});
  el("text", {x: 24, y: 318, "font-size": 12}, "teljes ΔW: " + sp(full));
  el("text", {x: 26 + Math.max(1.5, W * p / full), y: 357, "font-size": 12}, "LoRA: " + sp(p) + " (" + fmt(full / p, full % p ? 1 : 0) + "× kevesebb)");
  status.textContent = "r = " + r + ", α = " + a + ": skálázás " + (rs ? "α/√r = " : "α/r = ") + fmt(sc, 3).replace(/,?0+$/, "") + "; LoRA-paraméterek d_ki·r + r·d_be = " + sp(p) + ", teljes " + sp(full) + ", arány " + fmt(full / p, 1).replace(/,0$/, "") + "×" + (info ? "  | " + info : "");
}
["r", "a", "rs"].forEach(id => document.getElementById(id).addEventListener("change", () => { info = ""; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
