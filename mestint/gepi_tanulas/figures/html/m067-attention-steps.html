<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skálázott pontszorzat figyelem lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label><input id="mk" type="checkbox"> maszk M12 (az 1. token csak önmagát látja)</label>
<label><input id="sc" type="checkbox" checked> skálázás ÷√d_k</label>
<span class="small">(kattints egy A- vagy O-cellára a képletért)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kis mátrixok: a pontszámok 2 és 0, a softmax után 0,88 és 0,12 soronként, a kimenet (1,24; 2,24) és (2,76; 3,76); maszkkal az első sor súlya (1, 0)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 18.3.4 kézi számpéldája (Q = K, N = 2, d_k = 4, d_v = 2); a számok a fejezet forward-jának NumPy-átiratából. Skálázás nélkül S = [[4, 0], [0, 4]], és az A sora 0,982 / 0,018 – a softmax telítődik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 1, "line": 0, "msg": "1. QKᵀ = [[4, 0], [0, 4]] (query × key pontszorzatok)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 2, "line": 0, "msg": "2. S = QKᵀ / √4 = 2: [[2, 0], [0, 2]]"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 3, "line": 3, "msg": "3. A = softmax(S, dim=−1): 1. sor (0,8808; 0,1192), 2. sor (0,1192; 0,8808)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 4, "line": 4, "msg": "4. O = AV: (1,2384; 2,2384) és (2,7616; 3,7616)"}, {"k": 5, "line": 2, "raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "msg": "5. maszk M12 = 0: S12 = −∞, A első sora (1,0000; 0,0000), O első sora (1,0000; 2,0000); a 2. sor változatlan"}];
const CODE = ["scores = Q @ K.transpose(-2, -1) / math.sqrt(self.d_k)       # (N, N)", "if mask is not None:", "    scores = scores.masked_fill(~allowed, torch.finfo(scores.dtype).min)", "weights = torch.softmax(scores, dim=-1)                      # (N, N)", "out = weights @ V                                            # (N, d_v)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"01": [{"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 1, "line": 0, "msg": "1. QKᵀ = [[4, 0], [0, 4]] (query × key pontszorzatok)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 2, "line": 0, "msg": "2. S = QKᵀ / √4 = 2: [[2, 0], [0, 2]]"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 3, "line": 3, "msg": "3. A = softmax(S, dim=−1): 1. sor (0,8808; 0,1192), 2. sor (0,1192; 0,8808)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[0.8808, 0.1192], [0.1192, 0.8808]], "O": [[1.2384, 2.2384], [2.7616, 3.7616]], "M": [[false, false], [false, false]], "k": 4, "line": 4, "msg": "4. O = AV: (1,2384; 2,2384) és (2,7616; 3,7616)"}, {"k": 5, "line": 2, "raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "msg": "5. maszk M12 = 0: S12 = −∞, A első sora (1,0000; 0,0000), O első sora (1,0000; 2,0000); a 2. sor változatlan"}], "00": [{"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[0.982, 0.018], [0.018, 0.982]], "O": [[1.036, 2.036], [2.964, 3.964]], "M": [[false, false], [false, false]], "k": 1, "line": 0, "msg": "1. QKᵀ = [[4, 0], [0, 4]] (query × key pontszorzatok)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[0.982, 0.018], [0.018, 0.982]], "O": [[1.036, 2.036], [2.964, 3.964]], "M": [[false, false], [false, false]], "k": 2, "line": 0, "msg": "2. S = QKᵀ (skálázás kikapcsolva): [[4, 0], [0, 4]]"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[0.982, 0.018], [0.018, 0.982]], "O": [[1.036, 2.036], [2.964, 3.964]], "M": [[false, false], [false, false]], "k": 3, "line": 3, "msg": "3. A = softmax(S, dim=−1): 1. sor (0,9820; 0,0180), 2. sor (0,0180; 0,9820)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[0.982, 0.018], [0.018, 0.982]], "O": [[1.036, 2.036], [2.964, 3.964]], "M": [[false, false], [false, false]], "k": 4, "line": 4, "msg": "4. O = AV: (1,0360; 2,0360) és (2,9640; 3,9640)"}, {"k": 5, "line": 2, "raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "msg": "5. maszk M12 = 0: S12 = −∞, A első sora (1,0000; 0,0000), O első sora (1,0000; 2,0000); a 2. sor változatlan"}], "11": [{"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "k": 1, "line": 0, "msg": "1. QKᵀ = [[4, 0], [0, 4]] (query × key pontszorzatok)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "k": 2, "line": 0, "msg": "2. S = QKᵀ / √4 = 2: [[2, −∞], [0, 2]]"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "k": 3, "line": 3, "msg": "3. A = softmax(S, dim=−1): 1. sor (1,0000; 0,0000), 2. sor (0,1192; 0,8808)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "k": 4, "line": 4, "msg": "4. O = AV: (1,0000; 2,0000) és (2,7616; 3,7616)"}, {"k": 5, "line": 2, "raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[2.0, 0.0], [0.0, 2.0]], "A": [[1.0, 0.0], [0.1192, 0.8808]], "O": [[1.0, 2.0], [2.7616, 3.7616]], "M": [[false, true], [false, false]], "msg": "5. maszk M12 = 0: S12 = −∞, A első sora (1,0000; 0,0000), O első sora (1,0000; 2,0000); a 2. sor változatlan"}], "10": [{"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "k": 1, "line": 0, "msg": "1. QKᵀ = [[4, 0], [0, 4]] (query × key pontszorzatok)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "k": 2, "line": 0, "msg": "2. S = QKᵀ (skálázás kikapcsolva): [[4, −∞], [0, 4]]"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "k": 3, "line": 3, "msg": "3. A = softmax(S, dim=−1): 1. sor (1,0000; 0,0000), 2. sor (0,0180; 0,9820)"}, {"raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "k": 4, "line": 4, "msg": "4. O = AV: (1,0000; 2,0000) és (2,9640; 3,9640)"}, {"k": 5, "line": 2, "raw": [[4.0, 0.0], [0.0, 4.0]], "S": [[4.0, 0.0], [0.0, 4.0]], "A": [[1.0, 0.0], [0.018, 0.982]], "O": [[1.0, 2.0], [2.964, 3.964]], "M": [[false, true], [false, false]], "msg": "5. maszk M12 = 0: S12 = −∞, A első sora (1,0000; 0,0000), O első sora (1,0000; 2,0000); a 2. sor változatlan"}]};
function key(){ return (document.getElementById("mk").checked ? "1" : "0") + (document.getElementById("sc").checked ? "1" : "0"); }
document.getElementById("mk").addEventListener("change", () => { const kk = k; setSteps(ALL[key()]); show(kk); });
document.getElementById("sc").addEventListener("change", () => { const kk = k; setSteps(ALL[key()]); show(kk); });
function f4(x){ return x.toFixed(4).replace(".", ","); }
function mat(x0, y0, M, title, cols, opts){
  const c = 64, h = 40, vmax = opts.vmax;
  el("text", {x: x0 + c, y: y0 - 10, "text-anchor": "middle", "font-size": 13, "font-weight": opts.on ? "bold" : "normal", fill: opts.on ? css("--hl") : null}, title);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const masked = opts.M && opts.M[i][j], v = M[i][j], g = masked ? 0 : Math.min(1, Math.abs(v) / vmax);
    const r = el("rect", {x: x0 + j * c, y: y0 + i * h, width: c, height: h, fill: `rgba(128,128,128,${0.15 + 0.6 * g})`, stroke: css("--line"), "stroke-width": opts.on ? 2 : 1, style: opts.click ? "cursor:pointer" : ""});
    if (masked) el("rect", {x: x0 + j * c, y: y0 + i * h, width: c, height: h, fill: "url(#hm)"});
    el("text", {x: x0 + j * c + c / 2, y: y0 + i * h + 25, "text-anchor": "middle", "font-size": 14}, masked ? "−∞" : (opts.int ? String(v) : f4(v)));
    if (opts.click) r.addEventListener("click", () => { status.textContent = opts.click(i, j); });
  }
  cols.forEach((t, j) => el("text", {x: x0 + j * c + c / 2, y: y0 + 2 * h + 15, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, t));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 250"); svg.innerHTML = "";
  const d = document.createElementNS(NS, "defs"); d.innerHTML = `<pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0,7 L7,0" stroke="${css("--line")}" stroke-width="1.2"/></pattern>`; svg.appendChild(d);
  el("text", {x: 10, y: 22, "font-size": 12, fill: css("--muted")}, "Q = K = [[2,0,0,0],[0,2,0,0]] (2×4), V = [[1,2],[3,4]] (2×2), d_k = 4; sorok: query 1/2");
  const y0 = 70, xs = [20, 205, 390, 575], kc = ["key 1", "key 2"], vc = ["érték-dim 1", "érték-dim 2"];
  const A = s.A, O = s.O;
  mat(xs[0], y0, s.raw, "QKᵀ", kc, {vmax: 4, int: true, on: s.k === 1});
  if (s.k >= 2) mat(xs[1], y0, s.S, s.k === 5 ? "S (maszkkal)" : "S", kc, {vmax: 4, int: true, on: s.k === 2 || s.k === 5, M: s.M});
  if (s.k >= 3) mat(xs[2], y0, A, "A = softmax(S)", kc, {vmax: 1, on: s.k === 3 || s.k === 5,
     click: (i, j) => `a${i + 1}${j + 1} = exp(s${i + 1}${j + 1}) / Σ_j exp(s${i + 1}j) = ${f4(A[i][j])}; a sor összege ${f4(A[i][0] + A[i][1])}`});
  if (s.k >= 4) mat(xs[3], y0, O, "O = AV", vc, {vmax: 4, on: s.k === 4 || s.k === 5,
     click: (i, j) => `o${i + 1}${j + 1} = ${f4(A[i][0])}·${[1, 2][j]} + ${f4(A[i][1])}·${[3, 4][j]} = ${f4(O[i][j])}`});
  for (let i = 0; i < 3; i++) if (s.k >= i + 2) el("text", {x: xs[i + 1] - 26, y: y0 + 48, "font-size": 20, fill: css("--muted")}, "→");
  if (s.k >= 3) for (let i = 0; i < 2; i++) el("line", {x1: xs[2] + 6, x2: xs[2] + 122, y1: y0 + i * 40 + 34, y2: y0 + i * 40 + 34, stroke: css("--hl2"), "stroke-width": 1, "stroke-dasharray": "2 3"});
  el("text", {x: 10, y: 236, "font-size": 11, fill: css("--muted")}, "a softmax soronként normál (narancs pontozott vonal: a sor, amely 1-re összegződik); sraffozott: −∞ (maszkolt)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
