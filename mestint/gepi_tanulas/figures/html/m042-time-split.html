<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Időbeli és csoportos split</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód <select id="mode" onchange="rebuild()"><option value="time">időbeli (TimeSeriesSplit)</option><option value="group">csoportos (GroupKFold)</option><option value="kf">véletlen KFold</option></select></label><label>n_splits = <span id="nsv">5</span> <input id="ns" type="range" min="2" max="10" value="5" oninput="rebuild()" aria-label="n_splits"></label><label>test_size = <span id="tsv">10</span> <input id="ts" type="range" min="5" max="20" value="10" oninput="rebuild()" aria-label="test_size"></label><label>gap = <span id="gapv">0</span> <input id="gap" type="range" min="0" max="10" value="0" oninput="rebuild()" aria-label="gap"></label><label>max_train_size <select id="mts" onchange="rebuild()"><option value="0">nincs</option><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="40">40</option><option value="50">50</option><option value="60">60</option><option value="70">70</option><option value="80">80</option><option value="90">90</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt sor, mindegyikben balról növekvő tanítósáv és utána egy tízmintás tesztsáv; a vezérlőkkel a gap, a max_train_size, valamint a csoportos és a véletlen felosztás is megjeleníthető."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">100 minta. A TimeSeriesSplit beosztását a lap a scikit-learn 1.9.1 logikájával számolja (6660 beállításon a futtatott sklearn-kimenettel egyezik); a GroupKFold és a KFold(shuffle=True, random_state=0) kiosztása a futtatott scikit-learn 1.9.1 eredménye.</p>

const V = id => document.getElementById(id);

function tss(n, p){ const out = []; if (p.ns * p.ts + 1 > n) return null;
  for (let st = n - p.ns * p.ts; st < n; st += p.ts) { const hi = st - p.gap - 1, lo = p.mts === null ? 0 : Math.max(0, st - p.gap - p.mts); if (hi < lo) return null; out.push([lo, hi, st, st + p.ts - 1]); } return out; }

  if (p.mode === "time") { const F = tss(100, p)[f]; for (let i = 0; i < 100; i++) k[i] = i >= F[0] && i <= F[1] ? "train" : (i > F[1] && i < F[2] ? "gap" : (i >= F[2] && i <= F[3] ? "test" : "none")); }
  else { const A = (p.mode === "group" ? D.gkf : D.kf)[p.ns]; for (let i = 0; i < 100; i++) k[i] = A[i] === f ? "test" : "train"; }
  return k; }

function foldText(p, f){
  if (p.mode === "time") { const F = tss(100, p)[f]; return `Fold ${f}: train=${F[0]}..${F[1]}, test=${F[2]}..${F[3]}`; }
  const A = (p.mode === "group" ? D.gkf : D.kf)[p.ns], te = [];
  for (let i = 0; i < 100; i++) if (A[i] === f) te.push(i);
  if (p.mode === "group") { const g = [...new Set(te.map(i => Math.floor(i / 5)))]; return `Fold ${f}: test groups=[${g.join(" ")}] (${te.length} minta), train groups = a többi ${20 - g.length}`; }

}

  const p = prm();

  const L = [{f: -1, line: 0, msg: ""}]; for (let f = 0; f < p.ns; f++) L.push({f, line: 2, msg: ""});
  setSteps(L);
}

  const lg = [["train", "train"], ["gap", "gap (purge)"], ["test", "teszt"], ["none", "nem használt"]];
  let lx = X0 + 330; lg.forEach(([kk, t]) => { el("rect", {x: lx, y: ay + 24, width: 14, height: 12, fill: FILL[kk], stroke: fg, "stroke-width": 0.6}); el("text", {x: lx + 18, y: ay + 34, "font-size": 11}, t); lx += 30 + t.length * 6.2; });
  const out = s.f >= 0 ? foldText(p, s.f) : [...Array(n).keys()].map(f => foldText(p, f)).join(" | ");
  status.textContent = (s.f >= 0 ? "" : "Az összes fold – ") + out;
  const c0 = document.getElementById("L0"), c4 = document.getElementById("L4");
  if (c0) c0.textContent = p.mode === "time" ? `tscv = TimeSeriesSplit(n_splits=${n}, test_size=${p.ts}${p.gap ? ", gap=" + p.gap : ""}${p.mts ? ", max_train_size=" + p.mts : ""})` : (p.mode === "group" ? `tscv = GroupKFold(n_splits=${n})   # split(X, y, groups=groups)` : `tscv = KFold(n_splits=${n}, shuffle=True, random_state=0)`);
  if (c4) c4.textContent = "# kimenet: " + (s.f >= 0 ? foldText(p, s.f) : foldText(p, 0) + " …");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
