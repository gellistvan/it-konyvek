<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Few-shot prompt vágása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>L_max = <span id="Lv"></span> <input id="L" type="range" min="32" max="512" value="58"></label><label>példák k = <span id="kv"></span> <input id="k" type="range" min="0" max="8" value="4"></label><label>lekérdezés = <span id="qv"></span> token <input id="q" type="range" min="5" max="60" value="11"></label></div><div class="ctl" role="radiogroup" aria-label="truncation_side"><label><input type="radio" name="side" value="right" checked> truncation_side="right" (alapértelmezés)</label><label><input type="radio" name="side" value="left"> truncation_side="left"</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 210" role="img" aria-label="Tokensáv utasítással, a példákkal és a lekérdezéssel; a maximális hossz jelölő alatt a vágott változat: jobbra vágva a lekérdezés, balra vágva az utasítás és az első példák esnek ki."></svg>
<pre id="txt" style="white-space:pre-wrap;font:12.5px/1.5 ui-monospace,monospace;background:var(--code);padding:6px 8px;margin:6px 0 0"></pre><style>#txt del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}</style>
<p class="small">Szemléltető tokenszámok (nem egy konkrét tokenizáló mért értékei); k > 4 esetén a 4 példa ismétlődik. A szöveg áthúzása a tokenarány szerinti karakterközelítés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");
const D = {"instr": ["P", "Classify sentiment.", 5], "ex": [["The plot was clever and the acting superb.", 12, "positive"], ["A complete waste of two hours.", 9, "negative"], ["I enjoyed every moment of this delightful comedy.", 13, "positive"], ["The dialogue felt forced and the pacing was terrible.", 13, "negative"]], "y": 4, "query": ["The service was slow and rude.", 11], "init": {"kr": [5, 12, 4, 9, 4, 13, 4, 7, 0, 0], "kl": [0, 0, 0, 9, 4, 13, 4, 13, 4, 11], "tot": 79}};

function segs(k, ql){
  const s = [{kind: "P", lab: "P", text: D.instr[1], n: D.instr[2]}];
  for (let i = 0; i < k; i++) { const e = D.ex[i % 4];
    s.push({kind: "x", lab: "x" + (i + 1), text: "Text: " + e[0], n: e[1]});
    s.push({kind: "y", lab: "y" + (i + 1), text: " Sentiment: " + e[2], n: D.y}); }
  s.push({kind: "q", lab: "xq", text: "Text: " + D.query[0] + " Sentiment:", n: ql});
  return s;
}
function cutJS(s, L, side){
  const tot = s.reduce((a, b) => a + b.n, 0), drop = Math.max(0, tot - L), keep = [];
  if (side === "right") { let rem = L; s.forEach(q => { keep.push(Math.min(q.n, Math.max(0, rem))); rem -= q.n; }); }
  else { let rem = drop; s.forEach(q => { const d = Math.min(q.n, Math.max(0, rem)); keep.push(q.n - d); rem -= q.n; }); }
  return {tot: tot, keep: keep};
}
function esc(t){ return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function draw(){
  const L = +document.getElementById("L").value, k = +document.getElementById("k").value, ql = +document.getElementById("q").value;
  const side = document.querySelector('input[name=side]:checked').value;
  document.getElementById("Lv").textContent = L; document.getElementById("kv").textContent = k; document.getElementById("qv").textContent = ql;
  const s = segs(k, ql), r = cutJS(s, L, side), tot = r.tot;
  svg.innerHTML = "";
  const X0 = 20, W = 620, span = Math.max(tot, L) * 1.04, sc = W / span;
  const fill = {P: css("--fill2"), x: css("--cell"), y: css("--fg"), q: css("--cell")};
  function band(y, keep, title){
    el("text", {x: X0, y: y - 8, "font-size": 12}, title);
    let x = X0;
    s.forEach((q, i) => { const w = q.n * sc;
      el("rect", {x: x, y: y, width: w, height: 26, fill: fill[q.kind], stroke: css("--line"), "stroke-width": q.kind === "q" ? 3 : 0.8});
      if (q.kind === "x") for (let h = x + 4; h < x + w; h += 6) el("line", {x1: h, y1: y + 26, x2: Math.min(h + 6, x + w), y2: y + 26 - Math.min(26, (Math.min(h + 6, x + w) - h) * 4.33), stroke: css("--muted"), "stroke-width": 0.7});
      if (keep && keep[i] < q.n) { const a = side === "right" ? x + keep[i] * sc : x, b = side === "right" ? x + w : x + (q.n - keep[i]) * sc;
        el("rect", {x: a, y: y, width: b - a, height: 26, fill: css("--bg"), opacity: 0.8, stroke: css("--line"), "stroke-width": 0.6});
        el("line", {x1: a, y1: y + 13, x2: b, y2: y + 13, stroke: css("--hl2"), "stroke-width": 2.5}); }
      if (w > 16) el("text", {x: x + w / 2, y: y + 42, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, q.lab);
      x += w; });
  }
  band(40, null, "teljes prompt: " + tot + " token (szemléltető)");
  band(130, r.keep, 'truncation_side="' + side + '" után (' + Math.min(tot, L) + " token)");
  const lx = X0 + (side === "right" ? L : Math.max(0, tot - L)) * sc;
  el("line", {x1: lx, y1: 115, x2: lx, y2: 190, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": "6 4"});
  el("text", {x: lx + 4, y: 196, "font-size": 12}, side === "right" ? "L_max = " + L + " (az eleje marad)" : "az utolsó " + L + " token marad");
  const qi = s.length - 1, qok = r.keep[qi] === s[qi].n;
  status.innerHTML = (tot <= L ? "A prompt elfér (" + tot + " ≤ " + L + " token), nincs vágás." :
    "A prompt " + tot + " token > L_max = " + L + ": " + (tot - L) + " token levágva " + (side === "right" ? "a végéről." : "az elejéről.")) +
    (qok ? " A lekérdezés teljes." : ' <span class="warn">A lekérdezés vágva! (' + r.keep[qi] + "/" + s[qi].n + " token maradt)</span>");
  // szöveg: a levágott rész áthúzva (karakterarány a tokenarány szerint, közelítés)
  const html = s.map((q, i) => { const kk = r.keep[i], t = q.text + (q.kind === "y" || q.kind === "P" ? "\n" : "");
    if (kk >= q.n) return esc(t);
    const c = Math.round(t.length * kk / q.n);
    return side === "right" ? esc(t.slice(0, c)) + "<del>" + esc(t.slice(c)) + "</del>" : "<del>" + esc(t.slice(0, t.length - c)) + "</del>" + esc(t.slice(t.length - c)); }).join("");
  document.getElementById("txt").innerHTML = html;
}
["L", "k", "q"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.querySelectorAll("input[name=side]").forEach(e => e.addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
(function(){ const s = segs(4, D.query[1]); const a = cutJS(s, 58, "right"), b = cutJS(s, 58, "left");
  document.body.dataset.selfcheck = (JSON.stringify([a.keep, b.keep, a.tot]) === JSON.stringify([D.init.kr, D.init.kl, D.init.tot])) ? "OK" : "ELTÉRÉS"; })();
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
