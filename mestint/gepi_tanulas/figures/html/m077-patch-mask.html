<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patch-maszkolás: BERT és MAE</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>maszkarány <input id="rat" type="range" min="0.1" max="0.9" step="0.05" value="0.6" oninput="ratio=+this.value; document.getElementById('rv').textContent=fmt2(ratio)+' → '+Math.round(ratio*49)+' / 49'; newMask(); show(k)" aria-label="maszkarány"> <b id="rv">0,60 → 29 / 49</b></label>
<button onclick="newMask(); show(k)">Új maszk</button>
<label><input type="radio" name="md" checked onchange="modeMAE=false; show(k)"> BERT</label><label><input type="radio" name="md" onchange="modeMAE=true; show(k)"> MAE</label>
<script>function fmt2(x){ return x.toFixed(2).replace('.', ','); }</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy 28×28-as számjegy 7×7 foltrácsra bontva, maszkolt foltokkal, és a BERT- ill. MAE-stílusú kódolás tokensora és alakjai."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltetés, nem mérés: szintetikus 7-es (nem MNIST-kép). A kezdő maszk a statikus ábráé (numpy, seed 0); az „Új maszk” rögzített kezdőértékű JS-generátorral húz. Kód: a 21.1.9 labor vázlata (a MAE-változat a vázlat bővítése, nem része).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "line": 0, "msg": "1. patchify: a 28×28-as kép 7×7 = 49 foltra bomlik, foltonként 16 pixel: (B, 49, 16)."}, {"ph": 1, "line": 1, "msg": "2. maszk: a foltok egy része (alapból 29/49) maszkolt; a maszk (B, 49) logikai tömb."}, {"ph": 2, "line": 2, "msg": "3. embedding: BERT-módban a maszkolt helyre [MASK]-token kerül; MAE-módban a maszkolt foltok kimaradnak az encoder bemenetéből."}, {"ph": 3, "line": 3, "msg": "4. encoder: a bemenet alakja a módtól függ (BERT: 49 token, MAE: csak a látható tokenek)."}, {"ph": 4, "line": 4, "msg": "5. veszteség: MSE csak a maszkolt pozíciókon (a látható foltok rekonstrukciója nem számít)."}];
const CODE = ["patches = patchify(img)                  # (B, 1, 28, 28) -> (B, 49, 16)", "mask = random_patch_mask(img.shape[0], ratio, gen)   # n_mask = round(ratio*49); True = maszkolt", "z = torch.where(mask[..., None], self.mask_token.expand_as(z), z) + self.pos   # (B, 49, dim)", "h = self.encoder(z)                      # BERT: (B, 49, dim); MAE: csak a látható tokenek", "loss = F.mse_loss(pred[mask], patches[mask])      # csak a maszkolt foltokon"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fmt(x, d){ return Number(x).toFixed(d).replace(".", ",").replace("-", "−"); }
let ratio = 0.6, maskArr = [false, true, true, true, true, false, true, false, true, false, true, true, false, false, false, false, true, false, true, true, true, true, true, true, false, false, true, true, true, false, true, false, true, false, true, true, true, true, true, false, false, false, true, false, true, false, true, true, false], seedTxt = "numpy seed 0", modeMAE = false, mseed = 0;

function nMask(){ return Math.round(ratio * 49); }
function newMask(){ mseed += 1; let a = 2463534242 + mseed * 7919; const r = () => { a = (a * 1103515245 + 12345) % 2147483648; return a / 2147483648; };
  const ids = [...Array(49).keys()].map(i => [r(), i]).sort((p, q) => p[0] - q[0]).map(p => p[1]); const m = Array(49).fill(false); ids.slice(0, nMask()).forEach(i => m[i] = true); maskArr = m; seedTxt = "JS seed " + mseed; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), wr = css("--hl2");
  const defs = document.createElementNS(NS, "defs"); defs.innerHTML = `<pattern id="pd" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${fg}" stroke-width="1.2"/></pattern>`; svg.appendChild(defs);
  const nm = maskArr.filter(x => x).length, nv = 49 - nm;
  // kép
  const cs = 8, x0 = 14, y0 = 40;
  for (let r = 0; r < 28; r++) for (let c = 0; c < 28; c++) if (IMG[r * 28 + c] > 0) el("rect", {x: x0 + c*cs, y: y0 + r*cs, width: cs, height: cs, fill: fg, "fill-opacity": IMG[r*28+c]});
  el("rect", {x: x0, y: y0, width: 28*cs, height: 28*cs, fill: "none", stroke: fg});
  if (s.ph >= 0) for (let k = 1; k < 7; k++){ el("line", {x1: x0 + 4*k*cs, y1: y0, x2: x0 + 4*k*cs, y2: y0 + 28*cs, stroke: mu, "stroke-width": 0.8}); el("line", {x1: x0, y1: y0 + 4*k*cs, x2: x0 + 28*cs, y2: y0 + 4*k*cs, stroke: mu, "stroke-width": 0.8}); }
  if (s.ph >= 1) maskArr.forEach((m, i) => { if (m){ const r = Math.floor(i / 7), c = i % 7; el("rect", {x: x0 + c*32, y: y0 + r*32, width: 32, height: 32, fill: "url(#pd)", stroke: wr, "stroke-width": 0.8, opacity: 0.8}); } });
  el("text", {x: x0, y: y0 - 12, "font-size": 12.5}, s.ph >= 1 ? `${nm} / 49 maszkolt folt (${seedTxt})` : "28×28 kép, 4×4-es foltok");
  // tokensor + dobozok
  const X = 270; let y = 60;
  el("text", {x: X, y: 30, "font-size": 13, "font-weight": "bold"}, modeMAE ? "MAE-stílus" : "BERT-stílus");
  const toks = modeMAE && s.ph >= 2 ? maskArr.map((m, i) => [m, i]).filter(p => !p[0]) : maskArr.map((m, i) => [m, i]);
  const tw = Math.min(14, 350 / toks.length);
  toks.forEach(([m, i], j) => { const mm = s.ph >= 1 && m; el("rect", {x: X + j * tw, y: y, width: tw - 1, height: 22, fill: mm ? (s.ph >= 2 ? css("--cellhl") : "url(#pd)") : fg, stroke: fg, "stroke-width": 0.5});
    if (mm && s.ph >= 2 && tw >= 7) el("text", {x: X + j*tw + tw/2 - 0.5, y: y + 15, "text-anchor": "middle", "font-size": 9}, "M"); });
  el("text", {x: X, y: y + 40, "font-size": 12.5}, s.ph < 2 ? "patchify: (B, 49, 16)" : (modeMAE ? `encoder bemenete: (B, ${nv}, dim) – csak a látható tokenek` : "encoder bemenete: (B, 49, dim) – [MASK]-tokennel"));
  function box(bx_, by_, w, t, on){ el("rect", {x: bx_, y: by_, width: w, height: 34, rx: 6, fill: css("--bg"), stroke: on ? hl : fg, "stroke-width": on ? 3 : 1.3}); el("text", {x: bx_ + w/2, y: by_ + 22, "text-anchor": "middle", "font-size": 12.5}, t); }
  function ar(x1, y1, x2, y2){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: fg, "stroke-width": 1.4}); el("path", {d: `M${x2},${y2} l-7,-4 l0,8 z`, fill: fg}); }
  y = 140;
  if (!modeMAE){

    box(X, y, 160, `encoder (B, ${nv}, dim)`, s.ph === 3); ar(X + 160, y + 17, X + 180, y + 17);

}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
