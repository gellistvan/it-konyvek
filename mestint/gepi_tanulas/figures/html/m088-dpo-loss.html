<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPO-veszteség és gradienssúly</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>
<div class="ctl"><label>β = <span id="bv"></span> <input id="b" type="range" min="0.01" max="1" step="0.01" value="0.1"></label><label><input id="bad" type="checkbox" checked> rosszul rangsorolt pár (Δ &lt; 0) kiemelése</label><span class="small">A narancs pont húzható (vagy fókuszban ←/→).</span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 300" role="img" aria-label="A DPO-veszteség és a gradienssúly a marzs függvényében; minden veszteséggörbe Δ = 0-ban 0,693, nagyobb β meredekebb görbét és élesebb súlyátmenetet ad."></svg>

<p class="small">Számított függvényalak, nem mérés. Δ = log π_θ(y_w)/π_ref(y_w) − log π_θ(y_l)/π_ref(y_l).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

let D = -10;
const L = {x: 60, w: 260}, R = {x: 380, w: 260}, Y0 = 30, H = 220;
const tx = (p, v) => p.x + (v + 20) / 40 * p.w;
function lossF(d, b){ const z = -b * d; return z > 0 ? z + Math.log1p(Math.exp(-z)) : Math.log1p(Math.exp(z)); }
function wF(d, b){ return 1 / (1 + Math.exp(b * d)); }
function curve(p, f, ymax, dash, wdt){ const pts = []; for (let i = 0; i <= 200; i++) { const d = -20 + 40 * i / 200; pts.push(tx(p, d).toFixed(1) + "," + (Y0 + H - Math.min(f(d), ymax) / ymax * H).toFixed(1)); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: css("--fg"), "stroke-width": wdt || 2, "stroke-dasharray": dash || ""}); }
function draw(){
  const b = +document.getElementById("b").value, bad = document.getElementById("bad").checked;
  document.getElementById("bv").textContent = fmt(b, 2);
  svg.innerHTML = "";
  [[L, 6, "veszteség −log σ(βΔ)", d => lossF(d, b), [0, 2, 4, 6], Math.log(2)], [R, 1, "gradienssúly σ(−βΔ)", d => wF(d, b), [0, 0.5, 1], 0.5]].forEach(q => {
    const p = q[0], ymax = q[1], ty = v => Y0 + H - v / ymax * H;
    if (bad) el("rect", {x: tx(p, -20), y: Y0, width: tx(p, 0) - tx(p, -20), height: H, fill: css("--fill")});
    el("rect", {x: p.x, y: Y0, width: p.w, height: H, fill: "none", stroke: css("--muted")});
    el("text", {x: p.x + p.w / 2, y: Y0 - 10, "text-anchor": "middle", "font-size": 13}, q[2]);
    q[4].forEach(v => el("text", {x: p.x - 5, y: ty(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, v % 1 ? 1 : 0)));
    [-20, -10, 0, 10, 20].forEach(v => el("text", {x: tx(p, v), y: Y0 + H + 15, "text-anchor": "middle", "font-size": 11}, String(v).replace("-", "−")));
    el("line", {x1: p.x, y1: ty(q[5]), x2: p.x + p.w, y2: ty(q[5]), stroke: css("--muted"), "stroke-dasharray": "3 3"});
    [[0.1, "", 1.2], [0.5, "7 4", 1.2], [1, "2 3", 1.2]].forEach(c => { const f = d => ymax === 6 ? lossF(d, c[0]) : wF(d, c[0]); curve(p, f, ymax, c[1], c[2]); });
    curve(p, q[3], ymax, "", 3.2);
    const v = q[3](D), cy = ty(Math.min(v, ymax));
    const pt = el("circle", {cx: tx(p, D), cy: cy, r: 8, fill: css("--hl2"), stroke: css("--fg"), class: "drag", tabindex: 0, "aria-label": "Δ pont, nyilakkal mozgatható"});
    pt.addEventListener("pointerdown", ev => { drag = p; svg.setPointerCapture(ev.pointerId); });
  });
  el("text", {x: 60, y: Y0 + H + 36, "font-size": 12}, "Δ (nat); vékony görbék: β = 0,1 (folytonos), 0,5 (szaggatott), 1 (pontozott); vastag: a csúszka β-ja");
  const l = lossF(D, b), wv = wF(D, b);
  status.textContent = "β = " + fmt(b, 2) + ", Δ = " + fmt(D, 1) + ": loss = −log σ(βΔ) = " + fmt(l, 3) + ", gradienssúly σ(−βΔ) = " + fmt(wv, 3) + ", preferencia-valószínűség σ(βΔ) = " + fmt(1 - wv, 3) + (D < 0 ? " – rosszul rangsorolt pár (Δ < 0): a súly > 0,5" : "");
}
let drag = null;
svg.addEventListener("pointermove", ev => { if (!drag) return; const p = svgPt(ev); D = Math.max(-20, Math.min(20, Math.round(((p.x - drag.x) / drag.w * 40 - 20) * 10) / 10)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
svg.addEventListener("keydown", ev => { if (ev.key === "ArrowRight") D = Math.min(20, Math.round((D + 0.5) * 10) / 10); else if (ev.key === "ArrowLeft") D = Math.max(-20, Math.round((D - 0.5) * 10) / 10); else return; ev.preventDefault(); draw(); svg.querySelector(".drag").focus(); });
["b", "bad"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("bad").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
