<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statikus és folyamatos batching</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="sl">slotok = <b id="slv">4</b></label><input id="sl" type="range" min="1" max="8" value="4" style="max-width:140px">
<label for="rq">kérések (soronként: név tokenszám érkezési_lépés):</label>
<textarea id="rq" rows="3" style="min-width:200px;font:13px ui-monospace,monospace">A 3 0
B 8 0
C 2 0
D 5 0
E 4 0
F 3 0</textarea></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két rács; a felsőben a rövid kérések után üres cellák maradnak, a második batch csak 8 lépés után indul; az alsóban a felszabaduló helyeket azonnal új kérés tölti ki."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szimuláció, nem mérés: 1 token / slot / decode-lépés, a prefill és az időzítés elhanyagolva. Betű = hasznos token, sraffozott = üres slot, vastag vonal = a kérés vége.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 0, "msg": "0. lépés előtt: 6 kérés a sorban, 4 slot."}, {"t": 1, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "1. decode-lépés – folyamatos: A B C D | statikus: A B C D"}, {"t": 2, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 4, "msg": "2. decode-lépés – folyamatos: A B C D (kész: C) | statikus: A B C D (kész: C)"}, {"t": 3, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 4, "msg": "3. decode-lépés – folyamatos: A B E D (kész: A) | statikus: A B · D (kész: A)"}, {"t": 4, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "4. decode-lépés – folyamatos: F B E D | statikus: · B · D"}, {"t": 5, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 4, "msg": "5. decode-lépés – folyamatos: F B E D (kész: D) | statikus: · B · D (kész: D)"}, {"t": 6, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 4, "msg": "6. decode-lépés – folyamatos: F B E · (kész: F, E) | statikus: · B · ·"}, {"t": 7, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "7. decode-lépés – folyamatos: · B · · | statikus: · B · ·"}, {"t": 8, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 4, "msg": "8. decode-lépés – folyamatos: · B · · (kész: B) | statikus: · B · · (kész: B)"}, {"t": 9, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "9. decode-lépés – folyamatos: kész | statikus: E F · ·"}, {"t": 10, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "10. decode-lépés – folyamatos: kész | statikus: E F · ·"}, {"t": 11, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "11. decode-lépés – folyamatos: kész | statikus: E F · · (kész: F)"}, {"t": 12, "gs": [["A", "A", "A", "", "", "", "", "", "E", "E", "E", "E"], ["B", "B", "B", "B", "B", "B", "B", "B", "F", "F", "F", ""], ["C", "C", "", "", "", "", "", "", "", "", "", ""], ["D", "D", "D", "D", "D", "", "", "", "", "", "", ""]], "gc": [["A", "A", "A", "F", "F", "F", "", ""], ["B", "B", "B", "B", "B", "B", "B", "B"], ["C", "C", "E", "E", "E", "E", "", ""], ["D", "D", "D", "D", "D", "", "", ""]], "ts": 12, "tc": 8, "line": 3, "msg": "12. decode-lépés – folyamatos: kész | statikus: E · · · (kész: E) — Összesen: statikus 12 lépés, 25/48 ≈ 52%; folyamatos 8 lépés, 25/32 ≈ 78%. Befejezés (folyamatos): A:3, B:8, C:2, D:5, E:6, F:6; (statikus): A:3, B:8, C:2, D:5, E:12, F:11"}];
const CODE = ["# folyamatos batching (iteration-level) – minden decode-lépés előtt:", "for slot in slots:", "    if slot.szabad and sor and sor[0].érkezés <= t: slot.kérés = sor.pop(0)", "for slot in slots: if slot.kérés: slot.kérés.token_generálás()   # 1 token / lépés", "    if slot.kérés.kész: slot.szabad = True                        # azonnal újra kiosztható", "# statikus batching: a batch a leghosszabb tagjáig fut, csak utána jön az új batch"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function parseReqs(){ return document.getElementById("rq").value.split(/\n/).map(l => l.trim().split(/\s+/)).filter(p => p.length >= 2 && +p[1] > 0)
  .map(p => [p[0].slice(0, 2), Math.min(40, Math.round(+p[1])), Math.max(0, Math.round(+(p[2] || 0)))]).slice(0, 16)
  .sort((a, b) => a[2] - b[2]); }
function statB(reqs, S){ const g = Array.from({length: S}, () => []), fin = {}; let t = 0, i = 0;
  while (i < reqs.length) { while (reqs[i][2] > t) { g.forEach(r => r.push("")); t++; }
    const b = []; while (i < reqs.length && b.length < S && reqs[i][2] <= t) b.push(reqs[i++]);
    const L = Math.max(...b.map(r => r[1]));
    for (let s = 0; s < S; s++) for (let q = 0; q < L; q++) g[s].push(s < b.length && q < b[s][1] ? b[s][0] : "");
    b.forEach(r => fin[r[0]] = t + r[1]); t += L; }
  return [g, t, fin]; }
function contB(reqs, S){ const g = Array.from({length: S}, () => []), fin = {}, act = new Array(S).fill(null), qu = reqs.map(r => r.slice()); let t = 0;
  while (qu.length || act.some(a => a)) {
    for (let s = 0; s < S; s++) if (!act[s] && qu.length && qu[0][2] <= t) { const r = qu.shift(); act[s] = [r[0], r[1]]; }
    for (let s = 0; s < S; s++) { if (act[s]) { g[s].push(act[s][0]); if (--act[s][1] === 0) { fin[act[s][0]] = t + 1; act[s] = null; } } else g[s].push(""); }
    t++; if (t > 500) break; }
  return [g, t, fin]; }
function mkSteps(reqs, S){
  const [gs, ts, fs] = statB(reqs, S), [gc, tc, fc] = contB(reqs, S), T = Math.max(ts, tc), u = reqs.reduce((a, r) => a + r[1], 0);
  const out = [{t: 0, gs: gs, gc: gc, ts: ts, tc: tc, line: 0, msg: `0. lépés előtt: ${reqs.length} kérés a sorban, ${S} slot.`}];
  for (let t = 1; t <= T; t++) { const dc = Object.keys(fc).filter(k => fc[k] === t), ds = Object.keys(fs).filter(k => fs[k] === t);
    out.push({t: t, gs: gs, gc: gc, ts: ts, tc: tc, line: dc.length ? 4 : 3, msg: `${t}. decode-lépés – folyamatos: ` + (t <= tc ? gc.map(r => r[t - 1] || "·").join(" ") : "kész") + (dc.length ? ` (kész: ${dc.join(", ")})` : "") +
      " | statikus: " + (t <= ts ? gs.map(r => r[t - 1] || "·").join(" ") : "kész") + (ds.length ? ` (kész: ${ds.join(", ")})` : "")}); }
  out[out.length - 1].msg += ` — Összesen: statikus ${ts} lépés, ${u}/${S * ts} ≈ ${Math.round(100 * u / (S * ts))}%; folyamatos ${tc} lépés, ${u}/${S * tc} ≈ ${Math.round(100 * u / (S * tc))}%. Befejezés (folyamatos): ` +
    Object.keys(fc).sort().map(k => k + ":" + fc[k]).join(", ") + "; (statikus): " + Object.keys(fs).sort().map(k => k + ":" + fs[k]).join(", ");
  return out; }
function rerun(){ const S = +document.getElementById("sl").value; document.getElementById("slv").textContent = S;
  const r = parseReqs(); if (r.length) setSteps(mkSteps(r, S)); }
document.getElementById("sl").oninput = rerun; document.getElementById("rq").oninput = rerun;
function render(s){
  const T = Math.max(s.ts, s.tc), S = s.gs.length, cw = Math.min(36, 600 / T), ch = Math.min(28, 110 / S), L = 70;
  const H = 2 * (S * ch + 44) + 10;
  svg.setAttribute("viewBox", `0 0 ${L + T * cw + 20} ${H}`);
  svg.innerHTML = "";
  const defs = el("defs", {}), pat = el("pattern", {id: "hh", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  defs.appendChild(pat); const ln = el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--muted"), "stroke-width": 1}); pat.appendChild(ln);
  [[s.gs, s.ts, "Statikus"], [s.gc, s.tc, "Folyamatos"]].forEach(([g, tt, name], p) => {
    const y0 = 22 + p * (S * ch + 44), used = g.flat().filter(c => c).length;
    el("text", {x: 4, y: y0 - 6, "font-size": 13, "font-weight": "bold"}, `${name} batching: ${tt} lépés, kihasználtság ${used}/${S * tt} ≈ ${Math.round(100 * used / (S * tt))}%`);
    g.forEach((row, sl) => { el("text", {x: L - 6, y: y0 + sl * ch + ch / 2 + 4, "text-anchor": "end", "font-size": 11}, `slot ${sl}`);
      row.forEach((c, q) => { if (q >= s.t) return; const x = L + q * cw, y = y0 + sl * ch;
        el("rect", {x: x, y: y, width: cw, height: ch, fill: c ? css("--cellhl") : "url(#hh)", stroke: css("--line"), "stroke-width": 0.6});
        if (c) el("text", {x: x + cw / 2, y: y + ch / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, c);
        if (c && (q + 1 === row.length || row[q + 1] !== c) && q + 1 <= s.t) el("line", {x1: x + cw, x2: x + cw, y1: y, y2: y + ch, stroke: css("--fg"), "stroke-width": 3.5}); }); });
    for (let q = 0; q < T; q++) el("text", {x: L + q * cw + cw / 2, y: y0 + S * ch + 13, "text-anchor": "middle", "font-size": 10, fill: q < tt ? css("--fg") : css("--muted")}, String(q + 1));
    if (s.t > 0 && s.t <= T) el("rect", {x: L + (s.t - 1) * cw, y: y0 - 2, width: cw, height: S * ch + 4, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
