<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A FID két tagja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e4e4e4;--fill2:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#3a3a3a;--fill2:#5a5a5a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.drag{cursor:grab}
pre#code{width:100%;margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--hl2);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Generált eloszlás">
  <label>μ<sub>x</sub> <input id="mx" type="range" min="-2" max="2" step="0.05" value="1"><b id="mxv"></b></label>
  <label>μ<sub>y</sub> <input id="my" type="range" min="-2" max="2" step="0.05" value="0"><b id="myv"></b></label>
</div>
<div class="ctl">
  <label>σ<sub>x</sub> <input id="sx" type="range" min="0.05" max="2" step="0.05" value="0.5"><b id="sxv"></b></label>
  <label>σ<sub>y</sub> <input id="sy" type="range" min="0.05" max="2" step="0.05" value="0.5"><b id="syv"></b></label>
  <label>ρ <input id="rho" type="range" min="-0.9" max="0.9" step="0.05" value="0"><b id="rhov"></b></label>
</div>
<div class="ctl">
  <button id="ca">(a) eltolt átlag</button><button id="cb">(b) mode collapse</button><button id="cc">(c) azonos</button>
  <label>N = <select id="nn"><option>3</option><option selected>10</option><option>100</option><option>1000</option></select></label>
  <button id="samp">mintavétel N ponttal (30×)</button><button id="clr">becslés törlése</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 350" role="img" aria-label="Valós és generált 2D Gauss-eloszlás ellipszisei, mellettük a FID átlag- és kovarianciatagja egymásra rakott oszlopként."></svg>

<p class="small">2D játékpélda, nem Inception-jellemző; a FID a 20.4.2 képletével, 2×2-re zárt alakú mátrixgyökkel (Python-ellenőrzés: scipy.linalg.sqrtm). A mintavétel rögzített kezdőértékű álvéletlen-generátorral húz; kis N-nél a becslés erősen szóródik és felfelé torzít.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (!isFinite(x)) return "—"; let s = x.toFixed(d); if (/^-0[.,]?0*$/.test(s)) s = s.slice(1); return s.replace(".", ",").replace("-", "−"); }
function hu(x, d){ return fmt(x, d); }
function patterns(){
  let defs = document.getElementById("pdefs"); if (defs) defs.remove();
  defs = document.createElementNS(NS, "defs"); defs.id = "pdefs"; const f = css("--fg");
  defs.innerHTML = `<pattern id="pdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${f}" stroke-width="1.1"/></pattern>`
   + `<pattern id="pdot" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.95" fill="${f}"/></pattern>`
   + `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${f}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`;
  svg.insertBefore(defs, svg.firstChild);
}
function hlLine(i){ document.querySelectorAll("pre#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
const status = document.getElementById("status");

const ids = ["mx", "my", "sx", "sy", "rho"], S = {};
ids.forEach(i => S[i] = document.getElementById(i));
let est = null, seedN = 0;
function trSqrt(a, b, c, d){ // 2×2 M = [[a,b],[c,d]], valós pozitív sajátértékekkel
  const t = a + d, det = a * d - b * c; return Math.sqrt(Math.max(0, t + 2 * Math.sqrt(Math.max(0, det))));
}
function fid(mg, Sg, mr, Sr){
  const mt = (mg[0] - mr[0]) ** 2 + (mg[1] - mr[1]) ** 2;
  const M = [Sr[0]*Sg[0] + Sr[1]*Sg[2], Sr[0]*Sg[1] + Sr[1]*Sg[3], Sr[2]*Sg[0] + Sr[3]*Sg[2], Sr[2]*Sg[1] + Sr[3]*Sg[3]];
  const ct = Sr[0] + Sr[3] + Sg[0] + Sg[3] - 2 * trSqrt(M[0], M[1], M[2], M[3]);
  return [mt, Math.max(0, ct), mt + Math.max(0, ct)];
}
function cur(){ const sx = +S.sx.value, sy = +S.sy.value, r = +S.rho.value; return {m: [+S.mx.value, +S.my.value], C: [sx*sx, r*sx*sy, r*sx*sy, sy*sy]}; }
let a_ = 12345;
function rnd(){ a_ = (a_ * 1103515245 + 12345) % 2147483648; return (a_ + 0.5) / 2147483648; }
function gauss(){ return Math.sqrt(-2 * Math.log(rnd())) * Math.cos(2 * Math.PI * rnd()); }
function sample(m, C, n){ // Cholesky
  const l11 = Math.sqrt(C[0]), l21 = C[2] / l11, l22 = Math.sqrt(Math.max(1e-12, C[3] - l21 * l21)), P = [];
  for (let i = 0; i < n; i++){ const u = gauss(), v = gauss(); P.push([m[0] + l11 * u, m[1] + l21 * u + l22 * v]); }
  return P;
}
function stats(P){ const n = P.length, mx = P.reduce((a, p) => a + p[0], 0) / n, my = P.reduce((a, p) => a + p[1], 0) / n;
  let a = 0, b = 0, d = 0; P.forEach(p => { a += (p[0]-mx)**2; b += (p[0]-mx)*(p[1]-my); d += (p[1]-my)**2; });
  const q = Math.max(1, n - 1); return {m: [mx, my], C: [a/q, b/q, b/q, d/q]}; }
function ellipse(cx, cy, C, k, sc, attrs){
  const t = C[0] + C[3], dt = C[0]*C[3] - C[1]*C[2], disc = Math.sqrt(Math.max(0, t*t/4 - dt));
  const l1 = t/2 + disc, l2 = Math.max(0, t/2 - disc); const ang = Math.abs(C[1]) < 1e-12 ? (C[0] >= C[3] ? 0 : 90) : Math.atan2(l1 - C[0], C[1]) * 180 / Math.PI;
  el("ellipse", Object.assign({cx: cx, cy: cy, rx: k*sc*Math.sqrt(l1), ry: k*sc*Math.sqrt(l2), transform: `rotate(${-ang} ${cx} ${cy})`, fill: "none"}, attrs));
}
function draw(){
  ids.forEach(i => document.getElementById(i + "v").textContent = " " + fmt(+S[i].value, 2));
  const g = cur(), [mt, ct, F] = fid(g.m, g.C, [0, 0], [1, 0, 0, 1]);
  svg.innerHTML = ""; patterns();
  const ox = 170, oy = 175, sc = 52, fg = css("--fg"), hl = css("--hl");
  el("rect", {x: ox - 160, y: oy - 160, width: 320, height: 320, fill: "none", stroke: css("--grid")});
  el("line", {x1: ox - 160, y1: oy, x2: ox + 160, y2: oy, stroke: css("--grid")}); el("line", {x1: ox, y1: oy - 160, x2: ox, y2: oy + 160, stroke: css("--grid")});
  [1, 2].forEach(k => { ellipse(ox, oy, [1, 0, 0, 1], k, sc, {stroke: fg, "stroke-width": k === 1 ? 2.2 : 1.1});
    ellipse(ox + sc*g.m[0], oy - sc*g.m[1], g.C, k, sc, {stroke: hl, "stroke-width": k === 1 ? 2.6 : 1.3, "stroke-dasharray": "7 4"}); });
  el("text", {x: ox - 150, y: oy - 142, "font-size": 12, fill: css("--muted")}, "folytonos: valós N(0, I)  szaggatott: generált");
  if (est){ est.pts.forEach(p => el("circle", {cx: ox + sc*p[0], cy: oy - sc*p[1], r: 2.6, fill: hl, opacity: 0.7})); }
  // oszlopok
  const bx = 380, by = 290, H = 150, scale = H / Math.max(2, F * 1.1);
  el("line", {x1: bx - 10, y1: by, x2: bx + 230, y2: by, stroke: fg});
  const bars = [["átlagtag", mt, "#404040"], ["kovarianciatag", ct, "url(#pdiag)"], ["FID", F, null]];
  el("rect", {x: bx, y: by - mt*scale, width: 60, height: mt*scale, fill: css("--muted"), stroke: fg});
  el("rect", {x: bx, y: by - (mt + ct)*scale, width: 60, height: ct*scale, fill: "url(#pdiag)", stroke: fg});
  el("text", {x: bx + 30, y: by + 18, "text-anchor": "middle", "font-size": 12}, "FID");
  el("text", {x: bx + 30, y: by - F*scale - 8, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, fmt(F, 2));
  el("rect", {x: bx + 90, y: 60, width: 16, height: 14, fill: css("--muted"), stroke: fg}); el("text", {x: bx + 112, y: 72, "font-size": 13}, "átlagtag: " + fmt(mt, 2));
  el("rect", {x: bx + 90, y: 84, width: 16, height: 14, fill: "url(#pdiag)", stroke: fg}); el("text", {x: bx + 112, y: 96, "font-size": 13}, "kovarianciatag: " + fmt(ct, 2));
  if (est){
    const xs = est.f, mn = Math.min(...xs), mx = Math.max(...xs), av = xs.reduce((a, b) => a + b, 0) / xs.length;
    el("text", {x: bx + 90, y: 130, "font-size": 13}, `N = ${est.n}, 30 becslés:`);
    el("text", {x: bx + 90, y: 148, "font-size": 13}, `FID ${fmt(mn, 2)} … ${fmt(mx, 2)}`);
    el("text", {x: bx + 90, y: 166, "font-size": 13}, `átlag ${fmt(av, 2)} (valódi ${fmt(F, 2)})`);
    xs.forEach(v => el("line", {x1: bx + 66, x2: bx + 80, y1: by - v*scale, y2: by - v*scale, stroke: hl, "stroke-width": 1.5}));
  }
  status.textContent = `μ_g = (${fmt(g.m[0], 2)}; ${fmt(g.m[1], 2)}), σ_x = ${fmt(+S.sx.value, 2)}, σ_y = ${fmt(+S.sy.value, 2)}, ρ = ${fmt(+S.rho.value, 2)}: átlagtag ${fmt(mt, 2)}, kovarianciatag ${fmt(ct, 2)}, FID ${fmt(F, 2)}` + (est ? ` | N = ${est.n} pontos becslések: ${fmt(Math.min(...est.f), 2)} … ${fmt(Math.max(...est.f), 2)}` : "");
}
function setv(mx, my, sx, sy, r){ S.mx.value = mx; S.my.value = my; S.sx.value = sx; S.sy.value = sy; S.rho.value = r; est = null; draw(); }
document.getElementById("ca").onclick = () => setv(1, 0, 0.5, 0.5, 0);
document.getElementById("cb").onclick = () => setv(0, 0, 0.1, 0.1, 0);
document.getElementById("cc").onclick = () => setv(0, 0, 1, 1, 0);
document.getElementById("samp").onclick = () => {
  const n = +document.getElementById("nn").value, g = cur(), f = []; seedN++; a_ = 12345 + 977 * seedN; let pts = [];
  for (let r = 0; r < 30; r++){ const Pr = sample([0, 0], [1, 0, 0, 1], n), Pg = sample(g.m, g.C, n), sr = stats(Pr), sg = stats(Pg); f.push(fid(sg.m, sg.C, sr.m, sr.C)[2]); if (r === 0) pts = Pg.slice(0, 200); }
  est = {n: n, f: f, pts: pts}; draw();
};
document.getElementById("clr").onclick = () => { est = null; draw(); };
ids.forEach(i => S[i].oninput = () => { est = null; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
