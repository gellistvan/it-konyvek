<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLEU clipping lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>jelölt: <input id="cand" value="a macska a macska a macska a macska" size="34" aria-label="Jelölt szöveg"></label><label>referencia: <input id="ref" value="a macska a macska" size="20" aria-label="Referencia szöveg"></label><label>BLEU-N, N = <input id="N" type="range" min="1" max="4" step="1" value="4" aria-label="Legnagyobb n" oninput="load()" style="flex:0 0 80px;min-width:80px"> <b id="Nv">4</b></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span><svg width="0" height="0" style="position:absolute"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#888" stroke-width="2"/></pattern></defs></svg></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy sor téglalap a jelölt 1-, 2-, 3- és 4-gramjaival; a kvótán belüliek tömörek, a kvóta felettiek áthúzottak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szóhatár szerinti tokenizálás, egyenlő súlyok (1/N), simítás nélkül. A könyv példája: referencia „a macska a macska”, jelölt „a macska a macska a macska a macska”: p = 4/8, 3/7, 2/6, 1/5, BP = 1, BLEU-4 ≈ 0,3457.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"r": 0, "i": -1, "line": 1, "msg": "n = 1: kvóta a referenciából: „a” ×2, „macska” ×2"}, {"r": 0, "i": 0, "line": 2, "msg": "n = 1, 1. n-gram „a”: a kvótán belül → találat (eddig 1/1)"}, {"r": 0, "i": 1, "line": 2, "msg": "n = 1, 2. n-gram „macska”: a kvótán belül → találat (eddig 2/2)"}, {"r": 0, "i": 2, "line": 2, "msg": "n = 1, 3. n-gram „a”: a kvótán belül → találat (eddig 3/3)"}, {"r": 0, "i": 3, "line": 2, "msg": "n = 1, 4. n-gram „macska”: a kvótán belül → találat (eddig 4/4)"}, {"r": 0, "i": 4, "line": 2, "msg": "n = 1, 5. n-gram „a”: a kvóta elfogyott → túllépés, nem számít (eddig 4/5)"}, {"r": 0, "i": 5, "line": 2, "msg": "n = 1, 6. n-gram „macska”: a kvóta elfogyott → túllépés, nem számít (eddig 4/6)"}, {"r": 0, "i": 6, "line": 2, "msg": "n = 1, 7. n-gram „a”: a kvóta elfogyott → túllépés, nem számít (eddig 4/7)"}, {"r": 0, "i": 7, "line": 2, "msg": "n = 1, 8. n-gram „macska”: a kvóta elfogyott → túllépés, nem számít (eddig 4/8)"}, {"r": 0, "i": 8, "line": 3, "msg": "p_1 = 4/8 = 0,5000"}, {"r": 1, "i": -1, "line": 1, "msg": "n = 2: kvóta a referenciából: „a macska” ×2, „macska a” ×1"}, {"r": 1, "i": 0, "line": 2, "msg": "n = 2, 1. n-gram „a macska”: a kvótán belül → találat (eddig 1/1)"}, {"r": 1, "i": 1, "line": 2, "msg": "n = 2, 2. n-gram „macska a”: a kvótán belül → találat (eddig 2/2)"}, {"r": 1, "i": 2, "line": 2, "msg": "n = 2, 3. n-gram „a macska”: a kvótán belül → találat (eddig 3/3)"}, {"r": 1, "i": 3, "line": 2, "msg": "n = 2, 4. n-gram „macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 3/4)"}, {"r": 1, "i": 4, "line": 2, "msg": "n = 2, 5. n-gram „a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 3/5)"}, {"r": 1, "i": 5, "line": 2, "msg": "n = 2, 6. n-gram „macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 3/6)"}, {"r": 1, "i": 6, "line": 2, "msg": "n = 2, 7. n-gram „a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 3/7)"}, {"r": 1, "i": 7, "line": 3, "msg": "p_2 = 3/7 = 0,4286"}, {"r": 2, "i": -1, "line": 1, "msg": "n = 3: kvóta a referenciából: „a macska a” ×1, „macska a macska” ×1"}, {"r": 2, "i": 0, "line": 2, "msg": "n = 3, 1. n-gram „a macska a”: a kvótán belül → találat (eddig 1/1)"}, {"r": 2, "i": 1, "line": 2, "msg": "n = 3, 2. n-gram „macska a macska”: a kvótán belül → találat (eddig 2/2)"}, {"r": 2, "i": 2, "line": 2, "msg": "n = 3, 3. n-gram „a macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 2/3)"}, {"r": 2, "i": 3, "line": 2, "msg": "n = 3, 4. n-gram „macska a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 2/4)"}, {"r": 2, "i": 4, "line": 2, "msg": "n = 3, 5. n-gram „a macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 2/5)"}, {"r": 2, "i": 5, "line": 2, "msg": "n = 3, 6. n-gram „macska a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 2/6)"}, {"r": 2, "i": 6, "line": 3, "msg": "p_3 = 2/6 = 0,3333"}, {"r": 3, "i": -1, "line": 1, "msg": "n = 4: kvóta a referenciából: „a macska a macska” ×1"}, {"r": 3, "i": 0, "line": 2, "msg": "n = 4, 1. n-gram „a macska a macska”: a kvótán belül → találat (eddig 1/1)"}, {"r": 3, "i": 1, "line": 2, "msg": "n = 4, 2. n-gram „macska a macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 1/2)"}, {"r": 3, "i": 2, "line": 2, "msg": "n = 4, 3. n-gram „a macska a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 1/3)"}, {"r": 3, "i": 3, "line": 2, "msg": "n = 4, 4. n-gram „macska a macska a”: a kvóta elfogyott → túllépés, nem számít (eddig 1/4)"}, {"r": 3, "i": 4, "line": 2, "msg": "n = 4, 5. n-gram „a macska a macska”: a kvóta elfogyott → túllépés, nem számít (eddig 1/5)"}, {"r": 3, "i": 5, "line": 3, "msg": "p_4 = 1/5 = 0,2000"}, {"r": 4, "i": 0, "line": 5, "msg": "BP = 1,0000; mértani átlag = 0,3457; BLEU-4 = 0,3457 (sacrebleu-skálán 34,57)"}];
const CODE = ["for n = 1..N:", "    kvóta[g] ← a g n-gram darabszáma a referenciában", "    minden jelölt n-gramra: ha kvóta[g] > 0: találat += 1; kvóta[g] −= 1   (különben túllépés)", "    p_n ← találat / a jelölt n-gramjainak száma", "BP ← 1, ha c > r, különben exp(1 − r/c)", "BLEU ← BP · exp(Σ ln p_n / N)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let ROWS = [{"n": 1, "cells": [["a", true], ["macska", true], ["a", true], ["macska", true], ["a", false], ["macska", false], ["a", false], ["macska", false]], "hit": 4, "tot": 8}, {"n": 2, "cells": [["a macska", true], ["macska a", true], ["a macska", true], ["macska a", false], ["a macska", false], ["macska a", false], ["a macska", false]], "hit": 3, "tot": 7}, {"n": 3, "cells": [["a macska a", true], ["macska a macska", true], ["a macska a", false], ["macska a macska", false], ["a macska a", false], ["macska a macska", false]], "hit": 2, "tot": 6}, {"n": 4, "cells": [["a macska a macska", true], ["macska a macska a", false], ["a macska a macska", false], ["macska a macska a", false], ["a macska a macska", false]], "hit": 1, "tot": 5}];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  ROWS.forEach((row, k) => {
    const y = 20 + k * 62, m = row.cells.length, W = 470, w = Math.min(80, (W - 4 * (m - 1)) / Math.max(m, 1));
    el("text", {x: 6, y: y + 26, "font-size": 13, "font-weight": "bold"}, "n = " + row.n);
    let hit = 0, seen = 0;
    row.cells.forEach((c, i) => {
      const done = k < s.r || (k === s.r && i <= s.i), x = 52 + i * (w + 4), cur = k === s.r && i === s.i;
      if (done) { seen++; if (c[1]) hit++; }
      el("rect", {x, y, width: w, height: 40, fill: !done ? css("--cell") : c[1] ? css("--cellhl") : "url(#hatch)",
                  stroke: css("--line"), "stroke-width": cur ? 4 : 1, "stroke-dasharray": done || cur ? "" : "3 3"});
      const fs = Math.max(7, Math.min(12, w / (c[0].length * 0.56)));
      el("text", {x: x + w / 2, y: y + 24, "text-anchor": "middle", "font-size": fs, fill: done && !c[1] ? css("--muted") : css("--fg")}, c[0]);
      if (done && !c[1]) el("line", {x1: x + 3, y1: y + 37, x2: x + w - 3, y2: y + 3, stroke: css("--line")});
    });
    const fin = k < s.r || (k === s.r && s.i >= m);
    el("text", {x: 530, y: y + 26, "font-size": 13, "font-weight": fin ? "bold" : "normal"}, seen ? `${hit}/${seen}` + (fin ? " = " + (hit / Math.max(m, 1)).toFixed(3).replace(".", ",") : "") : "");
  });
}
function lcl(cand, ref, N){
  const c = cand.trim().split(/\s+/), r = ref.trim().split(/\s+/), ng = (t, n) => { const o = []; for (let i = 0; i + n <= t.length; i++) o.push(t.slice(i, i + n).join(" ")); return o; };
  const rows = [], st = [], hu = (v, d) => v.toFixed(d).replace(".", ",");
  for (let n = 1; n <= N; n++) {
    const q = {}; ng(r, n).forEach(g => q[g] = (q[g] || 0) + 1);
    const q0 = Object.assign({}, q), cells = ng(c, n).map(g => { const ok = (q[g] || 0) > 0; if (ok) q[g]--; return [g, ok]; });
    rows.push({n, cells, hit: cells.filter(x => x[1]).length, tot: cells.length, quota: q0});
  }
  rows.forEach((row, k) => {
    st.push({r: k, i: -1, line: 1, msg: `n = ${row.n}: kvóta a referenciából: ` + Object.entries(row.quota).map(([g, v]) => `„${g}” ×${v}`).join(", ")});
    let hit = 0;
    row.cells.forEach((cc, i) => { hit += cc[1] ? 1 : 0; st.push({r: k, i, line: 2, msg: `n = ${row.n}, ${i + 1}. n-gram „${cc[0]}”: ` + (cc[1] ? "a kvótán belül → találat" : "a kvóta elfogyott → túllépés, nem számít") + ` (eddig ${hit}/${i + 1})`}); });
    st.push({r: k, i: row.cells.length, line: 3, msg: row.tot ? `p_${row.n} = ${row.hit}/${row.tot} = ${hu(row.hit / row.tot, 4)}` : `p_${row.n}: a jelöltnek nincs ${row.n}-gramja`});
  });
  const bp = c.length > r.length ? 1 : Math.exp(1 - r.length / c.length), ps = rows.map(x => x.tot ? x.hit / x.tot : 0);
  const gm = Math.min(...ps) === 0 ? 0 : Math.exp(ps.reduce((a, p) => a + Math.log(p), 0) / N);
  st.push({r: N, i: 0, line: 5, msg: `BP = ${hu(bp, 4)}; mértani átlag = ${hu(gm, 4)}; BLEU-${N} = ${hu(bp * gm, 4)} (sacrebleu-skálán ${hu(100 * bp * gm, 2)})` + (gm === 0 ? " – simítás nélkül egy nulla precízió 0-t ad" : "")});
  return {rows, st};
}
function load(){
  const cand = document.getElementById("cand").value, ref = document.getElementById("ref").value, N = +document.getElementById("N").value;
  document.getElementById("Nv").textContent = N;
  if (!cand.trim() || !ref.trim() || cand.trim().split(/\s+/).length > 14) { document.getElementById("err").textContent = "Adjon meg nem üres szövegeket (a jelölt legfeljebb 14 szó)."; return; }
  document.getElementById("err").textContent = "";
  const o = lcl(cand, ref, N); ROWS = o.rows; setSteps(o.st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
