<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logit-maszkolás lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>T = <input id="temp" type="range" min="0.2" max="3" step="0.05" value="1" oninput="show(k)" aria-label="Hőmérséklet"> <b id="tv">1,00</b></label> <label><input id="lim" type="checkbox" onchange="show(k)"> limit-korlát (1–20) a grammarban</label> <label>max_new_tokens = <input id="mnt" type="range" min="1" max="17" value="17" oninput="outp()" aria-label="max_new_tokens"> <b id="mv"></b></label><div id="out" aria-live="polite" style="width:100%;font-family:monospace;font-size:13px"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat lépésben látható, hogy a nyelvtani állapot mely tokeneket engedi, és a tiltott tokenek valószínűsége a maszk után nulla."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető logitok, nem modellkimenet; 9 kitalált token, a szóköztokenek elhagyva. A cél a rövidített {"query": "nagy nyelvi modellek", "limit": 5} objektum. A limit-korlát kapcsoló azt modellezi, hogy a grammarépítő eszköz lefordítja-e a minimum/maximum korlátot.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"pre": "(üres)", "st": "objektum várható", "z": [2.0, 3.0, 2.5, 0.5, 0.2, -1.0, -1.0, -0.5, -1.0], "off": [0], "on": [0], "line": 1, "msg": "(1) prefix: (üres) – automataállapot: objektum várható."}, {"pre": "{\"", "st": "kulcsnév (query, limit, …)", "z": [-1.0, 0.5, -1.0, 1.0, 3.0, 0.2, -0.5, 0.0, -1.0], "off": [4], "on": [4], "line": 2, "msg": "(2) prefix: {\" – automataállapot: kulcsnév (query, limit, …)."}, {"pre": "{\"query\"", "st": "kulcs után: kettőspont", "z": [-1.0, -0.5, -1.0, 0.5, 0.3, 2.5, 1.5, -0.5, -1.0], "off": [5], "on": [5], "line": 2, "msg": "(3) prefix: {\"query\" – automataállapot: kulcs után: kettőspont."}, {"pre": "{\"query\": \"nagy nyelvi", "st": "string belseje", "z": [-1.0, 0.5, -1.0, 1.5, 0.8, -0.5, 0.2, 0.0, -0.5], "off": [0, 1, 2, 3, 4, 5, 6, 7, 8], "on": [0, 1, 2, 3, 4, 5, 6, 7, 8], "line": 2, "msg": "(4) prefix: {\"query\": \"nagy nyelvi – automataállapot: string belseje."}, {"pre": "… \"limit\":", "st": "egész: első számjegy", "z": [-1.0, 0.5, 0.5, 0.5, -1.0, -1.0, -1.0, 2.5, 1.8], "off": [7, 8], "on": [7], "line": 2, "msg": "(5) prefix: … \"limit\": – automataállapot: egész: első számjegy."}, {"pre": "… \"limit\": 5", "st": "egész: tovább vagy vessző", "z": [-1.0, 0.2, 0.3, -0.5, -1.0, -1.0, 2.2, 0.8, 1.2], "off": [6, 7, 8], "on": [6], "line": 2, "msg": "(6) prefix: … \"limit\": 5 – automataállapot: egész: tovább vagy vessző."}];
const CODE = ["z = model(prefix)                      # logitok, alak [vocab_size]", "A = grammar.allowed(state)             # engedélyezett tokenhalmaz", "z_masked = where(i in A, z, -inf)      # logit-maszkolás", "p = softmax(z_masked / T)              # tiltott tokenek: p = 0", "tok = sample(p); state = grammar.step(state, tok)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VOC = ["{", "Íme", "```", "\"", "query", ":", ",", "5", "99"], TARGET = ["{", "\"", "query", "\"", ":", " \"", "nagy", " nyelvi", " modellek", "\"", ",", " \"", "limit", "\"", ":", " 5", "}"];
function sm(z, T, A){ const zz = z.map((v, i) => A === null || A.includes(i) ? v / T : -Infinity); const m = Math.max(...zz);
  const e = zz.map(v => v === -Infinity ? 0 : Math.exp(v - m)); const s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); }
const f3 = v => v.toFixed(3).replace(".", ",");
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 330");
  const T = +document.getElementById("temp").value, lim = document.getElementById("lim").checked;
  document.getElementById("tv").textContent = T.toFixed(2).replace(".", ",");
  const A = lim ? s.on : s.off, p = sm(s.z, T, null), q = sm(s.z, T, A);
  const L = 50, B = 230, Ht = 170, bw = 58;
  el("text", {x: 10, y: 18, "font-size": 13}, "Prefix: " + s.pre);
  el("text", {x: 10, y: 36, "font-size": 13, "font-weight": "bold"}, "Automataállapot: " + s.st);
  [0, 0.5, 1].forEach(v => { el("line", {x1: L, x2: L + bw * 9, y1: B - Ht * v, y2: B - Ht * v, stroke: css("--cellhl")});
    el("text", {x: L - 6, y: B - Ht * v + 4, "text-anchor": "end", "font-size": 11}, String(v).replace(".", ",")); });
  VOC.forEach((t, i) => {
    const x = L + i * bw, ok = A.includes(i);
    el("rect", {x: x + 6, y: B - Ht * p[i], width: 20, height: Ht * p[i], fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 0.8});
    if (ok) el("rect", {x: x + 28, y: B - Ht * q[i], width: 20, height: Ht * q[i], fill: css("--fg"), stroke: css("--line"), "stroke-width": 0.8});
    else { el("rect", {x: x + 28, y: B - 12, width: 20, height: 12, fill: "none", stroke: css("--muted"), "stroke-dasharray": "3 2"});
      el("line", {x1: x + 28, y1: B, x2: x + 48, y2: B - 12, stroke: css("--muted")});
      el("text", {x: x + 38, y: B - 16, "text-anchor": "middle", "font-size": 11}, "−∞"); }
    el("text", {x: x + 27, y: B + 16, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, t);
    el("text", {x: x + 27, y: B + 31, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, f3(p[i]));
    el("text", {x: x + 27, y: B + 44, "text-anchor": "middle", "font-size": 10, "font-weight": "bold"}, ok ? f3(q[i]) : "0");
  });
  el("text", {x: 4, y: B + 31, "font-size": 10, fill: css("--muted")}, "előtte");
  el("text", {x: 4, y: B + 44, "font-size": 10, "font-weight": "bold"}, "utána");
  const sum = q.reduce((a, b) => a + b, 0), forb = q.filter((v, i) => !A.includes(i)).reduce((a, b) => a + b, 0);
  el("text", {x: 10, y: B + 66, "font-size": 12}, `Szürke: softmax(z/T) maszk előtt · fekete: maszk után. Σ p′ = ${f3(sum)}, tiltott tokenek összesen: ${f3(forb)}.`);
  el("text", {x: 10, y: B + 84, "font-size": 12}, `Engedélyezett: ${A.map(i => VOC[i]).join("  ")}` + (s.off.length !== s.on.length ? (lim ? "  (limit-korlát: be, a 99 tiltott)" : "  (limit-korlát: ki, a 99 is engedélyezett)") : ""));
  outp();
}
function outp(){
  const n = +document.getElementById("mnt").value; document.getElementById("mv").textContent = n;
  const txt = TARGET.slice(0, n).join(""); let ok = true; try { JSON.parse(txt); } catch (e) { ok = false; }
  document.getElementById("out").textContent = `Kimenet max_new_tokens = ${n} mellett: ${txt}  →  ${ok ? "érvényes JSON" : "érvénytelen JSON (csonka prefix: a maszk csak érvényes prefixet garantál)"}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
