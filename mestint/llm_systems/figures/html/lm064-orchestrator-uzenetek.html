<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator-worker üzenetfolyam</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" checked onchange="setMode(this.checked ? 'err' : 'ok')"> worker hiba (is_error)</label></div><div class="ctl"><label>lánc N <input id="gn" type="range" min="1" max="8" step="1" value="5" oninput="show(k)" style="width:90px" aria-label="lánc N"></label><label>lépés (s) <input id="gt" type="range" min="1" max="5" step="1" value="2" oninput="show(k)" style="width:90px" aria-label="lépés (s)"></label><label>T_orch <input id="go" type="range" min="0" max="4" step="1" value="1" oninput="show(k)" style="width:90px" aria-label="T_orch"></label><label>w1 <input id="g1" type="range" min="1" max="8" step="1" value="2" oninput="show(k)" style="width:90px" aria-label="w1"></label><label>w2 <input id="g2" type="range" min="1" max="8" step="1" value="2" oninput="show(k)" style="width:90px" aria-label="w2"></label><label>w3 <input id="g3" type="range" min="1" max="8" step="1" value="4" oninput="show(k)" style="width:90px" aria-label="w3"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram: task az extractornak, hibás result vissza, escalation a human_review-nak, mindegyik task-001 korrelációs azonosítóval; alatta Gantt-idővonal: szekvenciálisan 10 s, párhuzamosan 5 s."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az üzenetnapló a fejezet run_demo() kódjának átiratából (rögzített óra); worker hiba nélkül nincs msg-0002. A késleltetés elméleti modell (T_seq = Σ T_i, T_par = T_orch + max T_i); a párhuzamos időértékek szemléltetők, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "msg": "msg-0000: orchestrator → extractor, type = task, correlation_id = task-001", "line": -1}, {"i": 1, "msg": "msg-0001: extractor → orchestrator, type = result, correlation_id = task-001", "line": -1}, {"i": 2, "msg": "msg-0002: orchestrator → human_review, type = escalation, correlation_id = task-001 – a worker hibát jelzett, az orchestrator eszkalál.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LOGS = {"err": [{"id": "msg-0000", "s": "orchestrator", "r": "extractor", "t": "task", "p": "{\"text\": \"A minta mondat.\", \"schema\": \"entity_v1\"}"}, {"id": "msg-0001", "s": "extractor", "r": "orchestrator", "t": "result", "p": "{\"is_error\": true, \"error\": \"schema_validation_failed\"}"}, {"id": "msg-0002", "s": "orchestrator", "r": "human_review", "t": "escalation", "p": "{\"worker\": \"extractor\", \"details\": {\"is_error\": true, \"error\": \"schema_validation_failed\"}}"}], "ok": [{"id": "msg-0000", "s": "orchestrator", "r": "extractor", "t": "task", "p": "{\"text\": \"A minta mondat.\", \"schema\": \"entity_v1\"}"}, {"id": "msg-0001", "s": "extractor", "r": "orchestrator", "t": "result", "p": "{\"is_error\": false, \"entities\": [\"…\"]}"}]}, SETS = {"err": [{"i": 0, "msg": "msg-0000: orchestrator → extractor, type = task, correlation_id = task-001", "line": -1}, {"i": 1, "msg": "msg-0001: extractor → orchestrator, type = result, correlation_id = task-001", "line": -1}, {"i": 2, "msg": "msg-0002: orchestrator → human_review, type = escalation, correlation_id = task-001 – a worker hibát jelzett, az orchestrator eszkalál.", "line": -1}], "ok": [{"i": 0, "msg": "msg-0000: orchestrator → extractor, type = task, correlation_id = task-001", "line": -1}, {"i": 1, "msg": "msg-0001: extractor → orchestrator, type = result, correlation_id = task-001", "line": -1}]}, LIFEN = ["orchestrator", "extractor", "validator", "human_review"];
let MODE = "err";
function gv(id){ return +document.getElementById(id).value; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 435");
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>
  <pattern id="pd" patternUnits="userSpaceOnUse" width="6" height="6"><circle cx="3" cy="3" r="1" fill="${css("--muted")}"/></pattern>
  <pattern id="pl" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--muted")}" stroke-width="1.3"/></pattern>`;
  const LX = [52, 152, 252, 352], log = LOGS[MODE];
  LX.forEach((x, i) => {
    el("rect", {x: x - 46, y: 6, width: 92, height: 24, fill: css("--cell"), stroke: css("--line")});
    el("text", {x, y: 22, "text-anchor": "middle", "font-size": 9.5, "font-weight": "bold", "font-family": "monospace"}, LIFEN[i]);
    el("line", {x1: x, y1: 30, x2: x, y2: 200, stroke: css("--muted"), "stroke-dasharray": "4 3"});
  });
  const dash = {task: "none", result: "6 3", escalation: "2 3"};
  log.forEach((m, j) => {
    if (j > s.i) return;
    const y = 62 + j * 48, x0 = LX[LIFEN.indexOf(m.s)], x1 = LX[LIFEN.indexOf(m.r)], on = j === s.i;
    el("line", {x1: x0, y1: y, x2: x1 + (x1 > x0 ? -2 : 2), y2: y, stroke: on ? css("--hl2") : css("--fg"), "stroke-width": m.t === "escalation" ? 3 : (on ? 2 : 1.3), "stroke-dasharray": dash[m.t], "marker-end": "url(#ah)"});
    el("text", {x: (x0 + x1) / 2, y: y - 6, "text-anchor": "middle", "font-size": 10.5, "font-weight": on ? "bold" : "normal"}, `${m.id} · ${m.t}`);
    el("text", {x: (x0 + x1) / 2, y: y + 14, "text-anchor": "middle", "font-size": 9.5, "font-style": "italic", fill: css("--muted")}, "correlation_id=task-001");
  });
  // napló
  el("text", {x: 410, y: 18, "font-size": 12.5, "font-weight": "bold"}, "message_log");
  const cols = [["message_id", 410], ["sender", 490], ["receiver", 585], ["type", 680]];
  el("rect", {x: 405, y: 26, width: 350, height: 22, fill: css("--cellhl"), stroke: css("--line")});
  cols.forEach(([c, x]) => el("text", {x, y: 41, "font-size": 10.5, "font-weight": "bold"}, c));
  log.slice(0, s.i + 1).forEach((m, j) => {
    const y = 48 + j * 22;
    el("rect", {x: 405, y, width: 350, height: 22, fill: css("--cell"), stroke: css("--line"), "stroke-width": j === s.i ? 2 : 1});
    [m.id, m.s, m.r, m.t].forEach((v, q) => el("text", {x: cols[q][1], y: y + 15, "font-size": 10.5, "font-family": "monospace"}, v));
  });
  if (s.i === log.length - 1) el("text", {x: 410, y: 48 + log.length * 22 + 18, "font-size": 11, fill: css("--hl")}, `${log.length} üzenet; utolsó: ${log[log.length - 1].t} → ${log[log.length - 1].r}`);
  // Gantt
  const N = gv("gn"), T = gv("gt"), To = gv("go"), w = [gv("g1"), gv("g2"), gv("g3")];
  const Ts = N * T, Tp = To + Math.max(...w), tmax = Math.max(12, Ts, Tp), sx = 690 / tmax, gx = 50, gy = 235;
  el("text", {x: 10, y: gy, "font-size": 12, "font-weight": "bold"}, `Szekvenciális: ${N} × ${T} s → T_seq = ${Ts} s`);
  for (let q = 0; q < N; q++) el("rect", {x: gx + q * T * sx, y: gy + 8, width: T * sx, height: 20, fill: "url(#pd)", stroke: css("--line")});
  el("text", {x: 10, y: gy + 58, "font-size": 12, "font-weight": "bold"}, `Párhuzamos: T_par = ${To} + max(${w.join("; ")}) = ${Tp} s`);
  const slow = w.indexOf(Math.max(...w));
  el("rect", {x: gx, y: gy + 66, width: To * sx, height: 18, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 8, y: gy + 80, "font-size": 10.5}, "orch");
  w.forEach((t, q) => {
    const y = gy + 88 + q * 22;
    el("rect", {x: gx + To * sx, y, width: t * sx, height: 18, fill: "url(#pl)", stroke: q === slow ? css("--hl2") : css("--line"), "stroke-width": q === slow ? 3 : 1});
    el("text", {x: 8, y: y + 14, "font-size": 10.5}, `w${q + 1}`);
  });
  for (let t = 0; t <= tmax; t += 2) { el("line", {x1: gx + t * sx, y1: gy + 158, x2: gx + t * sx, y2: gy + 163, stroke: css("--fg")}); el("text", {x: gx + t * sx, y: gy + 176, "text-anchor": "middle", "font-size": 10}, String(t)); }
  el("line", {x1: gx, y1: gy + 158, x2: gx + tmax * sx, y2: gy + 158, stroke: css("--fg")});
  el("text", {x: gx + tmax * sx, y: gy + 192, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "idő (s)");
  [[Ts, gy + 4, gy + 32], [Tp, gy + 62, gy + 156]].forEach(([t, a, b]) => el("line", {x1: gx + t * sx, y1: a, x2: gx + t * sx, y2: b, stroke: css("--fg"), "stroke-dasharray": "5 3", "stroke-width": 1.5}));
}
function setMode(v){ MODE = v; setSteps(SETS[v]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
