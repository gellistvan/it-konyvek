<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatáramlás eszközhatárral</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az üzenet az eszközön marad; online esetben csak egy szövegmentes kérésazonosító lépi át a határt, offline esetben semmi; a modellfrissítés csak befelé érkezik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor szimulációja (nem mérés): 20 kérés, minden harmadik offline. A kimenő JSON a kérésszámot viszi a nem reprodukálható hash(text) % 1000 helyett; a bájtszám a tömör JSON tényleges hossza. A kérésre kattintva annak lépése és kimenő JSON-ja jelenik meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: 0 kérés, 0 bájt lépte át az eszközhatárt. A Lépés ▶ a labor 20 kérését játssza le (minden harmadik offline).", "line": -1, "k": 0, "total": 0, "noff": 0}, {"msg": "1. kérés („Szeretnék időpontot foglalni a rendelésre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":1} = 26 bájt, szöveg nélkül. Összesen 26 bájt, fallback-arány 0/1 = 0,00.", "line": 2, "k": 1, "off": false, "payload": "{\"type\":\"classify\",\"id\":1}", "b": 26, "total": 26, "noff": 0}, {"msg": "2. kérés („Nem találom a számlámat.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":2} = 26 bájt, szöveg nélkül. Összesen 52 bájt, fallback-arány 0/2 = 0,00.", "line": 2, "k": 2, "off": false, "payload": "{\"type\":\"classify\",\"id\":2}", "b": 26, "total": 52, "noff": 0}, {"msg": "3. kérés („Panaszom van a termékre.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 52 bájt, fallback-arány 1/3 = 0,33.", "line": 3, "k": 3, "off": true, "payload": null, "b": 0, "total": 52, "noff": 1}, {"msg": "4. kérés („Köszönöm, viszlát.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":4} = 26 bájt, szöveg nélkül. Összesen 78 bájt, fallback-arány 1/4 = 0,25.", "line": 2, "k": 4, "off": false, "payload": "{\"type\":\"classify\",\"id\":4}", "b": 26, "total": 78, "noff": 1}, {"msg": "5. kérés („Szeretnék időpontot foglalni a rendelésre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":5} = 26 bájt, szöveg nélkül. Összesen 104 bájt, fallback-arány 1/5 = 0,20.", "line": 2, "k": 5, "off": false, "payload": "{\"type\":\"classify\",\"id\":5}", "b": 26, "total": 104, "noff": 1}, {"msg": "6. kérés („Nem találom a számlámat.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 104 bájt, fallback-arány 2/6 = 0,33.", "line": 3, "k": 6, "off": true, "payload": null, "b": 0, "total": 104, "noff": 2}, {"msg": "7. kérés („Panaszom van a termékre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":7} = 26 bájt, szöveg nélkül. Összesen 130 bájt, fallback-arány 2/7 = 0,29.", "line": 2, "k": 7, "off": false, "payload": "{\"type\":\"classify\",\"id\":7}", "b": 26, "total": 130, "noff": 2}, {"msg": "8. kérés („Köszönöm, viszlát.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":8} = 26 bájt, szöveg nélkül. Összesen 156 bájt, fallback-arány 2/8 = 0,25.", "line": 2, "k": 8, "off": false, "payload": "{\"type\":\"classify\",\"id\":8}", "b": 26, "total": 156, "noff": 2}, {"msg": "9. kérés („Szeretnék időpontot foglalni a rendelésre.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 156 bájt, fallback-arány 3/9 = 0,33.", "line": 3, "k": 9, "off": true, "payload": null, "b": 0, "total": 156, "noff": 3}, {"msg": "10. kérés („Nem találom a számlámat.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":10} = 27 bájt, szöveg nélkül. Összesen 183 bájt, fallback-arány 3/10 = 0,30.", "line": 2, "k": 10, "off": false, "payload": "{\"type\":\"classify\",\"id\":10}", "b": 27, "total": 183, "noff": 3}, {"msg": "11. kérés („Panaszom van a termékre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":11} = 27 bájt, szöveg nélkül. Összesen 210 bájt, fallback-arány 3/11 = 0,27.", "line": 2, "k": 11, "off": false, "payload": "{\"type\":\"classify\",\"id\":11}", "b": 27, "total": 210, "noff": 3}, {"msg": "12. kérés („Köszönöm, viszlát.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 210 bájt, fallback-arány 4/12 = 0,33.", "line": 3, "k": 12, "off": true, "payload": null, "b": 0, "total": 210, "noff": 4}, {"msg": "13. kérés („Szeretnék időpontot foglalni a rendelésre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":13} = 27 bájt, szöveg nélkül. Összesen 237 bájt, fallback-arány 4/13 = 0,31.", "line": 2, "k": 13, "off": false, "payload": "{\"type\":\"classify\",\"id\":13}", "b": 27, "total": 237, "noff": 4}, {"msg": "14. kérés („Nem találom a számlámat.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":14} = 27 bájt, szöveg nélkül. Összesen 264 bájt, fallback-arány 4/14 = 0,29.", "line": 2, "k": 14, "off": false, "payload": "{\"type\":\"classify\",\"id\":14}", "b": 27, "total": 264, "noff": 4}, {"msg": "15. kérés („Panaszom van a termékre.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 264 bájt, fallback-arány 5/15 = 0,33.", "line": 3, "k": 15, "off": true, "payload": null, "b": 0, "total": 264, "noff": 5}, {"msg": "16. kérés („Köszönöm, viszlát.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":16} = 27 bájt, szöveg nélkül. Összesen 291 bájt, fallback-arány 5/16 = 0,31.", "line": 2, "k": 16, "off": false, "payload": "{\"type\":\"classify\",\"id\":16}", "b": 27, "total": 291, "noff": 5}, {"msg": "17. kérés („Szeretnék időpontot foglalni a rendelésre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":17} = 27 bájt, szöveg nélkül. Összesen 318 bájt, fallback-arány 5/17 = 0,29.", "line": 2, "k": 17, "off": false, "payload": "{\"type\":\"classify\",\"id\":17}", "b": 27, "total": 318, "noff": 5}, {"msg": "18. kérés („Nem találom a számlámat.”): a hálózat nem elérhető → helyi szabályalapú osztályozó; 0 bájt hagyja el az eszközt. Összesen 318 bájt, fallback-arány 6/18 = 0,33.", "line": 3, "k": 18, "off": true, "payload": null, "b": 0, "total": 318, "noff": 6}, {"msg": "19. kérés („Panaszom van a termékre.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":19} = 27 bájt, szöveg nélkül. Összesen 345 bájt, fallback-arány 6/19 = 0,32.", "line": 2, "k": 19, "off": false, "payload": "{\"type\":\"classify\",\"id\":19}", "b": 27, "total": 345, "noff": 6}, {"msg": "20. kérés („Köszönöm, viszlát.”): felhős ág; kimenő JSON {\"type\":\"classify\",\"id\":20} = 27 bájt, szöveg nélkül. Összesen 372 bájt, fallback-arány 6/20 = 0,30.", "line": 2, "k": 20, "off": false, "payload": "{\"type\":\"classify\",\"id\":20}", "b": 27, "total": 372, "noff": 6}];
const CODE = ["for k, text in enumerate(texts, start=1):", "    if network_ok(k):                     # k % 3 != 0", "        send({\"type\": \"classify\", \"id\": k})   # csak ez lépi át a határt", "    else: label = local.classify(text)    # offline fallback, 0 bájt", "    log_locally(label)                    # titkosított, nem szinkronizál"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EX = ["Szeretnék időpontot foglalni a rendelésre.", "Nem találom a számlámat.", "Panaszom van a termékre.", "Köszönöm, viszlát."];
function box(x, y, w, h, lines, hot, dash){ el("rect", {x, y, width: w, height: h, rx: 7, fill: css("--cell"), stroke: hot ? css("--hl2") : css("--line"), "stroke-width": hot ? 3 : 1.2, "stroke-dasharray": dash || ""});
  lines.forEach((t, i) => el("text", {x: x + w / 2, y: y + h / 2 + 4 + (i - (lines.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 12}, t)); }
function ar(x1, y1, x2, y2, hot, w, dash){ el("line", {x1, y1, x2, y2, stroke: hot ? css("--hl2") : css("--line"), "stroke-width": hot ? Math.max(3, w || 1.4) : (w || 1.4), "stroke-dasharray": dash || ""});
  const a = Math.atan2(y2 - y1, x2 - x1), L = 10; el("path", {d: `M${x2},${y2}L${x2 - L * Math.cos(a - 0.4)},${y2 - L * Math.sin(a - 0.4)}L${x2 - L * Math.cos(a + 0.4)},${y2 - L * Math.sin(a + 0.4)}Z`, fill: hot ? css("--hl2") : css("--line")}); }
function render(s){
  svg.setAttribute("viewBox", "0 0 720 400"); svg.innerHTML = "";
  const on = s.k > 0, cl = on && !s.off, of = on && s.off;
  el("rect", {x: 8, y: 30, width: 470, height: 300, fill: "none", stroke: css("--line"), "stroke-width": 3, "stroke-dasharray": "10 6"});
  el("text", {x: 16, y: 50, "font-size": 14, "font-weight": "bold"}, "Eszköz");
  el("text", {x: 600, y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Felhő / hálózat");
  box(30, 62, 170, 34, ["Felhasználói üzenet"], on); box(30, 118, 170, 40, ["Helyi preprocesszor", "(minimalizálás)"], on);
  el("polygon", {points: "115,178 200,213 115,248 30,213", fill: css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2});
  el("text", {x: 115, y: 210, "text-anchor": "middle", "font-size": 12}, "Hálózat"); el("text", {x: 115, y: 224, "text-anchor": "middle", "font-size": 12}, "elérhető?");
  box(30, 276, 170, 40, ["Helyi szabályalapú", "osztályozó"], of); box(250, 282, 140, 30, ["Kimenet (címke)"], on);
  box(250, 222, 210, 38, ["Lokális napló", "(titkosított, rövid megőrzés)"], on);
  box(530, 196, 150, 36, ["Felhős osztályozó"], cl); box(520, 40, 175, 40, ["Aláírt modellfrissítés", "(OTA) – csak letöltés"], false);
  ar(115, 96, 115, 118, on); ar(115, 158, 115, 178, on); ar(115, 248, 115, 276, of); el("text", {x: 122, y: 266, "font-size": 11}, "nem");
  ar(200, 213, 530, 213, cl, 3); el("text", {x: 240, y: 206, "font-size": 11}, "igen");
  if (cl) { el("text", {x: 365, y: 190, "text-anchor": "middle", "font-size": 12, "font-family": "monospace", fill: css("--hl2")}, s.payload);
    el("text", {x: 365, y: 176, "text-anchor": "middle", "font-size": 11}, `${s.b} bájt lépi át a határt`); }
  ar(200, 296, 250, 296, of); el("polyline", {points: "620,232 620,340 320,340 320,312", fill: "none", stroke: cl ? css("--hl2") : css("--line"), "stroke-width": cl ? 3 : 1.2});
  el("text", {x: 626, y: 290, "font-size": 11}, "címke vissza");
  ar(320, 282, 320, 260, on);
  el("line", {x1: 460, y1: 241, x2: 560, y2: 232, stroke: css("--muted"), "stroke-dasharray": "2 3", "stroke-width": 1.4});
  el("text", {x: 505, y: 243, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "✕"); el("text", {x: 540, y: 278, "text-anchor": "middle", "font-size": 10.5}, "nem szinkronizálódik");
  ar(520, 60, 400, 60, false, 1.6, "7 4"); el("text", {x: 395, y: 64, "text-anchor": "end", "font-size": 11}, "→ helyi modell, szabályok");
  // kéréschipek
  for (let i = 1; i <= 20; i++) { const x = 8 + (i - 1) * 35.5, done = i <= s.k, off = i % 3 === 0, cur = i === s.k;
    const r = el("rect", {x, y: 356, width: 31, height: 24, rx: 4, fill: done ? (off ? css("--cellhl") : css("--cell")) : css("--bg"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": off ? "3 2" : "", tabindex: 0, role: "button", "aria-label": `${i}. kérés`});
    el("text", {x: x + 15.5, y: 372, "text-anchor": "middle", "font-size": 11}, off ? i + "∅" : i);
    r.style.cursor = "pointer"; r.addEventListener("click", () => { stop(); show(i); }); r.addEventListener("keydown", e => { if (e.key === "Enter") { stop(); show(i); } }); }
  el("text", {x: 8, y: 396, "font-size": 11, fill: css("--muted")}, `Határon átment: ${s.total} bájt · felhős kérés: ${s.k - s.noff} · offline (∅, szaggatott): ${s.noff} · fallback-arány ${s.k ? (s.noff / s.k).toFixed(2).replace(".", ",") : "–"}`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
