<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenköltség és kihasználtság</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--line:#000;--grid:#ddd;--l2:#555;--cell:#fff;--shade:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--line:#ddd;--grid:#444;--l2:#bbb;--cell:#262626;--shade:#333}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:150px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
#formula{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>GPU-óradíj: <input id="pg" type="range" min="0.2" max="4" step="0.05" value="0.7" aria-label="GPU-óradíj USD/óra"><b id="pgv"></b> USD/óra</label>
  <label>Throughput (u = 1): <input id="tp" type="range" min="50" max="3000" step="1" value="463" aria-label="Teljes kihasználtságú throughput token/s"><b id="tpv"></b> token/s</label>
  <label>API output ár: <input id="pa" type="range" min="0.1" max="10" step="0.05" value="1.5" aria-label="API output ár USD per 1 millió token"><b id="pav"></b> USD/1M</label>
  <button id="rs">Könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 330" role="img" aria-label="A fajlagos output-tokenköltség hiperbolikusan csökken a kihasználtság növekedésével; vízszintes szaggatott vonal az API-ár, a metszéspontnál a töréspont."></svg>
<div id="formula" aria-live="polite"></div>
<p class="small">Szemléltető paraméterek, nem mérés; a prefill nincs benne. Képlet: p<sub>token</sub>(u) = p<sub>GPU</sub> / (X·u) · 10<sup>6</sup>, ahol X = throughput · 3600 token/óra teljes kihasználtságnál, és a nevezőben a ténylegesen kiszolgált token áll.</p>
<script>
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id), svg = $("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const f = (x, d) => x.toFixed(d).replace(".", ",");
const DEF = {"pg": 0.7, "tp": 463, "pa": 1.5};
function draw(){
  const pg = +$("pg").value, tp = +$("tp").value, pa = +$("pa").value;
  $("pgv").textContent = f(pg, 2); $("tpv").textContent = tp; $("pav").textContent = f(pa, 2);
  const X = tp * 3600, P = u => pg / (X * u) * 1e6, us = pg * 1e6 / (pa * X);
  const L = 62, R = 600, T = 14, B = 280, u0 = 0.1, u1 = 1.0;
  let ymax = Math.max(P(0.1), pa) * 1.08; const st = ymax > 20 ? 5 : ymax > 8 ? 2 : ymax > 3 ? 1 : 0.5; ymax = Math.ceil(ymax / st) * st;
  const Xs = u => L + (R - L) * (u - u0) / (u1 - u0), Ys = v => B - (B - T) * Math.min(v, ymax) / ymax;
  svg.innerHTML = "";
  if (us > u0) mk("rect", {x: L, y: T, width: Xs(Math.min(us, 1)) - L, height: B - T, fill: css("--shade")});
  for (let v = 0; v <= ymax + 1e-9; v += st) { mk("line", {x1: L, x2: R, y1: Ys(v), y2: Ys(v), stroke: css("--grid")}); mk("text", {x: L - 6, y: Ys(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, st < 1 ? 1 : 0)); }
  for (let i = 1; i <= 10; i++) { const u = i / 10; mk("text", {x: Xs(u), y: B + 16, "text-anchor": "middle", "font-size": 11}, f(u, 1)); }
  mk("text", {x: (L + R) / 2, y: B + 36, "text-anchor": "middle", "font-size": 12}, "GPU-kihasználtság, u");
  mk("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "USD / 1M output token");
  mk("line", {x1: L, x2: R, y1: Ys(pa), y2: Ys(pa), stroke: css("--l2"), "stroke-width": 2, "stroke-dasharray": "8 5"});
  mk("text", {x: R - 4, y: Ys(pa) - 6, "text-anchor": "end", "font-size": 11}, `API: ${f(pa, 2)} USD/1M`);
  let d = ""; for (let i = 0; i <= 200; i++) { const u = u0 + (u1 - u0) * i / 200; d += (i ? "L" : "M") + Xs(u).toFixed(1) + " " + Ys(P(u)).toFixed(1); }
  mk("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 2.4});
  const marks = [[1.0, "o"], [0.4, "s"], [0.3, "t"]];
  marks.forEach(([u, m]) => { const x = Xs(u), y = Ys(P(u));
    if (m === "o") mk("circle", {cx: x, cy: y, r: 5.5, fill: css("--l2"), stroke: css("--fg")});
    else if (m === "s") mk("rect", {x: x - 5, y: y - 5, width: 10, height: 10, fill: css("--l2"), stroke: css("--fg")});
    else mk("path", {d: `M${x},${y - 7}l6,10.5h-12z`, fill: css("--l2"), stroke: css("--fg")});
    const right = u === 1.0, below = u === 0.3;
    mk("text", {x: right || below ? x - 8 : x + 8, y: below ? y + 22 : y - 9, "text-anchor": right || below ? "end" : "start", "font-size": 11}, `u=${f(u, 1)}: ${f(P(u), 2)}`); });
  if (us > u0 && us <= 1) { const x = Xs(us), y = Ys(pa); mk("path", {d: `M${x},${y - 8}l8,8l-8,8l-8,-8z`, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 2});
    mk("text", {x: x + 12, y: y - 24, "text-anchor": "start", "font-size": 12, "font-weight": "bold"}, `u* ≈ ${f(us, 2)}`); }
  $("status").textContent = us > 1 ? `A saját GPU még teljes kihasználtság mellett is drágább az API-nál (u* ≈ ${f(us, 2)} > 1).`
    : us < u0 ? `A saját GPU már 10%-os kihasználtság mellett is olcsóbb az API-nál (u* ≈ ${f(us, 2)}).`
    : `Töréspont: u* ≈ ${f(us, 2)}; ez alatt a saját GPU fajlagos költsége az API-ár (${f(pa, 2)} USD/1M) fölé kerül.`;
  $("formula").textContent = `X = ${tp} · 3600 = ${X.toLocaleString("hu-HU")} token/óra\n` +
    `p(0,4) = ${f(pg, 2)} / (${X.toLocaleString("hu-HU")} · 0,4) · 10⁶ = ${f(P(0.4), 2)} USD/1M token\n` +
    `u* = ${f(pg, 2)} · 10⁶ / (${f(pa, 2)} · ${X.toLocaleString("hu-HU")}) = ${f(us, 3)}`;
}
["pg", "tp", "pa"].forEach(id => $(id).oninput = draw);
$("rs").onclick = () => { $("pg").value = DEF.pg; $("tp").value = DEF.tp; $("pa").value = DEF.pa; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
