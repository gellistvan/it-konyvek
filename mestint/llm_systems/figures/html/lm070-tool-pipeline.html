<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az eszközhívás ellenőrzési rétegei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Laboreset:</span> <label><input type="radio" name="cs" checked onchange="setCase(0)"> 1: ugyfel_profil/read id=user-1</label> <label><input type="radio" name="cs" onchange="setCase(1)"> 2: ugyfel_profil/read id=user-99</label> <label><input type="radio" name="cs" onchange="setCase(2)"> 3: jegy_feladas/create tenant_id=tenant-1</label> <label><input type="radio" name="cs" onchange="setCase(3)"> 4: jegy_feladas/read bármilyen</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A modell javaslata hét ellenőrző rétegen halad át: eszköz-specifikáció, validáció, hitelesítés, engedélyezés, szűrt végrehajtás, kimeneti szűrés, naplózás. A 2. és 4. laboreset az engedélyezésnél deny döntést kap, az 1. és 3. eljut a naplózásig."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Didaktikus vázlat: a döntéseket a 19.2.3 canonicalize_request és a labor POLICY + evaluate függvényeinek átirata számolja (CALLER_1 = tenant-1, user-1). A modell doboza szaggatott: csak javaslatot ad, a döntést a független rétegek hozzák.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"case": 0, "layer": 0, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – eszköz-specifikáció: a modell javaslata (ugyfel_profil/read id=user-1) a leírt bemenő séma szerint érkezik – ez még csak javaslat.", "line": 0}, {"case": 0, "layer": 1, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – validáció: action = read ∈ {read, search, create} → séma rendben", "line": 1}, {"case": 0, "layer": 2, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – hitelesítés: a hívó a sessionből: tenant_id = tenant-1, user_id = user-1 (nem a promptból)", "line": 2}, {"case": 0, "layer": 3, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – engedélyezés: id user-1 = caller.user_id (user-1) → allow", "line": 3}, {"case": 0, "layer": 4, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – szűrt végrehajtás: előre definiált művelet a hívó identitásával; hitelesítő adat nem a promptból", "line": 4}, {"case": 0, "layer": 5, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – kimeneti szűrés: PII és belső mezők redactelése a válaszból", "line": 5}, {"case": 0, "layer": 6, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – naplózás: {tenant_id: tenant-1, action: read, resource: ugyfel_profil} – a raw_request nem kerül a naplóba", "line": 6}];
const CODE = ["modell → eszköz specifikáció (bemenő és kimenő séma leírása)", "       → validáció (séma ellenőrzése)", "       → hitelesítés (a hívó identitásából)", "       → engedélyezés (mátrix, feltételek)", "       → szűrt végrehajtás (belső rendszer, korlátozott adat)", "       → kimeneti szűrés (PII, belső mezők, redaction)", "       → naplózás (sanitized, minimális adattartalom)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = [[{"case": 0, "layer": 0, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – eszköz-specifikáció: a modell javaslata (ugyfel_profil/read id=user-1) a leírt bemenő séma szerint érkezik – ez még csak javaslat.", "line": 0}, {"case": 0, "layer": 1, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – validáció: action = read ∈ {read, search, create} → séma rendben", "line": 1}, {"case": 0, "layer": 2, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – hitelesítés: a hívó a sessionből: tenant_id = tenant-1, user_id = user-1 (nem a promptból)", "line": 2}, {"case": 0, "layer": 3, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – engedélyezés: id user-1 = caller.user_id (user-1) → allow", "line": 3}, {"case": 0, "layer": 4, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – szűrt végrehajtás: előre definiált művelet a hívó identitásával; hitelesítő adat nem a promptból", "line": 4}, {"case": 0, "layer": 5, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – kimeneti szűrés: PII és belső mezők redactelése a válaszból", "line": 5}, {"case": 0, "layer": 6, "state": "pass", "stop": -1, "req": "ugyfel_profil/read id=user-1", "msg": "1. eset – naplózás: {tenant_id: tenant-1, action: read, resource: ugyfel_profil} – a raw_request nem kerül a naplóba", "line": 6}], [{"case": 1, "layer": 0, "state": "pass", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – eszköz-specifikáció: a modell javaslata (ugyfel_profil/read id=user-99) a leírt bemenő séma szerint érkezik – ez még csak javaslat.", "line": 0}, {"case": 1, "layer": 1, "state": "pass", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – validáció: action = read ∈ {read, search, create} → séma rendben", "line": 1}, {"case": 1, "layer": 2, "state": "pass", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – hitelesítés: a hívó a sessionből: tenant_id = tenant-1, user_id = user-1 (nem a promptból)", "line": 2}, {"case": 1, "layer": 3, "state": "deny", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – engedélyezés: id user-99 ≠ caller.user_id (user-1) → deny", "line": 3}, {"case": 1, "layer": 4, "state": "skip", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – szűrt végrehajtás: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 4}, {"case": 1, "layer": 5, "state": "skip", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – kimeneti szűrés: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 5}, {"case": 1, "layer": 6, "state": "skip", "stop": 3, "req": "ugyfel_profil/read id=user-99", "msg": "2. eset – naplózás: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 6}], [{"case": 2, "layer": 0, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – eszköz-specifikáció: a modell javaslata (jegy_feladas/create tenant_id=tenant-1) a leírt bemenő séma szerint érkezik – ez még csak javaslat.", "line": 0}, {"case": 2, "layer": 1, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – validáció: action = create ∈ {read, search, create} → séma rendben", "line": 1}, {"case": 2, "layer": 2, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – hitelesítés: a hívó a sessionből: tenant_id = tenant-1, user_id = user-1 (nem a promptból)", "line": 2}, {"case": 2, "layer": 3, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – engedélyezés: tenant_id tenant-1 = caller.tenant_id (tenant-1) → allow", "line": 3}, {"case": 2, "layer": 4, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – szűrt végrehajtás: előre definiált művelet a hívó identitásával; hitelesítő adat nem a promptból", "line": 4}, {"case": 2, "layer": 5, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – kimeneti szűrés: PII és belső mezők redactelése a válaszból", "line": 5}, {"case": 2, "layer": 6, "state": "pass", "stop": -1, "req": "jegy_feladas/create tenant_id=tenant-1", "msg": "3. eset – naplózás: {tenant_id: tenant-1, action: create, resource: jegy_feladas} – a raw_request nem kerül a naplóba", "line": 6}], [{"case": 3, "layer": 0, "state": "pass", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – eszköz-specifikáció: a modell javaslata (jegy_feladas/read bármilyen) a leírt bemenő séma szerint érkezik – ez még csak javaslat.", "line": 0}, {"case": 3, "layer": 1, "state": "pass", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – validáció: action = read ∈ {read, search, create} → séma rendben", "line": 1}, {"case": 3, "layer": 2, "state": "pass", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – hitelesítés: a hívó a sessionből: tenant_id = tenant-1, user_id = user-1 (nem a promptból)", "line": 2}, {"case": 3, "layer": 3, "state": "deny", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – engedélyezés: jegy_feladas/read: csak deny szabály (condition = *) → deny", "line": 3}, {"case": 3, "layer": 4, "state": "skip", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – szűrt végrehajtás: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 4}, {"case": 3, "layer": 5, "state": "skip", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – kimeneti szűrés: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 5}, {"case": 3, "layer": 6, "state": "skip", "stop": 3, "req": "jegy_feladas/read bármilyen", "msg": "4. eset – naplózás: nem fut – a kérés a(z) engedélyezés rétegben deny döntést kapott", "line": 6}]], LAY = ["Eszköz-\nspecifikáció", "Validáció", "Hitelesítés", "Engedélyezés", "Szűrt\nvégrehajtás", "Kimeneti\nszűrés", "Naplózás"], SUB = ["bemenő/\nkimenő séma", "séma, típus,\nfelsorolás", "session:\ntenant-1,\nuser-1", "mátrix\n(POLICY)", "belső\nrendszer,\nszűkített adat", "PII, belső\nmezők", "sanitized,\nminimális"];
let CASE = 0;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 250");
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  const W = 84, G = 10, X = i => 4 + i * (W + G), Y = 36, H = 96;
  el("rect", {x: X(0), y: Y, width: W, height: H, rx: 8, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": "6 4", "stroke-width": 1.4});
  el("text", {x: X(0) + W / 2, y: Y + 30, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Modell");
  el("text", {x: X(0) + W / 2, y: Y + 50, "text-anchor": "middle", "font-size": 10, "font-style": "italic"}, "javaslat");
  el("text", {x: X(0) + W / 2, y: Y + 64, "text-anchor": "middle", "font-size": 10, "font-style": "italic"}, "„nem megbízható”");
  el("text", {x: X(1), y: 22, "font-size": 11, "font-style": "italic", fill: css("--muted")}, "a döntést a modelltől független rétegek hozzák →");
  for (let i = 0; i < 7; i++) {
    const x = X(i + 1), on = i === s.layer;
    const col = on ? (s.state === "deny" ? css("--hl2") : css("--hl")) : css("--line");
    el("rect", {x, y: Y, width: W, height: H, rx: 8, fill: on ? css("--cellhl") : css("--cell"), stroke: col, "stroke-width": on ? 3.5 : 1.2, opacity: s.state === "skip" && i > s.stop ? 0.5 : 1});
    LAY[i].split("\n").forEach((t, j, a) => el("text", {x: x + W / 2, y: Y + 26 + (j - (a.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, t));
    SUB[i].split("\n").forEach((t, j) => el("text", {x: x + W / 2, y: Y + 56 + j * 12, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, t));
    el("line", {x1: X(i) + W, y1: Y + H / 2, x2: x, y2: Y + H / 2, stroke: css("--fg"), "stroke-width": 1.2, "marker-end": "url(#ah)"});
    // jelölők a sávon
    const done = s.stop < 0 ? i <= s.layer : Math.min(s.layer, s.stop) >= i;
    if (done) {
      const deny = s.stop === i;
      el("circle", {cx: x + W / 2, cy: 175, r: 13, fill: deny ? css("--cellhl") : css("--cell"), stroke: deny ? css("--hl2") : css("--line"), "stroke-width": deny ? 2.5 : 1.2});
      el("text", {x: x + W / 2, y: 181, "text-anchor": "middle", "font-size": 17, "font-weight": "bold"}, deny ? "✗" : "✓");
      if (deny) { el("line", {x1: x + W / 2 + 24, y1: 152, x2: x + W / 2 + 24, y2: 198, stroke: css("--fg"), "stroke-width": 5});
        el("text", {x: x + W / 2, y: 214, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "deny"); }
    }
  }
  // a kérés „tokenje”
  const reach = s.stop < 0 ? s.layer : Math.min(s.layer, s.stop);
  el("line", {x1: X(1), y1: 175, x2: X(reach + 1) + W / 2 - 14, y2: 175, stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: X(1), y: 240, "font-size": 12, "font-family": "monospace"}, `${s.case + 1}. eset: ${s.req}`);
  if (s.stop < 0 && s.layer === 6) el("text", {x: X(7) + W, y: 214, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, "allow → naplózva");
}
function setCase(n){ CASE = n; const kk = k; setSteps(SETS[n]); show(kk); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
