<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPE-összevonások és morfémahatárok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<div id="status" aria-live="polite"></div>

e", "imb", "en</w>"], ["kertb", "en</w>"], ["kertb", "ő", "l</w>"]], "top": [[["ház", "a"], 5], [["a", "imb"], 5], [["házb", "an</w>"], 4], [["kert", "j"], 4], [["j", "e"], 4]], "win": ["ház", "a"], "msg": "15. lépés: ház+a (5) → háza; házaimból = háza|imb|ól</w>"}, {"line": 4, "words": [["házaimb", "ól</w>"], ["házaimb", "an</w>"], ["házb", "an</w>"], ["házb", "ól</w>"], ["kert", "j", "e", "imb", "ő", "l</w>"], ["kert", "j", "e", "imb", "en</w>"], ["kertb", "en</w>"], ["kertb", "ő", "l</w>"]], "top": [[["háza", "imb"], 5], [["házb", "an</w>"], 4], [["kert", "j"], 4], [["j", "e"], 4], [["e", "imb"], 4]], "win": ["háza", "imb"], "msg": "16. lépés: háza+imb (5) → házaimb; házaimból = házaimb|ól</w>"}, {"line": 4, "words": [["házaimb", "ól</w>"], ["házaimb", "an</w>"], ["házban</w>"], ["házb", "ól</w>"], ["kert", "j", "e", "imb", "ő", "l</w>"], ["kert", "j", "e", "imb", "en</w>"], ["kertb", "en</w>"], ["kertb", "ő", "l</w>"]], "top": [[["házb", "an</w>"], 4], [["kert", "j"], 4], [["j", "e"], 4], [["e", "imb"], 4], [["ő", "l</w>"], 4]], "win": ["házb", "an</w>"], "msg": "17. lépés: házb+an</w> (4) → házban</w>; házaimból = házaimb|ól</w>"}, {"line": 4, "words": [["házaimb", "ól</w>"], ["házaimb", "an</w>"], ["házban</w>"], ["házb", "ól</w>"], ["kertj", "e", "imb", "ő", "l</w>"], ["kertj", "e", "imb", "en</w>"], ["kertb", "en</w>"], ["kertb", "ő", "l</w>"]], "top": [[["kert", "j"], 4], [["j", "e"], 4], [["e", "imb"], 4], [["ő", "l</w>"], 4], [["kertb", "en</w>"], 4]], "win": ["kert", "j"], "msg": "18. lépés: kert+j (4) → kertj; házaimból = házaimb|ól</w>"}, {"line": 4, "words": [["házaimb", "ól</w>"], ["házaimb", "an</w>"], ["házban</w>"], ["házb", "ól</w>"], ["kertje", "imb", "ő", "l</w>"], ["kertje", "imb", "en</w>"], ["kertb", "en</w>"], ["kertb", "ő", "l</w>"]], "top": [[["kertj", "e"], 4], [["e", "imb"], 4], [["ő", "l</w>"], 4], [["kertb", "en</w>"], 4], [["házaimb", "ól</w>"], 3]], "win": ["kertj", "e"], "msg": "19. lépés: kertj+e (4) → kertje; házaimból = házaimb| // ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EOW = "</w>";
let CORP = [["házaimból", 3], ["házaimban", 2], ["házban", 4], ["házból", 3], ["kertjeimből", 2], ["kertjeimben", 2], ["kertben", 4], ["kertből", 2]];

function bpeSteps(corpus, nm){
  let words = corpus.map(([w]) => [...w, EOW]);
  const st = [{line: 0, words, top: [], win: null, msg: `0. lépés: karakterekre bontott korpusz szóvég-jellel; ${corpus[0][0]} = ${words[0].join("|")}`}];
  for (let i = 1; i <= nm; i++) {
    const cnt = new Map();
    words.forEach((s, wi) => { for (let j = 0; j + 1 < s.length; j++) { const key = s[j] + "\u0000" + s[j + 1]; cnt.set(key, (cnt.get(key) || 0) + corpus[wi][1]); } });
    if (!cnt.size) break;
    let best = -1, win = null; cnt.forEach((c, key) => { if (c > best) { best = c; win = key; } });
    const top = [...cnt.entries()].map((e, idx) => [e, idx]).sort((a, b) => b[0][1] - a[0][1] || a[1] - b[1]).slice(0, 5).map(([e]) => [e[0].split("\u0000"), e[1]]);
    const W = win.split("\u0000"), tok = W[0] + W[1];
    words = words.map(s => { const o = []; for (let j = 0; j < s.length; j++) { if (j + 1 < s.length && s[j] === W[0] && s[j + 1] === W[1]) { o.push(tok); j++; } else o.push(s[j]); } return o; });
    st.push({line: 4, words, top, win: W, msg: `${i}. lépés: ${W[0]}+${W[1]} (${best}) → ${tok}; ${corpus[0][0]} = ${words[0].join("|")}`});
  }
  return st;
}
function clen(t){ return [...t.replace(EOW, "")].length; }
function tw(t){ return 14 * clen(t) + (t.endsWith(EOW) ? 30 : 0); }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 " + (70 + 34 * s.words.length));
  const mut = css("--muted");
  svg.innerHTML = `<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mut}" stroke-width="2"/></pattern></defs>`;
  const line = css("--line"), cell = css("--cell"), hl = css("--hl");
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "Párgyakoriság (top 5)");
  (s.top || []).forEach(([p, c], i) => {
    const y = 28 + i * 26, win = s.win && p[0] === s.win[0] && p[1] === s.win[1];
    el("rect", {x: 10, y: y, width: 170, height: 22, fill: win ? css("--cellhl") : cell, stroke: win ? hl : line, "stroke-width": win ? 3 : 1});
    el("text", {x: 16, y: y + 16, "font-size": 13, "font-family": "ui-monospace,monospace", "font-weight": win ? "bold" : "normal"}, `${p[0]} + ${p[1]}`);
    el("text", {x: 174, y: y + 16, "font-size": 13, "text-anchor": "end", "font-weight": win ? "bold" : "normal"}, String(c));
  });
  if (!(s.top || []).length) el("text", {x: 10, y: 44, "font-size": 12, fill: mut}, "(még nincs összevonás)");
  if (s.win) {
    el("text", {x: 10, y: 172, "font-size": 12.5}, "új token a szókészletben:");
    el("text", {x: 10, y: 194, "font-size": 15, "font-weight": "bold", "font-family": "ui-monospace,monospace"}, s.win[0] + s.win[1]);
  }
  el("text", {x: 330, y: 18, "font-size": 13, "font-weight": "bold"}, "A korpusz aktuális szegmentálása");
  const nt = s.win ? s.win[0] + s.win[1] : null;
  s.words.forEach((sym, wi) => {
    const y = 30 + wi * 34, w = CORP[wi][0], X0 = 330;
    el("text", {x: X0 - 8, y: y + 18, "font-size": 12.5, "text-anchor": "end"}, w + " ×" + CORP[wi][1]);
    const mb = []; if (MORPH[w]) { let p = 0; MORPH[w].slice(0, -1).forEach(m => { p += [...m].length; mb.push(p); }); }
    let x = X0, p = 0;
    for (const t of sym) {
      const n = clen(t), cr = mb.some(b => p < b && b < p + n), on = nt && t === nt;
      el("rect", {x: x, y: y, width: tw(t), height: 26, fill: on ? css("--cellhl") : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
      if (cr) el("rect", {x: x + 1, y: y + 1, width: tw(t) - 2, height: 24, fill: "url(#hp)"});
      el("text", {x: x + tw(t) / 2, y: y + 18, "font-size": 13, "text-anchor": "middle", "font-family": "ui-monospace,monospace", "font-weight": on ? "bold" : "normal"}, t);
      x += tw(t); p += n;
      if (x > 695) break;
    }
    mb.forEach(b => el("line", {x1: X0 + 14 * b, y1: y - 4, x2: X0 + 14 * b, y2: y + 30, stroke: line, "stroke-width": 2, "stroke-dasharray": "4 3"}));
  });
  el("text", {x: 10, y: 46 + 34 * s.words.length, "font-size": 11.5, fill: mut}, "cellahatár = tokenhatár; szaggatott vonal = morfémahatár (csak a mintakorpusz szavainál);");
  el("text", {x: 10, y: 62 + 34 * s.words.length, "font-size": 11.5, fill: mut}, "sraffozás = a token átlépi a morfémahatárt; vastag keret = az ebben a lépésben keletkezett token");
}
function parseCorpus(){
  const err = document.getElementById("err"), out = [];
  for (const raw of document.getElementById("corp").value.split("\n")) {
    const l = raw.trim(); if (!l) continue;
    const m = l.match(/^(\S+)\s*:\s*(\d+)$/);
    if (!m || +m[2] < 1) { err.textContent = "Hibás sor: „" + l + "” (alak: szó:gyakoriság)"; return null; }
    out.push([m[1], +m[2]]);
  }
  if (!out.length || out.length > 8) { err.textContent = "1–8 sort adjon meg."; return null; }
  err.textContent = ""; return out;
}
function loadBpe(){ const c = parseCorpus(); if (!c) return; CORP = c; setSteps(bpeSteps(c, 20)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
