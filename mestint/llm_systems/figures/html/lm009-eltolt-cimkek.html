<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eltolt címkék és softmax</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="shift" type="checkbox" onchange="toggles()"> eltolás nélkül</label><label><input id="mask" type="checkbox" onchange="toggles()"> padding maszk nélkül</label><label>széken: <input id="z0" type="range" min="-4" max="4" step="0.1" value="2.0" oninput="show(k)" aria-label="széken logitja"></label><label>padlón: <input id="z1" type="range" min="-4" max="4" step="0.1" value="1.0" oninput="show(k)" aria-label="padlón logitja"></label><label>matrac: <input id="z2" type="range" min="-4" max="4" step="0.1" value="0.1" oninput="show(k)" aria-label="matrac logitja"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat tokenes sorozat; minden pozíció logitja a következő tokent jósolja, az utolsó logit és az első token kimarad, a padding címkéje −100; alatta a 2,0; 1,0; 0,1 logitokból 0,659; 0,242; 0,099 valószínűség."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">B = 1, T = 6; szemléltető szóalakok (nem valódi tokenizer). A veszteség a címkés pozíciók −log p tagjainak átlaga (ignore_index = −100). Alul a 4.1.1 példája: z = (2,0; 1,0; 0,1) → (0,659; 0,242; 0,099), Σ e^z = 11,2125 (a szövegben 3 jegyre kerekített tagokkal 11,212).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "lab": "macska", "shift": true, "mask": true, "n": 5, "msg": "1/5 logit 0 (előzmény: A) → címke „macska”: tag −log p(macska)"}, {"t": 1, "lab": "ül", "shift": true, "mask": true, "n": 5, "msg": "2/5 logit 1 (előzmény: A macska) → címke „ül”: tag −log p(ül)"}, {"t": 2, "lab": "a", "shift": true, "mask": true, "n": 5, "msg": "3/5 logit 2 (előzmény: A macska ül) → címke „a”: tag −log p(a)"}, {"t": 3, "lab": "széken", "shift": true, "mask": true, "n": 5, "msg": "4/5 logit 3 (előzmény: A macska ül a) → címke „széken”: tag −log p(széken)"}, {"t": 4, "lab": -100, "shift": true, "mask": true, "n": 5, "msg": "5/5 logit 4 → címke −100 (padding): a veszteségből kimarad. Összesen 4 veszteségtag átlaga"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const SETS = {"11": [{"t": 0, "lab": "macska", "shift": true, "mask": true, "n": 5, "msg": "1/5 logit 0 (előzmény: A) → címke „macska”: tag −log p(macska)"}, {"t": 1, "lab": "ül", "shift": true, "mask": true, "n": 5, "msg": "2/5 logit 1 (előzmény: A macska) → címke „ül”: tag −log p(ül)"}, {"t": 2, "lab": "a", "shift": true, "mask": true, "n": 5, "msg": "3/5 logit 2 (előzmény: A macska ül) → címke „a”: tag −log p(a)"}, {"t": 3, "lab": "széken", "shift": true, "mask": true, "n": 5, "msg": "4/5 logit 3 (előzmény: A macska ül a) → címke „széken”: tag −log p(széken)"}, {"t": 4, "lab": -100, "shift": true, "mask": true, "n": 5, "msg": "5/5 logit 4 → címke −100 (padding): a veszteségből kimarad. Összesen 4 veszteségtag átlaga"}], "10": [{"t": 0, "lab": "macska", "shift": true, "mask": false, "n": 5, "msg": "1/5 logit 0 (előzmény: A) → címke „macska”: tag −log p(macska)"}, {"t": 1, "lab": "ül", "shift": true, "mask": false, "n": 5, "msg": "2/5 logit 1 (előzmény: A macska) → címke „ül”: tag −log p(ül)"}, {"t": 2, "lab": "a", "shift": true, "mask": false, "n": 5, "msg": "3/5 logit 2 (előzmény: A macska ül) → címke „a”: tag −log p(a)"}, {"t": 3, "lab": "széken", "shift": true, "mask": false, "n": 5, "msg": "4/5 logit 3 (előzmény: A macska ül a) → címke „széken”: tag −log p(széken)"}, {"t": 4, "lab": "<pad>", "shift": true, "mask": false, "n": 5, "msg": "5/5 logit 4 (előzmény: A macska ül a széken) → címke „<pad>”: tag −log p(<pad>) – FIGYELEM: maszk nélkül a padding is tanítójelet ad. Összesen 5 veszteségtag átlaga"}], "01": [{"t": 0, "lab": "A", "shift": false, "mask": true, "n": 6, "msg": "1/6 logit 0 (előzmény: A) → címke „A”: tag −log p(A) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 1, "lab": "macska", "shift": false, "mask": true, "n": 6, "msg": "2/6 logit 1 (előzmény: A macska) → címke „macska”: tag −log p(macska) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 2, "lab": "ül", "shift": false, "mask": true, "n": 6, "msg": "3/6 logit 2 (előzmény: A macska ül) → címke „ül”: tag −log p(ül) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 3, "lab": "a", "shift": false, "mask": true, "n": 6, "msg": "4/6 logit 3 (előzmény: A macska ül a) → címke „a”: tag −log p(a) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 4, "lab": "széken", "shift": false, "mask": true, "n": 6, "msg": "5/6 logit 4 (előzmény: A macska ül a széken) → címke „széken”: tag −log p(széken) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 5, "lab": -100, "shift": false, "mask": true, "n": 6, "msg": "6/6 logit 5 → címke −100 (padding): a veszteségből kimarad. Összesen 5 veszteségtag átlaga"}], "00": [{"t": 0, "lab": "A", "shift": false, "mask": false, "n": 6, "msg": "1/6 logit 0 (előzmény: A) → címke „A”: tag −log p(A) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 1, "lab": "macska", "shift": false, "mask": false, "n": 6, "msg": "2/6 logit 1 (előzmény: A macska) → címke „macska”: tag −log p(macska) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 2, "lab": "ül", "shift": false, "mask": false, "n": 6, "msg": "3/6 logit 2 (előzmény: A macska ül) → címke „ül”: tag −log p(ül) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 3, "lab": "a", "shift": false, "mask": false, "n": 6, "msg": "4/6 logit 3 (előzmény: A macska ül a) → címke „a”: tag −log p(a) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 4, "lab": "széken", "shift": false, "mask": false, "n": 6, "msg": "5/6 logit 4 (előzmény: A macska ül a széken) → címke „széken”: tag −log p(széken) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss)"}, {"t": 5, "lab": "<pad>", "shift": false, "mask": false, "n": 6, "msg": "6/6 logit 5 (előzmény: A macska ül a széken <pad>) → címke „<pad>”: tag −log p(<pad>) – FIGYELEM: eltolás nélkül a pozíció önmagát jósolja (másolás → hamisan alacsony loss). Összesen 6 veszteségtag átlaga"}]};

const TOK = ["A", "macska", "ül", "a", "széken", "<pad>"], VOC = ["széken", "padlón", "matrac"];
function smax(z){ const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return {p: e.map(v => v / s), den: z.reduce((a, v) => a + Math.exp(v), 0)}; }
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
function render(s){
  svg.setAttribute("viewBox", "0 0 660 420");
  svg.innerHTML = "";
  const line = css("--line"), hl = css("--hl"), cell = css("--cell"), W = 84, X0 = 120;
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${css("--cellhl")}"/><path d="M0,7L7,0" stroke="${css("--muted")}" stroke-width="1"/></pattern>`;
  const rows = [["token", 20], ["logit", 80], [s.shift ? "címke (eltolt)" : "címke (eltolás NÉLKÜL)", 140], ["veszteségtag", 196]];
  rows.forEach(([t, y]) => el("text", {x: X0 - 8, y: y + 22, "font-size": 12, "text-anchor": "end"}, t));
  const pr = STEPS.map(q => [q.t, q.lab]);
  TOK.forEach((w, t) => {
    const x = X0 + t * W, onTok = s.shift ? t === s.t + 1 : t === s.t;
    el("rect", {x, y: 20, width: W - 6, height: 34, fill: t === 5 ? "url(#hm)" : (onTok ? css("--cellhl") : cell), stroke: onTok ? hl : line, "stroke-width": onTok ? 3 : 1});
    el("text", {x: x + W / 2 - 3, y: 42, "font-size": 13, "text-anchor": "middle", "font-family": "ui-monospace,monospace"}, w);
    const cut = s.shift && t === 5, onL = t === s.t;
    el("rect", {x, y: 80, width: W - 6, height: 34, fill: onL ? css("--cellhl") : cell, stroke: onL ? hl : line, "stroke-width": onL ? 3 : 1});
    el("text", {x: x + W / 2 - 3, y: 102, "font-size": 13, "text-anchor": "middle"}, "logit " + t);
    if (cut) { el("line", {x1: x, y1: 80, x2: x + W - 6, y2: 114, stroke: line, "stroke-width": 2}); el("line", {x1: x, y1: 114, x2: x + W - 6, y2: 80, stroke: line, "stroke-width": 2});
      el("text", {x: x + W / 2 - 3, y: 160, "font-size": 11, "text-anchor": "middle", "font-family": "ui-monospace,monospace"}, "logits[:, :-1]"); }
  });
  pr.forEach(([t, lab], i) => {
    const x = X0 + t * W, on = t === s.t, m = lab === -100, seen = i <= k;
    el("rect", {x, y: 140, width: W - 6, height: 34, fill: m ? "url(#hm)" : (on ? css("--cellhl") : cell), stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
    el("text", {x: x + W / 2 - 3, y: 162, "font-size": 13, "text-anchor": "middle", "font-family": "ui-monospace,monospace"}, m ? "−100" : lab);
    el("line", {x1: x + W / 2 - 3, y1: 114, x2: x + W / 2 - 3, y2: 138, stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
    if (seen) el("text", {x: x + W / 2 - 3, y: 216, "font-size": 12, "text-anchor": "middle", "font-style": m ? "italic" : "normal", fill: (!s.shift || (lab === "<pad>")) && !m ? css("--hl2") : css("--fg")}, m ? "kimarad" : `−log p(${lab})`);
  });
  if (s.shift) { el("text", {x: X0 + W / 2, y: 70, "font-size": 10.5, "text-anchor": "middle", fill: css("--muted")}, "„A”: nincs címkéje (labels[:, 1:])"); }
  else el("text", {x: X0, y: 246, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "⚠ eltolás nélkül minden pozíció önmagát jósolja: másolás → hamisan alacsony loss");
  // softmax-panel
  const z = [0, 1, 2].map(i => +document.getElementById("z" + i).value), r = smax(z), y0 = 400, Hs = 110;
  el("text", {x: 20, y: 268, "font-size": 13, "font-weight": "bold"}, "A 4.1.1 softmax-példája (a logitok a csúszkákkal állíthatók)");
  const zm = Math.max(4, ...z.map(Math.abs));
  z.forEach((v, i) => { const h = Hs * Math.abs(v) / zm, x = 60 + i * 70;
    el("rect", {x, y: v >= 0 ? y0 - h : y0, width: 50, height: Math.max(h, 0.5), fill: i === 0 ? css("--muted") : cell, stroke: line});
    el("text", {x: x + 25, y: y0 - h - 4, "font-size": 12, "text-anchor": "middle"}, f(v, 1));
    el("text", {x: x + 25, y: y0 + 14, "font-size": 11.5, "text-anchor": "middle"}, VOC[i]); });
  el("text", {x: 300, y: 340, "font-size": 13, "text-anchor": "middle"}, "softmax →");
  el("text", {x: 300, y: 358, "font-size": 12, "text-anchor": "middle"}, "Σ e^z = " + f(r.den, 4));
  r.p.forEach((p, i) => { const h = Hs * p, x = 400 + i * 80;
    el("rect", {x, y: y0 - h, width: 56, height: Math.max(h, 0.5), fill: i === 0 ? css("--muted") : cell, stroke: line});
    el("text", {x: x + 28, y: y0 - h - 4, "font-size": 12.5, "text-anchor": "middle", "font-weight": "bold"}, f(p, 3));
    el("text", {x: x + 28, y: y0 + 14, "font-size": 11.5, "text-anchor": "middle"}, VOC[i]); });
  el("line", {x1: 40, y1: y0, x2: 640, y2: y0, stroke: line});
}
function toggles(){ const kk = k; setSteps(SETS[(document.getElementById("shift").checked ? "0" : "1") + (document.getElementById("mask").checked ? "0" : "1")]); show(Math.min(kk, STEPS.length - 1)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
