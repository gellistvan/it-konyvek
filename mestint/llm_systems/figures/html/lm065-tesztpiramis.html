<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesztpiramis és fagylalttölcsér</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>E2E-tesztek száma n = <input id="sn" type="range" min="10" max="200" step="1" value="30" oninput="sg()" style="width:150px" aria-label="E2E-tesztek száma"></label> <label>sikerarány p (%) = <input id="sp" type="range" min="50" max="99" step="1" value="90" oninput="sg()" style="width:120px" aria-label="sikerarány"></label></div><div class="ctl"><output id="sout" aria-live="polite">n = 30, p = 0,90 → σ = √(p(1 − p)/n) = 0,055; ±1σ: 0,845 … 0,955</output></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalon tesztpiramis: alul unit, középen integráció, felül E2E, a labor tesztneveivel. Jobb oldalon fordított kúp, amelyben az E2E réteg a legszélesebb."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus arányok. A tesztkód a fejezet laborjából (lm065_lab_e2e_plan.py). σ a binomiális standard hiba normál közelítésben; n = 30, p = 0,9 esetén 0,0548 ≈ 0,055.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"lv": -1, "msg": "Kattints egy sávra (vagy léptess): a szint leírása és a labor tesztkódja jelenik meg.", "line": -1}, {"lv": 0, "msg": "1. szint – Unit tesztek (18.1.4.1): az LLM-et nem hívják vagy mockolják; prompt-sablon, JSON-séma, adattranszformáció. Leggyorsabb visszajelzés, a hiba helye pontosan ismert.", "line": -1, "code": "def test_unit_schema_accepts_valid_data():\n    valid_payload = {\"priority\": \"high\", \"title\": \"Hálózati hiba az irodában\"}\n    assert validate_ticket_schema(valid_payload) is True\n\ndef test_unit_schema_rejects_malformed_data():\n    invalid_payload = {\"priority\": \"urgent\", \"title\": \"Hiba\"}  # Ismeretlen prioritás\n    assert validate_ticket_schema(invalid_payload) is False"}, {"lv": 1, "msg": "2. szint – Integrációs tesztek (18.1.4.2): egy LLM-hívás, a tool mock API; a modell és a tool interfészét és a hibaterjedést vizsgálja.", "line": -1, "code": "def test_integration_agent_parses_valid_tool_call():\n    # Rögzített mock válasz (szimulálja a modell kimenetét)\n    mock_responses = [\n        json.dumps({\n            \"answer\": \"Létrehoztam a hibajegyet.\",\n            \"tool\": \"create_ticket\",\n            \"payload\": {\"priority\": \"high\", \"title\": \"Hálózati hiba\"}\n        }, ensure_ascii=False)\n    ]\n    agent = ITAgent(MockLLM(mock_responses))\n    result = agent.run(\"Nem érem el a belső szervert!\")\n\n    # Funkcionális ellenőrzés\n    assert result.tool_called == \"create_ticket\"\n    assert result.tool_payload is not None\n    assert validate_ticket_schema(result.tool_payload) == True\n\n    # Nem funkcionális ellenőrzés (idő mérése)\n    assert result.latency_ms >= 0\n    assert result.tokens > 0\n    print(f\"[INTEGRÁCIÓ] Mért latencia: {result.latency_ms:.2f} ms, Token: {result.tokens}\")"}, {"lv": 2, "msg": "3. szint – End-to-end tesztek (18.1.4.3): a teljes felhasználói út; drága, lassú, sztochasztikus, statisztikai értékelést igényel. A laborban mockolt, determinisztikus integrációs próba.", "line": -1, "code": "def test_e2e_full_agency_flow():\n    # Mock válaszok a fenti sorrendben (a mock determinisztikus)\n    mock_llm_output = [\n        json.dumps({\n            \"answer\": \"A 3. emeleti nyomtató hibajegyét rögzítettem.\",\n            \"tool\": \"create_ticket\",\n            \"payload\": {\"priority\": \"medium\", \"title\": \"Nyomtató hiba\"}\n        }, ensure_ascii=False),\n        json.dumps({\n            \"answer\": \"Biztonsági okokból nem adhatom meg a jelszót. Kérem, keresse az IT osztályt.\",\n            \"tool\": None,\n            \"payload\": None\n        }, ensure_ascii=False)\n    ]\n\n    passed_count, outcomes, latency_samples = run_golden_set(mock_llm_output)\n    success_rate = passed_count / len(GOLDEN_SET)\n\n    # --- A várt és a mért értékek szigorú elválasztása ---\n    print(\"\\n=== E2E JELENTÉS (determinisztikus integrációs próba) ===\")\n    print(f\"ADATVERZIÓ: {DATA_VERSION}\")\n    print(f\"VÁRT sikerességi ráta: 1.00 (a két eset minden feltétele együtt)\")\n    print(f\"MÉRT sikerességi ráta: {success_rate:.2f}\")\n    print(f\"Esetenkénti döntés: {outcomes}\")\n    # A mock hívás helyi feldolgozási ideje csak szemléltető adat; NEM a valódi\n    # szolgáltatás végponti latenciája, ezért belőle üzemi küszöb nem vezethető le.\n    print(f\"MÉRT helyi mock-feldolgozás (szemléltető): {latency_samples} ms\")\n\n    assert passed_count == 2, f\"Két sikeres eset helyett: {passed_count}/2\"\n    assert success_rate == 1.0\n\ndef test_wrong_payload_fails_case():\n    \"\"\"A helyes tool rossz payloaddal nem kaphat pontot.\"\"\"\n    mock_llm_output = [\n        json.dumps({\n            \"answer\": \"A hibajegyet rögzítettem.\",\n            \"tool\": \"create_ticket\",\n            \"payload\": {\"priority\": \"critical\", \"title\": \"Nyomtató hiba\"}  # érvénytelen prioritás\n        }, ensure_ascii=False),\n        json.dumps({\n            \"answer\": \"Biztonsági okokból nem adhatom meg a jelszót.\",\n            \"tool\": None,\n            \"payload\": None\n        }, ensure_ascii=False)\n    ]\n    passed_count, outcomes, _ = run_golden_set(mock_llm_output)\n    assert outcomes[0] == (\"IT-001\", False), outcomes[0]\n    assert passed_count == 1, outcomes\n    assert passed_count / len(GOLDEN_SET) == 0.5"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LV = [{"name": "Unit"}, {"name": "Integráció"}, {"name": "E2E"}];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="h0" patternUnits="userSpaceOnUse" width="7" height="7"><circle cx="3.5" cy="3.5" r="1.1" fill="${css("--muted")}"/></pattern>
  <pattern id="h1" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="${css("--muted")}" stroke-width="1.2"/></pattern>
  <pattern id="h2" patternUnits="userSpaceOnUse" width="7" height="7"><path d="M0,0 L7,7 M7,0 L0,7" stroke="${css("--muted")}" stroke-width="0.9"/></pattern>`;
  const band = (pts, i, label, cx, y) => {
    const on = s.lv === i, P = pts.map(p => p.join(",")).join(" ");
    el("polygon", {points: P, fill: css("--cell")});
    el("polygon", {points: P, fill: `url(#h${i})`});
    const g = el("polygon", {points: P, fill: "transparent", stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : 1.3, style: "cursor:pointer", onclick: `stop(); show(${i + 1})`, tabindex: 0, role: "button", "aria-label": label});
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { stop(); show(i + 1); } });
    el("rect", {x: cx - 48, y: y - 13, width: 96, height: 19, fill: css("--bg"), stroke: "none", "pointer-events": "none"});
    el("text", {x: cx, y: y + 1, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold", "pointer-events": "none"}, label);
  };
  const H = 85, cx = 200, B = 360, T = 40;
  const wAt = y => B + (T - B) * y / (3 * H);
  LV.forEach((L, i) => {
    const y0 = 270 - i * H, y1 = y0 - H, w0 = wAt(i * H), w1 = wAt((i + 1) * H);
    band([[cx - w0 / 2, y0], [cx + w0 / 2, y0], [cx + w1 / 2, y1], [cx - w1 / 2, y1]], i, L.name, cx, y0 - H / 2);
  });
  el("text", {x: 20, y: 290, "font-size": 11, fill: css("--muted")}, "Tesztpiramis (ajánlott)");
  const cx2 = 560;
  LV.forEach((L, i) => {
    const y0 = 270 - i * H, y1 = y0 - H, w0 = wAt((3 - i) * H) * 0.7, w1 = wAt((2 - i) * H) * 0.7;
    band([[cx2 - w0 / 2, y0], [cx2 + w0 / 2, y0], [cx2 + w1 / 2, y1], [cx2 - w1 / 2, y1]], i, L.name, cx2, y0 - H / 2);
  });
  el("text", {x: 430, y: 290, "font-size": 11, fill: css("--muted")}, "Fagylalttölcsér: csak E2E → a hiba helye ismeretlen");
  let tc = document.getElementById("tc");
  if (!tc) { tc = document.createElement("pre"); tc.id = "tc"; tc.setAttribute("aria-label", "A szint tesztkódja");
    tc.style.cssText = "width:100%;margin:0;padding:6px 8px;background:var(--code);font:12px/1.45 ui-monospace,monospace;white-space:pre;overflow-x:auto";
    document.querySelector(".wrap").appendChild(tc); }
  tc.textContent = s.code || "";
  tc.style.display = s.code ? "block" : "none";
}
function sg(){
  const n = +document.getElementById("sn").value, p = +document.getElementById("sp").value / 100;
  const sd = Math.sqrt(p * (1 - p) / n), f = (x, d) => x.toFixed(d).replace(".", ",");
  document.getElementById("sout").textContent = `n = ${n}, p = ${f(p, 2)} → σ = √(p(1 − p)/n) = ${f(sd, 3)}; ±1σ: ${f(Math.max(0, p - sd), 3)} … ${f(Math.min(1, p + sd), 3)}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
