<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibaanalízis kontrollpróbával</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--line:#000;--code:#f3f3f3;--act:#e8e8e8;--on:#dce8f5}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--line:#ddd;--code:#2a2a2a;--act:#333;--on:#2b3e55}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 12px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block;max-width:700px}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:6px}
th,td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
th{background:var(--code)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Döntés">
  <span id="q"></span>
  <button id="yes">igen</button><button id="no">nem</button><button id="reset">újrakezdés</button>
</div>
<div id="status" aria-live="polite"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<pattern id="diag" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#888" stroke-width="1.4"/></pattern>
</defs></svg>
<svg id="v" viewBox="0 0 640 400" role="img" aria-label="Döntési fa: megfigyelés, két hipotézis, két kontrollpróba, bizonyított okok és intézkedések"></svg>
<table aria-label="Hibakatalógus aktuális sora"><thead><tr><th>Megfigyelés</th><th>Feltételezett ok</th><th>Kontrollpróba</th><th>Bizonyított ok</th><th>Intézkedés</th></tr></thead>
<tbody><tr><td id="c0"></td><td id="c1"></td><td id="c2"></td><td id="c3"></td><td id="c4"></td></tr></tbody></table>
<p class="small">A 30.4.6 táblázata szerint. Az intézkedés mező csak bizonyított ok után töltődik ki: a feltételezett okból nem lesz azonnal intézkedés,
előbb a kontrollpróba zárja ki a versengő magyarázatot.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const OBS = "a válasz IT-SZAB-7.3-ra hivatkozik IT-SZAB-4.2 helyett", LEAVES = {"L1": {"cause": "visszakeresési hiba", "act": "a visszakereső lekérdezésének / indexének javítása", "hyp": "H1: a helyes szakasz nincs a kontextusban", "ctrl": "K1: gold szakasz közvetlenül a promptba → javul"}, "L2": {"cause": "generálási hiba", "act": "generálási utasítás / hivatkozás formátumának javítása", "hyp": "H2: a szakasz ott van, a modell mást választ", "ctrl": "K2: csak hivatkozás-kinyerés azonos kontextussal → helyes"}, "L3": {"cause": "a prompt / kontextus félrevezető", "act": "a kontextus sorrendjének és a promptnak a javítása", "hyp": "H2: a szakasz ott van, a modell mást választ", "ctrl": "K2: a hivatkozás-kinyerés is téves"}};
// állapotok: D1 (javul?), D2 (kinyerés helyes?), L1, L2, L3
let st = "D1";
const N = {
  obs: [170, 8, 300, 40, "Megfigyelés: IT-SZAB-7.3 az IT-SZAB-4.2 helyett", "sq"],
  H1: [20, 70, 220, 38, "H1: a helyes szakasz nincs a kontextusban", "r"],
  H2: [380, 70, 240, 38, "H2: a szakasz ott van, a modell mást választ", "r"],
  K1: [20, 130, 220, 38, "K1: gold szakasz közvetlenül a promptba", "dbl"],
  K2: [380, 130, 240, 38, "K2: csak hivatkozás-kinyerés, azonos kontextus", "dbl"],
  D1: [130, 222, 130, 56, "javul?", "dia"],
  D2: [500, 222, 150, 56, "kinyerés helyes?", "dia"],
  L1: [20, 280, 220, 38, "ok: visszakeresési hiba", "thick"],
  L2: [330, 280, 150, 38, "ok: generálási hiba", "thick"],
  L3: [490, 280, 140, 38, "ok: prompt / kontextus", "thick"],
  A1: [20, 345, 220, 38, "intézkedés: lekérdezés, index", "act"],
  A2: [330, 345, 150, 38, "utasítás, formátum", "act"],
  A3: [490, 345, 140, 38, "sorrend, prompt", "act"],
};
const PATH = {D1: ["obs", "H1", "K1", "D1"], D2: ["obs", "H1", "K1", "D1", "H2", "K2", "D2"], L1: ["obs", "H1", "K1", "D1", "L1", "A1"],
              L2: ["obs", "H1", "K1", "D1", "H2", "K2", "D2", "L2", "A2"], L3: ["obs", "H1", "K1", "D1", "H2", "K2", "D2", "L3", "A3"]};
const EDGES = [["obs","H1"],["obs","H2"],["H1","K1"],["K1","D1"],["H2","K2"],["K2","D2"],["D1","L1","igen"],["D1","K2","nem → H2"],["D2","L2","igen"],["D2","L3","nem"],["L1","A1"],["L2","A2"],["L3","A3"]];
function center(k){ const [x, y, w, h, , t] = N[k]; return t === "dia" ? [x, y] : [x + w / 2, y + h / 2]; }
function bottom(k){ const [x, y, w, h, , t] = N[k]; return t === "dia" ? [x, y + h / 2] : [x + w / 2, y + h]; }
function topOf(k){ const [x, y, w, h, , t] = N[k]; return t === "dia" ? [x, y - h / 2] : [x + w / 2, y]; }
function draw(){
  svg.innerHTML = "";
  const on = new Set(PATH[st]), shown = new Set(on);
  for (const [a, b, lab] of EDGES) {
    if (b.startsWith("A") && !on.has(b)) continue;
    const p0 = bottom(a), p1 = (a === "D1" && b === "K2") ? [N.K2[0], N.K2[1] + N.K2[3] / 2] : topOf(b), act = on.has(a) && on.has(b);
    el("line", {x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1], stroke: act ? css("--hl") : css("--muted"), "stroke-width": act ? 2.6 : 1, "stroke-dasharray": act ? "" : "4 3"});
    if (lab) el("text", {x: (p0[0] + p1[0]) / 2 + 6, y: (p0[1] + p1[1]) / 2, "font-size": 12, "font-weight": "bold"}, lab);
  }
  for (const k in N) {
    const [x, y, w, h, t, ty] = N[k], isOn = on.has(k);
    if (ty === "act" && !isOn) { el("rect", {x, y, width: w, height: h, fill: "none", stroke: css("--muted"), "stroke-dasharray": "3 3"});
      el("text", {x: x + w / 2, y: y + h / 2 + 4, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, "(csak bizonyított ok után)"); continue; }
    const fill = isOn ? css("--on") : css("--bg");
    if (ty === "dia") el("polygon", {points: `${x - w/2} ${y} ${x} ${y - h/2} ${x + w/2} ${y} ${x} ${y + h/2}`, fill, stroke: css("--line"), "stroke-width": k === st ? 3 : 1.2});
    else {
      el("rect", {x, y, width: w, height: h, rx: ty === "r" ? 12 : 0, fill: ty === "act" ? css("--act") : fill, stroke: css("--line"), "stroke-width": ty === "thick" ? 3 : 1.2});
      if (ty === "act") el("rect", {x, y, width: w, height: h, fill: "url(#diag)", opacity: 0.5});
      if (ty === "dbl") el("rect", {x: x + 4, y: y + 4, width: w - 8, height: h - 8, fill: "none", stroke: css("--line")});
    }
    const fs = t.length > 38 ? 10.5 : 12;
    el("text", {x: ty === "dia" ? x : x + w / 2, y: (ty === "dia" ? y : y + h / 2) + 4, "text-anchor": "middle", "font-size": fs}, t);
  }
  const leaf = LEAVES[st];
  const row = st === "D1" ? [OBS, "H1: a helyes szakasz nincs a kontextusban", "K1: gold szakasz közvetlenül a promptba – javul?", "", ""]
            : st === "D2" ? [OBS, "H2: a szakasz ott van, a modell mást választ", "K2: csak hivatkozás-kinyerés azonos kontextussal – helyes?", "", ""]
            : [OBS, leaf.hyp, leaf.ctrl, leaf.cause, leaf.act];
  row.forEach((v, i) => document.getElementById("c" + i).textContent = v || "—");
  const dec = st === "D1" || st === "D2";
  document.getElementById("q").textContent = st === "D1" ? "K1 után: javul a válasz?" : st === "D2" ? "K2 után: helyes a kinyerés?" : "Bizonyított ok megvan.";
  document.getElementById("yes").disabled = !dec; document.getElementById("no").disabled = !dec;
  document.getElementById("status").textContent = dec ? "Kontrollpróba folyamatban: a bizonyított ok és az intézkedés még üres." : `Bizonyított ok: ${leaf.cause} → intézkedés: ${leaf.act}.`;
}
document.getElementById("yes").onclick = () => { st = st === "D1" ? "L1" : "L2"; draw(); };
document.getElementById("no").onclick = () => { st = st === "D1" ? "D2" : "L3"; draw(); };
document.getElementById("reset").onclick = () => { st = "D1"; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
