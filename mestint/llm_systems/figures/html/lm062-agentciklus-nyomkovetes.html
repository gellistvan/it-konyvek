<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentciklus nyomkövetése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" onchange="setMode(this.checked ? 'nosc' : 'sc')"> önkorrekció nélkül (a mock modell mindig vesszővel hív)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Plan, Act, Observe ciklus és a history bővülése az X-123 példán: rendelés-lekérdezés, vesszős kifejezés hibaüzenettel, javított hívás, 28,9-es eredmény."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor agent_loop-jának átirata (max_steps = 6) forgatókönyv szerint válaszoló mock modellel; nem nyelvi modell kimenete. Az alapforgatókönyv a step = 3 iterációban (4. modellhívás) 28,9-cel zárul; önkorrekció nélkül hat vesszős hívás után RuntimeError.</p>

let STEPS = [{"msg": "[–] history = [system, user]: a rendszerprompt és a kérdés.", "line": 1, "ph": "start", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] 1. modellhívás → tool call: lookup_order{\"order_id\": \"X-123\"}.", "line": 3, "ph": "plan", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] execute_tool_safely → {\"status\": \"ok\", \"items\": [{\"unit_price\": 12.5, \"qty\": 2}], \"shipping_fee\": 3.9}", "line": 7, "ph": "act", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 3, "err": false}, {"msg": "[step = 0 / max_steps = 6] history.append(tool): az eredmény a historyba kerül.", "line": 9, "ph": "observe", "n": 4, "err": false}, {"msg": "[step = 1 / max_steps = 6] 2. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 4, "err": false}, {"msg": "[step = 1 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 4, "err": true}, {"msg": "[step = 1 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 5, "err": false}, {"msg": "[step = 1 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 6, "err": true}, {"msg": "[step = 2 / max_steps = 6] 3. modellhívás → tool call: calculate{\"expression\": \"12.5 * 2 + 3.9\"}.", "line": 3, "ph": "plan", "n": 6, "err": false}, {"msg": "[step = 2 / max_steps = 6] execute_tool_safely → {\"status\": \"ok\", \"result\": 28.9}", "line": 7, "ph": "act", "n": 6, "err": false}, {"msg": "[step = 2 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 7, "err": false}, {"msg": "[step = 2 / max_steps = 6] history.append(tool): az eredmény a historyba kerül.", "line": 9, "ph": "observe", "n": 8, "err": false}, {"msg": "[step = 3 / max_steps = 6] 4. modellhívás: nincs tool call, szöveges válasz: „28,9”.", "line": 3, "ph": "plan", "n": 8, "err": false}, {"msg": "[step = 3 / max_steps = 6] Leállás: return „28,9”, lépésszám step + 1 = 4.", "line": 5, "ph": "exit", "n": 8, "err": false}];
const CODE = ["def agent_loop(model, tokenizer, tools, user_goal, max_steps=6):", "    history = [{\"role\": \"system\", ...}, {\"role\": \"user\", \"content\": user_goal}]", "    for step in range(max_steps):", "        response = model.chat(history, tools=tools)", "        if not response.tool_calls:", "            return response.content, step + 1, history", "        for tool_call in response.tool_calls:", "            observation = execute_tool_safely(tool_call.name, tool_call.arguments, tools)", "            history.append({\"role\": \"assistant\", \"content\": ..., \"tool_calls\": [tool_call]})", "            history.append({\"role\": \"tool\", \"tool_call_id\": tool_call.id, \"content\": json.dumps(observation)})", "    raise RuntimeError(\"max_steps reached without final answer\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = {"sc": {"steps": [{"msg": "[–] history = [system, user]: a rendszerprompt és a kérdés.", "line": 1, "ph": "start", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] 1. modellhívás → tool call: lookup_order{\"order_id\": \"X-123\"}.", "line": 3, "ph": "plan", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] execute_tool_safely → {\"status\": \"ok\", \"items\": [{\"unit_price\": 12.5, \"qty\": 2}], \"shipping_fee\": 3.9}", "line": 7, "ph": "act", "n": 2, "err": false}, {"msg": "[step = 0 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 3, "err": false}, {"msg": "[step = 0 / max_steps = 6] history.append(tool): az eredmény a historyba kerül.", "line": 9, "ph": "observe", "n": 4, "err": false}, {"msg": "[step = 1 / max_steps = 6] 2. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 4, "err": false}, {"msg": "[step = 1 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 4, "err": true}, {"msg": "[step = 1 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 5, "err": false}, {"msg": "[step = 1 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 6, "err": true}, {"msg": "[step = 2 / max_steps = 6] 3. modellhívás → tool call: calculate{\"expression\": \"12.5 * 2 + 3.9\"}.", "line": 3, "ph": "plan", "n": 6, "err": false}, {"msg": "[step = 2 / max_steps = 6] execute_tool_safely → {\"status\": \"ok\", \"result\": 28.9}", "line": 7, "ph": "act", "n": 6, "err": false}, {"msg": "[step = 2 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 7, "err": false}, {"msg": "[step = 2 / max_steps = 6] history.append(tool): az eredmény a historyba kerül.", "line": 9, "ph": "observe", "n": 8, se}, {"msg": "[step = 1 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 4, "err": true}, {"msg": "[step = 1 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 5, "err": false}, {"msg": "[step = 1 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 6, "err": true}, {"msg": "[step = 2 / max_steps = 6] 3. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 6, "err": false}, {"msg": "[step = 2 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 6, "err": true}, {"msg": "[step = 2 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 7, "err": false}, {"msg": "[step = 2 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 8, "err": true}, {"msg": "[step = 3 / max_steps = 6] 4. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 8, "err": false}, {"msg": "[step = 3 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 8, "err": true}, {"msg": "[step = 3 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 9, "err": false}, {"msg": "[step = 3 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 10, "err": true}, {"msg": "[step = 4 / max_steps = 6] 5. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 10, "err": false}, {"msg": "[step = 4 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 10, "err": true}, {"msg": "[step = 4 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 11, "err": false}, {"msg": "[step = 4 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 12, "err": true}, {"msg": "[step = 5 / max_steps = 6] 6. modellhívás → tool call: calculate{\"expression\": \"12,5 * 2 + 3,9\"}.", "line": 3, "ph": "plan", "n": 12, "err": false}, {"msg": "[step = 5 / max_steps = 6] execute_tool_safely → {\"status\": \"error\", \"message\": \"Invalid expression: 12,5 * 2 + 3,9. Use dot as decimal separator.\"}", "line": 7, "ph": "act", "n": 12, "err": true}, {"msg": "[step = 5 / max_steps = 6] history.append(assistant + tool_calls).", "line": 8, "ph": "observe", "n": 13, "err": false}, {"msg": "[step = 5 / max_steps = 6] history.append(tool): a hibaüzenet megfigyelésként kerül a historyba.", "line": 9, "ph": "observe", "n": 14, "err": true}, {"msg": "[step = 5 / max_steps = 6] RuntimeError: max_steps reached without final answer (6 iteráció, mind vesszős hívás).", "line": 10, "ph": "max", "n": 14, "err": false}], "rows": [{"role": "system", "text": "ReAct-szabályok + eszközsémák", "err": false}, {"role": "user", "text": "„Mennyit kell fizetni az X-123 rendelésért…”", "err": false}, {"role": "assistant", "text": "lookup_order{\"order_id\": \"X-123\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"ok\",\"items\":[{\"unit_price\":12.5,\"qty\":2}],\"shipping_fee\":3.9}", "err": false}, {"role": "assistant", "text": "calculate{\"expression\": \"12,5 * 2 + 3,9\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"error\",\"message\":\"Invalid expression … Use dot as decimal separator.\"}", "err": true}, {"role": "assistant", "text": "calculate{\"expression\": \"12,5 * 2 + 3,9\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"error\",\"message\":\"Invalid expression … Use dot as decimal separator.\"}", "err": true}, {"role": "assistant", "text": "calculate{\"expression\": \"12,5 * 2 + 3,9\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"error\",\"message\":\"Invalid expression … Use dot as decimal separator.\"}", "err": true}, {"role": "assistant", "text": "calculate{\"expression\": \"12,5 * 2 + 3,9\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"error\",\"message\":\"Invalid expression … Use dot as decimal separator.\"}", "err": true}, {"role": "assistant", "text": "calculate{\"expression\": \"12,5 * 2 + 3,9\"}", "err": false}, {"role": "tool", "text": "{\"status\":\"error\",\"message\":\"Invalid expression … Use dot as decimal separator.\"}", "err": true}]}};
let MODE = "sc";
function render(s){
  const rows = SETS[MODE].rows, H = Math.max(300, 40 + rows.length * 27);
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 760 ${H}`);
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  const N = {plan: [122, 70, "Plan", "model.chat"], act: [200, 190, "Act", "execute_tool"], observe: [44, 190, "Observe", "history.append"]};
  [["plan", "act"], ["act", "observe"], ["observe", "plan"]].forEach(([a, b]) => {
    const [x0, y0] = N[a], [x1, y1] = N[b], dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    el("line", {x1: x0 + dx / L * 40, y1: y0 + dy / L * 40, x2: x1 - dx / L * 42, y2: y1 - dy / L * 42, stroke: css("--fg"), "stroke-width": 1.3, "marker-end": "url(#ah)"});
  });
  Object.entries(N).forEach(([key, [x, y, t, sub]]) => {
    const on = s.ph === key;
    el("circle", {cx: x, cy: y, r: 38, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : 1.3});
    el("text", {x, y: y - 2, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, t);
    el("text", {x, y: y + 14, "text-anchor": "middle", "font-size": 9.5, "font-family": "monospace"}, sub);
  });
  const ex = s.ph === "exit", mx = s.ph === "max";
  el("text", {x: 8, y: 270, "font-size": 12, "font-weight": ex ? "bold" : "normal", fill: ex ? css("--hl2") : css("--muted")}, "↗ nincs tool call → return");
  el("text", {x: 8, y: 290, "font-size": 12, "font-weight": mx ? "bold" : "normal", fill: mx ? css("--hl2") : css("--muted")}, "↗ max_steps → RuntimeError");
  el("text", {x: 260, y: 18, "font-size": 13, "font-weight": "bold"}, `history (${s.n} üzenet)`);
  const dash = {system: "none", user: "none", assistant: "6 3", tool: "2 3"};
  rows.slice(0, s.n).forEach((r, i) => {
    const y = 28 + i * 27, last = i === s.n - 1 && (s.ph === "observe" || s.ph === "start");
    el("rect", {x: 345, y, width: 407, height: 22, rx: 4, fill: last ? css("--cellhl") : css("--cell"), stroke: last ? css("--hl2") : css("--line"),
      "stroke-width": r.err ? 3 : (r.role === "system" ? 3 : 1.2), "stroke-dasharray": dash[r.role]});

  });
}
function setMode(v){ MODE = v; setSteps(SETS[v].steps); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
