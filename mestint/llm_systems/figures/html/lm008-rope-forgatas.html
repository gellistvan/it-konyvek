<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoPE-forgatás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--line:#000;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--line:#ddd;--grid:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
input[type=range]{min-width:160px;flex:1}
select,button{font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Pozíciók">
  <label for="m">m</label><input id="m" type="range" min="0" max="50" value="5" aria-label="A query pozíciója, m"><b id="mv"></b>
  <label for="n">n</label><input id="n" type="range" min="0" max="50" value="3" aria-label="A key pozíciója, n"><b id="nv"></b>
</div>
<div class="ctl">
  <label><input id="lock" type="checkbox"> Δ = n − m rögzítése (a két csúszka együtt mozog)</label>
  <label>base <select id="base"><option value="10000" selected>10 000</option><option value="500000">500 000</option></select></label>
  <button id="ex">Példák: (2,0) → (5,3) → (9,7)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 350" role="img" aria-label="Egységkör a forgatott q_m és k_n vektorral, alatta négy különböző sebességgel forgó sík"></svg>
<p class="small">Egyetlen 2D sík, Θ = 1 rad, q = (1; 0), k = (0,6; 0,8). A belső szorzat q_mᵀk_n = qᵀR<sub>(n−m)Θ</sub>k, ezért csak
n − m-től függ (pl. (5, 3) → 0,478). Jobb oldal: d = 8, Θ<sub>i</sub> = base<sup>−2i/8</sup>; az óramutató az m pozíció elforgatása síkonként.</p>
<script>
const D0 = {"q": [1.0, 0.0], "k": [0.6, 0.8]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
const g = id => document.getElementById(id);
let delta = -2, lastM = 5;
function rot(v, a){ return [Math.cos(a) * v[0] - Math.sin(a) * v[1], Math.sin(a) * v[0] + Math.cos(a) * v[1]]; }
function arrow(cx, cy, r, v, dash, w, lab){
  const x = cx + r * v[0], y = cy - r * v[1], a = Math.atan2(-(y - cy), x - cx);
  el("line", {x1: cx, y1: cy, x2: x, y2: y, stroke: css("--fg"), "stroke-width": w, "stroke-dasharray": dash});
  const hx = x - 12 * Math.cos(a), hy = y + 12 * Math.sin(a);
  el("path", {d: `M${x},${y}L${hx + 5 * Math.sin(a)},${hy + 5 * Math.cos(a)}L${hx - 5 * Math.sin(a)},${hy - 5 * Math.cos(a)}Z`, fill: css("--fg")});
  el("text", {x: cx + (r + 16) * v[0], y: cy - (r + 16) * v[1] + 5, "font-size": 14, "text-anchor": "middle"}, lab);
}
function arc(cx, cy, r, a0, a1){
  let d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const x0 = cx + r * Math.cos(a0), y0 = cy - r * Math.sin(a0), x1 = cx + r * Math.cos(a0 + d), y1 = cy - r * Math.sin(a0 + d);
  el("path", {d: `M${x0},${y0}A${r},${r} 0 0 ${d > 0 ? 0 : 1} ${x1},${y1}`, fill: "none", stroke: css("--hl"), "stroke-width": 2});
}
function draw(){
  let m = +g("m").value, n = +g("n").value;
  if (g("lock").checked) { n = m + delta; if (n < 0 || n > 50) { n = Math.max(0, Math.min(50, n)); m = n - delta; g("m").value = m; } g("n").value = n; }
  else delta = n - m;
  g("mv").textContent = m; g("nv").textContent = n;
  svg.innerHTML = "";
  const cx = 160, cy = 165, r = 120;
  el("circle", {cx, cy, r, fill: "none", stroke: css("--grid"), "stroke-width": 1.2});
  el("line", {x1: cx - r - 10, y1: cy, x2: cx + r + 10, y2: cy, stroke: css("--grid")}); el("line", {x1: cx, y1: cy - r - 10, x2: cx, y2: cy + r + 10, stroke: css("--grid")});
  const qm = rot(D0.q, m), kn = rot(D0.k, n);
  arc(cx, cy, 45, Math.atan2(qm[1], qm[0]), Math.atan2(kn[1], kn[0]));
  arrow(cx, cy, r, qm, "", 3, "q_m"); arrow(cx, cy, r, kn, "8 5", 2.4, "k_n");
  const dp = qm[0] * kn[0] + qm[1] * kn[1];
  el("text", {x: cx, y: 318, "font-size": 15, "text-anchor": "middle", "font-weight": "bold"}, `q_mᵀk_n = ${fmt(dp, 5)}`);
  const base = +g("base").value;
  el("text", {x: 330, y: 22, "font-size": 13, "font-weight": "bold"}, `d = 8 síkjai az m = ${m} pozícióban (base ${base === 10000 ? "10 000" : "500 000"})`);
  for (let i = 0; i < 4; i++) {
    const th = Math.pow(base, -2 * i / 8), a = m * th, ox = 330 + (i % 2) * 170 + 70, oy = 100 + Math.floor(i / 2) * 150, rr = 48;
    el("circle", {cx: ox, cy: oy, r: rr, fill: "none", stroke: css("--grid"), "stroke-width": 1.2});
    el("line", {x1: ox, y1: oy, x2: ox + rr, y2: oy, stroke: css("--grid"), "stroke-dasharray": "2 3"});
    arrow(ox, oy, rr, [Math.cos(a), Math.sin(a)], "", 2.2, "");
    el("text", {x: ox, y: oy + rr + 18, "font-size": 12, "text-anchor": "middle"}, `Θ${i} = ${th >= 0.01 ? fmt(th, th >= 1 ? 0 : (th >= 0.1 ? 1 : 2)) : th.toExponential(1).replace(".", ",")}`);
    el("text", {x: ox, y: oy + rr + 33, "font-size": 12, "text-anchor": "middle", fill: css("--muted")}, `szög: ${fmt(a, a >= 10 ? 1 : 3)} rad`);
  }
  g("status").textContent = `m = ${m}, n = ${n}, n − m = ${String(n - m).replace("-", "−")}: q_mᵀk_n = ${fmt(dp, 3)}` + (g("lock").checked ? " (Δ rögzítve: az érték m-től független)" : "");
}
["m", "n", "base"].forEach(id => g(id).addEventListener("input", draw));
g("lock").addEventListener("change", () => { delta = +g("n").value - +g("m").value; draw(); });
let ex = 0;
g("ex").onclick = () => { const P = [[2, 0], [5, 3], [9, 7]][ex % 3]; ex++; g("m").value = P[0]; g("n").value = P[1]; delta = P[1] - P[0]; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
