<html lang="hu">
<head>

<title>Tokenhatékonyság (játék-BPE)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd;--cell:#fff;--cellhl:#d9d9d9}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
textarea{width:100%;font:inherit;padding:4px;background:var(--bg);color:var(--fg)}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:6px 0;min-height:1.5em;font-weight:bold}
.row{margin:8px 0}
.row .nm{font-size:13px;margin-bottom:2px}
.tk{display:inline-block;border:1px solid var(--line);padding:1px 2px;margin:0 0 3px 0;font:13px ui-monospace,monospace;white-space:pre}
.tk.o{background:var(--cellhl)}
.small{font-size:12px;color:var(--muted)}
</style>

<body>
<label for="in">Saját szöveg (a játék-BPE-k élőben tokenizálják):</label>
<textarea id="in" rows="2">A felmondási idő harminc nap, amelyet írásban kell közölni.</textarea>
<div><button id="rs">Példamondat</button></div>
<div id="status" aria-live="polite"></div>

], ["el", "l"], ["i", "t"], ["n", "i"], ["ál", "l"], ["▁", "d"], ["▁", "h"], ["▁", "o"], ["▁", "sz"], ["▁a", "nd"], ["▁k", "ö"], ["al", "ó"], ["e", "k"], ["en", "t"], ["i", "n"], ["i", "on"], ["r", "t"], ["tat", "ó"], ["ál", "tató"], ["áll", "aló"], ["▁", "s"], ["▁employ", "e"], ["▁k", "ell"], ["▁munk", "áltató"], ["▁munkav", "állaló"], ["a", "n"], ["a", "p"], ["at", "ion"], ["on", "d"], ["á", "r"], ["é", "r"], ["▁", "l"], ["▁", "n"], ["▁", "és"], ["▁employe", "e"], ["▁f", "el"], ["▁i", "n"], ["▁m", "ay"], ["▁m", "u"], ["▁o", "f"], ["▁t", "o"], ["a", "b"], ["e", "."], ["h", "i"], ["he", "ti"], ["i", "z"], ["o", "k"], ["o", "z"], ["or", "k"], ["r", "a"], ["s", "t"], ["t", "."], ["▁b", "e"], ["▁c", "o"], ["▁employ", "er"], ["▁h", "a"], ["▁kö", "z"], ["▁mu", "st"], ["▁w", "ork"], ["a", "r"], ["al", "l"], ["b", "an"], ["b", "en"], ["d", "és"], ["d", "ő"], ["e", ","], ["em", "ent"], ["en", "d"], ["er", "z"], ["erz", "ő"], ["erző", "dés"], ["g", "re"], ["i", "k"], ["i", "m"], ["i", "s"], ["i", "sz"], ["i", "ti"], ["in", "g"], ["isz", "on"], ["iszon", "y"], ["it", "h"], ["iz", "et"], ["m", "ond"], ["mond", "ás"], ["ni", "."], ["o", "d"], ["t", "el"], ["t", "l"], ["u", "l"], ["u", "t"], ["é", "k"], ["é", "v"], ["í", "r"], ["ö", "t"], ["▁", "g"], ["▁", "un"], ["▁a", "d"], ["▁a", "gre"], ["▁a", "n"], ["▁fel", "mondás"], ["▁i", "s"], ["▁munkav", "iszony"], ["▁p", "er"], ["▁r", "end"], ["▁sz", "ab"], ["▁w", "a"], ["▁w", "ith"], ["a", "d"], ["a", "v"], ["a", "w"], ["ap", "t"], ["ar", "ti"], ["arti", "es"], ["at", "a"], ["at", "e"], ["at", "ok"], ["ation", "s"], ["ay", "s"], ["b", "o"], ["bo", "ut"], ["c", "e"], ["c", "t"], ["dő", "t"], ["e", "av"], ["e", "en"], ["el", "t"], ["er", "m"], ["erm", "in"], ["es", "s"], ["es", "t"], ["ez", "et"], ["ez", "és"], ["h", "all"], ["h", "at"], ["he", "r"], ["i", "c"], ["i", "d"], ["i", "g"], ["i", "nd"], ["i", "od"], ["iti", "on"], ["j", "a"], ["l", "e"], ["l", "y"], ["m", "ent"], ["n", "t"], ["ni", ","], ["nt", "et"], ["o", "s"], ["o", "t"] const SENT = "A felmondási idő harminc nap, amelyet írásban kell közölni.";
T.forEach(t => { t.rank = new Map(t.merges.map((p, i) => [p[0] + "\u0000" + p[1], i])); });
function encWord(w, rank){
  let s = Array.from(w);
  while (s.length > 1) {
    let best = Infinity, bi = -1;
    for (let i = 0; i < s.length - 1; i++) { const r = rank.get(s[i] + "\u0000" + s[i + 1]); if (r !== undefined && r < best) { best = r; bi = i; } }
    if (bi < 0) break;
    const a = s[bi], b = s[bi + 1], o = [];
    for (let i = 0; i < s.length; ) { if (i + 1 < s.length && s[i] === a && s[i + 1] === b) { o.push(a + b); i += 2; } else { o.push(s[i]); i++; } }
    s = o;
  }
  return s;
}
function enc(text, t){ return text.split(/\s+/).filter(Boolean).flatMap(w => encWord("▁" + w, t.rank)); }
function run(){
  const txt = document.getElementById("in").value, nw = txt.split(/\s+/).filter(Boolean).length;
  const out = document.getElementById("out"); out.innerHTML = "";
  const counts = T.map(t => { const seg = enc(txt, t);
    const row = document.createElement("div"); row.className = "row";
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = `${t.name}: ${seg.length} token` + (nw ? `, ${(seg.length / nw).toFixed(2).replace(".", ",")} token/szó` : "");
    row.appendChild(nm);
    seg.forEach((s, k) => { const sp = document.createElement("span"); sp.className = "tk" + (k % 2 ? " o" : ""); sp.textContent = s.replace("▁", "␣"); row.appendChild(sp); });
    out.appendChild(row); return seg.length; });
  document.getElementById("status").textContent = `${nw} szó → ${counts.join(" / ")} token (a / b / c).`;
}
document.getElementById("in").addEventListener("input", run);
document.getElementById("rs").onclick = () => { document.getElementById("in").value = SENT; run(); };
run();
