<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forrásbefogadási döntés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd;--cell:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444;--cell:#262626}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:5px;align-items:center}
button,select{font:inherit;padding:3px 8px;cursor:pointer}
#own{display:none}
#status{margin:4px 0 6px;min-height:2.9em}
.wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
svg{flex:3 1 380px;width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:12.5px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
th{background:var(--code)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Forrás kiválasztása">
  <label>Forrás <select id="src" aria-label="Forrás"><option>src_001</option><option>src_002</option><option>src_003</option><option value="own">saját forrás…</option></select></label>
  <button id="step">Lépés ▶</button><button id="all">Teljes út</button><button id="rst">⏮ Elölről</button>
</div>
<div class="ctl" id="own" role="group" aria-label="Saját forrás mezői">
  <label>licenc ismert <select id="o_lk"><option value="1">igen</option><option value="0">nem</option></select></label>
  <label>model_training <select id="o_mt"><option>allowed</option><option>restricted</option><option>unknown</option></select></label>
  <label>commercial_use <select id="o_cu"><option>allowed</option><option>restricted</option><option>not_allowed</option></select></label>
  <label>pii_risk <select id="o_pii"><option>none</option><option>low</option><option>medium</option><option>high</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 490 580" role="img" aria-label="Folyamatábra: licenc ismert, gépi tanítás engedett, kereskedelmi cél, PII-kockázat döntések; a kiválasztott forrás útja kiemelve."></svg>
<table aria-label="A licencmátrix sora"><thead><tr><th colspan="2">Licencmátrix sora</th></tr></thead><tbody id="tb"><tr><td colspan="2" class="small">az út végén jelenik meg</td></tr></tbody></table>
</div>
<p class="small">Didaktikus példa, nem jogi tanács. A labor három forrásának végállapota a kód <code>decision</code> mezőjével egyezik; az <code>unknown</code> tanítási státusz nem vezet <code>accept</code>-hez.</p>
<script>
const D = {"nodes": {"src": {"t": "s", "txt": "Adatforrás\n(source_id, licenc, PII-besorolás)", "x": 3.0, "y": 11.0}, "d1": {"t": "q", "txt": "Licenc\nismert?", "x": 3.0, "y": 9.5}, "d2": {"t": "q", "txt": "Gépi tanítás\nengedett?\n(model_training)", "x": 3.0, "y": 7.6}, "d3": {"t": "q", "txt": "Kereskedelmi\ncél engedett?", "x": 3.0, "y": 5.7}, "d4": {"t": "q", "txt": "PII-\nkockázat?", "x": 3.0, "y": 3.8}, "l_review1": {"t": "l", "txt": "review\n(licenc tisztázása)", "x": 7.4, "y": 9.5}, "l_reject1": {"t": "l", "txt": "reject\n(restricted / unknown)", "x": 7.4, "y": 7.6}, "l_reject2": {"t": "l", "txt": "reject\n(not_allowed)", "x": 7.4, "y": 5.7}, "l_accept": {"t": "l", "txt": "accept", "x": 0.3, "y": 1.6}, "l_pseudo": {"t": "l", "txt": "accept_\npseudonymized", "x": 3.0, "y": 1.6}, "l_review2": {"t": "l", "txt": "review\n(vagy reject)", "x": 5.8, "y": 1.6}}, "edges": [["src", "d1", ""], ["d1", "l_review1", "nem"], ["d1", "d2", "igen"], ["d2", "l_reject1", "restricted /\nunknown"], ["d2", "d3", "allowed"], ["d3", "l_reject2", "not_allowed"], ["d3", "d4", "allowed / restricted\n(csak a licenc szerinti célra)"], ["d4", "l_accept", "none / low"], ["d4", "l_pseudo", "medium"], ["d4", "l_review2", "high"]], "sources": {"src_001": {"license": "CC BY 4.0", "license_known": true, "model_training": "allowed", "commercial_use": "allowed", "modification": "allowed", "attribution_required": true, "share_alike": false, "pii_risk": "medium", "decision": "accept_pseudonymized"}, "src_002": {"license": "internal-use", "license_known": true, "model_training": "allowed", "commercial_use": "restricted", "modification": "allowed", "attribution_required": false, "share_alike": false, "pii_risk": "low", "decision": "accept"}, "src_003": {"license": "proprietary", "license_known": true, "model_training": "unknown", "commercial_use": "restricted", "modification": "restricted", "attribution_required": true, "share_alike": false, "pii_risk": "high", "decision": "reject"}}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const SX = x => 25 + (x + 0.5) * 49, SY = y => 20 + (11.6 - y) * 52;
function decide(s){
  const p = ["src", "d1"];
  if (!s.license_known) return [p.concat("l_review1"), "review"];
  p.push("d2"); if (s.model_training !== "allowed") return [p.concat("l_reject1"), "reject"];
  p.push("d3"); if (s.commercial_use === "not_allowed") return [p.concat("l_reject2"), "reject"];
  p.push("d4"); const m = {none: ["l_accept", "accept"], low: ["l_accept", "accept"], medium: ["l_pseudo", "accept_pseudonymized"], high: ["l_review2", "review"]}[s.pii_risk];
  return [p.concat(m[0]), m[1]];
}
const WHY = {d1: s => s.license_known ? "igen" : "nem", d2: s => s.model_training, d3: s => s.commercial_use, d4: s => s.pii_risk};
const QN = {d1: "licenc ismert?", d2: "gépi tanítás engedett?", d3: "kereskedelmi cél?", d4: "PII-kockázat?"};
let k = 1;
function cur(){
  const v = document.getElementById("src").value;
  document.getElementById("own").style.display = v === "own" ? "flex" : "none";
  if (v !== "own") return Object.assign({source_id: v}, D.sources[v]);
  return {source_id: "saját", license: "(saját)", license_known: document.getElementById("o_lk").value === "1",
          model_training: document.getElementById("o_mt").value, commercial_use: document.getElementById("o_cu").value,
          modification: "–", attribution_required: "–", share_alike: "–", pii_risk: document.getElementById("o_pii").value};
}
function draw(){
  const s = cur(), [path, dec] = decide(s), on = path.slice(0, k + 1);
  svg.innerHTML = "";
  D.edges.forEach(([a, b, lab]) => { const A = D.nodes[a], B = D.nodes[b];
    const act = on.includes(a) && on.includes(b);
    el("line", {x1: SX(A.x), y1: SY(A.y), x2: SX(B.x), y2: SY(B.y), stroke: act ? css("--hl2") : css("--muted"), "stroke-width": act ? 5 : 1.2});
    if (lab) el("text", {x: (SX(A.x) + SX(B.x)) / 2 + (A.y === B.y ? 0 : A.x === B.x ? 4 : (B.x < A.x ? -40 : 8)), y: (SY(A.y) + SY(B.y)) / 2 - 5, "font-size": 9.5, fill: css("--muted"), "text-anchor": A.y === B.y ? "middle" : "start"}, lab.replace("\n", " ")); });
  Object.entries(D.nodes).forEach(([n, N]) => { const x = SX(N.x), y = SY(N.y), act = on.includes(n), last = act && n === on[on.length - 1];
    const sw = last ? 4 : act ? 2.5 : 1;
    if (N.t === "q") el("path", {d: `M${x-62},${y}L${x},${y-30}L${x+62},${y}L${x},${y+30}Z`, fill: css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": sw});
    else el("rect", {x: x - (N.t === "s" ? 62 : 56), y: y - 21, width: N.t === "s" ? 124 : 112, height: 42, rx: 6, fill: css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": N.t === "l" && N.txt.startsWith("accept") ? Math.max(sw, 3) : sw, "stroke-dasharray": N.txt.startsWith("review") ? "6 3" : ""});
    const lines = N.t === "s" ? ["Adatforrás", s.source_id] : N.txt.split("\n").slice(0, 3);
    lines.forEach((t, i) => el("text", {x: x, y: y + 4 + (i - (lines.length - 1) / 2) * 12, "text-anchor": "middle", "font-size": i === 0 && N.t === "l" ? 12 : 10, "font-weight": i === 0 && N.t === "l" ? "bold" : "normal"}, t)); });
  const done = k >= path.length - 1, node = on[on.length - 1];
  let msg = `${s.source_id}: `;
  if (node === "src") msg += "kiindulás.";
  else if (QN[node]) msg += `${QN[node]} → következő lépés.`;
  else msg += `${QN[on[on.length - 2]]} ${WHY[on[on.length - 2]](s)} → végállapot: ${dec}.`;
  if (on.length > 2) msg = `${s.source_id}: ` + on.slice(1).filter(n => QN[n]).map(n => `${QN[n]} ${WHY[n](s)}`).join(" · ") + (done ? ` → ${dec}` : " …");
  document.getElementById("status").textContent = msg;
  document.getElementById("tb").innerHTML = done ? ["source_id", "license", "commercial_use", "modification", "attribution_required", "share_alike", "model_training", "pii_risk"].map(f =>
    `<tr><td>${f}</td><td>${String(s[f])}</td></tr>`).join("") + `<tr><th>decision</th><th>${dec}</th></tr>` : `<tr><td colspan="2" class="small">az út végén jelenik meg</td></tr>`;
}
document.getElementById("step").onclick = () => { k++; const p = decide(cur())[0]; if (k > p.length - 1) k = p.length - 1; draw(); };
document.getElementById("all").onclick = () => { k = 99; const p = decide(cur())[0]; k = p.length - 1; draw(); };
document.getElementById("rst").onclick = () => { k = 1; draw(); };
["src", "o_lk", "o_mt", "o_cu", "o_pii"].forEach(id => document.getElementById(id).addEventListener("change", () => { k = 99; k = decide(cur())[0].length - 1; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
k = decide(cur())[0].length - 1;
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
