<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPE-egyesítések lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><details><summary>Saját korpusz és célszókészlet</summary><label>Korpusz (soronként „szó ×gyakoriság”):<br><textarea id="corp" rows="4" cols="22" aria-label="Saját korpusz">kert ×5
kertben ×4
kertek ×3
kertekben ×2</textarea></label> <label>célszókészlet-méret: <input id="tgt" type="range" min="7" max="27" value="13" aria-label="Célszókészlet-méret" oninput="document.getElementById('tgtv').textContent=this.value"> <b id="tgtv">13</b></label> <button onclick="loadBpe()">Betöltés</button> <span id="err" class="small" aria-live="polite"></span></details></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat egyesítési lépés: k+e, ke+r, ker+t, b+e, be+n, ben+szóvég; a végén a kertben szó két tokenre, kert és ben, bomlik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Játék-BPE a 3.1.3 lépéslistája szerint (nem valódi tokenizer). Kiinduló korpusz: kert ×5, kertben ×4, kertek ×3, kertekben ×2; célszókészlet 13 = 7 kezdő szimbólum + 6 egyesítés. Holtversenynél az elsőként előforduló pár nyer.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 1, "words": [["k", "e", "r", "t", "</w>"], ["k", "e", "r", "t", "b", "e", "n", "</w>"], ["k", "e", "r", "t", "e", "k", "</w>"], ["k", "e", "r", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [], "win": null, "newtok": null, "vocab": 7, "msg": "0. lépés: karakterekre bontott korpusz szóvég-jellel; kezdő szókészlet 7 szimbólum"}, {"line": 2, "words": [["k", "e", "r", "t", "</w>"], ["k", "e", "r", "t", "b", "e", "n", "</w>"], ["k", "e", "r", "t", "e", "k", "</w>"], ["k", "e", "r", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [[["k", "e"], 14], [["e", "r"], 14], [["r", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5]], "win": ["k", "e"], "newtok": null, "vocab": 7, "msg": "1. egyesítés – 3. lépés: a leggyakoribb pár (k, e) = 14"}, {"line": 3, "words": [["ke", "r", "t", "</w>"], ["ke", "r", "t", "b", "e", "n", "</w>"], ["ke", "r", "t", "e", "k", "</w>"], ["ke", "r", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [[["k", "e"], 14], [["e", "r"], 14], [["r", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5]], "win": ["k", "e"], "newtok": "ke", "vocab": 8, "msg": "1. egyesítés – 4. lépés: minden (k, e) → ke; szókészlet 8"}, {"line": 2, "words": [["ke", "r", "t", "</w>"], ["ke", "r", "t", "b", "e", "n", "</w>"], ["ke", "r", "t", "e", "k", "</w>"], ["ke", "r", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [[["ke", "r"], 14], [["r", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5], [["e", "k"], 5]], "win": ["ke", "r"], "newtok": null, "vocab": 8, "msg": "2. egyesítés – 3. lépés: a leggyakoribb pár (ke, r) = 14"}, {"line": 3, "words": [["ker", "t", "</w>"], ["ker", "t", "b", "e", "n", "</w>"], ["ker", "t", "e", "k", "</w>"], ["ker", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [[["ke", "r"], 14], [["r", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5], [["e", "k"], 5]], "win": ["ke", "r"], "newtok": "ker", "vocab": 9, "msg": "2. egyesítés – 4. lépés: minden (ke, r) → ker; szókészlet 9"}, {"line": 2, "words": [["ker", "t", "</w>"], ["ker", "t", "b", "e", "n", "</w>"], ["ker", "t", "e", "k", "</w>"], ["ker", "t", "e", "k", "b", "e", "n", "</w>"]], "top": [[["ker", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5], [["e", "k"], 5], [["t", "b"], 4]], "win": ["ker", "t"], "newtok": null, "vocab": 9, "msg": "3. egyesítés – 3. lépés: a leggyakoribb pár (ker, t) = 14"}, {"line": 3, "words": [["kert", "</w>"], ["kert", "b", "e", "n", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "b", "e", "n", "</w>"]], "top": [[["ker", "t"], 14], [["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["t", "</w>"], 5], [["t", "e"], 5], [["e", "k"], 5], [["t", "b"], 4]], "win": ["ker", "t"], "newtok": "kert", "vocab": 10, "msg": "3. egyesítés – 4. lépés: minden (ker, t) → kert; szókészlet 10"}, {"line": 2, "words": [["kert", "</w>"], ["kert", "b", "e", "n", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "b", "e", "n", "</w>"]], "top": [[["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "b"], 4], [["k", "</w>"], 3]], "win": ["b", "e"], "newtok": null, "vocab": 10, "msg": "4. egyesítés – 3. lépés: a leggyakoribb pár (b, e) = 6"}, {"line": 3, "words": [["kert", "</w>"], ["kert", "be", "n", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "be", "n", "</w>"]], "top": [[["b", "e"], 6], [["e", "n"], 6], [["n", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "b"], 4], [["k", "</w>"], 3]], "win": ["b", "e"], "newtok": "be", "vocab": 11, "msg": "4. egyesítés – 4. lépés: minden (b, e) → be; szókészlet 11"}, {"line": 2, "words": [["kert", "</w>"], ["kert", "be", "n", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "be", "n", "</w>"]], "top": [[["be", "n"], 6], [["n", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "be"], 4], [["k", "</w>"], 3], [["k", "be"], 2]], "win": ["be", "n"], "newtok": null, "vocab": 11, "msg": "5. egyesítés – 3. lépés: a leggyakoribb pár (be, n) = 6"}, {"line": 3, "words": [["kert", "</w>"], ["kert", "ben", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "ben", "</w>"]], "top": [[["be", "n"], 6], [["n", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "be"], 4], [["k", "</w>"], 3], [["k", "be"], 2]], "win": ["be", "n"], "newtok": "ben", "vocab": 12, "msg": "5. egyesítés – 4. lépés: minden (be, n) → ben; szókészlet 12"}, {"line": 2, "words": [["kert", "</w>"], ["kert", "ben", "</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "ben", "</w>"]], "top": [[["ben", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "ben"], 4], [["k", "</w>"], 3], [["k", "ben"], 2]], "win": ["ben", "</w>"], "newtok": null, "vocab": 12, "msg": "6. egyesítés – 3. lépés: a leggyakoribb pár (ben, </w>) = 6"}, {"line": 3, "words": [["kert", "</w>"], ["kert", "ben</w>"], ["kert", "e", "k", "</w>"], ["kert", "e", "k", "ben</w>"]], "top": [[["ben", "</w>"], 6], [["kert", "</w>"], 5], [["kert", "e"], 5], [["e", "k"], 5], [["kert", "ben"], 4], [["k", "</w>"], 3], [["k", "ben"], 2]], "win": ["ben", "</w>"], "newtok": "ben</w>", "vocab": 13, "msg": "6. egyesítés – 4. lépés: minden (ben, </w>) → ben</w>; szókészlet 13"}];
const CODE = ["1. Kezdő szókészlet: a korpusz összes karaktere + speciális tokenek (itt: </w>).", "2. A korpusz szavait karakterekre bontja (szóvég-jellel).", "3. Megkeresi a leggyakoribb szomszédos párt, és új tokenként felveszi.", "4. A korpuszban minden ilyen párt az új tokenre cserél.", "5. Ismétli a 3–4. lépést, amíg el nem éri a cél szókészletméretet."];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EOW = "</w>";
function bpeSteps(corpus, nm){
  let words = corpus.map(([w]) => [...w, EOW]);
  const chars = []; corpus.forEach(([w]) => [...w].forEach(c => { if (!chars.includes(c)) chars.push(c); }));
  const v0 = chars.length + 1;
  const st = [{line: 1, words, top: [], win: null, newtok: null, vocab: v0, msg: `0. lépés: karakterekre bontott korpusz szóvég-jellel; kezdő szókészlet ${v0} szimbólum`}];
  for (let i = 0; i < nm; i++) {
    const cnt = new Map();
    words.forEach((s, wi) => { for (let j = 0; j + 1 < s.length; j++) { const key = s[j] + "\u0000" + s[j + 1]; cnt.set(key, (cnt.get(key) || 0) + corpus[wi][1]); } });
    if (!cnt.size) break;
    let best = -1, win = null; cnt.forEach((c, key) => { if (c > best) { best = c; win = key; } });
    const top = [...cnt.entries()].map((e, idx) => [e, idx]).sort((a, b) => b[0][1] - a[0][1] || a[1] - b[1]).slice(0, 8).map(([e]) => [e[0].split("\u0000"), e[1]]);
    const W = win.split("\u0000"), tok = W[0] + W[1];
    st.push({line: 2, words, top, win: W, newtok: null, vocab: v0 + i, msg: `${i + 1}. egyesítés – 3. lépés: a leggyakoribb pár (${W[0]}, ${W[1]}) = ${best}`});
    words = words.map(s => { const o = []; for (let j = 0; j < s.length; j++) { if (j + 1 < s.length && s[j] === W[0] && s[j + 1] === W[1]) { o.push(tok); j++; } else o.push(s[j]); } return o; });
    st.push({line: 3, words, top, win: W, newtok: tok, vocab: v0 + i + 1, msg: `${i + 1}. egyesítés – 4. lépés: minden (${W[0]}, ${W[1]}) → ${tok}; szókészlet ${v0 + i + 1}`});
  }
  return st;
}
let CORP = [["kert", 5], ["kertben", 4], ["kertek", 3], ["kertekben", 2]];
function tw(t){ return 9 * Math.max(t.length, 1) + 12; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 292");
  svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl");
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "Párszámláló (súlyozott)");
  (s.top || []).forEach(([p, c], i) => {
    const y = 28 + i * 26, win = s.win && p[0] === s.win[0] && p[1] === s.win[1];
    el("rect", {x: 10, y: y, width: 190, height: 22, fill: win ? css("--cellhl") : cell, stroke: win ? hl : line, "stroke-width": win ? 3 : 1});
    el("text", {x: 18, y: y + 16, "font-size": 13, "font-family": "ui-monospace,monospace", "font-weight": win ? "bold" : "normal"}, `(${p[0]}, ${p[1]})`);
    el("text", {x: 192, y: y + 16, "font-size": 13, "text-anchor": "end", "font-weight": win ? "bold" : "normal"}, String(c));
  });
  if (!(s.top || []).length) el("text", {x: 10, y: 44, "font-size": 12, fill: css("--muted")}, "(még nincs számlálás)");
  el("text", {x: 300, y: 18, "font-size": 13, "font-weight": "bold"}, `Korpusz bontása (szókészlet: ${s.vocab})`);
  s.words.forEach((sym, wi) => {
    const y = 30 + wi * 40; let x = 300;
    el("text", {x: 292, y: y + 19, "font-size": 12.5, "text-anchor": "end"}, CORP[wi][0] + " ×" + CORP[wi][1]);
    for (let j = 0; j < sym.length; j++) {
      const t = sym[j], nt = s.newtok && t === s.newtok;
      const pr = s.win && !s.newtok && j + 1 < sym.length && sym[j] === s.win[0] && sym[j + 1] === s.win[1];
      if (pr) { const w2 = tw(sym[j]) + tw(sym[j + 1]); el("rect", {x: x - 2, y: y - 2, width: w2 + 4, height: 32, fill: "none", stroke: hl, "stroke-width": 3, "stroke-dasharray": "5 3"}); }
      el("rect", {x: x, y: y, width: tw(t), height: 28, fill: nt ? css("--cellhl") : cell, stroke: nt ? hl : line, "stroke-width": nt ? 3 : 1});
      el("text", {x: x + tw(t) / 2, y: y + 19, "font-size": 13, "text-anchor": "middle", "font-family": "ui-monospace,monospace", "font-weight": nt ? "bold" : "normal"}, t);
      x += tw(t);
      if (x > 630) break;
    }
  });
  el("text", {x: 10, y: 286, "font-size": 11.5, fill: css("--muted")}, "szaggatott keret = az összevonandó pár; szürke cella = az új token; holtversenynél az elsőként előforduló pár nyer");
}
function parseCorpus(){
  const err = document.getElementById("err"), out = [];
  for (const raw of document.getElementById("corp").value.split("\n")) {
    const l = raw.trim(); if (!l) continue;
    const m = l.match(/^(\S+)\s*[×x*]\s*(\d+)$/);
    if (!m || +m[2] < 1) { err.textContent = "Hibás sor: „" + l + "” (alak: szó ×gyakoriság)"; return null; }
    out.push([m[1], +m[2]]);
  }
  if (!out.length || out.length > 6) { err.textContent = "1–6 sort adjon meg."; return null; }
  err.textContent = ""; return out;
}
function v0of(c){ const s = new Set(); c.forEach(([w]) => [...w].forEach(ch => s.add(ch))); return s.size + 1; }
function syncSlider(c){ const t = document.getElementById("tgt"), v0 = v0of(c); t.min = v0; t.max = v0 + 20; if (+t.value < v0) t.value = v0; document.getElementById("tgtv").textContent = t.value; }
function loadBpe(){
  const c = parseCorpus(); if (!c) return;
  syncSlider(c);
  const nm = +document.getElementById("tgt").value - v0of(c);
  CORP = c; setSteps(bpeSteps(c, nm));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
