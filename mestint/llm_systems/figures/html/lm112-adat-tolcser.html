<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatelőkészítés a mini fixture-ön</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="radiogroup" aria-label="Split módja"><label><input type="radio" name="split" value="group" checked> ügyalapú split</label> <label><input type="radio" name="split" value="random"> véletlen soronkénti split</label></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat dokumentumkártya; lépésenként a nyelvi szűrő, a hosszszűrő, a pontos duplikátum és a PII-lépés, végül a split"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fixture és a szűrők a 29.4.2 futtatható blokkjából; az U1–U4 ügyazonosítók szemléltetők (a fixture-ben ma nincs ügymező, T-L12-026). Split: random.Random(42), egy teszt-ügy, illetve egy tesztsor.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. lépés – nyers fixture: megmarad 6 dokumentum.", "line": 0, "alive": ["d01", "d02", "d03", "d04", "d05", "d06"], "drop": [], "stage": 0}, {"msg": "1. lépés – nyelv = hu: kiesik d05 (lang = en); megmarad 5 dokumentum.", "line": 1, "alive": ["d01", "d02", "d03", "d04", "d05", "d06"], "drop": ["d05"], "stage": 1}, {"msg": "2. lépés – ≥ 5 szó: kiesik d06 (1 szó); megmarad 4 dokumentum.", "line": 2, "alive": ["d01", "d02", "d03", "d04", "d06"], "drop": ["d06"], "stage": 2}, {"msg": "3. lépés – SHA-256 pontos duplikátum: kiesik d04 (= d01 (e9736e6d…)); megmarad 3 dokumentum.", "line": 3, "alive": ["d01", "d02", "d03", "d04"], "drop": ["d04"], "stage": 3}, {"msg": "4. lépés – PII → helyőrző: nincs találat; megmarad 3 dokumentum.", "line": 4, "alive": ["d01", "d02", "d03"], "drop": [], "stage": 4}, {"msg": "5. lépés – split: ", "line": 5, "alive": ["d01", "d02", "d03"], "drop": [], "stage": 5}];
const CODE = ["fixture = [d01 … d06]                      # 6 dokumentum", "is_valid: example[\"lang\"] == \"hu\"         # nyelvi szűrő", "is_valid: len(example[\"text\"].split()) >= 5   # hosszszűrő", "dedup_key = sha256(text); első előfordulás marad", "PII → helyőrző (<SZEMELY_NEV>, <CIM>, <UGYSZAM>)", "split: ügyalapú (ugyek[:1] → teszt) vagy véletlen soronkénti"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CARDS = {"d01": {"lang": "hu", "words": 13, "ugy": "U1", "sha": "e9736e6d"}, "d02": {"lang": "hu", "words": 16, "ugy": "U2", "sha": "563714ca"}, "d03": {"lang": "hu", "words": 10, "ugy": "U2", "sha": "ed688d0c"}, "d04": {"lang": "hu", "words": 13, "ugy": "U1", "sha": "e9736e6d"}, "d05": {"lang": "en", "words": 7, "ugy": "U3", "sha": "0fb42b00"}, "d06": {"lang": "hu", "words": 1, "ugy": "U4", "sha": "d481a0c5"}}, GROUP = {"train": ["d01"], "test": ["d02", "d03"]}, RAND = {"test": ["d02"], "train": ["d01", "d03"]};
function mode(){ const r = document.querySelector("input[name=split]:checked"); return r ? r.value : "group"; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const ids = ["d01","d02","d03","d04","d05","d06"];
  el("text", {x: 10, y: 20, "font-size": 13, "font-weight": "bold"}, "Dokumentumok (" + s.alive.length + " → " + (s.alive.length - s.drop.length) + ")");
  ids.forEach((i, r) => {
    const y = 34 + r * 46, c = CARDS[i], live = s.alive.includes(i), dr = s.drop.includes(i);
    if (!live) return;
    el("rect", {x: 10, y, width: 250, height: 38, fill: dr ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": dr ? 2.5 : 1});
    el("text", {x: 20, y: y + 16, "font-size": 13, "font-weight": "bold"}, i);
    el("text", {x: 60, y: y + 16, "font-size": 12}, `${c.lang} · ${c.words} szó · ${c.ugy}`);
    el("text", {x: 20, y: y + 32, "font-size": 11, fill: css("--muted")}, "sha256: " + c.sha + "…");
    if (dr) { el("line", {x1: 10, y1: y + 19, x2: 260, y2: y + 19, stroke: css("--line"), "stroke-width": 2.5});
              el("text", {x: 270, y: y + 24, "font-size": 12, "font-weight": "bold"}, "kiesik"); }
  });
  if (s.stage === 5) {
    const m = mode(), sp = m === "group" ? GROUP : RAND;
    const tu = new Set(sp.train.map(i => CARDS[i].ugy)), su = new Set(sp.test.map(i => CARDS[i].ugy));
    const leak = [...su].filter(u => tu.has(u));
    el("rect", {x: 340, y: 40, width: 280, height: 110, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 480, y: 62, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "tanító");
    sp.train.forEach((i, r) => el("text", {x: 480, y: 88 + r * 20, "text-anchor": "middle", "font-size": 13}, `${i} (${CARDS[i].ugy})`));
    el("rect", {x: 340, y: 170, width: 280, height: 110, fill: css("--cell"), stroke: css("--line")});
    el("rect", {x: 345, y: 175, width: 270, height: 100, fill: "none", stroke: css("--line")});
    el("text", {x: 480, y: 196, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "teszt (befagyasztva)");
    sp.test.forEach((i, r) => el("text", {x: 480, y: 222 + r * 20, "text-anchor": "middle", "font-size": 13}, `${i} (${CARDS[i].ugy})`));
    el("text", {x: 480, y: 305, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, leak.length ? `SZIVÁRGÁS: az ${leak.join(", ")} ügy mindkét oldalon` : "teszt ∩ tanító ügyei = ∅");
    status.textContent = s.msg + (m === "group" ? "ügyalapú (Random(42) az ügyeken): teszt = U2 (d02, d03), tanító = U1 (d01); nincs közös ügy."
                                              : "véletlen soronkénti (Random(42) a sorokon): teszt = d02, tanító = d01, d03 → az U2 ügy mindkét oldalon (szivárgás).");
  } else {
    el("text", {x: 340, y: 60, "font-size": 13}, "Megmaradó dokumentumszám lépésenként:");
    [6, 5, 4, 3, 3].forEach((n, j) => {
      const on = j === s.stage;
      el("rect", {x: 340 + j * 54, y: 80 + (6 - n) * 12, width: 44, height: n * 24, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1});
      el("text", {x: 362 + j * 54, y: 72 + (6 - n) * 12, "text-anchor": "middle", "font-size": 12}, String(n));
    });
  }
}
document.querySelectorAll("input[name=split]").forEach(r => r.addEventListener("change", () => show(k)));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
