<style>

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}

.small{font-size:12px;color:var(--muted)}

function caseSteps(c){
  const loc = c.offline_required || c.privacy_required, h = loc ? "local" : "api", sz = (loc || c.latency_budget_ms < 100) ? "small" : "large";

  F.hosting = h; F.model_size = sz;
  st.push({n: loc ? "igen" : "nem", line: 3, f: Object.assign({}, F), msg: loc ? "Igen-ág: hosting = local, model_size = small" : `Nem-ág: hosting = api; késleltetési keret ${c.latency_budget_ms} ms ` + (sz === "small" ? "< 100 → small" : "≥ 100 → large")});

  else if (et === "format_style") { st.push({n: "ex", line: 11, f: Object.assign({}, F), msg: `Legalább 50 annotált példa? annotated_examples = ${c.annotated_examples} → ` + (c.annotated_examples >= 50 ? "igen" : "nem")}); leaf = c.annotated_examples >= 50 ? "peft" : "szigoru"; }
