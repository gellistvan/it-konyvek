<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felejtés és replay</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>replay-arány <input id="r" type="range" min="0" max="0.3" step="0.01" value="0" aria-label="Replay-arány"><b id="rv"></b></label>
  <label>KL-súly λ <input id="l" type="range" min="0" max="2" step="0.1" value="0" aria-label="KL-súly"><b id="lv"></b></label>
</div>
<div class="ctl"><button data-r="0" data-l="0">replay nélkül</button><button data-r="0.1" data-l="0">10% replay</button><button data-r="0.1" data-l="1">10% replay + KL</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Két panel: a régi adat PPL-je a továbbtanítás alatt nő, az új adaté csökken; a replay és a KL-súly a régi adat romlását mérsékli."></svg>
<p class="small">Illusztratív modell, nem mérés: régi PPL vége = 30 + 4·e<sup>−9,808·r</sup>/(1 + 0,5·λ), új PPL vége = 25 + 20·r + λ.
Szürke szaggatott: replay nélküli referencia. ΔPPL = PPL<sub>after</sub> − PPL<sub>before</sub>; a 3.2 definíciójával (P = −PPL) BT = −ΔPPL.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
const SM = 500, eo = (r, l) => 30 + 4 * Math.exp(-9.808 * r) / (1 + 0.5 * l), en = (r, l) => 25 + 20 * r + l;
const oldP = (s, r, l) => 30 + (eo(r, l) - 30) * (1 - Math.exp(-s / 150)) / (1 - Math.exp(-SM / 150));
const newP = (s, r, l) => en(r, l) + (80 - en(r, l)) * (Math.exp(-s / 80) - Math.exp(-SM / 80)) / (1 - Math.exp(-SM / 80));
const P = [{x0: 55, x1: 305, lo: 29.4, hi: 35.4, ticks: [30, 31, 32, 33, 34, 35], fn: oldP, ref: 30, t: "(a) régi adat"},
           {x0: 375, x1: 625, lo: 15, hi: 88, ticks: [20, 40, 60, 80], fn: newP, ref: 80, t: "(b) új adat"}];
const T = 30, B = 255;
function draw(){
  const r = +document.getElementById("r").value, l = +document.getElementById("l").value;
  document.getElementById("rv").textContent = Math.round(r * 100) + "%";
  document.getElementById("lv").textContent = f(l, 1);
  svg.innerHTML = "";
  P.forEach(p => {
    const X = s => p.x0 + (p.x1 - p.x0) * s / SM, Y = v => B - (B - T) * (v - p.lo) / (p.hi - p.lo);
    p.ticks.forEach(v => { el("line", {x1: p.x0, y1: Y(v), x2: p.x1, y2: Y(v), stroke: css("--grid")}); el("text", {x: p.x0 - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); });
    [0, 250, 500].forEach(s => el("text", {x: X(s), y: B + 15, "text-anchor": "middle", "font-size": 11}, String(s)));
    el("text", {x: (p.x0 + p.x1) / 2, y: B + 32, "text-anchor": "middle", "font-size": 12}, "továbbtanítási lépés");
    el("text", {x: p.x0, y: 18, "font-size": 12, "font-weight": "bold"}, p.t);
    el("line", {x1: p.x0, y1: Y(p.ref), x2: p.x1, y2: Y(p.ref), stroke: css("--muted"), "stroke-dasharray": "8 3 2 3"});
    let a = "", b = "";
    for (let i = 0; i <= 100; i++) { const s = SM * i / 100;
      a += (a ? "L" : "M") + X(s).toFixed(1) + "," + Y(p.fn(s, 0, 0)).toFixed(1);
      b += (b ? "L" : "M") + X(s).toFixed(1) + "," + Y(p.fn(s, r, l)).toFixed(1); }
    el("path", {d: a, fill: "none", stroke: css("--muted"), "stroke-width": 1.5, "stroke-dasharray": "5 4"});
    el("path", {d: b, fill: "none", stroke: css("--hl"), "stroke-width": 3});
    const ve = p.fn(SM, r, l);
    el("circle", {cx: X(SM), cy: Y(ve), r: 4.5, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2});
    el("text", {x: X(SM) - 6, y: Y(ve) + (p.ref === 30 ? -8 : 16), "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, f(ve, 1));
  });
  const dO = eo(r, l) - 30, dN = en(r, l) - 80;
  document.getElementById("status").textContent =
    `Régi adat: PPL 30 → ${f(eo(r, l), 2)}, ΔPPL = +${f(dO, 2)} (+${f(100 * dO / 30, 1)}%), BT = −ΔPPL = ${f(-dO, 2)}. ` +
    `Új adat: PPL 80 → ${f(en(r, l), 2)} (${f(100 * dN / 80, 1)}%). Illusztratív, nem mért.`;
}
["r", "l"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.querySelectorAll("button[data-r]").forEach(b => b.onclick = () => { document.getElementById("r").value = b.dataset.r; document.getElementById("l").value = b.dataset.l; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
