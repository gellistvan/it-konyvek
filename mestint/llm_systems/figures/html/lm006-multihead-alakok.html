<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-head attention tenzoralakjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n <input id="sn" type="range" min="1" max="6" value="3" oninput="upd()" aria-label="Szekvenciahossz n"> <b id="vn">3</b></label><label>d <input id="sd" type="range" min="2" max="8" step="1" value="4" oninput="upd()" aria-label="Modelldimenzió d"> <b id="vd">4</b></label><label>h <input id="sh" type="range" min="1" max="4" value="2" oninput="upd()" aria-label="Fejek száma h"> <b id="vh">2</b></label><span id="err" class="small" aria-live="polite"></span><label><input id="bad" type="checkbox" onchange="show(k)"> hibás konkatenáció (n mentén)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az X mátrixból két fej külön vetítéssel 3×2-es Q, K, V mátrixokat készít, fejenként 3×3-as figyelmi mátrixot számol, a két 3×2-es kimenetet az utolsó tengelyen 3×4-essé fűzi, majd W_O-val 3×4-es kimenetet ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 3.2.5 számszerű példája: n = 3, d = 4, h = 2, d_k = d_v = d/h = 2. Szaggatott rács = páros sorszámú fej; sraffozott cella = kauzális maszk; vastag függőleges vonal = fejhatár a konkatenációban. Csak alakok.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": "X", "msg": "1/8 Bemenet: X (3×4) – n = 3 token, d = 4 jellemző"}, {"a": "P", "msg": "2/8 Vetítés fejenként: W_Q^i, W_K^i, W_V^i (4×2) → Q_i, K_i, V_i (3×2), d_k = d/h = 2"}, {"a": "S", "msg": "3/8 Pontszám fejenként: Q_i K_iᵀ / √2 (3×3)"}, {"a": "M", "msg": "4/8 Kauzális maszk: a j > i cellák −∞ (3 cella fejenként)"}, {"a": "A", "msg": "5/8 Softmax soronként: A_i (3×3), minden sor összege 1"}, {"a": "AV", "msg": "6/8 Súlyozott összeg: A_i V_i (3×2) fejenként"}, {"a": "C", "msg": "7/8 Konkatenáció az utolsó (feature) tengelyen: 2 × (3×2) → MultiHead (3×4)"}, {"a": "O", "msg": "8/8 Kimeneti projekció: MultiHead (3×4) · W_O (4×4) → Output (3×4)"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function shapesOf(n, d, h){ const dk = d / h; return {n, d, h, dk}; }
function stepList(n, d, h){
  const dk = d / h, f = (a, b) => a + "×" + b;
  return [
    {a: "X", msg: `1/8 Bemenet: X (${f(n, d)}) – n = ${n} token, d = ${d} jellemző`},
    {a: "P", msg: `2/8 Vetítés fejenként: W_Q^i, W_K^i, W_V^i (${f(d, dk)}) → Q_i, K_i, V_i (${f(n, dk)}), d_k = d/h = ${dk}`},
    {a: "S", msg: `3/8 Pontszám fejenként: Q_i K_iᵀ / √${dk} (${f(n, n)})`},
    {a: "M", msg: `4/8 Kauzális maszk: a j > i cellák −∞ (${n * (n - 1) / 2} cella fejenként)`},
    {a: "A", msg: `5/8 Softmax soronként: A_i (${f(n, n)}), minden sor összege 1`},
    {a: "AV", msg: `6/8 Súlyozott összeg: A_i V_i (${f(n, dk)}) fejenként`},
    {a: "C", msg: `7/8 Konkatenáció az utolsó (feature) tengelyen: ${h} × (${n}×${dk}) → MultiHead (${f(n, h * dk)})`},
    {a: "O", msg: `8/8 Kimeneti projekció: MultiHead (${f(n, h * dk)}) · W_O (${f(d, d)}) → Output (${f(n, d)})`}];
}
let CUR = {n: 3, d: 4, h: 2};
const ORDER = ["X", "P", "S", "M", "A", "AV", "C", "O"];
function render(s){
  const {n, d, h} = CUR, dk = d / h, bad = document.getElementById("bad").checked;
  const ai = ORDER.indexOf(s.a);
  // vízszintes elrendezés cellaegységben
  const gap = 2.2, cols = [d, dk + 0.7, dk + 0.7, n, n, dk, d, d, d];
  const xs = []; let x = 0; cols.forEach(c => { xs.push(x); x += c + gap; });
  const laneH = Math.max(d, n) + 2.2, totW = x - gap, totH = Math.max(h * laneH, n + 6) + 2.2;
  const cs = Math.min(640 / totW, 330 / totH);
  svg.setAttribute("viewBox", `-10 -24 ${totW * cs + 20} ${totH * cs + 34}`);
  svg.innerHTML = "";
  const line = css("--line"), hl = css("--hl"), cell = css("--cell");
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<pattern id="mh" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cellhl")}"/><path d="M0,6L6,0" stroke="${css("--fg")}" stroke-width="0.8"/></pattern>`;
  function G(gx, gy, r, c, o){
    o = o || {}; const on = o.on, dash = o.dash || "";
    for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) {
      const m = o.mask && j > i;
      el("rect", {x: gx + j * cs, y: gy + i * cs, width: cs, height: cs, fill: m ? "url(#mh)" : (on ? css("--cellhl") : cell), stroke: line, "stroke-width": 0.6, "stroke-dasharray": dash});
    }
    el("rect", {x: gx, y: gy, width: c * cs, height: r * cs, fill: "none", stroke: on ? hl : line, "stroke-width": on ? 3.5 : 1.5, "stroke-dasharray": dash});
  }
  function T(tx, ty, t, b){ el("text", {x: tx, y: ty, "font-size": 12, "text-anchor": "middle", "font-weight": b ? "bold" : "normal"}, t); }
  const midY = totH * cs / 2 - n * cs / 2;
  G(xs[0] * cs, midY, n, d, {on: ai === 0}); T((xs[0] + d / 2) * cs, midY + n * cs + 15, `X (${n}×${d})`, ai === 0);
  for (let hd = 0; hd < h; hd++) {
    const ly = (hd * laneH + 0.3) * cs, dash = hd % 2 ? "3 2" : "";
    el("text", {x: xs[1] * cs, y: ly - 4, "font-size": 12, "font-weight": "bold"}, `${hd + 1}. fej`);
    for (let t = 2; t >= 0; t--) G((xs[1] + 0.35 * t) * cs, ly + 0.35 * t * cs, d, dk, {on: ai === 1, dash});
    for (let t = 2; t >= 0; t--) G((xs[2] + 0.35 * t) * cs, ly + 0.35 * t * cs, n, dk, {on: ai === 1, dash});
    G(xs[3] * cs, ly, n, n, {on: ai === 2 || ai === 3, mask: ai >= 3, dash});
    G(xs[4] * cs, ly, n, n, {on: ai === 4, dash});
    G(xs[5] * cs, ly, n, dk, {on: ai === 5, dash});
    if (hd === h - 1) { const yy = ly + Math.max(d, n) * cs + 30;
      T((xs[1] + dk / 2 + 0.35) * cs, yy, `W (${d}×${dk})`); T((xs[2] + dk / 2 + 0.35) * cs, yy + 15, `Q,K,V (${n}×${dk})`);
      T((xs[3] + n / 2) * cs, yy, `QKᵀ/√d_k (${n}×${n})`); T((xs[4] + n / 2) * cs, yy + 15, `A (${n}×${n})`); T((xs[5] + dk / 2) * cs, yy, `AV (${n}×${dk})`); }
    el("line", {x1: (xs[0] + d) * cs + 2, y1: midY + n * cs / 2, x2: xs[1] * cs - 3, y2: ly + d * cs / 2, stroke: line, "stroke-width": 1});
    el("line", {x1: (xs[5] + dk) * cs + 2, y1: ly + n * cs / 2, x2: xs[6] * cs - 3, y2: midY + n * cs / 2, stroke: line, "stroke-width": 1, "stroke-dasharray": dash});
  }
  if (bad && ai >= 6) {
    G(xs[6] * cs, midY - (h * n - n) * cs / 2, h * n, dk, {dash: "6 3"});
    el("rect", {x: xs[6] * cs - 3, y: midY - (h * n - n) * cs / 2 - 3, width: dk * cs + 6, height: h * n * cs + 6, fill: "none", stroke: line, "stroke-width": 4, "stroke-dasharray": "8 4"});
    T((xs[6] + dk / 2) * cs, midY + n * cs + (h * n - n) * cs / 2 + 16, `HIBÁS: ${h * n}×${dk}`, true);
  } else {
    G(xs[6] * cs, midY, n, h * dk, {on: ai === 6});
    for (let hd = 1; hd < h; hd++) el("line", {x1: (xs[6] + hd * dk) * cs, y1: midY - 6, x2: (xs[6] + hd * dk) * cs, y2: midY + n * cs + 6, stroke: line, "stroke-width": 3.5});
    T((xs[6] + d / 2) * cs, midY + n * cs + 15, `MultiHead (${n}×${h * dk})`, ai === 6);
    T((xs[6] + d / 2) * cs, midY - 10, "↔ utolsó tengely");
  }
  G(xs[7] * cs, midY - (d - n) * cs / 2, d, d, {on: ai === 7}); T((xs[7] + d / 2) * cs, midY + n * cs + (d - n) * cs / 2 + 15, `W_O (${d}×${d})`, ai === 7);
  G(xs[8] * cs, midY, n, d, {on: ai === 7}); T((xs[8] + d / 2) * cs, midY + n * cs + 15, `Output (${n}×${d})`, ai === 7);
}
function upd(){
  const n = +document.getElementById("sn").value, d = +document.getElementById("sd").value, sh = document.getElementById("sh");
  const divs = []; for (let q = 1; q <= Math.min(d, 4); q++) if (d % q === 0) divs.push(q);
  if (!divs.includes(+sh.value)) sh.value = divs[divs.length - 1];
  sh.max = 4; const h = +sh.value;
  const msg = document.getElementById("err");
  if (d % h) { msg.textContent = "d legyen osztható h-val"; return; }
  msg.textContent = "megengedett h: " + divs.join(", ");
  ["n", "d", "h"].forEach(q => document.getElementById("v" + q).textContent = {n, d, h}[q]);
  CUR = {n, d, h}; const kk = k; setSteps(stepList(n, d, h)); show(kk);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
