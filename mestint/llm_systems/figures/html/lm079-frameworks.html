<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megfelelési térkép: három keret</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--band:#f4f4f4;--on:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--band:#222;--on:#5a4a10}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg g.ev{cursor:pointer}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label>Labor CSV betöltése (id, framework, control, status, …): <input type="file" id="csv" accept=".csv,text/csv"></label>
  <button id="clr">kiemelés törlése</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 -12 800 520" role="img" aria-label="Három sáv: EU AI Act, NIST AI RMF, ISO/IEC 42001; jobbra a közös bizonyítéktár, vonalakkal a lefedett követelményekhez."></svg>
<p class="small">Sematikus; jogi tanácsnak nem minősül; dátumok a 21.3.2 szerint. Kattints egy bizonyítékra (vagy Tab +
Enter). A CSV-sorok a keretük sávjában jelennek meg: ✓ done, ○ pending, – not_applicable. A kezdő három sor szemléltető.</p>
<script>
const D = {"el": {"eu_cls": {"b": "EU", "t": "besorolás:\n6. cikk (1)–(3),\nI./III. melléklet", "x": 17.5, "y": 52.49999999999999, "w": 97.5, "h": 87.5}, "eu_tilt": {"b": "EU", "t": "tiltott", "x": 127.49999999999999, "y": 54.99999999999996, "w": 62.5, "h": 30.0}, "eu_high": {"b": "EU", "t": "magas kock.", "x": 195.0, "y": 54.99999999999996, "w": 72.5, "h": 30.0}, "eu_tr": {"b": "EU", "t": "átláthatósági", "x": 272.5, "y": 54.99999999999996, "w": 72.5, "h": 30.0}, "eu_min": {"b": "EU", "t": "minimális", "x": 350.0, "y": 54.99999999999996, "w": 60.0, "h": 30.0}, "eu_data": {"b": "EU", "t": "adatkezelés\n(10. cikk)", "x": 127.49999999999999, "y": 99.99999999999999, "w": 80.0, "h": 40.0}, "eu_doc": {"b": "EU", "t": "tech. dok.\n(11. cikk)", "x": 212.5, "y": 99.99999999999999, "w": 97.5, "h": 40.0}, "eu_log": {"b": "EU", "t": "naplózás\n(12. cikk)", "x": 315.0, "y": 99.99999999999999, "w": 75.0, "h": 40.0}, "eu_gpai": {"b": "EU", "t": "GPAI-oldalág (51–55. cikk)\n53.: dokumentáció (XI. m.),\nadatösszefoglaló\n55.: értékelés, incidens", "x": 422.49999999999994, "y": 54.99999999999999, "w": 142.5, "h": 85.0}, "ni_map": {"b": "NIST", "t": "Map", "x": 120.0, "y": 232.50000000000003, "w": 95.0, "h": 30.0}, "ni_meas": {"b": "NIST", "t": "Measure", "x": 260.0, "y": 232.50000000000003, "w": 95.0, "h": 30.0}, "ni_man": {"b": "NIST", "t": "Manage", "x": 400.0, "y": 232.50000000000003, "w": 95.0, "h": 30.0}, "iso_plan": {"b": "ISO", "t": "Plan: 4–6.\nkontextus, vezetés,\ntervezés", "x": 22.5, "y": 362.5, "w": 112.5, "h": 57.49999999999999}, "iso_do": {"b": "ISO", "t": "Do: 7–8.\ntámogatás,\nműködés", "x": 147.5, "y": 362.5, "w": 95.0, "h": 57.49999999999999}, "iso_75": {"b": "ISO", "t": "7.5 dokumentált\ninformáció", "x": 252.5, "y": 362.5, "w": 95.0, "h": 57.49999999999999}, "iso_chk": {"b": "ISO", "t": "Check: 9.\nteljesítmény-\nértékelés", "x": 357.5, "y": 362.5, "w": 97.5, "h": 57.49999999999999}, "iso_act": {"b": "ISO", "t": "Act: 10.\nfejlesztés", "x": 465.00000000000006, "y": 362.5, "w": 95.0, "h": 57.49999999999999}}, "ev": {"modellkártya": {"ts": ["eu_doc", "eu_gpai", "ni_meas", "iso_75"], "x": 627.5, "y": 67.49999999999999}, "adatkártya": {"ts": ["eu_data", "eu_gpai", "ni_map", "iso_75"], "x": 627.5, "y": 150.0}, "értékelési jegyzőkönyv": {"ts": ["eu_gpai", "ni_meas", "iso_chk"], "x": 627.5, "y": 232.49999999999997}, "naplók": {"ts": ["eu_log", "ni_man", "iso_chk"], "x": 627.5, "y": 314.99999999999994}, "incidensjelentés": {"ts": ["eu_gpai", "ni_man", "iso_act"], "x": 627.5, "y": 397.49999999999994}}, "bands": {"EU": {"y": 27.499999999999993, "h": 122.50000000000001, "t": "EU AI Act – jogi minimum (kötelező)"}, "NIST": {"y": 182.50000000000003, "h": 112.5, "t": "NIST AI RMF – kockázatkezelés (önkéntes)"}, "ISO": {"y": 324.99999999999994, "h": 110.00000000000001, "t": "ISO/IEC 42001 – menedzsmentrendszer, PDCA (önkéntes, tanúsítható)"}}, "rows": [{"id": "EU_001", "framework": "EU AI Act", "control": "besorolás és szerep rögzítése", "status": "done"}, {"id": "NIST_002", "framework": "NIST AI RMF", "control": "Measure: hivatkozás-pontosság mérése", "status": "pending"}, {"id": "ISO_001", "framework": "ISO/IEC 42001", "control": "AI-politika és felelősségek (5.)", "status": "done"}], "icon": {"done": "✓", "pending": "◐", "not_applicable": "–"}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, txt, par){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;(par||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let sel = null, rows = D.rows;
const HICON = {done: "✓", pending: "○", not_applicable: "–"};
const FW = {"EU AI Act": "EU", "NIST AI RMF": "NIST", "ISO/IEC 42001": "ISO"};
function draw(){
  svg.innerHTML = "";
  const on = new Set(sel ? D.ev[sel].ts : []);
  for (const b in D.bands) { const B = D.bands[b]; el("rect", {x: 8, y: B.y, width: 565, height: B.h, fill: css("--band"), stroke: css("--muted")}); el("text", {x: 14, y: B.y - 4, "font-size": 12, "font-weight": "bold"}, B.t); }
  el("rect", {x: 60, y: D.el.ni_map.y - 12, width: 480, height: 80, rx: 26, fill: "none", stroke: css("--line"), "stroke-width": 2.5});
  el("text", {x: 74, y: D.el.ni_map.y - 1, "font-size": 11, "font-style": "italic"}, "Govern – körülöleli a ciklust");
  for (const e in D.ev) D.ev[e].ts.forEach(t => { const T = D.el[t], kot = T.b === "EU", act = e === sel;
    el("line", {x1: D.ev[e].x, y1: D.ev[e].y, x2: T.x + T.w, y2: T.y + T.h / 2, stroke: act ? css("--hl2") : css("--muted"), "stroke-width": act ? 3 : (kot ? 1.8 : 0.8), opacity: sel && !act ? 0.25 : 0.9}); });
  for (const k in D.el) { const T = D.el[k], hl = on.has(k);
    el("rect", {x: T.x, y: T.y, width: T.w, height: T.h, rx: 5, fill: hl ? css("--on") : css("--cell"), stroke: hl ? css("--hl2") : css("--line"), "stroke-width": hl ? 3 : 1});
    const L = T.t.split("\n"); L.forEach((s, j) => el("text", {x: T.x + T.w / 2, y: T.y + T.h / 2 + 4 + (j - (L.length - 1) / 2) * 12, "text-anchor": "middle", "font-size": 10, "font-weight": hl ? "bold" : "normal"}, s)); }
  el("text", {x: 690, y: 2, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "közös bizonyítéktár");
  for (const e in D.ev) { const E = D.ev[e], g = el("g", {class: "ev", tabindex: 0, role: "button", "aria-pressed": String(e === sel), "aria-label": `${e}: lefedett követelmények kiemelése`});
    el("rect", {x: E.x, y: E.y - 20, width: 165, height: 40, rx: 6, fill: e === sel ? css("--on") : css("--band"), stroke: e === sel ? css("--hl2") : css("--line"), "stroke-width": e === sel ? 3 : 1.3}, undefined, g);
    el("text", {x: E.x + 82, y: E.y + 5, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, e, g);
    const pick = () => { sel = sel === e ? null : e; draw(); };
    g.addEventListener("click", pick); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } }); }
  // CSV-sorok a sávokban
  const cnt = {EU: 0, NIST: 0, ISO: 0};
  rows.forEach(r => { const b = FW[r.framework]; if (!b) return; const B = D.bands[b], i = cnt[b]++;
    if (i > 3) { if (i === 4) el("text", {x: 12 + 4 * 135, y: B.y + B.h + 14, "font-size": 10.5, fill: css("--muted")}, "…"); return; }
    el("text", {x: 12 + i * 135, y: B.y + B.h + 14, "font-size": 10.5, "font-weight": "bold", fill: r.status === "done" ? css("--fg") : css("--hl2")}, `${HICON[r.status] || "?"} ${r.id} ${r.status}`); });
  document.getElementById("status").textContent = sel ? `${sel} → ` + D.ev[sel].ts.map(t => D.el[t].t.replace(/\n/g, " ")).join(" · ") : `CSV-sorok: ${rows.length} (done: ${rows.filter(r => r.status === "done").length}, pending: ${rows.filter(r => r.status === "pending").length}, not_applicable: ${rows.filter(r => r.status === "not_applicable").length}). Kattints egy bizonyítékra.`;
}
function parseCSV(t){
  const lines = t.split(/\r?\n/).filter(l => l.trim()), split = l => { const o = []; let c = "", q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { o.push(c); c = ""; } else c += ch; } o.push(c); return o.map(s => s.trim()); };
  const h = split(lines[0]); return lines.slice(1).map(l => { const v = split(l), o = {}; h.forEach((k, i) => o[k] = v[i]); return o; });
}
document.getElementById("csv").addEventListener("change", ev => { const f = ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { rows = parseCSV(rd.result); } catch (e) { rows = []; } draw(); }; rd.readAsText(f); });
document.getElementById("clr").onclick = () => { sel = null; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
