<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDPR-szerepek az LLM-stackben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--ctrl:#eee;--mark:#ffe9a8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--ctrl:#3a3a3a;--mark:#5a4a10}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:5px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;max-width:720px}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg g.f{cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:12px}
table{border-collapse:collapse;font-size:12.5px;flex:1 1 300px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left;vertical-align:top}
tr.on td{background:var(--mark);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Változatok">
  <span>Szolgáltató:</span>
  <label><input type="radio" name="loc" id="eu" checked> EGT</label>
  <label><input type="radio" name="loc" id="us"> USA</label>
  <label><input type="checkbox" id="own"> saját modellfejlesztésre is használja</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 400" role="img" aria-label="A vállalat adatkezelő; a felhős modellszolgáltató, a hosting és az annotációs cég adatfeldolgozó; nyilak: panasz, prompt, válasz, napló, annotációs minta."></svg>
<div class="tabs">
  <table id="tc"></table>
  <table id="tp"></table>
</div>
<p class="small">Sematikus; a szerepet mindig a szerződés és a tényleges feldolgozás dönti el. A RoPA-sorok a 20.4.5
példatábláiból (helyőrzők). Kattints egy nyílra (vagy Tab + Enter) a kapcsolódó RoPA-sorokhoz.</p>
<script>
const D = {"actors": {"subj": {"t": "Érintett\n(ügyfél)", "role": "érintett", "x": 0.2, "y": 3.35, "w": 2.0, "h": 1.2}, "ctrl": {"t": "Vállalat\n(adatkezelő)", "role": "adatkezelő", "x": 3.2, "y": 3.2, "w": 2.6, "h": 1.5}, "host": {"t": "Hosting\n(adatfeldolgozó)", "role": "adatfeldolgozó", "x": 3.2, "y": 6.35, "w": 2.6, "h": 1.15}, "annot": {"t": "Annotációs cég\n(adatfeldolgozó)", "role": "adatfeldolgozó", "x": 3.2, "y": 0.25, "w": 2.6, "h": 1.15}, "prov": {"t": "Felhős modell-\nszolgáltató\n(adatfeldolgozó,\nDPA – 28. cikk)", "role": "adatfeldolgozó", "x": 7.0, "y": 3.0, "w": 2.8, "h": 1.9}}, "flows": [{"a": "subj", "b": "ctrl", "t": "panasz"}, {"a": "ctrl", "b": "prov", "t": "prompt: pszeudonim azonosító + panasz"}, {"a": "prov", "b": "ctrl", "t": "válasz"}, {"a": "ctrl", "b": "host", "t": "napló: request_id, revízió, prompt-HMAC; 30 nap"}, {"a": "ctrl", "b": "annot", "t": "annotációs minta"}], "rc": [["Folyamat neve", "RAG-alapú ügyfélszolgálati asszisztens"], ["Cél", "Ügyfélkérdések megválaszolása dokumentumtárból"], ["Jogalap", "GDPR 6. cikk (1) bekezdés b) pont – szerződés teljesítése"], ["Érintettek", "Ügyfelek"], ["Adatkategóriák", "Ügyfélazonosító (pszeudonim), termékterület, issue típus, szöveges panasz"], ["Címzettek", "Belső ügyfélszolgálati rendszer, felhős modellszolgáltató (adatfeldolgozó)"], ["Megőrzés", "A kérés ideje + 30 nap hibakeresésre"], ["Intézkedések", "TLS, pszeudonimizálás, hozzáférés-kontroll, API-kulcsok elkülönítése"], ["Nemzetközi adattovábbítás", "EU-n belüli adatközpont; standard szerződéses záradékok, ha harmadik ország"]], "rp": [["Adatfeldolgozó", "Felhős modellszolgáltató Kft. (példa)"], ["Megbízó adatkezelők", "Példa Ügyfélszolgálati Zrt.; Másik Kft."], ["Feldolgozási kategóriák adatkezelőnként", "Példa Zrt.: inferencia ügyfélpanaszokon; Másik Kft.: naplótárolás"], ["Adattovábbítás", "USA-beli adatközpont; SCC és átviteli hatásértékelés"], ["Biztonsági intézkedések", "TLS 1.3, RBAC, titkosított tárolás, naplózás"]], "map": [[["Érintettek", "Adatkategóriák", "Jogalap"], [], "Az érintett adata a vállalathoz kerül (gyűjtés)."], [["Címzettek", "Adatkategóriák", "Nemzetközi adattovábbítás"], ["Adatfeldolgozó", "Feldolgozási kategóriák adatkezelőnként", "Adattovábbítás"], "A prompt a szolgáltatóhoz megy: címzett + (USA esetén) továbbítás SCC + TIA mellett."], [["Cél"], ["Feldolgozási kategóriák adatkezelőnként"], "A válasz a cél (ügyfélkérdés megválaszolása) teljesítése."], [["Megőrzés", "Intézkedések"], [], "Napló: request_id, revízió, prompt-HMAC; megőrzés 30 nap."], [["Címzettek"], [], "Az annotátor új címzett: a példatáblában nincs sora – külön bejegyzés és szerződés kell."]]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, txt, par){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;(par||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const S = 66, Y = y => (8.1 - y) * 48;
let sel = -1;
function box(k, a, own){
  const x = a.x * S, y = Y(a.y + a.h), w = a.w * S, h = a.h * 48;
  if (k === "prov" && own) {
    el("rect", {x, y, width: w, height: h / 2 - 3, rx: 6, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: x + w / 2, y: y + h / 4 + 4, "text-anchor": "middle", "font-size": 11.5}, "adatfeldolgozó (inferencia, DPA)");
    [0, 5].forEach(p => el("rect", {x: x + p, y: y + h / 2 + 3 + p, width: w - 2 * p, height: h / 2 - 3 - 2 * p, fill: "none", stroke: css("--line")}));
    el("text", {x: x + w / 2, y: y + 3 * h / 4 + 5, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, "önálló adatkezelő (saját cél)");
    return;
  }
  el("rect", {x, y, width: w, height: h, rx: 6, fill: a.role === "adatkezelő" ? css("--ctrl") : css("--cell"), stroke: css("--line"), "stroke-width": a.role === "adatkezelő" ? 3.5 : 1.2, "stroke-dasharray": a.role === "érintett" ? "2 3" : "none"});
  const L = a.t.split("\n"); L.forEach((t, j) => el("text", {x: x + w / 2, y: y + h / 2 + 5 + (j - (L.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 12, "font-weight": a.role === "adatkezelő" ? "bold" : "normal"}, t));
}
function draw(){
  const usa = document.getElementById("us").checked, own = document.getElementById("own").checked;
  svg.innerHTML = "";
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`;
  const ex = (usa ? 6.45 : 9.92) * S;
  el("rect", {x: 2, y: Y(7.8), width: ex - 2, height: 7.8 * 48, fill: "none", stroke: css("--fg"), "stroke-dasharray": "9 4"});
  el("text", {x: 8, y: Y(7.8) + 16, "font-size": 13, "font-weight": "bold"}, "EGT");
  if (usa) el("text", {x: 655, y: Y(7.8) + 16, "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, "USA");
  for (const k in D.actors) box(k, D.actors[k], own);
  const AR = [[[2.2, 3.95], [3.2, 3.95], [2.7, 4.2, "middle"]], [[5.8, 4.3], [7.0, 4.3], [6.4, 4.5, "middle"]], [[7.0, 3.55], [5.8, 3.55], [6.4, 3.2, "middle"]], [[4.5, 4.7], [4.5, 6.35], [4.62, 5.55, "start"]], [[4.5, 3.2], [4.5, 1.4], [4.62, 2.3, "start"]]];
  const LBL = ["panasz", "prompt", "válasz", "napló (30 nap)", "annotációs minta"];
  AR.forEach(([p, q, l], i) => {
    const g = el("g", {class: "f", tabindex: 0, role: "button", "aria-label": `${D.flows[i].t}: kapcsolódó RoPA-sorok`});
    const on = sel === i;
    el("line", {x1: p[0] * S, y1: Y(p[1]), x2: q[0] * S, y2: Y(q[1]), stroke: "transparent", "stroke-width": 16}, undefined, g);
    el("line", {x1: p[0] * S, y1: Y(p[1]), x2: q[0] * S, y2: Y(q[1]), stroke: on ? css("--hl2") : css("--fg"), "stroke-width": on ? 3.5 : 1.6, "marker-end": on ? "url(#ah2)" : "url(#ah)"}, undefined, g);
    el("text", {x: l[0] * S, y: Y(l[1]), "text-anchor": l[2], "font-size": 11.5, fill: on ? css("--hl2") : css("--fg")}, LBL[i], g);
    const pick = () => { sel = i; draw(); };
    g.addEventListener("click", pick); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
  });
  if (usa) { el("rect", {x: 6.42 * S - 52, y: Y(2.75), width: 104, height: 34, rx: 5, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2}); el("text", {x: 6.42 * S, y: Y(2.75) + 14, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, "továbbítás:"); el("text", {x: 6.42 * S, y: Y(2.75) + 28, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, "SCC + TIA"); }
  if (own) { el("text", {x: 1.2 * S, y: Y(2.4), "text-anchor": "middle", "font-size": 11.5, "font-style": "italic"}, "⚠ új tájékoztatási"); el("text", {x: 1.2 * S, y: Y(2.4) + 15, "text-anchor": "middle", "font-size": 11.5, "font-style": "italic"}, "kötelezettség"); }
  const m = sel >= 0 ? D.map[sel] : [[], [], ""];
  const rp = D.rp.filter(r => usa || r[0] !== "Adattovábbítás").concat(usa ? [] : [["Adattovábbítás", "– (EGT-n belül; a példatábla USA-változata)"]]);
  document.getElementById("tc").innerHTML = "<tr><th colspan=2>Adatkezelői RoPA (30. cikk (1))</th></tr>" + D.rc.map(([f, v]) => `<tr class="${m[0].includes(f) ? "on" : ""}"><td>${f}</td><td>${v}</td></tr>`).join("");
  document.getElementById("tp").innerHTML = "<tr><th colspan=2>Adatfeldolgozói RoPA (30. cikk (2))</th></tr>" + rp.map(([f, v]) => `<tr class="${m[1].includes(f) ? "on" : ""}"><td>${f}</td><td>${v}</td></tr>`).join("");
  const roles = own ? "1 adatkezelő (vállalat) + 3 adatfeldolgozó; a szolgáltató a saját célra önálló adatkezelő is" : "1 adatkezelő (vállalat) + 3 adatfeldolgozó (szolgáltató, hosting, annotátor)";
  document.getElementById("status").textContent = `${roles}${usa ? "; a prompt az EGT-n kívülre megy: továbbítás SCC + TIA mellett" : ""}.` + (sel >= 0 ? ` – ${D.flows[sel].t}: ${m[2]}` : "");
}
["eu", "us", "own"].forEach(id => document.getElementById(id).addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
