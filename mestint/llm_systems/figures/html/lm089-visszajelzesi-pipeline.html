<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visszajelzési pipeline</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>esemény: <select id="ev" aria-label="Visszajelzési esemény kiválasztása"><option value="thumbs_down">hüvelykujj le (explicit)</option><option value="copy">másolás (implicit)</option><option value="regenerate_x3">regenerálás ×3 (implicit)</option></select></label><label>kappa-kapu küszöbe: <input id="km" type="range" min="0.4" max="0.95" step="0.01" value="0.6" aria-label="A kappa-kapu küszöbe"> <b id="kmv">0,60</b> (mért κ = 0,859)</label><pre id="rec" style="width:100%;margin:4px 0 0;padding:6px 8px;background:var(--code);font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap"></pre></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat lépés egy sorban: esemény, normalizálás, címkézés, minőségellenőrzés rombuszként, adatkártya, export; a kiválasztott esemény rekordja lépésenként alakul, alul a JSON."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Helyőrző azonosítók; a mezőnevek a 24.1.5 sémájából. A κ = 0,859 a labor szintetikus adatán mért érték (100 eset, két annotátor, seed = 12345). A kapu küszöbét 0,859 fölé állítva a rekord az elutasított ágra kerül.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Eseménykibocsátás: az alkalmazás rögzíti az interakciót (hüvelykujj le (explicit)) a kontextussal.", "line": 0, "stage": 0, "rec": {"event": "thumbs_down", "response_id": "<response_id>", "session": "<anonim session-hash>", "ts": "2025-01-15T10:00:00Z"}, "ok": null}, {"msg": "2. Normalizálás: séma szerinti rekord; a hiányzó mezőket alapértelmezéssel töltjük vagy kizárjuk.", "line": 1, "stage": 1, "rec": {"event_id": "<uuid>", "session_id": "<hash>", "prompt_hash": "<hash>", "response_id": "<response_id>", "feedback_type": "explicit", "label": null, "rationale": null, "annotator_id": null, "created_at": "2025-01-15T10:00:00Z", "metadata_json": {"model_version": "<modellverzió>", "prompt_version": "<promptverzió>", "ui_element": "thumbs_button"}}, "ok": null}, {"msg": "3. Címkézés: explicit jel: thumbs_down → negative.", "line": 2, "stage": 2, "rec": {"event_id": "<uuid>", "session_id": "<hash>", "prompt_hash": "<hash>", "response_id": "<response_id>", "feedback_type": "explicit", "label": "negative", "rationale": null, "annotator_id": null, "created_at": "2025-01-15T10:00:00Z", "metadata_json": {"model_version": "<modellverzió>", "prompt_version": "<promptverzió>", "ui_element": "thumbs_button"}}, "ok": null}, {"msg": "4, Minőségellenőrzés: séma érvényes? ✓; κ ≥ 0,60? κ = 0,859 ✓ → a rekord továbbmegy.", "line": 3, "stage": 3, "rec": {"event_id": "<uuid>", "session_id": "<hash>", "prompt_hash": "<hash>", "response_id": "<response_id>", "feedback_type": "explicit", "label": "negative", "rationale": null, "annotator_id": null, "created_at": "2025-01-15T10:00:00Z", "metadata_json": {"model_version": "<modellverzió>", "prompt_version": "<promptverzió>", "ui_element": "thumbs_button"}}, "ok": true}, {"msg": "5. Adatkártya és verzió: forrás, dátum, séma, osztályeloszlás, egyezési mérőszám, adatvédelem.", "line": 4, "stage": 4, "rec": {"dataset": "synth-feedback-v1.0", "schema": "feedback-v1", "n": 100, "cohen_kappa": 0.859, "class_counts": {"positive": 66, "negative": 27, "neutral": 7}, "privacy": "csak hash / álnév"}, "ok": true}, {"msg": "6. Export: csak a jóváhagyott, verziózott rekordok kerülnek a tanítóadatba.", "line": 5, "stage": 5, "rec": {"event_id": "<uuid>", "session_id": "<hash>", "prompt_hash": "<hash>", "response_id": "<response_id>", "feedback_type": "explicit", "label": "negative", "rationale": null, "annotator_id": null, "created_at": "2025-01-15T10:00:00Z", "metadata_json": {"model_version": "<modellverzió>", "prompt_version": "<promptverzió>", "ui_element": "thumbs_button"}, "dataset_version": "synth-feedback-v1.0"}, "ok": true}];
const CODE = ["1  eseménykibocsátás   → nyers esemény a kontextussal", "2  normalizálás        → séma szerinti rekord (24.1.5)", "3  címkézés            → explicit normalizálás / implicit szabály / annotátor", "4  minőségellenőrzés   → jsonschema-validálás + kappa-kapu (κ ≥ küszöb)", "5  adatkártya, verzió  → forrás, séma, osztályeloszlás, κ, adatvédelem", "6  export              → csak jóváhagyott, verziózott rekordok", "✗  elutasítva          → guideline javítása, újraannotálás"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const STAGES = ["1. Esemény", "2. Normalizálás", "3. Címkézés", "4. Minőség", "5. Adatkártya", "6. Export"];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 150");
  svg.innerHTML = "";
  const ev = document.getElementById("ev").value, dash = ev === "thumbs_down" ? "" : "7 4";
  STAGES.forEach((t, i) => { const x = 8 + i * 105, on = i === s.stage, done = s.stage === 6 ? i < 3 : i < s.stage;
    if (i === 3) el("path", {d: `M${x},60l46,-30l46,30l-46,30z`, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.3});
    else el("rect", {x, y: 38, width: 92, height: 44, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.3, opacity: s.stage === 6 && i > 3 ? 0.35 : 1});
    el("text", {x: x + 46, y: 64, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, t);
    if (done) el("text", {x: x + 46, y: 31, "text-anchor": "middle", "font-size": 12}, "✓");
    if (s.stage === 6 && i === 3) el("text", {x: x + 46, y: 26, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "✗");
    if (i < 5) el("line", {x1: x + 92, y1: 60, x2: x + 105, y2: 60, stroke: css("--line"), "stroke-width": 1.5, "stroke-dasharray": i === 0 ? dash : ""}); });
  if (s.stage === 6) { el("rect", {x: 300, y: 104, width: 150, height: 34, rx: 6, fill: css("--cellhl"), stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "6 4"});
    el("text", {x: 375, y: 126, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "✗ elutasítva");
    el("line", {x1: 362, y1: 90, x2: 370, y2: 104, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "5 3"}); }
  el("text", {x: 8, y: 11, "font-size": 10.5, fill: css("--muted")}, "ág: " + (ev === "thumbs_down" ? "explicit (folytonos)" : "implicit (szaggatott) – származtatott eseménytípus + szabályrendszer"));
  document.getElementById("rec").textContent = "rekord:\n" + JSON.stringify(s.rec, null, 2);
}
const EVENTS = {"thumbs_down": {"name": "hüvelykujj le (explicit)", "ftype": "explicit", "raw": "thumbs_down", "ui": "thumbs_button", "derive": null, "rule": "explicit jel: thumbs_down → negative", "label": "negative"}, "copy": {"name": "másolás (implicit)", "ftype": "implicit", "raw": "copy", "ui": "copy_button", "derive": "copy_with_code", "rule": "szabály: másolás + kód a válaszban → positive (gyenge jel, alacsony súly)", "label": "positive"}, "regenerate_x3": {"name": "regenerálás ×3 (implicit)", "ftype": "implicit", "raw": "regenerate", "ui": "regenerate_button", "derive": "repeated_regenerate", "rule": "szabály: ismételt regenerálás → negative; annotátori ellenőrzés", "label": "negative"}}, META = {"model_version": "<modellverzi\u00f3>", "prompt_version": "<promptverzi\u00f3>", "ui_element": null}, FIELDS = ["event_id", "session_id", "prompt_hash", "response_id", "feedback_type", "label", "rationale", "annotator_id", "created_at", "metadata_json"];
function buildSteps(evKey, kmin, kappa){
  const e = EVENTS[evKey], meta = Object.assign({}, META, {ui_element: e.ui}), st = [], C = x => x.toFixed(2).replace(".", ","), C3 = x => x.toFixed(3).replace(".", ",");
  const raw = {event: e.raw + (evKey === "regenerate_x3" ? " ×3" : ""), response_id: "<response_id>", session: "<anonim session-hash>", ts: "2025-01-15T10:00:00Z"};
  st.push({msg: `1. Eseménykibocsátás: az alkalmazás rögzíti az interakciót (${e.name}) a kontextussal.`, line: 0, stage: 0, rec: raw, ok: null});
  const norm = {event_id: "<uuid>", session_id: "<hash>", prompt_hash: "<hash>", response_id: "<response_id>", feedback_type: e.ftype, label: null, rationale: null, annotator_id: null, created_at: "2025-01-15T10:00:00Z", metadata_json: meta};
  if (e.derive) norm.metadata_json = Object.assign({}, meta, {derived_event: e.derive});
  st.push({msg: "2. Normalizálás: séma szerinti rekord; a hiányzó mezőket alapértelmezéssel töltjük vagy kizárjuk.", line: 1, stage: 1, rec: norm, ok: null});
  const lab = Object.assign({}, norm, {label: e.label});
  st.push({msg: `3. Címkézés: ${e.rule}.`, line: 2, stage: 2, rec: lab, ok: null});
  const schemaOk = FIELDS.every(k => k in lab), gate = schemaOk && kappa >= kmin;
  st.push({msg: `4. Minőségellenőrzés: séma érvényes? ${schemaOk ? "✓" : "✗"}; κ ≥ ${C(kmin)}? κ = ${C3(kappa)} ${kappa >= kmin ? "✓" : "✗"}` + (gate ? " → a rekord továbbmegy." : " → elutasítva (guideline javítása, újraannotálás)."), line: 3, stage: 3, rec: lab, ok: gate});
  if (gate) {
    st.push({msg: "5. Adatkártya és verzió: forrás, dátum, séma, osztályeloszlás, egyezési mérőszám, adatvédelem.", line: 4, stage: 4, rec: {dataset: "synth-feedback-v1.0", schema: "feedback-v1", n: 100, cohen_kappa: kappa, class_counts: {positive: 66, negative: 27, neutral: 7}, privacy: "csak hash / álnév"}, ok: true});
    st.push({msg: "6. Export: csak a jóváhagyott, verziózott rekordok kerülnek a tanítóadatba.", line: 5, stage: 5, rec: Object.assign({}, lab, {dataset_version: "synth-feedback-v1.0"}), ok: true});
  } else st.push({msg: "Elutasítva: a rekord nem kerül a tanítóadatba; a hibát a guideline javítása és újraannotálás követi.", line: 6, stage: 6, rec: {rejected: lab.event_id, reason: `kappa ${kappa} < ${kmin}`}, ok: false});
  return st;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
const _upd = () => { const km = +document.getElementById("km").value; document.getElementById("kmv").textContent = km.toFixed(2).replace(".", ","); setSteps(buildSteps(document.getElementById("ev").value, km, 0.859)); };
document.getElementById("ev").onchange = _upd; document.getElementById("km").oninput = _upd;
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
