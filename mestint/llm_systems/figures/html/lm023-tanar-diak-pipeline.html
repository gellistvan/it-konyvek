<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanár–diák adatgyártási lánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd;--cell:#fff;--cellhl:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444;--cell:#262626;--cellhl:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg g.st{cursor:pointer}
svg g.st:focus{outline:none}
#meta{margin:6px 0;padding:6px 10px;background:var(--code);min-height:4em}
#meta ul{margin:2px 0 0 18px;padding:0}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><span>Kattints egy lépésre (vagy Tab + Enter).</span>
<button id="it">Iteráció ▶</button><button id="r0">⏮ Hurok elölről</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 425" role="img" aria-label="Nyolclépéses tanár–diák adatgyártási lánc két sorban, a hatrekeszes szűrővel; szaggatott visszacsatoló ív a diák modelltől a tanárhoz."></svg>
<div id="meta" aria-live="polite"></div>
<p class="small">A lépések a fejezet 1–8. alcíme. Az iterációs distinct-2 értékek illusztratívak, nem mértek: a hurok jellegét mutatják.</p>
<script>
const D = {"steps": ["1. Cél és rubrika", "2. Emberi seed", "3. Utasítás-bővítés", "4. Tanár modell", "5. Generálási konfiguráció", "6. Automatikus szűrés", "7. Minőségi szűrés + emberi audit", "8. Split, verzió, adatkártya"], "info": [["Mielőtt bármit generálnánk, pontosan meg kell határozni a feladat bemenetét és kimenetét, a formátumot és a rubrikát; rubrika nélkül a szűrés önkényes.", ["feladat bemenete és kimenete", "elvárt formátum (séma)", "rubrika: jó / elfogadható / rossz", "forrásdokumentum / tudásbázis"]], ["A seed a kis, emberi szakértő által írt utasításhalmaz, amely lefedi a célfeladat eloszlását, a ritka és nehéz eseteket is.", ["source_id minden példához (szivárgásmentes split)", "szerző / szakértő", "lefedett esettípusok"]], ["Parafrázisokat, slot-kitöltéseket, nehézségi változatokat és negatív példákat hozunk létre; a pusztán szinonimás átírás hamis diverzitást ad.", ["bővítés típusa", "szülő seed azonosítója", "bővítő prompt verziója"]], ["A tanár kiválasztásakor nem az abszolút méret a fontos, hanem a feladatbeli minőség, a licenc és az adatvédelmi garancia.", ["modell pontos neve és revíziója", "licenc, a generált adat felhasználhatósága", "futtatás helye (helyi GPU / belső / API)", "költség és késleltetés"]], ["A diverzitás és a használhatóság egyensúlya: do_sample=True, temperature=0,7, top_p=0,95, max_new_tokens=256, seed=42.", ["mintavételi paraméterek", "seed", "hardver, driver, keretrendszer, modellrevízió"]], ["Többrétegű automatikus szűrés: formátum, nyelv, hossz, forráskötés, duplikáció, PII/titok. A szűrési arányt mindig mérjük (pl. 1000 → 600).", ["szűrőszabályok verziója", "rekeszenkénti kiesés és ok", "bemeneti és kimeneti darabszám"]], ["A tartalmi minőséget LLM-as-judge, NLI vagy emberi rubrika ellenőrzi; csak a 4–5 pontos példák mennek tovább, és minden iterációban van emberi audit.", ["bíráló modell és prompt", "pontszámküszöb (4–5)", "auditminta mérete és eredménye"]], ["A splitet forrásdokumentum, felhasználó vagy időbélyeg szerint képezzük; a szintetikus adatot külön jelöljük.", ["split kulcsa (source_id)", "adatkészlet-verzió", "synthetic = True", "reprodukciós csomag: prompt, tanár, seed, szűrők, audit"]]], "filters": ["formátum", "nyelv", "hossz", "forráskötés", "duplikáció", "PII / titok"], "d2": [0.62, 0.55, 0.47, 0.4, 0.34], "prevent": ["friss emberi seed minden körben", "emberi audit minden iterációban", "diverzitásmonitor (distinct-n, embedding)"]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, p){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined&&t!==null)e.textContent=t;(p||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",");
let sel = -1, it = 0;
const BW = 128, BH = 62, PX = i => 8 + (i % 4) * 140, PY = i => i < 4 ? 14 : 150;
function draw(){
  svg.innerHTML = "";
  const defs = el("defs", {}); const m = el("marker", {id: "ah", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 10, markerHeight: 10, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse"}, null, defs);
  el("path", {d: "M0,0L10,5L0,10Z", fill: css("--fg")}, null, m);
  for (let i = 0; i < 7; i++) { if (i === 3) { el("path", {d: `M${PX(3)+BW/2},${PY(3)+BH} C${PX(3)+BW/2},120 ${PX(4)+BW/2},110 ${PX(4)+BW/2},${PY(4)}`, fill: "none", stroke: css("--fg"), "stroke-width": 1.5, "marker-end": "url(#ah)"}); continue; }
    el("line", {x1: PX(i) + BW, y1: PY(i) + BH / 2, x2: PX(i + 1) - 2, y2: PY(i + 1) + BH / 2, stroke: css("--fg"), "stroke-width": 1.5, "marker-end": "url(#ah)"}); }
  D.steps.forEach((t, i) => {
    const g = el("g", {class: "st", tabindex: 0, role: "button", "aria-label": t});
    const h = i === 5 ? 168 : BH, on = i === sel;
    el("rect", {x: PX(i), y: PY(i), width: BW, height: h, rx: 7, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : 1.4}, null, g);
    const words = t.split(" "); let l1 = "", l2 = ""; words.forEach(w => { if ((l1 + " " + w).length <= 19 && !l2) l1 = (l1 ? l1 + " " : "") + w; else l2 = (l2 ? l2 + " " : "") + w; });
    el("text", {x: PX(i) + BW / 2, y: PY(i) + 22, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, l1, g);
    el("text", {x: PX(i) + BW / 2, y: PY(i) + 38, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, l2, g);
    if (i === 5) D.filters.forEach((fl, j) => { el("rect", {x: PX(i) + 8, y: PY(i) + 48 + j * 19, width: BW - 16, height: 16, fill: css("--code"), stroke: css("--line"), "stroke-width": 0.6}, null, g);
      el("text", {x: PX(i) + BW / 2, y: PY(i) + 60 + j * 19, "text-anchor": "middle", "font-size": 11}, fl, g); });
    g.addEventListener("click", () => { sel = i; draw(); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel = i; draw(); svg.querySelectorAll("g.st")[i].focus(); } });
  });
  el("text", {x: PX(5) + BW + 6, y: PY(5) + 160, "font-size": 11, fill: css("--muted")}, "selejt: 1000 → 600");
  // diák + hurok
  el("rect", {x: 566, y: 160, width: 88, height: 42, rx: 7, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 610, y: 178, "text-anchor": "middle", "font-size": 11}, "diák modell");
  el("text", {x: 610, y: 193, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "(finomhangolva)");
  el("line", {x1: PX(7) + BW, y1: PY(7) + BH / 2, x2: 564, y2: 181, stroke: css("--fg"), "stroke-width": 1.5, "marker-end": "url(#ah)"});
  const loopOn = it > 0;
  el("path", {d: `M610,158 C640,90 610,45 ${PX(3)+BW+2},${PY(3)+BH/2}`, fill: "none", stroke: loopOn ? css("--hl2") : css("--fg"), "stroke-width": loopOn ? 4 : 2.6, "stroke-dasharray": "9 5", "marker-end": "url(#ah)"});
  el("text", {x: 612, y: 122, "text-anchor": "end", "font-size": 11, "font-weight": "bold"}, "feedback loop");
  el("text", {x: 612, y: 136, "text-anchor": "end", "font-size": 10.5}, "diák → új tanár");
  // distinct-2 sáv
  el("text", {x: 8, y: 340, "font-size": 12, "font-weight": "bold"}, "distinct-2 iterációnként (illusztratív, nem mért):");
  D.d2.forEach((v, j) => { const act = j <= it, x = 8 + j * 64, hh = act ? v * 100 : 30;
    el("rect", {x: x, y: 418 - hh, width: 40, height: hh, fill: act ? (j === it ? css("--hl2") : css("--cellhl")) : "none", stroke: css("--line"), "stroke-dasharray": act ? "" : "3 3"});
    el("text", {x: x + 20, y: 414 - hh, "text-anchor": "middle", "font-size": 11}, act ? f(v, 2) : "?");
  });
  el("text", {x: 345, y: 360, "font-size": 11, "font-weight": "bold"}, "Megelőzés:");
  D.prevent.forEach((p, j) => el("text", {x: 345, y: 378 + j * 16, "font-size": 11}, "• " + p));
  document.getElementById("status").textContent = it === 0 ? "0. kör: emberi seed + tanár. distinct-2 = " + f(D.d2[0], 2) + "."
    : `${it}. kör: a diák lett a tanár; distinct-2 = ${f(D.d2[it], 2)} (${f(100 * (D.d2[it] / D.d2[0] - 1), 0)}% az induláshoz képest) – a variancia csökken, ideje leállni és friss emberi seedet keverni.`;
  const meta = document.getElementById("meta");
  if (sel < 0) meta.innerHTML = '<span class="small">Válassz egy lépést: itt jelenik meg a fejezet mondata és a rögzítendő metaadatok.</span>';
  else meta.innerHTML = `<b>${D.steps[sel]}</b><br>${D.info[sel][0]}<br><span class="small">Rögzítendő:</span><ul>` + D.info[sel][1].map(x => `<li>${x}</li>`).join("") + "</ul>";
}
document.getElementById("it").onclick = () => { it = Math.min(D.d2.length - 1, it + 1); draw(); };
document.getElementById("r0").onclick = () => { it = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
