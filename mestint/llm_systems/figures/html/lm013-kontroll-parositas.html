<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A nem egyenletes kontroll párosításai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="sh" type="checkbox" checked onchange="toggle()"> shift (eltolás)</label><label><input id="mp" type="checkbox" checked onchange="toggle()"> padding-maszk</label><svg width="0" height="0" style="position:absolute"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#888" stroke-width="2"/></pattern></defs></svg></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A probs 4×3-as táblája; lépésenként kiemelődnek a (pozíció, cél) cellák és a −ln p értékek, a végén az átlag."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kapcsolók a manual_loss shift és mask_padding paraméterei; mindkettő bekapcsolva 1,844, shift nélkül 1,073, padding-maszk nélkül 1,304, mindkettő nélkül 1,207. A 5.1.8 labor kontrollpéldája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 0, "line": 2, "msg": "shift: az i. pozíció logitja az (i+1). tokent jósolja; a padding target −100 (kizárva)."}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 1, "line": 4, "msg": "0. pozíció → 1. token: p = 0,25, −ln p = 1,386; összeg 1,386 (1 aktív)", "s": 1.3862943611198906, "n": 1}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 2, "line": 4, "msg": "1. pozíció → 2. token: p = 0,10, −ln p = 2,303; összeg 3,689 (2 aktív)", "s": 3.688879454113936, "n": 2}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 3, "line": 1, "msg": "2. pozíció → 0. token: a target −100 (padding), kimarad az átlagból", "s": 3.688879454113936, "n": 2}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 3, "line": 4, "s": 3.688879454113936, "n": 2, "msg": "Átlag: 3,689 / 2 = 1,844  (helyes érték)"}];
const CODE = ["labels = input_ids.clone()", "if mask_padding: labels[attention_mask == 0] = -100", "if shift: logits_, labels_ = logits[:, :-1], labels[:, 1:]", "else:     logits_, labels_ = logits, labels", "cross_entropy(logits_, labels_, ignore_index=-100, reduction=\"mean\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PR = [[0.5, 0.25, 0.25], [0.1, 0.8, 0.1], [0.8, 0.1, 0.1], [0.2, 0.4, 0.4]], ALL = {"11": [{"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 0, "line": 2, "msg": "shift: az i. pozíció logitja az (i+1). tokent jósolja; a padding target −100 (kizárva)."}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 1, "line": 4, "msg": "0. pozíció → 1. token: p = 0,25, −ln p = 1,386; összeg 1,386 (1 aktív)", "s": 1.3862943611198906, "n": 1}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 2, "line": 4, "msg": "1. pozíció → 2. token: p = 0,10, −ln p = 2,303; összeg 3,689 (2 aktív)", "s": 3.688879454113936, "n": 2}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 3, "line": 1, "msg": "2. pozíció → 0. token: a target −100 (padding), kimarad az átlagból", "s": 3.688879454113936, "n": 2}, {"sh": true, "mp": true, "pairs": [[0, 1, true], [1, 2, true], [2, 0, false]], "k": 3, "line": 4, "s": 3.688879454113936, "n": 2, "msg": "Átlag: 3,689 / 2 = 1,844  (helyes érték)"}], "10": [{"sh": true, "mp": false, "pairs": [[0, 1, true], [1, 2, true], [2, 0, true]], "k": 0, "line": 2, "msg": "shift: az i. pozíció logitja az (i+1). tokent jósolja; a padding target nincs maszkolva."}, {"sh": true, "mp": false, "pairs": [[0, 1, true], [1, 2, true], [2, 0, true]], "k": 1, "line": 4, "msg": "0. pozíció → 1. token: p = 0,25, −ln p = 1,386; összeg 1,386 (1 aktív)", "s": 1.3862943611198906, "n": 1}, {"sh": true, "mp": false, "pairs": [[0, 1, true], [1, 2, true], [2, 0, true]], "k": 2, "line": 4, "msg": "1. pozíció → 2. token: p = 0,10, −ln p = 2,303; összeg 3,689 (2 aktív)", "s": 3.688879454113936, "n": 2}, {"sh": true, "mp": false, "pairs": [[0, 1, true], [1, 2, true], [2, 0, true]], "k": 3, "line": 4, "msg": "2. pozíció → 0. token: p = 0,80, −ln p = 0,223; összeg 3,912 (3 aktív)", "s": 3.9120230054281455, "n": 3}, {"sh": true, "mp": false, "pairs": [[0, 1, true], [1, 2, true], [2, 0, true]], "k": 3, "line": 4, "s": 3.9120230054281455, "n": 3, "msg": "Átlag: 3,912 / 3 = 1,304  (eltér a helyes 1,844-tól)"}], "01": [{"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 0, "line": 3, "msg": "eltolás nélkül: az i. pozíció a saját tokenjét kapja célnak; a padding target −100 (kizárva)."}, {"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 1, "line": 4, "msg": "0. pozíció → 0. token: p = 0,50, −ln p = 0,693; összeg 0,693 (1 aktív)", "s": 0.6931471805599453, "n": 1}, {"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 2, "line": 4, "msg": "1. pozíció → 1. token: p = 0,80, −ln p = 0,223; összeg 0,916 (2 aktív)", "s": 0.916290731874155, "n": 2}, {"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 3, "line": 4, "msg": "2. pozíció → 2. token: p = 0,10, −ln p = 2,303; összeg 3,219 (3 aktív)", "s": 3.2188758248682006, "n": 3}, {"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 4, "line": 1, "msg": "3. pozíció → 0. token: a target −100 (padding), kimarad az átlagból", "s": 3.2188758248682006, "n": 3}, {"sh": false, "mp": true, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, false]], "k": 4, "line": 4, "s": 3.2188758248682006, "n": 3, "msg": "Átlag: 3,219 / 3 = 1,073  (eltér a helyes 1,844-tól)"}], "00": [{"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 0, "line": 3, "msg": "eltolás nélkül: az i. pozíció a saját tokenjét kapja célnak; a padding target nincs maszkolva."}, {"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 1, "line": 4, "msg": "0. pozíció → 0. token: p = 0,50, −ln p = 0,693; összeg 0,693 (1 aktív)", "s": 0.6931471805599453, "n": 1}, {"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 2, "line": 4, "msg": "1. pozíció → 1. token: p = 0,80, −ln p = 0,223; összeg 0,916 (2 aktív)", "s": 0.916290731874155, "n": 2}, {"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 3, "line": 4, "msg": "2. pozíció → 2. token: p = 0,10, −ln p = 2,303; összeg 3,219 (3 aktív)", "s": 3.2188758248682006, "n": 3}, {"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 4, "line": 4, "msg": "3. pozíció → 0. token: p = 0,20, −ln p = 1,609; összeg 4,828 (4 aktív)", "s": 4.828313737302301, "n": 4}, {"sh": false, "mp": false, "pairs": [[0, 0, true], [1, 1, true], [2, 2, true], [3, 0, true]], "k": 4, "line": 4, "s": 4.828313737302301, "n": 4, "msg": "Átlag: 4,828 / 4 = 1,207  (eltér a helyes 1,844-tól)"}]};
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const x0 = 120, y0 = 40, w = 70, h = 46, shown = s.pairs.slice(0, s.k);
  el("text", {x: x0 + 1.5 * w, y: 22, "text-anchor": "middle", "font-size": 13}, "token (oszlop)");
  el("text", {x: 20, y: 22, "font-size": 13}, "pozíció");
  for (let j = 0; j < 3; j++) el("text", {x: x0 + j * w + w / 2, y: y0 - 4, "text-anchor": "middle", "font-size": 13}, String(j));
  for (let i = 0; i < 4; i++) {
    el("text", {x: x0 - 12, y: y0 + i * h + h / 2 + 5, "text-anchor": "end", "font-size": 13}, i + ".");
    for (let j = 0; j < 3; j++) {
      const p = shown.find(q => q[0] === i && q[1] === j), on = p && p[2], off = p && !p[2];
      el("rect", {x: x0 + j * w, y: y0 + i * h, width: w, height: h, fill: off ? "url(#hatch)" : on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 4 : 1});
      el("text", {x: x0 + j * w + w / 2, y: y0 + i * h + h / 2 + 5, "text-anchor": "middle", "font-size": 14, "font-weight": on ? "bold" : "normal"}, PR[i][j].toFixed(2).replace(".", ","));
    }
    const p = shown.find(q => q[0] === i);
    if (p) el("text", {x: x0 + 3 * w + 10, y: y0 + i * h + h / 2 + 5, "font-size": 13, fill: p[2] ? css("--fg") : css("--muted")},
              "→ " + p[1] + (p[2] ? ": −ln p = " + (-Math.log(PR[i][p[1]])).toFixed(3).replace(".", ",") : ": kizárva (−100)"));
  }
  const mean = s.n ? (s.s / s.n).toFixed(3).replace(".", ",") : "–";
  el("text", {x: x0, y: y0 + 4 * h + 26, "font-size": 13, "font-weight": "bold"}, s.n ? `átlag eddig: ${mean} (${s.n} aktív)` : "");
  el("text", {x: 20, y: 280, "font-size": 12, fill: css("--muted")}, "ids = [0, 1, 2, 0], mask = [1, 1, 1, 0] · vastag keret = használt cella · sraffozott = maszkolt target");
}
function toggle(){
  const k = (document.getElementById("sh").checked ? "1" : "0") + (document.getElementById("mp").checked ? "1" : "0");
  setSteps(ALL[k]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
