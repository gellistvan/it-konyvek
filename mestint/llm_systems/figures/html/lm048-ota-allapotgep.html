<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTA-állapotgép és A/B slotok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="setSteps(DEFSTEPS)">A labor három tesztje</button><button onclick="scen('hash', 'v2', 'Hash meghamisítása')">hash meghamisítása</button><button onclick="scen('sig', 'v2', 'Aláírás meghamisítása')">aláírás meghamisítása</button><button onclick="scen('downgrade', 'v0', 'Downgrade (T-L5-071 után)')">régebbi verzió (downgrade)</button><button onclick="scen('health', 'v2', 'Egészségpróba bukása')">egészségpróba bukása</button><button onclick="scen('interrupt', 'v2', 'Megszakítás')">megszakítás írás közben</button><button onclick="scen('active_hash', 'v2', 'Későbbi hiba')">későbbi hiba → rollback</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Állapotgép: a hibaágak FAILED-be visznek, az aktív slot csak sikeres egészségpróba után vált; a megszakított írás nem aktiválódik. Mellette az A és B slot tartalma és a device.log."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet attempt_update és recover_interrupted_update logikája alapján. A version_not_newer ág és a downgrade-gomb a T-L5-071 javítását (frissességellenőrzés) feltételezi; a jelenlegi kódban ez az ellenőrzés hiányzik. A gombok az 1. teszt utáni állapotból (aktív B, v1) indulnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiinduló állapot: üres eszköz, aktív slot A (üres), IDLE.", "line": -1, "st": "IDLE", "active": "A", "slots": {"A": null, "B": null}, "pending": null, "log": [], "edge": null}, {"msg": "1. teszt – letöltés: v1", "line": 0, "st": "DOWNLOADING", "active": "A", "slots": {"A": null, "B": null}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – hash egyezik a manifesttel", "line": 1, "st": "VERIFYING", "active": "A", "slots": {"A": null, "B": null}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – az Ed25519-aláírás érvényes", "line": 2, "st": "VERIFYING", "active": "A", "slots": {"A": null, "B": null}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – írás az inaktív B slotba (az aktív A érintetlen)", "line": 4, "st": "INSTALLING", "active": "A", "slots": {"A": null, "B": {"v": "v1", "partial": true}}, "pending": "B", "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – egészségpróba sikeres a B sloton", "line": 5, "st": "HEALTH_CHECK", "active": "A", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": "B", "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – pointer átfordítva: aktív = B", "line": 6, "st": "HEALTH_CHECK", "active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}"], "edge": null}, {"msg": "1. teszt – ACTIVE: v1 a B sloton", "line": 7, "st": "ACTIVE", "active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}"], "edge": null}, {"msg": "2. teszt – letöltés: v2", "line": 0, "st": "DOWNLOADING", "active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}"], "edge": null}, {"msg": "2. teszt – hash egyezik a manifesttel", "line": 1, "st": "VERIFYING", "active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}"], "edge": null}, {"msg": "2. teszt – az Ed25519-aláírás érvényes", "line": 2, "st": "VERIFYING", "active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}"], "edge": null}, {"msg": "2. teszt – írás az inaktív A slotba (az aktív B érintetlen)", "line": 4, "st": "INSTALLING", "active": "B", "slots": {"A": {"v": "v2", "partial": true}, "B": {"v": "v1", "partial": false}}, "pending": "A", "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}"], "edge": null}, {"msg": "2. teszt – FAILED: health_check_failed; az aktív slot (B) érintetlen.", "line": 5, "st": "FAILED", "active": "B", "slots": {"A": {"v": "v2", "partial": false}, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}"], "edge": "health_check_failed"}, {"msg": "3. teszt – letöltés: v3", "line": 0, "st": "DOWNLOADING", "active": "B", "slots": {"A": {"v": "v2", "partial": false}, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}", "{\"state\": \"downloading\", \"artifact\": \"v3\"}"], "edge": null}, {"msg": "3. teszt – hash egyezik a manifesttel", "line": 1, "st": "VERIFYING", "active": "B", "slots": {"A": {"v": "v2", "partial": false}, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}", "{\"state\": \"downloading\", \"artifact\": \"v3\"}"], "edge": null}, {"msg": "3. teszt – az Ed25519-aláírás érvényes", "line": 2, "st": "VERIFYING", "active": "B", "slots": {"A": {"v": "v2", "partial": false}, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}", "{\"state\": \"downloading\", \"artifact\": \"v3\"}"], "edge": null}, {"msg": "3. teszt – írás az inaktív A slotba (az aktív B érintetlen)", "line": 4, "st": "INSTALLING", "active": "B", "slots": {"A": {"v": "v3", "partial": true}, "B": {"v": "v1", "partial": false}}, "pending": "A", "log": ["{\"state\": \"active\", \"version\": \"v1\"}", "{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}", "{\"state\": \"downloading\", \"artifact\": \"v3\"}"], "edge": null}, {"msg": "3. teszt – megszakítás írás közben → újraindítás, recover_interrupted_update(): a pointer dönt, aktív marad B; a félkész A nem aktiválódik.", "line": 8, "st": "IDLE", "active": "B", "slots": {"A": {"v": "v3", "partial": true}, "B": {"v": "v1", "partial": false}}, "pending": null, "log": ["{\"state\": \"downloading\", \"artifact\": \"v2\"}", "{\"state\": \"failed\", \"reason\": \"health_check_failed\"}", "{\"state\": \"downloading\", \"artifact\": \"v3\"}", "{\"event\": \"restart\", \"recover\": \"pending_slot=None\"}"], "edge": null}];
const CODE = ["state = DOWNLOADING; log(artifact=version)", "state = VERIFYING; if sha256(file) != manifest.sha256: FAILED, reason='hash_mismatch'", "if not verify_manifest(signature): FAILED, reason='signature_invalid'", "[T-L5-071 után] if version <= aktív verzió: FAILED, reason='version_not_newer'", "state = INSTALLING; pending_slot = inactive; atomic_write(slot_path(inactive))", "state = HEALTH_CHECK; if not health_check(inactive): FAILED, reason='health_check_failed'", "active_slot = inactive  # pointer; if sha256(aktív) != manifest: ROLLED_BACK, reason='active_hash_mismatch'", "active_sha256 = manifest.sha256; state = ACTIVE; log(version)", "recover_interrupted_update(): pending_slot = None  # a pointer dönt"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODE = {IDLE: [90, 40], DOWNLOADING: [90, 92], VERIFYING: [90, 144], INSTALLING: [90, 206], HEALTH_CHECK: [90, 262], ACTIVE: [90, 322], FAILED: [300, 200], ROLLED_BACK: [300, 322]};
function arrow(x1, y1, x2, y2, hot, dash){ el("line", {x1, y1, x2, y2, stroke: hot ? css("--hl2") : css("--line"), "stroke-width": hot ? 3 : 1.2, "stroke-dasharray": dash ? "6 4" : ""});
  const a = Math.atan2(y2 - y1, x2 - x1); el("path", {d: `M${x2},${y2}L${x2 - 9 * Math.cos(a - 0.4)},${y2 - 9 * Math.sin(a - 0.4)}L${x2 - 9 * Math.cos(a + 0.4)},${y2 - 9 * Math.sin(a + 0.4)}Z`, fill: hot ? css("--hl2") : css("--line")}); }
function render(s){
  svg.setAttribute("viewBox", "0 0 720 400"); svg.innerHTML = "";
  [["IDLE", "DOWNLOADING"], ["DOWNLOADING", "VERIFYING"], ["VERIFYING", "INSTALLING"], ["INSTALLING", "HEALTH_CHECK"], ["HEALTH_CHECK", "ACTIVE"]].forEach(([p, q]) =>
    arrow(NODE[p][0], NODE[p][1] + 14, NODE[q][0], NODE[q][1] - 18, false, false));
  const R1 = ["hash_mismatch", "signature_invalid", "version_not_newer"].includes(s.edge), R2 = s.edge === "health_check_failed", R3 = s.edge === "active_hash_mismatch";
  arrow(160, 144, 226, 194, R1, true); arrow(160, 262, 226, 208, R2, true); arrow(164, 322, 222, 322, R3, true);
  [["hash_mismatch", 0], ["signature_invalid", 1], ["version_not_newer (T-L5-071 után)", 2], ["health_check_failed", 3]].forEach(([t, i]) => {
    const hot = s.edge && t.startsWith(s.edge); el("text", {x: 236, y: 232 + i * 15, "font-size": 10.5, "font-family": "monospace", "font-weight": hot ? "bold" : "normal", fill: hot ? css("--hl2") : css("--fg")}, "reason: " + t); });
  el("text", {x: 236, y: 354, "font-size": 10.5, "font-family": "monospace", "font-weight": R3 ? "bold" : "normal", fill: R3 ? css("--hl2") : css("--fg")}, "reason: active_hash_mismatch");
  el("text", {x: 100, y: 181, "font-size": 10, fill: css("--muted")}, "írás az inaktív slotba");
  el("text", {x: 100, y: 298, "font-size": 10, fill: css("--muted")}, "pointer átfordítva");
  Object.entries(NODE).forEach(([n, [x, y]]) => { const on = s.st === n, fin = ["ACTIVE", "FAILED", "ROLLED_BACK"].includes(n);
    if (fin) el("rect", {x: x - 74, y: y - 17, width: 148, height: 34, rx: 9, fill: "none", stroke: css("--line"), "stroke-width": 1});
    el("rect", {x: x - 70, y: y - 13, width: 140, height: 26, rx: 7, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12, "font-family": "monospace", "font-weight": on ? "bold" : "normal"}, n); });
  el("defs", {}).innerHTML = `<pattern id="hp" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--muted")}" stroke-width="2"/></pattern>`;
  el("text", {x: 430, y: 30, "font-size": 13, "font-weight": "bold"}, "A/B slotok");
  ["A", "B"].forEach((sl, j) => { const x = 430 + j * 140, c = s.slots[sl], act = s.active === sl, pend = s.pending === sl;
    el("rect", {x, y: 44, width: 120, height: 60, rx: 6, fill: c && c.partial ? "url(#hp)" : css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": act ? 4 : 1.2});
    el("rect", {x: x + 20, y: 62, width: 80, height: 24, fill: css("--bg"), opacity: 0.85});
    el("text", {x: x + 60, y: 79, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, `${sl}: ${c ? c.v : "üres"}`);
    el("text", {x: x + 60, y: 122, "text-anchor": "middle", "font-size": 11.5, "font-weight": act ? "bold" : "normal"}, act ? "▶ aktív" : pend ? "írás alatt (pending)" : c && c.partial ? "félkész" : "inaktív"); });
  el("text", {x: 430, y: 160, "font-size": 13, "font-weight": "bold"}, "device.log (utolsó 4)");
  (s.log || []).forEach((l, i) => el("text", {x: 430, y: 182 + i * 18, "font-size": 10.5, "font-family": "monospace"}, l.length > 44 ? l.slice(0, 43) + "…" : l));
}
function sim(dev, ver, fault, title){
  const d = JSON.parse(JSON.stringify(dev)), out = [];
  const snap = (msg, line, edge) => out.push({msg: title + msg, line, st: d.state, active: d.active, slots: JSON.parse(JSON.stringify(d.slots)), pending: d.pending, log: d.log.slice(-4), edge: edge || null});
  const fail = (reason, line, st) => { d.state = st || "FAILED"; d.log.push(`{"state": "${d.state.toLowerCase()}", "reason": "${reason}"}`); snap(`${d.state}: ${reason}; az aktív slot (${d.active}) érintetlen.`, line, reason); return out; };
  d.state = "DOWNLOADING"; d.log.push(`{"state": "downloading", "artifact": "${ver}"}`); snap(`letöltés: ${ver}`, 0);
  d.state = "VERIFYING"; if (fault === "hash") return fail("hash_mismatch", 1); snap("hash egyezik a manifesttel", 1);
  if (fault === "sig") return fail("signature_invalid", 2); snap("az Ed25519-aláírás érvényes", 2);
  if (fault === "downgrade") return fail("version_not_newer", 3);
  const ina = d.active === "A" ? "B" : "A"; d.state = "INSTALLING"; d.pending = ina; d.slots[ina] = {v: ver, partial: true};
  snap(`írás az inaktív ${ina} slotba (az aktív ${d.active} érintetlen)`, 4);
  if (fault === "interrupt") { d.state = "IDLE"; d.pending = null; d.log.push('{"event": "restart", "recover": "pending_slot=None"}');
    snap(`megszakítás írás közben → újraindítás, recover_interrupted_update(): a pointer dönt, aktív marad ${d.active}; a félkész ${ina} nem aktiválódik.`, 8); return out; }
  d.slots[ina].partial = false; d.state = "HEALTH_CHECK";
  if (fault === "health") { d.pending = null; return fail("health_check_failed", 5); }
  snap(`egészségpróba sikeres a ${ina} sloton`, 5);
  const old = d.active; d.active = ina; d.pending = null;
  if (fault === "active_hash") { d.active = old; return fail("active_hash_mismatch", 6, "ROLLED_BACK"); }
  snap(`pointer átfordítva: aktív = ${ina}`, 6); d.state = "ACTIVE"; d.log.push(`{"state": "active", "version": "${ver}"}`); snap(`ACTIVE: ${ver} a ${ina} sloton`, 7); return out; }
const AFTER1 = {"active": "B", "slots": {"A": null, "B": {"v": "v1", "partial": false}}, "actver": "v1", "state": "IDLE", "log": ["{\"state\": \"downloading\", \"artifact\": \"v1\"}", "{\"state\": \"active\", \"version\": \"v1\"}"], "pending": null}, DEFSTEPS = JSON.parse(JSON.stringify(STEPS));
function scen(f, ver, name){ const base = {msg: `${name} – kiindulás az 1. teszt után: aktív B (v1), IDLE.`, line: -1, st: "IDLE", active: AFTER1.active, slots: AFTER1.slots, pending: null, log: AFTER1.log.slice(-4), edge: null};
  const d = JSON.parse(JSON.stringify(AFTER1)); d.state = "IDLE"; setSteps([base].concat(sim(d, ver, f, name + " – "))); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
