<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatflywheel kapukkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><div id="ginfo" class="small" aria-live="polite" style="min-height:2.6em">Kapuinformáció: kattints egy rombuszra.</div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Körbe rendezett hat szakasz: adatgyűjtés, annotáció és minőségellenőrzés, tanítás és kiértékelés, telepítés és üzemeltetés, használat és visszajelzés, visszajelzés-feldolgozás; négy rombusz alakú kapu (K1–K4) a jóváhagyókkal, rollback-visszanyíl."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.4.1 szakaszai és döntési pontjai, a 24.4.4 trace- és naplólistája, a 24.4.5 minőségi kapuja. Kockázatarányos: alacsony kockázatnál heti ciklus, orvosi triázsnál audit + klinikai validáció. Fix szerkezeti vázlat, nincs mért adat.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stage": 4, "gate": null, "msg": "1/6 Használat és visszajelzés: az ügyintéző átcímkéz egy ticketet (nyers visszajelzés a v3 modellre); trace-azonosító létrejön.", "line": -1}, {"stage": 5, "gate": "K4", "msg": "2/6 Visszajelzés-feldolgozás: pszeudonimizálás (az e-mail helyett véletlen azonosító); K4: a terméktulajdonos és a megfelelőségi szakember jóváhagyja a tanítóadatkénti felhasználást.", "line": -1}, {"stage": 0, "gate": "K1", "msg": "3/6 Adatgyűjtés: csak a feladathoz szükséges mezők, verziózott adatkészlet; K1: a domain-szakértő engedi tovább az annotációra.", "line": -1}, {"stage": 1, "gate": "K2", "msg": "4/6 Annotáció: címkézés, dupla annotáció, egyetértési mutató; K2 minőségi kapu: az alacsony egyetértésű minta kiesik, a többi a tanítópélda új verziója.", "line": -1}, {"stage": 2, "gate": "K3", "msg": "5/6 Tanítás és kiértékelés: rögzített seed és konfiguráció, a validációs F1 legalább a korábbi; K3: üzemeltető + jogi aláírás (nincs közvetlen azonosító a tanítóhalmazban).", "line": -1}, {"stage": 3, "gate": null, "msg": "6/6 Telepítés: a v4 modell fut, a trace lezárul (visszajelzés → példa → konfiguráció → kiértékelés → telepített v4); romlásnál rollback a v3-ra.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GEO = {"pos": [[-4.75, 1.75], [0.0, 1.75], [4.75, 1.75], [4.75, -1.75], [0.0, -1.75], [-4.75, -1.75]], "bw": 3.2, "bh": 1.35, "edges": [[[-3.09, 1.75], [-1.66, 1.75]], [[1.66, 1.75], [3.09, 1.75]], [[4.75, 1.015], [4.75, -1.015]], [[3.09, -1.75], [1.66, -1.75]], [[-1.66, -1.75], [-3.09, -1.75]], [[-4.75, -1.015], [-4.75, 1.015]]], "gpos": {"K1": [-2.375, 1.75], "K2": [2.375, 1.75], "K3": [4.75, 0.0], "K4": [-4.75, 0.0]}, "names": ["Adatgyűjtés", "Annotáció + minőség", "Tanítás + kiértékelés", "Telepítés + üzem", "Használat + visszajelzés", "Visszajelzés-feldolg."], "roles": ["adatmérnök", "annotátorok + domain-szakértő", "ML-mérnök", "üzemeltető mérnök", "felhasználók + terméktulajdonos", "adatmérnök"], "gates": {"K1": {"who": "domain-szakértő", "label": "gyűjtés → annotáció", "log": "ki mikor gyűjtött be visszajelzést", "trace": "a visszajelzés nyers azonosítója; a modell verziója, amelyre a visszajelzés érkezett"}, "K2": {"who": "domain-szakértő (minőségi kapu)", "label": "minőségi kapu: szűrés, címkézés, egyetértés", "log": "ki fűzött hozzá címkét", "trace": "az annotált tanítópélda verziója (az alacsony egyetértésű minta eldobva)"}, "K3": {"who": "üzemeltető + jogi", "label": "tanítás → telepítés", "log": "ki indította el a tanítást; milyen validációs metrikát mért a ciklus; ki hagyta jóvá a telepítést", "trace": "a tanítási konfiguráció és a seed; a kiértékelési eredmények; a telepített modell verziója"}, "K4": {"who": "terméktulajdonos + megfelelőség", "label": "visszajelzés → tanítóadat", "log": "ki mikor gyűjtött be visszajelzést (a felhasználás jóváhagyásával együtt)", "trace": "a visszajelzés nyers (pszeudonimizált) azonosítója; a modell verziója"}}, "rollback": {"log": "ki és mikor döntött a rollback mellett", "trace": "a visszaállított modell verziója"}};
let GSEL = null;
function gateInfo(id){
  GSEL = id; const box = document.getElementById("ginfo");
  if (id === "RB") { box.innerHTML = `<b>Rollback</b> – naplózandó: ${GEO.rollback.log}; trace: ${GEO.rollback.trace}.`; show(k); return; }
  const g = GEO.gates[id];
  box.innerHTML = `<b>${id}</b> (${g.label}) – <b>jóváhagyó:</b> ${g.who}; <b>naplózandó esemény:</b> ${g.log}; <b>trace-mezők:</b> ${g.trace}.`;
  show(k);
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 300");
  const X = v => 320 + v * 45, Y = v => 160 - v * 45;
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  GEO.edges.forEach(([a, b]) => el("line", {x1: X(a[0]), y1: Y(a[1]), x2: X(b[0]), y2: Y(b[1]), stroke: css("--fg"), "stroke-width": 1.6, "marker-end": "url(#ah)"}));
  const p3 = GEO.pos[3], p2 = GEO.pos[2];
  el("path", {d: `M ${X(p3[0] + GEO.bw / 2)} ${Y(p3[1])} Q ${X(p3[0] + GEO.bw / 2 + 1.8)} ${Y(0)} ${X(p2[0] + GEO.bw / 2)} ${Y(p2[1])}`, fill: "none", stroke: css("--fg"), "stroke-dasharray": "6 4", "stroke-width": 1.4, "marker-end": "url(#ah)"});
  const rb = el("text", {x: X(8.05), y: Y(0) + 4, "font-size": 11, "font-style": "italic", "text-anchor": "middle", style: "cursor:pointer", tabindex: 0, role: "button"}, "rollback ▸");
  rb.addEventListener("click", () => gateInfo("RB")); rb.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") gateInfo("RB"); });
  GEO.pos.forEach((p, i) => {
    const on = s.stage === i;
    el("rect", {x: X(p[0] - GEO.bw / 2), y: Y(p[1] + GEO.bh / 2), width: GEO.bw * 45, height: GEO.bh * 45, rx: 7, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.2 : 1.2});
    el("text", {x: X(p[0]), y: Y(p[1]) - 3, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, `${i + 1}. ${GEO.names[i]}`);
    el("text", {x: X(p[0]), y: Y(p[1]) + 15, "text-anchor": "middle", "font-size": 9.5, "font-style": "italic", fill: css("--muted")}, GEO.roles[i]);
  });
  Object.entries(GEO.gpos).forEach(([id, p]) => {
    const x = X(p[0]), y = Y(p[1]), r = id === "K2" ? 17 : 14, on = s.gate === id || GSEL === id;
    const d = el("polygon", {points: `${x},${y - r} ${x + r * 1.25},${y} ${x},${y + r} ${x - r * 1.25},${y}`, fill: on ? css("--hl2") : (id === "K2" ? css("--cellhl") : css("--bg")), stroke: css("--fg"), "stroke-width": id === "K2" ? 3.2 : 2.2, style: "cursor:pointer", tabindex: 0, role: "button", "aria-label": `${id} kapu: ${GEO.gates[id].label}`});
    d.addEventListener("click", () => gateInfo(id)); d.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") gateInfo(id); });
    el("text", {x: x, y: y + 4.5, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold", "pointer-events": "none"}, id);
  });
  el("text", {x: X(0), y: 140, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "adatflywheel");
  el("text", {x: X(0), y: 158, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "kattints egy kapura (K1–K4) vagy a rollbackre");
  if (s.gate) { const g = GEO.gates[s.gate]; el("text", {x: X(0), y: 178, "text-anchor": "middle", "font-size": 11.5}, `${s.gate}: jóváhagy – ${g.who}`); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
