<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Közös minta: négy emberi beavatkozási pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><div role="group" aria-label="Ág kiválasztása">Ág: <label><input type="radio" name="br" checked onchange="pickBranch('A')"> groundedness 0,9 → kiadás</label> <label><input type="radio" name="br" onchange="pickBranch('B')"> groundedness 0,5 → ③ emberi jóváhagyás</label></div><div style="flex-basis:100%;border:1px solid var(--line);padding:4px 8px" aria-live="polite"><b id="ititle"></b> <span id="tabs" role="group" aria-label="Szakterület"><button onclick="pickDom(0)">egészségügy</button> <button onclick="pickDom(1)">jog</button> <button onclick="pickDom(2)">pénzügy</button> </span><div id="isum"></div><div id="iex" class="small"></div></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Adatfolyam balról jobbra: szakértői irányelv és annotáció, verziózott korpusz, retriever időszűrővel, hivatkozáskényszeres generátor, validátor, kiadás. Négy emberi pont: 1 az annotációnál, 2 a retriever és a generátor között, 3 a validátor és a kiadás között, 4 a kiadás után; szaggatott visszacsatolás az annotáció és a DPO-adathalmaz felé."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus ábra, nem mérés. A dobozokra és a számozott pontokra kattintva (vagy Enterrel) megjelenik az összefoglaló és a szakterületi példa. A kérdés útja szemléltető: a chunkszám, a dátum és a 0,8-as groundedness-küszöb nem a fejezetből származó mért érték.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"hl": ["ann", "h1"], "line": -1, "msg": "Előkészítés (offline): ① a szakértői irányelv és annotáció adja a korpusz taxonómiáját és a validátor szabályait. Kérdés: „Hatályos-e a Ptk. 6:58. §-ának idézett szövege?”"}, {"hl": ["kor", "ret"], "line": 0, "msg": "retriever: 3 chunk, időszűrő: as_of=2026-11-18 (csak a hatályos verziók: valid_from ≤ as_of < valid_to)"}, {"hl": ["h2"], "line": 1, "msg": "② kontextus-ellenőrzés: a 3 chunk ugyanarra a hatályos szövegváltozatra mutat, nincs ellentmondás → nem kell operátor"}, {"hl": ["gen"], "line": 2, "msg": "generátor: válasz a [chunk-1] és [chunk-3] hivatkozással"}, {"hl": ["val"], "line": 3, "msg": "validátor: a hivatkozások léteznek, groundedness 0,9 ≥ 0,8 (szemléltető küszöb) → kiadás"}, {"hl": ["out"], "line": 4, "msg": "kiadás a felhasználónak (az alacsony kockázati osztály miatt nincs kötelező ③ jóváhagyás)"}, {"hl": ["h4"], "line": 4, "msg": "④ monitorozás: a válasz és a hivatkozások naplózva; felhasználói jelzés vagy riasztás esetén eszkaláció"}];
const CODE = ["kontextus = retriever(kérdés, as_of=ma, szűrő=taxonómia)", "ha a kontextus elégtelen vagy ellentmondó: ② operátorhoz", "válasz = generátor(kontextus, kötelező hivatkozással)", "ha groundedness < küszöb vagy kockázati osztály magas: ③ emberi jóváhagyás", "kiadás; ④ monitorozás, eszkaláció", "elutasítás oka → ① annotáció, DPO-párok (4.3)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GEO = {"N": {"ann": [0.15, 3.0, 2.3, 1.75, "Szakértői\nirányelv +\nannotáció (2.1)", "box"], "kor": [2.6999999999999997, 3.0, 2.3, 1.75, "Verziózott\nkorpusz:\nvalid_from/to,\ntaxonómia\n(2.3, 3.1)", "data"], "ret": [5.25, 3.0, 2.3, 1.75, "Retriever\nBM25/dense\n+ időszűrő", "box"], "gen": [7.8, 3.0, 2.3, 1.75, "Generátor:\nhivatkozás-\nkényszeres\nprompt", "box"], "val": [10.35, 3.0, 2.3, 1.75, "Validátor:\nhivatkozás-\nellenőrzés,\ngroundedness,\nNLI", "box"], "out": [12.9, 3.0, 2.3, 1.75, "Kiadás a\nfelhasználónak", "box"], "dpo": [5.0, 0.3, 3.0, 1.2, "DPO-/finomhangoló\nadathalmaz (4.3)", "data"]}, "HP": {"h1": [1.2999999999999998, 5.75, "szakértői annotáció,\nirányelvek"], "h2": [7.7, 5.75, "elégtelen/ellentmondó\nkontextus → operátor"], "h3": [12.799999999999999, 5.75, "kockázati osztály felett\njóváhagyás"], "h4": [15.95, 3.875, "monitorozás,\neszkaláció"]}, "R": 0.36, "YC": 3.875, "Y0": 3.0, "BH": 1.75, "BW": 2.3, "FLOW": ["ann", "kor", "ret", "gen", "val", "out"], "FB": [[[15.95, 3.515], [15.95, 2.15], [1.2999999999999998, 2.15], [1.2999999999999998, 3.0]], [[12.799999999999999, 3.875], [12.799999999999999, 2.15]], [[6.5, 2.15], [6.5, 1.5]]], "FBY": 2.15, "X": [0.0, 16.9], "Y": [-1.65, 6.95]}, INFO = {"ann": ["Szakértői irányelv + annotáció (2.1)", "Az irányelv rögzíti a kétértelmű esetek kezelését, a hivatkozási formát és a kockázati besorolást; a szakértői annotáció a domain-adaptáció alapja.", ["irányelv szerinti címkézés, pl. a kontraindikáció jelölése", "jogszabályhely és hatály címkézése", "kockázati kategória szerinti besorolás"]], "kor": ["Verziózott korpusz (2.3, 3.1)", "A dokumentum verzióval, hatályossági dátummal (valid_from/valid_to) és szakértői taxonómiával kerül a korpuszba.", ["a klinikai irányelv aktuális verziója", "a „módosítja / hatályon kívül helyezi” relációk gráfja", "éves jelentés, kockázati jelentés, szabályozói állásfoglalás címke"]], "ret": ["Retriever + időszűrő (3.1, 3.3)", "A lexikai (BM25) és sűrű (dense) keresés találatait az időszűrő („a mai napon hatályos”) szűkíti; a lekérdezés szakértői szinonimaszótárral bővülhet.", ["myocardialis infarctus ↔ szívizominfarktus explicit megfeleltetés", "a hatályos verzió előnyben a hasonló, de régebbi szöveggel szemben", "szándék szerinti szűkítés, pl. likviditási kockázat"]], "gen": ["Generátor, hivatkozáskényszeres prompt (3.1)", "A modell csak a kontextusban kapott, azonosítóval ellátott chunkokra hivatkozva válaszolhat.", ["klinikai ajánlás forrásmegjelöléssel", "válasz a §-ra mutató chunk-azonosítóval", "ajánlás a jelentés szakaszára hivatkozva"]], "val": ["Validátor (3.3)", "Kisebb NLI-modell vagy szabályalapú ellenőrzés: minden állítás levezethető-e a hivatkozott chunkokból, és létezik-e a hivatkozott forrás.", ["a kihagyott kontraindikáció jelzése", "hatályon kívüli verzióra mutató hivatkozás kiszűrése", "a válasz számadatainak egyeztetése a forrással"]], "out": ["Kiadás a felhasználónak", "A felhasználó csak az ellenőrzött – kockázati osztály felett emberileg jóváhagyott – választ kapja meg.", ["orvosnak szánt döntéstámogató javaslat", "ügyfélnek adott jogi tájékoztatás", "ügyfélnek adott pénzügyi ajánlás"]], "dpo": ["DPO-/finomhangoló adathalmaz (4.3)", "A jóváhagyott és elutasított válaszok kategorizált okokkal új tanítópárokká válnak; a megtagadás és a helyes válasz párjait kiegyensúlyozottan kell szerepeltetni (overrefusal ellen).", ["„kihagyta a kontraindikációt” → elutasított minta", "„rossz forrásra hivatkozott” → elutasított minta", "helyes, hivatkozott ajánlás → preferált minta"]], "h1": ["① Adat-előállítás és annotálás (4.1/1.)", "A legmunkaigényesebb, de legnagyobb hatású emberi pont: a szakértő irányelv alapján annotál.", ["klinikus annotálja az irányelv-esetet", "jogász címkézi a jogszabályhelyet", "kockázatelemző sorolja be a dokumentumot"]], "h2": ["② Retrieval utáni, generálás előtti szűrés (4.1/2.)", "Elégtelen vagy ellentmondó kontextusnál a rendszer megáll, és a kérdést emberi operátorhoz továbbítja.", ["klinikai döntéstámogatásban különösen fontos: hiányos kontextus veszélyes", "két egymásnak ellentmondó jogszabályváltozat", "hiányzó vagy elavult jelentés"]], "h3": ["③ Generálás utáni, véglegesítés előtti jóváhagyás (4.1/3.)", "A válasz csak emberi jóváhagyás után megy ki – mindig, vagy csak egy kockázati osztály felett.", ["magas kockázatú klinikai javaslat", "jellemző a jogi tanácsadásnál", "jellemző a pénzügyi ajánlásnál"]], "h4": ["④ Folyamatos monitorozás és eszkaláció (4.1/4.)", "Konfidencia- vagy szabályalapú riasztás emberi beavatkozást vált ki; a visszajelzések az adatflywheelbe kerülnek.", ["szokatlan javaslatminta riasztása", "panasz vagy hibás hivatkozás eszkalációja", "szabályalapú riasztás az ajánlásokra"]]}, DOM = ["egészségügy", "jog", "pénzügy"], BR = {A: [{"hl": ["ann", "h1"], "line": -1, "msg": "Előkészítés (offline): ① a szakértői irányelv és annotáció adja a korpusz taxonómiáját és a validátor szabályait. Kérdés: „Hatályos-e a Ptk. 6:58. §-ának idézett szövege?”"}, {"hl": ["kor", "ret"], "line": 0, "msg": "retriever: 3 chunk, időszűrő: as_of=2026-11-18 (csak a hatályos verziók: valid_from ≤ as_of < valid_to)"}, {"hl": ["h2"], "line": 1, "msg": "② kontextus-ellenőrzés: a 3 chunk ugyanarra a hatályos szövegváltozatra mutat, nincs ellentmondás → nem kell operátor"}, {"hl": ["gen"], "line": 2, "msg": "generátor: válasz a [chunk-1] és [chunk-3] hivatkozással"}, {"hl": ["val"], "line": 3, "msg": "validátor: a hivatkozások léteznek, groundedness 0,9 ≥ 0,8 (szemléltető küszöb) → kiadás"}, {"hl": ["out"], "line": 4, "msg": "kiadás a felhasználónak (az alacsony kockázati osztály miatt nincs kötelező ③ jóváhagyás)"}, {"hl": ["h4"], "line": 4, "msg": "④ monitorozás: a válasz és a hivatkozások naplózva; felhasználói jelzés vagy riasztás esetén eszkaláció"}], B: [{"hl": ["ann", "h1"], "line": -1, "msg": "Előkészítés (offline): ① a szakértői irányelv és annotáció adja a korpusz taxonómiáját és a validátor szabályait. Kérdés: „Hatályos-e a Ptk. 6:58. §-ának idézett szövege?”"}, {"hl": ["kor", "ret"], "line": 0, "msg": "retriever: 3 chunk, időszűrő: as_of=2026-11-18 (csak a hatályos verziók: valid_from ≤ as_of < valid_to)"}, {"hl": ["h2"], "line": 1, "msg": "② kontextus-ellenőrzés: a 3 chunk ugyanarra a hatályos szövegváltozatra mutat, nincs ellentmondás → nem kell operátor"}, {"hl": ["gen"], "line": 2, "msg": "generátor: válasz a [chunk-1] és [chunk-3] hivatkozással"}, {"hl": ["val", "h3"], "line": 3, "msg": "validátor: groundedness 0,5 < 0,8 (szemléltető küszöb) → ③ emberi jóváhagyás"}, {"hl": ["h3"], "line": 3, "msg": "③ a bíráló elutasítja: „a válasz egy hatályon kívüli verzióra hivatkozik” – javított válasz készül"}, {"hl": ["out"], "line": 4, "msg": "kiadás a jóváhagyott, javított válasszal; ④ monitorozás"}, {"hl": ["fb", "ann", "dpo"], "line": 5, "msg": "visszacsatolás: az elutasítás oka címkézve az annotációba, és kiegyensúlyozott (megtagadás / helyes válasz) DPO-párként kerül tovább (4.3)"}]};
let selNode = "ann", selDom = 0;
const SC = 44;
function px(x){ return (x - GEO.X[0]) * SC; }
function py(y){ return (GEO.Y[1] - y) * SC; }
function showInfo(id){
  selNode = id;
  const I = INFO[id];
  document.getElementById("ititle").textContent = I[0];
  document.getElementById("isum").textContent = I[1];
  document.getElementById("iex").textContent = DOM[selDom] + ": " + I[2][selDom];
  document.querySelectorAll("#tabs button").forEach((b, i) => b.setAttribute("aria-pressed", i === selDom ? "true" : "false"));
}
function pickDom(i){ selDom = i; showInfo(selNode); }
function pickBranch(b){ setSteps(BR[b]); }
function render(s){
  const W = (GEO.X[1] - GEO.X[0]) * SC, H = (GEO.Y[1] - GEO.Y[0] - 1.1) * SC;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="' + css("--line") + '"/></marker></defs>';
  const line = css("--line"), hl = css("--hl"), cell = css("--cell"), on = id => (s.hl || []).includes(id);
  const fbOn = on("fb");
  // folyam-nyilak
  for (let i = 0; i + 1 < GEO.FLOW.length; i++) {
    const a = GEO.N[GEO.FLOW[i]], b = GEO.N[GEO.FLOW[i + 1]];
    el("line", {x1: px(a[0] + a[2]), y1: py(GEO.YC), x2: px(b[0]) - 1, y2: py(GEO.YC), stroke: line, "stroke-width": 1.5, "marker-end": "url(#ah)"});
  }
  const o = GEO.N.out, h4 = GEO.HP.h4;
  el("line", {x1: px(o[0] + o[2]), y1: py(GEO.YC), x2: px(h4[0] - GEO.R) - 1, y2: py(GEO.YC), stroke: line, "stroke-width": 1.5, "marker-end": "url(#ah)"});

  GEO.FB.forEach((p, i) => el("polyline", {points: p.map(q => px(q[0]) + "," + py(q[1])).join(" "), fill: "none", stroke: fbOn ? hl : line, "stroke-width": fbOn ? 3 : 1.5, "stroke-dasharray": "7 4", "marker-end": i === 1 ? "" : "url(#ah)"}));
  el("text", {x: px(10.4), y: py(GEO.FBY) + 15, "font-size": 11.5}, "visszacsatolás (4.3)");
  const d = GEO.N.dpo;
  el("line", {x1: px(d[0] + d[2]), y1: py(1.0), x2: px(GEO.N.gen[0] + 0.6), y2: py(GEO.Y0) + 1, stroke: line, "stroke-width": 1.3, "stroke-dasharray": "2 3", "marker-end": "url(#ah)"});
  el("text", {x: px(8.15), y: py(1.05) + 12, "font-size": 11}, "finomhangolás/DPO");
  // csomópontok
  Object.entries(GEO.N).forEach(([id, n]) => {
    const [x, y, w, h, t, kind] = n, act = on(id), g = el("g", {tabindex: 0, role: "button", "aria-label": INFO[id][0], style: "cursor:pointer"});
    const sw = act ? 3.5 : 1.4, st = act ? hl : line, fill = act ? css("--cellhl") : cell;
    const X0 = px(x), Y0p = py(y + h), Wp = w * SC, Hp = h * SC, e = 12;
    if (kind === "box") g.appendChild(Object.assign(el("rect", {x: X0, y: Y0p, width: Wp, height: Hp, rx: 6, fill, stroke: st, "stroke-width": sw}), {}));
    else {
      g.appendChild(el("path", {d: `M${X0},${Y0p + e / 2} L${X0},${Y0p + Hp - e / 2} A${Wp / 2},${e / 2} 0 0 0 ${X0 + Wp},${Y0p + Hp - e / 2} L${X0 + Wp},${Y0p + e / 2}`, fill, stroke: st, "stroke-width": sw}));
      g.appendChild(el("ellipse", {cx: X0 + Wp / 2, cy: Y0p + e / 2, rx: Wp / 2, ry: e / 2, fill, stroke: st, "stroke-width": sw}));
    }
    const L = t.split("\n");

    svg.appendChild(g);
  });
  Object.entries(GEO.HP).forEach(([id, p]) => {
    const [x, y, t] = p, act = on(id);
    if (id !== "h4") el("line", {x1: px(x), y1: py(y - GEO.R), x2: px(x), y2: py(id === "h1" ? GEO.Y0 + GEO.BH : GEO.YC), stroke: line, "stroke-width": 1.4, "stroke-dasharray": "2 3"});
    const g = el("g", {tabindex: 0, role: "button", "aria-label": INFO[id][0], style: "cursor:pointer"});
    g.appendChild(el("circle", {cx: px(x), cy: py(y), r: GEO.R * SC * (act ? 1.15 : 1), fill: act ? hl : "#bbbbbb", stroke: line, "stroke-width": 3}));
    g.appendChild(el("text", {x: px(x), y: py(y) + 6, "font-size": 17, "font-weight": "bold", "text-anchor": "middle", fill: act ? css("--bg") : "#000"}, id[1]));
    const L = t.split("\n");
    L.forEach((ln, i) => g.appendChild(el("text", {x: px(x), y: py(y + GEO.R) - 6 - (L.length - 1 - i) * 13, "font-size": 11, "text-anchor": "middle"}, ln)));
    g.addEventListener("click", () => showInfo(id));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); showInfo(id); } });
    svg.appendChild(g);
  });
  if ((s.hl || []).length) { const f = s.hl.find(h => h !== "fb"); if (f) showInfo(f); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
