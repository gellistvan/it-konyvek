<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biztonság és hasznosság</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd;--cell:#fff;--cellhl:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444;--cell:#262626;--cellhl:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:240px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label>visszautasítási küszöb t <input id="t" type="range" min="0" max="3" step="0.005" aria-label="Visszautasítási küszöb"> <b id="tv"></b></label>
<button id="w">a szöveg munkapontja</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 330" role="img" aria-label="FPR–recall görbe a mozgó munkaponttal, mellette a konfúziós mátrix."></svg>
<p class="small">Illusztratív binormális modell: ártalmatlan pontszám N(0, 1), tiltott N(3,23; 1); visszautasítás, ha a pontszám &gt; t. A görbe a szöveg (0,12; 0,98) munkapontján megy át; a többi pont nem mérés. Szaggatott: egészségügy recall ≥ 0,99, oktatás FPR ≤ 0,10.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",");
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return s * y; }
const Phi = x => 0.5 * (1 + erf(x / Math.SQRT2));
const MU = 3.2287357026979127, T0 = 1.17498679206609;
const FPR = t => 1 - Phi(t), REC = t => 1 - Phi(t - MU);
const L = 60, R = 420, T = 14, B = 280, X = v => L + (R - L) * v / 0.4, Y = v => B - (B - T) * (v - 0.85) / 0.152;
function draw(){
  const t = +document.getElementById("t").value; document.getElementById("tv").textContent = f(t, 3);
  svg.innerHTML = "";
  [0.86, 0.9, 0.94, 0.98].forEach(v => { el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 2)); });
  [0, 0.1, 0.2, 0.3, 0.4].forEach(v => el("text", {x: X(v), y: B + 16, "text-anchor": "middle", "font-size": 11}, f(v, 1)));
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "FPR (téves visszautasítás)");
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "safety recall");
  let p = ""; for (let i = 0; i <= 300; i++) { const tt = -1 + 6 * i / 300, x = FPR(tt), y = REC(tt); if (x > 0.4 || y < 0.85) continue; p += (p ? "L" : "M") + X(x).toFixed(1) + "," + Y(y).toFixed(1); }
  el("path", {d: p, fill: "none", stroke: css("--fg"), "stroke-width": 2.5});
  el("line", {x1: L, y1: Y(0.99), x2: R, y2: Y(0.99), stroke: css("--muted"), "stroke-dasharray": "6 4"});
  el("text", {x: R - 2, y: Y(0.99) - 4, "text-anchor": "end", "font-size": 11}, "egészségügy: recall ≥ 0,99");
  el("line", {x1: X(0.1), y1: T, x2: X(0.1), y2: B, stroke: css("--muted"), "stroke-dasharray": "6 4"});
  el("text", {x: X(0.1) + 4, y: B - 6, "font-size": 11}, "oktatás: FPR ≤ 0,10");
  el("circle", {cx: X(FPR(T0)), cy: Y(REC(T0)), r: 5, fill: css("--fg")});
  const fp = FPR(t), rc = REC(t), FP = Math.round(1000 * fp), TP = Math.round(200 * rc);
  if (fp <= 0.4 && rc >= 0.85) el("circle", {cx: X(fp), cy: Y(rc), r: 7, fill: "none", stroke: css("--hl2"), "stroke-width": 3});
  // mátrix
  const mx = 470, my = 60, cw = 90;
  el("text", {x: mx + cw, y: my - 30, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "konfúziós mátrix");
  el("text", {x: mx + cw / 2, y: my - 8, "text-anchor": "middle", "font-size": 11}, "visszautasít");
  el("text", {x: mx + 1.5 * cw, y: my - 8, "text-anchor": "middle", "font-size": 11}, "válaszol");
  [["TP", TP, 0, 0, true], ["FN", 200 - TP, 1, 0, false], ["FP", FP, 0, 1, false], ["TN", 1000 - FP, 1, 1, true]].forEach(([n, v, cx, cy, ok]) => {
    el("rect", {x: mx + cx * cw, y: my + cy * 70, width: cw, height: 70, fill: ok ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": ok ? 2.5 : 1});
    el("text", {x: mx + cx * cw + cw / 2, y: my + cy * 70 + 30, "text-anchor": "middle", "font-size": 12}, n);
    el("text", {x: mx + cx * cw + cw / 2, y: my + cy * 70 + 52, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, String(v)); });
  el("text", {x: mx - 6, y: my + 40, "text-anchor": "end", "font-size": 11}, "tiltott");
  el("text", {x: mx - 6, y: my + 110, "text-anchor": "end", "font-size": 11}, "ártalm.");
  el("text", {x: mx, y: my + 170, "font-size": 12}, `FPR = ${FP}/1000 = ${f(FP / 1000, 3)}`);
  el("text", {x: mx, y: my + 188, "font-size": 12}, `recall = ${TP}/200 = ${f(TP / 200, 3)}`);
  el("text", {x: mx, y: my + 206, "font-size": 12}, `helpfulness ≈ 1 − FPR = ${f(1 - FP / 1000, 3)}`);
  const ok1 = TP / 200 >= 0.99, ok2 = FP / 1000 <= 0.10;
  document.getElementById("status").textContent = `t = ${f(t, 3)}: FPR = ${f(FP / 1000, 3)}, recall = ${f(TP / 200, 3)}. Egészségügyi követelmény ${ok1 ? "teljesül" : "nem teljesül"}, oktatási ${ok2 ? "teljesül" : "nem teljesül"}.` + (Math.abs(t - T0) < 0.003 ? " (A szöveg munkapontja.)" : "");
}
document.getElementById("t").value = T0;
document.getElementById("t").addEventListener("input", draw);
document.getElementById("w").onclick = () => { document.getElementById("t").value = T0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
