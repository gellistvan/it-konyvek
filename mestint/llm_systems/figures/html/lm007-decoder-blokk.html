<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decoder-only blokk adatfolyama</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>T <input id="st" type="range" min="1" max="16" value="8" oninput="upd()" aria-label="Szekvenciahossz T"> <b id="vst">8</b></label><label>d_model <input id="sd" type="range" min="16" max="128" step="16" value="64" oninput="upd()" aria-label="d_model"> <b id="vsd">64</b></label><label>h <input id="sh" type="range" min="1" max="8" value="4" oninput="upd()" aria-label="Fejek száma"> <b id="vsh">4</b></label><label>d_ff <input id="sf" type="range" min="32" max="512" step="32" value="256" oninput="upd()" aria-label="d_ff"> <b id="vsf">256</b></label><label><input id="post" type="checkbox" onchange="upd()"> post-norm (eredeti Transformer)</label><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A reziduális folyam két összeadáson halad át; az első ágban normalizálás és maszkolt többfejes figyelem, a másodikban normalizálás és SwiGLU-FFN van; minden ponton (2, 8, 64) vagy a fejekre bontott (2, 4, 8, 16) alak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 3.3.8 labor konfigurációja: B = 2, T = 8, d_model = 64, h = 4, d_k = 16, d_ff = 256 (B rögzített). A kódpanel a labor megfelelő sorait mutatja (pre-norm); post-norm módban a normák a reziduális folyamra kerülnek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": "norm1", "line": 0, "msg": "1/14 RMSNorm₁ → (2, 8, 64)"}, {"a": "qkv", "line": 1, "msg": "2/14 q_proj, k_proj, v_proj → (2, 8, 64)"}, {"a": "vt", "line": 2, "msg": "3/14 view + transpose (fejekre bontás) → (2, 4, 8, 16)"}, {"a": "sc", "line": 3, "msg": "4/14 QKᵀ / √16 → (2, 4, 8, 8)"}, {"a": "mask", "line": 4, "msg": "5/14 kauzális maszk → (2, 4, 8, 8)"}, {"a": "sm", "line": 5, "msg": "6/14 softmax → (2, 4, 8, 8)"}, {"a": "av", "line": 6, "msg": "7/14 @ V → (2, 4, 8, 16)"}, {"a": "tv", "line": 7, "msg": "8/14 transpose + view → (2, 8, 64)"}, {"a": "op", "line": 8, "msg": "9/14 o_proj → (2, 8, 64)"}, {"a": "add1", "line": 9, "msg": "10/14 ⊕ x₁ = x + a → (2, 8, 64)"}, {"a": "norm2", "line": 10, "msg": "11/14 RMSNorm₂ → (2, 8, 64)"}, {"a": "gu", "line": 11, "msg": "12/14 gate_proj, up_proj; SiLU ⊙ → (2, 8, 256)"}, {"a": "dp", "line": 12, "msg": "13/14 down_proj → (2, 8, 64)"}, {"a": "add2", "line": 13, "msg": "14/14 ⊕ x₂ = x₁ + m → (2, 8, 64); paraméterszám összesen 65664"}];
const CODE = ["h = self.norm1(x)", "Q = self.q_proj(x); K = self.k_proj(x); V = self.v_proj(x)", "Q = Q.view(B, T, self.n_heads, self.d_k).transpose(1, 2)", "attn_scores = Q @ K.transpose(-2, -1) / math.sqrt(self.d_k)", "attn_scores = attn_scores.masked_fill(mask, float('-inf'))", "attn_probs = torch.softmax(attn_scores, dim=-1)", "attn_out = attn_probs @ V  # (B, n_heads, T, d_k)", "attn_out = attn_out.transpose(1, 2).contiguous().view(B, T, D)", "return self.o_proj(attn_out)", "x = x + self.attn(h)", "h = self.norm2(x)", "gate = silu(self.gate_proj(x)); up = self.up_proj(x)", "return self.down_proj(gate * up)", "x = x + self.ffn(h)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GG = {"G": {"x": [7.0, 21.6], "norm1": [3.2, 20.1], "qkv": [3.2, 18.720000000000002], "vt": [3.2, 17.340000000000003], "sc": [3.2, 15.96], "mask": [3.2, 14.580000000000002], "sm": [3.2, 13.200000000000003], "av": [3.2, 11.820000000000002], "tv": [3.2, 10.440000000000001], "op": [3.2, 9.060000000000002], "add1": [7.0, 7.4], "norm2": [10.8, 5.6], "gu": [10.8, 4.22], "dp": [10.8, 2.84], "add2": [7.0, 1.3], "x2": [7.0, 0.1]}, "SX": 7.0, "AX": 3.2, "FX": 10.8, "BW": 5.4, "BH": 0.95};
let CUR = {b: 2, t: 8, d: 64, h: 4, f: 256, post: false};
function opsOf(c){
  const dk = c.d / c.h, f = a => "(" + a.join(", ") + ")";
  const s3 = [c.b, c.t, c.d], s4 = [c.b, c.h, c.t, dk], sT = [c.b, c.h, c.t, c.t], sF = [c.b, c.t, c.f];
  return [["norm1", "RMSNorm₁", s3, "a"], ["qkv", "q_proj, k_proj, v_proj", s3, "a"], ["vt", "view + transpose", s4, "a"],
    ["sc", "QKᵀ / √" + dk, sT, "a"], ["mask", "kauzális maszk", sT, "a"], ["sm", "softmax", sT, "a"], ["av", "@ V", s4, "a"],
    ["tv", "transpose + view", s3, "a"], ["op", "o_proj", s3, "a"], ["add1", "⊕  x₁ = x + a", s3, "r"], ["norm2", "RMSNorm₂", s3, "f"],
    ["gu", "gate_proj, up_proj; SiLU ⊙", sF, "f"], ["dp", "down_proj", s3, "f"], ["add2", "⊕  x₂ = x₁ + m", s3, "r"]];
}
function paramsOf(c){ return 4 * c.d * c.d + 3 * c.d * c.f + 2 * c.d; }
function stepsOf(c){
  const O = opsOf(c), f = a => "(" + a.join(", ") + ")";
  if (!c.post) return O.map((o, i) => ({a: o[0], line: i, msg: `${i + 1}/14 ${o[1].replace("  ", " ")}${o[0] === "vt" ? " (fejekre bontás)" : ""} → ${f(o[2])}` + (o[0] === "add2" ? `; paraméterszám összesen ${paramsOf(c)}` : "")}));
  const ord = ["qkv", "vt", "sc", "mask", "sm", "av", "tv", "op", "add1", "norm1", "gu", "dp", "add2", "norm2"], by = {};
  O.forEach(o => by[o[0]] = o);
  return ord.map((id, i) => { const o = by[id];
    let m = `${i + 1}/14 ${o[1].replace("  ", " ")} → ${f(o[2])}`;
    if (id === "norm1") m = `${i + 1}/14 post-norm: x₁ = RMSNorm₁(x + a) → ${f(o[2])} (a normalizálás a folyamon van)`;
    if (id === "norm2") m = `${i + 1}/14 post-norm: x₂ = RMSNorm₂(x₁ + m) → ${f(o[2])}; paraméterszám összesen ${paramsOf(c)}`;
    if (id === "qkv") m += " (post-norm: az ág a normálatlan x-ből indul)";
    return {a: id, line: -1, msg: m}; });
}
function render(s){
  const U = 30, G = GG.G, c = CUR, O = opsOf(c), by = {}; O.forEach(o => by[o[0]] = o);
  const X = x => (x - 0.2) * U, Y = y => (22.4 - y) * U;
  svg.setAttribute("viewBox", `0 0 ${13.6 * U} ${23.6 * U}`);
  svg.innerHTML = ""; svg.style.maxHeight = "700px";
  const line = css("--line"), hl = css("--hl"), cell = css("--cell"), f = a => "(" + a.join(", ") + ")";
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${css("--cellhl")}"/><path d="M0,7L7,0" stroke="${css("--muted")}" stroke-width="1"/></pattern>`;
  const P = Object.assign({}, G);
  if (c.post) { P.norm1 = [GG.SX, 6.55]; P.norm2 = [GG.SX, 0.45]; P.x2 = [GG.SX, -0.55]; }
  const L = (x0, y0, x1, y1, w, d) => el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: line, "stroke-width": w, "stroke-dasharray": d || ""});
  L(GG.SX, 21.2, GG.SX, P.x2[1] + 0.3, 6);
  L(GG.SX, 20.95, GG.AX, 20.95, 1.3); L(GG.AX, 20.95, GG.AX, (c.post ? G.qkv[1] : G.norm1[1]) + GG.BH / 2, 1.3);
  L(GG.AX, G.op[1], GG.AX, G.add1[1], 1.3); L(GG.AX, G.add1[1], GG.SX, G.add1[1], 1.3);
  const fy0 = c.post ? 5.85 : 6.45;
  L(GG.SX, fy0, GG.FX, fy0, 1.3); L(GG.FX, fy0, GG.FX, (c.post ? G.gu[1] : G.norm2[1]) + GG.BH / 2, 1.3);
  L(GG.FX, G.dp[1], GG.FX, G.add2[1], 1.3); L(GG.FX, G.add2[1], GG.SX, G.add2[1], 1.3);
  el("text", {x: X(GG.AX), y: Y(21.75), "font-size": 14, "text-anchor": "middle", "font-weight": "bold"}, "figyelmi ág");
  el("text", {x: X(GG.FX), y: Y(6.95), "font-size": 14, "text-anchor": "middle", "font-weight": "bold"}, "FFN-ág (SwiGLU)");
  const on = id => s.a === id;
  el("rect", {x: X(GG.SX - 1.8), y: Y(G.x[1] + GG.BH / 2), width: 3.6 * U, height: GG.BH * U, rx: 6, fill: cell, stroke: line, "stroke-width": 2.5});
  el("text", {x: X(GG.SX), y: Y(G.x[1]) + 5, "font-size": 14, "text-anchor": "middle"}, "x " + f([c.b, c.t, c.d]));
  O.forEach(([id, lab, shp, br]) => {
    const [x, y] = P[id];
    if (br === "r") {
      el("circle", {cx: X(x), cy: Y(y), r: 0.36 * U, fill: on(id) ? css("--cellhl") : cell, stroke: on(id) ? hl : line, "stroke-width": on(id) ? 4 : 2.5});
      el("text", {x: X(x), y: Y(y) + 7, "font-size": 20, "text-anchor": "middle", "font-weight": "bold"}, "+");
      if (id === "add1" && !c.post) el("text", {x: X(x - 0.5), y: Y(y - 0.6), "font-size": 13, "font-weight": "bold", "text-anchor": "end"}, "x₁ " + f(shp));
      return;
    }
    const norm = id.startsWith("norm"), w = (c.post && norm) ? 3.4 : GG.BW;
    el("rect", {x: X(x - w / 2), y: Y(y + GG.BH / 2), width: w * U, height: GG.BH * U, rx: norm ? 13 : 5,
                fill: on(id) ? css("--cellhl") : (id === "mask" ? "url(#hm)" : cell), stroke: on(id) ? hl : line, "stroke-width": on(id) ? 4 : (norm ? 2 : 1.3)});
    if (id === "mask") el("rect", {x: X(x - 1.6), y: Y(y + 0.36), width: 3.2 * U, height: 0.72 * U, fill: cell});
    el("text", {x: X(x), y: Y(y) - 2, "font-size": 12.5, "text-anchor": "middle"}, lab);
    el("text", {x: X(x), y: Y(y) + 13, "font-size": 12.5, "text-anchor": "middle", "font-weight": on(id) ? "bold" : "normal"}, f(shp));
  });
  el("text", {x: X(GG.SX), y: Y(P.x2[1] - 0.15), "font-size": 14, "text-anchor": "middle", "font-weight": "bold"}, "x₂ " + f([c.b, c.t, c.d]));
  const tp = paramsOf(c);
  [["Paraméterszám:", ""], ["figyelem 4·d²", 4 * c.d * c.d], ["FFN 3·d·d_ff", 3 * c.d * c.f], ["normák 2·d", 2 * c.d], ["összesen", tp]].forEach(([a, v], i) =>
    el("text", {x: X(9.0), y: Y(19.8) + i * 18, "font-size": 13, "font-weight": i === 4 ? "bold" : "normal"}, a + (v === "" ? "" : " = " + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " "))));
}
function upd(){
  const g = id => +document.getElementById(id).value, err = document.getElementById("err");
  const c = {b: 2, t: g("st"), d: g("sd"), h: g("sh"), f: g("sf"), post: document.getElementById("post").checked};
  ["st", "sd", "sh", "sf"].forEach(id => document.getElementById("v" + id).textContent = g(id));
  if (c.d % c.h) { err.textContent = `d_model = ${c.d} nem osztható h = ${c.h}-val – válasszon más h-t`; return; }
  err.textContent = "";
  CUR = c; const kk = k; setSteps(stepsOf(c)); show(kk);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
