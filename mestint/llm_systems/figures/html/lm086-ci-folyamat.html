<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI-folyamat: triggerek, jobok, kapuk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--line:#000;--box:#fff;--trig:#eee;--on:#1f4e79;--off:#bbb;--bad:#b00020;--ok:#2e6b2e;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--line:#ddd;--box:#262626;--trig:#333;--on:#8fb8e8;--off:#555;--bad:#ff8a80;--ok:#8fd18f;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
fieldset{border:1px solid var(--off);padding:4px 8px;margin:0}
input[type=range]{width:120px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
svg{flex:1 1 560px;min-width:300px;height:auto;display:block}
pre{flex:0 1 220px;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <fieldset role="radiogroup" aria-label="Kiváltó esemény"><legend class="small">esemény</legend>
    <label><input type="radio" name="tr" value="pr" checked> PR (paths szűrő)</label>
    <label><input type="radio" name="tr" value="schedule"> éjszakai cron</label>
    <label><input type="radio" name="tr" value="label"> PR + run-full-eval címke</label>
  </fieldset>
  <button id="rs">Szintetikus riport (7.6)</button>
</div>
<div class="ctl" role="group" aria-label="Mért értékek">
  <label>smoke pontosság <input id="smoke_accuracy" type="range" min="0" max="1" step="0.01"><b id="smoke_accuracyv"></b></label>
  <label>exact_match <input id="exact_match" type="range" min="0" max="1" step="0.01"><b id="exact_matchv"></b></label>
  <label>macro_f1 <input id="macro_f1" type="range" min="0" max="1" step="0.01"><b id="macro_f1v"></b></label>
  <label>json_validity <input id="json_validity" type="range" min="0.9" max="1" step="0.005"><b id="json_validityv"></b></label>
</div>
<div id="status" aria-live="polite"></div>
<div class="row">
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="CI-folyamat: három trigger, a unit job, a smoke-eval és a full-eval job, kapuk és kimenetek; a futó jobok kiemelve."></svg>
<pre id="rep" aria-label="A riport gates mezője" aria-live="polite"></pre>
</div>
<p class="small">Küszöbök (configs/thresholds_*.yaml): smoke pontosság ≥ 0,70; exact_match ≥ 0,80, macro_f1 ≥ 0,75, json_validity ≥ 0,99. Kiinduló értékek: a 7.6 szintetikus riportja (nem mérés). A full-eval csak schedule eseménynél vagy run-full-eval címkés PR-nél fut; a smoke-eval minden eseménynél.</p>
<script>
const THR = {"smoke_accuracy": 0.7, "exact_match": 0.8, "macro_f1": 0.75, "json_validity": 0.99}, MEAS = {"smoke_accuracy": 0.8, "exact_match": 0.82, "macro_f1": 0.78, "json_validity": 0.98}, NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id), svg = $("v");
const KEYS = Object.keys(MEAS);
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const f = (x, d) => x.toFixed(d).replace(".", ",");
function bx(x, y, w, h, lines, on, opt){ opt = opt || {};
  mk("rect", {x, y, width: w, height: h, rx: 6, fill: opt.fill || css("--box"), stroke: on ? css("--on") : css("--off"), "stroke-width": on ? 3 : 1.3, "stroke-dasharray": opt.dash || ""});
  lines.forEach((l, i) => mk("text", {x: x + w / 2, y: y + h / 2 + (i - (lines.length - 1) / 2) * 15 + 4, "text-anchor": "middle", "font-size": 12, "font-weight": i === 0 ? "bold" : "normal", fill: on ? css("--fg") : css("--muted")}, l)); }
function ar(x1, y1, x2, y2, on, dash){ mk("line", {x1, y1, x2, y2, stroke: on ? css("--fg") : css("--off"), "stroke-width": on ? 2 : 1.2, "stroke-dasharray": dash || "", "marker-end": on ? "url(#a1)" : "url(#a0)"}); }
function dm(cx, cy, w, h, lines, on, ok){
  mk("path", {d: `M${cx - w / 2},${cy}L${cx},${cy - h / 2}L${cx + w / 2},${cy}L${cx},${cy + h / 2}z`, fill: css("--box"), stroke: !on ? css("--off") : ok ? css("--ok") : css("--bad"), "stroke-width": on ? 3 : 1.3});
  lines.forEach((l, i) => mk("text", {x: cx, y: cy + (i - (lines.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": 11, fill: on ? css("--fg") : css("--muted")}, l)); }
function draw(){
  const tr = document.querySelector("input[name=tr]:checked").value, m = {};
  KEYS.forEach(k => { m[k] = +$(k).value; $(k + "v").textContent = f(m[k], k === "json_validity" ? 3 : 2); });
  const g = {smoke: m.smoke_accuracy >= THR.smoke_accuracy, quality: m.exact_match >= THR.exact_match && m.macro_f1 >= THR.macro_f1, json_validity: m.json_validity >= THR.json_validity};
  const full = tr !== "pr", fullOk = g.quality && g.json_validity;
  svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  [["a1", css("--fg")], ["a0", css("--off")]].forEach(([id, c]) => { const mm = document.createElementNS(NS, "marker");
    Object.entries({id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto"}).forEach(([q, v]) => mm.setAttribute(q, v));
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0L10,5L0,10z"); p.setAttribute("fill", c); mm.appendChild(p); defs.appendChild(mm); });
  const T = [["pr", 40, ["PR", "(paths szűrő)"]], ["schedule", 140, ["cron 0 1 * * *", "(éjszaka)"]], ["label", 240, ["PR + címke", "run-full-eval"]]];
  T.forEach(([id, y, l]) => { bx(4, y, 104, 50, l, id === tr, {fill: css("--trig")}); ar(108, y + 25, 140, 165, id === tr); });
  bx(140, 135, 100, 60, ["unit", "ubuntu-latest", "pytest tests/unit"], true);
  bx(270, 20, 110, 60, ["smoke-eval", "gpu-t4, 10 példa"], true);
  bx(270, 228, 110, 84, ["full-eval", "gpu-a10", "100 példa", full ? "fut" : "kimarad (if)"], full, {dash: full ? "" : "5 4"});
  ar(240, 150, 270, 55, true); ar(240, 180, 270, 265, full, full ? "" : "5 4");
  mk("text", {x: 214, y: 112, "font-size": 10.5, fill: css("--muted")}, "needs: unit");
  dm(445, 50, 110, 80, ["smoke-kapu", `${f(m.smoke_accuracy, 2)} ${g.smoke ? "≥" : "<"} 0,70`, g.smoke ? "✓" : "✗"], true, g.smoke);
  ar(380, 50, 390, 50, true);
  dm(450, 270, 130, 112, ["teljes kapu", `EM ${f(m.exact_match, 2)} ${m.exact_match >= THR.exact_match ? "✓" : "✗"}`, `F1 ${f(m.macro_f1, 2)} ${m.macro_f1 >= THR.macro_f1 ? "✓" : "✗"}`, `JSON ${f(m.json_validity, 3)} ${g.json_validity ? "✓" : "✗"}`], full, fullOk);
  ar(380, 270, 385, 270, full);
  bx(530, 20, 104, 60, g.smoke ? ["✓ tovább", "zöld ellenőrzés"] : ["✗ megszakad", "+ riport"], true, {fill: g.smoke ? css("--box") : css("--trig")});
  ar(500, 50, 530, 50, true, g.smoke ? "" : "5 4");
  bx(530, 160, 104, 60, ["produkciós", "jelölt"], full && fullOk, {dash: full && fullOk ? "" : "5 4"});
  bx(530, 245, 104, 60, ["✗ megszakad", "+ riport"], full && !fullOk, {dash: full && !fullOk ? "" : "5 4", fill: css("--trig")});
  ar(470, 220, 530, 195, full && fullOk, full && fullOk ? "" : "5 4"); ar(515, 270, 530, 275, full && !fullOk, full && !fullOk ? "" : "5 4");
  const rep = {gates: {quality: g.quality, json_validity: g.json_validity}};
  $("rep").textContent = (full ? "reports/full.json\n" + JSON.stringify(rep, null, 2) : "reports/full.json\n(nem készül: a full-eval kimarad)") +
    "\n\nreports/smoke.json\n" + JSON.stringify({gates: {smoke_accuracy: g.smoke}}, null, 2);
  const names = {pr: "PR", schedule: "éjszakai cron", label: "címkés PR"};
  $("status").textContent = `${names[tr]}: fut a unit és a smoke-eval${full ? " és a full-eval" : "; a full-eval kimarad (if feltétel)"}. ` +
    `Smoke-kapu: ${g.smoke ? "✓" : "✗"}` + (full ? `; teljes kapu: ${fullOk ? "✓ – produkciós jelölt" : "✗ – a pipeline megszakad, riport készül"}.` : ".");
}
document.querySelectorAll("input[name=tr]").forEach(r => r.onchange = draw);
KEYS.forEach(k => $(k).oninput = draw);
$("rs").onclick = () => { KEYS.forEach(k => $(k).value = MEAS[k]); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
KEYS.forEach(k => $(k).value = MEAS[k]);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
