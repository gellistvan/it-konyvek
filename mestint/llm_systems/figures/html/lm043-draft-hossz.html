<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyorsulás a draft hossz függvényében</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--line:#000;--grid:#ddd;--l2:#555;--cell:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--line:#ddd;--grid:#444;--l2:#bbb;--cell:#262626}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>ᾱ = <input id="a" type="range" min="0" max="0.99" step="0.01" value="0.9" aria-label="Átlagos elfogadási valószínűség"><b id="av"></b></label>
  <label>T_d/T_t = <input id="r" type="range" min="0.01" max="1" step="0.01" value="0.1" aria-label="Draft és target tokenidő aránya"><b id="rv"></b></label>
  <label>T_v/T_t = <input id="w" type="range" min="1" max="3" step="0.05" value="1" aria-label="Verifikációs blokk és target tokenidő aránya"><b id="wv"></b></label>
</div>
<div class="ctl" role="group" aria-label="Presetek">
  <button id="p1">12.3.5: gyors draft (T_d/T_t = 0,1)</button><button id="p2">12.3.5: lassú draft (T_d/T_t = 0,5)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 300" role="img" aria-label="A várható gyorsulás a draft hossz függvényében az aktuális paraméterekkel, összevetve a két alapesettel"></svg>
<p class="small">Képletből számolt, nem mérés: S(K) = E[L]/(K·T_d/T_t + T_v/T_t), E[L] = (1 − ᾱ^(K+1))/(1 − ᾱ), batch = 1.
Folytonos vastag vonal: az aktuális beállítás; vékony szürke: a két alapeset (ᾱ = 0,9, T_d/T_t = 0,1 és 0,5, T_v = T_t). Csillag: az optimális K.</p>
<script>
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id), svg = $("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
const EL = (K, a) => a < 1 ? (1 - Math.pow(a, K + 1)) / (1 - a) : K + 1, S = (K, a, r, w) => EL(K, a) / (K * r + w);
function draw(){
  const a = +$("a").value, r = +$("r").value, w = +$("w").value;
  $("av").textContent = fmt(a, 2); $("rv").textContent = fmt(r, 2); $("wv").textContent = fmt(w, 2);
  const Ks = Array.from({length: 15}, (_, i) => i + 1), cur = Ks.map(k => S(k, a, r, w)), b1 = Ks.map(k => S(k, 0.9, 0.1, 1)), b5 = Ks.map(k => S(k, 0.9, 0.5, 1));
  const ymax = Math.max(4, Math.ceil(Math.max(...cur) + 0.3)), L = 50, R = 600, T = 14, B = 256;
  const X = k => L + (R - L) * (k - 1) / 14, Y = v => B - (B - T) * v / ymax;
  svg.innerHTML = "";
  for (let g = 0; g <= ymax; g++) { mk("line", {x1: L, x2: R, y1: Y(g), y2: Y(g), stroke: css("--grid")}); mk("text", {x: L - 6, y: Y(g) + 4, "text-anchor": "end", "font-size": 11}, g); }
  Ks.forEach(k => mk("text", {x: X(k), y: B + 16, "text-anchor": "middle", "font-size": 11}, k));
  mk("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "draft hossz K");
  mk("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "várható gyorsulás S");
  mk("line", {x1: L, x2: R, y1: Y(1), y2: Y(1), stroke: css("--fg"), "stroke-dasharray": "2 3"});
  mk("text", {x: R - 2, y: Y(1) - 4, "text-anchor": "end", "font-size": 11}, "S = 1");
  [[b1, "6 0"], [b5, "6 4"]].forEach(([d, da]) => mk("path", {d: "M" + Ks.map((k, i) => X(k) + " " + Y(d[i])).join("L"), fill: "none", stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": da}));
  mk("path", {d: "M" + Ks.map((k, i) => X(k) + " " + Y(cur[i])).join("L"), fill: "none", stroke: css("--fg"), "stroke-width": 2.6});
  Ks.forEach((k, i) => mk("circle", {cx: X(k), cy: Y(cur[i]), r: 3.5, fill: css("--cell"), stroke: css("--fg")}));
  const mi = cur.indexOf(Math.max(...cur)), kb = Ks[mi];
  mk("path", {d: `M${X(kb)},${Y(cur[mi]) - 9}l2.6,6l6.4,.5l-4.9,4.2l1.6,6.2l-5.7,-3.4l-5.7,3.4l1.6,-6.2l-4.9,-4.2l6.4,-.5z`, fill: css("--hl"), stroke: css("--fg")});
  const below = Ks.filter((k, i) => cur[i] < 1);
  $("status").textContent = `Optimális K = ${kb}, S = ${fmt(cur[mi], 3)}; K = 5-nél S = ${fmt(cur[4], 3)}` + (below.length ? `; S < 1 K ≥ ${below[0]}-tól (lassulás).` : "; a vizsgált tartományban S ≥ 1.");
}
["a", "r", "w"].forEach(id => $(id).oninput = draw);
$("p1").onclick = () => { $("a").value = 0.9; $("r").value = 0.1; $("w").value = 1; draw(); };
$("p2").onclick = () => { $("a").value = 0.9; $("r").value = 0.5; $("w").value = 1; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
