<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hőmérséklet és KD-veszteség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--grid:#ddd;--tea:#333}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--grid:#444;--tea:#bbb}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:200px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;max-width:660px;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
<label>T <input id="t" type="range" min="0.5" max="10" step="0.25" value="4" aria-label="hőmérséklet"> <b id="tv"></b></label>
<label><input id="sq" type="checkbox" checked> T²-skálázás</label>
<button id="rst">Diáklogitok visszaállítása</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 470" role="img" aria-label="Felül a tanár és a diák eloszlása hat jelöltre oszlopokkal; a diák oszlopai függőleges húzással állíthatók. Alul a KD-veszteség a hőmérséklet függvényében."></svg>
<p class="small">Rögzített példalogitok (illusztráció, nem modellkimenet). A diák logitjait az oszlop húzásával vagy a fel/le nyíllal (az oszlop kijelölése után, Tab) állíthatod. A KD-tag T²·KL(q‖p); kikapcsolt skálázásnál a nyers KL látszik. Kezdőállapot: T = 4, a statikus ábra példája.</p>
<script>
const ZT = [6.0, 5.2, 4.9, 2.5, 1.0, -3.0], ZS0 = [5.0, 2.0, 4.0, 3.0, 1.5, -1.0], LAB = ["húszezer", "20 000", "húsz ezer", "tízezer", "kb.", "alma"];
let ZS = ZS0.slice(), drag = -1, focus = 0;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
function sm(z, T){ const m = Math.max(...z.map(v => v / T)), e = z.map(v => Math.exp(v / T - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); }
function kl(T){ const q = sm(ZT, T), p = sm(ZS, T); return q.reduce((s, qi, i) => s + qi * Math.log(qi / p[i]), 0); }
const L = 60, R = 620, T0 = 20, B0 = 230, bw = (R - L) / 6;
const Yp = v => B0 - (B0 - T0) * v;
function draw(){
  const T = +document.getElementById("t").value, sq = document.getElementById("sq").checked;
  document.getElementById("tv").textContent = f(T, 2);
  const q = sm(ZT, T), p = sm(ZS, T), k = kl(T), val = sq ? T * T * k : k;
  svg.innerHTML = "";
  const d = el("defs", {}), pt = document.createElementNS(NS, "pattern");
  [["id", "hh"], ["width", 6], ["height", 6], ["patternUnits", "userSpaceOnUse"], ["patternTransform", "rotate(45)"]].forEach(([a, b]) => pt.setAttribute(a, b));
  const ln = document.createElementNS(NS, "line"); [["x1", 0], ["y1", 0], ["x2", 0], ["y2", 6], ["stroke", css("--fg")], ["stroke-width", 1.2]].forEach(([a, b]) => ln.setAttribute(a, b)); pt.appendChild(ln); d.appendChild(pt);
  for (let v = 0; v <= 1.001; v += 0.25) { el("line", {x1: L, y1: Yp(v), x2: R, y2: Yp(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Yp(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 2)); }
  LAB.forEach((lab, i) => { const x = L + i * bw;
    el("rect", {x: x + bw * 0.12, y: Yp(q[i]), width: bw * 0.36, height: B0 - Yp(q[i]), fill: css("--tea"), stroke: css("--fg")});
    const r = el("rect", {x: x + bw * 0.52, y: Yp(p[i]), width: bw * 0.36, height: B0 - Yp(p[i]), fill: "url(#hh)", stroke: i === focus ? css("--hl2") : css("--fg"), "stroke-width": i === focus ? 2.5 : 1, "data-i": i, style: "cursor:ns-resize"});
    el("text", {x: x + bw * 0.3, y: Yp(q[i]) - 4, "text-anchor": "middle", "font-size": 10.5}, f(q[i], 2));
    el("text", {x: x + bw * 0.7, y: Yp(p[i]) - 4, "text-anchor": "middle", "font-size": 10.5}, f(p[i], 2));
    el("text", {x: x + bw / 2, y: B0 + 16, "text-anchor": "middle", "font-size": 11.5}, lab);
    el("text", {x: x + bw / 2, y: B0 + 31, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, `z: ${f(ZT[i], 1)} / ${f(ZS[i], 1)}`); });
  el("rect", {x: R - 150, y: T0, width: 14, height: 12, fill: css("--tea")}); el("text", {x: R - 130, y: T0 + 11, "font-size": 11}, "tanár q");
  el("rect", {x: R - 70, y: T0, width: 14, height: 12, fill: "url(#hh)", stroke: css("--fg")}); el("text", {x: R - 50, y: T0 + 11, "font-size": 11}, "diák p");
  // alsó panel: KD(T)
  const Ty = 290, By = 430, Tmax = 10, vals = []; for (let i = 0; i <= 190; i++) { const t = 0.5 + i * 0.05; vals.push([t, sq ? t * t * kl(t) : kl(t)]); }
  const ym = Math.max(...vals.map(v => v[1])) * 1.1, Xb = t => L + (R - L) * (t - 0.5) / (Tmax - 0.5), Yb = v => By - (By - Ty) * v / ym;
  el("rect", {x: L, y: Ty, width: R - L, height: By - Ty, fill: "none", stroke: css("--grid")});
  [1, 2, 4, 6, 8, 10].forEach(t => el("text", {x: Xb(t), y: By + 15, "text-anchor": "middle", "font-size": 11}, String(t)));
  [0, ym / 2, ym / 1.1].forEach(v => el("text", {x: L - 6, y: Yb(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 2)));
  el("text", {x: (L + R) / 2, y: By + 32, "text-anchor": "middle", "font-size": 12}, "hőmérséklet T");
  el("path", {d: vals.map((v, i) => (i ? "L" : "M") + Xb(v[0]).toFixed(1) + "," + Yb(v[1]).toFixed(1)).join(""), fill: "none", stroke: css("--fg"), "stroke-width": 2.4, "stroke-dasharray": sq ? "none" : "7 4"});
  el("text", {x: L + 6, y: Ty + 14, "font-size": 11.5}, sq ? "T²·KL(q‖p)" : "nyers KL(q‖p)");
  el("circle", {cx: Xb(T), cy: Yb(val), r: 5.5, fill: css("--hl2"), stroke: css("--fg")});
  document.getElementById("status").textContent = `T = ${f(T, 2)}: KL(q‖p) = ${f(k, 4)} nat, T²·KL = ${f(T * T * k, 4)}. Tanár: „húszezer” ${f(q[0], 2)}, „20 000” ${f(q[1], 2)}, „húsz ezer” ${f(q[2], 2)}, „alma” ${f(q[5], 3)}.`;
}
function yToLogitDelta(dy){ return -dy / 30; }
let y0 = 0, z0 = 0;
svg.addEventListener("pointerdown", e => { const i = e.target.getAttribute && e.target.getAttribute("data-i"); if (i === null || i === undefined) return; drag = +i; focus = drag; y0 = e.clientY; z0 = ZS[drag]; svg.setPointerCapture(e.pointerId); draw(); });
svg.addEventListener("pointermove", e => { if (drag < 0) return; const sc = 640 / svg.getBoundingClientRect().width; ZS[drag] = Math.max(-6, Math.min(10, z0 + yToLogitDelta((e.clientY - y0) * sc))); draw(); });
svg.addEventListener("pointerup", () => { drag = -1; });
svg.setAttribute("tabindex", "0");
svg.addEventListener("keydown", e => { if (e.key === "Tab") return;
  if (e.key === "ArrowRight") { focus = (focus + 1) % 6; } else if (e.key === "ArrowLeft") { focus = (focus + 5) % 6; }
  else if (e.key === "ArrowUp") { ZS[focus] = Math.min(10, ZS[focus] + 0.25); } else if (e.key === "ArrowDown") { ZS[focus] = Math.max(-6, ZS[focus] - 0.25); } else return;
  e.preventDefault(); draw(); });
document.getElementById("rst").onclick = () => { ZS = ZS0.slice(); draw(); };
document.querySelectorAll("input").forEach(x => x.addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
