<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPO- és IPO-veszteség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 8px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl2)}
input[type=range]{width:200px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#card{background:var(--code);padding:4px 8px;min-height:2.2em;font-size:13px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label>β <input id="b" type="range" min="-2" max="0" step="0.01" value="-1" aria-label="béta, logaritmikus skálán"> <b id="bv"></b></label>
<span id="pairs"></span></div>
<div id="status" aria-live="polite"></div>
<div id="card" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 520" role="img" aria-label="Felül a DPO- és IPO-veszteség, alul a deriváltjuk a log-ratio-különbség függvényében; a labor négy pontja jelölve."></svg>
<p class="small">Folytonos: DPO −log σ(βh) (bal tengely); pontozott: IPO (h − 1/(2β))² (jobb tengely, a görbe a saját skáláján). Függőleges szaggatott: σ(z) = 0,9 ⇔ h = ln 9/β. A labor párjai β = 0,1-nél: 0,7444 / 0,7185 / 0,6444 / 0,6685.</p>
<script>
const ROWS = [{"n": "1. pár", "lc": -2.0, "lr": -1.0, "rc": -1.5, "rr": -1.5, "h": -1.0}, {"n": "2. pár", "lc": -1.5, "lr": -1.0, "rc": -1.5, "rr": -1.5, "h": -0.5}, {"n": "1. pár felcserélve", "lc": -1.0, "lr": -2.0, "rc": -1.5, "rr": -1.5, "h": 1.0}, {"n": "2. pár felcserélve", "lc": -1.0, "lr": -1.5, "rc": -1.5, "rr": -1.5, "h": 0.5}];
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
const sg = z => 1 / (1 + Math.exp(-z)), D = (h, b) => -Math.log(sg(b * h)), dD = (h, b) => -b * (1 - sg(b * h));
const I = (h, b) => (h - 1 / (2 * b)) ** 2, dI = (h, b) => 2 * (h - 1 / (2 * b));
const L = 60, R = 560, X = h => L + (R - L) * (h + 30) / 60;
let sel = -1;
function panel(y0, y1, lo, hi, lo2, hi2, fD, fI, b, title, lab1, lab2){
  const Y = v => y1 - (y1 - y0) * (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo);
  const Y2 = v => y1 - (y1 - y0) * (Math.max(lo2, Math.min(hi2, v)) - lo2) / (hi2 - lo2);
  el("text", {x: L, y: y0 - 6, "font-size": 12, "font-weight": "bold"}, title);
  el("rect", {x: L, y: y0, width: R - L, height: y1 - y0, fill: "none", stroke: css("--grid")});
  if (lo < 0 && hi > 0) el("line", {x1: L, y1: Y(0), x2: R, y2: Y(0), stroke: css("--grid")});
  [lo, (lo + hi) / 2, hi].forEach(v => el("text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 10.5}, f(v, Math.abs(hi - lo) < 2 ? 2 : 1)));
  [lo2, hi2].forEach(v => el("text", {x: R + 5, y: Y2(v) + 4, "font-size": 10.5, fill: css("--muted")}, f(v, 0)));
  el("text", {x: 14, y: (y0 + y1) / 2, "text-anchor": "middle", "font-size": 11, transform: `rotate(-90 14 ${(y0 + y1) / 2})`}, lab1);
  el("text", {x: 606, y: (y0 + y1) / 2, "text-anchor": "middle", "font-size": 11, fill: css("--muted"), transform: `rotate(90 606 ${(y0 + y1) / 2})`}, lab2);
  let p = "", q = ""; for (let i = 0; i <= 240; i++) { const h = -30 + 60 * i / 240; p += (p ? "L" : "M") + X(h).toFixed(1) + "," + Y(fD(h, b)).toFixed(1); q += (q ? "L" : "M") + X(h).toFixed(1) + "," + Y2(fI(h, b)).toFixed(1); }
  el("path", {d: q, fill: "none", stroke: css("--muted"), "stroke-width": 2.2, "stroke-dasharray": "2 4"});
  el("path", {d: p, fill: "none", stroke: css("--fg"), "stroke-width": 2.5});
  return Y;
}
function draw(){
  const b = Math.pow(10, +document.getElementById("b").value), h90 = Math.log(9) / b, ipo0 = 1 / (2 * b);
  document.getElementById("bv").textContent = f(b, 3);
  svg.innerHTML = "";
  const YA = panel(22, 230, 0, 3.2, 0, 1300, D, I, b, "(A) veszteség", "DPO", "IPO");
  const lb = -Math.max(0.12, b * 1.05); const YB = panel(272, 480, lb, -lb * 55 / 75, -75, 55, dD, dI, b, "(B) derivált h szerint", "dL_DPO/dh", "dL_IPO/dh");
  [-30, -20, -10, 0, 10, 20, 30].forEach(v => el("text", {x: X(v), y: 498, "text-anchor": "middle", "font-size": 11}, f(v, 0)));
  el("text", {x: (L + R) / 2, y: 515, "text-anchor": "middle", "font-size": 12}, "log-ratio-különbség h (z = βh)");
  if (h90 <= 30) { el("line", {x1: X(h90), y1: 22, x2: X(h90), y2: 480, stroke: css("--hl"), "stroke-dasharray": "6 4"});
    el("text", {x: X(h90) - 4, y: 40, "text-anchor": "end", "font-size": 11}, "σ(z) = 0,9: h = " + f(h90, 2)); }
  if (ipo0 <= 30) { el("path", {d: `M${X(ipo0) - 6},${230 - 12}L${X(ipo0) + 6},${230 - 12}L${X(ipo0)},${230 - 2}Z`, fill: css("--muted")});
    el("text", {x: X(ipo0) + 8, y: 214, "font-size": 11, fill: css("--muted")}, "IPO-min h = " + f(ipo0, 2)); }
  ROWS.forEach((r, i) => { const v = D(r.h, b), on = i === sel;
    el("circle", {cx: X(r.h), cy: YA(v), r: on ? 7 : 5, fill: on ? css("--hl2") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.8}); });
  let st = `β = ${f(b, 3)}: σ(z) = 0,9-hez h = ln 9/β = ${f(h90, 2)}${h90 > 30 ? " (a tengelyen kívül)" : ""}; IPO-cél h = 1/(2β) = ${f(ipo0, 2)}.`;
  st += " Labor-pontok: " + ROWS.map(r => f(D(r.h, b), 4)).join(" / ") + ".";
  document.getElementById("status").textContent = st;
  const card = document.getElementById("card");
  if (sel < 0) card.textContent = "Kattints egy labor-párra a táblázatsorhoz.";
  else { const r = ROWS[sel], z = b * r.h;
    card.textContent = `${r.n}: chosen logp ${f(r.lc, 1)}, rejected logp ${f(r.lr, 1)}, ref ${f(r.rc, 1)} / ${f(r.rr, 1)} → chosen_ratio ${f(r.lc - r.rc, 1)}, rejected_ratio ${f(r.lr - r.rr, 1)}, h = ${f(r.h, 1)}, z = ${f(z, 3)}, −log σ(z) = ${f(D(r.h, b), 4)}`; }
}
const pe = document.getElementById("pairs");
ROWS.forEach((r, i) => { const bt = document.createElement("button"); bt.textContent = r.n; bt.setAttribute("aria-pressed", "false");
  bt.onclick = () => { sel = sel === i ? -1 : i; pe.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-pressed", String(j === sel))); draw(); }; pe.appendChild(bt); });
document.getElementById("b").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
