<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hálózati zónák és forgalmi szabályok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#f2f2f2;--cellhl:#d9d9d9;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--cellhl:#4a4a4a;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg g.z{cursor:pointer}
svg g.z:focus{outline:none}
svg g.z:focus rect{stroke-width:4}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Szűrés zóna szerint">
  <span>Zóna (kattintás vagy Enter a dobozon):</span>
  <button id="all" aria-pressed="true">minden él</button>
  <button id="atk">Támadási forgatókönyv ▶</button>
  <button id="atkp">◀</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="-4 -10 740 480" role="img" aria-label="Hálózati zónák: az alkalmazás/orchestrator hívja a modellszolgáltatást (HTTPS), a vektorindexet (HTTPS/gRPC) és az eszköz-réteget (HTTPS/JSON-RPC); az eszköz-réteg éri el az adatbázist (TCP/5432); kifelé csak az egress-proxy allowlistje enged. A modellszolgáltatásból és a sandboxból induló kapcsolatok tiltottak."></svg>
<p class="small">Fiktív, kisméretű rendszer; nem valós topológia. A zónatábla T-L8-005 szerint javított változata
(a modellszolgáltatás nem kezdeményez kapcsolatot; eszközt és indexet az alkalmazásréteg hív). Folytonos nyíl = allow,
szaggatott nyíl + ✗ = deny.</p>
<script>
const Z = {"model": {"x": 138.65, "y": 204.45, "w": 103.4, "h": 51.7, "t": "modell-\nszolgáltatás"}, "app": {"x": 305.5, "y": 204.45, "w": 108.1, "h": 51.7, "t": "alkalmazás /\norchestrator"}, "vector": {"x": 305.5, "y": 63.44999999999996, "w": 108.1, "h": 51.7, "t": "vektorindex"}, "tool": {"x": 477.05, "y": 204.45, "w": 108.1, "h": 51.7, "t": "eszköz-réteg"}, "db": {"x": 477.05, "y": 373.65, "w": 108.1, "h": 51.7, "t": "adatbázis"}, "proxy": {"x": 566.35, "y": 63.44999999999996, "w": 56.4, "h": 51.7, "t": "egress-\nproxy"}, "internet": {"x": 646.25, "y": 63.44999999999996, "w": 82.25, "h": 51.7, "t": "internet"}, "sandbox": {"x": 0.0, "y": 392.45, "w": 115.15, "h": 51.7, "t": "sandbox-\nfutókörnyezet"}}, IN = {"x": 126.9, "y": 35.25, "w": 467.65, "h": 439.45}, E = [{"a": "app", "b": "model", "p": "HTTPS", "ok": true, "note": "", "pts": [[305.5, 230.3], [242.1, 230.3]], "lab": [272.6, 216.2, "center"], "x": null}, {"a": "app", "b": "vector", "p": "HTTPS/gRPC", "ok": true, "note": "", "pts": [[359.6, 204.4], [359.6, 115.1]], "lab": [366.6, 159.8, "left"], "x": null}, {"a": "app", "b": "tool", "p": "HTTPS/JSON-RPC", "ok": true, "note": "a modell javaslatára", "pts": [[413.6, 230.3], [477.1, 230.3]], "lab": [444.1, 282.0, "center"], "x": null}, {"a": "tool", "b": "db", "p": "TCP/5432", "ok": true, "note": "csak szűrt, predefiniált kérés", "pts": [[531.1, 256.1], [531.1, 373.6]], "lab": [526.4, 347.8, "right"], "x": null}, {"a": "app", "b": "proxy", "p": "HTTPS", "ok": true, "note": "", "pts": [[413.6, 212.2], [566.4, 99.6]], "lab": [470.0, 141.0, "center"], "x": null}, {"a": "proxy", "b": "internet", "p": "HTTPS", "ok": true, "note": "csak allowlist: külső modell-API, hitelesítéssel", "pts": [[622.8, 89.3], [646.2, 89.3]], "lab": [686.2, 150.4, "center"], "x": null}, {"a": "model", "b": "db", "p": "TCP/5432", "ok": false, "note": "", "pts": [[200.7, 256.1], [477.1, 399.5]], "lab": [296.1, 357.2, "right"], "x": [329.0, 329.0]}, {"a": "model", "b": "vector", "p": "bármilyen", "ok": false, "note": "modell → bármely belső zóna", "pts": [[200.7, 204.4], [305.5, 89.3]], "lab": [227.9, 117.5, "right"], "x": [244.4, 150.4]}, {"a": "model", "b": "internet", "p": "HTTPS", "ok": false, "note": "minden más zóna → internet", "pts": [[159.3, 204.4], [159.3, 47.0], [594.6, 47.0], [594.6, 63.4]], "lab": [404.2, 18.8, "center"], "x": [263.2, 47.0]}, {"a": "sandbox", "b": "inner", "p": "bármilyen", "ok": false, "note": "→ belső hálózat", "pts": [[115.2, 418.3], [216.2, 418.3]], "lab": [166.8, 385.4, "center"], "x": [150.4, 418.3]}], ATK = [{"z": "model", "e": -1, "msg": "1/5 – Kiindulás: a modellszolgáltatás kompromittálódott (pl. sérülékeny szolgáltatáskód); a támadó innen próbál adatot elérni."}, {"z": "model", "e": 6, "msg": "2/5 – Közvetlen adatbázis-kapcsolat (TCP/5432): a szegmenshatár tűzfala eldobja – deny. A modellnek nincs adatbázis-jelszava sem."}, {"z": "model", "e": 7, "msg": "3/5 – Kapcsolat a vektorindex (vagy az eszköz-réteg) felé: deny – a modellszolgáltatás belső zónát nem hívhat; indexet és eszközt csak az alkalmazás/orchestrator hív, a hívó identitásával és a mátrix ellenőrzésével."}, {"z": "model", "e": 8, "msg": "4/5 – Kiszivárogtatás az internetre: az egress-proxy allowlistje csak a hitelesített modell-API-t engedi, ez a forrás nincs rajta – deny."}, {"z": "model", "e": -2, "msg": "5/5 – Eredmény: a kérés minden úton elakad; a kár a modellszolgáltatás saját zónájára korlátozódik (a blokkolt próbálkozások a naplóban riasztást adnak)."}];
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const NAMES = {app:"alkalmazás/orchestrator", model:"modell-szolgáltatás", vector:"vektorindex", tool:"eszköz-réteg", db:"adatbázis", proxy:"egress-proxy", internet:"internet", sandbox:"sandbox-futókörnyezet"};
let sel = null, atk = -1;
function draw(){
  svg.innerHTML = "";
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`;
  el("rect", {x: IN.x, y: IN.y, width: IN.w, height: IN.h, fill: "none", stroke: css("--fg"), "stroke-dasharray": "8 4"});
  el("text", {x: IN.x + 6, y: IN.y + IN.h - 8, "font-size": 12, "font-style": "italic", fill: css("--muted")}, "belső hálózat (szegmentált zónák)");
  const step = atk >= 0 ? ATK[atk] : null;
  E.forEach((e, i) => {
    let vis = sel ? e.a === sel : true;
    if (step) vis = (step.e === -2) ? !e.ok && e.a === "model" : i === step.e;
    if (!vis && !(step && step.e === -1)) return;
    if (step && step.e === -1) return;
    const act = step && (i === step.e || step.e === -2);
    const col = act ? css("--hl2") : css("--fg");
    el("polyline", {points: e.pts.map(q => q.join(",")).join(" "), fill: "none", stroke: col, "stroke-width": act ? 3 : (e.ok ? 2 : 1.6), "stroke-dasharray": e.ok ? "none" : "7 4", "marker-end": act ? "url(#ah2)" : "url(#ah)"});
    if (e.x) { el("circle", {cx: e.x[0], cy: e.x[1], r: 10, fill: css("--bg"), stroke: col}); el("text", {x: e.x[0], y: e.x[1] + 6, "text-anchor": "middle", "font-size": 17, "font-weight": "bold", fill: col}, "✗"); }
    const anc = {left: "start", right: "end", center: "middle"}[e.lab[2]];
    el("text", {x: e.lab[0], y: e.lab[1] + 4, "text-anchor": anc, "font-size": 11, "font-style": e.ok ? "normal" : "italic", stroke: css("--bg"), "stroke-width": 3, "paint-order": "stroke"}, e.p + (e.ok ? "" : " – deny"));
  });
  for (const k in Z) {
    const z = Z[k], g = el("g", {class: "z", tabindex: 0, role: "button", "aria-label": `${NAMES[k]}: kimenő élek mutatása`});
    const on = sel === k || (step && k === "model");
    el("rect", {x: z.x, y: z.y, width: z.w, height: z.h, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": k === "sandbox" ? "3 3" : "none"}, undefined, g);
    z.t.split("\n").forEach((t, j, a) => el("text", {x: z.x + z.w / 2, y: z.y + z.h / 2 + 5 + (j - (a.length - 1) / 2) * 15, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, t, g));
    g.addEventListener("click", () => pick(k));
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(k); } });
  }
  const st = document.getElementById("status");
  if (step) st.textContent = step.msg;
  else if (sel) { const out = E.filter(e => e.a === sel); st.textContent = `${NAMES[sel]} → ` + (out.length ? out.map(e => `${NAMES[e.b] || "belső hálózat"} (${e.p}): ${e.ok ? "allow" : "deny"}`).join("; ") : "nincs kimenő él (csak válaszol)"); }
  else st.textContent = `Minden él: ${E.filter(e => e.ok).length} allow, ${E.filter(e => !e.ok).length} deny. Kattints egy zónára a kimenő éleihez.`;
  document.getElementById("all").setAttribute("aria-pressed", sel === null && atk < 0 ? "true" : "false");
}
function pick(k){ atk = -1; sel = sel === k ? null : k; draw(); }
document.getElementById("all").onclick = () => { sel = null; atk = -1; draw(); };
document.getElementById("atk").onclick = () => { sel = null; atk = Math.min(ATK.length - 1, atk + 1); draw(); };
document.getElementById("atkp").onclick = () => { sel = null; atk = Math.max(-1, atk - 1); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
