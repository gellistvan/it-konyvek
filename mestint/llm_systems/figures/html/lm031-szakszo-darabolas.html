<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szakszavak darabolása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--t0:#fff;--t1:#d0d0d0;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--t0:#262626;--t1:#555;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:8px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=text]{font:inherit;width:16em;background:var(--bg);color:var(--fg);border:1px solid var(--muted);padding:2px 4px}
button{font:inherit;padding:3px 10px;cursor:pointer}
.row{margin:6px 0 10px}
.w{font-weight:bold}
.band{display:flex;align-items:center;gap:8px;margin:2px 0;flex-wrap:wrap}
.lab{width:6.5em;font-size:12px;color:var(--muted)}
.tok{display:inline-block;border:1px solid var(--line);padding:1px 4px;font:13px ui-monospace,monospace;margin-right:-1px}
.tok.o{background:var(--t1);background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(127,127,127,.35) 5px 6px)}
.tok.e{background:var(--t0)}
.cnt{font-size:12px}
#status{margin:4px 0 6px;min-height:1.6em}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
<label>saját szó <input id="w" type="text" value="" placeholder="pl. kardiológusok" aria-label="Saját szó a daraboláshoz"></label>
<button id="add">Hozzáad</button>
<span role="group" aria-label="Domain-változat">domain-változat:
<button id="v0" aria-pressed="false">kis (16k-analógia)</button>
<button id="v1" aria-pressed="true">nagy (32k-analógia)</button></span>
</div>
<div id="status" aria-live="polite"></div>
<div id="rows"></div>
<p class="small">Játék-BPE (a figura-szkriptben tanított összevonások sorrendben alkalmazva), nem a labor tokenizálói és nem mért eredmény. Váltakozó kitöltés: szomszédos tokenek határa. A kezdőállapot a statikus ábra négy szava a „nagy” domain-változattal.</p>
<script>
const MB = [["t", "h"], ["a", "r"], ["a", "t"], ["i", "c"], ["i", "n"], ["o", "n"], ["a", "s"], ["e", "r"], ["o", "g"], ["o", "r"], ["a", "n"], ["i", "s"], ["a", "l"], ["c", "ar"], ["l", "og"], ["a", "c"], ["u", "g"], ["e", "n"], ["i", "on"], ["d", "i"], ["t", "ion"], ["ac", "tion"], ["in", "t"], ["b", "e"], ["i", "t"], ["r", "ug"], ["d", "rug"], ["int", "er"], ["inter", "action"], ["en", "t"], ["th", "e"], ["an", "d"], ["o", "f"], ["t", "o"], ["car", "di"], ["ic", "al"], ["th", "at"], ["o", "log"], ["olog", "y"], ["f", "or"], ["w", "i"], ["wi", "th"], ["w", "as"], ["r", "o"], ["b", "y"], ["th", "is"], ["h", "a"], ["e", "s"], ["ar", "e"], ["ro", "m"], ["p", "at"], ["pat", "i"], ["pati", "ent"], ["m", "e"], ["f", "rom"], ["car", "e"], ["v", "e"], ["ha", "ve"], ["o", "t"], ["n", "ot"], ["w", "h"], ["wh", "ic"], ["whic", "h"], ["h", "as"], ["v", "ic"], ["s", "er"], ["ser", "vic"], ["h", "e"], ["he", "al"], ["heal", "th"], ["drug", "s"], ["me", "d"], ["interaction", "s"], ["r", "e"], ["cardi", "ology"], ["ar", "d"], ["cardi", "ac"], ["log", "ic"], ["log", "ical"], ["i", "ology"], ["be", "t"], ["b", "iology"], ["ug", "ar"], ["s", "ugar"], ["di", "a"], ["dia", "bet"], ["diabet", "es"], ["g", "y"], ["e", "m"], ["patient", "s"], ["or", "d"], ["ord", "er"], ["é", "s"], ["t", "re"], ["tre", "at"], ["treat", "m"], ["treatm", "ent"], ["s", "p"], ["sp", "it"], ["spit", "al"], ["o", "spital"], ["h", "ospital"], ["a", "z"], ["servic", "e"], ["servic", "es"], ["og", "y"], ["h", "ogy"], ["g", "ard"], ["gard", "en"], ["n", "em"], ["med", "ical"], ["med", "ic"], ["medic", "in"], ["medicin", "e"], ["l", "in"], ["lin", "ical"], ["e", "gy"], ["c", "linical"], ["á", "r"], ["v", "an"], ["o", "l"], ["car", "d"], ["me", "g"], ["h", "ard"], ["d", "e"], ["s", "z"], ["e", "z"], ["b", "order"], ["a", "k"], ["m", "ár"], ["at", "ion"], ["á", "s"], ["s", "ak"], ["in", "g"], ["garden", "ing"], ["g", "on"], ["c", "u"], ["c", "sak"], ["v", "ol"], ["vol", "t"], ["g", "o"], ["a", "go"], ["m", "int"], ["m", "a"], ["gon", "e"], ["cu", "re"], ["b", "an"], ["t", "ation"], ["s", "tation"], ["ü", "gy"], ["é", "g"], ["á", "ro"], ["áro", "s"], ["á", "g"], ["v", "áros"], ["sz", "ág"], ["sz", "er"], ["or", "szág"], ["ol", "a"], ["o", "k"], ["n", "ation"], ["ma", "gy"], ["magy", "ar"], ["m", "ég"], ["k", "ár"], ["k", "ola"], ["is", "kola"], ["h", "at"], ["hat", "ás"], ["em", "b"], ["emb", "er"], ["e", "g"], ["s", "e"], ["se", "cure"], ["re", "action"], ["l", "l"], ["k", "e"], ["ke", "ll"], ["care", "er"], ["action", "s"], ["ügy", "es"], ["ü", "t"], ["üt", "em"], ["ütem", "é"], ["ütemé", "n"], ["ütemén", "y"], ["ó", "k"], ["és", "z"], ["ész", "en"], ["é", "p"], ["á", "z"], ["áz", "ak"], ["y", "a"], ["város", "ban"], ["u", "t"], ["ut", "ók"], ["u", "n"], ["un", "k"], ["unk", "ás"], ["u", "l"], ["ul", "ás"], ["t", "ya"], ["t", "an"], ["tan", "ulás"], ["szer", "int"], ["szer", "d"], ["szerd", "a"], ["sz", "ép"], ["s", "ütemény"], ["ország", "ban"], ["ol", "at"], ["magyar", "ok"], ["m", "unkás"], ["m", "in"], ["min", "d"], ["mind", "en"], ["l", "es"], ["les", "z"], ["kár", "tya"], ["k", "or"], ["iskola", "i"], ["hatás", "ok"], ["h", "ázak"], ["gon", "d"], ["gond", "olat"], ["ember", "e"], ["embere", "k"], ["eg", "észen"], ["cu", "kor"], ["bet", "eg"], ["b", "en"], ["al", "ma"], ["a", "utók"]], MD = [[["g", "y"], ["s", "z"], ["e", "g"], ["á", "s"], ["e", "t"], ["a", "t"], ["é", "g"], ["s", "ég"], ["et", "eg"], ["b", "eteg"], ["ö", "n"], ["ó", "gy"], ["ógy", "sz"], ["ógysz", "e"], ["ógysze", "r"], ["gy", "ógyszer"], ["e", "l"], ["é", "s"], ["ön", "h"], ["önh", "at"], ["önhat", "ás"], ["ö", "l"], ["öl", "c"], ["ölc", "s"], ["ölcs", "önhatás"], ["é", "sz"], ["ész", "ség"], ["n", "d"], ["k", "ölcsönhatás"], ["eg", "észség"], ["ó", "g"], ["r", "d"], ["rd", "i"], ["rdi", "o"], ["rdio", "l"], ["rdiol", "óg"], ["o", "k"], ["k", "a"], ["ka", "rdiológ"], ["a", "n"], ["ü", "gy"], ["z", "ás"], ["u", "k"], ["uk", "o"], ["uko", "r"]], [["g", "y"], ["s", "z"], ["e", "g"], ["á", "s"], ["e", "t"], ["a", "t"], ["é", "g"], ["s", "ég"], ["et", "eg"], ["b", "eteg"], ["ö", "n"], ["ó", "gy"], ["ógy", "sz"], ["ógysz", "e"], ["ógysze", "r"], ["gy", "ógyszer"], ["e", "l"], ["é", "s"], ["ön", "h"], ["önh", "at"], ["önhat", "ás"], ["ö", "l"], ["öl", "c"], ["ölc", "s"], ["ölcs", "önhatás"], ["é", "sz"], ["ész", "ség"], ["n", "d"], ["k", "ölcsönhatás"], ["eg", "észség"], ["ó", "g"], ["r", "d"], ["rd", "i"], ["rdi", "o"], ["rdio", "l"], ["rdiol", "óg"], ["o", "k"], ["k", "a"], ["ka", "rdiológ"], ["a", "n"], ["ü", "gy"], ["z", "ás"], ["u", "k"], ["uk", "o"], ["uko", "r"], ["ukor", "beteg"], ["o", "zás"], ["o", "nd"], ["ond", "ozás"], ["g", "ondozás"], ["el", "és"], ["egészség", "ügy"], ["e", "k"], ["c", "ukorbeteg"], ["á", "t"], ["kölcsönhatás", "ok"], ["kardiológ", "i"], ["át", "ás"], ["á", "l"], ["ál", "at"], ["z", "s"], ["zs", "g"], ["zsg", "álat"], ["z", "elés"], ["v", "i"], ["vi", "zsgálat"], ["l", "átás"], ["kardiológi", "a"], ["k", "e"], ["ke", "zelés"], ["el", "látás"], ["beteg", "ség"], ["b", "an"], ["v", "an"], ["o", "gy"]]], WORDS = ["egészségügyben", "gyógyszerkölcsönhatásokat", "kardiológiai", "cukorbeteg-gondozás"];
let words = WORDS.slice(), v = 1;
function seg(w, merges){ let s = Array.from(w);
  for (const [a, b] of merges) { const o = []; let i = 0;
    while (i < s.length) { if (i + 1 < s.length && s[i] === a && s[i + 1] === b) { o.push(a + b); i += 2; } else { o.push(s[i]); i += 1; } }
    s = o; }
  return s; }
const f = (x, d) => x.toFixed(d).replace(".", ",");
function band(lab, toks){ const d = document.createElement("div"); d.className = "band";
  const l = document.createElement("span"); l.className = "lab"; l.textContent = lab; d.appendChild(l);
  const g = document.createElement("span"); toks.forEach((t, j) => { const s = document.createElement("span"); s.className = "tok " + (j % 2 ? "o" : "e"); s.textContent = t; g.appendChild(s); }); d.appendChild(g);
  const c = document.createElement("span"); c.className = "cnt"; c.textContent = toks.length + " token"; d.appendChild(c); return d; }
function draw(){
  const box = document.getElementById("rows"); box.innerHTML = "";
  let sb = 0, sd = 0;
  words.forEach(w => { const a = seg(w, MB), b = seg(w, MD[v]); sb += a.length; sd += b.length;
    const r = document.createElement("div"); r.className = "row"; const h = document.createElement("div"); h.className = "w"; h.textContent = w; r.appendChild(h);
    r.appendChild(band("általános", a)); r.appendChild(band("domain", b)); box.appendChild(r); });
  document.getElementById("v0").setAttribute("aria-pressed", String(v === 0)); document.getElementById("v1").setAttribute("aria-pressed", String(v === 1));
  document.getElementById("status").textContent = `${words.length} szó; átlagos tokenszám szavanként (fertilitás): általános ${f(sb / words.length, 2)}, domain (${v ? "nagy" : "kis"}) ${f(sd / words.length, 2)}.`;
}
document.getElementById("add").onclick = () => { const w = document.getElementById("w").value.trim().toLowerCase(); if (w) { words.push(w); document.getElementById("w").value = ""; draw(); } };
document.getElementById("w").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("add").click(); });
document.getElementById("v0").onclick = () => { v = 0; draw(); };
document.getElementById("v1").onclick = () => { v = 1; draw(); };
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
