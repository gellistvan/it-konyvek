<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Összeomlás és újraindítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Összeomlás helye:</span> <label><input type="radio" name="wh" value="before" onchange="upd()"> hívás előtt</label> <label><input type="radio" name="wh" value="between" checked onchange="upd()"> hívás után, mentés előtt</label> <label><input type="radio" name="wh" value="after" onchange="upd()"> mentés után</label> <label><input type="checkbox" id="sup" checked onchange="upd()"> kulcsos idempotencia támogatott</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal: v1 mentés, külső hívás 22,5-tel a külső naplóban, összeomlás a mentés előtt, újraindítás a v1-ből és egyeztetés; alatta a döntési fa a completed, retry_safe és unknown_outcome ággal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 17.3.6 crash-demó függvényeinek átirata (mock eszköz, nem mérés). Kulcstámogatás nélkül a külső rendszer végrehajtja a hatást, de nem naplózza a request_id-t, ezért a reconcile nem tud dönteni: unknown_outcome. A kódpanel a demó releváns sorait mutatja.</p>
<script>

let STEPS = [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. call_tool_idempotent(sha256(\"crash-demo:temperature:Budapest\") = 19ef5833…) → 22,5; a külső napló rögzíti a kulcsot.", "line": 1, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "call"}, {"msg": "3. SimulatedCrash a hívás után, a mentés ELŐTT: a checkpoint még v1.", "line": 2, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "4. Újraindítás: load_latest_checkpoint → v1 (completed_steps = []).", "line": 4, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "load"}, {"msg": "5. reconcile(\"temperature:Budapest\", supports_key=True) → \"completed\".", "line": 5, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "reconcile"}, {"msg": "6. A válasz (22,5) visszaolvasva a külső naplóból; a lépés kész, v2 mentés.", "line": 8, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "save"}, {"msg": "7. Ismételt hívás ugyanazzal a kulccsal → 22.5 a naplóból; a külső napló továbbra is 1 bejegyzés.", "line": 9, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "call"}];

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = {"before|1": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. SimulatedCrash a hívás ELŐTT: külső hatás nem történt.", "line": 2, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "3. Újraindítás: load_latest_checkpoint → v1 (completed_steps = []).", "line": 4, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "load"}, {"msg": "4. reconcile(\"temperature:Budapest\", supports_key=True) → \"retry_safe\".", "line": 6, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": "retry_safe", "phase": "reconcile"}, {"msg": "5. A kulcs nincs a naplóban, de a rendszer kulcsos: biztonságos újrafuttatás, majd v2 mentés.", "line": 9, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "retry_safe", "phase": "call"}], "before|0": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. SimulatedCrash a hívás ELŐTT: külső hatás nem történt.", "line": 2, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "3. Újraindítás: load_latest_checkpoint → v1 (completed_steps = []).", "line": 4, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "load"}, {"msg": "4. reconcile(\"temperature:Budapest\", supports_key=False) → \"unknown_outcome\".", "line": 7, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": "unknown_outcome", "phase": "reconcile"}, {"msg": "5. unknown_outcome: tilos vakon újrapróbálni → kompenzáló művelet vagy emberi döntés.", "line": 7, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": "unknown_outcome", "phase": "stop"}], "between|1": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. call_tool_idempotent(sha256(\"crash-demo:temperature:Budapest\") = 19ef5833…) → 22,5; a külső napló rögzíti a kulcsot.", "line": 1, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "call"}, {"msg": "3. SimulatedCrash a hívás után, a mentés ELŐTT: a checkpoint még v1.", "line": 2, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "4. Újraindítás: load_latest_checkpoint → v1 (completed_steps = []).", "line": 4, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "load"}, {"msg": "5. reconcile(\"temperature:Budapest\", supports_key=True) → \"completed\".", "line": 5, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "reconcile"}, {"msg": "6. A válasz (22,5) visszaolvasva a külső naplóból; a lépés kész, v2 mentés.", "line": 8, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "save"}, {"msg": "7. Ismételt hívás ugyanazzal a kulccsal → 22.5 a naplóból; a külső napló továbbra is 1 bejegyzés.", "line": 9, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "completed", "phase": "call"}], "between|0": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. call_tool_idempotent(sha256(\"crash-demo:temperature:Budapest\") = 19ef5833…) → 22,5; a külső rendszer nem naplóz kulcsot.", "line": 1, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": null, "result": null, "phase": "call"}, {"msg": "3. SimulatedCrash a hívás után, a mentés ELŐTT: a checkpoint még v1.", "line": 2, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "4. Újraindítás: load_latest_checkpoint → v1 (completed_steps = []).", "line": 4, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": null, "result": null, "phase": "load"}, {"msg": "5. reconcile(\"temperature:Budapest\", supports_key=False) → \"unknown_outcome\".", "line": 7, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": null, "result": "unknown_outcome", "phase": "reconcile"}, {"msg": "6. unknown_outcome: tilos vakon újrapróbálni → kompenzáló művelet vagy emberi döntés.", "line": 7, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": null, "result": "unknown_outcome", "phase": "stop"}], "after|1": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. call_tool_idempotent(sha256(\"crash-demo:temperature:Budapest\") = 19ef5833…) → 22,5; a külső napló rögzíti a kulcsot.", "line": 1, "ck": [{"v": "v1", "done": []}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "call"}, {"msg": "3. v2 mentés: completed_steps = [\"temperature:Budapest\"].", "line": 3, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "save"}, {"msg": "4. SimulatedCrash a hívás után, a mentés UTÁN: a checkpoint már v2.", "line": 2, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "5. Újraindítás: load_latest_checkpoint → v2 (completed_steps = [\"temperature:Budapest\"]).", "line": 4, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": null, "phase": "load"}, {"msg": "6. A lépés a checkpointban már kész: nincs mit egyeztetni, a futás folytatódik.", "line": 4, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [["19ef5833…", 22.5]], "eff": 1, "mark": null, "result": "kész (checkpoint)", "phase": "done"}], "after|0": [{"msg": "1. v1 mentés: completed_steps = [] (kezdeti checkpoint).", "line": 0, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 0, "mark": null, "result": null, "phase": "save"}, {"msg": "2. call_tool_idempotent(sha256(\"crash-demo:temperature:Budapest\") = 19ef5833…) → 22,5; a külső rendszer nem naplóz kulcsot.", "line": 1, "ck": [{"v": "v1", "done": []}], "log": [], "eff": 1, "mark": null, "result": null, "phase": "call"}, {"msg": "3. v2 mentés: completed_steps = [\"temperature:Budapest\"].", "line": 3, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [], "eff": 1, "mark": null, "result": null, "phase": "save"}, {"msg": "4. SimulatedCrash a hívás után, a mentés UTÁN: a checkpoint már v2.", "line": 2, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [], "eff": 1, "mark": "crash", "result": null, "phase": "crash"}, {"msg": "5. Újraindítás: load_latest_checkpoint → v2 (completed_steps = [\"temperature:Budapest\"]).", "line": 4, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [], "eff": 1, "mark": null, "result": null, "phase": "load"}, {"msg": "6. A lépés a checkpointban már kész: nincs mit egyeztetni, a futás folytatódik.", "line": 4, "ck": [{"v": "v1", "done": []}, {"v": "v2", "done": ["temperature:Budapest"]}], "log": [], "eff": 1, "mark": null, "result": "kész (checkpoint)", "phase": "done"}]};
let WH = "between", SUP = 1;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const lanes = [["Agent + checkpointtár", 20], ["Külső napló", 150]];
  el("text", {x: 10, y: 16, "font-size": 13, "font-weight": "bold"}, "Checkpointtár");
  el("rect", {x: 10, y: 24, width: 360, height: 26, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 18, y: 42, "font-size": 12, "font-weight": "bold"}, "verzió");
  el("text", {x: 90, y: 42, "font-size": 12, "font-weight": "bold"}, "completed_steps");
  s.ck.forEach((c, i) => {
    const y = 50 + i * 26, last = i === s.ck.length - 1;
    el("rect", {x: 10, y, width: 360, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": last ? 2 : 1});
    el("text", {x: 18, y: y + 18, "font-size": 12, "font-family": "monospace"}, c.v);
    el("text", {x: 90, y: y + 18, "font-size": 12, "font-family": "monospace"}, JSON.stringify(c.done));
  });
  el("text", {x: 400, y: 16, "font-size": 13, "font-weight": "bold"}, "Külső rendszer naplója");
  el("rect", {x: 400, y: 24, width: 350, height: 26, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 408, y: 42, "font-size": 12, "font-weight": "bold"}, "request_id");
  el("text", {x: 600, y: 42, "font-size": 12, "font-weight": "bold"}, "válasz");
  s.log.forEach((r, i) => {
    const y = 50 + i * 26;
    el("rect", {x: 400, y, width: 350, height: 26, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 408, y: y + 18, "font-size": 12, "font-family": "monospace"}, r[0]);
    el("text", {x: 600, y: y + 18, "font-size": 12, "font-family": "monospace"}, String(r[1]).replace(".", ","));
  });
  if (!s.log.length) el("text", {x: 408, y: 68, "font-size": 12, fill: css("--muted")}, SUP ? "(üres)" : "(a rendszer nem naplóz kulcsot)");
  el("text", {x: 400, y: 140, "font-size": 12.5}, `Ténylegesen végrehajtott külső hatások: ${s.eff}`);
  if (s.mark === "crash") {
    el("polygon", {points: "330,135 352,135 340,150 356,150 322,182 334,158 316,158", fill: css("--hl2")});
    el("text", {x: 210, y: 160, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "SimulatedCrash");
  }
  // döntési fa
  const R = s.result, ty = 205;
  const node = (x, y, w, t, on, dash, dbl) => {
    el("rect", {x: x - w / 2, y: y - 16, width: w, height: 32, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": dash ? "6 3" : "none"});
    if (dbl) el("rect", {x: x - w / 2 + 4, y: y - 12, width: w - 8, height: 24, rx: 4, fill: "none", stroke: on ? css("--hl2") : css("--line")});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal"}, t);
  };
  const ln = (x0, y0, x1, y1, t) => { el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--fg")}); el("text", {x: (x0 + x1) / 2 + 5, y: (y0 + y1) / 2, "font-size": 11, "font-style": "italic"}, t); };
  const act = R && R !== "kész (checkpoint)";
  ln(180, ty + 16, 120, ty + 84, "igen"); ln(270, ty, 420, ty, "nem"); ln(470, ty + 16, 420, ty + 84, "igen"); ln(560, ty + 16, 640, ty + 84, "nem");
  node(180, ty, 220, "kulcs a külső naplóban?", act, false, false);
  node(520, ty, 250, "kulcsos idempotencia?", act && R !== "completed", false, false);
  node(120, ty + 100, 200, "completed", R === "completed", false, false);
  node(420, ty + 100, 180, "retry_safe", R === "retry_safe", true, false);
  node(650, ty + 100, 200, "unknown_outcome", R === "unknown_outcome", false, true);
  if (R === "kész (checkpoint)") el("text", {x: 10, y: 186, "font-size": 12.5, "font-weight": "bold", fill: css("--hl")}, "A checkpoint (v2) már tartalmazza a lépést: nincs reconcile.");
  else el("text", {x: 10, y: 186, "font-size": 12.5, fill: css("--hl")}, "reconcile → " + (R ? `"${R}"` : "(még nem futott)"));
}
function upd(){
  WH = document.querySelector('input[name="wh"]:checked').value;
  SUP = document.getElementById("sup").checked ? 1 : 0;
  setSteps(SETS[WH + "|" + SUP]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
