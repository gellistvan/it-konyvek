<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSH S-görbe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:180px}
#status{margin:4px 0 6px;min-height:2.9em}
.wrap{display:flex;flex-wrap:wrap;gap:10px}
svg{width:100%;height:auto;display:block}
#v{flex:3 1 380px}#h{flex:2 1 220px}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="LSH paraméterek">
  <label>k = <select id="k" aria-label="Hash-függvények száma"><option>64</option><option selected>128</option><option>256</option></select></label>
  <label>b (sávok) <input id="b" type="range" min="0" max="7" step="1" value="4" aria-label="Sávok száma"><b id="bv"></b></label>
  <button id="sim">Szimuláció: 1000 MinHash-becslés (J = 9/11)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 420 320" role="img" aria-label="Az LSH S-görbéje: a jelöltté válás valószínűsége a Jaccard-hasonlóság függvényében; a referencia-görbék b=16,r=8; b=8,r=16; b=32,r=4."></svg>
<svg id="h" viewBox="0 0 260 320" role="img" aria-label="A becsült Jaccard-hasonlóság hisztogramja a szimuláció után."></svg>
</div>
<p class="small">P(jelölt) = 1 − (1 − s<sup>r</sup>)<sup>b</sup>, küszöb ≈ (1/b)<sup>1/r</sup>, b·r = k. Szürke: a három referencia-sávozás (k = 128).
A szimuláció valódi véletlen permutációkat használ a 11 elemű A∪B halmazon (|A∩B| = 9), rögzített seeddel; determinisztikus számlálás, nem időmérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
function mk(svg, tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",");
const V = document.getElementById("v"), H = document.getElementById("h"), JF = 9 / 11;
const P = (s, b, r) => 1 - Math.pow(1 - Math.pow(s, r), b);
const divs = k => { const o = []; for (let b = 1; b <= k; b++) if (k % b === 0) o.push(b); return o; };
const L = 46, R = 405, T = 10, B = 280, X = s => L + (R - L) * s, Y = p => B - (B - T) * p;
let simData = null;
function mulberry32(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function bOpts(){ const k = +document.getElementById("k").value, d = divs(k); const sl = document.getElementById("b");
  sl.max = d.length - 1; return d; }
function draw(){
  const k = +document.getElementById("k").value, d = bOpts(), sl = document.getElementById("b");
  const b = d[Math.min(+sl.value, d.length - 1)], r = k / b;
  document.getElementById("bv").textContent = `${b}  (r = ${r})`;
  V.innerHTML = "";
  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(v => { mk(V, "line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")});
    mk(V, "text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 1));
    mk(V, "text", {x: X(v), y: B + 15, "text-anchor": "middle", "font-size": 11}, f(v, 1)); });
  mk(V, "text", {x: (L + R) / 2, y: B + 33, "text-anchor": "middle", "font-size": 12}, "Jaccard-hasonlóság s");
  mk(V, "text", {x: 12, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 12 ${(T + B) / 2})`}, "P(jelölt)");
  const path = (bb, rr) => { let p = ""; for (let i = 0; i <= 200; i++) { const s = i / 200; p += (p ? "L" : "M") + X(s).toFixed(1) + "," + Y(P(s, bb, rr)).toFixed(1); } return p; };
  [[16, 8, ""], [8, 16, "7 4"], [32, 4, "2 3"]].forEach(c => mk(V, "path", {d: path(c[0], c[1]), fill: "none", stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": c[2]}));
  mk(V, "line", {x1: X(0.8), y1: T, x2: X(0.8), y2: B, stroke: css("--fg"), "stroke-dasharray": "6 4"});
  mk(V, "line", {x1: X(JF), y1: T, x2: X(JF), y2: B, stroke: css("--hl2"), "stroke-dasharray": "8 3 2 3"});
  mk(V, "path", {d: path(b, r), fill: "none", stroke: css("--hl"), "stroke-width": 3});
  const th = Math.pow(1 / b, 1 / r), pj = P(JF, b, r);
  mk(V, "circle", {cx: X(th), cy: Y(P(th, b, r)), r: 5, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2});
  mk(V, "rect", {x: X(JF) - 5, y: Y(pj) - 5, width: 10, height: 10, fill: css("--hl2")});
  mk(V, "text", {x: X(JF) - 8, y: Math.max(24, Y(pj) - 8), "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, f(pj, 3));
  let msg = `k = ${k}, b = ${b}, r = ${r}: küszöb ≈ (1/b)^(1/r) = ${f(th, 3)}; a J = 9/11 ≈ 0,818 pár ${f(pj, 3)} valószínűséggel lesz jelölt.`;
  if (simData && simData.k === k) msg += ` Szimuláció: Ĵ < 0,8 az esetek ${f(simData.frac, 3)} részében.`;
  document.getElementById("status").textContent = msg;
  drawHist(k);
}
function drawHist(k){
  H.innerHTML = "";
  mk(H, "text", {x: 130, y: 16, "text-anchor": "middle", "font-size": 12}, "Ĵ hisztogram (J = 9/11)");
  if (!simData || simData.k !== k) { mk(H, "text", {x: 130, y: 160, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "nincs szimuláció ehhez a k-hoz"); return; }
  const lo = 0.6, hi = 1.0, nb = 20, cnt = new Array(nb).fill(0);
  simData.v.forEach(x => { const i = Math.min(nb - 1, Math.max(0, Math.floor((x - lo) / (hi - lo) * nb))); cnt[i]++; });
  const mx = Math.max(...cnt), hx = x => 20 + 225 * (x - lo) / (hi - lo), hy = c => 280 - 240 * c / mx;
  cnt.forEach((c, i) => { const x0 = lo + (hi - lo) * i / nb, below = x0 < 0.8 - 1e-9;
    mk(H, "rect", {x: hx(x0), y: hy(c), width: 225 / nb - 1, height: 280 - hy(c), fill: below ? css("--hl2") : css("--grid"), stroke: css("--line"), "stroke-width": 0.5}); });
  [0.6, 0.7, 0.8, 0.9, 1.0].forEach(v => mk(H, "text", {x: hx(v), y: 296, "text-anchor": "middle", "font-size": 11}, f(v, 1)));
  mk(H, "line", {x1: hx(0.8), y1: 30, x2: hx(0.8), y2: 280, stroke: css("--fg"), "stroke-dasharray": "6 4"});
  mk(H, "text", {x: 130, y: 314, "text-anchor": "middle", "font-size": 11}, `Ĵ < 0,8: ${f(simData.frac, 3)} (narancs)`);
}
document.getElementById("sim").onclick = () => {
  const k = +document.getElementById("k").value, rnd = mulberry32(20261118), v = [];
  for (let n = 0; n < 1000; n++) { let hit = 0;
    for (let j = 0; j < k; j++) { let best = 1e9, arg = -1;
      for (let e = 0; e < 11; e++) { const h = rnd(); if (h < best) { best = h; arg = e; } }   // véletlen permutáció minimuma
      if (arg < 9) hit++; }
    v.push(hit / k); }
  simData = {k, v, frac: v.filter(x => x < 0.8).length / v.length}; draw();
};
document.getElementById("k").addEventListener("change", () => { const d = bOpts(), k = +document.getElementById("k").value;
  const want = Math.round(Math.sqrt(k) * 1.41); let best = 0; d.forEach((b, i) => { if (Math.abs(b - want) < Math.abs(d[best] - want)) best = i; });
  document.getElementById("b").value = d.indexOf(16) >= 0 ? d.indexOf(16) : best; draw(); });
document.getElementById("b").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
