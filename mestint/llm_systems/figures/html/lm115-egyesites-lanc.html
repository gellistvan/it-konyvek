<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adapter egyesítése és kvantálás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc lépésből álló lánc: QLoRA, adapter mentése, float újratöltés, merge, egyesített modell, GGUF-konverzió, Q4_K_M kvantálás, kiszolgálás; három mérési pont és a tiltott NF4-merge út"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kódpanel a 30.3.4 egyesítő blokkja; a 0., 1. és 5–7. sor a szöveg lépéseinek összefoglaló megjegyzése. ①–③: mérési pontok ugyanazon a befagyasztott teszthalmazon. Méret: elméleti becslés, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1/8 – QLoRA-tanítás: a 4-bites (NF4) alapmodellen bf16 LoRA-adapter tanul. ① mérés: az adapteres (PEFT) modell.  dtype: NF4 alap + bf16 adapter; méret: —", "line": 0, "node": 0}, {"msg": "2/8 – Csak az adaptert mentjük; a kvantált alapmodellt nem egyesítjük.  dtype: bf16 adapter; méret: kis fájl (r = 16)", "line": 1, "node": 1}, {"msg": "3/8 – Tiszta alapmodell float dtype-pal, ugyanazzal a MODEL_ID-vel és REVISION-nel.  dtype: float16 / bfloat16; méret: ≈ 0,99 GB", "line": 5, "node": 2}, {"msg": "4/8 – Az adapter betöltése a float alapra, majd egyesítés.  dtype: float16; méret: ≈ 0,99 GB", "line": 13, "node": 3}, {"msg": "5/8 – Az egyesített float modell és a tokenizer mentése. ② mérés: egyesített float modell.  dtype: float16; méret: ≈ 0,99 GB", "line": 14, "node": 4}, {"msg": "6/8 – Konverzió GGUF formátumba, még kvantálás nélkül.  dtype: GGUF f16; méret: ≈ 0,99 GB", "line": 16, "node": 5}, {"msg": "7/8 – Kvantálás Q4_K_M szintre (a float16 méret kb. 25–30%-a). ③ mérés: kvantált modell.  dtype: GGUF Q4_K_M; méret: ≈ 0,25–0,30 GB", "line": 17, "node": 6}, {"msg": "8/8 – Kiszolgálás: vLLM a float modellel, Ollama/llama.cpp a GGUF-fal.  dtype: float16 / Q4_K_M; méret: —", "line": 18, "node": 7}];
const CODE = ["# 0. QLoRA: NF4 alapmodell + LoRA adapter (30.3.2 kódja)", "# 1. model.save_pretrained(\"./adapter\")  – csak az adapter", "# Az adapter egyesítése: tiszta alapmodell float dtype-pal, majd PeftModel", "from peft import PeftModel", "", "base = AutoModelForCausalLM.from_pretrained(", "    MODEL_ID,", "    revision=REVISION,", "    torch_dtype=torch.float16,  # vagy bfloat16, a hardver támogatása szerint", "    device_map=\"cpu\",           # az egyesítés CPU-n is elvégezhető", ")", "tokenizer = AutoTokenizer.from_pretrained(MODEL_ID, revision=REVISION)", "merged = PeftModel.from_pretrained(base, \"./adapter\")", "merged = merged.merge_and_unload()", "merged.save_pretrained(\"./merged_model\", safe_serialization=True)", "tokenizer.save_pretrained(\"./merged_model\")", "# 5. python convert_hf_to_gguf.py ./merged_model  → GGUF f16 (a llama.cpp szkriptje)", "# 6. kvantálás Q4_K_M szintre (a llama.cpp kvantáló segédeszközével)", "# 7. kiszolgálás: vLLM a float ./merged_model-lel, Ollama/llama.cpp a GGUF-fal"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = [{"t": "alapmodell NF4 (4 bit)\n+ LoRA adapter (bf16)", "dtype": "NF4 alap + bf16 adapter", "size": "—", "m": 1, "line": 0, "msg": "QLoRA-tanítás: a 4-bites (NF4) alapmodellen bf16 LoRA-adapter tanul. ① mérés: az adapteres (PEFT) modell."}, {"t": "adapter mentése\n./adapter", "dtype": "bf16 adapter", "size": "kis fájl (r = 16)", "m": 0, "line": 1, "msg": "Csak az adaptert mentjük; a kvantált alapmodellt nem egyesítjük."}, {"t": "alapmodell újratöltése\nfp16/bf16\nMODEL_ID + REVISION", "dtype": "float16 / bfloat16", "size": "≈ 0,99 GB", "m": 0, "line": 5, "msg": "Tiszta alapmodell float dtype-pal, ugyanazzal a MODEL_ID-vel és REVISION-nel."}, {"t": "PeftModel\n.from_pretrained\n+ merge_and_unload()", "dtype": "float16", "size": "≈ 0,99 GB", "m": 0, "line": 13, "msg": "Az adapter betöltése a float alapra, majd egyesítés."}, {"t": "./merged_model\n(fp16, safetensors)\n+ tokenizer", "dtype": "float16", "size": "≈ 0,99 GB", "m": 2, "line": 14, "msg": "Az egyesített float modell és a tokenizer mentése. ② mérés: egyesített float modell."}, {"t": "convert_hf_to_gguf.py\n→ GGUF f16", "dtype": "GGUF f16", "size": "≈ 0,99 GB", "m": 0, "line": 16, "msg": "Konverzió GGUF formátumba, még kvantálás nélkül."}, {"t": "kvantálás\nQ4_K_M", "dtype": "GGUF Q4_K_M", "size": "≈ 0,25–0,30 GB", "m": 3, "line": 17, "msg": "Kvantálás Q4_K_M szintre (a float16 méret kb. 25–30%-a). ③ mérés: kvantált modell."}, {"t": "kiszolgálás:\nvLLM (float) /\nOllama (GGUF)", "dtype": "float16 / Q4_K_M", "size": "—", "m": 0, "line": 18, "msg": "Kiszolgálás: vLLM a float modellel, Ollama/llama.cpp a GGUF-fal."}];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = "";
  const P = [[10,70],[168,70],[326,70],[484,70],[484,190],[326,190],[168,190],[10,190]], W = 146, H = 74;
  const arrow = (x1, y1, x2, y2, on, dash) => { el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": on ? 2.6 : 1.2, "stroke-dasharray": dash || ""});
    const a = Math.atan2(y2 - y1, x2 - x1); el("path", {d: `M${x2} ${y2} L${x2 - 9 * Math.cos(a - 0.4)} ${y2 - 9 * Math.sin(a - 0.4)} L${x2 - 9 * Math.cos(a + 0.4)} ${y2 - 9 * Math.sin(a + 0.4)} Z`, fill: css("--line")}); };
  for (let i = 0; i < 7; i++) { const [x0, y0] = P[i], [x1, y1] = P[i + 1], on = i < s.node;
    if (i === 3) arrow(x0 + W / 2, y0 + H, x1 + W / 2, y1, on);
    else if (i < 3) arrow(x0 + W, y0 + H / 2, x1, y1 + H / 2, on); else arrow(x0, y0 + H / 2, x1 + W, y1 + H / 2, on); }
  el("path", {d: `M${P[0][0] + 40} ${P[0][1]} C ${P[0][0] + 120} 4, ${P[3][0] - 40} 4, ${P[3][0] + 30} ${P[3][1] - 2}`, fill: "none", stroke: css("--muted"), "stroke-width": 1.4, "stroke-dasharray": "6 4"});
  el("rect", {x: 280, y: 4, width: 260, height: 26, fill: css("--bg")});
  el("text", {x: 300, y: 24, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "✗");
  el("text", {x: 318, y: 24, "font-size": 12}, "nem: NF4 súlyokba nem egyesítünk");
  NODES.forEach((n, i) => { const [x, y] = P[i], on = i === s.node, g = document.createElementNS(NS, "g"); svg.appendChild(g);
    const add = (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; g.appendChild(e); return e; };
    add("rect", {x, y, width: W, height: H, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : (n.m ? 2.2 : 1.2)});
    n.t.split("\n").forEach((t, j, a) => add("text", {x: x + W / 2, y: y + H / 2 + 4 + (j - (a.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11}, t));
    if (n.m) { add("circle", {cx: x + W - 4, cy: y - 2, r: 11, fill: css("--bg"), stroke: css("--line"), "stroke-width": 1.6});
               add("text", {x: x + W - 4, y: y + 2, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, String(n.m)); }
    g.style.cursor = "pointer"; g.addEventListener("click", () => show(i)); });
  const n = NODES[s.node];
  el("text", {x: 10, y: 288, "font-size": 12}, `dtype: ${n.dtype}   ·   méret (elméleti becslés, 0,5B modell): ${n.size}` + (n.m ? `   ·   mérési pont ${n.m}` : ""));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
