<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jutalom-túloptimalizálás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:220px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label>KL-együttható β <input id="b" type="range" min="-3" max="-0.3" step="0.01" value="-2" aria-label="KL-együttható béta, logaritmikus skálán"> <b id="bv"></b></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 340" role="img" aria-label="A proxy jutalom monoton nő a policy eltávolodásával, az arany jutalom előbb nő, majd csökken; a munkapont a β csúszkával mozog."></svg>
<p class="small">Illusztratív, nem mért: R_gold(d) = d(1 − 0,1·d), R_proxy(d) = d(1 − 0,015·d), d = √KL; a β → d leképezés is
illusztratív: d = min(15; 0,5/√β). Görbealak: Gao és mtsai (2023) nyomán (ellenőrizendő hivatkozás).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
const G = d => d * (1 - 0.1 * d), P = d => d * (1 - 0.015 * d);
const L = 52, R = 585, T = 12, B = 290, X = d => L + (R - L) * d / 15, Y = v => B - (B - T) * (v + 5.6) / 19.6;
function draw(){
  const b = Math.pow(10, +document.getElementById("b").value), d = Math.min(15, 0.5 / Math.sqrt(b));
  document.getElementById("bv").textContent = b < 0.01 ? b.toFixed(4).replace(".", ",") : f(b, 3);
  svg.innerHTML = "";
  [-4, 0, 4, 8, 12].forEach(v => { el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 0)); });
  [0, 3, 6, 9, 12, 15].forEach(v => el("text", {x: X(v), y: B + 16, "text-anchor": "middle", "font-size": 11}, String(v)));
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "d = √KL(π_θ ‖ π_ref)");
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "jutalom (önk. egység)");
  let p = "", g = ""; for (let i = 0; i <= 150; i++) { const x = 15 * i / 150; p += (p ? "L" : "M") + X(x).toFixed(1) + "," + Y(P(x)).toFixed(1); g += (g ? "L" : "M") + X(x).toFixed(1) + "," + Y(G(x)).toFixed(1); }
  el("path", {d: p, fill: "none", stroke: css("--fg"), "stroke-width": 2.5});
  el("path", {d: g, fill: "none", stroke: css("--muted"), "stroke-width": 2.5, "stroke-dasharray": "8 5"});
  el("line", {x1: X(5), y1: T, x2: X(5), y2: B, stroke: css("--fg"), "stroke-dasharray": "2 3"});
  el("text", {x: X(5) + 4, y: Y(-4.6), "font-size": 11}, "korai leállítás (d = 5)");
  el("text", {x: R, y: Y(13.2), "text-anchor": "end", "font-size": 11}, "— proxy (R_φ)    – – arany (emberi)");
  el("line", {x1: X(d), y1: T, x2: X(d), y2: B, stroke: css("--hl2"), "stroke-width": 2});
  el("circle", {cx: X(d), cy: Y(P(d)), r: 5.5, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.5});
  el("circle", {cx: X(d), cy: Y(G(d)), r: 5.5, fill: css("--hl2")});
  const ph = d < 4 ? "túl erős KL-kötés: a policy alig mozdul, a valódi minőség még javulhatna."
    : d <= 6 ? "a valódi jutalom maximuma közelében: itt érdemes leállni."
    : "túloptimalizálás: a proxy tovább nő, a valódi minőség romlik (hossz, hízelgés, formázás, magabiztos hallucináció).";
  document.getElementById("status").textContent = `β = ${b < 0.01 ? b.toFixed(4).replace(".", ",") : f(b, 3)} → d ≈ ${f(d, 2)}: proxy ${f(P(d), 2)}, arany ${f(G(d), 2)} – ${ph}`;
}
document.getElementById("b").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
