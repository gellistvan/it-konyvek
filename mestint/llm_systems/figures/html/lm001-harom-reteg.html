<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A domain-specifikus rendszer három rétege</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><div id="info" class="small" aria-live="polite" style="min-height:2.9em;max-width:100%">Kattintson egy rétegre (vagy Tab + Enter) a kulcsmondatért és a tipikus hibáért.</div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három egymásra épülő réteg: modell, tudás, folyamat; mellettük a jogi kérdés útja az indexen, a modellen, a hivatkozásellenőrzőn és az emberi jóváhagyáson át."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat (2.1.4), a 2.1.1 jogi példájával; nem mérési eredmény. Mintázat: pontozott = modell-, ferde vonalas = tudás-, üres = folyamatréteg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1/5 Kérdés → tudásréteg: keresés a dokumentumindexben", "a": 0}, {"msg": "2/5 Találatok → modellréteg: a magyarra adaptált, közepes modell válaszvázlatot ír", "a": 1}, {"msg": "3/5 Vázlat → folyamatréteg: a hivatkozásellenőrző modul ellenőrzi a hivatkozásokat", "a": 2}, {"msg": "4/5 Ellenőrzött vázlat → folyamatréteg: emberi jóváhagyás", "a": 3}, {"msg": "5/5 Jóváhagyott válasz a felhasználónak (a folyamatréteg naplóz és szükség esetén eszkalál)", "a": 4}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"S": 45, "H": 9.3, "layers": [{"key": "modell", "name": "1. Modellréteg", "hatch": "..", "y": 0.3, "comps": ["alapmodell", "tokenizáló", "adapter", "kvantálás", "kiszolgálás"], "boxes": [[0.4, 1.05, 2.0599999999999996, 1.0], [2.5599999999999996, 1.05, 2.0599999999999996, 1.0], [4.72, 1.05, 2.0599999999999996, 1.0], [6.879999999999999, 1.05, 2.0599999999999996, 1.0], [9.04, 1.05, 2.0599999999999996, 1.0]], "err": "modellcsere a folyamat javítása helyett", "ks": "A modellréteg akkor jó, ha a feladat nyelvéhez és szakterületéhez illeszkedik, és a választott méret mellett a megcélzott hardveren elérhető a kívánt latencia és költség; a modell cseréje nem kompenzálja a hiányzó folyamatokat."}, {"key": "tudas", "name": "2. Tudásréteg", "hatch": "//", "y": 3.1499999999999995, "comps": ["dokumentum-\nindex", "vektorindex", "kulcsszavas\nkeresés", "üzleti\nszabályok"], "boxes": [[0.4, 3.8999999999999995, 2.5999999999999996, 1.0], [3.0999999999999996, 3.8999999999999995, 2.5999999999999996, 1.0], [5.8, 3.8999999999999995, 2.5999999999999996, 1.0], [8.5, 3.8999999999999995, 2.5999999999999996, 1.0]], "err": "tények finomítása retrieval helyett", "ks": "A tudásréteg feladata, hogy a modell ne a paramétereiben tárolt, esetleg elavult tudásra támaszkodjon, hanem a rendszer aktuális, ellenőrizhető forrásaira. A tudás változik; a modell súlyai nem."}, {"key": "folyamat", "name": "3. Folyamatréteg", "hatch": "", "y": 5.999999999999999, "comps": ["prompt-/\nchat-sablon", "eszköz-\nhívás", "kimeneti\nséma", "guardrail", "kiérté-\nkelés", "emberi\njóváhagyás"], "boxes": [[0.4, 6.749999999999999, 1.7, 1.0], [2.2, 6.749999999999999, 1.7, 1.0], [4.0, 6.749999999999999, 1.7, 1.0], [5.800000000000001, 6.749999999999999, 1.7, 1.0], [7.6000000000000005, 6.749999999999999, 1.7, 1.0], [9.4, 6.749999999999999, 1.7, 1.0]], "err": "nincs eszkaláció / naplózás", "ks": "A folyamatréteg akkor jó, ha a felhasználó pontosan tudja, mit várhat, a rendszer tudja, mikor kell visszautasítani vagy eszkalálni, és a hibák naplózhatók, reprodukálhatók és javíthatók."}], "LX": 0.2, "LW": 11.1, "LH": 2.55, "CX": 11.75, "CW": 5.0, "CH": 1.08, "CY": [8.2, 6.699999999999999, 5.199999999999999, 3.6999999999999993, 2.1999999999999993, 0.6999999999999993], "chain": [["kérdés", null], ["keresés a dokumentum-\nindexben", "tudas"], ["magyarra adaptált, közepes\nmodell: válaszvázlat", "modell"], ["hivatkozásellenőrző modul", "folyamat"], ["emberi jóváhagyás", "folyamat"], ["válasz a felhasználónak", "folyamat"]], "path": [{"layer": "tudas", "comp": 0}, {"layer": "modell", "comp": 2}, {"layer": "folyamat", "comp": 3}, {"layer": "folyamat", "comp": 5}, {"layer": "folyamat", "comp": null}]};
let SEL = null;
function mk(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function Y(y){ return (G.H - y) * G.S; }
function lines(g, x, y, txt, fs, anchor, extra){
  const ls = txt.split("\n"), y0 = y - (ls.length - 1) * fs * 0.6;
  ls.forEach((l, i) => mk(g, "text", Object.assign({x: x, y: y0 + i * fs * 1.2 + fs * 0.35, "font-size": fs, "text-anchor": anchor || "middle"}, extra || {}), l));
}
function showInfo(i){
  SEL = i; const L = G.layers[i];
  document.getElementById("info").textContent = L.name + " – " + L.ks + "  Tipikus hiba: " + L.err + ".";
  render(STEPS[k]);
}
function render(s){
  svg.setAttribute("viewBox", `0 0 ${16.85 * G.S} ${G.H * G.S + 10}`);
  svg.innerHTML = "";
  const S = G.S, fg = css("--fg"), line = css("--line"), cell = css("--cell"), hl = css("--hl");
  const defs = mk(svg, "defs", {});
  const p1 = mk(defs, "pattern", {id: "pdot", width: 8, height: 8, patternUnits: "userSpaceOnUse"});
  mk(p1, "circle", {cx: 4, cy: 4, r: 1.2, fill: css("--muted")});
  const p2 = mk(defs, "pattern", {id: "pdiag", width: 8, height: 8, patternUnits: "userSpaceOnUse"});
  mk(p2, "path", {d: "M0,8L8,0", stroke: css("--muted"), "stroke-width": 1});
  const fillOf = h => h === ".." ? "url(#pdot)" : h === "//" ? "url(#pdiag)" : cell;
  const act = G.path[s.a];
  G.layers.forEach((L, i) => {
    const on = act.layer === L.key, g = mk(svg, "g", {role: "button", tabindex: 0, "aria-label": L.name + ": kulcsmondat és tipikus hiba"});
    g.style.cursor = "pointer";
    g.addEventListener("click", () => showInfo(i));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); showInfo(i); } });
    mk(g, "rect", {x: G.LX * S, y: Y(L.y + G.LH), width: G.LW * S, height: G.LH * S, rx: 6, fill: fillOf(L.hatch),
                   stroke: on ? hl : line, "stroke-width": on ? 4 : (SEL === i ? 3 : 1.5), "stroke-dasharray": SEL === i && !on ? "6 3" : ""});
    mk(g, "rect", {x: G.LX * S + 5, y: Y(L.y + G.LH) + 5, width: 150, height: 22, fill: cell});
    mk(g, "text", {x: G.LX * S + 10, y: Y(L.y + G.LH) + 21, "font-size": 15, "font-weight": "bold"}, L.name);
    L.boxes.forEach((b, j) => {
      const used = act.layer === L.key && act.comp === j;
      mk(g, "rect", {x: b[0] * S, y: Y(b[1] + b[3]), width: b[2] * S, height: b[3] * S, rx: 5, fill: used ? css("--cellhl") : cell,
                     stroke: used ? hl : line, "stroke-width": used ? 4 : 1});
      lines(g, (b[0] + b[2] / 2) * S, Y(b[1] + b[3] / 2), L.comps[j], 12.5);
    });
    mk(g, "rect", {x: (G.LX + 0.2) * S, y: Y(L.y + 0.6), width: (G.LW - 0.4) * S, height: 0.48 * S, rx: 4, fill: cell,
                   stroke: line, "stroke-dasharray": "5 3"});
    mk(g, "text", {x: (G.LX + G.LW / 2) * S, y: Y(L.y + 0.36) + 5, "font-size": 13, "text-anchor": "middle", "font-style": "italic"}, "tipikus hiba: " + L.err);
  });
  mk(svg, "text", {x: (G.CX + G.CW / 2) * S, y: Y(9.05) + 5, "font-size": 14, "text-anchor": "middle", "font-weight": "bold"}, "A jogi példa útja");
  G.chain.forEach((c, i) => {
    const y = G.CY[i], on = i === s.a + 1, done = i <= s.a + 1;
    mk(svg, "rect", {x: G.CX * S, y: Y(y + G.CH / 2), width: G.CW * S, height: G.CH * S, rx: 6, fill: on ? css("--cellhl") : cell,
                     stroke: on ? hl : line, "stroke-width": on ? 4 : 1.2, opacity: done ? 1 : 0.45});
    const g = mk(svg, "g", {opacity: done ? 1 : 0.45});
    if (c[1]) {
      const L = G.layers.find(l => l.key === c[1]);
      mk(g, "rect", {x: G.CX * S + 4, y: Y(y + G.CH / 2) + 5, width: 18, height: G.CH * S - 10, fill: fillOf(L.hatch), stroke: line});
      lines(g, G.CX * S + 30, Y(y), c[0], 12.5, "start");
      mk(g, "text", {x: (G.CX + G.CW) * S - 4, y: Y(y - G.CH / 2) - 4, "font-size": 11, "text-anchor": "end", "font-style": "italic", fill: css("--muted")}, L.name.split(". ")[1].toLowerCase());
    } else lines(g, (G.CX + G.CW / 2) * S, Y(y), c[0], 14);
    if (i) {
      const x = (G.CX + G.CW / 2) * S, ya = Y(G.CY[i - 1] - G.CH / 2), yb = Y(y + G.CH / 2);
      mk(svg, "line", {x1: x, y1: ya + 2, x2: x, y2: yb - 6, stroke: line, "stroke-width": i <= s.a + 1 ? 2.5 : 1, opacity: done ? 1 : 0.45});
      mk(svg, "path", {d: `M${x - 5},${yb - 8}L${x + 5},${yb - 8}L${x},${yb - 1}Z`, fill: line, opacity: done ? 1 : 0.45});
    }
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
