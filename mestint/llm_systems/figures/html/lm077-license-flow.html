<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licenctisztázási döntési folyamat</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--cellhl:#e3e3e3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--cellhl:#3d3d3d}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:5px;align-items:center}
select{font:inherit;padding:2px 6px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;max-width:720px}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:12.5px;margin-top:6px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Bemenet">
  <label>Modell <select id="m" aria-label="Modell"></select></label>
  <label>Felhasználási mód <select id="u" aria-label="Felhasználási mód"></select></label>
</div>
<div id="status" aria-live="polite"></div>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, txt){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const N = {grant: {x: 200, y: 45, t: ["Mit enged a grant?", "(kutatás / bármely cél)"], d: 1},
           stop1: {x: 500, y: 45, t: ["STOP: csak kutatás –", "éles használat nem engedett"], s: 1},
           comm: {x: 200, y: 135, t: ["Kereskedelmi/éles a licenc", "saját definíciója szerint?"], d: 1},
           stop2: {x: 500, y: 135, t: ["STOP: kereskedelmi/éles", "használat nem engedett"], s: 1},
           cond: {x: 200, y: 222, t: ["Feltételek: attribution, licencszöveg,", "NOTICE (ha van), AUP, MAU (kiadás napja)"]},
           legal: {x: 200, y: 285, t: ["Jogi jóváhagyás"]}, doc: {x: 200, y: 335, t: ["Jegyzőkönyv a reprodukciós csomagba"]}};

Object.keys(D.models).forEach(k => ms.add(new Option(k, k)));

us.value = "API";
