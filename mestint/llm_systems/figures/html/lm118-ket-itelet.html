<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reprodukció és kiadási cél</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--line:#000;--on:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--line:#ddd;--on:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:170px}
input[type=number]{width:80px;font:inherit}
button{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block;max-width:700px}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<pattern id="diag" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#888" stroke-width="1.5"/></pattern>
</defs></svg>
<div class="ctl" role="group" aria-label="Értékek">
  <label>aktuális mérés <input id="cur" type="range" min="0.70" max="0.85" step="0.001" value="0.739" aria-label="Aktuális mérés"><b id="vcur"></b></label>
  <label>tolerancia <input id="tol" type="range" min="0.001" max="0.02" step="0.001" value="0.005" aria-label="Tolerancia"><b id="vtol"></b></label>
  <label>referencia <input id="ref" type="number" step="0.001" min="0.70" max="0.85" value="0.741"></label>
  <label>cél <input id="tgt" type="number" step="0.01" min="0.70" max="0.85" value="0.80"></label>
  <button id="reset">31.2.6 példa</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 700 345" role="img" aria-label="Számegyenes a referenciafutással, a reprodukciós sávval, az aktuális méréssel és a kiadási céllal; alatta 2×2 táblázat"></svg>
<p class="small">Két külön ítélet: a reprodukció a referenciafutáshoz mér (|aktuális − referencia| ≤ tolerancia), a kiadás a célértékhez (aktuális ≥ cél).
A referenciát és a célt nem írjuk felül az aktuális méréssel. Illusztratív számok (31.2.6), nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const c3 = v => v.toFixed(3).replace(".", ","), c2 = v => v.toFixed(2).replace(".", ",");
const g = id => +document.getElementById(id).value;
function draw(){
  const cur = g("cur"), tol = g("tol"), ref = g("ref"), tgt = g("tgt");
  document.getElementById("vcur").textContent = c3(cur); document.getElementById("vtol").textContent = c3(tol);
  const diff = Math.abs(cur - ref), rep = diff <= tol + 1e-12, rel = cur >= tgt - 1e-12;
  svg.innerHTML = "";
  const L = 40, R = 670, lo = 0.70, hi = 0.85, X = v => L + (R - L) * (v - lo) / (hi - lo), y = 110;
  el("line", {x1: L, x2: R, y1: y, y2: y, stroke: css("--line")});
  for (let t = 0; t <= 15; t++) { const v = lo + t * 0.01; el("line", {x1: X(v), x2: X(v), y1: y, y2: y + 6, stroke: css("--line")});
    if (t % 2 === 0) el("text", {x: X(v), y: y + 22, "text-anchor": "middle", "font-size": 12}, c2(v)); }
  el("text", {x: (L + R) / 2, y: y + 42, "text-anchor": "middle", "font-size": 12}, "pontosság");
  el("rect", {x: X(ref - tol), y: y - 26, width: X(ref + tol) - X(ref - tol), height: 52, fill: "url(#diag)", stroke: css("--line")});
  el("text", {x: X(ref), y: y - 34, "text-anchor": "middle", "font-size": 12}, `reprodukciós sáv ${c3(ref)} ± ${c3(tol)}`);
  el("line", {x1: X(tgt), x2: X(tgt), y1: 30, y2: y + 30, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: X(tgt) + 5, y: 40, "font-size": 12}, "kiadási cél " + c2(tgt));
  el("circle", {cx: X(ref), cy: y, r: 7, fill: css("--bg"), stroke: css("--line"), "stroke-width": 2});
  el("path", {d: `M${X(cur)} ${y - 9} L${X(cur) - 8} ${y + 6} L${X(cur) + 8} ${y + 6} Z`, fill: css("--fg")});
  el("text", {x: X(cur), y: y + 62, "text-anchor": "middle", "font-size": 12}, "▲ aktuális " + c3(cur));
  el("text", {x: X(ref), y: y + 78, "text-anchor": "middle", "font-size": 12}, "○ referencia " + c3(ref));
  // 2×2
  const tx = 250, ty = 240, cw = 150, ch = 46;
  el("text", {x: tx + cw, y: ty - 22, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "kiadási cél teljesült?");
  el("text", {x: tx + cw / 2, y: ty - 6, "text-anchor": "middle", "font-size": 12}, "igen");
  el("text", {x: tx + 1.5 * cw, y: ty - 6, "text-anchor": "middle", "font-size": 12}, "nem");
  [["reprodukált: igen", true], ["reprodukált: nem", false]].forEach(([lab, r], i) => {
    el("text", {x: tx - 8, y: ty + i * ch + ch / 2 + 4, "text-anchor": "end", "font-size": 12}, lab);
    [true, false].forEach((c, j) => { const on = r === rep && c === rel;
      el("rect", {x: tx + j * cw, y: ty + i * ch, width: cw, height: ch, fill: on ? css("--on") : css("--bg"), stroke: css("--line"), "stroke-width": on ? 3 : 1});
      const t = r && c ? "kiadható" : r ? "reprodukált, nem kiadható" : c ? "cél igen, nem reprodukált" : "egyik sem";
      el("text", {x: tx + j * cw + cw / 2, y: ty + i * ch + ch / 2 + 4, "text-anchor": "middle", "font-size": 11.5}, t); });
  });
  document.getElementById("status").textContent =
    `|${c3(cur)} − ${c3(ref)}| = ${c3(diff)} ${rep ? "≤" : ">"} ${c3(tol)} → ${rep ? "reprodukált" : "nem reprodukált"}; ` +
    `${c3(cur)} ${rel ? "≥" : "<"} ${c2(tgt)} → ${rel ? "a cél teljesül" : "a cél nem teljesül"}`;
}
["cur", "tol"].forEach(i => document.getElementById(i).addEventListener("input", draw));
["ref", "tgt"].forEach(i => document.getElementById(i).addEventListener("input", draw));
document.getElementById("reset").onclick = () => { document.getElementById("cur").value = 0.739; document.getElementById("tol").value = 0.005;
  document.getElementById("ref").value = 0.741; document.getElementById("tgt").value = 0.80; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
