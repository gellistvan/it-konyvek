<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEFT-módszerek helye</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--tr:#bdbdbd;--dim:#f2f2f2}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--tr:#666;--dim:#222}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl2);font-weight:bold}
#status{margin:4px 0 6px;min-height:4.4em}
.lay{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;max-width:560px;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Módszer kiválasztása" id="btns"></div>
<div id="status" aria-live="polite"></div>
<div class="lay"><svg id="v" viewBox="0 0 420 500" role="img" aria-label="Egy decoder-blokk alulról felfelé: beágyazás, LayerNorm, self-attention, maradék összegzés, LayerNorm, feed-forward, maradék összegzés; a kiválasztott PEFT-módszer elemei kiemelve."></svg></div>
<p class="small">A paraméterszámok a 10.2.8 feladatából (d = 768, d_ff = 3072, L = 12, H = 12, d_h = 64, r = 32, L_p = 20); a prompt- és a LoRA-szám a fejezet képletéből (L_p = 20; LoRA r = 8 a W_Q, W_V mellett). Az IA3 l_ff vektora a σ után, a W_2 előtt hat, ezért a W_2 soraiba olvasztható be.</p>
<script>
const EL = [[1.0, 0.4, 6.0, 0.9, "Beágyazás  (B×T×d)", null], [1.0, 1.8, 6.0, 0.9, "[P] soft prompt: L_p × d  →  B×(L_p+T)×d", "P"], [1.0, 3.2, 6.0, 0.7, "LayerNorm", null], [1.0, 4.8, 1.5, 0.8, "W_Q", null], [2.9, 4.8, 1.5, 0.8, "W_K", null], [4.8, 4.8, 1.5, 0.8, "W_V", null], [1.0, 5.9, 1.5, 0.7, "[LoRA] BA", "LoRA"], [2.9, 5.9, 1.5, 0.7, "[IA3] ⊙ l_k", "IA3"], [4.8, 5.9, 1.5, 0.7, "[IA3] ⊙ l_v", "IA3"], [6.5, 4.8, 1.1, 0.8, "[LoRA]\nBA", "LoRA"], [2.9, 7.0, 3.4, 0.8, "[PF] + L_p K/V oszlop", "PF"], [1.0, 8.1, 5.3, 0.7, "softmax(QK'ᵀ/√d_h)V' → W_O", null], [1.0, 9.6, 6.0, 0.8, "[A] adapter: down–σ–up (Houlsby)", "A"], [1.0, 11.4, 6.0, 0.7, "LayerNorm", null], [1.0, 12.8, 6.0, 0.7, "W_1  (d × d_ff)", null], [1.0, 13.7, 6.0, 0.6, "σ", null], [1.0, 14.5, 6.0, 0.7, "[IA3] ⊙ l_ff  (σ után, W_2 előtt)", "IA3"], [1.0, 15.4, 6.0, 0.7, "W_2  (d_ff × d)", null], [1.0, 16.9, 6.0, 0.8, "[A] adapter (Houlsby és Pfeiffer)", "A"]], FR = [[0.6, 4.4, 7.3, 4.65, "self-attention"], [0.6, 12.4, 7.3, 4.0, "feed-forward"]], SUMS = [[4.0, 10.95], [4.0, 18.3]], TAB = {"P": ["prompt tuning", "L_p soft token a bemenet elején", "L_p·d = 15 360 (L_p = 20)", "nem", "hosszabb bemenet"], "PF": ["prefix tuning", "L_p extra K/V oszlop, minden rétegben", "2·L·H·L_p·d_h = 368 640", "nem", "hosszabb K/V"], "A": ["adapter", "maradék ágban, attention és FF után", "49 952/db; 2/blokk: 1 198 848", "nem", "extra mátrixszorzás"], "IA3": ["IA3", "⊙ l_k, ⊙ l_v; ⊙ l_ff a σ után", "L(2d + d_ff) = 55 296", "igen (W_K, W_V, W_2)", "nincs (beolvasztva)"], "LoRA": ["LoRA", "BA párhuzamos ág W_Q, W_V mellett", "r = 8: 294 912", "igen", "nincs (beolvasztva)"]}, SH = {"P": "B×(L_p+T)×d", "PF": "K', V': B×H×(L_p+T)×d_h", "A": "B×T×d → B×T×r → B×T×d", "IA3": "l_k, l_v ∈ ℝ^d, l_ff ∈ ℝ^d_ff", "LoRA": "B: d×r, A: r×d"};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const U = 24, TOPY = 19.6, X = x => 10 + x * U * 1.0 * 2.1, Y = y => (TOPY - y) * U, W = w => w * U * 2.1;
let sel = "";
function draw(){
  svg.innerHTML = "";
  FR.forEach(([x, y, w, h, t]) => { el("rect", {x: X(x), y: Y(y + h), width: W(w), height: h * U, rx: 6, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("text", {x: X(x + w) - 4, y: Y(y + h) + 12, "text-anchor": "end", "font-size": 10.5, fill: css("--muted")}, t); });
  EL.forEach(([x, y, w, h, t, tag]) => { const on = sel && tag === sel, off = sel && tag && tag !== sel;
    if (off) return;
    el("rect", {x: X(x), y: Y(y + h), width: W(w), height: h * U, rx: 4, fill: tag ? (on ? css("--hl2") : css("--tr")) : css("--cell"), stroke: css("--line"), "stroke-width": tag ? (on ? 3 : 1.6) : 0.8, "stroke-dasharray": tag ? "none" : "3 2"});
    const lines = t.split("\n"); lines.forEach((q, i) => el("text", {x: X(x + w / 2), y: Y(y + h / 2) + (i - (lines.length - 1) / 2) * 12 + 4, "text-anchor": "middle", "font-size": w < 2 ? 9.5 : 11, "font-weight": on ? "bold" : "normal"}, q)); });
  SUMS.forEach(([cx, cy]) => { el("circle", {cx: X(cx), cy: Y(cy), r: 9, fill: css("--cell"), stroke: css("--line")}); el("text", {x: X(cx), y: Y(cy) + 5, "text-anchor": "middle", "font-size": 14}, "+"); });
  document.querySelectorAll("#btns button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === sel)));
  if (!sel) document.getElementById("status").textContent = "Minden módszer látszik. Válassz egy módszert: csak annak elemei maradnak kiemelve, a tenzoralakkal és a paraméterszámmal.";
  else { const [nm, hely, par, merge, inf] = TAB[sel];
    document.getElementById("status").textContent = `${nm}: ${hely}. Alak: ${SH[sel]}. Tanítható paraméter: ${par}. Beolvasztható: ${merge}. Inferencia-többlet: ${inf}.`; }
}
const bt = document.getElementById("btns");
[["", "mind"], ["P", "prompt"], ["PF", "prefix"], ["A", "adapter"], ["IA3", "IA3"], ["LoRA", "LoRA"]].forEach(([t, n]) => { const b = document.createElement("button"); b.textContent = n; b.dataset.t = t; b.onclick = () => { sel = t; draw(); }; bt.appendChild(b); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
