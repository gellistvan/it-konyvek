<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iteratív annotációs ciklus</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kiinduló sémaverzió <input id="v0" type="text" value="v1.3" size="5" aria-label="Kiinduló sémaverzió"></label> <label>mért κ körönként <input id="kaps" type="text" value="0,72; 0,83" size="14" aria-label="Mért kappa körönként, pontosvesszővel elválasztva"></label> <button id="run">Lejátszás ezzel</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra: séma, kalibráció, egyezésmérés, döntés a kappa küszöbről; a nem ág a javításon át vissza a kalibrációhoz, az igen ág a teljes annotációhoz, ellenőrző mintavételhez és adatkártyához vezet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Alapértelmezés: a 9.4.4 példája (mért κ = 0,72 < 0,8 → séma v1.4), majd egy második kör κ = 0,83-mal. Saját körönkénti κ-értékekkel újrajátszható. Sematikus folyamat, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "sema", "ver": "v1.3", "msg": "Kiinduló séma és útmutató: v1.3.", "line": 0}, {"node": "kalib", "ver": "v1.3", "msg": "1. kalibrációs kör (v1.3): 50–100 példa, 2–3 annotátor.", "line": 1}, {"node": "mer", "ver": "v1.3", "kap": 0.72, "msg": "Egyezésmérés: mért κ = 0,72.", "line": 2}, {"node": "dia", "ver": "v1.3", "kap": 0.72, "ok": false, "line": 3, "msg": "κ = 0,72 < 0,80: nem ág – a cél alatt."}, {"node": "javit", "ver": "v1.4", "kap": 0.72, "line": 4, "msg": "Hibaanalízis, definíciók és határesetek javítása → séma v1.4; új kalibrációs kör."}, {"node": "kalib", "ver": "v1.4", "msg": "2. kalibrációs kör (v1.4): 50–100 példa, 2–3 annotátor.", "line": 1}, {"node": "mer", "ver": "v1.4", "kap": 0.83, "msg": "Egyezésmérés: mért κ = 0,83.", "line": 2}, {"node": "dia", "ver": "v1.4", "kap": 0.83, "ok": true, "line": 3, "msg": "κ = 0,83 ≥ 0,80: igen ág."}, {"node": "teljes", "ver": "v1.4", "kap": 0.83, "msg": "Teljes annotáció kétlépcsőben: annotátor → auditor; a vitás eseteket az adjudikátor dönti el.", "line": 5}, {"node": "minta", "ver": "v1.4", "kap": 0.83, "msg": "Időnkénti ellenőrző mintavétel a teljes annotáció közben.", "line": 5}, {"node": "kartya", "ver": "v1.4", "kap": 0.83, "msg": "Adatkártya: séma v1.4, útmutató v1.4, mért κ = 0,83 (a cél 0,8).", "line": 6}];
const CODE = ["séma, útmutató := v1.x", "kalibrációs kör: 50–100 példa, 2–3 annotátor", "κ := egyezés(annotátorok)", "ha κ ≥ 0,8: → teljes annotáció  különben: → javítás", "hibaanalízis; definíciók, határesetek; verzió += 0.1", "teljes annotáció: annotátor → auditor → adjudikátor; ellenőrző mintavétel", "adatkártya: sémaverzió, útmutatóverzió, mért κ"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ND = {"sema": [0.2, 5.9, 2.9, 1.3, "Séma + útmutató\nv1.0"], "kalib": [3.7, 5.9, 3.1, 1.3, "Kalibrációs halmaz\n(50–100 példa),\n2–3 annotátor"], "mer": [7.4, 5.9, 3.0, 1.3, "Egyezésmérés\n(κ / Krippendorff-α /\nJaccard)"], "javit": [3.7, 2.55, 5.6, 1.3, "Hibaanalízis → definíciók, példák,\nhatáresetek javítása → séma v1.x"], "teljes": [12.6, 3.6, 3.8, 1.3, "Teljes annotáció:\nannotátor → auditor →\nadjudikátor (vitás esetek)"], "minta": [12.6, 1.95, 3.8, 1.0, "Ellenőrző mintavétel"], "kartya": [12.6, 0.2, 3.8, 1.25, "Adatkártya\n(sémaverzió, útmutató-\nverzió, mért κ)"]}, DI = [12.1, 6.55, 1.45, 1.0], U = 40, TOP = 7.6;
const PX = x => x * U, PY = y => (TOP - y) * U;
function buildSteps(kaps, mj, mn){
  const out = [{node: "sema", ver: `v${mj}.${mn}`, msg: `Kiinduló séma és útmutató: v${mj}.${mn}.`, line: 0}];
  const fk = x => x.toFixed(2).replace(".", ",");
  for (let r = 0; r < kaps.length; r++) { const kap = kaps[r], ver = `v${mj}.${mn}`;
    out.push({node: "kalib", ver, msg: `${r + 1}. kalibrációs kör (${ver}): 50–100 példa, 2–3 annotátor.`, line: 1});
    out.push({node: "mer", ver, kap, msg: `Egyezésmérés: mért κ = ${fk(kap)}.`, line: 2});
    const ok = kap >= 0.8;
    out.push({node: "dia", ver, kap, ok, line: 3, msg: ok ? `κ = ${fk(kap)} ≥ 0,80: igen ág.` : `κ = ${fk(kap)} < 0,80: nem ág – a cél alatt.`});
    if (ok) { out.push({node: "teljes", ver, kap, line: 5, msg: "Teljes annotáció kétlépcsőben: annotátor → auditor; a vitás eseteket az adjudikátor dönti el."});
      out.push({node: "minta", ver, kap, line: 5, msg: "Időnkénti ellenőrző mintavétel a teljes annotáció közben."});
      out.push({node: "kartya", ver, kap, line: 6, msg: `Adatkártya: séma ${ver}, útmutató ${ver}, mért κ = ${fk(kap)} (a cél 0,8).`}); return out; }
    mn += 1;
    out.push({node: "javit", ver: `v${mj}.${mn}`, kap, line: 4, msg: `Hibaanalízis, definíciók és határesetek javítása → séma v${mj}.${mn}; új kalibrációs kör.`});
  }
  out.push({node: "javit", ver: `v${mj}.${mn}`, line: 4, msg: "A megadott körökben nem érte el a célt: további kör kell."});
  return out;
}
function ln(x1, y1, x2, y2, dash, on){ el("line", {x1: PX(x1), y1: PY(y1), x2: PX(x2), y2: PY(y2), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.5, "stroke-dasharray": dash ? "6 4" : "none", "marker-end": "url(#ah)"}); }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 310"); svg.innerHTML = "";
  const d = el("defs", {}); const m = document.createElementNS(NS, "marker");
  [["id", "ah"], ["viewBox", "0 0 10 10"], ["refX", 9], ["refY", 5], ["markerWidth", 7], ["markerHeight", 7], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0L10,5L0,10Z"); p.setAttribute("fill", css("--line")); m.appendChild(p); d.appendChild(m);
  const on = s.node;
  ln(3.1, 6.55, 3.7, 6.55, false, on === "kalib"); ln(6.8, 6.55, 7.4, 6.55, false, on === "mer"); ln(10.4, 6.55, DI[0] - DI[2], 6.55, false, on === "dia");
  el("line", {x1: PX(DI[0] + DI[2]), y1: PY(DI[1]), x2: PX(15.9), y2: PY(DI[1]), stroke: on === "teljes" ? css("--hl2") : css("--line"), "stroke-width": on === "teljes" ? 3 : 1.5});
  ln(15.9, DI[1], 15.9, 4.9, false, on === "teljes"); ln(14.5, 3.6, 14.5, 2.95, false, on === "minta"); ln(14.5, 1.95, 14.5, 1.45, false, on === "kartya");
  el("line", {x1: PX(DI[0]), y1: PY(DI[1] - DI[3]), x2: PX(DI[0]), y2: PY(3.2), stroke: on === "javit" ? css("--hl2") : css("--line"), "stroke-width": on === "javit" ? 3 : 1.5, "stroke-dasharray": "6 4"});
  ln(DI[0], 3.2, 9.3, 3.2, true, on === "javit"); ln(5.25, 3.85, 5.25, 5.9, true, on === "kalib" && s.ver !== STEPS[0].ver);
  el("text", {x: PX(14.4), y: PY(DI[1]) - 5, "font-size": 12, "font-weight": "bold"}, "igen");
  el("text", {x: PX(DI[0]) - 34, y: PY(4.6), "font-size": 12, "font-weight": "bold"}, "nem");
  for (const k in ND) { const [x, y, w, h, t] = ND[k], a = k === on;
    el("rect", {x: PX(x), y: PY(y + h), width: w * U, height: h * U, rx: 6, fill: a ? css("--cellhl") : css("--cell"), stroke: a ? css("--hl2") : css("--line"), "stroke-width": a ? 3 : 1.3});
    let lines = t.split("\n"); if (k === "sema" || k === "javit") lines = lines.map(q => q.replace("v1.0", s.ver).replace("v1.x", s.ver));
    if (k === "kartya" && on === "kartya") lines = ["Adatkártya", `séma ${s.ver}, útmutató ${s.ver}`, "mért κ = " + s.kap.toFixed(2).replace(".", ",")];
    lines.forEach((q, i) => el("text", {x: PX(x + w / 2), y: PY(y + h / 2) + (i - (lines.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": 11.5}, q)); }
  const a = on === "dia", cx = PX(DI[0]), cy = PY(DI[1]);
  el("path", {d: `M${cx - DI[2] * U},${cy}L${cx},${cy - DI[3] * U}L${cx + DI[2] * U},${cy}L${cx},${cy + DI[3] * U}Z`, fill: a ? css("--cellhl") : css("--cell"), stroke: a ? css("--hl2") : css("--line"), "stroke-width": a ? 3 : 1.3});
  el("text", {x: cx, y: cy + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, s.kap !== undefined && (on === "dia" || on === "mer") ? "κ = " + s.kap.toFixed(2).replace(".", ",") + " ≥ 0,8?" : "κ ≥ 0,8?");
}
document.getElementById("run").onclick = () => {
  const ks = document.getElementById("kaps").value.split(/[;\s]+/).map(q => parseFloat(q.replace(",", "."))).filter(q => !isNaN(q) && q >= -1 && q <= 1);
  const v = document.getElementById("v0").value.match(/(\d+)\.(\d+)/);
  if (!ks.length) return; setSteps(buildSteps(ks, v ? +v[1] : 1, v ? +v[2] : 0));
};


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
