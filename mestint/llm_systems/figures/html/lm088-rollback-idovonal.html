<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidens és rollback</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>v2 pontossága a golden seten: <input id="v2a" type="range" min="0" max="10" step="1" value="6" aria-label="v2 helyes válaszainak száma a 10 kérdésből"> <b id="v2v">6/10 = 0,6</b></label><pre id="log" style="width:100%;margin:4px 0 0;padding:6px 8px;background:var(--code);font:12px/1.4 ui-monospace,monospace"></pre></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal a rollback-terv lépéseivel: felül a production_alias mutatója v1-ről v2-re, majd vissza v1-re, alul a golden set pontossága a küszöbvonalakkal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szimulált labor, 10 kérdéses golden set (csak k/10 pontosság lehetséges): v1 = 9/10, v2 = 6/10. Küszöbök a 23.4.2 szerint: SLO 0,85, riasztás 0,80 alatt, automatikus leállítás 0,70 alatt. A csúszkával a v2 helyes válaszainak száma állítható; 8/10-tól nincs riasztás, és a rollback-ág nem fut le.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. Kiinduló állapot és kiváltó esemény: production_alias = v1 (golden set 0,9); a csapat bevezeti a v2-t.", "line": 1, "alias": "v1", "pts": [[0, 0.9]], "mark": null, "ok": null, "log": {}}, {"msg": "1. A modellregisztrációban a produkciós aliasz ellenőrzése: production_alias = v2.", "line": 0, "alias": "v2", "pts": [[0, 0.9]], "mark": null, "ok": null, "log": {}}, {"msg": "2. A v2 kiértékelése a golden seten: 6/10 = 0,6 (mért érték rögzítve).", "line": 2, "alias": "v2", "pts": [[0, 0.9], [2, 0.6]], "mark": null, "ok": null, "log": {"detected_score": 0.6}}, {"msg": "3. Riasztási feltétel: score < threshold, 0,6 < 0,80 → riasztás; 0,6 < 0,70, ezért a 23.4.2 szerint automatikus forgalomleállítás is indulna.", "line": 3, "alias": "v2", "pts": [[0, 0.9], [2, 0.6]], "mark": "alert", "ok": null, "log": {"detected_score": 0.6}}, {"msg": "4. Rollback: a produkciós aliasz visszaállítása v1-re; a v2 megmarad (megőrizve az utóelemzéshez).", "line": 4, "alias": "v1", "pts": [[0, 0.9], [2, 0.6]], "mark": null, "ok": null, "log": {"detected_score": 0.6, "event": "rollback_executed", "from_version": "v2", "to_version": "v1"}}, {"msg": "5. A v1 újbóli kiértékelése: 9/10 = 0,9.", "line": 5, "alias": "v1", "pts": [[0, 0.9], [2, 0.6], [5, 0.9]], "mark": null, "ok": null, "log": {"detected_score": 0.6, "event": "rollback_executed", "from_version": "v2", "to_version": "v1", "verified_score_after_rollback": 0.9}}, {"msg": "6. Verifikáció: |0,9 − 0,9| < 0,01 ✓ – a rollback visszaállította a várt teljesítményt.", "line": 6, "alias": "v1", "pts": [[0, 0.9], [2, 0.6], [5, 0.9]], "mark": "ok", "ok": null, "log": {"detected_score": 0.6, "event": "rollback_executed", "from_version": "v2", "to_version": "v1", "verified_score_after_rollback": 0.9}}, {"msg": "7. Az incidensnapló kitöltése időbélyeggel és a döntésekkel.", "line": 7, "alias": "v1", "pts": [[0, 0.9], [2, 0.6], [5, 0.9]], "mark": "ok", "ok": null, "log": {"detected_score": 0.6, "event": "rollback_executed", "from_version": "v2", "to_version": "v1", "verified_score_after_rollback": 0.9, "timestamp": "<UTC időbélyeg>"}}];
const CODE = ["registry = load_registry()            # 1. production_alias ellenőrzése", "registry[\"production_alias\"] = \"v2\"   # (0.) a v2 bevezetése", "score_v2 = evaluate(\"v2\", GOLDEN_SET)  # 2. mért pontosság", "if detect_incident(score_v2):          # 3. score < THRESHOLD (0.80)", "    rollback(registry, \"v1\")           # 4. production_alias = \"v1\"", "    score_v1 = evaluate(\"v1\", GOLDEN_SET)  # 5. újbóli kiértékelés", "    assert abs(score_v1 - expected_score) < 0.01  # 6. verifikáció", "incident_log = {...}; print(json.dumps(incident_log))  # 7. napló", "else: print(\"Nincs incidens, a modell teljesítménye elfogadható.\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const X = i => 90 + i * 72, ln = {v1: 40, v2: 105}, Y = v => 300 - (v - 0.5) * 260;
  ["v1", "v2"].forEach(v => { el("rect", {x: 8, y: ln[v] - 15, width: 46, height: 30, rx: 5, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.4});
    el("text", {x: 31, y: ln[v] + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, v);
    el("line", {x1: 58, x2: 630, y1: ln[v], y2: ln[v], stroke: css("--cellhl"), "stroke-width": 1}); });
  let d = "", prevY = null;
  for (let i = 0; i <= k; i++) { const y = ln[STEPS[i].alias];
    if (i === 0) d = `M58,${y}L${X(0) + 36},${y}`; else d += `L${X(i) - 36},${prevY}L${X(i) - 36},${y}L${X(i) + 36},${y}`; prevY = y; }
  el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 4});
  el("text", {x: 64, y: 22, "font-size": 11}, "vastag vonal: production_alias");
  const kept = STEPS.slice(0, k + 1).some(s => s.alias === "v1") && STEPS[k].alias === "v1" && k >= 4;
  if (kept) { el("rect", {x: X(5) - 30, y: ln.v2 - 13, width: 200, height: 26, rx: 5, fill: css("--cellhl"), stroke: css("--line"), "stroke-dasharray": "5 3"});
    el("text", {x: X(5) + 70, y: ln.v2 + 5, "text-anchor": "middle", "font-size": 11.5}, "v2 megőrizve az utóelemzéshez"); }
  [[0.85, "4 4", "SLO 0,85"], [0.80, "9 4", "riasztás 0,80"], [0.70, "", "leállítás 0,70"]].forEach(([v, da, lab]) => {
    el("line", {x1: 58, x2: 630, y1: Y(v), y2: Y(v), stroke: css("--muted"), "stroke-width": 1.3, "stroke-dasharray": da});
    el("text", {x: 628, y: Y(v) - 3, "text-anchor": "end", "font-size": 10.5, fill: css("--muted")}, lab); });
  for (let i = 0; i < STEPS.length; i++) { el("text", {x: X(i), y: 322, "text-anchor": "middle", "font-size": 11, "font-weight": i === k ? "bold" : "normal"}, String(i));
    if (i === k) el("rect", {x: X(i) - 34, y: 130, width: 68, height: 180, fill: "none", stroke: css("--hl"), "stroke-width": 2}); }
  s.pts.forEach(([x, v]) => { const ok = v >= 0.8;
    if (ok) el("circle", {cx: X(x), cy: Y(v), r: 7, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 2});
    else el("rect", {x: X(x) - 7, y: Y(v) - 7, width: 14, height: 14, fill: css("--muted"), stroke: css("--fg"), "stroke-width": 2});
    el("text", {x: X(x) + 10, y: Y(v) + 16, "font-size": 12}, v.toFixed(1).replace(".", ",")); });
  STEPS.slice(0, k + 1).forEach((t, i) => { if (t.mark === "alert") { const v = STEPS[2].pts[1][1];
      el("path", {d: `M${X(i)},${Y(v) - 22}l9,9l-9,9l-9,-9z`, fill: css("--cell"), stroke: css("--hl2"), "stroke-width": 2.2});
      el("text", {x: X(i) + 12, y: Y(v) - 9, "font-size": 11}, "score < threshold"); }
    if (t.mark === "ok") el("text", {x: X(i), y: Y(0.9) - 12, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "✓"); });
  document.getElementById("log").textContent = "incident_log (aktuális állapot):\n" + JSON.stringify(Object.assign({}, s.log), null, 2);
}
function buildSteps(v2){
  const C = x => x.toFixed(1).replace(".", ","), st = [], log = {};
  const add = (msg, line, alias, pts, mark, ok) => st.push({msg, line, alias, pts: pts.map(p => p.slice()), mark: mark || null, ok: ok || null, log: Object.assign({}, log)});
  let pts = [[0, 0.9]];
  add("0. Kiinduló állapot és kiváltó esemény: production_alias = v1 (golden set 0,9); a csapat bevezeti a v2-t.", 1, "v1", pts);
  add("1. A modellregisztrációban a produkciós aliasz ellenőrzése: production_alias = v2.", 0, "v2", pts);
  pts = pts.concat([[2, v2]]); log.detected_score = v2;
  add(`2. A v2 kiértékelése a golden seten: ${Math.round(v2 * 10)}/10 = ${C(v2)} (mért érték rögzítve).`, 2, "v2", pts);
  if (v2 < 0.8 - 1e-9) {
    const extra = v2 < 0.7 - 1e-9 ? `; ${C(v2)} < 0,70, ezért a 23.4.2 szerint automatikus forgalomleállítás is indulna` : "";
    add(`3. Riasztási feltétel: score < threshold, ${C(v2)} < 0,80 → riasztás${extra}.`, 3, "v2", pts, "alert");
    Object.assign(log, {event: "rollback_executed", from_version: "v2", to_version: "v1"});
    add("4. Rollback: a produkciós aliasz visszaállítása v1-re; a v2 megmarad (megőrizve az utóelemzéshez).", 4, "v1", pts);
    pts = pts.concat([[5, 0.9]]); log.verified_score_after_rollback = 0.9;
    add("5. A v1 újbóli kiértékelése: 9/10 = 0,9.", 5, "v1", pts);
    add("6. Verifikáció: |0,9 − 0,9| < 0,01 ✓ – a rollback visszaállította a várt teljesítményt.", 6, "v1", pts, "ok");
    log.timestamp = "<UTC időbélyeg>";
    add("7. Az incidensnapló kitöltése időbélyeggel és a döntésekkel.", 7, "v1", pts, "ok");
  } else {
    add(`3. Riasztási feltétel: ${C(v2)} ≥ 0,80 → nincs riasztás.`, 3, "v2", pts);
    add("Nincs incidens: a v2 marad a produkcióban, rollback nem szükséges.", 8, "v2", pts);
  }
  return st;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
document.getElementById("v2a").oninput = e => { const n = +e.target.value; document.getElementById("v2v").textContent = `${n}/10 = ${(n / 10).toFixed(1).replace(".", ",")}`; setSteps(buildSteps(n / 10)); };
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
