<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA-réteg</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--fr:#e8e8e8;--tr:#9a9a9a;--cell:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--fr:#3a3a3a;--tr:#777;--cell:#262626}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:150px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
<label>r <input id="r" type="range" min="0" max="7" step="1" value="4" aria-label="rang, 2 hatványai 1 és 128 között"> <b id="rv"></b></label>
<label>d <input id="d" type="range" min="256" max="8192" step="256" value="2048" aria-label="kimeneti dimenzió d"> <b id="dv"></b></label>
<label>k <input id="k" type="range" min="256" max="8192" step="256" value="2048" aria-label="bemeneti dimenzió k"> <b id="kv"></b></label>
<label><input id="q" type="checkbox"> QLoRA-mód</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 450" role="img" aria-label="Felül a LoRA-réteg adatfolyama: a bemenet a fagyasztott W-n és az A, B alacsony rangú ágon át az összegzőbe jut. Alul a W, A és B mátrix méretarányos téglalapként."></svg>
<p class="small">Kezdőállapot: a 10.1.3 példája (d = k = 2048, r = 16 → A + B = 65 536 paraméter). Sraffozott: fagyasztott; teli: tanítható. QLoRA-módban a W 4 bites NF4-ben tárolódik, és a forwardban BF16-ra dekvantálódik. Paraméterszám rétegenként egy projekcióra.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const hu = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function bx(x, y, w, h, fill, hatch, lines, fs){ el("rect", {x, y, width: w, height: h, rx: 5, fill, stroke: css("--line"), "stroke-width": 1.4});
  if (hatch) el("rect", {x, y, width: w, height: h, rx: 5, fill: "url(#hh)", stroke: "none"});
  lines.forEach((t, i) => el("text", {x: x + w / 2, y: y + h / 2 + (i - (lines.length - 1) / 2) * 15 + 4, "text-anchor": "middle", "font-size": fs || 12}, t)); }
function ar(x1, y1, x2, y2, dash){ el("line", {x1, y1, x2, y2, stroke: dash ? css("--muted") : css("--line"), "stroke-width": 1.5, "stroke-dasharray": dash ? "6 4" : "none", "marker-end": dash ? "url(#am)" : "url(#ah)"}); }
function draw(){
  const r = Math.pow(2, +document.getElementById("r").value), d = +document.getElementById("d").value, k = +document.getElementById("k").value, q = document.getElementById("q").checked;
  document.getElementById("rv").textContent = r; document.getElementById("dv").textContent = d; document.getElementById("kv").textContent = k;
  const pw = d * k, pl = r * (d + k), ratio = pl / pw;
  svg.innerHTML = "";
  const defs = el("defs", {});
  [["ah", css("--line")], ["am", css("--muted")]].forEach(([id, c]) => { const m = document.createElementNS(NS, "marker");
    [["id", id], ["viewBox", "0 0 10 10"], ["refX", 9], ["refY", 5], ["markerWidth", 7], ["markerHeight", 7], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0L10,5L0,10Z"); p.setAttribute("fill", c); m.appendChild(p); defs.appendChild(m); });
  const pat = document.createElementNS(NS, "pattern"); [["id", "hh"], ["width", 8], ["height", 8], ["patternUnits", "userSpaceOnUse"], ["patternTransform", "rotate(45)"]].forEach(([a, b]) => pat.setAttribute(a, b));
  const pl1 = document.createElementNS(NS, "line"); [["x1", 0], ["y1", 0], ["x2", 0], ["y2", 8], ["stroke", css("--muted")], ["stroke-width", 1.2]].forEach(([a, b]) => pl1.setAttribute(a, b)); pat.appendChild(pl1); defs.appendChild(pat);
  // adatfolyam
  el("text", {x: 30, y: 128, "text-anchor": "middle", "font-size": 13}, "x ∈ ℝ^k");
  ar(55, 124, 80, 124); el("line", {x1: 80, y1: 60, x2: 80, y2: 185, stroke: css("--line"), "stroke-width": 1.5});
  if (q) { bx(95, 35, 110, 50, css("--cell"), false, ["W: NF4 (4 bit)", "→ BF16 dekvantálás"], 11); ar(80, 60, 95, 60); ar(205, 60, 230, 60); }
  else ar(80, 60, 230, 60);
  bx(230, 30, 200, 60, css("--fr"), true, [`W (${d}×${k})`, "fagyasztott"]);
  ar(80, 185, 110, 185); bx(110, 155, 80, 60, css("--tr"), false, [`A (${r}×${k})`, "N(0, σ²)"], 11.5);
  ar(190, 185, 220, 185); bx(220, 170, 60, 30, css("--cell"), false, [`${r}-dim.`], 11.5);
  ar(280, 185, 310, 185); bx(310, 155, 80, 60, css("--tr"), false, [`B (${d}×${r})`, "init 0"], 11.5);
  ar(390, 185, 420, 185); bx(420, 170, 60, 30, css("--cell"), false, ["× α/r"], 12);
  el("line", {x1: 430, y1: 60, x2: 530, y2: 60, stroke: css("--line"), "stroke-width": 1.5}); ar(530, 60, 530, 106);
  el("line", {x1: 480, y1: 185, x2: 530, y2: 185, stroke: css("--line"), "stroke-width": 1.5}); ar(530, 185, 530, 142);
  el("circle", {cx: 530, cy: 124, r: 17, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5}); el("text", {x: 530, y: 130, "text-anchor": "middle", "font-size": 18}, "+");
  ar(547, 124, 590, 124); el("text", {x: 625, y: 128, "text-anchor": "middle", "font-size": 13}, "h ∈ ℝ^d");
  el("path", {d: "M520,140 Q450,240 350,218", fill: "none", stroke: css("--muted"), "stroke-width": 1.4, "stroke-dasharray": "6 4", "marker-end": "url(#am)"});
  el("path", {d: "M330,218 Q240,250 150,218", fill: "none", stroke: css("--muted"), "stroke-width": 1.4, "stroke-dasharray": "6 4", "marker-end": "url(#am)"});
  el("text", {x: 440, y: 240, "font-size": 11.5, fill: css("--muted")}, "∂L/∂B"); el("text", {x: 210, y: 252, "font-size": 11.5, fill: css("--muted")}, "∂L/∂A");
  ar(520, 18, 40, 18, true); el("text", {x: 280, y: 12, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "∂L/∂x a W-n át is visszafolyik; ∂L/∂W nincs");
  // méretarányos mátrixpanel
  const s = 130 / Math.max(d, k), y0 = 290;
  el("text", {x: 20, y: y0 - 8, "font-size": 12, "font-weight": "bold"}, "Mátrixok méretarányosan (d függőleges, k vízszintes):");
  const wW = k * s, hW = d * s; el("rect", {x: 20, y: y0, width: wW, height: hW, fill: css("--fr"), stroke: css("--line")}); el("rect", {x: 20, y: y0, width: wW, height: hW, fill: "url(#hh)"});
  el("text", {x: 20 + wW / 2, y: y0 + hW + 15, "text-anchor": "middle", "font-size": 11.5}, `W: ${hu(pw)}`);
  const xb = 40 + wW + 30, hA = Math.max(2, r * s);
  el("rect", {x: xb, y: y0, width: Math.max(2, r * s), height: hW, fill: css("--tr"), stroke: css("--line")});
  el("text", {x: xb + 4, y: y0 + hW + 15, "font-size": 11.5}, `B: ${hu(d * r)}`);
  const xa = xb + 90; el("rect", {x: xa, y: y0, width: wW, height: hA, fill: css("--tr"), stroke: css("--line")});
  el("text", {x: xa + wW / 2, y: y0 + hA + 15, "text-anchor": "middle", "font-size": 11.5}, `A: ${hu(r * k)}`);
  el("text", {x: xa + wW + 20, y: y0 + 20, "font-size": 12.5}, `A + B = r(d + k) = ${hu(pl)}`);
  el("text", {x: xa + wW + 20, y: y0 + 40, "font-size": 12.5}, `arány r(d + k)/(dk) = ${(ratio * 100).toPrecision(5).replace(".", ",")}%`);
  document.getElementById("status").textContent = `d = ${d}, k = ${k}, r = ${r}: W ${hu(pw)} paraméter (fagyasztott${q ? ", NF4-ben tárolva" : ""}), A + B ${hu(pl)} tanítható paraméter (${(ratio * 100).toPrecision(5).replace(".", ",")}%).`;
}
document.querySelectorAll("input").forEach(x => x.addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
