<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A záróprojekt közös kontraktusa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat csomópontú lánc: charter és jelölt, adat és split, adapter és GGUF, értékelés befagyasztott teszttel, go/no-go döntés, reprodukciós csomag"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 30.1.13 kontraktusa (acme-it-szabalyzat-2025-Q1) a 30.4 azonosítóival kiegészítve; a sémák rövidített vázlatok. Kattints egy csomópontra, vagy lépkedj a láncon.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "30.1 (lm113) – Projektterv, adat- és modellválasztás", "line": 0, "node": 0}, {"msg": "30.2 (lm114) – Adatgyűjtés, tisztítás és jogosultság", "line": 1, "node": 1}, {"msg": "30.3 (lm115) – Fine-tuning, kvantálás és deployment", "line": 2, "node": 2}, {"msg": "30.4 (lm116) – Értékelés, dokumentáció és bemutató", "line": 3, "node": 3}, {"msg": "31.1 (lm117) – Kiadási kapu: teljesítmény, biztonság és jog", "line": 4, "node": 4}, {"msg": "31.2 (lm118) – Reprodukciós csomag és modellkártya", "line": 5, "node": 5}];
const CODE = ["30.1: charter.v1.json candidate.v1.json", "30.2: data/kv-pairs-v0.3.jsonl split/document-groups.json (800/100/200)", "30.3: adapter + egyesített modell + GGUF (revíziókkal)", "30.4: eval-riport test-v1.0.0 (befagyasztva) golden-v1.0.0", "31.1: go / no-go ugyanarra a candidate_id-re", "31.2: reprodukciós csomag + modellkártya"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = [{"sec": "30.1", "lm": 113, "kind": "box", "label": "charter.v1.json\ncandidate.v1.json", "inp": "a projektcél, a metrika és a korlátok (charter), a modelljelöltek", "out": "acme-it-szabalyzat-2025-Q1.charter.v1.json, …candidate.v1.json (charter_id, candidate_id)", "schema": "{\"charter_id\": \"…charter.v1\", \"cel\": …, \"metrika\": …, \"korlatok\": …}\n{\"candidate_id\": \"…qwen2.5-1.5b.candidate.v1\", \"hf_id\": …, \"revision\": \"<40 hex>\"}"}, {"sec": "30.2", "lm": 114, "kind": "box", "label": "data/kv-pairs-v0.3.jsonl\nsplit/document-groups.json\n(800/100/200)", "inp": "charter (adatdöntések: licenc, PII, adatverzió)", "out": "data/kv-pairs-v0.3.jsonl, split/document-groups.json – dokumentumcsoportos split 800/100/200", "schema": "{\"kerdes\": …, \"valasz\": …, \"hivatkozas\": \"IT-SZAB-4.2\", \"doc_group\": …}\n{\"train\": [csoportok], \"val\": […], \"test\": […]}"}, {"sec": "30.3", "lm": 115, "kind": "box", "label": "adapter + egyesített\nmodell + GGUF\n(revíziókkal)", "inp": "kv-pairs (tanító/validációs rész), candidate_id (MODEL_ID + REVISION)", "out": "./adapter, ./merged_model (fp16), GGUF (Q4_K_M) – mindegyik revízióval/hash-sel", "schema": "adapter_config.json + adapter_model.safetensors; merged_model/*.safetensors; model-q4_k_m.gguf"}, {"sec": "30.4", "lm": 116, "kind": "frozen", "label": "eval-riport\ntest-v1.0.0 (befagyasztva)\ngolden-v1.0.0", "inp": "adapter vagy egyesített modell, test-v1.0.0 (200, befagyasztva), golden-v1.0.0 (30)", "out": "artifacts/eval_report.md, model_card.md, data_card.md, run_log.json, error_catalog.csv, risk_sheet.csv", "schema": "eval_report.md: metrika | n | mért | várt | minta; run_log.json: identitások + rekordszintű kimenetek"}, {"sec": "31.1", "lm": 117, "kind": "diamond", "label": "go / no-go\nugyanarra a\ncandidate_id-re", "inp": "a 30.4 bizonyítékcsomagja (eval_report, risk_sheet)", "out": "kiadási döntés (go / feltételes go / no-go) a candidate_id-re, kitöltött checklist", "schema": "kritérium | várt | minimum | mért | státusz | bizonyíték"}, {"sec": "31.2", "lm": 118, "kind": "box", "label": "reprodukciós csomag\n+ modellkártya", "inp": "minden korábbi artefaktum és azonosító", "out": "reprodukciós csomag (lockfile, seed, adat- és modellverzió, notebook) + modellkártya", "schema": "acceptance_criteria.json, reference_run.json, requirements.lock, model_card.md"}], EDGES = ["charter_id,\ncandidate_id", "kv-pairs-v0.3\n.jsonl, document-\ngroups.json", "adapter / merged", "eval_report\n.md", "döntés +\ncandidate_id"];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 360"); svg.innerHTML = "";
  const P = [[10,24],[225,24],[440,24],[10,150],[225,150],[440,150]], W = 190, H = 72;
  for (let i = 0; i < 5; i++) {
    const [x0, y0] = P[i], [x1, y1] = P[i + 1];
    if (i === 2) { el("path", {d: `M${x0 + W/2} ${y0 + H} V${y0 + H + 16} H${x1 + W/2} V${y1 - 4}`, fill: "none", stroke: css("--line"), "stroke-width": i < s.node ? 2.5 : 1.2});
                   el("text", {x: 320, y: y0 + H + 12, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, EDGES[i].replace("\n", " ")); }
    else { el("line", {x1: x0 + W, y1: y0 + H / 2, x2: x1 - 4, y2: y1 + H / 2, stroke: css("--line"), "stroke-width": i < s.node ? 2.5 : 1.2}); }
    const [ex, ey] = i === 2 ? [x1 + W / 2, y1 - 4] : [x1 - 4, y1 + H / 2];
    el("path", {d: i === 2 ? `M${ex - 5} ${ey - 8} L${ex} ${ey} L${ex + 5} ${ey - 8} Z` : `M${ex - 8} ${ey - 5} L${ex} ${ey} L${ex - 8} ${ey + 5} Z`, fill: css("--line")});
  }
  NODES.forEach((n, i) => {
    const [x, y] = P[i], on = i === s.node, g = document.createElementNS(NS, "g");
    g.setAttribute("tabindex", 0); g.setAttribute("role", "button"); g.setAttribute("aria-label", n.sec + " " + n.label.replace(/\n/g, " "));
    g.style.cursor = "pointer"; svg.appendChild(g);
    const add = (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; g.appendChild(e); return e; };
    const fill = on ? css("--cellhl") : css("--cell"), sw = on ? 3 : 1.2;
    if (n.kind === "diamond") add("polygon", {points: `${x} ${y + H/2} ${x + W/2} ${y - 6} ${x + W} ${y + H/2} ${x + W/2} ${y + H + 6}`, fill, stroke: css("--line"), "stroke-width": sw});
    else { add("rect", {x, y, width: W, height: H, rx: 6, fill, stroke: css("--line"), "stroke-width": sw});
           if (n.kind === "frozen") add("rect", {x: x + 4, y: y + 4, width: W - 8, height: H - 8, rx: 4, fill: "none", stroke: css("--line")}); }
    add("text", {x: x + (n.kind === "diamond" ? W / 2 : 4), y: y - 4 + (n.kind === "diamond" ? -6 : 0), "text-anchor": n.kind === "diamond" ? "middle" : "start", "font-size": 11, "font-weight": "bold"}, n.sec + " (lm" + n.lm + ")");
    n.label.split("\n").forEach((t, j, a) => add("text", {x: x + W / 2, y: y + H / 2 + 4 + (j - (a.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11.5}, t));
    g.addEventListener("click", () => show(i));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(i); } });
  });
  const n = NODES[s.node];
  el("rect", {x: 10, y: 240, width: 620, height: 112, fill: css("--cell"), stroke: css("--line")});
  const lines = [["Bemenet: ", n.inp], ["Kimenet: ", n.out], ["Séma: ", n.schema]];
  let yy = 260;
  lines.forEach(([h, t]) => {
    t.split("\n").forEach((part, j) => {
      el("text", {x: 20, y: yy, "font-size": 12, "font-weight": j ? "normal" : "bold"}, (j ? "         " : h));
      const words = part.split(" "); let line = "", x0 = 86;
      for (const w of words) { if ((line + w).length > 82) { el("text", {x: x0, y: yy, "font-size": 12, "font-family": h === "Séma: " ? "monospace" : "inherit"}, line); yy += 15; line = ""; } line += w + " "; }
      el("text", {x: x0, y: yy, "font-size": 12, "font-family": h === "Séma: " ? "monospace" : "inherit"}, line); yy += 16;
    });
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
