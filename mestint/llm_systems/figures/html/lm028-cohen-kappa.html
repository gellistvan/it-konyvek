<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohen-kappa összetevői</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd;--cell:#fff;--cellhl:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444;--cell:#262626;--cellhl:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:120px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Cellák (összeg 100)">
  <label>AA <input id="c0" type="range" min="0" max="100" step="1" aria-label="AA cella"><b id="v0"></b></label>
  <label>AB <input id="c1" type="range" min="0" max="100" step="1" aria-label="AB cella"><b id="v1"></b></label>
  <label>BA <input id="c2" type="range" min="0" max="100" step="1" aria-label="BA cella"><b id="v2"></b></label>
  <label>BB <input id="c3" type="range" min="0" max="100" step="1" aria-label="BB cella"><b id="v3"></b></label>
</div>
<div class="ctl"><button id="fix">Javított példa (55/15/5/25)</button><button id="skew">Torz marginálisok (90/10–90/10, függetlenül)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Megfigyelt és véletlen kontingenciatábla, alatta a 0–1 sáv a megfigyelt és a véletlen egyezéssel és a kappával."></svg>
<p class="small">Egy csúszka mozgatásakor a másik három cella arányosan változik, így az összeg mindig 100. p<sub>o</sub> = átló / 100; p<sub>e</sub> = Σ sorösszeg·oszlopösszeg / 100²; κ = (p<sub>o</sub> − p<sub>e</sub>)/(1 − p<sub>e</sub>). Sávok (Landis–Koch): ≤ 0,20 csekély, 0,21–0,40 gyenge, 0,41–0,60 mérsékelt, 0,61–0,80 jelentős, felette majdnem tökéletes.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
let C = [55, 15, 5, 25];
function band(k){ if (Math.abs(k) < 0.005) return "a véletlen szintjén lévő (nincs valódi)"; if (k < 0) return "véletlennél rosszabb"; if (k <= 0.2) return "csekély"; if (k <= 0.4) return "gyenge"; if (k <= 0.6) return "mérsékelt"; if (k <= 0.8) return "jelentős"; return "majdnem tökéletes"; }
function setCell(i, v){
  v = Math.max(0, Math.min(100, Math.round(v)));
  const others = [0, 1, 2, 3].filter(j => j !== i), rest = 100 - v, tot = others.reduce((s, j) => s + C[j], 0);
  const raw = others.map(j => tot > 0 ? C[j] * rest / tot : rest / 3), fl = raw.map(Math.floor);
  let left = rest - fl.reduce((a, b) => a + b, 0);
  raw.map((r, q) => [r - fl[q], q]).sort((a, b) => b[0] - a[0]).forEach(([, q]) => { if (left > 0) { fl[q]++; left--; } });
  others.forEach((j, q) => C[j] = fl[q]); C[i] = v;
}
function tbl(x0, y0, vals, title, fmt){
  el("text", {x: x0 + 75, y: y0 - 26, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, title);
  ["A", "B"].forEach((l, j) => { el("text", {x: x0 + 37 + j * 75, y: y0 - 6, "text-anchor": "middle", "font-size": 12}, l);
    el("text", {x: x0 - 12, y: y0 + 42 + j * 60, "text-anchor": "middle", "font-size": 12}, l); });
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const d = i === j;
    el("rect", {x: x0 + j * 75, y: y0 + i * 60, width: 75, height: 60, fill: d ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": d ? 3 : 1});
    el("text", {x: x0 + j * 75 + 37, y: y0 + i * 60 + 37, "text-anchor": "middle", "font-size": 18, "font-weight": d ? "bold" : "normal"}, fmt(vals[2 * i + j])); }
  const rs = [vals[0] + vals[1], vals[2] + vals[3]], cs = [vals[0] + vals[2], vals[1] + vals[3]];
  rs.forEach((v, i) => el("text", {x: x0 + 168, y: y0 + 37 + i * 60, "text-anchor": "middle", "font-size": 13, "font-style": "italic"}, fmt(v)));
  cs.forEach((v, j) => el("text", {x: x0 + 37 + j * 75, y: y0 + 138, "text-anchor": "middle", "font-size": 13, "font-style": "italic"}, fmt(v)));
}
function draw(){
  C.forEach((v, i) => { document.getElementById("c" + i).value = v; document.getElementById("v" + i).textContent = v; });
  const n = 100, po = (C[0] + C[3]) / n, r = [(C[0] + C[1]) / n, (C[2] + C[3]) / n], c = [(C[0] + C[2]) / n, (C[1] + C[3]) / n];
  const pe = r[0] * c[0] + r[1] * c[1]; let k = pe < 1 - 1e-12 ? (po - pe) / (1 - pe) : NaN; if (Math.abs(k) < 1e-9) k = 0;
  const E = [r[0] * c[0] * 100, r[0] * c[1] * 100, r[1] * c[0] * 100, r[1] * c[1] * 100];
  svg.innerHTML = "";
  tbl(40, 40, C, "megfigyelt", v => String(v));
  tbl(360, 40, E, "véletlen (marginálisszorzat)", v => f(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : 1));
  el("text", {x: 245, y: 110, "font-size": 13}, "p_o = " + f(po, 2));
  el("text", {x: 565, y: 110, "font-size": 13}, "p_e = " + f(pe, 2));
  const X = t => 40 + 560 * t, y = 245;
  el("line", {x1: X(0), y1: y, x2: X(1), y2: y, stroke: css("--line")});
  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(t => { el("line", {x1: X(t), y1: y - 5, x2: X(t), y2: y + 5, stroke: css("--line")}); el("text", {x: X(t), y: y + 20, "text-anchor": "middle", "font-size": 11}, f(t, 1)); });
  if (po >= pe) el("rect", {x: X(pe), y: y - 9, width: X(po) - X(pe), height: 18, fill: css("--hl"), opacity: 0.6});
  else el("rect", {x: X(po), y: y - 9, width: X(pe) - X(po), height: 18, fill: css("--hl2"), opacity: 0.6});
  el("rect", {x: X(pe), y: y - 24, width: X(1) - X(pe), height: 10, fill: "none", stroke: css("--fg"), "stroke-dasharray": "3 2"});
  el("text", {x: (X(pe) + X(1)) / 2, y: y - 28, "text-anchor": "middle", "font-size": 11}, "1 − p_e = " + f(1 - pe, 2));
  el("text", {x: X(pe), y: y + 36, "text-anchor": "middle", "font-size": 12}, "p_e");
  el("text", {x: X(po), y: y + 50, "text-anchor": "middle", "font-size": 12}, "p_o");
  document.getElementById("status").textContent = isNaN(k) ? `p_o = ${f(po, 2)}, p_e = 1: a kappa nem értelmezhető (minden címke egy kategória).`
    : `p_o = ${f(po, 2)}, p_e = ${f(pe, 2)}, κ = (p_o − p_e)/(1 − p_e) = ${f(k, 3)} – ${band(k)} egyezés.`;
}
[0, 1, 2, 3].forEach(i => document.getElementById("c" + i).addEventListener("input", e => { setCell(i, +e.target.value); draw(); }));
document.getElementById("fix").onclick = () => { C = [55, 15, 5, 25]; draw(); };
document.getElementById("skew").onclick = () => { C = [81, 9, 9, 1]; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
