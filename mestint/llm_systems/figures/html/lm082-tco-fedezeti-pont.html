<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCO és fedezeti pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--line:#000;--grid:#ddd;--l2:#555;--cell:#fff}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--line:#ddd;--grid:#444;--l2:#bbb;--cell:#262626}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:130px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>API input: <input id="pin" type="range" min="0.5" max="30" step="0.5" value="8" aria-label="API input ár USD per 1M token"><b id="pinv"></b> USD/1M</label>
  <label>API output: <input id="pout" type="range" min="0.5" max="60" step="0.5" value="24" aria-label="API output ár USD per 1M token"><b id="poutv"></b> USD/1M</label>
  <label>input arány: <input id="rin" type="range" min="0" max="100" step="5" value="80" aria-label="Input tokenek aránya százalékban"><b id="rinv"></b>%</label>
  <label>GPU-óradíj: <input id="pg" type="range" min="0.5" max="12" step="0.25" value="4" aria-label="GPU-óradíj USD/óra"><b id="pgv"></b> USD/óra</label>
  <label>átvitel: <input id="r" type="range" min="200" max="8000" step="100" value="2000" aria-label="Átvitel token/s"><b id="rv"></b> token/s</label>
  <label>fix + mérnöki: <input id="fx" type="range" min="0" max="6000" step="100" value="1800" aria-label="Fix és mérnöki havi költség USD"><b id="fxv"></b> USD/hó</label>
  <button id="rs">Kérdés paraméterei</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Havi költség a havi tokenmennyiség függvényében: az API egyenes, a self-host igény szerinti GPU-órával lépcsős, folyamatos bérléssel vízszintes; a fedezeti pontok és a 150 millió tokenes függőleges vonal jelölve."></svg>
<p class="small">Szemléltető árak, nem piaci adatok; prefill/decode nem szétválasztva. Folytonos vonal: API; pontozott lépcső: self-host igény szerinti GPU-órával (⌈N/(3600·átvitel)⌉ óra); szaggatott: self-host folyamatos, 720 órás bérléssel. ◆ = fedezeti pont.</p>
<script>
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id), svg = $("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const f = (x, d) => x.toFixed(d).replace(".", ","), g = x => Math.round(x).toLocaleString("hu-HU");
const DEF = {"pin": 8.0, "pout": 24.0, "rin": 80.0, "pg": 4.0, "r": 2000.0, "fx": 1800.0}, IDS = ["pin", "pout", "rin", "pg", "r", "fx"];
function draw(){
  const pin = +$("pin").value, pout = +$("pout").value, rin = +$("rin").value / 100, pg = +$("pg").value, r = +$("r").value, fx = +$("fx").value;
  $("pinv").textContent = f(pin, 1); $("poutv").textContent = f(pout, 1); $("rinv").textContent = Math.round(rin * 100);
  $("pgv").textContent = f(pg, 2); $("rv").textContent = r; $("fxv").textContent = g(fx);
  const pm = rin * pin + (1 - rin) * pout, tph = 3600 * r / 1e6;
  const api = n => n * pm, od = n => fx + Math.ceil(n / tph - 1e-12) * pg, cont = fx + 720 * pg;
  let be = null; for (let n = 0; n <= 20000; n += 0.05) { if (api(n) >= od(n)) { be = n; break; } }
  const bc = cont / pm;
  const nmax = Math.max(450, Math.min(2000, Math.ceil(Math.max(be || 0, bc) * 1.15 / 50) * 50));
  let ymax = Math.max(api(nmax), cont, od(nmax)) * 1.05; const st = ymax > 20000 ? 5000 : ymax > 8000 ? 2000 : 1000; ymax = Math.ceil(ymax / st) * st;
  const L = 66, R = 620, T = 12, B = 280, X = n => L + (R - L) * n / nmax, Y = v => B - (B - T) * Math.min(v, ymax) / ymax;
  svg.innerHTML = "";
  for (let v = 0; v <= ymax; v += st) { mk("line", {x1: L, x2: R, y1: Y(v), y2: Y(v), stroke: css("--grid")}); mk("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, g(v)); }
  const xs = nmax <= 500 ? 50 : nmax <= 1000 ? 100 : 250;
  for (let n = 0; n <= nmax; n += xs) mk("text", {x: X(n), y: B + 16, "text-anchor": "middle", "font-size": 11}, n);
  mk("text", {x: (L + R) / 2, y: B + 36, "text-anchor": "middle", "font-size": 12}, "havi tokenmennyiség (millió token)");
  mk("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "havi költség (USD)");
  mk("line", {x1: X(150), x2: X(150), y1: T, y2: B, stroke: css("--l2"), "stroke-dasharray": "6 3 2 3"});
  mk("line", {x1: L, x2: X(nmax), y1: Y(0), y2: Y(api(nmax)), stroke: css("--fg"), "stroke-width": 2.2});
  let d = "", prev = null; for (let i = 0; i <= 1500; i++) { const n = nmax * i / 1500, y = Y(od(n)); d += (i ? "L" : "M") + X(n).toFixed(1) + " " + (prev === null ? y : prev).toFixed(1) + (i ? "L" + X(n).toFixed(1) + " " + y.toFixed(1) : ""); prev = y; }
  mk("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "2 3"});
  mk("line", {x1: L, x2: R, y1: Y(cont), y2: Y(cont), stroke: css("--l2"), "stroke-width": 2, "stroke-dasharray": "8 5"});
  mk("text", {x: L + 6, y: Y(cont) - 6, "font-size": 11}, `self-host folyamatos: ${g(cont)} USD`);
  const dia = (x, y) => mk("path", {d: `M${x},${y - 8}l8,8l-8,8l-8,-8z`, fill: css("--fg")});
  if (be !== null && be <= nmax) { dia(X(be), Y(api(be))); mk("text", {x: X(be) + 10, y: Y(api(be)) + 18, "font-size": 11}, `≈ ${f(be, 0)}M`); }
  if (bc <= nmax) { dia(X(bc), Y(cont)); mk("text", {x: X(bc) - 10, y: Y(cont) - 12, "text-anchor": "end", "font-size": 11}, `≈ ${f(bc, 0)}M`); }
  [[api(150), "o"], [od(150), "s"], [cont, "t"]].forEach(([v, m]) => { const x = X(150), y = Y(v);
    if (m === "o") mk("circle", {cx: x, cy: y, r: 5, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 1.5});
    else if (m === "s") mk("rect", {x: x - 4.5, y: y - 4.5, width: 9, height: 9, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 1.5});
    else mk("path", {d: `M${x},${y - 6}l5.5,9.5h-11z`, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 1.5}); });
  mk("text", {x: R - 4, y: Y(api(nmax)) + (api(nmax) > ymax * 0.9 ? 18 : -6), "text-anchor": "end", "font-size": 11}, `API (${f(pm, 2)} USD/1M)`);
  $("status").textContent = `150M token/hó: API ${g(api(150))} USD, self-host igény szerint ${g(od(150))} USD, folyamatos ${g(cont)} USD. ` +
    `Fedezeti pont: ${be === null ? "nincs (20 000M-ig)" : "≈ " + f(be, 0) + "M"} (igény szerint), ≈ ${f(bc, 0)}M (folyamatos).`;
}
IDS.forEach(id => $(id).oninput = draw);
$("rs").onclick = () => { IDS.forEach(id => $(id).value = DEF[id]); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
