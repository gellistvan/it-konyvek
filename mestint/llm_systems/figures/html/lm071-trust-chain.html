<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integritás és hitelesség a modell-ellátási láncban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Forgatókönyv:</span> <label><input type="radio" name="sc" checked onchange="setScn('intact')"> érintetlen</label> <label><input type="radio" name="sc" onchange="setScn('file')"> csak fájlcsere</label> <label><input type="radio" name="sc" onchange="setScn('file_man')"> fájl + manifest csere</label> <label><input type="radio" name="sc" onchange="setScn('file_man_key')"> fájl + manifest + saját kulcsú aláírás</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A műtermékek a letöltési csatornán, a manifest és az aláírás külön, aláírt csatornán érkezik. Három kapu: integritás (SHA-256 egyezik a manifest hashével), hitelesség (az aláírás a szervezeti pubkey-jel ellenőrizhető), kompatibilitás. Ha a támadó csak a fájlt cseréli, az integritáskapu megfogja; ha a fájlt és a manifestet is, csak az aláírási kapu."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus. A kapueredményeket a szkript SHA-256-tal (hashlib) és egy JÁTÉK-RSA aláírással számolja (kis prímek, csak szemléltetés, nem valódi aláírási séma); konkrét aláíró eszköz (pl. Sigstore) verziója nem rögzített.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"g": -1, "msg": "Forgatókönyv: a műtermékek és a manifest érintetlenek.", "line": 0, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": -1, "msg": "hash = SHA256(model.safetensors) = 3c968a5b…; a manifestben: 3c968a5b…", "line": 1, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 0, "msg": "integritás: 3c968a5b… == 3c968a5b… → igaz", "line": 2, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 1, "msg": "hitelesség: verify(szervezeti pubkey, signature, manifest) → igaz", "line": 3, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 2, "msg": "kompatibilis: bázismodell llama-3.1-8b, rank 8 egyezik → igaz", "line": 4, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 3, "msg": "integritás: igaz, hitelesség: igaz, kompatibilis: igaz → engedélyezett = igaz", "line": 5, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}];
const CODE = ["műtermék      = (file, metadata)", "hash          = SHA256(file)", "integritás     = hash == manifest_hash", "hiteles        = verify(pubkey, signature, manifest) == true", "kompatibilis   = (bázismodell, rank) egyezik", "engedélyezett  = hiteles AND integritás AND kompatibilis"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = {"intact": [{"g": -1, "msg": "Forgatókönyv: a műtermékek és a manifest érintetlenek.", "line": 0, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": -1, "msg": "hash = SHA256(model.safetensors) = 3c968a5b…; a manifestben: 3c968a5b…", "line": 1, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 0, "msg": "integritás: 3c968a5b… == 3c968a5b… → igaz", "line": 2, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 1, "msg": "hitelesség: verify(szervezeti pubkey, signature, manifest) → igaz", "line": 3, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 2, "msg": "kompatibilis: bázismodell llama-3.1-8b, rank 8 egyezik → igaz", "line": 4, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}, {"g": 3, "msg": "integritás: igaz, hitelesség: igaz, kompatibilis: igaz → engedélyezett = igaz", "line": 5, "kind": "intact", "integ": true, "auth": true, "compat": true, "ok": true}], "file": [{"g": -1, "msg": "Forgatókönyv: a támadó a letöltési csatornán kicseréli a model.safetensors fájlt.", "line": 0, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}, {"g": -1, "msg": "hash = SHA256(model.safetensors) = 2370c357…; a manifestben: 3c968a5b…", "line": 1, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}, {"g": 0, "msg": "integritás: 2370c357… ≠ 3c968a5b… → hamis", "line": 2, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}, {"g": 1, "msg": "hitelesség: verify(szervezeti pubkey, signature, manifest) → igaz", "line": 3, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}, {"g": 2, "msg": "kompatibilis: bázismodell llama-3.1-8b, rank 8 egyezik → igaz", "line": 4, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}, {"g": 3, "msg": "integritás: hamis, hitelesség: igaz, kompatibilis: igaz → engedélyezett = hamis", "line": 5, "kind": "file", "integ": false, "auth": true, "compat": true, "ok": false}], "file_man": [{"g": -1, "msg": "Forgatókönyv: a támadó a fájlt és a manifest hash-sorát is kicseréli (ugyanazon a csatornán).", "line": 0, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": -1, "msg": "hash = SHA256(model.safetensors) = 2370c357…; a manifestben: 2370c357…", "line": 1, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 0, "msg": "integritás: 2370c357… == 2370c357… → igaz", "line": 2, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 1, "msg": "hitelesség: verify(szervezeti pubkey, signature, manifest) → hamis (a manifest megváltozott, vagy nem a horgonyban lévő kulcs írta alá)", "line": 3, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 2, "msg": "kompatibilis: bázismodell llama-3.1-8b, rank 8 egyezik → igaz", "line": 4, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 3, "msg": "integritás: igaz, hitelesség: hamis, kompatibilis: igaz → engedélyezett = hamis", "line": 5, "kind": "file_man", "integ": true, "auth": false, "compat": true, "ok": false}], "file_man_key": [{"g": -1, "msg": "Forgatókönyv: a támadó a fájlt és a manifestet cseréli, és a saját kulcsával újra aláírja.", "line": 0, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": -1, "msg": "hash = SHA256(model.safetensors) = 2370c357…; a manifestben: 2370c357…", "line": 1, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 0, "msg": "integritás: 2370c357… == 2370c357… → igaz", "line": 2, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 1, "msg": "hitelesség: verify(szervezeti pubkey, signature, manifest) → hamis (a manifest megváltozott, vagy nem a horgonyban lévő kulcs írta alá)", "line": 3, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 2, "msg": "kompatibilis: bázismodell llama-3.1-8b, rank 8 egyezik → igaz", "line": 4, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}, {"g": 3, "msg": "integritás: igaz, hitelesség: hamis, kompatibilis: igaz → engedélyezett = hamis", "line": 5, "kind": "file_man_key", "integ": true, "auth": false, "compat": true, "ok": false}]};
let SCN = "intact";
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 270");
  const defs = el("defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  const zone = (x, w, t) => { el("rect", {x, y: 8, width: w, height: 250, fill: "none", stroke: css("--muted"), "stroke-dasharray": "3 3"}); el("text", {x: x + w / 2, y: 26, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, t); };
  zone(4, 170, "Publikus regiszter"); zone(184, 150, "Belső tároló"); zone(344, 412, "Futtatókörnyezet");
  const evilF = s.kind !== "intact", evilM = s.kind === "file_man" || s.kind === "file_man_key";
  const box = (x, y, w, h, t, bad) => { el("rect", {x, y, width: w, height: h, rx: 6, fill: css("--cell"), stroke: bad ? css("--hl2") : css("--line"), "stroke-width": bad ? 3 : 1.2, "stroke-dasharray": bad ? "4 2" : "none"}); t.split("\n").forEach((u, j, a) => el("text", {x: x + w / 2, y: y + h / 2 + 4 + (j - (a.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, u)); };
  box(14, 50, 150, 64, "model.safetensors\nconfig.json\nadapter_model…", false);
  box(14, 170, 150, 50, "manifest.json\n+ signature", false);
  box(194, 50, 130, 64, evilF ? "model.safetensors\n(KICSERÉLVE)" : "műtermékek", evilF);
  box(194, 170, 130, 50, evilM ? "manifest.json\n(átírva)" : "manifest.json\n+ signature", evilM);
  el("line", {x1: 164, y1: 82, x2: 194, y2: 82, stroke: css("--fg"), "stroke-width": 2, "marker-end": "url(#ah)"});
  el("line", {x1: 164, y1: 195, x2: 194, y2: 195, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": "6 3", "marker-end": "url(#ah)"});
  const GX = [420, 535, 650], names = ["integritás", "hitelesség", "kompatibilis"], vals = [s.integ, s.auth, s.compat];
  el("line", {x1: 324, y1: 82, x2: GX[0] - 48, y2: 82, stroke: css("--fg"), "stroke-width": 2, "marker-end": "url(#ah)"});
  el("polyline", {points: `324,195 360,195 360,${82 + 44} ${GX[0] - 20},${82 + 30}`, fill: "none", stroke: css("--fg"), "stroke-dasharray": "6 3", "stroke-width": 1.5, "marker-end": "url(#ah)"});
  el("polyline", {points: `360,195 ${GX[1]},195 ${GX[1]},${82 + 42}`, fill: "none", stroke: css("--fg"), "stroke-dasharray": "6 3", "stroke-width": 1.5, "marker-end": "url(#ah)"});
  el("rect", {x: GX[1] + 40, y: 150, width: 150, height: 38, rx: 5, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: GX[1] + 115, y: 166, "text-anchor": "middle", "font-size": 10.5}, "bizalmi horgony:");
  el("text", {x: GX[1] + 115, y: 180, "text-anchor": "middle", "font-size": 10.5}, "szervezeti pubkey");
  el("line", {x1: GX[1] + 60, y1: 150, x2: GX[1] + 18, y2: 108, stroke: css("--fg"), "stroke-width": 1.2, "marker-end": "url(#ah)"});
  GX.forEach((x, i) => {
    const done = s.g >= i, v = vals[i];
    if (i > 0) el("line", {x1: GX[i - 1] + 48, y1: 82, x2: x - 48, y2: 82, stroke: css("--fg"), "stroke-width": 1.2, "marker-end": "url(#ah)"});
    el("path", {d: `M${x - 48},82 L${x},48 L${x + 48},82 L${x},116 Z`, fill: done ? css("--cellhl") : css("--cell"), stroke: done ? (v ? css("--hl") : css("--hl2")) : css("--line"), "stroke-width": done ? 3 : 1.2});
    el("text", {x, y: 80, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, names[i]);
    if (done) el("text", {x, y: 102, "text-anchor": "middle", "font-size": 18, "font-weight": "bold", fill: v ? css("--hl") : css("--hl2")}, v ? "✓" : "✗");
  });
  if (s.g >= 3) { el("text", {x: 750, y: 245, "text-anchor": "end", "font-size": 14, "font-weight": "bold", fill: s.ok ? css("--hl") : css("--hl2")}, `engedélyezett = ${s.ok ? "igaz ✓" : "hamis ✗"}`); }
}
function setScn(v){ SCN = v; const kk = k; setSteps(SETS[v]); show(kk); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
