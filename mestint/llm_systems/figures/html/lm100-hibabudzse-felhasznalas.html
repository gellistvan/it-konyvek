<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibabüdzsé-felhasználás kategóriánként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--c0:#c55a11;--c1:#1f4e79;--c2:#548235;--line:#000;--grid:#ddd;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--c0:#f0a060;--c1:#8fb8e8;--c2:#9fd08a;--line:#ddd;--grid:#444;--warn:#ff7a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:150px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Havi hibaszámok">
  <label>visszatérítés <input id="e0" type="range" min="0" max="1500" step="10" value="1000" aria-label="Visszatérítési hibák havonta"><b id="e0v"></b></label>
  <label>szállítás <input id="e1" type="range" min="0" max="4000" step="50" value="1000" aria-label="Szállítási hibák havonta"><b id="e1v"></b></label>
  <label>ajánlás <input id="e2" type="range" min="0" max="45000" step="500" value="15000" aria-label="Ajánlási hibák havonta"><b id="e2v"></b></label>
  <button id="bscen">Ellenpélda (1000/1000/15 000)</button><button id="bbase">Pontosan a büdzsé (250/2000/30 000)</button>
</div>
<div class="ctl" role="group" aria-label="Nap és szabály">
  <button id="dprev" title="Előző nap">◀ Nap</button>
  <button id="dplay" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="dnext" title="Következő nap">Nap ▶</button>
  <label>nap: <input id="day" type="range" min="1" max="30" step="1" value="30" aria-label="A hónap napja"><b id="dayv"></b></label>
  <label><input id="rule" type="checkbox" checked aria-label="Kategóriánkénti szabály"> kategóriánkénti szabály (kikapcsolva: csak összesített)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Négy görbe a hónap 30 napján: az összesített és a három kategória felhasznált büdzséje százalékban, vízszintes szaggatott vonal 80 százaléknál."></svg>
<p class="small">Szintetikus forgalom: 500 000 kérés/hó, súlyok 10/5/1, egyenletes napi hibaeloszlás; kategóriabüdzsé 250 / 2000 / 30 000 hiba (2500 / 10 000 / 30 000 pont), összesen 42 500 pont. A 80%-os küszöb az összesítettnél 34 000 pont. Sematikus modell, nem mérés.</p>
<script>
const C = {"days": 30, "thr": 0.8, "names": ["visszatérítés", "szállítás", "ajánlás"], "w": [10, 5, 1], "berr": [250, 2000, 30000], "total": 42500, "scen": [1000, 1000, 15000]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function hu(x, dg){ return x.toFixed(dg).replace(".", ",").replace("-", "−"); }
function th(x){ return Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
const $ = id => document.getElementById(id);
let tmr = null;
function errs(){ return [0, 1, 2].map(i => +$("e" + i).value); }
function model(E){
  const cat = E.map((e, i) => Array.from({length: C.days}, (_, t) => e * (t + 1) / C.days / C.berr[i]));
  const pts = Array.from({length: C.days}, (_, t) => E.reduce((s, e, i) => s + e * C.w[i] * (t + 1) / C.days, 0));
  return {cat, pts, tot: pts.map(p => p / C.total)};
}
function firstCross(arr){ const i = arr.findIndex(v => v >= C.thr - 1e-12); return i < 0 ? null : i + 1; }
function draw(){
  const E = errs(), D = +$("day").value, rule = $("rule").checked, M = model(E);
  E.forEach((e, i) => $("e" + i + "v").textContent = th(e));
  $("dayv").textContent = D + ".";
  const ymax = Math.max(1.2, ...M.cat.map(c => c[C.days - 1]), M.tot[C.days - 1]) * 1.05;
  const X = t => 60 + (t - 1) / (C.days - 1) * 470, Y = v => 290 - v / ymax * 270;
  svg.innerHTML = "";
  const fg = css("--fg"), mut = css("--muted"), grid = css("--grid");
  for (let p = 0; p <= ymax * 100; p += (ymax > 2.5 ? 100 : 20)) {
    el("line", {x1: 60, x2: 530, y1: Y(p / 100), y2: Y(p / 100), stroke: grid});
    el("text", {x: 54, y: Y(p / 100) + 4, "font-size": 11, "text-anchor": "end"}, p + "%");
  }
  [1, 5, 10, 15, 20, 25, 30].forEach(t => el("text", {x: X(t), y: 306, "font-size": 11, "text-anchor": "middle"}, String(t)));
  el("text", {x: 295, y: 324, "font-size": 12, "text-anchor": "middle"}, "a hónap napja");
  el("line", {x1: 60, x2: 530, y1: Y(C.thr), y2: Y(C.thr), stroke: mut, "stroke-width": 1.5, "stroke-dasharray": "7 4"});
  el("text", {x: 534, y: Y(C.thr) + 4, "font-size": 11}, "80% (34 000 pont)");
  el("rect", {x: X(D) - 1, y: 18, width: 2, height: 272, fill: css("--hl"), opacity: 0.5});
  const path = (arr, col, dash, w) => el("polyline", {points: arr.map((v, t) => X(t + 1) + "," + Y(v)).join(" "), fill: "none", stroke: col, "stroke-width": w, "stroke-dasharray": dash});
  const st = [[css("--c0"), "2 4", 2.2, "▲"], [css("--c1"), "8 4", 2, "■"], [css("--c2"), "8 3 2 3", 2, "●"]];
  M.cat.forEach((c, i) => {
    path(c, st[i][0], st[i][1], st[i][2]);
    for (let t = i; t < C.days; t += 3) el("text", {x: X(t + 1), y: Y(c[t]) + 4, "font-size": 10, "text-anchor": "middle", fill: st[i][0]}, st[i][3]);
  });
  path(M.tot, fg, "", 4);
  [["összesített", fg, "", 4, ""], ...C.names.map((n, i) => [n, st[i][0], st[i][1], st[i][2], st[i][3]])].forEach((L, i) => {
    el("line", {x1: 70, x2: 100, y1: 24 + i * 17, y2: 24 + i * 17, stroke: L[1], "stroke-width": L[3], "stroke-dasharray": L[2]});
    el("text", {x: 85, y: 28 + i * 17, "font-size": 10, "text-anchor": "middle", fill: L[1]}, L[4]);
    el("text", {x: 106, y: 28 + i * 17, "font-size": 11.5}, L[0]);
  });
  // riasztások
  const tCross = firstCross(M.tot), cCross = M.cat.map(firstCross);
  if (rule) cCross.forEach((cd, i) => { if (cd && cd <= D) { el("circle", {cx: X(cd), cy: Y(C.thr), r: 5, fill: "none", stroke: css("--warn"), "stroke-width": 2}); el("text", {x: X(cd) + 6, y: Y(C.thr) - 8 - 13 * i, "font-size": 11, fill: css("--warn")}, `${C.names[i]}: riasztás (${cd}. nap)`); } });
  if (tCross && tCross <= D) el("circle", {cx: X(tCross), cy: Y(C.thr), r: 6, fill: css("--warn")});
  const p = M.pts[D - 1], z = M.tot[D - 1];
  const tAl = z >= C.thr - 1e-12;
  const cAl = C.names.filter((n, i) => M.cat[i][D - 1] >= C.thr - 1e-12).map((n, i2) => n);
  const catTxt = C.names.map((n, i) => `${n} ${hu(100 * M.cat[i][D - 1], 1)}%`).join(", ");
  let s = `${D}. nap: összesített ${th(p)} pont (${hu(100 * z, 1)}%), riasztás: ${tAl ? "igen" : "nem"}; `;
  s += rule ? `kategória-riasztás: ${cAl.length ? cAl.join(", ") : "nincs"} (${catTxt})`
            : `kategóriánkénti szabály kikapcsolva – a kategóriák állapota nem vált ki riasztást (${catTxt})`;
  $("status").textContent = s;
}
function stopPlay(){ if (tmr) { clearInterval(tmr); tmr = null; } $("dplay").textContent = "▶ Lejátszás"; }
function setDay(v){ $("day").value = Math.max(1, Math.min(C.days, v)); draw(); }
["e0", "e1", "e2", "day", "rule"].forEach(id => $(id).addEventListener("input", () => { if (id === "day") stopPlay(); draw(); }));
$("dprev").onclick = () => { stopPlay(); setDay(+$("day").value - 1); };
$("dnext").onclick = () => { stopPlay(); setDay(+$("day").value + 1); };
$("dplay").onclick = () => {
  if (tmr) { stopPlay(); return; }
  if (+$("day").value >= C.days) setDay(1);
  $("dplay").textContent = "⏸ Szünet";
  tmr = setInterval(() => { if (+$("day").value >= C.days) stopPlay(); else setDay(+$("day").value + 1); }, 350);
};
$("bscen").onclick = () => { C.scen.forEach((v, i) => $("e" + i).value = v); draw(); };
$("bbase").onclick = () => { C.berr.forEach((v, i) => $("e" + i).value = v); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
