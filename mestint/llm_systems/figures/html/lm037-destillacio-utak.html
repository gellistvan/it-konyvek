<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logit- és válaszalapú destilláció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>példányszám <input id="cn" type="number" value="5500" min="1" style="width:6em"></label> <label>átl. hossz L <input id="cl" type="number" value="256" min="1" style="width:5em"></label> <label>|V| <input id="cv" type="number" value="128256" min="2" style="width:7em"></label> <label>k <input id="ck" type="number" value="20" min="1" style="width:4em"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két oszlopos folyamat: balra a logitalapú, jobbra a válaszalapú destilláció hat lépése; a tárolás és a diák mindkét oldalon azonos szerepű."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Tárméret-kalkulátor: teljes logittenzor BF16-ban N·L·|V|·2 bájt, top-k: N·L·k·6 bájt (FP16 érték + int32 index). Kezdőértékek: a labor 5500 példája, L = 256, |V| = 128 256 (Llama-3 család), k = 20 → ≈ 361,2 GB vs. ≈ 0,169 GB. Levezetett, nem mért értékek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"row": 0, "msg": "Logit: az x bemenethez a referencia y is kell (teacher forcing). | Válasz: csak az x bemenet kell.", "line": 0}, {"row": 1, "msg": "Logit: a tanár egyszer előre fut az (x, y) páron; nem generál. | Válasz: a tanár hőmérsékletes mintavétellel ŷ-t generál, akár több változatot.", "line": 1}, {"row": 2, "msg": "Logit: minden pozícióra |V| hosszú logitvektor: [B, L, |V|]. | Válasz: a kimenet szöveg (token-azonosítók), nem eloszlás.", "line": 2}, {"row": 3, "msg": "Logit: pozíciónként csak a top-k logit és index marad (különben a tár kezelhetetlen). | Válasz: szűrés (helyesség, formátum) és deduplikáció.", "line": 3}, {"row": 4, "msg": "Logit: tárolás – lásd a kalkulátort (teljes vs. top-k). | Válasz: szövegként tárolva, kis méret.", "line": 4}, {"row": 5, "msg": "Logit: a diák α·L_CE + (1 − α)·T²·KL veszteséggel tanul; közös tokenizáló kell. | Válasz: a diák SFT-veszteséggel (L_seq) tanul; eltérő tokenizáló megengedett, a tanár hibái öröklődnek.", "line": 5}];
const CODE = ["1. bemenet (logit: x + y; válasz: x)", "2. tanár: teacher forcing | generálás (hőmérséklet, több változat)", "3. logitok [B, L, |V|] | ŷ szövegek", "4. top-k (érték + index) | szűrés, dedup", "5. tárolás: teljes vagy top-k | szövegként", "6. diák: α·L_CE + (1 − α)·T²·KL | L_seq (SFT)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LT = ["bemenet x + referencia y", "tanár (teacher forcing,\negy előre futtatás)", "logitok [B, L, |V|]", "top-k kiválasztás\n(érték + index)", "tárolás", "diák:\nα·L_CE + (1 − α)·T²·KL"], RT = ["bemenet x", "tanár generál ŷ\n(hőmérsékletes mintavétel,\ntöbb változat)", "ŷ szövegek", "szűrés / dedup", "tárolás szövegként", "diák:\nL_seq (SFT-veszteség)"];
function fmtB(b){ return b >= 1e12 ? (b / 1e12).toFixed(2).replace(".", ",") + " TB" : b >= 1e9 ? (b / 1e9).toFixed(b >= 1e10 ? 1 : 3).replace(".", ",") + " GB" : (b / 1e6).toFixed(1).replace(".", ",") + " MB"; }
function calc(){ const g = id => +document.getElementById(id).value; const n = g("cn"), l = g("cl"), v = g("cv"), kk = g("ck"); return {full: n * l * v * 2, top: n * l * kk * 6, n, l, v, kk}; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 420"); svg.innerHTML = "";
  const c = calc();
  el("text", {x: 160, y: 18, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Logitalapú");
  el("text", {x: 480, y: 18, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Válaszalapú");
  [[160, LT, "none"], [480, RT, "6 4"]].forEach(([cx, items, da], col) => items.forEach((t, i) => {
    const y = 34 + i * 62, on = i === s.row, done = i < s.row, sh = i >= 4;
    let lines = t.split("\n");
    if (col === 0 && i === 2) lines = ["logitok [B, L, |V|]", `összesen N × L × |V| = ${c.n} × ${c.l} × ${c.v}`];
    if (col === 0 && i === 3) lines = [`top-k: k = ${c.kk} (érték + index)`];
    if (col === 0 && i === 4) lines = [`tárolás: teljes ${fmtB(c.full)} (BF16)`, `top-${c.kk}: ${fmtB(c.top)}`];
    el("rect", {x: cx - 135, y, width: 270, height: 46, rx: 6, fill: on ? css("--cellhl") : (sh ? css("--code") : css("--cell")), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.3, "stroke-dasharray": da, opacity: on || done ? 1 : 0.55});
    lines.forEach((q, j) => el("text", {x: cx, y: y + 23 + (j - (lines.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": 12, opacity: on || done ? 1 : 0.55}, q));
    if (i < 5) el("line", {x1: cx, y1: y + 46, x2: cx, y2: y + 62, stroke: css("--line"), "stroke-width": 1.4}); }));
  el("text", {x: 160, y: 412, "text-anchor": "middle", "font-size": 11.5, fill: css("--muted")}, "közös tokenizáló szükséges");
  el("text", {x: 480, y: 412, "text-anchor": "middle", "font-size": 11.5, fill: css("--muted")}, "eltérő tokenizáló megengedett; a tanár hibái öröklődnek");
}
['cn', 'cl', 'cv', 'ck'].forEach(id => document.getElementById(id).addEventListener("input", () => show(k)));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
