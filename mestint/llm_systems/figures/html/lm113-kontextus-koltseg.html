<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontextusablak-költségvetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--line:#000;--chunk:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--line:#ddd;--chunk:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:130px}
select,button{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block;max-width:680px}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<pattern id="diag" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#777" stroke-width="1.6"/></pattern>
<pattern id="dots" patternUnits="userSpaceOnUse" width="6" height="6"><circle cx="3" cy="3" r="1.2" fill="#777"/></pattern>
</defs></svg>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>chunkszám <input id="n" type="range" min="1" max="20" value="8" aria-label="Chunkszám"><b id="vn"></b></label>
  <label>chunkméret <input id="c" type="range" min="500" max="4000" step="100" value="2000" aria-label="Chunkméret tokenben"><b id="vc"></b></label>
  <label>sablon + kérdés <input id="t" type="range" min="100" max="2000" step="50" value="300" aria-label="Sablon és kérdés tokenben"><b id="vt"></b></label>
  <label>kimeneti tartalék <input id="o" type="range" min="128" max="4096" step="64" value="512" aria-label="Fenntartott kimeneti tokenek"><b id="vo"></b></label>
  <label>ablak <select id="w" aria-label="Kontextusablak mérete"><option value="8192">8k (8 192)</option><option value="16384">16k (16 384)</option><option value="32768" selected>32k (32 768)</option><option value="131072">128k (131 072)</option></select></label>
</div>
<div class="ctl">
  <button data-p="8,2000,300,512">8 chunk</button><button data-p="15,2000,300,512">15 chunk</button>
  <button data-p="16,2000,300,512">16 chunk</button><button data-p="15,2000,1200,2048">15 chunk, hosszú sablon</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 300" role="img" aria-label="Halmozott vízszintes sáv: chunkok, sablon, kimenet, és az ablakhatár"></svg>
<p class="small">Teljes keret = chunkszám × chunkméret + sablon és kérdés + fenntartott kimenet. A 30.1.13 példája: 8 · 2000 + 300 + 512 = 16 812.
A tokenszám a választott tokenizerrel és chat-sablonnal mérendő; a csúszkák csak az összeadást szemléltetik.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = v => v.toLocaleString("hu-HU").replace(/ /g, " ");
const ids = ["n", "c", "t", "o"];
function draw(){
  const [n, c, t, o] = ids.map(i => +document.getElementById(i).value), W = +document.getElementById("w").value;
  ids.forEach(i => document.getElementById("v" + i).textContent = document.getElementById(i).value);
  const parts = [["chunkok", n * c, css("--chunk")], ["sablon + kérdés", t, "url(#diag)"], ["kimenet", o, "url(#dots)"]];
  const tot = n * c + t + o, maxT = Math.max(W, tot) * 1.12, L = 20, R = 660, X = v => L + (R - L) * v / maxT;
  svg.innerHTML = "";
  let x = 0;
  parts.forEach(([name, v, fill]) => {
    el("rect", {x: X(x), y: 90, width: Math.max(0, X(x + v) - X(x)), height: 60, fill, stroke: css("--line"), "stroke-width": 0.8});
    x += v;
  });
  if (tot > W) el("rect", {x: X(W), y: 84, width: X(tot) - X(W), height: 72, fill: "none", stroke: css("--line"), "stroke-width": 3});
  el("line", {x1: X(W), x2: X(W), y1: 50, y2: 190, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: X(W), y: 44, "text-anchor": "middle", "font-size": 13}, "ablak: " + fmt(W));
  el("text", {x: X(tot), y: 176, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Σ " + fmt(tot));
  parts.forEach(([name, v, fill], i) => {
    const lx = 20 + i * 220;
    el("rect", {x: lx, y: 225, width: 24, height: 16, fill, stroke: css("--line")});
    el("text", {x: lx + 30, y: 238, "font-size": 13}, `${name}: ${fmt(v)}`);
  });
  el("text", {x: 20, y: 275, "font-size": 12}, `${n} × ${fmt(c)} + ${fmt(t)} + ${fmt(o)} = ${fmt(tot)} token`);
  document.getElementById("status").textContent = tot <= W
    ? `belefér: ${fmt(tot)} ≤ ${fmt(W)} (szabad: ${fmt(W - tot)} token)`
    : `nem fér el: +${fmt(tot - W)} token (${fmt(tot)} > ${fmt(W)}) – csökkentsd a chunkok számát vagy méretét`;
}
ids.forEach(i => document.getElementById(i).addEventListener("input", draw));
document.getElementById("w").addEventListener("change", draw);
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { b.dataset.p.split(",").forEach((v, j) => document.getElementById(ids[j]).value = v); document.getElementById("w").value = "32768"; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
