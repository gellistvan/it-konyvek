<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spike-detektálás EMA-val és szórássávval</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:130px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
b.v{min-width:2.6em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Detektor paraméterei">
  <label>β <input id="beta" type="range" min="0.5" max="0.99" step="0.01" value="0.9" aria-label="EMA béta"><b class="v" id="betav"></b></label>
  <label>k <input id="k" type="range" min="1" max="8" step="0.5" value="5" aria-label="Küszöbszorzó k"><b class="v" id="kv"></b></label>
  <label>W <input id="W" type="range" min="5" max="100" step="1" value="50" aria-label="Szórásablak W"><b class="v" id="Wv"></b></label>
  <label><input id="incl" type="checkbox"> aktuális pont a szórásban</label>
</div>
<div class="ctl">
  <button id="play">▶ Lejátszás</button><button id="reset">Alapbeállítás</button>
  <button id="w10">„be” + W = 10</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 420" role="img" aria-label="Szintetikus loss-görbe EMA-val és küszöbbel, alatta a gradiensnorma logaritmikus skálán; a detektált lépések háromszöggel jelölve."></svg>
<p class="small">Szintetikus adat, nem mért (300 lépés, trend 2,0 → 1,6, zaj σ = 0,02, seed 0; tranziens spike a 120., maradandó a 220. lépésnél).
Szabály: L<sub>t</sub> &gt; L̃<sub>t−1</sub> + k·σ̂<sub>t</sub>, σ̂<sub>t</sub> az utolsó W lépés szórása (alapesetben az aktuális pont nélkül).</p>

const N = D.L.length, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",");
function detect(beta, kk, W, incl){
  const ema = new Array(N), thr = new Array(N).fill(null), hits = []; ema[0] = D.L[0];
  for (let i = 1; i < N; i++) {
    const lo = incl ? Math.max(0, i - W + 1) : Math.max(0, i - W), hi = incl ? i + 1 : i;
    const n = hi - lo;
    if (n >= 2) { let m = 0; for (let j = lo; j < hi; j++) m += D.L[j]; m /= n;
      let s = 0; for (let j = lo; j < hi; j++) s += (D.L[j] - m) ** 2; s = Math.sqrt(s / n);
      thr[i] = ema[i-1] + kk * s; if (D.L[i] > thr[i]) hits.push(i); }
    ema[i] = beta * ema[i-1] + (1 - beta) * D.L[i];
  }
  return {ema, thr, hits};
}
const L0 = 60, R0 = 625, X = i => L0 + (R0 - L0) * i / (N - 1);
const YA = v => 20 + 215 * (3.05 - Math.max(1.5, Math.min(3.05, v))) / 1.55;
const YB = v => 270 + 110 * (Math.log10(30) - Math.log10(Math.max(0.2, Math.min(30, v)))) / (Math.log10(30) - Math.log10(0.2));
function path(arr, Y, upto){ let p = ""; for (let i = 0; i <= upto; i++) { if (arr[i] === null) continue; p += (p ? "L" : "M") + X(i).toFixed(1) + "," + Y(arr[i]).toFixed(1); } return p; }
let upto = N - 1, timer = null;
function draw(){
  const beta = +document.getElementById("beta").value, kk = +document.getElementById("k").value,
        W = +document.getElementById("W").value, incl = document.getElementById("incl").checked;
  document.getElementById("betav").textContent = f(beta, 2);
  document.getElementById("kv").textContent = f(kk, 1);
  document.getElementById("Wv").textContent = String(W);
  const r = detect(beta, kk, W, incl);
  svg.innerHTML = "";

  [0.3, 1, 3, 10, 30].forEach(v => { el("line", {x1: L0, y1: YB(v), x2: R0, y2: YB(v), stroke: css("--grid")}); el("text", {x: L0 - 6, y: YB(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, v < 1 ? 1 : 0)); });
  [0, 50, 100, 150, 200, 250, 299].forEach(i => el("text", {x: X(i), y: 398, "text-anchor": "middle", "font-size": 11}, String(i)));

  el("text", {x: 14, y: 128, "text-anchor": "middle", "font-size": 12, transform: "rotate(-90 14 128)"}, "loss");
  el("text", {x: 14, y: 325, "text-anchor": "middle", "font-size": 12, transform: "rotate(-90 14 325)"}, "‖g‖ (log)");
  el("line", {x1: L0, y1: YB(1), x2: R0, y2: YB(1), stroke: css("--fg"), "stroke-dasharray": "6 4"});
  el("text", {x: R0, y: YB(1) - 4, "text-anchor": "end", "font-size": 11}, "c = 1,0");

  el("path", {d: path(r.thr, YA, upto), fill: "none", stroke: css("--hl"), "stroke-width": 1.6, "stroke-dasharray": "2 3"});
  el("path", {d: path(D.G, YB, upto), fill: "none", stroke: css("--fg"), "stroke-width": 1});
  const shown = r.hits.filter(h => h <= upto);
  shown.forEach(h => { const x = X(h), y = YA(D.L[h]) - 6;
    el("path", {d: `M${x-6},${y-10}L${x+6},${y-10}L${x},${y}Z`, fill: css("--hl2"), stroke: css("--fg")});
    el("text", {x: x, y: y - 14, "text-anchor": "middle", "font-size": 11}, String(h));
    el("line", {x1: x, y1: 268, x2: x, y2: 382, stroke: css("--muted"), "stroke-dasharray": "2 3"}); });
  el("text", {x: L0 + 6, y: 16, "font-size": 11}, "— loss   – – EMA   ··· küszöb   ▼ jelzés");
  let msg = `Jelzett lépések (${shown.length}): ` + (shown.length ? shown.join(", ") : "nincs") + ".";
  const both = shown.includes(120) && shown.includes(220);
  if (incl && !(r.hits.includes(120) || r.hits.includes(220)))
    msg += ` A t-edik pont is benne van a szórásban: a kiugró pont a saját küszöbét emeli, ezért W = ${W}, k = ${f(kk,1)} mellett a spike nem jelezhető.`;
  else if (upto === N - 1 && both && shown.length === 2) msg += " Mindkét spike első lépése jelölve, téves jelzés nincs.";
  else if (shown.length > 2) msg += " A túl kicsi k vagy W téves jelzéseket is ad (zaj vagy a spike utáni lépések).";
  else if (!both && upto === N - 1) msg += " Legalább az egyik spike kimaradt: a küszöb túl magas.";
  document.getElementById("status").textContent = msg;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("play").onclick = () => {
  if (timer) { stop(); upto = N - 1; draw(); return; }
  upto = 0; document.getElementById("play").textContent = "⏸ Megállítás";
  timer = setInterval(() => { upto = Math.min(N - 1, upto + 3); draw(); if (upto >= N - 1) stop(); }, 40);
};
["beta", "k", "W", "incl"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("reset").onclick = () => { stop(); upto = N - 1;
  document.getElementById("beta").value = 0.9; document.getElementById("k").value = 5; document.getElementById("W").value = 50;
  document.getElementById("incl").checked = false; draw(); };
document.getElementById("w10").onclick = () => { stop(); upto = N - 1;
  document.getElementById("k").value = 5; document.getElementById("W").value = 10; document.getElementById("incl").checked = true; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
