const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
function fit(a,c){
  const n=D.x.length, y=D.x.map((x,i)=>18+4*x+(a+c*x)*D.z[i]);
  let sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<n;i++){sx+=D.x[i];sy+=y[i];sxx+=D.x[i]*D.x[i];sxy+=D.x[i]*y[i];}
  const det=n*sxx-sx*sx, i00=sxx/det, i01=-sx/det, i11=n/det;
  const b1=(n*sxy-sx*sy)/det, b0=(sy-b1*sx)/n;
  const e=y.map((v,i)=>v-b0-b1*D.x[i]); let sse=0,m00=0,m01=0,m11=0;
  e.forEach((r,i)=>{const r2=r*r,x=D.x[i];sse+=r2;m00+=r2;m01+=r2*x;m11+=r2*x*x;});
  const se_cl=Math.sqrt(i11*sse/(n-2));
  // (X'X)^-1 M (X'X)^-1, [1,1] elem; HC1: n/(n-k)
  const v11=i01*(i01*m00+i11*m01)+i11*(i01*m01+i11*m11);
  return {b0,b1,e,se_cl,se_hc1:Math.sqrt(v11*n/(n-2))};
}
function panel(X0,xs,xmin,xmax,xlab,title,a,c,b0,b1,e,ymax,fitted){

  E("line",{x1:X0,x2:X0+W,y1:py(0),y2:py(0),stroke:css("--line")});
  const nt=fitted?5:4;for(let k=0;k<=nt;k++){const v=xmin+k*(xmax-xmin)/nt;E("text",{x:px(v),y:Y0+H+15,"text-anchor":"middle","font-size":11},hu(v,0));}
  E("text",{x:X0+W/2,y:Y0+H+33,"text-anchor":"middle","font-size":12},xlab);
  E("text",{x:X0+W/2,y:Y0-12,"text-anchor":"middle","font-size":12,"font-weight":"bold"},title);
  xs.forEach((v,i)=>{const yy=Math.max(-ymax,Math.min(ymax,e[i]));E("circle",{cx:px(v),cy:py(yy),r:2,fill:css("--pt"),"fill-opacity":0.55});});

  E("polyline",{points:dn.join(" "),fill:"none",stroke:css("--line"),"stroke-dasharray":"6 4","stroke-width":1.3});
}
function draw(){
  const a=+document.getElementById("a").value, c=+document.getElementById("c").value;
  document.getElementById("av").textContent=hu(a,1);document.getElementById("cv").textContent=hu(c,2);
  const f=fit(a,c); svg.innerHTML="";
  const ymax=Math.max(10,Math.ceil(2.4*(a+12*c)/5)*5);
  const fv=D.x.map(x=>f.b0+f.b1*x); const fmin=f.b0+f.b1, fmax=f.b0+f.b1*12;
  panel(60,D.x,0,12,"távolság (km)","Reziduális a távolság szerint",a,c,f.b0,f.b1,f.e,ymax,false);
  panel(430,fv,Math.floor(fmin/10)*10,Math.ceil(fmax/10)*10,"illesztett érték (perc)","Illesztett érték–reziduális",a,c,f.b0,f.b1,f.e,ymax,true);
  E("text",{x:18,y:155,"text-anchor":"middle","font-size":12,transform:"rotate(-90 18 155)"},"reziduális (perc)");
  const inside=f.e.filter((r,i)=>Math.abs(r)<=2*(a+c*D.x[i])).length/f.e.length;
  const ratio=f.se_hc1/f.se_cl;
  document.getElementById("status").textContent=`σ(x) = ${hu(a,1)} + ${hu(c,2)}·x: b₀ = ${hu(f.b0,2)}, b₁ = ${hu(f.b1,3)}; a meredekség SE-je klasszikus ${hu(f.se_cl,4)}, HC1 ${hu(f.se_hc1,4)} (arány ${hu(ratio,2)}). `+
   (c===0?"Állandó szórás: nincs tölcsér, a két SE közel azonos.":`Szélesedő tölcsér: a klasszikus SE ${ratio>1?"alábecsli":"felülbecsli"} a bizonytalanságot.`)+` A pontok ${hu(100*inside,1)}%-a a ±2σ(x) sávon belül.`;
}
