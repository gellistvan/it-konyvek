const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");

function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
const M=[["naive","naiv","--muted","6 3"],["seas","szezonális naiv","--hl2","2 3"],["hw","Holt–Winters","--hl","8 3 2 3"]];
