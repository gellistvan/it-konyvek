<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A hét réteg mint ÉS-lánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><span class="small">Kattints (vagy nyomj Entert) egy rétegre a teszt 0/1 állításához.</span><label>build: <select onchange="setR(0,this.value)" aria-label="build pontszám"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label><label>access: <select onchange="setR(1,this.value)" aria-label="access pontszám"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label><label>smoke: <select onchange="setR(2,this.value)" aria-label="smoke pontszám"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label><label>temporal: <select onchange="setR(3,this.value)" aria-label="temporal pontszám"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label><label>cost: <select onchange="setR(4,this.value)" aria-label="cost pontszám"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></label><label>platform: <select onchange="setR(5,this.value)" aria-label="platform pontszám"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option></select></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 465" role="img" aria-label="Hét egymás után kötött doboz, a végén egy ÉS-kapu; két helyen jelölt tipikus hiba; alatta a hat szempontos rubrika 11/12 ponttal."></svg>

<p class="small">A fejezet rétegtáblázata, az S = ∧ t_i predikátum és a score_workbench() példája (11/12, küszöb 10). Kezdőállapot: minden teszt sikeres, a rubrika a fejezet példája.</p>
<script>
const DATA = {"D": {"W": 1000, "H": 465, "nodes": [{"id": "L0", "x": 8, "y": 90, "w": 117, "h": 70, "label": "interpreter", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "L1", "x": 136, "y": 90, "w": 117, "h": 70, "label": "packages", "shape": "rect", "fs": 16, "bold": true, "ls": "dash"}, {"id": "L2", "x": 264, "y": 90, "w": 117, "h": 70, "label": "data\nengine", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "L3", "x": 392, "y": 90, "w": 117, "h": 70, "label": "tracking", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "L4", "x": 520, "y": 90, "w": 117, "h": 70, "label": "execution", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "L5", "x": 648, "y": 90, "w": 117, "h": 70, "label": "reporting", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "L6", "x": 776, "y": 90, "w": 117, "h": 70, "label": "handoff", "shape": "rect", "fs": 16, "bold": true, "ls": "solid"}, {"id": "AND", "x": 900, "y": 85, "w": 92, "h": 80, "label": "ÉS", "shape": "diamond", "fs": 19, "bold": true}, {"id": "R0", "x": 8, "y": 390, "w": 118, "h": 52, "label": "build\n2", "shape": "rect", "fs": 16, "fill": "g", "ls": "solid"}, {"id": "R1", "x": 134, "y": 390, "w": 118, "h": 52, "label": "access\n2", "shape": "rect", "fs": 16, "fill": "g", "ls": "solid"}, {"id": "R2", "x": 260, "y": 390, "w": 118, "h": 52, "label": "smoke\n2", "shape": "rect", "fs": 16, "fill": "g", "ls": "solid"}, {"id": "R3", "x": 386, "y": 390, "w": 118, "h": 52, "label": "temporal\n2", "shape": "rect", "fs": 16, "fill": "g", "ls": "solid"}, {"id": "R4", "x": 512, "y": 390, "w": 118, "h": 52, "label": "cost\n1", "shape": "rect", "fs": 16, "fill": "w", "ls": "dash"}, {"id": "R5", "x": 638, "y": 390, "w": 118, "h": 52, "label": "platform\n2", "shape": "rect", "fs": 16, "fill": "g", "ls": "solid"}, {"id": "RS", "x": 774, "y": 390, "w": 216, "h": 52, "label": "11/12 ≥ 10, nincs 0\n→ elfogadva", "shape": "rect", "fs": 16, "bold": true, "lw": 2.2}], "edges": [{"id": "a1", "pts": [[125, 125.0], [136, 125.0]], "label": ""}, {"id": "a2", "pts": [[253, 125.0], [264, 125.0]], "label": ""}, {"id": "a3", "pts": [[381, 125.0], [392, 125.0]], "label": ""}, {"id": "a4", "pts": [[509, 125.0], [520, 125.0]], "label": ""}, {"id": "a5", "pts": [[637, 125.0], [648, 125.0]], "label": ""}, {"id": "a6", "pts": [[765, 125.0], [776, 125.0]], "label": ""}, {"id": "a7", "pts": [[893, 125.0], [900, 125.0]], "label": ""}, {"id": "k1", "pts": [[194.5, 38], [578.5, 38]], "label": "", "arrow": "both", "ls": "dash", "lw": 1.6}], "texts": [{"x": 66.5, "y": 74, "s": "t1", "fs": 17, "italic": true}, {"x": 66.5, "y": 172, "s": "3.12;\nsys.executable\n.venv alatt", "fs": 16, "va": "top"}, {"x": 194.5, "y": 74, "s": "t2", "fs": 17, "italic": true}, {"x": 194.5, "y": 172, "s": "uv sync\n--locked;\nimport OK", "fs": 16, "va": "top"}, {"x": 322.5, "y": 74, "s": "t3", "fs": 17, "italic": true}, {"x": 322.5, "y": 172, "s": "COUNT(*)\n= 2400;\nmanifest", "fs": 16, "va": "top"}, {"x": 450.5, "y": 74, "s": "t4", "fs": 17, "italic": true}, {"x": 450.5, "y": 172, "s": "split.json\nkulcsok", "fs": 16, "va": "top"}, {"x": 578.5, "y": 74, "s": "t5", "fs": 17, "italic": true}, {"x": 578.5, "y": 172, "s": "starter\nexit 0", "fs": 16, "va": "top"}, {"x": 706.5, "y": 74, "s": "t6", "fs": 17, "italic": true}, {"x": 706.5, "y": 172, "s": "nbconvert\nexit 0", "fs": 16, "va": "top"}, {"x": 834.5, "y": 74, "s": "t7", "fs": 17, "italic": true}, {"x": 834.5, "y": 172, "s": "tiszta gép:\nsync + script\n+ hash", "fs": 16, "va": "top"}, {"x": 946, "y": 195, "s": "S = 1:\nelfogadva", "fs": 16, "va": "top", "bold": true}, {"x": 946, "y": 250, "s": "bármely\nt_i = 0:\nelutasítva", "fs": 16, "va": "top"}, {"x": 386.5, "y": 18, "s": "✗ (1) notebook kernel ≠ projekt .venv", "fs": 17, "bold": true, "bg": true}, {"x": 194.5, "y": 260, "s": "✗ (2) rossz munka-\nkönyvtár: a python\nnem a lab/.venv-ből\nfut (uv run nélkül)", "fs": 16, "va": "top", "bold": true}, {"x": 8, "y": 368, "s": "pontozott rubrika (6 szempont × 0–2 pont; küszöb 10/12, egyetlen 0 = blokkoló):", "fs": 16, "ha": "left", "bold": true}]}, "layers": ["interpreter", "packages", "data engine", "tracking", "execution", "reporting", "handoff"], "rubric": [["build", 2], ["access", 2], ["smoke", 2], ["temporal", 2], ["cost", 1], ["platform", 2]]};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="para"){const sk=Math.min(18,w*0.12);dg_mk(g,"polygon",Object.assign({points:`${x+sk},${y} ${x+w},${y} ${x+w-sk},${y+h} ${x},${y+h}`},st));}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let t=[1,1,1,1,1,1,1];
const R=DATA.rubric.map(r=>r[1]);
function flip(i){t[i]=1-t[i];draw();}
function setR(j,v){R[j]=+v;draw();}
function draw(){
  const D=JSON.parse(JSON.stringify(DATA.D)), hl=new Set();
  t.forEach((v,i)=>{const n=D.nodes.find(n=>n.id==="L"+i); if(!v){n.fill="d";n.ls="dash";n.label+="\n✗";hl.add("L"+i);} else {n.ls="solid";}});
  const S=t.every(v=>v===1)?1:0;
  const tot=R.reduce((a,b)=>a+b,0), zeros=DATA.rubric.filter((r,j)=>R[j]===0).map(r=>r[0]);
  const ok=!zeros.length&&tot>=10;
  DATA.rubric.forEach((r,j)=>{const n=D.nodes.find(n=>n.id==="R"+j);n.label=r[0]+"\n"+R[j];n.fill={2:"g",1:"w",0:"d"}[R[j]];n.ls=R[j]===1?"dash":"solid";});
  D.nodes.find(n=>n.id==="RS").label=`${tot}/12`+(ok?" ≥ 10, nincs 0\n→ elfogadva":(zeros.length?`; blokkoló:\n${zeros.join(", ")}`:" < 10\n→ elutasítva"));
  D.nodes.find(n=>n.id==="AND").label="ÉS\nS = "+S;
  const out=dg_draw(svg,D,hl);
  for(let i=0;i<7;i++){const g=out["L"+i];g.setAttribute("tabindex","0");g.setAttribute("class","clickable");g.setAttribute("role","button");
    g.setAttribute("aria-label",`${DATA.layers[i]} teszt: ${t[i]?"sikeres":"sikertelen"} (váltás)`);
    g.addEventListener("click",()=>flip(i));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip(i);}});}
  const bad=DATA.layers.filter((l,i)=>!t[i]);
  status.textContent=`S = ${S}: `+(S?"mind a hét rétegteszt sikeres, a lánc elfogadva.":`elutasítva – sikertelen: ${bad.join(", ")}.`)+
    ` Rubrika: ${tot}/12 → `+(ok?"elfogadva.":(zeros.length?`blokkolva (0 pont: ${zeros.join(", ")}).`:"a 10 pontos küszöb alatt."));
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
