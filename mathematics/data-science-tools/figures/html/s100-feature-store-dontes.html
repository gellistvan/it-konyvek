<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parquet + SQL vagy feature store</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Döntési küszöbök:</span> <label><input type="checkbox" id="c1" onchange="onD()"> több csapat</label> <label><input type="checkbox" id="c2" onchange="onD()"> online SLA &lt; 200 ms</label> <label><input type="checkbox" id="c3" onchange="onD()"> skálázódó backfill/audit</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Blokkdiagram két megoldásról: batch Parquet-snapshot és feature store négy elemmel, közöttük parity-ellenőrzés; a döntési küszöbök jelölőnégyzetekkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A Northstar-adat méretei a lab CSV-kből; a négy rész és a hat parity-ellenőrzés a fejezet táblázataiból. A szaggatott keret a javasolt megoldást jelöli.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "L", "j": -1, "msg": "A Northstar mai útja: CSV-forrásokból SQL/pandas backfill, verziózott Parquet snapshot (1531 sor) + feature_contract.json + hash; ugyanazt a schema_version-t használja a tanítás és a batch scoring.", "line": -1}, {"ph": "R", "j": -1, "msg": "A feature store minta négy része: Registry (név, definíció, verzió, owner, TTL), offline tároló, materializáció, online tároló (< 200 ms) a scoring API mögött.", "line": -1}, {"ph": "P", "j": 0, "msg": "Parity-ellenőrzés 1/6: érték (tolerancia) – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}, {"ph": "P", "j": 1, "msg": "Parity-ellenőrzés 2/6: típus (dtype, kategóriaszint) – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}, {"ph": "P", "j": 2, "msg": "Parity-ellenőrzés 3/6: as-of időbélyeg – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}, {"ph": "P", "j": 3, "msg": "Parity-ellenőrzés 4/6: forrás-snapshot – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}, {"ph": "P", "j": 4, "msg": "Parity-ellenőrzés 5/6: TTL (frissesség) – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}, {"ph": "P", "j": 5, "msg": "Parity-ellenőrzés 6/6: hiányzás (NaN/None) – ugyanarra az (order_id, as_of) párra az offline és az online érték mezőnként egyezzen.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PAR = ["érték (tolerancia)", "típus (dtype, kategóriaszint)", "as-of időbélyeg", "forrás-snapshot", "TTL (frissesség)", "hiányzás (NaN/None)"], N = {"cust": 300, "orders": 2400, "items": 4796, "train": 1531};
function onD(){ show(k); }
function bx(x, y, w, h, t, on, fs){ el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--fg"), "stroke-width": on ? 2.6 : 1});
  t.split("\n").forEach((s, i, a) => el("text", {x: x + w / 2, y: y + h / 2 + (i - (a.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": fs || 11.5}, s)); }
function ar(x1, y1, x2, y2, dash){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": dash || ""});
  const a = Math.atan2(y2 - y1, x2 - x1); el("path", {d: `M${x2} ${y2}L${x2 - 8 * Math.cos(a - 0.4)} ${y2 - 8 * Math.sin(a - 0.4)}L${x2 - 8 * Math.cos(a + 0.4)} ${y2 - 8 * Math.sin(a + 0.4)}Z`, fill: css("--fg")}); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 740 400");
  const Lb = [`orders.csv (${N.orders}), customers.csv (${N.cust}),\norder_items.csv (${N.items})`, "SQL / pandas backfill (asof join)", `train_features_v2.parquet (${N.train})\n+ feature_contract.json + hash`, "tanítás és batch scoring\n(ugyanaz a schema_version)"];
  const Rb = ["forrás", "Registry: név, definíció, verzió, owner, TTL", "Offline tároló (verziózott batch)", "Materializáció", "Online tároló (< 200 ms)", "scoring API"];
  el("text", {x: 130, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Parquet + verziózott SQL");
  el("text", {x: 610, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Feature store minta");
  Lb.forEach((t, i) => { bx(10, 30 + i * 75, 240, 52, t, s.ph === "L", 11); if (i) ar(130, 30 + i * 75 - 23, 130, 30 + i * 75); });
  Rb.forEach((t, i) => { bx(490, 30 + i * 52, 240, 36, t, s.ph === "R", 11); if (i) ar(610, 30 + i * 52 - 16, 610, 30 + i * 52); });
  bx(285, 95, 170, 200, "", s.ph === "P");
  el("text", {x: 370, y: 116, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, "parity teszt");
  PAR.forEach((p, i) => el("text", {x: 295, y: 142 + i * 24, "font-size": 11, "font-weight": s.ph === "P" && s.j === i ? "bold" : "normal", fill: s.ph === "P" && s.j === i ? css("--hl2") : css("--fg")}, `${s.ph === "P" && i <= s.j ? "✓" : "•"} ${p}`));
  ar(250, 210, 285, 210, "5 3"); ar(490, 160, 455, 180, "5 3"); ar(490, 245, 455, 235, "5 3");
  const c = ["c1", "c2", "c3"].map(id => document.getElementById(id).checked), any = c.some(v => v);
  el("text", {x: 10, y: 360, "font-size": 12}, `Döntés: ${any ? "feature store (legalább egy küszöb teljesül)" : "Parquet + verziózott SQL elég (Northstar: 1 csapat, napi batch, " + N.train + " tanulósor)"}`);
  el("rect", {x: any ? 486 : 6, y: any ? 26 : 26, width: 248, height: any ? 318 : 298, fill: "none", stroke: css("--hl"), "stroke-width": 3, "stroke-dasharray": "8 4"});
  status.textContent = s.msg;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
