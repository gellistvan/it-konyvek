<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROWS és GROUPS keret</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy rendelés két keretdefinícióval; azonos időbélyegnél a ROWS az egyik rendelést a másik múltjaként számolja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A SUM-értékeket és a keretbe eső sorokat a Python sqlite3-mal (SQLite) számolta a fejezet kiterjesztett mini példáján: ROWS: NULL, 1000, 1500, 2000; GROUPS: NULL, 1000, 1000, 2000.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "ROWS", "cur": 0, "mem": [[false, false, false, false], [true, false, false, false], [true, true, false, false], [true, true, true, false]], "sums": [null, 1000, 1500, 2000], "line": 0, "msg": "ROWS-keret, aktuális sor: o1 (01-10). A keretbe eső sorok: nincs; SUM = NULL."}, {"mode": "ROWS", "cur": 1, "mem": [[false, false, false, false], [true, false, false, false], [true, true, false, false], [true, true, true, false]], "sums": [null, 1000, 1500, 2000], "line": 0, "msg": "ROWS-keret, aktuális sor: o2a (01-20). A keretbe eső sorok: o1; SUM = 1000."}, {"mode": "ROWS", "cur": 2, "mem": [[false, false, false, false], [true, false, false, false], [true, true, false, false], [true, true, true, false]], "sums": [null, 1000, 1500, 2000], "line": 0, "msg": "ROWS-keret, aktuális sor: o2b (01-20). A keretbe eső sorok: o1, o2a; SUM = 1500. Itt o2b „látja” az azonos idejű o2a 500 centjét – szivárgás veszélye."}, {"mode": "ROWS", "cur": 3, "mem": [[false, false, false, false], [true, false, false, false], [true, true, false, false], [true, true, true, false]], "sums": [null, 1000, 1500, 2000], "line": 0, "msg": "ROWS-keret, aktuális sor: o3 (01-30). A keretbe eső sorok: o1, o2a, o2b; SUM = 2000."}, {"mode": "GROUPS", "cur": 0, "mem": [[false, false, false, false], [true, false, false, false], [true, false, false, false], [true, true, true, false]], "sums": [null, 1000, 1000, 2000], "line": 1, "msg": "GROUPS-keret, aktuális sor: o1 (01-10). A keretbe eső sorok: nincs; SUM = NULL."}, {"mode": "GROUPS", "cur": 1, "mem": [[false, false, false, false], [true, false, false, false], [true, false, false, false], [true, true, true, false]], "sums": [null, 1000, 1000, 2000], "line": 1, "msg": "GROUPS-keret, aktuális sor: o2a (01-20). A keretbe eső sorok: o1; SUM = 1000."}, {"mode": "GROUPS", "cur": 2, "mem": [[false, false, false, false], [true, false, false, false], [true, false, false, false], [true, true, true, false]], "sums": [null, 1000, 1000, 2000], "line": 1, "msg": "GROUPS-keret, aktuális sor: o2b (01-20). A keretbe eső sorok: o1; SUM = 1000. A GROUPS a teljes 01-20-i peer-csoportot kizárja: o2b nem látja o2a-t."}, {"mode": "GROUPS", "cur": 3, "mem": [[false, false, false, false], [true, false, false, false], [true, false, false, false], [true, true, true, false]], "sums": [null, 1000, 1000, 2000], "line": 1, "msg": "GROUPS-keret, aktuális sor: o3 (01-30). A keretbe eső sorok: o1, o2a, o2b; SUM = 2000."}];
const CODE = ["ROWS   BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING   -- ORDER BY order_ts, order_id", "GROUPS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING   -- ORDER BY order_ts (peer-csoportok)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 600 340"); svg.innerHTML="";
  const ids=["o1","o2a","o2b","o3"], dates=["01-10","01-20","01-20","01-30"], amt=[1000,500,500,800];
  const x0=110, y0=90, c=70;
  el("text",{x:300,y:20,"text-anchor":"middle","font-size":15,"font-weight":"bold"},s.mode+" BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING");
  ids.forEach((id,j)=>{ el("text",{x:x0+j*c+c/2,y:y0-40,"text-anchor":"middle","font-size":13,"font-weight":"bold"},id); el("text",{x:x0+j*c+c/2,y:y0-24,"text-anchor":"middle","font-size":12},dates[j]); el("text",{x:x0+j*c+c/2,y:y0-9,"text-anchor":"middle","font-size":12,fill:css("--muted")},String(amt[j])); });
  el("text",{x:x0+4*c+14,y:y0-16,"font-size":13,"font-weight":"bold"},"SUM prior");
  for(let i=0;i<4;i++){
    const y=y0+i*50;
    el("text",{x:x0-10,y:y+28,"text-anchor":"end","font-size":13},ids[i]);
    ids.forEach((id,j)=>{
      const on = s.mem[i][j], cur = j===i, act = i===s.cur, op = act?1:0.4;
      el("rect",{x:x0+j*c+3,y:y+3,width:c-6,height:44,fill:on?css("--cellhl"):css("--cell"),stroke:(cur&&act)?css("--hl2"):css("--line"),"stroke-width":cur?3.5:1, opacity:op});
      if(on) el("text",{x:x0+j*c+c/2,y:y+30,"text-anchor":"middle","font-size":12,opacity:op},"keretben");
      if(cur) el("text",{x:x0+j*c+c/2,y:y+30,"text-anchor":"middle","font-size":12,opacity:op},"akt.");
    });
    const v=s.sums[i]; el("text",{x:x0+4*c+14,y:y+30,"font-size":15,"font-weight":i===s.cur?"bold":"normal",opacity:i===s.cur?1:0.55},v===null?"NULL":String(v));
  }
  el("rect",{x:x0+c,y:y0-4,width:2*c,height:4*50+8,fill:"none",stroke:css("--fg"),"stroke-dasharray":"6 4"});
  el("text",{x:x0+2*c,y:y0+4*50+24,"text-anchor":"middle","font-size":12},"peer-csoport: azonos időbélyeg (01-20)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
