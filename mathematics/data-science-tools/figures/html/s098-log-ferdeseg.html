function skewG1(x){ const n = x.length, m = x.reduce((a, b) => a + b, 0) / n; let m2 = 0, m3 = 0;

function hist(x, x0, w, y0, h, title, isInt){
  const lo = Math.min(...x), hi = Math.max(...x), nb = isInt ? null : 30;
  let edges = []; if (isInt) { const u = [...new Set(x)].sort((a, b) => a - b); edges = u.map((v, i) => i ? (u[i - 1] + v) / 2 : v - (u[1] - v) / 2); edges.push(u[u.length - 1] + (u[u.length - 1] - u[u.length - 2]) / 2); }
  else for (let i = 0; i <= nb; i++) edges.push(lo + (hi - lo) * i / nb);
  const cnt = new Array(edges.length - 1).fill(0); x.forEach(v => { let b = edges.findIndex((e, i) => i < edges.length - 1 && v >= e && v < edges[i + 1]); if (b < 0) b = cnt.length - 1; cnt[b]++; });
  const L = edges[0], Rr = edges[edges.length - 1], X = v => x0 + (v - L) / (Rr - L) * w, top = Math.max(...cnt) * 1.1, Y = c => y0 + h - c / top * h;
  cnt.forEach((c, i) => el("rect", {x: X(edges[i]), y: Y(c), width: Math.max(0.5, X(edges[i + 1]) - X(edges[i]) - 0.5), height: y0 + h - Y(c), fill: css("--muted"), stroke: css("--fg"), "stroke-width": 0.4}));
  const s = x.slice().sort((a, b) => a - b), med = (s[(s.length - 1) >> 1] + s[s.length >> 1]) / 2;

  el("text", {x: x0, y: y0 + h + 15, "font-size": 10}, f(L).replace("-", "−")); el("text", {x: x0 + w, y: y0 + h + 15, "text-anchor": "end", "font-size": 10}, f(Rr).replace("-", "−"));
  el("text", {x: x0, y: y0 - 8, "font-size": 12}, `${title}: ferdeség ${skewG1(x).toFixed(3).replace(".", ",").replace("-", "−")}`);
}
function render(s){

}

function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
