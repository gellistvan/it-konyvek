<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centrális határeloszlás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label>eloszlás: <select id="dist" onchange="setRange()"><option value="exp">exponenciális (μ = σ = 6)</option><option value="cau">standard Cauchy</option></select></label><label>mintanagyság: <input id="k" type="range" min="0" max="7" step="1" value="3" oninput="draw()" style="width:240px" aria-label="mintanagyság"> <output id="kv"></output></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="A 10 000 mintaátlag hisztogramja a választott mintanagyságra, a normális (exponenciálisnál) vagy a Cauchy-sűrűséggel; exponenciális adatnál n-nel szűkül és haranggá válik, Cauchy-adatnál nem."></svg>
<p class="small">Az n = 1, 5, 30, 100 hisztogramok a fejezet kódjának futtatásából (default_rng(20261020)) származnak, a köztes n-ek külön rögzített seedből; a Cauchy-sor a 4. feladat beállítása (default_rng(99), B = 10 000). Kezdőállapot: exponenciális, n = 5. Szimuláció, nem mérés.</p>
<script>
const D = {"exp1": {"n": 1, "lo": 0.0, "hi": 33.0, "c": [1256, 1128, 949, 856, 785, 636, 611, 497, 412, 394, 305, 308, 232, 213, 173, 163, 126, 109, 120, 100, 78, 65, 61, 51, 43, 43, 36, 32, 25, 28, 25, 20, 21, 9, 12, 9, 7, 9, 6, 10], "mean": 5.973462465569962, "sd": 5.956423877778722, "out": 37}, "exp2": {"n": 2, "lo": 0.0, "hi": 25.09188309203678, "c": [215, 446, 618, 732, 760, 726, 723, 695, 629, 585, 527, 443, 401, 369, 312, 279, 251, 195, 159, 145, 142, 106, 98, 87, 45, 37, 41, 42, 37, 20, 17, 23, 22, 14, 13, 8, 12, 4, 1, 1], "mean": 6.020658521870948, "sd": 4.192018606497268, "out": 20}, "exp3": {"n": 3, "lo": 0.0, "hi": 21.588457268119896, "c": [26, 169, 329, 434, 573, 704, 770, 757, 703, 672, 609, 577, 499, 467, 442, 346, 292, 264, 209, 192, 176, 128, 124, 87, 71, 69, 55, 46, 37, 32, 30, 25, 20, 9, 10, 10, 11, 3, 4, 3], "mean": 5.975512189547317, "sd": 3.49382861122261, "out": 16}, "exp5": {"n": 5, "lo": 0.0, "hi": 18.074767078498866, "c": [1, 15, 52, 111, 231, 360, 477, 551, 661, 710, 708, 713, 689, 669, 633, 544, 461, 450, 360, 286, 241, 203, 193, 138, 96, 83, 75, 62, 57, 35, 25, 26, 21, 18, 13, 12, 6, 5, 4, 0], "mean": 6.054825811618975, "sd": 2.6944599997138394, "out": 5}, "exp10": {"n": 10, "lo": 0.0, "hi": 14.538149682454623, "c": [0, 0, 2, 2, 9, 33, 75, 146, 243, 360, 445, 624, 731, 725, 794, 796, 777, 714, 653, 566, 499, 395, 326, 252, 210, 147, 127, 79, 78, 55, 39, 25, 21, 15, 9, 10, 7, 2, 6, 2], "mean": 6.002442862528232, "sd": 1.8814730156898973, "out": 1}, "exp30": {"n": 30, "lo": 1.0704969824535056, "hi": 10.929503017546494, "c": [0, 0, 0, 0, 0, 1, 1, 3, 7, 36, 77, 138, 212, 335, 515, 599, 764, 782, 910, 885, 853, 803, 732, 585, 479, 357, 268, 194, 157, 98, 70, 36, 34, 28, 12, 9, 11, 2, 2, 3], "mean": 5.989345046560358, "sd": 1.1095193942102588, "out": 2}, "exp50": {"n": 50, "lo": 2.1816233815926434, "hi": 9.818376618407356, "c": [0, 0, 0, 0, 0, 0, 3, 8, 14, 48, 72, 116, 211, 309, 459, 611, 689, 765, 898, 950, 810, 869, 698, 604, 476, 430, 305, 211, 147, 97, 79, 45, 38, 14, 6, 9, 3, 1, 1, 4], "mean": 6.013481021352314, "sd": 0.8536430521774515, "out": 0}, "exp100": {"n": 100, "lo": 3.3000000000000003, "hi": 8.7, "c": [0, 0, 0, 0, 1, 0, 3, 9, 18, 45, 81, 144, 207, 297, 456, 615, 657, 760, 904, 926, 863, 839, 744, 608, 515, 411, 308, 191, 152, 93, 53, 45, 24, 17, 8, 3, 0, 2, 0, 1], "mean": 6.000752828159079, "sd": 0.5945358327470208, "out": 0}, "cau1": {"n": 1, "lo": -10, "hi": 10, "c": [25, 16, 17, 28, 34, 36, 36, 42, 47, 57, 60, 65, 102, 146, 195, 249, 406, 611, 987, 1483, 1502, 1047, 632, 359, 274, 202, 140, 106, 81, 59, 74, 46, 37, 41, 31, 17, 30, 18, 18, 15], "mean": 0.014392435159208707, "sd": 0.4981, "out": 629}, "cau5": {"n": 5, "lo": -10, "hi": 10, "c": [21, 18, 16, 20, 35, 24, 24, 35, 54, 47, 58, 73, 124, 157, 193, 292, 396, 634, 1058, 1513, 1413, 1012, 604, 414, 270, 170, 117, 114, 75, 67, 59, 39, 43, 43, 32, 28, 32, 22, 14, 12], "mean": -0.033730997897364334, "sd": 0.5004, "out": 628}, "cau50": {"n": 50, "lo": -10, "hi": 10, "c": [20, 20, 21, 30, 37, 31, 26, 31, 49, 62, 76, 94, 92, 140, 202, 266, 398, 615, 1025, 1487, 1534, 981, 599, 419, 248, 187, 145, 98, 88, 66, 56, 62, 31, 39, 33, 24, 24, 20, 7, 13], "mean": -0.009104806693272922, "sd": 0.4973, "out": 604}, "cau500": {"n": 500, "lo": -10, "hi": 10, "c": [14, 18, 32, 31, 31, 30, 32, 42, 55, 58, 64, 90, 91, 146, 189, 259, 402, 616, 1016, 1514, 1407, 1095, 641, 389, 261, 183, 120, 95, 66, 65, 57, 41, 38, 36, 37, 19, 18, 12, 17, 13], "mean": -0.015140616833335884, "sd": 0.4968, "out": 660}};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

const EXPN = [1, 2, 3, 5, 10, 30, 50, 100], CAUN = [1, 5, 50, 500];
function sel(){ return document.getElementById("dist").value; }
function setRange(){ const s = document.getElementById("k"); const L = sel() === "exp" ? EXPN : CAUN; s.max = L.length - 1; if (+s.value > L.length - 1) s.value = L.length - 1; draw(); }
function draw(){
  const L = sel() === "exp" ? EXPN : CAUN, n = L[val("k")], d = D[(sel() === "exp" ? "exp" : "cau") + n];
  show("kv", "n = " + n);
  svg.innerHTML = "";
  const w = (d.hi - d.lo) / d.c.length, tot = d.c.reduce((a, b) => a + b, 0) + d.out, dens = d.c.map(c => c / (tot * w));
  const ymax = Math.max(Math.max.apply(null, dens), sel() === "exp" ? 1 / (6 / Math.sqrt(n) * Math.sqrt(2 * Math.PI)) : 0.33) * 1.15;
  const xt = sel() === "exp" ? [d.lo, 6, d.hi].map(v => Math.round(v * 10) / 10) : [-10, -5, 0, 5, 10];
  const A = Axes(svg, {x: 70, y: 20, w: 640, h: 300, x0: d.lo, x1: d.hi, y0: 0, y1: ymax, xt: xt, yt: [0, ymax / 2, ymax].map(v => +v.toPrecision(2)), xl: sel() === "exp" ? "átlag (nap)" : "átlag", yl: "sűrűség", ylo: 50});
  dens.forEach((v, i) => E(svg, "rect", {x: A.X(d.lo + i * w), y: A.Y(v), width: A.X(w) - A.X(0), height: A.Y(0) - A.Y(v), fill: css("--cellhl"), stroke: css("--fg"), "stroke-width": 0.5}));
  const xs = [], ys = [];
  for (let i = 0; i <= 300; i++) { const x = d.lo + (d.hi - d.lo) * i / 300; xs.push(x);
    ys.push(sel() === "exp" ? Math.exp(-0.5 * ((x - 6) / (6 / Math.sqrt(n))) ** 2) / (6 / Math.sqrt(n) * Math.sqrt(2 * Math.PI)) : 1 / (Math.PI * (1 + x * x))); }
  path(svg, A, xs, ys, {stroke: "#c00000", "stroke-width": 2.2});
  E(svg, "text", {x: 80, y: 40, "font-size": 12.5}, sel() === "exp" ? "piros: CLT szerinti N(6; 6/√n)" : "piros: standard Cauchy-sűrűség (n-től független)");
  if (sel() === "exp") status.textContent = `Exponenciális, n = ${n}: a 10 000 átlag átlaga ${F(d.mean, 3)}, szórása ${F(d.sd, 3)} (elmélet: 6/√n = ${F(6 / Math.sqrt(n), 3)}); n-nel a hisztogram szűkül és haranggá válik.`;
  else status.textContent = `Cauchy, n = ${n}: a 10 000 átlag mediánja ${F(d.mean, 3)}, |átlag| > 1 aránya ${F(d.sd, 3)} (standard Cauchyra 0,5); a szélesség n-nel nem csökken – nincs véges variancia, a CLT nem alkalmazható.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
