<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested keresztvalidáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>K<sub>outer</sub>: <input id="ko" type="range" min="2" max="10" step="1" value="5" oninput="onN()" style="width:110px" aria-label="Külső foldok száma"> <span id="kov">5</span></label> <label>K<sub>inner</sub>: <input id="ki" type="range" min="2" max="10" step="1" value="3" oninput="onN()" style="width:110px" aria-label="Belső foldok száma"> <span id="kiv">3</span></label> <label>jelölt: <input id="nc" type="range" min="1" max="30" step="1" value="10" oninput="onN()" style="width:110px" aria-label="Jelöltek száma"> <span id="ncv">10</span></label> </div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Beágyazott keresztvalidációs sémadiagram futó illesztésszámlálóval: 5 külső fold, mindegyikben 3 belső fold és egy refit, összesen 155 illesztés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illesztésszám = K_outer · (K_inner · jelölt + 1), refit=True mellett (a fejezet képlete). Sematikus: a StratifiedKFold(shuffle=True) foldjai kevert sorokból állnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"f": 0, "j": 0, "ph": "inner", "n": 10, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 0, "j": 1, "ph": "inner", "n": 20, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 0, "j": 2, "ph": "inner", "n": 30, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 0, "j": -1, "ph": "refit", "n": 31, "ko": 5, "ki": 3, "nc": 10, "line": 2, "msg": ""}, {"f": 0, "j": -1, "ph": "test", "n": 31, "ko": 5, "ki": 3, "nc": 10, "line": 3, "msg": ""}, {"f": 1, "j": 0, "ph": "inner", "n": 41, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 1, "j": 1, "ph": "inner", "n": 51, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 1, "j": 2, "ph": "inner", "n": 61, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 1, "j": -1, "ph": "refit", "n": 62, "ko": 5, "ki": 3, "nc": 10, "line": 2, "msg": ""}, {"f": 1, "j": -1, "ph": "test", "n": 62, "ko": 5, "ki": 3, "nc": 10, "line": 3, "msg": ""}, {"f": 2, "j": 0, "ph": "inner", "n": 72, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 2, "j": 1, "ph": "inner", "n": 82, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 2, "j": 2, "ph": "inner", "n": 92, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 2, "j": -1, "ph": "refit", "n": 93, "ko": 5, "ki": 3, "nc": 10, "line": 2, "msg": ""}, {"f": 2, "j": -1, "ph": "test", "n": 93, "ko": 5, "ki": 3, "nc": 10, "line": 3, "msg": ""}, {"f": 3, "j": 0, "ph": "inner", "n": 103, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 3, "j": 1, "ph": "inner", "n": 113, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 3, "j": 2, "ph": "inner", "n": 123, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 3, "j": -1, "ph": "refit", "n": 124, "ko": 5, "ki": 3, "nc": 10, "line": 2, "msg": ""}, {"f": 3, "j": -1, "ph": "test", "n": 124, "ko": 5, "ki": 3, "nc": 10, "line": 3, "msg": ""}, {"f": 4, "j": 0, "ph": "inner", "n": 134, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 4, "j": 1, "ph": "inner", "n": 144, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 4, "j": 2, "ph": "inner", "n": 154, "ko": 5, "ki": 3, "nc": 10, "line": 1, "msg": ""}, {"f": 4, "j": -1, "ph": "refit", "n": 155, "ko": 5, "ki": 3, "nc": 10, "line": 2, "msg": ""}, {"f": 4, "j": -1, "ph": "test", "n": 155, "ko": 5, "ki": 3, "nc": 10, "line": 3, "msg": ""}];
const CODE = ["for train, test in outer.split(X, y):            # külső fold", "    search.fit(X[train], y[train])             # n_iter jelölt × cv belső fold", "    # refit=True: a legjobb jelölt újraillesztése a teljes külső trainen (+1)", "    score = roc_auc(y[test], search.predict_proba(X[test])[:, 1])"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function g(id){ return +document.getElementById(id).value; }
function onN(){ const ko = g("ko"), ki = g("ki"), nc = g("nc"); ["ko", "ki", "nc"].forEach(i => document.getElementById(i + "v").textContent = g(i));
  const out = []; let n = 0;
  for (let f = 0; f < ko; f++) { for (let j = 0; j < ki; j++) { n += nc; out.push({f: f, j: j, ph: "inner", n: n, ko: ko, ki: ki, nc: nc, line: 1, msg: ""}); }
    n += 1; out.push({f: f, j: -1, ph: "refit", n: n, ko: ko, ki: ki, nc: nc, line: 2, msg: ""}); out.push({f: f, j: -1, ph: "test", n: n, ko: ko, ki: ki, nc: nc, line: 3, msg: ""}); }
  setSteps(out); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 700 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.3"/></pattern>`;
  svg.appendChild(defs);
  const W = 480, x0 = 110, rh = Math.min(26, 150 / s.ko), sw = W / s.ko;
  for (let f = 0; f < s.ko; f++) { const y = 20 + f * (rh + 4), cur = f === s.f;
    el("text", {x: x0 - 8, y: y + rh / 2 + 4, "text-anchor": "end", "font-size": 11, "font-weight": cur ? "bold" : "normal"}, `${f + 1}. külső fold`);
    for (let j = 0; j < s.ko; j++) { const t = j === f;
      el("rect", {x: x0 + j * sw, y: y, width: sw, height: rh, fill: t ? css("--bg") : css("--muted"), stroke: css("--fg"), "stroke-width": t ? (cur && s.ph === "test" ? 4 : 2.2) : 0.8, opacity: cur || f > s.f ? 1 : 0.45}); }
    if (f < s.f || (f === s.f && s.ph === "test")) el("text", {x: x0 + W + 8, y: y + rh / 2 + 4, "font-size": 11}, "✓ külső pontszám"); }
  const yb = 40 + s.ko * (rh + 4), iw = (W - sw) / s.ki;
  el("text", {x: x0, y: yb - 6, "font-size": 11.5}, `a(z) ${s.f + 1}. külső fold trainje (${Math.round(400 * (s.ko - 1) / s.ko)} minta), belső ${s.ki}-fold CV:`);
  for (let r = 0; r < s.ki; r++) { const y = yb + r * 24, cur = s.ph === "inner" && r === s.j, done = s.ph !== "inner" || r < s.j;
    el("text", {x: x0 - 8, y: y + 15, "text-anchor": "end", "font-size": 10.5, "font-weight": cur ? "bold" : "normal"}, `${r + 1}. belső`);
    for (let j = 0; j < s.ki; j++) el("rect", {x: x0 + sw + j * iw, y: y, width: iw, height: 20, fill: j === r ? "url(#hp)" : css("--muted"), stroke: cur ? css("--hl2") : css("--fg"), "stroke-width": cur ? 2.5 : 0.8, opacity: done || cur ? 1 : 0.35}); }
  const yr = yb + s.ki * 24 + 6;
  el("rect", {x: x0 + sw, y: yr, width: W - sw, height: 20, fill: css("--muted"), stroke: s.ph === "refit" ? css("--hl2") : css("--fg"), "stroke-width": s.ph === "refit" ? 2.5 : 0.8, opacity: s.ph === "inner" ? 0.35 : 1});
  el("text", {x: x0 - 8, y: yr + 15, "text-anchor": "end", "font-size": 10.5}, "refit");
  el("text", {x: 600, y: yr + 15, "font-size": 15, "font-weight": "bold"}, `${s.n} illesztés`);
  const tot = s.ko * (s.ki * s.nc + 1);
  const what = s.ph === "inner" ? `${s.j + 1}. belső fold: ${s.nc} jelölt illesztése a belső traineken, értékelés a vonalkázott belső validáción (+${s.nc})` :
    (s.ph === "refit" ? "a legjobb átlagos belső pontszámú jelölt újraillesztése a teljes külső trainen (+1)" : "a kiválasztott modell egyszeri értékelése a külső teszten (nincs illesztés)");
  status.textContent = `${s.f + 1}. külső fold – ${what}. Eddig ${s.n} / ${s.ko} · (${s.ki} · ${s.nc} + 1) = ${tot} illesztés.`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
