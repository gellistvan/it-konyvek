<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bal, jobb és trapéz közelítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label>részintervallumok N: <input id="n" type="range" min="1" max="60" step="1" value="4" oninput="draw()" style="width:220px" aria-label="részintervallumok N:"> <output id="nv"></output></label><label>függvény: <select id="fn" onchange="draw()"><option value="sq">x² (sima)</option><option value="g">g: 0 / 1 töréssel 1/π-nél</option></select></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 470" role="img" aria-label="Három panel az x négyzet bal, jobb és trapézközelítéséről a választott N-re; alatta a trapézhiba log-log görbéje az n függvényében, a választott N jelölésével."></svg>
<p class="small">Kezdőállapot: x², N = 4 (L₄ = 0,21875, R₄ = 0,46875, T₄ = 0,34375, a pontos érték 1/3). A töréspontos g esetén a hiba nem monoton csökken. A fejezet midpoint()/trapezoid() képletei; számított példa.</p>
<script>
const D = {};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function fsel(){ return document.getElementById("fn").value; }
function fx(x){ return fsel() === "sq" ? x * x : (x < 1 / Math.PI ? 0 : 1); }
function exact(){ return fsel() === "sq" ? 1 / 3 : 1 - 1 / Math.PI; }
function sums(n){ const h = 1 / n; let l = 0, r = 0, m = 0; for (let i = 0; i < n; i++) { l += fx(i * h); r += fx((i + 1) * h); m += fx((i + 0.5) * h); }
  let t = 0.5 * (fx(0) + fx(1)); for (let i = 1; i < n; i++) t += fx(i * h);
  return {L: h * l, R: h * r, T: h * t, M: h * m}; }
function draw(){
  const n = val("n"); show("nv", String(n));
  svg.innerHTML = ""; hatchDefs(svg);
  const S = sums(n), ex = exact(), h = 1 / n;
  const names = [["bal (L)", "L", "url(#hd)"], ["jobb (R)", "R", "url(#hb)"], ["trapéz (T)", "T", "url(#dots)"]];
  names.forEach((nm, k) => {
    const A = Axes(svg, {x: 40 + k * 245, y: 30, w: 210, h: 170, x0: 0, x1: 1, y0: 0, y1: 1.1, xt: [0, 0.5, 1], yt: k === 0 ? [0, 0.5, 1] : [], ylo: 30});
    for (let i = 0; i < n; i++) {
      const x0 = i * h, x1 = (i + 1) * h;
      let pts;
      if (k === 0) pts = [[x0, 0], [x0, fx(x0)], [x1, fx(x0)], [x1, 0]];
      else if (k === 1) pts = [[x0, 0], [x0, fx(x1)], [x1, fx(x1)], [x1, 0]];
      else pts = [[x0, 0], [x0, fx(x0)], [x1, fx(x1)], [x1, 0]];
      const d = "M " + pts.map(p => A.X(p[0]).toFixed(1) + " " + A.Y(p[1]).toFixed(1)).join(" L ") + " Z";
      E(svg, "path", {d: d, fill: css("--cellhl"), stroke: "none"});
      E(svg, "path", {d: d, fill: nm[2], stroke: css("--fg"), "stroke-width": n > 30 ? 0.3 : 0.8});
    }
    const xs = [], ys = []; for (let i = 0; i <= 400; i++) { xs.push(i / 400); ys.push(fx(i / 400)); }
    path(svg, A, xs, ys, {"stroke-width": 2.2});
    const v = S[nm[1]];
    E(svg, "text", {x: 40 + k * 245, y: 20, "font-size": 12.5, "font-weight": "bold"}, `${nm[0]} = ${F(v, 5)}`);
    E(svg, "text", {x: 40 + k * 245 + 105, y: 236, "text-anchor": "middle", "font-size": 11.5}, `hiba ${v - ex >= 0 ? "+" : "−"}${F(Math.abs(v - ex), 5)}`);
  });
  // hibagörbe
  const B = Axes(svg, {x: 90, y: 270, w: 600, h: 150, x0: 1, x1: 200, y0: 1e-6, y1: 1, xlog: true, ylog: true,
                       xt: [1, 2, 4, 10, 20, 40, 100, 200], yt: [1e-6, 1e-4, 1e-2, 1], yf: t => FE(t, 0).replace("1·", ""),
                       xl: "n (log)", yl: "|trapézhiba|", ylo: 56});
  const ns = [], es = []; for (let m = 1; m <= 200; m++) { ns.push(m); es.push(Math.abs(sums(m).T - ex)); }
  path(svg, B, ns, es.map(e => Math.max(e, 1e-6)), {"stroke-width": 1.3, stroke: fsel() === "sq" ? css("--fg") : css("--hl2"), "stroke-dasharray": fsel() === "sq" ? "" : "5 3"});
  path(svg, B, [1, 200], [0.32, 0.0016], {stroke: css("--muted"), "stroke-dasharray": "2 3", "stroke-width": 1});
  path(svg, B, [1, 200], [1 / 6, 1 / 6 / 40000], {stroke: css("--muted"), "stroke-dasharray": "8 3 2 3", "stroke-width": 1});
  E(svg, "text", {x: B.X(150), y: B.Y(0.32 / 150) - 6, "font-size": 11, fill: css("--muted"), "text-anchor": "end"}, "O(1/n)");
  E(svg, "text", {x: B.X(150), y: B.Y(1 / 6 / 22500) + 14, "font-size": 11, fill: css("--muted"), "text-anchor": "end"}, "O(1/n²)");
  const en = Math.abs(S.T - ex);
  E(svg, "circle", {cx: B.X(n), cy: B.Y(Math.max(en, 1e-6)), r: 5.5, fill: "none", stroke: css("--hl2"), "stroke-width": 2.2});
  status.textContent = `${fsel() === "sq" ? "f(x) = x²" : "töréspontos g"}, N = ${n}: bal ${F(S.L, 5)}, jobb ${F(S.R, 5)}, trapéz ${F(S.T, 5)}, pontos ${F(ex, 5)}; a trapéz hibája ${FE(en, 2)}.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
