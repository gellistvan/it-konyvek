<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prior, likelihood, posterior</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}input[type=range]{min-width:110px;flex:1}
#status{min-height:2.9em;margin:4px 0}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}button{font:inherit;padding:3px 8px;cursor:pointer}
</style></head><body>
<div class="ctl" role="group" aria-label="Adat">
<label for="n">n = <b id="nv"></b></label><input id="n" type="range" min="1" max="300" value="15">
<label for="k">k = <b id="kv"></b></label><input id="k" type="range" min="0" max="15" value="6">
</div>
<div class="ctl" role="group" aria-label="Prior">
<label for="a">prior α = <b id="av"></b></label><input id="a" type="range" min="0.5" max="20" step="0.5" value="1">
<label for="b">β = <b id="bv"></b></label><input id="b" type="range" min="0.5" max="20" step="0.5" value="1">
</div>
<div class="ctl" role="group" aria-label="A könyv esetei">
<button data-p="15,6,1,1">flat, n = 15</button><button data-p="15,6,1,4">szkeptikus, n = 15</button>
<button data-p="60,24,1,1">flat, n = 60</button><button data-p="60,24,1,4">szkeptikus, n = 60</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="A prior, a skálázott likelihood és a posterior sűrűsége a konverziós valószínűség függvényében."></svg>
<p class="small">Konjugált Beta–Binomiális modell: prior Beta(α, β), adat k siker n próbából, posterior Beta(α + k, β + n − k). A likelihood a posterior csúcsára skálázva. A 95%-os egyenlő farkú intervallum a regularizált nem teljes béta-függvényből. Analitikus számítás, nem mérés.</p>
<script>
const CHECK = {"1,1,15,6": [0.1975, 0.6457], "1,1,60,24": [0.2855, 0.5269], "1,4,15,6": [0.1629, 0.5655], "1,4,60,24": [0.271, 0.5049]};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
function lgam(x){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
 let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=g[j]/++y;return -t+Math.log(2.5066282746310005*s/x);}
function betacf(a,b,x){const MAXIT=300,EPS=3e-14,FP=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FP)d=FP;d=1/d;let h=d;
 for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;h*=d*c;
  aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FP)d=FP;c=1+aa/c;if(Math.abs(c)<FP)c=FP;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgam(a+b)-lgam(a)-lgam(b)+a*Math.log(x)+b*Math.log(1-x));
 return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
function qbeta(p,a,b){let lo=0,hi=1;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(ibeta(m,a,b)<p)lo=m;else hi=m;}return (lo+hi)/2;}
function lpdf(x,a,b){return lgam(a+b)-lgam(a)-lgam(b)+(a-1)*Math.log(x)+(b-1)*Math.log(1-x);}
const ids=["n","k","a","b"], g=id=>document.getElementById(id);
function draw(){
  const n=+g("n").value; g("k").max=n; if(+g("k").value>n)g("k").value=n;
  const k=+g("k").value, a=+g("a").value, b=+g("b").value;
  g("nv").textContent=n;g("kv").textContent=k;g("av").textContent=hu(a,1);g("bv").textContent=hu(b,1);
  const A=a+k,B=b+n-k, mean=A/(A+B), mode=(A>1&&B>1)?(A-1)/(A+B-2):null, lo=qbeta(0.025,A,B), hi=qbeta(0.975,A,B);
  const xs=[];for(let i=1;i<400;i++)xs.push(i/400);
  const po=xs.map(x=>Math.exp(lpdf(x,A,B))), pr=xs.map(x=>Math.exp(lpdf(x,a,b)));
  const pmax=Math.max(...po), ll=xs.map(x=>k*Math.log(x)+(n-k)*Math.log(1-x)), lmax=Math.max(...ll), li=ll.map(v=>Math.exp(v-lmax)*pmax);
  const ymax=Math.max(pmax,Math.min(Math.max(...pr),pmax*1.5))*1.1;
  svg.innerHTML="";
  const X0=60,W=660,Y0=15,H=240,px=v=>X0+v*W,py=v=>Y0+H-Math.min(v,ymax)/ymax*H;
  E("rect",{x:px(lo),y:Y0,width:px(hi)-px(lo),height:H,fill:css("--grid"),"fill-opacity":0.35});
  for(let i=0;i<=4;i++){const v=ymax*i/4;E("line",{x1:X0,x2:X0+W,y1:py(v),y2:py(v),stroke:css("--grid"),"stroke-dasharray":"2 3"});E("text",{x:X0-6,y:py(v)+4,"text-anchor":"end","font-size":11},hu(v,1));}
  for(let v=0;v<=1.0001;v+=0.1)E("text",{x:px(v),y:Y0+H+16,"text-anchor":"middle","font-size":11},hu(v,1));
  const pl=(arr,st)=>E("polyline",{points:xs.map((x,i)=>px(x)+","+py(arr[i])).join(" "),fill:"none",...st});
  pl(pr,{stroke:css("--muted"),"stroke-width":1.6,"stroke-dasharray":"7 4"});
  pl(li,{stroke:css("--hl2"),"stroke-width":2,"stroke-dasharray":"2 3"});
  pl(po,{stroke:css("--hl"),"stroke-width":2.6});
  E("line",{x1:px(mean),x2:px(mean),y1:Y0,y2:Y0+H,stroke:css("--line"),"stroke-dasharray":"6 3 1 3"});
  E("line",{x1:X0,x2:X0+W,y1:py(0),y2:py(0),stroke:css("--line")});
  E("text",{x:X0+W/2,y:Y0+H+36,"text-anchor":"middle","font-size":12},"p (konverziós valószínűség)");
  E("text",{x:16,y:Y0+H/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 16 ${Y0+H/2})`},"sűrűség");
  [["--muted","7 4","prior Beta("+hu(a,1)+", "+hu(b,1)+")"],["--hl2","2 3","likelihood (skálázva)"],["--hl","","posterior"]].forEach(([c,d,t],i)=>{
    E("line",{x1:X0+W-190,x2:X0+W-160,y1:Y0+10+i*16,y2:Y0+10+i*16,stroke:css(c),"stroke-width":2.2,"stroke-dasharray":d});E("text",{x:X0+W-154,y:Y0+14+i*16,"font-size":11},t);});
  let msg=`Posterior Beta(${hu(A,1)}, ${hu(B,1)}): várható érték ${hu(mean,4)}, módusz ${mode===null?"nem belső pont":hu(mode,4)}, 95%-os intervallum [${hu(lo,4)}; ${hu(hi,4)}] (árnyékolt).`;
  const key=`${a},${b},${n},${k}`; if(CHECK[key])msg+=` A könyv esete; Python/SciPy: [${hu(CHECK[key][0],4)}; ${hu(CHECK[key][1],4)}].`;
  msg+=` A prior „súlya” α + β = ${hu(a+b,1)} pszeudo-megfigyelés az n = ${n} valódival szemben.`;
  g("status").textContent=msg;
}
ids.forEach(id=>g(id).addEventListener("input",draw));
document.querySelectorAll("button[data-p]").forEach(bt=>bt.addEventListener("click",()=>{const v=bt.dataset.p.split(",");g("n").value=v[0];g("k").max=v[0];g("k").value=v[1];g("a").value=v[2];g("b").value=v[3];draw();}));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
