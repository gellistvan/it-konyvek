<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hat döntési dimenzió három esetre</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--muted);padding:5px 6px;text-align:center;vertical-align:middle}
th{background:var(--code)}
th.row{text-align:left}
td.c{cursor:pointer}
td.c:hover,td.c:focus{outline:2px solid var(--hl);outline-offset:-2px}
td.k{border:3px solid var(--fg);font-weight:600}
td.on{background:var(--code)}
#status{margin:8px 0;min-height:3.2em;font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="status" aria-live="polite"></div>
<table aria-label="Döntési mátrix"><thead id="th"></thead><tbody id="tb"></tbody></table>
<p class="small">★ vastag keret: kritikus döntés. Kattints vagy lépj (Tab) egy cellára: az állapotsor a fejezet indoklását mutatja.
A „gyorsító” sor mindhárom esetben: GPU nem indokolt.</p>
<script>
const DIMS = ["reprezentáció", "értelmezhetőség", "bizonytalanság", "értékelés", "számítás", "adathatár"], COLS = ["P1 – rendeléskésés\n(tabuláris)", "P2 – support-jegy\n(szöveges)", "P3 – napi rendelés\n(idősor)"], CELLS = [[["skálázás + one-hot", false, "Tabuláris vektor; a jellemzők közvetlenül rendelkezésre állnak (döntési táblázat)."], ["TF-IDF, ritka;\nfit csak a tanítón", true, "TfidfVectorizer(max_features=5000, min_df=3), csak a tanítószövegen fit-elve (szivárgás ellen)."], ["csúszó ablak:\n14 nap → 7 nap", false, "Az elmúlt 14 nap napi rendelésszáma a bemenet, a következő 7 nap összege a kimenet."]], [["logreg elsődleges;\nMLP csak összevetés", false, "A döntéshozó a distance_km és priority_flag hatását kéri."], ["token-\nkoefficiensek", false, "A legerősebb pozitív/negatív tokenek listája a logisztikus koefficiensekből."], ["naiv baseline-hoz\nviszonyítás", false, "A szöveg nem ad külön értelmezhetőségi tervet; a modellt a naiv 14 napos átlaghoz mérjük."]], [["kalibrációs görbe", false, "A p̂ becslés nem garantáltan kalibrált; a log loss ezt méri."], ["softmax-\nkalibráció", false, "A softmax valószínűséget kalibrációs görbén mérjük; magabiztos tévedés = hiányzó kontextus."], ["intervallum külön\nkalibrációs ablakból", false, "A tanító reziduumok kvantilise nem konform intervallum; konform intervallumhoz külön, a tanításban nem használt kalibrációs ablak kell."]], [["purged időbeli split;\nlog loss + AUC", true, "Purged time-based split; a teszt nem vezérelhet keresést (s096)."], ["macro-F1\n(+ log loss)", true, "Macro-F1, mert a kategóriák kiegyensúlyozatlanok lehetnek; kiegészítésként kalibrált log loss."], ["MAE / RMSE\na naivhoz képest", true, "MAE és RMSE a napi rendelésszám mértékegységében, és a relatív hiba a naiv baseline-hoz."]], [["CPU", false, "2400 soron a GPU nem indokolt; mérési terv a s132 szerint."], ["CPU", false, "300 jegy, 5000 szótárelem: másodperces tanítás CPU-n."], ["CPU", false, "A 180 nap 165 ablakot ad; CPU elegendő, GPU csak több év adatánál."]], [["csak rendeléskor\nismert feature;\ndelivery_days tiltott", true, "Csak rendeléskor ismert feature-ök; a delivery_days tiltott (adatszerződés)."], ["csak a jegy szövege;\nválasz tiltott", false, "A jegy szövege ismert; a későbbi válaszok vagy megoldások nem használhatók."], ["a holnapi rendelés\nma nem ismert", true, "A holnapi rendelés ma nem ismert; a cél csak az order_ts-ből származik."]]];
document.getElementById("th").innerHTML = "<tr><th></th>" + COLS.map(c => `<th>${c.replace("\n", "<br>")}</th>`).join("") + "</tr>";
let h = "";
DIMS.forEach((d, i) => { h += `<tr><th class="row" scope="row">${d}</th>`;
  CELLS[i].forEach((c, j) => { h += `<td class="c${c[1] ? " k" : ""}" tabindex="0" data-i="${i}" data-j="${j}">${c[0].replace("\n", "<br>")}${c[1] ? " ★" : ""}</td>`; });
  h += "</tr>"; });
h += `<tr><th class="row" scope="row">gyorsító</th>` + COLS.map(() => "<td><i>GPU: nem indokolt</i></td>").join("") + "</tr>";
document.getElementById("tb").innerHTML = h;
const st = document.getElementById("status");
function pick(td){ document.querySelectorAll("td.on").forEach(x => x.classList.remove("on")); td.classList.add("on");
  const i = +td.dataset.i, j = +td.dataset.j, c = CELLS[i][j];
  st.textContent = `${COLS[j].split("\n")[0]} · ${DIMS[i]}${c[1] ? " (kritikus döntés)" : ""}: ${c[2]}`; }
document.querySelectorAll("td.c").forEach(td => { td.addEventListener("click", () => pick(td)); td.addEventListener("focus", () => pick(td)); });
st.textContent = "Hat sor, három oszlop; a számítási cella mindhárom esetben CPU. Válassz egy cellát az indokláshoz.";
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
