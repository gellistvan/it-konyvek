<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hat sorsolás, hat becslés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Potenciális kimenetek (pipa = 1): </span><label title="A: Y(1)">A: Y(1) <input type="checkbox" id="y1A" onchange="upd()" checked></label> <label title="A: Y(0)">Y(0) <input type="checkbox" id="y0A" onchange="upd()"></label> &nbsp;<label title="B: Y(1)">B: Y(1) <input type="checkbox" id="y1B" onchange="upd()"></label> <label title="B: Y(0)">Y(0) <input type="checkbox" id="y0B" onchange="upd()"></label> &nbsp;<label title="C: Y(1)">C: Y(1) <input type="checkbox" id="y1C" onchange="upd()" checked></label> <label title="C: Y(0)">Y(0) <input type="checkbox" id="y0C" onchange="upd()" checked></label> &nbsp;<label title="D: Y(1)">D: Y(1) <input type="checkbox" id="y1D" onchange="upd()" checked></label> <label title="D: Y(0)">Y(0) <input type="checkbox" id="y0D" onchange="upd()"></label> &nbsp;</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Balra a négy ügyfél potenciális kimeneteinek táblája, jobbra a hat sorsolás becslésének oszlopai és a 0,5-ös Δ_ITT szaggatott vonala."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet négyügyfeles példája (A–D); a jelölőnégyzetekkel a potenciális kimenetek átírhatók, a hat becslés átlaga mindig a négy egyéni hatás átlaga marad. Számított példa, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "A hat lehetséges kettő-kettő sorsolás becslése és a négy ügyfél mindkét potenciális kimenete. Lépj tovább: sorsolásonként mit figyelünk meg.", "k": -1, "line": 0}, {"k": 0, "line": 4, "msg": "1. sorsolás: kezelt A,B, kontroll C,D: kezelt átlag 0,5, kontroll átlag 0,5, különbség 0."}, {"k": 1, "line": 4, "msg": "2. sorsolás: kezelt A,C, kontroll B,D: kezelt átlag 1, kontroll átlag 0, különbség 1."}, {"k": 2, "line": 4, "msg": "3. sorsolás: kezelt A,D, kontroll B,C: kezelt átlag 1, kontroll átlag 0,5, különbség 0,5."}, {"k": 3, "line": 4, "msg": "4. sorsolás: kezelt B,C, kontroll A,D: kezelt átlag 0,5, kontroll átlag 0, különbség 0,5."}, {"k": 4, "line": 4, "msg": "5. sorsolás: kezelt B,D, kontroll A,C: kezelt átlag 0,5, kontroll átlag 0,5, különbség 0."}, {"k": 5, "line": 4, "msg": "6. sorsolás: kezelt C,D, kontroll A,B: kezelt átlag 1, kontroll átlag 0, különbség 1."}, {"k": 6, "line": 5, "msg": "A hat becslés átlaga 0,5: egyenlő a négy egyéni hatás átlagával (Δ_ITT). Egy-egy sorsolás 0 és 1 között ingadozik."}];
const CODE = ["for kezelt in combinations(['A','B','C','D'], 2):", "    kontroll = a maradék két ügyfél", "    m1 = átlag(Y(1) a kezelteken)    # csak ez figyelhető meg náluk", "    m0 = átlag(Y(0) a kontrollokon)", "    becslés = m1 − m0", "ITT = átlag(Y(1) − Y(0))  =  a hat becslés átlaga"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const IDS = ["A", "B", "C", "D"];
let Y1 = {"A": 1, "B": 0, "C": 1, "D": 1}, Y0 = {"A": 0, "B": 0, "C": 1, "D": 0}, DR = [{"t": "AB", "c": "CD", "mt": 0.5, "mc": 0.5, "d": 0.0}, {"t": "AC", "c": "BD", "mt": 1.0, "mc": 0.0, "d": 1.0}, {"t": "AD", "c": "BC", "mt": 1.0, "mc": 0.5, "d": 0.5}, {"t": "BC", "c": "AD", "mt": 0.5, "mc": 0.0, "d": 0.5}, {"t": "BD", "c": "AC", "mt": 0.5, "mc": 0.5, "d": 0.0}, {"t": "CD", "c": "AB", "mt": 1.0, "mc": 0.0, "d": 1.0}];
function f1(v){ return (Math.round(v * 100) / 100).toString().replace(".", ","); }
function calc(){
  const out = [];
  for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) {
    const t = [IDS[a], IDS[b]], c = IDS.filter(x => !t.includes(x));
    const mt = (Y1[t[0]] + Y1[t[1]]) / 2, mc = (Y0[c[0]] + Y0[c[1]]) / 2;
    out.push({t: t.join(""), c: c.join(""), mt: mt, mc: mc, d: mt - mc});
  }
  return out;
}
function mkSteps(){
  const st = [{msg: "A hat lehetséges kettő-kettő sorsolás becslése és a négy ügyfél mindkét potenciális kimenete. Lépj tovább: sorsolásonként mit figyelünk meg.", k: -1, line: 0}];
  DR.forEach((r, i) => st.push({k: i, line: 4, msg: `${i + 1}. sorsolás: kezelt ${r.t[0]},${r.t[1]}, kontroll ${r.c[0]},${r.c[1]}: kezelt átlag ${f1(r.mt)}, kontroll átlag ${f1(r.mc)}, különbség ${f1(r.d)}.`}));
  const m = DR.reduce((s, r) => s + r.d, 0) / DR.length;
  st.push({k: DR.length, line: 5, msg: `A hat becslés átlaga ${f1(m)}: egyenlő a négy egyéni hatás átlagával (Δ_ITT). Egy-egy sorsolás 0 és 1 között ingadozik.`});
  return st;
}
function upd(){
  IDS.forEach(i => { Y1[i] = document.getElementById("y1" + i).checked ? 1 : 0; Y0[i] = document.getElementById("y0" + i).checked ? 1 : 0; });
  DR = calc(); setSteps(mkSteps());
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 330");
  const cur = s.k >= 0 && s.k < DR.length ? DR[s.k] : null;
  // tábla
  const tx0 = 14, ty0 = 30, cw = [46, 46, 46, 56];
  ["Ügyfél", "Y(1)", "Y(0)", "hatás"].forEach((h, j) => el("text", {x: tx0 + cw.slice(0, j).reduce((a, b) => a + b, 0) + cw[j] / 2, y: ty0, "text-anchor": "middle", "font-size": 13, style: "font-weight:bold"}, h));
  IDS.forEach((id, r) => {
    const y = ty0 + 14 + r * 34, treated = cur && cur.t.includes(id), ctrl = cur && cur.c.includes(id);
    const vals = [id, Y1[id], Y0[id], (Y1[id] - Y0[id] > 0 ? "+" : "") + (Y1[id] - Y0[id]).toString().replace("-", "−")];
    let x = tx0;
    vals.forEach((v, j) => {
      const obs = (j === 1 && treated) || (j === 2 && ctrl), hidden = cur && ((j === 1 && ctrl) || (j === 2 && treated));
      el("rect", {x: x, y: y, width: cw[j], height: 30, fill: obs ? css("--cellhl") : css("--cell"), stroke: obs ? css("--hl2") : css("--line"), "stroke-width": obs ? 2.5 : 1});
      el("text", {x: x + cw[j] / 2, y: y + 20, "text-anchor": "middle", "font-size": 14, fill: hidden ? css("--muted") : css("--fg")}, hidden ? "?" : String(v));
      x += cw[j];
    });
    if (cur) el("text", {x: x + 6, y: y + 20, "font-size": 12}, treated ? "kezelt" : "kontroll");
  });
  el("text", {x: tx0, y: ty0 + 162, "font-size": 11.5, fill: css("--muted")}, "kiemelt: a megfigyelt érték; „?”: kontrafaktuális");
  const itt = IDS.reduce((a, i) => a + Y1[i] - Y0[i], 0) / 4;
  el("text", {x: tx0, y: ty0 + 184, "font-size": 12.5}, `Δ_ITT = (${IDS.map(i => (Y1[i] - Y0[i]).toString().replace("-", "−")).join(" + ")}) / 4 = ${f1(itt)}`);
  // oszlopdiagram
  const X0 = 330, W = 370, Yb = 200, sc = 100;
  const Y = v => Yb - v * sc;
  el("line", {x1: X0, y1: Y(0), x2: X0 + W, y2: Y(0), stroke: css("--line")});
  [-1, -0.5, 0, 0.5, 1].forEach(v => { el("text", {x: X0 - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, f1(v).replace("-", "−")); el("line", {x1: X0, y1: Y(v), x2: X0 + W, y2: Y(v), stroke: css("--muted"), "stroke-width": 0.3}); });
  const bw = W / 6;
  const shown = s.k < 0 ? DR.length : Math.min(DR.length, s.k + 1);
  DR.forEach((r, i) => {
    const x = X0 + i * bw + 10, on = i === s.k;
    el("text", {x: x + (bw - 20) / 2, y: Y(0) + (r.d < 0 ? -8 : 18), "text-anchor": "middle", "font-size": 12, style: on ? "font-weight:bold" : ""}, r.t);
    if (i >= shown) return;
    const y = Math.min(Y(0), Y(r.d)), h = Math.abs(Y(r.d) - Y(0));
    el("rect", {x: x, y: y, width: bw - 20, height: Math.max(h, 1), fill: on ? css("--cellhl") : css("--muted"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: x + (bw - 20) / 2, y: r.d >= 0 ? y - 4 : y + h + 13, "text-anchor": "middle", "font-size": 12}, f1(r.d).replace("-", "−"));
  });
  el("line", {x1: X0, y1: Y(itt), x2: X0 + W, y2: Y(itt), stroke: css("--fg"), "stroke-dasharray": "6 4", "stroke-width": 1.6});
  el("line", {x1: X0, y1: 22, x2: X0 + 30, y2: 22, stroke: css("--fg"), "stroke-dasharray": "6 4", "stroke-width": 1.6});
  el("text", {x: X0 + 36, y: 26, "font-size": 11.5}, `Δ_ITT = ${f1(itt)} (a négy egyéni hatás átlaga)`);
  if (shown > 0) {
    const m = DR.slice(0, shown).reduce((a, r) => a + r.d, 0) / shown;
    el("line", {x1: X0, y1: Y(m), x2: X0 + W, y2: Y(m), stroke: css("--hl2"), "stroke-dasharray": "2 3", "stroke-width": 1.6});
    el("line", {x1: X0, y1: 44, x2: X0 + 30, y2: 44, stroke: css("--hl2"), "stroke-dasharray": "2 3", "stroke-width": 1.6});
    el("text", {x: X0 + 36, y: 48, "font-size": 11.5, fill: css("--hl2")}, `az eddigi ${shown} becslés átlaga: ${f1(m)}`);
  }
  el("text", {x: X0 + W / 2, y: 312, "text-anchor": "middle", "font-size": 12}, "kezelésre sorsolt ügyfelek → becslés (kezelt − kontroll átlag)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
