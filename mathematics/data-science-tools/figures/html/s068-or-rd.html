<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esélyhányados és abszolút különbség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}input[type=range]{min-width:150px;flex:1}
#status{min-height:2.9em;margin:4px 0}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label for="or">OR = <b id="orv">2,00</b></label><input id="or" type="range" min="0.25" max="6" step="0.05" value="2">
<label for="p0">p₀ = <b id="p0v">0,50</b></label><input id="p0" type="range" min="0.01" max="0.99" step="0.01" value="0.5">
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 320" role="img" aria-label="A p1 − p0 különbség a kontroll-valószínűség függvényében adott esélyhányados mellett; harang alakú görbe."></svg>
<p class="small">p₁ = OR·p₀ / (1 − p₀ + OR·p₀). A szaggatott szürke görbék a rögzített OR = 1,5 és OR = 2 referenciák; a vastag görbe a választott OR. Analitikus számítás, nem mérés.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
function p1(p0,OR){return OR*p0/(1-p0+OR*p0);}
function draw(){
  const OR=+document.getElementById("or").value, p0=+document.getElementById("p0").value;
  document.getElementById("orv").textContent=hu(OR,2);document.getElementById("p0v").textContent=hu(p0,2);
  svg.innerHTML="";
  const X0=70,W=640,Y0=20,H=250;
  let lo=0,hi=0.2; for(let i=0;i<=200;i++){const p=i/200,d=p1(p,OR)-p;lo=Math.min(lo,d);hi=Math.max(hi,d);}
  lo=Math.floor(lo*20)/20; hi=Math.ceil(hi*20)/20;
  const px=v=>X0+v*W, py=v=>Y0+H-(v-lo)/(hi-lo)*H;
  for(let v=lo;v<=hi+1e-9;v+=0.05){E("line",{x1:X0,x2:X0+W,y1:py(v),y2:py(v),stroke:css("--grid"),"stroke-dasharray":"2 3"});E("text",{x:X0-6,y:py(v)+4,"text-anchor":"end","font-size":11},hu(v,2));}
  for(let v=0;v<=1.0001;v+=0.1)E("text",{x:px(v),y:Y0+H+16,"text-anchor":"middle","font-size":11},hu(v,1));
  E("line",{x1:X0,x2:X0+W,y1:py(0),y2:py(0),stroke:css("--line")});
  E("text",{x:X0+W/2,y:Y0+H+36,"text-anchor":"middle","font-size":12},"kontrollcsoport valószínűsége p₀");
  E("text",{x:16,y:Y0+H/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 16 ${Y0+H/2})`},"p₁ − p₀");
  const curve=(o)=>{const a=[];for(let i=0;i<=200;i++){const p=i/200;a.push(px(p)+","+py(p1(p,o)-p));}return a.join(" ");};
  [1.5,2].forEach(o=>E("polyline",{points:curve(o),fill:"none",stroke:css("--muted"),"stroke-dasharray":"5 4","stroke-width":1}));
  E("polyline",{points:curve(OR),fill:"none",stroke:css("--hl"),"stroke-width":2.6});
  const ps=1/(1+Math.sqrt(OR));
  E("line",{x1:px(ps),x2:px(ps),y1:py(0),y2:py(p1(ps,OR)-ps),stroke:css("--muted"),"stroke-dasharray":"2 3"});
  E("text",{x:px(ps),y:py(0)+(OR>=1?-6:14),"text-anchor":"middle","font-size":11,fill:css("--muted")},"szélsőérték p₀ = "+hu(ps,3));
  const d=p1(p0,OR)-p0;
  E("line",{x1:px(p0),x2:px(p0),y1:Y0,y2:Y0+H,stroke:css("--hl2"),"stroke-dasharray":"6 3"});
  E("circle",{cx:px(p0),cy:py(d),r:6,fill:css("--hl2")});
  E("text",{x:px(p0)+(p0>0.75?-8:8),y:py(d)-10,"text-anchor":p0>0.75?"end":"start","font-size":12,"font-weight":"bold"},(d>=0?"+":"")+hu(100*d,1)+" sz.pont");
  E("text",{x:X0+W-4,y:Y0+12,"text-anchor":"end","font-size":11,fill:css("--muted")},"szaggatott: OR = 1,5 és OR = 2");
  const q=p1(p0,OR);
  document.getElementById("status").textContent=`OR = ${hu(OR,2)}, p₀ = ${hu(p0,2)} (odds₀ = ${hu(p0/(1-p0),3)}): p₁ = ${hu(q,4)}, `+
    `abszolút különbség ${hu(100*d,1)} százalékpont, kockázati arány RR = ${hu(q/p0,3)}. Ugyanaz az OR más p₀ mellett más különbséget ad; a legnagyobb eltérés p₀ = 1/(1+√OR) = ${hu(ps,3)}-nél van.`;
}
["or","p0"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
