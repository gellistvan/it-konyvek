<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stresszteszt: log loss és AUC a távolság-szorzó függvényében</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <label for="c">distance_km szorzó c =</label><input id="c" type="range" min="0" max="50" step="1" value="10" aria-label="Távolság-szorzó">
  <b id="cv"></b>
</div>
<div class="ctl">
  <label for="t">bevezetési küszöb (log loss):</label><input id="t" type="range" min="0.31" max="0.60" step="0.01" value="0.35" aria-label="Küszöb" style="max-width:220px">
  <b id="tv"></b><button id="r">alaphelyzet</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="A log loss c = 1 körül minimális, a küszöböt mindkét irányban átlépi; az AUC alig változik"></svg>
<p class="small">A s104 szkript futtatott kimenete (utc=True dátumokkal és a kategóriaoszlopok merge-jével, lab/data, 800 tesztsor, scikit-learn 1.9.1) 0,05-ös c-rácson;
a csúszka csak ezeket a futtatott pontokat mutatja. Folytonos vonal: log loss (bal tengely), szaggatott: ROC-AUC (jobb tengely).</p>
<script>
const R = [{"c": 0.5, "log_loss": 0.78262, "auc": 0.90197}, {"c": 0.55, "log_loss": 0.71262, "auc": 0.90728}, {"c": 0.6, "log_loss": 0.64521, "auc": 0.9109}, {"c": 0.65, "log_loss": 0.58119, "auc": 0.91395}, {"c": 0.7, "log_loss": 0.52144, "auc": 0.91607}, {"c": 0.75, "log_loss": 0.46694, "auc": 0.91735}, {"c": 0.8, "log_loss": 0.4187, "auc": 0.91837}, {"c": 0.85, "log_loss": 0.37765, "auc": 0.91896}, {"c": 0.9, "log_loss": 0.34459, "auc": 0.9196}, {"c": 0.95, "log_loss": 0.32015, "auc": 0.91972}, {"c": 1.0, "log_loss": 0.30474, "auc": 0.91974}, {"c": 1.05, "log_loss": 0.29852, "auc": 0.91963}, {"c": 1.1, "log_loss": 0.30142, "auc": 0.91951}, {"c": 1.15, "log_loss": 0.31317, "auc": 0.91935}, {"c": 1.2, "log_loss": 0.33335, "auc": 0.91924}, {"c": 1.25, "log_loss": 0.36142, "auc": 0.91914}, {"c": 1.3, "log_loss": 0.39679, "auc": 0.91901}, {"c": 1.35, "log_loss": 0.43887, "auc": 0.91875}, {"c": 1.4, "log_loss": 0.48708, "auc": 0.91845}, {"c": 1.45, "log_loss": 0.5409, "auc": 0.91824}, {"c": 1.5, "log_loss": 0.59981, "auc": 0.91783}, {"c": 1.55, "log_loss": 0.6634, "auc": 0.91764}, {"c": 1.6, "log_loss": 0.73125, "auc": 0.91719}, {"c": 1.65, "log_loss": 0.80301, "auc": 0.91703}, {"c": 1.7, "log_loss": 0.87836, "auc": 0.91654}, {"c": 1.75, "log_loss": 0.95702, "auc": 0.91618}, {"c": 1.8, "log_loss": 1.03873, "auc": 0.91594}, {"c": 1.85, "log_loss": 1.12326, "auc": 0.91555}, {"c": 1.9, "log_loss": 1.2104, "auc": 0.91523}, {"c": 1.95, "log_loss": 1.29994, "auc": 0.91485}, {"c": 2.0, "log_loss": 1.39171, "auc": 0.91454}, {"c": 2.05, "log_loss": 1.48555, "auc": 0.91425}, {"c": 2.1, "log_loss": 1.58131, "auc": 0.91396}, {"c": 2.15, "log_loss": 1.67885, "auc": 0.91375}, {"c": 2.2, "log_loss": 1.77805, "auc": 0.91348}, {"c": 2.25, "log_loss": 1.87879, "auc": 0.9132}, {"c": 2.3, "log_loss": 1.98096, "auc": 0.91299}, {"c": 2.35, "log_loss": 2.08447, "auc": 0.91263}, {"c": 2.4, "log_loss": 2.18922, "auc": 0.91217}, {"c": 2.45, "log_loss": 2.29514, "auc": 0.91195}, {"c": 2.5, "log_loss": 2.40214, "auc": 0.91165}, {"c": 2.55, "log_loss": 2.51015, "auc": 0.9114}, {"c": 2.6, "log_loss": 2.61911, "auc": 0.91104}, {"c": 2.65, "log_loss": 2.72897, "auc": 0.91072}, {"c": 2.7, "log_loss": 2.83966, "auc": 0.91052}, {"c": 2.75, "log_loss": 2.95114, "auc": 0.91041}, {"c": 2.8, "log_loss": 3.06336, "auc": 0.9103}, {"c": 2.85, "log_loss": 3.17628, "auc": 0.9102}, {"c": 2.9, "log_loss": 3.28985, "auc": 0.91004}, {"c": 2.95, "log_loss": 3.40405, "auc": 0.90987}, {"c": 3.0, "log_loss": 3.51884, "auc": 0.90973}];
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
const L = 60, RR = 580, T = 16, B = 250, C0 = 0.5, C1 = 3.0, YM = 3.6, A0 = 0.88, A1 = 0.925;
const X = c => L + (RR - L) * (c - C0) / (C1 - C0), Y = v => B - (B - T) * Math.min(v, YM) / YM, YA = a => B - (B - T) * (a - A0) / (A1 - A0);
const ref = R.find(r => Math.abs(r.c - 1) < 1e-9);
function draw(){
  const i = +document.getElementById("c").value, thr = +document.getElementById("t").value, r = R[i];
  document.getElementById("cv").textContent = fmt(r.c, 2); document.getElementById("tv").textContent = fmt(thr, 2);
  svg.innerHTML = "";
  [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5].forEach(v => { el("line", {x1: L, y1: Y(v), x2: RR, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 1)); });
  [0.88, 0.89, 0.90, 0.91, 0.92].forEach(a => el("text", {x: RR + 6, y: YA(a) + 4, "font-size": 11, fill: css("--muted")}, fmt(a, 2)));
  [0.5, 1, 1.5, 2, 2.5, 3].forEach(c => el("text", {x: X(c), y: B + 16, "text-anchor": "middle", "font-size": 11}, fmt(c, c % 1 ? 1 : 0)));
  el("line", {x1: L, y1: B, x2: RR, y2: B, stroke: css("--line")}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: css("--line")});
  el("text", {x: (L + RR) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "distance_km szorzó c");
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "teszt log loss (nat)");
  el("text", {x: 632, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, fill: css("--muted"), transform: `rotate(90 632 ${(T + B) / 2})`}, "ROC-AUC");
  el("path", {d: R.map((q, j) => (j ? "L" : "M") + X(q.c).toFixed(1) + "," + Y(q.log_loss).toFixed(1)).join(""), fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("path", {d: R.map((q, j) => (j ? "L" : "M") + X(q.c).toFixed(1) + "," + YA(q.auc).toFixed(1)).join(""), fill: "none", stroke: css("--muted"), "stroke-width": 1.6, "stroke-dasharray": "7 4"});
  el("line", {x1: L, y1: Y(thr), x2: RR, y2: Y(thr), stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "6 4"});
  const cr = [];
  for (let j = 0; j + 1 < R.length; j++) { const a = R[j], b = R[j + 1]; if ((a.log_loss - thr) * (b.log_loss - thr) < 0) cr.push(a.c + (thr - a.log_loss) / (b.log_loss - a.log_loss) * (b.c - a.c)); }
  cr.forEach(c => { el("line", {x1: X(c), y1: T, x2: X(c), y2: B, stroke: css("--hl"), "stroke-dasharray": "2 3"}); el("text", {x: X(c) + 4, y: T + 12, "font-size": 11, fill: css("--hl")}, "c ≈ " + fmt(c, 2)); });
  el("circle", {cx: X(r.c), cy: Y(r.log_loss), r: 6, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.5});
  el("rect", {x: X(r.c) - 5, y: YA(r.auc) - 5, width: 10, height: 10, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2});
  const over = r.log_loss > thr;
  document.getElementById("status").textContent = `c = ${fmt(r.c, 2)}: log loss ${fmt(r.log_loss, 3)} (ΔL = ${r.log_loss >= ref.log_loss ? "+" : "−"}${fmt(Math.abs(r.log_loss - ref.log_loss), 3)}), AUC ${fmt(r.auc, 3)} → ${over ? "a küszöb (" + fmt(thr, 2) + ") felett: nem támogatott eltolódás" : "a küszöb alatt"}; töréspontok: ${cr.length ? cr.map(c => fmt(c, 2)).join(" és ") : "nincs"}.`;
}
["c", "t"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("r").onclick = () => { document.getElementById("c").value = 10; document.getElementById("t").value = 0.35; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
