<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konfidenciaintervallumok lefedettsége</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><button onclick="resample()">új 100 minta</button><button onclick="for (let i = 0; i < 10; i++) resample()">10 × új 100 minta</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 480" role="img" aria-label="Száz konfidenciaintervallum vízszintes szakaszokként a valódi átlag függőleges vonalával; a valódi átlagot nem tartalmazók vastag szaggatottak; a gomb újrasorsolja a mintákat."></svg>
<p class="small">n = 30, N(5000; 800), 95%-os t-intervallum (kvantilis 2,045). A kezdőállapot a Python-futás (default_rng(20261020)) 100 intervalluma; az újrasorsolás a böngésző saját, rögzített seedű generátorával történik. Szimuláció.</p>
<script>
const D = {"m": [4860.629, 5200.244, 5034.989, 4957.543, 5160.455, 5266.548, 4990.304, 5260.12, 4952.897, 5104.311, 4786.157, 4931.025, 4751.979, 4973.645, 4863.068, 5000.602, 4671.518, 4968.709, 5112.749, 4965.514, 5166.177, 4770.239, 4870.716, 4991.119, 4828.88, 5016.221, 4784.424, 4813.545, 4946.289, 4932.271, 4923.568, 5186.564, 4945.837, 5033.488, 4807.78, 4717.484, 5013.264, 5124.376, 4891.865, 5348.043, 4967.82, 4891.927, 5149.853, 4687.793, 5029.998, 4980.198, 5065.147, 5161.383, 5021.605, 4913.661, 4799.761, 5013.436, 4972.32, 4851.893, 5074.129, 5191.451, 4849.388, 5225.326, 5053.503, 5153.996, 5033.161, 4620.545, 5064.727, 4978.789, 4971.954, 5008.523, 5057.12, 4986.498, 5133.57, 4898.477, 4816.655, 4969.247, 5087.619, 5191.158, 4904.272, 4795.554, 5049.67, 5225.349, 5000.466, 4992.563, 5139.604, 4988.094, 4991.41, 5337.984, 5063.245, 5090.239, 5182.482, 5115.732, 4970.449, 4815.326, 5011.293, 4996.268, 4928.437, 4784.098, 5009.974, 5093.57, 5169.09, 4952.199, 4952.231, 4927.87], "h": [331.224, 343.638, 270.101, 344.693, 256.875, 367.126, 300.512, 350.158, 335.196, 210.904, 327.973, 258.978, 339.849, 333.025, 273.997, 303.285, 303.307, 325.274, 290.493, 302.716, 258.758, 242.705, 366.708, 347.559, 315.09, 267.335, 230.484, 269.784, 230.242, 324.277, 375.591, 258.303, 281.886, 288.133, 319.078, 275.033, 278.28, 297.177, 294.625, 323.361, 297.649, 242.698, 310.476, 242.6, 300.842, 268.276, 357.844, 268.839, 263.265, 348.582, 313.033, 254.234, 308.925, 304.152, 269.514, 312.746, 225.147, 269.047, 293.226, 317.346, 295.772, 352.099, 302.691, 257.674, 343.501, 255.389, 364.146, 355.183, 278.79, 276.619, 326.372, 276.788, 270.762, 264.626, 287.499, 299.492, 256.643, 250.358, 186.592, 310.064, 294.348, 277.144, 306.669, 298.715, 347.334, 241.26, 319.783, 296.093, 307.373, 276.173, 273.515, 295.43, 238.677, 337.164, 280.383, 259.979, 226.412, 293.181, 358.839, 279.473], "crit": 2.045229642132703, "mu": 5000.0, "sig": 800.0, "n": 30};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

let M = D.m.slice(), H = D.h.slice(), total = 0, hits = 0, gen = 0, R0 = rng(12345);
function resample(){ const n = D.n; M = []; H = [];
  for (let r = 0; r < 100; r++) { let s = 0, s2 = 0; const v = []; for (let i = 0; i < n; i++) { const x = D.mu + D.sig * gauss(R0); v.push(x); s += x; }
    const m = s / n; v.forEach(x => s2 += (x - m) ** 2); M.push(m); H.push(D.crit * Math.sqrt(s2 / (n - 1)) / Math.sqrt(n)); }
  gen++; draw(); }
function draw(){
  svg.innerHTML = "";
  const A = Axes(svg, {x: 60, y: 20, w: 660, h: 420, x0: 4200, x1: 5800, y0: -1, y1: 101, xt: [4400, 4600, 4800, 5000, 5200, 5400, 5600], yt: [0, 25, 50, 75, 100],
                       xf: t => String(t).replace(/\B(?=(\d{3})+(?!\d))/g, " "), xl: "95%-os t-konfidenciaintervallum (μ-re)", yl: "ismételt minta", ylo: 40});
  let miss = 0;
  M.forEach((m, i) => { const lo = m - H[i], hi = m + H[i], ok = lo <= D.mu && hi >= D.mu; if (!ok) miss++;
    E(svg, "line", {x1: A.X(Math.max(lo, 4200)), y1: A.Y(i), x2: A.X(Math.min(hi, 5800)), y2: A.Y(i), stroke: ok ? css("--muted") : css("--fg"), "stroke-width": ok ? 1 : 2.4, "stroke-dasharray": ok ? "" : "6 3"});
    if (ok) E(svg, "circle", {cx: A.X(m), cy: A.Y(i), r: 1.8, fill: css("--muted")});
    else E(svg, "text", {x: A.X(m), y: A.Y(i) + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "×"); });
  E(svg, "line", {x1: A.X(D.mu), y1: A.o.y, x2: A.X(D.mu), y2: A.o.y + A.o.h, stroke: css("--hl2"), "stroke-width": 2});
  E(svg, "text", {x: A.X(D.mu) + 5, y: 32, "font-size": 12, fill: css("--hl2")}, "valódi μ = 5000");
  if (gen > 0 && draw.last !== gen) { total += 100; hits += 100 - miss; draw.last = gen; }
  status.textContent = `${gen === 0 ? "Kezdőállapot (a statikus ábra mintái)" : gen + ". újrasorsolás"}: ${100 - miss} intervallum fedi a μ-t, ${miss} nem (vastag szaggatott, ×).` + (total ? ` Az eddigi ${total} böngészős intervallumból ${F(100 * hits / total, 1)}% fedett.` : "");
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
