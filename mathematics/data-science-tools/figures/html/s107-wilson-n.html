<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wilson-intervallum és mintaméret</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--band:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--band:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:4px}
.ctl input[type=range]{flex:1;min-width:120px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label for="p">megfigyelt pontosság:</label><input id="p" type="range" min="0.5" max="0.99" step="0.01" value="0.9" aria-label="Megfigyelt pontosság"><b id="pv"></b>
<label for="t">kiadási küszöb:</label><input id="t" type="range" min="0.5" max="0.98" step="0.01" value="0.85" aria-label="Kiadási küszöb"><b id="tv"></b></div>
<div class="ctl"><label for="n">mintaméret n:</label><input id="n" type="range" min="0" max="1" step="any" value="0.379549" aria-label="Mintaméret (logaritmikus)"><b id="nv"></b>
<button id="r">alaphelyzet (0,90; 0,85; n = 50)</button><button id="b8">demó: n = 8</button><button id="b384">n = 384</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="A Wilson-sáv szűkül a mintamérettel; 8 példánál majdnem teljes, kb. 184 felett az alsó határ a 0,85-ös küszöb fölött van"></svg>
<p class="small">A fejezet wilson_ci függvénye (z = 1,96), a kiemelt pont x = round(pontosság · n) találattal. Szürke sáv: a 95%-os intervallum a pontos arányra (x = pontosság · n) n függvényében;
szaggatott: kiadási küszöb; függőleges pontvonal: az a legkisebb n, amelynél az alsó határ már a küszöb fölött van.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
function wilson(x, n, z = 1.96){ const p = x / n, d = 1 + z*z/n, c = (p + z*z/(2*n)) / d, h = z * Math.sqrt(p*(1-p)/n + z*z/(4*n*n)) / d; return [c - h, c + h]; }
const L = 60, R = 620, T = 14, B = 250, LN0 = Math.log(8), LN1 = Math.log(1000);
const X = n => L + (R - L) * (Math.log(n) - LN0) / (LN1 - LN0), Y = v => B - (B - T) * (v - 0.3) / 0.7;
const nOf = u => Math.round(Math.exp(LN0 + u * (LN1 - LN0)));
function draw(){
  const p = +document.getElementById("p").value, thr = +document.getElementById("t").value, n = nOf(+document.getElementById("n").value);
  document.getElementById("pv").textContent = fmt(p, 2); document.getElementById("tv").textContent = fmt(thr, 2); document.getElementById("nv").textContent = n;
  svg.innerHTML = "";
  [0.3, 0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1].forEach(v => { el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 1)); });
  [8, 12, 20, 50, 100, 200, 500, 1000].forEach(v => el("text", {x: X(v), y: B + 16, "text-anchor": "middle", "font-size": 11}, String(v)));
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "mintaméret n (log)");
  let up = "", dn = "", gate = null;
  for (let m = 8; m <= 1000; m++) { const [a, b] = wilson(p * m, m), ga = wilson(Math.round(p * m), m)[0]; up += (m > 8 ? "L" : "M") + X(m).toFixed(1) + "," + Y(Math.min(1, b)).toFixed(1); dn = "L" + X(m).toFixed(1) + "," + Y(Math.max(0.3, a)).toFixed(1) + dn; if (gate === null && ga > thr) gate = m; }
  el("path", {d: up + dn + "Z", fill: css("--band"), stroke: css("--fg"), "stroke-width": 0.8});
  el("line", {x1: L, y1: Y(p), x2: R, y2: Y(p), stroke: css("--muted"), "stroke-dasharray": "8 3 2 3"});
  el("line", {x1: L, y1: Y(thr), x2: R, y2: Y(thr), stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": "6 4"});
  el("text", {x: R - 4, y: Y(thr) + 14, "text-anchor": "end", "font-size": 11}, "küszöb " + fmt(thr, 2));
  if (gate !== null) { el("line", {x1: X(gate), y1: T, x2: X(gate), y2: B, stroke: css("--hl"), "stroke-dasharray": "2 3", "stroke-width": 1.5}); el("text", {x: X(gate) + 4, y: T + 12, "font-size": 11, fill: css("--hl")}, "n ≥ " + gate); }
  const x = Math.round(p * n), [a, b] = wilson(x, n);
  el("line", {x1: X(n), y1: Y(Math.max(0.3, a)), x2: X(n), y2: Y(Math.min(1, b)), stroke: css("--hl2"), "stroke-width": 3});
  el("circle", {cx: X(n), cy: Y(Math.max(0.3, a)), r: 5.5, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.5});
  el("text", {x: X(n) + 8, y: Y(Math.max(0.3, a)) + 16, "font-size": 11.5, fill: css("--hl2")}, `${x}/${n}: [${fmt(a, 3)}; ${fmt(b, 3)}]`);
  document.getElementById("status").textContent = `${x}/${n} találat: 95%-os Wilson-CI [${fmt(a, 3)}; ${fmt(b, 3)}] → az alsó határ ${a > thr ? "a küszöb fölött: a kapu átengedi" : "a küszöb alatt: kiadásra nem elég"}. ${gate !== null ? "A kapuhoz legalább n = " + gate + " kell (" + fmt(p, 2) + "-es pontosságnál)." : "1000 példáig sem éri el a küszöböt."}`;
}
const U = n => (Math.log(n) - LN0) / (LN1 - LN0);
["p", "t", "n"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("r").onclick = () => { document.getElementById("p").value = 0.9; document.getElementById("t").value = 0.85; document.getElementById("n").value = U(50); draw(); };
document.getElementById("b8").onclick = () => { document.getElementById("n").value = 0; draw(); };
document.getElementById("b384").onclick = () => { document.getElementById("n").value = U(384); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
