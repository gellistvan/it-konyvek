<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikor éri be a klaszter?</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<label>helyi (MB/s) <input id="lr" type="range" min="10" max="500" step="10" value="80"><b id="lrv"></b></label>
<label>feltöltés (MB/s) <input id="ur" type="range" min="5" max="500" step="5" value="25"><b id="urv"></b></label>
<label>startup (s) <input id="st" type="range" min="0" max="1200" step="30" value="300"><b id="stv"></b></label>
<label>worker <input id="w" type="range" min="1" max="64" step="1" value="8"><b id="wv"></b></label>
<label>worker (MB/s) <input id="wr" type="range" min="5" max="200" step="5" value="40"><b id="wrv"></b></label>
<label>futások N <input id="n" type="range" min="1" max="50" step="1" value="10"><b id="nv"></b></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 360" role="img" aria-label="Log–log vonaldiagram a helyi és a klaszteres idő becsléséről a méret függvényében, a metszéspontok jelölésével."></svg>

<p class="small">A fejezet s136_dontesi_lap.py modellje; kezdőértékek: 80 MB/s helyi, 25 MB/s feltöltés, 300 s startup, 8 × 40 MB/s, N = 10. Illusztratív becslés, nem mérés.</p>
<script>
const DATA = {};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="para"){const sk=Math.min(18,w*0.12);dg_mk(g,"polygon",Object.assign({points:`${x+sk},${y} ${x+w},${y} ${x+w-sk},${y+h} ${x},${y+h}`},st));}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

function gb(x){return x>=1e12?(x/1e12).toFixed(2).replace(".",",")+" TB":x>=1e9?(x/1e9).toFixed(1).replace(".",",")+" GB":(x/1e6).toFixed(0)+" MB";}
function draw(){
  const g=id=>+document.getElementById(id).value;
  ["lr","ur","st","w","wr","n"].forEach(id=>document.getElementById(id+"v").textContent=" "+g(id));
  const L=g("lr")*1e6,U=g("ur")*1e6,S=g("st"),CR=g("w")*g("wr")*1e6,N=g("n");
  svg.innerHTML=""; dg_defs(svg);
  const X0=90,X1=760,Y0=330,Y1=20, lx=v=>X0+(Math.log10(v)-8)/4*(X1-X0), ly=v=>Y0-(Math.log10(Math.max(v,0.5))-Math.log10(0.5))/(5-Math.log10(0.5))*(Y0-Y1);
  const fg=dg_css("--fg"), mu=dg_css("--muted");
  [1e8,1e9,1e10,1e11,1e12].forEach((v,i)=>{dg_mk(svg,"line",{x1:lx(v),x2:lx(v),y1:Y1,y2:Y0,stroke:mu,"stroke-dasharray":"2 4"});dg_text(svg,lx(v),Y0+18,["100 MB","1 GB","10 GB","100 GB","1 TB"][i],13);});
  [1,10,100,1e3,1e4,1e5].forEach(v=>{dg_mk(svg,"line",{x1:X0,x2:X1,y1:ly(v),y2:ly(v),stroke:mu,"stroke-dasharray":"2 4"});dg_text(svg,X0-6,ly(v),v>=1e3?"1e"+Math.log10(v):String(v),13,{anchor:"end"});});
  dg_text(svg,20,12,"idő (s), log",13,{anchor:"start"});
  const curves=[[s=>s/L,"","helyi",3],[s=>S+s/CR,"8 5","object store",2],[s=>S+s/U+s/CR,"2 4","+ feltöltés",2.5],[s=>S/N+s/CR,"10 4 2 4",`N = ${N} / futás`,2]];
  const LBL=[];
  curves.forEach(([fn,da,lab,w])=>{let d="";for(let i=0;i<=200;i++){const s=Math.pow(10,8+4*i/200);d+=(i?"L":"M")+lx(s)+" "+ly(fn(s));}
    dg_mk(svg,"path",{d:d,fill:"none",stroke:fg,"stroke-width":w,"stroke-dasharray":da}); LBL.push([ly(fn(1e12)),lab]);});
  LBL.sort((a,b)=>a[0]-b[0]); for(let i=1;i<LBL.length;i++) if(LBL[i][0]-LBL[i-1][0]<16) LBL[i][0]=LBL[i-1][0]+16;
  LBL.forEach(([y,l])=>dg_text(svg,X1+8,y,l,14,{anchor:"start"}));
  const k=1/L-1/CR, out=[];
  if(k>0){const s1=S/k, sN=(S/N)/k; [[s1,"object store"],[sN,`N = ${N}`]].forEach(([x,l])=>{if(x>=1e8&&x<=1e12){dg_mk(svg,"circle",{cx:lx(x),cy:ly(x/L),r:5,fill:fg});}});
    out.push(`object store-ban a klaszter ${gb(S/k)} fölött gyorsabb`, `N = ${N} futásnál futásonként ${gb((S/N)/k)} fölött`);}
  else out.push("a klaszter feldolgozása sem gyorsabb a helyinél: nincs töréspont");
  const ku=1/L-1/U-1/CR; out.push(ku>0?`feltöltéssel ${gb(S/ku)} fölött`:"feltöltéssel soha (a feltöltés lassabb a helyi feldolgozásnál)");
  status.textContent="Töréspontok: "+out.join("; ")+". Illusztratív modell, nem mérés.";
}
["lr","ur","st","w","wr","n"].forEach(id=>document.getElementById(id).addEventListener("input",draw));

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
