<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Számítási gráf: előre- és visszaterjesztés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A gráfban az illeszkedési és a regularizációs ág a veszteségnél egyesül; a visszaterjesztés mindkét ágon elhozza a deriváltat a w és b levelekig; a detach-változatban a w → w·x élen nincs gradiens."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet példája (x = (2; −1; 0,5), y = 1, w = (1; −0,5; 0), b = 0,25, λ = 0,1); a számok a PyTorch 2.15.0+cpu float64 futtatásával egyeznek. Kék szaggatott keret: ∂L/∂(csomópont).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Levelek és bemenet: x = (2; −1; 0,5), w = (1; −0,5; 0), b = 0,25 (requires_grad), y = 1, λ = 0,1.", "line": -1, "f": ["x", "w", "b"], "g": [], "cur": "w", "det": false}, {"msg": "Előre: w·x = 2 + 0,5 + 0 = 2,5", "line": 0, "f": ["x", "w", "b", "dot"], "g": [], "cur": "dot", "det": false}, {"msg": "Előre: ŷ = w·x + b = 2,75", "line": 0, "f": ["x", "w", "b", "dot", "yh"], "g": [], "cur": "yh", "det": false}, {"msg": "Előre: ŷ − y = 1,75", "line": 1, "f": ["x", "w", "b", "dot", "yh", "r"], "g": [], "cur": "r", "det": false}, {"msg": "Előre: (ŷ − y)² = 3,0625", "line": 1, "f": ["x", "w", "b", "dot", "yh", "r", "p2"], "g": [], "cur": "p2", "det": false}, {"msg": "Előre: Σw² + b² = 1 + 0,25 + 0 + 0,0625 = 1,3125", "line": 2, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs"], "g": [], "cur": "rs", "det": false}, {"msg": "Előre: λ·(Σw² + b²) = 0,13125", "line": 2, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl"], "g": [], "cur": "rl", "det": false}, {"msg": "Előre: L = 3,0625 + 0,13125 = 3,19375", "line": 3, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": [], "cur": "L", "det": false}, {"msg": "Vissza: ∂L/∂L = 1", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L"], "cur": "L", "det": false}, {"msg": "Vissza: ∂L/∂pow2 = 1 (az összeadás továbbadja)", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2"], "cur": "p2", "det": false}, {"msg": "Vissza: ∂L/∂(λR) = 1", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl"], "cur": "rl", "det": false}, {"msg": "Vissza: ∂L/∂(ŷ − y) = 2·1,75 = 3,5", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r"], "cur": "r", "det": false}, {"msg": "Vissza: ∂L/∂ŷ = 3,5", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh"], "cur": "yh", "det": false}, {"msg": "Vissza: ∂L/∂(w·x) = 3,5", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh", "dot"], "cur": "dot", "det": false}, {"msg": "Vissza: ∂L/∂(Σw²+b²) = λ = 0,1", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh", "dot", "rs"], "cur": "rs", "det": false}, {"msg": "Vissza: ∂L/∂w = 3,5·x + 0,1·2w = (7; −3,5; 1,75) + (0,2; −0,1; 0) = (7,2; −3,6; 1,75)", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh", "dot", "rs", "w"], "cur": "w", "det": false}, {"msg": "Vissza: ∂L/∂b = 3,5 + 0,1·2·0,25 = 3,55", "line": 4, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh", "dot", "rs", "w", "b"], "cur": "b", "det": false}, {"msg": "Detach-változat: a w → w·x élen nem halad gradiens; w.grad = (0,2; −0,1; 0) (csak 2λw), b.grad = 3,55 változatlan. Hibát nem jelez!", "line": 5, "f": ["x", "w", "b", "dot", "yh", "r", "p2", "rs", "rl", "L"], "g": ["L", "p2", "rl", "r", "yh", "dot", "rs", "w", "b"], "cur": "w", "det": true}];
const CODE = ["y_pred = torch.dot(w, x) + b          # dot, majd + b", "fit_loss = (y_pred - y) ** 2           # − y, pow2", "reg_loss = lam * (torch.sum(w ** 2) + b ** 2)", "loss = fit_loss + reg_loss", "loss.backward()                        # láncszabály visszafelé", "y_pred_bad = torch.dot(w.detach(), x) + b   # detach-változat"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = [["x", "x", 0.0, 3.0, "(2; −1; 0,5)", null, null], ["w", "w", 0.0, 1.75, "(1; −0,5; 0)", "∂L/∂w = (7,2; −3,6; 1,75)", "∂L/∂w = (0,2; −0,1; 0)"], ["b", "b", 0.0, 0.3, "0,25", "∂L/∂b = 3,55", "∂L/∂b = 3,55"], ["dot", "w·x", 2.2, 3.0, "2,5", "3,5", "nincs grad"], ["yh", "+ b", 4.1, 3.0, "ŷ = 2,75", "3,5", "3,5"], ["r", "− y", 6.0, 3.0, "1,75", "3,5", "3,5"], ["p2", "pow2", 7.9, 3.0, "3,0625", "1", "1"], ["rs", "Σw²+b²", 3.4, 0.3, "1,3125", "0,1", "0,1"], ["rl", "× λ", 5.6, 0.3, "0,13125", "1", "1"], ["L", "+", 9.7, 1.65, "L = 3,19375", "1", "1"]], EDGES = [["x", "dot"], ["w", "dot"], ["dot", "yh"], ["b", "yh"], ["yh", "r"], ["r", "p2"], ["p2", "L"], ["w", "rs"], ["b", "rs"], ["rs", "rl"], ["rl", "L"]];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const P = {}; NODES.forEach(n => P[n[0]] = [70 + n[2] * 62, 270 - n[3] * 70]);
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  EDGES.forEach(([u, v]) => {
    const [x0, y0] = P[u], [x1, y1] = P[v], cut = s.det && u === "w" && v === "dot";
    el("line", {x1: x0 + 31, y1: y0, x2: x1 - 33, y2: y1, stroke: cut ? css("--muted") : css("--fg"), "stroke-width": 1.4, "stroke-dasharray": cut ? "3 4" : "", "marker-end": "url(#ah)"});
    if (cut) { const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; el("text", {x: mx, y: my + 7, "text-anchor": "middle", "font-size": 22, "font-weight": "bold", fill: css("--hl2")}, "✗"); }
  });
  NODES.forEach(n => {
    const [id, lab] = n, [x, y] = P[id], leaf = ["x", "w", "b"].includes(id), on = s.f.includes(id), cur = s.cur === id;
    el("rect", {x: x - 31, y: y - 15, width: 62, height: 30, rx: 7, fill: leaf ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1.3});
    el("text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, lab);
    if (on) el("text", {x: x, y: y - 21, "text-anchor": "middle", "font-size": 11}, n[4]);
    const gtxt = s.det ? n[6] : n[5];
    if (s.g.includes(id) && gtxt) {
      const t = el("text", {x: x, y: y + 33, "text-anchor": "middle", "font-size": 11, fill: css("--hl")}, gtxt);
      const bb = t.getBBox(); const r = el("rect", {x: bb.x - 4, y: bb.y - 2, width: bb.width + 8, height: bb.height + 4, fill: "none", stroke: css("--hl"), "stroke-dasharray": "4 3", rx: 4});
    }
  });
  el("text", {x: P["r"][0], y: P["r"][1] - 40, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "y = 1");
  el("text", {x: P["rl"][0] + 50, y: P["rl"][1] - 24, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "λ = 0,1");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
