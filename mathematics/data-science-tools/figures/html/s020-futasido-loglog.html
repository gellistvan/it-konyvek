<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python vs NumPy futásidő</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>c_py (µs): <input id="cpy" type="range" min="0" max="5" step="0.1" value="0" oninput="upd()" aria-label="c_py (µs):"> <span id="cpyv">0</span></label> <label>c_np (µs): <input id="cnp" type="range" min="0" max="20" step="0.1" value="1.0" oninput="upd()" aria-label="c_np (µs):"> <span id="cnpv">1,0</span></label> </div><div class="ctl"><label>a (ns/elem): <input id="ka" type="range" min="10" max="300" step="0.1" value="110.1" oninput="upd()" aria-label="a (ns/elem):"> <span id="kav">110,1</span></label> <label>b (ns/elem): <input id="kb" type="range" min="1" max="50" step="0.01" value="7.01" oninput="upd()" aria-label="b (ns/elem):"> <span id="kbv">7,01</span></label> </div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Log–log ábra: a Python-ciklus és a NumPy mért mediánjai három elemszámra (pontok) és a t = c + a·n modell két egyenese; nagy n-nél a két egyenes közel párhuzamos, kis n-nél a modell szerint n ≈ 10 körül metszik egymást."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Pontok: a fejezet táblázatának mért mediánjai és p25–p75 tartományai (egy gép). Vonalak: elméleti modell, nem mérés; a, b a mediánokra illesztve, c_py = 0, c_np = 1 µs feltételezve.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": -1, "msg": "A fejezet mért mediánjai (pontok, p25–p75 sávval) és a t(n) ≈ c + a·n modell (vonalak). A csúszkákkal a modell paraméterei állíthatók."}, {"k": 1, "line": 0, "msg": ""}, {"k": 2, "line": 1, "msg": ""}];
const CODE = ["t_py(n) ≈ c_py + a·n        # Python-ciklus: elemenként a", "t_np(n) ≈ c_np + b·n        # NumPy: hívási állandó c_np, elemenként b ≪ a", "n* = (c_np − c_py) / (a − b) # ennél kisebb n-re a Python-ciklus gyorsabb"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MN = [2400.0, 24000.0, 240000.0], PYM = {"med": [0.432, 2.564, 26.428], "lo": [0.237, 2.561, 26.326], "hi": [0.569, 2.567, 26.448]}, NPM = {"med": [0.01, 0.147, 1.685], "lo": [0.0096, 0.146, 1.681], "hi": [0.0106, 0.15, 1.689]}, SPD = [43.3, 17.5, 15.7];
function g(id){ return +document.getElementById(id).value; }
function par(){ return {cpy: g("cpy") / 1000, cnp: g("cnp") / 1000, a: g("ka") / 1e6, b: g("kb") / 1e6}; }
function upd(){ ["cpy", "cnp", "ka", "kb"].forEach(id => document.getElementById(id + "v").textContent = (+document.getElementById(id).value).toString().replace(".", ",")); show(k); }
function fmt(v){ return v >= 100 ? v.toFixed(0) : v.toPrecision(2).replace(".", ","); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 700 380");
  const P = par(), L = 70, R = 680, T = 20, B = 330;
  const X = n => L + (Math.log10(n) - 0) / 6 * (R - L), Y = t => B - (Math.log10(t) + 4) / 6 * (B - T);
  for (let e = 0; e <= 6; e++) { el("line", {x1: X(10 ** e), y1: T, x2: X(10 ** e), y2: B, stroke: css("--muted"), "stroke-width": 0.3}); el("text", {x: X(10 ** e), y: B + 16, "text-anchor": "middle", "font-size": 11}, "10^" + e); }
  for (let e = -4; e <= 2; e++) { el("line", {x1: L, y1: Y(10 ** e), x2: R, y2: Y(10 ** e), stroke: css("--muted"), "stroke-width": 0.3}); el("text", {x: L - 6, y: Y(10 ** e) + 4, "text-anchor": "end", "font-size": 11}, "10^" + String(e).replace("-", "−")); }
  el("text", {x: (L + R) / 2, y: 370, "text-anchor": "middle", "font-size": 12}, "n (elemszám, log)");
  el("text", {x: 14, y: 14, "font-size": 12}, "idő (ms, log)");
  const curve = (c, a) => { let d = ""; for (let i = 0; i <= 120; i++) { const n = 10 ** (6 * i / 120), t = Math.max(c + a * n, 1e-4); d += (i ? " L " : "M ") + X(n) + " " + Y(Math.min(t, 100)); } return d; };
  el("path", {d: curve(P.cpy, P.a), fill: "none", stroke: css("--fg"), "stroke-width": s.k === 1 ? 3 : 1.6});
  el("path", {d: curve(P.cnp, P.b), fill: "none", stroke: css("--fg"), "stroke-width": s.k === 1 ? 3 : 1.6, "stroke-dasharray": "7 4"});
  MN.forEach((n, i) => {
    el("line", {x1: X(n), y1: Y(PYM.lo[i]), x2: X(n), y2: Y(PYM.hi[i]), stroke: css("--fg")});
    el("circle", {cx: X(n), cy: Y(PYM.med[i]), r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.6});
    el("rect", {x: X(n) - 5, y: Y(NPM.med[i]) - 5, width: 10, height: 10, fill: css("--fg")});
    el("text", {x: X(n) + 8, y: (Y(PYM.med[i]) + Y(NPM.med[i])) / 2 + 4, "font-size": 11.5}, SPD[i].toFixed(1).replace(".", ",") + "×");
  });
  const ns = (P.cnp - P.cpy) / (P.a - P.b);
  let txt;
  if (P.a > P.b && ns > 1 && ns < 1e6) {
    el("line", {x1: X(ns), y1: T, x2: X(ns), y2: B, stroke: s.k === 2 ? css("--hl2") : css("--fg"), "stroke-dasharray": "2 3", "stroke-width": s.k === 2 ? 2.5 : 1.3});
    el("text", {x: X(ns) + 6, y: Y(0.03), "font-size": 12, fill: s.k === 2 ? css("--hl2") : css("--fg")}, `n* ≈ ${fmt(ns)} (modell)`);
    txt = `n* = (c_np − c_py)/(a − b) ≈ ${fmt(ns)}: ennél kisebb n-re a modellben a Python-ciklus gyorsabb, nagyobbra a NumPy.`;
  } else txt = "Ezekkel a paraméterekkel a modellben nincs fordulópont 1 és 10^6 között.";
  // jelmagyarázat
  el("line", {x1: L + 10, y1: T + 12, x2: L + 40, y2: T + 12, stroke: css("--fg"), "stroke-width": 1.6}); el("text", {x: L + 46, y: T + 16, "font-size": 11}, "Python-ciklus, modell");
  el("line", {x1: L + 10, y1: T + 30, x2: L + 40, y2: T + 30, stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": "7 4"}); el("text", {x: L + 46, y: T + 34, "font-size": 11}, "NumPy, modell");
  el("circle", {cx: L + 25, cy: T + 48, r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.6}); el("text", {x: L + 46, y: T + 52, "font-size": 11}, "Python, mért medián (p25–p75)");
  el("rect", {x: L + 20, y: T + 61, width: 10, height: 10, fill: css("--fg")}); el("text", {x: L + 46, y: T + 70, "font-size": 11}, "NumPy, mért medián");
  status.textContent = s.k === 0 ? STEPS[0].msg : (s.k === 1 ? `Modell: a = ${(P.a * 1e6).toFixed(1).replace(".", ",")} ns/elem, b = ${(P.b * 1e6).toFixed(2).replace(".", ",")} ns/elem, c_py = ${(P.cpy * 1000).toFixed(2).replace(".", ",")} µs, c_np = ${(P.cnp * 1000).toFixed(2).replace(".", ",")} µs. Elméleti modell, nem mérés; a pontok a fejezet mérése.` : txt);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
