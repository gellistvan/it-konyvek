function qnorm(p){const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
 const pl=0.02425;let q,r;if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
function splitCh(ch){const out=[];ch.forEach(c=>{const h=Math.floor(c.length/2);out.push(c.slice(0,h),c.slice(c.length-h));});return out;}
function zscale(ch){const all=[];ch.forEach((c,i)=>c.forEach((v,j)=>all.push([v,i,j])));all.sort((p,q)=>p[0]-q[0]);
 const N=all.length,out=ch.map(c=>new Array(c.length));let i=0;while(i<N){let j=i;while(j+1<N&&all[j+1][0]===all[i][0])j++;const r=(i+j)/2+1;for(let t=i;t<=j;t++)out[all[t][1]][all[t][2]]=qnorm((r-0.375)/(N+0.25));i=j+1;}return out;}
function mean(a){let s=0;a.forEach(v=>s+=v);return s/a.length;}
function vr(a){const m=mean(a);let s=0;a.forEach(v=>s+=(v-m)*(v-m));return s/(a.length-1);}
function rbasic(ch){const n=ch[0].length,W=mean(ch.map(vr)),Bv=n*vr(ch.map(mean));return Math.sqrt(((n-1)/n*W+Bv/n)/W);}
function rhat(ch){const s=splitCh(ch);const flat=[].concat(...s).sort((p,q)=>p-q),N=flat.length,med=N%2?flat[(N-1)/2]:(flat[N/2-1]+flat[N/2])/2;
 return Math.max(rbasic(zscale(s)),rbasic(zscale(s.map(c=>c.map(v=>Math.abs(v-med))))));}
const g=id=>document.getElementById(id);
function draw(){
  const mode=document.querySelector("input[name=md]:checked").value, dl=+g("d").value, sg=+g("s").value;

  const H0=530,HW=210,nb=50,cnt=ch.map(c=>{const h=new Array(nb).fill(0);c.forEach(v=>{const b=Math.max(0,Math.min(nb-1,Math.floor(v*nb)));h[b]++;});return h;});
  const hmax=Math.max(...cnt.map(h=>Math.max(...h)));

  E("line",{x1:H0,x2:H0,y1:Y0,y2:Y0+H,stroke:css("--line")});
  E("line",{x1:H0,x2:H0+HW,y1:py(m),y2:py(m),stroke:css("--line"),"stroke-width":1.6,"stroke-dasharray":"8 4"});
  E("text",{x:H0+HW,y:py(m)-5,"text-anchor":"end","font-size":11},"közös átlag "+hu(m,3));
  E("text",{x:H0+HW/2,y:Y0+H+34,"text-anchor":"middle","font-size":12},"lánconkénti gyakoriság");

  if(mode==="good")msg+=` ESS bulk ≈ ${Math.round(D.E_good)} a 4000 húzásból; az elméleti Beta(7, 10) várható érték 0,412 (= 7/17).`;
  else msg+=` Láncátlagok: ${hu(mean(ch[0]),3)} és ${hu(mean(ch[1]),3)}; ${dl>4*sg?"a közös átlag egyik lánc tartományában sincs benne.":"a láncok átfednek, a közös átlag értelmes összegzés."}`;
  g("status").textContent=msg;
}
