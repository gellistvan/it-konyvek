<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>II. ellenőrző pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="b_adat" aria-pressed="false">adatút</button><button id="b_ki" aria-pressed="false">kimenetek</button><button id="b_pd" aria-pressed="false">két implementáció</button><button id="b_ex" aria-pressed="false">kizárt oszlopok</button><button id="b_k1" aria-pressed="false">sorszám</button><button id="b_k2" aria-pressed="false">lost_customer_join</button><button id="b_k3" aria-pressed="false">lost_item_join</button><button id="b_k4" aria-pressed="false">Σ basket_minor</button><button id="b_k5" aria-pressed="false">Σ quantity_sum</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1110 645" role="img" aria-label="Folyamatábra a három CSV-ből a feature-táblán át a Parquet-ig, JSON-jelentésig és a kontrollokig."></svg>

<p class="small">Sorszámok és kontrollösszegek a lab/data CSV-iből számolva (a fejezet DuckDB-lekérdezésének Python-átirata). Henger = fájl, téglalap = adat/feldolgozás, rombusz = kontroll.</p>
<script>
const DATA = {"D": {"W": 1110, "H": 645, "nodes": [{"id": "cu", "x": 10, "y": 40, "w": 240, "h": 84, "label": "customers.csv\n300 sor", "shape": "cyl", "fs": 20, "dy": 6}, {"id": "or", "x": 10, "y": 200, "w": 240, "h": 84, "label": "orders.csv\n2400 sor", "shape": "cyl", "fs": 20, "dy": 6}, {"id": "it", "x": 10, "y": 360, "w": 240, "h": 84, "label": "order_items.csv\n4796 sor", "shape": "cyl", "fs": 20, "dy": 6}, {"id": "ag", "x": 300, "y": 362, "w": 240, "h": 80, "label": "item_agg\n2400 sor (1/rendelés)", "shape": "rect", "fs": 20}, {"id": "jo", "x": 300, "y": 196, "w": 240, "h": 92, "label": "INNER JOIN\ncustomer_id, order_id", "shape": "rect", "fs": 20, "fill": "g"}, {"id": "fe", "x": 590, "y": 196, "w": 250, "h": 92, "label": "orders_features\n2400 sor, 11 oszlop", "shape": "rect", "fs": 20, "double": true, "bold": true}, {"id": "pq", "x": 890, "y": 40, "w": 210, "h": 84, "label": "orders_features\n.parquet", "shape": "cyl", "fs": 20, "dy": 6}, {"id": "js", "x": 890, "y": 196, "w": 210, "h": 92, "label": "data_quality_\nreport.json\n+ parquet_sha256", "shape": "cyl", "fs": 19, "dy": 6}, {"id": "pd", "x": 590, "y": 362, "w": 250, "h": 80, "label": "pandas: független\nújraszámolás\n(a 3 CSV-ből)", "shape": "rect", "fs": 20}, {"id": "af", "x": 890, "y": 346, "w": 210, "h": 112, "label": "assert_frame_\nequal", "shape": "diamond", "fs": 19}, {"id": "ex", "x": 10, "y": 486, "w": 250, "h": 148, "label": "", "shape": "frame", "ls": "dash"}, {"id": "kf", "x": 300, "y": 486, "w": 800, "h": 148, "label": "", "shape": "frame"}, {"id": "k1", "x": 316, "y": 526, "w": 24, "h": 24, "label": "", "shape": "diamond", "lw": 1.4}, {"id": "k2", "x": 316, "y": 558, "w": 24, "h": 24, "label": "", "shape": "diamond", "lw": 1.4}, {"id": "k3", "x": 316, "y": 590, "w": 24, "h": 24, "label": "", "shape": "diamond", "lw": 1.4}, {"id": "k4", "x": 716, "y": 526, "w": 24, "h": 24, "label": "", "shape": "diamond", "lw": 1.4}, {"id": "k5", "x": 716, "y": 558, "w": 24, "h": 24, "label": "", "shape": "diamond", "lw": 1.4}], "edges": [{"id": "e1", "pts": [[250, 82], [420, 82], [420, 196]], "label": ""}, {"id": "e2", "pts": [[250, 242], [300, 242]], "label": ""}, {"id": "e3", "pts": [[250, 402], [300, 402]], "label": ""}, {"id": "e4", "pts": [[420, 362], [420, 288]], "label": ""}, {"id": "e5", "pts": [[540, 242], [590, 242]], "label": ""}, {"id": "e6", "pts": [[715, 196], [715, 82], [890, 82]], "label": "DuckDB COPY", "lx": 800, "ly": 64, "fs": 18}, {"id": "e7", "pts": [[840, 242], [890, 242]], "label": ""}, {"id": "e8", "pts": [[840, 402], [890, 402]], "label": ""}, {"id": "e9", "pts": [[995, 124], [995, 196]], "label": "SHA-256", "lx": 1052, "ly": 160, "fs": 18}, {"id": "e10", "pts": [[995, 346], [995, 288]], "label": "ok", "lx": 1022, "ly": 317, "fs": 18}, {"id": "e11", "pts": [[810, 288], [936, 373]], "label": "összevetés", "ls": "dash", "lx": 900, "ly": 318, "fs": 17}], "texts": [{"x": 22, "y": 500, "s": "kizárva (szivárgás):", "fs": 19, "ha": "left", "va": "top", "bold": true}, {"x": 22, "y": 530, "s": "delivery_days", "fs": 19, "ha": "left", "va": "top"}, {"x": 22, "y": 555, "s": "actual_delivery_at", "fs": 19, "ha": "left", "va": "top"}, {"x": 22, "y": 580, "s": "label_available_at", "fs": 19, "ha": "left", "va": "top"}, {"x": 22, "y": 605, "s": "target_late", "fs": 19, "ha": "left", "va": "top"}, {"x": 312, "y": 500, "s": "kontrollok (rombusz = ellenőrzés):", "fs": 19, "ha": "left", "va": "top", "bold": true}, {"x": 350, "y": 538, "s": "sorszám: 2400 = 2400", "fs": 19, "ha": "left"}, {"x": 350, "y": 570, "s": "lost_customer_join = 0", "fs": 19, "ha": "left"}, {"x": 350, "y": 602, "s": "lost_item_join = 0", "fs": 19, "ha": "left"}, {"x": 750, "y": 538, "s": "Σ basket_minor = Σ line_total", "fs": 19, "ha": "left"}, {"x": 750, "y": 570, "s": "Σ quantity_sum = Σ quantity", "fs": 19, "ha": "left"}]}, "info": [{"id": "adat", "label": "adatút", "hl": ["cu", "or", "it", "ag", "jo", "fe", "e1", "e2", "e3", "e4", "e5"], "msg": "Adatút: a 4796 tételsort előbb rendelésenként aggregáljuk (item_agg, 2400 sor), majd az orders (2400) és a customers (300) táblával INNER JOIN-oljuk; az eredmény 2400 sor, 11 oszlop – egy sor rendelésenként."}, {"id": "ki", "label": "kimenetek", "hl": ["fe", "pq", "js", "e6", "e9"], "msg": "Kimenetek: a DuckDB COPY Parquetbe írja a táblát (ZSTD), a jelentés JSON tartalmazza a kontrollokat és a Parquet SHA-256 ujjlenyomatát."}, {"id": "pd", "label": "két implementáció", "hl": ["pd", "af", "fe", "e8", "e11", "e10", "e7"], "msg": "Két független implementáció: a pandas ugyanabból a három CSV-ből újraszámolja a táblát, az assert_frame_equal order_id szerint rendezve hasonlítja össze a DuckDB-kimenettel."}, {"id": "ex", "label": "kizárt oszlopok", "hl": ["ex"], "msg": "Kizárt oszlopok: delivery_days, actual_delivery_at, label_available_at, target_late – ezek a rendelés pillanatában még nem ismertek (a célváltozóhoz tartoznak), bevételük szivárgás lenne."}, {"id": "k1", "label": "sorszám", "hl": ["k1", "kf"], "msg": "Kimeneti sorszám = forrás-rendelésszám: 2400 = 2400, és 2400 egyedi order_id (egy sor rendelésenként)."}, {"id": "k2", "label": "lost_customer_join", "hl": ["k2", "kf"], "msg": "lost_customer_join = 0: minden rendelés customer_id-ja megvan a customers.csv 300 ügyfele között."}, {"id": "k3", "label": "lost_item_join", "hl": ["k3", "kf"], "msg": "lost_item_join = 0: minden rendeléshez van legalább egy tételsor (item_agg 2400 sor)."}, {"id": "k4", "label": "Σ basket_minor", "hl": ["k4", "kf"], "msg": "Σ basket_minor = Σ line_total_minor = 97 383 149 (minor egység, egész – nulla tűrés)."}, {"id": "k5", "label": "Σ quantity_sum", "hl": ["k5", "kf"], "msg": "Σ quantity_sum = Σ quantity = 11 925."}]};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let cur = null;
function draw(){
  const it = DATA.info.find(x => x.id === cur);
  dg_draw(svg, DATA.D, new Set(it ? it.hl : []));
  DATA.info.forEach(x => document.getElementById("b_" + x.id).setAttribute("aria-pressed", String(x.id === cur)));
  status.textContent = it ? it.msg : "Válassz egy nézetet vagy kontrollt: a kapcsolódó elemek kiemelve jelennek meg. Kiinduló állapot: a teljes folyamat (mint a statikus ábrán).";
}
DATA.info.forEach(x => document.getElementById("b_" + x.id).addEventListener("click", () => { cur = (cur === x.id ? null : x.id); draw(); }));

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
