<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Git három területe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három doboz balról jobbra (working tree, index, HEAD), köztük a git add és a git commit nyila, visszafelé a git restore és a git switch, felül a három git diff kettős nyila; alul a három állapot táblázata."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function dgDark(){ return matchMedia("(prefers-color-scheme: dark)").matches; }
function dgFill(f){
  const L = {w: css("--cell"), g: dgDark() ? "#333" : "#e8e8e8", d: dgDark() ? "#4a4a4a" : "#c8c8c8", k: dgDark() ? "#888" : "#555"};
  return L[f] || f;
}
const DG_DASH = {"-": "", "--": "5 3", ":": "1.2 2.2", "-.": "5 2.5 1.2 2.5"};
function dgText(x, y, t, o){
  const lines = String(t).split("\n"), n = lines.length, lh = 1.25 * o.size;
  let y0 = y - (n - 1) * lh / 2;
  if (o.va === "top") y0 = y + o.size * 0.8; else if (o.va === "bottom") y0 = y - (n - 1) * lh - o.size * 0.25;
  const a = {x: x, "text-anchor": o.anchor, "font-size": o.size, "dominant-baseline": (o.va === "top" || o.va === "bottom") ? "auto" : "central"};
  let st = o.mono ? "font-family:ui-monospace,Menlo,Consolas,monospace;" : "";
  if (o.bold) st += "font-weight:bold;";
  if (o.italic) st += "font-style:italic;";
  if (st) a.style = st;
  if (o.fill) a.fill = o.fill;
  if (o.bg) {
    const w = Math.max(...lines.map(l => l.length)) * o.size * (o.mono ? 0.62 : 0.55) + 4, h = n * lh;
    const bx = o.anchor === "middle" ? x - w / 2 : (o.anchor === "end" ? x - w : x - 2);
    const by = (o.va === "top" || o.va === "bottom") ? y0 - o.size * 0.9 : y0 - lh / 2;
    el("rect", {x: bx, y: by, width: w, height: h, fill: css("--bg"), rx: 2});
  }
  const e = el("text", a);
  lines.forEach((l, i) => { const ts = document.createElementNS(NS, "tspan"); ts.setAttribute("x", x); ts.setAttribute("y", y0 + i * lh); ts.textContent = l; e.appendChild(ts); });
  return e;
}
function dgHead(a, b, hl, hw, col){
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  const bx = b[0] - ux * hl, by = b[1] - uy * hl;
  el("polygon", {points: `${b[0]},${b[1]} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}`, fill: col});
}
function dgShort(a, b, d){ const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1; return [b[0] - (b[0] - a[0]) * d / L, b[1] - (b[1] - a[1]) * d / L]; }
function drawDiag(D, s){
  s = s || {};
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${D.W} ${D.H}`);
  const S = D.S, hl = new Set(s.hl || []), hide = new Set(s.hide || []), tx = s.tx || {};
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="dgh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="0.8"/></pattern>`;
  svg.appendChild(defs);
  const order = {edge: 0, box: 1, text: 2};
  const items = D.items.slice().sort((p, q) => order[p.k] - order[q.k]);
  for (const it of items) {
    if (hide.has(it.id)) continue;
    const on = hl.has(it.id), col = on ? css("--hl2") : css("--line");
    if (it.k === "box") {
      const sw = it.lw * S * (on ? 2.4 : 1), dash = (DG_DASH[it.ls] || "").split(" ").filter(Boolean).map(v => v * S).join(" ");
      const common = {fill: dgFill(it.fill), stroke: col, "stroke-width": sw};
      if (dash) common["stroke-dasharray"] = dash;
      let shp;
      if (it.shape === "round") shp = el("rect", Object.assign({x: it.x, y: it.y, width: it.w, height: it.h, rx: Math.min(8 * S, it.h / 3)}, common));
      else if (it.shape === "rect") shp = el("rect", Object.assign({x: it.x, y: it.y, width: it.w, height: it.h}, common));
      else if (it.shape === "diamond") shp = el("polygon", Object.assign({points: `${it.x + it.w / 2},${it.y} ${it.x + it.w},${it.y + it.h / 2} ${it.x + it.w / 2},${it.y + it.h} ${it.x},${it.y + it.h / 2}`}, common));
      if (shp && it.hatch) {
        const c2 = Object.assign({}, common, {fill: "url(#dgh)"});
        if (it.shape === "diamond") el("polygon", Object.assign({points: shp.getAttribute("points")}, c2));
        else el("rect", Object.assign({x: it.x, y: it.y, width: it.w, height: it.h, rx: it.shape === "round" ? Math.min(8 * S, it.h / 3) : 0}, c2));
      }
      const t = (it.id in tx) ? tx[it.id] : it.t;
      if (t) dgText(it.ha === "center" ? it.x + it.w / 2 : it.x + 6 * S, it.y + it.h / 2, t,
        {anchor: it.ha === "center" ? "middle" : "start", size: it.fs * S, mono: it.mono, bold: it.bold || on, italic: it.it,
         fill: it.fill === "k" ? "#fff" : undefined});
    } else if (it.k === "edge") {
      const sw = it.lw * S * (on ? 2.2 : 1), hlen = 7.5 * S * (on ? 1.15 : 1), hw = 3.0 * S * (on ? 1.15 : 1);
      const P = it.pts.map(p => p.slice()), L = P.slice();
      if (it.head === "end" || it.head === "both") L[L.length - 1] = dgShort(P[P.length - 2], P[P.length - 1], hlen * 0.9);
      if (it.head === "start" || it.head === "both") L[0] = dgShort(P[1], P[0], hlen * 0.9);
      const a = {points: L.map(p => p.join(",")).join(" "), fill: "none", stroke: col, "stroke-width": sw};
      const dash = (DG_DASH[it.ls] || "").split(" ").filter(Boolean).map(v => v * S).join(" ");
      if (dash) a["stroke-dasharray"] = dash;
      el("polyline", a);
      if (it.head === "end" || it.head === "both") dgHead(P[P.length - 2], P[P.length - 1], hlen, hw, col);
      if (it.head === "start" || it.head === "both") dgHead(P[1], P[0], hlen, hw, col);
      const lab = (it.id in tx) ? tx[it.id] : it.lab;
      if (lab) dgText(it.lx, it.ly, lab, {anchor: it.lha === "center" ? "middle" : (it.lha === "left" ? "start" : "end"),
        size: it.lfs * S, mono: it.lmono, bold: on, italic: it.lit, bg: it.lbg, fill: on ? css("--hl2") : undefined});
    } else {
      const t = (it.id in tx) ? tx[it.id] : it.t;
      if (!t) continue;
      dgText(it.x, it.y, t, {anchor: it.ha === "center" ? "middle" : (it.ha === "left" ? "start" : "end"), va: it.va,
        size: it.fs * S, mono: it.mono, bold: it.bold || on, italic: it.it, bg: it.bg,
        fill: on ? css("--hl2") : (it.mu ? css("--muted") : undefined)});
    }
  }
}

function render(s){ drawDiag(DIAG, s); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
