<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutoff-idővonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>cutoff c: <input id="cs" type="range" min="0" max="1056" step="6" value="720" oninput="setC(this.value)" aria-label="cutoff időpontja" style="width:260px"></label> <span id="cv">05-01 00:00</span> <button onclick="document.getElementById('cs').value=720;setC(720)">eredeti cutoff</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három vízszintes szakasz egy időtengelyen a május 1-i cutoff függőleges vonalával; az első a vonal előtt ér véget (train), a második átnyúlik rajta (purgatory), a harmadik teljesen utána van (test)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet split_label szabálya (1. és 2. feladat); az időpontok UTC-ben. A cutoff csúszkája 6 órás lépésű; a besorolást ugyanaz a szabály számolja újra.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"r": -1, "line": -1, "msg": "Három rendelés és a cutoff (05-01 00:00): csak az a sor tanítható, amelynek a rendelése ÉS a címkéje is a cutoff előtt van. A csúszkával a cutoff mozgatható."}, {"r": 0, "line": 4, "msg": ""}, {"r": 1, "line": 5, "msg": ""}, {"r": 2, "line": 2, "msg": ""}];
const CODE = ["def split_label(order_ts, label_available_at, cutoff):", "    if order_ts >= cutoff:", "        return \"test\"", "    if label_available_at < cutoff:", "        return \"train\"", "    return \"purgatory\""];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ROWS = [{"k": "a", "o": 225.0, "l": 474.0, "os": "04-10 09:00", "ls": "04-20 18:00", "cls": "train"}, {"k": "b", "o": 657.0, "l": 810.0, "os": "04-28 09:00", "ls": "05-04 18:00", "cls": "purgatory"}, {"k": "c", "o": 753.0, "l": 954.0, "os": "05-02 09:00", "ls": "05-10 18:00", "cls": "test"}], END = 1056.0, T0 = Date.UTC(2025, 3, 1);
let C = 720.0;
function hs(hh){ const d = new Date(T0 + hh * 3600e3); return `${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")} ${String(d.getUTCHours()).padStart(2, "0")}:00`; }
function cls(r){ if (r.o >= C) return "test"; if (r.l < C) return "train"; return "purgatory"; }
const NM = {train: "train (tanítható)", purgatory: "purgatory (kihagyott határsáv)", test: "test"};
const LN = {test: 2, train: 4, purgatory: 5};
function setC(v){ C = +v; document.getElementById("cv").textContent = hs(C); setSteps([STEPS0[0]].concat(ROWS.map((r, i) => ({r: i, line: LN[cls(r)], msg: ""})))); }
const STEPS0 = STEPS.slice();
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 290");
  if (s.r >= 0) { const q = ROWS[s.r], c = cls(q); STEPS[k].line = LN[c];
    status.textContent = `(${q.k}) rendelés ${hs(q.o)}, címke ${hs(q.l)}; cutoff ${hs(C)}: order_ts ${q.o < C ? "<" : "≥"} c, label_available_at ${q.l < C ? "<" : "≥"} c → ${NM[c]}.`;
    codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on")); const L = document.getElementById("L" + LN[c]); if (L) L.classList.add("on"); }
  const X = t => 20 + t / END * 680, yr = i => 58 + i * 60;
  el("rect", {x: X(0), y: 30, width: X(C) - X(0), height: 200, fill: css("--cell")});
  el("rect", {x: X(C), y: 30, width: X(END) - X(C), height: 200, fill: css("--cellhl")});
  el("text", {x: (X(0) + X(C)) / 2, y: 46, "text-anchor": "middle", "font-size": 12, style: "font-style:italic"}, "a cutoff előtt");
  el("text", {x: (X(C) + X(END)) / 2, y: 46, "text-anchor": "middle", "font-size": 12, style: "font-style:italic"}, "a cutoff után");
  el("line", {x1: X(C), y1: 30, x2: X(C), y2: 236, stroke: css("--line"), "stroke-width": 2.5});
  ROWS.forEach((r, i) => {
    const y = yr(i) + 20, on = i === s.r, c = cls(r), col = on ? css("--hl2") : css("--fg");
    el("line", {x1: X(r.o), y1: y, x2: X(r.l), y2: y, stroke: col, "stroke-width": on ? 5 : 3});
    el("circle", {cx: X(r.o), cy: y, r: 7, fill: css("--bg"), stroke: col, "stroke-width": 2});
    el("rect", {x: X(r.l) - 7, y: y - 7, width: 14, height: 14, fill: col});
    el("text", {x: X(r.o), y: y - 12, "text-anchor": "middle", "font-size": 10.5}, hs(r.o));
    el("text", {x: X(r.l), y: y - 12, "text-anchor": "middle", "font-size": 10.5}, hs(r.l));
    const lt = `(${r.k}) ${NM[c]}`, lw = lt.length * 7.2;
    el("rect", {x: (X(r.o) + X(r.l)) / 2 - lw / 2, y: y + 13, width: lw, height: 18, rx: 3, fill: css("--bg"), stroke: col, "stroke-width": 0.8});
    el("text", {x: (X(r.o) + X(r.l)) / 2, y: y + 26, "text-anchor": "middle", "font-size": 12.5, style: "font-weight:bold", fill: col}, `(${r.k}) ${NM[c]}`);
  });
  el("rect", {x: X(C) - 52, y: 52, width: 104, height: 18, fill: css("--bg"), stroke: css("--line")});
  el("text", {x: X(C), y: 66, "text-anchor": "middle", "font-size": 12, style: "font-weight:bold"}, `c = ${hs(C)}`);
  ["2025-04-01", "2025-04-10", "2025-04-20", "2025-05-01", "2025-05-10", "2025-05-15"].forEach(t => {
    const hh = (Date.UTC(2025, +t.slice(5, 7) - 1, +t.slice(8)) - T0) / 3600e3;
    el("line", {x1: X(hh), y1: 230, x2: X(hh), y2: 236, stroke: css("--line")});
    el("text", {x: X(hh), y: 272, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, t.slice(5));
  });
  el("circle", {cx: 30, cy: 282, r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5});
  el("text", {x: 40, y: 286, "font-size": 10.5}, "order_ts");
  el("rect", {x: 110, y: 277, width: 10, height: 10, fill: css("--fg")});
  el("text", {x: 126, y: 286, "font-size": 10.5}, "label_available_at");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
