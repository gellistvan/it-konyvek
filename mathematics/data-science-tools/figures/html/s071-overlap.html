   `stabilizált IPW ATE = ${hu(r.ate,3)} (valódi: 1,0), ESS kontroll ${Math.round(r.ess0)}, kezelt ${Math.round(r.ess1)}. Legnagyobb p̂: kontroll ${hu(m0,3)}, kezelt ${hu(m1,4)}.`+
   (key==="bad"&&lo>0?" A trimmelés után a becslés már csak az átfedő populációra vonatkozik.":"");
}
document.querySelectorAll("input[name=cs]").forEach(e=>e.addEventListener("change",draw));
document.getElementById("tr").addEventListener("input",draw);
draw();
