<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simpson-jelenség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label><input type="checkbox" id="ca" checked onchange="draw()"> A csoport</label><label><input type="checkbox" id="cb" checked onchange="draw()"> B csoport</label><label>B eltolása s: <input id="s" type="range" min="0" max="6" step="0.5" value="3" oninput="draw()" style="width:200px" aria-label="B eltolása s:"> <output id="sv"></output></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 440" role="img" aria-label="Hat pont két csoportban; mindkét csoportban csökkenő egyenes, az összes pontra emelkedő egyenes; a B csoport eltolása és a csoportok ki-be kapcsolása az összevont korrelációt változtatja."></svg>
<p class="small">Kezdőállapot: a fejezet hat pontja (s = 3), összevont r = +0,543. Az s = 0 eltolásnál a két csoport egybeesik, így az összevont r is −1: a fordulást a csoportok közti átlageltolódás okozza.</p>
<script>
const D = {"A": [[1.0, 3.0], [2.0, 2.0], [3.0, 1.0]]};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function corr(P){ const n = P.length, mx = P.reduce((a, p) => a + p[0], 0) / n, my = P.reduce((a, p) => a + p[1], 0) / n;
  let sxy = 0, sxx = 0, syy = 0; P.forEach(p => { sxy += (p[0] - mx) * (p[1] - my); sxx += (p[0] - mx) ** 2; syy += (p[1] - my) ** 2; });
  return {r: sxy / Math.sqrt(sxx * syy), b: sxy / sxx, mx: mx, my: my}; }
function draw(){
  const s = val("s"); show("sv", F(s, 1));
  const showA = document.getElementById("ca").checked, showB = document.getElementById("cb").checked;
  const A = D.A, B = D.A.map(p => [p[0] + s, p[1] + s]);
  svg.innerHTML = "";
  const X = Axes(svg, {x: 60, y: 20, w: 380, h: 380, x0: 0, x1: 10, y0: 0, y1: 10, xt: [0, 2, 4, 6, 8, 10], yt: [0, 2, 4, 6, 8, 10], xl: "x", yl: "y", ylo: 34, grid: true});
  const pts = (showA ? A : []).concat(showB ? B : []);
  if (pts.length >= 2) { const c = corr(pts); path(svg, X, [0.3, 9.7], [c.my + c.b * (0.3 - c.mx), c.my + c.b * (9.7 - c.mx)], {"stroke-width": 3, "stroke-dasharray": "9 5"}); }
  [[A, showA, "A"], [B, showB, "B"]].forEach(g => { if (!g[1]) return; const c = corr(g[0]);
    path(svg, X, [g[0][0][0] - 0.4, g[0][2][0] + 0.4], [c.my + c.b * (g[0][0][0] - 0.4 - c.mx), c.my + c.b * (g[0][2][0] + 0.4 - c.mx)], {stroke: css("--muted"), "stroke-width": 1.2});
    g[0].forEach(p => { if (g[2] === "A") E(svg, "circle", {cx: X.X(p[0]), cy: X.Y(p[1]), r: 7, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
      else E(svg, "rect", {x: X.X(p[0]) - 7, y: X.Y(p[1]) - 7, width: 14, height: 14, fill: css("--fill2"), stroke: css("--fg"), "stroke-width": 2}); }); });
  let msg;
  if (pts.length === 6) { const c = corr(pts); msg = `Összevonva r = ${c.r >= 0 ? "+" : ""}${F(c.r, 3)}, meredekség ${F(c.b, 3)}; csoporton belül mindkét csoportban r = −1.`; }
  else if (pts.length === 3) msg = "Egy csoport: r = −1 (tökéletesen csökkenő).";
  else msg = "Nincs kiválasztott csoport.";
  let y = 60; const T = (t, o) => { E(svg, "text", Object.assign({x: 480, y: y, "font-size": 13}, o || {}), t); y += 22; };
  T("○ A csoport: (1;3), (2;2), (3;1)"); T("□ B csoport: A + (" + F(s, 1) + "; " + F(s, 1) + ")");
  T("vékony vonal: csoporton belüli egyenes", {fill: css("--muted"), "font-size": 12});
  T("vastag szaggatott: összevont egyenes", {fill: css("--muted"), "font-size": 12});
  y += 10; if (pts.length === 6) { const c = corr(pts); T("összevont r = " + (c.r >= 0 ? "+" : "") + F(c.r, 3), {"font-weight": "bold"}); }
  T("csoporton belül r = −1");
  status.textContent = msg + (s === 3 ? " (a fejezet példája)" : "");
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
