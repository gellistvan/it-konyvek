<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-to-many join: sortöbbszöröződés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>tételszám s<sub>i</sub>: <input id="si" type="range" min="1" max="5" step="1" value="3" oninput="reset()" aria-label="Tételszám" style="width:110px"> <b id="siv">3</b></label> <label>szállítási díj f<sub>i</sub> (cent): <input id="fi" type="range" min="0" max="1500" step="50" value="500" oninput="reset()" aria-label="Szállítási díj" style="width:140px"> <b id="fiv">500</b></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy három tételes rendelés szállítási díja a tételszintű joinban háromszor jelenik meg; az aggregálás a join előtt rendelésenként egy sort ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kézi példa (f = 500 cent, s = 3 tétel) és a labor adatai (lab/data: orders 2400, order_items 4796 sor, rendelésenként 1–3 tétel); a csúszkák a kézi példát változtatják.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "s": 3, "f": 500, "line": -1, "msg": "Kiindulás: az orders táblában az O1 rendelés egy sor (shipping_fee_minor = 500), az order_items-ben 3 tételsora van."}, {"ph": 1, "s": 3, "f": 500, "line": 0, "msg": "Rossz: tételszintű join – az O1 3 sorban jelenik meg, mindegyikben shipping_fee_minor = 500 (fan-out × 3)."}, {"ph": 2, "s": 3, "f": 500, "line": 1, "msg": "Rossz összeg: SUM(shipping_fee_minor) = 3 · 500 = 1500 cent a helyes 500 helyett ✗."}, {"ph": 3, "s": 3, "f": 500, "line": 2, "msg": "Helyes: előbb GROUP BY order_id – a 3 tételsorból 1 aggregált sor (agg_quantity, agg_basket_minor, agg_item_rows)."}, {"ph": 4, "s": 3, "f": 500, "line": 3, "msg": "Helyes: a rendelésszintű aggregátum joinja – rendelésenként pontosan 1 sor."}, {"ph": 5, "s": 3, "f": 500, "line": 4, "msg": "Helyes összeg: SUM(shipping_fee_minor) = 500 cent ✓ (a kontroll: SUM(mart) = SUM(orders))."}, {"ph": 6, "s": 3, "f": 500, "line": 4, "msg": "A labor adatán: orders 2400 sor, order_items 4796 sor → a rossz mart 4796 sor, a helyes 2400; Σ shipping 3 380 004 vs. 1 690 200 cent."}];
const CODE = ["-- rossz: orders o LEFT JOIN order_items i USING (order_id)", "SELECT SUM(o.shipping_fee_minor) ...      -- tételszintű sorokon: s · f", "WITH item_agg AS (SELECT order_id, COUNT(*) AS agg_item_rows ... GROUP BY order_id)", "-- helyes: orders o LEFT JOIN item_agg a USING (order_id)", "SELECT SUM(shipping_fee_minor) FROM mart  -- = SUM(orders.shipping_fee_minor)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LABN = {"ord": 2400, "itm": 4796, "bad": 4796, "sok": 1690200, "sbad": 3380004};
function genSteps(s, f){
  const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return [
    {ph: 0, s: s, f: f, line: -1, msg: `Kiindulás: az orders táblában az O1 rendelés egy sor (shipping_fee_minor = ${f}), az order_items-ben ${s} tételsora van.`},
    {ph: 1, s: s, f: f, line: 0, msg: `Rossz: tételszintű join – az O1 ${s} sorban jelenik meg, mindegyikben shipping_fee_minor = ${f} (fan-out × ${s}).`},
    {ph: 2, s: s, f: f, line: 1, msg: `Rossz összeg: SUM(shipping_fee_minor) = ${s} · ${f} = ${s * f} cent a helyes ${f} helyett ✗.`},
    {ph: 3, s: s, f: f, line: 2, msg: `Helyes: előbb GROUP BY order_id – a ${s} tételsorból 1 aggregált sor (agg_quantity, agg_basket_minor, agg_item_rows).`},
    {ph: 4, s: s, f: f, line: 3, msg: "Helyes: a rendelésszintű aggregátum joinja – rendelésenként pontosan 1 sor."},
    {ph: 5, s: s, f: f, line: 4, msg: `Helyes összeg: SUM(shipping_fee_minor) = ${f} cent ✓ (a kontroll: SUM(mart) = SUM(orders)).`},
    {ph: 6, s: s, f: f, line: 4, msg: `A labor adatán: orders ${LABN.ord} sor, order_items ${LABN.itm} sor → a rossz mart ${LABN.bad} sor, a helyes ${LABN.ord}; Σ shipping ${fmtN(LABN.sbad)} vs. ${fmtN(LABN.sok)} cent.`}];
}
function reset(){ const s = +document.getElementById("si").value, f = +document.getElementById("fi").value;
  document.getElementById("siv").textContent = s; document.getElementById("fiv").textContent = f; setSteps(genSteps(s, f)); }
function tbl(x, y, cols, rows, ws, bold){
  let xx = x; const rh = 22;
  cols.forEach((c, j) => { el("rect", {x: xx, y: y, width: ws[j], height: rh, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: xx + ws[j] / 2, y: y + 15, "text-anchor": "middle", "font-size": 11, style: "font-family:ui-monospace,monospace"}, c);
    rows.forEach((r, i) => { el("rect", {x: xx, y: y + (i + 1) * rh, width: ws[j], height: rh, fill: css("--cell"), stroke: css("--line")});
      el("text", {x: xx + ws[j] / 2, y: y + (i + 1) * rh + 15, "text-anchor": "middle", "font-size": 11.5, "font-weight": j === bold ? "bold" : "normal", style: "font-family:ui-monospace,monospace"}, String(r[j])); });
    xx += ws[j]; });
  return y + (rows.length + 1) * rh;
}
function render(st){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 " + (190 + 44 * st.s));
  const s = st.s, f = st.f, ph = st.ph, items = Array.from({length: s}, (_, k) => ["O1", k + 1]);
  el("rect", {x: 4, y: 4, width: 370, height: 150 + 44 * s, fill: "none", stroke: css("--line"), "stroke-width": ph >= 1 && ph <= 2 ? 3 : 1.5, "stroke-dasharray": "8 5"});
  el("text", {x: 14, y: 24, "font-size": 14, "font-weight": "bold"}, "✗ rossz: tételszintű join");
  el("rect", {x: 386, y: 4, width: 370, height: 150 + 44 * s, fill: "none", stroke: css("--line"), "stroke-width": ph >= 3 && ph <= 5 ? 3 : 1.5});
  el("text", {x: 396, y: 24, "font-size": 14, "font-weight": "bold"}, "✓ helyes: aggregálás a join előtt");
  tbl(14, 36, ["order_id", "shipping"], [["O1", f]], [80, 80], -1);
  el("text", {x: 182, y: 58, "font-size": 18}, "⋈");
  tbl(204, 36, ["order_id", "line_id"], items, [80, 70], -1);
  if (ph >= 1) { const y0 = 50 + 22 * (s + 1);
    el("text", {x: 100, y: y0, "font-size": 12, "font-style": "italic", fill: css("--hl2")}, `fan-out × ${s}`);
    const yb = tbl(60, y0 + 8, ["order_id", "line_id", "shipping"], items.map(r => [r[0], r[1], f]), [80, 70, 90], 2);
    if (ph >= 2) el("text", {x: 60, y: yb + 22, "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, `SUM = ${s} · ${f} = ${s * f} ✗`); }
  if (ph >= 3) { tbl(396, 36, ["order_id", "line_id"], items, [80, 70], -1);
    el("text", {x: 556, y: 52, "font-size": 11}, "GROUP BY →");
    tbl(630, 36, ["order_id", "rows"], [["O1", s]], [64, 56], -1); }
  if (ph >= 4) { const y0 = 50 + 22 * (s + 1);
    el("text", {x: 440, y: y0, "font-size": 12, "font-style": "italic"}, "orders ⋈ aggregátum: 1 sor");
    const yb = tbl(440, y0 + 8, ["order_id", "rows", "shipping"], [["O1", s, f]], [80, 60, 90], 2);
    if (ph >= 5) el("text", {x: 440, y: yb + 22, "font-size": 14, "font-weight": "bold", fill: css("--hl")}, `SUM = ${f} ✓`); }
  if (ph >= 6) el("text", {x: 380, y: 176 + 44 * st.s, "text-anchor": "middle", "font-size": 12.5}, `Labor: orders ${LABN.ord}, order_items ${LABN.itm} → rossz mart ${LABN.bad} sor, helyes ${LABN.ord} sor`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
