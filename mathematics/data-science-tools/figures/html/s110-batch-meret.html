  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "train-epoch MSE (log)");
  const st = []; let ly = T + 8;
  BS.forEach(b => {
    if (!document.getElementById("b" + b).checked) return;
    const r = RUNS.find(q => q.batch_size === b && Math.abs(q.lr - lr) < 1e-12), spe = r.steps_per_epoch;
    const xs = r.epoch_loss.map((v, i) => steps ? X((i + 1) * spe) : X(i + 1));
    el("path", {d: r.epoch_loss.map((v, i) => (i ? "L" : "M") + xs[i].toFixed(1) + "," + Y(v).toFixed(1)).join(""), fill: "none", stroke: css("--fg"), "stroke-width": 1.8, "stroke-dasharray": DASH[b]});
    r.epoch_loss.forEach((v, i) => { if (i % 4 === 3) marker(xs[i], Y(v), MK[b]); });
    el("line", {x1: R - 170, y1: ly, x2: R - 140, y2: ly, stroke: css("--fg"), "stroke-width": 1.8, "stroke-dasharray": DASH[b]}); marker(R - 155, ly, MK[b]);
    el("text", {x: R - 134, y: ly + 4, "font-size": 11}, `batch ${b}: ${r.steps} lépés`); ly += 16;
    st.push(`batch ${b}: végső MSE ${fmt(r.epoch_loss[39], 3)} (${r.steps} frissítés)`);
  });
  document.getElementById("status").textContent = `lr = ${sel.options[sel.selectedIndex].text}, 40 epoch — ` + (st.length ? st.join("; ") : "jelölj ki legalább egy batch-méretet") + ".";
}
box.addEventListener("change", draw); sel.addEventListener("change", draw);
document.querySelectorAll("input[name=ax]").forEach(i => i.addEventListener("change", draw));
document.getElementById("r").onclick = () => { BS.forEach(b => document.getElementById("b" + b).checked = [1, 32, 512].includes(b)); sel.value = "0.01"; document.querySelector('input[name=ax][value=e]').checked = true; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
