<style>

button{font:inherit;padding:3px 10px;cursor:pointer}

input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>

    const on=i===hov, g=dg_mk(svg,"g",{tabindex:0,class:"clickable","data-i":i});
    dg_mk(g,"rect",{x:X(i)-bw-2,y:Y(0.1),width:bw,height:Y0-Y(0.1),fill:"url(#hp)",stroke:fg,"stroke-width":on?3:1});
    dg_mk(g,"rect",{x:X(i)+2,y:Y(T.q[i]),width:bw,height:Y0-Y(T.q[i]),fill:fg,stroke:fg,"stroke-width":on?3:1,opacity:0.8});
    dg_mk(g,"text",{x:X(i),y:Math.min(Y(0.1),Y(T.q[i]))-8,"text-anchor":"middle","font-size":14,"font-weight":on?"bold":"normal"},fmt(T.c[i],3));
    dg_mk(g,"text",{x:X(i),y:Y0+20,"text-anchor":"middle","font-size":15},String(i+1));
    dg_mk(g,"text",{x:X(i),y:Y0+38,"text-anchor":"middle","font-size":12,fill:mu},fmt(E[i],1)+"–"+fmt(E[i+1],1));
    g.addEventListener("mouseenter",()=>{hov=i;draw();}); g.addEventListener("focus",()=>{if(hov!==i){hov=i;draw();}});
  }
  dg_mk(svg,"text",{x:X0+W/2,y:Y0+62,"text-anchor":"middle","font-size":15},"referencia-decilis (bin, határok km-ben)");
  dg_mk(svg,"rect",{x:X0+10,y:20,width:22,height:14,fill:"url(#hp)",stroke:fg});
  dg_mk(svg,"text",{x:X0+38,y:32,"font-size":15},"referencia p_i = 0,10 (seed 101)");
  dg_mk(svg,"rect",{x:X0+300,y:20,width:22,height:14,fill:fg,opacity:0.8});
  dg_mk(svg,"text",{x:X0+328,y:32,"font-size":15},`eltolt ablak q_i (seed 103, átlag ${m} km)`);
  dg_mk(svg,"text",{x:X0+W,y:62,"text-anchor":"end","font-size":20,"font-weight":"bold"},"PSI = "+fmt(T.psi,3));
  const lvl=T.psi<0.1?"alacsony (< 0,1)":(T.psi<0.2?"vizsgálandó (0,1–0,2)":"erős riasztási szint (> 0,2)");
  let s=`Átlag ${m} km: PSI = ${fmt(T.psi,3)} – ${lvl}.`;
  if(hov>=0) s+=` ${hov+1}. bin (${fmt(E[hov],1)}–${fmt(E[hov+1],1)} km): p = 0,100, q = ${fmt(T.q[hov],3)}, hozzájárulás (q−p)·ln(q/p) = ${fmt(T.c[hov],3)}.`;
  else s+=" Vigye az egeret (vagy Tab) egy oszlopcsoportra a bin részleteiért.";
  status.textContent=s;
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
