<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Közös konform kvantilis, csoportonkénti lefedettség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--fillA:#888;--fillB:#ccc;--line:#000;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--fillA:#777;--fillB:#444;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <label for="w">az A (nagy hibájú) csoport aránya:</label><input id="w" type="range" min="0.02" max="0.9" step="0.01" value="0.1" aria-label="Az A csoport aránya">
  <b id="wv"></b>
</div>
<div class="ctl">
  <label for="s">σ<sub>A</sub>:</label><input id="s" type="range" min="0.2" max="1.0" step="0.05" value="0.6" aria-label="Az A csoport szórása">
  <b id="sv"></b>
  <button id="r">alaphelyzet (10%, 0,6)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 300" role="img" aria-label="Két abszolút-hiba-sűrűség a közös 90%-os kvantilissel; a nagyobb szórású csoport farka kilóg"></svg>
<p class="small">A: |N(0; σ<sub>A</sub>)|, B: |N(0; 0,2)| abszolút hibák; q az egyesített (keverék) eloszlás 90%-os kvantilise,
lefedettség = P(hiba ≤ q) csoportonként. Kitöltve a q feletti farok. Populációs (elméleti) eloszlás, szemléltetés, nem mérés.</p>
<script>
const SB = 0.2, LEVEL = 0.9;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
function erf(x){ // Abramowitz–Stegun 7.1.26 helyett sorfejtés/lánctört: nagy pontosságú közelítés
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  if (x < 3) { let sum = x, term = x, n = 0; while (Math.abs(term) > 1e-16 * Math.abs(sum)) { n++; term *= -x * x / n; sum += term / (2 * n + 1); } return s * 2 / Math.sqrt(Math.PI) * sum; }
  let f = 0; for (let n = 60; n >= 1; n--) f = n / 2 / (x + f); return s * (1 - Math.exp(-x * x) / Math.sqrt(Math.PI) / (x + f));
}
const cdf = (q, s) => erf(q / (s * Math.SQRT2));
const pdf = (x, s) => 2 / (s * Math.sqrt(2 * Math.PI)) * Math.exp(-x * x / (2 * s * s));
function pooledQ(w, sa){ let lo = 0, hi = 10; for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (w * cdf(m, sa) + (1 - w) * cdf(m, SB) < LEVEL) lo = m; else hi = m; } return (lo + hi) / 2; }
const L = 56, R = 600, T = 14, B = 250, XM = 2.0;
function draw(){
  const w = +document.getElementById("w").value, sa = +document.getElementById("s").value;
  document.getElementById("wv").textContent = fmt(100 * w, 0) + "%";
  document.getElementById("sv").textContent = fmt(sa, 2);
  const q = pooledQ(w, sa), ca = cdf(q, sa), cb = cdf(q, SB);
  svg.innerHTML = "";
  const N = 400, xs = [], ya = [], yb = [];
  for (let i = 0; i <= N; i++) { const x = XM * i / N; xs.push(x); ya.push(pdf(x, sa)); yb.push(pdf(x, SB)); }
  const ymax = Math.max(...ya, ...yb) * 1.08;
  const X = x => L + (R - L) * x / XM, Y = y => B - (B - T) * y / ymax;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="pa" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--fillA")}" opacity="0.5"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1"/></pattern>` +
    `<pattern id="pb" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="${css("--fillB")}"/><circle cx="2.5" cy="2.5" r="0.9" fill="${css("--fg")}"/></pattern>`;
  svg.appendChild(defs);
  [0, 0.5, 1, 1.5, 2].forEach(v => { el("text", {x: X(v), y: B + 16, "text-anchor": "middle", "font-size": 11}, fmt(v, 1)); });
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: css("--line")}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: css("--line")});
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "abszolút hiba |y − ŷ|");
  el("text", {x: 16, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 16 ${(T + B) / 2})`}, "sűrűség (csoporton belül)");
  function area(ys, fill){ let d = `M${X(q)},${Y(0)}`; for (let i = 0; i <= N; i++) if (xs[i] >= q) d += `L${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`; d += `L${X(XM)},${Y(0)}Z`; el("path", {d: d, fill: fill, stroke: "none"}); }
  area(ya, "url(#pa)"); area(yb, "url(#pb)");
  function line(ys, dash, wd){ let d = ""; for (let i = 0; i <= N; i++) d += (i ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(ys[i]).toFixed(1); el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": wd, "stroke-dasharray": dash}); }
  line(yb, "", 2); line(ya, "7 4", 2);
  el("line", {x1: X(q), y1: T, x2: X(q), y2: B, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  el("text", {x: X(q) + 6, y: T + 14, "font-size": 12, fill: css("--hl")}, `q = ${fmt(q, 3)}`);
  el("line", {x1: 380, y1: 40, x2: 410, y2: 40, stroke: css("--fg"), "stroke-width": 2}); el("text", {x: 416, y: 44, "font-size": 11.5}, `B: |N(0; 0,2)|, ${fmt(100 * (1 - w), 0)}%`);
  el("line", {x1: 380, y1: 60, x2: 410, y2: 60, stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"}); el("text", {x: 416, y: 64, "font-size": 11.5}, `A: |N(0; ${fmt(sa, 2)})|, ${fmt(100 * w, 0)}%`);
  el("text", {x: 380, y: 92, "font-size": 12.5}, `lefedettség B: ${fmt(100 * cb, 1)}%`);
  el("text", {x: 380, y: 110, "font-size": 12.5}, `lefedettség A: ${fmt(100 * ca, 1)}%`);
  document.getElementById("status").textContent = `Közös q = ${fmt(q, 3)}: a globális lefedettség 90%, de az A csoportban ${fmt(100 * ca, 1)}%, a B-ben ${fmt(100 * cb, 1)}% (A aránya ${fmt(100 * w, 0)}%, σA = ${fmt(sa, 2)}).`;
}
["w", "s"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("r").onclick = () => { document.getElementById("w").value = 0.1; document.getElementById("s").value = 0.6; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
