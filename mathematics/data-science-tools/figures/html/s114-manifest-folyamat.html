<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A futási könyvtár és a manifest</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három bemenet kerül a futásba; a futás öt fájlt hoz létre, amelyek közül a manifest hash-sel hivatkozik vissza a bemenetekre."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet run.py main() függvényének lépései. A manifest a config- és a két adatfájl SHA-256 hash-ét, a környezet verzióit és a modellmetrikákat rögzíti; a predikciós fájlokat és a run.log-ot nem listázza.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "A bemenetek: a konfiguráció (configs/tiny.toml), a két adatfájl és a futtató környezet.", "line": -1, "on": ["cfg", "tr", "te", "env"], "e": []}, {"msg": "argparse: a parancssor csak a bemeneti határ (--config configs/tiny.toml, --output-root runs).", "line": 0, "on": ["p1", "cfg"], "e": []}, {"msg": "run_id képzése és a runs/<run_id>/ létrehozása exist_ok=False-szal: egy futás = egy új könyvtár.", "line": 1, "on": ["p2"], "e": ["p1>p2"], "folder": true}, {"msg": "A logging a run.log fájlba (és a konzolra) ír.", "line": 2, "on": ["p2", "o_log"], "e": ["p2>o_log"], "folder": true}, {"msg": "Adatbetöltés: a két CSV a konfigurációban megadott útvonalról.", "line": 3, "on": ["p3", "tr", "te"], "e": ["p2>p3", "tr>p3", "te>p3"], "folder": true}, {"msg": "A konfiguráció másolata atomi írással kerül a futási könyvtárba (config.toml).", "line": 4, "on": ["p3", "cfg", "o_cfg"], "e": ["cfg>p3", "p3>o_cfg"], "folder": true}, {"msg": "A környezet csomagverziói (pandas, scikit-learn, a csomag maga) – verzióként, nem hash-ként.", "line": 5, "on": ["p3", "env"], "e": ["env>p3"], "folder": true}, {"msg": "Két modell tanítása (dummy, logreg); a predikciók atomi írással: predictions_dummy.csv, predictions_logreg.csv.", "line": 6, "on": ["p4", "o_pd", "o_pl"], "e": ["p3>p4", "p4>o_pd", "p4>o_pl"], "folder": true}, {"msg": "A bemenetek SHA-256 hash-e: config, train, test – bármely bájt változása más hash-t ad.", "line": 7, "on": ["h_cfg", "h_tr", "h_te", "cfg", "tr", "te"], "e": ["cfg>h_cfg", "tr>h_tr", "te>h_te"], "folder": true}, {"msg": "A manifest.json összeköti a futást a bemenetekkel: útvonal + SHA-256, környezet, modellmetrikák. (A predikciós fájlokat és a run.log-ot nem listázza.)", "line": 8, "on": ["p5", "o_man", "h_cfg", "h_tr", "h_te"], "e": ["p4>p5", "p5>o_man", "o_man>h_cfg", "o_man>h_tr", "o_man>h_te"], "folder": true}];
const CODE = ["args = parse_args(argv)                       # --config, --output-root, --log-level, --run-id", "run_dir.mkdir(parents=False, exist_ok=False)  # új, egyedi futási könyvtár", "setup_logging(args.log_level, run_dir)        # run.log + konzol", "train = pd.read_csv(train_path); test = pd.read_csv(test_path)", "atomic_write_str(run_dir / \"config.toml\", cfg_path.read_text())", "versions[pkg] = version(pkg)                  # környezet: verziók", "atomic_write_df(run_dir / f\"predictions_{name}.csv\", out)", "\"sha256\": sha256_file(cfg_path) / sha256_file(train_path) / sha256_file(test_path)", "atomic_write_str(run_dir / \"manifest.json\", json.dumps(manifest, ...))"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BOX = [["cfg", "in", 0.5, 20, 22, 6, "configs/tiny.toml"], ["tr", "in", 0.5, 29, 22, 6, "data/tiny_train.csv"], ["te", "in", 0.5, 38, 22, 6, "data/tiny_test.csv"], ["env", "in", 0.5, 47, 22, 8, "környezet: Python,\nplatform, csomagok"], ["h_cfg", "hash", 30.5, 26.6, 7, 3.4, "SHA-256"], ["h_tr", "hash", 27, 35.6, 7, 3.4, "SHA-256"], ["h_te", "hash", 23.5, 44.6, 7, 3.4, "SHA-256"], ["p1", "proc", 38, 1, 22, 6, "argparse\n(--config, --output-root)"], ["p2", "proc", 38, 10, 22, 6, "run_id + mkdir\n+ logging"], ["p3", "proc", 38, 19, 22, 36, "adatbetöltés\n(pd.read_csv)\n\nconfig-másolat\n\ncsomagverziók"], ["p4", "proc", 38, 57, 22, 6, "train_one × 2\n(dummy, logreg)"], ["p5", "proc", 38, 66, 22, 6, "manifest összeállítása"], ["o_log", "out", 69, 10, 27, 6, "run.log"], ["o_cfg", "out", 69, 20, 27, 6, "config.toml (másolat)"], ["o_pd", "out", 69, 54.5, 27, 5, "predictions_dummy.csv"], ["o_pl", "out", 69, 60.5, 27, 5, "predictions_logreg.csv"], ["o_man", "man", 69, 66, 27, 8, "manifest.json\nconfig/data sha256,\nenvironment, models"]], EDGES = [["p1", "p2", "s"], ["p2", "p3", "s"], ["p3", "p4", "s"], ["p4", "p5", "s"], ["cfg", "p3", "s"], ["tr", "p3", "s"], ["te", "p3", "s"], ["env", "p3", "s"], ["cfg", "h_cfg", "s"], ["tr", "h_tr", "s"], ["te", "h_te", "s"], ["p2", "o_log", "s"], ["p3", "o_cfg", "s"], ["p4", "o_pd", "s"], ["p4", "o_pl", "s"], ["p5", "o_man", "s"], ["o_man", "h_cfg", "d"], ["o_man", "h_tr", "d"], ["o_man", "h_te", "d"]], GEOM = {"p1>p2": [[49.0, 7], [49.0, 10]], "p2>p3": [[49.0, 16], [49.0, 19]], "p3>p4": [[49.0, 55], [49.0, 57]], "p4>p5": [[49.0, 63], [49.0, 66]], "cfg>p3": [[22.5, 23.0], [38, 23.0]], "tr>p3": [[22.5, 32.0], [38, 32.0]], "te>p3": [[22.5, 41.0], [38, 41.0]], "env>p3": [[22.5, 51.0], [38, 51.0]], "cfg>h_cfg": [[22.5, 25.2], [30.5, 28.3]], "tr>h_tr": [[22.5, 34.2], [27, 37.300000000000004]], "te>h_te": [[22.5, 43.2], [23.5, 46.300000000000004]], "p2>o_log": [[60, 13.0], [69, 13.0]], "p3>o_cfg": [[60, 23.0], [69, 23.0]], "p4>o_pd": [[60, 57.0], [69, 57.0]], "p4>o_pl": [[60, 63.0], [69, 63.0]], "p5>o_man": [[60, 70.0], [69, 70.0]], "o_man>h_cfg": [[82.5, 74], [82.5, 76.5], [34.0, 76.5], [34.0, 30.0]], "o_man>h_tr": [[78.9, 74], [78.9, 77.7], [30.5, 77.7], [30.5, 39.0]], "o_man>h_te": [[75.3, 74], [75.3, 78.9], [27.0, 78.9], [27.0, 48.0]]}, FOLDER = [65.5, 4.5, 33.5, 71.5, "runs/<run_id>/"];
const shown = new Set(), shownE = new Set();
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-1 -5 101 86");
  const K = STEPS.indexOf(s); shown.clear(); shownE.clear();
  for (let i = 0; i <= K; i++) { STEPS[i].on.forEach(b => shown.add(b)); STEPS[i].e.forEach(e => shownE.add(e)); }
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="1.8" markerHeight="1.8" orient="auto"><path d="M0,0L10,5L0,10Z" fill="${css("--fg")}"/></marker><pattern id="dots" width="1.4" height="1.4" patternUnits="userSpaceOnUse"><circle cx="0.7" cy="0.7" r="0.25" fill="${css("--muted")}"/></pattern>`;
  svg.appendChild(defs);
  const anyF = STEPS.slice(0, K + 1).some(q => q.folder);
  el("rect", {x: FOLDER[0], y: FOLDER[1], width: FOLDER[2], height: FOLDER[3], fill: anyF ? css("--cellhl") : "none", "fill-opacity": 0.35, stroke: css("--line"), "stroke-width": 0.3, "stroke-dasharray": "1.2 0.8", opacity: anyF ? 1 : 0.35});
  el("text", {x: FOLDER[0] + 1, y: FOLDER[1] + 3, "font-size": 2.6, "font-weight": "bold", opacity: anyF ? 1 : 0.35}, FOLDER[4]);
  el("text", {x: 1, y: -1.5, "font-size": 2.7, "font-weight": "bold"}, "bemenetek"); el("text", {x: 38, y: -1.5, "font-size": 2.7, "font-weight": "bold"}, "run.py (main)");
  EDGES.forEach(([u, v, st]) => { const key = u + ">" + v, P = GEOM[key], on = shownE.has(key), cur = s.e.includes(key);
    el("polyline", {points: P.map(p => p.join(",")).join(" "), fill: "none", stroke: cur ? css("--hl2") : css("--fg"), "stroke-width": cur ? 0.6 : 0.3, "stroke-dasharray": st === "d" ? "1.2 0.8" : "", "marker-end": "url(#ah)", opacity: on ? 1 : 0.15}); });
  BOX.forEach(([id, kind, x, y, w, h, t]) => {
    const on = shown.has(id), cur = s.on.includes(id), op = on ? 1 : 0.2, sw = cur ? 0.6 : (kind === "man" ? 0.55 : 0.3), sc = cur ? css("--hl2") : css("--line");
    if (kind === "in") el("polygon", {points: `${x + 1.5},${y} ${x + w},${y} ${x + w - 1.5},${y + h} ${x},${y + h}`, fill: css("--cellhl"), stroke: sc, "stroke-width": sw, opacity: op});
    else if (kind === "hash") el("ellipse", {cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2, fill: "url(#dots)", stroke: sc, "stroke-width": sw, opacity: op});
    else if (kind === "proc") el("rect", {x: x, y: y, width: w, height: h, rx: 1.2, fill: css("--cell"), stroke: sc, "stroke-width": sw, opacity: op});
    else el("polygon", {points: `${x},${y} ${x + w - 1.6},${y} ${x + w},${y + 1.6} ${x + w},${y + h} ${x},${y + h}`, fill: css("--cell"), stroke: sc, "stroke-width": sw, opacity: op});
    const lines = t.split("\n"), fs = kind === "hash" ? 1.45 : 1.75;
    lines.forEach((ln, i) => el("text", {x: x + w / 2, y: y + h / 2 + (i - (lines.length - 1) / 2) * fs * 1.15 + fs * 0.35, "text-anchor": "middle", "font-size": fs, "font-weight": kind === "man" && i === 0 ? "bold" : "normal", style: (kind === "in" && id !== "env") || kind === "out" ? "font-family:ui-monospace,monospace" : "", opacity: op}, ln));
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
