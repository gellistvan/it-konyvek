<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interakció két egyenessel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}input[type=range]{flex:1;min-width:90px}
#status{min-height:2.9em;margin:4px 0}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}button{font:inherit;padding:3px 8px;cursor:pointer}
</style></head><body>
<div class="ctl" role="group" aria-label="Együtthatók és távolság">
<label>b₀ <input id="b0" type="range" min="0" max="4" step="0.1" value="2"><b id="b0v"></b></label>
<label>b_B <input id="bB" type="range" min="-2" max="2" step="0.1" value="-0.5"><b id="bBv"></b></label>
<label>b_D <input id="bD" type="range" min="0" max="0.2" step="0.005" value="0.1"><b id="bDv"></b></label>
<label>b_{B:D} <input id="bBD" type="range" min="-0.1" max="0.1" step="0.005" value="-0.05"><b id="bBDv"></b></label>
<label>d (km) <input id="d" type="range" min="0" max="35" step="1" value="15"><b id="dv"></b></label>
<span><button id="reset">A könyv becslése</button></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 320" role="img" aria-label="Két egyenes: a consumer és a business csoport predikciója a távolság függvényében, a minimális példa hat pontjával."></svg>
<p class="small">ŷ = b₀ + b_B·I_B + b_D·d + b_{B:D}·I_B·d, consumer a referencia (I_B = 0). A pontok a fejezet hat sora; a könyv OLS-becslése (2,0; −0,5; 0,1; −0,05) pontosan illeszkedik rájuk. ● consumer, □ business.</p>
<script>
const D = {"rows": [["consumer", 10.0, 3.0], ["consumer", 20.0, 4.0], ["consumer", 30.0, 5.0], ["business", 10.0, 2.0], ["business", 20.0, 2.5], ["business", 30.0, 3.0]], "params": [2.0000000000000058, -0.5000000000000042, 0.10000000000000003, -0.04999999999999996]};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
const g=id=>document.getElementById(id), ids=["b0","bB","bD","bBD","d"];
function draw(){
  const b0=+g("b0").value,bB=+g("bB").value,bD=+g("bD").value,bBD=+g("bBD").value,d=+g("d").value;
  g("b0v").textContent=hu(b0,1);g("bBv").textContent=hu(bB,1);g("bDv").textContent=hu(bD,3);g("bBDv").textContent=hu(bBD,3);g("dv").textContent=d;
  svg.innerHTML="";
  const X0=55,W=660,Y0=15,H=260,px=v=>X0+v/35*W,py=v=>Y0+H-Math.max(-0.5,Math.min(8.5,v))/8*H;
  for(let v=0;v<=8;v++){E("line",{x1:X0,x2:X0+W,y1:py(v),y2:py(v),stroke:css("--grid"),"stroke-dasharray":"2 3"});E("text",{x:X0-6,y:py(v)+4,"text-anchor":"end","font-size":11},String(v));}
  for(let v=0;v<=35;v+=5)E("text",{x:px(v),y:Y0+H+16,"text-anchor":"middle","font-size":11},String(v));
  E("text",{x:X0+W/2,y:Y0+H+36,"text-anchor":"middle","font-size":12},"distance_km (d)");
  E("text",{x:16,y:Y0+H/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 16 ${Y0+H/2})`},"delivery_days");
  const lc=x=>b0+bD*x, lb=x=>b0+bB+(bD+bBD)*x;
  E("line",{x1:px(0),y1:py(lc(0)),x2:px(35),y2:py(lc(35)),stroke:css("--hl"),"stroke-width":2.4});
  E("line",{x1:px(0),y1:py(lb(0)),x2:px(35),y2:py(lb(35)),stroke:css("--hl2"),"stroke-width":2.4,"stroke-dasharray":"8 4"});
  D.rows.forEach(([s,x,y])=>{if(s==="consumer")E("circle",{cx:px(x),cy:py(y),r:5,fill:css("--hl")});else E("rect",{x:px(x)-5,y:py(y)-5,width:10,height:10,fill:css("--bg"),stroke:css("--hl2"),"stroke-width":2});});
  E("line",{x1:px(d),x2:px(d),y1:Y0,y2:Y0+H,stroke:css("--muted"),"stroke-dasharray":"2 3"});
  const pc=lc(d),pb=lb(d);
  E("circle",{cx:px(d),cy:py(pc),r:6,fill:"none",stroke:css("--line"),"stroke-width":2});
  E("circle",{cx:px(d),cy:py(pb),r:6,fill:"none",stroke:css("--line"),"stroke-width":2});
  E("line",{x1:px(d)+10,x2:px(d)+10,y1:py(pc),y2:py(pb),stroke:css("--line"),"stroke-width":1.2});
  E("text",{x:px(d)+14,y:(py(pc)+py(pb))/2+4,"font-size":11},"különbség "+hu(pc-pb,3));
  E("text",{x:px(0)+6,y:py(b0)-14,"font-size":11,fill:css("--hl")},"b₀ = "+hu(b0,1));
  E("text",{x:px(0)+6,y:py(b0+bB)+14,"font-size":11,fill:css("--hl2")},"b₀ + b_B = "+hu(b0+bB,2));
  E("text",{x:px(35)-4,y:py(lc(35))-8,"text-anchor":"end","font-size":11,fill:css("--hl")},"consumer: meredekség b_D = "+hu(bD,3));
  E("text",{x:px(35)-4,y:py(lb(35))+34,"text-anchor":"end","font-size":11,fill:css("--hl2")},"business: meredekség b_D + b_{B:D} = "+hu(bD+bBD,3));
  let sse=0;D.rows.forEach(([s,x,y])=>{const p=s==="consumer"?lc(x):lb(x);sse+=(y-p)*(y-p);});
  g("status").textContent=`d = ${d} km: consumer sor [1, 0, ${d}, 0] → ${hu(pc,3)} nap; business sor [1, 1, ${d}, ${d}] → ${hu(pb,3)} nap; különbség ${hu(pc-pb,3)} = −(b_B + b_{B:D}·d). `+
   `Négyzetes hibaösszeg a hat ponton: ${hu(sse,4)}${sse<1e-9?" (a könyv becslése pontosan illeszkedik)":""}.`;
}
ids.forEach(id=>g(id).addEventListener("input",draw));
g("reset").addEventListener("click",()=>{const p=D.params;g("b0").value=p[0];g("bB").value=p[1];g("bD").value=p[2];g("bBD").value=p[3];g("d").value=15;draw();});
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
