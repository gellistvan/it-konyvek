<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legkisebb négyzetek geometriája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><label for="az">azimut <b id="azv"></b></label><input id="az" type="range" min="-180" max="180" step="1" value="164" aria-label="Azimut"><label for="el">emelkedés <b id="elv"></b></label><input id="el" type="range" min="-90" max="90" step="1" value="5" aria-label="Emelkedés"><button id="rst">alapnézet</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 470" role="img" aria-label="Az y vektor merőleges vetítése az X oszlopai által kifeszített síkra R³-ban; a reziduum merőleges a síkra."></svg>

<p class="small">A fejezet hárompontos példája (törtekkel számolva). Ortografikus vetítés; szürke háló: az oszloptér (sík), folytonos: y, szaggatott: ŷ, pontozott: r.</p>
<script>
const DATA = {"c1": [1.0, 1.0, 1.0], "c2": [0.0, 1.0, 2.0], "y": [1.0, 3.0, 4.0], "yh": [1.1666666666666667, 2.6666666666666665, 4.166666666666667], "grid": [[[-0.2, -0.4, -0.6000000000000001], [0.042857142857142844, -0.15714285714285717, -0.3571428571428572], [0.2857142857142857, 0.08571428571428569, -0.11428571428571432], [0.5285714285714285, 0.32857142857142846, 0.12857142857142845], [0.7714285714285714, 0.5714285714285714, 0.37142857142857133], [1.0142857142857142, 0.8142857142857143, 0.6142857142857142], [1.2571428571428571, 1.0571428571428572, 0.8571428571428571], [1.5, 1.3, 1.1]], [[-0.2, -0.0714285714285714, 0.05714285714285722], [0.042857142857142844, 0.17142857142857146, 0.30000000000000004], [0.2857142857142857, 0.4142857142857143, 0.5428571428571429], [0.5285714285714285, 0.657142857142857, 0.7857142857142857], [0.7714285714285714, 0.8999999999999999, 1.0285714285714285], [1.0142857142857142, 1.1428571428571428, 1.2714285714285714], [1.2571428571428571, 1.3857142857142857, 1.5142857142857142], [1.5, 1.6285714285714286, 1.7571428571428571]], [[-0.2, 0.25714285714285723, 0.7142857142857144], [0.042857142857142844, 0.5000000000000001, 0.9571428571428573], [0.2857142857142857, 0.7428571428571429, 1.2000000000000002], [0.5285714285714285, 0.9857142857142858, 1.442857142857143], [0.7714285714285714, 1.2285714285714286, 1.685714285714286], [1.0142857142857142, 1.4714285714285715, 1.9285714285714288], [1.2571428571428571, 1.7142857142857144, 2.1714285714285717], [1.5, 1.9571428571428573, 2.4142857142857146]], [[-0.2, 0.5857142857142859, 1.3714285714285717], [0.042857142857142844, 0.8285714285714286, 1.6142857142857145], [0.2857142857142857, 1.0714285714285716, 1.8571428571428572], [0.5285714285714285, 1.3142857142857143, 2.1], [0.7714285714285714, 1.5571428571428572, 2.342857142857143], [1.0142857142857142, 1.8, 2.585714285714286], [1.2571428571428571, 2.0428571428571427, 2.8285714285714287], [1.5, 2.2857142857142856, 3.0714285714285716]], [[-0.2, 0.9142857142857146, 2.028571428571429], [0.042857142857142844, 1.1571428571428575, 2.271428571428572], [0.2857142857142857, 1.4000000000000004, 2.5142857142857147], [0.5285714285714285, 1.642857142857143, 2.7571428571428576], [0.7714285714285714, 1.885714285714286, 3.0000000000000004], [1.0142857142857142, 2.128571428571429, 3.2428571428571433], [1.2571428571428571, 2.371428571428572, 3.485714285714286], [1.5, 2.6142857142857148, 3.728571428571429]], [[-0.2, 1.2428571428571433, 2.6857142857142864], [0.042857142857142844, 1.4857142857142862, 2.9285714285714293], [0.2857142857142857, 1.728571428571429, 3.171428571428572], [0.5285714285714285, 1.9714285714285718, 3.414285714285715], [0.7714285714285714, 2.2142857142857144, 3.657142857142858], [1.0142857142857142, 2.4571428571428573, 3.900000000000001], [1.2571428571428571, 2.7, 4.142857142857144], [1.5, 2.942857142857143, 4.385714285714286]], [[-0.2, 1.5714285714285718, 3.3428571428571434], [0.042857142857142844, 1.8142857142857147, 3.5857142857142863], [0.2857142857142857, 2.0571428571428574, 3.828571428571429], [0.5285714285714285, 2.3000000000000003, 4.071428571428572], [0.7714285714285714, 2.542857142857143, 4.314285714285715], [1.0142857142857142, 2.785714285714286, 4.557142857142858], [1.2571428571428571, 3.028571428571429, 4.800000000000001], [1.5, 3.271428571428572, 5.042857142857144]], [[-0.2, 1.9000000000000001, 4.0], [0.042857142857142844, 2.142857142857143, 4.242857142857143], [0.2857142857142857, 2.3857142857142857, 4.485714285714286], [0.5285714285714285, 2.6285714285714286, 4.728571428571429], [0.7714285714285714, 2.8714285714285714, 4.9714285714285715], [1.0142857142857142, 3.1142857142857143, 5.214285714285714], [1.2571428571428571, 3.357142857142857, 5.457142857142857], [1.5, 3.6, 5.7]]], "az": 164, "el": 5};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

function el(tag,a,t){ const e=document.createElementNS("http://www.w3.org/2000/svg",tag); for(const k in a) e.setAttribute(k,a[k]); if(t!==undefined) e.textContent=t; svg.appendChild(e); return e; }
function proj(p,az,elv){ const a=az*Math.PI/180, e=elv*Math.PI/180;
  const sx=-Math.sin(a)*p[0]+Math.cos(a)*p[1];
  const sy=-Math.cos(a)*Math.sin(e)*p[0]-Math.sin(a)*Math.sin(e)*p[1]+Math.cos(e)*p[2];
  return [sx, -sy]; }
function fit(pts){ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}); const k=Math.min(660/(x1-x0),400/(y1-y0)); return p=>[30+(p[0]-x0)*k+(660-(x1-x0)*k)/2, 30+(p[1]-y0)*k]; }
function draw(){
  const az=+document.getElementById("az").value, ev=+document.getElementById("el").value;
  document.getElementById("azv").textContent=String(az).replace("-","−")+"°"; document.getElementById("elv").textContent=String(ev).replace("-","−")+"°";
  svg.innerHTML=""; const fg=dg_css("--fg"), mu=dg_css("--muted"), hl=dg_css("--hl"), hl2=dg_css("--hl2");
  const G=DATA.grid; const all=[]; G.forEach(r=>r.forEach(p=>all.push(proj(p,az,ev)))); [DATA.y,DATA.yh,DATA.c1,DATA.c2,[0,0,0]].forEach(p=>all.push(proj(p,az,ev))); const T=fit(all); const P=(p)=>T(proj(p,az,ev));
  for(let i=0;i<G.length;i++){ let d=""; for(let j=0;j<G[i].length;j++){ const q=P(G[i][j]); d+=(j?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1);} el("path",{d:d,fill:"none",stroke:mu,"stroke-width":0.7}); }
  for(let j=0;j<G[0].length;j++){ let d=""; for(let i=0;i<G.length;i++){ const q=P(G[i][j]); d+=(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1);} el("path",{d:d,fill:"none",stroke:mu,"stroke-width":0.7}); }
  const O=P([0,0,0]);
  const vec=(p,dash,w,col,lab,from,left)=>{ const a=from?P(from):O, b=P(p); el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:col,"stroke-width":w,"stroke-dasharray":dash}); el("circle",{cx:b[0],cy:b[1],r:3.5,fill:col}); if(lab) el("text",{x:b[0]+(left?-9:9),y:b[1]+(left?4:-8),"font-size":14,"text-anchor":left?"end":"start"},lab); };
  vec(DATA.c1,"",1.6,fg,"c₁"); vec(DATA.c2,"7 3 2 3",1.6,fg,"c₂");
  vec(DATA.y,"",2.6,fg,"y = (1, 3, 4)",null,true); vec(DATA.yh,"7 4",2.4,hl,"ŷ = (7/6, 8/3, 25/6)");
  vec(DATA.y,"2 3",3,hl2,"",DATA.yh);
  const m=[(DATA.y[0]+DATA.yh[0])/2,(DATA.y[1]+DATA.yh[1])/2,(DATA.y[2]+DATA.yh[2])/2], mp=P(m); el("text",{x:mp[0]+8,y:mp[1],"font-size":14,fill:hl2},"r");
  status.textContent = `Nézet: azimut ${String(az).replace("-","−")}°, emelkedés ${String(ev).replace("-","−")}°. Az r = (−1/6, 1/3, −1/6) reziduum merőleges a c₁ = (1,1,1) és c₂ = (0,1,2) által kifeszített síkra: c₁·r = 0, c₂·r = 0; ‖r‖² = 1/6. Forgasd úgy, hogy a sík élben látszódjon: ekkor r a síkra merőleges szakasz.`;
}
["az","el"].forEach(i=>document.getElementById(i).addEventListener("input", draw));
document.getElementById("rst").addEventListener("click", ()=>{ document.getElementById("az").value=DATA.az; document.getElementById("el").value=DATA.el; draw(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
