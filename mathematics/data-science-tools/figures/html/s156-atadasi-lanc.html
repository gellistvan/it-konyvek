<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az átadás ellenőrzési lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három ellenőrző kapu egymás után; mindegyiknek külön hibakódja van, a sikeres út a tartalomhash-sel végződik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kilépési kódok a fejezet cli.py-jából (1, 2, 3; siker 0); az A/B/C szint a fejezet táblázatából. A küszöb a s155-ben befagyasztott 0,333.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Áttekintés: fent az átadási csomag öt pillére, középen az ellenőrzési lánc, alul az ismétlés A/B/C szintje.", "hl": []}, {"hl": ["P1", "P2", "P3", "P4", "P5"], "msg": "Öt pillér: verziók (pyproject.toml, uv.lock, git commit), hashek (manifest.json), modellkártya, batch CLI és helyi füstteszt – mindegyik más kérdésre felel."}, {"hl": ["F1", "e1", "X1", "P2"], "line": 0, "msg": "northstar check: minden manifestbeli fájl SHA-256-ját újraszámolja; eltérésnél „HASH MISMATCH”, kilépési kód 1."}, {"hl": ["F1", "f1", "F2", "e2", "X2"], "line": 1, "msg": "northstar predict, 1. kapu: a modellfájl hash-e a manifesthez; eltérésnél „Model hash mismatch”, rc 2 – a modell be sem töltődik."}, {"hl": ["F2", "f2", "F3", "e3", "X3"], "line": 2, "msg": "2. kapu: oszlopszerződés a manifest feature_order listájával; tiltott (pl. delivery_days) vagy hiányzó oszlop esetén rc 3, kimenet nélkül."}, {"hl": ["F3", "f3", "F4"], "line": 3, "msg": "Predikció: predict_proba[:, 1], majd predicted_late = (p ≥ threshold); a manifest küszöbe a s155-ben befagyasztott 0,333."}, {"hl": ["F4", "f4", "F5"], "line": 4, "msg": "Kimenet: Parquet + a hat tizedesre kerekített kanonikus JSON SHA-256 tartalomhash-e; rc 0."}, {"hl": ["A", "B", "C", "l1", "l2"], "msg": "Ismétlés: A szinten bitazonos (azonos konténer), B szinten toleranciás (rtol 1e−6, atol 1e−9), a C szint új kísérlet, nem átadási teszt."}];
const CODE = ["check_manifest: hash ≠ manifest → print('HASH MISMATCH'); return 1", "predict: sha256(model) ≠ manifest → return 2", "forbidden = columns − feature_order; missing = feature_order − columns → return 3", "p = model.predict_proba(X)[:, 1]; predicted = (p >= threshold)", "content_hash = sha256(canonical JSON, 6 tizedes); return 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

(function(){const st=document.createElement("style");st.textContent=":root{--fill2:#c4c4c4;--fill3:#e8e8e8}@media (prefers-color-scheme:dark){:root{--fill2:#6a6a6a;--fill3:#383838}}";document.head.appendChild(st);})();

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="para"){const sk=Math.min(18,w*0.12);dg_mk(g,"polygon",Object.assign({points:`${x+sk},${y} ${x+w},${y} ${x+w-sk},${y+h} ${x},${y+h}`},st));}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const D0 = {"W": 1000, "H": 540, "nodes": [{"id": "P1", "x": 10, "y": 30, "w": 186, "h": 80, "label": "Verziók\npyproject + uv.lock\n+ git commit", "shape": "rect", "fs": 16, "fill": "g"}, {"id": "P2", "x": 208, "y": 30, "w": 186, "h": 80, "label": "Hashek\nmanifest.json", "shape": "rect", "fs": 16, "fill": "g"}, {"id": "P3", "x": 406, "y": 30, "w": 186, "h": 80, "label": "Modellkártya", "shape": "rect", "fs": 16, "fill": "g"}, {"id": "P4", "x": 604, "y": 30, "w": 186, "h": 80, "label": "Batch CLI\nnorthstar predict", "shape": "rect", "fs": 16, "fill": "g"}, {"id": "P5", "x": 802, "y": 30, "w": 186, "h": 80, "label": "Local test\npytest", "shape": "rect", "fs": 16, "fill": "g"}, {"id": "F1", "x": 10, "y": 160, "w": 172, "h": 90, "label": "northstar check\nmanifest-hash", "shape": "rect", "fs": 16, "bold": false, "lw": 1.2}, {"id": "F2", "x": 208, "y": 160, "w": 172, "h": 90, "label": "predict:\nmodell-hash", "shape": "rect", "fs": 16, "bold": false, "lw": 1.2}, {"id": "F3", "x": 406, "y": 160, "w": 172, "h": 90, "label": "oszlopszerződés\n(feature_order)", "shape": "rect", "fs": 16, "bold": false, "lw": 1.2}, {"id": "F4", "x": 604, "y": 160, "w": 172, "h": 90, "label": "predict_proba →\npredicted_late =\np ≥ 0,333", "shape": "rect", "fs": 16, "bold": false, "lw": 1.2}, {"id": "F5", "x": 802, "y": 160, "w": 172, "h": 90, "label": "kimenet +\ntartalomhash\n(rc 0)", "shape": "rect", "fs": 16, "bold": true, "lw": 2.2}, {"id": "X1", "x": 10, "y": 300, "w": 172, "h": 80, "label": "rc 1\nHASH MISMATCH", "shape": "rect", "fs": 16, "ls": "dash", "lw": 2.0}, {"id": "X2", "x": 208, "y": 300, "w": 172, "h": 80, "label": "rc 2\nModel hash\nmismatch", "shape": "rect", "fs": 16, "ls": "dash", "lw": 2.0}, {"id": "X3", "x": 406, "y": 300, "w": 172, "h": 80, "label": "rc 3\ntiltott vagy\nhiányzó oszlop", "shape": "rect", "fs": 16, "ls": "dash", "lw": 2.0}, {"id": "A", "x": 10, "y": 435, "w": 310, "h": 90, "label": "A: bitazonos\nazonos konténer-digest,\nlock, input → hash-egyezés", "shape": "rect", "fs": 16, "ls": "solid"}, {"id": "B", "x": 345, "y": 435, "w": 310, "h": 90, "label": "B: toleranciás\neltérő OS/BLAS/CPU →\nrtol 1e−6, atol 1e−9", "shape": "rect", "fs": 16, "ls": "dash"}, {"id": "C", "x": 680, "y": 435, "w": 310, "h": 90, "label": "C: statisztikai\nmás adat vagy seed →\núj kísérlet, nem átadás", "shape": "rect", "fs": 16, "ls": "dot"}], "edges": [{"id": "f1", "pts": [[182, 205], [208, 205]], "label": "OK", "lx": 195, "ly": 180, "fs": 16}, {"id": "f2", "pts": [[380, 205], [406, 205]], "label": "OK", "lx": 393, "ly": 180, "fs": 16}, {"id": "f3", "pts": [[578, 205], [604, 205]], "label": "OK", "lx": 591, "ly": 180, "fs": 16}, {"id": "f4", "pts": [[776, 205], [802, 205]], "label": "", "lx": 789, "ly": 180, "fs": 16}, {"id": "e1", "pts": [[96, 250], [96, 300]], "label": "", "ls": "dash"}, {"id": "e2", "pts": [[294, 250], [294, 300]], "label": "", "ls": "dash"}, {"id": "e3", "pts": [[492, 250], [492, 300]], "label": "", "ls": "dash"}, {"id": "l1", "pts": [[320, 480], [345, 480]], "label": "", "arrow": "both"}, {"id": "l2", "pts": [[655, 480], [680, 480]], "label": "", "arrow": "both"}], "texts": [{"x": 10, "y": 12, "s": "az átadási csomag öt pillére", "fs": 16, "ha": "left", "italic": true}, {"x": 697, "y": 330, "s": "a hibaágak (szaggatott)\nkimenet nélkül állnak le;\na rc a kilépési kód", "fs": 16, "italic": true}, {"x": 10, "y": 418, "s": "az ismétlés három szintje", "fs": 16, "ha": "left", "italic": true}]};
function render(s){ dg_draw(svg, s.D || D0, new Set(s.hl)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
