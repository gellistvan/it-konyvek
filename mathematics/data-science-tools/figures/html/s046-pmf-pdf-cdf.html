  [[a, Phi(a)], [b, Phi(b)]].forEach(q => { E(svg, "line", {x1: S.X(q[0]), y1: S.Y(0), x2: S.X(q[0]), y2: S.Y(q[1]), stroke: css("--muted"), "stroke-dasharray": "4 3"}); E(svg, "line", {x1: S.X(0), y1: S.Y(q[1]), x2: S.X(q[0]), y2: S.Y(q[1]), stroke: css("--muted"), "stroke-dasharray": "4 3"}); E(svg, "text", {x: S.X(1), y: S.Y(q[1]) - 4, "font-size": 11}, "F(" + F(q[0]) + ") = " + F(q[1], 4)); });
  status.textContent = `P(${F(a)} < X < ${F(b)}) = F(${F(b)}) − F(${F(a)}) = ${F(Phi(b), 4)} − ${F(Phi(a), 4)} = ${F(area, 4)} (a PDF alatti terület); binomiális: P(X ≤ ${k}) = ${F(D.cdfb[k], 4)} = az első ${k + 1} oszlop összege.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
