<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skalárszorzat és koszinusz 2D-ben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--bar:#bbb}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--bar:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:4px}
.ctl label{display:flex;gap:4px;align-items:center}
.ctl input[type=range]{width:110px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="ctl"></div>
<div class="ctl"><button id="r">a 3. feladat (q = (1,1), d1 = (10,0), d2 = (2,2))</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 300" role="img" aria-label="Bal oldalt a három vektor, jobb oldalt a nyers skalárszorzat és a koszinusz oszlopai"></svg>
<p class="small">q·d = q₁d₁ + q₂d₂; cos(q, d) = q·d / (‖q‖·‖d‖). A koszinusz csak az iránytól függ, a nyers skalárszorzat a hossztól is.</p>
<script>
const INIT = {"q": [1.0, 1.0], "d1": [10.0, 0.0], "d2": [2.0, 2.0]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => (Math.round(x * 10 ** d) / 10 ** d).toString().replace(".", ",").replace("-", "−");
const ids = [["qx", "q₁"], ["qy", "q₂"], ["ax", "d1₁"], ["ay", "d1₂"], ["bx", "d2₁"], ["by", "d2₂"]];
const box = document.getElementById("ctl");
[[0, 2], [2, 4], [4, 6]].forEach(([a, b]) => { const row = document.createElement("div"); row.className = "ctl";
  for (let i = a; i < b; i++) row.insertAdjacentHTML("beforeend", `<label>${ids[i][1]} = <input type="range" id="${ids[i][0]}" min="-4" max="10" step="0.5" aria-label="${ids[i][1]}"> <b id="${ids[i][0]}v"></b></label>`);
  box.appendChild(row); });
const g = id => +document.getElementById(id).value;
function arrow(x0, y0, x1, y1, w, dash, col){
  el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: col, "stroke-width": w, "stroke-dasharray": dash});
  const a = Math.atan2(y1 - y0, x1 - x0), h = 10;
  el("path", {d: `M${x1},${y1}L${x1 - h * Math.cos(a - 0.35)},${y1 - h * Math.sin(a - 0.35)}L${x1 - h * Math.cos(a + 0.35)},${y1 - h * Math.sin(a + 0.35)}Z`, fill: col});
}
function draw(){
  ids.forEach(([id]) => document.getElementById(id + "v").textContent = fmt(g(id), 1));
  const q = [g("qx"), g("qy")], d = [[g("ax"), g("ay")], [g("bx"), g("by")]];
  svg.innerHTML = "";
  const S = 26, OX = 130, OY = 170, X = x => OX + S * x, Y = y => OY - S * y;
  for (let x = -4; x <= 10; x += 2) { el("line", {x1: X(x), y1: Y(-4.5), x2: X(x), y2: Y(5.5), stroke: css("--grid")}); el("text", {x: X(x), y: Y(-4.5) + 13, "text-anchor": "middle", "font-size": 10}, String(x).replace("-", "−")); }
  for (let y = -4; y <= 5; y += 2) { el("line", {x1: X(-4.5), y1: Y(y), x2: X(10.3), y2: Y(y), stroke: css("--grid")}); el("text", {x: X(-4.5) - 4, y: Y(y) + 4, "text-anchor": "end", "font-size": 10}, String(y).replace("-", "−")); }
  el("line", {x1: X(-4.5), y1: Y(0), x2: X(10.3), y2: Y(0), stroke: css("--muted")}); el("line", {x1: X(0), y1: Y(-4.5), x2: X(0), y2: Y(5.5), stroke: css("--muted")});
  const nq = Math.hypot(...q), dots = d.map(v => q[0] * v[0] + q[1] * v[1]), coss = d.map((v, i) => { const n = Math.hypot(...v); return nq && n ? dots[i] / (nq * n) : NaN; });
  arrow(X(0), Y(0), X(d[0][0]), Y(d[0][1]), 2, "8 5", css("--muted"));
  arrow(X(0) + 4, Y(0) + 4, X(d[1][0]) + 4, Y(d[1][1]) + 4, 2, "", css("--muted"));
  arrow(X(0), Y(0), X(q[0]), Y(q[1]), 3.5, "", css("--fg"));
  el("text", {x: X(d[0][0]) + 6, y: Y(d[0][1]) - 6, "font-size": 12}, "d1"); el("text", {x: X(d[1][0]) + 8, y: Y(d[1][1]) + 14, "font-size": 12}, "d2"); el("text", {x: X(q[0]) - 14, y: Y(q[1]) - 6, "font-size": 12, "font-weight": "bold"}, "q");
  // oszlopok
  const BX = 470, BW = 34, BB = 250, BT = 40, dm = Math.max(12, ...dots.map(Math.abs));
  el("text", {x: 560, y: 22, "text-anchor": "middle", "font-size": 12}, "q·d (sraffozott) és cos (pontozott)");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--bar")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1"/></pattern><pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="${css("--bg")}"/><circle cx="2.5" cy="2.5" r="1" fill="${css("--fg")}"/></pattern>`;
  svg.appendChild(defs);
  const mid = (BB + BT) / 2, H = (BB - BT) / 2;
  el("line", {x1: BX - 10, y1: mid, x2: BX + 190, y2: mid, stroke: css("--line")});
  [0, 1].forEach(i => {
    const x = BX + i * 100, hd = dots[i] / dm * H, hc = (isNaN(coss[i]) ? 0 : coss[i]) * H;
    el("rect", {x: x, y: hd >= 0 ? mid - hd : mid, width: BW, height: Math.abs(hd), fill: "url(#h1)", stroke: css("--fg")});
    el("rect", {x: x + BW + 4, y: hc >= 0 ? mid - hc : mid, width: BW, height: Math.abs(hc), fill: "url(#h2)", stroke: css("--fg")});
    el("text", {x: x + BW / 2, y: (hd >= 0 ? mid - hd : mid - hd + 12) - 4, "text-anchor": "middle", "font-size": 11}, fmt(dots[i], 2));
    el("text", {x: x + BW * 1.5 + 4, y: (hc >= 0 ? mid - hc : mid - hc + 12) - 4, "text-anchor": "middle", "font-size": 11}, isNaN(coss[i]) ? "–" : fmt(coss[i], 3));
    el("text", {x: x + BW + 2, y: BB + 30, "text-anchor": "middle", "font-size": 12}, "d" + (i + 1));
  });
  const rd = dots[0] === dots[1] ? "döntetlen" : (dots[0] > dots[1] ? "d1, d2" : "d2, d1");
  const rc = isNaN(coss[0]) || isNaN(coss[1]) ? "nem értelmezett (nullvektor)" : (Math.abs(coss[0] - coss[1]) < 1e-12 ? "döntetlen" : (coss[0] > coss[1] ? "d1, d2" : "d2, d1"));
  document.getElementById("status").textContent = `q·d1 = ${fmt(dots[0], 2)}, q·d2 = ${fmt(dots[1], 2)} → rangsor: ${rd}; cos(q,d1) = ${isNaN(coss[0]) ? "–" : fmt(coss[0], 3)}, cos(q,d2) = ${isNaN(coss[1]) ? "–" : fmt(coss[1], 3)} → rangsor: ${rc}${rd !== rc ? " (a két mérték eltér!)" : ""}.`;
}
function reset(){ const v = [INIT.q[0], INIT.q[1], INIT.d1[0], INIT.d1[1], INIT.d2[0], INIT.d2[1]]; ids.forEach(([id], i) => document.getElementById(id).value = v[i]); draw(); }
ids.forEach(([id]) => document.getElementById(id).addEventListener("input", draw));
document.getElementById("r").onclick = reset;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
reset();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
