<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origin-előrejelzések</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc;--train:#eef2f7}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--train:#26303a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}input[type=range]{min-width:150px;flex:1}
#status{min-height:2.9em;margin:4px 0}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}select,button{font:inherit}
</style></head><body>
<div class="ctl" role="group" aria-label="Origin és modell">
<label for="o">origin: <b id="ov"></b></label><input id="o" type="range" min="19" max="58" value="41">
<label for="f">modell:</label><select id="f"><option value="orders,lag7">(orders, lag7) – a fejezet kódja</option><option value="orders,lag1,lag2" selected>(orders, lag1, lag2)</option><option value="orders,lag1">(orders, lag1)</option><option value="orders">(orders)</option></select>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="A 60 napos determinisztikus rendelési sor; az origin előtti tanítószakasz árnyékolt, az origin utáni napon a tény, a naiv baseline és a modell előrejelzése."></svg>
<p class="small">raw = 40 + 20·sin(2πt/7) + 0,25t, kerekítve; a tanítóhalmaz az origin előtti sorok (feat.dropna után t = 7-től), a cél a következő napi érték. OLS a böngészőben (Householder-QR). ● tény, □ naiv baseline, ▲ modell. Determinisztikus számítás, nem mérés.</p>
<script>
const D = {"dates": ["2025-01-01", "2025-01-02", "2025-01-03", "2025-01-04", "2025-01-05", "2025-01-06", "2025-01-07", "2025-01-08", "2025-01-09", "2025-01-10", "2025-01-11", "2025-01-12", "2025-01-13", "2025-01-14", "2025-01-15", "2025-01-16", "2025-01-17", "2025-01-18", "2025-01-19", "2025-01-20", "2025-01-21", "2025-01-22", "2025-01-23", "2025-01-24", "2025-01-25", "2025-01-26", "2025-01-27", "2025-01-28", "2025-01-29", "2025-01-30", "2025-01-31", "2025-02-01", "2025-02-02", "2025-02-03", "2025-02-04", "2025-02-05", "2025-02-06", "2025-02-07", "2025-02-08", "2025-02-09", "2025-02-10", "2025-02-11", "2025-02-12", "2025-02-13", "2025-02-14", "2025-02-15", "2025-02-16", "2025-02-17", "2025-02-18", "2025-02-19", "2025-02-20", "2025-02-21", "2025-02-22", "2025-02-23", "2025-02-24", "2025-02-25", "2025-02-26", "2025-02-27", "2025-02-28", "2025-03-01"], "orders": [40.0, 55.9, 60.0, 49.4, 32.3, 21.8, 25.9, 41.7, 57.6, 61.7, 51.2, 34.1, 23.5, 27.6, 43.5, 59.4, 63.5, 52.9, 35.8, 25.3, 29.4, 45.2, 61.1, 65.2, 54.7, 37.6, 27.0, 31.1, 47.0, 62.9, 67.0, 56.4, 39.3, 28.8, 32.9, 48.7, 64.6, 68.7, 58.2, 41.1, 30.5, 34.6, 50.5, 66.4, 70.5, 59.9, 42.8, 32.3, 36.4, 52.2, 68.1, 72.2, 61.7, 44.6, 34.0, 38.1, 54.0, 69.9, 74.0, 63.4], "res": [{"origin": "2025-02-11", "base": 34.6, "lag7": 39.96088287143323, "lag12": 50.50395334905338, "actual": 50.5}, {"origin": "2025-02-18", "base": 36.4, "lag7": 39.994956665283425, "lag12": 52.19208629853376, "actual": 52.2}, {"origin": "2025-02-25", "base": 38.1, "lag7": 42.48290679882075, "lag12": 54.00298319655762, "actual": 54.0}], "orig": [41, 48, 55]};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
const N=D.orders.length, y=D.orders;
function col(name,i){const k={orders:0,lag1:1,lag2:2,lag7:7}[name];return i-k>=0?y[i-k]:NaN;}
function valid(i){return i>=7&&i<=N-2;}   // feat.dropna(): lag7, roll7 és target_lead1 is létezik
function lstsq(X,b){ // Householder-QR, oszlopszám kicsi
  const m=X.length,n=X[0].length,A=X.map(r=>r.slice()),c=b.slice();
  for(let k=0;k<n;k++){let s=0;for(let i=k;i<m;i++)s+=A[i][k]*A[i][k];s=Math.sqrt(s);if(s===0)continue;const a=A[k][k]>0?-s:s;
    const v=new Array(m).fill(0);v[k]=A[k][k]-a;for(let i=k+1;i<m;i++)v[i]=A[i][k];let vv=0;for(let i=k;i<m;i++)vv+=v[i]*v[i];if(vv===0)continue;
    for(let j=k;j<n;j++){let d=0;for(let i=k;i<m;i++)d+=v[i]*A[i][j];d=2*d/vv;for(let i=k;i<m;i++)A[i][j]-=d*v[i];}
    let d=0;for(let i=k;i<m;i++)d+=v[i]*c[i];d=2*d/vv;for(let i=k;i<m;i++)c[i]-=d*v[i];}
  const x=new Array(n).fill(0);for(let k=n-1;k>=0;k--){let s=c[k];for(let j=k+1;j<n;j++)s-=A[k][j]*x[j];x[k]=Math.abs(A[k][k])<1e-12?0:s/A[k][k];}return x;}
function predict(o,feats){const X=[],b=[];for(let i=0;i<o;i++){if(!valid(i))continue;X.push([1,...feats.map(f=>col(f,i))]);b.push(y[i+1]);}
  const be=lstsq(X,b);return [1,...feats.map(f=>col(f,o))].reduce((s,v,j)=>s+v*be[j],0);}
function draw(){
  const o=+document.getElementById("o").value, feats=document.getElementById("f").value.split(",");
  document.getElementById("ov").textContent=D.dates[o];
  svg.innerHTML="";
  const X0=50,W=690,Y0=12,H=240,px=i=>X0+i/(N)*W,py=v=>Y0+H-(v-15)/(82-15)*H;
  E("rect",{x:px(7),y:Y0,width:px(o)-px(7),height:H,fill:css("--train")});
  E("text",{x:(px(7)+px(o))/2,y:Y0+H-6,"text-anchor":"middle","font-size":11,fill:css("--muted")},"tanítóhalmaz (index < origin)");
  for(let v=20;v<=80;v+=20){E("line",{x1:X0,x2:X0+W,y1:py(v),y2:py(v),stroke:css("--grid"),"stroke-dasharray":"2 3"});E("text",{x:X0-5,y:py(v)+4,"text-anchor":"end","font-size":11},String(v));}
  [0,10,20,31,41,48,55,59].forEach(i=>E("text",{x:px(i),y:Y0+H+16,"text-anchor":"middle","font-size":10.5},D.dates[i].slice(5)));
  E("polyline",{points:y.map((v,i)=>px(i)+","+py(v)).join(" "),fill:"none",stroke:css("--muted"),"stroke-width":1.2});
  y.forEach((v,i)=>E("circle",{cx:px(i),cy:py(v),r:1.8,fill:css("--muted")}));
  E("line",{x1:px(o),x2:px(o),y1:Y0,y2:Y0+H,stroke:css("--line"),"stroke-dasharray":"6 3"});
  E("text",{x:px(o)-3,y:Y0+12,"text-anchor":"end","font-size":11},"origin");
  const act=y[o+1], base=y[o], pr=predict(o,feats), x1=px(o+1);
  E("rect",{x:x1-6,y:py(base)-6,width:12,height:12,fill:css("--bg"),stroke:css("--hl2"),"stroke-width":2});
  E("polygon",{points:`${x1},${py(pr)-9} ${x1-8},${py(pr)+6} ${x1+8},${py(pr)+6}`,fill:"none",stroke:css("--hl"),"stroke-width":2});
  E("circle",{cx:x1,cy:py(act),r:5,fill:css("--line")});
  const lab=(v,t,c)=>E("text",{x:x1+12,y:py(v)+4,"font-size":11,fill:css(c)},t+" "+hu(v,1));
  lab(act,"tény","--fg");lab(base,"baseline","--hl2");if(Math.abs(pr-act)>2.5)lab(pr,"modell","--hl");
  document.getElementById("status").textContent=`origin ${D.dates[o]} → cél ${D.dates[o+1]}: tény ${hu(act,1)}, naiv baseline ${hu(base,1)} (hiba ${hu(act-base,1)}), `+
    `(${feats.join(", ")})-modell ${hu(pr,1)} (hiba ${hu(act-pr,1)}). `+(feats.includes("lag7")&&feats.length===2?"A lag7 itt ≈ orders − 1,75, ezért nem hoz új információt a heti fázisról.":"");
}
["o","f"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
