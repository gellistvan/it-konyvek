function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function corr(xs, ys){ const n = xs.length; let mx = 0, my = 0; for (let i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; } mx /= n; my /= n;
  let sxy = 0, sxx = 0, syy = 0; for (let i = 0; i < n; i++) { const a = xs[i] - mx, b = ys[i] - my; sxy += a * b; sxx += a * a; syy += b * b; }
  return {r: sxy / Math.sqrt(sxx * syy), b: sxy / sxx, mx: mx, my: my}; }
function draw(){
  const d = val("d"); show("dv", F(d, 1));
  const n = D.n, X = D.zx.map((v, i) => i < n ? v : v + d), Y = D.zy.map((v, i) => i < n ? v : v + d);
  svg.innerHTML = "";
  const A = Axes(svg, {x: 60, y: 15, w: 400, h: 400, x0: -4, x1: 16, y0: -4, y1: 16, xt: [-4, 0, 4, 8, 12, 16], yt: [-4, 0, 4, 8, 12, 16], xl: "x", yl: "y", ylo: 34, grid: true});
  for (let i = 0; i < 2 * n; i++) { if (i < n) E(svg, "circle", {cx: A.X(X[i]), cy: A.Y(Y[i]), r: 2.4, fill: "none", stroke: css("--muted"), "stroke-width": 0.8});
    else E(svg, "rect", {x: A.X(X[i]) - 2.2, y: A.Y(Y[i]) - 2.2, width: 4.4, height: 4.4, fill: css("--fill2"), stroke: "none"}); }
  const call = corr(X, Y), ca = corr(X.slice(0, n), Y.slice(0, n)), cb = corr(X.slice(n), Y.slice(n));
  path(svg, A, [-4, 16], [call.my + call.b * (-4 - call.mx), call.my + call.b * (16 - call.mx)], {"stroke-width": 2, "stroke-dasharray": "8 4"});
  [ca, cb].forEach(c => path(svg, A, [c.mx - 2.2, c.mx + 2.2], [c.my - 2.2 * c.b, c.my + 2.2 * c.b], {stroke: css("--hl2"), "stroke-width": 2.4}));
  let y = 60; const T = (t, o) => { E(svg, "text", Object.assign({x: 490, y: y, "font-size": 13}, o || {}), t); y += 22; };
  T("○ A régió: N(0; 1) × N(0; 1)"); T("■ B régió: eltolva (" + F(d, 1) + "; " + F(d, 1) + ")");
  y += 8; T("összevont r = " + (call.r >= 0 ? "+" : "") + F(call.r, 3), {"font-weight": "bold"});
  T("A régión belül r = " + F(ca.r, 3)); T("B régión belül r = " + F(cb.r, 3));
  y += 8; T("szaggatott: összevont egyenes", {fill: css("--muted"), "font-size": 12}); T("rövid vonalak: régión belüli egyenesek", {fill: css("--muted"), "font-size": 12});
  status.textContent = `B-eltolás d = ${F(d, 1)}: összevont r = ${F(call.r, 3)}, régión belül ${F(ca.r, 3)} és ${F(cb.r, 3)}. A régión belüli kapcsolat nem változik; a teljes korrelációt csak a két régió közti átlageltolódás hozza létre.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
