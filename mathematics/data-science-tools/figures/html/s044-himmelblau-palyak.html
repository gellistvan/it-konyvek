  status.textContent = `Kezdőpont (${F(start[0])}; ${F(start[1])}), η = ${F(eta, 3)}: a GD ${r.n} iteráció után ${r.why === "divergált" ? "divergált" : "a (" + F(end[0], 3) + "; " + F(end[1], 3) + ") pontban állt meg (" + r.why + ")"}` + (bf ? `; a BFGS ${bf.length - 1} iterációval ugyanide jut.` : ".");
}
