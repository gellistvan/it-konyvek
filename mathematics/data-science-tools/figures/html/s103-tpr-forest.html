<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szeletenkénti TPR Wilson-intervallummal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Szint">
  <label for="lv">megbízhatósági szint:</label><input id="lv" type="range" min="0.80" max="0.99" step="0.01" value="0.95" aria-label="Megbízhatósági szint">
  <b id="lvv"></b>
  <label for="k">Bonferroni: összehasonlítások száma k =</label><input id="k" type="range" min="1" max="9" step="1" value="3" aria-label="Összehasonlítások száma" style="max-width:160px">
  <b id="kv"></b>
</div>
<div class="ctl" role="group" aria-label="Szeletek" id="inp"></div>
<div class="ctl"><button id="r">kézi példa (1/1, 2/3, 0/1)</button><button id="big">a példatábla nagyságrendje (94/120, 40/60, 3/5)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 230" role="img" aria-label="Forest plot: a south és north intervalluma szinte az egész [0,1]-et lefedi, a central keskenyebb"></svg>
<p class="small">Wilson-intervallum a fejezet wilson_ci függvényével; a Bonferroni-CI szintje 1 − (1 − szint)/k
(k = 3, szint 0,95 → 0,98333, z ≈ 2,394; a fejezet kódjának kerekített 0,9833-a z ≈ 2,393-at ad). Üres jelölő: n+ &lt; 10 (a minimum-n szabály alatt, „elégtelen adat”).</p>
<script>
const INIT = [{"r": "north", "x": 1, "n": 1}, {"r": "central", "x": 2, "n": 3}, {"r": "south", "x": 0, "n": 1}];
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
function ppf(p){ // Acklam-féle inverz normális (rel. hiba < 1,2e-9) + egy Newton-lépés
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00],
        b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01],
        c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00],
        d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425; let q, r;
  if (p < pl) { q = Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if (p > 1-pl) { q = Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  q = p-0.5; r = q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function wilson(x, n, level){ const z = ppf(1 - (1 - level) / 2), p = x / n, D = 1 + z*z/n, c = (p + z*z/(2*n)) / D, m = z * Math.sqrt(p*(1-p)/n + z*z/(4*n*n)) / D; return [Math.max(0, c - m), Math.min(1, c + m), z]; }
const box = document.getElementById("inp");
INIT.forEach((d, i) => { box.insertAdjacentHTML("beforeend", `<label>${d.r}: x = <input type="number" id="x${i}" min="0" value="${d.x}" aria-label="${d.r} találatok"> / n+ = <input type="number" id="n${i}" min="1" value="${d.n}" aria-label="${d.r} pozitívok"></label>`); });
function setVals(v){ v.forEach((p, i) => { document.getElementById("x" + i).value = p[0]; document.getElementById("n" + i).value = p[1]; }); draw(); }
const L = 110, R = 420, T = 20, H = 62;
function draw(){
  const lv = +document.getElementById("lv").value, k = +document.getElementById("k").value, bl = 1 - (1 - lv) / k;
  document.getElementById("lvv").textContent = fmt(100 * lv, 0) + "%"; document.getElementById("kv").textContent = k;
  svg.innerHTML = "";
  const X = v => L + (R - L) * v;
  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(v => { el("line", {x1: X(v), y1: T - 6, x2: X(v), y2: T + 3 * H - 10, stroke: css("--grid"), "stroke-dasharray": "2 3"}); el("text", {x: X(v), y: T + 3 * H + 6, "text-anchor": "middle", "font-size": 11}, fmt(v, 1)); });
  el("text", {x: (L + R) / 2, y: T + 3 * H + 24, "text-anchor": "middle", "font-size": 12}, "TPR");
  const shapes = ["circle", "rect", "tri"]; let st = [];
  INIT.forEach((d, i) => {
    let n = Math.max(1, Math.round(+document.getElementById("n" + i).value || 1)), x = Math.max(0, Math.min(n, Math.round(+document.getElementById("x" + i).value || 0)));
    const [lo, hi, z] = wilson(x, n, lv), [blo, bhi, zb] = wilson(x, n, bl), y = T + i * H + 18, small = n < 10, p = x / n;
    el("text", {x: L - 10, y: y + 4, "text-anchor": "end", "font-size": 12.5}, d.r); el("text", {x: L - 10, y: y + 19, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, `n+ = ${n}`);
    el("line", {x1: X(lo), y1: y, x2: X(hi), y2: y, stroke: css("--fg"), "stroke-width": 3.5});
    el("line", {x1: X(blo), y1: y + 14, x2: X(bhi), y2: y + 14, stroke: css("--muted"), "stroke-width": 1.5, "stroke-dasharray": "6 4"});
    [lo, hi].forEach(v => el("line", {x1: X(v), y1: y - 6, x2: X(v), y2: y + 6, stroke: css("--fg"), "stroke-width": 1.5}));
    [blo, bhi].forEach(v => el("line", {x1: X(v), y1: y + 9, x2: X(v), y2: y + 19, stroke: css("--muted"), "stroke-width": 1.2}));
    const f = small ? css("--bg") : css("--fg"), sx = X(p);
    if (i === 0) el("circle", {cx: sx, cy: y, r: 6, fill: f, stroke: css("--fg"), "stroke-width": 2});
    else if (i === 1) el("rect", {x: sx - 6, y: y - 6, width: 12, height: 12, fill: f, stroke: css("--fg"), "stroke-width": 2});
    else el("path", {d: `M${sx},${y - 7}L${sx + 7},${y + 6}L${sx - 7},${y + 6}Z`, fill: f, stroke: css("--fg"), "stroke-width": 2});
    el("text", {x: R + 14, y: y + 4, "font-size": 11.5}, `${x}/${n}: [${fmt(lo, 3)}; ${fmt(hi, 3)}]`);
    el("text", {x: R + 14, y: y + 19, "font-size": 11, fill: css("--muted")}, `Bonf.: [${fmt(blo, 3)}; ${fmt(bhi, 3)}]${small ? " · elégtelen adat" : ""}`);
    st.push(`${d.r} ${fmt(p, 3)} [${fmt(lo, 3)}; ${fmt(hi, 3)}]`);
    if (i === 0) st.z = [z, zb];
  });
  document.getElementById("status").textContent = `${fmt(100 * lv, 0)}%-os Wilson-CI (z = ${fmt(st.z[0], 3)}), Bonferroni ${fmt(100 * bl, 2)}% (z = ${fmt(st.z[1], 3)}): ` + st.join("; ");
}
["lv", "k"].forEach(id => document.getElementById(id).addEventListener("input", draw));
box.addEventListener("input", draw);
document.getElementById("r").onclick = () => { document.getElementById("lv").value = 0.95; document.getElementById("k").value = 3; setVals(INIT.map(d => [d.x, d.n])); };
document.getElementById("big").onclick = () => setVals([[94, 120], [40, 60], [3, 5]]);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
