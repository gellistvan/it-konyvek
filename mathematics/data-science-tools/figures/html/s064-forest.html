<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erdődiagram: IV. ellenőrző pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ccc;--ex:#777}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--ex:#aaa}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}#status{min-height:2.9em;margin:4px 0}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
g.row{cursor:pointer}g.row:focus{outline:none}g.row:focus rect.bg,g.row.on rect.bg{fill:var(--grid);opacity:.45}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="radiogroup" aria-label="Konfidenciaszint">
<span>Konfidenciaszint:</span>
<label><input type="radio" name="cl" value="0.90"> 90%</label>
<label><input type="radio" name="cl" value="0.95" checked> 95%</label>
<label><input type="radio" name="cl" value="0.99"> 99%</label>
<span class="small">(sorra kattintva vagy Tab-bal fókuszálva a részletek)</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 270" role="img" aria-label="Erdődiagram négy konfidenciaintervallummal: mind lefedi a nullát; a 0,10-es tervezett hatást csak a két feltáró alcsoport intervalluma fedi le."></svg>
<p class="small">Adat: lab/artifacts/s064_primary.json. Wald: RD ± z·SE; a bootstrap-intervallum (10 000 rétegzett ismétlés) csak 95%-on van a JSON-ban, más szinten nem rajzoljuk. A feltáró alcsoportok nem döntési alapok.</p>
<script>
const R = [{"lab": "ITT, Wald (primer)", "rd": 0.00017790428749336895, "se": 0.05023843098042543, "lo": -0.09828761107394177, "hi": 0.0986434196489285, "kind": "wald", "expl": false, "n": "154 + 146"}, {"lab": "ITT, bootstrap (primer)", "rd": 0.00017790428749336895, "se": null, "lo": -0.09971535314001068, "hi": 0.09936843977939853, "kind": "boot", "expl": false, "n": "154 + 146"}, {"lab": "consumer (feltáró)", "rd": 0.011344884488448836, "se": 0.05938840467606969, "lo": -0.1050542497759379, "hi": 0.1277440187528356, "kind": "wald", "expl": true, "n": "101 + 96"}, {"lab": "business (feltáró)", "rd": -0.02075471698113207, "se": 0.09116345764464043, "lo": -0.19943181067076998, "hi": 0.15792237670850584, "kind": "wald", "expl": true, "n": "53 + 50"}];
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p,tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function hu(x,d){let s=x.toFixed(d);if(+s===0)s=(0).toFixed(d);return s.replace(".",",").replace("-","−");}
// standard normális kvantilis (Acklam-közelítés), a 0,90/0,95/0,99 szinthez
function qnorm(p){const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239],b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572],c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783],d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
 const pl=0.02425;let q,r;if(p<pl){q=Math.sqrt(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
 q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);}
let sel=0;
function ci(r,cl){if(r.kind==="boot")return cl===0.95?[r.lo,r.hi]:null;if(cl===0.95)return[r.lo,r.hi];const z=qnorm(1-(1-cl)/2);return[r.rd-z*r.se,r.rd+z*r.se];}
function draw(){
  const cl=+document.querySelector("input[name=cl]:checked").value;
  svg.innerHTML="";
  const X0=190,W=400,sx=v=>X0+(v+0.25)/0.5*W, top=40, dy=48;
  for(let v=-0.25;v<=0.2501;v+=0.05){E(svg,"line",{x1:sx(v),x2:sx(v),y1:top-10,y2:top+dy*4-10,stroke:css("--grid"),"stroke-dasharray":"2 3"});E(svg,"text",{x:sx(v),y:top+dy*4+6,"text-anchor":"middle","font-size":11},hu(v,2));}
  E(svg,"line",{x1:sx(0),x2:sx(0),y1:top-14,y2:top+dy*4-10,stroke:css("--line"),"stroke-width":1.4});
  E(svg,"line",{x1:sx(0.1),x2:sx(0.1),y1:top-14,y2:top+dy*4-10,stroke:css("--line"),"stroke-width":1.4,"stroke-dasharray":"6 4"});
  E(svg,"text",{x:sx(0)-4,y:top-18,"text-anchor":"end","font-size":11},"nincs hatás");
  E(svg,"text",{x:sx(0.1)+4,y:top-18,"text-anchor":"start","font-size":11},"tervezett hatás (0,10)");
  E(svg,"text",{x:X0+W/2,y:top+dy*4+26,"text-anchor":"middle","font-size":12},"kockázatkülönbség (RD = p₁ − p₀)");
  E(svg,"text",{x:X0+W+12,y:top-18,"font-size":11,"font-weight":"bold"},`RD  [${Math.round(cl*100)}%-os CI]`);
  R.forEach((r,i)=>{
    const y=top+i*dy+8, g=E(svg,"g",{class:"row"+(i===sel?" on":""),tabindex:0,role:"button","aria-label":r.lab});
    E(g,"rect",{class:"bg",x:0,y:y-18,width:760,height:36,fill:"transparent"});
    E(g,"text",{x:X0-10,y:y+4,"text-anchor":"end","font-size":12},r.lab);
    const c=ci(r,cl), col=r.expl?css("--ex"):css("--line");
    if(c){E(g,"line",{x1:sx(c[0]),x2:sx(c[1]),y1:y,y2:y,stroke:col,"stroke-width":r.expl?2:2.6,"stroke-dasharray":r.kind==="boot"?"7 3":""});
      c.forEach(v=>E(g,"line",{x1:sx(v),x2:sx(v),y1:y-6,y2:y+6,stroke:col,"stroke-width":1.6}));
      E(g,"text",{x:X0+W+12,y:y+4,"font-size":11},`${hu(r.rd,4)}  [${hu(c[0],4)}; ${hu(c[1],4)}]`);}
    else E(g,"text",{x:X0+W+12,y:y+4,"font-size":11,fill:css("--muted")},"csak 95%-on ismert");
    if(r.expl)E(g,"rect",{x:sx(r.rd)-4.5,y:y-4.5,width:9,height:9,fill:css("--bg"),stroke:col,"stroke-width":1.6});
    else E(g,"circle",{cx:sx(r.rd),cy:y,r:5,fill:col});
    const pick=()=>{sel=i;draw();svg.querySelectorAll("g.row")[i].focus();};
    g.addEventListener("click",pick);g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick();}});
  });
  const r=R[sel], c=ci(r,cl);
  let msg=`${r.lab}: RD = ${hu(r.rd,4)} (n = ${r.n}). `;
  if(!c)msg+="A bootstrap-intervallum csak 95%-os szinten szerepel a JSON-ban.";
  else msg+=`${Math.round(cl*100)}%-os CI [${hu(c[0],4)}; ${hu(c[1],4)}]: ${c[0]<0&&c[1]>0?"lefedi a nullát":"nem fedi le a nullát"}, és ${c[0]<=0.1&&c[1]>=0.1?"lefedi":"nem fedi le"} a tervezett 0,10-es hatást${c[1]<0.1?" (a felső végpont "+hu(0.1-c[1],4)+"-del alatta marad)":""}.`;
  document.getElementById("status").textContent=msg;
}
document.querySelectorAll("input[name=cl]").forEach(e=>e.addEventListener("change",draw));
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
