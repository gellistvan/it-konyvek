<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatminőségi kapu: döntési fa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#777;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#e6e6e6;--stop:#555;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#999;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#3a3a3a;--stop:#888;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:4px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:6px 0;min-height:4.3em;font-weight:bold}
svg{width:100%;max-width:540px;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Hibák a bemenetben">
  <label><input type="checkbox" id="c_schema"> sémahiba</label>
  <label><input type="checkbox" id="c_rows"> sorszám a tartományon kívül</label>
  <label><input type="checkbox" id="c_null"> NULL kötelező oszlopban</label>
  <label><input type="checkbox" id="c_fk"> orphan customer_id</label>
  <label><input type="checkbox" id="c_fresh"> késés (frissesség &gt; limit)</label>
  <label><input type="checkbox" id="c_crit"> a modell aznapi döntéshez használja</label>
</div>
<div class="ctl"><button data-p="">hibátlan fájl</button><button data-p="schema,null">séma + NULL</button>
<button data-p="fk">orphan sor</button><button data-p="fresh">késés</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="20 -2 80 100" role="img" aria-label="Folyamatábra: séma- és sorszámhiba megállítja a futást, a hiányzó érték és idegen kulcs a sort karanténba teszi, a késés figyelmeztetést ad"></svg>
<p class="small">Helyes precedencia: a végső döntés a legsúlyosabb (STOP &gt; QUARANTINE &gt; WARN &gt; OK). Összevetésként az állapotsor egy naiv,
egymást felülíró if-láncú decide() eredményét is mutatja, amely a STOP-ot QUARANTINE-nal felülírja, és hibátlan bemenetre is WARN-t ad.</p>
<script>
const N = [["in", "box", 50, 3, "napi rendelésfájl + customers"], ["d1", "dia", 50, 16, "séma egyezik?"], ["d2", "dia", 50, 31, "sorszám ∈ [lo, hi]?"], ["d3", "dia", 50, 46, "NULL a kötelező\noszlopokban?"], ["d4", "dia", 50, 61, "idegen kulcs\nrendben?"], ["d5", "dia", 50, 76, "frissesség\n≤ limit?"], ["ok", "box", 50, 91, "validált tábla + manifest\n(+ karantén, figyelmeztetés)"], ["s1", "stop", 84, 16, "STOP\nexit code 2"], ["s2", "stop", 84, 31, "STOP\nexit code 2"], ["q1", "quar", 84, 46, "QUARANTINE\nhibás sorok külön"], ["q2", "quar", 84, 61, "QUARANTINE\norphan sorok külön"], ["w1", "warn", 84, 76, "WARN\n(STOP, ha aznapi\ndöntéshez kell)"]], E = [["in", "d1", "", "s"], ["d1", "d2", "igen", "s"], ["d2", "d3", "igen", "s"], ["d3", "d4", "nem", "s"], ["d4", "d5", "igen", "s"], ["d5", "ok", "igen", "s"], ["d1", "s1", "nem", "stop"], ["d2", "s2", "nem", "stop"], ["d3", "q1", "igen", "quar"], ["d4", "q2", "nem", "quar"], ["d5", "w1", "nem", "warn"], ["q1", "d4", "a többi sor tovább", "back"], ["q2", "d5", "", "back"], ["w1", "ok", "", "back"]], G = {"in>d1": [[50, 5.5], [50, 11.25]], "d1>d2": [[50, 20.75], [50, 26.25]], "d2>d3": [[50, 35.75], [50, 41.25]], "d3>d4": [[50, 50.75], [50, 56.25]], "d4>d5": [[50, 65.75], [50, 71.25]], "d5>ok": [[50, 80.75], [50, 87.8]], "d1>s1": [[63.0, 16], [73, 16]], "d2>s2": [[63.0, 31], [73, 31]], "d3>q1": [[63.0, 46], [73, 46]], "d4>q2": [[63.0, 61], [73, 61]], "d5>w1": [[63.0, 76], [73, 76]], "q1>d4": [[84, 51.2], [84, 56.5], [51.28421052631579, 56.5]], "q2>d5": [[84, 66.2], [84, 71.5], [51.28421052631579, 71.5]], "w1>ok": [[84, 81.2], [84, 91], [64.5, 91]]}, DW = 26, DH = 9.5;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const ORDER = {OK: 0, WARN: 1, QUARANTINE: 2, STOP: 3};
const g = id => document.getElementById("c_" + id).checked;
function decideFixed(f){ const c = ["OK"]; if (f.schema || f.rows) c.push("STOP"); if (f.null || f.fk) c.push("QUARANTINE"); if (f.fresh) c.push(f.crit ? "STOP" : "WARN"); return c.reduce((a, b) => ORDER[b] > ORDER[a] ? b : a); }
function decideChapter(f){ let d = "WARN"; if (f.schema) d = "STOP"; if (f.rows) d = "STOP"; if (f.null) d = "QUARANTINE"; if (f.fk) d = "QUARANTINE"; return d; }
function draw(){
  const f = {schema: g("schema"), rows: g("rows"), null: g("null"), fk: g("fk"), fresh: g("fresh"), crit: g("crit")};
  // bejárt út: STOP-nál megáll
  const nodes = new Set(["in", "d1"]), edges = new Set(["in>d1"]);
  let stop = false;
  if (f.schema) { nodes.add("s1"); edges.add("d1>s1"); stop = true; }
  else { edges.add("d1>d2"); nodes.add("d2");
    if (f.rows) { nodes.add("s2"); edges.add("d2>s2"); stop = true; }
    else { edges.add("d2>d3"); nodes.add("d3");
      if (f.null) { nodes.add("q1"); edges.add("d3>q1"); edges.add("q1>d4"); } else edges.add("d3>d4");
      nodes.add("d4");
      if (f.fk) { nodes.add("q2"); edges.add("d4>q2"); edges.add("q2>d5"); } else edges.add("d4>d5");
      nodes.add("d5");
      if (f.fresh) { nodes.add("w1"); edges.add("d5>w1"); if (f.crit) stop = true; else { edges.add("w1>ok"); nodes.add("ok"); } }
      else { edges.add("d5>ok"); nodes.add("ok"); } } }
  svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="2.2" markerHeight="2.2" orient="auto"><path d="M0,0L10,5L0,10Z" fill="${css("--fg")}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="2.6" markerHeight="2.6" orient="auto"><path d="M0,0L10,5L0,10Z" fill="${css("--hl2")}"/></marker><pattern id="hq" width="1.6" height="1.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="${css("--muted")}" stroke-width="0.3"/></pattern>`;
  svg.appendChild(defs);
  const DASH = {s: "", stop: "", quar: "1.6 1", warn: "0.4 0.8", back: ""}, SW = {s: 0.3, stop: 0.7, quar: 0.4, warn: 0.45, back: 0.25};
  E.forEach(([u, v, lab, st]) => { const k = u + ">" + v, on = edges.has(k), P = G[k];
    el("polyline", {points: P.map(p => p.join(",")).join(" "), fill: "none", stroke: on ? css("--hl2") : (st === "back" ? css("--muted") : css("--fg")), "stroke-width": on ? Math.max(0.6, SW[st] * 1.6) : SW[st], "stroke-dasharray": DASH[st], "marker-end": on ? "url(#ah2)" : "url(#ah)", opacity: on ? 1 : 0.45});
    if (lab && st !== "back") { const [a, b] = P; const tx = st === "s" ? a[0] + 1.2 : (a[0] + b[0]) / 2, ty = st === "s" ? (a[1] + b[1]) / 2 + 1 : a[1] - 1.2;
      el("text", {x: tx, y: ty, "font-size": 1.9, "text-anchor": st === "s" ? "start" : "middle", "font-style": "italic", opacity: on ? 1 : 0.5}, lab); } });
  N.forEach(([id, k, x, y, t]) => { const on = nodes.has(id), sc = on ? css("--hl2") : css("--line"), sw = on ? 0.7 : 0.3, op = on ? 1 : 0.4;
    if (k === "box") el("rect", {x: x - 14.5, y: id === "in" ? y - 2.8 : y - 3.8, width: 29, height: id === "in" ? 5.6 : 7.6, rx: 1, fill: css("--cellhl"), stroke: sc, "stroke-width": sw, opacity: op});
    else if (k === "dia") el("polygon", {points: `${x},${y - DH / 2} ${x + DW / 2},${y} ${x},${y + DH / 2} ${x - DW / 2},${y}`, fill: css("--cell"), stroke: sc, "stroke-width": sw, opacity: op});
    else if (k === "stop") { let p = ""; for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; p += `${x + 6.6 * Math.cos(a)},${y + 6.6 * Math.sin(a)} `; } el("polygon", {points: p, fill: css("--stop"), stroke: sc, "stroke-width": sw, opacity: op}); }
    else if (k === "quar") { el("polygon", {points: `${x - 11},${y - 4.2} ${x + 11},${y - 4.2} ${x + 6},${y + 4.2} ${x - 6},${y + 4.2}`, fill: "url(#hq)", stroke: sc, "stroke-width": sw, "stroke-dasharray": on ? "" : "1.6 1", opacity: op}); }
    else el("polygon", {points: `${x},${y - 6.2} ${x + 11},${y + 5.2} ${x - 11},${y + 5.2}`, fill: css("--cell"), stroke: sc, "stroke-width": sw, "stroke-dasharray": "0.4 0.8", opacity: op});
    const ls = t.split("\n"), fs = k === "dia" || k === "box" ? 1.85 : 1.7, dy = k === "warn" ? 1.8 : 0;
    ls.forEach((ln, i) => el("text", {x: x, y: y + dy + (i - (ls.length - 1) / 2) * fs * 1.15 + fs * 0.35, "text-anchor": "middle", "font-size": fs, "font-weight": k === "stop" && i === 0 ? "bold" : "normal", fill: k === "stop" ? "#fff" : undefined, opacity: op}, ln)); });
  const fx = decideFixed(f), ch = decideChapter(f);
  const why = stop ? (f.schema || f.rows ? "séma-/sorszámhiba: a futás megáll, nincs új kimenet (exit code 2)" : "a késő adatot a modell aznapi döntéshez használná") :
    (fx === "QUARANTINE" ? "a hibás sorok karanténba kerülnek, a többi sor validált táblába" : fx === "WARN" ? "a tábla elkészül, a manifest figyelmeztetést rögzít" : "minden szabály teljesül");
  document.getElementById("status").textContent = `Döntés (legsúlyosabb győz): ${fx} — ${why}. Naiv, felülíró if-lánc: ${ch}${ch !== fx ? " (hibás!)" : ""}.`;
}
document.querySelectorAll("input[type=checkbox]").forEach(i => i.addEventListener("change", draw));
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { const on = b.dataset.p ? b.dataset.p.split(",") : [];
  ["schema", "rows", "null", "fk", "fresh", "crit"].forEach(k => document.getElementById("c_" + k).checked = on.includes(k)); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
