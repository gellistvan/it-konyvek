<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döntési kapu: log loss és latency</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kapuszorzó: <input id="gf" type="range" min="50" max="100" step="1" value="95" oninput="onP()" style="width:160px" aria-label="Log loss kapu szorzója"> <span id="gfv">0,95</span></label> <label>latency-kapu (ms): <input id="lg" type="range" min="2" max="100" step="1" value="10" oninput="onP()" style="width:160px" aria-label="Latency kapu"> <span id="lgv">10</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Oszlopdiagram: három modell validációs log loss-a a baseline és a 0,4467-es kapu alatt; mellette a p95 latency, ahol csak a random forest haladja meg a 10 ms-ot."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezetben közölt futás számai (a latency gép- és terhelésfüggő mérés); a rf n_jobs=1-es értéke ugyanabból a futásból, egyszálú predikcióval. A csúszkák csak a jegyzőkönyv kapuit változtatják, a mért értékeket nem.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "f": 0.95, "lg": 10, "line": 1, "msg": ""}, {"ph": 2, "f": 0.95, "lg": 10, "line": 2, "msg": ""}, {"ph": 3, "f": 0.95, "lg": 15, "line": 2, "msg": ""}, {"ph": 4, "f": 0.95, "lg": 10, "line": 3, "msg": ""}];
const CODE = ["gate = 0.95 * baseline_log_loss", "valid_log_loss <= gate and valid_auc >= 0.5", "p95_predict_ms <= 10 and size_mb <= 2   # mobil: 15 ms", "0,005-ös sávon belül: kisebb p95, kisebb méret  ->  decision"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BASE = 0.4702, C = [{"n": "logistic", "fam": "line\u00e1ris", "ll": 0.2878, "auc": 0.8965, "p95": 2.625, "size": 0.003}, {"n": "hgb", "fam": "boosting", "ll": 0.3081, "auc": 0.8816, "p95": 3.441, "size": 0.09}, {"n": "rf", "fam": "bagging", "ll": 0.3234, "auc": 0.8665, "p95": 74.43, "size": 1.817}], RF1 = 8.248;
function decide(f, lg){ const ok = C.filter(c => c.ll <= f * BASE && c.auc >= 0.5 && c.p95 <= lg && c.size <= 2); if (!ok.length) return [];
  const best = Math.min(...ok.map(c => c.ll)), inb = c => c.ll - best < 0.005;
  return ok.filter(inb).sort((a, b) => a.p95 - b.p95 || a.size - b.size).concat(ok.filter(c => !inb(c)).sort((a, b) => a.ll - b.ll || a.p95 - b.p95)).map(c => c.n); }
function onP(){ const f = +document.getElementById("gf").value / 100, lg = +document.getElementById("lg").value;
  document.getElementById("gfv").textContent = f.toFixed(2).replace(".", ","); document.getElementById("lgv").textContent = lg;
  setSteps([1, 2, 3, 4].map(ph => ({ph: ph, f: f, lg: ph === 3 ? Math.max(lg, 15) : lg, line: [1, 2, 2, 3][ph - 1], msg: ""}))); show(3); }
function f2(v, d){ return v.toFixed(d).replace(".", ","); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const gate = s.f * BASE, X1 = v => 110 + v / 0.56 * 250, rows = ["baseline"].concat(C.map(c => c.n)), vals = [BASE].concat(C.map(c => c.ll));
  el("text", {x: 10, y: 18, "font-size": 12, "font-weight": "bold"}, "(a) valid log loss");
  rows.forEach((n, i) => { const y = 45 + i * 50, ok = i === 0 || vals[i] <= gate;
    el("text", {x: 100, y: y + 16, "text-anchor": "end", "font-size": 12}, n);
    el("rect", {x: X1(0), y: y, width: X1(vals[i]) - X1(0), height: 26, fill: i === 0 ? css("--bg") : (ok ? css("--muted") : "none"), stroke: css("--fg"), "stroke-dasharray": ok ? "" : "4 3"});
    el("text", {x: X1(vals[i]) + 4, y: y + 17, "font-size": 11}, f2(vals[i], 4)); });
  el("line", {x1: X1(gate), y1: 32, x2: X1(gate), y2: 250, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  el("text", {x: X1(gate), y: 266, "text-anchor": "middle", "font-size": 11}, `kapu = ${f2(s.f, 2)} · ${f2(BASE, 4)} = ${f2(gate, 4)}`);
  const X2 = v => 470 + (Math.log10(v) - Math.log10(1.5)) / (Math.log10(200) - Math.log10(1.5)) * 270;
  el("text", {x: 400, y: 18, "font-size": 12, "font-weight": "bold"}, "(b) p95 latency (ms, log)");
  const lg = s.ph >= 2 ? s.lg : null, pts = C.map(c => [c.n, c.p95]).concat([["rf* (n_jobs=1)", RF1]]);
  pts.forEach((p, i) => { const y = 58 + i * 50, ok = lg === null ? null : p[1] <= lg;
    el("text", {x: 462, y: y + 4, "text-anchor": "end", "font-size": 12}, p[0]);
    el("circle", {cx: X2(p[1]), cy: y, r: 8, fill: ok ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 2});
    el("text", {x: X2(p[1]), y: y - 13, "text-anchor": "middle", "font-size": 11}, f2(p[1], 2)); });
  [2, 5, 10, 20, 50, 100].forEach(v => el("text", {x: X2(v), y: 266, "text-anchor": "middle", "font-size": 10.5}, String(v)));
  if (lg !== null) { el("line", {x1: X2(lg), y1: 32, x2: X2(lg), y2: 250, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"});
    el("text", {x: X2(lg), y: 30, "text-anchor": "middle", "font-size": 11}, `${lg} ms`); }
  const d = decide(s.f, s.lg), failLL = C.filter(c => c.ll > gate).map(c => c.n), failLat = C.filter(c => c.ll <= gate && c.p95 > s.lg).map(c => c.n);
  const msgs = {1: `Log loss kapu (${f2(gate, 4)}): ${failLL.length ? "bukik: " + failLL.join(", ") : "mindhárom jelölt átmegy"}.`,
    2: `Latency kapu ${s.lg} ms: ${failLat.length ? "bukik: " + failLat.join(", ") : "minden jelölt átmegy"}. (A rf n_jobs=1-gyel ${f2(RF1, 2)} ms – ugyanabban a futásban, a 10 ms-os határon belül.)`,
    3: `Mobil küszöb ${s.lg} ms: ${failLat.length ? "bukik: " + failLat.join(", ") : "minden jelölt átmegy"}; az n_jobs=1-es rf (${f2(RF1, 2)} ms) itt is átmenne.`,
    4: `Döntés: ${d.length ? d[0] : "nincs átmenő jelölt"} (rangsor: ${d.join(" > ") || "–"}; méretkapu ≤ 2 MB: mind átmegy).`};
  status.textContent = msgs[s.ph];
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
