<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szelekciós szivárgás 30 seeden</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kiválasztott feature-ök száma k: <select id="ks" onchange="onK()" aria-label="SelectKBest k"><option value="2">2</option><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Párosított ábra: a pipeline AUC-ja minden seeden alacsonyabb, mint a teljes adaton választotté."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet kódja seed = 0–29-cel (adat és split), numpy-átirattal; k = 10 a fejezet beállítása. Oracle: logisztikus regresszió csak a két valódi jelen. Számított szemléltetés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 29, "k": 10, "msg": "", "line": -1}, {"i": 0, "k": 10, "msg": "", "line": -1}, {"i": 1, "k": 10, "msg": "", "line": -1}, {"i": 2, "k": 10, "msg": "", "line": -1}, {"i": 3, "k": 10, "msg": "", "line": -1}, {"i": 4, "k": 10, "msg": "", "line": -1}, {"i": 5, "k": 10, "msg": "", "line": -1}, {"i": 6, "k": 10, "msg": "", "line": -1}, {"i": 7, "k": 10, "msg": "", "line": -1}, {"i": 8, "k": 10, "msg": "", "line": -1}, {"i": 9, "k": 10, "msg": "", "line": -1}, {"i": 10, "k": 10, "msg": "", "line": -1}, {"i": 11, "k": 10, "msg": "", "line": -1}, {"i": 12, "k": 10, "msg": "", "line": -1}, {"i": 13, "k": 10, "msg": "", "line": -1}, {"i": 14, "k": 10, "msg": "", "line": -1}, {"i": 15, "k": 10, "msg": "", "line": -1}, {"i": 16, "k": 10, "msg": "", "line": -1}, {"i": 17, "k": 10, "msg": "", "line": -1}, {"i": 18, "k": 10, "msg": "", "line": -1}, {"i": 19, "k": 10, "msg": "", "line": -1}, {"i": 20, "k": 10, "msg": "", "line": -1}, {"i": 21, "k": 10, "msg": "", "line": -1}, {"i": 22, "k": 10, "msg": "", "line": -1}, {"i": 23, "k": 10, "msg": "", "line": -1}, {"i": 24, "k": 10, "msg": "", "line": -1}, {"i": 25, "k": 10, "msg": "", "line": -1}, {"i": 26, "k": 10, "msg": "", "line": -1}, {"i": 27, "k": 10, "msg": "", "line": -1}, {"i": 28, "k": 10, "msg": "", "line": -1}, {"i": 29, "k": 10, "msg": "", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"2": [[0.7389, 0.7389], [0.682, 0.682], [0.6533, 0.6533], [0.7337, 0.7337], [0.7226, 0.7226], [0.7371, 0.7371], [0.6924, 0.6924], [0.6913, 0.6913], [0.7657, 0.7657], [0.7305, 0.7305], [0.7259, 0.7259], [0.7417, 0.7417], [0.7138, 0.7138], [0.692, 0.692], [0.6911, 0.6911], [0.6711, 0.6711], [0.6914, 0.6914], [0.7428, 0.7428], [0.7232, 0.7232], [0.7293, 0.7293], [0.7547, 0.7547], [0.7038, 0.7038], [0.7193, 0.7193], [0.7955, 0.7955], [0.7502, 0.7502], [0.7326, 0.7326], [0.7239, 0.7239], [0.6701, 0.6701], [0.715, 0.715], [0.7035, 0.7035]], "5": [[0.751, 0.7244], [0.6914, 0.6694], [0.6561, 0.6448], [0.7414, 0.7204], [0.7294, 0.7278], [0.7286, 0.7199], [0.6978, 0.6729], [0.7076, 0.6856], [0.7853, 0.7207], [0.7461, 0.7218], [0.7396, 0.7304], [0.7402, 0.7241], [0.7496, 0.7058], [0.7026, 0.6701], [0.7011, 0.6766], [0.6848, 0.6803], [0.732, 0.7149], [0.7431, 0.7356], [0.7467, 0.7171], [0.7404, 0.7198], [0.7641, 0.726], [0.7127, 0.6858], [0.7229, 0.6912], [0.7956, 0.7846], [0.7437, 0.7391], [0.7312, 0.7293], [0.7229, 0.7103], [0.671, 0.6516], [0.7115, 0.7054], [0.7055, 0.6874]], "10": [[0.7466, 0.7073], [0.7057, 0.6409], [0.6537, 0.6329], [0.75, 0.7332], [0.7394, 0.6999], [0.735, 0.7045], [0.7161, 0.6691], [0.697, 0.6765], [0.775, 0.7313], [0.7575, 0.7253], [0.731, 0.7253], [0.7467, 0.7208], [0.7441, 0.7209], [0.6936, 0.6715], [0.7063, 0.6327], [0.6879, 0.6711], [0.724, 0.7053], [0.7265, 0.7023], [0.7594, 0.712], [0.7412, 0.7066], [0.7491, 0.7281], [0.7209, 0.6749], [0.7251, 0.6563], [0.7997, 0.761], [0.751, 0.7325], [0.7503, 0.7238], [0.7361, 0.7019], [0.6919, 0.6382], [0.7149, 0.6914], [0.7084, 0.6806]], "20": [[0.7543, 0.6835], [0.7089, 0.6424], [0.6685, 0.6233], [0.7618, 0.7291], [0.7464, 0.6918], [0.7344, 0.6959], [0.7298, 0.6505], [0.7078, 0.6476], [0.7503, 0.7192], [0.7463, 0.7208], [0.7247, 0.6949], [0.7421, 0.7113], [0.7475, 0.7134], [0.6909, 0.6486], [0.7006, 0.6349], [0.693, 0.6442], [0.729, 0.6951], [0.7404, 0.7022], [0.7624, 0.6899], [0.7334, 0.7061], [0.7587, 0.7185], [0.7039, 0.6705], [0.7265, 0.6573], [0.8077, 0.7585], [0.7535, 0.7232], [0.7611, 0.7187], [0.7253, 0.6993], [0.6967, 0.647], [0.7119, 0.6728], [0.6956, 0.665]], "50": [[0.7349, 0.6631], [0.6861, 0.6079], [0.6428, 0.603], [0.7401, 0.6895], [0.7196, 0.6655], [0.732, 0.7083], [0.7162, 0.6428], [0.6892, 0.6365], [0.7305, 0.7066], [0.7508, 0.6926], [0.7007, 0.663], [0.7398, 0.69], [0.7349, 0.6905], [0.674, 0.6145], [0.6818, 0.6195], [0.6911, 0.6508], [0.7207, 0.6986], [0.7182, 0.6975], [0.7367, 0.6757], [0.7127, 0.6792], [0.762, 0.6965], [0.7008, 0.6333], [0.7055, 0.645], [0.7953, 0.7612], [0.7517, 0.6945], [0.7399, 0.6968], [0.7302, 0.6933], [0.67, 0.6187], [0.7072, 0.6598], [0.6778, 0.6528]]}, ORc = [0.7389, 0.682, 0.6533, 0.7337, 0.7226, 0.7371, 0.6924, 0.6913, 0.7657, 0.7305, 0.7259, 0.7417, 0.7138, 0.692, 0.6911, 0.6711, 0.6914, 0.7428, 0.7232, 0.7293, 0.7547, 0.7038, 0.7193, 0.7955, 0.7502, 0.7326, 0.7239, 0.6701, 0.715, 0.7035];
function onK(){ const kk = +document.getElementById("ks").value; setSteps([{i: 29, k: kk, msg: "", line: -1}].concat(Array.from({length: 30}, (_, i) => ({i: i, k: kk, msg: "", line: -1})))); }
const f = v => v.toFixed(3).replace(".", ",");
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 330");
  const P = D[String(s.k)], all = P.flat(), lo = Math.min(...all, ...ORc) - 0.01, hi = Math.max(...all, ...ORc) + 0.01;
  const Y = v => 290 - (v - lo) / (hi - lo) * 260, XA = 200, XP = 440;
  for (let v = Math.ceil(lo * 50) / 50; v <= hi; v += 0.02) { el("line", {x1: 90, y1: Y(v), x2: 560, y2: Y(v), stroke: css("--muted"), "stroke-dasharray": "1 3"}); el("text", {x: 84, y: Y(v) + 4, "text-anchor": "end", "font-size": 10.5}, f(v)); }
  const om = ORc.reduce((a, b) => a + b, 0) / ORc.length;
  el("line", {x1: 90, y1: Y(om), x2: 560, y2: Y(om), stroke: css("--fg"), "stroke-dasharray": "7 4"});
  el("text", {x: 556, y: Y(om) - 5, "text-anchor": "end", "font-size": 10.5}, `oracle átlag ${f(om)}`);
  for (let j = 0; j <= s.i; j++) { const cur = j === s.i;
    el("line", {x1: XA, y1: Y(P[j][0]), x2: XP, y2: Y(P[j][1]), stroke: cur ? css("--hl2") : css("--muted"), "stroke-width": cur ? 2.5 : 0.8});
    el("circle", {cx: XA, cy: Y(P[j][0]), r: cur ? 5 : 3.5, fill: css("--fg")});
    el("circle", {cx: XP, cy: Y(P[j][1]), r: cur ? 5 : 3.5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.4}); }
  const sub = P.slice(0, s.i + 1), ma = sub.reduce((a, p) => a + p[0], 0) / sub.length, mp = sub.reduce((a, p) => a + p[1], 0) / sub.length;
  el("line", {x1: XA - 30, y1: Y(ma), x2: XA + 30, y2: Y(ma), stroke: css("--fg"), "stroke-width": 4});
  el("line", {x1: XP - 30, y1: Y(mp), x2: XP + 30, y2: Y(mp), stroke: css("--fg"), "stroke-width": 4});
  el("text", {x: XA, y: 315, "text-anchor": "middle", "font-size": 12}, "teljes adaton választott");
  el("text", {x: XP, y: 315, "text-anchor": "middle", "font-size": 12}, "Pipeline (csak train)");
  const nb = sub.filter(p => p[0] > p[1]).length;
  status.textContent = `k = ${s.k}, seed ${s.i}: ${f(P[s.i][0])} vs ${f(P[s.i][1])}. Eddigi ${s.i + 1} seed átlaga: ${f(ma)} vs ${f(mp)}, optimizmus +${f(ma - mp)}; a teljes adaton választott ${nb}/${s.i + 1} seeden nagyobb.`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 350);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>

</html>
