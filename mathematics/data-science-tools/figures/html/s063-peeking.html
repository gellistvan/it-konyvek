  const pct=hu(cur[0],3), mc=hu(1.96*cur[1],3);
  document.getElementById("status").textContent=`K = ${K}, ${bonf?"Bonferroni-küszöb (|z| > "+hu(zc,2)+")":"fix küszöb (|z| > 1,96)"}: a hamis pozitív arány ${pct} ± ${mc}. `+
    `A kiválasztott (${ex+1}.) null-kísérlet ${stop===null?"egyik pillantásnál sem lépi át a küszöböt.":"a k = "+stop+" pillantásnál (hamisan) szignifikáns, és itt megállna."}`;
}
