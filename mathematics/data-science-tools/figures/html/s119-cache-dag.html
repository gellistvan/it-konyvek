<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIT/MISS a DAG mentén</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három futás, három task: az első futásban minden MISS, az ismétlésben minden HIT, a harmadikban az extract találat, a filter és az aggregate újraszámolt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet kódja futtatva (Python 3.14.4, Linux), üres cache-sel; a kulcs első 8 hexa jegye gépfüggő (a kulcs a Python-verziót és a platformot is tartalmazza), a HIT/MISS mintázat nem.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"r": -1, "t": -1, "line": -1, "msg": "Üres cache. Három futás jön: only_priority=1, ugyanez ismét, majd only_priority=0."}, {"r": 0, "t": 0, "line": 4, "msg": "1. futás (only_priority=1), extract: CACHE MISS 56ee91bb8689 – üres cache: ehhez a kulcshoz még nincs kimenet."}, {"r": 0, "t": 1, "line": 4, "msg": "1. futás (only_priority=1), filter: CACHE MISS 16c173c2f554 – üres cache: ehhez a kulcshoz még nincs kimenet."}, {"r": 0, "t": 2, "line": 4, "msg": "1. futás (only_priority=1), aggregate: CACHE MISS 3f9135abea18 – üres cache: ehhez a kulcshoz még nincs kimenet."}, {"r": 1, "t": 0, "line": 3, "msg": "2. futás (only_priority=1), extract: CACHE HIT 56ee91bb8689 – a feladatverzió, a paraméter és a bemenet-hash változatlan, a kimenetfájl létezik."}, {"r": 1, "t": 1, "line": 3, "msg": "2. futás (only_priority=1), filter: CACHE HIT 16c173c2f554 – a feladatverzió, a paraméter és a bemenet-hash változatlan, a kimenetfájl létezik."}, {"r": 1, "t": 2, "line": 3, "msg": "2. futás (only_priority=1), aggregate: CACHE HIT 3f9135abea18 – a feladatverzió, a paraméter és a bemenet-hash változatlan, a kimenetfájl létezik."}, {"r": 2, "t": 0, "line": 3, "msg": "3. futás (only_priority=0), extract: CACHE HIT 56ee91bb8689 – a feladatverzió, a paraméter és a bemenet-hash változatlan, a kimenetfájl létezik."}, {"r": 2, "t": 1, "line": 4, "msg": "3. futás (only_priority=0), filter: CACHE MISS ce14ca988e98 – a config (only_priority) megváltozott → új kulcs."}, {"r": 2, "t": 2, "line": 4, "msg": "3. futás (only_priority=0), aggregate: CACHE MISS 89b8081b80fc – a bemenete (a filter új kimenete) más hash-t ad → új kulcs: a változás továbbterjed."}];
const CODE = ["input_hashes[p.name] = sha256_bytes(Path(p).read_bytes())", "key = task_cache_key(task_name, run_fn, config, input_hashes, correction_version)", "out = CACHE_DIR / f\"{task_name}_{key}.json\"", "if out.exists(): print(\"CACHE HIT\", ...); return out, key, True", "print(\"CACHE MISS\", ...); result = run_fn(input_files, config)", "tmp.write_text(json.dumps(result)); tmp.replace(out); return out, key, False"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const RUNS = [[{"task": "extract", "status": "MISS", "key": "56ee91bb8689"}, {"task": "filter", "status": "MISS", "key": "16c173c2f554"}, {"task": "aggregate", "status": "MISS", "key": "3f9135abea18"}], [{"task": "extract", "status": "HIT", "key": "56ee91bb8689"}, {"task": "filter", "status": "HIT", "key": "16c173c2f554"}, {"task": "aggregate", "status": "HIT", "key": "3f9135abea18"}], [{"task": "extract", "status": "HIT", "key": "56ee91bb8689"}, {"task": "filter", "status": "MISS", "key": "ce14ca988e98"}, {"task": "aggregate", "status": "MISS", "key": "89b8081b80fc"}]], TASKS = ["extract", "filter", "aggregate"], ROWL = ["1. futás (=1)", "2. futás (ismétlés)", "3. futás (=0)"];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hm" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--muted")}" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10Z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const X0 = 170, CW = 140, Y0 = 30, RH = 52;
  TASKS.forEach((t, j) => el("text", {x: X0 + (j + .5) * CW, y: Y0 - 10, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, t));
  RUNS.forEach((run, i) => {
    el("text", {x: X0 - 10, y: Y0 + i * RH + RH / 2 + 5, "text-anchor": "end", "font-size": 13}, ROWL[i]);
    run.forEach((c, j) => {
      const done = i < s.r || (i === s.r && j <= s.t), cur = i === s.r && j === s.t, hit = c.status === "HIT", x = X0 + j * CW + 4, y = Y0 + i * RH + 4;
      el("rect", {x: x, y: y, width: CW - 8, height: RH - 8, fill: done ? (hit ? css("--cellhl") : "url(#hm)") : "none", stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": done ? "" : "3 3", opacity: done ? 1 : 0.5});
      if (done) { el("text", {x: x + (CW - 8) / 2, y: y + 19, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, c.status);
        el("text", {x: x + (CW - 8) / 2, y: y + 37, "text-anchor": "middle", "font-size": 12, style: "font-family:ui-monospace,monospace"}, c.key.slice(0, 8)); }
    });
  });
  // DAG a futás szerint
  const r = Math.max(0, s.r), YD = 255, NX = [20, 190, 345, 500], NW = [130, 120, 120, 120], NN = ["orders_mini.csv", "extract", "filter", "aggregate"];
  el("text", {x: 20, y: YD - 40, "font-size": 13, "font-weight": "bold"}, `A futás-DAG (${r + 1}. futás, ${["only_priority=1", "only_priority=1", "only_priority=0"][r]}):`);
  NN.forEach((n, k) => {
    const changed = r === 2 && n === "filter", st = k > 0 ? RUNS[r][k - 1] : null, active = st && s.r === r && k - 1 <= s.t;
    el("rect", {x: NX[k], y: YD - 18, width: NW[k], height: 36, rx: 7, fill: k === 0 ? css("--cellhl") : (active && st.status === "HIT" ? css("--cellhl") : css("--cell")), stroke: active && s.t === k - 1 ? css("--hl2") : css("--line"), "stroke-width": changed ? 4 : 1.3});
    el("text", {x: NX[k] + NW[k] / 2, y: YD + 5, "text-anchor": "middle", "font-size": 13, style: "font-family:ui-monospace,monospace"}, n);
    if (k > 0) { el("line", {x1: NX[k - 1] + NW[k - 1], y1: YD, x2: NX[k] - 3, y2: YD, stroke: css("--fg"), "stroke-width": 1.3, "marker-end": "url(#ah)"});
      el("text", {x: (NX[k - 1] + NW[k - 1] + NX[k]) / 2, y: YD - 8, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "hash");
      if (active) el("text", {x: NX[k] + NW[k] / 2, y: YD + 36, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, st.status); }
  });
  if (r === 2) el("text", {x: 405, y: YD + 58, "text-anchor": "middle", "font-size": 11.5}, "vastag keret: a megváltozott paraméter (only_priority 1 → 0)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
