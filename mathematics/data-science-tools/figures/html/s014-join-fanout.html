<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join-többszöröződés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A tételsorai: <input id="nA" type="range" min="0" max="4" step="1" value="1" oninput="upd()" aria-label="A tételsorai:"> <span id="nAv">1</span></label> <label>B tételsorai: <input id="nB" type="range" min="0" max="5" step="1" value="3" oninput="upd()" aria-label="B tételsorai:"> <span id="nBv">3</span></label> <label>A díja: <input id="fA" type="range" min="0" max="500" step="50" value="200" oninput="upd()" aria-label="A díja:"> <span id="fAv">200</span></label> <label>B díja: <input id="fB" type="range" min="0" max="500" step="50" value="200" oninput="upd()" aria-label="B díja:"> <span id="fBv">200</span></label> </div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két rendeléssor és négy tételsor összekapcsolva: a B rendelés 200 centes szállítási díja háromszor jelenik meg, ezért a soronkénti összeg 800 a helyes 400 helyett."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet mini példája (mini_orders, mini_items); a merge tiszta Python átirata. A csúszkákkal a tételsorok száma és a díj változtatható; a hibás összeg = Σ (tételsorok száma · díj).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"nA": 1, "nB": 3, "fA": 200, "fB": 200, "line": 0, "msg": ""}, {"nA": 1, "nB": 3, "fA": 200, "fB": 200, "line": 1, "hl": true, "msg": ""}, {"nA": 1, "nB": 3, "fA": 200, "fB": 200, "line": 2, "msg": ""}];
const CODE = ["mini_merged = mini_orders.merge(mini_items, on=\"order_id\", how=\"inner\", validate=\"one_to_many\")", "mini_merged[\"shipping_fee_minor\"].sum()   # hibás: a díj tételsoronként ismétlődik", "mini_orders[\"shipping_fee_minor\"].sum()   # helyes: rendelésenként egyszer"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function mk(nA, nB){ const it = []; for (let i = 1; i <= nA; i++) it.push(["A", i]); for (let i = 1; i <= nB; i++) it.push(["B", i]); return it; }
function g(id){ return +document.getElementById(id).value; }
function upd(){ ["nA", "nB", "fA", "fB"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  const p = {nA: g("nA"), nB: g("nB"), fA: g("fA"), fB: g("fB")};
  setSteps([Object.assign({line: 0}, p), Object.assign({line: 1, hl: true}, p), Object.assign({line: 2}, p)]); }
function cell(x, y, w, t, o){ o = o || {};
  const r = el("rect", {x: x, y: y, width: w, height: 22, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 0.9});
  if (o.dash) r.setAttribute("stroke-dasharray", "5 3");
  el("text", {x: x + w / 2, y: y + 15, "text-anchor": "middle", "font-size": 11.5, style: "font-family:ui-monospace,monospace" + (o.bold ? ";font-weight:bold" : "")}, t); }
function render(s){
  svg.innerHTML = ""; const items = mk(s.nA, s.nB), orders = [["A", s.fA], ["B", s.fB]];
  const M = []; orders.forEach(o => items.forEach(i => { if (i[0] === o[0]) M.push([o[0], o[1], i[1]]); }));
  const wrong = M.reduce((a, r) => a + r[1], 0), right = s.fA + s.fB;
  const iy = 154, H = Math.max(iy + 42 + 22 * items.length, 58 + 22 * M.length + 60); svg.setAttribute("viewBox", `0 0 760 ${H}`);
  el("text", {x: 14, y: 26, "font-size": 12.5, style: "font-family:ui-monospace,monospace;font-weight:bold"}, "mini_orders");
  cell(14, 36, 80, "order_id", {fill: css("--cellhl"), bold: true}); cell(94, 36, 150, "shipping_fee_minor", {fill: css("--cellhl"), bold: true});
  orders.forEach((o, i) => { cell(14, 58 + 22 * i, 80, o[0]); cell(94, 58 + 22 * i, 150, String(o[1])); });
  el("text", {x: 14, y: 124, "font-size": 12}, `díjak összege: ${s.fA} + ${s.fB} = ${right}`);
  el("text", {x: 14, y: iy, "font-size": 12.5, style: "font-family:ui-monospace,monospace;font-weight:bold"}, "mini_items");
  cell(14, iy + 10, 80, "order_id", {fill: css("--cellhl"), bold: true}); cell(94, iy + 10, 70, "line_id", {fill: css("--cellhl"), bold: true});
  items.forEach((it, i) => cell(14, iy + 32 + 22 * i, 80, it[0]) || cell(94, iy + 32 + 22 * i, 70, String(it[1])));
  el("text", {x: 400, y: 26, "font-size": 12.5, style: "font-family:ui-monospace,monospace;font-weight:bold"}, `mini_merged (${M.length} sor)`);
  [["order_id", 80], ["shipping_fee_minor", 150], ["line_id", 70]].reduce((x, c) => { cell(x, 36, c[1], c[0], {fill: css("--cellhl"), bold: true}); return x + c[1]; }, 400);
  const cnt = {A: s.nA, B: s.nB};
  M.forEach((r, i) => {
    const y = 58 + 22 * i, dup = cnt[r[0]] > 1;
    cell(400, y, 80, r[0]); cell(480, y, 150, String(r[1]), {dash: dup, sw: dup ? 2 : 0.9, fill: dup ? css("--cellhl") : css("--cell"), stroke: dup && s.hl ? css("--hl2") : css("--line")}); cell(630, y, 70, String(r[2]));
    const oi = r[0] === "A" ? 0 : 1, ii = items.findIndex(t => t[0] === r[0] && t[1] === r[2]);
    el("line", {x1: 244, y1: 69 + 22 * oi, x2: 398, y2: y + 11, stroke: css("--fg"), "stroke-width": 1.2});
    el("line", {x1: 164, y1: iy + 43 + 22 * ii, x2: 398, y2: y + 14, stroke: css("--muted"), "stroke-width": 0.9, "stroke-dasharray": "1.5 2.5"});
  });
  ["A", "B"].forEach(k => { const rows = M.map((r, i) => [r, i]).filter(p => p[0][0] === k); if (rows.length > 1) {
    const y0 = 58 + 22 * rows[0][1], y1 = 58 + 22 * rows[rows.length - 1][1] + 22;
    el("line", {x1: 706, y1: y0 + 2, x2: 706, y2: y1 - 2, stroke: css("--fg"), "stroke-width": 1.6});
    el("text", {x: 712, y: (y0 + y1) / 2 + 6, "font-size": 16, style: "font-weight:bold"}, `×${rows.length}`); } });
  const ty = 58 + 22 * M.length + 24;
  el("text", {x: 400, y: ty, "font-size": 12, style: "font-family:ui-monospace,monospace;font-weight:bold", fill: s.hl ? css("--hl2") : css("--fg")}, `soronkénti összeg = ${wrong}  ${wrong !== right ? "✗ hibás" : "(itt véletlenül egyezik)"}`);
  el("text", {x: 400, y: ty + 20, "font-size": 12, style: "font-family:ui-monospace,monospace"}, `rendelésenkénti összeg = ${right}  ✓ helyes`);
  status.textContent = [`A one-to-many join ${M.length} sort ad: minden tételsor megkapja a rendelése díját (A: ${s.nA}×, B: ${s.nB}×).`,
    `A merged tábla díjoszlopának összege ${wrong} = ${s.nA}·${s.fA} + ${s.nB}·${s.fB}: a díj annyiszor számít, ahány tételsora van a rendelésnek.`,
    `A helyes, rendelésszintű összeg ${right}: a díjat a mini_orders táblán (vagy a join előtt) kell összegezni.`][s.line];
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
