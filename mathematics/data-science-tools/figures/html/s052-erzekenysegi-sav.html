<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiány: érzékenységi sáv</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label>1. hiányzó érték y₁: <input id="y1" type="range" min="0" max="1" step="0.05" value="0" oninput="draw()" style="width:200px" aria-label="1. hiányzó érték y₁:"> <output id="y1v"></output></label><label>2. hiányzó érték y₂: <input id="y2" type="range" min="0" max="1" step="0.05" value="0" oninput="draw()" style="width:200px" aria-label="2. hiányzó érték y₂:"> <output id="y2v"></output></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 220" role="img" aria-label="Számegyenes az [1/3; 1] sávval, a megfigyelt átlag és a két világ jelölésével; a csúszkákkal választott hiányzó értékekhez tartozó teljes átlag a sávon belül mozog."></svg>
<p class="small">A fejezet bounds(1, 1, 2) példája: min 1/3 (MAR-világ, hiányzók 0, 0), max 1 (MNAR-világ, hiányzók 1, 1), megfigyelt átlag 1,0. Kezdőállapot: y₁ = y₂ = 0 (MAR-világ).</p>
<script>
const D = {};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function draw(){
  const y1 = val("y1"), y2 = val("y2"); show("y1v", F(y1, 2)); show("y2v", F(y2, 2));
  const m = (1 + y1 + y2) / 3;
  svg.innerHTML = ""; hatchDefs(svg);
  const X = v => 60 + v * 620, y0 = 130;
  E(svg, "rect", {x: X(1 / 3), y: y0 - 18, width: X(1) - X(1 / 3), height: 36, fill: css("--cellhl"), stroke: "none"});
  E(svg, "rect", {x: X(1 / 3), y: y0 - 18, width: X(1) - X(1 / 3), height: 36, fill: "url(#hd)", stroke: css("--fg")});
  E(svg, "line", {x1: X(0), y1: y0, x2: X(1.05), y2: y0, stroke: css("--fg"), "stroke-width": 1.2});
  [0, 0.25, 0.5, 0.75, 1].forEach(t => { E(svg, "line", {x1: X(t), y1: y0 + 18, x2: X(t), y2: y0 + 24, stroke: css("--fg")}); E(svg, "text", {x: X(t), y: y0 + 38, "text-anchor": "middle", "font-size": 12}, F(t)); });
  E(svg, "text", {x: X(1 / 3), y: y0 + 38, "text-anchor": "middle", "font-size": 12}, "1/3");
  E(svg, "circle", {cx: X(1 / 3), cy: y0, r: 8, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  E(svg, "rect", {x: X(1) - 8, y: y0 - 8, width: 16, height: 16, fill: css("--fill2"), stroke: css("--fg"), "stroke-width": 2});
  E(svg, "path", {d: `M ${X(1)} ${y0 - 72} l 9 9 l -9 9 l -9 -9 z`, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  E(svg, "text", {x: X(1) - 16, y: y0 - 59, "text-anchor": "end", "font-size": 12}, "◇ megfigyelt átlag 1,0");
  E(svg, "text", {x: X(1 / 3), y: y0 + 62, "text-anchor": "middle", "font-size": 12}, "○ MAR: 1/3");
  E(svg, "text", {x: X(1), y: y0 + 62, "text-anchor": "middle", "font-size": 12}, "□ MNAR: 1");
  E(svg, "line", {x1: X(m), y1: y0 - 40, x2: X(m), y2: y0 + 18, stroke: css("--hl2"), "stroke-width": 3});
  E(svg, "text", {x: X(m), y: y0 - 46, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "teljes átlag " + F(m, 3));
  E(svg, "text", {x: 60, y: 24, "font-size": 12.5}, "Megfigyelt tábla: X₀-nál Y = 1, X₁-nél Y kétszer hiányzik (y₁, y₂ ∈ [0; 1]).");
  status.textContent = `Ha a két hiányzó érték y₁ = ${F(y1, 2)} és y₂ = ${F(y2, 2)}, a teljes átlag (1 + y₁ + y₂)/3 = ${F(m, 3)}; a megfigyelt átlag mindig 1,0, a teljes átlag pedig az [1/3; 1] sávban bárhol lehet.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
