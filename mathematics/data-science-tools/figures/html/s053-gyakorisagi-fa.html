<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayes: gyakorisági fa és PPV</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label>szenzitivitás: <input id="se" type="range" min="0.5" max="1" step="0.01" value="0.9" oninput="draw()" style="width:140px" aria-label="szenzitivitás:"> <output id="sev"></output></label><label>specificitás: <input id="sp" type="range" min="0.8" max="1" step="0.005" value="0.95" oninput="draw()" style="width:140px" aria-label="specificitás:"> <output id="spv"></output></label><label>prevalencia (%): <input id="pv" type="range" min="0" max="25" step="0.5" value="1" oninput="draw()" style="width:160px" aria-label="prevalencia (%):"> <output id="pvv"></output></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="Bal oldalon a 10 000 rendelés természetes gyakoriságú fája a választott paraméterekkel, a riasztott levelek kiemelve; jobb oldalon a PPV a prevalencia függvényében, a választott pont és a labor késési aránya jelölve."></svg>
<p class="small">Kezdőállapot: a fejezet példája (szenzitivitás 0,90, specificitás 0,95, prevalencia 1%): 90 valódi és 495 hamis riasztás, PPV = 2/13 ≈ 0,1538. A 2×2 alfejezet 0,99-es szenzitivitása is beállítható. Várható darabszámok (kerekítve), nem mérés.</p>
<script>
const D = {"plab": 0.20458333333333334};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function draw(){
  const se = val("se"), sp = val("sp"), pv = val("pv") / 100;
  show("sev", F(se, 2)); show("spv", F(sp, 2)); show("pvv", F(pv * 100, 1) + "%");
  const n = 10000, Lr = Math.round(pv * n), tp = Math.round(Lr * se), fn = Lr - tp, fp = Math.round((n - Lr) * (1 - sp)), tn = n - Lr - fp;
  const ppv = tp + fp ? tp / (tp + fp) : NaN;
  svg.innerHTML = ""; hatchDefs(svg);
  const fmt = v => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const box = (x, y, w, t, hl) => { E(svg, "rect", {x: x - w / 2, y: y - 16, width: w, height: 32, rx: 8, fill: hl ? css("--cellhl") : css("--cell"), stroke: css("--fg"), "stroke-width": hl ? 3 : 1.2});
    if (hl) E(svg, "rect", {x: x - w / 2, y: y - 16, width: w, height: 32, rx: 8, fill: "url(#hd)", opacity: 0.35});
    E(svg, "text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 13, "font-weight": hl ? "bold" : "normal"}, t); };
  const ln = (x0, y0, x1, y1, t) => { E(svg, "line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--fg")}); E(svg, "text", {x: (x0 + x1) / 2 + (x1 > x0 ? 6 : -6), y: (y0 + y1) / 2, "text-anchor": x1 > x0 ? "start" : "end", "font-size": 11.5}, t); };
  ln(190, 46, 95, 104, F(pv * 100, 1) + "%"); ln(190, 46, 285, 104, F(100 - pv * 100, 1) + "%");
  ln(95, 136, 50, 194, F(se * 100, 0) + "%"); ln(95, 136, 140, 194, F(100 - se * 100, 0) + "%");
  ln(285, 136, 240, 194, F(100 - sp * 100, 0) + "%"); ln(285, 136, 330, 194, F(sp * 100, 0) + "%");
  box(190, 30, 150, "10 000 rendelés"); box(95, 120, 120, "késik: " + fmt(Lr)); box(285, 120, 150, "nem késik: " + fmt(n - Lr));
  box(50, 210, 90, "riaszt " + fmt(tp), true); box(140, 210, 84, "nem " + fmt(fn)); box(240, 210, 90, "riaszt " + fmt(fp), true); box(330, 210, 90, "nem " + fmt(tn));
  E(svg, "text", {x: 190, y: 262, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, `P(L | +) = ${fmt(tp)} / (${fmt(tp)} + ${fmt(fp)}) = ${isFinite(ppv) ? F(ppv * 100, 1) + "%" : "nem értelmezhető"}`);
  const A = Axes(svg, {x: 450, y: 20, w: 290, h: 230, x0: 0, x1: 25, y0: 0, y1: 1, xt: [0, 5, 10, 15, 20, 25], yt: [0, 0.25, 0.5, 0.75, 1], xl: "prevalencia (%)", yl: "PPV", ylo: 38, grid: true});
  const xs = [], ys = []; for (let i = 1; i <= 250; i++) { const p = i / 1000; xs.push(p * 100); ys.push(se * p / (se * p + (1 - sp) * (1 - p))); }
  path(svg, A, xs, ys, {"stroke-width": 2});
  E(svg, "line", {x1: A.X(0), y1: A.Y(se), x2: A.X(25), y2: A.Y(se), stroke: css("--muted"), "stroke-dasharray": "2 3"});
  E(svg, "text", {x: A.X(25), y: A.Y(se) - 5, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "érzékenység");
  E(svg, "line", {x1: A.X(D.plab * 100), y1: A.Y(0), x2: A.X(D.plab * 100), y2: A.Y(1), stroke: css("--hl2"), "stroke-dasharray": "6 4"});
  E(svg, "text", {x: A.X(D.plab * 100) + 4, y: A.Y(0.06), "font-size": 11, fill: css("--hl2")}, "labor " + F(D.plab * 100, 1) + "%");
  const pc = Math.min(pv, 0.25), yc = se * pc / (se * pc + (1 - sp) * (1 - pc));
  E(svg, "circle", {cx: A.X(pc * 100), cy: A.Y(yc), r: 6, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.4});
  status.textContent = `Szenzitivitás ${F(se, 2)}, specificitás ${F(sp, 2)}, prevalencia ${F(pv * 100, 1)}%: TP = ${fmt(tp)}, FP = ${fmt(fp)}, FN = ${fmt(fn)}, TN = ${fmt(tn)}; PPV = ${isFinite(ppv) ? F(ppv, 4) : "–"} (a szenzitivitás nem PPV).`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
