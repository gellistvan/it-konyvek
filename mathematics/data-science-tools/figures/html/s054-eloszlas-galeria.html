<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eloszlás-galéria</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill:#cfcfcf;--fill2:#8c8c8c}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill:#555;--fill2:#999}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:inline-flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
output{font-variant-numeric:tabular-nums;min-width:4.5em;display:inline-block}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek"><label>n: <input id="n" type="range" min="10" max="200" step="1" value="100" oninput="draw()" style="width:110px" aria-label="n:"> <output id="nv"></output></label><label>p: <input id="p" type="range" min="0.02" max="0.98" step="0.01" value="0.22" oninput="draw()" style="width:110px" aria-label="p:"> <output id="pv"></output></label><label>λ: <input id="lam" type="range" min="0.5" max="40" step="0.5" value="12" oninput="draw()" style="width:110px" aria-label="λ:"> <output id="lamv"></output></label><label>μ: <input id="mu" type="range" min="-3" max="3" step="0.1" value="0" oninput="draw()" style="width:90px" aria-label="μ:"> <output id="muv"></output></label><label>σ: <input id="sg" type="range" min="0.3" max="3" step="0.1" value="1" oninput="draw()" style="width:90px" aria-label="σ:"> <output id="sgv"></output></label><label>μ_l: <input id="ml" type="range" min="1" max="5" step="0.1" value="3.5" oninput="draw()" style="width:90px" aria-label="μ_l:"> <output id="mlv"></output></label><label>σ_l: <input id="sl" type="range" min="0.1" max="1.5" step="0.05" value="0.7" oninput="draw()" style="width:90px" aria-label="σ_l:"> <output id="slv"></output></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 400" role="img" aria-label="Négy panel: a binomiális és a Poisson tömegfüggvény oszlopokkal, a normális és a lognormális sűrűség vonallal, jelölt várható értékkel, illetve a lognormálisnál módusszal, mediánnal és átlaggal; a paraméterek csúszkával állíthatók."></svg>
<p class="small">Kezdőállapot: a fejezet paraméterei – Binomial(100; 0,22), P(X = 20) = 0,0881; Poisson(12); N(0; 1); Lognormal(3,5; 0,7): módusz 20,29, medián 33,12, átlag 42,31. A tömegfüggvény a log-gamma függvénnyel számolva.</p>
<script>
const D = {};
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function F(v, d){if(!isFinite(v))return "–";const s=(d===undefined)?String(+(+v).toPrecision(6)):(+v).toFixed(d);return s.replace(".",",").replace("-","−");}
const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function FE(v, d){if(!isFinite(v)||v===0)return F(v,d);const e=Math.floor(Math.log10(Math.abs(v))+1e-12);const m=v/Math.pow(10,e);return F(m,d===undefined?2:d)+"·10"+String(e).split("").map(c=>SUP[c]).join("");}
function Axes(s, o){
  const lx=o.xlog?Math.log10:(v=>v), ly=o.ylog?Math.log10:(v=>v);
  const a0=lx(o.x0), a1=lx(o.x1), b0=ly(o.y0), b1=ly(o.y1);
  const X=v=>o.x+(lx(v)-a0)/(a1-a0)*o.w, Y=v=>o.y+o.h-(ly(v)-b0)/(b1-b0)*o.h;
  const fg=css("--fg"), mu=css("--muted");
  (o.xt||[]).forEach(t=>{const xx=X(t);if(o.grid)E(s,"line",{x1:xx,y1:o.y,x2:xx,y2:o.y+o.h,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:xx,y1:o.y+o.h,x2:xx,y2:o.y+o.h+4,stroke:fg});E(s,"text",{x:xx,y:o.y+o.h+16,"text-anchor":"middle","font-size":11},o.xf?o.xf(t):F(t));});
  (o.yt||[]).forEach(t=>{const yy=Y(t);if(o.grid)E(s,"line",{x1:o.x,y1:yy,x2:o.x+o.w,y2:yy,stroke:mu,"stroke-width":0.4,"stroke-dasharray":"2 3"});E(s,"line",{x1:o.x-4,y1:yy,x2:o.x,y2:yy,stroke:fg});E(s,"text",{x:o.x-6,y:yy+4,"text-anchor":"end","font-size":11},o.yf?o.yf(t):F(t));});
  E(s,"line",{x1:o.x,y1:o.y+o.h,x2:o.x+o.w,y2:o.y+o.h,stroke:fg});
  E(s,"line",{x1:o.x,y1:o.y,x2:o.x,y2:o.y+o.h,stroke:fg});
  if(o.xl)E(s,"text",{x:o.x+o.w/2,y:o.y+o.h+32,"text-anchor":"middle","font-size":12},o.xl);
  if(o.yl)E(s,"text",{x:o.x-(o.ylo||44),y:o.y+o.h/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 ${o.x-(o.ylo||44)} ${o.y+o.h/2})`},o.yl);
  if(o.title)E(s,"text",{x:o.x,y:o.y-8,"font-size":12.5,"font-weight":"bold"},o.title);
  return {X:X,Y:Y,o:o};
}
function path(s, A, xs, ys, a){let d="",pen=false;for(let i=0;i<xs.length;i++){const ok=isFinite(xs[i])&&isFinite(ys[i])&&(!A.o.ylog||ys[i]>0)&&(!A.o.xlog||xs[i]>0);if(!ok){pen=false;continue;}d+=(pen?" L ":" M ")+A.X(xs[i]).toFixed(2)+" "+A.Y(ys[i]).toFixed(2);pen=true;}const at=Object.assign({fill:"none",stroke:css("--fg"),"stroke-width":1.6},a||{});at.d=d;return E(s,"path",at);}
function hatchDefs(s){const d=document.createElementNS(NS,"defs");const fg=css("--fg");d.innerHTML=`<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;s.insertBefore(d,s.firstChild);}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function val(id){return +document.getElementById(id).value;}
function show(id, txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

function lgam(z){ const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let x = z, y = z, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015; for (let j = 0; j < 6; j++) s += g[j] / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function binom(k, n, p){ if (k < 0 || k > n) return 0; if (p <= 0) return k === 0 ? 1 : 0; if (p >= 1) return k === n ? 1 : 0;
  return Math.exp(lgam(n + 1) - lgam(k + 1) - lgam(n - k + 1) + k * Math.log(p) + (n - k) * Math.log(1 - p)); }
function pois(k, l){ return Math.exp(k * Math.log(l) - l - lgam(k + 1)); }
function bars(A, ks, ps, fill){ const w = (A.X(1) - A.X(0)) * 0.8; ks.forEach((k, i) => E(svg, "rect", {x: A.X(k) - w / 2, y: A.Y(ps[i]), width: w, height: A.Y(0) - A.Y(ps[i]), fill: fill(k), stroke: css("--fg"), "stroke-width": 0.5})); }
function vline(A, x, dash, txt, dy){ E(svg, "line", {x1: A.X(x), y1: A.o.y, x2: A.X(x), y2: A.o.y + A.o.h, stroke: css("--fg"), "stroke-width": 1.3, "stroke-dasharray": dash});
  if (txt) E(svg, "text", {x: A.X(x) + 4, y: A.o.y + 12 + (dy || 0), "font-size": 11}, txt); }
function draw(){
  const n = val("n"), p = val("p"), lam = val("lam"), mu = val("mu"), sg = val("sg"), ml = val("ml"), sl = val("sl");
  show("nv", String(n)); show("pv", F(p, 2)); show("lamv", F(lam, 1)); show("muv", F(mu, 1)); show("sgv", F(sg, 1)); show("mlv", F(ml, 1)); show("slv", F(sl, 2));
  svg.innerHTML = ""; hatchDefs(svg);
  // (a) binomiális
  const m = n * p, sd = Math.sqrt(n * p * (1 - p)), k0 = Math.max(0, Math.floor(m - 4 * sd - 1)), k1 = Math.min(n, Math.ceil(m + 4 * sd + 1));
  const ks = [], ps = []; for (let k = k0; k <= k1; k++) { ks.push(k); ps.push(binom(k, n, p)); }
  const A = Axes(svg, {x: 55, y: 28, w: 300, h: 140, x0: k0 - 1, x1: k1 + 1, y0: 0, y1: Math.max.apply(null, ps) * 1.25, xt: [k0, Math.round(m), k1], yt: [0], title: `(a) Binomial(${n}; ${F(p, 2)}) – PMF`});
  bars(A, ks, ps, k => k === 20 ? css("--fg") : css("--cellhl")); vline(A, m, "6 4", "átlag " + F(m, 2));
  // (b) Poisson
  const pk = [], pp = [], pk1 = Math.ceil(lam + 5 * Math.sqrt(lam) + 2); for (let k = 0; k <= pk1; k++) { pk.push(k); pp.push(pois(k, lam)); }
  const B = Axes(svg, {x: 440, y: 28, w: 300, h: 140, x0: -1, x1: pk1 + 1, y0: 0, y1: Math.max.apply(null, pp) * 1.25, xt: [0, Math.round(lam), pk1], yt: [0], title: `(b) Poisson(${F(lam, 1)}) – PMF`});
  E(svg, "rect", {x: B.X(lam - Math.sqrt(lam)), y: B.o.y, width: B.X(lam + Math.sqrt(lam)) - B.X(lam - Math.sqrt(lam)), height: B.o.h, fill: "url(#dots)", opacity: 0.35});
  bars(B, pk, pp, () => "url(#hd)"); vline(B, lam, "6 4", "átlag = variancia = " + F(lam, 1));
  // (c) normális
  const C = Axes(svg, {x: 55, y: 225, w: 300, h: 140, x0: -6, x1: 6, y0: 0, y1: 0.45 / Math.min(sg, 1) * 1.05, xt: [-6, -3, 0, 3, 6], yt: [0], title: `(c) N(${F(mu, 1)}; ${F(sg, 1)}) – PDF`});
  const xs = [], ys = []; for (let i = 0; i <= 300; i++) { const x = -6 + 12 * i / 300; xs.push(x); ys.push(Math.exp(-0.5 * ((x - mu) / sg) ** 2) / (sg * Math.sqrt(2 * Math.PI))); }
  path(svg, C, xs, ys, {"stroke-width": 2}); vline(C, mu, "6 4", "f(μ) = " + F(1 / (sg * Math.sqrt(2 * Math.PI)), 3));
  // (d) lognormális
  const mo = Math.exp(ml - sl * sl), me = Math.exp(ml), mn = Math.exp(ml + sl * sl / 2), xm = Math.min(Math.max(200, mn * 3), 2000);
  const lx = [], ly = []; for (let i = 1; i <= 400; i++) { const x = xm * i / 400; lx.push(x); ly.push(Math.exp(-0.5 * ((Math.log(x) - ml) / sl) ** 2) / (x * sl * Math.sqrt(2 * Math.PI))); }
  const Dp = Axes(svg, {x: 440, y: 225, w: 300, h: 140, x0: 0, x1: xm, y0: 0, y1: Math.max.apply(null, ly) * 1.3, xt: [0, Math.round(xm / 2), Math.round(xm)], yt: [0], title: `(d) Lognormal(${F(ml, 1)}; ${F(sl, 2)}) – PDF`});
  path(svg, Dp, lx, ly, {"stroke-width": 2}); vline(Dp, mo, "9 3 2 3", "módusz " + F(mo, 1), 0); vline(Dp, me, "", "medián " + F(me, 1), 16); vline(Dp, mn, "6 4", "átlag " + F(mn, 2), 32);
  status.textContent = `Binomiális: átlag ${F(m, 2)}, variancia ${F(n * p * (1 - p), 2)}, P(X = 20) = ${F(binom(20, n, p), 4)}; Poisson: átlag = variancia = ${F(lam, 1)}; lognormális: módusz ${F(mo, 2)} < medián ${F(me, 2)} < átlag ${F(mn, 2)}.`;
}

draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
