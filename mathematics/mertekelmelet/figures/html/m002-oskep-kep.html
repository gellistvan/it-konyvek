<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Őskép és kép: f(x) = x²</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A B = (a,b] sáv">
  <label for="a">B = (a, b]: a</label><input id="a" type="range" min="0" max="6" step="0.25" value="1"><b id="av"></b>
  <label for="b">b</label><input id="b" type="range" min="0" max="6" step="0.25" value="4"><b id="bv"></b>
</div>
<div class="ctl" role="group" aria-label="Az A = [c,d] intervallum">
  <label for="c">A = [c, d]: c</label><input id="c" type="range" min="-2.5" max="2.5" step="0.25" value="-1"><b id="cv"></b>
  <label for="d">d</label><input id="d" type="range" min="-2.5" max="2.5" step="0.25" value="2"><b id="dv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 350" role="img" aria-label="Az x négyzet parabolája két panelen: balra egy vízszintes sáv ősképe két szakasz az x-tengelyen, jobbra egy x-intervallum képe szakasz az y-tengelyen"></svg>
<p class="small">Teli kör: a végpont benne van, üres kör: nincs. Az őskép {x : a &lt; x² ≤ b} = [−√b, −√a) ∪ (√a, √b] (a = 0 esetén a 0 kimarad); a kép [c,d]-ből [min, max] x², ha 0 ∈ [c,d], akkor az alsó végpont 0. A grafikonon kívül eső részek levágva.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function nice(x){ const r = Math.round(x*1000)/1000; let s = String(r); return s.replace(".", ",").replace("-", "−"); }
function rt(v){ const s = Math.sqrt(v); return Math.abs(s - Math.round(s)) < 1e-12 ? nice(Math.round(s)) : "√" + nice(v) + "≈" + nice(s); }
function draw(){
  let a = +$("a").value, b = +$("b").value, c = +$("c").value, d = +$("d").value;
  if (a >= b) { if (this && this.id === "a") { b = Math.min(6, a + 0.25); a = Math.min(a, b - 0.25); } else { a = Math.max(0, b - 0.25); b = Math.max(b, a + 0.25); } $("a").value = a; $("b").value = b; }
  if (c > d) { if (this && this.id === "c") d = c; else c = d; $("c").value = c; $("d").value = d; }
  ["a","b","c","d"].forEach(id => $(id + "v").textContent = nice(+$(id).value));
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), bg = css("--bg");
  const panel = (ox, title) => {
    const L = ox + 20, R = ox + 270, T = 34, B = 330;
    const X = x => L + (R - L) * (x + 2.6) / 5.2, Y = y => B - (B - T) * (y + 0.6) / 7.0;
    el("text", {x: (L + R) / 2, y: 18, "text-anchor": "middle", "font-size": 13}, title);
    el("line", {x1: L, y1: Y(0), x2: R, y2: Y(0), stroke: fg});
    el("line", {x1: X(0), y1: T, x2: X(0), y2: B, stroke: fg});
    [-2, -1, 1, 2].forEach(t => el("text", {x: X(t), y: Y(0) + 32, "text-anchor": "middle", "font-size": 11, fill: mu}, nice(t)));
    [1, 4].forEach(t => el("text", {x: X(0) - 4, y: Y(t) - 3, "text-anchor": "end", "font-size": 11, fill: mu}, nice(t)));
    const pts = []; for (let i = 0; i <= 200; i++) { const x = -2.5 + 5 * i / 200; pts.push(X(x).toFixed(1) + "," + Y(x * x).toFixed(1)); }
    el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2.2});
    return {X, Y, L, R, T, B};
  };
  const dot = (x, y, closed, col) => el("circle", {cx: x, cy: y, r: 5, fill: closed ? (col || fg) : bg, stroke: col || fg, "stroke-width": 2});
  // őskép
  const P = panel(0, "Őskép f⁻¹((a,b])");
  const yb = Math.min(b, 6.3), ya = Math.min(a, 6.3);
  el("rect", {x: P.L, y: P.Y(yb), width: P.R - P.L, height: P.Y(ya) - P.Y(yb), fill: css("--hl2"), "fill-opacity": 0.15});
  el("line", {x1: P.L, y1: P.Y(a), x2: P.R, y2: P.Y(a), stroke: css("--hl2"), "stroke-dasharray": "6 4", "stroke-width": 1.5});
  el("line", {x1: P.L, y1: P.Y(b), x2: P.R, y2: P.Y(b), stroke: css("--hl2"), "stroke-width": 1.5});
  const sa = Math.sqrt(a), sb = Math.sqrt(b), yy = P.Y(0) + 14;
  [[-sb, -sa, true, false], [sa, sb, false, true]].forEach(([lo, hi, lc, rc]) => {
    const vis = Math.min(hi, 2.55), vlo = Math.max(lo, -2.55);
    if (vis > vlo) el("line", {x1: P.X(vlo), y1: yy, x2: P.X(vis), y2: yy, stroke: css("--hl"), "stroke-width": 6});
    [[lo, lc], [hi, rc]].forEach(([x, cl]) => { if (Math.abs(x) <= 2.55) { el("line", {x1: P.X(x), y1: yy, x2: P.X(x), y2: P.Y(x * x), stroke: mu, "stroke-dasharray": "2 3"}); dot(P.X(x), yy, cl, css("--hl")); } });
  });
  // kép
  const Q = panel(290, "Kép f([c,d])");
  const lo = (c <= 0 && 0 <= d) ? 0 : Math.min(c * c, d * d), hi = Math.max(c * c, d * d);
  const xx = Q.X(-2.45);
  el("line", {x1: Q.X(c), y1: Q.Y(0) + 14, x2: Q.X(d), y2: Q.Y(0) + 14, stroke: css("--hl"), "stroke-width": 6});
  dot(Q.X(c), Q.Y(0) + 14, true, css("--hl")); dot(Q.X(d), Q.Y(0) + 14, true, css("--hl"));
  el("line", {x1: xx, y1: Q.Y(lo), x2: xx, y2: Q.Y(Math.min(hi, 6.3)), stroke: css("--hl2"), "stroke-width": 6});
  dot(xx, Q.Y(lo), true, css("--hl2")); if (hi <= 6.3) dot(xx, Q.Y(hi), true, css("--hl2"));
  for (let i = 0; i <= 6; i++) { const x = c + (d - c) * i / 6; el("line", {x1: Q.X(x), y1: Q.Y(x * x), x2: xx, y2: Q.Y(x * x), stroke: mu, "stroke-dasharray": "2 3"}); }
  const pre = a === 0 ? "[−" + rt(b) + ",0) ∪ (0," + rt(b) + "]" : "[−" + rt(b) + ",−" + rt(a) + ") ∪ (" + rt(a) + "," + rt(b) + "]";
  $("status").textContent = "f⁻¹((" + nice(a) + "," + nice(b) + "]) = " + pre + "   |   f([" + nice(c) + "," + nice(d) + "]) = [" + nice(lo) + "," + nice(hi) + "]";
}
["a","b","c","d"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
