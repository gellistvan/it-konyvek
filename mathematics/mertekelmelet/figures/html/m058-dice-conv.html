<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két kocka: diszkrét konvolúció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl">
  <label><input id="load" type="checkbox"> cinkelt első kocka ((d) feladat): p_1…p_6 állítható</label>
  <button id="reset">szabályos kocka</button>
</div>
<div class="ctl" id="pw" role="group" aria-label="Az első kocka súlyai (normalizálva)"></div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="6×6 táblázat a két dobás összegével; az azonos összegek átlósan helyezkednek el, mellette az összeg eloszlásának oszlopai"></svg>
<p class="small">Minden (a, b) cella súlya p_a·q_b (szabályos kockánál 1/36); P(összeg = n) az n anti-diagonális celláinak súlyösszege. Cinkelt módban a p-csúszkák relatív súlyok, a program normalizálja őket. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let sel = 7;
const CX = 20, CY = 40, C = 40, BX = 345, BW = 205, BY = 40, BH = 230;
const pw = $("pw");
for (let k = 1; k <= 6; k++) { pw.insertAdjacentHTML("beforeend", '<label for="p' + k + '">p' + k + '</label><input id="p' + k + '" type="range" min="0" max="1" step="0.01" value="0.5" style="min-width:60px;max-width:90px" aria-label="Az első kocka ' + k + '-es lapjának relatív súlya">'); }
function probs(){ const r = []; for (let k = 1; k <= 6; k++) r.push($("load").checked ? +$("p" + k).value : 1); const s = r.reduce((u, v) => u + v, 0) || 1; return r.map(v => v/s); }
function draw(){
  const p = probs(), q = [1, 1, 1, 1, 1, 1].map(v => v/6), dist = {};
  for (let n = 2; n <= 12; n++) dist[n] = 0;
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) dist[a + b] += p[a - 1]*q[b - 1];
  for (let k = 1; k <= 6; k++) $("p" + k).disabled = !$("load").checked;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  el("text", {x: CX, y: 18, "font-size": 12}, "sor: a (1. kocka), oszlop: b; kattints egy cellára");
  for (let a = 1; a <= 6; a++) { el("text", {x: CX + 6*C + 8, y: CY + (a - 0.5)*C + 4, "font-size": 10, fill: mu}, "p" + a + "=" + fmt(p[a - 1], 3));
    for (let b = 1; b <= 6; b++) { const n = a + b, on = n === sel;
      const r = el("rect", {x: CX + (b - 1)*C, y: CY + (a - 1)*C, width: C, height: C, fill: on ? css("--hl") : css("--cell"), stroke: fg, "stroke-width": on ? 2 : 0.8, tabindex: 0, role: "button", "aria-label": "a = " + a + ", b = " + b + ", összeg " + n});
      r.style.cursor = "pointer"; r.addEventListener("click", () => { sel = n; draw(); });
      r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sel = n; draw(); } });
      const t = el("text", {x: CX + (b - 0.5)*C, y: CY + (a - 0.5)*C + 5, "font-size": 14, "text-anchor": "middle", fill: on ? css("--bg") : fg}, String(n)); t.style.pointerEvents = "none"; } }
  const mx = Math.max(0.2, ...Object.values(dist)), bw = BW/11;
  el("line", {x1: BX, y1: BY + BH, x2: BX + BW, y2: BY + BH, stroke: mu});
  el("text", {x: BX, y: 18, "font-size": 12}, "P(összeg = n)");
  for (let n = 2; n <= 12; n++) { const h = dist[n]/mx*(BH - 20), on = n === sel;
    const r = el("rect", {x: BX + (n - 2)*bw + 2, y: BY + BH - h, width: bw - 4, height: h, fill: on ? css("--hl") : css("--fill"), stroke: fg, "stroke-width": 0.8});
    r.style.cursor = "pointer"; r.addEventListener("click", () => { sel = n; draw(); });
    el("text", {x: BX + (n - 1.5)*bw, y: BY + BH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(n)); }
  let cells = 0; for (let a = 1; a <= 6; a++) if (sel - a >= 1 && sel - a <= 6) cells++;
  $("status").textContent = "n = " + sel + ": " + cells + " cella az anti-diagonálison; P(összeg = " + sel + ") = " + fmt(dist[sel], 4) +
    ($("load").checked ? " (cellasúly p_a·1/6)" : " = " + cells + "/36");
}
$("load").addEventListener("change", draw);
for (let k = 1; k <= 6; k++) $("p" + k).addEventListener("input", draw);
$("reset").onclick = () => { $("load").checked = false; for (let k = 1; k <= 6; k++) $("p" + k).value = 0.5; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
