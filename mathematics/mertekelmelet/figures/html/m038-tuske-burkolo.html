<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A tüskék burkolója nem integrálható</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Tüskék száma">
  <label for="m">n<sub>max</sub> =</label><input id="m" type="range" min="1" max="20" step="1" value="4" aria-label="A kirajzolt tüskék száma"><b id="mv"></b>
  <label><input id="g" type="checkbox" checked> 1/x − 1 görbe</label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Egyre magasabb, keskenyebb téglalapok a 0 közelében, felettük lépcsős burkoló és szaggatott 1/x−1 görbe"></svg>
<p class="small">fₙ = n·1_(0,1/n), ∫ fₙ = 1 minden n-re. A részleges burkoló max(n ≤ m) fₙ értéke k az [1/(k+1), 1/k) intervallumon (k &lt; m), integrálja a Hₘ harmonikus szám. Számított értékek a definícióból, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const sub = n => String(n).split("").map(c => "₀₁₂₃₄₅₆₇₈₉"[+c]).join("");
const L = 50, R = 540, T = 16, B = 300, YM = 10.8;
const sx = x => L + x * (R - L), sy = y => B - Math.min(y, YM) / YM * (B - T);
function draw(){
  const m = +$("m").value; $("mv").textContent = m;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  for (let y = 2; y <= 10; y += 2) el("line", {x1: L, x2: R, y1: sy(y), y2: sy(y), stroke: css("--grid")});
  for (let n = 1; n <= m; n++){
    const h = Math.min(n, YM);
    el("rect", {x: sx(0), y: sy(h), width: sx(1 / n) - sx(0), height: B - sy(h), fill: n === m ? css("--hl2") : "none", "fill-opacity": 0.18, stroke: n === m ? css("--hl2") : mu, "stroke-width": n === m ? 2 : 1});
  }
  // részleges burkoló: k az [1/(k+1), 1/k)-n (k < m), m a (0, 1/m)-en
  const p = [];
  for (let k = 1; k < m; k++){ p.push([1 / k, k]); p.push([1 / (k + 1), k]); }
  p.push([1 / m, m]); p.push([0, m]);
  el("polyline", {points: p.map(q => sx(q[0]).toFixed(1) + "," + sy(q[1]).toFixed(1)).join(" "), fill: "none", stroke: fg, "stroke-width": 3.2});
  if ($("g").checked){ const c = []; for (let i = 0; i <= 300; i++){ const x = 1 / YM + (1 - 1 / YM) * i / 300; c.push(sx(x).toFixed(1) + "," + sy(1 / x - 1).toFixed(1)); }
    el("polyline", {points: c.join(" "), fill: "none", stroke: fg, "stroke-width": 1.4, "stroke-dasharray": "6 4"}); }
  if (m > 10) el("text", {x: sx(0) + 8, y: T + 10, "font-size": 11, fill: mu}, "a 10,8 feletti rész levágva");
  el("line", {x1: L, x2: R, y1: B, y2: B, stroke: fg}); el("line", {x1: L, x2: L, y1: T, y2: B, stroke: fg});
  [0, 0.25, 0.5, 0.75, 1].forEach(v => el("text", {x: sx(v), y: B + 16, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, v % 1 ? 2 : 0)));
  [0, 2, 4, 6, 8, 10].forEach(v => el("text", {x: L - 6, y: sy(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, String(v)));
  el("text", {x: R - 4, y: T + 30, "font-size": 12, "text-anchor": "end"}, "vastag: max(n ≤ " + m + ") fₙ; narancs: f" + sub(m) + "; szaggatott: 1/x − 1");
  let H = 0; for (let k = 1; k <= m; k++) H += 1 / k;
  $("status").textContent = "∫ f" + sub(m) + " = " + m + " · 1/" + m + " = 1, de ∫ max(n ≤ " + m + ") fₙ = H" + sub(m) + " = 1 + 1/2 + … + 1/" + m + " ≈ " + fmt(H, 3) +
    " (a harmonikus sor divergál, ezért a teljes burkoló nem integrálható)";
}
$("m").addEventListener("input", draw); $("g").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
