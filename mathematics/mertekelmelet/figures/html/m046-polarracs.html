<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A gyűrűcikk területe polárkoordinátákban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A gyűrűcikk adatai">
  <label for="r">r =</label><input id="r" type="range" min="0" max="2" step="0.05" value="1" aria-label="Belső sugár r"><b id="rv"></b>
  <label for="dr">Δr =</label><input id="dr" type="range" min="0.05" max="1" step="0.05" value="0.5" aria-label="Vastagság Δr"><b id="drv"></b>
</div>
<div class="ctl">
  <label for="dt">Δθ =</label><input id="dt" type="range" min="5" max="90" step="2.5" value="30" aria-label="Szög Δθ fokban"><b id="dtv"></b>
  <button id="rst">kezdőállapot</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 350" role="img" aria-label="Koncentrikus negyedkörök és sugarak; egy kiemelt gyűrűcikk, amelynek mérete a csúszkákkal állítható"></svg>
<p class="small">A gyűrűcikk θ = π/6-tól indul. Pontos terület (Δθ/2)((r + Δr)² − r²) = rΔrΔθ + ½(Δr)²Δθ; a hiba Δr → 0 esetén elhanyagolható az rΔrΔθ főtaghoz képest. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const O = [40, 330], S = 100;
const P = (r, t) => [O[0] + r*S*Math.cos(t), O[1] - r*S*Math.sin(t)];
function draw(){
  const r = +$("r").value, dr = +$("dr").value, dtd = +$("dt").value, dt = dtd * Math.PI / 180;
  $("rv").textContent = fmt(r, 2); $("drv").textContent = fmt(dr, 2); $("dtv").textContent = fmt(dtd, 1) + "° = " + fmt(dt, 4) + " rad";
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  for (let k = 1; k <= 6; k++){ const R = k * 0.5, pts = []; for (let i = 0; i <= 60; i++) pts.push(P(R, Math.PI/2 * i/60).map(v => v.toFixed(1)).join(","));
    el("polyline", {points: pts.join(" "), fill: "none", stroke: css("--grid"), "stroke-width": 1}); }
  for (let k = 0; k <= 3; k++){ const q = P(3, k*Math.PI/6); el("line", {x1: O[0], y1: O[1], x2: q[0], y2: q[1], stroke: css("--grid")}); }
  const t0 = Math.PI/6, t1 = t0 + dt, pts = [];
  for (let i = 0; i <= 60; i++) pts.push(P(r, t0 + dt*i/60)); for (let i = 60; i >= 0; i--) pts.push(P(r + dr, t0 + dt*i/60));
  el("polygon", {points: pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" "), fill: css("--hl"), "fill-opacity": 0.25, stroke: fg, "stroke-width": 2});
  // a közelítő téglalap: r·Δθ × Δr, a cikk belső ívénél „kiterítve”
  el("rect", {x: 380, y: 60, width: Math.min(170, r*dt*S), height: dr*S, fill: "none", stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "5 3"});
  el("text", {x: 380, y: 50, "font-size": 12, fill: css("--hl2")}, "közelítő téglalap: rΔθ × Δr");
  for (let k = 1; k <= 6; k++){ const q = P(k*0.5, 0); el("text", {x: q[0], y: O[1] + 16, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(k*0.5, k % 2 ? 1 : 0)); }
  const m = P(r + dr/2, t0 + dt/2);
  el("text", {x: 380, y: 200, "font-size": 12}, "belső ív: rΔθ = " + fmt(r*dt, 4));
  el("text", {x: 380, y: 218, "font-size": 12}, "külső ív: (r + Δr)Δθ = " + fmt((r + dr)*dt, 4));
  const ex = dt/2 * ((r + dr)**2 - r*r), ap = r*dr*dt, er = 0.5*dr*dr*dt;
  $("status").textContent = "pontos terület = " + fmt(ex, 5) + ", rΔrΔθ = " + fmt(ap, 5) + ", hiba = ½(Δr)²Δθ = " + fmt(er, 5) + " (relatív: " + fmt(ex > 0 ? er/ex*100 : 0, 1) + " %)";
}
["r", "dr", "dt"].forEach(id => $(id).addEventListener("input", draw));
$("rst").onclick = () => { $("r").value = 1; $("dr").value = 0.5; $("dt").value = 30; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
