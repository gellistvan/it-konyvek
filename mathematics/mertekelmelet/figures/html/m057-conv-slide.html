<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konvolúció mint csúszó átfedés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Eltolás">
  <button id="prev" aria-label="Előző nevezetes x">◀ Lépés</button>
  <button id="play" aria-label="Lejátszás vagy szünet">▶ Lejátszás</button>
  <button id="next" aria-label="Következő nevezetes x">Lépés ▶</button>
  <label for="x">x =</label><input id="x" type="range" min="-0.5" max="2.5" step="0.05" value="-0.5" aria-label="Az eltolás x értéke"><b id="xv"></b>
</div>
<div class="ctl" role="group" aria-label="A második doboz">
  <label for="mode">2. doboz g:</label><select id="mode"><option value="a">1_[0,1] (alap)</option><option value="b">1_[0,2] ((b) feladat)</option><option value="d">n·1_[0,1/n] ((d) feladat)</option></select>
  <label for="n">n =</label><input id="n" type="range" min="1" max="10" step="1" value="4" aria-label="n a (d) feladat dobozához" style="max-width:160px"><b id="nv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 315" role="img" aria-label="A tükrözött, x-szel eltolt doboz átfedése a [0,1] dobozzal, alatta a háromszögfüggvény a bejárt résszel"></svg>
<p class="small">(f*g)(x) = ∫ f(x − y) g(y) dy, f = 1_[0,1]; az érték a g doboz és az 1_[x−1, x] doboz átfedésének (súlyozott) hossza. Az [0,2] módban trapéz (töréspontok 0, 1, 2, 3), az n·1_[0,1/n] módban az (f*g_n)(x) a (d) feladatból. Számított értékek a definícióból.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const KEY = [-0.5, 0.5, 1, 1.5, 2.5];
let tm = null;
const X0 = 30, PW = 500, xmin = -1.5, xmax = 3.5, px = x => X0 + (x - xmin)/(xmax - xmin)*PW;
const TY = 20, TH = 120, BY = 175, BH = 120;
function box(){ const m = $("mode").value, n = +$("n").value; if (m === "b") return {L: 2, h: 1}; if (m === "d") return {L: 1/n, h: n}; return {L: 1, h: 1}; }
function ov(x, g){ const a = Math.max(0, x - 1), b = Math.min(g.L, x); return {a, b, v: g.h*Math.max(0, b - a)}; }
function draw(){
  const x = +$("x").value, g = box(), o = ov(x, g), hmax = Math.max(1, g.h);
  $("xv").textContent = fmt(x, 2); $("nv").textContent = $("n").value; $("n").disabled = $("mode").value !== "d";
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  const ty = y => TY + TH - y/hmax*(TH - 15), by = y => BY + BH - y/(hmax*1.05)*(BH - 15);
  el("line", {x1: X0, y1: ty(0), x2: X0 + PW, y2: ty(0), stroke: mu}); el("line", {x1: X0, y1: by(0), x2: X0 + PW, y2: by(0), stroke: mu});
  [-1, 0, 1, 2, 3].forEach(v => { el("text", {x: px(v), y: ty(0) + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(v).replace("-", "−")); el("text", {x: px(v), y: by(0) + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(v).replace("-", "−")); });
  if (o.b > o.a) { el("rect", {x: px(o.a), y: ty(Math.min(g.h, 0.85)), width: px(o.b) - px(o.a), height: ty(0) - ty(Math.min(g.h, 0.85)), fill: css("--fill"), stroke: "none"});
    for (let s = px(o.a); s < px(o.b); s += 7) el("line", {x1: s, y1: ty(0), x2: Math.min(s + 10, px(o.b)), y2: ty(Math.min(g.h, 0.85)), stroke: mu, "stroke-width": 0.8}); }
  el("polyline", {points: [[xmin, 0], [0, 0], [0, g.h], [g.L, g.h], [g.L, 0], [xmax, 0]].map(p => px(p[0]) + "," + ty(p[1])).join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("polyline", {points: [[xmin, 0], [x - 1, 0], [x - 1, 0.85], [x, 0.85], [x, 0], [xmax, 0]].map(p => px(p[0]) + "," + ty(p[1])).join(" "), fill: "none", stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  el("text", {x: X0, y: TY - 4, "font-size": 12}, "folytonos: g; szaggatott: y ↦ f(x − y) = 1_[x−1, x]; sraffozott: átfedés");
  const P = [], Q = [];
  for (let i = 0; i <= 300; i++) { const t = -0.5 + 3*i/300, v = ov(t, g).v; (t <= x ? P : Q).push(px(t) + "," + by(v)); }
  if (Q.length && P.length) Q.unshift(P[P.length - 1]);
  if (P.length > 1) el("polyline", {points: P.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  if (Q.length > 1) el("polyline", {points: Q.join(" "), fill: "none", stroke: mu, "stroke-width": 1.4, "stroke-dasharray": "2 4"});
  el("circle", {cx: px(x), cy: by(o.v), r: 5, fill: css("--hl")});
  el("text", {x: X0, y: BY - 4, "font-size": 12}, "(f * g)(x): a bejárt rész folytonos, a hátralévő pontozott");
  $("status").textContent = "x = " + fmt(x, 2) + "; átfedés = " + (o.b > o.a ? "[" + fmt(o.a, 2) + ", " + fmt(o.b, 2) + "]" : "üres") + "; (f*g)(x) = " + fmt(o.v, 2);
}
function stop(){ if (tm) { clearInterval(tm); tm = null; $("play").textContent = "▶ Lejátszás"; } }
$("play").onclick = () => { if (tm) { stop(); return; } if (+$("x").value >= 2.5) $("x").value = -0.5; $("play").textContent = "⏸ Szünet";
  tm = setInterval(() => { const v = Math.round((+$("x").value + 0.05)*100)/100; $("x").value = v; draw(); if (v >= 2.5) stop(); }, 120); };
$("next").onclick = () => { stop(); const x = +$("x").value, k = KEY.find(v => v > x + 1e-9); $("x").value = k === undefined ? KEY[KEY.length - 1] : k; draw(); };
$("prev").onclick = () => { stop(); const x = +$("x").value, k = [...KEY].reverse().find(v => v < x - 1e-9); $("x").value = k === undefined ? KEY[0] : k; draw(); };
$("x").addEventListener("input", () => { stop(); draw(); }); $("mode").addEventListener("change", draw); $("n").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
