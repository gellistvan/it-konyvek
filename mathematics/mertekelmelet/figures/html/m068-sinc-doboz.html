<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A sinc és a doboz: energiaazonosság</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Integrálási ablak">
  <label for="n">N =</label><input id="n" type="range" min="0" max="24" step="1" value="6" aria-label="Az integrálási ablak fele, N, logaritmikus lépésekben 1 és 1000 között"><b id="nv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="A sinc függvény, burkolója és négyzete; mellette a két integrál az N ablakméret függvényében"></svg>
<p class="small">sinc(x) = sin(πx)/(πx). A [−N, N] ablakon vett ∫|sinc| logaritmikusan nő (tehát sinc ∉ L¹), a ∫sinc² 1-hez tart (Plancherel: ugyanannyi, mint a doboz energiája). Számított értékek (scipy.quad), nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function panel(x0, y0, w, h, xr, yr, opt){
  opt = opt || {};
  const P = {x0, y0, w, h, xr, yr,
    sx: x => x0 + (x - xr[0]) / (xr[1] - xr[0]) * w,
    sy: y => y0 + h - (y - yr[0]) / (yr[1] - yr[0]) * h};
  const mu = css("--muted"), gr = css("--grid");
  el("rect", {x: x0, y: y0, width: w, height: h, fill: "none", stroke: gr});
  (opt.xt || []).forEach(t => { el("line", {x1: P.sx(t), y1: y0, x2: P.sx(t), y2: y0 + h, stroke: gr});
    el("text", {x: P.sx(t), y: y0 + h + 13, "font-size": 11, "text-anchor": "middle", fill: mu}, fmtT(t)); });
  (opt.yt || []).forEach(t => { el("line", {x1: x0, y1: P.sy(t), x2: x0 + w, y2: P.sy(t), stroke: gr});
    el("text", {x: x0 - 4, y: P.sy(t) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmtT(t)); });
  if (yr[0] < 0 && yr[1] > 0) el("line", {x1: x0, y1: P.sy(0), x2: x0 + w, y2: P.sy(0), stroke: mu, "stroke-width": 0.8});
  if (opt.xl) el("text", {x: x0 + w, y: y0 + h + 26, "font-size": 12, "text-anchor": "end", fill: mu}, opt.xl);
  if (opt.title) el("text", {x: x0, y: y0 - 6, "font-size": 12.5, "font-weight": "bold"}, opt.title);
  return P;
}
function fmtT(t){ return String(+t.toFixed(4)).replace(".", ",").replace("-", "−"); }
function curve(P, xs, ys, attrs){
  const pts = [];
  for (let i = 0; i < xs.length; i++) { const y = Math.max(P.yr[0] - 0.05*(P.yr[1]-P.yr[0]), Math.min(P.yr[1] + 0.05*(P.yr[1]-P.yr[0]), ys[i])); pts.push(P.sx(xs[i]).toFixed(1) + "," + P.sy(y).toFixed(1)); }
  return el("polyline", Object.assign({points: pts.join(" "), fill: "none", stroke: css("--fg"), "stroke-width": 1.8}, attrs || {}));
}
function area(P, xs, ys, attrs){
  const pts = [P.sx(xs[0]).toFixed(1) + "," + P.sy(0).toFixed(1)];
  for (let i = 0; i < xs.length; i++) pts.push(P.sx(xs[i]).toFixed(1) + "," + P.sy(ys[i]).toFixed(1));
  pts.push(P.sx(xs[xs.length - 1]).toFixed(1) + "," + P.sy(0).toFixed(1));
  return el("polygon", Object.assign({points: pts.join(" "), fill: css("--fill"), stroke: "none"}, attrs || {}));
}
const NL = [1, 1.5, 2, 3, 4, 5, 6, 8, 10, 15, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 600, 800, 1000];
const V = [[1.179, 0.9028], [1.334, 0.9311], [1.4551, 0.9499], [1.6185, 0.9664], [1.7347, 0.9747], [1.825, 0.9798], [1.8988, 0.9831], [2.0153, 0.9873], [2.1057, 0.9899], [2.27, 0.9932], [2.3866, 0.9949], [2.5509, 0.9966], [2.6675, 0.9975], [2.7579, 0.998], [2.8318, 0.9983], [2.9484, 0.9987], [3.0389, 0.999], [3.2032, 0.9993], [3.3198, 0.9995], [3.4841, 0.9997], [3.6007, 0.9997], [3.6911, 0.9998], [3.765, 0.9998], [3.8816, 0.9999], [3.9721, 0.9999]];
const XS = [-6.0, -5.975, -5.95, -5.925, -5.9, -5.875, -5.85, -5.825, -5.8, -5.775, -5.75, -5.725, -5.7, -5.675, -5.65, -5.625, -5.6, -5.575, -5.55, -5.525, -5.5, -5.475, -5.45, -5.425, -5.4, -5.375, -5.35, -5.325, -5.3, -5.275, -5.25, -5.225, -5.2, -5.175, -5.15, -5.125, -5.1, -5.075, -5.05, -5.025, -5.0, -4.975, -4.95, -4.925, -4.9, -4.875, -4.85, -4.825, -4.8, -4.775, -4.75, -4.725, -4.7, -4.675, -4.65, -4.625, -4.6, -4.575, -4.55, -4.525, -4.5, -4.475, -4.45, -4.425, -4.4, -4.375, -4.35, -4.325, -4.3, -4.275, -4.25, -4.225, -4.2, -4.175, -4.15, -4.125, -4.1, -4.075, -4.05, -4.025, -4.0, -3.975, -3.95, -3.925, -3.9, -3.875, -3.85, -3.825, -3.8, -3.775, -3.75, -3.725, -3.7, -3.675, -3.65, -3.625, -3.6, -3.575, -3.55, -3.525, -3.5, -3.475, -3.45, -3.425, -3.4, -3.375, -3.35, -3.325, -3.3, -3.275, -3.25, -3.225, -3.2, -3.175, -3.15, -3.125, -3.1, -3.075, -3.05, -3.025, -3.0, -2.975, -2.95, -2.925, -2.9, -2.875, -2.85, -2.825, -2.8, -2.775, -2.75, -2.725, -2.7, -2.675, -2.65, -2.625, -2.6, -2.575, -2.55, -2.525, -2.5, -2.475, -2.45, -2.425, -2.4, -2.375, -2.35, -2.325, -2.3, -2.275, -2.25, -2.225, -2.2, -2.175, -2.15, -2.125, -2.1, -2.075, -2.05, -2.025, -2.0, -1.975, -1.95, -1.925, -1.9, -1.875, -1.85, -1.825, -1.8, -1.775, -1.75, -1.725, -1.7, -1.675, -1.65, -1.625, -1.6, -1.575, -1.55, -1.525, -1.5, -1.475, -1.45, -1.425, -1.4, -1.375, -1.35, -1.325, -1.3, -1.275, -1.25, -1.225, -1.2, -1.175, -1.15, -1.125, -1.1, -1.075, -1.05, -1.025, -1.0, -0.975, -0.95, -0.925, -0.9, -0.875, -0.85, -0.825, -0.8, -0.775, -0.75, -0.725, -0.7, -0.675, -0.65, -0.625, -0.6, -0.575, -0.55, -0.525, -0.5, -0.475, -0.45, -0.425, -0.4, -0.375, -0.35, -0.325, -0.3, -0.275, -0.25, -0.225, -0.2, -0.175, -0.15, -0.125, -0.1, -0.075, -0.05, -0.025, 0.0, 0.025, 0.05, 0.075, 0.1, 0.125, 0.15, 0.175, 0.2, 0.225, 0.25, 0.275, 0.3, 0.325, 0.35, 0.375, 0.4, 0.425, 0.45, 0.475, 0.5, 0.525, 0.55, 0.575, 0.6, 0.625, 0.65, 0.675, 0.7, 0.725, 0.75, 0.775, 0.8, 0.825, 0.85, 0.875, 0.9, 0.925, 0.95, 0.975, 1.0, 1.025, 1.05, 1.075, 1.1, 1.125, 1.15, 1.175, 1.2, 1.225, 1.25, 1.275, 1.3, 1.325, 1.35, 1.375, 1.4, 1.425, 1.45, 1.475, 1.5, 1.525, 1.55, 1.575, 1.6, 1.625, 1.65, 1.675, 1.7, 1.725, 1.75, 1.775, 1.8, 1.825, 1.85, 1.875, 1.9, 1.925, 1.95, 1.975, 2.0, 2.025, 2.05, 2.075, 2.1, 2.125, 2.15, 2.175, 2.2, 2.225, 2.25, 2.275, 2.3, 2.325, 2.35, 2.375, 2.4, 2.425, 2.45, 2.475, 2.5, 2.525, 2.55, 2.575, 2.6, 2.625, 2.65, 2.675, 2.7, 2.725, 2.75, 2.775, 2.8, 2.825, 2.85, 2.875, 2.9, 2.925, 2.95, 2.975, 3.0, 3.025, 3.05, 3.075, 3.1, 3.125, 3.15, 3.175, 3.2, 3.225, 3.25, 3.275, 3.3, 3.325, 3.35, 3.375, 3.4, 3.425, 3.45, 3.475, 3.5, 3.525, 3.55, 3.575, 3.6, 3.625, 3.65, 3.675, 3.7, 3.725, 3.75, 3.775, 3.8, 3.825, 3.85, 3.875, 3.9, 3.925, 3.95, 3.975, 4.0, 4.025, 4.05, 4.075, 4.1, 4.125, 4.15, 4.175, 4.2, 4.225, 4.25, 4.275, 4.3, 4.325, 4.35, 4.375, 4.4, 4.425, 4.45, 4.475, 4.5, 4.525, 4.55, 4.575, 4.6, 4.625, 4.65, 4.675, 4.7, 4.725, 4.75, 4.775, 4.8, 4.825, 4.85, 4.875, 4.9, 4.925, 4.95, 4.975, 5.0, 5.025, 5.05, 5.075, 5.1, 5.125, 5.15, 5.175, 5.2, 5.225, 5.25, 5.275, 5.3, 5.325, 5.35, 5.375, 5.4, 5.425, 5.45, 5.475, 5.5, 5.525, 5.55, 5.575, 5.6, 5.625, 5.65, 5.675, 5.7, 5.725, 5.75, 5.775, 5.8, 5.825, 5.85, 5.875, 5.9, 5.925, 5.95, 5.975, 6.0];

function sinc(x){ return x === 0 ? 1 : Math.sin(Math.PI*x)/(Math.PI*x); }
const S = XS.map(sinc), S2 = S.map(v => v*v);
function draw(){
  const i = +$("n").value, N = NL[i], v = V[i];
  $("nv").textContent = fmt(N, N % 1 ? 1 : 0);
  svg.innerHTML = "";
  const L = panel(40, 26, 300, 200, [-6, 6], [-0.45, 1.1], {xt: [-6, -4, -2, 0, 2, 4, 6], yt: [0, 0.5, 1], xl: "x", title: "sinc (folytonos), sinc² (satírozott), ±1/(π|x|)"});
  const w = Math.min(N, 6);
  el("rect", {x: L.sx(-w), y: L.y0, width: L.sx(w) - L.sx(-w), height: L.h, fill: css("--hl"), "fill-opacity": 0.08});
  if (N <= 6) [-N, N].forEach(t => el("line", {x1: L.sx(t), y1: L.y0, x2: L.sx(t), y2: L.y0 + L.h, stroke: css("--hl"), "stroke-dasharray": "5 3", "stroke-width": 1.5}));
  else el("text", {x: L.x0 + L.w - 4, y: L.y0 + L.h - 6, "font-size": 11, "text-anchor": "end", fill: css("--hl")}, "az ablak [−" + fmt(N, 0) + "; " + fmt(N, 0) + "] túlnyúlik a rajzon");
  area(L, XS, S2, {"fill-opacity": 0.8});
  [1, -1].forEach(sg => { [XS.filter(x => x < -0.3), XS.filter(x => x > 0.3)].forEach(p => curve(L, p, p.map(x => sg/(Math.PI*Math.abs(x))), {stroke: css("--muted"), "stroke-dasharray": "5 4", "stroke-width": 1.2})); });
  curve(L, XS, S2, {"stroke-dasharray": "2 3", "stroke-width": 1.6});
  curve(L, XS, S, {"stroke-width": 2});
  // jobb: a két integrál N függvényében, log N tengely
  const P = panel(400, 26, 150, 200, [0, 3], [0, 6], {xt: [0, 1, 2, 3], yt: [0, 1, 2, 3, 4, 5, 6], xl: "log₁₀ N", title: "integrálok [−N, N]-en"});
  const lx = NL.map(n => Math.log10(n));
  curve(P, lx, V.map(q => q[0]), {"stroke-width": 2});
  curve(P, lx, V.map(q => q[1]), {"stroke-dasharray": "5 3", "stroke-width": 2});
  el("circle", {cx: P.sx(Math.log10(N)), cy: P.sy(v[0]), r: 4.5, fill: css("--hl")});
  el("circle", {cx: P.sx(Math.log10(N)), cy: P.sy(v[1]), r: 4.5, fill: css("--hl2")});
  el("text", {x: P.sx(3) - 2, y: P.sy(V[V.length - 1][0]) + 16, "font-size": 11, "text-anchor": "end"}, "∫|sinc| (folyt.)");
  el("text", {x: P.sx(3) - 2, y: P.sy(1) - 6, "font-size": 11, "text-anchor": "end"}, "∫sinc² (szagg.)");
  el("text", {x: 40, y: 268, "font-size": 12}, "Fourier-pár: 𝓕(sinc) = 1 a [−1/2, 1/2]-en (doboz), és ∫|doboz|² = 1 = ∫ sinc² (Plancherel).");
  $("status").textContent = "N = " + fmt(N, N % 1 ? 1 : 0) + ": a [−N, N]-en ∫|sinc| = " + fmt(v[0], 4) + ", ∫sinc² = " + fmt(v[1], 4) + " (határ: ∞, illetve 1)";
}
$("n").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
