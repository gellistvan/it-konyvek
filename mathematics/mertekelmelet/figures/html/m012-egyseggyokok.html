<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körbejáró vektorok kioltása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="n">n =</label><input id="n" type="range" min="-8" max="8" step="1" value="1"><b id="nv"></b>
  <label for="N">N =</label><input id="N" type="range" min="4" max="64" step="1" value="8"><b id="Nv"></b>
</div>
<div class="ctl" role="group" aria-label="Lépések">
  <button id="k0">⏮ Elölről</button><button id="kp">◀ Vektor</button><button id="kn">Vektor ▶</button><button id="ka">Mind</button>
  <span id="kc" class="small"></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 350" role="img" aria-label="Az egységkörön az e^(inx_k) mintaértékek, a vektorok fej-láb fűzve; a végösszeg n nem osztható N-nel esetén az origóba esik"></svg>
<p class="small">xₖ = 2πk/N, k = 0, …, N − 1. A Σ e^(inxₖ) összeg pontosan 0, ha N nem osztója n-nek (a vektorok szabályos sokszöget zárnak be), és N, ha N | n (ekkor minden tag 1 – a mintavétel nem „látja” a rezgést). Az integrál (2π/N)·Σ Riemann-közelítése így n ≠ 0-ra 0, n = 0-ra 2π. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let K = null;
const cpx = (x, y) => fmt(x, 4) + (y < -5e-5 ? " − " + fmt(-y, 4) : " + " + fmt(y, 4)) + "i";
function draw(){
  const n = +$("n").value, N = +$("N").value;
  if (K === null || K > N) K = N;
  $("nv").textContent = String(n).replace("-", "−"); $("Nv").textContent = N; $("kc").textContent = K + "/" + N + " vektor";
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  // a lánc befoglaló téglalapja (a teljes láncé, hogy lépésenként ne ugráljon a nézet)
  let px = 0, py = 0, xmin = -1.15, xmax = 1.15, ymin = -1.15, ymax = 1.15;
  const pts = [[0, 0]];
  for (let k = 0; k < N; k++) { const a = 2 * Math.PI * n * k / N; px += Math.cos(a); py += Math.sin(a); pts.push([px, py]); xmin = Math.min(xmin, px - 0.2); xmax = Math.max(xmax, px + 0.2); ymin = Math.min(ymin, py - 0.2); ymax = Math.max(ymax, py + 0.2); }
  const W = 540, H = 330, sc = Math.min(W / (xmax - xmin), H / (ymax - ymin));
  const ox = 10 + (W - sc * (xmax - xmin)) / 2 - sc * xmin, oy = 10 + (H - sc * (ymax - ymin)) / 2 + sc * ymax;
  const X = x => ox + sc * x, Y = y => oy - sc * y;
  el("circle", {cx: X(0), cy: Y(0), r: sc, fill: "none", stroke: mu, "stroke-dasharray": "5 4"});
  el("line", {x1: X(0) - 6, y1: Y(0), x2: X(0) + 6, y2: Y(0), stroke: fg}); el("line", {x1: X(0), y1: Y(0) - 6, x2: X(0), y2: Y(0) + 6, stroke: fg});
  for (let k = 0; k < N; k++) { const a = 2 * Math.PI * n * k / N; el("circle", {cx: X(Math.cos(a)), cy: Y(Math.sin(a)), r: 3.2, fill: k < K ? css("--hl") : css("--bg"), stroke: mu}); }
  const sw = Math.max(1, Math.min(2.2, sc / 30));
  for (let k = 0; k < K; k++) {
    const [x0, y0] = pts[k], [x1, y1] = pts[k + 1], cur = k === K - 1;
    el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: cur ? css("--hl2") : fg, "stroke-width": cur ? sw + 1 : sw});
    const ang = Math.atan2(-(Y(y1) - Y(y0)), X(x1) - X(x0)), hl = Math.min(9, sc * 0.25);
    const tip = [X(x1), Y(y1)], l = [tip[0] - hl * Math.cos(ang - 0.4), tip[1] + hl * Math.sin(ang - 0.4)], r = [tip[0] - hl * Math.cos(ang + 0.4), tip[1] + hl * Math.sin(ang + 0.4)];
    el("polygon", {points: tip.join(",") + " " + l.join(",") + " " + r.join(","), fill: cur ? css("--hl2") : fg});
  }
  const [sx, sy] = pts[K], [tx, ty] = pts[N];
  el("circle", {cx: X(tx), cy: Y(ty), r: 8, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  const alias = n % N === 0;
  $("status").innerHTML = "n = " + String(n).replace("-", "−") + ", N = " + N + ": Σ = " + cpx(tx, ty) +
    " &nbsp;|&nbsp; részletösszeg az első " + K + " taggal: " + cpx(sx, sy) +
    (alias ? " &nbsp; <span class=\"err\">Figyelem: N | n (aliasing) – minden mintavételezett tag 1, az összeg N = " + N + ", noha n = 0 esetén kívül az integrál 0.</span>" :
             " &nbsp; (n ≠ 0 mod N: a tagok kioltják egymást; az integrál (2π/N)·Σ közelítése 0)");
}
$("n").addEventListener("input", () => { K = +$("N").value; draw(); });
$("N").addEventListener("input", () => { K = +$("N").value; draw(); });
$("k0").addEventListener("click", () => { K = 0; draw(); });
$("kp").addEventListener("click", () => { K = Math.max(0, K - 1); draw(); });
$("kn").addEventListener("click", () => { K = Math.min(+$("N").value, K + 1); draw(); });
$("ka").addEventListener("click", () => { K = +$("N").value; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
