<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heine–Borel: felezési eljárás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="pan">Lefedés:</label>
<select id="pan"><option value="1">1. K = (0,1], Oₙ = (1/n; 2)</option><option value="2">2. [0,1], Oₙ és U = (−0,1; 0,1)</option></select></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egymás alatt a felezési lépések I_n intervallumai; az első lefedésnél a közös pont, a 0, nincs a halmazban, a másodiknál a (−0,1; 0,1) halmaz a negyedik lépésben lefedi az I_4 intervallumot"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1. lefedés: K = (0,1], a jobb fél mindig lefedhető egyetlen Oₘ-mel, a bal fél végesen nem; a közös pont 0 ∉ K. 2. lefedés: [0,1], a 0-t lefedi U = (−0,1; 0,1), így a 4. lépésben I₄ ⊆ U – ez a bizonyítás ellentmondása. Az n ≥ 4 lépésekben a nézet nagyít.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "n = 0: I₀ = [0; 1], hossza 1 – K = (0,1] nem fedhető le véges sok Oₘ-mel.", "n": 0, "panel": 1, "b": 1.0}, {"msg": "n = 1: I₁ = [0; 0,5], hossza 0,5 – a jobb fél [0,5; 1] ⊆ O₃ = (1/3; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,5] nem fedhető le végesen).", "n": 1, "panel": 1, "b": 0.5}, {"msg": "n = 2: I₂ = [0; 0,25], hossza 0,25 – a jobb fél [0,25; 0,5] ⊆ O₅ = (1/5; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,25] nem fedhető le végesen).", "n": 2, "panel": 1, "b": 0.25}, {"msg": "n = 3: I₃ = [0; 0,125], hossza 0,125 – a jobb fél [0,125; 0,25] ⊆ O₉ = (1/9; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,125] nem fedhető le végesen).", "n": 3, "panel": 1, "b": 0.125}, {"msg": "n = 4: I₄ = [0; 0,0625], hossza 0,0625 – a jobb fél [0,0625; 0,125] ⊆ O₁₇ = (1/17; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,0625] nem fedhető le végesen).", "n": 4, "panel": 1, "b": 0.0625}, {"msg": "n = 5: I₅ = [0; 0,03125], hossza 0,03125 – a jobb fél [0,03125; 0,0625] ⊆ O₃₃ = (1/33; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,03125] nem fedhető le végesen).", "n": 5, "panel": 1, "b": 0.03125}, {"msg": "n = 6: I₆ = [0; 0,015625], hossza 0,015625 – a jobb fél [0,015625; 0,03125] ⊆ O₆₅ = (1/65; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,015625] nem fedhető le végesen).", "n": 6, "panel": 1, "b": 0.015625}, {"msg": "n = 7: I₇ = [0; 0,007812], hossza 0,007812 – a jobb fél [0,007812; 0,015625] ⊆ O₁₂₉ = (1/129; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,007812] nem fedhető le végesen).", "n": 7, "panel": 1, "b": 0.0078125}, {"msg": "n = 8: I₈ = [0; 0,003906], hossza 0,003906 – a jobb fél [0,003906; 0,007812] ⊆ O₂₅₇ = (1/257; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,003906] nem fedhető le végesen). A közös pont 0, de 0 ∉ (0,1]: nincs ellentmondás, mert (0,1] nem zárt.", "n": 8, "panel": 1, "b": 0.00390625}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = [[{"msg": "n = 0: I₀ = [0; 1], hossza 1 – K = (0,1] nem fedhető le véges sok Oₘ-mel.", "n": 0, "panel": 1, "b": 1.0}, {"msg": "n = 1: I₁ = [0; 0,5], hossza 0,5 – a jobb fél [0,5; 1] ⊆ O₃ = (1/3; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,5] nem fedhető le végesen).", "n": 1, "panel": 1, "b": 0.5}, {"msg": "n = 2: I₂ = [0; 0,25], hossza 0,25 – a jobb fél [0,25; 0,5] ⊆ O₅ = (1/5; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,25] nem fedhető le végesen).", "n": 2, "panel": 1, "b": 0.25}, {"msg": "n = 3: I₃ = [0; 0,125], hossza 0,125 – a jobb fél [0,125; 0,25] ⊆ O₉ = (1/9; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,125] nem fedhető le végesen).", "n": 3, "panel": 1, "b": 0.125}, {"msg": "n = 4: I₄ = [0; 0,0625], hossza 0,0625 – a jobb fél [0,0625; 0,125] ⊆ O₁₇ = (1/17; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,0625] nem fedhető le végesen).", "n": 4, "panel": 1, "b": 0.0625}, {"msg": "n = 5: I₅ = [0; 0,03125], hossza 0,03125 – a jobb fél [0,03125; 0,0625] ⊆ O₃₃ = (1/33; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,03125] nem fedhető le végesen).", "n": 5, "panel": 1, "b": 0.03125}, {"msg": "n = 6: I₆ = [0; 0,015625], hossza 0,015625 – a jobb fél [0,015625; 0,03125] ⊆ O₆₅ = (1/65; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,015625] nem fedhető le végesen).", "n": 6, "panel": 1, "b": 0.015625}, {"msg": "n = 7: I₇ = [0; 0,007812], hossza 0,007812 – a jobb fél [0,007812; 0,015625] ⊆ O₁₂₉ = (1/129; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,007812] nem fedhető le végesen).", "n": 7, "panel": 1, "b": 0.0078125}, {"msg": "n = 8: I₈ = [0; 0,003906], hossza 0,003906 – a jobb fél [0,003906; 0,007812] ⊆ O₂₅₇ = (1/257; 2) végesen lefedhető, ezért a bal felet választjuk (a K-beli része (0; 0,003906] nem fedhető le végesen). A közös pont 0, de 0 ∉ (0,1]: nincs ellentmondás, mert (0,1] nem zárt.", "n": 8, "panel": 1, "b": 0.00390625}], [{"msg": "n = 0: I₀ = [0; 1], hossza 1 – a bal fél még nem fér bele egyetlen lefedő halmazba sem.", "n": 0, "panel": 2, "b": 1.0}, {"msg": "n = 1: I₁ = [0; 0,5], hossza 0,5 – a bal fél még nem fér bele egyetlen lefedő halmazba sem.", "n": 1, "panel": 2, "b": 0.5}, {"msg": "n = 2: I₂ = [0; 0,25], hossza 0,25 – a bal fél még nem fér bele egyetlen lefedő halmazba sem.", "n": 2, "panel": 2, "b": 0.25}, {"msg": "n = 3: I₃ = [0; 0,125], hossza 0,125 – a bal fél még nem fér bele egyetlen lefedő halmazba sem.", "n": 3, "panel": 2, "b": 0.125}, {"msg": "I₄ = [0; 0,0625] ⊆ (−0,1; 0,1): egyetlen halmaz lefedi I₄-et – ellentmondás a „végesen nem lefedhető” választással; a közös pont 0 ∈ [0,1], és lefedi a (−0,1; 0,1).", "n": 4, "panel": 2, "b": 0.0625}]];
document.getElementById("pan").addEventListener("change", e => setSteps(ALL[+e.target.value - 1]));
const SB = n => String(n).replace(/\d/g, d => "₀₁₂₃₄₅₆₇₈₉"[+d]);
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), bg = css("--bg");
  const zoom = s.n >= 4;                     // nagyítás, hogy a kis intervallumok is látsszanak
  const xmax = zoom ? Math.max(4 * s.b, 0.15) : 1.05, xmin = -0.12 * xmax;
  const L = 110, R = 540, X = x => L + (R - L) * (x - xmin) / (xmax - xmin);
  const yAx = 300;
  el("line", {x1: L, y1: yAx, x2: R, y2: yAx, stroke: fg});
  const ticks = zoom ? [0, xmax / 4, xmax / 2, 3 * xmax / 4] : [0, 0.25, 0.5, 0.75, 1];
  ticks.forEach(t => { el("line", {x1: X(t), y1: yAx - 4, x2: X(t), y2: yAx + 4, stroke: fg}); el("text", {x: X(t), y: yAx + 18, "text-anchor": "middle", "font-size": 11}, (t === 0 ? "0" : (+t.toFixed(4)).toString().replace(".", ","))); });
  if (zoom) el("text", {x: R, y: yAx - 8, "text-anchor": "end", "font-size": 11, fill: mu}, "nagyított nézet");
  if (s.panel === 2) {
    el("rect", {x: X(Math.max(-0.1, xmin)), y: 10, width: X(Math.min(0.1, xmax)) - X(Math.max(-0.1, xmin)), height: yAx - 10, fill: css("--cellhl"), "fill-opacity": 0.6});
    el("text", {x: X(Math.min(0.1, xmax)) - 4, y: 24, "text-anchor": "end", "font-size": 12}, "U = (−0,1; 0,1)");
  }
  const rows = s.n + 1, dy = Math.min(32, 250 / rows);
  for (let m = 0; m <= s.n; m++) {
    const b = Math.pow(2, -m), y = 40 + m * dy, cur = m === s.n;
    el("text", {x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 12, "font-weight": cur ? "bold" : "normal"}, "I" + SB(m));
    if (cur && s.panel === 1) {
      el("rect", {x: X(0), y: y - 7, width: X(b / 2) - X(0), height: 14, fill: css("--hl")});
      el("rect", {x: X(b / 2), y: y - 7, width: X(b) - X(b / 2), height: 14, fill: css("--cellhl"), stroke: mu});
      el("text", {x: X(b) + 6, y: y + 4, "font-size": 11, fill: mu}, "jobb fél: végesen lefedhető");
    } else {
      el("rect", {x: X(0), y: y - 6, width: Math.max(1, X(Math.min(b, xmax)) - X(0)), height: 12, fill: cur ? css("--hl2") : "none", stroke: cur ? css("--hl2") : fg, "stroke-width": cur ? 2 : 1});
    }
    el("circle", {cx: X(0), cy: y, r: 4.5, fill: s.panel === 1 ? bg : fg, stroke: fg, "stroke-width": 1.5});
  }
  el("line", {x1: X(0), y1: 30, x2: X(0), y2: yAx, stroke: mu, "stroke-dasharray": "2 3"});
  el("text", {x: X(0) + 4, y: yAx - 8, "font-size": 11, fill: mu}, s.panel === 1 ? "0 ∉ (0,1]" : "0 ∈ [0,1]");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
