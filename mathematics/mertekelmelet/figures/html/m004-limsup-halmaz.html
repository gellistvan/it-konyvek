<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farokuniók és farokmetszetek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Beállítások">
  <label for="seq">Sorozat:</label>
  <select id="seq"><option value="a">páros n: [0,1], páratlan n: [1,2]</option><option value="b">páros n: [0,1], páratlan n: [½,2]</option></select>
</div>
<div class="ctl" role="group" aria-label="Farok kezdőindexe és vizsgált pont">
  <label for="n">farok: k ≥ n, n =</label><input id="n" type="range" min="1" max="8" step="1" value="1"><b id="nv"></b>
  <label for="x">x =</label><input id="x" type="range" min="-0.5" max="2.5" step="0.05" value="1"><b id="xv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Nyolc váltakozó intervallum egymás alatt, a k ≥ n farok kiemelve, alatta a farokunió és a farokmetszet, jobb oldalt a kiválasztott x tagsági sorozata"></svg>
<p class="small">A sorozat 2-periodikus, ezért minden k ≥ n farokban van páros és páratlan indexű tag: Uₙ a két intervallum uniója, Iₙ a metszete, és egyik sem függ n-től. A vizsgált x-et a csúszkával vagy a rajzra kattintva választhatod. limsup: végtelen sokszor benne; liminf: véges sok kivétellel mindig benne.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const SEQ = {a: [[0, 1], [1, 2]], b: [[0, 1], [0.5, 2]]};
const SUB = n => String(n).replace(/\d/g, d => "₀₁₂₃₄₅₆₇₈₉"[+d]);
const nm = v => v === 0.5 ? "½" : String(v).replace(".", ",").replace("-", "−");
const iv = (a, b) => a === b ? "{" + nm(a) + "}" : "[" + nm(a) + "," + nm(b) + "]";
const At = (s, k) => SEQ[s][k % 2 === 0 ? 0 : 1];
const inI = (I, x) => x >= I[0] - 1e-9 && x <= I[1] + 1e-9;
function draw(){
  const s = $("seq").value, n = +$("n").value, x = Math.round(+$("x").value * 100) / 100;
  $("nv").textContent = n; $("xv").textContent = String(x).replace(".", ",").replace("-", "−");
  const ev = SEQ[s][0], od = SEQ[s][1];
  // két szomszédos (egy páros, egy páratlan) tag minden farokban szerepel; a két intervallum átfed
  const U = [Math.min(ev[0], od[0]), Math.max(ev[1], od[1])], I = [Math.max(ev[0], od[0]), Math.min(ev[1], od[1])];
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const X = v => 80 + (v + 0.5) * 100, rowY = k => 22 + (k - 1) * 26;
  el("text", {x: 10, y: 14, "font-size": 12, fill: mu}, "Aₖ");
  for (let k = 1; k <= 8; k++) {
    const I0 = At(s, k), y = rowY(k), on = k >= n;
    el("text", {x: 60, y: y + 5, "text-anchor": "end", "font-size": 13, "font-weight": on ? "bold" : "normal", fill: on ? fg : mu}, "A" + SUB(k));
    el("rect", {x: X(I0[0]), y: y - 8, width: X(I0[1]) - X(I0[0]), height: 16, fill: on ? (k % 2 ? css("--hl2") : css("--hl")) : "none", "fill-opacity": on ? 0.35 : 0, stroke: on ? fg : mu, "stroke-width": on ? 1.6 : 1, "stroke-dasharray": on ? "" : "3 3"});
    const m = inI(I0, x);
    el("text", {x: 400, y: y + 5, "font-size": 13, fill: m ? fg : mu}, m ? "1" : "0");
  }
  el("text", {x: 392, y: 14, "font-size": 12, fill: mu}, "x ∈ Aₖ?");
  const yU = rowY(8) + 40, yI = yU + 30;
  el("text", {x: 60, y: yU + 5, "text-anchor": "end", "font-size": 13}, "U" + SUB(n));
  el("rect", {x: X(U[0]), y: yU - 9, width: X(U[1]) - X(U[0]), height: 18, fill: css("--cellhl"), stroke: fg});
  el("text", {x: 60, y: yI + 5, "text-anchor": "end", "font-size": 13}, "I" + SUB(n));
  if (I[0] === I[1]) el("rect", {x: X(I[0]) - 6, y: yI - 6, width: 12, height: 12, fill: fg, transform: "rotate(45 " + X(I[0]) + " " + yI + ")"});
  else el("rect", {x: X(I[0]), y: yI - 9, width: X(I[1]) - X(I[0]), height: 18, fill: fg, "fill-opacity": 0.55, stroke: fg});
  el("text", {x: 400, y: yU + 5, "font-size": 12}, "Uₙ = " + iv(U[0], U[1]));
  el("text", {x: 400, y: yI + 5, "font-size": 12}, "Iₙ = " + iv(I[0], I[1]));
  // tengely
  const yA = yI + 30;
  el("line", {x1: X(-0.5), y1: yA, x2: X(2.5), y2: yA, stroke: fg});
  [0, 0.5, 1, 1.5, 2].forEach(t => { el("line", {x1: X(t), y1: yA - 4, x2: X(t), y2: yA + 4, stroke: fg}); el("text", {x: X(t), y: yA + 18, "text-anchor": "middle", "font-size": 12}, String(t).replace(".", ",")); });
  el("line", {x1: X(x), y1: 8, x2: X(x), y2: yA, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "5 3"});
  el("text", {x: X(x) + 4, y: yA - 6, "font-size": 12, fill: css("--hl2")}, "x");
  // tagság és döntés
  const mem = [1, 2, 3, 4].map(k => inI(At(s, k), x) ? 1 : 0);
  const odd = inI(od, x), even = inI(ev, x);
  const isSup = odd || even, isInf = odd && even;
  const verdict = isInf ? "mindkettő eleme" : (isSup ? "limsup eleme, liminf nem" : "egyiknek sem eleme");
  $("status").textContent = "x = " + String(x).replace(".", ",").replace("-", "−") + ": " + mem.join(",") + ",… → " + verdict +
    "   |   limsup = ⋂ₙ Uₙ = " + iv(U[0], U[1]) + ", liminf = ⋃ₙ Iₙ = " + iv(I[0], I[1]);
}
svg.addEventListener("click", e => {
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const vx = (e.clientX - r.left) * vb.width / r.width;
  let v = (vx - 80) / 100 - 0.5; v = Math.max(-0.5, Math.min(2.5, Math.round(v * 20) / 20));
  $("x").value = v; draw();
});
["seq", "n", "x"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
