<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az f(x) = x² képmértéke</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Cellák száma">
  <label for="n">cellák száma n =</label><input id="n" type="range" min="5" max="100" step="1" value="10" aria-label="A [0,1] intervallum cellaszáma"><b id="nv"></b>
  <label for="c">kiemelt cella k =</label><input id="c" type="number" min="0" max="99" step="1" value="0" aria-label="A kiemelt cella indexe (0-tól)">
  <span class="small">(a hisztogram egy oszlopára kattintva is)</span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 370" role="img" aria-label="Hisztogram a [0,1]-en, a 0 közelében magas oszlopokkal, rajta az 1/(2√y) görbe; alatta az x-cellák leképezése az y-tengelyre"></svg>
<p class="small">λ a [0, 1]-en, f(x) = x². Az n egyenlő cella mindegyike 1/n tömegű; a k-adik cella képe [k²/n², (k+1)²/n²], az oszlop magassága tömeg / képhossz = n/(2k + 1). n növelésével a hisztogram a h(y) = 1/(2√y) sűrűséghez simul. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const L = 55, R = 540, T = 16, B = 250, YM = 11;
const sx = y => L + y * (R - L), sy = v => B - Math.min(v, YM) / YM * (B - T);
const XR = 300, YR = 345;
function draw(){
  const n = +$("n").value; $("nv").textContent = n; $("c").max = n - 1; const K = Math.max(0, Math.min(n - 1, +$("c").value)); $("c").value = K;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  for (let v = 2; v <= 10; v += 2) el("line", {x1: L, x2: R, y1: sy(v), y2: sy(v), stroke: css("--grid")});
  for (let k = 0; k < n; k++){ const a = (k / n) ** 2, b = ((k + 1) / n) ** 2, d = (1 / n) / (b - a);
    const r = el("rect", {x: sx(a), y: sy(d), width: Math.max(0.4, sx(b) - sx(a)), height: B - sy(d), fill: k === K ? css("--hl2") : css("--fill"), "fill-opacity": k === K ? 0.6 : 1, stroke: fg, "stroke-width": n > 40 ? 0.3 : 0.7, style: "cursor:pointer"});
    r.addEventListener("click", () => { $("c").value = k; draw(); }); }
  const c = []; for (let i = 0; i <= 300; i++){ const y = 0.002 + 0.998 * i / 300; c.push(sx(y).toFixed(1) + "," + sy(0.5 / Math.sqrt(y)).toFixed(1)); }
  el("polyline", {points: c.join(" "), fill: "none", stroke: fg, "stroke-width": 1.6, "stroke-dasharray": "6 4"});
  el("line", {x1: L, x2: R, y1: B, y2: B, stroke: fg}); el("line", {x1: L, x2: L, y1: T, y2: B, stroke: fg});
  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(v => el("text", {x: sx(v), y: B + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, v % 1 ? 1 : 0)));
  [0, 2, 4, 6, 8, 10].forEach(v => el("text", {x: L - 6, y: sy(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, String(v)));
  el("text", {x: R - 4, y: T + 12, "font-size": 12, "text-anchor": "end"}, "szaggatott: h(y) = 1/(2√y); oszlop: tömeg / képhossz");
  // leképezési sáv
  el("line", {x1: L, x2: R, y1: XR, y2: XR, stroke: fg}); el("line", {x1: L, x2: R, y1: YR, y2: YR, stroke: fg});
  el("text", {x: L - 6, y: XR + 4, "font-size": 11, "text-anchor": "end"}, "x"); el("text", {x: L - 6, y: YR + 4, "font-size": 11, "text-anchor": "end"}, "y");
  const step = Math.max(1, Math.round(n / 20));
  for (let k = 0; k <= n; k += step){ const x = k / n; el("line", {x1: sx(x), x2: sx(x * x), y1: XR + 3, y2: YR - 3, stroke: mu, "stroke-width": 0.6, "stroke-dasharray": "1 3"}); }
  const a = K / n, b = (K + 1) / n;
  el("line", {x1: sx(a), x2: sx(b), y1: XR, y2: XR, stroke: css("--hl2"), "stroke-width": 7});
  el("line", {x1: sx(a * a), x2: sx(b * b), y1: YR, y2: YR, stroke: css("--hl2"), "stroke-width": 7});
  el("polygon", {points: [[sx(a), XR], [sx(b), XR], [sx(b * b), YR], [sx(a * a), YR]].map(p => p.join(",")).join(" "), fill: css("--hl2"), opacity: 0.2});
  el("text", {x: R, y: XR - 6, "font-size": 11, "text-anchor": "end", fill: mu}, "őskép f⁻¹(B) az x-tengelyen (λ-tömeg " + fmt(1 / n, 4) + ")");
  el("text", {x: R, y: YR + 16, "font-size": 11, "text-anchor": "end", fill: mu}, "B = f(cella) az y-tengelyen");
  const d = (1 / n) / (b * b - a * a);
  $("status").textContent = "n = " + n + ": első oszlop " + fmt(n / 1, 3) + ", utolsó ≈ " + fmt(n / (2 * n - 1), 3) + " | kiemelt k = " + K + ": B = [" + fmt(a * a, 4) + "; " + fmt(b * b, 4) +
    "], f⁻¹(B) = [" + fmt(a, 4) + "; " + fmt(b, 4) + "], f#λ(B) = λ(f⁻¹(B)) = " + fmt(1 / n, 4) + ", oszlopmagasság = " + fmt(d, 3);
}
$("n").addEventListener("input", draw); $("c").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
