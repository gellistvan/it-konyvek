<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farokszuprémum és farokinfimum</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Sorozat és farok">
  <label for="seq">Sorozat:</label>
  <select id="seq"><option value="x">xₙ = (−1)ⁿ + 1/n</option><option value="alt">(−1)ⁿ</option><option value="inv">1/n</option><option value="y">yₙ = ((−1)ⁿn + 1)/(n + 1)</option></select>
  <label for="n">n =</label><input id="n" type="range" min="1" max="20" step="1" value="3"><b id="nv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Egy sorozat első húsz tagja pontokként, a farokszuprémumok csökkenő lépcsője tömör, a farokinfimumok szaggatott vonallal; a kiválasztott n-től kezdődő farok kiemelve"></svg>
<p class="small">Tömör lépcső: aₙ = sup{xₖ : k ≥ n}, szaggatott: bₙ = inf{xₖ : k ≥ n}; pontozott: limsup és liminf. Számított értékek a definícióból (zárt alakban, a teljes végtelen farokra). Kezdőállapot: n = 3.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const F = {x: k => Math.pow(-1, k) + 1 / k, alt: k => Math.pow(-1, k), inv: k => 1 / k, y: k => (Math.pow(-1, k) * k + 1) / (k + 1)};
function SI(s, n){
  if (s === "x") { const m = n % 2 === 0 ? n : n + 1; return [1 + 1 / m, -1, true, false]; }
  if (s === "alt") return [1, -1, true, true];
  if (s === "inv") return [1 / n, 0, true, false];
  return [1, -1, true, false];          // y: a páros tagok mind 1-ek, a páratlanok −1 felé tartanak
}
const LIM = {x: [1, -1], alt: [1, -1], inv: [0, 0], y: [1, -1]};
function draw(){
  const s = $("seq").value, n = +$("n").value;
  $("nv").textContent = n;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const L = 50, R = 540, T = 15, B = 300, X = k => L + (R - L) * (k - 0.5) / 20, Y = y => B - (B - T) * (y + 2.2) / 4.2;
  [-2, -1, 0, 1, 2].forEach(t => { el("line", {x1: L, y1: Y(t), x2: R, y2: Y(t), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(t, 0)); });
  [1, 5, 10, 15, 20].forEach(t => el("text", {x: X(t), y: B + 16, "text-anchor": "middle", "font-size": 11, fill: mu}, String(t)));
  el("rect", {x: X(n - 0.5), y: T, width: R - X(n - 0.5), height: B - T, fill: css("--hl"), "fill-opacity": 0.08});
  // lépcsők
  let pu = [], pl = [];
  for (let k = 1; k <= 20; k++) { const q = SI(s, k); pu.push(X(k - 0.5) + "," + Y(q[0]), X(k + 0.5) + "," + Y(q[0])); pl.push(X(k - 0.5) + "," + Y(q[1]), X(k + 0.5) + "," + Y(q[1])); }
  el("polyline", {points: pu.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("polyline", {points: pl.join(" "), fill: "none", stroke: fg, "stroke-width": 2, "stroke-dasharray": "7 4"});
  const lim = LIM[s];
  [lim[0], lim[1]].forEach(v => el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: mu, "stroke-dasharray": "2 3"}));
  for (let k = 1; k <= 20; k++) {
    const on = k >= n;
    el("circle", {cx: X(k), cy: Y(F[s](k)), r: on ? 5 : 3.5, fill: on ? css("--hl") : css("--bg"), stroke: on ? css("--hl") : mu, "stroke-width": 1.5});
  }
  const q = SI(s, n);
  el("line", {x1: X(n - 0.5), y1: Y(q[0]), x2: R, y2: Y(q[0]), stroke: css("--hl2"), "stroke-width": 3});
  el("line", {x1: X(n - 0.5), y1: Y(q[1]), x2: R, y2: Y(q[1]), stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "7 4"});
  el("text", {x: X(n - 0.5) + 4, y: Y(q[0]) - 6, "font-size": 12, fill: css("--hl2")}, "sup = " + fmt(q[0], 4).replace(/,?0+$/, ""));
  el("text", {x: X(n - 0.5) + 4, y: Y(q[1]) + 16, "font-size": 12, fill: css("--hl2")}, "inf = " + fmt(q[1], 4).replace(/,?0+$/, "").replace(/^−?$/, "0"));
  const nz = v => { const t = fmt(v, 4).replace(/(,\d*?)0+$/, "$1").replace(/,$/, ""); return t === "−0" ? "0" : t; };
  $("status").textContent = "n = " + n + ": sup = " + nz(q[0]) + ", inf = " + nz(q[1]) +
    "   (a farok összes tagjára, nem csak az ábrázolt 20-ig; az infimumot " + (q[3] ? "a sorozat felveszi" : "a sorozat nem veszi fel") + ")" +
    "   |   limsup = " + nz(lim[0]) + ", liminf = " + nz(lim[1]);
}
["seq", "n"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
