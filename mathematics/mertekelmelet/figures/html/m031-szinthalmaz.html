<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szinthalmaz mint őskép</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:1.6em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="t">t = <output id="tv">0,25</output></label>
  <input id="t" type="range" min="-0.5" max="1.2" step="0.01" value="0.25" aria-label="A t szint">
  <label><input id="ge" type="checkbox"> {f ≥ t} mód</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Parabola a [0,1] szakaszon, vízszintes szintvonallal; az x-tengelyen kiemelve az a rész, ahol a parabola a szint fölött van."></svg>
<p class="small">f(x) = x² a [0, 1]-en. A kiemelt halmaz {f &gt; t} = f⁻¹((t, ∞)): az x-tengely azon része, ahol a grafikon a t szint fölött van. Üres karika: a végpont nincs benne; teli karika: benne van. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function hu(x){ return String(Number(x.toFixed(4))).replace(".", ",").replace("-", "−"); }
const X = x => 70 + x * 400, Y = y => 250 - y * 190;
function setOf(t, ge){
  if (ge ? t <= 0 : t < 0) return [0, 1, true, true];
  if (ge ? t <= 1 : t < 1) return [Math.sqrt(t), 1, ge, true];
  return null;
}
function draw(){
  const t = +document.getElementById("t").value, ge = document.getElementById("ge").checked;
  document.getElementById("tv").textContent = hu(t);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), bg = css("--bg");
  el("line", {x1: X(0), y1: Y(0), x2: X(1.08), y2: Y(0), stroke: mu});
  el("line", {x1: X(0), y1: Y(-0.5), x2: X(0), y2: Y(1.22), stroke: mu});
  [0, 0.5, 1].forEach(v => { el("text", {x: X(v), y: Y(0) + 16, "text-anchor": "middle", "font-size": 12}, hu(v));
    el("text", {x: X(0) - 8, y: Y(v) + 4, "text-anchor": "end", "font-size": 12}, hu(v)); });
  el("text", {x: X(-0.02), y: Y(-0.5) + 4, "text-anchor": "end", "font-size": 12}, "−0,5");
  let p = ""; for (let i = 0; i <= 200; i++) { const x = i / 200; p += X(x).toFixed(1) + "," + Y(x * x).toFixed(1) + " "; }
  el("polyline", {points: p, fill: "none", stroke: fg, "stroke-width": 1.6});
  el("line", {x1: X(-0.02), y1: Y(t), x2: X(1.08), y2: Y(t), stroke: hl2, "stroke-width": 1.8, "stroke-dasharray": "8 4"});
  el("text", {x: X(1.09), y: Y(t) + 4, "font-size": 13, fill: hl2}, "y = t");
  const S = setOf(t, ge), yb = Y(-0.32);
  let txt;
  if (S) {
    const [a, b, lc, rc] = S;
    let q = ""; for (let i = 0; i <= 100; i++) { const x = a + (b - a) * i / 100; q += X(x).toFixed(1) + "," + Y(x * x).toFixed(1) + " "; }
    el("polyline", {points: q, fill: "none", stroke: hl, "stroke-width": 5});
    if (a > 0) el("line", {x1: X(a), y1: Y(t), x2: X(a), y2: yb, stroke: mu, "stroke-dasharray": "2 3"});
    el("line", {x1: X(a), y1: yb, x2: X(b), y2: yb, stroke: hl, "stroke-width": 6});
    el("circle", {cx: X(a), cy: yb, r: 6, fill: lc ? hl : bg, stroke: hl, "stroke-width": 2});
    el("circle", {cx: X(b), cy: yb, r: 6, fill: rc ? hl : bg, stroke: hl, "stroke-width": 2});
    txt = (lc ? "[" : "(") + hu(a) + "; " + hu(b) + "]";
  } else {
    el("text", {x: X(0.5), y: yb + 5, "text-anchor": "middle", "font-size": 14, fill: hl}, "üres halmaz");
    txt = "∅";
  }
  el("text", {x: X(0) - 8, y: yb + 4, "text-anchor": "end", "font-size": 12, fill: hl}, ge ? "{f ≥ t}" : "{f > t}");
  document.getElementById("status").textContent = "t = " + hu(t) + ": " + (ge ? "{f ≥ t}" : "{f > t}") + " = " + txt;
}
document.getElementById("t").addEventListener("input", draw);
document.getElementById("ge").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
