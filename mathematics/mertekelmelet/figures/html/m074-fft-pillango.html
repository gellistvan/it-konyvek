<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy FFT-lépés: pillangók</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Saját vektor:</span>
<input id="v0" type="number" value="1" step="any" style="width:4.5em" aria-label="x(0)">
<input id="v1" type="number" value="2" step="any" style="width:4.5em" aria-label="x(1)">
<input id="v2" type="number" value="3" step="any" style="width:4.5em" aria-label="x(2)">
<input id="v3" type="number" value="4" step="any" style="width:4.5em" aria-label="x(3)">
<button id="calc">Számol</button><span id="chk" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 1, 2, 3, 4 vektor páros és páratlan elemei külön transzformálódnak, majd keresztező nyilakkal összeadva és kivonva adják a 10, −2+2i, −2, −2−2i értékeket"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">N = 4, M = 2; a csavaró tényezők e^(−2πik/4): k = 0-ra 1, k = 1-re −i. Saját vektornál a lépéssor újraszámolódik, és az eredményt a közvetlen DFT-vel vetjük össze.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stage": 0, "line": -1, "msg": "Bemenet: x = (1, 2, 3, 4), N = 4, M = 2.", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}, {"stage": 1, "line": 0, "msg": "1. Szétválasztás: x_par = (1, 3), x_páratlan = (2, 4).", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}, {"stage": 2, "line": 1, "msg": "2. Két 2-pontos DFT: x̂_par = (4, −2), x̂_páratlan = (6, −2).", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}, {"stage": 3, "line": 2, "msg": "3. Csavarás: e^(−2πi·0/4) = 1 és e^(−2πi·1/4) = −i; 1·6 = 6, (−i)·(−2) = 2i.", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}, {"stage": 4, "line": 3, "msg": "4. Pillangók, összeadás: x̂(0) = 4 + 6 = 10, x̂(1) = −2 + 2i.", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}, {"stage": 5, "line": 4, "msg": "4. Pillangók, kivonás: x̂(2) = 4 − 6 = −2, x̂(3) = −2 − 2i. Eredmény: (10, −2+2i, −2, −2−2i) = közvetlen DFT = np.fft.fft([1, 2, 3, 4]).", "x": [1, 2, 3, 4], "P": [[4.0, 0.0], [-2.0, -0.0]], "Q": [[6.0, 0.0], [-2.0, -0.0]], "W": [[6.0, 0.0], [-0.0, 2.0]], "X": [[10.0, 0.0], [-2.0, 2.0], [-2.0, 0.0], [-2.0, -2.0]]}];
const CODE = ["x_par(m) = x(2m),   x_paratlan(m) = x(2m+1),   m = 0, …, M−1", "x̂_par = DFT_M(x_par),   x̂_paratlan = DFT_M(x_paratlan)", "csavarás: e^(−2πik/N) · x̂_paratlan(k)", "x̂(k)     = x̂_par(k) + e^(−2πik/N) · x̂_paratlan(k),   k = 0, …, M−1", "x̂(k + M) = x̂_par(k) − e^(−2πik/N) · x̂_paratlan(k),   k = 0, …, M−1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function cf(z){ const r = Math.round(z[0] * 1e4) / 1e4, i = Math.round(z[1] * 1e4) / 1e4;
  const n = v => String(Math.abs(v)).replace(".", ","), sg = v => v < 0 ? "−" : "";
  if (i === 0) return sg(r) + n(r);
  const im = (Math.abs(i) === 1 ? "" : n(i)) + "i";
  if (r === 0) return sg(i) + im;
  return sg(r) + n(r) + (i < 0 ? "−" : "+") + im; }
function cm(a, b){ return [a[0]*b[0] - a[1]*b[1], a[0]*b[1] + a[1]*b[0]]; }
function box(xc, y, txt, on, w){ w = w || 74;
  el("rect", {x: xc - w/2, y: y - 14, width: w, height: 28, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.4 : 1.1});
  el("text", {x: xc, y: y + 5, "text-anchor": "middle", "font-size": 13}, txt); }
function ar(x0, y0, x1, y1, dash, lab, on){
  const c = on ? css("--hl") : css("--muted");
  el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: c, "stroke-width": on ? 2 : 1.1, "stroke-dasharray": dash ? "6 4" : "none"});
  const a = Math.atan2(y1 - y0, x1 - x0), h = 8;
  el("polygon", {points: [[x1, y1], [x1 - h*Math.cos(a - 0.4), y1 - h*Math.sin(a - 0.4)], [x1 - h*Math.cos(a + 0.4), y1 - h*Math.sin(a + 0.4)]].map(p => p.join(",")).join(" "), fill: c});
  if (lab) el("text", {x: (x0 + x1)/2, y: (y0 + y1)/2 - 5, "text-anchor": "middle", "font-size": 12, fill: c}, lab); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 270");
  svg.innerHTML = "";
  const C = [42, 145, 255, 375, 495], Y = [60, 110, 180, 230];
  ["x(n)", "páros/páratlan", "2-pontos DFT", "csavarás", "x̂(k)"].forEach((h, i) => el("text", {x: C[i], y: 24, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, h));
  const src = [60, 110, 180, 230];
  s.x.forEach((v, i) => box(C[0], src[i], "x(" + i + ") = " + String(v).replace(".", ",").replace("-", "−"), s.stage === 0, 70));
  if (s.stage >= 1) { [[0, 60], [2, 110], [1, 180], [3, 230]].forEach(([n, y]) => { ar(C[0] + 35, src[n], C[1] - 30, y, false, null, s.stage === 1); box(C[1], y, String(s.x[n]).replace(".", ",").replace("-", "−"), s.stage === 1, 56); });
    el("text", {x: 118, y: 149, "font-size": 11.5, fill: css("--muted")}, "felül: par, alul: páratlan"); }
  if (s.stage >= 2) for (let k = 0; k < 2; k++) {
    ar(C[1] + 28, Y[k], C[2] - 40, Y[k], false, null, s.stage === 2); ar(C[1] + 28, Y[k + 2], C[2] - 40, Y[k + 2], false, null, s.stage === 2);
    box(C[2], Y[k], cf(s.P[k]), s.stage === 2, 80); box(C[2], Y[k + 2], cf(s.Q[k]), s.stage === 2, 80); }
  if (s.stage >= 3) for (let k = 0; k < 2; k++) {
    ar(C[2] + 40, Y[k], C[3] - 40, Y[k], false, null, s.stage === 3); box(C[3], Y[k], cf(s.P[k]), false, 80);
    ar(C[2] + 40, Y[k + 2], C[3] - 40, Y[k + 2], false, "·" + (k === 0 ? "1" : "(−i)"), s.stage === 3); box(C[3], Y[k + 2], cf(s.W[k]), s.stage === 3, 80); }
  const out = [60, 110, 180, 230];
  if (s.stage >= 4) for (let k = 0; k < 2; k++) { ar(C[3] + 40, Y[k], C[4] - 46, out[k], false, null, s.stage === 4); ar(C[3] + 40, Y[k + 2], C[4] - 46, out[k], false, null, s.stage === 4); box(C[4], out[k], "x̂(" + k + ") = " + cf(s.X[k]), s.stage === 4, 92); }
  if (s.stage >= 5) for (let k = 0; k < 2; k++) { ar(C[3] + 40, Y[k], C[4] - 46, out[k + 2], true, null, true); ar(C[3] + 40, Y[k + 2], C[4] - 46, out[k + 2], true, null, true); box(C[4], out[k + 2], "x̂(" + (k + 2) + ") = " + cf(s.X[k + 2]), true, 92); }
  el("text", {x: 10, y: 262, "font-size": 11.5, fill: css("--muted")}, "folytonos nyíl: összeadás; szaggatott: kivonás (k + M); a ·1 és ·(−i) a csavaró tényező");
}
function dftDirect(v){ const r = []; for (let k = 0; k < 4; k++) { let a = 0, b = 0; for (let n = 0; n < 4; n++) { a += v[n]*Math.cos(2*Math.PI*n*k/4); b -= v[n]*Math.sin(2*Math.PI*n*k/4); } r.push([a, b]); } return r; }
document.getElementById("calc").onclick = () => {
  const v = [0, 1, 2, 3].map(i => +document.getElementById("v" + i).value || 0);
  const P = [[v[0] + v[2], 0], [v[0] - v[2], 0]], Q = [[v[1] + v[3], 0], [v[1] - v[3], 0]];
  const tw = [[1, 0], [0, -1]], W = [cm(tw[0], Q[0]), cm(tw[1], Q[1])];
  const X = [[P[0][0] + W[0][0], P[0][1] + W[0][1]], [P[1][0] + W[1][0], P[1][1] + W[1][1]], [P[0][0] - W[0][0], P[0][1] - W[0][1]], [P[1][0] - W[1][0], P[1][1] - W[1][1]]];
  const D = dftDirect(v), ok = X.every((z, i) => Math.abs(z[0] - D[i][0]) < 1e-9 && Math.abs(z[1] - D[i][1]) < 1e-9);
  const b = {x: v, P, Q, W, X}, vs = v.map(t => String(t).replace(".", ",").replace("-", "−")).join(", ");
  const L = [["Bemenet: x = (" + vs + ")."], ["1. Szétválasztás: x_par = (" + vs.split(", ")[0] + ", " + vs.split(", ")[2] + "), x_páratlan = (" + vs.split(", ")[1] + ", " + vs.split(", ")[3] + ")."],
    ["2. Két 2-pontos DFT: x̂_par = (" + cf(P[0]) + ", " + cf(P[1]) + "), x̂_páratlan = (" + cf(Q[0]) + ", " + cf(Q[1]) + ")."],
    ["3. Csavarás 1-gyel és −i-vel: (" + cf(W[0]) + ", " + cf(W[1]) + ")."],
    ["4. Pillangók, összeadás: x̂(0) = " + cf(X[0]) + ", x̂(1) = " + cf(X[1]) + "."],
    ["4. Pillangók, kivonás: x̂(2) = " + cf(X[2]) + ", x̂(3) = " + cf(X[3]) + ". Közvetlen DFT: " + (ok ? "egyezik." : "ELTÉR!")]];
  document.getElementById("chk").textContent = ok ? " ✓ az FFT egyezik a közvetlen DFT-vel" : " ✗ eltérés";
  setSteps(L.map((m, i) => Object.assign({stage: i, line: i - 1, msg: m[0]}, b)));
};


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
