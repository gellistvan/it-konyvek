<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bessel-részösszegek: f(x) = x</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Részletösszeg foka">
  <button id="prev" aria-label="N csökkentése">◀ Lépés</button>
  <label for="n">N =</label><input id="n" type="range" min="0" max="50" step="1" value="1" aria-label="A részletösszeg foka, N"><b id="nv"></b>
  <button id="next" aria-label="N növelése">Lépés ▶</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Az f(x)=x egyenes és trigonometrikus részletösszege a [0,1]-en, mellette a négyzetes hiba oszlopai"></svg>
<p class="small">s_N(x) = 1/2 − Σ_{n=1}^N sin(2πnx)/(πn); a végpontokban (x = 0 és x = 1, a periodikus kiterjesztés ugrásánál) a Gibbs-túllövés N növelésével sem tűnik el, az L²-hiba mégis 0-hoz tart. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const W = 560, X0 = 40, PW = 290, Y0 = 20, PH = 270;
function sN(x, N){ let s = 0.5; for (let n = 1; n <= N; n++) s -= Math.sin(2*Math.PI*n*x)/(Math.PI*n); return s; }
function bs(N){ let s = 0.25; for (let n = 1; n <= N; n++) s += 2/(4*Math.PI*Math.PI*n*n); return s; }
const px = x => X0 + x*PW, py = y => Y0 + PH - (y + 0.2)/1.4*PH;
const BX = 380, BW = 170, bx = N => BX + N/50*BW, by = e => Y0 + PH - e/0.09*PH;
function draw(){
  const N = +$("n").value; $("nv").textContent = N;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: css("--grid")});
  el("line", {x1: X0, y1: Y0, x2: X0, y2: Y0 + PH, stroke: css("--grid")});
  [0, 0.5, 1].forEach(v => { el("text", {x: px(v), y: py(0) + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(v).replace(".", ","));
    el("text", {x: X0 - 4, y: py(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, String(v).replace(".", ",")); });
  el("line", {x1: px(0), y1: py(0), x2: px(1), y2: py(1), stroke: fg, "stroke-width": 2});
  const pts = [];
  for (let i = 0; i <= 800; i++) { const x = i/800; pts.push(px(x) + "," + py(sN(x, N))); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: css("--hl2"), "stroke-width": 1.6, "stroke-dasharray": "6 3"});
  el("text", {x: X0 + 6, y: Y0 + 12, "font-size": 12}, "folytonos: f(x) = x; szaggatott: s_N");
  // oszlopok
  el("text", {x: BX, y: Y0 + 12, "font-size": 12}, "‖f − s_k‖₂², k = 0…50");
  for (let k = 0; k <= 50; k++) { const e = 1/3 - bs(k);
    el("rect", {x: bx(k) - 1.4, y: by(e), width: 2.8, height: Y0 + PH - by(e), fill: k === N ? css("--hl") : css("--fill"), stroke: k === N ? css("--hl") : mu, "stroke-width": 0.4}); }
  el("line", {x1: BX - 4, y1: Y0 + PH, x2: BX + BW + 4, y2: Y0 + PH, stroke: mu});
  [0, 25, 50].forEach(v => el("text", {x: bx(v), y: Y0 + PH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(v)));
  [0, 0.04, 0.08].forEach(v => el("text", {x: BX - 6, y: by(v) + 4, "font-size": 10, "text-anchor": "end", fill: mu}, String(v).replace(".", ",")));
  const b = bs(N);
  $("status").textContent = "N = " + N + ", Σ |c_n|² (|n| ≤ N) = " + fmt(b, 5) + ", ‖f − s_N‖₂² = " + fmt(1/3 - b, 5) + ", ‖f‖₂² = 0,3333";
}
$("n").addEventListener("input", draw);
$("prev").onclick = () => { $("n").value = Math.max(0, +$("n").value - 1); draw(); };
$("next").onclick = () => { $("n").value = Math.min(50, +$("n").value + 1); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
