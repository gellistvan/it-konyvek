<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hahn-felbontás és teljes variáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Az A = [a, b] intervallum">
  <label for="a">a =</label><input id="a" type="range" min="0" max="1" step="0.01" value="0" aria-label="Az A intervallum bal végpontja"><b id="av"></b>
  <label for="b">b =</label><input id="b" type="range" min="0" max="1" step="0.01" value="1" aria-label="Az A intervallum jobb végpontja"><b id="bv"></b>
</div>
<div class="ctl">
  <label><input id="sq" type="checkbox"> második sűrűség: f(x) = x² − 1/3 (2. feladat)</label>
  <button id="half">A = [0, 1/2]</button><button id="all">A = [0, 1]</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Az x − 1/2 sűrűség grafikonja a [0,1]-en, a negatív rész sraffozva, a pozitív pontozva, a P és N határa szaggatott vonallal"></svg>
<p class="small">ν(A) = ∫_A f dλ, ν⁺(A) = ∫_{A∩P} f, ν⁻(A) = ∫_{A∩N} (−f), |ν|(A) = ν⁺(A) + ν⁻(A). Számított értékek a definícióból (zárt alakú primitív függvény).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const D = {lin: {f: x => x - 0.5, F: x => x*x/2 - x/2, r: 0.5, name: "f(x) = x − 1/2"},
           sq: {f: x => x*x - 1/3, F: x => x*x*x/3 - x/3, r: 1/Math.sqrt(3), name: "f(x) = x² − 1/3"}};
const X0 = 60, PW = 440, Y0 = 30, PH = 240, ymin = -0.55, ymax = 0.75;
const px = x => X0 + x*PW, py = y => Y0 + (ymax - y)/(ymax - ymin)*PH;
function parts(d, a, b){ const pos = d.F(Math.max(b, d.r)) - d.F(Math.max(a, d.r)); const neg = -(d.F(Math.min(b, d.r)) - d.F(Math.min(a, d.r)));
  return {nu: pos - neg, pos, neg, tv: pos + neg}; }
function area(d, lo, hi, fill, pat){ if (hi <= lo) return; const p = [px(lo) + "," + py(0)];
  for (let i = 0; i <= 100; i++) { const x = lo + (hi - lo)*i/100; p.push(px(x) + "," + py(d.f(x))); }
  p.push(px(hi) + "," + py(0)); el("polygon", {points: p.join(" "), fill: fill, "fill-opacity": 0.9, stroke: "none"});
  if (pat) el("polygon", {points: p.join(" "), fill: "url(#" + pat + ")", stroke: "none"}); }
function draw(){
  let a = +$("a").value, b = +$("b").value; if (a > b) { const t = a; a = b; b = t; }
  $("av").textContent = fmt(+$("a").value, 2); $("bv").textContent = fmt(+$("b").value, 2);
  const d = $("sq").checked ? D.sq : D.lin, r = parts(d, a, b);
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  const defs = el("defs", {});
  const p1 = el("pattern", {id: "hn", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 8, stroke: fg, "stroke-width": 1.2}, undefined, p1);
  const p2 = el("pattern", {id: "hp", width: 6, height: 6, patternUnits: "userSpaceOnUse"}, undefined, defs);
  el("circle", {cx: 3, cy: 3, r: 1.1, fill: fg}, undefined, p2);
  area(d, a, Math.min(b, d.r), css("--fill"), "hn"); area(d, Math.max(a, d.r), b, css("--cellhl"), "hp");
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: mu});
  [0, 0.25, 0.5, 0.75, 1].forEach(v => el("text", {x: px(v), y: py(0) + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, 2)));
  [-0.5, 0, 0.5].forEach(v => el("text", {x: X0 - 6, y: py(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, 1)));
  const pts = []; for (let i = 0; i <= 200; i++) { const x = i/200; pts.push(px(x) + "," + py(d.f(x))); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2.2});
  el("line", {x1: px(d.r), y1: Y0, x2: px(d.r), y2: Y0 + PH, stroke: fg, "stroke-dasharray": "5 4"});
  el("text", {x: px(d.r) + 5, y: Y0 + 12, "font-size": 12}, "P | N határ: x = " + fmt(d.r, 4));
  el("line", {x1: px(a), y1: Y0 + PH + 22, x2: px(b), y2: Y0 + PH + 22, stroke: css("--hl"), "stroke-width": 6});
  el("text", {x: (px(a) + px(b))/2, y: Y0 + PH + 42, "font-size": 12, "text-anchor": "middle", fill: css("--hl")}, "A = [" + fmt(a, 2) + ", " + fmt(b, 2) + "]");
  el("text", {x: X0, y: Y0 - 10, "font-size": 12}, d.name + "; sraffozott: N-beli rész (ν⁻), pontozott: P-beli rész (ν⁺)");
  $("status").textContent = "A = [" + fmt(a, 2) + ", " + fmt(b, 2) + "]: ν(A) = " + fmt(r.nu, 4) + ", ν⁺(A) = " + fmt(r.pos, 4) + ", ν⁻(A) = " + fmt(r.neg, 4) + ", |ν|(A) = " + fmt(r.tv, 4);
}
["a", "b"].forEach(id => $(id).addEventListener("input", draw)); $("sq").addEventListener("change", draw);
$("half").onclick = () => { $("a").value = 0; $("b").value = 0.5; draw(); };
$("all").onclick = () => { $("a").value = 0; $("b").value = 1; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
