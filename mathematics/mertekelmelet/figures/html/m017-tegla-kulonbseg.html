<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tégla különbsége négy diszjunkt téglára bontva</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label class="small">c₁ <input type="range" id="c1" min="0" max="2" step="0.05" value="0.5" style="width:90px" oninput="fixS.call(this); show(k)" aria-label="c₁"></label><label class="small">d₁ <input type="range" id="d1" min="0" max="2" step="0.05" value="1.5" style="width:90px" oninput="fixS.call(this); show(k)" aria-label="d₁"></label><label class="small">c₂ <input type="range" id="c2" min="0" max="2" step="0.05" value="0.5" style="width:90px" oninput="fixS.call(this); show(k)" aria-label="c₂"></label><label class="small">d₂ <input type="range" id="d2" min="0" max="2" step="0.05" value="1.5" style="width:90px" oninput="fixS.call(this); show(k)" aria-label="d₂"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A (0,2]×(0,2] négyzet, benne a kivont S tégla; a maradék két függőleges oldalsávra és két vízszintes sávra bontva, területfeliratokkal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A darabok a 6.4.5 koordinátánkénti eljárásának sorrendjében jelennek meg; a csúszkák a belső tégla c₁ < d₁, c₂ < d₂ végpontjait állítják (0 ≤ c &lt; d ≤ 2). Számított értékek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés: T = (0, 2]² és a kivonandó belső S tégla.", "line": 0, "step": 0}, {"msg": "2. lépés: 1. koordináta: ((0,2] ∖ (c₁,d₁]) × (0,2] – két függőleges oldalsáv.", "line": 1, "step": 1}, {"msg": "3. lépés: 2. koordináta: (c₁,d₁] × ((0,2] ∖ (c₂,d₂]) – az első koordináta M-be esik; két vízszintes sáv.", "line": 2, "step": 2}];
const CODE = ["T = (a₁,b₁] × (a₂,b₂],  S = (c₁,d₁] × (c₂,d₂],  M = T ∩ S", "i = 1:  ((a₁,b₁] ∖ (c₁,d₁]) × (a₂,b₂]          – legfeljebb 2 oldalsáv", "i = 2:  (M₁) × ((a₂,b₂] ∖ (c₂,d₂])             – legfeljebb 2 sáv", "(a,b] ∖ (c,d] = (a, min(b,c)] ∪ (max(a,d), b]  (üres tag elhagyva)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function v(id){ return +document.getElementById(id).value; }
function fmt(x){ return (Math.round(x * 100) / 100).toString().replace(".", ","); }
function iv(a, b){ return "(" + fmt(a) + "; " + fmt(b) + "]"; }
function d1(a, b, c, d){ return [[a, Math.min(b, c)], [Math.max(a, d), b]].filter(t => t[0] < t[1]); }
function fixS(){ ["1", "2"].forEach(i => { const c = document.getElementById("c" + i), d = document.getElementById("d" + i);
  if (+c.value >= +d.value) { if (this && this.id === "d" + i) c.value = Math.max(0, +d.value - 0.05).toFixed(2); else d.value = Math.min(2, +c.value + 0.05).toFixed(2); } }); }
function P2X(x){ return 40 + x * 120; } function P2Y(y){ return 270 - y * 120; }
function piece(r, pat, on){
  const [[x0, x1], [y0, y1]] = r, i = 2;
  const X0 = P2X(x0) + i, X1 = P2X(x1) - i, Y0 = P2Y(y0) - i, Y1 = P2Y(y1) + i;
  if (on) el("rect", {x: X0, y: Y1, width: X1 - X0, height: Y0 - Y1, fill: "url(#" + pat + ")", stroke: "none"});
  const sw = on ? 2 : 1, col = on ? css("--line") : css("--muted");
  el("line", {x1: X0, y1: Y0, x2: X0, y2: Y1, stroke: col, "stroke-width": sw, "stroke-dasharray": "5 3"});
  el("line", {x1: X0, y1: Y0, x2: X1, y2: Y0, stroke: col, "stroke-width": sw, "stroke-dasharray": "5 3"});
  el("line", {x1: X1, y1: Y0, x2: X1, y2: Y1, stroke: col, "stroke-width": sw});
  el("line", {x1: X0, y1: Y1, x2: X1, y2: Y1, stroke: col, "stroke-width": sw});
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const fg = css("--fg");
  const defs = el("defs", {});
  const pats = {pv: [6, "M3,0 L3,6"], pv2: [3, "M1.5,0 L1.5,3"], ph: [6, "M0,3 L6,3"], pd: [6, ""]};
  for (const id in pats) { const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", pats[id][0]); p.setAttribute("height", pats[id][0]); p.setAttribute("patternUnits", "userSpaceOnUse");
    if (pats[id][1]) { const q = document.createElementNS(NS, "path"); q.setAttribute("d", pats[id][1]); q.setAttribute("stroke", fg); q.setAttribute("stroke-width", 1); p.appendChild(q); }
    else { const q = document.createElementNS(NS, "circle"); q.setAttribute("cx", 3); q.setAttribute("cy", 3); q.setAttribute("r", 1.1); q.setAttribute("fill", fg); p.appendChild(q); }
    defs.appendChild(p); }
  const c1 = v("c1"), d1v = v("d1"), c2 = v("c2"), d2 = v("d2");
  // tengelyek
  el("line", {x1: 40, y1: 270, x2: 300, y2: 270, stroke: fg}); el("line", {x1: 40, y1: 270, x2: 40, y2: 15, stroke: fg});
  [0, 0.5, 1, 1.5, 2].forEach(t => { el("text", {x: P2X(t), y: 287, "text-anchor": "middle", "font-size": 11}, fmt(t));
    el("text", {x: 34, y: P2Y(t) + 4, "text-anchor": "end", "font-size": 11}, fmt(t)); });
  el("rect", {x: P2X(0), y: P2Y(2), width: 240, height: 240, fill: "none", stroke: css("--muted"), "stroke-width": 1});
  el("text", {x: P2X(2) + 6, y: P2Y(2) + 12, "font-size": 12}, "T");
  el("rect", {x: P2X(c1), y: P2Y(d2), width: (d1v - c1) * 120, height: (d2 - c2) * 120, fill: "none", stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "8 4"});
  el("text", {x: P2X((c1 + d1v) / 2), y: P2Y((c2 + d2) / 2) + 4, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, "S");
  const A = d1(0, 2, c1, d1v).map(I => [I, [0, 2]]);
  const m1 = [Math.max(0, c1), Math.min(2, d1v)];
  const B = m1[0] < m1[1] ? d1(0, 2, c2, d2).map(J => [m1, J]) : [];
  const all = A.map((r, i) => [r, i ? "pv2" : "pv", 1]).concat(B.map((r, i) => [r, i ? "pd" : "ph", 2]));
  const lines = [];
  let tot = 0;
  all.forEach(([r, pat, st]) => { if (s.step >= st) { piece(r, pat, true);
    const a = (r[0][1] - r[0][0]) * (r[1][1] - r[1][0]); tot += a;
    lines.push(iv(r[0][0], r[0][1]) + " × " + iv(r[1][0], r[1][1]) + ": " + fmt(a)); } });
  let y = 40;
  el("text", {x: 320, y: 22, "font-size": 12, "font-weight": "bold"}, s.step === 0 ? "S = " + iv(c1, d1v) + " × " + iv(c2, d2) : "darabok és területük:");
  lines.forEach(t => { el("text", {x: 320, y: y, "font-size": 12}, t); y += 18; });
  const full = 4 - (d1v - c1) * (d2 - c2);
  if (s.step > 0) el("text", {x: 320, y: y + 8, "font-size": 12, "font-weight": "bold"}, "összeg: " + fmt(tot) + (s.step === 2 ? " = 4 − " + fmt(4 - full) : ""));
  el("text", {x: 320, y: 250, "font-size": 11, fill: css("--muted")}, "folytonos oldal: zárt,");
  el("text", {x: 320, y: 266, "font-size": 11, fill: css("--muted")}, "szaggatott oldal: nyitott");
  status.textContent = s.msg + (lines.length ? " " + lines.join("; ") + "; összeg " + fmt(tot) + "." : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
