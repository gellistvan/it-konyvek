<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebesgue-féle nívósávos alsó közelítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Felosztás">
  <label for="N">N =</label><input id="N" type="range" min="2" max="32" step="1" value="4" aria-label="A szintek száma N"><b id="Nv"></b>
  <label for="k">kiemelt szint k =</label><input id="k" type="number" min="0" max="31" step="1" value="2" aria-label="A kiemelt szint indexe">
  <span class="small">(a rajzon egy rétegre kattintva is)</span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Parabola a [0,2] intervallumon, alatta vízszintes szintek; a kiemelt szint ősképe az x-tengelyen"></svg>
<p class="small">t_k = 4k/N, A_k = {t_k ≤ x² < t_k+1} = [√t_k, √t_k+1); az alsó közelítés Σ t_k·λ(A_k), amely N növelésével 8/3-hoz tart. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const L = 50, R = 500, T = 16, B = 300;
const sx = x => L + x / 2 * (R - L), sy = y => B - y / 4.2 * (B - T);
let N = 4, K = 2;
function draw(){
  N = +$("N").value; $("Nv").textContent = N; $("k").max = N - 1; K = Math.max(0, Math.min(N - 1, +$("k").value)); $("k").value = K;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  let s = 0;
  for (let k = 0; k < N; k++){ const t0 = 4 * k / N, t1 = 4 * (k + 1) / N, x0 = Math.sqrt(t0), x1 = Math.sqrt(t1);
    s += t0 * (x1 - x0);
    const r = el("rect", {x: sx(x0), y: sy(t0), width: Math.max(0.5, sx(x1) - sx(x0)), height: B - sy(t0), fill: k === K ? css("--cellhl") : css("--fill"), stroke: fg, "stroke-width": 0.6, style: "cursor:pointer"});
    const band = el("rect", {x: L, y: sy(t1), width: R - L, height: sy(t0) - sy(t1), fill: "transparent", style: "cursor:pointer"});
    band.addEventListener("click", () => { $("k").value = k; draw(); }); r.addEventListener("click", () => { $("k").value = k; draw(); });
    if (N <= 16) el("line", {x1: L, x2: R, y1: sy(t0), y2: sy(t0), stroke: css("--grid"), "stroke-width": 0.8});
  }
  const t0 = 4 * K / N, t1 = 4 * (K + 1) / N, a = Math.sqrt(t0), b = Math.sqrt(t1);
  el("rect", {x: L, y: sy(t1), width: R - L, height: sy(t0) - sy(t1), fill: css("--hl2"), opacity: 0.18});
  const c = []; for (let i = 0; i <= 200; i++){ const x = 2 * i / 200; c.push(sx(x).toFixed(1) + "," + sy(x * x).toFixed(1)); }
  el("polyline", {points: c.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  [a, b].forEach(v => el("line", {x1: sx(v), x2: sx(v), y1: B, y2: sy(v * v), stroke: fg, "stroke-dasharray": "5 4"}));
  el("line", {x1: sx(a), x2: sx(b), y1: B, y2: B, stroke: css("--hl2"), "stroke-width": 7});
  el("line", {x1: L, x2: R, y1: B, y2: B, stroke: fg}); el("line", {x1: L, x2: L, y1: T, y2: B, stroke: fg});
  [0, 0.5, 1, 1.5, 2].forEach(v => el("text", {x: sx(v), y: B + 16, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, v % 1 ? 1 : 0)));
  [0, 1, 2, 3, 4].forEach(v => el("text", {x: L - 6, y: sy(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, String(v)));
  el("text", {x: R + 6, y: (sy(t0) + sy(t1)) / 2 + 4, "font-size": 11, fill: css("--hl2")}, "k = " + K);
  el("text", {x: L + 8, y: T + 14, "font-size": 12}, "A_k = {t_k ≤ f < t_k+1} = [" + fmt(a, 3) + "; " + fmt(b, 3) + ")");
  $("status").textContent = "N = " + N + ", Σ t_k·λ(A_k) = " + fmt(s, 4) + ", pontos: 2,6667 | kiemelt szint: t_" + K + " = " + fmt(t0, 3) +
    ", A_" + K + " = [√t_k, √t_k+1) = [" + fmt(a, 3) + "; " + fmt(b, 3) + "), λ(A_k) = " + fmt(b - a, 4);
}
$("N").addEventListener("input", draw); $("k").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
