<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliasing: spektrummásolatok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
#formula{font:14px/1.6 system-ui,sans-serif;margin-top:6px;padding:6px 8px;background:var(--code)}#formula .on{outline:2px solid var(--hl2);font-weight:bold}#formula .z{color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Mintavétel">
  <label for="T">T =</label><input id="T" type="range" min="0.3" max="1.2" step="0.05" value="0.4" aria-label="A mintavételi időköz, T, 0,3 és 1,2 között"><b id="tv"></b>
  <label for="B">B =</label><input id="B" type="number" min="0.2" max="2" step="0.1" value="1" aria-label="A spektrum sávszélessége, B">
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="A háromszög alakú spektrum 1/T távolságra ismétlődő másolatai és összegük; a T-csúszkával a másolatok közelednek és átfednek"></svg>
<div id="formula" aria-live="off"></div>
<p class="small">f̂(ξ) = max(0, 1 − |ξ|/B); a mintavételezett jel spektruma (1/T)·Σₖ f̂(ξ − k/T). T &lt; 1/(2B): rés, T = 1/(2B): érintkezés, T &gt; 1/(2B): átfedés (aliasing). Számított értékek a képletből, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function panel(x0, y0, w, h, xr, yr, opt){
  opt = opt || {};
  const P = {x0, y0, w, h, xr, yr,
    sx: x => x0 + (x - xr[0]) / (xr[1] - xr[0]) * w,
    sy: y => y0 + h - (y - yr[0]) / (yr[1] - yr[0]) * h};
  const mu = css("--muted"), gr = css("--grid");
  el("rect", {x: x0, y: y0, width: w, height: h, fill: "none", stroke: gr});
  (opt.xt || []).forEach(t => { el("line", {x1: P.sx(t), y1: y0, x2: P.sx(t), y2: y0 + h, stroke: gr});
    el("text", {x: P.sx(t), y: y0 + h + 13, "font-size": 11, "text-anchor": "middle", fill: mu}, fmtT(t)); });
  (opt.yt || []).forEach(t => { el("line", {x1: x0, y1: P.sy(t), x2: x0 + w, y2: P.sy(t), stroke: gr});
    el("text", {x: x0 - 4, y: P.sy(t) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmtT(t)); });
  if (yr[0] < 0 && yr[1] > 0) el("line", {x1: x0, y1: P.sy(0), x2: x0 + w, y2: P.sy(0), stroke: mu, "stroke-width": 0.8});
  if (opt.xl) el("text", {x: x0 + w, y: y0 + h + 26, "font-size": 12, "text-anchor": "end", fill: mu}, opt.xl);
  if (opt.title) el("text", {x: x0, y: y0 - 6, "font-size": 12.5, "font-weight": "bold"}, opt.title);
  return P;
}
function fmtT(t){ return String(+t.toFixed(4)).replace(".", ",").replace("-", "−"); }
function curve(P, xs, ys, attrs){
  const pts = [];
  for (let i = 0; i < xs.length; i++) { const y = Math.max(P.yr[0] - 0.05*(P.yr[1]-P.yr[0]), Math.min(P.yr[1] + 0.05*(P.yr[1]-P.yr[0]), ys[i])); pts.push(P.sx(xs[i]).toFixed(1) + "," + P.sy(y).toFixed(1)); }
  return el("polyline", Object.assign({points: pts.join(" "), fill: "none", stroke: css("--fg"), "stroke-width": 1.8}, attrs || {}));
}
function area(P, xs, ys, attrs){
  const pts = [P.sx(xs[0]).toFixed(1) + "," + P.sy(0).toFixed(1)];
  for (let i = 0; i < xs.length; i++) pts.push(P.sx(xs[i]).toFixed(1) + "," + P.sy(ys[i]).toFixed(1));
  pts.push(P.sx(xs[xs.length - 1]).toFixed(1) + "," + P.sy(0).toFixed(1));
  return el("polygon", Object.assign({points: pts.join(" "), fill: css("--fill"), stroke: "none"}, attrs || {}));
}

const XS = []; for (let i = 0; i <= 600; i++) XS.push(-3 + i * 0.01);
function fh(x, b){ return Math.max(0, 1 - Math.abs(x) / b); }
function draw(){
  const T = Math.round(+$("T").value * 100) / 100;
  let b = +$("B").value; if (!(b > 0)) b = 1;
  $("tv").textContent = fmt(T, 2);
  svg.innerHTML = "";
  const K = []; for (let k = -12; k <= 12; k++) K.push(k);
  const tot = XS.map(x => K.reduce((s, k) => s + fh(x - k / T, b) / T, 0));
  const cnt = XS.map(x => K.reduce((s, k) => s + (fh(x - k / T, b) > 1e-12 ? 1 : 0), 0));
  const ny = 1 / (2 * T), ymax = Math.max(1.5, 1.12 * Math.max(...tot));
  const P = panel(40, 26, 500, 220, [-3, 3], [0, ymax], {xt: [-3, -2, -1, 0, 1, 2, 3], yt: [0, 1, 2, 3, 4].filter(v => v <= ymax), xl: "ξ", title: "(1/T)·Σₖ f̂(ξ − k/T), f̂(ξ) = max(0, 1 − |ξ|/B)"});
  el("rect", {x: P.sx(Math.max(-3, -ny)), y: P.y0, width: P.sx(Math.min(3, ny)) - P.sx(Math.max(-3, -ny)), height: P.h, fill: css("--fill"), "fill-opacity": 0.7});
  // átfedés: függőleges sraffozás
  for (let i = 0; i < XS.length; i += 3) if (cnt[i] >= 2) el("line", {x1: P.sx(XS[i]), y1: P.sy(0), x2: P.sx(XS[i]), y2: P.sy(tot[i]), stroke: css("--hl2"), "stroke-width": 1, "stroke-opacity": 0.6});
  curve(P, XS, tot, {"stroke-width": 4, "stroke-opacity": 0.45});
  K.forEach(k => { if (Math.abs(k / T) < 3 + b) curve(P, XS, XS.map(x => fh(x - k / T, b) / T), {stroke: k === 0 ? css("--hl") : css("--fg"), "stroke-dasharray": "5 3", "stroke-width": k === 0 ? 1.8 : 1.2}); });
  [-ny, ny].forEach(v => { if (Math.abs(v) <= 3) el("text", {x: P.sx(v), y: P.y0 + 12, "font-size": 11, "text-anchor": "middle", fill: css("--muted")}, (v < 0 ? "−" : "") + "1/(2T)"); });
  el("text", {x: 40, y: 290, "font-size": 11.5, fill: css("--muted")}, "szürke sáv: Nyquist-sáv; vastag: összeg; szaggatott: másolatok (k = 0 színes); vonalkázott: átfedés");
  const r = 1 / T - 2 * b, reg = r > 1e-9 ? "nincs átfedés" : (Math.abs(r) <= 1e-9 ? "érintkezés" : "átfedés");
  $("status").textContent = "T = " + fmt(T, 2) + ", 1/T = " + fmt(1 / T, 4) + ", Nyquist-frekvencia 1/(2T) = " + fmt(ny, 4) + ", B = " + fmt(b, 2).replace(/,?0+$/, "") + ": " + reg +
    (Math.abs(T - 0.8) < 1e-9 && b === 1 ? " (összeg: ξ = 0-ban " + fmt(tot[300], 4) + ", ξ = 0,625-ben " + fmt(K.reduce((s, k) => s + fh(0.625 - k / T, b) / T, 0), 4) + ")" : "");
  // képlet: a Nyquist-sávba belógó k ≠ 0 tagok kiemelve
  const parts = [];
  for (let k = -3; k <= 3; k++) {
    const lo = k / T - b, hi = k / T + b, alias = k !== 0 && hi > -ny + 1e-9 && lo < ny - 1e-9;
    const term = "f̂(ξ " + (k === 0 ? "" : (k > 0 ? "− " : "+ ") + Math.abs(k) + "/T") + ")";
    parts.push('<span class="' + (alias ? "on" : (k === 0 ? "" : "z")) + '">' + term.replace("ξ )", "ξ)") + "</span>");
  }
  $("formula").innerHTML = "f̂ₛ(ξ) = (1/T)·[ … + " + parts.join(" + ") + " + … ]<br><span class=\"small\">Kiemelve: a k ≠ 0 tagok, amelyek belógnak a Nyquist-sávba (ezek okozzák az aliasingot).</span>";
}
$("T").addEventListener("input", draw); $("B").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
