<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogalomtérkép: bizonyítási függőségek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
#info{margin-top:6px;padding:6px 8px;background:var(--code,#f3f3f3);min-height:3.2em}#info a{color:var(--hl)}g.nd{cursor:pointer}g.nd:focus{outline:none}g.nd:focus rect{stroke-width:3}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Kiemelés">
  <button id="all">Mind mutat (kiemelés törlése)</button>
  <label><input type="checkbox" id="hide"> nem kapcsolódó csúcsok elrejtése</label>
  <span class="small">Kattints egy csúcsra (vagy Tab + Enter): ősök = mi kell hozzá, utódok = mire épül.</span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 610 500" role="img" aria-label="Balról jobbra rétegzett gráf a σ-algebráktól a disztribúciókig; a csúcsokra kattintva kiemelődnek az ősök és az utódok"></svg>
<div id="info" aria-live="polite"></div>
<p class="small">A 20.2.2 elágazáslistájának élei; A → B: B definíciója vagy bizonyítása lényegesen támaszkodik A-ra. A leírások a 20.2.3 tételgyűjteményt követik; a link a HTML-kiadás alfejezetére mutat.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);
const G = {"nodes": {"A": {"lab": "σ-algebra", "ref": "m014–015", "kind": "def", "x": 0, "y": 8, "link": "m014", "txt": "Halmazrendszer, amely tartalmazza az alaphalmazt, és zárt a komplementerre és a megszámlálható unióra."}, "B": {"lab": "félgyűrű", "ref": "m017", "kind": "def", "x": 0, "y": 5.5, "link": "m017", "txt": "A téglák/intervallumok rendszere: metszetre zárt, különbsége véges diszjunkt unió."}, "D": {"lab": "előmérték", "ref": "m023", "kind": "def", "x": 0, "y": 4.5, "link": "m023", "txt": "σ-additív halmazfüggvény a félgyűrűn (pl. az (a, b] intervallum hossza)."}, "E": {"lab": "külső\nmérték", "ref": "m024", "kind": "def", "x": 0, "y": 3.5, "link": "m024", "txt": "Monoton, σ-szubadditív halmazfüggvény a teljes hatványhalmazon, μ*(∅) = 0."}, "V": {"lab": "Vitali-\nhalmaz", "ref": "m030", "kind": "thm", "x": 0, "y": 1.5, "link": "m030", "txt": "A teljes P(ℝ)-en nincs eltolásinvariáns, σ-additív mérték, amely [0, 1]-hez 1-et rendel – ezért kell σ-algebra."}, "C": {"lab": "mérték", "ref": "m018", "kind": "def", "x": 1, "y": 8, "link": "m018", "txt": "σ-additív, nemnegatív halmazfüggvény egy σ-algebrán, μ(∅) = 0."}, "F": {"lab": "Carathéo-\ndory-tétel", "ref": "m025", "kind": "thm", "x": 1, "y": 3.5, "link": "m025", "txt": "A μ*-mérhető halmazok σ-algebrát alkotnak, és rajtuk μ* teljes mérték."}, "G": {"lab": "kiterjesz-\ntési tétel", "ref": "m026", "kind": "thm", "x": 1, "y": 2.5, "link": "m026", "txt": "A félgyűrűn adott σ-additív előmérték kiterjed σ(𝓔)-ra; σ-véges esetben egyértelműen."}, "H": {"lab": "Lebesgue-\nmérték", "ref": "m027", "kind": "def", "x": 1, "y": 1.5, "link": "m027", "txt": "Az egyetlen Borel-mérték, amely minden (a, b] intervallumhoz b − a hosszt rendel."}, "I": {"lab": "mérhető\nfüggvény", "ref": "m031", "kind": "def", "x": 2, "y": 7.4, "link": "m031", "txt": "Függvény, amelynél a Borel-halmazok ősképei a σ-algebrába esnek."}, "J": {"lab": "egyszerű\nfüggvény", "ref": "m033", "kind": "def", "x": 2, "y": 6.2, "link": "m033", "txt": "Véges sok értéket felvevő mérhető függvény; minden nemnegatív mérhető függvény ilyenek növő határértéke."}, "K": {"lab": "integrál\n(f ≥ 0)", "ref": "m034", "kind": "def", "x": 2, "y": 5.0, "link": "m034", "txt": "∫f dμ = sup{∫s dμ : 0 ≤ s ≤ f egyszerű}."}, "L": {"lab": "MCT", "ref": "m035", "kind": "thm", "x": 3, "y": 7.0, "link": "m035", "txt": "Ha 0 ≤ f₁ ≤ f₂ ≤ … mérhetők és fₙ ↑ f, akkor ∫fₙ dμ ↑ ∫f dμ."}, "M": {"lab": "Fatou-\nlemma", "ref": "m036", "kind": "thm", "x": 3, "y": 6.0, "link": "m036", "txt": "Ha fₙ ≥ 0 mérhetők, akkor ∫ liminf fₙ dμ ≤ liminf ∫fₙ dμ."}, "Nd": {"lab": "DCT", "ref": "m038", "kind": "thm", "x": 3, "y": 5.0, "link": "m038", "txt": "Ha fₙ → f m.m., f mérhető és |fₙ| ≤ g ∈ L¹, akkor ∫|fₙ − f| dμ → 0."}, "S": {"lab": "valószín.\nmérték", "ref": "m056", "kind": "def", "x": 4, "y": 8, "link": "m056", "txt": "Mérték, amelyre μ(Ω) = 1; eloszlások, várható érték."}, "Q": {"lab": "Lᵖ-terek", "ref": "m047–049", "kind": "def", "x": 4, "y": 3.0, "link": "m047", "txt": "Az ∫|f|ᵖ < ∞ függvények osztályai; Riesz–Fischer: Lᵖ teljes (1 ≤ p ≤ ∞)."}, "R": {"lab": "L²\nHilbert-tér", "ref": "m052", "kind": "def", "x": 4, "y": 2.0, "link": "m052", "txt": "L² skaláris szorzattal teljes, azaz Hilbert-tér."}, "O": {"lab": "szorzat-\nmérték", "ref": "m044", "kind": "def", "x": 4, "y": 0.2, "link": "m044", "txt": "A téglák μ(A)ν(B) mértékének kiterjesztése a szorzat-σ-algebrára."}, "P": {"lab": "Tonelli–\nFubini", "ref": "m045", "kind": "thm", "x": 4, "y": -1.0, "link": "m045", "txt": "σ-véges mértékeknél f ≥ 0 mérhető (Tonelli) vagy f ∈ L¹ (Fubini) esetén az iterált integrálok egyenlők."}, "T": {"lab": "konvolúció", "ref": "m057–059", "kind": "def", "x": 5, "y": 3.0, "link": "m057", "txt": "‖f∗g‖₁ ≤ ‖f‖₁‖g‖₁; approximatív egységgel f∗φₙ → f az L¹-normában."}, "U": {"lab": "Fourier-\nsorok", "ref": "m060–061", "kind": "def", "x": 6, "y": 1.0, "link": "m060", "txt": "Periodikus függvények Fourier-együtthatói és sorai."}, "AB": {"lab": "disztri-\nbúciók", "ref": "m070", "kind": "def", "x": 5, "y": -0.2, "link": "m070", "txt": "Folytonos lineáris funkcionálok a próbafüggvényeken; T′(φ) = −T(φ′), H′ = δ."}, "Y": {"lab": "Schwartz-\ntér", "ref": "m067", "kind": "def", "x": 5, "y": -1.2, "link": "m067", "txt": "Gyorsan lecsengő sima függvények; sűrű L¹-ben és L²-ben, 𝓕 bijekció rajta."}, "W": {"lab": "Fourier\nL¹-en", "ref": "m062–066", "kind": "thm", "x": 6, "y": 3.0, "link": "m062", "txt": "f ∈ L¹: f̂ folytonos és 0-hoz tart (Riemann–Lebesgue); f, f̂ ∈ L¹ esetén inverzió."}, "AC": {"lab": "temperált\ndisztrib.", "ref": "m071", "kind": "def", "x": 6, "y": -0.2, "link": "m071", "txt": "A Schwartz-tér duálisa; ⟨T̂, φ⟩ = ⟨T, φ̂⟩, így δ̂ = 1."}, "AD": {"lab": "karakt.\nfüggvény", "ref": "m072", "kind": "def", "x": 7, "y": 6.0, "link": "m072", "txt": "φ_X(t) = E e^{itX}; egyértelműen meghatározza az eloszlást."}, "Z": {"lab": "Plancherel", "ref": "m068", "kind": "thm", "x": 7, "y": 2.0, "link": "m068", "txt": "𝓕 unitér operátorrá terjed ki L²-re: ‖f̂‖₂ = ‖f‖₂."}, "AA": {"lab": "határozat-\nlansági elv", "ref": "m069", "kind": "thm", "x": 7, "y": 1.0, "link": "m069", "txt": "f ∈ 𝒮, f ≠ 0: ‖xf‖₂‖ξf̂‖₂ ≥ ‖f‖₂²/(4π); egyenlőség Gauss-függvényre."}, "AE": {"lab": "Poisson-\nformula", "ref": "m073", "kind": "thm", "x": 7, "y": -0.2, "link": "m073", "txt": "f ∈ 𝒮: Σ f(n) = Σ f̂(n); a mintavételezett jel spektruma periodizálódik."}, "AF": {"lab": "DFT, FFT", "ref": "m074", "kind": "thm", "x": 7, "y": -1.2, "link": "m074", "txt": "Diszkrét Fourier-transzformáció; az FFT O(N log N) művelettel számolja."}}, "edges": [{"u": "A", "v": "C", "ls": "-", "pts": [[0.42, 8.0], [0.58, 8.0]]}, {"u": "A", "v": "I", "ls": "-", "pts": [[0.41, 7.55], [0.4543, 7.516], [0.4992, 7.484], [0.5447, 7.454], [0.5908, 7.426], [0.6375, 7.4], [0.6848, 7.376], [0.7327, 7.354], [0.7812, 7.334], [0.8303, 7.316], [0.88, 7.3], [0.9303, 7.286], [0.9812, 7.274], [1.0327, 7.264], [1.0848, 7.256], [1.1375, 7.25], [1.1908, 7.246], [1.2447, 7.244], [1.2992, 7.244], [1.3543, 7.246], [1.41, 7.25], [1.4663, 7.256], [1.5232, 7.264]]}, {"u": "B", "v": "D", "ls": "-", "pts": [[0.0, 5.08], [0.0, 4.92]]}, {"u": "D", "v": "E", "ls": "-", "pts": [[0.0, 4.08], [0.0, 3.92]]}, {"u": "E", "v": "F", "ls": "-", "pts": [[0.42, 3.5], [0.58, 3.5]]}, {"u": "F", "v": "G", "ls": "-", "pts": [[1.0, 3.08], [1.0, 2.92]]}, {"u": "G", "v": "H", "ls": "-", "pts": [[1.0, 2.08], [1.0, 1.92]]}, {"u": "H", "v": "V", "ls": "--", "pts": [[0.58, 1.5], [0.42, 1.5]]}, {"u": "C", "v": "K", "ls": "-", "pts": [[0.9281, 7.5594], [0.9205, 7.4735], [0.9151, 7.3884], [0.912, 7.304], [0.9111, 7.2204], [0.9125, 7.1375], [0.9161, 7.0554], [0.922, 6.974], [0.9301, 6.8934], [0.9405, 6.8135], [0.9531, 6.7344], [0.968, 6.656], [0.9851, 6.5784], [1.0045, 6.5015], [1.0261, 6.4254], [1.05, 6.35], [1.0761, 6.2754], [1.1045, 6.2015], [1.1351, 6.1284], [1.168, 6.056], [1.2031, 5.9844], [1.2405, 5.9135], [1.2801, 5.8434], [1.322, 5.774], [1.3661, 5.7054], [1.4125, 5.6375], [1.4611, 5.5704], [1.512, 5.504], [1.5651, 5.4384]]}, {"u": "I", "v": "J", "ls": "-", "pts": [[2.0, 6.98], [2.0, 6.62]]}, {"u": "J", "v": "K", "ls": "-", "pts": [[2.0, 5.78], [2.0, 5.42]]}, {"u": "K", "v": "L", "ls": "-", "pts": [[2.42, 5.2], [2.5, 5.2], [2.5, 7.0], [2.58, 7.0]]}, {"u": "K", "v": "M", "ls": "-", "pts": [[2.42, 5.2], [2.5, 5.2], [2.5, 6.0], [2.58, 6.0]]}, {"u": "K", "v": "Nd", "ls": "-", "pts": [[2.42, 5.0], [2.58, 5.0]]}, {"u": "K", "v": "O", "ls": "-", "pts": [[2.175, 4.58], [3.825, 0.62]]}, {"u": "O", "v": "P", "ls": "-", "pts": [[4.0, -0.22], [4.0, -0.58]]}, {"u": "K", "v": "Q", "ls": "-", "pts": [[2.42, 4.58], [3.58, 3.42]]}, {"u": "Q", "v": "R", "ls": "-", "pts": [[4.0, 2.58], [4.0, 2.42]]}, {"u": "Q", "v": "T", "ls": "-", "pts": [[4.42, 3.0], [4.58, 3.0]]}, {"u": "T", "v": "W", "ls": "-", "pts": [[5.42, 3.0], [5.58, 3.0]]}, {"u": "W", "v": "Z", "ls": "-", "pts": [[6.42, 2.58], [6.58, 2.42]]}, {"u": "R", "v": "Z", "ls": "-", "pts": [[4.42, 2.0], [6.58, 2.0]]}, {"u": "Z", "v": "AA", "ls": "-", "pts": [[7.0, 1.58], [7.0, 1.42]]}, {"u": "Y", "v": "AC", "ls": "-", "pts": [[5.42, -0.78], [5.58, -0.62]]}, {"u": "AB", "v": "AC", "ls": "-", "pts": [[5.42, -0.2], [5.58, -0.2]]}, {"u": "AC", "v": "AE", "ls": "-", "pts": [[6.42, -0.2], [6.58, -0.2]]}, {"u": "U", "v": "AE", "ls": "-", "pts": [[6.35, 0.58], [6.65, 0.22]]}, {"u": "AE", "v": "AF", "ls": "-", "pts": [[7.0, -0.62], [7.0, -0.78]]}, {"u": "S", "v": "AD", "ls": "-", "pts": [[4.42, 7.72], [6.58, 6.28]]}, {"u": "W", "v": "AD", "ls": "-", "pts": [[6.14, 3.42], [6.86, 5.58]]}], "parts": [["II. rész", -0.5, 1.5], ["III. rész", 1.5, 3.5], ["IV. rész", 3.5, 4.5], ["V. rész", 4.5, 7.5]], "bw": 0.84, "bh": 0.84};

const SX = 70, SY = 44, X0 = 40, Y0 = 400;
const px = x => X0 + x * SX, py = y => Y0 - y * SY;
let sel = null;
function rel(id){
  const up = new Set(), dn = new Set();
  const walk = (k, dir, acc) => G.edges.forEach(e => { const a = dir ? e.v : e.u, b = dir ? e.u : e.v; if (a === k && !acc.has(b)) { acc.add(b); walk(b, dir, acc); } });
  walk(id, true, up); walk(id, false, dn);
  return {up, dn};
}
function draw(){
  svg.innerHTML = "";
  const R = sel ? rel(sel) : null, hide = $("hide").checked;
  const role = k => !R ? "n" : (k === sel ? "s" : (R.up.has(k) ? "u" : (R.dn.has(k) ? "d" : "o")));
  G.parts.forEach((p, i) => { el("rect", {x: px(p[1]), y: 6, width: (p[2] - p[1]) * SX, height: Y0 + 1.75 * SY - 6, fill: i % 2 ? "none" : css("--fill"), "fill-opacity": 0.6});
    el("text", {x: px((p[1] + p[2]) / 2), y: 22, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: css("--muted")}, p[0]); });
  G.edges.forEach(e => {
    const ru = role(e.u), rv = role(e.v);
    let c = css("--muted"), w = 1.1, op = 1;
    if (R) { if ((ru === "u" || ru === "s") && (rv === "u" || rv === "s")) { c = css("--hl"); w = 2.4; }
      else if ((ru === "d" || ru === "s") && (rv === "d" || rv === "s")) { c = css("--hl2"); w = 2.4; }
      else { op = hide ? 0 : 0.18; } }
    const P = e.pts.map(p => [px(p[0]), py(p[1])]);
    el("polyline", {points: P.map(p => p.join(",")).join(" "), fill: "none", stroke: c, "stroke-width": w, "stroke-dasharray": e.ls === "--" ? "5 4" : "none", "stroke-opacity": op});
    const [a, b] = [P[P.length - 2], P[P.length - 1]], an = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 7;
    el("polygon", {points: [b, [b[0] - h * Math.cos(an - 0.4), b[1] - h * Math.sin(an - 0.4)], [b[0] - h * Math.cos(an + 0.4), b[1] - h * Math.sin(an + 0.4)]].map(p => p.join(",")).join(" "), fill: c, "fill-opacity": op});
  });
  Object.entries(G.nodes).forEach(([k, n]) => {
    const r = role(k);
    if (R && hide && r === "o") return;
    const g = el("g", {class: "nd", tabindex: 0, role: "button", "aria-label": n.lab.replace("\n", " ") + " (" + n.ref + ")"});
    const fill = r === "s" ? css("--cellhl") : (n.kind === "thm" ? css("--fill") : css("--cell"));
    const st = r === "u" ? css("--hl") : (r === "d" ? css("--hl2") : css("--line"));
    el("rect", {x: px(n.x) - G.bw * SX / 2, y: py(n.y) - G.bh * SY / 2, width: G.bw * SX, height: G.bh * SY, rx: n.kind === "thm" ? 9 : 0,
      fill, stroke: st, "stroke-width": r === "n" || r === "o" ? 1.1 : 2.6, "stroke-dasharray": k === "V" ? "5 3" : "none", opacity: r === "o" ? 0.35 : 1}, undefined, g);
    const L = n.lab.split("\n");
    L.forEach((t, i) => el("text", {x: px(n.x), y: py(n.y) - 3 + (i - (L.length - 1) / 2) * 12 - (L.length > 1 ? 0 : 2), "text-anchor": "middle", "font-size": 10.5, opacity: r === "o" ? 0.4 : 1}, t, g));
    el("text", {x: px(n.x), y: py(n.y) + G.bh * SY / 2 - 3, "text-anchor": "middle", "font-size": 9, fill: css("--muted"), opacity: r === "o" ? 0.4 : 1}, n.ref, g);
    const pick = () => { sel = sel === k ? null : k; draw(); info(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
  });
  el("text", {x: 8, y: Y0 + 1.75 * SY + 16, "font-size": 11, fill: css("--muted")}, "szögletes: definíció; lekerekített: tétel; szaggatott: oldalág; kék: ősök, narancs: utódok");
}
function names(S){ return [...S].map(k => G.nodes[k].lab.replace("\n", " ").replace("- ", "-") + " (" + G.nodes[k].ref + ")").join(", ") || "–"; }
function info(){
  if (!sel) { $("info").innerHTML = "Nincs kiválasztott csúcs: a teljes gráf látszik."; $("status").textContent = "A teljes gráf, kiemelés nélkül (" + Object.keys(G.nodes).length + " csúcs, " + G.edges.length + " él)."; return; }
  const n = G.nodes[sel], R = rel(sel), nm = n.lab.replace("\n", " ").replace("- ", "-");
  $("info").innerHTML = "<b>" + nm + "</b> (" + n.ref + "): " + n.txt.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
    ' <a href="../../' + n.link + '.html" target="_top">→ az alfejezet</a>';
  $("status").textContent = nm + " – ősök: " + names(R.up) + ". Utódok: " + names(R.dn) + ".";
}
$("all").onclick = () => { sel = null; draw(); info(); };
$("hide").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw(); info();

</script>
