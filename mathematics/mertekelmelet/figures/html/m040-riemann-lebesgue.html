<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riemann- és Lebesgue-féle alsó közelítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Felosztás">
  <label for="n">n =</label><input id="n" type="range" min="2" max="32" step="1" value="4" aria-label="A felosztás finomsága n"><b id="nv"></b>
  <label for="k">kiemelt szint k =</label><input id="k" type="number" min="1" max="32" step="1" value="2" aria-label="A kiemelt Lebesgue-szint indexe">
  <span class="small">(a jobb panelen egy rétegre kattintva is)</span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 305" role="img" aria-label="Bal oldalon függőleges téglalapok a parabola alatt, jobb oldalon vízszintes rétegek; a kiemelt szint ősképe az x-tengelyen"></svg>
<p class="small">f(x) = x² a [0, 1]-en. Riemann: Σ (k/n)²·(1/n); Lebesgue: Σ_{k=1..n} (1/n)·λ({x² ≥ k/n}), ahol λ({x² ≥ t}) = 1 − √t. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const W = 250, H = 250, T = 30, B = T + H, P = [[40, 0], [320, 0]];
const sx = (p, x) => P[p][0] + x * W, sy = y => B - y * H;
function axes(p, title){ const fg = css("--fg"), mu = css("--muted");
  el("line", {x1: sx(p, 0), x2: sx(p, 1), y1: B, y2: B, stroke: fg}); el("line", {x1: sx(p, 0), x2: sx(p, 0), y1: T, y2: B, stroke: fg});
  [0, 0.5, 1].forEach(v => { el("text", {x: sx(p, v), y: B + 15, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, v % 1 ? 1 : 0));
    el("text", {x: sx(p, 0) - 5, y: sy(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, v % 1 ? 1 : 0)); });
  el("text", {x: sx(p, 0.5), y: T - 12, "font-size": 13, "text-anchor": "middle"}, title);
  const c = []; for (let i = 0; i <= 120; i++){ const x = i / 120; c.push(sx(p, x).toFixed(1) + "," + sy(x * x).toFixed(1)); }
  el("polyline", {points: c.join(" "), fill: "none", stroke: fg, "stroke-width": 2}); }
function draw(){
  const n = +$("n").value; $("nv").textContent = n; $("k").max = n; let K = Math.max(1, Math.min(n, +$("k").value)); $("k").value = K;
  svg.innerHTML = ""; const fg = css("--fg");
  let rs = 0, ls = 0;
  for (let k = 0; k < n; k++){ const h = Math.pow(k / n, 2); rs += h / n;
    el("rect", {x: sx(0, k / n), y: sy(h), width: W / n, height: h * H, fill: css("--fill"), stroke: fg, "stroke-width": 0.7}); }
  for (let k = 1; k <= n; k++){ const t0 = (k - 1) / n, t1 = k / n, x0 = Math.sqrt(t1); ls += (1 - x0) / n;
    const r = el("rect", {x: sx(1, x0), y: sy(t1), width: Math.max(0, (1 - x0) * W), height: H / n, fill: k === K ? css("--cellhl") : css("--fill"), stroke: fg, "stroke-width": 0.7, style: "cursor:pointer"});
    const band = el("rect", {x: sx(1, 0), y: sy(t1), width: W, height: H / n, fill: "transparent", style: "cursor:pointer"});
    [r, band].forEach(e => e.addEventListener("click", () => { $("k").value = k; draw(); })); }
  const tk = K / n, a = Math.sqrt(tk);
  el("rect", {x: sx(1, 0), y: sy(tk), width: W, height: H / n, fill: css("--hl2"), opacity: 0.15});
  el("line", {x1: sx(1, a), x2: sx(1, a), y1: B, y2: sy(tk), stroke: fg, "stroke-dasharray": "5 4"});
  el("line", {x1: sx(1, a), x2: sx(1, 1), y1: B, y2: B, stroke: css("--hl2"), "stroke-width": 7});
  axes(0, "Riemann: függőleges sávok"); axes(1, "Lebesgue: vízszintes rétegek");
  el("text", {x: sx(1, 0) + 6, y: T + 14, "font-size": 11}, "{f ≥ t_k} = [" + fmt(a, 4) + "; 1], hossza " + fmt(1 - a, 4));
  $("status").textContent = "n = " + n + " | Riemann: " + fmt(rs, 4) + ", Lebesgue: " + fmt(ls, 4) + ", pontos: 0,3333 | kiemelt szint t_" + K + " = " + fmt(tk, 4) + ": {x² ≥ t_k} = [√t_k; 1] = [" + fmt(a, 4) + "; 1]";
}
$("n").addEventListener("input", draw); $("k").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
