<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szelőből érintő: f(x) = x²</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="h értéke">
  <label for="h">h =</label><input id="h" type="range" min="-1" max="1" step="0.05" value="1" aria-label="h, a 0 kivételével"><b id="hv"></b>
  <button id="play">▶ Lejátszás (h → 0 felváltva)</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="Az x négyzet parabolája, a P = (1; 1) pont, a h csúszkával mozgatott Q pont, a PQ szelő és az érintő"></svg>
<p class="small">A szelő meredeksége (f(1 + h) − f(1))/h = 2 + h; h = 0-ra a hányados nem értelmezett, ezért a csúszka átugorja. A lejátszás h = ±1, ±0,75, ±0,5, ±0,25, ±0,1, ±0,05 értékeken megy végig, felváltva a két oldalról, majd megáll. Számított értékek a definícióból.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const SEQH = [1, -1, 0.75, -0.75, 0.5, -0.5, 0.25, -0.25, 0.1, -0.1, 0.05, -0.05];
let H = 1, timer = null, lastSign = 1;
const nh = v => { let t = (+v.toFixed(4)).toString(); return t.replace(".", ",").replace("-", "−"); };
function draw(){
  $("hv").textContent = nh(H);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const L = 40, R = 550, T = 10, B = 330, X = x => L + (R - L) * (x + 0.5) / 3, Y = y => B - (B - T) * (y + 1.2) / 6.4;
  el("line", {x1: L, y1: Y(0), x2: R, y2: Y(0), stroke: mu}); el("line", {x1: X(0), y1: T, x2: X(0), y2: B, stroke: mu});
  [-0.5, 0.5, 1, 1.5, 2, 2.5].forEach(t => el("text", {x: X(t), y: Y(0) + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, nh(t)));
  [1, 2, 3, 4, 5].forEach(t => el("text", {x: X(0) - 5, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, String(t)));
  const curve = (g, at) => { const pts = []; for (let i = 0; i <= 240; i++) { const x = -0.5 + 3 * i / 240, y = g(x); if (y > -1.3 && y < 5.4) pts.push(X(x).toFixed(1) + "," + Y(y).toFixed(1)); } el("polyline", Object.assign({points: pts.join(" "), fill: "none"}, at)); };
  curve(x => x * x, {stroke: fg, "stroke-width": 2.4});
  curve(x => 1 + 2 * (x - 1), {stroke: fg, "stroke-width": 2.6, "stroke-dasharray": "2 4"});
  const m = ((1 + H) * (1 + H) - 1) / H;
  curve(x => 1 + m * (x - 1), {stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "8 5"});
  el("circle", {cx: X(1), cy: Y(1), r: 5.5, fill: fg});
  el("text", {x: X(1) - 8, y: Y(1) - 10, "text-anchor": "end", "font-size": 12}, "P = (1; 1)");
  el("circle", {cx: X(1 + H), cy: Y((1 + H) * (1 + H)), r: 6, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.2});
  el("text", {x: X(1 + H) + 9, y: Y((1 + H) * (1 + H)) + 16, "font-size": 12, fill: css("--hl2")}, "Q");
  el("text", {x: R - 4, y: B - 8, "text-anchor": "end", "font-size": 12}, "— f(x) = x²   ··· érintő, meredekség 2   – – szelő, meredekség 2 + h");
  $("status").textContent = "h = " + nh(H) + ": a szelő meredeksége (f(1+h)−f(1))/h = " + nh(m) + "   (érintő: y = 1 + 2(x − 1), meredekség 2)";
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás (h → 0 felváltva)"; }
$("h").addEventListener("input", () => { stopPlay(); let v = Math.round(+$("h").value * 20) / 20; if (v === 0) v = lastSign * 0.05; else lastSign = Math.sign(v); H = v; $("h").value = v; draw(); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  let i = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { H = SEQH[i]; $("h").value = H; draw(); i++; if (i >= SEQH.length) stopPlay(); }, 900);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
