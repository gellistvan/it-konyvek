<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b vetítése az oszloptérre</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="x1">x₁ =</label><input id="x1" type="range" min="-1" max="3" step="0.05" value="2" aria-label="x1">
<b id="x1v"></b>
<label for="x2">x₂ =</label><input id="x2" type="range" min="-1" max="3" step="0.05" value="1" aria-label="x2">
<b id="x2v"></b>
<button id="bmin">ugrás a minimumra</button><button id="b0">x = (2, 1)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 410" role="img" aria-label="Térbeli ábra: a C(A) sík az a1, a2 vektorokkal, a síkon kívüli b, merőleges vetülete p a síkban, a merőleges r, és egy tetszőleges Ax pont; b, p és Ax derékszögű háromszöget alkot." style=""></svg>

</div>
<p class="small">A = [[0, 1], [1, 1], [2, 1]], b = (1, 3, 2); a legkisebb négyzetes megoldás x̂ = (0,5; 1,5), p̂ = Ax̂ = (1,5; 2; 2,5), r = b − p̂ = (−0,5; 1; −0,5), ‖r‖² = 1,5. Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const V3 = {M: [[-0.18257418583505514, 0.3651483716701109, 0.9128709291752769], [0.49006981819917006, 0.8387127262630063, -0.23747112686536875], [-0.8523486610283959, 0.4040143926534576, -0.3320754892670621]], scale: 46.54, cx: 81.2, cy: 263.0};
function proj(p){
  const M = V3.M;
  return [V3.cx + V3.scale * (M[0][0] * p[0] + M[0][1] * p[1] + M[0][2] * p[2]),
          V3.cy - V3.scale * (M[1][0] * p[0] + M[1][1] * p[1] + M[1][2] * p[2])];
}
function rotView(ax, ay){
  // ax: forgatás a képernyő y tengelye körül (vízszintes húzás), ay: a képernyő x tengelye körül
  const M = V3.M, c = Math.cos(ax), s = Math.sin(ax), c2 = Math.cos(ay), s2 = Math.sin(ay);
  let r0 = M[0].map((t, i) => c * t - s * M[2][i]), r2 = M[2].map((t, i) => s * M[0][i] + c * t);
  let r1 = M[1].map((t, i) => c2 * t + s2 * r2[i]); r2 = r2.map((t, i) => -s2 * M[1][i] + c2 * t);
  V3.M = [r0, r1, r2];
}
function attachRotate(target, redraw){
  let drag = null;
  target.setAttribute("tabindex", "0");
  target.style.touchAction = "none";
  target.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; target.setPointerCapture(e.pointerId); });
  target.addEventListener("pointermove", e => {
    if (!drag) return;
    rotView((e.clientX - drag[0]) * 0.01, (e.clientY - drag[1]) * 0.01);
    drag = [e.clientX, e.clientY]; redraw();
  });
  target.addEventListener("pointerup", () => { drag = null; });
  target.addEventListener("keydown", e => {
    const m = {ArrowLeft: [-0.08, 0], ArrowRight: [0.08, 0], ArrowUp: [0, -0.08], ArrowDown: [0, 0.08]}[e.key];
    if (!m) return;
    e.preventDefault(); e.stopPropagation(); rotView(m[0], m[1]); redraw();
  });
}

const svg = document.getElementById("v");
const A1 = [0, 1, 2], A2 = [1, 1, 1], Bv = [1, 3, 2], Pv = [1.5, 2, 2.5], R = [-0.5, 1, -0.5];
const add = (u, v) => u.map((t, i) => t + v[i]), sc = (s, u) => u.map(t => s * t), sub = (u, v) => u.map((t, i) => t - v[i]);
const dot = (u, v) => u.reduce((s, t, i) => s + t * v[i], 0);
function line3(a, b, col, w, dash, head){ const p = proj(a), q = proj(b);
  if (head) arrow2(svg, p[0], p[1], q[0], q[1], col, w, dash); else mk(svg, "line", {x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""}); }
function lab3(v, t, dx, dy, col){ const p = proj(v); mk(svg, "text", {x: p[0] + dx, y: p[1] + dy, "font-size": 13, fill: col || cssv("--fg")}, t); }
function draw(){
  const x1 = +document.getElementById("x1").value, x2 = +document.getElementById("x2").value;
  document.getElementById("x1v").textContent = huf(x1, 2); document.getElementById("x2v").textContent = huf(x2, 2);
  const Ax = add(sc(x1, A1), sc(x2, A2)), h = sub(Bv, Ax), d = sub(Pv, Ax);
  const H = dot(h, h), D = dot(d, d), Rr = dot(R, R);
  svg.innerHTML = "";
  const C = [add(sc(-0.4, A1), sc(-0.4, A2)), add(sc(2.6, A1), sc(-0.4, A2)), add(sc(2.6, A1), sc(2.3, A2)), add(sc(-0.4, A1), sc(2.3, A2))].map(proj);
  mk(svg, "polygon", {points: C.map(t => t[0].toFixed(1) + "," + t[1].toFixed(1)).join(" "), fill: cssv("--fill"), stroke: cssv("--muted"), opacity: 0.8});
  lab3(add(sc(2.4, A1), sc(2.2, A2)), "C(A)", -40, 14, cssv("--muted"));
  const O = [0, 0, 0], fg = cssv("--fg"), hl = cssv("--hl"), hl2 = cssv("--hl2"), mu = cssv("--muted");
  line3(O, A1, mu, 1.4, "", true); lab3(A1, "a₁", 6, 4, mu);
  line3(O, A2, mu, 1.4, "", true); lab3(A2, "a₂", 6, 12, mu);
  line3(O, Bv, fg, 3, "", true); lab3(Bv, "b", 8, -6);
  line3(O, Pv, hl, 2.2, "", true); lab3(Pv, "p̂", 10, 14, hl);
  line3(O, Ax, fg, 1.8, "2 4", true); lab3(Ax, "Ax", 8, -6);
  line3(Pv, Bv, hl2, 2, "6 4", false);
  line3(Ax, Bv, fg, 1.2, "", false);
  line3(Ax, Pv, hl, 1.4, "6 4", false);
  // derékszögjel
  const nd = Math.sqrt(D);
  if (nd > 0.05) { const ur = sc(1 / Math.sqrt(Rr), R), ud = sc(1 / nd, sub(Ax, Pv)), e = 0.25;
    const pts = [add(Pv, sc(e, ur)), add(add(Pv, sc(e, ur)), sc(e, ud)), add(Pv, sc(e, ud))].map(proj);
    mk(svg, "polyline", {points: pts.map(t => t[0].toFixed(1) + "," + t[1].toFixed(1)).join(" "), fill: "none", stroke: fg}); }
  const mid = (u, v) => sc(0.5, add(u, v));
  lab3(mid(Pv, Bv), "r", 8, 0, hl2);
  mk(svg, "text", {x: 10, y: 400, "font-size": 11, fill: mu}, "Forgatás: egérhúzás vagy (az ábrára kattintva) a nyílbillentyűk.");
  document.getElementById("status").textContent = `x = (${hu(x1)}; ${hu(x2)}), Ax = (${Ax.map(t => hu(t)).join("; ")}): ‖b − Ax‖² = ${hu(H)} = ‖r‖² + ‖p̂ − Ax‖² = ${hu(Rr)} + ${hu(D)}` + (D < 1e-9 ? " – ez a minimum, Ax = p̂." : "");
}
function setX(a, b){ document.getElementById("x1").value = a; document.getElementById("x2").value = b; draw(); }
["x1", "x2"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("bmin").onclick = () => setX(0.5, 1.5);
document.getElementById("b0").onclick = () => setX(2, 1);
attachRotate(svg, draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
