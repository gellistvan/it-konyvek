<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>det(A − λI) mint λ függvénye</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="l">λ =</label><input id="l" type="range" min="-0.5" max="4.5" step="0.05" value="0" aria-label="λ értéke">
<b id="lv"></b><button id="play">▶ Lejátszás</button>
<span role="group" aria-label="Mátrix"><button id="mA" aria-pressed="true">A = [[2, 1], [1, 2]]</button><button id="mB" aria-pressed="false">B = [[4, 1], [2, 3]]</button></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 345" role="img" aria-label="Bal oldalt az egységnégyzet képe A − λI alatt; jobb oldalt a karakterisztikus polinom grafikonja; a sajátértékeknél a kép szakasszá lapul és a polinom nullát vesz fel." style=""></svg>

</div>
<p class="small">Sraffozott: pozitív, pontmintás: negatív előjeles terület (tükrözött orientáció); vastag szakasz: a kép elfajult (det = 0); szaggatott narancs: a nullába menő irány; üres kör: a polinom zérushelyei (A: 1 és 3, B: 2 és 5). Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v");
const MATS = {A: [[2, 1], [1, 2]], B: [[4, 1], [2, 3]]};
let mn = "A", timer = null;
function det(M, l){ return (M[0][0] - l) * (M[1][1] - l) - M[0][1] * M[1][0]; }
function draw(){
  const l = +document.getElementById("l").value, M = MATS[mn], N = [[M[0][0] - l, M[0][1]], [M[1][0], M[1][1] - l]], d = det(M, l);
  document.getElementById("lv").textContent = huf(l, 2);
  svg.innerHTML = "";
  // bal panel: síkbeli kép, [-2.5; 5] × [-2.5; 5]
  const S = 36, ox = 110, oy = 230, P = (x, y) => [ox + S * x, oy - S * y];
  for (let g = -2; g <= 5; g++) { mk(svg, "line", {x1: P(g, -2.5)[0], y1: P(g, -2.5)[1], x2: P(g, 5)[0], y2: P(g, 5)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); mk(svg, "line", {x1: P(-2.5, g)[0], y1: P(-2.5, g)[1], x2: P(5, g)[0], y2: P(5, g)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); }
  const sq = [[0,0],[1,0],[1,1],[0,1]].map(q => P(q[0], q[1]));
  mk(svg, "polygon", {points: sq.map(q => q.join(",")).join(" "), fill: "none", stroke: cssv("--muted"), "stroke-dasharray": "2 3"});
  const defs = mk(svg, "defs", {}), pa = mk(defs, "pattern", {id: "hp", width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  mk(pa, "line", {x1: 0, y1: 0, x2: 0, y2: 7, stroke: cssv("--fg"), "stroke-width": 1});
  const pb = mk(defs, "pattern", {id: "hn", width: 6, height: 6, patternUnits: "userSpaceOnUse"}); mk(pb, "circle", {cx: 3, cy: 3, r: 1.1, fill: cssv("--fg")});
  const im = [[0,0],[N[0][0],N[1][0]],[N[0][0]+N[0][1],N[1][0]+N[1][1]],[N[0][1],N[1][1]]].map(q => P(q[0], q[1]));
  const zero = Math.abs(d) < 0.03;
  mk(svg, "polygon", {points: im.map(q => q.map(t => t.toFixed(1)).join(",")).join(" "), fill: zero ? "none" : (d > 0 ? "url(#hp)" : "url(#hn)"), stroke: cssv("--fg"), "stroke-width": zero ? 4 : 1.5});
  arrow2(svg, P(0,0)[0], P(0,0)[1], P(N[0][0], N[1][0])[0], P(N[0][0], N[1][0])[1], cssv("--hl"), 2, "");
  arrow2(svg, P(0,0)[0], P(0,0)[1], P(N[0][1], N[1][1])[0], P(N[0][1], N[1][1])[1], cssv("--hl"), 2, "");
  // nullirány a sajátértéknél
  let st = `λ = ${huf(l, 2)}: det(${mn} − λI) = ${huf(d, 2)}`;
  if (zero) {
    let v = [N[0][1], -N[0][0]]; if (Math.hypot(v[0], v[1]) < 1e-9) v = [N[1][1], -N[1][0]];
    const n = Math.hypot(v[0], v[1]); v = [v[0] / n, v[1] / n]; if (v[0] < 0 || (v[0] === 0 && v[1] < 0)) v = [-v[0], -v[1]];
    arrow2(svg, P(0,0)[0], P(0,0)[1], P(v[0], v[1])[0], P(v[0], v[1])[1], cssv("--hl2"), 2.5, "5 3");
    const k = Math.abs(v[0]) > 1e-9 ? 1 / Math.abs(v[0]) : 1 / Math.abs(v[1]), r = [v[0] * k, v[1] * k];
    st += ` → λ sajátérték; nulltér iránya (${hu(r[0], 2)}, ${hu(r[1], 2)})`;
  } else st += d > 0 ? " (a kép területe)" : " (negatív: tükrözött orientáció, |det| a terület)";
  mk(svg, "text", {x: 10, y: 20, "font-size": 12}, "az egységnégyzet képe " + mn + " − λI alatt");
  // jobb panel: p(λ)
  const L0 = 340, R0 = 550, T0 = 30, B0 = 330, lo = -2.5, hi = mn === "A" ? 6 : 12;
  const X = t => L0 + (t + 0.5) / 5.5 * (R0 - L0), Y = y => B0 - (y - lo) / (hi - lo) * (B0 - T0);
  [1, 2, 3, 4, 5].forEach(t => mk(svg, "text", {x: X(t), y: Y(0) + 14, "text-anchor": "middle", "font-size": 10, fill: cssv("--muted")}, hu(t)));
  mk(svg, "line", {x1: L0, y1: Y(0), x2: R0, y2: Y(0), stroke: cssv("--muted")});
  mk(svg, "line", {x1: X(0), y1: T0, x2: X(0), y2: B0, stroke: cssv("--muted")});
  let pd = ""; for (let k = 0; k <= 200; k++) { const t = -0.5 + 5.5 * k / 200; pd += (k ? "L" : "M") + X(t).toFixed(1) + "," + Y(Math.max(lo, Math.min(hi, det(M, t)))).toFixed(1); }
  mk(svg, "path", {d: pd, fill: "none", stroke: cssv("--fg"), "stroke-width": 2});
  const tr = M[0][0] + M[1][1], dt = M[0][0] * M[1][1] - M[0][1] * M[1][0], s = Math.sqrt(tr * tr / 4 - dt);
  [tr / 2 - s, tr / 2 + s].forEach(z => mk(svg, "circle", {cx: X(z), cy: Y(0), r: 5, fill: cssv("--bg"), stroke: cssv("--fg"), "stroke-width": 1.5}));
  mk(svg, "line", {x1: X(l), y1: T0, x2: X(l), y2: B0, stroke: cssv("--hl"), "stroke-width": 1.5});
  mk(svg, "circle", {cx: X(l), cy: Y(Math.max(lo, Math.min(hi, d))), r: 4.5, fill: cssv("--hl")});
  mk(svg, "text", {x: L0, y: 20, "font-size": 12}, mn === "A" ? "p_A(λ) = λ² − 4λ + 3" : "p_B(λ) = λ² − 7λ + 10");
  mk(svg, "text", {x: R0, y: Y(0) - 6, "text-anchor": "end", "font-size": 12}, "λ");
  document.getElementById("status").textContent = st;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  const s = document.getElementById("l"); if (+s.value >= 4.5) s.value = -0.5;
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const t = Math.round((+s.value + 0.05) * 100) / 100; s.value = t; draw(); if (t >= 4.5) stop(); }, 80);
};
function setM(n){ mn = n; document.getElementById("mA").setAttribute("aria-pressed", n === "A"); document.getElementById("mB").setAttribute("aria-pressed", n === "B"); draw(); }
document.getElementById("mA").onclick = () => setM("A");
document.getElementById("mB").onclick = () => setM("B");
document.getElementById("l").addEventListener("input", () => { stop(); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
