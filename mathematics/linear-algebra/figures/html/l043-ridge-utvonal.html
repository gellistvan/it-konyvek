<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridge-útvonal a súlysíkon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="s">λ =</label><input id="s" type="range" min="0" max="700" step="1" value="0" aria-label="λ (logaritmikus skála, 0 és 10⁻⁵…100)">
<b id="lv"></b>
<button id="p1" aria-pressed="true">1. példa</button><button id="p2" aria-pressed="false">közel párhuzamos példa</button>
<button id="l1">λ = 1</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Ellipszis alakú szintvonalak a legkisebb négyzetes megoldás körül, körök az origó körül; a ridge-megoldás görbéje a legkisebb négyzetes ponttól az origó felé tart." style=""></svg>

</div>
<p class="small">w(λ) = (XᵀX + λI)⁻¹Xᵀy, a büntetés λ‖w‖² (a fejezet konvenciója). A csúszka logaritmikus: 0, majd 10⁻⁵…100. Szürke: az SSE szintvonalai és ‖w‖ = áll. körök; vastag fekete: a ridge-útvonal; kék/narancs: az aktuális λ szintvonala és köre. Számított értékek, nem mérés.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v");
const EX = [{X: [[1,0],[0,1],[1,1]], y: [1,2,4], win: [-0.6, 2.6, -0.6, 3.0], lev: [0.5,1,2,4,8,13], rad: [0.5,1,1.5,2.5], ticks: [0, 1, 2]},
            {X: [[1,1],[1,1.01],[1,1.02]], y: [1,2,3], win: [-112, 30, -20, 122], lev: [0.5, 1.6229, 2.2013], rad: [50,100,140], ticks: [-100, -50, 0, 50, 100].filter(t => t <= 30)}];
let cur = 0;
function gram(e){ let a = 0, b = 0, d = 0, u = 0, v = 0; e.X.forEach((r, i) => { a += r[0]*r[0]; b += r[0]*r[1]; d += r[1]*r[1]; u += r[0]*e.y[i]; v += r[1]*e.y[i]; }); return {a, b, d, u, v}; }
function ridge(e, l){ const g = gram(e), A = g.a + l, D = g.d + l, det = A * D - g.b * g.b; return [(D * g.u - g.b * g.v) / det, (A * g.v - g.b * g.u) / det]; }
function sse(e, w){ let s = 0; e.X.forEach((r, i) => { const q = r[0]*w[0] + r[1]*w[1] - e.y[i]; s += q*q; }); return s; }
function lam(){ const s = +document.getElementById("s").value; return s === 0 ? 0 : Math.pow(10, s / 100 - 5); }
const R = 520, T = 10, B = 390;
function draw(){
  const e = EX[cur], l = lam(), g = gram(e), c = ridge(e, 0), s0 = sse(e, c), w = ridge(e, l), sw = sse(e, w), nw = Math.hypot(w[0], w[1]);
  const [x0, x1, y0, y1] = e.win, sc = Math.min(480 / (x1 - x0), (B - T) / (y1 - y0));
  const L = (560 - (x1 - x0) * sc) / 2, X = v => L + (v - x0) * sc, Y = v => B - (v - y0) * sc;
  document.getElementById("lv").textContent = l === 0 ? "0" : (l < 0.01 ? l.toExponential(1).replace(".", ",") : huf(l, l < 1 ? 3 : 2));
  svg.innerHTML = "";
  const cp = mk(svg, "clipPath", {id: "cp"}); mk(cp, "rect", {x: L, y: T, width: (x1 - x0) * sc, height: (y1 - y0) * sc});
  const G = mk(svg, "g", {"clip-path": "url(#cp)"});
  mk(G, "rect", {x: L, y: T, width: (x1 - x0) * sc, height: (y1 - y0) * sc, fill: "none", stroke: cssv("--grid")});
  mk(G, "line", {x1: X(x0), y1: Y(0), x2: X(x1), y2: Y(0), stroke: cssv("--grid")});
  mk(G, "line", {x1: X(0), y1: Y(y0), x2: X(0), y2: Y(y1), stroke: cssv("--grid")});
  function ell(level, col, wd){ let d = ""; const n = 720;
    for (let k = 0; k <= n; k++) { const th = 2 * Math.PI * k / n, u = Math.cos(th), v = Math.sin(th), q = g.a*u*u + 2*g.b*u*v + g.d*v*v, rr = Math.sqrt(Math.max(level - s0, 0) / q);
      d += (k ? "L" : "M") + X(c[0] + rr * u).toFixed(1) + "," + Y(c[1] + rr * v).toFixed(1); }
    mk(G, "path", {d, fill: "none", stroke: col, "stroke-width": wd}); }
  function circ(r, col, wd, dash){ mk(G, "circle", {cx: X(0), cy: Y(0), r: r * sc, fill: "none", stroke: col, "stroke-width": wd, "stroke-dasharray": dash}); }
  e.lev.forEach(lv => ell(lv, cssv("--muted"), 0.8));
  e.rad.forEach(r => circ(r, cssv("--muted"), 0.8, "5 4"));
  let d = ""; for (let k = 0; k <= 400; k++) { const ll = k === 0 ? 0 : Math.pow(10, -6 + 9 * k / 400), p = ridge(e, ll); d += (k ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1); }
  mk(G, "path", {d, fill: "none", stroke: cssv("--fg"), "stroke-width": 2.6});
  if (sw - s0 > 1e-9) ell(sw, cssv("--hl"), 2);
  if (nw > 1e-9) circ(nw, cssv("--hl2"), 2, "7 4");
  mk(G, "circle", {cx: X(w[0]), cy: Y(w[1]), r: 6, fill: cssv("--fg")});
  mk(G, "path", {d: `M${X(c[0])-5},${Y(c[1])-5}L${X(c[0])+5},${Y(c[1])+5}M${X(c[0])-5},${Y(c[1])+5}L${X(c[0])+5},${Y(c[1])-5}`, stroke: cssv("--fg"), "stroke-width": 2});
  mk(svg, "text", {x: X(c[0]) + 8, y: Y(c[1]) - 8, "font-size": 12}, "w_LS");
  mk(svg, "text", {x: X(x1) + 4, y: Y(0) + 4, "font-size": 12}, "w₁");
  e.ticks.forEach(t => { mk(svg, "text", {x: X(t), y: Y(0) + 14, "text-anchor": "middle", "font-size": 10, fill: cssv("--muted")}, hu(t)); if (t !== 0) mk(svg, "text", {x: X(0) - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 10, fill: cssv("--muted")}, hu(t)); });
  mk(svg, "text", {x: X(0) + 6, y: T + 14, "font-size": 12}, "w₂");
  mk(svg, "text", {x: L + 4, y: B - 6, "font-size": 11, fill: cssv("--muted")}, cur === 0 ? "" : "a kanyon: a szintvonalak szinte egyenesek a (1, −1) irány mentén");
  document.getElementById("status").textContent = `λ = ${document.getElementById("lv").textContent}: w = (${huf(w[0], 4)}; ${huf(w[1], 4)}), ‖w‖ = ${huf(nw, 3)}, SSE = ‖Xw − y‖² = ${huf(sw, 4)}` + (l === 0 ? " (a legkisebb négyzetes megoldás)" : " – itt érinti a kék szintvonal a narancs kört");
}
function setP(i){ cur = i; document.getElementById("p1").setAttribute("aria-pressed", i === 0); document.getElementById("p2").setAttribute("aria-pressed", i === 1); draw(); }
document.getElementById("s").addEventListener("input", draw);
document.getElementById("p1").onclick = () => setP(0);
document.getElementById("p2").onclick = () => setP(1);
document.getElementById("l1").onclick = () => { document.getElementById("s").value = 500; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
