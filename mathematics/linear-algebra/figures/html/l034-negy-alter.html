<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A négy alapvető altér</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="A 2×3-as mátrix">A = [<span style="white-space:nowrap"><input id="m00" type="text" inputmode="decimal" value="1" aria-label="1. sor, 1. oszlop" style="width:3.2em"> <input id="m01" type="text" inputmode="decimal" value="2" aria-label="1. sor, 2. oszlop" style="width:3.2em"> <input id="m02" type="text" inputmode="decimal" value="3" aria-label="1. sor, 3. oszlop" style="width:3.2em"></span> ; <span style="white-space:nowrap"><input id="m10" type="text" inputmode="decimal" value="2" aria-label="2. sor, 1. oszlop" style="width:3.2em"> <input id="m11" type="text" inputmode="decimal" value="4" aria-label="2. sor, 2. oszlop" style="width:3.2em"> <input id="m12" type="text" inputmode="decimal" value="6" aria-label="2. sor, 3. oszlop" style="width:3.2em"></span>] <button id="ex">Könyv példája</button> <button id="full">rang 2 példa</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 315" role="img" aria-label="Két téglalap: a bal (ℝ³) a sortérre és a rá merőleges nulltérre, a jobb (ℝ²) az oszloptérre és a rá merőleges bal nulltérre bomlik; A a sorteret az oszloptérre, a nullteret a nullvektorra viszi."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Sematikus ábra; a téglalapok mérete nem arányos a dimenzióval. A bázisok a redukált lépcsős alakból (sortér: nemnulla sorok; nulltér és bal nulltér: speciális megoldások; oszloptér: a főoszlopok).</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


const EPS = 1e-9;
function rref(M){ M = M.map(r => r.slice()); const R = M.length, C = M[0].length, piv = []; let r = 0;
  for (let c = 0; c < C && r < R; c++) { let p = -1, best = EPS; for (let i = r; i < R; i++) if (Math.abs(M[i][c]) > best) { best = Math.abs(M[i][c]); p = i; }
    if (p < 0) continue; [M[r], M[p]] = [M[p], M[r]]; const pv = M[r][c]; M[r] = M[r].map(v => v / pv);
    for (let i = 0; i < R; i++) if (i !== r && Math.abs(M[i][c]) > EPS) { const f = M[i][c]; M[i] = M[i].map((v, j) => v - f * M[r][j]); }
    piv.push(c); r++; }
  return [M, piv]; }
function nullB(M){ const [R, piv] = rref(M), n = M[0].length, out = [];
  for (let f = 0; f < n; f++) { if (piv.includes(f)) continue; const v = new Array(n).fill(0); v[f] = 1; piv.forEach((pc, i) => v[pc] = -R[i][f]); out.push(v); } return out; }
function four(M){ const [R, piv] = rref(M), At = M[0].map((_, j) => M.map(r => r[j]));
  return {r: piv.length, row: R.slice(0, piv.length), null: nullB(M), col: piv.map(c => M.map(r => r[c])), left: nullB(At)}; }
const V = v => "(" + v.map(x => hu(x, 3)).join("; ") + ")";
const dotp = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
let sel = null, S = null, M = null;
const BOX = {row: {x: 10, y: 60, w: 190, h: 100, t: "sortér C(Aᵀ)", sp: "ℝ³", dim: s => `dim r = ${s.r}`, fill: "--fill1"},
             null: {x: 10, y: 176, w: 190, h: 130, t: "nulltér N(A)", sp: "ℝ³", dim: s => `dim n − r = ${3 - s.r}`, fill: "--fill2"},
             col: {x: 360, y: 60, w: 190, h: 100, t: "oszloptér C(A)", sp: "ℝ²", dim: s => `dim r = ${s.r}`, fill: "--fill1"},
             left: {x: 360, y: 176, w: 190, h: 100, t: "bal nulltér N(Aᵀ)", sp: "ℝ²", dim: s => `dim m − r = ${2 - s.r}`, fill: "--fill3"}};
function read(){ M = [0, 1].map(i => [0, 1, 2].map(j => { const v = parseFloat(String(document.getElementById(`m${i}${j}`).value).replace(",", ".").replace(/−/g, "-").trim()); return isFinite(v) ? v : 0; })); S = four(M); }
function draw(){
  svg.innerHTML = "";
  txt(105, 30, "ℝⁿ = ℝ³ (n = 3)", {bold: true, fs: 15}); txt(455, 30, "ℝᵐ = ℝ² (m = 2)", {bold: true, fs: 15});
  Object.entries(BOX).forEach(([k, b]) => {
    const on = sel === k, g = el("g", {tabindex: 0, role: "button", "aria-label": b.t + " – részletek", style: "cursor:pointer"});
    el("rect", {x: b.x, y: b.y, width: b.w, height: b.h, fill: css(b.fill), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.5}, undefined, g);
    txt(b.x + b.w / 2, b.y + 22, b.t, {bold: true, fs: 14, par: g}); txt(b.x + b.w / 2, b.y + 42, b.dim(S), {fs: 13, par: g});
    const bs = S[k]; const lines = bs.length ? bs.map(V) : ["{0} (csak a nullvektor)"];
    lines.forEach((l, i) => txt(b.x + b.w / 2, b.y + 64 + 18 * i, (i ? "" : "bázis: ") + l, {fs: 12, par: g}));
    const act = () => { sel = k; detail(); draw(); };
    g.addEventListener("click", act); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });
  // derékszögjelek a két rész találkozásánál
  [105, 455].forEach(x => txt(x, 174, "⊥", {fs: 17, bold: true}));
  el("circle", {cx: 360, cy: 168, r: 5, fill: css("--fg")}); txt(352, 160, "0", {fs: 14, bold: true, anchor: "end"});
  vec(204, 95, 356, 95, {w: 2.2}); txt(280, 72, "A", {fs: 14, bold: true}); if (S.r) txt(280, 87, "(kölcsönösen egyértelmű)", {fs: 11});
  vec(356, 125, 204, 125, {w: 1.4, dash: "6 4"}); txt(280, 142, "Aᵀ", {fs: 13});
  el("path", {d: "M204,245 Q300,240 352,174", fill: "none", stroke: css("--fg"), "stroke-width": 2}); vec(345, 184, 354, 171, {w: 2});
  txt(300, 262, "A → 0", {fs: 13});
  const ok = 3 - S.r + S.r === 3 && 2 - S.r + S.r === 2;
  document.getElementById("status").textContent = `rang r = ${S.r}; dimenziók: sortér ${S.r}, nulltér ${3 - S.r}, oszloptér ${S.r}, bal nulltér ${2 - S.r}` +
    ` – r + (n − r) = 3, r + (m − r) = 2.` + (sel ? "" : " Kattints egy altérre a részletekért.");
}
function detail(){
  if (!sel) { document.getElementById("info").textContent = ""; return; }
  const pair = {row: "null", null: "row", col: "left", left: "col"}[sel], a = S[sel], b = S[pair];
  let t = `${BOX[sel].t}: ` + (a.length ? "bázis " + a.map(V).join(", ") : "csak a nullvektor") + `. Merőleges kiegészítője: ${BOX[pair].t}.`;
  if (a.length && b.length) { t += "\nSkalárszorzatok: " + a.map((u, i) => b.map((v, j) => `${V(u)}·${V(v)} = ${hu(dotp(u, v), 6)}`).join("; ")).join("; ") + " – mind 0, tehát merőlegesek."; }
  if (sel === "null") t += "\nEllenőrzés: A·v = 0 minden bázisvektorra: " + a.map(v => V(M.map(r => dotp(r, v)))).join(", ") + ".";
  if (sel === "left") t += "\nEllenőrzés: Aᵀ·y = 0: " + a.map(y => V([0, 1, 2].map(j => M[0][j] * y[0] + M[1][j] * y[1]))).join(", ") + ".";
  document.getElementById("info").textContent = t;
}
function update(){ read(); detail(); draw(); }
for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) document.getElementById(`m${i}${j}`).addEventListener("input", update);
const setA = E => { for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) document.getElementById(`m${i}${j}`).value = String(E[i][j]).replace("-", "−"); update(); };
document.getElementById("ex").onclick = () => setA([[1, 2, 3], [2, 4, 6]]);
document.getElementById("full").onclick = () => setA([[1, 0, 1], [0, 1, 1]]);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
read(); draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
