<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koszinusz-hasonlóság mint vetület</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label><input id="raw" type="checkbox"> nyers Xq pontszám (normalizálás nélkül)</label>
<button id="reset">Alapállás: q = (1; 2)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 370 370" role="img" aria-label="Négy adatvektor és a lekérdezés; normalizált változataik az egységkörön, a q̂ egyenesére vett vetületek"></svg>
<table aria-label="Pontszámok és rangsor"><thead><tr><th>vektor</th><th id="sh">sᵢ</th><th>rang</th></tr></thead><tbody id="tb"></tbody></table>
</div>

<p class="small">A q végpontja húzható (vagy fókuszálva nyilakkal állítható). Normalizált módban sᵢ = x̂ᵢ·q̂ = cos(xᵢ, q), a talppont távolsága az origótól; nyers módban xᵢ·q, ahol a hosszú x₃ dominál. Kitöltött kör: top-2. Számított értékek a 23.4.4 példájából.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
const X = [[1, 0], [0, 1], [3, 4], [-1, 1]];
let q = [1, 2], drag = false;
const X0 = -1.5, X1 = 3.5, Y0 = -0.5, Y1 = 4.5, SC = 70, OX = 10 - X0 * SC, OY = 10 + Y1 * SC;
const P = v => [OX + v[0] * SC, OY - v[1] * SC];
const nrm = v => Math.hypot(v[0], v[1]);
function arrow(v, col, w, dash, from){
  const a = P(from || [0, 0]), b = P(v), L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  el("line", {x1: a[0], y1: a[1], x2: b[0] - 8 * ux, y2: b[1] - 8 * uy, stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  el("polygon", {points: `${b[0]},${b[1]} ${b[0] - 10 * ux - 4 * uy},${b[1] - 10 * uy + 4 * ux} ${b[0] - 10 * ux + 4 * uy},${b[1] - 10 * uy - 4 * ux}`, fill: col});
}
function draw(){
  const raw = E("raw").checked, nq = nrm(q) || 1e-12, qh = [q[0] / nq, q[1] / nq];
  const S = X.map(x => raw ? x[0] * q[0] + x[1] * q[1] : (x[0] * qh[0] + x[1] * qh[1]) / nrm(x));
  const order = [0, 1, 2, 3].sort((a, b) => S[b] - S[a]), rank = []; order.forEach((i, r) => rank[i] = r + 1);
  svg.innerHTML = "";
  for (let g = Math.ceil(X0); g <= X1; g++) el("line", {x1: P([g, Y0])[0], y1: P([g, Y0])[1], x2: P([g, Y1])[0], y2: P([g, Y1])[1], stroke: css("--grid")});
  for (let g = Math.ceil(Y0); g <= Y1; g++) el("line", {x1: P([X0, g])[0], y1: P([X0, g])[1], x2: P([X1, g])[0], y2: P([X1, g])[1], stroke: css("--grid")});
  el("circle", {cx: OX, cy: OY, r: SC, fill: "none", stroke: css("--muted")});
  const a = P([-0.6 * qh[0], -0.6 * qh[1]]), b = P([5 * qh[0], 5 * qh[1]]);
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--muted"), "stroke-width": 0.8});
  X.forEach((x, i) => {
    const xh = [x[0] / nrm(x), x[1] / nrm(x)], top = rank[i] <= 2;
    arrow(x, css("--muted"), 1.2, "5 4");
    if (!raw) { arrow(xh, css("--fg"), 2);
      const f = [S[i] * qh[0], S[i] * qh[1]], pf = P(f), px = P(xh);
      el("line", {x1: px[0], y1: px[1], x2: pf[0], y2: pf[1], stroke: css("--fg"), "stroke-dasharray": "2 3", "stroke-width": 1.3});
      el("rect", {x: pf[0] - 3, y: pf[1] - 3, width: 6, height: 6, fill: css("--fg")}); }
    const pt = P(raw ? x : xh);
    el("circle", {cx: pt[0], cy: pt[1], r: 6, fill: top ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.5});
    el("text", {x: P(x)[0] + 8, y: P(x)[1] - 6, "font-size": 13}, `x${"₁₂₃₄"[i]}`);
  });
  arrow(q, css("--hl"), 1.5, "6 4");
  if (!raw) arrow(qh, css("--hl"), 4);
  const pq = P(q);
  const h = el("circle", {cx: pq[0], cy: pq[1], r: 9, fill: css("--hl"), "fill-opacity": 0.35, stroke: css("--hl"), "stroke-width": 2, tabindex: 0, role: "slider", "aria-label": "q végpontja: húzható, nyilakkal állítható", style: "cursor:grab"});
  h.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); });
  h.addEventListener("keydown", e => { const d = {ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1]}[e.key];
    if (d) { e.preventDefault(); q = [Math.round((q[0] + d[0]) * 10) / 10, Math.round((q[1] + d[1]) * 10) / 10]; draw(); svg.querySelector("[role=slider]").focus(); } });
  el("text", {x: pq[0] + 10, y: pq[1] - 10, "font-size": 13, "font-weight": "bold", fill: css("--hl")}, "q");
  let rows = "";
  X.forEach((x, i) => rows += `<tr class="${rank[i] <= 2 ? "on" : ""}"><td>x${"₁₂₃₄"[i]} = (${x.join("; ").replace(/-/g, "−")})</td><td class="n">${fmt(S[i], raw ? 2 : 4)}</td><td class="n">${rank[i]}.</td></tr>`);
  E("tb").innerHTML = rows; E("sh").textContent = raw ? "nyers xᵢ·q" : "sᵢ = cos(xᵢ, q)";
  E("status").textContent = `q = (${fmt(q[0], 1)}; ${fmt(q[1], 1)}): ${raw ? "nyers Xq" : "s"} = (${S.map(v => fmt(v, raw ? 2 : 4)).join("; ")}), top-2: x${"₁₂₃₄"[order[0]]}, x${"₁₂₃₄"[order[1]]}`;
}
svg.addEventListener("pointermove", e => { if (!drag) return; const p = svgPoint(e);
  q = [Math.round(((p.x - OX) / SC) * 10) / 10, Math.round(((OY - p.y) / SC) * 10) / 10];
  q = [Math.max(X0, Math.min(X1, q[0])), Math.max(Y0, Math.min(Y1, q[1]))]; if (q[0] === 0 && q[1] === 0) q = [0.1, 0]; draw(); });
svg.addEventListener("pointerup", () => { drag = false; });
E("raw").addEventListener("change", draw);
E("reset").onclick = () => { q = [1, 2]; E("raw").checked = false; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const qs = new URLSearchParams(location.search); if (qs.get("raw")) E("raw").checked = true;
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
