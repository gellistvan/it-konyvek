  $("status").textContent = "k = " + k + " | rel. Frobenius-hiba ‖A − A_k‖/‖A‖ = " + fmt(e1, 4) + " | √(σₖ₊₁² + … + σₙ²)/‖A‖_F = " + fmt(e2, 4) +
    " | tárolt számok k(m + n) = " + stored + " vs. mn = 2304" + (stored >= 2304 ? " (nincs nyereség)" : " (" + fmt(stored/2304*100, 1) + "%)") + (cl ? " | zaj nélkül" : "");
  // spektrum
  svg.innerHTML = "";
  const L = 60, R = 540, T = 20, B = 200, X = i => L + (R - L)*(i - 0.5)/48.5, Y = v => B - (B - T)*(Math.log10(Math.max(v, 0.01)) - Math.log10(0.01))/(Math.log10(40) - Math.log10(0.01));
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: css("--fg")}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: css("--fg")});
  [0.01, 0.1, 1, 10].forEach(v => { el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, v < 0.1 ? 2 : (v < 1 ? 1 : 0))); });
  [1, 8, 16, 24, 32, 40, 48].forEach(i => el("text", {x: X(i), y: B + 15, "text-anchor": "middle", "font-size": 11}, String(i)));
  el("text", {x: (L + R)/2, y: B + 32, "text-anchor": "middle", "font-size": 12}, "i (a szinguláris érték sorszáma), függőleges tengely: σᵢ, log-skála");
  el("rect", {x: L, y: T, width: X(k + 0.5) - L, height: B - T, fill: css("--cellhl"), opacity: 0.5});
  const sn0 = D.sn[0];
  el("line", {x1: L, y1: Y(sn0), x2: R, y2: Y(sn0), stroke: css("--muted"), "stroke-dasharray": "6 4"});
  el("text", {x: R - 2, y: Y(sn0) - 5, "text-anchor": "end", "font-size": 11}, "zaj σ₁ ≈ " + fmt(sn0, 2));
  el("polyline", {points: D.sn.map((v, i) => X(i + 1) + "," + Y(v)).join(" "), fill: "none", stroke: css("--fg"), "stroke-dasharray": "2 3", "stroke-width": 1.5});
  D.s.forEach((v, i) => el("circle", {cx: X(i + 1), cy: Y(v), r: 3.4, fill: i < k && !cl ? css("--hl") : css("--muted")}));
  D.sc.forEach((v, i) => el("rect", {x: X(i + 1) - 5, y: Y(v) - 5, width: 10, height: 10, fill: "none", stroke: i < k && cl ? css("--hl2") : css("--fg"), "stroke-width": 1.6}));
  el("text", {x: R, y: T + 4, "text-anchor": "end", "font-size": 11}, "● kép σᵢ (kiemelve: megtartott)   □ zajmentes kép   ··· tiszta zaj");
}
$("k").addEventListener("input", draw);
$("clean").addEventListener("change", draw);
document.querySelectorAll("button[data-k]").forEach(b => b.addEventListener("click", () => { $("k").value = b.dataset.k; draw(); }));
$("layer").onclick = () => { showLayer = !showLayer; $("layer").setAttribute("aria-pressed", String(showLayer)); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
