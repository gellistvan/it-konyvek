<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A span geometriája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Súlyok">
  <label for="s1">c₁ =</label><input id="s1" type="range" min="-9" max="9" step="1" value="6" aria-label="c1 súly harmadokban">
  <b id="c1v" style="min-width:3.5em">2</b>
  <label for="s2">c₂ =</label><input id="s2" type="range" min="-9" max="9" step="1" value="3" aria-label="c2 súly harmadokban">
  <b id="c2v" style="min-width:3.5em">1</b>
</div>
<div class="ctl" role="group" aria-label="Vektorok és cél">
  <label>u = <input id="u" type="text" value="2, 1" aria-label="u vektor koordinátái"></label>
  <label>v = <input id="vv" type="text" value="-1, 1" aria-label="v vektor koordinátái"></label>
  <label>cél x = <input id="x" type="text" value="4, 1" aria-label="cél x vektor koordinátái"></label>
  <button id="solve">Megold</button>
  <label><input id="trail" type="checkbox"> Nyomvonal</label>
  <button id="ex1">1. példa</button><button id="ex2">2. példa</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 360" role="img" aria-label="Az u és v vektor, a c1·u + c2·v kombináció és a ferde rács; párhuzamos vektoroknál a span egy egyenes"></svg>
  
</div>
<p class="small">Számított értékek, a 3.3 példái. Kezdőállapot: 1. példa vektorai, c1 = 2, c2 = 1, eredő (3, 3). A Megold gomb a 2×2-es egyenletrendszert oldja meg; a Nyomvonal a végigjárt végpontokat megtartja (független esetben kitöltődik a sík, párhuzamosnál csak az egyenes).</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


let U = [2, 1], V = [-1, 1], XT = [4, 1], c1 = 2, c2 = 1, trail = [], info = "";
const SC = 46, OX = 20 + 2 * SC, OY = 14 + 4 * SC;   // ablak [-2;6]×[-3;4]
const PX = p => OX + SC * p[0], PY = p => OY - SC * p[1];
function parse(s){ const a = s.replace(/−/g, "-").split(/[;,\s]+/).filter(t => t.length).map(t => parseFloat(t)); return (a.length === 2 && a.every(isFinite)) ? a : null; }
function fr(x){ const n = Math.round(x * 3); if (Math.abs(x * 3 - n) < 1e-9) { if (n % 3 === 0) return String(n / 3).replace("-", "−"); return (n < 0 ? "−" : "") + Math.abs(n) + "/3"; } return hu(x, 4); }
function pt(p){ return "(" + [p[0], p[1]].map(q => fr(q)).join(", ") + ")"; }
function lineClip(p, d){ // a p + t·d egyenes metszése az ablakkal
  const ts = []; const B = [[-2, 6], [-3, 4]];
  for (let a = 0; a < 2; a++) { if (Math.abs(d[a]) < 1e-12) continue; for (const b of B[a]) { const t = (b - p[a]) / d[a]; const q = [p[0] + t * d[0], p[1] + t * d[1]]; if (q[0] >= -2 - 1e-9 && q[0] <= 6 + 1e-9 && q[1] >= -3 - 1e-9 && q[1] <= 4 + 1e-9) ts.push(t); } }
  if (ts.length < 2) return null; const t0 = Math.min(...ts), t1 = Math.max(...ts);
  return [[p[0] + t0 * d[0], p[1] + t0 * d[1]], [p[0] + t1 * d[0], p[1] + t1 * d[1]]]; }
function seg(L, o){ if (L) el("line", Object.assign({x1: PX(L[0]), y1: PY(L[0]), x2: PX(L[1]), y2: PY(L[1])}, o)); }
function draw(){
  svg.innerHTML = "";
  const det = U[0] * V[1] - U[1] * V[0], indep = Math.abs(det) > 1e-12;
  for (let i = -2; i <= 6; i++) { el("line", {x1: PX([i, 0]), y1: PY([0, -3]), x2: PX([i, 0]), y2: PY([0, 4]), stroke: css("--grid")}); el("text", {x: PX([i, 0]), y: PY([0, -3]) + 15, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i).replace("-", "−")); }
  for (let j = -3; j <= 4; j++) { el("line", {x1: PX([-2, 0]), y1: PY([0, j]), x2: PX([6, 0]), y2: PY([0, j]), stroke: css("--grid")}); el("text", {x: PX([-2, 0]) - 4, y: PY([0, j]) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(j).replace("-", "−")); }
  el("line", {x1: PX([0, 0]), y1: PY([0, -3]), x2: PX([0, 0]), y2: PY([0, 4]), stroke: css("--grid2")});
  el("line", {x1: PX([-2, 0]), y1: PY([0, 0]), x2: PX([6, 0]), y2: PY([0, 0]), stroke: css("--grid2")});
  if (indep) { for (let k = -12; k <= 12; k++) { seg(lineClip([k * U[0], k * U[1]], V), {stroke: css("--grid2"), "stroke-width": 0.8}); seg(lineClip([k * V[0], k * V[1]], U), {stroke: css("--grid2"), "stroke-width": 0.8}); } }
  else { const d = (U[0] || U[1]) ? U : V; if (d[0] || d[1]) seg(lineClip([0, 0], d), {stroke: css("--fg"), "stroke-width": 3, "stroke-dasharray": "9 6"}); }
  trail.forEach(p => el("circle", {cx: PX(p), cy: PY(p), r: 3, fill: css("--hl2")}));
  arrow(PX([0, 0]), PY([0, 0]), PX(U), PY(U), {w: 2.5});
  arrow(PX([0, 0]), PY([0, 0]), PX(V), PY(V), {w: 2.5, dash: "8 5"});
  el("text", {x: PX(U) + 6, y: PY(U) + 16, "font-size": 15, "font-weight": "bold"}, "u");
  el("text", {x: PX(V) - 14, y: PY(V) - 4, "font-size": 15, "font-weight": "bold"}, "v");
  const A = [c1 * U[0], c1 * U[1]], R = [A[0] + c2 * V[0], A[1] + c2 * V[1]];
  arrow(PX([0, 0]), PY([0, 0]), PX(A), PY(A), {w: 2, dash: "2 4", col: css("--hl")});
  arrow(PX(A), PY(A), PX(R), PY(R), {w: 2, dash: "2 4", col: css("--hl")});
  arrow(PX([0, 0]), PY([0, 0]), PX(R), PY(R), {w: 4, col: css("--fg")});
  const hit = Math.hypot(R[0] - XT[0], R[1] - XT[1]) < 1e-9;
  el("circle", {cx: PX(XT), cy: PY(XT), r: 8, fill: "none", stroke: css("--fg"), "stroke-width": hit ? 3.5 : 2});
  el("text", {x: PX(XT) + 10, y: PY(XT) + 18, "font-size": 13}, "x = " + pt(XT));
  const LX = 450; el("text", {x: LX, y: 40, "font-size": 13}, indep ? "u, v független:" : "u, v párhuzamos:");
  el("text", {x: LX, y: 58, "font-size": 13}, indep ? "a span a teljes sík" : "a span egy egyenes");
  el("text", {x: LX, y: 90, "font-size": 12, fill: css("--muted")}, "vékony: ferde rács");
  el("text", {x: LX, y: 106, "font-size": 12, fill: css("--muted")}, "pontozott: c₁u, majd c₂v");
  el("text", {x: LX, y: 122, "font-size": 12, fill: css("--muted")}, "vastag: c₁u + c₂v");
  el("text", {x: LX, y: 138, "font-size": 12, fill: css("--muted")}, "kör: a cél x");
  if (hit) el("text", {x: LX, y: 170, "font-size": 13, "font-weight": "bold"}, "célba ért!");
  g("c1v").textContent = fr(c1); g("c2v").textContent = fr(c2);
  g("status").textContent = "c1 = " + fr(c1) + ", c2 = " + fr(c2) + ": c1·u + c2·v = " + pt(R) + (info ? " – " + info : "");
}
function fromSliders(){ c1 = +g("s1").value / 3; c2 = +g("s2").value / 3; info = "";
  if (g("trail").checked) trail.push([c1 * U[0] + c2 * V[0], c1 * U[1] + c2 * V[1]]); draw(); }
function readVecs(){ const a = parse(g("u").value), b = parse(g("vv").value), t = parse(g("x").value);
  if (!a || !b || !t) { info = "hibás bemenet: két számot adj meg vesszővel elválasztva"; draw(); return false; }
  U = a; V = b; XT = t; trail = []; return true; }
function setSl(){ g("s1").value = Math.max(-9, Math.min(9, Math.round(c1 * 3))); g("s2").value = Math.max(-9, Math.min(9, Math.round(c2 * 3))); }
function solve(){ if (!readVecs()) return;
  const det = U[0] * V[1] - U[1] * V[0];
  if (Math.abs(det) > 1e-12) { c1 = (XT[0] * V[1] - XT[1] * V[0]) / det; c2 = (U[0] * XT[1] - U[1] * XT[0]) / det; info = "megoldva (egyértelmű)";
    if (Math.abs(c1) > 3 || Math.abs(c2) > 3) info += "; a csúszka tartományán [−3; 3] kívül"; }
  else { const d = (U[0] || U[1]) ? U : V, cr = d[0] * XT[1] - d[1] * XT[0];
    if ((d[0] || d[1]) && Math.abs(cr) < 1e-12) { const s = (XT[0] * d[0] + XT[1] * d[1]) / (d[0] * d[0] + d[1] * d[1]); if (d === U) { c1 = s; c2 = 0; } else { c1 = 0; c2 = s; } info = "párhuzamos vektorok: végtelen sok megoldás, egyet mutatunk"; }
    else info = "nincs megoldás (párhuzamos vektorok)"; }
  setSl(); draw(); }
function example(n){ if (n === 1) { g("u").value = "2, 1"; g("vv").value = "-1, 1"; g("x").value = "4, 1"; } else { g("u").value = "2, 1"; g("vv").value = "4, 2"; g("x").value = "4, 0"; }
  readVecs(); info = n === 1 ? "1. példa: a Megold gomb c1 = 5/3, c2 = −2/3 értéket ad" : "2. példa: (4, 0) nincs az x2 = x1/2 egyenesen"; draw(); }
g("s1").addEventListener("input", fromSliders); g("s2").addEventListener("input", fromSliders);
["u", "vv", "x"].forEach(id => g(id).addEventListener("change", () => { if (readVecs()) { info = ""; draw(); } }));
g("solve").onclick = solve; g("ex1").onclick = () => example(1); g("ex2").onclick = () => example(2);
g("trail").addEventListener("change", () => { trail = []; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
