<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoPE: csak a pozíciókülönbség számít</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="t1">t₁ =</label><input id="t1" type="range" min="0" max="12" step="1" value="2"><b id="t1v"></b>
<label for="t2">t₂ =</label><input id="t2" type="range" min="0" max="12" step="1" value="5"><b id="t2v"></b>
<button id="shift">közös eltolás +1</button><button id="swap">pozíciók cseréje</button><button id="reset">Alapállás (2, 5)</button>
<span>q = (<input id="q0" type="number" step="0.1" value="1" aria-label="q első komponense">; <input id="q1" type="number" step="0.1" value="0" aria-label="q második komponense">)</span>
<span>k = (<input id="k0" type="number" step="0.1" value="0" aria-label="k első komponense">; <input id="k1" type="number" step="0.1" value="1" aria-label="k második komponense">)</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 320" role="img" aria-label="Egységkörön két elforgatott vektor a bezárt szöggel, mellette a kidolgozott példa S-mátrixa"></svg>

</div>

<p class="small">d_h = 2, θ₀ = 1: a t pozícióhoz t radián forgatás. A közös eltolás a bezárt szöget és a pontszorzatot nem változtatja, a pozíciók cseréje q = (1,0), k = (0,1) esetén előjelet vált. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
function rot(x, a){ return [x[0] * Math.cos(a) - x[1] * Math.sin(a), x[0] * Math.sin(a) + x[1] * Math.cos(a)]; }
const CX = 160, CY = 160, SC = 115;
const P = x => [CX + SC * x[0], CY - SC * x[1]];
function arrow(x, col, w, dash, lab){
  const [x1, y1] = P(x), L = Math.hypot(x1 - CX, y1 - CY) || 1, ux = (x1 - CX) / L, uy = (y1 - CY) / L;
  el("line", {x1: CX, y1: CY, x2: x1 - 9 * ux, y2: y1 - 9 * uy, stroke: col, "stroke-width": w, "stroke-dasharray": dash});
  el("polygon", {points: `${x1},${y1} ${x1 - 12 * ux - 5 * uy},${y1 - 12 * uy + 5 * ux} ${x1 - 12 * ux + 5 * uy},${y1 - 12 * uy - 5 * ux}`, fill: col});
  el("text", {x: x1 + 18 * ux, y: y1 + 18 * uy + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: col}, lab);
}
const num = id => { const v = parseFloat(String(E(id).value).replace(",", ".")); return isFinite(v) ? v : 0; };
function draw(){
  const t1 = +E("t1").value, t2 = +E("t2").value, q = [num("q0"), num("q1")], k = [num("k0"), num("k1")];
  E("t1v").textContent = t1; E("t2v").textContent = t2;
  const a = rot(q, t1), b = rot(k, t2), dot = a[0] * b[0] + a[1] * b[1];
  svg.innerHTML = "";
  el("circle", {cx: CX, cy: CY, r: SC, fill: "none", stroke: css("--muted")});
  el("line", {x1: CX - 140, y1: CY, x2: CX + 140, y2: CY, stroke: css("--grid")});
  el("line", {x1: CX, y1: CY - 140, x2: CX, y2: CY + 140, stroke: css("--grid")});
  let a0 = Math.atan2(a[1], a[0]), da = Math.atan2(b[1], b[0]) - a0;
  while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
  const r = 38, s0 = [CX + r * Math.cos(a0), CY - r * Math.sin(a0)], s1 = [CX + r * Math.cos(a0 + da), CY - r * Math.sin(a0 + da)];
  el("path", {d: `M${s0[0]},${s0[1]} A${r},${r} 0 0 ${da > 0 ? 0 : 1} ${s1[0]},${s1[1]}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
  arrow(a, css("--fg"), 3, "", `q, t₁=${t1}`);
  arrow(b, css("--hl"), 2.5, "7 4", `k, t₂=${t2}`);
  // második panel: a kidolgozott példa
  const X2 = 360;
  el("text", {x: X2, y: 30, "font-size": 13, "font-weight": "bold"}, "Kidolgozott példa (t = 0, 1):");
  el("text", {x: X2, y: 54, "font-size": 12}, "q₀ = k₀ = (1; 0)");
  el("text", {x: X2, y: 74, "font-size": 12}, "q₁ = k₁ = R(1)x₁ ≈ (−0,8415; 0,5403)");
  el("text", {x: X2, y: 104, "font-size": 12}, "S = QQᵀ/√2 ≈");
  const Sm = [[0.7071, -0.5950], [-0.5950, 0.7071]];
  Sm.forEach((row, i) => row.forEach((v, j) => { el("rect", {x: X2 + 95 + j * 70, y: 88 + i * 30, width: 70, height: 30, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: X2 + 130 + j * 70, y: 108 + i * 30, "text-anchor": "middle", "font-size": 13}, fmt(v, 4)); }));
  el("text", {x: X2, y: 172, "font-size": 11, fill: css("--muted")}, "Szimmetrikus, mert Q = K (Gram-mátrix);");
  el("text", {x: X2, y: 188, "font-size": 11, fill: css("--muted")}, "ez nem a RoPE relatív tulajdonsága.");
  el("text", {x: X2, y: 225, "font-size": 12}, "⟨R(t₁)q, R(t₂)k⟩ = qᵀR(t₂ − t₁)k");
  el("text", {x: X2, y: 245, "font-size": 12}, "q = (1,0), k = (0,1): = sin(t₁ − t₂)");
  const unitQK = q[0] === 1 && q[1] === 0 && k[0] === 0 && k[1] === 1;
  E("status").textContent = `t₁=${t1}, t₂=${t2}: t₁−t₂=${String(t1 - t2).replace("-", "−")}, ⟨·,·⟩ = ` + (unitQK ? `sin(${String(t1 - t2).replace("-", "−")}) = ` : "") + fmt(dot, 4);
}
["t1", "t2", "q0", "q1", "k0", "k1"].forEach(id => E(id).addEventListener("input", draw));
E("shift").onclick = () => { if (+E("t1").value < 12 && +E("t2").value < 12) { E("t1").value = +E("t1").value + 1; E("t2").value = +E("t2").value + 1; } draw(); };
E("swap").onclick = () => { const a = E("t1").value; E("t1").value = E("t2").value; E("t2").value = a; draw(); };
E("reset").onclick = () => { E("t1").value = 2; E("t2").value = 5; E("q0").value = 1; E("q1").value = 0; E("k0").value = 0; E("k1").value = 1; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const qs = new URLSearchParams(location.search); if (qs.get("t1")) E("t1").value = qs.get("t1"); if (qs.get("t2")) E("t2").value = qs.get("t2");
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
