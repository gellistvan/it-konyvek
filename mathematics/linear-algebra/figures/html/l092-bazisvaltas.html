<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bázisváltás: két rács, egy vektor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="mode">rács:</label><select id="mode"><option value="std">standard rács</option><option value="C">𝒞-rács</option><option value="both" selected>mindkettő</option></select>
<button id="reset">Alapállás: x = (3, 1), c₁ = (1, 1), c₂ = (1, −1)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 385 385" role="img" aria-label="A (3,1) vektor a standard és a ferde C-rácson; a nyíl ugyanaz, a koordináták mások"></svg>

</div>

<p class="small">Az x, c₁ és c₂ végpontja húzható (0,5-ös rácsra illesztve), fókuszálva nyilakkal is állítható. Pontozott: standard rács, szaggatott: 𝒞-rács; szürke út: x = x·e₁ + y·e₂, narancs út: x = u₁c₁ + u₂c₂. Számított értékek; az alapállás a kidolgozott példa.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
let V = {x: [3, 1], c1: [1, 1], c2: [1, -1]}, drag = null;
svg.style.maxWidth = "560px";
const XL = [-2, 5], YL = [-3, 4], SC = 52, OX = 10 - XL[0] * SC, OY = 10 + YL[1] * SC;
const P = v => [OX + v[0] * SC, OY - v[1] * SC];
const f1 = v => fmt(v, 2).replace(/,00$/, "").replace(/(,\d)0$/, "$1");
function arrow(p, q, col, w, dash){
  const a = P(p), b = P(q), L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
  el("line", {x1: a[0], y1: a[1], x2: b[0] - 9 * ux, y2: b[1] - 9 * uy, stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  el("polygon", {points: `${b[0]},${b[1]} ${b[0] - 12 * ux - 5 * uy},${b[1] - 12 * uy + 5 * ux} ${b[0] - 12 * ux + 5 * uy},${b[1] - 12 * uy - 5 * ux}`, fill: col});
}
function line(p, d, col, dash, w){ const a = P([p[0] - 20 * d[0], p[1] - 20 * d[1]]), b = P([p[0] + 20 * d[0], p[1] + 20 * d[1]]);
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, "stroke-dasharray": dash, "stroke-width": w || 1}); }
function draw(){
  const mode = E("mode").value, [x, c1, c2] = [V.x, V.c1, V.c2];
  const det = c1[0] * c2[1] - c2[0] * c1[1];
  svg.innerHTML = "";
  const cp = el("clipPath", {id: "cl"}); const cr = document.createElementNS(NS, "rect"); cr.setAttribute("x", 10); cr.setAttribute("y", 10); cr.setAttribute("width", (XL[1] - XL[0]) * SC); cr.setAttribute("height", (YL[1] - YL[0]) * SC); cp.appendChild(cr);
  const g0 = svg.childNodes.length;
  if (mode !== "C") for (let g = -6; g <= 8; g++) { line([g, 0], [0, 1], css("--muted"), "1 3", 1); line([0, g], [1, 0], css("--muted"), "1 3", 1); }
  if (mode !== "std" && Math.abs(det) > 1e-6) for (let m = -10; m <= 10; m++) { line([m * c2[0], m * c2[1]], c1, css("--fg"), "6 4", 0.9); line([m * c1[0], m * c1[1]], c2, css("--fg"), "6 4", 0.9); }
  Array.from(svg.childNodes).slice(g0).forEach(n => n.setAttribute("clip-path", "url(#cl)"));
  el("rect", {x: 10, y: 10, width: (XL[1] - XL[0]) * SC, height: (YL[1] - YL[0]) * SC, fill: "none", stroke: css("--muted")});
  line([0, 0], [1, 0], css("--muted"), "", 1); line([0, 0], [0, 1], css("--muted"), "", 1);
  Array.from(svg.childNodes).slice(-2).forEach(n => n.setAttribute("clip-path", "url(#cl)"));
  let msg;
  if (Math.abs(det) < 1e-6) msg = `[x]_std = (${f1(x[0])}, ${f1(x[1])}); c₁ és c₂ lineárisan összefüggő – nem bázis!`;
  else {
    const u1 = (x[0] * c2[1] - c2[0] * x[1]) / det, u2 = (c1[0] * x[1] - x[0] * c1[1]) / det;
    if (mode !== "C") { arrow([0, 0], [x[0], 0], css("--muted"), 1.5, "5 4"); arrow([x[0], 0], x, css("--muted"), 1.5, "5 4"); }
    if (mode !== "std") { const m = [u1 * c1[0], u1 * c1[1]]; arrow([0, 0], m, css("--hl2"), 2, "5 4"); arrow(m, x, css("--hl2"), 2, "5 4"); }
    const std = c1[0] === 1 && c1[1] === 1 && c2[0] === 1 && c2[1] === -1;
    msg = `[x]_std = (${f1(x[0])}, ${f1(x[1])}); [x]_𝒞 = ` + (std ? `((x+y)/2, (x−y)/2) = ` : "a 2×2 rendszer megoldása: ") + `(${f1(u1)}, ${f1(u2)}): x = ${f1(u1)}·c₁ + ${f1(u2)}·c₂`;
  }
  arrow([0, 0], c1, css("--hl"), 3); arrow([0, 0], c2, css("--hl"), 3);
  if (mode !== "C") { arrow([0, 0], [1, 0], css("--muted"), 2); arrow([0, 0], [0, 1], css("--muted"), 2); }
  arrow([0, 0], x, css("--fg"), 4);
  [["x", x, css("--fg")], ["c1", c1, css("--hl")], ["c2", c2, css("--hl")]].forEach(([k, v, col]) => {
    const p = P(v);
    const h = el("circle", {cx: p[0], cy: p[1], r: 9, fill: col, "fill-opacity": 0.25, stroke: col, "stroke-width": 2, tabindex: 0, role: "slider", "aria-label": `${k} végpontja: húzható, nyilakkal 0,5-ös lépésben állítható`, style: "cursor:grab"});
    h.addEventListener("pointerdown", e => { drag = k; svg.setPointerCapture(e.pointerId); });
    h.addEventListener("keydown", e => { const d = {ArrowLeft: [-0.5, 0], ArrowRight: [0.5, 0], ArrowUp: [0, 0.5], ArrowDown: [0, -0.5]}[e.key];
      if (d) { e.preventDefault(); V[k] = [V[k][0] + d[0], V[k][1] + d[1]]; draw(); svg.querySelector(`[aria-label^="${k} végpontja"]`).focus(); } });
    el("text", {x: p[0] + 12, y: p[1] - 10, "font-size": 15, "font-weight": "bold", fill: col}, k === "x" ? "x" : (k === "c1" ? "c₁" : "c₂"));
  });
  E("status").textContent = msg;
}
svg.addEventListener("pointermove", e => { if (!drag) return; const p = svgPoint(e);
  let v = [Math.round(((p.x - OX) / SC) * 2) / 2, Math.round(((OY - p.y) / SC) * 2) / 2];
  v = [Math.max(XL[0], Math.min(XL[1], v[0])), Math.max(YL[0], Math.min(YL[1], v[1]))];
  if (drag !== "x" && v[0] === 0 && v[1] === 0) return; V[drag] = v; draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
E("mode").addEventListener("change", draw);
E("reset").onclick = () => { V = {x: [3, 1], c1: [1, 1], c2: [1, -1]}; E("mode").value = "both"; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const qs = new URLSearchParams(location.search); if (qs.get("x")) V.x = qs.get("x").split(",").map(Number);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
