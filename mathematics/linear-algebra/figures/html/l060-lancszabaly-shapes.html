<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A láncszabály szorzatának alakjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--cellres:#bdbdbd;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--cellres:#666;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Dimenziók">
  <label>n = <input id="n" type="number" min="1" max="8" value="3"></label>
  <label>m = <input id="m" type="number" min="1" max="8" value="2"></label>
  <label>p = <input id="p" type="number" min="1" max="8" value="4"></label>
  <button id="sw">Sorrend cseréje</button>
  <button id="rs">Alapérték (3, 2, 4)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 300" role="img" aria-label="A két Jacobi-mátrix alakja dobozként, a szorzat alakjával vagy a nem értelmezett szorzat jelzésével"></svg>
<p class="small">f: ℝⁿ → ℝᵐ, g: ℝᵐ → ℝᵖ; J_f mérete m×n, J_g mérete p×m. Folytonos keret: a szorzat értelmezett („illeszkedik”);
szaggatott keret: a belső méretek eltérnek („nem értelmezett”). Ha n = m = p, mindkét sorrend illeszkedik, de a
J_f·J_g szorzat ekkor sem a g∘f Jacobi-mátrixa.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let swapped = false;
function val(id){ let v = Math.round(+document.getElementById(id).value); if (!(v >= 1)) v = 1; if (v > 8) v = 8; return v; }
function box(x, y, r, c, u, label, rl, cl, ok, fill){
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++)
    el("rect", {x: x + j * u, y: y + i * u, width: u, height: u, fill: fill, stroke: css("--muted"), "stroke-width": 0.6});
  el("rect", {x: x, y: y, width: c * u, height: r * u, fill: "none", stroke: css("--line"), "stroke-width": 2.5, "stroke-dasharray": ok ? "" : "7 5"});
  el("text", {x: x + c * u / 2, y: y - 8, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, label);
  el("text", {x: x - 6, y: y + r * u / 2 + 4, "text-anchor": "end", "font-size": 12}, rl);
  el("text", {x: x + c * u / 2, y: y + r * u + 16, "text-anchor": "middle", "font-size": 12}, cl);
  return x + c * u;
}
function draw(){
  const n = val("n"), m = val("m"), p = val("p");
  svg.innerHTML = "";
  // bal tényező és jobb tényező (sor×oszlop, feliratok)
  const A = swapped ? {l: "J_f", r: m, c: n, rl: "m=" + m, cl: "n=" + n} : {l: "J_g", r: p, c: m, rl: "p=" + p, cl: "m=" + m};
  const B = swapped ? {l: "J_g", r: p, c: m, rl: "p=" + p, cl: "m=" + m} : {l: "J_f", r: m, c: n, rl: "m=" + m, cl: "n=" + n};
  const ok = A.c === B.r;
  const u = Math.min(30, 200 / Math.max(A.r, B.r, 1), 110 / Math.max(A.c, B.c, n, 1));
  const H = 50 + Math.max(A.r, B.r) * u;
  let x = 50, y = 50;
  x = box(x, y, A.r, A.c, u, A.l, A.rl, A.cl, ok, css("--cellhl"));
  el("text", {x: x + 22, y: y + A.r * u / 2 + 8, "text-anchor": "middle", "font-size": 22}, "×");
  x = box(x + 85, y, B.r, B.c, u, B.l, B.rl, B.cl, ok, css("--cell"));
  el("text", {x: x + 22, y: y + A.r * u / 2 + 8, "text-anchor": "middle", "font-size": 22}, ok ? "=" : "≠");
  if (ok) {
    const lab = swapped ? "J_f·J_g" : "J_(g∘f)";
    x = box(x + 85, y, A.r, B.c, u, lab, A.rl, B.cl, true, css("--cellres"));
  }
  svg.setAttribute("viewBox", `0 0 620 ${H + 55}`);
  el("text", {x: 50, y: H + 40, "font-size": 14, "font-weight": "bold"},
     ok ? `illeszkedik: belső méretek ${A.c} = ${B.r}` : `nem értelmezett: belső méretek ${A.c} ≠ ${B.r}`);
  const prod = swapped ? "J_f · J_g" : "J_g · J_f";
  let msg = `${prod}: (${A.r}×${A.c}) · (${B.r}×${B.c}) → ` + (ok ? `${A.r}×${B.c}, illeszkedik.` : `nem értelmezett, mert ${A.c} ≠ ${B.r}.`);
  if (swapped && ok) msg += " Figyelem: ez a szorzat (n = m = p esetén) létezik, de nem a g∘f Jacobi-mátrixa – a helyes sorrend J_g·J_f.";
  document.getElementById("status").textContent = msg;
}
["n", "m", "p"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("sw").onclick = () => { swapped = !swapped; draw(); };
document.getElementById("rs").onclick = () => { document.getElementById("n").value = 3; document.getElementById("m").value = 2; document.getElementById("p").value = 4; swapped = false; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
