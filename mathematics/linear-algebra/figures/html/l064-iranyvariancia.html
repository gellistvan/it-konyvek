<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irányfüggő variancia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Irány">
  <label for="th">θ =</label><input id="th" type="range" min="0" max="180" step="0.1" value="0" aria-label="Az u irány szöge fokban">
  <b id="thv"></b>
</div>
<div class="ctl" role="group" aria-label="Kitüntetett irányok">
  <button id="bx1">x₁-tengely</button><button id="bx2">x₂-tengely</button><button id="bv1">v₁</button><button id="bv2">v₂</button>
  <span class="small">Az u nyíl hegye a bal oldali rajzon húzható.</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Bal: négy centrált pont és vetületük egy forgatható egyenesre; jobb: a vetületek varianciája a szög függvényében"></svg>
<p class="small">C = X̃ᵀX̃/(N − 1) = [[10/3, 3], [3, 14/3]] a 18.2 példájából. A vetületek mintavarianciája (N − 1 = 3 nevezővel) minden
irányban uᵀCu; maximuma λ₁ = 7,073 a v₁ irányban (θ ≈ 51,26°), minimuma λ₂ = 0,927 a merőleges v₂ irányban. Számított értékek.</p>
<script>
const D = {"P": [[-2.0, -2.0], [-1.0, 0.0], [1.0, -1.0], [2.0, 3.0]], "C": [[3.3333333333333335, 3.0], [3.0, 4.666666666666667]], "th1": 51.26440385457576};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (v, d) => { const t = v.toFixed(d).replace(".", ",").replace("-", "−"); return /^−0(,0+)?$/.test(t) ? t.slice(1) : t; };
function quad(th){ const c = Math.cos(th * Math.PI / 180), s = Math.sin(th * Math.PI / 180); return c * c * D.C[0][0] + 2 * c * s * D.C[0][1] + s * s * D.C[1][1]; }
const SC = 40, OX = 150, OY = 150;            // bal panel: 1 egység = 40 px
const X = v => OX + v * SC, Y = v => OY - v * SC;
const GX0 = 330, GX1 = 625, GY0 = 255, GY1 = 25;   // jobb panel
const GX = t => GX0 + (GX1 - GX0) * t / 180, GY = v => GY0 - (GY0 - GY1) * v / 8;
let TH = 0;
function draw(){
  const th = TH, r = th * Math.PI / 180, u = [Math.cos(r), Math.sin(r)];
  document.getElementById("thv").textContent = f(th, 1) + "°";
  svg.innerHTML = "";
  for (let g = -3; g <= 3; g++) { el("line", {x1: X(g), y1: Y(-3.4), x2: X(g), y2: Y(3.4), stroke: css("--grid"), "stroke-width": g ? 0.5 : 1.3}); el("line", {x1: X(-3.4), y1: Y(g), x2: X(3.4), y2: Y(g), stroke: css("--grid"), "stroke-width": g ? 0.5 : 1.3}); }
  el("text", {x: X(3.4), y: Y(0) + 14, "text-anchor": "end", "font-size": 12}, "x̃₁"); el("text", {x: X(0) + 5, y: Y(3.4) + 10, "font-size": 12}, "x̃₂");
  el("line", {x1: X(-4 * u[0]), y1: Y(-4 * u[1]), x2: X(4 * u[0]), y2: Y(4 * u[1]), stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": "7 4"});
  const pr = [];
  D.P.forEach(p => { const t = p[0] * u[0] + p[1] * u[1]; pr.push(t); const q = [t * u[0], t * u[1]];
    el("line", {x1: X(p[0]), y1: Y(p[1]), x2: X(q[0]), y2: Y(q[1]), stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": "2 3"});
    el("circle", {cx: X(q[0]), cy: Y(q[1]), r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5});
    el("circle", {cx: X(p[0]), cy: Y(p[1]), r: 5, fill: css("--fg")}); });
  const hx = X(1.7 * u[0]), hy = Y(1.7 * u[1]);
  el("line", {x1: X(0), y1: Y(0), x2: hx, y2: hy, stroke: css("--hl2"), "stroke-width": 3});
  el("circle", {cx: hx, cy: hy, r: 8, fill: css("--hl2"), stroke: css("--bg"), "stroke-width": 1.5, id: "knob", style: "cursor:grab"});
  el("text", {x: hx + 10, y: hy - 8, "font-size": 13, fill: css("--hl2")}, "u");
  // jobb panel: görbe
  el("line", {x1: GX0, y1: GY0, x2: GX1, y2: GY0, stroke: css("--line")}); el("line", {x1: GX0, y1: GY0, x2: GX0, y2: GY1, stroke: css("--line")});
  [0, 45, 90, 135, 180].forEach(t => el("text", {x: GX(t), y: GY0 + 15, "text-anchor": "middle", "font-size": 11}, t + "°"));
  [0, 2, 4, 6, 8].forEach(v => { el("text", {x: GX0 - 5, y: GY(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); el("line", {x1: GX0, y1: GY(v), x2: GX1, y2: GY(v), stroke: css("--grid"), "stroke-width": 0.5}); });
  let d = ""; for (let t = 0; t <= 180; t += 1) d += (t ? "L" : "M") + GX(t).toFixed(1) + "," + GY(quad(t)).toFixed(1);
  el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: (GX0 + GX1) / 2, y: GY0 + 32, "text-anchor": "middle", "font-size": 12}, "θ");
  el("text", {x: GX0 + 6, y: GY1 - 8, "font-size": 12}, "uᵀCu");
  [[D.th1, "λ₁"], [D.th1 + 90, "λ₂"]].forEach(([t, l]) => { el("line", {x1: GX(t), y1: GY0, x2: GX(t), y2: GY1, stroke: css("--muted"), "stroke-dasharray": "3 3"}); el("text", {x: GX(t) + 3, y: GY(quad(t)) + (l === "λ₁" ? -6 : 16), "font-size": 12}, l); });
  const val = quad(th);
  el("circle", {cx: GX(th), cy: GY(val), r: 6, fill: css("--hl2")});
  // ellenőrzés: a vetületek mintavarianciája (N − 1 nevező)
  const m = pr.reduce((a, b) => a + b, 0) / pr.length, sv = pr.reduce((a, b) => a + (b - m) * (b - m), 0) / (pr.length - 1);
  document.getElementById("status").textContent = `θ = ${f(th, 1)}°, u = (${f(u[0], 3)}; ${f(u[1], 3)}), vetületek = (${pr.map(x => f(x, 3)).join("; ")}), mintavariancia = ${f(sv, 3)} = uᵀCu = ${f(val, 3)}`;
}
function set(t){ TH = ((t % 180) + 180) % 180; document.getElementById("th").value = TH; draw(); }
document.getElementById("th").addEventListener("input", () => { TH = +document.getElementById("th").value; draw(); });
document.getElementById("bx1").onclick = () => set(0);
document.getElementById("bx2").onclick = () => set(90);
document.getElementById("bv1").onclick = () => set(D.th1);
document.getElementById("bv2").onclick = () => set(D.th1 + 90);
let drag = false;
function angleFrom(e){ const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  let a = Math.atan2(OY - q.y, q.x - OX) * 180 / Math.PI; if (a < 0) a += 180; return a >= 180 ? 0 : a; }
svg.addEventListener("pointerdown", e => { if (e.target.id === "knob") { drag = true; svg.setPointerCapture(e.pointerId); } });
svg.addEventListener("pointermove", e => { if (drag) set(Math.round(angleFrom(e) * 10) / 10); });
svg.addEventListener("pointerup", () => { drag = false; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
