<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iránymenti derivált forgatható iránnyal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Irány">
  <label for="phi">u iránya</label><input id="phi" type="range" min="0" max="360" step="0.01" value="53.13" aria-label="Az u egységvektor szöge az x tengelytől, fokban"><b id="pv"></b>
  <button id="bg">gradiens irány</button><button id="bt">merőleges</button><button id="bo">ellentétes</button><button id="bb">könyv: (3/5, 4/5)</button>
</div>
<div class="ctl" role="group" aria-label="Saját irány">
  saját u: (<input id="ux" type="number" step="0.1" value="3">, <input id="uy" type="number" step="0.1" value="4">)
  <button id="go">normál és beállít</button><span id="un" class="small"></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 345" role="img" aria-label="Bal: szintvonalak az (1,1) pont körül, a (5,7) gradiens és egy forgatható u egységvektor; jobb: a D_u f = √74·cos θ koszinuszgörbe a pillanatnyi ponttal"></svg>
<p class="small">f(x, y) = x² + 3xy + 2y², az (1, 1) pontban ∇f = (5, 7). Az u nyíl hegye húzható (a bal panelen bárhová kattintva is beállítható). Saját u-nál a program normál, és kiírja a normálás előtti hosszt (17.2.9, 3. tipikus hiba). Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const G = [5, 7], GN = Math.hypot(5, 7), GA = Math.atan2(7, 5);
let U = [0.6, 0.8], drag = false;
const OX = 150, OY = 175, S = 70, f = (x, y) => x*x + 3*x*y + 2*y*y;
const P = (x, y) => [OX + (x - 1)*S, OY - (y - 1)*S];
function contour(c, at){ const N = 80, h = 4.4/N, segs = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const x0 = -1.2 + i*h, y0 = -1.2 + j*h, Q = [[x0,y0],[x0+h,y0],[x0+h,y0+h],[x0,y0+h]], v = Q.map(p => f(p[0], p[1]) - c), pts = [];
    for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; if ((v[k] < 0) !== (v[k2] < 0)) { const s = v[k]/(v[k] - v[k2]); pts.push([Q[k][0] + s*(Q[k2][0] - Q[k][0]), Q[k][1] + s*(Q[k2][1] - Q[k][1])]); } }
    for (let k = 0; k + 1 < pts.length; k += 2) { const a = P(...pts[k]), b = P(...pts[k + 1]); segs.push("M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + "L" + b[0].toFixed(1) + " " + b[1].toFixed(1)); } }
  el("path", Object.assign({d: segs.join(""), fill: "none", "clip-path": "url(#cl)"}, at)); }
function arrow(a, b, col, w, da){ el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, "stroke-width": w, "stroke-dasharray": da || ""});
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 9 + w; el("polygon", {points: [b, [b[0] - h*Math.cos(ang - 0.4), b[1] - h*Math.sin(ang - 0.4)], [b[0] - h*Math.cos(ang + 0.4), b[1] - h*Math.sin(ang + 0.4)]].map(z => z.join(",")).join(" "), fill: col}); }
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const cp = el("clipPath", {id: "cl"}); const r = document.createElementNS(NS, "rect"); r.setAttribute("x", 10); r.setAttribute("y", 30); r.setAttribute("width", 280); r.setAttribute("height", 290); cp.appendChild(r);
  el("rect", {x: 10, y: 30, width: 280, height: 290, fill: "none", stroke: css("--grid")});
  contour(2, {stroke: mu}); contour(6, {stroke: fg, "stroke-width": 2}); contour(10, {stroke: mu});
  el("text", {x: 16, y: 312, "font-size": 11, fill: mu}, "szintvonalak: f = 6 (vastag; az érintője vékony), f = 2 és 10 (szürke)");
  const p0 = P(1, 1), L = 1.6, tg = [-7/GN, 5/GN];
  el("line", {x1: p0[0] - L*S*tg[0], y1: p0[1] + L*S*tg[1], x2: p0[0] + L*S*tg[0], y2: p0[1] - L*S*tg[1], stroke: mu, "stroke-width": 1});
  arrow(p0, [p0[0] + L*S*G[0]/GN, p0[1] - L*S*G[1]/GN], fg, 3);
  arrow(p0, [p0[0] + L*S*0.6, p0[1] - L*S*0.8], mu, 1.4, "6 4");
  arrow(p0, [p0[0] + L*S*U[0], p0[1] - L*S*U[1]], css("--hl2"), 2.6, "2 3");
  const tip = [p0[0] + L*S*U[0], p0[1] - L*S*U[1]];
  el("circle", {cx: tip[0], cy: tip[1], r: 9, fill: css("--hl2"), "fill-opacity": 0.25, stroke: css("--hl2"), style: "cursor:grab", id: "tip"});
  el("circle", {cx: p0[0], cy: p0[1], r: 5, fill: fg});
  el("text", {x: p0[0] + L*S*G[0]/GN - 10, y: p0[1] - L*S*G[1]/GN - 8, "font-size": 12, "text-anchor": "end"}, "∇f(1, 1) = (5, 7)");
  el("text", {x: 10, y: 20, "font-size": 12}, "(1, 1) pont; narancs: a forgatható u (húzd a hegyét)");
  // jobb panel: D_u f(θ)
  const L2 = 345, R2 = 550, T2 = 40, B2 = 300, X = t => L2 + (R2 - L2)*(t + 180)/360, Y = v => (T2 + B2)/2 - v*(B2 - T2)/2/10;
  el("line", {x1: L2, y1: Y(0), x2: R2, y2: Y(0), stroke: css("--grid")}); el("line", {x1: X(0), y1: T2, x2: X(0), y2: B2, stroke: css("--grid")});
  [-180, -90, 0, 90, 180].forEach(t => el("text", {x: X(t), y: B2 + 15, "text-anchor": "middle", "font-size": 10, fill: mu}, String(t).replace("-", "−") + "°"));
  [-8, 0, 8].forEach(v => el("text", {x: L2 - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 10, fill: mu}, String(v).replace("-", "−")));
  const pts = []; for (let t = -180; t <= 180; t += 2) pts.push(X(t).toFixed(1) + "," + Y(GN*Math.cos(t*Math.PI/180)).toFixed(1));
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("text", {x: (L2 + R2)/2, y: 25, "text-anchor": "middle", "font-size": 12}, "D_u f = √74·cos θ");
  el("text", {x: (L2 + R2)/2, y: B2 + 32, "text-anchor": "middle", "font-size": 11}, "θ: u szöge a gradienshez mérve");
  let th = (Math.atan2(U[1], U[0]) - GA)*180/Math.PI; th = ((th + 540) % 360) - 180;
  const d = G[0]*U[0] + G[1]*U[1];
  el("circle", {cx: X(th), cy: Y(d), r: 6, fill: css("--hl2")});
  $("pv").textContent = fmt(((Math.atan2(U[1], U[0])*180/Math.PI) + 360) % 360, 2) + "°";
  $("status").textContent = "u = (" + fmt(U[0], 4) + "; " + fmt(U[1], 4) + "), θ = " + fmt(th, 2) + "°, D_u f = " + fmt(d, 4) + ", max = √74 ≈ " + fmt(GN, 4);
}
function setAngle(a){ U = [Math.cos(a), Math.sin(a)]; $("phi").value = (((a*180/Math.PI) % 360) + 360) % 360; $("un").textContent = ""; draw(); }
$("phi").addEventListener("input", () => setAngle(+$("phi").value*Math.PI/180));
$("bg").onclick = () => setAngle(GA); $("bt").onclick = () => setAngle(GA + Math.PI/2); $("bo").onclick = () => setAngle(GA + Math.PI);
$("bb").onclick = () => { U = [0.6, 0.8]; $("phi").value = Math.atan2(0.8, 0.6)*180/Math.PI; $("un").textContent = ""; draw(); };
$("go").onclick = () => { const x = +$("ux").value, y = +$("uy").value, n = Math.hypot(x, y);
  if (!(n > 0)) { $("un").textContent = "a nullvektornak nincs iránya"; return; }
  U = [x/n, y/n]; $("phi").value = (Math.atan2(y, x)*180/Math.PI + 360) % 360; draw();
  $("un").textContent = "normálás előtti hossz: " + fmt(n, 4) + "; normálás nélkül ∇f·u = " + fmt(5*x + 7*y, 4) + " (ez nem a meredekség, ha a hossz ≠ 1)"; };
function toU(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const m = pt.matrixTransform(svg.getScreenCTM().inverse());
  const p0 = P(1, 1), dx = m.x - p0[0], dy = p0[1] - m.y; if (Math.hypot(dx, dy) > 8) setAngle(Math.atan2(dy, dx)); }
svg.addEventListener("pointerdown", ev => { if (ev.target.id === "tip" || ev.offsetX < svg.clientWidth*0.53) { drag = true; svg.setPointerCapture(ev.pointerId); toU(ev); } });
svg.addEventListener("pointermove", ev => { if (drag) toU(ev); });
svg.addEventListener("pointerup", () => { drag = false; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
