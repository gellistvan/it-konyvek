<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A legközelebbi pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A q pont helyzete">
  <label for="t">t =</label><input id="t" type="range" min="-0.5" max="2" step="0.01" value="0" aria-label="t paraméter">
  <b id="tv" style="min-width:3em">0,00</b>
  <button id="jump">Ugrás a vetületre</button>
</div>
<div class="ctl" role="group" aria-label="Vektorok">
  <label>u = <input id="u" type="text" value="3, 4" aria-label="u koordinátái"></label>
  <label>v = <input id="vv" type="text" value="5, 2" aria-label="v koordinátái"></label>
  <button id="reset">Alapértékek</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 345" role="img" aria-label="Az u irányú egyenes, a v vektor, a p vetület és a mozgó q pont; jobbra a távolság t függvényében, minimum a vetületnél"></svg>
  
</div>
<p class="small">Számított értékek, nem mérés. Kezdőállapot t = 0 (q = 0). Szaggatott: v − p (merőleges), pontozott: v − q, vastag pontozott: p − q. A t = 0,92 helyen q = p, a távolság minimális (2,8).</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


let U = [3, 4], V = [5, 2], t = 0, msg2 = "";
function parse(s){ const a = s.replace(/−/g, "-").split(/[;,\s]+/).filter(q => q.length).map(q => parseFloat(q)); return (a.length === 2 && a.every(isFinite)) ? a : null; }
const dot = (a, b) => a[0] * b[0] + a[1] * b[1], nrm = a => Math.hypot(a[0], a[1]);
function draw(){
  svg.innerHTML = "";
  const uu = dot(U, U); if (uu < 1e-12) { g("status").textContent = "u nem lehet nullvektor"; return; }
  const c = dot(V, U) / uu, P = [c * U[0], c * U[1]], Q = [t * U[0], t * U[1]];
  // bal panel: automatikus ablak
  const pts = [[0, 0], V, P, Q, [-0.5 * U[0], -0.5 * U[1]], [2 * U[0], 2 * U[1]]];
  let x0 = Math.min(...pts.map(q => q[0])) - 0.8, x1 = Math.max(...pts.map(q => q[0])) + 0.8, y0 = Math.min(...pts.map(q => q[1])) - 0.8, y1 = Math.max(...pts.map(q => q[1])) + 0.8;
  const W = 300, Hh = 300, S = Math.min(W / (x1 - x0), Hh / (y1 - y0)), ox = 15 - S * x0 + (W - S * (x1 - x0)) / 2, oy = 20 + S * y1 + (Hh - S * (y1 - y0)) / 2 - (Hh - S * (y1 - y0));
  const X = p => ox + S * p[0], Y = p => oy - S * p[1];
  el("rect", {x: 15, y: 20, width: W, height: Hh, fill: "none", stroke: css("--grid")});
  for (let i = Math.ceil(x0); i <= x1; i++) el("line", {x1: X([i, 0]), y1: 20, x2: X([i, 0]), y2: 20 + Hh, stroke: css("--grid")});
  for (let j = Math.ceil(y0); j <= y1; j++) el("line", {x1: 15, y1: Y([0, j]), x2: 15 + W, y2: Y([0, j]), stroke: css("--grid")});
  el("line", {x1: X([-0.5 * U[0], 0]), y1: Y([0, -0.5 * U[1]]), x2: X([2 * U[0], 0]), y2: Y([0, 2 * U[1]]), stroke: css("--fg"), "stroke-width": 1});
  el("text", {x: X([2 * U[0], 0]) - 6, y: Y([0, 2 * U[1]]) + 16, "font-size": 14, "font-style": "italic", "text-anchor": "end"}, "L");
  arrow(X([0, 0]), Y([0, 0]), X(U), Y(U), {w: 2});
  arrow(X([0, 0]), Y([0, 0]), X(V), Y(V), {w: 3.5});
  el("text", {x: X([U[0] / 2, 0]) - 12, y: Y([0, U[1] / 2]) - 4, "font-size": 15, "font-weight": "bold", "text-anchor": "end"}, "u");
  el("text", {x: X(V) + 6, y: Y(V) + 16, "font-size": 15, "font-weight": "bold"}, "v");
  el("line", {x1: X(V), y1: Y(V), x2: X(P), y2: Y(P), stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "8 5"});
  el("line", {x1: X(V), y1: Y(V), x2: X(Q), y2: Y(Q), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 4"});
  el("line", {x1: X(P), y1: Y(P), x2: X(Q), y2: Y(Q), stroke: css("--hl2"), "stroke-width": 4.5, "stroke-dasharray": "2 5"});
  const e1 = [U[0] / Math.sqrt(uu) * 12 / S, U[1] / Math.sqrt(uu) * 12 / S], r = [V[0] - P[0], V[1] - P[1]], rn = nrm(r);
  if (rn > 1e-9) { const e2 = [r[0] / rn * 12 / S, r[1] / rn * 12 / S];
    el("polyline", {points: [[P[0] + e1[0], P[1] + e1[1]], [P[0] + e1[0] + e2[0], P[1] + e1[1] + e2[1]], [P[0] + e2[0], P[1] + e2[1]]].map(q => X(q) + "," + Y(q)).join(" "), fill: "none", stroke: css("--fg")}); }
  el("circle", {cx: X(P), cy: Y(P), r: 6, fill: css("--fg")});
  el("text", {x: X(P) - 10, y: Y(P) - 6, "font-size": 15, "font-weight": "bold", "text-anchor": "end"}, "p");
  el("rect", {x: X(Q) - 6, y: Y(Q) - 6, width: 12, height: 12, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: X(Q) + 10, y: Y(Q) - 6, "font-size": 15, "font-weight": "bold"}, "q");
  // jobb panel: f(t)
  const L2 = 375, R2 = 620, T2 = 20, B2 = 300, f = s => nrm([V[0] - s * U[0], V[1] - s * U[1]]);
  let fm = 0; for (let i = 0; i <= 250; i++) fm = Math.max(fm, f(-0.5 + 2.5 * i / 250)); fm = Math.ceil(fm + 0.5);
  const FX = s => L2 + (R2 - L2) * (s + 0.5) / 2.5, FY = y => B2 - (B2 - T2) * y / fm;
  el("line", {x1: L2, y1: B2, x2: R2, y2: B2, stroke: css("--line")}); el("line", {x1: L2, y1: T2, x2: L2, y2: B2, stroke: css("--line")});
  [-0.5, 0, 0.5, 1, 1.5, 2].forEach(s => el("text", {x: FX(s), y: B2 + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, hu(s, 1)));
  for (let y = 0; y <= fm; y += Math.max(1, Math.round(fm / 6))) el("text", {x: L2 - 5, y: FY(y) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(y));
  el("text", {x: (L2 + R2) / 2, y: B2 + 34, "text-anchor": "middle", "font-size": 12}, "t");
  el("text", {x: (L2 + R2) / 2, y: 14, "text-anchor": "middle", "font-size": 12}, "‖v − t·u‖");
  let path = ""; for (let i = 0; i <= 250; i++) { const s = -0.5 + 2.5 * i / 250; path += (i ? "L" : "M") + FX(s).toFixed(1) + "," + FY(f(s)).toFixed(1); }
  el("path", {d: path, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("line", {x1: FX(t), y1: T2, x2: FX(t), y2: B2, stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "6 4"});
  if (c >= -0.5 && c <= 2) el("circle", {cx: FX(c), cy: FY(f(c)), r: 5, fill: css("--fg")});
  el("rect", {x: FX(t) - 5, y: FY(f(t)) - 5, width: 10, height: 10, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2});
  const dq = f(t), dp = rn, pq = nrm([P[0] - Q[0], P[1] - Q[1]]);
  g("tv").textContent = hu(t, 2);
  g("status").textContent = "t = " + hu(t, 2) + ": ‖v − q‖ = " + hu(dq) + "; ‖v − p‖ = " + hu(dp) + "; ‖p − q‖ = " + hu(pq) + "; " +
    hu(dp, 4) + "² + " + hu(pq, 4) + "² = " + hu(dp * dp + pq * pq, 4) + " = " + hu(dq, 4) + "²" + " (vetület: c = " + hu(c, 4) + ", p = (" + hu(P[0], 4) + "; " + hu(P[1], 4) + "))" + msg2;
}
g("t").addEventListener("input", () => { t = +g("t").value; draw(); });
g("jump").onclick = () => { const c = dot(V, U) / dot(U, U); t = c; g("t").value = Math.max(-0.5, Math.min(2, c)); msg2 = (c < -0.5 || c > 2) ? " – a vetület a csúszka tartományán kívül esik" : ""; draw(); msg2 = ""; };
["u", "vv"].forEach(id => g(id).addEventListener("change", () => { const a = parse(g("u").value), b = parse(g("vv").value);
  if (!a || !b) { g("status").textContent = "hibás bemenet: két számot adj meg vesszővel elválasztva"; return; } U = a; V = b; draw(); }));
g("reset").onclick = () => { g("u").value = "3, 4"; g("vv").value = "5, 2"; U = [3, 4]; V = [5, 2]; t = 0; g("t").value = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
