<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Determináns előjele és tájolás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Mátrix">
<span>M = [[</span><input id="a" type="text" inputmode="decimal" value="2" aria-label="a (1. sor, 1. oszlop)" style="width:3.4em">,
<input id="b" type="text" inputmode="decimal" value="1" aria-label="b (1. sor, 2. oszlop)" style="width:3.4em"><span>], [</span>
<input id="c" type="text" inputmode="decimal" value="0" aria-label="c (2. sor, 1. oszlop)" style="width:3.4em">,
<input id="d" type="text" inputmode="decimal" value="1" aria-label="d (2. sor, 2. oszlop)" style="width:3.4em"><span>]]</span>
<button id="qa">A (det 2)</button><button id="qt">T (det −1)</button><button id="qc">C (det 0)</button>
</div>
<div class="ctl"><label for="t">I → M: t = <b class="v" id="tv">1</b></label><input id="t" type="range" min="0" max="1" step="0.02" value="1" aria-label="Interpoláció az egységmátrixtól a mátrixig"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="Az egységnégyzet (szaggatott) és a képe a mátrixszal; a csúcsok sorszámozva, körívnyíl a körüljárás irányáról; a t csúszka az egységmátrixból a mátrixba vezet át."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">A csúcsok sorrendje a 9.2.5 körüljárása: (0,0) → (1,0) → (1,1) → (0,1). Ha t-t 0-ból 1-be húzod a T mátrixnál, a determináns 0-n keresztül vált előjelet: a négyzet közben egy szakaszra lapul, majd „átfordul”.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


const SQ = [[0,0],[1,0],[1,1],[0,1]];
const num = id => { const v = parseFloat(String(document.getElementById(id).value).replace(",", ".").replace(/−/g, "-").trim()); return isFinite(v) ? v : 0; };
function draw(){
  const t = +document.getElementById("t").value; document.getElementById("tv").textContent = hu(t, 2);
  const M = [[num("a"), num("b")], [num("c"), num("d")]];
  const Mt = [[1 - t + t * M[0][0], t * M[0][1]], [t * M[1][0], 1 - t + t * M[1][1]]];
  const P = SQ.map(p => [Mt[0][0] * p[0] + Mt[0][1] * p[1], Mt[1][0] * p[0] + Mt[1][1] * p[1]]);
  const det = Mt[0][0] * Mt[1][1] - Mt[0][1] * Mt[1][0], detM = M[0][0] * M[1][1] - M[0][1] * M[1][0];
  // nézet: a négyzet és a kép köré
  let xs = P.map(p => p[0]).concat([0, 1]), ys = P.map(p => p[1]).concat([0, 1]);
  let xmin = Math.min(...xs) - 0.6, xmax = Math.max(...xs) + 0.6, ymin = Math.min(...ys) - 0.6, ymax = Math.max(...ys) + 0.6;
  const sc = Math.min(520 / (xmax - xmin), 300 / (ymax - ymin));
  const ox = 280 - (xmin + xmax) / 2 * sc, oy = 170 + (ymin + ymax) / 2 * sc;
  const X = x => ox + x * sc, Y = y => oy - y * sc;
  svg.innerHTML = "";
  for (let g = Math.ceil(xmin); g <= xmax; g++) el("line", {x1: X(g), y1: Y(ymin), x2: X(g), y2: Y(ymax), stroke: css("--grid")});
  for (let g = Math.ceil(ymin); g <= ymax; g++) el("line", {x1: X(xmin), y1: Y(g), x2: X(xmax), y2: Y(g), stroke: css("--grid")});
  el("line", {x1: X(xmin), y1: Y(0), x2: X(xmax), y2: Y(0), stroke: css("--muted")}); el("line", {x1: X(0), y1: Y(ymin), x2: X(0), y2: Y(ymax), stroke: css("--muted")});
  el("polygon", {points: SQ.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: css("--muted"), "stroke-width": 1.5, "stroke-dasharray": "6 4"});
  const eps = 1e-9, kind = Math.abs(det) < eps ? "elfajuló" : det > 0 ? "tájolástartó" : "tájolásfordító";
  el("polygon", {points: P.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: det > eps ? css("--fill1") : det < -eps ? css("--fill2") : "none", stroke: css("--fg"), "stroke-width": Math.abs(det) < eps ? 3.5 : 2});
  P.forEach((p, i) => { el("circle", {cx: X(p[0]), cy: Y(p[1]), r: 4, fill: css("--fg")}); txt(X(p[0]) + 11, Y(p[1]) - 7, String(i + 1), {fs: 14, bold: true}); });
  if (Math.abs(det) > eps) {
    const c = [P.reduce((s, p) => s + p[0], 0) / 4, P.reduce((s, p) => s + p[1], 0) / 4], r = 20, sg = Math.sign(det);
    // képernyőn az y lefelé nő: pozitív (matematikai) irány = óramutatóval ellentétes
    const a0 = 0.3, a1 = 0.3 + sg * 1.6 * Math.PI, pt = a => [X(c[0]) + r * Math.cos(a), Y(c[1]) - r * Math.sin(a)];
    let d = ""; for (let i = 0; i <= 30; i++) { const q = pt(a0 + (a1 - a0) * i / 30); d += (i ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1); }
    el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 1.6});
    const e1 = pt(a1 - sg * 0.25), e2 = pt(a1); vec(e1[0], e1[1], e2[0], e2[1], {w: 1.6, head: 9});
  }
  let st = `det = ${hu(det, 3)}, ${kind}`;
  if (t < 1) st += ` (t = ${hu(t, 2)}; a teljes mátrix determinánsa ${hu(detM, 3)})`;
  st += `; terület = |det| = ${hu(Math.abs(det), 3)}; körüljárás 1→2→3→4: ` + (Math.abs(det) < eps ? "nincs (a kép szakasz vagy pont)" : det > 0 ? "óramutatóval ellentétes" : "óramutatóval megegyező");
  document.getElementById("status").textContent = st;
}
const setM = (a, b, c, d) => { [["a", a], ["b", b], ["c", c], ["d", d]].forEach(([k, v]) => document.getElementById(k).value = String(v).replace("-", "−")); document.getElementById("t").value = 1; draw(); };
["a", "b", "c", "d", "t"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("qa").onclick = () => setM(2, 1, 0, 1);
document.getElementById("qt").onclick = () => setM(1, 0, 0, -1);
document.getElementById("qc").onclick = () => setM(1, 2, 2, 4);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
