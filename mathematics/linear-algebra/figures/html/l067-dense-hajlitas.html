<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dense réteg: forgat, nyújt, eltol, hajlít</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#999;--sq:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#777;--sq:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number]{width:4.4em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:1 1 380px;max-width:520px;width:100%;height:auto;display:block;cursor:crosshair}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
fieldset{border:1px solid var(--muted);padding:4px 8px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás">
  <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
  <span id="stage" class="small"></span>
</div>
<div class="ctl">
  <fieldset><legend class="small">W</legend>
    <input id="w11" type="number" step="0.1" value="1" aria-label="W 1,1"> <input id="w12" type="number" step="0.1" value="-1" aria-label="W 1,2"><br>
    <input id="w21" type="number" step="0.1" value="1" aria-label="W 2,1"> <input id="w22" type="number" step="0.1" value="1" aria-label="W 2,2"></fieldset>
  <fieldset><legend class="small">b</legend>
    <input id="b1" type="number" step="0.1" value="-1" aria-label="b 1"><br><input id="b2" type="number" step="0.1" value="0" aria-label="b 2"></fieldset>
  <fieldset><legend class="small">kattintás áthelyezi</legend>
    <label><input type="radio" name="sel" value="p"> p</label> <label><input type="radio" name="sel" value="q" checked> q</label></fieldset>
  <button id="reset">Alapérték</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap"><svg id="v" viewBox="0 0 400 400" role="img" aria-label="A rács képe a réteg egyes lépései után"></svg></div>
<p class="small">Kattintás a rajzra: a kiválasztott pont új BEMENETI helye (a nézet az 1. lépésre ugrik). A 4. lépésben az üres kör a tengelyre vagy
az origóba lapított pont, a szaggatott vonal a negatív részből érkező rácsvonal. Szemléltető 2×2-es réteg, nem a kidolgozott példa súlyai.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = v => { const t = (Math.round(v * 1000) / 1000).toString().replace(".", ",").replace("-", "−"); return t === "−0" ? "0" : t; };
const NAMES = ["1. bemenet x", "2. lineáris rész Wx", "3. eltolás Wx + b", "4. ReLU(Wx + b)"];
let T = 0, anim = null, playing = false, pts = {p: [1, 0], q: [0, -1]};
function num(id){ const v = parseFloat(document.getElementById(id).value); return isFinite(v) ? v : 0; }
function st(x){ const W = [[num("w11"), num("w12")], [num("w21"), num("w22")]], b = [num("b1"), num("b2")];
  const a = [W[0][0] * x[0] + W[0][1] * x[1], W[1][0] * x[0] + W[1][1] * x[1]], h = [a[0] + b[0], a[1] + b[1]];
  return [x, a, h, [Math.max(0, h[0]), Math.max(0, h[1])]]; }
function at(x, t){ const S = st(x), i = Math.min(2, Math.floor(t)), u = t - i; return [S[i][0] + (S[i + 1][0] - S[i][0]) * u, S[i][1] + (S[i + 1][1] - S[i][1]) * u]; }
const R = 5.3, X = v => 200 + v * 200 / R * 0.95, Y = v => 200 - v * 200 / R * 0.95;
function draw(){
  svg.innerHTML = "";
  for (let g = -4; g <= 4; g += 1) { el("text", {x: X(g), y: 396, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(g).replace("-", "−")); if (g) el("text", {x: 4, y: Y(g) + 4, "font-size": 10, fill: css("--muted")}, String(g).replace("-", "−")); }
  el("line", {x1: 0, y1: Y(0), x2: 400, y2: Y(0), stroke: css("--grid"), "stroke-width": 1}); el("line", {x1: X(0), y1: 0, x2: X(0), y2: 400, stroke: css("--grid"), "stroke-width": 1});
  const last = T > 2;
  // rácsvonalak
  for (let c = -2; c <= 2.0001; c += 0.5) for (const dir of [0, 1]) {
    let seg = "", segN = "";
    for (let i = 0; i <= 80; i++) { const s = -2 + i * 0.05, x = dir ? [c, s] : [s, c];
      const neg = st(x)[2].some(v => v < 0) && last, P = at(x, T), cmd = X(P[0]).toFixed(1) + "," + Y(P[1]).toFixed(1);
      if (neg) { segN += (segN && !segN.endsWith("|") ? "L" : "M") + cmd; seg += "|"; } else { seg += (seg && !seg.endsWith("|") ? "L" : "M") + cmd; segN += "|"; } }
    el("path", {d: seg.replace(/\|/g, ""), fill: "none", stroke: css("--grid"), "stroke-width": 0.7});
    if (last) el("path", {d: segN.replace(/\|/g, ""), fill: "none", stroke: css("--fg"), "stroke-width": 2.2, "stroke-dasharray": "5 3"}); }
  // egységnégyzet
  let d = ""; [[0, 0], [1, 0], [1, 1], [0, 1]].forEach((c, i) => { for (let j = 0; j < 20; j++) { const u = j / 20, n = [[1, 0], [1, 1], [0, 1], [0, 0]][i];
    const P = at([c[0] + (n[0] - c[0]) * u, c[1] + (n[1] - c[1]) * u], T); d += (d ? "L" : "M") + X(P[0]).toFixed(1) + "," + Y(P[1]).toFixed(1); } });
  el("path", {d: d + "Z", fill: css("--sq"), "fill-opacity": 0.7, stroke: css("--fg"), "stroke-width": 2});
  // rácspontok
  for (let a = -2; a <= 2.0001; a += 0.5) for (let c = -2; c <= 2.0001; c += 0.5) { const x = [a, c], P = at(x, T), fl = last && st(x)[2].some(v => v < 0);
    el("circle", {cx: X(P[0]), cy: Y(P[1]), r: fl ? 3.6 : 2.3, fill: fl ? css("--bg") : css("--fg"), stroke: css("--fg"), "stroke-width": 1}); }
  // tesztpontok
  for (const [n, sh] of [["p", "s"], ["q", "t"]]) { const P = at(pts[n], T), x = X(P[0]), y = Y(P[1]);
    if (sh === "s") el("rect", {x: x - 7, y: y - 7, width: 14, height: 14, fill: css("--hl2"), stroke: css("--fg"), "stroke-width": 1.5});
    else el("path", {d: `M${x},${y - 9}L${x + 8},${y + 6}L${x - 8},${y + 6}Z`, fill: css("--hl"), stroke: css("--fg"), "stroke-width": 1.5});
    el("text", {x: x + 10, y: y - 8, "font-size": 15, "font-weight": "bold"}, n); }
  const i = Math.round(T);
  document.getElementById("stage").textContent = Math.abs(T - i) < 1e-9 ? NAMES[i] : "átmenet…";
  const sel = document.querySelector("input[name=sel]:checked").value, S = st(pts[sel]);
  const shown = Math.abs(T - i) < 1e-9 ? i : Math.floor(T);
  document.getElementById("status").textContent = `${sel}: ` + S.slice(0, shown + 1).map(v => `(${f(v[0])}, ${f(v[1])})`).join(" → ")
    + (shown < 3 ? "  …" : "") + `   [${NAMES[shown]}]`;
}
function animTo(target){
  if (anim) cancelAnimationFrame(anim);
  const t0 = performance.now(), from = T, dur = 700 * Math.abs(target - from) + 1;
  const step = now => { const u = Math.min(1, (now - t0) / dur); T = from + (target - from) * u; draw();
    if (u < 1) anim = requestAnimationFrame(step); else { anim = null; T = target; draw(); if (playing) { if (T < 3) animTo(T + 1); else stopPlay(); } } };
  anim = requestAnimationFrame(step);
  setTimeout(() => { if (anim && T !== target && !playing) { cancelAnimationFrame(anim); anim = null; T = target; draw(); } }, dur + 300);
}
function stopPlay(){ playing = false; document.getElementById("play").textContent = "▶ Lejátszás"; }
function go(i){ stopPlay(); animTo(Math.max(0, Math.min(3, i))); }
document.getElementById("first").onclick = () => { stopPlay(); if (anim) cancelAnimationFrame(anim); anim = null; T = 0; draw(); };
document.getElementById("prev").onclick = () => go(Math.ceil(T - 1e-9) - 1);
document.getElementById("next").onclick = () => go(Math.floor(T + 1e-9) + 1);
document.getElementById("play").onclick = () => { if (playing) { stopPlay(); return; } playing = true; document.getElementById("play").textContent = "⏸ Szünet";
  if (T >= 3) { T = 0; draw(); } animTo(Math.floor(T + 1e-9) + 1); };
document.querySelectorAll("input").forEach(i => i.addEventListener("input", draw));
document.getElementById("reset").onclick = () => { [["w11", 1], ["w12", -1], ["w21", 1], ["w22", 1], ["b1", -1], ["b2", 0]].forEach(([k, v]) => document.getElementById(k).value = v); pts = {p: [1, 0], q: [0, -1]}; draw(); };
svg.addEventListener("click", e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const c = pt.matrixTransform(svg.getScreenCTM().inverse());
  const sel = document.querySelector("input[name=sel]:checked").value;
  pts[sel] = [Math.round((c.x - 200) / (200 / R * 0.95) * 10) / 10, Math.round((200 - c.y) / (200 / R * 0.95) * 10) / 10];
  stopPlay(); if (anim) cancelAnimationFrame(anim); anim = null; T = 0; draw(); });
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("prev").click(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
