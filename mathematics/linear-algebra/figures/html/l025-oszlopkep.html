<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorkép és oszlopkép</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Súlyok">
<label for="sx">x = <b class="v" id="vx">0</b></label><input id="sx" type="range" min="-3" max="3" step="0.5" value="0" aria-label="Az a1 oszlop súlya (x)">
<label for="sy">y = <b class="v" id="vy">0</b></label><input id="sy" type="range" min="-3" max="3" step="0.5" value="0" aria-label="Az a2 oszlop súlya (y)">
<button id="sol">x = 1, y = 2</button><button id="zero">Nulla</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Bal oldalon a 2x − y = 0 és x + y = 3 egyenes a mozgatható (x, y) ponttal, jobb oldalon az x·a1 + y·a2 nyílösszeg és a b = (0, 3) célpont."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Számított: a1 = (2, 1), a2 = (−1, 1), b = (0, 3) = 1·a1 + 2·a2. A két panel ugyanazt az (x, y) súlypárt mutatja.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


const A1 = [2, 1], A2 = [-1, 1], B = [0, 3];
// bal panel: sorkép (x, y síkja), jobb panel: oszlopkép (a komponensek síkja)
const PL = {x0: 10, y0: 30, w: 260, h: 280, xmin: -3.5, xmax: 3.5, ymin: -3.5, ymax: 4.5};
const PR = {x0: 290, y0: 30, w: 260, h: 280, xmin: -4.5, xmax: 4.5, ymin: -4.5, ymax: 5.5};
function mk(P){ const s = Math.min(P.w / (P.xmax - P.xmin), P.h / (P.ymax - P.ymin));
  return {X: x => P.x0 + (x - P.xmin) * s, Y: y => P.y0 + P.h - (y - P.ymin) * s, s: s}; }
function axes(P, M, lx, ly){
  for (let g = Math.ceil(P.xmin); g <= P.xmax; g++) el("line", {x1: M.X(g), y1: M.Y(P.ymin), x2: M.X(g), y2: M.Y(P.ymax), stroke: css("--grid")});
  for (let g = Math.ceil(P.ymin); g <= P.ymax; g++) el("line", {x1: M.X(P.xmin), y1: M.Y(g), x2: M.X(P.xmax), y2: M.Y(g), stroke: css("--grid")});
  el("line", {x1: M.X(P.xmin), y1: M.Y(0), x2: M.X(P.xmax), y2: M.Y(0), stroke: css("--line")});
  el("line", {x1: M.X(0), y1: M.Y(P.ymin), x2: M.X(0), y2: M.Y(P.ymax), stroke: css("--line")});
  txt(M.X(P.xmax) - 4, M.Y(0) - 5, lx, {anchor: "end", fs: 12}); txt(M.X(0) + 5, M.Y(P.ymax) + 12, ly, {anchor: "start", fs: 12});
}
function draw(){
  const x = +document.getElementById("sx").value, y = +document.getElementById("sy").value;
  document.getElementById("vx").textContent = hu(x, 1); document.getElementById("vy").textContent = hu(y, 1);
  svg.innerHTML = "";
  txt(140, 18, "Sorkép: két egyenes metszete", {bold: true});
  txt(420, 18, "Oszlopkép: x·a1 + y·a2", {bold: true});
  // sorkép
  let M = mk(PL); axes(PL, M, "x", "y");
  el("clipPath", {id: "cl"}); svg.lastChild.appendChild(document.createElementNS(NS, "rect"));
  const g = el("g", {"clip-path": "url(#cl)"}); const r = svg.querySelector("#cl rect");
  r.setAttribute("x", M.X(PL.xmin)); r.setAttribute("y", M.Y(PL.ymax)); r.setAttribute("width", M.X(PL.xmax) - M.X(PL.xmin)); r.setAttribute("height", M.Y(PL.ymin) - M.Y(PL.ymax));
  el("line", {x1: M.X(-1.75), y1: M.Y(-3.5), x2: M.X(2.25), y2: M.Y(4.5), stroke: css("--hl"), "stroke-width": 2}, undefined, g);
  el("line", {x1: M.X(-1.5), y1: M.Y(4.5), x2: M.X(3.5), y2: M.Y(-0.5), stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "7 4"}, undefined, g);
  txt(M.X(0.15), M.Y(-2.9), "2x − y = 0", {anchor: "start", fs: 12, color: css("--hl")});
  txt(M.X(2.1), M.Y(1.35), "x + y = 3", {anchor: "start", fs: 12, color: css("--hl2")});
  const hit = Math.abs(x - 1) < 1e-9 && Math.abs(y - 2) < 1e-9;
  el("circle", {cx: M.X(x), cy: M.Y(y), r: hit ? 7 : 5.5, fill: hit ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  txt(M.X(x) + 9, M.Y(y) + 16, `(${hu(x,1)}, ${hu(y,1)})`, {anchor: "start", fs: 12});
  // oszlopkép
  M = mk(PR); axes(PR, M, "1.", "2.");
  const p1 = [x * A1[0], x * A1[1]], s = [p1[0] + y * A2[0], p1[1] + y * A2[1]];
  vec(M.X(0), M.Y(0), M.X(A1[0]), M.Y(A1[1]), {color: css("--muted"), w: 1.5, head: 8});
  vec(M.X(0), M.Y(0), M.X(A2[0]), M.Y(A2[1]), {color: css("--muted"), w: 1.5, head: 8});
  txt(M.X(A1[0]) + 4, M.Y(A1[1]) + 14, "a1", {anchor: "start", fs: 12, color: css("--muted")});
  txt(M.X(A2[0]) - 4, M.Y(A2[1]) - 4, "a2", {anchor: "end", fs: 12, color: css("--muted")});
  el("circle", {cx: M.X(B[0]), cy: M.Y(B[1]), r: 5, fill: "none", stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": "2 2"});
  txt(M.X(B[0]) - 8, M.Y(B[1]) + 4, "b = (0, 3)", {anchor: "end", fs: 12});
  if (x !== 0) vec(M.X(0), M.Y(0), M.X(p1[0]), M.Y(p1[1]), {color: css("--hl"), w: 2.2});
  if (y !== 0) vec(M.X(p1[0]), M.Y(p1[1]), M.X(s[0]), M.Y(s[1]), {color: css("--hl2"), w: 2.2, dash: "6 4"});
  if (x !== 0 || y !== 0) vec(M.X(0), M.Y(0), M.X(s[0]), M.Y(s[1]), {color: css("--fg"), w: hit ? 3.5 : 1.6, dash: hit ? "" : "2 3"});
  const st = `${hu(x,1)}·(2,1)+${hu(y,1)}·(−1,1)=(${hu(s[0],1)},${hu(s[1],1)})`.replace(/\+−/g, "−");
  document.getElementById("status").textContent = hit ? st + "=b – ez a megoldás; a sorképen a pont a két egyenes (1,2) metszéspontja."
    : st + (s[0] === 0 && s[1] === 3 ? "=b" : " ≠ b = (0,3)");
}
["sx", "sy"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("sol").onclick = () => { document.getElementById("sx").value = 1; document.getElementById("sy").value = 2; draw(); };
document.getElementById("zero").onclick = () => { document.getElementById("sx").value = 0; document.getElementById("sy").value = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
