<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sajátirány keresése körbejárással</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="th">θ =</label><input id="th" type="range" min="0" max="360" step="0.1" value="20" aria-label="A v vektor szöge fokban">
<b id="thv"></b><button id="play">▶ Körbeforgatás</button>
<span role="group" aria-label="Mátrix"><button id="mD" aria-pressed="false">D</button><button id="mA" aria-pressed="true">A</button><button id="mS" aria-pressed="false">saját</button></span>
<span id="own" hidden>[[<input id="m00" type="number" step="0.1" value="1" aria-label="a11">, <input id="m01" type="number" step="0.1" value="2" aria-label="a12">], [<input id="m10" type="number" step="0.1" value="2" aria-label="a21">, <input id="m11" type="number" step="0.1" value="1" aria-label="a22">]]</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Egységkör, rajta egy forgatható v vektor és a mátrix általi képe, Av; a sajátirányokban a két nyíl egy egyenesen fekszik." style=""></svg>

</div>
<p class="small">Folytonos: v = (cos θ, sin θ); szaggatott: Av. A sajátirány közelében (±0,5°) a nyilak kiemelődnek. Az A = [[0, 1], [2, 1]] sajátirányai θ ≈ 63,43° ((1, 2), λ = 2) és θ = 315° ((1, −1), λ = −1). Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v");
const MATS = {D: [[2, 0], [0, 0.5]], A: [[0, 1], [2, 1]]};
let mname = "A", timer = null;
function mat(){ if (mname !== "S") return MATS[mname]; return [[+m00.value, +m01.value], [+m10.value, +m11.value]]; }
function eigs(M){ // valós sajátértékek és irányszögek (fok, mod 180)
  const a = M[0][0], b = M[0][1], c = M[1][0], d = M[1][1], tr = a + d, det = a * d - b * c, disc = tr * tr / 4 - det;
  if (disc < -1e-12) return [];
  const s = Math.sqrt(Math.max(disc, 0)), ls = s < 1e-12 ? [tr / 2] : [tr / 2 + s, tr / 2 - s], out = [];
  ls.forEach(l => {
    let v = [b, l - a];
    if (Math.hypot(v[0], v[1]) < 1e-12) v = [l - d, c];
    if (Math.hypot(v[0], v[1]) < 1e-12) { out.push({l, th: 0}); out.push({l, th: 90}); return; } // skalárszoros: minden irány
    out.push({l, th: ((Math.atan2(v[1], v[0]) * 180 / Math.PI) % 180 + 180) % 180});
  });
  return out;
}
const C = 280, Sc = 70;
const P = (x, y) => [C + Sc * x, 200 - Sc * y];
function draw(){
  const th = +document.getElementById("th").value, M = mat(), r = th * Math.PI / 180, v = [Math.cos(r), Math.sin(r)];
  const Av = [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]], nA = Math.hypot(Av[0], Av[1]);
  document.getElementById("thv").textContent = huf(th, 1) + "°";
  svg.innerHTML = "";
  for (let g = -3; g <= 3; g++) { mk(svg, "line", {x1: P(g, -2.7)[0], y1: P(g, -2.7)[1], x2: P(g, 2.7)[0], y2: P(g, 2.7)[1], stroke: cssv("--grid")}); mk(svg, "line", {x1: P(-3.9, g)[0], y1: P(-3.9, g)[1], x2: P(3.9, g)[0], y2: P(3.9, g)[1], stroke: cssv("--grid")}); }
  mk(svg, "circle", {cx: C, cy: 200, r: Sc, fill: "none", stroke: cssv("--muted")});
  const E = eigs(M); let hit = null;
  E.forEach(e => { const q = e.th * Math.PI / 180, a = P(-3.9 * Math.cos(q), -3.9 * Math.sin(q)), b = P(3.9 * Math.cos(q), 3.9 * Math.sin(q));
    mk(svg, "line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: cssv("--muted"), "stroke-dasharray": "2 4", "stroke-width": 1.5});
    const dd = Math.abs(((th - e.th) % 180 + 180) % 180); if (Math.min(dd, 180 - dd) <= 0.5 && !hit) hit = e; });
  const w = hit ? 4 : 2.2, p0 = P(0, 0), pv = P(v[0], v[1]), pA = P(Av[0], Av[1]);
  if (hit) mk(svg, "circle", {cx: pv[0], cy: pv[1], r: 9, fill: "none", stroke: cssv("--hl"), "stroke-width": 2});
  arrow2(svg, p0[0], p0[1], pA[0], pA[1], cssv("--hl2"), w, "8 4");
  arrow2(svg, p0[0], p0[1], pv[0], pv[1], cssv("--hl"), w, "");
  mk(svg, "text", {x: pv[0] + 8, y: pv[1] - 6, "font-size": 14, fill: cssv("--hl")}, "v");
  mk(svg, "text", {x: pA[0] + 8, y: pA[1] + 14, "font-size": 14, fill: cssv("--hl2")}, "Av");
  const MM = M.map(row => "[" + row.map(t => hu(t, 3)).join("; ") + "]").join(", ");
  mk(svg, "text", {x: 10, y: 22, "font-size": 13}, (mname === "S" ? "saját" : mname) + " = [" + MM + "]");
  mk(svg, "text", {x: 10, y: 392, "font-size": 11, fill: cssv("--muted")}, E.length ? "pontozott: sajátirányok" : "nincs valós sajátirány (pl. forgatás)");
  let st;
  if (hit) { st = `θ = ${huf(th, 1)}°: Av = ${huf(hit.l, 3)}·v → sajátvektor, λ = ${hu(hit.l, 3)}` + (hit.l < 0 ? " (a kép ellentétes irányú)" : ""); }
  else if (nA < 1e-12) st = `θ = ${huf(th, 1)}°: Av = 0 → sajátvektor, λ = 0`;
  else { const cs = (v[0] * Av[0] + v[1] * Av[1]) / nA, ang = Math.acos(Math.max(-1, Math.min(1, cs))) * 180 / Math.PI;
    st = `θ = ${huf(th, 1)}°: nem sajátvektor; Av és v szöge: ${huf(ang, 1)}°`; }
  document.getElementById("status").textContent = st;
}
function setM(n){ mname = n; ["D", "A", "S"].forEach(k => document.getElementById("m" + k).setAttribute("aria-pressed", k === n)); document.getElementById("own").hidden = n !== "S"; draw(); }
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Körbeforgatás"; }
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  const s = document.getElementById("th"); let left = 360;
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const t = (+s.value + 1) % 360; s.value = t; left -= 1; draw(); if (left <= 0) stop(); }, 40);
};
document.getElementById("th").addEventListener("input", () => { stop(); draw(); });
["D", "A", "S"].forEach(k => document.getElementById("m" + k).onclick = () => setM(k));
["m00", "m01", "m10", "m11"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
