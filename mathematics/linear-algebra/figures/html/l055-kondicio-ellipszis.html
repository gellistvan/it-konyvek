<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kondíciószám: egységkör, ellipszis, hibaerősítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A mátrix">
  <label for="e">ε =</label><input id="e" type="range" min="-3" max="0" step="0.01" value="-2" aria-label="ε logaritmikus skálán 0,001 és 1 között"><b id="ev"></b>
  <span class="small">A = [[1, 1], [1, 1 + ε]]</span>
</div>
<div class="ctl" role="group" aria-label="A perturbáció">
  <label for="phi">δb iránya</label><input id="phi" type="range" min="0" max="360" step="0.1" value="90" aria-label="A δb perturbáció iránya fokban"><b id="pv"></b>
  <button id="bu2">δb ∥ u₂</button><button id="b90">δb = (0, ε)</button>
  <label>x: <select id="xs"><option value="e1">x = (1, 0) (kidolgozott példa)</option><option value="v1">x ∥ v₁ (legrosszabb eset)</option></select></label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 365" role="img" aria-label="Az egységkör képe az [[1,1],[1,1+ε]] mátrix alatt: majdnem szakasszá lapuló ellipszis, a δb perturbáció iránya és az x megoldás"></svg>
<p class="small">Az ε-csúszka logaritmikus (0,001…1). δb hossza ε, iránya a szögcsúszkával állítható; b = A x. Az erősítés (‖δx‖/‖x‖)/(‖δb‖/‖b‖) legfeljebb κ₂; x ∥ v₁ és δb ∥ u₂ esetén pontosan κ₂. Számított értékek a definícióból; modell, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const S = 78, OX = 280, OY = 180;
function svd(A){ const B = [[A[0][0]*A[0][0] + A[1][0]*A[1][0], A[0][0]*A[0][1] + A[1][0]*A[1][1]], [0, A[0][1]*A[0][1] + A[1][1]*A[1][1]]];
  const m = (B[0][0] + B[1][1])/2, r = Math.hypot((B[0][0] - B[1][1])/2, B[0][1]);
  const s1 = Math.sqrt(m + r), s2 = Math.sqrt(Math.max(0, m - r));
  let v1 = Math.abs(B[0][1]) > 1e-15 ? [B[0][1], m + r - B[0][0]] : [1, 0]; const n = Math.hypot(...v1); v1 = [v1[0]/n, v1[1]/n];
  if (v1[0] < 0) v1 = [-v1[0], -v1[1]];
  const v2 = [-v1[1], v1[0]], ap = (v) => [A[0][0]*v[0] + A[0][1]*v[1], A[1][0]*v[0] + A[1][1]*v[1]];
  const u1 = ap(v1).map(z => z/s1); let u2 = [-u1[1], u1[0]];
  return {s1, s2, v1, v2, u1, u2}; }
function arrow(p, q, attrs, head){ const a = [OX + p[0]*S, OY - p[1]*S], b = [OX + q[0]*S, OY - q[1]*S];
  el("line", Object.assign({x1: a[0], y1: a[1], x2: b[0], y2: b[1]}, attrs));
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), h = 9; el("polygon", {points: [b, [b[0] - h*Math.cos(ang - 0.4), b[1] - h*Math.sin(ang - 0.4)], [b[0] - h*Math.cos(ang + 0.4), b[1] - h*Math.sin(ang + 0.4)]].map(z => z.join(",")).join(" "), fill: head}); }
function draw(){
  const eps = Math.pow(10, +$("e").value), phi = +$("phi").value * Math.PI/180;
  $("ev").textContent = eps < 0.01 ? fmt(eps, 4) : fmt(eps, 3); $("pv").textContent = fmt(+$("phi").value, 1) + "°";
  const A = [[1, 1], [1, 1 + eps]], d = svd(A), det = 1 + eps - 1;
  const x = $("xs").value === "e1" ? [1, 0] : d.v1;
  const b = [A[0][0]*x[0] + A[0][1]*x[1], A[1][0]*x[0] + A[1][1]*x[1]];
  const db = [eps*Math.cos(phi), eps*Math.sin(phi)];
  const dx = [(A[1][1]*db[0] - A[0][1]*db[1])/det, (-A[1][0]*db[0] + A[0][0]*db[1])/det];
  const nb = Math.hypot(...b), ndb = Math.hypot(...db), nx = Math.hypot(...x), ndx = Math.hypot(...dx);
  const amp = (ndx/nx)/(ndb/nb), kap = d.s1/d.s2;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  el("line", {x1: 0, y1: OY, x2: 560, y2: OY, stroke: css("--grid")}); el("line", {x1: OX, y1: 0, x2: OX, y2: 360, stroke: css("--grid")});
  [-2, -1, 1, 2].forEach(v => { el("text", {x: OX + v*S, y: OY + 14, "font-size": 10, "text-anchor": "middle", fill: mu}, String(v).replace("-", "−")); el("text", {x: OX - 5, y: OY - v*S + 4, "font-size": 10, "text-anchor": "end", fill: mu}, String(v).replace("-", "−")); });
  const c0 = [], c1 = [];
  for (let i = 0; i <= 180; i++) { const a = 2*Math.PI*i/180, u = [Math.cos(a), Math.sin(a)];
    c0.push((OX + u[0]*S) + "," + (OY - u[1]*S)); c1.push((OX + (A[0][0]*u[0] + A[0][1]*u[1])*S) + "," + (OY - (A[1][0]*u[0] + A[1][1]*u[1])*S)); }
  el("polyline", {points: c0.join(" "), fill: "none", stroke: mu, "stroke-dasharray": "6 4", "stroke-width": 1.4});
  el("polygon", {points: c1.join(" "), fill: css("--fill"), "fill-opacity": 0.6, stroke: fg, "stroke-width": 2});
  arrow([0, 0], [d.s1*d.u1[0], d.s1*d.u1[1]], {stroke: fg, "stroke-width": 2}, fg);
  arrow([0, 0], [d.u2[0]*0.9, d.u2[1]*0.9], {stroke: mu, "stroke-dasharray": "2 3", "stroke-width": 1.4}, mu);
  el("text", {x: OX + d.u2[0]*0.95*S - 30, y: OY - d.u2[1]*0.95*S - 6, "font-size": 12, fill: mu}, "u₂ irány");
  el("text", {x: OX + d.s1*d.u1[0]*S + 6, y: OY - d.s1*d.u1[1]*S, "font-size": 12}, "σ₁u₁");
  // δb iránya és x
  arrow([0, 0], [Math.cos(phi)*0.7, Math.sin(phi)*0.7], {stroke: css("--hl2"), "stroke-width": 2.2, "stroke-dasharray": "2 3"}, css("--hl2"));
  el("text", {x: OX + Math.cos(phi)*0.75*S + 4, y: OY - Math.sin(phi)*0.75*S - 4, "font-size": 12, fill: css("--hl2")}, "δb iránya");
  arrow([0, 0], x, {stroke: css("--hl"), "stroke-width": 2.4}, css("--hl"));
  el("text", {x: OX + x[0]*S + 6, y: OY - x[1]*S + 16, "font-size": 12, fill: css("--hl")}, "x");
  el("text", {x: 10, y: 20, "font-size": 12}, "szaggatott: egységkör; folytonos: az egységkör képe A alatt");
  el("text", {x: 10, y: 358, "font-size": 12}, "σ₂ = " + fmt(d.s2, 4) + " – a kis tengely " + (d.s2*S < 2 ? "a rajzon szinte nem látszik" : "a rajzon látható"));
  $("status").textContent = "σ₁=" + fmt(d.s1, 4) + ", σ₂=" + fmt(d.s2, 4) + ", κ₂=" + fmt(kap, 4) + " | x=(" + fmt(x[0], 4) + "; " + fmt(x[1], 4) + "), δb=(" + fmt(db[0], 4) + "; " + fmt(db[1], 4) +
    "), δx=(" + fmt(dx[0], 4) + "; " + fmt(dx[1], 4) + ") | relatív hibák: ‖δb‖/‖b‖=" + fmt(ndb/nb, 5) + ", ‖δx‖/‖x‖=" + fmt(ndx/nx, 4) + ", erősítés ≈" + fmt(amp, 1) + " (≤ κ₂)";
  return d;
}
$("e").addEventListener("input", draw); $("phi").addEventListener("input", draw); $("xs").addEventListener("change", draw);
$("bu2").onclick = () => { const d = draw(); let a = Math.atan2(d.u2[1], d.u2[0])*180/Math.PI; if (a < 0) a += 360; $("phi").value = a; draw(); };
$("b90").onclick = () => { $("phi").value = 90; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
