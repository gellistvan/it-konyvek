<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eltolt altér</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméter">
<label for="t">t = <b class="v" id="tv">0</b></label><input id="t" type="range" min="-3" max="3" step="0.1" value="0" aria-label="A t paraméter: x = x_p + t·v">
<button id="tm2">t = 2 (legrövidebb)</button><button id="t0">t = 0</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 520 345" role="img" aria-label="Két párhuzamos egyenes: x+2y=0 az origón át és x+2y=5; a t csúszkával az x_p + t·v pont mozog a megoldásegyenesen; az (1,2) pont a legközelebbi az origóhoz."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Számított: x_p = (5, 0), v = (−2, 1); a minimális normájú megoldás (1, 2) = x_p + 2v, normája √5 ≈ 2,236.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


const XP = [5, 0], VV = [-2, 1];
const sc = 52, ox = 3.4 * sc, oy = 4.3 * sc, X = x => ox + x * sc, Y = y => oy - y * sc;
function draw(){
  const t = Math.round(+document.getElementById("t").value * 10) / 10; document.getElementById("tv").textContent = hu(t, 1);
  const p = [XP[0] + t * VV[0], XP[1] + t * VV[1]], nrm = Math.hypot(p[0], p[1]), best = Math.abs(t - 2) < 1e-9;
  svg.innerHTML = "";
  for (let g = -3; g <= 6; g++) el("line", {x1: X(g), y1: Y(-2.3), x2: X(g), y2: Y(4.2), stroke: css("--grid")});
  for (let g = -2; g <= 4; g++) el("line", {x1: X(-3.3), y1: Y(g), x2: X(6.6), y2: Y(g), stroke: css("--grid")});
  el("line", {x1: X(-3.3), y1: Y(0), x2: X(6.6), y2: Y(0), stroke: css("--muted")}); el("line", {x1: X(0), y1: Y(-2.3), x2: X(0), y2: Y(4.2), stroke: css("--muted")});
  [-2, 2, 4, 6].forEach(g => txt(X(g), Y(0) + 15, hu(g, 0), {fs: 11, color: css("--muted")})); [-2, 2, 4].forEach(g => txt(X(0) - 6, Y(g) + 4, hu(g, 0), {fs: 11, anchor: "end", color: css("--muted")}));
  el("line", {x1: X(-3.3), y1: Y(1.65), x2: X(6.6), y2: Y(-3.3), stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "2 4"});
  el("line", {x1: X(-3.3), y1: Y(4.15), x2: X(6.6), y2: Y(-0.8), stroke: css("--fg"), "stroke-width": 2.5});
  txt(X(-3.1), Y(1.95), "N(A): x + 2y = 0", {anchor: "start", fs: 13}); txt(X(4.2), Y(1.3), "x + 2y = 5", {anchor: "start", fs: 13, bold: true});
  vec(X(0), Y(0), X(5), Y(0), {color: css("--hl"), w: 2.2}); txt(X(2.5), Y(0) - 7, "x_p", {fs: 13, color: css("--hl")});
  vec(X(0), Y(0), X(-2), Y(1), {color: css("--hl2"), dash: "6 4"}); txt(X(-1.2), Y(0.95), "v", {fs: 13, color: css("--hl2")});
  if (Math.abs(t) > 1e-9) vec(X(5), Y(0), X(p[0]), Y(p[1]), {color: css("--hl2"), dash: "6 4", w: 2.2});
  txt(X((5 + p[0]) / 2) + 8, Y(p[1] / 2) + 18, Math.abs(t) > 1e-9 ? `${hu(t, 1)}·v` : "", {fs: 13, color: css("--hl2"), anchor: "start"});
  // minimális normájú pont
  el("line", {x1: X(0), y1: Y(0), x2: X(1), y2: Y(2), stroke: css("--muted"), "stroke-width": 1.3});
  el("circle", {cx: X(1), cy: Y(2), r: best ? 9 : 5, fill: best ? css("--hl3") : css("--fg"), stroke: css("--fg"), "stroke-width": 1.5});
  txt(X(1) + 10, Y(2) - 10, "x_min = (1, 2)", {anchor: "start", fs: 12});
  el("circle", {cx: X(3), cy: Y(1), r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5}); txt(X(3) + 8, Y(1) - 8, "(3, 1)", {anchor: "start", fs: 12});
  el("line", {x1: X(0), y1: Y(0), x2: X(p[0]), y2: Y(p[1]), stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "3 3"});
  el("circle", {cx: X(p[0]), cy: Y(p[1]), r: 7, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  document.getElementById("status").textContent = `(${hu(p[0], 2)}, ${hu(p[1], 2)}); x+2y=${hu(p[0] + 2 * p[1], 2)}; ‖x‖≈${hu(nrm, 3)}` +
    (best ? " – ez a minimális normájú megoldás: merőleges a nulltérre (x·v = 0)." : ` (a legkisebb norma √5 ≈ 2,236 a t = 2-nél)`);
}
document.getElementById("t").addEventListener("input", draw);
document.getElementById("tm2").onclick = () => { document.getElementById("t").value = 2; draw(); };
document.getElementById("t0").onclick = () => { document.getElementById("t").value = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
