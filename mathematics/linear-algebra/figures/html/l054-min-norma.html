<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A minimális normájú megoldás geometriája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Megoldás kiválasztása">
  <label for="t">t =</label><input id="t" type="range" min="-2" max="2" step="0.01" value="0" aria-label="Paraméter a megoldások egyenese mentén"><b id="tv"></b>
  <button id="pinv">A⁺b (t = 0)</button><button id="tp">t = 1</button><button id="tm">t = −1</button>
</div>
<div class="ctl" role="group" aria-label="Eset">
  <label><input id="d3" type="checkbox"> 15.4.4: háromdimenziós alulhatározott eset (x = (s, 1 − s, t))</label>
  <span id="t2w" hidden><label for="t2">x₃ = </label><input id="t2" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Harmadik koordináta"><b id="t2v"></b></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Ferde egyenes a síkban, rajta egy kiemelt pont, ahová az origóból merőleges nyíl mutat; ez a pont az (1,2) irányú sortér-egyenesen fekszik"></svg>
<p class="small">A = [[1, 2], [2, 4]], b = (3, 6) (15.4.9 (b) feladat). A megoldások x₀ + t(−2, 1); x₀ ⟂ N(A), ezért ‖x‖² = ‖x₀‖² + 5t² (Pitagorasz). 3D-ben (15.4.4) a megoldások egy síkot alkotnak, x₀ a sík origóhoz legközelebbi pontja. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const S = 62, OX = 230, OY = 250;
const P = (x, y) => [OX + x*S, OY - y*S];
function arrow(a, b, attrs, head){ const p = P(...a), q = P(...b); el("line", Object.assign({x1: p[0], y1: p[1], x2: q[0], y2: q[1]}, attrs));
  const ang = Math.atan2(q[1] - p[1], q[0] - p[0]), h = 10; el("polygon", {points: [q, [q[0] - h*Math.cos(ang - 0.4), q[1] - h*Math.sin(ang - 0.4)], [q[0] - h*Math.cos(ang + 0.4), q[1] - h*Math.sin(ang + 0.4)]].map(z => z.join(",")).join(" "), fill: head}); }
function draw2(){
  const t = +$("t").value, x = [0.6 - 2*t, 1.2 + t], n2 = x[0]*x[0] + x[1]*x[1];
  const fg = css("--fg"), mu = css("--muted");
  el("line", {x1: 0, y1: OY, x2: 560, y2: OY, stroke: css("--grid")}); el("line", {x1: OX, y1: 0, x2: OX, y2: 400, stroke: css("--grid")});
  for (let v = -3; v <= 5; v++) { if (!v) continue; const p = P(v, 0); el("text", {x: p[0], y: OY + 14, "font-size": 10, "text-anchor": "middle", fill: mu}, String(v).replace("-", "−")); }
  for (let v = -2; v <= 3; v++) { if (!v) continue; const p = P(0, v); el("text", {x: OX - 5, y: p[1] + 4, "font-size": 10, "text-anchor": "end", fill: mu}, String(v).replace("-", "−")); }
  let a = P(0.6 + 6, 1.2 - 3), c = P(0.6 - 6, 1.2 + 3); el("line", {x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: fg, "stroke-width": 3.2});
  a = P(-1.5, -3); c = P(2, 4); el("line", {x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: fg, "stroke-dasharray": "2 4", "stroke-width": 1.5});
  a = P(4, -2); c = P(-4, 2); el("line", {x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: fg, "stroke-dasharray": "2 4", "stroke-width": 1.5});
  let q = P(1.55, 3.05); el("text", {x: q[0], y: q[1], "font-size": 13}, "sortér (1, 2)");
  q = P(-3.6, 1.55); el("text", {x: q[0], y: q[1], "font-size": 13}, "N(A) (−2, 1)");
  q = P(-3.6, 3.0); el("text", {x: q[0], y: q[1], "font-size": 13, "font-weight": "bold"}, "megoldások: x₀ + N(A)");
  el("circle", {cx: OX, cy: OY, r: Math.sqrt(1.8)*S, fill: "none", stroke: mu, "stroke-dasharray": "6 4"});
  el("circle", {cx: OX, cy: OY, r: Math.sqrt(n2)*S, fill: "none", stroke: css("--hl2"), "stroke-width": 1, opacity: 0.6});
  arrow([0, 0], [0.6, 1.2], {stroke: fg, "stroke-width": 2.4}, fg);
  q = P(0.6, 1.2); el("circle", {cx: q[0], cy: q[1], r: 5.5, fill: fg});
  el("text", {x: q[0] + 10, y: q[1] + 18, "font-size": 13}, "x₀ = A⁺b = (0,6; 1,2)");
  // derékszögjel
  const u = [-0.6/Math.sqrt(1.8)*0.18, -1.2/Math.sqrt(1.8)*0.18], w = [-2/Math.sqrt(5)*0.18, 1/Math.sqrt(5)*0.18];
  el("polyline", {points: [[0.6 + u[0], 1.2 + u[1]], [0.6 + u[0] + w[0], 1.2 + u[1] + w[1]], [0.6 + w[0], 1.2 + w[1]]].map(z => P(...z).join(",")).join(" "), fill: "none", stroke: fg});
  if (Math.abs(t) > 1e-9) {
    arrow([0, 0], x, {stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "7 4"}, css("--hl"));
    arrow([0.6, 1.2], x, {stroke: css("--hl2"), "stroke-width": 1.6}, css("--hl2"));
    q = P(...x); el("circle", {cx: q[0], cy: q[1], r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2.2});
  }
  $("status").textContent = "t = " + fmt(t, 2) + ": x = (" + fmt(x[0], 2) + "; " + fmt(x[1], 2) + "), ‖x‖² = 1,8 + 5·t² = " + fmt(n2, 3) + ", ‖x‖ = " + fmt(Math.sqrt(n2), 3) +
    (Math.abs(t) < 1e-9 ? " – ez a minimális normájú megoldás, a kör itt érinti az egyenest" : " (narancs: a nulltérbeli rész t(−2, 1), merőleges x₀-ra)");
}
function draw3(){
  const p = +$("t").value, tau = +$("t2").value, x = [0.5 - p, 0.5 + p, tau], n2 = x[0]*x[0] + x[1]*x[1] + x[2]*x[2];
  const fg = css("--fg"), mu = css("--muted"), K = 120;
  const Q = v => [OX + 40 + K*(v[0] - 0.62*v[1]), OY - 40 - K*(v[2] + 0.36*v[1])];  // ferde (kabinet) vetület
  const L3 = (a, b, at) => { const s = Q(a), e = Q(b); el("line", Object.assign({x1: s[0], y1: s[1], x2: e[0], y2: e[1]}, at)); };
  [[1.6,0,0,"x₁"],[0,1.6,0,"x₂"],[0,0,1.4,"x₃"]].forEach(ax => { L3([0,0,0], ax.slice(0,3), {stroke: mu}); const e = Q(ax.slice(0,3)); el("text", {x: e[0] + 4, y: e[1], "font-size": 13, fill: mu}, ax[3]); });
  // a megoldássík darabja: (0,5 − p, 0,5 + p, τ), p, τ ∈ [−1, 1]
  const C = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a, c]) => Q([0.5 - a, 0.5 + a, c]));
  el("polygon", {points: C.map(z => z.join(",")).join(" "), fill: css("--fill"), stroke: fg, "fill-opacity": 0.7});
  for (let g = -1; g <= 1; g += 0.5) { L3([0.5 - g, 0.5 + g, -1], [0.5 - g, 0.5 + g, 1], {stroke: mu, "stroke-width": 0.6}); L3([1.5, -0.5, g], [-0.5, 1.5, g], {stroke: mu, "stroke-width": 0.6}); }
  L3([-0.4, -0.4, 0], [1.2, 1.2, 0], {stroke: fg, "stroke-dasharray": "2 4", "stroke-width": 1.5});
  let q = Q([1.2, 1.2, 0]); el("text", {x: q[0] + 4, y: q[1] + 14, "font-size": 13}, "sortér (1, 1, 0)");
  q = Q([-0.5, 1.5, 1]); el("text", {x: q[0] - 10, y: q[1] - 8, "font-size": 13, "font-weight": "bold"}, "megoldássík x₀ + N(A)");
  L3([0,0,0], [0.5,0.5,0], {stroke: fg, "stroke-width": 2.6});
  q = Q([0.5,0.5,0]); el("circle", {cx: q[0], cy: q[1], r: 5.5, fill: fg}); el("text", {x: q[0] + 8, y: q[1] + 18, "font-size": 13}, "x₀ = (0,5; 0,5; 0)");
  if (Math.abs(p) > 1e-9 || Math.abs(tau) > 1e-9) { L3([0,0,0], x, {stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "7 4"}); L3([0.5,0.5,0], x, {stroke: css("--hl2"), "stroke-width": 1.6});
    q = Q(x); el("circle", {cx: q[0], cy: q[1], r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2.2}); }
  $("status").textContent = "3D: x = (s, 1 − s, t) = (" + fmt(x[0], 2) + "; " + fmt(x[1], 2) + "; " + fmt(x[2], 2) + "), ‖x‖² = 0,5 + 2·(s − 0,5)² + t² = " + fmt(n2, 3) +
    (n2 < 0.5 + 1e-9 ? " – minimum: x₀ = (0,5; 0,5; 0), ‖x₀‖ ≈ 0,7071" : "");
}
function draw(){ $("tv").textContent = fmt(+$("t").value, 2); $("t2v").textContent = fmt(+$("t2").value, 2); svg.innerHTML = ""; if ($("d3").checked) draw3(); else draw2(); }
$("t").addEventListener("input", draw); $("t2").addEventListener("input", draw);
$("pinv").onclick = () => { $("t").value = 0; $("t2").value = 0; draw(); };
$("tp").onclick = () => { $("t").value = 1; draw(); }; $("tm").onclick = () => { $("t").value = -1; draw(); };
$("d3").addEventListener("change", () => { $("t2w").hidden = !$("d3").checked; $("t").value = 0; $("t2").value = 0; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
