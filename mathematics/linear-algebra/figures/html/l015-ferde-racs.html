<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferde koordinátarács</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Bázis">
  <label>b₁ = <input id="b1" type="text" value="2, 1" aria-label="b1 koordinátái"></label>
  <label>b₂ = <input id="b2" type="text" value="1, 3" aria-label="b2 koordinátái"></label>
  <label>v = <input id="vin" type="text" value="5, 5" aria-label="v standard koordinátái"></label>
  <button id="reset">Alapértékek</button>
</div>
<div class="ctl" role="group" aria-label="Megjelenítés">
  <label><input id="snap" type="checkbox" checked> rácspontra pattintás</label>
  <label><input id="gs" type="checkbox" checked> standard rács</label>
  <label><input id="gb" type="checkbox" checked> B-rács</label>
  <span class="small">A v pont egérrel/ujjal húzható; billentyűzettel: nyilak (fókusz a rajzon).</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 620 362" role="img" aria-label="Standard négyzetrács és a b1, b2 által meghatározott ferde rács; a v pont koordinátái mindkét rendszerben"></svg>
  <pre id="code" aria-label="NumPy-kód"></pre>
</div>
<p class="small">Számított értékek. Kezdőállapot: b1 = (2, 1), b2 = (1, 3), v = (5, 5), [v]_B = (2, 1). Próbáld ki: v = (7, 11) → (2, 3); b1 = (1, 2), b2 = (3, 6) → nem bázis.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


let B1 = [2, 1], B2 = [1, 3], V = [5, 5], bad = false;
const XL = [-3, 12], YL = [-3, 12], S = 22, OX = 20 - S * XL[0], OY = 10 + S * YL[1];
const X = p => OX + S * p[0], Y = p => OY - S * p[1];
function parse(s){ const a = s.replace(/−/g, "-").split(/[;,\s]+/).filter(q => q.length).map(q => parseFloat(q)); return (a.length === 2 && a.every(isFinite)) ? a : null; }
function f(x){ const r = Math.round(x * 1e4) / 1e4; return (Object.is(r, -0) ? 0 : r).toString().replace(".", ",").replace("-", "−"); }
function npf(x){ const r = Math.round(x * 1e8) / 1e8; return (Object.is(r, -0) ? 0 : r) + (Number.isInteger(r) ? "." : ""); }
function coords(){ const d = B1[0] * B2[1] - B1[1] * B2[0]; if (Math.abs(d) < 1e-12) return null;
  return [(V[0] * B2[1] - V[1] * B2[0]) / d, (B1[0] * V[1] - B1[1] * V[0]) / d]; }
function clipLine(p, d){ const ts = []; const BB = [XL, YL];
  for (let a = 0; a < 2; a++) { if (Math.abs(d[a]) < 1e-12) continue; for (const b of BB[a]) { const t = (b - p[a]) / d[a], q = [p[0] + t * d[0], p[1] + t * d[1]];
    if (q[0] >= XL[0] - 1e-9 && q[0] <= XL[1] + 1e-9 && q[1] >= YL[0] - 1e-9 && q[1] <= YL[1] + 1e-9) ts.push(t); } }
  if (ts.length < 2) return null; const t0 = Math.min(...ts), t1 = Math.max(...ts); return [[p[0] + t0 * d[0], p[1] + t0 * d[1]], [p[0] + t1 * d[0], p[1] + t1 * d[1]]]; }
function draw(){
  svg.innerHTML = "";
  el("rect", {x: X([XL[0], 0]), y: Y([0, YL[1]]), width: S * (XL[1] - XL[0]), height: S * (YL[1] - YL[0]), fill: "none", stroke: css("--grid")});
  if (g("gs").checked) { for (let i = XL[0]; i <= XL[1]; i++) el("line", {x1: X([i, 0]), y1: Y([0, YL[0]]), x2: X([i, 0]), y2: Y([0, YL[1]]), stroke: css("--grid2"), "stroke-dasharray": "1 3"});
    for (let j = YL[0]; j <= YL[1]; j++) el("line", {x1: X([XL[0], 0]), y1: Y([0, j]), x2: X([XL[1], 0]), y2: Y([0, j]), stroke: css("--grid2"), "stroke-dasharray": "1 3"}); }
  for (let i = XL[0]; i <= XL[1]; i += 3) el("text", {x: X([i, 0]), y: Y([0, YL[0]]) + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i).replace("-", "−"));
  for (let j = YL[0]; j <= YL[1]; j += 3) el("text", {x: X([XL[0], 0]) - 4, y: Y([0, j]) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(j).replace("-", "−"));
  el("line", {x1: X([XL[0], 0]), y1: Y([0, 0]), x2: X([XL[1], 0]), y2: Y([0, 0]), stroke: css("--muted")});
  el("line", {x1: X([0, 0]), y1: Y([0, YL[0]]), x2: X([0, 0]), y2: Y([0, YL[1]]), stroke: css("--muted")});
  const c = coords(); bad = !c;
  if (c && g("gb").checked) for (let k = -30; k <= 30; k++) for (const [a, d] of [[[k * B1[0], k * B1[1]], B2], [[k * B2[0], k * B2[1]], B1]]) {
    const L = clipLine(a, d); if (L) el("line", {x1: X(L[0]), y1: Y(L[0]), x2: X(L[1]), y2: Y(L[1]), stroke: css("--fg"), "stroke-width": 0.7}); }
  arrow(X([0, 0]), Y([0, 0]), X(B1), Y(B1), {w: 3.5, col: css("--hl")});
  arrow(X([0, 0]), Y([0, 0]), X(B2), Y(B2), {w: 3.5, col: css("--hl")});
  el("text", {x: X(B1) + 6, y: Y(B1) + 16, "font-size": 15, "font-weight": "bold"}, "b₁");
  el("text", {x: X(B2) - 22, y: Y(B2) - 4, "font-size": 15, "font-weight": "bold"}, "b₂");
  if (c) { const M = [c[0] * B1[0], c[0] * B1[1]];
    arrow(X([0, 0]), Y([0, 0]), X(M), Y(M), {w: 2, dash: "7 4", col: css("--hl2")});
    arrow(X(M), Y(M), X(V), Y(V), {w: 2, dash: "7 4", col: css("--hl2")}); }
  el("circle", {cx: X(V), cy: Y(V), r: 8, fill: css("--fg"), style: "cursor:grab"});
  const LX = 370; el("text", {x: LX, y: 40, "font-size": 15}, "standard: (" + f(V[0]) + ", " + f(V[1]) + ")");
  el("text", {x: LX, y: 64, "font-size": 15}, c ? "B-ben: (" + f(c[0]) + ", " + f(c[1]) + ")" : "nem bázis: a vektorok összefüggők");
  el("text", {x: LX, y: 100, "font-size": 12, fill: css("--muted")}, "pontozott: standard rács");
  el("text", {x: LX, y: 116, "font-size": 12, fill: css("--muted")}, "folytonos vékony: B-rács");
  el("text", {x: LX, y: 132, "font-size": 12, fill: css("--muted")}, "szaggatott: α·b₁, majd β·b₂");
  g("status").textContent = c ? "v = (" + f(V[0]) + ", " + f(V[1]) + "); [v]_B = (" + f(c[0]) + ", " + f(c[1]) + ")" :
    "v = (" + f(V[0]) + ", " + f(V[1]) + "); nem bázis: a vektorok összefüggők (det P_B = 0)";
  g("vin").value = f(V[0]) + ", " + f(V[1]);
  const code = ["import numpy as np", "P_B = np.array([[" + B1[0] + ", " + B2[0] + "], [" + B1[1] + ", " + B2[1] + "]])   # oszlopai b1, b2",
    "v = np.array([" + f(V[0]).replace(",", ".") + ", " + f(V[1]).replace(",", ".") + "])", "print(np.linalg.solve(P_B, v))",
    c ? "# kimenet: [" + npf(c[0]) + " " + npf(c[1]) + "]" : "# LinAlgError: Singular matrix"];
  g("code").innerHTML = code.map((l, q) => '<span class="' + (q === 3 ? "on" : "") + '">' + l.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>").join("");
}
function toWorld(ev){ const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal, sx = vb.width / r.width, sy = vb.height / r.height;
  return [((ev.clientX - r.left) * sx + vb.x - OX) / S, (OY - ((ev.clientY - r.top) * sy + vb.y)) / S]; }
function snapPt(p){ if (!g("snap").checked) return [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10];
  const c = (() => { const d = B1[0] * B2[1] - B1[1] * B2[0]; if (Math.abs(d) < 1e-12 || !g("gb").checked) return null; return [Math.round((p[0] * B2[1] - p[1] * B2[0]) / d), Math.round((B1[0] * p[1] - B1[1] * p[0]) / d)]; })();
  const ps = [Math.round(p[0]), Math.round(p[1])];
  if (!c) return ps; const pb = [c[0] * B1[0] + c[1] * B2[0], c[0] * B1[1] + c[1] * B2[1]];
  return Math.hypot(pb[0] - p[0], pb[1] - p[1]) < Math.hypot(ps[0] - p[0], ps[1] - p[1]) ? pb : ps; }
let drag = false;
svg.setAttribute("tabindex", "0");
svg.addEventListener("pointerdown", ev => { drag = true; svg.setPointerCapture(ev.pointerId); V = snapPt(toWorld(ev)); draw(); });
svg.addEventListener("pointermove", ev => { if (!drag) return; const p = snapPt(toWorld(ev)); p[0] = Math.max(XL[0], Math.min(XL[1], p[0])); p[1] = Math.max(YL[0], Math.min(YL[1], p[1])); V = p; draw(); });
svg.addEventListener("pointerup", () => { drag = false; });
svg.addEventListener("keydown", ev => { const d = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1]}[ev.key]; if (!d) return; ev.preventDefault(); V = [V[0] + d[0], V[1] + d[1]]; draw(); });
function readB(){ const a = parse(g("b1").value), b = parse(g("b2").value); if (!a || !b) { g("status").textContent = "hibás bemenet: két számot adj meg vesszővel elválasztva"; return; } B1 = a; B2 = b; draw(); }
g("b1").addEventListener("change", readB); g("b2").addEventListener("change", readB);
g("vin").addEventListener("change", () => { const a = parse(g("vin").value); if (a) { V = a; draw(); } });
["snap", "gs", "gb"].forEach(id => g(id).addEventListener("change", draw));
g("reset").onclick = () => { g("b1").value = "2, 1"; g("b2").value = "1, 3"; B1 = [2, 1]; B2 = [1, 3]; V = [5, 5]; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
