<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineáris és köbös illesztés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label><input type="checkbox" id="cl" checked> lineáris</label>
<label><input type="checkbox" id="cc" checked> köbös</label>
<label for="x">x =</label><input id="x" type="range" min="0" max="5" step="0.05" value="2.5" aria-label="x helye">
<b id="xv"></b>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Négy tanítópont, három validációs és két tesztpont; a lineáris egyenes és a köbös görbe; a köbös görbe a validációs pontoknál is eltér, az extrapolációban elszáll." style=""></svg>
<table aria-label="Hibák"><thead><tr><th>modell</th><th>tanító MSE</th><th>validációs MSE</th><th>teszt MSE</th></tr></thead>
<tbody><tr><td>lineáris (d = 1)</td><td>0,175</td><td>0,069</td><td>0,305</td></tr>
<tr><td>köbös (d = 3)</td><td>0</td><td>0,431</td><td>218</td></tr></tbody></table>
</div>
<p class="small">Tanítóadat (0, 2), (1, 5), (2, 7), (3, 11); a köbös görbe 0,01-es lépésközzel számítva (pl. x = 0,5; 1,5; 2,5-nél 3,8125; 5,9375; 8,5625). Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v");
const TR = [[0,2],[1,5],[2,7],[3,11]], VA = [[0.5,3.5],[1.5,6.5],[2.5,9.5]], TE = [[4,14],[5,17]];
const lin = x => 1.9 + 2.9 * x, cub = x => 2 + 4.5 * x - 2 * x * x + 0.5 * x * x * x;
const L = 46, R = 545, T = 12, B = 300, X = x => L + (x + 0.2) / 5.6 * (R - L), Y = y => B - y / 39 * (B - T);
function path(f){ let d = ""; for (let i = 0; i <= 500; i++) { const x = i / 100; d += (i ? "L" : "M") + X(x).toFixed(1) + "," + Y(f(x)).toFixed(1); } return d; }
function draw(){
  const x = +document.getElementById("x").value, sl = document.getElementById("cl").checked, sc = document.getElementById("cc").checked;
  document.getElementById("xv").textContent = huf(x, 2);
  svg.innerHTML = "";
  mk(svg, "rect", {x: X(-0.2), y: T, width: X(3) - X(-0.2), height: B - T, fill: cssv("--fill"), opacity: 0.6});
  [0, 10, 20, 30].forEach(v => { mk(svg, "line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: cssv("--grid")}); mk(svg, "text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); });
  [0, 1, 2, 3, 4, 5].forEach(v => mk(svg, "text", {x: X(v), y: B + 15, "text-anchor": "middle", "font-size": 11}, String(v)));
  mk(svg, "line", {x1: X(3), y1: T, x2: X(3), y2: B, stroke: cssv("--muted"), "stroke-dasharray": "8 3 2 3"});
  mk(svg, "text", {x: X(1.4), y: T + 14, "text-anchor": "middle", "font-size": 12, fill: cssv("--muted")}, "tanítótartomány [0; 3]");
  mk(svg, "text", {x: X(4.2), y: T + 14, "text-anchor": "middle", "font-size": 12, fill: cssv("--muted")}, "extrapoláció");
  const cp = mk(svg, "clipPath", {id: "cp"}); mk(cp, "rect", {x: L, y: T, width: R - L, height: B - T});
  if (sl) mk(svg, "path", {d: path(lin), fill: "none", stroke: cssv("--hl"), "stroke-width": 2.2, "clip-path": "url(#cp)"});
  if (sc) { mk(svg, "path", {d: path(cub), fill: "none", stroke: cssv("--hl2"), "stroke-width": 2.2, "stroke-dasharray": "7 4", "clip-path": "url(#cp)"});
    VA.concat(TE).forEach(([a, b]) => mk(svg, "line", {x1: X(a), y1: Y(b), x2: X(a), y2: Y(Math.min(cub(a), 39)), stroke: cssv("--fg"), "stroke-dasharray": "2 3"})); }
  TR.forEach(([a, b]) => mk(svg, "circle", {cx: X(a), cy: Y(b), r: 5, fill: cssv("--fg")}));
  VA.forEach(([a, b]) => mk(svg, "rect", {x: X(a) - 5, y: Y(b) - 5, width: 10, height: 10, fill: cssv("--bg"), stroke: cssv("--fg"), "stroke-width": 1.5}));
  TE.forEach(([a, b]) => mk(svg, "polygon", {points: `${X(a)},${Y(b) - 7} ${X(a) - 6},${Y(b) + 5} ${X(a) + 6},${Y(b) + 5}`, fill: cssv("--muted"), stroke: cssv("--fg")}));
  mk(svg, "line", {x1: X(x), y1: T, x2: X(x), y2: B, stroke: cssv("--fg"), "stroke-width": 0.8});
  if (sl) mk(svg, "circle", {cx: X(x), cy: Y(lin(x)), r: 5, fill: "none", stroke: cssv("--hl"), "stroke-width": 2});
  if (sc && cub(x) <= 39) mk(svg, "circle", {cx: X(x), cy: Y(cub(x)), r: 5, fill: "none", stroke: cssv("--hl2"), "stroke-width": 2});
  // jelmagyarázat
  const lg = [["● tanítópont", cssv("--fg")], ["□ validációs pont", cssv("--fg")], ["▲ tesztpont", cssv("--fg")], ["— lineáris", cssv("--hl")], ["- - köbös", cssv("--hl2")]];
  lg.forEach(([t, c], i) => mk(svg, "text", {x: L + 8, y: T + 36 + 15 * i, "font-size": 12, fill: c}, t));
  let st = `x = ${huf(x, 2)}:`;
  if (sl) st += ` lineáris ŷ = ${huf(lin(x), 4)};`;
  if (sc) st += ` köbös ŷ = ${huf(cub(x), 4)};`;
  const hit = VA.concat(TE).find(p => Math.abs(p[0] - x) < 1e-9);
  if (hit) st += ` mért y = ${hu(hit[1], 2)}` + (x > 3 ? " (tesztpont, extrapoláció)" : " (validációs pont)");
  document.getElementById("status").textContent = st;
}
["cl", "cc", "x"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
