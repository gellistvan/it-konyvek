<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorhozzáadás és determináns</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Sorművelet">
<label><input type="radio" name="mode" id="madd" checked> r₂ ← r₂ + c·r₁</label>
<label><input type="radio" name="mode" id="mmul"> r₂ ← c·r₂</label>
<button id="swap" aria-pressed="false">Sorcsere: r₁ ↔ r₂</button>
</div>
<div class="ctl"><label for="c">c = <b class="v" id="cv">0</b></label><input id="c" type="range" min="-3" max="3" step="0.1" value="0" aria-label="A c szorzó">
<button id="c15">c = −1,5</button><button id="c0">c = 0</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 340" role="img" aria-label="Az r1=(2,1) és r2+c·r1 sorvektorok által kifeszített paralelogramma; az r1 egyenese pontozott, a rá merőleges magasság kettős nyíllal; a c csúszkával a paralelogramma elnyíródik."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">A 9.3.2 mátrixa: sorai r1 = (2, 1) és r2 = (3, 4), det = 5. Szaggatott körvonal: a kiinduló paralelogramma. Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


const R1 = [2, 1], R2 = [3, 4];
let swapped = false;
function draw(){
  const c = +document.getElementById("c").value, add = document.getElementById("madd").checked;
  document.getElementById("cv").textContent = hu(c, 1);
  let a = R1.slice(), b = add ? [R2[0] + c * R1[0], R2[1] + c * R1[1]] : [c * R2[0], c * R2[1]];
  if (swapped) { const t = a; a = b; b = t; }
  const det = a[0] * b[1] - a[1] * b[0];
  const sc = 38, ox = 230, oy = 250, X = x => ox + x * sc, Y = y => oy - y * sc;
  svg.innerHTML = "";
  for (let g = -6; g <= 8; g++) el("line", {x1: X(g), y1: Y(-2), x2: X(g), y2: Y(6.3), stroke: css("--grid")});
  for (let g = -2; g <= 6; g++) el("line", {x1: X(-6), y1: Y(g), x2: X(8.5), y2: Y(g), stroke: css("--grid")});
  el("line", {x1: X(-6), y1: Y(0), x2: X(8.5), y2: Y(0), stroke: css("--muted")}); el("line", {x1: X(0), y1: Y(-2), x2: X(0), y2: Y(6.3), stroke: css("--muted")});
  // eredeti paralelogramma halványan
  el("polygon", {points: [[0,0], R1, [R1[0]+R2[0], R1[1]+R2[1]], R2].map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": "4 4"});
  el("polygon", {points: [[0,0], a, [a[0]+b[0], a[1]+b[1]], b].map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: det >= 0 ? css("--fill1") : css("--fill2"), stroke: css("--fg"), "stroke-width": 2});
  // r1 egyenese (pontozott) és magasság
  const L = Math.hypot(R1[0], R1[1]), u = [R1[0] / L, R1[1] / L];
  el("line", {x1: X(-6 * u[0]), y1: Y(-6 * u[1]), x2: X(8 * u[0]), y2: Y(8 * u[1]), stroke: css("--fg"), "stroke-dasharray": "2 4"});
  const other = swapped ? a : b, pr = other[0] * u[0] + other[1] * u[1], foot = [pr * u[0], pr * u[1]], hh = Math.abs(-u[1] * other[0] + u[0] * other[1]);
  if (hh > 1e-9) { vec(X(foot[0]), Y(foot[1]), X(other[0]), Y(other[1]), {color: css("--hl"), w: 1.6, head: 8}); vec(X(other[0]), Y(other[1]), X(foot[0]), Y(foot[1]), {color: css("--hl"), w: 1.6, head: 8});
    txt(X((foot[0] + other[0]) / 2) - 8, Y((foot[1] + other[1]) / 2), "h = " + hu(hh, 3), {anchor: "end", fs: 13, color: css("--hl")}); }
  vec(X(0), Y(0), X(a[0]), Y(a[1]), {w: 2.5}); vec(X(0), Y(0), X(b[0]), Y(b[1]), {w: 2.5, color: css("--hl2")});
  txt(X(a[0]) + 6, Y(a[1]) + 18, `${swapped ? "r₂'" : "r₁"} = (${hu(a[0],2)}; ${hu(a[1],2)})`, {anchor: "start", fs: 13});
  txt(X(b[0]) + 6, Y(b[1]) - 8, `${swapped ? "r₁" : "r₂'"} = (${hu(b[0],2)}; ${hu(b[1],2)})`, {anchor: "start", fs: 13, color: css("--hl2")});
  const op = add ? (c === 0 ? "kiinduló mátrix" : `r₂ ← r₂ ${c < 0 ? "−" : "+"} ${hu(Math.abs(c), 1)}·r₁`) : `r₂ ← ${hu(c, 1)}·r₂`;
  let st = `${op}${swapped ? ", majd sorcsere" : ""}: mátrix [[${hu(a[0],2)}; ${hu(a[1],2)}], [${hu(b[0],2)}; ${hu(b[1],2)}]], det = ${hu(det, 3)}`;
  st += add ? (swapped ? " – a sorcsere előjelet vált (−5)." : " – a hozzáadás nem változtat (alap és magasság azonos), terület 5.")
            : ` – a sorszorzás c-szeresére változtatja (c·5 = ${hu(5 * c, 2)})${swapped ? ", a csere még előjelet is vált" : ""}.`;
  document.getElementById("status").textContent = st;
}
document.getElementById("c").addEventListener("input", draw);
["madd", "mmul"].forEach(id => document.getElementById(id).addEventListener("change", () => { document.getElementById("c").value = id === "mmul" ? 1 : 0; draw(); }));
document.getElementById("swap").onclick = () => { swapped = !swapped; document.getElementById("swap").setAttribute("aria-pressed", String(swapped)); draw(); };
document.getElementById("c15").onclick = () => { document.getElementById("madd").checked = true; document.getElementById("c").value = -1.5; draw(); };
document.getElementById("c0").onclick = () => { document.getElementById("madd").checked = true; document.getElementById("c").value = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
