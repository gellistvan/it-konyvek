<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tükrözés φ szögű egyenesre</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Tükörtengely szöge">
  <label for="phi">φ =</label><input id="phi" type="range" min="0" max="180" step="1" value="30" aria-label="Tükörtengely szöge fokban">
  <b id="pv" style="min-width:3em">30°</b>
  <button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="90">90°</button>
  <label><input id="vv" type="checkbox"> v = (2, 1) és tükörképe</label>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 350" role="img" aria-label="Egységkör, φ szögű tükörtengely; e1 képe a 2φ irányszögű egységvektor, e2 képe (sin 2φ, −cos 2φ)"></svg>
  
</div>
<p class="small">Számított értékek, 3 tizedesre kerekítve. Kezdőállapot φ = 30°: T e₁ = (0,5; 0,866), T e₂ = (0,866; −0,5); φ = 45°-nál a mátrix [[0, 1], [1, 0]]. A v = (2, 1) bekapcsolásakor a rajz kicsinyített léptékű.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


const S = 120, OX = 200, OY = 190;
const X = p => OX + S * p[0], Y = p => OY - S * p[1];
function arcP(r, a0, a1){ let p = ""; const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 3)); for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; p += (i ? "L" : "M") + (OX + r * Math.cos(a)).toFixed(1) + "," + (OY - r * Math.sin(a)).toFixed(1); } return p; }
function draw(){
  svg.innerHTML = "";
  const phi = +g("phi").value, f = 2 * phi * Math.PI / 180, c = Math.cos(f), s = Math.sin(f), showV = g("vv").checked;
  const sc = showV ? 0.55 : 1;   // v = (2, 1) esetén kicsinyítünk, hogy beférjen
  const Xs = p => OX + S * sc * p[0], Ys = p => OY - S * sc * p[1];
  el("line", {x1: OX - 175, y1: OY, x2: OX + 175, y2: OY, stroke: css("--grid2")}); el("line", {x1: OX, y1: OY - 175, x2: OX, y2: OY + 150, stroke: css("--grid2")});
  el("circle", {cx: OX, cy: OY, r: S * sc, fill: "none", stroke: css("--muted"), "stroke-width": 1.2});
  const d = [Math.cos(phi * Math.PI / 180), Math.sin(phi * Math.PI / 180)];
  el("line", {x1: OX - 170 * d[0], y1: OY + 170 * d[1], x2: OX + 170 * d[0], y2: OY - 170 * d[1], stroke: css("--fg"), "stroke-width": 3, "stroke-dasharray": "10 6"});
  el("text", {x: OX + 150 * d[0] + (d[0] >= 0 ? 6 : -6), y: OY - 150 * d[1] - 8, "font-size": 13, "text-anchor": d[0] >= 0 ? "start" : "end"}, "tengely, φ = " + phi + "°");
  el("path", {d: arcP(42, 0, phi), fill: "none", stroke: css("--fg"), "stroke-width": 1.5});
  el("path", {d: arcP(66, 0, 2 * phi), fill: "none", stroke: css("--hl2"), "stroke-width": 1.5});
  el("path", {d: arcP(71, 0, 2 * phi), fill: "none", stroke: css("--hl2"), "stroke-width": 1.5});
  el("text", {x: OX + 48 * Math.cos(phi * Math.PI / 360), y: OY - 48 * Math.sin(phi * Math.PI / 360) + 4, "font-size": 12}, "φ");
  el("text", {x: OX + 80 * Math.cos(phi * Math.PI / 180), y: OY - 80 * Math.sin(phi * Math.PI / 180) + 4, "font-size": 12, fill: css("--hl2")}, "2φ");
  const e1 = [1, 0], e2 = [0, 1], T1 = [c, s], T2 = [s, -c];
  arrow(Xs([0, 0]), Ys([0, 0]), Xs(e1), Ys(e1), {w: 2.5, col: css("--grid2")}); arrow(Xs([0, 0]), Ys([0, 0]), Xs(e2), Ys(e2), {w: 2.5, col: css("--grid2")});
  el("text", {x: Xs(e1) + 4, y: Ys(e1) + 16, "font-size": 13, fill: css("--muted")}, "e₁"); el("text", {x: Xs(e2) + 6, y: Ys(e2) - 2, "font-size": 13, fill: css("--muted")}, "e₂");
  arrow(Xs([0, 0]), Ys([0, 0]), Xs(T1), Ys(T1), {w: 3, col: css("--hl"), dash: "8 5"}); arrow(Xs([0, 0]), Ys([0, 0]), Xs(T2), Ys(T2), {w: 3, col: css("--hl2"), dash: "8 5"});
  el("text", {x: Xs([1.12 * T1[0], 0]) , y: Ys([0, 1.12 * T1[1]]) + 4, "font-size": 13, "font-weight": "bold", "text-anchor": "middle"}, "T e₁");
  el("text", {x: Xs([1.14 * T2[0], 0]), y: Ys([0, 1.14 * T2[1]]) + 4, "font-size": 13, "font-weight": "bold", "text-anchor": "middle"}, "T e₂");
  let vtxt = "";
  if (showV) { const v = [2, 1], Tv = [c * 2 + s * 1, s * 2 - c * 1];
    arrow(Xs([0, 0]), Ys([0, 0]), Xs(v), Ys(v), {w: 2.5}); arrow(Xs([0, 0]), Ys([0, 0]), Xs(Tv), Ys(Tv), {w: 2.5, dash: "3 4"});
    el("line", {x1: Xs(v), y1: Ys(v), x2: Xs(Tv), y2: Ys(Tv), stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("text", {x: Xs(v) + 6, y: Ys(v), "font-size": 13, "font-weight": "bold"}, "v"); el("text", {x: Xs(Tv) + 6, y: Ys(Tv), "font-size": 13, "font-weight": "bold"}, "T v");
    vtxt = "; T v = (" + hu(Tv[0], 3) + "; " + hu(Tv[1], 3) + ")"; }
  // mátrix
  const LX = 430, LY = 225; el("text", {x: LX, y: LY + 11, "font-size": 15}, "T_φ =");
  [[c, s], [s, -c]].forEach((r, i) => { el("text", {x: LX + 52, y: LY + i * 22, "font-size": 15}, "[");
    r.forEach((v, j) => el("text", {x: LX + 110 + j * 70, y: LY + i * 22, "font-size": 15, "text-anchor": "end"}, hu(v, 3)));
    el("text", {x: LX + 190, y: LY + i * 22, "font-size": 15}, "]"); });
  el("text", {x: LX, y: LY + 58, "font-size": 12, fill: css("--muted")}, "1. oszlop: (cos 2φ, sin 2φ)");
  el("text", {x: LX, y: LY + 76, "font-size": 12, fill: css("--muted")}, "2. oszlop: (sin 2φ, −cos 2φ)");
  el("text", {x: LX, y: LY + 94, "font-size": 12, fill: css("--muted")}, "det = −1 (irányításváltó)");
  g("pv").textContent = phi + "°";
  g("status").textContent = "φ = " + phi + "°, 2φ = " + (2 * phi) + "°: T e₁ = (" + hu(c, 3) + "; " + hu(s, 3) + "), T e₂ = (" + hu(s, 3) + "; " + hu(-c, 3) + ")" + vtxt;
}
g("phi").addEventListener("input", draw); g("vv").addEventListener("change", draw);
document.querySelectorAll("button[data-a]").forEach(b => b.addEventListener("click", () => { g("phi").value = b.dataset.a; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
