<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szinguláris leképezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A mátrix elemei">
  <span>M =</span> [<input id="m00" type="number" step="any" value="1" aria-label="M első sor első elem">
  <input id="m01" type="number" step="any" value="0" aria-label="M első sor második elem">;
  <input id="m10" type="number" step="any" value="0" aria-label="M második sor első elem">
  <input id="m11" type="number" step="any" value="0" aria-label="M második sor második elem">]
  <button id="pP">diag(1, 0)</button><button id="pA">[[2, −1], [1, 1]]</button>
</div>
<div class="ctl" role="group" aria-label="Interpoláció">
  <label for="t">t =</label><input id="t" type="range" min="0" max="1" step="0.01" value="1" aria-label="Interpoláció I-ből M-be">
  <b id="tv">1,00</b><span class="small">(1 − t)·I + t·M</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 660 382" role="img" aria-label="Az y=0, y=1 és x=1 egyenes és képük a megadott 2×2-es mátrixnál; szingulárisnál a két vízszintes egyenes képe egybeesik"></svg>
  
</div>
<p class="small">Számított, illusztratív. Kezdőállapot: diag(1, 0), t = 1 (det = 0): az y = 0 és y = 1 képe egyaránt az x tengely, az x = 1 egyenes képe az (1, 0) pont. A t csúszka az egységmátrixból (t = 0) a megadott mátrixba (t = 1) interpolál.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


const XL = [-4, 4], YL = [-3, 4], S = 50, OX = 20 - S * XL[0], OY = 10 + S * YL[1];
const X = p => OX + S * p[0], Y = p => OY - S * p[1];
function M(){ const t = +g("t").value, v = id => { const x = parseFloat(g(id).value); return isFinite(x) ? x : 0; };
  const m = [[v("m00"), v("m01")], [v("m10"), v("m11")]]; return [[(1 - t) + t * m[0][0], t * m[0][1]], [t * m[1][0], (1 - t) + t * m[1][1]]]; }
const ap = (m, p) => [m[0][0] * p[0] + m[0][1] * p[1], m[1][0] * p[0] + m[1][1] * p[1]];
function clipLine(p, d){ const ts = []; const BB = [XL, YL];
  for (let a = 0; a < 2; a++) { if (Math.abs(d[a]) < 1e-12) continue; for (const b of BB[a]) { const t = (b - p[a]) / d[a], q = [p[0] + t * d[0], p[1] + t * d[1]];
    if (q[0] >= XL[0] - 1e-9 && q[0] <= XL[1] + 1e-9 && q[1] >= YL[0] - 1e-9 && q[1] <= YL[1] + 1e-9) ts.push(t); } }
  if (ts.length < 2) return null; const t0 = Math.min(...ts), t1 = Math.max(...ts); return [[p[0] + t0 * d[0], p[1] + t0 * d[1]], [p[0] + t1 * d[0], p[1] + t1 * d[1]]]; }
function imgLine(m, p, d, o, lab){ const P0 = ap(m, p), D = ap(m, d);
  if (Math.hypot(D[0], D[1]) < 1e-9) { el("circle", Object.assign({cx: X(P0), cy: Y(P0), r: 7}, o.pt)); return "pont (" + hu(P0[0], 2) + "; " + hu(P0[1], 2) + ")"; }
  const L = clipLine(P0, D); if (L) el("line", Object.assign({x1: X(L[0]), y1: Y(L[0]), x2: X(L[1]), y2: Y(L[1])}, o.ln)); return "egyenes"; }
function draw(){
  svg.innerHTML = ""; const m = M(), det = m[0][0] * m[1][1] - m[0][1] * m[1][0];
  for (let i = XL[0]; i <= XL[1]; i++) el("line", {x1: X([i, 0]), y1: Y([0, YL[0]]), x2: X([i, 0]), y2: Y([0, YL[1]]), stroke: css("--grid")});
  for (let j = YL[0]; j <= YL[1]; j++) el("line", {x1: X([XL[0], 0]), y1: Y([0, j]), x2: X([XL[1], 0]), y2: Y([0, j]), stroke: css("--grid")});
  for (let i = XL[0]; i <= XL[1]; i++) el("text", {x: X([i, 0]), y: Y([0, YL[0]]) + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i).replace("-", "−"));
  for (let j = YL[0]; j <= YL[1]; j++) el("text", {x: X([XL[0], 0]) - 4, y: Y([0, j]) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(j).replace("-", "−"));
  const gr = css("--grid2");
  // eredeti egyenesek (szürke)
  el("line", {x1: X([XL[0], 0]), y1: Y([0, 0]), x2: X([XL[1], 0]), y2: Y([0, 0]), stroke: gr, "stroke-width": 1.2});
  el("line", {x1: X([XL[0], 0]), y1: Y([0, 1]), x2: X([XL[1], 0]), y2: Y([0, 1]), stroke: gr, "stroke-width": 1.2, "stroke-dasharray": "8 5"});
  el("line", {x1: X([1, 0]), y1: Y([0, YL[0]]), x2: X([1, 0]), y2: Y([0, YL[1]]), stroke: gr, "stroke-width": 1.2, "stroke-dasharray": "2 4"});
  const fg = css("--fg"), hl = css("--hl"), hl2 = css("--hl2");
  const r0 = imgLine(m, [0, 0], [1, 0], {ln: {stroke: fg, "stroke-width": 4}, pt: {fill: fg}});
  const r1 = imgLine(m, [0, 1], [1, 0], {ln: {stroke: hl, "stroke-width": 3, "stroke-dasharray": "10 6"}, pt: {fill: "none", stroke: hl, "stroke-width": 3}});
  const r2 = imgLine(m, [1, 0], [0, 1], {ln: {stroke: hl2, "stroke-width": 3, "stroke-dasharray": "2 5"}, pt: {fill: hl2}});
  const LX = 450; [["folytonos: y = 0 képe", fg, ""], ["szaggatott: y = 1 képe", hl, "10 6"], ["pontozott: x = 1 képe", hl2, "2 5"], ["szürke: eredeti egyenesek", gr, ""]].forEach((q, i) => {
    el("line", {x1: LX, y1: 40 + i * 24, x2: LX + 30, y2: 40 + i * 24, stroke: q[1], "stroke-width": 3, "stroke-dasharray": q[2]}); el("text", {x: LX + 38, y: 44 + i * 24, "font-size": 12}, q[0]); });
  // viszony
  const d = ap(m, [1, 0]), q = ap(m, [0, 1]); let rel;
  if (Math.hypot(d[0], d[1]) < 1e-9) rel = "mindkét vízszintes egyenes ponttá zsugorodik (" + (Math.hypot(q[0], q[1]) < 1e-9 ? "ugyanabba a pontba" : "két különböző pontba") + ")";
  else rel = Math.abs(d[0] * q[1] - d[1] * q[0]) < 1e-9 ? "egybeesik" : "párhuzamos (két különböző egyenes)";
  el("text", {x: LX, y: 160, "font-size": 13, "font-weight": "bold"}, "det = " + hu(det, 3));
  el("text", {x: LX, y: 182, "font-size": 12}, "y = 0 és y = 1 képe:"); el("text", {x: LX, y: 198, "font-size": 12, "font-weight": "bold"}, rel.length > 26 ? "ponttá zsugorodik" : rel.split(" (")[0]);
  el("text", {x: LX, y: 222, "font-size": 12}, "x = 1 képe: " + r2);
  g("tv").textContent = hu(+g("t").value, 2);
  g("status").textContent = "aktuális mátrix [[" + hu(m[0][0], 2) + ", " + hu(m[0][1], 2) + "], [" + hu(m[1][0], 2) + ", " + hu(m[1][1], 2) + "]]; det = " + hu(det, 3) +
    "; a két egyenes képe: " + rel + "; x = 1 képe: " + r2;
}
["m00", "m01", "m10", "m11", "t"].forEach(id => g(id).addEventListener("input", draw));
function setM(a){ ["m00", "m01", "m10", "m11"].forEach((id, i) => g(id).value = a[i]); g("t").value = 1; draw(); }
g("pP").onclick = () => setM([1, 0, 0, 0]); g("pA").onclick = () => setM([2, -1, 1, 1]);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
