<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A LoRA-réteg forwardja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<button id="first" title="Első lépés">⏮</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
<span id="cnt" class="small"></span>
<label for="r">rang r (1–8) =</label><input id="r" type="range" min="1" max="8" step="1" value="1" style="max-width:120px"><b id="rv"></b>
<label for="dd">m = n =</label><input id="dd" type="number" min="1" max="100000" value="3">
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 290" role="img" aria-label="A bemenet a fagyasztott W-n és a tanítható A–B szűk keresztmetszeten át halad, az ágak összege y; összeolvasztás után egyetlen W'"></svg>
<p id="mult" style="flex:1 1 100%;margin:0" aria-live="polite"></p>
</div>

<p class="small">r = 1: a 23.1.4 példájának B és A mátrixa; r > 1-nél a további oszlopok/sorok rögzített seedű egész számok (−1…2), α = r, így α/r = 1. Sraffozott doboz: fagyasztott; vastag keret: tanítható. Számított értékek; pl. m = n = 4096, r = 8: 65 536 vs 16 777 216.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
const W = [[2,0,1],[0,1,2],[1,1,0]], x = [1,1,1];
let step = 0, r = 1;
function mulberry32(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mats(r){
  // r = 1: a könyv B, A mátrixa; r > 1: a könyv oszlopa/sora + rögzített seedű egész oszlopok/sorok (−1…2)
  const rnd = mulberry32(2026), A = [[1,2,0]], B = [[1],[0],[1]];
  for (let k = 1; k < r; k++) { A.push([0,1,2].map(() => Math.floor(rnd()*4) - 1)); B.forEach(row => row.push(Math.floor(rnd()*4) - 1)); }
  return {A: A, B: B};
}
const mv = (M, v) => M.map(row => row.reduce((s, a, j) => s + a * v[j], 0));
function compute(){
  const {A, B} = mats(r), sc = 1;   // alpha = r, így alpha/r = 1
  const Wx = mv(W, x), Ax = mv(A, x), BAx = mv(B, Ax), y = Wx.map((v, i) => v + sc * BAx[i]);
  const Wm = W.map((row, i) => row.map((v, j) => v + sc * B[i].reduce((s, b, k) => s + b * A[k][j], 0)));
  return {A, B, Wx, Ax, BAx, y, Wm, Wmx: mv(Wm, x)};
}
const NSTEP = 6;
function vbox(v, x0, yc, opt){
  const h = 24, w = opt && opt.w || 30, n = v.length, top = yc - n*h/2;
  v.forEach((val, i) => { el("rect", {x: x0, y: top + i*h, width: w, height: h, fill: opt && opt.on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": opt && opt.on ? 2.5 : 1});
    el("text", {x: x0 + w/2, y: top + i*h + 16, "text-anchor": "middle", "font-size": 13}, String(val).replace("-", "−")); });
  if (opt && opt.label) el("text", {x: x0 + w/2, y: top - 6, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, opt.label);
  return x0 + w;
}
function mbox(M, x0, yc, opt){
  const cw = 22, h = 20, rr = M.length, c = M[0].length, wid = c*cw + 10, hei = rr*h + 10;
  el("rect", {x: x0, y: yc - hei/2, width: wid, height: hei, fill: opt.frozen ? "url(#hat)" : css("--cell"), stroke: css("--line"), "stroke-width": opt.frozen ? 1 : 3});
  M.forEach((row, i) => row.forEach((v, j) => {
    el("rect", {x: x0 + 5 + j*cw + 3, y: yc - hei/2 + 5 + i*h + 2, width: cw - 6, height: h - 4, fill: css("--bg"), stroke: "none"});
    el("text", {x: x0 + 5 + (j + 0.5)*cw, y: yc - hei/2 + 5 + i*h + 15, "text-anchor": "middle", "font-size": 12}, String(v).replace("-", "−")); }));
  el("text", {x: x0 + wid/2, y: yc - hei/2 - 6, "text-anchor": "middle", "font-size": 12}, opt.label);
  if (opt.on) el("rect", {x: x0 - 4, y: yc - hei/2 - 4, width: wid + 8, height: hei + 8, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
  return x0 + wid;
}
function arr(x0, y0, x1, y1, on){
  const L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0)/L, uy = (y1 - y0)/L, col = on ? css("--hl") : css("--fg");
  el("line", {x1: x0, y1: y0, x2: x1 - 8*ux, y2: y1 - 8*uy, stroke: col, "stroke-width": on ? 2.5 : 1.4});
  el("polygon", {points: `${x1},${y1} ${x1 - 10*ux - 4*uy},${y1 - 10*uy + 4*ux} ${x1 - 10*ux + 4*uy},${y1 - 10*uy - 4*ux}`, fill: col});
}
function draw(){
  step = Math.max(0, Math.min(NSTEP - 1, step));
  const R = compute(), s = step;
  svg.innerHTML = "";
  const defs = el("defs", {}), pat = el("pattern", {id: "hat", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("rect", {width: 6, height: 6, fill: css("--cellhl")}, undefined, pat);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: css("--muted"), "stroke-width": 1.4}, undefined, pat);
  const ex = Math.max(0, r - 3) * 24, yc = 150, yU = 70, yL = 235 + ex / 2;
  svg.setAttribute("viewBox", `0 0 640 ${290 + ex}`);
  const xe = vbox(x, 20, yc, {label: "x", on: s === 0});
  if (s < 5) {
    const we = mbox(W, 90, yU, {frozen: true, label: "W (fagyasztott, nem tanul)", on: s === 1});
    arr(xe, yc - 20, 90, yU + 10, s === 1);
    let wxe = we + 50; if (s >= 1) { arr(we, yU, we + 40, yU, s === 1); wxe = vbox(R.Wx, we + 40, yU, {label: "Wx", on: s === 1}); }
    const ae = mbox(R.A, 90, yL, {frozen: false, label: "A (tanítható)", on: s === 2});
    arr(xe, yc + 20, 90, yL - 10, s === 2);
    let axe = ae + 40;
    if (s >= 2) { arr(ae, yL, ae + 30, yL, s === 2); axe = vbox(R.Ax, ae + 30, yL, {w: 24, label: "Ax", on: s === 2}); el("text", {x: axe - 12, y: yL + R.Ax.length*12 + 16, "text-anchor": "middle", "font-size": 11}, `r = ${r}`); }
    const be = mbox(R.B, axe + 30, yL, {frozen: false, label: "B (tanítható)", on: s === 3});
    if (s >= 2) arr(axe, yL, axe + 30, yL, s === 3);
    let bxe = be + 40;
    if (s >= 3) { arr(be, yL, be + 30, yL, s === 3); bxe = vbox(R.BAx, be + 30, yL, {label: "B(Ax)", on: s === 3}); }
    const sx = Math.max(wxe, bxe) + 60;
    el("circle", {cx: sx, cy: yc, r: 16, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: sx, y: yc + 7, "text-anchor": "middle", "font-size": 20}, "+");
    if (s >= 4) { arr(wxe, yU, sx - 12, yc - 12, true); arr(bxe, yL, sx - 12, yc + 12, true);
      el("text", {x: (bxe + sx)/2 + 8, y: (yL + yc)/2 + 18, "font-size": 12}, "× α/r = 1");
      arr(sx + 16, yc, sx + 50, yc, true); vbox(R.y, sx + 50, yc, {label: "y", on: true}); }
  } else {
    const we = mbox(R.Wm, 110, yc, {frozen: false, label: "W′ = W + (α/r)BA", on: true});
    arr(xe, yc, 110, yc, true); arr(we, yc, we + 50, yc, true);
    vbox(R.Wmx, we + 50, yc, {label: "W′x", on: true});
    el("text", {x: 320, y: 270, "text-anchor": "middle", "font-size": 12}, "egy ág, egy mátrixszorzás: ugyanaz az y");
  }
  const st = [
    "1. lépés: a bemenet x = (1, 1, 1)ᵀ; két ágon halad tovább.",
    `2. lépés: Wx = (${R.Wx.join(", ")})ᵀ – a fagyasztott ág (W nem tanul).`,
    `3. lépés: Ax = ${r === 1 ? "1·1 + 2·1 + 0·1 = 3" : "(" + R.Ax.join(", ") + ")ᵀ"} – az r = ${r} dimenziós szűk keresztmetszet.`,
    `4. lépés: B(Ax) = (${R.BAx.join(", ")})ᵀ – vissza 3 dimenzióba.`,
    `5. lépés: y = Wx + (α/r)·B(Ax) = (${R.Wx.join(", ")}) + (${R.BAx.join(", ")}) = (${R.y.join(", ")})ᵀ.`,
    `6. lépés: összeolvasztás után W′x = (${R.Wmx.join(", ")})ᵀ – ugyanaz, egyetlen szorzással.`][s];
  E("status").textContent = st.replace(/-(\d)/g, "−$1");
  E("cnt").textContent = `${s + 1}/${NSTEP}`;
  E("rv").textContent = r;
  const d = Math.max(1, Math.round(+E("dd").value || 3));
  E("mult").textContent = `Plusz szorzás a LoRA-ágban (m = n = ${d}): r(m + n) = ${(r * 2 * d).toLocaleString("en").replace(/,/g, " ")}; a teljes W-szorzás mn = ${(d * d).toLocaleString("en").replace(/,/g, " ")}; ugyanennyi a tanítható paraméter: r(m + n) vs mn.`;
}
E("prev").onclick = () => { step--; draw(); };
E("next").onclick = () => { step++; draw(); };
E("first").onclick = () => { step = 0; draw(); };
E("r").addEventListener("input", () => { r = +E("r").value; draw(); });
E("dd").addEventListener("input", draw);
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") { step++; draw(); } if (e.key === "ArrowLeft") { step--; draw(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const qs = new URLSearchParams(location.search); if (qs.get("step")) step = +qs.get("step") - 1; if (qs.get("r")) { r = +qs.get("r"); E("r").value = r; } if (qs.get("d")) E("dd").value = qs.get("d");
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
