<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két sík metszete</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméter és nézet">
<label for="t">t = <b class="v" id="tv">0</b></label><input id="t" type="range" min="-2" max="2" step="0.1" value="0" aria-label="Paraméter t az egyenesen">
<label><input id="third" type="checkbox"> 3. sík: 3x+7y+6z=17</label>
</div>
<div class="ctl" role="group" aria-label="Forgatás">
<label for="yaw">forgatás</label><input id="yaw" type="range" min="-180" max="180" step="1" value="28" aria-label="Forgatás a függőleges tengely körül (fok)">
<label for="pitch">dőlés</label><input id="pitch" type="range" min="-10" max="80" step="0.5" value="24" aria-label="Dőlésszög (fok)">
<label for="zoom">nagyítás</label><input id="zoom" type="range" min="1" max="8" step="0.5" value="1" aria-label="Nagyítás">
<button id="along">Nézet az egyenes mentén</button><button id="reset">Alapnézet</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Két áttetsző sík a térben, metszetük egy vastag egyenes; a t csúszkával mozgatható pont az egyenesen; kapcsolóval egy harmadik, ellentmondó sík is megjeleníthető."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Számított, a 8.3.4 adataival: x = (3, 1, 0) + t(−2, 0, 1). A nézet húzással vagy a csúszkákkal forgatható; „Nézet az egyenes mentén”: az egyenes pontként, a síkok egyenesként látszanak.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }

function P3(p, yaw, pitch){ const a = yaw*Math.PI/180, b = pitch*Math.PI/180;
  const u = -p[0]*Math.sin(a) + p[1]*Math.cos(a), d = p[0]*Math.cos(a) + p[1]*Math.sin(a);
  return [u, p[2]*Math.cos(b) - d*Math.sin(b)]; }


const N1 = [1,2,2], N2 = [2,5,4], N3 = [3,7,6], XP = [3,1,0], D = [-2,0,1];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const add = (a,b,s) => [a[0]+s*b[0], a[1]+s*b[1], a[2]+s*b[2]];
function patch(n, c, t0, t1, w){ const base = add(XP, n, (c - dot(n, XP)) / dot(n, n));
  let wv = cross(n, D); const L = Math.hypot(...wv); wv = wv.map(v => v / L * w);
  return [add(add(base, D, t0), wv, -1), add(add(base, D, t1), wv, -1), add(add(base, D, t1), wv, 1), add(add(base, D, t0), wv, 1)]; }
let yaw = 28, pitch = 24;
function draw(){
  const t = +document.getElementById("t").value, third = document.getElementById("third").checked;
  yaw = +document.getElementById("yaw").value; pitch = +document.getElementById("pitch").value;
  const zoom = +document.getElementById("zoom").value;
  document.getElementById("tv").textContent = hu(t, 1);
  svg.innerHTML = "";
  const cen = P3(add(XP, D, 0.5), yaw, pitch), sc = 42 * zoom;
  const S = p => { const q = P3(p, yaw, pitch); return [280 + (q[0] - cen[0]) * sc, 200 - (q[1] - cen[1]) * sc]; };
  const poly = (pts, o) => el("polygon", {points: pts.map(S).map(q => q.join(",")).join(" "), fill: o.fill, stroke: css("--fg"), "stroke-width": 1, "stroke-dasharray": o.dash || ""});
  // tengelyek
  [[[4.2,0,0],"x"],[[0,3.2,0],"y"],[[0,0,2.8],"z"]].forEach(([p, l]) => { const a = S([0,0,0]), b = S(p); vec(a[0], a[1], b[0], b[1], {color: css("--muted"), w: 1.2, head: 8}); txt(b[0] + 8, b[1] - 4, l, {fs: 13, color: css("--muted")}); });
  poly(patch(N1, 5, -1.2, 2.2, 2.4), {fill: css("--fill1")});
  poly(patch(N2, 11, -1.2, 2.2, 1.3), {fill: css("--fill2"), dash: "6 3"});
  if (third) poly(patch(N3, 17, -1.2, 2.2, 2.4), {fill: css("--fill3"), dash: "3 3"});
  const q1 = patch(N1, 5, -1.2, 2.2, 2.4)[3], q2 = patch(N2, 11, -1.2, 2.2, 1.3)[2];
  let a = S(q1); txt(a[0], a[1] - 6, "S₁", {fs: 13, color: css("--hl")}); a = S(q2); txt(a[0], a[1] - 6, "S₂", {fs: 13, color: css("--hl2")});
  if (third) { a = S(patch(N3, 17, -1.2, 2.2, 2.4)[1]); txt(a[0], a[1] + 16, "3. sík (17)", {fs: 12, color: css("--hl3")}); }
  const L0 = S(add(XP, D, -1.2)), L1 = S(add(XP, D, 2.2));
  el("line", {x1: L0[0], y1: L0[1], x2: L1[0], y2: L1[1], stroke: css("--fg"), "stroke-width": 4, "stroke-linecap": "round"});
  const p0 = S(XP), pv = S(add(XP, D, 1)); vec(p0[0], p0[1], pv[0], pv[1], {color: css("--hl2"), w: 2.5});
  el("circle", {cx: p0[0], cy: p0[1], r: 5, fill: css("--fg")}); txt(p0[0] + 8, p0[1] + 16, "x_p (t = 0)", {anchor: "start", fs: 12});
  el("circle", {cx: pv[0], cy: pv[1], r: 5, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2}); txt(pv[0] - 8, pv[1] - 8, "(1, 1, 1), t = 1", {anchor: "end", fs: 12});
  const X = add(XP, D, t), pp = S(X);
  el("circle", {cx: pp[0], cy: pp[1], r: 7, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 3});
  const r1 = dot(N1, X), r2 = dot(N2, X), r3 = dot(N3, X);
  let st = `(${X.map(v => hu(v, 2)).join(", ")}); x+2y+2z=${hu(r1, 2)}, 2x+5y+4z=${hu(r2, 2)}`;
  if (third) st += `; 3x+7y+6z=${hu(r3, 2)} ≠ 17 – az egyenes egyetlen pontja sem elégíti ki a 3. egyenletet: nincs közös pont (a 3. sík 1/√94 ≈ 0,103 távolságra párhuzamos a 3x+7y+6z=16 síkkal).`;
  document.getElementById("status").textContent = st;
}
["t", "third", "yaw", "pitch", "zoom"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("along").onclick = () => { document.getElementById("yaw").value = 180; document.getElementById("pitch").value = 26.5; document.getElementById("zoom").value = 6; draw(); };
document.getElementById("reset").onclick = () => { document.getElementById("yaw").value = 28; document.getElementById("pitch").value = 24; document.getElementById("zoom").value = 1; draw(); };
let drag = null;
svg.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, yaw, pitch]; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => { if (!drag) return; const Y = document.getElementById("yaw"), Pt = document.getElementById("pitch");
  Y.value = Math.max(-180, Math.min(180, drag[2] - (e.clientX - drag[0]) * 0.5)); Pt.value = Math.max(-10, Math.min(80, drag[3] + (e.clientY - drag[1]) * 0.4)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
