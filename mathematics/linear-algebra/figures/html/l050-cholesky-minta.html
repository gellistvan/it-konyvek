    "t = " + fmt(t, 2) + ": L = [[" + fmt(Lc[0][0], 3) + "; 0]; [" + fmt(Lc[1][0], 3) + "; " + fmt(Lc[1][1], 3) + "]], e₁ képe (" + fmt(m1[0], 3) + "; " + fmt(m1[1], 3) +
    "), e₂ képe (" + fmt(m2[0], 3) + "; " + fmt(m2[1], 3) + "), féltengelyek " + fmt(Math.sqrt(mm + rr), 3) + " és " + fmt(Math.sqrt(Math.max(0, mm - rr)), 3) +
    "<br>elméleti korreláció (t = 1) " + fmt(rhoT, 3) + ", empirikus (ez az 500 pont): " + fmt(sxy/Math.sqrt(sxx*syy), 3);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("play").onclick = () => { if (timer) { stop(); return; } if (+$("t").value >= 1) $("t").value = 0;
  $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const t = Math.min(1, +$("t").value + 0.02); $("t").value = t; draw(); if (t >= 1) stop(); }, 40); };
$("t").addEventListener("input", () => { stop(); draw(); });
function apply(){ const a = +$("ia").value, b = +$("ib").value, c = +$("ic").value, r = chol(a, b, c);
  if (r.err) { err = r.err; $("lc").textContent = "A = [[" + fmt(a, 2) + "; " + fmt(b, 2) + "]; [" + fmt(b, 2) + "; " + fmt(c, 2) + "]] – a Cholesky-felbontás nem létezik"; }
  else { err = ""; Lc = r.L; Ac = [[a, b], [b, c]]; $("lc").textContent = "A = [[" + fmt(a, 2) + "; " + fmt(b, 2) + "]; [" + fmt(b, 2) + "; " + fmt(c, 2) + "]] → L = [[" + fmt(Lc[0][0], 3) + "; 0]; [" + fmt(Lc[1][0], 3) + "; " + fmt(Lc[1][1], 3) + "]]"; }
  stop(); draw(); }
$("go").onclick = apply;
["ia", "ib", "ic"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") apply(); }));
$("reset").onclick = () => { $("ia").value = 4; $("ib").value = 2; $("ic").value = 5; apply(); };
$("bad").onclick = () => { $("ia").value = 1; $("ib").value = 2; $("ic").value = 1; apply(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
$("lc").textContent = "A = [[4; 2]; [2; 5]] → L = [[2; 0]; [1; 2]]";
draw();

</script>
