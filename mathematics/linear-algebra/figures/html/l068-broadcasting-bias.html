<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A bias broadcastingja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="radio" name="br" id="okb" checked> helyes b (3,)</label> <label><input type="radio" name="br" id="errb"> hibás b[:, None] (3,1)</label><script>const OKS = [{"msg": "1. A két shape jobbra igazítva: XWᵀ (4, 3) és b (3,).", "line": 1, "A": ["4", "3"], "B": ["", "3"], "cmp": -1, "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "2. A rövidebb shape-et balról 1-essel egészítjük ki: (3,) → (1, 3).", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": -1, "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "3a. Utolsó tengely: 3 vs 3 – egyezik.", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": 1, "res": "egyezik", "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "3b. Első tengely: 4 vs 1 – az 1 kiterjeszthető 4-re.", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": 0, "res": "kiterjeszthető", "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "4. A [10, 20, 30] sor virtuálisan ismétlődik a 2–4. sorban (pontozott keret) – a memóriában nem másolódik.", "line": 2, "A": ["4", "3"], "B": ["4", "3"], "cmp": -1, "virt": 1, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "5. Eredmény: Z = [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]], shape (4, 3).", "line": 2, "A": ["4", "3"], "B": ["4", "3"], "cmp": -1, "virt": 1, "z": 1, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}], ERRS = [{"msg": "Hibaág 1. b[:, None] alakja (3, 1); jobbra igazítva: (4, 3) és (3, 1).", "line": 3, "A": ["4", "3"], "B": ["3", "1"], "cmp": -1, "virt": 0, "z": 0, "err": 1, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "Hibaág 2. Utolsó tengely: 3 vs 1 – rendben (az 1 kiterjeszthető).", "line": 4, "A": ["4", "3"], "B": ["3", "1"], "cmp": 1, "res": "rendben", "virt": 0, "z": 0, "err": 1, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "Hibaág 3. Első tengely: 4 vs 3 – nem egyezik, és egyik sem 1 → ValueError: operands could not be broadcast together with shapes (4,3) (3,1)", "line": 4, "A": ["4", "3"], "B": ["3", "1"], "cmp": 0, "res": "HIBA", "virt": 0, "z": 0, "err": 1, "bad": 1, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}];document.getElementById("okb").addEventListener("change", () => setSteps(OKS));document.getElementById("errb").addEventListener("change", () => setSteps(ERRS));</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 4×3-as XWᵀ mátrixhoz a 10, 20, 30 sor minden sorban virtuálisan hozzáadódik; hibaágban a (3,1) alak hibát ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.2.4 kidolgozott példája. A hibaüzenet a NumPy valódi kimenete. Pontozott keret: virtuális ismétlés (0 sorlépésköz, nincs másolat).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. A két shape jobbra igazítva: XWᵀ (4, 3) és b (3,).", "line": 1, "A": ["4", "3"], "B": ["", "3"], "cmp": -1, "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "2. A rövidebb shape-et balról 1-essel egészítjük ki: (3,) → (1, 3).", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": -1, "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "3a. Utolsó tengely: 3 vs 3 – egyezik.", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": 1, "res": "egyezik", "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "3b. Első tengely: 4 vs 1 – az 1 kiterjeszthető 4-re.", "line": 2, "A": ["4", "3"], "B": ["1", "3"], "cmp": 0, "res": "kiterjeszthető", "virt": 0, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "4. A [10, 20, 30] sor virtuálisan ismétlődik a 2–4. sorban (pontozott keret) – a memóriában nem másolódik.", "line": 2, "A": ["4", "3"], "B": ["4", "3"], "cmp": -1, "virt": 1, "z": 0, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}, {"msg": "5. Eredmény: Z = [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]], shape (4, 3).", "line": 2, "A": ["4", "3"], "B": ["4", "3"], "cmp": -1, "virt": 1, "z": 1, "XW": [[3, 2, 2], [7, 6, 4], [11, 10, 6], [15, 14, 8]], "b": [10, 20, 30], "Z": [[13, 22, 32], [17, 26, 34], [21, 30, 36], [25, 34, 38]]}];
const CODE = ["XW = X @ W.T                 # shape (4, 3)", "b = np.array([10, 20, 30])   # shape (3,)", "Z = XW + b                   # (3,) → (1, 3) → (4, 3)", "b_hibas = b[:, None]         # shape (3, 1)", "Z = XW + b_hibas             # ValueError"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 600 300");
  svg.innerHTML = "";
  const u = 34, fg = css("--fg"), mu = css("--muted");
  // shape-összevetés
  el("text", {x: 20, y: 24, "font-size": 14, "font-weight": "bold"}, "shape-összevetés (jobbról balra)");
  const rows = [["XWᵀ", s.A], [s.err ? "b[:, None]" : (s.virt ? "b kiterj." : "b"), s.B]];
  rows.forEach((r, i) => { el("text", {x: 20, y: 52 + i * 24, "font-size": 14}, r[0]);
    r[1].forEach((v, j) => { const x = 110 + j * 40, on = s.cmp === j;
      el("rect", {x: x - 4, y: 36 + i * 24, width: 32, height: 22, fill: on ? css("--cellhl") : "none", stroke: on ? fg : "none", "stroke-width": on ? 2 : 0});
      el("text", {x: x + 12, y: 52 + i * 24, "text-anchor": "middle", "font-size": 15, "font-family": "monospace"}, v === "" ? "·" : v); }); });
  if (s.cmp >= 0) el("text", {x: 200, y: 64, "font-size": 14, "font-weight": "bold", fill: s.bad ? css("--hl2") : fg},
     `${s.A[s.cmp]} vs ${s.B[s.cmp]}: ${s.res}`);
  // mátrixok
  const y0 = 110;
  function grid(M, x0, opts){ M.forEach((row, i) => row.forEach((v, j) => {
      const virt = opts.virt && i > 0, hide = opts.hide && i > 0;
      if (hide) return;
      el("rect", {x: x0 + j * u, y: y0 + i * u, width: u, height: u, fill: opts.fill || css("--cell"), stroke: virt ? mu : fg, "stroke-width": virt ? 1.2 : 1.2, "stroke-dasharray": virt ? "2 3" : (opts.dash ? "6 3" : "")});
      el("text", {x: x0 + j * u + u / 2, y: y0 + i * u + u / 2 + 5, "text-anchor": "middle", "font-size": 14, fill: virt ? mu : fg, "font-style": virt ? "italic" : "normal"}, String(v)); })); }
  grid(s.XW, 20, {fill: css("--cellhl")});
  el("text", {x: 20 + 1.5 * u, y: y0 + 4 * u + 20, "text-anchor": "middle", "font-size": 13}, "XWᵀ (4, 3)");
  el("text", {x: 145, y: y0 + 2 * u + 6, "text-anchor": "middle", "font-size": 22}, "+");
  if (!s.err) {
    grid([s.b, s.b, s.b, s.b], 165, {virt: true, hide: !s.virt});
    el("text", {x: 165 + 1.5 * u, y: y0 + 4 * u + 20, "text-anchor": "middle", "font-size": 13}, s.virt ? "b → (4, 3), virtuális" : (s.B[0] === "1" ? "b (1, 3)" : "b (3,)"));
    if (s.virt) el("text", {x: 165 + 1.5 * u, y: y0 + 4 * u + 36, "text-anchor": "middle", "font-size": 12, fill: mu}, "nem másolódik a memóriában");
    el("text", {x: 290, y: y0 + 2 * u + 6, "text-anchor": "middle", "font-size": 22}, "=");
    if (s.z) { grid(s.Z, 310, {fill: css("--cellhl")}); el("text", {x: 310 + 1.5 * u, y: y0 + 4 * u + 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Z (4, 3)"); }
    else el("text", {x: 310 + 1.5 * u, y: y0 + 2 * u + 6, "text-anchor": "middle", "font-size": 22, fill: mu}, "?");
  } else {
    grid(s.b.map(v => [v]), 165, {dash: true});
    el("text", {x: 165 + u / 2, y: y0 + 3 * u + 20, "text-anchor": "middle", "font-size": 13}, "(3, 1)");
    if (s.bad) { el("line", {x1: 155, y1: y0 - 6, x2: 165 + u + 10, y2: y0 + 3 * u + 6, stroke: css("--hl2"), "stroke-width": 3});
      el("line", {x1: 155, y1: y0 + 3 * u + 6, x2: 165 + u + 10, y2: y0 - 6, stroke: css("--hl2"), "stroke-width": 3});
      el("text", {x: 230, y: y0 + 1.5 * u, "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, "ValueError:");
      el("text", {x: 230, y: y0 + 1.5 * u + 20, "font-size": 13, "font-family": "monospace"}, "operands could not be broadcast");
      el("text", {x: 230, y: y0 + 1.5 * u + 38, "font-size": 13, "font-family": "monospace"}, "together with shapes (4,3) (3,1)"); }
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
