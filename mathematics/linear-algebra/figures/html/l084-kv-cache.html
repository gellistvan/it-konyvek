<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KV-cache: lépésköltség és memória</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="d">d =</label><input id="d" type="range" min="0" max="2" step="1" value="0" style="max-width:90px"><b id="dv"></b>
<label for="L">L =</label><input id="L" type="range" min="0" max="2" step="1" value="1" style="max-width:90px"><b id="Lv"></b>
<label for="T0">T₀ =</label><input id="T0" type="range" min="1" max="2048" step="1" value="128"><b id="T0v"></b>
<label for="N">új tokenek =</label><input id="N" type="range" min="10" max="4000" step="10" value="1000"><b id="Nv"></b>
<label><input id="log" type="checkbox" checked> logaritmikus y tengely</label>
<label for="t">kijelölt lépés t:</label><input id="t" type="range" min="129" max="1128" step="1" value="600">
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 620 290" role="img" aria-label="Egy generálási lépés flop-költsége KV-cache-sel és nélküle, valamint a cache mérete a lépésszám függvényében"></svg>
<p id="sum" style="flex:1 1 100%;margin:0" aria-live="polite"></p>
</div>

<p class="small">Képletek a 22.5.6–22.5.9-ből: cache-sel L(24d² + 4td), cache nélkül L(24td² + 4t²d) flop lépésenként; a prefill L(24T₀d² + 4T₀²d); a cache 2·L·t·d szám (B = 1, h_kv·d_h = d). Az egér a görbék felett kijelöli a lépést. Elméleti modell (flop-számlálás), nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
const DS = [64, 256, 1024], LS_ = [6, 12, 24];
let tSel = 600;
function sci(x){ if (x < 1e7) return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e); return fmt(m, 4).replace(/0+$/, "").replace(/,$/, "") + "·10" + String(e).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join(""); }
function draw(){
  const d = DS[+E("d").value], L = LS_[+E("L").value], T0 = +E("T0").value, N = +E("N").value, logy = E("log").checked;
  E("dv").textContent = d; E("Lv").textContent = L; E("T0v").textContent = T0; E("Nv").textContent = N;
  const t1 = T0 + 1, t2 = T0 + N;
  E("t").min = t1; E("t").max = t2; tSel = Math.max(t1, Math.min(t2, tSel)); E("t").value = tSel;
  const fc = t => L * (24*d*d + 4*t*d), fn = t => L * (24*t*d*d + 4*t*t*d), fm = t => 2*L*t*d;
  let sc = 0, sn = 0; for (let t = t1; t <= t2; t++) { sc += fc(t); sn += fn(t); }
  const pre = L * (24*T0*d*d + 4*T0*T0*d);
  svg.innerHTML = "";
  // bal panel
  const X0 = 62, X1 = 330, Y0 = 20, Y1 = 250, xs = t => X0 + (X1 - X0) * (t - t1) / Math.max(1, t2 - t1);
  const ymax = fn(t2), ymin = fc(t1);
  const lo = logy ? Math.floor(Math.log10(ymin)) : 0, hi = logy ? Math.ceil(Math.log10(ymax)) : ymax * 1.05;
  const ys = v => logy ? Y1 - (Y1 - Y0) * (Math.log10(v) - lo) / (hi - lo) : Y1 - (Y1 - Y0) * v / hi;
  if (logy) for (let e = lo; e <= hi; e++) { el("line", {x1: X0, y1: ys(Math.pow(10, e)), x2: X1, y2: ys(Math.pow(10, e)), stroke: css("--grid")}); el("text", {x: X0 - 5, y: ys(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 10}, "10" + String(e).split("").map(c => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("")); }
  else for (let q = 0; q <= 4; q++) { const v = hi * q / 4; el("line", {x1: X0, y1: ys(v), x2: X1, y2: ys(v), stroke: css("--grid")}); el("text", {x: X0 - 5, y: ys(v) + 4, "text-anchor": "end", "font-size": 9}, q ? sci(v) : "0"); }
  el("line", {x1: X0, y1: Y1, x2: X1, y2: Y1, stroke: css("--line")}); el("line", {x1: X0, y1: Y0, x2: X0, y2: Y1, stroke: css("--line")});
  [t1, Math.round((t1 + t2) / 2), t2].forEach(tt => el("text", {x: xs(tt), y: Y1 + 15, "text-anchor": "middle", "font-size": 10}, String(tt)));
  el("text", {x: (X0 + X1) / 2, y: Y1 + 31, "text-anchor": "middle", "font-size": 11}, "lépés t (prefixhossz)");
  el("text", {x: 12, y: (Y0 + Y1) / 2, "text-anchor": "middle", "font-size": 11, transform: `rotate(-90 12 ${(Y0 + Y1) / 2})`}, "flop / lépés" + (logy ? " (log)" : ""));
  const path = f => { let p = ""; for (let i = 0; i <= 200; i++) { const tt = t1 + (t2 - t1) * i / 200; p += (p ? "L" : "M") + xs(tt).toFixed(1) + "," + ys(f(tt)).toFixed(1); } return p; };
  el("path", {d: path(fn), fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("path", {d: path(fc), fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
  el("text", {x: X1 - 4, y: ys(fn(t2)) + 16, "text-anchor": "end", "font-size": 10.5}, "cache nélkül");
  el("text", {x: X1 - 4, y: ys(fc(t2)) - 7, "text-anchor": "end", "font-size": 10.5, fill: css("--hl")}, "KV-cache-sel");
  el("line", {x1: xs(tSel), y1: Y0, x2: xs(tSel), y2: Y1, stroke: css("--hl2"), "stroke-width": 1.5});
  el("circle", {cx: xs(tSel), cy: ys(fc(tSel)), r: 4.5, fill: css("--hl")});
  el("polygon", {points: `${xs(tSel)},${ys(fn(tSel)) - 6} ${xs(tSel) - 5},${ys(fn(tSel)) + 4} ${xs(tSel) + 5},${ys(fn(tSel)) + 4}`, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5});
  // jobb panel: cache mérete
  const raw = fm(t2) * 1.05 / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), mmax = 4 * Math.ceil(raw / mag) * mag;
  const U0 = 420, U1 = 600, ym = v => Y1 - (Y1 - Y0) * v / mmax, xm = t => U0 + (U1 - U0) * (t - t1) / Math.max(1, t2 - t1);
  for (let q = 0; q <= 4; q++) { const v = mmax * q / 4; el("line", {x1: U0, y1: ym(v), x2: U1, y2: ym(v), stroke: css("--grid")}); el("text", {x: U0 - 5, y: ym(v) + 4, "text-anchor": "end", "font-size": 9}, q ? sci(v) : "0"); }
  el("line", {x1: U0, y1: Y1, x2: U1, y2: Y1, stroke: css("--line")}); el("line", {x1: U0, y1: Y0, x2: U0, y2: Y1, stroke: css("--line")});
  el("line", {x1: xm(t1), y1: ym(fm(t1)), x2: xm(t2), y2: ym(fm(t2)), stroke: css("--fg"), "stroke-width": 2});
  el("circle", {cx: xm(tSel), cy: ym(fm(tSel)), r: 4.5, fill: css("--hl2")});
  [t1, t2].forEach(tt => el("text", {x: xm(tt), y: Y1 + 15, "text-anchor": "middle", "font-size": 10}, String(tt)));
  el("text", {x: (U0 + U1) / 2, y: Y1 + 31, "text-anchor": "middle", "font-size": 11}, "cache mérete: 2Ltd szám");
  E("status").textContent = `t = ${tSel}: cache-sel ${sci(fc(tSel))} flop, cache nélkül ${sci(fn(tSel))} flop; cache ${sci(fm(tSel))} szám (FP16 ≈ ${fmt(fm(tSel) * 2 / 1048576, 2)} MiB)`;
  E("sum").textContent = `Összesen (t = ${t1}…${t2}): cache-sel ${sci(sc)} flop + prefill ${sci(pre)} flop; cache nélkül ${sci(sn)} flop (arány ≈ ${Math.round(sn / sc)}×).`;
}
["d", "L", "T0", "N", "log"].forEach(id => E(id).addEventListener("input", draw));
E("t").addEventListener("input", () => { tSel = +E("t").value; draw(); });
svg.addEventListener("pointermove", e => { const p = svgPoint(e); const t1 = +E("t").min, t2 = +E("t").max;
  let x = null; if (p.x >= 62 && p.x <= 330) x = (p.x - 62) / 268; else if (p.x >= 420 && p.x <= 600) x = (p.x - 420) / 180;
  if (x !== null) { tSel = Math.round(t1 + x * (t2 - t1)); draw(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
