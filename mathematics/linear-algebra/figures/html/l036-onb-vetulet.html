<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortonormált koordináták</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Bázis forgatása">
<label for="th">θ = <b class="v" id="thv">36,87°</b></label><input id="th" type="range" min="0" max="90" step="0.01" value="36.8699" aria-label="A bázis forgatási szöge fokban">
<button id="rst">Kezdőállapot</button>
<span class="small">Az x végpontja egérrel/ujjal húzható; nyílbillentyűk: x mozgatása 0,1-gyel (a rajzra kattintás után).</span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 420 365" role="img" aria-label="Forgatott merőleges tengelyek q1 és q2 irányában; az x vektor merőleges vetületei a két tengelyen, hosszuk az x koordinátái ebben a bázisban."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Kezdőállapot: θ = 36,87°, így q1 = (0,8; 0,6), q2 = (−0,6; 0,8), x = (2; 1), c1 = 2,2, c2 = −0,4. Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }


let X = [2, 1];
const sc = 95, ox = 1.35 * sc, oy = 2.55 * sc, SX = v => ox + v * sc, SY = v => oy - v * sc;
function draw(){
  const th = +document.getElementById("th").value * Math.PI / 180;
  document.getElementById("thv").textContent = hu(th * 180 / Math.PI, 2) + "°";
  const q1 = [Math.cos(th), Math.sin(th)], q2 = [-Math.sin(th), Math.cos(th)];
  const c1 = q1[0] * X[0] + q1[1] * X[1], c2 = q2[0] * X[0] + q2[1] * X[1];
  const p1 = [c1 * q1[0], c1 * q1[1]], p2 = [c2 * q2[0], c2 * q2[1]];
  svg.innerHTML = "";
  for (let g = -1; g <= 3; g++) { el("line", {x1: SX(g), y1: SY(-1.25), x2: SX(g), y2: SY(2.6), stroke: css("--grid")}); }
  for (let g = -1; g <= 2; g++) { el("line", {x1: SX(-1.35), y1: SY(g), x2: SX(3.0), y2: SY(g), stroke: css("--grid")}); }
  el("line", {x1: SX(-1.35), y1: SY(0), x2: SX(3), y2: SY(0), stroke: css("--muted")}); el("line", {x1: SX(0), y1: SY(-1.25), x2: SX(0), y2: SY(2.6), stroke: css("--muted")});
  [[q1, "q1 tengely"], [q2, "q2 tengely"]].forEach(([q, l]) => { el("line", {x1: SX(-3 * q[0]), y1: SY(-3 * q[1]), x2: SX(3 * q[0]), y2: SY(3 * q[1]), stroke: css("--fg"), "stroke-dasharray": "2 4"}); });
  el("polyline", {points: [p2, X, p1].map(p => SX(p[0]) + "," + SY(p[1])).join(" "), fill: "none", stroke: css("--muted"), "stroke-width": 1.2});
  const ra = (f, a, b) => { const s = 0.09, la = Math.hypot(...a), lb = Math.hypot(...b); if (la < 1e-9 || lb < 1e-9) return;
    const A = [a[0] / la * s, a[1] / la * s], B = [b[0] / lb * s, b[1] / lb * s];
    el("polyline", {points: [[f[0] + B[0], f[1] + B[1]], [f[0] + A[0] + B[0], f[1] + A[1] + B[1]], [f[0] + A[0], f[1] + A[1]]].map(p => SX(p[0]) + "," + SY(p[1])).join(" "), fill: "none", stroke: css("--muted")}); };
  ra(p1, [-p1[0], -p1[1]], [X[0] - p1[0], X[1] - p1[1]]); ra(p2, [-p2[0], -p2[1]], [X[0] - p2[0], X[1] - p2[1]]);
  vec(SX(0), SY(0), SX(p1[0]), SY(p1[1]), {color: css("--hl2"), dash: "6 4", w: 2});
  vec(SX(0), SY(0), SX(p2[0]), SY(p2[1]), {color: css("--hl2"), dash: "6 4", w: 2, head: 8});
  vec(SX(0), SY(0), SX(q1[0]), SY(q1[1]), {color: css("--hl"), w: 2.4}); vec(SX(0), SY(0), SX(q2[0]), SY(q2[1]), {color: css("--hl"), w: 2.4});
  txt(SX(q1[0]) + 4, SY(q1[1]) - 8, "q1", {fs: 14, color: css("--hl"), anchor: "start"}); txt(SX(q2[0]) - 6, SY(q2[1]) - 6, "q2", {fs: 14, color: css("--hl"), anchor: "end"});
  vec(SX(0), SY(0), SX(X[0]), SY(X[1]), {w: 3.2});
  el("circle", {cx: SX(X[0]), cy: SY(X[1]), r: 9, fill: css("--fill1"), stroke: css("--fg"), "stroke-width": 1.5, id: "handle", style: "cursor:grab"});
  txt(SX(X[0]) + 12, SY(X[1]) + 5, `x = (${hu(X[0], 2)}; ${hu(X[1], 2)})`, {fs: 14, anchor: "start"});
  txt(SX(p1[0]) - 12, SY(p1[1]) - 10, `c1·q1, c1 = ${hu(c1, 3)}`, {fs: 13, color: css("--hl2"), anchor: "end"});
  txt(SX(p2[0]) + 8, SY(p2[1]) + 18, `c2·q2, c2 = ${hu(c2, 3)}`, {fs: 13, color: css("--hl2"), anchor: "start"});
  const nx = X[0] * X[0] + X[1] * X[1];
  document.getElementById("status").textContent = `c1 = ${hu(c1, 3)}; c2 = ${hu(c2, 3)}; c1²+c2² = ${hu(c1 * c1 + c2 * c2, 3)} = ‖x‖²` +
    (c2 < -1e-9 ? " – a c2 negatív: a vetület a q2-vel ellentétes irányba mutat." : c1 < -1e-9 ? " – a c1 negatív: a vetület a q1-gyel ellentétes irányba mutat." : "");
}
function toWorld(e){ const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  const px = (e.clientX - r.left) / r.width * vb.width, py = (e.clientY - r.top) / r.height * vb.height;
  return [Math.round((px - ox) / sc * 20) / 20, Math.round((oy - py) / sc * 20) / 20]; }
let drag = false;
svg.setAttribute("tabindex", "0");
svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); X = toWorld(e); draw(); });
svg.addEventListener("pointermove", e => { if (!drag) return; const w = toWorld(e); X = [Math.max(-1.3, Math.min(2.9, w[0])), Math.max(-1.2, Math.min(2.5, w[1]))]; draw(); });
svg.addEventListener("pointerup", () => { drag = false; });
svg.addEventListener("keydown", e => { const d = {ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1]}[e.key];
  if (d) { e.preventDefault(); X = [Math.round((X[0] + d[0]) * 10) / 10, Math.round((X[1] + d[1]) * 10) / 10]; draw(); } });
document.getElementById("th").addEventListener("input", draw);
document.getElementById("rst").onclick = () => { X = [2, 1]; document.getElementById("th").value = 36.8699; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
