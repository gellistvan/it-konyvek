<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szelőből érintő: f(x) = x² az 1 pontban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="h értéke">
  <label for="u">h</label><input id="u" type="range" min="-100" max="100" step="1" value="100" aria-label="h, logaritmikus finomítással a 0 körül"><b id="hv"></b>
</div>
<div class="ctl" role="group" aria-label="A táblázat h-értékei">
  <button data-h="1">h = 1</button><button data-h="0.5">0,5</button><button data-h="0.1">0,1</button><button data-h="0.01">0,01</button><button data-h="-0.01">−0,01</button><button data-h="-0.1">−0,1</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 355" role="img" aria-label="Parabola az (1,1) pontban; a szelő a h csúszkával mozgatott második ponton át, az érintő és a h² hiba szakasza; balra teljes nézet, jobbra nagyítás"></svg>
<p class="small">A csúszka logaritmikus: |h| 0,001 és 1 között, középen h = 0 (nem értelmezett). A meredekség 2 + h, az érintő hibája f(1 + h) − (1 + 2h) = h², ezért a nagyított nézetben is egyre kisebb a szakasz a h-hoz képest. Számított értékek a definícióból.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let H = 1;
const uToH = u => u === 0 ? 0 : Math.sign(u)*Math.pow(10, 3*(Math.abs(u)/100 - 1));
const hToU = h => h === 0 ? 0 : Math.sign(h)*Math.round(100*(1 + Math.log10(Math.abs(h))/3));
function num(x){ let s = x.toFixed(8); s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function panel(ox, w, xl, yl, h, title){
  const L = ox + 40, R = ox + w - 8, T = 30, B = 300;
  const X = x => L + (R - L)*(x - xl[0])/(xl[1] - xl[0]), Y = y => B - (B - T)*(y - yl[0])/(yl[1] - yl[0]);
  const fg = css("--fg"), mu = css("--muted");
  el("rect", {x: L, y: T, width: R - L, height: B - T, fill: "none", stroke: css("--grid")});
  el("text", {x: (L + R)/2, y: 20, "text-anchor": "middle", "font-size": 13}, title);
  const cp = id => { const c = el("clipPath", {id}); const r = document.createElementNS(NS, "rect"); r.setAttribute("x", L); r.setAttribute("y", T); r.setAttribute("width", R - L); r.setAttribute("height", B - T); c.appendChild(r); return "url(#" + id + ")"; };
  const clip = cp("c" + ox);
  const curve = (g, at) => { const pts = []; for (let i = 0; i <= 200; i++) { const x = xl[0] + (xl[1] - xl[0])*i/200; pts.push(X(x).toFixed(1) + "," + Y(g(x)).toFixed(1)); }
    el("polyline", Object.assign({points: pts.join(" "), fill: "none", "clip-path": clip}, at)); };
  curve(x => x*x, {stroke: fg, "stroke-width": 2.2});
  curve(x => 2*x - 1, {stroke: fg, "stroke-width": 1.8, "stroke-dasharray": "2 4"});
  if (h !== 0) curve(x => 1 + (2 + h)*(x - 1), {stroke: css("--hl2"), "stroke-width": 1.8, "stroke-dasharray": "8 5"});
  [[xl[0], xl[1]], [yl[0], yl[1]]].forEach((r, i) => [r[0], (r[0] + r[1])/2, r[1]].forEach(v => {
    if (i === 0) el("text", {x: X(v), y: B + 15, "text-anchor": "middle", "font-size": 10, fill: mu}, num(+v.toPrecision(4)));
    else el("text", {x: L - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 10, fill: mu}, num(+v.toPrecision(4))); }));
  el("circle", {cx: X(1), cy: Y(1), r: 5, fill: fg});
  if (h !== 0) { const qx = 1 + h, qy = qx*qx;
    el("line", {x1: X(qx), y1: Y(1 + 2*h), x2: X(qx), y2: Y(qy), stroke: css("--hl"), "stroke-width": 4, "clip-path": clip});
    el("circle", {cx: X(qx), cy: Y(qy), r: 6, fill: css("--bg"), stroke: fg, "stroke-width": 2, "clip-path": clip}); }
}
function draw(){
  $("hv").textContent = num(H);
  svg.innerHTML = "";
  el("text", {x: 10, y: 345, "font-size": 12}, "— f(x) = x²    ··· érintő y = 2x − 1 (m = 2)    – – szelő PQ (m = 2 + h)    ▮ hiba = h²");
  panel(0, 280, [-0.5, 2.25], [-0.6, 4.6], H, "teljes nézet");
  const W = Math.max(2.5*Math.abs(H), 0.004);
  panel(280, 280, [1 - W, 1 + W], [1 - 2.6*W, 1 + 2.6*W], H, "nagyítás P = (1, 1) körül (±" + num(+W.toPrecision(3)) + ")");
  if (H === 0) { $("status").textContent = "h=0: a hányados nem értelmezett (0/0); a derivált a h → 0 határérték: 2"; return; }
  const q = 2 + H, fx = 1 + 2*H + H*H;
  $("status").textContent = "h = " + num(H) + " | f(1+h) = " + num(fx) + " | (f(1+h)−f(1))/h = " + num(q) + " | érintő-hiba = " + num(H*H) +
    (H < 0 ? " | negatív h: a meredekség 2 alatt, alulról közelít" : "");
}
$("u").addEventListener("input", () => { H = uToH(+$("u").value); if (Math.abs(H) >= 0.001) H = +H.toPrecision(3); draw(); });
document.querySelectorAll("button[data-h]").forEach(b => b.addEventListener("click", () => { H = +b.dataset.h; $("u").value = hToU(H); draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
