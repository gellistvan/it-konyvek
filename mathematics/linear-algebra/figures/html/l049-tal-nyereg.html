<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tál, nyereg és vályú: a kvadratikus forma felülete</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A mátrix elemei">
  <label for="sa">a =</label><input id="sa" type="range" min="-3" max="3" step="0.1" value="2"><b id="va"></b>
  <label for="sb">b =</label><input id="sb" type="range" min="-3" max="3" step="0.1" value="1"><b id="vb"></b>
  <label for="sc">c =</label><input id="sc" type="range" min="-3" max="3" step="0.1" value="2"><b id="vc"></b>
</div>
<div class="ctl" role="group" aria-label="Példák és nézet">
  <button data-m="2,1,2">A: tál</button><button data-m="1,2,1">B: nyereg</button><button data-m="1,1,1">vályú</button>
  <label for="az">forgatás</label><input id="az" type="range" min="-180" max="180" step="1" value="-58" aria-label="Elforgatás a függőleges tengely körül (fok)">
  <label for="elv">dőlés</label><input id="elv" type="range" min="5" max="80" step="1" value="24" aria-label="Dőlésszög (fok)">
</div>
<div id="mat" class="small"></div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 440" role="img" aria-label="Forgatható drótváz-felület z = ax² + 2bxy + cy², az alapsíkon szintvonalakkal, a sajátirányok menti vastag metszetgörbékkel"></svg>
<p class="small">A felület a [−4; 12] z-sávra vágva; az alapsíkon a c = 0,5; 1; 2 szintvonalak folytonosak, a c = 0 pontvonal-szaggatott, a c = −1; −0,5 szaggatott. A rajz egérrel/ujjal húzva vagy a csúszkákkal forgatható. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const R = 1.5, ZMIN = -4, ZMAX = 12, N = 12, SUB = 6;
function cls(a, b, c){ const d = a*c - b*b, t = 1e-9;
  if (d > t && a > t) return "pozitív definit"; if (d > t && a < -t) return "negatív definit";
  if (d < -t) return "indefinit"; if (a >= -t && c >= -t) return "pozitív szemidefinit"; return "negatív szemidefinit"; }
function eig(a, b, c){ const m = (a + c)/2, r = Math.hypot((a - c)/2, b); const l1 = m - r, l2 = m + r;
  let v2; if (Math.abs(b) > 1e-12) v2 = [b, l2 - a]; else v2 = (a >= c) ? [1, 0] : [0, 1];
  const n = Math.hypot(v2[0], v2[1]); v2 = [v2[0]/n, v2[1]/n]; return {l1, l2, v2, v1: [-v2[1], v2[0]]}; }
function proj(x, y, z){
  const az = +$("az").value * Math.PI/180, ev = +$("elv").value * Math.PI/180;
  const xr = x*Math.cos(az) - y*Math.sin(az), yr = x*Math.sin(az) + y*Math.cos(az);
  const sx = xr, sy = yr*Math.sin(ev) + (z - 4)/8*1.5*Math.cos(ev);
  return [280 + sx*85, 240 - sy*85]; }
function seg(p, q, attrs){ const a = proj(...p), b = proj(...q); el("line", Object.assign({x1:a[0], y1:a[1], x2:b[0], y2:b[1]}, attrs)); }
function poly(pts, attrs){ // pts: [x,y,z]; a z-sávon kívüli részeket kihagyja
  let cur = [];
  const flush = () => { if (cur.length > 1) el("polyline", Object.assign({points: cur.map(p => proj(...p).map(v => v.toFixed(1)).join(",")).join(" "), fill: "none"}, attrs)); cur = []; };
  for (const p of pts) { if (p[2] < ZMIN || p[2] > ZMAX) flush(); else cur.push(p); } flush(); }
function draw(){
  const a = +$("sa").value, b = +$("sb").value, c = +$("sc").value;
  $("va").textContent = fmt(a, 1); $("vb").textContent = fmt(b, 1); $("vc").textContent = fmt(c, 1);
  const q = (x, y) => a*x*x + 2*b*x*y + c*y*y, e = eig(a, b, c), d = a*c - b*b;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), gr = css("--grid");
  // alapsík kerete és tengelyek
  const C = [[-R,-R],[R,-R],[R,R],[-R,R],[-R,-R]];
  poly(C.map(p => [p[0], p[1], ZMIN]), {stroke: mu, "stroke-width": 1});
  seg([-R,0,ZMIN],[R,0,ZMIN], {stroke: gr}); seg([0,-R,ZMIN],[0,R,ZMIN], {stroke: gr});
  seg([0,0,ZMIN],[0,0,ZMAX], {stroke: mu, "stroke-dasharray": "3 3"});
  const xl = proj(R*1.12, 0, ZMIN), yl = proj(0, R*1.12, ZMIN), zl = proj(0, 0, ZMAX);
  el("text", {x: xl[0], y: xl[1], "font-size": 13}, "x"); el("text", {x: yl[0], y: yl[1], "font-size": 13}, "y");
  el("text", {x: zl[0] + 4, y: zl[1], "font-size": 13}, "z");
  // szintvonalak az alapsíkon (pontkeresés a rács élein)
  const lev = [-1, -0.5, 0, 0.5, 1, 2], M = 60, h = 2*R/M;
  for (const L of lev) {
    const st = L < 0 ? {"stroke-dasharray": "5 3"} : (L === 0 ? {"stroke-dasharray": "8 3 2 3"} : {});
    for (let i = 0; i < M; i++) for (let j = 0; j < M; j++) {
      const x0 = -R + i*h, y0 = -R + j*h, P = [[x0,y0],[x0+h,y0],[x0+h,y0+h],[x0,y0+h]], v = P.map(p => q(p[0], p[1]) - L), pts = [];
      for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; if ((v[k] < 0) !== (v[k2] < 0)) { const s = v[k]/(v[k] - v[k2]);
        pts.push([P[k][0] + s*(P[k2][0] - P[k][0]), P[k][1] + s*(P[k2][1] - P[k][1])]); } }
      if (pts.length >= 2) seg([pts[0][0], pts[0][1], ZMIN], [pts[1][0], pts[1][1], ZMIN], Object.assign({stroke: fg, "stroke-width": 0.9}, st));
      if (pts.length === 4) seg([pts[2][0], pts[2][1], ZMIN], [pts[3][0], pts[3][1], ZMIN], Object.assign({stroke: fg, "stroke-width": 0.9}, st));
    } }
  // drótváz
  for (let i = 0; i <= N; i++) { const u = -R + 2*R*i/N, A = [], B = [];
    for (let j = 0; j <= N*SUB; j++) { const w = -R + 2*R*j/(N*SUB); A.push([u, w, q(u, w)]); B.push([w, u, q(w, u)]); }
    poly(A, {stroke: mu, "stroke-width": 0.7}); poly(B, {stroke: mu, "stroke-width": 0.7}); }
  // metszetek a sajátirányokban: z = λ t²
  const T = R*Math.SQRT2*0.72;
  [[e.v2, e.l2, ""], [e.v1, e.l1, "7 4"]].forEach(([v, l, da]) => { const P = [];
    for (let j = 0; j <= 80; j++) { const t = -T + 2*T*j/80; P.push([t*v[0], t*v[1], l*t*t]); }
    poly(P, {stroke: css("--hl"), "stroke-width": 3.2, "stroke-dasharray": da}); });
  el("text", {x: 10, y: 22, "font-size": 13}, "folytonos: z = λ₂t² (λ₂ = " + fmt(e.l2, 3) + "), sajátirány (" + fmt(e.v2[0], 3) + "; " + fmt(e.v2[1], 3) + ")");
  el("text", {x: 10, y: 40, "font-size": 13}, "szaggatott: z = λ₁t² (λ₁ = " + fmt(e.l1, 3) + "), sajátirány (" + fmt(e.v1[0], 3) + "; " + fmt(e.v1[1], 3) + ")");
  const sg = d > 1e-9 ? "> 0" : (d < -1e-9 ? "< 0" : "= 0");
  $("mat").textContent = "Mátrix [[" + fmt(a,1) + "; " + fmt(b,1) + "]; [" + fmt(b,1) + "; " + fmt(c,1) + "]]   q(x, y) = " + fmt(a,1) + "x² + " + fmt(2*b,1) + "xy + " + fmt(c,1) + "y²";
  $("status").textContent = "sajátértékek: " + fmt(e.l1, 3) + " és " + fmt(e.l2, 3) + " | a > 0? " + (a > 0 ? "igen" : "nem") +
    " | ac − b² = " + fmt(d, 2) + " (" + sg + ") | osztály (14.2.5 főminor-kritérium): " + cls(a, b, c);
}
["sa","sb","sc","az","elv"].forEach(id => $(id).addEventListener("input", draw));
document.querySelectorAll("button[data-m]").forEach(bt => bt.addEventListener("click", () => {
  const m = bt.dataset.m.split(",").map(Number); $("sa").value = m[0]; $("sb").value = m[1]; $("sc").value = m[2]; draw(); }));
let drag = null;
svg.addEventListener("pointerdown", ev => { drag = [ev.clientX, ev.clientY, +$("az").value, +$("elv").value]; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => { if (!drag) return;
  $("az").value = Math.max(-180, Math.min(180, drag[2] - (ev.clientX - drag[0])*0.6));
  $("elv").value = Math.max(5, Math.min(80, drag[3] + (ev.clientY - drag[1])*0.4)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
