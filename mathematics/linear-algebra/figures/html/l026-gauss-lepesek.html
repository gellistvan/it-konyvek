<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss-elimináció lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span class="small">Saját [A | b]:</span> <span style="white-space:nowrap">1. sor: <input id="m00" type="text" inputmode="decimal" size="3" value="2" aria-label="1. sor, 1. oszlop" style="width:3.2em"> <input id="m01" type="text" inputmode="decimal" size="3" value="4" aria-label="1. sor, 2. oszlop" style="width:3.2em"> <input id="m02" type="text" inputmode="decimal" size="3" value="−2" aria-label="1. sor, 3. oszlop" style="width:3.2em"> | <input id="m03" type="text" inputmode="decimal" size="3" value="2" aria-label="1. sor, 4. jobb oldal" style="width:3.2em"></span> <span style="white-space:nowrap">2. sor: <input id="m10" type="text" inputmode="decimal" size="3" value="4" aria-label="2. sor, 1. oszlop" style="width:3.2em"> <input id="m11" type="text" inputmode="decimal" size="3" value="9" aria-label="2. sor, 2. oszlop" style="width:3.2em"> <input id="m12" type="text" inputmode="decimal" size="3" value="−3" aria-label="2. sor, 3. oszlop" style="width:3.2em"> | <input id="m13" type="text" inputmode="decimal" size="3" value="8" aria-label="2. sor, 4. jobb oldal" style="width:3.2em"></span> <span style="white-space:nowrap">3. sor: <input id="m20" type="text" inputmode="decimal" size="3" value="−2" aria-label="3. sor, 1. oszlop" style="width:3.2em"> <input id="m21" type="text" inputmode="decimal" size="3" value="−3" aria-label="3. sor, 2. oszlop" style="width:3.2em"> <input id="m22" type="text" inputmode="decimal" size="3" value="7" aria-label="3. sor, 3. oszlop" style="width:3.2em"> | <input id="m23" type="text" inputmode="decimal" size="3" value="10" aria-label="3. sor, 4. jobb oldal" style="width:3.2em"></span> <label><input id="pv" type="checkbox"> részleges főelemkiválasztás</label> <button id="calc">Számol</button> <button id="ex">Könyv példája</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kibővített 3×4-es mátrix állapota lépésenként: főelem kerettel, a módosult sor sraffozva, mellette a visszahelyettesítés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Alapállapot: a 8.2.4 kidolgozott példája sorcsere nélkül (p = k), ahogy kézzel számoltuk; a kapcsolóval a fejezet gauss_solve függvényének részleges főelemkiválasztása is lejátszható (a megoldás ugyanaz). Számított értékek, 3 tizedesre kerekítve.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"M": [[2.0, 4.0, -2.0, 2.0], [4.0, 9.0, -3.0, 8.0], [-2.0, -3.0, 7.0, 10.0]], "piv": [0, 0], "mod": -1, "zero": null, "back": [], "x": null, "msg": "Kiinduló kibővített mátrix [A | b]. 1. főelem: a₁₁ = 2 (vastag keret).", "line": -1}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [-2.0, -3.0, 7.0, 10.0]], "piv": [0, 0], "mod": 1, "zero": [1, 0], "back": [], "x": null, "msg": "1. oszlop nullázása: Sor₂ ← Sor₂ − 2·Sor₁ (szorzó 4/2 = 2).", "line": 14}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [0.0, 1.0, 5.0, 12.0]], "piv": [0, 0], "mod": 2, "zero": [2, 0], "back": [], "x": null, "msg": "1. oszlop nullázása: Sor₃ ← Sor₃ + Sor₁ (szorzó −2/2 = −1). Következő főelem: a₂₂ = 1.", "line": 14, "piv2": [1, 1]}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [0.0, 0.0, 4.0, 8.0]], "piv": [1, 1], "mod": 2, "zero": [2, 1], "back": [], "x": null, "msg": "2. oszlop nullázása: Sor₃ ← Sor₃ − Sor₂ (szorzó 1/1 = 1). Következő főelem: a₃₃ = 4. Felső háromszög alak: a főátló alatt minden elem 0.", "line": 14, "piv2": [2, 2]}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [0.0, 0.0, 4.0, 8.0]], "piv": [2, 2], "mod": 2, "zero": null, "back": ["z = 8 / 4 = 2"], "x": [null, null, 2.0], "msg": "Visszahelyettesítés alulról felfelé, 3. sor: z = 8 / 4 = 2.", "line": 18}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [0.0, 0.0, 4.0, 8.0]], "piv": [1, 1], "mod": 1, "zero": null, "back": ["z = 8 / 4 = 2", "y = (4 − 1·2) / 1 = 2"], "x": [null, 2.0, 2.0], "msg": "Visszahelyettesítés alulról felfelé, 2. sor: y = (4 − 1·2) / 1 = 2.", "line": 18}, {"M": [[2.0, 4.0, -2.0, 2.0], [0.0, 1.0, 1.0, 4.0], [0.0, 0.0, 4.0, 8.0]], "piv": [0, 0], "mod": 0, "zero": null, "back": ["z = 8 / 4 = 2", "y = (4 − 1·2) / 1 = 2", "x = (2 − 4·2 + 2·2) / 2 = −1"], "x": [-1.0, 2.0, 2.0], "msg": "Visszahelyettesítés alulról felfelé, 1. sor: x = (2 − 4·2 + 2·2) / 2 = −1.  Megoldás: x = (−1, 2, 2).", "line": 19}];
const CODE = ["def gauss_solve(A, b):", "    A = A.astype(float).copy()", "    b = b.astype(float).copy()", "    n = len(A)", "    for k in range(n):", "        p = k + int(np.argmax(np.abs(A[k:, k])))   # kapcsoló nélkül: p = k (kézi példa)", "        if A[p, k] == 0.0:", "            raise ValueError(\"A mátrix szinguláris; nincs egyértelmű megoldás.\")", "        if p != k:", "            A[[k, p]] = A[[p, k]]", "            b[[k, p]] = b[[p, k]]", "        pivot = A[k, k]", "        for i in range(k + 1, n):", "            factor = A[i, k] / pivot", "            A[i, k:] -= factor * A[k, k:]", "            b[i] -= factor * b[k]", "    x = np.zeros(n)", "    for i in range(n - 1, -1, -1):", "        x[i] = (b[i] - A[i, i + 1:] @ x[i + 1:]) / A[i, i]", "    return x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hu(x, d){ if (d === undefined) d = 3; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 270"); svg.innerHTML = "";
  const defs = el("defs", {}); const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hp"); pat.setAttribute("width", 7); pat.setAttribute("height", 7); pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 7);
  pl.setAttribute("stroke", css("--muted")); pl.setAttribute("stroke-width", 1.4); pat.appendChild(pl); defs.appendChild(pat);
  const w = 60, h = 44, x0 = 46, y0 = 24;
  el("text", {x: x0, y: 16, "font-size": 12, fill: css("--muted")}, "[A | b]  (x, y, z együtthatói | jobb oldal)");
  for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) {
    const X = x0 + j * w + (j === 3 ? 14 : 0), Y = y0 + i * h, on = s.mod === i;
    el("rect", {x: X, y: Y, width: w, height: h, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    if (on) el("rect", {x: X, y: Y, width: w, height: h, fill: "url(#hp)", opacity: 0.55});
    if (on) el("rect", {x: X + 8, y: Y + 12, width: w - 16, height: 21, fill: css("--cell"), opacity: 0.85});
    el("text", {x: X + w / 2, y: Y + h / 2 + 6, "text-anchor": "middle", "font-size": 16}, hu(s.M[i][j]));
    if (s.zero && s.zero[0] === i && s.zero[1] === j) el("line", {x1: X + w / 2 - 12, y1: Y + h / 2 + 10, x2: X + w / 2 + 12, y2: Y + h / 2 - 10, stroke: css("--hl2"), "stroke-width": 2.2});
  }
  el("line", {x1: x0 + 3 * w + 7, y1: y0 - 4, x2: x0 + 3 * w + 7, y2: y0 + 3 * h + 4, stroke: css("--line"), "stroke-width": 2});
  const pv = s.piv2 || s.piv;
  if (pv) { el("rect", {x: x0 + pv[1] * w + 3, y: y0 + pv[0] * h + 3, width: w - 6, height: h - 6, fill: "none", stroke: css("--hl"), "stroke-width": 4}); }
  ["Sor₁", "Sor₂", "Sor₃"].forEach((t, i) => el("text", {x: x0 - 4, y: y0 + i * h + h / 2 + 5, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, t));
  // jobb oldal: visszahelyettesítés
  const bx = 330;
  el("text", {x: bx, y: 36, "font-size": 13, "font-weight": "bold"}, "Visszahelyettesítés");
  if (!s.back.length) el("text", {x: bx, y: 60, "font-size": 12, fill: css("--muted")}, "(a felső háromszög alak után)");
  s.back.forEach((t, r) => el("text", {x: bx, y: 62 + 24 * r, "font-size": 13}, t));
  if (s.x) el("text", {x: bx, y: 62 + 24 * 3 + 6, "font-size": 14, "font-weight": "bold"}, "x = (" + s.x.map(v => v === null ? "?" : hu(v)).join(", ") + ")");
  // a mátrix alatt teljes szélességben a művelet
  const op = (s.msg.match(/Sor. ← [^(]*|Sor. ↔ Sor./) || [""])[0].trim();
  el("text", {x: 14, y: 196, "font-size": 18, "font-weight": "bold", fill: css("--hl")}, op);
  el("text", {x: 14, y: 226, "font-size": 11, fill: css("--muted")}, "vastag keret: főelem · sraffozott sor: most módosult · áthúzott 0: nullázott elem");
}
function readM(){ const A = [], b = []; for (let i = 0; i < 3; i++) { const r = []; for (let j = 0; j < 4; j++) { const v = parseFloat(String(document.getElementById(`m${i}${j}`).value).replace(",", ".").replace(/−/g, "-").trim()); r.push(isFinite(v) ? v : 0); } A.push(r.slice(0, 3)); b.push(r[3]); } return [A, b]; }
const SUBS = "₁₂₃", VARS = "xyz";
function rowOp(i, k, f){ const c = Math.abs(Math.abs(f) - 1) < 1e-12 ? "" : hu(Math.abs(f)) + "·"; return `Sor${SUBS[i]} ← Sor${SUBS[i]} ${f > 0 ? "−" : "+"} ${c}Sor${SUBS[k]}`; }
function gaussSteps(A, b, piv){
  const n = 3, M = A.map((r, i) => r.concat([b[i]])), S = [];
  const push = (msg, line, o) => { o = o || {}; S.push({M: M.map(r => r.map(v => Math.round(v * 1e10) / 1e10)), piv: o.piv || null, mod: o.mod === undefined ? -1 : o.mod, zero: o.zero || null, back: (o.back || []).slice(), x: o.x || null, msg: msg, line: line}); };
  push(`Kiinduló kibővített mátrix [A | b]. 1. főelem: a₁₁ = ${hu(M[0][0])} (vastag keret).`, -1, {piv: [0, 0]});
  for (let k = 0; k < n; k++) {
    let p = k;
    if (piv) { for (let r = k + 1; r < n; r++) if (Math.abs(M[r][k]) > Math.abs(M[p][k])) p = r; }
    if (Math.abs(M[p][k]) < 1e-12) { push(`A(z) ${k + 1}. oszlopban nincs nemnulla főelem: a mátrix szinguláris, nincs egyértelmű megoldás.` + (piv ? "" : " (Kapcsold be a részleges főelemkiválasztást, hátha csak sorcsere kell.)"), 7, {piv: [k, k]}); return S; }
    if (p !== k) { const t = M[k]; M[k] = M[p]; M[p] = t; push(`Részleges főelemkiválasztás: Sor${SUBS[k]} ↔ Sor${SUBS[p]} (a legnagyobb abszolút értékű elem a ${k + 1}. oszlopban: ${hu(M[k][k])}).`, 9, {piv: [k, k], mod: k}); }
    for (let i = k + 1; i < n; i++) {
      const old = M[i][k], f = M[i][k] / M[k][k];
      for (let j = k; j <= n; j++) M[i][j] -= f * M[k][j];
      M[i][k] = 0;
      push(`${k + 1}. oszlop nullázása: ${rowOp(i, k, f)} (szorzó ${hu(old)}/${hu(M[k][k])} = ${hu(f)}).`, 14, {piv: [k, k], mod: i, zero: [i, k]});
    }
    if (k + 1 < n) { S[S.length - 1].msg += ` Következő főelem: a${SUBS[k + 1]}${SUBS[k + 1]} = ${hu(M[k + 1][k + 1])}.`; S[S.length - 1].piv2 = [k + 1, k + 1]; }
  }
  S[S.length - 1].msg += " Felső háromszög alak: a főátló alatt minden elem 0.";
  const x = [null, null, null], back = [];
  for (let i = n - 1; i >= 0; i--) {
    let s = M[i][n]; for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j];
    x[i] = s / M[i][i];
    let terms = ""; for (let j = i + 1; j < n; j++) if (Math.abs(M[i][j]) > 1e-12) terms += ` ${M[i][j] > 0 ? "−" : "+"} ${hu(Math.abs(M[i][j]))}·${hu(x[j])}`;
    const lt = terms ? `${VARS[i]} = (${hu(M[i][n])}${terms}) / ${hu(M[i][i])} = ${hu(x[i])}` : `${VARS[i]} = ${hu(M[i][n])} / ${hu(M[i][i])} = ${hu(x[i])}`;
    back.push(lt);
    push(`Visszahelyettesítés alulról felfelé, ${i + 1}. sor: ${lt}.`, 18, {piv: [i, i], mod: i, back: back, x: x.slice()});
  }
  S[S.length - 1].msg += "  Megoldás: x = (" + x.map(v => hu(v)).join(", ") + ").";
  S[S.length - 1].line = 19;
  return S;
}
function recompute(){ const [A, b] = readM(); setSteps(gaussSteps(A, b, document.getElementById("pv").checked)); }
document.getElementById("calc").onclick = recompute;
document.getElementById("pv").onchange = recompute;
document.getElementById("ex").onclick = () => { const E = [[2,4,-2,2],[4,9,-3,8],[-2,-3,7,10]]; for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) document.getElementById(`m${i}${j}`).value = E[i][j]; document.getElementById("pv").checked = false; recompute(); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
