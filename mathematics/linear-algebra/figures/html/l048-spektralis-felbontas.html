<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spektrális felbontás lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span>
<label for="ph">φ =</label><input id="ph" type="range" min="0" max="360" step="1" value="0" aria-label="Az x vektor szöge fokban">
<b id="phv"></b>
<span role="group" aria-label="Mátrix"><button id="mA" aria-pressed="true">A = [[3, 1], [1, 3]]</button><button id="mB" aria-pressed="false">(b) [[1, 2], [2, 1]]</button></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Az egységkör képe lépésenként: koordináták a sajátbázisban, nyújtás 4-szer és 2-szer, majd vissza; a végén 45 fokban dőlt ellipszis 4 és 2 féltengellyel. Jobbra egy vektor képe a két vetület súlyozott összegeként." style=""></svg>

</div>
<p class="small">A = QΛQᵀ = 4·q₁q₁ᵀ + 2·q₂q₂ᵀ, q₁ = (1, 1)/√2, q₂ = (1, −1)/√2 (a fejezet Q-ja, det Q = −1, ezért Qᵀ itt tükrözés, nem forgatás). A (b) feladat mátrixánál λ = 3 és −1: a −1 a q₂ irányban tükröz. Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v"), r = Math.SQRT1_2;
const Q = [[r, r], [r, -r]];
const MATS = {A: {L: [4, 2], name: "A"}, B: {L: [3, -1], name: "(b)"}};
const STN = ["1. eredeti: egységkör és x", "2. Qᵀ: koordináták a sajátbázisban (itt tükrözés, det Q = −1)", "3. Λ: nyújtás a sajátirányok mentén", "4. Q: vissza – QΛQᵀ = A, ellipszis"];
let st = 0, mn = "A";
const mul = (M, v) => [M[0][0] * v[0] + M[0][1] * v[1], M[1][0] * v[0] + M[1][1] * v[1]];
const QT = v => [Q[0][0] * v[0] + Q[1][0] * v[1], Q[0][1] * v[0] + Q[1][1] * v[1]];
function stage(v, k, L){ if (k === 0) return v; const a = QT(v); if (k === 1) return a; const b = [L[0] * a[0], L[1] * a[1]]; if (k === 2) return b; return mul(Q, b); }
function draw(){
  const ph = +document.getElementById("ph").value, t = ph * Math.PI / 180, x = [Math.cos(t), Math.sin(t)], L = MATS[mn].L;
  document.getElementById("phv").textContent = ph + "°";
  document.getElementById("cnt").textContent = (st + 1) + "/4";
  svg.innerHTML = "";
  const S = 42, ox = 200, oy = 200, P = (a, b) => [ox + S * a, oy - S * b];
  for (let g = -4; g <= 4; g++) { mk(svg, "line", {x1: P(g, -4.5)[0], y1: P(g, -4.5)[1], x2: P(g, 4.5)[0], y2: P(g, 4.5)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); mk(svg, "line", {x1: P(-4.5, g)[0], y1: P(-4.5, g)[1], x2: P(4.5, g)[0], y2: P(4.5, g)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); }
  // sajátirányok az aktuális koordinátákban
  const eig = (st === 1 || st === 2) ? [[1, 0], [0, 1]] : [[r, r], [r, -r]];
  eig.forEach((u, i) => { const a = P(-4.5 * u[0], -4.5 * u[1]), b = P(4.5 * u[0], 4.5 * u[1]);
    mk(svg, "line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: cssv("--muted"), "stroke-dasharray": "2 4", "stroke-width": 1.5});
    const lb = P(3.9 * u[0], 3.9 * u[1]); mk(svg, "text", {x: lb[0] + (Math.abs(u[0]) < 0.1 ? 60 : -4), y: lb[1] + (u[1] < 0 ? -6 : 14), "text-anchor": "end", "font-size": 12, fill: cssv("--muted")}, "q" + (i ? "₂" : "₁") + " (λ = " + hu(L[i]) + ")"); });
  let d0 = "", d = "";
  for (let k = 0; k <= 180; k++) { const a = 2 * Math.PI * k / 180, c = [Math.cos(a), Math.sin(a)], p = P(c[0], c[1]), e = stage(c, st, L), q = P(e[0], e[1]);
    d0 += (k ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); d += (k ? "L" : "M") + q[0].toFixed(1) + "," + q[1].toFixed(1); }
  mk(svg, "path", {d: d0, fill: "none", stroke: cssv("--muted"), "stroke-dasharray": "2 3"});
  mk(svg, "path", {d, fill: "none", stroke: cssv("--fg"), "stroke-width": 2.2});
  const y = stage(x, st, L), O = P(0, 0), Y = P(y[0], y[1]);
  if (st === 3) { // féltengelyek
    [[L[0] * r, L[0] * r, "λ₁q₁"], [L[1] * r, -L[1] * r, "λ₂q₂"]].forEach(([a, b, tx]) => { const E = P(a, b); arrow2(svg, O[0], O[1], E[0], E[1], cssv("--hl"), 2, ""); mk(svg, "text", {x: E[0] + 6, y: E[1] + (b < 0 ? 14 : -4), "font-size": 12, fill: cssv("--hl")}, tx); });
  }
  arrow2(svg, O[0], O[1], Y[0], Y[1], cssv("--hl2"), 3, "");
  mk(svg, "text", {x: Y[0] + 8, y: Y[1] - 8, "font-size": 13, fill: cssv("--hl2")}, ["x", "Qᵀx", "ΛQᵀx", "Ax"][st]);
  mk(svg, "text", {x: 10, y: 20, "font-size": 13}, STN[st]);
  // jobb oldal: a vetítők súlyozott összege
  const a1 = r * (x[0] + x[1]), a2 = r * (x[0] - x[1]), p1 = [a1 * r, a1 * r], p2 = [a2 * r, -a2 * r];
  const w1 = [L[0] * p1[0], L[0] * p1[1]], w2 = [L[1] * p2[0], L[1] * p2[1]], Ax = [w1[0] + w2[0], w1[1] + w2[1]];
  const S2 = 36, o2x = 412, o2y = 290, R = (a, b) => [o2x + S2 * a, o2y - S2 * b];
  mk(svg, "rect", {x: 385, y: 60, width: 170, height: 300, fill: "none", stroke: cssv("--grid")});
  mk(svg, "text", {x: 390, y: 76, "font-size": 11}, "vetítők súlyozott összege");
  const Ar = (p, q, c, w, dd) => { const a = R(p[0], p[1]), b = R(q[0], q[1]); arrow2(svg, a[0], a[1], b[0], b[1], c, w, dd); };
  Ar([0, 0], x, cssv("--fg"), 2, ""); Ar([0, 0], p1, cssv("--fg"), 1.2, "4 3"); Ar([0, 0], p2, cssv("--fg"), 1.2, "4 3");
  Ar([0, 0], w1, cssv("--hl"), 1.6, "6 3"); Ar(w1, Ax, cssv("--hl"), 1.6, "6 3"); Ar([0, 0], Ax, cssv("--hl2"), 2.6, "");
  mk(svg, "text", {x: 390, y: 352, "font-size": 11, fill: cssv("--muted")}, "szaggatott kék: λ₁q₁q₁ᵀx, λ₂q₂q₂ᵀx");
  const f = v => "(" + huf(v[0], 2) + "; " + huf(v[1], 2) + ")";
  document.getElementById("status").textContent = `φ = ${ph}°: q1q1ᵀx = ${f(p1)}, q2q2ᵀx = ${f(p2)}, Ax = ${hu(L[0])}·${f(p1)} + ${L[1] < 0 ? "(" + hu(L[1]) + ")" : hu(L[1])}·${f(p2)} = ${f(Ax)}` + (st === 3 ? `; az ellipszis féltengelyei ${hu(Math.abs(L[0]))} (q1) és ${hu(Math.abs(L[1]))} (q2)` + (L[1] < 0 ? ", a −1 a q2 irányban tükröz" : "") : "");
}
function setM(n){ mn = n; document.getElementById("mA").setAttribute("aria-pressed", n === "A"); document.getElementById("mB").setAttribute("aria-pressed", n === "B"); draw(); }
document.getElementById("prev").onclick = () => { st = Math.max(0, st - 1); draw(); };
document.getElementById("next").onclick = () => { st = Math.min(3, st + 1); draw(); };
document.getElementById("mA").onclick = () => setM("A");
document.getElementById("mB").onclick = () => setM("B");
document.getElementById("ph").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
