<style>

  const c = 34, fr = {}, fl = {};
  if (s.win) for (let r = 0; r < 2; r++) for (let q = 0; q < 2; q++) { fr[(s.win[0] + r) + "," + (s.win[1] + q)] = 1; fl[(s.win[0] + r) + "," + (s.win[1] + q)] = css("--cellhl"); }
  const sel = {};
  if (SELV !== null) XX.forEach((r, i) => r.forEach((v, j) => { if (v === SELV) sel[i + "," + j] = 1; }));
  mat(XX, 15, 40, c, {frame: Object.assign({}, fr, Object.fromEntries(Object.keys(sel).map(kk => [kk, 2]))), fill: fl, label: "X (kattintható)",
                      onclick: (i, j) => { SELV = (SELV === XX[i][j] ? null : XX[i][j]); show(k); }});
  const cn = CNT[s.stride];
  XX.forEach((r, i) => r.forEach((v, j) => txt(15 + j * c + c - 3, 40 + i * c + 11, "×" + cn[i][j], {fs: 9, anchor: "end", fill: css("--muted")})));
  txt(83, 40 + 4 * c + 18, "×n = hány oszlopban szerepel", {fs: 11, fill: css("--muted")});
  // X_col
  const N = s.cols[0].length, cc = Math.min(34, 400 / N), x0 = 180;
  const cf = {}, cfl = {}, ch = {};
  for (let q = 0; q < N; q++) for (let r = 0; r < 4; r++) {
    const key = r + "," + q;
    if (s.cols[r][q] !== "" && q < s.j) cfl[key] = css("--cellhl");
    if (q === s.j) { cf[key] = 1; cfl[key] = css("--cellhl"); }
    if (SELV !== null && s.cols[r][q] === SELV) { cf[key] = 2; ch[key] = 1; }
  }
  mat(s.cols, x0, 40, cc, {frame: cf, fill: cfl, hatch: ch, fs: 12, label: "X_col (4×" + N + ")"});
  for (let q = 0; q < N; q++) txt(x0 + q * cc + cc / 2, 40 + 4 * cc + 14, String(q + 1), {fs: 10, fill: css("--muted")});
  if (s.Y) {
    mat([[1, 1, 1, 1]], 15, 245, 26, {label: "W_mat"});
    txt(150, 263, "· X_col =", {fs: 14});
    mat([s.Y], x0, 245, cc, {fs: 12, label: "Y_mat"});
    const R = s.out.length;
    mat(s.out, 600 - R * 30 - 10, 150, 30, {fs: 12, label: "kimenet"});
  }
  if (SELV !== null) {
    const qs = []; for (let q = 0; q < N; q++) if (s.cols.some(r => r[q] === SELV)) qs.push(q + 1);
    status.textContent = "A(z) " + SELV + " elem " + qs.length + " oszlopban szerepel" + (qs.length ? " (" + qs.join("., ") + ".)" : "") + " – " + s.msg;
  }
}
function setStride(v){ SELV = null; setSteps(DATA[v]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
