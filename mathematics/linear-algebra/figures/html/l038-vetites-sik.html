<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetítés síkra</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number]{width:4.2em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="A b vektor">
<label for="b1">b₁ = <b class="v" id="v1">2</b></label><input id="b1" type="range" min="-5" max="5" step="0.5" value="2" aria-label="b első komponense">
<label for="b2">b₂ = <b class="v" id="v2">1</b></label><input id="b2" type="range" min="-5" max="5" step="0.5" value="1" aria-label="b második komponense">
<label for="b3">b₃ = <b class="v" id="v3">5</b></label><input id="b3" type="range" min="-5" max="5" step="0.5" value="5" aria-label="b harmadik komponense">
</div>
<div class="ctl" role="group" aria-label="Nézet">
<label for="yaw">forgatás</label><input id="yaw" type="range" min="-180" max="180" step="1" value="-30" aria-label="Forgatás a függőleges tengely körül (fok)">
<label for="pitch">dőlés</label><input id="pitch" type="range" min="-10" max="80" step="1" value="25" aria-label="Dőlésszög (fok)">
<button id="pm" aria-pressed="false">P mátrix</button><button id="rst">Kezdőállapot</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="Ferde sík az x tengellyel és az y–z átlóval; a b vektor vetülete a síkban p, a hibavektor r merőleges a síkra; b csúszkákkal állítható, a nézet forgatható."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Számított, a 11.3.4 adataival: a1 = (1, 0, 0), a2 = (0, 1, 1); a normálegyenlet AᵀA·x̂ = Aᵀb, itt AᵀA = [[1; 0], [0; 2]]. A nézet húzással is forgatható.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function vec(x0, y0, x1, y1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2, hl = o.head || 10;
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy); if (L < 1e-6) return;
  const ux = dx / L, uy = dy / L, bx = x1 - ux * hl, by = y1 - uy * hl;
  el("line", {x1: x0, y1: y0, x2: bx + ux * 1, y2: by + uy * 1, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${x1},${y1} ${bx - uy * hl * 0.38},${by + ux * hl * 0.38} ${bx + uy * hl * 0.38},${by - ux * hl * 0.38}`, fill: col}); }
function txt(x, y, s, o){ o = o || {}; const a = {x: x, y: y, "font-size": o.fs || 13, "text-anchor": o.anchor || "middle"};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; if (o.italic) a["font-style"] = "italic";
  return el("text", a, s, o.par); }

function P3(p, yaw, pitch){ const a = yaw*Math.PI/180, b = pitch*Math.PI/180;
  const u = -p[0]*Math.sin(a) + p[1]*Math.cos(a), d = p[0]*Math.cos(a) + p[1]*Math.sin(a);
  return [u, p[2]*Math.cos(b) - d*Math.sin(b)]; }


const A1 = [1, 0, 0], A2 = [0, 1, 1];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const lin = (s, a, t, b) => [s * a[0] + t * b[0], s * a[1] + t * b[1], s * a[2] + t * b[2]];
let showP = false;
function fv(v, d){ const ints = v.every(x => Math.abs(x - Math.round(x)) < 1e-9); return "(" + v.map(x => hu(x, d)).join(ints ? ", " : "; ") + ")"; }
function draw(){
  const B = ["b1", "b2", "b3"].map(id => +document.getElementById(id).value);
  ["v1", "v2", "v3"].forEach((id, i) => document.getElementById(id).textContent = hu(B[i], 1));
  const yaw = +document.getElementById("yaw").value, pitch = +document.getElementById("pitch").value;
  // normálegyenlet: AᵀA = [[1,0],[0,2]], Aᵀb = (b1, b2+b3)
  const xh = [dot(A1, B) / 1, dot(A2, B) / 2], p = lin(xh[0], A1, xh[1], A2), r = [B[0] - p[0], B[1] - p[1], B[2] - p[2]];
  const sc = 44, cen = P3([1.2, 1.6, 2.2], yaw, pitch);
  const S = q => { const t = P3(q, yaw, pitch); return [270 + (t[0] - cen[0]) * sc, 200 - (t[1] - cen[1]) * sc]; };
  svg.innerHTML = "";
  [[[3.2,0,0],"x"],[[0,4,0],"y"],[[0,0,5.6],"z"]].forEach(([q, l]) => { const a = S([0,0,0]), b = S(q); vec(a[0], a[1], b[0], b[1], {color: css("--muted"), w: 1.2, head: 8}); txt(b[0] + 8, b[1] - 3, l, {fs: 13, color: css("--muted")}); });
  const s0 = Math.min(-0.6, xh[0] - 0.8), s1 = Math.max(2.8, xh[0] + 0.8), t0 = Math.min(-0.6, xh[1] - 0.8), t1 = Math.max(3.8, xh[1] + 0.8);
  el("polygon", {points: [[s0, t0], [s1, t0], [s1, t1], [s0, t1]].map(([s, t]) => S(lin(s, A1, t, A2)).join(",")).join(" "), fill: css("--fill1"), stroke: css("--muted")});
  const c1 = S(lin(s1, A1, t0, A2)); txt(c1[0] - 6, c1[1] - 8, "C(A) sík", {fs: 13, anchor: "end"});
  [[[0,0,0], lin(xh[0], A1, 0, A2)], [lin(xh[0], A1, 0, A2), p], [[0,0,0], lin(0, A1, xh[1], A2)], [lin(0, A1, xh[1], A2), p]].forEach(([q0, q1]) => {
    const a = S(q0), b = S(q1); el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--fg"), "stroke-dasharray": "2 3"}); });
  const O = S([0,0,0]);
  [[A1, "a₁"], [A2, "a₂"]].forEach(([q, l]) => { const e = S(q); vec(O[0], O[1], e[0], e[1], {color: css("--hl"), w: 2.4}); txt(e[0] + 6, e[1] + 16, l, {fs: 14, color: css("--hl"), anchor: "start"}); });
  const Pp = S(p), Bb = S(B);
  vec(O[0], O[1], Pp[0], Pp[1], {color: css("--hl2"), w: 2.2, dash: "7 4"}); txt(Pp[0] + 8, Pp[1] + 16, "p = " + fv(p, 2), {fs: 13, color: css("--hl2"), anchor: "start"});
  vec(O[0], O[1], Bb[0], Bb[1], {w: 3}); txt(Bb[0] + 8, Bb[1] - 6, "b = " + fv(B, 2), {fs: 13, anchor: "start"});
  if (Math.hypot(...r) > 1e-9) { vec(Pp[0], Pp[1], Bb[0], Bb[1], {color: css("--hl3"), w: 2.4}); const m = S(lin(0.5, p, 0.5, B)); txt(m[0] + 8, m[1], "r", {fs: 14, color: css("--hl3"), anchor: "start"}); }
  const st = `x̂=${fv(xh, 3)}, p=${fv(p, 3)}, r=${fv(r, 3)}, a₁·r=${hu(dot(A1, r), 6)}, a₂·r=${hu(dot(A2, r), 6)}`;
  document.getElementById("status").textContent = st;
  document.getElementById("info").textContent = showP ? "P = A(AᵀA)⁻¹Aᵀ = [[1; 0; 0], [0; 0,5; 0,5], [0; 0,5; 0,5]]  (P² = P, Pᵀ = P)\nP·b = " + fv(p, 3) + " = p" : "";
}
let drag = null;
svg.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, +document.getElementById("yaw").value, +document.getElementById("pitch").value]; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => { if (!drag) return; document.getElementById("yaw").value = Math.max(-180, Math.min(180, drag[2] - (e.clientX - drag[0]) * 0.5)); document.getElementById("pitch").value = Math.max(-10, Math.min(80, drag[3] + (e.clientY - drag[1]) * 0.4)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
["b1", "b2", "b3", "yaw", "pitch"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("pm").onclick = () => { showP = !showP; document.getElementById("pm").setAttribute("aria-pressed", String(showP)); draw(); };
document.getElementById("rst").onclick = () => { [["b1", 2], ["b2", 1], ["b3", 5], ["yaw", -30], ["pitch", 25]].forEach(([k, v]) => document.getElementById(k).value = v); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
