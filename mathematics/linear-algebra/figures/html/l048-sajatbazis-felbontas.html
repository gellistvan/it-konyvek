<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felbontás a sajátbázisban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="x1">x₁ =</label><input id="x1" type="range" min="-2" max="3" step="0.1" value="1" aria-label="x első koordinátája">
<b id="x1v"></b>
<label for="x2">x₂ =</label><input id="x2" type="range" min="-2" max="3" step="0.1" value="2" aria-label="x második koordinátája">
<b id="x2v"></b><button id="b0">x = (1, 2)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 420" role="img" aria-label="Az x vektor felbontása a merőleges q1, q2 sajátirányok mentén, és Ax, amelyben a q1-komponens háromszoros." style=""></svg>

</div>
<p class="small">A = [[2, 1], [1, 2]], q₁ = (1, 1)/√2 (λ = 3), q₂ = (1, −1)/√2 (λ = 1); α = q₁ᵀx, β = q₂ᵀx, x = αq₁ + βq₂, Ax = 3αq₁ + βq₂. Számított értékek.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const svg = document.getElementById("v"), r2 = Math.SQRT1_2;
const S = 40, ox = 150, oy = 260, P = (x, y) => [ox + S * x, oy - S * y];
function draw(){
  const x1 = +document.getElementById("x1").value, x2 = +document.getElementById("x2").value;
  document.getElementById("x1v").textContent = huf(x1, 1); document.getElementById("x2v").textContent = huf(x2, 1);
  const a = r2 * (x1 + x2), b = r2 * (x1 - x2), aq = [a * r2, a * r2], Ax = [2 * x1 + x2, x1 + 2 * x2], a3 = [3 * a * r2, 3 * a * r2];
  svg.innerHTML = "";
  for (let g = -3; g <= 9; g++) { mk(svg, "line", {x1: P(g, -6)[0], y1: P(g, -6)[1], x2: P(g, 9)[0], y2: P(g, 9)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); mk(svg, "line", {x1: P(-4, g)[0], y1: P(-4, g)[1], x2: P(10, g)[0], y2: P(10, g)[1], stroke: g === 0 ? cssv("--muted") : cssv("--grid")}); }
  mk(svg, "line", {x1: P(-4, -4)[0], y1: P(-4, -4)[1], x2: P(9, 9)[0], y2: P(9, 9)[1], stroke: cssv("--muted"), "stroke-dasharray": "2 4", "stroke-width": 1.5});
  mk(svg, "line", {x1: P(-4, 4)[0], y1: P(-4, 4)[1], x2: P(6, -6)[0], y2: P(6, -6)[1], stroke: cssv("--muted"), "stroke-dasharray": "2 4", "stroke-width": 1.5});
  const L = (p, q, c, w, d) => { const A = P(p[0], p[1]), B = P(q[0], q[1]); arrow2(svg, A[0], A[1], B[0], B[1], c, w, d); };
  const T = (p, t, c, dx, dy) => { const A = P(p[0], p[1]); mk(svg, "text", {x: A[0] + dx, y: A[1] + dy, "font-size": 13, fill: c}, t); };
  const fg = cssv("--fg"), hl = cssv("--hl"), hl2 = cssv("--hl2");
  L([0, 0], [r2, r2], hl, 3); T([r2, r2], "q₁", hl, -22, -4);
  L([0, 0], [r2, -r2], hl, 3); T([r2, -r2], "q₂", hl, 4, 14);
  L([0, 0], aq, fg, 1.6, "6 3"); L(aq, [x1, x2], fg, 1.6, "6 3");
  L([0, 0], [x1, x2], fg, 2.8); T([x1, x2], "x", fg, -14, -6); T(aq, "αq₁", fg, 6, 14);
  L(aq, a3, hl2, 1.6, "6 3"); L(a3, Ax, hl2, 1.6, "6 3");
  L([0, 0], Ax, hl2, 2.8); T(Ax, "Ax", hl2, 6, -6); T(a3, "3αq₁", hl2, 6, 14);
  mk(svg, "text", {x: 10, y: 20, "font-size": 12, fill: cssv("--muted")}, "pontozott: q₁ (λ = 3) és q₂ (λ = 1) iránya");
  document.getElementById("status").textContent = `x = (${hu(x1, 1)}; ${hu(x2, 1)}): α = q₁ᵀx = ${huf(a, 3)}, β = q₂ᵀx = ${huf(b, 3)}; Ax = 3αq₁ + βq₂ = (${hu(Ax[0], 2)}; ${hu(Ax[1], 2)})`;
}
["x1", "x2"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("b0").onclick = () => { document.getElementById("x1").value = 1; document.getElementById("x2").value = 2; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
