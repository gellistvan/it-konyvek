<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egységkör és forgatás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Szög beállítása">
  <label for="t">t =</label>
  <input id="t" type="range" min="-360" max="360" step="15" value="60" aria-label="Szög fokban">
  <input id="tv" type="text" value="60" aria-label="Szög értéke (tetszőleges)">
  <label><input type="radio" name="u" id="ud" checked> fok</label>
  <label><input type="radio" name="u" id="ur"> radián</label>
</div>
<div class="ctl" role="group" aria-label="Nevezetes szögek">
  <span class="small">Nevezetes szögek:</span>
  <button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button>
  <button data-a="60">60°</button><button data-a="90">90°</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 660 340" role="img" aria-label="Egységkör a t szögű P ponttal és vetületeivel; mellette e1, e2 és t szöggel elforgatott képük"></svg>
  
</div>
<p class="small">Számított értékek, 4 tizedesre kerekítve. Pozitív t: óramutatóval ellentétes irány; negatív t: azzal egyező. A szövegmezőbe a kiválasztott egységben (fok vagy radián) tetszőleges érték írható.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


let deg = 60;
const S = 120, C1 = [170, 170], C2 = [490, 170];
function X(c, x){ return c[0] + S * x; } function Y(c, y){ return c[1] - S * y; }
function piFrac(d){
  const fr = {0:"0",15:"π/12",30:"π/6",45:"π/4",60:"π/3",75:"5π/12",90:"π/2",120:"2π/3",135:"3π/4",150:"5π/6",180:"π",270:"3π/2",360:"2π"};
  const a = Math.abs(d); if (fr[a] !== undefined) return (d < 0 && a ? "−" : "") + fr[a];
  return null; }
function frame(c){
  el("line", {x1: c[0] - 1.25 * S, y1: c[1], x2: c[0] + 1.25 * S, y2: c[1], stroke: css("--grid2")});
  el("line", {x1: c[0], y1: c[1] - 1.25 * S, x2: c[0], y2: c[1] + 1.25 * S, stroke: css("--grid2")});
  el("circle", {cx: c[0], cy: c[1], r: S, fill: "none", stroke: css("--fg"), "stroke-width": 1.5});
  [-1, 1].forEach(v => { el("text", {x: X(c, v), y: c[1] + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, v < 0 ? "−1" : "1");
    el("text", {x: c[0] - 6, y: Y(c, v) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, v < 0 ? "−1" : "1"); }); }
function arcPath(c, r, a0, a1){ // fokban, matematikai irány
  const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) / 4)); let p = "";
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; p += (i ? "L" : "M") + (c[0] + r * Math.cos(a)).toFixed(1) + "," + (c[1] - r * Math.sin(a)).toFixed(1); }
  return p; }
function draw(){
  svg.innerHTML = "";
  const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  frame(C1); frame(C2);
  el("text", {x: C1[0], y: 18, "text-anchor": "middle", "font-size": 14}, "P = (cos t, sin t)");
  el("text", {x: C2[0], y: 18, "text-anchor": "middle", "font-size": 14}, "e₁, e₂ és képük (θ = t)");
  // 1. panel
  const px = X(C1, c), py = Y(C1, s);
  el("line", {x1: C1[0], y1: C1[1], x2: px, y2: py, stroke: css("--fg"), "stroke-width": 1});
  el("line", {x1: C1[0], y1: C1[1], x2: px, y2: C1[1], stroke: css("--hl"), "stroke-width": 4, "stroke-dasharray": "8 5"});
  el("line", {x1: px, y1: C1[1], x2: px, y2: py, stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "2 4"});
  if (Math.abs(deg) > 0.01) { const a = Math.max(-720, Math.min(720, deg)); el("path", {d: arcPath(C1, 34, 0, a), fill: "none", stroke: css("--fg"), "stroke-width": 1.5});
    const ae = a * Math.PI / 180, ab = (a - Math.sign(a) * 8) * Math.PI / 180;
    arrowHead(C1[0] + 34 * Math.cos(ab), C1[1] - 34 * Math.sin(ab), C1[0] + 34 * Math.cos(ae), C1[1] - 34 * Math.sin(ae), css("--fg"), 9); }
  el("circle", {cx: px, cy: py, r: 6, fill: css("--fg")});
  el("text", {x: px + 9 * (c >= 0 ? 1 : -1), y: py - 8, "text-anchor": c >= 0 ? "start" : "end", "font-size": 14, "font-style": "italic"}, "P");
  el("text", {x: C1[0], y: C1[1] + 150, "text-anchor": "middle", "font-size": 13}, "cos t = " + hu(c) + " · sin t = " + hu(s));
  // 2. panel
  arrow(C2[0], C2[1], X(C2, 1), C2[1], {col: css("--grid2"), w: 2});
  arrow(C2[0], C2[1], C2[0], Y(C2, 1), {col: css("--grid2"), w: 2, dash: "7 5"});
  el("text", {x: X(C2, 1) + 4, y: C2[1] + 16, "font-size": 13, fill: css("--muted")}, "e₁");
  el("text", {x: C2[0] + 6, y: Y(C2, 1) - 4, "font-size": 13, fill: css("--muted")}, "e₂");
  arrow(C2[0], C2[1], X(C2, c), Y(C2, s), {col: css("--hl"), w: 3});
  arrow(C2[0], C2[1], X(C2, -s), Y(C2, c), {col: css("--hl2"), w: 3, dash: "8 5"});
  el("text", {x: X(C2, 1.08 * c), y: Y(C2, 1.08 * s) + 4, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "R e₁");
  el("text", {x: X(C2, -1.1 * s), y: Y(C2, 1.1 * c) + 4, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "R e₂");
  el("text", {x: C2[0], y: C2[1] + 150, "text-anchor": "middle", "font-size": 13}, "R e₁ = (" + hu(c) + "; " + hu(s) + ") · R e₂ = (" + hu(-s) + "; " + hu(c) + ")");
  const pf = piFrac(deg), rad = hu(t, 4);
  g("status").textContent = "t = " + hu(deg, Number.isInteger(deg) ? 0 : 2) + "° = " + (pf ? pf + " rad" : rad + " rad") + "; cos t = " + hu(c) + "; sin t = " + hu(s) +
    "; R e₁ = (" + hu(c) + "; " + hu(s) + "); R e₂ = (" + hu(-s) + "; " + hu(c) + ")" + (deg < 0 ? " – negatív szög: óramutató járásával egyező irány" : "");
}
function showVal(){ g("tv").value = g("ur").checked ? hu(deg * Math.PI / 180, 4) : hu(deg, Number.isInteger(deg) ? 0 : 2); }
function setDeg(d, fromSlider){ deg = d; if (!fromSlider) g("t").value = Math.max(-360, Math.min(360, Math.round(d / 15) * 15)); showVal(); draw(); }
g("t").addEventListener("input", () => setDeg(+g("t").value, true));
g("tv").addEventListener("change", () => { const v = parseFloat(g("tv").value.replace(",", ".").replace("−", "-"));
  if (!isFinite(v)) { showVal(); return; } setDeg(g("ur").checked ? v * 180 / Math.PI : v, false); });
g("ud").addEventListener("change", showVal); g("ur").addEventListener("change", showVal);
document.querySelectorAll("button[data-a]").forEach(b => b.addEventListener("click", () => setDeg(+b.dataset.a, false)));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
