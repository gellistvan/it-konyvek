<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maradékok és négyzetes hiba</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--fill:#e6e6e6;--fill2:#cfcfcf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--fill:#333;--fill2:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg:focus{outline:2px dashed var(--hl)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="a">a =</label><input id="a" type="range" min="-1" max="3" step="0.1" value="2" aria-label="Meredekség a">
<b id="av"></b>
<label for="c">c =</label><input id="c" type="range" min="-1" max="4" step="0.1" value="1" aria-label="Tengelymetszet c">
<b id="cv"></b>
<button id="bA">A</button><button id="bB">B</button><button id="bL">LS-megoldás</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
<svg id="v" viewBox="0 0 560 350" role="img" aria-label="Három mért pont, egy állítható egyenes, a függőleges maradékok és a rájuk rajzolt négyzetek; jobbra az SSE szintvonalai az (a, c) síkon az aktuális ponttal." style=""></svg>
<table aria-label="Maradékok"><thead><tr><th>i</th><th>tᵢ</th><th>yᵢ</th><th>ŷᵢ</th><th>rᵢ</th><th>rᵢ²</th></tr></thead><tbody id="tb"></tbody></table>
</div>
<p class="small">Pontok: (0, 1), (1, 3), (2, 2); egyenes y = at + c; a négyzetek összterülete az SSE. A minimum a legkisebb négyzetes megoldás, a = 0,5, c = 1,5 (SSE = 1,5). Számított értékek, nem mérés.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;parent.appendChild(e);return e;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 2; if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; let s = x.toFixed(d); if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, ""); return s.replace(".", ",").replace("-", "−"); }
function huf(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) x = 0; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function arrowHead(g, x0, y0, x1, y1, col, size){
  const a = Math.atan2(y1 - y0, x1 - x0), s = size || 9;
  const p = [[x1, y1], [x1 - s * Math.cos(a - 0.38), y1 - s * Math.sin(a - 0.38)], [x1 - s * Math.cos(a + 0.38), y1 - s * Math.sin(a + 0.38)]];
  mk(g, "polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col});
}
function arrow2(g, x0, y0, x1, y1, col, w, dash){
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const s = Math.min(9 + w, len * 0.6), a = Math.atan2(y1 - y0, x1 - x0);
  mk(g, "line", {x1: x0, y1: y0, x2: x1 - 0.8 * s * Math.cos(a), y2: y1 - 0.8 * s * Math.sin(a), stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  arrowHead(g, x0, y0, x1, y1, col, s);
}


const T = [0, 1, 2], Y = [1, 3, 2], svg = document.getElementById("v");
const L = 40, B = 330, S = 54;                 // bal panel: t in [-0.5; 5.2], y in [0; 5.5]
const X = t => L + (t + 0.5) * S, Yp = v => B - v * S;
const CX = 380, CW = 170, CB = 330, CH = 300;   // jobb panel: a in [-1;3], c in [-1;4]
const PA = a => CX + (a + 1) / 4 * CW, PC = c => CB - (c + 1) / 5 * CH;
function sse(a, c){ let s = 0; for (let i = 0; i < 3; i++) { const r = Y[i] - a * T[i] - c; s += r * r; } return s; }
function draw(){
  const a = +document.getElementById("a").value, c = +document.getElementById("c").value;
  document.getElementById("av").textContent = huf(a, 1); document.getElementById("cv").textContent = huf(c, 1);
  svg.innerHTML = "";
  // bal panel
  for (let v = 0; v <= 5; v++) { mk(svg, "line", {x1: X(-0.5), y1: Yp(v), x2: X(5.2), y2: Yp(v), stroke: cssv("--grid")}); mk(svg, "text", {x: L - 6, y: Yp(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); }
  for (let v = 0; v <= 5; v++) { mk(svg, "line", {x1: X(v), y1: Yp(0), x2: X(v), y2: Yp(5.5), stroke: cssv("--grid")}); mk(svg, "text", {x: X(v), y: B + 15, "text-anchor": "middle", "font-size": 11}, String(v)); }
  mk(svg, "text", {x: X(5.2), y: B + 15, "text-anchor": "end", "font-size": 12}, "t");
  mk(svg, "text", {x: L - 10, y: Yp(5.5) + 4, "text-anchor": "end", "font-size": 12}, "y");
  const defs = mk(svg, "defs", {}); const pat = mk(defs, "pattern", {id: "h", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"});
  mk(pat, "line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: cssv("--muted"), "stroke-width": 1.2});
  const cp = mk(defs, "clipPath", {id: "cl"}); mk(cp, "rect", {x: X(-0.5), y: Yp(5.5), width: X(5.2) - X(-0.5), height: Yp(0) - Yp(5.5)});
  const g = mk(svg, "g", {"clip-path": "url(#cl)"});
  let rows = "", s = 0, s1 = 0; const rs = [];
  for (let i = 0; i < 3; i++) {
    const yh = a * T[i] + c, r = Y[i] - yh; rs.push(r); s += r * r; s1 += Math.abs(r);
    if (Math.abs(r) > 1e-9) {
      mk(g, "rect", {x: X(T[i]), y: Yp(Math.max(Y[i], yh)), width: Math.abs(r) * S, height: Math.abs(r) * S, fill: "url(#h)", stroke: cssv("--muted")});
      mk(g, "line", {x1: X(T[i]), y1: Yp(Y[i]), x2: X(T[i]), y2: Yp(yh), stroke: cssv("--fg"), "stroke-width": 2, "stroke-dasharray": "5 3"});
    }
    rows += `<tr><td>${i + 1}</td><td>${T[i]}</td><td>${Y[i]}</td><td>${hu(yh, 2)}</td><td>${hu(r, 2)}</td><td>${hu(r * r, 2)}</td></tr>`;
  }
  mk(g, "line", {x1: X(-0.5), y1: Yp(a * -0.5 + c), x2: X(5.2), y2: Yp(a * 5.2 + c), stroke: cssv("--hl"), "stroke-width": 2.5});
  for (let i = 0; i < 3; i++) mk(svg, "circle", {cx: X(T[i]), cy: Yp(Y[i]), r: 5, fill: cssv("--fg")});
  // jobb panel: SSE szintvonalai
  mk(svg, "rect", {x: CX, y: CB - CH, width: CW, height: CH, fill: "none", stroke: cssv("--line")});
  const M = [[5, 3], [3, 3]], a0 = 0.5, c0 = 1.5;
  const cl2 = mk(defs, "clipPath", {id: "c2"}); mk(cl2, "rect", {x: CX, y: CB - CH, width: CW, height: CH});
  [2, 3, 5, 9, 15, 25, 40].forEach(Lv => { let d = "";
    for (let k = 0; k <= 90; k++) { const th = 2 * Math.PI * k / 90, u = [Math.cos(th), Math.sin(th)];
      const q = u[0] * (M[0][0] * u[0] + M[0][1] * u[1]) + u[1] * (M[1][0] * u[0] + M[1][1] * u[1]), rr = Math.sqrt((Lv - 1.5) / q);
      d += (k ? "L" : "M") + PA(a0 + rr * u[0]).toFixed(1) + "," + PC(c0 + rr * u[1]).toFixed(1); }
    mk(svg, "path", {d: d + "Z", fill: "none", stroke: cssv("--muted"), "clip-path": "url(#c2)"}); });
  [-1, 0, 1, 2, 3].forEach(v => mk(svg, "text", {x: PA(v), y: CB + 15, "text-anchor": "middle", "font-size": 11}, hu(v)));
  [-1, 0, 1, 2, 3, 4].forEach(v => mk(svg, "text", {x: CX - 5, y: PC(v) + 4, "text-anchor": "end", "font-size": 11}, hu(v)));
  mk(svg, "text", {x: CX + CW, y: CB + 28, "text-anchor": "end", "font-size": 12}, "a");
  mk(svg, "text", {x: CX - 22, y: CB - CH + 14, "text-anchor": "end", "font-size": 12}, "c");
  mk(svg, "text", {x: CX + CW / 2, y: CB - CH - 8, "text-anchor": "middle", "font-size": 12}, "SSE szintvonalai (2, 3, 5, 9, …)");
  mk(svg, "path", {d: `M${PA(a0)-6},${PC(c0)-6}L${PA(a0)+6},${PC(c0)+6}M${PA(a0)-6},${PC(c0)+6}L${PA(a0)+6},${PC(c0)-6}`, stroke: cssv("--fg"), "stroke-width": 2});
  mk(svg, "text", {x: PA(a0) + 8, y: PC(c0) + 16, "font-size": 11}, "min (0,5; 1,5)");
  mk(svg, "circle", {cx: PA(a), cy: PC(c), r: 6, fill: cssv("--hl2"), stroke: cssv("--fg")});
  document.getElementById("tb").innerHTML = rows;
  document.getElementById("status").textContent = `a = ${hu(a, 2)}, c = ${hu(c, 2)}: r = (${rs.map(v => hu(v, 2)).join("; ")}), SSE = Σrᵢ² = ${hu(s, 2)}, Σ|rᵢ| = ${hu(s1, 2)}` + (Math.abs(a - 0.5) < 1e-9 && Math.abs(c - 1.5) < 1e-9 ? " – ez a legkisebb négyzetes egyenes." : "");
}
function setAC(a, c){ document.getElementById("a").value = a; document.getElementById("c").value = c; draw(); }
["a", "c"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("bA").onclick = () => setAC(2, 1);
document.getElementById("bB").onclick = () => setAC(0, 2);
document.getElementById("bL").onclick = () => setAC(0.5, 1.5);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
