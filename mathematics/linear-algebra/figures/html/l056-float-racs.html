<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A float64 rácsa az 1 körül</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Bemenet">
  <label>1 <select id="sg" aria-label="Előjel"><option value="-1">−</option><option value="1">+</option></select></label>
  <label>δ = <input id="d" type="text" value="1e-16" aria-label="δ értéke" style="width:9em"></label>
  <button id="go">Kerekít</button>
  <button data-v="-1,1e-16">1 − 1e-16</button><button data-v="1,1e-16">1 + 1e-16</button>
  <button data-v="1,1.2e-16">1 + 1,2e-16</button><button data-v="1,1.1102230246251565e-16">1 + 2⁻⁵³ (döntetlen)</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 225" role="img" aria-label="Számegyenes 1 körül: alatta 2⁻⁵³, felette 2⁻⁵² távolságú rácspontok, a beírt 1 ± δ pont, a két szomszédos rácspont, a felezőpont és a kerekített érték"></svg>
<p class="small">A kerekítést a böngésző végzi: a JavaScript Number IEEE 754 binary64 (round-to-nearest, ties-to-even), ugyanaz, mint a Python float és a NumPy float64. A beírt δ maga is binary64-re kerekül. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const U = Math.pow(2, -53);
function sup(n){ const m = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹","-":"⁻"}; return String(n).split("").map(c => m[c] || c).join(""); }
function lab(k){ if (k === 0) return "1"; const s = k < 0 ? "1 − " : "1 + ", a = Math.abs(k);
  if (a === 1) return s + "2⁻⁵³"; if (a === 2) return s + "2⁻⁵²"; return s + a + "·2⁻⁵³"; }
function draw(){
  const sg = +$("sg").value, dv = Number($("d").value.replace(",", "."));
  svg.innerHTML = "";
  if (!(dv > 0) || dv > 0.25) { $("status").innerHTML = '<span class="err">δ legyen 0 és 0,25 közötti pozitív szám (pl. 1e-16)</span>'; return; }
  const r = sg < 0 ? 1 - dv : 1 + dv;           // a böngésző binary64-kerekítése
  const t = sg * dv / U;                         // a pontos valós pont helye u egységben (δ már binary64)
  const k = (r - 1) / U;                         // a kerekített érték helye (egész)
  const sp = t < 0 ? 1 : 2, a = Math.floor(t/sp)*sp, b = a + sp, mid = (a + b)/2;
  // ablak: a valós pont körül ±5 rácslépés, de ha az 1 közel van, azt is mutatjuk
  let c = t, half = 5*sp; if (Math.abs(t) < 6) { c = 0.5; half = 5.5; }
  const L = 30, R = 530, X = v => L + (R - L)*(v - (c - half))/(2*half), Y = 120;
  const fg = css("--fg"), mu = css("--muted");
  el("line", {x1: L - 10, y1: Y, x2: R + 10, y2: Y, stroke: fg, "stroke-width": 1.4});
  const g0 = Math.ceil(c - half), g1 = Math.floor(c + half);
  for (let g = g0; g <= g1; g++) { const ok = g <= 0 || g % 2 === 0; if (!ok) continue;
    el("line", {x1: X(g), y1: Y - 12, x2: X(g), y2: Y + 12, stroke: fg, "stroke-width": 1.4});
    if (Math.abs(g) < 1000 || (g - a) % (2*sp) === 0) el("text", {x: X(g), y: Y + 30, "text-anchor": "middle", "font-size": 11, fill: mu}, g === 0 ? "1" : (g > 0 ? "+" : "−") + Math.abs(g) + "u"); }
  if (c - half < 0 && c + half > 0) { el("text", {x: X(-2.5), y: Y - 50, "text-anchor": "middle", "font-size": 12}, "rácstávolság u = 2⁻⁵³");
    el("text", {x: X(3), y: Y - 50, "text-anchor": "middle", "font-size": 12}, "rácstávolság 2u = 2⁻⁵² = ε_mach"); }
  el("line", {x1: X(mid), y1: Y - 34, x2: X(mid), y2: Y + 20, stroke: fg, "stroke-dasharray": "5 4"});
  el("text", {x: X(mid), y: Y - 38, "text-anchor": "middle", "font-size": 11}, "felezőpont");
  [a, b].forEach(g => el("circle", {cx: X(g), cy: Y, r: 6, fill: g === k ? css("--hl") : fg}));
  if (c - half <= 0 && c + half >= 0) el("rect", {x: X(0) - 6, y: Y - 6, width: 12, height: 12, fill: fg});
  el("circle", {cx: X(t), cy: Y, r: 7, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.4});
  el("text", {x: X(t), y: Y + 52, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "1 " + (sg < 0 ? "−" : "+") + " " + $("d").value);
  if (Math.abs(X(k) - X(t)) > 3) {
    el("line", {x1: X(t), y1: Y - 20, x2: X(k), y2: Y - 20, stroke: css("--hl"), "stroke-width": 2});
    const d = X(k) > X(t) ? -1 : 1; el("polygon", {points: [[X(k), Y - 20], [X(k) + 9*d, Y - 25], [X(k) + 9*d, Y - 15]].map(z => z.join(",")).join(" "), fill: css("--hl")}); }
  el("text", {x: 280, y: 215, "text-anchor": "middle", "font-size": 12}, "a tengely egysége u = 2⁻⁵³ ≈ 1,11·10⁻¹⁶; a kék pont a kerekített érték");
  const dist = Math.abs(t - k)*U;
  $("status").textContent = "1 " + (sg < 0 ? "−" : "+") + " " + $("d").value + " → " + String(r) + " (= " + lab(k) + ") | szomszédos rácspontok: " + lab(a) + " és " + lab(b) +
    ", felezőpont: " + (Number.isInteger(mid) ? lab(mid) : (Math.abs(mid) === 0.5 ? "1 " + (mid < 0 ? "−" : "+") + " 2⁻⁵⁴" : "1 " + (mid < 0 ? "−" : "+") + " " + String(Math.abs(mid)).replace(".", ",") + "·2⁻⁵³")) + " | a pontos érték távolsága a kerekítettől ≈ " + dist.toExponential(2).replace(".", ",") +
    (r === 1 ? " | az 1-hez adott δ elveszett" : "") + (Math.abs(t - mid) < 1e-12 ? " | döntetlen: a páros mantisszájú szomszédra kerekít" : "");
}
$("go").onclick = draw; $("sg").onchange = draw;
$("d").addEventListener("keydown", e => { if (e.key === "Enter") draw(); });
document.querySelectorAll("button[data-v]").forEach(bt => bt.addEventListener("click", () => { const v = bt.dataset.v.split(","); $("sg").value = v[0]; $("d").value = v[1]; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
