<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tengely szerinti összegzés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Művelet és lépések">
  <label for="op">Művelet:</label>
  <select id="op"><option value="0">A.sum(axis=0)</option><option value="1">A.sum(axis=1)</option><option value="2">A.sum()</option><option value="3">A.mean(axis=0)</option><option value="4">A[1, :]</option><option value="5">A[:, 1]</option><option value="6">A[0, 2]</option></select>
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev">◀ Lépés</button>
  <button id="play">▶ Lejátszás</button>
  <button id="next">Lépés ▶</button>
  <span id="cnt" class="small"></span>
</div>
<div class="ctl" role="group" aria-label="A tömb celláinak értékei">
  <span class="small">A cellái (szerkeszthetők):</span>
  <span id="cells"></span>
  <button id="reset">Alapértékek</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 300" role="img" aria-label="A 2×3-as A tömb; a kiválasztott művelet forráscellái kiemelve, alatta vagy mellette az eredmény"></svg>
  <pre id="code" aria-label="NumPy-kód"></pre>
</div>
<p class="small">A NumPy-indexek 0-tól indulnak. Kezdőállapot: A.sum(axis=0) a könyv 2.4 példáján (A = [[1, 2, 3], [4, 5, 6]]); az utolsó lépés állapotsora a 2.4.6 kimenetével egyező alakú.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


const A0 = [[1, 2, 3], [4, 5, 6]];
let A = A0.map(r => r.slice());
const OPS = ["A.sum(axis=0)", "A.sum(axis=1)", "A.sum()", "A.mean(axis=0)", "A[1, :]", "A[:, 1]", "A[0, 2]"];
let op = 0, k = 0, timer = null;
const CW = 64, X0 = 150, Y0 = 70;
// mezők
const cellsEl = g("cells");
for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) {
  const inp = document.createElement("input"); inp.type = "number"; inp.id = "c" + i + j; inp.value = A[i][j];
  inp.setAttribute("aria-label", "A[" + i + ", " + j + "]"); inp.style.width = "4em";
  inp.addEventListener("change", () => { const v = parseFloat(inp.value); A[i][j] = isFinite(v) ? v : 0; inp.value = A[i][j]; rebuild(); });
  cellsEl.appendChild(inp);
}
function num(x){ return Number.isInteger(x) ? String(x) : String(+x.toFixed(4)).replace(".", ","); }
function npArr(a){ // NumPy-szerű kiírás (egész: szélesség igazítás; tört: lebegőpontos)
  const allInt = a.every(Number.isInteger) && !(OPS[op].indexOf("mean") >= 0);
  const s = a.map(x => allInt ? String(x) : (Number.isInteger(x) ? x + "." : String(+x.toFixed(8))));
  const w = Math.max(...s.map(t => t.length)); return "[" + s.map(t => t.padStart(w)).join(" ") + "]"; }
// lépéssor: minden lépés {cells: [[i,j]...] kiemelt forráscellák, res: részeredmények, cur: aktuális eredményindex, msg}
function build(){
  const st = [], o = OPS[op];
  if (o === "A.sum(axis=0)" || o === "A.mean(axis=0)") {
    const mean = o.indexOf("mean") >= 0, res = [null, null, null];
    st.push({cells: [], res: res.slice(), cur: -1, msg: o + ": oszloponként lefelé haladunk (a 0. tengely tűnik el). Lépj!"});
    for (let j = 0; j < 3; j++) { const s = A[0][j] + A[1][j]; res[j] = mean ? s / 2 : s;
      st.push({cells: [[0, j], [1, j]], res: res.slice(), cur: j, msg: (mean ? "(" : "") + num(A[0][j]) + " + " + num(A[1][j]) + (mean ? ") / 2" : "") + " = " + num(res[j]) + "  → eredmény[" + j + "]"}); }
    st[st.length - 1].msg += "   |   " + o + " = " + npArr(res) + "  shape (3,)";
    return {st: st, kind: "row"};
  }
  if (o === "A.sum(axis=1)") {
    const res = [null, null];
    st.push({cells: [], res: res.slice(), cur: -1, msg: o + ": soronként jobbra haladunk (az 1. tengely tűnik el). Lépj!"});
    for (let i = 0; i < 2; i++) { res[i] = A[i][0] + A[i][1] + A[i][2];
      st.push({cells: [[i, 0], [i, 1], [i, 2]], res: res.slice(), cur: i, msg: A[i].map(num).join(" + ") + " = " + num(res[i]) + "  → eredmény[" + i + "]"}); }
    st[st.length - 1].msg += "   |   " + o + " = " + npArr(res) + "  shape (2,)";
    return {st: st, kind: "col"};
  }
  if (o === "A.sum()") {
    let s = 0; const used = [];
    st.push({cells: [], res: [null], cur: -1, msg: "A.sum(): minden elemet összeadunk, mindkét tengely eltűnik. Lépj!"});
    for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) { s += A[i][j]; used.push([i, j]);
      st.push({cells: used.slice(), res: [s], cur: 0, msg: "részösszeg + A[" + i + ", " + j + "] = " + num(s)}); }
    st[st.length - 1].msg = "A.sum() = " + num(s) + "  (skalár, shape ())";
    return {st: st, kind: "one"};
  }
  const sel = {"A[1, :]": [[1, 0], [1, 1], [1, 2]], "A[:, 1]": [[0, 1], [1, 1]], "A[0, 2]": [[0, 2]]}[o];
  const vals = sel.map(c => A[c[0]][c[1]]);
  const shp = sel.length === 3 ? "shape (3,)" : sel.length === 2 ? "shape (2,)" : "skalár";
  st.push({cells: sel, res: vals, cur: -2, msg: o + " = " + (sel.length > 1 ? npArr(vals) : num(vals[0])) + "  " + shp + " (kiválasztás, nincs összegzés)"});
  return {st: st, kind: "sel"};
}
let B = build();
function stop(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
function rebuild(){ stop(); B = build(); show(0); }
function inSel(c, i, j){ return c.some(q => q[0] === i && q[1] === j); }
function show(i){
  k = Math.max(0, Math.min(B.st.length - 1, i)); const s = B.st[k];
  g("cnt").textContent = (k + 1) + "/" + B.st.length;
  g("status").textContent = s.msg;
  svg.innerHTML = "";
  el("defs", {}).innerHTML = '<pattern id="ph" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--fg") + '" stroke-width="1.5"/></pattern>' +
    '<pattern id="pd" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.5" fill="' + css("--fg") + '"/></pattern>';
  el("text", {x: X0 + 1.5 * CW, y: 22, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "oszlopindex (1. tengely)");
  el("text", {x: 40, y: Y0 + CW, "text-anchor": "middle", "font-size": 13, fill: css("--muted"), transform: "rotate(-90 40 " + (Y0 + CW) + ")"}, "sorindex (0. tengely)");
  for (let j = 0; j < 3; j++) el("text", {x: X0 + j * CW + CW / 2, y: Y0 - 10, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, String(j));
  for (let r = 0; r < 2; r++) el("text", {x: X0 - 14, y: Y0 + r * CW + CW / 2 + 5, "text-anchor": "end", "font-size": 13, fill: css("--muted")}, String(r));
  const opn = OPS[op];
  for (let r = 0; r < 2; r++) for (let j = 0; j < 3; j++) {
    const on = inSel(s.cells, r, j), x = X0 + j * CW, y = Y0 + r * CW;
    el("rect", {x: x, y: y, width: CW, height: CW, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    if (B.kind === "sel" && on) {
      if (opn === "A[1, :]" || (opn === "A[0, 2]")) el("rect", {x: x, y: y, width: CW, height: CW, fill: "url(#ph)", opacity: 0.5});
      if (opn === "A[:, 1]") el("rect", {x: x, y: y, width: CW, height: CW, fill: "url(#pd)", opacity: 0.6});
    }
    el("text", {x: x + CW / 2, y: y + CW / 2 + 7, "text-anchor": "middle", "font-size": 20, "font-weight": on ? "bold" : "normal"}, num(A[r][j]));
  }
  const fg = css("--fg"), hl = css("--hl");
  if (B.kind === "row") {
    for (let j = 0; j < 3; j++) { const on = s.cur === j; arrow(X0 + j * CW + CW * 0.82, Y0 + 4, X0 + j * CW + CW * 0.82, Y0 + 2 * CW + 38, {col: on ? hl : css("--grid2"), w: on ? 3 : 1.5});
      const v = s.res[j]; el("rect", {x: X0 + j * CW, y: Y0 + 2 * CW + 42, width: CW, height: CW * 0.7, fill: v === null ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
      if (v !== null) el("text", {x: X0 + j * CW + CW / 2, y: Y0 + 2 * CW + 42 + CW * 0.35 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, num(v)); }
    el("text", {x: X0 + 3 * CW + 20, y: Y0 + 2 * CW + 42 + CW * 0.35 + 6, "font-size": 15}, "shape (2, 3) → (3,)");
  } else if (B.kind === "col") {
    for (let r = 0; r < 2; r++) { const on = s.cur === r; arrow(X0 + 4, Y0 + r * CW + CW * 0.82, X0 + 3 * CW + 40, Y0 + r * CW + CW * 0.82, {col: on ? hl : css("--grid2"), w: on ? 3 : 1.5});
      const v = s.res[r]; el("rect", {x: X0 + 3 * CW + 44, y: Y0 + r * CW, width: CW, height: CW, fill: v === null ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
      if (v !== null) el("text", {x: X0 + 3 * CW + 44 + CW / 2, y: Y0 + r * CW + CW / 2 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, num(v)); }
    el("text", {x: X0 + 1.5 * CW, y: Y0 + 2 * CW + 40, "text-anchor": "middle", "font-size": 15}, "shape (2, 3) → (2,)");
  } else if (B.kind === "one") {
    const v = s.res[0]; el("rect", {x: X0 + 3 * CW + 50, y: Y0 + CW / 2, width: CW * 1.2, height: CW, fill: v === null ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
    if (v !== null) el("text", {x: X0 + 3 * CW + 50 + CW * 0.6, y: Y0 + CW + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, num(v));
    el("text", {x: X0 + 1.5 * CW, y: Y0 + 2 * CW + 40, "text-anchor": "middle", "font-size": 15}, "shape (2, 3) → () skalár");
  } else {
    const vals = s.res; vals.forEach((v, q) => { el("rect", {x: X0 + q * CW, y: Y0 + 2 * CW + 40, width: CW, height: CW * 0.7, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
      el("text", {x: X0 + q * CW + CW / 2, y: Y0 + 2 * CW + 40 + CW * 0.35 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, num(v)); });
    el("text", {x: X0 + vals.length * CW + 16, y: Y0 + 2 * CW + 40 + CW * 0.35 + 6, "font-size": 15}, "eredmény: " + opn);
  }
  // kódpanel
  const code = ["import numpy as np", "A = np.array(" + JSON.stringify(A).replace(/,/g, ", ") + ")", "print(\"" + opn + " =\", " + opn + ")"];
  g("code").innerHTML = code.map((l, q) => '<span class="' + (q === 2 ? "on" : "") + '">' + l.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>").join("");
}
g("op").addEventListener("change", () => { op = +g("op").value; rebuild(); });
g("first").onclick = () => { stop(); show(0); };
g("prev").onclick = () => { stop(); show(k - 1); };
g("next").onclick = () => { stop(); show(k + 1); };
g("play").onclick = () => { if (timer) { stop(); return; } if (k >= B.st.length - 1) show(0);
  g("play").textContent = "⏸ Szünet"; timer = setInterval(() => { if (k >= B.st.length - 1) stop(); else show(k + 1); }, 1000); };
g("reset").onclick = () => { A = A0.map(r => r.slice()); for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) g("c" + i + j).value = A[i][j]; rebuild(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
