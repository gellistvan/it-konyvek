<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A kvantáló lépcsőfüggvénye</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#ddd;--band:#eeeeee}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#444;--band:#2c2c2c}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px;max-width:260px}
input[type=number]{width:6.5em;font:inherit}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:3 1 340px;width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;font-size:13px;flex:1 1 200px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
th{background:var(--code);font-weight:600}
tr.on td{font-weight:bold;background:var(--cellhl)}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
<label for="b">b =</label><input id="b" type="range" min="2" max="8" step="1" value="2" style="max-width:110px"><b id="bv"></b>
<label for="xmin">x_min =</label><input id="xmin" type="range" min="-1.5" max="0" step="0.01" value="-0.75"><b id="xminv"></b>
<label for="xmax">x_max =</label><input id="xmax" type="range" min="0" max="1.5" step="0.01" value="0.35"><b id="xmaxv"></b>
<label for="x">x =</label><input id="x" type="range" min="-1.75" max="1.75" step="0.01" value="0.35"><b id="xv"></b>
<label><input id="sym" type="checkbox"> szimmetrikus (z = 0, s = max|x|/q_max); kikapcsolva aszimmetrikus</label>
<button id="reset">Alapállás</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 620 375" role="img" aria-label="Lépcsős rekonstrukció az y = x átló körül és alatta a kvantálási hiba fűrészfoga, a telített szakaszokkal"></svg>
<p id="info" style="flex:1 1 100%;margin:0"></p>
</div>

<p class="small">q(x) = clamp(round(x/s + z), q_min, q_max), x̂ = s(q − z); round: fél-egésznél páros felé (np.round). Szürke: kalibrált tartomány; sraffozott: telítés (a clamp lapos szakasza). Számított értékek a definícióból, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ if (Math.abs(x) < 0.5 * Math.pow(10, -d)) return "0"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function setCode(i){ document.querySelectorAll("#code span").forEach((x, j) => x.classList.toggle("on", j === i)); }


const E = id => document.getElementById(id);
function rhe(v){ const f = Math.floor(v), d = v - f; if (Math.abs(d - 0.5) < 1e-12) return (f % 2 === 0) ? f : f + 1; return Math.round(v); }
function params(){
  const b = +E("b").value, xmin = +E("xmin").value, xmax = +E("xmax").value, sym = E("sym").checked;
  const qmin = -Math.pow(2, b - 1), qmax = Math.pow(2, b - 1) - 1;
  let s, z; if (sym) { s = Math.max(Math.abs(xmin), Math.abs(xmax)) / qmax; z = 0; } else { s = (xmax - xmin) / (qmax - qmin); z = rhe(qmin - xmin / s); }
  return {b, xmin, xmax, sym, qmin, qmax, s, z};
}
function Q(x, P){ const y = x / P.s + P.z, r = rhe(y), c = Math.max(P.qmin, Math.min(P.qmax, r)); return {y, r, c, xh: P.s * (c - P.z)}; }
const X0 = 60, X1 = 600; let LO = -1.2, HI = 0.8;
const xs = v => X0 + (X1 - X0) * (v - LO) / (HI - LO);
const T1 = 15, B1 = 205, ys1 = v => B1 - (B1 - T1) * (v - (LO - 0.05)) / (HI - LO + 0.05);
const T2 = 235, B2 = 335, ys2 = v => B2 - (B2 - T2) * (v + 0.5) / 1.0;
function draw(){
  let xmin = +E("xmin").value, xmax = +E("xmax").value;
  if (xmax - xmin < 0.05) { xmax = xmin + 0.05; E("xmax").value = xmax; }
  LO = Math.min(-1.2, xmin - 0.25); HI = Math.max(0.8, xmax + 0.25);
  E("x").min = LO; E("x").max = HI;
  const P = params(), x = +E("x").value;
  ["b", "xmin", "xmax", "x"].forEach(id => E(id + "v").textContent = id === "b" ? E(id).value : fmt(+E(id).value, 2));
  svg.innerHTML = "";
  const defs = el("defs", {}), pat = el("pattern", {id: "hat", width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 7, stroke: css("--muted"), "stroke-width": 1.2}, undefined, pat);
  const hiS = (P.qmax + 0.5 - P.z) * P.s, loS = (P.qmin - 0.5 - P.z) * P.s;
  [[T1, B1], [T2, B2]].forEach(([t, b]) => {
    el("rect", {x: xs(Math.max(LO, P.xmin)), y: t, width: Math.max(0, xs(Math.min(HI, P.xmax)) - xs(Math.max(LO, P.xmin))), height: b - t, fill: css("--band")});
    if (hiS < HI) el("rect", {x: xs(hiS), y: t, width: X1 - xs(hiS), height: b - t, fill: "url(#hat)"});
    if (loS > LO) el("rect", {x: X0, y: t, width: xs(loS) - X0, height: b - t, fill: "url(#hat)"});
    el("rect", {x: X0, y: t, width: X1 - X0, height: b - t, fill: "none", stroke: css("--line")});
  });
  [-1.6, -1.2, -0.8, -0.4, 0, 0.4, 0.8, 1.2, 1.6].filter(v => v >= LO - 1e-9 && v <= HI + 1e-9).forEach(v => { el("line", {x1: xs(v), y1: B2, x2: xs(v), y2: B2 + 4, stroke: css("--line")}); el("text", {x: xs(v), y: B2 + 17, "text-anchor": "middle", "font-size": 11}, fmt(v, 1)); });
  [-1.6, -1.2, -0.8, -0.4, 0, 0.4, 0.8, 1.2, 1.6].forEach(v => { if (v >= LO - 0.05 && v <= HI + 1e-9) el("text", {x: X0 - 5, y: ys1(v) + 4, "text-anchor": "end", "font-size": 10}, fmt(v, 1)); });
  [-0.4, -0.2, 0, 0.2, 0.4].forEach(v => el("text", {x: X0 - 5, y: ys2(v) + 4, "text-anchor": "end", "font-size": 10}, fmt(v, 1)));
  el("text", {x: (X0 + X1) / 2, y: B2 + 32, "text-anchor": "middle", "font-size": 12}, "x");
  el("text", {x: 14, y: (T1 + B1) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T1 + B1) / 2})`}, "x̂");
  el("text", {x: 14, y: (T2 + B2) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T2 + B2) / 2})`}, "x − x̂");
  el("line", {x1: xs(LO), y1: ys1(LO), x2: xs(HI), y2: ys1(HI), stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": "6 4"});
  // lépcső és hiba
  let p1 = "", p2 = "", prev = null, maxErr = 0;
  const NPT = 1600;
  for (let i = 0; i <= NPT; i++) {
    const v = LO + (HI - LO) * i / NPT, r = Q(v, P).xh;
    p1 += (prev !== null && Math.abs(r - prev) > 1e-12 ? "M" : (p1 ? "L" : "M")) + xs(v).toFixed(1) + "," + ys1(r).toFixed(1);
    p2 += (p2 ? "L" : "M") + xs(v).toFixed(1) + "," + ys2(Math.max(-0.5, Math.min(0.5, v - r))).toFixed(1);
    prev = r;
  }
  for (let i = 0; i <= 40000; i++) { const v = P.xmin + (P.xmax - P.xmin) * i / 40000; maxErr = Math.max(maxErr, Math.abs(v - Q(v, P).xh)); }
  el("path", {d: p1, fill: "none", stroke: css("--fg"), "stroke-width": 3});
  el("path", {d: p2, fill: "none", stroke: css("--fg"), "stroke-width": 1.6});
  [P.s / 2, -P.s / 2].forEach(v => { if (Math.abs(v) < 0.5) el("line", {x1: X0, y1: ys2(v), x2: X1, y2: ys2(v), stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "2 3"}); });
  const R = Q(x, P);
  el("line", {x1: xs(x), y1: T1, x2: xs(x), y2: B2, stroke: css("--hl2"), "stroke-width": 1.2});
  el("circle", {cx: xs(x), cy: ys1(R.xh), r: 6, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2.5});
  el("circle", {cx: xs(x), cy: ys2(Math.max(-0.5, Math.min(0.5, x - R.xh))), r: 5, fill: css("--hl2")});
  const nlev = P.qmax - P.qmin + 1;
  el("text", {x: X0 + 8, y: T1 + 16, "text-anchor": "start", "font-size": 11}, `${nlev} szint, s = ${fmt(P.s, 4)}, z = ${P.z}`);
  el("text", {x: X0 + 8, y: T2 + 14, "text-anchor": "start", "font-size": 11, fill: css("--hl")}, `±s/2 = ±${fmt(P.s / 2, 4)}`);
  E("status").textContent = `x = ${fmt(x, 2)} → x/s + z = ${fmt(R.y, 4)} → round = ${String(R.r).replace("-", "−")} → clamp = ${String(R.c).replace("-", "−")} → x̂ = ${fmt(R.xh, 4)}, |hiba| = ${fmt(Math.abs(x - R.xh), 4)}`;
  E("info").textContent = `Szintek száma 2^b = ${nlev}; a kalibrált tartományban mért legnagyobb |hiba| ≈ ${fmt(maxErr, 4)} (s/2 = ${fmt(P.s / 2, 4)}).` + (nlev <= 8 ? " Szintek: " + Array.from({length: nlev}, (_, k) => fmt(P.s * (P.qmin + k - P.z), 4)).join("; ") + "." : "");
}
["b", "xmin", "xmax", "x", "sym"].forEach(id => E(id).addEventListener("input", draw));
E("reset").onclick = () => { E("b").value = 2; E("xmin").value = -0.75; E("xmax").value = 0.35; E("x").value = 0.35; E("sym").checked = false; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
const qs = new URLSearchParams(location.search); ["b", "xmin", "xmax", "x"].forEach(k => { if (qs.get(k)) E(k).value = qs.get(k); });
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
