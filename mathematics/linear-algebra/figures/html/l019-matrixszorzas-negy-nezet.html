<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mátrixszorzás négy nézőpontból</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--grid2:#9a9a9a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--grid2:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=number],input[type=text]{font:inherit;width:5em;padding:2px 4px}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="tablist" aria-label="Nézet">
  <button role="tab" data-v="0" aria-selected="true">(1) elemenként</button>
  <button role="tab" data-v="1">(2) oszlopnézet</button>
  <button role="tab" data-v="2">(3) sornézet</button>
  <button role="tab" data-v="3">(4) külső szorzat</button>
</div>
<div class="ctl" role="group" aria-label="Lejátszás">
  <button id="first" title="Első lépés">⏮</button><button id="prev">◀ Lépés</button>
  <button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
  <span id="cnt" class="small"></span>
  <button id="reset">Alapértékek</button>
</div>
<div class="ctl" id="ed" role="group" aria-label="A és B elemei (szerkeszthetők)"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 200" role="img" aria-label="Az A (2×3) és B (3×2) mátrix és a C = AB szorzat; a kiválasztott nézet aktuális lépésében használt sorok, oszlopok és C-elemek kiemelve"></svg>
  <pre id="code" aria-label="NumPy-kód"></pre>
</div>
<p class="small">A 6.3 kidolgozott példája (egzakt egész számítás). A kódpanel indexei 0-tól indulnak (i, j, k = 0, 1, …), a képletekben 1-től (c11, a1, r1). Kezdőállapot: elemenkénti nézet, 0. lépés. Vonalkázás: a használt sor/oszlop; pöttyözés: a kiszámolt C-elem.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }


const A0 = [[1, 2, 0], [3, 1, 1]], B0 = [[2, 1], [0, 4], [1, 2]], CODE = ["C[i, j] = A[i, :] @ B[:, j]", "C[:, j] = A @ B[:, j]", "C[i, :] = A[i, :] @ B", "C += np.outer(A[:, k], B[k, :])"];
let A = A0.map(r => r.slice()), Bm = B0.map(r => r.slice()), view = 0, k = 0, timer = null, ST = [];
const CS = 40;
function mm(){ return [0, 1].map(i => [0, 1].map(j => A[i][0] * Bm[0][j] + A[i][1] * Bm[1][j] + A[i][2] * Bm[2][j])); }
function npm(M){ const w = Math.max(...M.flat().map(x => String(x).length)); return "[" + M.map(r => "[" + r.map(x => String(x).padStart(w)).join(" ") + "]").join(" ") + "]"; }
function build(){
  const C = mm(), st = [], E = () => [[null, null], [null, null]];
  if (view === 0) { const Cp = E(); st.push({a: [], b: [], c: [], C: E(), msg: "elemenként: c_ij = A i. sora · B j. oszlopa (0-tól indexelve a kódban). Lépj!"});
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { Cp[i][j] = C[i][j];
      st.push({a: [0, 1, 2].map(q => [i, q]), b: [0, 1, 2].map(q => [q, j]), c: [[i, j]], C: Cp.map(r => r.slice()), line: 0,
        msg: "elemenként, i = " + i + ", j = " + j + ": c" + (i + 1) + (j + 1) + " = " + [0, 1, 2].map(q => A[i][q] + "·" + Bm[q][j]).join(" + ") + " = " + C[i][j]}); } }
  if (view === 1) { const Cp = E(); st.push({a: [], b: [], c: [], C: E(), msg: "oszlopnézet: C j. oszlopa = A oszlopainak kombinációja B j. oszlopának súlyaival. Lépj!"});
    for (let j = 0; j < 2; j++) { Cp[0][j] = C[0][j]; Cp[1][j] = C[1][j];
      st.push({a: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]], b: [0, 1, 2].map(q => [q, j]), c: [[0, j], [1, j]], C: Cp.map(r => r.slice()), line: 1, plain: "a",
        msg: "oszlopnézet, j = " + j + ": A·b" + (j + 1) + " = " + [0, 1, 2].map(q => Bm[q][j] + "·a" + (q + 1)).join(" + ") + " = (" + C[0][j] + ", " + C[1][j] + ")"}); } }
  if (view === 2) { const Cp = E(); st.push({a: [], b: [], c: [], C: E(), msg: "sornézet: C i. sora = B sorainak kombinációja A i. sorának súlyaival. Lépj!"});
    for (let i = 0; i < 2; i++) { Cp[i] = C[i].slice();
      st.push({a: [0, 1, 2].map(q => [i, q]), b: [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]], c: [[i, 0], [i, 1]], C: Cp.map(r => r.slice()), line: 2, plain: "b",
        msg: "sornézet, i = " + i + ": a(" + (i + 1) + ")·B = " + [0, 1, 2].map(q => A[i][q] + "·r" + (q + 1)).join(" + ") + " = (" + C[i][0] + ", " + C[i][1] + ")"}); } }
  if (view === 3) { let S = [[0, 0], [0, 0]]; st.push({a: [], b: [], c: [], C: S.map(r => r.slice()), msg: "külső szorzat: C = Σ_k A[:, k] ⊗ B[k, :]; a részösszeg kezdetben nulla. Lépj!"});
    for (let q = 0; q < 3; q++) { const Lq = [0, 1].map(i => [0, 1].map(j => A[i][q] * Bm[q][j])); S = S.map((r, i) => r.map((x, j) => x + Lq[i][j]));
      st.push({a: [[0, q], [1, q]], b: [[q, 0], [q, 1]], c: [[0, 0], [0, 1], [1, 0], [1, 1]], C: S.map(r => r.slice()), layer: Lq, line: 3,
        msg: "külső szorzat, k = " + q + ": réteg " + npm(Lq) + "; részösszeg " + npm(S)}); } }
  st[st.length - 1].msg += "   |   C = " + npm(C);
  return st;
}
function pattern(){ el("defs", {}).innerHTML = '<pattern id="ph" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--fg") + '" stroke-width="1.3"/></pattern>' +
  '<pattern id="pd" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.4" fill="' + css("--fg") + '"/></pattern>'; }
function grid(M, x0, y0, sel, kind, label, editable){
  const r = M.length, c = M[0].length;
  el("text", {x: x0 + c * CS / 2, y: y0 - 8, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, label);
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) {
    const on = sel.some(q => q[0] === i && q[1] === j), x = x0 + j * CS, y = y0 + i * CS;
    el("rect", {x: x, y: y, width: CS, height: CS, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1});
    if (on && kind) el("rect", {x: x, y: y, width: CS, height: CS, fill: kind === "c" ? "url(#pd)" : "url(#ph)", opacity: 0.4});
    const v = M[i][j];
    if (v !== null) { el("rect", {x: x + CS / 2 - 13, y: y + CS / 2 - 11, width: 26, height: 21, fill: css("--bg"), opacity: 0.85});
      const t = el("text", {x: x + CS / 2, y: y + CS / 2 + 6, "text-anchor": "middle", "font-size": 16, "font-weight": on ? "bold" : "normal"}, String(v));
      if (editable) { t.style.cursor = "pointer"; t.addEventListener("click", () => edit(editable, i, j)); } }
  }
}
function edit(which, i, j){ const M = which === "A" ? A : Bm; const s = prompt(which + "[" + i + ", " + j + "] új értéke (egész):", M[i][j]);
  if (s === null) return; const v = parseInt(s.replace("−", "-"), 10); if (!isFinite(v)) return; M[i][j] = v; syncInputs(); rebuild(); }
function show(n){
  k = Math.max(0, Math.min(ST.length - 1, n)); const s = ST[k];
  g("cnt").textContent = (k + 1) + "/" + ST.length; g("status").textContent = s.msg;
  svg.innerHTML = ""; pattern();
  grid(A, 20, 70, s.a, s.plain === "a" ? "" : "a", "A (2×3)", null);
  el("text", {x: 155, y: 115, "text-anchor": "middle", "font-size": 22}, "·");
  grid(Bm, 175, 50, s.b, s.plain === "b" ? "" : "b", "B (3×2)", null);
  el("text", {x: 275, y: 115, "text-anchor": "middle", "font-size": 22}, "=");
  grid(s.C, 295, 70, s.c, "c", view === 3 ? "részösszeg" : "C (2×2)", null);
  if (s.layer) { el("text", {x: 400, y: 115, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "réteg:");
    grid(s.layer, 430, 70, [[0, 0], [0, 1], [1, 0], [1, 1]], "a", "a" + (s.a[0][1] + 1) + "r" + (s.a[0][1] + 1), null); }
  g("code").querySelectorAll("span").forEach((x, q) => x.classList.toggle("on", q === s.line));
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
function rebuild(){ stop(); ST = build(); show(0); }
function syncInputs(){ for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) g("a" + i + j).value = A[i][j]; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) g("b" + i + j).value = Bm[i][j]; }
// szerkesztőmezők
(function(){ let h = '<span class="small">A:</span>'; for (let i = 0; i < 2; i++) { for (let j = 0; j < 3; j++) h += '<input type="number" id="a' + i + j + '" aria-label="A[' + i + ', ' + j + ']" style="width:3.6em">'; h += i === 0 ? ' / ' : ''; }
  h += ' &nbsp; <span class="small">B:</span>'; for (let i = 0; i < 3; i++) { for (let j = 0; j < 2; j++) h += '<input type="number" id="b' + i + j + '" aria-label="B[' + i + ', ' + j + ']" style="width:3.6em">'; h += i < 2 ? ' / ' : ''; }
  g("ed").innerHTML = h; syncInputs();
  for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) g("a" + i + j).addEventListener("change", e => { const v = parseInt(e.target.value, 10); A[i][j] = isFinite(v) ? v : 0; syncInputs(); rebuild(); });
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) g("b" + i + j).addEventListener("change", e => { const v = parseInt(e.target.value, 10); Bm[i][j] = isFinite(v) ? v : 0; syncInputs(); rebuild(); });
})();
g("code").innerHTML = CODE.map(l => "<span>" + l.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>").join("");
document.querySelectorAll("button[role=tab]").forEach(b => b.addEventListener("click", () => { view = +b.dataset.v;
  document.querySelectorAll("button[role=tab]").forEach(x => { x.setAttribute("aria-selected", x === b ? "true" : "false"); x.style.fontWeight = x === b ? "bold" : "normal"; }); rebuild(); }));
document.querySelector("button[role=tab]").style.fontWeight = "bold";
g("first").onclick = () => { stop(); show(0); }; g("prev").onclick = () => { stop(); show(k - 1); }; g("next").onclick = () => { stop(); show(k + 1); };
g("play").onclick = () => { if (timer) { stop(); return; } if (k >= ST.length - 1) show(0); g("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= ST.length - 1) stop(); else show(k + 1); }, 1100); };
g("reset").onclick = () => { A = A0.map(r => r.slice()); Bm = B0.map(r => r.slice()); syncInputs(); rebuild(); };
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
ST = build(); show(0);

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
