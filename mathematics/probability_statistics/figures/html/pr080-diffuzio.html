<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diffúziós modell egy dimenzióban</title>
<style>
/* A context.md „Színek és jelek” rendszere (világos és sötét mód). */
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#e6e6e6;--frame:#999;
  --sim:#2b6cb0;--est:#c55a11;--reject:#b91c1c;--stop:#2f7d32;--traj:#8c8c8c;--trajhl:#14365c;--accent:#7030a0}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#333;--frame:#666;
  --sim:#7ab3ef;--est:#f0a060;--reject:#ff7b7b;--stop:#7fd27f;--traj:#8a8a8a;--trajhl:#cfe3ff;--accent:#c9a0f0}}
*{box-sizing:border-box}
body{margin:0;padding:8px 10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl,.params{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:2px 9px;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:120px}
label.param{display:flex;align-items:center;gap:6px}
label.param input{width:120px}
label.param output{min-width:3.6em;font-variant-numeric:tabular-nums}
label.toggle{display:flex;align-items:center;gap:4px}
label.disabled{opacity:.45}
#status{min-height:2.9em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
#status.error{color:#c00;font-weight:600}
svg{width:100%;height:auto;display:block;font-family:system-ui,sans-serif}
.small,.note{font-size:12px;color:var(--muted)}

/* ---- SVG-szövegek ---- */
text{fill:var(--fg);font-size:12px}
.label{font-size:12px}.tick{font-size:11px;fill:var(--muted)}.axis-label{font-size:12px;fill:var(--muted)}
.plot-title{font-size:12.5px;font-weight:600}.legend-text{font-size:11.5px}.big{font-size:15px;font-weight:600}
.node-label{font-size:13px;font-weight:600}
.edge-label{font-size:11.5px;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
text.halo{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
text.t-sim{fill:var(--sim)}text.t-est{fill:var(--est)}text.t-reject{fill:var(--reject)}text.t-stop{fill:var(--stop)}
text.t-muted{fill:var(--muted)}text.t-bg{fill:var(--bg)}

/* ---- tengelyek ---- */
.frame{fill:none;stroke:var(--frame);stroke-width:1}
.grid{stroke:var(--grid);stroke-width:.7}
.axis{stroke:var(--frame);stroke-width:1}
.guide{stroke:var(--muted);stroke-width:1.1;stroke-dasharray:3 3;fill:none}
.legend-bg{fill:var(--bg);fill-opacity:.85;stroke:none}

/* ---- elmélet: fekete folytonos (theory2/3: további elméleti görbék vonalstílussal) ---- */
.theory{stroke:var(--fg);stroke-width:1.8;fill:none}
.theory2{stroke:var(--fg);stroke-width:1.6;stroke-dasharray:8 3 2 3;fill:none}
.theory3{stroke:var(--fg);stroke-width:1.8;stroke-dasharray:1.5 3;stroke-linecap:round;fill:none}
.theory-dot{fill:var(--fg)}
.open-dot{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}

/* ---- szimuláció: kék ---- */
.sim{fill:var(--sim);fill-opacity:.32;stroke:var(--sim);stroke-width:.9}
.sim2{fill:url(#hatch-sim);stroke:var(--sim);stroke-width:1}
.sim-line{stroke:var(--sim);stroke-width:1.6;fill:none}
.sim-dot{fill:var(--sim)}
.sample{stroke:var(--sim);stroke-opacity:.5}
.sample-est{stroke:var(--est);stroke-opacity:.6}
.sample-reject{stroke:var(--reject);stroke-opacity:.6}
.sample-muted{stroke:var(--traj);stroke-opacity:.55}
.heat{fill:var(--sim);stroke:none}
.hl-fill{fill:var(--sim);fill-opacity:.35;stroke:none}

/* ---- becslés: narancs szaggatott; bizonytalanság: halvány narancs ---- */
.estimate{stroke:var(--est);stroke-width:2;stroke-dasharray:6 4;fill:none}
.estimate2{stroke:var(--est);stroke-width:2;stroke-dasharray:1.5 3;stroke-linecap:round;fill:none}
.estimate-dot{fill:var(--est)}
.estimate-bar{stroke:var(--est);stroke-width:1.8;fill:none}
.estimate-fill{fill:var(--est);fill-opacity:.35;stroke:var(--est);stroke-width:1}
.band-est{fill:var(--est);fill-opacity:.2;stroke:none}
.band-sim{fill:var(--sim);fill-opacity:.15;stroke:none}
.band{fill:var(--muted);fill-opacity:.18;stroke:none}

/* ---- kritikus tartomány, elutasítás, ritka esemény: piros sraffozás ---- */
.reject{fill:url(#hatch-red);stroke:var(--reject);stroke-width:1}
.reject-line{stroke:var(--reject);stroke-width:1.8;fill:none}
.reject-dot{fill:var(--reject)}

/* ---- trajektóriák, megállás ---- */
.traj{stroke:var(--traj);stroke-width:.9;opacity:.5;fill:none}
.traj-hl{stroke:var(--trajhl);stroke-width:1.7;fill:none;stroke-linejoin:round}
.stop{fill:var(--stop);stroke:var(--fg);stroke-width:.8}
.stop-line{stroke:var(--stop);stroke-width:1.6;stroke-dasharray:2 3;fill:none}
.accent{stroke:var(--accent);stroke-width:1.6;fill:none}
.accent-dot{fill:var(--accent)}
.contour{stroke:var(--muted);stroke-width:.9;fill:none}

/* ---- állapotgráf ---- */
.state{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}
.state-on{fill:color-mix(in srgb,var(--sim) 35%,var(--bg));stroke:var(--fg);stroke-width:3}
.state-alt{fill:url(#dots);stroke:var(--fg);stroke-width:1.5}
.state-bad{fill:url(#hatch-red);stroke:var(--reject);stroke-width:2}
.state-dim{fill:var(--bg);stroke:var(--frame);stroke-width:1;stroke-dasharray:3 2}
.edge{stroke:var(--fg);stroke-width:1.3;fill:none}
.edge-dim{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3;fill:none}
.token{fill:var(--est);stroke:var(--fg);stroke-width:1.2}

/* ---- jelölők, minták ---- */
.mark{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.mark-sim{fill:var(--sim);stroke:var(--sim)}
.mark-est{fill:var(--bg);stroke:var(--est);stroke-width:1.6}
.mark-reject{fill:var(--reject);stroke:var(--reject)}
.ghost{opacity:.35}
.hatch-line{stroke:var(--traj);stroke-width:2}.hatch-line-bg{fill:none}
.hatch-sim{stroke:var(--sim);stroke-width:2}.hatch-sim-bg{fill:var(--sim);fill-opacity:.1}
.hatch-red{stroke:var(--reject);stroke-width:1.8}.hatch-red-bg{fill:var(--reject);fill-opacity:.12}
.pattern-dot{fill:var(--traj)}
.arr-fg{fill:var(--fg)}.arr-sim{fill:var(--sim)}.arr-est{fill:var(--est)}.arr-muted{fill:var(--muted)}
.arr-reject{fill:var(--reject)}.arr-stop{fill:var(--stop)}

</style>
</head>
<body>
<div id="controls"></div>
<div id="status" aria-live="polite"></div>
<svg id="view" viewBox="0 0 720 470" role="img" aria-label="Hisztogramok és mintapályák: egy háromcsúcsú eloszlás zajosítása standard normálissá, majd visszaalakítása a score-függvénnyel"></svg>
<p class="note">Fekete: a pontos p_t sűrűség; kék: 4000 minta hisztogramja; fent 60 mintapálya (rögzített időpontok között egyenes szakaszokkal).</p>
<script>
// Hibát látható módon jelezzük (a statikus PNG a lap alatt lenyitható tartalék marad).
window.addEventListener("error", e => { const s = document.getElementById("status");
  if (s) { s.textContent = "Hiba az interaktív ábrában: " + e.message + " (sor " + e.lineno + ")"; s.className = "error"; } });
</script>
<script>
/* kf.js – lineáris algebra, 2D Gauss-segédek és magolt véletlenszám az interaktív lapokhoz
   (külső függőség nélkül). Eloszlások, mintavevők, statisztika: prob.js.
   Mátrix: tömbök tömbje (sorok), vektor: sima tömb. */
"use strict";
const KF = (() => {
  // ---------- mátrixok ----------
  const zeros = (r, c) => Array.from({length: r}, () => new Array(c).fill(0));
  const eye = n => { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; };
  const T = A => A[0].map((_, j) => A.map(row => row[j]));
  const mul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const mv = (A, x) => A.map(row => row.reduce((s, a, k) => s + a * x[k], 0));
  const add = (A, B) => A.map((row, i) => row.map((a, j) => a + B[i][j]));
  const sub = (A, B) => A.map((row, i) => row.map((a, j) => a - B[i][j]));
  const scale = (A, s) => A.map(row => row.map(a => a * s));
  const vadd = (a, b) => a.map((v, i) => v + b[i]);
  const vsub = (a, b) => a.map((v, i) => v - b[i]);
  const vscale = (a, s) => a.map(v => v * s);
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sym = P => P.map((row, i) => row.map((a, j) => 0.5 * (a + P[j][i])));
  const diag = d => { const D = zeros(d.length, d.length); d.forEach((v, i) => D[i][i] = v); return D; };
  const kron = (A, B) => {
    const r = A.length * B.length, c = A[0].length * B[0].length, K = zeros(r, c);
    A.forEach((ra, i) => ra.forEach((a, j) => B.forEach((rb, k) => rb.forEach((b, l) => {
      K[i * B.length + k][j * B[0].length + l] = a * b; }))));
    return K;
  };
  const clone = A => A.map(r => r.slice());
  const select = (A, rows, cols) => rows.map(i => cols.map(j => A[i][j]));
  /* A X = B megoldása Gauss-eliminációval, részleges főelemkiválasztással („solve, ne inv”).
     B lehet vektor vagy mátrix. */
  function solve(A, B) {
    const n = A.length, vec = !Array.isArray(B[0]);
    const M = A.map((row, i) => row.concat(vec ? [B[i]] : B[i]));
    const w = M[0].length;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("szinguláris mátrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k < w; k++) M[r][k] -= f * M[c][k];
      }
    }
    const X = zeros(n, w - n);
    for (let r = n - 1; r >= 0; r--) for (let k = 0; k < w - n; k++) {
      let s = M[r][n + k];
      for (let j = r + 1; j < n; j++) s -= M[r][j] * X[j][k];
      X[r][k] = s / M[r][r];
    }
    return vec ? X.map(r => r[0]) : X;
  }
  const inv = A => solve(A, eye(A.length));
  function chol(P) {          // P = L Lᵀ, L alsó háromszög 
    const n = P.length, L = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = P[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) throw new Error("nem pozitív definit"); L[i][i] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
    return L;
  }
  function eig2(P) {          // szimmetrikus 2×2: sajátértékek (nagy, kicsi) és a nagyobbik iránya
    const a = P[0][0], b = 0.5 * (P[0][1] + P[1][0]), d = P[1][1];
    const tr = a + d, disc = Math.sqrt(Math.max(0, 0.25 * (a - d) * (a - d) + b * b));
    return {l1: 0.5 * tr + disc, l2: 0.5 * tr - disc, angle: 0.5 * Math.atan2(2 * b, a - d)};
  }
  const mat = {zeros, eye, T, mul, mv, add, sub, scale, vadd, vsub, vscale, dot, sym, diag, kron,
               clone, select, solve, inv, chol, eig2};

  // ---------- 2D Gauss ----------
  const TAU = 2 * Math.PI;
  const gauss = {
    coverage2d: k => 1 - Math.exp(-0.5 * k * k),
    kForCoverage2d: p => Math.sqrt(-2 * Math.log(1 - p)),
    mahalanobis2: (x, m, P) => { const d = vsub(x, m); return dot(d, solve(P, d)); },
    block: (P, i0 = 0, n = 2) => select(P, [...Array(n).keys()].map(i => i + i0), [...Array(n).keys()].map(i => i + i0)),
    /* k-szigma ellipszis; szinguláris vagy szemidefinit P2-re (pl. vetítés) a sajátfelbontásból
       rajzol (szakasz lesz belőle), indefinit P2-re üres tömb. */
    ellipse(m, P2, k = 2, n = 72) {
      let L;
      try { L = chol(add(P2, scale(eye(2), 1e-12))); }
      catch (e) {
        const E = eig2(P2); if (E.l2 < -1e-9 * Math.max(1, Math.abs(E.l1))) return [];
        const a = Math.sqrt(Math.max(E.l1, 0)), b = Math.sqrt(Math.max(E.l2, 0)), c = Math.cos(E.angle), s = Math.sin(E.angle), pts = [];
        for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), u = a * Math.cos(t), v = b * Math.sin(t);
          pts.push([m[0] + k * (c * u - s * v), m[1] + k * (s * u + c * v)]); }
        return pts;
      }
      const pts = [];
      for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), c = Math.cos(t), s = Math.sin(t);
        pts.push([m[0] + k * (L[0][0] * c), m[1] + k * (L[1][0] * c + L[1][1] * s)]); }
      return pts;
    },
  };

  // ---------- véletlen: determinisztikus, magolt (mulberry32 + Box–Muller) ----------
  function rng(seed = 1) {
    let a = seed >>> 0, spare = null;
    const uniform = (lo = 0, hi = 1) => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return lo + (hi - lo) * (((t ^ (t >>> 14)) >>> 0) / 4294967296); };
    const normal = () => { if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = uniform(); const v = uniform(), r = Math.sqrt(-2 * Math.log(u));
      spare = r * Math.sin(TAU * v); return r * Math.cos(TAU * v); };
    return {uniform, normal};                 // további eloszlások: Prob.*(…).sample(r, n)
  }

  return {mat, gauss, rng};
})();
if (typeof module !== "undefined") module.exports = KF;

/* prob.js – valószínűségszámítási mag az interaktív lapokhoz (a code/probkit/dists.py tükre).
   Ugyanazok a képletek és paraméterezések: Normal(mu, VARIANCIA), Exponential(RÁTA),
   Gamma(alak, RÁTA), Geometric {1,2,…}, NegBinomial = kudarcok száma. A paritást a
   figures/web/test/test_parity.py ellenőrzi. Véletlenszám: KF.rng(seed) objektum (kf.js). */
"use strict";
const Prob = (() => {
  // ---------------------------------------------------------------- speciális függvények
  const LG = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  const LF = [0];                                      // ln n! gyorstár (pontos összegzés kis n-re)
  function lgamma(x) {
    if (x <= 0 && x === Math.floor(x)) return Infinity;
    if (x === Math.floor(x) && x <= 256) { for (let n = LF.length; n < x; n++) LF[n] = LF[n - 1] + Math.log(n); return LF[x - 1]; }
    if (x < 0.5) return Math.log(Math.PI / Math.abs(Math.sin(Math.PI * x))) - lgamma(1 - x);
    if (x > 12) {                                      // Stirling-sor (relatív hiba < 1e-15)
      const i = 1 / x, i2 = i * i;
      return (x - 0.5) * Math.log(x) - x + 0.5 * Math.log(2 * Math.PI)
        + i * (1 / 12 - i2 * (1 / 360 - i2 * (1 / 1260 - i2 * (1 / 1680 - i2 * (1 / 1188 - i2 * 691 / 360360)))));
    }
    const z = x - 1; let s = LG[0];
    for (let i = 1; i < 9; i++) s += LG[i] / (z + i);
    const t = z + 7.5;
    return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(s);
  }
  const logFactorial = n => lgamma(n + 1);
  const logComb = (n, k) => (k < 0 || k > n) ? -Infinity : lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1);
  const comb = (n, k) => (k < 0 || k > n) ? 0 : Math.round(Math.exp(logComb(n, k)));
  const logsumexp = a => { let m = -Infinity; for (const v of a) if (v > m) m = v;
    if (!Number.isFinite(m)) return m; let s = 0; for (const v of a) s += Math.exp(v - m); return m + Math.log(s); };

  /* P(a, x): regularizált alsó nem teljes gamma (sor, illetve lánctört); upper: Q = 1 − P. */
  function gammaPQ(a, x, upper) {
    if (x <= 0) return upper ? 1 : 0;
    if (x === Infinity) return upper ? 0 : 1;
    const logPref = a * Math.log(x) - x - lgamma(a);
    if (x < a + 1) {
      let term = 1 / a, total = term, ap = a;
      for (let i = 0; i < 10000; i++) { ap += 1; term *= x / ap; total += term; if (Math.abs(term) < Math.abs(total) * 1e-16) break; }
      const P = Math.min(1, total * Math.exp(logPref));
      return upper ? 1 - P : P;
    }
    const tiny = 1e-300; let b = x + 1 - a, c = 1 / tiny, d = 1 / b, h = d;
    for (let i = 1; i < 10000; i++) {
      const an = -i * (i - a); b += 2;
      d = an * d + b; if (Math.abs(d) < tiny) d = tiny;
      c = b + an / c; if (Math.abs(c) < tiny) c = tiny;
      d = 1 / d; const delta = d * c; h *= delta;
      if (Math.abs(delta - 1) < 4e-16) break;
    }
    const Q = Math.exp(logPref) * h;
    return upper ? Q : Math.max(0, 1 - Q);
  }
  const gammaincLower = (a, x) => gammaPQ(a, x, false);
  const gammaincUpper = (a, x) => gammaPQ(a, x, true);
  const erfc = x => x >= 0 ? gammaPQ(0.5, x * x, true) : 1 + gammaPQ(0.5, x * x, false);
  const erf = x => x >= 0 ? gammaPQ(0.5, x * x, false) : -gammaPQ(0.5, x * x, false);

  function betacf(a, b, x) {
    const tiny = 1e-300, qab = a + b, qap = a + 1, qam = a - 1;
    let c = 1, d = 1 - qab * x / qap; if (Math.abs(d) < tiny) d = tiny; d = 1 / d; let h = d;
    for (let m = 1; m < 10000; m++) {
      const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
      d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny; c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny; d = 1 / d; h *= d * c;
      aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
      d = 1 + aa * d; if (Math.abs(d) < tiny) d = tiny; c = 1 + aa / c; if (Math.abs(c) < tiny) c = tiny; d = 1 / d;
      const delta = d * c; h *= delta;
      if (Math.abs(delta - 1) < 4e-16) break;
    }
    return h;
  }
  function betainc(a, b, x) {                          // I_x(a, b)
    if (x <= 0) return 0; if (x >= 1) return 1;
    const lf = lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log1p(-x);
    return x < (a + 1) / (a + b + 2) ? Math.exp(lf) * betacf(a, b, x) / a : 1 - Math.exp(lf) * betacf(b, a, 1 - x) / b;
  }

  // ---------------------------------------------------------------- standard normális
  const SQ2 = Math.SQRT2, S2PI = Math.sqrt(2 * Math.PI);
  const phi = x => Math.exp(-0.5 * x * x) / S2PI;
  const Phi = x => 0.5 * erfc(-x / SQ2);
  const A = [-3.969683028665376e01, 2.209460984245205e02, -2.759285104469687e02, 1.383577518672690e02, -3.066479806614716e01, 2.506628277459239e00];
  const B = [-5.447609879822406e01, 1.615858368580409e02, -1.556989798598866e02, 6.680131188771972e01, -1.328068155288572e01];
  const C = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e00, -2.549732539343734e00, 4.374664141464968e00, 2.938163982698783e00];
  const D = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e00, 3.754408661907416e00];
  function PhiInv(q) {                                  // Acklam + két Halley-lépés

  if (p.seed === DATA.seed && p.n === DATA.steps && p.mode === "sde") return DATA.state;
  const r = KF.rng(p.seed);
  // előre: pontos lépések az időpontok között
  let x = Array.from({length: M}, () => { const k = Prob.categorical(r, mix.weights); return mix.means[k] + Math.sqrt(mix.variances[k]) * r.normal(); });
  const fh = [bins(x)], fp = [x.slice(0, SHOW)], fs = [stats(x)];
  for (let i = 1; i < NT; i++) { const a2 = Math.exp(-(TIMES[i] - TIMES[i - 1]));
    x = x.map(v => Math.sqrt(a2) * v + Math.sqrt(1 - a2) * r.normal());
    fh.push(bins(x)); fp.push(x.slice(0, SHOW)); fs.push(stats(x)); }
  // vissza: Euler-lépések t = T-től 0-ig
  const n = p.n, h = T / n, z = Array.from({length: M}, () => r.normal());
  const rh = new Array(NT), rp = new Array(NT), rs = new Array(NT);
  const want = TIMES.map(t => Math.round((T - t) / h));
  for (let step = 0; step <= n; step++) {
    want.forEach((w, i) => { if (w === step) { rh[i] = bins(z); rp[i] = z.slice(0, SHOW); rs[i] = stats(z); } });
    if (step === n) break;
    const t = T - step * h, P = parts(t);
    for (let j = 0; j < M; j++) {
      const s = p.mode === "noscore" ? -z[j] : score(z[j], P);
      const w = p.mode === "ode" ? 0.5 : 1;
      z[j] += h * (0.5 * z[j] + w * s) + (p.mode === "ode" ? 0 : Math.sqrt(h) * r.normal());
    }
  }
  return {fh, fp, fs, rh, rp, rs, w1: w1(z)};
}
UI.app({
  frames: 2 * NT, fps: 3, seed: DATA.seed,
  selects: [{id: "mode", label: "visszafelé", options: [["sde", "SDE (zajjal), pontos score"], ["ode", "ODE (zaj nélkül), pontos score"], ["noscore", "rossz score: s(x) = −x"]], value: "sde"}],
  params: [{id: "n", label: "visszafelé lépések száma", min: 5, max: 500, step: 5, value: DATA.steps, log: true}],
  build,
  render(s, f, p) {
    const back = f >= NT, i = back ? 2 * NT - 1 - f : f, t = TIMES[i];
    const H = back ? s.rh : s.fh, X = back ? s.rp : s.fp, S = back ? s.rs : s.fs;
    const range = back ? Array.from({length: NT - i}, (_, k) => NT - 1 - k) : Array.from({length: i + 1}, (_, k) => k);
    PA.clear();
    for (let j = 0; j < SHOW; j++) PA.line(range.map(k => [TIMES[k], X[k][j]]), j ? "traj" : "traj-hl");
    PA.vline(t, "guide");
    PA.text([back ? 0.4 : T - 0.4, 4.2], back ? "← vissza: generálás" : "előre: zajosítás →", "label halo", {"text-anchor": back ? "start" : "end"});
    const dens = H[i].map(c => c / (M * 0.125)), P = parts(t);
    const ymax = Math.max(0.75, Math.ceil(10 * Math.max(...dens) * 1.1) / 10);
    HI.setLimits(null, [0, ymax]).clear();
    HI.hist(Prob.stats.linspace(-5, 5, 81), dens, "sim");
    HI.curve(x => pdf(x, P), "theory", 400);
    HI.legend([["sim", back ? "generált minták" : "zajosított adat", "area"], ["theory", "pontos p_t"]], "tr");
    const mean = P.reduce((a, c) => a + c.w * c.m, 0), vr = P.reduce((a, c) => a + c.w * (c.v + c.m * c.m), 0) - mean * mean;
    let out = `${back ? "Visszafelé" : "Előre"}, t = ${Draw.fmt(t, 2)}: átlag ${Draw.fmt(S[i][0], 3)} (elmélet ${Draw.fmt(mean, 3)}), `
      + `variancia ${Draw.fmt(S[i][1], 3)} (elmélet ${Draw.fmt(vr, 3)}).`;
    if (back && i === 0) out += ` W1-távolság az adateloszlástól: ${Draw.fmt(s.w1, 3)}.`;
    return out;
  },
});

})();
</script>

  v.querySelectorAll("*").forEach(e => { for (const at of e.attributes) if (/NaN|Infinity|undefined/.test(at.value) && !/^(class|id)$/.test(at.name)) out.push(`HIBA rossz attribútum: <${e.tagName} ${at.name}="${at.value.slice(0, 40)}">`); });
  const T = [...v.querySelectorAll("text")].filter(e => e.textContent.trim()).map(e => ({s: e.textContent.slice(0, 30), r: e.getBoundingClientRect(), f: parseFloat(getComputedStyle(e).fontSize) * scale}));
  T.forEach((a, i) => {
    if (/NaN|undefined/.test(a.s)) out.push(`HIBA rossz felirat: „${a.s}”`);
    if (a.r.left < vr.left - 1.5 || a.r.right > vr.right + 1.5 || a.r.top < vr.top - 2.5 || a.r.bottom > vr.bottom + 2.5) out.push(`kilóg a rajzból: „${a.s}”`);
    if (a.f < 9) out.push(`apró betű (${a.f.toFixed(1)} px): „${a.s}”`);
    T.slice(i + 1).forEach(b => { const w = Math.min(a.r.right, b.r.right) - Math.max(a.r.left, b.r.left), h = Math.min(a.r.bottom, b.r.bottom) - Math.max(a.r.top, b.r.top);
      if (w > 1.5 && h > 0.25 * Math.min(a.r.height, b.r.height)) out.push(`átfedő feliratok: „${a.s}” / „${b.s}”`); });
  });
  if (/NaN|undefined/.test(document.getElementById("status").textContent)) out.push("HIBA: NaN/undefined az állapotsorban");

  document.body.setAttribute("data-lint", JSON.stringify([...new Set(out)].slice(0, 25)));
  document.body.setAttribute("data-height", Math.ceil(document.body.getBoundingClientRect().height));
}
