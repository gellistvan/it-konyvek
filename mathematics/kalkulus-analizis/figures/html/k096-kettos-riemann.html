<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A kettős Riemann-összeg finomítása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020;--lev:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a;--lev:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.box{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.box span{display:block;padding:0 4px}
pre.box span.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Felosztás">
  <label for="n">n =</label><input id="n" type="range" min="2" max="32" step="1" value="4" aria-label="Felosztás finomsága"><b id="nv" style="min-width:2em"></b>
  <label for="mode">közbülső pont:</label>
  <select id="mode"><option value="ur" selected>jobb felső sarok</option><option value="ll">bal alsó sarok</option><option value="mid">középpont</option></select>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Hőtérkép a cellák függvényértékeivel és egy görbe, amely a felosztás finomításával 32/3-hoz közelít"></svg>

<p class="small">A [0; 2]² négyzet n × n egyenlő cellára osztva, ΔA = (2/n)²; a 3D-s hasábok magasságát a cella szürkesége (és n ≤ 8 esetén a beírt érték) mutatja, a pont a választott közbülső pont. A pontos érték 32/3 ≈ 10,667. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function nf(x, d){ let s = fmt(x, d === undefined ? 4 : d); if (s.indexOf(",") >= 0) s = s.replace(/0+$/, "").replace(/,$/, ""); return s; }
const $ = id => document.getElementById(id);


const EX = 32 / 3, SER = {"ur": [20.0, 16.592592592592588, 15.0, 14.080000000000002, 13.48148148148148, 13.061224489795917, 12.75, 12.51028806584362, 12.320000000000002, 12.165289256198347, 12.037037037037035, 11.928994082840239, 11.83673469387755, 11.757037037037037, 11.6875, 11.626297577854672, 11.572016460905349, 11.52354570637119, 11.480000000000002, 11.440665154950867, 11.40495867768595, 11.372400756143664, 11.34259259259259, 11.3152, 11.28994082840237, 11.266575217192498, 11.244897959183673, 11.224732461355527, 11.205925925925927, 11.188345473465139, 11.171875], "ll": [4.0, 5.925925925925926, 7.0, 7.680000000000004, 8.148148148148147, 8.489795918367344, 8.75, 8.954732510288066, 9.120000000000003, 9.256198347107441, 9.370370370370368, 9.467455621301777, 9.551020408163264, 9.623703703703704, 9.6875, 9.7439446366782, 9.79423868312757, 9.839335180055398, 9.880000000000003, 9.916855631141342, 9.950413223140496, 9.98109640831758, 10.009259259259256, 10.0352, 10.05917159763314, 10.081390032007313, 10.10204081632653, 10.12128418549346, 10.13925925925926, 10.156087408949011, 10.171875], "mid": [10.0, 10.370370370370368, 10.5, 10.560000000000004, 10.592592592592593, 10.612244897959181, 10.625, 10.633744855967077, 10.640000000000004, 10.644628099173554, 10.648148148148145, 10.650887573964498, 10.653061224489795, 10.654814814814815, 10.65625, 10.657439446366782, 10.658436213991768, 10.659279778393348, 10.660000000000002, 10.660619803476942, 10.661157024793388, 10.661625708884687, 10.662037037037035, 10.6624, 10.662721893491128, 10.663008687700044, 10.663265306122447, 10.663495838287751, 10.663703703703701, 10.663891779396462, 10.6640625]};
const f = (x, y) => x * x + y * y;
function S(n, mode){ const h = 2 / n; let s = 0; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
  const o = mode === "ur" ? 1 : mode === "ll" ? 0 : 0.5; s += f((i + o) * h, (j + o) * h); } return s * h * h; }
function draw(){
  const n = +$("n").value, mode = $("mode").value, h = 2 / n, o = mode === "ur" ? 1 : mode === "ll" ? 0 : 0.5;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const L = 30, T = 15, Z = 260, cs = Z / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = f((i + o) * h, (j + o) * h), g = Math.round(255 * (1 - 0.7 * v / 8)), gg = dark ? 255 - g + 20 : g;
    el("rect", {x: L + i * cs, y: T + Z - (j + 1) * cs, width: cs, height: cs, fill: `rgb(${gg},${gg},${gg})`, stroke: mu, "stroke-width": n > 16 ? 0.3 : 0.8});
    if (n <= 8) el("text", {x: L + (i + 0.5) * cs, y: T + Z - (j + 0.5) * cs + 4, "text-anchor": "middle", "font-size": n <= 4 ? 13 : 10, fill: (g > 128) !== dark ? "#000" : "#fff"}, nf(v, 3));
    if (n <= 16) el("circle", {cx: L + (i + o) * cs, cy: T + Z - (j + o) * cs, r: n <= 8 ? 2.5 : 1.5, fill: css("--hl2")});
  }
  el("rect", {x: L, y: T, width: Z, height: Z, fill: "none", stroke: fg, "stroke-width": 1.2});
  ["0", "1", "2"].forEach((t, k) => { el("text", {x: L + k * Z / 2, y: T + Z + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, t);
    el("text", {x: L - 5, y: T + Z - k * Z / 2 + 4, "text-anchor": "end", "font-size": 11, fill: mu}, t); });
  el("text", {x: L + Z / 2, y: T + Z + 28, "text-anchor": "middle", "font-size": 12}, "f(x, y) = x² + y² a cellák közbülső pontjaiban");
  // S(n) grafikon
  const L2 = 345, W2 = 200, T2 = 15, H2 = 260, nx = k => L2 + W2 * (k - 2) / 30, sy = v => T2 + H2 - H2 * (v - 3.5) / 17.5;
  el("rect", {x: L2, y: T2, width: W2, height: H2, fill: "none", stroke: mu});
  [5, 10, 15, 20].forEach(v => el("text", {x: L2 - 4, y: sy(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, String(v)));
  [2, 8, 16, 24, 32].forEach(k => el("text", {x: nx(k), y: T2 + H2 + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, String(k)));
  el("line", {x1: L2, y1: sy(EX), x2: L2 + W2, y2: sy(EX), stroke: fg, "stroke-dasharray": "6 4"});
  el("text", {x: L2 + W2 - 2, y: sy(EX) + 15, "text-anchor": "end", "font-size": 11}, "32/3 ≈ 10,667");
  const ser = SER[mode];
  el("polyline", {points: ser.map((v, k) => nx(k + 2).toFixed(1) + "," + sy(v).toFixed(1)).join(" "), fill: "none", stroke: fg, "stroke-width": 1.6});
  el("circle", {cx: nx(n), cy: sy(S(n, mode)), r: 6, fill: css("--hl2"), stroke: fg});
  el("text", {x: L2 + W2 / 2, y: T2 + H2 + 28, "text-anchor": "middle", "font-size": 12}, "S(n), n = 2…32");
  const s = S(n, mode);
  $("nv").textContent = String(n);
  $("status").textContent = "n = " + n + ", ΔA = " + nf(h * h, 6) + ", S = " + nf(s, 6) + ", eltérés a 32/3-tól: " + nf(s - EX, 6);
}
$("n").addEventListener("input", draw);
$("mode").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
