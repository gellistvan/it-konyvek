<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Négyszögjel RC-szűrése: spektrum és jelalak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Szűrő">
  <label for="lt">τ =</label><input id="lt" type="range" min="-1" max="0.69897" step="0.01" value="0" aria-label="Időállandó, logaritmikus skálán 0,1 és 5 ms között"><b id="tv"></b>
</div>
<div class="ctl" role="group" aria-label="Szintézis">
  <label for="kh">harmonikusok száma:</label><input id="kh" type="range" min="1" max="51" step="1" value="25" aria-label="A szintézisben használt páratlan harmonikusok száma"><b id="kv"></b>
  <label><input id="ph" type="checkbox" checked> fázis figyelembevétele</label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Bal oldalon a bemeneti és a szűrt spektrum oszlopai, jobb oldalon a négyszögjel és a lekerekített kimenet egy periódusa"></svg>
<p class="small">Számított, modell: f₀ = 100 Hz, b_n = 4/(πn), H(ω) = 1/(1 + iωτ), a kimenet n-edik tagja b_n·|H(nω₀)|·sin(nω₀t + arg H(nω₀)), arg H = −arctg(nω₀τ). A fázis elhagyása (a Tipikus hibák 2. pontja) torz, nem fizikai jelalakot ad. A halványított oszlopok a szintézisből kihagyott harmonikusok.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const W0 = 2*Math.PI*100;
let TAU = 1e-3, KH = 25;
const absH = n => 1/Math.sqrt(1 + (n*W0*TAU)**2), argH = n => -Math.atan(n*W0*TAU);
function draw(){
  $("tv").textContent = fmt(TAU*1000, TAU < 1e-3 ? 2 : 1) + " ms"; $("kv").textContent = KH + " (n ≤ " + (2*KH-1) + ")";
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), ph = $("ph").checked;
  // bal panel: spektrum
  const L1 = 36, R1 = 250, T = 24, B = 270, Ys = v => B - (B-T)*v/1.45;
  el("text",{x:(L1+R1)/2,y:14,"text-anchor":"middle","font-size":12},"Spektrum (n = 1, 3, …, 15)");
  [0, 0.5, 1].forEach(v => { el("line",{x1:L1,y1:Ys(v),x2:R1,y2:Ys(v),stroke:css("--grid")}); el("text",{x:L1-4,y:Ys(v)+4,"text-anchor":"end","font-size":11,fill:mu},fmt(v,1)); });
  const bw = (R1-L1)/8;
  for (let i = 0; i < 8; i++){ const n = 2*i+1, bi = 4/(Math.PI*n), bo = bi*absH(n), x = L1 + i*bw;
    el("rect",{x:x+2,y:Ys(bi),width:bw/2-3,height:B-Ys(bi),fill:css("--bg"),stroke:fg});
    el("rect",{x:x+bw/2,y:Ys(bo),width:bw/2-3,height:B-Ys(bo),fill:css("--hl2"),stroke:fg,opacity:(n <= 2*KH-1) ? 1 : 0.25});
    el("text",{x:x+bw/2,y:B+15,"text-anchor":"middle","font-size":11,fill:mu},String(n));
    if (n <= 5) el("text",{x:x+bw*0.75+4,y:Ys(bo)-5,"text-anchor":"start","font-size":10,stroke:css("--bg"),"stroke-width":3,"paint-order":"stroke"},fmt(bo,3)); }
  el("text",{x:R1,y:B+30,"text-anchor":"end","font-size":11,fill:mu},"n");
  el("rect",{x:L1+110,y:T+4,width:10,height:10,fill:css("--bg"),stroke:fg}); el("text",{x:L1+124,y:T+13,"font-size":11},"bemenet");
  el("rect",{x:L1+110,y:T+20,width:10,height:10,fill:css("--hl2"),stroke:fg}); el("text",{x:L1+124,y:T+29,"font-size":11},"kimenet");
  // jobb panel: jelalak
  const L2 = 290, R2 = 538, X = t => L2 + (R2-L2)*t/0.01, Y = v => (T+B)/2 - (B-T)/2*v/1.45;
  el("text",{x:(L2+R2)/2,y:14,"text-anchor":"middle","font-size":12},"Egy periódus (0–10 ms)");
  [-1, 0, 1].forEach(v => { el("line",{x1:L2,y1:Y(v),x2:R2,y2:Y(v),stroke:css("--grid")}); el("text",{x:L2-4,y:Y(v)+4,"text-anchor":"end","font-size":11,fill:mu},fmt(v,0)); });
  [0, 2.5, 5, 7.5, 10].forEach(v => el("text",{x:X(v/1000),y:B+15,"text-anchor":"middle","font-size":11,fill:mu},fmt(v,1)));
  el("text",{x:R2,y:B+30,"text-anchor":"end","font-size":11,fill:mu},"t (ms)");
  el("polyline",{points:[X(0),Y(1),X(0.005),Y(1),X(0.005),Y(-1),X(0.01),Y(-1)].join(" "),fill:"none",stroke:fg,"stroke-width":1});
  const p = []; let ymax = -9;
  for (let i = 0; i <= 600; i++){ const t = 0.01*i/600; let y = 0;
    for (let n = 1; n <= 2*KH-1; n += 2) y += 4/(Math.PI*n)*absH(n)*Math.sin(n*W0*t + (ph ? argH(n) : 0));
    ymax = Math.max(ymax, y); p.push(X(t).toFixed(1)+","+Y(Math.max(-1.6,Math.min(1.6,y))).toFixed(1)); }
  el("polyline",{points:p.join(" "),fill:"none",stroke:css("--hl2"),"stroke-width":2.6,"stroke-dasharray":"8 4"});
  el("text",{x:R2,y:T+8,"text-anchor":"end","font-size":11},"— bemenet   – – kimenet" + (ph ? "" : " (fázis nélkül!)"));
  $("status").textContent = "τ = " + fmt(TAU*1000, 2) + " ms, f_c = " + fmt(1/(2*Math.PI*TAU), 0) + " Hz, |H(ω₁)| = " + fmt(absH(1),3) +
    ", |H(ω₃)| = " + fmt(absH(3),3) + ", |H(ω₅)| = " + fmt(absH(5),3) + "; a kimenet maximuma ≈ " + fmt(ymax,3) + (ph ? "" : " – fázis nélkül a jelalak hibás");
}
$("lt").addEventListener("input", () => { TAU = Math.pow(10, +$("lt").value) * 1e-3; draw(); });
$("kh").addEventListener("input", () => { KH = +$("kh").value; draw(); });
$("ph").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
