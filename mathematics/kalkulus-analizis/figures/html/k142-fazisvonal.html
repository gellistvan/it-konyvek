<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fázisvonal és halászati bifurkáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Halászati kvóta">
  <label for="h">h (tonna/év) =</label><input id="h" type="range" min="0" max="45" step="0.5" value="30"><b id="hv"></b>
  <button id="reset">Kezdőértékek visszaállítása</button>
</div>
<div class="small">A (c) panelre kattintva új kezdőérték (y₀) adható.</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 365" role="img" aria-label="A halászati modell jobb oldala, a fázisvonal és a megoldásgörbék; a kvóta csúszkával állítható"></svg>
<p class="small">RK4-gyel számított görbék (dt = 0,05 év), nem mérés. ● stabil, ○ instabil, félig kitöltött: félig stabil egyensúly; × kihalás. r = 0,3 1/év, K = 500 tonna, h_c = rK/4 = 37,5 tonna/év. Kezdőállapot: h = 30 (a statikus ábra alsó sora).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

// panel: {x0,y0,w,h} pixeles doboz; xr/yr: [min,max]; visszaad: {X, Y, g}
function panel(b, xr, yr, xt, yt, xl, yl, opt){
  opt = opt || {};
  const X = x => b.x0 + b.w * (x - xr[0]) / (xr[1] - xr[0]);
  const Y = opt.logy ? (y => b.y0 + b.h - b.h * (Math.log10(Math.max(y, 1e-300)) - Math.log10(yr[0])) / (Math.log10(yr[1]) - Math.log10(yr[0])))
                     : (y => b.y0 + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]));
  const mu = css("--muted"), gr = css("--grid");
  (xt || []).forEach(t => { el("line", {x1: X(t), y1: b.y0, x2: X(t), y2: b.y0 + b.h, stroke: gr});
    el("text", {x: X(t), y: b.y0 + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, opt.xf ? opt.xf(t) : fmtn(t)); });
  (yt || []).forEach(t => { el("line", {x1: b.x0, y1: Y(t), x2: b.x0 + b.w, y2: Y(t), stroke: gr});
    el("text", {x: b.x0 - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, opt.yf ? opt.yf(t) : fmtn(t)); });
  el("rect", {x: b.x0, y: b.y0, width: b.w, height: b.h, fill: "none", stroke: mu});
  if (!opt.logy && yr[0] < 0 && yr[1] > 0) el("line", {x1: b.x0, y1: Y(0), x2: b.x0 + b.w, y2: Y(0), stroke: css("--fg"), "stroke-width": 0.8});
  if (xr[0] < 0 && xr[1] > 0) el("line", {x1: X(0), y1: b.y0, x2: X(0), y2: b.y0 + b.h, stroke: css("--fg"), "stroke-width": 0.8});
  if (xl) el("text", {x: b.x0 + b.w, y: b.y0 + b.h + 28, "text-anchor": "end", "font-size": 12}, xl);
  if (yl) el("text", {x: b.x0 + 4, y: b.y0 - 6, "text-anchor": "start", "font-size": 12}, yl);
  return {X, Y, b};
}
function fmtn(v){ let s = (+v.toPrecision(6)).toString(); return s.replace(".", ",").replace("-", "−"); }
// görbe: pts = [[x,y],...] adatkoordinátában; a panel dobozára vágva (szakaszokra bontva)
function curve(P, pts, at){
  const b = P.b, segs = []; let cur = [];
  pts.forEach(([x, y]) => { const px = P.X(x), py = P.Y(y);
    if (isFinite(py) && py >= b.y0 - 1 && py <= b.y0 + b.h + 1 && px >= b.x0 - 1 && px <= b.x0 + b.w + 1) cur.push(px.toFixed(1) + "," + py.toFixed(1));
    else { if (cur.length > 1) segs.push(cur); cur = []; } });
  if (cur.length > 1) segs.push(cur);
  segs.forEach(s => el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)));
}
function sample(f, a, b, n){ const r = []; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; r.push([x, f(x)]); } return r; }

const R = 0.3, K = 500, HC = 37.5;
let Y0 = [50, 150, 250, 400, 550];
const f = (y, h) => R * y * (1 - y / K) - h;
function eqs(h){ const d = 1 - h / HC; if (d < -1e-12) return []; if (Math.abs(d) < 1e-12) return [K / 2]; return [K / 2 * (1 - Math.sqrt(d)), K / 2 * (1 + Math.sqrt(d))]; }
function kind(e){ const d = R - 2 * R * e / K; return d < -1e-9 ? "stabil" : (d > 1e-9 ? "instabil" : "félig stabil"); }
function path(y0, h){ const dt = 0.05, pts = [[0, y0]]; let y = y0;
  for (let i = 1; i <= 800; i++){ const k1 = f(y, h), k2 = f(y + dt / 2 * k1, h), k3 = f(y + dt / 2 * k2, h), k4 = f(y + dt * k3, h);
    const yn = y + dt / 6 * (k1 + 2 * k2 + 2 * k3 + k4);
    if (yn <= 0){ pts.push([(i - 1) * dt + dt * y / (y - yn), 0]); pts.ext = true; break; }
    y = yn; pts.push([i * dt, y]); }
  return pts; }
function marker(x, y, k){
  const fg = css("--fg"), bg = css("--bg");
  if (k === "stabil") el("circle", {cx: x, cy: y, r: 6, fill: fg});
  else if (k === "instabil") el("circle", {cx: x, cy: y, r: 6, fill: bg, stroke: fg, "stroke-width": 2});
  else { el("circle", {cx: x, cy: y, r: 6, fill: bg, stroke: fg, "stroke-width": 2}); el("path", {d: `M${x - 6},${y} A6,6 0 0 0 ${x + 6},${y} Z`, fill: fg}); }
}
let PC = null;
function draw(){
  const h = +$("h").value; $("hv").textContent = fmtn(h);
  svg.innerHTML = "";
  const E = eqs(h), fg = css("--fg");
  // (a)
  const A = panel({x0: 50, y0: 24, w: 230, h: 300}, [-50, 550], [-90, 50], [0, 250, 500], [-80, -40, 0, 40], "y", "");
  curve(A, sample(y => f(y, h), -50, 550, 300), {stroke: fg, "stroke-width": 2.2});
  E.forEach(e => marker(A.X(e), A.Y(0), kind(e)));
  el("text", {x: 52, y: 16, "font-size": 12}, "(a) f(y) = 0,3y(1 − y/500) − h");
  // (b) fázisvonal
  const yb = y => 24 + 300 - 300 * (y + 50) / 610, xb = 330;
  el("line", {x1: xb, y1: yb(-50), x2: xb, y2: yb(560), stroke: fg, "stroke-width": 1.5});
  el("text", {x: xb, y: 16, "text-anchor": "middle", "font-size": 12}, "(b)");
  for (let yy = 25; yy < 560; yy += 50){ if (E.some(e => Math.abs(yy - e) < 18)) continue;
    const s = Math.sign(f(yy, h)); if (!s) continue; const y1 = yb(yy - 16 * s), y2 = yb(yy + 16 * s);
    el("line", {x1: xb, y1: y1, x2: xb, y2: y2, stroke: css("--hl"), "stroke-width": 2.5});
    el("path", {d: `M${xb - 6},${y2 + 8 * s} L${xb},${y2} L${xb + 6},${y2 + 8 * s} Z`, fill: css("--hl")}); }
  E.forEach(e => { marker(xb, yb(e), kind(e)); el("text", {x: xb + 9, y: yb(e) - 8, "font-size": 11}, fmt(e, 1)); });
  // (c)
  PC = panel({x0: 400, y0: 24, w: 150, h: 300}, [0, 40], [-50, 560], [0, 20, 40], [0, 100, 200, 300, 400, 500], "t (év)", "");
  el("text", {x: 402, y: 16, "font-size": 12}, "(c) y(t)");
  E.forEach(e => curve(PC, [[0, e], [40, e]], {stroke: css("--muted"), "stroke-dasharray": "2 3"}));
  let ext = 0;
  Y0.forEach((y0, i) => { const p = path(y0, h); if (p.ext) ext++;
    curve(PC, p, {stroke: i >= 5 ? css("--hl2") : fg, "stroke-width": 1.6});
    if (p.ext) { const q = p[p.length - 1]; if (q[0] <= 40) el("text", {x: PC.X(q[0]), y: PC.Y(0) + 4, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "×"); } });
  let msg = "h = " + fmtn(h) + " tonna/év; ";
  if (E.length === 2) msg += "egyensúlyok: " + fmt(E[0], 1) + " (" + kind(E[0]) + "), " + fmt(E[1], 1) + " (" + kind(E[1]) + ")";
  else if (E.length === 1) msg += "egyetlen egyensúly: " + fmt(E[0], 1) + " (" + kind(E[0]) + ") – h = h_c, a két egyensúly összeolvadt";
  else msg += "h > h_c = 37,5: nincs egyensúly – kihalás minden kezdőértékből";
  msg += ". Kihalás (×) 40 éven belül: " + ext + " / " + Y0.length + " görbe.";
  $("status").textContent = msg;
}
$("h").addEventListener("input", draw);
$("reset").addEventListener("click", () => { Y0 = [50, 150, 250, 400, 550]; draw(); });
svg.addEventListener("click", ev => {
  if (!PC) return; const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  if (q.x < PC.b.x0 || q.x > PC.b.x0 + PC.b.w || q.y < PC.b.y0 || q.y > PC.b.y0 + PC.b.h) return;
  const y0 = -50 + 610 * (PC.b.y0 + PC.b.h - q.y) / PC.b.h; if (y0 <= 0) return;
  Y0.push(Math.round(y0)); if (Y0.length > 12) Y0.splice(5, 1); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
