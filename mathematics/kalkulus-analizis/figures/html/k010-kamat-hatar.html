<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folytonos kamatozás: (1 + r/m)^m → e^r</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="r">r =</label><input id="r" type="range" min="1" max="20" step="0.5" value="5" aria-label="éves kamatláb százalékban"><b id="rv"></b>
</div>
<div class="ctl" role="group" aria-label="Jóváírások száma">
  <label for="m">m =</label><input id="m" type="range" min="0" max="4" step="0.01" value="1.0792" aria-label="m, logaritmikus csúszka 1 és 10 000 között"><b id="mv"></b>
</div>
<div class="ctl" role="group" aria-label="A táblázat pontjai">
  <button id="prev">◀</button><button id="play">▶ Táblázat pontjai</button><button id="next">▶</button>
  <span class="small" id="cnt"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Az éves szorzó a kamatjóváírások számának függvényében logaritmikus skálán, a táblázat pontjai és a szaggatott e^r határvonal"></svg>
<p class="small">Számított értékek, nem mérés. A szürke görbe az (1 + r/x)^x kifejezés folytonos x-re kiterjesztve; a fekete pontok a 3.3.2 táblázatának m = 1, 2, 12, 365, 8760 értékei. A narancs szakasz az e^r-től való eltérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const MS = [1, 2, 12, 365, 8760], LAB = {"1": "évente", "2": "félévente", "12": "havonta", "365": "naponta", "8760": "óránként"};
let r = 0.05, m = 12, ti = 2, timer = null;
const mult = (r, m) => Math.pow(1 + r / m, m);
function sci(x){ if (x === 0) return "0"; const e = Math.floor(Math.log10(Math.abs(x))); const c = x / Math.pow(10, e);
  const sup = String(e).replace("-", "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+d]); return fmt(c, 2) + "·10" + sup; }
function draw(){
  $("rv").textContent = fmt(r * 100, 1).replace(",0", "") + "%"; $("mv").textContent = String(m);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const L = 70, Rr = 545, T = 15, B = 290;
  const lo = 1 + r - 0.06 * (Math.exp(r) - 1 - r) - 0.0002 * r, hi = Math.exp(r) + 0.1 * (Math.exp(r) - 1 - r);
  const X = v => L + (Rr - L) * Math.log10(v) / 4.08, Y = v => B - (B - T) * (v - lo) / (hi - lo);
  el("line", {x1: L, y1: B, x2: Rr, y2: B, stroke: fg}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: fg});
  [1, 10, 100, 1000, 10000].forEach(t => { el("line", {x1: X(t), y1: B, x2: X(t), y2: B + 4, stroke: fg}); el("text", {x: X(t), y: B + 17, "text-anchor": "middle", "font-size": 11}, t === 10000 ? "10 000" : String(t)); });
  for (let q = 0; q <= 4; q++) { const v = lo + (hi - lo) * q / 4; el("text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 4)); el("line", {x1: L - 3, y1: Y(v), x2: L, y2: Y(v), stroke: fg}); }
  el("text", {x: (L + Rr) / 2, y: B + 32, "text-anchor": "middle", "font-size": 12, fill: mu}, "m (logaritmikus skála)");
  const pts = []; for (let i = 0; i <= 200; i++) { const v = Math.pow(10, 4 * i / 200); pts.push(X(v).toFixed(1) + "," + Y(mult(r, v)).toFixed(1)); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: mu, "stroke-width": 1.2});
  el("line", {x1: L, y1: Y(Math.exp(r)), x2: Rr, y2: Y(Math.exp(r)), stroke: fg, "stroke-width": 1.6, "stroke-dasharray": "7 5"});
  el("text", {x: Rr, y: Y(Math.exp(r)) - 6, "text-anchor": "end", "font-size": 12}, "határérték (sejtés): e^r ≈ " + fmt(Math.exp(r), 6));
  MS.forEach(v => el("circle", {cx: X(v), cy: Y(mult(r, v)), r: 4.5, fill: fg}));
  el("circle", {cx: X(m), cy: Y(mult(r, m)), r: 8, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  el("line", {x1: X(m), y1: Y(mult(r, m)), x2: X(m), y2: Y(Math.exp(r)), stroke: css("--hl2"), "stroke-width": 1.5});
  const rs = fmt(r, 3).replace(/0+$/, "").replace(/,$/, "");
  $("status").textContent = "m = " + m + (LAB[m] ? " (" + LAB[m] + ")" : "") + ": (1 + " + rs + "/" + m + ")^" + m + " ≈ " + fmt(mult(r, m), 6) +
    "; e^" + rs + " ≈ " + fmt(Math.exp(r), 6) + "; eltérés ≈ " + sci(Math.exp(r) - mult(r, m));
  $("cnt").textContent = ti >= 0 ? "táblázat: " + (ti + 1) + "/6" : "";
}
function setM(v){ m = Math.max(1, Math.min(10000, Math.round(v))); $("m").value = Math.log10(m); }
function showT(i){ ti = Math.max(0, Math.min(5, i)); setM(ti < 5 ? MS[ti] : 10000); draw();
  if (ti === 5) $("status").textContent += " – a szaggatott vonal a sejtett határérték; m → ∞ esetén az eltérés 0-hoz tart."; }
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Táblázat pontjai"; }
$("r").addEventListener("input", () => { r = +$("r").value / 100; draw(); });
$("m").addEventListener("input", () => { stopPlay(); ti = -1; setM(Math.pow(10, +$("m").value)); draw(); });
$("prev").addEventListener("click", () => { stopPlay(); showT((ti < 0 ? 0 : ti) - 1); });
$("next").addEventListener("click", () => { stopPlay(); showT(ti + 1); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  $("play").textContent = "⏸ Szünet"; showT(0);
  timer = setInterval(() => { if (ti >= 5) stopPlay(); else showT(ti + 1); }, 1200);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setM(12); draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
