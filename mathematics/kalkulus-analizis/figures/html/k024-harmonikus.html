<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A harmonikus sor divergenciája csoportosítással</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal: a k-adik blokk összege oszlopként, mindegyik legalább 1/2; jobb: a harmonikus részletösszeg logaritmikus n-tengelyen, a lépcsős 1 + m/2 alsó becslés és a konvergens geometriai sor részletösszege"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított értékek (pontos törtekből). A blokkösszeg 1/2 fölötti része színes; a részletösszeg korlátlan, de lassan nő: S₁₀₂₄ ≈ 7,509. Összehasonlításul a Σ 1/2ᵏ részletösszege 1 alatt marad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "A harmonikus sor: S₁ = 1. Lépésenként a következő blokk (2ᵏ⁻¹ + 1 … 2ᵏ) összegét adjuk hozzá.", "line": 0, "k": 0}, {"msg": "k = 1, tagok: 1/2 (1 db), blokkösszeg = 0,5 ≥ 0,5, S_2 = 1,5 ≥ 1 + 1/2 = 1,5", "line": 1, "k": 1}, {"msg": "k = 2, tagok: 1/3 + … + 1/4 (2 db), blokkösszeg = 0,5833 ≥ 0,5, S_4 = 2,0833 ≥ 1 + 2/2 = 2", "line": 2, "k": 2}, {"msg": "k = 3, tagok: 1/5 + … + 1/8 (4 db), blokkösszeg = 0,6345 ≥ 0,5, S_8 = 2,7179 ≥ 1 + 3/2 = 2,5", "line": 2, "k": 3}, {"msg": "k = 4, tagok: 1/9 + … + 1/16 (8 db), blokkösszeg = 0,6629 ≥ 0,5, S_16 = 3,3807 ≥ 1 + 4/2 = 3", "line": 2, "k": 4}, {"msg": "k = 5, tagok: 1/17 + … + 1/32 (16 db), blokkösszeg = 0,6778 ≥ 0,5, S_32 = 4,0585 ≥ 1 + 5/2 = 3,5", "line": 2, "k": 5}, {"msg": "k = 6, tagok: 1/33 + … + 1/64 (32 db), blokkösszeg = 0,6854 ≥ 0,5, S_64 = 4,7439 ≥ 1 + 6/2 = 4", "line": 2, "k": 6}, {"msg": "k = 7, tagok: 1/65 + … + 1/128 (64 db), blokkösszeg = 0,6893 ≥ 0,5, S_128 = 5,4331 ≥ 1 + 7/2 = 4,5", "line": 2, "k": 7}, {"msg": "k = 8, tagok: 1/129 + … + 1/256 (128 db), blokkösszeg = 0,6912 ≥ 0,5, S_256 = 6,1243 ≥ 1 + 8/2 = 5", "line": 2, "k": 8}, {"msg": "k = 9, tagok: 1/257 + … + 1/512 (256 db), blokkösszeg = 0,6922 ≥ 0,5, S_512 = 6,8165 ≥ 1 + 9/2 = 5,5", "line": 2, "k": 9}, {"msg": "k = 10, tagok: 1/513 + … + 1/1024 (512 db), blokkösszeg = 0,6927 ≥ 0,5, S_1024 = 7,5092 ≥ 1 + 10/2 = 6", "line": 2, "k": 10}];
const CODE = ["S = 1                                   # az első tag", "1. blokk: 1/2 = 1/2", "k-adik blokk: 1/(2^(k-1)+1) + … + 1/2^k ≥ 2^(k-1) · 1/2^k = 1/2;   S_(2^k) ≥ 1 + k/2"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BLK = [0.5, 0.583333, 0.634524, 0.662872, 0.677766, 0.685396, 0.689256, 0.691198, 0.692172, 0.692659], SN = [1.0, 1.5, 2.083333, 2.717857, 3.380729, 4.058495, 4.743891, 5.433147, 6.124345, 6.816517, 7.509176], CUR = [[1, 1.0], [2, 1.5], [3, 1.83333], [4, 2.08333], [5, 2.28333], [6, 2.45], [7, 2.59286], [8, 2.71786], [9, 2.82897], [10, 2.92897], [11, 3.01988], [12, 3.10321], [13, 3.18013], [15, 3.31823], [16, 3.38073], [17, 3.43955], [19, 3.54774], [21, 3.64536], [23, 3.73429], [25, 3.81596], [27, 3.89146], [29, 3.96165], [32, 4.0585], [35, 4.14678], [38, 4.2279], [41, 4.30293], [45, 4.39495], [49, 4.47921], [54, 4.57543], [59, 4.6632], [64, 4.74389], [70, 4.83284], [76, 4.91451], [83, 5.00207], [91, 5.09356], [99, 5.17738], [108, 5.26397], [117, 5.34366], [128, 5.43315], [140, 5.52243], [152, 5.60438], [166, 5.69221], [181, 5.77847], [197, 5.86296], [215, 5.95018], [235, 6.03893], [256, 6.12434], [279, 6.21022], [304, 6.29589], [332, 6.38386], [362, 6.47024], [395, 6.55737], [431, 6.64448], [470, 6.73101], [512, 6.81652], [558, 6.90247], [609, 6.98985], [664, 7.07625], [724, 7.1627], [790, 7.24988], [861, 7.33589], [939, 7.42256], [1024, 7.50918]];
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  // bal: blokkösszegek
  const L = 40, R = 250, T = 20, B = 260, bw = (R - L) / 10, Y = v => B - (B - T) * v / 0.8;
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: fg}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: fg});
  [0, 0.25, 0.5, 0.75].forEach(v => el("text", {x: L - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v).replace(".", ",")));
  el("text", {x: L, y: T - 7, "font-size": 11.5}, "blokkösszegek (k = 1…10)");
  for (let k = 1; k <= 10; k++) {
    const x = L + (k - 1) * bw + 3, on = k === s.k, done = k <= s.k;
    el("rect", {x: x, y: Y(0.5), width: bw - 6, height: B - Y(0.5), fill: done ? css("--cellhl") : "none", stroke: done ? fg : mu, "stroke-dasharray": done ? "" : "3 3"});
    if (done) el("rect", {x: x, y: Y(BLK[k - 1]), width: bw - 6, height: Y(0.5) - Y(BLK[k - 1]), fill: on ? css("--hl2") : css("--hl"), stroke: fg});
    el("text", {x: x + (bw - 6) / 2, y: B + 14, "text-anchor": "middle", "font-size": 11}, String(k));
  }
  el("line", {x1: L, y1: Y(0.5), x2: R, y2: Y(0.5), stroke: fg, "stroke-width": 1.5, "stroke-dasharray": "6 4"});
  el("text", {x: R, y: Y(0.5) + 14, "text-anchor": "end", "font-size": 11}, "1/2: 2ᵏ⁻¹ · 1/2ᵏ");
  el("text", {x: (L + R) / 2, y: B + 28, "text-anchor": "middle", "font-size": 11, fill: mu}, "k (szürke: alsó becslés, színes: többlet)");
  // jobb: részletösszeg
  const L2 = 300, R2 = 550, X2 = n => L2 + (R2 - L2) * Math.log2(n) / 10.1, Y2 = v => B - (B - T) * v / 8.2;
  el("line", {x1: L2, y1: B, x2: R2, y2: B, stroke: fg}); el("line", {x1: L2, y1: T, x2: L2, y2: B, stroke: fg});
  [0, 2, 4, 6, 8].forEach(v => el("text", {x: L2 - 4, y: Y2(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)));
  [1, 4, 16, 64, 256, 1024].forEach(n => el("text", {x: X2(n), y: B + 14, "text-anchor": "middle", "font-size": 11}, String(n)));
  el("text", {x: L2, y: T - 7, "font-size": 11.5}, "Sₙ (log n tengely)");
  const st = []; for (let m = 0; m <= 10; m++) { st.push(X2(Math.pow(2, m)) + "," + Y2(1 + m / 2)); st.push(X2(Math.min(1024, Math.pow(2, m + 1))) + "," + Y2(1 + m / 2)); }
  el("polyline", {points: st.join(" "), fill: "none", stroke: fg, "stroke-dasharray": "6 4"});
  el("polyline", {points: CUR.map(p => X2(p[0]) + "," + Y2(1 - Math.pow(0.5, p[0]))).join(" "), fill: "none", stroke: mu, "stroke-width": 1.5, "stroke-dasharray": "2 3"});
  const lim = Math.pow(2, s.k);
  el("polyline", {points: CUR.filter(p => p[0] <= lim).map(p => X2(p[0]) + "," + Y2(p[1])).join(" "), fill: "none", stroke: fg, "stroke-width": 2.5});
  el("circle", {cx: X2(lim), cy: Y2(SN[s.k]), r: 5, fill: css("--hl2")});
  el("text", {x: R2, y: Y2(0.6), "text-anchor": "end", "font-size": 11, fill: mu}, "··· Σ1/2ᵏ < 1");
  el("text", {x: R2, y: Y2(7.9), "text-anchor": "end", "font-size": 11}, "━ Sₙ   – – 1 + m/2");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
