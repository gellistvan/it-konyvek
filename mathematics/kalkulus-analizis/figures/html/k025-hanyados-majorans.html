<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hányadoskritérium: mértani majoráns</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Sor és paraméterek">
  <label for="ser">sor:</label>
  <select id="ser"><option value="0">a_n = n/2^n</option><option value="1">a_n = 2^n/n!</option><option value="2">a_n = 1/n²</option></select>
  <label for="N">N =</label><input id="N" type="range" min="1" max="15" step="1" value="3" style="max-width:150px"><b id="Nv"></b>
</div>
<div class="ctl">
  <label for="r">r =</label><input id="r" type="range" min="1" max="59" step="1" value="40" aria-label="r, hatvanadokban"><b id="rv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 400" role="img" aria-label="A sor tagjai logaritmikus skálán a mértani majoráns alatt, alatta a hányadosok és az r szint"></svg>
<p class="small">Az r csúszka hatvanadokban lép (r = 40/60 = 2/3). Áthúzott, kiemelt jelölő: ott a_{n+1}/a_n > r valamely n ≥ N-re (a hányados-panelen a q(n) pont, fent az a_{n+1} tag). Kezdőállapot: n/2ⁿ, N = 3, r = 2/3, majoráns összeg (3/8)·3 = 1,125. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const SER = [
  {name: "n/2ⁿ", a: n => n / Math.pow(2, n), q: n => (n + 1) / (2 * n), L: "1/2"},
  {name: "2ⁿ/n!", a: n => { let v = 1; for (let i = 1; i <= n; i++) v *= 2 / i; return v; }, q: n => 2 / (n + 1), L: "0"},
  {name: "1/n²", a: n => 1 / (n * n), q: n => (n / (n + 1)) * (n / (n + 1)), L: "1"}];
const gcd = (a, b) => b ? gcd(b, a % b) : a;
function draw(){
  const S = SER[+$("ser").value], N = +$("N").value, rk = +$("r").value, r = rk / 60;
  const g = gcd(rk, 60), rs = (rk / g) + "/" + (60 / g) + " ≈ " + fmt(r, 3);
  $("Nv").textContent = N; $("rv").textContent = rs;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), er = css("--err"), hl = css("--hl");
  const L = 62, R = 545, X = n => L + (R - L) * (n - 0.5) / 20;
  // tagok és majoráns
  const T = [], M = {};
  for (let n = 1; n <= 20; n++) T.push(S.a(n));
  const aN = S.a(N);
  for (let n = N; n <= 20; n++) M[n] = aN * Math.pow(r, n - N);
  const all = T.concat(Object.values(M)).filter(v => v > 0);
  let lo = Math.floor(Math.log10(Math.min(...all))), hi = Math.ceil(Math.log10(Math.max(...all)));
  if (hi - lo < 2) lo = hi - 2;
  const T0 = 12, B0 = 238, Y = v => B0 - (B0 - T0) * (Math.log10(v) - lo) / (hi - lo);
  for (let e = lo; e <= hi; e++) {
    el("line", {x1: L, x2: R, y1: Y(Math.pow(10, e)), y2: Y(Math.pow(10, e)), stroke: css("--grid")});
    el("text", {x: L - 6, y: Y(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, "10^" + String(e).replace("-", "−"));
  }
  el("line", {x1: L, x2: L, y1: T0, y2: B0, stroke: mu});
  el("line", {x1: X(N), x2: X(N), y1: T0, y2: 378, stroke: mu, "stroke-dasharray": "6 3 2 3"});
  el("text", {x: X(N) + 4, y: T0 + 10, "font-size": 11, fill: mu}, "N = " + N);
  // majoráns
  let pts = []; for (let n = N; n <= 20; n++) pts.push(X(n).toFixed(1) + "," + Y(M[n]).toFixed(1));
  el("polyline", {points: pts.join(" "), fill: "none", stroke: hl, "stroke-width": 1.6, "stroke-dasharray": "7 4"});
  for (let n = N; n <= 20; n++) el("rect", {x: X(n) - 3.5, y: Y(M[n]) - 3.5, width: 7, height: 7, fill: hl});
  // sértések: n ≥ N, q(n) > r → az a_{n+1} tag és a q(n) pont kiemelve
  const bad = new Set(); for (let n = N; n < 20; n++) if (S.q(n) > r + 1e-12) bad.add(n);
  const cross = (cx, cy) => { el("line", {x1: cx - 7, y1: cy - 7, x2: cx + 7, y2: cy + 7, stroke: er, "stroke-width": 2.2}); el("line", {x1: cx - 7, y1: cy + 7, x2: cx + 7, y2: cy - 7, stroke: er, "stroke-width": 2.2}); };
  T.forEach((v, i) => { const n = i + 1, b = bad.has(n - 1);
    el("circle", {cx: X(n), cy: Y(v), r: 4.5, fill: css("--bg"), stroke: b ? er : fg, "stroke-width": b ? 2.2 : 1.5});
    if (b) cross(X(n), Y(v)); });
  [1, 5, 10, 15, 20].forEach(n => el("text", {x: X(n), y: B0 + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, String(n)));
  el("text", {x: R, y: T0 + 10, "text-anchor": "end", "font-size": 12}, "○ a_n = " + S.name + "    ■ - - majoráns a_N·r^(n−N)");
  // hányados-panel
  const T1 = 262, B1 = 378, YQ = q => B1 - (B1 - T1) * q / 1.1;
  el("line", {x1: L, x2: R, y1: B1, y2: B1, stroke: mu}); el("line", {x1: L, x2: L, y1: T1, y2: B1, stroke: mu});
  [0, 0.5, 1].forEach(q => el("text", {x: L - 6, y: YQ(q) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(q, 1)));
  el("line", {x1: L, x2: R, y1: YQ(r), y2: YQ(r), stroke: hl, "stroke-width": 1.4, "stroke-dasharray": "7 4"});
  el("text", {x: R, y: YQ(r) - 4, "text-anchor": "end", "font-size": 11, fill: hl}, "r");
  pts = []; for (let n = 1; n < 20; n++) pts.push(X(n).toFixed(1) + "," + YQ(S.q(n)).toFixed(1));
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 1.2});
  for (let n = 1; n < 20; n++) { const b = bad.has(n);
    el("circle", {cx: X(n), cy: YQ(S.q(n)), r: 3.5, fill: css("--bg"), stroke: b ? er : fg, "stroke-width": b ? 2 : 1.3});
    if (b) cross(X(n), YQ(S.q(n))); }
  el("text", {x: L + 4, y: T1 + 2, "font-size": 11, fill: mu}, "a_{n+1}/a_n  (n = 1…19),  határérték L = " + S.L);
  el("text", {x: R, y: 396, "text-anchor": "end", "font-size": 11, fill: mu}, "n");
  // feltétel n ≥ N-re (n < 2000-ig ellenőrizve; a három sor hányadosa monoton)
  let ok = true, first = 0; for (let n = N; n < 2000; n++) if (S.q(n) > r + 1e-12) { ok = false; first = n; break; }
  let msg = "N = " + N + ", r = " + rs + ", a_{n+1}/a_n ≤ r minden n ≥ N-re: " + (ok ? "igen" : "nem (először n = " + first + "-nél)");
  if (ok) msg += "; majoráns összeg a_N/(1−r) = " + fmt(aN / (1 - r), 4).replace(/,?0+$/, "") + " ≥ Σ_{n≥N} a_n";
  else if (+$("ser").value === 2) msg += "; az 1/n² sornál L = 1, semmilyen r < 1 nem jó: a kritérium nem dönt (a sor mégis konvergens)";
  $("status").textContent = msg;
}
["ser", "N", "r"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
