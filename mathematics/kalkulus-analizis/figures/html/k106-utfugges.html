<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Útfüggés: egyenes és parabola a forgó mezőben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Út és idő">
  <span>út:</span>
  <label><input type="radio" name="path" value="1"> γ₁ (egyenes)</label>
  <label><input type="radio" name="path" value="2" checked> γ₂ (parabola)</label>
  <label for="t">t =</label><input id="t" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="paraméter t"><b id="tv"></b>
  <button id="play">▶ Lejátszás (20 lépés)</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 325" role="img" aria-label="A forgó mező nyilai, két út az origóból az (1; 1) pontba, a mozgó pontban a mezővektor és az érintővektor; mellette az integrandus grafikonja"></svg>
<p class="small">F = (−y, x). γ₁: F·γ₁' = 0 végig, a munka 0. γ₂: F·γ₂' = t², az eddigi munka t³/3, a teljes munka 1/3. Kezdőállapot: γ₂, t = 0,5 (F·γ' = 0,25, eddigi munka ≈ 0,0417). Számított értékek a képletekből.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let T = 0.5, PATH = 2, timer = null;
const G = {1: t => [t, t], 2: t => [t, t * t]}, D = {1: t => [1, 1], 2: t => [1, 2 * t]};
const WORK = {1: t => 0, 2: t => t * t * t / 3};
function arrow(x1, y1, x2, y2, col, w, dash){
  const a = Math.atan2(y2 - y1, x2 - x1), L = Math.hypot(x2 - x1, y2 - y1); if (L < 0.5) return;
  const hd = Math.min(9, 0.45 * L + 2), at = {x1, y1, x2, y2, stroke: col, "stroke-width": w}; if (dash) at["stroke-dasharray"] = dash; el("line", at);
  el("polygon", {points: [x2, y2, x2 - hd * Math.cos(a - 0.4), y2 - hd * Math.sin(a - 0.4), x2 - hd * Math.cos(a + 0.4), y2 - hd * Math.sin(a + 0.4)].join(" "), fill: col});
}
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), fi = css("--fill");
  $("tv").textContent = fmt(T, 2);
  const L = 20, S = 260 / 1.5, X = x => L + (x + 0.2) * S, Y = y => 290 - (y + 0.2) * S;
  for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) {
    const x = -0.2 + 1.5 * i / 11, y = -0.2 + 1.5 * j / 11;
    arrow(X(x), Y(y), X(x - y / 9), Y(y + x / 9), mu, 0.8);
  }
  [1, 2].forEach(p => { const pts = []; for (let i = 0; i <= 50; i++) { const q = G[p](i / 50); pts.push(X(q[0]).toFixed(1) + "," + Y(q[1]).toFixed(1)); }
    el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": p === PATH ? 3 : 1.4, "stroke-dasharray": p === 2 ? "8 5" : "", opacity: p === PATH ? 1 : 0.5}); });
  el("circle", {cx: X(0), cy: Y(0), r: 4, fill: fg}); el("circle", {cx: X(1), cy: Y(1), r: 4, fill: fg});
  el("text", {x: X(0) + 6, y: Y(0) + 16, "font-size": 12}, "A"); el("text", {x: X(1) + 6, y: Y(1) - 6, "font-size": 12}, "B");
  const q = G[PATH](T), d = D[PATH](T), f = [-q[1], q[0]];
  el("circle", {cx: X(q[0]), cy: Y(q[1]), r: 6, fill: fg});
  arrow(X(q[0]), Y(q[1]), X(q[0] + 0.35 * f[0]), Y(q[1] + 0.35 * f[1]), hl2, 2.6);
  arrow(X(q[0]), Y(q[1]), X(q[0] + 0.25 * d[0]), Y(q[1] + 0.25 * d[1]), hl, 2.2, "5 3");
  el("text", {x: 20, y: 318, "font-size": 12}, "narancs: F(γ(t)), kék szaggatott: γ'(t)");
  // jobb: integrandus
  const L2 = 330, R2 = 545, T2 = 30, B2 = 280, PX = t => L2 + (R2 - L2) * t, PY = v => B2 - (B2 - T2) * v / 1.05;
  el("line", {x1: L2, y1: PY(0), x2: R2, y2: PY(0), stroke: mu}); el("line", {x1: L2, y1: T2, x2: L2, y2: B2, stroke: mu});
  [0, 0.5, 1].forEach(v => { el("text", {x: PX(v), y: B2 + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(v, 1)); el("text", {x: L2 - 4, y: PY(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(v, 1)); });
  el("text", {x: (L2 + R2) / 2, y: T2 - 10, "text-anchor": "middle", "font-size": 12}, "F(γ(t))·γ'(t)");
  const integ = {1: t => 0, 2: t => t * t};
  if (PATH === 2) { const a = [PX(0) + "," + PY(0)]; for (let i = 0; i <= 40; i++) { const s = T * i / 40; a.push(PX(s).toFixed(1) + "," + PY(s * s).toFixed(1)); } a.push(PX(T) + "," + PY(0)); el("polygon", {points: a.join(" "), fill: fi}); }
  [1, 2].forEach(p => { const pts = []; for (let i = 0; i <= 50; i++) pts.push(PX(i / 50).toFixed(1) + "," + PY(integ[p](i / 50)).toFixed(1));
    el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": p === PATH ? 2.6 : 1.2, "stroke-dasharray": p === 2 ? "8 5" : "", opacity: p === PATH ? 1 : 0.5}); });
  el("circle", {cx: PX(T), cy: PY(integ[PATH](T)), r: 4.5, fill: hl2});
  const dot = f[0] * d[0] + f[1] * d[1];
  $("status").textContent = "γ" + (PATH === 1 ? "₁" : "₂") + ", t = " + fmt(T, 2) + ": γ(t) = (" + fmt(q[0], 4) + "; " + fmt(q[1], 4) + "), F·γ' = " + fmt(dot, 4) +
    ", eddigi munka = " + fmt(WORK[PATH](T), 4) + (T >= 1 ? "  (teljes munka: " + (PATH === 1 ? "0" : "1/3 ≈ 0,3333") + ")" : "");
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás (20 lépés)"; }
document.querySelectorAll('input[name=path]').forEach(r => r.addEventListener("change", () => { PATH = +r.value; draw(); }));
$("t").addEventListener("input", () => { stopPlay(); T = +$("t").value; draw(); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  let i = 0; T = 0; $("t").value = 0; draw(); $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { i++; T = Math.round(i * 5) / 100; $("t").value = T; draw(); if (i >= 20) stopPlay(); }, 400);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
