<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyukas tartomány: irányítás és cellás kiejtés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

<p class="small">F = (−y, x), D = {1 ≤ x² + y² ≤ 4}. A külső kör járuléka +8π, a helyesen (óramutatóval megegyezően) bejárt belső köré −2π, az összeg 6π = 2 · 3π. A kapcsolóval a belső kör rossz irányú bejárása 10π-t ad. Számított értékek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "fo": 0, "fi": 0, "wrong": false, "line": 0, "msg": "1) A gyűrű 1 ≤ x² + y² ≤ 4 és az F = (−y, x) forgó mező; rot F = 2, a terület 3π."}, {"ph": 1, "fo": 0.125, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 1π"}, {"ph": 1, "fo": 0.25, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 2π"}, {"ph": 1, "fo": 0.375, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 3π"}, {"ph": 1, "fo": 0.5, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 4π"}, {"ph": 1, "fo": 0.625, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 5π"}, {"ph": 1, "fo": 0.75, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 6π"}, {"ph": 1, "fo": 0.875, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 7π"}, {"ph": 1, "fo": 1.0, "fi": 0, "wrong": false, "line": 1, "msg": "2) Külső kör, óramutatóval ellentétesen (D bal kéz felől): futó összeg 8π — a külső kör járuléka +8π."}, {"ph": 2, "fo": 1, "fi": 0.125, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 7,75π"}, {"ph": 2, "fo": 1, "fi": 0.25, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 7,5π"}, {"ph": 2, "fo": 1, "fi": 0.375, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 7,25π"}, {"ph": 2, "fo": 1, "fi": 0.5, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 7π"}, {"ph": 2, "fo": 1, "fi": 0.625, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 6,75π"}, {"ph": 2, "fo": 1, "fi": 0.75, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 6,5π"}, {"ph": 2, "fo": 1, "fi": 0.875, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 6,25π"}, {"ph": 2, "fo": 1, "fi": 1.0, "wrong": false, "line": 2, "msg": "3) Belső kör, óramutatóval megegyezően: futó összeg 6π  →  ∮ = 8π − 2π = 6π = 2 · terület(3π) ✓"}, {"ph": 3, "fo": 1, "fi": 1, "wrong": false, "line": 3, "msg": "4) Két félgyűrű-cella, mindkettő pozitívan körüljárva (egyenként 3π): a vágásokon a két cella ellentétes irányban halad, ezek járuléka kiejti egymást, így az összeg a gyűrű határintegrálja, 6π."}];
const CODE = ["1) gyűrű D és mező F = (−y, x), rot F = 2", "2) külső kör r = 2, óramutatóval ellentétes:   ∮ = +8π", "3) belső kör r = 1, óramutatóval megegyező:    ∮ = −2π   (összesen 6π)", "4) cellákra bontás: a vágások menti járulékok kiejtik egymást"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cl = css("--cellhl");
  const cx = 150, cy = 150, k = 58, X = x => cx + k * x, Y = y => cy - k * y;
  const wedge = (r1, r2, a0, a1, dy, fill, dash) => {
    const p = [];
    for (let i = 0; i <= 40; i++) { const t = a0 + (a1 - a0) * i / 40; p.push([r2 * Math.cos(t), r2 * Math.sin(t) + dy]); }
    for (let i = 40; i >= 0; i--) { const t = a0 + (a1 - a0) * i / 40; p.push([r1 * Math.cos(t), r1 * Math.sin(t) + dy]); }
    return p;
  };
  // gyűrű (lyukkal)
  const ring = [];
  for (let i = 0; i <= 80; i++) { const t = 2 * Math.PI * i / 80; ring.push(X(2 * Math.cos(t)).toFixed(1) + "," + Y(2 * Math.sin(t)).toFixed(1)); }
  for (let i = 80; i >= 0; i--) { const t = 2 * Math.PI * i / 80; ring.push(X(Math.cos(t)).toFixed(1) + "," + Y(Math.sin(t)).toFixed(1)); }
  el("polygon", {points: ring.join(" "), fill: cl, stroke: "none", "fill-rule": "evenodd", opacity: 0.6});
  for (let i = 0; i < 9; i++) for (let j = 0; j < 9; j++) {
    const x = -2.3 + 4.6 * i / 8, y = -2.3 + 4.6 * j / 8, x2 = x - y / 7, y2 = y + x / 7;
    const a = Math.atan2(Y(y2) - Y(y), X(x2) - X(x));
    el("line", {x1: X(x), y1: Y(y), x2: X(x2), y2: Y(y2), stroke: mu, "stroke-width": 0.8});
    el("polygon", {points: [X(x2), Y(y2), X(x2) - 5 * Math.cos(a - 0.4), Y(y2) - 5 * Math.sin(a - 0.4), X(x2) - 5 * Math.cos(a + 0.4), Y(y2) - 5 * Math.sin(a + 0.4)].join(" "), fill: mu});
  }
  const circle = (r, dash, w, col) => el("circle", {cx: X(0), cy: Y(0), r: k * r, fill: "none", stroke: col, "stroke-width": w, "stroke-dasharray": dash});
  circle(2, "", 1.2, mu); circle(1, "6 4", 1.2, mu);
  const arcPath = (r, from, sweep) => { const pts = []; const n = Math.max(2, Math.ceil(Math.abs(sweep) * 20));
    for (let i = 0; i <= n; i++) { const t = from + sweep * i / n; pts.push(X(r * Math.cos(t)).toFixed(1) + "," + Y(r * Math.sin(t)).toFixed(1)); } return pts; };
  const head = (r, t, dir, col) => { const x = r * Math.cos(t), y = r * Math.sin(t), tx = -Math.sin(t) * dir, ty = Math.cos(t) * dir;
    const a = Math.atan2(-ty, tx), px = X(x), py = Y(y);
    el("polygon", {points: [px + 9 * Math.cos(a), py + 9 * Math.sin(a), px - 6 * Math.cos(a) + 6 * Math.sin(a), py - 6 * Math.sin(a) - 6 * Math.cos(a), px - 6 * Math.cos(a) - 6 * Math.sin(a), py - 6 * Math.sin(a) + 6 * Math.cos(a)].join(" "), fill: col}); };
  if (s.fo > 0) { const sw = 2 * Math.PI * s.fo; el("polyline", {points: arcPath(2, 0, sw).join(" "), fill: "none", stroke: hl, "stroke-width": 3.2}); head(2, sw, 1, hl); }
  const idir = s.wrong ? 1 : -1, icol = s.wrong ? css("--err") || hl2 : hl2;
  if (s.fi > 0) { const sw = 2 * Math.PI * s.fi * idir; el("polyline", {points: arcPath(1, 0, sw).join(" "), fill: "none", stroke: icol, "stroke-width": 3.2, "stroke-dasharray": "7 4"}); head(1, sw, idir, icol); }
  el("text", {x: X(1.45), y: Y(2.15), "font-size": 12, fill: hl}, s.fo > 0 ? "+" + Math.round(8 * s.fo * 100) / 100 + "π" : "");
  // jobb oldal
  if (s.ph < 3) {
    const run = 8 * s.fo + (s.wrong ? 2 : -2) * s.fi;
    el("text", {x: 330, y: 70, "font-size": 14}, "futó összeg:");
    el("text", {x: 330, y: 100, "font-size": 22, "font-weight": "bold"}, (Math.round(run * 100) / 100 + "π").replace(".", ",").replace("-", "−"));
    el("text", {x: 330, y: 140, "font-size": 13}, "Green-tétel: 2 · terület = 2 · 3π = 6π");
    el("text", {x: 330, y: 170, "font-size": 13, fill: hl}, "külső kör: ↺ (D bal kéz felől)");
    el("text", {x: 330, y: 192, "font-size": 13, fill: icol}, s.wrong ? "belső kör: ↺ — HIBÁS" : "belső kör: ↻ (D bal kéz felől)");
  } else {
    const c2 = 430, k2 = 30, gap = 0.3, X2 = x => c2 + k2 * x, Y2 = y => 150 - k2 * y;
    [[0, Math.PI, gap], [Math.PI, 2 * Math.PI, -gap]].forEach(([a0, a1, dy]) => {
      el("polygon", {points: wedge(1, 2, a0, a1, dy).map(p => X2(p[0]).toFixed(1) + "," + Y2(p[1]).toFixed(1)).join(" "), fill: cl, stroke: fg, "stroke-width": 1.3});
    });
    const cut = (x0, x1, dy, col) => { const yy = Y2(dy * 0.5), a = x1 > x0 ? 0 : Math.PI;
      el("line", {x1: X2(x0), y1: yy, x2: X2(x1), y2: yy, stroke: col, "stroke-width": 2.4});
      el("polygon", {points: [X2(x1), yy, X2(x1) - 8 * Math.cos(a), yy - 4, X2(x1) - 8 * Math.cos(a), yy + 4].join(" "), fill: col}); };
    cut(1.15, 1.85, gap, hl); cut(1.85, 1.15, -gap, hl2); cut(-1.85, -1.15, gap, hl); cut(-1.15, -1.85, -gap, hl2);
    el("text", {x: c2, y: 147, "text-anchor": "middle", "font-size": 11}, "kiejtik"); el("text", {x: c2, y: 160, "text-anchor": "middle", "font-size": 11}, "egymást");
    el("text", {x: c2, y: 72, "text-anchor": "middle", "font-size": 13}, "felső cella: 3π");
    el("text", {x: c2, y: 240, "text-anchor": "middle", "font-size": 13}, "alsó cella: 3π");
    el("text", {x: c2, y: 268, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "összesen 6π");
  }
}
document.getElementById("wrong").addEventListener("change", e => setSteps(e.target.checked ? STEPS_BAD : STEPS_OK));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
