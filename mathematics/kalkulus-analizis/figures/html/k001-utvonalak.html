<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A négy tanulási útvonal hangsúlyai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
#why ul{margin:4px 0 0;padding-left:1.2em} button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Útvonal kiválasztása">
<span>Útvonal:</span>
<button data-r="0" aria-pressed="true">Teljes kurzus</button><button data-r="1">Mérnöki gyors út</button>
<button data-r="2">Fizikus út</button><button data-r="3">Matematikai alapozó út</button>
<button data-r="-1">Mind</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 252" role="img" aria-label="Táblázat: négy útvonal sorokban, öt szempont oszlopokban, a cellákban a hangsúly szintje"></svg>
<p class="small">A négy útvonal egymás mellett választható, nem egymás utáni lépés. A szintek a fejezet útvonal-leírásaiból származnak (szerkesztői összefoglaló, nem mérés).<span id="why"></span></p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const R = ["Teljes kurzus", "Mérnöki gyors út", "Fizikus út", "Matematikai alapozó út"], C = ["bizonyítások", "C\nfeladatok", "D\nfeladatok", "VIII. rész\n(vektor-\nanalízis)", "X. rész\n(differenciál-\negyenletek)"], M = [[1, 1, 1, 1, 1], [1, 0, 2, 2, 2], [1, 1, 2, 2, 2], [2, 2, 1, 1, 1]], W = [["olvasd el és értsd meg", "csak ha a gondolkodás fejlesztése a cél", "A–D feladatok", "minden alfejezet", "minden alfejezet"], ["olvasd el, nem kell fejből reprodukálni", "egy része átugorható", "mindenképp csináld meg", "kch27–kch28 különösen fontos", "kch34–kch37 különösen fontos"], ["a fizikai szemléletet segítők fontosak", "a szemléletet segítők; az absztraktak elhagyhatók", "a VIII. és X. részben mind", "lassabban, az összes D feladattal", "lassabban, az összes D feladattal"], ["mindet lépésről lépésre", "minden C feladatot megoldasz", "a törzsanyag szerint", "a törzsanyag szerint", "a törzsanyag szerint"]], LV = ["részben kihagyható", "rendes mélységben", "hangsúlyos, mélyen"], LV2 = [["részben", "kihagyható"], ["rendes", "mélységben"], ["hangsúlyos,", "mélyen"]];
let sel = -1;
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const x0 = 170, cw = 76, y0 = 62, ch = 46;
  const fills = [css("--bg"), css("--cellhl"), css("--hl")];
  C.forEach((c, j) => c.split("\n").forEach((p, q) => el("text", {x: x0 + j * cw + cw / 2, y: 18 + q * 14, "text-anchor": "middle", "font-size": 12}, p)));
  R.forEach((r, i) => {
    const on = sel < 0 || sel === i, y = y0 + i * ch;
    el("text", {x: x0 - 8, y: y + ch / 2 + 4, "text-anchor": "end", "font-size": 13, "font-weight": sel === i ? "bold" : "normal", fill: on ? fg : mu}, r);
    M[i].forEach((v, j) => {
      el("rect", {x: x0 + j * cw, y: y, width: cw, height: ch, fill: fills[v], stroke: fg, "stroke-width": sel === i ? 2.5 : 1, opacity: on ? 1 : 0.35, "stroke-dasharray": v === 0 ? "4 3" : ""});
      LV2[v].forEach((p, q) => el("text", {x: x0 + j * cw + cw / 2, y: y + ch / 2 - 2 + q * 13, "text-anchor": "middle", "font-size": 11, fill: v === 2 ? css("--bg") : fg, opacity: on ? 1 : 0.35}, p));
    });
  });
  document.querySelectorAll("button[data-r]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.r === sel)));
  if (sel < 0) { $("status").textContent = "Mind a négy útvonal: párhuzamos alternatívák, ugyanazzal a törzsanyaggal; válassz egyet a részletekhez."; $("why").innerHTML = ""; return; }
  $("status").textContent = R[sel] + ": " + C.map((c, j) => c.replace(/\n/g, " ") + " – " + LV[M[sel][j]]).join("; ") + ".";
  $("why").innerHTML = "<ul>" + C.map((c, j) => "<li><b>" + c.replace("\n", " ") + ":</b> " + W[sel][j] + "</li>").join("") + "</ul>";
}
document.querySelectorAll("button[data-r]").forEach(b => b.addEventListener("click", () => { sel = +b.dataset.r; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();


</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
