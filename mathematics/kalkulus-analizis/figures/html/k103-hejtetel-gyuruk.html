<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Héjtétel: gyűrűnkénti járulékok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="R">R =</label><input id="R" type="range" min="0" max="3" step="0.05" value="2" aria-label="a megfigyelő pont távolsága R"><b id="Rv"></b>
</div>
<div class="ctl" role="group" aria-label="Kiemelt gyűrű">
  <label for="th">ϑ =</label><input id="th" type="range" min="0" max="180" step="1" value="60" aria-label="a kiemelt gyűrű szöge fokban"><b id="thv"></b>
  <button id="play">▶ Összegzés 0-tól π-ig</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Gömbhéj metszete egy kiemelt gyűrűvel és a megfigyelő ponttal, mellette a gyűrűk járulékának görbéje és a kumulált terület"></svg>
<p class="small">a = 1. R > 1-re a teljes összeg 2/R² (R = 2: 0,5), R < 1-re 0: a pozitív és a negatív rész kioltja egymást. R = a környékén a görbe ϑ = 0 közelében csúcsosodik. A kumulált értéket Simpson-szabály számolja. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const a = 1;
let R = 2, TH = 60, timer = null;
const rad = d => d * Math.PI / 180;
const sOf = (R, t) => Math.sqrt(R * R + a * a - 2 * a * R * Math.cos(t));
const gOf = (R, t) => { const s = sOf(R, t); return s < 1e-9 ? 0 : (R - a * Math.cos(t)) * Math.sin(t) / (s * s * s); };
function cum(R, deg){ // Simpson-szabály 0..deg fokig (páros osztásszám)
  const n = 2 * Math.max(10, Math.ceil(deg * 4)), b = rad(deg), h = b / n; if (b <= 0) return 0;
  let S = gOf(R, 0) + gOf(R, b); for (let i = 1; i < n; i++) S += (i % 2 ? 4 : 2) * gOf(R, i * h); return S * h / 3; }
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), fi = css("--fill");
  $("Rv").textContent = fmt(R, 2); $("thv").textContent = TH + "°";
  // bal: héj
  const cx = 130, cy = 205, k = 55, X = x => cx + k * x, Y = z => cy - k * z;
  el("circle", {cx: X(0), cy: Y(0), r: k * a, fill: "none", stroke: fg, "stroke-width": 1.8});
  el("line", {x1: X(0), y1: Y(-1.3), x2: X(0), y2: Y(3.25), stroke: mu});
  el("text", {x: X(0) + 5, y: Y(3.2), "font-size": 12}, "z");
  const t = rad(TH), zr = a * Math.cos(t), rr = a * Math.sin(t);
  el("ellipse", {cx: X(0), cy: Y(zr), rx: Math.max(0.5, k * rr), ry: Math.max(0.5, 8 * rr), fill: "none", stroke: hl2, "stroke-width": 2.6});
  el("circle", {cx: X(0), cy: Y(R), r: 5, fill: fg});
  el("text", {x: X(0) - 8, y: Y(R) + 4, "text-anchor": "end", "font-size": 12}, "P (R = " + fmt(R, 2) + ")");
  el("line", {x1: X(0), y1: Y(R), x2: X(rr), y2: Y(zr), stroke: hl, "stroke-width": 1.8, "stroke-dasharray": "6 4"});
  el("text", {x: X(rr / 2) + 6, y: Y((R + zr) / 2), "font-size": 12, fill: hl}, "s");
  el("line", {x1: X(0), y1: Y(0), x2: X(rr), y2: Y(zr), stroke: mu, "stroke-width": 1});
  el("text", {x: 10, y: 322, "font-size": 12}, "a = 1, kiemelt gyűrű sugara sin ϑ = " + fmt(rr, 3));
  // jobb: járulékgörbe
  const L = 310, Rr = 535, T = 40, B = 300;
  let ymax = 0.5; for (let d = 0; d <= 180; d += 1) ymax = Math.max(ymax, Math.abs(gOf(R, rad(d))));
  ymax = Math.min(ymax * 1.1, 12);
  const PX = d => L + (Rr - L) * d / 180, PY = y => (T + B) / 2 - (B - T) / 2 * Math.max(-1.05, Math.min(1.05, y / ymax));
  el("line", {x1: L, y1: PY(0), x2: Rr, y2: PY(0), stroke: mu});
  el("line", {x1: L, y1: T, x2: L, y2: B, stroke: mu});
  [0, 60, 120, 180].forEach(d => el("text", {x: PX(d), y: B + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, d + "°"));
  el("text", {x: L - 4, y: T + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(ymax, 2));
  el("text", {x: L - 4, y: B + 4, "text-anchor": "end", "font-size": 11, fill: mu}, "−" + fmt(ymax, 2));
  // kumulált terület
  const area = [PX(0) + "," + PY(0)];
  for (let d = 0; d <= TH; d += 0.5) area.push(PX(d).toFixed(1) + "," + PY(gOf(R, rad(d))).toFixed(1));
  area.push(PX(TH) + "," + PY(0));
  el("polygon", {points: area.join(" "), fill: fi, stroke: "none"});
  const pts = []; for (let d = 0; d <= 180; d += 0.5) pts.push(PX(d).toFixed(1) + "," + PY(gOf(R, rad(d))).toFixed(1));
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("line", {x1: PX(TH), y1: T, x2: PX(TH), y2: B, stroke: hl2, "stroke-dasharray": "3 3"});
  el("circle", {cx: PX(TH), cy: PY(gOf(R, t)), r: 4.5, fill: hl2});
  el("text", {x: (L + Rr) / 2, y: T - 14, "text-anchor": "middle", "font-size": 12}, "járulék g(ϑ) = (R − cos ϑ) sin ϑ / s³");
  const s = sOf(R, t), ca = s < 1e-9 ? NaN : (R - a * Math.cos(t)) / s, I = cum(R, TH);
  const full = R === a ? null : (R > a ? 2 / (R * R) : 0);
  $("status").textContent = "ϑ = " + TH + "°: s = " + fmt(s, 4) + ", cos α = " + (isNaN(ca) ? "—" : fmt(ca, 4)) +
    ", a gyűrű járuléka g(ϑ) = " + fmt(gOf(R, t), 4) + ", kumulált I(ϑ) = " + fmt(I, 4) +
    (TH === 180 ? (full === null ? "  (R = a határeset: a pontos érték 1, a numerikus összeg " + fmt(I, 4) + ")" : "  — teljes: " + (R > a ? "2/R² = " + fmt(full, 4) : "0 (belső pont)")) : "");
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Összegzés 0-tól π-ig"; }
$("R").addEventListener("input", () => { R = +$("R").value; draw(); });
$("th").addEventListener("input", () => { stopPlay(); TH = +$("th").value; draw(); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  TH = 0; $("th").value = 0; draw(); $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { TH = Math.min(180, TH + 5); $("th").value = TH; draw(); if (TH >= 180) stopPlay(); }, 120);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
