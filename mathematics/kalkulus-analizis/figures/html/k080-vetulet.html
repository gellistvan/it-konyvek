<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merőleges vetület és paralelogramma</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
input[type=number]{width:4.2em}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="A vektorok koordinátái">
  <label>u = (<input id="u1" type="number" step="1" min="-4" max="4" value="3" aria-label="u első koordinátája">;
  <input id="u2" type="number" step="1" min="-3" max="3" value="1" aria-label="u második koordinátája">)</label>
  <label>v = (<input id="v1" type="number" step="1" min="-4" max="4" value="1" aria-label="v első koordinátája">;
  <input id="v2" type="number" step="1" min="-3" max="3" value="1" aria-label="v második koordinátája">)</label>
  <button id="reset">Kezdőállapot</button>
</div>
<p class="small">Az u és a v végpontja egérrel (ujjal) húzható; a végpont az egész rácspontokra ugrik.</p>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 528 420" role="img" aria-label="Koordináta-rendszer a húzható u és v vektorral, a vetülettel, a merőleges maradékkal és a vonalkázott paralelogrammával"></svg>
<p class="small">proj_v u = (u·v/|v|²)·v, a maradék u − proj_v u merőleges v-re; a terület |u₁v₂ − u₂v₁| = |u|·|v|·sin θ. Hegyesszögnél λ > 0, derékszögnél a vetület 0, tompaszögnél λ < 0. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const XMIN = -4, XMAX = 4, YMIN = -3, YMAX = 3, S = 56, OX = 40 - XMIN * S, OY = 20 + YMAX * S;
const X = x => OX + x * S, Y = y => OY - y * S;
let U = [3, 1], Vv = [1, 1], drag = null;
const n2 = x => fmt(x, 2).replace(/,00$/, "").replace(/(,\d)0$/, "$1");
function arrow(p, q, col, w, dash){
  const dx = X(q[0]) - X(p[0]), dy = Y(q[1]) - Y(p[1]), L = Math.hypot(dx, dy);
  if (L < 1) return;
  const ux = dx / L, uy = dy / L, h = 11;
  el("line", {x1: X(p[0]), y1: Y(p[1]), x2: X(q[0]) - ux * h * 0.8, y2: Y(q[1]) - uy * h * 0.8, stroke: col, "stroke-width": w, "stroke-dasharray": dash || ""});
  const bx = X(q[0]) - ux * h, by = Y(q[1]) - uy * h;
  el("polygon", {points: `${X(q[0])},${Y(q[1])} ${bx - uy * h * 0.45},${by + ux * h * 0.45} ${bx + uy * h * 0.45},${by - ux * h * 0.45}`, fill: col});
}
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), gr = css("--grid");
  const defs = el("defs", {});
  const pat = el("pattern", {id: "hatch", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 8, stroke: mu, "stroke-width": 1.2}, undefined, pat);
  for (let x = XMIN; x <= XMAX; x++) { el("line", {x1: X(x), y1: Y(YMIN), x2: X(x), y2: Y(YMAX), stroke: gr}); el("text", {x: X(x), y: Y(0) + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(x, 0)); }
  for (let y = YMIN; y <= YMAX; y++) { el("line", {x1: X(XMIN), y1: Y(y), x2: X(XMAX), y2: Y(y), stroke: gr}); if (y) el("text", {x: X(0) - 6, y: Y(y) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(y, 0)); }
  el("line", {x1: X(XMIN), y1: Y(0), x2: X(XMAX), y2: Y(0), stroke: mu}); el("line", {x1: X(0), y1: Y(YMIN), x2: X(0), y2: Y(YMAX), stroke: mu});
  const vv = Vv[0] * Vv[0] + Vv[1] * Vv[1], dot = U[0] * Vv[0] + U[1] * Vv[1];
  const area = Math.abs(U[0] * Vv[1] - U[1] * Vv[0]);
  el("polygon", {points: [[0, 0], U, [U[0] + Vv[0], U[1] + Vv[1]], Vv].map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "url(#hatch)", stroke: mu, "stroke-width": 0.8});
  let msg;
  if (vv === 0) {
    msg = "v = 0: a vetület nem értelmezett (v ≠ 0 kell).";
  } else {
    const lam = dot / vv, P = [lam * Vv[0], lam * Vv[1]], nu = Math.hypot(U[0], U[1]);
    if (Math.abs(lam) > 1e-12) arrow([0, 0], P, css("--hl2"), 2.2, "8 5");
    arrow(P, U, css("--hl2"), 2.2, "2 4");
    if (nu > 0) {
      const a1 = Math.atan2(Vv[1], Vv[0]); let a2 = Math.atan2(U[1], U[0]); let d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      const pts = []; for (let i = 0; i <= 30; i++) { const t = a1 + d * i / 30; pts.push(X(0.6 * Math.cos(t)) + "," + Y(0.6 * Math.sin(t))); }
      el("polyline", {points: pts.join(" "), fill: "none", stroke: fg});
      const tm = a1 + d / 2; el("text", {x: X(0.95 * Math.cos(tm)), y: Y(0.95 * Math.sin(tm)) + 4, "text-anchor": "middle", "font-size": 13}, "θ");
    }
    const th = nu > 0 ? Math.acos(Math.max(-1, Math.min(1, dot / (nu * Math.sqrt(vv))))) * 180 / Math.PI : NaN;
    msg = `u·v = ${n2(dot)}, |v|² = ${n2(vv)}, λ = ${n2(lam)}, proj = (${n2(P[0])}, ${n2(P[1])}), terület = ${n2(area)}` + (nu > 0 ? `, θ = ${fmt(th, 2)}°` : ", θ nem értelmezett (u = 0)");
  }
  arrow([0, 0], U, fg, 2.2);
  arrow([0, 0], Vv, fg, 4.5);
  el("circle", {cx: X(U[0]), cy: Y(U[1]), r: 9, fill: "transparent", stroke: fg, "stroke-width": 1, "data-h": "u", style: "cursor:grab"});
  el("circle", {cx: X(Vv[0]), cy: Y(Vv[1]), r: 9, fill: "transparent", stroke: fg, "stroke-width": 1, "data-h": "v", style: "cursor:grab"});
  el("text", {x: X(U[0]) + 10, y: Y(U[1]) - 10, "font-size": 15}, "u");
  el("text", {x: X(Vv[0]) + 10, y: Y(Vv[1]) - 10, "font-size": 15, "font-weight": "bold"}, "v");
  el("text", {x: 40, y: 410, "font-size": 12, fill: mu}, "vastag: v   vékony: u   szaggatott: vetület   pontozott: merőleges maradék   vonalkázott: paralelogramma");
  $("status").textContent = msg;
  $("u1").value = U[0]; $("u2").value = U[1]; $("v1").value = Vv[0]; $("v2").value = Vv[1];
}
function toModel(evt){
  const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const clamp = (a, lo, hi) => Math.max(lo, Math.min(hi, a));
  return [clamp(Math.round((p.x - OX) / S), XMIN, XMAX), clamp(Math.round((OY - p.y) / S), YMIN, YMAX)];
}
svg.addEventListener("pointerdown", e => {
  const q = toModel(e);
  const du = Math.hypot(q[0] - U[0], q[1] - U[1]), dv = Math.hypot(q[0] - Vv[0], q[1] - Vv[1]);
  if (Math.min(du, dv) > 1.01) return;
  drag = du <= dv ? "u" : "v"; svg.setPointerCapture(e.pointerId); e.preventDefault();
});
svg.addEventListener("pointermove", e => { if (!drag) return; const q = toModel(e); if (drag === "u") U = q; else Vv = q; draw(); });
svg.addEventListener("pointerup", () => { drag = null; });
["u1", "u2", "v1", "v2"].forEach(id => $(id).addEventListener("input", () => {
  const g = id => { const a = Math.round(+$(id).value); return isFinite(a) ? a : 0; };
  U = [Math.max(XMIN, Math.min(XMAX, g("u1"))), Math.max(YMIN, Math.min(YMAX, g("u2")))];
  Vv = [Math.max(XMIN, Math.min(XMAX, g("v1"))), Math.max(YMIN, Math.min(YMAX, g("v2")))];
  draw();
}));
$("reset").addEventListener("click", () => { U = [3, 1]; Vv = [1, 1]; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
