<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Középpont-, trapéz- és Simpson-szabály</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Módszer">
  <button id="bM" aria-pressed="false">Középpont</button><button id="bT" aria-pressed="true">Trapéz</button><button id="bS" aria-pressed="false">Simpson</button>
  <label for="n">n =</label><input id="n" type="range" min="2" max="32" step="1" value="4" aria-label="részintervallumok száma (Simpsonnál páros)"><b id="nv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Bal oldalon az 1 per 1 plusz x négyzet görbe a választott szabály téglalapjaival, trapézaival vagy parabolaíveivel; jobb oldalon a hiba abszolút értéke n függvényében log–log skálán"></svg>
<p class="small">Számított értékek, nem mérés. Pontos érték π/4 ≈ 0,785398. n = 4: M_4 = 0,786700, T_4 = 0,782794, S_4 = 0,785392; n = 8-nál a Simpson-hiba ≈ 3,8·10^−8. A log–log grafikon meredeksége a hibarendet mutatja (M, T: h², S: h⁴).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const F = x => 1 / (1 + x * x), EX = Math.PI / 4;
const METH = {
  M: n => { const h = 1 / n; let s = 0; for (let k = 1; k <= n; k++) s += F((k - 0.5) * h); return h * s; },
  T: n => { const h = 1 / n; let s = (F(0) + F(1)) / 2; for (let k = 1; k < n; k++) s += F(k * h); return h * s; },
  S: n => { const h = 1 / n; let s = F(0) + F(1); for (let k = 1; k < n; k++) s += (k % 2 ? 4 : 2) * F(k * h); return h / 3 * s; }
};
const NAME = {M: "középpont", T: "trapéz", S: "Simpson"}, SYM = {M: "M", T: "T", S: "S"};
let meth = "T"; const seen = {M: new Set(), T: new Set(), S: new Set()};
const sci = v => { if (v === 0) return "0"; const ex = Math.floor(Math.log10(Math.abs(v))), m = v / Math.pow(10, ex); return fmt(m, 2) + "·10^" + String(ex).replace("-", "−"); };
function curN(){ let n = +$("n").value; if (meth === "S" && n % 2) { n += n < 32 ? 1 : -1; $("n").value = n; } return n; }
function draw(){
  const n = curN(); $("nv").textContent = n;
  ["M", "T", "S"].forEach(m => $("b" + m).setAttribute("aria-pressed", m === meth ? "true" : "false"));
  seen[meth].add(n);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const L = 40, R = 320, T = 20, B = 290, X = u => L + (R - L) * u, Y = v => B - (B - T) * v / 1.1;
  const df = document.createElementNS(NS, "defs");
  df.innerHTML = '<pattern id="pt" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="' + css("--cellhl") + '"/><circle cx="2.5" cy="2.5" r="0.8" fill="' + fg + '"/></pattern><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="' + css("--cellhl") + '"/><line x1="0" y1="0" x2="0" y2="6" stroke="' + fg + '" stroke-width="1"/></pattern>';
  svg.appendChild(df);
  const h = 1 / n;
  if (meth === "M") for (let k = 0; k < n; k++) { const m = (k + 0.5) * h; el("rect", {x: X(k * h), y: Y(F(m)), width: X(h) - X(0), height: Y(0) - Y(F(m)), fill: "url(#pt)", stroke: fg, "stroke-width": 0.8}); el("circle", {cx: X(m), cy: Y(F(m)), r: 2.5, fill: fg}); }
  if (meth === "T") for (let k = 0; k < n; k++) { const a = k * h, b = a + h; el("polygon", {points: X(a) + "," + Y(0) + " " + X(a) + "," + Y(F(a)) + " " + X(b) + "," + Y(F(b)) + " " + X(b) + "," + Y(0), fill: "url(#ht)", stroke: fg, "stroke-width": 0.8}); el("line", {x1: X(a), y1: Y(F(a)), x2: X(b), y2: Y(F(b)), stroke: hl, "stroke-width": 1.8, "stroke-dasharray": "5 3"}); }
  if (meth === "S") for (let j = 0; j < n; j += 2) {
    const a = j * h, c = a + h, b = a + 2 * h, fa = F(a), fc = F(c), fb = F(b);
    const P = u => fa * (u - c) * (u - b) / ((a - c) * (a - b)) + fc * (u - a) * (u - b) / ((c - a) * (c - b)) + fb * (u - a) * (u - c) / ((b - a) * (b - c));
    let d = "M" + X(a) + "," + Y(0); for (let i = 0; i <= 30; i++) { const u = a + 2 * h * i / 30; d += "L" + X(u).toFixed(1) + "," + Y(P(u)).toFixed(1); } d += "L" + X(b) + "," + Y(0) + "Z";
    el("path", {d: d, fill: "url(#ht)", stroke: hl, "stroke-width": 2});
  }
  let d = ""; for (let i = 0; i <= 200; i++) { const u = i / 200; d += (i ? "L" : "M") + X(u).toFixed(1) + "," + Y(F(u)).toFixed(1); }
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 1.4});
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: mu}); el("line", {x1: L, y1: B, x2: L, y2: T, stroke: mu});
  [0, 0.5, 1].forEach(u => el("text", {x: X(u), y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(u, u % 1 ? 1 : 0)));
  [0, 0.5, 1].forEach(v => el("text", {x: L - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(v, v % 1 ? 1 : 0)));
  el("text", {x: L + 4, y: T - 4, "font-size": 12}, NAME[meth] + "-szabály, y = 1/(1+x²)");
  // log–log hibagrafikon: n ∈ [2, 32], |hiba| ∈ [1e-12, 1e-1]
  const L2 = 370, R2 = 548, lx = q => L2 + (R2 - L2) * (Math.log2(q) - 1) / 4, ly = v => B - (B - T) * (Math.log10(Math.max(v, 1e-13)) + 12) / 11;
  [2, 4, 8, 16, 32].forEach(q => el("text", {x: lx(q), y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, String(q)));
  [-12, -9, -6, -3].forEach(e => { el("line", {x1: L2, y1: ly(Math.pow(10, e)), x2: R2, y2: ly(Math.pow(10, e)), stroke: css("--grid")}); el("text", {x: L2 - 4, y: ly(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, "10^" + String(e).replace("-", "−")); });
  el("line", {x1: L2, y1: B, x2: R2, y2: B, stroke: mu}); el("line", {x1: L2, y1: B, x2: L2, y2: T, stroke: mu});
  const shape = {M: "circle", T: "rect", S: "tri"};
  ["M", "T", "S"].forEach(m => {
    const pts = [...seen[m]].sort((a, b) => a - b);
    if (pts.length > 1) el("polyline", {points: pts.map(q => lx(q) + "," + ly(Math.abs(EX - METH[m](q)))).join(" "), fill: "none", stroke: m === meth ? fg : mu, "stroke-dasharray": m === "M" ? "2 3" : (m === "T" ? "6 3" : "")});
    pts.forEach(q => { const cx = lx(q), cy = ly(Math.abs(EX - METH[m](q))), on = m === meth && q === n, col = on ? hl : (m === meth ? fg : mu);
      if (shape[m] === "circle") el("circle", {cx: cx, cy: cy, r: on ? 5 : 3.5, fill: col});
      else if (shape[m] === "rect") el("rect", {x: cx - (on ? 5 : 3.5), y: cy - (on ? 5 : 3.5), width: on ? 10 : 7, height: on ? 10 : 7, fill: col});
      else el("polygon", {points: cx + "," + (cy - 5) + " " + (cx - 4.5) + "," + (cy + 4) + " " + (cx + 4.5) + "," + (cy + 4), fill: col}); });
  });
  el("text", {x: L2, y: T - 4, "font-size": 12}, "|hiba| (log–log): ● M  ■ T  ▲ S");
  el("text", {x: (L2 + R2) / 2, y: B + 30, "text-anchor": "middle", "font-size": 12}, "n");
  const v = METH[meth](n), e = EX - v;
  $("status").textContent = "n = " + n + ", " + SYM[meth] + "_" + n + " = " + fmt(v, 6) + ", hiba (π/4 − közelítő) = " + (Math.abs(e) < 1e-4 ? sci(e) : fmt(e, 6)) + (meth === "S" ? "  (Simpson: csak páros n)" : "");
}
["M", "T", "S"].forEach(m => $("b" + m).addEventListener("click", () => { meth = m; draw(); }));
$("n").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
