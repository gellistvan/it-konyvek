<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az integrálási sorrend cseréje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020;--lev:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a;--lev:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.box{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.box span{display:block;padding:0 4px}
pre.box span.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Sorrend és metszet">
  <label><input type="radio" name="md" id="mx" checked> x-normál (dy dx)</label>
  <label><input type="radio" name="md" id="my"> y-normál (dx dy)</label>
  <label for="c">metszet helye:</label><input id="c" type="range" min="0" max="1" step="0.01" value="0.4" aria-label="A metszet helye"><b id="cv" style="min-width:3em"></b>
  <button id="play">▶ Söprés</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="A háromszög tartomány függőleges vagy vízszintes metszettel, mellette a belső integrál grafikonja a felhalmozott területtel"></svg>

<p class="small">D = {0 ≤ x ≤ 1, x ≤ y ≤ 1}. Mindkét sorrendben ugyanaz a végérték: (e − 1)/2 ≈ 0,859. Az x-normál sorrend belső integrálját (e^{y²} primitív függvénye nem elemi) itt numerikusan (Simpson-szabállyal) számoljuk. A söprés egyszer végigmegy a tartományon, majd megáll. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function nf(x, d){ let s = fmt(x, d === undefined ? 4 : d); if (s.indexOf(",") >= 0) s = s.replace(/0+$/, "").replace(/,$/, ""); return s; }
const $ = id => document.getElementById(id);


let MODE = "x", C = 0.4, timer = null;
const E2 = t => Math.exp(t * t);
function simpson(g, a, b, n){ if (b <= a) return 0; n = n || 200; const h = (b - a) / n; let s = g(a) + g(b); for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * g(a + i * h); return s * h / 3; }
const inner = c => MODE === "x" ? simpson(E2, c, 1, 200) : c * E2(c);     // a belső integrál értéke a külső változó c értékénél
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const L = 40, T = 20, S = 230, X = v => L + S * v, Y = v => T + S - S * v;
  el("defs", {}).innerHTML = '<pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="' + mu + '" stroke-width="1"/></pattern>';
  el("polygon", {points: [X(0), Y(0), X(0), Y(1), X(1), Y(1)].join(","), fill: "url(#h)", stroke: fg, "stroke-width": 1.2});
  ["0", "0,5", "1"].forEach((t, k) => { el("text", {x: X(k / 2), y: Y(0) + 16, "text-anchor": "middle", "font-size": 11, fill: mu}, t); el("text", {x: L - 6, y: Y(k / 2) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, t); });
  el("text", {x: X(0.62), y: Y(0.5), "font-size": 12}, "y = x");
  let msg;
  if (MODE === "x") {
    el("line", {x1: X(C), y1: Y(C), x2: X(C), y2: Y(1), stroke: hl, "stroke-width": 5});
    el("text", {x: X(C) + 6, y: Y(C) + 14, "font-size": 12}, "alsó: y = x = " + nf(C, 2));
    el("text", {x: X(C), y: Y(1) - 6, "text-anchor": "middle", "font-size": 12}, "felső: y = 1");
    msg = "x = " + nf(C, 2) + ": y ∈ [" + nf(C, 2) + "; 1], belső integrál ∫ e^{y²} dy (y = " + nf(C, 2) + "…1) = " + nf(inner(C), 4);
  } else {
    el("line", {x1: X(0), y1: Y(C), x2: X(C), y2: Y(C), stroke: hl, "stroke-width": 5});
    el("text", {x: X(0) + 4, y: Y(C) - 8, "font-size": 12}, "bal: x = 0");
    el("text", {x: X(C) + 8, y: Y(C) + 4, "font-size": 12}, "jobb: x = y = " + nf(C, 2));
    msg = "y = " + nf(C, 2) + ": x ∈ [0; " + nf(C, 2) + "], belső integrál y·e^{y²} = " + nf(inner(C), 4);
  }
  // a belső integrál grafikonja és a felhalmozott terület
  const L2 = 330, W2 = 210, T2 = 20, H2 = 230, gx = v => L2 + W2 * v, gy = v => T2 + H2 - H2 * v / 3;
  el("rect", {x: L2, y: T2, width: W2, height: H2, fill: "none", stroke: mu});
  [0, 1, 2, 3].forEach(v => el("text", {x: L2 - 4, y: gy(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, String(v)));
  ["0", "0,5", "1"].forEach((t, k) => el("text", {x: gx(k / 2), y: T2 + H2 + 16, "text-anchor": "middle", "font-size": 11, fill: mu}, t));
  const N = 80, pts = [], area = [gx(0) + "," + gy(0)];
  for (let i = 0; i <= N; i++) { const c = i / N, v = inner(c); pts.push(gx(c).toFixed(1) + "," + gy(v).toFixed(1)); if (c <= C + 1e-9) area.push(gx(c).toFixed(1) + "," + gy(v).toFixed(1)); }
  area.push(gx(C).toFixed(1) + "," + gy(inner(C)).toFixed(1), gx(C).toFixed(1) + "," + gy(0));
  el("polygon", {points: area.join(" "), fill: css("--fill"), stroke: "none"});
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("circle", {cx: gx(C), cy: gy(inner(C)), r: 5.5, fill: hl, stroke: fg});
  el("text", {x: L2 + W2 / 2, y: T2 - 6, "text-anchor": "middle", "font-size": 12}, MODE === "x" ? "belső integrál: ∫ₓ¹ e^{y²} dy (x függvényében)" : "belső integrál: y·e^{y²} (y függvényében)");
  const acc = simpson(inner, 0, C, 60);
  el("text", {x: L2 + W2 - 6, y: T2 + 18, "text-anchor": "end", "font-size": 12}, "felhalmozott: " + nf(acc, 4));
  $("cv").textContent = nf(C, 2);
  $("status").textContent = msg + "; eddig felhalmozott külső integrál = " + nf(acc, 4) + (C >= 1 ? "  ⇒ végérték (e − 1)/2 ≈ " + nf((Math.E - 1) / 2, 3) : "");
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Söprés"; }
$("c").addEventListener("input", () => { stopPlay(); C = +$("c").value; draw(); });
$("mx").addEventListener("change", () => { MODE = "x"; C = 0.4; $("c").value = C; draw(); });
$("my").addEventListener("change", () => { MODE = "y"; C = 0.7; $("c").value = C; draw(); });
$("play").addEventListener("click", () => { if (timer) { stopPlay(); return; } C = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { C = Math.min(1, Math.round((C + 0.02) * 100) / 100); $("c").value = C; draw(); if (C >= 1) stopPlay(); }, 80); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
