<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alsó és felső összeg finomítása: x² a [0, 1]-en</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Egyenletes felosztás">
  <label for="n">n =</label><input id="n" type="range" min="1" max="100" step="1" value="4" aria-label="részintervallumok száma"><b id="nv"></b>
</div>
<div class="ctl" role="group" aria-label="Finomítás">
  <label><input id="add" type="checkbox"> „pont hozzáadása” mód: kattints a rajzra egy új osztópontért</label>
  <label for="xp">vagy x =</label><input id="xp" type="number" min="0.001" max="0.999" step="0.001" value="0.3" aria-label="új osztópont helye">
  <button id="addb">Pont hozzáadása</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 335" role="img" aria-label="Az x négyzet grafikonja alatt a beírt téglalapok sraffozva, fölöttük a felső összeg többlete pontozva; a felosztás csúszkával és új osztópontokkal finomítható"></svg>
<p class="small">Számított értékek. Egyenletes felosztásnál s_n = (n − 1)(2n − 1)/(6n²), S_n = (n + 1)(2n + 1)/(6n²), a rés 1/n; n = 4: 0,21875 / 0,46875, n = 10: 0,285 / 0,385, n = 100: 0,32835 / 0,33835. Új osztópont hozzáadásakor a két megváltozott sáv kiemelve: s nem csökken, S nem nő.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let P = [], last = null, hlI = -1;
const L = 50, R = 545, T = 15, B = 315, X = x => L + (R - L) * x, Y = y => B - (B - T) * y / 1.02;
function uni(n){ const a = []; for (let k = 0; k <= n; k++) a.push(k / n); return a; }
function sums(P){ let s = 0, S = 0; for (let i = 0; i + 1 < P.length; i++) { const a = P[i], b = P[i + 1]; s += (b - a) * a * a; S += (b - a) * b * b; } return [s, S]; }
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  for (let i = 0; i + 1 < P.length; i++) {
    const a = P[i], b = P[i + 1];
    const on = (i === hlI || i === hlI + 1) && hlI >= 0;
    el("rect", {x: X(a), y: Y(a * a), width: X(b) - X(a), height: Y(0) - Y(a * a), fill: "url(#hat)", stroke: on ? hl : fg, "stroke-width": on ? 2.4 : 0.8});
    el("rect", {x: X(a), y: Y(b * b), width: X(b) - X(a), height: Y(a * a) - Y(b * b), fill: "url(#dots)", stroke: on ? hl : fg, "stroke-width": on ? 2.4 : 0.8});
  }
  let d = ""; for (let i = 0; i <= 200; i++) { const x = i / 200; d += (i ? "L" : "M") + X(x).toFixed(1) + "," + Y(x * x).toFixed(1); }
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 2.6});
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: mu}); el("line", {x1: L, y1: B, x2: L, y2: T, stroke: mu});
  [0, 0.25, 0.5, 0.75, 1].forEach(t => { el("text", {x: X(t), y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(t, 2)); el("text", {x: L - 5, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(t, 2)); });
  el("text", {x: L + 8, y: T + 14, "font-size": 12}, "sraffozott: alsó összeg s(f,P)"); el("text", {x: L + 8, y: T + 30, "font-size": 12}, "pontozott: többlet S(f,P) − s(f,P)"); el("text", {x: L + 8, y: T + 46, "font-size": 12}, "vastag görbe: y = x²");
  const [s, S] = sums(P), n = P.length - 1;
  let msg = "Felosztás " + n + " részintervallummal: s(f,P) = " + fmt(s, 5) + ", S(f,P) = " + fmt(S, 5) + ", rés " + fmt(S - s, 5) + " (pontos érték 1/3 ≈ 0,33333)";
  if (last) msg += ". Az új pont után s " + fmt(last[0], 5) + " → " + fmt(s, 5) + " (nőtt), S " + fmt(last[1], 5) + " → " + fmt(S, 5) + " (csökkent) – finomítási lemma.";
  $("status").textContent = msg;
}
function defs(){
  const fg = css("--fg");
  const df = document.createElementNS(NS, "defs");
  df.innerHTML = '<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="' + css("--cellhl") + '"/><line x1="0" y1="0" x2="0" y2="6" stroke="' + fg + '" stroke-width="1"/></pattern>' +
    '<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="' + fg + '"/></pattern>';
  svg.appendChild(df);
}
const origDraw = draw;
function redraw(){ origDraw(); defs(); }
function setN(n){ P = uni(n); last = null; hlI = -1; $("nv").textContent = n; redraw(); }
function addPoint(x){
  x = Math.round(x * 1000) / 1000; if (!(x > 0 && x < 1) || P.some(p => Math.abs(p - x) < 1e-9)) return;
  last = sums(P); P.push(x); P.sort((a, b) => a - b); hlI = P.indexOf(x) - 1; redraw();
}
$("n").addEventListener("input", () => setN(+$("n").value));
$("addb").addEventListener("click", () => addPoint(+$("xp").value));
svg.addEventListener("click", ev => { if (!$("add").checked) return; const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); addPoint((q.x - L) / (R - L)); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
setN(4);

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
