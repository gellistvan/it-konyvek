<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagrange-korlát és tényleges hiba: e^x ≈ T_n(x)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="eps">küszöb ε = 10^</label><input id="eps" type="range" min="-10" max="-2" step="1" value="-6" aria-label="a hibaküszöb kitevője"><b id="epsv"></b>
</div>
<div class="ctl" role="group" aria-label="A közelítés helye">
  <label for="x">x =</label><input id="x" type="range" min="0.1" max="2" step="0.1" value="1" aria-label="x, ahol e^x-et közelítjük"><b id="xv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="Két csökkenő sorozat logaritmikus skálán: a 3^x·x^(n+1)/(n+1)! korlát és az e^x − T_n(x) tényleges hiba, vízszintes küszöbvonallal; a küszöb alatti első n kiemelve"></svg>
<p class="small">Számított értékek, nem mérés. M = 3^x, mert a [0, x]-en |f^(n+1)(t)| = e^t ≤ e^x &lt; 3^x. Kezdőállapot (x = 1, ε = 10^−6): legkisebb n = 9, azaz 10 tag; a korlát 8,27·10^−7, a tényleges hiba 3,03·10^−7.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const fact = n => { let p = 1; for (let i = 2; i <= n; i++) p *= i; return p; };
const bnd = (n, x) => Math.pow(3, x) * Math.pow(x, n + 1) / fact(n + 1);
const act = (n, x) => { let s = 0; for (let k = 0; k <= n; k++) s += Math.pow(x, k) / fact(k); return Math.abs(Math.exp(x) - s); };
const sci = v => { if (v === 0) return "0"; const ex = Math.floor(Math.log10(v)), m = v / Math.pow(10, ex); return fmt(m, 2) + "·10^" + String(ex).replace("-", "−"); };
function draw(){
  const ee = +$("eps").value, x = +$("x").value, eps = Math.pow(10, ee);
  $("epsv").textContent = String(ee).replace("-", "−"); $("xv").textContent = fmt(x, 1);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const L = 62, R = 545, T = 12, Bt = 320, NMAX = 16, YLO = -16, YHI = 2;
  const X = n => L + (R - L) * (n - 0.5) / NMAX, Y = v => { const l = Math.max(YLO, Math.min(YHI, Math.log10(Math.max(v, 1e-300)))); return Bt - (Bt - T) * (l - YLO) / (YHI - YLO); };
  for (let p = YLO; p <= YHI; p += 2) { el("line", {x1: L, y1: Y(Math.pow(10, p)), x2: R, y2: Y(Math.pow(10, p)), stroke: css("--grid")}); el("text", {x: L - 5, y: Y(Math.pow(10, p)) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, "10^" + String(p).replace("-", "−")); }
  for (let n = 1; n <= NMAX; n++) el("text", {x: X(n), y: Bt + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, String(n));
  el("text", {x: (L + R) / 2, y: Bt + 32, "text-anchor": "middle", "font-size": 12}, "fokszám n (n+1 tag)");
  el("line", {x1: L, y1: Y(eps), x2: R, y2: Y(eps), stroke: fg, "stroke-dasharray": "2 4", "stroke-width": 1.6});
  const pb = [], pa = [];
  for (let n = 1; n <= NMAX; n++) { pb.push(X(n) + "," + Y(bnd(n, x))); pa.push(X(n) + "," + Y(act(n, x))); }
  el("polyline", {points: pb.join(" "), fill: "none", stroke: fg, "stroke-width": 1.8});
  el("polyline", {points: pa.join(" "), fill: "none", stroke: mu, "stroke-width": 1.6, "stroke-dasharray": "7 4"});
  let nmin = -1; for (let n = 1; n <= 40; n++) if (bnd(n, x) <= eps) { nmin = n; break; }
  for (let n = 1; n <= NMAX; n++) {
    el("rect", {x: X(n) - 4, y: Y(bnd(n, x)) - 4, width: 8, height: 8, fill: css("--bg"), stroke: fg, "stroke-width": 1.4});
    el("circle", {cx: X(n), cy: Y(act(n, x)), r: 3.8, fill: mu, stroke: fg});
  }
  if (nmin >= 1 && nmin <= NMAX) { el("rect", {x: X(nmin) - 9, y: Y(bnd(nmin, x)) - 9, width: 18, height: 18, fill: "none", stroke: hl, "stroke-width": 2.4}); el("circle", {cx: X(nmin), cy: Y(act(nmin, x)), r: 9, fill: "none", stroke: hl, "stroke-width": 2.4}); }
  el("text", {x: R, y: T + 12, "text-anchor": "end", "font-size": 12}, "□— korlát 3^x·x^(n+1)/(n+1)!    ●- - tényleges hiba |e^x − T_n(x)|    ··· küszöb");
  $("status").textContent = nmin < 0 ? "Nincs megfelelő n ≤ 40." :
    "x = " + fmt(x, 1) + ", küszöb 10^" + String(ee).replace("-", "−") + ": legkisebb n = " + nmin + " (" + (nmin + 1) + " tag), korlát " + sci(bnd(nmin, x)) + ", tényleges hiba " + sci(act(nmin, x));
}
["eps", "x"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
