<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Dirac-impulzus négyszög-közelítése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Az impulzus szélessége">
  <label for="e">ε =</label><input id="e" type="range" min="0" max="16" step="1" value="0" aria-label="ε logaritmikus lépésekben 1 és 0,02 között"><b id="ev"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Egységnyi területű négyszögimpulzus és Laplace-transzformáltja; az impulzus szélessége csúszkával állítható"></svg>
<p class="small">Számított görbék (modell). Szaggatott szürke: ε = 1; 0,5; 0,25; 0,1 (a statikus ábra). A csúszka logaritmikus, ε = 1-től 0,02-ig; kezdőállapot ε = 1. Ellenőrzés: ε = 0,1-nél L(5) = 0,7869, ε = 0,02-nél 0,9516.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

// panel: {x0,y0,w,h} pixeles doboz; xr/yr: [min,max]; visszaad: {X, Y, g}
function panel(b, xr, yr, xt, yt, xl, yl, opt){
  opt = opt || {};
  const X = x => b.x0 + b.w * (x - xr[0]) / (xr[1] - xr[0]);
  const Y = opt.logy ? (y => b.y0 + b.h - b.h * (Math.log10(Math.max(y, 1e-300)) - Math.log10(yr[0])) / (Math.log10(yr[1]) - Math.log10(yr[0])))
                     : (y => b.y0 + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]));
  const mu = css("--muted"), gr = css("--grid");
  (xt || []).forEach(t => { el("line", {x1: X(t), y1: b.y0, x2: X(t), y2: b.y0 + b.h, stroke: gr});
    el("text", {x: X(t), y: b.y0 + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, opt.xf ? opt.xf(t) : fmtn(t)); });
  (yt || []).forEach(t => { el("line", {x1: b.x0, y1: Y(t), x2: b.x0 + b.w, y2: Y(t), stroke: gr});
    el("text", {x: b.x0 - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, opt.yf ? opt.yf(t) : fmtn(t)); });
  el("rect", {x: b.x0, y: b.y0, width: b.w, height: b.h, fill: "none", stroke: mu});
  if (!opt.logy && yr[0] < 0 && yr[1] > 0) el("line", {x1: b.x0, y1: Y(0), x2: b.x0 + b.w, y2: Y(0), stroke: css("--fg"), "stroke-width": 0.8});
  if (xr[0] < 0 && xr[1] > 0) el("line", {x1: X(0), y1: b.y0, x2: X(0), y2: b.y0 + b.h, stroke: css("--fg"), "stroke-width": 0.8});
  if (xl) el("text", {x: b.x0 + b.w, y: b.y0 + b.h + 28, "text-anchor": "end", "font-size": 12}, xl);
  if (yl) el("text", {x: b.x0 + 4, y: b.y0 - 6, "text-anchor": "start", "font-size": 12}, yl);
  return {X, Y, b};
}
function fmtn(v){ let s = (+v.toPrecision(6)).toString(); return s.replace(".", ",").replace("-", "−"); }
// görbe: pts = [[x,y],...] adatkoordinátában; a panel dobozára vágva (szakaszokra bontva)
function curve(P, pts, at){
  const b = P.b, segs = []; let cur = [];
  pts.forEach(([x, y]) => { const px = P.X(x), py = P.Y(y);
    if (isFinite(py) && py >= b.y0 - 1 && py <= b.y0 + b.h + 1 && px >= b.x0 - 1 && px <= b.x0 + b.w + 1) cur.push(px.toFixed(1) + "," + py.toFixed(1));
    else { if (cur.length > 1) segs.push(cur); cur = []; } });
  if (cur.length > 1) segs.push(cur);
  segs.forEach(s => el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)));
}
function sample(f, a, b, n){ const r = []; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; r.push([x, f(x)]); } return r; }

const EPSL = [1, 0.8, 0.6, 0.5, 0.4, 0.3, 0.25, 0.2, 0.15, 0.1, 0.08, 0.06, 0.05, 0.04, 0.03, 0.025, 0.02];
const epsOf = v => EPSL[v];
const L = (s, e) => s === 0 ? 1 : (1 - Math.exp(-s * e)) / (s * e);
function draw(){
  const e = epsOf(+$("e").value);
  $("ev").textContent = fmtn(e);
  svg.innerHTML = "";
  const fg = css("--fg"), c2 = css("--hl2");
  const A = panel({x0: 40, y0: 22, w: 220, h: 250}, [0, 1.2], [0, 52], [0, 0.4, 0.8, 1.2], [0, 10, 20, 30, 40, 50], "t", "");
  el("text", {x: 42, y: 14, "font-size": 12}, "(a) impulzus, terület = 1");
  [1, 0.5, 0.25, 0.1].forEach(q => curve(A, [[0, 0], [0, 1 / q], [q, 1 / q], [q, 0], [1.2, 0]], {stroke: css("--muted"), "stroke-dasharray": "4 3"}));
  const pts = [[0, 0], [0, 1 / e], [e, 1 / e], [e, 0], [1.2, 0]];
  el("polygon", {points: pts.slice(0, 4).map(([x, y]) => A.X(x) + "," + A.Y(Math.min(y, 52))).join(" "), fill: c2, "fill-opacity": 0.25});
  curve(A, pts.map(([x, y]) => [x, Math.min(y, 51.9)]), {stroke: c2, "stroke-width": 2.5});
  const B = panel({x0: 310, y0: 22, w: 240, h: 250}, [0, 10], [0, 1.1], [0, 2, 4, 6, 8, 10], [0, 0.2, 0.4, 0.6, 0.8, 1], "s", "");
  el("text", {x: 312, y: 14, "font-size": 12}, "(b) (1 − e^(−sε))/(sε)");
  curve(B, [[0, 1], [10, 1]], {stroke: fg, "stroke-width": 3});
  curve(B, sample(s => L(s, e), 0, 10, 300), {stroke: c2, "stroke-width": 2.5});
  el("circle", {cx: B.X(5), cy: B.Y(L(5, e)), r: 5, fill: c2});
  $("status").textContent = "ε = " + fmtn(e) + " (magasság 1/ε = " + fmt(1 / e, 2) + ", terület 1), L(s=5) = (1 − e^(−5ε))/(5ε) = " + fmt(L(5, e), 4);
}
$("e").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
