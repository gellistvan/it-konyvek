<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Föld görbülete és a látóhatár</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="(a) távolság az érintő mentén">
  <label for="d">(a) d =</label><input id="d" type="range" min="0" max="50" step="0.5" value="1" aria-label="d kilométerben"><b id="dv"></b>
</div>
<div class="ctl" role="group" aria-label="(b) megfigyelő magassága">
  <label for="h">(b) h =</label><input id="h" type="range" min="0" max="500" step="0.1" value="1.7" aria-label="h méterben"><b id="hv"></b>
  <label><input id="dist" type="checkbox" checked> torzított (nem méretarányos) rajz</label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 240" role="img" aria-label="Két kördiagram: (a) az érintő és a kör közötti függőleges lejtés h(d) a d távolságnál; (b) a h magasan álló megfigyelő látóvonala, amely érinti a kört"></svg>
<p class="small">R = 6371 km gömbmodell, számított értékek. Ellenőrzés: d = 1 km → 7,85 cm, d = 2 km → 31,4 cm; h = 1,7 m → 4,65 km, h = 50 m → 25,2 km. A torzított rajzban a sugár a csúszkaértékhez igazodik, hogy a háromszögek láthatók legyenek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const RE = 6371;   // km
function panel(cx, title){ el("text", {x: cx, y: 18, "text-anchor": "middle", "font-size": 13}, title); }
function draw(){
  const d = +$("d").value, hm = +$("h").value, hk = hm / 1000, dist = $("dist").checked;
  $("dv").textContent = fmt(d, 1) + " km"; $("hv").textContent = fmt(hm, 1) + " m";
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  // rajzi sugár (képpont-egységben 120) és a világ→rajz arány: torzított módban R' úgy, hogy az ábra látható legyen
  const RP = 120;
  // (a) panel
  const ra = dist ? Math.max(d / 0.6, 1e-9) : RE;   // a rajzon d/ra arányt használunk
  const ua = Math.min(d / ra, 0.95);
  let ox = 140, oy = 205;
  const Pa = (x, y) => [ox + RP * x, oy - RP * y];
  let path = ""; for (let i = 0; i <= 120; i++) { const t = Math.PI * i / 120, p = Pa(Math.cos(t), Math.sin(t)); path += (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }
  el("path", {d: path, fill: "none", stroke: fg, "stroke-width": 1.3});
  const yq = Math.sqrt(1 - ua * ua);
  let p0 = Pa(0, 0), pP = Pa(0, 1), pQ = Pa(ua, 1), pQp = Pa(ua, yq), pF = Pa(0, yq);
  el("line", {x1: Pa(-0.25, 1)[0], y1: pP[1], x2: Pa(1.05, 1)[0], y2: pP[1], stroke: fg, "stroke-width": 2.6});
  el("line", {x1: p0[0], y1: p0[1], x2: pP[0], y2: pP[1], stroke: mu});
  el("line", {x1: p0[0], y1: p0[1], x2: pQp[0], y2: pQp[1], stroke: mu});
  el("line", {x1: pF[0], y1: pF[1], x2: pQp[0], y2: pQp[1], stroke: mu, "stroke-dasharray": "4 3"});
  el("line", {x1: pQ[0], y1: pQ[1], x2: pQp[0], y2: pQp[1], stroke: hl, "stroke-width": 3, "stroke-dasharray": "6 3"});
  [[p0, "O", -6], [pP, "P", -6], [pQ, "Q", -6], [pQp, "Q'", 16]].forEach(([p, s, dy]) => { el("circle", {cx: p[0], cy: p[1], r: 3, fill: fg}); el("text", {x: p[0] + 5, y: p[1] + dy, "font-size": 12}, s); });
  el("text", {x: (pP[0] + pQ[0]) / 2, y: pP[1] - 6, "text-anchor": "middle", "font-size": 12}, "d");
  el("text", {x: pQ[0] + 8, y: (pQ[1] + pQp[1]) / 2 + 4, "font-size": 12, fill: hl}, "h(d)");
  panel(140, "(a) lejtés: h(d) = R − √(R² − d²)");
  // (b) panel
  ox = 420;
  const rb = dist ? Math.max(hk / 0.35, 1e-9) : RE;
  const ub = hk / rb;
  path = ""; for (let i = 0; i <= 120; i++) { const t = Math.PI * i / 120, p = Pa(Math.cos(t), Math.sin(t)); path += (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1); }
  el("path", {d: path, fill: "none", stroke: fg, "stroke-width": 1.3});
  const phi = Math.acos(1 / (1 + ub));
  p0 = Pa(0, 0); const pA = Pa(0, 1 + ub), pB = Pa(Math.sin(phi), Math.cos(phi)), pS = Pa(0, 1);
  el("line", {x1: p0[0], y1: p0[1], x2: pS[0], y2: pS[1], stroke: mu});
  el("line", {x1: p0[0], y1: p0[1], x2: pB[0], y2: pB[1], stroke: mu});
  el("line", {x1: pS[0], y1: pS[1], x2: pA[0], y2: pA[1], stroke: hl, "stroke-width": 3, "stroke-dasharray": "6 3"});
  el("line", {x1: pA[0], y1: pA[1], x2: pB[0], y2: pB[1], stroke: fg, "stroke-width": 2.6});
  [[p0, "O"], [pA, "A"], [pB, "B"]].forEach(([p, s]) => { el("circle", {cx: p[0], cy: p[1], r: 3, fill: fg}); el("text", {x: p[0] + 5, y: p[1] - 6, "font-size": 12}, s); });
  el("text", {x: pS[0] - 6, y: (pS[1] + pA[1]) / 2 + 4, "text-anchor": "end", "font-size": 12, fill: hl}, "h");
  el("text", {x: (pA[0] + pB[0]) / 2 + 6, y: (pA[1] + pB[1]) / 2 - 4, "font-size": 12}, "d");
  panel(420, "(b) látóhatár: d = √((R + h)² − R²)");
  el("text", {x: 280, y: 230, "text-anchor": "middle", "font-size": 12, fill: mu}, dist ? "torzított rajz: a sugár nem méretarányos (R = 6371 km)" : "méretarányos rajz: a görbület ezen a skálán alig látszik");
  const ha = d * d / (2 * RE), he = RE - Math.sqrt(RE * RE - d * d), db = Math.sqrt((RE + hk) * (RE + hk) - RE * RE), dba = Math.sqrt(2 * RE * hk);
  const cm = v => fmt(v * 1e5, 2) + " cm", mm = v => v * 1e3 >= 1 ? fmt(v * 1e3, 2) + " m" : cm(v);
  $("status").textContent = "(a) d = " + fmt(d, 1) + " km: h ≈ d²/(2R) = " + mm(ha) + " (pontos R − √(R² − d²) = " + mm(he) + ");   (b) h = " + fmt(hm, 1) + " m: d ≈ √(2Rh) = " + fmt(dba, 2) + " km (pontos " + fmt(db, 2) + " km)";
}
["d", "h"].forEach(id => $(id).addEventListener("input", draw)); $("dist").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
