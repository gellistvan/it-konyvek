<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az ln(1 + x) Taylor-polinomjai és részletösszegei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Fokszám">
  <label for="n">n =</label><input id="n" type="range" min="1" max="40" step="1" value="10" aria-label="a Taylor-polinom fokszáma"><b id="nv"></b>
</div>
<div class="ctl" role="group" aria-label="Kiértékelési pont">
  <label for="x">x =</label><input id="x" type="range" min="-0.95" max="1.6" step="0.05" value="0.5" aria-label="x pont (a bal panelre kattintva is állítható)"><b id="xv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 345" role="img" aria-label="Bal panel: ln(1+x) és a választott fokszámú Taylor-polinom, x = −1 és x = 1 függőleges vonallal; jobb panel: az x = 1-beli részletösszegek az ln 2 körül váltakozva"></svg>
<p class="small">Számított értékek. |x| &lt; 1-en a polinomok a függvényhez tartanak, x &gt; 1-en eltávolodnak (a sor divergens), x = 1-ben a részletösszegek lassan, váltakozva tartanak ln 2-höz; a sáv a Leibniz-becslés |S_n(1) − ln 2| ≤ 1/(n + 1).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const Tn = (n, x) => { let s = 0, p = 1; for (let k = 1; k <= n; k++) { p *= x; s += (k % 2 ? 1 : -1) * p / k; } return s; };
let N = 10, XP = 0.5;
// bal panel: x ∈ [−1,05; 1,6], y ∈ [−3; 2]
const L1 = 48, R1 = 300, T0 = 22, B0 = 300;
const X1 = x => L1 + (R1 - L1) * (x + 1.05) / 2.65, Y1 = y => B0 - (B0 - T0) * (y + 3) / 5;
// jobb panel: n ∈ [0; 41], y ∈ [0,4; 1,05]
const L2 = 350, R2 = 550;
const X2 = n => L2 + (R2 - L2) * n / 41, Y2 = y => B0 - (B0 - T0) * (y - 0.4) / 0.65;
function curve(g, a, b, X, Y, ylo, yhi, at){ let d = "", pen = false; for (let i = 0; i <= 300; i++) { const x = a + (b - a) * i / 300, y = g(x); if (y > ylo && y < yhi && isFinite(y)) { d += (pen ? "L" : "M") + X(x).toFixed(1) + "," + Y(y).toFixed(1); pen = true; } else pen = false; } el("path", Object.assign({d: d, fill: "none"}, at)); }
function draw(){
  $("nv").textContent = N; $("xv").textContent = fmt(XP, 2);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2"), gr = css("--grid");
  el("rect", {x: X1(1), y: T0, width: X1(1.6) - X1(1), height: B0 - T0, fill: css("--fill")});
  el("line", {x1: L1, y1: Y1(0), x2: R1, y2: Y1(0), stroke: mu});
  [-1, -0.5, 0, 0.5, 1, 1.5].forEach(t => el("text", {x: X1(t), y: B0 + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(t, t % 1 ? 1 : 0)));
  [-3, -2, -1, 0, 1, 2].forEach(t => el("text", {x: L1 - 5, y: Y1(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(t, 0)));
  [-1, 1].forEach(t => el("line", {x1: X1(t), y1: T0, x2: X1(t), y2: B0, stroke: fg, "stroke-dasharray": "2 3"}));
  curve(x => Math.log(1 + x), -0.999, 1.6, X1, Y1, -3, 2, {stroke: fg, "stroke-width": 3});
  curve(x => Tn(N, x), -1.05, 1.6, X1, Y1, -3, 2, {stroke: hl, "stroke-width": 2, "stroke-dasharray": "8 4"});
  const ty = Tn(N, XP), ly = Math.log(1 + XP);
  el("line", {x1: X1(XP), y1: T0, x2: X1(XP), y2: B0, stroke: mu, "stroke-width": 0.8});
  el("circle", {cx: X1(XP), cy: Y1(ly), r: 4.5, fill: fg});
  if (ty > -3 && ty < 2) el("circle", {cx: X1(XP), cy: Y1(ty), r: 5, fill: css("--bg"), stroke: hl, "stroke-width": 2});
  el("text", {x: L1 + 4, y: T0 - 6, "font-size": 12}, "— ln(1+x)   - - T_" + N + "(x)");
  // jobb panel
  for (let n = 1; n <= 40; n++) { const lo = Math.LN2 - 1 / (n + 1), hi = Math.LN2 + 1 / (n + 1); el("line", {x1: X2(n), y1: Y2(Math.min(hi, 1.05)), x2: X2(n), y2: Y2(Math.max(lo, 0.4)), stroke: gr, "stroke-width": 4}); }
  el("line", {x1: L2, y1: Y2(Math.LN2), x2: R2, y2: Y2(Math.LN2), stroke: fg, "stroke-dasharray": "6 4"});
  el("text", {x: R2, y: Y2(Math.LN2) - 6, "text-anchor": "end", "font-size": 11}, "ln 2 = 0,6931");
  [0.4, 0.6, 0.8, 1].forEach(t => el("text", {x: L2 - 4, y: Y2(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(t, 1)));
  [1, 10, 20, 30, 40].forEach(t => el("text", {x: X2(t), y: B0 + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, String(t)));
  const pts = []; for (let n = 1; n <= N; n++) pts.push(X2(n).toFixed(1) + "," + Y2(Tn(n, 1)).toFixed(1));
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 1});
  for (let n = 1; n <= N; n++) el("circle", {cx: X2(n), cy: Y2(Tn(n, 1)), r: n === N ? 5 : 2.6, fill: n === N ? hl : fg});
  el("text", {x: L2, y: T0 - 6, "font-size": 12}, "S_n(1), szürke sáv: ln 2 ± 1/(n+1)");
  el("text", {x: (L1 + R1) / 2, y: B0 + 32, "text-anchor": "middle", "font-size": 12}, "x (kattints a panelre)");
  el("text", {x: (L2 + R2) / 2, y: B0 + 32, "text-anchor": "middle", "font-size": 12}, "n");
  const zone = XP > 1 ? " (x > 1: a sor divergens)" : (XP <= -1 ? "" : " (|x| < 1: konvergens)");
  $("status").textContent = "n = " + N + ", x = " + fmt(XP, 2) + ": T_" + N + "(" + fmt(XP, 2) + ") = " + fmt(ty, 6) + ", ln(1 + x) = " + fmt(ly, 6) + ", hiba " + fmt(Math.abs(ty - ly), 6) + zone + ";   S_" + N + "(1) = " + fmt(Tn(N, 1), 4);
}
$("n").addEventListener("input", () => { N = +$("n").value; draw(); });
$("x").addEventListener("input", () => { XP = +$("x").value; draw(); });
svg.addEventListener("click", ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); if (q.x < L1 || q.x > R1) return; let x = -1.05 + 2.65 * (q.x - L1) / (R1 - L1); x = Math.max(-0.95, Math.min(1.6, Math.round(x * 20) / 20)); XP = x; $("x").value = x; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
