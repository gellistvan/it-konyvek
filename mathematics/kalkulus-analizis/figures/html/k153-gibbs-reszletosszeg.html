<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibbs-jelenség: a négyszögjel részletösszegei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Részletösszeg rendje">
  <label for="nn">N =</label><input id="nn" type="range" min="1" max="99" step="2" value="5" aria-label="A részletösszeg legnagyobb páratlan indexe"><b id="nv"></b>
  <label><input id="cmp" type="checkbox" checked> N = 15 összevetésként</label>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="A négyszögjel N-edik Fourier-részletösszege; a szakadás melletti túllövés N növelésével sem tűnik el"></svg>
<p class="small">Számított értékek: S_N(t) = (4/π)·Σ sin(nt)/n a páratlan n ≤ N-re. A csúcs magassága N → ∞ esetén (2/π)·Si(π) ≈ 1,179-hez tart (az ugrás kb. 8,95%-a), helye t = π/(N + 1) → 0: a konvergencia a szakadás környezetében nem egyenletes.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let N = 5;
const S = (N, t) => { let s = 0; for (let n = 1; n <= N; n += 2) s += Math.sin(n*t)/n; return 4/Math.PI*s; };
function draw(){
  $("nv").textContent = N;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const L = 40, R = 550, T = 10, B = 300, X = t => L + (R-L)*(t + Math.PI)/(2*Math.PI), Y = y => B - (B-T)*(y + 1.45)/3.0;
  [-1, -0.5, 0, 0.5, 1].forEach(y => { el("line",{x1:L,y1:Y(y),x2:R,y2:Y(y),stroke:css("--grid")}); el("text",{x:L-5,y:Y(y)+4,"text-anchor":"end","font-size":11,fill:mu},fmt(y,1)); });
  [["−π",-Math.PI],["−π/2",-Math.PI/2],["0",0],["π/2",Math.PI/2],["π",Math.PI]].forEach(([s,t]) => el("text",{x:X(t),y:B+16,"text-anchor":"middle","font-size":11,fill:mu},s));
  el("line",{x1:X(0),y1:T,x2:X(0),y2:B,stroke:mu});
  [1.179, -1.179].forEach(y => el("line",{x1:L,y1:Y(y),x2:R,y2:Y(y),stroke:fg,"stroke-dasharray":"2 3"}));
  el("text",{x:L+4,y:Y(1.179)-5,"font-size":11},"±1,179 (Gibbs-határ)");
  el("polyline",{points:[X(-Math.PI),Y(-1),X(0),Y(-1)].join(" "),stroke:mu,"stroke-width":4,fill:"none"});
  el("polyline",{points:[X(0),Y(1),X(Math.PI),Y(1)].join(" "),stroke:mu,"stroke-width":4,fill:"none"});
  const curve = (M, at) => { const p = []; const K = 1600; for (let i = 0; i <= K; i++){ const t = -Math.PI + 2*Math.PI*i/K; p.push(X(t).toFixed(1)+","+Y(S(M,t)).toFixed(1)); } el("polyline", Object.assign({points:p.join(" "),fill:"none"}, at)); };
  if ($("cmp").checked && N !== 15) curve(15, {stroke:mu,"stroke-width":1.3,"stroke-dasharray":"6 4"});
  curve(N, {stroke:css("--hl2"),"stroke-width":2});
  const tp = Math.PI/(N+1), vp = S(N, tp);
  el("circle",{cx:X(tp),cy:Y(vp),r:5,fill:css("--bg"),stroke:fg,"stroke-width":2});
  el("text",{x:R-2,y:B-8,"text-anchor":"end","font-size":12},"━ f(t) = sign t   — S_N   " + ($("cmp").checked && N !== 15 ? "– – S₁₅" : ""));
  $("status").textContent = "N = " + N + ": az első csúcs t = π/(N+1) ≈ " + fmt(tp,3) + "-nál, S_N = " + fmt(vp,3) +
    " (túllövés " + fmt(vp-1,3) + ", az ugrás " + fmt((vp-1)/2*100,1) + "%-a); S_N(1) = " + fmt(S(N,1),3);
}
$("nn").addEventListener("input", () => { N = +$("nn").value; draw(); });
$("cmp").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
