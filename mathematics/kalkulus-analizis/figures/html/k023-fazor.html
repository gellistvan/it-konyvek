<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgó fázorok és a pillanatérték</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Idő">
  <label for="wt">ωt =</label><input id="wt" type="range" min="0" max="480" step="1" value="40" aria-label="omega t, 0 és 4π között, π/120-os lépésekben"><b id="wtv"></b>
  <button id="play">▶ Lejátszás</button>
</div>
<div class="ctl" role="group" aria-label="1. fázor">
  <label for="a1">A₁ =</label><input id="a1" type="range" min="0" max="5" step="0.1" value="3"><b id="a1v"></b>
  <label for="f1">φ₁ =</label><input id="f1" type="range" min="-180" max="180" step="5" value="0"><b id="f1v"></b>
</div>
<div class="ctl" role="group" aria-label="2. fázor">
  <label for="a2">A₂ =</label><input id="a2" type="range" min="0" max="5" step="0.1" value="4"><b id="a2v"></b>
  <label for="f2">φ₂ =</label><input id="f2" type="range" min="-180" max="180" step="5" value="-90"><b id="f2v"></b>
  <button id="rst">Könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Bal: két forgó fázor és eredőjük a komplex síkon, az eredő vetülete a valós tengelyen; jobb: a két harmonikus jel és összegük az idő függvényében"></svg>
<p class="small">x₁ = A₁cos(ωt + φ₁), x₂ = A₂cos(ωt + φ₂); a fázorok A₁e^{iφ₁} és A₂e^{iφ₂}. A könyv példája: 3 és −4i (φ₂ = −90°, azaz x₂ = 4 sin ωt), eredő 3 − 4i = 5e^{−0,927i}. A lejátszás egyszer fut végig 0-tól 4π-ig, majd megáll. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let wt = Math.PI / 3, A1 = 3, F1 = 0, A2 = 4, F2 = -90, timer = null;
const rad = d => d * Math.PI / 180;
function piS(x){ const q = x / Math.PI; for (const d of [1, 2, 3, 4, 6]) { const m = Math.round(q * d); if (Math.abs(q * d - m) < 2e-3) { if (m === 0) return "0"; const g = (a, b) => b ? g(b, a % b) : a, c = g(m, d); const M = m / c, D = d / c; return (M === 1 ? "" : String(M)) + "π" + (D === 1 ? "" : "/" + D); } } return fmt(x, 2); }
function draw(){
  $("wtv").textContent = piS(wt); $("a1v").textContent = fmt(A1, 1); $("a2v").textContent = fmt(A2, 1); $("f1v").textContent = F1 + "°"; $("f2v").textContent = F2 + "°";
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const c1 = [A1 * Math.cos(wt + rad(F1)), A1 * Math.sin(wt + rad(F1))], c2 = [A2 * Math.cos(wt + rad(F2)), A2 * Math.sin(wt + rad(F2))];
  const cr = [c1[0] + c2[0], c1[1] + c2[1]], M = Math.max(5.5, A1 + A2 + 0.3);
  // bal panel
  const CX = 130, CY = 160, S = 118 / M, X = x => CX + S * x, Y = y => CY - S * y;
  el("line", {x1: X(-M), y1: CY, x2: X(M), y2: CY, stroke: mu}); el("line", {x1: CX, y1: Y(M), x2: CX, y2: Y(-M), stroke: mu});
  el("text", {x: X(M) - 2, y: CY - 5, "text-anchor": "end", "font-size": 11, fill: mu}, "Re"); el("text", {x: CX + 4, y: Y(M) + 10, "font-size": 11, fill: mu}, "Im");
  const arrow = (x0, y0, x1, y1, w, dash) => { el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: fg, "stroke-width": w, "stroke-dasharray": dash || ""});
    const a = Math.atan2(Y(y1) - Y(y0), X(x1) - X(x0)), h = 9; el("polygon", {points: [[X(x1), Y(y1)], [X(x1) - h * Math.cos(a - 0.4), Y(y1) - h * Math.sin(a - 0.4)], [X(x1) - h * Math.cos(a + 0.4), Y(y1) - h * Math.sin(a + 0.4)]].map(p => p.join(",")).join(" "), fill: fg}); };
  arrow(0, 0, c1[0], c1[1], 1.8); arrow(c1[0], c1[1], cr[0], cr[1], 1.8, "6 4"); arrow(0, 0, cr[0], cr[1], 3.5);
  el("line", {x1: X(cr[0]), y1: Y(cr[1]), x2: X(cr[0]), y2: CY, stroke: css("--hl2"), "stroke-width": 1.6, "stroke-dasharray": "2 3"});
  el("circle", {cx: X(cr[0]), cy: CY, r: 5, fill: css("--hl2")});
  el("text", {x: 10, y: 312, "font-size": 11.5}, "— fázor 1   - - fázor 2   ━ eredő");
  // jobb panel
  const L = 285, R = 552, T = 20, B = 300, mid = (T + B) / 2, sy = (B - T) / 2 / M, tx = v => L + (R - L) * v / (4 * Math.PI), ty = v => mid - sy * v;
  el("line", {x1: L, y1: mid, x2: R, y2: mid, stroke: mu}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: mu});
  ["0", "π", "2π", "3π", "4π"].forEach((s, i) => el("text", {x: tx(i * Math.PI), y: B + 14, "text-anchor": "middle", "font-size": 11}, s));
  el("text", {x: R, y: B - 4, "text-anchor": "end", "font-size": 11, fill: mu}, "ωt");
  const curve = (f, at) => { const p = []; for (let i = 0; i <= 300; i++) { const v = 4 * Math.PI * i / 300; p.push(tx(v).toFixed(1) + "," + ty(f(v)).toFixed(1)); } el("polyline", Object.assign({points: p.join(" "), fill: "none", stroke: fg}, at)); };
  curve(v => A1 * Math.cos(v + rad(F1)), {"stroke-width": 1.2});
  curve(v => A2 * Math.cos(v + rad(F2)), {"stroke-width": 1.2, "stroke-dasharray": "6 4"});
  curve(v => A1 * Math.cos(v + rad(F1)) + A2 * Math.cos(v + rad(F2)), {"stroke-width": 3});
  el("line", {x1: tx(wt), y1: T, x2: tx(wt), y2: B, stroke: css("--hl2"), "stroke-width": 1.4, "stroke-dasharray": "2 3"});
  el("circle", {cx: tx(wt), cy: ty(cr[0]), r: 5, fill: css("--hl2")});
  el("text", {x: L + 4, y: T - 6, "font-size": 11.5}, "x₁ = A₁cos(ωt+φ₁)   - - x₂   ━ x₁ + x₂");
  const x1 = c1[0], x2 = c2[0];
  $("status").textContent = "ωt = " + piS(wt) + ", x₁ = " + fmt(x1, 3) + ", x₂ = " + fmt(x2, 3) + ", x₁+x₂ = " + fmt(x1 + x2, 3) +
    ", Re(eredő fázor·e^{iωt}) = " + fmt(cr[0], 3) + "; eredő fázor: " + fmt(Math.hypot(A1 * Math.cos(rad(F1)) + A2 * Math.cos(rad(F2)), A1 * Math.sin(rad(F1)) + A2 * Math.sin(rad(F2))), 3) +
    "·e^{i·" + fmt(Math.atan2(A1 * Math.sin(rad(F1)) + A2 * Math.sin(rad(F2)), A1 * Math.cos(rad(F1)) + A2 * Math.cos(rad(F2))), 3) + "}";
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("wt").addEventListener("input", () => { stopPlay(); wt = +$("wt").value * Math.PI / 120; draw(); });
[["a1", v => A1 = v], ["a2", v => A2 = v], ["f1", v => F1 = v], ["f2", v => F2 = v]].forEach(([id, f]) => $(id).addEventListener("input", () => { f(+$(id).value); draw(); }));
$("rst").addEventListener("click", () => { A1 = 3; F1 = 0; A2 = 4; F2 = -90; $("a1").value = 3; $("f1").value = 0; $("a2").value = 4; $("f2").value = -90; draw(); });
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  if (wt >= 4 * Math.PI - 0.01) wt = 0;
  $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { wt = Math.min(4 * Math.PI, wt + Math.PI / 120); $("wt").value = Math.round(wt * 120 / Math.PI); draw(); if (wt >= 4 * Math.PI) stopPlay(); }, 40);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
