<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pókhálóábra: fixpont-iteráció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="g">g(x) =</label>
<select id="g"><option value="0">√(2 + x)  (p = 2)</option><option value="1">(x + 2/x)/2, babiloni S = 2  (p = √2)</option>
<option value="2">cos x  (p ≈ 0,739085)</option><option value="3">1 + 1/x  (p = aranymetszés ≈ 1,618034)</option></select>
<label for="x0">x₀ =</label><input id="x0" type="range" min="0" max="3" step="0.05" value="0" aria-label="kezdőérték x0"><b id="x0v">0</b></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Pókhálóábra: az y = x egyenes, a g grafikonja, és a lépésenként rajzolt függőleges és vízszintes szakaszok a fixpont felé"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az iteráció xₙ₊₁ = g(xₙ). A √(2+x) rekurzió hibája lépésenként kb. negyedére csökken (lineáris konvergencia), a babiloni módszeré a korábbi hiba nagyságrendileg négyzetére (kvadratikus). A cos x esetén a pókháló spirál (g′(p) < 0), az 1 + 1/x esetén is váltakozva közelít. Számított értékek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "g(x) = √(2+x), x₀ = 0,000000: n = 0, x_0 = 0,000000, |x_0 − p| = 2,00 (p = 2,000000)", "line": -1, "k": 0, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 0: függőlegesen y = g(x_0) = 1,414214", "line": 0, "k": 1, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 1, x_1 = 1,414214, |x_1 − p| = 5,86·10⁻¹", "line": 1, "k": 2, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 1: függőlegesen y = g(x_1) = 1,847759", "line": 0, "k": 3, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 2, x_2 = 1,847759, |x_2 − p| = 1,52·10⁻¹", "line": 1, "k": 4, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 2: függőlegesen y = g(x_2) = 1,961571", "line": 0, "k": 5, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 3, x_3 = 1,961571, |x_3 − p| = 3,84·10⁻²", "line": 1, "k": 6, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 3: függőlegesen y = g(x_3) = 1,990369", "line": 0, "k": 7, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 4, x_4 = 1,990369, |x_4 − p| = 9,63·10⁻³", "line": 1, "k": 8, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 4: függőlegesen y = g(x_4) = 1,997591", "line": 0, "k": 9, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 5, x_5 = 1,997591, |x_5 − p| = 2,41·10⁻³", "line": 1, "k": 10, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 5: függőlegesen y = g(x_5) = 1,999398", "line": 0, "k": 11, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 6, x_6 = 1,999398, |x_6 − p| = 6,02·10⁻⁴", "line": 1, "k": 12, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 6: függőlegesen y = g(x_6) = 1,999849", "line": 0, "k": 13, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 7, x_7 = 1,999849, |x_7 − p| = 1,51·10⁻⁴", "line": 1, "k": 14, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 7: függőlegesen y = g(x_7) = 1,999962", "line": 0, "k": 15, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}, {"msg": "n = 8, x_8 = 1,999962, |x_8 − p| = 3,76·10⁻⁵", "line": 1, "k": 16, "xs": [0.0, 1.4142135623730951, 1.8477590650225735, 1.9615705608064609, 1.9903694533443939, 1.9975909124103448, 1.9993976373924085, 1.999849403678289, 1.9999623505652022], "p": 2.0}];
const CODE = ["y = g(x)      # függőleges lépés: (xₙ, xₙ) → (xₙ, g(xₙ))", "x = y         # vízszintes lépés: → (xₙ₊₁, xₙ₊₁)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = [
  {f: x => Math.sqrt(2 + x), p: 2, name: "g(x) = √(2+x)"},
  {f: x => 0.5 * (x + 2 / x), p: Math.SQRT2, name: "babiloni"},
  {f: x => Math.cos(x), p: 0.7390851332151607, name: "g(x) = cos x"},
  {f: x => 1 + 1 / x, p: (1 + Math.sqrt(5)) / 2, name: "g(x) = 1 + 1/x"}
];
const SUPS = {"-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹"};
function sciJ(x){ if (x === 0) return "0"; let e = Math.floor(Math.log10(Math.abs(x))), c = x / Math.pow(10, e); if (+c.toFixed(2) >= 10) { c /= 10; e += 1; }
  if (e === 0) return c.toFixed(2).replace(".", ",");
  return c.toFixed(2).replace(".", ",") + "·10" + String(e).split("").map(ch => SUPS[ch]).join(""); }
const fxJ = x => x.toFixed(6).replace(".", ",").replace("-", "−");
function buildJ(gi, x0){
  const g = G[gi], xs = [x0];
  for (let n = 0; n < 8; n++) xs.push(g.f(xs[n]));
  if (!xs.every(v => isFinite(v))) return [{msg: g.name + ", x₀ = " + fxJ(x0) + ": g(x₀) nem értelmezett (osztás 0-val) – válassz x₀ > 0 értéket.", line: -1, k: 0, xs: [x0], p: g.p, bad: true}];
  const out = [{msg: g.name + ", x₀ = " + fxJ(x0) + ": n = 0, x_0 = " + fxJ(x0) + ", |x_0 − p| = " + sciJ(Math.abs(x0 - g.p)) + " (p = " + fxJ(g.p) + ")", line: -1, k: 0, xs: xs, p: g.p}];
  for (let n = 1; n <= 8; n++) {
    out.push({msg: "n = " + (n - 1) + ": függőlegesen y = g(x_" + (n - 1) + ") = " + fxJ(xs[n]), line: 0, k: 2 * n - 1, xs: xs, p: g.p});
    out.push({msg: "n = " + n + ", x_" + n + " = " + fxJ(xs[n]) + ", |x_" + n + " − p| = " + sciJ(Math.abs(xs[n] - g.p)), line: 1, k: 2 * n, xs: xs, p: g.p});
  }
  return out;
}
let GI = 0;
function rebuild(){ const x0 = +$("x0").value; $("x0v").textContent = String(x0).replace(".", ","); setSteps(buildJ(GI, x0)); }
document.getElementById("g").addEventListener("change", e => { GI = +e.target.value; if (GI === 1 && +$("x0").value === 0) $("x0").value = 1; rebuild(); });
document.getElementById("x0").addEventListener("input", rebuild);
function $(id){ return document.getElementById(id); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), g = G[GI];
  const vals = s.xs.concat([s.p]); let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  const span = Math.max(0.5, hi - lo); lo = Math.max(lo < 0 ? lo - 0.12 * span : 0, lo - 0.12 * span); hi = hi + 0.12 * span;
  if (lo > 0 && lo < 0.25 * span) lo = 0;
  const L = 130, S = 300, T = 12, X = v => L + S * (v - lo) / (hi - lo), Y = v => T + S - S * (v - lo) / (hi - lo);
  el("rect", {x: L, y: T, width: S, height: S, fill: "none", stroke: mu});
  [lo, (lo + hi) / 2, hi].forEach(v => { el("text", {x: X(v), y: T + S + 14, "text-anchor": "middle", "font-size": 11}, (+v.toFixed(2)).toString().replace(".", ",").replace("-", "−")); el("text", {x: L - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, (+v.toFixed(2)).toString().replace(".", ",").replace("-", "−")); });
  el("line", {x1: X(lo), y1: Y(lo), x2: X(hi), y2: Y(hi), stroke: fg, "stroke-dasharray": "6 4"});
  const pts = []; for (let i = 0; i <= 300; i++) { const x = lo + (hi - lo) * i / 300, y = g.f(x); if (isFinite(y) && y >= lo - 0.5 * span && y <= hi + 0.5 * span) pts.push(X(x).toFixed(1) + "," + Y(Math.max(lo - 0.05 * span, Math.min(hi + 0.05 * span, y))).toFixed(1)); else if (pts.length) { el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2.2}); pts.length = 0; } }
  if (pts.length) el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2.2});
  for (let h = 1; h <= s.k; h++) {
    const n = Math.floor((h - 1) / 2), x = s.xs[n], y = s.xs[n + 1], cur = h === s.k;
    const col = cur ? css("--hl2") : css("--hl");
    if (h % 2) el("line", {x1: X(x), y1: Y(x), x2: X(x), y2: Y(y), stroke: col, "stroke-width": cur ? 3 : 2});
    else el("line", {x1: X(x), y1: Y(y), x2: X(y), y2: Y(y), stroke: col, "stroke-width": cur ? 3 : 2});
  }
  el("rect", {x: X(s.xs[0]) - 4, y: Y(s.xs[0]) - 4, width: 8, height: 8, fill: fg});
  el("circle", {cx: X(s.p), cy: Y(s.p), r: 7, fill: "none", stroke: fg, "stroke-width": 2});
  const kn = Math.floor(s.k / 2);
  if (!s.bad) el("circle", {cx: X(s.xs[kn]), cy: Y(s.xs[kn]), r: 4, fill: css("--hl2")});
  el("text", {x: L + S + 14, y: T + 20, "font-size": 12}, "— y = g(x)");
  el("text", {x: L + S + 14, y: T + 38, "font-size": 12}, "- - y = x");
  el("text", {x: L + S + 14, y: T + 56, "font-size": 12}, "■ x₀,  ○ fixpont p");
  el("text", {x: L + S + 14, y: T + 80, "font-size": 12}, "xₙ értékek:");
  for (let n = 0; n <= Math.min(8, kn); n++) el("text", {x: L + S + 14, y: T + 98 + 16 * n, "font-size": 11.5, fill: n === kn ? css("--hl2") : fg}, "x" + "₀₁₂₃₄₅₆₇₈"[n] + " = " + fxJ(s.xs[n]));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
