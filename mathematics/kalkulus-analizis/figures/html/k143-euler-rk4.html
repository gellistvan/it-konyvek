<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euler, Heun és RK4 lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label for="hh">h =</label><input id="hh" type="range" min="0" max="7" step="1" value="6" style="flex:0 1 140px"><b id="hhv">0,5</b>
<label><input type="checkbox" id="cE" checked> Euler</label><label><input type="checkbox" id="cH" checked> Heun</label><label><input type="checkbox" id="cR" checked> RK4</label>
<span style="flex-basis:100%"></span>
<span>(b) panel:</span><label for="lam">λ =</label><input id="lam" type="range" min="-100" max="-5" step="1" value="-50" style="flex:0 1 120px"><b id="lamv"></b>
<label for="hb">h =</label><input id="hb" type="range" min="0.005" max="0.1" step="0.005" value="0.05" style="flex:0 1 120px"><b id="hbv"></b>
<span id="stab" aria-live="polite" style="flex-basis:100%"></span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az y' = y feladat Euler-, Heun- és RK4-közelítése lépésenként a k1–k4 meredekségekkel, és az explicit Euler stabilitása az y' = λy feladaton"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított értékek, nem mérés. Az RK4 négy meredeksége a kiértékelési pontokban kis szakaszként látszik (narancs: az aktuális). Kezdőállapot: h = 0,5 (a fejezet példája); a (b) panel kezdőállapota λ = −50, h = 0,05 (instabil).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "sub": -1, "line": -1, "msg": "h = 0,5: kiindulás t = 0, y = 1 (mindhárom módszer)"}, {"n": 0, "sub": 0, "line": 0, "msg": "n = 0, t_n = 0: k1 = 1 (RK4 meredekség)"}, {"n": 0, "sub": 1, "line": 1, "msg": "n = 0, t_n = 0: k2 = 1,25 (RK4 meredekség)"}, {"n": 0, "sub": 2, "line": 2, "msg": "n = 0, t_n = 0: k3 = 1,3125 (RK4 meredekség)"}, {"n": 0, "sub": 3, "line": 3, "msg": "n = 0, t_n = 0: k4 = 1,6562 (RK4 meredekség)"}, {"n": 1, "sub": 4, "line": 4, "msg": "t = 0,5: Euler 1,5; Heun 1,625; RK4 1,6484; pontos 1,6487"}, {"n": 1, "sub": 0, "line": 0, "msg": "n = 1, t_n = 0,5: k1 = 1,6484 (RK4 meredekség)"}, {"n": 1, "sub": 1, "line": 1, "msg": "n = 1, t_n = 0,5: k2 = 2,0605 (RK4 meredekség)"}, {"n": 1, "sub": 2, "line": 2, "msg": "n = 1, t_n = 0,5: k3 = 2,1636 (RK4 meredekség)"}, {"n": 1, "sub": 3, "line": 3, "msg": "n = 1, t_n = 0,5: k4 = 2,7302 (RK4 meredekség)"}, {"n": 2, "sub": 4, "line": 4, "msg": "t = 1: Euler 2,25; Heun 2,6406; RK4 2,7173; pontos 2,7183"}, {"n": 2, "sub": 0, "line": 0, "msg": "n = 2, t_n = 1: k1 = 2,7173 (RK4 meredekség)"}, {"n": 2, "sub": 1, "line": 1, "msg": "n = 2, t_n = 1: k2 = 3,3967 (RK4 meredekség)"}, {"n": 2, "sub": 2, "line": 2, "msg": "n = 2, t_n = 1: k3 = 3,5665 (RK4 meredekség)"}, {"n": 2, "sub": 3, "line": 3, "msg": "n = 2, t_n = 1: k4 = 4,5006 (RK4 meredekség)"}, {"n": 3, "sub": 4, "line": 4, "msg": "t = 1,5: Euler 3,375; Heun 4,291; RK4 4,4794; pontos 4,4817"}, {"n": 3, "sub": 0, "line": 0, "msg": "n = 3, t_n = 1,5: k1 = 4,4794 (RK4 meredekség)"}, {"n": 3, "sub": 1, "line": 1, "msg": "n = 3, t_n = 1,5: k2 = 5,5992 (RK4 meredekség)"}, {"n": 3, "sub": 2, "line": 2, "msg": "n = 3, t_n = 1,5: k3 = 5,8792 (RK4 meredekség)"}, {"n": 3, "sub": 3, "line": 3, "msg": "n = 3, t_n = 1,5: k4 = 7,419 (RK4 meredekség)"}, {"n": 4, "sub": 4, "line": 4, "msg": "t = 2: Euler 5,0625; Heun 6,9729; RK4 7,384; pontos 7,3891"}];
const CODE = ["k1 = f(t_n, y_n)", "k2 = f(t_n + h/2, y_n + h/2·k1)", "k3 = f(t_n + h/2, y_n + h/2·k2)", "k4 = f(t_n + h, y_n + h·k3)", "y_{n+1} = y_n + h/6·(k1 + 2k2 + 2k3 + k4)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const $ = id => document.getElementById(id);

const HS = [0.05, 0.1, 0.125, 0.2, 0.25, 0.4, 0.5, 1.0];
let HCUR = 0.5;
const nf = (x, d) => { let s = (+x.toFixed(d === undefined ? 4 : d)).toString(); return s.replace(".", ",").replace("-", "−"); };
function trajs(h){ const n = Math.round(2 / h), E = [1], He = [1], Rk = [1], Ks = [];
  for (let i = 0; i < n; i++){ const y = E[i]; E.push(y + h * y);
    const yh = He[i], p = yh + h * yh; He.push(yh + h / 2 * (yh + p));
    const yr = Rk[i], k1 = yr, k2 = yr + h / 2 * k1, k3 = yr + h / 2 * k2, k4 = yr + h * k3; Ks.push([k1, k2, k3, k4]);
    Rk.push(yr + h / 6 * (k1 + 2 * k2 + 2 * k3 + k4)); }
  return {E, He, Rk, Ks, n}; }
let TR = trajs(0.5);
function buildSteps(h){ const T = trajs(h), out = [{n: 0, sub: -1, line: -1, msg: "h = " + nf(h) + ": kiindulás t = 0, y = 1 (mindhárom módszer)"}];
  for (let i = 0; i < T.n; i++){ for (let j = 0; j < 4; j++) out.push({n: i, sub: j, line: j, msg: "n = " + i + ", t_n = " + nf(i * h) + ": k" + (j + 1) + " = " + nf(T.Ks[i][j]) + " (RK4 meredekség)"});
    const tn = (i + 1) * h; out.push({n: i + 1, sub: 4, line: 4, msg: "t = " + nf(tn) + ": Euler " + nf(T.E[i + 1]) + "; Heun " + nf(T.He[i + 1]) + "; RK4 " + nf(T.Rk[i + 1]) + "; pontos " + nf(Math.exp(tn))}); }
  return out; }
function ax(b, xr, yr, xt, yt){ const X = x => b.x + b.w * (x - xr[0]) / (xr[1] - xr[0]), Y = y => b.y + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]);
  const mu = css("--muted");
  el("rect", {x: b.x, y: b.y, width: b.w, height: b.h, fill: "none", stroke: mu});
  xt.forEach(t => el("text", {x: X(t), y: b.y + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, nf(t)));
  yt.forEach(t => { el("text", {x: b.x - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, nf(t)); el("line", {x1: b.x, x2: b.x + b.w, y1: Y(t), y2: Y(t), stroke: mu, "stroke-opacity": 0.25}); });
  return {X, Y, b}; }
function pl(A, pts, at){ const b = A.b, s = pts.filter(([x, y]) => A.Y(y) >= b.y - 2 && A.Y(y) <= b.y + b.h + 2).map(([x, y]) => A.X(x).toFixed(1) + "," + A.Y(y).toFixed(1)); if (s.length > 1) el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)); }
function dots(A, pts, shape, col){ pts.forEach(([x, y]) => { const px = A.X(x), py = A.Y(y); if (py < A.b.y - 2 || py > A.b.y + A.b.h + 2) return;
  if (shape === "s") el("rect", {x: px - 4, y: py - 4, width: 8, height: 8, fill: css("--bg"), stroke: col, "stroke-width": 1.6});
  else if (shape === "t") el("path", {d: `M${px},${py - 5} L${px + 5},${py + 4} L${px - 5},${py + 4} Z`, fill: css("--bg"), stroke: col, "stroke-width": 1.6});
  else el("circle", {cx: px, cy: py, r: 4, fill: css("--bg"), stroke: col, "stroke-width": 1.6}); }); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const h = HCUR, fg = css("--fg"), c1 = css("--hl"), c2 = css("--hl2"), c3 = "#548235";
  const A = ax({x: 40, y: 22, w: 400, h: 270}, [0, 2], [0, 8], [0, 0.5, 1, 1.5, 2], [0, 2, 4, 6, 8]);
  el("text", {x: 42, y: 14, "font-size": 12}, "(a) y′ = y, y(0) = 1");
  pl(A, Array.from({length: 101}, (_, i) => [i / 50, Math.exp(i / 50)]), {stroke: fg, "stroke-width": 2.2});
  const m = s.n, tE = i => i * h;
  const show = (arr, upto) => arr.slice(0, upto + 1).map((y, i) => [tE(i), y]);
  if ($("cE").checked){ const p = show(TR.E, m); pl(A, p, {stroke: c1, "stroke-width": 1.5, "stroke-dasharray": "6 4"}); dots(A, p, "s", c1); }
  if ($("cH").checked){ const p = show(TR.He, m); pl(A, p, {stroke: c2, "stroke-width": 1.7, "stroke-dasharray": "2 3"}); dots(A, p, "t", c2); }
  if ($("cR").checked){ const p = show(TR.Rk, m); pl(A, p, {stroke: c3, "stroke-width": 1.5, "stroke-dasharray": "8 3 2 3"}); dots(A, p, "c", c3);
    if (s.sub >= 0 && s.sub < 4){ const n = s.n, t0 = n * h, y0 = TR.Rk[n], K = TR.Ks[n];
      const ev = [[t0, y0], [t0 + h / 2, y0 + h / 2 * K[0]], [t0 + h / 2, y0 + h / 2 * K[1]], [t0 + h, y0 + h * K[2]]];
      for (let j = 0; j <= s.sub; j++){ const [tx, ty] = ev[j], sl = K[j], d = Math.max(0.12, 0.4 * h);
        const on = j === s.sub; el("circle", {cx: A.X(tx), cy: A.Y(ty), r: on ? 4.5 : 3, fill: on ? c2 : css("--muted")});
        el("line", {x1: A.X(tx), y1: A.Y(ty), x2: A.X(tx + d), y2: A.Y(ty + d * sl), stroke: on ? c2 : css("--muted"), "stroke-width": on ? 3 : 1.5});
        el("text", {x: A.X(tx + d) + 3, y: A.Y(ty + d * sl) - 3, "font-size": 11, fill: on ? c2 : css("--muted")}, "k" + (j + 1)); } } }
  el("text", {x: 436, y: 286, "text-anchor": "end", "font-size": 11}, "— pontos   □ Euler   △ Heun   ○ RK4");
  // (b) panel
  const lam = +$("lam").value, hb = +$("hb").value, B = ax({x: 500, y: 22, w: 250, h: 270}, [0, 0.5], [-3, 3], [0, 0.25, 0.5], [-3, -2, -1, 0, 1, 2, 3]);
  el("text", {x: 502, y: 14, "font-size": 12}, "(b) y′ = λy, y(0) = 1");
  el("line", {x1: B.X(0), x2: B.X(0.5), y1: B.Y(0), y2: B.Y(0), stroke: css("--muted")});
  pl(B, Array.from({length: 201}, (_, i) => [i / 400, Math.exp(lam * i / 400)]), {stroke: fg, "stroke-width": 2});
  const nb = Math.floor(0.5 / hb + 1e-9), ex = [], im = []; let ye = 1, yi = 1;
  for (let i = 0; i <= nb; i++){ ex.push([i * hb, ye]); im.push([i * hb, yi]); ye *= 1 + hb * lam; yi /= 1 - hb * lam; }
  pl(B, ex, {stroke: c2, "stroke-width": 1.3}); dots(B, ex, "c", c2);
  pl(B, im, {stroke: c3, "stroke-width": 1.3, "stroke-dasharray": "2 3"}); dots(B, im, "t", c3);
  el("text", {x: 748, y: 286, "text-anchor": "end", "font-size": 11}, "○ explicit   △ implicit");
  const g = Math.abs(1 + hb * lam);
  $("lamv").textContent = nf(lam); $("hbv").textContent = nf(hb, 3);
  $("stab").textContent = "(b) λ = " + nf(lam) + ", h = " + nf(hb, 3) + ": |1 + hλ| = " + nf(g, 3) + " → explicit Euler " + (g < 1 ? "stabil" : (g === 1 ? "határeset" : "instabil (előjelváltó, növő sorozat)")) + "; határ h < 2/|λ| = " + nf(2 / Math.abs(lam), 4) + "; implicit Euler szorzója 1/(1 − hλ) = " + nf(1 / (1 - hb * lam), 3) + " → stabil.";
}
$("hh").addEventListener("input", () => { HCUR = HS[+$("hh").value]; $("hhv").textContent = nf(HCUR); TR = trajs(HCUR); setSteps(buildSteps(HCUR)); });
["cE", "cH", "cR"].forEach(id => $(id).addEventListener("change", () => render(STEPS[+document.getElementById("pos").value])));
["lam", "hb"].forEach(id => $(id).addEventListener("input", () => render(STEPS[+document.getElementById("pos").value])));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
