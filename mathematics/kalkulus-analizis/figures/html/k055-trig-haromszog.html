<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referencia-háromszögek a trigonometrikus helyettesítésekhez</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Szög">
  <label for="th">θ =</label><input id="th" type="range" min="-1.55" max="1.55" step="0.01" value="0.5" aria-label="théta radiánban, mínusz pí per kettő és pí per kettő között"><b id="thv"></b>
</div>
<div class="ctl" role="group" aria-label="a paraméter">
  <label for="a">a =</label><input id="a" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="a"><b id="av"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 395" role="img" aria-label="Három derékszögű háromszög a három helyettesítéshez, a gyökös oldal kiemelve, alattuk félkör a sin théta vetülettel és a koszinusz théta magassággal"></svg>
<p class="small">Negatív θ-nál az (1) és (2) háromszög tükröződik (x és a szemközti befogó előjeles); a (3) helyettesítés a fejezetben θ ∈ [0, π/2) ∪ (π/2, π] tartományú, ezért a (3) panel |θ|-t használ. Ellenőrzés: a = 1, θ = 0,5 → 0,479 és 0,878; θ = π/4 → (2) átfogója √2 ≈ 1,414. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function tri(cx, cy, sc, adj, opp, labs, thick, title){
  const fg = css("--fg"), hl = css("--hl2");
  const P0 = [cx, cy], P1 = [cx + sc * adj, cy], P2 = [cx + sc * adj, cy - sc * opp];
  const S = [[P0, P1], [P1, P2], [P0, P2]];
  S.forEach((s, i) => el("line", {x1: s[0][0], y1: s[0][1], x2: s[1][0], y2: s[1][1], stroke: i === thick ? hl : fg, "stroke-width": i === thick ? 3.4 : 1.4}));
  const q = 8, sg = opp >= 0 ? 1 : -1;
  el("polyline", {points: (P1[0] - q) + "," + P1[1] + " " + (P1[0] - q) + "," + (P1[1] - sg * q) + " " + P1[0] + "," + (P1[1] - sg * q), fill: "none", stroke: fg});
  const ang = Math.atan2(opp, adj), r = 22;
  el("path", {d: "M" + (cx + r) + "," + cy + " A" + r + "," + r + " 0 0 " + (ang > 0 ? 0 : 1) + " " + (cx + r * Math.cos(ang)) + "," + (cy - r * Math.sin(ang)), fill: "none", stroke: fg});
  el("text", {x: cx + 28 * Math.cos(ang / 2) + 2, y: cy - 28 * Math.sin(ang / 2) + 4, "font-size": 12}, "θ");
  el("text", {x: (P0[0] + P1[0]) / 2, y: cy + (opp >= 0 ? 16 : -6), "text-anchor": "middle", "font-size": 12}, labs[0]);
  el("text", {x: P1[0] + 5, y: (P1[1] + P2[1]) / 2 + 4, "font-size": 12}, labs[1]);
  el("text", {x: (P0[0] + P2[0]) / 2 - 26, y: (P0[1] + P2[1]) / 2 + (opp >= 0 ? -10 : 18), "text-anchor": "middle", "font-size": 12}, labs[2]);
  el("text", {x: cx + 50, y: 18, "text-anchor": "middle", "font-size": 13}, title);
}
function draw(){
  const th = +$("th").value, a = +$("a").value;
  $("thv").textContent = fmt(th, 2); $("av").textContent = fmt(a, 1);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const x1 = a * Math.sin(th), c1 = a * Math.cos(th);
  const x2 = a * Math.tan(th), h2 = Math.sqrt(a * a + x2 * x2);
  const t3 = Math.abs(th), x3 = a / Math.cos(t3), o3 = Math.sqrt(x3 * x3 - a * a);
  // skála: mindhárom háromszög beférjen ~150×110 képpontba
  const sc1 = 90 / a, sc2 = Math.min(90 / a, 100 / Math.max(Math.abs(x2), 0.01)), sc3 = Math.min(90 / a, 100 / Math.max(o3, 0.01));
  tri(15, 150, sc1, c1, x1, ["√(a²−x²) = " + fmt(c1, 3), "x = " + fmt(x1, 3), "a = " + fmt(a, 1)], 0, "(1) x = a·sin θ");
  tri(200, 150, sc2, a, x2, ["a = " + fmt(a, 1), "x = " + fmt(x2, 3), "√(a²+x²) = " + fmt(h2, 3)], 2, "(2) x = a·tg θ");
  tri(370, 150, sc3, a, o3, ["a = " + fmt(a, 1), "√(x²−a²) = " + fmt(o3, 3), "x = " + fmt(x3, 3)], 1, "(3) x = a/cos θ, |θ|");
  // (4) félkör, sugár a
  const cx = 330, cy = 375, R4 = 90, Rs = R4;
  let d = ""; for (let i = 0; i <= 100; i++) { const t = Math.PI * i / 100; d += (i ? "L" : "M") + (cx + Rs * Math.cos(t)).toFixed(1) + "," + (cy - Rs * Math.sin(t)).toFixed(1); }
  el("line", {x1: cx - 110, y1: cy, x2: cx + 110, y2: cy, stroke: mu}); el("line", {x1: cx, y1: cy, x2: cx, y2: cy - 95, stroke: mu});
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 1.5});
  const px = cx + Rs * Math.sin(th), py = cy - Rs * Math.cos(th);
  el("line", {x1: cx, y1: cy, x2: px, y2: py, stroke: fg});
  el("line", {x1: px, y1: cy, x2: px, y2: py, stroke: hl, "stroke-width": 3.4});
  el("line", {x1: cx, y1: cy, x2: px, y2: cy, stroke: fg, "stroke-width": 2, "stroke-dasharray": "6 3"});
  el("circle", {cx: px, cy: py, r: 4.5, fill: fg});
  el("text", {x: (cx + px) / 2, y: cy + 16, "text-anchor": "middle", "font-size": 12}, "x = a·sin θ");
  el("text", {x: px + (th >= 0 ? 6 : -6), y: (cy + py) / 2, "text-anchor": th >= 0 ? "start" : "end", "font-size": 12, fill: hl}, "√(a²−x²) = a·cos θ");
  el("text", {x: 15, y: 300, "font-size": 12}, "(4) y = √(a² − x²) félkör;"); el("text", {x: 15, y: 318, "font-size": 12}, "θ a függőlegestől mérve");
  const sgn = v => (v < 0 ? "−" : "") + fmt(Math.abs(v), 3);
  $("status").textContent = "θ = " + fmt(th, 2) + ", a = " + fmt(a, 1) + ": (1) x = a·sin θ = " + sgn(x1) + ", √(a²−x²) = a·cos θ = " + fmt(c1, 3) +
    ";  (2) x = a·tg θ = " + sgn(x2) + ", √(a²+x²) = a/cos θ = " + fmt(h2, 3) + ";  (3) |θ|-val: x = a/cos|θ| = " + fmt(x3, 3) + ", √(x²−a²) = a·tg|θ| = " + fmt(o3, 3);
}
["th", "a"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
