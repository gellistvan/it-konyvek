<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibbs-jelenség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Tagszám">
  <button id="prev" aria-label="N csökkentése">◀</button>
  <label for="n">N =</label><input id="n" type="range" min="1" max="100" step="1" value="1" aria-label="A részletösszeg tagszáma, N"><b id="nv"></b>
  <button id="next" aria-label="N növelése">▶</button>
  <button id="play" aria-label="Lejátszás N = 1-től 100-ig">▶ Lejátszás</button>
</div>
<div class="ctl"><label><input id="zoom" type="checkbox"> nagyító: x ∈ [0; 0,5]</label></div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 375" role="img" aria-label="A négyszögjel részletösszegei: az első csúcs N növelésével az ugráshoz közeledik és keskenyedik, de magassága 1,17898-hoz tart, nem 1-hez"></svg>
<p class="small">S_N(x) = (4/π) Σ_{k=1}^N sin((2k−1)x)/(2k−1); az első pozitív maximum x_N = π/(2N), mert S_N′(x) = (4/π)·sin(2Nx)/(2 sin x). A határérték (2/π)∫₀^π (sin t)/t dt ≈ 1,17898: az ugrás (2) kb. 9 %-ával lő túl. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const G = 1.17897974;
function Sn(N, x){ let s = 0; for (let k = 1; k <= N; k++) s += Math.sin((2*k - 1)*x)/(2*k - 1); return 4/Math.PI*s; }
const X0 = 50, PW = 490;
let timer = null;
function draw(){
  const N = +$("n").value, zoom = $("zoom").checked; $("nv").textContent = N;
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  const x0 = zoom ? 0 : -0.5, x1 = zoom ? 0.5 : Math.PI, ylo = zoom ? 0.6 : -1.3, yhi = zoom ? 1.35 : 1.45;
  const Y0 = 22, PH = 190;
  const px = x => X0 + (x - x0)/(x1 - x0)*PW, py = y => Y0 + (yhi - y)/(yhi - ylo)*PH;
  el("text", {x: X0, y: 14, "font-size": 12}, "(a) négyszögjel (szaggatott) és S_N (folytonos); kör: az első csúcs");
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: mu});
  el("line", {x1: X0, y1: py(G), x2: X0 + PW, y2: py(G), stroke: mu, "stroke-dasharray": "2 3"});
  el("text", {x: X0 + PW, y: py(G) - 4, "font-size": 11, "text-anchor": "end", fill: mu}, "1,17898");
  const sq = x0 < 0 ? [[x0, -1], [0, -1], [0, 1], [x1, 1]] : [[0, 1], [x1, 1]];
  el("polyline", {points: sq.map(p => px(p[0]) + "," + py(Math.max(ylo, p[1]))).join(" "), fill: "none", stroke: fg, "stroke-width": 1.2, "stroke-dasharray": "6 4"});
  const pts = []; for (let i = 0; i <= 1500; i++) { const x = x0 + (x1 - x0)*i/1500; pts.push(px(x) + "," + py(Math.max(ylo, Math.min(yhi, Sn(N, x))))); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 1.8});
  const xN = Math.PI/(2*N), pk = Sn(N, xN);
  if (xN <= x1) el("circle", {cx: px(xN), cy: py(pk), r: 4.5, fill: css("--bg"), stroke: fg, "stroke-width": 1.8});
  const tk = zoom ? [[0, "0"], [0.1, "0,1"], [0.2, "0,2"], [0.3, "0,3"], [0.4, "0,4"], [0.5, "0,5"]] : [[0, "0"], [Math.PI/2, "π/2"], [Math.PI, "π"]];
  tk.forEach(q => el("text", {x: px(q[0]), y: Y0 + PH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, q[1]));
  (zoom ? [0.6, 1] : [-1, 0, 1]).forEach(v => el("text", {x: X0 - 5, y: py(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, 1)));
  // alsó panel: csúcsmagasság N függvényében
  const B0 = 262, BH = 95, blo = 1.17, bhi = 1.285, bx = n => X0 + (n - 0.5)/100*PW, by = y => B0 + (bhi - y)/(bhi - blo)*BH;
  el("text", {x: X0, y: B0 - 8, "font-size": 12}, "(b) S_N(x_N) az N függvényében (1…100); pontozott: 1,17898");
  el("line", {x1: X0, y1: by(G), x2: X0 + PW, y2: by(G), stroke: mu, "stroke-dasharray": "2 3"});
  for (let n = 1; n <= 100; n++) { const v = Sn(n, Math.PI/(2*n)); el("circle", {cx: bx(n), cy: by(Math.min(v, bhi)), r: n === N ? 4.5 : 2, fill: n === N ? css("--hl2") : "none", stroke: n === N ? css("--hl2") : fg, "stroke-width": 1}); }
  [1, 25, 50, 75, 100].forEach(n => el("text", {x: bx(n), y: B0 + BH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(n)));
  [1.18, 1.22, 1.26].forEach(v => el("text", {x: X0 - 5, y: by(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, 2)));
  $("status").textContent = "N = " + N + ": x_N = π/" + (2*N) + " ≈ " + fmt(xN, 5) + ", S_N(x_N) = " + fmt(pk, 5)
    + " (túllövés az 1 fölött: " + fmt((pk - 1)*100, 2) + " %; határérték 1,17898)";
}
function stop(){ if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ Lejátszás"; } }
$("n").addEventListener("input", () => { stop(); draw(); });
$("zoom").addEventListener("change", draw);
$("prev").onclick = () => { stop(); $("n").value = Math.max(1, +$("n").value - 1); draw(); };
$("next").onclick = () => { stop(); $("n").value = Math.min(100, +$("n").value + 1); draw(); };
$("play").onclick = () => {
  if (timer) { stop(); return; }
  if (+$("n").value >= 100) $("n").value = 1;
  $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const v = +$("n").value; if (v >= 100) { stop(); return; } $("n").value = v + 1; draw(); }, 180);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
