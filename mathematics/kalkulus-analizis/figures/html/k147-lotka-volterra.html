<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotka–Volterra: rókák és nyulak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Pálya vezérlése">
  <button id="play">▶ Lejátszás</button><button id="reset">Alaphelyzet</button>
  <span class="small">A fázisportréra kattintva új kezdőpontból indul pálya.</span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="A Lotka–Volterra-rendszer iránymezője zárt pályákkal és az idősor; kattintással új kezdőpont, lejátszással mozgó pont"></svg>
<p class="small">RK4-gyel számított pályák (dt = 0,05 hónap, 300 hónap), nem mérés. Szaggatott szürke: a (12; 10), (15; 10), (18; 10) pontból induló zárt pályák (periódus ≈ 89,1, 89,9, 91,2 hónap). Kezdőállapot: a (15; 10) pálya, t = 0.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

// panel: {x0,y0,w,h} pixeles doboz; xr/yr: [min,max]; visszaad: {X, Y, g}
function panel(b, xr, yr, xt, yt, xl, yl, opt){
  opt = opt || {};
  const X = x => b.x0 + b.w * (x - xr[0]) / (xr[1] - xr[0]);
  const Y = opt.logy ? (y => b.y0 + b.h - b.h * (Math.log10(Math.max(y, 1e-300)) - Math.log10(yr[0])) / (Math.log10(yr[1]) - Math.log10(yr[0])))
                     : (y => b.y0 + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]));
  const mu = css("--muted"), gr = css("--grid");
  (xt || []).forEach(t => { el("line", {x1: X(t), y1: b.y0, x2: X(t), y2: b.y0 + b.h, stroke: gr});
    el("text", {x: X(t), y: b.y0 + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, opt.xf ? opt.xf(t) : fmtn(t)); });
  (yt || []).forEach(t => { el("line", {x1: b.x0, y1: Y(t), x2: b.x0 + b.w, y2: Y(t), stroke: gr});
    el("text", {x: b.x0 - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, opt.yf ? opt.yf(t) : fmtn(t)); });
  el("rect", {x: b.x0, y: b.y0, width: b.w, height: b.h, fill: "none", stroke: mu});
  if (!opt.logy && yr[0] < 0 && yr[1] > 0) el("line", {x1: b.x0, y1: Y(0), x2: b.x0 + b.w, y2: Y(0), stroke: css("--fg"), "stroke-width": 0.8});
  if (xr[0] < 0 && xr[1] > 0) el("line", {x1: X(0), y1: b.y0, x2: X(0), y2: b.y0 + b.h, stroke: css("--fg"), "stroke-width": 0.8});
  if (xl) el("text", {x: b.x0 + b.w, y: b.y0 + b.h + 28, "text-anchor": "end", "font-size": 12}, xl);
  if (yl) el("text", {x: b.x0 + 4, y: b.y0 - 6, "text-anchor": "start", "font-size": 12}, yl);
  return {X, Y, b};
}
function fmtn(v){ let s = (+v.toPrecision(6)).toString(); return s.replace(".", ",").replace("-", "−"); }
// görbe: pts = [[x,y],...] adatkoordinátában; a panel dobozára vágva (szakaszokra bontva)
function curve(P, pts, at){
  const b = P.b, segs = []; let cur = [];
  pts.forEach(([x, y]) => { const px = P.X(x), py = P.Y(y);
    if (isFinite(py) && py >= b.y0 - 1 && py <= b.y0 + b.h + 1 && px >= b.x0 - 1 && px <= b.x0 + b.w + 1) cur.push(px.toFixed(1) + "," + py.toFixed(1));
    else { if (cur.length > 1) segs.push(cur); cur = []; } });
  if (cur.length > 1) segs.push(cur);
  segs.forEach(s => el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)));
}
function sample(f, a, b, n){ const r = []; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; r.push([x, f(x)]); } return r; }

const Fx = (x, y) => 0.1 * x - 0.01 * x * y, Fy = (x, y) => -0.05 * y + 0.005 * x * y;
function rk(u, dt){ const [x, y] = u;
  const a1 = Fx(x, y), b1 = Fy(x, y), a2 = Fx(x + dt / 2 * a1, y + dt / 2 * b1), b2 = Fy(x + dt / 2 * a1, y + dt / 2 * b1);
  const a3 = Fx(x + dt / 2 * a2, y + dt / 2 * b2), b3 = Fy(x + dt / 2 * a2, y + dt / 2 * b2), a4 = Fx(x + dt * a3, y + dt * b3), b4 = Fy(x + dt * a3, y + dt * b3);
  return [x + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4), y + dt / 6 * (b1 + 2 * b2 + 2 * b3 + b4)]; }
function traj(x0, y0){ const pts = [[x0, y0]]; let u = [x0, y0]; for (let i = 0; i < 6000; i++){ u = rk(u, 0.05); pts.push(u); } return pts; }  // 300 hónap
let START = [15, 10], TR = traj(15, 10), IDX = 0, timer = null;
const BASE = [12, 15, 18].map(x0 => traj(x0, 10).slice(0, 2400));
let PA = null;
function draw(){
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted"), c2 = css("--hl2");
  PA = panel({x0: 40, y0: 20, w: 250, h: 250}, [0, 20], [0, 20], [0, 5, 10, 15, 20], [0, 5, 10, 15, 20], "x (ezer nyúl)", "y (tucat róka)");
  for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++){ const x = 0.8 + i * 1.7, y = 0.8 + j * 1.7, a = Fx(x, y), b = Fy(x, y), n = Math.hypot(a, b) || 1, L = 0.55;
    const x2 = x + L * a / n, y2 = y + L * b / n; el("line", {x1: PA.X(x), y1: PA.Y(y), x2: PA.X(x2), y2: PA.Y(y2), stroke: mu});
    el("circle", {cx: PA.X(x2), cy: PA.Y(y2), r: 1.4, fill: mu}); }
  BASE.forEach(p => curve(PA, p, {stroke: mu, "stroke-width": 1.1, "stroke-dasharray": "4 3"}));
  const T1 = Math.max(IDX, 2400);
  curve(PA, TR.slice(0, Math.min(T1, TR.length)), {stroke: fg, "stroke-width": 1.8});
  const cur = TR[IDX];
  el("circle", {cx: PA.X(cur[0]), cy: PA.Y(cur[1]), r: 6, fill: c2});
  el("circle", {cx: PA.X(10), cy: PA.Y(10), r: 3.5, fill: fg});
  el("circle", {cx: PA.X(0), cy: PA.Y(0), r: 4, fill: css("--bg"), stroke: fg});
  // idősor
  const tmax = 300, Q = panel({x0: 340, y0: 20, w: 210, h: 250}, [0, tmax], [0, 30], [0, 100, 200, 300], [0, 10, 20, 30], "t (hónap)", "");
  curve(Q, TR.map((u, i) => [i * 0.05, u[0]]).filter((_, i) => i % 5 === 0), {stroke: fg, "stroke-width": 1.6});
  curve(Q, TR.map((u, i) => [i * 0.05, u[1]]).filter((_, i) => i % 5 === 0), {stroke: c2, "stroke-width": 1.6, "stroke-dasharray": "6 4"});
  el("line", {x1: Q.X(IDX * 0.05), x2: Q.X(IDX * 0.05), y1: Q.b.y0, y2: Q.b.y0 + Q.b.h, stroke: mu, "stroke-dasharray": "3 3"});
  el("text", {x: 548, y: 36, "text-anchor": "end", "font-size": 11}, "— x(t) nyulak   – – y(t) rókák");
  $("status").textContent = "Kezdőpont (" + fmt(START[0], 1) + "; " + fmt(START[1], 1) + "): t = " + fmt(IDX * 0.05, 1) + " hónap, x = " + fmt(cur[0], 2) + " ezer nyúl, y = " + fmt(cur[1], 2) + " tucat róka";
}
function stopPlay(){ if (timer){ clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("play").addEventListener("click", () => { if (timer){ stopPlay(); return; } if (IDX >= TR.length - 1) IDX = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { IDX = Math.min(IDX + 20, TR.length - 1); draw(); if (IDX >= TR.length - 1) stopPlay(); }, 40); });
$("reset").addEventListener("click", () => { stopPlay(); START = [15, 10]; TR = traj(15, 10); IDX = 0; draw(); });
svg.addEventListener("click", ev => { if (!PA) return; const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse()); const b = PA.b;
  if (q.x < b.x0 || q.x > b.x0 + b.w || q.y < b.y0 || q.y > b.y0 + b.h) return;
  const x = 20 * (q.x - b.x0) / b.w, y = 20 * (b.y0 + b.h - q.y) / b.h; if (x <= 0.2 || y <= 0.2) return;
  stopPlay(); START = [x, y]; TR = traj(x, y); IDX = 0; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
