<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csillapított szabad rezgés: a ζ hatása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Csillapítási arány">
  <label for="z">ζ =</label><input id="z" type="range" min="0" max="2.5" step="0.01" value="0.33"><b id="zv"></b>
  <button id="third">ζ = 1/3 (példa)</button>
  <button id="play">▶ Lejátszás (rugó)</button>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 345" role="img" aria-label="A kitérés-idő görbe és a karakterisztikus gyökök a komplex síkon; a csillapítási arány csúszkával állítható, a rugóra akasztott test animálható"></svg>
<p class="small">Számított modellgörbék, nem mérés: ω₀ = 3 rad/s, x(0) = 0,1 m, x′(0) = 0. Vékony szürke: a ζ = 1/3 példa; szaggatott: a burkoló ±√(A² + B²)·e^(−ζω₀t). Kezdőállapot: ζ = 1/3 (a fejezet példája). A lejátszás 6 s után megáll.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

// panel: {x0,y0,w,h} pixeles doboz; xr/yr: [min,max]; visszaad: {X, Y, g}
function panel(b, xr, yr, xt, yt, xl, yl, opt){
  opt = opt || {};
  const X = x => b.x0 + b.w * (x - xr[0]) / (xr[1] - xr[0]);
  const Y = opt.logy ? (y => b.y0 + b.h - b.h * (Math.log10(Math.max(y, 1e-300)) - Math.log10(yr[0])) / (Math.log10(yr[1]) - Math.log10(yr[0])))
                     : (y => b.y0 + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]));
  const mu = css("--muted"), gr = css("--grid");
  (xt || []).forEach(t => { el("line", {x1: X(t), y1: b.y0, x2: X(t), y2: b.y0 + b.h, stroke: gr});
    el("text", {x: X(t), y: b.y0 + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, opt.xf ? opt.xf(t) : fmtn(t)); });
  (yt || []).forEach(t => { el("line", {x1: b.x0, y1: Y(t), x2: b.x0 + b.w, y2: Y(t), stroke: gr});
    el("text", {x: b.x0 - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, opt.yf ? opt.yf(t) : fmtn(t)); });
  el("rect", {x: b.x0, y: b.y0, width: b.w, height: b.h, fill: "none", stroke: mu});
  if (!opt.logy && yr[0] < 0 && yr[1] > 0) el("line", {x1: b.x0, y1: Y(0), x2: b.x0 + b.w, y2: Y(0), stroke: css("--fg"), "stroke-width": 0.8});
  if (xr[0] < 0 && xr[1] > 0) el("line", {x1: X(0), y1: b.y0, x2: X(0), y2: b.y0 + b.h, stroke: css("--fg"), "stroke-width": 0.8});
  if (xl) el("text", {x: b.x0 + b.w, y: b.y0 + b.h + 28, "text-anchor": "end", "font-size": 12}, xl);
  if (yl) el("text", {x: b.x0 + 4, y: b.y0 - 6, "text-anchor": "start", "font-size": 12}, yl);
  return {X, Y, b};
}
function fmtn(v){ let s = (+v.toPrecision(6)).toString(); return s.replace(".", ",").replace("-", "−"); }
// görbe: pts = [[x,y],...] adatkoordinátában; a panel dobozára vágva (szakaszokra bontva)
function curve(P, pts, at){
  const b = P.b, segs = []; let cur = [];
  pts.forEach(([x, y]) => { const px = P.X(x), py = P.Y(y);
    if (isFinite(py) && py >= b.y0 - 1 && py <= b.y0 + b.h + 1 && px >= b.x0 - 1 && px <= b.x0 + b.w + 1) cur.push(px.toFixed(1) + "," + py.toFixed(1));
    else { if (cur.length > 1) segs.push(cur); cur = []; } });
  if (cur.length > 1) segs.push(cur);
  segs.forEach(s => el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)));
}
function sample(f, a, b, n){ const r = []; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; r.push([x, f(x)]); } return r; }

const W0 = 3, X0 = 0.1;
let Z = 1 / 3, TC = null, timer = null;
function xof(t, z){
  if (z < 1 - 1e-9){ const wd = W0 * Math.sqrt(1 - z * z); return Math.exp(-z * W0 * t) * (X0 * Math.cos(wd * t) + z * W0 * X0 / wd * Math.sin(wd * t)); }
  if (Math.abs(z - 1) <= 1e-9) return X0 * (1 + W0 * t) * Math.exp(-W0 * t);
  const s = W0 * Math.sqrt(z * z - 1), r1 = -z * W0 - s, r2 = -z * W0 + s; return -X0 * r2 / (r1 - r2) * Math.exp(r1 * t) + X0 * r1 / (r1 - r2) * Math.exp(r2 * t);
}
function draw(){
  $("zv").textContent = Math.abs(Z - 1 / 3) < 1e-9 ? "1/3" : fmt(Z, 2);
  svg.innerHTML = "";
  const fg = css("--fg"), c2 = css("--hl2");
  const A = panel({x0: 50, y0: 22, w: 330, h: 280}, [0, 6], [-0.1, 0.11], [0, 1, 2, 3, 4, 5, 6], [-0.1, -0.05, 0, 0.05, 0.1], "t (s)", "x (m)");
  if (Z < 1){ const wd = W0 * Math.sqrt(1 - Z * Z), amp = Math.hypot(X0, Z * W0 * X0 / wd);
    curve(A, sample(t => amp * Math.exp(-Z * W0 * t), 0, 6, 200), {stroke: css("--muted"), "stroke-dasharray": "4 3"});
    curve(A, sample(t => -amp * Math.exp(-Z * W0 * t), 0, 6, 200), {stroke: css("--muted"), "stroke-dasharray": "4 3"}); }
  curve(A, sample(t => xof(t, 1 / 3), 0, 6, 400), {stroke: css("--muted"), "stroke-width": 1});
  curve(A, sample(t => xof(t, Z), 0, 6, 600), {stroke: c2, "stroke-width": 2.6});
  if (TC !== null){ el("line", {x1: A.X(TC), x2: A.X(TC), y1: A.b.y0, y2: A.b.y0 + A.b.h, stroke: fg, "stroke-dasharray": "3 3"}); el("circle", {cx: A.X(TC), cy: A.Y(xof(TC, Z)), r: 5, fill: c2}); }
  // komplex sík
  const B = panel({x0: 410, y0: 22, w: 140, h: 140}, [-12, 1], [-4, 4], [-12, -6, 0], [-3, 0, 3], "Re r", "Im r");
  const d = Z * Z - 1, rs = d < 0 ? [[-Z * W0, W0 * Math.sqrt(-d)], [-Z * W0, -W0 * Math.sqrt(-d)]] : [[-Z * W0 - W0 * Math.sqrt(d), 0], [-Z * W0 + W0 * Math.sqrt(d), 0]];
  rs.forEach(([re, im]) => el("circle", {cx: B.X(re), cy: B.Y(im), r: 5.5, fill: c2}));
  // rugó + test
  const top = 200, xm = 480, yy = top + 40 + (TC === null ? xof(0, Z) : xof(TC, Z)) * 400;
  el("line", {x1: 440, x2: 520, y1: top, y2: top, stroke: fg, "stroke-width": 3});
  let zz = `M${xm},${top}`; const nseg = 10; for (let i = 1; i <= nseg; i++) zz += ` L${xm + (i % 2 ? 9 : -9)},${top + (yy - top) * i / (nseg + 1)}`; zz += ` L${xm},${yy}`;
  el("path", {d: zz, fill: "none", stroke: fg, "stroke-width": 1.5});
  el("rect", {x: xm - 16, y: yy, width: 32, height: 22, fill: c2});
  el("line", {x1: 455, x2: 505, y1: top + 51, y2: top + 51, stroke: css("--muted"), "stroke-dasharray": "3 3"});
  el("text", {x: 552, y: top + 55, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "x = 0");
  let kase, extra = "";
  if (Z === 0) kase = "csillapítatlan"; else if (Z < 1) kase = "gyenge csillapítás"; else if (Math.abs(Z - 1) < 1e-9) kase = "kritikus csillapítás"; else kase = "erős csillapítás";
  if (Z < 1){ const wd = W0 * Math.sqrt(1 - Z * Z); extra = ", ω_d = " + fmt(wd, 3) + " rad/s, T_d = " + fmt(2 * Math.PI / wd, 3) + " s"; }
  else extra = ", gyökök: " + fmt(rs[0][0], 3) + " és " + fmt(rs[1][0], 3) + " (nincs lengés)";
  $("status").textContent = "ζ = " + (Math.abs(Z - 1 / 3) < 1e-9 ? "1/3" : fmt(Z, 2)) + ", eset: " + kase + extra + (TC !== null ? "; t = " + fmt(TC, 2) + " s, x = " + fmt(xof(TC, Z), 4) + " m" : "");
}
function stopPlay(){ if (timer){ clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás (rugó)"; }
$("z").addEventListener("input", () => { Z = +$("z").value; draw(); });
$("third").addEventListener("click", () => { Z = 1 / 3; $("z").value = 0.33; draw(); });
$("play").addEventListener("click", () => { if (timer){ stopPlay(); return; } TC = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { TC += 0.04; if (TC >= 6){ TC = 6; stopPlay(); } draw(); }, 40); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
