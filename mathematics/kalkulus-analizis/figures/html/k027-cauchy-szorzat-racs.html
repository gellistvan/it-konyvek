<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cauchy-szorzat: négyzet, háromszög, sávok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="N">N =</label><input id="N" type="range" min="2" max="20" step="1" value="8"><b id="Nv"></b>
  <label for="mode">mód:</label>
  <select id="mode"><option value="b">becslés (sávok)</option><option value="d">átló (c_n lépésenként)</option></select>
</div>
<div class="ctl" id="bandctl">
  <label><input type="checkbox" id="b1" checked> sáv j &gt; ⌊N/2⌋</label>
  <label><input type="checkbox" id="b2" checked> sáv i &gt; ⌊N/2⌋</label>
</div>
<div class="ctl" id="diagctl" style="display:none">
  <button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="nv" class="small"></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 590 420" role="img" aria-label="Négyzetes rács; a bal alsó háromszög tömör pontjai a Cauchy-szorzat részletösszegét adják, a jobb felső üres pontok a két vonalkázott sáv valamelyikébe esnek"></svg>
<p class="small">Mintaadat a 4. feladatból: a_i = 2^(−i), b_j = 3^(−j); N ≤ 6 esetén a pontok mellett az a_i·b_j érték. N = 3-nál C₃ ≈ 2,6620, A₃B₃ ≈ 2,7778, a különbség a 6 üres pont összege ≈ 0,1157. Kezdőállapot: N = 8, becslés mód. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const A = i => Math.pow(2, -i), B = j => Math.pow(3, -j);
let dn = 0;
const frac = (i, j) => "1/" + (Math.pow(2, i) * Math.pow(3, j));
function draw(){
  const N = +$("N").value, h = Math.floor(N / 2), mode = $("mode").value;
  $("Nv").textContent = N;
  $("bandctl").style.display = mode === "b" ? "" : "none";
  $("diagctl").style.display = mode === "d" ? "" : "none";
  if (dn > N) dn = N;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2");
  const L = 50, T = 15, S = 370, c = S / (N + 1), X = i => L + c * (i + 0.5), Y = j => T + S - c * (j + 0.5);
  const defs = el("defs", {});
  const pat = (id, d, col) => { const p = el("pattern", {id: id, width: 8, height: 8, patternUnits: "userSpaceOnUse"}, undefined, defs); el("path", {d: d, stroke: col, "stroke-width": 1.2}, undefined, p); };
  pat("ph", "M0 4 H8", hl); pat("pv", "M4 0 V8", hl2);
  if (mode === "b") {
    if ($("b1").checked) el("rect", {x: L, y: T, width: S, height: c * (N - h), fill: "url(#ph)", stroke: hl, "stroke-width": 1.5});
    if ($("b2").checked) el("rect", {x: L + c * (h + 1), y: T, width: c * (N - h), height: S, fill: "url(#pv)", stroke: hl2, "stroke-width": 1.5});
  }
  for (let n = 0; n <= N; n++) {
    const on = mode === "d" && n === dn;
    el("line", {x1: X(n) + c * 0.3, y1: Y(0) + c * 0.3, x2: X(0) - c * 0.3, y2: Y(n) - c * 0.3, stroke: on ? hl2 : mu, "stroke-width": on ? 3 : 0.7});
  }
  const big = N <= 6;
  let miss = 0, inb = 0;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const inT = i + j <= N, on = mode === "d" && i + j === dn;
    if (!inT) { miss++; if ((i > h && $("b2").checked) || (j > h && $("b1").checked)) inb++; }
    el("circle", {cx: X(i), cy: Y(j), r: Math.min(7, c * 0.22), fill: inT ? (on ? hl2 : fg) : css("--bg"), stroke: on ? hl2 : fg, "stroke-width": 1.5});
    if (big) el("text", {x: X(i) + c * 0.06, y: Y(j) - c * 0.26, "font-size": 10, fill: mu}, frac(i, j));
  }
  const step = N > 10 ? 5 : 1;
  for (let i = 0; i <= N; i += step) {
    el("text", {x: X(i), y: T + S + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, String(i));
    el("text", {x: L - 6, y: Y(i) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, String(i));
  }
  el("text", {x: L + S / 2, y: T + S + 30, "text-anchor": "middle", "font-size": 12}, "i (az a_i = 2^(−i) indexe)");
  el("text", {x: 14, y: T + S / 2, "text-anchor": "middle", "font-size": 12, transform: "rotate(-90 14 " + (T + S / 2) + ")"}, "j (a b_j = 3^(−j) indexe)");
  // jobb oldali számok
  let C = 0, AN = 0, BN = 0;
  for (let i = 0; i <= N; i++) { AN += A(i); BN += B(i); for (let j = 0; i + j <= N; j++) C += A(i) * B(j); }
  const R0 = 432, lines = ["● i+j ≤ N: C_N", "○ i+j > N: A_N·B_N − C_N", "", "⌊N/2⌋ = " + h, "C_N = " + fmt(C, 4), "A_N·B_N = " + fmt(AN * BN, 4),
    "különbség = " + fmt(AN * BN - C, 4), "(N → ∞: mindkettő 3)"];
  lines.forEach((t, q) => el("text", {x: R0, y: 30 + 18 * q, "font-size": 12}, t));
  if (mode === "b") {
    const all = inb === miss, any2 = $("b1").checked && $("b2").checked;
    $("status").textContent = "N = " + N + ": hiányzó (üres) pontok száma = N(N+1)/2 = " + miss + ", ebből a bekapcsolt sávokban " + inb +
      "; mind a sávokban: " + (all ? "igen" : "nem") + (any2 ? "" : " (kapcsold be mindkét sávot)") +
      ". C_N = " + fmt(C, 4) + ", A_N·B_N = " + fmt(AN * BN, 4) + ", különbség = " + fmt(AN * BN - C, 4);
  } else {
    let terms = [], fr = [], v = 0;
    for (let k = 0; k <= dn; k++) { terms.push("a_" + k + "b_" + (dn - k)); fr.push(frac(k, dn - k)); v += A(k) * B(dn - k); }
    $("nv").textContent = "n = " + dn + " / " + N;
    $("status").textContent = "c_" + dn + " = " + terms.join(" + ") + (dn <= 6 ? " = " + fr.join(" + ") : "") + " ≈ " + fmt(v, 4) +
      " (az i + j = " + dn + " átló " + (dn + 1) + " pontja)";
  }
}
$("N").addEventListener("input", draw); $("mode").addEventListener("input", () => { dn = 0; draw(); });
$("b1").addEventListener("change", draw); $("b2").addEventListener("change", draw);
$("prev").addEventListener("click", () => { dn = Math.max(0, dn - 1); draw(); });
$("next").addEventListener("click", () => { dn = Math.min(+$("N").value, dn + 1); draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
