<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Növekedési skála log₁₀-skálán</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>
<div class="ctl" role="group" aria-label="n felső határa">
  <label for="n">n legfeljebb</label><input id="n" type="range" min="2" max="60" step="1" value="10" aria-label="az ábrázolt n legnagyobb értéke"><b id="nv"></b>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Az ln n, n négyzet, 2 az n-ediken, n faktoriális és n az n-ediken sorozatok tízes alapú logaritmusa n függvényében"></svg>
<p class="small">Számított értékek a definíciókból (n! logaritmusa összegként). Az ln n görbe n = 2-től indul, mert ln 1 = 0-nak nincs logaritmusa. Nagyobb n-re a különbségek nőnek: ln n ≪ n² ≪ 2ⁿ ≪ n! ≪ nⁿ. Kis n-nél a sorrend még eltérhet (pl. n = 2–4 között n² ≥ 2ⁿ).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const lg = (x) => Math.log10(x);
function lnfact(n){ let s = 0; for (let k = 2; k <= n; k++) s += Math.log(k); return s; }
const SER = [
  {lab: "ln n", f: n => lg(Math.log(n)), n0: 2, dash: "2 4", w: 1.6},
  {lab: "n²", f: n => 2 * lg(n), n0: 1, dash: "8 3 2 3", w: 1.6},
  {lab: "2ⁿ", f: n => n * lg(2), n0: 1, dash: "7 4", w: 1.6},
  {lab: "n!", f: n => lnfact(n) / Math.LN10, n0: 1, dash: "", w: 1.6},
  {lab: "nⁿ", f: n => n * lg(n), n0: 1, dash: "", w: 3}
];
let nm = 10;
function draw(){
  $("nv").textContent = nm;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted");
  const top = nm * lg(nm), lo = -0.2, hi = Math.max(1, top) * 1.04;
  const L = 50, R = 470, T = 12, B = 300, X = n => L + (R - L) * (n - 1) / Math.max(1, nm - 1), Y = v => B - (B - T) * (v - lo) / (hi - lo);
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: fg}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: fg});
  el("line", {x1: L, y1: Y(0), x2: R, y2: Y(0), stroke: mu, "stroke-width": 0.7});
  const st = Math.max(1, Math.round(nm / 8));
  for (let n = 1; n <= nm; n += st) el("text", {x: X(n), y: B + 15, "text-anchor": "middle", "font-size": 11}, String(n));
  const yst = hi > 40 ? 10 : hi > 15 ? 5 : hi > 6 ? 2 : 1;
  for (let v = 0; v <= hi; v += yst) el("text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v));
  el("text", {x: R, y: B + 28, "text-anchor": "end", "font-size": 11, fill: mu}, "n");
  el("text", {x: L + 4, y: T + 4, "font-size": 11, fill: mu}, "log₁₀(érték)");
  const ends = [];
  SER.forEach(s => {
    const pts = []; for (let n = s.n0; n <= nm; n++) pts.push(X(n).toFixed(1) + "," + Y(s.f(n)).toFixed(1));
    el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": s.w, "stroke-dasharray": s.dash});
    ends.push({lab: s.lab, v: s.f(nm)});
  });
  // feliratok a jobb szélen, átfedés nélkül
  const ys = ends.map(e => Y(e.v)).slice(); const order = ys.map((y, i) => i).sort((a, b) => ys[b] - ys[a]);
  let last = 1e9; order.forEach(i => { let y = Math.min(ys[i], last - 14); last = y; el("text", {x: R + 6, y: y + 4, "font-size": 12}, ends[i].lab + ": " + fmt(ends[i].v, 2)); });
  const rank = ends.slice().sort((a, b) => b.v - a.v).map(e => e.lab + " (" + fmt(e.v, 2) + ")").join(" > ");
  $("status").textContent = "n = " + nm + ", log₁₀-értékek: " + rank + ".";
}
$("n").addEventListener("input", () => { nm = +$("n").value; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
