<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrálkritérium: lépcsős becslés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Kitevő és N">
  <label for="p">p =</label><input id="p" type="range" min="0.5" max="3" step="0.5" value="1" aria-label="p kitevő"><b id="pv"></b>
  <label for="n">N =</label><input id="n" type="range" min="2" max="12" step="1" value="5" aria-label="N"><b id="nv"></b>
</div>
<div class="ctl" role="group" aria-label="Lépcső">
  <label for="st">lépcső:</label><select id="st" aria-label="melyik lépcső látszik"><option value="both">alsó és felső</option><option value="up">felső f(n)</option><option value="lo">alsó f(n+1)</option></select>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Az 1 per x a p-ediken grafikonja, alatta az f(n+1) magasságú alsó és fölötte az f(n) magasságú felső téglalaplépcső az N-ig kiemelve"></svg>
<p class="small">Számított értékek, nem mérés. A maradékösszeget 20 000 tagig összegezzük, a többit az ∫_{M+1/2}^∞ integrállal közelítjük. Ellenőrzés: p = 2, N = 5: 0,1667 ≤ R_5 = 0,1813 ≤ 0,2000; p = 1, N = 5: 1,2833 ≤ 1,6094 ≤ 2,0833 (= H_4).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const f = (x, p) => Math.pow(x, -p);
const integ = (a, b, p) => Math.abs(p - 1) < 1e-9 ? Math.log(b / a) : (Math.pow(b, 1 - p) - Math.pow(a, 1 - p)) / (1 - p);
function remainder(N, p){ const M = 20000; let s = 0; for (let n = N + 1; n <= M; n++) s += f(n, p); return s + Math.pow(M + 0.5, 1 - p) / (p - 1); }
function draw(){
  const p = +$("p").value, N = +$("n").value, st = $("st").value;
  $("pv").textContent = fmt(p, 1); $("nv").textContent = N;
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const L = 50, R = 545, T = 20, B = 300, XM = 13, X = u => L + (R - L) * (u - 1) / (XM - 1), Y = v => B - (B - T) * Math.min(v, 1.05) / 1.05;
  for (let n = 1; n < XM; n++) {
    const on = n < N, op = on ? 1 : 0.35;
    if (st !== "lo") el("rect", {x: X(n), y: Y(f(n, p)), width: X(n + 1) - X(n), height: Y(0) - Y(f(n, p)), fill: "url(#hat)", stroke: fg, "stroke-width": on ? 1.4 : 0.6, opacity: op});
    if (st !== "up") el("rect", {x: X(n), y: Y(f(n + 1, p)), width: X(n + 1) - X(n), height: Y(0) - Y(f(n + 1, p)), fill: "url(#dots)", stroke: fg, "stroke-dasharray": "4 3", "stroke-width": on ? 1.4 : 0.6, opacity: op});
  }
  let d = ""; for (let i = 0; i <= 300; i++) { const u = 1 + (XM - 1) * i / 300; d += (i ? "L" : "M") + X(u).toFixed(1) + "," + Y(f(u, p)).toFixed(1); }
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 2.6});
  el("line", {x1: X(N), y1: T, x2: X(N), y2: B, stroke: hl, "stroke-width": 1.6, "stroke-dasharray": "5 3"});
  el("text", {x: X(N) + 4, y: T + 12, "font-size": 12, fill: hl}, "N = " + N);
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: mu}); el("line", {x1: L, y1: B, x2: L, y2: T, stroke: mu});
  for (let u = 1; u <= XM; u++) el("text", {x: X(u), y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, String(u));
  [0, 0.5, 1].forEach(v => el("text", {x: L - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, fmt(v, 1)));
  el("text", {x: R, y: T + 12, "text-anchor": "end", "font-size": 12}, "ferde: f(n) az [n, n+1]-en   pontozott: f(n+1)");
  const df = document.createElementNS(NS, "defs");
  df.innerHTML = '<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="' + css("--bg") + '"/><line x1="0" y1="0" x2="0" y2="6" stroke="' + fg + '" stroke-width="1"/></pattern><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="' + css("--cellhl") + '"/><circle cx="2.5" cy="2.5" r="0.9" fill="' + fg + '"/></pattern>';
  svg.appendChild(df);
  let lo = 0, up = 0; for (let n = 2; n <= N; n++) lo += f(n, p); for (let n = 1; n <= N - 1; n++) up += f(n, p);
  let msg = "p = " + fmt(p, 1) + ", N = " + N + ":  Σₙ₌₂ᴺ f(n) = " + fmt(lo, 4) + " ≤ ∫₁ᴺ f = " + fmt(integ(1, N, p), 4) + " ≤ Σₙ₌₁ᴺ⁻¹ f(n) = " + fmt(up, 4) + ".  ";
  if (p > 1) msg += "Maradék: ∫_{N+1}^∞ f = " + fmt(Math.pow(N + 1, 1 - p) / (p - 1), 4) + " ≤ R_" + N + " = " + fmt(remainder(N, p), 4) + " ≤ ∫_N^∞ f = " + fmt(Math.pow(N, 1 - p) / (p - 1), 4);
  else msg += "p ≤ 1: az integrál és a sor is divergens, maradékösszeg nincs.";
  $("status").textContent = msg;
}
["p", "n"].forEach(id => $(id).addEventListener("input", draw));
$("st").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
