<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hővezetés: a módusok lecsengése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Lap">
  <label><input type="radio" name="lap" id="heat" checked> Hővezetés (2. példa)</label>
  <label><input type="radio" name="lap" id="str"> Rezgő húr (4. feladat)</label>
</div>
<div class="ctl" role="group" aria-label="Idő">
  <label for="t">t =</label><input id="t" type="range" min="0" max="0.3" step="0.002" value="0"><b id="tv"></b>
  <button id="play">▶ Lejátszás</button>
  <span id="mods"><label><input type="checkbox" id="m1" checked> 1. módus</label> <label><input type="checkbox" id="m3" checked> 3.</label> <label><input type="checkbox" id="m5" checked> 5.</label></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 365" role="img" aria-label="Az x(1 − x) kezdeti hőmérséklet-eloszlás megoldása és első három szinuszmódusa az idő függvényében; második lapon a rezgő húr"></svg>
<p class="small">Számított értékek, nem mérés (30 tag; b_n = 8/(nπ)³ páratlan n-re). Kezdőállapot: t = 0, ahol u(0,5; 0) = 0,25. A húr lapon a csúszka egy teljes periódust (t = 0…1) jár be; szaggatott szürke: t = 0,125; 0,25; 0,375. A lejátszás a végén megáll.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

// panel: {x0,y0,w,h} pixeles doboz; xr/yr: [min,max]; visszaad: {X, Y, g}
function panel(b, xr, yr, xt, yt, xl, yl, opt){
  opt = opt || {};
  const X = x => b.x0 + b.w * (x - xr[0]) / (xr[1] - xr[0]);
  const Y = opt.logy ? (y => b.y0 + b.h - b.h * (Math.log10(Math.max(y, 1e-300)) - Math.log10(yr[0])) / (Math.log10(yr[1]) - Math.log10(yr[0])))
                     : (y => b.y0 + b.h - b.h * (y - yr[0]) / (yr[1] - yr[0]));
  const mu = css("--muted"), gr = css("--grid");
  (xt || []).forEach(t => { el("line", {x1: X(t), y1: b.y0, x2: X(t), y2: b.y0 + b.h, stroke: gr});
    el("text", {x: X(t), y: b.y0 + b.h + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, opt.xf ? opt.xf(t) : fmtn(t)); });
  (yt || []).forEach(t => { el("line", {x1: b.x0, y1: Y(t), x2: b.x0 + b.w, y2: Y(t), stroke: gr});
    el("text", {x: b.x0 - 4, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, opt.yf ? opt.yf(t) : fmtn(t)); });
  el("rect", {x: b.x0, y: b.y0, width: b.w, height: b.h, fill: "none", stroke: mu});
  if (!opt.logy && yr[0] < 0 && yr[1] > 0) el("line", {x1: b.x0, y1: Y(0), x2: b.x0 + b.w, y2: Y(0), stroke: css("--fg"), "stroke-width": 0.8});
  if (xr[0] < 0 && xr[1] > 0) el("line", {x1: X(0), y1: b.y0, x2: X(0), y2: b.y0 + b.h, stroke: css("--fg"), "stroke-width": 0.8});
  if (xl) el("text", {x: b.x0 + b.w, y: b.y0 + b.h + 28, "text-anchor": "end", "font-size": 12}, xl);
  if (yl) el("text", {x: b.x0 + 4, y: b.y0 - 6, "text-anchor": "start", "font-size": 12}, yl);
  return {X, Y, b};
}
function fmtn(v){ let s = (+v.toPrecision(6)).toString(); return s.replace(".", ",").replace("-", "−"); }
// görbe: pts = [[x,y],...] adatkoordinátában; a panel dobozára vágva (szakaszokra bontva)
function curve(P, pts, at){
  const b = P.b, segs = []; let cur = [];
  pts.forEach(([x, y]) => { const px = P.X(x), py = P.Y(y);
    if (isFinite(py) && py >= b.y0 - 1 && py <= b.y0 + b.h + 1 && px >= b.x0 - 1 && px <= b.x0 + b.w + 1) cur.push(px.toFixed(1) + "," + py.toFixed(1));
    else { if (cur.length > 1) segs.push(cur); cur = []; } });
  if (cur.length > 1) segs.push(cur);
  segs.forEach(s => el("polyline", Object.assign({points: s.join(" "), fill: "none"}, at)));
}
function sample(f, a, b, n){ const r = []; for (let i = 0; i <= n; i++){ const x = a + (b - a) * i / n; r.push([x, f(x)]); } return r; }

const PI = Math.PI, bn = n => n % 2 ? 8 / Math.pow(n * PI, 3) : 0;
const U = (x, t) => { let s = 0; for (let n = 1; n < 60; n += 2) s += bn(n) * Math.exp(-n * n * PI * PI * t) * Math.sin(n * PI * x); return s; };
const M = (n, x, t) => bn(n) * Math.exp(-n * n * PI * PI * t) * Math.sin(n * PI * x);
let timer = null;
const sci = v => v === 0 ? "0" : (Math.abs(v) >= 1e-3 ? fmt(v, 4) : v.toExponential(2).replace(".", ",").replace("e-", "·10^−"));
function isHeat(){ return $("heat").checked; }
function draw(){
  const t = +$("t").value; svg.innerHTML = ""; const fg = css("--fg"), c2 = css("--hl2"), c1 = css("--hl"), mu = css("--muted");
  $("mods").style.visibility = isHeat() ? "visible" : "hidden";
  if (isHeat()){
    $("tv").textContent = fmt(t, 3);
    const P = panel({x0: 50, y0: 20, w: 480, h: 180}, [0, 1], [-0.03, 0.27], [0, 0.25, 0.5, 0.75, 1], [0, 0.1, 0.2], "x", "u");
    curve(P, sample(x => x * (1 - x), 0, 1, 200), {stroke: mu, "stroke-dasharray": "2 3"});
    const dash = {1: "8 4", 3: "2 3", 5: "8 3 2 3"};
    [1, 3, 5].forEach(n => { if ($("m" + n).checked) curve(P, sample(x => M(n, x, t), 0, 1, 300), {stroke: n === 1 ? c1 : c2, "stroke-width": 1.6, "stroke-dasharray": dash[n]}); });
    curve(P, sample(x => U(x, t), 0, 1, 300), {stroke: fg, "stroke-width": 3});
    const Q = panel({x0: 50, y0: 235, w: 480, h: 95}, [0, 0.3], [1e-12, 1], [0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3], [1e-12, 1e-8, 1e-4, 1], "t", "amplitúdó (log)", {logy: true, yf: v => "10^" + Math.round(Math.log10(v)).toString().replace("-", "−")});
    [1, 3, 5].forEach(n => curve(Q, sample(s => bn(n) * Math.exp(-n * n * PI * PI * s), 0, 0.3, 200), {stroke: n === 1 ? c1 : c2, "stroke-width": 1.6, "stroke-dasharray": dash[n]}));
    el("line", {x1: Q.X(t), x2: Q.X(t), y1: Q.b.y0, y2: Q.b.y0 + Q.b.h, stroke: fg, "stroke-dasharray": "3 3"});
    el("text", {x: 528, y: 13, "text-anchor": "end", "font-size": 11}, "vastag: u(x,t) (30 tag);  pontozott szürke: x(1 − x);  szaggatott: módusok");
    const a1 = bn(1) * Math.exp(-PI * PI * t), a3 = bn(3) * Math.exp(-9 * PI * PI * t);
    $("status").textContent = "t = " + fmt(t, 3) + ": b₁e^(−π²t) = " + sci(a1) + ", b₃e^(−9π²t) = " + sci(a3) + ", arány b₃/b₁ = " + sci(a3 / a1) + "; u(0,5; t) = " + fmt(U(0.5, t), 4);
  } else {
    $("tv").textContent = fmt(t / 0.3, 3) + " (periódus 1)";
    const ts = t / 0.3, P = panel({x0: 50, y0: 30, w: 480, h: 280}, [0, 1], [-0.18, 0.18], [0, 0.25, 0.5, 0.75, 1], [-0.15, 0, 0.15], "x", "u");
    [0.125, 0.25, 0.375].forEach(q => curve(P, sample(x => Math.sin(2 * PI * q) * Math.sin(PI * x) / (2 * PI), 0, 1, 100), {stroke: mu, "stroke-dasharray": "3 3"}));
    curve(P, sample(x => Math.sin(2 * PI * ts) * Math.sin(PI * x) / (2 * PI), 0, 1, 200), {stroke: c2, "stroke-width": 3});
    $("status").textContent = "Húr: u = sin(2πt)·sin(πx)/(2π), c = 2, t = " + fmt(ts, 3) + ": középpont kitérése u(0,5; t) = " + fmt(Math.sin(2 * PI * ts) / (2 * PI), 4) + " (t = 0,25-nél maximum 1/(2π) ≈ 0,1592)";
  }
}
function stopPlay(){ if (timer){ clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("t").addEventListener("input", () => { stopPlay(); draw(); });
["m1", "m3", "m5", "heat", "str"].forEach(id => $(id).addEventListener("change", () => { stopPlay(); $("t").value = 0; draw(); }));
$("play").addEventListener("click", () => { if (timer){ stopPlay(); return; } if (+$("t").value >= 0.3) $("t").value = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const v = Math.min(0.3, +$("t").value + (isHeat() ? 0.002 : 0.003)); $("t").value = v; draw(); if (v >= 0.3) stopPlay(); }, 50); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
