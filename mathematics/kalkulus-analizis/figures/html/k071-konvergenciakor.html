<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konvergenciakör és pólusok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Tagszám">
  <button id="prev" aria-label="N csökkentése">◀</button>
  <label for="n">N =</label><input id="n" type="range" min="0" max="30" step="1" value="2" aria-label="A részletösszeg utolsó indexe, N"><b id="nv"></b>
  <button id="next" aria-label="N növelése">▶</button>
</div>
<div class="ctl" role="group" aria-label="Valós pont">
  <label for="x">x =</label><input id="x" type="range" min="-1.5" max="1.5" step="0.05" value="0.5" aria-label="A valós pont, x"><b id="xv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 280" role="img" aria-label="Bal oldalt a komplex sík egységköre a ±i pólusokkal; jobb oldalt az 1/(1+x²) függvény és Taylor-részletösszegei, amelyek csak a (−1, 1) szakaszon közelítenek"></svg>
<p class="small">S_2N(x) = Σ_{n=0}^N (−1)^n x^(2n); |x| < 1 esetén a hiba pontosan x^(2N+2)/(1+x²) (mértani sor maradéka). A valós függvény mindenütt sima, de a komplex síkon z = ±i pólus, ezért a konvergenciasugár 1. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function S(N, x){ let s = 0, p = 1; for (let n = 0; n <= N; n++) { s += (n % 2 ? -1 : 1)*p; p *= x*x; } return s; }
function draw(){
  const N = +$("n").value, x = +$("x").value; $("nv").textContent = N; $("xv").textContent = fmt(x, 2);
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  // bal: komplex sík
  const cx = 120, cy = 145, sc = 55;
  const P = (u, v) => [cx + u*sc, cy - v*sc];
  el("text", {x: 15, y: 16, "font-size": 12}, "(a) komplex sík");
  el("line", {x1: cx - 2*sc, y1: cy, x2: cx + 2*sc, y2: cy, stroke: mu});
  el("line", {x1: cx, y1: cy - 2*sc, x2: cx, y2: cy + 2*sc, stroke: mu});
  el("circle", {cx: cx, cy: cy, r: sc, fill: css("--fill"), "fill-opacity": 0.7, stroke: fg, "stroke-width": 1.5});
  el("line", {x1: cx - sc, y1: cy, x2: cx + sc, y2: cy, stroke: fg, "stroke-width": 4});
  [1, -1].forEach(p => { const [u, v] = P(0, p); el("path", {d: `M${u-6},${v-6}L${u+6},${v+6}M${u-6},${v+6}L${u+6},${v-6}`, stroke: css("--hl2"), "stroke-width": 2.5});
    el("text", {x: u - 12, y: v + 4, "font-size": 12, "text-anchor": "end"}, p > 0 ? "pólus i" : "pólus −i"); });
  el("text", {x: cx + 0.75*sc, y: cy - 1.05*sc, "font-size": 11}, "|z| = 1, R = 1");
  const div = Math.abs(x) >= 1, [qx, qy] = P(x, 0);
  el("circle", {cx: qx, cy: qy, r: 5.5, fill: div ? css("--bg") : css("--hl"), stroke: div ? css("--hl2") : css("--hl"), "stroke-width": 2});
  el("text", {x: qx, y: qy + 20, "font-size": 11, "text-anchor": "middle"}, "x = " + fmt(x, 2));
  [-2, -1, 1, 2].forEach(v => el("text", {x: P(v, 0)[0], y: cy - 6, "font-size": 10, "text-anchor": "middle", fill: mu}, fmt(v, 0)));
  // jobb: valós grafikon
  const X0 = 270, PW = 275, Y0 = 26, PH = 230, lo = -1, hi = 2;
  const px = u => X0 + (u + 1.5)/3*PW, py = v => Y0 + (hi - v)/(hi - lo)*PH;
  el("text", {x: X0, y: 16, "font-size": 12}, "(b) f (vastag) és S_" + (2*N) + " (szaggatott)");
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: mu});
  [-1, 1].forEach(v => el("line", {x1: px(v), y1: Y0, x2: px(v), y2: Y0 + PH, stroke: mu, "stroke-dasharray": "2 3"}));
  const F = []; let Q = [];
  const flush = () => { if (Q.length > 1) el("polyline", {points: Q.join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 1.8, "stroke-dasharray": "6 3"}); Q = []; };
  for (let i = 0; i <= 600; i++) { const u = -1.5 + 3*i/600, sv = S(N, u); F.push(px(u) + "," + py(1/(1 + u*u)));
    if (sv > hi + 0.05 || sv < lo - 0.05) flush(); else Q.push(px(u) + "," + py(sv)); }
  flush();
  el("polyline", {points: F.join(" "), fill: "none", stroke: fg, "stroke-width": 3});
  el("line", {x1: px(x), y1: Y0, x2: px(x), y2: Y0 + PH, stroke: css("--hl2"), "stroke-width": 1});
  [-1.5, -1, 0, 1, 1.5].forEach(v => el("text", {x: px(v), y: Y0 + PH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, v % 1 ? 1 : 0)));
  [-1, 0, 1, 2].forEach(v => el("text", {x: X0 - 4, y: py(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, 0)));
  const s = S(N, x), fv = 1/(1 + x*x);
  let msg = "N = " + N + ", x = " + fmt(x, 2) + ": S = " + fmt(s, 4) + ", f = " + fmt(fv, 4);
  msg += div ? " — |x| ≥ 1: a tagok |x|^(2n) nem tartanak 0-hoz, a sor divergens (a ±i pólusok miatt R = 1)"
             : ", hiba " + fmt(Math.abs(s - fv), 4) + " (|x| < 1: konvergens, a hiba x^(2N+2)/(1+x²))";
  $("status").textContent = msg;
}
$("n").addEventListener("input", draw); $("x").addEventListener("input", draw);
$("prev").onclick = () => { $("n").value = Math.max(0, +$("n").value - 1); draw(); };
$("next").onclick = () => { $("n").value = Math.min(30, +$("n").value + 1); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
