<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferde aszimptota: zoom ki</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Függvény és nézet">
  <label for="fn">függvény:</label>
  <select id="fn"><option value="0">3. példa: (x²+1)/(x−1)</option><option value="1">2. példa: 1/(x−2)</option><option value="2">4. feladat: (x²+2x+1)/(x−2)</option></select>
  <label for="x">x =</label><input id="x" type="number" step="0.1" value="11" aria-label="a vizsgált x érték (a pont húzható is)">
</div>
<div class="ctl">
  <label for="w">ablak fél-szélessége:</label><input id="w" type="range" min="0" max="1000" step="1" value="237" aria-label="ablakméret, logaritmikus 5–200"><b id="wv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 360" role="img" aria-label="A görbe két ága az x = 1 függőleges egyenes két oldalán a végtelenbe tart, nagy abszolút értékű x-re rásimul az y = x + 1 egyenesre"></svg>
<p class="small">Az ablak a függőleges aszimptota és a ferde aszimptota metszéspontja körül nagyít (fél-szélesség 5–200, logaritmikus csúszka). Az eltérés f(x) − (mx + b) a maradéktag: 2/(x − 1), 1/(x − 2), illetve 9/(x − 2). Kezdőállapot: 3. példa, x = 11 (f(11) = 12,2, x + 1 = 12, eltérés 0,2). Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const F = [
  {f: x => (x * x + 1) / (x - 1), a: x => x + 1, an: "x + 1", d: "2/(x−1)", p: 1},
  {f: x => 1 / (x - 2), a: x => 0, an: "0", d: "1/(x−2)", p: 2},
  {f: x => (x * x + 2 * x + 1) / (x - 2), a: x => x + 4, an: "x + 4", d: "9/(x−2)", p: 2}];
const L = 50, R = 550, T = 10, B = 340;
let view = null, drag = false;
const W = () => 5 * Math.pow(40, +$("w").value / 1000);
const nm = (v, k) => { if (!isFinite(v)) return "nincs értelmezve"; return fmt(v, k).replace(/(,\d*?[1-9])0+$/, "$1").replace(/,0+$/, ""); };
function draw(){
  const S = F[+$("fn").value], w = W(), cx = S.p, cy = S.a(S.p), hy = w;
  const x0 = cx - w, x1 = cx + w, y0 = cy - hy, y1 = cy + hy;
  view = {x0, x1};
  $("wv").textContent = nm(w, 1);
  const X = x => L + (R - L) * (x - x0) / (x1 - x0), Y = y => B - (B - T) * (y - y0) / (y1 - y0);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), gr = css("--grid");
  const defs = el("defs", {}); const cp = el("clipPath", {id: "cp"}, undefined, defs); el("rect", {x: L, y: T, width: R - L, height: B - T}, undefined, cp);
  const g = el("g", {"clip-path": "url(#cp)"});
  // rács: kerek lépésköz
  const mag = Math.pow(10, Math.floor(Math.log10(w))), rat = w / mag, st = mag * (rat > 4 ? 1 : rat > 2 ? 0.5 : 0.2);
  for (let v = Math.ceil(x0 / st) * st; v <= x1; v += st) { el("line", {x1: X(v), x2: X(v), y1: T, y2: B, stroke: gr}, undefined, g); el("text", {x: X(v), y: B + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, nm(v, 2)); }
  for (let v = Math.ceil(y0 / st) * st; v <= y1; v += st) { el("line", {x1: L, x2: R, y1: Y(v), y2: Y(v), stroke: gr}, undefined, g); el("text", {x: L - 5, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, nm(v, 2)); }
  if (x0 < 0 && x1 > 0) el("line", {x1: X(0), x2: X(0), y1: T, y2: B, stroke: mu}, undefined, g);
  if (y0 < 0 && y1 > 0) el("line", {x1: L, x2: R, y1: Y(0), y2: Y(0), stroke: mu}, undefined, g);
  el("line", {x1: X(S.p), x2: X(S.p), y1: T, y2: B, stroke: fg, "stroke-width": 1.4, "stroke-dasharray": "2 4"}, undefined, g);
  el("line", {x1: X(x0), y1: Y(S.a(x0)), x2: X(x1), y2: Y(S.a(x1)), stroke: hl, "stroke-width": 1.8, "stroke-dasharray": "9 5"}, undefined, g);
  for (const [a, b] of [[x0, S.p - 1e-9], [S.p + 1e-9, x1]]) {
    if (b <= a) continue;
    const pts = []; for (let i = 0; i <= 800; i++) { const x = a + (b - a) * i / 800, y = S.f(x); const yy = Math.max(y0 - 3 * hy, Math.min(y1 + 3 * hy, y)); pts.push(X(x).toFixed(1) + "," + Y(yy).toFixed(1)); }
    el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 2}, undefined, g);
  }
  const xv = +$("x").value, fv = S.f(xv), av = S.a(xv);
  if (xv > x0 && xv < x1 && isFinite(fv)) {
    el("line", {x1: X(xv), x2: X(xv), y1: Y(fv), y2: Y(av), stroke: hl2, "stroke-width": 2.5}, undefined, g);
    el("circle", {cx: X(xv), cy: Y(av), r: 4, fill: hl}, undefined, g);
    el("circle", {cx: X(xv), cy: Y(fv), r: 7, fill: css("--bg"), stroke: hl2, "stroke-width": 2.5, style: "cursor:grab"}, undefined, g);
  }
  el("rect", {x: L + 4, y: T + 4, width: 300, height: 52, fill: css("--bg"), opacity: 0.85});
  el("text", {x: L + 10, y: T + 20, "font-size": 12}, "— f(x)   – – ferde/vízszintes aszimptota y = " + S.an);
  el("text", {x: L + 10, y: T + 38, "font-size": 12}, "··· függőleges aszimptota x = " + S.p + "   | eltérés");
  el("text", {x: L + 10, y: T + 52, "font-size": 11, fill: mu}, "a narancs pontot húzd, vagy írd be az x-et");
  $("status").textContent = "x = " + nm(xv, 3) + ", f(x) = " + nm(fv, 4) + ", " + S.an + " = " + nm(av, 4) + ", eltérés " + S.d + " = " + nm(fv - av, 4);
}
function toX(ev){ const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; const sx = (ev.clientX - r.left) * vb.width / r.width; return view.x0 + (view.x1 - view.x0) * (sx - L) / (R - L); }
svg.addEventListener("pointerdown", ev => { drag = true; svg.setPointerCapture(ev.pointerId); $("x").value = (Math.round(toX(ev) * 10) / 10).toString(); draw(); });
svg.addEventListener("pointermove", ev => { if (!drag) return; $("x").value = (Math.round(toX(ev) * 10) / 10).toString(); draw(); });
svg.addEventListener("pointerup", () => { drag = false; });
["fn", "x", "w"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
