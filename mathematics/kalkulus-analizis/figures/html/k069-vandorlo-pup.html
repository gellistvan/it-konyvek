<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A vándorló púp</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Index">
  <button id="prev" aria-label="n csökkentése">◀</button>
  <label for="n">n =</label><input id="n" type="range" min="1" max="50" step="1" value="10" aria-label="A sorozat indexe, n"><b id="nv"></b>
  <button id="next" aria-label="n növelése">▶</button>
  <button id="play" aria-label="Lejátszás n = 1-től 50-ig">▶ Lejátszás</button>
</div>
<div class="ctl" role="group" aria-label="Rögzített pont">
  <label for="x0">x₀ =</label><input id="x0" type="range" min="0.01" max="1" step="0.01" value="0.2" aria-label="A rögzített pont, x0"><b id="xv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 365" role="img" aria-label="Az n²x·e^(−nx) függvények púpja egyre magasabb és keskenyebb, a terület 1-hez tart, a függvényérték minden rögzített x > 0-ban 0-hoz"></svg>
<p class="small">∫₀¹ f_n = 1 − (n+1)e^(−n) → 1, a csúcs (1/n, n/e), minden x > 0-ra f_n(x) → 0, így lim ∫ f_n = 1 ≠ 0 = ∫ lim f_n. A felső panel függőleges skálája n-nel együtt nő; az alsó panelen az f_n(x₀) értékek 3 fölött levágva. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function f(n, x){ return n*n*x*Math.exp(-n*x); }
function I(n){ return 1 - (n + 1)*Math.exp(-n); }
const X0 = 50, PW = 490;
let timer = null;
function draw(){
  const n = +$("n").value, x0 = +$("x0").value; $("nv").textContent = n; $("xv").textContent = fmt(x0, 2);
  svg.innerHTML = ""; const fg = css("--fg"), mu = css("--muted");
  const hi = Math.max(1.5, n/Math.E*1.12), Y0 = 24, PH = 175;
  const px = x => X0 + x*PW, py = y => Y0 + (hi - y)/hi*PH;
  el("text", {x: X0, y: 14, "font-size": 12}, "(a) f_n(x) = n²x·e^(−nx), a terület kitöltve");
  const P = [px(0) + "," + py(0)];
  for (let i = 0; i <= 800; i++) { const x = i/800; P.push(px(x) + "," + py(f(n, x))); }
  P.push(px(1) + "," + py(0));
  el("polygon", {points: P.join(" "), fill: css("--fill"), stroke: "none"});
  el("polyline", {points: P.slice(1, -1).join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 2});
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: mu});
  el("line", {x1: px(x0), y1: Y0, x2: px(x0), y2: py(0), stroke: fg, "stroke-dasharray": "2 3"});
  el("circle", {cx: px(1/n), cy: py(n/Math.E), r: 4.5, fill: css("--bg"), stroke: fg, "stroke-width": 1.8});
  el("circle", {cx: px(x0), cy: py(f(n, x0)), r: 4, fill: css("--hl2"), stroke: "none"});
  [0, 0.2, 0.4, 0.6, 0.8, 1].forEach(v => el("text", {x: px(v), y: Y0 + PH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, fmt(v, 1)));
  [0, n/Math.E].forEach(v => el("text", {x: X0 - 4, y: py(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, fmt(v, 2)));
  // alsó panel: n = 1..50
  const B0 = 245, BH = 100, bhi = 3, bx = k => X0 + (k - 0.5)/50*PW, by = y => B0 + (bhi - Math.min(y, bhi))/bhi*BH;
  el("text", {x: B0 > 0 ? X0 : 0, y: B0 - 8, "font-size": 12}, "(b) négyzet: ∫ f_n (→ 1); háromszög: f_n(x₀) (→ 0); pontozott: 1");
  el("line", {x1: X0, y1: by(1), x2: X0 + PW, y2: by(1), stroke: mu, "stroke-dasharray": "2 3"});
  el("line", {x1: X0, y1: by(0), x2: X0 + PW, y2: by(0), stroke: mu});
  for (let k = 1; k <= 50; k++) {
    const on = k === n, s = on ? 5 : 3;
    el("rect", {x: bx(k) - s/2, y: by(I(k)) - s/2, width: s, height: s, fill: on ? css("--hl2") : fg});
    const v = f(k, x0), yy = by(v);
    el("path", {d: `M${bx(k)},${yy - s/1.2}L${bx(k) + s/1.6},${yy + s/2}L${bx(k) - s/1.6},${yy + s/2}Z`, fill: on ? css("--hl2") : "none", stroke: on ? css("--hl2") : mu});
  }
  [1, 10, 20, 30, 40, 50].forEach(k => el("text", {x: bx(k), y: B0 + BH + 14, "font-size": 11, "text-anchor": "middle", fill: mu}, String(k)));
  [0, 1, 2, 3].forEach(v => el("text", {x: X0 - 4, y: by(v) + 4, "font-size": 11, "text-anchor": "end", fill: mu}, String(v)));
  $("status").textContent = "n = " + n + ": ∫ = " + fmt(I(n), 5) + ", max = n/e = " + fmt(n/Math.E, 3) + " az x = " + fmt(1/n, 3)
    + " helyen, f_n(" + fmt(x0, 2) + ") = " + fmt(f(n, x0), 3);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ Lejátszás"; } }
$("n").addEventListener("input", () => { stop(); draw(); }); $("x0").addEventListener("input", draw);
$("prev").onclick = () => { stop(); $("n").value = Math.max(1, +$("n").value - 1); draw(); };
$("next").onclick = () => { stop(); $("n").value = Math.min(50, +$("n").value + 1); draw(); };
$("play").onclick = () => {
  if (timer) { stop(); return; }
  if (+$("n").value >= 50) $("n").value = 1;
  $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { const v = +$("n").value; if (v >= 50) { stop(); return; } $("n").value = v + 1; draw(); }, 250);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
