<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sin x / x: két háromszög és a körcikk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Szög">
  <label for="x">x =</label><input id="x" type="range" min="0.05" max="1.5" step="0.01" value="0.8" aria-label="x radiánban"><b id="xv"></b> rad
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 580 380" role="img" aria-label="Negyed egységkör; a kis háromszög a körcikkben, a körcikk a nagy háromszögben van"></svg>
<p class="small">A területek láncolata ½ sin x ≤ ½ x ≤ ½ tg x minden 0 < x < π/2-re teljesül; sin x-szel osztva és reciprokot véve cos x ≤ sin x / x ≤ 1, ebből a rendőrelv adja a határértéket. Nagy x-nél (tg x nagy) a rajz kicsinyít. Kezdőállapot: x = 0,8 rad. Számított értékek.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

function draw(){
  const x = +$("x").value, c = Math.cos(x), s = Math.sin(x), t = Math.tan(x);
  $("xv").textContent = fmt(x, 2);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2");
  const H = Math.max(1.12, t + 0.08), sc = 320 / H, ox = 30, oy = 360;
  const P = (u, v) => (ox + sc * u).toFixed(1) + "," + (oy - sc * v).toFixed(1);
  const defs = el("defs", {});
  const pat = (id, d, col, w) => { const p = el("pattern", {id: id, width: w, height: w, patternUnits: "userSpaceOnUse"}, undefined, defs); el("path", {d: d, stroke: col, "stroke-width": 1.1, fill: "none"}, undefined, p); };
  pat("pd", "M0 6 L6 0", fg, 6); pat("pc", "M0 0 L12 12", hl2, 12);
  const dot = el("pattern", {id: "pp", width: 6, height: 6, patternUnits: "userSpaceOnUse"}, undefined, defs); el("circle", {cx: 3, cy: 3, r: 1.1, fill: hl}, undefined, dot);
  // negyedkör
  let q = []; for (let i = 0; i <= 90; i++) { const a = Math.PI / 2 * i / 90; q.push(P(Math.cos(a), Math.sin(a))); }
  el("polyline", {points: q.join(" "), fill: "none", stroke: mu});
  const bg = css("--bg");
  el("polygon", {points: [P(0, 0), P(1, 0), P(1, t)].join(" "), fill: bg});
  el("polygon", {points: [P(0, 0), P(1, 0), P(1, t)].join(" "), fill: "url(#pc)", stroke: hl2, "stroke-width": 1.5});
  let w = [P(0, 0)]; for (let i = 0; i <= 60; i++) { const a = x * i / 60; w.push(P(Math.cos(a), Math.sin(a))); }
  el("polygon", {points: w.join(" "), fill: bg});
  el("polygon", {points: w.join(" "), fill: "url(#pp)", stroke: hl, "stroke-width": 1.5});
  el("polygon", {points: [P(0, 0), P(1, 0), P(c, s)].join(" "), fill: bg});
  el("polygon", {points: [P(0, 0), P(1, 0), P(c, s)].join(" "), fill: "url(#pd)", stroke: fg, "stroke-width": 1.8});
  el("line", {x1: ox + sc * c, y1: oy, x2: ox + sc * c, y2: oy - sc * s, stroke: fg, "stroke-dasharray": "3 3"});
  [["O", 0, 0, -14, 14], ["A", 1, 0, 6, 14], ["B", c, s, -14, -6], ["C", 1, t, 8, 4]].forEach(([n, u, v, dx, dy]) => {
    el("circle", {cx: ox + sc * u, cy: oy - sc * v, r: 3.5, fill: fg}); el("text", {x: ox + sc * u + dx, y: oy - sc * v + dy, "font-size": 14}, n); });
  el("text", {x: ox + sc * c - 6, y: oy - sc * s / 2, "text-anchor": "end", "font-size": 12}, "sin x");
  el("text", {x: ox + sc + 8, y: oy - sc * t / 2, "font-size": 12, fill: hl2}, "tg x");
  const T1 = s / 2, T2 = x / 2, T3 = t / 2, R0 = 430;
  const lines = [["▨ OAB háromszög (sűrű vonalak)", fg], ["   T_OAB = ½ sin x = " + fmt(T1, 4), fg], ["⁘ OAB körcikk (pöttyözés)", hl], ["   T_cikk = ½ x = " + fmt(T2, 4), hl],
    ["▧ OAC háromszög (ritka vonalak)", hl2], ["   T_OAC = ½ tg x = " + fmt(T3, 4), hl2], ["", fg], ["cos x = " + fmt(c, 4), fg], ["sin x / x = " + fmt(s / x, 4), fg]];
  lines.forEach(([tx, col], i) => el("text", {x: R0 - 50, y: 40 + 20 * i, "font-size": 12, fill: col}, tx));
  $("status").textContent = "x = " + fmt(x, 2) + ", T_OAB = " + fmt(T1, 4) + ", T_cikk = " + fmt(T2, 4) + ", T_OAC = " + fmt(T3, 4) +
    "; cos x ≤ sin x / x ≤ 1: " + fmt(c, 4) + " ≤ " + fmt(s / x, 4) + " ≤ 1";
}
$("x").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
