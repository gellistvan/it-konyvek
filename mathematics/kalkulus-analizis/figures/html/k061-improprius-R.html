<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improprius integrál: ∫₁ᴿ x^(−p) dx, R → ∞</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Felső határ">
  <label for="r">R =</label><input id="r" type="range" min="0" max="4" step="0.01" value="1" aria-label="R tízes alapú logaritmusa (R 1 és 10000 között)"><b id="rv"></b>
  <button id="play">▶ R nő</button>
</div>
<div class="ctl" role="group" aria-label="Kitevő">
  <label for="p">p =</label><input id="p" type="range" min="0.5" max="3" step="0.1" value="2" aria-label="p kitevő"><b id="pv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 320" role="img" aria-label="Bal panel: az 1/x a p-ediken grafikonja alatt a terület 1 és R között; jobb panel: az integrál értéke R függvényében logaritmikus R-tengelyen, p > 1-re vízszintes aszimptotához tart, p = 1-re korlátlanul nő"></svg>
<p class="small">Számított érték, nem mérés. I_p(R) = (1 − R^(1−p))/(p − 1), ha p ≠ 1, és ln R, ha p = 1. Ellenőrzés: p = 2, R = 10 → 0,9; p = 1, R = 1000 → 6,908; p = 1,5, R = 100 → 1,8.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const Ip = (p, R) => Math.abs(p - 1) < 1e-9 ? Math.log(R) : (1 - Math.pow(R, 1 - p)) / (p - 1);
let timer = null;
function draw(){
  const lr = +$("r").value, R = Math.pow(10, lr), p = Math.round(+$("p").value * 10) / 10;
  $("rv").textContent = R < 100 ? fmt(R, 2) : fmt(R, 0); $("pv").textContent = fmt(p, 1);
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  // bal panel: lineáris x ∈ [1, XM]
  const XM = Math.max(10, R), L1 = 45, R1 = 265, T = 30, B = 300;
  const X1 = u => L1 + (R1 - L1) * (u - 1) / (XM - 1), Y1 = v => B - (B - T) * Math.min(v, 1.05) / 1.05;
  let d = "M" + X1(1) + "," + Y1(0); for (let i = 0; i <= 300; i++) { const u = 1 + (R - 1) * i / 300; d += "L" + X1(u).toFixed(1) + "," + Y1(Math.pow(u, -p)).toFixed(1); } d += "L" + X1(R) + "," + Y1(0) + "Z";
  el("path", {d: d, fill: css("--cellhl"), stroke: "none"});
  d = ""; for (let i = 0; i <= 300; i++) { const u = 1 + (XM - 1) * i / 300; d += (i ? "L" : "M") + X1(u).toFixed(1) + "," + Y1(Math.pow(u, -p)).toFixed(1); }
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 2.2});
  el("line", {x1: X1(R), y1: T, x2: X1(R), y2: B, stroke: hl, "stroke-dasharray": "4 3"});
  el("line", {x1: L1, y1: B, x2: R1, y2: B, stroke: mu}); el("line", {x1: L1, y1: B, x2: L1, y2: T, stroke: mu});
  el("text", {x: L1, y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, "1"); el("text", {x: R1, y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, fmt(XM, 0));
  el("text", {x: L1 - 4, y: Y1(1) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, "1");
  el("text", {x: L1, y: 18, "font-size": 12}, "y = 1/x^" + (Number.isInteger(p) ? String(p) : fmt(p, 1)) + ", terület [1, R] fölött");
  // jobb panel: log R ∈ [0, 4]
  const L2 = 320, R2 = 545, YM = 10, X2 = q => L2 + (R2 - L2) * q / 4, Y2 = v => B - (B - T) * Math.min(v, YM) / YM;
  el("text", {x: R2, y: Y2(9.6), "text-anchor": "end", "font-size": 11, fill: mu}, "vékony: p = 1 (szaggatott), p = 2");
  [0, 2, 4, 6, 8, 10].forEach(v => { el("line", {x1: L2, y1: Y2(v), x2: R2, y2: Y2(v), stroke: css("--grid")}); el("text", {x: L2 - 4, y: Y2(v) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, String(v)); });
  [0, 1, 2, 3, 4].forEach(q => el("text", {x: X2(q), y: B + 15, "text-anchor": "middle", "font-size": 11, fill: mu}, String(Math.pow(10, q))));
  const curve = (pp, at) => { let dd = ""; for (let i = 0; i <= 200; i++) { const q = 4 * i / 200; dd += (i ? "L" : "M") + X2(q).toFixed(1) + "," + Y2(Ip(pp, Math.pow(10, q))).toFixed(1); } el("path", Object.assign({d: dd, fill: "none"}, at)); };
  curve(1, {stroke: mu, "stroke-width": 1, "stroke-dasharray": "5 3"}); curve(2, {stroke: mu, "stroke-width": 1});
  curve(p, {stroke: fg, "stroke-width": 2.4});
  if (p > 1 && 1 / (p - 1) <= YM) el("line", {x1: L2, y1: Y2(1 / (p - 1)), x2: R2, y2: Y2(1 / (p - 1)), stroke: fg, "stroke-dasharray": "2 3"});
  el("circle", {cx: X2(lr), cy: Y2(Ip(p, R)), r: 5, fill: hl});
  el("text", {x: L2, y: 18, "font-size": 12}, "I_p(R) = ∫₁ᴿ x^(−p) dx");
  const v = Ip(p, R);
  $("status").textContent = "p = " + fmt(p, 1) + ", R = " + (R < 100 ? fmt(R, 2) : fmt(R, 0)) + ": ∫₁ᴿ = " + fmt(v, 4) + ";  " +
    (p > 1 ? "határérték 1/(p−1) = " + fmt(1 / (p - 1), 4) : "divergens: az érték minden határon túl nő");
}
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ R nő"; }
["r", "p"].forEach(id => $(id).addEventListener("input", () => { stopPlay(); draw(); }));
$("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  let q = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { $("r").value = q; draw(); q = Math.round((q + 0.05) * 100) / 100; if (q > 4) stopPlay(); }, 100);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
