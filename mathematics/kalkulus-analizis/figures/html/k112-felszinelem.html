<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felszínelem: cella és érintő paralelogramma a gömbön</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Cella">
  <label for="d">Δ =</label><input id="d" type="range" min="2" max="30" step="1" value="15" aria-label="cellaméret fokban"><b id="dv"></b>
  <label for="t0">ϑ0 =</label><input id="t0" type="range" min="0" max="150" step="5" value="60" aria-label="a cella ϑ0 kezdőszöge fokban"><b id="t0v"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalon a paramétersík rácsa egy kiemelt cellával, középen a gömb a cella görbült képével, jobbra nagyítva a görbült cella és az érintővektorok által kifeszített paralelogramma"></svg>
<p class="small">R = 1, φ0 = 30°. Kezdőállapot: Δ = 15°, ϑ0 = 60°: pontos cellaterület ≈ 0,0631, közelítés ≈ 0,0594. A Δ csökkentésével az arány 1-hez tart. Ortografikus vetület az (1; 1; 0,6) irányból. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

let DEG = 15, T0 = 60; const P0 = 30, rad = d => d * Math.PI / 180;
const dv = (() => { const v = [1, 1, 0.6], n = Math.hypot(...v); return v.map(x => x / n); })();
const e1 = [-1 / Math.SQRT2, 1 / Math.SQRT2, 0];
const e2 = (() => { const c = [dv[1] * e1[2] - dv[2] * e1[1], dv[2] * e1[0] - dv[0] * e1[2], dv[0] * e1[1] - dv[1] * e1[0]], n = Math.hypot(...c); return c.map(x => x / n); })();
const R3 = (t, p) => [Math.sin(t) * Math.cos(p), Math.sin(t) * Math.sin(p), Math.cos(t)];
const pr = P => [P[0] * e1[0] + P[1] * e1[1] + P[2] * e1[2], P[0] * e2[0] + P[1] * e2[1] + P[2] * e2[2]];
const vis = P => P[0] * dv[0] + P[1] * dv[1] + P[2] * dv[2] >= 0;
const add = (a, b) => a.map((x, i) => x + b[i]);
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), fi = css("--fill"), gr = css("--grid");
  $("dv").textContent = DEG + "°"; $("t0v").textContent = T0 + "°";
  const t0 = rad(T0), d = rad(DEG), p0 = rad(P0);
  // (a) paramétersík: ϑ 0..180, φ 0..90
  const L = 30, Tp = 40, w = 170, h = 85, PX = t => L + w * t / 180, PY = p => Tp + h - h * p / 90;
  for (let t = 0; t <= 180; t += 15) el("line", {x1: PX(t), y1: PY(0), x2: PX(t), y2: PY(90), stroke: gr});
  for (let p = 0; p <= 90; p += 15) el("line", {x1: PX(0), y1: PY(p), x2: PX(180), y2: PY(p), stroke: gr});
  el("rect", {x: PX(0), y: PY(90), width: w, height: h, fill: "none", stroke: mu});
  el("rect", {x: PX(T0), y: PY(Math.min(90, P0 + DEG)), width: PX(Math.min(180, T0 + DEG)) - PX(T0), height: PY(P0) - PY(Math.min(90, P0 + DEG)), fill: fi, stroke: fg, "stroke-width": 1.6});
  [0, 90, 180].forEach(t => el("text", {x: PX(t), y: PY(0) + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, t + "°"));
  [0, 90].forEach(p => el("text", {x: L - 4, y: PY(p) + 4, "text-anchor": "end", "font-size": 11, fill: mu}, p + "°"));
  el("text", {x: L + w / 2, y: PY(0) + 30, "text-anchor": "middle", "font-size": 12}, "ϑ  (paramétersík; φ függőleges)");
  // (b) gömb
  const cx = 320, cy = 170, k = 110, X = q => cx + k * q[0], Y = q => cy - k * q[1];
  el("circle", {cx, cy, r: k, fill: "none", stroke: fg, "stroke-width": 1.2});
  const curve = (f, n) => { let seg = []; const out = []; for (let i = 0; i <= n; i++) { const P = f(i / n); if (vis(P)) { const q = pr(P); seg.push(X(q).toFixed(1) + "," + Y(q).toFixed(1)); } else if (seg.length) { out.push(seg); seg = []; } } if (seg.length) out.push(seg); return out; };
  for (let t = 15; t < 180; t += 15) curve(s => R3(rad(t), 2 * Math.PI * s), 120).forEach(sg => el("polyline", {points: sg.join(" "), fill: "none", stroke: gr, "stroke-width": 0.8}));
  for (let p = 0; p < 360; p += 15) curve(s => R3(Math.PI * s, rad(p)), 90).forEach(sg => el("polyline", {points: sg.join(" "), fill: "none", stroke: gr, "stroke-width": 0.8}));
  const cellP = []; const n = 30;
  for (let i = 0; i <= n; i++) cellP.push(R3(t0 + d * i / n, p0));
  for (let i = 0; i <= n; i++) cellP.push(R3(t0 + d, p0 + d * i / n));
  for (let i = n; i >= 0; i--) cellP.push(R3(t0 + d * i / n, p0 + d));
  for (let i = n; i >= 0; i--) cellP.push(R3(t0, p0 + d * i / n));
  const A = R3(t0, p0), rt = [Math.cos(t0) * Math.cos(p0) * d, Math.cos(t0) * Math.sin(p0) * d, -Math.sin(t0) * d], rp = [-Math.sin(t0) * Math.sin(p0) * d, Math.sin(t0) * Math.cos(p0) * d, 0];
  const par = [A, add(A, rt), add(add(A, rt), rp), add(A, rp)];
  const visible = vis(A);
  el("polygon", {points: cellP.map(P => { const q = pr(P); return X(q).toFixed(1) + "," + Y(q).toFixed(1); }).join(" "), fill: fi, stroke: fg, "stroke-width": 1.4, opacity: visible ? 1 : 0.35});
  // nagyítás
  const Q = cellP.map(pr), qx = Q.map(q => q[0]), qy = Q.map(q => q[1]);
  const mx = (Math.min(...qx) + Math.max(...qx)) / 2, my = (Math.min(...qy) + Math.max(...qy)) / 2;
  const span = Math.max(Math.max(...qx) - Math.min(...qx), Math.max(...qy) - Math.min(...qy), 1e-6) * 1.35;
  const zx = 455, zy = 60, zs = 100, ZX = q => zx + zs / 2 + (q[0] - mx) / span * zs, ZY = q => zy + zs / 2 - (q[1] - my) / span * zs;
  el("rect", {x: zx, y: zy, width: zs, height: zs, fill: "none", stroke: mu});
  el("text", {x: zx + zs / 2, y: zy + zs + 14, "text-anchor": "middle", "font-size": 11, fill: mu}, "nagyítás");
  el("polygon", {points: Q.map(q => ZX(q).toFixed(1) + "," + ZY(q).toFixed(1)).join(" "), fill: fi, stroke: fg, "stroke-width": 1.4});
  el("polygon", {points: par.map(pr).map(q => ZX(q).toFixed(1) + "," + ZY(q).toFixed(1)).join(" "), fill: "none", stroke: hl2, "stroke-width": 1.8, "stroke-dasharray": "5 3"});
  const qa = pr(A), q1 = pr(add(A, rt)), q2 = pr(add(A, rp));
  el("line", {x1: ZX(qa), y1: ZY(qa), x2: ZX(q1), y2: ZY(q1), stroke: hl, "stroke-width": 2.2});
  el("line", {x1: ZX(qa), y1: ZY(qa), x2: ZX(q2), y2: ZY(q2), stroke: hl, "stroke-width": 2.2, "stroke-dasharray": "4 3"});
  el("text", {x: zx - 4, y: zy + zs + 34, "font-size": 11, fill: hl}, "— r_ϑΔϑ   - - r_φΔφ");
  el("text", {x: zx - 4, y: zy + zs + 50, "font-size": 11, fill: hl2}, "- - paralelogramma");
  const ex = (Math.cos(t0) - Math.cos(t0 + d)) * d, ap = Math.sin(t0) * d * d;
  $("status").innerHTML = "cella: ϑ ∈ [" + T0 + "°; " + (T0 + DEG) + "°], φ ∈ [30°; " + (30 + DEG) + "°]" + (visible ? "" : " (a gömb túloldalán, halványan)") +
    "<br>pontos cellaterület = (cos ϑ0 − cos(ϑ0 + Δ))·Δ = " + fmt(ex, 6) + ",  |r_ϑ × r_φ|ΔϑΔφ = sin ϑ0·Δ² = " + fmt(ap, 6) + ",  arány = " + (ap > 0 ? fmt(ex / ap, 4) : "— (sin ϑ0 = 0)");
}
$("d").addEventListener("input", () => { DEG = +$("d").value; draw(); });
$("t0").addEventListener("input", () => { T0 = +$("t0").value; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
