<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gradiens-ereszkedés: lépésköz és kondicionáltság</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020;--lev:#888}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a;--lev:#8a8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.box{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.box span{display:block;padding:0 4px}
pre.box span.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="eta">η =</label><input id="eta" type="range" min="0.01" max="0.3" step="0.01" value="0.2" aria-label="Lépésköz"><b id="etav" style="min-width:3em"></b>
  <label for="M">M =</label><input id="M" type="range" min="2" max="50" step="1" value="8" aria-label="Az A mátrix második sajátértéke"><b id="Mv" style="min-width:2em"></b>
</div>
<div class="ctl" role="group" aria-label="Lépések">
  <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
  <span id="info" class="small"></span>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 310" role="img" aria-label="Ellipszis-szintvonalak az iterációs pályával és a hiba normájának log-skálás grafikonja"></svg>
<pre class="box" id="formula" aria-label="Az iterációs képlet aktuális értékekkel"></pre>
<p class="small">f(x, y) = (m x² + M y²)/2 az A = diag(m; M) mátrixszal, m = 2; M = 8 esetén f = x² + 4y² (a 2. feladat). Kezdőpont (2; 2), legfeljebb 30 lépés; a hiba e_k = x_k − x*, x* = (0; 0). η ≥ 2/M esetén a hiba nem csökken. Számított iteráció, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function nf(x, d){ let s = fmt(x, d === undefined ? 4 : d); if (s.indexOf(",") >= 0) s = s.replace(/0+$/, "").replace(/,$/, ""); return s; }
const $ = id => document.getElementById(id);

function contourPath(F, x0, x1, y0, y1, N, L, X, Y){
  if (!contourPath.cache || contourPath.cache.F !== F || contourPath.cache.key !== [x0,x1,y0,y1,N].join()) {
    const v = [];
    for (let i = 0; i <= N; i++) { v.push([]); for (let j = 0; j <= N; j++) v[i].push(F(x0 + (x1 - x0) * i / N, y0 + (y1 - y0) * j / N)); }
    contourPath.cache = {F: F, key: [x0,x1,y0,y1,N].join(), v: v};
  }
  const v = contourPath.cache.v, dx = (x1 - x0) / N, dy = (y1 - y0) / N;
  let d = "";
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const c = [[i, j], [i + 1, j], [i + 1, j + 1], [i, j + 1]], pts = [];
    for (let e = 0; e < 4; e++) {
      const p = c[e], q = c[(e + 1) % 4], a = v[p[0]][p[1]], b = v[q[0]][q[1]];
      if (!isFinite(a) || !isFinite(b)) continue;
      if ((a < L) !== (b < L)) { const t = (L - a) / (b - a);
        pts.push([x0 + dx * (p[0] + t * (q[0] - p[0])), y0 + dy * (p[1] + t * (q[1] - p[1]))]); }
    }
    for (let m = 0; m + 1 < pts.length; m += 2)
      d += "M" + X(pts[m][0]).toFixed(1) + "," + Y(pts[m][1]).toFixed(1) + "L" + X(pts[m + 1][0]).toFixed(1) + "," + Y(pts[m + 1][1]).toFixed(1);
  }
  return d;
}


const m = 2, NMAX = 30;
let eta = 0.2, M = 8, K = 1, timer = null, P = [];
const F = (x, y) => (m * x * x + M * y * y) / 2;
function compute(){ P = [[2, 2]]; for (let k = 0; k < NMAX; k++) { const [x, y] = P[k]; P.push([x - eta * m * x, y - eta * M * y]); } }
function draw(){
  svg.innerHTML = "";
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const S = 270, L = 10, T = 15, X = v => L + S * (v + 2.5) / 5, Y = v => T + S - S * (v + 2.5) / 5;
  el("rect", {x: L, y: T, width: S, height: S, fill: "none", stroke: mu});
  const Ff = (x, y) => F(x, y);
  [0.25, 1, 2.5, 5, 10, 15, 25].map(c => c * M / 8).forEach(c => el("path", {d: contourPath(Ff, -2.5, 2.5, -2.5, 2.5, 70, c, X, Y), stroke: css("--lev"), fill: "none"}));
  contourPath.cache = null;
  const clip = v => Math.max(-2.6, Math.min(2.6, v));
  const pts = P.slice(0, K + 1);
  el("polyline", {points: pts.map(p => X(clip(p[0])).toFixed(1) + "," + Y(clip(p[1])).toFixed(1)).join(" "), fill: "none", stroke: fg, "stroke-width": 1.6});
  pts.forEach((p, i) => { if (Math.abs(p[0]) <= 2.5 && Math.abs(p[1]) <= 2.5) el("circle", {cx: X(p[0]), cy: Y(p[1]), r: i === K ? 6 : 3.5, fill: i === K ? hl : css("--bg"), stroke: fg, "stroke-width": 1.2}); });
  el("line", {x1: X(0) - 6, y1: Y(0), x2: X(0) + 6, y2: Y(0), stroke: fg}); el("line", {x1: X(0), y1: Y(0) - 6, x2: X(0), y2: Y(0) + 6, stroke: fg});
  const pk = P[K]; if (Math.abs(pk[0]) > 2.5 || Math.abs(pk[1]) > 2.5) el("text", {x: L + S / 2, y: T + 16, "text-anchor": "middle", "font-size": 12, fill: css("--err")}, "x_k kilépett a nézetből");
  el("text", {x: L + S / 2, y: T + S + 16, "text-anchor": "middle", "font-size": 12}, "f = x²·m/2 + y²·M/2 szintvonalai");
  // hiba log-skálán
  const L2 = 330, W2 = 220, T2 = 15, H2 = 270, e = P.map(p => Math.hypot(p[0], p[1]));
  const lo = -4, hi = 3, ex = k => L2 + W2 * k / NMAX, ey = v => T2 + H2 - H2 * (Math.max(lo, Math.min(hi, Math.log10(v))) - lo) / (hi - lo);
  el("rect", {x: L2, y: T2, width: W2, height: H2, fill: "none", stroke: mu});
  for (let d = lo; d <= hi; d++) { el("line", {x1: L2, y1: ey(Math.pow(10, d)), x2: L2 + W2, y2: ey(Math.pow(10, d)), stroke: css("--grid")});
    el("text", {x: L2 - 4, y: ey(Math.pow(10, d)) + 4, "text-anchor": "end", "font-size": 10, fill: mu}, nf(Math.pow(10, d), 4)); }
  el("polyline", {points: e.map((v, k) => ex(k).toFixed(1) + "," + ey(v).toFixed(1)).join(" "), fill: "none", stroke: mu, "stroke-width": 1, "stroke-dasharray": "3 3"});
  el("polyline", {points: e.slice(0, K + 1).map((v, k) => ex(k).toFixed(1) + "," + ey(v).toFixed(1)).join(" "), fill: "none", stroke: fg, "stroke-width": 2});
  el("circle", {cx: ex(K), cy: ey(e[K]), r: 5, fill: hl, stroke: fg});
  el("text", {x: L2 + W2 / 2, y: T2 + H2 + 16, "text-anchor": "middle", "font-size": 12}, "‖e_k‖ (log), k = 0…" + NMAX);
  const rho = Math.max(Math.abs(1 - eta * m), Math.abs(1 - eta * M));
  $("etav").textContent = nf(eta, 2); $("Mv").textContent = String(M);
  $("info").textContent = "2/M = " + nf(2 / M, 4) + ", η* = 2/(m+M) = " + nf(2 / (m + M), 4) + ", max|1 − ηλ| = " + nf(rho, 4) + (rho >= 1 ? " ≥ 1: nem konvergál" : " < 1: konvergál");
  const [x, y] = P[K - 1], g = [m * x, M * y];
  $("formula").textContent = "x_{k+1} = x_k − η ∇f(x_k),   ∇f(x, y) = (" + m + "x; " + M + "y)\n"
    + "k = " + (K - 1) + ":  x_k = (" + fmt(x, 4) + "; " + fmt(y, 4) + "),  ∇f(x_k) = (" + fmt(g[0], 4) + "; " + fmt(g[1], 4) + ")\n"
    + "x_" + K + " = (" + fmt(x, 4) + "; " + fmt(y, 4) + ") − " + nf(eta, 2) + "·(" + fmt(g[0], 4) + "; " + fmt(g[1], 4) + ") = (" + fmt(P[K][0], 4) + "; " + fmt(P[K][1], 4) + ")";
  $("status").textContent = "k = " + K + ", x_k = (" + fmt(P[K][0], 4) + "; " + fmt(P[K][1], 4) + "), f(x_k) = " + nf(F(P[K][0], P[K][1]), 4) + ", ‖e_k‖ = " + nf(e[K], 4);
}
function go(k){ K = Math.max(1, Math.min(NMAX, k)); draw(); }
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("eta").addEventListener("input", () => { eta = +$("eta").value; compute(); draw(); });
$("M").addEventListener("input", () => { M = +$("M").value; compute(); draw(); });
$("first").addEventListener("click", () => { stopPlay(); go(1); });
$("prev").addEventListener("click", () => { stopPlay(); go(K - 1); });
$("next").addEventListener("click", () => { stopPlay(); go(K + 1); });
$("play").addEventListener("click", () => { if (timer) { stopPlay(); return; } if (K >= NMAX) K = 0;
  $("play").textContent = "⏸ Szünet"; timer = setInterval(() => { go(K + 1); if (K >= NMAX) stopPlay(); }, 500); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
compute(); draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
