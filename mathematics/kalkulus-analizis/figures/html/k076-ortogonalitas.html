<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ortogonalitás előjeles területként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e2e2e2;--fill:#e8e8e8;--err:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#3a3a3a;--fill:#333;--err:#ff8a8a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
input[type=number],input[type=text]{font:inherit;width:6.5em}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-variant-numeric:tabular-nums}
.err{color:var(--err);font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Első tényező">
  <label for="t1">első tényező:</label><select id="t1"><option value="cos" selected>cos</option><option value="sin">sin</option></select>
  <label for="m">m =</label><input id="m" type="range" min="0" max="6" step="1" value="2" aria-label="Az első tényező frekvenciája, m"><b id="mv"></b>
</div>
<div class="ctl" role="group" aria-label="Második tényező">
  <label for="t2">második tényező:</label><select id="t2"><option value="cos" selected>cos</option><option value="sin">sin</option></select>
  <label for="n">n =</label><input id="n" type="range" min="0" max="6" step="1" value="3" aria-label="A második tényező frekvenciája, n"><b id="nv"></b>
</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 295" role="img" aria-label="Két trigonometrikus függvény szorzata a [−π, π] intervallumon, a pozitív rész vonalkázva, a negatív pontozva; különböző frekvenciáknál a kettő kiegyenlíti egymást"></svg>
<p class="small">A k = 0 frekvencia a konstans 1 (cos) vagy 0 (sin) függvény. Az integrál 1200 részintervallumos Simpson-szabállyal; a tétel szerint m ≠ n esetén 0, cos·cos és sin·sin esetén m = n ≥ 1-re π, sin·cos esetén mindig 0. A szaggatott vonal a cos² és sin² átlaga, 1/2. Számított értékek, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x, d){ let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
const $ = id => document.getElementById(id);

const X0 = 50, PW = 490, Y0 = 20, PH = 250, YL = -1.2, YH = 1.2;
const px = x => X0 + (x + Math.PI)/(2*Math.PI)*PW, py = y => Y0 + (YH - y)/(YH - YL)*PH;
function g(t, k, x){ return t === "cos" ? Math.cos(k*x) : Math.sin(k*x); }
function draw(){
  const m = +$("m").value, n = +$("n").value, t1 = $("t1").value, t2 = $("t2").value;
  $("mv").textContent = m; $("nv").textContent = n;
  const fg = css("--fg"), mu = css("--muted");
  svg.innerHTML = "";
  const defs = el("defs", {});
  const p1 = el("pattern", {id: "ph", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 6, stroke: fg, "stroke-width": 1.2}, undefined, p1);
  const p2 = el("pattern", {id: "pn", width: 5, height: 5, patternUnits: "userSpaceOnUse"}, undefined, defs);
  el("circle", {cx: 2.5, cy: 2.5, r: 0.9, fill: fg}, undefined, p2);
  const M = 1200, h = 2*Math.PI/M; let ip = 0, ineg = 0;
  const P = [], N = [], C = [];
  for (let i = 0; i <= M; i++) {
    const x = -Math.PI + i*h, v = g(t1, m, x)*g(t2, n, x);
    const w = (i === 0 || i === M) ? 1 : (i % 2 ? 4 : 2);
    if (v > 0) ip += w*v; else ineg += w*v;
    P.push(px(x) + "," + py(Math.max(v, 0))); N.push(px(x) + "," + py(Math.min(v, 0))); C.push(px(x) + "," + py(v));
  }
  ip *= h/3; ineg *= h/3;
  const base = px(Math.PI) + "," + py(0) + " " + px(-Math.PI) + "," + py(0);
  el("polygon", {points: P.join(" ") + " " + base, fill: "url(#ph)", "fill-opacity": 0.75, stroke: "none"});
  el("polygon", {points: N.join(" ") + " " + base, fill: "url(#pn)", "fill-opacity": 0.85, stroke: "none"});
  el("line", {x1: X0, y1: py(0), x2: X0 + PW, y2: py(0), stroke: mu});
  if (t1 === t2 && m === n && m > 0) el("line", {x1: X0, y1: py(0.5), x2: X0 + PW, y2: py(0.5), stroke: fg, "stroke-dasharray": "6 4"});
  el("polyline", {points: C.join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 2});
  [[-Math.PI, "−π"], [-Math.PI/2, "−π/2"], [0, "0"], [Math.PI/2, "π/2"], [Math.PI, "π"]].forEach(q => {
    el("line", {x1: px(q[0]), y1: py(0) - 3, x2: px(q[0]), y2: py(0) + 3, stroke: mu});
    el("text", {x: px(q[0]), y: Y0 + PH + 16, "font-size": 12, "text-anchor": "middle", fill: mu}, q[1]); });
  [-1, 0, 1].forEach(v => el("text", {x: X0 - 6, y: py(v) + 4, "font-size": 12, "text-anchor": "end", fill: mu}, fmt(v, 0)));
  const name = (t, k) => k === 0 ? (t === "cos" ? "1" : "0") : t + "(" + (k === 1 ? "" : k) + "x)";
  el("text", {x: X0 + 4, y: Y0 + 2, "font-size": 13}, name(t1, m) + " · " + name(t2, n) + "   (vonalkázott: pozitív, pontozott: negatív rész)");
  const I = ip + ineg;
  $("status").textContent = "∫ " + name(t1, m) + "·" + name(t2, n) + " dx a [−π, π]-n = " + fmt(I, 3)
    + "  (pozitív rész +" + fmt(ip, 3) + ", negatív rész " + fmt(ineg, 3) + ")"
    + (Math.abs(I) < 5e-4 ? " → ortogonálisak" : (Math.abs(I - Math.PI) < 5e-4 ? " = π" : (Math.abs(I - 2*Math.PI) < 5e-4 ? " = 2π" : "")));
}
["m", "n"].forEach(id => $(id).addEventListener("input", draw));
["t1", "t2"].forEach(id => $(id).addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
