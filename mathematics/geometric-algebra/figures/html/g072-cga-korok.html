<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két kör CGA-ban: meet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="cx">K2 középpontja: x = <b id="cxv">1</b></label><input id="cx" type="range" min="0" max="2.5" step="0.05" value="1" aria-label="A második kör középpontjának x-koordinátája" style="max-width:180px"><label for="rr">sugár r = <b id="rv">1</b></label><input id="rr" type="range" min="0.25" max="2.5" step="0.05" value="1" aria-label="A második kör sugara" style="max-width:180px"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két egymást metsző egységkör az origó és az (1,0) középponttal, a három definiáló ponttal és a két metszésponttal (0,5; ±0,866)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az öt lépés a 23.1.6 kódját követi; a kiírások a ga.py repr-formátumában vannak (a 2. és 4. lépés a fejezet várt kimenetével egyezik). A K2 kör középpontja és sugara állítható: két metszéspont (M² > 0), érintés (M² = 0) vagy képzetes pontpár (M² < 0). A böngésző a ga.py szorzótábláját használja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "line": 0, "msg": "(1) P1 = 1.0000e1 + 1.0000e0 + 0.5000einf,  P2 = 1.0000e2 + 1.0000e0 + 0.5000einf,  P3 = -1.0000e1 + 1.0000e0 + 0.5000einf", "cx": 1.0, "r": 1.0, "pts": []}, {"ph": 2, "line": 1, "msg": "(2) K = P1∧P2∧P3,  C1 = K*:  C1 = 2.0000e0 - 1.0000einf", "cx": 1.0, "r": 1.0, "pts": []}, {"ph": 3, "line": 2, "msg": "(3) C2 = P(1, 0) − ½·1·einf:  C2 = 1.0000e1 + 1.0000e0", "cx": 1.0, "r": 1.0, "pts": []}, {"ph": 4, "line": 3, "pts": [[0.5, 0.8660254037844386], [0.5, -0.8660254037844386]], "msg": "(4) M = (C1∧C2)*:  M = -1.0000e12 + 2.0000e20 + 1.0000e2inf;  M² = 3 → valós pontpár (M² > 0)", "cx": 1.0, "r": 1.0}, {"ph": 5, "line": 4, "pts": [[0.5, 0.8660254037844386], [0.5, -0.8660254037844386]], "msg": "(5) ellenőrzés: max |P±∧M| = 1.1e-16 < 1e-8", "cx": 1.0, "r": 1.0}];
const CODE = ["P1, P2, P3 = point(1, 0), point(0, 1), point(-1, 0)", "K = P1 ^ P2 ^ P3;  C1 = K.dual()", "C2 = point(cx, 0) - 0.5 * r*r * einf", "M = (C1 ^ C2).dual()", "assert (Pplus ^ M).max_coeff() < 1e-8 and (Pminus ^ M).max_coeff() < 1e-8"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const GA = {"PT": [[[[0, 1.0]], [[1, 1.0]], [[2, 1.0]], [[3, 1.0]], [[4, 1.0]], [[5, 1.0]], [[6, 1.0]], [[7, 1.0]], [[8, 1.0]], [[9, 1.0]], [[10, 1.0]], [[11, 1.0]], [[12, 1.0]], [[13, 1.0]], [[14, 1.0]], [[15, 1.0]]], [[[1, 1.0]], [[0, 1.0]], [[3, 1.0]], [[2, 1.0]], [[5, 1.0]], [[4, 1.0]], [[7, 1.0]], [[6, 1.0]], [[9, 1.0]], [[8, 1.0]], [[11, 1.0]], [[10, 1.0]], [[13, 1.0]], [[12, 1.0]], [[15, 1.0]], [[14, 1.0]]], [[[2, 1.0]], [[3, -1.0]], [[0, 1.0]], [[1, -1.0]], [[6, 1.0]], [[7, -1.0]], [[4, 1.0]], [[5, -1.0]], [[10, 1.0]], [[11, -1.0]], [[8, 1.0]], [[9, -1.0]], [[14, 1.0]], [[15, -1.0]], [[12, 1.0]], [[13, -1.0]]], [[[3, 1.0]], [[2, -1.0]], [[1, 1.0]], [[0, -1.0]], [[7, 1.0]], [[6, -1.0]], [[5, 1.0]], [[4, -1.0]], [[11, 1.0]], [[10, -1.0]], [[9, 1.0]], [[8, -1.0]], [[15, 1.0]], [[14, -1.0]], [[13, 1.0]], [[12, -1.0]]], [[[4, 1.0]], [[5, -1.0]], [[6, -1.0]], [[7, 1.0]], [], [], [], [], [[0, -1.0], [12, 1.0]], [[1, 1.0], [13, -1.0]], [[2, 1.0], [14, -1.0]], [[3, -1.0], [15, 1.0]], [[4, 1.0]], [[5, -1.0]], [[6, -1.0]], [[7, 1.0]]], [[[5, 1.0]], [[4, -1.0]], [[7, -1.0]], [[6, 1.0]], [], [], [], [], [[1, -1.0], [13, 1.0]], [[0, 1.0], [12, -1.0]], [[3, 1.0], [15, -1.0]], [[2, -1.0], [14, 1.0]], [[5, 1.0]], [[4, -1.0]], [[7, -1.0]], [[6, 1.0]]], [[[6, 1.0]], [[7, 1.0]], [[4, -1.0]], [[5, -1.0]], [], [], [], [], [[2, -1.0], [14, 1.0]], [[3, -1.0], [15, 1.0]], [[0, 1.0], [12, -1.0]], [[1, 1.0], [13, -1.0]], [[6, 1.0]], [[7, 1.0]], [[4, -1.0]], [[5, -1.0]]], [[[7, 1.0]], [[6, 1.0]], [[5, -1.0]], [[4, -1.0]], [], [], [], [], [[3, -1.0], [15, 1.0]], [[2, -1.0], [14, 1.0]], [[1, 1.0], [13, -1.0]], [[0, 1.0], [12, -1.0]], [[7, 1.0]], [[6, 1.0]], [[5, -1.0]], [[4, -1.0]]], [[[8, 1.0]], [[9, -1.0]], [[10, -1.0]], [[11, 1.0]], [[0, -1.0], [12, -1.0]], [[1, 1.0], [13, 1.0]], [[2, 1.0], [14, 1.0]], [[3, -1.0], [15, -1.0]], [], [], [], [], [[8, -1.0]], [[9, 1.0]], [[10, 1.0]], [[11, -1.0]]], [[[9, 1.0]], [[8, -1.0]], [[11, -1.0]], [[10, 1.0]], [[1, -1.0], [13, -1.0]], [[0, 1.0], [12, 1.0]], [[3, 1.0], [15, 1.0]], [[2, -1.0], [14, -1.0]], [], [], [], [], [[9, -1.0]], [[8, 1.0]], [[11, 1.0]], [[10, -1.0]]], [[[10, 1.0]], [[11, 1.0]], [[8, -1.0]], [[9, -1.0]], [[2, -1.0], [14, -1.0]], [[3, -1.0], [15, -1.0]], [[0, 1.0], [12, 1.0]], [[1, 1.0], [13, 1.0]], [], [], [], [], [[10, -1.0]], [[11, -1.0]], [[8, 1.0]], [[9, 1.0]]], [[[11, 1.0]], [[10, 1.0]], [[9, -1.0]], [[8, -1.0]], [[3, -1.0], [15, -1.0]], [[2, -1.0], [14, -1.0]], [[1, 1.0], [13, 1.0]], [[0, 1.0], [12, 1.0]], [], [], [], [], [[11, -1.0]], [[10, -1.0]], [[9, 1.0]], [[8, 1.0]]], [[[12, 1.0]], [[13, 1.0]], [[14, 1.0]], [[15, 1.0]], [[4, -1.0]], [[5, -1.0]], [[6, -1.0]], [[7, -1.0]], [[8, 1.0]], [[9, 1.0]], [[10, 1.0]], [[11, 1.0]], [[0, 1.0]], [[1, 1.0]], [[2, 1.0]], [[3, 1.0]]], [[[13, 1.0]], [[12, 1.0]], [[15, 1.0]], [[14, 1.0]], [[5, -1.0]], [[4, -1.0]], [[7, -1.0]], [[6, -1.0]], [[9, 1.0]], [[8, 1.0]], [[11, 1.0]], [[10, 1.0]], [[1, 1.0]], [[0, 1.0]], [[3, 1.0]], [[2, 1.0]]], [[[14, 1.0]], [[15, -1.0]], [[12, 1.0]], [[13, -1.0]], [[6, -1.0]], [[7, 1.0]], [[4, -1.0]], [[5, 1.0]], [[10, 1.0]], [[11, -1.0]], [[8, 1.0]], [[9, -1.0]], [[2, 1.0]], [[3, -1.0]], [[0, 1.0]], [[1, -1.0]]], [[[15, 1.0]], [[14, -1.0]], [[13, 1.0]], [[12, -1.0]], [[7, -1.0]], [[6, 1.0]], [[5, -1.0]], [[4, 1.0]], [[11, 1.0]], [[10, -1.0]], [[9, 1.0]], [[8, -1.0]], [[3, 1.0]], [[2, -1.0]], [[1, 1.0]], [[0, -1.0]]]], "Iinv": {"15": -1.0}, "names": ["", "e1", "e2", "e12", "e0", "e10", "e20", "e120", "einf", "e1inf", "e2inf", "e12inf", "e0inf", "e10inf", "e20inf", "e120inf"]};

const NB = 16, pc = m => { let c = 0; while (m) { c += m & 1; m >>= 1; } return c; };
function gmul(A, B, wedgeOnly){ const out = {};
  for (const a in A) for (const b in B) { const ra = pc(+a), rb = pc(+b);
    for (const [m, c] of GA.PT[+a][+b]) { if (wedgeOnly && pc(m) !== ra + rb) continue; out[m] = (out[m] || 0) + A[a] * B[b] * c; } }
  return out; }
const gwedge = (A, B) => gmul(A, B, true);
const gdual = A => gmul(A, GA.Iinv, false);
function gadd(A, B, s){ s = (s === undefined) ? 1 : s; const o = Object.assign({}, A); for (const b in B) o[b] = (o[b] || 0) + s * B[b]; return o; }
const gscale = (A, k) => { const o = {}; for (const a in A) o[a] = k * A[a]; return o; };
const gmax = A => Math.max(0, ...Object.values(A).map(Math.abs));
const gscalar = A => A[0] || 0;
function grepr(A){ const t = Object.keys(A).map(Number).sort((x, y) => x - y).filter(m => Math.abs(A[m]) >= 1e-14);
  if (!t.length) return "0"; let s = "";
  t.forEach((m, i) => { const c = A[m], body = Math.abs(c).toFixed(4) + GA.names[m];
    s += i === 0 ? (c < 0 ? "-" : "") + body : (c < 0 ? " - " : " + ") + body; });
  return s; }
const E1 = {1: 1}, E2 = {2: 1}, E0 = {4: 1}, EINF = {8: 1};
const cpoint = (x, y) => ({4: 1, 1: x, 2: y, 8: 0.5 * (x * x + y * y)});
const cdot = (A, B) => gscalar(gmul(A, B));
// körmetszés euklideszi képlettel (a pontokat utána P·S = 0-val és P∧M = 0-val ellenőrizzük)
function circInter(c1, r1, c2, r2){ const dx = c2[0] - c1[0], dy = c2[1] - c1[1], d = Math.hypot(dx, dy);
  if (d < 1e-12) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h2 = r1 * r1 - a * a;
  const mx = c1[0] + a * dx / d, my = c1[1] + a * dy / d;
  if (h2 < -1e-9) return [];
  const h = Math.sqrt(Math.max(0, h2));
  if (h < 1e-9) return [[mx, my]];
  return [[mx - h * dy / d, my + h * dx / d], [mx + h * dy / d, my - h * dx / d]]; }

const hu = (x, d) => { const m = Math.pow(10, d); let v = Math.round(x * m) / m; if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); };
function trace(cx, r){
  const P1 = cpoint(1, 0), P2 = cpoint(0, 1), P3 = cpoint(-1, 0), C1 = gdual(gwedge(gwedge(P1, P2), P3));
  const C2 = gadd(cpoint(cx, 0), EINF, -0.5 * r * r), Mv = gdual(gwedge(C1, C2)), M2 = gscalar(gmul(Mv, Mv));
  const pts = circInter([0, 0], 1, [cx, 0], r), chk = Math.max(0, ...pts.map(q => gmax(gwedge(cpoint(q[0], q[1]), Mv))));
  let kind = M2 > 1e-9 ? "valós pontpár (M² > 0)" : (Math.abs(M2) <= 1e-9 ? "érintés: kétszeres pont (M² = 0)" : "képzetes pontpár (M² < 0): nincs valós metszés");
  if (gmax(Mv) < 1e-12) kind = "M = 0: a két kör egybeesik";
  const st = [{ph: 1, line: 0, msg: "(1) P1 = " + grepr(P1) + ",  P2 = " + grepr(P2) + ",  P3 = " + grepr(P3)},
    {ph: 2, line: 1, msg: "(2) K = P1∧P2∧P3,  C1 = K*:  C1 = " + grepr(C1)},
    {ph: 3, line: 2, msg: `(3) C2 = P(${hu(cx, 2)}, 0) − ½·${hu(r * r, 4)}·einf:  C2 = ` + grepr(C2)},
    {ph: 4, line: 3, pts, msg: "(4) M = (C1∧C2)*:  M = " + grepr(Mv) + `;  M² = ${hu(M2, 4)} → ${kind}`},
    {ph: 5, line: 4, pts, msg: pts.length ? "(5) ellenőrzés: max |P±∧M| = " + chk.toExponential(1).replace(/e([+-])(\d)$/, "e$10$2") + (chk < 1e-8 ? " < 1e-8" : "") : "(5) nincs valós metszéspont, amelyet ellenőrizni lehetne; M² = " + hu(M2, 4)}];
  st.forEach(x => { x.cx = cx; x.r = r; if (!x.pts) x.pts = []; });
  return st; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330"); svg.innerHTML = "";
  const sc = 92, ox = 170, oy = 165, X = x => ox + sc * x, Y = y => oy - sc * y;
  for (let g = -1; g <= 4; g++) el("line", {x1: X(g), y1: Y(-1.7), x2: X(g), y2: Y(1.7), stroke: css("--cellhl"), "stroke-width": 0.6});
  for (let g = -1; g <= 1; g++) el("line", {x1: X(-1.7), y1: Y(g), x2: X(4.2), y2: Y(g), stroke: css("--cellhl"), "stroke-width": 0.6});
  el("line", {x1: X(-1.7), y1: Y(0), x2: X(4.2), y2: Y(0), stroke: css("--muted")}); el("line", {x1: X(0), y1: Y(-1.7), x2: X(0), y2: Y(1.7), stroke: css("--muted")});
  [[1, 0, "P1"], [0, 1, "P2"], [-1, 0, "P3"]].forEach(([x, y, n]) => { el("circle", {cx: X(x), cy: Y(y), r: 6, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
    el("text", {x: X(x) + (x < 0 ? -30 : 8), y: Y(y) - 8, "font-size": 13}, n); });
  if (s.ph >= 2) { el("circle", {cx: X(0), cy: Y(0), r: sc, fill: "none", stroke: css("--fg"), "stroke-width": 2.2}); el("text", {x: X(-0.75), y: Y(-0.95), "font-size": 12}, "K1"); }
  if (s.ph >= 3) { el("circle", {cx: X(s.cx), cy: Y(0), r: sc * s.r, fill: "none", stroke: css("--hl"), "stroke-width": 2.2, "stroke-dasharray": "8 5"});
    el("path", {d: `M${X(s.cx) - 8},${Y(0)}h16M${X(s.cx)},${Y(0) - 8}v16`, stroke: css("--hl"), "stroke-width": 2}); el("text", {x: X(s.cx + s.r * 0.72) + 4, y: Y(s.r * 0.72) - 4, "font-size": 12, fill: css("--hl")}, "K2"); }
  if (s.ph >= 4) { s.pts.forEach((q, i) => { el("rect", {x: X(q[0]) - 6, y: Y(q[1]) - 6, width: 12, height: 12, fill: s.ph === 4 ? css("--hl2") : css("--fg")});
      el("text", {x: X(q[0]) + 10, y: Y(q[1]) + (q[1] >= 0 ? -8 : 18), "font-size": 12}, (s.pts.length > 1 ? (i ? "P− " : "P+ ") : "P ") + "(" + hu(q[0], 4) + "; " + hu(q[1], 4) + ")"); });
    if (s.pts.length === 2) el("line", {x1: X(s.pts[0][0]), y1: Y(s.pts[0][1]), x2: X(s.pts[1][0]), y2: Y(s.pts[1][1]), stroke: css("--fg"), "stroke-dasharray": "2 4", "stroke-width": 1.6}); }
}
function recompute(){ const cx = +document.getElementById("cx").value, r = +document.getElementById("rr").value;
  document.getElementById("cxv").textContent = hu(cx, 2); document.getElementById("rv").textContent = hu(r, 2);
  const keep = k; setSteps(trace(cx, r)); show(Math.max(keep, 3)); }
["cx", "rr"].forEach(id => document.getElementById(id).addEventListener("input", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
