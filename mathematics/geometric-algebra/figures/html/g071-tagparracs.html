<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritka szendvicsszorzat tagpárjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="th">θ = <b id="thv">60</b>°</label><input id="th" type="range" min="0" max="360" step="5" value="60" aria-label="Forgásszög fokban" style="max-width:220px"> v = (<label><input type="checkbox" id="c1" checked> v1 = 1</label> <label><input type="checkbox" id="c2" checked> v2 = 2</label> <label><input type="checkbox" id="c3" checked> v3 = 3</label>)</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két 8×8-as rács; az elsőben 6, a másodikban 8 kiemelt cella a bejárt bázispárokkal és a kimeneti pengékkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Lépésenként (◀/▶ vagy lejátszás) a szótáras MV.__mul__ minden bejárt tagpárja: XOR-maszk, előjel, járulék és részösszeg. A θ szög és a v komponensei állíthatók (v3 = 0 esetén 4 + 4 = 8 tagpár). Számított tagpárszám, nem mért futásidő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"panel": 0, "line": 0, "msg": "kezdet: R = 0.8660 - 0.5000e12 (2 komponens), v = 1.0000e1 + 2.0000e2 + 3.0000e3 (3 komponens); a rács üres"}, {"panel": 1, "a": 0, "b": 1, "o": 1, "s": 1, "line": 6, "msg": "1. szorzás, 1. tagpár: 1·e1: 0b000 ⊕ 0b001 = 0b001 → +e1, járulék 0.8660; részösszeg: 0.8660e1"}, {"panel": 1, "a": 0, "b": 2, "o": 2, "s": 1, "line": 6, "msg": "1. szorzás, 2. tagpár: 1·e2: 0b000 ⊕ 0b010 = 0b010 → +e2, járulék 1.7321; részösszeg: 0.8660e1 + 1.7321e2"}, {"panel": 1, "a": 0, "b": 4, "o": 4, "s": 1, "line": 6, "msg": "1. szorzás, 3. tagpár: 1·e3: 0b000 ⊕ 0b100 = 0b100 → +e3, járulék 2.5981; részösszeg: 0.8660e1 + 1.7321e2 + 2.5981e3"}, {"panel": 1, "a": 3, "b": 1, "o": 2, "s": -1, "line": 6, "msg": "1. szorzás, 4. tagpár: e12·e1: 0b011 ⊕ 0b001 = 0b010 → −e2, járulék 0.5000; részösszeg: 0.8660e1 + 2.2321e2 + 2.5981e3"}, {"panel": 1, "a": 3, "b": 2, "o": 1, "s": 1, "line": 6, "msg": "1. szorzás, 5. tagpár: e12·e2: 0b011 ⊕ 0b010 = 0b001 → +e1, járulék -1.0000; részösszeg: -0.1340e1 + 2.2321e2 + 2.5981e3"}, {"panel": 1, "a": 3, "b": 4, "o": 7, "s": 1, "line": 6, "msg": "1. szorzás, 6. tagpár: e12·e3: 0b011 ⊕ 0b100 = 0b111 → +e123, járulék -1.5000; részösszeg: -0.1340e1 + 2.2321e2 + 2.5981e3 - 1.5000e123"}, {"panel": 2, "a": 1, "b": 0, "o": 1, "s": 1, "line": 6, "msg": "2. szorzás, 1. tagpár: e1·1: 0b001 ⊕ 0b000 = 0b001 → +e1, járulék -0.1160; részösszeg: -0.1160e1"}, {"panel": 2, "a": 1, "b": 3, "o": 2, "s": 1, "line": 6, "msg": "2. szorzás, 2. tagpár: e1·e12: 0b001 ⊕ 0b011 = 0b010 → +e2, járulék -0.0670; részösszeg: -0.1160e1 - 0.0670e2"}, {"panel": 2, "a": 2, "b": 0, "o": 2, "s": 1, "line": 6, "msg": "2. szorzás, 3. tagpár: e2·1: 0b010 ⊕ 0b000 = 0b010 → +e2, járulék 1.9330; részösszeg: -0.1160e1 + 1.8660e2"}, {"panel": 2, "a": 2, "b": 3, "o": 1, "s": -1, "line": 6, "msg": "2. szorzás, 4. tagpár: e2·e12: 0b010 ⊕ 0b011 = 0b001 → −e1, járulék -1.1160; részösszeg: -1.2321e1 + 1.8660e2"}, {"panel": 2, "a": 4, "b": 0, "o": 4, "s": 1, "line": 6, "msg": "2. szorzás, 5. tagpár: e3·1: 0b100 ⊕ 0b000 = 0b100 → +e3, járulék 2.2500; részösszeg: -1.2321e1 + 1.8660e2 + 2.2500e3"}, {"panel": 2, "a": 4, "b": 3, "o": 7, "s": 1, "line": 6, "msg": "2. szorzás, 6. tagpár: e3·e12: 0b100 ⊕ 0b011 = 0b111 → +e123, járulék 1.2990; részösszeg: -1.2321e1 + 1.8660e2 + 2.2500e3 + 1.2990e123"}, {"panel": 2, "a": 7, "b": 0, "o": 7, "s": 1, "line": 6, "msg": "2. szorzás, 7. tagpár: e123·1: 0b111 ⊕ 0b000 = 0b111 → +e123, járulék -1.2990; részösszeg: -1.2321e1 + 1.8660e2 + 2.2500e3"}, {"panel": 2, "a": 7, "b": 3, "o": 4, "s": -1, "line": 6, "msg": "2. szorzás, 8. tagpár: e123·e12: 0b111 ⊕ 0b011 = 0b100 → −e3, járulék 0.7500; részösszeg: -1.2321e1 + 1.8660e2 + 3.0000e3"}, {"panel": 3, "line": 7, "msg": "kész: bejárt 6 + 8 = 14 tagpár (sűrű modell: 64 + 64 = 128); R v R̃ = -1.2321e1 + 1.8660e2 + 3.0000e3"}];
const CODE = ["def __mul__(self, other):", "    out = {}", "    for ma, ca in self.c.items():", "        for mb, cb in other.c.items():", "            s, m = self.al.blade_mul(ma, mb)", "            if m is None: continue", "            val = ca * cb * s; out[m] = out.get(m, 0.0) + val", "    return MV(self.al, out)      # v' = (R * v) * R.reverse()"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BN = ["1", "e1", "e2", "e12", "e3", "e13", "e23", "e123"];
const pcnt = x => { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; };
const b3 = m => "0b" + m.toString(2).padStart(3, "0");
function bmul(ma, mb){ let sign = 1, t = ma; while (t) { const p = t & -t; if (pcnt(mb & (p - 1)) % 2) sign = -sign; t ^= p; } return [sign, ma ^ mb]; }
function mvc(d){ const o = {}; for (const m in d) if (d[m] !== 0) o[m] = d[m]; return o; }
function rep(d){ const t = Object.keys(d).map(Number).sort((a, b) => a - b).filter(m => Math.abs(d[m]) >= 1e-14); if (!t.length) return "0";
  return t.map((m, i) => { const c = d[m], body = Math.abs(c).toFixed(4) + (m === 0 ? "" : BN[m]); return i === 0 ? (c < 0 ? "-" : "") + body : (c < 0 ? " - " : " + ") + body; }).join(""); }
function mulSteps(A, B, panel, steps){ const out = {}; let n = 0;
  for (const ma in A) for (const mb in B) { const [s, m] = bmul(+ma, +mb), val = A[ma] * B[mb] * s; out[m] = (out[m] || 0) + val; n++;
    steps.push({panel, a: +ma, b: +mb, o: m, s, line: 6, msg: `${panel}. szorzás, ${n}. tagpár: ${BN[+ma]}·${BN[+mb]}: ${b3(+ma)} ⊕ ${b3(+mb)} = ${b3(m)} → ${s > 0 ? "+" : "−"}${BN[m]}, járulék ${val.toFixed(4)}; részösszeg: ${rep(out)}`}); }
  return mvc(out); }
function run(theta, vv){ const c = Math.cos(theta / 2), s = Math.sin(theta / 2);
  const R = mvc({0: c, 3: -s}), Rr = mvc({0: c, 3: s}), v = mvc({1: vv[0], 2: vv[1], 4: vv[2]});
  const steps = [{panel: 0, line: 0, msg: `kezdet: R = ${rep(R)} (${Object.keys(R).length} komponens), v = ${rep(v)} (${Object.keys(v).length} komponens); a rács üres`}];
  const Rv = mulSteps(R, v, 1, steps), res = mulSteps(Rv, Rr, 2, steps);
  const n1 = Object.keys(R).length * Object.keys(v).length, n2 = Object.keys(Rv).length * Object.keys(Rr).length;
  steps.push({panel: 3, line: 7, msg: `kész: bejárt ${n1} + ${n2} = ${n1 + n2} tagpár (sűrű modell: 64 + 64 = 128); R v R̃ = ${rep(res)}`});
  return steps; }
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330"); svg.innerHTML = "";
  const C = 30, G = [[60, 50], [340, 50]], done = STEPS.slice(0, k + 1).filter(x => x.panel === 1 || x.panel === 2);
  [0, 1].forEach(g => { const [x0, y0] = G[g];
    el("text", {x: x0 + 4 * C, y: 16, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, g ? "2. (R v) R̃" : "1. R v");
    for (let i = 0; i < 8; i++) { el("text", {x: x0 - 4, y: y0 + i * C + 19, "text-anchor": "end", "font-size": 10}, BN[i]);
      el("text", {x: x0 + i * C + C / 2, y: y0 - 6, "text-anchor": "middle", "font-size": 10}, BN[i]);
      for (let j = 0; j < 8; j++) el("rect", {x: x0 + j * C, y: y0 + i * C, width: C, height: C, fill: css("--cell"), stroke: css("--cellhl"), "stroke-width": 0.8}); } });
  done.forEach(x => { const [x0, y0] = G[x.panel - 1], cx = x0 + x.b * C, cy = y0 + x.a * C, cur = x === s;
    el("rect", {x: cx, y: cy, width: C, height: C, fill: cur ? css("--hl2") : css("--cellhl"), stroke: css("--line"), "stroke-width": cur ? 3 : 1.2});
    el("text", {x: cx + C / 2, y: cy + 19, "text-anchor": "middle", "font-size": 9.5, "font-weight": "bold"}, (x.s > 0 ? "+" : "−") + BN[x.o]); });
  const n1 = done.filter(x => x.panel === 1).length, n2 = done.filter(x => x.panel === 2).length;
  el("text", {x: 300, y: 318, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, `bejárt: ${n1} + ${n2} = ${n1 + n2}   (sűrű modell: 64 + 64 = 128)`);
}
function recompute(){ const th = +document.getElementById("th").value; document.getElementById("thv").textContent = th;
  setSteps(run(th * Math.PI / 180, [1, 2, 3].map((q, i) => document.getElementById("c" + (i + 1)).checked ? q : 0))); }
["th", "c1", "c2", "c3"].forEach(id => document.getElementById(id).addEventListener(id === "th" ? "input" : "change", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
