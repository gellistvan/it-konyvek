<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A homogén modell térben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e6e6e6;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:600}
input[type=range]{flex:1;min-width:140px}
input[type=text]{font:inherit;padding:1px 3px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl"><button id="sp" aria-label="Előző jelenet">◀ Jelenet</button><b id="scn">1/3</b><button id="sn" aria-label="Következő jelenet">Jelenet ▶</button><button id="tp">◀ Lépés</button><button id="tn">Lépés ▶</button><span id="stp" class="small"></span></div><div class="ctl"><label for="az">forgatás</label><input id="az" type="range" min="-180" max="180" step="1" value="35" aria-label="Nézet forgatása a függőleges tengely körül"><label for="elv">dőlés</label><input id="elv" type="range" min="5" max="85" step="1" value="25" aria-label="Nézet dőlésszöge"></div><div class="ctl" id="bctl"><label for="bb">2. jelenet: második egyenes y = b, b = <b class="v" id="bbv">1</b></label><input id="bb" type="range" min="-2" max="2" step="0.25" value="1" aria-label="A második párhuzamos egyenes magassága"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 420" role="img" aria-label="Forgatható térbeli rajz: a pontokhoz origón átmenő sugarak, az egyenesekhez origón átmenő síkok tartoznak; a két sík metszésegyenese a metszéspont, párhuzamos egyeneseknél vízszintes."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Egérhúzással vagy a csúszkákkal forgatható; az e0 tengely nyújtott léptékű. Számított értékek (ga3-mal egyenértékű képletek).</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function P(p, d){ return "(" + hu(p[0], d) + "; " + hu(p[1], d) + ")"; }
const add = (p, q) => [p[0] + q[0], p[1] + q[1]], sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
const mul = (k, p) => [k * p[0], k * p[1]], dot = (p, q) => p[0] * q[0] + p[1] * q[1];
const wedge = (p, q) => p[0] * q[1] - p[1] * q[0], nrm = p => Math.hypot(p[0], p[1]);

// ---- lejátszás: egy range-csúszkát léptet; magától nem indul, a végén megáll ----
function player(btn, rng, onStep, ms){ let tm = null;
  const stop = () => { if (tm) { clearInterval(tm); tm = null; } btn.textContent = "▶ Lejátszás"; btn.setAttribute("aria-pressed", "false"); };
  btn.addEventListener("click", () => { if (tm) { stop(); return; }
    if (+rng.value >= +rng.max) rng.value = rng.min;
    btn.textContent = "⏸ Szünet"; btn.setAttribute("aria-pressed", "true");
    tm = setInterval(() => { const st = +(rng.step || 1), v = +rng.value + st;
      if (v > +rng.max + 1e-9) { stop(); return; } rng.value = v; onStep(); }, ms || 120); });
  return stop; }

// ---- koordináta-nézet: matematikai (x, y) → SVG-pixel; y felfelé nő ----
function View(xmin, xmax, ymin, ymax, px, py, pw, ph){
  const s = Math.min(pw / (xmax - xmin), ph / (ymax - ymin));
  const ox = px + (pw - s * (xmax - xmin)) / 2 - s * xmin, oy = py + (ph - s * (ymax - ymin)) / 2 + s * ymax;
  return {xmin, xmax, ymin, ymax, s, X: x => ox + s * x, Y: y => oy - s * y,
          inv: (sx, sy) => [(sx - ox) / s, (oy - sy) / s]};
}
function grid(V){
  for (let g = Math.ceil(V.xmin); g <= V.xmax; g++) el("line", {x1: V.X(g), y1: V.Y(V.ymin), x2: V.X(g), y2: V.Y(V.ymax), stroke: css("--grid")});
  for (let g = Math.ceil(V.ymin); g <= V.ymax; g++) el("line", {x1: V.X(V.xmin), y1: V.Y(g), x2: V.X(V.xmax), y2: V.Y(g), stroke: css("--grid")});
  el("line", {x1: V.X(V.xmin), y1: V.Y(0), x2: V.X(V.xmax), y2: V.Y(0), stroke: css("--muted"), "stroke-width": 1.2});
  el("line", {x1: V.X(0), y1: V.Y(V.ymin), x2: V.X(0), y2: V.Y(V.ymax), stroke: css("--muted"), "stroke-width": 1.2});
}
function arr(V, p0, p1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2.2, hl = o.head || 11;
  const x0 = V.X(p0[0]), y0 = V.Y(p0[1]), x1 = V.X(p1[0]), y1 = V.Y(p1[1]);
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L > 1e-6) { const ux = dx / L, uy = dy / L, h = Math.min(hl, L * 0.6), bx = x1 - ux * h, by = y1 - uy * h;
    el("line", {x1: x0, y1: y0, x2: bx + ux, y2: by + uy, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
    el("polygon", {points: `${x1},${y1} ${bx - uy * h * 0.4},${by + ux * h * 0.4} ${bx + uy * h * 0.4},${by - ux * h * 0.4}`, fill: col}); }
  if (o.label) lab(V, p1, o.label, {color: o.lcolor || col, dx: o.dx, dy: o.dy, anchor: o.anchor, fs: o.fs, bold: o.bold});
}
function lab(V, p, s, o){ o = o || {}; const a = {x: V.X(p[0]) + (o.dx === undefined ? 6 : o.dx), y: V.Y(p[1]) + (o.dy === undefined ? -6 : o.dy),
  "font-size": o.fs || 14, "text-anchor": o.anchor || "start", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; return el("text", a, s); }
function seg(V, p0, p1, o){ o = o || {}; el("line", {x1: V.X(p0[0]), y1: V.Y(p0[1]), x2: V.X(p1[0]), y2: V.Y(p1[1]),
  stroke: o.color || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""}); }
function line(V, p, d, o){ let lo = -1e9, hi = 1e9; const B = [[V.xmin, V.xmax], [V.ymin, V.ymax]];
  for (let k = 0; k < 2; k++) { if (Math.abs(d[k]) < 1e-12) { if (p[k] < B[k][0] || p[k] > B[k][1]) return; continue; }
    let t1 = (B[k][0] - p[k]) / d[k], t2 = (B[k][1] - p[k]) / d[k]; if (t1 > t2) [t1, t2] = [t2, t1]; lo = Math.max(lo, t1); hi = Math.min(hi, t2); }
  if (lo < hi) seg(V, add(p, mul(lo, d)), add(p, mul(hi, d)), o); }
function poly(V, pts, o){ o = o || {}; return el("polygon", {points: pts.map(p => V.X(p[0]) + "," + V.Y(p[1])).join(" "),
  fill: o.fill || "none", stroke: o.stroke || css("--fg"), "stroke-width": o.w || 1.4, "stroke-dasharray": o.dash || ""}); }
function para(V, o0, a, b, o){ return poly(V, [o0, add(o0, a), add(add(o0, a), b), add(o0, b)], o); }
function orient(V, c, sign, o){ o = o || {}; if (!sign) return; const r = o.r || 18, a0 = 0.4, a1 = a0 + Math.sign(sign) * 1.5 * Math.PI;
  const q = a => [V.X(c[0]) + r * Math.cos(a), V.Y(c[1]) - r * Math.sin(a)]; let d = "";
  for (let i = 0; i <= 30; i++) { const z = q(a0 + (a1 - a0) * i / 30); d += (i ? "L" : "M") + z[0].toFixed(1) + "," + z[1].toFixed(1); }
  const col = o.color || css("--fg"); el("path", {d: d, fill: "none", stroke: col, "stroke-width": 1.6});
  const e1 = q(a1 - Math.sign(sign) * 0.3), e2 = q(a1), dx = e2[0] - e1[0], dy = e2[1] - e1[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, h = 9;
  el("polygon", {points: `${e2[0] + ux * 3},${e2[1] + uy * 3} ${e2[0] - ux * h - uy * h * 0.45},${e2[1] - uy * h + ux * h * 0.45} ${e2[0] - ux * h + uy * h * 0.45},${e2[1] - uy * h - ux * h * 0.45}`, fill: col}); }
function rangle(V, at, u, v, s){ s = s || 12; const nu = nrm(u), nv = nrm(v); if (nu < 1e-9 || nv < 1e-9) return;
  const a = [V.X(at[0]), V.Y(at[1])], du = [u[0] / nu * s, -u[1] / nu * s], dv = [v[0] / nv * s, -v[1] / nv * s];
  el("polyline", {points: `${a[0] + du[0]},${a[1] + du[1]} ${a[0] + du[0] + dv[0]},${a[1] + du[1] + dv[1]} ${a[0] + dv[0]},${a[1] + dv[1]}`, fill: "none", stroke: css("--fg"), "stroke-width": 1.2}); }
function hatchDefs(){ const d = el("defs", {}); [["h1", "--hl"], ["h2", "--hl2"], ["h3", "--hl3"]].forEach(([id, c]) => {
  const p = el("pattern", {id: id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, d);
  el("rect", {width: 7, height: 7, fill: css(c === "--hl" ? "--fill1" : c === "--hl2" ? "--fill2" : "--fill3")}, undefined, p);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 7, stroke: css(c), "stroke-width": 1.2, "stroke-opacity": 0.55}, undefined, p); }); }
// ---- húzható pontok: PTS = {név: [x, y]}, HANDLES = [[név, View], ...]; rácsra pattintás STEP lépésközzel ----
let DRAG = null, STEP = 1, HANDLES = [], REDRAW = () => {}, CLAMP = null;
function handle(V, name, p, o){ o = o || {}; HANDLES.push([name, V]);
  el("circle", {cx: V.X(p[0]), cy: V.Y(p[1]), r: 11, fill: "transparent", stroke: o.color || css("--fg"), "stroke-width": 1.4,
    "stroke-dasharray": "3 2", "data-h": name, style: "cursor:grab"}); }
function svgPt(e){ const m = svg.getScreenCTM().inverse(), q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; return q.matrixTransform(m); }
svg.addEventListener("pointerdown", e => { const n = e.target.getAttribute && e.target.getAttribute("data-h"); if (!n) return;
  const h = HANDLES.find(z => z[0] === n); if (!h) return; DRAG = h; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
svg.addEventListener("pointermove", e => { if (!DRAG) return; const q = svgPt(e), w = DRAG[1].inv(q.x, q.y);
  let p = [Math.round(w[0] / STEP) * STEP, Math.round(w[1] / STEP) * STEP];
  p = [Math.max(Math.ceil(DRAG[1].xmin), Math.min(Math.floor(DRAG[1].xmax), p[0])), Math.max(Math.ceil(DRAG[1].ymin), Math.min(Math.floor(DRAG[1].ymax), p[1]))];
  if (CLAMP) p = CLAMP(DRAG[0], p); if (!p) return;
  const old = PTS[DRAG[0]]; if (old[0] === p[0] && old[1] === p[1]) return; PTS[DRAG[0]] = p; syncInputs(); REDRAW(); });
svg.addEventListener("pointerup", () => { DRAG = null; }); svg.addEventListener("pointercancel", () => { DRAG = null; });
// ---- koordináta-mezők (billentyűzetes kezelés): <input data-pt="név" data-k="0|1"> ----
function num(s){ const v = parseFloat(String(s).replace(",", ".").replace(/−/g, "-").trim()); return isFinite(v) ? v : null; }
function syncInputs(){ document.querySelectorAll("input[data-pt]").forEach(i => { const p = PTS[i.dataset.pt]; if (p) i.value = String(p[+i.dataset.k]).replace("-", "−"); }); }
function bindInputs(){ document.querySelectorAll("input[data-pt]").forEach(i => i.addEventListener("change", () => {
  const v = num(i.value); if (v === null) { syncInputs(); return; } const p = PTS[i.dataset.pt].slice(); p[+i.dataset.k] = v;
  const q = CLAMP ? CLAMP(i.dataset.pt, p) : p; if (q) PTS[i.dataset.pt] = q; syncInputs(); REDRAW(); })); syncInputs(); }


const ZS = 1.6;                                   // e0 megjelenítési lépték
let S = 0, T = 0;
const NSTEP = 5;
const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const hp = (x, y) => [x, y, 1];
function pr(p){ const a = +document.getElementById("az").value * Math.PI / 180, e = +document.getElementById("elv").value * Math.PI / 180;
  const x1 = p[0] * Math.cos(a) + p[1] * Math.sin(a), y1 = -p[0] * Math.sin(a) + p[1] * Math.cos(a);
  const k = S === 0 ? 62 : 82, oy = S === 0 ? 320 : 290, ox = S === 0 ? 230 : 380;
  return [ox + k * x1, oy - k * (ZS * p[2] * Math.cos(e) + y1 * Math.sin(e))]; }
function L3(a, b, o){ const A = pr(a), B = pr(b); el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: o.color || css("--fg"), "stroke-width": o.w || 1.4, "stroke-dasharray": o.dash || ""}); }
function A3(a, b, o){ const A = pr(a), B = pr(b), dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy); if (L < 2) return;
  const ux = dx / L, uy = dy / L, h = Math.min(11, L * 0.5), col = o.color || css("--fg");
  el("line", {x1: A[0], y1: A[1], x2: B[0] - ux * h, y2: B[1] - uy * h, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${B[0]},${B[1]} ${B[0] - ux * h - uy * h * 0.42},${B[1] - uy * h + ux * h * 0.42} ${B[0] - ux * h + uy * h * 0.42},${B[1] - uy * h - ux * h * 0.42}`, fill: col});
  if (o.label) T3(b, o.label, {color: col}); }
function T3(p, s, o){ const q = pr(p); el("text", {x: q[0] + 6, y: q[1] - 6, "font-size": 13, fill: (o && o.color) || css("--fg"), "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, s); }
function P3(pts, o){ el("polygon", {points: pts.map(p => pr(p).join(",")).join(" "), fill: o.fill || "none", stroke: o.stroke || css("--fg"), "stroke-width": o.w || 1, "stroke-dasharray": o.dash || "", "fill-opacity": o.op || 1}); }
function base(xr, yr){
  A3([0, 0, 0], [xr[1] + 0.3, 0, 0], {color: css("--muted"), w: 1.2, label: "e1"});
  A3([0, 0, 0], [0, yr[1] + 0.3, 0], {color: css("--muted"), w: 1.2, label: "e2"});
  A3([0, 0, 0], [0, 0, 1.45], {color: css("--muted"), w: 1.2, label: "e0"});
  P3([[xr[0], yr[0], 1], [xr[1], yr[0], 1], [xr[1], yr[1], 1], [xr[0], yr[1], 1]], {fill: "url(#h3)", stroke: css("--muted"), dash: "2 3"});
  T3([xr[1], yr[1], 1], "e0 = 1", {color: css("--muted")}); }
function mv(v, ord){ const nm = ["e1", "e2", "e0"], t = []; for (const i of (ord || [0, 1, 2])) if (Math.abs(v[i]) > 1e-9)
  t.push((t.length ? (v[i] > 0 ? " + " : " − ") : (v[i] < 0 ? "−" : "")) + (Math.abs(Math.abs(v[i]) - 1) < 1e-9 ? "" : hu(Math.abs(v[i]), 2)) + nm[i]);
  return t.length ? t.join("") : "0"; }
const STEPN = ["pontok (sugarak)", "a pontpárok síkjai (egyenesek)", "duális normálisok", "L1* ∧ L2*", "M = (L1* ∧ L2*)*"];
function draw(){
  svg.innerHTML = ""; hatchDefs();
  document.getElementById("scn").textContent = (S + 1) + "/3";
  document.getElementById("stp").textContent = "lépés " + (T + 1) + "/" + NSTEP + ": " + (S === 0 ? ["P, Q", "P∧Q sík", "metszet az e0 = 1 síkkal", "duális normális L*", "L* ⟂ P, Q"][T] : STEPN[T]);
  document.getElementById("bctl").style.display = S === 1 ? "" : "none";
  const b = +document.getElementById("bb").value; document.getElementById("bbv").textContent = hu(b, 2);
  let st = "", info = "";
  if (S === 0) {
    base([-0.5, 3.6], [-0.5, 4.6]);
    const P = hp(1, 2), Q = hp(3, 4), Ls = cr(P, Q);
    if (T >= 1) P3([[0, 0, 0], [1.3, 2.6, 1.3], [3.9, 5.2, 1.3]], {fill: "url(#h1)", stroke: css("--hl"), dash: "2 3"});
    if (T >= 0) { A3([0, 0, 0], P, {color: css("--hl"), w: 2.4, label: "P (1, 2)"}); A3([0, 0, 0], Q, {color: css("--hl"), w: 2.4, label: "Q (3, 4)"}); }
    if (T >= 2) L3([-0.5, 0.5, 1], [3.5, 4.5, 1], {w: 3.2});
    if (T >= 3) A3([0, 0, 0], Ls.map(x => x * 0.4), {color: css("--hl2"), dash: "6 4", label: "L* (×0,4)"});
    st = ["P = e0 + e1 + 2e2, Q = e0 + 3e1 + 4e2: a pont az origón átmenő sugár",
          "L = P∧Q = 2e0e1 + 2e0e2 − 2e1e2: origón átmenő sík",
          "a P∧Q sík az e0 = 1 szintet az y = x + 1 egyenesben metszi",
          "L* = " + mv(Ls) + " – a sík normálisa",
          "P·L* = " + hu(P[0] * Ls[0] + P[1] * Ls[1] + P[2] * Ls[2]) + ", Q·L* = " + hu(Q[0] * Ls[0] + Q[1] * Ls[1] + Q[2] * Ls[2]) + ": a pontok a síkban vannak"][T];
    info = "Pont = origón átmenő egyenes (sugár), egyenes = origón átmenő sík; a síkbeli kép a metszet az e0 = 1 síkkal.";
  } else {
    const xr = S === 1 ? [-1.2, 2.2] : [-0.6, 1.8], yr = [-0.6, 1.6];
    base(xr, yr);
    const A1 = hp(0, 0), B1 = hp(1, 0), A2 = S === 1 ? hp(0, b) : hp(1, 0), B2 = S === 1 ? hp(1, b) : hp(1, 1);
    const L1s = cr(A1, B1), L2s = cr(A2, B2), W = cr(L1s, L2s), M = W;   // M = (L1*∧L2*)* = L1*×L2*
    if (T >= 0) [A1, B1, A2, B2].forEach((p, i) => A3([0, 0, 0], p, {color: i < 2 ? css("--fg") : css("--hl"), w: 1.4}));
    if (T >= 1) { P3([[xr[0], 0, 0], [xr[1], 0, 0], [xr[1], 0, 1.3], [xr[0], 0, 1.3]], {fill: "url(#h2)", stroke: css("--fg"), op: 0.8});
      if (S === 1) P3([[xr[0], 0, 0], [xr[1], 0, 0], [xr[1], 1.3 * b, 1.3], [xr[0], 1.3 * b, 1.3]], {fill: "url(#h1)", stroke: css("--hl"), op: 0.8});
      else P3([[0, yr[0], 0], [0, yr[1], 0], [1.3, yr[1], 1.3], [1.3, yr[0], 1.3]], {fill: "url(#h1)", stroke: css("--hl"), op: 0.8});
      L3([xr[0], 0, 1], [xr[1], 0, 1], {w: 2.6});
      if (S === 1) L3([xr[0], b, 1], [xr[1], b, 1], {w: 2.6, color: css("--hl"), dash: "8 4"}); else L3([1, yr[0], 1], [1, yr[1], 1], {w: 2.6, color: css("--hl"), dash: "8 4"}); }
    if (T >= 2) { A3([0, 0, 0], L1s, {color: css("--hl2"), dash: "6 4", label: "L1* = " + mv(L1s)}); A3([0, 0, 0], L2s, {color: css("--hl2"), dash: "6 4", label: "L2* = " + mv(L2s)}); }
    if (T >= 3) P3([[0, 0, 0], L1s, [L1s[0] + L2s[0], L1s[1] + L2s[1], L1s[2] + L2s[2]], L2s], {fill: css("--fill2"), stroke: css("--hl2")});
    if (T >= 4) { const n = Math.hypot(M[0], M[1], M[2]);
      if (n > 1e-9) { L3(M.map(x => -1.6 * x / n), M.map(x => 1.6 * x / n), {color: css("--hl"), w: 1, dash: "2 3"}); A3([0, 0, 0], M, {color: css("--hl"), w: 3.4, dash: "9 4", label: "M = " + mv(M, [2, 0, 1])}); }
      if (Math.abs(M[2]) > 1e-9) { const q = pr([M[0] / M[2], M[1] / M[2], 1]); el("circle", {cx: q[0], cy: q[1], r: 7, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2}); } }
    const wtxt = "L1*∧L2* = " + (Math.abs(W[0]) + Math.abs(W[1]) + Math.abs(W[2]) < 1e-9 ? "0" : (S === 1 ? hu(b, 2) + " e0e2" : "−e0e2 + e1e2"));
    const mtxt = (Math.hypot(...M) < 1e-9) ? "egybeeső egyenesek: a meet 0" :
      (Math.abs(M[2]) < 1e-9 ? "M = " + mv(M, [2, 0, 1]) + ": e0-komponens 0 → végtelen távoli pont (vízszintes metszésegyenes)" :
       "M = " + mv(M, [2, 0, 1]) + " → a metszésegyenes az e0 = 1 síkot az (" + hu(M[0] / M[2], 2) + "; " + hu(M[1] / M[2], 2) + ") pontban döfi");
    st = [S === 1 ? `L1: y = 0 (e0, e0 + e1), L2: y = ${hu(b, 2)} (e0 + ${hu(b, 2)}e2, e0 + e1 + ${hu(b, 2)}e2)` : "L1: y = 0, L2: x = 1 ((1, 0) és (1, 1))",
          S === 1 ? "L1 = e0e1, L2 = " + (b === 0 ? "e0e1 (= L1)" : "e0e1 " + (b > 0 ? "− " : "+ ") + (Math.abs(b) === 1 ? "" : hu(Math.abs(b), 2) + " ") + "e1e2") + ": két origón átmenő sík" : "L1 = e0e1, L2 = e0e2 + e1e2: két origón átmenő sík",
          "L1* = " + mv(L1s) + ",  L2* = " + mv(L2s), wtxt, mtxt][T];
    if (T === 4 && S === 1 && b === 1) st = "M = −e1: " + "e0-komponens 0 → végtelen távoli pont (vízszintes metszésegyenes)";
    info = "A metszéspont a két sík metszésegyenese: merőleges mindkét normálisra (L1*, L2*), ezért M = (L1*∧L2*)*.";
  }
  document.getElementById("status").textContent = st;
  document.getElementById("info").textContent = info;
}
function go(ds, dt){ S = (S + ds + 3) % 3; if (ds) T = 0; T = Math.max(0, Math.min(NSTEP - 1, T + dt)); draw(); }
document.getElementById("sp").onclick = () => go(-1, 0); document.getElementById("sn").onclick = () => go(1, 0);
document.getElementById("tp").onclick = () => go(0, -1); document.getElementById("tn").onclick = () => go(0, 1);
["az", "elv", "bb"].forEach(id => document.getElementById(id).addEventListener("input", draw));
let drag = null;
svg.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, +document.getElementById("az").value, +document.getElementById("elv").value]; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => { if (!drag) return; const az = document.getElementById("az"), ev = document.getElementById("elv");
  az.value = Math.max(-180, Math.min(180, drag[2] - (e.clientX - drag[0]) * 0.5)); ev.value = Math.max(5, Math.min(85, drag[3] + (e.clientY - drag[1]) * 0.4)); draw(); });
svg.addEventListener("pointerup", () => { drag = null; }); svg.addEventListener("pointercancel", () => { drag = null; });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
