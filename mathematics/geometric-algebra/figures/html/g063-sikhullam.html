<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektromágneses síkhullám</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e6e6e6;--fill1:rgba(31,78,121,.13);--fill2:rgba(197,90,17,.13);--fill3:rgba(84,130,53,.15)}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd17f;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#353535;--fill1:rgba(143,184,232,.18);--fill2:rgba(240,160,96,.18);--fill3:rgba(159,209,127,.18)}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:600}
input[type=range]{flex:1;min-width:140px}
input[type=text]{font:inherit;padding:1px 3px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{margin:6px 0;padding:6px 8px;background:var(--code);min-height:1.5em;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace}
#info:empty{display:none}
.small{font-size:12px;color:var(--muted)}
b.v{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl"><label for="tt">t = <b class="v" id="ttv">0</b></label><input id="tt" type="range" min="0" max="1.5708" step="0.0314" value="0" aria-label="Idő t (0…π/2)"><button id="play" aria-pressed="false">▶ Lejátszás</button><button id="t0">t = 0</button><button id="t05">t = 0,5</button></div><div class="ctl"><label><input type="checkbox" id="bad"> hibás B0 = 0,6 (a (d) feladat negatív kontrollja)</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 420" role="img" aria-label="Felül az elektromos és a c-vel szorzott mágneses tér koszinuszgörbéje (egybeesnek), alul térbeli rajz: egymásra merőleges síkokban rezgő nyilak, a hullám az x-tengely mentén halad."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">c = 2, E0 = 1, B0 = 0,5, k = 2, ω = 4 (a (d) feladat értékei); számított, nem mérés. A lejátszás t = π/2-nél megáll.</p>
<script>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, t, par){ const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]);
  if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e; }
function hu(x, d){ if (d === undefined) d = 2; const m = Math.pow(10, d); let v = Math.round(x * m) / m;
  if (Math.abs(v) < 0.5 / m) v = 0; return String(v).replace(".", ",").replace("-", "−"); }
function P(p, d){ return "(" + hu(p[0], d) + "; " + hu(p[1], d) + ")"; }
const add = (p, q) => [p[0] + q[0], p[1] + q[1]], sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
const mul = (k, p) => [k * p[0], k * p[1]], dot = (p, q) => p[0] * q[0] + p[1] * q[1];
const wedge = (p, q) => p[0] * q[1] - p[1] * q[0], nrm = p => Math.hypot(p[0], p[1]);

// ---- lejátszás: egy range-csúszkát léptet; magától nem indul, a végén megáll ----
function player(btn, rng, onStep, ms){ let tm = null;
  const stop = () => { if (tm) { clearInterval(tm); tm = null; } btn.textContent = "▶ Lejátszás"; btn.setAttribute("aria-pressed", "false"); };
  btn.addEventListener("click", () => { if (tm) { stop(); return; }
    if (+rng.value >= +rng.max) rng.value = rng.min;
    btn.textContent = "⏸ Szünet"; btn.setAttribute("aria-pressed", "true");
    tm = setInterval(() => { const st = +(rng.step || 1), v = +rng.value + st;
      if (v > +rng.max + 1e-9) { stop(); return; } rng.value = v; onStep(); }, ms || 120); });
  return stop; }

// ---- koordináta-nézet: matematikai (x, y) → SVG-pixel; y felfelé nő ----
function View(xmin, xmax, ymin, ymax, px, py, pw, ph){
  const s = Math.min(pw / (xmax - xmin), ph / (ymax - ymin));
  const ox = px + (pw - s * (xmax - xmin)) / 2 - s * xmin, oy = py + (ph - s * (ymax - ymin)) / 2 + s * ymax;
  return {xmin, xmax, ymin, ymax, s, X: x => ox + s * x, Y: y => oy - s * y,
          inv: (sx, sy) => [(sx - ox) / s, (oy - sy) / s]};
}
function grid(V){
  for (let g = Math.ceil(V.xmin); g <= V.xmax; g++) el("line", {x1: V.X(g), y1: V.Y(V.ymin), x2: V.X(g), y2: V.Y(V.ymax), stroke: css("--grid")});
  for (let g = Math.ceil(V.ymin); g <= V.ymax; g++) el("line", {x1: V.X(V.xmin), y1: V.Y(g), x2: V.X(V.xmax), y2: V.Y(g), stroke: css("--grid")});
  el("line", {x1: V.X(V.xmin), y1: V.Y(0), x2: V.X(V.xmax), y2: V.Y(0), stroke: css("--muted"), "stroke-width": 1.2});
  el("line", {x1: V.X(0), y1: V.Y(V.ymin), x2: V.X(0), y2: V.Y(V.ymax), stroke: css("--muted"), "stroke-width": 1.2});
}
function arr(V, p0, p1, o){ o = o || {}; const col = o.color || css("--fg"), w = o.w || 2.2, hl = o.head || 11;
  const x0 = V.X(p0[0]), y0 = V.Y(p0[1]), x1 = V.X(p1[0]), y1 = V.Y(p1[1]);
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  if (L > 1e-6) { const ux = dx / L, uy = dy / L, h = Math.min(hl, L * 0.6), bx = x1 - ux * h, by = y1 - uy * h;
    el("line", {x1: x0, y1: y0, x2: bx + ux, y2: by + uy, stroke: col, "stroke-width": w, "stroke-dasharray": o.dash || ""});
    el("polygon", {points: `${x1},${y1} ${bx - uy * h * 0.4},${by + ux * h * 0.4} ${bx + uy * h * 0.4},${by - ux * h * 0.4}`, fill: col}); }
  if (o.label) lab(V, p1, o.label, {color: o.lcolor || col, dx: o.dx, dy: o.dy, anchor: o.anchor, fs: o.fs, bold: o.bold});
}
function lab(V, p, s, o){ o = o || {}; const a = {x: V.X(p[0]) + (o.dx === undefined ? 6 : o.dx), y: V.Y(p[1]) + (o.dy === undefined ? -6 : o.dy),
  "font-size": o.fs || 14, "text-anchor": o.anchor || "start", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3};
  if (o.color) a.fill = o.color; if (o.bold) a["font-weight"] = "bold"; return el("text", a, s); }
function seg(V, p0, p1, o){ o = o || {}; el("line", {x1: V.X(p0[0]), y1: V.Y(p0[1]), x2: V.X(p1[0]), y2: V.Y(p1[1]),
  stroke: o.color || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""}); }
function line(V, p, d, o){ let lo = -1e9, hi = 1e9; const B = [[V.xmin, V.xmax], [V.ymin, V.ymax]];
  for (let k = 0; k < 2; k++) { if (Math.abs(d[k]) < 1e-12) { if (p[k] < B[k][0] || p[k] > B[k][1]) return; continue; }
    let t1 = (B[k][0] - p[k]) / d[k], t2 = (B[k][1] - p[k]) / d[k]; if (t1 > t2) [t1, t2] = [t2, t1]; lo = Math.max(lo, t1); hi = Math.min(hi, t2); }
  if (lo < hi) seg(V, add(p, mul(lo, d)), add(p, mul(hi, d)), o); }
function poly(V, pts, o){ o = o || {}; return el("polygon", {points: pts.map(p => V.X(p[0]) + "," + V.Y(p[1])).join(" "),
  fill: o.fill || "none", stroke: o.stroke || css("--fg"), "stroke-width": o.w || 1.4, "stroke-dasharray": o.dash || ""}); }
function para(V, o0, a, b, o){ return poly(V, [o0, add(o0, a), add(add(o0, a), b), add(o0, b)], o); }
function orient(V, c, sign, o){ o = o || {}; if (!sign) return; const r = o.r || 18, a0 = 0.4, a1 = a0 + Math.sign(sign) * 1.5 * Math.PI;
  const q = a => [V.X(c[0]) + r * Math.cos(a), V.Y(c[1]) - r * Math.sin(a)]; let d = "";
  for (let i = 0; i <= 30; i++) { const z = q(a0 + (a1 - a0) * i / 30); d += (i ? "L" : "M") + z[0].toFixed(1) + "," + z[1].toFixed(1); }
  const col = o.color || css("--fg"); el("path", {d: d, fill: "none", stroke: col, "stroke-width": 1.6});
  const e1 = q(a1 - Math.sign(sign) * 0.3), e2 = q(a1), dx = e2[0] - e1[0], dy = e2[1] - e1[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, h = 9;
  el("polygon", {points: `${e2[0] + ux * 3},${e2[1] + uy * 3} ${e2[0] - ux * h - uy * h * 0.45},${e2[1] - uy * h + ux * h * 0.45} ${e2[0] - ux * h + uy * h * 0.45},${e2[1] - uy * h - ux * h * 0.45}`, fill: col}); }
function rangle(V, at, u, v, s){ s = s || 12; const nu = nrm(u), nv = nrm(v); if (nu < 1e-9 || nv < 1e-9) return;
  const a = [V.X(at[0]), V.Y(at[1])], du = [u[0] / nu * s, -u[1] / nu * s], dv = [v[0] / nv * s, -v[1] / nv * s];
  el("polyline", {points: `${a[0] + du[0]},${a[1] + du[1]} ${a[0] + du[0] + dv[0]},${a[1] + du[1] + dv[1]} ${a[0] + dv[0]},${a[1] + dv[1]}`, fill: "none", stroke: css("--fg"), "stroke-width": 1.2}); }
function hatchDefs(){ const d = el("defs", {}); [["h1", "--hl"], ["h2", "--hl2"], ["h3", "--hl3"]].forEach(([id, c]) => {
  const p = el("pattern", {id: id, width: 7, height: 7, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, d);
  el("rect", {width: 7, height: 7, fill: css(c === "--hl" ? "--fill1" : c === "--hl2" ? "--fill2" : "--fill3")}, undefined, p);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 7, stroke: css(c), "stroke-width": 1.2, "stroke-opacity": 0.55}, undefined, p); }); }
// ---- húzható pontok: PTS = {név: [x, y]}, HANDLES = [[név, View], ...]; rácsra pattintás STEP lépésközzel ----
let DRAG = null, STEP = 1, HANDLES = [], REDRAW = () => {}, CLAMP = null;
function handle(V, name, p, o){ o = o || {}; HANDLES.push([name, V]);
  el("circle", {cx: V.X(p[0]), cy: V.Y(p[1]), r: 11, fill: "transparent", stroke: o.color || css("--fg"), "stroke-width": 1.4,
    "stroke-dasharray": "3 2", "data-h": name, style: "cursor:grab"}); }
function svgPt(e){ const m = svg.getScreenCTM().inverse(), q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; return q.matrixTransform(m); }
svg.addEventListener("pointerdown", e => { const n = e.target.getAttribute && e.target.getAttribute("data-h"); if (!n) return;
  const h = HANDLES.find(z => z[0] === n); if (!h) return; DRAG = h; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
svg.addEventListener("pointermove", e => { if (!DRAG) return; const q = svgPt(e), w = DRAG[1].inv(q.x, q.y);
  let p = [Math.round(w[0] / STEP) * STEP, Math.round(w[1] / STEP) * STEP];
  p = [Math.max(Math.ceil(DRAG[1].xmin), Math.min(Math.floor(DRAG[1].xmax), p[0])), Math.max(Math.ceil(DRAG[1].ymin), Math.min(Math.floor(DRAG[1].ymax), p[1]))];
  if (CLAMP) p = CLAMP(DRAG[0], p); if (!p) return;
  const old = PTS[DRAG[0]]; if (old[0] === p[0] && old[1] === p[1]) return; PTS[DRAG[0]] = p; syncInputs(); REDRAW(); });
svg.addEventListener("pointerup", () => { DRAG = null; }); svg.addEventListener("pointercancel", () => { DRAG = null; });
// ---- koordináta-mezők (billentyűzetes kezelés): <input data-pt="név" data-k="0|1"> ----
function num(s){ const v = parseFloat(String(s).replace(",", ".").replace(/−/g, "-").trim()); return isFinite(v) ? v : null; }
function syncInputs(){ document.querySelectorAll("input[data-pt]").forEach(i => { const p = PTS[i.dataset.pt]; if (p) i.value = String(p[+i.dataset.k]).replace("-", "−"); }); }
function bindInputs(){ document.querySelectorAll("input[data-pt]").forEach(i => i.addEventListener("change", () => {
  const v = num(i.value); if (v === null) { syncInputs(); return; } const p = PTS[i.dataset.pt].slice(); p[+i.dataset.k] = v;
  const q = CLAMP ? CLAMP(i.dataset.pt, p) : p; if (q) PTS[i.dataset.pt] = q; syncInputs(); REDRAW(); })); syncInputs(); }


const BAD = "3.378e-01";
const c = 2, k = 2, om = 4, E0 = 1;
const rng = document.getElementById("tt");
let T = 0;
// felső: grafikon; alsó: ferde 3D-vetület
const GX = x => 60 + x * 88, GY = y => 120 - y * 62;
const H = (x, y, z) => [60 + x * 82 + z * 26, 345 - y * 52 + z * 18];      // y = e2 (E), z = e3 (cB, mélység)
function path(pts, o){ el("path", {d: pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(""),
  fill: "none", stroke: o.color, "stroke-width": o.w || 1.6, "stroke-dasharray": o.dash || ""}); }
function ar(p, q, o){ const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy); if (L < 3) return;
  const ux = dx / L, uy = dy / L, h = Math.min(7, L * 0.5);
  el("line", {x1: p[0], y1: p[1], x2: q[0] - ux * h, y2: q[1] - uy * h, stroke: o.color, "stroke-width": o.w || 1.3, "stroke-dasharray": o.dash || ""});
  el("polygon", {points: `${q[0]},${q[1]} ${q[0] - ux * h - uy * h * 0.45},${q[1] - uy * h + ux * h * 0.45} ${q[0] - ux * h + uy * h * 0.45},${q[1] - uy * h - ux * h * 0.45}`, fill: o.color}); }
function draw(){
  svg.innerHTML = "";
  const bad = document.getElementById("bad").checked, B0 = bad ? 0.6 : 0.5;
  document.getElementById("ttv").textContent = hu(T, 4);
  const X = []; for (let i = 0; i <= 200; i++) X.push(2 * Math.PI * i / 200);
  // grafikon
  el("line", {x1: GX(0), y1: GY(0), x2: GX(2 * Math.PI) + 10, y2: GY(0), stroke: css("--muted")});
  el("line", {x1: GX(0), y1: GY(-1.3), x2: GX(0), y2: GY(1.35), stroke: css("--muted")});
  [[1, "1"], [-1, "−1"], [1.2, "1,2"]].forEach(([v, s]) => { el("line", {x1: GX(0) - 4, y1: GY(v), x2: GX(0), y2: GY(v), stroke: css("--muted")});
    el("text", {x: GX(0) - 8, y: GY(v) + 4, "font-size": 12, "text-anchor": "end"}, s); });
  [[Math.PI / 2, "π/2"], [Math.PI, "π"], [3 * Math.PI / 2, "3π/2"], [2 * Math.PI, "2π"]].forEach(([v, s]) =>
    el("text", {x: GX(v), y: GY(0) + 16, "font-size": 12, "text-anchor": "middle"}, s));
  el("text", {x: GX(2 * Math.PI) + 14, y: GY(0) + 4, "font-size": 13}, "x");
  path(X.map(x => [GX(x), GY(E0 * Math.cos(k * x - om * T))]), {color: css("--hl"), w: 2.4});
  path(X.map(x => [GX(x), GY(c * B0 * Math.cos(k * x - om * T))]), {color: css("--hl2"), w: 1.8, dash: "7 4"});
  // fázispont: S = 0 csúcs, x = (ω/k) t = 2t; nyomvonal
  const xp = om / k * T;
  el("line", {x1: GX(0), y1: GY(1.28), x2: GX(xp), y2: GY(1.28), stroke: css("--hl3"), "stroke-width": 3});
  el("circle", {cx: GX(xp), cy: GY(E0), r: 6, fill: css("--hl3")});
  el("text", {x: GX(xp) + 8, y: GY(1.28) - 6, "font-size": 12, fill: css("--hl3")}, "S = 0 csúcs: x = 2t = " + hu(xp, 3));
  el("text", {x: 380, y: 22, "font-size": 13}, "— Ey (folytonos)   - - c·Bz (szaggatott)");
  // 3D
  path([H(0, 0, 0), H(2 * Math.PI + 0.5, 0, 0)], {color: css("--muted"), w: 1.2});
  el("text", {x: H(2 * Math.PI + 0.55, 0, 0)[0], y: H(2 * Math.PI + 0.55, 0, 0)[1] + 4, "font-size": 12}, "e1 (terjedés)");
  ar(H(0, 0, 0), H(0, 1.4, 0), {color: css("--muted")}); el("text", {x: H(0, 1.5, 0)[0] - 6, y: H(0, 1.5, 0)[1], "font-size": 12}, "e2: E");
  ar(H(0, 0, 0), H(0, 0, 1.8), {color: css("--muted")}); el("text", {x: H(0, 0, 1.9)[0] + 4, y: H(0, 0, 1.9)[1] + 10, "font-size": 12}, "e3: cB");
  for (let i = 0; i <= 24; i++) { const x = 2 * Math.PI * i / 24, S = k * x - om * T;
    ar(H(x, 0, 0), H(x, E0 * Math.cos(S), 0), {color: css("--hl")});
    ar(H(x, 0, 0), H(x, 0, c * B0 * Math.cos(S)), {color: css("--hl2"), dash: "4 3"}); }
  path(X.map(x => H(x, E0 * Math.cos(k * x - om * T), 0)), {color: css("--hl"), w: 1});
  path(X.map(x => H(x, 0, c * B0 * Math.cos(k * x - om * T))), {color: css("--hl2"), w: 1, dash: "4 3"});
  const Ey0 = E0 * Math.cos(-om * T), cB0 = c * B0 * Math.cos(-om * T);
  document.getElementById("status").textContent = `t = ${hu(T, 4)}: x = 0-ban Ey = ${hu(Ey0, 4)}, c·Bz = ${hu(cB0, 4)}; a csúcs x = (ω/k)t = ${hu(xp, 4)}-nál` +
    (bad ? `;  hibás B0: c·Bz csúcsa ${hu(c * B0, 2)}, maradéknorma ${BAD} (a 0,42; 0,37 pontban)` : ";  DF3 = 0 (B0 = E0/c, ω = ck)");
  document.getElementById("info").textContent = "E és cB azonos fázisban, egymásra és a terjedési irányra merőlegesen rezeg; a minta ω/k = c = 2 sebességgel tolódik az e1 irányba.";
}
const stop = player(document.getElementById("play"), rng, () => { T = +rng.value; draw(); }, 90);
rng.addEventListener("input", () => { stop(); T = +rng.value; draw(); });
document.getElementById("t0").onclick = () => { stop(); T = 0; rng.value = 0; draw(); };
document.getElementById("t05").onclick = () => { stop(); T = 0.5; rng.value = 0.5; draw(); };
document.getElementById("bad").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
