<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vektor és bivektor szorzata térben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--hl3:#548235;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--grid:#e6e6e6;--grid2:#9a9a9a;--fill:#e8eef6;--fill2:#f6e6da}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--hl3:#9fd08a;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--grid:#333;--grid2:#777;--fill:#26364a;--fill2:#4a3424}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=number],input[type=text]{font:inherit;width:4.5em;padding:2px 4px}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Az a vektor és B">
  <label>a = (<input id="a1" type="number" step="0.5" value="3" aria-label="a x">; <input id="a2" type="number" step="0.5" value="-1" aria-label="a y">; <input id="a3" type="number" step="0.5" value="2" aria-label="a z">)</label>
  <label for="be">B = β e12, β =</label><input id="be" type="range" min="-3" max="3" step="0.5" value="2" aria-label="B együtthatója"><b id="bev">2</b>
  <button id="reset">Alaphelyzet (kidolgozott példa)</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 640 420" role="img" aria-label="Az a vektor síkbeli része 90°-kal elfordul és B nagyságával nyúlik; a síkra merőleges rész trivektorrá válik"></svg>
  
</div>
<p class="small">Számított értékek: B = β e12 esetén a·B = a∥B = β(−a2; a1), a∧B = β·a3·e123. Kezdőállapot a kidolgozott példa: a = 3e1 − e2 + 2e3, B = 2e12, a·B = 2e1 + 6e2, |a·B| = √40 ≈ 6,3246, a∧B = 4e123. A felülnézet ívnyila a B körüljárása.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const q in attrs)e.setAttribute(q,attrs[q]);if(text!==undefined&&text!==null)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

if (!getComputedStyle(document.documentElement).getPropertyValue("--grid").trim()) { const st = document.createElement("style");
  st.textContent = ":root{--grid:#e6e6e6;--grid2:#9a9a9a;--fill:#e8eef6;--fill2:#f6e6da;--hl3:#548235}@media (prefers-color-scheme:dark){:root{--grid:#333;--grid2:#777;--fill:#26364a;--fill2:#4a3424;--hl3:#9fd08a}}";
  document.head.appendChild(st); }
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function hug(x, d){ let s = hu(x, d === undefined ? 4 : d); if (s.indexOf(",") >= 0) s = s.replace(/0+$/, "").replace(/,$/, ""); return s === "−0" ? "0" : s; }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }
// 2D nézet: világkoordináta -> SVG; s = pixel / egység, (ox, oy) az origó helye
function View(ox, oy, s){ return {ox: ox, oy: oy, s: s, X: x => ox + s * x, Y: y => oy - s * y,
  inv: (px, py) => [(px - ox) / s, (oy - py) / s]}; }
function gridAxes(V, x0, x1, y0, y1, o){ o = o || {};
  for (let x = Math.ceil(x0); x <= x1; x++) el("line", {x1: V.X(x), y1: V.Y(y0), x2: V.X(x), y2: V.Y(y1), stroke: css("--grid"), "stroke-width": 1});
  for (let y = Math.ceil(y0); y <= y1; y++) el("line", {x1: V.X(x0), y1: V.Y(y), x2: V.X(x1), y2: V.Y(y), stroke: css("--grid"), "stroke-width": 1});
  el("line", {x1: V.X(x0), y1: V.Y(0), x2: V.X(x1), y2: V.Y(0), stroke: css("--grid2"), "stroke-width": 1.2});
  el("line", {x1: V.X(0), y1: V.Y(y0), x2: V.X(0), y2: V.Y(y1), stroke: css("--grid2"), "stroke-width": 1.2});
  if (o.labels !== false) { el("text", {x: V.X(x1) - 4, y: V.Y(0) + 14, "font-size": 12, "text-anchor": "end", fill: css("--muted")}, "x");
    el("text", {x: V.X(0) + 6, y: V.Y(y1) + 12, "font-size": 12, fill: css("--muted")}, "y"); } }
function varrow(V, a, b, o){ arrow(V.X(a[0]), V.Y(a[1]), V.X(b[0]), V.Y(b[1]), o); }
function vtext(V, p, t, o){ o = o || {}; const a = {x: V.X(p[0]) + (o.dx || 0), y: V.Y(p[1]) + (o.dy || 0), "font-size": o.fs || 13, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold"; if (o.fill) a.fill = o.fill; return el("text", a, t); }
function vpoly(V, pts, o){ o = o || {}; return el("polygon", {points: pts.map(p => V.X(p[0]).toFixed(1) + "," + V.Y(p[1]).toFixed(1)).join(" "),
  fill: o.fill || "none", "fill-opacity": o.op === undefined ? 1 : o.op, stroke: o.stroke || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""}); }
// nyilas ív (fokban, a0 -> a1, matematikai pozitív irány) a c középpont körül, r világegységben
function varc(V, c, r, a0, a1, o){ o = o || {}; const n = Math.max(4, Math.ceil(Math.abs(a1 - a0) / 3)); let d = "", last = null, prev = null;
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180, x = V.X(c[0] + r * Math.cos(a)), y = V.Y(c[1] + r * Math.sin(a)); d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); prev = last; last = [x, y]; }
  el("path", {d: d, fill: "none", stroke: o.col || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""});
  if (o.head !== false && prev && Math.abs(a1 - a0) > 4) arrowHead(prev[0], prev[1], last[0], last[1], o.col || css("--fg"), o.sz || 9); }
// húzható fogantyúk: a render feltölti a HANDLES listát ({id, x, y} SVG-koordinátában)
let HANDLES = [], DRAG = null;
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function enableDrag(onDrag, onFree){
  svg.addEventListener("pointerdown", ev => { const p = svgPt(ev); let best = null, bd = 22;
    HANDLES.forEach(h => { const d = Math.hypot(h.x - p.x, h.y - p.y); if (d < bd) { bd = d; best = h; } });
    DRAG = best ? {id: best.id} : (onFree ? {free: true, x: p.x, y: p.y} : null);
    if (DRAG) { svg.setPointerCapture(ev.pointerId); ev.preventDefault(); } });
  svg.addEventListener("pointermove", ev => { if (!DRAG) return; const p = svgPt(ev);
    if (DRAG.free) { onFree(p.x - DRAG.x, p.y - DRAG.y); DRAG.x = p.x; DRAG.y = p.y; } else onDrag(DRAG.id, p.x, p.y); });
  const end = () => { DRAG = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end); }
function handle(id, x, y){ HANDLES.push({id: id, x: x, y: y}); el("circle", {cx: x, cy: y, r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 2"}); }
// 3D: forgatható ortografikus kamera (yaw a z körül, pitch a vízszinteshez képest)
function Cam(yaw, pitch, s, cx, cy){ const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const V = [sy * cp, -cy_ * cp, sp], r = [cy_, sy, 0], u = [-sy * sp, cy_ * sp, cp];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return {V: V, P: X => [cx + s * dot(X, r), cy - s * dot(X, u)], D: X => dot(X, V)}; }


const VT = View(150, 230, 22), VS = View(470, 230, 34);
function draw(){
  svg.innerHTML = "";
  const a = ["a1", "a2", "a3"].map(i => +g(i).value), be = +g("be").value;
  g("bev").textContent = hug(be, 1);
  const ap = [a[0], a[1]], dB = [-be * a[1], be * a[0]], tri = be * a[2];   // a·B = a∥B (B = β e12), a∧B = β a3 e123
  el("text", {x: 150, y: 20, "font-size": 13, "text-anchor": "middle", "font-weight": "bold"}, "felülnézet (xy)");
  el("text", {x: 470, y: 20, "font-size": 13, "text-anchor": "middle", "font-weight": "bold"}, "oldalnézet (xz)");
  gridAxes(VT, -6, 6, -7.5, 8.5);
  const sq = Math.sqrt(Math.abs(be));
  if (be) vpoly(VT, [[0, 0], [sq, 0], [sq, sq], [0, sq]], {fill: css("--fill"), op: 0.8, w: 1});
  if (be) varc(VT, [sq / 2, sq / 2], 0.32 * sq + 0.2, be > 0 ? -60 : 240, be > 0 ? 240 : -60, {w: 1.2});
  varrow(VT, [0, 0], ap, {col: css("--hl"), w: 2.6}); varrow(VT, [0, 0], dB, {col: css("--hl2"), w: 2.6, dash: "7 4"});
  vtext(VT, ap, "a∥", {dx: 6, dy: 14, bold: true}); vtext(VT, dB, "a·B", {dx: 6, dy: -4, bold: true});
  // oldalnézet
  gridAxes(VS, -4, 4.5, -4, 5, {labels: false});
  el("text", {x: VS.X(4.4), y: VS.Y(0) + 14, "font-size": 12, fill: css("--muted"), "text-anchor": "end"}, "x"); el("text", {x: VS.X(0) + 6, y: VS.Y(4.8), "font-size": 12, fill: css("--muted")}, "z");
  el("line", {x1: VS.X(-4), y1: VS.Y(0), x2: VS.X(4.5), y2: VS.Y(0), stroke: css("--fg"), "stroke-width": 3});
  if (be && a[2]) vpoly(VS, [[0, 0], [sq, 0], [sq, a[2]], [0, a[2]]], {fill: css("--fill2"), op: 0.85, w: 1});
  varrow(VS, [0, 0], [0, a[2]], {col: css("--hl"), w: 2.6}); vtext(VS, [0, a[2]], "a⊥", {dx: 6, dy: a[2] >= 0 ? -2 : 14, bold: true});
  varrow(VS, [0, 0], [a[0], a[2]], {col: css("--muted"), w: 1.4, dash: "2 3"}); vtext(VS, [a[0], a[2]], "a", {dx: 6, fill: css("--muted")});
  vtext(VS, [-3.8, -3.4], "hasáb: |a⊥|·|B| = " + hug(Math.abs(a[2]) * Math.abs(be), 3), {fs: 12});
  const dp = ap[0] * dB[0] + ap[1] * dB[1];
  g("status").textContent = "a∥ = (" + hug(ap[0], 2) + "; " + hug(ap[1], 2) + "), a·B = (" + hug(dB[0], 2) + "; " + hug(dB[1], 2) + "), a∥·(a·B) = " + hug(dp, 3) +
    ";  |a∥| = " + hu(Math.hypot(...ap), 4) + ", |a·B| = " + hu(Math.hypot(...dB), 4) + ";  a⊥ = " + hug(a[2], 2) + "e3, a∧B = " + hug(tri, 3) + " e123";
}
["a1", "a2", "a3", "be"].forEach(i => g(i).addEventListener("input", draw));
g("reset").onclick = () => { g("a1").value = 3; g("a2").value = -1; g("a3").value = 2; g("be").value = 2; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
