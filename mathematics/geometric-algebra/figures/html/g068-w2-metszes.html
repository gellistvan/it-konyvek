  const closed = cdot(S1, S2) ** 2 - cdot(S1, S1) * cdot(S2, S2);
  let kind, pts = [];
  if (gmax(W) < 1e-12) kind = "egybeeső körök: W = 0, a meet nem egyértelmű";
  else if (Math.abs(W2) < 1e-9) { kind = "érintés (W² = 0): egyetlen, kétszeres pont"; pts = circInter([0, 0], r1, [c2x, 0], r2); }
  else if (W2 < 0) { kind = "két valós metszéspont (W² < 0)"; pts = circInter([0, 0], r1, [c2x, 0], r2); }
  else kind = (Math.abs(c2x) < 1e-12 ? "koncentrikus" : (Math.abs(c2x) > r1 + r2 ? "külsőleg diszjunkt" : "egymásba zárt")) + ": nincs valós metszés (W² > 0, képzetes pontpár)";
  const chk = pts.map(p => Math.max(gmax(gwedge(cpoint(p[0], p[1]), Mm)), Math.abs(cdot(cpoint(p[0], p[1]), S1)), Math.abs(cdot(cpoint(p[0], p[1]), S2))));
  return {S1, S2, W, Mm, W2, closed, kind, pts, chk};
}

const V = View(-2.6, 7.6, -3.2, 3.2, 10, 6, 620, 372);
function draw(){
  svg.innerHTML = ""; grid(V);
  const d = +document.getElementById("d").value; document.getElementById("dv").textContent = hu(d, 2);
  const A = analyse(2, d, 2);
  const st = Math.abs(A.W2) < 1e-9 ? "0" : (A.W2 < 0 ? "6 3" : "2 4");
  circle([0, 0], 2, {color: css("--fg")}); circle([d, 0], 2, {color: css("--hl"), dash: st, w: 2.4});
  A.pts.forEach(p => { el("rect", {x: V.X(p[0]) - 6, y: V.Y(p[1]) - 6, width: 12, height: 12, fill: css("--hl2")}); lab(V, p, P(p, 3), {color: css("--hl2"), dy: p[1] >= 0 ? -10 : 22}); });
  const sign = Math.abs(A.W2) < 1e-9 ? "W² = 0" : (A.W2 < 0 ? "W² < 0" : "W² > 0");
  const tag = gmax(A.W) < 1e-12 ? "egybeesés" : (Math.abs(A.W2) < 1e-9 ? "érintő" : (A.W2 < 0 ? "valós" : "képzetes"));
  lab(V, [-2.4, 2.9], sign + " → " + tag, {fs: 16, bold: true, dx: 0, dy: 0});
  document.getElementById("status").textContent = `d = ${hu(d, 2)}: W² = d²(d² − 16)/4 = ${hu(A.closed, 4)} — ${A.kind}`;
  document.getElementById("info").textContent = "S1 = " + grepr(A.S1) + "\nS2 = " + grepr(A.S2) + "\nW = S1∧S2 = " + grepr(A.W) +
    "\nW² (ga.py-szorzás) = " + hu(A.W2, 4) + (A.pts.length ? "\nmetszéspont(ok): " + A.pts.map(p => P(p, 4)).join(", ") : "");
}
document.getElementById("d").addEventListener("input", draw);
document.querySelectorAll("button[data-d]").forEach(b => b.onclick = () => { document.getElementById("d").value = b.dataset.d; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
