<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blade_mul lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="na">bal: </label><select id="na" aria-label="Bal oldali bázispenge"><option>1</option><option>e1</option><option>e2</option><option>e3</option><option>e12</option><option>e21</option><option>e13</option><option>e31</option><option selected>e23</option><option>e32</option><option>e123</option></select><label for="nb">jobb: </label><select id="nb" aria-label="Jobb oldali bázispenge"><option>1</option><option>e1</option><option>e2</option><option>e3</option><option>e12</option><option>e21</option><option>e13</option><option selected>e31</option><option>e23</option><option>e32</option><option>e123</option></select><label for="met">metrika: </label><select id="met" aria-label="Metrika"><option value="1,1,1">G(3) [1, 1, 1]</option><option value="1,-1,-1">STA-részlet [1, −1, −1]</option><option value="0,1,1">degenerált [0, 1, 1]</option><option value="1,1,0">degenerált [1, 1, 0]</option></select></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 110 és 101 maszk szorzása: az e2 és az e3 bitnél is egy kisebb helyiértékű bit van a jobb oldali maszkban, így az előjel kétszer vált, a közös e3 bit metrikája 1, a kimeneti maszk 011, az együtthatóval −e12."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A bal és jobb bázispenge (nem növekvő névvel is, pl. e31 = −e13) és a metrika választható; ◀/▶ a 22.1.6 blade_mul ciklusának lépései, a kódpanel az aktuális sort emeli ki. Narancs gyűrű: a p bit; sraffozás: az mb & (p−1) maszk, illetve a közös bitek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ma": 6, "mb": 5, "p": -1, "mask": -1, "common": -1, "out": -1, "line": 0, "sign": 1, "factor": null, "msg": "e23 · e31: ma = 0b110 (e23), mb = 0b101 (e13), együttható +1·−1 = −1"}, {"ma": 6, "mb": 5, "p": 2, "mask": 1, "common": -1, "out": -1, "line": 5, "sign": -1.0, "factor": null, "msg": "p = 0b010 (e2), mb & (p−1) = 0b001, popcount = 1 → sign = −1"}, {"ma": 6, "mb": 5, "p": 4, "mask": 1, "common": -1, "out": -1, "line": 5, "sign": 1.0, "factor": null, "msg": "p = 0b100 (e3), mb & (p−1) = 0b001, popcount = 1 → sign = +1"}, {"ma": 6, "mb": 5, "p": 4, "mask": -1, "common": 4, "out": -1, "line": 13, "sign": 1.0, "factor": 1.0, "msg": "common = ma & mb = 0b100: közös bit e3, g33 = 1 → factor = 1"}, {"ma": 6, "mb": 5, "p": -1, "mask": -1, "common": 4, "out": 3, "line": 15, "sign": 1.0, "factor": 1.0, "msg": "mask_out = ma ^ mb = 0b110 ^ 0b101 = 0b011 = e12"}, {"ma": 6, "mb": 5, "p": -1, "mask": -1, "common": 4, "out": 3, "line": 18, "sign": 1.0, "factor": 1.0, "msg": "együttható: (−1)·(+1)·1 = −1 → e23 · e31 = −1·e12"}];
const CODE = ["def blade_mul(self, ma, mb):", "    sign = 1.0", "    t = ma", "    while t:", "        p = t & -t                 # a legalacsonyabb bekapcsolt bit", "        if _popcount(mb & (p - 1)) % 2:", "            sign = -sign", "        t ^= p", "    common = ma & mb", "    factor = 1.0", "    while common:", "        p = common & -common", "        idx = p.bit_length() - 1", "        factor *= self.metric[idx]", "        common ^= p", "    mask_out = ma ^ mb", "    if factor == 0.0:", "        return 0.0, None", "    return sign * factor, mask_out"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BN = ["1", "e1", "e2", "e12", "e3", "e13", "e23", "e123"];
const pcnt = x => { let c = 0; while (x) { c += x & 1; x >>= 1; } return c; };
const b3 = m => "0b" + m.toString(2).padStart(3, "0");
const fmt = v => (v > 0 ? "+" : (v < 0 ? "−" : "")) + String(Math.abs(v));
function canon(n){ if (n === "1") return [0, 1]; const idx = n.slice(1).split("").map(Number); let inv = 0;
  for (let i = 0; i < idx.length; i++) for (let j = i + 1; j < idx.length; j++) if (idx[i] > idx[j]) inv++;
  return [idx.reduce((m, q) => m | (1 << (q - 1)), 0), inv % 2 ? -1 : 1]; }
function trace(na, nb, metric){
  const [ma, ca] = canon(na), [mb, cb] = canon(nb), cf = ca * cb, st = [], base = {ma, mb, p: -1, mask: -1, common: -1, out: -1};
  st.push(Object.assign({}, base, {line: 0, sign: 1, factor: null, msg: `${na} · ${nb}: ma = ${b3(ma)} (${BN[ma]}), mb = ${b3(mb)} (${BN[mb]}), együttható ${fmt(ca)}·${fmt(cb)} = ${fmt(cf)}`}));
  let sign = 1, t = ma;
  while (t) { const p = t & -t, m = mb & (p - 1), fl = pcnt(m) % 2; if (fl) sign = -sign;
    st.push(Object.assign({}, base, {p, mask: m, line: 5, sign, factor: null, msg: `p = ${b3(p)} (e${Math.log2(p) + 1}), mb & (p−1) = ${b3(m)}, popcount = ${pcnt(m)} → sign = ${fmt(sign)}` + (fl ? "" : " (nem vált)")}));
    t ^= p; }
  let common = ma & mb, factor = 1;
  if (!common) st.push(Object.assign({}, base, {common: 0, line: 8, sign, factor: 1, msg: "common = ma & mb = 0b000: nincs közös bit, factor = 1"}));
  while (common) { const p = common & -common, idx = Math.log2(p); factor *= metric[idx];
    st.push(Object.assign({}, base, {common: ma & mb, p, line: 13, sign, factor, msg: `common = ma & mb = ${b3(ma & mb)}: közös bit e${idx + 1}, g${idx + 1}${idx + 1} = ${metric[idx]} → factor = ${factor}`}));
    common ^= p; }
  const out = ma ^ mb;
  if (factor === 0) { st.push(Object.assign({}, base, {common: ma & mb, out, line: 17, sign, factor: 0, msg: `factor == 0.0 → return 0.0, None: a szorzat ${na} · ${nb} = 0 (degenerált metrika)`})); return st; }
  st.push(Object.assign({}, base, {common: ma & mb, out, line: 15, sign, factor, msg: `mask_out = ma ^ mb = ${b3(ma)} ^ ${b3(mb)} = ${b3(out)} = ${BN[out]}`}));
  const res = cf * sign * factor;
  st.push(Object.assign({}, base, {common: ma & mb, out, line: 18, sign, factor, msg: `együttható: (${fmt(cf)})·(${fmt(sign)})·${factor} = ${fmt(res)} → ${na} · ${nb} = ${fmt(res)}·${BN[out]}`}));
  return st; }
function bitrow(y, label, m, opt){ opt = opt || {};
  el("text", {x: 20, y: y + 6, "font-size": 15}, label);
  for (let k = 0; k < 3; k++) { const bit = 2 - k, on = m >= 0 && (m >> bit & 1), cx = 220 + 60 * k;
    if (opt.hatch !== undefined && opt.hatch >= 0 && (opt.hatch >> bit & 1)) el("circle", {cx, cy: y, r: 20, fill: "url(#hb)"});
    el("circle", {cx, cy: y, r: 16, fill: on ? css("--fg") : css("--bg"), stroke: css("--line"), "stroke-width": 1.4});
    if (opt.p >= 0 && (opt.p >> bit & 1)) el("circle", {cx, cy: y, r: 23, fill: "none", stroke: css("--hl2"), "stroke-width": 4});
    if (y <= 60) el("text", {x: cx, y: 26, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "e" + (bit + 1)); }
  if (m >= 0) el("text", {x: 410, y: y + 6, "font-size": 15}, b3(m) + (opt.name ? "  " + opt.name : "")); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = "";
  svg.innerHTML = `<defs><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--hl2")}" stroke-width="2.5"/></pattern></defs>`;
  bitrow(60, "ma", s.ma, {p: s.p, name: BN[s.ma]});
  bitrow(110, "mb", s.mb, {hatch: s.mask >= 0 ? s.mask : (s.common > 0 ? s.common : -1), name: BN[s.mb]});
  if (s.mask >= 0) bitrow(160, "mb & (p−1)", s.mask, {});
  else if (s.common >= 0) bitrow(160, "common", s.common, {p: s.p});
  if (s.out >= 0) bitrow(210, "mask_out", s.out, {name: BN[s.out]});
  el("text", {x: 20, y: 268, "font-size": 16, "font-weight": "bold"}, "sign = " + fmt(s.sign) + (s.factor === null ? "" : "    factor = " + s.factor));
}
function recompute(){ setSteps(trace(document.getElementById("na").value, document.getElementById("nb").value, document.getElementById("met").value.split(",").map(Number))); }
["na", "nb", "met"].forEach(id => document.getElementById(id).addEventListener("change", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
