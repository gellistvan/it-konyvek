<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R∘T és T∘R a síkban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az egységnégyzet és egy F jel képe két sorrendben: előbb tükrözés, majd forgatás, illetve fordítva; P képe (0,1), illetve (0,−1)"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított mátrixok (köztes képkockák: lineáris átmenet a tükrözésnél, 22,5°-os lépés a forgatásnál). R∘T = [[0, 1], [1, 0]] (tükrözés az y = x egyenesre), T∘R = [[0, −1], [−1, 0]] (tükrözés az y = −x egyenesre).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"L": [[1.0, 0.0], [0.0, 1.0]], "R": [[1.0, 0.0], [0.0, 1.0]], "msg": "Kezdőállapot: P = (1; 0) (fekete pont), e₂ szaggatott; mindkét oldalon az egységnégyzet és az „F” jel.", "line": 0}, {"L": [[1.0, 0.0], [0.0, 0.5]], "R": [[0.92388, -0.382683], [0.382683, 0.92388]], "msg": "1. művelet: bal oldalon T (tükrözés), jobb oldalon R (forgatás) …", "line": 1}, {"L": [[1.0, 0.0], [0.0, 0.0]], "R": [[0.707107, -0.707107], [0.707107, 0.707107]], "msg": "1. művelet: bal oldalon T (tükrözés), jobb oldalon R (forgatás) …", "line": 1}, {"L": [[1.0, 0.0], [0.0, -0.5]], "R": [[0.382683, -0.92388], [0.92388, 0.382683]], "msg": "1. művelet: bal oldalon T (tükrözés), jobb oldalon R (forgatás) …", "line": 1}, {"L": [[1.0, 0.0], [0.0, -1.0]], "R": [[0.0, -1.0], [1.0, 0.0]], "msg": "1. művelet: bal oldalon T (tükrözés), jobb oldalon R (forgatás): bal P → (1; 0), jobb P → (0; 1).", "line": 1}, {"L": [[0.92388, 0.382683], [0.382683, -0.92388]], "R": [[0.0, -1.0], [0.5, 0.0]], "msg": "2. művelet: bal oldalon R, jobb oldalon T …", "line": 2}, {"L": [[0.707107, 0.707107], [0.707107, -0.707107]], "R": [[0.0, -1.0], [0.0, 0.0]], "msg": "2. művelet: bal oldalon R, jobb oldalon T …", "line": 2}, {"L": [[0.382683, 0.92388], [0.92388, -0.382683]], "R": [[0.0, -1.0], [-0.5, 0.0]], "msg": "2. művelet: bal oldalon R, jobb oldalon T …", "line": 2}, {"L": [[0.0, 1.0], [1.0, -0.0]], "R": [[0.0, -1.0], [-1.0, 0.0]], "msg": "2. művelet: bal oldalon R, jobb oldalon T: bal (R∘T)(P) = (0; 1), jobb (T∘R)(P) = (0; −1) – a két sorrend különböző eredményt ad.", "line": 5}];
const CODE = ["P = (1, 0)", "T(x, y) = (x, −y)      # tükrözés az x-tengelyre", "R(x, y) = (−y, x)      # 90°-os forgatás", "bal:  (R∘T)(P) = R(T(P)) = R(1, 0) = (0, 1)", "jobb: (T∘R)(P) = T(R(P)) = T(0, 1) = (0, −1)", "(0, 1) ≠ (0, −1)  ⇒  R∘T ≠ T∘R"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

if (!getComputedStyle(document.documentElement).getPropertyValue("--grid").trim()) { const st = document.createElement("style");
  st.textContent = ":root{--grid:#e6e6e6;--grid2:#9a9a9a;--fill:#e8eef6;--fill2:#f6e6da;--hl3:#548235}@media (prefers-color-scheme:dark){:root{--grid:#333;--grid2:#777;--fill:#26364a;--fill2:#4a3424;--hl3:#9fd08a}}";
  document.head.appendChild(st); }
function hu(x, d){ if (d === undefined) d = 4; let s = (Math.abs(x) < 0.5 * Math.pow(10, -d) ? 0 : x).toFixed(d); return s.replace(".", ",").replace("-", "−"); }
function hug(x, d){ let s = hu(x, d === undefined ? 4 : d); if (s.indexOf(",") >= 0) s = s.replace(/0+$/, "").replace(/,$/, ""); return s === "−0" ? "0" : s; }
function g(id){ return document.getElementById(id); }
function arrowHead(x0, y0, x1, y1, col, sz){ sz = sz || 10; const a = Math.atan2(y1 - y0, x1 - x0);
  const p = [[x1, y1], [x1 - sz * Math.cos(a - 0.38), y1 - sz * Math.sin(a - 0.38)], [x1 - sz * Math.cos(a + 0.38), y1 - sz * Math.sin(a + 0.38)]];
  el("polygon", {points: p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), fill: col}); }
function arrow(x0, y0, x1, y1, o){ o = o || {}; const col = o.col || css("--fg");
  if (Math.hypot(x1 - x0, y1 - y0) < 1) return;
  const a = Math.atan2(y1 - y0, x1 - x0), sz = o.sz || 10, xe = x1 - 0.8 * sz * Math.cos(a), ye = y1 - 0.8 * sz * Math.sin(a);
  el("line", {x1: x0, y1: y0, x2: xe, y2: ye, stroke: col, "stroke-width": o.w || 2, "stroke-dasharray": o.dash || ""});
  arrowHead(x0, y0, x1, y1, col, sz); }
// 2D nézet: világkoordináta -> SVG; s = pixel / egység, (ox, oy) az origó helye
function View(ox, oy, s){ return {ox: ox, oy: oy, s: s, X: x => ox + s * x, Y: y => oy - s * y,
  inv: (px, py) => [(px - ox) / s, (oy - py) / s]}; }
function gridAxes(V, x0, x1, y0, y1, o){ o = o || {};
  for (let x = Math.ceil(x0); x <= x1; x++) el("line", {x1: V.X(x), y1: V.Y(y0), x2: V.X(x), y2: V.Y(y1), stroke: css("--grid"), "stroke-width": 1});
  for (let y = Math.ceil(y0); y <= y1; y++) el("line", {x1: V.X(x0), y1: V.Y(y), x2: V.X(x1), y2: V.Y(y), stroke: css("--grid"), "stroke-width": 1});
  el("line", {x1: V.X(x0), y1: V.Y(0), x2: V.X(x1), y2: V.Y(0), stroke: css("--grid2"), "stroke-width": 1.2});
  el("line", {x1: V.X(0), y1: V.Y(y0), x2: V.X(0), y2: V.Y(y1), stroke: css("--grid2"), "stroke-width": 1.2});
  if (o.labels !== false) { el("text", {x: V.X(x1) - 4, y: V.Y(0) + 14, "font-size": 12, "text-anchor": "end", fill: css("--muted")}, "x");
    el("text", {x: V.X(0) + 6, y: V.Y(y1) + 12, "font-size": 12, fill: css("--muted")}, "y"); } }
function varrow(V, a, b, o){ arrow(V.X(a[0]), V.Y(a[1]), V.X(b[0]), V.Y(b[1]), o); }
function vtext(V, p, t, o){ o = o || {}; const a = {x: V.X(p[0]) + (o.dx || 0), y: V.Y(p[1]) + (o.dy || 0), "font-size": o.fs || 13, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold"; if (o.fill) a.fill = o.fill; return el("text", a, t); }
function vpoly(V, pts, o){ o = o || {}; return el("polygon", {points: pts.map(p => V.X(p[0]).toFixed(1) + "," + V.Y(p[1]).toFixed(1)).join(" "),
  fill: o.fill || "none", "fill-opacity": o.op === undefined ? 1 : o.op, stroke: o.stroke || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""}); }
// nyilas ív (fokban, a0 -> a1, matematikai pozitív irány) a c középpont körül, r világegységben
function varc(V, c, r, a0, a1, o){ o = o || {}; const n = Math.max(4, Math.ceil(Math.abs(a1 - a0) / 3)); let d = "", last = null, prev = null;
  for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180, x = V.X(c[0] + r * Math.cos(a)), y = V.Y(c[1] + r * Math.sin(a)); d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1); prev = last; last = [x, y]; }
  el("path", {d: d, fill: "none", stroke: o.col || css("--fg"), "stroke-width": o.w || 1.5, "stroke-dasharray": o.dash || ""});
  if (o.head !== false && prev && Math.abs(a1 - a0) > 4) arrowHead(prev[0], prev[1], last[0], last[1], o.col || css("--fg"), o.sz || 9); }
// húzható fogantyúk: a render feltölti a HANDLES listát ({id, x, y} SVG-koordinátában)
let HANDLES = [], DRAG = null;
function svgPt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function enableDrag(onDrag, onFree){
  svg.addEventListener("pointerdown", ev => { const p = svgPt(ev); let best = null, bd = 22;
    HANDLES.forEach(h => { const d = Math.hypot(h.x - p.x, h.y - p.y); if (d < bd) { bd = d; best = h; } });
    DRAG = best ? {id: best.id} : (onFree ? {free: true, x: p.x, y: p.y} : null);
    if (DRAG) { svg.setPointerCapture(ev.pointerId); ev.preventDefault(); } });
  svg.addEventListener("pointermove", ev => { if (!DRAG) return; const p = svgPt(ev);
    if (DRAG.free) { onFree(p.x - DRAG.x, p.y - DRAG.y); DRAG.x = p.x; DRAG.y = p.y; } else onDrag(DRAG.id, p.x, p.y); });
  const end = () => { DRAG = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end); }
function handle(id, x, y){ HANDLES.push({id: id, x: x, y: y}); el("circle", {cx: x, cy: y, r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 2"}); }
// 3D: forgatható ortografikus kamera (yaw a z körül, pitch a vízszinteshez képest)
function Cam(yaw, pitch, s, cx, cy){ const cy_ = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const V = [sy * cp, -cy_ * cp, sp], r = [cy_, sy, 0], u = [-sy * sp, cy_ * sp, cp];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  return {V: V, P: X => [cx + s * dot(X, r), cy - s * dot(X, u)], D: X => dot(X, V)}; }

function render(s){
  svg.setAttribute("viewBox", "0 0 640 340"); svg.innerHTML = "";
  const F = [[0.15,0.1],[0.32,0.1],[0.32,0.45],[0.6,0.45],[0.6,0.6],[0.32,0.6],[0.32,0.75],[0.75,0.75],[0.75,0.9],[0.15,0.9]];
  const SQ = [[0,0],[1,0],[1,1],[0,1]];
  [[s.L, 165, "R∘T: előbb T, aztán R"], [s.R, 475, "T∘R: előbb R, aztán T"]].forEach(([M, ox, t]) => {
    const V = View(ox, 186, 105), ap = p => [M[0][0]*p[0] + M[0][1]*p[1], M[1][0]*p[0] + M[1][1]*p[1]];
    gridAxes(V, -1.4, 1.4, -1.4, 1.4, {labels: false});
    vpoly(V, SQ, {stroke: css("--muted"), dash: "2 3", w: 1});
    vpoly(V, SQ.map(ap), {fill: css("--cellhl"), op: 0.6, w: 1.2});
    vpoly(V, F.map(ap), {fill: css("--fg"), op: 0.75, w: 0.8});
    const a = ap([1, 0]), b = ap([0, 1]);
    varrow(V, [0, 0], a, {w: 3, col: css("--hl")}); varrow(V, [0, 0], b, {w: 2, dash: "6 4", col: css("--hl2")});
    el("circle", {cx: V.X(a[0]), cy: V.Y(a[1]), r: 5, fill: css("--fg")});
    vtext(V, a, "P (" + hug(a[0], 2) + "; " + hug(a[1], 2) + ")", {dx: a[0] < -0.2 ? -8 : 8, dy: a[1] > 0.2 ? -6 : 16, anchor: a[0] < -0.2 ? "end" : "start", fs: 12, bold: true});
    el("text", {x: ox, y: 18, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, t);
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
