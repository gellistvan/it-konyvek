<!doctype html>
<html lang="hu">
<head>

<title>Szinuszjel paraméterei és a fázis</title>
<style>

.ee-check{margin-top:4px}

.ee-feedback.ok{border-left:4px solid var(--ok);padding-left:8px;margin-top:6px}

.ee-step button{margin:0 8px 4px 0}
.ee-question{font-weight:600}
.ee-trail{color:var(--muted);font-size:12.5px;padding-left:20px}
.ee-checklist details{border:1px solid var(--grid);border-radius:6px;padding:4px 10px;margin-bottom:6px}

.ee-item{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;padding:2px 0}
.ee-item label{display:flex;gap:7px;align-items:flex-start;flex:1;min-width:240px}
.ee-item input{margin-top:4px}
.ee-item .ee-link{font-size:12px}
</style>

const pos = $("input", {type: "range", min: 0, max: 0, value: 0, "aria-label": "Időpillanat"});
const cnt = $("span", {class: "small"});
let playBtn;
if (spec.frames) {
btn("⏮", "Elejére", () => { stop(); go(0); });
btn("◀", "Egy lépés vissza", () => { stop(); go(a.frame - 1); });
playBtn = btn("▶ Lejátszás", "Lejátszás / szünet", () => a.playing ? stop() : play());
btn("▶|", "Egy lépés előre", () => { stop(); go(a.frame + 1); });
bar.appendChild(pos); bar.appendChild(cnt);
const sp = $("select", {"aria-label": "Sebesség", title: "Lejátszási sebesség"});
[["0.5", "0,5×"], ["1", "1×"], ["2", "2×"], ["4", "4×"]].forEach(([v, l]) => { const o = $("option", {value: v}, l); if (v === "1") o.selected = true; sp.appendChild(o); });
sp.onchange = () => { a.speed = +sp.value; if (a.playing) { stop(); play(); } };
bar.appendChild(sp); a.speed = 1;
pos.oninput = () => { stop(); go(+pos.value); };
root.appendChild(bar);
}
const prm = $("div", {class: "params"});
const inputs = {};
(spec.params || []).forEach(q => {
const list = q.values || (q.series ? EE.eRange(q.series, q.min, q.max) : null);
const nearest = v => list.reduce((b, x, i) => Math.abs(x - v) < Math.abs(list[b] - v) ? i : b, 0);
const toPos = v => list ? nearest(v) : q.log ? Math.log10(v) : v;
const fromPos = v => list ? list[Math.round(v)] : q.log ? Math.pow(10, v) : v;
p[q.id] = list ? list[nearest(q.value)] : q.value;
const lab = $("label", {class: "param"}), out = $("output", {}), inp = $("input", {type: "range",
min: list ? 0 : toPos(q.min), max: list ? list.length - 1 : toPos(q.max),
step: list ? 1 : q.log ? "any" : (q.step || "any"), value: toPos(p[q.id]), "aria-label": q.label.replace(/[_{}]/g, "")});
const show = () => EE.setText(out, q.fmt ? q.fmt(p[q.id]) : q.unit !== undefined ? EE.eng(p[q.id], q.unit) : EE.sig(p[q.id], 3));
inp.oninput = () => { p[q.id] = fromPos(+inp.value); show(); q.rebuild === false ? draw() : rebuild(); };
inputs[q.id] = {inp, show, lab, toPos, q};
lab.append($("span", {}, q.label), inp, out); prm.appendChild(lab); show();
});
(spec.selects || []).forEach(q => {
p[q.id] = q.value;
const lab = $("label", {class: "param"}), sel = $("select", {"aria-label": q.label});
q.options.forEach(([v, l]) => { const o = $("option", {value: v}, l); if (v === q.value) o.selected = true; sel.appendChild(o); });
sel.onchange = () => { p[q.id] = sel.value; q.rebuild === false ? draw() : rebuild(); };
inputs[q.id] = {inp: sel, lab, toPos: v => v, show: () => {}, select: true};
lab.append($("span", {}, q.label), sel); prm.appendChild(lab);
});
(spec.toggles || []).forEach(q => {
p[q.id] = !!q.value;
const lab = $("label", {class: "toggle"}), inp = $("input", {type: "checkbox"});
inputs[q.id] = {inp, lab, toggle: true};
inp.checked = p[q.id]; inp.onchange = () => { p[q.id] = inp.checked; q.rebuild ? rebuild() : draw(); };
lab.append(inp, $("span", {}, q.label)); prm.appendChild(lab);
});
(spec.buttons || []).forEach(q => { const b = $("button", {type: "button"}, q.label); b.onclick = () => q.action(api); prm.appendChild(b); });
root.appendChild(prm);
function draw() { const msg = spec.render(a.state, a.frame, p, api); if (typeof msg === "string") EE.setText(status, msg); }
function go(f) { const n = nFrames(); a.frame = Math.max(0, Math.min(n - 1, f)); pos.max = Math.max(0, n - 1); pos.value = a.frame;
cnt.textContent = n ? `${a.frame + 1}/${n}` : ""; draw(); }
function play() { if (a.frame >= nFrames() - 1) a.frame = 0; a.playing = true; if (playBtn) playBtn.textContent = "⏸ Szünet";
a.timer = setInterval(() => { if (a.frame >= nFrames() - 1) { stop(); return; } go(a.frame + 1); }, 1000 / ((spec.fps || 8) * a.speed)); }
function stop() { a.playing = false; clearInterval(a.timer); if (playBtn) playBtn.textContent = "▶ Lejátszás"; }
function rebuild() { a.state = spec.build ? spec.build(p, api) : null; go(Math.min(a.frame, nFrames() - 1)); }
function set(id, value, opt = {}) {
const pairs = typeof id === "object" ? Object.entries(id) : [[id, value]];
if (typeof id === "object") opt = value || {};
pairs.forEach(([k, v]) => { const c = inputs[k]; p[k] = v; if (!c) return;
if (c.toggle) c.inp.checked = !!v; else { c.inp.value = c.toPos(v); c.show(); } });
opt.rebuild === false ? draw() : rebuild();
}
function disable(id, off = true) { const c = inputs[id]; if (!c) return; c.inp.disabled = off; c.lab.classList.toggle("disabled", off); }
const api = {params: p, rebuild, redraw: draw, go, play, stop, set, disable, host: prm, get frame() { return a.frame; }, get state() { return a.state; }, set state(s) { a.state = s; }};
rebuild();
const hp = {}; (location.hash || "").slice(1).split("&").forEach(kv => { const [k, v] = kv.split("=");
if (k && k !== "frame" && inputs[k] && v !== undefined) hp[k] = inputs[k].toggle ? v !== "0" && v !== "false" : inputs[k].select ? decodeURIComponent(v) : +decodeURIComponent(v); });
if (Object.keys(hp).length) set(hp);
const hf = /frame=(\d+)/.exec(location.hash || ""); if (hf) go(+hf[1]);
if (spec.autoplay && !hf) play();
return api;
}
return {app};
})();
</script>
<script>
"use strict";
// Az ábraszkript (figures/src/…) által beillesztett adat: ugyanaz, amiből a statikus PNG készült.
const DATA = {"U1":2.0,"F":1000.0,"PHI1":30.0,"U2":1.5,"PHI2":-15.0};
const svg = document.getElementById("view"), content = document.getElementById("content");

const ch = EE.chart(svg, {box: [0, 0, 720, 340], x: {lim: [0, 2], label: "idő a periódusidő egységében (t / T_p)"},
  y: {lim: [-5.5, 5.5], label: "u [V]"}, legend: "tr"});
const N = 400;
UI.app({
  params: [
    {id: "u1", label: "Û₁", min: 0.2, max: 5, step: 0.1, value: DATA.U1, unit: "V"},
    {id: "f", label: "f", min: 10, max: 1e6, value: DATA.F, series: "E24", unit: "Hz"},
    {id: "p1", label: "φ_1", min: -180, max: 180, step: 5, value: DATA.PHI1, fmt: v => EE.num(v, 0) + "°"},
    {id: "u2", label: "Û₂", min: 0.2, max: 5, step: 0.1, value: DATA.U2, unit: "V"},
    {id: "p2", label: "φ_2", min: -180, max: 180, step: 5, value: DATA.PHI2, fmt: v => EE.num(v, 0) + "°"}],
  toggles: [{id: "two", label: "második jel", value: true}],
  render(s, k, p, a) {
    const T = 1 / p.f, x = EE.linspace(0, 2, N + 1);
    const sig = (U, ph) => x.map(q => U * Math.sin(2 * Math.PI * q + ph * Math.PI / 180));
    ch.clear();
    ch.line(x, sig(p.u1, p.p1), "s1", {label: "u_1"});
    if (p.two) ch.line(x, sig(p.u2, p.p2), "s2", {label: "u_2"});
    ch.hline(p.u1 / Math.SQRT2, "cursor", "u_1 effektív értéke");
    const u0 = p.u1 * Math.sin(p.p1 * Math.PI / 180);
    ch.dot(0, u0, "s1");
    let d = ((p.p1 - p.p2) % 360 + 540) % 360 - 180;            // −180 … +180
    if (Math.abs(d + 180) < 1e-9) d = 180;
    if (p.two && Math.abs(d) > 0.1 && Math.abs(d) < 179.9) {
      const z = ((-p.p1 / 360) % 1 + 1) % 1, z2 = z + d / 360;
      const lo = Math.min(z, z2), hi = Math.max(z, z2), sh = lo < 0 ? 1 : 0;
      ch.line([lo + sh, hi + sh], [0, 0], "noise");
      ch.dot(z + sh, 0, "s1").dot(z2 + sh, 0, "s2");
      ch.text((lo + hi) / 2 + sh, 0, "Δt", "anno", {anchor: "middle", dy: -7});
    }
    ch.legend();
    a.disable("u2", !p.two); a.disable("p2", !p.two);
    const dt = Math.abs(d) / 360 * T;
    const rel = !p.two ? "" : Math.abs(d) < 0.1 ? "A két jel fázisban van." :
      Math.abs(d) > 179.9 ? "A két jel ellenfázisban van (180°)." :
      `u_1 ${d > 0 ? "siet" : "késik"} u_2-höz képest ${EE.num(Math.abs(d), 0)}°-kal, azaz Δt = ${EE.eng(dt, "s")}.`;
    return `T_p = 1/f = ${EE.eng(T, "s")}, ω = 2πf = ${EE.eng(2 * Math.PI * p.f, "rad/s")}; u_1(0) = ${EE.num(u0, 2)} V\n` +
      `u_1: U_{pp} = ${EE.num(2 * p.u1, 1)} V, effektív érték Û₁/√2 = ${EE.num(p.u1 / Math.SQRT2, 3)} V\n` + rel;
  }});

</script>
