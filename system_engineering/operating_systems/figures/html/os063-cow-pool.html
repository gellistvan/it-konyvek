<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cow_scrub pool</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="stop();show(0)">init pool.img</button> <button onclick="stop();show(1)">scrub pool.img</button> <button onclick="stop();show(2)">write pool.img 5 "hello"</button> <button onclick="stop();show(4)">corrupt pool-corrupt.img 5 a</button> <button onclick="stop();show(5)">scrub pool-corrupt.img</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A pool.img blokksávja: két superblock-slot, a 64 logikai blokk replikapárjai a 2–129. blokkon, a write után a 12/13 felszabadul és a 130/131 lesz élő, a corrupt után a 130 sérült, a scrub a 131-ből javítja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kimeneti sorok a fejezet cow_scrub.c programjának tényleges futtatásából (gcc 15.2.0, -Wall -Wextra -Werror -std=c11 -O2; scratch-könyvtár, 64 MiB-os ritka pool.img). A scrub-időket nem ábrázoljuk (mérés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cmd": "./cow_scrub init pool.img", "st": {"gen": 1, "map5": [12, 13, 1], "freed": [], "bad": [], "fixed": [], "out": "init: 64 logikai blokk, 130 fizikai blokk, generation=1"}, "line": -1, "msg": "$ ./cow_scrub init pool.img  →  init: 64 logikai blokk, 130 fizikai blokk, generation=1"}, {"cmd": "./cow_scrub scrub pool.img", "st": {"gen": 1, "map5": [12, 13, 1], "freed": [], "bad": [], "fixed": [], "out": "scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}, "line": -1, "msg": "$ ./cow_scrub scrub pool.img  →  scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}, {"cmd": "./cow_scrub write pool.img 5 \"hello\"", "st": {"gen": 2, "map5": [130, 131, 2], "freed": [12, 13], "bad": [], "fixed": [], "out": "write: logical=5 phys=130/131 generation=2"}, "line": -1, "msg": "$ ./cow_scrub write pool.img 5 \"hello\"  →  write: logical=5 phys=130/131 generation=2"}, {"cmd": "./cow_scrub scrub pool.img", "st": {"gen": 2, "map5": [130, 131, 2], "freed": [12, 13], "bad": [], "fixed": [], "out": "scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}, "line": -1, "msg": "$ ./cow_scrub scrub pool.img  →  scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}, {"cmd": "./cow_scrub corrupt pool-corrupt.img 5 a", "st": {"gen": 2, "map5": [130, 131, 2], "freed": [12, 13], "bad": [130], "fixed": [], "out": "corrupt: logical=5 replika=a phys=130 data[0] xor 0xFF (a checksum valtozatlan)"}, "line": -1, "msg": "$ ./cow_scrub corrupt pool-corrupt.img 5 a  →  corrupt: logical=5 replika=a phys=130 data[0] xor 0xFF (a checksum valtozatlan)"}, {"cmd": "./cow_scrub scrub pool-corrupt.img", "st": {"gen": 2, "map5": [130, 131, 2], "freed": [12, 13], "bad": [], "fixed": [130], "out": "scrub: 64 logikai blokk, 1 hibas replika, 1 javitott, 0 javithatatlan"}, "line": -1, "msg": "$ ./cow_scrub scrub pool-corrupt.img  →  scrub: 64 logikai blokk, 1 hibas replika, 1 javitott, 0 javithatatlan"}, {"cmd": "./cow_scrub scrub pool-corrupt.img", "st": {"gen": 2, "map5": [130, 131, 2], "freed": [12, 13], "bad": [], "fixed": [], "out": "scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}, "line": -1, "msg": "$ ./cow_scrub scrub pool-corrupt.img  →  scrub: 64 logikai blokk, 0 hibas replika, 0 javitott, 0 javithatatlan"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 250");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="xh" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0 L6,6 M6,0 L0,6" stroke="${css("--muted")}" stroke-width="1"/></pattern>`;
  svg.appendChild(defs);
  const st = s.st, cells = [0, 1, 2, 3, null, 12, 13, null, 128, 129, 130, 131], cw = 60, x0 = 20, y0 = 60;
  el("text", {x: 10, y: 22, "font-size": 13, "font-family": "ui-monospace,monospace"}, "$ " + s.cmd);
  cells.forEach((p, j) => {
    const x = x0 + j * cw;
    if (p === null) { el("text", {x: x + cw / 2, y: y0 + 30, "text-anchor": "middle", "font-size": 18}, "…"); return; }
    let fill = css("--cellhl"), dash = "none", lab2 = "";
    if (p < 2) { fill = "url(#xh)"; lab2 = "SB gen " + st.gen; }
    else if (st.freed.includes(p)) { fill = css("--cell"); dash = "5 3"; lab2 = "szabad"; }
    else if (p >= 130 && !st.map5.slice(0, 2).includes(p)) { fill = css("--cell"); dash = "2 3"; lab2 = "–"; }
    else { const lg = st.map5.slice(0, 2).includes(p) ? 5 : (p - 2) >> 1; lab2 = "L" + lg + (p % 2 === 0 ? "A" : "B"); }
    const on = st.map5.slice(0, 2).includes(p);
    el("rect", {x: x, y: y0, width: cw - 2, height: 50, fill: fill, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": dash});
    [String(p), lab2].forEach((t, i) => { const e = el("text", {x: x + cw / 2 - 1, y: y0 + 20 + i * 18, "text-anchor": "middle", "font-size": 12}, t); e.setAttribute("stroke", css("--bg")); e.setAttribute("stroke-width", 3); e.setAttribute("paint-order", "stroke"); });
    if (st.bad.includes(p)) { el("line", {x1: x + 4, y1: y0 + 4, x2: x + cw - 6, y2: y0 + 46, stroke: css("--hl2"), "stroke-width": 3}); el("line", {x1: x + cw - 6, y1: y0 + 4, x2: x + 4, y2: y0 + 46, stroke: css("--hl2"), "stroke-width": 3}); }
    if (st.fixed.includes(p)) el("text", {x: x + cw / 2, y: y0 - 8, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "javítva a 131-ből");
  });
  el("text", {x: 10, y: 150, "font-size": 13}, `leképezési tábla, 5. sor: phys_a = ${st.map5[0]}, phys_b = ${st.map5[1]}, sequence = ${st.map5[2]};  generation = ${st.gen}`);
  el("text", {x: 10, y: 178, "font-size": 12.5, "font-family": "ui-monospace,monospace"}, st.out);
  el("text", {x: 10, y: 214, "font-size": 11, fill: css("--muted")}, "0–1: superblock-slot (a jelenlegi kód mindkettőt írja, T-O7-026); 2–129: az init replikapárjai (logikai i → 2+2i, 3+2i);");
  el("text", {x: 10, y: 230, "font-size": 11, fill: css("--muted")}, "130/131: a write új replikái; szaggatott = felszabadult, × = sérült replika (data[0] invertálva, checksum változatlan).");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
