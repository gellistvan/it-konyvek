<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A labor öt ütemezője</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>

<div id="status" aria-live="polite"></div>
<div class="wrap">

  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

 3, 4]}, {"t": 14, "line": 6, "acts": [6], "run": "P1", "qb": ["P5"], "ready": ["P5"], "segs": [["P1", 0, 2], ["P2", 2, 4], ["P3", 4, 6], ["P1", 6, 8], ["P4", 8, 9], ["P5", 9, 11], ["P2", 11, 13], ["P1", 13, 15]], "rem": {"P1": 2, "P2": 0, "P3": 0, "P4": 0, "P5": 2}, "msg": "t = 14: P1 fut [14, 15) (hátra: 3 → 2). Kész sor a választás előtt: P5.", "pol": "rr", "tmax": 19, "ids": ["P1", "P2", "P3", "P4", "P5"], "arr": [0, 1, 2, 3, 4]}, {"t": 15, "line": 5, "acts": [3, 5, 6], "run": "P5", "qb": ["P5", "P1"], "ready": ["P1"], "segs": [["P1", 0, 2], ["P2", 2, 4], ["P3", 4, 6], ["P1", 6, 8], ["P4", 8, 9], ["P5", 9, 11], ["P2", 11, 13], ["P1", 13, 15], ["P5", 15, 16]], "rem": {"P1": 2, "P2": 0, "P3": 0, "P4": 0, "P5": 1}, "msg": "t = 15: P1 kvantuma lejárt → a sor végére; kiválasztva: P5; P5 fut [15, 16) (hátra: 2 → 1). Kész sor a választás előtt: P5, P1.", "pol": "rr", "tmax": 19, "ids": ["P1", "P2", "P3", "P4", "P5"], "arr": [0, 1, 2, 3, 4]}, {"t": 16, "line": 6, "acts": [6], "run": "P5", "qb": ["P1"], "ready": ["P1"], "segs": [["P1", 0, 2], ["P2", 2, 4], ["P3", 4, 6], ["P1", 6, 8], ["P4", 8, 9], ["P5", 9, 11], ["P2", 11, 13], ["P1", 13, 15], ["P5", 15, 17]], "rem": {"P1": 2, "P2": 0, "P3": 0, "P4": 0, "P5": 0}, "msg": "t = 16: P5 fut [16, 17) (hátra: 1 → 0). Kész sor a választás előtt: P1.", "pol": "rr", "tmax": 19, "ids": ["P1", "P2", "P3", "P4", "P5"], "arr": [0, 1, 2, 3, 4]}, {"t": 17, "line": 5, "acts": [1, 5, 6], "run": "P1", "qb": ["P1"], "ready": [], "segs": [["P1", 0, 2], ["P2", 2, 4], ["P3", 4, 6], ["P1", 6, 8], ["P4", 8, 9], ["P5", 9, 11], ["P2", 11, 13], ["P1", 13, 15], ["P5", 15, 17], ["P1", 17, 18]], "rem": {"P1": 1, "P2": 0, "P3": 0, "P4": 0, "P5": 0}, "msg": "t = 17: P5 befejeződik; kiválasztva: P1; P1 fut [17, 18) (hátra: 2 → 1). Kész sor a választás előtt: P1.", "pol": "rr", "tmax": 19, "ids": ["P1", "P2", "P3", "P4", "P5"], "arr": [0, 1, 2, 3, 4]}, {"t": 18, "line": 6, "acts": [6], "run": "P1", "qb": [], "ready": [], "segs": [["P1", 0, 2], ["P2", 2, 4 const CODE = ["static void simulate(enum policy pol, int quantum) {   /* schedsim.c, egy iteráció = egy időegység */", "    /* 1. Az adott időpontban befejeződő folyamat lezárása. */", "    /* 2. Az érkezők beillesztése azonosító szerint növekvő sorrendben. */", "    /* 3. A lejárt kvantumú folyamat visszasorolása (RR). */", "    /* 4. Preemptív döntés: csak szigorúan jobb jelölt váltja le a futót. */", "    /* 5. A következő folyamat kiválasztása. */", "    /* 6. Egy időegység futtatása. */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function simJS(cfg, pol, quantum, requeueFirst){
  const ps = cfg.map(c => ({id: c[0], arrival: c[1], burst: c[2], prio: c[3], remaining: c[2], finish: -1, in_ready: 0}))
               .sort((a, b) => a.arrival - b.arrival || a.id - b.id);
  const n = ps.length, q = [], segs = [], steps = [];
  let t = 0, running = -1, qused = 0, done = 0;
  const key = i => pol === "sjf" ? [ps[i].burst, ps[i].id] : pol === "srtf" ? [ps[i].remaining, ps[i].id] : [-ps[i].prio, ps[i].id];
  const better = (a, b) => { const x = key(a), y = key(b); return x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]); };
  const pick = () => { let best = -1; for (let i = 0; i < n; i++) if (ps[i].in_ready && (best < 0 || better(i, best))) best = i; return best; };
  const enq = i => { q.push(i); ps[i].in_ready = 1; };
  const nm = i => "P" + ps[i].id;
  while (done < n && t < 2000) {
    const acts = [];
    if (running >= 0 && ps[running].remaining === 0) { ps[running].finish = t; acts.push([1, nm(running) + " befejeződik"]); running = -1; qused = 0; done++; }
    if (done === n) break;
    const arrivals = () => { for (let i = 0; i < n; i++) if (ps[i].arrival === t) { if (pol === "fifo" || pol === "rr") enq(i); else ps[i].in_ready = 1; acts.push([2, nm(i) + " érkezik"]); } };
    const requeue = () => { if (pol === "rr" && running >= 0 && qused === quantum) { acts.push([3, nm(running) + " kvantuma lejárt → a sor végére"]); enq(running); running = -1; qused = 0; } };
    if (requeueFirst) { requeue(); arrivals(); } else { arrivals(); requeue(); }
    const qb = (pol === "fifo" || pol === "rr") ? q.map(nm) : null;
    if (running >= 0 && (pol === "srtf" || pol === "prio")) {
      const best = pick(); let take = false;
      if (best >= 0) take = pol === "srtf" ? ps[best].remaining < ps[running].remaining : ps[best].prio > ps[running].prio;
      if (take) { acts.push([4, nm(best) + " preemptálja " + nm(running) + "-t"]); ps[running].in_ready = 1; ps[best].in_ready = 0; running = best; qused = 0; }

function readCfg(){

}
function reload(){

  err.textContent = "";

}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 620 300");
  const tmax = Math.max(s.tmax, 1), X0 = 40, W = 560 / tmax, y = 90;
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, {fifo: "FIFO", sjf: "SJF", srtf: "SRTF", rr: "RR", prio: "Prioritásos preemptív"}[s.pol]);
  s.segs.forEach(([nm, a, b]) => {
    const i = +nm.slice(1);
    el("rect", {x: X0 + a * W, y, width: (b - a) * W, height: 36, fill: i % 2 ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    if (i % 3 === 2) for (let x = a * W; x < b * W; x += 7) el("line", {x1: X0 + x, y1: y + 36, x2: X0 + Math.min(x + 7, b * W), y2: y, stroke: css("--muted"), "stroke-width": 0.8});
    if ((b - a) * W > 20) el("text", {x: X0 + (a + b) / 2 * W, y: y + 23, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, nm);
  });
  for (let t = 0; t <= tmax; t++) { el("line", {x1: X0 + t * W, y1: y + 36, x2: X0 + t * W, y2: y + 41, stroke: css("--line")}); if (tmax <= 40 || t % 5 === 0) el("text", {x: X0 + t * W, y: y + 54, "text-anchor": "middle", "font-size": 10.5}, String(t)); }
  s.ids.forEach((id, i) => { const x = X0 + s.arr[i] * W; el("line", {x1: x, y1: y - 26, x2: x, y2: y - 2, stroke: css("--line")}); el("text", {x: x + 2, y: y - 30 - (i % 2) * 11, "font-size": 10.5}, id); });
  if (!s.done) el("rect", {x: X0 + s.t * W, y: y - 4, width: W, height: 44, fill: "none", stroke: css("--hl2"), "stroke-width": 3});
  const yc = 175;
  const isQ = s.pol === "fifo" || s.pol === "rr";
  if (s.qb !== null && s.qb !== undefined) el("text", {x: 10, y: yc, "font-size": 13}, "kész sor a választás előtt: " + (s.qb.length ? s.qb.join(", ") : "∅"));
  el("text", {x: 10, y: yc + 22, "font-size": 13}, (isQ ? "kész sor (FIFO) a választás után: " : "kész halmaz: ") + (s.ready.length ? s.ready.join(", ") : "∅") + (s.run ? "  ·  fut: " + s.run : ""));
  el("text", {x: 10, y: yc + 46, "font-size": 12, fill: css("--muted")}, "hátralévő idő: " + Object.entries(s.rem).map(([k, v]) => k + " = " + v).join(", "));
}

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));

function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }

document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {

  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
