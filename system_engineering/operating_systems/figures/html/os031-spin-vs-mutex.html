<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spinlock és mutex várakozása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kritikus szakasz vége L: <input id="cl" type="range" min="1.5" max="5" step="0.25" value="3" oninput="upd()" aria-label="A kritikus szakasz hossza"> <span id="clv">3</span></label><label>C_sleep: <input id="cs" type="range" min="0.5" max="4" step="0.25" value="1.5" oninput="upd()" aria-label="Az alvás és ébresztés költsége"> <span id="csv">1,5</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két idővonal: a spinlockos T2 pörög, a mutexes T2 FUTEX_WAIT után alszik és FUTEX_WAKE után lép be; jobbra a két költségegyenes és a töréspont."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szimbolikus egységek, feltételezett költségek (nem mérés). Kezdőállapot: L = 3, C_sleep = 1,5; T2 az 1. időpontban próbál zárolni. A C_sleep fele a FUTEX_WAIT, fele az ébredés útjára jut.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "t = 0: T1 zárol (gyors út, atomi CAS sikeres), belép a kritikus szakaszba (0–3).", "line": 0, "t": 0.0, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}, {"msg": "t = 1: T2 zárolni próbál. Spinlock: TAS-ciklusban pörög. Mutex: a CAS sikertelen → futex(FUTEX_WAIT) rendszerhívás.", "line": 1, "t": 1.0, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}, {"msg": "t = 1,75: a mutexes T2 alszik, a mag más szálat futtat; a spinlockos T2 közben is pörög (CPU-t fogyaszt).", "line": 2, "t": 1.75, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}, {"msg": "t = 3: T1 kilép. Spinlock: a zárváltozó 0 → T2 TAS-a sikerül, belép. Mutex: unlock → futex(FUTEX_WAKE).", "line": 3, "t": 3.0, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}, {"msg": "t = 3,75: a mutexes T2 felébred, kontextusváltás után belép.", "line": 4, "t": 3.75, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}, {"msg": "Összegzés: várakozás W = 2; CPU-idő spinlocknál 2, mutexnél ≈ 1,5 → olcsóbb: mutex.", "line": -1, "t": 4.15, "m": {"L": 3.0, "cs": 1.5, "W": 2.0, "spin_in": 3.0, "mutex_in": 3.75, "wait_end": 1.75, "spin_cost": 2.0, "mutex_cost": 1.5, "win": "mutex"}}];
const CODE = ["lock():   if CAS(&zár, 0, 1) sikeres: return         // gyors út (mindkét zár)", "          spin: while TAS(&zár) == 1: pause          | mutex: futex(&zár, FUTEX_WAIT, ...)", "          ... (spin: pörög | mutex: alszik)", "unlock(): zár = 0                                    | mutex: ha van várakozó: futex(&zár, FUTEX_WAKE, 1)", "          (mutex) a felébredt szál újra CAS-sal szerzi meg a zárat"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fmt(x){ return (Math.round(x * 100) / 100).toString().replace(".", ","); }
function model(L, cs){ const W = L - 1; return {L, cs, W, spin_in: L, mutex_in: L + cs/2, wait_end: 1 + cs/2,
  spin_cost: W, mutex_cost: cs, win: W < cs ? "spinlock" : (cs < W ? "mutex" : "döntetlen")}; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const m = s.m, TM = Math.max(6, m.mutex_in + 1.2), X0 = 46, XW = 330, sx = t => X0 + XW * t / TM;
  function seg(y, a, b, txt, fill, pat, dash){
    if (b <= a) return;
    el("rect", {x: sx(a), y: y - 13, width: sx(b) - sx(a), height: 26, fill: fill, stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": dash ? "5 3" : "none"});
    if (pat) for (let x = sx(a) + 4; x < sx(b); x += 7) el("line", {x1: x, y1: y + 13, x2: Math.min(x + 8, sx(b)), y2: y - 13 + Math.max(0, x + 8 - sx(b)) * 26/8, stroke: css("--line"), "stroke-width": 0.8});
    if (txt && sx(b) - sx(a) > txt.length * 6) el("text", {x: (sx(a) + sx(b)) / 2, y: y + 4, "text-anchor": "middle", "font-size": 10.5, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, txt);
  }
  function dia(x, y){ el("polygon", {points: `${x},${y-7} ${x+6},${y} ${x},${y+7} ${x-6},${y}`, fill: css("--line")}); }
  el("text", {x: 6, y: 18, "font-size": 12, "font-weight": "bold"}, "(a) Spinlock");
  el("text", {x: 6, y: 52, "font-size": 12}, "T1"); el("text", {x: 6, y: 86, "font-size": 12}, "T2");
  seg(48, 0, m.L, "kritikus szakasz", css("--cellhl"));
  seg(82, 1, m.spin_in, "pörgés", css("--cell"), true);
  seg(82, m.spin_in, m.spin_in + 0.8, "belép", css("--cellhl"));
  el("text", {x: 6, y: 128, "font-size": 12, "font-weight": "bold"}, "(b) Mutex (futex)");
  el("text", {x: 6, y: 162, "font-size": 12}, "T1"); el("text", {x: 6, y: 196, "font-size": 12}, "T2");
  seg(158, 0, m.L, "kritikus szakasz", css("--cellhl"));
  seg(192, 1, m.wait_end, "", css("--muted"));
  seg(192, m.wait_end, m.L, "alszik", css("--cell"), false, true);
  seg(192, m.L, m.mutex_in, "", css("--muted"));
  seg(192, m.mutex_in, m.mutex_in + 0.8, "belép", css("--cellhl"));
  dia(sx(1), 179); el("text", {x: sx(1) - 10, y: 183, "text-anchor": "end", "font-size": 10}, "FUTEX_WAIT");
  dia(sx(m.L), 145); el("text", {x: sx(m.L) + 10, y: 149, "font-size": 10}, "FUTEX_WAKE");
  for (let t = 0; t <= TM; t++) { el("line", {x1: sx(t), y1: 250, x2: sx(t), y2: 255, stroke: css("--line")}); el("text", {x: sx(t), y: 268, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t)); }
  el("line", {x1: X0, y1: 250, x2: X0 + XW, y2: 250, stroke: css("--line")});
  el("text", {x: X0 + XW/2, y: 284, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "idő (szimbolikus egység)");
  const cx = sx(Math.min(s.t, TM));
  el("line", {x1: cx, y1: 28, x2: cx, y2: 250, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "3 3"});
  // (c) költség-egyenesek
  const P0 = 410, PW = 140, PY = 250, PH = 200, WM = Math.max(4, m.W + 1, m.cs + 1), px = w => P0 + PW * w / WM, py = c => PY - PH * c / WM;
  el("text", {x: P0 - 6, y: 18, "font-size": 12, "font-weight": "bold"}, "(c) Töréspont");
  el("line", {x1: P0, y1: PY, x2: P0 + PW, y2: PY, stroke: css("--line")}); el("line", {x1: P0, y1: PY, x2: P0, y2: PY - PH, stroke: css("--line")});
  el("line", {x1: px(0), y1: py(0), x2: px(WM), y2: py(WM), stroke: css("--line"), "stroke-width": 2});
  el("line", {x1: px(0), y1: py(m.cs), x2: px(WM), y2: py(m.cs), stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  el("circle", {cx: px(m.cs), cy: py(m.cs), r: 5, fill: css("--hl2")});
  el("text", {x: px(m.cs) + 6, y: py(m.cs) + 16, "font-size": 10}, "töréspont W = " + fmt(m.cs));
  el("rect", {x: px(m.W) - 4, y: PY - 4, width: 8, height: 8, fill: css("--hl")});
  el("text", {x: px(m.W), y: PY + 16, "text-anchor": "middle", "font-size": 10}, "W = " + fmt(m.W));
  el("text", {x: P0 + 4, y: py(WM) + 4, "font-size": 10}, "spin (folytonos)");
  el("text", {x: P0 + PW, y: py(m.cs) - 5, "text-anchor": "end", "font-size": 10}, "mutex ≈ C_sleep");
  el("text", {x: 6, y: 312, "font-size": 12}, `CPU-idő várakozással: spinlock ${fmt(m.spin_cost)}, mutex ≈ ${fmt(m.mutex_cost)} → olcsóbb: ${m.win}`);
  el("text", {x: 6, y: 326, "font-size": 10.5, fill: css("--muted")}, "sötétszürke = a mutex rendszerhívás- és kontextusváltás-költsége; feltételezett költségek, nem mérés");
}
function steps(L, cs){
  const m = model(L, cs), f = fmt;
  return [
    {t: 0, line: 0, m, msg: `t = 0: T1 zárol (gyors út, atomi CAS sikeres), belép a kritikus szakaszba (0–${f(L)}).`},
    {t: 1, line: 1, m, msg: `t = 1: T2 zárolni próbál. Spinlock: TAS-ciklusban pörög. Mutex: a CAS sikertelen → futex(FUTEX_WAIT) rendszerhívás.`},
    {t: m.wait_end, line: 2, m, msg: `t = ${f(m.wait_end)}: a mutexes T2 alszik, a mag más szálat futtat; a spinlockos T2 közben is pörög (CPU-t fogyaszt).`},
    {t: L, line: 3, m, msg: `t = ${f(L)}: T1 kilép. Spinlock: a zárváltozó 0 → T2 TAS-a sikerül, belép. Mutex: unlock → futex(FUTEX_WAKE).`},
    {t: m.mutex_in, line: 4, m, msg: `t = ${f(m.mutex_in)}: a mutexes T2 felébred, kontextusváltás után belép.`},
    {t: m.mutex_in + 0.4, line: -1, m, msg: `Összegzés: várakozás W = ${f(m.W)}; CPU-idő spinlocknál ${f(m.spin_cost)}, mutexnél ≈ ${f(m.cs)} → olcsóbb: ${m.win}.`}];
}
function upd(){
  const L = +document.getElementById("cl").value, cs = +document.getElementById("cs").value;
  document.getElementById("clv").textContent = fmt(L); document.getElementById("csv").textContent = fmt(cs);
  const cur = k; setSteps(steps(L, cs)); show(Math.min(cur, STEPS.length - 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
