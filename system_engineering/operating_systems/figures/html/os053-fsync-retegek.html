<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A pufferelt írás rétegei és a tartóssági pontok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="crash" onclick="crashNow()">áramszünet most</button><span class="small">sraffozott = dirty a memóriában; tömör, vastag keret = a médiumon (tartós)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Rétegdiagram az alkalmazástól a médiumig; lépésenként látszik, hol van az adat, az inode és a név."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, a POSIX-garancia szerint: a háttér-writeback bármikor kiírhatja a dirty lapokat, de erre nem lehet építeni. Az „áramszünet most” gomb a kiesés utáni állapotot mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "st": ["—", "—", "—"], "crash": "semmi sem garantált: a fájl hiányozhat, vagy üres/rövid lehet", "msg": "Kezdetben: a fájl nem létezik"}, {"line": 0, "st": ["—", "cache", "cache"], "crash": "semmi sem garantált: a fájl hiányozhat, vagy üres/rövid lehet", "msg": "open(O_CREAT): az új inode és a könyvtárbejegyzés a memóriában (dirty), az adat még nincs  |  adat: —, inode: cache, név: cache"}, {"line": 1, "st": ["cache", "cache", "cache"], "crash": "semmi sem garantált: a fájl hiányozhat, vagy üres/rövid lehet", "msg": "write_all visszatér: a 4096 bájt a page cache-ben, dirty lapként  |  adat: cache, inode: cache, név: cache"}, {"line": 2, "st": ["médium", "médium", "cache"], "crash": "a tartalom tartós, de a név nem garantált (a fájl újraindulás után hiányozhat)", "msg": "fsync(fd) visszatér: adat + inode a médiumon (FLUSH/FUA az eszköz felé)  |  adat: médium, inode: médium, név: cache"}, {"line": 3, "st": ["médium", "médium", "cache"], "crash": "a tartalom tartós, de a név nem garantált (a fájl újraindulás után hiányozhat)", "msg": "lseek: a méret 4096 – a tartóssági állapot nem változik  |  adat: médium, inode: médium, név: cache"}, {"line": 4, "st": ["médium", "médium", "cache"], "crash": "a tartalom tartós, de a név nem garantált (a fájl újraindulás után hiányozhat)", "msg": "close(fd): nem ír ki semmit, nem tartóssági pont  |  adat: médium, inode: médium, név: cache"}, {"line": 5, "st": ["médium", "médium", "cache"], "crash": "a tartalom tartós, de a név nem garantált (a fájl újraindulás után hiányozhat)", "msg": "open(dir, O_DIRECTORY): a könyvtár leírója  |  adat: médium, inode: médium, név: cache"}, {"line": 6, "st": ["médium", "médium", "médium"], "crash": "a tartalom és a név is megmarad", "msg": "fsync(dfd) visszatér: a könyvtárbejegyzés (név) is tartós  |  adat: médium, inode: médium, név: médium"}, {"line": 7, "st": ["médium", "médium", "médium"], "crash": "a tartalom és a név is megmarad", "msg": "close(dfd): kész; a fájl tartalma és neve is tartós  |  adat: médium, inode: médium, név: médium"}];
const CODE = ["fd = open(\"/mnt/scratch/example.bin\", O_WRONLY | O_CREAT | O_TRUNC, 0600);", "write_all(fd, buf, sizeof buf);                 /* 4096 bájt */", "fsync(fd);                                      /* adat + inode a médiumra (FLUSH/FUA) */", "lseek(fd, 0, SEEK_END) == 4096 ?                /* méretellenőrzés */", "close(fd);                                      /* a close NEM ír ki semmit */", "dfd = open(\"/mnt/scratch\", O_RDONLY | O_DIRECTORY);", "fsync(dfd);                                     /* a könyvtárbejegyzés (név) tartós */", "close(dfd);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAY = ["Alkalmazás", "VFS / page cache", "writeback (kworker)", "fájlrendszer", "blokkréteg / I/O-ütemező",
             "eszközmeghajtó", "eszköz írási gyorsítótára", "NAND / lemez (médium)"];
let CRASH = false, CRASHK = -1;
function render(s){
  if (k !== CRASHK && CRASH) { CRASH = false; document.getElementById("crash").textContent = "áramszünet most"; }
  svg.setAttribute("viewBox", "0 0 640 340");
  svg.innerHTML = "";
  const defs = el("defs", {}), pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "dd"); pat.setAttribute("width", "7"); pat.setAttribute("height", "7");
  pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", "0"); pl.setAttribute("y1", "0"); pl.setAttribute("x2", "0"); pl.setAttribute("y2", "7");
  pl.setAttribute("stroke", css("--line")); pat.appendChild(pl); defs.appendChild(pat);
  LAY.forEach((n, i) => { const y = 6 + i * 40;
    el("rect", {x: 6, y, width: 628, height: 34, fill: css("--cell"), stroke: css("--line"), "stroke-width": i === 7 ? 2.5 : 1});
    el("text", {x: 14, y: y + 22, "font-size": 12, "font-weight": "bold"}, n); });
  const NAMES = ["adat 4096 B", "inode", "név (kvt.)"];
  s.st.forEach((loc, j) => {
    if (loc === "—") return;
    const row = loc === "cache" ? (j === 0 ? 1 : 3) : 7, y = 6 + row * 40 + 5, x = 250 + j * 125;
    const lost = CRASH && loc === "cache";
    el("rect", {x, y, width: 115, height: 24, fill: loc === "cache" ? "url(#dd)" : css("--cellhl"), stroke: css("--line"), "stroke-width": loc === "cache" ? 1 : 2.5, "stroke-dasharray": lost ? "4 3" : "none"});
    const t = el("text", {x: x + 57, y: y + 17, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, NAMES[j] + (loc === "cache" ? " (dirty)" : " ✓"));
    const b = t.getBBox(); const r = document.createElementNS(NS, "rect"); r.setAttribute("x", b.x - 2); r.setAttribute("y", b.y); r.setAttribute("width", b.width + 4); r.setAttribute("height", b.height); r.setAttribute("fill", css("--bg")); svg.insertBefore(r, t);
    if (lost) el("line", {x1: x, y1: y + 12, x2: x + 115, y2: y + 12, stroke: css("--line"), "stroke-width": 2});
  });
  if (CRASH) { el("rect", {x: 150, y: 120, width: 340, height: 30, fill: css("--bg"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x: 320, y: 140, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "ÁRAMSZÜNET: a dirty (sraffozott) állapot elvész"); }
}
function crashNow(){ CRASH = !CRASH; CRASHK = k; const s = STEPS[k];
  document.getElementById("crash").textContent = CRASH ? "vissza" : "áramszünet most";
  status.textContent = CRASH ? "Áramszünet ebben a lépésben → " + s.crash : s.msg; render(s); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
