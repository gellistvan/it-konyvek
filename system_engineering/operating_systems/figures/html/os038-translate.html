<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kétszintű címfordítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Virtuális cím: <input id="va" value="0x1234_5678" size="12" aria-label="Virtuális cím hexadecimálisan"></label> <label><input type="checkbox" id="wr" onchange="go()"> írás</label> <label><input type="checkbox" id="pdep" checked onchange="go()"> PDE.P</label> <label><input type="checkbox" id="pderw" checked onchange="go()"> PDE.RW</label> <label><input type="checkbox" id="ptep" checked onchange="go()"> PTE.P</label> <label><input type="checkbox" id="pterw" checked onchange="go()"> PTE.RW</label> <button onclick="go()">Fordítás</button> <button onclick="document.getElementById('va').value='0xABCD_EF01';go()">0xABCD_EF01</button> <span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 0x1234_5678 virtuális cím bitsávja három mezőre bontva; lépésenként a PDE, a PTE és a lapkeret olvasása, végül a 0x0003_F678 fizikai cím vagy a hibastátusz."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 11.1.6 C-szimulátorának átirata (4 MiB szimulált memória, csak a PDE[72] és a PTE[837] kitöltve). Írásnál mindkét szinten kell az RW bit, ahogy a C-kód is ellenőrzi.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"vaddr": 305419896, "write": false, "pdi": 72, "pti": 837, "off": 1656, "pde_addr": null, "pde": null, "pte_addr": null, "pte": null, "paddr": null, "status": null, "line": 3, "ph": 1, "msg": "1. felbontás: PDI = 0x48 (72), PTI = 0x345 (837), offset = 0x678"}, {"vaddr": 305419896, "write": false, "pdi": 72, "pti": 837, "off": 1656, "pde_addr": 4384, "pde": 8195, "pte_addr": null, "pte": null, "paddr": null, "status": null, "line": 4, "ph": 2, "msg": "2. PDE olvasása: CR3 + 72 · 4 = 0x0000_1120 → 0x0000_2003 (P = 1, RW = 1)"}, {"vaddr": 305419896, "write": false, "pdi": 72, "pti": 837, "off": 1656, "pde_addr": 4384, "pde": 8195, "pte_addr": 11540, "pte": 258051, "paddr": null, "status": null, "line": 6, "ph": 3, "msg": "3. PTE olvasása: TableBase 0x0000_2000 + 837 · 4 = 0x0000_2D14 → 0x0003_F003 (P = 1, RW = 1)"}, {"vaddr": 305419896, "write": false, "pdi": 72, "pti": 837, "off": 1656, "pde_addr": 4384, "pde": 8195, "pte_addr": 11540, "pte": 258051, "paddr": 259704, "status": "TR_OK", "line": 10, "ph": 9, "msg": "5. fizikai cím: FrameBase 0x0003_F000 + 0x678 = 0x0003_F678 (DEADBEEF) → TR_OK"}];
const CODE = ["function translate(vaddr, access_type):", "    pdi = (vaddr >> 22) & 0x3FF   // 10 bit", "    pti = (vaddr >> 12) & 0x3FF   // 10 bit", "    offset = vaddr & 0xFFF        // 12 bit", "    pde = read_memory(CR3 + pdi * 4)", "    if not pde.Present: raise PageFault          // TR_PAGE_FAULT_PDE", "    pte = read_memory(pde.TableBase + pti * 4)", "    if not pte.Present: raise PageFault          // TR_PAGE_FAULT_PTE", "    if access_type == write and (not pde.ReadWrite or not pte.ReadWrite):", "        raise ProtectionFault                    // TR_PROTECTION (a C-szimulátor szerint)", "    paddr = pte.FrameBase + offset; return paddr // TR_OK"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CR3 = 0x1000, PHYS = 4 * 1024 * 1024, NAMES = ["TR_OK", "TR_PAGE_FAULT_PDE", "TR_PAGE_FAULT_PTE", "TR_PROTECTION", "TR_ADDRESS_ERROR"];
const hx = v => { const s = (v >>> 0).toString(16).toUpperCase().padStart(8, "0"); return "0x" + s.slice(0, 4) + "_" + s.slice(4); };
function mem(){
  const g = id => document.getElementById(id) ? document.getElementById(id).checked : true;
  const m = {}; m[CR3 + 72 * 4] = 0x2000 | (g("pdep") ? 1 : 0) | (g("pderw") ? 2 : 0); m[0x2000 + 837 * 4] = 0x3F000 | (g("ptep") ? 1 : 0) | (g("pterw") ? 2 : 0);
  return m;
}
function trace(vaddr, write){
  const M = mem(), rd = a => M[a] || 0;
  const pdi = (vaddr >>> 22) & 0x3FF, pti = (vaddr >>> 12) & 0x3FF, off = vaddr & 0xFFF;
  const base = {vaddr, write, pdi, pti, off, pde_addr: null, pde: null, pte_addr: null, pte: null, paddr: null, status: null};
  const st = [Object.assign({}, base, {line: 3, ph: 1, msg: `1. felbontás: PDI = 0x${pdi.toString(16).toUpperCase()} (${pdi}), PTI = 0x${pti.toString(16).toUpperCase()} (${pti}), offset = 0x${off.toString(16).toUpperCase()}`})];
  const s = Object.assign({}, base);
  const fin = (code, line, msg) => { s.status = NAMES[code]; st.push(Object.assign({}, s, {line, ph: 9, msg: msg + " → " + NAMES[code]})); return st; };
  s.pde_addr = CR3 + pdi * 4;
  if (s.pde_addr + 4 > PHYS) return fin(4, 4, "a PDE címe kívül esik a szimulált memórián");
  s.pde = rd(s.pde_addr);
  st.push(Object.assign({}, s, {line: 4, ph: 2, msg: `2. PDE olvasása: CR3 + ${pdi} · 4 = ${hx(s.pde_addr)} → ${hx(s.pde)} (P = ${s.pde & 1}, RW = ${(s.pde >> 1) & 1})`}));
  if (!(s.pde & 1)) return fin(1, 5, "3. a PDE Present bitje 0: laphiba");
  s.pte_addr = (s.pde & 0xFFFFF000) + pti * 4;
  if (s.pte_addr + 4 > PHYS) return fin(4, 6, "a PTE címe kívül esik a szimulált memórián");
  s.pte = rd(s.pte_addr);
  st.push(Object.assign({}, s, {line: 6, ph: 3, msg: `3. PTE olvasása: TableBase ${hx(s.pde & 0xFFFFF000)} + ${pti} · 4 = ${hx(s.pte_addr)} → ${hx(s.pte)} (P = ${s.pte & 1}, RW = ${(s.pte >> 1) & 1})`}));
  if (!(s.pte & 1)) return fin(2, 7, "4. a PTE Present bitje 0: laphiba");
  if (write && (!(s.pde & 2) || !(s.pte & 2))) return fin(3, 9, `4. írás, de ${!(s.pde & 2) ? "a PDE" : "a PTE"} RW bitje 0: védelmi hiba`);
  s.paddr = ((s.pte & 0xFFFFF000) >>> 0) + off;
  return fin(0, 10, `5. fizikai cím: FrameBase ${hx(s.pte & 0xFFFFF000)} + 0x${off.toString(16).toUpperCase()} = ${hx(s.paddr)}` + (s.paddr === 0x3F678 ? " (DEADBEEF)" : ""));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 320");
  svg.innerHTML = "";
  const bits = (s.vaddr >>> 0).toString(2).padStart(32, "0"), W = 16.5, X0 = 16;
  for (let i = 0; i < 32; i++) {
    const f = i < 10 ? 0 : (i < 20 ? 1 : 2);
    el("rect", {x: X0 + i * W, y: 34, width: W, height: 22, fill: [css("--cellhl"), css("--cell"), css("--cell")][f], stroke: css("--line"), "stroke-width": (i === 10 || i === 20) ? 2.5 : 0.6, "stroke-dasharray": f === 1 ? "2 2" : "none"});
    el("text", {x: X0 + i * W + W / 2, y: 50, "text-anchor": "middle", "font-size": 11}, bits[i]);
  }
  el("text", {x: X0, y: 22, "font-size": 13}, "virtuális cím " + hx(s.vaddr) + (s.write ? " (írás)" : " (olvasás)"));
  const lab = [[5, `PDI 0x${s.pdi.toString(16).toUpperCase()} (${s.pdi})`], [15, `PTI 0x${s.pti.toString(16).toUpperCase()} (${s.pti})`], [26, `offset 0x${s.off.toString(16).toUpperCase()}`]];
  lab.forEach(([c, t]) => el("text", {x: X0 + c * W, y: 74, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, t));
  const box = (x, title, addr, val, on, bad) => {
    el("text", {x, y: 112, "font-size": 12, "font-weight": "bold"}, title);
    el("rect", {x, y: 120, width: 160, height: 90, rx: 6, fill: css("--cell"), stroke: css("--line")});
    if (addr !== null) {
      el("rect", {x: x + 6, y: 150, width: 148, height: 30, fill: on ? css("--cellhl") : css("--cell"), stroke: bad ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1});
      el("text", {x: x + 10, y: 145, "font-size": 11, "font-family": "monospace"}, "@" + addr);
      el("text", {x: x + 80, y: 170, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, val);
    } else el("text", {x: x + 80, y: 170, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "–");
  };
  const err = s.status && s.status !== "TR_OK";
  box(16, "lapkönyvtár (CR3 = 0x1000)", s.pde_addr !== null ? hx(s.pde_addr) : null, s.pde !== null ? hx(s.pde) : "", s.ph === 2, err && s.status.endsWith("PDE"));
  box(200, "laptábla", s.pte_addr !== null ? hx(s.pte_addr) : null, s.pte !== null ? hx(s.pte) : "", s.ph === 3, err && (s.status.endsWith("PTE") || s.status === "TR_PROTECTION"));
  box(384, "lapkeret", s.paddr !== null ? hx(s.paddr) : null, s.paddr === 0x3F678 ? "DEADBEEF" : (s.paddr !== null ? "(adat)" : ""), s.status === "TR_OK", false);
  const arr = (x1, x2) => { el("line", {x1, y1: 165, x2: x2 - 6, y2: 165, stroke: css("--line"), "stroke-width": 1.6, "stroke-dasharray": "6 4"}); el("polygon", {points: `${x2},165 ${x2 - 9},160 ${x2 - 9},170`, fill: css("--line")}); };
  if (s.pte_addr !== null) arr(176, 200);
  if (s.paddr !== null) arr(360, 384);
  if (s.status) el("text", {x: 16, y: 250, "font-size": 16, "font-weight": "bold", fill: s.status === "TR_OK" ? css("--hl") : css("--hl2")}, "státusz: " + s.status + (s.paddr !== null ? " → " + hx(s.paddr) : ""));
  el("text", {x: 16, y: 300, "font-size": 11, fill: css("--muted")}, "szaggatott nyíl: báziscím · 32 bit, 4 KiB lap · csak a PDE[72] és a PTE[837] kitöltött");
}
function go(){
  const raw = document.getElementById("va").value.replace(/[_\s]/g, "").replace(/^0x/i, ""), e = document.getElementById("err");
  if (!/^[0-9a-fA-F]{1,8}$/.test(raw)) { e.textContent = "Legfeljebb 8 hexadecimális számjegy (pl. 0x1234_5678)."; return; }
  e.textContent = ""; setSteps(trace(parseInt(raw, 16) >>> 0, document.getElementById("wr").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
