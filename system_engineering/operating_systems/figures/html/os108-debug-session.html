<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QEMU–GDB debug munkamenet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram öt életvonallal: 1. terminál QEMU-val, vendég CPU, gdbstub, 2. terminál GDB-vel, qemu.log. QEMU -s -S indul, a CPU áll; a GDB target remote :1234-gyel kapcsolódik; break kmain és continue; a CPU a kmain-nél megáll; continue után a faulty_write laphibát okoz, a qemu.log-ban v=0e e=0002 CR2=00600000; a kezelő a soros konzolra PF: cr2=00600000 err=00000002 sort ír; a GDB a break panic töréspontnál áll meg."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, QEMU-futás nélkül: a terminálok tartalma a fejezet parancsaiból és kódjából összeállított minta, a címek (…) szimbolikusak. A `break panic` a fejezet munkamenetének kiegészítése.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"frm": 0, "to": 1, "label": "QEMU -s -S: CPU áll a reset vektoron", "msg": "(1) 1. terminál: qemu-system-i386 -kernel build/kernel.elf -s -S -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log – a -S miatt a vendég CPU nem indul el, a -s a :1234-es gdbstubot nyitja.", "line": -1, "ch": "-", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log"], "t2": [], "log": ["CPU Reset (CPU 0) …"]}, {"frm": 3, "to": 2, "label": "target remote :1234", "msg": "(2) 2. terminál: gdb build/kernel.elf; (gdb) target remote :1234 – a GDB a stubhoz kapcsolódik, a CPU továbbra is áll.", "line": -1, "ch": "--", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234"], "log": ["CPU Reset (CPU 0) …"]}, {"frm": 3, "to": 2, "label": "break kmain; continue → Z0 kmain", "msg": "(3) break kmain, continue: a stub a töréspontot a QEMU-ban tartja (Z0 csomag); a vendégmemória nem változik.", "line": -1, "ch": "--", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue"], "log": ["CPU Reset (CPU 0) …"]}, {"frm": 1, "to": 3, "label": "CPU fut → kmain → stop", "msg": "(4) A CPU elindul, eléri a kmain-t és megáll; GDB-prompt: info registers, és most beállítjuk a panic töréspontot is (break panic).", "line": -1, "ch": "--", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue", "Breakpoint 1, kmain () at kernel.c", "(gdb) info registers", "eip  0x001…  <kmain+…>", "(gdb) break panic", "(gdb) continue"], "log": ["CPU Reset (CPU 0) …"]}, {"frm": 1, "to": 4, "label": "faulty_write: #PF → v=0e e=0002 CR2=00600000", "msg": "(5) continue → faulty_write: movl $0xDEADBEEF, 0x00600000 → #PF (14-es vektor); a qemu.log sora: v=0e e=0002 (írás, nem jelen lévő lap, kernelmód), CR2=00600000.", "line": 1, "ch": ":", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue", "Breakpoint 1, kmain () at kernel.c", "(gdb) info registers", "eip  0x001…  <kmain+…>", "(gdb) break panic", "(gdb) continue"], "log": ["CPU Reset (CPU 0) …", "check_exception old: 0xffffffff new 0xe", "0: v=0e e=0002 i=0 cpl=0 IP=0008:<faulty_write+…> … CR2=00600000"]}, {"frm": 1, "to": 0, "label": "PF: cr2=00600000 … err=00000002", "msg": "(6) page_fault_handler: a soros konzolon „PF: cr2=00600000 eip=… err=00000002” és „vart hiba: …”, majd panic(\"page fault\") hívása.", "line": 6, "ch": "-", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log", "PF: cr2=00600000 eip=001xxxxx err=00000002", "vart hiba: a fenntartott tesztlap nincs lekepezve"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue", "Breakpoint 1, kmain () at kernel.c", "(gdb) info registers", "eip  0x001…  <kmain+…>", "(gdb) break panic", "(gdb) continue"], "log": ["CPU Reset (CPU 0) …", "check_exception old: 0xffffffff new 0xe", "0: v=0e e=0002 i=0 cpl=0 IP=0008:<faulty_write+…> … CR2=00600000"]}, {"frm": 1, "to": 3, "label": "break panic → stop; bt, frame 1, p/x tf->eip", "msg": "(7) A GDB a panic belépésénél, a `break panic` töréspontnál áll meg (NEM a panic későbbi int3-jánál); bt: panic ← page_fault_handler ← … ; frame 1; p/x tf->eip = a faulty_write hibás utasítása.", "line": 8, "ch": "--", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log", "PF: cr2=00600000 eip=001xxxxx err=00000002", "vart hiba: a fenntartott tesztlap nincs lekepezve"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue", "Breakpoint 1, kmain () at kernel.c", "(gdb) info registers", "eip  0x001…  <kmain+…>", "(gdb) break panic", "(gdb) continue", "Breakpoint 2, panic (msg=\"page fault\")", "(gdb) bt", "#0 panic  #1 page_fault_handler  #2 …", "(gdb) frame 1", "(gdb) p/x tf->eip", "$1 = 0x001…  (faulty_write)"], "log": ["CPU Reset (CPU 0) …", "check_exception old: 0xffffffff new 0xe", "0: v=0e e=0002 i=0 cpl=0 IP=0008:<faulty_write+…> … CR2=00600000"]}, {"frm": 1, "to": 0, "label": "continue → PANIC: page fault; int3 → SIGTRAP", "msg": "(8) continue: a panic kiírja a „PANIC: page fault” sort és a trapframe-et, majd a DEBUG_BREAK (int3) egy újabb, SIGTRAP-megállást ad a GDB-ben.", "line": 10, "ch": "-", "t1": ["$ qemu-system-i386 -kernel build/kernel.elf -s -S \\", "    -serial mon:stdio -d int,cpu_reset,guest_errors -D qemu.log", "PF: cr2=00600000 eip=001xxxxx err=00000002", "vart hiba: a fenntartott tesztlap nincs lekepezve", "PANIC: page fault", "eax=… ebx=… ecx=… edx=…"], "t2": ["$ gdb build/kernel.elf", "(gdb) target remote :1234", "Remote debugging using :1234", "(gdb) break kmain", "(gdb) continue", "Breakpoint 1, kmain () at kernel.c", "(gdb) info registers", "eip  0x001…  <kmain+…>", "(gdb) break panic", "(gdb) continue", "Breakpoint 2, panic (msg=\"page fault\")", "(gdb) bt", "#0 panic  #1 page_fault_handler  #2 …", "(gdb) frame 1", "(gdb) p/x tf->eip", "$1 = 0x001…  (faulty_write)", "(gdb) continue", "Program received signal SIGTRAP"], "log": ["CPU Reset (CPU 0) …", "check_exception old: 0xffffffff new 0xe", "0: v=0e e=0002 i=0 cpl=0 IP=0008:<faulty_write+…> … CR2=00600000"]}];
const CODE = ["static void faulty_write(void) {", "    __asm__ volatile(\"movl $0xDEADBEEF, (%0)\" : : \"r\"(FAULT_ADDR) : \"memory\");", "}", "void page_fault_handler(struct trapframe *tf) {", "    dbg_printf(\"PF: cr2=%08x eip=%08x err=%08x\\n\", …);", "    if (cr2 == FAULT_ADDR)", "        dbg_printf(\"vart hiba: a fenntartott tesztlap nincs lekepezve\\n\");", "    panic(\"page fault\");", "void panic(const char *msg) {", "    dbg_printf(\"PANIC: %s\\n\", msg);", "    DEBUG_BREAK();      /* int3 */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LANES = ["1. terminál\n(QEMU, soros konzol)", "vendég CPU", "gdbstub\n(:1234)", "2. terminál\n(GDB)", "qemu.log"];
function term(x, y, w, h, title, lines, col){
  el("rect", {x, y, width: w, height: h, fill: css("--code"), stroke: css("--line")});
  el("text", {x: x + 6, y: y + 14, "font-size": 11.5, "font-weight": "bold"}, title);
  lines.slice(-Math.floor((h - 22) / 14)).forEach((l, i) => el("text", {x: x + 6, y: y + 30 + i * 14, "font-size": 10.5, style: "font-family:ui-monospace,monospace", fill: col}, l));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 470"); svg.innerHTML = "";
  const line = css("--line"), hl = css("--hl"), mut = css("--muted");
  const XS = [60, 190, 310, 430, 560];
  LANES.forEach((l, i) => { l.split("\n").forEach((t, j) => el("text", {x: XS[i], y: 14 + j * 12, "text-anchor": "middle", "font-size": 10.5, "font-weight": "bold"}, t));
    el("line", {x1: XS[i], x2: XS[i], y1: 30, y2: 200, stroke: mut, "stroke-dasharray": "2 3"}); });
  STEPS.forEach((t, i) => { if (i > k) return;
    const y = 42 + i * 20, a = XS[t.frm], b = XS[t.to], cur = i === k, col = cur ? hl : line;
    el("line", {x1: a, x2: b, y1: y, y2: y, stroke: col, "stroke-width": cur ? 2.6 : 1.2, "stroke-dasharray": t.ch === "--" ? "6 3" : (t.ch === ":" ? "2 3" : "none")});
    el("path", {d: `M${b} ${y} l${a < b ? -8 : 8} -4 v8 z`, fill: col});
    el("text", {x: Math.max(a, b) + 6, y: y + 4, "font-size": 10, fill: cur ? hl : mut}, "(" + (i + 1) + ")"); });
  term(8, 210, 370, 150, "1. terminál: QEMU (-serial mon:stdio)", s.t1, css("--fg"));
  term(384, 210, 370, 150, "2. terminál: GDB", s.t2, css("--fg"));
  term(8, 368, 746, 96, "qemu.log (-d int,cpu_reset,guest_errors)", s.log, css("--fg"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
