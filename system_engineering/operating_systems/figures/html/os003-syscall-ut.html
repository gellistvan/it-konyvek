<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy open() hívás útja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="err" type="checkbox" onchange="toggleErr()"> hibaág (ENOENT): a fájl nem létezik</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram: az alkalmazás libc-hívása syscall utasítással kernel módba lép, a VFS és a fájlrendszer megkeresi az inode-ot, a fájlleíró sysret-tel tér vissza."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">x86-64 Linux, glibc: az open() burkoló az openat (257) rendszerhívást adja ki; a függvénynevek a Linux 6.x VFS-ét követik, szemléltetés. Folytonos = hívás, szaggatott = visszatérés, pontozott = opcionális (csak gyorsítótár-hiánynál), sraffozott sáv = kernel mód.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": 1, "err": false, "line": 0, "msg": "1/8 – szereplő: Alkalmazás → libc | CPU-mód: user"}, {"cur": 2, "err": false, "line": 1, "msg": "2/8 – szereplő: libc | CPU-mód: user | rax=257 (openat), rdi=AT_FDCWD, rsi=\"/etc/hostname\", rdx=O_RDONLY"}, {"cur": 3, "err": false, "line": 2, "msg": "3/8 – szereplő: CPU | CPU-mód: kernel"}, {"cur": 4, "err": false, "line": 3, "msg": "4/8 – szereplő: kernel-belépő | CPU-mód: kernel"}, {"cur": 5, "err": false, "line": 4, "msg": "5/8 – szereplő: VFS | CPU-mód: kernel"}, {"cur": 6, "err": false, "line": 5, "msg": "6/8 – szereplő: ext4 / lapgyorsítótár | CPU-mód: kernel"}, {"cur": 7, "err": false, "line": 6, "msg": "7/8 – szereplő: VFS → kernel-belépő → CPU | CPU-mód: kernel | fd = 3"}, {"cur": 8, "err": false, "line": 7, "msg": "8/8 – szereplő: libc → alkalmazás | CPU-mód: user | eredmény: fd = 3"}];
const CODE = ["1. Az alkalmazás meghívja a libc open() függvényét.", "2. A libc a hívás számát és a paramétereket regiszterekbe tölti, majd syscall.", "3. A processzor kernel módba vált, és a belépési pontra ugrik.", "4. A kernel menti a regisztereket, ellenőrzi a számot és a paramétereket.", "5. A kernel meghívja a VFS open implementációját.", "6. A fájlrendszer a gyorsítótárból dolgozik, vagy a blokkmeghajtón át olvas.", "7. A kernel fájlleírót foglal, és visszatér felhasználói módba.", "8. A libc visszaadja a fájlleírót vagy a hibakódot."];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

// ---- közös szekvenciadiagram-rajzoló (os003/os006/os008/os019) ----
function seqDefs(){
  const defs = el("defs", {});
  [["ah", css("--fg")], ["ahh", css("--hl")], ["ahw", css("--hl2")]].forEach(([id, c]) => {
    const mk = document.createElementNS(NS, "marker");
    mk.setAttribute("id", id); mk.setAttribute("viewBox", "0 0 10 10"); mk.setAttribute("refX", 9); mk.setAttribute("refY", 5);
    mk.setAttribute("markerWidth", 7); mk.setAttribute("markerHeight", 7); mk.setAttribute("orient", "auto-start-reverse");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", c);
    mk.appendChild(p); defs.appendChild(mk);
  });
  const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hatch"); pat.setAttribute("width", 6); pat.setAttribute("height", 6);
  pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line");
  pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 6);
  pl.setAttribute("stroke", css("--muted")); pl.setAttribute("stroke-width", 1.2); pat.appendChild(pl); defs.appendChild(pat);
}
function mtext(x, y, txt, attrs){
  const t = el("text", Object.assign({x, y, "text-anchor": "middle"}, attrs || {}));
  String(txt).split("\n").forEach((ln, i) => {
    const sp = document.createElementNS(NS, "tspan");
    sp.setAttribute("x", x); if (i) sp.setAttribute("dy", "1.15em"); sp.textContent = ln; t.appendChild(sp);
  });
  return t;
}
// A: szereplők, M: üzenetek {s: lépés (1-től), f, t: szereplőindex, label, st: "call"|"ret"|"opt"}, cur: aktuális lépés
// opt: {W, rh, top, bands: [{a: szereplő, m0, m1: üzenetindex, label}], groups: [{a0, a1, label}]}
function seqDraw(A, M, cur, opt){
  opt = opt || {};
  const W = opt.W || 760, top = opt.top || 62, rh = opt.rh || 24, H = top + (M.length + 1) * rh + 8;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = ""; seqDefs();
  const fg = css("--fg"), hl = css("--hl"), line = css("--line"), cell = css("--cell"), cellhl = css("--cellhl");
  const xs = A.map((a, i) => 64 + i * (W - 128) / (A.length - 1));
  const bw = Math.min(118, (W - 128) / (A.length - 1) - 8);
  (opt.groups || []).forEach(g => {
    el("rect", {x: xs[g.a0] - bw / 2 - 2, y: 2, width: xs[g.a1] - xs[g.a0] + bw + 4, height: H - 4, fill: "none",
                stroke: css("--muted"), "stroke-dasharray": "3 3"});
    el("text", {x: (xs[g.a0] + xs[g.a1]) / 2, y: 13, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, g.label);
  });
  A.forEach((a, i) => {
    el("line", {x1: xs[i], y1: top - 8, x2: xs[i], y2: H - 6, stroke: line, "stroke-dasharray": "3 4", "stroke-width": 0.8});
    el("rect", {x: xs[i] - bw / 2, y: 18, width: bw, height: 32, fill: cell, stroke: line, rx: 4});
    mtext(xs[i], a.includes("\n") ? 31 : 38, a, {"font-size": 10.5, "font-weight": "bold"});
  });
  const yOf = j => top + (j + 0.7) * rh;
  (opt.bgrows || []).forEach(r => {
    if (M[r.m0].s > cur) return;
    el("rect", {x: 2, y: yOf(r.m0) - rh / 2, width: W - 4, height: (r.m1 - r.m0 + 1) * rh, fill: "url(#hatch)", opacity: 0.35});
    if (r.label) el("text", {x: W - 6, y: yOf(r.m0) - rh / 2 + 11, "text-anchor": "end", "font-size": 9.5, fill: css("--muted")}, r.label);
  });
  (opt.bands || []).forEach(b => {
    if (M[b.m0].s > cur) return;
    const y0 = yOf(b.m0) - 4, last = (b.m1 !== undefined && M[b.m1].s <= cur) ? yOf(b.m1) + 4 : yOf(M.length - 1) + 8;
    const lastVis = Math.max(...M.map((m, j) => m.s <= cur ? j : -1));
    const y1 = (b.m1 !== undefined && M[b.m1].s <= cur) ? last : yOf(lastVis) + 8;
    el("rect", {x: xs[b.a] - 9, y: y0, width: 18, height: Math.max(8, y1 - y0), fill: "url(#hatch)", stroke: line, "stroke-width": 1});
    if (b.label) el("text", {x: xs[b.a] + 12, y: y0 + Math.max(8, y1 - y0) - 2, "font-size": 9.5, fill: css("--muted"), "text-anchor": "start"}, b.label);
  });
  M.forEach((m, j) => {
    if (m.s > cur) return;
    const on = m.s === cur, c = on ? (m.warn ? css("--hl2") : hl) : fg, y = yOf(j);
    const dash = m.st === "ret" ? "7 4" : m.st === "opt" ? "2 3" : "none";
    const mk = on ? (m.warn ? "url(#ahw)" : "url(#ahh)") : "url(#ah)";
    const fs = on ? {"font-size": 10.5, "font-weight": "bold"} : {"font-size": 10};
    if (m.f === m.t) {
      const x = xs[m.f];
      el("path", {d: `M${x},${y - 6} h22 v12 h-20`, fill: "none", stroke: c, "stroke-width": on ? 2.2 : 1.3, "stroke-dasharray": dash, "marker-end": mk});
      const t = mtext(x + 28, y + 3, m.label, Object.assign({"paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, fs)); t.setAttribute("text-anchor", "start");
      if (on) t.setAttribute("fill", c);
    } else {
      const x0 = xs[m.f], x1 = xs[m.t], d = x1 > x0 ? 1 : -1;
      el("line", {x1: x0 + d * 3, y1: y, x2: x1 - d * 3, y2: y, stroke: c, "stroke-width": on ? 2.4 : 1.3, "stroke-dasharray": dash, "marker-end": mk});
      const t = mtext((x0 + x1) / 2, y - 4, m.label, Object.assign({"paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, fs));
      if (on) t.setAttribute("fill", c);
    }
  });
  return {W, H, xs, yOf};
}

const ACT = ["Alkalmazás", "libc", "CPU (mód)", "Kernel-\nbelépő", "VFS", "ext4 /\ngyorsítótár", "blokk-\nmeghajtó"];
const MSG_OK = [{"s": 1, "f": 0, "t": 1, "label": "open(\"/etc/hostname\", O_RDONLY)"}, {"s": 2, "f": 1, "t": 1, "label": "rax=257 (openat), rdi=AT_FDCWD, rsi=útvonal, rdx=O_RDONLY"}, {"s": 2, "f": 1, "t": 2, "label": "syscall"}, {"s": 3, "f": 2, "t": 3, "label": "user → kernel mód, ugrás (LSTAR)"}, {"s": 4, "f": 3, "t": 3, "label": "regiszterek mentése, számellenőrzés"}, {"s": 5, "f": 3, "t": 4, "label": "do_sys_openat2: útvonal-feloldás, jogosultság"}, {"s": 6, "f": 4, "t": 5, "label": "inode keresése (gyorsítótár vagy blokk-I/O)"}, {"s": 6, "f": 5, "t": 6, "label": "csak gyorsítótár-hiánynál", "st": "opt"}, {"s": 6, "f": 5, "t": 4, "label": "inode", "st": "ret"}, {"s": 7, "f": 4, "t": 3, "label": "fd = 3 (fájlleíró-tábla)", "st": "ret"}, {"s": 7, "f": 3, "t": 2, "label": "sysret", "st": "ret"}, {"s": 7, "f": 2, "t": 1, "label": "rax = 3; kernel → user mód", "st": "ret"}, {"s": 8, "f": 1, "t": 0, "label": "3", "st": "ret"}];
const MSG_ERR = [{"s": 1, "f": 0, "t": 1, "label": "open(\"/etc/hostname\", O_RDONLY)"}, {"s": 2, "f": 1, "t": 1, "label": "rax=257 (openat), rdi=AT_FDCWD, rsi=útvonal, rdx=O_RDONLY"}, {"s": 2, "f": 1, "t": 2, "label": "syscall"}, {"s": 3, "f": 2, "t": 3, "label": "user → kernel mód, ugrás (LSTAR)"}, {"s": 4, "f": 3, "t": 3, "label": "regiszterek mentése, számellenőrzés"}, {"s": 5, "f": 3, "t": 4, "label": "do_sys_openat2: útvonal-feloldás, jogosultság"}, {"s": 6, "f": 4, "t": 5, "label": "inode keresése (gyorsítótár vagy blokk-I/O)"}, {"s": 6, "f": 5, "t": 6, "label": "csak gyorsítótár-hiánynál", "st": "opt"}, {"s": 6, "f": 5, "t": 4, "label": "nincs ilyen bejegyzés", "st": "ret"}, {"s": 7, "f": 4, "t": 3, "label": "−ENOENT (−2), nincs fd", "st": "ret", "warn": true}, {"s": 7, "f": 3, "t": 2, "label": "sysret", "st": "ret", "warn": true}, {"s": 7, "f": 2, "t": 1, "label": "rax = −2; kernel → user mód", "st": "ret", "warn": true}, {"s": 8, "f": 1, "t": 0, "label": "errno = ENOENT, return −1", "st": "ret", "warn": true}];
const S_OK = [{"cur": 1, "err": false, "line": 0, "msg": "1/8 – szereplő: Alkalmazás → libc | CPU-mód: user"}, {"cur": 2, "err": false, "line": 1, "msg": "2/8 – szereplő: libc | CPU-mód: user | rax=257 (openat), rdi=AT_FDCWD, rsi=\"/etc/hostname\", rdx=O_RDONLY"}, {"cur": 3, "err": false, "line": 2, "msg": "3/8 – szereplő: CPU | CPU-mód: kernel"}, {"cur": 4, "err": false, "line": 3, "msg": "4/8 – szereplő: kernel-belépő | CPU-mód: kernel"}, {"cur": 5, "err": false, "line": 4, "msg": "5/8 – szereplő: VFS | CPU-mód: kernel"}, {"cur": 6, "err": false, "line": 5, "msg": "6/8 – szereplő: ext4 / lapgyorsítótár | CPU-mód: kernel"}, {"cur": 7, "err": false, "line": 6, "msg": "7/8 – szereplő: VFS → kernel-belépő → CPU | CPU-mód: kernel | fd = 3"}, {"cur": 8, "err": false, "line": 7, "msg": "8/8 – szereplő: libc → alkalmazás | CPU-mód: user | eredmény: fd = 3"}];
const S_ERR = [{"cur": 1, "err": true, "line": 0, "msg": "1/8 – szereplő: Alkalmazás → libc | CPU-mód: user"}, {"cur": 2, "err": true, "line": 1, "msg": "2/8 – szereplő: libc | CPU-mód: user | rax=257 (openat), rdi=AT_FDCWD, rsi=\"/etc/hostname\", rdx=O_RDONLY"}, {"cur": 3, "err": true, "line": 2, "msg": "3/8 – szereplő: CPU | CPU-mód: kernel"}, {"cur": 4, "err": true, "line": 3, "msg": "4/8 – szereplő: kernel-belépő | CPU-mód: kernel"}, {"cur": 5, "err": true, "line": 4, "msg": "5/8 – szereplő: VFS | CPU-mód: kernel"}, {"cur": 6, "err": true, "line": 5, "msg": "6/8 – szereplő: ext4 / lapgyorsítótár | CPU-mód: kernel"}, {"cur": 7, "err": true, "line": 6, "msg": "7/8 – szereplő: VFS → kernel-belépő → CPU | CPU-mód: kernel | rax = −2 (−ENOENT)"}, {"cur": 8, "err": true, "line": 7, "msg": "8/8 – szereplő: libc → alkalmazás | CPU-mód: user | eredmény: −1, errno = ENOENT"}];
function render(s){
  const M = s.err ? MSG_ERR : MSG_OK;
  const g = seqDraw(ACT, M, s.cur, {W: 780, rh: 25, bands: [{a: 2, m0: 3, m1: 10, label: "kernel mód"}]});
  const kern = s.cur >= 3 && s.cur <= 7;
  el("text", {x: g.W - 8, y: g.H - 6, "text-anchor": "end", "font-size": 12, "font-weight": "bold",
              fill: kern ? css("--hl2") : css("--hl")}, "CPU-mód: " + (kern ? "kernel" : "user"));
}
function toggleErr(){ const k0 = k; setSteps(document.getElementById("err").checked ? S_ERR : S_OK); show(k0); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
