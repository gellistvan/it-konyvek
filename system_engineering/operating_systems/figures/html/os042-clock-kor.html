<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clock (második esély) körlapon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select onchange="scen(this.value)" aria-label="Forgatókönyv"><option value="0, 1, 2, 3, 0, 1, 4">4.2: (0,1,2,3,0,1,4)</option><option value="0, 1, 2, 3, 1, 4, 1">találattal: (0,1,2,3,1,4,1)</option></select></label><label>Sorozat: <input id="seq" size="20" value="0, 1, 2, 3, 0, 1, 4" aria-label="Saját laphivatkozási sorozat"></label><label>m = <select id="mm" aria-label="Keretszám"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><label><input id="micro" type="checkbox" onchange="load()"> mikrolépések (minden mutatóléptetés külön)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három keret körben, mindegyikben a lap száma és az R bit; az óramutató nyila a következő vizsgálandó keretre mutat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 4.2 és a 7.2 Clock-változata: betöltéskor R = 1, feltöltés növekvő keretindex szerint, csere után a mutató a lecserélt keret utáni keretre lép. Kezdőállapot: a 4.2 példája, m = 3.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "page": null, "frames": [null, null, null], "ref": [0, 0, 0], "hand": 0, "cleared": [], "repl": null, "hit": null, "load": null, "faults": 0, "line": -1, "msg": "Kezdet: 3 üres keret, mutató a 0. kereten."}, {"frames": [0, null, null], "ref": [1, 0, 0], "hand": 0, "faults": 1, "cleared": [], "repl": null, "hit": null, "load": 0, "n": 1, "page": 0, "line": 3, "msg": "1. lépés, hiv. 0: laphiba; betöltés a(z) 0. keretbe (R = 1); mutató: 0."}, {"frames": [0, 1, null], "ref": [1, 1, 0], "hand": 0, "faults": 2, "cleared": [], "repl": null, "hit": null, "load": 1, "n": 2, "page": 1, "line": 3, "msg": "2. lépés, hiv. 1: laphiba; betöltés a(z) 1. keretbe (R = 1); mutató: 0."}, {"frames": [0, 1, 2], "ref": [1, 1, 1], "hand": 0, "faults": 3, "cleared": [], "repl": null, "hit": null, "load": 2, "n": 3, "page": 2, "line": 3, "msg": "3. lépés, hiv. 2: laphiba; betöltés a(z) 2. keretbe (R = 1); mutató: 0."}, {"frames": [3, 1, 2], "ref": [1, 0, 0], "hand": 1, "faults": 4, "cleared": [0, 1, 2], "repl": [0, 0], "hit": null, "load": null, "n": 4, "page": 3, "line": 9, "msg": "4. lépés, hiv. 3: laphiba; 0. keret R=1 → 0; 1. keret R=1 → 0; 2. keret R=1 → 0; 0. keret R=0 → csere; kikerül a(z) 0. lap, helyére 3 (R = 1); mutató → 1."}, {"frames": [3, 0, 2], "ref": [1, 1, 0], "hand": 2, "faults": 5, "cleared": [], "repl": [1, 1], "hit": null, "load": null, "n": 5, "page": 0, "line": 9, "msg": "5. lépés, hiv. 0: laphiba; 1. keret R=0 → csere; kikerül a(z) 1. lap, helyére 0 (R = 1); mutató → 2."}, {"frames": [3, 0, 1], "ref": [1, 1, 1], "hand": 0, "faults": 6, "cleared": [], "repl": [2, 2], "hit": null, "load": null, "n": 6, "page": 1, "line": 9, "msg": "6. lépés, hiv. 1: laphiba; 2. keret R=0 → csere; kikerül a(z) 2. lap, helyére 1 (R = 1); mutató → 0."}, {"frames": [4, 0, 1], "ref": [1, 0, 0], "hand": 1, "faults": 7, "cleared": [0, 1, 2], "repl": [0, 3], "hit": null, "load": null, "n": 7, "page": 4, "line": 9, "msg": "7. lépés, hiv. 4: laphiba; 0. keret R=1 → 0; 1. keret R=1 → 0; 2. keret R=1 → 0; 0. keret R=0 → csere; kikerül a(z) 3. lap, helyére 4 (R = 1); mutató → 1."}];
const CODE = ["if found == -1:                         // laphiba", "    faults++", "    if used < m:", "        victim = used; used++", "    else (CLOCK):", "        while referenced[clock_hand]:", "            referenced[clock_hand] = false", "            clock_hand = (clock_hand + 1) mod m", "        victim = clock_hand", "        clock_hand = (victim + 1) mod m", "    frames[victim] = page; referenced[victim] = true", "else:                                   // találat", "    referenced[found] = true"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function clockSteps(R, m, micro){
  const frames = Array(m).fill(null), ref = Array(m).fill(0); let hand = 0, used = 0, faults = 0;
  const st = [{n: 0, page: null, frames: frames.slice(), ref: ref.slice(), hand: 0, cleared: [], repl: null, hit: null, load: null, faults: 0, line: -1,
               msg: `Kezdet: ${m} üres keret, mutató a 0. kereten.`}];
  const snap = o => st.push(Object.assign({frames: frames.slice(), ref: ref.slice(), hand, faults, cleared: [], repl: null, hit: null, load: null}, o));
  R.forEach((page, j) => { const n = j + 1;
    const i = frames.indexOf(page);
    if (i >= 0) { ref[i] = 1; snap({n, page, hit: i, line: 12, msg: `${n}. lépés, hiv. ${page}: találat a(z) ${i}. keretben → R = 1 (nincs laphiba; mutató marad: ${hand}).`}); return; }
    faults++;
    if (used < m) { const v = used; used++; frames[v] = page; ref[v] = 1;
      snap({n, page, load: v, line: 3, msg: `${n}. lépés, hiv. ${page}: laphiba; betöltés a(z) ${v}. keretbe (R = 1); mutató: ${hand}.`}); return; }
    const ops = [], cleared = [];
    while (ref[hand]) { ref[hand] = 0; ops.push(`${hand}. keret R=1 → 0`); cleared.push(hand); hand = (hand + 1) % m;
      if (micro) snap({n, page, cleared: [cleared[cleared.length - 1]], line: 7, msg: `${n}. lépés (mikro), hiv. ${page}: ${ops[ops.length - 1]} (második esély); mutató → ${hand}.`}); }
    const v = hand, old = frames[v]; ops.push(`${v}. keret R=0 → csere`); hand = (v + 1) % m; frames[v] = page; ref[v] = 1;
    snap({n, page, cleared: micro ? [] : cleared, repl: [v, old], line: 9,
          msg: `${n}. lépés, hiv. ${page}: laphiba; ` + ops.join("; ") + `; kikerül a(z) ${old}. lap, helyére ${page} (R = 1); mutató → ${hand}.`});
  });
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--line")}"/></marker>`;
  const m = s.frames.length, cx = 230, cy = 170, Rr = m > 5 ? 120 : 105, r = m > 5 ? 26 : 34;
  el("circle", {cx, cy, r: Rr, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 4"});
  for (let i = 0; i < m; i++) {
    const a = 2 * Math.PI * i / m, x = cx + Rr * Math.sin(a), y = cy - Rr * Math.cos(a);
    const cur = (s.repl && s.repl[0] === i) || s.hit === i || s.load === i;
    el("circle", {cx: x, cy: y, r, fill: css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : 1.4});
    const p = s.frames[i];
    el("text", {x, y: y + 2, "text-anchor": "middle", "font-size": 20, "font-weight": "bold"}, p === null ? "–" : String(p));
    if (p !== null) {
      el("circle", {cx: x + 12, cy: y + 15, r: 5, fill: s.ref[i] ? css("--line") : css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
      el("text", {x: x - 6, y: y + 19, "text-anchor": "middle", "font-size": 11}, "R=" + s.ref[i]);
    }
    const lx = cx + (Rr + r + 22) * Math.sin(a), ly = cy - (Rr + r + 14) * Math.cos(a);
    el("text", {x: lx, y: ly + 4, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, i + ". keret");
    if (s.cleared.includes(i)) el("text", {x: Math.cos(a) > 0.5 ? x + r + 34 : x, y: Math.cos(a) > 0.5 ? y + 5 : y - r - 8, "text-anchor": "middle", "font-size": 12, "font-style": "italic", fill: css("--hl2")}, "R 1→0");
    if (s.repl && s.repl[0] === i) el("text", {x: x + (x >= cx ? -1 : 1) * (r + 20), y: y - r + 4, "text-anchor": "middle", "font-size": 16, "text-decoration": "line-through", fill: css("--muted")}, String(s.repl[1]));
  }
  const a = 2 * Math.PI * s.hand / m;
  el("line", {x1: cx, y1: cy, x2: cx + (Rr - r - 8) * Math.sin(a), y2: cy - (Rr - r - 8) * Math.cos(a), stroke: css("--line"), "stroke-width": 3, "marker-end": "url(#ah)"});
  el("circle", {cx, cy, r: 4, fill: css("--line")});
  el("text", {x: 430, y: 60, "font-size": 14}, s.page === null ? "Még nincs hivatkozás" : `hivatkozás: ${s.page}`);
  el("text", {x: 430, y: 84, "font-size": 14}, `laphibák: ${s.faults}`);
  el("text", {x: 430, y: 108, "font-size": 14}, `mutató: ${s.hand}. keret`);
  el("text", {x: 430, y: 150, "font-size": 12, fill: css("--muted")}, "teli pont = R=1, üres = R=0");
  el("text", {x: 430, y: 168, "font-size": 12, fill: css("--muted")}, "nyíl = mutató a lépés után");
  el("text", {x: 430, y: 186, "font-size": 12, fill: css("--muted")}, "áthúzott = kikerülő lap");
}
function load(){
  const raw = document.getElementById("seq").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const m = +document.getElementById("mm").value, err = document.getElementById("err");
  if (raw.length < 1 || raw.length > 20 || raw.some(x => !Number.isInteger(x) || x < 0 || x > 99)) { err.textContent = "1–20 darab 0–99 közötti egész lapszámot adjon meg."; return; }
  err.textContent = ""; setSteps(clockSteps(raw, m, document.getElementById("micro").checked));
}
function scen(v){ document.getElementById("seq").value = v; document.getElementById("mm").value = "3"; load(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
