<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bájtos ring buffer felülírással</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Pufferméret (B): <input id="rsz" type="number" min="16" max="4096" value="256" style="width:5.5em"></label> <label>Formátum: <select id="rfmt"><option value="fix">fix hossz ("msg %03u…\n")</option><option value="var">változó ("msg %u\n")</option></select></label> <label>Hossz (B): <input id="rlen" type="number" min="8" max="128" value="8" style="width:4em"></label> <label>Üzenetek: <input id="rn" type="number" min="1" max="2000" value="200" style="width:5em"></label> <label>Szint: <select id="rlvl"><option>LOG_INFO</option><option>LOG_DEBUG</option><option>LOG_ERR</option></select></label> <label>console_level: <select id="rcon"><option>LOG_INFO</option><option>LOG_WARNING</option><option>LOG_DEBUG</option></select></label> <button onclick="regen()">Alkalmaz</button> <button onclick="preset()">3. önellenőrző kérdés</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="16 × 16 bájtos rács: 200 darab 8 bájtos üzenet után az író mutató a 64. bájton áll, a pufferben a msg 168 … msg 199 üzenetek maradtak (32 teljes sor), a konzolra mind a 200 kijutott."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: bájtonkénti írás, olvasó nélkül; a feltételezett formátum "msg %03u\n" (8 bájt), a fejezet nem rögzíti. A csúszkával az üzenetszám léptethető (a kezdőállapot a 200. üzenet utáni, a statikus ábra (b) panelje); a ▶ az elejéről lejátssza a feltöltést.</p>

n": 117, "msg": "", "line": -1}, {"n": 118, "msg": "", "line": -1}, {"n": 119, "msg": "", "line": -1}, {"n": 120, "msg": "", "line": -1}, {"n": 121, "msg": "", "line": -1}, {"n": 122, "msg": "", "line": -1}, {"n": 123, "msg": "", "line": -1}, {"n": 124, "msg": "", "line": -1}, {"n": 125, "msg": "", "line": -1}, {"n": 126, "msg": "", "line": -1}, {"n": 127, "msg": "", "line": -1}, {"n": 128, "msg": "", "line": -1}, {"n": 129, "msg": "", "line": -1}, {"n": 130, "msg": "", "line": -1}, {"n": 131, "msg": "", "line": -1}, {"n": 132, "msg": "", "line": -1}, {"n": 133, "msg": "", "line": -1}, {"n": 134, "msg": "", "line": -1}, {"n": 135, "msg": "", "line": -1}, {"n": 136, "msg": "", "line": -1}, {"n": 137, "msg": "", "line": -1}, {"n": 138, "msg": "", "line": -1}, {"n": 139, "msg": "", "line": -1}, {"n": 140, "msg": "", "line": -1}, {"n": 141, "msg": "", "line": -1}, {"n": 142, "msg": "", "line": -1}, {"n": 143, "msg": "", "line": -1}, {"n": 144, "msg": "", "line": -1}, {"n": 145, "msg": "", "line": -1}, {"n": 146, "msg": "", "line": -1}, {"n": 147, "msg": "", "line": -1}, {"n": 148, "msg": "", "line": -1}, {"n": 149, "msg": "", "line": -1}, {"n": 150, "msg": "", "line": -1}, {"n": 151, "msg": "", "line": -1}, {"n": 152, "msg": "", "line": -1}, {"n": 153, "msg": "", "line": -1}, {"n": 154, "msg": "", "line": -1}, {"n": 155, "msg": "", "line": -1}, {"n": 156, "msg": "", "line": -1}, {"n": 157, "msg": "", "line": -1}, {"n": 158, "msg": "", "line": -1}, {"n": 159, "msg": "", "line": -1}, {"n": 160, "msg": "", "line": -1}, {"n": 161, "msg": "", "line": -1}, {"n": 162, "msg": "", "line": -1}, {"n": 163, "msg": "", "line": -1}, {"n": 164, "msg": "", "line": -1}, {"n": 165, "msg": "", "line": -1}, {"n": 166, "msg": "", "line": -1}, {"n": 167, "msg": "", "line": -1}, {"n": 168, "msg": "", "line": -1}, {"n": 169, "msg": "", "line": -1}, {"n": 170, "msg": "", "line": -1}, {"n": 171, "msg": "", "line": -1}, {"n": 172, "msg": "", "line": -1}, {"n": 173, "msg": "", "line": -1}, {"n": 174, "msg": "", "line": -1}, {"n": 175, "msg": "", "line": -1}, {"n": 176, "msg": "", "line": -1}, {"n": 177, "msg": "", "line": -1}, {"n": 178, "msg": "", "line": -1}, {"n": 179, "msg": "", "line": -1}, {"n": 180, "msg": "", "line": -1}, {"n": 181, "msg": "", "line": -1}, {"n": 182, "msg": "", "line": -1}, {"n": 183, "msg": "", "line": -1}, {"n": 184, "msg": "", "line": -1}, {"n": 185, "msg": "", "line": -1}, {"n": 186, "msg": "", "line": -1}, {"n": 187, "msg": "", "line": -1}, {"n": 188, "msg": "", "line": -1}, {"n": 189, "msg": "", "line": -1}, {"n": 190, "msg": "", "line": -1}, {"n": 191, "msg": "", "line": -1}, {"n": 192, "msg": "", "line": -1}, {"n": 193, "msg": "", "line": -1}, {"n": 194, "msg": "", "line": -1}, {"n": 195, "msg": "", "line": -1}, {"n": 196, "msg": "", "line": -1}, {"n": 197, "msg": "", "line": -1}, {"n": 198, "msg": "", "line": -1}, {"n": 199, "msg": "", "line": -1}, {"n": 200, "msg": "", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LEVEL = {LOG_ERR: 3, LOG_WARNING: 4, LOG_INFO: 6, LOG_DEBUG: 7};
const REF = {"W": 64, "kept": [168, 169, 170, 171, 172, 173, 174, 175, 176, 177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 187, 188, 189, 190, 191, 192, 193, 194, 195, 196, 197, 198, 199], "q3": 16, "var_trunc": null};
function pad3(i){ return String(i).padStart(3, "0"); }
function message(i, L){ if (L === 0) return "msg " + i + "\n"; const b = "msg " + pad3(i); return b + ".".repeat(Math.max(0, L - 1 - b.length)) + "\n"; }
function params(){ const g = id => document.getElementById(id);
  return {size: Math.max(16, parseInt(g("rsz").value, 10) || 256), L: g("rfmt").value === "var" ? 0 : Math.max(8, parseInt(g("rlen").value, 10) || 8),
          lvl: g("rlvl").value, con: g("rcon").value}; }
function sim(p, n){
  const buf = new Array(p.size).fill(null), wr = new Array(p.size).fill(0), starts = []; let total = 0;
  for (let i = 0; i < n; i++){ const m = message(i, p.L); starts.push([total, total + m.length, i]); for (const c of m){ buf[total % p.size] = c; wr[total % p.size]++; total++; } }
  const lo = Math.max(0, total - p.size), kept = starts.filter(s => s[0] >= lo).map(s => s[2]);
  const tr = starts.find(s => s[0] < lo && lo < s[1]);
  return {buf, wr, W: total % p.size, total, kept, trunc: tr ? tr[2] : null, bounds: new Set(starts.filter(s => s[0] >= lo).map(s => s[0] % p.size)),
          console: LEVEL[p.lvl] <= LEVEL[p.con] ? n : 0, wrapped: total >= p.size};
}
function regen(){ const N = Math.max(1, parseInt(document.getElementById("rn").value, 10) || 200);
  setSteps(Array.from({length: N + 1}, (_, i) => ({n: i, msg: "", line: -1}))); show(N); }
function preset(){ const g = id => document.getElementById(id);
  g("rsz").value = 1024; g("rfmt").value = "fix"; g("rlen").value = 64; g("rn").value = 100; g("rlvl").value = "LOG_DEBUG"; g("rcon").value = "LOG_WARNING"; regen(); }
window.addEventListener("load", () => { show(STEPS.length - 1); if (location.hash === "#selftest") { const r = sim({size: 256, L: 8, lvl: "LOG_INFO", con: "LOG_INFO"}, 200);
  const q = sim({size: 1024, L: 64, lvl: "LOG_DEBUG", con: "LOG_WARNING"}, 100), v = sim({size: 256, L: 0, lvl: "LOG_INFO", con: "LOG_INFO"}, 200);
  document.getElementById("status").textContent = "selftest " + (r.W === REF.W && JSON.stringify(r.kept) === JSON.stringify(REF.kept)) + " " + (q.kept.length === REF.q3 && q.console === 0) + " " + (v.trunc === REF.var_trunc); } });
function render(s){
  const p = params(), r = sim(p, s.n), cols = 16, rows = Math.ceil(p.size / cols), cw = Math.min(26, 420 / cols), ch = Math.min(22, 400 / rows);
  svg.setAttribute("viewBox", `0 0 760 ${Math.max(300, rows * ch + 60)}`); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), hl2 = css("--hl2");
  for (let q = 0; q < p.size; q++){ const x = 20 + (q % cols) * cw, y = 30 + Math.floor(q / cols) * ch, over = r.wr[q] >= 2;
    el("rect", {x, y, width: cw, height: ch, fill: over ? css("--cellhl") : cell, stroke: mut, "stroke-width": 0.4});
    const c = r.buf[q]; if (c !== null && ch >= 9) el("text", {x: x + cw / 2, y: y + ch / 2 + 4, "text-anchor": "middle", "font-size": Math.min(12, ch - 4), style: "font-family:ui-monospace,monospace"}, c === "\n" ? "⏎" : (c === " " ? "·" : c));
    if (r.bounds.has(q)) el("line", {x1: x, x2: x, y1: y, y2: y + ch, stroke: line, "stroke-width": 2.5});
    if (q === r.W){ el("rect", {x, y, width: cw, height: ch, fill: "none", stroke: hl, "stroke-width": 3}); }
  }
  el("text", {x: 20, y: 20, "font-size": 12, fill: hl, "font-weight": "bold"}, "kék keret = W (író mutató)" + (r.wrapped ? " = R (legrégebbi bájt)" : ""));
  const X = 470; let y = 40;
  const T = (t, b, c) => { el("text", {x: X, y, "font-size": 12.5, "font-weight": b ? "bold" : "normal", fill: c || css("--fg")}, t); y += 21; };
  T("Üzenet: " + s.n + " / " + (STEPS.length - 1), true);
  T("Írt bájtok: " + r.total + ", W = " + r.total + " mod " + p.size + " = " + r.W);
  T("Körök: " + (r.total / p.size).toFixed(2).replace(".", ","));
  T("Megmaradt teljes üzenet: " + r.kept.length, true);
  if (r.kept.length) T("  msg " + r.kept[0] + " … msg " + r.kept[r.kept.length - 1]);
  T("Csonka legrégebbi rekord: " + (r.trunc === null ? "nincs" : "msg " + r.trunc), false, r.trunc === null ? undefined : hl2);
  const lost = s.n - r.kept.length; T("Pufferből elveszett: " + lost + " (" + (s.n ? (100 * lost / s.n).toFixed(1).replace(".", ",") : "0") + " %)");
  T("Konzolra jutott: " + r.console + " (" + p.lvl + (LEVEL[p.lvl] <= LEVEL[p.con] ? " ≤ " : " > ") + p.con + ")");
  el("text", {x: X, y: y + 10, "font-size": 11, fill: mut}, "szürke = felülírt bájt; vastag vonal = üzenethatár");
  status.textContent = s.n + " üzenet után: W = " + r.W + ", megmaradt " + r.kept.length + " teljes üzenet, konzolra " + r.console + ".";
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 120);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
