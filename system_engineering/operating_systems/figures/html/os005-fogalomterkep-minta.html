<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogalomtérkép – kész minta</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
g.node,g.edge{cursor:pointer}
g.node:focus,g.edge:focus{outline:none}
g.node:focus rect,g.edge:focus path{stroke:var(--hl);stroke-width:3}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
  <button id="bv">Vázlat</button>
  <button id="bm">Kész minta</button>
  <button id="br">Felfedések törlése</button>
  <span class="small">Kattints (vagy Tab + Enter) a „?” élre vagy egy csúcsra.</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 420" role="img" aria-label="Fogalomtérkép: felhasználói program, libc, rendszerhívás, kernel, folyamat, szál, címtér, fájl, fájlleíró"></svg>
<p class="small">A 2. fejezet laborjának fogalomtérképe (a korábbi mermaid-vázlat és -minta alapján). Felfedett él = a kész minta megfelelő éle.</p>
<script>
const D = {"nodes": {"U": {"x": 1.4, "y": 6.0, "s": "Felhasználói program", "m": "Felhasználói program"}, "L": {"x": 5.2, "y": 6.0, "s": "libc open burkoló", "m": "libc open burkoló"}, "S": {"x": 9.0, "y": 6.0, "s": "rendszerhívás:\nopenat", "m": "rendszerhívás:\nsyscall utasítás"}, "K": {"x": 12.8, "y": 6.0, "s": "Kernel", "m": "Kernel VFS"}, "P": {"x": 1.4, "y": 1.0, "s": "Folyamat", "m": "Folyamat"}, "T": {"x": 3.3, "y": 2.75, "s": "Szál", "m": "Szál"}, "A": {"x": 5.2, "y": 1.0, "s": "Címtér", "m": "Címtér"}, "F": {"x": 9.0, "y": 1.0, "s": null, "m": "Fájl"}, "FD": {"x": 12.8, "y": 1.0, "s": null, "m": "Fájlleíró"}}, "edges": [{"u": "U", "v": "L", "s": "meghívja az\nopen függvényt", "m": "meghívja az\nopen függvényt", "ss": "-", "sm": "-", "rad": 0.0, "lx": 3.3, "ly": 6.45, "va": "bottom"}, {"u": "L", "v": "S", "s": "végrehajtja", "m": "végrehajtja az openat\nrendszerhívást", "ss": "-", "sm": "-", "rad": 0.0, "lx": 7.1, "ly": 6.45, "va": "bottom"}, {"u": "U", "v": "S", "s": null, "m": "közvetlen rendszerhívás: ALTERNATÍVA, a libc megkerülésével", "ss": null, "sm": "--", "rad": -0.37, "lx": 5.2, "ly": 7.45, "va": "bottom"}, {"u": "S", "v": "K", "s": "belép", "m": "belép a\nkernelbe", "ss": "-", "sm": "-", "rad": 0.0, "lx": 10.9, "ly": 6.45, "va": "bottom"}, {"u": "K", "v": "U", "s": "visszatér a fájlleíróval", "m": "fájlleírót ad vissza", "ss": "-", "sm": "-", "rad": -0.15, "lx": 7.1, "ly": 5.05, "va": "top"}, {"u": "P", "v": "A", "s": "birtokolja", "m": "birtokolja", "ss": "-", "sm": "-", "rad": 0.0, "lx": 3.3, "ly": 1.1, "va": "bottom"}, {"u": "T", "v": "A", "s": "?", "m": "használja", "ss": "--", "sm": "-", "rad": 0.0, "lx": 4.95, "ly": 2.0, "va": "center"}, {"u": "P", "v": "T", "s": "tartalmazza", "m": "tartalmazza", "ss": "-", "sm": "-", "rad": 0.0, "lx": 1.15, "ly": 1.95, "va": "center"}, {"u": "P", "v": "F", "s": null, "m": "megnyitja", "ss": null, "sm": "-", "rad": 0.2, "lx": 5.2, "ly": 0.2, "va": "top"}, {"u": "F", "v": "FD", "s": null, "m": "azonosítja", "ss": null, "sm": "-", "rad": 0.0, "lx": 10.9, "ly": 1.1, "va": "bottom"}, {"u": "K", "v": "F", "s": null, "m": "kezeli", "ss": null, "sm": "-", "rad": 0.0, "lx": 10.9, "ly": 3.5, "va": "center"}]};
let MODE = "m", REV = new Set(), FOCUS = null;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v"), st = document.getElementById("status");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mk(tag, a, parent, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; (parent || svg).appendChild(e); return e; }
const SX = x => 20 + x * 51, SY = y => 395 - (y + 0.45) * 46, BW = 127, BH = 38;
function eid(e){ return e.u + ">" + e.v; }
function visEdge(e){ if (MODE === "m") return e.m ? {lab: e.m, st: e.sm, rev: false} : null;
  if (REV.has(eid(e)) && e.m) return {lab: e.m, st: e.sm, rev: true}; return e.s ? {lab: e.s, st: e.ss, rev: false} : null; }
function visNode(k){ const n = D.nodes[k]; if (MODE === "m") return n.m;
  const shown = D.edges.some(e => (e.u === k || e.v === k) && visEdge(e)); return n.s || (shown ? n.m : null); }
function reveal(list, why){ list.forEach(e => REV.add(eid(e))); MODE = MODE === "m" ? "m" : "v";
  st.textContent = list.length ? why + ": " + list.map(e => (D.nodes[e.u].m || "").replace("\n", " ") + " → " + (D.nodes[e.v].m || "").replace("\n", " ") + " (" + e.m.replace(/\n/g, " ") + ")").join("; ") : why + ": nincs további él a kész mintában."; draw(); }
function clickNode(k){ if (MODE === "m"){ FOCUS = FOCUS === k ? null : k; const es = D.edges.filter(e => e.m && (e.u === k || e.v === k));
    st.textContent = (D.nodes[k].m || "").replace("\n", " ") + ": " + es.map(e => e.m.replace(/\n/g, " ")).join("; "); draw(); return; }
  reveal(D.edges.filter(e => e.m && (e.u === k || e.v === k) && (!e.s || e.s !== e.m) && !REV.has(eid(e))), "A kész minta " + (D.nodes[k].m || "").replace("\n", " ") + " csúcsának élei"); }
function clickEdge(e){ if (MODE === "v" && e.s && e.m) reveal([e], "Felfedve"); }
function arrowPath(e){
  // arc3-megfelelő: C1 = közép + rad·(dy, −dx) adatkoordinátában; a végpontok a téglalapok szélére vágva
  const a = D.nodes[e.u], b = D.nodes[e.v], dx = b.x - a.x, dy = b.y - a.y;
  const cx = (a.x + b.x) / 2 + e.rad * dy, cy = (a.y + b.y) / 2 - e.rad * dx;
  const x0 = SX(a.x), y0 = SY(a.y), x1 = SX(b.x), y1 = SY(b.y), mx = SX(cx), my = SY(cy);
  const cut = (xa, ya, xb, yb) => { const ux = xb - xa, uy = yb - ya, t = Math.min(Math.abs((BW / 2 + 3) / (ux || 1e-9)), Math.abs((BH / 2 + 3) / (uy || 1e-9))); return [xa + ux * t, ya + uy * t]; };
  const [ax, ay] = cut(x0, y0, e.rad ? mx : x1, e.rad ? my : y1), [bx, by] = cut(x1, y1, e.rad ? mx : x0, e.rad ? my : y0);
  return {d: e.rad ? `M${ax} ${ay} Q${mx} ${my} ${bx} ${by}` : `M${ax} ${ay} L${bx} ${by}`, end: [bx, by], dir: e.rad ? [bx - mx, by - my] : [bx - ax, by - ay]};
}
function draw(){
  svg.innerHTML = ""; const line = css("--line"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), mut = css("--muted");
  D.edges.forEach(e => { const v = visEdge(e); if (!v) return;
    const P = arrowPath(e); P.lx = SX(e.lx); P.ly = SY(e.ly) + (e.va === "bottom" ? -6 - (v.lab.split("\n").length - 1) * 14 : (e.va === "top" ? 10 : 0));
    const on = v.rev || (FOCUS && (e.u === FOCUS || e.v === FOCUS)), col = on ? (v.rev ? hl2 : hl) : line;
    const g = mk("g", {class: "edge", tabindex: (MODE === "v" && e.s && e.m && e.s !== e.m) ? 0 : -1, role: "button", "aria-label": "él: " + v.lab.replace(/\n/g, " ")});
    mk("path", {d: P.d, fill: "none", stroke: "transparent", "stroke-width": 14}, g);
    mk("path", {d: P.d, fill: "none", stroke: col, "stroke-width": on ? 2.6 : 1.5, "stroke-dasharray": v.st === "--" ? "7 5" : "none"}, g);
    const L = Math.hypot(...P.dir) || 1, ux = P.dir[0] / L, uy = P.dir[1] / L, [ex, ey] = P.end;
    mk("path", {d: `M${ex} ${ey} L${ex - 10 * ux - 5 * uy} ${ey - 10 * uy + 5 * ux} L${ex - 10 * ux + 5 * uy} ${ey - 10 * uy - 5 * ux} Z`, fill: col}, g);
    const lines = v.lab.split("\n"), q = v.lab === "?";
    const bg = mk("rect", {x: P.lx - 4, y: P.ly - 9, width: 8, height: 18, fill: css("--bg")}, g);
    const tx = mk("text", {x: P.lx, y: P.ly - (lines.length - 1) * 7 + 4, "text-anchor": "middle", "font-size": q ? 18 : 11.5, "font-weight": q || on ? "bold" : "normal", fill: q ? hl2 : (on ? col : css("--fg"))}, g);
    lines.forEach((t, i) => mk("tspan", {x: P.lx, dy: i ? 14 : 0}, tx, t));
    const bb = tx.getBBox(); bg.setAttribute("x", bb.x - 3); bg.setAttribute("y", bb.y - 1); bg.setAttribute("width", bb.width + 6); bg.setAttribute("height", bb.height + 2);
    g.addEventListener("click", () => clickEdge(e)); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); clickEdge(e); } }); });
  Object.keys(D.nodes).forEach(k => { const lab = visNode(k); if (!lab) return; const n = D.nodes[k], x = SX(n.x), y = SY(n.y), on = FOCUS === k;
    const g = mk("g", {class: "node", tabindex: 0, role: "button", "aria-label": "csúcs: " + lab.replace("\n", " ")});
    mk("rect", {x: x - BW / 2, y: y - BH / 2, width: BW, height: BH, rx: 8, fill: k === "K" ? css("--cellhl") : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1.3}, g);
    const ls = lab.split("\n"); ls.forEach((t, i) => mk("text", {x, y: y + 5 + (i - (ls.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 12.5}, g, t));
    g.addEventListener("click", () => clickNode(k)); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); clickNode(k); } }); });
  mk("text", {x: 10, y: 414, "font-size": 11, fill: mut}, svg, MODE === "v" ? "Vázlat: a „?” élt a saját megfigyelésed alapján egészítsd ki; a felfedett minta-élek narancssárgák." : "Kész minta: szaggatott = a közvetlen rendszerhívás ALTERNATÍVÁJA, nem második párhuzamos út.");
}
document.getElementById("bv").onclick = () => { MODE = "v"; REV.clear(); FOCUS = null; st.textContent = "Részben kitöltött vázlat."; draw(); };
document.getElementById("bm").onclick = () => { MODE = "m"; FOCUS = null; st.textContent = "Kész minta: 11 él, a közvetlen rendszerhívás szaggatott alternatíva."; draw(); };
document.getElementById("br").onclick = () => { REV.clear(); FOCUS = null; st.textContent = "Felfedések törölve."; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
st.textContent = MODE === "v" ? "Részben kitöltött vázlat: a Szál → Címtér él még kérdéses (?)." : "Kész minta: 11 él, a közvetlen rendszerhívás szaggatott alternatíva.";
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
