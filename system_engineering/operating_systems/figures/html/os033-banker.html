<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankár algoritmus lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select onchange="pick(this.value)" aria-label="Forgatókönyv"><option value="s1">(1) kezdőállapot</option><option value="s2">(2) P2 kér (1,0,0)</option><option value="s3">(3) P1 kér (1,0,0)</option></select></label></div><details class="ctl"><summary>Saját bemenet (Allocation, Need, Available, Request)</summary><label>P1 Alloc <input id="al0" size="5" value="0,1,0" aria-label="P1 Allocation"></label> <label>Need <input id="ne0" size="5" value="1,0,0" aria-label="P1 Need"></label> &nbsp; <label>P2 Alloc <input id="al1" size="5" value="1,0,0" aria-label="P2 Allocation"></label> <label>Need <input id="ne1" size="5" value="1,2,0" aria-label="P2 Need"></label> &nbsp; <label>P3 Alloc <input id="al2" size="5" value="0,0,1" aria-label="P3 Allocation"></label> <label>Need <input id="ne2" size="5" value="1,0,1" aria-label="P3 Need"></label> &nbsp; <label>P4 Alloc <input id="al3" size="5" value="0,0,0" aria-label="P4 Allocation"></label> <label>Need <input id="ne3" size="5" value="0,0,2" aria-label="P4 Need"></label> &nbsp; <label>Available <input id="av" size="5" value="1,1,1" aria-label="Available"></label> <label>Kérő <select id="rp" aria-label="Kérő folyamat"><option value="-">nincs kérés</option><option value="0">P1</option><option value="1">P2</option><option value="2">P3</option><option value="3">P4</option></select></label> <label>Request <input id="rq" size="5" value="0,0,0" aria-label="Request"></label> <button onclick="custom()">Futtatás</button> <span id="err" class="small" aria-live="polite"></span></details><div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Táblázat a négy folyamat Allocation és Need vektorával; lépésenként a vizsgált sor kiemelve, a Need ≤ Work összevetés pipával vagy kereszttel, alatta az Available és a Work értéke."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

const V = v => "(" + v.join(",") + ")";
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const cols = [70, 170, 280, 390, 480], hy = 40;
  ["folyamat", "Allocation", "Need", "Need ≤ Work", "Finish"].forEach((h, j) => el("text", {x: cols[j], y: hy, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, h));
  for (let i = 0; i < s.alloc.length; i++) {
    const y = hy + 34 + i * 38, cur = s.cur === i;
    el("rect", {x: 20, y: y - 22, width: 520, height: 32, fill: cur ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 2.5 : 0.8});
    el("text", {x: cols[0], y, "text-anchor": "middle", "font-size": 14}, "P" + (i + 1));
    el("text", {x: cols[1], y, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, V(s.alloc[i]));
    el("text", {x: cols[2], y, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, V(s.need[i]));
    let mk = "";
    if (cur && s.cmp) mk = s.cmp.map(c => c ? "✓" : "✗").join(" ");
    else if (s.marks[i] === false) mk = "✗ (most nem)";
    el("text", {x: cols[3], y, "text-anchor": "middle", "font-size": 14}, mk);
    el("text", {x: cols[4], y, "text-anchor": "middle", "font-size": 14}, s.finish[i] ? "igaz ✓" : "hamis");
    if (s.marks[i] === false && !cur) el("line", {x1: 30, y1: y - 5, x2: 530, y2: y - 5, stroke: css("--muted"), "stroke-width": 1});
  }
  const yb = hy + 34 + s.alloc.length * 38 + 12;
  el("text", {x: 30, y: yb, "font-size": 15}, "Available = " + V(s.avail));
  el("text", {x: 300, y: yb, "font-size": 15, "font-weight": "bold"}, s.work ? "Work = " + V(s.work) : "Work: –");
  if (s.result) el("text", {x: 280, y: yb + 34, "text-anchor": "middle", "font-size": 16, "font-weight": "bold", fill: s.result.startsWith("bizt") ? css("--hl") : css("--hl2")}, "Eredmény: " + s.result);
}
function parse(id){ const v = document.getElementById(id).value.split(/[ ,;()]+/).filter(x => x !== "").map(Number); return v.length === 3 && v.every(x => Number.isInteger(x) && x >= 0) ? v : null; }
function run(avail, alloc, need, req){
  avail = avail.slice(); alloc = alloc.map(r => r.slice()); need = need.map(r => r.slice());
  const n = alloc.length, st = [];
  let saved = null;
  const push = (msg, line, work, finish, cur, cmp, marks, result) => st.push({msg, line, avail: avail.slice(), alloc: alloc.map(r => r.slice()), need: need.map(r => r.slice()),
      work: work ? work.slice() : null, finish: finish ? finish.slice() : Array(n).fill(false), cur: cur === undefined ? null : cur, cmp: cmp || null, marks: marks ? marks.slice() : Array(n).fill(null), result: result || null});
  if (req) {
    const [i, r] = req, p = "P" + (i + 1);
    if (r.some((a, j) => a > need[i][j])) { push(`1. Request ${V(r)} > Need[${p}] ${V(need[i])} → hiba (a folyamat túllépi a bejelentett maximumát).`, 0, null, null, undefined, null, null, "hiba"); return st; }
    if (r.some((a, j) => a > avail[j])) { push(`2. Request ${V(r)} > Available ${V(avail)} → ${p} vár.`, 0, null, null, undefined, null, null, "vár"); return st; }
    push(`${p} kér: Request = ${V(r)}. 1. Request ≤ Need[${p}] = ${V(need[i])} ✓; 2. Request ≤ Available = ${V(avail)} ✓`, 0);
    saved = [avail.slice(), alloc.map(x => x.slice()), need.map(x => x.slice())];
    avail = avail.map((a, j) => a - r[j]); alloc[i] = alloc[i].map((a, j) => a + r[j]); need[i] = need[i].map((a, j) => a - r[j]);
    push(`3. Próbafoglalás: Available = ${V(avail)}, Allocation[${p}] = ${V(alloc[i])}, Need[${p}] = ${V(need[i])}`, 1);
  }
  let work = avail.slice(); const finish = Array(n).fill(false), order = [];
  push(`Biztonsági ellenőrzés – 1. Work = Available = ${V(work)}`, 2, work, finish);
  push("2. Finish[i] = hamis minden folyamatra", 3, work, finish);
  let marks = Array(n).fill(null);
  for (;;) {
    marks = Array(n).fill(null); let found = false;
    for (let i = 0; i < n; i++) {
      if (finish[i]) continue;
      const cmp = need[i].map((x, j) => x <= work[j]), ok = cmp.every(Boolean); marks[i] = ok;
      const det = cmp.map((c, j) => `${"ABC"[j]}: ${need[i][j]}${c ? "≤" : ">"}${work[j]}`).join(", ");
      push(`3. P${i + 1}: Need ${V(need[i])} ≤ Work ${V(work)}? ${det} → ${ok ? "igen" : "nem"}`, 4, work, finish, i, cmp, marks);
      if (ok) { work = work.map((a, j) => a + alloc[i][j]); finish[i] = true; order.push(i);
        push(`4. P${i + 1} lefut: Work = Work + Allocation[P${i + 1}] = ${V(work)}, Finish[P${i + 1}] = igaz`, 5, work, finish, i, cmp, marks); found = true; break; }
    }
    if (!found) break;
  }
  const safe = finish.every(Boolean);
  const res = safe ? "biztonságos – sorrend: " + order.map(i => "P" + (i + 1)).join(", ") : "nem biztonságos";
  const msg = safe ? `5. Minden Finish igaz → ${res}` + (req ? "; a kérés teljesíthető" : "")
                   : "5. Egyetlen további folyamat sem fejezhető be → nem biztonságos" + (req ? "; a kérést elutasítjuk, az állapot visszaáll" : "");
  push(msg, 6, work, finish, undefined, null, marks, res);
  if (req && !safe) { const L = st[st.length - 1]; L.avail = saved[0]; L.alloc = saved[1]; L.need = saved[2]; }
  return st;
}
function pick(v){
  const sets = {s1: [null, [0,0,0]], s2: [1, [1,0,0]], s3: [0, [1,0,0]]}[v];
  if (sets) { document.getElementById("rp").value = sets[0] === null ? "-" : String(sets[0]); document.getElementById("rq").value = sets[1].join(","); }
  setSteps(SCEN[v]);
}
function custom(){
  const av = parse("av"), al = [0,1,2,3].map(i => parse("al" + i)), ne = [0,1,2,3].map(i => parse("ne" + i));
  const err = document.getElementById("err");
  if (!av || al.some(x => !x) || ne.some(x => !x)) { err.textContent = "Minden mezőbe három nemnegatív egészet írjon (pl. 1,0,0)."; return; }
  const rp = document.getElementById("rp").value; let req = null;
  if (rp !== "-") { const r = parse("rq"); if (!r) { err.textContent = "A Request három nemnegatív egész."; return; } req = [+rp, r]; }
  err.textContent = ""; setSteps(run(av, al, ne, req));
}

function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
