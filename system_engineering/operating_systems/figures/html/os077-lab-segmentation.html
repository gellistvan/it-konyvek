<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Háromzónás szegmentáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Teszt <select id="t" onchange="pick()"><option value="0">1. web → app TCP/8080</option><option value="1">2. web → app TCP/22</option><option value="2">3. app → db TCP/5432</option><option value="3" selected>4. db → app TCP/8080</option><option value="4">5. web → db TCP/5432</option><option value="5">6. app → web TCP/443</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A web, app és db zóna a rtr névtér körül; a kiválasztott teszt SYN-je a forward lánc szabályain halad, engedett esetben a SYN-ACK a ct established szabályon tér vissza."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor lab77_fw forward lánca (policy drop); a kódpanel a négy szabályt mutatja, a kiemelt sor az éppen kiértékelt szabály. Kezdőállapot: db → app TCP/8080 (a 4. szabály dob el).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "db → app TCP/8080: SYN 10.0.2.2 → 10.0.1.2:8080 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "db", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "db", "dst": "app"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "db", "dst": "app"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "db", "dst": "app"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "", "line": 2, "src": "db", "dst": "app"}, {"msg": "4. szabály: log prefix \"lab77 drop: \" drop → ILLESZKEDIK: LOG + DROP", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "db", "dst": "app"}, {"msg": "eldobva a rtr-en (a 4. szabály döntött); naplósor: „lab77 drop: …”, a kliens időtúllépést lát", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "db", "dst": "app"}];
const CODE = ["ct state established,related accept", "ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept", "ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept", "log prefix \"lab77 drop: \" drop"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = [[{"msg": "web → app TCP/8080: SYN 10.0.0.2 → 10.0.1.2:8080 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "web", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "web", "dst": "app"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "web", "dst": "app"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → ILLESZKEDIK: ACCEPT", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "accept", "line": 1, "src": "web", "dst": "app"}, {"msg": "a SYN eljut a(z) app zónába (10.0.1.2:8080)", "pos": "app", "dir": "syn", "rule": 2, "verdict": "accept", "line": -1, "src": "web", "dst": "app"}, {"msg": "SYN-ACK 10.0.1.2:8080 → 10.0.0.2 (conntrack: ESTABLISHED)", "pos": "rtr", "dir": "rep", "rule": 0, "verdict": "", "line": -1, "src": "web", "dst": "app"}, {"msg": "1. szabály: ct state established,related accept → ILLESZKEDIK: a válasz átmegy", "pos": "rtr", "dir": "rep", "rule": 1, "verdict": "accept", "line": 0, "src": "web", "dst": "app"}, {"msg": "a SYN-ACK megérkezik a(z) web zónába; a kapcsolat felépül", "pos": "web", "dir": "rep", "rule": 1, "verdict": "accept", "line": -1, "src": "web", "dst": "app"}], [{"msg": "web → app TCP/22: SYN 10.0.0.2 → 10.0.1.2:22 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "web", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "web", "dst": "app"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "web", "dst": "app"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "web", "dst": "app"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "", "line": 2, "src": "web", "dst": "app"}, {"msg": "4. szabály: log prefix \"lab77 drop: \" drop → ILLESZKEDIK: LOG + DROP", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "web", "dst": "app"}, {"msg": "eldobva a rtr-en (a 4. szabály döntött); naplósor: „lab77 drop: …”, a kliens időtúllépést lát", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "web", "dst": "app"}], [{"msg": "app → db TCP/5432: SYN 10.0.1.2 → 10.0.2.2:5432 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "app", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "app", "dst": "db"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "app", "dst": "db"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "app", "dst": "db"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → ILLESZKEDIK: ACCEPT", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "accept", "line": 2, "src": "app", "dst": "db"}, {"msg": "a SYN eljut a(z) db zónába (10.0.2.2:5432)", "pos": "db", "dir": "syn", "rule": 3, "verdict": "accept", "line": -1, "src": "app", "dst": "db"}, {"msg": "SYN-ACK 10.0.2.2:5432 → 10.0.1.2 (conntrack: ESTABLISHED)", "pos": "rtr", "dir": "rep", "rule": 0, "verdict": "", "line": -1, "src": "app", "dst": "db"}, {"msg": "1. szabály: ct state established,related accept → ILLESZKEDIK: a válasz átmegy", "pos": "rtr", "dir": "rep", "rule": 1, "verdict": "accept", "line": 0, "src": "app", "dst": "db"}, {"msg": "a SYN-ACK megérkezik a(z) app zónába; a kapcsolat felépül", "pos": "app", "dir": "rep", "rule": 1, "verdict": "accept", "line": -1, "src": "app", "dst": "db"}], [{"msg": "db → app TCP/8080: SYN 10.0.2.2 → 10.0.1.2:8080 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "db", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "db", "dst": "app"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "db", "dst": "app"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "db", "dst": "app"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "", "line": 2, "src": "db", "dst": "app"}, {"msg": "4. szabály: log prefix \"lab77 drop: \" drop → ILLESZKEDIK: LOG + DROP", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "db", "dst": "app"}, {"msg": "eldobva a rtr-en (a 4. szabály döntött); naplósor: „lab77 drop: …”, a kliens időtúllépést lát", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "db", "dst": "app"}], [{"msg": "web → db TCP/5432: SYN 10.0.0.2 → 10.0.2.2:5432 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "web", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "web", "dst": "db"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "web", "dst": "db"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "web", "dst": "db"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "", "line": 2, "src": "web", "dst": "db"}, {"msg": "4. szabály: log prefix \"lab77 drop: \" drop → ILLESZKEDIK: LOG + DROP", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "web", "dst": "db"}, {"msg": "eldobva a rtr-en (a 4. szabály döntött); naplósor: „lab77 drop: …”, a kliens időtúllépést lát", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "web", "dst": "db"}], [{"msg": "app → web TCP/443: SYN 10.0.1.2 → 10.0.0.2:443 (conntrack: NEW), a rtr forward hookjára érkezik", "pos": "app", "dir": "syn", "rule": 0, "verdict": "", "line": -1, "src": "app", "dst": "web"}, {"msg": "1. szabály: ct state established,related accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 1, "verdict": "", "line": 0, "src": "app", "dst": "web"}, {"msg": "2. szabály: ip saddr 10.0.0.0/24 ip daddr 10.0.1.0/24 tcp dport 8080 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 2, "verdict": "", "line": 1, "src": "app", "dst": "web"}, {"msg": "3. szabály: ip saddr 10.0.1.0/24 ip daddr 10.0.2.0/24 tcp dport 5432 accept → nem illeszkedik", "pos": "rtr", "dir": "syn", "rule": 3, "verdict": "", "line": 2, "src": "app", "dst": "web"}, {"msg": "4. szabály: log prefix \"lab77 drop: \" drop → ILLESZKEDIK: LOG + DROP", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "app", "dst": "web"}, {"msg": "eldobva a rtr-en (a 4. szabály döntött); naplósor: „lab77 drop: …”, a kliens időtúllépést lát", "pos": "rtr", "dir": "syn", "rule": 4, "verdict": "drop", "line": 3, "src": "app", "dst": "web"}]], LBL = {"web": "web 10.0.0.2\n:443", "app": "app 10.0.1.2\n:8080", "db": "db 10.0.2.2\n:5432", "rtr": "rtr (ip_forward=1)\ntable inet lab77_fw"};
const P = {web: [90, 70], app: [470, 70], db: [280, 250], rtr: [280, 150]};
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = "";
  const hl = css("--hl");
  ["web", "app", "db"].forEach(z => el("line", {x1: P[z][0], y1: P[z][1], x2: P.rtr[0], y2: P.rtr[1], stroke: css("--cellhl"), "stroke-width": 10}));
  const a = s.dir === "syn" ? s.src : s.dst, b = s.dir === "syn" ? s.dst : s.src;
  const seg = (p, q, dash) => el("line", {x1: P[p][0], y1: P[p][1], x2: P[q][0], y2: P[q][1], stroke: hl, "stroke-width": 3.5, "stroke-dasharray": dash});
  seg(a, "rtr", s.dir === "rep" ? "3 4" : "none");
  if (s.pos === b || (s.verdict === "accept" && s.pos !== "rtr")) seg("rtr", b, s.dir === "rep" ? "3 4" : "none");
  Object.keys(P).forEach(n => { const [x, y] = P[n], cur = n === s.pos;
    el("rect", {x: x - 70, y: y - 26, width: 140, height: 52, rx: 8, fill: n === "rtr" ? css("--cellhl") : css("--cell"), stroke: cur ? hl : css("--line"), "stroke-width": cur ? 3.5 : 1});
    LBL[n].split("\n").forEach((l, i, arr) => el("text", {x, y: y + 4 + (i - (arr.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11}, l)); });
  const [px, py] = P[s.pos];
  el("circle", {cx: px + 60, cy: py - 24, r: 8, fill: s.dir === "rep" ? css("--hl2") : hl});
  el("text", {x: px + 72, y: py - 20, "font-size": 11, "font-weight": "bold"}, s.dir === "rep" ? "SYN-ACK" : "SYN");
  if (s.verdict === "drop") el("text", {x: P.rtr[0] - 95, y: P.rtr[1] + 8, "font-size": 26, "font-weight": "bold", fill: css("--hl2")}, "✗");
}
function pick(){ setSteps(ALL[+document.getElementById("t").value]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
