<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM-ütemezés és válaszidő-analízis</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>P1: C <input id="c1" value="0,2" size="3"> T <input id="t1" value="1" size="3"> ms</label><label>P2: C <input id="c2" value="0,4" size="3"> T <input id="t2" value="2" size="3"> ms</label><label>P3: C <input id="c3" value="1,0" size="3"> T <input id="t3" value="10" size="3"> ms</label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három sávos Gantt-diagram lépésenként; P3 0,6 ms-nál kezd, 1,0 ms-nál P1 megszakítja, 1,8 ms-nál befejeződik; alatta a válaszidő-iteráció."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">RM, egy processzor, preemptív, ütemezési rezsi nélkül; a C értékek feltételezettek, nem mértek. D = T. A válaszidő-iteráció: R = C_i + Σ ⌈R/T_j⌉·C_j a magasabb prioritású taszkokra. Saját bemenetnél a prioritás a periódusból adódik (rövidebb T = magasabb).</p>

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TK = [{"n": "P1", "c": 1, "T": 5}, {"n": "P2", "c": 2, "T": 10}, {"n": "P3", "c": 5, "T": 50}], UNIT = 0.2, HOR = 50;
function fmt(u){ return (u * UNIT).toFixed(1).replace(".", ","); }
function simulate(tk, hor){
  const rem = {}, st = []; tk.forEach(x => rem[x.n] = 0); const miss = [];
  for (let t = 0; t < hor; t++) {
    tk.forEach(x => { if (t % x.T === 0) { if (rem[x.n] > 0) miss.push([x.n, t]); rem[x.n] = x.c; } });
    const ready = tk.filter(x => rem[x.n] > 0).map(x => x.n), run = ready.length ? ready[0] : null;
    const before = Object.assign({}, rem); if (run) rem[run]--;
    st.push({t, run, ready: ready.slice(1), rem: Object.assign({}, rem), before, miss: miss.slice()});
  }
  return st;
}
function rta(tk){
  const out = {};
  tk.forEach((x, i) => { let R = x.c; const seq = [R];
    for (let g = 0; g < 50; g++) { let Rn = x.c; tk.slice(0, i).forEach(y => Rn += Math.ceil(R / y.T) * y.c); seq.push(Rn);
      if (Rn === R || Rn > x.T) break; R = Rn; }
    out[x.n] = seq; });
  return out;
}
let RT = rta(TK);
function mkSteps(){
  const sl = simulate(TK, HOR);
  return sl.map((s, i) => ({t: s.t, line: (s.run === TK[TK.length - 1].n && s.rem[s.run] === 0) ? 3 : -1, sl: sl.slice(0, i + 1),
    msg: `t = ${fmt(s.t)}–${fmt(s.t + 1)} ms | fut: ${s.run || "tétlen"} | kész sor: [${s.ready.join(", ")}] | hátralévő C: ` +
         TK.map(x => x.n + " = " + fmt(s.rem[x.n])).join(", ") + (s.miss.length ? " | MISS: " + s.miss.map(m => m[0] + " @ " + fmt(m[1])).join(", ") : "")}));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), w2 = css("--hl2");
  const defs = el("defs", {});
  [["pP2", "M-1,5 L5,-1 M3,7 L7,3", 6, 1], ["pP3", "M2,2 h0.1", 5, 2.2]].forEach(([id, d, w, sw]) => {
    const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", w); p.setAttribute("height", w);
    p.setAttribute("patternUnits", "userSpaceOnUse");
    const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", d); pa.setAttribute("stroke", line); pa.setAttribute("stroke-width", sw);
    pa.setAttribute("stroke-linecap", "round"); p.appendChild(pa); defs.appendChild(p);
  });
  const FILL = [css("--cellhl"), "url(#pP2)", "url(#pP3)"];
  const x0 = 70, W = 670, sx = W / HOR, rowY = i => 30 + i * 46;
  TK.forEach((x, i) => {
    el("text", {x: x0 - 8, y: rowY(i) + 22, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, x.n);
    for (let a = 0; a <= HOR; a += x.T) {
      el("line", {x1: x0 + a * sx, y1: rowY(i) + 4, x2: x0 + a * sx, y2: rowY(i) - 8, stroke: line, "stroke-width": 1.2});
      el("path", {d: `M${x0 + a * sx - 4},${rowY(i) - 4} l4,-6 l4,6 z`, fill: line});
    }
  });
  for (let t = 0; t <= HOR; t++) {
    const big = Math.abs(t * UNIT - Math.round(t * UNIT)) < 1e-9;
    el("line", {x1: x0 + t * sx, y1: 24, x2: x0 + t * sx, y2: 166, stroke: mut, "stroke-width": big ? 0.8 : 0.3, "stroke-dasharray": big ? "none" : "1 3"});
    if (big) el("text", {x: x0 + t * sx, y: 180, "text-anchor": "middle", "font-size": 11}, String(Math.round(t * UNIT)));
  }
  s.sl.forEach(q => { if (!q.run) return; const i = TK.findIndex(x => x.n === q.run);
    el("rect", {x: x0 + q.t * sx, y: rowY(i) + 6, width: sx, height: 30, fill: FILL[i % 3], stroke: line, "stroke-width": 0.8}); });
  const last = s.sl[s.sl.length - 1];
  el("rect", {x: x0 + last.t * sx, y: 22, width: sx, height: 146, fill: "none", stroke: hl, "stroke-width": 2});
  (last.miss || []).forEach(m => { const i = TK.findIndex(x => x.n === m[0]);
    el("text", {x: x0 + m[1] * sx + 3, y: rowY(i) + 46, "font-size": 11, "font-weight": "bold", fill: w2}, "MISS"); });
  el("text", {x: x0 + W / 2, y: 196, "text-anchor": "middle", "font-size": 11}, "idő (ms) – rács: " + String(UNIT).replace(".", ",") + " ms; ↑ érkezés (D = T)");
  // válaszidő-iteráció
  let y = 222;
  TK.forEach((x, i) => {
    const seq = RT[x.n], tEnd = (last.t + 1);
    let cur = seq.findIndex(v => v >= tEnd); if (cur < 0) cur = seq.length - 1;
    el("text", {x: 10, y, "font-size": 12}, `R(${x.n}):`);
    seq.forEach((v, j) => {
      const on = i === TK.length - 1 && j === cur, bad = v > x.T;
      el("text", {x: 70 + j * 70, y, "font-size": 12, "font-weight": on ? "bold" : "normal", fill: bad ? w2 : (on ? hl : css("--fg"))},
         (j ? "→ " : "") + fmt(v) + (bad ? " > D" : ""));
    });
    y += 22;
  });
}
function load(){
  const msg = document.getElementById("err");
  try {
    const tk = [1, 2, 3].map(i => {
      const c = parseFloat(document.getElementById("c" + i).value.replace(",", ".")), T = parseFloat(document.getElementById("t" + i).value.replace(",", "."));
      const cu = Math.round(c / UNIT), Tu = Math.round(T / UNIT);
      if (!(cu >= 1 && Tu >= cu && Math.abs(cu * UNIT - c) < 1e-6 && Math.abs(Tu * UNIT - T) < 1e-6 && Tu <= 100)) throw "C és T a 0,2 ms többszöröse, 0 < C ≤ T ≤ 20 ms";
      return {n: "P" + i, c: cu, T: Tu};
    }).sort((a, b) => a.T - b.T);
    TK = tk; RT = rta(TK); HOR = Math.min(100, Math.max(...TK.map(x => x.T)));
    msg.textContent = "RM-prioritás: " + TK.map(x => x.n).join(" > ");
    setSteps(mkSteps());
  } catch (e) { msg.textContent = String(e); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
