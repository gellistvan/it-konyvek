<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazard pointer protokoll</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Mód: <select id="hm" onchange="setMode(this.value)" aria-label="Memóriaszabály"><option value="weak">release/acquire</option><option value="sc">seq_cst</option></select></label> <button onclick='preset(["r1", "w", "c", "s", "f", "r2", "u", "vw", "vc"],"weak")'>Ellenpélda</button> <button onclick='preset(["r1", "w", "r2", "c", "s", "f", "u"],"sc")'>seq_cst 1. eset</button> <button onclick='preset(["r1", "w", "c", "r2", "s", "f", "u"],"sc")'>seq_cst 2. eset</button><div id="evl" class="small" style="width:100%">(az eseménysorrend szerkesztéséhez válassza az egyik előbeállítást)</div><span id="hmsg" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az olvasó és a visszanyerő szál eseményei egy sorrendben; lépésenként a top, a hp[0] láthatósága és A állapota; a gyenge rendezésű ellenpéldában use-after-free."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető modell: gyenge módban a másik szál írása egy külön, későbbi eseménnyel válik láthatóvá (store buffering). Az elérhető kimenetek listáját a programsorrendet megtartó összes sorrend felsorolása adja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: top = A, hp[0] = NULL. Mód: release/acquire", "line": -1, "done": [], "st": {"top_t1": "A", "top_vis": "A", "hp": null, "hp_vis": false, "r1": null, "r2": null, "retry": false, "scan": null, "freed": false, "uaf": false, "used": false}}, {"msg": "1. T0: r1 = load top: r1 = A", "line": -1, "done": ["r1"], "st": {"top_t1": "A", "top_vis": "A", "hp": null, "hp_vis": false, "r1": "A", "r2": null, "retry": false, "scan": null, "freed": false, "uaf": false, "used": false}}, {"msg": "2. T0: store hp[0] = r1: hp[0] = A (T1 még nem feltétlenül látja)", "line": -1, "done": ["r1", "w"], "st": {"top_t1": "A", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": null, "retry": false, "scan": null, "freed": false, "uaf": false, "used": false}}, {"msg": "3. T1: CAS top A → B: top = B (A kikerült) – T0 még a régi A-t láthatja", "line": -1, "done": ["r1", "w", "c"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": null, "retry": false, "scan": null, "freed": false, "uaf": false, "used": false}}, {"msg": "4. T1: hp[0] pásztázása: T1 a hp[0]-ban NULL-t lát", "line": -1, "done": ["r1", "w", "c", "s"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": null, "retry": false, "scan": null, "freed": false, "uaf": false, "used": false}}, {"msg": "5. T1: free(A), ha nem védett: free(A)", "line": -1, "done": ["r1", "w", "c", "s", "f"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": null, "retry": false, "scan": null, "freed": true, "uaf": false, "used": false}}, {"msg": "6. T0: r2 = load top (ellenőrzés): r2 = A == r1 → védettnek tekinti", "line": -1, "done": ["r1", "w", "c", "s", "f", "r2"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": "A", "retry": false, "scan": null, "freed": true, "uaf": false, "used": false}}, {"msg": "7. T0: r1->next olvasása: A->next olvasása: USE-AFTER-FREE – A már felszabadult!", "line": -1, "done": ["r1", "w", "c", "s", "f", "r2", "u"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": false, "r1": "A", "r2": "A", "retry": false, "scan": null, "freed": true, "uaf": true, "used": true}}, {"msg": "8. hp[0] írása láthatóvá válik T1-nek: hp[0] = A láthatóvá vált T1 számára", "line": -1, "done": ["r1", "w", "c", "s", "f", "r2", "u", "vw"], "st": {"top_t1": "B", "top_vis": "A", "hp": "A", "hp_vis": true, "r1": "A", "r2": "A", "retry": false, "scan": null, "freed": true, "uaf": true, "used": true}}, {"msg": "9. a top = B láthatóvá válik T0-nak: top = B láthatóvá vált T0 számára", "line": -1, "done": ["r1", "w", "c", "s", "f", "r2", "u", "vw", "vc"], "st": {"top_t1": "B", "top_vis": "B", "hp": "A", "hp_vis": true, "r1": "A", "r2": "A", "retry": false, "scan": null, "freed": true, "uaf": true, "used": true}, "out": "use-after-free"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAB = {"r1": "T0: r1 = load top", "w": "T0: store hp[0] = r1", "r2": "T0: r2 = load top (ellenőrzés)", "u": "T0: r1->next olvasása", "c": "T1: CAS top A → B", "s": "T1: hp[0] pásztázása", "f": "T1: free(A), ha nem védett", "vw": "hp[0] írása láthatóvá válik T1-nek", "vc": "a top = B láthatóvá válik T0-nak"};
const T0 = ["r1", "w", "r2", "u"], T1 = ["c", "s", "f"];
const REACH = {"weak": ["A védett, nem szabadul fel", "T0 újrapróbál", "biztonságos", "use-after-free"], "sc": ["A védett, nem szabadul fel", "T0 újrapróbál", "biztonságos"]};
let MODE = "weak", ORDER = ["r1", "w", "c", "s", "f", "r2", "u", "vw", "vc"].slice();
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  el("text", {x: 20, y: 18, "font-size": 13, "font-weight": "bold"}, "eseménysorrend (" + (MODE === "sc" ? "seq_cst" : "release/acquire") + ")");
  ORDER.forEach((e, i) => {
    const y = 30 + i * 30, done = i < s.done.length, cur = i === s.done.length - 1, t0 = T0.includes(e) || e === "vw";
    el("rect", {x: t0 ? 20 : 150, y, width: 230, height: 24, rx: 5, fill: done ? css("--cellhl") : css("--cell"),
                stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": (e === "vw" || e === "vc") ? "3 3" : (t0 ? "none" : "6 3")});
    el("text", {x: (t0 ? 20 : 150) + 8, y: y + 17, "font-size": 12}, (i + 1) + ". " + LAB[e]);
  });
  const st = s.st, X = 400;
  el("text", {x: X, y: 40, "font-size": 13}, "T0 látja: top = " + st.top_vis);
  el("text", {x: X, y: 62, "font-size": 13}, "T1: top = " + st.top_t1);
  el("text", {x: X, y: 84, "font-size": 13}, "hp[0] = " + (st.hp || "NULL") + (st.hp && !st.hp_vis ? " (T1 nem látja)" : ""));
  el("text", {x: X, y: 106, "font-size": 13}, "r1 = " + (st.r1 || "–") + ", r2 = " + (st.r2 || "–"));
  el("text", {x: X, y: 128, "font-size": 13}, "A: " + (st.freed ? "felszabadítva" : "él"));
  if (st.uaf) el("text", {x: X, y: 158, "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "USE-AFTER-FREE!");
  if (s.out) el("text", {x: X, y: 182, "font-size": 12, "font-weight": "bold"}, "kimenet: " + s.out);
  el("text", {x: X, y: 220, "font-size": 12, "font-weight": "bold"}, "e módban elérhető:");
  REACH[MODE].forEach((o, i) => el("text", {x: X, y: 240 + i * 18, "font-size": 12, fill: o === "use-after-free" ? css("--hl2") : css("--fg")}, "• " + o));
  if (MODE === "sc") el("text", {x: X, y: 240 + REACH.sc.length * 18, "font-size": 12, "text-decoration": "line-through", fill: css("--muted")}, "• use-after-free");
}
function valid(o){
  const p = {}; o.forEach((e, i) => p[e] = i);
  for (let i = 0; i + 1 < T0.length; i++) if (p[T0[i]] > p[T0[i + 1]]) return false;
  for (let i = 0; i + 1 < T1.length; i++) if (p[T1[i]] > p[T1[i + 1]]) return false;
  if (MODE === "weak" && (p.w > p.vw || p.c > p.vc)) return false;
  return true;
}
function sim(order){
  const sc = MODE === "sc";
  const S = {top_t1: "A", top_vis: "A", hp: null, hp_vis: false, r1: null, r2: null, retry: false, scan: null, freed: false, uaf: false, used: false};
  const st = [{msg: "Kezdet: top = A, hp[0] = NULL. Mód: " + (sc ? "seq_cst" : "release/acquire"), line: -1, done: [], st: Object.assign({}, S)}];
  order.forEach((e, k) => {
    let m = "";
    if (e === "r1") { S.r1 = S.top_vis; m = "r1 = " + S.r1; }
    else if (e === "w") { S.hp = S.r1; if (sc) S.hp_vis = true; m = "hp[0] = " + S.hp + (sc ? "" : " (T1 még nem feltétlenül látja)"); }
    else if (e === "vw") { S.hp_vis = true; m = "hp[0] = " + S.hp + " láthatóvá vált T1 számára"; }
    else if (e === "r2") { S.r2 = S.top_vis; S.retry = S.r2 !== S.r1; m = "r2 = " + S.r2 + (S.retry ? " ≠ r1 → újrapróba (A-t nem használja)" : " == r1 → védettnek tekinti"); }
    else if (e === "u") { if (S.retry) m = "T0 újrapróbál, A-t nem olvassa"; else if (S.r1 === "A") { S.used = true; S.uaf = S.freed; m = "A->next olvasása: " + (S.freed ? "USE-AFTER-FREE – A már felszabadult!" : "biztonságos"); } else m = "B-t olvassa (B nem szabadul fel) – biztonságos"; }
    else if (e === "c") { S.top_t1 = "B"; if (sc) S.top_vis = "B"; m = "top = B (A kikerült)" + (sc ? "" : " – T0 még a régi A-t láthatja"); }
    else if (e === "vc") { S.top_vis = "B"; m = "top = B láthatóvá vált T0 számára"; }
    else if (e === "s") { S.scan = S.hp_vis ? S.hp : null; m = "T1 a hp[0]-ban " + (S.scan === "A" ? "A-t látja" : (S.scan ? "B-t látja" : "NULL-t lát")); }
    else if (e === "f") { if (S.scan === "A") m = "A védett → nem szabadítja fel (később újra próbálja)"; else { S.freed = true; m = "free(A)"; } }
    st.push({msg: `${k + 1}. ${LAB[e]}: ${m}`, line: -1, done: order.slice(0, k + 1), st: Object.assign({}, S)});
  });
  st[st.length - 1].out = S.uaf ? "use-after-free" : (S.retry ? "T0 újrapróbál" : (!S.freed ? "A védett, nem szabadul fel" : "biztonságos"));
  return st;
}
function reload(){ setSteps(sim(ORDER)); show(STEPS.length - 1); listEv(); }
function mv(i, d){
  const j = i + d; if (j < 0 || j >= ORDER.length) return;
  const o = ORDER.slice(); [o[i], o[j]] = [o[j], o[i]];
  const msg = document.getElementById("hmsg");
  if (!valid(o)) { msg.textContent = "Ez a csere megsértené a programsorrendet (vagy a láthatóvá válás előzné az írást)."; return; }
  msg.textContent = ""; ORDER = o; reload();
}
function listEv(){
  const d = document.getElementById("evl"); d.innerHTML = "";
  ORDER.forEach((e, i) => { const sp = document.createElement("span"); sp.style.marginRight = "6px";
    sp.innerHTML = `<button aria-label="${LAB[e]} feljebb" onclick="mv(${i},-1)">▲</button><button aria-label="${LAB[e]} lejjebb" onclick="mv(${i},1)">▼</button> ${i + 1}. ${e}`; d.appendChild(sp); });
}
function setMode(m){
  MODE = m;
  if (m === "sc") ORDER = ORDER.filter(e => e !== "vw" && e !== "vc");
  else { if (!ORDER.includes("vw")) ORDER.push("vw"); if (!ORDER.includes("vc")) ORDER.push("vc"); }
  if (!valid(ORDER)) ORDER = m === "sc" ? ["r1", "w", "r2", "c", "s", "f", "u"].slice() : ["r1", "w", "c", "s", "f", "r2", "u", "vw", "vc"].slice();
  reload();
}
function preset(o, m){ document.getElementById("hm").value = m; MODE = m; ORDER = o.slice(); reload(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
