<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A folyamat állapotgépe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt állapot (New, Ready, Running, Blocked, Terminated) és hét átmenet; lépésenként a process_states.c markerei szerint kiemelt aktuális állapot és él."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Általános ötállapotú modell; a Linux-címkék közelítők. A lépések a 7.1.2 laborjának MARK-sorai, a State a /proc/&lt;pid&gt;/status várt értéke (nem mérés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"state": "Running", "edge": "2", "via": ["1"], "line": 1, "mark": "busy-start", "proc": "R", "msg": "MARK: busy-start – a folyamat a CPU-n fut (busy_until 5 s): Running, a monitor State-je R. Előtte (1) felvétel és (2) kiválasztás."}, {"state": "Blocked", "edge": "4", "via": [], "line": 3, "mark": "sleep-start", "proc": "S", "msg": "MARK: sleep-start – sleep(3): eseményre (időzítőre) vár, (4) Running → Blocked; State S."}, {"state": "Blocked", "edge": "4", "via": ["5", "2"], "line": 5, "mark": "wait-start", "proc": "S", "msg": "MARK: wait-start – az időzítő lejárt ((5), majd (2)), most sigsuspend()-del jelre vár: ismét (4) Running → Blocked; State S."}, {"state": "Terminated", "edge": "6", "via": ["5", "2"], "line": 7, "mark": "wait-end", "proc": "gone", "msg": "MARK: wait-end – a SIGUSR1 felébresztette ((5), (2)), a main visszatér: (6) Running → Terminated; a szülő begyűjti, a /proc bejegyzés eltűnik: a monitor „gone” értéket ír."}];
const CODE = ["printf(\"MARK: busy-start\\n\");", "busy_until(&start, 5.0);     /* Running állapot 5 másodpercig */", "printf(\"MARK: sleep-start\\n\");", "while (marad > 0) marad = sleep(marad);", "printf(\"MARK: wait-start\\n\");", "while (!stop) sigsuspend(&regi);", "printf(\"MARK: wait-end\\n\");", "return 0;                    /* kilépés; a szülő (shell) begyűjti */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"nodes": {"New": [1.8, 9.7, "–  (fork/clone alatt)", ""], "Ready": [3.0, 6.0, "TASK_RUNNING", "R"], "Running": [10.0, 6.0, "TASK_RUNNING", "R"], "Blocked": [6.0, 1.6, "TASK_INTERRUPTIBLE /\nTASK_UNINTERRUPTIBLE", "S / D"], "Terminated": [12.8, 1.6, "EXIT_ZOMBIE", "Z"]}, "edges": [{"id": "1", "u": "New", "v": "Ready", "lab": "(1) felvesz", "rad": 0.0, "exc": false, "dx": 1.05, "dy": 0.6, "why": "fork()/clone() vége: a kernel a kész sorba teszi az új taskot (wake_up_new_task)"}, {"id": "2", "u": "Ready", "v": "Running", "lab": "(2) ütemező kiválaszt", "rad": -0.22, "exc": false, "dx": 0.0, "dy": 1.55, "why": "az ütemező (schedule()) kiválasztja, kontextusváltás"}, {"id": "3", "u": "Running", "v": "Ready", "lab": "(3) kvantum lejár / preempció", "rad": -0.22, "exc": false, "dx": 0.0, "dy": -1.35, "why": "időzítő-megszakítás (időszelet vége) vagy magasabb prioritású task ébred; sched_yield()"}, {"id": "4", "u": "Running", "v": "Blocked", "lab": "(4) eseményre vár\n(I/O, sleep, zár)", "rad": 0.0, "exc": false, "dx": 0.0, "dy": -0.2, "why": "read() üres csövön, nanosleep()/sleep(), futex() várakozás, sigsuspend(), waitpid()"}, {"id": "5", "u": "Blocked", "v": "Ready", "lab": "(5) esemény\nbekövetkezik", "rad": 0.0, "exc": false, "dx": 0.0, "dy": -0.2, "why": "I/O-megszakítás, lejárt időzítő, felszabadult zár (futex wake), jel kézbesítése"}, {"id": "6", "u": "Running", "v": "Terminated", "lab": "(6) exit /\nvégzetes jel", "rad": 0.0, "exc": false, "dx": 1.15, "dy": 0.3, "why": "exit()/exit_group(), return a main()-ből, végzetes jel (pl. SIGSEGV, SIGKILL)"}, {"id": "6'", "u": "Blocked", "v": "Terminated", "lab": "(6') kivételes:\nSIGKILL, platformfüggő", "rad": 0.0, "exc": true, "dx": 0.0, "dy": 0.95, "why": "SIGKILL egy alvó (megszakítható vagy killable) tasknak: a kernel felébreszti és kilépteti"}]};
const SX = 44, SY = 30, OX = 14, OY = 352;
function P(x, y){ return [OX + x * SX, OY - y * SY]; }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 660 400");
  const defs = el("defs", {});
  const mk = document.createElementNS(NS, "marker");
  [["id","ah"],["viewBox","0 0 10 10"],["refX","9"],["refY","5"],["markerWidth","12"],["markerHeight","12"],["markerUnits","userSpaceOnUse"],["orient","auto-start-reverse"]].forEach(([a,b]) => mk.setAttribute(a,b));
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d","M0,0 L10,5 L0,10 z"); mp.setAttribute("fill", css("--line")); mk.appendChild(mp); defs.appendChild(mk);
  const [fx, fy] = P(1.2, 8.1);
  el("rect", {x: fx, y: fy, width: 10.6 * SX, height: 3.9 * SY, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 3"});
  el("text", {x: fx + 10.6 * SX, y: fy - 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "Linux: TASK_RUNNING · State R");
  G.edges.forEach(e => {
    const [ax0, ay0] = P(G.nodes[e.u][0], G.nodes[e.u][1]), [ax1, ay1] = P(G.nodes[e.v][0], G.nodes[e.v][1]);
    // a csomópont-ellipszis peremén induljon/érkezzen
    const ddx = ax1 - ax0, ddy = ay1 - ay0, L = Math.hypot(ddx, ddy);
    const cut = t => { const rx = 62, ry = 20; const k = 1 / Math.sqrt((ddx*ddx)/(rx*rx) + (ddy*ddy)/(ry*ry)) * L; return k / L; };
    const c = cut();
    const x0 = ax0 + ddx * c, y0 = ay0 + ddy * c, x1 = ax1 - ddx * c, y1 = ay1 - ddy * c;
    const mx = (x0 + x1) / 2 - e.rad * (y1 - y0), my = (y0 + y1) / 2 + e.rad * (x1 - x0);
    const on = s.edge === e.id, via = (s.via || []).includes(e.id);
    const path = el("path", {d: `M${x0},${y0} Q${mx},${my} ${x1},${y1}`, fill: "none", stroke: on ? css("--hl2") : css("--line"),
      "stroke-width": on ? 4 : via ? 2.5 : 1.4, "stroke-dasharray": e.exc ? "7 5" : (via && !on ? "1 0" : "none"), "marker-end": "url(#ah)"});
    const [lx, ly] = P((G.nodes[e.u][0] + G.nodes[e.v][0]) / 2 + e.dx, (G.nodes[e.u][1] + G.nodes[e.v][1]) / 2 + e.dy);
    const ls = e.lab.split("\n");
    const bw = Math.max(...ls.map(q => q.length)) * 6.4 + 8;
    el("rect", {x: lx - bw / 2, y: ly - 10 - (ls.length - 1) * 7, width: bw, height: 16 * ls.length + 2, rx: 4, fill: css("--bg"), opacity: 0.9});
    const t = el("text", {x: lx, y: ly + 4 - (ls.length - 1) * 7, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal", tabindex: 0, role: "button",
      style: "cursor:pointer", "aria-label": "Átmenet " + e.lab.replace("\n", " ") + ": kiváltó hívás megjelenítése"});
    ls.forEach((q, i) => { const ts = document.createElementNS(NS, "tspan"); ts.setAttribute("x", lx); if (i) ts.setAttribute("dy", 16); ts.textContent = q; t.appendChild(ts); });
    const pick = () => { status.textContent = e.lab.replace("\n", " ") + " – tipikus kiváltó: " + e.why; };
    t.onclick = pick; path.onclick = pick; path.style.cursor = "pointer";
    t.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } };
  });
  Object.entries(G.nodes).forEach(([n, v]) => {
    const [x, y] = P(v[0], v[1]), on = s.state === n;
    el("ellipse", {cx: x, cy: y, rx: 64, ry: 18, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, n);
    if (n !== "Ready" && n !== "Running")
      v[2].split("\n").concat(v[3] ? ["State " + v[3]] : []).forEach((q, i) =>
        el("text", {x, y: y + 33 + i * 13, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, q));
  });
  el("text", {x: 640, y: 24, "text-anchor": "end", "font-size": 13}, "MARK: " + s.mark + "  →  monitor State: " + s.proc);
  el("text", {x: 640, y: 44, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "Kattintson egy élre: tipikus kiváltó hívás");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
