<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fájlleíró, file objektum és inode</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="act('closeA3')">close(3) A-ban</button><button onclick="act('unlink')">unlink notes.txt</button><button onclick="act('closeAll')">minden fd bezárása</button><button onclick="resetAll()">alaphelyzet</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három folyamat fd-táblája; a szülő és a gyermek fd 3-a ugyanarra a 10-es offsetű file objektumra mutat, a független folyamaté külön, 0-s offsetű file objektumra; mindkettő ugyanarra az inode-ra."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített számlálók: refcount = a file objektumra mutató fd-k száma; i_count = dentry + nyitott file objektumok; i_nlink = a nevek száma. A gombok az aktuális lépés állapotából folytatják. A lemezes inode akkor szabadul fel, ha i_nlink = 0 és már nincs nyitott file.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"procs": {"A": {}, "B": null, "C": {}}, "files": {}, "dentry": true, "nlink": 1, "freed": false, "line": -1, "icount": 1, "msg": "Kezdetben: A és C fut, a 0–2 fd mindkettőnél a terminál; B még nem létezik  |  nincs file objektum; inode 1234: i_count = 1, i_nlink = 1"}, {"procs": {"A": {"3": "file#1"}, "B": null, "C": {}}, "files": {"file#1": {"off": 0, "ref": 1}}, "dentry": true, "nlink": 1, "freed": false, "line": 0, "icount": 2, "msg": "(1) A: open → fd 3 → file#1, offset 0  |  file#1: off = 0, ref = 1; inode 1234: i_count = 2, i_nlink = 1"}, {"procs": {"A": {"3": "file#1"}, "B": {"3": "file#1"}, "C": {}}, "files": {"file#1": {"off": 0, "ref": 2}}, "dentry": true, "nlink": 1, "freed": false, "line": 1, "icount": 2, "msg": "(2) A: fork → B fd 3 ugyanarra a file#1-re mutat, refcount 2  |  file#1: off = 0, ref = 2; inode 1234: i_count = 2, i_nlink = 1"}, {"procs": {"A": {"3": "file#1"}, "B": {"3": "file#1"}, "C": {}}, "files": {"file#1": {"off": 10, "ref": 2}}, "dentry": true, "nlink": 1, "freed": false, "line": 2, "icount": 2, "msg": "(3) A: read(3, buf, 10) → a közös offset 10  |  file#1: off = 10, ref = 2; inode 1234: i_count = 2, i_nlink = 1"}, {"procs": {"A": {"3": "file#1"}, "B": {"3": "file#1"}, "C": {}}, "files": {"file#1": {"off": 10, "ref": 2}}, "dentry": true, "nlink": 1, "freed": false, "line": 3, "icount": 2, "msg": "(4) B: lseek(3, 0, SEEK_CUR) → 10: B következő read-je a 10. bájttól olvas  |  file#1: off = 10, ref = 2; inode 1234: i_count = 2, i_nlink = 1"}, {"procs": {"A": {"3": "file#1"}, "B": {"3": "file#1"}, "C": {"3": "file#2"}}, "files": {"file#1": {"off": 10, "ref": 2}, "file#2": {"off": 0, "ref": 1}}, "dentry": true, "nlink": 1, "freed": false, "line": 4, "icount": 3, "msg": "(5) C: saját open → fd 3 → file#2, offset 0 (független)  |  file#1: off = 10, ref = 2; file#2: off = 0, ref = 1; inode 1234: i_count = 3, i_nlink = 1"}, {"procs": {"A": {"3": "file#1", "4": "file#1"}, "B": {"3": "file#1"}, "C": {"3": "file#2"}}, "files": {"file#1": {"off": 10, "ref": 3}, "file#2": {"off": 0, "ref": 1}}, "dentry": true, "nlink": 1, "freed": false, "line": 5, "icount": 3, "msg": "(6) A: dup(3) → fd 4 → file#1, refcount 3  |  file#1: off = 10, ref = 3; file#2: off = 0, ref = 1; inode 1234: i_count = 3, i_nlink = 1"}];
const CODE = ["A:  fd = open(\"notes.txt\", O_RDONLY);       /* fd 3 → file#1, offset 0 */", "A:  pid = fork();                             /* B örökli: fd 3 → file#1 */", "A:  read(3, buf, 10);                         /* a közös offset 10 */", "B:  lseek(3, 0, SEEK_CUR);                    /* → 10: B a 10. bájttól olvasna */", "C:  fd = open(\"notes.txt\", O_RDONLY);       /* független: fd 3 → file#2, offset 0 */", "A:  fd2 = dup(3);                             /* fd 4 → file#1 */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function icnt(s){ return (s.dentry ? 1 : 0) + Object.keys(s.files).length; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = "";
  const PT = {A: "A (szülő)", B: "B (gyermek)", C: "C (független)"};
  const names = Object.keys(s.files).sort(), FY = {}; names.forEach((f, i) => FY[f] = 40 + i * 130);
  const hl = css("--hl");
  ["A", "B", "C"].forEach((p, j) => { const y0 = 16 + j * 100, t = s.procs[p];
    el("text", {x: 10, y: y0, "font-size": 12.5, "font-weight": "bold"}, PT[p]);
    if (!t) { el("text", {x: 10, y: y0 + 24, "font-size": 12, fill: css("--muted")}, "(még nincs)"); return; }
    [["fd 0–2", "tty", null], ["fd 3", t[3] || "—", t[3]], ["fd 4", t[4] || "—", t[4]]].forEach(([a, b, tg], r) => {
      const y = y0 + 8 + r * 26;
      el("rect", {x: 10, y, width: 170, height: 24, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": r === 0 ? "2 3" : "none"});
      el("text", {x: 16, y: y + 17, "font-size": 12}, a);
      el("text", {x: 80, y: y + 17, "font-size": 12, fill: tg ? css("--fg") : css("--muted")}, b);
      if (tg && FY[tg] !== undefined) el("line", {x1: 180, y1: y + 12, x2: 338, y2: FY[tg] + 32, stroke: css("--line"), "stroke-width": 1.5}); }); });
  names.forEach(f => { const v = s.files[f], y = FY[f];
    el("rect", {x: 340, y, width: 130, height: 64, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x: 405, y: y + 18, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, f);
    el("text", {x: 405, y: y + 36, "text-anchor": "middle", "font-size": 12}, `offset = ${v.off}`);
    el("text", {x: 405, y: y + 54, "text-anchor": "middle", "font-size": 12}, `refcount = ${v.ref}`);
    el("line", {x1: 470, y1: y + 32, x2: 548, y2: 120, stroke: css("--line"), "stroke-dasharray": "6 3", "stroke-width": 1.4}); });
  el("rect", {x: 550, y: 100, width: 84, height: 44, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": s.dentry ? "none" : "4 3"});
  el("text", {x: 592, y: 118, "text-anchor": "middle", "font-size": 11.5}, "dentry");
  el("text", {x: 592, y: 135, "text-anchor": "middle", "font-size": 11.5}, s.dentry ? "notes.txt" : "(törölve)");
  el("line", {x1: 592, y1: 144, x2: 592, y2: 196, stroke: css("--line"), "stroke-dasharray": "2 3", "stroke-width": 1.6});
  el("rect", {x: 545, y: 200, width: 94, height: 74, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2.5, "stroke-dasharray": s.freed ? "4 3" : "none"});
  el("text", {x: 592, y: 220, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "inode 1234");
  el("text", {x: 592, y: 240, "text-anchor": "middle", "font-size": 12}, `i_count = ${icnt(s)}`);
  el("text", {x: 592, y: 258, "text-anchor": "middle", "font-size": 12}, `i_nlink = ${s.nlink}`);
  if (s.freed) el("text", {x: 592, y: 292, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, "felszabadult");
  else if (s.nlink === 0) el("text", {x: 592, y: 292, "text-anchor": "middle", "font-size": 11, fill: hl}, "névtelen, de nyitott");
  el("text", {x: 10, y: 320, "font-size": 11, fill: css("--muted")}, "tömör: fd → file · szaggatott: file → dentry · pontozott: dentry → inode");
}
let HIST = null;
function cl(o){ return JSON.parse(JSON.stringify(o)); }
function mk(S, msg){ const f = Object.keys(S.files).sort().map(k => `${k}: off = ${S.files[k].off}, ref = ${S.files[k].ref}`).join("; ") || "nincs file objektum";
  const s = cl(S); s.line = -1; s.icount = icnt(S);
  s.msg = `${msg}  |  ${f}; inode 1234: i_count = ${icnt(S)}, i_nlink = ${S.nlink}` + (S.freed ? " (a lemezes inode és a blokkok felszabadultak)" : ""); return s; }
function act(kind){
  if (!HIST) HIST = STEPS.slice(0, k + 1);
  const S = cl(HIST[HIST.length - 1]), err = m => document.getElementById("err").textContent = m; err("");
  if (kind === "closeA3") { const t = S.procs.A; if (!t || !t[3]) return err("A-ban az fd 3 nincs nyitva.");
    const f = t[3]; delete t[3]; S.files[f].ref--; let m = `A: close(3) → ${f} refcount ${S.files[f].ref}`;
    if (S.files[f].ref === 0) { delete S.files[f]; m += `, a ${f} megszűnik`; }
    if (S.nlink === 0 && !Object.keys(S.files).length) S.freed = true; HIST.push(mk(S, m)); }
  if (kind === "closeAll") { let m = "minden fd lezárva"; ["A", "B", "C"].forEach(p => { const t = S.procs[p]; if (!t) return; [3, 4].forEach(fd => { if (t[fd]) { S.files[t[fd]].ref--; if (!S.files[t[fd]].ref) delete S.files[t[fd]]; delete t[fd]; } }); });
    if (S.nlink === 0) { S.freed = true; m += " → i_nlink = 0 és nincs nyitott file: a lemezes inode felszabadul"; } HIST.push(mk(S, m)); }
  if (kind === "unlink") { if (!S.dentry) return err("A notes.txt már törölve.");
    S.dentry = false; S.nlink--; const open = Object.keys(S.files).length;
    S.freed = S.nlink === 0 && !open;
    HIST.push(mk(S, "unlink(\"notes.txt\"): i_nlink = 0" + (open ? ", de a nyitott file objektumok miatt az inode nem szabadul fel; a fájl tovább olvasható" : ", nincs nyitott file: felszabadul"))); }
  setSteps(HIST.slice()); show(HIST.length - 1);
}
function resetAll(){ HIST = null; setSteps(ORIG); }
const ORIG = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
