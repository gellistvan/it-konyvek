<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal throttling az R–C modellben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>trip <input id="trip" type="range" min="45" max="70" step="1" value="55" oninput="resimT()" aria-label="trip pont °C"> <span id="tripv">55</span> °C</label> <label>hiszterézis <input id="hy" type="range" min="0" max="10" step="0.5" value="5" oninput="resimT()" aria-label="hiszterézis °C"> <span id="hyv">5</span> °C</label> <label>R_th <input id="rth" type="range" min="0.8" max="2.5" step="0.1" value="1.5" oninput="resimT()" aria-label="hőellenállás °C/W"> <span id="rthv">1,5</span> °C/W</label> <label>C_th <input id="cth" type="range" min="5" max="60" step="1" value="20" oninput="resimT()" aria-label="hőkapacitás J/°C"> <span id="cthv">20</span> J/°C</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három idősor 0–120 s: a hőmérséklet 24,3 s-nál éri el az 55 °C-os trip pontot, utána 50 és 55 °C között ingadozik; a frekvencia 3 és 1 GHz között vált; a teljesítmény 30 és 8,1 W között, a 60–120 s-os átlag 15,4 W."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet rc_thermal_sim.c programjának átirata (Δt = 0,1 s, T_amb = 30 °C); a csúszkák a trip pontot, a hiszterézist, R_th-t és C_th-t állítják. Hiszterézis 0-nál a váltások sűrűsödnek. Modellérték, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "line": -1, "msg": ""}, {"t": 1, "line": -1, "msg": ""}, {"t": 2, "line": -1, "msg": ""}, {"t": 3, "line": -1, "msg": ""}, {"t": 4, "line": -1, "msg": ""}, {"t": 5, "line": -1, "msg": ""}, {"t": 6, "line": -1, "msg": ""}, {"t": 7, "line": -1, "msg": ""}, {"t": 8, "line": -1, "msg": ""}, {"t": 9, "line": -1, "msg": ""}, {"t": 10, "line": -1, "msg": ""}, {"t": 11, "line": -1, "msg": ""}, {"t": 12, "line": -1, "msg": ""}, {"t": 13, "line": -1, "msg": ""}, {"t": 14, "line": -1, "msg": ""}, {"t": 15, "line": -1, "msg": ""}, {"t": 16, "line": -1, "msg": ""}, {"t": 17, "line": -1, "msg": ""}, {"t": 18, "line": -1, "msg": ""}, {"t": 19, "line": -1, "msg": ""}, {"t": 20, "line": -1, "msg": ""}, {"t": 21, "line": -1, "msg": ""}, {"t": 22, "line": -1, "msg": ""}, {"t": 23, "line": -1, "msg": ""}, {"t": 24, "line": -1, "msg": ""}, {"t": 25, "line": -1, "msg": ""}, {"t": 26, "line": -1, "msg": ""}, {"t": 27, "line": -1, "msg": ""}, {"t": 28, "line": -1, "msg": ""}, {"t": 29, "line": -1, "msg": ""}, {"t": 30, "line": -1, "msg": ""}, {"t": 31, "line": -1, "msg": ""}, {"t": 32, "line": -1, "msg": ""}, {"t": 33, "line": -1, "msg": ""}, {"t": 34, "line": -1, "msg": ""}, {"t": 35, "line": -1, "msg": ""}, {"t": 36, "line": -1, "msg": ""}, {"t": 37, "line": -1, "msg": ""}, {"t": 38, "line": -1, "msg": ""}, {"t": 39, "line": -1, "msg": ""}, {"t": 40, "line": -1, "msg": ""}, {"t": 41, "line": -1, "msg": ""}, {"t": 42, "line": -1, "msg": ""}, {"t": 43, "line": -1, "msg": ""}, {"t": 44, "line": -1, "msg": ""}, {"t": 45, "line": -1, "msg": ""}, {"t": 46, "line": -1, "msg": ""}, {"t": 47, "line": -1, "msg": ""}, {"t": 48, "line": -1, "msg": ""}, {"t": 49, "line": -1, "msg": ""}, {"t": 50, "line": -1, "msg": ""}, {"t": 51, "line": -1, "msg": ""}, {"t": 52, "line": -1, "msg": ""}, {"t": 53, "line": -1, "msg": ""}, {"t": 54, "line": -1, "msg": ""}, {"t": 55, "line": -1, "msg": ""}, {"t": 56, "line": -1, "msg": ""}, {"t": 57, "line": -1, "msg": ""}, {"t": 58, "line": -1, "msg": ""}, {"t": 59, "line": -1, "msg": ""}, {"t": 60, "line": -1, "msg": ""}, {"t": 61, "line": -1, "msg": ""}, {"t": 62, "line": -1, "msg": ""}, {"t": 63, "line": -1, "msg": ""}, {"t": 64, "line": -1, "msg": ""}, {"t": 65, "line": -1, "msg": ""}, {"t": 66, "line": -1, "msg": ""}, {"t": 67, "line": -1, "msg": ""}, {"t": 68, "line": -1, "msg": ""}, {"t": 69, "line": -1, "msg": ""}, {"t": 70, "line": -1, "msg": ""}, {"t": 71, "line": -1, "msg": ""}, {"t": 72, "line": -1, "msg": ""}, {"t": 73, "line": -1, "msg": ""}, {"t": 74, "line": -1, "msg": ""}, {"t": 75, "line": -1, "msg": ""}, {"t": 76, "line": -1, "msg": ""}, {"t": 77, "line": -1, "msg": ""}, {"t": 78, "line": -1, "msg": ""}, {"t": 79, "line": -1, "msg": ""}, {"t": 80, "line": -1, "msg": ""}, {"t": 81, "line": -1, "msg": ""}, {"t": 82, "line": -1, "msg": ""}, {"t": 83, "line": -1, "msg": ""}, {"t": 84, "line": -1, "msg": ""}, {"t": 85, "line": -1, "msg": ""}, {"t": 86, "line": -1, "msg": ""}, {"t": 87, "line": -1, "msg": ""}, {"t": 88, "line": -1, "msg": ""}, {"t": 89, "line": -1, "msg": ""}, {"t": 90, "line": -1, "msg": ""}, {"t": 91, "line": -1, "msg": ""}, {"t": 92, "line": -1, "msg": ""}, {"t": 93, "line": -1, "msg": ""}, {"t": 94, "line": -1, "msg": ""}, {"t": 95, "line": -1, "msg": ""}, {"t": 96, "line": -1, "msg": ""}, {"t": 97, "line": -1, "msg": ""}, {"t": 98, "line": -1, "msg": ""}, {"t": 99, "line": -1, "msg": ""}, {"t": 100, "line": -1, "msg": ""}, {"t": 101, "line": -1, "msg": ""}, {"t": 102, "line": -1, "msg": ""}, {"t": 103, "line": -1, "msg": ""}, {"t": 104, "line": -1, "msg": ""}, {"t": 105, "line": -1, "msg": ""}, {"t": 106, "line": -1, "msg": ""}, {"t": 107, "line": -1, "msg": ""}, {"t": 108, "line": -1, "msg": ""}, {"t": 109, "line": -1, "msg": ""}, {"t": 110, "line": -1, "msg": ""}, {"t": 111, "line": -1, "msg": ""}, {"t": 112, "line": -1, "msg": ""}, {"t": 113, "line": -1, "msg": ""}, {"t": 114, "line": -1, "msg": ""}, {"t": 115, "line": -1, "msg": ""}, {"t": 116, "line": -1, "msg": ""}, {"t": 117, "line": -1, "msg": ""}, {"t": 118, "line": -1, "msg": ""}, {"t": 119, "line": -1, "msg": ""}, {"t": 120, "line": -1, "msg": ""}];
const CODE = ["if (!throttled && temp >= t_trip) throttled = 1;", "else if (throttled && temp <= t_trip - hyst) throttled = 0;", "power = c_sw * v * v * f;   /* 30 W vagy 8,1 W */", "temp += dt / c_th * (power - (temp - t_amb) / r_th);   /* dt = 0,1 s */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SIMT = null;
function simT(o){
  const dt = 0.1, cs = 1e-8; let temp = o.ta, thr = 0, t = 0.0; const rows = [], sw = [];
  while (t < 120.0){
    const old = thr;
    if (!thr && temp >= o.trip) thr = 1; else if (thr && temp <= o.trip - o.hy) thr = 0;
    if (thr !== old) sw.push(t);
    const f = thr ? 1e9 : 3e9, v = thr ? 0.9 : 1.0, p = cs * v * v * f;
    temp += dt / o.c * (p - (temp - o.ta) / o.r);
    rows.push([t, temp, f, p, thr]); t += dt;
  }
  const w = rows.filter(x => x[0] >= 60 - 1e-9);
  return {rows: rows, sw: sw, pavg: w.reduce((a, x) => a + x[3], 0) / w.length, favg: w.reduce((a, x) => a + x[2], 0) / w.length / 1e9};
}
function opt(){
  const g = id => +document.getElementById(id).value;
  const o = {ta: 30, trip: g("trip"), hy: g("hy"), r: g("rth"), c: g("cth")};
  document.getElementById("tripv").textContent = o.trip; document.getElementById("hyv").textContent = o.hy;
  document.getElementById("rthv").textContent = String(o.r).replace(".", ","); document.getElementById("cthv").textContent = o.c;
  return o;
}
function resimT(){ SIMT = simT(opt()); show(k); }
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
function render(s){
  if (!SIMT) SIMT = simT(opt());
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 400");
  const o = opt(), X0 = 70, W = 670, Xt = t => X0 + t * W / 120, tnow = s.t;
  const panels = [{y: 20, h: 160, lo: 25, hi: 85, lab: "T [°C]"}, {y: 200, h: 70, lo: 0, hi: 3.5, lab: "f [GHz]"}, {y: 290, h: 80, lo: 0, hi: 34, lab: "P [W]"}];
  const Y = (p, v) => p.y + p.h - (v - p.lo) / (p.hi - p.lo) * p.h;
  // throttled háttér
  let s0 = null;
  SIMT.rows.forEach(x => { if (x[0] > tnow) return; if (x[4] && s0 === null) s0 = x[0]; if (!x[4] && s0 !== null){ panels.forEach(p => el("rect", {x: Xt(s0), y: p.y, width: Xt(x[0]) - Xt(s0), height: p.h, fill: css("--cellhl"), opacity: 0.7})); s0 = null; } });
  if (s0 !== null) panels.forEach(p => el("rect", {x: Xt(s0), y: p.y, width: Xt(Math.min(tnow, 120)) - Xt(s0), height: p.h, fill: css("--cellhl"), opacity: 0.7}));
  panels.forEach(p => { el("rect", {x: X0, y: p.y, width: W, height: p.h, fill: "none", stroke: css("--muted")});
                        el("text", {x: X0 - 8, y: p.y + p.h / 2 + 4, "text-anchor": "end", "font-size": 12}, p.lab); });
  const P1 = panels[0];
  [[o.trip, "6 4", "trip"], [o.trip - o.hy, "2 3", "vissza"], [o.ta + o.r * 30, "8 3 2 3", "egyensúly 3 GHz-en"], [o.ta + o.r * 8.1, "8 3 2 3", "egyensúly 1 GHz-en"]].forEach(l => {
    if (l[0] < P1.lo || l[0] > P1.hi) return;
    el("line", {x1: X0, y1: Y(P1, l[0]), x2: X0 + W, y2: Y(P1, l[0]), stroke: css("--muted"), "stroke-dasharray": l[1]});
    el("text", {x: l[2] === "vissza" ? X0 + W - 150 : X0 + W - 4, y: Y(P1, l[0]) + (l[2] === "vissza" ? 12 : -3), "text-anchor": "end", "font-size": 10, fill: css("--muted")}, l[2] + ": " + fmt(l[0], 2) + " °C"); });
  let d1 = "", d2 = "", d3 = "";
  SIMT.rows.forEach((x, i) => { if (x[0] > tnow) return;
    d1 += (i ? "L" : "M") + Xt(x[0] + 0.1) + " " + Y(P1, x[1]) + " ";
    d2 += (i ? "L" : "M") + Xt(x[0]) + " " + Y(panels[1], x[2] / 1e9) + " L" + Xt(x[0] + 0.1) + " " + Y(panels[1], x[2] / 1e9) + " ";
    d3 += (i ? "L" : "M") + Xt(x[0]) + " " + Y(panels[2], x[3]) + " L" + Xt(x[0] + 0.1) + " " + Y(panels[2], x[3]) + " "; });
  el("path", {d: d1, fill: "none", stroke: css("--hl"), "stroke-width": 2});
  el("path", {d: d2, fill: "none", stroke: css("--fg"), "stroke-width": 1.6});
  el("path", {d: d3, fill: "none", stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": "6 2 2 2"});
  if (tnow >= 60){
    el("line", {x1: Xt(60), y1: Y(panels[1], SIMT.favg), x2: Xt(120), y2: Y(panels[1], SIMT.favg), stroke: css("--hl2"), "stroke-dasharray": "6 3"});
    el("text", {x: Xt(61), y: Y(panels[1], SIMT.favg) - 4, "font-size": 11, fill: css("--hl2")}, "átlag 60–120 s: " + fmt(SIMT.favg, 2) + " GHz");
    el("line", {x1: Xt(60), y1: Y(panels[2], SIMT.pavg), x2: Xt(120), y2: Y(panels[2], SIMT.pavg), stroke: css("--hl2"), "stroke-dasharray": "6 3"});
    el("text", {x: Xt(61), y: Y(panels[2], SIMT.pavg) - 4, "font-size": 11, fill: css("--hl2")}, "fenntartható átlag: " + fmt(SIMT.pavg, 1) + " W");
  }
  for (let t = 0; t <= 120; t += 20) el("text", {x: Xt(t), y: 388, "text-anchor": "middle", "font-size": 11}, String(t));
  el("text", {x: X0 + W, y: 400, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "idő [s]");
  el("line", {x1: Xt(tnow), y1: 16, x2: Xt(tnow), y2: 374, stroke: css("--hl2"), "stroke-width": 1.2});
  const i = Math.min(SIMT.rows.length - 1, Math.max(0, Math.round(tnow / 0.1) - 1)), x = SIMT.rows[i];
  status.textContent = `t = ${tnow} s, T = ${fmt(x[1], 2)} °C, f = ${x[2] / 1e9} GHz, throttled: ${x[4] ? "igen" : "nem"}` +
    (SIMT.sw.length ? ` · első trip: ${fmt(SIMT.sw[0], 1)} s, váltások 0–120 s: ${SIMT.sw.length}` : " · nincs trip");
  const ln = x[4] ? 1 : 0; codeEl.querySelectorAll("span").forEach((e, j) => e.classList.toggle("on", j === ln));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 120);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
