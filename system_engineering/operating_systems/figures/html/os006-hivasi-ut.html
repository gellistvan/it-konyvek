<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monolitikus és mikrokernel hívási út</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Üzenethossz: <input id="len" type="range" min="1" max="64" value="16" oninput="setLen()" aria-label="Üzenethossz bájtban"></label><span id="lenv">16 bájt</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két szekvenciadiagram: balra egy syscall, egy másolás és 16 outb; jobbra két másolás, két IPC-üzenet, két kontextusváltás és a szerver saját syscall-ja; futó eseményszámlálóval."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Levezetett eseményszám, nem mért idő; az üzenet regiszterben jut a szerverhez. Szürke szaggatott sáv = privilégiumszint-váltás; ▭ másolás, ⇉ IPC, ↯ kontextusváltás. A többlet minden hossznál 7.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 1, "km": 1, "n": 16, "line": -1, "msg": "1. lépés – monolit: syscall: U→K (Σ 1) | mikrokernel: syscall: U→K (Σ 1)"}, {"k": 2, "km": 2, "n": 16, "line": -1, "msg": "2. lépés – monolit: user_range_ok (Σ 1) | mikrokernel: capability-ellenőrzés (Σ 1)"}, {"k": 3, "km": 3, "n": 16, "line": -1, "msg": "3. lépés – monolit: ▭ copy_from_user (1. másolás) (Σ 2) | mikrokernel: ▭ copy_from_user (1.) (Σ 2)"}, {"k": 4, "km": 4, "n": 16, "line": -1, "msg": "4. lépés – monolit: outb ×16 (Σ 18) | mikrokernel: ▭ memcpy az üzenetbe (2.) (Σ 3)"}, {"k": 5, "km": 5, "n": 16, "line": -1, "msg": "5. lépés – monolit: visszatérés: K→U (Σ 19) | mikrokernel: ⇉ ipc_call: kérés (Σ 4)"}, {"k": 6, "km": 5, "n": 16, "line": -1, "msg": "6. lépés – monolit: kész, vár (Σ 19) | mikrokernel: ↯ kontextusváltás 1 (Σ 5)"}, {"k": 7, "km": 5, "n": 16, "line": -1, "msg": "7. lépés – monolit: kész, vár (Σ 19) | mikrokernel: szerver: K→U (Σ 6)"}, {"k": 8, "km": 5, "n": 16, "line": -1, "msg": "8. lépés – monolit: kész, vár (Σ 19) | mikrokernel: outb ×16 (Σ 22)"}, {"k": 9, "km": 5, "n": 16, "line": -1, "msg": "9. lépés – monolit: kész, vár (Σ 19) | mikrokernel: válasz-syscall: U→K (Σ 23)"}, {"k": 10, "km": 5, "n": 16, "line": -1, "msg": "10. lépés – monolit: kész, vár (Σ 19) | mikrokernel: ⇉ IPC: válasz (Σ 24)"}, {"k": 11, "km": 5, "n": 16, "line": -1, "msg": "11. lépés – monolit: kész, vár (Σ 19) | mikrokernel: ↯ kontextusváltás 2 (Σ 25)"}, {"k": 12, "km": 5, "n": 16, "line": -1, "msg": "12. lépés – monolit: kész, vár (Σ 19) | mikrokernel: kliens: K→U (Σ 26)"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const KEYS = ["átlépés", "másolás", "IPC", "kontextusváltás", "outb"];
const MONO = [["syscall: U→K", 0, 1, "call", "átlépés", 1], ["user_range_ok", 1, 1, "call", null, 0], ["▭ copy_from_user (1. másolás)", 1, 1, "call", "másolás", 1], ["outb ×n", 1, 2, "call", "outb", "n"], ["visszatérés: K→U", 1, 0, "ret", "átlépés", 1]], MICRO = [["syscall: U→K", 0, 1, "call", "átlépés", 1], ["capability-ellenőrzés", 1, 1, "call", null, 0], ["▭ copy_from_user (1.)", 1, 1, "call", "másolás", 1], ["▭ memcpy az üzenetbe (2.)", 1, 1, "call", "másolás", 1], ["⇉ ipc_call: kérés", 0, 1, "call", "IPC", 1], ["↯ kontextusváltás 1", 1, 2, "call", "kontextusváltás", 1], ["szerver: K→U", 1, 2, "ret", "átlépés", 1], ["outb ×n", 2, 3, "call", "outb", "n"], ["válasz-syscall: U→K", 2, 1, "call", "átlépés", 1], ["⇉ IPC: válasz", 2, 1, "call", "IPC", 1], ["↯ kontextusváltás 2", 1, 0, "ret", "kontextusváltás", 1], ["kliens: K→U", 1, 0, "ret", "átlépés", 1]];
const MONO_A = ["Kliens (U)", "Kernel (K)", "UART"], MICRO_A = ["Kliens (U)", "Kernel (K)", "UART-\nszerver (U)", "UART"];
function totals(ev, n, upto){ const c = {}; KEYS.forEach(x => c[x] = 0);
  ev.slice(0, upto).forEach(e => { if (e[4]) c[e[4]] += e[5] === "n" ? n : e[5]; }); return c; }
function stepsFor(n){
  const st = [];
  for (let k = 1; k <= MICRO.length; k++) {
    const km = Math.min(k, MONO.length), cm = totals(MONO, n, km), cu = totals(MICRO, n, k);
    const sm = KEYS.reduce((a, x) => a + cm[x], 0), su = KEYS.reduce((a, x) => a + cu[x], 0);
    const mt = k <= MONO.length ? MONO[km - 1][0].replace("×n", "×" + n) : "kész, vár";
    st.push({k, km, n, line: -1, msg: `${k}. lépés – monolit: ${mt} (Σ ${sm}) | mikrokernel: ${MICRO[k - 1][0].replace("×n", "×" + n)} (Σ ${su})`});
  }
  return st;
}
function panel(x0, w, A, EV, upto, n, title, done){
  const fg = css("--fg"), hl = css("--hl"), line = css("--line"), cell = css("--cell"), mut = css("--muted");
  const xs = A.map((a, i) => x0 + 40 + i * (w - 80) / (A.length - 1)), top = 70, rh = 21;
  el("text", {x: x0 + w / 2, y: 16, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, title + (done ? " – kész" : ""));
  A.forEach((a, i) => {
    el("line", {x1: xs[i], y1: 50, x2: xs[i], y2: top + EV.length * rh + 4, stroke: line, "stroke-dasharray": "3 4", "stroke-width": 0.8});
    el("rect", {x: xs[i] - 42, y: 24, width: 84, height: 26, fill: cell, stroke: line, rx: 4});
    el("text", {x: xs[i], y: 41, "text-anchor": "middle", "font-size": 10, "font-weight": "bold"}, a.replace("UART-\nszerver", "szerver").replace("\n", " "));
  });
  EV.forEach((e, j) => {
    if (j >= upto) return;
    const on = j === upto - 1 && !done, y = top + j * rh + 12, c = on ? hl : fg;
    if (/^(syscall|visszatérés|szerver: K|válasz-syscall|kliens: K)/.test(e[0]))
      el("line", {x1: x0 + 4, y1: y, x2: x0 + w - 4, y2: y, stroke: mut, "stroke-width": 5, "stroke-dasharray": "6 4", opacity: 0.45});
    const lab = e[0].replace("×n", "×" + n);
    if (e[1] === e[2]) {
      el("path", {d: `M${xs[e[1]]},${y - 6} h16 v10 h-14`, fill: "none", stroke: c, "stroke-width": on ? 2.2 : 1.2, "marker-end": on ? "url(#ahh)" : "url(#ah)"});
      el("text", {x: xs[e[1]] + 20, y: y + 3, "font-size": 10, "font-weight": on ? "bold" : "normal", fill: c, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, lab);
    } else {
      const d = xs[e[2]] > xs[e[1]] ? 1 : -1;
      el("line", {x1: xs[e[1]] + d * 3, y1: y, x2: xs[e[2]] - d * 3, y2: y, stroke: c, "stroke-width": on ? 2.4 : 1.3,
                  "stroke-dasharray": e[3] === "ret" ? "7 4" : "none", "marker-end": on ? "url(#ahh)" : "url(#ah)"});
      el("text", {x: (xs[e[1]] + xs[e[2]]) / 2, y: y - 4, "text-anchor": "middle", "font-size": 10, "font-weight": on ? "bold" : "normal",
                  fill: c, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, lab);
    }
  });
  const c = totals(EV, n, upto), yb = top + MICRO.length * rh + 18;
  KEYS.forEach((x, i) => el("text", {x: x0 + 8, y: yb + i * 15, "font-size": 11}, x + ": " + c[x]));
  el("text", {x: x0 + 8, y: yb + 5 * 15 + 2, "font-size": 12, "font-weight": "bold"}, "összesen: " + KEYS.reduce((a, x) => a + c[x], 0));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 780 430"); svg.innerHTML = ""; seqDefs();
  panel(0, 330, MONO_A, MONO, s.km, s.n, "Monolitikus", s.k > MONO.length);
  panel(345, 435, MICRO_A, MICRO, s.k, s.n, "Mikrokernel", s.k === MICRO.length);
  el("line", {x1: 338, y1: 4, x2: 338, y2: 425, stroke: css("--muted")});
  if (s.k === MICRO.length) {
    el("text", {x: 775, y: 405, "text-anchor": "end", "font-size": 11.5, fill: css("--hl2"), "font-weight": "bold"},
       "többlet: " + (KEYS.reduce((a, x) => a + totals(MICRO, s.n)[x] - totals(MONO, s.n)[x], 0)) + " = 1 másolás + 2 IPC + 2 kontextusváltás + 2 módváltás");
  }
}
function seqDefs(){
  const defs = el("defs", {});
  [["ah", css("--fg")], ["ahh", css("--hl")]].forEach(([id, c]) => {
    const mk = document.createElementNS(NS, "marker");
    mk.setAttribute("id", id); mk.setAttribute("viewBox", "0 0 10 10"); mk.setAttribute("refX", 9); mk.setAttribute("refY", 5);
    mk.setAttribute("markerWidth", 7); mk.setAttribute("markerHeight", 7); mk.setAttribute("orient", "auto-start-reverse");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", c);
    mk.appendChild(p); defs.appendChild(mk);
  });
}
function setLen(){ const n = +document.getElementById("len").value; document.getElementById("lenv").textContent = n + " bájt";
  const k0 = k; setSteps(stepsFor(n)); show(k0); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
