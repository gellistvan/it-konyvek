<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az ioctl parancskód bitmezői</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--on:#bbb;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--on:#666;--line:#ddd}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
input,select,button{font:inherit}input[type=number]{width:5.5em}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.mono{font-family:ui-monospace,monospace}#status{margin:4px 0;min-height:2.9em}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl"><label>Parancs (include/lab/abi.h):
<select id="cmd" aria-label="Parancs"></select></label></div>
<div class="ctl" role="group" aria-label="Szabad bevitel">
<label>dir <select id="dir"><option value="0">0 – _IOC_NONE</option><option value="1">1 – _IOC_WRITE</option>
<option value="2">2 – _IOC_READ</option><option value="3">3 – READ|WRITE</option></select></label>
<label>type 0x<input id="typ" class="mono" size="3" value="A4" aria-label="type hexában"></label>
<label>nr <input id="nr" type="number" min="0" max="255" value="4"></label>
<label>méret (bájt) <input id="sz" type="number" min="0" max="16383" value="4"></label></div>
<div class="ctl"><label>Hexa érték → mezők: 0x<input id="hex" class="mono" size="9" value="8004A404" aria-label="parancskód hexában"></label>
<button id="dec">Dekódolás</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 680 170" role="img" aria-label="32 bites sáv dir, size, type, nr mezőkkel; a LAB_GET_SIZE értéke 0x8004A404."></svg>
<p class="small">A Linux x86 (asm-generic) kiosztása: nr 0–7, type 8–15, size 16–29, dir 30–31. Más architektúrán
(pl. PowerPC, MIPS) a dir/size szélessége eltér. Kezdőállapot: LAB_GET_SIZE = 0x8004A404.</p>
<script>
const CMDS = [{"name": "LAB_GET_VERSION", "mac": "_IOR(0xA4, 1, uint32_t)", "dir": 2, "nr": 1, "size": 4, "val": 2147787777}, {"name": "LAB_SET_MODE", "mac": "_IOW(0xA4, 2, uint32_t)", "dir": 1, "nr": 2, "size": 4, "val": 1074045954}, {"name": "LAB_CLEAR", "mac": "_IO(0xA4, 3)", "dir": 0, "nr": 3, "size": 0, "val": 41987}, {"name": "LAB_GET_SIZE", "mac": "_IOR(0xA4, 4, uint32_t)", "dir": 2, "nr": 4, "size": 4, "val": 2147787780}, {"name": "LAB_SET_EOF", "mac": "_IO(0xA4, 5)", "dir": 0, "nr": 5, "size": 0, "val": 41989}];
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,x){const e=document.createElementNS(NS,t);for(const q in a)e.setAttribute(q,a[q]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const $=id=>document.getElementById(id);
const FIELDS=[["dir",31,30,"#999"],["size",29,16,"dots"],["type",15,8,"hatch"],["nr",7,0,"none"]];
const hex=v=>"0x"+(v>>>0).toString(16).toUpperCase().padStart(8,"0");
function macro(d,t,nr,sz){const tt="0x"+t.toString(16).toUpperCase();
  if(d===0&&sz===0)return `_IO(${tt}, ${nr})`;const ty=sz===4?"uint32_t":`/* ${sz} bájtos típus */`;
  return `${["_IO","_IOW","_IOR","_IOWR"][d]}(${tt}, ${nr}, ${ty})`;}
function draw(d,t,nr,sz){
  const v=((d<<30)>>>0)+(sz<<16)+(t<<8)+nr;
  svg.innerHTML="";
  const defs=el("defs",{});
  const p1=document.createElementNS(NS,"pattern");p1.setAttribute("id","dots");p1.setAttribute("width","6");p1.setAttribute("height","6");p1.setAttribute("patternUnits","userSpaceOnUse");
  const c=document.createElementNS(NS,"circle");c.setAttribute("cx","3");c.setAttribute("cy","3");c.setAttribute("r","1");c.setAttribute("fill",css("--line"));p1.appendChild(c);defs.appendChild(p1);
  const p2=document.createElementNS(NS,"pattern");p2.setAttribute("id","hatch");p2.setAttribute("width","7");p2.setAttribute("height","7");p2.setAttribute("patternUnits","userSpaceOnUse");p2.setAttribute("patternTransform","rotate(45)");
  const l=document.createElementNS(NS,"line");l.setAttribute("x1","0");l.setAttribute("y1","0");l.setAttribute("x2","0");l.setAttribute("y2","7");l.setAttribute("stroke",css("--line"));p2.appendChild(l);defs.appendChild(p2);
  const W=20,X=20;
  FIELDS.forEach(([n,hi,lo,f])=>{const x=X+(31-hi)*W,w=(hi-lo+1)*W;
    el("rect",{x,y:14,width:w,height:30,fill:f==="dots"?"url(#dots)":f==="hatch"?"url(#hatch)":f==="none"?css("--cell"):f,stroke:css("--line"),"stroke-width":2});
    const fv=(v>>>lo)&((1<<(hi-lo+1))-1);
    el("rect",{x:x+w/2-62,y:20,width:124,height:18,fill:css("--bg"),opacity:.9});
    el("text",{x:x+w/2,y:34,"text-anchor":"middle","font-size":12},`${n} = ${n==="type"?"0x"+fv.toString(16).toUpperCase():fv}`);});
  for(let b=31;b>=0;b--){const x=X+(31-b)*W,bit=(v>>>b)&1;
    el("rect",{x,y:54,width:W,height:28,fill:bit?css("--on"):css("--cell"),stroke:css("--line"),"stroke-width":[31,30,16,8,0].includes(b)?2:.7});
    el("text",{x:x+W/2,y:73,"text-anchor":"middle","font-size":13,"font-weight":bit?"bold":"normal"},String(bit));
    if(b%4===3||b===0)el("text",{x:x+W/2,y:98,"text-anchor":"middle","font-size":10,fill:css("--muted")},String(b));}
  const parts=[[(d<<30)>>>0,"dir"],[sz<<16,"size"],[t<<8,"type"],[nr,"nr"]];
  el("text",{x:X,y:128,"font-size":13,class:"mono"},parts.map(p=>hex(p[0])).join(" + ")+" = "+hex(v));
  el("text",{x:X,y:152,"font-size":13,class:"mono"},macro(d,t,nr,sz));
  const name=(CMDS.find(c=>c.val===v)||{}).name;
  $("status").textContent=`${name?name+" = ":""}${macro(d,t,nr,sz)} = ${hex(v)}  (dir = ${d}, size = ${sz}, type = 0x${t.toString(16).toUpperCase()}, nr = ${nr})`;
  $("hex").value=(v>>>0).toString(16).toUpperCase().padStart(8,"0");
}
function fromInputs(){const d=+$("dir").value,t=parseInt($("typ").value,16),nr=+$("nr").value,sz=+$("sz").value;
  if(!(t>=0&&t<=255)||!(nr>=0&&nr<=255)||!(sz>=0&&sz<=16383)||!Number.isInteger(nr)||!Number.isInteger(sz)){$("status").textContent="Érvénytelen mező: type 0–FF, nr 0–255, méret 0–16383.";return;}
  draw(d,t,nr,sz);}
function setInputs(d,t,nr,sz){$("dir").value=d;$("typ").value=t.toString(16).toUpperCase();$("nr").value=nr;$("sz").value=sz;}
CMDS.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${c.name} = ${c.mac}`;$("cmd").appendChild(o);});
$("cmd").onchange=()=>{const c=CMDS[+$("cmd").value];setInputs(c.dir,0xA4,c.nr,c.size);draw(c.dir,0xA4,c.nr,c.size);};
["dir","typ","nr","sz"].forEach(id=>$(id).addEventListener("input",fromInputs));
$("dec").onclick=()=>{const v=parseInt($("hex").value,16);if(!(v>=0&&v<=0xFFFFFFFF)){$("status").textContent="Érvénytelen hexa érték.";return;}
  const d=v>>>30,sz=(v>>>16)&0x3FFF,t=(v>>>8)&0xFF,nr=v&0xFF;setInputs(d,t,nr,sz);draw(d,t,nr,sz);};
$("hex").addEventListener("keydown",e=>{if(e.key==="Enter")$("dec").click();});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",fromInputs);
$("cmd").value=3;setInputs(2,0xA4,4,4);draw(2,0xA4,4,4);
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
