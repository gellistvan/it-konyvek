<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erőforrás-allokációs gráf és DFS</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="e0" checked onchange="toggle(0)"> P1 → R2 (kérés)</label> <label><input type="checkbox" id="e1" checked onchange="toggle(1)"> P2 → R1 (kérés)</label> <label><input type="checkbox" id="e2" checked onchange="toggle(2)"> R1 → P1 (allokáció)</label> <label><input type="checkbox" id="e3" checked onchange="toggle(3)"> R2 → P2 (allokáció)</label> <button onclick="runDfs()">Ciklus keresése</button><pre id="out" class="small" aria-live="polite" style="margin:0"></pre></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Erőforrás-allokációs gráf két folyamattal és két erőforrással; a DFS lépésenként színezi a csúcsokat, és megtalálja a P1 → R2 → P2 → R1 → P1 ciklust."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor (9.4.10) deadlock_detect.py DFS-ének átirata; a csúcsok és az élek sorrendje a labor szerinti. Az élek kikapcsolása után a „Ciklus keresése” újrafuttatja a keresést.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"color": {"P1": "W", "P2": "W", "R1": "W", "R2": "W"}, "path": [], "cycles": [], "cur": null, "edge": null, "msg": "Kezdetben minden csúcs fehér, a path üres.", "line": -1}, {"color": {"P1": "G", "P2": "W", "R1": "W", "R2": "W"}, "path": ["P1"], "cycles": [], "cur": "P1", "edge": null, "msg": "dfs(P1): P1 szürke, path = [P1]", "line": 2}, {"color": {"P1": "G", "P2": "W", "R1": "W", "R2": "W"}, "path": ["P1"], "cycles": [], "cur": "P1", "edge": ["P1", "R2"], "msg": "él P1 → R2: R2 fehér → rekurzív hívás", "line": 5}, {"color": {"P1": "G", "P2": "W", "R1": "W", "R2": "G"}, "path": ["P1", "R2"], "cycles": [], "cur": "R2", "edge": null, "msg": "dfs(R2): R2 szürke, path = [P1, R2]", "line": 2}, {"color": {"P1": "G", "P2": "W", "R1": "W", "R2": "G"}, "path": ["P1", "R2"], "cycles": [], "cur": "R2", "edge": ["R2", "P2"], "msg": "él R2 → P2: P2 fehér → rekurzív hívás", "line": 5}, {"color": {"P1": "G", "P2": "G", "R1": "W", "R2": "G"}, "path": ["P1", "R2", "P2"], "cycles": [], "cur": "P2", "edge": null, "msg": "dfs(P2): P2 szürke, path = [P1, R2, P2]", "line": 2}, {"color": {"P1": "G", "P2": "G", "R1": "W", "R2": "G"}, "path": ["P1", "R2", "P2"], "cycles": [], "cur": "P2", "edge": ["P2", "R1"], "msg": "él P2 → R1: R1 fehér → rekurzív hívás", "line": 5}, {"color": {"P1": "G", "P2": "G", "R1": "G", "R2": "G"}, "path": ["P1", "R2", "P2", "R1"], "cycles": [], "cur": "R1", "edge": null, "msg": "dfs(R1): R1 szürke, path = [P1, R2, P2, R1]", "line": 2}, {"color": {"P1": "G", "P2": "G", "R1": "G", "R2": "G"}, "path": ["P1", "R2", "P2", "R1"], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": "R1", "edge": ["R1", "P1"], "msg": "él R1 → P1: P1 szürke (a veremben van) → ciklus: P1 -> R2 -> P2 -> R1 -> P1", "line": 9}, {"color": {"P1": "G", "P2": "G", "R1": "B", "R2": "G"}, "path": ["P1", "R2", "P2"], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": "R1", "edge": null, "msg": "R1 kész: fekete, path = [P1, R2, P2]", "line": 11}, {"color": {"P1": "G", "P2": "B", "R1": "B", "R2": "G"}, "path": ["P1", "R2"], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": "P2", "edge": null, "msg": "P2 kész: fekete, path = [P1, R2]", "line": 11}, {"color": {"P1": "G", "P2": "B", "R1": "B", "R2": "B"}, "path": ["P1"], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": "R2", "edge": null, "msg": "R2 kész: fekete, path = [P1]", "line": 11}, {"color": {"P1": "B", "P2": "B", "R1": "B", "R2": "B"}, "path": [], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": "P1", "edge": null, "msg": "P1 kész: fekete, path = []", "line": 11}, {"color": {"P1": "B", "P2": "B", "R1": "B", "R2": "B"}, "path": [], "cycles": [["P1", "R2", "P2", "R1", "P1"]], "cur": null, "edge": null, "msg": "Kimenet: Holtpont észlelhető. Ciklus(ok): | P1 -> R2 -> P2 -> R1 -> P1", "line": 12, "out": "Holtpont észlelhető. Ciklus(ok):\nP1 -> R2 -> P2 -> R1 -> P1"}];
const CODE = ["def dfs(u):", "    color[u] = GRAY", "    path.append(u)", "    for v in adj[u]:", "        if color[v] == WHITE:", "            dfs(v)", "        elif color[v] == GRAY:", "            # Ciklust találtunk", "            idx = path.index(v)", "            cycles.append(path[idx:] + [v])", "    path.pop()", "    color[u] = BLACK", "# ... if cycles: print(\"Holtpont észlelhető. Ciklus(ok):\") ..."];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = ["P1", "P2", "R1", "R2"];
const ALL = [["P1", "R2"], ["P2", "R1"], ["R1", "P1"], ["R2", "P2"]], KIND = {"P1>R2": "kérés", "P2>R1": "kérés", "R1>P1": "allokáció", "R2>P2": "allokáció"};
const XY = {P1: [140, 70], R2: [420, 70], P2: [420, 230], R1: [140, 230]};
let ON = ALL.map(() => true);
function render(s){
  svg.innerHTML = "";
  const act = ALL.filter((e, i) => ON[i]);
  const cyc = new Set();
  (s.cycles || []).forEach(c => { for (let i = 0; i + 1 < c.length; i++) cyc.add(c[i] + ">" + c[i + 1]); });
  act.forEach(([u, v]) => {
    const [x1, y1] = XY[u], [x2, y2] = XY[v], d = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / d, uy = (y2 - y1) / d;
    const a = [x1 + ux * 30, y1 + uy * 30], b = [x2 - ux * 32, y2 - uy * 32];
    const on = s.edge && s.edge[0] === u && s.edge[1] === v, inc = cyc.has(u + ">" + v);
    el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: on ? css("--hl") : css("--line"), "stroke-width": inc ? 5 : (on ? 4 : 1.8),
                "stroke-dasharray": KIND[u + ">" + v] === "kérés" ? "8 5" : "none"});
    el("polygon", {points: `${b[0]},${b[1]} ${b[0] - ux * 12 - uy * 6},${b[1] - uy * 12 + ux * 6} ${b[0] - ux * 12 + uy * 6},${b[1] - uy * 12 - ux * 6}`, fill: on ? css("--hl") : css("--line")});
    el("text", {x: (a[0] + b[0]) / 2 + (uy ? 12 : 0), y: (a[1] + b[1]) / 2 - (uy ? 0 : 8), "font-size": 11, fill: css("--muted")}, KIND[u + ">" + v]);
  });
  NODES.forEach(n => {
    const [x, y] = XY[n], c = (s.color || {})[n] || "W";
    const fill = c === "B" ? "#222" : (c === "G" ? "#9a9a9a" : css("--cell"));
    if (n[0] === "P") el("circle", {cx: x, cy: y, r: 26, fill, stroke: css("--line"), "stroke-width": s.cur === n ? 4 : 1.5});
    else el("rect", {x: x - 26, y: y - 26, width: 52, height: 52, fill, stroke: css("--line"), "stroke-width": s.cur === n ? 4 : 1.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, fill: c === "B" ? "#fff" : (c === "G" ? "#000" : css("--fg"))}, n);
  });
  el("text", {x: 280, y: 284, "text-anchor": "middle", "font-size": 13}, "path (verem): [" + (s.path || []).join(", ") + "]");
  el("text", {x: 280, y: 300, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "fehér / szürke (veremben) / fekete (kész) · folytonos: allokáció, szaggatott: kérés · vastag: ciklus");
  document.getElementById("out").textContent = s.out || "";
}
function trace(edges){
  const adj = {}; NODES.forEach(n => adj[n] = []); edges.forEach(([u, v]) => adj[u].push(v));
  const color = {}; NODES.forEach(n => color[n] = "W");
  const path = [], cycles = [], st = [];
  const snap = (msg, line, cur, edge) => st.push({color: Object.assign({}, color), path: path.slice(), cycles: cycles.map(c => c.slice()), cur: cur || null, edge: edge || null, msg, line});
  function dfs(u){
    color[u] = "G"; path.push(u);
    snap(`dfs(${u}): ${u} szürke, path = [${path.join(", ")}]`, 2, u);
    for (const v of adj[u]) {
      if (color[v] === "W") { snap(`él ${u} → ${v}: ${v} fehér → rekurzív hívás`, 5, u, [u, v]); dfs(v); }
      else if (color[v] === "G") { const idx = path.indexOf(v); cycles.push(path.slice(idx).concat([v]));
        snap(`él ${u} → ${v}: ${v} szürke (a veremben van) → ciklus: ${cycles[cycles.length - 1].join(" -> ")}`, 9, u, [u, v]); }
      else snap(`él ${u} → ${v}: ${v} fekete (kész) → nincs teendő`, 3, u, [u, v]);
    }
    path.pop(); color[u] = "B";
    snap(`${u} kész: fekete, path = [${path.join(", ")}]`, 11, u);
  }
  snap("Kezdetben minden csúcs fehér, a path üres.", -1);
  NODES.forEach(n => { if (color[n] === "W") dfs(n); });
  const out = cycles.length ? "Holtpont észlelhető. Ciklus(ok):\n" + cycles.map(c => c.join(" -> ")).join("\n") : "Nincs holtpont (nincs ciklus a gráfban).";
  snap("Kimenet: " + out.replace(/\n/g, " | "), 12); st[st.length - 1].out = out;
  return st;
}
function toggle(i){ ON[i] = document.getElementById("e" + i).checked; setSteps([{msg: "Élek módosítva; nyomja meg a „Ciklus keresése” gombot.", line: -1, color: {}, path: [], cycles: []}]); }
function runDfs(){ setSteps(trace(ALL.filter((e, i) => ON[i]))); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
