<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTFS MFT-rekord</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Fájlméret: <input id="sz" type="range" min="0" max="1000" step="1" value="930" oninput="setSize()" style="width:220px" aria-label="Fájlméret 100 B és 2 MiB között"> <span id="szv">1,00 MiB</span></label> <button id="adsb" onclick="toggleAds()">ADS eltávolítása</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 1024 bájtos 64-es MFT-rekord sávja: fejléc, $STANDARD_INFORMATION és $FILE_NAME rezidens, a névtelen $DATA nem rezidens és runlistje 256 klaszterre mutat, a „stream” ADS rezidens 17 bájt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített bájtmodell (56 B fejléc, 24 B attribútumfejléc, 8 bájtos igazítás, nem rezidens $DATA = 64 B fejléc + runlist); mkntfs alapértékek: 1024 B rekord, 4 KiB klaszter. A runlist hossza a töredezettségtől függ; a valós rezidens határ néhány bájttal eltérhet.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sel": 0, "line": -1, "msg": "Fejléc „FILE”: rekordszám 64, frissítési sorozat (fixup), az első attribútum ofszetje 0x38; 56 bájt."}, {"sel": 1, "line": -1, "msg": "$STANDARD_INFORMATION (0x10): időbélyegek, DOS-attribútumok; mindig rezidens, 48 B érték + 24 B fejléc."}, {"sel": 2, "line": -1, "msg": "$FILE_NAME (0x30): a szülőkönyvtár hivatkozása és a név („test.bin”, 66 + 2·8 = 82 B); rezidens."}, {"sel": 3, "line": -1, "msg": "$DATA (0x80, névtelen): a fájl tartalma; kis méretnél rezidens, nagynál nem rezidens: a fejléc runlistje (VCN → LCN, hossz) írja le a klaszterfutamokat."}, {"sel": 4, "line": -1, "msg": "$DATA (0x80, „stream”): névvel ellátott alternatív adatfolyam (ADS); 17 B, rezidens. ntfs-3g alatt csak streams_interface=windows csatolással jön létre."}, {"sel": 5, "line": -1, "msg": "Végjel 0xFFFFFFFF: az attribútumlista vége; utána a rekord szabad része."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SIZE = 1048576, ADS = true;
function al8(n){ return Math.ceil(n / 8) * 8; }
function res(v, name){ return al8(al8(24 + 2 * (name || "").length) + v); }
function lay(){
  const si = res(48), fn = res(82), ads = ADS ? res(17, "stream") : 0, fixed = 56 + si + fn + ads + 8;
  const dres = res(SIZE), resident = fixed + dres <= 1024;
  const data = resident ? dres : 72, cl = resident ? 0 : Math.ceil(SIZE / 4096);
  return {si: si, fn: fn, ads: ads, data: data, resident: resident, cl: cl, used: fixed + data, limit: 1024 - fixed - 24};
}
function hum(b){ return b >= 1048576 ? (b / 1048576).toFixed(2).replace(".", ",") + " MiB" : b >= 1024 ? (b / 1024).toFixed(1).replace(".", ",") + " KiB" : b + " B"; }
function setSize(){ const v = +document.getElementById("sz").value; SIZE = Math.round(100 * Math.pow(20971.52, v / 1000)); document.getElementById("szv").textContent = hum(SIZE); show(k); }
function toggleAds(){ ADS = !ADS; document.getElementById("adsb").textContent = ADS ? "ADS eltávolítása" : "ADS hozzáadása"; if (!ADS && k === 4) show(3); else show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const L = lay();
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.3"/></pattern>`;
  svg.appendChild(defs);
  el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, `MFT-rekord #64, 1024 bájt – foglalt ${L.used} B, szabad ${1024 - L.used} B`);
  const parts = [
    {i: 0, t: ["Fejléc „FILE”", "#64 · 56 B"], b: 56, fill: css("--cell")},
    {i: 1, t: ["$STANDARD_INFO", "0x10 · rez."], b: L.si, fill: css("--cellhl")},
    {i: 2, t: ["$FILE_NAME", "0x30 · rez."], b: L.fn, fill: css("--cellhl")},
    {i: 3, t: ["$DATA névtelen", L.resident ? "0x80 · rez. " + SIZE + " B" : "0x80 · nem rez."], b: L.data, fill: L.resident ? css("--cellhl") : "url(#hb)"},
  ];
  if (ADS) parts.push({i: 4, t: ["$DATA „stream”", "0x80 · rez. 17 B"], b: L.ads, fill: css("--cellhl"), dash: true});
  parts.push({i: 5, t: ["végjel", "0xFFFFFFFF"], b: 8, fill: css("--cell")});
  let x = 10; const y = 40, h = 70, W = 100;
  parts.forEach(p => {
    const on = s.sel === p.i;
    const r = el("rect", {x: x, y: y, width: W, height: h, fill: p.fill, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 4 : (p.dash ? 2 : 1.2), "stroke-dasharray": p.dash ? "7 4" : "none", tabindex: 0, role: "button", "aria-label": p.t[0]});
    r.style.cursor = "pointer"; r.addEventListener("click", () => { stop(); show(p.i); });
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { stop(); show(p.i); } });
    p.t.forEach((tt, j) => { const tx = el("text", {x: x + W / 2, y: y + 30 + j * 18, "text-anchor": "middle", "font-size": 11.5}, tt); tx.style.pointerEvents = "none";
      if (p.fill === "url(#hb)") { tx.setAttribute("stroke", css("--bg")); tx.setAttribute("stroke-width", 4); tx.setAttribute("paint-order", "stroke"); } });
    el("text", {x: x + W / 2, y: y + h + 15, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, p.b + " B");
    if (p.i === 3) p.cx = x + W / 2;
    x += W;
  });
  el("rect", {x: x, y: y, width: 740 - x + 10, height: h, fill: "none", stroke: css("--line"), "stroke-dasharray": "2 3"});
  el("text", {x: (x + 750) / 2, y: y + 40, "text-anchor": "middle", "font-size": 11.5}, `szabad ${1024 - L.used} B`);
  // runlist vagy rezidens magyarázat
  const dx = 10 + 3 * 100 + 50;
  if (!L.resident) {
    el("line", {x1: dx, y1: y + h + 20, x2: dx, y2: 158, stroke: css("--fg"), "stroke-width": 1.5}); el("path", {d: `M ${dx - 5} 150 L ${dx} 159 L ${dx + 5} 150 Z`, fill: css("--fg")});
    el("text", {x: 196, y: 176, "text-anchor": "end", "font-size": 11.5}, "runlist:");
    const cols = ["VCN", "LCN", "hossz"], vals = ["0–" + (L.cl - 1), "x", L.cl + " klaszter"];
    cols.forEach((c, j) => {
      el("rect", {x: 200 + j * 110, y: 160, width: 110, height: 24, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: 255 + j * 110, y: 177, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, c);
      el("rect", {x: 200 + j * 110, y: 184, width: 110, height: 24, fill: css("--cell"), stroke: css("--line")});
      el("text", {x: 255 + j * 110, y: 201, "text-anchor": "middle", "font-size": 12}, vals[j]);
    });
    el("text", {x: 10, y: 236, "font-size": 11.5}, "kötet klaszterei (4 KiB):");
    const n = 40, run = Math.min(20, Math.max(1, Math.round(L.cl / 16)));
    for (let c = 0; c < n; c++) el("rect", {x: 10 + c * 18.5, y: 244, width: 18.5, height: 22, fill: (c >= 8 && c < 8 + run) ? "url(#hb)" : css("--cell"), stroke: css("--line"), "stroke-width": 0.6});
    el("text", {x: 10 + 8 * 18.5, y: 282, "text-anchor": "middle", "font-size": 11}, "x");
    el("text", {x: 10 + (8 + run) * 18.5, y: 282, "text-anchor": "start", "font-size": 11}, `x + ${L.cl - 1}  (${L.cl} × 4 KiB, sematikus hossz)`);
  } else {
    el("text", {x: 10, y: 170, "font-size": 12.5}, `A ${SIZE} B-os tartalom elfér a rekordban: a $DATA rezidens, nincs runlist és nincs klaszterfoglalás.`);
    el("text", {x: 10, y: 192, "font-size": 12.5}, `Rezidens határ ebben a modellben: legfeljebb ${L.limit} B (ADS ${ADS ? "mellett" : "nélkül"}).`);
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
