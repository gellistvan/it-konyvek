<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elveszett frissítés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select id="mode" onchange="pickMode(this.value)" aria-label="Forgatókönyv"><option value="cnt">counter++ (6 lépés)</option><option value="x2">x=2 sorrend (8 lépés)</option><option value="x3">x=3 sorrend (8 lépés)</option><option value="own">saját sorrend</option></select></label><span id="own" style="display:none"><button onclick="ownAdd(1)">P1 következő eseménye</button> <button onclick="ownAdd(2)">P2 következő eseménye</button> <button onclick="ownReset()">Újra</button> <span id="ownmsg" class="small" aria-live="polite"></span></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két szál sávja és köztük a közös memóriacella; lépésenként a load, add és store hatása, az elveszett frissítés áthúzott cellával."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

    el("text", {x: x + cw/2, y: Y.m + 23, "text-anchor": "middle", "font-size": 15}, String(e.mem));
    el("rect", {x: x + 3, y, width: cw - 6, height: h, rx: 6, fill: css("--cell"), stroke: cur ? css("--hl") : css("--line"),
                "stroke-width": cur ? 3 : 1.3, "stroke-dasharray": dash ? "6 3" : "none"});
    el("text", {x: x + cw/2, y: y + h/2 + 4, "text-anchor": "middle", "font-size": n > 6 ? 11 : 10.5}, e.lab);
    const cx = x + cw/2;
    if (e.kind === "L") { if (e.t === 1) arw(cx, Y.m - 2, cx, y + h + 2, false); else arw(cx, Y.m + 38, cx, y - 2, true); }
    if (e.kind === "S") { if (e.t === 1) arw(cx, y + h + 2, cx, Y.m - 2, false); else arw(cx, y - 2, cx, Y.m + 38, true); }
    if (e.lost) {
      el("line", {x1: x + 8, y1: Y.m + 32, x2: x + cw - 8, y2: Y.m + 4, stroke: css("--hl2"), "stroke-width": 2.5});
      el("text", {x: cx, y: e.t === 1 ? Y.m + 52 : Y.m - 6, "text-anchor": "middle", "font-size": 11, "font-style": "italic", fill: css("--hl2")}, "elveszett");
    }
    prev = e.mem;
  });
  const tot = s.mode === "cnt" ? 2 : 4, nl = s.evs.filter(e => e.lost).length;
  const fin = s.evs.length ? s.evs[s.evs.length - 1].mem : 0;
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 12, fill: css("--muted")},
     `folytonos: P1, szaggatott: P2 · aktuális érték: ${fin} · soros eredmény: ${tot} · elveszett store eddig: ${nl}`);
}
// ---- saját sorrend: a programsorrendet a gombok kényszerítik ki ----
let OWN = [];
const PROG = {1: ["L1a", "S1a", "L1b", "S1b"], 2: ["L2a", "S2a", "L2b", "S2b"]};
function simOwn(order){
  const reg = {1: null, 2: null}; let mem = 0; const evs = [];
  const st = [{msg: "Saját sorrend: kezdetben x = 0.", line: -1, n: 8, mode: "x", evs: []}];
  order.forEach((e, i) => {
    const t = +e[1]; let lost = false, lab;
    if (e[0] === "L") { reg[t] = mem; lab = `${e} → ${mem}`; }
    else { const v = reg[t] + 1; lost = v <= mem; mem = v; lab = `${e}(${v})`; }
    evs.push({t, lab, mem, kind: e[0], lost});
    let m = `${i + 1}. lépés: ${lab} · x = ${mem}` + (lost ? " – elveszett frissítés" : "");
    if (i === 7) m += `. Vége: x = ${mem} (soros eredmény 4), elveszett frissítés: ${4 - mem}.`;
    st.push({msg: m, line: e[0] === "L" ? 5 : 6, n: 8, mode: "x", evs: evs.slice()});
  });
  return st;
}
function ownAdd(t){
  const done = OWN.filter(e => +e[1] === t).length;
  if (done >= 4) { document.getElementById("ownmsg").textContent = `P${t} már végrehajtotta mind a négy eseményét.`; return; }
  OWN.push(PROG[t][done]);
  document.getElementById("ownmsg").textContent = "Sorrend: " + OWN.join(", ");
  setSteps(simOwn(OWN)); show(STEPS.length - 1);
}
function ownReset(){ OWN = []; document.getElementById("ownmsg").textContent = "Kattintson P1 vagy P2 következő eseményére."; setSteps(simOwn(OWN)); }
function pickMode(v){
  document.getElementById("own").style.display = v === "own" ? "inline" : "none";
  if (v === "own") ownReset(); else setSteps(MODES[v]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
