<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V-modell és nyomon követhetőség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="orph">árva elem keresése</button> <label><input type="checkbox" id="rm5"> szimuláció: a T-05 teszt hiányzik</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="V-modell: a bal száron HARA, biztonsági cél, követelmények, architektúra, kód; a jobb száron modulteszt, integrációs teszt, rendszerteszt, validáció; a párosított szinteket verifikáló nyilak kötik össze. Kiemelt lánc: V-01, SR-02, safety_task ütemezése, T-02, WCET-01."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fiktív oktatási példa; az azonosítók a 23.4.6 labor mátrixának egységes kiosztását követik (SR-04 → T-05, SR-05 → T-04). A V-02 veszély a fejezetben csak azonosítóként szerepel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sr": null, "line": -1, "msg": "Válassz követelményt (Lépés ▶ vagy kattintás): kiemelődik a veszély, a kód, a teszt és a bizonyíték. Az „árva elem keresése” minden SR-hez tesztet keres."}, {"sr": "SR-01", "line": -1, "msg": "SR-01: 80,0 °C felett a fűtés lekapcsol · veszély V-01 → kód: safety_task, disable_heater → teszt: T-01 → bizonyíték: T-01 jegyzőkönyv, döntési lefedettség"}, {"sr": "SR-02", "line": -1, "msg": "SR-02: a lekapcsolás legfeljebb 100 ms · veszély V-01 → kód: safety_task ütemezése → teszt: T-02 → bizonyíték: WCET-01"}, {"sr": "SR-03", "line": -1, "msg": "SR-03: szenzorhiba esetén fűtés KI · veszély V-01 → kód: sensor_fault → teszt: T-03a, T-03b, T-03c → bizonyíték: SA-01"}, {"sr": "SR-04", "line": -1, "msg": "SR-04: watchdog-lejárat: reset, fűtés KI · veszély V-02 → kód: kick_watchdog, pull-down → teszt: T-05 → bizonyíték: T-05 jegyzőkönyv"}, {"sr": "SR-05", "line": -1, "msg": "SR-05: a PID hibája nem gátolja a védelmet · veszély V-01 → kód: független safety_task → teszt: T-04 → bizonyíték: T-04 jegyzőkönyv"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"left": [["hara", "HARA: V-01 túlmelegedés\n(S2/E3/C2 → ASIL A)", 2.2, 5.0], ["goal", "Biztonsági cél", 2.9, 4.0], ["sr", "Biztonsági követelmények\nSR-01 … SR-05", 3.6, 3.0], ["arch", "Architektúra (safety_task,\nwatchdog, pull-down)", 4.3, 2.0], ["code", "Kód (safety_monitor.c:\nsensor_fault, safety_task)", 5.0, 1.0]], "right": [["unit", "Modulteszt\nT-03a–c", 11.3, 1.0], ["integ", "Integrációs teszt\nT-04, T-05", 12.0, 2.0], ["sys", "Rendszerteszt\nT-01, T-02", 12.7, 3.0], ["valid", "Validáció", 13.4, 4.0]], "pairs": [["code", "unit"], ["arch", "integ"], ["sr", "sys"], ["goal", "valid"]], "reqs": {"SR-01": {"txt": "80,0 °C felett a fűtés lekapcsol", "haz": "V-01", "code": "safety_task, disable_heater", "tests": ["T-01"], "level": {"T-01": "rendszer"}, "ev": ["T-01 jegyzőkönyv", "döntési lefedettség"]}, "SR-02": {"txt": "a lekapcsolás legfeljebb 100 ms", "haz": "V-01", "code": "safety_task ütemezése", "tests": ["T-02"], "level": {"T-02": "rendszer"}, "ev": ["WCET-01"]}, "SR-03": {"txt": "szenzorhiba esetén fűtés KI", "haz": "V-01", "code": "sensor_fault", "tests": ["T-03a", "T-03b", "T-03c"], "level": {"T-03a": "modul", "T-03b": "modul", "T-03c": "modul"}, "ev": ["SA-01"]}, "SR-04": {"txt": "watchdog-lejárat: reset, fűtés KI", "haz": "V-02", "code": "kick_watchdog, pull-down", "tests": ["T-05"], "level": {"T-05": "integráció"}, "ev": ["T-05 jegyzőkönyv"]}, "SR-05": {"txt": "a PID hibája nem gátolja a védelmet", "haz": "V-01", "code": "független safety_task", "tests": ["T-04"], "level": {"T-04": "integráció"}, "ev": ["T-04 jegyzőkönyv"]}}};
let removedT05 = false, orphanMsg = "";
const LV = {"modul": "unit", "integráció": "integ", "rendszer": "sys"};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const defs = el("defs", {}); const m = document.createElementNS(NS, "marker");
  [["id", "va"], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "9"], ["markerHeight", "9"], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d", "M0,0 L10,5 L0,10 z"); mp.setAttribute("fill", line); m.appendChild(mp); defs.appendChild(m);
  const X = x => 10 + x * 44, Y = y => 250 - y * 44, W = 180, H = 36;
  const R = s.sr ? G.reqs[s.sr] : null;
  const act = new Set();
  if (R) { if (R.haz === "V-01") act.add("hara"); act.add("sr"); act.add("arch"); act.add("code");
    R.tests.forEach(t => { if (!(removedT05 && t === "T-05")) act.add(LV[R.level[t]]); }); }
  G.pairs.forEach(([a, b]) => { const A = [...G.left, ...G.right].find(q => q[0] === a), B = [...G.left, ...G.right].find(q => q[0] === b);
    el("line", {x1: X(B[2]) - W / 2, y1: Y(B[3]), x2: X(A[2]) + W / 2 + 4, y2: Y(A[3]), stroke: mut, "stroke-dasharray": "6 4", "marker-end": "url(#va)"}); });
  G.left.slice(1).forEach((b, i) => { const a = G.left[i];
    el("line", {x1: X(a[2]), y1: Y(a[3]) + H / 2, x2: X(b[2]), y2: Y(b[3]) - H / 2 - 2, stroke: line, "stroke-width": 1.4, "marker-end": "url(#va)"}); });
  G.right.slice(1).forEach((b, i) => { const a = G.right[i];
    el("line", {x1: X(a[2]), y1: Y(a[3]) - H / 2, x2: X(b[2]), y2: Y(b[3]) + H / 2 + 2, stroke: line, "stroke-width": 1.4, "marker-end": "url(#va)"}); });
  [...G.left, ...G.right].forEach(([kk, t, x, y]) => { const on = act.has(kk);
    el("rect", {x: X(x) - W / 2, y: Y(y) - H / 2, width: W, height: H, rx: 6, fill: on ? cellhl : cell, stroke: on ? hl : line, "stroke-width": on ? 3.5 : 1.2});
    t.split("\n").forEach((q, i, A) => el("text", {x: X(x), y: Y(y) + 4 + (i - (A.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, q)); });
  // követelménygombok
  Object.keys(G.reqs).forEach((kk, i) => { const on = kk === s.sr, x = 10 + i * 100;
    const r = el("rect", {x, y: 268, width: 92, height: 26, rx: 5, fill: on ? hl : cell, stroke: line, tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": kk + " kiválasztása"});
    const pick = () => { stop(); show(i + 1); };
    r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    el("text", {x: x + 46, y: 286, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold", fill: on ? css("--bg") : css("--fg"), style: "pointer-events:none"}, kk); });
  if (R) {
    const tests = R.tests.filter(t => !(removedT05 && t === "T-05"));
    const chain = [R.haz, s.sr, R.code, tests.length ? tests.join(", ") : "NINCS TESZT", R.ev.join(", ")];
    const head = ["veszély", "követelmény", "kód", "teszt", "bizonyíték"];
    let x = 10;
    chain.forEach((c, i) => { const w = Math.max(76, c.length * 6.6 + 14);
      el("rect", {x, y: 318, width: w, height: 40, rx: 5, fill: (i === 3 && !tests.length) ? hl2 : cellhl, stroke: hl, "stroke-width": 2});
      el("text", {x: x + 6, y: 332, "font-size": 10, fill: mut}, head[i]);
      el("text", {x: x + 6, y: 350, "font-size": 11.5, "font-weight": "bold"}, c);
      if (i < chain.length - 1) el("text", {x: x + w + 2, y: 344, "font-size": 14}, "→");
      x += w + 16; });
  }
  if (orphanMsg) el("text", {x: 10, y: 388, "font-size": 12, "font-weight": "bold", fill: orphanMsg.startsWith("Nincs") ? hl : hl2}, orphanMsg);
}
document.getElementById("orph").addEventListener("click", () => { stop();
  const bad = Object.entries(G.reqs).filter(([kk, r]) => !r.tests.filter(t => !(removedT05 && t === "T-05")).length).map(([kk]) => kk);
  orphanMsg = bad.length ? "Árva követelmény (nincs teszt): " + bad.join(", ") : "Nincs árva elem: minden SR-hez tartozik legalább egy teszt.";
  render(STEPS[k]); status.textContent = orphanMsg; });
document.getElementById("rm5").addEventListener("change", e => { stop(); removedT05 = e.target.checked; orphanMsg = "";
  render(STEPS[k]); status.textContent = removedT05 ? "Szimuláció: a T-05 watchdog-tesztet töröltük – futtasd az árva-keresést." : "A T-05 visszaállítva."; });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
