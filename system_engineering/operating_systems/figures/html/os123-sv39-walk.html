<style>

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}

#status{margin:4px 0 6px;min-height:2.9em}

svg{width:100%;height:auto;display:block}

.small{font-size:12px;color:var(--muted)}

": "UART 0x10000000: új PMD (gyökér[0]) + új PTE-tábla → 68 lap"}];
function parseVA(){ const r = document.getElementById("va").value.trim(); try { return BigInt(r.match(/^0x/i) ? r : "0x" + r); } catch(e){ return null; } }
function mkWalk(){
  const va = parseVA(); if (va === null){ document.getElementById("status").textContent = "Érvénytelen cím."; return; }
  const v = [0, 1, 2].map(i => Number((va >> BigInt(12 + 9 * i)) & 511n)), off = Number(va & 0xFFFn), n = Number(va);
  const inRam = va >= 0x80000000n && va < 0x88000000n, inUart = va >= 0x10000000n && va < 0x10001000n, ok = inRam || inUart;
  const pmdOk = (v[2] === 2) || (v[2] === 0 && v[1] === 0x80), hx = x => "0x" + x.toString(16).toUpperCase();
  const ppn = va >> 12n, fl = inUart ? "V|R|W|A|D" : (va < 0x80002000n ? "V|R|X|A|D (kernel text)" : "V|R|W|A|D (a szakasz jogai szerint)");
  setSteps([
    {mode: "walk", va: n, v, off, ph: 0, line: 0, msg: `1. felbontás: VPN[2] = ${v[2]}, VPN[1] = ${v[1]}, VPN[0] = ${v[0]}, offset = 0x${off.toString(16).toUpperCase()}.`},
    {mode: "walk", va: n, v, off, ph: 1, line: pmdOk ? 2 : 4, msg: pmdOk ? `2. gyökér[${v[2]}]: nem levél PTE → PMD.` : `2. gyökér[${v[2]}]: V = 0 – a vm_init nem képezte le; vm_map itt új táblát foglalna.`},
    {mode: "walk", va: n, v, off, ph: 2, line: ok ? 6 : 4, msg: ok ? `3. PMD[${v[1]}]: nem levél PTE → PTE-tábla.` : `3. PMD[${v[1]}]: nincs (V = 0) – új tábla foglalva lenne.`},
    {mode: "walk", va: n, v, off, ph: 3, line: 7, msg: `4. PTE-tábla[${v[0]}]: ${ok ? "a levélbejegyzés" : "nincs leképezve"}.`},
    {mode: "walk", va: n, v, off, ph: 4, line: 8, msg: ok ? `5. levél: PPN = ${hx(ppn)}, flagek ${fl} → fizikai cím ${hx(va)}.` : "5. a cím nincs leképezve: hozzáféréskor laphiba."}]);
}
function render(s){

    el("text", {x: 20, y: 30, "font-size": 14, "font-weight": "bold"}, "Laptábla-lapok a teljes direct mapnél: " + s.n);
    for (let i = 0; i < 64; i++){ const x = 20 + (i % 16) * 44, y = 60 + Math.floor(i / 16) * 44, on = i <= s.region;
      el("rect", {x, y, width: 38, height: 38, fill: on ? css("--cellhl") : cell, stroke: i === s.region ? hl : line, "stroke-width": i === s.region ? 3 : 1});
      el("text", {x: x + 19, y: y + 24, "text-anchor": "middle", "font-size": 10.5, fill: on ? css("--fg") : mut}, "PTE " + i); }

    el("text", {x: 20, y: 286, "font-size": 12.5, "font-weight": "bold", fill: hl}, "1 + 1 + 64 + 1 + 1 = 68" + (s.n === 68 ? "  ✓" : ""));
    return;
  }
  const v = s.v || [1, 0, 2], va = s.va;
  const F = [["VPN[2]", v[2]], ["VPN[1]", v[1]], ["VPN[0]", v[0]], ["offset", "0x" + (s.off !== undefined ? s.off : 0).toString(16).toUpperCase()]];

  F.forEach(([n, val], i) => { const x = 20 + i * 150, on = (s.ph === 0) || (s.ph === 1 && i === 0) || (s.ph === 2 && i === 1) || (s.ph === 3 && i === 2) || (s.ph === 4 && i === 3);

// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
