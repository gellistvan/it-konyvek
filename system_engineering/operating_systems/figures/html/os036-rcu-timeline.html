<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCU idővonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>R1 kilépése: <input id="r1x" type="range" min="2.5" max="7.5" step="0.5" value="5" oninput="upd()" aria-label="R1 kilépési ideje"> <span id="r1v">5</span></label> <label><input id="bad" type="checkbox" onchange="upd()"> BAD_FREE (azonnali kfree)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal négy CPU-val: R1 olvasói szakasza a régi B-t láthatja, az író kicsatolja B-t, majd a grace period végén, R1 kilépése után felszabadítja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető idők, nem mérés. A grace period vége a t4 utáni legkésőbbi quiescent state + 1 egység (az észlelés késése). Ha R1 a t4 előtt kilép, a grace period a többi CPU QS-ét várja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "A lista: head → A → B → C; az író B-t törli. Lépjen az eseményeken.", "t": 0.5, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": -1}, {"msg": "1,0: R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat", "t": 1.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": -1, "key": "t1"}, {"msg": "2,0: az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak", "t": 2.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": 2, "key": "t2"}, {"msg": "3,0: R2 belép (CPU2): már A → C-t lát, B-t soha", "t": 3.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": -1, "key": "t3"}, {"msg": "4,0: az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja", "t": 4.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": 3, "key": "t4"}, {"msg": "4,5: CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben", "t": 4.5, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": 3, "key": "qs"}, {"msg": "5,0: R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state", "t": 5.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": 3, "key": "t5"}, {"msg": "6,0: a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el", "t": 6.0, "m": {"r1_exit": 5.0, "gp_end": 6.0, "t_free": 6.0, "bad": false, "uaf": false, "ev": [[1.0, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"], [2.0, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"], [3.0, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"], [4.0, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"], [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"], [5.0, "t5", "R1 kilép (rcu_read_unlock, 5,0): CPU1 quiescent state"], [6.0, "t6", "a grace period vége (6,0): kfree(B) – B-t már senki sem érheti el"]]}, "line": 4, "key": "t6"}];
const CODE = ["/* írói oldal: elem törlése (10.3.2.1) */", "prev = A;  p = B;", "rcu_assign_pointer(prev->next, p->next);   /* t2: kicsatolás */", "synchronize_rcu();                         /* t4 … t6: grace period */", "kfree(p);                                  /* t6 (BAD_FREE: azonnal) */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const QS = {CPU2: 4.2, CPU3: 4.5};
function fmt(x){ return (Math.round(x * 10) / 10).toString().replace(".", ","); }
function model(r1, bad){
  const gp = Math.max(r1, QS.CPU2, QS.CPU3) + 1, tf = bad ? 2.3 : gp;
  const ev = [[1, "t1", "R1 belép (CPU1, rcu_read_lock), A->next = B: R1 a B-re mutat"],
              [2, "t2", "az író rcu_assign_pointer(A->next, C): B kicsatolva; az új olvasók A → C-t látnak"]];
  if (bad) ev.push([tf, "bad", "BAD_FREE: kfree(B) azonnal – R1 még a szakaszában van: use-after-free!"]);
  ev.push([3, "t3", "R2 belép (CPU2): már A → C-t lát, B-t soha"],
          [4, "t4", "az író synchronize_rcu(): a grace period indul, minden CPU egy quiescent state-jét várja"],
          [4.5, "qs", "CPU2 (idle, 4,2) és CPU3 (kontextusváltás, 4,5) quiescent state-ben"],
          [r1, "t5", `R1 kilép (rcu_read_unlock, ${fmt(r1)}): CPU1 quiescent state`]);
  if (!bad) ev.push([gp, "t6", `a grace period vége (${fmt(gp)}): kfree(B) – B-t már senki sem érheti el`]);
  ev.sort((a, b) => a[0] - b[0]);
  return {r1_exit: r1, gp_end: gp, t_free: tf, bad, uaf: bad && tf < r1, ev};
}
function steps(m){
  const line = {t1: -1, t2: 2, bad: 4, t3: -1, t4: 3, qs: 3, t5: 3, t6: 4};
  return [{msg: "A lista: head → A → B → C; az író B-t törli. Lépjen az eseményeken.", t: 0.5, m, line: -1}]
    .concat(m.ev.map(([t, key, msg]) => ({msg: `${fmt(t)}: ${msg}`, t, m, line: line[key], key})));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const m = s.m, X0 = 100, XW = 440, T1 = 9, sx = t => X0 + XW * t / T1, Y = [50, 100, 150, 200];
  const names = ["CPU0 (író)", "CPU1 (R1)", "CPU2 (R2)", "CPU3"];
  if (!m.bad) el("rect", {x: sx(4), y: 30, width: sx(m.gp_end) - sx(4), height: 190, fill: css("--cellhl"), opacity: 0.6});
  if (!m.bad) el("text", {x: (sx(4) + sx(m.gp_end)) / 2, y: 26, "text-anchor": "middle", "font-size": 12}, "grace period");
  names.forEach((n, i) => { el("text", {x: 6, y: Y[i] + 5, "font-size": 12}, n); el("line", {x1: X0, y1: Y[i], x2: X0 + XW, y2: Y[i], stroke: css("--muted"), "stroke-width": 0.6}); });
  const vis = t => t <= s.t + 1e-9;
  const seg = (y, a, b, dots, bad) => { if (!vis(a)) return; const bb = Math.min(b, s.t);
    el("rect", {x: sx(a), y: y - 10, width: Math.max(2, sx(bb) - sx(a)), height: 20, fill: css("--cell"), stroke: bad ? css("--hl2") : css("--line"), "stroke-width": 2.5, "stroke-dasharray": dots ? "2 2" : "none"}); };
  seg(Y[1], 1, m.r1_exit, true, m.uaf); seg(Y[2], 3, 3.8, false, false);
  if (vis(1)) el("text", {x: sx(1) + 4, y: Y[1] + 26, "font-size": 11}, "R1: B-t láthatja");
  if (vis(3)) el("text", {x: sx(3), y: Y[2] - 14, "font-size": 11}, "R2: A → C");
  const dot = (t, y, txt, below) => { if (!vis(t)) return; el("circle", {cx: sx(t), cy: y, r: 5, fill: css("--line")}); el("text", {x: sx(t), y: below ? y + 22 : y - 12, "text-anchor": "middle", "font-size": 11}, txt); };
  dot(2, Y[0], "kicsatol"); dot(4, Y[0], "sync_rcu"); dot(m.t_free, Y[0], "kfree(B)", m.bad);
  const dia = (t, y) => { if (!vis(t)) return; el("polygon", {points: `${sx(t)},${y-8} ${sx(t)+7},${y} ${sx(t)},${y+8} ${sx(t)-7},${y}`, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5}); };
  if (vis(4.5)) { dia(QS.CPU2, Y[2]); dia(QS.CPU3, Y[3]); }
  dia(m.r1_exit, Y[1]);
  if (m.uaf && vis(m.t_free)) { el("line", {x1: sx(m.t_free), y1: 30, x2: sx(m.t_free), y2: 220, stroke: css("--hl2"), "stroke-width": 2}); el("text", {x: sx(m.t_free) + 6, y: Y[1] + 42, "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "use-after-free (R1)"); }
  for (let t = 0; t <= T1; t++) el("text", {x: sx(t), y: 238, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t));
  el("line", {x1: sx(s.t), y1: 30, x2: sx(s.t), y2: 225, stroke: css("--hl"), "stroke-width": 1.5, "stroke-dasharray": "4 3"});
  const unl = s.t >= 2, freed = s.t >= m.t_free;
  el("text", {x: 6, y: 272, "font-size": 13}, "lista: " + (unl ? "head → A → C" : "head → A → B → C") + (unl ? (freed ? " · B felszabadítva" : " · B kicsatolva, még él") : ""));
  el("text", {x: 6, y: 292, "font-size": 11, fill: css("--muted")}, "pontozott sáv: a régi B-t láthatja · rombusz: quiescent state · szemléltető idők");
}
function upd(){
  const r1 = +document.getElementById("r1x").value, bad = document.getElementById("bad").checked;
  document.getElementById("r1v").textContent = fmt(r1);
  const cur = k; setSteps(steps(model(r1, bad))); show(Math.min(cur, STEPS.length - 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
