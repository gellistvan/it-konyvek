<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy-allokátor 64 KiB-os arénán</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Műveletsor: <input id="ops" size="30" value="a4 a4 a8 f0 f4 f8" aria-label="Saját műveletsor: a méret = alloc KiB-ban, f offset = free KiB-ban"></label><button onclick="load()">Betöltés</button><span class="small">a4 = alloc(4K), f8 = free(a 8K offsetű blokk)</span><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Order 4-től order 0-ig sávos blokkfa a 64 KiB-os arénán, alatta az öt szabadlista és az invariánsok."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 3.1 kézi példája (MIN_BLOCK_SIZE = 4 KiB, MAX_ORDER = 4); a foglalás a T-O5-050 szerint javított buddy_alloc, a felszabadítás a fejezet buddy_free-je. Offsetek az arénaalaphoz viszonyítva, KiB-ban.</p>

, 32K) szabad → összevonás", "buddy": [16, 2], "hot": [0, 2], "final": false, "blocks": [[0, 2, true], [16, 2, true], [32, 3, true]], "fl": {"0": [], "1": [], "2": [16], "3": [32], "4": []}, "inv": [true, true, true, false]}, {"op": 6, "line": 10, "msg": "6. free([8K, 16K)): összevonva → [0K, 32K) (order 3).", "buddy": null, "hot": [0, 3], "final": false, "blocks": [[0, 3, true], [32, 3, true]], "fl": {"0": [], "1": [], "2": [], "3": [32], "4": []}, "inv": [true, true, true, false]}, {"op": 6, "line": 8, "msg": "6. free([8K, 16K)): order 3: buddy = 0K XOR 32K = 32K [32K, 64K) szabad → összevonás", "buddy": [32, 3], "hot": [0, 3], "final": false, "blocks": [[0, 3, true], [32, 3, true]], "fl": {"0": [], "1": [], "2": [], "3": [32], "4": []}, "inv": [true, true, true, false]}, {"op": 6, "line": 10, "msg": "6. free([8K, 16K)): összevonva → [0K, 64K) (order 4).", "buddy": null, "hot": [0, 4], "final": false, "blocks": [[0, 4, true]], "fl": {"0": [], "1": [], "2": [], "3": [], "4": []}, "inv": [true, true, true, false]}, {"op": 6, "line": 11, "msg": "6. free([8K, 16K)): 3 összevonás; [0K, 64K) az order 4 listára. ", "buddy": null, "hot": [0, 4], "final": true, "blocks": [[0, 4, true]], "fl": {"0": [], "1": [], "2": [], "3": [], "4": [0]}, "inv": [true, true, true, true]}];

const NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("v");

function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;

const MIN = 4, MAXO = 4;
function rng(off, o){ return `[${off}K, ${off + (MIN << o)}K)`; }
function inv(blocks, fl){
  const has = off => blocks.has(off);
  let i1 = true; for (let o = 0; o <= MAXO; o++) for (const off of fl[o]) if (!has(off) || blocks.get(off)[0] !== o || !blocks.get(off)[1]) i1 = false;
  const all = []; for (let o = 0; o <= MAXO; o++) all.push(...fl[o]);
  const i2 = new Set(all).size === all.length;
  let i3 = true; for (let o = 0; o < MAXO; o++) for (const off of fl[o]) if (fl[o].includes(off ^ (MIN << o))) i3 = false;
  let pos = 0, ok = true; [...blocks.keys()].sort((a, b) => a - b).forEach(off => { ok = ok && off === pos; pos = off + (MIN << blocks.get(off)[0]); });
  let fsum = 0, lsum = 0; blocks.forEach((v, off) => { if (v[1]) fsum += MIN << v[0]; }); all.forEach(off => { if (has(off)) lsum += MIN << blocks.get(off)[0]; });

function runOps(ops){
  const blocks = new Map([[0, [MAXO, true]]]), fl = {}; for (let o = 0; o <= MAXO; o++) fl[o] = []; fl[MAXO] = [0];
  const st = [];
  const snap = (op, line, msg, buddy, hot, fin) => { const b = [...blocks.entries()].sort((x, y) => x[0] - y[0]).map(([off, v]) => [off, v[0], v[1]]);
    const f = {}; for (let o = 0; o <= MAXO; o++) f[o] = fl[o].slice(); st.push({op, line, msg, buddy: buddy || null, hot: hot || null, "final": !!fin, blocks: b, fl: f, inv: inv(blocks, fl)}); };
  snap(-1, -1, "Kezdet: egyetlen szabad order-4 blokk, order 4: [0K, 64K).", null, null, true);
  ops.forEach(([kind, x], j) => { const n = j + 1;
    if (kind === "a") {
      let order = 0; while ((1 << order) < Math.ceil(x / MIN)) order++;
      let o = order; while (o <= MAXO && !fl[o].length) o++;
      if (o > MAXO) { snap(n, 2, `${n}. alloc(${x}K): nincs elég nagy szabad blokk → NULL.`, null, null, true); return; }
      const b = fl[o].shift();
      snap(n, 3, `${n}. alloc(${x}K): order ${order}; a legkisebb nem üres lista order ${o} → kivesszük ${rng(b, o)}.`, null, [b, o]);
      while (o > order) { o--; const half = b + (MIN << o); blocks.set(b, [o, true]); blocks.set(half, [o, true]); fl[o].unshift(half);
        snap(n, 4, `${n}. alloc(${x}K): vágás → az alsó ${rng(b, o)} marad, a felső ${rng(half, o)} az order ${o} listára.`, null, [b, o]); }
      blocks.set(b, [order, false]);
      snap(n, 5, `${n}. alloc(${x}K) → ${rng(b, order)} kiosztva.`, null, [b, order], true);
    } else {
      let b = x;
      if (!blocks.has(b) || blocks.get(b)[1]) { snap(n, 6, `${n}. free(${x}K): érvénytelen vagy már szabad blokk – kihagyva.`, null, null, true); return; }
      let order = blocks.get(b)[0]; const start = rng(b, order); blocks.set(b, [order, true]); let merges = 0;
      while (order < MAXO) {
        const bo = b ^ (MIN << order), ok = blocks.has(bo) && blocks.get(bo)[1] && blocks.get(bo)[0] === order && fl[order].includes(bo);
        const note = `buddy = ${b}K XOR ${MIN << order}K = ${bo}K ${rng(bo, order)} ` + (ok ? "szabad" : "foglalt/nem azonos order");
        snap(n, ok ? 8 : 9, `${n}. free(${start}): order ${order}: ${note}` + (ok ? " → összevonás" : " → nincs (több) összevonás"), [bo, order], [b, order]);

        fl[order].splice(fl[order].indexOf(bo), 1); blocks.delete(Math.max(b, bo)); b = Math.min(b, bo); order++; blocks.set(b, [order, true]); merges++;
        snap(n, 10, `${n}. free(${start}): összevonva → ${rng(b, order)} (order ${order}).`, null, [b, order]);
      }

}
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1.2"/></pattern>`;
  const X = 40, U = 22, rowY = o => 20 + (MAXO - o) * 34;

    internal.forEach(k => { const [off, oo] = k.split(":").map(Number); if (oo === o) el("rect", {x: X + off / 4 * U, y, width: (MIN << o) / 4 * U, height: 28, fill: "none", stroke: css("--muted"), "stroke-width": 0.8, "stroke-dasharray": "2 2"}); });

}
function load(){
  const toks = document.getElementById("ops").value.split(/[ ,;]+/).filter(x => x !== ""), err = document.getElementById("err"), ops = [];
  for (const t of toks) { const m = /^(a|alloc|f|free)\(?(\d+)K?\)?$/i.exec(t); if (!m) { err.textContent = "Formátum: a4 a4 a8 f0 f4 f8 (a = alloc KiB, f = free offset KiB)."; return; }
    ops.push([m[1][0].toLowerCase(), +m[2]]); }
  if (!ops.length || ops.length > 16) { err.textContent = "1–16 műveletet adjon meg."; return; }
  err.textContent = ""; setSteps(runOps(ops));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
