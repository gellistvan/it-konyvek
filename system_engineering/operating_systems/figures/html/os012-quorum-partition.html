<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quorum, split-brain és fencing</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Csomópontok: <select id="nn" onchange="setN()"><option>2</option><option selected>3</option><option>5</option></select></label><button onclick="EXTRACUT=null;show(k)">Kézi vágás törlése</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A partíció után csak a kétcsomópontos oldal választhat vezetőt; a magára maradt régi vezetőt fencing állítja le."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Crash-stop hibamodell, többségi quorum (⌊n/2⌋ + 1), fencing a közös erőforráson. Kézi vágásnál minden összefüggő oldal maga számolja a quorumot; a vezető a quorumos oldal (lehetőleg a régi vezető).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cut": [], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "1/5 – Ép hálózat: 3 csomópont, quorum = ⌊3/2⌋ + 1 = 2; vezető: node0, csak ő ír a közös tárolóra.", "n": 3, "line": -1}, {"cut": [0], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "2/5 – Partíció: {node0} | {node1, node2}; oldalak mérete 1 és 2, quorum 2. node0 még nem tudja, hogy elszigetelődött.", "n": 3, "line": -1}, {"cut": [0], "leader": [1], "stale": [0], "fenced": [], "writer": [0, 1], "msg": "3/5 – Választás: a {node1, node2} oldalon 2 ≥ 2 → vezető: node1; a másik oldalon 1 < 2 → nincs quorum, de a régi vezető (stale) még írhatna – veszély!", "n": 3, "line": -1}, {"cut": [0], "leader": [1], "stale": [], "fenced": [0], "writer": [1], "msg": "4/5 – Fencing: a kisebbségi oldal (node0) leállítva/elszigetelve; a közös tárolóra csak node1 írhat.", "n": 3, "line": -1}, {"cut": [], "leader": [1], "stale": [], "fenced": [], "writer": [1], "msg": "5/5 – Helyreállás: a hálózat ép, node0 újraindul és követőként csatlakozik; vezető: node1.", "n": 3, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = {2: [{"cut": [], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "1/5 – Ép hálózat: 2 csomópont, quorum = ⌊2/2⌋ + 1 = 2; vezető: node0, csak ő ír a közös tárolóra.", "n": 2, "line": -1}, {"cut": [0], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "2/5 – Partíció: {node0} | {node1}; oldalak mérete 1 és 1, quorum 2. node0 még nem tudja, hogy elszigetelődött.", "n": 2, "line": -1}, {"cut": [0], "leader": [], "stale": [0], "fenced": [], "writer": [], "msg": "3/5 – Választás: mindkét oldalon 1 < 2 → egyik oldalnak sincs quoruma; a szolgáltatás leáll (quorum nélkül mindkettő írna → split-brain).", "n": 2, "line": -1}, {"cut": [0], "leader": [], "stale": [], "fenced": [0], "writer": [], "msg": "4/5 – A régi vezető fencinggel leállítva; új vezető sincs: a szolgáltatás a helyreállásig áll.", "n": 2, "line": -1}, {"cut": [], "leader": [1], "stale": [], "fenced": [], "writer": [1], "msg": "5/5 – Helyreállás: a két csomópont újra látja egymást (2 ≥ 2), új vezető választható.", "n": 2, "line": -1}], 3: [{"cut": [], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "1/5 – Ép hálózat: 3 csomópont, quorum = ⌊3/2⌋ + 1 = 2; vezető: node0, csak ő ír a közös tárolóra.", "n": 3, "line": -1}, {"cut": [0], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "2/5 – Partíció: {node0} | {node1, node2}; oldalak mérete 1 és 2, quorum 2. node0 még nem tudja, hogy elszigetelődött.", "n": 3, "line": -1}, {"cut": [0], "leader": [1], "stale": [0], "fenced": [], "writer": [0, 1], "msg": "3/5 – Választás: a {node1, node2} oldalon 2 ≥ 2 → vezető: node1; a másik oldalon 1 < 2 → nincs quorum, de a régi vezető (stale) még írhatna – veszély!", "n": 3, "line": -1}, {"cut": [0], "leader": [1], "stale": [], "fenced": [0], "writer": [1], "msg": "4/5 – Fencing: a kisebbségi oldal (node0) leállítva/elszigetelve; a közös tárolóra csak node1 írhat.", "n": 3, "line": -1}, {"cut": [], "leader": [1], "stale": [], "fenced": [], "writer": [1], "msg": "5/5 – Helyreállás: a hálózat ép, node0 újraindul és követőként csatlakozik; vezető: node1.", "n": 3, "line": -1}], 5: [{"cut": [], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "1/5 – Ép hálózat: 5 csomópont, quorum = ⌊5/2⌋ + 1 = 3; vezető: node0, csak ő ír a közös tárolóra.", "n": 5, "line": -1}, {"cut": [0, 1], "leader": [0], "stale": [], "fenced": [], "writer": [0], "msg": "2/5 – Partíció: {node0, node1} | {node2, node3, node4}; oldalak mérete 2 és 3, quorum 3. node0 még nem tudja, hogy elszigetelődött.", "n": 5, "line": -1}, {"cut": [0, 1], "leader": [2], "stale": [0], "fenced": [], "writer": [0, 2], "msg": "3/5 – Választás: a {node2, node3, node4} oldalon 3 ≥ 3 → vezető: node2; a másik oldalon 2 < 3 → nincs quorum, de a régi vezető (stale) még írhatna – veszély!", "n": 5, "line": -1}, {"cut": [0, 1], "leader": [2], "stale": [], "fenced": [0, 1], "writer": [2], "msg": "4/5 – Fencing: a kisebbségi oldal (node0) leállítva/elszigetelve; a közös tárolóra csak node2 írhat.", "n": 5, "line": -1}, {"cut": [], "leader": [2], "stale": [], "fenced": [], "writer": [2], "msg": "5/5 – Helyreállás: a hálózat ép, node0 újraindul és követőként csatlakozik; vezető: node2.", "n": 5, "line": -1}]};
let N = 3, EXTRACUT = null;     // EXTRACUT: kézi vágás (élhalmaz), null = a forgatókönyv vágása
function q(n){ return Math.floor(n / 2) + 1; }
function nodePos(n){ const P = []; for (let i = 0; i < n; i++) { const a = -Math.PI / 2 + 2 * Math.PI * i / n; P.push([300 + 130 * Math.cos(a), 152 + 92 * Math.sin(a)]); } return P; }
function keyE(a, b){ return a < b ? a + "-" + b : b + "-" + a; }
function cutEdges(s){ const E = new Set(); for (let a = 0; a < s.n; a++) for (let b = a + 1; b < s.n; b++) if (s.cut.includes(a) !== s.cut.includes(b)) E.add(keyE(a, b)); return E; }
function comps(n, E){ const c = Array(n).fill(-1); let k = 0;
  for (let i = 0; i < n; i++) { if (c[i] >= 0) continue; const st = [i]; c[i] = k;
    while (st.length) { const u = st.pop(); for (let v = 0; v < n; v++) if (c[v] < 0 && !E.has(keyE(u, v)) && u !== v) { c[v] = k; st.push(v); } } k++; }
  return c; }
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), cellhl = css("--cellhl"), hl = css("--hl"), mut = css("--muted"), w2 = css("--hl2");
  const n = s.n, P = nodePos(n), E = EXTRACUT || cutEdges(s);
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
    const cut = E.has(keyE(a, b));
    const ln = el("line", {x1: P[a][0], y1: P[a][1], x2: P[b][0], y2: P[b][1], stroke: cut ? mut : line, "stroke-width": cut ? 1.5 : 2.5,
                           "stroke-dasharray": cut ? "2 4" : "none", style: "cursor:pointer"});
    ln.addEventListener("click", () => { const e = new Set(EXTRACUT || cutEdges(s)); const kk = keyE(a, b); e.has(kk) ? e.delete(kk) : e.add(kk); EXTRACUT = e; show(k); });
  }
  let leader = s.leader, stale = s.stale, fenced = s.fenced, writer = s.writer;
  const C = comps(n, E), sizes = {};
  C.forEach(c => sizes[c] = (sizes[c] || 0) + 1);
  let info;
  if (EXTRACUT) {   // szabad mód: minden komponens maga dönt
    leader = []; stale = []; fenced = []; writer = [];
    Object.keys(sizes).forEach(c => { const mem = C.map((x, i) => x == c ? i : -1).filter(i => i >= 0);
      if (sizes[c] >= q(n)) { leader.push(mem.includes(0) ? 0 : mem[0]); writer.push(leader[leader.length - 1]); } });
    info = Object.keys(sizes).map(c => `${sizes[c]} ${sizes[c] >= q(n) ? "≥" : "<"} ${q(n)}`).join(" | ");
    status.textContent = `Kézi vágás: oldalak mérete / quorum: ${info}; vezető: ${leader.length ? leader.map(i => "node" + i).join(", ") : "nincs"}; ` +
      (leader.length ? "csak a quorumos oldal írhat" : "egyik oldal sem írhat – a szolgáltatás áll") + ". (Két többség nem lehet.)";
  }
  P.forEach((p, i) => {
    const isL = leader.includes(i), isS = stale.includes(i), isF = fenced.includes(i);
    el("circle", {cx: p[0], cy: p[1], r: 30, fill: isF ? cellhl : cell, stroke: isS ? w2 : line, "stroke-width": isL || isS ? 5 : 1.5, "stroke-dasharray": isS ? "6 3" : "none"});
    el("text", {x: p[0], y: p[1] + 5, "text-anchor": "middle", "font-size": 13, "font-weight": isL ? "bold" : "normal"}, "node" + i);
    if (isF) { el("line", {x1: p[0] - 22, y1: p[1] - 22, x2: p[0] + 22, y2: p[1] + 22, stroke: line, "stroke-width": 2.5});
               el("line", {x1: p[0] - 22, y1: p[1] + 22, x2: p[0] + 22, y2: p[1] - 22, stroke: line, "stroke-width": 2.5});
               el("text", {x: p[0], y: p[1] - 36, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "fenced"); }
    if (isL) el("text", {x: p[0], y: p[1] - 36, "text-anchor": "middle", "font-size": 11, fill: hl, "font-weight": "bold"}, "vezető");
    if (isS) el("text", {x: p[0], y: p[1] - 36, "text-anchor": "middle", "font-size": 11, fill: w2, "font-weight": "bold"}, "stale vezető");
  });
  el("rect", {x: 255, y: 262, width: 90, height: 36, rx: 6, fill: cell, stroke: line});
  el("text", {x: 300, y: 285, "text-anchor": "middle", "font-size": 11}, "közös tároló");
  writer.forEach(w => { if (fenced.includes(w)) return; const p = P[w];
    el("line", {x1: p[0] + (300 - p[0]) * 0.13, y1: p[1] + 28, x2: 300, y2: 262, stroke: stale.includes(w) ? w2 : hl, "stroke-width": 2, "stroke-dasharray": stale.includes(w) ? "5 3" : "none"}); });
  el("text", {x: 10, y: 20, "font-size": 12}, `n = ${n}, quorum = ⌊${n}/2⌋ + 1 = ${q(n)}`);
  el("text", {x: 10, y: 320, "font-size": 10, fill: mut}, "kattints egy linkre a kézi vágáshoz · vastag = vezető · szaggatott narancs = stale · áthúzott = fenced");
}
function setN(){ N = +document.getElementById("nn").value; EXTRACUT = null; setSteps(SC[N]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
