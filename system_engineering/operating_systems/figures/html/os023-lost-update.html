<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elveszett frissítések load/store mellett</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Változat: <select id="mode" onchange="reload()"><option value="ls">load/store + barrier</option><option value="fa">fetch_add</option><option value="nb">barrier nélkül (sematikus)</option></select></label><label>Iterációk: <input id="nit" type="range" min="1" max="1000" value="2" oninput="reload()" aria-label="Iterációszám"> <span id="nitv">2</span></label><button onclick="show(STEPS.length - 1)">Ugrás a végére</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A shared_counter cella és három szál; lépésenként az atomi load és store, illetve a fetch_add nyilai, a felülírt store-ok áthúzva, számlálóval."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">3 szál, barrier minden iteráció két pontján, seq_cst load/store (7.2.12). Helyben futtatva: thread_lost_update → 1000 / lost 2000, thread_atomic → 3000. A „barrier nélkül” mód egy rögzített seedű, lehetséges átfedést mutat (sematikus, nem mérés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "ls", "it": 0, "n": 2, "ph": "init", "c": 0, "lost": 0, "line": 0, "ev": [], "msg": "Kezdet: shared_counter = 0, 3 szál × 2 iteráció."}, {"mode": "ls", "it": 1, "n": 2, "ph": "load", "c": 0, "lost": 0, "line": 1, "ev": [["L", 0, 0, false], ["L", 1, 0, false], ["L", 2, 0, false]], "msg": "1. iteráció: T1, T2, T3 atomic_load → 0, 0, 0; barrier: mindhárom ugyanazt az értéket látta."}, {"mode": "ls", "it": 1, "n": 2, "ph": "store", "c": 1, "lost": 2, "line": 3, "ev": [["S", 0, 1, false], ["S", 1, 1, true], ["S", 2, 1, true]], "msg": "1. iteráció: mindhárom atomic_store(1); a második és harmadik store felülírja ugyanazt → counter = 1, elveszett: 2 (+2)."}, {"mode": "ls", "it": 2, "n": 2, "ph": "load", "c": 1, "lost": 2, "line": 1, "ev": [["L", 0, 1, false], ["L", 1, 1, false], ["L", 2, 1, false]], "msg": "2. iteráció: T1, T2, T3 atomic_load → 1, 1, 1; barrier: mindhárom ugyanazt az értéket látta."}, {"mode": "ls", "it": 2, "n": 2, "ph": "store", "c": 2, "lost": 4, "line": 3, "ev": [["S", 0, 2, false], ["S", 1, 2, true], ["S", 2, 2, true]], "msg": "2. iteráció: mindhárom atomic_store(2); a második és harmadik store felülírja ugyanazt → counter = 2, elveszett: 4 (+2)."}];
const CODE = ["for (int i = 0; i < ITERATIONS; i++) {", "    int old = atomic_load_explicit(&shared_counter, memory_order_seq_cst);", "    pthread_barrier_wait(&barrier);      /* mindhárom szál olvasott */", "    atomic_store_explicit(&shared_counter, old + 1, memory_order_seq_cst);", "    pthread_barrier_wait(&barrier);      /* mindhárom szál írt */", "}", "/* 1. program (thread_atomic.c): */ atomic_fetch_add_explicit(&shared_counter, 1, memory_order_relaxed);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function simJS(mode, n){
  let c = 0, lost = 0, seed = 12345;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const st = [{mode, it: 0, n, ph: "init", c: 0, lost: 0, line: 0, ev: [], msg: "Kezdet: shared_counter = 0, 3 szál × " + n + " iteráció."}];
  for (let it = 1; it <= n; it++) {
    if (mode === "ls") {
      const old = c;
      st.push({mode, it, n, ph: "load", c, lost, line: 1, ev: [0,1,2].map(t => ["L", t, old, false]),
        msg: it + ". iteráció: T1, T2, T3 atomic_load → " + old + ", " + old + ", " + old + "; barrier: mindhárom ugyanazt az értéket látta."});
      c = old + 1; lost += 2;
      st.push({mode, it, n, ph: "store", c, lost, line: 3, ev: [0,1,2].map(t => ["S", t, old + 1, t > 0]),
        msg: it + ". iteráció: mindhárom atomic_store(" + (old + 1) + "); a második és harmadik store felülírja ugyanazt → counter = " + c + ", elveszett: " + lost + " (+2)."});
    } else if (mode === "fa") {
      const ev = []; for (let t = 0; t < 3; t++) { ev.push(["F", t, c, false]); c++; }
      st.push({mode, it, n, ph: "fa", c, lost, line: 6, ev,
        msg: it + ". kör: T1, T2, T3 atomic_fetch_add: " + (c-3) + "→" + (c-2) + "→" + (c-1) + "→" + c + "; minden RMW oszthatatlan, nincs elveszett frissítés."});
    } else {
      // barrier nélkül: egy rögzített seedű, lehetséges átfedés (sematikus)
      const pend = [0, 0, 0], old = [0, 0, 0], ev = [], c0 = c;
      while (pend.some(p => p < 2)) {
        const cand = [0,1,2].filter(t => pend[t] < 2), t = cand[Math.floor(rnd() * cand.length)];
        if (pend[t] === 0) { old[t] = c; ev.push(["L", t, c, false]); }
        else { const over = c !== old[t]; c = old[t] + 1; ev.push(["S", t, c, over]); }
        pend[t]++;
      }
      const gained = c - c0; lost += 3 - gained;
      st.push({mode, it, n, ph: "nb", c, lost, line: 3, ev,
        msg: it + ". kör (sematikus átfedés): " + ev.map(e => "T" + (e[1]+1) + (e[0] === "L" ? " load " : " store ") + e[2]).join(", ") +
             " → counter = " + c + ", ebben a körben elveszett: " + (3 - gained) + "."});
    }
  }
  return st;
}
function reload(){
  const n = +document.getElementById("nit").value, mode = document.getElementById("mode").value;
  document.getElementById("nitv").textContent = n;
  setSteps(simJS(mode, n));
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const cx = 300, cy = 70;
  el("rect", {x: cx - 70, y: cy - 30, width: 140, height: 60, rx: 6, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
  el("text", {x: cx, y: cy - 8, "text-anchor": "middle", "font-size": 12}, "shared_counter");
  el("text", {x: cx, y: cy + 20, "text-anchor": "middle", "font-size": 24, "font-weight": "bold"}, String(s.c));
  const tx = [110, 300, 490], ty = 220;
  const evs = s.ev || [];
  [0, 1, 2].forEach(t => {
    el("rect", {x: tx[t] - 75, y: ty - 22, width: 150, height: 50, rx: 6, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: tx[t], y: ty, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "T" + (t + 1));
    const mine = evs.filter(e => e[1] === t);
    const lab = mine.map(e => e[0] === "L" ? "old = " + e[2] : e[0] === "S" ? "store " + e[2] + (e[3] ? " ✗" : "") : "+1: " + e[2] + "→" + (e[2] + 1)).join(" · ");
    el("text", {x: tx[t], y: ty + 20, "text-anchor": "middle", "font-size": 12}, lab);
    mine.forEach((e, j) => {
      const off = (j - (mine.length - 1) / 2) * 16;
      const up = e[0] !== "L";
      const x1 = tx[t] + off, y1 = ty - 24, x2 = cx + (t - 1) * 40 + off, y2 = cy + 32;
      const ln = el("line", {x1: up ? x1 : x2, y1: up ? y1 : y2, x2: up ? x2 : x1, y2: up ? y2 : y1,
        stroke: e[0] === "L" ? css("--muted") : css("--line"), "stroke-width": e[0] === "L" ? 1.5 : 2.2,
        "stroke-dasharray": e[0] === "L" ? "6 4" : (e[3] ? "2 3" : "none")});
      if (e[3]) el("text", {x: (x1 + x2) / 2 + 8, y: (y1 + y2) / 2, "font-size": 16, "font-weight": "bold"}, "✗");
    });
  });
  if (s.ph === "load" || s.ph === "store") {
    el("line", {x1: 20, y1: 150, x2: 580, y2: 150, stroke: css("--line"), "stroke-width": 1.5});
    el("line", {x1: 20, y1: 155, x2: 580, y2: 155, stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: 22, y: 146, "font-size": 11, fill: css("--muted")}, "barrier");
  }
  el("text", {x: 300, y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "szaggatott = load · folytonos = store / fetch_add · pontozott + ✗ = felülírt (elveszett) store");
  el("text", {x: 10, y: 22, "font-size": 13}, "iteráció: " + s.it + " / " + s.n);
  el("text", {x: 590, y: 22, "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, "elveszett frissítések: " + s.lost);
  el("text", {x: 590, y: 40, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "várt (3 × iteráció): " + 3 * s.it);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
