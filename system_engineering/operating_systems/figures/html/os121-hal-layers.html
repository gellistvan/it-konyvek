<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A HAL rétegei és a függőségi irány</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Architektúra"><button class="arch" data-a="x86_64" aria-pressed="true" onclick="pickArch('x86_64')">x86_64</button> <button class="arch" data-a="arm64" aria-pressed="false" onclick="pickArch('arm64')">arm64</button></span> <button id="badb" onclick="toggleBad()">Hibás változat (#include &lt;arch/x86_64/apic.h&gt;)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A generikus mag csak a hal.h interfészt hívja; az x86_64 és arm64 implementációk megvalósítják; a mag közvetlen arch-hívása tilos."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, a 31.4.2 hal.h-ja és könyvtárfája szerint; a hal = &<arch>_hal név szemléltető.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"arch": "x86_64", "ph": 0, "line": -1, "msg": "x86_64: a boot az arch-belépőben beállítja a mutatót: hal = &x86_64_hal."}, {"arch": "x86_64", "ph": 1, "line": 0, "msg": "1. core/sched.c: hal->timer->init(100) – a mag csak a hal.h interfészt ismeri."}, {"arch": "x86_64", "ph": 2, "line": 1, "msg": "2. include/hal.h: hal->timer = &x86_64_hal.timer (függvénymutató-tábla)."}, {"arch": "x86_64", "ph": 3, "line": 2, "msg": "3. arch/x86_64/timer.c: init → PIT (0x40–0x43 portok). A mag és az arch között nincs közvetlen él."}];
const CODE = ["/* core/sched.c */      hal->timer->init(100);", "/* include/hal.h */     const struct hal_timer_ops *timer;   /* a struct hal_ops mezője */", "/* arch/<arch>/timer.c */ static int timer_init(uint32_t freq_hz) { … }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ARCH = {"x86_64": {"items": ["timer.c: PIT (100 Hz)", "irq.c: APIC/PIC", "mmu.c: x86 laptábla", "ns16550 @ 0x3F8"], "timer": "PIT (0x40–0x43 portok)", "hal": "x86_64_hal"}, "arm64": {"items": ["timer.c: generic timer", "irq.c: GICv3", "mmu.c: AArch64 laptábla", "pl011 @ 0x09000000"], "timer": "ARM generic timer", "hal": "arm64_hal"}};
const ST = {x86_64: [{"arch": "x86_64", "ph": 0, "line": -1, "msg": "x86_64: a boot az arch-belépőben beállítja a mutatót: hal = &x86_64_hal."}, {"arch": "x86_64", "ph": 1, "line": 0, "msg": "1. core/sched.c: hal->timer->init(100) – a mag csak a hal.h interfészt ismeri."}, {"arch": "x86_64", "ph": 2, "line": 1, "msg": "2. include/hal.h: hal->timer = &x86_64_hal.timer (függvénymutató-tábla)."}, {"arch": "x86_64", "ph": 3, "line": 2, "msg": "3. arch/x86_64/timer.c: init → PIT (0x40–0x43 portok). A mag és az arch között nincs közvetlen él."}], arm64: [{"arch": "arm64", "ph": 0, "line": -1, "msg": "arm64: a boot az arch-belépőben beállítja a mutatót: hal = &arm64_hal."}, {"arch": "arm64", "ph": 1, "line": 0, "msg": "1. core/sched.c: hal->timer->init(100) – a mag csak a hal.h interfészt ismeri."}, {"arch": "arm64", "ph": 2, "line": 1, "msg": "2. include/hal.h: hal->timer = &arm64_hal.timer (függvénymutató-tábla)."}, {"arch": "arm64", "ph": 3, "line": 2, "msg": "3. arch/arm64/timer.c: init → ARM generic timer. A mag és az arch között nincs közvetlen él."}]};
let BAD = false;
function pickArch(a){ document.querySelectorAll(".arch").forEach(b => b.setAttribute("aria-pressed", b.dataset.a === a ? "true" : "false")); setSteps(ST[a]); }
function toggleBad(){ BAD = !BAD; document.getElementById("badb").textContent = BAD ? "Helyes változat" : "Hibás változat (#include <arch/x86_64/apic.h>)"; show(k); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), hl2 = css("--hl2");
  const box = (x, y, w, h, on, t1, t2) => { el("rect", {x, y, width: w, height: h, fill: on ? css("--cellhl") : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1.2});
    el("text", {x: x + w / 2, y: y + 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, t1);
    if (t2) el("text", {x: x + w / 2, y: y + 42, "text-anchor": "middle", "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, t2); };
  box(40, 20, 600, 56, s.ph === 1, "core/ (sched.c, syscall.c, vfs.c)", "hal->timer->init(100)");
  box(40, 130, 600, 56, s.ph === 2, "include/hal.h – struct hal_ops", "{ timer, irq, mmu, putchar }  *hal = &" + ARCH[s.arch].hal);
  ["x86_64", "arm64"].forEach((a, i) => { const x = 40 + i * 310, act = a === s.arch;
    el("rect", {x, y: 240, width: 290, height: 120, fill: cell, stroke: act ? hl : mut, "stroke-width": act ? 2.5 : 1, opacity: act ? 1 : 0.55});
    el("text", {x: x + 145, y: 260, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: act ? hl : mut}, "arch/" + a + "/");
    ARCH[a].items.forEach((t, j) => { const on = act && s.ph === 3 && j === 0;
      if (on) el("rect", {x: x + 8, y: 268 + j * 22, width: 274, height: 20, fill: css("--cellhl"), stroke: hl, "stroke-width": 2});
      el("text", {x: x + 14, y: 283 + j * 22, "font-size": 11.5, fill: act ? css("--fg") : mut}, t); }); });
  const A = (x1, y1, x2, y2, on, dash, lab, col) => { const c = col || (on ? hl : line);
    el("line", {x1, y1, x2, y2, stroke: c, "stroke-width": on ? 3 : 1.4, "stroke-dasharray": dash});
    el("path", {d: `M${x2} ${y2} l-5 ${y2 > y1 ? -9 : 9} h10 z`, fill: c});
    if (lab) el("text", {x: x1 + 8, y: (y1 + y2) / 2 + 4, "font-size": 11.5, fill: c}, lab); };
  A(200, 76, 200, 130, s.ph >= 1, "none", "hív");
  const ax = s.arch === "x86_64" ? 185 : 495;
  A(ax, 240, ax, 186, s.ph === 2 || s.ph === 3, "6 4", "megvalósít");
  if (s.ph >= 2) A(420, 186, ax + 40, 268, s.ph === 3, "none", "feloldás → " + ARCH[s.arch].timer);
  if (BAD){ el("line", {x1: 700, y1: 48, x2: 700, y2: 300, stroke: hl2, "stroke-width": 3}); el("line", {x1: 700, y1: 300, x2: 335, y2: 300, stroke: hl2, "stroke-width": 3});
    el("line", {x1: 640, y1: 48, x2: 700, y2: 48, stroke: hl2, "stroke-width": 3});
    el("text", {x: 700, y: 180, "text-anchor": "middle", "font-size": 30, "font-weight": "bold", fill: hl2}, "✕");
    el("text", {x: 652, y: 220, "font-size": 11, fill: hl2}, "TILOS: core → arch");
    el("text", {x: 652, y: 236, "font-size": 11, fill: hl2}, "#include <arch/x86_64/apic.h>"); }
  el("text", {x: 40, y: 390, "font-size": 11, fill: mut}, "A mag és az arch között nincs megengedett közvetlen él; a hívás a hal.h függvénymutatóin át oldódik fel.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
