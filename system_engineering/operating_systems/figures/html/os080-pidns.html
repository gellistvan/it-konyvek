<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egymásba ágyazott PID-névterek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label><input type="checkbox" id="mpchk" checked> --mount-proc be</label>
<button id="ksend">kill küldése</button>
<button id="pview">ps nézet: gazda / konténer</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A konténer sh folyamata belül PID 1, a gazdán PID 4327; a gazda be lát a konténerbe, fordítva nem."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A PID-értékek szemléltetők. Szabály (pid_namespaces(7)): a hívó a saját és a leszármazott PID-névterek folyamatait látja és jelezheti; a kill PID-jét a hívó névterében oldja fel a kernel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"src": null, "dst": null, "mp": true, "line": -1, "msg": "Áttekintés: a konténer sh folyamata belül PID 1, a gazdán PID 4327. Kattints egy folyamatra (forrás), majd egy másikra (cél), és nyomd meg a „kill küldése” gombot."}, {"src": "sshd", "dst": "sh", "mp": true, "line": 0, "msg": "A gazda sshd-je kill(4327)-et hív: a PID-et a kernel a hívó (gazda) névterében oldja fel – a cél a gyermeknévtérben van, látható: engedélyezett.", "ok": true}, {"src": "sleep", "dst": "sshd", "mp": true, "line": 1, "msg": "A konténer sleep folyamata a gazda sshd-jének küldene jelet: a gazda névtere ős, onnan nézve nem látható – a cél nem látható a hívó névterében (ESRCH).", "ok": false}, {"src": null, "dst": null, "mp": true, "view": 1, "line": 2, "msg": "ps a konténerben, --mount-proc mellett: a saját /proc csak a 1 (sh) és 2 (sleep) PID-et mutatja."}, {"src": null, "dst": null, "mp": false, "view": 1, "line": 3, "msg": "--mount-proc nélkül a konténer ps-e a gazda /proc-ját olvassa: a gazda mind az öt folyamatát és azok gazdabeli PID-jeit mutatja (izolációs hiba)."}];
const CODE = ["kill(4327, SIGTERM);   /* a gazdán: a PID a hívó névterében */", "kill(812, SIGTERM);    /* a konténerben: a 812 itt nem létezik -> ESRCH */", "unshare --pid --fork --mount-proc /bin/sh;  ps -e", "unshare --pid --fork /bin/sh;  ps -e   # /proc = a gazdáé"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PR = [{"id": "systemd", "ns": 0, "pids": {"0": 1}}, {"id": "sshd", "ns": 0, "pids": {"0": 812}}, {"id": "unshare", "ns": 0, "pids": {"0": 4326}}, {"id": "sh", "ns": 1, "pids": {"0": 4327, "1": 1}}, {"id": "sleep", "ns": 1, "pids": {"0": 4328, "1": 2}}];
const NSP = {0: null, 1: 0};
let osel = [], omp = true, oview = 0, olast = null;
function anc(n){ const a = []; while (n !== null && n !== undefined) { a.push(n); n = NSP[n]; } return a; }
function vis(a, b){ return anc(b).includes(a); }
function P(id){ return PR.find(p => p.id === id); }
const POS = {systemd: [30, 70], sshd: [160, 70], unshare: [290, 70], sh: [200, 230], sleep: [350, 230]};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 380"); svg.innerHTML = "";
  if (s.fromStep !== false) {
    osel = s.src ? [s.src, s.dst] : []; omp = s.mp; oview = s.view || 0; olast = s.src ? s : null;
    const cb = document.getElementById("mpchk"); if (cb) cb.checked = omp;
  }
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  el("rect", {x: 8, y: 22, width: 480, height: 330, rx: 10, fill: "none", stroke: line, "stroke-width": 2.5});
  el("text", {x: 20, y: 42, "font-size": 14, "font-weight": "bold"}, "gazda PID-névtér");
  el("rect", {x: 170, y: 175, width: 305, height: 165, rx: 10, fill: "none", stroke: line, "stroke-width": 2, "stroke-dasharray": "9 5"});
  el("text", {x: 322, y: 332, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "konténer PID-névtér (gyermek)");
  // fork vonal
  el("line", {x1: 349, y1: 124, x2: 285, y2: 228, stroke: mut, "stroke-dasharray": "2 3", "stroke-width": 1.5});
  el("text", {x: 330, y: 168, "font-size": 11, fill: mut}, "fork");
  PR.forEach(p => {
    const [x, y] = POS[p.id], on = osel.includes(p.id), w = 118, h = 54;
    const r = el("rect", {x, y, width: w, height: h, rx: 7, fill: on ? cellhl : (p.ns ? cellhl : cell), "fill-opacity": on ? 1 : (p.ns ? 0.45 : 1), stroke: on ? hl : line, "stroke-width": on ? 4 : 1.4, tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": p.id + " kiválasztása"});
    const pick = () => { stop(); osel = osel.length >= 2 ? [p.id] : osel.concat([p.id]); olast = null; render({fromStep: false});
      const q = P(p.id); status.textContent = p.id + ": " + Object.entries(q.pids).map(([n, v]) => (n == 0 ? "gazdán PID " : "konténerben PID ") + v).join(", ") + (osel.length === 2 ? " – cél kiválasztva, nyomd meg a „kill küldése” gombot." : " – forrás kiválasztva, válassz célt."); };
    r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    el("text", {x: x + w / 2, y: y + 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", style: "pointer-events:none;font-family:monospace"}, p.id);
    const sub = p.ns ? ("belül " + p.pids[1] + " / kívül " + p.pids[0]) : ("PID " + p.pids[0]);
    el("text", {x: x + w / 2, y: y + 42, "text-anchor": "middle", "font-size": 12, style: "pointer-events:none", "font-weight": on ? "bold" : "normal"}, sub);
  });
  // kill nyíl
  const L = olast;
  if (L) {
    const [x0, y0] = POS[L.src], [x1, y1] = POS[L.dst];
    const ax = x0 + 59, ay = y0 + 27, bx = x1 + 59, by = y1 + 27;
    el("line", {x1: ax, y1: ay, x2: bx, y2: by, stroke: L.ok ? hl : hl2, "stroke-width": 4, "stroke-dasharray": L.ok ? "none" : "8 5"});
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    if (L.ok) el("text", {x: mx + 8, y: my, "font-size": 13, "font-weight": "bold", fill: hl}, "OK");
    else { el("line", {x1: mx - 12, y1: my - 12, x2: mx + 12, y2: my + 12, stroke: hl2, "stroke-width": 5}); el("line", {x1: mx - 12, y1: my + 12, x2: mx + 12, y2: my - 12, stroke: hl2, "stroke-width": 5}); }
  }
  // ps panel
  const pns = omp ? oview : 0;
  const rows = PR.filter(p => pns in p.pids).map(p => [p.pids[pns], p.id]).sort((a, b) => a[0] - b[0]);
  el("text", {x: 505, y: 42, "font-size": 13, "font-weight": "bold"}, (oview ? "konténer" : "gazda") + ": ps -e");
  el("text", {x: 505, y: 60, "font-size": 11, fill: mut}, oview ? (omp ? "saját /proc (--mount-proc)" : "--mount-proc nélkül: a gazda /proc-ja!") : "a gazda /proc-ja");
  el("rect", {x: 500, y: 68, width: 250, height: 30 + rows.length * 20, fill: "none", stroke: oview && !omp ? hl2 : line, "stroke-width": oview && !omp ? 3 : 1.2});
  el("text", {x: 512, y: 88, "font-size": 12, style: "font-family:monospace;white-space:pre", fill: mut}, "  PID CMD");
  rows.forEach((r, i) => el("text", {x: 512, y: 108 + i * 20, "font-size": 12, style: "font-family:monospace;white-space:pre"}, String(r[0]).padStart(5, " ") + " " + r[1]));
  el("text", {x: 500, y: 372, "font-size": 11, fill: mut}, "kiemelt keret = kiválasztott folyamat");
}

document.getElementById("mpchk").addEventListener("change", e => { stop(); omp = e.target.checked; olast = null; render({fromStep: false});
  status.textContent = omp ? "--mount-proc be: a konténer ps-e a saját /proc-ot olvassa." : "--mount-proc ki: a konténer ps-e a gazda /proc-ját olvassa (a gazda folyamatai látszanak)."; });
document.getElementById("pview").addEventListener("click", () => { stop(); oview = oview ? 0 : 1; olast = null; render({fromStep: false});
  status.textContent = "ps nézet: " + (oview ? "konténer" : "gazda"); });
document.getElementById("ksend").addEventListener("click", () => { stop();
  if (osel.length !== 2) { status.textContent = "Előbb válassz forrást és célt (két kattintás)."; return; }
  const a = P(osel[0]), b = P(osel[1]), ok = vis(a.ns, b.ns);
  olast = {src: a.id, dst: b.id, ok}; render({fromStep: false});
  status.textContent = ok ? ("engedélyezett: " + a.id + " → kill(" + b.pids[a.ns] + ") – a cél PID-je a hívó névterében " + b.pids[a.ns])
                          : ("a cél nem látható a hívó névterében: " + a.id + " a konténerből nem címezheti a gazda " + b.id + " folyamatát (ESRCH)"); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
