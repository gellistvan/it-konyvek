<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A getpid-mérések határai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="m0">ftrace</button><button id="m1">eBPF</button><button id="m2">user timestamp</button><button id="m3">perf stat / T_wall</button> <label><input type="checkbox" id="tr" checked> tracing be</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Vízszintes, sematikus idővonal egy getpid-hívásra: ciklus, libc wrapper, syscall és belépés, sys_enter tracepoint, handler, sys_exit tracepoint, visszatérés, wrapper vége. Alatta négy egymásba ágyazott tartomány: handler (ftrace), eBPF a két tracepoint között, end-to-end a felhasználói időbélyegek között, T_wall / N egy teljes iteráció. (1) ≤ (2) ≤ (3) ≤ (4)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">x86-64 Linux, egy szál; sematikus, a szakaszhosszak nem mért arányok. A „tracing be” kapcsoló a probe-overhead blokkokat mutatja; kikapcsolt tracing mellett az (1) és (2) nem mérhető, a (3) és (4) probe overhead nélküli.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"r": 0, "line": 0, "msg": "(1) handler – ftrace function_graph: tartalmazza csak a __x64_sys_getpid belépésétől a kilépéséig; a user→kernel átmenetet, a tracepointokat és a libc wrappert nem."}, {"r": 1, "line": 1, "msg": "(2) eBPF – bpftrace sys_enter → sys_exit: tartalmazza a kernelbeli rendszerhívási utat a két tracepoint között és a probe overheadet; a felhasználói tér idejét (libc wrapper, ciklus) nem."}, {"r": 2, "line": 2, "msg": "(3) end-to-end – felhasználói időbélyeg (▲ … ▼): tartalmazza a libc wrappert, az átmenetet, a handlert és a visszatérést; a ciklus többi részét nem."}, {"r": 3, "line": 3, "msg": "(4) T_wall / N – perf stat / T_wall mérése: tartalmazza egy teljes iterációt: ciklus + wrapper + rendszerhívás + mérési overhead (átlag); semmit nem hagy ki – ezért nem kerneloldali latency."}];
const CODE = ["ftrace:   function_graph a __x64_sys_getpid-en      → (1) handler", "bpftrace: tracepoint:raw_syscalls:sys_enter / sys_exit → (2) eBPF", "C:        t0 = now(); syscall(SYS_getpid); t1 = now(); → (3) end-to-end", "perf stat / T_wall: N hívás egy szálon, T_wall / N     → (4) átlag"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SEG = [["ciklus\n(for, ▲)", "user", 1.2], ["libc\nsyscall()", "user", 1.15], ["syscall +\nentry", "kernel", 1.15], ["◆", "probe", 0.4], ["__x64_sys_\ngetpid", "kernel", 1.45], ["◇", "probe", 0.4], ["vissza-\ntérés", "kernel", 1.1], ["wrapper\nvége, ▼", "user", 1.15]], RANGES = [["(1) handler", 4, 4, "ftrace function_graph", "csak a __x64_sys_getpid belépésétől a kilépéséig", "a user→kernel átmenetet, a tracepointokat és a libc wrappert nem"], ["(2) eBPF", 3, 5, "bpftrace sys_enter → sys_exit", "a kernelbeli rendszerhívási utat a két tracepoint között és a probe overheadet", "a felhasználói tér idejét (libc wrapper, ciklus) nem"], ["(3) end-to-end", 1, 7, "felhasználói időbélyeg (▲ … ▼)", "a libc wrappert, az átmenetet, a handlert és a visszatérést", "a ciklus többi részét nem"], ["(4) T_wall / N", 0, 7, "perf stat / T_wall mérése", "egy teljes iterációt: ciklus + wrapper + rendszerhívás + mérési overhead (átlag)", "semmit nem hagy ki – ezért nem kerneloldali latency"]];
let tracing = true;
function render(s){
  svg.setAttribute("viewBox", "0 0 760 290"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const segs = SEG.filter(g => tracing || g[1] !== "probe");
  const idx = SEG.map((g, i) => i).filter(i => tracing || SEG[i][1] !== "probe");
  const tot = segs.reduce((a, g) => a + g[2], 0), sc = 700 / tot, xs = {}; let x = 20;
  idx.forEach(i => { xs[i] = x; x += SEG[i][2] * sc; }); xs.end = x;
  const R = RANGES[s.r]; let a = R[1], b = R[2];
  if (!tracing) { while (SEG[a][1] === "probe") a++; while (SEG[b][1] === "probe") b--; }
  idx.forEach(i => { const g = SEG[i], w = g[2] * sc, inR = i >= a && i <= b;
    el("rect", {x: xs[i], y: 40, width: w, height: 70, fill: g[1] === "kernel" ? cellhl : cell, stroke: inR ? hl : line, "stroke-width": inR ? 3.5 : 1, "stroke-dasharray": g[1] === "probe" ? "3 2" : ""});
    g[0].split("\n").forEach((t, j) => el("text", {x: xs[i] + w / 2, y: (g[1] === "probe" ? 30 : 70) + j * 15, "text-anchor": "middle", "font-size": 12, "font-weight": inR ? "bold" : "normal"}, t)); });
  RANGES.forEach((Q, kk) => { let qa = Q[1], qb = Q[2];
    if (!tracing) { while (SEG[qa][1] === "probe") qa++; while (SEG[qb][1] === "probe") qb--; }
    const y = 140 + kk * 30, x0 = xs[qa], nx = idx.filter(i => i > qb), x1 = nx.length ? xs[nx[0]] : xs.end, on = kk === s.r;
    el("path", {d: `M ${x0} ${y - 8} L ${x0} ${y} L ${x1} ${y} L ${x1} ${y - 8}`, fill: "none", stroke: on ? hl : mut, "stroke-width": on ? 3.5 : 1.3});
    el("text", {x: x0 + 6, y: y + 15, "font-size": 12, "font-weight": on ? "bold" : "normal", fill: on ? hl : mut}, Q[0] + " – " + Q[3]); });
  el("text", {x: 20, y: 280, "font-size": 11.5, fill: mut}, "(1) ≤ (2) ≤ (3) ≤ (4); sematikus, nem arányos; " + (tracing ? "tracing be: szaggatott keretű probe-blokkok" : "tracing ki: nincs probe overhead (az (1)–(2) nem mérhető)"));
}
["m0", "m1", "m2", "m3"].forEach((id, i) => document.getElementById(id).addEventListener("click", () => { stop(); show(i); }));
document.getElementById("tr").addEventListener("change", e => { tracing = e.target.checked; show(k); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
