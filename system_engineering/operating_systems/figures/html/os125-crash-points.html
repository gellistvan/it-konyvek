<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fájlnövelés és szúrási pontok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="crash()">Crash itt</button> <label>Írási sorrend: <select id="ord" onchange="pickOrder()"><option value="ok">helyes (fejezet 1–5.)</option><option value="bad">hibás: mutató a bitmap előtt</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A DIRTY, a bitmap, az adatblokk és a mutató egymás utáni tartós írása; F3 és F4 után a 21. blokk szivárog, F5 után minden konzisztens."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">MMFS, 4 KiB blokk, blk_flush minden lépés után, journaling nélkül; a blokkszámok és a free_block_count szemléltetők. Fk = crash a k-adik írás előtt.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"name": "kiindulás", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": -1, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "kiindulás: A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F1", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": 0, "before": "DIRTY", "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "F1: crash a(z) „DIRTY” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F2", "disk": {"state": "DIRTY", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": ["state"], "line": 1, "before": "bitmap", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F2: crash a(z) „bitmap” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F3", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": ["bit21", "free"], "line": 2, "before": "adat", "fsck": "teljes fsck: szivárgó blokk 21 → visszavehető", "kind": "leak", "msg": "F3: crash a(z) „adat” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F4", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 0, "size": 8192}, "changed": ["data21"], "line": 3, "before": "mutató", "fsck": "teljes fsck: szivárgó blokk 21, az új adat nem része a fájlnak", "kind": "leak", "msg": "F4: crash a(z) „mutató” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F5", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["direct2"], "line": 4, "before": "CLEAN", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F5: crash a(z) „CLEAN” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "CLEAN után", "disk": {"state": "CLEAN", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["state"], "line": 4, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "CLEAN után: A „Crash itt” gomb lefuttatja a fsck-t."}];
const CODE = ["1. MMFS_DIRTY beállítása, checksum, blk_flush", "2. bitmap 21. bit = 1, free_block_count--, szuperblokk írása, blk_flush", "3. az adatblokk (21) írása, blk_flush", "4. inode 2: direct[2] = 21, size = 12288, blk_flush", "5. sys_sync: state = MMFS_CLEAN, checksum, blk_flush"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const OK = [{"name": "kiindulás", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": -1, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "kiindulás: A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F1", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": 0, "before": "DIRTY", "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "F1: crash a(z) „DIRTY” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F2", "disk": {"state": "DIRTY", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": ["state"], "line": 1, "before": "bitmap", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F2: crash a(z) „bitmap” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F3", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": ["bit21", "free"], "line": 2, "before": "adat", "fsck": "teljes fsck: szivárgó blokk 21 → visszavehető", "kind": "leak", "msg": "F3: crash a(z) „adat” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F4", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 0, "size": 8192}, "changed": ["data21"], "line": 3, "before": "mutató", "fsck": "teljes fsck: szivárgó blokk 21, az új adat nem része a fájlnak", "kind": "leak", "msg": "F4: crash a(z) „mutató” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F5", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["direct2"], "line": 4, "before": "CLEAN", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F5: crash a(z) „CLEAN” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "CLEAN után", "disk": {"state": "CLEAN", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["state"], "line": 4, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "CLEAN után: A „Crash itt” gomb lefuttatja a fsck-t."}], BAD = [{"name": "kiindulás", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": -1, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "kiindulás: A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F1", "disk": {"state": "CLEAN", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": [], "line": 0, "before": "DIRTY", "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "F1: crash a(z) „DIRTY” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F2", "disk": {"state": "DIRTY", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 0, "size": 8192}, "changed": ["state"], "line": 1, "before": "mutató", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F2: crash a(z) „mutató” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F3", "disk": {"state": "DIRTY", "free": 16363, "bit21": 0, "data21": "régi szemét", "direct2": 21, "size": 12288}, "changed": ["direct2"], "line": 2, "before": "bitmap", "fsck": "teljes fsck: hivatkozott, de foglalatlan blokk 21 – sorrendsértés", "kind": "bad", "msg": "F3: crash a(z) „bitmap” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F4", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "régi szemét", "direct2": 21, "size": 12288}, "changed": ["bit21", "free"], "line": 3, "before": "adat", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F4: crash a(z) „adat” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "F5", "disk": {"state": "DIRTY", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["data21"], "line": 4, "before": "CLEAN", "fsck": "teljes fsck, nincs hiba", "kind": null, "msg": "F5: crash a(z) „CLEAN” írás előtt. A „Crash itt” gomb lefuttatja a fsck-t."}, {"name": "CLEAN után", "disk": {"state": "CLEAN", "free": 16362, "bit21": 1, "data21": "új adat", "direct2": 21, "size": 12288}, "changed": ["state"], "line": 4, "fsck": "gyors út (CLEAN), nincs változás", "kind": null, "msg": "CLEAN után: A „Crash itt” gomb lefuttatja a fsck-t."}];
const CODE_OK = ["1. MMFS_DIRTY beállítása, checksum, blk_flush", "2. bitmap 21. bit = 1, free_block_count--, szuperblokk írása, blk_flush", "3. az adatblokk (21) írása, blk_flush", "4. inode 2: direct[2] = 21, size = 12288, blk_flush", "5. sys_sync: state = MMFS_CLEAN, checksum, blk_flush"], CODE_BAD = ["1. MMFS_DIRTY beállítása, checksum, blk_flush", "4. inode 2: direct[2] = 21, size = 12288, blk_flush", "2. bitmap 21. bit = 1, free_block_count--, szuperblokk írása, blk_flush", "3. az adatblokk (21) írása, blk_flush", "5. sys_sync: state = MMFS_CLEAN, checksum, blk_flush"];
const COLS = [["state", "szuperblokk: state"], ["free", "free_block_count"], ["bit21", "bitmap: 21. bit"], ["data21", "adatblokk 21"], ["direct2", "inode 2: direct[2] / size"]];
let CRASH = -1;
function pickOrder(){ const bad = document.getElementById("ord").value === "bad"; CRASH = -1;
  const c = bad ? CODE_BAD : CODE_OK; codeEl.innerHTML = c.map((l, i) => `<span id="L${i}">${l}</span>`).join(""); setSteps(bad ? BAD : OK); }
function crash(){ CRASH = k; show(k); }
function v(d, c){ return c === "direct2" ? d.direct2 + " / " + d.size : String(d[c]); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), hl2 = css("--hl2");
  const W = [110, 120, 120, 90, 110, 170], H = ["pont", "state", "free_block_count", "bitmap 21.", "adatblokk 21", "direct[2] / size"];
  let x = 10; H.forEach((t, j) => { el("rect", {x, y: 10, width: W[j], height: 26, fill: css("--cellhl"), stroke: line});
    el("text", {x: x + W[j] / 2, y: 28, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, t); x += W[j]; });
  STEPS.forEach((r, i) => { let x = 10; const y = 40 + i * 27, cur = i === k;
    const cells = [r.name, ...COLS.map(c => v(r.disk, c[0]))];
    cells.forEach((t, j) => { const ch = j > 0 && r.changed.includes(COLS[j - 1][0]);
      el("rect", {x, y, width: W[j], height: 25, fill: cur ? css("--cellhl") : cell, stroke: cur ? hl : line, "stroke-width": ch ? 3 : (cur ? 2 : 0.8)});
      el("text", {x: x + W[j] / 2, y: y + 17, "text-anchor": "middle", "font-size": 11.5, "font-weight": ch ? "bold" : "normal"}, t); x += W[j]; }); });
  if (CRASH === k){
    const r = s.disk, ref = r.direct2 === 21, al = r.bit21 === 1;
    el("text", {x: 10, y: 250, "font-size": 13, "font-weight": "bold"}, "fsck a(z) " + s.name + " pontban:");
    const lines = r.state === "CLEAN" ? ["state = CLEAN, checksum helyes → gyors út"] :
      ["state = DIRTY → teljes ellenőrzés", "inode-hivatkozások: {19, 20" + (ref ? ", 21" : "") + "}", "bitmap foglalt: {19, 20" + (al ? ", 21" : "") + "}"];
    lines.forEach((t, i) => el("text", {x: 10, y: 270 + i * 18, "font-size": 12}, t));
    el("text", {x: 380, y: 270, "font-size": 13, "font-weight": "bold", fill: s.kind === "bad" ? hl2 : (s.kind === "leak" ? hl2 : hl)}, s.fsck);
  } else el("text", {x: 10, y: 260, "font-size": 12, fill: mut}, "Kattints a „Crash itt” gombra: a fsck ebből a lemezállapotból indul.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
