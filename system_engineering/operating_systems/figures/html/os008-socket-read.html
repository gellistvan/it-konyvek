<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokkoló read egy TCP-socketen</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="buf" type="checkbox" onchange="toggleBuf()"> adat már a pufferben (nincs alvás)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram: a folyamat read-hívása a VFS-en és a socket-rétegen át alvásba kerül, a NIC megszakítása és a softirq sk_buff-ot allokál és felébreszti, majd a copy_to_user után a hívás visszatér."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Linux 6.x, TCP socket, egy CPU; a függvénynevek szemléltetők; 6 bájtos mintaüzenet. Pontozott nyíl és háttér = megszakítás/softirq kontextus, hullámvonal = alvás, szaggatott keretek = a négy alrendszer.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": 1, "buffered": false, "line": 0, "a": "RUNNING", "buf": 0, "ret": null, "msg": "1/9 – A folyamat read(fd, buf, 4096) hívást ad ki egy socketre."}, {"cur": 2, "buffered": false, "line": 1, "a": "RUNNING", "buf": 0, "ret": null, "msg": "2/9 – A kernel a fájlleíróból feloldja a file objektumot (VFS/sockfs)."}, {"cur": 3, "buffered": false, "line": 2, "a": "RUNNING", "buf": 0, "ret": null, "msg": "3/9 – A file->f_op->read_iter hívás a socket-rétegbe vezet."}, {"cur": 4, "buffered": false, "line": 3, "a": "RUNNING", "buf": 0, "ret": null, "msg": "4/9 – A socket-réteg a struct sock recvmsg-ét hívja."}, {"cur": 5, "buffered": false, "line": 4, "a": "S", "buf": 0, "ret": null, "msg": "5/9 – Nincs adat: a folyamat a socket várakozási sorába áll, schedule()."}, {"cur": 6, "buffered": false, "line": 5, "a": "S", "buf": 0, "ret": null, "msg": "6/9 – A NIC megszakítása és a softirq feldolgozza a csomagot; sk_buff-allokáció."}, {"cur": 7, "buffered": false, "line": 6, "a": "READY", "buf": 6, "ret": null, "msg": "7/9 – A TCP az adatot a fogadópufferbe teszi, wake_up felébreszti a folyamatot."}, {"cur": 8, "buffered": false, "line": 7, "a": "RUNNING", "buf": 0, "ret": null, "msg": "8/9 – A folyamat újra fut; recvmsg → copy_to_user a felhasználói pufferbe."}, {"cur": 9, "buffered": false, "line": 8, "a": "RUNNING", "buf": 0, "ret": 6, "msg": "9/9 – A rendszerhívás visszatér a beolvasott bájtok számával."}];
const CODE = ["1. A folyamat read(fd, buf, 4096) hívást ad ki egy socketre.", "2. A kernel a fájlleíróból feloldja a file objektumot (VFS/sockfs).", "3. A file->f_op->read_iter hívás a socket-rétegbe vezet.", "4. A socket-réteg a struct sock recvmsg-ét hívja.", "5. Nincs adat: a folyamat a socket várakozási sorába áll, schedule().", "6. A NIC megszakítása és a softirq feldolgozza a csomagot; sk_buff-allokáció.", "7. A TCP az adatot a fogadópufferbe teszi, wake_up felébreszti a folyamatot.", "8. A folyamat újra fut; recvmsg → copy_to_user a felhasználói pufferbe.", "9. A rendszerhívás visszatér a beolvasott bájtok számával."];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

// ---- közös szekvenciadiagram-rajzoló (os003/os006/os008/os019) ----
function seqDefs(){
  const defs = el("defs", {});
  [["ah", css("--fg")], ["ahh", css("--hl")], ["ahw", css("--hl2")]].forEach(([id, c]) => {
    const mk = document.createElementNS(NS, "marker");
    mk.setAttribute("id", id); mk.setAttribute("viewBox", "0 0 10 10"); mk.setAttribute("refX", 9); mk.setAttribute("refY", 5);
    mk.setAttribute("markerWidth", 7); mk.setAttribute("markerHeight", 7); mk.setAttribute("orient", "auto-start-reverse");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", c);
    mk.appendChild(p); defs.appendChild(mk);
  });
  const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hatch"); pat.setAttribute("width", 6); pat.setAttribute("height", 6);
  pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line");
  pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 6);
  pl.setAttribute("stroke", css("--muted")); pl.setAttribute("stroke-width", 1.2); pat.appendChild(pl); defs.appendChild(pat);
}
function mtext(x, y, txt, attrs){
  const t = el("text", Object.assign({x, y, "text-anchor": "middle"}, attrs || {}));
  String(txt).split("\n").forEach((ln, i) => {
    const sp = document.createElementNS(NS, "tspan");
    sp.setAttribute("x", x); if (i) sp.setAttribute("dy", "1.15em"); sp.textContent = ln; t.appendChild(sp);
  });
  return t;
}
// A: szereplők, M: üzenetek {s: lépés (1-től), f, t: szereplőindex, label, st: "call"|"ret"|"opt"}, cur: aktuális lépés
// opt: {W, rh, top, bands: [{a: szereplő, m0, m1: üzenetindex, label}], groups: [{a0, a1, label}]}
function seqDraw(A, M, cur, opt){
  opt = opt || {};
  const W = opt.W || 760, top = opt.top || 62, rh = opt.rh || 24, H = top + (M.length + 1) * rh + 8;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = ""; seqDefs();
  const fg = css("--fg"), hl = css("--hl"), line = css("--line"), cell = css("--cell"), cellhl = css("--cellhl");
  const xs = A.map((a, i) => 64 + i * (W - 128) / (A.length - 1));
  const bw = Math.min(118, (W - 128) / (A.length - 1) - 8);
  (opt.groups || []).forEach(g => {
    el("rect", {x: xs[g.a0] - bw / 2 - 2, y: 2, width: xs[g.a1] - xs[g.a0] + bw + 4, height: H - 4, fill: "none",
                stroke: css("--muted"), "stroke-dasharray": "3 3"});
    el("text", {x: (xs[g.a0] + xs[g.a1]) / 2, y: 13, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, g.label);
  });
  A.forEach((a, i) => {
    el("line", {x1: xs[i], y1: top - 8, x2: xs[i], y2: H - 6, stroke: line, "stroke-dasharray": "3 4", "stroke-width": 0.8});
    el("rect", {x: xs[i] - bw / 2, y: 18, width: bw, height: 32, fill: cell, stroke: line, rx: 4});
    mtext(xs[i], a.includes("\n") ? 31 : 38, a, {"font-size": 10.5, "font-weight": "bold"});
  });
  const yOf = j => top + (j + 0.7) * rh;
  (opt.bgrows || []).forEach(r => {
    if (M[r.m0].s > cur) return;
    el("rect", {x: 2, y: yOf(r.m0) - rh / 2, width: W - 4, height: (r.m1 - r.m0 + 1) * rh, fill: "url(#hatch)", opacity: 0.35});
    if (r.label) el("text", {x: W - 6, y: yOf(r.m0) - rh / 2 + 11, "text-anchor": "end", "font-size": 9.5, fill: css("--muted")}, r.label);
  });
  (opt.bands || []).forEach(b => {
    if (M[b.m0].s > cur) return;
    const y0 = yOf(b.m0) - 4, last = (b.m1 !== undefined && M[b.m1].s <= cur) ? yOf(b.m1) + 4 : yOf(M.length - 1) + 8;
    const lastVis = Math.max(...M.map((m, j) => m.s <= cur ? j : -1));
    const y1 = (b.m1 !== undefined && M[b.m1].s <= cur) ? last : yOf(lastVis) + 8;
    el("rect", {x: xs[b.a] - 9, y: y0, width: 18, height: Math.max(8, y1 - y0), fill: "url(#hatch)", stroke: line, "stroke-width": 1});
    if (b.label) el("text", {x: xs[b.a] + 12, y: y0 + Math.max(8, y1 - y0) - 2, "font-size": 9.5, fill: css("--muted"), "text-anchor": "start"}, b.label);
  });
  M.forEach((m, j) => {
    if (m.s > cur) return;
    const on = m.s === cur, c = on ? (m.warn ? css("--hl2") : hl) : fg, y = yOf(j);
    const dash = m.st === "ret" ? "7 4" : m.st === "opt" ? "2 3" : "none";
    const mk = on ? (m.warn ? "url(#ahw)" : "url(#ahh)") : "url(#ah)";
    const fs = on ? {"font-size": 10.5, "font-weight": "bold"} : {"font-size": 10};
    if (m.f === m.t) {
      const x = xs[m.f];
      el("path", {d: `M${x},${y - 6} h22 v12 h-20`, fill: "none", stroke: c, "stroke-width": on ? 2.2 : 1.3, "stroke-dasharray": dash, "marker-end": mk});
      const t = mtext(x + 28, y + 3, m.label, Object.assign({"paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, fs)); t.setAttribute("text-anchor", "start");
      if (on) t.setAttribute("fill", c);
    } else {
      const x0 = xs[m.f], x1 = xs[m.t], d = x1 > x0 ? 1 : -1;
      el("line", {x1: x0 + d * 3, y1: y, x2: x1 - d * 3, y2: y, stroke: c, "stroke-width": on ? 2.4 : 1.3, "stroke-dasharray": dash, "marker-end": mk});
      const t = mtext((x0 + x1) / 2, y - 4, m.label, Object.assign({"paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, fs));
      if (on) t.setAttribute("fill", c);
    }
  });
  return {W, H, xs, yOf};
}

const ACT = ["Folyamat A\n(user)", "VFS /\nsockfs", "Ütemező", "Memória-\nkezelő", "Socket /\nTCP", "NIC + IRQ /\nsoftirq"];
const MSG = [{"s": 1, "f": 0, "t": 1, "label": "read(fd, buf, 4096)"}, {"s": 2, "f": 1, "t": 1, "label": "fdget → file"}, {"s": 3, "f": 1, "t": 4, "label": "f_op->read_iter (sock_read_iter)"}, {"s": 4, "f": 4, "t": 4, "label": "recvmsg → tcp_recvmsg"}, {"s": 5, "f": 4, "t": 2, "label": "nincs adat: wait_queue, schedule()"}, {"s": 6, "f": 5, "t": 3, "label": "IRQ → softirq: sk_buff allokáció", "st": "opt"}, {"s": 7, "f": 5, "t": 4, "label": "TCP: adat a fogadópufferbe", "st": "opt"}, {"s": 7, "f": 4, "t": 2, "label": "wake_up(A)", "st": "opt"}, {"s": 8, "f": 2, "t": 4, "label": "A újra fut"}, {"s": 8, "f": 4, "t": 3, "label": "copy_to_user (6 bájt)"}, {"s": 9, "f": 4, "t": 0, "label": "visszatérés: 6", "st": "ret"}];
const GROUPS = [{"a0": 1, "a1": 1, "label": "VFS"}, {"a0": 2, "a1": 2, "label": "ütemező"}, {"a0": 3, "a1": 3, "label": "memóriakezelő"}, {"a0": 4, "a1": 5, "label": "hálózati stack"}];
const S9 = [{"cur": 1, "buffered": false, "line": 0, "a": "RUNNING", "buf": 0, "ret": null, "msg": "1/9 – A folyamat read(fd, buf, 4096) hívást ad ki egy socketre."}, {"cur": 2, "buffered": false, "line": 1, "a": "RUNNING", "buf": 0, "ret": null, "msg": "2/9 – A kernel a fájlleíróból feloldja a file objektumot (VFS/sockfs)."}, {"cur": 3, "buffered": false, "line": 2, "a": "RUNNING", "buf": 0, "ret": null, "msg": "3/9 – A file->f_op->read_iter hívás a socket-rétegbe vezet."}, {"cur": 4, "buffered": false, "line": 3, "a": "RUNNING", "buf": 0, "ret": null, "msg": "4/9 – A socket-réteg a struct sock recvmsg-ét hívja."}, {"cur": 5, "buffered": false, "line": 4, "a": "S", "buf": 0, "ret": null, "msg": "5/9 – Nincs adat: a folyamat a socket várakozási sorába áll, schedule()."}, {"cur": 6, "buffered": false, "line": 5, "a": "S", "buf": 0, "ret": null, "msg": "6/9 – A NIC megszakítása és a softirq feldolgozza a csomagot; sk_buff-allokáció."}, {"cur": 7, "buffered": false, "line": 6, "a": "READY", "buf": 6, "ret": null, "msg": "7/9 – A TCP az adatot a fogadópufferbe teszi, wake_up felébreszti a folyamatot."}, {"cur": 8, "buffered": false, "line": 7, "a": "RUNNING", "buf": 0, "ret": null, "msg": "8/9 – A folyamat újra fut; recvmsg → copy_to_user a felhasználói pufferbe."}, {"cur": 9, "buffered": false, "line": 8, "a": "RUNNING", "buf": 0, "ret": 6, "msg": "9/9 – A rendszerhívás visszatér a beolvasott bájtok számával."}];
const S6 = [{"cur": 1, "buffered": true, "line": 0, "a": "RUNNING", "buf": 6, "ret": null, "msg": "1/6 – A folyamat read(fd, buf, 4096) hívást ad ki egy socketre."}, {"cur": 2, "buffered": true, "line": 1, "a": "RUNNING", "buf": 6, "ret": null, "msg": "2/6 – A kernel a fájlleíróból feloldja a file objektumot (VFS/sockfs)."}, {"cur": 3, "buffered": true, "line": 2, "a": "RUNNING", "buf": 6, "ret": null, "msg": "3/6 – A file->f_op->read_iter hívás a socket-rétegbe vezet."}, {"cur": 4, "buffered": true, "line": 3, "a": "RUNNING", "buf": 6, "ret": null, "msg": "4/6 – A socket-réteg a struct sock recvmsg-ét hívja."}, {"cur": 8, "buffered": true, "line": 7, "a": "RUNNING", "buf": 0, "ret": null, "msg": "5/6 – A folyamat újra fut; recvmsg → copy_to_user a felhasználói pufferbe."}, {"cur": 9, "buffered": true, "line": 8, "a": "RUNNING", "buf": 0, "ret": 6, "msg": "6/6 – A rendszerhívás visszatér a beolvasott bájtok számával."}];
function render(s){
  const M = s.buffered ? MSG.filter(m => m.s < 5 || m.s > 7) : MSG;
  const g = seqDraw(ACT, M, s.cur, {W: 820, rh: 25, top: 70, groups: GROUPS,
                    bgrows: s.buffered ? [] : [{m0: 5, m1: 7, label: ""}]});
  if (!s.buffered && s.cur >= 6) mtext(g.xs[1], g.yOf(6) - 4, "megszakítás /\nsoftirq kontextus", {"font-size": 10, "font-style": "italic", fill: css("--muted")});
  if (!s.buffered && s.cur >= 5) {
    const ya = g.yOf(4) + 6, yb = s.cur >= 8 ? g.yOf(8) - 6 : g.yOf(Math.max(...M.map((m, j) => m.s <= s.cur ? j : 0))) + 6;
    let d = `M${g.xs[0]},${ya}`;
    for (let y = ya; y < yb; y += 6) d += ` q 6,3 0,6`;
    el("path", {d, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
    el("text", {x: g.xs[0] + 10, y: (ya + yb) / 2, "font-size": 10, fill: css("--hl2")}, "alszik");
  }
  svg.setAttribute("viewBox", `0 0 ${g.W} ${g.H + 62}`);
  const tx = 18, ty = g.H + 18;
  el("rect", {x: tx - 8, y: ty - 16, width: 560, height: 24, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: tx, y: ty, "font-size": 12}, "A állapota: " + s.a);
  el("text", {x: tx + 170, y: ty, "font-size": 12}, "fogadópuffer: " + s.buf + " / 6 bájt");
  el("text", {x: tx + 380, y: ty, "font-size": 12, "font-weight": "bold"}, "read() = " + (s.ret === null ? "–" : s.ret));
}
function toggleBuf(){ setSteps(document.getElementById("buf").checked ? S6 : S9); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
