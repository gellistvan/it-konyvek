<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-touch és lapelhelyezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sorrend: <select onchange="order(this.value)" aria-label="Sorrend"><option value="A">(A) hibás: előbb írás a CPU 0-n</option><option value="B">(B) helyes: előbb affinitás</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két NUMA node négy-négy CPU-val és 1 GiB memóriával; a 64 MiB-os tömb lapjai az első író CPU node-jára kerülnek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus modell a 13.3.4 példatopológiáján (node0: CPU 0–3, node1: CPU 4–7, node-onként 1 GiB; 64 MiB-os tömb = 16 384 lap, az ábrán 16 jelképes lap). A „numa_maps” sor a várt kimenet, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"kind": "A", "pages": null, "thread": null, "writer": null, "access": null, "line": -1, "msg": "(A) mmap(64 MiB, MAP_PRIVATE | MAP_ANONYMOUS): a lapok még nincsenek lefoglalva."}, {"kind": "A", "pages": 0, "thread": null, "writer": 0, "access": null, "line": 1, "msg": "(A) A főszál a CPU 0-n inicializálja (írja) a tömböt → first-touch: mind a 16 384 lap a node0-ra kerül."}, {"kind": "A", "pages": 0, "thread": 4, "writer": null, "access": null, "line": 0, "msg": "(A) A munkaszál csak most kötődik a CPU 4-re (node1) – a lapok már a node0-n vannak, nem költöznek."}, {"kind": "A", "pages": 0, "thread": 4, "writer": null, "access": "remote", "line": 2, "msg": "(A) Olvasás a CPU 4-ről: minden hozzáférés távoli (interconnect, távolság 20); várt kimenet: „cpu 4: numa_maps node=0 (várt: 1)”; N_remote/N = 1."}];
const CODE = ["pin_to_cpu(cpu);                       // affinitás (sched_setaffinity + ellenőrzés)", "for (off = 0; off < size; off += page) p[off] = ...;   // első írás = first-touch", "olvasás(p, size);                     // a lapok node-ja dönti el: helyi vagy távoli"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = {"A": [{"kind": "A", "pages": null, "thread": null, "writer": null, "access": null, "line": -1, "msg": "(A) mmap(64 MiB, MAP_PRIVATE | MAP_ANONYMOUS): a lapok még nincsenek lefoglalva."}, {"kind": "A", "pages": 0, "thread": null, "writer": 0, "access": null, "line": 1, "msg": "(A) A főszál a CPU 0-n inicializálja (írja) a tömböt → first-touch: mind a 16 384 lap a node0-ra kerül."}, {"kind": "A", "pages": 0, "thread": 4, "writer": null, "access": null, "line": 0, "msg": "(A) A munkaszál csak most kötődik a CPU 4-re (node1) – a lapok már a node0-n vannak, nem költöznek."}, {"kind": "A", "pages": 0, "thread": 4, "writer": null, "access": "remote", "line": 2, "msg": "(A) Olvasás a CPU 4-ről: minden hozzáférés távoli (interconnect, távolság 20); várt kimenet: „cpu 4: numa_maps node=0 (várt: 1)”; N_remote/N = 1."}], "B": [{"kind": "B", "pages": null, "thread": null, "writer": null, "access": null, "line": -1, "msg": "(B) mmap(64 MiB, MAP_PRIVATE | MAP_ANONYMOUS): a lapok még nincsenek lefoglalva."}, {"kind": "B", "pages": null, "thread": 4, "writer": null, "access": null, "line": 0, "msg": "(B) A munkaszál ELŐBB a CPU 4-re kötődik (pin_to_cpu, sched_getaffinity-vel ellenőrizve)."}, {"kind": "B", "pages": 1, "thread": 4, "writer": 4, "access": null, "line": 1, "msg": "(B) Első írás a CPU 4-ről → first-touch: mind a 16 384 lap a node1-re kerül."}, {"kind": "B", "pages": 1, "thread": 4, "writer": null, "access": "local", "line": 2, "msg": "(B) Olvasás a CPU 4-ről: minden hozzáférés helyi (távolság 10); várt kimenet: „cpu 4: numa_maps node=1 (várt: 1)”; N_remote/N = 0."}]};
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--hl2")}"/></marker>
    <pattern id="p0" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.3" fill="${css("--line")}"/></pattern>
    <pattern id="p1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1.4"/></pattern>`;
  [[0, 20], [1, 340]].forEach(([n, x0]) => {
    el("rect", {x: x0, y: 20, width: 240, height: 230, rx: 10, fill: "none", stroke: css("--line"), "stroke-width": 1.6});
    el("text", {x: x0 + 120, y: 42, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "node" + n);
    for (let c = 0; c < 4; c++) { const cpu = 4 * n + c, act = s.thread === cpu, wr = s.writer === cpu;
      el("rect", {x: x0 + 14 + c * 55, y: 55, width: 48, height: 34, fill: act || wr ? css("--cellhl") : css("--cell"), stroke: act || wr ? css("--hl") : css("--line"), "stroke-width": act || wr ? 3 : 1});
      el("text", {x: x0 + 38 + c * 55, y: 77, "text-anchor": "middle", "font-size": 12}, "CPU" + cpu); }
    el("text", {x: x0 + 226, y: 110, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, "1 GiB memória");
    el("rect", {x: x0 + 14, y: 118, width: 212, height: 118, fill: css("--cell"), stroke: css("--line")});
    if (s.pages === n) for (let k = 0; k < 16; k++) el("rect", {x: x0 + 22 + (k % 8) * 25.5, y: 128 + Math.floor(k / 8) * 52, width: 21, height: 46, fill: `url(#p${n})`, stroke: css("--line"), "stroke-width": 0.7});
  });
  el("rect", {x: 262, y: 160, width: 76, height: 26, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 300, y: 177, "text-anchor": "middle", "font-size": 11}, "interconnect");
  if (s.writer !== null) { const n = s.writer < 4 ? 0 : 1, x0 = n ? 340 : 20;
    el("text", {x: x0 + 120, y: 268, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, `first-touch: CPU${s.writer} ír → lapok a node${n}-n`); }
  if (s.access === "remote") { el("path", {d: "M 378 91 C 340 140, 260 120, 200 150", fill: "none", stroke: css("--hl2"), "stroke-width": 4, "stroke-dasharray": "9 6", "marker-end": "url(#ah)"});
    el("text", {x: 300, y: 115, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, "távoli (20)"); }
  if (s.access === "local") { el("line", {x1: 378, y1: 91, x2: 378, y2: 126, stroke: css("--hl2"), "stroke-width": 4, "marker-end": "url(#ah)"});
    el("text", {x: 384, y: 112, "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, " helyi (10)"); }
  el("text", {x: 20, y: 292, "font-size": 12, fill: css("--muted")}, "SLIT: [[10, 20], [20, 10]] (a 20 példaérték) · pöttyözött = node0-lap, sraffozott = node1-lap");
}
function order(v){ setSteps(SC[v]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
