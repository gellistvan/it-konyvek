<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCFS és RR Gantt-diagram</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Teszteset: <select id="tc" onchange="load(true)"><option>T1</option><option selected>T2</option><option>T3</option><option>T4</option><option>T5</option><option>T6</option><option>T7</option><option>T8</option><option>saját</option></select></label><label>Politika: <select id="pol"><option>FCFS</option><option selected>RR</option></select></label><label>q: <input id="q" type="number" min="1" max="20" value="1" style="width:4em"></label><label>Feladatok (id: érkezés, CPU): <input id="inp" value="P1: 0, 6; P2: 0, 3" size="28"></label><button onclick="document.getElementById('tc').value='saját';load(false)">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Gantt-sáv lépésenként: a T2 tesztben P1 és P2 egységenként váltakozik 6-ig, utána P1 fut 9-ig; mellette a ready sor tartalma."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A szimuláció a fejezet fcfs/rr pszeudokódjának átirata (kiemelt sor). Egyprocesszoros modell, kontextusváltási költség nélkül; holtverseny: a lejárt szeletű feladat az új érkező elé kerül. A ready a szelethatáron, a következő érkezések besorolása után látszik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 1, "segs": [[0, 1, "P1"]], "ready": ["P2", "P1"], "line": 31, "msg": "P1 fut [0,1); szelet lejárt, P1 a sor végére (hátra: 5); t = 1, ready = [P2, P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 2, "segs": [[0, 1, "P1"], [1, 2, "P2"]], "ready": ["P1", "P2"], "line": 31, "msg": "P2 fut [1,2); szelet lejárt, P2 a sor végére (hátra: 2); t = 2, ready = [P1, P2]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 3, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"]], "ready": ["P2", "P1"], "line": 31, "msg": "P1 fut [2,3); szelet lejárt, P1 a sor végére (hátra: 4); t = 3, ready = [P2, P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 4, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"]], "ready": ["P1", "P2"], "line": 31, "msg": "P2 fut [3,4); szelet lejárt, P2 a sor végére (hátra: 1); t = 4, ready = [P1, P2]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 5, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"], [4, 5, "P1"]], "ready": ["P2", "P1"], "line": 31, "msg": "P1 fut [4,5); szelet lejárt, P1 a sor végére (hátra: 3); t = 5, ready = [P2, P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 6, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"], [4, 5, "P1"], [5, 6, "P2"]], "ready": ["P1"], "line": 33, "msg": "P2 fut [5,6); P2 kész t = 6-nél, válaszidő 1−0 = 1; t = 6, ready = [P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 7, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"], [4, 5, "P1"], [5, 6, "P2"], [6, 7, "P1"]], "ready": ["P1"], "line": 31, "msg": "P1 fut [6,7); szelet lejárt, P1 a sor végére (hátra: 2); t = 7, ready = [P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 8, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"], [4, 5, "P1"], [5, 6, "P2"], [6, 7, "P1"], [7, 8, "P1"]], "ready": ["P1"], "line": 31, "msg": "P1 fut [7,8); szelet lejárt, P1 a sor végére (hátra: 1); t = 8, ready = [P1]", "fin": false, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}, {"t": 9, "segs": [[0, 1, "P1"], [1, 2, "P2"], [2, 3, "P1"], [3, 4, "P2"], [4, 5, "P1"], [5, 6, "P2"], [6, 7, "P1"], [7, 8, "P1"], [8, 9, "P1"]], "ready": [], "line": 33, "msg": "P1 fut [8,9); P1 kész t = 9-nél, válaszidő 0−0 = 0; t = 9, ready = []", "fin": true, "resp": {"P2": 1, "P1": 0}, "mk": 9, "name": "T2 (RR, q=1)"}];
const CODE = ["function fcfs(jobs):", "    order = sort(jobs, key = (arrival, id))   # rögzített holtverseny: id", "    t = 0", "    for job in order:", "        if t < job.arrival:", "            t = job.arrival                    # a CPU tétlen a következő érkezésig", "        job.start = t", "        t = t + job.cpu_time", "        job.completion = t", "        job.response_time = job.start - job.arrival", "    return average(job.response_time), t", "", "function rr(jobs, quantum):                    # quantum > 0", "    pending = sort(jobs, key = (arrival, id))", "    ready = empty queue", "    i = 0", "    t = 0", "    while i < len(pending) or ready is not empty:", "        while i < len(pending) and pending[i].arrival <= t:", "            ready.push(pending[i])", "            i = i + 1", "        if ready is empty:", "            t = pending[i].arrival             # ugrás a következő érkezéshez", "            continue", "        job = ready.pop()", "        if job.first_run is undefined:", "            job.first_run = t", "        run_time = min(quantum, job.remaining)", "        t = t + run_time", "        job.remaining = job.remaining - run_time", "        if job.remaining > 0:", "            ready.push(job)                    # a lejárt időszeletű feladat a sor végére", "        else:", "            job.completion = t", "            job.response_time = job.first_run - job.arrival", "    return average(job.response_time), t"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const TESTS = {"T1": ["P1: 0, 6; P2: 0, 3", "FCFS", 1], "T2": ["P1: 0, 6; P2: 0, 3", "RR", 1], "T3": ["P1: 0, 6; P2: 3, 3", "FCFS", 1], "T4": ["P1: 0, 6; P2: 3, 3", "RR", 1], "T5": ["P1: 0, 2; P2: 3, 2; P3: 10, 1", "FCFS", 1], "T6": ["P1: 0, 2; P2: 3, 2; P3: 10, 1", "RR", 1], "T7": ["P1: 0, 5; P2: 1, 1", "RR", 2], "T8": ["P1: 0, 1; P2: 0, 1", "FCFS", 1]};
const LN = {"idleF": 5, "runF": 7, "idleR": 22, "push": 31, "done": 33, "arrive": 18};
function parseJobs(spec){
  const jobs = [];
  for (const part of spec.split(";")) {
    if (!part.trim()) continue;
    const m = part.split(":"); if (m.length !== 2) throw "formátum: id: érkezés, CPU; …";
    const v = m[1].split(",").map(x => Number(x.trim()));
    if (v.length !== 2 || !v.every(Number.isInteger) || v[0] < 0 || v[1] < 1) throw "egész érkezés ≥ 0 és CPU ≥ 1 kell";
    jobs.push({id: m[0].trim(), arrival: v[0], cpu: v[1]});
  }
  if (!jobs.length || jobs.length > 6) throw "1–6 feladat adható meg";
  return jobs;
}
function simFCFS(jobs){
  const order = jobs.map((j, x) => [j, x]).sort((a, b) => a[0].arrival - b[0].arrival || a[1] - b[1]).map(p => p[0]);
  let t = 0; const segs = [], steps = [], resp = {};
  order.forEach((job, n) => {
    if (t < job.arrival) { segs.push([t, job.arrival, null]); t = job.arrival;
      steps.push({t, segs: segs.slice(), ready: [], line: LN.idleF, msg: `Üres sor: a CPU tétlen ${segs[segs.length-1][0]}–${t} között; t = ${t}`}); }
    const start = t; t += job.cpu; segs.push([start, t, job.id]); resp[job.id] = start - job.arrival;
    const waiting = order.slice(n + 1).filter(j => j.arrival <= t).map(j => j.id);
    steps.push({t, segs: segs.slice(), ready: waiting, line: LN.runF,
                msg: `${job.id} fut [${start},${t}); kész t = ${t}-nél; válaszidő ${start}−${job.arrival} = ${resp[job.id]}`});
  });
  return {steps, resp, mk: t};
}
function simRR(jobs, q){
  const pending = jobs.map((j, x) => [j, x]).sort((a, b) => a[0].arrival - b[0].arrival || a[1] - b[1]).map(p => p[0]);
  const rem = {}, arr = {}, first = {}, resp = {}; jobs.forEach(j => { rem[j.id] = j.cpu; arr[j.id] = j.arrival; });
  let ready = [], i = 0, t = 0; const segs = [], steps = [];
  let guard = 0;
  while ((i < pending.length || ready.length) && guard++ < 500) {
    while (i < pending.length && pending[i].arrival <= t) { ready.push(pending[i].id); i++; }
    if (!ready.length) { segs.push([t, pending[i].arrival, null]); t = pending[i].arrival;
      steps.push({t, segs: segs.slice(), ready: [], line: LN.idleR, msg: `Üres sor: t = pending[i].arrival = ${t} (tétlen ${segs[segs.length-1][0]}–${t})`}); continue; }
    const job = ready.shift(); if (!(job in first)) first[job] = t;
    const run = Math.min(q, rem[job]); segs.push([t, t + run, job]); const t0 = t; t += run; rem[job] -= run;
    let line, what;
    if (rem[job] > 0) { ready.push(job); line = LN.push; what = `szelet lejárt, ${job} a sor végére (hátra: ${rem[job]})`; }
    else { resp[job] = first[job] - arr[job]; line = LN.done; what = `${job} kész t = ${t}-nél, válaszidő ${first[job]}−${arr[job]} = ${resp[job]}`; }
    const shown = ready.concat(pending.slice(i).filter(p => p.arrival <= t).map(p => p.id));
    steps.push({t, segs: segs.slice(), ready: shown, line, msg: `${job} fut [${t0},${t}); ${what}; t = ${t}, ready = [${shown.join(", ")}]`});
  }
  return {steps, resp, mk: t};
}
function build(jobs, pol, q, name){
  const r = pol === "FCFS" ? simFCFS(jobs) : simRR(jobs, q);
  const st = r.steps;
  st.forEach((s, x) => { s.fin = x === st.length - 1; s.resp = r.resp; s.mk = r.mk; s.name = name; });
  return st;
}
const PAT = {P1: "url(#pP1)", P2: "url(#pP2)"};
function render(s){
  svg.setAttribute("viewBox", "0 0 640 250"); svg.innerHTML = "";
  const fg = css("--fg"), line = css("--line"), cell = css("--cell"), hl = css("--hl");
  const defs = el("defs", {});
  [["pP1", "M-1,5 L5,-1 M-1,1 L1,-1 M3,5 L5,3", 4], ["pP2", "M2,2 h0.1", 5]].forEach(([id, d, w]) => {
    const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", w); p.setAttribute("height", w);
    p.setAttribute("patternUnits", "userSpaceOnUse");
    const r = document.createElementNS(NS, "rect"); r.setAttribute("width", w); r.setAttribute("height", w); r.setAttribute("fill", id === "pP1" ? css("--cellhl") : cell); p.appendChild(r);
    const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", d); pa.setAttribute("stroke", line);
    pa.setAttribute("stroke-width", id === "pP1" ? 1 : 2.2); pa.setAttribute("stroke-linecap", "round"); p.appendChild(pa); defs.appendChild(p);
  });
  const T = Math.max(s.mk, 1), x0 = 50, W = 560, sx = W / T, y = 50;
  el("text", {x: x0, y: 26, "font-size": 13, "font-weight": "bold"}, s.name);
  for (let t = 0; t <= T; t++) {
    if (T > 30 && t % 5) continue;
    el("line", {x1: x0 + t * sx, y1: y - 6, x2: x0 + t * sx, y2: y + 46, stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("text", {x: x0 + t * sx, y: y + 62, "text-anchor": "middle", "font-size": 11}, String(t));
  }
  s.segs.forEach((g, x) => {
    const last = x === s.segs.length - 1;
    if (g[2] === null) { el("text", {x: x0 + (g[0] + g[1]) / 2 * sx, y: y + 25, "text-anchor": "middle", "font-size": 16}, "—"); return; }
    el("rect", {x: x0 + g[0] * sx, y, width: (g[1] - g[0]) * sx, height: 40, fill: PAT[g[2]] || cell,
                stroke: last ? hl : line, "stroke-width": last ? 3 : 1.2});
    el("text", {x: x0 + (g[0] + g[1]) / 2 * sx, y: y + 25, "text-anchor": "middle", "font-size": 12, "font-weight": "bold",
                "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, g[2]);
  });
  el("line", {x1: x0 + s.t * sx, y1: y - 12, x2: x0 + s.t * sx, y2: y + 50, stroke: hl, "stroke-width": 2});
  el("text", {x: x0 + s.t * sx, y: y - 15, "text-anchor": "middle", "font-size": 11, fill: hl}, "t = " + s.t);
  el("text", {x: x0, y: 150, "font-size": 12}, "ready:");
  s.ready.forEach((r, x) => {
    el("rect", {x: x0 + 50 + x * 50, y: 135, width: 44, height: 24, fill: PAT[r] || cell, stroke: line});
    el("text", {x: x0 + 72 + x * 50, y: 152, "text-anchor": "middle", "font-size": 12, "font-weight": "bold",
                "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, r);
  });
  if (!s.ready.length) el("text", {x: x0 + 50, y: 152, "font-size": 12, fill: css("--muted")}, "üres");
  if (s.fin) {
    const ids = Object.keys(s.resp).sort(), avg = ids.reduce((a, b) => a + s.resp[b], 0) / ids.length;
    el("text", {x: x0, y: 195, "font-size": 12}, "válaszidők: " + ids.map(i => `${i} = ${s.resp[i]}`).join(", ") +
       "; átlag = " + String(+avg.toFixed(2)).replace(".", ",") + "; makespan = " + s.mk);
  }
  el("text", {x: x0, y: 236, "font-size": 10, fill: css("--muted")}, "P1 sraffozott, P2 pontminta, egyéb üres · „—” = tétlen · egyprocesszoros modell, váltási költség nélkül");
}
function load(fromTest){
  const msg = document.getElementById("err");
  try {
    const tsel = document.getElementById("tc").value;
    if (fromTest && tsel !== "saját") {
      const [spec, pol, q] = TESTS[tsel];
      document.getElementById("inp").value = spec; document.getElementById("pol").value = pol; document.getElementById("q").value = q;
    }
    const jobs = parseJobs(document.getElementById("inp").value);
    const pol = document.getElementById("pol").value, q = Number(document.getElementById("q").value);
    if (!Number.isInteger(q) || q < 1 || q > 20) throw "q: 1–20 közötti egész";
    msg.textContent = "";
    setSteps(build(jobs, pol, q, (fromTest && tsel !== "saját" ? tsel + " " : "") + (pol === "FCFS" ? "(FCFS)" : `(RR, q=${q})`)));
  } catch (e) { msg.textContent = String(e); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
