<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trap és kontextusváltás két feladat között</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Út: <select id="kind" onchange="pickK()"><option value="timer">timer-preempció (PID 1 → PID 2)</option><option value="ecall">ecall (SYS_WRITE)</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A timer-megszakítás a PID 1 user regisztereit a trapframe-be menti, a switch_to a kernel callee-saved regisztereket cseréli, majd a PID 2 a saját trapframe-jéből sret-tel tér vissza user módba."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, a fejezet kódja és a T-O13-039 javítása szerint (saját kernelverem és trapframe feladatonként, sscratch ← az új feladat kernelvermének teteje, satp + sfence.vma a kilépő úton).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "line": -1, "msg": "1. PID 1 U-módban fut: sp = user verem, sscratch = PID 1 kernelvermének teteje.", "hl": ["P1.user"], "reg": {"pc": "0x10A4", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "–", "SPP": "U (0)", "SIE": "1", "satp": "P1 címtere", "a0": "?", "scause": "–", "cur": "PID 1"}}, {"n": 2, "line": -1, "msg": "2. Timer-megszakítás: scause = 0x8000…0005; a hardver: sepc ← pc (0x10A4), SPP ← 0 (U), SPIE ← SIE, SIE ← 0, pc ← stvec = trap_vector.", "hl": ["cpu"], "reg": {"pc": "trap_vector", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 3, "line": 0, "msg": "3. csrrw sp, sscratch, sp: sp = 0x80210000 (PID 1 kernelverem teteje), sscratch = user sp.", "hl": ["P1.kstack"], "reg": {"pc": "trap_vector", "sp": "0x80210000", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 4, "line": 2, "msg": "4. addi sp, sp, -272; a 31 GPR, a user sp (+8), sepc (+248) és sstatus (+256) a trapframe-be; sp = a0 = 0x8020FEF0.", "hl": ["P1.tf"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 5, "line": 4, "msg": "5. trap_handler(tf) → timer_interrupt_handler → a kvantum lejárt → schedule (SIE = 0).", "hl": ["cpu"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 6, "line": 8, "msg": "6. switch_to(&P1.ctx, &P2.ctx): ra, sp, s0–s11 → P1.ctx; P2.ctx → regiszterek; ra = P2 mentett címe (a schedule-ban); sscratch ← PID 2 kernelverem teteje.", "hl": ["P1.ctx", "P2.ctx"], "reg": {"pc": "schedule (PID 2)", "sp": "0x80211EB0", "sscratch": "0x80212000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 2"}}, {"n": 7, "line": 11, "msg": "7. PID 2 kilépő ága: regiszterek a P2 trapframe-jéből, csrw satp (P2 címtere) + sfence.vma, csrrw sp, sscratch, sp, sret → pc = P2 sepc (0x2040), U-mód.", "hl": ["P2.tf", "P2.user"], "reg": {"pc": "0x2040", "sp": "0x3FFFFFF000", "sscratch": "0x80212000", "sepc": "0x2040", "SPP": "U (0)", "SIE": "1", "satp": "P2 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 2"}}];
const CODE = ["csrrw sp, sscratch, sp      # sp <-> sscratch: sp = kernel stack, sscratch = user sp", "addi  sp, sp, -272          # 31 regiszter + sepc + sstatus, 16-ra igazitva", "sd    t0, 248(sp)", "call  trap_handler", "timer_interrupt_handler();", "tf->sepc += 4;", "tf->a0 = (uint64_t)syscall_table[nr](tf);", "switch_to(&prev->ctx, &next->ctx);", "ld ra, 0(a1)", "csrw  sepc, t0              # a handler altal esetleg modositott sepc", "csrrw sp, sscratch, sp      # sp = user sp, sscratch = kernel stack teteje", "sret"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ST = [{"n": 1, "line": -1, "msg": "1. PID 1 U-módban fut: sp = user verem, sscratch = PID 1 kernelvermének teteje.", "hl": ["P1.user"], "reg": {"pc": "0x10A4", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "–", "SPP": "U (0)", "SIE": "1", "satp": "P1 címtere", "a0": "?", "scause": "–", "cur": "PID 1"}}, {"n": 2, "line": -1, "msg": "2. Timer-megszakítás: scause = 0x8000…0005; a hardver: sepc ← pc (0x10A4), SPP ← 0 (U), SPIE ← SIE, SIE ← 0, pc ← stvec = trap_vector.", "hl": ["cpu"], "reg": {"pc": "trap_vector", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 3, "line": 0, "msg": "3. csrrw sp, sscratch, sp: sp = 0x80210000 (PID 1 kernelverem teteje), sscratch = user sp.", "hl": ["P1.kstack"], "reg": {"pc": "trap_vector", "sp": "0x80210000", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 4, "line": 2, "msg": "4. addi sp, sp, -272; a 31 GPR, a user sp (+8), sepc (+248) és sstatus (+256) a trapframe-be; sp = a0 = 0x8020FEF0.", "hl": ["P1.tf"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 5, "line": 4, "msg": "5. trap_handler(tf) → timer_interrupt_handler → a kvantum lejárt → schedule (SIE = 0).", "hl": ["cpu"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 1"}}, {"n": 6, "line": 8, "msg": "6. switch_to(&P1.ctx, &P2.ctx): ra, sp, s0–s11 → P1.ctx; P2.ctx → regiszterek; ra = P2 mentett címe (a schedule-ban); sscratch ← PID 2 kernelverem teteje.", "hl": ["P1.ctx", "P2.ctx"], "reg": {"pc": "schedule (PID 2)", "sp": "0x80211EB0", "sscratch": "0x80212000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 2"}}, {"n": 7, "line": 11, "msg": "7. PID 2 kilépő ága: regiszterek a P2 trapframe-jéből, csrw satp (P2 címtere) + sfence.vma, csrrw sp, sscratch, sp, sret → pc = P2 sepc (0x2040), U-mód.", "hl": ["P2.tf", "P2.user"], "reg": {"pc": "0x2040", "sp": "0x3FFFFFF000", "sscratch": "0x80212000", "sepc": "0x2040", "SPP": "U (0)", "SIE": "1", "satp": "P2 címtere", "a0": "?", "scause": "0x8000000000000005", "cur": "PID 2"}}], SE = [{"n": 1, "line": -1, "msg": "1. PID 1 U-módban fut: sp = user verem, sscratch = PID 1 kernelvermének teteje. A következő utasítás: ecall (a7 = SYS_WRITE).", "hl": ["P1.user"], "reg": {"pc": "0x10A4", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "–", "SPP": "U (0)", "SIE": "1", "satp": "P1 címtere", "a0": "?", "scause": "–", "cur": "PID 1"}}, {"n": 2, "line": -1, "msg": "2. ecall: scause = 8 (környezethívás U-módból); sepc ← az ecall címe (0x10A4), SPP ← 0, SIE ← 0.", "hl": ["cpu"], "reg": {"pc": "trap_vector", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "8 (ecall U)", "cur": "PID 1"}}, {"n": 3, "line": 0, "msg": "3. csrrw sp, sscratch, sp: sp = 0x80210000 (PID 1 kernelverem teteje), sscratch = user sp.", "hl": ["P1.kstack"], "reg": {"pc": "trap_vector", "sp": "0x80210000", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "8 (ecall U)", "cur": "PID 1"}}, {"n": 4, "line": 2, "msg": "4. addi sp, sp, -272; a 31 GPR, a user sp (+8), sepc (+248) és sstatus (+256) a trapframe-be; sp = a0 = 0x8020FEF0.", "hl": ["P1.tf"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A4", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "8 (ecall U)", "cur": "PID 1"}}, {"n": 5, "line": 5, "msg": "5. trap_handler: tf->sepc += 4 (0x10A8) MÉG a dispatch előtt – az sret az ecall UTÁNI utasításra tér.", "hl": ["P1.tf"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A8", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "?", "scause": "8 (ecall U)", "cur": "PID 1"}}, {"n": 6, "line": 6, "msg": "6. syscall_dispatch: sys_write(1, buf, 3) → tf->a0 = 3 (a trapframe a0 mezője).", "hl": ["P1.tf"], "reg": {"pc": "trap_vector", "sp": "0x8020FEF0", "sscratch": "0x3FFFFFF000", "sepc": "0x10A8", "SPP": "U (0)", "SIE": "0", "satp": "P1 címtere", "a0": "3", "scause": "8 (ecall U)", "cur": "PID 1"}}, {"n": 7, "line": 11, "msg": "7. Kilépés: csrw sepc (0x10A8), a regiszterek a trapframe-ből (a0 = 3), csrrw sp, sscratch, sp; sret → PID 1 U-módban folytatódik 0x10A8-on.", "hl": ["P1.user"], "reg": {"pc": "0x10A8", "sp": "0x3FFFFFF000", "sscratch": "0x80210000", "sepc": "0x10A8", "SPP": "U (0)", "SIE": "1", "satp": "P1 címtere", "a0": "3", "scause": "8 (ecall U)", "cur": "PID 1"}}];
function pickK(){ setSteps(document.getElementById("kind").value === "ecall" ? SE : ST); }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), on = x => s.hl.includes(x);
  const B = (x, y, w, h, key, t, dash) => { el("rect", {x, y, width: w, height: h, fill: on(key) ? css("--cellhl") : cell, stroke: on(key) ? hl : line, "stroke-width": on(key) ? 3 : 1, "stroke-dasharray": dash || "none"});
    t.split("\n").forEach((r, i) => el("text", {x: x + w / 2, y: y + 18 + i * 15, "text-anchor": "middle", "font-size": 11.5}, r)); };
  [["PID 1", 10, "P1", "0x80210000"], ["PID 2", 530, "P2", "0x80212000"]].forEach(([t, x, p, k2]) => {
    el("text", {x: x + 110, y: 16, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: s.reg.cur === t ? hl : css("--fg")}, t + (s.reg.cur === t ? " (current)" : ""));
    B(x, 24, 220, 34, p + ".user", "user verem (U)");
    B(x, 66, 220, 40, p + ".kstack", "kernelverem teteje = " + k2);
    B(x, 112, 220, 64, p + ".tf", "trapframe (272 B)\nra +0 … t6 +240\nsepc +248, sstatus +256");
    B(x, 184, 220, 46, p + ".ctx", "cpu_context\nra, sp, s0–s11", "3 3"); });
  B(250, 24, 260, 206, "cpu", "CPU (1 hart)");
  const R = s.reg, rows = [["pc", R.pc], ["sp", R.sp], ["sscratch", R.sscratch], ["sepc", R.sepc], ["scause", R.scause], ["SPP / SIE", R.SPP + " / " + R.SIE], ["satp", R.satp], ["a0", R.a0]];
  const prev = STEPS[Math.max(0, k - 1)].reg, keys = ["pc", "sp", "sscratch", "sepc", "scause", "SPP", "satp", "a0"];
  rows.forEach(([n, v], i) => { const ch = k > 0 && prev[keys[i]] !== R[keys[i]];
    el("text", {x: 262, y: 64 + i * 20, "font-size": 11.5, "font-weight": "bold", fill: ch ? hl : css("--fg")}, n);
    el("text", {x: 340, y: 64 + i * 20, "font-size": 11.5, style: "font-family:ui-monospace,monospace", fill: ch ? hl : css("--fg")}, v); });
  for (let i = 0; i < 7; i++){ const x = 10 + i * 106, act = i + 1 === s.n;
    el("rect", {x, y: 250, width: 100, height: 26, fill: act ? css("--cellhl") : cell, stroke: act ? hl : mut, "stroke-width": act ? 2.5 : 1});
    el("text", {x: x + 50, y: 268, "text-anchor": "middle", "font-size": 12, "font-weight": act ? "bold" : "normal"}, String(i + 1) + ". lépés"); }
  el("text", {x: 10, y: 300, "font-size": 11, fill: mut}, "kiemelt regiszter = ebben a lépésben változott; ferde vonalkázás helyett itt: kiemelt keret = az érintett terület");
  el("text", {x: 10, y: 318, "font-size": 11, fill: mut}, "RISC-V S-mód, 1 hart, OpenSBI, T-O13-039 szerinti javított modell; szemléltető címek.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
