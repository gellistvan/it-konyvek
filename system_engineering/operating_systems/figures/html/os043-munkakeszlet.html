<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Munkakészlet csúszó ablakkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Δ = <span id="dv">4</span> <input id="dd" type="range" min="1" max="8" value="4" oninput="load()" aria-label="Ablakméret Δ"></label><label>Sorozat: <input id="seq" size="28" value="1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5" aria-label="Saját lapreferencia-sorozat"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tizenkét elemű lapreferencia-sorozat, rajta a Δ hosszú ablak a t-edik hivatkozásig; alatta w(t, Δ) lépcsős görbéje."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Diszkrét ablak: (t − Δ, t] = a max(1, t − Δ + 1)…t indexű hivatkozások (12.2.1). Kezdőállapot: a fejezet sorozata, Δ = 4, t = 1; a t = 9 és t = 10 állapot a szöveg példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 1, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 1, "W": [1], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 1, Δ = 4: ablak a 1–1. hivatkozás, W = {1}, w = 1"}, {"t": 2, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 1, "W": [1, 2], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 2, Δ = 4: ablak a 1–2. hivatkozás, W = {1, 2}, w = 2"}, {"t": 3, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 1, "W": [1, 2, 3], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 3, Δ = 4: ablak a 1–3. hivatkozás, W = {1, 2, 3}, w = 3"}, {"t": 4, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 1, "W": [1, 2, 3], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 4, Δ = 4: ablak a 1–4. hivatkozás, W = {1, 2, 3}, w = 3"}, {"t": 5, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 2, "W": [1, 2, 3, 4], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 5, Δ = 4: ablak a 2–5. hivatkozás, W = {1, 2, 3, 4}, w = 4"}, {"t": 6, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 3, "W": [1, 2, 3, 4], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 6, Δ = 4: ablak a 3–6. hivatkozás, W = {1, 2, 3, 4}, w = 4"}, {"t": 7, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 4, "W": [1, 2, 4, 5], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 7, Δ = 4: ablak a 4–7. hivatkozás, W = {1, 2, 4, 5}, w = 4"}, {"t": 8, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 5, "W": [1, 2, 4, 5], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 8, Δ = 4: ablak a 5–8. hivatkozás, W = {1, 2, 4, 5}, w = 4"}, {"t": 9, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 6, "W": [1, 2, 5], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 9, Δ = 4: ablak a 6–9. hivatkozás, W = {1, 2, 5}, w = 3"}, {"t": 10, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 7, "W": [1, 2, 3, 5], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 10, Δ = 4: ablak a 7–10. hivatkozás, W = {1, 2, 3, 5}, w = 4"}, {"t": 11, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 8, "W": [1, 2, 3, 4], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 11, Δ = 4: ablak a 8–11. hivatkozás, W = {1, 2, 3, 4}, w = 4"}, {"t": 12, "d": 4, "seq": [1, 2, 3, 1, 4, 2, 5, 1, 2, 3, 4, 5], "lo": 9, "W": [2, 3, 4, 5], "w": [1, 2, 3, 3, 4, 4, 4, 4, 3, 4, 4, 4], "line": -1, "msg": "t = 12, Δ = 4: ablak a 9–12. hivatkozás, W = {2, 3, 4, 5}, w = 4"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fs(a){ return "{" + a.join(", ") + "}"; }
function wsteps(seq, d){
  const win = t => { const lo = Math.max(1, t - d + 1); return [lo, [...new Set(seq.slice(lo - 1, t))].sort((a, b) => a - b)]; };
  const wv = seq.map((_, i) => win(i + 1)[1].length);
  return seq.map((_, i) => { const t = i + 1, [lo, W] = win(t);
    return {t, d, seq, lo, W, w: wv, line: -1, msg: `t = ${t}, Δ = ${d}: ablak a ${lo}–${t}. hivatkozás, W = ${fs(W)}, w = ${W.length}`}; });
}
function render(s){
  const n = s.seq.length, x0 = 50, cw = Math.min(42, 500 / n), H = 320;
  svg.setAttribute("viewBox", `0 0 600 ${H}`); svg.innerHTML = "";
  const y0 = 70;
  s.seq.forEach((p, j) => { const i = j + 1, inside = i >= s.lo && i <= s.t;
    el("rect", {x: x0 + j*cw, y: y0, width: cw, height: 34, fill: inside ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    el("text", {x: x0 + j*cw + cw/2, y: y0 + 23, "text-anchor": "middle", "font-size": 16, "font-weight": inside ? "bold" : "normal"}, String(p));
    el("text", {x: x0 + j*cw + cw/2, y: y0 + 50, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i)); });
  const L = x0 + (s.t - s.d) * cw, Rt = x0 + s.t * cw;
  el("rect", {x: Math.max(x0 - 8, L), y: y0 - 6, width: Rt - Math.max(x0 - 8, L), height: 46, fill: "none", stroke: css("--hl"), "stroke-width": 3, "stroke-dasharray": "8 5"});
  if (s.t - s.d >= 0) { el("circle", {cx: L, cy: y0 - 14, r: 6, fill: css("--bg"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x: L, y: y0 - 26, "text-anchor": "middle", "font-size": 12}, "t − Δ = " + (s.t - s.d)); }
  el("circle", {cx: Rt, cy: y0 - 14, r: 6, fill: css("--line")});
  el("text", {x: Rt, y: y0 - 26 - (s.t - s.d >= 0 && s.d < 3 ? 14 : 0), "text-anchor": "middle", "font-size": 12}, "t = " + s.t);
  el("text", {x: x0, y: y0 + 80, "font-size": 15}, `W(${s.t}, ${s.d}) = ${fs(s.W)},  w(${s.t}, ${s.d}) = ${s.W.length}`);
  // w(t, Δ) lépcsős görbe
  const gy = 290, sc = 22, mx = Math.max(...s.w, 1);
  el("line", {x1: x0, y1: gy, x2: x0 + n*cw, y2: gy, stroke: css("--line")});
  el("line", {x1: x0, y1: gy, x2: x0, y2: gy - sc * Math.min(mx + 0.5, 8), stroke: css("--line")});
  for (let v = 0; v <= Math.min(mx, 8); v++) el("text", {x: x0 - 6, y: gy - v*sc + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(v));
  el("text", {x: x0 + n*cw + 8, y: gy + 4, "font-size": 12, fill: css("--muted")}, "t");
  el("text", {x: x0 - 40, y: gy - sc * Math.min(mx + 0.5, 8) - 6, "font-size": 12}, `w(t, ${s.d})`);
  s.w.forEach((v, j) => { const on = j + 1 === s.t;
    el("line", {x1: x0 + j*cw, y1: gy - v*sc, x2: x0 + (j+1)*cw, y2: gy - v*sc, stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 2});
    if (j > 0) el("line", {x1: x0 + j*cw, y1: gy - s.w[j-1]*sc, x2: x0 + j*cw, y2: gy - v*sc, stroke: css("--muted"), "stroke-dasharray": "2 3"});
    el("circle", {cx: x0 + (j+1)*cw, cy: gy - v*sc, r: on ? 5 : 3, fill: on ? css("--hl") : css("--line")}); });
}
function load(){
  const raw = document.getElementById("seq").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const d = +document.getElementById("dd").value, err = document.getElementById("err");
  document.getElementById("dv").textContent = d;
  if (raw.length < 1 || raw.length > 16 || raw.some(x => !Number.isInteger(x) || x < 0 || x > 99)) { err.textContent = "1–16 darab 0–99 közötti egész lapszámot adjon meg."; return; }
  err.textContent = ""; const keep = k; setSteps(wsteps(raw, d)); show(Math.min(keep, STEPS.length - 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
