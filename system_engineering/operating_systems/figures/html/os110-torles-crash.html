<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Törlési sorrend és összeomlási pontok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="crash">⚡ összeomlás itt</button> <fieldset style="border:0;margin:0;padding:0"><legend class="small" style="float:left;margin-right:6px">sorrend:</legend><label><input type="radio" name="ord" value="helyes" checked> javított (bitmap utoljára)</label> <label><input type="radio" name="ord" value="fordított"> fordított (bitmap a mutatók előtt)</label></fieldset></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt mező a memóriában és a lemezen: könyvtárbejegyzés, links, i_direct, bitmap-bitek, s_free_blocks. Lépésenként előbb a memória, majd a lemez változik. Az összeomlás gomb az fsck eredményét mutatja a lemez állapotán: a javított sorrendben minden pont helyreállítható, a fordítottban a bitmap- és az inode-lépés közötti összeomlás súlyos."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltétel: /a.txt, inode 5, blokk 30 és 31; minden lépés egy szinkron blokkírás, nincs napló. Az fsck-szabályok a 29.1.6 szerint: foglalt, de nem hivatkozott blokk felszabadítható; hivatkozott, de szabadnak jelölt blokk súlyos hiba (-EROFS).</p>

const CODE = ["/* minfs_unlink(\"/a.txt\") – minden sor egy szinkron blokkírás */", "dir_entry.d_inode = 0;            write_block(gyökérkönyvtár);", "ino5.i_links_count--;             write_block(inode-tábla);", "memset(ino5.i_direct, 0, ...);    write_block(inode-tábla);", "bitmap_clear(30); bitmap_clear(31); sb.s_free_blocks += 2; write_block(bitmap); write_block(sb);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"helyes": [{"disk": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "mem": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "chg": [], "phase": "kezdet", "sev": false, "res": "konzisztens: a fájl még megvan", "line": 0, "msg": "Kezdet (helyes sorrend): /a.txt → inode 5, blokk 30 és 31 foglalt. Lépj tovább, vagy nyomd meg az összeomlás gombot."}, {"disk": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "chg": [0], "phase": "mem", "sev": false, "res": "konzisztens: a fájl még megvan", "line": 1, "msg": "1. lépés – d_inode = 0 (bejegyzés törlése): módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "chg": [0], "phase": "disk", "sev": false, "res": "árva inode (links 1, nincs bejegyzés) → lost+found", "line": 1, "msg": "1. lépés – d_inode = 0 (bejegyzés törlése): kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "chg": [1], "phase": "mem", "sev": false, "res": "árva inode (links 1, nincs bejegyzés) → lost+found", "line": 2, "msg": "2. lépés – i_links_count 1 → 0: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "chg": [1], "phase": "disk", "sev": false, "res": "inode 5: links 0, de blokkot tart → inode és 30, 31 felszabadítása", "line": 2, "msg": "2. lépés – i_links_count 1 → 0: kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "0, 0", "1, 1", "F"], "chg": [2], "phase": "mem", "sev": false, "res": "inode 5: links 0, de blokkot tart → inode és 30, 31 felszabadítása", "line": 3, "msg": "3. lépés – inode-mutatók nullázása: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "0, 0", "1, 1", "F"], "mem": ["(törölve) 0", "0", "0, 0", "1, 1", "F"], "chg": [2], "phase": "disk", "sev": false, "res": "30, 31 foglalt, nincs hivatkozás (szivárgás) → felszabadítás", "line": 3, "msg": "3. lépés – inode-mutatók nullázása: kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "0", "0, 0", "1, 1", "F"], "mem": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "chg": [3, 4], "phase": "mem", "sev": false, "res": "30, 31 foglalt, nincs hivatkozás (szivárgás) → felszabadítás", "line": 4, "msg": "4. lépés – bitek 0-ra, s_free_blocks += 2: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "mem": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "chg": [3, 4], "phase": "disk", "sev": false, "res": "konzisztens: a törlés kész", "line": 4, "msg": "4. lépés – bitek 0-ra, s_free_blocks += 2: kiírva a lemezre (szinkron írás)."}], "fordított": [{"disk": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "mem": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "chg": [], "phase": "kezdet", "sev": false, "res": "konzisztens: a fájl még megvan", "line": 0, "msg": "Kezdet (fordított sorrend): /a.txt → inode 5, blokk 30 és 31 foglalt. Lépj tovább, vagy nyomd meg az összeomlás gombot."}, {"disk": ["a.txt → 5", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "chg": [0], "phase": "mem", "sev": false, "res": "konzisztens: a fájl még megvan", "line": 1, "msg": "1. lépés – d_inode = 0 (bejegyzés törlése): módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "chg": [0], "phase": "disk", "sev": false, "res": "árva inode (links 1, nincs bejegyzés) → lost+found", "line": 1, "msg": "1. lépés – d_inode = 0 (bejegyzés törlése): kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "1", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "chg": [1], "phase": "mem", "sev": false, "res": "árva inode (links 1, nincs bejegyzés) → lost+found", "line": 2, "msg": "2. lépés – i_links_count 1 → 0: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "chg": [1], "phase": "disk", "sev": false, "res": "inode 5: links 0, de blokkot tart → inode és 30, 31 felszabadítása", "line": 2, "msg": "2. lépés – i_links_count 1 → 0: kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "0", "30, 31", "1, 1", "F"], "mem": ["(törölve) 0", "0", "30, 31", "0, 0", "F+2"], "chg": [3, 4], "phase": "mem", "sev": false, "res": "inode 5: links 0, de blokkot tart → inode és 30, 31 felszabadítása", "line": 4, "msg": "3. lépés – bitek 0-ra, s_free_blocks += 2: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "30, 31", "0, 0", "F+2"], "mem": ["(törölve) 0", "0", "30, 31", "0, 0", "F+2"], "chg": [3, 4], "phase": "disk", "sev": true, "res": "inode 5 szabad blokkra (30, 31) mutat → kettős kiosztás, -EROFS", "line": 4, "msg": "3. lépés – bitek 0-ra, s_free_blocks += 2: kiírva a lemezre (szinkron írás)."}, {"disk": ["(törölve) 0", "0", "30, 31", "0, 0", "F+2"], "mem": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "chg": [2], "phase": "mem", "sev": true, "res": "inode 5 szabad blokkra (30, 31) mutat → kettős kiosztás, -EROFS", "line": 3, "msg": "4. lépés – inode-mutatók nullázása: módosítva a memóriában (sraffozott), még nincs a lemezen."}, {"disk": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "mem": ["(törölve) 0", "0", "0, 0", "0, 0", "F+2"], "chg": [2], "phase": "disk", "sev": false, "res": "konzisztens: a törlés kész", "line": 3, "msg": "4. lépés – inode-mutatók nullázása: kiírva a lemezre (szinkron írás)."}]};
let crash = false, lastK = -1;
const HDR = ["könyvtárbejegyzés", "inode 5: links", "inode 5: i_direct", "bitmap 30, 31", "s_free_blocks"];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  if (k !== lastK) { crash = false; lastK = k; }
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const defs = el("defs", {}); const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", "hm"); p.setAttribute("width", 8); p.setAttribute("height", 8); p.setAttribute("patternUnits", "userSpaceOnUse");
  const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", "M-1,9 L9,-1"); pa.setAttribute("stroke", mut); p.appendChild(pa); defs.appendChild(p);
  el("text", {x: 10, y: 22, "font-size": 13, "font-weight": "bold"}, "memória (kernel)");
  el("text", {x: 10, y: 122, "font-size": 13, "font-weight": "bold"}, "lemez (ezt látja az fsck)");
  for (let c = 0; c < 5; c++) {
    const x = 10 + c * 150, ch = s.chg.includes(c);
    el("text", {x: x + 70, y: 42, "text-anchor": "middle", "font-size": 11, fill: mut}, HDR[c]);
    el("rect", {x, y: 50, width: 140, height: 40, fill: (ch && s.phase === "mem") ? "url(#hm)" : cell, stroke: ch ? hl : line, "stroke-width": ch ? 3 : 1, "stroke-dasharray": (ch && s.phase === "mem") ? "6 3" : ""});
    el("text", {x: x + 70, y: 76, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 4}, s.mem[c]);
    el("text", {x: x + 70, y: 142, "text-anchor": "middle", "font-size": 11, fill: mut}, HDR[c]);
    el("rect", {x, y: 150, width: 140, height: 40, fill: cell, stroke: (ch && s.phase === "disk") ? hl : line, "stroke-width": (ch && s.phase === "disk") ? 3 : 1});
    el("text", {x: x + 70, y: 176, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, s.disk[c]);
  }
  if (crash) {
    el("rect", {x: 10, y: 210, width: 740, height: 70, fill: s.sev ? "url(#hm)" : cell, stroke: s.sev ? hl2 : hl, "stroke-width": 3});
    el("text", {x: 24, y: 236, "font-size": 13, "font-weight": "bold", fill: s.sev ? hl2 : hl}, (s.sev ? "✗ SÚLYOS" : "✓ helyreállítható") + " – összeomlás itt → fsck a lemez állapotán:");
    el("text", {x: 24, y: 262, "font-size": 13, "font-weight": "bold", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 4}, s.res);
  } else {
    el("text", {x: 10, y: 240, "font-size": 12, fill: mut}, "A memória tartalma összeomláskor elvész; az fsck csak a lemez sorát látja.");

document.getElementById("crash").addEventListener("click", () => { crash = true; lastK = k; render(STEPS[k]); status.textContent = STEPS[k].msg + " ⚡ Összeomlás: " + STEPS[k].res; });
document.querySelectorAll("input[name=ord]").forEach(r => r.addEventListener("change", () => setSteps(ALL[r.value])));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
