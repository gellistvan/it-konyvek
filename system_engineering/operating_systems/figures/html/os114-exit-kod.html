<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A tesztkernel kilépési kódjának útja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>eset <select id="casesel"><option value="pass">minden teszt PASS</option><option value="fail">teszthiba</option><option value="panic">pánik (qemu_exit előtt)</option><option value="loop">végtelen ciklus</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy doboz balról jobbra: kernel_main, QEMU isa-debug-exit, timeout és PIPESTATUS, run_tests.sh; felettük a soros napló útja. Teszthibánál a dobozokban sorban 1, 3, 3, 1 látszik; minden teszt sikeresnél 0, 1, 1, 0; pánik vagy végtelen ciklus esetén a QEMU nem lép ki, a timeout 124-et ad, a wrapper 2-t."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltétel: x86-64, -device isa-debug-exit,iobase=0xf4,iosize=0x04, bash PIPESTATUS. A QEMU a vendég code értékét (code << 1) | 1 alakban adja vissza; a pánik és a végtelen ciklus csak a timeout lejártával ér véget (124 → 2).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"case": "pass", "upto": 0, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 0, "msg": "minden teszt PASS: a kernel qemu_exit(0) → outb(0xf4, 0)"}, {"case": "pass", "upto": 1, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 1, "msg": "QEMU: exit((0 << 1) | 1) = 1"}, {"case": "pass", "upto": 2, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 2, "msg": "timeout 60s: a QEMU 1-gyel lépett ki, ezt adja tovább; PIPESTATUS[0] = 1"}, {"case": "pass", "upto": 3, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 3, "msg": "run_tests.sh: case 1 → ág „1) norm=0 ;;  # siker”, exit 0"}];
const CODE = ["qemu_exit(rc ? 1 : 0);  →  outb(0xf4, code);          /* vendég */", "QEMU isa-debug-exit: exit((code << 1) | 1)", "timeout 60s qemu-system-x86_64 ... | tee \"$log\";  raw=${PIPESTATUS[0]}", "case \"$raw\" in 1) norm=0 ;;", "                 3) norm=1 ;;", "                 124) norm=2 ;;  *) norm=2 ;;  esac;  exit \"$norm\""];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"pass": [{"case": "pass", "upto": 0, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 0, "msg": "minden teszt PASS: a kernel qemu_exit(0) → outb(0xf4, 0)"}, {"case": "pass", "upto": 1, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 1, "msg": "QEMU: exit((0 << 1) | 1) = 1"}, {"case": "pass", "upto": 2, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 2, "msg": "timeout 60s: a QEMU 1-gyel lépett ki, ezt adja tovább; PIPESTATUS[0] = 1"}, {"case": "pass", "upto": 3, "vals": ["code = 0", "exit(1)", "raw = 1", "norm = 0"], "norm": 0, "line": 3, "msg": "run_tests.sh: case 1 → ág „1) norm=0 ;;  # siker”, exit 0"}], "fail": [{"case": "fail", "upto": 0, "vals": ["code = 1", "exit(3)", "raw = 3", "norm = 1"], "norm": 1, "line": 0, "msg": "teszthiba: a kernel qemu_exit(1) → outb(0xf4, 1)"}, {"case": "fail", "upto": 1, "vals": ["code = 1", "exit(3)", "raw = 3", "norm = 1"], "norm": 1, "line": 1, "msg": "QEMU: exit((1 << 1) | 1) = 3"}, {"case": "fail", "upto": 2, "vals": ["code = 1", "exit(3)", "raw = 3", "norm = 1"], "norm": 1, "line": 2, "msg": "timeout 60s: a QEMU 3-gyel lépett ki, ezt adja tovább; PIPESTATUS[0] = 3"}, {"case": "fail", "upto": 3, "vals": ["code = 1", "exit(3)", "raw = 3", "norm = 1"], "norm": 1, "line": 4, "msg": "run_tests.sh: case 3 → ág „3) norm=1 ;;  # teszthiba”, exit 1"}], "panic": [{"case": "panic", "upto": 0, "vals": ["pánik: nincs qemu_exit", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 0, "msg": "pánik (qemu_exit előtt): a kernel pánikba esik a qemu_exit előtt"}, {"case": "panic", "upto": 1, "vals": ["pánik: nincs qemu_exit", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 1, "msg": "QEMU: a vendég nem írt a 0xf4 portra; -no-shutdown mellett a QEMU fut tovább"}, {"case": "panic", "upto": 2, "vals": ["pánik: nincs qemu_exit", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 2, "msg": "timeout 60s: 60 s után leállítja a QEMU-t: 124; PIPESTATUS[0] = 124"}, {"case": "panic", "upto": 3, "vals": ["pánik: nincs qemu_exit", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 5, "msg": "run_tests.sh: case 124 → ág „124|*) norm=2 ;;  # infrastruktúrahiba”, exit 2"}], "loop": [{"case": "loop", "upto": 0, "vals": ["végtelen ciklus", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 0, "msg": "végtelen ciklus: a kernel egy teszt végtelen ciklusba kerül"}, {"case": "loop", "upto": 1, "vals": ["végtelen ciklus", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 1, "msg": "QEMU: a vendég nem írt a 0xf4 portra; -no-shutdown mellett a QEMU fut tovább"}, {"case": "loop", "upto": 2, "vals": ["végtelen ciklus", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 2, "msg": "timeout 60s: 60 s után leállítja a QEMU-t: 124; PIPESTATUS[0] = 124"}, {"case": "loop", "upto": 3, "vals": ["végtelen ciklus", "nincs kilépés", "raw = 124 (lejárt)", "norm = 2"], "norm": 2, "line": 5, "msg": "run_tests.sh: case 124 → ág „124|*) norm=2 ;;  # infrastruktúrahiba”, exit 2"}]};
const TITLES = ["kernel_main", "QEMU isa-debug-exit", "timeout + PIPESTATUS", "run_tests.sh"];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 240"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  el("rect", {x: 10, y: 10, width: 740, height: 34, fill: "none", stroke: line, "stroke-dasharray": "6 4"});
  el("text", {x: 20, y: 32, "font-size": 12}, "soros napló: serial_write → -serial stdio → tee build/test.log (minden esetben megmarad)");
  for (let i = 0; i < 4; i++) { const x = 10 + i * 190, on = i <= s.upto, cur = i === s.upto;
    el("rect", {x, y: 70, width: 160, height: 110, rx: 6, fill: on ? cellhl : cell, stroke: cur ? hl : line, "stroke-width": cur ? 3.5 : 1.2});
    el("text", {x: x + 80, y: 92, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, TITLES[i]);
    el("text", {x: x + 80, y: 135, "text-anchor": "middle", "font-size": 14.5, "font-weight": "bold", fill: on ? (i === 3 ? (s.norm === 0 ? hl : hl2) : css("--fg")) : mut}, on ? s.vals[i] : "?");
    if (i < 3) el("line", {x1: x + 160, y1: 125, x2: x + 188, y2: 125, stroke: i < s.upto ? hl : mut, "stroke-width": i < s.upto ? 4 : 1.5}); }
  el("text", {x: 10, y: 215, "font-size": 12, fill: mut}, "norm: 0 = siker, 1 = teszthiba, 2 = infrastruktúrahiba (pánik, időtúllépés, QEMU-hiba)");
}
document.getElementById("casesel").addEventListener("change", e => setSteps(ALL[e.target.value]));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
