<title>FIFO és EASY backfill a laborpéldán</title>
<style>

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}

function simulateJS(jobs, backfill){
  let future = jobs.map(j => Object.assign({}, j)).sort((a, b) => a.arrive - b.arrive || a.prio - b.prio);
  let waiting = [], running = [], rejected = [], segs = [], out = [], free = new Set([1,2,3,4]), now = 0, guard = 0;
  while ((future.length || waiting.length || running.length) && guard++ < 500){
    const notes = [];
    while (future.length && future[0].arrive <= now){ const j = future.shift(); waiting.push(j); if (j.arrive === now && now > 0) notes.push(j.id + " érkezik"); }
    for (const r of running.slice()) if (r.end === now){ running.splice(running.indexOf(r), 1); r.nodes.forEach(n => free.add(n)); notes.push(r.id + " befejeződik"); }
    for (const j of waiting.slice()) if (j.nodes > TOTAL){ waiting.splice(waiting.indexOf(j), 1); rejected.push(j.id); notes.push(j.id + " elutasítva: " + j.nodes + " > " + TOTAL + " node"); }
    waiting.sort((a, b) => a.prio - b.prio);
    let line = 10;
    const start = (j, kind) => { const nodes = [...free].sort((a, b) => a - b).slice(0, j.nodes); nodes.forEach(n => free.delete(n));
      const sg = {id: j.id, nodes, start: now, end: now + j.time, kind}; running.push(sg); segs.push(sg); waiting.splice(waiting.indexOf(j), 1); };
    while (waiting.length && waiting[0].nodes <= free.size){ const j = waiting[0]; start(j, "fej"); notes.push(j.id + " indul (fej)"); line = 3; }
    let reserve = null;
    if (backfill && waiting.length){
      const head = waiting[0]; let freed = free.size; reserve = Infinity;
      if (head.nodes <= freed) reserve = now;
      else for (const r of running.slice().sort((a, b) => a.end - b.end)){ freed += r.nodes.length; if (freed >= head.nodes){ reserve = r.end; break; } }
      notes.push("fej " + head.id + ", rez=" + reserve);
      if (line !== 3) line = 6;
      for (const j of waiting.slice(1)) if (j.nodes <= free.size){
        if (now + j.time <= reserve){ start(j, "backfill"); notes.push(j.id + ": " + now + "+" + j.time + " ≤ " + reserve + " → backfill"); line = 9; }
        else { notes.push(j.id + ": " + now + "+" + j.time + " > " + reserve + " → vár"); if (line !== 3 && line !== 9) line = 8; }
      }
    }
    const nc = running.length ? Math.min(...running.map(r => r.end)) : null, na = future.length ? future[0].arrive : null;
    out.push({t: now, line, reserve, head: waiting.length ? waiting[0].id : null, waiting: waiting.map(j => j.id), rejected: rejected.slice(),
              segs: segs.map(x => Object.assign({}, x)), msg: "t=" + now + ": " + notes.join("; ")});
    if (nc === null && na === null){ waiting.slice().forEach(j => { waiting.splice(waiting.indexOf(j), 1); rejected.push(j.id); }); break; }
    now = Math.min(...[nc, na].filter(x => x !== null));
  }
  const span = segs.length ? Math.max(...segs.map(x => x.end)) : 0;
  out.push({t: span, line: 10, reserve: null, head: null, waiting: [], rejected: rejected.slice(), segs: segs.map(x => Object.assign({}, x)),
            msg: "t=" + span + ": minden feladat kész; make_span = " + span + ", elutasítva: " + (rejected.join(", ") || "–")});
  return out;
}

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
