<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QNX szinkron üzenetváltás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="late" type="checkbox" onchange="toggleLate()"> a szerver még nem hívta a MsgReceive-et</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram három életvonallal: kliens szál, mikrokernel, resource manager. 1. read() → MsgSend, a kliens SEND-blocked; 2. a kernel átmásolja a 64 bájtos kérést, a kliens REPLY-blocked, a szerver fut; 3. a szerver feldolgoz; 4. MsgReply, a kliens READY; 5. a szerver újra MsgReceive-ben vár, a kliens fut."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus modell: egymagos CPU, kliens prioritás 20, devc-ser 21; alapesetben a szerver előbb hívta a MsgReceive-et. QNX: 2 kernelbelépés (MsgSend, MsgReply) és 2 kontextusváltás; monolitikus kernelben a read() 1 trap, a driver a kernelben fut. A pontos költség mérendő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a szerver már hívta a MsgReceive(chid, …) hívást → RECEIVE-blocked; a kliens fut.", "st": {"K": "RUNNING", "S": "RECEIVE"}, "arr": [], "sw": null, "ke": null, "line": 0, "late": false}, {"msg": "1. A kliens read(fd, buf, 64) hívása a libc-ben MsgSend(coid, hdr, …) lesz: 1. kernelbelépés; a kliens SEND-blocked.", "st": {"K": "SEND", "S": "RECEIVE"}, "arr": [["K", "M", "MsgSend(coid, hdr, …)", "-"]], "sw": null, "ke": 1, "line": 1, "late": false}, {"msg": "2. A kernel közvetlenül a szerver pufferébe másolja a 64 bájtos kérést; a kliens REPLY-blocked, a szerver fut (1. kontextusváltás).", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [["M", "S", "kérés másolása (64 B)", "-"]], "sw": 1, "ke": null, "line": 2, "late": false}, {"msg": "3. A szerver feldolgozza a kérést (eszközművelet: UART-puffer olvasása); a kliens REPLY-blocked.", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [], "sw": null, "ke": null, "line": 3, "late": false}, {"msg": "4. MsgReply(rcvid, EOK, data, 64): 2. kernelbelépés; a kernel visszamásolja a 64 bájtot, a kliens READY.", "st": {"K": "READY", "S": "RUNNING"}, "arr": [["S", "M", "MsgReply(rcvid, EOK, data, 64)", "--"], ["M", "K", "válasz másolása (64 B)", "--"]], "sw": null, "ke": 2, "line": 4, "late": false}, {"msg": "5. A szerver ismét MsgReceive-ben RECEIVE-blocked; 2. kontextusváltás: a kliens fut, a read() 64-et ad vissza.", "st": {"K": "RUNNING", "S": "RECEIVE"}, "arr": [["S", "M", "MsgReceive()", "-"]], "sw": 2, "ke": null, "line": 5, "late": false}];
const CODE = ["szerver:  rcvid = MsgReceive(chid, &msg, sizeof msg, NULL);   // RECEIVE-blocked", "kliens:   n = read(fd, buf, 64);   // libc: MsgSend(coid, hdr, …) → SEND-blocked", "kernel:   kérés másolása a szerver pufferébe → kliens REPLY-blocked, szerver fut", "szerver:  /* eszközművelet: UART-puffer olvasása */", "szerver:  MsgReply(rcvid, EOK, data, 64);   // kliens READY", "szerver:  MsgReceive(...) újra; kliens: read() visszatér 64-gyel"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BASE = [{"msg": "Kezdet: a szerver már hívta a MsgReceive(chid, …) hívást → RECEIVE-blocked; a kliens fut.", "st": {"K": "RUNNING", "S": "RECEIVE"}, "arr": [], "sw": null, "ke": null, "line": 0, "late": false}, {"msg": "1. A kliens read(fd, buf, 64) hívása a libc-ben MsgSend(coid, hdr, …) lesz: 1. kernelbelépés; a kliens SEND-blocked.", "st": {"K": "SEND", "S": "RECEIVE"}, "arr": [["K", "M", "MsgSend(coid, hdr, …)", "-"]], "sw": null, "ke": 1, "line": 1, "late": false}, {"msg": "2. A kernel közvetlenül a szerver pufferébe másolja a 64 bájtos kérést; a kliens REPLY-blocked, a szerver fut (1. kontextusváltás).", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [["M", "S", "kérés másolása (64 B)", "-"]], "sw": 1, "ke": null, "line": 2, "late": false}, {"msg": "3. A szerver feldolgozza a kérést (eszközművelet: UART-puffer olvasása); a kliens REPLY-blocked.", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [], "sw": null, "ke": null, "line": 3, "late": false}, {"msg": "4. MsgReply(rcvid, EOK, data, 64): 2. kernelbelépés; a kernel visszamásolja a 64 bájtot, a kliens READY.", "st": {"K": "READY", "S": "RUNNING"}, "arr": [["S", "M", "MsgReply(rcvid, EOK, data, 64)", "--"], ["M", "K", "válasz másolása (64 B)", "--"]], "sw": null, "ke": 2, "line": 4, "late": false}, {"msg": "5. A szerver ismét MsgReceive-ben RECEIVE-blocked; 2. kontextusváltás: a kliens fut, a read() 64-et ad vissza.", "st": {"K": "RUNNING", "S": "RECEIVE"}, "arr": [["S", "M", "MsgReceive()", "-"]], "sw": 2, "ke": null, "line": 5, "late": false}], LATE = [{"msg": "Kezdet: a szerver még egy korábbi kérést dolgoz fel (fut), nem hívta a MsgReceive-et; a kliens fut.", "st": {"K": "RUNNING", "S": "RUNNING"}, "arr": [], "sw": null, "ke": null, "line": 0, "late": true}, {"msg": "1. A kliens read(fd, buf, 64) hívása a libc-ben MsgSend(coid, hdr, …) lesz: 1. kernelbelépés; a kliens SEND-blocked.", "st": {"K": "SEND", "S": "RUNNING"}, "arr": [["K", "M", "MsgSend(coid, hdr, …)", "-"]], "sw": null, "ke": 1, "line": 1, "late": true}, {"msg": "1b. A szerver még nem fogadott: a kliens SEND-blocked marad, a szerver tovább dolgozik.", "st": {"K": "SEND", "S": "RUNNING"}, "arr": [], "sw": 1, "ke": null, "line": 1, "late": true}, {"msg": "1c. A szerver meghívja a MsgReceive-et: a kernel azonnal talál várakozó küldőt.", "st": {"K": "SEND", "S": "RUNNING"}, "arr": [["S", "M", "MsgReceive()", "-"]], "sw": null, "ke": null, "line": 2, "late": true}, {"msg": "2. A kernel közvetlenül a szerver pufferébe másolja a 64 bájtos kérést; a kliens REPLY-blocked, a szerver fut (1. kontextusváltás).", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [["M", "S", "kérés másolása (64 B)", "-"]], "sw": null, "ke": null, "line": 2, "late": true}, {"msg": "3. A szerver feldolgozza a kérést (eszközművelet: UART-puffer olvasása); a kliens REPLY-blocked.", "st": {"K": "REPLY", "S": "RUNNING"}, "arr": [], "sw": null, "ke": null, "line": 3, "late": true}, {"msg": "4. MsgReply(rcvid, EOK, data, 64): 2. kernelbelépés; a kernel visszamásolja a 64 bájtot, a kliens READY.", "st": {"K": "READY", "S": "RUNNING"}, "arr": [["S", "M", "MsgReply(rcvid, EOK, data, 64)", "--"], ["M", "K", "válasz másolása (64 B)", "--"]], "sw": null, "ke": 2, "line": 4, "late": true}, {"msg": "5. A szerver ismét MsgReceive-ben RECEIVE-blocked; 2. kontextusváltás: a kliens fut, a read() 64-et ad vissza.", "st": {"K": "RUNNING", "S": "RECEIVE"}, "arr": [["S", "M", "MsgReceive()", "-"]], "sw": 2, "ke": null, "line": 5, "late": true}];
const LX = {K: 110, M: 290, S: 470};
const LN = {K: ["kliens szál", "prio 20"], M: ["mikrokernel", "procnto"], S: ["resource manager", "devc-ser, prio 21"]};
const STN = {RUNNING: "fut", READY: "READY", SEND: "SEND-blocked", REPLY: "REPLY-blocked", RECEIVE: "RECEIVE-blocked"};
function toggleLate(){ setSteps(document.getElementById("late").checked ? LATE : BASE); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 700 380");
  const list = STEPS;
  Object.keys(LX).forEach(n => {
    el("rect", {x: LX[n] - 72, y: 6, width: 144, height: 38, rx: 6, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: LX[n], y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, LN[n][0]);
    el("text", {x: LX[n], y: 38, "text-anchor": "middle", "font-size": 11}, LN[n][1]);
    el("line", {x1: LX[n], y1: 46, x2: LX[n], y2: 370, stroke: css("--muted"), "stroke-dasharray": "2 4"});
  });
  const dy = 300 / list.length;
  let y = 64;
  list.forEach((st, i) => {
    if (i > k) return;
    const yy = 60 + i * dy;
    ["K", "S"].forEach(n => {
      const v = st.st[n], run = v === "RUNNING";
      el("rect", {x: LX[n] - (run ? 6 : 10), y: yy, width: run ? 12 : 20, height: dy, fill: run ? css("--fg") : css("--cell"),
                  stroke: css("--line"), "stroke-dasharray": v === "READY" ? "3 2" : "none"});
      if (!run) el("text", {x: LX[n] + (n === "K" ? -16 : 16), y: yy + dy / 2 + 4, "text-anchor": n === "K" ? "end" : "start",
                            "font-size": 11, fill: i === k ? css("--hl2") : css("--fg")}, STN[v]);
    });
    st.arr.forEach((a, j) => {
      const ay = yy + 10 + j * 16, x1 = LX[a[0]], x2 = LX[a[1]], d = x2 > x1 ? 1 : -1;
      el("line", {x1: x1 + 12 * d, y1: ay, x2: x2 - 14 * d, y2: ay, stroke: i === k ? css("--hl") : css("--fg"), "stroke-width": 2,
                  "stroke-dasharray": a[3] === "--" ? "6 4" : "none"});
      el("path", {d: `M${x2 - 12 * d} ${ay} l${-9 * d} -5 l0 10 z`, fill: i === k ? css("--hl") : css("--fg")});
      el("text", {x: (x1 + x2) / 2, y: ay - 3, "text-anchor": "middle", "font-size": 10.5}, a[2]);
    });
    if (st.ke) el("text", {x: LX.M, y: yy + dy - 4, "text-anchor": "middle", "font-size": 10.5, "font-weight": "bold"}, "kernelbelépés " + st.ke);
    if (st.sw) el("text", {x: LX.M, y: yy + dy - (st.ke ? 18 : 4), "text-anchor": "middle", "font-size": 10.5, "font-weight": "bold"}, "⟳ kontextusváltás " + st.sw);
  });
  el("text", {x: 640, y: 70, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "állapot most:");
  el("text", {x: 640, y: 90, "text-anchor": "middle", "font-size": 12}, "kliens: " + STN[s.st.K]);
  el("text", {x: 640, y: 108, "text-anchor": "middle", "font-size": 12}, "szerver: " + STN[s.st.S]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
