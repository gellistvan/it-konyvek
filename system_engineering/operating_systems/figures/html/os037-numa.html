<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NUMA-elhelyezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
#status{margin:4px 0 6px;min-height:2.9em}
code{font:13px ui-monospace,monospace}
.small{font-size:12px;color:var(--muted)}
.clk{cursor:pointer}
.clk:focus{outline:3px solid var(--hl)}
</style>
</head>
<body>
<div class="ctl">
  <label>Folyamat CPU-ja: <select id="cpu" aria-label="Folyamat CPU-ja"><option value="0" selected>CPU 0 (Node 0)</option><option value="1">CPU 1 (Node 0)</option><option value="2">CPU 2 (Node 0)</option><option value="3">CPU 3 (Node 0)</option><option value="4">CPU 4 (Node 1)</option><option value="5">CPU 5 (Node 1)</option><option value="6">CPU 6 (Node 1)</option><option value="7">CPU 7 (Node 1)</option></select></label>
  <label>Lapok helye: <select id="mem" aria-label="Lapok csomópontja"><option value="0">Node 0 (bind)</option><option value="1" selected>Node 1 (bind)</option><option value="i">interleave (0,1)</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kétcsomópontos NUMA-rendszer nyolc maggal; a kiválasztott mag és a memória közötti elérés helyi vagy távoli."></svg>
<p>Parancs: <code id="cmd"></code></p>
<p class="small">A magra vagy a memóriablokkra kattintva (vagy Tab + Enter) is választhat. Modell: átlag = helyi arány · 200 + távoli arány · 600 ciklus – a 2.1 táblázat szemléltető értékei, nem mérés.</p>
<script>
const TABLE = {"0-0": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=0 --membind=0 ./prog"], "0-1": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=0 --membind=1 ./prog"], "0-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=0 --interleave=0,1 ./prog"], "1-0": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=0 --membind=0 ./prog"], "1-1": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=0 --membind=1 ./prog"], "1-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=0 --interleave=0,1 ./prog"], "2-0": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=0 --membind=0 ./prog"], "2-1": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=0 --membind=1 ./prog"], "2-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=0 --interleave=0,1 ./prog"], "3-0": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=0 --membind=0 ./prog"], "3-1": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=0 --membind=1 ./prog"], "3-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=0 --interleave=0,1 ./prog"], "4-0": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=1 --membind=0 ./prog"], "4-1": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=1 --membind=1 ./prog"], "4-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=1 --interleave=0,1 ./prog"], "5-0": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=1 --membind=0 ./prog"], "5-1": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=1 --membind=1 ./prog"], "5-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=1 --interleave=0,1 ./prog"], "6-0": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=1 --membind=0 ./prog"], "6-1": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=1 --membind=1 ./prog"], "6-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=1 --interleave=0,1 ./prog"], "7-0": [0.0, 600.0, "távoli, ~600 ciklus (modell)", "numactl --cpunodebind=1 --membind=0 ./prog"], "7-1": [1.0, 200.0, "helyi, ~200 ciklus (modell)", "numactl --cpunodebind=1 --membind=1 ./prog"], "7-i": [0.5, 400.0, "vegyes (50 % helyi), ~400 ciklus (modell)", "numactl --cpunodebind=1 --interleave=0,1 ./prog"]};
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(tag, a, t){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function clickable(e, fn){ e.setAttribute("class", "clk"); e.setAttribute("tabindex", "0"); e.addEventListener("click", fn); e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }
function draw(){
  const cpu = +document.getElementById("cpu").value, mem = document.getElementById("mem").value;
  const memv = mem === "i" ? "i" : +mem, r = TABLE[cpu + "-" + mem], node = cpu < 4 ? 0 : 1;
  svg.innerHTML = "";
  [0, 1].forEach(n => {
    const x0 = 20 + n * 280;
    el("rect", {x: x0, y: 10, width: 240, height: 230, rx: 10, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x: x0 + 12, y: 32, "font-size": 15, "font-weight": "bold"}, "Node " + n);
    for (let q = 0; q < 4; q++) {
      const c = 4 * n + q, x = x0 + 15 + q * 55 + (q >= 2 ? 6 : 0), on = c === cpu;
      const g = el("rect", {x, y: 50, width: 48, height: 48, rx: 6, fill: on ? css("--hl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
      el("text", {x: x + 24, y: 79, "text-anchor": "middle", "font-size": 13, fill: on ? css("--bg") : css("--fg")}, "CPU " + c);
      g.setAttribute("aria-label", "CPU " + c); clickable(g, () => { document.getElementById("cpu").value = c; draw(); });
    }
    el("text", {x: x0 + 120, y: 116, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "SMT-párok: " + (n ? "4–5, 6–7" : "0–1, 2–3"));
    const has = memv === "i" || memv === n;
    const m = el("rect", {x: x0 + 15, y: 150, width: 210, height: 70, rx: 8, fill: has ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": has ? 3 : 1.2});
    m.setAttribute("aria-label", "Node " + n + " memória"); clickable(m, () => { document.getElementById("mem").value = String(n); draw(); });
    el("text", {x: x0 + 120, y: 178, "text-anchor": "middle", "font-size": 13}, "helyi memória" + (has ? (memv === "i" ? " (a lapok fele)" : " (a lapok)") : ""));
    el("text", {x: x0 + 120, y: 200, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, n ? "0x4000_0000 – 0x7FFF_FFFF" : "0x0000_0000 – 0x3FFF_FFFF");
  });
  const cx = 20 + node * 280 + 15 + (cpu % 4) * 55 + ((cpu % 4) >= 2 ? 6 : 0) + 24;
  [0, 1].forEach(n => {
    if (!(memv === "i" || memv === n)) return;
    const tx = 20 + n * 280 + 120, loc = n === node;
    el("line", {x1: cx, y1: 98, x2: tx, y2: 150, stroke: loc ? css("--line") : css("--hl2"), "stroke-width": 3, "stroke-dasharray": loc ? "none" : "8 5"});
    el("text", {x: (cx + tx) / 2 + 6, y: 146, "font-size": 12, fill: loc ? css("--fg") : css("--hl2")}, loc ? "helyi ~200" : "távoli ~600");
  });
  el("text", {x: 20, y: 272, "font-size": 15, "font-weight": "bold"}, "Elérés: " + r[2]);
  el("text", {x: 20, y: 292, "font-size": 11, fill: css("--muted")}, "folytonos: helyi · szaggatott: távoli (a csomópontok közti összeköttetésen át)");
  document.getElementById("status").textContent = `Folyamat a CPU ${cpu}-n (Node ${node}), lapok: ${mem === "i" ? "interleave 0,1" : "Node " + mem} → ${r[2]}`;
  document.getElementById("cmd").textContent = r[3];
}
document.getElementById("cpu").addEventListener("change", draw);
document.getElementById("mem").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
