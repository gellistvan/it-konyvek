<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLFQ-sorok és CFS-vruntime</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Nézet: <select id="tab" onchange="reload()"><option value="mlfq">MLFQ (8.3.1)</option><option value="cfs">CFS (8.3.2)</option></select></label><button onclick="jumpEv(-1)">◀ esemény</button><button onclick="jumpEv(1)">esemény ▶</button><span id="mctl"><label>Folyamatok (CPU/IO/CPU… ms): <input id="pin" size="22" value="8/22/6; 50; 15" aria-label="Folyamatok"></label> <label>Q0 <input id="q0" size="2" value="10"></label> <label>Q1 <input id="q1" size="2" value="20"></label> <label>Q2 <input id="q2" size="2" value="40"></label> <label>boost: <input id="bo" type="range" min="0" max="100" step="10" value="0" aria-label="Boost-periódus" oninput="reload()"> <span id="bov">nincs</span></label> <button onclick="reload()">Számol</button></span><span id="cctl" style="display:none"><label>Súlyok: <input id="cw" size="12" value="1024, 512" aria-label="CFS-súlyok"></label> <button onclick="reload()">Számol</button></span><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három MLFQ-sor folyamatkártyákkal, I/O-doboz és arányos Gantt-diagram ms-onként; CFS-fülön a vruntime-görbék."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

function mlfqJS(procs, quanta, boost){
  const P = procs.map(p => ({id: p.id, bursts: p.bursts.map(b => b.slice()), level: 0, rq: quanta[0], bi: 0, rb: p.bursts[0][0], ret: null, fin: null}));
  let ready = [[], [], []]; P.forEach((p, i) => ready[0].push(i));
  let blocked = [], cur = null, t = 0, carry = [];
  const steps = [], segs = [];
  const snap = (acts, line) => steps.push({t, line, ev: acts.some(a => [0,1,2,5,6].includes(a[0])), acts: acts.map(a => a[1]),
    run: cur === null ? null : {id: P[cur].id, lvl: P[cur].level, rb: P[cur].rb, rq: P[cur].rq},
    q: ready.map(lv => lv.map(i => ({id: P[i].id, rb: P[i].rb, rq: P[i].rq}))), io: blocked.map(i => ({id: P[i].id, ret: P[i].ret})),
    segs: segs.map(s => s.slice()), msg: "t = " + t + " ms: " + acts.map(a => a[1]).join("; ") + "."});
  while (P.some(p => p.fin === null) && t < 3000) {
    const acts = carry.slice(); carry = [];
    blocked.filter(i => P[i].ret === t).forEach(i => { blocked.splice(blocked.indexOf(i), 1); P[i].rq = quanta[P[i].level]; P[i].ret = null; ready[P[i].level].push(i);
      acts.push([0, P[i].id + " visszatér az I/O-ról a Q" + P[i].level + "-ba, új " + P[i].rq + " ms-os kvantummal"]); });
    if (boost && t > 0 && t % boost === 0) {
      if (cur !== null) { ready[0].push(cur); cur = null; }
      ready.forEach(lv => lv.forEach(i => { P[i].level = 0; P[i].rq = quanta[0]; }));
      ready = [ready[0].concat(ready[1], ready[2]), [], []];
      acts.push([1, "priority boost: mindenki a Q0-ba (" + boost + " ms-onként)"]);
    }
    if (cur !== null) for (let lv = 0; lv < P[cur].level; lv++) if (ready[lv].length) {
      ready[P[cur].level].unshift(cur); acts.push([2, P[cur].id + " preemptálódik, a Q" + P[cur].level + " elejére, " + P[cur].rq + " ms megmaradt kvantummal"]); cur = null; break; }
    if (cur === null) for (let lv = 0; lv < 3; lv++) if (ready[lv].length) { cur = ready[lv].shift(); P[cur].level = lv;
      acts.push([3, "kiválasztva: " + P[cur].id + " a Q" + lv + "-ból (hátra " + P[cur].rb + " ms, kvantum " + P[cur].rq + " ms)"]); break; }
    if (cur === null) { acts.push([4, "nincs futásra kész folyamat – üresjárat"]); snap(acts, Math.min(...acts.map(a => a[0]))); t++; continue; }
    if (!acts.some(a => a[0] !== 4)) acts.push([7, P[cur].id + " fut tovább"]);
    const imp = acts.map(a => a[0]);
    snap(acts, [2, 0, 1, 5, 6, 3].find(x => imp.includes(x)) ?? 7);
    const name = P[cur].id, L = segs[segs.length - 1];
    if (L && L[0] === name && L[2] === t) L[2] = t + 1; else segs.push([name, t, t + 1]);
    P[cur].rb--; P[cur].rq--; t++;
    const p = P[cur];
    if (p.rb === 0) {
      if (p.bi + 1 < p.bursts.length) { const io = p.bursts[p.bi][1]; p.ret = t + io; p.bi++; p.rb = p.bursts[p.bi][0]; blocked.push(cur);
        carry.push([5, p.id + " I/O-ra blokkol (" + io + " ms, vissza: " + (t + io) + " ms), a Q" + p.level + "-ban marad"]); }
      else { p.fin = t; carry.push([5, p.id + " befejeződik"]); }
      cur = null;
    } else if (p.rq === 0) { if (p.level < 2) p.level++; p.rq = quanta[p.level]; ready[p.level].push(cur);
      carry.push([6, p.id + " elhasználta a kvantumát → Q" + p.level + " (hátra " + p.rb + " ms)"]); cur = null; }
  }
  const cpu = P.map(p => p.bursts.reduce((s, b) => s + b[0], 0)), io = P.map(p => p.bursts.reduce((s, b) => s + b[1], 0));
  const T = P.map(p => p.fin), W = T.map((x, i) => x - cpu[i] - io[i]);
  const Tm = (T.reduce((a, b) => a + b, 0) / P.length).toFixed(2).replace(".", ",");
  steps.push({t, line: 5, ev: true, acts: carry.map(a => a[1]), run: null, q: [[], [], []], io: [], segs: segs.map(s => s.slice()), done: true,
    msg: "t = " + t + " ms: " + carry.map(a => a[1]).join("; ") + ". Átfutás: " + P.map((p, i) => p.id + " = " + T[i]).join(", ") + " ms, T̄ = " + Tm + "; W = " + W.join("/") + " ms."});
  steps.forEach(s => { s.tab = "mlfq"; s.tmax = t; });
  return steps;
}
function cfsJS(weights, latency, horizon){
  const n = weights.length, vr = Array(n).fill(0), sw = weights.reduce((a, b) => a + b, 0), steps = [], hist = weights.map(() => [0]);
  let t = 0;
  const f7 = x => x.toFixed(7).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",");
  while (t < horizon) {
    let i = 0; for (let j = 1; j < n; j++) if (vr[j] < vr[i]) i = j;
    const run = Math.max(1, Math.round(latency * weights[i] / sw));
    for (let k2 = 0; k2 < run && t < horizon; k2++) {
      steps.push({t, run: i, vr: vr.slice(), msg: "t = " + t + " ms: fut P" + (i + 1) + " (vruntime-ok: " + vr.map((v, j) => "P" + (j + 1) + " = " + f7(v)).join(", ") + ")"});
      vr[i] += 1 / weights[i]; t++; hist.forEach((h, j) => h.push(vr[j]));
    }
  }
  steps.push({t, run: null, vr: vr.slice(), done: true, msg: "t = " + t + " ms: vruntime-ok: " + vr.map((v, j) => "P" + (j + 1) + " = " + f7(v)).join(", ")});
  steps.forEach(s => { s.tab = "cfs"; s.hist = hist; s.horizon = horizon; s.line = -1; s.w = weights; });
  return steps;
}

function parseProcs(){
  return document.getElementById("pin").value.split(";").map(x => x.trim()).filter(x => x).map((x, i) => {
    const v = x.split("/").map(y => parseInt(y, 10)); const b = [];
    for (let j = 0; j < v.length; j += 2) b.push([v[j], j + 1 < v.length ? v[j + 1] : 0]);
    return {id: "P" + (i + 1), bursts: b};
  });
}
function reload(){
  const err = document.getElementById("err");
  const tab = document.getElementById("tab").value;
  document.getElementById("mctl").style.display = tab === "mlfq" ? "" : "none";
  document.getElementById("cctl").style.display = tab === "cfs" ? "" : "none";
  if (tab === "cfs") {
    const w = document.getElementById("cw").value.split(/[ ,;]+/).filter(x => x).map(Number);
    if (w.length < 1 || w.length > 5 || w.some(x => !(x >= 1))) { err.textContent = "1–5 pozitív súly."; return; }
    err.textContent = ""; setSteps(cfsJS(w, 12, 24)); return;
  }
  const ps = parseProcs(), qs = ["q0", "q1", "q2"].map(id => parseInt(document.getElementById(id).value, 10));
  const bo = +document.getElementById("bo").value; document.getElementById("bov").textContent = bo ? bo + " ms" : "nincs";
  if (!ps.length || ps.length > 5 || ps.some(p => p.bursts.some(b => !(b[0] >= 1) || !(b[1] >= 0))) || qs.some(q => !(q >= 1))) {
    err.textContent = "Folyamatonként CPU/IO/CPU/… ms, pontosvesszővel elválasztva (max. 5); kvantum ≥ 1."; return; }
  err.textContent = ""; setSteps(mlfqJS(ps, qs, bo));
}

  el("rect", {x, y, width: w, height: h, fill: css(PAT[nm] || "--cell"), stroke: css("--line")});
  const i = +nm.slice(1);
  if (i % 3 === 2) for (let xx = 0; xx < w; xx += 6) el("line", {x1: x + xx, y1: y + h, x2: x + Math.min(xx + 6, w), y2: y, stroke: css("--muted"), "stroke-width": 0.7});
  if (i % 3 === 0) for (let xx = 3; xx < w; xx += 6) for (let yy = 4; yy < h; yy += 6) el("circle", {cx: x + xx, cy: y + yy, r: 0.9, fill: css("--muted")});
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 640 310");
  codeEl.style.display = s.tab === "cfs" ? "none" : "";
  if (s.tab === "cfs") {
    const X0 = 70, W = 540 / s.horizon, Y0 = 250, mx = Math.max(...s.hist.flat(), 1e-9), H = 190;
    el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, "CFS: vruntime = futásidő / súly (súlyok: " + s.w.join(", ") + ")");
    el("line", {x1: X0, y1: Y0, x2: X0 + 540, y2: Y0, stroke: css("--line")}); el("line", {x1: X0, y1: Y0, x2: X0, y2: Y0 - H - 5, stroke: css("--line")});
    for (let t = 0; t <= s.horizon; t += 4) el("text", {x: X0 + t * W, y: Y0 + 16, "text-anchor": "middle", "font-size": 11}, String(t));
    [0, mx / 2, mx].forEach(v => el("text", {x: X0 - 6, y: Y0 - v / mx * H + 4, "text-anchor": "end", "font-size": 10}, v.toFixed(7).replace(/0+$/, "").replace(/\.$/, "").replace(".", ",")));
    s.hist.forEach((h, j) => {
      let d = ""; for (let t = 0; t <= s.t && t < h.length; t++) { const x = X0 + t * W, y = Y0 - h[t] / mx * H; d += (t ? " L" + x + "," + (Y0 - h[t - 1] / mx * H) + " L" : "M") + x + "," + y; }
      el("path", {d, fill: "none", stroke: j ? css("--hl2") : css("--hl"), "stroke-width": 2.5, "stroke-dasharray": j === 1 ? "6 4" : j > 1 ? "2 3" : "none"});
      el("text", {x: X0 + 8, y: 40 + j * 16, "font-size": 12, fill: j ? css("--hl2") : css("--hl")}, "P" + (j + 1) + (j === 1 ? " (szaggatott)" : j ? " (pontozott)" : " (folytonos)"));
    });
    if (!s.done) el("line", {x1: X0 + s.t * W, y1: Y0 - H - 5, x2: X0 + s.t * W, y2: Y0, stroke: css("--muted"), "stroke-dasharray": "2 2"});
    if (s.run !== null && s.run !== undefined) el("text", {x: 630, y: 20, "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, "fut: P" + (s.run + 1));
    return;
  }
  // MLFQ
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "t = " + s.t + " ms" + (s.run ? "  ·  fut: " + s.run.id + " (Q" + s.run.lvl + ", hátra " + s.run.rb + " ms, kvantum " + s.run.rq + " ms)" : ""));
  const qn = ["Q0 = " + document.getElementById("q0").value, "Q1 = " + document.getElementById("q1").value, "Q2 = " + document.getElementById("q2").value];
  s.q.forEach((lv, l) => {
    const y = 32 + l * 42;
    el("rect", {x: 10, y, width: 420, height: 36, fill: "none", stroke: css("--line")});
    el("text", {x: 16, y: y + 22, "font-size": 12, "font-weight": "bold"}, qn[l] + " ms");
    lv.forEach((c, j) => { bar(110 + j * 104, y + 4, 98, 28, c.id); el("rect", {x: 118 + j * 104, y: y + 9, width: 82, height: 18, fill: css("--bg"), opacity: 0.85});
      el("text", {x: 159 + j * 104, y: y + 22, "text-anchor": "middle", "font-size": 12}, c.id + " " + c.rb + "/" + c.rq); });
  });
  el("rect", {x: 445, y: 32, width: 185, height: 120, fill: "none", stroke: css("--line"), "stroke-dasharray": "6 4"});
  el("text", {x: 455, y: 52, "font-size": 12, "font-weight": "bold"}, "I/O");
  s.io.forEach((d, j) => el("text", {x: 455, y: 74 + j * 18, "font-size": 12}, d.id + " → vissza: " + d.ret + " ms"));
  const X0 = 30, W = 590 / Math.max(s.tmax, 1), y = 175;
  s.segs.forEach(([nm, a, b]) => { bar(X0 + a * W, y, (b - a) * W, 34, nm); if ((b - a) * W > 22) { el("rect", {x: X0 + (a + b) / 2 * W - 11, y: y + 9, width: 22, height: 16, fill: css("--bg"), opacity: 0.85}); el("text", {x: X0 + (a + b) / 2 * W, y: y + 22, "text-anchor": "middle", "font-size": 11}, nm); } });
  const marks = [...new Set(s.segs.map(g => g[1]).concat(s.segs.map(g => g[2])))];
  marks.forEach(t => el("text", {x: X0 + t * W, y: y + 50, "text-anchor": "middle", "font-size": 10}, String(t)));
  if (!s.done) el("line", {x1: X0 + s.t * W, y1: y - 6, x2: X0 + s.t * W, y2: y + 40, stroke: css("--hl2"), "stroke-width": 3});
  el("text", {x: 10, y: 255, "font-size": 11, fill: css("--muted")}, "kártya: hátralévő CPU / hátralévő kvantum (ms) · szaggatott keret: I/O");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
