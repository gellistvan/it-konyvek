<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMS és EDF</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Feladatsor: <select id="set" onchange="pickSet()"><option value="ex1">1. példa (1/4, 2/6, 3/12)</option><option value="ex2" selected>2. példa (2/5, 4/7)</option><option value="self">önellenőrző feladat (2/10, 3/8, 4/15)</option></select></label><table id="ttab" class="small"><thead><tr><th></th><th>C</th><th>T</th></tr></thead><tbody><tr><td>P1</td><td><input size="2" value="2" aria-label="P1 C"></td><td><input size="2" value="5" aria-label="P1 T"></td></tr><tr><td>P2</td><td><input size="2" value="4" aria-label="P2 C"></td><td><input size="2" value="7" aria-label="P2 T"></td></tr><tr style="display:none"><td>P3</td><td><input size="2" value="3" aria-label="P3 C"></td><td><input size="2" value="12" aria-label="P3 T"></td></tr><tr style="display:none"><td>P4</td><td><input size="2" value="1" aria-label="P4 C"></td><td><input size="2" value="20" aria-label="P4 T"></td></tr></tbody></table><button onclick="addTask()">+ feladat</button><label>horizont (ms): <input id="hz" size="3" value="14"></label><button onclick="reload()">Számol</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="RMS- és EDF-Gantt-sáv ms-onként, a kész feladatok abszolút határidejével és RMS-prioritásával, alul a válaszidő-elemzés iterációival; a 2. példában t = 7-nél RMS-határidő-sértés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egy CPU, preemptív, D_i = T_i, holtverseny: kisebb index; a rms_edf_check.c simulate() átirata (kiadáskor a be nem fejezett példány határidő-sértés, helyére az új lép).</p>

 7}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 3 ms: RMS → P2, EDF → P2."}, {"t": 4, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 1, "ready": [{"i": 1, "rem": 2, "d": 7}], "ev": [], "misses": []}, "ed": {"sel": 1, "ready": [{"i": 1, "rem": 2, "d": 7}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 4 ms: RMS → P2, EDF → P2."}, {"t": 5, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 0, "ready": [{"i": 0, "rem": 2, "d": 10}, {"i": 1, "rem": 1, "d": 7}], "ev": ["P1 kiadás, d = 10"], "misses": []}, "ed": {"sel": 1, "ready": [{"i": 0, "rem": 2, "d": 10}, {"i": 1, "rem": 1, "d": 7}], "ev": ["P1 kiadás, d = 10"], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 5 ms: P1 kiadás, d = 10. RMS → P1, EDF → P2."}, {"t": 6, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 0, "ready": [{"i": 0, "rem": 1, "d": 10}, {"i": 1, "rem": 1, "d": 7}], "ev": [], "misses": []}, "ed": {"sel": 0, "ready": [{"i": 0, "rem": 2, "d": 10}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 6 ms: RMS → P1, EDF → P1."}, {"t": 7, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 1, "ready": [{"i": 1, "rem": 4, "d": 14}], "ev": ["P2 határidő-sértés (1 egység maradt)", "P2 kiadás, d = 14"], "misses": [[7, 1, 1]]}, "ed": {"sel": 0, "ready": [{"i": 0, "rem": 1, "d": 10}, {"i": 1, "rem": 4, "d": 14}], "ev": ["P2 kiadás, d = 14"], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 7 ms: P2 határidő-sértés (1 egység maradt); P2 kiadás, d = 14. RMS → P2, EDF → P1."}, {"t": 8, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 1, "ready": [{"i": 1, "rem": 3, "d": 14}], "ev": [], "misses": [[7, 1, 1]]}, "ed": {"sel": 1, "ready": [{"i": 1, "rem": 4, "d": 14}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 8 ms: RMS → P2, EDF → P2."}, {"t": 9, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 1, "ready": [{"i": 1, "rem": 2, "d": 14}], "ev": [], "misses": [[7, 1, 1]]}, "ed": {"sel": 1, "ready": [{"i": 1, "rem": 3, "d": 14}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 9 ms: RMS → P2, EDF → P2."}, {"t": 10, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 0, "ready": [{"i": 0, "rem": 2, "d": 15}, {"i": 1, "rem": 1, "d": 14}], "ev": ["P1 kiadás, d = 15"], "misses": [[7, 1, 1]]}, "ed": {"sel": 1, "ready": [{"i": 0, "rem": 2, "d": 15}, {"i": 1, "rem": 2, "d": 14}], "ev": ["P1 kiadás, d = 15"], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 10 ms: P1 kiadás, d = 15. RMS → P1, EDF → P2."}, {"t": 11, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 0, "ready": [{"i": 0, "rem": 1, "d": 15}, {"i": 1, "rem": 1, "d": 14}], "ev": [], "misses": [[7, 1, 1]]}, "ed": {"sel": 1, "ready": [{"i": 0, "rem": 2, "d": 15}, {"i": 1, "rem": 1, "d": 14}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 11 ms: RMS → P1, EDF → P2."}, {"t": 12, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": 1, "ready": [{"i": 1, "rem": 1, "d": 14}], "ev": [], "misses": [[7, 1, 1]]}, "ed": {"sel": 0, "ready": [{"i": 0, "rem": 2, "d": 15}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 12 ms: RMS → P2, EDF → P1."}, {"t": 13, "H": 14, "tasks": [[2, 5], [4, 7]], "line": -1, "rm": {"sel": -1, "ready": [], "ev": [], "misses": [[7, 1, 1]]}, "ed": {"sel": 0, "ready": [{"i": 0, "rem": 1, "d": 15}], "ev": [], "misses": []}, "rmsegs": [["P1", 0, 2], ["P2", 2, 5], ["P1", 5, 7], ["P2", 7, 10], ["P1", 10, 12], ["P2", 12, 13], ["üres", 13, 14]], "edsegs": [["P1", 0, 2], ["P2", 2, 6], ["P1", 6, 8], ["P2", 8, 12], ["P1", 12, 14]], "rta": {"order": [0, 1], "out": {"0": [2], "1": [4, 6, 8]}}, "msg": "t = 13 ms: RMS → üres, EDF → P1."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SETS = {"ex1": {"tasks": [[1, 4], [2, 6], [3, 12]], "H": 12}, "ex2": {"tasks": [[2, 5], [4, 7]], "H": 14}, "self": {"tasks": [[2, 10], [3, 8], [4, 15]], "H": 15}};
function simJS(tasks, kind, dur){
  const n = tasks.length, rem = Array(n).fill(0), dl = Array(n).fill(0), nxt = Array(n).fill(0), segs = [], steps = [], misses = [];
  for (let t = 0; t < dur; t++) {
    const ev = [];
    for (let i = 0; i < n; i++) while (t === nxt[i]) {
      if (rem[i] > 0) { misses.push([t, i, rem[i]]); ev.push("P" + (i + 1) + " határidő-sértés (" + rem[i] + " egység maradt)"); }
      rem[i] = tasks[i][0]; dl[i] = t + tasks[i][1]; nxt[i] += tasks[i][1]; ev.push("P" + (i + 1) + " kiadás, d = " + dl[i]);
    }
    let sel = -1;
    for (let i = 0; i < n; i++) { if (rem[i] === 0) continue; if (sel === -1) { sel = i; continue; }
      if (kind === "rms") { if (tasks[i][1] < tasks[sel][1]) sel = i; } else if (dl[i] < dl[sel] || (dl[i] === dl[sel] && i < sel)) sel = i; }
    steps.push({t, sel, ready: rem.map((r, i) => ({i, rem: r, d: dl[i]})).filter(x => x.rem > 0), ev, misses: misses.slice()});
    const lab = sel >= 0 ? "P" + (sel + 1) : "üres", L = segs[segs.length - 1];
    if (L && L[0] === lab && L[2] === t) L[2] = t + 1; else segs.push([lab, t, t + 1]);
    if (sel >= 0) rem[sel]--;
  }
  return {segs, steps, misses};
}
function rtaJS(tasks){
  const order = tasks.map((x, i) => i).sort((a, b) => tasks[a][1] - tasks[b][1] || a - b), out = {};
  order.forEach((i, pos) => { const [c, T] = tasks[i], hp = order.slice(0, pos), R = [c];
    while (true) { const r = c + hp.reduce((s, j) => s + Math.ceil(R[R.length - 1] / tasks[j][1]) * tasks[j][0], 0); if (r === R[R.length - 1]) break; R.push(r); if (r > T) break; }
    out[i] = R; });
  return {order, out};
}
function build(tasks, H){
  const rm = simJS(tasks, "rms", H), ed = simJS(tasks, "edf", H), ra = rtaJS(tasks), st = [];
  for (let t = 0; t < H; t++) {
    const a = rm.steps[t], b = ed.steps[t];
    st.push({t, H, tasks, rm: a, ed: b, rmsegs: rm.segs, edsegs: ed.segs, rta: ra, line: -1,
      msg: "t = " + t + " ms: " + (a.ev.length ? a.ev.join("; ") + ". " : "") + "RMS → " + (a.sel >= 0 ? "P" + (a.sel + 1) : "üres") + ", EDF → " + (b.sel >= 0 ? "P" + (b.sel + 1) : "üres") +
           (b.ev.filter(e => e.includes("sértés")).length ? " · EDF: " + b.ev.filter(e => e.includes("sértés")).join("; ") : "") + "."});
  }
  return st;
}
function pickSet(){
  const s = SETS[document.getElementById("set").value];
  document.querySelectorAll("#ttab tbody tr").forEach((r, i) => { r.style.display = i < s.tasks.length ? "" : "none";
    if (i < s.tasks.length) { r.querySelectorAll("input")[0].value = s.tasks[i][0]; r.querySelectorAll("input")[1].value = s.tasks[i][1]; } });
  document.getElementById("hz").value = s.H;
  reload();
}
function reload(){
  const rows = [...document.querySelectorAll("#ttab tbody tr")].filter(r => r.style.display !== "none");
  const tasks = rows.map(r => [...r.querySelectorAll("input")].map(x => parseInt(x.value, 10)));
  const H = parseInt(document.getElementById("hz").value, 10), err = document.getElementById("err");
  if (tasks.some(([c, T]) => !(c >= 1) || !(T >= c) || T > 60) || !(H >= 1 && H <= 120)) { err.textContent = "1 ≤ C ≤ T ≤ 60, horizont 1–120 ms."; return; }
  err.textContent = ""; setSteps(build(tasks, H));
}
function addTask(){ const r = [...document.querySelectorAll("#ttab tbody tr")].find(x => x.style.display === "none"); if (r) { r.style.display = ""; reload(); } }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 640 330");
  const X0 = 50, W = 570 / s.H;
  const lanes = [["RMS", s.rmsegs, s.rm, 40], ["EDF", s.edsegs, s.ed, 100]];
  lanes.forEach(([nm, segs, cur, y]) => {
    el("text", {x: 8, y: y + 20, "font-size": 13, "font-weight": "bold"}, nm);
    segs.filter(g => g[1] <= s.t).forEach(([p, a, b]) => {
      const bb = Math.min(b, s.t + 1), i = p === "üres" ? -1 : +p.slice(1);
      el("rect", {x: X0 + a * W, y, width: (bb - a) * W, height: 30, fill: i < 0 ? "none" : (i % 2 ? css("--cellhl") : css("--cell")), stroke: i < 0 ? css("--muted") : css("--line"), "stroke-dasharray": i < 0 ? "3 3" : "none"});
      if (i % 3 === 2) for (let x = a * W; x < bb * W; x += 6) el("line", {x1: X0 + x, y1: y + 30, x2: X0 + Math.min(x + 6, bb * W), y2: y, stroke: css("--muted"), "stroke-width": 0.7});
      if ((bb - a) * W > 18) el("text", {x: X0 + (a + bb) / 2 * W, y: y + 20, "text-anchor": "middle", "font-size": 11}, i < 0 ? "–" : p);
    });
    cur.misses.forEach(([t, i, r]) => { el("text", {x: X0 + t * W, y: y + 24, "text-anchor": "middle", "font-size": 24, "font-weight": "bold", fill: "#d00000"}, "✕");
      el("text", {x: X0 + t * W + 10, y: y - 4, "font-size": 11, fill: "#d00000"}, "P" + (i + 1) + " sértés (" + r + " maradt)"); });
  });
  for (let t = 0; t <= s.H; t++) if (s.H <= 30 || t % 5 === 0) el("text", {x: X0 + t * W, y: 148, "text-anchor": "middle", "font-size": 10}, String(t));
  el("rect", {x: X0 + s.t * W, y: 34, width: W, height: 100, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  // kész feladatok táblázata
  const ty = 172;
  el("text", {x: 8, y: ty, "font-size": 12, "font-weight": "bold"}, "feladat");
  ["C/T", "RMS-prio.", "RMS: hátra / d", "EDF: hátra / d"].forEach((h, j) => el("text", {x: 90 + j * 120, y: ty, "font-size": 12, "font-weight": "bold"}, h));
  s.tasks.forEach(([c, T], i) => {
    const y = ty + 18 + i * 18, rr = s.rm.ready.find(x => x.i === i), er = s.ed.ready.find(x => x.i === i);
    const rank = s.rta.order.indexOf(i) + 1;
    el("text", {x: 8, y, "font-size": 12}, "P" + (i + 1));
    el("text", {x: 90, y, "font-size": 12}, c + "/" + T);
    el("text", {x: 210, y, "font-size": 12}, rank + ". (T = " + T + ")");
    [[rr, s.rm.sel, 330], [er, s.ed.sel, 450]].forEach(([r, sel, x]) => {
      if (sel === i) el("rect", {x: x - 4, y: y - 13, width: 112, height: 17, fill: css("--cellhl")});
      el("text", {x, y, "font-size": 12, "font-weight": sel === i ? "bold" : "normal"}, r ? r.rem + " / d = " + r.d + (sel === i ? " ◀" : "") : "–");
    });
  });
  // válaszidő-elemzés: az RMS által kiválasztott (vagy az utolsó) feladatra
  const fi = s.rm.sel >= 0 ? s.rm.sel : s.rta.order[s.rta.order.length - 1], R = s.rta.out[fi], T = s.tasks[fi][1];
  el("text", {x: 8, y: 318, "font-size": 12}, "Válaszidő-elemzés (RMS), P" + (fi + 1) + ": " + R.map((r, k2) => "R(" + k2 + ") = " + r).join(", ") +
     (R[R.length - 1] > T ? "  > T = " + T + " → nem ütemezhető" : "  ≤ T = " + T + " ✓"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
