<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két folyamat, ugyanaz a virtuális cím</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két folyamat 0x00400000 virtuális címe a saját laptáblájukon át két különböző fizikai keretre képeződik; egy kifejezetten osztott lap mindkettőből elérhető."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">32 bites címtér, 4 KiB-os lapok; szemléltető címek (példa, nem mért). A virtuális sávok nem arányosak, a fizikai memória sávja arányos.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 1, "msg": "1/5 – Két folyamat, két saját virtuális címtér. Mindkettőben van 0x00400000 cím; a 0 körüli sáv leképezetlen (NULL-védelem)."}, {"k": 2, "msg": "2/5 – P1 fordítása a P1 laptábláján át: P1: 0x00400000 → 0x02A3F000"}, {"k": 3, "msg": "3/5 – P2 fordítása a P2 laptábláján át: P2: 0x00400000 → 0x05170000 – ugyanaz a virtuális cím, más fizikai keret."}, {"k": 4, "msg": "4/5 – P1 a 0x05170000 címre próbál írni (P2 keretének fizikai címe). P1 csak virtuális címet adhat ki: laphiba: nincs ilyen leképezés P1 táblájában – hozzáférés megtagadva."}, {"k": 5, "msg": "5/5 – Kifejezetten osztott lap: P1 0x00600000 és P2 0x00A00000 ugyanarra a keretre (0x01C2D000) képeződik – csak kifejezett megosztásnál."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PA1 = 44298240, PA2 = 85393408, PSH = 29544448, PHYS = 134217728;
function hx(v){ return "0x" + v.toString(16).toUpperCase().padStart(8, "0"); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 320");
  svg.innerHTML = "";
  const fg = css("--fg"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl"), line = css("--line");
  const Y0 = 290, Y1 = 40;   // címtér alja/teteje
  function vbar(x, name, shva){
    el("rect", {x, y: Y1, width: 70, height: Y0 - Y1, fill: cell, stroke: line});
    el("rect", {x, y: Y0 - 30, width: 70, height: 30, fill: "url(#hatch)", stroke: line});
    el("text", {x: x + 35, y: Y0 - 11, "text-anchor": "middle", "font-size": 9}, "NULL-védelem");
    el("text", {x: x + 35, y: Y0 + 14, "text-anchor": "middle", "font-size": 9}, "0x00000000");
    el("text", {x: x + 35, y: Y1 - 8, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, name);
    el("rect", {x, y: 200, width: 70, height: 22, fill: cellhl, stroke: line, "stroke-width": 1.5});
    el("text", {x: x + 35, y: 215, "text-anchor": "middle", "font-size": 10}, "0x00400000");
    if (s.k >= 5) {
      el("rect", {x, y: 130, width: 70, height: 22, fill: cell, stroke: line, "stroke-dasharray": "5 3"});
      el("text", {x: x + 35, y: 145, "text-anchor": "middle", "font-size": 10}, shva);
    }
  }
  const defs = el("defs", {});
  const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hatch"); pat.setAttribute("width", 6); pat.setAttribute("height", 6);
  pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line");
  pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 6);
  pl.setAttribute("stroke", line); pl.setAttribute("stroke-width", 1); pat.appendChild(pl); defs.appendChild(pat);
  const mk = document.createElementNS(NS, "marker");
  mk.setAttribute("id", "ah"); mk.setAttribute("viewBox", "0 0 10 10"); mk.setAttribute("refX", 9); mk.setAttribute("refY", 5);
  mk.setAttribute("markerWidth", 7); mk.setAttribute("markerHeight", 7); mk.setAttribute("orient", "auto-start-reverse");
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d", "M0,0 L10,5 L0,10 z"); mp.setAttribute("fill", fg);
  mk.appendChild(mp); defs.appendChild(mk);
  vbar(10, "P1", "0x00600000"); vbar(100, "P2", "0x00A00000");
  // laptáblák
  function table(y, name, rows, on){
    el("rect", {x: 205, y, width: 160, height: 70, fill: on ? cellhl : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1.2});
    el("text", {x: 285, y: y + 16, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, name);
    rows.forEach((r, i) => el("text", {x: 285, y: y + 36 + i * 18, "text-anchor": "middle", "font-size": 10}, r));
  }
  const r1 = ["lap 0x00400 → keret 0x02A3F"], r2 = ["lap 0x00400 → keret 0x05170"];
  if (s.k >= 5) { r1.push("lap 0x00600 → keret 0x01C2D"); r2.push("lap 0x00A00 → keret 0x01C2D"); }
  table(50, "P1 laptábla", r1, s.k === 2 || s.k === 4);
  table(200, "P2 laptábla", r2, s.k === 3);
  // fizikai memória (arányos)
  const PX = 430, py = pa => Y0 - (Y0 - Y1) * pa / PHYS;
  el("rect", {x: PX, y: Y1, width: 60, height: Y0 - Y1, fill: cell, stroke: line});
  el("text", {x: PX + 30, y: Y1 - 8, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "fizikai mem. (128 MiB)");
  function frame(pa, lab, on, dashed){
    el("rect", {x: PX, y: py(pa) - 7, width: 60, height: 14, fill: on ? cellhl : cell, stroke: on ? hl : line,
                "stroke-width": on ? 3 : 1.2, "stroke-dasharray": dashed ? "5 3" : "none"});
    el("text", {x: PX + 64, y: py(pa) + 4, "font-size": 9}, hx(pa));
    el("text", {x: PX + 64, y: py(pa) + 15, "font-size": 9, fill: css("--muted")}, lab);
  }
  frame(PA1, "P1 kerete", s.k === 2, false);
  frame(PA2, "P2 kerete", s.k === 3, false);
  if (s.k >= 5) frame(PSH, "osztott keret", true, true);
  function arr(x1, y1, x2, y2, dash, color, w){
    el("line", {x1, y1, x2, y2, stroke: color || fg, "stroke-width": w || 2, "stroke-dasharray": dash, "marker-end": "url(#ah)"});
  }
  if (s.k === 2) { arr(80, 211, 205, 85, "none", hl, 2.5); arr(365, 85, PX, py(PA1), "none", hl, 2.5); }
  if (s.k === 3) { arr(170, 211, 205, 235, "2 3", hl, 2.5); arr(365, 235, PX, py(PA2), "2 3", hl, 2.5); }
  if (s.k === 4) {
    el("rect", {x: 10, y: 66, width: 70, height: 22, fill: cell, stroke: hl2, "stroke-width": 2, "stroke-dasharray": "4 3"});
    el("text", {x: 45, y: 81, "text-anchor": "middle", "font-size": 10}, "0x05170000");
    arr(80, 77, 205, 105, "none", hl2, 2.5);
    el("text", {x: 380, y: 112, "text-anchor": "middle", "font-size": 24, fill: hl2, "font-weight": "bold"}, "✗");
    el("text", {x: 285, y: 140, "text-anchor": "middle", "font-size": 11, fill: hl2, "font-weight": "bold"}, "laphiba: nincs ilyen leképezés");
    el("text", {x: 285, y: 154, "text-anchor": "middle", "font-size": 11, fill: hl2, "font-weight": "bold"}, "P1 táblájában – hozzáférés megtagadva");
  }
  if (s.k >= 5) {
    arr(80, 141, 205, 103, "6 4", fg, 1.5); arr(365, 103, PX, py(PSH), "6 4", fg, 1.5);
    arr(170, 141, 205, 253, "6 4", fg, 1.5); arr(365, 253, PX, py(PSH), "6 4", fg, 1.5);
    el("text", {x: 392, y: py(PSH) + 30, "text-anchor": "middle", "font-size": 9, "font-style": "italic"}, "csak kifejezett megosztásnál");
  }
  el("text", {x: 280, y: 314, "text-anchor": "middle", "font-size": 9, fill: css("--muted")},
     "folytonos = P1 · pontozott = P2 · szaggatott = osztott lap · szemléltető címek, 4 KiB-os lapok");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
