<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACPI tábla-lánc és device tree</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Balra az RSDP-től a DSDT-ig vezető mutatólánc és a belőle épülő névtér, jobbra a példa DTS fája; lépésenként az OS felfedezési útja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">x86-64 UEFI/q35 tipikus táblakészlet; a táblák helye firmware-függő; a \_GPE._L01 tipikus példa (a fejezet ASL-je csak a PCI0-t írja le). A serial interrupts sorára kattintva a cellák jelentése látszik (SPI 1 → GIC INTID 33, level-high).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sel": "rsdp", "msg": "1. RSDP keresése: a firmware által átadott (UEFI konfigurációs tábla) vagy a BIOS-területen az „RSD PTR ” aláírással megtalált mutató; ebből olvasható az XsdtAddress.", "line": -1}, {"sel": "xsdt", "msg": "2. XSDT: 64 bites fizikai címek listája – FACP, APIC (MADT), HPET, MCFG, SSDT.", "line": -1}, {"sel": "fadt", "msg": "3. FADT (aláírás: FACP): energia- és időzítőregiszterek, az X_DSDT mező a DSDT címe.", "line": -1}, {"sel": "dsdt", "msg": "4. DSDT betöltése: az AML-értelmező végrehajtja a definíciós blokkot – a névtérben megjelenik a \\_SB.PCI0.", "line": -1}, {"sel": "ns", "msg": "5. Névtér építése a DSDT és az SSDT-k alapján: \\_SB, PCI0 (_HID = PNP0A08), \\_GPE._L01.", "line": -1}, {"sel": "sta", "msg": "6. _STA() kiértékelése: 0x0F → jelen van, engedélyezve, látható, működik.", "line": -1}, {"sel": "crs", "msg": "7. _CRS: a PCI0 aktuális erőforrásai – buszszám 0–0xFF, MMIO 0xE0000000, 256 MiB (a fejezet ASL-je Name-ként, statikus sablonként adja meg; Method is lehetne).", "line": -1}, {"sel": "dtb", "msg": "8. DT 1/4: a bootloader átadja a DTB fizikai címét (AArch64-en az x0 regiszterben).", "line": -1}, {"sel": "root", "msg": "9. DT 2/4: gyökér „/”: compatible = \"acme,arm-iot-board\", #address-cells = <2>, #size-cells = <2> → minden reg négy cella (cím hi/lo, méret hi/lo).", "line": -1}, {"sel": "nodes", "msg": "10. DT 3/4: node-ok: cpus/cpu@0, memory@40000000 (0x40000000, 256 MiB), serial@9000000, interrupt-controller@8000000; a serial interrupt-parent-je phandle-lel az intc.", "line": -1}, {"sel": "match", "msg": "11. DT 4/4: compatible-illesztés: a serial@9000000 \"arm,pl011\" stringje a PL011 meghajtóhoz illeszkedik.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SHOWIRQ = false;
function box(x, y, w, h, txt, on, dbl, round){
  el("rect", {x, y, width: w, height: h, rx: round ? 10 : 0, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
  if (dbl) el("rect", {x: x + 3, y: y + 3, width: w - 6, height: h - 6, fill: "none", stroke: css("--line"), "stroke-width": 0.6});
  String(txt).split("\n").forEach((l, i, A) => el("text", {x: x + w / 2, y: y + h / 2 + 4 + (i - (A.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 11}, l));
}
function ln(x1, y1, x2, y2, dash){ el("line", {x1, y1, x2, y2, stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": dash || "none"}); }
const ORDER = ["rsdp", "xsdt", "fadt", "dsdt", "ns", "sta", "crs", "dtb", "root", "nodes", "match"];
function render(s){
  svg.setAttribute("viewBox", "0 0 780 400"); svg.innerHTML = "";
  const k0 = ORDER.indexOf(s.sel), seen = x => ORDER.indexOf(x) <= k0, on = x => s.sel === x;
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "ACPI");
  const T = [["rsdp", "RSDP\n„RSD PTR ”, XsdtAddress"], ["xsdt", "XSDT\nFACP APIC HPET MCFG SSDT"], ["fadt", "FADT (FACP)\nX_DSDT"], ["dsdt", "DSDT\nAML"]];
  T.forEach(([kk, t], i) => { box(10, 30 + i * 80, 190, 52, t, on(kk), true); if (i) ln(105, 30 + i * 80 - 28, 105, 30 + i * 80); });
  if (seen("dsdt")) {
    ln(200, 296, 284, 50, "6 4");
    const N = [["\\", 340, 46], ["\\_SB", 300, 110], ["\\_GPE", 410, 110], ["PCI0", 300, 175], ["_L01()", 410, 175], ["_HID: PNP0A08", 290, 245], ["_STA()", 400, 300], ["_CRS", 290, 355]];
    ln(340, 62, 300, 94); ln(300, 126, 300, 159);
    if (seen("ns")) { ln(340, 62, 410, 94); ln(410, 126, 410, 159); ln(300, 191, 290, 229); ln(300, 191, 400, 284); ln(300, 191, 290, 339); }
    N.forEach(([t, x, y], i) => { if (!seen("ns") && i > 3) return; if (!seen("ns") && (t === "\\_GPE" || t === "_L01()")) return;
      const hl = (t === "_STA()" && on("sta")) || (t === "_CRS" && on("crs")) || (t === "PCI0" && (on("dsdt") || on("ns")));
      box(x - 55, y - 16, 110, 32, t, hl, false, true); });
    if (seen("sta")) el("text", {x: 400, y: 334, "text-anchor": "middle", "font-size": 11, fill: css("--hl")}, "→ 0x0F");
    if (seen("crs")) { el("text", {x: 350, y: 350, "font-size": 10.5, fill: css("--hl")}, "busz 0–0xFF,");
                       el("text", {x: 350, y: 364, "font-size": 10.5, fill: css("--hl")}, "MMIO 0xE0000000, 256 MiB"); }
  }
  el("line", {x1: 470, y1: 6, x2: 470, y2: 394, stroke: css("--muted")});
  el("text", {x: 482, y: 18, "font-size": 13, "font-weight": "bold"}, "Device tree");
  if (k0 >= 7) {
    box(482, 30, 150, 34, "DTB (x0) → „/”", on("dtb") || on("root"), false, true);
    if (k0 >= 9) {
      const D = [["cpus/cpu@0", 482, 110], ["memory@40000000", 640, 110], ["serial@9000000", 482, 200], ["intc@8000000", 640, 200]];
      D.forEach(([t, x, y]) => { ln(557, 64, x + 65, y); box(x, y, 130, 34, t, (t.startsWith("serial") && on("match")), false, true); });
      el("line", {x1: 612, y1: 217, x2: 640, y2: 217, stroke: css("--line"), "stroke-dasharray": "5 3", "stroke-width": 1.4});
      el("text", {x: 590, y: 252, "font-size": 10, fill: css("--muted")}, "interrupt-parent (phandle)");
      el("text", {x: 640, y: 160, "font-size": 10, fill: css("--muted")}, "reg: 0x40000000, 256 MiB");
      const g = el("rect", {x: 482, y: 270, width: 290, height: 26, fill: css("--cell"), stroke: css("--hl"), "stroke-dasharray": "3 2", style: "cursor:pointer"});
      g.addEventListener("click", () => { SHOWIRQ = !SHOWIRQ; show(k); });
      el("text", {x: 490, y: 288, "font-size": 11, style: "pointer-events:none"}, "serial: interrupts = <0 1 4>  (kattints)");
      if (SHOWIRQ) ["0 → SPI (megosztott periféria-IT)", "1 → SPI 1 = GIC INTID 32 + 1 = 33", "4 → level-high (szintvezérelt, aktív magas)"]
        .forEach((t, i) => el("text", {x: 490, y: 314 + i * 16, "font-size": 11}, t));
      if (on("match")) el("text", {x: 482, y: 386, "font-size": 11.5, "font-weight": "bold", fill: css("--hl")}, "\"arm,pl011\" → PL011 UART meghajtó ✓");
    } else if (on("root")) el("text", {x: 482, y: 90, "font-size": 11}, "#address-cells = <2>, #size-cells = <2>");
  } else el("text", {x: 482, y: 50, "font-size": 11, fill: css("--muted")}, "(a 8. lépéstől)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
