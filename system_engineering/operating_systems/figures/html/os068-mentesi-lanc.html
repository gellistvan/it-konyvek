<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentési láncok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két sáv hét nappal: inkrementális (F, majd I1–I6, egyenként 5 egység) és differenciális (F, majd D1–D6, 5-től 30 egységig növekvő); a csütörtöki visszaállításhoz az inkrementálisnál F és I1–I4, a differenciálisnál F és D4 kell."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Vasárnap teljes mentés (100 egység), napi 5 egység nem átfedő változás (Python-számítás). A lépések a visszaállítási napot választják ki; a mentésre kattintva sérültnek jelölhető.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"day": 0, "line": -1, "msg": "Visszaállítás V napra – inkrementális: F (1 elem); differenciális: F (1 elem)"}, {"day": 1, "line": -1, "msg": "Visszaállítás H napra – inkrementális: F + I1 (2 elem); differenciális: F + D1 (2 elem)"}, {"day": 2, "line": -1, "msg": "Visszaállítás K napra – inkrementális: F + I1 + I2 (3 elem); differenciális: F + D2 (2 elem)"}, {"day": 3, "line": -1, "msg": "Visszaállítás Sze napra – inkrementális: F + I1 + I2 + I3 (4 elem); differenciális: F + D3 (2 elem)"}, {"day": 4, "line": -1, "msg": "Visszaállítás Cs napra – inkrementális: F + I1 + I2 + I3 + I4 (5 elem); differenciális: F + D4 (2 elem)"}, {"day": 5, "line": -1, "msg": "Visszaállítás P napra – inkrementális: F + I1 + I2 + I3 + I4 + I5 (6 elem); differenciális: F + D5 (2 elem)"}, {"day": 6, "line": -1, "msg": "Visszaállítás Szo napra – inkrementális: F + I1 + I2 + I3 + I4 + I5 + I6 (7 elem); differenciális: F + D6 (2 elem)"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DAYS = ["V", "H", "K", "Sze", "Cs", "P", "Szo"], INC = [["F", 100], ["I1", 5], ["I2", 5], ["I3", 5], ["I4", 5], ["I5", 5], ["I6", 5]], DIF = [["F", 100], ["D1", 5], ["D2", 10], ["D3", 15], ["D4", 20], ["D5", 25], ["D6", 30]];
let BROKEN = new Set();
function need(kind, d){ if (d === 0) return ["F"]; if (kind === "inc") { const r = ["F"]; for (let i = 1; i <= d; i++) r.push("I" + i); return r; } return ["F", "D" + d]; }
function toggle(n){ if (BROKEN.has(n)) BROKEN.delete(n); else BROKEN.add(n); show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 345");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="pi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern><pattern id="pd" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="${css("--fg")}"/></pattern>`;
  svg.appendChild(defs);
  const d = s.day, res = [];
  [["inc", INC, 30, "Inkrementális"], ["dif", DIF, 180, "Differenciális"]].forEach(([kind, items, y0, title]) => {
    const req = need(kind, d), bad = req.filter(n => BROKEN.has(n));
    el("text", {x: 10, y: y0 - 8, "font-size": 13, "font-weight": "bold"}, title);
    items.forEach(([n, v], i) => {
      const x = 20 + i * 92, h = Math.min(v, 40) * 1.9, yb = y0 + 100, on = req.includes(n), br = BROKEN.has(n);
      const r = el("rect", {x: x, y: yb - h, width: 60, height: h, fill: n === "F" ? css("--muted") : (kind === "inc" ? "url(#pi)" : "url(#pd)"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 4 : 1, tabindex: 0, role: "button", "aria-label": n + " sérült jelölése"});
      r.style.cursor = "pointer"; r.addEventListener("click", () => toggle(n)); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") toggle(n); });
      const t = el("text", {x: x + 30, y: yb - h - 6, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal"}, `${n}: ${v}`); t.style.pointerEvents = "none";
      el("text", {x: x + 30, y: yb + 16, "text-anchor": "middle", "font-size": 11}, DAYS[i]);
      if (br) { const a = el("line", {x1: x, y1: yb - h, x2: x + 60, y2: yb, stroke: css("--hl2"), "stroke-width": 3}); const b = el("line", {x1: x + 60, y1: yb - h, x2: x, y2: yb, stroke: css("--hl2"), "stroke-width": 3}); a.style.pointerEvents = "none"; b.style.pointerEvents = "none"; }
    });
    res.push(`${title}: ${req.length} elem` + (bad.length ? ` – NEM állítható vissza (sérült: ${bad.join(", ")})` : " – visszaállítható"));
  });
  el("text", {x: 10, y: 318, "font-size": 12}, res.join("  ·  "));
  el("text", {x: 10, y: 337, "font-size": 10.5, fill: css("--muted")}, "Kattints egy mentésre: sérültnek jelöli (×). A vastag keret a kiválasztott nap visszaállításához szükséges elemeket jelöli.");
}

setTimeout(() => show(4), 0);   // kezdőállapot: a csütörtöki visszaállítás (mint a statikus ábrán)


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
