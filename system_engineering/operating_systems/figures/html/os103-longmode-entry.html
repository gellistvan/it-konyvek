<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiboot2-ből long mode-ba</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Virtuális cím: <input id="va" type="text" value="0x00101000" size="14"></label> <button onclick="vaTranslate()">Fordítás</button> <span id="vaout" class="small" aria-live="polite">PML4 = 0, PDPT = 0, PD = 0, eltolás (21 bit) = 0x101000 → PD[0] = 0x00000083 → fizikai cím 0x00101000</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tíz lépés: Multiboot2 belépés, az EAX/EBX mentése, BSS nullázás, laptábla-építés (PML4[0], PDPT[0], 512 PD-bejegyzés), CR4.PAE, CR3, EFER.LME, CR0.PG, lgdt és távoli ugrás, call kmain; mellette a vezérlőbitek és a táblák (PD[1] = 0x00200083, PD[511] = 0x3FE00083)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">i386 Multiboot2 belépés a fejezet assemblyje szerint; a pml4/pdpt/pd fizikai címe szemléltető. A címfordító a felépített első 1 GiB-os identitás-leképezést használja (2 MiB-os lapok).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 0, "msg": "(1) Multiboot2 belépés: 32 bites védett mód lapozás nélkül: EAX = 0x36D76289 (Multiboot2 magic), EBX = az info struktúra fizikai címe.", "bits": [0], "tab": null, "n": 1}, {"line": 3, "msg": "(2) mentés: cli, cld; az EAX/EBX mentése a .data mb2_magic/mb2_info változóiba – a BSS-nullázás (rep stosb) az EAX-et felülírja.", "bits": [0], "tab": null, "n": 2}, {"line": 6, "msg": "(3) BSS nullázás: ESP ← boot_stack_top; a BSS nullázása bájtonként (a laptáblák is nullák lesznek).", "bits": [0], "tab": null, "n": 3}, {"line": 25, "msg": "(4) laptábla: PML4[0] = pdpt | 0x3 (P, RW), PDPT[0] = pd | 0x3, majd a ciklus 512 PD-bejegyzést ír: i·2 MiB | 0x83 (P, RW, PS = 2 MiB-os lap).", "bits": [0], "tab": "pd", "n": 4}, {"line": 32, "msg": "(5) CR4.PAE = 1: CR4.PAE (bit 5) = 1: a long mode lapozás PAE-formátumú bejegyzést használ, ezért a PG előtt kell.", "bits": [0, 1], "tab": null, "n": 5}, {"line": 34, "msg": "(6) CR3 = pml4: CR3 ← pml4 fizikai címe: a lapozás bekapcsolásakor a CPU innen indul.", "bits": [0, 1, 2], "tab": null, "n": 6}, {"line": 38, "msg": "(7) EFER.LME = 1: EFER.LME (IA32_EFER = MSR 0xC0000080, bit 8) = 1: a long mode engedélyezése, még nem aktív.", "bits": [0, 1, 2, 3], "tab": null, "n": 7}, {"line": 41, "msg": "(8) CR0.PG = 1: CR0.PG (bit 31) = 1 az utolsó vezérlőbit: LME = 1 mellett a CPU beállítja az EFER.LMA-t; a kód még 32 bites szegmensen fut (kompatibilitási mód).", "bits": [0, 1, 2, 3, 4, 5], "tab": null, "n": 8}, {"line": 43, "msg": "(9) lgdt + ljmp 0x08: lgdt gdt64_ptr, majd távoli ugrás a 0x08 szelektorra (L = 1): a CS újratöltésével a CPU 64 bites módba lép.", "bits": [0, 1, 2, 3, 4, 5, 6], "tab": "gdt", "n": 9}, {"line": 56, "msg": "(10) call kmain: Szegmensregiszterek (0x10), RSP ← boot_stack_top; EDI ← mb2_magic, ESI ← mb2_info, call kmain (System V ABI).", "bits": [0, 1, 2, 3, 4, 5, 6], "tab": null, "n": 10}];
const CODE = ["_start:", "    cli                         # megszakítások tiltása", "    cld                         # DF = 0", "    movl %eax, mb2_magic        # EAX = 0x36D76289", "    movl %ebx, mb2_info         # EBX = Multiboot2 info pointer", "    leal boot_stack_top, %esp", "    # BSS nullázása bájtonként: a rep stosb a maradék 1-7 bájtot is kezeli", "    leal __bss_start, %edi", "    leal __bss_end, %ecx", "    subl %edi, %ecx", "    xorl %eax, %eax", "    rep stosb", "    # PML4[0] -> PDPT, PDPT[0] -> PD", "    leal pdpt, %eax", "    orl $0x3, %eax", "    movl %eax, pml4", "    leal pd, %eax", "    orl $0x3, %eax", "    movl %eax, pdpt", "    # 512 darab 2 MiB-os identity mapping (első 1 GiB)", "    xorl %ecx, %ecx", "1:", "    movl %ecx, %eax", "    shll $21, %eax", "    orl $0x83, %eax", "    movl %eax, pd(,%ecx,8)", "    movl $0, pd+4(,%ecx,8)", "    incl %ecx", "    cmpl $512, %ecx", "    jb 1b", "    movl %cr4, %eax", "    orl $(1 << 5), %eax         # CR4.PAE", "    movl %eax, %cr4", "    leal pml4, %eax", "    movl %eax, %cr3", "    movl $0xC0000080, %ecx      # IA32_EFER", "    rdmsr", "    orl $(1 << 8), %eax         # EFER.LME", "    wrmsr", "    movl %cr0, %eax", "    orl $(1 << 31), %eax        # CR0.PG", "    movl %eax, %cr0", "    lgdt gdt64_ptr", "    ljmp $0x08, $start64        # 64 bites kódszegmens: long mode", "    .code64", "start64:", "    movw $0x10, %ax", "    movw %ax, %ds", "    movw %ax, %es", "    movw %ax, %ss", "    xorw %ax, %ax", "    movw %ax, %fs", "    movw %ax, %gs", "    movq $boot_stack_top, %rsp", "    movl mb2_magic(%rip), %edi  # első argumentum: magic", "    movl mb2_info(%rip), %esi   # második argumentum: info pointer", "    call kmain"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BITS = ["CR0.PE", "CR4.PAE", "CR3 = pml4", "EFER.LME", "CR0.PG", "EFER.LMA", "CS.L (64 bit)"];
const TITLES = ["Multiboot2 belépés", "mentés", "BSS nullázás", "laptábla", "CR4.PAE = 1", "CR3 = pml4", "EFER.LME = 1", "CR0.PG = 1", "lgdt + ljmp 0x08", "call kmain"];
function hex8(v){ return "0x" + v.toString(16).toUpperCase().padStart(8, "0"); }
function vaTranslate(){
  const raw = document.getElementById("va").value.trim(), out = document.getElementById("vaout");
  let v; try { v = BigInt(raw.startsWith("0x") || raw.startsWith("0X") ? raw : "0x" + raw); } catch(e) { out.textContent = "Érvénytelen cím."; return; }
  const p4 = Number((v >> 39n) & 511n), p3 = Number((v >> 30n) & 511n), p2 = Number((v >> 21n) & 511n), off = Number(v & 0x1FFFFFn);
  let r = "PML4 = " + p4 + ", PDPT = " + p3 + ", PD = " + p2 + ", eltolás (21 bit) = 0x" + off.toString(16).toUpperCase();
  if ((v >> 48n) !== 0n) r += " → nem kanonikus/nem leképezett cím";
  else if (p4 !== 0 || p3 !== 0) r += " → a PML4[" + p4 + "]/PDPT[" + p3 + "] nincs jelen: laphiba";
  else { const pde = (p2 << 21) | 0x83, phys = (p2 << 21) + off; r += " → PD[" + p2 + "] = " + hex8(pde >>> 0) + " → fizikai cím " + hex8(phys >>> 0); }
  out.textContent = r;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted");
  TITLES.forEach((t, i) => {
    const y = 8 + i * 31, on = i === s.n - 1, done = i < s.n - 1;
    el("rect", {x: 8, y, width: 220, height: 26, fill: on ? css("--cellhl") : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
    el("text", {x: 16, y: y + 18, "font-size": 12.5, "font-weight": on ? "bold" : "normal", fill: done || on ? css("--fg") : mut}, "(" + (i + 1) + ") " + t);
  });
  el("text", {x: 250, y: 22, "font-size": 13, "font-weight": "bold"}, "Vezérlőbitek");
  BITS.forEach((b, j) => {
    const y = 32 + j * 26, on = s.bits.includes(j);
    el("rect", {x: 250, y, width: 16, height: 16, fill: on ? css("--fg") : cell, stroke: line});
    el("text", {x: 274, y: y + 13, "font-size": 12.5}, b + (on ? " = 1" : " = 0"));
  });
  el("text", {x: 470, y: 22, "font-size": 13, "font-weight": "bold"}, "Táblák");
  const built = s.n >= 4, rows = [["PML4[0]", built ? "pdpt | 0x3" : "0"], ["PDPT[0]", built ? "pd | 0x3" : "0"],
    ["PD[0]", built ? "0x00000083" : "0"], ["PD[1]", built ? "0x00200083" : "0"], ["PD[511]", built ? "0x3FE00083" : "0"]];
  rows.forEach(([a, b], j) => { const y = 32 + j * 24, w = s.tab === "pd";
    el("rect", {x: 470, y, width: 270, height: 21, fill: w ? css("--cellhl") : cell, stroke: w ? hl : line, "stroke-width": w ? 2 : 1});
    el("text", {x: 478, y: y + 15, "font-size": 12}, a);
    el("text", {x: 570, y: y + 15, "font-size": 12, style: "font-family:ui-monospace,monospace"}, b); });
  const g = [["0x00", "null"], ["0x08", "kód, L = 1, DPL 0"], ["0x10", "adat, DPL 0"]];
  el("text", {x: 470, y: 172, "font-size": 13, "font-weight": "bold"}, "GDT" + (s.n >= 9 ? " (betöltve)" : ""));
  g.forEach(([a, b], j) => { const y = 180 + j * 24, w = s.tab === "gdt" && j === 1;
    el("rect", {x: 470, y, width: 270, height: 21, fill: w ? css("--cellhl") : cell, stroke: w ? hl : line, "stroke-width": w ? 2 : 1});
    el("text", {x: 478, y: y + 15, "font-size": 12}, a); el("text", {x: 540, y: y + 15, "font-size": 12}, b); });
  const mode = s.n < 8 ? "32 bites védett mód" : (s.n === 8 ? "kompatibilitási mód (LMA = 1, CS.L = 0)" : "64 bites long mode");
  el("text", {x: 250, y: 232, "font-size": 13, "font-weight": "bold", fill: hl}, "CPU-mód: " + mode);
  el("text", {x: 250, y: 260, "font-size": 11.5, fill: mut}, "leképezés: 0x00000000–0x3FFFFFFF identitás (2 MiB-os lapok)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
