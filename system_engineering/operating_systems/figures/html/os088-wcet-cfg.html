<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A task_control WCET-útvonala</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A <input id="tA" type="number" step="0.1" min="0" value="1.0" style="width:4.2em"></label> <label>B <input id="tB" type="number" step="0.1" min="0" value="0.6" style="width:4.2em"></label> <label>C <input id="tC" type="number" step="0.1" min="0" value="0.4" style="width:4.2em"></label> <label>D <input id="tD" type="number" step="0.1" min="0" value="0.5" style="width:4.2em"></label> <label>E <input id="tE" type="number" step="0.1" min="0" value="0.2" style="width:4.2em"></label> <label>F <input id="tF" type="number" step="0.1" min="0" value="1.0" style="width:4.2em"></label> <label>G <input id="tG" type="number" step="0.1" min="0" value="0.4" style="width:4.2em"></label> <label>ciklusszám N <input type="range" id="wn" min="1" max="40" value="12"> <b id="wnv"></b></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Vezérlési gráf A, B, C (önhurok 12-szer), D, E, majd F vagy G ág. A leghosszabb út A, B, C×12, D, E, F: 1,0 + 0,6 + 4,8 + 0,5 + 0,2 + 1,0 = 8,1 µs; a fir_filter 5,9 µs; a G ággal 7,5 µs."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Oktatási blokkidők (23.3.2 táblázata), 50 MHz-es Cortex-M3, nem mért értékek. Az alapállás kimenete egyezik a wcet_model eredményével: fir_filter = 5.900 us, WCET = 8.100 us.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": ""}];
const CODE = ["void task_control(void) {", "    uint16_t x = read_sensor();        /* A */", "    int32_t  y = fir_filter(x);        /* B, C × N, D */", "    if (y > THRESHOLD) {               /* E */", "        actuator_write(y);             /* F */", "    } else {", "        actuator_write(0);             /* G */", "    }", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const POS = {"A": [2.0, 9.0], "B": [2.0, 7.6], "C": [2.0, 6.2], "D": [2.0, 4.8], "E": [2.0, 3.4], "F": [0.8, 2.0], "G": [3.2, 2.0], "v\u00e9g": [2.0, 0.6]}, LINE = {"A": 1, "B": 2, "C": 2, "D": 2, "E": 3, "F": 4, "G": 6}, DESC = {"A": "read_sensor", "B": "fir_filter: előkészítés", "C": "ciklusmag", "D": "ciklus vége, telítés", "E": "if feltétel", "F": "actuator_write(y)", "G": "actuator_write(0)"};
function hu(x, n){ return x.toFixed(n).replace(".", ","); }
function bt(){ const o = {}; ["A", "B", "C", "D", "E", "F", "G"].forEach(b => { o[b] = Math.max(0, parseFloat(String(document.getElementById("t" + b).value).replace(",", ".")) || 0); }); return o; }
function computeSteps(){
  const t = bt(), n = +document.getElementById("wn").value; document.getElementById("wnv").textContent = n;
  const fir = t.B + n * t.C + t.D, tF = t.A + fir + t.E + t.F, tG = t.A + fir + t.E + t.G, br = tF >= tG ? "F" : "G";
  const seq = ["A", "B"]; for (let i = 0; i < n; i++) seq.push("C"); seq.push("D", "E", br);
  let acc = 0, it = 0; const st = [];
  seq.forEach((b, i) => { acc += t[b]; if (b === "C") it++;
    st.push({b, it, n, acc, fir, tF, tG, br, line: LINE[b], visited: seq.slice(0, i + 1),
      msg: b + (b === "C" ? " (" + it + "/" + n + ". iteráció)" : "") + ": +" + hu(t[b], 1) + " µs → halmozott " + hu(acc, 1) + " µs" +
        (b === "D" ? "  ·  fir_filter = " + fir.toFixed(3) + " us" : "") +
        (i === seq.length - 1 ? "  ·  WCET = " + Math.max(tF, tG).toFixed(3) + " us (hosszabb ág: " + br + "; F-fel " + hu(tF, 1) + ", G-vel " + hu(tG, 1) + " µs)" : "")}); });
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 380"); svg.innerHTML = "";
  if (!s.b) return;
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const X = x => 40 + x * 70, Y = y => 360 - y * 37, t = bt();
  const defs = el("defs", {}); const m = document.createElementNS(NS, "marker");
  [["id", "wa"], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "9"], ["markerHeight", "9"], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d", "M0,0 L10,5 L0,10 z"); mp.setAttribute("fill", line); m.appendChild(mp); defs.appendChild(m);
  const E = [["A", "B"], ["B", "C"], ["C", "D"], ["D", "E"], ["E", "F"], ["E", "G"], ["F", "vég"], ["G", "vég"]];
  E.forEach(([u, v]) => { const on = (u !== "E" || v === s.br) && (u !== "F" || s.br === "F") && (u !== "G" || s.br === "G");
    el("line", {x1: X(POS[u][0]), y1: Y(POS[u][1]) + 16, x2: X(POS[v][0]), y2: Y(POS[v][1]) - 18, stroke: line, "stroke-width": on ? 3.5 : 1.2, "stroke-dasharray": on ? "none" : "6 4", "marker-end": "url(#wa)"}); });
  const [cx, cy] = [X(POS.C[0]) + 64, Y(POS.C[1])];
  el("path", {d: `M${cx - 4},${cy - 10} C${cx + 40},${cy - 30} ${cx + 40},${cy + 30} ${cx - 4},${cy + 10}`, fill: "none", stroke: line, "stroke-width": 3, "marker-end": "url(#wa)"});
  el("text", {x: cx + 38, y: cy + 5, "font-size": 14, "font-weight": "bold"}, "×" + s.n);
  Object.entries(POS).forEach(([n, p]) => { const on = n === s.b, vis = s.visited.includes(n);
    el("rect", {x: X(p[0]) - 62, y: Y(p[1]) - 17, width: 124, height: 34, rx: 7, fill: on ? cellhl : (vis ? css("--bg") : cell), stroke: on ? hl2 : (vis ? hl : line), "stroke-width": on ? 4 : (vis ? 2.5 : 1.2)});
    el("text", {x: X(p[0]), y: Y(p[1]) + 5, "text-anchor": "middle", "font-size": 12.5, "font-weight": vis ? "bold" : "normal"}, n === "vég" ? "vég" : n + ": " + hu(t[n], 1) + " µs"); });
  if (s.b === "C") el("text", {x: X(POS.C[0]) - 70, y: Y(POS.C[1]) + 5, "text-anchor": "end", "font-size": 12, fill: hl2, "font-weight": "bold"}, s.it + "/" + s.n);
  // halmozott sáv
  const total = Math.max(s.tF, s.tG), BX = 380, BWD = 360, sc = BWD / Math.max(total, 0.001);
  el("text", {x: BX, y: 30, "font-size": 13, "font-weight": "bold"}, "halmozott idő a leghosszabb úton");
  el("rect", {x: BX, y: 42, width: BWD, height: 26, fill: "none", stroke: line});
  el("rect", {x: BX, y: 42, width: s.acc * sc, height: 26, fill: hl, opacity: 0.55});
  el("text", {x: BX + 4, y: 90, "font-size": 13}, hu(s.acc, 1) + " / " + hu(total, 1) + " µs");
  const L = [["fir_filter = B + N·C + D", s.fir.toFixed(3) + " us"], ["WCET (F ággal)", hu(s.tF, 1) + " µs"], ["G ággal", hu(s.tG, 1) + " µs"], ["wcet_model: WCET", total.toFixed(3) + " us"]];
  L.forEach((r, i) => { el("text", {x: BX, y: 130 + i * 24, "font-size": 12.5}, r[0]); el("text", {x: BX + BWD, y: 130 + i * 24, "text-anchor": "end", "font-size": 12.5, "font-weight": "bold"}, r[1]); });
  el("text", {x: BX, y: 240, "font-size": 11, fill: mut}, "oktatási blokkidők, 50 MHz Cortex-M3, nem mért értékek");
  el("text", {x: BX, y: 258, "font-size": 11, fill: mut}, "vastag = leghosszabb út, szaggatott = rövidebb ág");
}
STEPS = computeSteps();
["A", "B", "C", "D", "E", "F", "G"].forEach(b => document.getElementById("t" + b).addEventListener("input", () => setSteps(computeSteps())));
document.getElementById("wn").addEventListener("input", () => setSteps(computeSteps()));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
