<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABA-probléma lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Változat: <select onchange="setSteps(MODES[this.value])" aria-label="Változat"><option value="plain">címkézetlen</option><option value="tagged">címkézett</option><option value="hazard">hazard pointerrel (címke nélkül)</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Láncolt verem A, B, C csomópontokkal; lépésenként a top mutató, a címke, az 1. szál lokális változói és a nyugdíjazott csomópont."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 7.1-es labor determinisztikus ABA-tesztjének állapotai (a hook a 2. szál műveletsora). A hazard pointer A élettartamát védi, az ABA-t nem szünteti meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": null, "next": null, "old": null}, "hp": null, "corrupt": false, "msg": "Kezdet: top = A, a verem A(1) → B(2) → C(3).", "line": -1, "phase": 0, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "1. szál: head = A, next = B – a CAS előtt az ütemező felfüggeszti.", "line": 4, "phase": 1, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["B", 1], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: pop → A kikerül; top = B.", "line": 6, "phase": 2, "tagged": false, "chain": ["B", "C"]}, {"top": ["C", 2], "nodes": {"A": ["B", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: pop → B kikerül és nyugdíjazott (retired); top = C.", "line": 6, "phase": 3, "tagged": false, "chain": ["C"]}, {"top": ["A", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: push A → A.next = C, top = A.", "line": 8, "phase": 4, "tagged": false, "chain": ["A", "C"]}, {"top": ["B", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": true, "msg": "1. szál: CAS(top, A, B): a top ismét A → a CAS sikeres, top = B – de B már nyugdíjazott: korrupt verem. Laborkimenet: „treiber ABA: a cimkezetlen verem a visszatett A utan B-re allitotta a topot (ABA igazolva).”", "line": 6, "phase": 5, "tagged": false, "chain": ["B", "C"]}];
const CODE = ["pop():", "  loop:", "    old = top                 // címkézett: {ptr, tag}", "    hp[tid] = old.ptr; ellenőrzés: top == old   // a hazard pointeres változatban", "    next = old.ptr->next", "    new = next                // címkézett: {next, old.tag + 1}", "    if CAS(&top, old, new): return old.ptr", "push(n):", "    n->next = top.ptr; CAS(&top, old, {n, old.tag + 1})   // címkézetlen: CAS(&top, old, n)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MODES = {"plain": [{"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": null, "next": null, "old": null}, "hp": null, "corrupt": false, "msg": "Kezdet: top = A, a verem A(1) → B(2) → C(3).", "line": -1, "phase": 0, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "1. szál: head = A, next = B – a CAS előtt az ütemező felfüggeszti.", "line": 4, "phase": 1, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["B", 1], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: pop → A kikerül; top = B.", "line": 6, "phase": 2, "tagged": false, "chain": ["B", "C"]}, {"top": ["C", 2], "nodes": {"A": ["B", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: pop → B kikerül és nyugdíjazott (retired); top = C.", "line": 6, "phase": 3, "tagged": false, "chain": ["C"]}, {"top": ["A", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": false, "msg": "2. szál: push A → A.next = C, top = A.", "line": 8, "phase": 4, "tagged": false, "chain": ["A", "C"]}, {"top": ["B", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": null, "corrupt": true, "msg": "1. szál: CAS(top, A, B): a top ismét A → a CAS sikeres, top = B – de B már nyugdíjazott: korrupt verem. Laborkimenet: „treiber ABA: a cimkezetlen verem a visszatett A utan B-re allitotta a topot (ABA igazolva).”", "line": 6, "phase": 5, "tagged": false, "chain": ["B", "C"]}], "tagged": [{"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": null, "next": null, "old": null}, "hp": null, "corrupt": false, "msg": "Kezdet: top = {A, 0}, a verem A(1) → B(2) → C(3).", "line": -1, "phase": 0, "tagged": true, "chain": ["A", "B", "C"]}, {"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": ["A", 0]}, "hp": null, "corrupt": false, "msg": "1. szál: head = A, next = B, old = {A, 0} – a CAS előtt az ütemező felfüggeszti.", "line": 4, "phase": 1, "tagged": true, "chain": ["A", "B", "C"]}, {"top": ["B", 1], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": ["A", 0]}, "hp": null, "corrupt": false, "msg": "2. szál: pop → A kikerül; top = {B, 1}.", "line": 6, "phase": 2, "tagged": true, "chain": ["B", "C"]}, {"top": ["C", 2], "nodes": {"A": ["B", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": ["A", 0]}, "hp": null, "corrupt": false, "msg": "2. szál: pop → B kikerül és nyugdíjazott (retired); top = {C, 2}.", "line": 6, "phase": 3, "tagged": true, "chain": ["C"]}, {"top": ["A", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": ["A", 0]}, "hp": null, "corrupt": false, "msg": "2. szál: push A → A.next = C, top = {A, 3}.", "line": 8, "phase": 4, "tagged": true, "chain": ["A", "C"]}, {"top": ["A", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": ["A", 0]}, "hp": null, "corrupt": false, "msg": "1. szál: CAS(top, {A, 0}, {B, 1}): az aktuális top {A, 3} ≠ {A, 0} → a CAS kudarcot vall, újrapróba.", "line": 6, "phase": 5, "tagged": true, "chain": ["A", "C"]}, {"top": ["C", 4], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "C", "old": ["A", 3]}, "hp": null, "corrupt": false, "msg": "1. szál újrapróba: head = A, next = C, CAS → top = {C, 4}; a kivett elem A. Laborkimenet: „tagged ABA: a cimke elterese miatt a CAS kudarcot vallott, a verem C-re allt (ABA detektalva).”", "line": 6, "phase": 6, "tagged": true, "chain": ["C"]}], "hazard": [{"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": null, "next": null, "old": null}, "hp": null, "corrupt": false, "msg": "Kezdet: top = A, a verem A(1) → B(2) → C(3).", "line": -1, "phase": 0, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["A", 0], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": "A", "corrupt": false, "msg": "1. szál: head = A, next = B; hp[0] = A (A védett) – a CAS előtt az ütemező felfüggeszti.", "line": 4, "phase": 1, "tagged": false, "chain": ["A", "B", "C"]}, {"top": ["B", 1], "nodes": {"A": ["B", false], "B": ["C", false], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": "A", "corrupt": false, "msg": "2. szál: pop → A kikerül; top = B.", "line": 6, "phase": 2, "tagged": false, "chain": ["B", "C"]}, {"top": ["C", 2], "nodes": {"A": ["B", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": "A", "corrupt": false, "msg": "2. szál: pop → B kikerül és nyugdíjazott (retired); top = C.", "line": 6, "phase": 3, "tagged": false, "chain": ["C"]}, {"top": ["A", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": "A", "corrupt": false, "msg": "2. szál: push A → A.next = C, top = A.", "line": 8, "phase": 4, "tagged": false, "chain": ["A", "C"]}, {"top": ["B", 3], "nodes": {"A": ["C", false], "B": ["C", true], "C": [null, false]}, "t1": {"head": "A", "next": "B", "old": null}, "hp": "A", "corrupt": true, "msg": "1. szál: CAS(top, A, B): a top ismét A → a CAS sikeres, top = B – de B már nyugdíjazott: korrupt verem. Laborkimenet: „treiber ABA: a cimkezetlen verem a visszatett A utan B-re allitotta a topot (ABA igazolva).” A hazard pointer csak A élettartamát védi, az ABA-t nem akadályozza meg.", "line": 6, "phase": 5, "tagged": false, "chain": ["B", "C"]}]};
const VAL = {A: 1, B: 2, C: 3};
function box(x, y, w, h, txt, opt){
  opt = opt || {};
  el("rect", {x, y, width: w, height: h, rx: 7, fill: opt.fill || css("--cell"), stroke: css("--line"), "stroke-width": opt.sw || 1.5, "stroke-dasharray": opt.dash ? "6 4" : "none"});
  el("text", {x: x + w/2, y: y + h/2 + 5, "text-anchor": "middle", "font-size": opt.fs || 15}, txt);
  if (opt.cross) el("line", {x1: x, y1: y + h, x2: x + w, y2: y, stroke: css("--hl2"), "stroke-width": 2});
}
function arr(x1, y1, x2, y2, w){
  el("line", {x1, y1, x2: x2 - 8, y2, stroke: css("--line"), "stroke-width": w || 1.6});
  el("polygon", {points: `${x2},${y2} ${x2 - 10},${y2 - 5} ${x2 - 10},${y2 + 5}`, fill: css("--line")});
}
function render(s){
  svg.innerHTML = "";
  const top = s.tagged ? `top {${s.top[0]}, ${s.top[1]}}` : "top";
  box(20, 70, 110, 50, top, {fill: css("--cellhl"), sw: 2.5, fs: 14});
  let x = 180; const px = {};
  s.chain.forEach(n => { const ret = s.nodes[n][1]; box(x, 70, 80, 50, `${n}(${VAL[n]})`, {dash: ret, cross: ret}); px[n] = x; x += 120; });
  arr(130, 95, 180, 95, 3);
  for (let i = 0; i + 1 < s.chain.length; i++) arr(px[s.chain[i]] + 80, 95, px[s.chain[i + 1]], 95);
  if (s.chain.length) { const last = s.chain[s.chain.length - 1]; if (!s.nodes[last][0]) el("text", {x: px[last] + 90, y: 100, "font-size": 13, fill: css("--muted")}, "NULL"); }
  if (s.corrupt) el("text", {x: 180, y: 150, "font-size": 14, "font-weight": "bold", fill: css("--hl2")}, "korrupt: a top a nyugdíjazott B-re mutat");
  el("text", {x: 20, y: 200, "font-size": 13, fill: css("--muted")}, "a vermen kívül:");
  let ox = 140; const opx = {};
  ["A", "B", "C"].filter(n => !s.chain.includes(n)).forEach(n => { const ret = s.nodes[n][1]; opx[n] = ox;
    box(ox, 178, 80, 40, `${n}(${VAL[n]})`, {dash: ret, cross: ret, fs: 13}); el("text", {x: ox + 40, y: 234, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, ret ? "nyugdíjazott" : "next = " + (s.nodes[n][0] || "NULL")); ox += 110; });
  if (s.hp) { const hx = s.chain.includes(s.hp) ? px[s.hp] : null; el("text", {x: hx !== null ? hx + 66 : opx[s.hp] + 66, y: hx !== null ? 68 : 176, "font-size": 18}, "⚑"); el("text", {x: 380, y: 270, "font-size": 12}, "⚑ hp[0] = " + s.hp + " (az 1. szál védi)"); }
  const t = s.t1;
  el("text", {x: 20, y: 30, "font-size": 14}, t.head ? `1. szál lokális: head = ${t.head}, next = ${t.next}` + (t.old ? `, old = {${t.old[0]}, ${t.old[1]}}` : "") : "1. szál: még nem olvasott");
  el("text", {x: 20, y: 290, "font-size": 11, fill: css("--muted")}, "szaggatott, áthúzott = nyugdíjazott csomópont · vastag nyíl = top");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
