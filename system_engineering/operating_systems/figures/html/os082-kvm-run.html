<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A KVM_RUN hurok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="exk">Kilépés típusa:</label> <select id="exk"><option value="cpuid">CPUID</option><option value="ept">EPT-violation</option><option value="pio" selected>port I/O</option><option value="mmio">MMIO</option><option value="hlt">HLT</option><option value="tf">triple fault</option></select></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három sáv: QEMU, KVM, vendég. A QEMU KVM_RUN hívására a KVM VM entry-t hajt végre, a vendég fut, VM exit után a kernelben kezelhető kilépésnél rövid hurokban azonnal új VM entry jön, KVM_EXIT_IO vagy KVM_EXIT_MMIO esetén a KVM_RUN visszatér, a QEMU kezeli, majd új KVM_RUN-t hív."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus: x86, Intel VT-x, EPT bekapcsolva; a ciklusszámok szándékosan nem szerepelnek. A HLT in-kernel irqchip nélkül kerül a QEMU-hoz; a pszeudokód a 22.1.12 futtatási hurkának rövidítése.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "run", "lane": 0, "line": 1, "kind": "pio", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "pio", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "pio", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "pio", "msg": "(4) VM exit – ok: port I/O; OUT/IN utasítás egy emulált porton (pl. soros port 0x3f8)."}, {"node": "user", "lane": 1, "line": 1, "kind": "pio", "msg": "(5b) Hosszú hurok: a KVM kitölti a kvm_run lapot (exit_reason = KVM_EXIT_IO, io.data_offset), és a KVM_RUN visszatér."}, {"node": "handle", "lane": 0, "line": 3, "kind": "pio", "msg": "(6) A QEMU kiolvassa a run->exit_reason értékét: switch."}, {"node": "handle", "lane": 0, "line": 4, "kind": "pio", "msg": "(6) handle_io(): a QEMU emulálja a port-I/O-t (adat: (uint8_t*)run + io.data_offset)."}, {"node": "run", "lane": 0, "line": 1, "kind": "pio", "msg": "(1) Új KVM_RUN – a hosszú hurok bezárul."}];
const CODE = ["for (;;) {", "    int ret = ioctl(vcpu_fd, KVM_RUN, 0);   /* blokkol, amíg a KVM vissza nem tér */", "    if (ret == -1) { if (errno == EINTR) continue; perror(\"KVM_RUN\"); break; }", "    switch (run->exit_reason) {          /* kvm_run: megosztott lap */", "    case KVM_EXIT_IO:   handle_io(run->io.port, run->io.size, …, io_data); break;", "    case KVM_EXIT_MMIO: handle_mmio(run->mmio.phys_addr, run->mmio.data, …); break;", "    case KVM_EXIT_HLT:  handle_halt(vcpu_fd); break;", "    case KVM_EXIT_SHUTDOWN: goto out;", "    }", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GEO = {"lanes": [["QEMU", "felhasználói tér,\nring 3, VMX root", 0.0], ["KVM", "kernel,\nring 0, VMX root", 5.3], ["vendég", "VMX non-root,\nring 0/3", 10.6]], "nodes": {"run": [0, 2.4, 8.3, "(1) ioctl(vcpu_fd,\nKVM_RUN, 0)"], "entry": [1, 7.7, 8.3, "(2) VM entry\n(VMRESUME)"], "guest": [2, 13.0, 7.0, "(3) a vendég kódja\nnatívan fut"], "exit": [1, 7.7, 5.7, "(4) VM exit:\nexit reason vizsgálata"], "kern": [1, 7.7, 3.55, "(5a) kernelben kezeli:\nCPUID, EPT-violation,\nidőzítő"], "user": [1, 7.7, 1.35, "(5b) EXIT_IO / _MMIO:\nkvm_run kitöltése,\nKVM_RUN visszatér"], "handle": [0, 2.4, 3.2, "(6) switch (exit_reason)\nhandle_io() /\nhandle_mmio()"]}, "exits": {"cpuid": "CPUID", "ept": "EPT-violation", "pio": "port I/O", "mmio": "MMIO", "hlt": "HLT", "tf": "triple fault"}}, ALLS = {"cpuid": [{"node": "run", "lane": 0, "line": 1, "kind": "cpuid", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "cpuid", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "cpuid", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "cpuid", "msg": "(4) VM exit – ok: CPUID; a KVM a CPUID-t a kernelben emulálja (RAX..RDX kitöltése, RIP léptetése)."}, {"node": "kern", "lane": 1, "line": 1, "kind": "cpuid", "msg": "(5a) Rövid hurok: a KVM a kernelben kezeli (CPUID); a QEMU nem is értesül, a KVM_RUN nem tér vissza."}, {"node": "entry", "lane": 1, "line": 1, "kind": "cpuid", "msg": "(2) Azonnal új VM entry (rövid hurok)."}, {"node": "guest", "lane": 2, "line": 1, "kind": "cpuid", "msg": "(3) A vendég folytatja a futást."}], "ept": [{"node": "run", "lane": 0, "line": 1, "kind": "ept", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "ept", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "ept", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "ept", "msg": "(4) VM exit – ok: EPT-violation; a vendég-RAM lapja még nincs leképezve: a KVM a hoszt laptáblájából kitölti az EPT-bejegyzést."}, {"node": "kern", "lane": 1, "line": 1, "kind": "ept", "msg": "(5a) Rövid hurok: a KVM a kernelben kezeli (EPT-violation); a QEMU nem is értesül, a KVM_RUN nem tér vissza."}, {"node": "entry", "lane": 1, "line": 1, "kind": "ept", "msg": "(2) Azonnal új VM entry (rövid hurok)."}, {"node": "guest", "lane": 2, "line": 1, "kind": "ept", "msg": "(3) A vendég folytatja a futást."}], "pio": [{"node": "run", "lane": 0, "line": 1, "kind": "pio", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "pio", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "pio", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "pio", "msg": "(4) VM exit – ok: port I/O; OUT/IN utasítás egy emulált porton (pl. soros port 0x3f8)."}, {"node": "user", "lane": 1, "line": 1, "kind": "pio", "msg": "(5b) Hosszú hurok: a KVM kitölti a kvm_run lapot (exit_reason = KVM_EXIT_IO, io.data_offset), és a KVM_RUN visszatér."}, {"node": "handle", "lane": 0, "line": 3, "kind": "pio", "msg": "(6) A QEMU kiolvassa a run->exit_reason értékét: switch."}, {"node": "handle", "lane": 0, "line": 4, "kind": "pio", "msg": "(6) handle_io(): a QEMU emulálja a port-I/O-t (adat: (uint8_t*)run + io.data_offset)."}, {"node": "run", "lane": 0, "line": 1, "kind": "pio", "msg": "(1) Új KVM_RUN – a hosszú hurok bezárul."}], "mmio": [{"node": "run", "lane": 0, "line": 1, "kind": "mmio", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "mmio", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "mmio", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "mmio", "msg": "(4) VM exit – ok: MMIO; EPT-violation egy RAM-mal nem fedett címen: emulált eszközregiszter, a QEMU kezeli."}, {"node": "user", "lane": 1, "line": 1, "kind": "mmio", "msg": "(5b) Hosszú hurok: a KVM kitölti a kvm_run lapot (exit_reason = KVM_EXIT_MMIO), és a KVM_RUN visszatér."}, {"node": "handle", "lane": 0, "line": 3, "kind": "mmio", "msg": "(6) A QEMU kiolvassa a run->exit_reason értékét: switch."}, {"node": "handle", "lane": 0, "line": 5, "kind": "mmio", "msg": "(6) handle_mmio(): a QEMU emulálja az eszközregiszter írását/olvasását (run->mmio.data)."}, {"node": "run", "lane": 0, "line": 1, "kind": "mmio", "msg": "(1) Új KVM_RUN – a hosszú hurok bezárul."}], "hlt": [{"node": "run", "lane": 0, "line": 1, "kind": "hlt", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "hlt", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "hlt", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "hlt", "msg": "(4) VM exit – ok: HLT; HLT – in-kernel irqchip nélkül a QEMU-hoz kerül (vele a KVM a kernelben altatja a vCPU-t)."}, {"node": "user", "lane": 1, "line": 1, "kind": "hlt", "msg": "(5b) Hosszú hurok: a KVM kitölti a kvm_run lapot (exit_reason = KVM_EXIT_HLT), és a KVM_RUN visszatér."}, {"node": "handle", "lane": 0, "line": 3, "kind": "hlt", "msg": "(6) A QEMU kiolvassa a run->exit_reason értékét: switch."}, {"node": "handle", "lane": 0, "line": 6, "kind": "hlt", "msg": "(6) handle_halt(): a QEMU vár a következő megszakításig."}, {"node": "run", "lane": 0, "line": 1, "kind": "hlt", "msg": "(1) Új KVM_RUN – a hosszú hurok bezárul."}], "tf": [{"node": "run", "lane": 0, "line": 1, "kind": "tf", "msg": "(1) A QEMU vCPU-szála meghívja: ioctl(vcpu_fd, KVM_RUN, 0)."}, {"node": "entry", "lane": 1, "line": 1, "kind": "tf", "msg": "(2) A KVM betölti a vendégállapotot (VMCS) és VM entry-t hajt végre."}, {"node": "guest", "lane": 2, "line": 1, "kind": "tf", "msg": "(3) A vendég kódja VMX non-root módban natívan fut."}, {"node": "exit", "lane": 1, "line": 1, "kind": "tf", "msg": "(4) VM exit – ok: triple fault; triple fault: a vendég leállt, a hurok kilép."}, {"node": "user", "lane": 1, "line": 1, "kind": "tf", "msg": "(5b) Hosszú hurok: a KVM kitölti a kvm_run lapot (exit_reason = KVM_EXIT_SHUTDOWN), és a KVM_RUN visszatér."}, {"node": "handle", "lane": 0, "line": 3, "kind": "tf", "msg": "(6) A QEMU kiolvassa a run->exit_reason értékét: switch."}, {"node": "handle", "lane": 0, "line": 7, "kind": "tf", "msg": "(6) goto out: a hurok kilép, a QEMU lebontja a vCPU-t (munmap, close)."}]};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const SX = 48, X = x => 8 + x * SX, Y = y => 360 - y * 33;
  const defs = el("defs", {}); [["m1", line], ["m2", hl2]].forEach(([id, c]) => { const m = document.createElementNS(NS, "marker");
    [["id", id], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "10"], ["markerHeight", "10"], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", c); m.appendChild(p); defs.appendChild(m); });
  GEO.lanes.forEach((L, i) => { const on = s.lane === i;
    el("rect", {x: X(L[2]), y: 8, width: 4.8 * SX, height: 384, fill: on ? cellhl : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
    el("text", {x: X(L[2]) + 2.4 * SX, y: 28, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, L[0]);
    el("text", {x: X(L[2]) + 2.4 * SX, y: 45, "text-anchor": "middle", "font-size": 11, fill: mut}, L[1].replace("\n", " ")); });
  const inkern = s.kind === "cpuid" || s.kind === "ept";
  const A = (x0, y0, x1, y1, act, dash) => el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: act ? hl2 : line, "stroke-width": act ? 4 : 1.5, "stroke-dasharray": dash ? "7 5" : "none", "marker-end": `url(#${act ? "m2" : "m1"})`});
  const N = s.node;
  A(4.5, 8.3, 5.6, 8.3, N === "entry"); A(9.8, 8.3, 10.9, 7.4, N === "guest"); A(10.9, 6.6, 9.8, 5.8, N === "exit");
  A(7.7, 5.0, 7.7, 4.45, N === "kern"); A(5.5, 5.0, 5.5, 1.75, N === "user", true);
  A(9.9, 3.55, 9.9, 7.95, N === "entry" && inkern && k > 2, false);
  A(5.75, 1.0, 4.5, 2.6, N === "handle" && s.line === 3, true); A(2.4, 4.05, 2.4, 7.62, N === "run" && k > 0, true);
  el("text", {x: X(10.0), y: Y(4.3), "font-size": 11.5, "font-weight": "bold"}, "rövid hurok");
  el("text", {x: X(2.55), y: Y(5.85), "font-size": 11.5, "font-weight": "bold"}, "hosszú hurok");
  Object.entries(GEO.nodes).forEach(([id, n]) => { const on = id === N, lines = n[3].split("\n"), h = 44 + (lines.length > 2 ? 12 : 0);
    el("rect", {x: X(n[1]) - 93, y: Y(n[2]) - h / 2, width: 186, height: h, rx: 7, fill: on ? css("--bg") : cell, stroke: on ? hl : line, "stroke-width": on ? 4 : 1.3});
    lines.forEach((q, j) => el("text", {x: X(n[1]), y: Y(n[2]) + 4 + (j - (lines.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal"}, q)); });
  el("rect", {x: X(0.3), y: Y(1.3) + 8, width: 200, height: 40, fill: "none", stroke: N === "user" || N === "handle" ? hl2 : line, "stroke-dasharray": "3 3", "stroke-width": N === "user" ? 3 : 1.2});
  el("text", {x: X(2.4), y: Y(1.3) + 24, "text-anchor": "middle", "font-size": 11}, "kvm_run: exit_reason, io.data_offset");
  el("text", {x: X(2.4), y: Y(1.3) + 40, "text-anchor": "middle", "font-size": 11, fill: mut}, "(megosztott lap, mmap)");
}

document.getElementById("exk").addEventListener("change", e => { setSteps(ALLS[e.target.value]); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
