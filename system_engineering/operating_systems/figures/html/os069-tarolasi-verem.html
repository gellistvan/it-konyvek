<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tárolási modellek a veremben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">Modell: <button class="mb" data-m="blokk" aria-pressed="false" onclick="model('blokk')">blokk</button> <button class="mb" data-m="fájl" aria-pressed="false" onclick="model('fájl')">fájl</button> <button class="mb" data-m="objektum" aria-pressed="false" onclick="model('objektum')">objektum</button> <button class="mb" data-m="FUSE" aria-pressed="true" onclick="model('FUSE')">FUSE</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A Linux tárolási verem rétegei és a négy útvonal: blokkmodell a blokkréteg alatt távoli LUN-nal, fájlmodell NFS/SMB klienssel a VFS alatt, objektummodell HTTP/S3 API-val a VFS megkerülésével, és a FUSE-ág, amelyen egy 4 KiB-os írás a teljes objektum letöltését és visszaírását okozza."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 18.4.2 öt eltérése: ✓ natív, ✗ nincs, ~ korlátozott/emulált. Egyszerűsített Linux-verem; a page cache és az I/O-ütemező nincs ábrázolva. A kezdőállapot a FUSE-útvonal.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "app", "model": "FUSE", "line": -1, "msg": "[FUSE] write(fd, buf, 4096) egy s3fs-mounton"}, {"node": "vfs", "model": "FUSE", "line": -1, "msg": "[FUSE] VFS"}, {"node": "fuse", "model": "FUSE", "line": -1, "msg": "[FUSE] FUSE (kernel) → /dev/fuse"}, {"node": "s3fs", "model": "FUSE", "line": -1, "msg": "[FUSE] s3fs démon: a 4 KiB-os módosítás az objektum része"}, {"node": "obj", "model": "FUSE", "line": -1, "msg": "[FUSE] write(4 KiB) → VFS → FUSE → s3fs démon → GET teljes objektum + PUT teljes objektum"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"blokk": [{"node": "app", "model": "blokk", "line": -1, "msg": "[blokk] write(fd, buf, 4096)"}, {"node": "vfs", "model": "blokk", "line": -1, "msg": "[blokk] VFS: a fájl ext4-en van"}, {"node": "fs", "model": "blokk", "line": -1, "msg": "[blokk] ext4 (a kliensen) → blokkcím"}, {"node": "blk", "model": "blokk", "line": -1, "msg": "[blokk] blokkréteg: bio, 4 KiB"}, {"node": "ini", "model": "blokk", "line": -1, "msg": "[blokk] iSCSI/NVMe-oF initiator"}, {"node": "lun", "model": "blokk", "line": -1, "msg": "[blokk] write(4 KiB) → ext4 a kliensen → bio a blokkrétegben → iSCSI/NVMe-oF initiator → hálózat → target: egyetlen 4 KiB-os blokkírás (SCSI WRITE / NVMe Write)"}], "fájl": [{"node": "app", "model": "fájl", "line": -1, "msg": "[fájl] write(fd, buf, 4096)"}, {"node": "vfs", "model": "fájl", "line": -1, "msg": "[fájl] VFS: a fájl NFS-mounton van"}, {"node": "nfs", "model": "fájl", "line": -1, "msg": "[fájl] NFS/SMB kliens"}, {"node": "srv", "model": "fájl", "line": -1, "msg": "[fájl] write(4 KiB) → VFS → NFS/SMB kliens → WRITE RPC (ofszet, 4 KiB) → a szerver saját verme"}], "objektum": [{"node": "app", "model": "objektum", "line": -1, "msg": "[objektum] az alkalmazás az S3 SDK-t hívja"}, {"node": "http", "model": "objektum", "line": -1, "msg": "[objektum] HTTP/S3 API (a VFS kimarad)"}, {"node": "obj", "model": "objektum", "line": -1, "msg": "[objektum] az alkalmazás nem write()-ot hív: PutObject a TELJES objektummal (nincs részleges felülírás)"}], "FUSE": [{"node": "app", "model": "FUSE", "line": -1, "msg": "[FUSE] write(fd, buf, 4096) egy s3fs-mounton"}, {"node": "vfs", "model": "FUSE", "line": -1, "msg": "[FUSE] VFS"}, {"node": "fuse", "model": "FUSE", "line": -1, "msg": "[FUSE] FUSE (kernel) → /dev/fuse"}, {"node": "s3fs", "model": "FUSE", "line": -1, "msg": "[FUSE] s3fs démon: a 4 KiB-os módosítás az objektum része"}, {"node": "obj", "model": "FUSE", "line": -1, "msg": "[FUSE] write(4 KiB) → VFS → FUSE → s3fs démon → GET teljes objektum + PUT teljes objektum"}]}, MARK = {"blokk": ["✓", "✓", "✓¹", "✓", "✓"], "fájl": ["✓", "✓", "✓", "✓²", "✓²"], "objektum": ["✗", "✗", "✗", "✗", "~"], "FUSE": ["~", "✗", "✗", "~", "~"]}, DIFF = ["részleges felülírás", "atomi rename", "zár (byte-range)", "mmap", "fsync-tartósság / láthatóság"];
function model(m){ document.querySelectorAll(".mb").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === m)); setSteps(ALL[m]); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const N = {app: [260, 20, "alkalmazás"], vfs: [260, 62, "VFS"], fs: [260, 104, "ext4"], blk: [260, 146, "blokkréteg"], drv: [260, 188, "eszközmeghajtó"],
    ini: [60, 146, "iSCSI/NVMe-oF initiator"], lun: [60, 262, "távoli LUN (target)"], nfs: [460, 62, "NFS/SMB kliens"], srv: [460, 262, "szerver verme"],
    http: [600, 20, "HTTP / S3 API"], fuse: [600, 104, "FUSE (kernel)"], s3fs: [600, 146, "s3fs démon"], obj: [600, 262, "objektumtár"]};
  const path = ALL[s.model].map(x => x.node), idx = ALL[s.model].findIndex(x => x === s) >= 0 ? ALL[s.model].indexOf(s) : path.indexOf(s.node);
  el("line", {x1: 10, y1: 240, x2: 750, y2: 240, stroke: css("--fg"), "stroke-width": 2.5, "stroke-dasharray": "10 5"});
  el("text", {x: 750, y: 256, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "hálózati határ");
  Object.entries(N).forEach(([key, [x, y, t]]) => {
    const on = path.includes(key), cur = key === s.node, fuse = key === "fuse" || key === "s3fs";
    el("rect", {x: x, y: y, width: 150, height: 30, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3.5 : (on ? 2 : 1), "stroke-dasharray": fuse ? "3 3" : "none", opacity: on ? 1 : 0.45});
    el("text", {x: x + 75, y: y + 20, "text-anchor": "middle", "font-size": 12, opacity: on ? 1 : 0.5}, t);
  });
  for (let i = 0; i + 1 < path.length && i < idx; i++) {
    const [x1, y1] = N[path[i]], [x2, y2] = N[path[i + 1]];
    el("line", {x1: x1 + 75, y1: y1 + 30, x2: x2 + 75, y2: y2 - 2, stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": s.model === "FUSE" ? "4 3" : "none", "marker-end": "url(#ar)"});
  }
  const j = {blokk: 0, "fájl": 1, objektum: 2, FUSE: 3}[s.model];
  el("text", {x: 10, y: 304, "font-size": 11.5, "font-weight": "bold"}, s.model + ":");
  el("text", {x: 70, y: 304, "font-size": 11.5}, DIFF.map((d, i) => d + " " + MARK[s.model][i]).join(" · "));
  el("text", {x: 10, y: 322, "font-size": 10.5, fill: css("--muted")}, "✓ natív, ✗ nincs, ~ korlátozott/emulált; egyszerűsített verem (page cache és I/O-ütemező nélkül)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
