<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daemonizálás: fork – setsid – fork</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="skip" type="checkbox" onchange="toggleSkip()"> második fork kihagyása</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatkártyák PID, PPID, PGID, SID, TTY, CWD, umask és fd0–2 mezővel; a session szaggatott, a csoport pontozott keret; lépésenként a 6.3.5 hét lépése."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Linux, PID-ek szemléltetők; a PPID 1 helyett subreaper is lehet. A /dev/ttyS0 megnyitása (O_NOCTTY nélkül) csak a kapcsoló szemléltetésére szerepel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a program (1300) a shell 1200-as sessionjében fut, saját folyamatcsoport vezetője (PGID = PID = 1300), ezért a setsid() EPERM-mel hibázna.", "line": -1, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1300, "ppid": 1200, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": false, "badge": "csoportvezető: setsid() → EPERM", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1300, "note": "", "danger": false}, {"msg": "1. Első fork(): a gyermek 1301 örökli a PGID 1300-at és a SID 1200-at; a szülő _exit(0)-val kilép, ezért a gyermeket PID 1 (vagy egy subreaper) adoptálja, a shell nem vár rá. 1301 nem csoportvezető, tehát hívhat setsid()-et.", "line": 1, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1300, "ppid": 1200, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": true, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": false, "badge": "nem csoportvezető: hívhat setsid()-et", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": false}, {"msg": "2. setsid(): 1301 új session (SID 1301) és új csoport (PGID 1301) vezetője lett, controlling terminalja nincs. Session-vezetőként azonban egy terminál megnyitásával TTY-t szerezhetne.", "line": 2, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": true}, {"msg": "3. Második fork(): az unoka 1302 a SID 1301 tagja, de nem session-vezető (PID ≠ SID), ezért nem szerezhet controlling terminalt; 1301 kilép, 1302-t PID 1 adoptálja.", "line": 4, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": true, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1302, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "nem session-vezető: nem szerezhet TTY-t", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1302, "note": "", "danger": false}, {"msg": "4. chdir(\"/var/tmp/os020-lab\"): a munkakönyvtár nem foglal le mount pontot.", "line": 5, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1302, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "nem session-vezető: nem szerezhet TTY-t", "cwd": "/var/tmp/os020-lab", "umask": "022", "fds": "pts/0"}], "cur": 1302, "note": "", "danger": false}, {"msg": "5. umask(027): a létrehozott fájlokra a csoportírás és az egyéb jogok tiltva.", "line": 6, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1302, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "nem session-vezető: nem szerezhet TTY-t", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "pts/0"}], "cur": 1302, "note": "", "danger": false}, {"msg": "6. open(\"/dev/null\") + dup2 ×3 (+ close): fd0–2 a /dev/null-ra mutat, a régi terminálhoz nem ír és nem olvas.", "line": 7, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1302, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "nem session-vezető: nem szerezhet TTY-t", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "/dev/null"}], "cur": 1302, "note": "", "danger": false}, {"msg": "7. Szolgáltatási ciklus (pause()). Ha a daemon később open(\"/dev/ttyS0\")-t hív, nem kap controlling terminalt, mert nem session-vezető: TTY = nincs.", "line": 8, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1302, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "nem session-vezető: nem szerezhet TTY-t", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "/dev/null"}], "cur": 1302, "note": "", "danger": false}];
const CODE = ["pid = fork();               /* 1. első fork */", "if (pid > 0) _exit(0);      /*    a szülő kilép, a shell nem vár rá */", "if (setsid() == (pid_t)-1) return 1;   /* 2. új session */", "pid = fork();               /* 3. második fork */", "if (pid > 0) _exit(0);", "chdir(\"/var/tmp/os020-lab\");  /* 4. munkakönyvtár */", "umask(027);                 /* 5. fájlmód-maszk */", "fd = open(\"/dev/null\", O_RDWR); dup2(fd, 0); dup2(fd, 1); dup2(fd, 2); /* 6. */", "for (;;) pause();           /* 7. szolgáltatási ciklus */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SKIP = [{"msg": "Kezdet: a program (1300) a shell 1200-as sessionjében fut, saját folyamatcsoport vezetője (PGID = PID = 1300), ezért a setsid() EPERM-mel hibázna.", "line": -1, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1300, "ppid": 1200, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": false, "badge": "csoportvezető: setsid() → EPERM", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1300, "note": "", "danger": false}, {"msg": "1. Első fork(): a gyermek 1301 örökli a PGID 1300-at és a SID 1200-at; a szülő _exit(0)-val kilép, ezért a gyermeket PID 1 (vagy egy subreaper) adoptálja, a shell nem vár rá. 1301 nem csoportvezető, tehát hívhat setsid()-et.", "line": 1, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1300, "ppid": 1200, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": true, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1300, "sid": 1200, "tty": "pts/0", "name": "program", "gone": false, "badge": "nem csoportvezető: hívhat setsid()-et", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": false}, {"msg": "2. setsid(): 1301 új session (SID 1301) és új csoport (PGID 1301) vezetője lett, controlling terminalja nincs. Session-vezetőként azonban egy terminál megnyitásával TTY-t szerezhetne.", "line": 2, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": true}, {"msg": "3. KIHAGYVA: nincs második fork, 1301 session-vezető marad (PID = SID = 1301).", "line": 3, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": true}, {"msg": "4. chdir(\"/var/tmp/os020-lab\"): a munkakönyvtár nem foglal le mount pontot.", "line": 5, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/var/tmp/os020-lab", "umask": "022", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": false}, {"msg": "5. umask(027): a létrehozott fájlokra a csoportírás és az egyéb jogok tiltva.", "line": 6, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "pts/0"}], "cur": 1301, "note": "", "danger": false}, {"msg": "6. open(\"/dev/null\") + dup2 ×3 (+ close): fd0–2 a /dev/null-ra mutat, a régi terminálhoz nem ír és nem olvas.", "line": 7, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "nincs", "name": "program", "gone": false, "badge": "session-vezető: szerezhet TTY-t!", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "/dev/null"}], "cur": 1301, "note": "", "danger": false}, {"msg": "7. HIBA: a session-vezető 1301 open(\"/dev/ttyS0\") (O_NOCTTY nélkül) hívása a terminált controlling terminallá teszi – egy hangup/SIGHUP vagy terminálhoz kötött jel elérheti a daemont.", "line": 8, "procs": [{"pid": 1200, "ppid": 1000, "pgid": 1200, "sid": 1200, "tty": "pts/0", "name": "shell", "gone": false, "badge": "", "cwd": "/home/diak", "umask": "022", "fds": "pts/0"}, {"pid": 1301, "ppid": 1, "pgid": 1301, "sid": 1301, "tty": "ttyS0", "name": "program", "gone": false, "badge": "controlling terminal: megszerezve!", "cwd": "/var/tmp/os020-lab", "umask": "027", "fds": "/dev/null"}], "cur": 1301, "note": "", "danger": true}];
const GOOD = STEPS;
function toggleSkip(){ setSteps(document.getElementById("skip").checked ? SKIP : GOOD); }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 640 296");
  const procs = s.procs.slice().sort((a, b) => (a.gone - b.gone) || (a.pid - b.pid));
  const alive = procs.filter(p => !p.gone), pos = {};
  procs.forEach((p, i) => { pos[p.pid] = [10 + i * 158, 60]; });
  // sessionök (szaggatott) a csoportkeretek mögött
  [...new Set(alive.map(p => p.sid))].forEach(sid => {
    const xs = alive.filter(p => p.sid === sid).map(p => pos[p.pid][0]);
    const x0 = Math.min(...xs) - 4, x1 = Math.max(...xs) + 152;
    el("rect", {x: x0, y: 34, width: x1 - x0, height: 254, fill: "none", stroke: css("--line"), "stroke-dasharray": "7 4", "stroke-width": 1.4});
    el("text", {x: x0 + 4, y: 48, "font-size": 12, fill: css("--muted")}, "session " + sid);
  });
  procs.forEach(p => {
    const [x, y] = pos[p.pid], on = p.pid === s.cur;
    if (!p.gone) el("rect", {x: x - 1, y: y - 1, width: 146, height: 222, fill: "none", stroke: css("--line"), "stroke-dasharray": "2 3"});
    el("rect", {x: x + 3, y: y + 3, width: 138, height: 214, rx: 8, fill: on ? css("--cellhl") : css("--cell"),
                stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    const L = [p.name + " PID " + p.pid, "PPID " + p.ppid, "PGID " + p.pgid + (p.pid === p.pgid ? " (vez.)" : ""),
               "SID " + p.sid + (p.pid === p.sid ? " (vez.)" : ""), "TTY " + p.tty, "CWD " + p.cwd, "umask " + p.umask, "fd0–2: " + p.fds];
    L.forEach((t, i) => {
      const big = i === 0, red = (i === 4 && p.tty === "ttyS0");
      const a = {x: x + 10, y: y + 24 + i * 20, "font-size": big ? 13 : (i === 5 ? 10.5 : 12), "font-weight": big || red ? "bold" : "normal"};
      if (red) a.fill = "#d00000";
      el("text", a, t);
    });
    if (p.badge) {
      const red = p.badge.indexOf("megszerezve") >= 0 || p.badge.indexOf("TTY-t!") >= 0;
      const parts = p.badge.split(":");
      parts.forEach((t, i) => {
        const a = {x: x + 72, y: y + 184 + i * 16, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"};
        if (red) a.fill = "#d00000";
        el("text", a, t.trim() + (i < parts.length - 1 ? ":" : ""));
      });
    }
    if (p.gone) {
      el("line", {x1: x + 6, y1: y + 214, x2: x + 138, y2: y + 6, stroke: css("--line"), "stroke-width": 1.5});
      el("text", {x: x + 72, y: y + 110, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "kilépett");
    }
  });
  el("text", {x: 10, y: 20, "font-size": 12, fill: css("--muted")},
     "szaggatott keret = session · pontozott keret = folyamatcsoport · kiemelt kártya = az aktuális folyamat");
  status.style.color = s.danger ? "#d00000" : "";
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
