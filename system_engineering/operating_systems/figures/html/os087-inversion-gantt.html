<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prioritás-inverzió és a két javítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="gproto">Protokoll:</label> <select id="gproto"><option value="none">nincs</option><option value="pi">prioritásöröklés</option><option value="ipcp">azonnali plafon (IPCP)</option><option value="ocpp">eredeti PCP</option></select> <label>P3 CS <input type="range" id="gcs" min="2" max="30" step="1" value="10"> <b id="gcsv"></b></label> <label>P2 futásideje <input type="range" id="gp2" min="5" max="60" step="1" value="30"> <b id="gp2v"></b></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három Gantt-diagram: protokoll nélkül P1 válaszideje 5,8 ms (unlock 4,0 ms-kor), prioritásörökléssel és azonnali plafonnal 2,8 ms, P2 csak 3,0 ms-kor indul."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egymagos, preemptív, fix prioritású szimuláció 0,1 ms-os lépéssel (a 23.2.6 forgatókönyve); számított, nem mért értékek. Egyetlen mutexnél az eredeti PCP lefutása a prioritásöröklésével azonos.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const HZ = 70, CEILP = 3;
function simJS(proto, cs, p2){
  const T = {P1: {prio: 3, rel: 2, segs: [["cs", 10], ["n", 10]]}, P2: {prio: 2, rel: 4, segs: [["n", p2]]}, P3: {prio: 1, rel: 0, segs: [["cs", cs], ["n", 80 - cs]]}};
  let owner = null, waiting = [], cur = null; const trace = [], events = [];
  const names = ["P1", "P2", "P3"];
  for (let now = 0; now < HZ; now++) {
    names.forEach(n => { if (T[n].rel === now) events.push([now, n, "release"]); });
    const eff = n => { let p = T[n].prio; if (owner === n) { if ((proto === "pi" || proto === "ocpp") && waiting.length) p = Math.max(p, ...waiting.map(w => T[w].prio)); if (proto === "ipcp") p = Math.max(p, CEILP); } return p; };
    const ready = n => T[n].rel <= now && T[n].segs.length && !waiting.includes(n);
    let chosen = null;
    for (;;) {
      const c = names.filter(ready); if (!c.length) { chosen = null; break; }
      const best = Math.max(...c.map(eff)), top = c.filter(n => eff(n) === best);
      chosen = top.includes(cur) ? cur : top.slice().sort((a, b) => T[b].prio - T[a].prio)[0];
      const seg = T[chosen].segs[0];
      if (seg[0] === "cs" && owner !== chosen) {
        if (owner === null) { owner = chosen; events.push([now, chosen, "lock"]); }
        else { waiting.push(chosen); events.push([now, chosen, "block"]); continue; }
      }
      break;
    }
    const row = {};
    names.forEach(n => { const t = T[n]; let st;
      if (t.rel > now || (!t.segs.length && n !== chosen)) st = "idle";
      else if (n === chosen) st = t.segs[0][0] === "cs" ? "cs" : "run";
      else if (waiting.includes(n)) st = "blk"; else st = "rdy";
      row[n] = {st, p: st !== "idle" ? eff(n) : T[n].prio}; });
    trace.push(row); cur = chosen;
    if (chosen) { const seg = T[chosen].segs[0]; seg[1]--;
      if (seg[1] === 0) { T[chosen].segs.shift();
        if (seg[0] === "cs") { owner = null; events.push([now + 1, chosen, "unlock"]); waiting = []; }
        if (!T[chosen].segs.length) { events.push([now + 1, chosen, "finish"]); cur = null; } } }
  }
  return {trace, events};
}
const SN = {run: "fut", cs: "fut (CS)", blk: "blokkolva (M)", rdy: "kész", idle: "–"};
function hu(x, n){ return x.toFixed(n).replace(".", ","); }
function computeSteps(){
  const proto = document.getElementById("gproto").value, cs = +document.getElementById("gcs").value, p2 = +document.getElementById("gp2").value;
  document.getElementById("gcsv").textContent = hu(cs / 10, 1) + " ms"; document.getElementById("gp2v").textContent = hu(p2 / 10, 1) + " ms";
  const r = simJS(proto, cs, p2), fin = r.events.find(e => e[1] === "P1" && e[2] === "finish");
  const R1 = fin ? hu(fin[0] / 10 - 0.2, 1) + " ms" : "> " + hu(HZ / 10 - 0.2, 1) + " ms (a 7 ms-os ablakon túl)";
  return r.trace.map((row, i) => ({i, proto, r, R1, line: -1,
    msg: "t = " + hu(i / 10, 1) + " ms: " + ["P1", "P2", "P3"].map(n => n + " " + SN[row[n].st] + " (eff. p=" + row[n].p + ")").join(", ")
      + r.events.filter(e => e[0] === i && e[2] !== "release" || e[0] === i && e[2] === "release").map(e => " · " + e[1] + " " + e[2]).join("")
      + " · R1 = " + R1}));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  if (!s.r) return;
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const defs = el("defs", {});
  const pat = (id, d) => { const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", 6); p.setAttribute("height", 6); p.setAttribute("patternUnits", "userSpaceOnUse");
    const a = document.createElementNS(NS, "path"); a.setAttribute("d", d); a.setAttribute("stroke", line); a.setAttribute("fill", "none"); p.appendChild(a); defs.appendChild(p); };
  pat("gcsp", "M-1,7 L7,-1"); pat("gblk", "M2,2 h0.1 M5,5 h0.1");
  const X = t => 90 + t * 9, rows = ["P1", "P2", "P3"], FILL = {run: mut, cs: "url(#gcsp)", blk: "url(#gblk)", rdy: "none"};
  rows.forEach((n, j) => { const y = 30 + j * 50;
    el("text", {x: 8, y: y + 20, "font-size": 13, "font-weight": "bold"}, n + " (p=" + {P1: 3, P2: 2, P3: 1}[n] + ")");
    s.r.trace.forEach((row, i) => { const st = row[n].st; if (st === "idle") return;
      el("rect", {x: X(i), y, width: 9, height: 30, fill: FILL[st], stroke: i === s.i ? hl2 : line, "stroke-width": i === s.i ? 2.5 : 0.6, opacity: i <= s.i ? 1 : 0.3}); }); });
  s.r.events.forEach(e => { if (e[0] > s.i + 1) return; const j = rows.indexOf(e[1]), y = 30 + j * 50;
    if (e[2] === "lock" || e[2] === "unlock") el("text", {x: X(e[0]), y: y + 44, "text-anchor": "middle", "font-size": 11, "font-weight": "bold", fill: hl}, e[2] === "lock" ? "▼lock" : "△unlock");
    if (e[2] === "release") el("text", {x: X(e[0]), y: y - 3, "text-anchor": "middle", "font-size": 11}, "↓"); });
  el("line", {x1: X(s.i + 0.5), y1: 20, x2: X(s.i + 0.5), y2: 182, stroke: hl, "stroke-width": 1.5});
  for (let m = 0; m <= 7; m++) { el("text", {x: X(m * 10), y: 198, "text-anchor": "middle", "font-size": 11}, String(m)); el("line", {x1: X(m * 10), y1: 184, x2: X(m * 10), y2: 188, stroke: line}); }
  el("text", {x: 410, y: 214, "text-anchor": "middle", "font-size": 11, fill: mut}, "idő [ms]");
  // táblázat
  const row = s.r.trace[s.i];
  el("text", {x: 8, y: 238, "font-size": 12, "font-weight": "bold"}, "t = " + hu(s.i / 10, 1) + " ms");
  rows.forEach((n, j) => el("text", {x: 110 + j * 210, y: 238, "font-size": 12}, n + ": " + SN[row[n].st] + ", eff. p = " + row[n].p));
  el("text", {x: 8, y: 262, "font-size": 12.5, "font-weight": "bold", fill: hl}, "P1 válaszideje: R1 = " + s.R1);
  el("text", {x: 8, y: 286, "font-size": 11, fill: mut}, "szürke = fut, sraffozott = fut a kritikus szakaszban, pontozott = M-re blokkolva, üres = kész");
}
STEPS = computeSteps();
["gcs", "gp2"].forEach(id => document.getElementById(id).addEventListener("input", () => setSteps(computeSteps())));
document.getElementById("gproto").addEventListener("change", () => setSteps(computeSteps()));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
