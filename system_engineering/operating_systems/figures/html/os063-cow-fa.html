<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoW-fa frissítése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="cr" aria-pressed="false" onclick="toggleCrash()">crash itt</button> Módosított adatblokk: <button onclick="pick('0')">Adat 0</button> <button onclick="pick('1')">Adat 1</button> <button onclick="pick('2')">Adat 2</button> <button onclick="pick('3')">Adat 3</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kétszintű CoW-fa: az Adatblokk 2 módosításakor új 2′, B′ és Gyökér′ jön létre, az A, 0, 1 és 3 közös marad, majd az uberblokk mutatója atomi módon a Gyökér′-re vált."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet kétszintű fájának modellje (Python-számítás, assert: az (5) után 3 új blokk, A, 0, 1, 3 mindkét gyökérből elérhető). Egyszerűsített kétszintű fa; a valós ZFS/Btrfs fák mélyebbek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 1, "line": -1, "msg": "(1) Kiinduló fa: az uberblokk a Gyökérre mutat; minden szülő tárolja a gyermekei checksumját."}, {"k": 2, "line": -1, "msg": "(2) Adat 2′ új helyre íródik, új checksummal (C_2′); a régi Adat 2 érintetlen."}, {"k": 3, "line": -1, "msg": "(3) Metaadat B′: a mutatók közül Adat 2 helyett 2′, a testvér (3) közös marad; új checksum C_B′."}, {"k": 4, "line": -1, "msg": "(4) Gyökér′: Metaadat B′ az új, Metaadat A közös; új checksum C_root′."}, {"k": 5, "line": -1, "msg": "(5) Atomi gyökércsere: az uberblokk/szuperblokk mutatója a Gyökér′-re vált. Új blokkok: 2′, B′, Gyökér′."}, {"k": 6, "line": -1, "msg": "(6) A régi Gyökér, Metaadat B és Adat 2 csak pillanatkép esetén marad élő, különben felszabadul."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MSG = {"1": "(1) Kiinduló fa: az uberblokk a Gyökérre mutat; minden szülő tárolja a gyermekei checksumját.", "2": "(2) Adat {d}′ új helyre íródik, új checksummal (C_{d}′); a régi Adat {d} érintetlen.", "3": "(3) Metaadat {p}′: a mutatók közül Adat {d} helyett {d}′, a testvér ({s}) közös marad; új checksum C_{p}′.", "4": "(4) Gyökér′: Metaadat {p}′ az új, Metaadat {o} közös; új checksum C_root′.", "5": "(5) Atomi gyökércsere: az uberblokk/szuperblokk mutatója a Gyökér′-re vált. Új blokkok: {d}′, {p}′, Gyökér′.", "6": "(6) A régi Gyökér, Metaadat {p} és Adat {d} csak pillanatkép esetén marad élő, különben felszabadul."};
let D = "2", CRASH = false;
const PAR = {"0": "A", "1": "A", "2": "B", "3": "B"}, KIDS = {"A": ["0", "1"], "B": ["2", "3"]};
function pick(d){ D = d; const p = PAR[d], sib = KIDS[p].find(x => x !== d), o = p === "A" ? "B" : "A";
  setSteps([1, 2, 3, 4, 5, 6].map(i => ({k: i, line: -1, msg: MSG[i].split("{d}").join(d).split("{p}").join(p).split("{s}").join(sib).split("{o}").join(o)}))); }
function toggleCrash(){ CRASH = !CRASH; document.getElementById("cr").setAttribute("aria-pressed", CRASH); document.getElementById("cr").textContent = CRASH ? "crash itt: BE" : "crash itt"; show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.3"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const p = PAR[D], path = [D, p, "Gyökér"], nn = s.k >= 2 ? path.slice(0, Math.min(s.k - 1, 3)) : [];
  const isNew = n => nn.includes(n);
  const P = {"Gyökér": [240, 90], "A": [120, 175], "B": [360, 175], "0": [60, 265], "1": [180, 265], "2": [300, 265], "3": [420, 265]};
  const Q = {"Gyökér′": [610, 90], [p + "′"]: [640, 175], [D + "′"]: [680, 265]};
  const freed = s.k >= 6 ? path : [];
  function box(n, x, y, kind, label){
    const on = (kind === "new");
    const r = el("rect", {x: x - 56, y: y - 16, width: 112, height: 32, rx: 6, fill: kind === "shared" && s.k >= 2 ? "url(#hb)" : (on ? css("--cellhl") : css("--cell")), stroke: css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": kind === "old" && s.k >= 2 ? "6 4" : "none", opacity: freed.includes(n) ? 0.35 : 1});
    const t = el("text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 12}, label);
    t.setAttribute("stroke", css("--bg")); t.setAttribute("stroke-width", 3); t.setAttribute("paint-order", "stroke");
    if (/^[0-3]$/.test(n)) { r.style.cursor = "pointer"; r.setAttribute("tabindex", 0); r.setAttribute("role", "button"); r.setAttribute("aria-label", "Adat " + n + " módosítása");
      r.addEventListener("click", () => pick(n)); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pick(n); }); }
  }
  function edge(a, b, lab, w, dash){ el("line", {x1: a[0], y1: a[1] + 16, x2: b[0], y2: b[1] - 18, stroke: css("--fg"), "stroke-width": w || 1.2, "stroke-dasharray": dash || "none", "marker-end": "url(#ar)"});
    const t = el("text", {x: (a[0] * 0.55 + b[0] * 0.45), y: (a[1] + b[1]) / 2 + 4, "text-anchor": "middle", "font-size": 10.5}, lab); t.setAttribute("stroke", css("--bg")); t.setAttribute("stroke-width", 3); t.setAttribute("paint-order", "stroke"); }
  const old = n => path.includes(n) && s.k >= 2 && isNew(n);
  [["Gyökér", "A"], ["Gyökér", "B"], ["A", "0"], ["A", "1"], ["B", "2"], ["B", "3"]].forEach(([a, b]) => edge(P[a], P[b], "C_" + b, 1.2, (path.includes(b) && isNew(b)) ? "5 4" : "none"));
  if (isNew(D)) box(D + "′", ...Q[D + "′"], "new", "Adatblokk " + D + "′");
  if (isNew(p)) { box(p + "′", ...Q[p + "′"], "new", "Metaadat blokk " + p + "′"); edge(Q[p + "′"], Q[D + "′"], "C_" + D + "′", 2); const sib = KIDS[p].find(x => x !== D); edge(Q[p + "′"], P[sib], "C_" + sib, 2); }
  if (isNew("Gyökér")) { box("Gyökér′", ...Q["Gyökér′"], "new", "Gyökér′"); edge(Q["Gyökér′"], Q[p + "′"], "C_" + p + "′", 2); const o = p === "A" ? "B" : "A"; edge(Q["Gyökér′"], P[o], "C_" + o, 2); }
  Object.keys(P).forEach(n => box(n, ...P[n], path.includes(n) ? (isNew(n) ? "old" : "plain") : (s.k >= 4 || (KIDS[p].includes(n) && s.k >= 3) ? "shared" : "plain"), /^[0-3]$/.test(n) ? "Adatblokk " + n : (n === "Gyökér" ? "Gyökér" : "Metaadat blokk " + n)));
  // uberblokk
  const swapped = s.k >= 5 && !(CRASH && s.k < 5);
  el("rect", {x: 300, y: 12, width: 170, height: 30, rx: 6, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 385, y: 32, "text-anchor": "middle", "font-size": 12}, "uberblokk / szuperblokk");
  const tgt = swapped ? Q["Gyökér′"] : P["Gyökér"];
  el("line", {x1: 385, y1: 42, x2: tgt[0], y2: tgt[1] - 18, stroke: css("--fg"), "stroke-width": 4, "marker-end": "url(#ar)"});
  el("line", {x1: 385, y1: 42, x2: tgt[0], y2: tgt[1] - 18, stroke: css("--bg"), "stroke-width": 1.4});
  if (CRASH) {
    const valid = s.k >= 5 ? "Gyökér′ (a csere már tartós)" : "a régi Gyökér (a csere még nem történt meg; az új blokkok elérhetetlen szemétté válnak)";
    el("text", {x: 10, y: 318, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "⚡ crash ennél a lépésnél → érvényes gyökér: " + valid);
  } else el("text", {x: 10, y: 318, "font-size": 11, fill: css("--muted")}, "Kattints egy adatblokkra (0–3): az animáció a hozzá tartozó utat másolja. Szaggatott = régi, vastag = új, vonalkázott = közös.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
