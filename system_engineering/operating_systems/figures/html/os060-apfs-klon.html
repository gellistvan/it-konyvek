<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APFS klón és pillanatkép</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="APFS container két volume-mal és közös szabad területtel; alatta a test.bin 256 blokkja, a klón ugyanarra mutat, a klón 10. blokkjának felülírása után új B10′ blokk, a pillanatkép a régi blokkokat tartja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Blokkszintű hivatkozásszámlálás (Python-számítás, a labor adataival: 1 MiB, 4 KiB-os blokk, 256 blokk); sematikus blokksáv, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "a", "files": {"test.bin": "own"}, "snap": false, "used": 256, "b10": "1", "msg": "(a) test.bin: 1 MiB = 256 × 4 KiB blokk (B0–B255), mind saját; foglalt blokkok: 256."}, {"ph": "b", "files": {"test.bin": "sh", "test_clone.bin": "sh"}, "snap": false, "used": 256, "b10": "2", "msg": "(b) cp -c test.bin test_clone.bin: új fájlobjektum, de ugyanarra a 256 blokkra mutat; hivatkozásszám B10: 1 → 2; foglalt blokkok: 256 (nincs adatmásolás)."}, {"ph": "h", "files": {"test.bin": "own"}, "snap": false, "used": 256, "b10": "1", "hard": true, "msg": "Összevetés – hard link: test.bin és test_hardlink.bin ugyanaz a fájlobjektum két névvel (link count 2); blokkszinten nincs megosztás, mert egyetlen fájl van; foglalt blokkok: 256."}, {"ph": "s", "files": {"test.bin": "sh", "test_clone.bin": "sh"}, "snap": true, "used": 256, "b10": "2 (+ pillanatkép)", "msg": "Pillanatkép a (b) állapotról: a volume összes blokkját megtartja (pontozott hivatkozás); foglalt blokkok: 256, új adat nem íródik."}, {"ph": "c", "files": {"test.bin": "sh", "test_clone.bin": "sh10"}, "snap": true, "used": 257, "b10": "2 → 1 (+ pillanatkép)", "msg": "(c) a klón 10. blokkjának felülírása: a klón a B10′ új blokkra mutat, a többi közös; hivatkozásszám B10: 2 → 1; foglalt blokkok: 256 → 257."}, {"ph": "d", "files": {"test.bin": "sh10b", "test_clone.bin": "sh10"}, "snap": true, "used": 258, "b10": "0 fájl (+ pillanatkép)", "msg": "(d) ha a test.bin 10. blokkját is felülírjuk (B10″), a régi B10-re már csak a pillanatkép hivatkozik: nem szabadul fel, foglalt blokkok: 258 (pillanatkép nélkül 257 lenne)."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  // container
  el("rect", {x: 5, y: 5, width: 750, height: 62, fill: "none", stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 14, y: 22, "font-size": 12, "font-weight": "bold"}, "APFS container");
  el("rect", {x: 14, y: 30, width: 150, height: 30, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 89, y: 50, "text-anchor": "middle", "font-size": 12}, "volume: Rendszer");
  el("rect", {x: 172, y: 30, width: 150, height: 30, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 247, y: 50, "text-anchor": "middle", "font-size": 12}, "volume: Adat");
  el("rect", {x: 330, y: 30, width: 415, height: 30, fill: "none", stroke: css("--line"), "stroke-dasharray": "6 4"});
  el("text", {x: 537, y: 50, "text-anchor": "middle", "font-size": 12}, "közös szabad terület (space sharing)");
  // blokksáv
  const cells = ["B0", "B1", "…", "B10", "…", "B255"], cw = 62, x0 = 120, y0 = 210;
  const shared = s.ph !== "a" && s.ph !== "h";
  const X = {};
  cells.forEach((c, i) => {
    const dots = c === "…", x = x0 + i * cw;
    let fill = dots ? "none" : (shared ? "url(#hb)" : css("--cellhl"));
    if (c === "B10" && s.ph === "d") fill = "none";
    el("rect", {x: x, y: y0, width: cw, height: 36, fill: fill, stroke: css("--line")});
    const t = el("text", {x: x + cw / 2, y: y0 + 23, "text-anchor": "middle", "font-size": 12}, c);
    if (fill === "url(#hb)") { t.setAttribute("stroke", css("--bg")); t.setAttribute("stroke-width", 4); t.setAttribute("paint-order", "stroke"); }
    X[c] = x + cw / 2;
  });
  let nx = x0 + cells.length * cw + 14;
  const news = [];
  if (s.ph === "c" || s.ph === "d") news.push("B10′");
  if (s.ph === "d") news.push("B10″");
  news.forEach(n => { el("rect", {x: nx, y: y0, width: cw, height: 36, fill: css("--cellhl"), stroke: css("--hl2"), "stroke-width": 3}); el("text", {x: nx + cw / 2, y: y0 + 23, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, n); X[n] = nx + cw / 2; nx += cw + 8; });
  // fájlok
  function fb(x, y, t, w){ el("rect", {x: x, y: y, width: w || 130, height: 28, fill: css("--cell"), stroke: css("--line")}); el("text", {x: x + (w || 130) / 2, y: y + 19, "text-anchor": "middle", "font-size": 12}, t); }
  function ln(x1, y1, x2, y2, dash){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": dash || "none", "marker-end": "url(#ar)"}); }
  fb(130, 110, "test.bin");
  ln(195, 138, X["B0"], y0 - 2); ln(195, 138, X["B255"], y0 - 2);
  ln(195, 138, X[s.ph === "d" ? "B10″" : "B10"], y0 - 2);
  if (s.files["test_clone.bin"]) {
    fb(330, 110, "test_clone.bin");
    ln(395, 138, X["B1"], y0 - 2, "5 3"); ln(395, 138, X["B255"] - 8, y0 - 2, "5 3");
    ln(395, 138, X[s.files["test_clone.bin"] === "sh10" ? "B10′" : "B10"] + 6, y0 - 2, "5 3");
  }
  if (s.hard) {
    fb(130, 80, "test_hardlink.bin", 130);
    el("text", {x: 275, y: 100, "font-size": 12}, "← ugyanaz a fájlobjektum (link count 2), nem külön fájl");
  }
  if (s.snap) {
    fb(560, 110, "pillanatkép (b)", 150);
    el("line", {x1: 600, y1: 138, x2: X["B10"] + 8, y2: y0 - 2, stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": "2 3", "marker-end": "url(#ar)"});
    el("text", {x: 755, y: 160, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "a (b) állapot összes blokkja");
  }
  el("text", {x: 10, y: 290, "font-size": 13}, `foglalt blokkok: ${s.used}   ·   B10 hivatkozásszáma: ${s.b10}`);
  el("text", {x: 10, y: 312, "font-size": 11, fill: css("--muted")}, "vonalkázott = megosztott blokk, kitöltött = saját blokk, pontozott = pillanatkép-hivatkozás; 4 KiB-os blokk, 1 MiB-os fájl");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
