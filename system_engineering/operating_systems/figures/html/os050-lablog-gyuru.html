<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lablog gyűrűpuffer lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="fix" type="checkbox" checked> ébresztés alvás előtt (javított kód)</label><label>pufferméret <input id="nn" type="number" min="4" max="16" value="8" style="width:4em"></label><label>írási hossz <input id="ll" type="number" min="1" max="64" value="10" style="width:4em"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolccellás gyűrűpuffer head és tail mutatóval lépésenként, olvasó és író várakozási sorral."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kicsinyített puffer (a valódi LABLOG_SIZE = 4096). Kikapcsolt ébresztésnél a fejezet mostani kódja fut: a (2') lépésben mindkét folyamat alszik (holtpont, T-O6-001). A JS-szimuláció a Python-szkript simulate() függvényének átirata; kezdőállapot: 8 bájt, write(…, 10), read(…, 16).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"buf": [null, null, null, null, null, null, null, null], "head": 0, "tail": 0, "count": 0, "eof": 0, "readers": [], "writers": [], "tag": "0", "line": -1, "lock": "szabad", "dead": false, "pw": null, "pr": [], "N": 8, "msg": "Kezdetben: üres puffer  |  head = 0, tail = 0, count = 0, eof = 0, readers: [], writers: []"}, {"buf": [null, null, null, null, null, null, null, null], "head": 0, "tail": 0, "count": 0, "eof": 0, "readers": ["P_R"], "writers": [], "tag": "1", "line": 3, "lock": "P_R → elengedve", "dead": false, "pw": null, "pr": [], "N": 8, "msg": "(1) P_R: read(fd, buf, 16) – üres puffer, nincs EOF → alszik a readers sorban (a mutexet elengedi)  |  head = 0, tail = 0, count = 0, eof = 0, readers: [P_R], writers: []"}, {"buf": ["A", "B", "C", "D", "E", "F", "G", "H"], "head": 0, "tail": 0, "count": 8, "eof": 0, "readers": [], "writers": ["P_W"], "tag": "2", "line": 10, "lock": "P_W → elengedve", "dead": false, "pw": null, "pr": [], "N": 8, "msg": "(2) P_W: beírja „ABCDEFGH”, a puffer tele (count = 8); wake_up_all(readers) ébreszti P_R-t, majd P_W alszik a writers sorban  |  head = 0, tail = 0, count = 8, eof = 0, readers: [], writers: [P_W]"}, {"buf": [null, null, null, null, null, null, null, null], "head": 0, "tail": 0, "count": 0, "eof": 0, "readers": [], "writers": [], "tag": "3", "line": 5, "lock": "P_R → elengedve", "dead": false, "pw": null, "pr": [8], "N": 8, "msg": "(3) P_R: 8 bájtot olvas, wake_up_all(writers) ébreszti P_W-t, read → 8  |  head = 0, tail = 0, count = 0, eof = 0, readers: [], writers: []"}, {"buf": ["I", "J", null, null, null, null, null, null], "head": 2, "tail": 0, "count": 2, "eof": 0, "readers": [], "writers": [], "tag": "4", "line": 13, "lock": "P_W → elengedve", "dead": false, "pw": 10, "pr": [8], "N": 8, "msg": "(4) P_W: beírja „IJ” (2 bájt), write → 10; wake_up_all(readers): nincs alvó olvasó  |  head = 2, tail = 0, count = 2, eof = 0, readers: [], writers: []"}, {"buf": [null, null, null, null, null, null, null, null], "head": 2, "tail": 2, "count": 0, "eof": 1, "readers": [], "writers": [], "tag": "5", "line": 4, "lock": "P_R → elengedve", "dead": false, "pw": 10, "pr": [8, 2], "N": 8, "msg": "(5) LAB_SET_EOF (eof = 1), majd P_R: read → 2 (a maradék bájtok)  |  head = 2, tail = 2, count = 0, eof = 1, readers: [], writers: []"}, {"buf": [null, null, null, null, null, null, null, null], "head": 2, "tail": 2, "count": 0, "eof": 1, "readers": [], "writers": [], "tag": "6", "line": 2, "lock": "P_R → elengedve", "dead": false, "pw": 10, "pr": [8, 2, 0], "N": 8, "msg": "(6) P_R: read → 0 (üres puffer és eof = 1: tartós EOF)  |  head = 2, tail = 2, count = 0, eof = 1, readers: [], writers: []"}];
const CODE = ["ssize_t lablog_read(dev, user_buf, count)", "    mutex_lock(&log->lock);", "    while (log->count == 0) { if (log->eof) { mutex_unlock(&log->lock); return 0; }  /* tartós EOF */", "        wait_event_interruptible(&log->readers, &log->lock, log->count > 0 || log->eof); }", "    while (n < count && log->count > 0) { copyout(&user_buf[n], &log->buf[log->tail], 1); tail = (tail + 1) % SIZE; count--; n++; }", "    mutex_unlock(&log->lock); if (n > 0) wake_up_all(&log->writers); return n;", "ssize_t lablog_write(dev, user_buf, count)", "    mutex_lock(&log->lock);", "    while (n < count) { copyin(&c, &user_buf[n], 1);", "        while (log->count == LABLOG_SIZE) {                 /* puffer tele */", "            if (n > 0) wake_up_all(&log->readers);        /* JAVÍTÁS (T-O6-001): alvás ELŐTT ébreszt */", "            wait_event_interruptible(&log->writers, &log->lock, log->count < LABLOG_SIZE); }", "        log->buf[log->head] = c; head = (head + 1) % SIZE; count++; n++; }", "    mutex_unlock(&log->lock); if (n > 0) wake_up_all(&log->readers); return n;", "lablog_ioctl(LAB_SET_EOF): mutex_lock; eof = 1; mutex_unlock; wake_up_all(&log->readers);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = "";
  const N = s.N, cx = 150, cy = 150, R1 = 62, R2 = 108;
  const defs = el("defs", {});
  const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hh"); pat.setAttribute("width", "7"); pat.setAttribute("height", "7");
  pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pr = document.createElementNS(NS, "rect"); pr.setAttribute("width", "7"); pr.setAttribute("height", "7"); pr.setAttribute("fill", css("--cellhl"));
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", "0"); pl.setAttribute("y1", "0"); pl.setAttribute("x2", "0"); pl.setAttribute("y2", "7");
  pl.setAttribute("stroke", css("--line")); pl.setAttribute("stroke-width", "1");
  pat.appendChild(pr); pat.appendChild(pl); defs.appendChild(pat);
  const P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const ang = i => (-90 + i * 360 / N) * Math.PI / 180;
  for (let i = 0; i < N; i++) {
    const a0 = ang(i), a1 = ang(i + 1), [x0, y0] = P(R2, a0), [x1, y1] = P(R2, a1), [x2, y2] = P(R1, a1), [x3, y3] = P(R1, a0);
    const occ = s.buf[i] !== null;
    el("path", {d: `M${x0},${y0} A${R2},${R2} 0 0 1 ${x1},${y1} L${x2},${y2} A${R1},${R1} 0 0 0 ${x3},${y3} Z`,
                fill: occ ? "url(#hh)" : css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    const am = (a0 + a1) / 2, [tx, ty] = P((R1 + R2) / 2, am), [ix, iy] = P(R1 - 10, am);
    if (occ) { el("rect", {x: tx - 9, y: ty - 10, width: 18, height: 19, fill: css("--bg"), rx: 3});
               el("text", {x: tx, y: ty + 5, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, s.buf[i]); }
    if (N <= 12 || i % 2 === 0) el("text", {x: ix, y: iy + 4, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(i));
  }
  const ah = (ang(s.head) + ang(s.head + 1)) / 2, [hx0, hy0] = P(R2 + 34, ah), [hx1, hy1] = P(R2 + 4, ah), [hlx, hly] = P(R2 + 44, ah);
  el("line", {x1: hx0, y1: hy0, x2: hx1, y2: hy1, stroke: css("--line"), "stroke-width": 2.5});
  el("circle", {cx: hx1, cy: hy1, r: 3.5, fill: css("--line")});
  el("text", {x: hlx, y: hly + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "H");
  const at = (ang(s.tail) + ang(s.tail + 1)) / 2, [tx0, ty0] = P(16, at), [tx1, ty1] = P(R1 - 18, at);
  el("line", {x1: tx0, y1: ty0, x2: tx1, y2: ty1, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "5 3"});
  el("circle", {cx: tx1, cy: ty1, r: 3, fill: css("--line")});
  el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "T");
  [["readers", s.readers, 40], ["writers", s.writers, 120]].forEach(([q, arr, y]) => {
    el("rect", {x: 320, y: y, width: 200, height: 62, fill: css("--cell"), stroke: css("--line"), "stroke-width": s.dead ? 4 : 1.2, rx: 4});
    el("text", {x: 330, y: y + 18, "font-size": 12, fill: css("--muted")}, q + " (várakozási sor)");
    el("text", {x: 420, y: y + 46, "text-anchor": "middle", "font-size": 18, "font-weight": arr.length ? "bold" : "normal"}, arr.length ? arr.join(", ") : "—");
  });
  el("rect", {x: 322, y: 210, width: 14, height: 11, fill: css("--line")});
  el("path", {d: "M325,210 v-4 a4,4 0 0 1 8,0 v4", fill: "none", stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 344, y: 220, "font-size": 12}, "mutex: " + s.lock);
  el("text", {x: 322, y: 244, "font-size": 12}, (s.pw !== null ? "write → " + s.pw : "") + (s.pr.length ? ";  read → " + s.pr.join(", ") : ""));
  if (s.dead) el("text", {x: 322, y: 272, "font-size": 18, "font-weight": "bold"}, "HOLTPONT");
  el("text", {x: 10, y: 292, "font-size": 11, fill: css("--muted")}, `puffer: ${N} bájt (kicsinyítve; LABLOG_SIZE = 4096) · H = head (tömör) · T = tail (szaggatott)`);
}

function simulate(N, L, fix){
  const rd = 16, data = Array.from({length: L}, (_, i) => String.fromCharCode(65 + i % 26));
  const S = {buf: Array(N).fill(null), head: 0, tail: 0, count: 0, eof: 0, readers: [], writers: []};
  const rets = {pw: null, pr: []}, st = [];
  const snap = (tag, msg, line, lock, dead) => st.push({buf: S.buf.slice(), head: S.head, tail: S.tail, count: S.count, eof: S.eof,
    readers: S.readers.slice(), writers: S.writers.slice(), tag, line, lock, dead: !!dead, pw: rets.pw, pr: rets.pr.slice(), N,
    msg: `${msg}  |  head = ${S.head}, tail = ${S.tail}, count = ${S.count}, eof = ${S.eof}, readers: [${S.readers.join(", ")}], writers: [${S.writers.join(", ")}]`});
  const readSome = () => { let k = 0; while (k < rd && S.count > 0) { S.buf[S.tail] = null; S.tail = (S.tail + 1) % N; S.count--; k++; }
    S.writers = []; rets.pr.push(k); return k; };
  snap("0", "Kezdetben: üres puffer", -1, "szabad");
  S.readers.push("P_R");
  snap("1", `(1) P_R: read(fd, buf, ${rd}) – üres puffer, nincs EOF → alszik a readers sorban (a mutexet elengedi)`, 3, "P_R → elengedve");
  let w = 0, prWaiting = true, n = 1;
  while (true) {
    n++; const start = w;
    while (w < L && S.count < N) { S.buf[S.head] = data[w]; S.head = (S.head + 1) % N; S.count++; w++; }
    const txt = data.slice(start, w).join("");
    if (w === L) {
      rets.pw = L; const woke = S.readers.length > 0; S.readers = [];
      snap(String(n), `(${n}) P_W: beírja „${txt}” (${w - start} bájt), write → ${L}; ` + (woke ? "wake_up_all(readers) ébreszti P_R-t" : "wake_up_all(readers): nincs alvó olvasó"), 13, "P_W → elengedve");
      prWaiting = woke; break;
    }
    if (fix) {
      const woke = S.readers.length > 0; S.readers = []; S.writers.push("P_W");
      snap(String(n), `(${n}) P_W: beírja „${txt}”, a puffer tele (count = ${N}); ` + (woke ? "wake_up_all(readers) ébreszti P_R-t, " : "") + "majd P_W alszik a writers sorban", 10, "P_W → elengedve");
    } else {
      S.writers.push("P_W");
      if (S.readers.includes("P_R")) {
        snap(n + "'", `(${n}') P_W: beírja „${txt}”, a puffer tele, és ÉBRESZTÉS NÉLKÜL alszik → HOLTPONT: mindkét folyamat alszik`, 11, "P_W → elengedve", true);
        return st;
      }
      snap(String(n), `(${n}) P_W: beírja „${txt}”, a puffer tele → alszik a writers sorban`, 11, "P_W → elengedve");
    }
    n++; const k = readSome();
    snap(String(n), `(${n}) P_R: ${k} bájtot olvas, wake_up_all(writers) ébreszti P_W-t, read → ${k}`, 5, "P_R → elengedve");
  }
  if (prWaiting && S.count > 0) { n++; const k = readSome(); snap(String(n), `(${n}) P_R (felébredt): ${k} bájtot olvas, read → ${k}`, 5, "P_R → elengedve"); }
  S.eof = 1; n++;
  if (S.count > 0) {
    let k = readSome(); snap(String(n), `(${n}) LAB_SET_EOF (eof = 1), majd P_R: read → ${k} (a maradék bájtok)`, 4, "P_R → elengedve");
    while (S.count > 0) { n++; k = readSome(); snap(String(n), `(${n}) P_R: read → ${k}`, 4, "P_R → elengedve"); }
  } else n--;
  n++; rets.pr.push(0);
  snap(String(n), `(${n}) P_R: read → 0 (üres puffer és eof = 1: tartós EOF)`, 2, "P_R → elengedve");
  return st;
}
function load(){
  const N = +document.getElementById("nn").value, L = +document.getElementById("ll").value, msg = document.getElementById("err");
  if (!Number.isInteger(N) || N < 4 || N > 16 || !Number.isInteger(L) || L < 1 || L > 64) { msg.textContent = "Pufferméret 4–16, írási hossz 1–64."; return; }
  msg.textContent = ""; setSteps(simulate(N, L, document.getElementById("fix").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
