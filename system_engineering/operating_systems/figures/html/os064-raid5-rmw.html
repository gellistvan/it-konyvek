<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAID 5 read-modify-write</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="apply(false)">Normál RMW</button> <button onclick="apply(true)">⚡ Áramszünet a (4) után + lemezkiesés</button></div><div class="ctl">Saját 4 bites értékek: <label>D3 <input id="v3" value="1010" size="4" maxlength="4" aria-label="D3 4 biten"></label> <label>D4 <input id="v4" value="0110" size="4" maxlength="4" aria-label="D4 4 biten"></label> <label>D5 <input id="v5" value="0011" size="4" maxlength="4" aria-label="D5 4 biten"></label> <label>D4′ <input id="v4n" value="0001" size="4" maxlength="4" aria-label="D4′ 4 biten"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy lemez, négy csík left-symmetric RAID 5 elrendezésben; a D4 kis írása négy fizikai I/O-val (két olvasás, két írás), áramszünet a D4′ írása után, majd a D3 lemezének kiesésekor hibás rekonstrukció: 1101 a helyes 1010 helyett."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Left-symmetric elrendezés (Linux md alapértéke), 64 KiB chunk, 4 lemez; 4 bites számpélda (Python-ellenőrzés: P1 = 1111, P1′ = 1000, a write hole után D3 = 1101). A „Normál RMW” a teljes (1)–(5) sort, az „Áramszünet” a write hole-t és a lemezkiesést játssza le.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"io": 0, "line": 0, "d3": 10, "d4": 6, "d5": 3, "p1": 15, "d4n": 1, "p1n": 8, "cur": {"D3": 10, "D4": 6, "D5": 3, "P1": 15}, "msg": "Kiinduló csík: D3 = 1010, D4 = 0110, D5 = 0011, P1 = D3 ⊕ D4 ⊕ D5 = 1111. Új adat: D4′ = 0001."}];
const CODE = ["kiinduló csík (D3, D4, D5, P1)", "(1) old_d = read(D4)", "(2) old_p = read(P1)", "(3) new_p = old_p XOR old_d XOR new_d", "(4) write(D4, new_d)", "(5) write(P1, new_p)", "⚡ áramszünet a (4) után: (5) elmarad", "lemezkiesés: D3 = P1 XOR D4 XOR D5"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAY = {"0,3": "P0", "0,0": "D0", "0,1": "D1", "0,2": "D2", "1,2": "P1", "1,3": "D3", "1,0": "D4", "1,1": "D5", "2,1": "P2", "2,2": "D6", "2,3": "D7", "2,0": "D8", "3,0": "P3", "3,1": "D9", "3,2": "D10", "3,3": "D11"}, DISK = {"P0": 3, "D0": 0, "D1": 1, "D2": 2, "P1": 2, "D3": 3, "D4": 0, "D5": 1, "P2": 1, "D6": 2, "D7": 3, "D8": 0, "P3": 0, "D9": 1, "D10": 2, "D11": 3};
function b4(v){ return (v & 15).toString(2).padStart(4, "0"); }
function rd(id){ const s = document.getElementById(id).value.trim(); return /^[01]{4}$/.test(s) ? parseInt(s, 2) : null; }
function gen(d3, d4, d5, d4n, hole){
  const p1 = d3 ^ d4 ^ d5, p1n = p1 ^ d4 ^ d4n;
  const base = {d3: d3, d4: d4, d5: d5, p1: p1, d4n: d4n, p1n: p1n};
  const S = [
    Object.assign({}, base, {io: 0, cur: {D3: d3, D4: d4, D5: d5, P1: p1}, line: 0, msg: `Kiinduló csík: D3 = ${b4(d3)}, D4 = ${b4(d4)}, D5 = ${b4(d5)}, P1 = D3 ⊕ D4 ⊕ D5 = ${b4(p1)}. Új adat: D4′ = ${b4(d4n)}.`}),
    Object.assign({}, base, {io: 1, cur: {D3: d3, D4: d4, D5: d5, P1: p1}, line: 1, msg: `(1) régi D4 olvasása az L${DISK.D4}-ról: ${b4(d4)}  [1. fizikai I/O]`}),
    Object.assign({}, base, {io: 2, cur: {D3: d3, D4: d4, D5: d5, P1: p1}, line: 2, msg: `(2) régi P1 olvasása az L${DISK.P1}-ről: ${b4(p1)}  [2. fizikai I/O]`}),
    Object.assign({}, base, {io: 3, cur: {D3: d3, D4: d4, D5: d5, P1: p1}, line: 3, msg: `(3) P1′ = P1 ⊕ D4 ⊕ D4′ = ${b4(p1)} ⊕ ${b4(d4)} ⊕ ${b4(d4n)} = ${b4(p1n)}  (számítás, nincs I/O)`}),
    Object.assign({}, base, {io: 4, cur: {D3: d3, D4: d4n, D5: d5, P1: p1}, line: 4, msg: `(4) D4′ = ${b4(d4n)} írása az L${DISK.D4}-ra  [3. fizikai I/O]`}),
  ];
  if (!hole) {
    S.push(Object.assign({}, base, {io: 5, cur: {D3: d3, D4: d4n, D5: d5, P1: p1n}, line: 5, msg: `(5) P1′ = ${b4(p1n)} írása az L${DISK.P1}-re  [4. fizikai I/O] – a csík konzisztens: D3 ⊕ D4′ ⊕ D5 = ${b4(d3 ^ d4n ^ d5)} = P1′.`}));
  } else {
    S.push(Object.assign({}, base, {io: 6, cur: {D3: d3, D4: d4n, D5: d5, P1: p1}, line: 6, msg: `⚡ Áramszünet a (4) után: a D4 már új (${b4(d4n)}), a P1 régi (${b4(p1)}) – a csík inkonzisztens, de ez még nem látszik.`}));
    const rec = p1 ^ d4n ^ d5;
    S.push(Object.assign({}, base, {io: 7, cur: {D3: rec, D4: d4n, D5: d5, P1: p1}, fail: DISK.D3, line: 7, msg: `Az L${DISK.D3} (a D3 lemeze) kiesik → rekonstrukció: D3 = P1 ⊕ D4′ ⊕ D5 = ${b4(p1)} ⊕ ${b4(d4n)} ⊕ ${b4(d5)} = ${b4(rec)} ` + (rec === d3 ? "(véletlenül helyes)" : `– HIBÁS, a helyes ${b4(d3)}`)}));
  }
  return S;
}
function apply(hole){ const v = ["v3", "v4", "v5", "v4n"].map(rd); if (v.includes(null)) { status.textContent = "Adj meg négy bitet (0/1) mindegyik mezőben."; return; } setSteps(gen(v[0], v[1], v[2], v[3], hole)); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.3"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const cw = 110, ch = 40, x0 = 40, y0 = 30;
  for (let d = 0; d < 4; d++) el("text", {x: x0 + d * cw + cw / 2, y: y0 - 8, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "L" + d + (s.fail === d ? " – kiesett" : ""));
  for (let st = 0; st < 4; st++) {
    el("text", {x: x0 - 8, y: y0 + st * ch + 25, "text-anchor": "end", "font-size": 11}, st + ".");
    for (let d = 0; d < 4; d++) {
      const lab = LAY[st + "," + d], par = lab[0] === "P", x = x0 + d * cw, y = y0 + st * ch;
      const on = (lab === "D4" && [1, 4, 6, 7].includes(s.io)) || (lab === "P1" && [2, 5].includes(s.io)) || (lab === "D3" && s.io === 7);
      el("rect", {x: x, y: y, width: cw, height: ch, fill: par ? "url(#hb)" : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : 1, opacity: s.fail === d ? 0.4 : 1});
      let t = lab;
      if (st === 1 && s.cur[lab] !== undefined) t += " = " + b4(s.cur[lab]);
      const e = el("text", {x: x + cw / 2, y: y + 25, "text-anchor": "middle", "font-size": 13, "font-weight": st === 1 ? "bold" : "normal"}, t);
      e.setAttribute("stroke", css("--bg")); e.setAttribute("stroke-width", 4); e.setAttribute("paint-order", "stroke");
      if (s.fail === d && st === 1) { el("line", {x1: x + 6, y1: y + 4, x2: x + cw - 6, y2: y + ch - 4, stroke: css("--hl2"), "stroke-width": 2, opacity: 0.5}); el("line", {x1: x + cw - 6, y1: y + 4, x2: x + 6, y2: y + ch - 4, stroke: css("--hl2"), "stroke-width": 2, opacity: 0.5}); }
    }
  }
  // vezérlő
  el("rect", {x: 520, y: 70, width: 230, height: 90, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 635, y: 92, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, "vezérlő");
  el("text", {x: 635, y: 114, "text-anchor": "middle", "font-size": 12}, "P1′ = P1 ⊕ D4 ⊕ D4′");
  if (s.io >= 3) el("text", {x: 635, y: 136, "text-anchor": "middle", "font-size": 12}, `= ${b4(s.p1n)}`);
  const ydisk = y0 + 1 * ch + ch / 2, xD4 = x0 + DISK.D4 * cw + cw / 2, xP1 = x0 + DISK.P1 * cw + cw / 2;
  function io(x, read, label){ const yy = ydisk + 20; el("path", {d: read ? `M ${x} ${yy} Q ${x} 230 520 150` : `M 520 150 Q ${x} 250 ${x} ${yy}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": read ? "none" : "7 4", "marker-end": "url(#ar)"}); el("text", {x: x + 8, y: 225, "font-size": 12, fill: css("--hl2")}, label); }
  if (s.io === 1) io(xD4, true, "(1) olvasás");
  if (s.io === 2) io(xP1, true, "(2) olvasás");
  if (s.io === 4) io(xD4, false, "(4) írás");
  if (s.io === 5) io(xP1, false, "(5) írás");
  const nio = [0, 1, 2, 2, 3, 4, 3, 3][s.io];
  el("text", {x: 10, y: 268, "font-size": 12.5}, `fizikai I/O eddig: ${nio} (${Math.min(nio, 2)} olvasás + ${Math.max(0, nio - 2)} írás)`);
  if (s.io === 6) el("text", {x: 10, y: 290, "font-size": 15, fill: css("--hl2")}, "⚡ áramszünet: a P1 régi maradt (write hole)");
  if (s.io === 7) el("text", {x: 10, y: 290, "font-size": 12.5, fill: css("--hl2")}, `rekonstruált D3 = ${b4(s.cur.D3)}, helyes D3 = ${b4(s.d3)}`);
}

STEPS = gen(10, 6, 3, 1, true);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
