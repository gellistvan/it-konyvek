<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A/B frissítés boot counterrel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="bad" type="checkbox" onchange="toggleBad()"> az új slot hibás</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A/B frissítés állapotgépe: S0 az A fut; a frissítő megírja a B slotot és beállítja: active_slot=b, attempts=3, ok=0 (S1); a bootloader minden indításkor csökkenti a számlálót és a B-t indítja (S2); sikeres induláskor a felhasználói tér boot_b_ok=1-et ír (S3); hibás B-nél három kísérlet után (attempts 2, 1, 0) a bootloader active_slot=a-ra vált (S4)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A T-O10-045 szerinti logika: a számlálót a bootloader minden kísérlet előtt csökkenti (a hibáról nem értesül), a sikerjelzőt a felhasználói tér állítja be, a slotváltást a frissítő írja be. Kezdőérték 3 próbálkozás; a változónevek a fejezet szemléltető példájához igazodnak (B slot).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"state": "S0", "actor": "-", "msg": "S0: az A slot fut, a B a régi képet tartalmazza.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 0}, {"state": "S0", "actor": "U", "msg": "Frissítő: az új boot_b/rootfs_b írása az inaktív B slotra; hash és aláírás OK.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 1}, {"state": "S1", "actor": "U", "msg": "Frissítő: fw_setenv active_slot=b, boot_b_attempts=3, boot_b_ok=0 → S1 „B jelölt”; reboot.", "env": {"active_slot": "b", "boot_b_attempts": 3, "boot_b_ok": 0}, "run": "a", "line": 2}, {"state": "S2", "actor": "B", "msg": "Bootloader: ok=0, attempts 3→2, B indítása (1. kísérlet).", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 0}, "run": "b", "line": 3}, {"state": "S3", "actor": "S", "msg": "Felhasználói tér: sikeres indulás → fw_setenv boot_b_ok 1 → S3 „B megerősítve”.", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 1}, "run": "b", "line": 4}];
const CODE = ["S0: A fut (active_slot=a)", "frissítő: inaktív slot írása; hash + aláírás ellenőrzése", "frissítő: fw_setenv active_slot=b boot_b_attempts=3 boot_b_ok=0; reboot", "bootloader: if ok==0 && attempts>0: attempts−−; B indítása", "felhasználói tér: fw_setenv boot_b_ok 1   /* siker */", "bootloader: if ok==0 && attempts==0: active_slot=a   /* visszaváltás */", "hiba: lefagyás / watchdog reset → reboot"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GOOD = [{"state": "S0", "actor": "-", "msg": "S0: az A slot fut, a B a régi képet tartalmazza.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 0}, {"state": "S0", "actor": "U", "msg": "Frissítő: az új boot_b/rootfs_b írása az inaktív B slotra; hash és aláírás OK.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 1}, {"state": "S1", "actor": "U", "msg": "Frissítő: fw_setenv active_slot=b, boot_b_attempts=3, boot_b_ok=0 → S1 „B jelölt”; reboot.", "env": {"active_slot": "b", "boot_b_attempts": 3, "boot_b_ok": 0}, "run": "a", "line": 2}, {"state": "S2", "actor": "B", "msg": "Bootloader: ok=0, attempts 3→2, B indítása (1. kísérlet).", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 0}, "run": "b", "line": 3}, {"state": "S3", "actor": "S", "msg": "Felhasználói tér: sikeres indulás → fw_setenv boot_b_ok 1 → S3 „B megerősítve”.", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 1}, "run": "b", "line": 4}], BAD = [{"state": "S0", "actor": "-", "msg": "S0: az A slot fut, a B a régi képet tartalmazza.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 0}, {"state": "S0", "actor": "U", "msg": "Frissítő: az új boot_b/rootfs_b írása az inaktív B slotra; hash és aláírás OK.", "env": {"active_slot": "a", "boot_b_attempts": "–", "boot_b_ok": "–"}, "run": "a", "line": 1}, {"state": "S1", "actor": "U", "msg": "Frissítő: fw_setenv active_slot=b, boot_b_attempts=3, boot_b_ok=0 → S1 „B jelölt”; reboot.", "env": {"active_slot": "b", "boot_b_attempts": 3, "boot_b_ok": 0}, "run": "a", "line": 2}, {"state": "S2", "actor": "B", "msg": "Bootloader: ok=0, attempts 3→2, B indítása (1. kísérlet).", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 0}, "run": "b", "line": 3}, {"state": "S2", "actor": "-", "msg": "A B lefagy, a watchdog resetel → reboot (a bootloader nem értesül a hibáról).", "env": {"active_slot": "b", "boot_b_attempts": 2, "boot_b_ok": 0}, "run": "–", "line": 6}, {"state": "S2", "actor": "B", "msg": "Bootloader: ok=0, attempts 2→1, B indítása (2. kísérlet).", "env": {"active_slot": "b", "boot_b_attempts": 1, "boot_b_ok": 0}, "run": "b", "line": 3}, {"state": "S2", "actor": "-", "msg": "A B lefagy, a watchdog resetel → reboot (a bootloader nem értesül a hibáról).", "env": {"active_slot": "b", "boot_b_attempts": 1, "boot_b_ok": 0}, "run": "–", "line": 6}, {"state": "S2", "actor": "B", "msg": "Bootloader: ok=0, attempts 1→0, B indítása (3. kísérlet).", "env": {"active_slot": "b", "boot_b_attempts": 0, "boot_b_ok": 0}, "run": "b", "line": 3}, {"state": "S2", "actor": "-", "msg": "A B lefagy, a watchdog resetel → reboot (a bootloader nem értesül a hibáról).", "env": {"active_slot": "b", "boot_b_attempts": 0, "boot_b_ok": 0}, "run": "–", "line": 6}, {"state": "S4", "actor": "B", "msg": "Bootloader: boot_b_ok=0 és boot_b_attempts=0 → active_slot=a, visszaváltás, az A indul (S4).", "env": {"active_slot": "a", "boot_b_attempts": 0, "boot_b_ok": 0}, "run": "a", "line": 5}];
function toggleBad(){ setSteps(document.getElementById("bad").checked ? BAD : GOOD); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  // flash
  el("text", {x: 70, y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "flash");
  [["boot_a", "a"], ["rootfs_a", "a"], ["boot_b", "b"], ["rootfs_b", "b"]].forEach((x, i) => {
    const y = 34 + i * 44 + (x[1] === "b" ? 14 : 0), act = s.env.active_slot === x[1], run = s.run === x[1];
    el("rect", {x: 10, y: y, width: 120, height: 38, fill: run ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": act ? 4 : 1});
    el("text", {x: 70, y: y + 24, "text-anchor": "middle", "font-size": 13}, x[0]);
  });
  el("text", {x: 70, y: 240, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "vastag keret = active_slot");
  el("text", {x: 70, y: 256, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "szürke = éppen fut");
  // állapotok
  const P = {S0: [230, 50], S1: [420, 50], S2: [420, 170], S3: [640, 50], S4: [230, 280]};
  const T = {S0: ["S0", "A fut, B régi"], S1: ["S1 B jelölt", "active_slot=b"], S2: ["S2 bootloader", "attempts−1, B indul"],
             S3: ["S3 B megerősítve", "boot_b_ok=1"], S4: ["S4 visszaváltás", "active_slot=a"]};
  const E = [["S0", "S1", false], ["S1", "S2", false], ["S2", "S3", false], ["S2", "S4", true]];
  E.forEach(e => { const a = P[e[0]], b = P[e[1]];
    el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--muted"), "stroke-width": 2, "stroke-dasharray": e[2] ? "7 5" : "none"}); });
  el("path", {d: "M470 195 C 540 250, 520 120, 470 150", fill: "none", stroke: css("--muted"), "stroke-width": 2, "stroke-dasharray": "7 5"});
  el("text", {x: 476, y: 262, "font-size": 11, fill: css("--muted")}, "hiba → reboot");
  Object.keys(P).forEach(k2 => { const p = P[k2], on = s.state === k2;
    el("rect", {x: p[0] - 75, y: p[1] - 24, width: 150, height: 48, rx: 10, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.2});
    el("text", {x: p[0], y: p[1] - 4, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, T[k2][0]);
    el("text", {x: p[0], y: p[1] + 14, "text-anchor": "middle", "font-size": 11}, T[k2][1]); });
  // szereplők
  const A = [["U", "⚙ frissítő"], ["B", "▣ bootloader"], ["S", "☺ felhasználói tér"]];
  A.forEach((a, i) => { const on = s.actor === a[0];
    el("rect", {x: 570, y: 110 + i * 34, width: 180, height: 28, rx: 6, fill: on ? css("--fg") : css("--cell"), stroke: css("--line")});
    el("text", {x: 660, y: 129 + i * 34, "text-anchor": "middle", "font-size": 13, fill: on ? css("--bg") : css("--fg")}, a[1]); });
  // változótábla
  const rows = [["active_slot", s.env.active_slot], ["boot_b_attempts", s.env.boot_b_attempts], ["boot_b_ok", s.env.boot_b_ok]];
  rows.forEach((r, i) => { const y = 230 + i * 26;
    el("rect", {x: 570, y: y, width: 120, height: 26, fill: css("--cell"), stroke: css("--line")});
    el("rect", {x: 690, y: y, width: 60, height: 26, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 578, y: y + 18, "font-size": 12, "font-family": "monospace"}, r[0]);
    el("text", {x: 720, y: y + 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, String(r[1])); });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
