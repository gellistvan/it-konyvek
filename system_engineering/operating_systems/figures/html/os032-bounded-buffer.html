<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korlátos körpuffer monitorral</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Saját sorrend:</span> <button onclick="own('put','P0')">put P0</button> <button onclick="own('put','P1')">put P1</button> <button onclick="own('get','C0')">get C0</button> <button onclick="own('get','C1')">get C1</button> <button onclick="own('put','main')">sentinel (−1)</button> <button onclick="ownReset()">Üres puffer</button> <button onclick="scen()">A könyv forgatókönyve</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc rekeszes gyűrű az in és out mutatóval; mellette count, a not_full és a not_empty várakozási sor és a mutex tulajdonosa lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">CAPACITY = 8, Mesa-szemantika (while). Egy várakozó szálat signal ébreszt, és a következő lépésben újraellenőrzés után hajtja végre a műveletét. Tele pufferre kattintott put / üres pufferre kattintott get a megfelelő várakozási sorba kerül. Szemléltető ütemezés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"buf": [null, null, null, null, null, null, null, null], "i": 0, "o": 0, "count": 0, "nf": [], "ne": [], "owner": null, "msg": "Kezdetben a puffer üres: in = 0, out = 0, count = 0; mindkét várakozási sor üres.", "line": -1, "hl": null}, {"buf": [0, null, null, null, null, null, null, null], "i": 1, "o": 0, "count": 1, "nf": [], "ne": [], "owner": "P0", "msg": "P0: put(0): buffer[0] = 0, in = 1, count = 1; signal(not_empty)", "line": 7, "hl": 0}, {"buf": [0, 10000, null, null, null, null, null, null], "i": 2, "o": 0, "count": 2, "nf": [], "ne": [], "owner": "P1", "msg": "P1: put(10000): buffer[1] = 10000, in = 2, count = 2; signal(not_empty)", "line": 7, "hl": 1}, {"buf": [0, 10000, 1, null, null, null, null, null], "i": 3, "o": 0, "count": 3, "nf": [], "ne": [], "owner": "P0", "msg": "P0: put(1): buffer[2] = 1, in = 3, count = 3; signal(not_empty)", "line": 7, "hl": 2}, {"buf": [0, 10000, 1, 10001, null, null, null, null], "i": 4, "o": 0, "count": 4, "nf": [], "ne": [], "owner": "P1", "msg": "P1: put(10001): buffer[3] = 10001, in = 4, count = 4; signal(not_empty)", "line": 7, "hl": 3}, {"buf": [0, 10000, 1, 10001, 2, null, null, null], "i": 5, "o": 0, "count": 5, "nf": [], "ne": [], "owner": "P0", "msg": "P0: put(2): buffer[4] = 2, in = 5, count = 5; signal(not_empty)", "line": 7, "hl": 4}, {"buf": [0, 10000, 1, 10001, 2, 10002, null, null], "i": 6, "o": 0, "count": 6, "nf": [], "ne": [], "owner": "P1", "msg": "P1: put(10002): buffer[5] = 10002, in = 6, count = 6; signal(not_empty)", "line": 7, "hl": 5}, {"buf": [0, 10000, 1, 10001, 2, 10002, 3, null], "i": 7, "o": 0, "count": 7, "nf": [], "ne": [], "owner": "P0", "msg": "P0: put(3): buffer[6] = 3, in = 7, count = 7; signal(not_empty)", "line": 7, "hl": 6}, {"buf": [0, 10000, 1, 10001, 2, 10002, 3, 10003], "i": 0, "o": 0, "count": 8, "nf": [], "ne": [], "owner": "P1", "msg": "P1: put(10003): buffer[7] = 10003, in = 0, count = 8; signal(not_empty)", "line": 7, "hl": 7}, {"buf": [0, 10000, 1, 10001, 2, 10002, 3, 10003], "i": 0, "o": 0, "count": 8, "nf": ["P1"], "ne": [], "owner": null, "msg": "P1: put(10004): count == 8 → wait(not_full); a not_full sora: [P1]", "line": 3, "hl": null}, {"buf": [null, 10000, 1, 10001, 2, 10002, 3, 10003], "i": 0, "o": 1, "count": 7, "nf": [], "ne": [], "owner": "C0", "msg": "C0: get(): item = buffer[0] = 0, out = 1, count = 7; signal(not_full) → P1 felébred", "line": 16, "hl": 0}, {"buf": [10004, 10000, 1, 10001, 2, 10002, 3, 10003], "i": 1, "o": 1, "count": 8, "nf": [], "ne": [], "owner": "P1", "msg": "P1 felébred, while: count = 7 < 8 → buffer[0] = 10004, in = 1, count = 8; signal(not_empty)", "line": 7, "hl": 0}, {"buf": [10004, null, 1, 10001, 2, 10002, 3, 10003], "i": 1, "o": 2, "count": 7, "nf": [], "ne": [], "owner": "C1", "msg": "C1: get(): item = buffer[1] = 10000, out = 2, count = 7; signal(not_full)", "line": 16, "hl": 1}, {"buf": [10004, null, null, 10001, 2, 10002, 3, 10003], "i": 1, "o": 3, "count": 6, "nf": [], "ne": [], "owner": "C0", "msg": "C0: get(): item = buffer[2] = 1, out = 3, count = 6; signal(not_full)", "line": 16, "hl": 2}, {"buf": [10004, null, null, null, 2, 10002, 3, 10003], "i": 1, "o": 4, "count": 5, "nf": [], "ne": [], "owner": "C1", "msg": "C1: get(): item = buffer[3] = 10001, out = 4, count = 5; signal(not_full)", "line": 16, "hl": 3}, {"buf": [10004, null, null, null, null, 10002, 3, 10003], "i": 1, "o": 5, "count": 4, "nf": [], "ne": [], "owner": "C0", "msg": "C0: get(): item = buffer[4] = 2, out = 5, count = 4; signal(not_full)", "line": 16, "hl": 4}, {"buf": [10004, null, null, null, null, null, 3, 10003], "i": 1, "o": 6, "count": 3, "nf": [], "ne": [], "owner": "C1", "msg": "C1: get(): item = buffer[5] = 10002, out = 6, count = 3; signal(not_full)", "line": 16, "hl": 5}, {"buf": [10004, null, null, null, null, null, null, 10003], "i": 1, "o": 7, "count": 2, "nf": [], "ne": [], "owner": "C0", "msg": "C0: get(): item = buffer[6] = 3, out = 7, count = 2; signal(not_full)", "line": 16, "hl": 6}, {"buf": [10004, null, null, null, null, null, null, null], "i": 1, "o": 0, "count": 1, "nf": [], "ne": [], "owner": "C1", "msg": "C1: get(): item = buffer[7] = 10003, out = 0, count = 1; signal(not_full)", "line": 16, "hl": 7}, {"buf": [null, null, null, null, null, null, null, null], "i": 1, "o": 1, "count": 0, "nf": [], "ne": [], "owner": "C0", "msg": "C0: get(): item = buffer[0] = 10004, out = 1, count = 0; signal(not_full)", "line": 16, "hl": 0}, {"buf": [null, null, null, null, null, null, null, null], "i": 1, "o": 1, "count": 0, "nf": [], "ne": ["C1"], "owner": null, "msg": "C1: get(): count == 0 → wait(not_empty); a not_empty sora: [C1]", "line": 12, "hl": null}, {"buf": [null, -1, null, null, null, null, null, null], "i": 2, "o": 1, "count": 1, "nf": [], "ne": [], "owner": "main", "msg": "main: put(-1): buffer[1] = -1, in = 2, count = 1; signal(not_empty) → C1 felébred", "line": 7, "hl": 1}, {"buf": [null, null, null, null, null, null, null, null], "i": 2, "o": 2, "count": 0, "nf": [], "ne": [], "owner": "C1", "msg": "C1 felébred, while: count = 1 > 0 → item = buffer[1] = -1, out = 2, count = 0; signal(not_full); sentinel: C1 kilép", "line": 16, "hl": 1}];
const CODE = ["put(item):", "    lock(mutex)", "    while count == CAPACITY:", "        wait(not_full, mutex)", "    buffer[in] = item", "    in = (in + 1) % CAPACITY", "    count = count + 1", "    signal(not_empty)", "    unlock(mutex)", "get():", "    lock(mutex)", "    while count == 0:", "        wait(not_empty, mutex)", "    item = buffer[out]", "    out = (out + 1) % CAPACITY", "    count = count - 1", "    signal(not_full)", "    unlock(mutex)", "    return item"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CAP = 8;
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const cx = 160, cy = 165, R1 = 105, R0 = 56;
  const P = (r, a) => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
  for (let j = 0; j < CAP; j++) {
    const a0 = (90 - 45 * (j + 1)) * Math.PI / 180, a1 = a0 + Math.PI / 4, v = s.buf[j];
    const [x0, y0] = P(R1, a0), [x1, y1] = P(R1, a1), [x2, y2] = P(R0, a1), [x3, y3] = P(R0, a0);
    el("path", {d: `M${x0},${y0} A${R1},${R1} 0 0 0 ${x1},${y1} L${x2},${y2} A${R0},${R0} 0 0 1 ${x3},${y3} Z`,
                fill: v !== null ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": j === s.hl ? 3.5 : 1.2});
    const am = a0 + Math.PI / 8, [tx, ty] = P((R0 + R1) / 2, am), [nx, ny] = P(R1 + 12, am);
    if (v !== null) el("text", {x: tx, y: ty + 4, "text-anchor": "middle", "font-size": 11}, String(v).replace("-", "−"));
    el("text", {x: nx, y: ny + 4, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(j));
  }
  function arr(idx, name, outer, dash){
    const am = (90 - 45 * idx - 22.5) * Math.PI / 180;
    const [a, b] = outer ? [P(R1 + 34, am), P(R1 + 3, am)] : [P(10, am), P(R0 - 3, am)];
    el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--hl"), "stroke-width": 2.5, "stroke-dasharray": dash ? "6 4" : "none"});
    el("circle", {cx: b[0], cy: b[1], r: 4, fill: css("--hl")});
    const [lx, ly] = outer ? P(R1 + 46, am) : [cx, cy + 4];
    el("text", {x: lx, y: ly + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: css("--hl")}, name);
  }
  arr(s.i, "in", true, false); arr(s.o, "out", false, true);
  const X = 340;
  el("text", {x: X, y: 40, "font-size": 15}, `in = ${s.i}   out = ${s.o}   count = ${s.count}`);
  el("text", {x: X, y: 66, "font-size": 12, fill: css("--muted")}, "invariáns: 0 ≤ count ≤ 8 – teljesül");
  el("text", {x: X, y: 104, "font-size": 14}, "not_full sora:");
  el("text", {x: X + 10, y: 126, "font-size": 14, "font-weight": "bold"}, "[" + s.nf.join(", ") + "]");
  el("text", {x: X, y: 160, "font-size": 14}, "not_empty sora:");
  el("text", {x: X + 10, y: 182, "font-size": 14, "font-weight": "bold"}, "[" + s.ne.join(", ") + "]");
  el("text", {x: X, y: 218, "font-size": 14}, "mutex: " + (s.owner || "szabad"));
  el("text", {x: X, y: 270, "font-size": 11, fill: css("--muted")}, "szürke = foglalt rekesz");
  el("text", {x: X, y: 286, "font-size": 11, fill: css("--muted")}, "in: folytonos, out: szaggatott");
}
// ---- saját sorrend: ugyanaz a szimuláció, mint a Python-szkriptben ----
let OWNOPS = [];
function simulate(ops){
  const S = {buf: Array(CAP).fill(null), i: 0, o: 0, count: 0, nf: [], ne: [], nxt: {P0: 0, P1: 10000}}, pend = {}, st = [];
  function rec(actor, msg, line, hl){ st.push({buf: S.buf.slice(), i: S.i, o: S.o, count: S.count, nf: S.nf.slice(), ne: S.ne.slice(), owner: actor, msg, line, hl: hl === undefined ? null : hl}); }
  function put(t, woken){
    if (S.nf.includes(t) || S.ne.includes(t)) return;
    let item;
    if (t in pend) { item = pend[t]; delete pend[t]; } else item = t === "main" ? -1 : S.nxt[t];
    if (t !== "main" && !woken) S.nxt[t] += 1;
    const pre = woken ? `${t} felébred, while: count = ${S.count} < 8 → ` : `${t}: put(${item}): `;
    if (S.count === CAP) { S.nf.push(t); pend[t] = item; rec(null, `${t}: put(${item}): count == 8 → wait(not_full); a not_full sora: [${S.nf.join(", ")}]`, 3); return; }
    const slot = S.i; S.buf[slot] = item; S.i = (S.i + 1) % CAP; S.count += 1;
    let msg = pre + `buffer[${slot}] = ${item}, in = ${S.i}, count = ${S.count}; signal(not_empty)`;
    const w = S.ne.length ? S.ne.shift() : null; if (w) msg += ` → ${w} felébred`;
    rec(t, msg, 7, slot); if (w) get(w, true);
  }
  function get(t, woken){
    if (S.nf.includes(t) || S.ne.includes(t)) return;
    if (S.count === 0) { S.ne.push(t); rec(null, `${t}: get(): count == 0 → wait(not_empty); a not_empty sora: [${S.ne.join(", ")}]`, 12); return; }
    const slot = S.o, item = S.buf[slot]; S.buf[slot] = null; S.o = (S.o + 1) % CAP; S.count -= 1;
    let msg = (woken ? `${t} felébred, while: count = ${S.count + 1} > 0 → ` : `${t}: get(): `) + `item = buffer[${slot}] = ${item}, out = ${S.o}, count = ${S.count}; signal(not_full)`;
    const w = S.nf.length ? S.nf.shift() : null; if (w) msg += ` → ${w} felébred`;
    if (item === -1) msg += `; sentinel: ${t} kilép`;
    rec(t, msg, 16, slot); if (w) put(w, true);
  }
  rec(null, "Kezdetben a puffer üres: in = 0, out = 0, count = 0; mindkét várakozási sor üres.", -1);
  ops.forEach(([op, t]) => (op === "put" ? put : get)(t));
  return st;
}
function own(op, t){ OWNOPS.push([op, t]); setSteps(simulate(OWNOPS)); show(STEPS.length - 1); }
function ownReset(){ OWNOPS = []; setSteps(simulate(OWNOPS)); }
function scen(){ OWNOPS = [["put", "P0"], ["put", "P1"], ["put", "P0"], ["put", "P1"], ["put", "P0"], ["put", "P1"], ["put", "P0"], ["put", "P1"], ["put", "P1"], ["get", "C0"], ["get", "C1"], ["get", "C0"], ["get", "C1"], ["get", "C0"], ["get", "C1"], ["get", "C0"], ["get", "C1"], ["get", "C0"], ["get", "C1"], ["put", "main"]].slice(); setSteps(simulate(OWNOPS)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
