<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy-on-write a fork után</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>lap i: <select id="pg" aria-label="Lap sorszáma"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><button onclick="act('C')">gyermek ír lapra i</button><button onclick="act('P')">szülő ír lapra i</button><span class="small">(a gomb az aktuális lépés után fűzi a saját írást)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szülő és gyermek laptáblája, köztük a K10–K13 fizikai keretek refcounttal; fork után mindkét tábla írásvédett, a gyermek írása után új K20 keret."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus modell a 11.3 COW_kezeles pszeudokódja szerint (nem kernelfutás). Folytonos vastag nyíl = PTE rw, szaggatott = PTE ro; sraffozott = új COW-keret; rc = refcount.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"P": [["K10", true], ["K11", true], ["K12", true], ["K13", true]], "C": null, "rc": {"K10": 1, "K11": 1, "K12": 1, "K13": 1}, "side": {}, "nxt": 20, "fault": null, "tlb": null, "copy": null, "line": -1, "msg": "Fork előtt: a szülő PTE0–3 írható (rw) → K10–K13, refcount = 1; a VMA rw."}, {"P": [["K10", false], ["K11", false], ["K12", false], ["K13", false]], "C": [["K10", false], ["K11", false], ["K12", false], ["K13", false]], "rc": {"K10": 2, "K11": 2, "K12": 2, "K13": 2}, "side": {}, "nxt": 20, "fault": null, "tlb": "PC", "copy": null, "line": -1, "msg": "fork(): mindkét laptábla PTE-i csak olvashatók (ro) → K10–K13, refcount = 2; a VMA mindkettőben rw; TLB-invalidálás (a szülő írható bejegyzései)."}, {"P": [["K10", false], ["K11", false], ["K12", false], ["K13", false]], "C": [["K10", false], ["K11", false], ["K12", false], ["K13", false]], "rc": {"K10": 2, "K11": 2, "K12": 2, "K13": 2}, "side": {}, "nxt": 20, "fault": ["C", 0], "tlb": null, "copy": null, "line": 2, "msg": "A gyermek ír a 0. lapra → laphiba (VMA rw + PTE ro → COW); refcount(K10) = 2 > 1 → másolás kell."}, {"P": [["K10", false], ["K11", false], ["K12", false], ["K13", false]], "C": [["K20", true], ["K11", false], ["K12", false], ["K13", false]], "rc": {"K10": 1, "K11": 2, "K12": 2, "K13": 2, "K20": 1}, "side": {"K20": ["C", 0]}, "nxt": 21, "fault": null, "tlb": "C", "copy": ["K10", "K20"], "line": 9, "msg": "refcount(K10) = 2 → új keret K20, másolás K10 → K20; gyermek PTE0 rw → K20; refcount(K10) = 1; TLB-invalidálás."}, {"P": [["K10", true], ["K11", false], ["K12", false], ["K13", false]], "C": [["K20", true], ["K11", false], ["K12", false], ["K13", false]], "rc": {"K10": 1, "K11": 2, "K12": 2, "K13": 2, "K20": 1}, "side": {"K20": ["C", 0]}, "nxt": 21, "fault": ["P", 0], "tlb": "P", "copy": null, "line": 3, "msg": "A szülő ír a 0. lapra → laphiba (VMA rw + PTE ro → COW); refcount(K10) = 1 → csak írhatóvá tétel, nincs másolás; TLB-invalidálás."}];
const CODE = ["COW_kezeles(processz, vma, hibas_cim):", "    lap = lekerdez_a_page_tablabol(processz, hibas_cim)", "    ha lap.refcount == 1:", "        page_table_bejegyzes.iras = IGAZ", "        TLB_invalidalas(hibas_cim)", "        return UJRAINDITAS", "    uj_lap = fizikai_lap_allokalasa()", "    masolas(uj_lap, lap)", "    lap.refcount -= 1", "    page_table_bejegyzes.lap = uj_lap", "    page_table_bejegyzes.iras = IGAZ", "    TLB_invalidalas(hibas_cim)", "    return UJRAINDITAS"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NM = {P: "szülő", C: "gyermek"};
const ROWY = [62, 114, 166, 218], PTX = {P: [10, 140], C: [460, 590]};
const FRX = {main: [255, 345], P: [160, 235], C: [365, 440]}, HH = 38;
function fbox(s, name){ if (s.side[name]) { const [w, p] = s.side[name]; return [FRX[w][0], ROWY[p], FRX[w][1]-FRX[w][0]]; }
  return [FRX.main[0], ROWY[+name.slice(2)], FRX.main[1]-FRX.main[0]]; }
function arrowDef(){ const d = el("defs", {}); d.innerHTML =
  `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${css("--line")}"/></marker>
   <pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1"/></pattern>`; }
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300"); svg.innerHTML = ""; arrowDef();
  el("text", {x: 300, y: 30, "text-anchor": "middle", "font-size": 13}, "fizikai keretek");
  for (const who of ["P", "C"]) {
    const [x0, x1] = PTX[who];
    el("text", {x: (x0+x1)/2, y: 30, "text-anchor": "middle", "font-size": 13}, NM[who] + " laptáblája");
    const tab = s[who];
    for (let i = 0; i < 4; i++) {
      const y = ROWY[i];
      if (!tab) { el("rect", {x: x0, y, width: x1-x0, height: HH, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 3"});
        if (i === 1) el("text", {x: (x0+x1)/2, y: y + 45, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "(még nincs)"); continue; }
      const [fr, w] = tab[i], hot = s.fault && s.fault[0] === who && s.fault[1] === i;
      el("rect", {x: x0, y, width: x1-x0, height: HH, fill: css("--cell"), stroke: css("--line"), "stroke-width": hot ? 3.5 : 1.2});
      el("text", {x: x0 + 6, y: y + 15, "font-size": 12}, `VP${i}  VMA rw`);
      el("text", {x: x0 + 6, y: y + 31, "font-size": 12, "font-weight": w ? "bold" : "normal"}, "PTE " + (w ? "rw" : "ro"));
      const [fx, fy, fw] = fbox(s, fr), xa = who === "P" ? x1 : x0, xb = who === "P" ? fx : fx + fw;
      el("line", {x1: xa, y1: y + HH/2, x2: xb, y2: fy + HH/2, stroke: hot ? css("--hl2") : css("--line"), "stroke-width": w ? 3 : 1.4,
                  "stroke-dasharray": w ? "" : "6 4", "marker-end": "url(#ah)"});
      if (hot) el("text", {x: who === "P" ? x1 - 4 : x0 + 4, y: y - 3, "text-anchor": who === "P" ? "end" : "start", "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "⚡ laphiba");
    }
    if (s.tlb && s.tlb.includes(who)) {
      el("rect", {x: (x0+x1)/2 - 34, y: 262, width: 68, height: 20, rx: 4, fill: "none", stroke: css("--line")});
      el("text", {x: (x0+x1)/2, y: 276, "text-anchor": "middle", "font-size": 12}, "TLB-inv.");
    }
  }
  for (const name in s.rc) {
    const [fx, fy, fw] = fbox(s, name), nw = !!s.side[name];
    el("rect", {x: fx, y: fy, width: fw, height: HH, fill: nw ? "url(#hat)" : css("--cell"), stroke: css("--line"), "stroke-width": 1.4});
    if (nw) el("rect", {x: fx + 8, y: fy + 4, width: fw - 16, height: HH - 8, fill: css("--cell")});
    el("text", {x: fx + fw/2, y: fy + 16, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, name);
    el("text", {x: fx + fw/2, y: fy + 31, "text-anchor": "middle", "font-size": 12}, "rc=" + s.rc[name]);
  }
  if (s.copy) { const [sx, sy] = fbox(s, s.copy[0]), [dx, dy, dw] = fbox(s, s.copy[1]);
    el("path", {d: `M${sx+70},${sy+HH} Q${(sx+dx)/2+60},${sy+HH+40} ${dx+dw/2},${dy+HH}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.5, "marker-end": "url(#ah)"});
    el("text", {x: (sx+dx)/2 + 70, y: sy + HH + 40, "font-size": 12, fill: css("--hl")}, "másolás"); }
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function cowWrite(s, who, page){
  const t = clone(s); t.fault = null; t.tlb = null; t.copy = null;
  const nm = NM[who];
  if (!t[who]) { t.line = -1; t.msg = "Még nem volt fork: a gyermek nem létezik."; return [t]; }
  const pte = t[who][page];
  if (pte[1]) { t.line = -1; t.msg = `A ${nm} ír a ${page}. lapra: a PTE már rw, nincs laphiba, az írás közvetlenül a ${pte[0]} keretbe megy.`; return [t]; }
  const fr = pte[0];
  if (t.rc[fr] === 1) { pte[1] = true; t.fault = [who, page]; t.tlb = who; t.line = 3;
    t.msg = `A ${nm} ír a ${page}. lapra → laphiba (VMA rw + PTE ro → COW); refcount(${fr}) = 1 → csak írhatóvá tétel, nincs másolás; TLB-invalidálás.`; return [t]; }
  const a = clone(t); a.fault = [who, page]; a.line = 2;
  a.msg = `A ${nm} ír a ${page}. lapra → laphiba (VMA rw + PTE ro → COW); refcount(${fr}) = ${t.rc[fr]} > 1 → másolás kell.`;
  const nw = "K" + t.nxt; t.nxt++; t.rc[fr]--; t.rc[nw] = 1; t.side[nw] = [who, page]; pte[0] = nw; pte[1] = true;
  t.copy = [fr, nw]; t.tlb = who; t.line = 9;
  t.msg = `refcount(${fr}) = ${t.rc[fr] + 1} → új keret ${nw}, másolás ${fr} → ${nw}; ${nm} PTE${page} rw → ${nw}; refcount(${fr}) = ${t.rc[fr]}; TLB-invalidálás.`;
  return [a, t];
}
function act(who){
  const page = +document.getElementById("pg").value;
  const base = STEPS.slice(0, k + 1);
  setSteps(base.concat(cowWrite(STEPS[k], who, page)));
  show(STEPS.length - 1);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
