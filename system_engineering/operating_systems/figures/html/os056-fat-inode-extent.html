<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logikai → fizikai blokk: FAT, inode, extent</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>logikai blokk <input id="lb" type="number" min="0" max="349" value="100" style="width:5em"></label><label>extentek <input id="ex" value="0/1000/100, 100/2000/50, 150/1500/200" size="30" aria-label="Extentlista"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('lb').value=120;load()">l = 120</button><button onclick="document.getElementById('lb').value=3;load()">l = 3</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A FAT 15-23-7-31 lánca, az inode 100. blokkjának elérése az indirekt blokk 88. bejegyzésén át, és a három extent leképezése."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A három panel ugyanazt a logikai blokkot keresi; a FAT-panel a fejezet 4 blokkos példafájljának láncát követi (l ≥ 4 esetén EOF). Az inode-olvasások az inode-ot cache-ben feltételezik. Kezdőállapot: l = 100.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"l": 100, "i": 0, "fat": {"cur": 15, "read": null, "val": null, "n": 0, "txt": "könyvtárbejegyzés: start = 15"}, "ino": {"kind": "single", "txt": "az inode single indirect mutatója", "reads": 0, "e": 88}, "ext": {"rec": 1, "ok": false, "txt": "1. rekord (0/1000/100): nem", "phys": null}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 1. lépés  |  FAT: könyvtárbejegyzés: start = 15 · inode: az inode single indirect mutatója · extent: 1. rekord (0/1000/100): nem  |  FAT-követés: 0, lemezolvasás (inode cache-ben): 0, vizsgált extent: 1"}, {"l": 100, "i": 1, "fat": {"cur": 15, "read": 15, "val": 23, "n": 1, "txt": "FAT[15] = 23"}, "ino": {"kind": "single", "txt": "az indirekt blokk beolvasása", "reads": 1, "e": 88}, "ext": {"rec": 2, "ok": true, "txt": "2. rekord (100/2000/50): igen → fizikai 2000", "phys": 2000}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 2. lépés  |  FAT: FAT[15] = 23 · inode: az indirekt blokk beolvasása · extent: 2. rekord (100/2000/50): igen → fizikai 2000  |  FAT-követés: 1, lemezolvasás (inode cache-ben): 1, vizsgált extent: 2"}, {"l": 100, "i": 2, "fat": {"cur": 23, "read": 23, "val": 7, "n": 2, "txt": "FAT[23] = 7"}, "ino": {"kind": "single", "txt": "az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás", "reads": 2, "e": 88}, "ext": {"rec": 2, "ok": true, "txt": "2. rekord (100/2000/50): igen → fizikai 2000", "phys": 2000}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 3. lépés  |  FAT: FAT[23] = 7 · inode: az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás · extent: 2. rekord (100/2000/50): igen → fizikai 2000  |  FAT-követés: 2, lemezolvasás (inode cache-ben): 2, vizsgált extent: 2"}, {"l": 100, "i": 3, "fat": {"cur": 7, "read": 7, "val": 31, "n": 3, "txt": "FAT[7] = 31"}, "ino": {"kind": "single", "txt": "az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás", "reads": 2, "e": 88}, "ext": {"rec": 2, "ok": true, "txt": "2. rekord (100/2000/50): igen → fizikai 2000", "phys": 2000}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 4. lépés  |  FAT: FAT[7] = 31 · inode: az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás · extent: 2. rekord (100/2000/50): igen → fizikai 2000  |  FAT-követés: 3, lemezolvasás (inode cache-ben): 2, vizsgált extent: 2"}, {"l": 100, "i": 4, "fat": {"cur": 31, "read": 31, "val": "EOF", "n": 4, "txt": "FAT[31] = EOF"}, "ino": {"kind": "single", "txt": "az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás", "reads": 2, "e": 88}, "ext": {"rec": 2, "ok": true, "txt": "2. rekord (100/2000/50): igen → fizikai 2000", "phys": 2000}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 5. lépés  |  FAT: FAT[31] = EOF · inode: az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás · extent: 2. rekord (100/2000/50): igen → fizikai 2000  |  FAT-követés: 4, lemezolvasás (inode cache-ben): 2, vizsgált extent: 2"}, {"l": 100, "i": 5, "fat": {"cur": 31, "read": null, "val": null, "n": 4, "txt": "EOF: a 4 blokkos fájlnak nincs 100. blokkja"}, "ino": {"kind": "single", "txt": "az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás", "reads": 2, "e": 88}, "ext": {"rec": 2, "ok": true, "txt": "2. rekord (100/2000/50): igen → fizikai 2000", "phys": 2000}, "exts": [[0, 1000, 100], [100, 2000, 50], [150, 1500, 200]], "line": -1, "msg": "l = 100, 6. lépés  |  FAT: EOF: a 4 blokkos fájlnak nincs 100. blokkja · inode: az indirekt blokk 88. bejegyzése → adatblokk; összesen 2 olvasás · extent: 2. rekord (100/2000/50): igen → fizikai 2000  |  FAT-követés: 4, lemezolvasás (inode cache-ben): 2, vizsgált extent: 2"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 680 330"); svg.innerHTML = "";
  const hl = css("--hl");
  // (A) FAT
  el("text", {x: 6, y: 16, "font-size": 12.5, "font-weight": "bold"}, "(A) FAT-lánc");
  const FATT = {15: 23, 23: 7, 7: 31, 31: "EOF"};
  for (let i = 0; i < 32; i++) { const r = Math.floor(i / 8), c = i % 8, x = 6 + c * 26, y = 30 + r * 34, v = FATT[i];
    const on = s.fat.read === i, hit = s.fat.hit === i;
    el("rect", {x, y, width: 24, height: 30, fill: v !== undefined ? css("--cellhl") : css("--cell"), stroke: on || hit ? hl : css("--line"), "stroke-width": on || hit ? 3 : (v !== undefined ? 1.5 : 0.6)});
    el("text", {x: x + 2, y: y + 9, "font-size": 7.5, fill: css("--muted")}, String(i));
    if (v !== undefined) el("text", {x: x + 12, y: y + 24, "text-anchor": "middle", "font-size": 10, "font-weight": "bold"}, String(v)); }
  el("text", {x: 6, y: 186, "font-size": 11.5}, s.fat.txt);
  el("text", {x: 6, y: 204, "font-size": 11.5, "font-weight": "bold"}, `FAT-követés: ${s.fat.n}`);
  // (B) inode
  const X = 230;
  el("text", {x: X, y: 16, "font-size": 12.5, "font-weight": "bold"}, "(B) inode-indirekció");
  ["közv. 0–11", "indirekt", "dupla"].forEach((t, j) => { const on = (j === 0 && s.ino.kind === "direct") || (j === 1 && s.ino.kind === "single") || (j === 2 && s.ino.kind === "double");
    el("rect", {x: X, y: 30 + j * 30, width: 80, height: 26, fill: css("--cell"), stroke: on ? hl : css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: X + 40, y: 47 + j * 30, "text-anchor": "middle", "font-size": 11}, t); });
  if (s.ino.kind === "single") {
    const on = s.ino.reads >= 1;
    el("rect", {x: X + 110, y: 30, width: 90, height: 120, fill: css("--cell"), stroke: on ? hl : css("--line"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": on ? "none" : "4 3"});
    el("text", {x: X + 155, y: 48, "text-anchor": "middle", "font-size": 10.5}, "indirekt blokk");
    el("text", {x: X + 155, y: 64, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, "1024 bejegyzés");
    if (s.ino.reads >= 2) { el("rect", {x: X + 120, y: 82, width: 70, height: 24, fill: css("--cellhl"), stroke: hl, "stroke-width": 3});
      el("text", {x: X + 155, y: 99, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, `[${s.ino.e}]`); }
  }
  el("text", {x: X, y: 186, "font-size": 11.5}, s.ino.txt);
  el("text", {x: X, y: 204, "font-size": 11.5, "font-weight": "bold"}, `lemezolvasás (inode cache-ben): ${s.ino.reads}`);
  // (C) extent
  const XE = 470, W = 200, maxL = Math.max(350, ...s.exts.map(e => e[0] + e[2])), minP = Math.min(...s.exts.map(e => e[1])), maxP = Math.max(...s.exts.map(e => e[1] + e[2]));
  el("text", {x: XE, y: 16, "font-size": 12.5, "font-weight": "bold"}, "(C) extentek");
  const lx = v => XE + v / maxL * W, px = v => XE + (v - minP) / Math.max(1, maxP - minP) * W;
  s.exts.forEach(([lo, ph, ln], j) => { const cur = s.ext.rec === j + 1, seen = s.ext.rec !== null && j + 1 <= s.ext.rec;
    el("rect", {x: lx(lo), y: 40, width: Math.max(2, ln / maxL * W), height: 22, fill: seen ? css("--cellhl") : css("--cell"), stroke: cur ? hl : css("--line"), "stroke-width": cur ? 3 : 1});
    el("text", {x: lx(lo) + 3, y: 56, "font-size": 10}, "E" + (j + 1));
    el("rect", {x: px(ph), y: 120, width: Math.max(2, ln / Math.max(1, maxP - minP) * W), height: 22, fill: seen ? css("--cellhl") : css("--cell"), stroke: cur ? hl : css("--line"), "stroke-width": cur ? 3 : 1});
    el("line", {x1: lx(lo), y1: 62, x2: px(ph), y2: 120, stroke: css("--muted"), "stroke-dasharray": "2 3"}); });
  el("text", {x: XE, y: 34, "font-size": 10, fill: css("--muted")}, `logikai 0–${maxL}`);
  el("text", {x: XE, y: 158, "font-size": 10, fill: css("--muted")}, `fizikai ${minP}–${maxP}`);
  el("line", {x1: lx(s.l), y1: 26, x2: lx(s.l), y2: 64, stroke: hl, "stroke-width": 2.5});
  if (s.ext.phys !== null) { el("line", {x1: lx(s.l), y1: 64, x2: px(s.ext.phys), y2: 120, stroke: hl, "stroke-width": 2.5});
    el("text", {x: px(s.ext.phys), y: 175, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: hl}, String(s.ext.phys)); }
  el("text", {x: XE, y: 196, "font-size": 11}, s.ext.txt.length > 34 ? s.ext.txt.slice(0, 34) + "…" : s.ext.txt);
  el("text", {x: XE, y: 214, "font-size": 11.5, "font-weight": "bold"}, `vizsgált extent: ${s.ext.rec || s.exts.length}`);
  el("text", {x: 6, y: 250, "font-size": 12.5, "font-weight": "bold"}, `logikai blokk l = ${s.l}`);
  el("text", {x: 6, y: 272, "font-size": 11, fill: css("--muted")}, "FAT: a 4 blokkos példafájl lánca (15 → 23 → 7 → 31); inode: 4 KiB blokk, 4 B mutató, 12 közvetlen; extent: lineáris keresés a rekordokon");
}

const NDIR = 12, PER = 1024, FATT0 = {15: 23, 23: 7, 7: 31, 31: "EOF"};
function fatSteps(l){ const out = [{cur: 15, read: null, val: null, n: 0, txt: "könyvtárbejegyzés: start = 15"}]; let cur = 15, n = 0;
  for (let j = 0; j <= l; j++) { if (j === l) { out.push({cur, read: null, val: null, n, txt: `a ${l}. logikai blokk = fizikai ${cur}`, hit: cur}); break; }
    const nx = FATT0[cur]; n++; out.push({cur, read: cur, val: nx, n, txt: `FAT[${cur}] = ${nx}`});
    if (nx === "EOF") { out.push({cur, read: null, val: null, n, txt: `EOF: a 4 blokkos fájlnak nincs ${l}. blokkja`}); break; } cur = nx; }
  return out; }
function inoSteps(l){ if (l < NDIR) return [{kind: "direct", txt: `közvetlen mutató [${l}]`, reads: 0}, {kind: "direct", txt: `adatblokk olvasása (közvetlen [${l}])`, reads: 1}];
  const e = l - NDIR; if (l < NDIR + PER) return [{kind: "single", txt: "az inode single indirect mutatója", reads: 0, e}, {kind: "single", txt: "az indirekt blokk beolvasása", reads: 1, e},
    {kind: "single", txt: `az indirekt blokk ${e}. bejegyzése → adatblokk; összesen 2 olvasás`, reads: 2, e}];
  return [{kind: "double", txt: "double indirect", reads: 0}]; }
function extSteps(l, ext){ const out = []; for (let k = 0; k < ext.length; k++) { const [lo, ph, ln] = ext[k], ok = lo <= l && l < lo + ln;
    out.push({rec: k + 1, ok, txt: `${k + 1}. rekord (${lo}/${ph}/${ln}): ` + (ok ? `igen → fizikai ${ph + l - lo}` : "nem"), phys: ok ? ph + l - lo : null}); if (ok) return out; }
  out.push({rec: null, ok: false, txt: "nincs lefedő extent (lyuk: nullákat olvas)", phys: null}); return out; }
function combined(l, ext){ const F = fatSteps(l), I = inoSteps(l), E = extSteps(l, ext), n = Math.max(F.length, I.length, E.length), out = [];
  for (let i = 0; i < n; i++) { const f = F[Math.min(i, F.length - 1)], a = I[Math.min(i, I.length - 1)], e = E[Math.min(i, E.length - 1)];
    out.push({l, i, fat: f, ino: a, ext: e, exts: ext, line: -1, msg: `l = ${l}, ${i + 1}. lépés  |  FAT: ${f.txt} · inode: ${a.txt} · extent: ${e.txt}  |  FAT-követés: ${f.n}, lemezolvasás (inode cache-ben): ${a.reads}, vizsgált extent: ${e.rec || ext.length}`}); }
  return out; }
function load(){ const l = +document.getElementById("lb").value, msg = document.getElementById("err");
  const ext = document.getElementById("ex").value.split(/[,;]/).map(t => t.trim().split("/").map(Number)).filter(a => a.length === 3);
  if (!Number.isInteger(l) || l < 0 || l > 349) { msg.textContent = "A logikai blokk 0–349."; return; }
  if (!ext.length || ext.some(a => a.some(v => !Number.isInteger(v) || v < 0) || a[2] < 1)) { msg.textContent = "Extentlista: logikai/fizikai/hossz, vesszővel elválasztva."; return; }
  msg.textContent = ""; setSteps(combined(l, ext)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
