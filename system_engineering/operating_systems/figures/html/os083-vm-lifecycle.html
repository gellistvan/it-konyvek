<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A VM életciklusa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét állapot: definiált, indítás, futó, felfüggesztett, mentett, leállított, törölt. Élek: definiáltból start indításba, onnan boot kész után futó; futóból suspend felfüggesztettbe és resume vissza; futóból save mentettbe és restore vissza; futóból shutdown vagy destroy leállítottba; leállítottból start indításba és undefine töröltbe; a definiált és a leállított ugyanaz a konfiguráció."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fogalmi modell, nem konkrét hypervisor-API; a libvirt vagy a QEMU állapotnevei és engedélyezett átmenetei ettől eltérhetnek. A törölt (undefined) állapotban a lemezképek megmaradhatnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"state": "defined", "edge": -1, "line": -1, "msg": "Definiált: a konfiguráció létezik (virsh define vm.xml), erőforrás nincs lefoglalva. Kattints egy élre a virsh-parancsért, vagy lépj tovább egy tipikus életúton."}, {"state": "starting", "edge": 0, "line": -1, "msg": "start: Definiált → Indítás  –  virsh start vm"}, {"state": "running", "edge": 1, "line": -1, "msg": "boot kész: Indítás → Futó  –  (automatikus: a vendég firmware és kernel elindult)"}, {"state": "paused", "edge": 2, "line": -1, "msg": "suspend: Futó → Felfüggesztett  –  virsh suspend vm"}, {"state": "running", "edge": 3, "line": -1, "msg": "resume: Felfüggesztett → Futó  –  virsh resume vm"}, {"state": "saved", "edge": 4, "line": -1, "msg": "save: Futó → Mentett  –  virsh save vm vm.state"}, {"state": "running", "edge": 5, "line": -1, "msg": "restore: Mentett → Futó  –  virsh restore vm.state"}, {"state": "shutoff", "edge": 6, "line": -1, "msg": "shutdown / destroy: Futó → Leállított  –  virsh shutdown vm  (vagy: virsh destroy vm)"}, {"state": "undefined", "edge": 8, "line": -1, "msg": "undefine: Leállított → Törölt  –  virsh undefine vm"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"states": {"defined": [1.3, 5.6, "Definiált\n(defined)"], "starting": [5.6, 5.6, "Indítás\n(starting)"], "running": [10.0, 5.6, "Futó\n(running)"], "paused": [14.6, 7.9, "Felfüggesztett\n(paused)"], "saved": [14.6, 3.3, "Mentett\n(saved)"], "shutoff": [5.6, 1.4, "Leállított\n(shut off)"], "undefined": [1.3, 1.4, "Törölt\n(undefined)"]}, "edges": [["defined", "starting", "start", "normal", 0.0, "virsh start vm", [0, 0.32]], ["starting", "running", "boot kész", "normal", 0.0, "(automatikus: a vendég firmware és kernel elindult)", [0, 0.32]], ["running", "paused", "suspend", "normal", 0.25, "virsh suspend vm", [1.35, -0.62]], ["paused", "running", "resume", "normal", 0.25, "virsh resume vm", [-0.4600000000000002, 0.9199999999999999]], ["running", "saved", "save", "normal", -0.25, "virsh save vm vm.state", [1.35, 0.62]], ["saved", "running", "restore", "restore", -0.25, "virsh restore vm.state", [-0.45999999999999996, -0.9199999999999999]], ["running", "shutoff", "shutdown /\ndestroy", "normal", 0.0, "virsh shutdown vm  (vagy: virsh destroy vm)", [0.75, 0.15]], ["shutoff", "starting", "start", "normal", 0.0, "virsh start vm", [-0.45, 0]], ["shutoff", "undefined", "undefine", "remove", 0.0, "virsh undefine vm", [0, 0.3]], ["defined", "shutoff", "ugyanaz a\nkonfiguráció", "same", 0.0, "(nincs parancs: a definiált és a leállított VM ugyanaz a tárolt konfiguráció)", [-0.75, -0.1]]]};
let picked = -1;
function render(s){
  svg.setAttribute("viewBox", "0 0 760 420"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const X = x => 20 + x * 44, Y = y => 380 - y * 40, W = 120, Hh = 50;
  const defs = el("defs", {}); [["n1", line], ["n2", hl2]].forEach(([id, c]) => { const m = document.createElementNS(NS, "marker");
    [["id", id], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "11"], ["markerHeight", "11"], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", c); m.appendChild(p); defs.appendChild(m); });
  const target = picked >= 0 ? G.edges[picked][1] : s.state, ae = picked >= 0 ? picked : s.edge;
  const DASH = {normal: "none", restore: "10 5", remove: "2 4", same: "6 4"}, LW = {normal: 1.6, restore: 3, remove: 2, same: 1.2};
  G.edges.forEach((e, i) => {
    const [x0, y0] = [X(G.states[e[0]][0]), Y(G.states[e[0]][1])], [x1, y1] = [X(G.states[e[1]][0]), Y(G.states[e[1]][1])];
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    const cut = 1 / Math.max(Math.abs(dx) / (W / 2 + 4), Math.abs(dy) / (Hh / 2 + 4));
    const sx = x0 + dx * cut, sy = y0 + dy * cut, tx = x1 - dx * cut, ty = y1 - dy * cut;
    const mx = (sx + tx) / 2 - e[4] * (ty - sy), my = (sy + ty) / 2 + e[4] * (tx - sx);
    const on = i === ae;
    const p = el("path", {d: `M${sx},${sy} Q${mx},${my} ${tx},${ty}`, fill: "none", stroke: on ? hl2 : line, "stroke-width": on ? 4 : LW[e[3]], "stroke-dasharray": DASH[e[3]], "marker-end": e[3] === "same" ? "none" : `url(#${on ? "n2" : "n1"})`, style: "cursor:pointer"});
    const lx = X((G.states[e[0]][0] + G.states[e[1]][0]) / 2 + e[6][0]), ly = Y((G.states[e[0]][1] + G.states[e[1]][1]) / 2 + e[6][1]);
    const parts = e[2].split("\n");
    el("rect", {x: lx - 38, y: ly - 9 - (parts.length - 1) * 7, width: 76, height: 16 * parts.length + 2, rx: 4, fill: css("--bg"), opacity: 0.92});
    const t = el("text", {x: lx, y: ly + 5 - (parts.length - 1) * 7, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal", "font-style": e[3] === "same" ? "italic" : "normal", tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": "Átmenet: " + e[2].replace("\n", " ")});
    parts.forEach((q, j) => { const ts = document.createElementNS(NS, "tspan"); ts.setAttribute("x", lx); if (j) ts.setAttribute("dy", 15); ts.textContent = q; t.appendChild(ts); });
    const pick = () => { stop(); picked = i; render(STEPS[k]); status.textContent = e[2].replace("\n", " ") + " → célállapot: " + G.states[e[1]][2].replace("\n", " ") + "  –  " + e[5]; picked = -1; };
    p.addEventListener("click", pick); t.addEventListener("click", pick);
    t.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
  });
  Object.entries(G.states).forEach(([n, v]) => { const on = n === target, x = X(v[0]), y = Y(v[1]);
    el("rect", {x: x - W / 2, y: y - Hh / 2, width: W, height: Hh, rx: 22, fill: on ? cellhl : cell, stroke: on ? hl : line, "stroke-width": on ? 4 : 1.4});
    v[2].split("\n").forEach((q, j) => el("text", {x, y: y - 2 + j * 16, "text-anchor": "middle", "font-size": j ? 11.5 : 13, "font-weight": j ? "normal" : "bold"}, q)); });
  el("text", {x: 10, y: 412, "font-size": 11, fill: mut}, "folytonos = normál, vastag szaggatott = helyreállítás, pontozott = megszüntetés, vékony szaggatott = ugyanaz a konfiguráció");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
