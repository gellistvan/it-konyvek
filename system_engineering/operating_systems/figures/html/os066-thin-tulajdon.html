<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin pool blokktulajdon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 6 GiB-os thin pool szegmensei (D0, D1, O0, O1, D0′, K) a t0–t10 időpontokban a hivatkozó kötetekkel; a t9-ben a clone0 törlésekor a D0, az O1 és a K felszabadul, a foglalás 4296-ról 2548 MiB-ra csökken."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Blokkszintű hivatkozásszámlálás a labor ütemterve szerint, a T-O7-046 javított várt értékeivel (truncate -s 500M: a fájl 500 MiB-RA rövidül, 524 MiB szabadul fel a fájlrendszerben). Fájlrendszer-metaadat és thin-chunk kerekítés nélkül; sematikus, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": "t0", "what": "thin volume létrehozás (live)", "refs": {"D0": [], "D1": [], "O0": [], "O1": [], "D0′": [], "K": []}, "used": 0, "freed": [], "line": -1, "msg": "t0: thin volume létrehozás (live) → data_used = 0 MiB; nincs változás az adatterületen"}, {"t": "t1", "what": "2 GiB + 1 GiB írás", "refs": {"D0": ["L"], "D1": ["L"], "O0": ["L"], "O1": ["L"], "D0′": [], "K": []}, "used": 3072, "freed": [], "line": -1, "msg": "t1: 2 GiB + 1 GiB írás → data_used = 3072 MiB; +3072 MiB"}, {"t": "t2", "what": "snap0 létrehozás", "refs": {"D0": ["L", "S"], "D1": ["L", "S"], "O0": ["L", "S"], "O1": ["L", "S"], "D0′": [], "K": []}, "used": 3072, "freed": [], "line": -1, "msg": "t2: snap0 létrehozás → data_used = 3072 MiB; nincs változás az adatterületen"}, {"t": "t3", "what": "1 GiB felülírás (data első GiB-ja)", "refs": {"D0": ["S"], "D1": ["L", "S"], "O0": ["L", "S"], "O1": ["L", "S"], "D0′": ["L"], "K": []}, "used": 4096, "freed": [], "line": -1, "msg": "t3: 1 GiB felülírás (data első GiB-ja) → data_used = 4096 MiB; +1024 MiB"}, {"t": "t4", "what": "truncate -s 500M + sync", "refs": {"D0": ["S"], "D1": ["L", "S"], "O0": ["L", "S"], "O1": ["L", "S"], "D0′": ["L"], "K": []}, "used": 4096, "freed": [], "line": -1, "msg": "t4: truncate -s 500M + sync → data_used = 4096 MiB; nincs változás az adatterületen"}, {"t": "t5", "what": "fstrim (snap0 mellett)", "refs": {"D0": ["S"], "D1": ["L", "S"], "O0": ["L", "S"], "O1": ["S"], "D0′": ["L"], "K": []}, "used": 4096, "freed": [], "line": -1, "msg": "t5: fstrim (snap0 mellett) → data_used = 4096 MiB; nincs változás az adatterületen"}, {"t": "t6", "what": "clone0 létrehozás a snap0-ból", "refs": {"D0": ["S", "C"], "D1": ["L", "S", "C"], "O0": ["L", "S", "C"], "O1": ["S", "C"], "D0′": ["L"], "K": []}, "used": 4096, "freed": [], "line": -1, "msg": "t6: clone0 létrehozás a snap0-ból → data_used = 4096 MiB; nincs változás az adatterületen"}, {"t": "t7", "what": "200 MiB klónírás", "refs": {"D0": ["S", "C"], "D1": ["L", "S", "C"], "O0": ["L", "S", "C"], "O1": ["S", "C"], "D0′": ["L"], "K": ["C"]}, "used": 4296, "freed": [], "line": -1, "msg": "t7: 200 MiB klónírás → data_used = 4296 MiB; +200 MiB"}, {"t": "t8", "what": "snap0 törlés", "refs": {"D0": ["C"], "D1": ["L", "C"], "O0": ["L", "C"], "O1": ["C"], "D0′": ["L"], "K": ["C"]}, "used": 4296, "freed": [], "line": -1, "msg": "t8: snap0 törlés → data_used = 4296 MiB; nincs változás az adatterületen"}, {"t": "t9", "what": "clone0 törlés", "refs": {"D0": [], "D1": ["L"], "O0": ["L"], "O1": [], "D0′": ["L"], "K": []}, "used": 2548, "freed": ["D0", "K", "O1"], "line": -1, "msg": "t9: clone0 törlés → data_used = 2548 MiB; felszabadul 1748 MiB (D0 1024 + O1 524 + K 200)"}, {"t": "t10", "what": "fstrim a törlés után", "refs": {"D0": [], "D1": ["L"], "O0": ["L"], "O1": [], "D0′": ["L"], "K": []}, "used": 2548, "freed": ["D0", "K", "O1"], "line": -1, "msg": "t10: fstrim a törlés után → data_used = 2548 MiB; nincs változás az adatterületen"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SEG = [["D0", 1024], ["D1", 1024], ["O0", 500], ["O1", 524], ["D0′", 1024], ["K", 200]];
let SEL = null;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 260");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="ps" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern><pattern id="pc" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="${css("--fg")}"/></pattern>`;
  svg.appendChild(defs);
  const W = 700, sc = W / 6144, x0 = 20, y0 = 60, H = 90, FILL = {L: css("--muted"), S: "url(#ps)", C: "url(#pc)"}, NAME = {L: "live", S: "snap0", C: "clone0"};
  el("text", {x: x0, y: 24, "font-size": 13, "font-weight": "bold"}, `thin pool 6 GiB – ${s.t}: data_used = ${s.used} MiB`);
  el("rect", {x: x0, y: y0, width: W, height: H, fill: "none", stroke: css("--muted")});
  let x = x0;
  SEG.forEach(([n, sz]) => {
    const w = sz * sc, refs = s.refs[n], freed = s.freed.includes(n);
    if (refs.length) refs.forEach((v, j) => el("rect", {x: x, y: y0 + j * H / refs.length, width: w, height: H / refs.length, fill: FILL[v], stroke: css("--line"), "stroke-width": 0.5}));
    const box = el("rect", {x: x, y: y0, width: w, height: H, fill: refs.length ? "none" : "transparent", stroke: SEL === n ? css("--hl2") : css("--line"), "stroke-width": SEL === n ? 4 : (refs.length ? 1.5 : (freed ? 1.2 : 0)), "stroke-dasharray": freed ? "6 4" : "none", tabindex: 0, role: "button", "aria-label": n + " szegmens"});
    box.style.cursor = "pointer";
    const pick = () => { SEL = n; render(STEPS[k]); status.textContent = `${n} (${sz} MiB): ` + (refs.length ? "hivatkozik rá: " + refs.map(v => NAME[v]).join(", ") + ` (refcount ${refs.length})` : (freed ? "felszabadult (refcount 0)" : "még nincs lefoglalva")); };
    box.addEventListener("click", pick); box.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") pick(); });
    const t = el("text", {x: x + w / 2, y: y0 + H + 18, "text-anchor": "middle", "font-size": 11.5}, `${n} ${sz}`); t.style.pointerEvents = "none";
    if (refs.length) { const lb = refs.join(""); el("rect", {x: x + w / 2 - 6 - 5 * lb.length, y: y0 + H / 2 - 11, width: 12 + 10 * lb.length, height: 20, fill: css("--bg"), rx: 3}).style.pointerEvents = "none"; const t2 = el("text", {x: x + w / 2, y: y0 + H / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, lb); t2.style.pointerEvents = "none"; }
    x += w;
  });
  el("text", {x: x + 4, y: y0 + H / 2, "font-size": 11, fill: css("--muted")}, "szabad");
  // data_used sáv
  el("rect", {x: x0, y: 200, width: s.used * sc, height: 16, fill: css("--fg")});
  el("rect", {x: x0, y: 200, width: W, height: 16, fill: "none", stroke: css("--line")});
  el("text", {x: x0, y: 236, "font-size": 12}, `foglalt: ${s.used} / 6144 MiB  ·  L = live (tömör), S = snap0 (ferde), C = clone0 (pontozott), szaggatott = felszabadult`);
  el("text", {x: x0, y: 254, "font-size": 11, fill: css("--muted")}, "Kattints egy szegmensre a hivatkozó kötetek listájáért.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
