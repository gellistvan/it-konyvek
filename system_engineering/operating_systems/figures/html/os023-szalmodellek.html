<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szálmodellek és a blokkoló hívás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Szálmodell"><button id="mN1" onclick="pick('N:1')">N:1</button> <button id="m11" onclick="pick('1:1')">1:1</button> <button id="mMN" onclick="pick('M:N')">M:N</button></span><label><input id="blk" type="checkbox" onchange="tog()"> U2 blokkol (read())</label><button onclick="swapTls()">TLS: szálváltás</button><span id="tlsmsg" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy felhasználói szál leképezése kernel-entitásokra és CPU-kra az N:1, 1:1 és M:N modellben; U2 blokkolásakor látszik, mely szálak futhatnak tovább; alul két TLS-blokk és az FS nyíl."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus ábra; Linux NPTL = 1:1; a laborhoz illeszkedően 2 vCPU. A ◀/▶ a hat állapoton (3 modell × blokkol/nem) lép végig.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"model": "N:1", "blocked": false, "map": {"U1": "K1", "U2": "K1", "U3": "K1", "U4": "K1"}, "bk": [], "run": ["U1", "U2", "U3", "U4"], "lib": true, "K": ["K1"], "CPU": ["CPU1"], "kcpu": {"K1": "CPU1"}, "title": "(a) N:1 – felhasználói szálak", "line": -1, "msg": "(a) N:1 – felhasználói szálak: minden szál futásképes; a kernel csak a könyvtár alatti entitás(oka)t látja."}, {"model": "N:1", "blocked": true, "map": {"U1": "K1", "U2": "K1", "U3": "K1", "U4": "K1"}, "bk": ["K1"], "run": [], "lib": true, "K": ["K1"], "CPU": ["CPU1"], "kcpu": {"K1": "CPU1"}, "title": "(a) N:1 – felhasználói szálak", "line": -1, "msg": "(a) N:1 – felhasználói szálak: U2 read()-ben blokkol – a kernel csak egy entitást lát: U2 read()-je az egész folyamatot blokkolja. Fut tovább: egyik szál sem."}, {"model": "1:1", "blocked": false, "map": {"U1": "K1", "U2": "K2", "U3": "K3", "U4": "K4"}, "bk": [], "run": ["U1", "U2", "U3", "U4"], "lib": false, "K": ["K1", "K2", "K3", "K4"], "CPU": ["CPU1", "CPU2"], "kcpu": {"K1": "CPU1", "K2": "CPU2", "K3": "CPU1", "K4": "CPU2"}, "title": "(b) 1:1 – kernelszálak (Linux NPTL)", "line": -1, "msg": "(b) 1:1 – kernelszálak (Linux NPTL): minden szál futásképes; minden U-hoz saját kernel-entitás."}, {"model": "1:1", "blocked": true, "map": {"U1": "K1", "U2": "K2", "U3": "K3", "U4": "K4"}, "bk": ["K2"], "run": ["U1", "U3", "U4"], "lib": false, "K": ["K1", "K2", "K3", "K4"], "CPU": ["CPU1", "CPU2"], "kcpu": {"K1": "CPU1", "K2": "CPU2", "K3": "CPU1", "K4": "CPU2"}, "title": "(b) 1:1 – kernelszálak (Linux NPTL)", "line": -1, "msg": "(b) 1:1 – kernelszálak (Linux NPTL): U2 read()-ben blokkol – csak K2 alszik; U1, U3, U4 a két CPU-n tovább fut. Fut tovább: U1, U3, U4."}, {"model": "M:N", "blocked": false, "map": {"U1": "K1", "U2": "K1", "U3": "K2", "U4": "K2"}, "bk": [], "run": ["U1", "U2", "U3", "U4"], "lib": true, "K": ["K1", "K2"], "CPU": ["CPU1", "CPU2"], "kcpu": {"K1": "CPU1", "K2": "CPU2"}, "title": "(c) M:N – hibrid", "line": -1, "msg": "(c) M:N – hibrid: minden szál futásképes; a kernel csak a könyvtár alatti entitás(oka)t látja."}, {"model": "M:N", "blocked": true, "map": {"U1": "K2", "U2": "K1", "U3": "K2", "U4": "K2"}, "bk": ["K1"], "run": ["U1", "U3", "U4"], "lib": true, "K": ["K1", "K2"], "CPU": ["CPU1", "CPU2"], "kcpu": {"K1": "CPU1", "K2": "CPU2"}, "title": "(c) M:N – hibrid", "line": -1, "msg": "(c) M:N – hibrid: U2 read()-ben blokkol – K1 U2-vel együtt alszik; a könyvtári ütemező U1, U3, U4-et K2-n futtatja. Fut tovább: U1, U3, U4."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let tlsCur = 0;
const MI = {"N:1": 0, "1:1": 2, "M:N": 4};
function pick(m){ show(MI[m] + (document.getElementById("blk").checked ? 1 : 0)); }
function tog(){ const s = STEPS[k]; show(MI[s.model] + (document.getElementById("blk").checked ? 1 : 0)); }
function swapTls(){ tlsCur = 1 - tlsCur; show(k); document.getElementById("tlsmsg").textContent = "Szálváltás: az FS bázisregiszter most T" + (tlsCur + 1) + " TLS-blokkjára mutat."; }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 360");
  document.getElementById("blk").checked = s.blocked;
  ["N:1", "1:1", "M:N"].forEach(m => { const b = document.getElementById("m" + m.replace(":", "")); b.setAttribute("aria-pressed", s.model === m); b.style.fontWeight = s.model === m ? "bold" : "normal"; });
  el("text", {x: 300, y: 20, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, s.title);
  const U = ["U1", "U2", "U3", "U4"], ux = {}, kx = {}, cx = {};
  U.forEach((u, i) => ux[u] = 120 + i * 120);
  s.K.forEach((q, i) => kx[q] = 300 + (i - (s.K.length - 1) / 2) * 120);
  s.CPU.forEach((c, i) => cx[c] = 300 + (i - (s.CPU.length - 1) / 2) * 200);
  const yU = 60, yL = 115, yK = 165, yC = 215;
  const ln = (a, b, c, d, dash) => el("line", {x1: a, y1: b, x2: c, y2: d, stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": dash ? "4 4" : "none"});
  if (s.lib) {
    el("rect", {x: 70, y: yL - 14, width: 460, height: 28, rx: 6, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: 300, y: yL + 5, "text-anchor": "middle", "font-size": 12}, "szálkönyvtár ütemezője (felhasználói tér)");
    U.forEach(u => ln(ux[u], yU + 18, ux[u], yL - 14));
    s.K.forEach(q => ln(kx[q], yL + 14, kx[q], yK - 16));
  } else U.forEach(u => ln(ux[u], yU + 18, kx[s.map[u]], yK - 16));
  s.K.forEach(q => ln(kx[q], yK + 16, cx[s.kcpu[q]], yC - 14));
  U.forEach(u => {
    const blk = s.blocked && u === "U2", stopped = s.blocked && !blk && !s.run.includes(u);
    el("circle", {cx: ux[u], cy: yU, r: 18, fill: css("--cell"), stroke: css("--line"), "stroke-width": blk ? 2.5 : 1.5, "stroke-dasharray": blk ? "2 3" : "none"});
    el("text", {x: ux[u], y: yU + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, u);
    if (blk) el("text", {x: ux[u], y: yU - 24, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, "read() – blokkol");
    if (stopped) { ln(ux[u] - 16, yU - 16, ux[u] + 16, yU + 16); ln(ux[u] - 16, yU + 16, ux[u] + 16, yU - 16); }
    if (s.blocked && s.run.includes(u)) el("text", {x: ux[u] + 22, y: yU + 18, "font-size": 11, fill: css("--hl")}, "fut");
  });
  s.K.forEach(q => {
    const blk = s.bk.includes(q);
    el("rect", {x: kx[q] - 16, y: yK - 16, width: 32, height: 32, fill: blk ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": blk ? 2.5 : 1.3, "stroke-dasharray": blk ? "2 3" : "none"});
    el("text", {x: kx[q], y: yK + 5, "text-anchor": "middle", "font-size": 12}, q);
  });
  s.CPU.forEach(c => {
    el("polygon", {points: `${cx[c]-20},${yC+16} ${cx[c]+20},${yC+16} ${cx[c]},${yC-16}`, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
    el("text", {x: cx[c], y: yC + 32, "text-anchor": "middle", "font-size": 11}, c);
  });
  // TLS-sáv
  el("line", {x1: 10, y1: 262, x2: 590, y2: 262, stroke: css("--muted")});
  el("text", {x: 12, y: 282, "font-size": 12, "font-weight": "bold"}, "TLS");
  [0, 1].forEach(i => {
    const x = 200 + i * 200;
    el("rect", {x, y: 272, width: 180, height: 30, fill: i === tlsCur ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": i === tlsCur ? 2.5 : 1.2});
    el("text", {x: x + 90, y: 292, "text-anchor": "middle", "font-size": 12}, "T" + (i + 1) + ": tls_counter = 1000");
  });
  el("rect", {x: 40, y: 318, width: 90, height: 28, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 85, y: 337, "text-anchor": "middle", "font-size": 12}, "FS bázis");
  el("line", {x1: 130, y1: 332, x2: 290 + tlsCur * 200, y2: 304, stroke: css("--hl2"), "stroke-width": 2.5});
  el("circle", {cx: 290 + tlsCur * 200, cy: 304, r: 4, fill: css("--hl2")});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
