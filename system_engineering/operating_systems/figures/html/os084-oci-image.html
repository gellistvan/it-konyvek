<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCI image felépítése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az index platformonként egy manifestre mutat; a manifest a config és a rétegek tömörített digestjét tartalmazza, a config rootfs.diff_ids mezője a kitömörített rétegek digestjét. A felső réteg whiteout fájlja miatt az egyesített nézetből eltűnik az /etc/app.conf."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető mintarétegek; a digesteket az ábrát készítő szkript számította (rövidítve). A JSON-részletek a 22.3.3 két mintájának szerkezetét követik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "files": [], "removed": [], "line": -1, "msg": "Üres gyökér-fájlrendszer. Kattints egy objektumra (index, manifest, config, blob) a JSON-részletért; a Lépés ▶ egymásra rakja a rétegeket."}, {"n": 1, "files": ["bin/busybox", "etc/app.conf"], "removed": [], "line": -1, "msg": "0. réteg kicsomagolva: /bin/busybox és /etc/app.conf."}, {"n": 2, "files": ["bin/busybox", "usr/local/bin/app"], "removed": ["etc/app.conf"], "line": -1, "msg": "1. réteg: a .wh.app.conf whiteout törli az alsó réteg /etc/app.conf fájlját, a /usr/local/bin/app új fájl. Egyesített nézet: /bin/busybox, /usr/local/bin/app."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const GEO = {"dg": {"idx_amd": "sha256:9fe00051…", "idx_arm": "sha256:4d7b7d51…", "cfg": "sha256:d7c91a68…", "l0": "sha256:cfe394d5…", "l1": "sha256:4f695de6…", "d0": "sha256:12095e28…", "d1": "sha256:8b35bea1…"}, "js": {"index": "{\n  \"schemaVersion\": 2,\n  \"mediaType\": \"application/vnd.oci.image.index.v1+json\",\n  \"manifests\": [\n    {\n      \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n      \"digest\": \"sha256:9fe00051…\",\n      \"size\": 555,\n      \"platform\": {\n        \"architecture\": \"amd64\",\n        \"os\": \"linux\"\n      }\n    },\n    {\n      \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n      \"digest\": \"sha256:4d7b7d51…\",\n      \"size\": 555,\n      \"platform\": {\n        \"architecture\": \"arm64\",\n        \"os\": \"linux\"\n      }\n    }\n  ]\n}", "manifest": "{\n  \"schemaVersion\": 2,\n  \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n  \"config\": {\n    \"mediaType\": \"application/vnd.oci.image.config.v1+json\",\n    \"digest\": \"sha256:d7c91a68…\",\n    \"size\": 282\n  },\n  \"layers\": [\n    {\n      \"mediaType\": \"application/vnd.oci.image.layer.v1.tar+gzip\",\n      \"digest\": \"sha256:cfe394d5…\",\n      \"size\": 164\n    },\n    {\n      \"mediaType\": \"application/vnd.oci.image.layer.v1.tar+gzip\",\n      \"digest\": \"sha256:4f695de6…\",\n      \"size\": 146\n    }\n  ]\n}", "config": "{\n  \"architecture\": \"amd64\",\n  \"os\": \"linux\",\n  \"config\": {\n    \"Cmd\": [\n      \"/usr/local/bin/app\"\n    ],\n    \"WorkingDir\": \"/\"\n  },\n  \"rootfs\": {\n    \"type\": \"layers\",\n    \"diff_ids\": [\n      \"sha256:12095e28…\",\n      \"sha256:8b35bea1…\"\n    ]\n  }\n}", "blob0": "réteg 0 blob (tar+gzip, 164 bájt)\ndigest  = sha256:cfe394d5fdfabe59…  (tömörített)\ndiff_id = sha256:12095e287d62b6e9…  (gunzip után)\ntartalom: /bin/busybox, /etc/app.conf", "blob1": "réteg 1 blob (tar+gzip, 146 bájt)\ndigest  = sha256:4f695de656e2f1eb…  (tömörített)\ndiff_id = sha256:8b35bea1cc930db8…  (gunzip után)\ntartalom: /etc/.wh.app.conf (whiteout), /usr/local/bin/app"}};
let ojs = null;
function render(s){
  svg.setAttribute("viewBox", "0 0 760 470"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const defs = el("defs", {}); const m = document.createElementNS(NS, "marker");
  [["id", "oa"], ["viewBox", "0 0 10 10"], ["refX", "9"], ["refY", "5"], ["markerWidth", "9"], ["markerHeight", "9"], ["markerUnits", "userSpaceOnUse"], ["orient", "auto"]].forEach(([a, b]) => m.setAttribute(a, b));
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d", "M0,0 L10,5 L0,10 z"); mp.setAttribute("fill", line); m.appendChild(mp); defs.appendChild(m);
  const D = GEO.dg;
  const box = (id, x, y, w, h, title, lines, fill, dash) => {
    const on = ojs === id;
    const r = el("rect", {x, y, width: w, height: h, rx: 7, fill: on ? cellhl : fill, stroke: on ? hl : line, "stroke-width": on ? 3.5 : 1.3, "stroke-dasharray": dash ? "6 3" : "none", tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": title + ": JSON megjelenítése"});
    const pick = () => { stop(); ojs = id; render(STEPS[k]); status.textContent = title + " – JSON-részlet a jobb oldali panelen."; };
    r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    el("text", {x: x + 8, y: y + 18, "font-size": 12.5, "font-weight": "bold", style: "pointer-events:none"}, title);
    lines.forEach((q, i) => el("text", {x: x + 8, y: y + 36 + i * 15, "font-size": 11, style: "pointer-events:none;font-family:monospace;white-space:pre"}, q));
  };
  const A = (x0, y0, x1, y1, dash) => el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: line, "stroke-width": 1.5, "stroke-dasharray": dash ? "6 4" : "none", "marker-end": "url(#oa)"});
  box("index", 6, 8, 150, 104, "index (opc.)", ["amd64", " " + D.idx_amd, "arm64", " " + D.idx_arm], cell, true);
  box("manifest", 186, 8, 170, 134, "manifest (amd64)", ["config.digest", " " + D.cfg, "layers[0].digest", " " + D.l0, "layers[1].digest", " " + D.l1], cell);
  box("config", 186, 186, 170, 92, "config (amd64)", ["rootfs.diff_ids", " [0] " + D.d0, " [1] " + D.d1], cell);
  box("blob0", 6, 186, 150, 58, "réteg 0 (tar+gzip)", [D.l0], cellhl);
  box("blob1", 6, 252, 150, 58, "réteg 1 (tar+gzip)", [D.l1], cellhl);
  A(156, 50, 186, 50); A(271, 142, 271, 186); A(186, 110, 156, 200); A(186, 125, 156, 268);
  el("text", {x: 160, y: 168, "font-size": 10.5, fill: mut}, "SHA-256 (tömörített)");
  A(156, 230, 186, 245, true); A(156, 290, 186, 262, true);
  el("text", {x: 186, y: 300, "font-size": 10.5, fill: mut}, "szaggatott: gunzip, majd SHA-256 = diff_id");
  // JSON panel
  el("rect", {x: 372, y: 8, width: 382, height: 302, fill: css("--code"), stroke: line, "stroke-width": 0.8});
  const txt = ojs ? GEO.js[ojs] : "Kattints egy objektumra a JSON-részletért.";
  txt.split("\n").slice(0, 22).forEach((q, i) => el("text", {x: 380, y: 26 + i * 13, "font-size": 10.5, style: "font-family:monospace;white-space:pre"}, q.length > 58 ? q.slice(0, 57) + "…" : q));
  // rétegek egymásra helyezése
  el("text", {x: 6, y: 340, "font-size": 13, "font-weight": "bold"}, "Rétegek egymásra helyezése – " + s.n + " réteg");
  const cols = [["0. réteg", ["/bin/busybox", "/etc/app.conf"]], ["1. réteg", ["/etc/.wh.app.conf", "/usr/local/bin/app"]]];
  cols.forEach((c, j) => { const x = 6 + j * 190, on = j < s.n;
    el("rect", {x, y: 352, width: 180, height: 110, fill: on ? cellhl : "none", stroke: on ? line : mut, "stroke-dasharray": on ? "none" : "4 4"});
    el("text", {x: x + 8, y: 370, "font-size": 12, "font-weight": "bold", fill: on ? css("--fg") : mut}, c[0]);
    c[1].forEach((q, i) => el("text", {x: x + 8, y: 392 + i * 18, "font-size": 11.5, style: "font-family:monospace", fill: on ? css("--fg") : mut}, q)); });
  el("rect", {x: 386, y: 352, width: 368, height: 110, fill: "none", stroke: hl, "stroke-width": 2, "stroke-dasharray": "6 3"});
  el("text", {x: 394, y: 370, "font-size": 12, "font-weight": "bold"}, "egyesített nézet");
  s.files.forEach((q, i) => el("text", {x: 394, y: 392 + i * 18, "font-size": 11.5, style: "font-family:monospace"}, "/" + q));
  s.removed.forEach((q, i) => { const t = el("text", {x: 570, y: 392 + i * 18, "font-size": 11.5, style: "font-family:monospace;text-decoration:line-through", fill: hl2}, "/" + q);
    el("text", {x: 570, y: 410 + i * 18, "font-size": 11, fill: hl2}, "(whiteout törölte)"); });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
