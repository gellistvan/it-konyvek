<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index és objektum sorrendje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">Forgatókönyv: <button class="sb" data-s="A" aria-pressed="true" onclick="pickScn('A')">A</button> <button class="sb" data-s="B" aria-pressed="false" onclick="pickScn('B')">B</button> <button class="sb" data-s="C" aria-pressed="false" onclick="pickScn('C')">C</button> <button class="sb" data-s="D" aria-pressed="false" onclick="pickScn('D')">D</button> <label>replikációs késés: <input id="dl" type="range" min="0" max="5" step="0.5" value="2" oninput="setSteps(build())" aria-label="Replikációs késés 0–5 s"> <span id="dlv">2 s</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram öt életvonallal (író, R1, R2, index, olvasó): index előbb, majd PUT esetén az olvasó 404-et kap; PUT, láthatóság-ellenőrzés, majd index esetén 200-at; törlésnél előbb a tombstone, majd a DELETE; fordított törlési sorrendnél az olvasó 404-et kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Időmodell (szemléltetés, nem mérés): az R1-re írt változás a beállított késés után látszik az R2-n, az olvasó az R2-ről olvas. 0 s késésnél az (A) 404-e eltűnik, a (D)-é nem: a hibás törlési sorrend erősen konzisztens tárolón is hibás hivatkozást hagy.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"scn": "A", "d": 2.0, "i": 0, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 1. üzenet: író → index: index írása (kulcs)"}, {"scn": "A", "d": 2.0, "i": 1, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 2. üzenet: index → író: OK"}, {"scn": "A", "d": 2.0, "i": 2, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 3. üzenet: író → R1: PUT objektum"}, {"scn": "A", "d": 2.0, "i": 3, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 4. üzenet: R1 → R2: replikáció (2 s)"}, {"scn": "A", "d": 2.0, "i": 4, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 5. üzenet: R1 → író: 200"}, {"scn": "A", "d": 2.0, "i": 5, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 6. üzenet: olvasó → index: kulcs lekérése"}, {"scn": "A", "d": 2.0, "i": 6, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 7. üzenet: index → olvasó: kulcs  |  az olvasó válasza: 404"}, {"scn": "A", "d": 2.0, "i": 7, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 8. üzenet: olvasó → R2: GET"}, {"scn": "A", "d": 2.0, "i": 8, "line": -1, "msg": "(A) index → PUT: az olvasó 404-et kap – 9. üzenet: R2 → olvasó: 404  |  az olvasó válasza: 404"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const TITLE = {"A": "(A) index → PUT: az olvasó 404-et kap", "B": "(B) PUT → HeadObject → index: 200 OK", "C": "(C) törlés: tombstone → DELETE: nincs hibás hivatkozás", "D": "(D) DELETE → index még hivatkozik: 404"}, LANES = ["író", "R1", "R2", "index", "olvasó"];
let SCN = "A";
function sc(name, d){
  const ev = [], f = x => String(x).replace(".", ",");
  if (name === "A") {
    ev.push([0, "író", "index", "index írása (kulcs)", "req"], [0.2, "index", "író", "OK", "resp"], [1, "író", "R1", "PUT objektum", "req"], [1.2, "R1", "író", "200", "resp"], [1, "R1", "R2", `replikáció (${f(d)} s)`, "repl"], [1.5, "olvasó", "index", "kulcs lekérése", "req"], [1.6, "index", "olvasó", "kulcs", "resp"], [1.7, "olvasó", "R2", "GET", "req"]);
    const ok = 1.7 >= 1 + d; ev.push([1.9, "R2", "olvasó", ok ? "200 OK" : "404", ok ? "resp" : "err"]);
  } else if (name === "B") {
    ev.push([0, "író", "R1", "PUT objektum", "req"], [0.2, "R1", "író", "200", "resp"], [0, "R1", "R2", `replikáció (${f(d)} s)`, "repl"]);
    let t = 0.4; while (t < d) { ev.push([t, "író", "R2", "HeadObject", "req"], [t + 0.15, "R2", "író", "404 (még nem)", "err"]); t += 1; }
    ev.push([t, "író", "R2", "HeadObject", "req"], [t + 0.15, "R2", "író", "200", "resp"], [t + 0.4, "író", "index", "index írása", "req"], [t + 0.55, "index", "író", "OK", "resp"], [t + 0.9, "olvasó", "index", "kulcs lekérése", "req"], [t + 1, "index", "olvasó", "kulcs", "resp"], [t + 1.1, "olvasó", "R2", "GET", "req"], [t + 1.3, "R2", "olvasó", "200 OK", "resp"]);
  } else if (name === "C") {
    ev.push([0, "író", "index", "tombstone (törlés)", "req"], [0.2, "index", "író", "OK", "resp"], [0.6, "író", "R1", "DELETE", "req"], [0.8, "R1", "író", "204", "resp"], [0.6, "R1", "R2", `replikáció (${f(d)} s)`, "repl"], [1.2, "olvasó", "index", "kulcs lekérése", "req"], [1.3, "index", "olvasó", "nincs (törölve)", "resp"]);
  } else {
    ev.push([0, "író", "R1", "DELETE", "req"], [0.2, "R1", "író", "204", "resp"], [0, "R1", "R2", `replikáció (${f(d)} s)`, "repl"], [d + 0.4, "olvasó", "index", "kulcs lekérése", "req"], [d + 0.5, "index", "olvasó", "kulcs (még ott)", "resp"], [d + 0.6, "olvasó", "R2", "GET", "req"], [d + 0.8, "R2", "olvasó", "404", "err"], [d + 1, "író", "index", "index törlése (túl későn)", "req"]);
  }
  ev.sort((p, q) => p[0] - q[0]);
  return ev;
}
function rankEnd(ev, t){ const i = ev.findIndex(e => e[0] >= t && e[4] !== "repl"); return i < 0 ? ev.length : i; }
function build(){
  const d = +document.getElementById("dl").value; document.getElementById("dlv").textContent = String(d).replace(".", ",") + " s";
  const ev = sc(SCN, d), res = ev.filter(e => e[2] === "olvasó").slice(-1)[0][3];
  return ev.map((e, i) => ({scn: SCN, d: d, i: i, line: -1, msg: `${TITLE[SCN]} – ${i + 1}. üzenet: ${e[1]} → ${e[2]}: ${e[3]}` + (i === ev.length - 1 || e[2] === "olvasó" && e[4] !== "req" ? `  |  az olvasó válasza: ${res}` : "")}));
}
function pickScn(n){ SCN = n; document.querySelectorAll(".sb").forEach(b => b.setAttribute("aria-pressed", b.dataset.s === n)); setSteps(build()); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 340");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const ev = sc(s.scn, s.d), step = Math.min(30, 280 / ev.length), Y = r => 52 + r * step, X = {};
  LANES.forEach((l, i) => { X[l] = 80 + i * 150; el("rect", {x: X[l] - 45, y: 8, width: 90, height: 24, rx: 5, fill: (l === "R1" || l === "R2") ? css("--cellhl") : css("--cell"), stroke: css("--line")}); el("text", {x: X[l], y: 25, "text-anchor": "middle", "font-size": 12}, l); el("line", {x1: X[l], y1: 32, x2: X[l], y2: 330, stroke: css("--muted"), "stroke-dasharray": "2 3"}); });
  ev.forEach((e, i) => {
    if (i > s.i) return;
    const [t, a, b, lab, kind] = e, on = i === s.i, y = Y(i), col = on ? css("--hl2") : css("--fg");
    if (kind === "repl") {
      const y2 = Y(rankEnd(ev, t + s.d) - 0.5); let d = `M ${X[a]} ${y}`; for (let j = 1; j <= 20; j++) { const xx = X[a] + (X[b] - X[a]) * j / 20, yy = y + (y2 - y) * j / 20 + (j % 2 ? -4 : 4); d += ` L ${xx} ${yy}`; }
      el("path", {d: d, fill: "none", stroke: col, "stroke-width": 1.3}); el("text", {x: (X[a] + X[b]) / 2, y: (y + y2) / 2 - 8, "text-anchor": "middle", "font-size": 10.5, fill: col}, lab); return;
    }
    el("line", {x1: X[a], y1: y, x2: X[b] + (X[b] > X[a] ? -3 : 3), y2: y + 8, stroke: col, "stroke-width": on ? 2.4 : 1.3, "stroke-dasharray": kind === "req" ? "none" : "6 3", "marker-end": "url(#ar)"});
    const tx = el("text", {x: (X[a] + X[b]) / 2, y: y - 3, "text-anchor": "middle", "font-size": 11, "font-weight": kind === "err" ? "bold" : "normal", fill: col}, lab + (kind === "err" ? " ✗" : "")); tx.setAttribute("stroke", css("--bg")); tx.setAttribute("stroke-width", 3); tx.setAttribute("paint-order", "stroke");
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
