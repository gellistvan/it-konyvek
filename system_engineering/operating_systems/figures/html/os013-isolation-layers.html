<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izolációs formák rétegei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy rétegoszlop; a VM és az unikernel saját kernelt kap hardveres határral, a konténerek közös kernelen, a WASM-modulok egy futásidőn belül futnak; lépésenként egy write() útja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, a méretek nem arányosak; az indulási idők a 4.4.6 táblázat tájékoztató adatai. Oszlopra kattintva a write() útja indul az adott izolációs formában.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"col": -1, "hop": -1, "line": -1, "msg": "Áttekintés: kattints egy oszlopra, vagy lépj tovább a write() útjához."}, {"col": 0, "hop": 0, "line": -1, "msg": "VM (hypervisor) – 1/4: App: write() → syscall a vendég kernelbe"}, {"col": 0, "hop": 1, "line": -1, "msg": "VM (hypervisor) – 2/4: Vendég kernel: virtio-net/blk illesztő → I/O-hozzáférés"}, {"col": 0, "hop": 2, "line": -1, "msg": "VM (hypervisor) – 3/4: VM-exit: a CPU a hypervisorba lép (hardveres határ)"}, {"col": 0, "hop": 3, "line": -1, "msg": "VM (hypervisor) – 4/4: Hypervisor: eszközemuláció / virtio-háttér → valódi eszköz"}, {"col": 1, "hop": 0, "line": -1, "msg": "Konténer – 1/3: App: write() → syscall közvetlenül a host kernelbe"}, {"col": 1, "hop": 1, "line": -1, "msg": "Konténer – 2/3: Host kernel: seccomp-szűrő, névtér- és cgroup-ellenőrzés"}, {"col": 1, "hop": 2, "line": -1, "msg": "Konténer – 3/3: Host kernel: VFS / hálózati stack → eszközmeghajtó"}, {"col": 2, "hop": 0, "line": -1, "msg": "Unikernel – 1/3: App: write() = függvényhívás a library OS-ben (nincs módváltás)"}, {"col": 2, "hop": 1, "line": -1, "msg": "Unikernel – 2/3: Library OS: virtio-illesztő → értesítés (notify)"}, {"col": 2, "hop": 2, "line": -1, "msg": "Unikernel – 3/3: VM-exit → hypervisor: virtio-háttér → valódi eszköz"}, {"col": 3, "hop": 0, "line": -1, "msg": "WASM / WASI – 1/4: Modul: fd_write – WASI-import hívása"}, {"col": 3, "hop": 1, "line": -1, "msg": "WASM / WASI – 2/4: Futásidő: képesség-ellenőrzés (csak átadott fd/könyvtár)"}, {"col": 3, "hop": 2, "line": -1, "msg": "WASM / WASI – 3/4: Futásidő (host folyamat): write() syscall a host kernelbe"}, {"col": 3, "hop": 3, "line": -1, "msg": "WASM / WASI – 4/4: Host kernel: VFS / eszközmeghajtó"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const COLS = [{"t": "VM (hypervisor)", "shared": ["Hypervisor (Type 1)"], "inst": ["Vendég\nkernel", "Userland", "App"], "b": "hw", "bn": "hardveres határ (VM-exit, EPT)", "start": "indulás: 5–30 s", "row": "erős (hardveres) · 5–30 s · 64–256 MiB + alk."}, {"t": "Konténer", "shared": ["Host kernel\n(névterek, cgroups, seccomp)"], "inst": ["Userland-\nrétegek", "App"], "b": "kern", "bn": "kernelhatár (névterek)", "start": "indulás: 0,1–0,5 s", "row": "közepes (kernel-névterek) · 0,1–0,5 s · alk. mérete"}, {"t": "Unikernel", "shared": ["Hypervisor"], "inst": ["App +\nlibrary OS"], "b": "hw", "bn": "hardveres határ (VM)", "start": "indulás: 1–50 ms", "row": "közepes (egy címtér, de VM-határ) · 1–50 ms · néhány MiB"}, {"t": "WASM / WASI", "shared": ["Host kernel", "Host folyamat:\nfutásidő (Wasmtime)"], "inst": ["Modul +\nlin. memória"], "b": "sw", "bn": "szoftveres határ (futásidő)", "start": "példányosítás: 1–10 µs", "row": "erős (képességalapú) · 1–10 µs · a modul lin. memóriája"}], PATHS = [["App: write() → syscall a vendég kernelbe", "Vendég kernel: virtio-net/blk illesztő → I/O-hozzáférés", "VM-exit: a CPU a hypervisorba lép (hardveres határ)", "Hypervisor: eszközemuláció / virtio-háttér → valódi eszköz"], ["App: write() → syscall közvetlenül a host kernelbe", "Host kernel: seccomp-szűrő, névtér- és cgroup-ellenőrzés", "Host kernel: VFS / hálózati stack → eszközmeghajtó"], ["App: write() = függvényhívás a library OS-ben (nincs módváltás)", "Library OS: virtio-illesztő → értesítés (notify)", "VM-exit → hypervisor: virtio-háttér → valódi eszköz"], ["Modul: fd_write – WASI-import hívása", "Futásidő: képesség-ellenőrzés (csak átadott fd/könyvtár)", "Futásidő (host folyamat): write() syscall a host kernelbe", "Host kernel: VFS / eszközmeghajtó"]];
const FIRST = {"0": 1, "1": 5, "2": 8, "3": 11}, TARGET = [["Vendég\nkernel", "Vendég\nkernel", "Hypervisor (Type 1)", "Hardver"], ["Host kernel\n(névterek, cgroups, seccomp)", "Host kernel\n(névterek, cgroups, seccomp)", "Hardver"], ["App +\nlibrary OS", "Hypervisor", "Hardver"], ["Host folyamat:\nfutásidő (Wasmtime)", "Host folyamat:\nfutásidő (Wasmtime)", "Host kernel", "Hardver"]];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 380"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), cellhl = css("--cellhl"), hl = css("--hl"), mut = css("--muted"), w2 = css("--hl2");
  const defs = el("defs", {}); const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", "hh"); p.setAttribute("width", 6); p.setAttribute("height", 6);
  p.setAttribute("patternUnits", "userSpaceOnUse"); const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", "M-1,7 L7,-1 M-1,1 L1,-1 M5,7 L7,5");
  pa.setAttribute("stroke", mut); pa.setAttribute("stroke-width", 1); p.appendChild(pa); defs.appendChild(p);
  const DASH = {hw: "none", kern: "8 4", sw: "2 3"}, BW = {hw: 3.5, kern: 2.2, sw: 2.2};
  const CW = 172, G = 14, base = 300;
  const hops = [];   // [x, y] koordináták az út lépéseihez
  COLS.forEach((c, i) => {
    const x0 = 6 + i * (CW + G), on = s.col === i;
    let y = base - 4;
    const g = el("rect", {x: x0 - 3, y: 18, width: CW + 6, height: base + 52, fill: on ? cellhl : "transparent", opacity: on ? 0.35 : 1, stroke: on ? hl : "none", "stroke-width": 2, style: "cursor:pointer"});
    g.addEventListener("click", () => { stop(); show(FIRST[i]); });
    el("text", {x: x0 + CW / 2, y: 34, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", style: "pointer-events:none"}, c.t);
    const sh = [];
    c.shared.forEach(t => { const h = t.includes("\n") ? 40 : 28; y -= h;
      el("rect", {x: x0, y, width: CW, height: h, fill: cellhl, stroke: line, style: "pointer-events:none"});
      t.split("\n").forEach((ln, j, A) => el("text", {x: x0 + CW / 2, y: y + h / 2 + 4 + (j - (A.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 10.5, style: "pointer-events:none"}, ln));
      sh.push([t, x0 + CW / 2, y + h / 2]); y -= 4; });
    const iw = (CW - 8) / 2, yTop = y;
    const inst = [];
    for (let kx = 0; kx < 2; kx++) {
      const xi = x0 + kx * (iw + 8); let yy = yTop - 6;
      c.inst.forEach(t => { const h = t.includes("\n") ? 40 : 28; yy -= h;
        el("rect", {x: xi + 4, y: yy, width: iw - 8, height: h, fill: on ? cell : "url(#hh)", stroke: line, style: "pointer-events:none"});
        t.split("\n").forEach((ln, j, A) => el("text", {x: xi + iw / 2, y: yy + h / 2 + 4 + (j - (A.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 9.5, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3, style: "pointer-events:none"}, ln));
        if (kx === 0) inst.push([t, xi + iw / 2, yy + h / 2]); yy -= 3; });
      el("rect", {x: xi, y: yy - 2, width: iw, height: yTop - yy + 2, fill: "none", stroke: on ? w2 : line, "stroke-width": BW[c.b], "stroke-dasharray": DASH[c.b], style: "pointer-events:none"});
    }
    el("text", {x: x0 + CW / 2, y: base + 42, "text-anchor": "middle", "font-size": 10.5}, c.start);
    el("text", {x: x0 + CW / 2, y: base + 57, "text-anchor": "middle", "font-size": 10, fill: mut, "font-style": "italic"}, c.bn);
    hops.push({pts: inst.concat(sh).concat([["Hardver", x0 + CW / 2, base + 12]]), top: inst[inst.length - 1]});
  });
  el("rect", {x: 6, y: base, width: 4 * CW + 3 * G, height: 24, fill: mut, stroke: line});
  el("text", {x: 6 + (4 * CW + 3 * G) / 2, y: base + 16, "text-anchor": "middle", "font-size": 12, fill: css("--bg")}, "Hardver (közös)");
  if (s.col >= 0) {
    const H = hops[s.col], c = COLS[s.col];
    const find = nm => H.pts.find(q => q[0] === nm);
    const pts = [H.top].concat(TARGET[s.col].slice(0, s.hop + 1).map(find));
    let d = `M${pts[0][1]},${pts[0][2]}`; pts.slice(1).forEach((q, j) => { const pr = pts[j];
      d += q === pr ? ` m0,0` : ` L${q[1]},${q[2]}`; });
    const upto = pts.length - 1;
    el("path", {d, fill: "none", stroke: w2, "stroke-width": 3.5, "stroke-linecap": "round"});
    el("circle", {cx: pts[upto][1], cy: pts[upto][2], r: 7, fill: w2});
    el("text", {x: 6, y: 375, "font-size": 11, fill: mut}, "táblázatsor: " + c.row);
  } else el("text", {x: 6, y: 375, "font-size": 11, fill: mut}, "ferde = példányonként ismétlődik · szürke = közös · határ: vastag = hardveres, szaggatott = kernel, pontozott = szoftveres");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
