<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epoch-alapú visszanyerés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kezdő slotérték: <select id="init" onchange="book()" aria-label="Kezdő slotérték"><option value="-1">−1 (INACTIVE)</option><option value="0">0 (statikus nullázás)</option></select></label> <button onclick="book()">A könyv forgatókönyve</button> <button onclick="clr()">Üres kezdés</button> <span>Saját: </span><button onclick="act('enter','T1')">T1 belép</button><button onclick="act('exit','T1')">T1 kilép</button> <button onclick="act('enter','T2')">T2 belép</button><button onclick="act('exit','T2')">T2 kilép</button> <button onclick="act('enter','T3')">T3 belép</button><button onclick="act('exit','T3')">T3 kilép</button> <button onclick="act('retire')">kicsatol</button> <button onclick="act('advance')">advance</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Háromepochos gyűrű a globális epochal, három szál slotja és három visszavonási lista; lépésenként a belépés, kilépés, kicsatolás és léptetés hatása."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 10.3.6 EBR-vázlatának átirata, EPOCH_COUNT = 3; T3 regisztrált, de nem olvas. A 0 kezdőértékkel a nem olvasó T3 a 0. epochban „aktívnak” látszik, és az első léptetés után az epoch beragad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: global_epoch = 0, minden slot -1 (INACTIVE), a visszavonási listák üresek.", "line": -1, "stage": 0, "e": 0, "slots": {"T1": -1, "T2": -1, "T3": -1}, "lists": [[], [], []], "freed": [], "aie": null}, {"msg": "(1) T1 belép (ebr_read_lock): slot = 0", "line": 1, "stage": 1, "aie": null, "e": 0, "slots": {"T1": 0, "T2": -1, "T3": -1}, "lists": [[], [], []], "freed": []}, {"msg": "(1) X kicsatolva (ebr_retire) → retire_list[0]", "line": 5, "stage": 1, "aie": null, "e": 0, "slots": {"T1": 0, "T2": -1, "T3": -1}, "lists": [["X"], [], []], "freed": []}, {"msg": "(2) T1 kilép (ebr_read_unlock): slot = −1 (INACTIVE)", "line": 3, "stage": 2, "aie": null, "e": 0, "slots": {"T1": -1, "T2": -1, "T3": -1}, "lists": [["X"], [], []], "freed": []}, {"msg": "(2) T2 belép (ebr_read_lock): slot = 0", "line": 1, "stage": 2, "aie": null, "e": 0, "slots": {"T1": -1, "T2": 0, "T3": -1}, "lists": [["X"], [], []], "freed": []}, {"msg": "(2) ebr_advance: all_in_epoch(0) igaz → global_epoch = 1; felszabadul a retire_list[2]: (üres)", "line": 9, "stage": 2, "aie": true, "e": 1, "slots": {"T1": -1, "T2": 0, "T3": -1}, "lists": [["X"], [], []], "freed": []}, {"msg": "(3) Y kicsatolva (ebr_retire) → retire_list[1]", "line": 5, "stage": 3, "aie": null, "e": 1, "slots": {"T1": -1, "T2": 0, "T3": -1}, "lists": [["X"], ["Y"], []], "freed": []}, {"msg": "(3) ebr_advance: all_in_epoch(1) hamis (T2 még a(z) 0. epochban) → nincs léptetés", "line": 8, "stage": 3, "aie": false, "e": 1, "slots": {"T1": -1, "T2": 0, "T3": -1}, "lists": [["X"], ["Y"], []], "freed": []}, {"msg": "(4) T2 kilép (ebr_read_unlock): slot = −1 (INACTIVE)", "line": 3, "stage": 4, "aie": null, "e": 1, "slots": {"T1": -1, "T2": -1, "T3": -1}, "lists": [["X"], ["Y"], []], "freed": []}, {"msg": "(4) ebr_advance: all_in_epoch(1) igaz → global_epoch = 2; felszabadul a retire_list[0]: X", "line": 9, "stage": 4, "aie": true, "e": 2, "slots": {"T1": -1, "T2": -1, "T3": -1}, "lists": [[], ["Y"], []], "freed": ["X"]}, {"msg": "(5) ebr_advance: all_in_epoch(2) igaz → global_epoch = 0; felszabadul a retire_list[1]: Y", "line": 9, "stage": 5, "aie": true, "e": 0, "slots": {"T1": -1, "T2": -1, "T3": -1}, "lists": [[], [], []], "freed": ["X", "Y"]}];
const CODE = ["ebr_read_lock():   e = global_epoch; slots[my] = e; (újraellenőrzés)", "                   → a slot az aktuális epoch", "ebr_read_unlock(): slots[my] = INACTIVE (−1)", "                   → a szál nem olvas", "ebr_retire(p):     e = global_epoch;", "                   push(retire_list[e], p)", "ebr_advance():     e = global_epoch;", "                   if (!all_in_epoch(e)) return;      // minden slot −1 vagy e?", "                   → beragadt olvasó: nincs léptetés", "                   global_epoch = (e + 1) % 3; reclaim_all(retire_list[(e + 2) % 3])"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BOOK = [["enter", "T1", 1], ["retire", "X", 1], ["exit", "T1", 2], ["enter", "T2", 2], ["advance", null, 2], ["retire", "Y", 3], ["advance", null, 3], ["exit", "T2", 4], ["advance", null, 4], ["advance", null, 5]];
let OWN = [], NEXTOBJ = 0;
function simulate(ops, init){
  const S = {e: 0, slots: {T1: init, T2: init, T3: init}, lists: [[], [], []], freed: []};
  const cp = () => JSON.parse(JSON.stringify(S));
  const st = [Object.assign({msg: `Kezdet: global_epoch = 0, minden slot ${init} (${init === -1 ? "INACTIVE" : "nullázott"}), a visszavonási listák üresek.`, line: -1, stage: 0, aie: null}, cp())];
  ops.forEach(([op, arg, stage]) => {
    let aie = null, line = -1, msg;
    if (op === "enter") { S.slots[arg] = S.e; msg = `${arg} belép (ebr_read_lock): slot = ${S.e}`; line = 1; }
    else if (op === "exit") { S.slots[arg] = -1; msg = `${arg} kilép (ebr_read_unlock): slot = −1 (INACTIVE)`; line = 3; }
    else if (op === "retire") { S.lists[S.e].push(arg); msg = `${arg} kicsatolva (ebr_retire) → retire_list[${S.e}]`; line = 5; }
    else {
      const e = S.e; aie = Object.values(S.slots).every(v => v === -1 || v === e);
      if (aie) { S.e = (e + 1) % 3; const kk = (e + 2) % 3, fr = S.lists[kk]; S.freed = S.freed.concat(fr); S.lists[kk] = [];
        msg = `ebr_advance: all_in_epoch(${e}) igaz → global_epoch = ${S.e}; felszabadul a retire_list[${kk}]: ` + (fr.length ? fr.join(", ") : "(üres)"); line = 9; }
      else { const blk = Object.keys(S.slots).filter(t => S.slots[t] !== -1 && S.slots[t] !== e);
        msg = `ebr_advance: all_in_epoch(${e}) hamis (${blk.join(", ")} még a(z) ${S.slots[blk[0]]}. epochban) → nincs léptetés`; line = 8; }
    }
    st.push(Object.assign({msg: (stage ? `(${stage}) ` : "") + msg, line, stage, aie}, cp()));
  });
  return st;
}
function render(s){
  svg.innerHTML = "";
  const cx = 90, cy = 110;
  for (let i = 0; i < 3; i++) { const a = (90 - 120 * i) * Math.PI / 180, x = cx + 55 * Math.cos(a), y = cy - 55 * Math.sin(a), on = i === s.e;
    el("circle", {cx: x, cy: y, r: 22, fill: on ? "#222" : css("--cell"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x, y: y + 6, "text-anchor": "middle", "font-size": 17, fill: on ? "#fff" : css("--fg")}, String(i)); }
  el("text", {x: cx, y: cy + 6, "text-anchor": "middle", "font-size": 18}, "↻");
  el("text", {x: 20, y: 205, "font-size": 15}, "global_epoch = " + s.e);
  ["T1", "T2", "T3"].forEach((t, i) => { const v = s.slots[t], y = 40 + i * 40;
    el("rect", {x: 210, y: y - 16, width: 26, height: 26, fill: v !== -1 ? "#222" : css("--cell"), stroke: css("--line")});
    el("text", {x: 246, y: y + 3, "font-size": 15}, `${t}: slot = ${v === -1 ? "−1" : v}`); });
  for (let i = 0; i < 3; i++) { const y = 40 + i * 40, items = s.lists[i];
    el("text", {x: 380, y: y + 3, "font-size": 15, "font-family": "monospace"}, `retire_list[${i}]: ` + (items.length ? items.join(", ") : "–")); }
  el("text", {x: 210, y: 175, "font-size": 15}, "felszabadítva: " + (s.freed.length ? s.freed.join(", ") : "–"));
  if (s.aie !== null) el("text", {x: 210, y: 205, "font-size": 15, "font-weight": "bold", fill: s.aie ? css("--hl") : css("--hl2")}, "all_in_epoch: " + (s.aie ? "igaz" : "hamis – beragadt olvasó"));
  el("text", {x: 20, y: 280, "font-size": 11, fill: css("--muted")}, "tömör = aktív slot · fekete kör = global_epoch · léptetéskor a (e + 2) mod 3 lista szabadul fel");
}
function init(){ return +document.getElementById("init").value; }
function book(){ OWN = BOOK.map(x => x.slice()); NEXTOBJ = 2; setSteps(simulate(OWN, init())); }
function act(op, arg){
  if (op === "retire") { arg = "XYZWVUQ"[NEXTOBJ % 7] + (NEXTOBJ >= 7 ? Math.floor(NEXTOBJ / 7) : ""); NEXTOBJ++; }
  OWN.push([op, arg, 0]); setSteps(simulate(OWN, init())); show(STEPS.length - 1);
}
function clr(){ OWN = []; NEXTOBJ = 0; setSteps(simulate(OWN, init())); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
