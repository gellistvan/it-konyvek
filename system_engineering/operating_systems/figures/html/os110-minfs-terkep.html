<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A minfs lemeztérképe és az inode blokkmutatói</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>fájlméret [B] <input type="range" id="sz" min="0" max="4243456" step="1" value="0" style="min-width:260px"></label> <input type="number" id="szn" min="0" max="4243456" value="0" style="width:9em" aria-label="fájlméret bájtban"> <button id="rst">mintaméretek</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Blokksáv a 0–39. blokkal: 0 superblock, 1 bitmap, 2–17 inode-tábla, 18 gyökérkönyvtár, 19-től a fájl adatblokkjai. A kiválasztott blokk relatív bitmap-indexe a blokkszám mínusz 18. Alatta az inode 12 közvetlen mutatója és a közvetett mutató, valamint a mutatóblokk kitöltöttsége."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lépések mintaméretek (0; 5000; 49 152; 49 153; 1 000 000 B; maximum); a csúszka vagy a mező tetszőleges méretet ad. A blokkszámok friss lemezen first-fit foglalást feltételeznek (a gyökérkönyvtár a 18-as blokk). 4 KiB blokk, 4 bájtos blokkmutató, little-endian.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"size": 0, "line": -1, "msg": "méret 0 B: közvetlen blokk 0, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 0"}, {"size": 5000, "line": -1, "msg": "méret 5 000 B: közvetlen blokk 2, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 2"}, {"size": 49152, "line": -1, "msg": "méret 49 152 B: közvetlen blokk 12, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 12"}, {"size": 49153, "line": -1, "msg": "méret 49 153 B: közvetlen blokk 12, közvetett bejegyzés 1, összes blokk (mutatóblokkal együtt) 14"}, {"size": 1000000, "line": -1, "msg": "méret 1 000 000 B: közvetlen blokk 12, közvetett bejegyzés 233, összes blokk (mutatóblokkal együtt) 246"}, {"size": 4243456, "line": -1, "msg": "méret 4 243 456 B: közvetlen blokk 12, közvetett bejegyzés 1024, összes blokk (mutatóblokkal együtt) 1037"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const PRESET = [{"size": 0, "line": -1, "msg": "méret 0 B: közvetlen blokk 0, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 0"}, {"size": 5000, "line": -1, "msg": "méret 5 000 B: közvetlen blokk 2, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 2"}, {"size": 49152, "line": -1, "msg": "méret 49 152 B: közvetlen blokk 12, közvetett bejegyzés 0, összes blokk (mutatóblokkal együtt) 12"}, {"size": 49153, "line": -1, "msg": "méret 49 153 B: közvetlen blokk 12, közvetett bejegyzés 1, összes blokk (mutatóblokkal együtt) 14"}, {"size": 1000000, "line": -1, "msg": "méret 1 000 000 B: közvetlen blokk 12, közvetett bejegyzés 233, összes blokk (mutatóblokkal együtt) 246"}, {"size": 4243456, "line": -1, "msg": "méret 4 243 456 B: közvetlen blokk 12, közvetett bejegyzés 1024, összes blokk (mutatóblokkal együtt) 1037"}];

const BS = 4096, NDIR = 12, NIND = 1024, FIRST = 18, MAXSZ = 4243456;
let selBlk = 18;
function lay(sz){ const n = Math.ceil(sz / BS), d = Math.min(n, NDIR), ind = Math.max(0, n - NDIR), p = ind ? 1 : 0; return {d, ind, p, tot: d + ind + p}; }
function sp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function mk(sz){ const L = lay(sz); return {size: sz, line: -1, msg: `méret ${sp(sz)} B: közvetlen blokk ${L.d}, közvetett bejegyzés ${L.ind}, összes blokk (mutatóblokkal együtt) ${L.tot}`}; }
function owner(b, L){
  // first-fit: 18 = gyökérkönyvtár, a fájl blokkjai 19-től; a mutatóblokk a 13. adatblokk előtt kap helyet
  if (b < 1) return "superblock (metaadat, nincs bitmap-bit)"; if (b < 2) return "adatblokk-bitmap (metaadat, nincs bitmap-bit)";
  if (b < FIRST) return "inode-tábla (metaadat, nincs bitmap-bit)"; if (b === FIRST) return "gyökérkönyvtár";
  const k = b - 19; if (k < L.d) return "a fájl " + k + ". közvetlen adatblokkja";
  if (L.p && k === NDIR) return "a fájl mutatóblokkja (i_indirect[0])";
  if (L.p && k > NDIR && k - NDIR - 1 < L.ind) return "a fájl adatblokkja a mutatóblokk [" + (k - NDIR - 1) + "] bejegyzéséből";
  return "szabad"; }
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const L = lay(s.size);
  document.getElementById("sz").value = s.size; document.getElementById("szn").value = s.size;
  // blokksáv: 0..39 kattintható
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "Lemez: 0–39. blokk (kattints egy blokkra); first-fit foglalás");
  for (let b = 0; b < 40; b++) {
    const x = 10 + b * 18.5, used = b <= FIRST || owner(b, L) !== "szabad", meta = b < FIRST;
    const r = el("rect", {x, y: 28, width: 17, height: 30, fill: used ? (meta ? cellhl : cell) : css("--bg"), stroke: b === selBlk ? hl2 : line, "stroke-width": b === selBlk ? 3 : 0.8, "stroke-dasharray": (L.p && b === 19 + NDIR) ? "2 2" : "", tabindex: 0, role: "button", "aria-label": "blokk " + b, style: "cursor:pointer"});
    r.addEventListener("click", () => { selBlk = b; show(k); }); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { selBlk = b; show(k); } });
    if (b % 2 === 0 || b === FIRST || b === 19) el("text", {x: x + 8.5, y: 72, "text-anchor": "middle", "font-size": 10, fill: mut}, String(b));
    if (used && !meta) el("text", {x: x + 8.5, y: 48, "text-anchor": "middle", "font-size": 10}, b === FIRST ? "/" : (L.p && b === 19 + NDIR ? "M" : "D"));
  }
  const rel = selBlk - FIRST;
  el("text", {x: 10, y: 96, "font-size": 12.5, "font-weight": "bold", fill: hl2}, "blokk " + selBlk + ": " + (rel < 0 ? "nincs bitmap-bit (metaadat-régió)" : "relatív " + rel + " (bitmap[" + Math.floor(rel / 8) + "] " + (rel % 8) + ". bit)") + " – " + owner(selBlk, L));
  // inode mutatói
  el("text", {x: 10, y: 128, "font-size": 13, "font-weight": "bold"}, "Inode: i_direct[0..11] és i_indirect[0]");
  for (let i = 0; i < NDIR; i++) { const on = i < L.d;
    el("rect", {x: 10 + i * 40, y: 138, width: 38, height: 34, fill: on ? cellhl : cell, stroke: on ? hl : line, "stroke-width": on ? 2.5 : 1});
    el("text", {x: 29 + i * 40, y: 160, "text-anchor": "middle", "font-size": 11}, on ? String(19 + i) : "0"); }
  el("rect", {x: 500, y: 138, width: 90, height: 34, fill: L.p ? cellhl : cell, stroke: L.p ? hl : line, "stroke-width": L.p ? 2.5 : 1, "stroke-dasharray": "6 3"});
  el("text", {x: 545, y: 160, "text-anchor": "middle", "font-size": 11}, L.p ? "→ " + (19 + NDIR) : "0");
  el("text", {x: 10, y: 190, "font-size": 11, fill: mut}, "közvetlen: 12 × 4 KiB = 48 KiB");
  el("text", {x: 500, y: 190, "font-size": 11, fill: mut}, "közvetett: 1024 × 4 KiB = 4 MiB");
  // mutatóblokk kitöltöttsége
  el("text", {x: 10, y: 222, "font-size": 13, "font-weight": "bold"}, "Mutatóblokk (1024 × uint32): használt bejegyzés " + L.ind + " / 1024");
  el("rect", {x: 10, y: 232, width: 740, height: 26, fill: cell, stroke: line, "stroke-dasharray": "2 2"});
  if (L.ind) el("rect", {x: 10, y: 232, width: Math.max(2, 740 * L.ind / NIND), height: 26, fill: hl, opacity: 0.55});
  el("text", {x: 10, y: 290, "font-size": 12.5}, "méret " + sp(s.size) + " B → közvetlen " + L.d + ", közvetett " + L.ind + ", mutatóblokk " + L.p + ", összesen " + L.tot + " blokk");
  el("text", {x: 10, y: 312, "font-size": 11, fill: mut}, "max. " + sp(MAXSZ) + " B ≈ 4,05 MiB; 4 KiB blokk, 4 bájtos mutató, little-endian; D = adat, M = mutatóblokk, / = gyökérkönyvtár");
}
document.getElementById("sz").addEventListener("input", e => setSteps([mk(+e.target.value)]));
document.getElementById("szn").addEventListener("change", e => { const v = Math.max(0, Math.min(MAXSZ, Math.round(+e.target.value) || 0)); setSteps([mk(v)]); });
document.getElementById("rst").addEventListener("click", () => setSteps(PRESET));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
