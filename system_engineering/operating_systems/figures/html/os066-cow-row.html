<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COW és ROW első írás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="pt" aria-pressed="false" onclick="togglePart()">részleges írás: KI</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két panel: COW-nál a B7 régi tartalma előbb beolvasódik és az S7 pillanatkép-területre íródik, majd a B7 felülíródik (3 adat-I/O); ROW-nál az új adat a szabad B9-be kerül, és az élő kötet mutatója átáll, a pillanatkép a B7-en marad (1 adat-I/O)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Teljes blokkot felülíró írás; a „részleges írás” kapcsolóval a ROW-nál is megjelenik a régi blokk olvasása. Sematikus, a fejezet C_cow képletének tagjai szerint; nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom)."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, "line": -1, "msg": "COW: COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom).  ‖  ROW: ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik a 7. logikai blokkra."}, "line": -1, "msg": "COW: (1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni.  ‖  ROW: (1) írás érkezik a 7. logikai blokkra."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [1, 0], "meta": 0, "n": 2, "msg": "(2) a régi B7 beolvasása."}, "r": {"live": "B7", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 0, "n": 2, "msg": "(2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, "line": -1, "msg": "COW: (2) a régi B7 beolvasása.  ‖  ROW: (2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, {"c": {"live": "B7", "snap": "S7", "b7": "régi", "s7": "régi", "io": [1, 1], "meta": 1, "n": 3, "msg": "(3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat."}, "r": {"live": "B9", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 1, "n": 3, "msg": "(3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, "line": -1, "msg": "COW: (3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat.  ‖  ROW: (3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, {"c": {"live": "B7", "snap": "S7", "b7": "új", "s7": "régi", "io": [1, 2], "meta": 1, "n": 4, "msg": "(4) a B7 felülírása az új adattal."}, "r": {"live": "B9", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 1, "n": 3, "msg": "(3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, "line": -1, "msg": "COW: (4) a B7 felülírása az új adattal.  ‖  ROW: (3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const V = {"0": [{"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom)."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, "line": -1, "msg": "COW: COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom).  ‖  ROW: ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik a 7. logikai blokkra."}, "line": -1, "msg": "COW: (1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni.  ‖  ROW: (1) írás érkezik a 7. logikai blokkra."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [1, 0], "meta": 0, "n": 2, "msg": "(2) a régi B7 beolvasása."}, "r": {"live": "B7", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 0, "n": 2, "msg": "(2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, "line": -1, "msg": "COW: (2) a régi B7 beolvasása.  ‖  ROW: (2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, {"c": {"live": "B7", "snap": "S7", "b7": "régi", "s7": "régi", "io": [1, 1], "meta": 1, "n": 3, "msg": "(3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat."}, "r": {"live": "B9", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 1, "n": 3, "msg": "(3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, "line": -1, "msg": "COW: (3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat.  ‖  ROW: (3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, {"c": {"live": "B7", "snap": "S7", "b7": "új", "s7": "régi", "io": [1, 2], "meta": 1, "n": 4, "msg": "(4) a B7 felülírása az új adattal."}, "r": {"live": "B9", "snap": "B7", "b9": "új", "io": [0, 1], "meta": 1, "n": 3, "msg": "(3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, "line": -1, "msg": "COW: (4) a B7 felülírása az új adattal.  ‖  ROW: (3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}], "1": [{"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom)."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 0, "msg": "ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, "line": -1, "msg": "COW: COW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat (régi tartalom).  ‖  ROW: ROW kiinduló: az élő kötet és a pillanatkép is a B7-re mutat."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [0, 0], "meta": 0, "n": 1, "msg": "(1) írás érkezik a 7. logikai blokkra."}, "line": -1, "msg": "COW: (1) írás érkezik az élő kötet 7. blokkjára (B7); a B7 a pillanatkép része → meg kell őrizni.  ‖  ROW: (1) írás érkezik a 7. logikai blokkra."}, {"c": {"live": "B7", "snap": "B7", "b7": "régi", "s7": null, "io": [1, 0], "meta": 0, "n": 2, "msg": "(2) a régi B7 beolvasása."}, "r": {"live": "B7", "snap": "B7", "b9": null, "io": [1, 0], "meta": 0, "n": 1.5, "msg": "(1b) részleges írás: a régi B7 beolvasása az összefésüléshez."}, "line": -1, "msg": "COW: (2) a régi B7 beolvasása.  ‖  ROW: (1b) részleges írás: a régi B7 beolvasása az összefésüléshez."}, {"c": {"live": "B7", "snap": "S7", "b7": "régi", "s7": "régi", "io": [1, 1], "meta": 1, "n": 3, "msg": "(3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat."}, "r": {"live": "B7", "snap": "B7", "b9": "új", "io": [1, 1], "meta": 0, "n": 2, "msg": "(2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, "line": -1, "msg": "COW: (3) a régi tartalom kiírása a pillanatkép-területre (S7); a pillanatkép-tábla az S7-re mutat.  ‖  ROW: (2) az új adat a szabad B9-be íródik; a B7 érintetlen."}, {"c": {"live": "B7", "snap": "S7", "b7": "új", "s7": "régi", "io": [1, 2], "meta": 1, "n": 4, "msg": "(4) a B7 felülírása az új adattal."}, "r": {"live": "B9", "snap": "B7", "b9": "új", "io": [1, 1], "meta": 1, "n": 3, "msg": "(3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}, "line": -1, "msg": "COW: (4) a B7 felülírása az új adattal.  ‖  ROW: (3) az élő kötet mutatója a B9-re vált (metaadat); a pillanatkép a B7-en marad."}]};
let PART = false;
function togglePart(){ PART = !PART; const b = document.getElementById("pt"); b.setAttribute("aria-pressed", PART); b.textContent = "részleges írás: " + (PART ? "BE" : "KI"); setSteps(V[PART ? "1" : "0"]); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.3"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  function blk(x, y, lab, kind, on){ el("rect", {x: x, y: y, width: 70, height: 44, fill: kind === "régi" ? "url(#hb)" : kind === "új" ? css("--fg") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : 1.2});
    const t = el("text", {x: x + 35, y: y + 27, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: kind === "új" ? css("--bg") : css("--fg")}, lab + (kind ? " " + kind : "")); if (kind === "régi") { t.setAttribute("stroke", css("--bg")); t.setAttribute("stroke-width", 4); t.setAttribute("paint-order", "stroke"); } }
  function arr(x1, y1, x2, y2, dash){ el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": dash || "none", "marker-end": "url(#ar)"}); }
  function tab(x, y, w, t){ el("rect", {x: x, y: y, width: w, height: 30, fill: css("--cellhl"), stroke: css("--line")}); el("text", {x: x + w / 2, y: y + 20, "text-anchor": "middle", "font-size": 12}, t); }
  // COW
  const c = s.c, r = s.r;
  el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, "COW");
  el("line", {x1: 380, y1: 10, x2: 380, y2: 290, stroke: css("--muted"), "stroke-dasharray": "3 3"});
  tab(20, 40, 150, "élő kötet: 7 → B7"); tab(200, 40, 170, "pillanatkép: 7 → " + c.snap);
  blk(40, 170, "B7", c.b7, c.n === 2 || c.n === 4); blk(270, 170, "S7", c.s7, c.n === 3);
  el("text", {x: 270, y: 232, "font-size": 11, fill: css("--muted")}, "pillanatkép-terület");
  arr(75, 70, 75, 166, "5 3");
  arr(285, 70, c.snap === "S7" ? 305 : 80, 166, "2 3");
  if (c.n === 1) { el("text", {x: 100, y: 130, "font-size": 13, fill: css("--hl2")}, "(1) írás érkezik"); }
  if (c.n === 2) { arr(112, 192, 200, 192); el("text", {x: 120, y: 160, "font-size": 13, fill: css("--hl2")}, "(2) olvas B7"); }
  if (c.n === 3) { arr(112, 192, 266, 192); el("text", {x: 150, y: 160, "font-size": 13, fill: css("--hl2")}, "(3) ír S7 + tábla"); }
  if (c.n === 4) el("text", {x: 120, y: 160, "font-size": 13, fill: css("--hl2")}, "(4) felülír B7");
  el("text", {x: 10, y: 268, "font-size": 12.5}, `adat-I/O: ${c.io[0]} olvasás + ${c.io[1]} írás = ${c.io[0] + c.io[1]}; metaadat: ${c.meta}`);
  // ROW
  el("text", {x: 390, y: 20, "font-size": 14, "font-weight": "bold"}, "ROW");
  tab(400, 40, 150, "élő kötet: 7 → " + r.live); tab(570, 40, 170, "pillanatkép: 7 → " + r.snap);
  blk(420, 170, "B7", "régi", r.n === 1.5); blk(530, 170, "B8", null, false); blk(640, 170, "B9", r.b9, r.n === 2);
  arr(470, 70, r.live === "B9" ? 670 : 455, 166, "5 3");
  arr(650, 70, 465, 166, "2 3");
  if (r.n === 1) el("text", {x: 480, y: 130, "font-size": 13, fill: css("--hl2")}, "(1) írás érkezik");
  if (r.n === 1.5) el("text", {x: 480, y: 130, "font-size": 13, fill: css("--hl2")}, "(1b) olvas B7 (részleges)");
  if (r.n === 2) el("text", {x: 560, y: 130, "font-size": 13, fill: css("--hl2")}, "(2) ír B9");
  if (r.n === 3) el("text", {x: 560, y: 130, "font-size": 13, fill: css("--hl2")}, "(3) mutatóváltás");
  el("text", {x: 390, y: 268, "font-size": 12.5}, `adat-I/O: ${r.io[0]} olvasás + ${r.io[1]} írás = ${r.io[0] + r.io[1]}; metaadat: ${r.meta}`);
  el("text", {x: 10, y: 292, "font-size": 10.5, fill: css("--muted")}, "vonalkázott = régi tartalom, teli = új; szaggatott nyíl = élő kötet mutatója, pontozott = pillanatkép mutatója");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
