<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fork – exec – exit – wait</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="bad" type="checkbox" onchange="toggleBad()"> execl hibázik</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal a szülő és a gyermek sávjával, alatta a két folyamat PCB-kártyája; lépésenként fork, execl, exit és waitpid."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">PID-ek szemléltetők; COW = copy-on-write. A 3-as CLOEXEC-leíró és a saját SIGINT-kezelő szemléltető kiegészítés, a 7.3.7 mintaprogramjában nincs ilyen.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "msg": "Kezdet: csak a szülő (PID 1000) fut.", "line": 0, "par": {"pid": 1000, "ppid": 900, "state": "fut", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": null, "hl": []}, {"t": 1, "msg": "t1 fork(): létrejön a gyermek (PID 1001, PPID 1000); a címtér COW-megosztott, az fd-tábla és a jelkezelők másolatok. A szülő a waitpid()-ben blokkol.", "line": 1, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "fut", "aspace": "a szülő képe – COW-megosztott lapok", "fds": "0–2: tty; 3: napló (CLOEXEC) – másolat", "sig": "SIGINT: saját kezelő (örökölt)", "out": ""}, "hl": ["child"]}, {"t": 2, "msg": "t2 execl(\"/bin/ls\", …): a PID 1001 marad, a címtér cserélődik (ls képe), a CLOEXEC-leíró bezárul, az elkapott jelek kezelője SIG_DFL lesz. Az execl nem tér vissza.", "line": 4, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "fut", "aspace": "ls képe (új szöveg, adat, verem)", "fds": "0–2: tty; 3: bezárva (CLOEXEC)", "sig": "SIGINT: SIG_DFL (alapért.)", "out": ""}, "hl": ["aspace", "fds", "sig"]}, {"t": 3, "msg": "t3 exit(0): az ls végzett; a gyermek zombie – a PCB-ből csak a PID, a kilépési státusz (0) és a CPU-idő marad, amíg a szülő be nem gyűjti.", "line": 14, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "zombie", "aspace": "felszabadítva", "fds": "mind bezárva", "sig": "–", "out": "", "exitc": 0}, "hl": ["state"]}, {"t": 4, "msg": "t4 waitpid() visszatér: a zombie PCB-je felszabadul; a szülő WEXITSTATUS = 0 → „gyermek kilépési kódja: 0”.", "line": 11, "par": {"pid": 1000, "ppid": 900, "state": "fut", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": "gyermek kilépési kódja: 0"}, "child": null, "hl": ["par"]}];
const CODE = ["int main(void) {", "    pid_t pid = fork();", "    if (pid < 0) { perror(\"fork\"); return 1; }", "    if (pid == 0) {", "        execl(\"/bin/ls\", \"ls\", \"-l\", \"/tmp\", NULL);", "        perror(\"execl\");      /* csak ha az exec hibázott */", "        _exit(127);", "    }", "    int status;", "    pid_t w = waitpid(pid, &status, 0);", "    if (WIFEXITED(status))", "        printf(\"gyermek kilépési kódja: %d\\n\", WEXITSTATUS(status));", "    return 0;", "}", "/* a gyermek (ls) a main végén: exit(0) */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BAD = [{"t": 0, "msg": "Kezdet: csak a szülő (PID 1000) fut.", "line": 0, "par": {"pid": 1000, "ppid": 900, "state": "fut", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": null, "hl": []}, {"t": 1, "msg": "t1 fork(): létrejön a gyermek (PID 1001, PPID 1000); a címtér COW-megosztott, az fd-tábla és a jelkezelők másolatok. A szülő a waitpid()-ben blokkol.", "line": 1, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "fut", "aspace": "a szülő képe – COW-megosztott lapok", "fds": "0–2: tty; 3: napló (CLOEXEC) – másolat", "sig": "SIGINT: saját kezelő (örökölt)", "out": ""}, "hl": ["child"]}, {"t": 2, "msg": "t2 execl() HIBÁZIK (−1, pl. ENOENT): a gyermek ugyanabban a programban fut tovább, perror(\"execl\") kiírja az okot.", "line": 5, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "fut", "aspace": "a szülő képe – COW-megosztott lapok", "fds": "0–2: tty; 3: napló (CLOEXEC) – másolat", "sig": "SIGINT: saját kezelő (örökölt)", "out": "execl: No such file or directory"}, "hl": ["out"]}, {"t": 3, "msg": "t3 _exit(127): a gyermek zombie, kilépési státusza 127 (a shell-konvenció szerint „a parancs nem futtatható”).", "line": 6, "par": {"pid": 1000, "ppid": 900, "state": "blokkolt (waitpid)", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": ""}, "child": {"pid": 1001, "ppid": 1000, "state": "zombie", "aspace": "felszabadítva", "fds": "mind bezárva", "sig": "–", "out": "execl: No such file or directory", "exitc": 127}, "hl": ["state"]}, {"t": 4, "msg": "t4 waitpid() visszatér: a zombie PCB-je felszabadul; a szülő WEXITSTATUS = 127 → „gyermek kilépési kódja: 127”.", "line": 11, "par": {"pid": 1000, "ppid": 900, "state": "fut", "aspace": "szülőprogram képe", "fds": "0–2: tty; 3: napló (CLOEXEC)", "sig": "SIGINT: saját kezelő", "out": "gyermek kilépési kódja: 127"}, "child": null, "hl": ["par"]}];
const GOOD = STEPS;
function toggleBad(){ setSteps(document.getElementById("bad").checked ? BAD : GOOD); }
const TXS = [60, 190, 320, 450, 560];
function card(x, p, title, hl){
  el("rect", {x, y: 150, width: 285, height: 140, rx: 8, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
  el("text", {x: x + 10, y: 170, "font-size": 13, "font-weight": "bold"}, title);
  if (!p) { el("text", {x: x + 10, y: 200, "font-size": 12, fill: css("--muted")}, "nem létezik / felszabadítva"); return; }
  const rows = [["PID / PPID", p.pid + " / " + p.ppid, "pid"], ["állapot", p.state + (p.exitc !== undefined ? " (status " + p.exitc + ")" : ""), "state"],
                ["címtér", p.aspace, "aspace"], ["fd-tábla", p.fds, "fds"], ["jelkezelők", p.sig, "sig"], ["kimenet", p.out || "–", "out"]];
  rows.forEach((r, i) => {
    const on = hl.includes(r[2]);
    if (on) el("rect", {x: x + 4, y: 178 + i * 18, width: 277, height: 17, fill: css("--cellhl")});
    el("text", {x: x + 10, y: 191 + i * 18, "font-size": 11, fill: css("--muted")}, r[0]);
    el("text", {x: x + 82, y: 191 + i * 18, "font-size": 11, "font-weight": on ? "bold" : "normal"}, r[1]);
  });
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  // idővonal
  const yP = 40, yC = 95, H = 22;
  const box = (a, b, y, kind, lab) => {
    const r = el("rect", {x: a, y: y - H / 2, width: b - a, height: H, fill: kind === "run" ? css("--cellhl") : css("--cell"), stroke: css("--line"),
      "stroke-dasharray": kind === "blk" ? "2 3" : "none"});
    if (kind === "zomb") for (let x = a; x < b; x += 8) el("line", {x1: x, y1: y + H / 2, x2: Math.min(x + 8, b), y2: y - H / 2, stroke: css("--muted")});
    el("text", {x: (a + b) / 2, y: y + 4, "text-anchor": "middle", "font-size": 11}, lab);
  };
  const t = s.t, X = TXS;
  el("text", {x: 4, y: yP - 16, "font-size": 11, "font-weight": "bold"}, "szülő 1000");
  box(10, X[1] > X[t] ? X[t] + 10 : X[1], yP, "run", "fut");
  if (t >= 1) box(X[1], t >= 4 ? X[4] : X[t] + 10, yP, "blk", "waitpid()");
  if (t >= 4) box(X[4], 590, yP, "run", "fut");
  if (t >= 1) {
    el("text", {x: X[1], y: yC - 16, "font-size": 11, "font-weight": "bold"}, "gyermek 1001");
    box(X[1], t >= 2 ? X[2] : X[1] + 30, yC, "run", "COW");
    if (t >= 2) box(X[2], t >= 3 ? X[3] : X[2] + 30, yC, "run", document.getElementById("bad").checked ? "perror" : "ls");
    if (t >= 3) box(X[3], t >= 4 ? X[4] : X[3] + 40, yC, "zomb", "zombie");
  }
  ["t1 fork", "t2 execl", "t3 exit", "t4 waitpid"].forEach((lab, i) => {
    const x = X[i + 1], on = t === i + 1;
    el("line", {x1: x, y1: 20, x2: x, y2: 120, stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": "4 3"});
    el("text", {x, y: 138, "text-anchor": "middle", "font-size": 11, "font-weight": on ? "bold" : "normal"}, lab);
  });
  card(8, s.par, "szülő – PCB", s.hl.includes("par") ? ["state", "out"] : []);
  card(306, s.child, "gyermek – PCB", s.hl.includes("child") ? ["pid", "aspace", "fds", "sig"] : s.hl);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
