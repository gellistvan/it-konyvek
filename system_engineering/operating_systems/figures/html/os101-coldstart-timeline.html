<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A hidegindítás mért intervalluma</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Platform"><button class="tab" data-p="WASM" aria-pressed="true" onclick="pick('WASM')">WASM</button> <button class="tab" data-p="MicroVM" aria-pressed="false" onclick="pick('MicroVM')">MicroVM</button> <button class="tab" data-p="FaaS" aria-pressed="false" onclick="pick('FaaS')">FaaS</button> </span><label>Saját mért fázisidők (ms, az aktuális platform fázisaihoz): <input id="own" type="text" size="18" placeholder="pl. 3 4 1"></label> <button onclick="applyOwn()">Alkalmaz</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három sáv közös t0-val: WASM – wasmtime folyamat, modulbetöltés, main, első stdout-sor = t1; MicroVM – a t0 előtt nem mért VMM- és API-konfiguráció, InstanceStart = t0, vendég kernel, init (READY, nem végpont), handler, első HTTP 200 = t1; FaaS – HTTP-kérés = t0, példány létrehozása, futtatókörnyezet, handler, HTTP 200 = t1."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Nem méretarányos: a könyv nem közöl mért értéket. A saját mérésed fázisidőit beírva a sávok arányosak lesznek (csak a lapon, nem mentődik). A t0/t1 a 26.4.8.2 definíciója.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"plat": "WASM", "ph": 0, "msg": "WASM, 1. fázis (wasmtime folyamat indul): t0: a harness elindítja a wasmtime folyamatot (Popen) – ez a WASM t0-ja.", "harness": "t0 = time.monotonic_ns(); p = subprocess.Popen([\"wasmtime\", \"run\", \"hello_wasi.wasm\", \"teszt\"], …)", "line": -1}, {"plat": "WASM", "ph": 1, "msg": "WASM, 2. fázis (modul betöltés, fordítás): A wasmtime betölti és lefordítja (JIT/AOT) a modult; a mért érték ezt is tartalmazza.", "harness": "(a wasmtime folyamaton belül)", "line": -1}, {"plat": "WASM", "ph": 2, "msg": "WASM, 3. fázis (main (WASI)): A vendégprogram main függvénye fut, és kiírja a „Hello, teszt!” sort.", "harness": "hello_wasi.c: printf(\"Hello, %s!\\n\", …)", "line": -1}, {"plat": "WASM", "ph": 3, "msg": "WASM: első stdout-sor = t1 – a mérés vége (első teljes, érvényes válasz).", "harness": "sor = p.stdout.readline(); t1 = time.monotonic_ns()", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PLAT = {"WASM": {"pre": null, "phases": ["wasmtime\nfolyamat\nindul", "modul\nbetöltés,\nfordítás", "main (WASI)"], "t1": "első stdout-sor = t1", "ready": null}, "MicroVM": {"pre": "VMM + API-konfiguráció\n(boot-source, drives,\nmachine-config,\nnetwork-interfaces)", "phases": ["InstanceStart\n= t0", "vendég\nkernel", "init", "handler"], "t1": "első HTTP 200 = t1", "ready": 2}, "FaaS": {"pre": null, "phases": ["HTTP-kérés\n= t0", "új példány\n(0-ról\nskálázás)", "futtató-\nkörnyezet", "handler"], "t1": "HTTP 200 = t1", "ready": null}}, ALL = {"WASM": [{"plat": "WASM", "ph": 0, "msg": "WASM, 1. fázis (wasmtime folyamat indul): t0: a harness elindítja a wasmtime folyamatot (Popen) – ez a WASM t0-ja.", "harness": "t0 = time.monotonic_ns(); p = subprocess.Popen([\"wasmtime\", \"run\", \"hello_wasi.wasm\", \"teszt\"], …)", "line": -1}, {"plat": "WASM", "ph": 1, "msg": "WASM, 2. fázis (modul betöltés, fordítás): A wasmtime betölti és lefordítja (JIT/AOT) a modult; a mért érték ezt is tartalmazza.", "harness": "(a wasmtime folyamaton belül)", "line": -1}, {"plat": "WASM", "ph": 2, "msg": "WASM, 3. fázis (main (WASI)): A vendégprogram main függvénye fut, és kiírja a „Hello, teszt!” sort.", "harness": "hello_wasi.c: printf(\"Hello, %s!\\n\", …)", "line": -1}, {"plat": "WASM", "ph": 3, "msg": "WASM: első stdout-sor = t1 – a mérés vége (első teljes, érvényes válasz).", "harness": "sor = p.stdout.readline(); t1 = time.monotonic_ns()", "line": -1}], "MicroVM": [{"plat": "MicroVM", "ph": -1, "msg": "MicroVM: A t0 ELŐTT: firecracker --api-sock …, majd PUT /boot-source, /drives/rootfs, /machine-config, /network-interfaces – ez nem része a mért intervallumnak.", "harness": "firecracker --api-sock /tmp/os101-fc.sock --id os101-lab  # + PUT konfigurációs kérések", "line": -1}, {"plat": "MicroVM", "ph": 0, "msg": "MicroVM, 1. fázis (InstanceStart = t0): t0: a harness elküldi az InstanceStart API-kérést.", "harness": "curl -sS --unix-socket /tmp/os101-fc.sock -X PUT http://localhost/actions -d '{\"action_type\": \"InstanceStart\"}'", "line": -1}, {"plat": "MicroVM", "ph": 1, "msg": "MicroVM, 2. fázis (vendég kernel): A vendég kernel bootol a microVM-ben.", "harness": "(vendégoldal)", "line": -1}, {"plat": "MicroVM", "ph": 2, "msg": "MicroVM, 3. fázis (init): Az init elindul; a soros konzolon megjelenik a READY sor – ez NEM végpont.", "harness": "(soros konzol: READY)", "line": -1}, {"plat": "MicroVM", "ph": 3, "msg": "MicroVM, 4. fázis (handler): A rootfs init scriptje elindítja a HTTP-handlert; a kérést a handler szolgálja ki.", "harness": "(vendégoldali HTTP-handler, 172.16.0.2)", "line": -1}, {"plat": "MicroVM", "ph": 4, "msg": "MicroVM: első HTTP 200 = t1 – a mérés vége (első teljes, érvényes válasz).", "harness": "(harness) az első 200-as HTTP-válasz a várt törzzsel → t1", "line": -1}], "FaaS": [{"plat": "FaaS", "ph": 0, "msg": "FaaS, 1. fázis (HTTP-kérés = t0): t0: a harness elküldi a hidegindítást kiváltó HTTP-kérést (a függvény nullára skálázva).", "harness": "(harness) HTTP-kérés elküldése → t0", "line": -1}, {"plat": "FaaS", "ph": 1, "msg": "FaaS, 2. fázis (új példány (0-ról skálázás)): A platform új példányt (konténert/podot) hoz létre.", "harness": "(platform)", "line": -1}, {"plat": "FaaS", "ph": 2, "msg": "FaaS, 3. fázis (futtató- környezet): A nyelvi futtatókörnyezet és a függvénykód betöltődik.", "harness": "(platform)", "line": -1}, {"plat": "FaaS", "ph": 3, "msg": "FaaS, 4. fázis (handler): A handler kiszolgálja a kérést.", "harness": "(függvénykód)", "line": -1}, {"plat": "FaaS", "ph": 4, "msg": "FaaS: HTTP 200 = t1 – a mérés vége (első teljes, érvényes válasz).", "harness": "(harness) az első 200-as válasz megérkezése → t1", "line": -1}]};
const ORDER = ["WASM", "MicroVM", "FaaS"]; const OWN = {};
function pick(p){ document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p ? "true" : "false")); setSteps(ALL[p]); }
function applyOwn(){
  const p = STEPS[0].plat, raw = document.getElementById("own").value.trim();
  if (!raw){ delete OWN[p]; show(k); return; }
  const v = raw.split(/[;\s]+/).map(x => parseFloat(x.replace(",", "."))).filter(x => isFinite(x) && x >= 0);
  if (v.length !== PLAT[p].phases.length){ document.getElementById("status").textContent = p + ": " + PLAT[p].phases.length + " értéket adj meg (ms, szóközzel vagy pontosvesszővel elválasztva)."; return; }
  OWN[p] = v; show(k);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), hl2 = css("--hl2"), X0 = 220, WMAX = 420;
  el("line", {x1: X0, x2: X0, y1: 22, y2: 300, stroke: line, "stroke-width": 1.5, "stroke-dasharray": "5 4"});
  el("text", {x: X0, y: 15, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "közös t0");
  ORDER.forEach((p, r) => {
    const d = PLAT[p], y = 40 + r * 90, act = p === s.plat, n = d.phases.length;
    const own = OWN[p], tot = own ? own.reduce((a, b) => a + b, 0) || 1 : n;
    const ws = d.phases.map((_, i) => own ? own[i] / tot * WMAX : WMAX / n);
    el("text", {x: 8, y: y + 26, "font-size": 13, "font-weight": act ? "bold" : "normal", fill: act ? hl : css("--fg")}, p + (own ? " (saját mérés)" : ""));
    if (d.pre){
      const on = act && s.ph === -1;
      el("rect", {x: X0 - 120, y, width: 116, height: 40, fill: cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1, "stroke-dasharray": "5 3"});
      el("text", {x: X0 - 62, y: y + 17, "text-anchor": "middle", "font-size": 11}, "nem mért:");
      el("text", {x: X0 - 62, y: y + 31, "text-anchor": "middle", "font-size": 11}, "VMM + API-konfig.");
    }
    let x = X0;
    d.phases.forEach((lab, i) => {
      const on = act && s.ph === i, done = act && s.ph > i;
      el("rect", {x, y, width: ws[i], height: 40, fill: on ? css("--cellhl") : (done || !act ? "#c8c8c8" : cell), stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
      const parts = lab.split("\n");
      parts.forEach((t, j) => el("text", {x: x + ws[i] / 2, y: y + 24 + (j - (parts.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": ws[i] < 80 ? 9.5 : 11, fill: "#000"}, t));
      if (own) el("text", {x: x + ws[i] / 2, y: y + 54, "text-anchor": "middle", "font-size": 10, fill: mut}, own[i] + " ms");
      x += ws[i];
      if (d.ready === i){
        el("circle", {cx: x, cy: y - 8, r: 6, fill: cell, stroke: hl2, "stroke-width": 2});
        el("text", {x: x + 10, y: y - 4, "font-size": 11, fill: hl2}, "READY – nem végpont");
      }
    });
    const on = act && s.ph === n;
    el("line", {x1: x, x2: x, y1: y - 4, y2: y + 44, stroke: on ? hl : line, "stroke-width": on ? 5 : 3});
    el("text", {x: x + 6, y: y + 25, "font-size": 11.5, "font-weight": "bold"}, d.t1);
  });
  el("text", {x: 10, y: 312, "font-size": 11.5}, "Mérőharness-sor: " + (s.harness || ""));
  el("text", {x: 10, y: 327, "font-size": 10.5, fill: mut}, OWN[s.plat] ? "a sávhosszak a beírt értékekkel arányosak" : "nem méretarányos – a könyv nem közöl mért értéket");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
