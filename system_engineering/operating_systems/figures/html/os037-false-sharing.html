<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamis megosztás és MESI</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="pad" onchange="pick()"> padding (külön vonal)</label> <label><input type="checkbox" id="smt" onchange="pick()"> SMT-testvérszálak (közös L1)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két mag L1 gyorsítótára egy 64 bájtos vonallal; felváltott írásoknál a vonal M és I állapot között pattog, az átadásszámláló nő; paddinggel vagy SMT-testvéreken nem."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített kétmagos MESI-modell, 6 felváltott írás (Core 0: counter_a, Core 1: counter_b). Szemléltetés, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a vonal(ak) csak a memóriában; minden L1-másolat I (Invalid).", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "I"}}, "xfer": 0, "w": null, "moved": false, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "1. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "2. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 1)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 1, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "3. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO: a vonal átkerül Core 1 → Core 0 (vonalátadás: 2)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 2, "w": ["Core 0", "a"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "4. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 3)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 3, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "5. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO: a vonal átkerül Core 1 → Core 0 (vonalátadás: 4)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 4, "w": ["Core 0", "a"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "6. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 5)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 5, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"00": [{"msg": "Kezdet: a vonal(ak) csak a memóriában; minden L1-másolat I (Invalid).", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "I"}}, "xfer": 0, "w": null, "moved": false, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "1. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "2. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 1)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 1, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "3. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO: a vonal átkerül Core 1 → Core 0 (vonalátadás: 2)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 2, "w": ["Core 0", "a"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "4. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 3)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 3, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "5. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO: a vonal átkerül Core 1 → Core 0 (vonalátadás: 4)", "line": -1, "state": {"Core 0": {"0": "M"}, "Core 1": {"0": "I"}}, "xfer": 4, "w": ["Core 0", "a"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}, {"msg": "6. írás: Core 1 (counter_b, offset 8, 0. vonal): RFO: a vonal átkerül Core 0 → Core 1 (vonalátadás: 5)", "line": -1, "state": {"Core 0": {"0": "I"}, "Core 1": {"0": "M"}}, "xfer": 5, "w": ["Core 1", "b"], "moved": true, "pad": false, "smt": false, "lines": ["0"]}], "01": [{"msg": "Kezdet: a vonal(ak) csak a memóriában; minden L1-másolat I (Invalid).", "line": -1, "state": {"L1 (közös)": {"0": "I"}}, "xfer": 0, "w": null, "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "1. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "2. írás: Core 1 (szál 1, counter_b, offset 8, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "3. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "4. írás: Core 1 (szál 1, counter_b, offset 8, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "5. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}, {"msg": "6. írás: Core 1 (szál 1, counter_b, offset 8, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": false, "smt": true, "lines": ["0"]}], "10": [{"msg": "Kezdet: a vonal(ak) csak a memóriában; minden L1-másolat I (Invalid).", "line": -1, "state": {"Core 0": {"0": "I", "1": "I"}, "Core 1": {"0": "I", "1": "I"}}, "xfer": 0, "w": null, "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "1. írás: Core 0 (counter_a, offset 0, 0. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "I"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "2. írás: Core 1 (counter_b, offset 64, 1. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "3. írás: Core 0 (counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "4. írás: Core 1 (counter_b, offset 64, 1. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "5. írás: Core 0 (counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}, {"msg": "6. írás: Core 1 (counter_b, offset 64, 1. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"Core 0": {"0": "M", "1": "I"}, "Core 1": {"0": "I", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": false, "lines": ["0", "1"]}], "11": [{"msg": "Kezdet: a vonal(ak) csak a memóriában; minden L1-másolat I (Invalid).", "line": -1, "state": {"L1 (közös)": {"0": "I", "1": "I"}}, "xfer": 0, "w": null, "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "1. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "I"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "2. írás: Core 1 (szál 1, counter_b, offset 64, 1. vonal): RFO a memóriából (első írás, nem magok közötti átadás)", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "3. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "4. írás: Core 1 (szál 1, counter_b, offset 64, 1. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "5. írás: Core 0 (szál 0, counter_a, offset 0, 0. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "M"}}, "xfer": 0, "w": ["Core 0", "a"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}, {"msg": "6. írás: Core 1 (szál 1, counter_b, offset 64, 1. vonal): saját M-másolat – nincs busztranzakció", "line": -1, "state": {"L1 (közös)": {"0": "M", "1": "M"}}, "xfer": 0, "w": ["Core 1", "b"], "moved": false, "pad": true, "smt": true, "lines": ["0", "1"]}]};
function render(s){
  svg.innerHTML = "";
  el("text", {x: 20, y: 24, "font-size": 13}, s.pad ? "paddinggel: counter_a @0 (0. vonal), counter_b @64 (1. vonal)" : "padding nélkül: counter_a @0, counter_b @8 – egy 64 B vonal");
  const caches = Object.keys(s.state);
  caches.forEach((c, i) => {
    const x = caches.length === 1 ? 190 : 60 + i * 280, y = 60;
    el("rect", {x, y, width: 180, height: 150, rx: 8, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: x + 90, y: y + 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, s.smt ? "egy mag, 2 SMT-szál – közös L1" : c + " L1");
    s.lines.forEach((ln, j) => {
      const st = s.state[c][ln], yy = y + 40 + j * 52, M = st === "M";
      el("rect", {x: x + 20, y: yy, width: 140, height: 40, fill: M ? "#222" : css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
      el("text", {x: x + 90, y: yy + 26, "text-anchor": "middle", "font-size": 15, fill: M ? "#fff" : css("--fg")}, `${ln}. vonal: ${st}`);
    });
  });
  if (s.moved) {
    const toRight = s.w[0] === "Core 1";
    const y = 120, x1 = toRight ? 245 : 335, x2 = toRight ? 335 : 245;
    el("line", {x1, y1: y, x2: x2 + (toRight ? -10 : 10), y2: y, stroke: css("--hl2"), "stroke-width": 5});
    el("polygon", {points: toRight ? `${x2},${y} ${x2-14},${y-9} ${x2-14},${y+9}` : `${x2},${y} ${x2+14},${y-9} ${x2+14},${y+9}`, fill: css("--hl2")});
    el("text", {x: 290, y: y - 16, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "RFO");
  }
  if (s.w) el("text", {x: 20, y: 240, "font-size": 14}, `író: ${s.w[0]}${s.smt ? " (SMT-szál)" : ""} → counter_${s.w[1]}++`);
  el("text", {x: 20, y: 266, "font-size": 16, "font-weight": "bold"}, "vonalátadás: " + s.xfer);
  el("text", {x: 20, y: 290, "font-size": 11, fill: css("--muted")}, "M = tömör fekete (módosított, kizárólagos) · I = üres (érvénytelen) · egyszerűsített MESI, szemléltetés");
}
function pick(){ const p = document.getElementById("pad").checked ? 1 : 0, s = document.getElementById("smt").checked ? 1 : 0; setSteps(ALL["" + p + s]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
