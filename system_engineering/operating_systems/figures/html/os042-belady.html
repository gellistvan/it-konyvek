<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bélády-anomália: FIFO, LRU, Clock</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Algoritmus: <select id="alg" onchange="load()" aria-label="Algoritmus"><option value="FIFO">FIFO</option><option value="LRU">LRU</option><option value="CLOCK">Clock</option></select></label><label>m = <select id="mm" onchange="load()" aria-label="Keretszám (m és m+1 összevetése)"><option>2</option><option selected>3</option><option>4</option><option>5</option></select> és m+1</label><label>Sorozat: <input id="seq" size="26" value="1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5" aria-label="Saját laphivatkozási sorozat"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két sáv: ugyanaz az algoritmus m és m+1 kerettel az R_B sorozaton; laphiba sraffozott cellával, alul a részhalmaz-reláció lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

function simulate(alg, R, m){
  const frames = Array(m).fill(-1), ref = Array(m).fill(false), last = Array(m).fill(-1), load = Array(m).fill(-1);

    let ev = null, slot, clr = [];
    if (found === -1) {
      faults++; let victim;
      if (used < m) { victim = used; used++; }
      else if (alg === "FIFO") { victim = fifoNext; fifoNext = (fifoNext + 1) % m; }
      else if (alg === "LRU") { victim = 0; for (let i = 1; i < m; i++) if (last[i] < last[victim]) victim = i; }
      else { while (ref[hand]) { ref[hand] = false; clr.push(hand); hand = (hand + 1) % m; } victim = hand; hand = (victim + 1) % m; }
      if (frames[victim] !== -1) ev = frames[victim];
      frames[victim] = page; ref[victim] = true; last[victim] = t; load[victim] = t; slot = victim;
    } else { slot = found; if (alg === "LRU") last[found] = t; if (alg === "CLOCK") ref[found] = true; }
    let idx = []; for (let i = 0; i < m; i++) if (frames[i] !== -1) idx.push(i);
    if (alg === "FIFO") idx.sort((a, b) => load[a] - load[b]);
    else if (alg === "LRU") idx.sort((a, b) => last[b] - last[a]);
    const cells = idx.map(i => ({t: alg === "CLOCK" ? frames[i] + "/" + (ref[i] ? 1 : 0) : String(frames[i]),
                                  "new": found === -1 && i === slot, hand: alg === "CLOCK" && i === hand}));
    out.push({page, fault: found === -1, ev, faults, cells, set: frames.filter(f => f !== -1).sort((a, b) => a - b), clr});
  });
  return out;
}

function band(rows, m, y0, n, cw, x0, label){

  rows.forEach((s, t) => {

      const c = s.cells[r], nw = c && c["new"], x = x0 + t * cw, y = y0 + r * ch;

      if (c) {

        el("text", {x: x + cw/2, y: y + ch/2 + 5, "text-anchor": "middle", "font-size": 13}, c.t);
        if (c.hand) el("text", {x: x + 2, y: y + ch/2 + 4, "font-size": 10}, "▶");
      }
    }
    if (s.ev !== null) { el("text", {x: x0 + t * cw + cw/2, y: y0 + m * ch + 15, "text-anchor": "middle", "font-size": 12, "text-decoration": "line-through"}, String(s.ev)); }
  });
  el("text", {x: x0 + n * cw + 8, y: y0 + m * ch / 2 + 5, "font-size": 14, "font-weight": "bold"}, "Σ " + rows[rows.length - 1].faults);

}

  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
