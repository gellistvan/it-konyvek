<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy virtio-blk olvasási kérés életútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>egyidejű kérések <input type="range" id="nreq" min="1" max="4" value="1" style="min-width:90px;flex:0"> <b id="nreqv">1</b></label> <label>hibainjektálás <select id="errsel"><option value="nincs">nincs</option><option value="-ETIMEDOUT">-ETIMEDOUT (átmeneti)</option><option value="-EIO">-EIO (végzetes)</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A folyamatok, a blk_queue, a vreq-pool, a nyolcelemes descriptor-tábla, az avail és a used ring, valamint az eszköz állapota lépésenként: submit, descriptor-foglalás, avail, kick, az eszköz feldolgoz, used, IRQ, ISR, completion, ébredés. Három egyidejű kérésnél a harmadik vár, mert nincs 3 szabad descriptor."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus modell a 29.2.2–29.2.4 kódja alapján: egy virtqueue, queue-size = 8, indirekt descriptor nélkül (legfeljebb 2 kérés úton), x86 koherens DMA. A -ETIMEDOUT ágon a driver a hibát átmenetiként adja tovább (vö. T-O12-011), és a vreq a retry végéig él.</p>

const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {

    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });

function render(s){
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const on = key => s.hl.includes(key);
  // folyamatok
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "folyamatok");
  Object.keys(s.proc).forEach((p, i) => { const st = s.proc[p];
    el("rect", {x: 10, y: 26 + i * 34, width: 130, height: 28, rx: 5, fill: st === "alszik" ? cellhl : cell, stroke: on("proc") ? hl : line, "stroke-width": on("proc") ? 2.5 : 1});
    el("text", {x: 75, y: 45 + i * 34, "text-anchor": "middle", "font-size": 12}, p + ": " + st); });
  // blk_queue
  el("text", {x: 160, y: 18, "font-size": 13, "font-weight": "bold"}, "blk_queue (vár)");
  el("rect", {x: 160, y: 26, width: 150, height: 40, fill: cell, stroke: on("queue") ? hl : line, "stroke-width": on("queue") ? 2.5 : 1, "stroke-dasharray": "6 3"});
  el("text", {x: 235, y: 51, "text-anchor": "middle", "font-size": 12.5}, s.waitq.length ? s.waitq.join(" → ") : "üres");
  // vreq-ek
  el("text", {x: 160, y: 92, "font-size": 13, "font-weight": "bold"}, "vreq (pool)");
  Object.keys(s.vreq).forEach((r, i) => { const live = s.vreq[r] === "él";
    el("rect", {x: 160 + (i % 2) * 76, y: 100 + Math.floor(i / 2) * 30, width: 70, height: 24, fill: live ? cellhl : cell, stroke: line, "stroke-width": live ? 2.5 : 1, "stroke-dasharray": "6 3"});
    el("text", {x: 195 + (i % 2) * 76, y: 117 + Math.floor(i / 2) * 30, "text-anchor": "middle", "font-size": 11.5}, r + ": " + s.vreq[r]); });
  el("text", {x: 160, y: 176, "font-size": 11, fill: mut}, "retries = " + s.retries);
  // descriptor-tábla
  el("text", {x: 330, y: 18, "font-size": 13, "font-weight": "bold"}, "descriptor-tábla (queue-size = 8)");
  s.desc.forEach((d, i) => { const y = 26 + i * 25;
    el("rect", {x: 330, y, width: 200, height: 22, fill: d ? cellhl : cell, stroke: on("desc") && d ? hl : line, "stroke-width": on("desc") && d ? 2 : 0.8, "stroke-dasharray": "2 2"});
    el("text", {x: 338, y: y + 16, "font-size": 11.5}, i + ": " + (d ? d[0] + " " + d[1] + (d[1] === "hdr" ? " 16 B R" : d[1] === "buf" ? " 4096 B W" : " 1 B W") : "szabad")); });
  // avail / used
  el("text", {x: 550, y: 18, "font-size": 13, "font-weight": "bold"}, "avail ring");
  el("rect", {x: 550, y: 26, width: 200, height: 30, fill: cell, stroke: on("avail") ? hl : line, "stroke-width": on("avail") ? 2.5 : 1, "stroke-dasharray": "2 2"});
  el("text", {x: 560, y: 46, "font-size": 12.5}, s.avail.length ? "[" + s.avail.join(", ") + "]" : "[]");
  el("text", {x: 550, y: 80, "font-size": 13, "font-weight": "bold"}, "used ring");
  el("rect", {x: 550, y: 88, width: 200, height: 30, fill: cell, stroke: on("used") ? hl : line, "stroke-width": on("used") ? 2.5 : 1, "stroke-dasharray": "2 2"});
  el("text", {x: 560, y: 108, "font-size": 12.5}, s.used.length ? s.used.map(u => "{id " + u.id + ", len " + u.len + "}").join(" ") : "[]");
  // eszköz
  el("text", {x: 550, y: 142, "font-size": 13, "font-weight": "bold"}, "eszköz (virtio-blk)");
  el("rect", {x: 550, y: 150, width: 200, height: 36, rx: 6, fill: s.dev === "IRQ" ? cellhl : cell, stroke: on("dev") ? hl2 : line, "stroke-width": on("dev") ? 3 : 1, "stroke-dasharray": "1 3"});
  el("text", {x: 650, y: 173, "text-anchor": "middle", "font-size": 13}, s.dev === "IRQ" ? "IRQ ↯" : s.dev);
  el("text", {x: 550, y: 230, "font-size": 11, fill: mut}, "keret: folytonos = folyamat,");
  el("text", {x: 550, y: 246, "font-size": 11, fill: mut}, "szaggatott = driver, pontozott = eszköz");
  el("text", {x: 550, y: 262, "font-size": 11, fill: mut}, "x86: koherens DMA; sematikus");
}
function pick(){ const n = document.getElementById("nreq").value, e = document.getElementById("errsel").value;
  document.getElementById("nreqv").textContent = n; setSteps(ALL[n + "|" + e]); }
document.getElementById("nreq").addEventListener("input", pick);
document.getElementById("errsel").addEventListener("change", pick);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
