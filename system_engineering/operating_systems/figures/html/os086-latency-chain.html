<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A késleltetési lánc mérési pontjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>T_mask <input type="range" id="lm" min="0" max="400" step="2" value="0"> <b id="lmv"></b></label> <label>T_ISR <input type="range" id="li" min="5" max="300" step="1" value="20"> <b id="liv"></b></label> <label>L_sched <input type="range" id="ls" min="20" max="400" step="2" value="50"> <b id="lsv"></b></label> <label>P <input type="range" id="lp" min="0" max="500" step="10" value="100"> <b id="lpv"></b></label> <label><input type="checkbox" id="llow"> alacsonyabb prioritású feladat</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Időtengely ciklusban: L_int 12, T_ISR 20, L_sched 50, C_wall 500 ciklus, benne 100 ciklusos preempció; R_wall = 582 ciklus, a határidő D = 1000 ciklus."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltételes becslés (23.1.11, 50 MHz Cortex-M3), nem mérés. L_int = 12 hardveres ciklus + T_mask; C_wall = 400 ciklus saját munka + P. Az „alacsonyabb prioritású feladat” kapcsoló szemléltetésként 300 ciklusnyi hátralévő megszakított futást ad az L_sched-hez.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BASE = {"hw": 12, "cbase": 400, "D": 1000, "block": 300};
function hu(x, n){ return x.toFixed(n).replace(".", ","); }
function V(id){ return +document.getElementById(id).value; }
function params(){
  const tm = V("lm"), ti = V("li"), ls = V("ls"), pp = V("lp"), low = document.getElementById("llow").checked;
  ["lm", "li", "ls", "lp"].forEach(id => document.getElementById(id + "v").textContent = V(id));
  const lint = BASE.hw + tm, lsched = ls + (low ? BASE.block : 0), cw = BASE.cbase + pp;
  const pts = [0, lint, lint + ti, lint + ti + lsched, lint + ti + lsched + cw];
  return {tm, ti, ls, pp, low, lint, lsched, cw, pts, R: pts[4]};
}
function computeSteps(){
  const p = params(), N = ["t_event", "t_ISR_entry", "t_ISR_exit", "t_task_entry", "t_task_exit"];
  const desc = ["az esemény (pl. időzítő-túlcsordulás)", "az ISR első utasítása: L_int = " + p.lint + " ciklus (12 hardveres + T_mask = " + p.tm + ")",
    "az ISR vége: T_ISR = " + p.ti + " ciklus", "a feladat első utasítása: L_sched = " + p.lsched + " ciklus" + (p.low ? " (alacsonyabb prioritás: +" + BASE.block + " ciklus a megszakított kód befejezéséig)" : ""),
    "a feladat vége: C_wall = " + p.cw + " ciklus (benne P = " + p.pp + ")"];
  return N.map((n, i) => Object.assign({}, p, {upto: i, line: -1,
    msg: n + " = " + p.pts[i] + " ciklus (" + hu(p.pts[i] / 50, 2) + " µs): " + desc[i] + (i === 4 ? ". R_wall = " + p.lint + " + " + p.ti + " + " + p.lsched + " + " + p.cw + " = " + p.R + " ciklus " + (p.R <= BASE.D ? "≤ D = " + BASE.D + ": teljesül." : "> D = " + BASE.D + ": NEM teljesül!") : ".")}));
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 250"); svg.innerHTML = "";
  if (!s.pts) return;
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const xmax = Math.max(1100, s.R + 100), X = c => 20 + c / xmax * 720, y0 = 110, h = 50;
  const defs = el("defs", {});
  const pat = (id, d) => { const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", id); p.setAttribute("width", 8); p.setAttribute("height", 8); p.setAttribute("patternUnits", "userSpaceOnUse");
    const a = document.createElementNS(NS, "path"); a.setAttribute("d", d); a.setAttribute("stroke", line); a.setAttribute("stroke-width", 1); a.setAttribute("fill", "none"); p.appendChild(a); defs.appendChild(p); };
  pat("pd", "M2,2 h0.1 M6,6 h0.1"); pat("pf", "M-1,9 L9,-1"); pat("px", "M-1,9 L9,-1 M-1,-1 L9,9"); pat("pp", "M4,0 V8 M0,4 H8");
  const fills = ["url(#pd)", "url(#pf)", "url(#px)", cell], nm = ["L_int", "T_ISR", "L_sched", "C_wall"];
  for (let i = 0; i < 4; i++) { const on = s.upto === i + 1;
    el("rect", {x: X(s.pts[i]), y: y0, width: Math.max(1, X(s.pts[i + 1]) - X(s.pts[i])), height: h, fill: fills[i], stroke: on ? hl2 : line, "stroke-width": on ? 3 : 1}); }
  const pa = s.pts[3] + 200 * s.cw / (BASE.cbase + 100);
  el("rect", {x: X(pa), y: y0, width: X(pa + s.pp) - X(pa), height: h, fill: "url(#pp)", stroke: line});
  if (s.pp > 0) el("text", {x: X(pa + s.pp / 2), y: y0 + 30, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 4}, "P");
  el("text", {x: X((s.pts[3] + s.pts[4]) / 2) + 60, y: y0 + 30, "text-anchor": "middle", "font-size": 12}, "C_wall = " + s.cw);
  s.pts.forEach((t, i) => { if (i > s.upto) return; el("line", {x1: X(t), y1: y0 - 8, x2: X(t), y2: y0 + h + 6, stroke: i === s.upto ? hl : line, "stroke-width": i === s.upto ? 2.5 : 1, "stroke-dasharray": "4 3"}); });
  const names = ["t_event", "t_ISR_entry", "t_ISR_exit", "t_task_entry", "t_task_exit"];
  el("text", {x: X(s.pts[s.upto]) + 4, y: y0 - 12, "font-size": 12, "font-weight": "bold", fill: hl}, names[s.upto] + " = " + s.pts[s.upto]);
  el("text", {x: 20, y: y0 + h + 22, "font-size": 11.5}, "eleje (nagyítva a felirat): L_int = " + s.lint + ", T_ISR = " + s.ti + ", L_sched = " + s.lsched + " ciklus");
  el("line", {x1: X(BASE.D), y1: 40, x2: X(BASE.D), y2: y0 + h + 6, stroke: line, "stroke-width": 4});
  el("text", {x: X(BASE.D) - 4, y: 52, "text-anchor": "end", "font-size": 12}, "D = " + BASE.D);
  if (s.upto === 4) { const ok = s.R <= BASE.D;
    el("line", {x1: X(0), y1: 78, x2: X(s.R), y2: 78, stroke: ok ? hl : hl2, "stroke-width": 3});
    el("text", {x: X(s.R / 2), y: 72, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: ok ? hl : hl2}, "R_wall = " + s.R + " ciklus " + (ok ? "≤ D" : "> D !")); }
  for (let c = 0; c <= xmax; c += 100) { el("line", {x1: X(c), y1: 200, x2: X(c), y2: 205, stroke: line});
    el("text", {x: X(c), y: 218, "text-anchor": "middle", "font-size": 10.5}, String(c)); if (c % 200 === 0) el("text", {x: X(c), y: 234, "text-anchor": "middle", "font-size": 10, fill: mut}, hu(c / 50, 0) + " µs"); }
  el("line", {x1: X(0), y1: 200, x2: X(xmax), y2: 200, stroke: line});
  el("text", {x: 740, y: 248, "text-anchor": "end", "font-size": 10.5, fill: mut}, "ciklus (felül) / µs 50 MHz-en (alul)");
}
STEPS = computeSteps();
["lm", "li", "ls", "lp"].forEach(id => document.getElementById(id).addEventListener("input", () => { const kk = k; setSteps(computeSteps()); show(kk); }));
document.getElementById("llow").addEventListener("change", () => { const kk = k; setSteps(computeSteps()); show(kk); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
