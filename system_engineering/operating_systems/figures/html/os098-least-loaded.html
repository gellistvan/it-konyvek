<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Least loaded ütemezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sorrend: <select id="mode" onchange="build()" aria-label="Folyamatsorrend"><option value="fifo" selected>beérkezési sorrend</option><option value="lpt">LPT (csökkenő CPU-idő)</option><option value="own">saját lista</option></select></label> <label>Saját CPU-idők: <input id="own" value="300, 500, 200, 700" size="22" onchange="build()" aria-label="Saját CPU-idők vesszővel"></label> <label>Csomópontok: <input id="nn" type="number" min="1" max="6" value="3" style="width:3.5em" onchange="build()" aria-label="Csomópontszám"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Gantt-diagram három csomóponttal: beérkezési sorrendben node0 P1 0–300, node1 P2 0–500, node2 P3 0–200 és P4 200–900, makespan 900, átlag 475; LPT-sorrendben node0 P4 0–700, node1 P2 0–500, node2 P1 0–300 és P3 300–500, makespan 700, átlag 500."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor cluster_sim.py kódjával azonos szabály (nodes.index(min(nodes)), döntetlennél a kisebb index). Offline modell: minden folyamat t = 0-kor kész, azonos sebességű csomópontok. A saját listában legfeljebb 12 folyamat és 6 csomópont adható meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"pid": 1, "c": 300, "before": [0, 0, 0], "node": 0, "after": [300, 0, 0], "line": 1, "k": 0, "segs": [[0, 0, 300, 1]], "mode": "fifo", "msg": "P1 (C = 300): nodes = [0, 0, 0] → min(nodes) = 0, index = 0 → node0; nodes = [300, 0, 0]"}, {"pid": 2, "c": 500, "before": [300, 0, 0], "node": 1, "after": [300, 500, 0], "line": 1, "k": 1, "segs": [[0, 0, 300, 1], [1, 0, 500, 2]], "mode": "fifo", "msg": "P2 (C = 500): nodes = [300, 0, 0] → min(nodes) = 0, index = 1 → node1; nodes = [300, 500, 0]"}, {"pid": 3, "c": 200, "before": [300, 500, 0], "node": 2, "after": [300, 500, 200], "line": 1, "k": 2, "segs": [[0, 0, 300, 1], [1, 0, 500, 2], [2, 0, 200, 3]], "mode": "fifo", "msg": "P3 (C = 200): nodes = [300, 500, 0] → min(nodes) = 0, index = 2 → node2; nodes = [300, 500, 200]"}, {"pid": 4, "c": 700, "before": [300, 500, 200], "node": 2, "after": [300, 500, 900], "line": 1, "k": 3, "segs": [[0, 0, 300, 1], [1, 0, 500, 2], [2, 0, 200, 3], [2, 200, 900, 4]], "mode": "fifo", "msg": "P4 (C = 700): nodes = [300, 500, 200] → min(nodes) = 200, index = 2 → node2; nodes = [300, 500, 900]"}, {"line": 6, "k": 4, "segs": [[0, 0, 300, 1], [1, 0, 500, 2], [2, 0, 200, 3], [2, 200, 900, 4]], "before": [300, 500, 900], "after": [300, 500, 900], "node": -1, "mode": "fifo", "msg": "Kész: makespan = max(nodes) = 900, átlagos befejezési idő = 475,0"}];
const CODE = ["for pid, cpu_time in processes:", "    node = nodes.index(min(nodes))      # a legkevésbé terhelt, döntetlennél a kisebb index", "    nodes[node] += cpu_time", "    completion_times.append(nodes[node])", "    print(f\"P{pid} -> node{node}, terheles: {nodes[node]}\")", "", "makespan = max(nodes)", "avg_completion = sum(completion_times) / len(completion_times)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function ll(procs, n){
  const nodes = new Array(n).fill(0), comp = [], segs = [], st = [];
  procs.forEach(p => { const before = nodes.slice(), m = Math.min(...nodes), node = nodes.indexOf(m);
    segs.push([node, nodes[node], nodes[node] + p[1], p[0]]); nodes[node] += p[1]; comp.push(nodes[node]);
    st.push({pid: p[0], c: p[1], before: before, node: node, after: nodes.slice()}); });
  return {nodes: nodes, segs: segs, steps: st, makespan: Math.max(...nodes), avg: comp.reduce((a, b) => a + b, 0) / comp.length};
}
const f1 = x => x.toFixed(1).replace(".", ",");
const lst = a => "[" + a.join(", ") + "]";
function build(){
  const mode = document.getElementById("mode").value;
  let procs, n = 3;
  if (mode === "own"){
    const raw = document.getElementById("own").value.split(/[ ,;]+/).map(Number).filter(x => x > 0 && isFinite(x)).slice(0, 12);
    n = Math.max(1, Math.min(6, +document.getElementById("nn").value || 3));
    procs = raw.map((c, i) => [i + 1, Math.round(c)]);
    if (!procs.length) procs = [[1, 300], [2, 500], [3, 200], [4, 700]];
  } else {
    procs = [[1, 300], [2, 500], [3, 200], [4, 700]];
    if (mode === "lpt") procs.sort((a, b) => b[1] - a[1]);
  }
  const R = ll(procs, n), out = [];
  R.steps.forEach((s, i) => out.push(Object.assign({}, s, {line: 1, k: i, segs: R.segs.slice(0, i + 1), n: n,
    msg: `P${s.pid} (C = ${s.c}): nodes = ${lst(s.before)} → min(nodes) = ${Math.min(...s.before)}, index = ${s.node} → node${s.node}; nodes = ${lst(s.after)}`})));
  out.push({line: 6, k: R.steps.length, segs: R.segs, before: R.nodes, after: R.nodes, node: -1, n: n,
            msg: `Kész: makespan = max(nodes) = ${R.makespan}, átlagos befejezési idő = ${f1(R.avg)}`});
  setSteps(out);
}
function render(s){
  svg.innerHTML = ""; const n = s.n || 3;
  svg.setAttribute("viewBox", `0 0 760 ${120 + n * 44}`);
  const segs = s.segs, fin = Math.max(...STEPS[STEPS.length - 1].after), tick = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000].find(v => fin / v <= 10) || 5000,
        tmax = Math.ceil(fin / tick) * tick, X0 = 80, W = 640, Xt = t => X0 + t * W / tmax;
  const pats = ["", "4 2", "1 2", "8 3"];
  for (let i = 0; i < n; i++){
    const y = 20 + i * 44, on = s.node === i;
    el("text", {x: X0 - 8, y: y + 22, "text-anchor": "end", "font-size": 13, "font-weight": on ? "bold" : "normal"}, "node" + i);
    el("line", {x1: X0, y1: y + 36, x2: X0 + W, y2: y + 36, stroke: css("--muted"), "stroke-width": 0.5});
    const load = s.after[i] !== undefined ? s.after[i] : 0;
    el("text", {x: X0 + W + 6, y: y + 22, "font-size": 12}, String(load));
  }
  segs.forEach((g, j) => { const y = 20 + g[0] * 44, last = j === segs.length - 1 && s.node >= 0;
    el("rect", {x: Xt(g[1]), y: y + 4, width: Xt(g[2]) - Xt(g[1]), height: 30, fill: g[3] === 4 ? css("--cellhl") : css("--cell"),
                stroke: last ? css("--hl") : css("--line"), "stroke-width": last ? 3 : 1.2, "stroke-dasharray": pats[(g[3] - 1) % 4]});
    el("text", {x: (Xt(g[1]) + Xt(g[2])) / 2, y: y + 24, "text-anchor": "middle", "font-size": 12}, `P${g[3]} (${g[2] - g[1]})`); });
  const yb = 20 + n * 44;
  for (let t = 0; t <= tmax; t += tick) el("text", {x: Xt(t), y: yb + 14, "text-anchor": "middle", "font-size": 11}, String(t));
  if (s.node < 0){
    const mk = Math.max(...s.after);
    el("line", {x1: Xt(mk), y1: 14, x2: Xt(mk), y2: yb + 2, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"});
    el("text", {x: Xt(mk) - 4, y: yb + 34, "text-anchor": "end", "font-size": 12, fill: css("--hl2")}, "makespan " + mk);
  }
  el("text", {x: X0, y: yb + 52, "font-size": 12}, "nodes = " + lst(s.after) + (s.node >= 0 ? `   (választás: min(${lst(s.before)}) → node${s.node})` : ""));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
