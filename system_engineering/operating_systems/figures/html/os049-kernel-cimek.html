<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernelallokátorok és címfogalmak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="api('kmalloc')"><code>kmalloc</code></button><button onclick="api('vmalloc')"><code>vmalloc</code></button><button onclick="api('alloc_pages')"><code>alloc_pages</code></button><button onclick="api('dma_alloc_coherent')"><code>dma_alloc_coherent</code></button><button onclick="api('dma_map_single')"><code>dma_map_single</code></button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Közvetlen leképezés, vmalloc-tartomány és eszköz-címtér; a kiválasztott API útvonala a fizikai lapkeretekig, DMA-nál az IOMMU-n át."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus ábra, illusztratív címekkel (x86-64 közvetlen leképezés: virt = phys + 0xffff888000000000; a DMA-címek kitaláltak). A táblázatsor a 13.4.5 döntési táblázatából.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"api": null, "line": -1, "msg": "Válasszon API-t (gombok) vagy lépjen végig: a kiválasztott útvonal és a visszaadott címtípus kiemelve."}, {"api": "kmalloc", "line": -1, "msg": "kmalloc: visszaad void * (CPU-virtuális, közvetlen leképezés); virt_to_phys(p) = 0x12345000 ✓; DMA-cím: nincs (dma_map_single kell). Táblázat: Néhány bájt–néhány KiB, gyakori alloc/free → kmalloc / kzalloc vagy saját slab cache (gyors, fizikailag összefüggő)"}, {"api": "vmalloc", "line": -1, "msg": "vmalloc: visszaad void * (CPU-virtuális, vmalloc-tartomány); virt_to_phys ✗ (nem közvetlen leképezés); vmalloc_to_page ✓; DMA ✗: nem folytonos, nincs dma_addr_t. Táblázat: Nagy összefüggő logikai puffer, nem DMA → vmalloc (virtuálisan összefüggő, nagyobb méretben is jó)"}, {"api": "alloc_pages", "line": -1, "msg": "alloc_pages: visszaad struct page * (+ page_address → CPU-virtuális); fizikailag folytonos (order-1 buddy-blokk) ✓; DMA-cím: nincs (dma_map_page kell). Táblázat: Nagy, fizikailag összefüggő, nem DMA → alloc_pages magasabb order-rel (nincs eszközoldali DMA-cím)"}, {"api": "dma_alloc_coherent", "line": -1, "msg": "dma_alloc_coherent: visszaad void * (CPU) + dma_addr_t (eszköz) = 0xfff00000; két különböző cím: a CPU-virtuális cím és a dma_addr_t nem azonos ✓. Táblázat: DMA-puffer, a CPU és az eszköz is használja (coherent) → dma_alloc_coherent() / dma_free_coherent() (CPU-virtuális címet és eszköz-DMA-címet ad; a kettő nem azonos)"}, {"api": "dma_map_single", "line": -1, "msg": "dma_map_single: visszaad dma_addr_t (eszköz) = 0xfff01000; a kmalloc pufferből dma_addr_t ✓; unmap + dma_sync_* a hozzáféréskor. Táblázat: DMA-puffer, streaming → dma_map_single() / dma_unmap_single() (a CPU-virtuális címből DMA-címet készít; szükség esetén dma_sync_*)"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"BOX": {"km": [0.3, 6.2, 1.6, 1.0, "kmalloc\npuffer\n0xffff8880\n12345000"], "ap": [2.0, 6.2, 1.6, 1.0, "alloc_pages\n(order 1) +\npage_address"], "dc_cpu": [3.7, 6.2, 1.6, 1.0, "dma_alloc_\ncoherent:\nCPU-cím\n(void *)"], "vm": [5.75, 6.55, 2.6, 0.65, "vmalloc: 4 lap,\nvirtuálisan folytonos"], "v0": [5.75, 5.7, 0.6, 0.55, "v0"], "v1": [6.42, 5.7, 0.6, 0.55, "v1"], "v2": [7.09, 5.7, 0.6, 0.55, "v2"], "v3": [7.76, 5.7, 0.6, 0.55, "v3"], "dc_dma": [8.75, 6.2, 1.5, 1.0, "dma_addr_t\n(coherent)\n0xfff00000"], "ms_dma": [10.35, 6.2, 1.5, 1.0, "dma_addr_t\n(map_single)\n0xfff01000"], "iommu": [9.0, 3.6, 2.6, 0.8, "IOMMU"]}, "FRAMES": {"1": "km", "2": "ap", "3": "ap", "5": "dc", "9": "vm", "7": "vm", "13": "vm", "11": "vm"}, "PATHS": {"kmalloc": {"arrows": [["km", 1, "v"]], "checks": ["virt_to_phys(p) = 0x12345000 ✓", "DMA-cím: nincs (dma_map_single kell)"], "ret": "void * (CPU-virtuális, közvetlen leképezés)"}, "vmalloc": {"arrows": [["v0", 9, "v"], ["v1", 7, "v"], ["v2", 13, "v"], ["v3", 11, "v"]], "checks": ["virt_to_phys ✗ (nem közvetlen leképezés)", "vmalloc_to_page ✓", "DMA ✗: nem folytonos, nincs dma_addr_t"], "ret": "void * (CPU-virtuális, vmalloc-tartomány)"}, "alloc_pages": {"arrows": [["ap", 2, "v"], ["ap", 3, "v"]], "checks": ["fizikailag folytonos (order-1 buddy-blokk) ✓", "DMA-cím: nincs (dma_map_page kell)"], "ret": "struct page * (+ page_address → CPU-virtuális)"}, "dma_alloc_coherent": {"arrows": [["dc_cpu", 5, "v"], ["dc_dma", "iommu", "d"], ["iommu", 5, "d"]], "checks": ["két különböző cím: a CPU-virtuális cím és a dma_addr_t nem azonos ✓"], "ret": "void * (CPU) + dma_addr_t (eszköz) = 0xfff00000"}, "dma_map_single": {"arrows": [["km", 1, "v"], ["ms_dma", "iommu", "d"], ["iommu", 1, "d"]], "checks": ["a kmalloc pufferből dma_addr_t ✓", "unmap + dma_sync_* a hozzáféréskor"], "ret": "dma_addr_t (eszköz) = 0xfff01000"}}, "BUDDY": [[0, 2, "order 1"], [2, 4, "order 1 (alloc_pages)"], [4, 8, "order 2"], [8, 16, "order 3"]], "NF": 16, "FW": 0.72, "FX0": 0.3};
const S = 50, Y = y => (8.0 - y) * S;
function fxx(i){ return (G.FX0 + i * G.FW) * S; }
function render(s){
  svg.setAttribute("viewBox", "0 0 600 450"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--line")}"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--hl2")}"/></marker>`;
  const P = s.api ? G.PATHS[s.api] : null, used = new Set();
  if (P) P.arrows.forEach(([a, b]) => { used.add(String(a)); used.add(String(b)); });
  [[0.2, 5.25, "(a) közvetlen leképezés"], [5.6, 2.9, "(b) vmalloc"], [8.65, 3.3, "(c) eszköz címtere"]].forEach(([x0, w, t]) => {
    el("rect", {x: x0 * S, y: Y(7.45), width: w * S, height: 1.9 * S, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 4"});
    el("text", {x: (x0 + w / 2) * S, y: Y(7.55), "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, t); });
  for (const k in G.BOX) { const [x, y, w, h, t] = G.BOX[k], on = used.has(k);
    el("rect", {x: x * S, y: Y(y + h), width: w * S, height: h * S, rx: 4, fill: k === "iommu" ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1, opacity: P && !on ? 0.45 : 1});
    t.split("\n").forEach((ln, i, arr) => el("text", {x: (x + w / 2) * S, y: Y(y + h / 2) + 4 + (i - (arr.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 11, opacity: P && !on ? 0.45 : 1}, ln)); }
  el("text", {x: 15, y: Y(2.3), "font-size": 12, fill: css("--muted")}, "fizikai lapkeretek (buddy order-blokkok)");
  for (let i = 0; i < G.NF; i++) { const r = G.FRAMES[String(i)], on = used.has(String(i));
    el("rect", {x: fxx(i), y: Y(1.75), width: G.FW * S, height: 0.5 * S, fill: r ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 0.8, opacity: P && r && !on ? 0.4 : 1});
    if (r) el("text", {x: fxx(i) + G.FW * S / 2, y: Y(1.5) + 4, "text-anchor": "middle", "font-size": 10}, {km: "slab", ap: "pg", dc: "coh", vm: "vm"}[r]); }
  G.BUDDY.forEach(([a, b, lab]) => { el("line", {x1: fxx(a) + 2, x2: fxx(b) - 2, y1: Y(1.05), y2: Y(1.05), stroke: css("--line")});
    el("text", {x: (fxx(a) + fxx(b)) / 2, y: Y(0.72), "text-anchor": "middle", "font-size": 9.5, fill: css("--muted")}, lab); });
  if (P) {
    P.arrows.forEach(([a, b, st]) => {
      const A = typeof a === "number" ? [fxx(a) + G.FW * S / 2, Y(1.75)] : [(G.BOX[a][0] + G.BOX[a][2] / 2) * S, Y(G.BOX[a][1])];
      const B = typeof b === "number" ? [fxx(b) + G.FW * S / 2, Y(1.75)] : [(G.BOX[b][0] + G.BOX[b][2] / 2) * S, Y(G.BOX[b][1] + G.BOX[b][3])];
      el("line", {x1: A[0], y1: A[1], x2: B[0], y2: B[1], stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": st === "d" ? "10 4 2 4" : "", "marker-end": "url(#ah2)"}); });
    el("text", {x: 15, y: 386, "font-size": 13, "font-weight": "bold"}, "visszaad: " + P.ret);
    P.checks.forEach((c, i) => el("text", {x: 15, y: 405 + i * 16, "font-size": 12}, c));
  } else el("text", {x: 15, y: 395, "font-size": 13, fill: css("--muted")}, "folytonos = CPU-virtuális leképezés · pont-vonal = DMA-cím (IOMMU) · illusztratív címek");
}
function api(name){ const i = STEPS.findIndex(s => s.api === name); stop(); show(i); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
