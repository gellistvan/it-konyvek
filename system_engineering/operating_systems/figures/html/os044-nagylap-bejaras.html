<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 KiB és 2 MiB lap bejárása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Cím: 0x<input id="va" size="14" value="7F3A12345678" aria-label="Virtuális cím hexadecimálisan"></label><label>Lapméret: <select id="ps" onchange="load()" aria-label="Lapméret"><option value="4K">4 KiB</option><option value="2M">2 MiB</option><option value="1G">1 GiB</option></select></label><label>TLB: <span id="ev">512</span> <input id="ent" type="range" min="8" max="2048" step="8" value="512" oninput="load()" aria-label="TLB-bejegyzések száma"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 48 bites virtuális cím 9 bites mezői és az offset; alatta a CR3-ból induló PGD, PUD, PMD, PTE lánc, nagy lapnál a PMD (PS = 1) közvetlenül a keretre mutat; alul a TLB-lefedettség."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">x86-64, négyszintű laptábla (12.3.2); a cím illusztratív. A 32 bejegyzéses, 2 MiB-os eset (az önellenőrző kérdés (c) pontja) a csúszkán 32-re állítva: 64 MiB.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"va": "7F3A12345678", "ps": "4K", "lv": -1, "line": 0, "msg": "Cím 0x7F3A12345678 felbontása: PGD = 254, PUD = 232, PMD = 145, PTE = 325, offset = 0x678 (12 bit)"}, {"va": "7F3A12345678", "ps": "4K", "lv": 0, "line": 3, "msg": "1. szint: PGD[254] → a következő tábla címe"}, {"va": "7F3A12345678", "ps": "4K", "lv": 1, "line": 3, "msg": "2. szint: PUD[232] → a következő tábla címe"}, {"va": "7F3A12345678", "ps": "4K", "lv": 2, "line": 3, "msg": "3. szint: PMD[145] → a következő tábla címe"}, {"va": "7F3A12345678", "ps": "4K", "lv": 3, "line": 4, "msg": "4. szint: PTE[325] – levél: 4 KiB-os keret"}, {"va": "7F3A12345678", "ps": "4K", "lv": 4, "line": 5, "msg": "Kész: 4 szint bejárva; fizikai cím = keret + 0x678."}];
const CODE = ["idx[0..] = a cím 9 bites mezői (47–39, 38–30, 29–21, 20–12)", "tabla = CR3", "for szint in PGD, PUD, PMD, PTE:", "    bejegyzes = tabla[idx[szint]]          // 1 memóriahozzáférés", "    if bejegyzes.PS == 1 or szint == PTE:", "        return bejegyzes.keret + offset    // levél: 1 GiB / 2 MiB / 4 KiB", "    tabla = bejegyzes.kovetkezo_tabla"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LV = ["PGD", "PUD", "PMD", "PTE"], SZ = {"4K": [12, 4, 4096, "4 KiB"], "2M": [21, 3, 2097152, "2 MiB"], "1G": [30, 2, 1073741824, "1 GiB"]};
function hum(b){ for (const [u, v] of [["TiB", 2**40], ["GiB", 2**30], ["MiB", 2**20], ["KiB", 1024]]) if (b >= v) { const x = b / v; return (Number.isInteger(x) ? String(x) : x.toFixed(1).replace(".", ",")) + " " + u; } return b + " B"; }
function flds(vaHex, ps){ const va = BigInt("0x" + vaHex), [ob, n] = SZ[ps];
  const idx = []; for (let i = 0; i < n; i++) idx.push(Number((va >> BigInt(39 - 9 * i)) & 511n));
  return [idx, (va & ((1n << BigInt(ob)) - 1n)).toString(16).toUpperCase(), ob, n]; }
function walk(vaHex, ps){
  const [idx, off, ob, n] = flds(vaHex, ps);
  const st = [{va: vaHex, ps, lv: -1, line: 0, msg: `Cím 0x${vaHex} felbontása: ` + idx.map((v, i) => `${LV[i]} = ${v}`).join(", ") + `, offset = 0x${off} (${ob} bit)`}];
  for (let i = 0; i < n; i++) { const leaf = i === n - 1;
    st.push({va: vaHex, ps, lv: i, line: leaf ? 4 : 3, msg: `${i + 1}. szint: ${LV[i]}[${idx[i]}]` + (leaf ? ` – levél${ps !== "4K" ? " (PS = 1)" : ""}: ${SZ[ps][3]}-os keret` : " → a következő tábla címe")}); }
  st.push({va: vaHex, ps, lv: n, line: 5, msg: `Kész: ${n} szint bejárva; fizikai cím = keret + 0x${off}.`});
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--line")}"/></marker>`;
  const [idx, off, ob, n] = flds(s.va, s.ps), sc = 540 / 48; let x = 30;
  el("text", {x: 30, y: 22, "font-size": 13}, `virtuális cím: 0x${s.va}  ·  lapméret: ${SZ[s.ps][3]}`);
  for (let i = 0; i < n; i++) { const on = s.lv === i;
    el("rect", {x, y: 50, width: 9 * sc, height: 32, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: x + 4.5 * sc, y: 44, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, LV[i] + " · 9 bit");
    el("text", {x: x + 4.5 * sc, y: 72, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, String(idx[i])); x += 9 * sc; }
  el("rect", {x, y: 50, width: ob * sc, height: 32, fill: css("--cell"), stroke: css("--line"), "stroke-width": s.lv === n ? 3 : 1});
  el("text", {x: x + ob * sc / 2, y: 44, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, `offset · ${ob} bit`);
  el("text", {x: x + ob * sc / 2, y: 72, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "0x" + off);
  const xs = [70, 190, 310, 430], y = 140;
  el("text", {x: 10, y: y + 5, "font-size": 13, "font-weight": "bold"}, "CR3");
  el("line", {x1: 45, y1: y, x2: xs[0] - 2, y2: y, stroke: css("--line"), "stroke-width": 1.5, "marker-end": "url(#ah)"});
  for (let i = 0; i < 4; i++) { const used = i < n, done = s.lv >= i && used, on = s.lv === i;
    el("rect", {x: xs[i], y: y - 24, width: 96, height: 48, rx: 6, fill: done ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : (used ? css("--line") : css("--muted")),
                "stroke-width": on ? 4 : (used ? 1.6 : 1), "stroke-dasharray": used ? "" : "5 4"});
    el("text", {x: xs[i] + 48, y: y + (used && i === n - 1 && s.ps !== "4K" ? -2 : 5), "text-anchor": "middle", "font-size": 14, fill: used ? css("--fg") : css("--muted"), "text-decoration": used ? "none" : "line-through"}, used ? `${LV[i]}[${idx[i]}]` : LV[i]);
    if (used && i === n - 1 && s.ps !== "4K") el("text", {x: xs[i] + 48, y: y + 16, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "PS = 1");
    if (i > 0 && used) el("line", {x1: xs[i-1] + 96, y1: y, x2: xs[i] - 2, y2: y, stroke: css("--line"), "stroke-width": 1.5, "marker-end": "url(#ah)"}); }
  const lx = xs[n - 1] + 48, fw = s.ps === "4K" ? 90 : (s.ps === "2M" ? 200 : 300), fx = Math.min(Math.max(lx - fw / 2, 10), 590 - fw);
  el("line", {x1: lx, y1: y + 26, x2: lx, y2: 208, stroke: css("--line"), "stroke-width": s.lv >= n - 1 ? 2.5 : 1, "marker-end": "url(#ah)"});
  el("rect", {x: fx, y: 210, width: fw, height: 40, fill: s.lv === n ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
  el("text", {x: fx + fw/2, y: 235, "text-anchor": "middle", "font-size": 13}, `${SZ[s.ps][3]}-os keret (+ offset)`);
  const e = +document.getElementById("ent").value, r = e * SZ[s.ps][2];
  el("text", {x: 30, y: 285, "font-size": 14}, `TLB: ${e} bejegyzés × ${SZ[s.ps][3]} = ${hum(r)} lefedettség`);
  el("text", {x: 30, y: 308, "font-size": 12, fill: css("--muted")}, `bejárt szintek TLB-miss esetén: ${n}`);
}
function load(){
  let v = document.getElementById("va").value.trim().replace(/^0x/i, "").replace(/[_\s]/g, "").toUpperCase();
  const err = document.getElementById("err");
  if (!/^[0-9A-F]{1,12}$/.test(v)) { err.textContent = "Legfeljebb 12 hexadecimális jegyet (48 bites cím) adjon meg."; return; }
  err.textContent = ""; v = v.padStart(12, "0");
  document.getElementById("ev").textContent = document.getElementById("ent").value;
  const keep = k; setSteps(walk(v, document.getElementById("ps").value)); show(Math.min(keep, STEPS.length - 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
