<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS Data Protection és fotóhozzáférés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Eszközállapot: <select id="dev" onchange="recomp()" aria-label="Eszközállapot"><option value="bfu">újraindítás után zárolt</option><option value="unl" selected>feloldott</option><option value="afu">feloldás után újra zárolt</option></select></label> <label>TCC photos: <select id="tcc" onchange="recomp()" aria-label="TCC-állapot"><option value="0">0 notDetermined</option><option value="2">2 denied</option><option value="3" selected>3 authorized</option><option value="4">4 limited</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalt a kulcslánc: a Secure Enclave UID-kulcsa és a jelkódból levezetett kulcs csomagolja a Class A, C és D osztálykulcsot, az osztálykulcs a fájlkulcsot, a fájlkulcs titkosítja a tartalmat. Jobb oldalt egy fotóolvasás ellenőrzései: kódaláírás, sandbox és XPC, TCC, photolibraryd, Data Protection."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Vázlat az Apple Platform Security leírása alapján; a pontos időzítések és a Photos-adatbázis védelmi osztálya verziófüggők (itt példaként Class C). Újraindítás után zárolt állapotban csak a Class D érhető el; feloldás után újra zárolva a Class C igen, a Class A nem.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "ok": true, "msg": "1. Kódaláírás: az app kódlapjai érvényesek (a kernel ellenőrzi) – továbblép.", "line": 0}, {"n": 1, "ok": true, "msg": "2. Sandbox: a Photos-adatbázis nincs az app konténerében – közvetlen fájlelérés tiltott, kérés XPC-n a photolibraryd felé.", "line": 1}, {"n": 2, "ok": true, "msg": "3. TCC: authorized (3): engedélyezve – továbblép.", "line": 2}, {"n": 3, "ok": true, "msg": "4. A photolibraryd olvassa az adatbázist / a fájlt.", "line": 3}, {"n": 4, "ok": true, "msg": "5. Data Protection: a Class C kulcs elérhető → a fájlkulcs kicsomagolható, az olvasás sikeres ✓.", "line": 4}];
const CODE = ["kódaláírás: a kernel (AMFI) érvényesíti a kódlapokat", "sandbox: Photos-adatbázis a konténeren kívül → XPC: photolibraryd", "TCC: PHPhotoLibrary.authorizationStatus(for: .readWrite)  // 0, 2, 3, 4", "photolibraryd: az adatbázis / fájl olvasása", "Data Protection: fájlkulcs kicsomagolása a Class C osztálykulccsal (SE)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ST = {"bfu": "újraindítás után zárolt", "unl": "feloldott", "afu": "feloldás után újra zárolt"}, TCCN = {"0": "notDetermined (0): prompt, a felhasználó dönt", "2": "denied (2): elutasítva", "3": "authorized (3): engedélyezve", "4": "limited (4): csak a kiválasztott elemek"};
function availJ(s){ return {A: s === "unl", C: s === "unl" || s === "afu", D: true}; }
function pathJ(s, t){
  const st = [{n: 0, ok: true, msg: "1. Kódaláírás: az app kódlapjai érvényesek (a kernel ellenőrzi) – továbblép."},
              {n: 1, ok: true, msg: "2. Sandbox: a Photos-adatbázis nincs az app konténerében – közvetlen fájlelérés tiltott, kérés XPC-n a photolibraryd felé."}];
  const ok = t === 3 || t === 4;
  st.push({n: 2, ok: ok, msg: "3. TCC: " + TCCN[t] + (ok ? " – továbblép." : " – az út itt megáll ✗.")});
  if (!ok) return st;
  st.push({n: 3, ok: true, msg: "4. A photolibraryd olvassa az adatbázist / a fájlt" + (t === 4 ? " (csak a kiválasztott elemeket)." : ".")});
  const a = availJ(s).C;
  st.push({n: 4, ok: a, msg: "5. Data Protection: a Class C kulcs " + (a ? "elérhető → a fájlkulcs kicsomagolható, az olvasás sikeres ✓." : "nem érhető el (újraindítás utáni első feloldás előtt) ✗.")});
  return st;
}
function cur(){ return {s: document.getElementById("dev").value, t: +document.getElementById("tcc").value}; }
function recomp(){ const c = cur(); setSteps(pathJ(c.s, c.t).map(x => Object.assign(x, {line: x.n}))); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 380");
  const c = cur(), av = availJ(c.s);
  el("rect", {x: 10, y: 10, width: 330, height: 78, rx: 10, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 175, y: 28, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Secure Enclave");
  el("text", {x: 95, y: 60, "text-anchor": "middle", "font-size": 12}, "UID-kulcs");
  el("text", {x: 255, y: 60, "text-anchor": "middle", "font-size": 12}, "jelkód-kulcs" + (c.s === "unl" ? " (feloldva)" : ""));
  [["A", "Complete", 60], ["C", "UntilFirstUserAuth", 175], ["D", "None", 290]].forEach(x => {
    const on = av[x[0]];
    el("line", {x1: x[0] === "D" ? 95 : 255, y1: 88, x2: x[2], y2: 120, stroke: css("--muted"), "stroke-dasharray": x[0] === "D" ? "5 3" : "none"});
    el("rect", {x: x[2] - 55, y: 120, width: 110, height: 44, rx: 6, fill: on ? css("--cell") : css("--cellhl"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": on ? "none" : "4 3"});
    el("text", {x: x[2], y: 138, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "Class " + x[0] + (on ? " ✓" : " ✗"));
    el("text", {x: x[2], y: 155, "text-anchor": "middle", "font-size": 10}, x[1]);
  });
  el("line", {x1: 175, y1: 164, x2: 175, y2: 190, stroke: css("--muted")});
  el("rect", {x: 85, y: 190, width: 180, height: 30, rx: 5, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 175, y: 210, "text-anchor": "middle", "font-size": 11}, "becsomagolt fájlkulcs (Class C)");
  el("line", {x1: 175, y1: 220, x2: 175, y2: 244, stroke: css("--muted")});
  el("rect", {x: 85, y: 244, width: 180, height: 30, rx: 5, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 175, y: 264, "text-anchor": "middle", "font-size": 11}, "fájltartalom: AES-XTS");
  el("text", {x: 10, y: 300, "font-size": 12}, "Eszközállapot: " + ST[c.s]);
  el("text", {x: 10, y: 318, "font-size": 11, fill: css("--muted")}, "Class A: zárolás után kb. 10 s-mal eldobva (tipikus, verziófüggő)");
  const names = ["kódaláírás", "sandbox → XPC", "TCC", "photolibraryd", "Data Protection (Class C)"];
  names.forEach((nm, i) => {
    const y = 20 + i * 66, reached = i <= k && i < STEPS.length, step = STEPS[i], bad = reached && step && !step.ok;
    el("rect", {x: 420, y: y, width: 220, height: 42, rx: i === 3 ? 8 : 2, fill: reached ? (bad ? css("--cellhl") : css("--cell")) : css("--bg"),
                stroke: i === k ? css("--hl") : css("--line"), "stroke-width": i === k ? 3 : 1, "stroke-dasharray": reached ? "none" : "4 3"});
    el("text", {x: 530, y: y + 26, "text-anchor": "middle", "font-size": 13}, nm);
    if (reached && step) el("text", {x: 650, y: y + 27, "font-size": 18, fill: step.ok ? css("--fg") : css("--hl2")}, step.ok ? "✓" : "✗");
    if (i < 4) el("line", {x1: 530, y1: y + 42, x2: 530, y2: y + 66, stroke: css("--muted"), "stroke-width": 1.5});
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
