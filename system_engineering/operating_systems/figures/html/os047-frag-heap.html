<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragmentációs labor heaptérképe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Stratégia: <select id="st" onchange="load()" aria-label="Stratégia"><option value="first">first fit</option><option value="best">best fit</option><option value="worst">worst fit</option></select></label><label>K = <input id="kk" type="number" min="1" max="32000" value="2500" size="7" aria-label="Utolsó kérés mérete bájtban"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 32 768 bájtos heap sávként: tíz foglalás, öt felszabadítás, majd a K kérés a választott stratégiával."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 13.2.7 frag_sim.c hű átirata (8 bájtos igazítás, 32 bájtos fejléc, MIN_SPLIT = 8); a kezdő lépéssor a first fit. Az állapotsor a program kimenetének sorait követi (F = 1 − S_max / szabad összes).</p>
<script>

let STEPS = [{"kind": "alloc", "lab": "A", "req": 3000, "hit": 0, "blocks": [[0, 3000, false, "A"], [3032, 29704, true, ""]], "st": {"n": 1, "tot": 29704, "mx": 29704, "internal": 32, "F": 0.0}, "strat": "first", "line": -1, "msg": "1. lépés: alloc A = 3000 · szabad blokkok: 1, szabad kapacitás: 29704 bájt, legnagyobb: 29704 bájt, belső fragm.: 32 bájt, F = 0,0000"}, {"kind": "alloc", "lab": "B", "req": 3400, "hit": 3032, "blocks": [[0, 3000, false, "A"], [3032, 3400, false, "B"], [6464, 26272, true, ""]], "st": {"n": 1, "tot": 26272, "mx": 26272, "internal": 64, "F": 0.0}, "strat": "first", "line": -1, "msg": "2. lépés: alloc B = 3400 · szabad blokkok: 1, szabad kapacitás: 26272 bájt, legnagyobb: 26272 bájt, belső fragm.: 64 bájt, F = 0,0000"}, {"kind": "alloc", "lab": "C", "req": 2800, "hit": 6464, "blocks": [[0, 3000, false, "A"], [3032, 3400, false, "B"], [6464, 2800, false, "C"], [9296, 23440, true, ""]], "st": {"n": 1, "tot": 23440, "mx": 23440, "internal": 96, "F": 0.0}, "strat": "first", "line": -1, "msg": "3. lépés: alloc C = 2800 · szabad blokkok: 1, szabad kapacitás: 23440 bájt, legnagyobb: 23440 bájt, belső fragm.: 96 bájt, F = 0,0000"}, {"kind": "alloc", "lab": "D", "req": 3800, "hit": 9296, "blocks": [[0, 3000, false, "A"], [3032, 3400, false, "B"], [6464, 2800, false, "C"], [9296, 3800, false, "D"], [13128, 19608, true, ""]], "st": {"n": 1, "tot": 19608, "mx": 19608, "internal": 128, "F": 0.0}, "strat": "first", "line": -1, "msg": "4. lépés: alloc D = 3800 · szabad blokkok: 1, szabad kapacitás: 19608 bájt, legnagyobb: 19608 bájt, belső fragm.: 128 bájt, F = 0,0000"}, {"kind": "alloc", "lab": "E", "req": 3200, "hit": 13128, "blocks": [[0, 3000, false, "A"], [3032, 3400, false, "B"], [6464, 2800, false, "C"], [9296, 3800, false, "D"], [13128, 3200, false, "E"], [16360, 16376, true, ""]], "st": {"n": 1, "tot": 16376, "mx": 16376, "internal": 160, "F": 0.0}, "strat": "first", "line": -1, "msg": "5. lépés: alloc E = 3200 · szabad blokkok: 1, szabad kapacit "mx": 3648, "internal": 288, "F": 0.0}, "strat": "first", "line": -1, "msg": "9. lépés: alloc I = 4000 · szabad blokkok: 1, szabad kapacitás: 3648 bájt, legnagyobb: 3648 bájt, belső fragm.: 288 bájt, F = 0,0000"}, {"kind": "alloc", "lab": "J", "req": 3648, "hit": 29088, "blocks": [[0, 3000, false, "A"], [3032, 3400, false, "B"], [6464, 2800, false, "C"], [9296, 3800, false, "D"], [13128, 3200, false, "E"], [16360, 2600, false, "F"], [18992, 3600, false, "G"], [22624, 2400, false, "H"], [25056, 4000, false, "I"], [29088, 3648, false, "J"]], "st": {"n": 0, "tot": 0, "mx": 0, "internal": 320, "F": null}, "strat": "first", "line": -1, "msg": "10. lépés: alloc J = 3648 · szabad blokkok: 0, szabad kapacitás: 0 bájt, legnagyobb: 0 bájt, belső fragm.: 320 bájt, F = nincs szabad memória"}, {"kind": "free", "lab": "B", "req": null, "hit": 3032, "blocks": [[0, 3000, false, "A"], [3032, 3400, true, "B"], [6464, 2800, false, "C"], [9296, 3800, false, "D"], [13128, 3200, false, "E"], [16360, 2600, false, "F"], [18992, 3600, false, "G"], [22624, 2400, false, "H"], [25056, 4000, false, "I"], [29088, 3648, false, "J"]], "st": {"n": 1, "tot": 3400, "mx": 3400, "internal": 288, "F": 0.0}, "strat": "first", "line": -1, "msg": "11. lépés: free(B) · szabad blokkok: 1, szabad kapacitás: 3400 bájt, legnagyobb: 3400 bájt, belső fragm.: 288 bájt, F = 0,0000"}, {"kind": "free", "lab": "D", "req": null, "hit": 9296, "blocks": [[0, 3000, false, "A"], [3032, 3400, true, "B"], [6464, 2800, false, "C"], [9296, 3800, true, "D"], [13128, 3200, false, "E"], [16360, 2600, false, "F"], [18992, 3600, false, "G"], [22624, 2400, false, "H"], [25056, 4000, false, "I"], [29088, 3648, false, "J"]], "st": {"n": 2, "tot": 7200, "mx": 3800, "internal": 256, "F": 0.4722222222222222}, "strat": "first", "line": -1, "msg": "12. lépés: free(D) · szabad blokkok: 2, szabad kapacitás: 7200 bájt, legnagyobb: 3800 bájt, belső fragm.: 256 bájt, F = 0,4722"}, {"kind": "free", "lab": "F", "req": null, "hit": 16360, "blocks": [[0, 3000, false, "A"], [3032, 3400, true, "B"], [6464, 2800, false, "C"], [9296, 3800, true, "D"], [13128, 3200, false, "E"], [16360, 2600, true, "F"], [18992, 3600, false, "G"], [22624, 2400, false, "H"], [25056, 4000, false, "I"], [29088, 3648, false, "J"]], "st": {"n": 3, "tot": 9800, "mx": 3800, "internal": 224, "F": 0.6122448979591837}, "strat": "first", "line": -1, "msg": "13. lépés: free(F) · szabad blokkok: 3, szabad kapacitás: 9800 bájt, legnagyobb: 3800 bájt, belső fragm.: 224 bájt, F = 0,6122"}, {"kind": "free", "lab": "H", "req": null, "hit": 22624, "blocks": [[0, 3000, false, "A"], [3032, 3400, true, "B"], [6464, 2800, false, "C"], [9296, 3800, true, "D"], [13128, 3200, false, "E"], [16360, 2600, true, "F"], [18992, 3600, false, "G"], [22624, 2400, true, "H"], [25056, 4000, false, "I"], [29088, 3648, false, "J"]], "st": {"n": 4, "tot": 12200, "mx": 3800, "internal": 192, "F": 0.6885245901639344}, "strat": "first", "line": -1, "msg": "14. lépés: free(H) · szabad blokkok: 4, szabad kapacitás: 12200 bájt, legnagyobb: 3800 bájt, belső fragm.: 192 bájt, F = 0,6885"}, {"kind": "free", "lab": "J", "req": null, "hit": 29088, "blocks": [[0, 3000, false, "A"], [3032, 3400, true, "B"], [6464, 2800, false, "C"], [9296, 3800, true, "D"], [13128, 3200, false, "E"], [16360, 2600, true, "F"], [18992, 3600, false, "G"], [22624, 2400, true, "H"], [25056, 4000, false, "I"], [29088, 3648, true, "J"]], "st": {"n": 5, "tot": 15848, "mx": 3800, "internal": 160, "F": 0.7602221100454316}, "strat": "first", "line": -1, "msg": "15. lépés: free(J) · szabad blokkok: 5, szabad kapacitás: 15848 bájt, legnagyobb: 3800 bájt, belső fragm.: 160 bájt, F = 0,7602"}, {"kind": "alloc", "lab": "K", "req": 2500, "hit": 3032, "blocks": [[0, 3000, false, "A"], [3032, 2504, false, "K"], [5568, 864, true, ""], [6464, 2800, false, "C"], [9296, 3800, true, "D"], [13128, 3200, false, "E"], [16360, 2600, true, "F"], [18992, 3600, false, "G"], [22624, 2400, true, "H"], [25056, 4000, false, "I"], [29088, 3648, true, "J"]], "st": {"n": 5, "tot": 13312, "mx": 3800, "internal": 196, "F": 0.7145432692307693}, "strat": "first", "line": -1, "msg": "16. lépés: K = 2500 (igazítva 2504) – first fit → offset 3032 · szabad blokkok: 5, szabad kapacitás: 13312 bájt, legnagyobb: 3800 bájt, belső fragm.: 196 bájt, F = 0,7145"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const HEAP = 32768, HDR = 32, MIN_SPLIT = 8, REQ = [3000, 3400, 2800, 3800, 3200, 2600, 3600, 2400, 4000, 3648], FREES = [1, 3, 5, 7, 9], LAB = "ABCDEFGHIJ";
function fragRun(strat, k){
  const blocks = [{off: 0, size: HEAP - HDR, free: true, lab: ""}], allocs = [], out = [];
  const au = n => (n + 7) & ~7;
  const find = need => { let best = null; for (const b of blocks) if (b.free && b.size >= need) { if (strat === "first") return b;
      if (!best || (strat === "best" ? b.size < best.size : b.size > best.size)) best = b; } return best; };
  const alloc = (req, lab) => { const need = au(req), b = find(need); if (!b) return null; const rem = b.size - need;
    if (rem >= HDR + MIN_SPLIT) { blocks.splice(blocks.indexOf(b) + 1, 0, {off: b.off + HDR + need, size: rem - HDR, free: true, lab: ""}); b.size = need; }
    b.free = false; b.lab = lab; allocs.push([b, req, true]); return b; };
  const rel = idx => { const a = allocs[idx], b = a[0]; a[2] = false; b.free = true; const i = blocks.indexOf(b);
    if (i + 1 < blocks.length && blocks[i + 1].free) b.size += HDR + blocks.splice(i + 1, 1)[0].size;
    if (i > 0 && blocks[i - 1].free) blocks[i - 1].size += HDR + blocks.splice(i, 1)[0].size; };
  const stats = () => { const fr = blocks.filter(b => b.free).map(b => b.size), tot = fr.reduce((a, c) => a + c, 0), mx = fr.length ? Math.max(...fr) : 0;
    const internal = allocs.filter(a => a[2]).reduce((s, a) => s + HDR + a[0].size - a[1], 0); return {n: fr.length, tot, mx, internal, F: tot ? (tot - mx) / tot : null}; };
  const snap = () => blocks.map(b => [b.off, b.size, b.free, b.lab]);
  REQ.forEach((r, i) => { const b = alloc(r, LAB[i]); out.push({kind: "alloc", lab: LAB[i], req: r, hit: b.off, blocks: snap(), st: stats()}); });
  FREES.forEach(j => { const off = allocs[j][0].off; rel(j); out.push({kind: "free", lab: LAB[j], req: null, hit: off, blocks: snap(), st: stats()}); });
  const b = alloc(k, "K"); out.push({kind: "alloc", lab: "K", req: k, hit: b ? b.off : null, blocks: snap(), st: stats()});
  return out;
}
const SNAME = {first: "first fit", best: "best fit", worst: "worst fit"};
function fF(st){ return st.F === null ? "nincs szabad memória" : st.F.toFixed(4).replace(".", ","); }
function mkSteps(strat, k){
  return fragRun(strat, k).map((s, i) => { const st = s.st;
    const what = s.kind === "free" ? `${i + 1}. lépés: free(${s.lab})` : (s.lab === "K" ? `${i + 1}. lépés: K = ${s.req} (igazítva ${(s.req + 7) & ~7}) – ${SNAME[strat]}` + (s.hit === null ? ": NEM SIKERÜLT" : ` → offset ${s.hit}`) : `${i + 1}. lépés: alloc ${s.lab} = ${s.req}`);
    return Object.assign({}, s, {strat, line: -1, msg: `${what} · szabad blokkok: ${st.n}, szabad kapacitás: ${st.tot} bájt, legnagyobb: ${st.mx} bájt, belső fragm.: ${st.internal} bájt, F = ${fF(st)}`}); });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 600 200"); svg.innerHTML = "";
  const d = el("defs", {}); d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1"/></pattern>
    <pattern id="dot" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="${css("--cell")}"/><circle cx="2.5" cy="2.5" r="1.1" fill="${css("--line")}"/></pattern>`;
  const X = 10, W = 580, sc = W / HEAP, y = 50, h = 60;
  s.blocks.forEach(([off, size, free, lab]) => { const x = X + off * sc, w = (size + HDR) * sc, hot = off === s.hit || (lab === "K");
    el("rect", {x, y, width: w, height: h, fill: free ? css("--cell") : (lab === "K" ? "url(#dot)" : "url(#hat)"), stroke: hot ? css("--hl") : css("--line"), "stroke-width": hot ? 3 : 1});
    el("rect", {x, y, width: 2.5, height: h, fill: css("--line")});
    if (w > 26) { if (!free) el("rect", {x: x + w/2 - 20, y: y + 14, width: 40, height: 32, fill: css("--cell")});
      el("text", {x: x + w/2 + 1, y: y + 27, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, lab || "–");
      el("text", {x: x + w/2 + 1, y: y + 42, "text-anchor": "middle", "font-size": 11}, String(size)); }
    else if (free) el("text", {x: x + w/2, y: y + h + 14, "text-anchor": "middle", "font-size": 11}, String(size)); });
  for (let k = 0; k <= HEAP; k += 4096) { el("line", {x1: X + k*sc, y1: y + h + 22, x2: X + k*sc, y2: y + h + 28, stroke: css("--line")});
    el("text", {x: X + k*sc, y: y + h + 42, "text-anchor": k === HEAP ? "end" : "middle", "font-size": 10, fill: css("--muted")}, String(k)); }
  el("text", {x: X, y: 30, "font-size": 13}, `${SNAME[s.strat]} · heap 32 768 bájt · fekete csík = 32 bájtos fejléc (nem méretarányos)`);
  const st = s.st;
  el("text", {x: X, y: 192, "font-size": 13}, st.tot ? `szabad összesen ${st.tot} B, S_max = ${st.mx} B, F = 1 − S_max/szabad = ${fF(st)}` : "nincs szabad blokk");
}
function load(){
  const k = +document.getElementById("kk").value, err = document.getElementById("err");
  if (!Number.isInteger(k) || k < 1 || k > 32000) { err.textContent = "1 és 32 000 közötti egész kérésméretet adjon meg."; return; }
  err.textContent = ""; const keep = k2(); setSteps(mkSteps(document.getElementById("st").value, k)); show(keep);
}
function k2(){ return k; }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
