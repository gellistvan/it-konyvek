<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Útvonalfeloldás mount-határokon át</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>útvonal <select id="pth" onchange="load()"><option value="notes">/home/alice/notes.txt</option><option value="readme">/home/alice/projects/README.md</option></select></label><label>dcache <select id="cch" onchange="load()"><option value="cold">hideg</option><option value="warm">meleg (ugyanez az útvonal már megnyitva)</option><option value="after">a notes.txt megnyitása után</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három fájlrendszer dentry-fája; a notes.txt útvonala egy, a README.md útvonala két mount-határt keresztez."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus: a labor VFS-szimulátorának várt viselkedése (pseudo_fs /, disk_fs /home, tmp_fs /home/alice/projects). Minden open friss folyamatban (0–2 foglalt) → fd 3. A kódpanel a 15.2.8 nyolclépéses listája. ✓ = dcache-találat, ○ = hiány, lookup().</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "/", "sb": "pseudo_fs", "route": ["/"], "hits": 0, "n": 0, "cross": 0, "fd": null, "line": 0, "msg": "open(\"/home/alice/notes.txt\"): a path walk a gyökér dentry-től indul (superblock: pseudo_fs)", "marks": {}}, {"node": "home", "sb": "pseudo_fs", "route": ["/", "home"], "hits": 0, "n": 1, "cross": 0, "fd": null, "line": 1, "hit": false, "msg": "„home”: hiány → lookup()  |  superblock: pseudo_fs; dcache-találat: 0/1, mount-váltás: 0", "marks": {"home": false}}, {"node": "r2", "sb": "disk_fs", "route": ["/", "home", "r2"], "hits": 0, "n": 1, "cross": 1, "fd": null, "line": 2, "msg": "„home” mount pont: MOUNT_CROSS → disk_fs gyökere  |  dcache-találat: 0/1, mount-váltás: 1", "marks": {"home": false}}, {"node": "alice", "sb": "disk_fs", "route": ["/", "home", "r2", "alice"], "hits": 0, "n": 2, "cross": 1, "fd": null, "line": 3, "hit": false, "msg": "„alice”: hiány → lookup()  |  superblock: disk_fs; dcache-találat: 0/2, mount-váltás: 1", "marks": {"home": false, "alice": false}}, {"node": "notes.txt", "sb": "disk_fs", "route": ["/", "home", "r2", "alice", "notes.txt"], "hits": 0, "n": 3, "cross": 1, "fd": null, "line": 1, "hit": false, "msg": "„notes.txt”: hiány → lookup()  |  superblock: disk_fs; dcache-találat: 0/3, mount-váltás: 1", "marks": {"home": false, "alice": false, "notes.txt": false}}, {"node": "notes.txt", "sb": "disk_fs", "route": ["/", "home", "r2", "alice", "notes.txt"], "hits": 0, "n": 3, "cross": 1, "fd": null, "line": 4, "msg": "jogosultság rendben (olvasás)  |  dcache-találat: 0/3, mount-váltás: 1", "marks": {"home": false, "alice": false, "notes.txt": false}}, {"node": "notes.txt", "sb": "disk_fs", "route": ["/", "home", "r2", "alice", "notes.txt"], "hits": 0, "n": 3, "cross": 1, "fd": null, "line": 5, "msg": "struct file: offset = 0  |  dcache-találat: 0/3, mount-váltás: 1", "marks": {"home": false, "alice": false, "notes.txt": false}}, {"node": "notes.txt", "sb": "disk_fs", "route": ["/", "home", "r2", "alice", "notes.txt"], "hits": 0, "n": 3, "cross": 1, "fd": 3, "line": 6, "msg": "fd 3 kiosztva (0–2 foglalt)  |  dcache-találat: 0/3, mount-váltás: 1", "marks": {"home": false, "alice": false, "notes.txt": false}}, {"node": "notes.txt", "sb": "disk_fs", "route": ["/", "home", "r2", "alice", "notes.txt"], "hits": 0, "n": 3, "cross": 1, "fd": 3, "line": 7, "msg": "open visszatér: 3  |  dcache-találat: 0/3, mount-váltás: 1", "marks": {"home": false, "alice": false, "notes.txt": false}}];
const CODE = ["1. path walk indítása a gyökér dentry-től (pseudo_fs)", "2. komponensenként: dcache-keresés; hiány esetén a fájlrendszer lookup()-ja", "3. mount pont: átváltás a csatolt fájlrendszer gyökér dentry-jére (MOUNT_CROSS)", "4. a következő komponens feloldása az új mount gyökeréből", "5. jogosultság-ellenőrzés az inode-on (EACCES, ha nincs olvasási jog)", "6. struct file létrehozása, offset = 0, f_op a fájlrendszeré", "7. fd kiosztása: a legkisebb szabad bejegyzés (0, 1, 2 foglalt → 3)", "8. visszatérés: open → 3"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = {"/": ["/", "pseudo_fs", null], "home": ["home", "pseudo_fs", "/"], "r2": ["/ (gyökér)", "disk_fs", null], "alice": ["alice", "disk_fs", "r2"], "notes.txt": ["notes.txt", "disk_fs", "alice"], "projects": ["projects", "disk_fs", "alice"], "r3": ["/ (gyökér)", "tmp_fs", null], "README.md": ["README.md", "tmp_fs", "r3"]}, MOUNTS = {"home": "r2", "projects": "r3"}, PATHS = {"notes": "/home/alice/notes.txt", "readme": "/home/alice/projects/README.md"};
const POS = {"/": [60, 50], "home": [190, 50], "r2": [190, 140], "alice": [330, 140], "notes.txt": [480, 120],
             "projects": [480, 175], "r3": [480, 240], "README.md": [600, 240]};
function render(s){
  svg.setAttribute("viewBox", "0 0 680 330"); svg.innerHTML = "";
  [["pseudo_fs (gyökér /)", 10, 95], ["disk_fs (/home)", 100, 200], ["tmp_fs (/home/alice/projects)", 205, 290]].forEach(([t, a, b]) => {
    const on = s.sb === t.split(" ")[0];
    el("rect", {x: 6, y: a, width: 668, height: b - a, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1, opacity: 0.9});
    el("text", {x: 12, y: a + 16, "font-size": 11.5, "font-style": "italic"}, "superblock: " + t); });
  Object.keys(NODES).forEach(k => { const p = NODES[k][2]; if (p) el("line", {x1: POS[p][0], y1: POS[p][1], x2: POS[k][0], y2: POS[k][1], stroke: css("--muted")}); });
  const R = s.route;
  for (let i = 1; i < R.length; i++) { const a = POS[R[i - 1]], b = POS[R[i]], mc = MOUNTS[R[i - 1]] === R[i];
    el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--hl"), "stroke-width": mc ? 6 : 3});
    if (mc) el("text", {x: a[0] + 8, y: (a[1] + b[1]) / 2 + 4, "font-size": 11, "font-weight": "bold", fill: css("--hl")}, "MOUNT_CROSS"); }
  Object.keys(NODES).forEach(k => { const [x, y] = POS[k], name = NODES[k][0], w = 18 + 7.2 * name.length, cur = k === s.node, mp = MOUNTS[k] !== undefined;
    if (mp) el("rect", {x: x - w / 2 - 4, y: y - 16, width: w + 8, height: 32, rx: 6, fill: "none", stroke: css("--line")});
    el("rect", {x: x - w / 2, y: y - 12, width: w, height: 24, rx: 5, fill: css("--bg"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3 : 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12, style: "font-family:ui-monospace,monospace"}, name);
    if (s.marks && s.marks[k] !== undefined) el("text", {x, y: y + 30, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, s.marks[k] ? "✓ dcache" : "○ lookup()"); });
  el("text", {x: 12, y: 312, "font-size": 12.5, "font-weight": "bold"}, `dcache-találat: ${s.hits}/${s.n}   mount-váltás: ${s.cross}   aktuális superblock: ${s.sb}   fd: ${s.fd === null ? "—" : s.fd}`);
}
function walk(which, cached){
  const comps = PATHS[which].replace(/^\//, "").split("/"); let cur = "/", hits = 0, n = 0, cross = 0, after = false;
  const route = ["/"], marks = {};
  const st = [{node: "/", sb: "pseudo_fs", route: route.slice(), hits: 0, n: 0, cross: 0, fd: null, line: 0, marks: {},
               msg: `open("${PATHS[which]}"): a path walk a gyökér dentry-től indul (superblock: pseudo_fs)`}];
  comps.forEach(c => {
    const nxt = Object.keys(NODES).find(k => NODES[k][0] === c && NODES[k][2] === cur);
    n++; const hit = cached.includes(c); hits += hit ? 1 : 0; route.push(nxt); cur = nxt; marks[cur] = hit;
    st.push({node: cur, sb: NODES[cur][1], route: route.slice(), hits, n, cross, fd: null, line: after ? 3 : 1, marks: Object.assign({}, marks),
             msg: `„${c}”: ${hit ? "dcache-találat ✓" : "hiány → lookup()"}  |  superblock: ${NODES[cur][1]}; dcache-találat: ${hits}/${n}, mount-váltás: ${cross}`});
    after = false;
    if (MOUNTS[cur] !== undefined) { cross++; cur = MOUNTS[cur]; route.push(cur); after = true;
      st.push({node: cur, sb: NODES[cur][1], route: route.slice(), hits, n, cross, fd: null, line: 2, marks: Object.assign({}, marks),
               msg: `„${c}” mount pont: MOUNT_CROSS → ${NODES[cur][1]} gyökere  |  dcache-találat: ${hits}/${n}, mount-váltás: ${cross}`}); }
  });
  [[4, "jogosultság rendben (olvasás)"], [5, "struct file: offset = 0"], [6, "fd 3 kiosztva (0–2 foglalt)"], [7, "open visszatér: 3"]].forEach(([line, t]) =>
    st.push({node: cur, sb: NODES[cur][1], route: route.slice(), hits, n, cross, fd: line >= 6 ? 3 : null, line, marks: Object.assign({}, marks),
             msg: `${t}  |  dcache-találat: ${hits}/${n}, mount-váltás: ${cross}`}));
  return st;
}
function load(){
  const w = document.getElementById("pth").value, c = document.getElementById("cch").value;
  const cached = c === "cold" ? [] : c === "warm" ? PATHS[w].replace(/^\//, "").split("/") : ["home", "alice", "notes.txt"];
  setSteps(walk(w, cached));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
