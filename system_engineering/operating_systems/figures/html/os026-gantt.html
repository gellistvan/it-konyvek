<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCFS és prioritásos Gantt-diagram</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Ütemezés: <select id="pol" onchange="reload()"><option value="fcfs">FCFS</option><option value="prio">nem preemptív prioritásos</option><option value="sjf">SJF (nem preemptív)</option><option value="srtf">SRTF</option></select></label><table id="ptab" class="small" style="border-collapse:collapse"><thead><tr><th></th><th>A</th><th>C</th><th>p</th></tr></thead><tbody><tr><td>P1</td><td><input size="2" value="0" aria-label="P1 érkezés"></td><td><input size="2" value="5" aria-label="P1 CPU-idő"></td><td><input size="2" value="3" aria-label="P1 prioritás"></td></tr><tr><td>P2</td><td><input size="2" value="1" aria-label="P2 érkezés"></td><td><input size="2" value="2" aria-label="P2 CPU-idő"></td><td><input size="2" value="1" aria-label="P2 prioritás"></td></tr><tr><td>P3</td><td><input size="2" value="2" aria-label="P3 érkezés"></td><td><input size="2" value="3" aria-label="P3 CPU-idő"></td><td><input size="2" value="2" aria-label="P3 prioritás"></td></tr></tbody></table><button onclick="addRow()">+ folyamat</button><button onclick="reload()">Számol</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Arányos Gantt-diagram időegységenként; érkezési jelek, kész sor, hátralévő idő, a végén a metrikák."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egy CPU, egész időlépés, kontextusváltás elhanyagolva; holtverseny: kisebb index; nagyobb prioritásszám = magasabb prioritás. A metrikák a 8.1.10 pszeudokódja szerint.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "run": "P1", "ready": [], "rem": [5, 2, 3], "line": 1, "msg": "t = 0: fut P1 (hátra: 5); kész sor: ∅.", "segs": [["P1", 0, 1]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 1, "run": "P1", "ready": ["P2"], "rem": [4, 2, 3], "line": 1, "msg": "t = 1: fut P1 (hátra: 4); kész sor: P2.", "segs": [["P1", 0, 2]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 2, "run": "P1", "ready": ["P2", "P3"], "rem": [3, 2, 3], "line": 1, "msg": "t = 2: fut P1 (hátra: 3); kész sor: P2, P3.", "segs": [["P1", 0, 3]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 3, "run": "P1", "ready": ["P2", "P3"], "rem": [2, 2, 3], "line": 1, "msg": "t = 3: fut P1 (hátra: 2); kész sor: P2, P3.", "segs": [["P1", 0, 4]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 4, "run": "P1", "ready": ["P2", "P3"], "rem": [1, 2, 3], "line": 1, "msg": "t = 4: fut P1 (hátra: 1); kész sor: P2, P3.", "segs": [["P1", 0, 5]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 5, "run": "P2", "ready": ["P3"], "rem": [0, 2, 3], "line": 1, "msg": "t = 5: fut P2 (hátra: 2); kész sor: P3.", "segs": [["P1", 0, 5], ["P2", 5, 6]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 6, "run": "P2", "ready": ["P3"], "rem": [0, 1, 3], "line": 1, "msg": "t = 6: fut P2 (hátra: 1); kész sor: P3.", "segs": [["P1", 0, 5], ["P2", 5, 7]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 7, "run": "P3", "ready": [], "rem": [0, 0, 3], "line": 1, "msg": "t = 7: fut P3 (hátra: 3); kész sor: ∅.", "segs": [["P1", 0, 5], ["P2", 5, 7], ["P3", 7, 8]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 8, "run": "P3", "ready": [], "rem": [0, 0, 2], "line": 1, "msg": "t = 8: fut P3 (hátra: 2); kész sor: ∅.", "segs": [["P1", 0, 5], ["P2", 5, 7], ["P3", 7, 9]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 9, "run": "P3", "ready": [], "rem": [0, 0, 1], "line": 1, "msg": "t = 9: fut P3 (hátra: 1); kész sor: ∅.", "segs": [["P1", 0, 5], ["P2", 5, 7], ["P3", 7, 10]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}, {"t": 10, "run": null, "ready": [], "rem": [0, 0, 0], "line": 6, "done": true, "msg": "t = 10: kész. T̄ = 6,33, W̄ = 3,00, R̄ = 3,00, U = 1,00, X = 0,30, J_T = 0,963.", "segs": [["P1", 0, 5], ["P2", 5, 7], ["P3", 7, 10]], "m": {"T": [5, 6, 8], "W": [0, 4, 5], "R": [0, 4, 5], "Tm": 6.333333333333333, "Wm": 3.0, "Rm": 3.0, "U": 1.0, "X": 0.3, "J": 0.9626666666666667}, "procs": [{"id": "P1", "A": 0, "C": 5, "p": 3}, {"id": "P2", "A": 1, "C": 2, "p": 1}, {"id": "P3", "A": 2, "C": 3, "p": 2}], "tmax": 10, "pol": "fcfs"}];
const CODE = ["függvény szamit_metrikak(folyamatok, ütemezés):   /* 8.1.10, időegységenkénti ütemezéssel */", "    minden t-re: érkezők a kész sorba; ha a futó kész vagy preemptív: választás", "    kezdes[i] ← első futás ideje;  befejezes[i] ← az utolsó egység vége", "    delta_t ← max(befejezes) − min(erkezes)", "    T[i] ← befejezes[i] − erkezes[i];  W[i] ← T[i] − cpu_ido[i];  R[i] ← kezdes[i] − erkezes[i]", "    U ← ossz_cpu / delta_t;  X ← n / delta_t", "    J_T ← (szumma(T))^2 / (n · szumma(T^2))"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NAMES = {"fcfs": "FCFS", "prio": "nem preemptív prioritásos", "sjf": "SJF (nem preemptív)", "srtf": "SRTF"};
function simJS(procs, pol){
  const n = procs.length, rem = procs.map(p => p.C), start = Array(n).fill(null), fin = Array(n).fill(null), order = [];
  let t = 0, cur = null; const segs = [], st = [];
  const fmt = (x, d) => x.toFixed(d === undefined ? 2 : d).replace(".", ",");
  while (fin.some(f => f === null) && t < 400) {
    procs.forEach((p, i) => { if (p.A === t) order.push(i); });
    const ready = order.filter(i => fin[i] === null);
    if (cur !== null && fin[cur] !== null) cur = null;
    if (pol === "srtf" || cur === null) {
      if (ready.length) {
        const key = {fcfs: i => [order.indexOf(i), i], prio: i => [-procs[i].p, i], sjf: i => [procs[i].C, i], srtf: i => [rem[i], i]}[pol];
        if (pol === "fcfs") cur = cur === null ? ready[0] : cur;
        else cur = ready.slice().sort((a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1] - y[1]; })[0];
      }
    }
    if (cur === null) {
      st.push({t, run: null, ready: [], rem: rem.slice(), line: 1, msg: "t = " + t + ": nincs kész folyamat – üresjárat."});
      if (segs.length && segs[segs.length-1][0] === "üres" && segs[segs.length-1][2] === t) segs[segs.length-1][2] = t + 1; else segs.push(["üres", t, t + 1]);
      t++; continue;
    }
    if (start[cur] === null) start[cur] = t;
    const name = procs[cur].id, waiting = ready.filter(i => i !== cur).map(i => procs[i].id);
    st.push({t, run: name, ready: waiting, rem: rem.slice(), line: 1, msg: "t = " + t + ": fut " + name + " (hátra: " + rem[cur] + "); kész sor: " + (waiting.length ? waiting.join(", ") : "∅") + "."});
    if (segs.length && segs[segs.length-1][0] === name && segs[segs.length-1][2] === t) segs[segs.length-1][2] = t + 1; else segs.push([name, t, t + 1]);
    rem[cur]--; t++;
    if (rem[cur] === 0) { fin[cur] = t; order.splice(order.indexOf(cur), 1); cur = null; }
  }
  const T = procs.map((p, i) => fin[i] - p.A), W = T.map((x, i) => x - procs[i].C), R = procs.map((p, i) => start[i] - p.A);
  const dt = Math.max(...fin) - Math.min(...procs.map(p => p.A)), sum = a => a.reduce((x, y) => x + y, 0);
  const m = {T, W, R, Tm: sum(T) / n, Wm: sum(W) / n, Rm: sum(R) / n, U: sum(procs.map(p => p.C)) / dt, X: n / dt, J: sum(T) ** 2 / (n * sum(T.map(x => x * x)))};
  st.push({t, run: null, ready: [], rem: rem.slice(), line: 6, done: true,
    msg: "t = " + t + ": kész. T̄ = " + fmt(m.Tm) + ", W̄ = " + fmt(m.Wm) + ", R̄ = " + fmt(m.Rm) + ", U = " + fmt(m.U) + ", X = " + fmt(m.X) + ", J_T = " + fmt(m.J, 3) + "."});
  st.forEach(s => { s.segs = segs.filter(g => g[1] < s.t + (s.done ? 0 : 1)).map(g => [g[0], g[1], Math.min(g[2], s.done ? g[2] : s.t + 1)]); s.m = m; s.procs = procs; s.tmax = t; s.pol = pol; });
  return st;
}
function readProcs(){
  const rows = [...document.querySelectorAll("#ptab tbody tr")];
  return rows.map((r, i) => { const v = [...r.querySelectorAll("input")].map(x => parseInt(x.value, 10)); return {id: "P" + (i + 1), A: v[0], C: v[1], p: v[2]}; });
}
function reload(){
  const ps = readProcs(), err = document.getElementById("err");
  if (ps.some(p => !(p.A >= 0) || !(p.C >= 1) || !Number.isInteger(p.p) || p.A > 50 || p.C > 30)) { err.textContent = "Érkezés 0–50, CPU-idő 1–30, prioritás egész."; return; }
  err.textContent = ""; setSteps(simJS(ps, document.getElementById("pol").value));
}
function addRow(){ const tb = document.querySelector("#ptab tbody"); if (tb.rows.length >= 6) return; const i = tb.rows.length + 1;
  const tr = document.createElement("tr"); tr.innerHTML = `<td>P${i}</td><td><input size="2" value="${i}" aria-label="P${i} érkezés"></td><td><input size="2" value="2" aria-label="P${i} CPU-idő"></td><td><input size="2" value="1" aria-label="P${i} prioritás"></td>`; tb.appendChild(tr); }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 620 300");
  const tmax = Math.max(s.tmax, 1), X0 = 50, W = 540 / tmax, y = 110;
  const pats = {P1: css("--cellhl"), P2: css("--cell"), P3: css("--cell"), P4: css("--cellhl"), P5: css("--cell"), P6: css("--cell")};
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, NAMES[s.pol]);
  s.segs.forEach(([nm, a, b]) => {
    el("rect", {x: X0 + a * W, y, width: (b - a) * W, height: 36, fill: nm === "üres" ? "none" : pats[nm], stroke: css("--line"), "stroke-dasharray": nm === "üres" ? "3 3" : "none"});
    const idx = +nm.slice(1);
    if (idx % 3 === 2) for (let x = a * W; x < b * W; x += 7) el("line", {x1: X0 + x, y1: y + 36, x2: X0 + Math.min(x + 7, b * W), y2: y, stroke: css("--muted"), "stroke-width": 0.8});
    if (idx % 3 === 0 && idx) for (let x = a * W + 3; x < b * W; x += 7) for (let yy = y + 5; yy < y + 36; yy += 7) el("circle", {cx: X0 + x, cy: yy, r: 1, fill: css("--muted")});
    el("text", {x: X0 + (a + b) / 2 * W, y: y + 23, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, nm === "üres" ? "–" : nm);
  });
  for (let t = 0; t <= tmax; t++) { el("line", {x1: X0 + t * W, y1: y + 36, x2: X0 + t * W, y2: y + 42, stroke: css("--line")}); if (tmax <= 30 || t % 5 === 0) el("text", {x: X0 + t * W, y: y + 56, "text-anchor": "middle", "font-size": 11}, String(t)); }
  s.procs.forEach((p, i) => {
    el("line", {x1: X0 + p.A * W, y1: y - 30, x2: X0 + p.A * W, y2: y - 2, stroke: css("--line"), "stroke-width": 1.4});
    el("text", {x: X0 + p.A * W + 3, y: y - 34 - (i % 2) * 12, "font-size": 11}, "A" + (i + 1));
  });
  if (!s.done) el("line", {x1: X0 + s.t * W, y1: y - 6, x2: X0 + s.t * W, y2: y + 44, stroke: css("--hl2"), "stroke-width": 3});
  // kártya
  const yc = 196;
  el("text", {x: 10, y: yc, "font-size": 12, "font-weight": "bold"}, "kész sor: " + (s.done ? "–" : (s.ready.length ? s.ready.join(", ") : "∅")) + (s.run ? "  ·  fut: " + s.run : ""));
  if (s.done) {
    const f = (x, d) => x.toFixed(d === undefined ? 2 : d).replace(".", ",");
    el("text", {x: 10, y: yc + 24, "font-size": 12}, "T = " + s.m.T.join(", ") + "  ·  W = " + s.m.W.join(", ") + "  ·  R = " + s.m.R.join(", "));
    el("text", {x: 10, y: yc + 46, "font-size": 13, "font-weight": "bold"}, ["T̄ = " + f(s.m.Tm), "W̄ = " + f(s.m.Wm), "R̄ = " + f(s.m.Rm), "U = " + f(s.m.U), "X = " + f(s.m.X), "J_T = " + f(s.m.J, 3)].join("  ·  "));
  } else el("text", {x: 10, y: yc + 24, "font-size": 12, fill: css("--muted")}, "hátralévő CPU-idő: " + s.procs.map((p, i) => p.id + " = " + s.rem[i]).join(", "));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
