<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az ext4 naplózási módjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód <select id="md" onchange="setMode()"><option value="ordered">data=ordered</option><option value="writeback">data=writeback</option><option value="journal">data=journal</option></select></label><button id="crash" onclick="crashNow()">crash most</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal a választott naplózási mód írásaival; a napló és a végleges hely tartalma lépésenként, crash-gombbal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített JBD2-modell: egy tranzakció (új 8 KiB-os fájl), delayed allocation nélkül; D = 2 adatblokk, M = inode + könyvtárblokk + bitmap, C = commit, CP = checkpoint. writeback módban a D bármikor kiíródhat; itt a legrosszabb esetet (legutoljára) játsszuk le. Sematikus.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "ordered", "k": 0, "j": [], "f": [], "line": -1, "label": "kezdet", "msg": "data=ordered: kezdet – üres napló, a fájl még nem létezik", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre"}, {"mode": "ordered", "k": 1, "j": [], "f": ["D"], "line": -1, "label": "D", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre (a kiírt D-blokkok gazdátlanok, szabadok maradnak)", "msg": "data=ordered, 1. írás: D → végleges  |  napló: {—}, végleges hely: {D}"}, {"mode": "ordered", "k": 2, "j": ["M"], "f": ["D"], "line": -1, "label": "M", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre (a kiírt D-blokkok gazdátlanok, szabadok maradnak)", "msg": "data=ordered, 2. írás: M → napló  |  napló: {M}, végleges hely: {D}"}, {"mode": "ordered", "k": 3, "j": ["C", "M"], "f": ["D"], "line": -1, "label": "C", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=ordered, 3. írás: C → napló  |  napló: {C, M}, végleges hely: {D}"}, {"mode": "ordered", "k": 4, "j": ["C", "M"], "f": ["D", "M"], "line": -1, "label": "CP(M)", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=ordered, 4. írás: CP(M) → végleges  |  napló: {C, M}, végleges hely: {D, M}"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"ordered": [{"mode": "ordered", "k": 0, "j": [], "f": [], "line": -1, "label": "kezdet", "msg": "data=ordered: kezdet – üres napló, a fájl még nem létezik", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre"}, {"mode": "ordered", "k": 1, "j": [], "f": ["D"], "line": -1, "label": "D", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre (a kiírt D-blokkok gazdátlanok, szabadok maradnak)", "msg": "data=ordered, 1. írás: D → végleges  |  napló: {—}, végleges hely: {D}"}, {"mode": "ordered", "k": 2, "j": ["M"], "f": ["D"], "line": -1, "label": "M", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre (a kiírt D-blokkok gazdátlanok, szabadok maradnak)", "msg": "data=ordered, 2. írás: M → napló  |  napló: {M}, végleges hely: {D}"}, {"mode": "ordered", "k": 3, "j": ["C", "M"], "f": ["D"], "line": -1, "label": "C", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=ordered, 3. írás: C → napló  |  napló: {C, M}, végleges hely: {D}"}, {"mode": "ordered", "k": 4, "j": ["C", "M"], "f": ["D", "M"], "line": -1, "label": "CP(M)", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=ordered, 4. írás: CP(M) → végleges  |  napló: {C, M}, végleges hely: {D, M}"}], "writeback": [{"mode": "writeback", "k": 0, "j": [], "f": [], "line": -1, "label": "kezdet", "msg": "data=writeback: kezdet – üres napló, a fájl még nem létezik", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre"}, {"mode": "writeback", "k": 1, "j": ["M"], "f": [], "line": -1, "label": "M", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre", "msg": "data=writeback, 1. írás: M → napló  |  napló: {M}, végleges hely: {—}"}, {"mode": "writeback", "k": 2, "j": ["C", "M"], "f": [], "line": -1, "label": "C", "crash": "napló újrajátszva · a metaadat helyes, az adat lehet régi (a blokkokban más fájl korábbi tartalma)", "msg": "data=writeback, 2. írás: C → napló  |  napló: {C, M}, végleges hely: {—}"}, {"mode": "writeback", "k": 3, "j": ["C", "M"], "f": ["M"], "line": -1, "label": "CP(M)", "crash": "napló újrajátszva · a metaadat helyes, az adat lehet régi (a blokkokban más fájl korábbi tartalma)", "msg": "data=writeback, 3. írás: CP(M) → végleges  |  napló: {C, M}, végleges hely: {M}"}, {"mode": "writeback", "k": 4, "j": ["C", "M"], "f": ["D", "M"], "line": -1, "label": "D", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=writeback, 4. írás: D → végleges  |  napló: {C, M}, végleges hely: {D, M}"}], "journal": [{"mode": "journal", "k": 0, "j": [], "f": [], "line": -1, "label": "kezdet", "msg": "data=journal: kezdet – üres napló, a fájl még nem létezik", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre"}, {"mode": "journal", "k": 1, "j": ["D", "M"], "f": [], "line": -1, "label": "D+M", "crash": "nincs commit: a tranzakció eldobva · a fájl nem jön létre", "msg": "data=journal, 1. írás: D+M → napló  |  napló: {D, M}, végleges hely: {—}"}, {"mode": "journal", "k": 2, "j": ["C", "D", "M"], "f": [], "line": -1, "label": "C", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=journal, 2. írás: C → napló  |  napló: {C, D, M}, végleges hely: {—}"}, {"mode": "journal", "k": 3, "j": ["C", "D", "M"], "f": ["D", "M"], "line": -1, "label": "CP(D, M)", "crash": "napló újrajátszva · a fájl teljes új tartalommal", "msg": "data=journal, 3. írás: CP(D, M) → végleges  |  napló: {C, D, M}, végleges hely: {D, M}"}]};
let CR = false, CRK = -1;
function render(s){
  if (CR && k !== CRK) { CR = false; document.getElementById("crash").textContent = "crash most"; }
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = "";
  const seq = ALL[s.mode];
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, `data=${s.mode}`);
  seq.slice(1).forEach((q, i) => { const x = 20 + i * 150, done = i + 1 <= s.k, cur = i + 1 === s.k, jn = ["D+M", "M", "C"].includes(q.label);
    el("rect", {x, y: 40, width: 130, height: 40, fill: done ? (jn ? css("--cellhl") : css("--fg")) : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : 1.2, "stroke-dasharray": done ? "none" : "4 3"});
    el("text", {x: x + 65, y: 66, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: done && !jn ? css("--bg") : css("--fg")}, q.label);
    el("text", {x: x + 65, y: 98, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, (jn ? "napló" : "végleges hely") + (q.label === "D" && s.mode === "writeback" ? " (bármikor)" : "")); });
  const box = (x, title, items) => { el("rect", {x, y: 130, width: 280, height: 90, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: x + 10, y: 150, "font-size": 12.5, "font-weight": "bold"}, title);
    ["D", "M", "C"].forEach((t, i) => { if (title.startsWith("végleges") && t === "C") return; const on = items.includes(t);
      el("rect", {x: x + 12 + i * 88, y: 165, width: 76, height: 40, fill: on ? css("--cellhl") : css("--bg"), stroke: css("--line"), "stroke-dasharray": on ? "none" : "3 3"});
      el("text", {x: x + 50 + i * 88, y: 190, "text-anchor": "middle", "font-size": 13, "font-weight": on ? "bold" : "normal", fill: on ? css("--fg") : css("--muted")}, t); }); };
  box(10, "napló (JBD2)", s.j); box(330, "végleges hely", s.f);
  if (CR) { el("rect", {x: 10, y: 232, width: 620, height: 52, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 3});
    el("text", {x: 20, y: 252, "font-size": 13, "font-weight": "bold"}, "⚡ CRASH most → helyreállítás:");
    el("text", {x: 20, y: 274, "font-size": 12.5}, s.crash); }
}
function crashNow(){ CR = !CR; CRK = k; document.getElementById("crash").textContent = CR ? "vissza" : "crash most";
  const s = STEPS[k]; status.textContent = CR ? `Crash a(z) ${s.k}. írás után → ${s.crash}` : s.msg; render(s); }
function setMode(){ setSteps(ALL[document.getElementById("md").value]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
