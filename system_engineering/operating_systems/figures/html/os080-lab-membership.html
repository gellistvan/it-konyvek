<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Névtér- és cgroup-tagság a laborban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kétdimenziós térkép: oszlopok a cgroupok, keretek a névterek. Ha csak a target kerül a /labor csoportba, a mérő shell és a time sh a gyökér cgroupban fut; a mérő shell áthelyezése után minden névtérbeli folyamat a /labor csoportban van. A sleep 600 mindkét esetben belül PID 1."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A cgroup-tagság forkkal öröklődik, az nsenter nem vált cgroupot. Az (a) változat a labor jelenlegi sorrendje, a (b) a mérő shell előzetes áthelyezésével. A PID-ek szemléltetők; a cgroup-értékek várt, nem mért kimenetek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"key": "start", "line": 0, "msg": "(a) 2. lépés: a vendég shell elindítja az unshare-t; a gyermeke a névtér PID 1-e (exec sleep 600). Mindhárom a gyökér cgroupban (/) van – a cgroup-tagság forkkal öröklődik.", "cg": {"gsh": "/", "helper": "/", "sleep": "/"}, "var": "a"}, {"key": "nsenter", "line": 1, "msg": "(a) nsenter -t $target … /bin/sh: a mérő shell a névtérbe lép (belül 2), de a vendég shell gyermekeként a gyökér cgroupban (/) marad – az nsenter nem vált cgroupot.", "cg": {"gsh": "/", "helper": "/", "sleep": "/", "msh": "/"}, "var": "a"}, {"key": "target", "line": 2, "msg": "(a) 3. lépés: echo $target > labor/cgroup.procs – csak a sleep 600 kerül a /labor csoportba; a már futó mérő shell a /-ban marad.", "cg": {"gsh": "/", "helper": "/", "sleep": "/labor", "msh": "/"}, "var": "a"}, {"key": "measure", "line": 4, "msg": "(a) Mérés: time sh -c … a mérő shell gyermeke (belül 3), az ő cgroupját örökli: / – a korlátok NEM hatnak a mérésre.", "cg": {"gsh": "/", "helper": "/", "sleep": "/labor", "msh": "/", "tsh": "/"}, "var": "a"}, {"key": "target", "line": 2, "msg": "(b) 3. lépés: echo $target > labor/cgroup.procs – a sleep 600 átkerül a /labor csoportba (a vendég szintjéről a külső PID-del).", "cg": {"gsh": "/", "helper": "/", "sleep": "/labor"}, "var": "b"}, {"key": "msh", "line": 3, "msg": "(b) A mérő shell áthelyezése: sh -c 'echo $$ > /sys/fs/cgroup/labor/cgroup.procs; exec nsenter -t $target -U -m -p -n /bin/sh' – a shell már a /labor csoportban lép be a névtérbe (belül 2).", "cg": {"gsh": "/", "helper": "/", "sleep": "/labor", "msh": "/labor"}, "var": "b"}, {"key": "measure", "line": 4, "msg": "(b) Mérés: time sh -c … a mérő shell gyermeke (belül 3), az ő cgroupját örökli: /labor – a 20%-os CPU- és a 32M memóriakorlát hat.", "cg": {"gsh": "/", "helper": "/", "sleep": "/labor", "msh": "/labor", "tsh": "/labor"}, "var": "b"}];
const CODE = ["unshare --pid --fork --mount --net --user --map-root-user --mount-proc … sh -c '…; exec sleep 600' &", "nsenter -t \"$target\" -U -m -p -n /bin/sh", "printf '%s\\n' \"$target\" > /sys/fs/cgroup/labor/cgroup.procs;  cat /proc/$target/cgroup  # 0::/labor", "sh -c 'echo $$ > /sys/fs/cgroup/labor/cgroup.procs; exec nsenter -t \"$1\" -U -m -p -n /bin/sh' _ \"$target\"", "time sh -c 'i=0; while [ $i -lt 10000000 ]; do i=$((i+1)); done'"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const INFO = {"gsh": ["vendég shell", "guest", 312, null], "helper": ["unshare (helper)", "guest", 4326, null], "sleep": ["sleep 600", "lab", 4327, 1], "msh": ["mérő shell", "lab", 4330, 2], "tsh": ["time sh -c …", "lab", 4331, 3]};
const ORDER = ["gsh", "helper", "sleep", "msh", "tsh"];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 370"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const defs = el("defs", {}); const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", "hh8"); p.setAttribute("width", 8); p.setAttribute("height", 8);
  p.setAttribute("patternUnits", "userSpaceOnUse"); const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", "M-1,9 L9,-1"); pa.setAttribute("stroke", mut); pa.setAttribute("stroke-width", 1); p.appendChild(pa); defs.appendChild(p);
  const X0 = 10, W = 230;
  el("rect", {x: X0, y: 30, width: W, height: 330, fill: cell, stroke: line});
  el("rect", {x: X0 + W, y: 30, width: W, height: 330, fill: "url(#hh8)", stroke: line});
  el("text", {x: X0 + W / 2, y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "cgroup /");
  el("text", {x: X0 + 1.5 * W, y: 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "cgroup /labor");
  el("rect", {x: X0 + 5, y: 38, width: 2 * W - 10, height: 110, fill: "none", stroke: line, "stroke-width": 2});
  el("text", {x: X0 + 12, y: 54, "font-size": 11, "font-style": "italic"}, "vendég PID-névtér");
  el("rect", {x: X0 + 5, y: 156, width: 2 * W - 10, height: 198, fill: "none", stroke: line, "stroke-width": 2, "stroke-dasharray": "8 5"});
  el("text", {x: X0 + 2 * W - 12, y: 348, "text-anchor": "end", "font-size": 11, "font-style": "italic", "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 4}, "labor-névtér (U+M+P+N)");
  const slots = {"/": [0, 0], "/labor": [0, 0]};
  ORDER.forEach(id => {
    if (!(id in s.cg)) return;
    const [lab, ns, gp, ip] = INFO[id], c = s.cg[id];
    const x = (c === "/" ? X0 : X0 + W) + 18;
    let y;
    if (ns === "guest") { y = 62 + slots[c][0] * 42; slots[c][0]++; } else { y = 166 + slots[c][1] * 54; slots[c][1]++; }
    const on = (s.key === "start" && ["gsh","helper","sleep"].includes(id)) || (s.key === "nsenter" && id === "msh") || (s.key === "target" && id === "sleep") || (s.key === "msh" && id === "msh") || (s.key === "measure" && id === "tsh");
    const bad = (id === "msh" || id === "tsh") && c === "/";
    el("rect", {x, y, width: W - 36, height: ns === "guest" ? 36 : 46, rx: 6, fill: css("--bg"), stroke: on ? hl : line, "stroke-width": on ? 4 : 1.3});
    el("text", {x: x + (W - 36) / 2, y: y + 16, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, lab);
    el("text", {x: x + (W - 36) / 2, y: y + (ns === "guest" ? 31 : 36), "text-anchor": "middle", "font-size": 11.5}, ns === "guest" ? ("PID " + gp) : ("belül " + ip + " (kívül " + gp + ")"));
    if (bad) { el("circle", {cx: x + W - 26, cy: y + 23, r: 9, fill: hl2}); el("text", {x: x + W - 26, y: y + 28, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: "#fff"}, "!"); }
  });
  // táblázat
  const TX = 490;
  el("text", {x: TX, y: 22, "font-size": 13, "font-weight": "bold"}, "változat (" + s.var + ") – /proc/<pid>/cgroup");
  el("text", {x: TX, y: 46, "font-size": 11.5, fill: mut}, "folyamat");
  el("text", {x: TX + 150, y: 46, "font-size": 11.5, fill: mut}, "PID");
  el("text", {x: TX + 195, y: 46, "font-size": 11.5, fill: mut}, "cgroup");
  el("line", {x1: TX, y1: 52, x2: 755, y2: 52, stroke: line});
  ORDER.forEach((id, i) => {
    const y = 72 + i * 24, has = id in s.cg;
    el("text", {x: TX, y, "font-size": 12}, INFO[id][0]);
    el("text", {x: TX + 150, y, "font-size": 12}, String(INFO[id][2]));
    el("text", {x: TX + 195, y, "font-size": 12, style: "font-family:monospace", "font-weight": has && s.cg[id] === "/labor" ? "bold" : "normal"}, has ? ("0::" + s.cg[id]) : "–");
  });
  el("text", {x: TX, y: 215, "font-size": 11, fill: mut}, "üres sáv = /, sraffozott = /labor");
  el("text", {x: TX, y: 232, "font-size": 11, fill: mut}, "(memory.max=32M, cpu.max=20000 100000)");
  el("text", {x: TX, y: 249, "font-size": 11, fill: mut}, "(!) = a korlátokon kívül fut");
  el("text", {x: TX, y: 266, "font-size": 11, fill: mut}, "PID-ek szemléltetők");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
