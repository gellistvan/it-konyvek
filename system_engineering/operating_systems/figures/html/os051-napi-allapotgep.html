<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A NAPI módváltása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>löket: csomag/időrés <input id="rate" type="range" min="1" max="200" value="200" oninput="load()" aria-label="Löketsebesség"> <span id="rv">200</span></label><label>budget <input id="bud" type="range" min="4" max="128" value="64" oninput="load()" aria-label="Budget"> <span id="bv">64</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Kétállapotú gép IRQ és poll móddal, valamint idővonal a 200 csomagos löketről."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített időréses modell: időrésenként egy poll; először 3 ritka csomag (t = 1, 4, 7), majd a t = 10-től 200 csomagos löket a megadott ütemben. Kezdőállapot: a löket egyszerre érkezik, budget = 64 → 1 IRQ és 4 poll (64, 64, 64, 8). A szabály a Linux NAPI-é (T-O6-016).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "arr": 0, "mode": "IRQ", "trans": null, "irq": 0, "polls": 0, "done": 0, "ring": 0, "wd": null, "line": -1, "msg": "Kezdetben: IRQ mód (eszköz-IRQ engedélyezve), üres gyűrű  |  IRQ-k: 0, pollok: 0, feldolgozott: 0"}, {"t": 1, "arr": 1, "mode": "POLL", "trans": "irq2poll", "irq": 1, "polls": 0, "done": 0, "ring": 1, "wd": null, "line": 1, "msg": "t = 1: 1 csomag érkezik; csomag-IRQ, az ISR letiltja az IRQ-t, napi_schedule() → poll mód  |  IRQ-k: 1, pollok: 0, feldolgozott: 0"}, {"t": 1, "arr": 0, "mode": "IRQ", "trans": "poll2irq", "irq": 1, "polls": 1, "done": 1, "ring": 0, "wd": 1, "line": 4, "msg": "t = 1: poll – work_done = 1 < budget = 64: napi_complete_done(), IRQ engedélyezve → IRQ mód  |  IRQ-k: 1, pollok: 1, feldolgozott: 1, a gyűrűben marad: 0"}, {"t": 4, "arr": 1, "mode": "POLL", "trans": "irq2poll", "irq": 2, "polls": 1, "done": 1, "ring": 1, "wd": null, "line": 1, "msg": "t = 4: 1 csomag érkezik; csomag-IRQ, az ISR letiltja az IRQ-t, napi_schedule() → poll mód  |  IRQ-k: 2, pollok: 1, feldolgozott: 1"}, {"t": 4, "arr": 0, "mode": "IRQ", "trans": "poll2irq", "irq": 2, "polls": 2, "done": 2, "ring": 0, "wd": 1, "line": 4, "msg": "t = 4: poll – work_done = 1 < budget = 64: napi_complete_done(), IRQ engedélyezve → IRQ mód  |  IRQ-k: 2, pollok: 2, feldolgozott: 2, a gyűrűben marad: 0"}, {"t": 7, "arr": 1, "mode": "POLL", "trans": "irq2poll", "irq": 3, "polls": 2, "done": 2, "ring": 1, "wd": null, "line": 1, "msg": "t = 7: 1 csomag érkezik; csomag-IRQ, az ISR letiltja az IRQ-t, napi_schedule() → poll mód  |  IRQ-k: 3, pollok: 2, feldolgozott: 2"}, {"t": 7, "arr": 0, "mode": "IRQ", "trans": "poll2irq", "irq": 3, "polls": 3, "done": 3, "ring": 0, "wd": 1, "line": 4, "msg": "t = 7: poll – work_done = 1 < budget = 64: napi_complete_done(), IRQ engedélyezve → IRQ mód  |  IRQ-k: 3, pollok: 3, feldolgozott: 3, a gyűrűben marad: 0"}, {"t": 10, "arr": 200, "mode": "POLL", "trans": "irq2poll", "irq": 4, "polls": 3, "done": 3, "ring": 200, "wd": null, "line": 1, "msg": "t = 10: 200 csomag érkezik; csomag-IRQ, az ISR letiltja az IRQ-t, napi_schedule() → poll mód  |  IRQ-k: 4 (a löketben 1), pollok: 3 (a löketben 0), feldolgozott: 3"}, {"t": 10, "arr": 0, "mode": "POLL", "trans": "loop", "irq": 4, "polls": 4, "done": 67, "ring": 136, "wd": 64, "line": 5, "msg": "t = 10: poll – work_done = 64 = budget: poll módban marad, újra poll  |  IRQ-k: 4 (a löketben 1), pollok: 4 (a löketben 1), feldolgozott: 67, a gyűrűben marad: 136"}, {"t": 11, "arr": 0, "mode": "POLL", "trans": "loop", "irq": 4, "polls": 5, "done": 131, "ring": 72, "wd": 64, "line": 5, "msg": "t = 11: poll – work_done = 64 = budget: poll módban marad, újra poll  |  IRQ-k: 4 (a löketben 1), pollok: 5 (a löketben 2), feldolgozott: 131, a gyűrűben marad: 72"}, {"t": 12, "arr": 0, "mode": "POLL", "trans": "loop", "irq": 4, "polls": 6, "done": 195, "ring": 8, "wd": 64, "line": 5, "msg": "t = 12: poll – work_done = 64 = budget: poll módban marad, újra poll  |  IRQ-k: 4 (a löketben 1), pollok: 6 (a löketben 3), feldolgozott: 195, a gyűrűben marad: 8"}, {"t": 13, "arr": 0, "mode": "IRQ", "trans": "poll2irq", "irq": 4, "polls": 7, "done": 203, "ring": 0, "wd": 8, "line": 4, "msg": "t = 13: poll – work_done = 8 < budget = 64: napi_complete_done(), IRQ engedélyezve → IRQ mód  |  IRQ-k: 4 (a löketben 1), pollok: 7 (a löketben 4), feldolgozott: 203, a gyűrűben marad: 0"}];
const CODE = ["isr():                         /* eszköz-IRQ: van új csomag a gyűrűben */", "    eszköz IRQ letiltása; napi_schedule(&napi);       /* → poll mód */", "poll(napi, budget):", "    work_done = feldolgoz(legfeljebb budget csomagot);", "    if (work_done < budget) { napi_complete_done(napi, work_done); eszköz IRQ engedélyezése; }  /* → IRQ mód */", "    return work_done;              /* == budget: poll módban marad, a poll újra lefut */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  const poll = s.mode === "POLL";
  el("rect", {x: 20, y: 20, width: 220, height: 70, rx: 18, fill: css("--cell"), stroke: !poll ? css("--hl") : css("--line"), "stroke-width": !poll ? 4 : 1.2});
  el("rect", {x: 26, y: 26, width: 208, height: 58, rx: 14, fill: "none", stroke: css("--line")});
  el("text", {x: 130, y: 52, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "IRQ mód");
  el("text", {x: 130, y: 70, "text-anchor": "middle", "font-size": 11}, "(eszköz-IRQ engedélyezve)");
  el("rect", {x: 20, y: 200, width: 220, height: 70, rx: 18, fill: css("--cellhl"), stroke: poll ? css("--hl") : css("--line"), "stroke-width": poll ? 4 : 2});
  el("text", {x: 130, y: 230, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Poll mód");
  el("text", {x: 130, y: 248, "text-anchor": "middle", "font-size": 11}, "(IRQ tiltva, NAPI ütemezve)");
  const tc = (t) => s.trans === t ? css("--hl") : css("--line"), tw = (t) => s.trans === t ? 3.5 : 1.4;
  el("line", {x1: 70, y1: 92, x2: 70, y2: 192, stroke: tc("irq2poll"), "stroke-width": tw("irq2poll")});
  el("path", {d: "M70,198 l-6,-10 l12,0 Z", fill: tc("irq2poll")});
  el("text", {x: 10, y: 140, "font-size": 10.5}, "csomag-IRQ:");
  el("text", {x: 10, y: 154, "font-size": 10.5}, "napi_schedule()");
  el("line", {x1: 190, y1: 198, x2: 190, y2: 98, stroke: tc("poll2irq"), "stroke-width": tw("poll2irq"), "stroke-dasharray": "6 3"});
  el("path", {d: "M190,92 l-6,10 l12,0 Z", fill: tc("poll2irq")});
  el("text", {x: 198, y: 140, "font-size": 10.5}, "work_done < budget:");
  el("text", {x: 198, y: 154, "font-size": 10.5}, "napi_complete_done()");
  el("path", {d: "M240,220 C300,200 300,280 240,258", fill: "none", stroke: tc("loop"), "stroke-width": tw("loop")});
  el("path", {d: "M240,258 l10,-1 l-5,9 Z", fill: tc("loop")});
  el("text", {x: 250, y: 290, "font-size": 10.5}, "work_done == budget: újra poll");
  // idővonal: az eddigi pollok
  const X0 = 360, W = 270, B = BUD;
  el("text", {x: X0, y: 20, "font-size": 12, "font-weight": "bold"}, `t = ${s.t}   IRQ-k: ${s.irq}   pollok: ${s.polls}   feldolgozott: ${s.done}`);
  el("text", {x: X0, y: 38, "font-size": 11, fill: css("--muted")}, `a gyűrűben: ${s.ring} csomag · budget = ${B}`);
  const hist = STEPS.slice(1, k + 1).filter(q => q.wd !== null).slice(-14);
  const bw = W / 14, H = 180, base = 250, sc = H / Math.max(B, 1);
  el("line", {x1: X0, y1: base - B * sc, x2: X0 + W, y2: base - B * sc, stroke: css("--line"), "stroke-dasharray": "2 3"});
  el("text", {x: X0 + W, y: base - B * sc - 4, "text-anchor": "end", "font-size": 10}, "budget");
  hist.forEach((q, i) => {
    const h = q.wd * sc, x = X0 + i * bw;
    el("rect", {x: x + 2, y: base - h, width: bw - 4, height: Math.max(h, 1), fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: x + bw / 2, y: base - h - 3, "text-anchor": "middle", "font-size": 9}, String(q.wd));
    el("text", {x: x + bw / 2, y: base + 14, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, "t" + q.t);
  });
  el("line", {x1: X0, y1: base, x2: X0 + W, y2: base, stroke: css("--line")});
  el("text", {x: X0, y: base + 34, "font-size": 10.5, fill: css("--muted")}, "oszlop = egy poll work_done értéke (utolsó 14)");
}
let BUD = 64;
function arrivals(rate, burst){ const arr = {1: 1, 4: 1, 7: 1}; let t = 10, left = burst;
  while (left > 0) { arr[t] = Math.min(rate, left); left -= arr[t]; t++; } return arr; }
function simulate(budget, rate, burst){
  const arr = arrivals(rate, burst); let mode = "IRQ", ring = 0, irq = 0, polls = 0, done = 0;
  const st = [{t: 0, arr: 0, mode: "IRQ", trans: null, irq: 0, polls: 0, done: 0, ring: 0, wd: null, line: -1,
               msg: "Kezdetben: IRQ mód (eszköz-IRQ engedélyezve), üres gyűrű  |  IRQ-k: 0, pollok: 0, feldolgozott: 0"}];
  const tmax = Math.max(...Object.keys(arr).map(Number)) + 1 + Math.floor(burst / Math.max(1, budget)) + 3;
  let lowI = null, lowP = null;
  const cnt = () => lowI === null ? `IRQ-k: ${irq}, pollok: ${polls}, feldolgozott: ${done}` :
    `IRQ-k: ${irq} (a löketben ${irq - lowI}), pollok: ${polls} (a löketben ${polls - lowP}), feldolgozott: ${done}`;
  for (let t = 0; t <= tmax; t++) {
    if (t === 10) { lowI = irq; lowP = polls; }
    const a = arr[t] || 0; ring += a; let ev = false;
    if (mode === "IRQ" && ring > 0) { irq++; mode = "POLL"; ev = true;
      st.push({t, arr: a, mode: "POLL", trans: "irq2poll", irq, polls, done, ring, wd: null, line: 1,
               msg: `t = ${t}: ${a} csomag érkezik; csomag-IRQ, az ISR letiltja az IRQ-t, napi_schedule() → poll mód  |  ${cnt()}`}); }
    if (mode === "POLL") {
      const wd = Math.min(budget, ring); ring -= wd; polls++; done += wd; let trans, line, txt;
      if (wd < budget) { mode = "IRQ"; trans = "poll2irq"; line = 4; txt = `work_done = ${wd} < budget = ${budget}: napi_complete_done(), IRQ engedélyezve → IRQ mód`; }
      else { trans = "loop"; line = 5; txt = `work_done = ${wd} = budget: poll módban marad, újra poll`; }
      st.push({t, arr: ev ? 0 : a, mode, trans, irq, polls, done, ring, wd, line,
               msg: `t = ${t}: poll – ${txt}  |  ${cnt()}, a gyűrűben marad: ${ring}`});
    }
  }
  return st;
}
function load(){
  const r = +document.getElementById("rate").value, b = +document.getElementById("bud").value;
  document.getElementById("rv").textContent = r; document.getElementById("bv").textContent = b;
  BUD = b; setSteps(simulate(b, r, 200));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
