<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHCP DORA, relay és lease</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="rl" type="checkbox" onchange="relay()"> relay (a szerver másik alhálózaton)</label><label>lease-idő <input id="ls" type="range" min="0" max="62" step="0.5" value="0" oninput="lease(this.value)" aria-label="Idő az Ack óta, perc"></label><span id="lt" class="small">0,0 perc</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="DHCP szekvenciadiagram a négy üzenettel és az aktuális üzenet mezőivel (IP- és MAC-cím, xid, yiaddr, giaddr, opciók); alatta a lease-idővonal T1 = 30 és T2 = 52,5 perccel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Labor: kliens 52:54:00:ab:cd:ef, cím 192.168.150.20, szerver 192.168.150.1, lease 1 h. Az xid és a relay túloldali címei (192.0.2.1, 192.0.2.10) szemléltető példák. T1 = 50%, T2 = 87,5% (RFC 2131 alapértékek).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "relay": false, "name": "DHCPDISCOVER", "frm": "kliens", "to": "szerver", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=DISCOVER, 55=1,3,6,15"}, "line": -1, "msg": "1. DHCPDISCOVER: kliens → szerver (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 1, "relay": false, "name": "DHCPOFFER", "frm": "szerver", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "0.0.0.0", "opts": "53=OFFER, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1"}, "line": -1, "msg": "2. DHCPOFFER: szerver → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326"}, {"i": 2, "relay": false, "name": "DHCPREQUEST", "frm": "kliens", "to": "szerver", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=REQUEST, 50=192.168.150.20, 54=192.168.150.1"}, "line": -1, "msg": "3. DHCPREQUEST: kliens → szerver (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 3, "relay": false, "name": "DHCPACK", "frm": "szerver", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "0.0.0.0", "opts": "53=ACK, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1, 58=1800, 59=3150"}, "line": -1, "msg": "4. DHCPACK: szerver → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"direct": [{"i": 0, "relay": false, "name": "DHCPDISCOVER", "frm": "kliens", "to": "szerver", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=DISCOVER, 55=1,3,6,15"}, "line": -1, "msg": "1. DHCPDISCOVER: kliens → szerver (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 1, "relay": false, "name": "DHCPOFFER", "frm": "szerver", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "0.0.0.0", "opts": "53=OFFER, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1"}, "line": -1, "msg": "2. DHCPOFFER: szerver → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326"}, {"i": 2, "relay": false, "name": "DHCPREQUEST", "frm": "kliens", "to": "szerver", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=REQUEST, 50=192.168.150.20, 54=192.168.150.1"}, "line": -1, "msg": "3. DHCPREQUEST: kliens → szerver (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 3, "relay": false, "name": "DHCPACK", "frm": "szerver", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "0.0.0.0", "opts": "53=ACK, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1, 58=1800, 59=3150"}, "line": -1, "msg": "4. DHCPACK: szerver → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326"}], "relay": [{"i": 0, "relay": true, "name": "DHCPDISCOVER", "frm": "kliens", "to": "relay", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=DISCOVER, 55=1,3,6,15"}, "line": -1, "msg": "1. DHCPDISCOVER: kliens → relay (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 1, "relay": true, "name": "DHCPDISCOVER (továbbítva)", "frm": "relay", "to": "szerver", "bc": false, "f": {"src_ip": "192.0.2.1:67", "dst_ip": "192.0.2.10:67", "src_mac": "(router)", "dst_mac": "(szerver)", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "192.168.150.1", "opts": "53=DISCOVER, 55=1,3,6,15"}, "line": -1, "msg": "2. DHCPDISCOVER (továbbítva): relay → szerver (unicast); 192.0.2.1:67 → 192.0.2.10:67, xid 0x3903F326, giaddr 192.168.150.1"}, {"i": 2, "relay": true, "name": "DHCPOFFER", "frm": "szerver", "to": "relay", "bc": false, "f": {"src_ip": "192.0.2.10:67", "dst_ip": "192.168.150.1:67", "src_mac": "(szerver)", "dst_mac": "(router)", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "192.168.150.1", "opts": "53=OFFER, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1"}, "line": -1, "msg": "3. DHCPOFFER: szerver → relay (unicast); 192.0.2.10:67 → 192.168.150.1:67, xid 0x3903F326, giaddr 192.168.150.1"}, {"i": 3, "relay": true, "name": "DHCPOFFER (a kliensnek)", "frm": "relay", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "192.168.150.1", "opts": "53=OFFER, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1"}, "line": -1, "msg": "4. DHCPOFFER (a kliensnek): relay → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326, giaddr 192.168.150.1"}, {"i": 4, "relay": true, "name": "DHCPREQUEST", "frm": "kliens", "to": "relay", "bc": true, "f": {"src_ip": "0.0.0.0:68", "dst_ip": "255.255.255.255:67", "src_mac": "52:54:00:ab:cd:ef", "dst_mac": "FF:FF:FF:FF:FF:FF", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "0.0.0.0", "opts": "53=REQUEST, 50=192.168.150.20, 54=192.168.150.1"}, "line": -1, "msg": "5. DHCPREQUEST: kliens → relay (broadcast); 0.0.0.0:68 → 255.255.255.255:67, xid 0x3903F326"}, {"i": 5, "relay": true, "name": "DHCPREQUEST (továbbítva)", "frm": "relay", "to": "szerver", "bc": false, "f": {"src_ip": "192.0.2.1:67", "dst_ip": "192.0.2.10:67", "src_mac": "(router)", "dst_mac": "(szerver)", "xid": "0x3903F326", "yiaddr": "0.0.0.0", "giaddr": "192.168.150.1", "opts": "53=REQUEST, 50=192.168.150.20, 54=192.168.150.1"}, "line": -1, "msg": "6. DHCPREQUEST (továbbítva): relay → szerver (unicast); 192.0.2.1:67 → 192.0.2.10:67, xid 0x3903F326, giaddr 192.168.150.1"}, {"i": 6, "relay": true, "name": "DHCPACK", "frm": "szerver", "to": "relay", "bc": false, "f": {"src_ip": "192.0.2.10:67", "dst_ip": "192.168.150.1:67", "src_mac": "(szerver)", "dst_mac": "(router)", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "192.168.150.1", "opts": "53=ACK, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1, 58=1800, 59=3150"}, "line": -1, "msg": "7. DHCPACK: szerver → relay (unicast); 192.0.2.10:67 → 192.168.150.1:67, xid 0x3903F326, giaddr 192.168.150.1"}, {"i": 7, "relay": true, "name": "DHCPACK (a kliensnek)", "frm": "relay", "to": "kliens", "bc": false, "f": {"src_ip": "192.168.150.1:67", "dst_ip": "192.168.150.20:68", "src_mac": "52:54:00:00:01:01", "dst_mac": "52:54:00:ab:cd:ef", "xid": "0x3903F326", "yiaddr": "192.168.150.20", "giaddr": "192.168.150.1", "opts": "53=ACK, 1=255.255.255.0, 3=192.168.150.1, 6=192.168.150.1, 51=3600, 54=192.168.150.1, 58=1800, 59=3150"}, "line": -1, "msg": "8. DHCPACK (a kliensnek): relay → kliens (unicast); 192.168.150.1:67 → 192.168.150.20:68, xid 0x3903F326, giaddr 192.168.150.1"}]}, LEASE = 3600, T1 = 1800.0, T2 = 3150.0;
let LT = 0;
function render(s){
  svg.setAttribute("viewBox", "0 0 680 400"); svg.innerHTML = "";
  const hl = css("--hl"), seq = s.relay ? ALL.relay : ALL.direct;
  const XS = s.relay ? {kliens: 50, relay: 170, szerver: 290} : {kliens: 50, szerver: 230};
  const NM = s.relay ? {kliens: "kliens", relay: "relay (router)", szerver: "DHCP-szerver"} : {kliens: "kliens", szerver: "DHCP-szerver"};
  Object.keys(XS).forEach(n => { el("rect", {x: XS[n] - 48, y: 8, width: 96, height: 22, rx: 4, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: XS[n], y: 23, "text-anchor": "middle", "font-size": 11}, NM[n]);
    el("line", {x1: XS[n], y1: 30, x2: XS[n], y2: 262, stroke: css("--muted")}); });
  const dy = s.relay ? 28 : 54;
  seq.forEach((m, i) => { if (i > s.i) return; const y = 50 + i * dy, cur = i === s.i, x0 = XS[m.frm], x1 = XS[m.to];
    el("line", {x1: x0, y1: y, x2: x1 + (x1 > x0 ? -6 : 6), y2: y, stroke: cur ? hl : css("--fg"), "stroke-width": cur ? 3 : 1.5, "stroke-dasharray": m.bc ? "7 4" : "none"});
    el("path", {d: `M${x1},${y} l${x1 > x0 ? -9 : 9},-5 l0,10 Z`, fill: cur ? hl : css("--fg")});
    el("text", {x: (x0 + x1) / 2, y: y - 5, "text-anchor": "middle", "font-size": 10.5, "font-weight": cur ? "bold" : "normal"}, m.name.replace("DHCP", "").replace(" (továbbítva)", " ⇢").replace(" (a kliensnek)", " ⇢")); });
  const f = s.f, rows = [["üzenet", s.name], ["L3", f.src_ip + " → " + f.dst_ip], ["L2", f.src_mac + " → " + f.dst_mac], ["xid", f.xid], ["yiaddr", f.yiaddr], ["giaddr", f.giaddr], ["opciók", f.opts], ["címzés", s.bc ? "broadcast (szaggatott)" : "unicast (folytonos)"]];
  rows.forEach(([a, b], i) => { const y = 46 + i * 26;
    el("text", {x: 352, y, "font-size": 11, fill: css("--muted")}, a);
    const t = el("text", {x: 410, y, "font-size": 11, "font-weight": (a === "giaddr" && b !== "0.0.0.0") ? "bold" : "normal"}, b.length > 40 ? b.slice(0, 40) + "…" : b);
    if (b.length > 40) el("text", {x: 410, y: y + 13, "font-size": 11}, b.slice(40)); });
  // lease-idővonal
  const X = t => 40 + t / LEASE * 560, yb = 300;
  [[0, T1, "BOUND"], [T1, T2, "RENEWING"], [T2, LEASE, "REBINDING"]].forEach(([a, b, t], i) => {
    el("rect", {x: X(a), y: yb, width: X(b) - X(a), height: 22, fill: css(i ? "--cellhl" : "--cell"), stroke: css("--line"), opacity: i === 2 ? 0.7 : 1});
    el("text", {x: (X(a) + X(b)) / 2, y: yb + 15, "text-anchor": "middle", "font-size": 10.5}, t); });
  [[0, "0 (Ack)"], [T1, "T1 = 30 perc"], [T2, "T2 = 52,5 perc"], [LEASE, "60 perc"]].forEach(([t, l]) => {
    el("line", {x1: X(t), y1: yb - 4, x2: X(t), y2: yb + 28, stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: X(t), y: yb + 42, "text-anchor": "middle", "font-size": 10.5}, l); });
  el("path", {d: `M${X(LT)},${yb - 4} l-7,-11 l14,0 Z`, fill: hl});
  const st = LT < T1 ? "BOUND: a cím használható, nincs forgalom" : LT < T2 ? "RENEWING: unicast DHCPREQUEST a kiosztó szervernek (" + "192.168.150.1)" : LT < LEASE ? "REBINDING: broadcast DHCPREQUEST bármely szervernek" : "lejárt: a cím feladva, új DORA (Discover)";
  el("text", {x: 40, y: 386, "font-size": 12, "font-weight": "bold"}, `t = ${(LT / 60).toFixed(1).replace(".", ",")} perc: ${st}`);
}
function relay(){ setSteps(document.getElementById("rl").checked ? ALL.relay : ALL.direct); }
function lease(v){ LT = +v * 60; document.getElementById("lt").textContent = (+v).toFixed(1).replace(".", ",") + " perc"; show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
