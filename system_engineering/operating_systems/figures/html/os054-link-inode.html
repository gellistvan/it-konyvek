<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hard link és szimbolikus link</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>cél <input id="tg" value="file1" size="9" aria-label="Cél neve"></label><label>név <input id="nm" value="link2" size="9" aria-label="Új vagy törlendő név"></label><button onclick="op('ln')">ln cél név</button><button onclick="op('lns')">ln -s cél név</button><button onclick="op('rm')">rm név</button><button onclick="op('mv')">mv cél név</button><button onclick="resetFS()">alaphelyzet</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Könyvtártábla a nevekkel; két név ugyanarra a 14-es inode-ra mutat, a symlink saját 15-ös inode-ja a file1 nevet tárolja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az inode-számok a fejezet mintakimenetéből (futásonként eltérhetnek). A gombok a 3. lépés (ln -s) állapotából indulnak; a „cél” az ln/ln -s forrása, illetve az mv régi neve. Tömör vonal = inode-hivatkozás, szaggatott = útvonal-feloldás, pontozott = blokkmutató.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"dir": [[".", 12], ["..", 2]], "ino": {}, "cmd": "kezdet", "msg": "kezdet: üres lab könyvtár (. és ..)  |  nincs inode", "line": -1}, {"dir": [[".", 12], ["..", 2], ["file1", 14]], "ino": {"14": {"type": "-", "mode": "-rw-r--r--", "links": 1, "size": 17, "data": "hello filesystem\n"}}, "cmd": "echo \"hello filesystem\" > file1", "msg": "echo \"hello filesystem\" > file1: új inode (14), egy név; 17 bájt  |  links(14) = 1", "line": -1}, {"dir": [[".", 12], ["..", 2], ["file1", 14], ["hardlink1", 14]], "ino": {"14": {"type": "-", "mode": "-rw-r--r--", "links": 2, "size": 17, "data": "hello filesystem\n"}}, "cmd": "ln file1 hardlink1", "msg": "ln file1 hardlink1: új név ugyanarra az inode-ra; a link count 2  |  links(14) = 2", "line": -1}, {"dir": [[".", 12], ["..", 2], ["file1", 14], ["hardlink1", 14], ["symlink1", 15]], "ino": {"14": {"type": "-", "mode": "-rw-r--r--", "links": 2, "size": 17, "data": "hello filesystem\n"}, "15": {"type": "l", "mode": "lrwxrwxrwx", "links": 1, "size": 5, "data": "file1"}}, "cmd": "ln -s file1 symlink1", "msg": "ln -s file1 symlink1: saját inode (15), tartalma a „file1” útvonal (5 bájt)  |  links(14) = 2, links(15) = 1; symlink1 → feloldható", "line": -1}, {"dir": [[".", 12], ["..", 2], ["hardlink1", 14], ["symlink1", 15]], "ino": {"14": {"type": "-", "mode": "-rw-r--r--", "links": 1, "size": 17, "data": "hello filesystem\n"}, "15": {"type": "l", "mode": "lrwxrwxrwx", "links": 1, "size": 5, "data": "file1"}}, "cmd": "rm file1", "msg": "rm file1: a név eltűnik, az inode a hardlink1 miatt megmarad; a symlink1 törött  |  links(14) = 1, links(15) = 1; symlink1 → törött", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  const rows = s.dir, inos = Object.keys(s.ino).map(Number).sort((a, b) => a - b);
  const H = Math.max(300, 50 + rows.length * 34, 40 + inos.length * 112);
  svg.setAttribute("viewBox", `0 0 640 ${H}`); svg.innerHTML = "";
  el("text", {x: 10, y: 20, "font-size": 12.5, "font-weight": "bold"}, "lab könyvtár (név | inode)");
  const ry = {};
  rows.forEach(([n, i], r) => { const y = 34 + r * 34; ry[n] = y + 14;
    el("rect", {x: 10, y, width: 190, height: 28, fill: css("--cell"), stroke: css("--line")});
    el("line", {x1: 140, y1: y, x2: 140, y2: y + 28, stroke: css("--line")});
    el("text", {x: 18, y: y + 19, "font-size": 13, style: "font-family:ui-monospace,monospace"}, n);
    el("text", {x: 150, y: y + 19, "font-size": 13, style: "font-family:ui-monospace,monospace"}, String(i)); });
  const iy = {};
  inos.forEach((i, j) => { const v = s.ino[i], y = 30 + j * 112; iy[i] = y;
    el("rect", {x: 290, y, width: 170, height: 100, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2});
    [`inode ${i}`, v.mode, `links = ${v.links}`, `size = ${v.size}`, v.type === "-" ? "blokk → adat" : `tartalom: „${v.data}”`]
      .forEach((t, q) => el("text", {x: 300, y: y + 20 + q * 18, "font-size": 12.5, style: "font-family:ui-monospace,monospace", "font-weight": q === 2 ? "bold" : "normal"}, t));
    if (v.type === "-") { el("rect", {x: 500, y: y + 25, width: 130, height: 46, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: 565, y: y + 53, "text-anchor": "middle", "font-size": 12}, "„hello filesystem\\n”");
      el("line", {x1: 460, y1: y + 48, x2: 496, y2: y + 48, stroke: css("--line"), "stroke-dasharray": "2 3", "stroke-width": 1.5}); } });
  rows.forEach(([n, i]) => { if (iy[i] === undefined || n === "." || n === "..") return;
    el("line", {x1: 200, y1: ry[n], x2: 286, y2: iy[i] + 50, stroke: css("--line"), "stroke-width": 1.5});
    el("circle", {cx: 286, cy: iy[i] + 50, r: 3, fill: css("--line")}); });
  inos.forEach(i => { const v = s.ino[i]; if (v.type !== "l") return;
    const tgt = rows.find(e => e[0] === v.data), y0 = iy[i] + 90;
    if (tgt) { el("path", {d: `M290,${y0} C240,${y0} 250,${ry[v.data]} 204,${ry[v.data]}`, fill: "none", stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "6 4"}); }
    else { el("path", {d: `M290,${y0} C250,${y0} 250,${y0 + 20} 215,${y0 + 20}`, fill: "none", stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "6 4"});
      el("text", {x: 210, y: y0 + 38, "font-size": 12, "font-weight": "bold", fill: css("--hl")}, `× „${v.data}”: nincs ilyen név (törött)`); } });
}
let H_FS = null, HIST = null;
function fsInit(){ return {dir: [[".", 12], ["..", 2]], ino: {}, next: 14}; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function look(f, n){ const e = f.dir.find(x => x[0] === n); return e ? e[1] : null; }
function snapFS(f, msg, cmd){ const ids = Object.keys(f.ino).map(Number).sort((a, b) => a - b);
  const links = ids.map(i => `links(${i}) = ${f.ino[i].links}`).join(", ");
  const syms = f.dir.filter(e => f.ino[e[1]] && f.ino[e[1]].type === "l").map(e => `${e[0]} → ` + (look(f, f.ino[e[1]].data) !== null ? "feloldható" : "törött")).join(", ");
  return {dir: clone(f.dir), ino: clone(f.ino), cmd, line: -1, msg: `${cmd}: ${msg}  |  ${links || "nincs inode"}` + (syms ? "; " + syms : "")}; }
function rebuild(){ // a beépített lépések újrajátszása, az utolsó (rm file1) nélkül
  const f = fsInit(); f.ino[14] = {type: "-", mode: "-rw-r--r--", links: 1, size: 17, data: "hello filesystem\n"}; f.dir.push(["file1", 14]);
  f.ino[14].links++; f.dir.push(["hardlink1", 14]);
  f.ino[15] = {type: "l", mode: "lrwxrwxrwx", links: 1, size: 5, data: "file1"}; f.dir.push(["symlink1", 15]); f.next = 16; return f; }
function op(kind){
  if (!H_FS) { H_FS = rebuild(); HIST = STEPS.slice(0, 4); }
  const f = H_FS, nm = document.getElementById("nm").value.trim(), tg = document.getElementById("tg").value.trim();
  const err = m => { document.getElementById("err").textContent = m; };
  err("");
  if (!/^[A-Za-z0-9._-]{1,16}$/.test(nm)) return err("A név 1–16 betű/szám/._- karakter legyen.");
  if (kind === "ln") { const i = look(f, tg); if (i === null || f.ino[i].type === "l") return err(`ln: „${tg}” nem létező reguláris fájl.`);
    if (look(f, nm) !== null) return err(`„${nm}” már létezik.`); f.ino[i].links++; f.dir.push([nm, i]); HIST.push(snapFS(f, "új név ugyanarra az inode-ra", `ln ${tg} ${nm}`)); }
  if (kind === "lns") { if (look(f, nm) !== null) return err(`„${nm}” már létezik.`); const i = f.next++;
    f.ino[i] = {type: "l", mode: "lrwxrwxrwx", links: 1, size: new TextEncoder().encode(tg).length, data: tg}; f.dir.push([nm, i]);
    HIST.push(snapFS(f, "saját inode, tartalma az útvonal", `ln -s ${tg} ${nm}`)); }
  if (kind === "rm") { const i = look(f, nm); if (i === null || nm === "." || nm === "..") return err(`rm: „${nm}” nincs.`);
    f.dir = f.dir.filter(e => e[0] !== nm); f.ino[i].links--; let t = "a név eltűnik";
    if (f.ino[i].links === 0) { delete f.ino[i]; t += ", az inode felszabadul (links = 0, nincs nyitott leíró)"; }
    HIST.push(snapFS(f, t, `rm ${nm}`)); }
  if (kind === "mv") { const e = f.dir.find(x => x[0] === tg); if (!e || tg === "." || tg === "..") return err(`mv: „${tg}” nincs.`);
    if (look(f, nm) !== null) return err(`„${nm}” már létezik.`); e[0] = nm; HIST.push(snapFS(f, "csak a név változik, az inode ugyanaz", `mv ${tg} ${nm}`)); }
  setSteps(HIST.slice()); show(HIST.length - 1);
}
function resetFS(){ H_FS = null; HIST = null; setSteps(ORIG); show(3); }
const ORIG = STEPS.slice();
setTimeout(() => show(3), 0);   /* kezdőállapot = a statikus ábra bal panelje */


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
