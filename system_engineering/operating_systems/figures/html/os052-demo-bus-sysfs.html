<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A demo_bus illesztése és a sysfs</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="fail" type="checkbox" onchange="setMode()"> hibaszimuláció: probe → −ENOMEM</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Busz, eszköz és meghajtó dobozai számozott regisztrációs, match, probe és remove lépésekkel, mellette a sysfs-fa."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus: a sysfs-fa a driver core szokásos elrendezése (a bind/unbind/uevent/module bejegyzések nélkül), nem egy futtatott vendég kimenete; a fa a /sys/bus/demo_bus/ és a /sys/devices/demo0/ alatti bejegyzéseket mutatja. Szaggatott keret = szimbolikus link.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [], "dmesg": "", "k": 0, "ev": "kezdet", "line": -1, "arrow": 0, "msg": "Kezdetben: egyik modul sincs betöltve; nincs /sys/bus/demo_bus"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 1, "ev": "insmod demo_bus.ko", "line": 1, "arrow": 1, "msg": "(1) insmod demo_bus.ko: bus_register, majd device_add → a demo0 a busz eszközlistájára kerül; megjelenik a /sys/bus/demo_bus/devices/demo0 link és a demo_attr"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 2, "ev": "insmod demo_drv.ko", "line": 2, "arrow": 2, "msg": "(2) insmod demo_drv.ko: driver_register → a demo0 driver a busz driverlistájára kerül (drivers/demo0/)"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 3, "ev": "match", "line": 3, "arrow": 3, "msg": "(3) demo_match: strcmp(\"demo0\", \"demo0\") == 0 → igaz: a kernel megkísérli a hozzárendelést"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": "demo0", "drvdata": "0x1", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["drivers/demo0/demo0 → ../../../../devices/demo0", "link"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"], ["driver → ../../bus/demo_bus/drivers/demo0", "link"]], "dmesg": "demo_probe: device demo0 matched", "bus": true, "k": 4, "ev": "probe", "line": 4, "arrow": 4, "msg": "(4) demo_probe → 0: dev->driver = demo0, drvdata = 0x1; létrejön a drivers/demo0/demo0 és a /sys/devices/demo0/driver link"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "NULL", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "demo_remove: device demo0 removed", "bus": true, "k": 5, "ev": "rmmod demo_drv", "line": 5, "arrow": 5, "msg": "(5) rmmod demo_drv: demo_remove, drvdata = NULL; a driver kikerül a listából, a drivers/demo0/ eltűnik"}, {"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": true, "tree": [], "dmesg": "", "bus": false, "k": 6, "ev": "rmmod demo_bus", "line": 7, "arrow": 7, "msg": "(6) rmmod demo_bus: device_unregister, bus_unregister → a /sys/bus/demo_bus eltűnik"}];
const CODE = ["demo_init():   bus_register(&demo_bus); device_initialize(&demo_dev->dev); dev_set_name(…, \"demo0\");", "               device_add(&demo_dev->dev);  device_create_file(…, &dev_attr_demo_attr);", "demo_drv_init(): driver_register(&demo_driver);          /* .name = \"demo0\", .bus = &demo_bus */", "demo_match(dev, drv): return strcmp(ddev->name, drv->name) == 0;     /* \"demo0\" vs \"demo0\" */", "demo_probe(dev): dev_info(dev, \"demo_probe: device %s matched\\n\", …); dev_set_drvdata(dev, (void *)0x1); return 0;", "demo_remove(dev): dev_info(dev, \"demo_remove: device %s removed\\n\", …); dev_set_drvdata(dev, NULL);", "demo_drv_exit(): driver_unregister(&demo_driver);", "demo_exit():   device_remove_file(…); device_unregister(&demo_dev->dev); bus_unregister(&demo_bus);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const hl = css("--hl"), ln = css("--line");
  const bx = (x, y, w, h, on) => el("rect", {x, y, width: w, height: h, rx: 6, fill: css("--cell"), stroke: on ? hl : ln, "stroke-width": on ? 3 : 1.2});
  bx(70, 10, 200, 78, s.bus);
  el("text", {x: 170, y: 30, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "bus_type demo_bus");
  el("text", {x: 82, y: 54, "font-size": 12}, "eszközök: " + (s.busdevs.join(", ") || "—"));
  el("text", {x: 82, y: 76, "font-size": 12}, "driverek: " + (s.busdrvs.join(", ") || "—"));
  bx(10, 190, 150, 92, s.k === 1 || s.k === 4);
  el("text", {x: 85, y: 210, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, "device demo0");
  el("text", {x: 20, y: 232, "font-size": 11}, "name = \"demo0\"");
  el("text", {x: 20, y: 252, "font-size": 11}, "driver = " + (s.driver ? s.driver : "NULL"));
  el("text", {x: 20, y: 272, "font-size": 11}, "drvdata = " + s.drvdata);
  bx(180, 190, 150, 92, s.k === 2 || s.k === 4 || s.k === 5);
  el("text", {x: 255, y: 210, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, "device_driver demo0");
  el("text", {x: 190, y: 236, "font-size": 11}, ".probe = demo_probe");
  el("text", {x: 190, y: 256, "font-size": 11}, ".remove = demo_remove");
  el("text", {x: 190, y: 276, "font-size": 11}, s.busdrvs.length ? "regisztrálva" : "nincs regisztrálva");
  const arr = (x1, y1, x2, y2, n, txt, on, dash) => { const c = on ? hl : css("--muted");
    const a = {x1, y1, x2, y2, stroke: c, "stroke-width": on ? 3 : 1.2}; if (dash) a["stroke-dasharray"] = "5 3"; el("line", a);
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
    el("path", {d: `M${x2},${y2} L${x2 - 9 * ux - 4 * uy},${y2 - 9 * uy + 4 * ux} L${x2 - 9 * ux + 4 * uy},${y2 - 9 * uy - 4 * ux} Z`, fill: c});
    el("text", {x: (x1 + x2) / 2 + 4, y: (y1 + y2) / 2, "font-size": 11, fill: c, "font-weight": on ? "bold" : "normal"}, `(${n}) ${txt}`); };
  arr(60, 186, 110, 92, 1, "device_add", s.k === 1);
  arr(270, 186, 230, 92, 2, "driver_register", s.k === 2);
  arr(170, 92, 170, 150, 3, "match", s.k === 3);
  arr(178, 236, 162, 236, 4, "", s.k === 4);
  el("text", {x: 100, y: 300, "font-size": 11, fill: s.k === 4 ? hl : css("--muted"), "font-weight": s.k === 4 ? "bold" : "normal"}, s.k === 4 ? (s.driver ? "(4) probe → 0" : "(4) probe → −ENOMEM") : "(4) probe  (5) remove");
  // sysfs-fa
  el("text", {x: 350, y: 20, "font-size": 12.5, "font-weight": "bold"}, "sysfs");
  let y = 42;
  if (!s.tree.length) el("text", {x: 350, y, "font-size": 12, fill: css("--muted")}, "(nincs /sys/bus/demo_bus)");
  s.tree.forEach(([n, kd]) => {
    let ind = 0, lab = n;
    if (n === "devices/" || n === "drivers/" || n === "demo_attr" || n.startsWith("driver →")) ind = 1;
    if (n.startsWith("devices/demo0")) { ind = 2; lab = n.slice(8); }
    if (n === "drivers/demo0/") { ind = 2; lab = "demo0/"; }
    if (n.startsWith("drivers/demo0/demo0")) { ind = 3; lab = "demo0 → ../../../../devices/demo0"; }
    const t = el("text", {x: 350 + ind * 16, y, "font-size": 11.5, class: "mono", style: "font-family:ui-monospace,monospace"}, lab);
    if (kd === "link") { const b = t.getBBox(); el("rect", {x: b.x - 3, y: b.y - 1, width: b.width + 6, height: b.height + 2, fill: "none", stroke: ln, "stroke-dasharray": "4 3"}); }
    y += 21;
  });
  el("text", {x: 350, y: 300, "font-size": 11.5, fill: css("--muted")}, "dmesg:");
  el("text", {x: 350, y: 318, "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, s.dmesg || "—");
}
const OK = [{"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [], "dmesg": "", "k": 0, "ev": "kezdet", "line": -1, "arrow": 0, "msg": "Kezdetben: egyik modul sincs betöltve; nincs /sys/bus/demo_bus"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 1, "ev": "insmod demo_bus.ko", "line": 1, "arrow": 1, "msg": "(1) insmod demo_bus.ko: bus_register, majd device_add → a demo0 a busz eszközlistájára kerül; megjelenik a /sys/bus/demo_bus/devices/demo0 link és a demo_attr"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 2, "ev": "insmod demo_drv.ko", "line": 2, "arrow": 2, "msg": "(2) insmod demo_drv.ko: driver_register → a demo0 driver a busz driverlistájára kerül (drivers/demo0/)"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 3, "ev": "match", "line": 3, "arrow": 3, "msg": "(3) demo_match: strcmp(\"demo0\", \"demo0\") == 0 → igaz: a kernel megkísérli a hozzárendelést"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": "demo0", "drvdata": "0x1", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["drivers/demo0/demo0 → ../../../../devices/demo0", "link"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"], ["driver → ../../bus/demo_bus/drivers/demo0", "link"]], "dmesg": "demo_probe: device demo0 matched", "bus": true, "k": 4, "ev": "probe", "line": 4, "arrow": 4, "msg": "(4) demo_probe → 0: dev->driver = demo0, drvdata = 0x1; létrejön a drivers/demo0/demo0 és a /sys/devices/demo0/driver link"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "NULL", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "demo_remove: device demo0 removed", "bus": true, "k": 5, "ev": "rmmod demo_drv", "line": 5, "arrow": 5, "msg": "(5) rmmod demo_drv: demo_remove, drvdata = NULL; a driver kikerül a listából, a drivers/demo0/ eltűnik"}, {"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": true, "tree": [], "dmesg": "", "bus": false, "k": 6, "ev": "rmmod demo_bus", "line": 7, "arrow": 7, "msg": "(6) rmmod demo_bus: device_unregister, bus_unregister → a /sys/bus/demo_bus eltűnik"}], FAIL = [{"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [], "dmesg": "", "k": 0, "ev": "kezdet", "line": -1, "arrow": 0, "msg": "Kezdetben: egyik modul sincs betöltve; nincs /sys/bus/demo_bus"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 1, "ev": "insmod demo_bus.ko", "line": 1, "arrow": 1, "msg": "(1) insmod demo_bus.ko: bus_register, majd device_add → a demo0 a busz eszközlistájára kerül; megjelenik a /sys/bus/demo_bus/devices/demo0 link és a demo_attr"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": null, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 2, "ev": "insmod demo_drv.ko", "line": 2, "arrow": 2, "msg": "(2) insmod demo_drv.ko: driver_register → a demo0 driver a busz driverlistájára kerül (drivers/demo0/)"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 3, "ev": "match", "line": 3, "arrow": 3, "msg": "(3) demo_match: strcmp(\"demo0\", \"demo0\") == 0 → igaz: a kernel megkísérli a hozzárendelést"}, {"busdevs": ["demo0"], "busdrvs": ["demo0"], "driver": null, "drvdata": "—", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["drivers/demo0/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "demo0: probe of demo0 failed with error -12", "bus": true, "k": 4, "ev": "probe", "line": 4, "arrow": 4, "msg": "(4) demo_probe → −ENOMEM: a hozzárendelés nem jön létre, dev->driver = NULL; a drivers/demo0/demo0 link nem jön létre"}, {"busdevs": ["demo0"], "busdrvs": [], "driver": null, "drvdata": "—", "match": true, "tree": [["/sys/bus/demo_bus/", "dir"], ["devices/", "dir"], ["devices/demo0 → ../../../devices/demo0", "link"], ["drivers/", "dir"], ["/sys/devices/demo0/", "dir"], ["demo_attr", "file"]], "dmesg": "", "bus": true, "k": 5, "ev": "rmmod demo_drv", "line": 5, "arrow": 5, "msg": "(5) rmmod demo_drv: nincs kötött eszköz, remove nem hívódik; a driver kikerül a listából, a drivers/demo0/ eltűnik"}, {"busdevs": [], "busdrvs": [], "driver": null, "drvdata": "—", "match": true, "tree": [], "dmesg": "", "bus": false, "k": 6, "ev": "rmmod demo_bus", "line": 7, "arrow": 7, "msg": "(6) rmmod demo_bus: device_unregister, bus_unregister → a /sys/bus/demo_bus eltűnik"}];
function setMode(){ setSteps(document.getElementById("fail").checked ? FAIL : OK); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
