<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izolációs határok öt modellben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt rétegoszlop: VM, microVM, konténer, unikernel, WASM. A VM, a microVM és az unikernel izolációs határa a hypervisor fölött van, a konténeré a közös, sraffozott hoszt kernel syscall-interfészénél, a WASM-é a futtatókörnyezet és a modul között."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fogalmi rétegrend, nem méretarányos; indulási időket nem tartalmaz. A konténer, a WASM és az unikernel megállapításai a 22.4.1.4 szakaszt követik; a VM és a microVM leírása összefoglaló.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"col": -1, "line": -1, "msg": "Áttekintés: kattints egy oszlopra (vagy lépj tovább), és kiemelődik a támadó által elérhető felület."}, {"col": 0, "line": -1, "msg": "VM: a vendég a hypervisor felületét éri el – VM exit-kezelők, hypercallok és a QEMU teljes eszközmodellje (emulált és virtio-eszközök). Kifelé hardveres (VMX) határ."}, {"col": 1, "line": -1, "msg": "microVM: ugyanaz a hardveres határ, de a VMM csak néhány virtio-eszközt (hálózat, blokk, konzol) emulál, így a vendég felől elérhető felület kisebb, mint egy teljes QEMU-nál."}, {"col": 2, "line": -1, "msg": "Konténer (22.4.1.4): nagy felület – a hoszt kernel teljes syscall-interfésze elérhető (fájlrendszer, hálózat, futás); csak szigorú seccomp-szabályokkal korlátozható. A határ a syscall-interfész."}, {"col": 3, "line": -1, "msg": "Unikernel (22.4.1.4): belül nincs védelem az alkalmazás és a könyvtár-OS között, de kifelé a hypervisor VM-határa választja el: a támadó a virtio-eszközöket és a hypercallokat éri el, másik hoszt folyamatra nem tud átugrani."}, {"col": 4, "line": -1, "msg": "WASM (22.4.1.4): nagyon kicsi felület – a modul a hoszt syscall-jait nem éri el, csak az importált, képesség-alapon engedélyezett WASI-függvényeket; a határ a runtime és a modul között húzódik."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const COLS = [{"t": "VM", "layers": [["hardver", 0.8, "hw"], ["hypervisor\n(KVM + QEMU)", 1.1, "hv"], ["vendég kernel", 1.0, "g"], ["vendég userland", 1.0, "g"], ["alkalmazás", 1.0, "app"]], "bnd": 1, "surf": 1, "txt": "VM: a vendég a hypervisor felületét éri el – VM exit-kezelők, hypercallok és a QEMU teljes eszközmodellje (emulált és virtio-eszközök). Kifelé hardveres (VMX) határ."}, {"t": "microVM", "layers": [["hardver", 0.8, "hw"], ["KVM + vékony\nVMM (Firecracker)", 1.1, "hv"], ["minimális vendég\nkernel", 1.1, "g"], ["alkalmazás", 1.0, "app"]], "bnd": 1, "surf": 1, "txt": "microVM: ugyanaz a hardveres határ, de a VMM csak néhány virtio-eszközt (hálózat, blokk, konzol) emulál, így a vendég felől elérhető felület kisebb, mint egy teljes QEMU-nál."}, {"t": "konténer", "layers": [["hardver", 0.8, "hw"], ["közös hoszt kernel\n(névterek, cgroup,\nseccomp)", 1.5, "shared"], ["konténer\nuserland", 1.1, "g"], ["alkalmazás", 1.0, "app"]], "bnd": 1, "surf": 1, "txt": "Konténer (22.4.1.4): nagy felület – a hoszt kernel teljes syscall-interfésze elérhető (fájlrendszer, hálózat, futás); csak szigorú seccomp-szabályokkal korlátozható. A határ a syscall-interfész."}, {"t": "unikernel", "layers": [["hardver", 0.8, "hw"], ["hypervisor", 1.1, "hv"], ["alkalmazás +\nkönyvtár-OS\n(egy címtér,\nring 0)", 2.1, "app"]], "bnd": 1, "surf": 1, "txt": "Unikernel (22.4.1.4): belül nincs védelem az alkalmazás és a könyvtár-OS között, de kifelé a hypervisor VM-határa választja el: a támadó a virtio-eszközöket és a hypercallokat éri el, másik hoszt folyamatra nem tud átugrani."}, {"t": "WASM", "layers": [["hardver", 0.8, "hw"], ["hoszt kernel", 1.0, "k"], ["hoszt folyamat:\nwasmtime\n(JIT/AOT, WASI)", 2.3, "rt"]], "bnd": "inner", "surf": 2, "txt": "WASM (22.4.1.4): nagyon kicsi felület – a modul a hoszt syscall-jait nem éri el, csak az importált, képesség-alapon engedélyezett WASI-függvényeket; a határ a runtime és a modul között húzódik."}], FILL = {"hw": "#a6a6a6", "hv": "#d0d0d0", "g": "white", "app": "#eeeeee", "shared": "white", "k": "#d0d0d0", "rt": "#eeeeee"};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 360"); svg.innerHTML = "";
  const line = css("--line"), mut = css("--muted"), hl = css("--hl"), hl2 = css("--hl2"), cell = css("--cell"), cellhl = css("--cellhl");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const defs = el("defs", {}); const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", "ih"); p.setAttribute("width", 7); p.setAttribute("height", 7); p.setAttribute("patternUnits", "userSpaceOnUse");
  const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", "M-1,8 L8,-1"); pa.setAttribute("stroke", mut); pa.setAttribute("stroke-width", 1); p.appendChild(pa); defs.appendChild(p);
  const CW = 140, G = 10, U = 52, y0 = 320;
  COLS.forEach((c, i) => {
    const x0 = 8 + i * (CW + G), on = s.col === i;
    const hit = el("rect", {x: x0 - 4, y: 6, width: CW + 8, height: 346, fill: on ? cellhl : "transparent", "fill-opacity": 0.35, stroke: on ? hl : "none", "stroke-width": 2, tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": c.t + " oszlop kiválasztása"});
    const pick = () => { stop(); show(i + 1); };
    hit.addEventListener("click", pick); hit.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    el("text", {x: x0 + CW / 2, y: 26, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", style: "pointer-events:none"}, c.t);
    let y = y0; const tops = [];
    c.layers.forEach((L, j) => { const h = L[1] * U, sf = on && j === c.surf;
      const f = L[2] === "shared" ? "url(#ih)" : (dark ? (L[2] === "hw" ? "#555" : L[2] === "g" ? cell : "#3a3a3a") : FILL[L[2]]);
      el("rect", {x: x0, y: y - h, width: CW, height: h, fill: f, stroke: sf ? hl2 : line, "stroke-width": sf ? 4 : 1, style: "pointer-events:none"});
      const ls = L[0].split("\n"), off = L[2] === "rt" ? -h / 2 + 12 + (ls.length - 1) * 7 : 0;
      ls.forEach((q, k2) => el("text", {x: x0 + CW / 2, y: y - h / 2 + off + 4 + (k2 - (ls.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 11, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3, style: "pointer-events:none"}, q));
      y -= h; tops.push(y); });
    if (c.bnd === "inner") { const yr = tops[tops.length - 2];
      el("rect", {x: x0 + 12, y: yr - 50, width: CW - 24, height: 42, fill: css("--bg"), stroke: on ? hl2 : line, "stroke-width": on ? 4 : 3, "stroke-dasharray": "7 4", style: "pointer-events:none"});
      el("text", {x: x0 + CW / 2, y: yr - 33, "text-anchor": "middle", "font-size": 11, style: "pointer-events:none"}, "WASM modul");
      el("text", {x: x0 + CW / 2, y: yr - 18, "text-anchor": "middle", "font-size": 11, style: "pointer-events:none"}, "(lineáris memória)");
      if (on) el("text", {x: x0 + CW / 2, y: yr - 56, "text-anchor": "middle", "font-size": 11, "font-weight": "bold", fill: hl2}, "↓ csak WASI-importok");
    } else { const yb = tops[c.bnd];
      el("line", {x1: x0 - 4, y1: yb, x2: x0 + CW + 4, y2: yb, stroke: line, "stroke-width": 4, "stroke-dasharray": "8 4", style: "pointer-events:none"});
      if (on) el("text", {x: x0 + CW / 2, y: yb + 16, "text-anchor": "middle", "font-size": 11, "font-weight": "bold", fill: hl2, "paint-order": "stroke", stroke: css("--bg"), "stroke-width": 3}, "támadási felület"); }
  });
  el("text", {x: 8, y: 350, "font-size": 11, fill: mut}, "vastag szaggatott = izolációs határ · sraffozott = közös hoszt kernel · kiemelt keret = elérhető felület");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
