<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">

<title>SECDED Hamming-kód</title>
<style>

label.toggle{display:flex;align-items:center;gap:4px}
#status{min-height:2.9em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;font-family:system-ui,sans-serif}
.small,.note{font-size:12px;color:var(--muted)}

.frame{fill:none;stroke:var(--frame);stroke-width:1}
.grid{stroke:var(--grid);stroke-width:.7}

.det{stroke:var(--det);stroke-width:1.8;fill:none}

.clutter{stroke:var(--det);stroke-width:1.2;fill:none;opacity:.5}
.pred-ell{stroke:var(--pred);stroke-width:1.3;stroke-dasharray:5 3;fill:none}
.est{stroke:var(--est);stroke-width:2;fill:none}
.est-dot{fill:var(--est)}
.est-ell{stroke:var(--est);stroke-width:1.5;fill:var(--band)}
.naive{stroke:var(--naive);stroke-width:1.6;stroke-dasharray:1.5 3;fill:none}
.gate{stroke:var(--gate);stroke-width:1.4;stroke-dasharray:1 3;fill:none}

.cursor{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}

.sample{stroke:var(--naive);opacity:.45;fill:none}

.mark{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}

label.disabled{opacity:.45}

/* ===========================================================================
   Számítógép-architektúra elemek (2026-11-25): context.md színkód, világos/sötét.

  --data:#8fb8e8;--ctl:#f0a060;--idle:#7d7d7d;--ok:#81c784;--err:#ef9a9a;--cellbg:#252525;--cellline:#aaa;--pat:#bbb;--panel:#262a2e;
  --c-active:#2b4a6e;--c-ctrl:#6b4323;--c-hit:#2c5527;--c-miss:#6e2b2b;--c-stall:#454545;--c-hl:#625310;--c-hl2:#4a3568;--c-head:#2e353d;
  --c-M:#7c2d2d;--c-O:#7a4a1c;--c-E:#503879;--c-S:#274a7c;--c-I:#404040;

  --c-c0:#2b4a6e;--c-c1:#66422a;--c-c2:#36522a;--c-c3:#554a17;--c-c4:#4a3568;--c-c5:#444;--c-c6:#1f4e4a;--c-c7:#5f2f45;

<body>
<div id="controls"></div>
<div id="status" aria-live="polite"></div>
<svg id="view" viewBox="0 0 640 348" role="img" aria-label="Kattintható adat- és kódbitek, paritásellenőrzések, szindróma és a dekóder döntése"></svg>
<div id="panel"></div>
<p class="note"></p>
<script>
// Hibát látható módon jelezzük (a statikus PNG a lap alatt lenyitható tartalék marad).
window.addEventListener("error", e => { const s = document.getElementById("status");
  if (s) { s.textContent = "Hiba az interaktív ábrában: " + e.message + " (sor " + e.lineno + ")"; s.className = "error"; } });
</script>
<script>
/* kf.js – a könyv interaktív lapjainak számítási magja (külső függőség nélkül).
   A kftrack Python-csomag tükre: ugyanazok a képletek, ugyanaz az állapotsorrend
   ([x, y, vx, vy]), a paritást a figures/web/test/ teszt ellenőrzi.
   Mátrix: tömbök tömbje (sorok), vektor: sima tömb. */
"use strict";
const KF = (() => {
  // ---------- mátrixok ----------
  const zeros = (r, c) => Array.from({length: r}, () => new Array(c).fill(0));
  const eye = n => { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; };
  const T = A => A[0].map((_, j) => A.map(row => row[j]));
  const mul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const mv = (A, x) => A.map(row => row.reduce((s, a, k) => s + a * x[k], 0));
  const add = (A, B) => A.map((row, i) => row.map((a, j) => a + B[i][j]));
  const sub = (A, B) => A.map((row, i) => row.map((a, j) => a - B[i][j]));
  const scale = (A, s) => A.map(row => row.map(a => a * s));
  const vadd = (a, b) => a.map((v, i) => v + b[i]);
  const vsub = (a, b) => a.map((v, i) => v - b[i]);
  const vscale = (a, s) => a.map(v => v * s);
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sym = P => P.map((row, i) => row.map((a, j) => 0.5 * (a + P[j][i])));
  const diag = d => { const D = zeros(d.length, d.length); d.forEach((v, i) => D[i][i] = v); return D; };
  const kron = (A, B) => {
    const r = A.length * B.length, c = A[0].length * B[0].length, K = zeros(r, c);
    A.forEach((ra, i) => ra.forEach((a, j) => B.forEach((rb, k) => rb.forEach((b, l) => {
      K[i * B.length + k][j * B[0].length + l] = a * b; }))));
    return K;
  };
  const clone = A => A.map(r => r.slice());
  const select = (A, rows, cols) => rows.map(i => cols.map(j => A[i][j]));
  /* A X = B megoldása Gauss-eliminációval, részleges főelemkiválasztással (kf004: „solve, ne inv”).
     B lehet vektor vagy mátrix. */
  function solve(A, B) {
    const n = A.length, vec = !Array.isArray(B[0]);
    const M = A.map((row, i) => row.concat(vec ? [B[i]] : B[i]));
    const w = M[0].length;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("szinguláris mátrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k < w; k++) M[r][k] -= f * M[c][k];
      }
    }
    const X = zeros(n, w - n);
    for (let r = n - 1; r >= 0; r--) for (let k = 0; k < w - n; k++) {
      let s = M[r][n + k];
      for (let j = r + 1; j < n; j++) s -= M[r][j] * X[j][k];
      X[r][k] = s / M[r][r];
    }
    return vec ? X.map(r => r[0]) : X;
  }
  const inv = A => solve(A, eye(A.length));
  function chol(P) {          // P = L Lᵀ, L alsó háromszög (kf006)
    const n = P.length, L = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = P[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) throw new Error("nem pozitív definit"); L[i][i] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
    return L;
  }
  function eig2(P) {          // szimmetrikus 2×2: sajátértékek (nagy, kicsi) és a nagyobbik iránya
    const a = P[0][0], b = 0.5 * (P[0][1] + P[1][0]), d = P[1][1];
    const tr = a + d, disc = Math.sqrt(Math.max(0, 0.25 * (a - d) * (a - d) + b * b));
    return {l1: 0.5 * tr + disc, l2: 0.5 * tr - disc, angle: 0.5 * Math.atan2(2 * b, a - d)};
  }
  const mat = {zeros, eye, T, mul, mv, add, sub, scale, vadd, vsub, vscale, dot, sym, diag, kron,
               clone, select, solve, inv, chol, eig2};

  // ---------- szögek (kf028) ----------
  const TAU = 2 * Math.PI;

    });
    return g;
  }

  return {el, Scene, Plot, legend, fmt, NS};
})();

/* ===========================================================================
   Számítógép-architektúra elemek (2026-11-25). Képpont-koordináták (viewBox,
   x jobbra, y LEFELÉ) – a figlib.canvas() ugyanezt a rendszert használja a PNG-hez.
   Minden függvény első argumentuma a szülő (svg vagy <g>), és geometriát ad vissza.
   A cella-/dobozállapotok (state) nevei: lásd STATES és figures/README.md.
   =========================================================================== */
Object.assign(Draw, (() => {
  const {el, fmt, NS} = Draw;

  /* Állapotok: p = fekete-fehérben is látható mintázat, g = sarokjel. A színt az app.css adja
     (.st-<név>). A "sel", "new", "dim", "dashed" módosítók szóközzel hozzáfűzhetők. */
  const STATES = {
    "": {}, none: {}, empty: {}, active: {}, ctrl: {}, hit: {g: "✓"}, miss: {p: "hatch", g: "×"},
    ok: {g: "✓"}, bad: {p: "hatch", g: "×"}, stall: {p: "dots"}, bubble: {p: "dots"}, flush: {p: "cross"},
    hl: {}, hl2: {}, head: {}, off: {},
    M: {}, O: {}, E: {}, S: {}, I: {p: "dots"},
    IF: {}, ID: {}, EX: {}, MEM: {}, WB: {},
    c0: {}, c1: {p: "hatch"}, c2: {p: "dots"}, c3: {p: "cross"}, c4: {p: "back"}, c5: {p: "vert"},
    c6: {p: "horz"}, c7: {p: "grid"},
  };
  const PATTERNS = {
    hatch: "M0,7L7,0M-1,1L1,-1M6,8L8,6", back: "M0,0L7,7M-1,6L1,8M6,-1L8,1", dots: "M1.5,1.5h1.4M5,5h1.4",
    cross: "M0,7L7,0M0,0L7,7", vert: "M3.5,0V7", horz: "M0,3.5H7", grid: "M3.5,0V7M0,3.5H7",
  };
  const MARKER_KINDS = ["data", "ctrl", "idle", "fwd", "hit", "miss"];
  function ensureDefs(parent) {
    const svg = parent.ownerSVGElement || parent;
    if (svg.querySelector("defs#archdefs")) return;
    const d = el(svg, "defs", {id: "archdefs"});
    for (const k in PATTERNS) {
      const p = el(d, "pattern", {id: "pat-" + k, width: 7, height: 7, patternUnits: "userSpaceOnUse"});
      el(p, "path", {d: PATTERNS[k], class: "pat-line"});
    }
    MARKER_KINDS.forEach(k => {
      const m = el(d, "marker", {id: "arr-" + k, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 8,
        markerHeight: 8, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse"});
      el(m, "path", {d: "M0,0.8 L10,5 L0,9.2 z", class: "arr arr-" + k});
    });
  }
  /* Az SVG teljes törlése; a render() elején hívd (azonnali módú rajzolás). */
  function clear(svg) { svg.innerHTML = ""; ensureDefs(svg); return svg; }
  function group(parent, cls, attrs = {}) { return el(parent, "g", {class: cls, ...attrs}); }

  const stateList = s => String(s || "").split(/\s+/).filter(Boolean);
  const stClass = s => stateList(s).map(t => "st-" + t).join(" ");
  const stPattern = s => stateList(s).map(t => (STATES[t] || {}).p).find(Boolean);
  const stGlyph = s => stateList(s).map(t => (STATES[t] || {}).g).find(Boolean);

  /* Szövegszélesség-becslés (px) – elrendezéshez és tördeléshez. */
  const textWidth = (s, size = 12, mono = false) => String(s).length * size * (mono ? 0.61 : 0.56);

  /* Szöveg. s: string ("\n" = új sor) vagy futamok tömbje [{t, over, sub, sup, bold, cls}].
     opt: cls, anchor (start|middle|end), baseline ("middle": függőlegesen középre; alapértelmezés),
     "base" (alapvonal y-nál), size, bold, mono, rotate, title, halo. */
  function txt(parent, x, y, s, opt = {}) {
    const {cls = "", anchor = "middle", baseline = "middle", size, bold, mono, rotate, title, halo} = opt;
    const runs = Array.isArray(s) ? s : null, lines = runs ? [runs] : String(s ?? "").split("\n");
    const fs = size || 12, lh = fs * 1.22;
    const dy0 = baseline === "middle" ? 0.35 * fs - (lines.length - 1) * lh / 2 : 0;
    const t = el(parent, "text", {x, y: y + dy0, class: ("t " + cls + (mono ? " mono" : "") + (halo ? " halo" : "")).trim(),
      "text-anchor": anchor});
    if (size) t.style.fontSize = size + "px";
    if (bold) t.style.fontWeight = "700";
    if (rotate) t.setAttribute("transform", `rotate(${rotate} ${x} ${y})`);
    if (runs) runs.forEach(r => {
      const o = typeof r === "string" ? {t: r} : r, sp = el(t, "tspan", {class: o.cls}, o.t);
      if (o.over) sp.setAttribute("text-decoration", "overline");
      if (o.sub) { sp.setAttribute("baseline-shift", "sub"); sp.style.fontSize = "75%"; }
      if (o.sup) { sp.setAttribute("baseline-shift", "super"); sp.style.fontSize = "75%"; }
      if (o.bold) sp.style.fontWeight = "700";
    });
    else if (lines.length === 1) t.textContent = lines[0];
    else lines.forEach((l, i) => el(t, "tspan", {x, dy: i ? lh : 0}, l || " "));
    if (title) el(t, "title", {}, title);
    return t;
  }

  /* Kattinthatóvá tesz egy elemet (egér és billentyűzet: Enter/szóköz). */
  function clickable(node, fn, label) {
    node.classList.add("click");
    node.setAttribute("tabindex", "0"); node.setAttribute("role", "button");
    if (label) node.setAttribute("aria-label", label);
    node.addEventListener("click", e => fn(e));
    node.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(e); } });
    return node;
  }

  const anchors = (x, y, w, h) => ({x, y, w, h, cx: x + w / 2, cy: y + h / 2,
    l: [x, y + h / 2], r: [x + w, y + h / 2], t: [x + w / 2, y], b: [x + w / 2, y + h],
    /* at("l", 0.25): pont a bal/jobb/felső/alsó él adott hányadánál */
    at: (side, f = 0.5) => side === "l" ? [x, y + h * f] : side === "r" ? [x + w, y + h * f]
      : side === "t" ? [x + w * f, y] : [x + w * f, y + h]});

  /* Egy állapotos alakzat (alapkitöltés + mintaréteg). shapeAttrs: [tag, attrs]. */
  function shapeWithState(g, tag, attrs, state) {
    const base = el(g, tag, {...attrs, class: "cell-bg"});
    const pat = stPattern(state);
    if (pat) el(g, tag, {...attrs, class: "cell-pat", fill: `url(#pat-${pat})`});
    return base;
  }

  /* Egyetlen cella. opt: state, size, bold, mono, align (start|middle|end), glyph (false: nincs
     sarokjel), title, onClick, rx. */
  function cell(parent, x, y, w, h, text = "", opt = {}) {
    ensureDefs(parent);
    const {state = "", size, bold, mono, align = "middle", glyph = true, title, onClick, rx = 0} = opt;
    const g = group(parent, ("cell " + stClass(state)).trim());
    shapeWithState(g, "rect", {x, y, width: w, height: h, rx}, state);
    if (text !== "" && text !== null && text !== undefined) {
      const tx = align === "start" ? x + 5 : align === "end" ? x + w - 5 : x + w / 2;
      txt(g, tx, y + h / 2, typeof text === "number" ? String(text).replace("-", "−") : text,
        {anchor: align, size, bold: bold || stateList(state).includes("head"), mono, halo: !!stPattern(state)});
    }
    const gl = glyph && stGlyph(state);
    const room = align === "middle" ? (w - textWidth(text ?? "", size || 12, mono)) / 2 : w;   // elfér-e a felirat mellett
    if (gl && w >= 18 && h >= 14 && (text === "" || room >= 9)) txt(g, x + w - 2.5, y + 7, gl, {anchor: "end", size: 10, bold: true, cls: "glyph", halo: !!stPattern(state)});
    if (title) el(g, "title", {}, title);
    if (onClick) clickable(g, onClick, title || String(text));
    return {...anchors(x, y, w, h), g};
  }
  const pick = (spec, ...k) => typeof spec === "function" ? spec(...k)
    : Array.isArray(spec) ? spec[k[0]] : spec ? spec[k.join(",")] : undefined;

  /* Cellasor (bitek, tömb, SIMD-sávok, sorok). opt: w, h, gap, states, index (true|"top"),
     indexBase, indexRev (balról n−1…0), label (bal oldali felirat), size, mono, onClick(i), title(i). */
  function cells(parent, x, y, values, opt = {}) {
    const {w = 30, h = 26, gap = 0, states, index = false, indexBase = 0, indexRev = false, label, size, mono, onClick, title} = opt;
    const g = group(parent), n = values.length, boxes = [];
    values.forEach((v, i) => {
      const cx = x + i * (w + gap);
      boxes.push(cell(g, cx, y, w, h, v, {state: pick(states, i), size, mono,
        onClick: onClick ? () => onClick(i) : undefined, title: title ? title(i) : undefined}));
      if (index) txt(g, cx + w / 2, index === "top" ? y - 8 : y + h + 9,
        String(indexRev ? n - 1 - i + indexBase : i + indexBase), {cls: "tick", size: 10});
    });
    if (label) txt(g, x - 6, y + h / 2, label, {anchor: "end", size});

  }

  /* Táblázat. opt: cols [string | {label, w, align, mono}], rows [[cella]], colW, rowH, header,
     rowLabels, rowLabelW, title, states (fn(i,j) | {"i,j": st}), rowStates (fn(i) | tömb | {i: st}),
     onCell(i,j), size, mono. Cella: string | szám | null | {t, state, bold, title}.

  function table(parent, x, y, opt) {
    const {cols, rows, colW = 70, rowH = 22, header = true, rowLabels, rowLabelW = 60, title, states, rowStates, onCell, size, mono} = opt;
    const g = group(parent, "table");
    const C = cols.map(c => typeof c === "object" ? c : {label: c});
    let yy = y;
    const lw = rowLabels ? rowLabelW : 0, xs = []; let xx = x + lw;
    C.forEach(c => { xs.push(xx); xx += c.w || colW; });
    const W = xx - x;
    if (title) { txt(g, x, yy + 8, title, {anchor: "start", bold: true, size}); yy += 20; }
    if (header) { C.forEach((c, j) => cell(g, xs[j], yy, c.w || colW, rowH, c.label ?? "", {state: "head", size})); yy += rowH; }
    const top = yy, boxes = [], thick = [];
    rows.forEach((r, i) => {
      boxes.push([]);
      if (rowLabels) cell(g, x, yy, lw, rowH, rowLabels[i], {state: "head", size, mono});
      C.forEach((c, j) => {
        let v = r[j], o = v !== null && typeof v === "object" ? v : {t: v};
        const st = [o.state, pick(states, i, j), pick(rowStates, i)].filter(Boolean).join(" ");
        const b = cell(g, xs[j], yy, c.w || colW, rowH, o.t ?? "", {state: st, size, mono: o.mono ?? c.mono ?? mono,
          bold: o.bold, align: c.align || "middle", title: o.title, onClick: onCell ? () => onCell(i, j) : undefined});
        boxes[i].push(b);
        if (/\b(sel|new)\b/.test(st)) thick.push(b.g);

      yy += rowH;
    });
    thick.forEach(c => g.appendChild(c));          // a vastag keret kerüljön a szomszédok fölé
    return {...anchors(x, y, W, yy - y), g, cell: (i, j) => boxes[i][j],
      row: i => anchors(x, top + i * rowH, W, rowH), col: j => anchors(xs[j], top, C[j].w || colW, rows.length * rowH)};
  }

  /* Rács (mátrix, Karnaugh, bankok, hőtérkép). opt: cw, ch, gap, text(i,j), states(i,j), rowLabels,
     colLabels, onCell(i,j), size, level(i,j) → 0…1 (kék árnyalat). Vissza: {cell(i,j), …} */
  function grid(parent, x, y, nrows, ncols, opt = {}) {
    const {cw = 28, ch = 24, gap = 0, text, states, rowLabels, colLabels, onCell, size, level, title} = opt;
    const g = group(parent), boxes = [];
    for (let i = 0; i < nrows; i++) {
      boxes.push([]);
      for (let j = 0; j < ncols; j++) {
        const b = cell(g, x + j * (cw + gap), y + i * (ch + gap), cw, ch, text ? text(i, j) : "",
          {state: pick(states, i, j), size, onClick: onCell ? () => onCell(i, j) : undefined, title: title ? title(i, j) : undefined});
        if (level) el(b.g, "rect", {x: b.x, y: b.y, width: cw, height: ch, class: "level", "fill-opacity": 0.55 * Math.max(0, Math.min(1, level(i, j))), "pointer-events": "none"});
        boxes[i].push(b);

    }
    if (colLabels) colLabels.forEach((l, j) => txt(g, x + j * (cw + gap) + cw / 2, y - 8, l, {cls: "tick", size}));
    return {...anchors(x, y, ncols * (cw + gap) - gap, nrows * (ch + gap) - gap), g, cell: (i, j) => boxes[i][j]};
  }

  /* Kiemelő keret egy téglalap köré (Karnaugh-csoport, blokk). box: {x,y,w,h}; opt: inset, state, dashed, rx, label */
  function outline(parent, box, opt = {}) {
    const {inset = -3, state = "", dashed = false, rx = 7, label} = opt;
    const r = el(parent, "rect", {x: box.x + inset, y: box.y + inset, width: box.w - 2 * inset, height: box.h - 2 * inset, rx,
      class: ("outline " + stClass(state) + (dashed ? " st-dashed" : "")).trim()});

  }

  /* Bitmező-sor (utasításformátum, címbontás, PTE). fields (balról = MSB):
     [{name, bits}|{name, hi, lo}, value (bitstring vagy szöveg), state].
     opt: bitW (vagy w = teljes szélesség), h, numbers (bithatár-számok), perBit (bitenként),
     names ("below"|"inside"), onBit(bitszám), title. Vissza: {field(k), bit(n), w, h} */
  function bitfield(parent, x, y, fields, opt = {}) {
    const F = fields.map(f => ({...f, n: f.bits ?? f.hi - f.lo + 1}));
    const total = F.reduce((s, f) => s + f.n, 0);
    const {h = 26, numbers = true, names = "below", onBit} = opt;
    const bw = opt.bitW || (opt.w || 600) / total;
    const perBit = opt.perBit ?? (bw >= 13 && F.every(f => f.value === undefined || String(f.value).replace(/\s/g, "").length === f.n && /^[01xX?\s]+$/.test(f.value)) && F.some(f => f.value !== undefined));
    const g = group(parent, "bitfield"), fb = [], bits = {};
    const y0 = y + (numbers ? 13 : 0);
    let pos = total - 1, xx = x;
    F.forEach((f, k) => {
      const w = f.n * bw, hi = pos, lo = pos - f.n + 1, val = f.value === undefined ? undefined : String(f.value);
      const label = names === "inside" ? f.name : val;
      const split = perBit && val !== undefined && names !== "inside";
      const b = cell(g, xx, y0, w, h, split ? "" : label ?? "", {state: f.state, mono: val !== undefined && names !== "inside", title: f.title, glyph: false});
      if (split) {
        const v = val.replace(/\s/g, "");
        for (let i = 0; i < f.n; i++) {
          if (i) el(g, "line", {x1: xx + i * bw, y1: y0, x2: xx + i * bw, y2: y0 + h, class: "bit-sep"});
          const t = txt(g, xx + (i + 0.5) * bw, y0 + h / 2, v[i], {mono: true, halo: !!stPattern(f.state)});
          bits[hi - i] = anchors(xx + i * bw, y0, bw, h);
          if (onBit) { const hit = el(g, "rect", {x: xx + i * bw, y: y0, width: bw, height: h, class: "hit-area"});
            clickable(hit, () => onBit(hi - i), `bit ${hi - i}: ${v[i]}`); }
        }
      } else for (let i = 0; i < f.n; i++) bits[hi - i] = anchors(xx + i * bw, y0, bw, h);
      if (numbers) {
        const fs = 10;
        if (w >= textWidth(`${hi}  ${lo}`, fs) + 2 && f.n > 1) {
          txt(g, xx + 3, y + 6, String(hi), {anchor: "start", cls: "tick", size: fs});
          txt(g, xx + w - 3, y + 6, String(lo), {anchor: "end", cls: "tick", size: fs});
        } else txt(g, xx + w / 2, y + 6, f.n > 1 ? (w >= 26 ? `${hi}:${lo}` : String(hi)) : String(hi), {cls: "tick", size: fs});
      }
      if (names === "below" && f.name) txt(g, xx + w / 2, y0 + h + 10, f.name, {size: 11});
      fb.push(anchors(xx, y0, w, h));
      xx += w; pos -= f.n;
    });

  }

  /* ---- Blokkvázlat ---------------------------------------------------- */
  /* Doboz. opt: state, shape (rect|round|pill|circle|diamond|mux|alu|reg), sub (második, kisebb sor),
     size, onClick, title, dashed, bold, value (értékcímke a doboz alatt). */
  function box(parent, x, y, w, h, label = "", opt = {}) {
    ensureDefs(parent);
    const {state = "", shape = "rect", sub, size, onClick, title, dashed, bold, value} = opt;
    const g = group(parent, ("box " + stClass(state) + (dashed ? " st-dashed" : "")).trim());
    let tag = "rect", at = {x, y, width: w, height: h};
    if (shape === "round" || shape === "reg") at.rx = shape === "round" ? 8 : 0;
    if (shape === "pill") at.rx = h / 2;
    const poly = pts => { tag = "polygon"; at = {points: pts.map(p => p.join(",")).join(" ")}; };
    if (shape === "circle") { tag = "ellipse"; at = {cx: x + w / 2, cy: y + h / 2, rx: w / 2, ry: h / 2}; }
    if (shape === "diamond") poly([[x + w / 2, y], [x + w, y + h / 2], [x + w / 2, y + h], [x, y + h / 2]]);
    if (shape === "mux") poly([[x, y], [x + w, y + Math.min(h * .18, w * .7)], [x + w, y + h - Math.min(h * .18, w * .7)], [x, y + h]]);
    if (shape === "alu") poly([[x, y], [x + w, y + h * .25], [x + w, y + h * .75], [x, y + h], [x, y + h * .62], [x + w * .22, y + h * .5], [x, y + h * .38]]);
    shapeWithState(g, tag, at, state);
    if (shape === "reg") el(g, "path", {d: `M${x + w / 2 - 6},${y + h}l6,-8l6,8`, class: "clk-mark"});
    const dx = shape === "alu" ? w * .12 : 0, fs = size || 12;
    if (label !== "") txt(g, x + w / 2 + dx, y + h / 2 - (sub ? fs * .55 : 0), label, {size: fs, bold, halo: !!stPattern(state)});
    if (sub) txt(g, x + w / 2 + dx, y + h / 2 + fs * (.55 + .55 * (String(label).split("\n").length - 1)), sub, {size: fs - 2, cls: "sub", halo: !!stPattern(state)});
    if (value !== undefined) txt(g, x + w / 2, y + h + 9, value, {size: 11, cls: "value", mono: true, halo: true});
    if (title) el(g, "title", {}, title);
    if (onClick) clickable(g, onClick, title || String(label));
    return {...anchors(x, y, w, h), g};
  }
  /* Törtvonalas út két pont között: mode "hv" (előbb vízszintes), "vh", "hvh" (mid = x), "vhv" (mid = y). */
  function elbow(p0, p1, mode = "hv", mid) {
    const [x0, y0] = p0, [x1, y1] = p1;
    if (mode === "hv") return [p0, [x1, y0], p1];
    if (mode === "vh") return [p0, [x0, y1], p1];
    if (mode === "hvh") { const m = mid ?? (x0 + x1) / 2; return [p0, [m, y0], [m, y1], p1]; }
    if (mode === "vhv") { const m = mid ?? (y0 + y1) / 2; return [p0, [x0, m], [x1, m], p1]; }
    return [p0, p1];
  }
  /* Pont a törtvonal f hányadánál (0…1), a hossz szerint. */
  function along(pts, f = 0.5) {
    const L = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
    let s = f * L.reduce((a, b) => a + b, 0);
    for (let i = 0; i < L.length; i++) {
      if (s <= L[i] || i === L.length - 1) { const t = L[i] ? s / L[i] : 0;
        return [pts[i][0] + t * (pts[i + 1][0] - pts[i][0]), pts[i][1] + t * (pts[i + 1][1] - pts[i][1])]; }
      s -= L[i];
    }
    return pts[0];
  }
  /* Vezeték/nyíl. kind: data (kék) | ctrl (narancs szaggatott) | idle (szürke) | fwd (fekete) | hit | miss.
     opt: active (vastag, kiemelt; false megadva: az idle stílus), arrow (true|"both"|false),
     label, labelAt (0…1), dx, dy, anchor, bus (bitszélesség-jelölés), dots (elágazási pontok [[x,y]]),
     dashed, hops: nincs. */
  function wire(parent, pts, opt = {}) {
    ensureDefs(parent);
    const {active, arrow = true, label, labelAt = 0.5, dx = 0, dy = -8, anchor = "middle", bus, dots, dashed} = opt;
    const kind = active === false ? "idle" : opt.kind || (active ? "data" : "idle");
    const g = group(parent, "wire");
    const attrs = {points: pts.map(p => p.join(",")).join(" "),
      class: `w w-${kind}${active ? " w-on" : ""}${dashed ? " st-dashed" : ""}`};
    if (arrow) attrs["marker-end"] = `url(#arr-${kind})`;
    if (arrow === "both") attrs["marker-start"] = `url(#arr-${kind})`;
    el(g, "polyline", attrs);
    (dots || []).forEach(([cx, cy]) => el(g, "circle", {cx, cy, r: 3, class: "junction j-" + kind}));
    if (bus) { const [bx, by] = along(pts, 0.25);
      el(g, "path", {d: `M${bx - 3},${by + 5}l6,-10`, class: `w w-${kind}`});
      txt(g, bx + 2, by + 12, String(bus), {size: 10, cls: "tick", halo: true}); }
    if (label !== undefined) { const [lx, ly] = along(pts, labelAt);
      txt(g, lx + dx, ly + dy, label, {size: 11, anchor, cls: "wl wl-" + kind, halo: true}); }
    return {g, pts};
  }
  /* Logikai kapu. type: AND|OR|NOT|BUF|NAND|NOR|XOR|XNOR; opt: w, h, n (bemenetszám), on (a kimenet
     értéke: kiemelés), state, label, onClick. Vissza: {in: [[x,y]…], out: [x,y], …} */
  function gate(parent, type, x, y, opt = {}) {
    ensureDefs(parent);
    const {w = 46, h = 34, on, label, onClick} = opt;
    const n = opt.n || (type === "NOT" || type === "BUF" ? 1 : 2);
    const state = opt.state || (on ? "active" : "");
    const g = group(parent, ("box logic-gate " + stClass(state)).trim());
    const neg = ["NOT", "NAND", "NOR", "XNOR"].includes(type), bw = neg ? w - 8 : w;
    const or = ["OR", "NOR", "XOR", "XNOR"].includes(type), xo = type.startsWith("X") ? 5 : 0;
    let d;
    if (type === "NOT" || type === "BUF") d = `M${x},${y}L${x + bw},${y + h / 2}L${x},${y + h}Z`;
    else if (or) d = `M${x + xo},${y}Q${x + bw * .62},${y} ${x + bw},${y + h / 2}Q${x + bw * .62},${y + h} ${x + xo},${y + h}Q${x + xo + bw * .28},${y + h / 2} ${x + xo},${y}Z`;
    else d = `M${x},${y}H${x + bw - h / 2}A${h / 2},${h / 2} 0 0 1 ${x + bw - h / 2},${y + h}H${x}Z`;
    shapeWithState(g, "path", {d}, state);
    if (xo) el(g, "path", {d: `M${x},${y}Q${x + bw * .28},${y + h / 2} ${x},${y + h}`, class: "gate-line"});
    if (neg) el(g, "circle", {cx: x + bw + 4, cy: y + h / 2, r: 4, class: "cell-bg"});
    const ins = [...Array(n).keys()].map(i => {
      const iy = y + h * (i + 0.5) / n, t = (iy - y) / h;
      const ix = or ? x + xo * 0 + bw * .28 * 2 * t * (1 - t) : x;
      return [ix, iy];
    });
    if (label !== undefined) txt(g, x + bw * (or ? .55 : .45), y + h / 2, label, {size: 11});
    if (onClick) clickable(g, onClick, type);
    return {...anchors(x, y, w, h), g, in: ins, out: [x + w, y + h / 2]};
  }
  /* CMOS-tranzisztor kapcsolóként. (x, y): a csatorna felső vége; magasság h. type "n"|"p";
     on: vezet-e. Vissza: {g: [x,y] vezérlő (bal), d: felső pont, s: alsó pont} */
  function transistor(parent, x, y, opt = {}) {
    ensureDefs(parent);
    const {type = "n", on = false, label, h = 44, onClick} = opt;
    const g = group(parent, "mos " + (on ? "mos-on" : "mos-off"));
    const m = y + h / 2, a = y + h * .22, b = y + h * .78;
    el(g, "path", {d: `M${x},${y}V${a}H${x - 10}V${b}H${x}V${y + h}`, class: "mos-ch"});
    el(g, "line", {x1: x - 16, y1: a, x2: x - 16, y2: b, class: "mos-ch"});
    const p = type === "p";
    if (p) el(g, "circle", {cx: x - 20.5, cy: m, r: 4, class: "mos-bubble"});
    el(g, "line", {x1: x - 34, y1: m, x2: p ? x - 25 : x - 16, y2: m, class: "mos-ch mos-gate"});
    if (!on) el(g, "path", {d: `M${x + 3},${m - 4}l8,8m0,-8l-8,8`, class: "mos-x"});
    txt(g, x + 15, m, label ?? (p ? "pMOS" : "nMOS"), {anchor: "start", size: 11});
    if (onClick) clickable(g, onClick, label || type);
    return {g: [x - 34, m], d: [x, y], s: [x, y + h], node: g};
  }
  function vdd(parent, x, y, label = "VDD") { el(parent, "path", {d: `M${x - 12},${y}H${x + 12}`, class: "mos-ch"}); txt(parent, x, y - 9, label, {size: 11}); return [x, y]; }
  function gnd(parent, x, y) { el(parent, "path", {d: `M${x - 11},${y}H${x + 11}M${x - 7},${y + 4}H${x + 7}M${x - 3},${y + 8}H${x + 3}`, class: "mos-ch"}); return [x, y]; }

  /* ---- Állapotgép és gráf -------------------------------------------- */
  /* nodes: [{id, x, y (középpont), label, sub, state, shape: circle|rect|round|pill, r, w, h,
     double, onClick, title}]; edges: [{from, to, label, kind, active, curve (px: + a haladási iránytól
     jobbra, − balra), self: "top"|"bottom"|"left"|"right", at (címkehely 0…1), dx, dy, dashed,
     arrow}]; opt: directed (alapértelmezés true), size. Vissza: {node(id)} */
  function graph(parent, spec, opt = {}) {
    ensureDefs(parent);
    const {directed = true, size} = {...spec, ...opt};
    const g = group(parent, "graph"), eg = group(g), ng = group(g), lg = group(g);
    const N = {};
    spec.nodes.forEach(n => {
      const shape = n.shape || "circle", r = n.r || 22;
      const w = n.w || (shape === "circle" ? 2 * r : 80), h = n.h || (shape === "circle" ? 2 * r : 32);
      N[n.id] = {...n, shape, w, h};
    });
    const border = (n, towards, pad = 0) => {
      const dx = towards[0] - n.x, dy = towards[1] - n.y, L = Math.hypot(dx, dy) || 1;
      if (n.shape === "circle") return [n.x + dx / L * (n.w / 2 + pad), n.y + dy / L * (n.h / 2 + pad)];
      const s = Math.min((n.w / 2 + pad) / (Math.abs(dx) || 1e-9), (n.h / 2 + pad) / (Math.abs(dy) || 1e-9));
      return [n.x + dx * s, n.y + dy * s];
    };
    (spec.edges || []).forEach(e => {
      const a = N[e.from], b = N[e.to];
      if (!a || !b) throw new Error(`graph: ismeretlen csúcs: ${e.from} → ${e.to}`);
      const kind = e.active === false ? "idle" : e.kind || (e.active ? "data" : "fwd");
      const attrs = {class: `w w-${kind} edge${e.active ? " w-on" : ""}${e.dashed ? " st-dashed" : ""}`, fill: "none"};
      if (directed && e.arrow !== false) attrs["marker-end"] = `url(#arr-${kind})`;
      let lab;
      if (e.from === e.to || e.self) {
        const side = e.self || "top", ang = {top: -90, right: 0, bottom: 90, left: 180}[side] * Math.PI / 180;
        const P = (t, k) => [a.x + Math.cos(ang + t) * k, a.y + Math.sin(ang + t) * k];
        const R = Math.max(a.w, a.h) / 2, p0 = border(a, P(-0.55, 100)), p3 = border(a, P(0.55, 100));
        const c1 = P(-0.55, R + 34), c2 = P(0.55, R + 34);
        el(eg, "path", {d: `M${p0}C${c1} ${c2} ${p3}`, ...attrs});
        lab = P(0, R + 26);
        lab.anchor = side === "left" ? "end" : side === "right" ? "start" : "middle";
      } else {
        const c = e.curve || 0, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        const L = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y) / L, ny = (b.x - a.x) / L;
        const q = [mx + nx * 2 * c, my + ny * 2 * c];
        const p0 = border(a, c ? q : [b.x, b.y]), p1 = border(b, c ? q : [a.x, a.y], 0.5);
        el(eg, "path", {d: c ? `M${p0}Q${q} ${p1}` : `M${p0}L${p1}`, ...attrs});
        const t = e.at ?? 0.5, u = 1 - t, Q = c ? q : [(p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
        const sd = c > 0 ? 8 : -8;                      // a címke az ív külső (egyenesnél a bal) oldalára
        lab = [u * u * p0[0] + 2 * u * t * Q[0] + t * t * p1[0] + nx * sd, u * u * p0[1] + 2 * u * t * Q[1] + t * t * p1[1] + ny * sd];
      }
      if (e.label !== undefined) txt(lg, lab[0] + (e.dx || 0), lab[1] + (e.dy || 0), e.label,
        {size: size ? size - 1 : 11, anchor: lab.anchor, halo: true, cls: "wl wl-" + kind});
    });
    const out = {};
    Object.values(N).forEach(n => {
      const b = box(ng, n.x - n.w / 2, n.y - n.h / 2, n.w, n.h, n.label ?? String(n.id),
        {state: n.state, shape: n.shape, sub: n.sub, size: n.size || size, onClick: n.onClick, title: n.title, dashed: n.dashed, bold: n.bold});
      if (n.double) el(b.g, n.shape === "circle" ? "ellipse" : "rect", n.shape === "circle"
        ? {cx: n.x, cy: n.y, rx: n.w / 2 - 4, ry: n.h / 2 - 4, class: "outline"}
        : {x: n.x - n.w / 2 + 3, y: n.y - n.h / 2 + 3, width: n.w - 6, height: n.h - 6, class: "outline"});
      out[n.id] = b;
    });
    return {g, node: id => out[id]};
  }
  /* Vízszintes S-görbe két pont között (pl. két kódlista megfelelő sorainak összekötése). */
  function link(parent, a, b, opt = {}) {
    ensureDefs(parent);
    const kind = opt.kind || "idle", m = (a[0] + b[0]) / 2;
    const at = {d: `M${a}C${m},${a[1]} ${m},${b[1]} ${b}`, class: `w w-${kind}${opt.active ? " w-on" : ""}${opt.dashed ? " st-dashed" : ""}`, fill: "none"};
    if (opt.arrow) at["marker-end"] = `url(#arr-${kind})`;
    return el(parent, "path", at);
  }

  /* ---- Futószalag-diagram (a run.py „pipeline” blokkjával azonos séma) -- */
  /* spec: {rows: [{label, start (1-től), cells: ["IF","ID","s","EX",…], state}], arrows:
     [{from:[sor, ciklus], to:[sor, ciklus], label, kind}]}; cella: szakasznév | "s" (stall) | "-"
     (buborék) | "x" (törölt/flush) | "" | {t, state, title}.
     opt: cw, rh, labelW, cycles, first (első ciklus), upto (a későbbi ciklusok rejtve), cursor
     (kiemelt ciklus), onRow(i). Vissza: {cell(r,c), colX(c), rowY(r), w, h} */
  function pipeline(parent, x, y, spec, opt = {}) {
    ensureDefs(parent);
    const rows = spec.rows, arrows = spec.arrows || [];
    const {cw = 34, rh = 24, upto = Infinity, cursor, first = 1, onRow} = opt;
    const last = opt.cycles || Math.max(first, ...rows.map(r => r.start + r.cells.length - 1));
    const labelW = opt.labelW ?? Math.max(60, ...rows.map(r => textWidth(r.label, 11.5, true) + 12));
    const g = group(parent, "pipeline"), x0 = x + labelW, y0 = y + 20;
    const X = c => x0 + (c - first) * cw, Y = r => y0 + r * rh;
    if (cursor >= first && cursor <= last) el(g, "rect", {x: X(cursor), y: y0 - 18, width: cw, height: rows.length * rh + 18, class: "col-cursor"});
    txt(g, x0 - 6, y + 9, opt.header ?? "ciklus", {anchor: "end", cls: "tick", size: 10.5});
    for (let c = first; c <= last; c++) {
      txt(g, X(c) + cw / 2, y + 9, String(c), {cls: "tick", size: 10.5, bold: c === cursor});
      el(g, "line", {x1: X(c), y1: y0, x2: X(c), y2: Y(rows.length), class: "grid"});
    }
    el(g, "line", {x1: X(last + 1), y1: y0, x2: X(last + 1), y2: Y(rows.length), class: "grid"});
    const boxes = {};
    rows.forEach((r, i) => {
      el(g, "line", {x1: x0, y1: Y(i + 1), x2: X(last + 1), y2: Y(i + 1), class: "grid"});
      const lb = txt(g, x, Y(i) + rh / 2, r.label, {anchor: "start", mono: true, size: 11.5});
      if (r.state) lb.setAttribute("class", lb.getAttribute("class") + " " + stClass(r.state));
      if (onRow) clickable(lb, () => onRow(i), r.label);
      r.cells.forEach((c, j) => {
        const cyc = r.start + j;
        if (cyc < first || cyc > last || cyc > upto || c === "" || c === null) return;
        let o = typeof c === "object" ? c : {t: c};
        let state = o.state, t = o.t;
        if (t === "s") { t = "stall"; state = state || "stall"; }
        else if (t === "-") { t = "–"; state = state || "bubble"; }
        else if (t === "x") { t = "×"; state = state || "flush"; }
        else if (!state && STATES[t]) state = t;
        boxes[`${i},${cyc}`] = cell(g, X(cyc) + 1.5, Y(i) + 2, cw - 3, rh - 4, t, {state, size: t.length > 3 ? 9.5 : 11, title: o.title, glyph: false, rx: 2});
      });
    });
    arrows.forEach(a => {
      const [r0, c0] = a.from, [r1, c1] = a.to;
      if (c1 > upto || c0 > upto) return;
      const down = r1 >= r0;
      const p0 = [X(c0) + cw * (c0 === c1 ? .5 : .85), Y(r0) + (down ? rh - 5 : 5)];
      const p1 = [X(c1) + cw * (c0 === c1 ? .5 : .15), Y(r1) + (down ? 5 : rh - 5)];
      wire(g, [p0, p1], {kind: a.kind || "fwd", active: true, label: a.label, dx: 10, dy: 0});
    });
    return {...anchors(x, y, labelW + (last - first + 1) * cw, 20 + rows.length * rh), g,
      cell: (r, c) => boxes[`${r},${c}`] || anchors(X(c), Y(r), cw, rh), colX: X, rowY: Y};
  }

  /* ---- Idődiagram ----------------------------------------------------- */
  /* signals: [{name, wave: "p01.x=z", data: [...]}  (a run.py „timing” blokkjával azonos jelkészlet)
     vagy {name, points: [[t, v], …]} tetszőleges időpontokkal (v: 0, 1, "x", "z" vagy adatszöveg);
     kiegészítők: kind (data|ctrl|idle|…), hl: true]. opt: cw (px/időegység), rh, labelW, t1,
     upto (eddig rajzol), cursor (függőleges vonal), windows [{from, to, label, state, rows}],
     marks [{t, label}], ticks (true: egész számok alul | lépésköz | tömb), grid (lépésköz | 0),
     fmt(t). Vissza: {X(t), rowY(i), w, h} */
  function timing(parent, x, y, signals, opt = {}) {
    ensureDefs(parent);
    const segsOf = s => {
      if (s.points) return s.points.map(([t, v], i) => ({t0: t, t1: s.points[i + 1]?.[0] ?? null, v}));
      const out = []; let k = 0;
      [...s.wave].forEach((c, i) => {
        if (c === "." && out.length) { const p = out[out.length - 1];
          if (p.clk) out.push({t0: i, t1: i + .5, v: 1, clk: true}, {t0: i + .5, t1: i + 1, v: 0, clk: true}); else p.t1 = i + 1; return; }
        if (c === "p") out.push({t0: i, t1: i + .5, v: 1, clk: true}, {t0: i + .5, t1: i + 1, v: 0, clk: true});
        else out.push({t0: i, t1: i + 1, v: c === "0" ? 0 : c === "1" ? 1 : c === "=" ? String((s.data || [])[k++] ?? "") : c === "z" ? "z" : "x"});
      });
      return out;
    };
    const all = signals.map(segsOf);
    const t1 = opt.t1 ?? Math.max(...all.map((a, i) => signals[i].wave ? signals[i].wave.length : a[a.length - 1].t0 + 1));
    const {cw = 36, rh = 34, windows = [], marks = [], upto = t1, cursor, ticks = false} = opt;
    const gstep = opt.grid ?? 1;
    const labelW = opt.labelW ?? Math.max(40, ...signals.map(s => textWidth(s.name, 12, true) + 12));
    const g = group(parent, "timing"), x0 = x + labelW, top = y + (marks.length || windows.some(w => w.label) ? 18 : 2);
    const X = t => x0 + t * cw, Y = i => top + i * rh, H = rh * 0.62, n = signals.length;
    windows.forEach(w => {
      const [r0, r1] = w.rows ? [Math.min(...w.rows), Math.max(...w.rows)] : [0, n - 1];
      const rg = group(g, ("window " + stClass(w.state || "hl")).trim());
      shapeWithState(rg, "rect", {x: X(w.from), y: Y(r0), width: (w.to - w.from) * cw, height: (r1 - r0 + 1) * rh}, w.state || "hl");
      if (w.label) txt(g, (X(w.from) + X(w.to)) / 2, Y(0) - 9, w.label, {size: 11});
    });
    if (gstep) for (let t = 0; t <= t1 + 1e-9; t += gstep) el(g, "line", {x1: X(t), y1: top, x2: X(t), y2: Y(n), class: "grid-t"});
    all.forEach((segs, i) => {
      const s = signals[i], yHi = Y(i) + (rh - H) / 2, yLo = yHi + H, ym = (yHi + yLo) / 2;
      const kind = s.kind || (s.hl ? "ctrl" : "data");
      txt(g, x, ym, s.name, {anchor: "start", mono: true});
      let prev = null, d = "";
      segs.forEach(sg => {
        const a = sg.t0, b = Math.min(sg.t1 ?? t1, t1, upto);
        if (a >= upto || b <= a) return;
        const v = sg.v;
        if (v === 0 || v === 1) {
          const yy = v ? yHi : yLo;
          d += prev === null ? `M${X(a)},${yy}` : (prev === 0 || prev === 1) ? `L${X(a)},${yy}` : `M${X(a)},${yy}`;
          d += `L${X(b)},${yy}`;
        } else if (v === "z") d += `M${X(a)},${ym}L${X(b)},${ym}`;
        else {
          const s2 = Math.min(3, (b - a) * cw / 4), pts = `${X(a)},${ym} ${X(a) + s2},${yHi} ${X(b) - s2},${yHi} ${X(b)},${ym} ${X(b) - s2},${yLo} ${X(a) + s2},${yLo}`;
          const bg = group(g, v === "x" ? "bus st-miss" : ("bus " + stClass(s.states?.[v])).trim());
          shapeWithState(bg, "polygon", {points: pts}, v === "x" ? "miss" : s.states?.[v]);
          if (v !== "x" && (b - a) * cw > 10) txt(bg, (X(a) + X(b)) / 2, ym, v, {size: 11, mono: true});
        }
        prev = v;
      });
      if (d) el(g, "path", {d, class: `w w-${kind} sig`, fill: "none"});
    });
    marks.forEach(m => { el(g, "line", {x1: X(m.t), y1: top - 3, x2: X(m.t), y2: Y(n), class: "mark-line"});
      if (m.label) txt(g, X(m.t), top - 10, m.label, {size: 11, halo: true}); });
    if (cursor !== undefined && cursor !== null) el(g, "line", {x1: X(cursor), y1: top, x2: X(cursor), y2: Y(n), class: "time-cursor"});
    if (ticks) {
      const list = Array.isArray(ticks) ? ticks : []; if (!list.length) for (let t = 0, st = ticks === true ? 1 : ticks; t <= t1 + 1e-9; t += st) list.push(t);
      list.forEach(t => txt(g, X(t), Y(n) + 9, opt.fmt ? opt.fmt(t) : String(t).replace(".", ","), {cls: "tick", size: 10.5}));
      if (opt.xlabel) txt(g, X(t1), Y(n) + 22, opt.xlabel, {anchor: "end", cls: "tick", size: 10.5});
    }
    return {...anchors(x, y, labelW + t1 * cw, top - y + n * rh + (ticks ? (opt.xlabel ? 30 : 18) : 0)), g, X, rowY: Y};
  }

  /* ---- Idővonal / Gantt ---------------------------------------------- */
  /* spec: {rows: ["P0", …], segs: [{row, from, to, label, state, title}], marks: [{t, row, label}],
     arrows: [{from: [sor, t], to: [sor, t], label, kind}]}; sor: név vagy index.
     opt: w (az időtengely szélessége px), t0, t1, rh, labelW, ticks (lépésköz|tömb), upto, cursor,
     xlabel, onSeg(seg). Vissza: {X(t), rowY(i)} */
  function gantt(parent, x, y, spec, opt = {}) {
    ensureDefs(parent);
    const rows = spec.rows, segs = spec.segs || [];
    const t0 = opt.t0 ?? 0, t1 = opt.t1 ?? Math.max(1, ...segs.map(s => s.to));
    const {w = 520, rh = 26, upto = t1, cursor, xlabel, onSeg} = opt;
    const labelW = opt.labelW ?? Math.max(40, ...rows.map(r => textWidth(r, 12) + 12));
    const g = group(parent, "gantt"), x0 = x + labelW, y0 = y + 4;
    const X = t => x0 + (t - t0) / (t1 - t0) * w;
    const R = r => typeof r === "number" ? r : rows.indexOf(r), Y = r => y0 + R(r) * rh;
    let ticks = opt.ticks;
    if (!Array.isArray(ticks)) { const st = ticks || niceStep((t1 - t0) / 8); ticks = [];
      for (let t = Math.ceil(t0 / st) * st; t <= t1 + 1e-9; t += st) ticks.push(+t.toFixed(9)); }
    ticks.forEach(t => { el(g, "line", {x1: X(t), y1: y0, x2: X(t), y2: y0 + rows.length * rh, class: "grid-t"});
      txt(g, X(t), y0 + rows.length * rh + 9, opt.fmt ? opt.fmt(t) : fmtTick(t), {cls: "tick", size: 10.5}); });
    rows.forEach((r, i) => { txt(g, x, y0 + i * rh + rh / 2, r, {anchor: "start"});
      el(g, "line", {x1: x0, y1: y0 + (i + 1) * rh, x2: x0 + w, y2: y0 + (i + 1) * rh, class: "grid"}); });
    segs.forEach(s => {
      if (s.from >= upto) return;

function encode(d, sec) { let w = 0; DPOS.forEach((p, i) => { w |= (d >> i & 1) << p; });
  const s = synd(w); for (let j = 0; j < 3; j++) w |= (s >> j & 1) << (1 << j); if (sec) w |= par(w); return w; }
const extract = w => DPOS.reduce((a, p, i) => a | ((w >> p & 1) << i), 0);
function decode(w, sec) { const s = synd(w), P = sec ? par(w) : 0;
  if (sec) { if (!P && !s) return {st: "o", d: extract(w), s, P};
    if (P) return {st: "c", d: extract(w ^ (1 << s)), s, P, pos: s}; return {st: "d", d: -1, s, P}; }
  if (!s) return {st: "o", d: extract(w), s, P}; return {st: "c", d: extract(w ^ (1 << s)), s, P, pos: s}; }
["secded", "ham"].forEach(k => DATA.table[k].forEach(([d, mask, st, rd, s]) => {
  const r = decode(encode(d, k === "secded") ^ mask, k === "secded");
  if (r.st !== st || r.d !== rd || r.s !== s) throw new Error("paritáshiba " + k + " " + d + " " + mask); }));
let data = DATA.word, flips = new Set([6]);
const bin4 = d => "d1…d4 = " + [0,1,2,3].map(i => d >> i & 1).join(" ");
const app = UI.app({
  choices: [{id: "code", label: "Kód", options: [["secded", "SECDED (8,4)"], ["ham", "Hamming (7,4)"]], value: "secded"}],
  buttons: [{id: "clr", label: "Hibák törlése", action: a => { flips.clear(); a.rebuild(); }},
            {id: "one", label: "Egy véletlen hiba", action: a => { rnd(1, a); }},
            {id: "two", label: "Két véletlen hiba", action: a => { rnd(2, a); }}],
  build: p => { const sec = p.code === "secded"; if (!sec) flips.delete(0);
    const clean = encode(data, sec); let mask = 0; flips.forEach(i => mask |= 1 << i);
    return {sec, clean, got: clean ^ mask, res: decode(clean ^ mask, sec), n: flips.size}; },
  render(s) {
    Draw.clear(svg);
    const w = 56, x0 = 110, show = i => s.sec || i > 0;
    Draw.txt(svg, 10, 16, "adatbitek (kattintva átállíthatók):", {anchor: "start", bold: true});
    Draw.cells(svg, 270, 4, [0,1,2,3].map(i => String(data >> i & 1)), {w: 40, h: 26,
      states: () => "active", onClick: i => { data ^= 1 << i; app.rebuild(); }, title: i => "d" + (i + 1)});
    [0,1,2,3].forEach(i => Draw.txt(svg, 290 + 40 * i, 42, "d" + (i + 1), {size: 11}));
    for (let i = 0; i < 8; i++) if (show(i)) {
      Draw.cell(svg, x0 + w * i, 52, w, 20, String(i), {state: "head"});
      Draw.cell(svg, x0 + w * i, 74, w, 20, NAMES[i], {state: NAMES[i][0] === "p" ? "c1" : "c0"}); }
    Draw.txt(svg, 100, 62, "pozíció", {anchor: "end", size: 11});
    Draw.txt(svg, 100, 84, "bit", {anchor: "end", size: 11});
    const bits = x => Array.from({length: 8}, (_, i) => x >> i & 1);
    const rowCells = (y, label, word, clickable) => {
      Draw.txt(svg, 100, y + 13, label, {anchor: "end", bold: true, size: 11});
      bits(word).forEach((b, i) => { if (!show(i)) return;
        Draw.cell(svg, x0 + w * i, y, w, 26, String(b), {state: clickable && flips.has(i) ? "miss" : clickable && s.res.pos === i ? "hl" : "",
          onClick: clickable ? () => { flips.has(i) ? flips.delete(i) : flips.add(i); app.rebuild(); } : undefined,
          title: clickable ? "kattints az átbillentéshez" : undefined}); }); };
    rowCells(102, "kódolt", s.clean, false);
    rowCells(136, "olvasott ✎", s.got, true);
    COVER.forEach(([nm, cov], r) => { if (!s.sec && nm === "p0") return;
      const y = 180 + 24 * r, ones = cov.reduce((a, i) => a + (s.got >> i & 1), 0), odd = ones & 1;
      Draw.txt(svg, 100, y + 11, nm + " ellenőrzés", {anchor: "end", size: 11});
      for (let i = 0; i < 8; i++) if (show(i)) Draw.cell(svg, x0 + w * i, y, w, 22, cov.includes(i) ? String(s.got >> i & 1) : "",
        {state: cov.includes(i) ? (odd ? "hl2" : "") : "off"});
      Draw.txt(svg, 566, y + 11, odd ? "páratlan" : "páros", {anchor: "start", size: 11, bold: odd}); });
    const truth = data, r = s.res;
    let verdict, st;
    if (r.st === "o") { verdict = "a dekóder hibátlannak látja"; st = r.d === truth ? "az adat helyes" : "de az adat ROSSZ (észrevétlen hiba)"; }
    else if (r.st === "c") { verdict = `egy hibát javít a ${r.pos}. pozíción`; st = r.d === truth ? "az adat helyes" : "de az adat ROSSZ (téves javítás)"; }
    else { verdict = "kettős (nem javítható) hibát jelez"; st = "az adatot nem adja tovább"; }
    Draw.txt(svg, 10, 290, `szindróma s = ${r.s}` + (s.sec ? `, teljes paritás P = ${r.P}` : ""), {anchor: "start", bold: true});
    Draw.txt(svg, 10, 312, `dekódolt: ${r.d < 0 ? "–" : bin4(r.d)}`, {anchor: "start"});
    Draw.txt(svg, 10, 334, `${verdict}; ${st}`, {anchor: "start"});
    return `${bin4(data)} · bevitt hibák: ${s.n} (${[...flips].sort().join(", ") || "nincs"}) · ${verdict}; ${st}`;
  }
});
function rnd(k, a) { const lo = a.get("code") === "secded" ? 0 : 1; flips.clear();
  while (flips.size < k) flips.add(lo + Math.floor(Math.random() * (8 - lo))); a.rebuild(); }
