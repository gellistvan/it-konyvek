<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiszterézis és időtartam</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.panel{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
button.on{outline:2px solid var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><label>bekapcsolás <input id="hi" type="range" min="33" max="37" step="0.1" value="35" aria-label="Bekapcsolási küszöb °C"> <span id="hiv"></span></label><label>kikapcsolás <input id="lo" type="range" min="32" max="36" step="0.1" value="34" aria-label="Kikapcsolási küszöb °C"> <span id="lov"></span></label><label>for <input id="for" type="range" min="0" max="10" step="1" value="5" aria-label="Időtartam percben"> <span id="forv"></span></label><label><input type="checkbox" id="nh"> hiszterézis ki (kikapcsolás = bekapcsolás)</label><button type="button" id="rst">⏮ Alapértékek</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 470" role="img" aria-label="A 17.4.4 hőmérséklet-idősora a bekapcsolási és a kikapcsolási küszöbbel és a holtsávval; alatta a szabály állapota percenként."></svg>
<pre class="panel" id="tbl" aria-label="Kiértékelési táblázat"></pre>

<p class="small">Percenkénti kiértékelés: Figyelés (Pending), ha az érték a bekapcsolási küszöb fölött van; Riasztás, ha ez legalább „for” percig tart; visszaállás a kikapcsolási küszöb alatt. Illusztratív adatok, nem mérés.</p>
<script>

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a["font-family"]="ui-monospace,monospace";
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="circle"){dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2},st));
    if(n.hatch)dg_mk(g,"ellipse",{cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});}
  else if(n.shape==="store"){dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:st.fill,stroke:"none"});
    const sl={stroke:st.stroke,"stroke-width":st["stroke-width"]+0.8,"stroke-dasharray":st["stroke-dasharray"]};
    dg_mk(g,"line",Object.assign({x1:x,y1:y,x2:x+w,y2:y},sl));dg_mk(g,"line",Object.assign({x1:x,y1:y+h,x2:x+w,y2:y+h},sl));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

const svgEl=document.getElementById("v"), statusEl=document.getElementById("status");
function setCode(i){document.querySelectorAll("#code span").forEach(x=>x.classList.remove("on"));
  const L=document.getElementById("L"+i); if(L)L.classList.add("on");}

const SER = [[0, 33.0], [1, 34.5], [2, 36.0], [3, 35.8], [4, 35.5], [5, 35.6], [6, 35.2], [7, 36.0], [8, 34.8], [9, 33.9]];
const EXPECT = [["Normal", ""], ["Normal", ""], ["Pending", "feltétel igaz, időtartam indul"], ["Pending", "Figyelés (1 perc)"], ["Pending", "Figyelés (2 perc)"], ["Pending", "Figyelés (3 perc)"], ["Pending", "Figyelés (4 perc)"], ["Alerting", "5 perc eltelt (2.→7. perc), folyamatosan > 35 °C"], ["Alerting", "még 34 °C felett, nincs visszaállás (holtsáv)"], ["Resolved", "34 °C alá esett"]];
const HUN = {Normal:"Normál",Pending:"Figyelés",Alerting:"Riasztás",Resolved:"Visszaállás"};
function f(x,d){ return (d===undefined? String(+x.toFixed(2)) : x.toFixed(d)).replace(".",",").replace("-","−"); }
function evaluate(high, low, forMin){
  let st="Normal", start=null; const out=[];
  SER.forEach(([t,v])=>{ let note="";
    if (st==="Normal"||st==="Resolved"){ st="Normal";
      if (v>high){ st="Pending"; start=t; note="feltétel igaz, időtartam indul";
        if (forMin===0){ st="Alerting"; note="feltétel igaz, for = 0: azonnal riaszt"; } } }
    else if (st==="Pending"){
      if (v>high){ if (t-start>=forMin){ st="Alerting"; note=forMin+" perc eltelt ("+start+".→"+t+". perc), folyamatosan > "+f(high)+" °C"; }
                   else note="Figyelés ("+(t-start)+" perc)"; }
      else { st="Normal"; start=null; note="feltétel hamis a for letelte előtt"; } }
    else if (st==="Alerting"){
      if (v<low){ st="Resolved"; start=null; note=f(low)+" °C alá esett"; }
      else if (v<=high) note="még "+f(low)+" °C felett, nincs visszaállás (holtsáv)"; }
    out.push([t,v,st,note]); });
  return out; }
function val(id){ return +document.getElementById(id).value; }
function draw(){
  let high=val("hi"), low=val("lo"); const forMin=val("for"), nh=document.getElementById("nh").checked;
  if (low>high){ low=high; document.getElementById("lo").value=low; }
  if (nh) low=high;
  document.getElementById("hiv").textContent=f(high,1)+" °C"; document.getElementById("lov").textContent=f(low,1)+" °C";
  document.getElementById("forv").textContent=forMin+" perc";
  const res=evaluate(high,low,forMin);
  svgEl.innerHTML=""; svgEl.setAttribute("viewBox","0 0 1000 470"); dg_defs(svgEl);
  const X=t=>90+t*95, Y=v=>40+(36.8-v)/(36.8-32.6)*280;
  const fg=dg_css("--fg"), mut=dg_css("--muted");
  dg_mk(svgEl,"rect",{x:X(-0.3),y:Y(high),width:X(9.4)-X(-0.3),height:Math.max(0,Y(low)-Y(high)),fill:"url(#dgp_diag)",opacity:0.4});
  [[high,"7 4","bekapcsolás "+f(high,1)+" °C"],[low,"1.5 3.5","kikapcsolás "+f(low,1)+" °C"]].forEach(([v,da,lab],i)=>{
    dg_mk(svgEl,"line",{x1:X(-0.3),y1:Y(v),x2:X(9.4),y2:Y(v),stroke:fg,"stroke-dasharray":da,"stroke-width":2});
    dg_text(svgEl,X(4.5),Y(v)+(i?16:-8),lab,14,{bg:true}); });
  for (let v=33; v<=36; v+=1){ dg_text(svgEl,X(-0.4),Y(v),f(v,1),14,{anchor:"end",fill:mut}); }
  dg_mk(svgEl,"path",{d:"M"+SER.map(([t,v])=>X(t)+" "+Y(v)).join("L"),fill:"none",stroke:fg,"stroke-width":2.2});
  SER.forEach(([t,v])=>{ dg_mk(svgEl,"circle",{cx:X(t),cy:Y(v),r:5,fill:fg}); dg_text(svgEl,X(t),Y(v)-14,f(v,1),14,{}); });
  // állapotsáv
  const pat={Normal:null,Pending:"dgp_dots",Alerting:"dgp_diag",Resolved:"dgp_cross"};
  res.forEach(([t,v,s])=>{ const x=X(t)-47, w=95;
    dg_mk(svgEl,"rect",{x:x,y:345,width:w,height:40,fill:s==="Alerting"?dg_css("--fill2"):dg_css("--cell"),stroke:fg});
    if (pat[s]) dg_mk(svgEl,"rect",{x:x,y:345,width:w,height:40,fill:"url(#"+pat[s]+")",opacity:0.45});
    dg_text(svgEl,X(t),365,HUN[s],14,{bg:true});
    dg_text(svgEl,X(t),405,t+".",14,{fill:mut}); });
  dg_text(svgEl,X(4.5),430,"idő [perc] – illusztratív adatok a 17.4.4 táblázatából, nem mérés",14,{fill:mut});
  document.getElementById("tbl").textContent="Idő | °C | Állapot | Megjegyzés\n"+res.map(([t,v,s,n])=>t+" | "+f(v,1)+" | "+HUN[s]+" | "+n).join("\n");
  const a=res.findIndex(r=>r[2]==="Alerting"), r=res.findIndex(r=>r[2]==="Resolved");
  statusEl.textContent = (a<0 ? "Nincs riasztás ebben a sorozatban." : "Riasztás a "+a+". percben ("+res[a][3]+")") +
     (r<0 ? (a<0?"":"; a 9. percig nem áll vissza.") : "; visszaállás a "+r+". percben ("+res[r][3]+").");
}
["hi","lo","for"].forEach(i=>document.getElementById(i).addEventListener("input",draw));
document.getElementById("nh").addEventListener("change",draw);
document.getElementById("rst").addEventListener("click",()=>{ document.getElementById("hi").value=35; document.getElementById("lo").value=34;
  document.getElementById("for").value=5; document.getElementById("nh").checked=false; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
try{ document.documentElement.dataset.selfcheck = JSON.stringify(evaluate(35,34,5).map(r=>[r[2],r[3]]))===JSON.stringify(EXPECT) &&
  evaluate(35,35,5)[8][2]==="Resolved" ? "ok" : "mismatch"; }catch(err){ document.documentElement.dataset.selfcheck="error "+err; }
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
