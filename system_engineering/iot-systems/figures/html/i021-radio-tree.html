<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rádióválasztási döntési fa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--cell2:#a6a6a6;--line:#000;--code:#f3f3f3;--ok:#1e6b2e;--err:#c00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--cell2:#777;--line:#ddd;--code:#2a2a2a;--ok:#7fd08f;--err:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6em}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:500}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Válasz">
<button id="yes">igen</button><button id="no">nem</button><button id="back">◀ vissza</button>
<button id="restart">⏮ Elölről</button><button id="ts">▶ TerraSense-követelmények betöltése</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="-5 0 765 660" role="img" aria-label="Négy kérdés: hatótáv legfeljebb 100 m; elemes vagy erősen energiakorlátos; kell-e több ugrás (mesh); kis, ritka üzenet. Öt levél: Wi-Fi, BLE (csillag), Thread/Zigbee (mesh), LoRaWAN, NB-IoT/LTE-M. A TerraSense útja: igen, igen, nem – BLE."></svg>
  <pre id="code" aria-label="Kód"></pre>
</div>
<p class="small">Folytonos nyíl: igen, szaggatott: nem. A TerraSense-követelmények (10–50 m, elemes csomópont, egy gateway lefedi az üvegházat) a BLE-hez vezetnek; több egymástól távoli üvegháznál a LoRaWAN-ág jön szóba (lásd a LoRaWAN-alfejezetet).</p>
<script>
const DATA = {"nodes": {"q1": {"kind": "q", "x": 380, "y": 60, "text": "Hatótáv\n≤ 100 m?", "yes": "q2", "no": "q4"}, "q2": {"kind": "q", "x": 190, "y": 235, "text": "Elemes / erősen\nenergiakorlátos?", "yes": "q3", "no": "wifi"}, "q3": {"kind": "q", "x": 125, "y": 420, "text": "Több ugrás\n(mesh) kell?", "yes": "thread", "no": "ble"}, "q4": {"kind": "q", "x": 590, "y": 235, "text": "Kis, ritka\nüzenet?", "yes": "lora", "no": "cell"}, "wifi": {"kind": "leaf", "x": 320, "y": 420, "text": "Wi-Fi", "why": "Rövid hatótáv, hálózati táplálás: a Wi-Fi nagy adatsebességét az energia nem korlátozza."}, "ble": {"kind": "leaf", "x": 74, "y": 610, "text": "BLE\n(csillag)", "why": "Rövid hatótáv, elemes eszköz, egy gateway lefedi a területet: a BLE csillagtopológia a legegyszerűbb és legtakarékosabb."}, "thread": {"kind": "leaf", "x": 236, "y": 610, "text": "Thread/Zigbee\n(mesh)", "why": "Rövid hatótáv, elemes eszköz, de több ugrás kell: a Thread vagy a Zigbee mesh-hálózatot ad."}, "lora": {"kind": "leaf", "x": 500, "y": 420, "text": "LoRaWAN", "why": "Nagy hatótáv, kis és ritka üzenetek: a LoRaWAN kis energiával nagy távolságot hidal át."}, "cell": {"kind": "leaf", "x": 684, "y": 420, "text": "NB-IoT /\nLTE-M", "why": "Nagy hatótáv és nagyobb adatmennyiség vagy meglévő cellás lefedettség: NB-IoT/LTE-M."}}, "edges": [{"a": "q1", "b": "q2", "ans": "igen", "pts": [[380, 112.0], [380, 140.4], [190, 140.4], [190, 183.0]], "ts": true}, {"a": "q1", "b": "q4", "ans": "nem", "pts": [[380, 112.0], [380, 140.4], [590, 140.4], [590, 183.0]], "ts": false}, {"a": "q2", "b": "q3", "ans": "igen", "pts": [[190, 287.0], [190, 319.4], [125, 319.4], [125, 368.0]], "ts": true}, {"a": "q2", "b": "wifi", "ans": "nem", "pts": [[190, 287.0], [190, 328.2], [320, 328.2], [320, 390.0]], "ts": false}, {"a": "q3", "b": "thread", "ans": "igen", "pts": [[125, 472.0], [125, 515.2], [236, 515.2], [236, 580.0]], "ts": false}, {"a": "q3", "b": "ble", "ans": "nem", "pts": [[125, 472.0], [125, 515.2], [74, 515.2], [74, 580.0]], "ts": true}, {"a": "q4", "b": "lora", "ans": "igen", "pts": [[590, 287.0], [590, 328.2], [500, 328.2], [500, 390.0]], "ts": false}, {"a": "q4", "b": "cell", "ans": "nem", "pts": [[590, 287.0], [590, 328.2], [684, 328.2], [684, 390.0]], "ts": false}], "ts": ["igen", "igen", "nem"], "QW": 214, "QH": 104, "LW": 144, "LH": 60};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return x.toFixed(d).replace(".",",").replace("-","−");}
const codeEl = document.getElementById("code");
function setCode(lines){ if(!lines.length){codeEl.style.display="none";return;} codeEl.style.display=""; codeEl.innerHTML = lines.map((l,i)=>`<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join(""); }
function hlCode(idx){ codeEl.querySelectorAll("span").forEach(x=>x.classList.remove("on")); (Array.isArray(idx)?idx:[idx]).forEach(i=>{ if(i!==undefined&&i>=0){const L=document.getElementById("L"+i); if(L)L.classList.add("on");}}); }
function setStatus(t){ document.getElementById("status").textContent = t; }
function defs(){ const d = el("defs",{});
  const m = el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--line")},undefined,m);
  const m2 = el("marker",{id:"ahh",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--hl2")},undefined,m2);
  const p = el("pattern",{id:"hatch",patternUnits:"userSpaceOnUse",width:"6",height:"6",patternTransform:"rotate(45)"},undefined,d);
  el("line",{x1:0,y1:0,x2:0,y2:6,stroke:css("--line"),"stroke-width":1.2},undefined,p);
  const q = el("pattern",{id:"dots",patternUnits:"userSpaceOnUse",width:"5",height:"5"},undefined,d);
  el("circle",{cx:2.5,cy:2.5,r:0.9,fill:css("--line")},undefined,q);
  const x = el("pattern",{id:"cross",patternUnits:"userSpaceOnUse",width:"6",height:"6"},undefined,d);
  el("path",{d:"M0,0 L6,6 M6,0 L0,6",stroke:css("--line"),"stroke-width":0.9},undefined,x);
  const h = el("pattern",{id:"horiz",patternUnits:"userSpaceOnUse",width:"6",height:"5"},undefined,d);
  el("line",{x1:0,y1:2.5,x2:6,y2:2.5,stroke:css("--line"),"stroke-width":1},undefined,h);
  return d; }

setCode([]);

const N = DATA.nodes, QW = DATA.QW, QH = DATA.QH, LW = DATA.LW, LH = DATA.LH;
let path = ["q1"], answers = [], timer = null;
function cur(){ return path[path.length-1]; }
function draw(){
  svg.innerHTML = ""; defs();
  for (const e of DATA.edges){
    const on = path.includes(e.a) && path.includes(e.b) && path.indexOf(e.b) === path.indexOf(e.a) + 1;
    const p = e.pts;
    el("path",{d:"M"+p.map(q=>q.join(",")).join(" L"),fill:"none",stroke:on?css("--hl2"):css("--line"),
      "stroke-width":on?4:1.4,"stroke-dasharray":e.ans==="igen"?"none":"7 4","marker-end":on?"url(#ahh)":"url(#ah)"});
    el("text",{x:(p[1][0]+p[2][0])/2,y:p[1][1]-6,"text-anchor":"middle","font-size":14,"font-weight":on?"bold":"normal"},e.ans);
  }
  for (const k in N){ const v = N[k], on = path.includes(k), here = k === cur();
    const fill = here ? css("--cellhl") : (on ? css("--cell") : css("--cell"));
    if (v.kind === "q") el("polygon",{points:`${v.x},${v.y-QH/2} ${v.x+QW/2},${v.y} ${v.x},${v.y+QH/2} ${v.x-QW/2},${v.y}`,fill:fill,
      stroke:here?css("--hl2"):css("--line"),"stroke-width":here?4:(on?2.6:1.3)});
    else el("rect",{x:v.x-LW/2,y:v.y-LH/2,width:LW,height:LH,rx:10,fill:fill,stroke:here?css("--hl2"):css("--line"),"stroke-width":here?4:(on?2.6:1.3)});
    const ls = v.text.split("\n");
    ls.forEach((t,i) => el("text",{x:v.x,y:v.y+5+(i-(ls.length-1)/2)*16,"text-anchor":"middle","font-size":14,"font-weight":v.kind==="leaf"?"bold":"normal"},t));
  }
}
function show(){
  const n = N[cur()];
  if (n.kind === "q") setStatus(`${answers.length+1}. kérdés: ${n.text.replace("\n"," ")}` + (answers.length ? `  (eddigi válaszok: ${answers.join(", ")})` : ""));
  else setStatus(`Eredmény: ${n.text.replace("\n"," ")} – ${n.why}`);
  document.getElementById("yes").disabled = document.getElementById("no").disabled = n.kind !== "q";
  draw();
}
function answer(a){ const n = N[cur()]; if (n.kind !== "q") return; answers.push(a); path.push(a === "igen" ? n.yes : n.no); show(); }
function stop(){ if (timer){ clearInterval(timer); timer = null; } }
document.getElementById("yes").onclick = () => { stop(); answer("igen"); };
document.getElementById("no").onclick = () => { stop(); answer("nem"); };
document.getElementById("back").onclick = () => { stop(); if (path.length > 1){ path.pop(); answers.pop(); } show(); };
document.getElementById("restart").onclick = () => { stop(); path = ["q1"]; answers = []; show(); };
document.getElementById("ts").onclick = () => { stop(); path = ["q1"]; answers = []; show(); let i = 0;
  timer = setInterval(() => { if (i >= DATA.ts.length){ stop(); return; } answer(DATA.ts[i++]); }, 1000); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
show();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
