<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eseményidő-ablakok és watermark</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>MAX_LATENESS_MS: <input id="wsl" type="range" min="60000" max="900000" step="30000" value="600000"
 aria-label="MAX_LATENESS_MS"> <span id="wval">600 000</span></label>
<label><input type="checkbox" id="e8" checked> c) feladat 8. eseménye (offset 7)</label>
<script>
function i047upd(){ const W=+document.getElementById("wsl").value;
  document.getElementById("wval").textContent=W.toLocaleString("hu-HU");
  setSteps(compute(W, document.getElementById("e8").checked)); }
document.getElementById("wsl").addEventListener("input", i047upd);
document.getElementById("e8").addEventListener("change", i047upd);
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Eseményidő-tengely 60 s-os ablakokkal, a labor nyolc eseményével, a max_seen_ts és a watermark függőleges vonalával; lépésenként az ablakok darabszáma, minimuma és maximuma frissül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor consumer.py process() függvényének átirata (checkpoint nélkül); az állapotsor a labor kimenetsora szó szerint. Csúszka: MAX_LATENESS_MS; jelölőnégyzet: a c) feladat késő eseménye. Számított, nem mérés.</p>

let STEPS = [{"i": 0, "kind": "ok", "max": 1700000000000, "wm": 1699999400000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.5, "sum": 23.5, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=0 key=('n001', 'b01', 1) ts=1700000000000 temp=23.5", "lines": ["[feldolgozva] offset=0 key=('n001', 'b01', 1) ts=1700000000000 temp=23.5"], "line": 24}, {"i": 1, "kind": "ok", "max": 1700000000000, "wm": 1699999400000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.5, "sum": 23.5, "count": 1}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=1 key=('n002', 'b02', 1) ts=1700000000000 temp=24.1", "lines": ["[feldolgozva] offset=1 key=('n002', 'b02', 1) ts=1700000000000 temp=24.1"], "line": 24}, {"i": 2, "kind": "ok", "max": 1700000030000, "wm": 1699999430000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=2 key=('n001', 'b01', 2) ts=1700000030000 temp=23.8", "lines": ["[feldolgozva] offset=2 key=('n001', 'b01', 2) ts=1700000030000 temp=23.8"], "line": 24}, {"i": 3, "kind": "ok", "max": 1700000060000, "wm": 1699999460000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}, "1700000040000": {"n001": {"min": 24.2, "max": 24.2, "sum": 24.2, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=3 key=('n001', 'b01', 3) ts=1700000060000 temp=24.2", "lines": ["[feldolgozva] offset=3 key=('n001', 'b01', 3) ts=1700000060000 temp=24.2"], "line": 24}, {"i": 4, "kind": "ok", "max": 1700000060000, "wm": 1699999460000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}, "1700000040000": {"n001": {"min": 24.2, "max": 24.2, "sum": 24.2, "count": 1}, "n002": {"min": 24.5, "max": 24.5, "sum": 24.5, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=4 key=('n002', 'b02', 2) ts=1700000040000 temp=24.5", "lines": ["[feldolgozva] offset=4 key=('n002', 'b02', 2) ts=1700000040000 temp=24.5"], "line": 24}, {"i": 5, "kind": "dup", "max": 1700000060000, "wm": 1699999460000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}, "1700000040000": {"n001": {"min": 24.2, "max": 24.2, "sum": 24.2, "count": 1}, "n002": {"min": 24.5, "max": 24.5, "sum": 24.5, "count": 1}}}, "closed": [], "msg": "[duplikátum] offset=5 key=('n001', 'b01', 2)", "lines": ["[duplikátum] offset=5 key=('n001', 'b01', 2)"], "line": 9}, {"i": 6, "kind": "ok", "max": 1700000090000, "wm": 1699999490000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}, "1700000040000": {"n001": {"min": 24.2, "max": 24.6, "sum": 48.8, "count": 2}, "n002": {"min": 24.5, "max": 24.5, "sum": 24.5, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=6 key=('n001', 'b01', 4) ts=1700000090000 temp=24.6", "lines": ["[feldolgozva] offset=6 key=('n001', 'b01', 4) ts=1700000090000 temp=24.6"], "line": 24}, {"i": 7, "kind": "ok", "max": 1700000090000, "wm": 1699999490000, "open": {"1699999980000": {"n001": {"min": 23.5, "max": 23.8, "sum": 47.3, "count": 2}, "n002": {"min": 24.1, "max": 24.1, "sum": 24.1, "count": 1}}, "1700000040000": {"n001": {"min": 24.2, "max": 24.6, "sum": 48.8, "count": 2}, "n002": {"min": 24.5, "max": 24.5, "sum": 24.5, "count": 1}}, "1699999680000": {"n001": {"min": 21.0, "max": 21.0, "sum": 21.0, "count": 1}}}, "closed": [], "msg": "[feldolgozva] offset=7 key=('n001', 'b01', 5) ts=1699999700000 temp=21.0", "lines": ["[feldolgozva] offset=7 key=('n001', 'b01', 5) ts=1699999700000 temp=21.0"], "line": 24}, {"i": 8, "kind": "end", "max": 1700000090000, "wm": 1699999490000, "open": {}, "closed": [{"ws": 1699999680000, "node": "n001", "min": 21.0, "max": 21.0, "avg": 21.0, "count": 1}, {"ws": 1699999980000, "node": "n001", "min": 23.5, "max": 23.8, "avg": 23.6, "count": 2}, {"ws": 1699999980000, "node": "n002", "min": 24.1, "max": 24.1, "avg": 24.1, "count": 1}, {"ws": 1700000040000, "node": "n001", "min": 24.2, "max": 24.6, "avg": 24.4, "count": 2}, {"ws": 1700000040000, "node": "n002", "min": 24.5, "max": 24.5, "avg": 24.5, "count": 1}], "msg": "[ablak] start=1699999680000 node=n001 min=21.0 max=21.0 avg=21.0 count=1  [ablak] start=1699999980000 node=n001 min=23.5 max=23.8 avg=23.6 count=2  [ablak] start=1699999980000 node=n002 min=24.1 max=24.1 avg=24.1 count=1  [ablak] start=1700000040000 node=n001 min=24.2 max=24.6 avg=24.4 count=2  [ablak] start=1700000040000 node=n002 min=24.5 max=24.5 avg=24.5 count=1  Végső commit offset=8, feldolgozott kulcsok: 7", "lines": ["[ablak] start=1699999680000 node=n001 min=21.0 max=21.0 avg=21.0 count=1", "[ablak] start=1699999980000 node=n001 min=23.5 max=23.8 avg=23.6 count=2", "[ablak] start=1699999980000 node=n002 min=24.1 max=24.1 avg=24.1 count=1", "[ablak] start=1700000040000 node=n001 min=24.2 max=24.6 avg=24.4 count=2", "[ablak] start=1700000040000 node=n002 min=24.5 max=24.5 avg=24.5 count=1", "Végső commit offset=8, feldolgozott kulcsok: 7"], "line": 30}];
const CODE = ["def process(events):", "    state = load_checkpoint()", "    seen = {tuple(x) for x in state[\"seen\"]}", "    for i, event in enumerate(events):", "        if i < state[\"offset\"]:", "            continue", "        key = (event[\"node_id\"], event[\"boot_id\"], int(event[\"seq\"]))", "        ts = int(event[\"ts\"])", "        if key in seen:", "            print(f\"  [duplikátum] offset={i} key={key}\")", "            state[\"offset\"] = i + 1", "            checkpoint_and_maybe_crash(state, i)", "            continue", "        max_seen_ts = state[\"max_seen_ts\"]", "        if max_seen_ts is not None and ts < max_seen_ts - MAX_LATENESS_MS:", "            print(f\"  [késő] offset={i} key={key} ts={ts} (max_ts={max_seen_ts})\")", "            seen.add(key)", "            state[\"late_events\"].append({...})   # DLQ", "            state[\"offset\"] = i + 1", "            checkpoint_and_maybe_crash(state, i)", "            continue", "        seen.add(key)", "        state[\"max_seen_ts\"] = ts if max_seen_ts is None else max(max_seen_ts, ts)", "        add_to_window(state, event)", "        print(f\"  [feldolgozva] offset={i} key={key} ts={ts} temp={event['temperature']}\")", "        state[\"offset\"] = i + 1", "        close_windows(state, state[\"max_seen_ts\"] - MAX_LATENESS_MS)", "        checkpoint_and_maybe_crash(state, i)", "    close_windows(state, state[\"max_seen_ts\"] + WINDOW_SIZE_MS)", "    save_checkpoint(state)", "    print(f\"Végső commit offset={state['offset']}, feldolgozott kulcsok: {len(state['seen'])}\")"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = [{"node_id": "n001", "boot_id": "b01", "seq": 1, "ts": 1700000000000, "temperature": 23.5}, {"node_id": "n002", "boot_id": "b02", "seq": 1, "ts": 1700000000000, "temperature": 24.1}, {"node_id": "n001", "boot_id": "b01", "seq": 2, "ts": 1700000030000, "temperature": 23.8}, {"node_id": "n001", "boot_id": "b01", "seq": 3, "ts": 1700000060000, "temperature": 24.2}, {"node_id": "n002", "boot_id": "b02", "seq": 2, "ts": 1700000040000, "temperature": 24.5}, {"node_id": "n001", "boot_id": "b01", "seq": 2, "ts": 1700000030000, "temperature": 23.8}, {"node_id": "n001", "boot_id": "b01", "seq": 4, "ts": 1700000090000, "temperature": 24.6}, {"node_id": "n001", "boot_id": "b01", "seq": 5, "ts": 1699999700000, "temperature": 21.0}];
function keyS(e){return "('"+e.node_id+"', '"+e.boot_id+"', "+e.seq+")";}
function f1(x){return x.toFixed(1);}
function compute(W, with8){
  const evs = with8 ? ALL : ALL.slice(0,7);
  const seen = new Set(); let mx = null; const win = {}; const closed = []; const out = [];
  function close(wm){ const lines=[];
    Object.keys(win).map(Number).sort((a,b)=>a-b).forEach(ws=>{ if (ws + 60000 > wm) return;
      Object.keys(win[ws]).sort().forEach(n=>{ const a=win[ws][n]; const avg=a.sum/a.count;
        lines.push("[ablak] start="+ws+" node="+n+" min="+f1(a.min)+" max="+f1(a.max)+" avg="+f1(avg)+" count="+a.count);
        closed.push({ws:ws,node:n,min:a.min,max:a.max,avg:avg,count:a.count}); });
      delete win[ws]; });
    return lines; }
  function snap(i,kind,lines,line){ const op={}; Object.keys(win).forEach(ws=>{op[ws]={}; Object.keys(win[ws]).forEach(n=>op[ws][n]=Object.assign({},win[ws][n]));});
    out.push({i:i,kind:kind,max:mx,wm:mx===null?null:mx-W,open:op,closed:closed.map(c=>Object.assign({},c)),msg:lines.join("  "),lines:lines,line:line}); }
  evs.forEach((e,i)=>{ const key=e.node_id+"|"+e.boot_id+"|"+e.seq; const ts=e.ts;
    if (seen.has(key)) { snap(i,"dup",["[duplikátum] offset="+i+" key="+keyS(e)],9); return; }
    if (mx!==null && ts < mx - W) { seen.add(key); snap(i,"late",["[késő] offset="+i+" key="+keyS(e)+" ts="+ts+" (max_ts="+mx+")"],15); return; }
    seen.add(key); mx = mx===null ? ts : Math.max(mx, ts);
    const ws = Math.floor(ts/60000)*60000; win[ws] = win[ws]||{};
    const a = win[ws][e.node_id] = win[ws][e.node_id] || {min:null,max:null,sum:0,count:0};
    const v = e.temperature; if (a.count===0){a.min=a.max=v;} else {a.min=Math.min(a.min,v); a.max=Math.max(a.max,v);}
    a.sum += v; a.count += 1;
    const lines = ["[feldolgozva] offset="+i+" key="+keyS(e)+" ts="+ts+" temp="+f1(e.temperature)];
    close(mx - W).forEach(l=>lines.push(l));
    snap(i,"ok",lines,24); });
  const lines = mx!==null ? close(mx + 60000) : [];
  lines.push("Végső commit offset="+evs.length+", feldolgozott kulcsok: "+seen.size);
  snap(evs.length,"end",lines,30);
  return out; }
function cm(x,d){return x.toFixed(d).replace(".",",").replace("-","−");}
function render(s){
  svg.setAttribute("viewBox","0 0 760 330"); svg.innerHTML="";
  const X0=60, X1=740, T0=1700000000000, xmin=-340, xmax=125;
  const X = t => X0 + ((t-T0)/1000 - xmin)/(xmax-xmin)*(X1-X0);
  const Yl = {n001:130, n002:205};
  const nev = STEPS.length - 1;
  // ablakok: nyitott (szaggatott) és lezárt (szürke)
  const wins = {};
  s.closed.forEach(c=>{(wins[c.ws]=wins[c.ws]||{st:"lezárva",rows:[]}).rows.push(c.node+": "+cm(c.avg,1)+" / "+c.count);});
  Object.keys(s.open).forEach(ws=>{const d=s.open[ws]; wins[ws]={st:"nyitott",rows:Object.keys(d).sort().map(n=>n+": "+d[n].count+" db, "+cm(d[n].min,1)+"–"+cm(d[n].max,1))};});
  const LET={1699999680000:"C",1699999980000:"A",1700000040000:"B"};
  let ly=22;
  Object.keys(wins).sort().forEach(ws=>{ const w=wins[ws], x=X(+ws), wd=X(+ws+60000)-x, L=LET[ws]||"?";
    el("rect",{x:x,y:90,width:wd,height:150,fill:w.st==="lezárva"?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-dasharray":w.st==="lezárva"?"":"5 3","stroke-width":1.2});
    el("text",{x:x+wd/2,y:104,"text-anchor":"middle","font-size":12,"font-weight":"bold"},L);
    el("text",{x:70,y:ly,"font-size":11.5},L+" = "+ws+" ("+w.st+"): "+w.rows.join("; ")); ly+=16; });
  // tengely
  el("line",{x1:X0,y1:262,x2:X1,y2:262,stroke:css("--line")});
  for(let t=-300;t<=120;t+=60){ const x=X0+(t-xmin)/(xmax-xmin)*(X1-X0);
    el("line",{x1:x,y1:258,x2:x,y2:266,stroke:css("--line")});
    el("text",{x:x,y:280,"text-anchor":"middle","font-size":10.5},t>0?"+"+t:cm(t,0)); }
  el("text",{x:X1,y:298,"text-anchor":"end","font-size":10.5,fill:css("--muted")},"eseményidő [s] a 1700000000000 ms-hoz képest");
  el("text",{x:8,y:Yl.n001+4,"font-size":12},"n001 ●"); el("text",{x:8,y:Yl.n002+4,"font-size":12},"n002 ▲");
  // események
  const evs = (STEPS.length-1===8)?ALL:ALL.slice(0,7);
  evs.forEach((e,i)=>{ const st=STEPS[i]; const done=i<=s.i; const cur=i===s.i;
    let x=X(e.ts), y=Yl[e.node_id]; const kind=done?st.kind:"todo";
    if (st.kind==="dup") y-=28;
    const col = done ? css("--fg") : css("--muted");
    const fillc = done ? css("--fg") : "none";
    if (kind==="late"){ el("path",{d:`M${x-7} ${y-7}L${x+7} ${y+7}M${x-7} ${y+7}L${x+7} ${y-7}`,stroke:col,"stroke-width":3}); }
    else if (e.node_id==="n002"){ el("path",{d:`M${x} ${y-8}L${x+8} ${y+6}L${x-8} ${y+6}Z`,fill:fillc,stroke:col,"stroke-width":1.4}); }
    else { el("circle",{cx:x,cy:y,r:7,fill:kind==="dup"?"none":fillc,stroke:col,"stroke-width":1.4});
      if (kind==="dup") el("line",{x1:x-10,y1:y+6,x2:x+10,y2:y-6,stroke:col,"stroke-width":1.6}); }
    if (cur) el("circle",{cx:x,cy:y,r:13,fill:"none",stroke:css("--hl"),"stroke-width":3});
    el("text",{x:x+(i===2?-9:0)+(i===4?6:0),y:y+24,"text-anchor":"middle","font-size":10.5,fill:col},String(i)); });
  // max_seen_ts és watermark
  if (s.max!==null){ const xm=X(s.max); el("line",{x1:xm,y1:84,x2:xm,y2:258,stroke:css("--hl2"),"stroke-dasharray":"7 4","stroke-width":2});
    el("text",{x:xm+3,y:80,"font-size":10.5,fill:css("--hl2")},"max_seen_ts");
    let xw=X(s.wm), lab="watermark "+cm((s.wm-T0)/1000,0)+" s";
    if (xw < X0){ xw = X0; lab = "◀ watermark "+cm((s.wm-T0)/1000,0)+" s (a tengelyen kívül)"; }
    el("line",{x1:xw,y1:84,x2:xw,y2:258,stroke:css("--hl"),"stroke-dasharray":"2 4","stroke-width":2.4});
    el("text",{x:xw+3,y:252,"font-size":10.5,fill:css("--hl")},lab); }
  el("text",{x:8,y:318,"font-size":10.5,fill:css("--muted")},"Számított a labor kódjából, nem mérés. Lépés "+(s.i<nev?"offset "+s.i:"végső zárás"));
}

document.addEventListener("DOMContentLoaded",()=>{});
try{ document.documentElement.dataset.selfcheck =
  (JSON.stringify(compute(600000,true).map(s=>s.msg))===JSON.stringify(STEPS.map(s=>s.msg))) ? "ok" : "mismatch"; }
catch(err){ document.documentElement.dataset.selfcheck = "error " + err; }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
