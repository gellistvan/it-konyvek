<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A TerraSense pipeline needs-gráfja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Pipeline típusa">
  <span>Pipeline:</span>
  <label><input type="radio" name="pv" value="mr" onchange="update()"> merge request</label>
  <label><input type="radio" name="pv" value="main" onchange="update()"> főág</label>
  <label><input type="radio" name="pv" value="tag" checked onchange="update()"> v1.7.0 tag</label>
  <button id="fail" onclick="toggleFail()">Hiba szimulálása a kijelölt jobon</button>
</div>
<div class="small">Kattintson (vagy Tab + Enter) egy jobra: alul a YAML-részlete és az artifactjai.</div>

<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 880 400" role="img" aria-label="Párhuzamos build- és tesztjobok, SBOM-kapu, majd csak tagre aláírás, publikálás, release-manifest és kézi OTA-kiadás."></svg>
<p class="small">A könyv .gitlab-ci.yml-jéből generált gráf, nem futási eredmény. A needs nélküli jobok a stage-sorrend szerint indulnak (a firmware-test és a backend-test a build stage után).</p><pre id="yaml" style="font:12.5px/1.45 ui-monospace,monospace;background:var(--code);padding:6px 8px;white-space:pre;overflow-x:auto"></pre><p class="small"></p>
