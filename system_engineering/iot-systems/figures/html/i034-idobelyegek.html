<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esemény-, gateway- és szerveridő</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
input[type=range]{width:220px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label for="off">Eszközóra eltérése: <input id="off" type="range" min="-2" max="2" step="0.1" value="0.8"> <output id="offv"></output></label>
  <label for="lat">Átviteli késés: <input id="lat" type="range" min="0" max="20" step="0.1" value="12.3"> <output id="latv"></output></label>
  <button id="reset" title="A könyv példájának értékei">Alapérték (+0,8 s; 12,3 s)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 880 470" role="img" aria-label="Időtengely 09:59:59-től 10:00:13-ig: valós esemény 10:00:00.000, az eszköz által írt ts 10:00:00.800 (0,8 s siettetés), gw_ts 10:00:12.300, server_ts 10:00:12.450; a valódi átviteli késés 12,3 s, a látszólagos késés gw_ts mínusz ts 11,5 s; alatta az eszköz uptime-ja 3 600 123 ms az eseménynél."></svg>
<p class="small">A gw_ts − ts különbség csak a késés és az óraeltérés különbségét méri: ugyanannyi jön ki például +0,8 s eltérésnél 12,3 s késéssel és 0 s eltérésnél 11,5 s késéssel. Az eltérést külön időszinkron (NTP, a gateway időválasza) vagy a seq/uptime-párok elemzése választja le. Modell, nem mérés.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs){if(attrs[a]!==undefined)e.setAttribute(a,attrs[a]);}if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}

const SC_L = {"fg": "#111111", "bg": "#ffffff", "g1": "#e6e6e6", "g2": "#bdbdbd", "g3": "#6e6e6e", "hl": "#1f4e79", "hl2": "#c55a11", "err": "#b00020", "ok": "#1e6b2e", "none": "none"}, SC_D = {"fg": "#eeeeee", "bg": "#1b1b1b", "g1": "#333333", "g2": "#555555", "g3": "#a0a0a0", "hl": "#8fb8e8", "hl2": "#f0a060", "err": "#ff7b7b", "ok": "#7fd08f", "none": "none"};
const SC_DASH = {"": "", dash: "5 3", dot: "1.2 2.2", dashdot: "6 2.5 1.5 2.5"};
function scCol(c){ const m = matchMedia("(prefers-color-scheme: dark)").matches ? SC_D : SC_L; return m[c] || c; }
function scDefs(){
  const d = el("defs", {});
  const pats = {"//": "M0,8 L8,0", "\\\\": "M0,0 L8,8", "..": "", "xx": "M0,8 L8,0 M0,0 L8,8"};
  for (const k in pats){
    const id = "scp" + ({"//": "a", "\\\\": "b", "..": "c", "xx": "d"})[k];
    const p = document.createElementNS(NS, "pattern");
    p.setAttribute("id", id); p.setAttribute("width", 8); p.setAttribute("height", 8);
    p.setAttribute("patternUnits", "userSpaceOnUse");
    if (k === "..") { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 4); c.setAttribute("cy", 4); c.setAttribute("r", 1.1); c.setAttribute("fill", scCol("g3")); p.appendChild(c); }
    else { const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", pats[k]); pa.setAttribute("stroke", scCol("g3")); pa.setAttribute("stroke-width", 1); p.appendChild(pa); }
    d.appendChild(p);
  }
}
function scPat(h){ return ({"//": "url(#scpa)", "\\\\": "url(#scpb)", "..": "url(#scpc)", "xx": "url(#scpd)"})[h]; }
function scHead(x1, y1, x2, y2, c){
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1, ux = dx / n, uy = dy / n;
  const bx = x2 - ux * 10.0, by = y2 - uy * 10.0;
  el("polygon", {points: `${x2},${y2} ${bx - uy * 4.5},${by + ux * 4.5} ${bx + uy * 4.5},${by - ux * 4.5}`, fill: c, stroke: c, "stroke-width": 0.5});
  return [bx, by];
}
function scDraw(list){
  for (const p of list){
    if (p.t === "r"){
      el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, rx: p.rx, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls]});
      if (p.ha) el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, rx: p.rx, fill: scPat(p.ha), stroke: "none"});
    } else if (p.t === "l"){
      const c = scCol(p.c); let x1 = p.x1, y1 = p.y1, x2 = p.x2, y2 = p.y2;
      if (p.a) [x2, y2] = scHead(p.x1, p.y1, p.x2, p.y2, c);
      if (p.a0) [x1, y1] = scHead(p.x2, p.y2, p.x1, p.y1, c);
      el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls]});
    } else if (p.t === "x"){
      p.s.split("\n").forEach((line, i) => {
        const a = {x: p.x, y: p.y + i * p.fs * 1.25, "font-size": p.fs, "text-anchor": p.an};
        if (p.c !== "fg") a.fill = scCol(p.c);
        if (p.b) a["font-weight"] = "bold";
        if (p.it) a["font-style"] = "italic";
        el("text", a, line);
      });
    } else if (p.t === "c"){
      el("circle", {cx: p.cx, cy: p.cy, r: p.r, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw});
    } else if (p.t === "p"){
      const pts = p.pts.map(q => q.join(",")).join(" ");
      el(p.cl ? "polygon" : "polyline", {points: pts, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls], "stroke-linejoin": "round"});
    }
  }
}


function hms(sec){
  let ms = Math.round((36000 + sec) * 1000);
  const h = Math.floor(ms / 3600000); ms -= h * 3600000;
  const m = Math.floor(ms / 60000); ms -= m * 60000;
  const s = Math.floor(ms / 1000); ms -= s * 1000;
  const p = (v, n) => String(v).padStart(n, "0");
  return `${p(h,2)}:${p(m,2)}:${p(s,2)}.${p(ms,3)}`;
}
function c1(x){ let s = x.toFixed(1).replace(".", ",").replace("-", "−"); return (s === "0,0" || s === "−0,0") ? "0" : s; }
function grp(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function Lp(x1,y1,x2,y2,o){ return Object.assign({t:"l",x1,y1,x2,y2,c:"fg",lw:1.4,ls:"",a:0,a0:0}, o||{}); }
function Tp(x,y,s,o){ return Object.assign({t:"x",x,y,s,fs:16,an:"start",b:0,c:"fg",it:0}, o||{}); }
function sceneJS(off, lat){
  const PPM = 20, UP = 3600123, SRV = 0.15, X0 = 60, X1 = 840;
  const ev = 0, tsv = off, gwv = lat, sv = lat + SRV;
  const t0 = Math.floor(Math.min(ev, tsv)) - 1, t1 = Math.ceil(Math.max(gwv, sv)) + 1;
  const sc = (X1 - X0) / (t1 - t0), X = t => X0 + (t - t0) * sc;
  const pr = []; const ya = 236, ytop = 40;
  pr.push(Lp(X0, ya, X1, ya));
  const step = (t1 - t0 <= 8) ? 1 : ((t1 - t0 <= 16) ? 2 : 4);
  for (let t = t0; t <= t1; t++){
    pr.push(Lp(X(t), ya, X(t), ya + 6, {lw:1.0}));
    if ((((t % step) + step) % step === 0) && X(t) < X1 - 45) pr.push(Tp(X(t), ya + 24, hms(t).slice(0, 8), {an:"middle", c:"g3"}));
  }
  pr.push(Tp(X1, ya + 46, "UTC", {an:"end", c:"g3"}));
  pr.push(Lp(X(ev), ytop, X(ev), ya, {lw:2.0}));
  pr.push(Lp(X(tsv), ytop + 26, X(tsv), ya, {lw:2.0, ls:"dash", c:"hl"}));
  pr.push(Lp(X(gwv), ytop, X(gwv), ya, {lw:2.0, ls:"dot"}));
  pr.push(Lp(X(sv), ytop, X(sv), ya, {lw:2.0, ls:"dashdot", c:"hl2"}));
  pr.push(Tp(X(ev) + 5, ytop + 14, "valós esemény " + hms(ev), {b:1}));
  pr.push(Tp(X(tsv) + 5, ytop + 40, "ts = " + hms(tsv) + " (eszközóra)", {c:"hl"}));
  pr.push(Tp(X(gwv) - 5, (X(gwv) - X(ev) > 440) ? ytop + 14 : ytop + 66, "gw_ts = " + hms(gwv), {an:"end"}));
  pr.push(Tp(X(sv) + 5, ytop + 14, "server_ts", {c:"hl2"}));
  pr.push(Tp(X(sv) + 5, ytop + 34, hms(sv), {c:"hl2"}));
  if (Math.abs(off) > 1e-9){
    const y = 104;
    pr.push(Lp(X(ev), y, X(tsv), y, {a:1, a0:1, c:"hl"}));
    const word = off > 0 ? "siettetés" : "késés (az óra késik)";
    pr.push(Tp(X(Math.max(ev, tsv)) + 8, y + 6, (off > 0 ? "+" : "") + c1(off) + " s " + word + " (" + PPM + " ppm-es óra)", {c:"hl"}));
  }
  let y = 156;
  pr.push(Lp(X(tsv), y, X(gwv), y, {a:1, a0:1, c:"g3", ls:"dash"}));
  pr.push(Tp((X(tsv) + X(gwv)) / 2, y - 7, "látszólagos késés: gw_ts − ts = " + c1(lat - off) + " s", {an:"middle", c:"g3"}));
  y = 204;
  pr.push(Lp(X(ev), y, X(gwv), y, {lw:1.8, a:1, a0:1}));
  pr.push(Tp((X(ev) + X(gwv)) / 2, y - 7, "valódi átviteli késés: gw_ts − valós = " + c1(lat) + " s", {an:"middle", b:1}));
  const yu = 318;
  pr.push(Tp(X0, yu - 26, "Az eszköz uptime-tengelye (monoton számláló, ms):", {b:1}));
  pr.push(Lp(X0, yu, X1, yu, {lw:1.2, c:"g3"}));
  const upgw = UP + Math.round(lat * 1000);
  pr.push(Lp(X(ev), yu - 8, X(ev), yu + 8, {lw:2.0}));
  pr.push(Tp(X(ev) + 5, yu + 24, "up = " + grp(UP) + " ms (esemény, a node elküldi)"));
  pr.push(Lp(X(gwv), yu - 8, X(gwv), yu + 8, {lw:2.0, ls:"dot"}));
  pr.push(Tp(X(gwv) - 5, yu - 10, "≈ " + grp(upgw) + " ms a gw_ts pillanatában", {an:"end", c:"g3"}));
  pr.push(Lp(X0 + 2, yu + 46, X0 + 40, yu + 46, {lw:1.2, a0:1, c:"g3"}));
  pr.push(Tp(X0 + 46, yu + 51, "boot (up = 0): " + hms(ev - UP / 1000).slice(0, 8) + " UTC, a tengelyen kívül", {c:"g3"}));
  pr.push(Lp(X0 + 2, yu + 72, X0 + 40, yu + 72, {lw:1.2, a0:1, c:"g3"}));
  let txt;
  if (Math.abs(off) > 1e-9){
    const sync = Math.abs(off) / (PPM * 1e-6);
    txt = "utolsó szinkron legalább " + c1(Math.abs(off)) + " s ÷ " + PPM + " ppm = " + grp(Math.round(sync)) + " s (≈ " + c1(sync / 3600) + " h) óta";
  } else txt = "nincs óraeltérés: az eszközóra szinkronban";
  pr.push(Tp(X0 + 46, yu + 77, txt, {c:"g3"}));
  const yl = yu + 112;
  const items = [["", "fg", "valós esemény"], ["dash", "hl", "ts (eszköz)"], ["dot", "fg", "gw_ts (gateway)"], ["dashdot", "hl2", "server_ts (backend)"]];
  let x = X0;
  for (const [ls, col, lab] of items){
    pr.push(Lp(x, yl - 5, x + 34, yl - 5, {lw:2.0, ls:ls, c:col}));
    pr.push(Tp(x + 40, yl, lab));
    x += 40 + lab.length * 9 + 26;
  }
  pr.push(Tp(X0, yl + 26, "Illusztratív, számított értékek (a 11.3.4 példa); modell, nem mérés. server_ts − gw_ts = 0,15 s.", {c:"g3"}));
  return [pr, yl + 36];
}

const offI = document.getElementById("off"), latI = document.getElementById("lat"), st = document.getElementById("status");
function draw(){
  const off = +offI.value, lat = +latI.value;
  document.getElementById("offv").textContent = (off > 0 ? "+" : "") + c1(off) + " s";
  document.getElementById("latv").textContent = c1(lat) + " s";
  const r = sceneJS(off, lat);
  svg.setAttribute("viewBox", "0 0 880 " + Math.ceil(r[1]));
  svg.innerHTML = ""; scDefs(); scDraw(r[0]);
  st.textContent = "ts = " + hms(off) + ", gw_ts = " + hms(lat) + ", gw_ts − ts = " + c1(lat - off) +
    " s (valódi késés " + c1(lat) + " s, óraeltérés " + (off > 0 ? "+" : "") + c1(off) + " s). A gw_ts − ts-ből egyedül nem választható szét, mennyi a késés és mennyi az óraeltérés.";
}
offI.oninput = draw; latI.oninput = draw;
document.getElementById("reset").onclick = () => { offI.value = 0.8; latI.value = 12.3; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
