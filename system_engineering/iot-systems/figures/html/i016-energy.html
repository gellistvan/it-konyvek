<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duty-cycle kalkulátor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--cell2:#a6a6a6;--line:#000;--code:#f3f3f3;--ok:#1e6b2e;--err:#c00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--cell2:#777;--line:#ddd;--code:#2a2a2a;--ok:#7fd08f;--err:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6em}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:500}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 14px"><label style="display:flex;gap:6px;align-items:center">periódus [perc] <input type="range" id="T" min="1" max="60" step="1" value="10" aria-label="periódus [perc]"> <span id="Tv" style="min-width:3.5em">10</span></label><label style="display:flex;gap:6px;align-items:center">alvási áram [µA] <input type="range" id="sleep" min="1" max="200" step="1" value="150" aria-label="alvási áram [µA]"> <span id="sleepv" style="min-width:3.5em">150</span></label><label style="display:flex;gap:6px;align-items:center">mérés / ciklus <input type="range" id="n_meas" min="1" max="360" step="1" value="30" aria-label="mérés / ciklus"> <span id="n_measv" style="min-width:3.5em">30</span></label><label style="display:flex;gap:6px;align-items:center">mérési áram [mA] <input type="range" id="i_meas" min="0.5" max="30" step="0.5" value="8" aria-label="mérési áram [mA]"> <span id="i_measv" style="min-width:3.5em">8</span></label><label style="display:flex;gap:6px;align-items:center">mérési idő [ms] <input type="range" id="t_meas" min="10" max="2000" step="10" value="20" aria-label="mérési idő [ms]"> <span id="t_measv" style="min-width:3.5em">20</span></label><label style="display:flex;gap:6px;align-items:center">TX áram [mA] <input type="range" id="i_tx" min="1" max="200" step="1" value="50" aria-label="TX áram [mA]"> <span id="i_txv" style="min-width:3.5em">50</span></label><label style="display:flex;gap:6px;align-items:center">TX idő [ms] <input type="range" id="t_tx" min="10" max="5000" step="10" value="700" aria-label="TX idő [ms]"> <span id="t_txv" style="min-width:3.5em">700</span></label><label style="display:flex;gap:6px;align-items:center">RX áram [mA] <input type="range" id="i_rx" min="1" max="100" step="1" value="25" aria-label="RX áram [mA]"> <span id="i_rxv" style="min-width:3.5em">25</span></label><label style="display:flex;gap:6px;align-items:center">RX idő [ms] <input type="range" id="t_rx" min="10" max="5000" step="10" value="300" aria-label="RX idő [ms]"> <span id="t_rxv" style="min-width:3.5em">300</span></label><label style="display:flex;gap:6px;align-items:center">hasznos kapacitás [mAh] <input type="range" id="cap" min="200" max="5000" step="50" value="2400" aria-label="hasznos kapacitás [mAh]"> <span id="capv" style="min-width:3.5em">2400</span></label><label style="display:flex;gap:6px;align-items:center">szelep [mA·s/nap] <input type="range" id="valve" min="0" max="200" step="0.5" value="62.5" aria-label="szelep [mA·s/nap]"> <span id="valvev" style="min-width:3.5em">62.5</span></label></div><div class="ctl"><button id="b5">5 perces példa</button><button id="b10">10 perces példa</button><button id="b60">1 mérés / 10 perc (egyszerűsítés)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 760 390" role="img" aria-label="Az 5 perces ciklusban az alvás 44,76, a TX 35,00 mA·s töltést ad; 10 perces periódusnál a számított élettartam 14,1 hónap."></svg>
  <pre id="code" aria-label="Kód"></pre>
</div>
<p class="small">Számított, illusztratív adatlapi nagyságrendek; nem mérés. A képletek a 7.1.2 kidolgozott példájáé (L = C_eff / (I_avg · 720), 30 napos hónap). Az aktív szakasz a profilban kinagyítva, az alvás összenyomva látszik (törött időtengely); az alvási sáv magassága nem léptékhelyes, ha az áram kicsi.</p>
<script>
const DATA = {"sliders": [["T", "periódus [perc]", 1, 60, 1, 10], ["sleep", "alvási áram [µA]", 1, 200, 1, 150], ["n_meas", "mérés / ciklus", 1, 360, 1, 30], ["i_meas", "mérési áram [mA]", 0.5, 30, 0.5, 8], ["t_meas", "mérési idő [ms]", 10, 2000, 10, 20], ["i_tx", "TX áram [mA]", 1, 200, 1, 50], ["t_tx", "TX idő [ms]", 10, 5000, 10, 700], ["i_rx", "RX áram [mA]", 1, 100, 1, 25], ["t_rx", "RX idő [ms]", 10, 5000, 10, 300], ["cap", "hasznos kapacitás [mAh]", 200, 5000, 50, 2400], ["valve", "szelep [mA·s/nap]", 0, 200, 0.5, 62.5]], "check": {"5": [0.3076, 10.8], "10": [0.237, 14.1], "60": [0.2258, 12.3]}};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return x.toFixed(d).replace(".",",").replace("-","−");}
const codeEl = document.getElementById("code");
function setCode(lines){ if(!lines.length){codeEl.style.display="none";return;} codeEl.style.display=""; codeEl.innerHTML = lines.map((l,i)=>`<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join(""); }
function hlCode(idx){ codeEl.querySelectorAll("span").forEach(x=>x.classList.remove("on")); (Array.isArray(idx)?idx:[idx]).forEach(i=>{ if(i!==undefined&&i>=0){const L=document.getElementById("L"+i); if(L)L.classList.add("on");}}); }
function setStatus(t){ document.getElementById("status").textContent = t; }
function defs(){ const d = el("defs",{});
  const m = el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--line")},undefined,m);
  const m2 = el("marker",{id:"ahh",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--hl2")},undefined,m2);
  const p = el("pattern",{id:"hatch",patternUnits:"userSpaceOnUse",width:"6",height:"6",patternTransform:"rotate(45)"},undefined,d);
  el("line",{x1:0,y1:0,x2:0,y2:6,stroke:css("--line"),"stroke-width":1.2},undefined,p);
  const q = el("pattern",{id:"dots",patternUnits:"userSpaceOnUse",width:"5",height:"5"},undefined,d);
  el("circle",{cx:2.5,cy:2.5,r:0.9,fill:css("--line")},undefined,q);
  const x = el("pattern",{id:"cross",patternUnits:"userSpaceOnUse",width:"6",height:"6"},undefined,d);
  el("path",{d:"M0,0 L6,6 M6,0 L0,6",stroke:css("--line"),"stroke-width":0.9},undefined,x);
  const h = el("pattern",{id:"horiz",patternUnits:"userSpaceOnUse",width:"6",height:"5"},undefined,d);
  el("line",{x1:0,y1:2.5,x2:6,y2:2.5,stroke:css("--line"),"stroke-width":1},undefined,h);
  return d; }

setCode([]);

const KEYS = DATA.sliders.map(s => s[0]);
function v(id){ return document.getElementById(id); }
function params(){ const p = {}; for (const k of KEYS) p[k] = +v(k).value;
  return {T:p.T*60, sleep:p.sleep/1000, n_meas:p.n_meas, i_meas:p.i_meas, t_meas:p.t_meas/1000, i_tx:p.i_tx, t_tx:p.t_tx/1000,
          i_rx:p.i_rx, t_rx:p.t_rx/1000, cap:p.cap, valve:p.valve}; }
function model(p){ const tact = p.n_meas*p.t_meas + p.t_tx + p.t_rx, ts = p.T - tact;
  const q = {sleep:p.sleep*ts, meas:p.n_meas*p.i_meas*p.t_meas, tx:p.i_tx*p.t_tx, rx:p.i_rx*p.t_rx, valve:p.valve*p.T/86400};
  const Q = q.sleep+q.meas+q.tx+q.rx+q.valve, ia = Q/p.T; return {ts:ts, tact:tact, q:q, Q:Q, iavg:ia, L:p.cap/(ia*720)}; }
const NAME = {sleep:"alvás", meas:"mérés", tx:"rádió TX", rx:"rádió RX", valve:"szelep"};
const PAT = {sleep:"url(#dots)", meas:"url(#hatch)", tx:"url(#cross)", rx:"url(#horiz)", valve:"url(#dots)"};
function draw(){
  const p = params(), m = model(p);
  for (const k of KEYS) v(k+"v").textContent = String(v(k).value).replace(".", ",");
  svg.innerHTML = ""; defs();
  if (m.ts < 0){ setStatus("Az aktív szakaszok hosszabbak, mint a periódus – növeld a periódust."); return; }
  // (1) áramprofil törött tengellyel
  const imax = Math.max(p.i_meas, p.i_tx, p.i_rx, 1) * 1.15, Y0 = 30, Y1 = 190, sy = i => Y1 - i/imax*(Y1-Y0);
  el("text",{x:10,y:16,"font-size":13,"font-weight":"bold"},"(1) Áramprofil – törött időtengely");
  const xs0 = 60, xs1 = 220, xa0 = 240, xa1 = 740;
  el("rect",{x:xs0,y:sy(Math.max(p.sleep, imax*0.012)),width:xs1-xs0,height:Y1-sy(Math.max(p.sleep, imax*0.012)),fill:PAT.sleep,stroke:css("--line")});
  el("text",{x:(xs0+xs1)/2,y:Y1-30,"text-anchor":"middle","font-size":12},`alvás ${fmt(p.sleep*1000,0)} µA · ${fmt(m.ts,1)} s`);
  el("text",{x:(xs0+xs1)/2,y:Y1-14,"text-anchor":"middle","font-size":12},`= ${fmt(m.q.sleep,2)} mA·s`);
  const segs = [["meas", m.tact - p.t_tx - p.t_rx, p.i_meas], ["tx", p.t_tx, p.i_tx], ["rx", p.t_rx, p.i_rx]];
  let x = xa0;
  segs.forEach(([k, d, i]) => { const w = d/m.tact*(xa1-xa0);
    el("rect",{x:x,y:sy(i),width:w,height:Y1-sy(i),fill:PAT[k],stroke:css("--line")});
    el("text",{x:x+w/2,y:sy(i)-18,"text-anchor":"middle","font-size":12},`${NAME[k]} ${fmt(i,1)} mA`);
    el("text",{x:x+w/2,y:sy(i)-4,"text-anchor":"middle","font-size":12},`${fmt(m.q[k],2)} mA·s`); x += w; });
  el("line",{x1:40,y1:Y1,x2:xa1,y2:Y1,stroke:css("--line")});
  el("text",{x:xs0,y:Y1+16,"font-size":11},"0 s"); el("text",{x:xs1,y:Y1+16,"font-size":11,"text-anchor":"end"},fmt(m.ts,1)+" s");
  el("text",{x:xa1,y:Y1+16,"font-size":11,"text-anchor":"end"},fmt(p.T,0)+" s");
  el("text",{x:(xa0+xa1)/2,y:Y1+16,"font-size":11,"text-anchor":"middle"},`aktív szakasz ${fmt(m.tact,2)} s (kinagyítva)`);
  el("path",{d:`M${xs1+4},${Y1+6} l6,-12 M${xs1+12},${Y1+6} l6,-12`,stroke:css("--line")});
  // (2) halmozott oszlop
  const B0 = 230; el("text",{x:10,y:B0,"font-size":13,"font-weight":"bold"},`(2) Töltésmegoszlás (Q = ${fmt(m.Q,2)} mA·s)`);
  let bx = 10; ["sleep","meas","tx","rx","valve"].forEach(k => { const w = m.q[k]/m.Q*350;
    el("rect",{x:bx,y:B0+12,width:w,height:34,fill:PAT[k],stroke:css("--line")});
    el("text",{x:bx+w/2,y:B0+64+(k==="meas"||k==="rx"||k==="valve"?14:0),"text-anchor":"middle","font-size":11},`${NAME[k]} ${fmt(100*m.q[k]/m.Q,1)}%`); bx += w; });
  // (3) élettartam–periódus
  const C0x = 430, C1x = 740, C0y = 240, C1y = 360, Lmax = 24;
  el("text",{x:C0x-30,y:B0,"font-size":13,"font-weight":"bold"},"(3) Élettartam–periódus");
  const cx = mn => C0x + (mn-1)/59*(C1x-C0x), cy = L => C1y - Math.min(L, Lmax)/Lmax*(C1y-C0y);
  let d = ""; for (let mn=1; mn<=60; mn++){ const mm = model(Object.assign({}, p, {T:mn*60, n_meas:mn*6})); if (mm.iavg>0) d += (d?" L":"M")+cx(mn)+","+cy(mm.L); }
  el("path",{d:d,fill:"none",stroke:css("--line"),"stroke-width":2});
  el("line",{x1:C0x,y1:cy(12),x2:C1x,y2:cy(12),stroke:css("--line"),"stroke-dasharray":"6 4"});
  el("text",{x:C1x,y:cy(12)-4,"text-anchor":"end","font-size":11},"követelmény: 12 hónap");
  el("line",{x1:C0x,y1:C1y,x2:C1x,y2:C1y,stroke:css("--line")}); el("line",{x1:C0x,y1:C0y,x2:C0x,y2:C1y,stroke:css("--line")});
  [1,15,30,45,60].forEach(mn => el("text",{x:cx(mn),y:C1y+14,"text-anchor":"middle","font-size":11},mn+" p"));
  [0,12,24].forEach(L => el("text",{x:C0x-4,y:cy(L)+4,"text-anchor":"end","font-size":11},String(L)));
  el("circle",{cx:cx(p.T/60),cy:cy(m.L),r:6,fill:css("--hl2"),stroke:css("--line")});
  setStatus(`I_avg = ${fmt(m.iavg,4)} mA → L = ${fmt(m.L,1)} hónap` + (m.L < 12 ? " (a 12 hónapos követelmény alatt)" : ""));
  setCode([`T = ${fmt(p.T,0)} s;  t_alvás = T − (n·t_mérés + t_TX + t_RX) = ${fmt(p.T,0)} − ${fmt(m.tact,2)} = ${fmt(m.ts,2)} s`,
    `Q = ${fmt(p.sleep,3)}·${fmt(m.ts,2)} + ${p.n_meas}·${fmt(p.i_meas,1)}·${fmt(p.t_meas,2)} + ${fmt(p.i_tx,1)}·${fmt(p.t_tx,2)} + ${fmt(p.i_rx,1)}·${fmt(p.t_rx,2)} + szelep`,
    `  = ${fmt(m.q.sleep,2)} + ${fmt(m.q.meas,2)} + ${fmt(m.q.tx,2)} + ${fmt(m.q.rx,2)} + ${fmt(m.q.valve,2)} = ${fmt(m.Q,2)} mA·s`,
    `I_avg = Q / T = ${fmt(m.Q,2)} / ${fmt(p.T,0)} = ${fmt(m.iavg,4)} mA`,
    `L = C_eff / (I_avg · 24 · 30) = ${fmt(p.cap,0)} / (${fmt(m.iavg,4)} · 720) = ${fmt(m.L,1)} hónap`]);
}
function preset(T, n){ v("T").value = T; v("n_meas").value = n; for (const s of DATA.sliders) if (s[0]!=="T" && s[0]!=="n_meas") v(s[0]).value = s[5]; draw(); }
for (const k of KEYS) v(k).addEventListener("input", draw);
v("b5").onclick = () => preset(5, 30); v("b10").onclick = () => preset(10, 60); v("b60").onclick = () => { preset(10, 1); v("t_meas").value = 400; v("cap").value = 2000; v("valve").value = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
