<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I2C-regiszterolvasás jelalakja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--cell2:#a6a6a6;--line:#000;--code:#f3f3f3;--ok:#1e6b2e;--err:#c00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--cell2:#777;--line:#ddd;--code:#2a2a2a;--ok:#7fd08f;--err:#ff7b7b}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button.on{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:110px}
input[type=number],input[type=text]{font:inherit;width:6em}
label{white-space:nowrap}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:500}
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
<button id="first" title="Első lépés">⏮</button><button id="prev">◀ Lépés</button>
<button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
<input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása"><span id="cnt" class="small"></span></div>
<div class="ctl"><label><input type="checkbox" id="bytemode"> bájtonként léptet</label>
<label>sebesség <input type="range" id="speed" min="100" max="1500" step="100" value="600" aria-label="Lejátszás késleltetése (ms)" style="flex:0;min-width:110px"></label>
<label>7 bites cím 0x<input type="text" id="addr" value="40" maxlength="2" aria-label="7 bites I2C-cím hexadecimálisan"></label>
<label>regiszter 0x<input type="text" id="reg" value="E3" maxlength="2" aria-label="Regisztercím hexadecimálisan"></label>
<button id="apply">Újraszámol</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 900 350" role="img" aria-label="SCL és SDA jelalak: START, 0x80 ACK, 0xE3 ACK, ismételt START, 0x81 ACK, 0x67 mester-ACK, 0x2A mester-NACK, STOP"></svg>
  <pre id="code" aria-label="Kód"></pre>
</div>
<p class="small">Sematikus, nem mérés; az időarányok nem léptékhelyesek. Folytonos SDA: a mester hajtja; szaggatott, „S”: a szolga. A = ACK (0), N = NACK (1). Saját cím (pl. 0x48) esetén az első bájt 0x90, az olvasási bájt 0x91 lesz.</p>
<script>
const DATA = {"slots": [{"kind": "idle", "val": 1, "drv": "P", "msg": "Tétlen busz: SCL és SDA magas (felhúzó ellenállás).", "byte": -1}, {"kind": "start", "val": 0, "drv": "M", "msg": "START: a mester lehúzza az SDA-t, miközben SCL magas.", "byte": -1}, {"kind": "bit", "val": 1, "drv": "M", "byte": 1, "bit": 1, "hexb": "0x80", "msg": "1. bájt (0x80), 1. bit: címbit 1/7 (cím 0x40) = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 2, "hexb": "0x80", "msg": "1. bájt (0x80), 2. bit: címbit 2/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 3, "hexb": "0x80", "msg": "1. bájt (0x80), 3. bit: címbit 3/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 4, "hexb": "0x80", "msg": "1. bájt (0x80), 4. bit: címbit 4/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 5, "hexb": "0x80", "msg": "1. bájt (0x80), 5. bit: címbit 5/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 6, "hexb": "0x80", "msg": "1. bájt (0x80), 6. bit: címbit 6/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 7, "hexb": "0x80", "msg": "1. bájt (0x80), 7. bit: címbit 7/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 1, "bit": 8, "hexb": "0x80", "msg": "1. bájt (0x80), 8. bit: R/W = 0 (írás) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 1, "bit": 9, "ack": "ACK", "hexb": "0x80", "msg": "1. bájt, 9. órajel: ACK – a szolga lehúzza az SDA-t (0)."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 2, "bit": 1, "hexb": "0xE3", "msg": "2. bájt (0xE3), 1. bit: regisztercím-bit = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 2, "bit": 2, "hexb": "0xE3", "msg": "2. bájt (0xE3), 2. bit: regisztercím-bit = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 2, "bit": 3, "hexb": "0xE3", "msg": "2. bájt (0xE3), 3. bit: regisztercím-bit = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 2, "bit": 4, "hexb": "0xE3", "msg": "2. bájt (0xE3), 4. bit: regisztercím-bit = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 2, "bit": 5, "hexb": "0xE3", "msg": "2. bájt (0xE3), 5. bit: regisztercím-bit = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 2, "bit": 6, "hexb": "0xE3", "msg": "2. bájt (0xE3), 6. bit: regisztercím-bit = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 2, "bit": 7, "hexb": "0xE3", "msg": "2. bájt (0xE3), 7. bit: regisztercím-bit = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 2, "bit": 8, "hexb": "0xE3", "msg": "2. bájt (0xE3), 8. bit: regisztercím-bit = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 2, "bit": 9, "ack": "ACK", "hexb": "0xE3", "msg": "2. bájt, 9. órajel: ACK – a szolga lehúzza az SDA-t (0)."}, {"kind": "sr", "val": 0, "drv": "M", "byte": -1, "msg": "Ismételt START (Sr): SDA magas→alacsony él, miközben SCL magas; a busz nem szabadul fel."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 3, "bit": 1, "hexb": "0x81", "msg": "3. bájt (0x81), 1. bit: címbit 1/7 (cím 0x40) = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 2, "hexb": "0x81", "msg": "3. bájt (0x81), 2. bit: címbit 2/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 3, "hexb": "0x81", "msg": "3. bájt (0x81), 3. bit: címbit 3/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 4, "hexb": "0x81", "msg": "3. bájt (0x81), 4. bit: címbit 4/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 5, "hexb": "0x81", "msg": "3. bájt (0x81), 5. bit: címbit 5/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 6, "hexb": "0x81", "msg": "3. bájt (0x81), 6. bit: címbit 6/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 3, "bit": 7, "hexb": "0x81", "msg": "3. bájt (0x81), 7. bit: címbit 7/7 (cím 0x40) = 0; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 3, "bit": 8, "hexb": "0x81", "msg": "3. bájt (0x81), 8. bit: R/W = 1 (olvasás) = 1; a mester hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 3, "bit": 9, "ack": "ACK", "hexb": "0x81", "msg": "3. bájt, 9. órajel: ACK – a szolga lehúzza az SDA-t (0)."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 4, "bit": 1, "hexb": "0x67", "msg": "4. bájt (0x67), 1. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 4, "bit": 2, "hexb": "0x67", "msg": "4. bájt (0x67), 2. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 4, "bit": 3, "hexb": "0x67", "msg": "4. bájt (0x67), 3. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 4, "bit": 4, "hexb": "0x67", "msg": "4. bájt (0x67), 4. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 4, "bit": 5, "hexb": "0x67", "msg": "4. bájt (0x67), 5. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 4, "bit": 6, "hexb": "0x67", "msg": "4. bájt (0x67), 6. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 4, "bit": 7, "hexb": "0x67", "msg": "4. bájt (0x67), 7. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 4, "bit": 8, "hexb": "0x67", "msg": "4. bájt (0x67), 8. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "M", "byte": 4, "bit": 9, "ack": "ACK", "hexb": "0x67", "msg": "4. bájt, 9. órajel: ACK – a mester lehúzza az SDA-t: kér még bájtot."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 5, "bit": 1, "hexb": "0x2A", "msg": "5. bájt (0x2A), 1. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 5, "bit": 2, "hexb": "0x2A", "msg": "5. bájt (0x2A), 2. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 5, "bit": 3, "hexb": "0x2A", "msg": "5. bájt (0x2A), 3. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 5, "bit": 4, "hexb": "0x2A", "msg": "5. bájt (0x2A), 4. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 5, "bit": 5, "hexb": "0x2A", "msg": "5. bájt (0x2A), 5. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 5, "bit": 6, "hexb": "0x2A", "msg": "5. bájt (0x2A), 6. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "S", "byte": 5, "bit": 7, "hexb": "0x2A", "msg": "5. bájt (0x2A), 7. bit: adatbit = 1; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 0, "drv": "S", "byte": 5, "bit": 8, "hexb": "0x2A", "msg": "5. bájt (0x2A), 8. bit: adatbit = 0; a szolga hajtja az SDA-t."}, {"kind": "bit", "val": 1, "drv": "M", "byte": 5, "bit": 9, "ack": "NACK", "hexb": "0x2A", "msg": "5. bájt, 9. órajel: NACK – a mester elengedi az SDA-t (1): nem kér több bájtot."}, {"kind": "stop", "val": 1, "drv": "M", "byte": -1, "msg": "STOP: SDA alacsony→magas él, miközben SCL magas; a busz felszabadul."}]};

const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text, parent){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(x,d){return x.toFixed(d).replace(".",",").replace("-","−");}
const codeEl = document.getElementById("code");
function setCode(lines){ if(!lines.length){codeEl.style.display="none";return;} codeEl.style.display=""; codeEl.innerHTML = lines.map((l,i)=>`<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join(""); }
function hlCode(idx){ codeEl.querySelectorAll("span").forEach(x=>x.classList.remove("on")); (Array.isArray(idx)?idx:[idx]).forEach(i=>{ if(i!==undefined&&i>=0){const L=document.getElementById("L"+i); if(L)L.classList.add("on");}}); }
function setStatus(t){ document.getElementById("status").textContent = t; }
function defs(){ const d = el("defs",{});
  const m = el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--line")},undefined,m);
  const m2 = el("marker",{id:"ahh",viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"11",markerHeight:"11",markerUnits:"userSpaceOnUse",orient:"auto-start-reverse"},undefined,d);
  el("path",{d:"M0,0 L10,5 L0,10 z",fill:css("--hl2")},undefined,m2);
  const p = el("pattern",{id:"hatch",patternUnits:"userSpaceOnUse",width:"6",height:"6",patternTransform:"rotate(45)"},undefined,d);
  el("line",{x1:0,y1:0,x2:0,y2:6,stroke:css("--line"),"stroke-width":1.2},undefined,p);
  const q = el("pattern",{id:"dots",patternUnits:"userSpaceOnUse",width:"5",height:"5"},undefined,d);
  el("circle",{cx:2.5,cy:2.5,r:0.9,fill:css("--line")},undefined,q);
  const x = el("pattern",{id:"cross",patternUnits:"userSpaceOnUse",width:"6",height:"6"},undefined,d);
  el("path",{d:"M0,0 L6,6 M6,0 L0,6",stroke:css("--line"),"stroke-width":0.9},undefined,x);
  const h = el("pattern",{id:"horiz",patternUnits:"userSpaceOnUse",width:"6",height:"5"},undefined,d);
  el("line",{x1:0,y1:2.5,x2:6,y2:2.5,stroke:css("--line"),"stroke-width":1},undefined,h);
  return d; }

setCode([]);

let SL = DATA.slots, k = 0, timer = null;
function rebuild(addr, reg){
  const fr = [[addr<<1,"addr_w"],[reg,"reg"],["Sr","sr"],[(addr<<1)|1,"addr_r"],[0x67,"data"],[0x2A,"data_last"]];
  const out = [SL[0], SL[1]]; let bi = 0;
  for (const [b, role] of fr){
    if (b === "Sr"){ out.push({kind:"sr",val:0,drv:"M",byte:-1,msg:"Ismételt START (Sr): SDA magas→alacsony él, miközben SCL magas; a busz nem szabadul fel."}); continue; }
    bi++; const mw = role==="addr_w"||role==="reg"||role==="addr_r"; const hx = "0x"+b.toString(16).toUpperCase().padStart(2,"0");
    for (let i=0;i<8;i++){ const v=(b>>(7-i))&1; let what;
      if (role.startsWith("addr") && i<7) what = `címbit ${i+1}/7 (cím 0x${(b>>1).toString(16).toUpperCase().padStart(2,"0")})`;
      else if (role.startsWith("addr")) what = `R/W = ${v} (${v?"olvasás":"írás"})`;
      else if (role==="reg") what = "regisztercím-bit"; else what = "adatbit";
      out.push({kind:"bit",val:v,drv:mw?"M":"S",byte:bi,bit:i+1,hexb:hx,msg:`${bi}. bájt (${hx}), ${i+1}. bit: ${what} = ${v}; ${mw?"a mester":"a szolga"} hajtja az SDA-t.`}); }
    if (mw) out.push({kind:"bit",val:0,drv:"S",byte:bi,bit:9,ack:"ACK",hexb:hx,msg:`${bi}. bájt, 9. órajel: ACK – a szolga lehúzza az SDA-t (0).`});
    else if (role==="data") out.push({kind:"bit",val:0,drv:"M",byte:bi,bit:9,ack:"ACK",hexb:hx,msg:`${bi}. bájt, 9. órajel: ACK – a mester lehúzza az SDA-t: kér még bájtot.`});
    else out.push({kind:"bit",val:1,drv:"M",byte:bi,bit:9,ack:"NACK",hexb:hx,msg:`${bi}. bájt, 9. órajel: NACK – a mester elengedi az SDA-t (1): nem kér több bájtot.`});
  }
  out.push(SL[SL.length-1]); return out;
}
function wave(s){
  if (s.kind==="idle") return [[[0,1]],[[0,1]]];
  if (s.kind==="start") return [[[0,1]],[[0,1],[0.45,0]]];
  if (s.kind==="bit") return [[[0,0],[0.5,1]],[[0.12,s.val]]];
  if (s.kind==="sr") return [[[0,0],[0.35,1]],[[0.12,1],[0.68,0]]];
  return [[[0,0],[0.35,1]],[[0.12,0],[0.68,1]]];
}
const W = 30, X0 = 46, ROWS = [[0,21],[21,49]], RH = 175;
function draw(){
  svg.innerHTML = ""; defs();
  ROWS.forEach(([a,b], r) => {
    const oy = r*RH, ySCL = oy+70, ySDA = oy+130, H = 26;
    el("text",{x:4,y:ySCL-H/2+5,"font-size":13,"font-weight":"bold"},"SCL");
    el("text",{x:4,y:ySDA-H/2+5,"font-size":13,"font-weight":"bold"},"SDA");
    let scl = 1, sda = r ? 0 : 1;
    for (let j=a;j<b && j<SL.length;j++){
      const s = SL[j], x0 = X0+(j-a)*W;
      if (j===k) el("rect",{x:x0,y:oy+28,width:W,height:140,fill:css("--cellhl"),opacity:0.7});
      const [sc, sd] = wave(s);
      let p = `M${x0},${ySCL-H*scl}`; for (const [t,v] of sc){ p += ` L${x0+t*W},${ySCL-H*scl} L${x0+t*W},${ySCL-H*v}`; scl=v; } p += ` L${x0+W},${ySCL-H*scl}`;
      el("path",{d:p,fill:"none",stroke:css("--line"),"stroke-width":1.8});
      p = `M${x0},${ySDA-H*sda}`; for (const [t,v] of sd){ p += ` L${x0+t*W},${ySDA-H*sda} L${x0+t*W},${ySDA-H*v}`; sda=v; } p += ` L${x0+W},${ySDA-H*sda}`;
      el("path",{d:p,fill:"none",stroke:s.drv==="S"?css("--hl2"):css("--line"),"stroke-width":2,"stroke-dasharray":s.drv==="S"?"5 3":"none"});
      if (s.kind==="bit"){
        el("text",{x:x0+W/2,y:ySDA+20,"text-anchor":"middle","font-size":12,"font-weight":s.bit===9?"bold":"normal"}, s.bit<9?String(s.val):(s.ack==="ACK"?"A":"N"));
        if (s.drv==="S") el("text",{x:x0+W/2,y:ySDA-H-4,"text-anchor":"middle","font-size":10,fill:css("--hl2")},"S");
        if (s.bit===1){
          const role = {1:"cím + W",2:"regiszter",3:"cím + R",4:"adat (felső)",5:"adat (alsó)"}[s.byte];
          el("line",{x1:x0+2,y1:oy+22,x2:x0+9*W-2,y2:oy+22,stroke:css("--muted")});
          el("text",{x:x0+4.5*W,y:oy+16,"text-anchor":"middle","font-size":13},`${s.hexb} – ${role}`);
        }
      } else if (s.kind!=="idle"){
        const xm = x0 + (s.kind==="start"?0.45:0.68)*W;
        el("line",{x1:xm,y1:ySCL-H-12,x2:xm,y2:ySDA+6,stroke:css("--line"),"stroke-dasharray":"6 2 2 2"});
        el("text",{x:xm,y:oy+16,"text-anchor":"middle","font-size":12,"font-weight":"bold"},{start:"START",sr:"Sr",stop:"STOP"}[s.kind]);
      }
    }
  });
}
const pos = document.getElementById("pos");
function show(i){ k = Math.max(0, Math.min(SL.length-1, i)); pos.max = SL.length-1; pos.value = k;
  document.getElementById("cnt").textContent = `${k+1}/${SL.length}`; setStatus(SL[k].msg); draw(); }
function stepTo(d){ const bm = document.getElementById("bytemode").checked; if (!bm){ show(k+d); return; }
  let j = k + d; while (j>0 && j<SL.length-1 && SL[j].kind==="bit" && SL[j].bit!==(d>0?9:1)) j += d; show(j); }
function stop(){ if (timer){ clearInterval(timer); timer=null; } document.getElementById("play").textContent="▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); stepTo(-1); };
document.getElementById("next").onclick = () => { stop(); stepTo(1); };
document.getElementById("play").onclick = () => { if (timer){ stop(); return; } if (k>=SL.length-1) show(0);
  document.getElementById("play").textContent="⏸ Szünet";
  timer = setInterval(() => { if (k>=SL.length-1) stop(); else stepTo(1); }, +document.getElementById("speed").value); };
pos.oninput = () => { stop(); show(+pos.value); };
document.getElementById("apply").onclick = () => {
  const a = parseInt(document.getElementById("addr").value,16), r = parseInt(document.getElementById("reg").value,16);
  if (!(a>=0 && a<=0x7F) || !(r>=0 && r<=0xFF)){ setStatus("Hibás bemenet: a cím 00–7F, a regiszter 00–FF hexadecimális érték."); return; }
  stop(); SL = rebuild(a, r); show(0);
  const h = x => "0x"+x.toString(16).toUpperCase().padStart(2,"0");
  setStatus(`Cím ${h(a)} → írási bájt ${h(a<<1)}, olvasási bájt ${h((a<<1)|1)}; regiszter ${h(r)}. ` + SL[0].msg);
};
document.addEventListener("keydown", e => { if (e.target.tagName==="INPUT" && e.target.type==="text") return;
  if (e.key==="ArrowRight"){ stop(); stepTo(1);} if (e.key==="ArrowLeft"){ stop(); stepTo(-1);} });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);

</script>
