<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A SeqTracker reorder-ablaka</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Forgatókönyv:</span><label><input type="radio" name="sc" value="A" checked onchange="recompute()"> A (1, 3, 2)</label><label><input type="radio" name="sc" value="B" onchange="recompute()"> B (1, 3, 4 + késő 2)</label><label><input type="radio" name="sc" value="own" onchange="recompute()"> saját:</label><input id="own" size="34" value="1@0, 3@1, 2@2, sweep@31" aria-label="Saját sorozat: seq@idő vagy sweep@idő, vesszővel"><button onclick="document.querySelector('input[name=sc][value=own]').checked=true;recompute()">Számol</button><label for="win">ablak:</label><input id="win" type="range" min="5" max="60" step="1" value="30" oninput="recompute()" style="max-width:160px" aria-label="Reorder-ablak másodpercben"><span id="winv" class="small">30 s</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 1,3,2 sorrendben a hézag helyreáll és nincs veszteség; az 1,3,4 sorrendben 30 s után a 2-es végleges veszteség, későbbi érkezése LATE."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A könyv SeqTracker.java kódjának determinisztikus lejátszása (JS- és Python-átirat), nem mérés. Saját bemenet: pl. „1@0, 4@1, 2@3, sweep@35, 3@50”; a „sweep@t” a sweep() hívása t másodperckor.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: üres tracker. Állapot: finalizedThrough=-1, seen={}, gaps={}, missing=0, late=0", "line": -1, "ev": "init", "t": null, "seq": null, "res": "", "ft": -1, "seen": [], "gaps": {}, "delivered": [], "lost": [], "late": [], "cnt": {"acc": 0, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 0 s: onMessage(1) → ACCEPTED. Állapot: finalizedThrough=1, seen={}, gaps={}, missing=0, late=0", "line": 30, "ev": "m", "t": 0, "seq": 1, "res": "ACCEPTED", "ft": 1, "seen": [], "gaps": {}, "delivered": [1], "lost": [], "late": [], "cnt": {"acc": 1, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 1 s: onMessage(3) → ACCEPTED. Állapot: finalizedThrough=1, seen={3}, gaps={2@1 s}, missing=0, late=0", "line": 30, "ev": "m", "t": 1, "seq": 3, "res": "ACCEPTED", "ft": 1, "seen": [3], "gaps": {"2": 1}, "delivered": [1, 3], "lost": [], "late": [], "cnt": {"acc": 2, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 2 s: onMessage(2) → ACCEPTED. Állapot: finalizedThrough=3, seen={}, gaps={}, missing=0, late=0", "line": 30, "ev": "m", "t": 2, "seq": 2, "res": "ACCEPTED", "ft": 3, "seen": [], "gaps": {}, "delivered": [1, 2, 3], "lost": [], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 31 s: sweep() → 0 végleges veszteség. Állapot: finalizedThrough=3, seen={}, gaps={}, missing=0, late=0", "line": 45, "ev": "s", "t": 31, "seq": null, "res": "lost=0", "ft": 3, "seen": [], "gaps": {}, "delivered": [1, 2, 3], "lost": [], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 0}}];
const CODE = ["public final class SeqTracker {", "", "    public enum Event { ACCEPTED, DUPLICATE, LATE }", "", "    private final long reorderWindowMs;", "    private final TreeSet<Long> seen = new TreeSet<>();", "    private final Map<Long, Long> gapFirstSeenMs = new HashMap<>();", "    private long finalizedThrough = -1;", "    private long highestSeen = -1;", "    private boolean initialized;", "", "    public Event onMessage(long seq, long nowMs) {", "        if (!initialized) {", "            initialized = true;", "            finalizedThrough = seq - 1;", "        }", "        if (seq <= finalizedThrough) {", "            return Event.LATE;", "        }", "        if (!seen.add(seq)) {", "            return Event.DUPLICATE;", "        }", "        highestSeen = Math.max(highestSeen, seq);", "        for (long missing = finalizedThrough + 1; missing < highestSeen; missing++) {", "            if (!seen.contains(missing)) {", "                gapFirstSeenMs.putIfAbsent(missing, nowMs);", "            }", "        }", "        gapFirstSeenMs.remove(seq);", "        drainConsecutive();", "        return Event.ACCEPTED;", "    }", "", "    public long sweep(long nowMs) {", "        long lost = 0;", "        while (true) {", "            Long firstGap = null;", "            for (Long gap : gapFirstSeenMs.keySet()) {", "                if (gap > finalizedThrough", "                        && (firstGap == null || gap < firstGap)) {", "                    firstGap = gap;", "                }", "            }", "            if (firstGap == null", "                    || nowMs - gapFirstSeenMs.get(firstGap) < reorderWindowMs) {", "                return lost;", "            }", "            lost++;", "            finalizedThrough = firstGap;", "            gapFirstSeenMs.remove(firstGap);", "            drainConsecutive();", "        }", "    }", "", "    private void drainConsecutive() {", "        while (seen.remove(finalizedThrough + 1)) {", "            finalizedThrough++;", "        }", "        gapFirstSeenMs.keySet().removeIf(gap -> gap <= finalizedThrough);", "    }", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SIM = {"A": [{"msg": "Kezdőállapot: üres tracker. Állapot: finalizedThrough=-1, seen={}, gaps={}, missing=0, late=0", "line": -1, "ev": "init", "t": null, "seq": null, "res": "", "ft": -1, "seen": [], "gaps": {}, "delivered": [], "lost": [], "late": [], "cnt": {"acc": 0, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 0 s: onMessage(1) → ACCEPTED. Állapot: finalizedThrough=1, seen={}, gaps={}, missing=0, late=0", "line": 30, "ev": "m", "t": 0, "seq": 1, "res": "ACCEPTED", "ft": 1, "seen": [], "gaps": {}, "delivered": [1], "lost": [], "late": [], "cnt": {"acc": 1, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 1 s: onMessage(3) → ACCEPTED. Állapot: finalizedThrough=1, seen={3}, gaps={2@1 s}, missing=0, late=0", "line": 30, "ev": "m", "t": 1, "seq": 3, "res": "ACCEPTED", "ft": 1, "seen": [3], "gaps": {"2": 1}, "delivered": [1, 3], "lost": [], "late": [], "cnt": {"acc": 2, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 2 s: onMessage(2) → ACCEPTED. Állapot: finalizedThrough=3, seen={}, gaps={}, missing=0, late=0", "line": 30, "ev": "m", "t": 2, "seq": 2, "res": "ACCEPTED", "ft": 3, "seen": [], "gaps": {}, "delivered": [1, 2, 3], "lost": [], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 31 s: sweep() → 0 végleges veszteség. Állapot: finalizedThrough=3, seen={}, gaps={}, missing=0, late=0", "line": 45, "ev": "s", "t": 31, "seq": null, "res": "lost=0", "ft": 3, "seen": [], "gaps": {}, "delivered": [1, 2, 3], "lost": [], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 0}}], "B": [{"msg": "Kezdőállapot: üres tracker. Állapot: finalizedThrough=-1, seen={}, gaps={}, missing=0, late=0", "line": -1, "ev": "init", "t": null, "seq": null, "res": "", "ft": -1, "seen": [], "gaps": {}, "delivered": [], "lost": [], "late": [], "cnt": {"acc": 0, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 0 s: onMessage(1) → ACCEPTED. Állapot: finalizedThrough=1, seen={}, gaps={}, missing=0, late=0", "line": 30, "ev": "m", "t": 0, "seq": 1, "res": "ACCEPTED", "ft": 1, "seen": [], "gaps": {}, "delivered": [1], "lost": [], "late": [], "cnt": {"acc": 1, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 1 s: onMessage(3) → ACCEPTED. Állapot: finalizedThrough=1, seen={3}, gaps={2@1 s}, missing=0, late=0", "line": 30, "ev": "m", "t": 1, "seq": 3, "res": "ACCEPTED", "ft": 1, "seen": [3], "gaps": {"2": 1}, "delivered": [1, 3], "lost": [], "late": [], "cnt": {"acc": 2, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 2 s: onMessage(4) → ACCEPTED. Állapot: finalizedThrough=1, seen={3, 4}, gaps={2@1 s}, missing=0, late=0", "line": 30, "ev": "m", "t": 2, "seq": 4, "res": "ACCEPTED", "ft": 1, "seen": [3, 4], "gaps": {"2": 1}, "delivered": [1, 3, 4], "lost": [], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 0}}, {"msg": "t = 31 s: sweep() → 1 végleges veszteség (2). Állapot: finalizedThrough=4, seen={}, gaps={}, missing=1, late=0", "line": 47, "ev": "s", "t": 31, "seq": null, "res": "lost=1", "ft": 4, "seen": [], "gaps": {}, "delivered": [1, 3, 4], "lost": [2], "late": [], "cnt": {"acc": 3, "dup": 0, "late": 0, "missing": 1}}, {"msg": "t = 40 s: onMessage(2) → LATE. Állapot: finalizedThrough=4, seen={}, gaps={}, missing=1, late=1", "line": 17, "ev": "m", "t": 40, "seq": 2, "res": "LATE", "ft": 4, "seen": [], "gaps": {}, "delivered": [1, 3, 4], "lost": [2], "late": [2], "cnt": {"acc": 3, "dup": 0, "late": 1, "missing": 1}}]}, SCEN = {"A": [["m", 1, 0], ["m", 3, 1], ["m", 2, 2], ["s", null, 31]], "B": [["m", 1, 0], ["m", 3, 1], ["m", 4, 2], ["s", null, 31], ["m", 2, 40]]}, LINE = {"LATE": 17, "DUPLICATE": 20, "ACCEPTED": 30, "lost": 47, "nolost": 45};
// --- a SeqTracker JS-átirata (ugyanaz, mint a Python-változat) ---
function simulate(events, windowS){
  const w = windowS * 1000, seen = new Set(), gap = new Map();
  let ft = -1, hi = -1, init = false;
  const delivered = new Set(), lost = new Set(), late = new Set(), cnt = {acc: 0, dup: 0, late: 0, missing: 0};
  function drain(){ while (seen.has(ft + 1)) { seen.delete(ft + 1); ft++; } for (const g of [...gap.keys()]) if (g <= ft) gap.delete(g); }
  function onMessage(seq, now){
    if (!init) { init = true; ft = seq - 1; }
    if (seq <= ft) return "LATE";
    if (seen.has(seq)) return "DUPLICATE";
    seen.add(seq); hi = Math.max(hi, seq);
    for (let m = ft + 1; m < hi; m++) if (!seen.has(m) && !gap.has(m)) gap.set(m, now);
    gap.delete(seq); drain(); return "ACCEPTED";
  }
  function sweep(now){
    let n = 0; const ids = [];
    while (true) {
      let first = null;
      for (const g of gap.keys()) if (g > ft && (first === null || g < first)) first = g;
      if (first === null || now - gap.get(first) < w) return [n, ids];
      n++; ids.push(first); ft = first; gap.delete(first); drain();
    }
  }
  const sortN = a => [...a].sort((x, y) => x - y);
  function fmt(t){ return String(t).replace(".", ","); }
  function snap(msg, line, ev, t, seq, res){
    const gs = sortN(gap.keys()), gobj = {};
    gs.forEach(g => gobj[String(g)] = Math.floor(gap.get(g) / 1000));
    return {msg: msg + " Állapot: finalizedThrough=" + ft + ", seen={" + sortN(seen).join(", ") + "}, gaps={" +
      gs.map(g => g + "@" + Math.floor(gap.get(g) / 1000) + " s").join(", ") + "}, missing=" + cnt.missing + ", late=" + cnt.late,
      line: line, ev: ev, t: t, seq: seq, res: res, ft: ft, seen: sortN(seen), gaps: gobj, delivered: sortN(delivered),
      lost: sortN(lost), late: sortN(late), cnt: Object.assign({}, cnt)};
  }
  const steps = [snap("Kezdőállapot: üres tracker.", -1, "init", null, null, "")];
  for (const [kind, seq, t] of events) {
    const now = Math.round(t * 1000);
    if (kind === "m") {
      const res = onMessage(seq, now);
      if (res === "ACCEPTED") { cnt.acc++; delivered.add(seq); } else if (res === "DUPLICATE") cnt.dup++; else { cnt.late++; late.add(seq); }
      steps.push(snap("t = " + fmt(t) + " s: onMessage(" + seq + ") → " + res + ".", LINE[res], "m", t, seq, res));
    } else {
      const [n, ids] = sweep(now); cnt.missing += n; ids.forEach(i => lost.add(i));
      steps.push(snap("t = " + fmt(t) + " s: sweep() → " + n + " végleges veszteség" + (ids.length ? " (" + ids.join(", ") + ")." : "."),
        LINE[n ? "lost" : "nolost"], "s", t, null, "lost=" + n));
    }
  }
  return steps;
}
function parseSeq(txt){
  const ev = [];
  for (const raw of txt.split(/[,;\s]+/)) {
    if (!raw) continue;
    const m = raw.match(/^(sweep|\d{1,3})@(\d+(?:[.,]\d+)?)$/i);
    if (!m) throw new Error("hibás elem: " + raw);
    const t = parseFloat(m[2].replace(",", "."));
    ev.push(m[1].toLowerCase() === "sweep" ? ["s", null, t] : ["m", +m[1], t]);
  }
  for (let i = 1; i < ev.length; i++) if (ev[i][2] < ev[i - 1][2]) throw new Error("az időknek nem csökkenőnek kell lenniük");
  if (ev.length > 40) throw new Error("legfeljebb 40 elem");
  return ev;
}
function recompute(){
  const sc = document.querySelector('input[name=sc]:checked').value, win = +document.getElementById("win").value;
  document.getElementById("winv").textContent = win + " s";
  const inp = document.getElementById("own");
  let ev;
  if (sc === "own") { try { ev = parseSeq(inp.value); } catch (e) { status.textContent = "Hibás bemenet – " + e.message; return; } }
  else { ev = SCEN[sc]; inp.value = ev.map(e => (e[0] === "s" ? "sweep" : e[1]) + "@" + e[2]).join(", "); }
  setSteps(simulate(ev, win));
}
// --- önteszt: a JS-átirat az A/B forgatókönyvre a Python eredményét adja ---
(function(){
  for (const k of ["A", "B"]) {
    const js = JSON.stringify(simulate(SCEN[k], 30)), py = JSON.stringify(SIM[k]);
    if (js !== py) { document.title += " [ÖNTESZT HIBA " + k + "]"; console.error("SeqTracker JS≠Python", k); }
  }
})();
function cellsDraw(x, y, s, n){
  for (let q = 1; q <= n; q++) {
    const cx = x + (q - 1) * 44, key = String(q);
    el("text", {x: cx + 22, y: y - 8, "text-anchor": "middle", "font-size": 14, fill: css("--muted")}, String(q));
    if (s.lost.includes(q)) {
      el("rect", {x: cx, y: y, width: 44, height: 44, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.4});
      el("line", {x1: cx, y1: y, x2: cx + 44, y2: y + 44, stroke: css("--fg"), "stroke-width": 1.6});
      el("line", {x1: cx, y1: y + 44, x2: cx + 44, y2: y, stroke: css("--fg"), "stroke-width": 1.6});
      if (s.late.includes(q)) {
        el("rect", {x: cx + 3, y: y + 3, width: 38, height: 38, fill: "none", stroke: css("--hl2"), "stroke-width": 3});
        el("text", {x: cx + 22, y: y + 62, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, "LATE");
      }
    } else if (key in s.gaps) {
      el("rect", {x: cx, y: y, width: 44, height: 44, fill: "url(#hz)", stroke: css("--fg"), "stroke-width": 1.4});
      el("text", {x: cx + 22, y: y + 29, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "G");
      el("text", {x: cx + 22, y: y + 62, "text-anchor": "middle", "font-size": 13}, s.gaps[key] + " s");
    } else if (s.delivered.includes(q)) {
      el("rect", {x: cx, y: y, width: 44, height: 44, fill: css("--cellhl"), stroke: css("--fg"), "stroke-width": 1.4});
      el("text", {x: cx + 22, y: y + 29, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "S");
    } else {
      el("rect", {x: cx, y: y, width: 44, height: 44, fill: css("--cell"), stroke: css("--muted"), "stroke-width": 1});
    }
  }
  if (s.ft >= 0) { const xl = x + Math.min(s.ft, n) * 44; el("line", {x1: xl, y1: y - 6, x2: xl, y2: y + 50, stroke: css("--hl"), "stroke-width": 5}); }
}
function render(s){
  svg.innerHTML = "";
  const n = Math.max(6, ...STEPS.map(x => Math.max(x.seq || 0, ...x.delivered, ...x.lost, ...Object.keys(x.gaps).map(Number), x.ft)));
  const W = Math.max(560, 40 + n * 44);
  svg.setAttribute("viewBox", "0 0 " + W + " 250");
  const d = document.createElementNS(NS, "defs");
  d.innerHTML = '<pattern id="hz" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,8L8,0" stroke="' + css("--fg") + '" stroke-width="1"/></pattern>';
  svg.appendChild(d);
  const head = s.ev === "init" ? "kezdőállapot" : (s.ev === "m" ? "t = " + String(s.t).replace(".", ",") + " s: onMessage(" + s.seq + ") → " + s.res : "t = " + String(s.t).replace(".", ",") + " s: sweep() → " + s.res);
  el("text", {x: 20, y: 28, "font-size": 18, "font-weight": "bold"}, head);
  cellsDraw(20, 70, s, n);
  el("text", {x: 20, y: 160, "font-size": 15}, "finalizedThrough = " + s.ft + "   (vastag vonal)");
  el("text", {x: 20, y: 184, "font-size": 15}, "gapFirstSeenMs: " + (Object.keys(s.gaps).map(g => g + "@" + s.gaps[g] + " s").join(", ") || "–"));
  el("text", {x: 20, y: 214, "font-size": 15}, "ACCEPTED = " + s.cnt.acc + ", DUPLICATE = " + s.cnt.dup + ", LATE = " + s.cnt.late +
     ";  missing_total = " + s.cnt.missing + ", late_total = " + s.cnt.late);
  el("text", {x: 20, y: 240, "font-size": 13, fill: css("--muted")}, "S = látott, G = előzetes hézag (első észlelés ideje), X = végleges veszteség");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
