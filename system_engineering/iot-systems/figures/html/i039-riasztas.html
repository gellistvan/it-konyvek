<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riasztási állapotgép és hiszterézis</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Aktiválási idő: <input id="act" type="range" min="60" max="600" step="60" value="300" oninput="params()" style="flex:0;min-width:110px"> <span id="actv">300 s</span></label><label>Feloldási idő: <input id="rec" type="range" min="60" max="600" step="60" value="300" oninput="params()" style="flex:0;min-width:110px"> <span id="recv">300 s</span></label><label>magas: <input id="hi" type="number" step="0.5" value="30" style="width:4.5em" onchange="params()"> °C</label><label>alacsony: <input id="lo" type="number" step="0.5" value="28" style="width:4.5em" onchange="params()"> °C</label><span id="warn" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 60 s-os kiugrás csak PENDING; a 240 s-tól tartós 31 °C 540 s-nál ALERTING; a 660 s-tól 27 °C 960 s-nál NORMAL."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A demo_alert() idősora és a ThresholdAlert::update() átirata; számított, a labor programjának kimenete; modell, nem mérés.</p>

const SC_L = {"fg": "#111111", "bg": "#ffffff", "g1": "#e6e6e6", "g2": "#bdbdbd", "g3": "#6e6e6e", "hl": "#1f4e79", "hl2": "#c55a11", "err": "#b00020", "ok": "#1e6b2e", "none": "none"}, SC_D = {"fg": "#eeeeee", "bg": "#1b1b1b", "g1": "#333333", "g2": "#555555", "g3": "#a0a0a0", "hl": "#8fb8e8", "hl2": "#f0a060", "err": "#ff7b7b", "ok": "#7fd08f", "none": "none"};
const SC_DASH = {"": "", dash: "5 3", dot: "1.2 2.2", dashdot: "6 2.5 1.5 2.5"};
function scCol(c){ const m = matchMedia("(prefers-color-scheme: dark)").matches ? SC_D : SC_L; return m[c] || c; }
function scDefs(){
  const d = el("defs", {});
  const pats = {"//": "M0,8 L8,0", "\\\\": "M0,0 L8,8", "..": "", "xx": "M0,8 L8,0 M0,0 L8,8"};
  for (const k in pats){

    const p = document.createElementNS(NS, "pattern");
    p.setAttribute("id", id); p.setAttribute("width", 8); p.setAttribute("height", 8);
    p.setAttribute("patternUnits", "userSpaceOnUse");
    if (k === "..") { const c = document.createElementNS(NS, "circle"); c.setAttribute("cx", 4); c.setAttribute("cy", 4); c.setAttribute("r", 1.1); c.setAttribute("fill", scCol("g3")); p.appendChild(c); }
    else { const pa = document.createElementNS(NS, "path"); pa.setAttribute("d", pats[k]); pa.setAttribute("stroke", scCol("g3")); pa.setAttribute("stroke-width", 1); p.appendChild(pa); }
    d.appendChild(p);
  }
}
function scPat(h){ return ({"//": "url(#scpa)", "\\\\": "url(#scpb)", "..": "url(#scpc)", "xx": "url(#scpd)"})[h]; }
function scHead(x1, y1, x2, y2, c){
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1, ux = dx / n, uy = dy / n;
  const bx = x2 - ux * 10.0, by = y2 - uy * 10.0;
  el("polygon", {points: `${x2},${y2} ${bx - uy * 4.5},${by + ux * 4.5} ${bx + uy * 4.5},${by - ux * 4.5}`, fill: c, stroke: c, "stroke-width": 0.5});
  return [bx, by];
}
function scDraw(list){
  for (const p of list){
    if (p.t === "r"){
      el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, rx: p.rx, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls]});
      if (p.ha) el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, rx: p.rx, fill: scPat(p.ha), stroke: "none"});
    } else if (p.t === "l"){
      const c = scCol(p.c); let x1 = p.x1, y1 = p.y1, x2 = p.x2, y2 = p.y2;
      if (p.a) [x2, y2] = scHead(p.x1, p.y1, p.x2, p.y2, c);
      if (p.a0) [x1, y1] = scHead(p.x2, p.y2, p.x1, p.y1, c);
      el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls]});
    } else if (p.t === "x"){
      p.s.split("\n").forEach((line, i) => {
        const a = {x: p.x, y: p.y + i * p.fs * 1.25, "font-size": p.fs, "text-anchor": p.an};
        if (p.c !== "fg") a.fill = scCol(p.c);
        if (p.b) a["font-weight"] = "bold";
        if (p.it) a["font-style"] = "italic";
        el("text", a, line);
      });
    } else if (p.t === "c"){
      el("circle", {cx: p.cx, cy: p.cy, r: p.r, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw});
    } else if (p.t === "p"){
      const pts = p.pts.map(q => q.join(",")).join(" ");
      el(p.cl ? "polygon" : "polyline", {points: pts, fill: scCol(p.f), stroke: scCol(p.s), "stroke-width": p.lw, "stroke-dasharray": SC_DASH[p.ls], "stroke-linejoin": "round"});
    }
  }
}

1.6,"ls":"dash","a":1,"a0":0},{"t":"x","x":197,"y":126,"s":"T < high","fs":16,"an":"middle","b":0,"c":"fg","it":0},{"t":"l","x1":692,"y1":100,"x2":606,"y2":100,"c":"fg","lw":1.6,"ls":"dash","a":1,"a0":0},{"t":"x","x":649,"y":126,"s":"T > low","fs":16,"an":"middle","b":0,"c":"fg","it":0},{"t":"p","pts":[[762.0,110],[762.0,144],[84.0,144]],"f":"none","s":"fg","lw":1.6,"cl":0,"ls":""},{"t":"l","x1":84,"y1":144,"x2":84,"y2":111,"c":"fg","lw":1.6,"ls":"","a":1,"a0":0},{"t":"x","x":423,"y":138,"s":"tartósan ≥ feloldás (T ≤ low)","fs":16,"an":"middle","b":0,"c":"fg","it":0},{"t":"x","x":10,"y":170,"s":"Szaggatott: visszalépés. Számított, a labor programjának kimenete; modell, nem mérés.","fs":16,"an":"start","b":0,"c":"g3","it":0}],"h":180}, ABBR = {"NORMAL": "N", "PENDING": "P", "ALERTING": "A", "RECOVERING": "R"}, FILLS = {"NORMAL": ["bg", ""], "PENDING": ["bg", ".."], "ALERTING": ["g2", "xx"], "RECOVERING": ["g1", "//"]};
function runJS(high, low, act, rec){
  let st = "NORMAL", cand = 0; const out = [];
  for (const [t, v] of TL){
    let ev = null;
    if (st === "NORMAL"){ if (v >= high){ st = "PENDING"; cand = t; ev = ["NORMAL", "magas küszöb elérve"]; } }
    else if (st === "PENDING"){
      if (v < high){ st = "NORMAL"; ev = ["PENDING", "kiugrás az aktiválás előtt megszűnt"]; }
      else if (t >= cand && t - cand >= act){ st = "ALERTING"; ev = ["PENDING", "magas küszöb tartósan fennáll"]; }
    } else if (st === "ALERTING"){ if (v <= low){ st = "RECOVERING"; cand = t; ev = ["ALERTING", "alacsony küszöb elérve"]; } }
    else if (st === "RECOVERING"){
      if (v > low){ st = "ALERTING"; ev = ["RECOVERING", "az érték a feloldási küszöb fölé emelkedett"]; }
      else if (t >= cand && t - cand >= rec){ st = "NORMAL"; ev = ["RECOVERING", "a feloldás tartósan fennáll"]; }
    }
    out.push({t: t, v: v, st: st, cand: (st === "PENDING" || st === "RECOVERING") ? cand : null, ev: ev ? {frm: ev[0], why: ev[1]} : null});
  }
  return out;
}
function cc(v){ return v.toFixed(1).replace(".", ",").replace("-", "−"); }
function Rp(x,y,w,h,o){ return Object.assign({t:"r",x,y,w,h,f:"bg",s:"fg",lw:1.2,ls:"",ha:"",rx:0}, o||{}); }
function Lq(x1,y1,x2,y2,o){ return Object.assign({t:"l",x1,y1,x2,y2,c:"fg",lw:1.4,ls:"",a:0,a0:0}, o||{}); }
function Tq(x,y,s,o){ return Object.assign({t:"x",x,y,s,fs:16,an:"start",b:0,c:"fg",it:0}, o||{}); }
function Cq(cx,cy,r,o){ return Object.assign({t:"c",cx,cy,r,f:"fg",s:"fg",lw:1.2}, o||{}); }
function sceneJS(steps, high, low, upto, hot){
  const X0 = 70, X1 = 850, TMAX = 1020, X = t => X0 + t * (X1 - X0) / TMAX;
  const n = upto, pr = [];
  const vals = TL.map(q => q[1]);
  const vmin = Math.min(Math.min(...vals), low) - 1, vmax = Math.max(Math.max(...vals), high) + 1;
  const yt = 34, yb = 184, Y = v => yb - (v - vmin) / (vmax - vmin) * (yb - yt);
  pr.push(Tq(10, 20, "Hőmérséklet (°C) és a két küszöb", {b:1}));
  pr.push(Rp(X0, Y(high), X1 - X0, Y(low) - Y(high), {s:"none", ha:"//"}));
  pr.push(Lq(X0, Y(high), X1, Y(high), {lw:1.8}));
  pr.push(Lq(X0, Y(low), X1, Y(low), {lw:1.8, ls:"dash"}));
  pr.push(Tq(X1, Y(high) - 6, "magas küszöb " + cc(high) + " °C", {an:"end"}));
  pr.push(Tq(X1, Y(low) + 20, "alacsony küszöb " + cc(low) + " °C", {an:"end"}));
  pr.push(Lq(X0, yt - 4, X0, yb, {lw:1.2}));
  for (let v = Math.floor(vmin) + 1; v < vmax; v += 2){
    pr.push(Lq(X0 - 5, Y(v), X0, Y(v), {lw:1.0}));
    pr.push(Tq(X0 - 8, Y(v) + 6, String(v), {an:"end", c:"g3"}));
  }
  const pts = steps.slice(0, n + 1).map(s => [X(s.t), Y(s.v)]);
  if (pts.length > 1) pr.push({t:"p", pts: pts, f:"none", s:"hl", lw:1.8, cl:0, ls:""});
  steps.slice(0, n + 1).forEach((s, i) => {
    const on = hot === i;
    if (s.t === 600){
      pr.push(Cq(X(s.t), Y(s.v), 9, {f:"bg", s:"fg", lw:2.0}));
      const lab6 = "600 s: " + ((s.v > low && s.v < high && s.st === "ALERTING") ? "a sávban → ALERTING marad" : s.st);
      const yl6 = Y(Math.min(27.35, low - 0.65));
      pr.push(Lq(X(s.t) - 40, yl6 - 4, X(s.t) - 7, Y(s.v) + 7, {lw:1.2}));
      pr.push(Rp(X(s.t) - 44 - lab6.length * 9.8, yl6 - 14, lab6.length * 9.8, 22, {s:"none"}));
      pr.push(Tq(X(s.t) - 44, yl6 + 2, lab6, {an:"end", b:1}));
    }
    pr.push(Cq(X(s.t), Y(s.v), on ? 6.5 : 4.5, {f: on ? "hl2" : "hl", s: on ? "fg" : "hl"}));
  });
  const ys = 236;
  pr.push(Tq(10, ys - 14, "Állapot", {b:1}));
  const segs = [];
  steps.slice(0, n + 1).forEach(s => { if (!segs.length || segs[segs.length - 1][2] !== s.st) segs.push([s.t, null, s.st]); });
  segs.forEach((sg, j) => { sg[1] = (j + 1 < segs.length) ? segs[j + 1][0] : ((n === steps.length - 1) ? TMAX : steps[n].t + 60); });
  for (const [a, b, st] of segs){
    const [f, h] = FILLS[st];
    pr.push(Rp(X(a), ys, X(b) - X(a), 34, {f:f, ha:h}));
    const lab = (X(b) - X(a) > st.length * 10 + 10) ? st : ABBR[st];
    pr.push(Rp(X((a + b) / 2) - lab.length * 5 - 4, ys + 8, lab.length * 10 + 8, 20, {s:"none"}));
    pr.push(Tq(X((a + b) / 2), ys + 24, lab, {an:"middle", b:1}));
  }
  const ya = ys + 34;
  for (let t = 0; t <= 960; t += 120){
    pr.push(Lq(X(t), ya, X(t), ya + 6, {lw:1.0}));
    pr.push(Tq(X(t), ya + 24, t + " s", {an:"middle", c:"g3"}));
  }
  const yl = ya + 52; let k = 0;
  steps.slice(0, n + 1).forEach((s, i) => {
    if (!s.ev) return;
    const col = 0, row = k;
    pr.push(Lq(X(s.t), yt, X(s.t), ya, {lw:1.0, ls:"dot", c:"g3"}));
    pr.push(Tq(X(s.t) + 3, yt + 2, String(k + 1), {c:"g3"}));
    pr.push(Tq(10 + col * 440, yl + row * 21, (k + 1) + ". " + s.t + " s: " + s.ev.frm + " → " + s.st + " (" + s.ev.why + ")", {b: hot === i ? 1 : 0}));
    k++;
  });

}
function stepsFor(high, low, act, rec){
  const st = runJS(high, low, act, rec);
  return st.map((s, i) => ({msg: "t=" + s.t + " s, T=" + cc(s.v) + " °C, állapot=" + s.st + ", candidate_since=" +
    (s.cand === null ? "–" : s.cand + " s") + (s.ev ? "  |  riasztás " + s.ev.frm + " -> " + s.st + " +" + s.t + "s-nál: " + s.ev.why : ""),
    i: i, all: st, high: high, low: low, line: -1}));
}
function render(s){
  const r = sceneJS(s.all, s.high, s.low, s.i, s.i);
  const h = r[1] + 6;
  svg.setAttribute("viewBox", "0 0 880 " + Math.ceil(h + DIAG.h)); svg.innerHTML = ""; scDefs();
  scDraw(r[0]);
  scDraw(DIAG.sc.map(p => shiftY(p, h)));
}
function shiftY(p, dy){
  const q = Object.assign({}, p);
  if ("y" in q) q.y += dy; if ("y1" in q){ q.y1 += dy; q.y2 += dy; } if ("cy" in q) q.cy += dy;
  if (q.pts) q.pts = q.pts.map(a => [a[0], a[1] + dy]);
  return q;
}
function params(){
  const g = id => +document.getElementById(id).value;
  document.getElementById("actv").textContent = g("act") + " s";
  document.getElementById("recv").textContent = g("rec") + " s";
  let hi = g("hi"), lo = g("lo");
  if (!(lo <= hi)) { document.getElementById("warn").textContent = "Az alacsony küszöb nem lehet nagyobb a magasnál."; return; }
  document.getElementById("warn").textContent = "";
  const keep = k;
  setSteps(stepsFor(hi, lo, g("act"), g("rec")));
  show(Math.min(keep, STEPS.length - 1));
}

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
