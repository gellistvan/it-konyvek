<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luenberger-megfigyelő a kocsis ingán</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#e6e6e6;--frame:#999;

@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#333;--frame:#666;
  --truth:#f2f2f2;--det:#f0a060;--pred:#8fb8e8;--est:#8fd48f;--naive:#999;--gate:#9fd27f;--occ:#555;--band:rgba(143,184,232,.18);--accent:#c9a0f0}}
*{box-sizing:border-box}
body{margin:0;padding:8px 10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl,.params{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:2px 9px;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:120px}
label.param{display:flex;align-items:center;gap:6px}
label.param input{width:120px}
label.param output{min-width:4.2em;font-variant-numeric:tabular-nums}
label.toggle{display:flex;align-items:center;gap:4px}
#status{min-height:2.9em;white-space:pre-line;margin:2px 0 4px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;font-family:system-ui,sans-serif}
.small,.note{font-size:12px;color:var(--muted)}
/* jelrendszer */
.frame{fill:none;stroke:var(--frame);stroke-width:1}
.grid{stroke:var(--grid);stroke-width:.7}
.truth{stroke:var(--truth);stroke-width:1.6;fill:none}
.truth-dot{fill:var(--truth)}
.det{stroke:var(--det);stroke-width:1.8;fill:none}
.det-low{stroke:var(--det);stroke-width:1.4;fill:none;opacity:.45}
.det-clip{stroke:var(--det);stroke-width:1.8;stroke-dasharray:5 3;fill:none}
.clutter{stroke:var(--det);stroke-width:1.2;fill:none;opacity:.5}
.pred-ell{stroke:var(--pred);stroke-width:1.3;stroke-dasharray:5 3;fill:none}
.est{stroke:var(--est);stroke-width:2;fill:none}
.est-dot{fill:var(--est)}
.est-ell{stroke:var(--est);stroke-width:1.5;fill:var(--band)}
.naive{stroke:var(--naive);stroke-width:1.6;stroke-dasharray:1.5 3;fill:none}
.gate{stroke:var(--gate);stroke-width:1.4;stroke-dasharray:1 3;fill:none}
.occluder{fill:url(#hatch);stroke:var(--occ)}
.hatch-line{stroke:var(--occ);stroke-width:2}
.band{fill:var(--band);stroke:none}
.cursor{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.vel{stroke:var(--est);stroke-width:1.4}
.arrowhead{fill:var(--est)}
.accent{stroke:var(--accent);stroke-width:1.6;fill:none}
text{fill:var(--fg);font-size:12px}
.label{font-size:12px}.tick{font-size:10.5px;fill:var(--muted)}.plot-title{font-size:12px;font-weight:600}
.legend-text{font-size:11.5px}
#status.error{color:#c00;font-weight:600}
/* bővítések (2026-11-25): mintapontok, jelölők, letiltott vezérlő */
.sample{stroke:var(--naive);opacity:.45;fill:none}
.sample-est{stroke:var(--est);opacity:.35;fill:none}
.mark{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.mark-est{fill:var(--est);stroke:var(--est)}
.mark-det{fill:none;stroke:var(--det);stroke-width:1.6}
.naive-dot{fill:var(--bg);stroke:var(--naive);stroke-width:1.6}
.ghost{opacity:.35}
/* vonalként rajzolt „ghost” (a későbbi színosztályok felülírják) */
:where(polyline,line,path).ghost{stroke:var(--muted);stroke-width:1.5;fill:none}
label.disabled{opacity:.45}
.mark-det-fill{fill:var(--det);stroke:var(--det);stroke-width:1.2}
/* --- szabályozáselméleti jelrendszer (context.md „Színek és jelek”) --- */
:root{--ref:#6e6e6e;--out:#1f4e79;--u:#c55a11;--dist:#c00000;--meas:#5b8fc7;--limit:#808080;--c4:#7030a0;
  --stable:rgba(84,130,53,.11);--unstable:rgba(192,0,0,.08)}
@media (prefers-color-scheme:dark){:root{--ref:#b0b0b0;--out:#8fb8e8;--u:#f0a060;--dist:#ff7b7b;--meas:#7fa8d8;--limit:#999;--c4:#c9a0f0;
  --stable:rgba(159,210,127,.14);--unstable:rgba(255,123,123,.12)}}

.ref{stroke:var(--ref);stroke-width:1.6;stroke-dasharray:7 4}
.out{stroke:var(--out);stroke-width:2.2}
.u{stroke:var(--u);stroke-width:1.9}
.dist{stroke:var(--dist);stroke-width:1.7;stroke-dasharray:5 3}
.meas{stroke:var(--meas);stroke-width:1;opacity:.8}
.meas-dot{stroke:var(--meas);opacity:.6;fill:none}
circle.meas-dot{fill:var(--meas);stroke:none}
.est{stroke-dasharray:6 4}
.limit{stroke:var(--limit);stroke-width:1.4;stroke-dasharray:1.5 3}
.aux{stroke:var(--muted);stroke-width:1}
/* összehasonlító görbék: szín ÉS vonalstílus */
.c1{stroke:var(--out);stroke-width:2}
.c2{stroke:var(--u);stroke-width:1.9;stroke-dasharray:9 4}
.c3{stroke:var(--est);stroke-width:2;stroke-dasharray:2 3}
.c4{stroke:var(--c4);stroke-width:1.8;stroke-dasharray:9 3 2 3}
.out-dot{fill:var(--out)}.u-dot{fill:var(--u)}.ref-dot{fill:var(--ref)}.dist-dot{fill:var(--dist)}.accent-dot{fill:var(--accent)}
/* pontfelhő (Scene.cloud: vonalvéggel rajzolt path) pont-osztályokkal */
path.out-dot[stroke-linecap]{stroke:var(--out)}path.u-dot[stroke-linecap]{stroke:var(--u)}path.ref-dot[stroke-linecap]{stroke:var(--ref)}
path.dist-dot[stroke-linecap]{stroke:var(--dist)}path.accent-dot[stroke-linecap]{stroke:var(--accent)}
path.est-dot[stroke-linecap]{stroke:var(--est)}path.truth-dot[stroke-linecap]{stroke:var(--truth)}
.axis{stroke:var(--fg);stroke-width:1.5}
.axis-thin{stroke:var(--muted);stroke-width:.9}
.pole{stroke:var(--fg);stroke-width:2.3;fill:none}

.pole.obs,.zero.obs{stroke:var(--est)}
.pole.unstable{stroke:var(--dist)}
.locus{stroke:var(--out);stroke-width:1.4}
.stable-region{fill:var(--stable);stroke:none}
.unstable-region{fill:var(--unstable);stroke:none}
.spec{fill:url(#hatch-spec);stroke:var(--limit);stroke-width:.8}
.spec-hatch{stroke:var(--limit);stroke-width:1.6;opacity:.55}
.spec-line{stroke:var(--limit);stroke-width:1.1;stroke-dasharray:4 3}
.unit-circle{stroke:var(--fg);stroke-width:1.4}
.minus-one{stroke:var(--dist);stroke-width:2.8;fill:none}
.ms-circle{stroke:var(--dist);stroke-width:1.2;stroke-dasharray:3 3}
.mirror{opacity:.5;stroke-dasharray:4 4;stroke-width:1.4}
.margin{stroke:var(--accent);stroke-width:3}
.wire-arrow{stroke:var(--fg);stroke-width:1.4}
/* blokkdiagram */
.blk{fill:var(--bg);stroke:var(--fg);stroke-width:1.4}
.wire{stroke:var(--fg);stroke-width:1.3}
.arrow-fg{fill:var(--fg)}
.node-dot{fill:var(--fg)}
.sig-dot{fill:var(--u);stroke:var(--bg);stroke-width:1}
.blk-label{font-size:13.5px}.wire-label{font-size:12px}.sign{font-size:15px;font-weight:600}
.blk.hl{stroke:var(--u);stroke-width:3;fill:var(--band)}
.wire.hl{stroke:var(--u);stroke-width:3}
text.hl{fill:var(--u);font-weight:700}
.dim{opacity:.25}
/* jelenetek */
.cart{fill:var(--band);stroke:var(--fg);stroke-width:1.5}
.wheel{fill:var(--fg)}
.rod{stroke:var(--fg);stroke-width:4;stroke-linecap:round;fill:none}
.bob{fill:var(--out)}

</style>

<body>
<div id="controls"></div>
<div id="status" aria-live="polite"></div>
<svg id="view" viewBox="0 0 720 432" role="img" aria-label="A megfigyelő pólusai a komplex síkon, mellettük az ingaszög, a kocsisebesség és a szögsebesség valódi és becsült értéke."></svg>
<p class="note">A folyamatot a valódi állapotból szabályozzuk; a megfigyelő csak becsül. Nemlineáris modell, mintavétel 10 ms, α(0) = 0,1 rad, x̂(0) = 0. Zajszint 1×: 2 mm és 5 mrad szórás (kitalált érték, mag: 1).</p>
<script>
// Hibát látható módon jelezzük (a statikus PNG a lap alatt lenyitható tartalék marad).
window.addEventListener("error", e => { const s = document.getElementById("status");
  if (s) { s.textContent = "Hiba az interaktív ábrában: " + e.message + " (sor " + e.lineno + ")"; s.className = "error"; } });
</script>
<script>
/* kf.js – a könyv interaktív lapjainak számítási magja (külső függőség nélkül).
   A kftrack Python-csomag tükre: ugyanazok a képletek, ugyanaz az állapotsorrend
   ([x, y, vx, vy]), a paritást a figures/web/test/ teszt ellenőrzi.
   Mátrix: tömbök tömbje (sorok), vektor: sima tömb. */
"use strict";
const KF = (() => {
  // ---------- mátrixok ----------
  const zeros = (r, c) => Array.from({length: r}, () => new Array(c).fill(0));
  const eye = n => { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; };
  const T = A => A[0].map((_, j) => A.map(row => row[j]));
  const mul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const mv = (A, x) => A.map(row => row.reduce((s, a, k) => s + a * x[k], 0));
  const add = (A, B) => A.map((row, i) => row.map((a, j) => a + B[i][j]));
  const sub = (A, B) => A.map((row, i) => row.map((a, j) => a - B[i][j]));
  const scale = (A, s) => A.map(row => row.map(a => a * s));
  const vadd = (a, b) => a.map((v, i) => v + b[i]);
  const vsub = (a, b) => a.map((v, i) => v - b[i]);
  const vscale = (a, s) => a.map(v => v * s);
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sym = P => P.map((row, i) => row.map((a, j) => 0.5 * (a + P[j][i])));
  const diag = d => { const D = zeros(d.length, d.length); d.forEach((v, i) => D[i][i] = v); return D; };
  const kron = (A, B) => {
    const r = A.length * B.length, c = A[0].length * B[0].length, K = zeros(r, c);
    A.forEach((ra, i) => ra.forEach((a, j) => B.forEach((rb, k) => rb.forEach((b, l) => {
      K[i * B.length + k][j * B[0].length + l] = a * b; }))));
    return K;
  };
  const clone = A => A.map(r => r.slice());
  const select = (A, rows, cols) => rows.map(i => cols.map(j => A[i][j]));
  /* A X = B megoldása Gauss-eliminációval, részleges főelemkiválasztással (kf004: „solve, ne inv”).
     B lehet vektor vagy mátrix. */
  function solve(A, B) {
    const n = A.length, vec = !Array.isArray(B[0]);
    const M = A.map((row, i) => row.concat(vec ? [B[i]] : B[i]));
    const w = M[0].length;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("szinguláris mátrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k < w; k++) M[r][k] -= f * M[c][k];
      }
    }
    const X = zeros(n, w - n);
    for (let r = n - 1; r >= 0; r--) for (let k = 0; k < w - n; k++) {
      let s = M[r][n + k];
      for (let j = r + 1; j < n; j++) s -= M[r][j] * X[j][k];
      X[r][k] = s / M[r][r];
    }
    return vec ? X.map(r => r[0]) : X;
  }
  const inv = A => solve(A, eye(A.length));
  function chol(P) {          // P = L Lᵀ, L alsó háromszög (kf006)
    const n = P.length, L = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = P[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) throw new Error("nem pozitív definit"); L[i][i] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
    return L;
  }
  function eig2(P) {          // szimmetrikus 2×2: sajátértékek (nagy, kicsi) és a nagyobbik iránya
    const a = P[0][0], b = 0.5 * (P[0][1] + P[1][0]), d = P[1][1];
    const tr = a + d, disc = Math.sqrt(Math.max(0, 0.25 * (a - d) * (a - d) + b * b));
    return {l1: 0.5 * tr + disc, l2: 0.5 * tr - disc, angle: 0.5 * Math.atan2(2 * b, a - d)};
  }
  const mat = {zeros, eye, T, mul, mv, add, sub, scale, vadd, vsub, vscale, dot, sym, diag, kron,
               clone, select, solve, inv, chol, eig2};

  // ---------- szögek (kf028) ----------
  const TAU = 2 * Math.PI;
  function wrap(a) { let w = ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; return w === -Math.PI ? Math.PI : w; }
  function wrapHalf(a) { let w = ((a + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
                         return w === -Math.PI / 2 ? Math.PI / 2 : w; }
  const angles = {wrap, wrapHalf, diff: (a, b) => wrap(a - b),
    mean: (as, ws) => { ws = ws || as.map(() => 1 / as.length);
      return Math.atan2(as.reduce((s, a, i) => s + ws[i] * Math.sin(a), 0),
                        as.reduce((s, a, i) => s + ws[i] * Math.cos(a), 0)); }};

  // ---------- modellek (kf016–kf018, kf027) ----------
  const models = {
    cvF: (dt, dim = 2) => kron([[1, dt], [0, 1]], eye(dim)),
    caF: (dt, dim = 2) => kron([[1, dt, 0.5 * dt * dt], [0, 1, dt], [0, 0, 1]], eye(dim)),
    cvQc: (dt, q, dim = 2) => scale(kron([[dt ** 3 / 3, dt ** 2 / 2], [dt ** 2 / 2, dt]], eye(dim)), q),
    caQd: (dt, sj, dim = 2) => { const g = [dt ** 3 / 6, dt * dt / 2, dt]; return scale(kron(g.map(a => g.map(b => a * b)), eye(dim)), sj * sj); },
    cvQd: (dt, sa, dim = 2) => scale(kron([[dt ** 4 / 4, dt ** 3 / 2], [dt ** 3 / 2, dt * dt]], eye(dim)), sa * sa),
    posH: (order = 2, dim = 2) => { const e = [new Array(order).fill(0)]; e[0][0] = 1; return kron(e, eye(dim)); },
    ctf(x, dt) {
      const [px, py, v, phi, w] = x, a = w * dt;
      const s = Math.abs(a) < 1e-4 ? dt * (1 - a * a / 6) : Math.sin(a) / w;
      const c = Math.abs(a) < 1e-4 ? dt * (a / 2 - a ** 3 / 24) : (1 - Math.cos(a)) / w;
      const cp = Math.cos(phi), sp = Math.sin(phi);
      return [px + v * (s * cp - c * sp), py + v * (s * sp + c * cp), v, phi + w * dt, w];
    },
  };
  models.ctF = (x, dt, eps = 1e-6) => {
    const J = zeros(5, 5);
    for (let i = 0; i < 5; i++) {
      const xp = x.slice(), xm = x.slice(); xp[i] += eps; xm[i] -= eps;
      const fp = models.ctf(xp, dt), fm = models.ctf(xm, dt);
      for (let r = 0; r < 5; r++) J[r][i] = (fp[r] - fm[r]) / (2 * eps);
    }
    return J;
  };

  // ---------- szűrő (kf019–kf024) ----------
  function predict(x, P, F, Q, u) {
    const xn = mv(F, x);
    return {x: u ? vadd(xn, u) : xn, P: sym(add(mul(mul(F, P), T(F)), Q))};
  }
  function update(x, P, z, H, R, opt = {}) {
    const zhat = mv(H, x);
    const y = opt.residual ? opt.residual(z, zhat) : vsub(z, zhat);
    const S = sym(add(mul(mul(H, P), T(H)), R));
    const K = T(solve(S, mul(H, P)));                 // K = P Hᵀ S⁻¹
    const xn = vadd(x, mv(K, y));
    let Pn;
    if (opt.joseph === false) Pn = sub(P, mul(mul(K, S), T(K)));
    else { const IKH = sub(eye(x.length), mul(K, H));
           Pn = add(mul(mul(IKH, P), T(IKH)), mul(mul(K, R), T(K))); }
    return {x: xn, P: sym(Pn), y, S, K, nis: dot(y, solve(S, y))};
  }
  function selectRows(z, H, R, mask) {
    const idx = mask.map((m, i) => m ? i : -1).filter(i => i >= 0);
    return {z: idx.map(i => z[i]), H: idx.map(i => H[i].slice()), R: select(R, idx, idx)};
  }
  class Filter {
    constructor(x0, P0) { this.x = x0.slice(); this.P = clone(P0); }
    predict(F, Q, u) { const r = predict(this.x, this.P, F, Q, u); this.x = r.x; this.P = r.P; return this; }
    update(z, H, R, opt = {}) {
      if (opt.mask) { const s = selectRows(z, H, R, opt.mask); if (!s.z.length) return null; z = s.z; H = s.H; R = s.R; }
      const r = update(this.x, this.P, z, H, R, opt); this.x = r.x; this.P = r.P; return r;
    }
    forecast(F, Q, steps) { let x = this.x, P = this.P; const out = [];
      for (let i = 0; i < steps; i++) { ({x, P} = predict(x, P, F, Q)); out.push({x, P}); } return out; }
  }

  // ---------- Gauss (kf009) ----------
  const gauss = {
    coverage2d: k => 1 - Math.exp(-0.5 * k * k),
    kForCoverage2d: p => Math.sqrt(-2 * Math.log(1 - p)),
    mahalanobis2: (x, m, P) => { const d = vsub(x, m); return dot(d, solve(P, d)); },
    block: (P, i0 = 0, n = 2) => select(P, [...Array(n).keys()].map(i => i + i0), [...Array(n).keys()].map(i => i + i0)),
    /* k-szigma ellipszis; szinguláris vagy szemidefinit P2-re (pl. vetítés) a sajátfelbontásból
       rajzol (szakasz lesz belőle), indefinit P2-re üres tömb. */
    ellipse(m, P2, k = 2, n = 72) {
      let L;
      try { L = chol(add(P2, scale(eye(2), 1e-12))); }
      catch (e) {
        const E = eig2(P2); if (E.l2 < -1e-9 * Math.max(1, Math.abs(E.l1))) return [];
        const a = Math.sqrt(Math.max(E.l1, 0)), b = Math.sqrt(Math.max(E.l2, 0)), c = Math.cos(E.angle), s = Math.sin(E.angle), pts = [];
        for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), u = a * Math.cos(t), v = b * Math.sin(t);
          pts.push([m[0] + k * (c * u - s * v), m[1] + k * (s * u + c * v)]); }
        return pts;
      }
      const pts = [];
      for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), c = Math.cos(t), s = Math.sin(t);
        pts.push([m[0] + k * (L[0][0] * c), m[1] + k * (L[1][0] * c + L[1][1] * s)]); }
      return pts;
    },
  };

  // ---------- véletlen: determinisztikus, magolt (mulberry32 + Box–Muller) ----------
  function rng(seed = 1) {
    let a = seed >>> 0, spare = null;
    const uniform = (lo = 0, hi = 1) => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return lo + (hi - lo) * (((t ^ (t >>> 14)) >>> 0) / 4294967296); };
    const normal = () => { if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = uniform(); const v = uniform(), r = Math.sqrt(-2 * Math.log(u));
      spare = r * Math.sin(TAU * v); return r * Math.cos(TAU * v); };
    const poisson = lam => { const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= uniform(); } while (p > L); return k - 1; };
    return {uniform, normal, poisson};
  }

  // ---------- szimulátor (a kftrack.sim tükre; más véletlenszám-generátorral) ----------
  const sim = {
    sigmaFromScore: (s, lo = 2, hi = 12) => lo * Math.pow(hi / lo, 1 - s),

  /* Komplex sík (azonos léptékű tengelyek). kind: "s" (stabil bal félsík), "z" (egységkör),

  /* Bode-panelpár: felül amplitúdó (dB), alul fázis (fok), közös logaritmikus ω-tengely. */
  class BodePanel {
    constructor(svg, {box = [0, 0, 720, 400], wlim = [0.01, 100], dblim, phlim, ratio = 0.56, title = ""} = {}) {
      const [x, y, w, h] = box, L = 56, R = 12, T = 18, B = 30, gap = 22, H = h - T - B - gap;
      this.opt = {dblim, phlim};
      this.mag = new Plot(svg, {box: [x + L, y + T, w - L - R, H * ratio], xlim: wlim, ylim: dblim || [-60, 40], xlog: true, ylabel: "amplitúdó (dB)", title});

    }

    draw(curves, {margins} = {}) {
      const inWin = c => c.w.map((v, i) => i).filter(i => c.w[i] >= this.mag.xlim[0] && c.w[i] <= this.mag.xlim[1]);
      const pick = key => curves.map(c => inWin(c).map(i => c[key][i]));

        phStep = b - a > 540 ? 180 : b - a > 270 ? 90 : 45; this.ph.setLimits(null, [Math.floor(a / phStep) * phStep, Math.ceil(b / phStep) * phStep]); }
      else { const [a, b] = this.opt.phlim; phStep = b - a > 540 ? 180 : b - a > 270 ? 90 : 45; }
      const pt = []; for (let v = Math.ceil(this.ph.ylim[0] / phStep) * phStep; v <= this.ph.ylim[1]; v += phStep) pt.push(v);
      this.mag.clear().axes(); this.ph.clear().axes(pt);

        this.mag.vline(m.wc, "cursor"); this.ph.vline(m.wc, "cursor");
        this.ph.line([[m.wc, base], [m.wc, ph]], "margin"); this.mag.dot([m.wc, 0], 3.5, "accent-dot"); this.ph.dot([m.wc, ph], 3.5, "accent-dot"); }

        this.mag.line([[m.w180, db], [m.w180, 0]], "margin"); this.ph.dot([m.w180, ph], 3.5, "accent-dot"); }

    }
  }

  /* Blokkdiagram rácspozíciókon (a run.py "block" diagramjának sémája):

             edges: [{from, to, via: [[o, s], …], sign: "+"|"-", label, id}]}
     A visszaadott objektum: draw({hl: [csúcs- és élazonosítók], dim: […], labels: {id: szöveg},
     hide: […]}), pointAt(él, f), dot(él, f, cls, r) – jel-animációhoz; él = index vagy id. */
  function blockDiagram(svg, spec, {x = 40, y = 40, dx = 110, dy = 70, bw = 66, bh = 36} = {}) {
    defs(svg);
    const g = el(svg, "g", {class: "blockdiag"}), grid = p => [x + p[0] * dx, y + p[1] * dy], rs = 11;
    let nodes, edges;
    function geometry() {

      const anchor = (n, to) => { const [cx0, cy0] = n.xy, ux = to[0] - cx0, uy = to[1] - cy0, L = Math.hypot(ux, uy) || 1;
        if (n.type === "block") return Math.abs(ux) * bh >= Math.abs(uy) * n.W ? [cx0 + Math.sign(ux) * n.W / 2, cy0 + uy * (n.W / 2) / Math.max(Math.abs(ux), 1e-9)]
          : [cx0 + ux * (bh / 2) / Math.max(Math.abs(uy), 1e-9), cy0 + Math.sign(uy) * bh / 2];
        return n.type === "sum" ? [cx0 + rs * ux / L, cy0 + rs * uy / L] : [cx0, cy0]; };

        return {...e, key: e.id ?? i, pts: [anchor(a, via[0] || b.xy), ...via, anchor(b, via[via.length - 1] || a.xy)]}; });

    const api = {g, spec,
      draw({hl = [], dim = [], labels = {}, hide = []} = {}) {

        const cls = (base, k) => base + (hl.includes(k) ? " hl" : "") + (dim.includes(k) ? " dim" : "");
        edges.forEach(e => { if (hide.includes(e.key)) return;
          const attrs = {points: e.pts.map(p => p.join(",")).join(" "), class: cls("wire", e.key), fill: "none"};
          if (nodes[e.to].type !== "point") attrs["marker-end"] = "url(#arrow-fg)";
          el(g, "polyline", attrs);
          const [p, q] = e.pts.slice(-2), L = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1, ux = (q[0] - p[0]) / L, uy = (q[1] - p[1]) / L;
          if (e.sign) el(g, "text", {x: q[0] - 13 * ux - 9 * Math.abs(uy), y: q[1] - 13 * uy - 9 * Math.abs(ux) + 4, class: "sign", "text-anchor": "middle"}, e.sign === "-" ? "−" : "+");
          const lab = labels[e.key] ?? e.label;

            const a = e.pts[bi - 1], b = e.pts[bi], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, hor = Math.abs(b[0] - a[0]) >= Math.abs(b[1] - a[1]);

        });

          const [cx0, cy0] = n.xy, lab = labels[n.id] ?? n.label;
          if (n.type === "block") { el(g, "rect", {x: cx0 - n.W / 2, y: cy0 - bh / 2, width: n.W, height: bh, rx: 3, class: cls("blk", n.id)});
            rich(el(g, "text", {x: cx0, y: cy0 + 4.5, class: cls("blk-label", n.id), "text-anchor": "middle"}), lab || ""); }
          else if (n.type === "sum") { el(g, "circle", {cx: cx0, cy: cy0, r: rs, class: cls("blk", n.id)});
            if (lab) rich(el(g, "text", {x: cx0, y: cy0 - rs - 5, class: "wire-label", "text-anchor": "middle"}), lab); }
          else if (n.type === "point") { el(g, "circle", {cx: cx0, cy: cy0, r: 3, class: "node-dot"});
            if (lab) rich(el(g, "text", {x: cx0, y: cy0 - 8, class: "wire-label", "text-anchor": "middle"}), lab); }
          else { const e = edges.find(d => d.from === n.id || d.to === n.id);
            const q = e ? (e.from === n.id ? e.pts[1] : e.pts[e.pts.length - 2]) : [cx0 + 1, cy0], ux = q[0] - cx0, uy = q[1] - cy0, hor = Math.abs(ux) >= Math.abs(uy);
            rich(el(g, "text", {x: hor ? cx0 - 6 * Math.sign(ux) : cx0, y: hor ? cy0 + 4 : cy0 - Math.sign(uy) * 10 + 4, class: cls("blk-label", n.id),
              "text-anchor": hor ? (ux > 0 ? "end" : "start") : "middle"}), lab || ""); }
        });
        return api;
      },
      /* Az él f ∈ [0, 1] arányú pontja (képpont). */
      pointAt(k, f) { const pts = find(k).pts, ls = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));

      dot(k, f, cls = "sig-dot", r = 5) { const p = api.pointAt(k, f); return el(g, "circle", {cx: p[0], cy: p[1], r, class: cls}); },
    };
    return api.draw();
  }

  /* Kocsis inga egy (equal: true) jelenetben: x_c a kocsi helye, α a függőlegestől, CCW pozitív. */
  function cartPendulum(sc, xc, alpha, {L = 0.6, w = 0.36, h = 0.18, y = 0, cls = "", force = 0} = {}) {
    const g = cls ? " " + cls : "", py = y + h / 2, tip = [xc - L * Math.sin(alpha), py + h / 2 + L * Math.cos(alpha)], piv = [xc, py + h / 2];
    sc.line([[sc.xlim[0], y - 0.07], [sc.xlim[1], y - 0.07]], "axis-thin");
    sc.rect(xc - w / 2, y, xc + w / 2, y + h, "cart" + g);
    [-0.3, 0.3].forEach(k => el(sc.g, "circle", {cx: sc.X(xc + k * w), cy: sc.Y(y - 0.035), r: 0.035 * sc.sx, class: "wheel" + g}));
    sc.line([piv, tip], "rod" + g); sc.dot(piv, 3, "node-dot"); sc.dot(tip, 0.06 * sc.sx, "bob" + g);
    if (force) { const x0 = xc + Math.sign(force) * w / 2; sc.arrow([x0, y + h / 2], [x0 + force, y + h / 2], "u"); }

  function drone(sc, x, h, {size = 0.5, cls = "", thrust = 0} = {}) {

    [-a, a].forEach(d => { sc.line([[x + d, h], [x + d, h + size * 0.12]], "wire" + g); sc.line([[x + d - size * 0.22, h + size * 0.12], [x + d + size * 0.22, h + size * 0.12]], "wire" + g); });
    sc.rect(x - size * 0.16, h - size * 0.12, x + size * 0.16, h + size * 0.08, "cart" + g);
    if (thrust) sc.arrow([x, h + size * 0.1], [x, h + size * 0.1 + thrust], "u");
  }

  /* Jelmagyarázat a nézet egy sarkában: items = [[osztály, felirat, jel], …], jel: line|cross|dot|ell|area */
  function legend(svg, items, x = 8, y = 14, dy = 16, id = "legend") {
    const old = svg.querySelector(`g#${id}`); if (old) old.remove();   // képkockánként újrarajzolható
    const g = el(svg, "g", {class: "legend", id});
    items.forEach(([cls, label, kind = "line"], i) => {
      const yy = y + i * dy;
      if (kind === "pole") el(g, "path", {d: `M${x + 6},${yy - 4}l8,8m0,-8l-8,8`, class: cls});
      else if (kind === "zero") el(g, "circle", {cx: x + 10, cy: yy, r: 4.5, class: cls});

const Ts = 0.01, N = 300, A = DATA.A, B = DATA.B, K = DATA.K;
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
function simulate(L, C, noise, d, mass) {
  const plant = CTL.models.cartPendulum({m: mass});
  let x = [0, 0, 0.1, 0], xh = [0, 0, 0, 0]; const t = [], X = [], Xh = [], Y = [];
  for (let k = 0; k <= N; k++) {
    const y = C.map((row, i) => dot(row, x) + noise * DATA.noise[k][i] * DATA.std[i]);
    const u = -dot(K, x);
    t.push(k * Ts); X.push(x); Xh.push(xh); Y.push(y);
    if (k === N) break;
    const obs = (tt, z, v) => { const inn = C.map((row, i) => y[i] - dot(row, z));
      return A.map((row, i) => dot(row, z) + B[i] * v + dot(L[i], inn)); };
    for (let j = 0; j < 2; j++) { x = CTL.rk4(plant.rhs, 0, x, u + d, Ts / 2); xh = CTL.rk4(obs, 0, xh, u, Ts / 2); }
  }
  return {t, X, Xh, Y};
}

      const hi = Draw.extent([s.X.map(x => x[i]), s.Xh.map(x => x[i])], {include: ex, cap: 4}); return hi; };
    p1.setLimits(null, lim(2, 0.05)); p2.setLimits(null, lim(1, 0.4)); p3.setLimits(null, lim(3, 0.8));
    return {...s, G, rms: [rms(1), rms(3)], peak: peak(3), Lmax: Math.max(...L.flat().map(Math.abs))};
  },
  render(s, frame, p) {
    sp.base(); sp.poles(DATA.ctrl, "pole cl"); sp.poles(s.G.poles.filter(q => q[0] < -0.01 || p.ki > 0), "pole obs");
    [p1, p2, p3].forEach(q => { q.clear().axes(Draw.ticks(q.ylim[0], q.ylim[1], 4)); q.hline(0, "axis-thin"); });
    p1.cloud(s.t.map((v, k) => [v, s.Y[k].length > 1 ? s.Y[k][1] : NaN]).filter(q => Number.isFinite(q[1])), 1.2, "meas-dot");
    [[p1, 2], [p2, 1], [p3, 3]].forEach(([q, i]) => { q.curve(s.t, s.X.map(x => x[i]), "out"); q.curve(s.t, s.Xh.map(x => x[i]), "est"); });
    Draw.legend(svg, [["pole cl", "szabályozópólus", "pole"], ["pole obs", "megfigyelőpólus", "pole"], ["out", "valódi állapot"],
                      ["est", "becsült állapot"], ["meas-dot", "mért α", "dot"]], 40, 260, 20);
    const poles = p.ki === 0 ? "L = 0: a becslő a nyílt hurkú modell (a hiba az A pólusaival fejlődik)"
      : `megfigyelőpólusok: ${s.G.poles.map(q => CTL.num(q[0], 1)).join("; ")}; max |L| = ${CTL.num(s.Lmax, 0)}`;
    if (s.peak > 100) return `${poles}\nA becslés DIVERGÁL: az α' becslési hibája 3 s alatt ${CTL.num(s.peak, 0)} rad/s fölé nő.`;
    return `${poles}\nBecslési hiba effektív értéke (t ≥ 1,5 s): x_c' ${CTL.num(s.rms[0], 4)} m/s, α' ${CTL.num(s.rms[1], 4)} rad/s\n` +
      `legnagyobb |α' hiba| 1,5 s után: ${CTL.num(s.peak, 3)} rad/s`;
  },
});
