<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamikus diszpécs: Box<dyn Storage></title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><fieldset style="border:0;padding:0;margin:0"><legend class="small">Háttér (create_store kind):</legend><label><input type="radio" name="kind" value="mem" checked onchange="setMode(this.value)"> mem</label> <label><input type="radio" name="kind" value="file" onchange="setMode(this.value)"> file</label> <label><input type="radio" name="kind" value="readonly" onchange="setMode(this.value)"> readonly</label> </fieldset></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A store kövér mutató (adatmutató és vtable-mutató); a &mut *store reborrow ugyanezt a két mutatót adja. A hívás a vtable megfelelő bejegyzésén át a MemStore, a FileStore vagy a ReadOnly implementációját éri el; a FileStore a set és a sikeres delete hívásnál naplósort ír."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető modell: a vtable bejegyzéseinek sorrendje nem specifikált. A naplósorok JSON-alakja serde_json-nal ellenőrzött (Rust 1.99.1). readonly módban a contract unwrap-ja az első set-nél pánikolna; a lépések az egyes hívások eredményét mutatják.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "m": "set", "call": "set(\"kulcs\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 1, "log": [], "newlog": false, "data": ["kulcs"], "err": false, "msg": "1. set(\"kulcs\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 1, "m": "get", "call": "get(\"kulcs\")", "ret": "Ok(Some(\"érték\"))", "target": "<MemStore as Storage>::get", "line": 2, "log": [], "newlog": false, "data": ["kulcs"], "err": false, "msg": "2. get(\"kulcs\"): a vtable „get” bejegyzése → <MemStore as Storage>::get ⇒ Ok(Some(\"érték\"))"}, {"i": 2, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(true)", "target": "<MemStore as Storage>::delete", "line": 3, "log": [], "newlog": false, "data": [], "err": false, "msg": "3. delete(\"kulcs\"): a vtable „delete” bejegyzése → <MemStore as Storage>::delete ⇒ Ok(true)"}, {"i": 3, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(false)", "target": "<MemStore as Storage>::delete", "line": 4, "log": [], "newlog": false, "data": [], "err": false, "msg": "4. delete(\"kulcs\"): a vtable „delete” bejegyzése → <MemStore as Storage>::delete ⇒ Ok(false)"}, {"i": 4, "m": "set", "call": "set(\"b\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 5, "log": [], "newlog": false, "data": ["b"], "err": false, "msg": "5. set(\"b\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 5, "m": "set", "call": "set(\"a\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 6, "log": [], "newlog": false, "data": ["a", "b"], "err": false, "msg": "6. set(\"a\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 6, "m": "list", "call": "list(None)", "ret": "Ok([\"a\", \"b\"])  (kulcsok)", "target": "<MemStore as Storage>::list", "line": 7, "log": [], "newlog": false, "data": ["a", "b"], "err": false, "msg": "7. list(None): a vtable „list” bejegyzése → <MemStore as Storage>::list ⇒ Ok([\"a\", \"b\"])  (kulcsok)"}];
const CODE = ["fn contract(store: &mut dyn Storage) {", "    store.set(\"kulcs\".to_owned(), \"érték\".as_bytes().to_vec()).unwrap();", "    assert_eq!(store.get(\"kulcs\").unwrap(), Some(\"érték\".as_bytes().to_vec()));", "    assert!(store.delete(\"kulcs\").unwrap());", "    assert!(!store.delete(\"kulcs\").unwrap());", "    store.set(\"b\".into(), b\"2\".to_vec()).unwrap();", "    store.set(\"a\".into(), b\"1\".to_vec()).unwrap();", "    let keys: Vec<String> = store.list(None).unwrap().into_iter().map(|(k, _)| k).collect();", "    assert_eq!(keys, [\"a\", \"b\"]); // rendezett", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SIMS = {"mem": [{"i": 0, "m": "set", "call": "set(\"kulcs\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 1, "log": [], "newlog": false, "data": ["kulcs"], "err": false, "msg": "1. set(\"kulcs\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 1, "m": "get", "call": "get(\"kulcs\")", "ret": "Ok(Some(\"érték\"))", "target": "<MemStore as Storage>::get", "line": 2, "log": [], "newlog": false, "data": ["kulcs"], "err": false, "msg": "2. get(\"kulcs\"): a vtable „get” bejegyzése → <MemStore as Storage>::get ⇒ Ok(Some(\"érték\"))"}, {"i": 2, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(true)", "target": "<MemStore as Storage>::delete", "line": 3, "log": [], "newlog": false, "data": [], "err": false, "msg": "3. delete(\"kulcs\"): a vtable „delete” bejegyzése → <MemStore as Storage>::delete ⇒ Ok(true)"}, {"i": 3, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(false)", "target": "<MemStore as Storage>::delete", "line": 4, "log": [], "newlog": false, "data": [], "err": false, "msg": "4. delete(\"kulcs\"): a vtable „delete” bejegyzése → <MemStore as Storage>::delete ⇒ Ok(false)"}, {"i": 4, "m": "set", "call": "set(\"b\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 5, "log": [], "newlog": false, "data": ["b"], "err": false, "msg": "5. set(\"b\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 5, "m": "set", "call": "set(\"a\")", "ret": "Ok(())", "target": "<MemStore as Storage>::set", "line": 6, "log": [], "newlog": false, "data": ["a", "b"], "err": false, "msg": "6. set(\"a\"): a vtable „set” bejegyzése → <MemStore as Storage>::set ⇒ Ok(())"}, {"i": 6, "m": "list", "call": "list(None)", "ret": "Ok([\"a\", \"b\"])  (kulcsok)", "target": "<MemStore as Storage>::list", "line": 7, "log": [], "newlog": false, "data": ["a", "b"], "err": false, "msg": "7. list(None): a vtable „list” bejegyzése → <MemStore as Storage>::list ⇒ Ok([\"a\", \"b\"])  (kulcsok)"}], "file": [{"i": 0, "m": "set", "call": "set(\"kulcs\")", "ret": "Ok(())", "target": "<FileStore as Storage>::set", "line": 1, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}"], "newlog": true, "data": ["kulcs"], "err": false, "msg": "1. set(\"kulcs\"): a vtable „set” bejegyzése → <FileStore as Storage>::set ⇒ Ok(()); az append.log új sort kapott"}, {"i": 1, "m": "get", "call": "get(\"kulcs\")", "ret": "Ok(Some(\"érték\"))", "target": "<FileStore as Storage>::get", "line": 2, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}"], "newlog": false, "data": ["kulcs"], "err": false, "msg": "2. get(\"kulcs\"): a vtable „get” bejegyzése → <FileStore as Storage>::get ⇒ Ok(Some(\"érték\"))"}, {"i": 2, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(true)", "target": "<FileStore as Storage>::delete", "line": 3, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}", "{\"Delete\":{\"key\":\"kulcs\"}}"], "newlog": true, "data": [], "err": false, "msg": "3. delete(\"kulcs\"): a vtable „delete” bejegyzése → <FileStore as Storage>::delete ⇒ Ok(true); az append.log új sort kapott"}, {"i": 3, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Ok(false)", "target": "<FileStore as Storage>::delete", "line": 4, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}", "{\"Delete\":{\"key\":\"kulcs\"}}"], "newlog": false, "data": [], "err": false, "msg": "4. delete(\"kulcs\"): a vtable „delete” bejegyzése → <FileStore as Storage>::delete ⇒ Ok(false)"}, {"i": 4, "m": "set", "call": "set(\"b\")", "ret": "Ok(())", "target": "<FileStore as Storage>::set", "line": 5, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}", "{\"Delete\":{\"key\":\"kulcs\"}}", "{\"Set\":{\"key\":\"b\",\"value\":[50]}}"], "newlog": true, "data": ["b"], "err": false, "msg": "5. set(\"b\"): a vtable „set” bejegyzése → <FileStore as Storage>::set ⇒ Ok(()); az append.log új sort kapott"}, {"i": 5, "m": "set", "call": "set(\"a\")", "ret": "Ok(())", "target": "<FileStore as Storage>::set", "line": 6, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}", "{\"Delete\":{\"key\":\"kulcs\"}}", "{\"Set\":{\"key\":\"b\",\"value\":[50]}}", "{\"Set\":{\"key\":\"a\",\"value\":[49]}}"], "newlog": true, "data": ["a", "b"], "err": false, "msg": "6. set(\"a\"): a vtable „set” bejegyzése → <FileStore as Storage>::set ⇒ Ok(()); az append.log új sort kapott"}, {"i": 6, "m": "list", "call": "list(None)", "ret": "Ok([\"a\", \"b\"])  (kulcsok)", "target": "<FileStore as Storage>::list", "line": 7, "log": ["{\"Set\":{\"key\":\"kulcs\",\"value\":[195,169,114,116,195,169,107]}}", "{\"Delete\":{\"key\":\"kulcs\"}}", "{\"Set\":{\"key\":\"b\",\"value\":[50]}}", "{\"Set\":{\"key\":\"a\",\"value\":[49]}}"], "newlog": false, "data": ["a", "b"], "err": false, "msg": "7. list(None): a vtable „list” bejegyzése → <FileStore as Storage>::list ⇒ Ok([\"a\", \"b\"])  (kulcsok)"}], "readonly": [{"i": 0, "m": "set", "call": "set(\"kulcs\")", "ret": "Err(Error::Io(PermissionDenied))", "target": "<ReadOnly as Storage>::set", "line": 1, "log": [], "newlog": false, "data": [], "err": true, "msg": "1. set(\"kulcs\"): a vtable „set” bejegyzése → <ReadOnly as Storage>::set ⇒ Err(Error::Io(PermissionDenied))  (a contract unwrap-ja itt pánikolna; a 3. feladat külön teszttel ellenőrzi)"}, {"i": 1, "m": "get", "call": "get(\"kulcs\")", "ret": "Ok(None)", "target": "<ReadOnly as Storage>::get", "line": 2, "log": [], "newlog": false, "data": [], "err": false, "msg": "2. get(\"kulcs\"): a vtable „get” bejegyzése → <ReadOnly as Storage>::get ⇒ Ok(None)"}, {"i": 2, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Err(Error::Io(PermissionDenied))", "target": "<ReadOnly as Storage>::delete", "line": 3, "log": [], "newlog": false, "data": [], "err": true, "msg": "3. delete(\"kulcs\"): a vtable „delete” bejegyzése → <ReadOnly as Storage>::delete ⇒ Err(Error::Io(PermissionDenied))"}, {"i": 3, "m": "delete", "call": "delete(\"kulcs\")", "ret": "Err(Error::Io(PermissionDenied))", "target": "<ReadOnly as Storage>::delete", "line": 4, "log": [], "newlog": false, "data": [], "err": true, "msg": "4. delete(\"kulcs\"): a vtable „delete” bejegyzése → <ReadOnly as Storage>::delete ⇒ Err(Error::Io(PermissionDenied))"}, {"i": 4, "m": "set", "call": "set(\"b\")", "ret": "Err(Error::Io(PermissionDenied))", "target": "<ReadOnly as Storage>::set", "line": 5, "log": [], "newlog": false, "data": [], "err": true, "msg": "5. set(\"b\"): a vtable „set” bejegyzése → <ReadOnly as Storage>::set ⇒ Err(Error::Io(PermissionDenied))"}, {"i": 5, "m": "set", "call": "set(\"a\")", "ret": "Err(Error::Io(PermissionDenied))", "target": "<ReadOnly as Storage>::set", "line": 6, "log": [], "newlog": false, "data": [], "err": true, "msg": "6. set(\"a\"): a vtable „set” bejegyzése → <ReadOnly as Storage>::set ⇒ Err(Error::Io(PermissionDenied))"}, {"i": 6, "m": "list", "call": "list(None)", "ret": "Ok([])  (kulcsok)", "target": "<ReadOnly as Storage>::list", "line": 7, "log": [], "newlog": false, "data": [], "err": false, "msg": "7. list(None): a vtable „list” bejegyzése → <ReadOnly as Storage>::list ⇒ Ok([])  (kulcsok)"}]}, VT = ["drop_in_place", "size", "align", "get", "set", "delete", "list"], IMPL = {"mem": "MemStore", "file": "FileStore", "readonly": "ReadOnly"};
let MODE = "mem";
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400");
  svg.innerHTML = "";
  const box = (x, y, w, h, o) => el("rect", Object.assign({x, y, width: w, height: h, rx: 4, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2}, o || {}));
  const arrow = (x1, y1, x2, y2, on, dash) => {
    el("line", {x1, y1, x2, y2, stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 3.5 : 1.2, "stroke-dasharray": dash ? "6 4" : ""});
    const a = Math.atan2(y2 - y1, x2 - x1), L = 10;
    el("path", {d: `M${x2},${y2} L${x2 - L*Math.cos(a - .4)},${y2 - L*Math.sin(a - .4)} L${x2 - L*Math.cos(a + .4)},${y2 - L*Math.sin(a + .4)} Z`, fill: on ? css("--hl") : css("--muted")});
  };
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, `kind = "${MODE}" → Box<dyn Storage + Send> mögött: ${IMPL[MODE]}`);
  el("text", {x: 10, y: 52, "font-size": 12, "font-style": "italic"}, "verem");
  [["store: Box<dyn Storage + Send>", 80], ["&mut *store: &mut dyn Storage", 180]].forEach(([lab, y], j) => {
    el("text", {x: 10, y: y - 8, "font-size": 12, "font-family": "monospace"}, lab);
    ["data ptr", "vtable ptr"].forEach((c, i) => { box(10 + i*110, y, 110, 36, {fill: j ? css("--cellhl") : css("--cell")});
      el("text", {x: 65 + i*110, y: y + 23, "text-anchor": "middle", "font-size": 13}, c); });
  });
  arrow(120, 118, 120, 158, false, true);
  el("text", {x: 128, y: 142, "font-size": 11, fill: css("--muted")}, "reborrow (unsized coercion)");
  const vx = 290, vy = 70, rh = 26;
  el("text", {x: vx, y: vy - 8, "font-size": 13, "font-weight": "bold"}, IMPL[MODE] + "-vtable");
  VT.forEach((n, r) => { const on = n === s.m;
    box(vx, vy + r*rh, 150, rh, {rx: 0, fill: on ? css("--cellhl") : css("--cell"), "stroke-width": on ? 3 : 1});
    el("text", {x: vx + 8, y: vy + r*rh + 18, "font-size": 13, "font-family": "monospace", "font-weight": on ? "bold" : "normal"}, n); });
  arrow(175, 198, vx, vy + 4, true, false);
  const ry = vy + (VT.indexOf(s.m) + 0.5) * rh;
  box(500, ry - 18, 250, 36, {fill: css("--cellhl"), "stroke-width": 2.5, stroke: s.err ? css("--hl2") : css("--line"), "stroke-dasharray": s.err ? "7 4" : ""});
  el("text", {x: 625, y: ry + 5, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, s.target);
  arrow(vx + 150, ry, 500, ry, true, false);
  el("text", {x: 625, y: ry + 36, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: s.err ? css("--hl2") : css("--fg")}, "⇒ " + s.ret);
  // adat
  const fields = MODE === "file" ? ["data: HashMap", "log_writer", "snapshot_path, _lock, poisoned"] : (MODE === "mem" ? ["data: HashMap"] : ["0: MemStore (data: HashMap)"]);
  const dy = 290;
  box(10, dy, 260, 30 + fields.length * 18, {});
  el("text", {x: 18, y: dy + 18, "font-size": 13, "font-weight": "bold"}, "halom: " + IMPL[MODE]);
  fields.forEach((f, i) => el("text", {x: 18, y: dy + 38 + i*18, "font-size": 12, "font-family": "monospace"}, f));
  el("text", {x: 18, y: dy + 46 + fields.length*18, "font-size": 12, fill: css("--muted")}, "kulcsok: [" + s.data.map(k => '"' + k + '"').join(", ") + "]");
  arrow(65, 216, 65, dy, true, false);
  el("text", {x: 72, y: 255, "font-size": 11, fill: css("--muted")}, "data ptr = self");
  // napló
  if (MODE === "file") {
    el("text", {x: 300, y: 290, "font-size": 13, "font-weight": "bold"}, "append.log");
    s.log.forEach((l, i) => { const last = s.newlog && i === s.log.length - 1;
      el("text", {x: 300, y: 310 + i*18, "font-size": 11.5, "font-family": "monospace", "font-weight": last ? "bold" : "normal"}, (last ? "+ " : "  ") + l); });
    if (!s.log.length) el("text", {x: 300, y: 310, "font-size": 12, fill: css("--muted")}, "(üres)");
  } else {
    el("text", {x: 300, y: 300, "font-size": 12, fill: css("--muted")}, MODE === "mem" ? "nincs napló: a MemStore csak a memóriában tárol" : "a ReadOnly a set/delete hívást elutasítja (3. feladat)");
  }
  el("text", {x: 750, y: 392, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "szemléltető: a vtable elrendezése nem specifikált");
}
function setMode(m){ MODE = m; setSteps(SIMS[m]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
