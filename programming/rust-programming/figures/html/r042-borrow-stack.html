<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked Borrows: a borrow stack lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Program:</span><button id="bP" aria-pressed="true">pozitív</button><button id="bN" aria-pressed="false">negatív</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A pozitív példában p a verem tetején van, amikor használjuk; a negatívban az r használata lepattintja p-t, ezért a p-n át történő írás UB."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Stacked Borrows modell (Miri), nem végleges nyelvi szabály; a címkék sorszáma futásonként eltér. Szürke: Unique, pontozott keret: SharedRW; szaggatott, áthúzott: lekerült címke.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"prog": "pos", "i": 0, "stack": ["x"], "removed": [], "ub": false, "x": 10, "msg": "1. let mut x = 10; → verem [x], x = 10", "line": 1}, {"prog": "pos", "i": 1, "stack": ["x", "r"], "removed": [], "ub": false, "x": 10, "msg": "2. let r: &mut i32 = &mut x; → verem [x, r], x = 10", "line": 2}, {"prog": "pos", "i": 2, "stack": ["x", "r", "p"], "removed": [], "ub": false, "x": 10, "msg": "3. let p: *mut i32 = r; → verem [x, r, p], x = 10", "line": 3}, {"prog": "pos", "i": 3, "stack": ["x", "r", "p"], "removed": [], "ub": false, "x": 11, "msg": "4. unsafe { *p += 1 }; → verem [x, r, p], x = 11", "line": 4}, {"prog": "pos", "i": 4, "stack": ["x", "r"], "removed": ["p"], "ub": false, "x": 12, "msg": "5. *r += 1; → verem [x, r], x = 12; az írás lepattintja a fölötte lévő címkéket: p", "line": 5}];
const CODE = ["// pozitív (helyes)", "let mut x = 10;", "let r: &mut i32 = &mut x;", "let p: *mut i32 = r; // r-ből származtatott nyers mutató", "unsafe { *p += 1 };", "*r += 1; // az r újbóli használata érvényes: p-t már nem használjuk", " ", "// negatív (UB Miri alatt)", "let mut x = 10;", "let r: &mut i32 = &mut x;", "let p: *mut i32 = r;", "*r += 1; // az r használata érvényteleníti a belőle származtatott p-t", "unsafe { *p += 1 };"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALTS = {"pos": [{"prog": "pos", "i": 0, "stack": ["x"], "removed": [], "ub": false, "x": 10, "msg": "1. let mut x = 10; → verem [x], x = 10", "line": 1}, {"prog": "pos", "i": 1, "stack": ["x", "r"], "removed": [], "ub": false, "x": 10, "msg": "2. let r: &mut i32 = &mut x; → verem [x, r], x = 10", "line": 2}, {"prog": "pos", "i": 2, "stack": ["x", "r", "p"], "removed": [], "ub": false, "x": 10, "msg": "3. let p: *mut i32 = r; → verem [x, r, p], x = 10", "line": 3}, {"prog": "pos", "i": 3, "stack": ["x", "r", "p"], "removed": [], "ub": false, "x": 11, "msg": "4. unsafe { *p += 1 }; → verem [x, r, p], x = 11", "line": 4}, {"prog": "pos", "i": 4, "stack": ["x", "r"], "removed": ["p"], "ub": false, "x": 12, "msg": "5. *r += 1; → verem [x, r], x = 12; az írás lepattintja a fölötte lévő címkéket: p", "line": 5}], "neg": [{"prog": "neg", "i": 0, "stack": ["x"], "removed": [], "ub": false, "x": 10, "msg": "1. let mut x = 10; → verem [x], x = 10", "line": 8}, {"prog": "neg", "i": 1, "stack": ["x", "r"], "removed": [], "ub": false, "x": 10, "msg": "2. let r: &mut i32 = &mut x; → verem [x, r], x = 10", "line": 9}, {"prog": "neg", "i": 2, "stack": ["x", "r", "p"], "removed": [], "ub": false, "x": 10, "msg": "3. let p: *mut i32 = r; → verem [x, r, p], x = 10", "line": 10}, {"prog": "neg", "i": 3, "stack": ["x", "r"], "removed": ["p"], "ub": false, "x": 11, "msg": "4. *r += 1; → verem [x, r], x = 11; az írás lepattintja a fölötte lévő címkéket: p", "line": 11}, {"prog": "neg", "i": 4, "stack": ["x", "r"], "removed": [], "ub": true, "x": 11, "msg": "5. unsafe { *p += 1 }; → a p címke nincs a veremben: UB. Miri: „error: Undefined Behavior: attempting a read access using <338> at alloc…, but that tag does not exist in the borrow stack for this location”", "line": 12}]};
const KIND = {x: "Unique", r: "Unique", p: "SharedRW"};
function render(s){
  svg.setAttribute("viewBox", "0 0 620 300"); svg.innerHTML = "";
  el("text", {x: 20, y: 26, "font-size": 15, "font-weight": "bold"}, s.prog === "pos" ? "Pozitív példa (helyes)" : "Negatív példa (UB Miri alatt)");
  el("text", {x: 40, y: 56, "font-size": 12, fill: css("--muted")}, "x borrow stackje (alul a verem alja)");
  const items = s.stack.map(t => [t, false]).concat(s.removed.map(t => [t, true]));
  items.forEach((it, j) => {
    const t = it[0], gone = it[1], y = 220 - j * 48;
    el("rect", {x: 40, y, width: 220, height: 40, fill: gone ? css("--bg") : (t === "p" ? css("--cell") : css("--cellhl")), stroke: css("--line"), "stroke-width": t === "p" && !gone ? 2.5 : 1.5, "stroke-dasharray": gone ? "6 4" : (t === "p" ? "2 3" : "")});
    el("text", {x: 150, y: y + 26, "text-anchor": "middle", "font-size": 14}, `${t} (${KIND[t]})` + (gone ? " – lekerül" : ""));
    if (gone) el("line", {x1: 48, x2: 252, y1: y + 21, y2: y + 21, stroke: css("--hl2"), "stroke-width": 2.5});
  });
  el("line", {x1: 30, x2: 270, y1: 266, y2: 266, stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 330, y: 56, "font-size": 12, fill: css("--muted")}, "x memóriacellája");
  el("rect", {x: 330, y: 70, width: 90, height: 60, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 375, y: 110, "text-anchor": "middle", "font-size": 26, "font-weight": "bold"}, String(s.x));
  if (s.ub){
    el("rect", {x: 310, y: 150, width: 290, height: 110, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 4});
    el("text", {x: 455, y: 185, "text-anchor": "middle", "font-size": 16, "font-weight": "bold", fill: css("--hl2")}, "UB");
    el("text", {x: 455, y: 210, "text-anchor": "middle", "font-size": 12}, "a p címke nincs a borrow stackben:");
    el("text", {x: 455, y: 230, "text-anchor": "middle", "font-size": 12}, "„tag does not exist in the");
    el("text", {x: 455, y: 248, "text-anchor": "middle", "font-size": 12}, "borrow stack for this location”");
  }
}
function setProg(m){ document.getElementById("bP").setAttribute("aria-pressed", m === "pos"); document.getElementById("bN").setAttribute("aria-pressed", m === "neg"); setSteps(ALTS[m]); }
document.getElementById("bP").onclick = () => setProg("pos");
document.getElementById("bN").onclick = () => setProg("neg");


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
