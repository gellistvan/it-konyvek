<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lusta iterátorlánc húzó modellje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" onchange="noConsumer(this.checked)"> fogyasztó nélkül (nincs collect)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy oszlop: iter, map, filter, collect. A collect next() hívást küld a filternek, az a mapnak, az az iternek; a Some érték visszafelé halad. Az eldobott elem után a filter újra a mapet hívja. Eredmény: [6, 8, 10, 12], hét iter.next() hívás."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított lépéssor, nem mérés; az eseménysorrend egy naplózó Rust-programmal ellenőrzött (rustc 1.99.1). v = [1, 2, 3, 4, 5, 6].</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"active": "collect", "kind": "call", "src": "collect", "dst": "filter", "label": "next()", "stack": ["collect"], "out": [], "line": 3, "msg": "A collect elkéri az első elemet: filter.next()"}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&1)", "stack": ["collect", "filter", "map", "iter"], "out": [], "line": 0, "msg": "iter.next() = Some(&1)", "elem": 1}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(2)", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map closure-je: 1 * 2 = 2 → Some(2)", "elem": 1}, {"active": "filter", "kind": "drop", "src": "filter", "dst": "filter", "label": "2 > 5 hamis", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter: 2 > 5 hamis → eldobja, és ugyanabban a next()-ben újra map.next()-et hív", "elem": 1, "dropped": 2}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&2)", "stack": ["collect", "filter", "map", "iter"], "out": [], "line": 0, "msg": "iter.next() = Some(&2)", "elem": 2}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(4)", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map closure-je: 2 * 2 = 4 → Some(4)", "elem": 2}, {"active": "filter", "kind": "drop", "src": "filter", "dst": "filter", "label": "4 > 5 hamis", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter: 4 > 5 hamis → eldobja, és ugyanabban a next()-ben újra map.next()-et hív", "elem": 2, "dropped": 4}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&3)", "stack": ["collect", "filter", "map", "iter"], "out": [], "line": 0, "msg": "iter.next() = Some(&3)", "elem": 3}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(6)", "stack": ["collect", "filter", "map"], "out": [], "line": 1, "msg": "A map closure-je: 3 * 2 = 6 → Some(6)", "elem": 3}, {"active": "filter", "kind": "ret", "src": "filter", "dst": "collect", "label": "Some(6)", "stack": ["collect", "filter"], "out": [], "line": 2, "msg": "A filter: 6 > 5 igaz → Some(6) a collectnek", "elem": 3}, {"active": "collect", "kind": "push", "src": "collect", "dst": "collect", "label": "push(6)", "stack": ["collect"], "out": [6], "line": 3, "msg": "A collect eltárolja: [6]; jön a következő filter.next()", "elem": 3}, {"active": "collect", "kind": "call", "src": "collect", "dst": "filter", "label": "next()", "stack": ["collect"], "out": [6], "line": 3, "msg": "A collect a következő elemet kéri: filter.next()"}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [6], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [6], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&4)", "stack": ["collect", "filter", "map", "iter"], "out": [6], "line": 0, "msg": "iter.next() = Some(&4)", "elem": 4}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(8)", "stack": ["collect", "filter", "map"], "out": [6], "line": 1, "msg": "A map closure-je: 4 * 2 = 8 → Some(8)", "elem": 4}, {"active": "filter", "kind": "ret", "src": "filter", "dst": "collect", "label": "Some(8)", "stack": ["collect", "filter"], "out": [6], "line": 2, "msg": "A filter: 8 > 5 igaz → Some(8) a collectnek", "elem": 4}, {"active": "collect", "kind": "push", "src": "collect", "dst": "collect", "label": "push(8)", "stack": ["collect"], "out": [6, 8], "line": 3, "msg": "A collect eltárolja: [6, 8]; jön a következő filter.next()", "elem": 4}, {"active": "collect", "kind": "call", "src": "collect", "dst": "filter", "label": "next()", "stack": ["collect"], "out": [6, 8], "line": 3, "msg": "A collect a következő elemet kéri: filter.next()"}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [6, 8], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [6, 8], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&5)", "stack": ["collect", "filter", "map", "iter"], "out": [6, 8], "line": 0, "msg": "iter.next() = Some(&5)", "elem": 5}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(10)", "stack": ["collect", "filter", "map"], "out": [6, 8], "line": 1, "msg": "A map closure-je: 5 * 2 = 10 → Some(10)", "elem": 5}, {"active": "filter", "kind": "ret", "src": "filter", "dst": "collect", "label": "Some(10)", "stack": ["collect", "filter"], "out": [6, 8], "line": 2, "msg": "A filter: 10 > 5 igaz → Some(10) a collectnek", "elem": 5}, {"active": "collect", "kind": "push", "src": "collect", "dst": "collect", "label": "push(10)", "stack": ["collect"], "out": [6, 8, 10], "line": 3, "msg": "A collect eltárolja: [6, 8, 10]; jön a következő filter.next()", "elem": 5}, {"active": "collect", "kind": "call", "src": "collect", "dst": "filter", "label": "next()", "stack": ["collect"], "out": [6, 8, 10], "line": 3, "msg": "A collect a következő elemet kéri: filter.next()"}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [6, 8, 10], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [6, 8, 10], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "Some(&6)", "stack": ["collect", "filter", "map", "iter"], "out": [6, 8, 10], "line": 0, "msg": "iter.next() = Some(&6)", "elem": 6}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "Some(12)", "stack": ["collect", "filter", "map"], "out": [6, 8, 10], "line": 1, "msg": "A map closure-je: 6 * 2 = 12 → Some(12)", "elem": 6}, {"active": "filter", "kind": "ret", "src": "filter", "dst": "collect", "label": "Some(12)", "stack": ["collect", "filter"], "out": [6, 8, 10], "line": 2, "msg": "A filter: 12 > 5 igaz → Some(12) a collectnek", "elem": 6}, {"active": "collect", "kind": "push", "src": "collect", "dst": "collect", "label": "push(12)", "stack": ["collect"], "out": [6, 8, 10, 12], "line": 3, "msg": "A collect eltárolja: [6, 8, 10, 12]", "elem": 6}, {"active": "filter", "kind": "call", "src": "filter", "dst": "map", "label": "next()", "stack": ["collect", "filter"], "out": [6, 8, 10, 12], "line": 2, "msg": "A filter elemet kér: map.next()"}, {"active": "map", "kind": "call", "src": "map", "dst": "iter", "label": "next()", "stack": ["collect", "filter", "map"], "out": [6, 8, 10, 12], "line": 1, "msg": "A map elemet kér: iter.next()"}, {"active": "iter", "kind": "ret", "src": "iter", "dst": "map", "label": "None", "stack": ["collect", "filter", "map", "iter"], "out": [6, 8, 10, 12], "line": 0, "msg": "iter.next() = None (7. hívás): a forrás kimerült"}, {"active": "map", "kind": "ret", "src": "map", "dst": "filter", "label": "None", "stack": ["collect", "filter", "map"], "out": [6, 8, 10, 12], "line": 1, "msg": "A map továbbadja: None"}, {"active": "filter", "kind": "ret", "src": "filter", "dst": "collect", "label": "None", "stack": ["collect", "filter"], "out": [6, 8, 10, 12], "line": 2, "msg": "A filter továbbadja: None"}, {"active": "collect", "kind": "done", "src": "collect", "dst": "collect", "label": "kész", "stack": ["collect"], "out": [6, 8, 10, 12], "line": 3, "msg": "A collect leáll: [6, 8, 10, 12]; iter.next() összesen 7-szer hívódott"}];
const CODE = ["v.iter()                 // Iter<'_, i32>: &i32 elemek", "    .map(|x| x * 2)      // i32", "    .filter(|x| *x > 5)  // a predikátum &i32-t kap", "    .collect::<Vec<_>>() // fogyasztó: ő hívja a next()-et"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const COLS = ["iter", "map", "filter", "collect"], HEAD = {iter: "iter()", map: "map(|x| x * 2)", filter: "filter(|x| *x > 5)", collect: "collect()"};
let FULL = null;
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330");
  svg.innerHTML = "";
  const X = c => 95 + COLS.indexOf(c) * 190, y0 = 40, yA = 150;
  COLS.forEach(c => {
    const on = s.active === c && s.kind !== "none";
    el("rect", {x: X(c) - 80, y: y0, width: 160, height: 44, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.3});
    el("text", {x: X(c), y: y0 + 27, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, HEAD[c]);
    el("line", {x1: X(c), y1: y0 + 44, x2: X(c), y2: 230, stroke: css("--muted"), "stroke-dasharray": "2 4"});
  });
  if (s.kind === "call" || s.kind === "ret") {
    const x0 = X(s.src), x1 = X(s.dst), dir = Math.sign(x1 - x0), col = css("--hl");
    el("line", {x1: x0, y1: yA, x2: x1 - dir * 10, y2: yA, stroke: col, "stroke-width": 3, "stroke-dasharray": s.kind === "ret" ? "8 5" : ""});
    el("path", {d: `M${x1},${yA} L${x1 - dir*12},${yA - 6} L${x1 - dir*12},${yA + 6} Z`, fill: col});
    el("text", {x: (x0 + x1)/2, y: yA - 10, "text-anchor": "middle", "font-size": 15, "font-family": "monospace", "font-weight": "bold"}, s.label);
    el("text", {x: (x0 + x1)/2, y: yA + 24, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, s.kind === "call" ? "hívás (lefelé a forrás felé)" : "visszatérés");
  } else if (s.kind === "drop") {
    const x = X("filter");
    el("rect", {x: x - 70, y: yA - 18, width: 140, height: 32, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": "6 4"});
    el("text", {x, y: yA + 4, "text-anchor": "middle", "font-size": 15, "text-decoration": "line-through"}, s.label);
    el("text", {x, y: yA + 34, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "eldobva → újra map.next()");
  } else if (s.kind === "push" || s.kind === "done") {
    const x = X("collect");
    el("rect", {x: x - 70, y: yA - 18, width: 140, height: 32, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x, y: yA + 4, "text-anchor": "middle", "font-size": 15, "font-family": "monospace"}, s.label);
  }
  el("text", {x: 10, y: 268, "font-size": 13}, "hívásverem: " + (s.stack.length ? s.stack.join(" → ") + ".next()" : "üres (nincs fogyasztó)"));
  el("text", {x: 10, y: 296, "font-size": 13}, "gyűjtött Vec: [" + s.out.join(", ") + "]");
  const cnt = STEPS.slice(0, k + 1).filter(t => t.kind === "call" && t.dst === "iter").length;
  el("text", {x: 10, y: 322, "font-size": 13}, "iter.next() hívások eddig: " + cnt);
}
function noConsumer(on){ if (!FULL) FULL = STEPS; setSteps(on ? NOCONS : FULL); }
const NOCONS = [{"active": "collect", "kind": "none", "src": "collect", "dst": "collect", "label": "", "stack": [], "out": [], "line": -1, "msg": "Fogyasztó nélkül: a lánc csak egy leírás, egyetlen next() sem fut – 0 elem feldolgozva."}];


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
