<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibalánc: kontextus és source()</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>.outpre{margin:2px 0 8px;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}.seg{font:inherit;padding:0 2px;margin:0;border:1px solid transparent;background:none;color:inherit;cursor:pointer;text-align:left;white-space:pre-wrap}.seg:hover,.seg:focus{border-color:var(--muted)}.seg.on{outline:2px solid var(--hl);font-weight:bold}#out{width:100%}</style><fieldset style="border:0;padding:0;margin:0"><legend class="small">Kiírás formázása:</legend><label><input type="radio" name="fmt" value="e" data-lab="println!(&quot;{e}&quot;): csak a legfelső réteg" onchange="setFmt(this.value)"> {e}</label> <label><input type="radio" name="fmt" value="alt" data-lab="println!(&quot;{e:#}&quot;): a lánc egy sorban, „: ” elválasztással" onchange="setFmt(this.value)"> {e:#}</label> <label><input type="radio" name="fmt" value="dbg" checked data-lab="{e:?} (a main ezt írja ki „Error: ” előtaggal)" onchange="setFmt(this.value)"> {e:?}</label></fieldset><div id="out" aria-label="A program kimenete; a sorok kattinthatók"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két oszlop: nincs.txt esetén anyhow kontextus és alatta io::Error; rossz.txt esetén kontextus, alatta rkv_core::Error::InvalidCommand, és annak String mezője."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kimenetek a fejezet futtatásából és egy rögzített ellenőrző futásból (anyhow 1.0.104, Rust 1.99.1) származnak; az „os error 2” szövege rendszerfüggő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": -1, "line": -1, "msg": "Kattints a kimenet egy sorára (vagy lépj), és kiemelődik a hozzá tartozó réteg és kódsor. A formázást a kapcsolóval válthatod."}, {"i": 0, "line": 2, "msg": "A) anyhow::Error – kontextus: „a(z) nincs.txt parancsfájl olvasása” – létrehozta: .with_context(|| format!(…))"}, {"i": 1, "line": 1, "msg": "A) std::io::Error: „No such file or directory (os error 2)” – létrehozta: std::fs::read_to_string(path)"}, {"i": 2, "line": 9, "msg": "B) anyhow::Error – kontextus: „rossz.txt:2” – létrehozta: .with_context(|| format!(\"{}:{}\", …))"}, {"i": 3, "line": 8, "msg": "B) rkv_core::Error::InvalidCommand: „érvénytelen parancs: invalid key: \"name extra\"” – létrehozta: .map_err(Error::InvalidCommand)"}, {"i": 4, "line": 7, "msg": "B) String (a parse_command hibája): „invalid key: \"name extra\"” – létrehozta: parse_command(line)"}];
const CODE = ["fn run_script(store: &mut Store, path: &Path) -> Result<()> {", "    let text = std::fs::read_to_string(path)", "        .with_context(|| format!(\"a(z) {} parancsfájl olvasása\", path.display()))?;", "    for (index, line) in text.lines().enumerate() {", "        if line.is_empty() {", "            continue;", "        }", "        let command = parse_command(line)", "            .map_err(Error::InvalidCommand)", "            .with_context(|| format!(\"{}:{}\", path.display(), index + 1))?;", "        println!(\"{}\", execute(store, command));", "    }", "    Ok(())", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAY = [{"col": 0, "row": 0, "kind": "ctx", "typ": "anyhow::Error – kontextus", "msg": "a(z) nincs.txt parancsfájl olvasása", "call": ".with_context(|| format!(…))", "line": 2, "out": "Error: a(z) nincs.txt parancsfájl olvasása"}, {"col": 0, "row": 1, "kind": "std", "typ": "std::io::Error", "msg": "No such file or directory (os error 2)", "call": "std::fs::read_to_string(path)", "line": 1, "out": "Caused by: No such file or directory (os error 2)"}, {"col": 1, "row": 0, "kind": "ctx", "typ": "anyhow::Error – kontextus", "msg": "rossz.txt:2", "call": ".with_context(|| format!(\"{}:{}\", …))", "line": 9, "out": "Error: rossz.txt:2"}, {"col": 1, "row": 1, "kind": "enum", "typ": "rkv_core::Error::InvalidCommand", "msg": "érvénytelen parancs: invalid key: \"name extra\"", "call": ".map_err(Error::InvalidCommand)", "line": 8, "out": "Caused by: érvénytelen parancs: invalid key: \"name extra\""}, {"col": 1, "row": 2, "kind": "payload", "typ": "String (a parse_command hibája)", "msg": "invalid key: \"name extra\"", "call": "parse_command(line)", "line": 7, "out": "(a variáns mezője, nincs source)"}];
const OUTS = {"e": {"A": [[["a(z) nincs.txt parancsfájl olvasása", 1]]], "B": [[["rossz.txt:2", 3]]]}, "alt": {"A": [[["a(z) nincs.txt parancsfájl olvasása", 1], [": ", -1], ["No such file or directory (os error 2)", 2]]], "B": [[["rossz.txt:2", 3], [": ", -1], ["érvénytelen parancs: invalid key: \"name extra\"", 4]]]}, "dbg": {"A": [[["Error: a(z) nincs.txt parancsfájl olvasása", 1]], [], [["Caused by:", -1]], [["    No such file or directory (os error 2)", 2]]], "B": [[["Error: rossz.txt:2", 3]], [], [["Caused by:", -1]], [["    érvénytelen parancs: invalid key: \"name extra\"", 4]]]}};
let FMT = "dbg";
function render(s){
  svg.setAttribute("viewBox", "0 0 760 330");
  svg.innerHTML = "";
  const W = 350, H = 70, G = 34, X = [10, 400], T = 40;
  el("text", {x: X[0] + W/2, y: 22, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "A) --script nincs.txt");
  el("text", {x: X[1] + W/2, y: 22, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "B) --script rossz.txt");
  const dash = {ctx: "3 3", enum: "", std: "", payload: "7 4"};
  const fill = {ctx: css("--cell"), enum: css("--cell"), std: css("--cellhl"), payload: css("--cell")};
  LAY.forEach((L, i) => {
    const x = X[L.col], y = T + L.row * (H + G), on = (s.i === i + 1);
    el("rect", {x, y, width: W, height: H, rx: 8, fill: fill[L.kind], stroke: on ? css("--hl") : css("--line"),
                "stroke-width": on ? 4 : 1.4, "stroke-dasharray": dash[L.kind]});
    if (L.kind === "enum") for (let q = 0; q < W; q += 14) el("line", {x1: x + q, y1: y + H, x2: Math.min(x + q + 10, x + W), y2: y + H - 6, stroke: css("--muted"), "stroke-width": 1});
    el("text", {x: x + 10, y: y + 20, "font-size": 13, "font-weight": "bold"}, L.typ);
    el("text", {x: x + 10, y: y + 40, "font-size": 12.5}, "„" + L.msg + "”");
    el("text", {x: x + 10, y: y + 60, "font-size": 12, "font-family": "ui-monospace,monospace", fill: css("--muted")}, "létrehozta: " + L.call);
  });
  [[0, 0], [1, 0]].forEach(([c, r]) => {
    const x = X[c] + W/2, y1 = T + r*(H+G) + H, y2 = y1 + G;
    el("line", {x1: x, y1: y1 + 2, x2: x, y2: y2 - 6, stroke: css("--line"), "stroke-width": 2});
    el("path", {d: `M${x-5},${y2-10} L${x+5},${y2-10} L${x},${y2-2} Z`, fill: css("--line")});
    el("text", {x: x + 8, y: y1 + G/2 + 4, "font-size": 12, "font-family": "ui-monospace,monospace"}, "source()");
  });
  { const x = X[1] + W/2, y1 = T + H + G + H, y2 = y1 + G;
    el("line", {x1: x, y1: y1 + 2, x2: x, y2: y2 - 4, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": "5 4"});
    el("text", {x: x + 8, y: y1 + G/2 + 4, "font-size": 12}, "String mező, source() = None"); }
  el("text", {x: X[0] + W/2, y: T + H + G + H + 22, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "source() = None → a lánc vége");
  el("text", {x: X[0] + W/2, y: T + 2*(H+G) + 30, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "kontextus = mit csináltunk · source() = mi romlott el");
  drawOut(s);
}
function drawOut(s){
  const box = document.getElementById("out");
  if (!box) return;
  box.innerHTML = "";
  ["A", "B"].forEach(key => {
    const h = document.createElement("div"); h.className = "small";
    h.textContent = (key === "A" ? "A) nincs.txt" : "B) rossz.txt") + " – " + document.querySelector('input[name=fmt]:checked').dataset.lab;
    box.appendChild(h);
    const pre = document.createElement("pre"); pre.className = "outpre";
    OUTS[FMT][key].forEach(line => {
      const row = document.createElement("div");
      if (!line.length) row.innerHTML = "&nbsp;";
      line.forEach(([t, st]) => {
        if (st < 0) { row.appendChild(document.createTextNode(t)); return; }
        const b = document.createElement("button"); b.type = "button"; b.className = "seg" + (s.i === st ? " on" : "");
        b.textContent = t; b.title = "A réteg kiemelése"; b.onclick = () => show(st);
        row.appendChild(b);
      });
      pre.appendChild(row);
    });
    box.appendChild(pre);
  });
}
function setFmt(f){ FMT = f; show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
