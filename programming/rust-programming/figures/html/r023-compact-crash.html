<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A compact és az összeomlás utáni helyreállítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="crash" onclick="crashHere()">⚡ Összeomlás itt</button><button onclick="noCrash();show(k)">Vissza a lépéshez</button><script>["first","prev","next","pos"].forEach(id=>document.getElementById(id).addEventListener("click",noCrash));document.getElementById("pos").addEventListener("input",()=>{noCrash();show(k);});document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){noCrash();show(k);}});</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A compact öt lépése: kiinduló állapot, .tmp írása és sync_all, rename, könyvtár sync_all, a napló csonkolása. Bármelyik lépés után összeomolva az újranyitás a snapshotot betölti és a naplót visszajátssza; a végeredmény mindig {b:2}."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés: Linux, helyi POSIX-fájlrendszer (ext4, XFS) a fejezet tartóssági modellje szerint. Szaggatott keret = csak lapgyorsítótárban (áramkimaradáskor elveszhet).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"title": "0. kiinduló állapot", "op": "", "line": 0, "snap": ["{a:1}", true], "tmp": null, "log": [["Set b=2", "Delete a"], true], "res": [{"label": "state.json = {a:1}, teljes napló", "trace": [["snapshot betöltése", "{a:1}"], ["Set b=2", "{a:1, b:2}"], ["Delete a", "{b:2}"]]}], "msg": "0. kiinduló állapot. Memória: data = {b:2}. Nyomd meg az „Összeomlás itt” gombot az újranyitás visszajátszásához."}, {"title": "1. .tmp írása + sync_all", "op": "File::create, to_writer, sync_all", "line": 5, "snap": ["{a:1}", true], "tmp": ["{b:2}", true], "log": [["Set b=2", "Delete a"], true], "res": [{"label": "state.json = {a:1} (a .tmp-t az open nem olvassa)", "trace": [["snapshot betöltése", "{a:1}"], ["Set b=2", "{a:1, b:2}"], ["Delete a", "{b:2}"]]}], "msg": "1. .tmp írása + sync_all – File::create, to_writer, sync_all. Memória: data = {b:2}. Nyomd meg az „Összeomlás itt” gombot az újranyitás visszajátszásához."}, {"title": "2. rename", "op": "fs::rename(.tmp → state.json)", "line": 6, "snap": ["{b:2}", false], "tmp": null, "log": [["Set b=2", "Delete a"], true], "res": [{"label": "a csere nem tartós: régi {a:1}", "trace": [["snapshot betöltése", "{a:1}"], ["Set b=2", "{a:1, b:2}"], ["Delete a", "{b:2}"]]}, {"label": "vagy már az új {b:2}", "trace": [["snapshot betöltése", "{b:2}"], ["Set b=2", "{b:2}"], ["Delete a", "{b:2}"]]}], "msg": "2. rename – fs::rename(.tmp → state.json). Memória: data = {b:2}. Nyomd meg az „Összeomlás itt” gombot az újranyitás visszajátszásához."}, {"title": "3. könyvtár sync_all", "op": "sync_parent_dir", "line": 7, "snap": ["{b:2}", true], "tmp": null, "log": [["Set b=2", "Delete a"], true], "res": [{"label": "state.json = {b:2}, teljes napló", "trace": [["snapshot betöltése", "{b:2}"], ["Set b=2", "{b:2}"], ["Delete a", "{b:2}"]]}], "msg": "3. könyvtár sync_all – sync_parent_dir. Memória: data = {b:2}. Nyomd meg az „Összeomlás itt” gombot az újranyitás visszajátszásához."}, {"title": "4. set_len(0) + sync_all", "op": "log.set_len(0); log.sync_all()", "line": 13, "snap": ["{b:2}", true], "tmp": null, "log": [[], true], "res": [{"label": "state.json = {b:2}, üres napló", "trace": [["snapshot betöltése", "{b:2}"]]}, {"label": "sync_all előtt: még a teljes napló", "trace": [["snapshot betöltése", "{b:2}"], ["Set b=2", "{b:2}"], ["Delete a", "{b:2}"]]}], "msg": "4. set_len(0) + sync_all – log.set_len(0); log.sync_all(). Memória: data = {b:2}. Nyomd meg az „Összeomlás itt” gombot az újranyitás visszajátszásához."}];
const CODE = ["pub fn save_snapshot(&mut self) -> Result<()> {", "    self.ensure_healthy()?;", "    let tmp_path = sibling(&self.snapshot_path, \".tmp\");", "    let file = File::create(&tmp_path)?;", "    serde_json::to_writer(&mut writer, &Snapshot { data: self.data.clone() })?;", "    writer.get_ref().sync_all()?; // 1. az új tartalom a lemezen van", "    fs::rename(&tmp_path, &self.snapshot_path)?; // 2. atomikus csere", "    sync_parent_dir(&self.snapshot_path)?; // 3. maga a csere is tartós", "    Ok(())", "}", "pub fn compact(&mut self) -> Result<()> {", "    self.save_snapshot()?; // 1–3. lépés: az új snapshot tartós", "    let log = self.log_writer.get_mut();", "    log.set_len(0)?; log.sync_all()?; // 4. csak ezután dobható el a napló", "    Ok(())", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CRASH = false, RP = 0, rtimer = null;
function rmax(s){ return s.res.reduce((a, v) => a + v.trace.length, 0); }
function crashHere(){
  CRASH = true; RP = 0; if (rtimer) clearInterval(rtimer);
  const s = STEPS[k];
  rtimer = setInterval(() => { RP++; if (RP >= rmax(s)) { clearInterval(rtimer); rtimer = null; } render(STEPS[k]); }, 650);
  status.textContent = "Összeomlás itt: " + s.title + ". Újranyitás: a snapshot betöltése, majd a naplósorok visszajátszása; minden lehetséges lemezállapotból {b:2} adódik.";
  render(s);
}
function noCrash(){ CRASH = false; if (rtimer) { clearInterval(rtimer); rtimer = null; } }
function fileBox(x, y, w, h, title, lines, durable, gone){
  el("text", {x: x + w/2, y: y - 8, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, title);
  if (gone) { el("text", {x: x + w/2, y: y + h/2 + 5, "text-anchor": "middle", "font-size": 14, fill: css("--muted")}, "— (nincs)"); return; }
  el("rect", {x, y, width: w, height: h, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": durable ? 2.4 : 1.6, "stroke-dasharray": durable ? "" : "8 5"});
  lines.forEach((t, i) => el("text", {x: x + w/2, y: y + 26 + i*20, "text-anchor": "middle", "font-size": 14, "font-family": "monospace"}, t));
  el("text", {x: x + w/2, y: y + h - 8, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, durable ? "tartós" : "nem tartós");
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 380");
  svg.innerHTML = "";
  el("text", {x: 10, y: 22, "font-size": 15, "font-weight": "bold"}, s.title + (s.op ? "  (" + s.op + ")" : ""));
  const y = 58, h = 92;
  el("text", {x: 85, y: y - 8, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "data (memória)");
  el("rect", {x: 20, y, width: 130, height: h, rx: 6, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.4});
  el("text", {x: 85, y: y + 50, "text-anchor": "middle", "font-size": 15, "font-family": "monospace"}, "{b:2}");
  fileBox(180, y, 170, h, "state.json", [s.snap[0]], s.snap[1], false);
  fileBox(370, y, 170, h, "state.json.tmp", s.tmp ? [s.tmp[0]] : [], true, !s.tmp);
  fileBox(560, y, 180, h, "append.log", s.log[0].length ? s.log[0] : ["[] (üres)"], s.log[1], false);
  el("line", {x1: 10, y1: 170, x2: 750, y2: 170, stroke: css("--muted"), "stroke-width": 1});
  if (!CRASH) {
    el("text", {x: 380, y: 230, "text-anchor": "middle", "font-size": 14, fill: css("--muted")}, "Összeomlás itt → a lemezen maradó állapot és az újranyitás visszajátszása");
    return;
  }
  el("text", {x: 10, y: 194, "font-size": 14, "font-weight": "bold"}, "Összeomlás után újranyitás (FileStore::open + replay_log):");
  let shown = 0, yy = 220;
  s.res.forEach(v => {
    el("text", {x: 20, y: yy, "font-size": 13}, "• " + v.label);
    let x = 40; yy += 26;
    v.trace.forEach(([op, st], i) => {
      if (shown++ > RP) return;
      const lab = (i === 0 ? "" : "▸ " + op + " → ") + st, w = 14 + lab.length * 7.6;
      el("rect", {x, y: yy - 17, width: w, height: 24, rx: 4, fill: css("--cell"), stroke: css("--line"), "stroke-width": i === v.trace.length - 1 ? 2.4 : 1});
      el("text", {x: x + 7, y: yy, "font-size": 13, "font-family": "monospace"}, lab);
      x += w + 8;
    });
    yy += 34;
  });
  if (RP >= rmax(s) - 1) el("text", {x: 740, y: 370, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, "végeredmény minden ágon: {b:2}");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
