<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teljes határidő és inaktivitási időkorlát</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--err:#b00000;--ok:#1e6b2e;--band:#d6e4f0}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--err:#ff7b7b;--ok:#7fd08f;--band:#24425f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.ctl label{white-space:nowrap}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:140px;vertical-align:middle}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
pre#code{margin:8px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body data-selftest="?">
<div class="ctl" role="group" aria-label="Paraméterek és lejátszás">
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="reset" title="Az időkurzor vissza 0-ra">⏮ 0 ms</button>
  <label>idő <input id="t" type="range" min="0" max="450" step="5" value="0" aria-label="Időkurzor (ms)"> <span id="tv">0</span> ms</label>
</div>
<div class="ctl" role="group" aria-label="Modellparaméterek">
  <label>termelési periódus <input id="p" type="range" min="5" max="200" step="5" value="10"> <span id="pv">10</span> ms</label>
  <label>határidő <input id="d" type="range" min="50" max="450" step="10" value="300"> <span id="dv">300</span> ms</label>
  <label>idle-timeout <input id="i" type="range" min="20" max="300" step="10" value="100"> <span id="iv">100</span> ms</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 820 330" role="img" aria-label="A pinelt határidő 300 ms-nál leállítja a fogyasztót a folyamatos termelés ellenére; az újraindított 100 ms-os sleep sosem jár le, amíg 10 ms-onként jön üzenet."></svg>
<pre id="code" aria-label="Kód"></pre>
<p class="small">A 17.3.8 tesztjének modellje: a termelő 0–400 ms között küld, 400 ms-nál a tx eldobásával lezárja a csatornát. Modell, nem mérés; a valódi leállás a tesztekben 290–450 ms közé esik.</p>
<script>
const END = 400, AXIS = 450, EXPECT_ = {"5/100/50": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/100/100": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/100/150": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/300/50": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/300/100": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/300/150": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "5/450/50": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "5/450/100": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "5/450/150": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "10/100/50": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/100/100": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/100/150": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/300/50": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/300/100": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/300/150": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "10/450/50": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "10/450/100": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "10/450/150": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "20/100/50": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/100/100": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/100/150": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/300/50": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/300/100": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/300/150": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "20/450/50": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "20/450/100": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "20/450/150": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "50/100/50": [100, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "50/100/100": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "50/100/150": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "50/300/50": [300, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "50/300/100": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "50/300/150": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "50/450/50": [400, "csatorna lezárult (recv → None)", 50, "inaktivitási időkorlát lejárt"], "50/450/100": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "50/450/150": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "100/100/50": [100, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "100/100/100": [100, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "100/100/150": [100, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "100/300/50": [300, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "100/300/100": [300, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "100/300/150": [300, "határidő lejárt", 400, "csatorna lezárult (recv → None)"], "100/450/50": [400, "csatorna lezárult (recv → None)", 50, "inaktivitási időkorlát lejárt"], "100/450/100": [400, "csatorna lezárult (recv → None)", 100, "inaktivitási időkorlát lejárt"], "100/450/150": [400, "csatorna lezárult (recv → None)", 400, "csatorna lezárult (recv → None)"], "150/100/50": [100, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "150/100/100": [100, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "150/100/150": [100, "határidő lejárt", 150, "inaktivitási időkorlát lejárt"], "150/300/50": [300, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "150/300/100": [300, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "150/300/150": [300, "határidő lejárt", 150, "inaktivitási időkorlát lejárt"], "150/450/50": [400, "csatorna lezárult (recv → None)", 50, "inaktivitási időkorlát lejárt"], "150/450/100": [400, "csatorna lezárult (recv → None)", 100, "inaktivitási időkorlát lejárt"], "150/450/150": [400, "csatorna lezárult (recv → None)", 150, "inaktivitási időkorlát lejárt"], "200/100/50": [100, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "200/100/100": [100, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "200/100/150": [100, "határidő lejárt", 150, "inaktivitási időkorlát lejárt"], "200/300/50": [300, "határidő lejárt", 50, "inaktivitási időkorlát lejárt"], "200/300/100": [300, "határidő lejárt", 100, "inaktivitási időkorlát lejárt"], "200/300/150": [300, "határidő lejárt", 150, "inaktivitási időkorlát lejárt"], "200/450/50": [400, "csatorna lezárult (recv → None)", 50, "inaktivitási időkorlát lejárt"], "200/450/100": [400, "csatorna lezárult (recv → None)", 100, "inaktivitási időkorlát lejárt"], "200/450/150": [400, "csatorna lezárult (recv → None)", 150, "inaktivitási időkorlát lejárt"]};
function model(P, D, I){
  const msgs = []; for (let m = 0; m <= END; m += P) msgs.push(m);
  const close = END;
  let dStop, dReason;
  if (D <= close){ dStop = D; dReason = "határidő lejárt"; } else { dStop = close; dReason = "csatorna lezárult (recv → None)"; }
  let last = msgs[0], iStop = null, iReason = null;
  for (let k = 1; k < msgs.length; k++){
    const m = msgs[k];
    if (m - last >= I){ iStop = last + I; iReason = "inaktivitási időkorlát lejárt"; break; }
    last = m;
  }
  if (iStop === null){
    if (last + I <= close){ iStop = last + I; iReason = "inaktivitási időkorlát lejárt"; }
    else { iStop = close; iReason = "csatorna lezárult (recv → None)"; }
  }
  return {msgs, dStop, dReason, iStop, iReason, last, ghost: last + I};
}
// önellenőrzés: a JS-modell egyezik a Python-modellel (a statikus ábra forrásával)
(function(){
  let ok = true;
  for (const key in EXPECT_){
    const [p, d, i] = key.split("/").map(Number), r = model(p, d, i), e = EXPECT_[key];
    if (r.dStop !== e[0] || r.dReason !== e[1] || r.iStop !== e[2] || r.iReason !== e[3]) { ok = false; }
  }
  document.body.setAttribute("data-selftest", ok ? "ok" : "HIBA");
})();
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const X0 = 120, X1 = 790, xs = t => X0 + (X1 - X0) * Math.min(t, AXIS) / AXIS;
const $ = id => document.getElementById(id);
let cur = 0, timer = null;
function CODE(D, I){ return [
  `let deadline = sleep(Duration::from_millis(${D}));   // teljes határidő: egyszer jön létre`,
  "tokio::pin!(deadline);",
  "loop {",
  "    tokio::select! {",
  "        msg = rx.recv() => match msg { Some(_) => {}, None => break },  // lezárult",
  "        _ = &mut deadline => break,                                     // határidő",
  "    }",
  "}",
  "// inaktivitási időkorlát: a sleep minden iterációban újra létrejön",
  "loop {",
  "    tokio::select! {",
  "        msg = rx.recv() => match msg { Some(_) => {}, None => break },",
  `        _ = sleep(Duration::from_millis(${I})) => break,                // idle`,
  "    }",
  "}"]; }
function draw(){
  const P = +$("p").value, D = +$("d").value, I = +$("i").value, t = cur;
  $("pv").textContent = P; $("dv").textContent = D; $("iv").textContent = I; $("tv").textContent = t; $("t").value = t;
  const r = model(P, D, I), fg = css("--fg"), mu = css("--muted"), er = css("--err");
  svg.innerHTML = "";
  // tengely
  const ya = 300;
  el("line", {x1: X0, y1: ya, x2: X1, y2: ya, stroke: fg});
  for (let v = 0; v <= AXIS; v += 50){ el("line", {x1: xs(v), y1: ya, x2: xs(v), y2: ya + 5, stroke: fg}); el("text", {x: xs(v), y: ya + 20, "text-anchor": "middle", "font-size": 13}, String(v)); }
  el("text", {x: X1, y: ya + 20, "text-anchor": "end", "font-size": 13, fill: mu}, "");
  // üzenetek
  el("text", {x: 10, y: 40, "font-size": 14}, "üzenetek");
  for (const m of r.msgs) el("line", {x1: xs(m), y1: 26, x2: xs(m), y2: 50, stroke: m <= t ? fg : mu, "stroke-width": 1});
  el("line", {x1: xs(END), y1: 20, x2: xs(END), y2: 290, stroke: mu, "stroke-dasharray": "2 3"});
  el("text", {x: xs(END) + 4, y: 20, "font-size": 12, fill: mu}, "lezárás (400 ms)");
  // deadline sáv: hátralévő idő
  const yd0 = 80, yd1 = 160, sD = (yd1 - yd0) / Math.max(D, 1);
  el("text", {x: 10, y: 112, "font-size": 14}, "pinelt deadline");
  el("text", {x: 10, y: 130, "font-size": 12, fill: mu}, `${D} ms, abszolút`);
  el("polyline", {points: `${xs(0)},${yd0} ${xs(r.dStop)},${yd0 + r.dStop * sD}`, fill: "none", stroke: fg, "stroke-width": 2});
  el("line", {x1: xs(r.dStop), y1: yd0 - 6, x2: xs(r.dStop), y2: yd1 + 4, stroke: r.dReason.startsWith("határidő") ? er : fg, "stroke-width": 2});
  el("text", {x: xs(r.dStop) + 4, y: yd0 + 4, "font-size": 13, "font-weight": "bold", fill: r.dReason.startsWith("határidő") ? er : fg}, `leállás: ${r.dStop} ms`);
  // idle sáv: fűrészfog
  const yi0 = 190, yi1 = 270, sI = (yi1 - yi0) / Math.max(I, 1);
  el("text", {x: 10, y: 222, "font-size": 14}, "idle-timeout");
  el("text", {x: 10, y: 240, "font-size": 12, fill: mu}, `${I} ms, újraindul`);
  let pts = [];
  const ms = r.msgs.filter(m => m <= r.iStop);
  ms.forEach((m, k) => { const n = k + 1 < ms.length ? ms[k + 1] : r.iStop; pts.push(`${xs(m)},${yi0}`, `${xs(n)},${yi0 + (n - m) * sI}`); });
  el("polyline", {points: pts.join(" "), fill: "none", stroke: fg, "stroke-width": 1.5, "stroke-dasharray": "6 3"});
  const idleFired = r.iReason.startsWith("inaktivitási");
  if (!idleFired){
    const g1 = Math.min(AXIS, r.ghost);
    el("polyline", {points: `${xs(r.last)},${yi0} ${xs(g1)},${yi0 + (g1 - r.last) * sI}`, fill: "none", stroke: mu, "stroke-width": 1, "stroke-dasharray": "1 3"});
    el("text", {x: xs(r.iStop) - 6, y: yi1, "font-size": 12, fill: mu, "text-anchor": "end"}, `lezárás: normál vége (nullára csak ${r.ghost} ms-nál érne)`);
  }
  el("line", {x1: xs(r.iStop), y1: yi0 - 6, x2: xs(r.iStop), y2: yi1 + 4, stroke: idleFired ? er : fg, "stroke-width": 2});
  el("text", {x: xs(r.iStop) + 4, y: yi0 + 4, "font-size": 13, "font-weight": "bold", fill: idleFired ? er : fg}, `leállás: ${r.iStop} ms`);
  // időkurzor
  el("line", {x1: xs(t), y1: 18, x2: xs(t), y2: ya, stroke: css("--hl2"), "stroke-width": 2});
  // állapotsor
  const dRem = t < r.dStop ? D - t : "–";
  let lastMsg = 0; for (const m of r.msgs) if (m <= t) lastMsg = m;
  const iRem = t < r.iStop ? I - (t - lastMsg) : "–";
  const why = [];
  if (t >= r.dStop) why.push(`deadline-consumer: ${r.dReason} (${r.dStop} ms)`);
  if (t >= r.iStop) why.push(`idle-consumer: ${r.iReason} (${r.iStop} ms)`);
  $("status").textContent = `t = ${t} ms – deadline: ${dRem} ms van hátra; idle: ${iRem} ms van hátra; leállás oka: ${why.length ? why.join("; ") : "még fut"}`;
  // kód
  const lines = CODE(D, I), on = new Set();
  if (t >= r.dStop) on.add(r.dReason.startsWith("határidő") ? 5 : 4); else on.add(0);
  if (t >= r.iStop) on.add(idleFired ? 12 : 11); else on.add(12);
  $("code").innerHTML = lines.map((l, k) => `<span class="${on.has(k) ? "on" : ""}">${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("");
}
function stop(){ if (timer){ clearInterval(timer); timer = null; } $("play").textContent = "▶ Lejátszás"; }
$("play").onclick = () => { if (timer){ stop(); return; } if (cur >= AXIS) cur = 0; $("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { cur = Math.min(AXIS, cur + 5); draw(); if (cur >= AXIS) stop(); }, 60); };
$("reset").onclick = () => { stop(); cur = 0; draw(); };
$("t").oninput = () => { stop(); cur = +$("t").value; draw(); };
for (const id of ["p", "d", "i"]) $(id).oninput = () => draw();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
