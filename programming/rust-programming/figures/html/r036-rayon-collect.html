<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}

*{box-sizing:border-box}

<p class="small">Modell, nem mérés: a rayon adaptív felosztójának egyszerűsített átirata, seedelt véletlen feldolgozási idővel és lopással; a h0…h7 nem valódi hash. A „reduce” fülön a nem asszociatív kivonás eredménye a felosztási fától (ütemezéstől) függ, az összefűzésé nem.</p>

function MK_(key){
