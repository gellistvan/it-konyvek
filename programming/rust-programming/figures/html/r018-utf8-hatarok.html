<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTF-8 bájtok és karakterhatárok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
input[type=range]{flex:1;min-width:140px}
input[type=text]{font:14px ui-monospace,monospace;padding:2px 6px;min-width:12em}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:6px 0;min-height:3em;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;background:var(--code);padding:6px 8px}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="txt">Karakterlánc (Rust-escape: \u{301}):</label>
  <input id="txt" type="text" value="árvíz" aria-describedby="hint">
  <button id="apply">Alkalmaz</button>
  <button id="ex1" title="9.1.7 d) feladat">„éé”</button>
  <button id="ex2" title="kombináló ékezet">e\u{301}ab</button>
  <button id="ex0">árvíz</button>
</div>
<div class="ctl">
  <label for="a">a = <span id="av">0</span></label><input id="a" type="range" min="0" max="7" value="0">
  <label for="b">b = <span id="bv">2</span></label><input id="b" type="range" min="0" max="7" value="2">
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 260" role="img" aria-label="Az „árvíz” hét bájtja cellákban: C3 A1 | 72 | 76 | C3 AD | 7A, fölöttük a karakterek (á: 0–1, r: 2, v: 3, í: 4–5, z: 6); karakterhatár a 0, 2, 3, 4, 6, 7 bájtindexen, az 1 és 5 karakteren belül van. A 0..2 tartomány érvényes (Some(&quot;á&quot;)), a 0..1 nem (None, a &s[0..1] pánikol)."></svg>
<p id="hint" class="small">A csúszkák bájtindexek (0 … len). Folytonos vonal: karakterhatár; szaggatott + X: karakteren belül.
A pánikszövegek a rustc 1.99.1 formáját követik (sorrend: tartományon kívül, fordított tartomány, kezdő-, majd végindex).</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function mk(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function unesc(s){return s.replace(/\\u\{([0-9a-fA-F]{1,6})\}/g,(m,h)=>String.fromCodePoint(parseInt(h,16)));}
const EXT = /[\p{Mn}\p{Me}\p{Cc}]/u;
function chDbg(c, inStr){
  const e = {"\n":"\\n","\r":"\\r","\t":"\\t","\0":"\\0","\\":"\\\\"};
  if (c in e) return e[c];
  if (inStr && c === '"') return '\\"';
  if (!inStr && c === "'") return "\\'";
  if (EXT.test(c)) return "\\u{" + c.codePointAt(0).toString(16) + "}";
  return c;
}
function model(s){
  const enc = new TextEncoder(), chars = []; let i = 0;
  for (const c of s){ const n = enc.encode(c).length; chars.push([i, i + n, c]); i += n; }
  const bytes = Array.from(enc.encode(s)).map(x => x.toString(16).toUpperCase().padStart(2, "0"));
  const bounds = chars.map(c => c[0]).concat([bytes.length]);
  function owner(k){ return chars.find(c => c[0] < k && k < c[1]); }
  function slice(a, z){
    const n = bytes.length;
    if (a > n) return [null, `start byte index ${a} is out of bounds for string of length ${n}`];
    if (z > n) return [null, `end byte index ${z} is out of bounds for string of length ${n}`];
    if (a > z) return [null, `byte range starts at ${a} but ends at ${z}`];
    for (const [nm, k] of [["start", a], ["end", z]]){
      if (!bounds.includes(k)){ const o = owner(k);
        return [null, `${nm} byte index ${k} is not a char boundary; it is inside '${chDbg(o[2], false)}' (bytes ${o[0]}..${o[1]} of string)`]; }
    }
    const sub = chars.filter(c => c[0] >= a && c[1] <= z).map(c => chDbg(c[2], true)).join("");
    return ['Some("' + sub + '")', null];
  }
  return {chars, bytes, bounds, slice};
}
let M = model("árvíz");
const A = document.getElementById("a"), B = document.getElementById("b");
function draw(){
  const a = +A.value, z = +B.value, n = M.bytes.length;
  document.getElementById("av").textContent = a; document.getElementById("bv").textContent = z;
  const cw = Math.max(26, Math.min(78, 600 / Math.max(1, n))), x0 = 150, yc = 34, yb = 78;
  const W = Math.max(760, x0 + n * cw + 30);
  svg.setAttribute("viewBox", `0 0 ${W} 260`);
  svg.innerHTML = "";
  const d = mk("defs", {});
  d.innerHTML = `<pattern id="hd" patternUnits="userSpaceOnUse" width="8" height="8"><path d="M-2,10 L10,-2 M-2,2 L2,-2 M6,10 L10,6" stroke="${cv("--line")}" stroke-width="0.8"/></pattern>`;
  const xb = k => x0 + k * cw;
  mk("text", {x: 10, y: yc + 18, "font-weight": "bold", "dominant-baseline": "central"}, "karakterek");
  mk("text", {x: 10, y: yb + 22, "font-weight": "bold", "dominant-baseline": "central"}, "bájtok (hex)");
  mk("text", {x: 10, y: yb + 82, "font-weight": "bold", "dominant-baseline": "central"}, "bájthatárok");
  if (a <= n && z <= n && a < z)
    mk("rect", {x: xb(a), y: yb - 8, width: (z - a) * cw, height: 60, fill: "none", stroke: cv("--hl"), "stroke-width": 4});
  for (const [c0, c1, c] of M.chars){
    const multi = c1 - c0 > 1;
    mk("rect", {x: xb(c0), y: yc, width: (c1 - c0) * cw, height: 36, fill: cv("--cell"), stroke: cv("--line")});
    mk("text", {x: xb(c0) + (c1 - c0) * cw / 2, y: yc + 18, "text-anchor": "middle", "dominant-baseline": "central",
                "font-weight": "bold", "font-size": 16}, chDbg(c, false));
    for (let k = c0; k < c1; k++){
      mk("rect", {x: xb(k), y: yb, width: cw, height: 44, fill: multi ? cv("--cellhl") : cv("--cell"), stroke: cv("--line")});
      if (multi) mk("rect", {x: xb(k), y: yb, width: cw, height: 44, fill: "url(#hd)"});
      mk("rect", {x: xb(k) + cw * 0.2, y: yb + 11, width: cw * 0.6, height: 22, fill: cv("--cell")});
      mk("text", {x: xb(k) + cw / 2, y: yb + 22, "text-anchor": "middle", "dominant-baseline": "central",
                  style: "font-family:ui-monospace,monospace"}, M.bytes[k]);
    }
  }
  for (let k = 0; k <= n; k++){
    const ok = M.bounds.includes(k);
    mk("line", {x1: xb(k), y1: yb - 4, x2: xb(k), y2: yb + 70, stroke: cv("--line"), "stroke-width": ok ? 2.6 : 1.4,
                "stroke-dasharray": ok ? "none" : "6 4"});
    mk("text", {x: xb(k), y: yb + 84, "text-anchor": "middle", "dominant-baseline": "central",
                "font-weight": ok ? "bold" : "normal"}, String(k));
    if (!ok) mk("path", {d: `M${xb(k)-7},${yb+51} L${xb(k)+7},${yb+65} M${xb(k)-7},${yb+65} L${xb(k)+7},${yb+51}`,
                          stroke: cv("--line"), "stroke-width": 3});
  }
  const [g, p] = M.slice(a, z);
  // a és b jelölője
  for (const [k, lab] of [[a, "a"], [z, "b"]]){
    if (k > n) continue;
    mk("path", {d: `M${xb(k)},${yb + 100} l-7,14 l14,0 z`, fill: cv("--hl")});
    mk("text", {x: xb(k) + (lab === "a" ? -12 : 12), y: yb + 122, "text-anchor": lab === "a" ? "end" : "start",
                "dominant-baseline": "central", "font-weight": "bold"}, lab);
  }
  mk("text", {x: 10, y: 236, "dominant-baseline": "central", style: "font-family:ui-monospace,monospace"},
     `s.get(${a}..${z}) = ${g || "None"}`);
  const ci = "[" + M.chars.map(c => `(${c[0]}, '${chDbg(c[2], false)}')`).join(", ") + "]";
  document.getElementById("status").textContent =
    `s.len() = ${n} bájt, ${M.chars.length} karakter; határok: ${M.bounds.join(", ")}\n` +
    `char_indices(): ${ci}\n` +
    `s.get(${a}..${z}) = ${g || "None"}\n` +
    `&s[${a}..${z}] = ` + (p ? `pánik: ${p}` : g.slice(5, -1));
}
function load(s){
  M = model(s);
  const n = M.bytes.length;
  A.max = n; B.max = n;
  if (+A.value > n) A.value = 0;
  if (+B.value > n) B.value = Math.min(n, M.bounds[1] || 0);
  draw();
}
A.oninput = draw; B.oninput = draw;
document.getElementById("apply").onclick = () => load(unesc(document.getElementById("txt").value));
document.getElementById("txt").addEventListener("keydown", e => { if (e.key === "Enter") load(unesc(e.target.value)); });
for (const [id, s] of [["ex0", "árvíz"], ["ex1", "éé"], ["ex2", "e\\u{301}ab"]])
  document.getElementById(id).onclick = () => { document.getElementById("txt").value = s; A.value = 0; B.value = (id === "ex1") ? 3 : 2; load(unesc(s)); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
