<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az orphan rule döntési fája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Impl-fejléc: <select id="pick" onchange="show(+this.value)" aria-label="Példa kiválasztása"><option value="0">impl From&lt;Meter&gt; for String</option><option value="1">impl Add&lt;Meter&gt; for f64</option><option value="2">impl Display for Box&lt;Meter&gt;</option><option value="3">impl Display for MyType</option><option value="4">impl Display for Vec&lt;Meter&gt;</option><option value="5">impl Display for Vec&lt;i32&gt;</option><option value="6">impl&lt;T&gt; Display for T</option><option value="7">impl Display for WrappedVec</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Döntési fa három kérdéssel: lokális-e a trait; van-e lokális típus a T0..Tn között (Box és & átlátszó); áll-e fedetlen típusparaméter az első lokális típus előtt. A nyolc példa a megfelelő levélben."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A hibaüzenetek első sora a rustc 1.99.1 tényleges kimenete. A kódpanel sorai a fejezet nyolc impl-fejlécét mutatják; az aktuális kiemelve.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 0, "path": [["Q1", false], ["Q2", true], ["Q3", false]], "leaf": "L_ok", "err": null, "msg": "impl From<Meter> for String — típusok: T0 = String, T1 = Meter; Q1: nem; Q2: igen; Q3: nem → szabályos (lefordul)"}, {"line": 1, "path": [["Q1", false], ["Q2", true], ["Q3", false]], "leaf": "L_ok", "err": null, "msg": "impl Add<Meter> for f64 — típusok: T0 = f64, T1 = Meter; Q1: nem; Q2: igen; Q3: nem → szabályos (lefordul)"}, {"line": 2, "path": [["Q1", false], ["Q2", true], ["Q3", false]], "leaf": "L_ok", "err": null, "msg": "impl Display for Box<Meter> — típusok: T0 = Box<Meter>; Q1: nem; Q2: igen; Q3: nem → szabályos (lefordul)"}, {"line": 3, "path": [["Q1", false], ["Q2", true], ["Q3", false]], "leaf": "L_ok", "err": null, "msg": "impl Display for MyType — típusok: T0 = MyType; Q1: nem; Q2: igen; Q3: nem → szabályos (lefordul)"}, {"line": 4, "path": [["Q1", false], ["Q2", false]], "leaf": "L_e0117", "err": "E0117", "msg": "impl Display for Vec<Meter> — típusok: T0 = Vec<Meter>; Q1: nem; Q2: nem → error[E0117]: only traits defined in the current crate can be implemented for types defined outside of the crate"}, {"line": 5, "path": [["Q1", false], ["Q2", false]], "leaf": "L_e0117", "err": "E0117", "msg": "impl Display for Vec<i32> — típusok: T0 = Vec<i32>; Q1: nem; Q2: nem → error[E0117]: only traits defined in the current crate can be implemented for types defined outside of the crate"}, {"line": 6, "path": [["Q1", false], ["Q2", false]], "leaf": "L_e0210a", "err": "E0210", "msg": "impl<T> Display for T — típusok: T0 = T; Q1: nem; Q2: nem → error[E0210]: type parameter `T` must be used as an argument to some local type (e.g., `MyStruct<T>`)"}, {"line": 7, "path": [["Q1", false], ["Q2", true], ["Q3", false]], "leaf": "L_ok", "err": null, "msg": "impl Display for WrappedVec — típusok: T0 = WrappedVec; Q1: nem; Q2: igen; Q3: nem → szabályos (lefordul)"}];
const CODE = ["impl From<Meter> for String", "impl Add<Meter> for f64", "impl Display for Box<Meter>", "impl Display for MyType", "impl Display for Vec<Meter>", "impl Display for Vec<i32>", "impl<T> Display for T", "impl Display for WrappedVec"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = {"Q1": {"x": 0.0, "y": 4.05, "w": 2.35, "h": 0.62, "t": "1. A trait lokális\n(ebben a crate-ben)?"}, "Q2": {"x": 0.0, "y": 2.45, "w": 2.35, "h": 0.95, "t": "2. Van lokális típus\nT0, T1, …, Tn között?\n(Box<_>, &_ átlátszó)"}, "Q3": {"x": 0.0, "y": 0.75, "w": 2.35, "h": 0.95, "t": "3. Az első lokális típus\nelőtt áll fedetlen\ntípusparaméter?"}, "L_ok1": {"x": 3.45, "y": 4.1, "w": 3.85, "h": 0.52, "ok": true, "t": "OK – szabályos (saját trait bármely típusra)"}, "L_e0117": {"x": 3.45, "y": 2.95, "w": 3.85, "h": 0.85, "ok": false, "t": "E0117 – nincs fedetlen T"}, "L_e0210a": {"x": 3.45, "y": 2.15, "w": 3.85, "h": 0.62, "ok": false, "t": "E0210 – fedetlen T"}, "L_e0210b": {"x": 3.45, "y": 1.1, "w": 3.85, "h": 0.85, "ok": false, "t": "E0210"}, "L_ok": {"x": 3.45, "y": -0.6, "w": 3.85, "h": 1.5, "ok": true, "t": "OK – szabályos"}}, EDGES = [["Q1", "L_ok1", "igen"], ["Q1", "Q2", "nem"], ["Q2", "L_e0117", "nem"], ["Q2", "L_e0210a", "nem, de\nfedetlen T"], ["Q2", "Q3", "igen"], ["Q3", "L_e0210b", "igen"], ["Q3", "L_ok", "nem"]], LEAFEX = {"L_ok1": [], "L_e0117": ["impl Display for Vec<Meter>", "impl Display for Vec<i32>"], "L_e0210a": ["impl<T> Display for T"], "L_e0210b": ["impl<T> Add<Meter> for T", "(nem a fejezet példája)"], "L_ok": ["impl From<Meter> for String", "impl Add<Meter> for f64", "impl Display for Box<Meter>", "impl Display for MyType", "impl Display for WrappedVec"]};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 590");
  svg.innerHTML = "";
  const S = 100, X = x => 10 + x * S, Y = y => 480 - y * S;
  const onN = new Set(s.path.map(p => p[0])); onN.add(s.leaf);
  const onE = new Set();
  s.path.forEach((p, i) => { const nxt = i + 1 < s.path.length ? s.path[i+1][0] : s.leaf; onE.add(p[0] + ">" + nxt); });
  EDGES.forEach(([a, b, lab]) => {
    const A = NODES[a], B = NODES[b], on = onE.has(a + ">" + b);
    const st = {stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 4 : 1.4, fill: "none", "stroke-dasharray": on ? "" : "4 4"};
    let d, lx, ly;
    if (b[0] === "Q") { const x = X(A.x + A.w/2); d = `M${x},${Y(A.y)} L${x},${Y(B.y + B.h)}`; lx = x + 8; ly = (Y(A.y) + Y(B.y + B.h))/2; }
    else { const x0 = X(A.x + A.w), y0 = Y(A.y + A.h/2), x1 = X(B.x), y1 = Y(B.y + B.h/2), xm = x0 + 14;
           d = `M${x0},${y0} L${xm},${y0} L${xm},${y1} L${x1},${y1}`; lx = xm + 4; ly = y1 - 6; }
    el("path", Object.assign({d}, st));
    el("text", {x: lx, y: ly, "font-size": 12, "font-weight": on ? "bold" : "normal"}, lab.replace("\n", " "));
  });
  for (const key in NODES) {
    const n = NODES[key], leaf = key.startsWith("L_"), ok = n.ok !== false, on = onN.has(key);
    el("rect", {x: X(n.x), y: Y(n.y + n.h), width: n.w * S, height: n.h * S, rx: 8,
                fill: leaf ? css("--cell") : css("--cellhl"), stroke: on ? css("--hl") : css("--line"),
                "stroke-width": on ? 4 : (ok ? 1.4 : 2.4), "stroke-dasharray": ok ? "" : "8 4"});
    if (!leaf) { n.t.split("\n").forEach((t, i, arr) => el("text", {x: X(n.x + n.w/2), y: Y(n.y + n.h/2) + (i - (arr.length-1)/2) * 16 + 5, "text-anchor": "middle", "font-size": 13}, t)); continue; }
    el("text", {x: X(n.x) + 10, y: Y(n.y + n.h) + 18, "font-size": 13, "font-weight": "bold"}, (ok ? "✓ " : "✗ ") + n.t);
    (LEAFEX[key] || []).forEach((t, i) => el("text", {x: X(n.x) + 14, y: Y(n.y + n.h) + 36 + i * 16, "font-size": 12, "font-family": "monospace",
        "font-weight": (key === s.leaf && t === CODE[s.line]) ? "bold" : "normal"}, t));
  }
  const res = s.err ? "✗ " + s.err : "✓ szabályos";
  el("text", {x: 10, y: 578, "font-size": 14, "font-weight": "bold"}, CODE[s.line] + "  →  " + res);
  const sel = document.getElementById("pick"); if (sel && +sel.value !== s.line) sel.value = s.line;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
