<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allokációk a javítások előtt és után</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="bm"> bájt nézet (allokáció helyett)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A set allokációi 4610-ről 2610-re, majd 10-re, a snapshoté 2003-ról 2-re csökkennek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Gépfüggő mért érték (Rust 1.99.1, Linux x86-64, egyetlen futás, a fejezet közlése); a rétegek bontása a számokból számított. Lineáris tengely.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kattints egy oszloprétegre: alatta a hozzá tartozó kódsor. set: 4610 → 2610 → 10 allokáció; snapshot: 2003 → 2.", "line": -1, "sel": -1}, {"msg": "set: kulcs + érték másolat (clone) – 2 000 / 0 / 0 allokáció (74 000 / 0 / 0 bájt); a 2. lépés (LogEntryRef) szünteti meg.", "line": 1, "sel": 0}, {"msg": "set: serde to_vec puffer – 2 600 / 2 600 / 0 allokáció (691 200 / 691 200 / 0 bájt); a 3. feladat (to_writer) szünteti meg.", "line": 3, "sel": 1}, {"msg": "set: HashMap-növekedés (insert) – 10 / 10 / 10 allokáció (200 668 / 200 668 / 200 668 bájt); megmarad (a térkép bővülése).", "line": 4, "sel": 2}, {"msg": "snapshot: térkép-másolat (data.clone()) – 2 001 / 0 allokáció (174 368 / 0 bájt); a 2. lépés (SnapshotRef) szünteti meg.", "line": 6, "sel": 3}, {"msg": "snapshot: többi (változatlan) – 2 / 2 allokáció (8 228 / 8 228 bájt); megmarad.", "line": 6, "sel": 4}];
const CODE = ["// alapállapot: FileStore::set", "let entry = LogEntry::Set { key: key.clone(), value: value.clone() };", "self.append_entry(&entry)?;", "    // append_entry: let mut line = serde_json::to_vec(entry)?; line.push(b'\\n');", "self.data.insert(key, value);", "// alapállapot: save_snapshot", "serde_json::to_writer(&mut writer, &Snapshot { data: self.data.clone() })?;", "// 2. lépés: LogEntryRef { key: &key, value: &value },", "//           SnapshotRef { data: &self.data } – nincs másolat", "// 3. feladat: serde_json::to_writer(&mut self.log_writer, entry)", "//            – nincs köztes to_vec puffer"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"xs": ["alap", "2. lépés (LogEntryRef)", "3. feladat (to_writer)"], "xsn": ["alap", "2. lépés (SnapshotRef)"], "set": [["kulcs + érték másolat (clone)", "//", "#ffffff", [2000, 0, 0], [74000, 0, 0]], ["serde to_vec puffer", "..", "#d0d0d0", [2600, 2600, 0], [691200, 691200, 0]], ["HashMap-növekedés (insert)", "", "#707070", [10, 10, 10], [200668, 200668, 200668]]], "snap": [["térkép-másolat (data.clone())", "xx", "#ffffff", [2001, 0], [174368, 0]], ["többi (változatlan)", "", "#a0a0a0", [2, 2], [8228, 8228]]], "tot": [[4610, 965868], [2610, 891868], [10, 200668]], "totn": [[2003, 182596], [2, 8228]]};
let byteMode = false;
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 1000 470");
  const defs=el("defs",{});
  const pat=(id,d)=>{const p=document.createElementNS(NS,"pattern");p.setAttribute("id",id);p.setAttribute("patternUnits","userSpaceOnUse");p.setAttribute("width","8");p.setAttribute("height","8");const q=document.createElementNS(NS,"path");q.setAttribute("d",d);q.setAttribute("stroke",css("--line"));q.setAttribute("stroke-width","1.1");q.setAttribute("fill","none");p.appendChild(q);defs.appendChild(p);};
  pat("p1","M0,8 L8,0");pat("p2","M2,2 h0.6 M6,6 h0.6");pat("p3","M0,0 L8,8 M0,8 L8,0");
  const pmap={"//":"url(#p1)","..":"url(#p2)","xx":"url(#p3)"};
  const idx = byteMode?4:3;
  const panels=[{x0:70,w:520,xs:D.xs,L:D.set,tot:D.tot,title:"1000 × FileStore::set",off:0},
                {x0:690,w:290,xs:D.xsn,L:D.snap,tot:D.totn,title:"save_snapshot (1000 elem)",off:3}];
  const y0=360, hmax=280;
  for(const P of panels){
    const tmax=Math.max(...P.tot.map(t=>byteMode?t[1]:t[0]));
    el("text",{x:P.x0+P.w/2,y:22,"text-anchor":"middle","font-size":17,"font-weight":"bold"},P.title);
    el("line",{x1:P.x0,y1:y0,x2:P.x0+P.w,y2:y0,stroke:css("--line")});
    el("line",{x1:P.x0,y1:y0,x2:P.x0,y2:y0-hmax-10,stroke:css("--line")});
    for(let q=0;q<=4;q++){const v=tmax*q/4,y=y0-hmax*q/4;el("text",{x:P.x0-6,y:y+4,"text-anchor":"end","font-size":11,fill:css("--muted")},fmt(Math.round(v)));}
    const n=P.xs.length, bw=P.w/n*0.55;
    for(let i=0;i<n;i++){
      const cx=P.x0+P.w/n*(i+0.5); let acc=0;
      P.L.forEach((L,j)=>{
        const v=L[idx][i]; const h=hmax*v/tmax; const gi=P.off+j; const on=s.sel===gi;
        if(v>0){
          const r=el("rect",{x:cx-bw/2,y:y0-acc-h,width:bw,height:Math.max(h,1.5),fill:L[2],stroke:on?css("--hl"):"#000","stroke-width":on?4:1,style:"cursor:pointer"});
          r.addEventListener("click",()=>{stop();show(gi+1);});
          if(L[1]){const o=el("rect",{x:cx-bw/2,y:y0-acc-h,width:bw,height:Math.max(h,1.5),fill:pmap[L[1]],stroke:"none",style:"cursor:pointer"});o.addEventListener("click",()=>{stop();show(gi+1);});}
        }
        acc+=h;
      });
      const t=byteMode?P.tot[i][1]:P.tot[i][0];
      el("text",{x:cx,y:y0-acc-8,"text-anchor":"middle","font-size":15,"font-weight":"bold"},fmt(t));
      el("text",{x:cx,y:y0+20,"text-anchor":"middle","font-size":13},P.xs[i]);
    }
    // jelmagyarázat (kattintható)
    P.L.forEach((L,j)=>{
      const gi=P.off+j, y=400+j*22, x=P.x0;
      const r=el("rect",{x:x,y:y,width:26,height:16,fill:L[2],stroke:s.sel===gi?css("--hl"):"#000","stroke-width":s.sel===gi?3:1,style:"cursor:pointer"});
      r.addEventListener("click",()=>{stop();show(gi+1);});
      if(L[1])el("rect",{x:x,y:y,width:26,height:16,fill:pmap[L[1]],stroke:"none"});
      const t=el("text",{x:x+34,y:y+13,"font-size":13,style:"cursor:pointer"},L[0]);
      t.addEventListener("click",()=>{stop();show(gi+1);});
    });
  }
  el("text",{x:10,y:y0-hmax-20,"font-size":12,fill:css("--muted")},byteMode?"bájt":"allokáció");
}
document.getElementById("bm").addEventListener("change",e=>{byteMode=e.target.checked;show(k);});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
