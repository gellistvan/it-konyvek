<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A prefix-sáv és a hibás felső határ</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>prefix: <input id="pref" value="app" size="10" aria-label="Prefix"></label><button onclick="reload()">Futtatás</button><button onclick="document.getElementById('pref').value='ap';reload()">ap</button><button onclick="document.getElementById('pref').value='';reload()">üres</button><button onclick="document.getElementById('pref').value='zzz';reload()">zzz</button><label>új kulcs: <input id="newk" size="10" aria-label="Új kulcs" placeholder="pl. app\u{10FFFF}y"></label><button onclick="addKey()">Hozzáad</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét rendezett kulcs; az app-prefixű négy kulcs összefüggő sáv; a char::MAX felső határ az utolsót kihagyja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kulcsok kódpont (= UTF-8 bájt) szerint rendezettek, mint a BTreeMap<String, _>-ben. A U+10FFFF karaktert a mezőkben \u{10FFFF} alakban is megadhatod. A labor tesztje: app → 4, üres → 7, zzz → 0.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": -1, "band": [], "stop": -1, "line": 3, "bad": null, "msg": "1. A BTreeMap kulcsai rendezve (kódpont szerint): 7 kulcs; prefix = \"app\""}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 1, "band": [], "stop": -1, "probes": [3, 1, 0], "line": 4, "bad": null, "msg": "2. range(prefix..): a kezdőpont keresése (bináris keresés, vizsgált indexek: 3, 1, 0) → 1. index: app"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 1, "band": [1], "stop": -1, "line": 5, "bad": null, "msg": "3. take_while: k = app, starts_with(\"app\") = igaz → kiadja"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 2, "band": [1, 2], "stop": -1, "line": 5, "bad": null, "msg": "4. take_while: k = app::1, starts_with(\"app\") = igaz → kiadja"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 3, "band": [1, 2, 3], "stop": -1, "line": 5, "bad": null, "msg": "5. take_while: k = app⟨U+10FFFF⟩, starts_with(\"app\") = igaz → kiadja"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 4, "band": [1, 2, 3, 4], "stop": -1, "line": 5, "bad": null, "msg": "6. take_while: k = app⟨U+10FFFF⟩x, starts_with(\"app\") = igaz → kiadja"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": 5, "band": [1, 2, 3, 4], "stop": 5, "line": 5, "bad": null, "msg": "7. take_while: k = apq, starts_with(\"app\") = hamis → leáll"}, {"keys": ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"], "prefix": "app", "cur": -1, "band": [1, 2, 3, 4], "stop": -1, "line": 8, "bad": [1, 2, 3], "msg": "8. Összevetés: take_while → 4 kulcs; a hibás ..=prefix⟨U+10FFFF⟩ tartomány → 3 kulcs; kimarad: app⟨U+10FFFF⟩x"}];
const CODE = ["pub fn range_prefix<'a>(&'a self, prefix: &str)", "    -> impl Iterator<Item = (&'a str, &'a [u8])> + 'a {", "    let prefix = prefix.to_owned();", "    self.data", "        .range(prefix.clone()..) // alulról zárt, felül nyitott", "        .take_while(move |(k, _)| k.starts_with(&prefix))", "        .map(|(k, v)| (k.as_str(), v.as_slice()))", "}", "// hibás alternatíva: self.data.range(prefix.clone()..=format!(\"{prefix}\\u{10FFFF}\"))"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MAXC = String.fromCodePoint(0x10FFFF);
function cmp(a, b){                       // kódpont szerinti (= UTF-8 bájt szerinti) összehasonlítás
  const A = Array.from(a), B = Array.from(b);
  for (let i = 0; i < Math.min(A.length, B.length); i++) { const d = A[i].codePointAt(0) - B[i].codePointAt(0); if (d) return d; }
  return A.length - B.length;
}
function dispK(k){ return k === "" ? "(üres)" : k.split(MAXC).join("⟨U+10FFFF⟩"); }
function build(keys, prefix){
  keys = Array.from(new Set(keys)).sort(cmp);
  const st = [];
  const P = dispK(prefix) === "(üres)" ? "\"\"" : "\"" + dispK(prefix) + "\"";
  st.push({keys, prefix, cur: -1, band: [], stop: -1, lo: -1, hi: -1, line: 3, bad: null,
           msg: `1. A BTreeMap kulcsai rendezve (kódpont szerint): ${keys.length} kulcs; prefix = ${P}`});
  let lo = 0, hi = keys.length, probes = [];
  while (lo < hi) { const mid = (lo + hi) >> 1; probes.push(mid); if (cmp(keys[mid], prefix) < 0) lo = mid + 1; else hi = mid; }
  st.push({keys, prefix, cur: lo < keys.length ? lo : -1, band: [], stop: -1, probes, line: 4, bad: null,
           msg: `2. range(prefix..): a kezdőpont keresése (bináris keresés, vizsgált indexek: ${probes.join(", ") || "–"}) → ` +
                (lo < keys.length ? `${lo}. index: ${dispK(keys[lo])}` : "nincs ilyen kulcs (a sáv üres)")});
  const band = [];
  for (let i = lo; i < keys.length; i++) {
    const ok = keys[i].startsWith(prefix);
    if (ok) band.push(i);
    st.push({keys, prefix, cur: i, band: band.slice(), stop: ok ? -1 : i, line: 5, bad: null,
             msg: `${st.length + 1}. take_while: k = ${dispK(keys[i])}, starts_with(${P}) = ${ok ? "igaz → kiadja" : "hamis → leáll"}`});
    if (!ok) break;
  }
  const bad = keys.map((k, i) => (cmp(k, prefix) >= 0 && cmp(k, prefix + MAXC) <= 0) ? i : -1).filter(i => i >= 0);
  const missed = band.filter(i => !bad.includes(i));
  st.push({keys, prefix, cur: -1, band: band.slice(), stop: -1, line: 8, bad,
           msg: `${st.length + 1}. Összevetés: take_while → ${band.length} kulcs; a hibás ..=prefix⟨U+10FFFF⟩ tartomány → ${bad.length} kulcs` +
                (missed.length ? `; kimarad: ${missed.map(i => dispK(keys[i])).join(", ")}` : "; itt nem marad ki semmi")});
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300");
  svg.innerHTML = "";
  const n = s.keys.length, w = Math.min(104, 740 / Math.max(n, 1)), x0 = (760 - n * w) / 2;
  const row = (y, members, dashed, title) => {
    el("text", {x: 10, y: y - 14, "font-size": 13, "font-weight": "bold"}, title);
    s.keys.forEach((k, i) => {
      const inb = members.includes(i), cur = i === s.cur;
      el("rect", {x: x0 + i*w + 2, y, width: w - 4, height: 52, rx: 4, fill: inb ? css("--cellhl") : css("--cell"),
                  stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : (inb ? 2.4 : 1), "stroke-dasharray": inb && dashed ? "6 4" : ""});
      const parts = dispK(k).replace("⟨", "\n⟨").split("\n");
      parts.forEach((t, j) => el("text", {x: x0 + i*w + w/2, y: y + 24 + j*16 - (parts.length - 1) * 6, "text-anchor": "middle", "font-size": 12.5, "font-family": "monospace"}, t));
      if (y < 150) el("text", {x: x0 + i*w + w/2, y: y + 68, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    });
  };
  row(46, s.band, false, "range(prefix..).take_while(starts_with)");
  (s.probes || []).forEach((p, j) => el("text", {x: x0 + p*w + w/2, y: 32, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "?" + (j + 1)));
  if (s.cur >= 0 && s.line === 4) el("text", {x: x0 + s.cur*w + w/2, y: 40, "text-anchor": "middle", "font-size": 16}, "▼");
  if (s.stop >= 0) el("text", {x: x0 + s.stop*w + w/2, y: 136, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, "✕ leáll");
  if (s.bad) {
    row(196, s.bad, true, "hibás: range(prefix..=prefix⟨U+10FFFF⟩)");
    s.band.filter(i => !s.bad.includes(i)).forEach(i => el("text", {x: x0 + i*w + w/2, y: 268, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "kimarad!"));
  }
}
let KEYS = ["ap", "app", "app::1", "app􏿿", "app􏿿x", "apq", "b"];
function reload(){
  const p = document.getElementById("pref").value.replace(/\\u\{10FFFF\}/gi, MAXC);
  setSteps(build(KEYS, p));
}
function addKey(){
  const v = document.getElementById("newk").value.replace(/\\u\{10FFFF\}/gi, MAXC);
  if (v !== "" && !KEYS.includes(v)) KEYS.push(v);
  document.getElementById("newk").value = ""; reload();
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
