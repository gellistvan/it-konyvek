<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az rkv-cxx build-lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A cxx_build a bridge-ből C++ fejlécet és forrást generál, ezt a logger.cc-vel együtt statikus könyvtárba fordítja, amelyet a g++ a két include-útvonallal a CLI-hez linkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 19.2.5 3. és 5. lépése szerint. Egy fájlra kattintva (vagy Enterrel) az állapotsor megmutatja, melyik build-hívás vagy -I kapcsoló teszi elérhetővé.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "msg": "A teljes build-lánc. Lépj végig az öt lépésen, vagy kattints egy fájlra: megmutatja, melyik build-hívás vagy -I kapcsoló teszi elérhetővé.", "line": -1, "on": []}, {"k": 1, "msg": "1. A cxx_build::bridge(\"src/lib.rs\") (build.rs) beolvassa a #[cxx::bridge] modult; a Rust forrás NEM megy a C++ fordítóhoz.", "line": 2, "on": ["lib", "bridge"]}, {"k": 2, "msg": "2. Generált fájlok: target/cxxbridge/rkv-cxx/src/lib.rs.h, a lib.rs.cc (OUT_DIR) és target/cxxbridge/rust/cxx.h.", "line": 2, "on": ["bridge", "genh", "gencc", "cxxh"]}, {"k": 3, "msg": "3. A cc a .file(\"src/logger.cc\")-t és a generált lib.rs.cc-t fordítja; compile(\"rkv-cxx-glue\") → librkv-cxx-glue.a.", "line": 3, "on": ["logcc", "gencc", "cc", "glue"]}, {"k": 4, "msg": "4. cargo build -p rkv-cxx --release (a build.rs ennek része) → target/release/librkv_cxx.a: Rust kód + glue + cxx runtime.", "line": 9, "on": ["lib", "glue", "cargo", "a"]}, {"k": 5, "msg": "5. g++: a -I target/cxxbridge a lib.rs.h-t és a rust/cxx.h-t, a -I . a rkv-cxx/include/logger.h-t teszi elérhetővé; link a librkv_cxx.a-val (-lpthread -ldl -lm) → cpp-client/cxx-cli.", "line": 10, "on": ["cli", "a", "genh", "cxxh", "logh", "gpp", "exe"]}];
const CODE = ["// rkv-cxx/build.rs", "fn main() {", "    cxx_build::bridge(\"src/lib.rs\")", "        .file(\"src/logger.cc\")", "        .std(\"c++17\")", "        .compile(\"rkv-cxx-glue\");", "}", " ", "# terminál (workspace gyökér)", "cargo build -p rkv-cxx --release", "g++ -std=c++17 -Wall -Wextra -I target/cxxbridge -I . \\", "    cpp-client/cxx_cli.cpp target/release/librkv_cxx.a \\", "    -lpthread -ldl -lm -o cpp-client/cxx-cli"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = {"lib": [0, 58, "rkv-cxx/src/\nlib.rs\n#[cxx::bridge]", "src"], "logcc": [0, 36, "rkv-cxx/src/\nlogger.cc", "src"], "logh": [0, 8, "rkv-cxx/include/\nlogger.h", "src"], "cli": [0, -4, "cpp-client/\ncxx_cli.cpp", "src"], "bridge": [26.5, 58, "cxx_build::\nbridge(\n\"src/lib.rs\")", "tool"], "cc": [26.5, 30, ".file(\n\"src/logger.cc\")\n→ cc", "tool"], "genh": [53, 58, "target/cxxbridge/\nrkv-cxx/src/\nlib.rs.h", "gen"], "cxxh": [53, 47, "target/cxxbridge/\nrust/cxx.h", "gen"], "gencc": [53, 36, "lib.rs.cc\n(OUT_DIR)", "gen"], "glue": [53, 22, "librkv-cxx-glue.a\n(OUT_DIR)", "gen"], "cargo": [79.5, 22, "cargo build\n--release", "tool"], "a": [79.5, 36, "target/release/\nlibrkv_cxx.a\n(Rust + glue\n+ cxx runtime)", "gen"], "gpp": [106, -6, "g++\n(fordítás\n+ link)", "tool"], "exe": [96, -19, "cpp-client/\ncxx-cli", "gen"]}, EDGES = [["lib", "bridge", "", 1, "n"], ["bridge", "genh", "", 2, "n"], ["bridge", "cxxh", "", 2, "n"], ["bridge", "gencc", "", 2, "n"], ["logcc", "cc", "", 3, "n"], ["gencc", "cc", "", 3, "n"], ["cc", "glue", "", 3, "n"], ["glue", "cargo", "", 4, "n"], ["cargo", "a", "", 4, "n"], ["cli", "gpp", "", 5, "n"], ["a", "gpp", "", 5, "n"], ["genh", "gpp", "-I target/cxxbridge", 5, "inc"], ["cxxh", "gpp", "-I target/cxxbridge", 5, "inc"], ["logh", "gpp", "-I .", 5, "inc"], ["gpp", "exe", "", 5, "n"], ["lib", "cc", ".file(\"src/lib.rs\"): hiba", 0, "bad"]], INFO = {"lib": "Forrás. A bridge(...) olvassa be és a cargo fordítja; .file(...)-lal TILOS a C++ fordítónak adni.", "logcc": "Forrás. A build.rs .file(\"src/logger.cc\") hívása adja a cc-nek.", "logh": "Forrás. A lib.rs.h #include \"rkv-cxx/include/logger.h\" sora a workspace gyökeréből oldódik fel: g++ -I .", "cli": "Forrás. A g++ parancssorában közvetlenül szerepel.", "genh": "Generált (cxx_build::bridge). A g++-nak a -I target/cxxbridge teszi elérhetővé (#include \"rkv-cxx/src/lib.rs.h\").", "gencc": "Generált (cxx_build::bridge), az OUT_DIR-ben; a cc a glue-könyvtárba fordítja.", "cxxh": "Generált (cxx_build::bridge). A g++-nak a -I target/cxxbridge teszi elérhetővé (#include \"rust/cxx.h\").", "glue": "A cc kimenete a compile(\"rkv-cxx-glue\") hívásból; a cargo a staticlibbe csomagolja.", "a": "crate-type = [\"staticlib\", ...] → target/release/librkv_cxx.a; a g++ parancssorában a forrás után áll.", "exe": "A g++ -o cpp-client/cxx-cli kimenete.", "bridge": "Eszköz: a build.rs első hívása.", "cc": "Eszköz: a cc crate C++ fordítása.", "cargo": "Eszköz: cargo build -p rkv-cxx --release.", "gpp": "Eszköz: a g++ fordítás és linkelés."}, SIZE = {"lib": [23, 8.5], "logcc": [23, 8.5], "logh": [23, 8.5], "cli": [23, 8.5], "bridge": [23, 8.5], "cc": [23, 8.5], "genh": [23, 8.5], "cxxh": [23, 8.5], "gencc": [23, 8.5], "glue": [23, 8.5], "cargo": [23, 8.5], "a": [23, 11], "gpp": [15, 72], "exe": [23, 8.5]};
let picked = null;
function anchorPt(a, b){
  const A = NODES[a], B = NODES[b], [wa, ha] = SIZE[a], [wb, hb] = SIZE[b];
  if (b === "gpp"){ const y = A[1] + ha / 2; return [[A[0] + wa, y], [B[0], y]]; }
  if (a === "gpp") return [[B[0] + wb / 2 + 4, A[1]], [B[0] + wb / 2 + 4, B[1] + hb]];
  if (a === "lib" && b === "cc") return [[A[0] + wa * 0.7, A[1]], [B[0] + wb * 0.3, B[1] + hb]];
  if (a === "gencc" && b === "cc") return [[A[0], A[1] + ha / 2], [B[0] + wb, B[1] + hb * 0.75]];
  if (a === "cargo" && b === "a") return [[A[0] + wa / 2, A[1] + ha], [B[0] + wb / 2, B[1]]];
  return [[A[0] + wa, A[1] + ha / 2], [B[0], B[1] + hb / 2]];
}
function render(s){
  svg.setAttribute("viewBox", "0 40 760 520"); svg.innerHTML = "";
  const sx = x => 8 + x * 6.1, sy = y => 400 - y * 5.4;
  const defs = el("defs", {});
  for (const [id, col] of [["ah", css("--fg")], ["ahh", css("--hl")], ["ahb", css("--hl2")]]){
    const m = document.createElementNS(NS, "marker"); m.setAttribute("id", id); m.setAttribute("viewBox", "0 0 10 10"); m.setAttribute("refX", 9); m.setAttribute("refY", 5); m.setAttribute("markerWidth", 7); m.setAttribute("markerHeight", 7); m.setAttribute("orient", "auto");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 Z"); p.setAttribute("fill", col); m.appendChild(p); defs.appendChild(m);
  }
  for (const e of EDGES){
    const [a, b, lab, st, kind] = e;
    let [[x0, y0], [x1, y1]] = anchorPt(a, b);
    const act = (st > 0 && st === s.k) || (picked && (a === picked || b === picked) && kind === "inc");
    const col = kind === "bad" ? css("--hl2") : (act ? css("--hl") : css("--muted"));
    el("line", {x1: sx(x0), y1: sy(y0), x2: sx(x1), y2: sy(y1), stroke: col, "stroke-width": act ? 2.8 : (kind === "inc" ? 1.8 : 1.2), "stroke-dasharray": kind === "bad" ? "7 4" : (kind === "inc" ? "2 3" : ""), "marker-end": kind === "bad" ? "url(#ahb)" : (act ? "url(#ahh)" : "url(#ah)")});
    if (kind === "bad"){ const xm = sx((x0 + x1) / 2), ym = sy((y0 + y1) / 2); el("path", {d: `M${xm - 8},${ym - 8} L${xm + 8},${ym + 8} M${xm - 8},${ym + 8} L${xm + 8},${ym - 8}`, stroke: css("--hl2"), "stroke-width": 3.5}); el("text", {x: xm - 12, y: ym - 2, "text-anchor": "end", "font-size": 11, fill: css("--hl2")}, '.file("src/lib.rs"):'); el("text", {x: xm - 12, y: ym + 12, "text-anchor": "end", "font-size": 11, fill: css("--hl2")}, "hiba, Rust forrás"); }
    if (kind === "inc"){ const tx = sx(a === "logh" ? 66 : 92), ty = sy(y0); el("rect", {x: tx - 70, y: ty - 10, width: 140, height: 19, fill: css("--bg"), stroke: css("--muted")}); el("text", {x: tx, y: ty + 4, "text-anchor": "middle", "font-size": 11, style: "font-family:ui-monospace,monospace", fill: act ? css("--hl") : css("--fg"), "font-weight": act ? "bold" : "normal"}, lab); }
  }
  for (const id in NODES){
    const [x, y, lab, kind] = NODES[id], [W, H] = SIZE[id];
    const on = s.on.includes(id) || picked === id;
    const g = document.createElementNS(NS, "g"); g.setAttribute("tabindex", 0); g.setAttribute("role", "button"); g.setAttribute("aria-label", lab.replace(/\n/g, " ")); g.style.cursor = "pointer";
    const r = document.createElementNS(NS, "rect");
    const at = {x: sx(x), y: sy(y + H), width: W * 6.1, height: H * 5.4, rx: kind === "tool" ? 12 : 0, fill: kind === "src" ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : (kind === "tool" ? 2 : 1.2), "stroke-dasharray": kind === "gen" ? "6 4" : ""};
    for (const k in at) r.setAttribute(k, at[k]);
    g.appendChild(r);
    lab.split("\n").forEach((ln, j, arr) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", sx(x + W / 2)); t.setAttribute("y", sy(y + H / 2) + 4 + (j - (arr.length - 1) / 2) * 14); t.setAttribute("text-anchor", "middle"); t.setAttribute("font-size", 11.5); if (kind === "tool") t.setAttribute("font-weight", "bold"); t.textContent = ln; g.appendChild(t); });
    const pick = () => { picked = picked === id ? null : id; status.textContent = picked ? (lab.replace(/\n/g, " ") + ": " + INFO[id]) : STEPS[k].msg; render(STEPS[k]); };
    g.addEventListener("click", pick); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); pick(); } });
    svg.appendChild(g);
  }
  el("text", {x: 10, y: 552, "font-size": 11, fill: css("--muted")}, "Szürke, tömör: forrás; szaggatott: generált; lekerekített: eszköz; pontozott nyíl: -I include-út; piros X: tiltott út.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
