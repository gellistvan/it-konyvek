<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A ? vezérlésfolyama</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bemenet: <select id="inp"><option value="SET k hello world">① "SET k hello world"</option><option value="SET k">② "SET k"</option><option value="GET a b">③ "GET a b"</option><option value="SET k ">④ "SET k "</option><option value="__own">saját sor…</option></select></label><label>saját sor: <input id="own" type="text" value="DEL x" style="font:13px ui-monospace,monospace"></label><button id="go">Futtatás</button><span id="selftest" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra a parse_command lépéseiről: split_once, match, a GET ág parse_key(key)? csomópontja, a SET ág ok_or_else(..)?, is_empty, sortörés-ellenőrzés és parse_key(key)? csomópontjai; minden ?-ből szaggatott nyíl vezet a return Err(From::from(e)) kimenetre. A SET k hello world útja Ok-ban végződik, a GET a b a GET ág parse_key(key)? csomópontjából lép ki."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A parse_command (r009 nyelvtan) hű átirata; a négy minta eredménye rustc 1.99.1-gyel ellenőrizve.</p>

let STEPS = [{"msg": "1. split_once(' '): verb = \"SET\", rest = Some(\"k hello world\")", "line": 1, "path": ["N0"], "cur": "N0", "exit": null}, {"msg": "2. match (\"SET\", Some(\"k hello world\"))", "line": 5, "path": ["N0", "N1"], "cur": "N1", "exit": null}, {"msg": "3. split_once → Some: key = \"k\", value = \"hello world\"; a ? kibontja", "line": 11, "path": ["N0", "N1", "N4"], "cur": "N4", "exit": null}, {"msg": "4. value.is_empty() = false", "line": 12, "path": ["N0", "N1", "N4", "N5"], "cur": "N5", "exit": null}, {"msg": "5. nincs sortörés az értékben", "line": 15, "path": ["N0", "N1", "N4", "N5", "N6"], "cur": "N6", "exit": null}, {"msg": "6. parse_key(\"k\") → Ok: a ? kibontja: \"k\"", "line": 18, "path": ["N0", "N1", "N4", "N5", "N6", "N7"], "cur": "N7", "exit": null}, {"msg": "7. Ok(Command::Set(..)) ⇒ eredmény: Ok(Set(\"k\", \"hello world\"))", "line": 18, "path": ["N0", "N1", "N4", "N5", "N6", "N7", "N8"], "cur": "N8", "exit": null}];
const CODE = ["fn parse_command(line: &str) -> Result<Command, String> {", "    let (verb, rest) = match line.split_once(' ') {", "        Some((verb, rest)) => (verb, Some(rest)),", "        None => (line, None),", "    };", "    match (verb, rest) {", "        (\"GET\", Some(key)) => Ok(Command::Get(parse_key(key)?)),", "        (\"DEL\", Some(key)) => Ok(Command::Delete(parse_key(key)?)),", "        (\"SET\", Some(rest)) => {", "            let (key, value) = rest", "                .split_once(' ')", "                .ok_or_else(|| \"SET requires a key and a value\".to_string())?;", "            if value.is_empty() {", "                return Err(\"SET requires a non-empty value\".to_string());", "            }", "            if value.contains(['\\n', '\\r']) {", "                return Err(\"SET value must not contain a line break\".to_string());", "            }", "            Ok(Command::Set(parse_key(key)?, value.to_string()))", "        }", "        (\"LIST\", None) => Ok(Command::List(None)),", "        (\"LIST\", Some(prefix)) => Ok(Command::List(Some(parse_key(prefix)?))),", "        (\"GET\" | \"DEL\", None) => Err(format!(\"{verb} requires a key\")),", "        (\"SET\", None) => Err(\"SET requires a key and a value\".to_string()),", "        (\"\", _) => Err(\"empty line\".to_string()),", "        (other, _) => Err(format!(\"unknown command: {other}\")),", "    }", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

const NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("v");

function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

  if (f === "dark") return matchMedia("(prefers-color-scheme: dark)").matches ? "#d8d8d8" : "#3a3a3a";
  return css(SC_FILL[f]);
}

}
function scDraw(sc){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${sc.W} ${sc.H}`);
  scDefs();
  const line = css("--line");
  for (const p of sc.prims){
    if (p.t === "rect"){
      el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, fill: scFill(p.fill),
                  stroke: p.lw > 0 ? line : "none", "stroke-width": p.lw,
                  "stroke-dasharray": p.ls === "dash" ? "6 4" : "none"});
      if (p.hatch) el("rect", {x: p.x, y: p.y, width: p.w, height: p.h, fill: `url(#h-${p.hatch})`, stroke: "none"});
    } else if (p.t === "line"){
      const a = {points: p.pts.map(q => q.join(",")).join(" "), fill: "none", stroke: line,
                 "stroke-width": p.lw, "stroke-dasharray": p.ls === "dash" ? "6 4" : "none"};
      if (p.arrow) a["marker-end"] = "url(#ah)";
      el("polyline", a);
    } else if (p.t === "cross"){
      const r = p.r;
      el("path", {d: `M${p.x-r},${p.y-r} L${p.x+r},${p.y+r} M${p.x-r},${p.y+r} L${p.x+r},${p.y-r}`,
                  stroke: line, "stroke-width": 3, fill: "none"});
    } else if (p.t === "text"){
      const a = {x: p.x, y: p.y, "font-size": p.fs, "text-anchor": p.anchor, "dominant-baseline": "central"};
      if (p.bold) a["font-weight"] = "bold";
      if (p.italic) a["font-style"] = "italic";
      if (p.mono) a.style = "font-family:ui-monospace,Menlo,Consolas,monospace";
      if (p.col === "muted") a.fill = css("--muted");
      if (p.col === "light") a.fill = css("--bg");
      el("text", a, p.s);
    }
  }
}
function scSetCode(lines){
  const ce = document.getElementById("code");
  ce.style.display = lines.length ? "" : "none";
  ce.innerHTML = lines.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
}
function render(s){ scDraw(s.sc); }

// --- a parse_command hű átirata (Python-oldali trace() megfelelője) ---
const BAD = /[\p{White_Space}\p{Cc}]/u, ESC = /[\p{Cc}\p{Mn}\p{Me}]/u;
function dbg(s){
  let o = "";
  for (const c of s){
    const e = {'"': '\\"', "\\": "\\\\", "\n": "\\n", "\r": "\\r", "\t": "\\t", "\0": "\\0"}[c];
    o += e !== undefined ? e : (ESC.test(c) ? "\\u{" + c.codePointAt(0).toString(16) + "}" : c);
  }
  return '"' + o + '"';
}
function keyBad(s){ return s === "" || BAD.test(s); }
function trace(line){
  const st = []; let verb, rest = null, res;
  const i0 = line.indexOf(" ");
  if (i0 >= 0){ verb = line.slice(0, i0); rest = line.slice(i0 + 1); } else verb = line;
  const rs = rest === null ? "None" : `Some(${dbg(rest)})`;
  st.push({node: "N0", line: 1, msg: `split_once(' '): verb = ${dbg(verb)}, rest = ${rs}`});
  st.push({node: "N1", line: 5, msg: `match (${dbg(verb)}, ${rs})`});
  function pk(s, node, ln, okf){
    if (keyBad(s)){
      st.push({node, line: ln, msg: `parse_key(${dbg(s)}) → Err: a ? azonnal visszatér: return Err(From::from(e))`, exit: node});
      return `Err(${dbg("invalid key: " + dbg(s))})`;
    }
    st.push({node, line: ln, msg: `parse_key(${dbg(s)}) → Ok: a ? kibontja: ${dbg(s)}`});
    return okf(s);
  }
  if (verb === "GET" && rest !== null){
    res = pk(rest, "N2", 6, k => `Ok(Get(${dbg(k)}))`);
    if (res.startsWith("Ok")) st.push({node: "N3", line: 6, msg: "Ok(Command::Get(..))"});
  } else if (verb === "SET" && rest !== null){
    const j = rest.indexOf(" ");
    if (j < 0){
      res = 'Err("SET requires a key and a value")';
      st.push({node: "N4", line: 11, msg: "rest.split_once(' ') = None → ok_or_else: Err → a ? azonnal visszatér", exit: "N4"});
    } else {
      const key = rest.slice(0, j), value = rest.slice(j + 1);
      st.push({node: "N4", line: 11, msg: `split_once → Some: key = ${dbg(key)}, value = ${dbg(value)}; a ? kibontja`});
      if (value === ""){
        res = 'Err("SET requires a non-empty value")';
        st.push({node: "N5", line: 13, msg: "value.is_empty() → return Err (explicit return)", exit: "N5"});
      } else {
        st.push({node: "N5", line: 12, msg: "value.is_empty() = false"});
        if (/[\n\r]/.test(value)){
          res = 'Err("SET value must not contain a line break")';
          st.push({node: "N6", line: 16, msg: "sortörés az értékben → return Err (explicit return)", exit: "N6"});
        } else {
          st.push({node: "N6", line: 15, msg: "nincs sortörés az értékben"});
          res = pk(key, "N7", 18, k => `Ok(Set(${dbg(k)}, ${dbg(value)}))`);
          if (res.startsWith("Ok")) st.push({node: "N8", line: 18, msg: "Ok(Command::Set(..))"});
        }
      }
    }
  } else {
    let ln;
    if (verb === "DEL" && rest !== null){ res = keyBad(rest) ? `Err(${dbg("invalid key: " + dbg(rest))})` : `Ok(Delete(${dbg(rest)}))`; ln = 7; }
    else if (verb === "LIST"){ ln = rest === null ? 20 : 21;
      res = rest === null ? "Ok(List(None))" : (keyBad(rest) ? `Err(${dbg("invalid key: " + dbg(rest))})` : `Ok(List(Some(${dbg(rest)})))`); }
    else if (verb === "GET" || verb === "DEL"){ res = `Err(${dbg(verb + " requires a key")})`; ln = 22; }
    else if (verb === "SET"){ res = 'Err("SET requires a key and a value")'; ln = 23; }
    else if (verb === ""){ res = 'Err("empty line")'; ln = 24; }
    else { res = `Err(${dbg("unknown command: " + verb)})`; ln = 25; }
    st.push({node: "OTH", line: ln, msg: "egyéb ág (a folyamatábrán nem részletezett)"});
  }
  st[st.length - 1].msg += ` ⇒ eredmény: ${res}`;
  return st.map((x, i) => ({msg: (i + 1) + ". " + x.msg, line: x.line, path: st.slice(0, i + 1).map(y => y.node),
                            cur: x.node, exit: x.exit || null}));
}

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");

function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }

document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
