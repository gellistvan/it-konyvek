<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ownership az rkv-ffi határán</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A C kliens a Rust által foglalt kezelőt és puffert a Rust által exportált rkv_store_free és rkv_buffer_free függvénnyel adja vissza; a C free hívása tilos."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell a labor main.c kliense szerint; az üres érték mutatója nem null (len = 0). A 4' lépés a tiltott alternatíva (a C free más allokátorhoz tartozik), a valódi program a 4. lépést hajtja végre.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"lab": "1", "call": "rkv_store_new()", "rust": "Box::into_raw(Box<RkvStore>)", "op": "+", "bad": false, "live": ["RkvStore"], "line": 1, "msg": "1. rkv_store_new() → Box::into_raw(Box<RkvStore>); visszatérés: RkvStore* │ élő foglalások: RkvStore", "ret": "RkvStore*"}, {"lab": "2", "call": "rkv_set(store, \"alma\", \"piros\", 5)", "rust": "to_vec(): másolat a tárolóba", "op": "+in", "bad": false, "live": ["RkvStore"], "line": 8, "msg": "2. rkv_set(store, \"alma\", \"piros\", 5) → to_vec(): másolat a tárolóba; visszatérés: RKV_OK (a másolat a RkvStore része, a kezelővel együtt szabadul) │ élő foglalások: RkvStore", "ret": "RKV_OK"}, {"lab": "3", "call": "rkv_get(store, \"alma\", &value, &len)", "rust": "into_boxed_slice + Box::into_raw", "op": "+", "bad": false, "live": ["RkvStore", "[u8; 5]"], "line": 15, "msg": "3. rkv_get(store, \"alma\", &value, &len) → into_boxed_slice + Box::into_raw; visszatérés: value, len = 5 │ élő foglalások: RkvStore, [u8; 5]", "ret": "value, len = 5"}, {"lab": "4'", "call": "free(value)", "rust": "UB: más allokátor", "op": "x", "bad": true, "live": ["RkvStore", "[u8; 5]"], "line": 23, "msg": "4'. TILOS: free(value) – a puffert a Rust globális allokátora foglalta, a C free más allokátorhoz tartozik: UB: más allokátor. Helyette: rkv_buffer_free(value, len). │ élő foglalások: RkvStore, [u8; 5]", "ret": ""}, {"lab": "4", "call": "rkv_buffer_free(value, 5)", "rust": "Box::from_raw(slice_from_raw_parts_mut)", "op": "-", "bad": false, "live": ["RkvStore"], "line": 23, "msg": "4. rkv_buffer_free(value, 5) → Box::from_raw(slice_from_raw_parts_mut) │ élő foglalások: RkvStore", "ret": ""}, {"lab": "5", "call": "rkv_store_free(store)", "rust": "Box::from_raw → drop", "op": "-", "bad": false, "live": [], "line": 44, "msg": "5. rkv_store_free(store) → Box::from_raw → drop │ élő foglalások: nincs", "ret": ""}];
const CODE = ["int main(void) {", "    RkvStore *store = rkv_store_new();", "    if (store == NULL) {", "        fprintf(stderr, \"store létrehozási hiba\\n\");", "        return 1;", "    }", "    int rc = 1;", " ", "    if (rkv_set(store, \"alma\", (const uint8_t *)\"piros\", 5) != RKV_OK) {", "        fprintf(stderr, \"SET hiba\\n\");", "        goto done; /* a hibaágon is pontosan egyszer szabadítunk */", "    }", " ", "    uint8_t *value = NULL;", "    size_t len = 0;", "    int status = rkv_get(store, \"alma\", &value, &len);", "    if (status == RKV_OK) {", "        /* A puffer tetszőleges bájtokat tartalmazhat: belső 0, nem UTF-8.", "           A printf(\"%.*s\") csak NUL-mentes szövegre jó, ezért itt a", "           hosszal írunk: a tartalom és a hossz is megmarad. */", "        fwrite(\"VALUE \", 1, 6, stdout);", "        fwrite(value, 1, len, stdout);", "        fputc('\\n', stdout);", "        rkv_buffer_free(value, len); /* pontosan egyszer, a kapott hosszal */", "    } else if (status == RKV_NOT_FOUND) {", "        printf(\"NOTFOUND\\n\");", "    } else {", "        fprintf(stderr, \"GET hiba: %d\\n\", status);", "        goto done;", "    }", " ", "    for (int i = 0; i < 2; i++) { /* az első törlés OK, a második NOTFOUND */", "        int del = rkv_delete(store, \"alma\");", "        if (del == RKV_OK) {", "            printf(\"DEL OK\\n\");", "        } else if (del == RKV_NOT_FOUND) {", "            printf(\"DEL NOTFOUND\\n\");", "        } else { /* RKV_ERROR, RKV_INVALID_ARG, RKV_PANIC: nem \"nem találtam\" */", "            fprintf(stderr, \"DEL hiba: %d\\n\", del);", "            goto done;", "        }", "    }", "    rc = 0;", "done:", "    rkv_store_free(store);", "    return rc;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ACT = ["C kliens (main.c)", "rkv-ffi (Rust)", "Rust globális allokátor"];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  const XS = [100, 300, 500];
  ACT.forEach((a, i) => { el("rect", {x: XS[i] - 85, y: 10, width: 170, height: 32, fill: css("--cellhl"), stroke: css("--line")}); el("text", {x: XS[i], y: 31, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, a); el("line", {x1: XS[i], x2: XS[i], y1: 42, y2: 250, stroke: css("--muted"), "stroke-dasharray": "4 3"}); });
  const y = 100;
  el("text", {x: 12, y: y + 5, "font-size": 18, "font-weight": "bold"}, s.lab);
  el("line", {x1: XS[0], x2: XS[1] - 6, y1: y, y2: y, stroke: s.bad ? css("--hl2") : css("--fg"), "stroke-width": 2.5, "stroke-dasharray": s.bad ? "7 4" : ""});
  el("path", {d: `M${XS[1] - 6},${y - 6} L${XS[1] + 2},${y} L${XS[1] - 6},${y + 6} Z`, fill: s.bad ? css("--hl2") : css("--fg")});
  el("text", {x: (XS[0] + XS[1]) / 2, y: y - 10, "text-anchor": "middle", "font-size": 13, style: "font-family:ui-monospace,monospace"}, s.call);
  if (s.bad){
    el("line", {x1: XS[0] + 20, x2: XS[1] - 20, y1: y - 14, y2: y + 14, stroke: css("--hl2"), "stroke-width": 3});
    el("text", {x: (XS[0] + XS[1]) / 2, y: y + 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "UB: más allokátor");
    el("text", {x: (XS[0] + XS[1]) / 2, y: y + 50, "text-anchor": "middle", "font-size": 12}, "helyette: rkv_buffer_free(value, len)");
  } else {
    const y2 = y + 40, sign = s.op === "-" ? "− " : "+ ";
    el("line", {x1: XS[1], x2: XS[2] - 6, y1: y2, y2: y2, stroke: css("--fg"), "stroke-width": s.op === "-" ? 4 : 2});
    el("path", {d: `M${XS[2] - 6},${y2 - 6} L${XS[2] + 2},${y2} L${XS[2] - 6},${y2 + 6} Z`, fill: css("--fg")});
    el("text", {x: (XS[1] + XS[2]) / 2, y: y2 - 8, "text-anchor": "middle", "font-size": 12}, sign + s.rust);
    if (s.ret){ const y3 = y + 80; el("line", {x1: XS[1], x2: XS[0] + 6, y1: y3, y2: y3, stroke: css("--fg"), "stroke-dasharray": "3 3", "stroke-width": 1.5}); el("path", {d: `M${XS[0] + 6},${y3 - 5} L${XS[0] - 2},${y3} L${XS[0] + 6},${y3 + 5} Z`, fill: css("--fg")}); el("text", {x: (XS[0] + XS[1]) / 2, y: y3 - 6, "text-anchor": "middle", "font-size": 12}, s.ret); }
  }
  el("rect", {x: 610, y: 60, width: 140, height: 150, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 680, y: 80, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "élő foglalások");
  if (!s.live.length) el("text", {x: 680, y: 115, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "nincs");
  s.live.forEach((o, j) => { el("rect", {x: 625, y: 95 + j * 40, width: 110, height: 30, fill: css("--cellhl"), stroke: css("--line")}); el("text", {x: 680, y: 115 + j * 40, "text-anchor": "middle", "font-size": 13}, o); });
  el("text", {x: 12, y: 285, "font-size": 12, fill: css("--muted")}, "+ foglalás, − felszabadítás; a tiltott 4' lépés nem fut le, a nyilvántartás változatlan. Modell.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
