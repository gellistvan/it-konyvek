<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Span-verem: enter() vs. instrument()</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Változat:</span><button id="mE" aria-pressed="true">enter() guard (hibás)</button><button id="mI" aria-pressed="false">.instrument() (helyes)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két task váltakozva fut egy szálon; enter()-guard esetén a második task eseményei az első span alá kerülnek, instrument() esetén mindkettő a saját spanje alatt naplóz."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés: egyszálú runtime, a pollolási sorrend és a kiírt sorok a könyv két kimeneti listingjével egyeznek. T1 tömör, T2 szaggatott keret; aláhúzva a hibás (beágyazott) előtag.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "enter", "task": 1, "poll": 1, "before": [], "during": ["kérés{id=1}"], "after": ["kérés{id=1}"], "out": [" INFO kérés{id=1}: kezdet"], "wrong": false, "line": 3, "msg": "T1 poll#1: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: kezdet”; a poll után a szálon marad: [kérés{id=1}]"}, {"mode": "enter", "task": 2, "poll": 1, "before": ["kérés{id=1}"], "during": ["kérés{id=1}", "kérés{id=2}"], "after": ["kérés{id=1}", "kérés{id=2}"], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet"], "wrong": true, "line": 3, "msg": "T2 poll#1: a szál span-verme az eseménykor [kérés{id=1}, kérés{id=2}] → „INFO kérés{id=1}:kérés{id=2}: kezdet”; a poll után a szálon marad: [kérés{id=1}, kérés{id=2}] – HIBÁS beágyazás!"}, {"mode": "enter", "task": 2, "poll": 2, "before": ["kérés{id=1}", "kérés{id=2}"], "during": ["kérés{id=1}", "kérés{id=2}"], "after": ["kérés{id=1}"], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet", " INFO kérés{id=1}:kérés{id=2}: vég"], "wrong": true, "line": 5, "msg": "T2 poll#2: a szál span-verme az eseménykor [kérés{id=1}, kérés{id=2}] → „INFO kérés{id=1}:kérés{id=2}: vég”; a poll után a szálon marad: [kérés{id=1}] – HIBÁS beágyazás!"}, {"mode": "enter", "task": 1, "poll": 2, "before": ["kérés{id=1}"], "during": ["kérés{id=1}"], "after": [], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet", " INFO kérés{id=1}:kérés{id=2}: vég", " INFO kérés{id=1}: vég"], "wrong": false, "line": 5, "msg": "T1 poll#2: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: vég”; a poll után a szálon marad: []"}];
const CODE = ["// (a) hibás: az enter() guard az .await-en át él", "let span = info_span!(\"kérés\", id);", "let _g = span.enter();       // a span a SZÁLON lesz aktív", "info!(\"kezdet\");", "sleep(..).await;             // felfüggesztés: a guard él, a span a szálon marad", "info!(\"vég\");", "                             // itt dobódik el _g: a span kilép", " ", "// (b) helyes: a teljes future instrumentálása", "async {", "    info!(\"kezdet\");", "    sleep(..).await;         // felfüggesztés: az Instrument kilép a spanből", "    info!(\"vég\");", "}.instrument(info_span!(\"kérés\", id))   // pollonként be- és kilép"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALTS = {"enter": [{"mode": "enter", "task": 1, "poll": 1, "before": [], "during": ["kérés{id=1}"], "after": ["kérés{id=1}"], "out": [" INFO kérés{id=1}: kezdet"], "wrong": false, "line": 3, "msg": "T1 poll#1: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: kezdet”; a poll után a szálon marad: [kérés{id=1}]"}, {"mode": "enter", "task": 2, "poll": 1, "before": ["kérés{id=1}"], "during": ["kérés{id=1}", "kérés{id=2}"], "after": ["kérés{id=1}", "kérés{id=2}"], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet"], "wrong": true, "line": 3, "msg": "T2 poll#1: a szál span-verme az eseménykor [kérés{id=1}, kérés{id=2}] → „INFO kérés{id=1}:kérés{id=2}: kezdet”; a poll után a szálon marad: [kérés{id=1}, kérés{id=2}] – HIBÁS beágyazás!"}, {"mode": "enter", "task": 2, "poll": 2, "before": ["kérés{id=1}", "kérés{id=2}"], "during": ["kérés{id=1}", "kérés{id=2}"], "after": ["kérés{id=1}"], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet", " INFO kérés{id=1}:kérés{id=2}: vég"], "wrong": true, "line": 5, "msg": "T2 poll#2: a szál span-verme az eseménykor [kérés{id=1}, kérés{id=2}] → „INFO kérés{id=1}:kérés{id=2}: vég”; a poll után a szálon marad: [kérés{id=1}] – HIBÁS beágyazás!"}, {"mode": "enter", "task": 1, "poll": 2, "before": ["kérés{id=1}"], "during": ["kérés{id=1}"], "after": [], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=1}:kérés{id=2}: kezdet", " INFO kérés{id=1}:kérés{id=2}: vég", " INFO kérés{id=1}: vég"], "wrong": false, "line": 5, "msg": "T1 poll#2: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: vég”; a poll után a szálon marad: []"}], "instrument": [{"mode": "instrument", "task": 1, "poll": 1, "before": [], "during": ["kérés{id=1}"], "after": [], "out": [" INFO kérés{id=1}: kezdet"], "wrong": false, "line": 10, "msg": "T1 poll#1: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: kezdet”; a poll után a szálon marad: []"}, {"mode": "instrument", "task": 2, "poll": 1, "before": [], "during": ["kérés{id=2}"], "after": [], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=2}: kezdet"], "wrong": false, "line": 10, "msg": "T2 poll#1: a szál span-verme az eseménykor [kérés{id=2}] → „INFO kérés{id=2}: kezdet”; a poll után a szálon marad: []"}, {"mode": "instrument", "task": 2, "poll": 2, "before": [], "during": ["kérés{id=2}"], "after": [], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=2}: kezdet", " INFO kérés{id=2}: vég"], "wrong": false, "line": 12, "msg": "T2 poll#2: a szál span-verme az eseménykor [kérés{id=2}] → „INFO kérés{id=2}: vég”; a poll után a szálon marad: []"}, {"mode": "instrument", "task": 1, "poll": 2, "before": [], "during": ["kérés{id=1}"], "after": [], "out": [" INFO kérés{id=1}: kezdet", " INFO kérés{id=2}: kezdet", " INFO kérés{id=2}: vég", " INFO kérés{id=1}: vég"], "wrong": false, "line": 12, "msg": "T1 poll#2: a szál span-verme az eseménykor [kérés{id=1}] → „INFO kérés{id=1}: vég”; a poll után a szálon marad: []"}]};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 270"); svg.innerHTML = "";
  const tasks = [1, 2];
  el("text", {x: 20, y: 24, "font-size": 14, "font-weight": "bold"}, s.mode === "enter" ? "enter() guard: a span a szálhoz kötött" : ".instrument(span): pollonként be- és kilép");
  tasks.forEach((t, i) => {
    const on = s.task === t, y = 50 + i * 60;
    el("rect", {x: 20, y, width: 150, height: 44, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": t === 2 ? "6 4" : ""});
    el("text", {x: 95, y: y + 20, "text-anchor": "middle", "font-size": 14, "font-weight": on ? "bold" : "normal"}, `T${t}: kérés{id=${t}}`);
    el("text", {x: 95, y: y + 37, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, on ? `poll#${s.poll} (fut)` : "felfüggesztve / vár");
  });
  el("text", {x: 210, y: 46, "font-size": 12, fill: css("--muted")}, "a szál span-verme az eseménykor");
  s.during.forEach((sp, j) => {
    const y = 150 - j * 40, t2 = sp.indexOf("id=2") >= 0;
    el("rect", {x: 210, y, width: 170, height: 34, fill: t2 ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": 1.5, "stroke-dasharray": t2 ? "6 4" : ""});
    el("text", {x: 295, y: y + 22, "text-anchor": "middle", "font-size": 13}, sp);
  });
  el("line", {x1: 205, x2: 385, y1: 188, y2: 188, stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 210, y: 208, "font-size": 12, fill: css("--muted")}, "a poll után a szálon: [" + s.after.join(", ") + "]");
  el("text", {x: 420, y: 46, "font-size": 12, fill: css("--muted")}, "kimenet");
  s.out.forEach((ln, j) => {
    const y = 72 + j * 26, last = j === s.out.length - 1, bad = ln.split(":").length > 2;
    const tx = el("text", {x: 420, y, "font-size": 13, style: "font-family:ui-monospace,monospace", "font-weight": last ? "bold" : "normal"}, ln.trim());
    if (bad){ const pre = ln.trim().slice(0, ln.trim().lastIndexOf(":") + 1); const w = tx.getSubStringLength ? tx.getSubStringLength(0, pre.length) : 8 * pre.length; el("line", {x1: 420, x2: 420 + w, y1: y + 5, y2: y + 5, stroke: css("--hl2"), "stroke-width": 3}); }
  });
  if (s.wrong) el("text", {x: 420, y: 182, "font-size": 13, fill: css("--hl2")}, "hibás: T2 eseménye T1 spanje alá került");
  el("text", {x: 20, y: 250, "font-size": 12, fill: css("--muted")}, "Sorrend (a könyv kimenete szerint): T1 poll#1 → T2 poll#1 → T2 poll#2 → T1 poll#2; egyszálú runtime, modell.");
}
function setMode(m){ document.getElementById("mE").setAttribute("aria-pressed", m === "enter"); document.getElementById("mI").setAttribute("aria-pressed", m !== "enter"); setSteps(ALTS[m]); }
document.getElementById("mE").onclick = () => setMode("enter");
document.getElementById("mI").onclick = () => setMode("instrument");


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
