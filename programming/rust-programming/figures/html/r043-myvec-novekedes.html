<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyVec növekedése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>érték <input id="val" value="f" size="3" maxlength="3" aria-label="új elem értéke"></label><button id="bPush">push</button><button id="bDrop">drop</button><button id="bReset">alaphelyzet</button><span class="small">legfeljebb 9 elem</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A MyVec első pushkor 4 elemes puffert foglal, az ötödik pushkor realloc-kal 8 eleműre bővít; a len utáni cellák inicializálatlanok."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: a címek nem valósak, a realloc helyben is bővíthet. A len/cap értékeket és az 5 droppolást a fejezet MyVec-vázlatával rustc 1.99.1 alatt futtatva ellenőriztük.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"vals": [], "len": 0, "cap": 0, "blk": null, "old": null, "dropped": false, "freed": false, "line": 0, "msg": "new(): ptr = dangling, len = 0, cap = 0 – nincs puffer"}, {"vals": ["a"], "len": 1, "cap": 4, "blk": "A", "old": null, "dropped": false, "freed": false, "line": 9, "msg": "push(\"a\"): len == cap → grow: alloc(Layout::array::<String>(4)) – új blokk A; write a 0. cellába; len = 1, cap = 4, 3 uninit cella"}, {"vals": ["a", "b"], "len": 2, "cap": 4, "blk": "A", "old": null, "dropped": false, "freed": false, "line": 4, "msg": "push(\"b\"): len < cap, nincs grow; write a 1. cellába; len = 2, cap = 4"}, {"vals": ["a", "b", "c"], "len": 3, "cap": 4, "blk": "A", "old": null, "dropped": false, "freed": false, "line": 4, "msg": "push(\"c\"): len < cap, nincs grow; write a 2. cellába; len = 3, cap = 4"}, {"vals": ["a", "b", "c", "d"], "len": 4, "cap": 4, "blk": "A", "old": null, "dropped": false, "freed": false, "line": 4, "msg": "push(\"d\"): len < cap, nincs grow; write a 3. cellába; len = 4, cap = 4"}, {"vals": ["a", "b", "c", "d", "e"], "len": 5, "cap": 8, "blk": "B", "old": {"cap": 4, "vals": ["a", "b", "c", "d"], "blk": "A"}, "dropped": false, "freed": false, "line": 11, "msg": "push(\"e\"): len == cap → grow: realloc 4 → 8 elemre; az elemek bitmásolással átkerülnek a B blokkba, a régi A blokk és minden rá mutató pointer érvénytelen; len = 5, cap = 8"}, {"vals": ["a", "b", "c", "d", "e"], "len": 5, "cap": 8, "blk": "B", "old": null, "dropped": true, "freed": true, "line": 16, "msg": "drop: drop_in_place([0, 5)) – 5 String droppolódik, majd dealloc felszabadítja a 8 elemes puffert"}];
const CODE = ["pub fn new() -> Self { Self { ptr: NonNull::dangling(), len: 0, cap: 0 } }   // (nem ZST)", "pub fn push(&mut self, value: T) {", "    if self.len == self.cap { self.grow(); }", "    // SAFETY: len < cap, ezért a ptr.offset(len) a pufferen belül van; a célhely inicializálatlan.", "    unsafe { self.ptr.as_ptr().add(self.len).write(value); }", "    self.len += 1;", "}", "fn grow(&mut self) {   // new_cap = 4, ha cap == 0, különben 2 * cap", "    // SAFETY: size_of::<T>() > 0 és new_cap >= 4, ezért new_layout.size() > 0.", "    if self.cap == 0 { p = alloc::alloc(new_layout) }", "    // SAFETY: a self.ptr ezzel az old_layout-tal lett allokálva; a régi pointert nem használjuk többé.", "    else { p = alloc::realloc(self.ptr.as_ptr() as *mut u8, old_layout, new_layout.size()) }", "    self.ptr = NonNull::new(p).unwrap(); self.cap = new_cap;", "}", "fn drop(&mut self) {", "    // SAFETY: a [0, len) elemek érvényesek, inicializáltak, mindegyik pontosan egyszer dropolódik.", "    ptr::drop_in_place(ptr::slice_from_raw_parts_mut(self.ptr.as_ptr(), self.len));", "    alloc::dealloc(self.ptr.as_ptr() as *mut u8, layout);   // SAFETY: ugyanazzal a layouttal foglaltuk", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CODEL = {NEW: 0, WRITE: 4, ALLOC: 9, REALLOC: 11, DROP: 16}, BLK = "ABCDEFGH";
function build(vals, withDrop){
  const st = []; let len = 0, cap = 0, nblk = 0; const buf = [];
  st.push({vals: [], len: 0, cap: 0, blk: null, old: null, dropped: false, freed: false, line: CODEL.NEW, msg: "new(): ptr = dangling, len = 0, cap = 0 – nincs puffer"});
  for (const v of vals){
    let old = null, kind = "-";
    if (len === cap){ const nc = cap === 0 ? 4 : cap * 2; if (cap === 0) kind = "alloc"; else { kind = "realloc"; old = {cap, vals: buf.slice(), blk: BLK[nblk - 1]}; } cap = nc; nblk += 1; }
    buf.push(v); len += 1;
    let msg, line;
    if (kind === "alloc"){ msg = `push("${v}"): len == cap → grow: alloc(Layout::array::<String>(${cap})) – új blokk ${BLK[nblk - 1]}; write a 0. cellába; len = ${len}, cap = ${cap}, ${cap - len} uninit cella`; line = CODEL.ALLOC; }
    else if (kind === "realloc"){ msg = `push("${v}"): len == cap → grow: realloc ${old.cap} → ${cap} elemre; az elemek bitmásolással átkerülnek a ${BLK[nblk - 1]} blokkba, a régi ${old.blk} blokk és minden rá mutató pointer érvénytelen; len = ${len}, cap = ${cap}`; line = CODEL.REALLOC; }
    else { msg = `push("${v}"): len < cap, nincs grow; write a ${len - 1}. cellába; len = ${len}, cap = ${cap}`; line = CODEL.WRITE; }
    st.push({vals: buf.slice(), len, cap, blk: BLK[nblk - 1], old, dropped: false, freed: false, line, msg});
  }
  if (withDrop) st.push({vals: buf.slice(), len, cap, blk: nblk ? BLK[nblk - 1] : null, old: null, dropped: true, freed: cap > 0, line: CODEL.DROP,
    msg: `drop: drop_in_place([0, ${len})) – ${len} String droppolódik, majd ` + (cap ? `dealloc felszabadítja a ${cap} elemes puffert` : "nincs mit felszabadítani")});
  return st;
}

let myVals = ["a", "b", "c", "d", "e"];
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  const X0 = 170, CW = Math.min(40, 560 / Math.max(s.cap, 1));
  el("text", {x: 20, y: 30, "font-size": 13, "font-weight": "bold"}, "v (verem)");
  ["ptr", "len = " + s.len, "cap = " + s.cap].forEach((f, k) => {
    el("rect", {x: 20, y: 40 + k * 34, width: 110, height: 30, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: 75, y: 60 + k * 34, "text-anchor": "middle", "font-size": 14}, f);
  });
  if (s.cap === 0){ el("text", {x: 150, y: 60, "font-size": 14, "font-style": "italic"}, "→ dangling (nincs puffer)"); return; }
  if (s.old){
    const yo = 40;
    for (let i = 0; i < s.old.cap; i++){ el("rect", {x: X0 + i * CW, y: yo, width: CW, height: 32, fill: css("--bg"), stroke: css("--muted"), "stroke-dasharray": "4 3"}); el("text", {x: X0 + i * CW + CW / 2, y: yo + 21, "text-anchor": "middle", "font-size": 14, fill: css("--muted")}, s.old.vals[i]); }
    el("text", {x: X0 + s.old.cap * CW + 10, y: yo + 21, "font-size": 13}, `régi ${s.old.blk} blokk: érvénytelen (régi ptr ✗)`);
    el("line", {x1: 130, y1: 55, x2: X0 - 2, y2: yo + 16, stroke: css("--muted"), "stroke-dasharray": "5 4", "stroke-width": 1.5});
    el("text", {x: X0 + 2, y: 116, "font-size": 12, fill: css("--muted")}, "↓ realloc: bitmásolás");
  }
  const y = 140;
  {
    for (let i = 0; i < s.cap; i++){
      const init = i < s.len && !s.dropped;
      el("rect", {x: X0 + i * CW, y, width: CW, height: 36, fill: init ? css("--cellhl") : (s.dropped ? css("--bg") : "url(#hu)"), stroke: s.dropped ? css("--muted") : css("--line"), "stroke-dasharray": s.dropped ? "4 3" : ""});
      if (i < s.len) el("text", {x: X0 + i * CW + CW / 2, y: y + 24, "text-anchor": "middle", "font-size": 15, fill: s.dropped ? css("--muted") : css("--fg"), "text-decoration": s.dropped ? "line-through" : ""}, s.vals[i]);
      el("text", {x: X0 + i * CW + CW / 2, y: y + 52, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    }
  }
  const defs = el("defs", {}); const p = document.createElementNS(NS, "pattern"); p.setAttribute("id", "hu"); p.setAttribute("width", 6); p.setAttribute("height", 6); p.setAttribute("patternUnits", "userSpaceOnUse");
  const q = document.createElementNS(NS, "path"); q.setAttribute("d", "M0,6 L6,0"); q.setAttribute("stroke", css("--muted")); p.appendChild(q); defs.appendChild(p);
  if (!s.dropped){
  el("line", {x1: X0 + s.len * CW, x2: X0 + s.len * CW, y1: y - 12, y2: y + 46, stroke: css("--hl"), "stroke-width": 4});
  el("text", {x: X0 + s.len * CW, y: y - 16, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "len");
  el("line", {x1: X0 + s.cap * CW, x2: X0 + s.cap * CW, y1: y - 12, y2: y + 46, stroke: css("--line"), "stroke-width": 1.5});
  if (s.cap !== s.len) el("text", {x: X0 + s.cap * CW, y: y - 16, "text-anchor": "middle", "font-size": 12}, "cap");
  }
  el("text", {x: X0, y: y + 76, "font-size": 13}, `${s.blk} blokk (kupac), ${s.cap} × String` + (s.dropped ? " – elemek droppolva, puffer felszabadítva (dealloc)" : ""));
  el("line", {x1: 130, y1: 55, x2: X0 - 2, y2: y + 18, stroke: s.dropped ? css("--muted") : css("--fg"), "stroke-width": 2, "stroke-dasharray": s.dropped ? "5 4" : ""});
  el("text", {x: 20, y: 280, "font-size": 12, fill: css("--muted")}, `invariáns: len (${s.len}) ≤ cap (${s.cap}); [0, len) inicializált, a többi uninit`);
}
function reb(){ setSteps(build(myVals, false)); show(STEPS.length - 1); }
document.getElementById("bPush").onclick = () => { if (myVals.length >= 9) return; const v = (document.getElementById("val").value || "x").slice(0, 3); myVals = myVals.concat([v]); document.getElementById("val").value = String.fromCharCode(97 + myVals.length % 26); reb(); };
document.getElementById("bDrop").onclick = () => { setSteps(build(myVals, true)); show(STEPS.length - 1); };
document.getElementById("bReset").onclick = () => { myVals = ["a", "b", "c", "d", "e"]; document.getElementById("val").value = "f"; setSteps(build(myVals, true)); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
