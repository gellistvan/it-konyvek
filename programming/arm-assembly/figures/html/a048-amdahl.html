<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amdahl-modell</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>p <input type="range" id="p" min="0" max="0.99" step="0.01" value="0.95" style="width:180px"></label> <b id="pv" class="mono"></b>
 <label>s <input type="range" id="s" min="1" max="16" step="1" value="4" style="width:140px"></label> <b id="sv" class="mono"></b>
 <label>mért S <input type="text" id="sm" value="2,31" style="width:5em"></label>
 <button class="ex" data-p="0.90">p = 0,90</button><button class="ex" data-p="0.95">p = 0,95</button><button class="ex" data-p="0.98">p = 0,98</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 330" role="img" aria-label="S(p) görbe a választott s-sel és s végtelen határral, a mért S vízszintes vonala"></svg>

<p class="small">Számított modellgörbe, nem mérés. A 2,31× a fejezet hipotetikus számpéldája. Ellenőrzés: S = 2,31, p = 0,90 → s_eff ≈ 2,70; p = 0,95 → 2,48; p = 0,98 → 2,37.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


const svgV = $("v");
const S = (p, s) => 1 / ((1 - p) + p / s);
function f(x, d){ return x.toFixed(d).replace(".", ","); }
function draw(){
  const p = +$("p").value, s = +$("s").value, sm = Number($("sm").value.replace(",", "."));
  $("pv").textContent = f(p, 2); $("sv").textContent = s;
  svgV.innerHTML = "";
  const X = x => 60 + x * 660, Y = y => 300 - (y - 1) / 19 * 280;
  for (let y = 1; y <= 20; y += (y < 5 ? 1 : 5)) { mk(svgV, "line", {x1: 60, y1: Y(y), x2: 720, y2: Y(y), stroke: css("--grid")}); mk(svgV, "text", {x: 52, y: Y(y) + 4, "text-anchor": "end", "font-size": 11}, String(y)); }
  for (let x = 0; x <= 1.001; x += 0.1) mk(svgV, "text", {x: X(x), y: 318, "text-anchor": "middle", "font-size": 11}, f(x, 1));
  let d1 = "", d2 = "";
  for (let i = 0; i <= 99; i++) { const x = i / 100; d1 += (i ? "L" : "M") + X(x) + " " + Y(S(x, s));
    const yi = 1 / (1 - x); if (yi <= 20) d2 += (d2 ? "L" : "M") + X(x) + " " + Y(yi); }
  mk(svgV, "path", {d: d2, fill: "none", stroke: css("--muted"), "stroke-width": 2, "stroke-dasharray": "7 5"});
  mk(svgV, "path", {d: d1, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  if (isFinite(sm) && sm >= 1 && sm <= 20) { mk(svgV, "line", {x1: 60, y1: Y(sm), x2: 720, y2: Y(sm), stroke: css("--fg"), "stroke-dasharray": "2 4", "stroke-width": 2});
    mk(svgV, "text", {x: 66, y: Y(sm) - 6, "font-size": 12}, "mért S = " + f(sm, 2)); }
  mk(svgV, "circle", {cx: X(p), cy: Y(S(p, s)), r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 3});
  mk(svgV, "text", {x: 70, y: 20, "font-size": 12}, "folytonos: S(p) s = " + s + " mellett; szaggatott: s → ∞ határ 1/(1−p); y ≤ 20");
  let msg = "S_Amdahl(p = " + f(p, 2) + ", s = " + s + ") = " + f(S(p, s), 2) + "×; határ s → ∞: " + f(1 / (1 - p), 2) + "×.";
  if (!isFinite(sm) || sm <= 0) msg += " Adj meg pozitív mért S-t.";
  else { const den = 1 / sm - (1 - p);
    msg += den <= 0 ? " Figyelem: 1/S ≤ 1 − p, a mért S nem érhető el ezzel a p-vel (nincs értelmes s_eff)." : " Visszaszámolt s_eff = " + f(p / den, 2) + " (modellbe illesztett szám, nem mérés)."; }
  $("status").textContent = msg;
}
["p", "s", "sm"].forEach(id => $(id).addEventListener("input", draw));
document.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("p").value = b.dataset.p; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
