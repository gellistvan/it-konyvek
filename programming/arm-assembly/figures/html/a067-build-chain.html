<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-firmware build- és betöltési lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="show(4)">run</button><button onclick="show(5)">debug</button><span class="small">Kattints egy dobozra a parancsért.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Források fordítása objektumokká, linkelés ELF-be a lab-mps2.ld-vel, objcopy .bin-be; a QEMU az ELF-et LMA szerint vagy a .bin-t 0-tól tölti, a GDB az ELF szimbólumait használja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A receptek betű szerint a 16.7 lab-Makefile-jából; a kibontott parancsokat a szkript a Makefile változóiból állítja elő. Az ellenőrző parancsok a fejezet eszközei (objdump -h, size -A, xxd).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": 0, "line": 0, "msg": "lab-startup.s, lab-main.c: recept „(források)”"}, {"node": 1, "line": 1, "msg": "lab-startup.o, lab-main.o: recept „$(CC) $(CFLAGS) -c $< -o $@”"}, {"node": 2, "line": 2, "msg": "lab-firmware.elf (+ .map): recept „$(CC) $(LDFLAGS) $(OBJS) -o $@”"}, {"node": 3, "line": 3, "msg": "lab-firmware.bin: recept „$(OBJCOPY) -O binary $< $@”"}, {"node": 4, "line": 4, "msg": "make run: recept „$(QEMU) -kernel lab-firmware.elf </dev/null”"}, {"node": 5, "line": 5, "msg": "make debug: recept „$(QEMU) -kernel lab-firmware.elf -S -gdb tcp::3333 </dev/null”"}];
const CODE = ["lab-startup.s, lab-main.c: (források)", "lab-startup.o, lab-main.o: $(CC) $(CFLAGS) -c $< -o $@", "lab-firmware.elf (+ .map): $(CC) $(LDFLAGS) $(OBJS) -o $@", "lab-firmware.bin: $(OBJCOPY) -O binary $< $@", "make run: $(QEMU) -kernel lab-firmware.elf </dev/null", "make debug: $(QEMU) -kernel lab-firmware.elf -S -gdb tcp::3333 </dev/null"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = [{"id": "src", "label": "lab-startup.s, lab-main.c", "recipe": "(források)", "cmd": "", "check": "ls -l lab-startup.s lab-main.c"}, {"id": "obj", "label": "lab-startup.o, lab-main.o", "recipe": "$(CC) $(CFLAGS) -c $< -o $@", "cmd": "arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -ffreestanding -nostdlib -nostartfiles -O0 -g3 -Wall -c lab-startup.s -o lab-startup.o\narm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -ffreestanding -nostdlib -nostartfiles -O0 -g3 -Wall -c lab-main.c -o lab-main.o", "check": "arm-none-eabi-objdump -h lab-main.o"}, {"id": "elf", "label": "lab-firmware.elf (+ .map)", "recipe": "$(CC) $(LDFLAGS) $(OBJS) -o $@", "cmd": "arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -nostdlib -T lab-mps2.ld -Wl,-Map=lab-firmware.map -Wl,--gc-sections lab-startup.o lab-main.o -o lab-firmware.elf", "check": "arm-none-eabi-objdump -h lab-firmware.elf; arm-none-eabi-size -A lab-firmware.elf"}, {"id": "bin", "label": "lab-firmware.bin", "recipe": "$(OBJCOPY) -O binary $< $@", "cmd": "arm-none-eabi-objcopy -O binary lab-firmware.elf lab-firmware.bin", "check": "xxd lab-firmware.bin | head -4   # első szó: 00004020 = 0x20400000"}, {"id": "run", "label": "make run", "recipe": "$(QEMU) -kernel lab-firmware.elf </dev/null", "cmd": "qemu-system-arm -machine mps2-an385 -cpu cortex-m3 -semihosting -nographic -kernel lab-firmware.elf </dev/null", "check": "(kimenet: boot ok, majd kilépés)"}, {"id": "debug", "label": "make debug", "recipe": "$(QEMU) -kernel lab-firmware.elf -S -gdb tcp::3333 </dev/null", "cmd": "qemu-system-arm -machine mps2-an385 -cpu cortex-m3 -semihosting -nographic -kernel lab-firmware.elf -S -gdb tcp::3333 </dev/null", "check": "gdb-multiarch lab-firmware.elf -ex \"target remote :3333\""}];
function render(s){
  svg.setAttribute("viewBox","0 0 640 330");
  svg.innerHTML = "";
  const ln = css("--line"), hl = css("--hl2");
  const pos = [[20,20],[20,80],[20,140],[20,200],[340,140],[340,200]];
  const onPath = {run:[2,4], debug:[2,5]};
  const path = (s.node===4) ? onPath.run : (s.node===5 ? onPath.debug : []);
  NODES.forEach((n,i)=>{
    const [x,y] = pos[i], on = i===s.node || path.includes(i);
    const r = el("rect",{x:x,y:y,width:260,height:40,rx:i===0?14:0,fill:on?css("--cellhl"):css("--cell"),
       stroke:on?hl:ln,"stroke-width":on?3:1.2,"stroke-dasharray":(i===3)?"5 3":"none",style:"cursor:pointer",
       tabindex:0,role:"button","aria-label":n.label});
    r.addEventListener("click",()=>show(i));
    r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(i);}});
    const t = el("text",{x:x+130,y:y+25,"text-anchor":"middle","font-size":13,style:"font-family:ui-monospace,monospace"},n.label);
    t.style.pointerEvents="none";
  });
  [[0,1],[1,2],[2,3]].forEach(([a,b])=>el("line",{x1:150,y1:pos[a][1]+40,x2:150,y2:pos[b][1],stroke:ln,"stroke-width":1.5}));
  el("line",{x1:280,y1:160,x2:340,y2:160,stroke:path.length&&s.node===4?hl:ln,"stroke-width":2});
  el("line",{x1:280,y1:165,x2:340,y2:220,stroke:path.length&&s.node===5?hl:ln,"stroke-width":2});
  const n = NODES[s.node];
  const lines = (n.cmd||"").split("\n").concat(["ellenőrzés: "+n.check]);
  let y = 270;
  el("text",{x:20,y:258,"font-size":12,"font-weight":"bold"},"Kibontott parancs (a lab-Makefile változóival):");
  lines.forEach((l,i)=>{ const chunks = l.match(/.{1,92}(\s|$)/g)||[l]; chunks.forEach(c=>{
    el("text",{x:20,y:y+=16,"font-size":10.5,style:"font-family:ui-monospace,monospace"},c.trim()); }); });
  svg.setAttribute("viewBox","0 0 640 "+(y+12));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
