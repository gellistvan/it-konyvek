<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veremmélység beágyazott ISR-ekkel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="pp" checked> igazítási szó (P = 4 B)</label>
<label>szintek: <input id="lv" type="range" min="1" max="3" value="2" style="width:70px" aria-label="Beágyazott ISR-szintek száma"></label><span id="lvv">2</span>
<label>S_call: <input id="sc" type="range" min="0" max="128" step="8" value="64" style="width:100px" aria-label="A legfelső ISR hívási lánca bájtban"></label><span id="scv">64 B</span>
<script>
function upd(){ const lv = +document.getElementById("lv").value, p = document.getElementById("pp").checked ? 4 : 0,
  sc = +document.getElementById("sc").value; document.getElementById("lvv").textContent = lv;
  document.getElementById("scv").textContent = sc + " B"; const st = stepsFor(lv, p, sc); setSteps(st); show(st.length - 1); }
["pp", "lv", "sc"].forEach(i => document.getElementById(i).addEventListener("input", upd));
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Veremoszlop: main-lánc, ISR-szintenként igazítási szó, hardveres keret és prológus, majd hívási lánc"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított illusztráció a fejezet képletéből, nem mérés. A P = 4 B a legrosszabb eset feltételezése; az igazítási szó mindig a hardveres keret fölött (magasabb címen) áll.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. main, megszakítás nélkül: S_main = 64 = 64 B; SP = 0x203FFFC0", "line": 0, "upto": 0, "hl": [0], "ls": [["main-lánc (S_main)", 64, "main", 0], ["P1: igazítási szó", 4, "pad", 1], ["F_hw: 1. hardveres keret (R0…xPSR)", 32, "hw", 1], ["F_sw: 1. ISR prológusa", 8, "sw", 1], ["P2: igazítási szó", 4, "pad", 2], ["F_hw: 2. hardveres keret (R0…xPSR)", 32, "hw", 2], ["F_sw: 2. ISR prológusa", 8, "sw", 2], ["S_call: a 2. ISR hívási lánca", 64, "call", 2]], "cum": [64, 68, 100, 108, 112, 144, 152, 216]}, {"msg": "2. main + 1 beágyazott ISR: S_main = 64 + (32 + 4 + 8) = 108 B; SP = 0x203FFF94", "line": 1, "upto": 3, "hl": [1, 2, 3], "ls": [["main-lánc (S_main)", 64, "main", 0], ["P1: igazítási szó", 4, "pad", 1], ["F_hw: 1. hardveres keret (R0…xPSR)", 32, "hw", 1], ["F_sw: 1. ISR prológusa", 8, "sw", 1], ["P2: igazítási szó", 4, "pad", 2], ["F_hw: 2. hardveres keret (R0…xPSR)", 32, "hw", 2], ["F_sw: 2. ISR prológusa", 8, "sw", 2], ["S_call: a 2. ISR hívási lánca", 64, "call", 2]], "cum": [64, 68, 100, 108, 112, 144, 152, 216]}, {"msg": "3. main + 2 beágyazott ISR: S_main = 64 + (32 + 4 + 8) + (32 + 4 + 8) = 152 B; SP = 0x203FFF68", "line": 2, "upto": 6, "hl": [4, 5, 6], "ls": [["main-lánc (S_main)", 64, "main", 0], ["P1: igazítási szó", 4, "pad", 1], ["F_hw: 1. hardveres keret (R0…xPSR)", 32, "hw", 1], ["F_sw: 1. ISR prológusa", 8, "sw", 1], ["P2: igazítási szó", 4, "pad", 2], ["F_hw: 2. hardveres keret (R0…xPSR)", 32, "hw", 2], ["F_sw: 2. ISR prológusa", 8, "sw", 2], ["S_call: a 2. ISR hívási lánca", 64, "call", 2]], "cum": [64, 68, 100, 108, 112, 144, 152, 216]}, {"msg": "4. + 64 B-os hívási lánc a 2. ISR-ből: S_main = 64 + (32 + 4 + 8) + (32 + 4 + 8) + 64 = 216 B; SP = 0x203FFF28", "line": 3, "upto": 7, "hl": [7], "ls": [["main-lánc (S_main)", 64, "main", 0], ["P1: igazítási szó", 4, "pad", 1], ["F_hw: 1. hardveres keret (R0…xPSR)", 32, "hw", 1], ["F_sw: 1. ISR prológusa", 8, "sw", 1], ["P2: igazítási szó", 4, "pad", 2], ["F_hw: 2. hardveres keret (R0…xPSR)", 32, "hw", 2], ["F_sw: 2. ISR prológusa", 8, "sw", 2], ["S_call: a 2. ISR hívási lánca", 64, "call", 2]], "cum": [64, 68, 100, 108, 112, 144, 152, 216]}];
const CODE = ["S_wc = S_main", "     + Σ_i (F_hw + P_i + F_sw,i)        (beágyazott ISR-szintek)", "     + …", "     + S_call,k                       (a legfelső ISR hívási lánca)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function layersJ(levels, p, sc){
  const out = [["main-lánc (S_main)", 64, "main", 0]];
  for (let i = 1; i <= levels; i++) { if (p) out.push([`P${i}: igazítási szó`, p, "pad", i]);
    out.push([`F_hw: ${i}. hardveres keret (R0…xPSR)`, 32, "hw", i]); out.push([`F_sw: ${i}. ISR prológusa`, 8, "sw", i]); }
  if (sc) out.push([`S_call: a ${levels}. ISR hívási lánca`, sc, "call", levels]);
  return out;
}
function stepsFor(levels, p, sc){
  const ls = layersJ(levels, p, sc); let t = 0; const cum = ls.map(x => (t += x[1]));
  const idx = [0];
  for (let lev = 1; lev <= levels; lev++) { let m = 0; ls.forEach((x, i) => { if (x[3] === lev && ["pad","hw","sw"].includes(x[2])) m = i; }); idx.push(m); }
  if (sc) idx.push(ls.length - 1);
  const out = [], terms = [];
  idx.forEach((last, k) => {
    let what;
    if (k === 0) { terms.push("S_main = 64"); what = "main, megszakítás nélkül"; }
    else if (k <= levels) { terms.push(`(32 + ${p} + 8)`); what = `main + ${k} beágyazott ISR`; }
    else { terms.push(`${sc}`); what = `+ ${sc} B-os hívási lánc a ${levels}. ISR-ből`; }
    const sp = (0x20400000 - cum[last]).toString(16).toUpperCase().padStart(8, "0");
    const hl = []; for (let i = k ? idx[k - 1] + 1 : 0; i <= last; i++) hl.push(i);
    out.push({msg: `${k + 1}. ${what}: ${terms.join(" + ")} = ${cum[last]} B; SP = 0x${sp}`, line: Math.min(k, 3), upto: last, hl, ls, cum});
  });
  return out;
}
function render(s){
  svg.innerHTML = "";
  const total = s.cum[s.cum.length - 1], sc = Math.min(1.25, 330 / total), x = 190, w = 170, top = 40;
  svg.setAttribute("viewBox", "0 0 560 " + (top + total * sc + 50));
  el("text", {x: x + w / 2, y: 22, "text-anchor": "middle", "font-size": 12}, "_estack = 0x20400000 (magasabb cím ↑)");
  let y = top;
  s.ls.forEach(([n, sz, kind, lev], i) => {
    const h = sz * sc, vis = i <= s.upto, on = s.hl.includes(i);
    const a = {x, y, width: w, height: h, fill: !vis ? css("--bg") : (kind === "main" ? css("--cellhl") : css("--cell")),
      stroke: vis ? (on ? css("--hl") : css("--line")) : css("--muted"), "stroke-width": on ? 3 : (kind === "hw" ? 2 : 1)};
    if (kind === "sw") a["stroke-dasharray"] = "2 3";
    if (!vis) a["stroke-dasharray"] = "1 4";
    el("rect", a);
    if (vis && kind === "pad") for (let q = 0; q < w; q += 8) el("line", {x1: x + q, y1: y + h, x2: x + q + h, y2: y, stroke: css("--muted")});
    if (vis && kind === "call") for (let q = 6; q < h; q += 6) el("line", {x1: x, y1: y + q, x2: x + w, y2: y + q, stroke: css("--muted"), "stroke-width": 0.6});
    if (vis) el("text", {x: kind === "pad" ? x - 6 : x + w / 2, y: y + h / 2 + 4, "text-anchor": kind === "pad" ? "end" : "middle",
      "font-size": 11, "font-weight": on ? "bold" : "normal"}, kind === "pad" ? `P = ${sz} B` : `${n.split(":")[0]} = ${sz} B`);
    y += h;
    if (vis && s.ls.length && (i === s.upto)) {
      el("line", {x1: 60, y1: y, x2: x, y2: y, stroke: css("--hl"), "stroke-width": 2.5});
      el("text", {x: 60, y: y - 5, "font-size": 12, fill: css("--hl"), "font-weight": "bold"}, "SP →");
      el("text", {x: x + w + 8, y: y + 4, "font-size": 13, "font-weight": "bold"}, s.cum[i] + " B");
    }
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
