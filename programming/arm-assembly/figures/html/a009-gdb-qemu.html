<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QEMU-gdbstub és GDB két terminálban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label class="small">B terminál: (gdb) <input id="cmd" size="28" aria-label="GDB-parancs begépelése" placeholder="x/i $pc"></label><button id="send">Küldés</button><script>window.addEventListener("load",function(){var CM=["x/i $pc", "info registers x0 x1 x8 pc", "stepi", "info registers x0 x1 pc", "stepi", "info registers x8", "continue", "quit"];var inp=document.getElementById("cmd");function go(){var v=inp.value.trim().replace(/\s+/g," ");var want=CM[k];if(k>=CM.length){status.textContent="A munkamenet véget ért (⏮ az elejére).";return;}if(v===want){stop();show(k+1);inp.value="";}else{status.textContent="A táblázat következő parancsa: "+want;}}document.getElementById("send").onclick=go;inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.stopPropagation();go();}e.stopPropagation();});});</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szimulált A és B terminál; a GDB-parancsok hatására frissül a _start listázása a PC-nyíllal és az X0, X1, X8, PC regiszter."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Lépés ▶ = a következő parancs elküldése (vagy gépeld be a mezőbe). Az értékeket a 3.4.5 öt utasítása adja keystone + unicorn alatt futtatva; a GDB-kimenet formája egyszerűsített, a címek _start-relatívak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a GDB a QEMU-hoz kapcsolódott, a töréspontnál (_start+8) áll – az add előtt: X0 = 0, X1 = 7; X8 még nem definiált (korábbi érték).", "line": -1, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 8, "done": false, "regs": {"x0": "0x0 (0)", "x1": "0x7 (7)", "x8": "?", "pc": "_start+8"}, "changed": []}, {"msg": "x/i $pc: a következő utasítás az add – a töréspont az utasítás ELŐTT áll meg.", "line": 0, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 8, "done": false, "regs": {"x0": "0x0 (0)", "x1": "0x7 (7)", "x8": "?", "pc": "_start+8"}, "changed": []}, {"msg": "info registers x0 x1 x8 pc: a vendég AArch64 regiszterei a QEMU gdbstubtól (nem a host regiszterei).", "line": 1, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 8, "done": false, "regs": {"x0": "0x0 (0)", "x1": "0x7 (7)", "x8": "?", "pc": "_start+8"}, "changed": []}, {"msg": "stepi: egy gépi utasítás végrehajtva; PC = _start+12.", "line": 2, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 12, "done": false, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "?", "pc": "_start+12"}, "changed": ["x0", "pc"]}, {"msg": "info registers x0 x1 pc: a vendég AArch64 regiszterei a QEMU gdbstubtól (nem a host regiszterei).", "line": 3, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93", "(gdb) info registers x0 x1 pc", "x0   0x7   7", "x1   0x7   7", "pc   <_start+12>"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 12, "done": false, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "?", "pc": "_start+12"}, "changed": []}, {"msg": "stepi: egy gépi utasítás végrehajtva; PC = _start+16.", "line": 4, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93", "(gdb) info registers x0 x1 pc", "x0   0x7   7", "x1   0x7   7", "pc   <_start+12>", "(gdb) stepi", "<_start+16>  svc #0"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 16, "done": false, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "0x5d (93)", "pc": "_start+16"}, "changed": ["x8", "pc"]}, {"msg": "info registers x8: a vendég AArch64 regiszterei a QEMU gdbstubtól (nem a host regiszterei).", "line": 5, "a": ["(vár a GDB-re …)", "(a töréspontnál áll: _start+8)"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93", "(gdb) info registers x0 x1 pc", "x0   0x7   7", "x1   0x7   7", "pc   <_start+12>", "(gdb) stepi", "<_start+16>  svc #0", "(gdb) info registers x8", "x8   0x5d   93"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 16, "done": false, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "0x5d (93)", "pc": "_start+16"}, "changed": []}, {"msg": "continue: a svc #0 lefut (exit, X0 = 7); a GDB oktálisan írja ki: exited with code 07; az A terminál: Kilépési állapot: 7.", "line": 6, "a": ["(vár a GDB-re …)", "Kilépési állapot: 7"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93", "(gdb) info registers x0 x1 pc", "x0   0x7   7", "x1   0x7   7", "pc   <_start+12>", "(gdb) stepi", "<_start+16>  svc #0", "(gdb) info registers x8", "x8   0x5d   93", "(gdb) continue", "Continuing.", "[Inferior 1 (process …) exited with code 07]"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 16, "done": true, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "0x5d (93)", "pc": "_start+16"}, "changed": []}, {"msg": "quit: kilépés a GDB-ből.", "line": 7, "a": ["(vár a GDB-re …)", "Kilépési állapot: 7"], "b": ["(gdb) target remote localhost:1234", "(gdb) break *_start+8", "(gdb) continue", "Breakpoint 1, <_start+8>", "(gdb) x/i $pc", "=> <_start+8>:  add x0, x0, x1", "(gdb) info registers x0 x1 x8 pc", "x0   0x0   0", "x1   0x7   7", "x8   (korábbi érték – ne alapozz rá)", "pc   <_start+8>", "(gdb) stepi", "<_start+12>  mov x8, #93", "(gdb) info registers x0 x1 pc", "x0   0x7   7", "x1   0x7   7", "pc   <_start+12>", "(gdb) stepi", "<_start+16>  svc #0", "(gdb) info registers x8", "x8   0x5d   93", "(gdb) continue", "Continuing.", "[Inferior 1 (process …) exited with code 07]", "(gdb) quit"], "src": ["mov x0, #0", "mov x1, #7", "add x0, x0, x1", "mov x8, #93", "svc #0"], "pc": 16, "done": true, "regs": {"x0": "0x7 (7)", "x1": "0x7 (7)", "x8": "0x5d (93)", "pc": "_start+16"}, "changed": []}];
const CODE = ["(gdb) x/i $pc", "(gdb) info registers x0 x1 x8 pc", "(gdb) stepi", "(gdb) info registers x0 x1 pc", "(gdb) stepi", "(gdb) info registers x8", "(gdb) continue", "(gdb) quit"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 720 330");
  svg.innerHTML = "";
  const MONO = "font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre";
  const line = css("--line"), hl = css("--hl2"), mut = css("--muted"), fg = css("--fg");
  const T = (x, y, txt, o) => el("text", Object.assign({x: x, y: y, "font-size": 12, style: MONO}, o || {}), txt);
  // A terminál
  el("rect", {x: 4, y: 4, width: 410, height: 92, fill: css("--code"), stroke: line});
  el("text", {x: 12, y: 20, "font-size": 12.5, "font-weight": "bold"}, "A terminál – qemu-aarch64 -g 1234 ./lab-tools");
  s.a.forEach((l, i) => T(12, 40 + i * 16, l));
  // B terminál
  el("rect", {x: 4, y: 104, width: 410, height: 220, fill: css("--code"), stroke: line});
  el("text", {x: 12, y: 120, "font-size": 12.5, "font-weight": "bold"}, "B terminál – gdb-multiarch -q ./lab-tools");
  const lines = s.b.slice(-12);
  lines.forEach((l, i) => T(12, 140 + i * 15, l, l.startsWith("(gdb)") ? {"font-weight": "bold"} : {fill: fg}));
  // jobb: listázás + regiszterek
  el("text", {x: 430, y: 20, "font-size": 12.5, "font-weight": "bold"}, "_start (vendég AArch64)");
  s.src.forEach((ins, i) => {
    const y = 42 + i * 20;
    T(470, y, "+" + (4 * i).toString(16).padStart(2, "0") + "  " + ins);
    if (i === 2) el("circle", {cx: 440, cy: y - 4, r: 5, fill: "none", stroke: line, "stroke-width": 1.5});
    if (!s.done && 4 * i === s.pc) el("polygon", {points: `450,${y - 10} 450,${y + 2} 462,${y - 4}`, fill: hl});
  });
  const rows = [["X0", "x0"], ["X1", "x1"], ["X8", "x8"], ["PC", "pc"]];
  rows.forEach(([n, key], j) => {
    const y = 160 + j * 32, v = s.regs[key], ch = s.changed.includes(key), unk = v === "?";
    el("rect", {x: 430, y: y, width: 270, height: 26, fill: css("--cell"), stroke: ch ? hl : line,
      "stroke-width": ch ? 3 : 1, "stroke-dasharray": unk ? "2 3" : "none"});
    T(440, y + 18, n + " = " + v, unk ? {fill: mut} : {});
  });
  if (s.done) el("text", {x: 430, y: 300, "font-size": 12.5, fill: hl}, "kilépett: exited with code 07 = 7");
  el("text", {x: 430, y: 322, "font-size": 11, fill: mut}, "▶ PC   ○ töréspont   keret: változott");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
