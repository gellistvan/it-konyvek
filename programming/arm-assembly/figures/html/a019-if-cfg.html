<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az if-lánc és a guard vezérlési gráfja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>x = <input id="ix" value="15" size="6" style="font-family:monospace"></label><button type="button" onclick="runIf()">if-lánc lejátszása</button><button type="button" onclick="document.getElementById('ix').value=9;runIf()">x = 9</button><button type="button" onclick="document.getElementById('ix').value=30;runIf()">x = 30</button><span>| guard:</span><label>LAB_CASE <select id="gc"><option value="0">0 (NULL)</option><option value="1">1 ("")</option><option value="2" selected>2 ("A")</option></select></label><label><input type="checkbox" id="gs"> felcserélt sorrend</label><button type="button" onclick="runGuard()">guard lejátszása</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az if-lánc alapblokkjai a 11/22/33/44 eredményekkel és a kimaradó összehasonlításokkal; a guard-mintában a betöltés csak a nem-NULL ágon érhető el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A modellt a fejezet táblázatának bemeneteire (−1, 9, 10, 15, 19, 20, 30, 50) és a guard hat változatára unicorn-futtatással vetettük össze; a felcserélt LAB_CASE=0 eset az unicornban olvasási hibával áll meg (a fejezet mérése: SIGSEGV, 139).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "x = 15: B0 (cmp #0)", "line": 0, "mode": "if", "node": "B0", "path": ["B0"], "skip": []}, {"msg": "x = 15: B1 (cmp #10)", "line": 1, "mode": "if", "node": "B1", "path": ["B0", "B1"], "skip": []}, {"msg": "x = 15: B2 (cmp #19)", "line": 2, "mode": "if", "node": "B2", "path": ["B0", "B1", "B2"], "skip": []}, {"msg": "x = 15: .Linterval", "line": 7, "mode": "if", "node": "r22", "path": ["B0", "B1", "B2", "r22"], "skip": []}, {"msg": "x = 15: .Lexit → állapot 22", "line": 9, "mode": "if", "node": "exit", "path": ["B0", "B1", "B2", "r22", "exit"], "skip": []}];
const CODE = ["B0:  mov w0, #LAB_X ; cmp w0, #0 ; b.lt .Lnegative", "B1:  cmp w0, #10 ; b.lt .Lspecial   // && bal oldala", "B2:  cmp w0, #19 ; b.le .Linterval", ".Lspecial: cmp w0, #30 ; b.eq .Lselected   // || bal oldala", "     cmp w0, #50 ; b.eq .Lselected", "     mov w0, #44 ; b .Lexit", ".Lnegative: mov w0, #11 ; b .Lexit", ".Linterval: mov w0, #22 ; b .Lexit", ".Lselected: mov w0, #33", ".Lexit: exit(w0)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const AN={"B0": {"x": 3.0, "y": 11.0, "sh": "d", "lab": "cmp w0,#0\nb.lt", "title": "B0: mov w0,#LAB_X"}, "B1": {"x": 3.0, "y": 9.4, "sh": "d", "lab": "cmp w0,#10\nb.lt", "title": "B1"}, "B2": {"x": 3.0, "y": 7.8, "sh": "d", "lab": "cmp w0,#19\nb.le", "title": "B2"}, "S1": {"x": 3.0, "y": 6.2, "sh": "d", "lab": "cmp w0,#30\nb.eq", "title": ".Lspecial"}, "S2": {"x": 3.0, "y": 4.6, "sh": "d", "lab": "cmp w0,#50\nb.eq", "title": ""}, "r44": {"x": 3.0, "y": 3.0, "sh": "r", "lab": "w0 = 44", "title": ""}, "r11": {"x": 6.9, "y": 11.0, "sh": "r", "lab": ".Lnegative\nw0 = 11", "title": ""}, "r22": {"x": 6.9, "y": 7.8, "sh": "r", "lab": ".Linterval\nw0 = 22", "title": ""}, "r33": {"x": 6.9, "y": 5.4, "sh": "r", "lab": ".Lselected\nw0 = 33", "title": ""}, "exit": {"x": 6.9, "y": 1.6, "sh": "r", "lab": ".Lexit\nexit(w0)", "title": ""}}, BN={"gp": {"x": 12.3, "y": 11.0, "sh": "r", "lab": "x0 = p", "title": "helyes sorrend"}, "gcbz0": {"x": 12.3, "y": 9.4, "sh": "d", "lab": "cbz x0", "title": ""}, "gldrb": {"x": 12.3, "y": 7.8, "sh": "m", "lab": "ldrb w1,[x0]", "title": ""}, "gcbz1": {"x": 12.3, "y": 6.2, "sh": "d", "lab": "cbz w1", "title": ""}, "gt1": {"x": 12.3, "y": 4.6, "sh": "r", "lab": "w0 = 1", "title": ""}, "gt0": {"x": 14.7, "y": 4.6, "sh": "r", "lab": "w0 = 0", "title": ""}, "hp": {"x": 18.0, "y": 11.0, "sh": "r", "lab": "x0 = p", "title": "felcserélt (HIBÁS)"}, "hldrb": {"x": 18.0, "y": 9.4, "sh": "m", "lab": "ldrb w1,[x0]", "title": ""}, "hcbz0": {"x": 18.0, "y": 7.8, "sh": "d", "lab": "cbz x0", "title": ""}, "hcbz1": {"x": 18.0, "y": 6.2, "sh": "d", "lab": "cbz w1", "title": ""}, "ht1": {"x": 18.0, "y": 4.6, "sh": "r", "lab": "w0 = 1", "title": ""}, "ht0": {"x": 20.3, "y": 4.6, "sh": "r", "lab": "w0 = 0", "title": ""}, "hseg": {"x": 20.5, "y": 9.4, "sh": "s", "lab": "SIGSEGV, 139", "title": ""}}, AE=[{"a": "B0", "b": "r11", "pts": [[4.35, 11.0], [5.65, 11.0]], "st": "taken", "lab": "x < 0", "lp": [5.0, 11.15]}, {"a": "B0", "b": "B1", "pts": [[3.0, 10.5], [3.0, 9.9]], "st": "fall", "lab": "", "lp": null}, {"a": "B1", "b": "S1", "pts": [[1.65, 9.4], [0.9, 9.4], [0.9, 6.2], [1.65, 6.2]], "st": "short", "lab": "", "lp": null}, {"a": "B1", "b": "B2", "pts": [[3.0, 8.9], [3.0, 8.3]], "st": "fall", "lab": "", "lp": null}, {"a": "B2", "b": "r22", "pts": [[4.35, 7.8], [5.65, 7.8]], "st": "taken", "lab": "x ≤ 19", "lp": [5.0, 7.95]}, {"a": "B2", "b": "S1", "pts": [[3.0, 7.3], [3.0, 6.7]], "st": "fall", "lab": "", "lp": null}, {"a": "S1", "b": "r33", "pts": [[4.35, 6.2], [6.9, 6.2], [6.9, 5.825]], "st": "short", "lab": "", "lp": null}, {"a": "S2", "b": "r33", "pts": [[4.35, 4.6], [6.9, 4.6], [6.9, 4.9750000000000005]], "st": "taken", "lab": "x = 50", "lp": [5.0, 4.75]}, {"a": "S2", "b": "r44", "pts": [[3.0, 4.1], [3.0, 3.425]], "st": "fall", "lab": "", "lp": null}, {"a": "r44", "b": "exit", "pts": [[3.0, 2.575], [3.0, 1.6], [5.65, 1.6]], "st": "taken", "lab": "", "lp": null}, {"a": "r11", "b": "exit", "pts": [[8.15, 11.0], [8.7, 11.0], [8.7, 1.6], [8.15, 1.6]], "st": "taken", "lab": "", "lp": null}, {"a": "r22", "b": null, "pts": [[8.15, 7.8], [8.7, 7.8], [8.7, 1.6], [8.15, 1.6]], "st": "taken", "lab": "", "lp": null}, {"a": "r33", "b": null, "pts": [[8.15, 5.4], [8.7, 5.4], [8.7, 1.6], [8.15, 1.6]], "st": "taken", "lab": "", "lp": null}], BE=[{"a": "gp", "b": "gcbz0", "to": "gcbz0", "pts": [[12.3, 10.575], [12.3, 9.9]], "st": "fall", "lab": "", "lp": null}, {"a": "gcbz0", "b": "gldrb", "to": "gldrb", "pts": [[12.3, 8.9], [12.3, 8.225]], "st": "fall", "lab": "p ≠ NULL", "lp": [12.5, 8.4]}, {"a": "gcbz0", "b": "gt0", "to": "gt0", "pts": [[13.65, 9.4], [14.7, 9.4], [14.7, 5.0249999999999995]], "st": "short", "lab": "NULL: a betöltés\nkimarad", "lp": [13.75, 9.62]}, {"a": "gldrb", "b": "gcbz1", "to": "gcbz1", "pts": [[12.3, 7.375], [12.3, 6.7]], "st": "fall", "lab": "", "lp": null}, {"a": "gcbz1", "b": null, "to": "gt0", "pts": [[13.65, 6.2], [14.7, 6.2]], "st": "taken", "lab": "*p = 0", "lp": [13.75, 6.35]}, {"a": "gcbz1", "b": "gt1", "to": "gt1", "pts": [[12.3, 5.7], [12.3, 5.0249999999999995]], "st": "fall", "lab": "", "lp": null}, {"a": "hp", "b": "hldrb", "to": "hldrb", "pts": [[18.0, 10.575], [18.0, 9.825000000000001]], "st": "fall", "lab": "", "lp": null}, {"a": "hldrb", "b": "hseg", "to": "hseg", "pts": [[19.0, 9.4], [19.5, 9.4]], "st": "short", "lab": "", "lp": null}, {"a": "hldrb", "b": "hcbz0", "to": "hcbz0", "pts": [[18.0, 8.975], [18.0, 8.3]], "st": "fall", "lab": "", "lp": null}, {"a": "hcbz0", "b": "ht0", "to": "ht0", "pts": [[19.35, 7.8], [20.3, 7.8], [20.3, 5.0249999999999995]], "st": "taken", "lab": "", "lp": null}, {"a": "hcbz0", "b": "hcbz1", "to": "hcbz1", "pts": [[18.0, 7.3], [18.0, 6.7]], "st": "fall", "lab": "", "lp": null}, {"a": "hcbz1", "b": null, "to": "ht0", "pts": [[19.35, 6.2], [20.3, 6.2]], "st": "taken", "lab": "", "lp": null}, {"a": "hcbz1", "b": "ht1", "to": "ht1", "pts": [[18.0, 5.7], [18.0, 5.0249999999999995]], "st": "fall", "lab": "", "lp": null}], NAMES={"B0": "B0 (cmp #0)", "B1": "B1 (cmp #10)", "B2": "B2 (cmp #19)", "S1": ".Lspecial (cmp #30)", "S2": "cmp #50", "r44": "w0 = 44", "r11": ".Lnegative", "r22": ".Linterval", "r33": ".Lselected", "exit": ".Lexit"}, ALINE={"B0": 0, "B1": 1, "B2": 2, "S1": 3, "S2": 4, "r44": 5, "r11": 6, "r22": 7, "r33": 8, "exit": 9};
function ifModel(x){ const path=["B0"], sk=[];
  if(x<0) return {path:path.concat(["r11","exit"]),sk:["B1","B2","S1","S2"],st:11};
  path.push("B1"); if(x<10) sk.push("B2"); else { path.push("B2"); if(x<=19) return {path:path.concat(["r22","exit"]),sk:["S1","S2"],st:22}; }
  path.push("S1"); if(x===30) return {path:path.concat(["r33","exit"]),sk:sk.concat(["S2"]),st:33};
  path.push("S2"); return {path:path.concat(x===50?["r33","exit"]:["r44","exit"]),sk:sk,st:x===50?33:44}; }
function ifSteps(x){ const m=ifModel(x), out=[], seen=[];
  m.path.forEach(n=>{ seen.push(n);
    const now=m.sk.filter(s=>(s==="B2"&&seen.includes("S1"))||(s==="S2"&&seen.includes("r33"))||(x<0&&n!=="B0"));
    let msg=`x = ${x}: ${NAMES[n]}`; if(n==="exit") msg+=` → állapot ${m.st}`; if(now.length) msg+="; kimaradt: "+now.map(s=>NAMES[s]).join(", ");
    out.push({msg:msg.replace("x = -","x = −"),line:ALINE[n],mode:"if",node:n,path:seen.slice(),skip:now}); });
  return out; }
function guardModel(c,sw){ const p=[sw?"hp":"gp"], g=sw?"h":"g";
  if(sw){ p.push("hldrb"); if(c===0){p.push("hseg");return {path:p,st:139};} p.push("hcbz0","hcbz1"); p.push(c===2?"ht1":"ht0"); return {path:p,st:c===2?1:0}; }
  p.push("gcbz0"); if(c===0){p.push("gt0");return {path:p,st:0};} p.push("gldrb","gcbz1"); p.push(c===2?"gt1":"gt0"); return {path:p,st:c===2?1:0}; }
function guardSteps(c,sw){ const m=guardModel(c,sw), out=[], seen=[];
  const nm={gp:"x0 = p",hp:"x0 = p",gcbz0:"cbz x0",hcbz0:"cbz x0",gldrb:"ldrb w1, [x0]",hldrb:"ldrb w1, [x0]",gcbz1:"cbz w1",hcbz1:"cbz w1",gt1:"w0 = 1",ht1:"w0 = 1",gt0:"w0 = 0",ht0:"w0 = 0",hseg:"SIGSEGV"};
  m.path.forEach((n,i)=>{ seen.push(n); let msg=`guard, LAB_CASE=${c}${sw?", felcserélt":""}: ${nm[n]}`;
    if(i===m.path.length-1) msg+= m.st===139?" → a 0-s cím olvasása: SIGSEGV, állapot 139 (mérve: QEMU 8.2.2)":` → állapot ${m.st}`;
    if(!sw&&c===0&&n==="gt0") msg+="; a betöltés kimaradt (rövidzár)";
    out.push({msg:msg,line:-1,mode:"guard",node:n,path:seen.slice(),skip:[]}); });
  return out; }
const SX=27, SY=30, OX=80, OY=12.6;
function P(x,y){return [OX+x*SX,(OY-y)*SY];}
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 680 380");
  const fg=css("--fg"), hl=css("--hl"), path=s.path||[], isIf=s.mode==="if";
  const defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
  defs.innerHTML=`<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`;
  el("text",{x:P(-2.6,0)[0],y:16,"font-size":12,"font-weight":"bold"},"(a) lab-if");
  el("text",{x:P(10.6,0)[0],y:16,"font-size":12,"font-weight":"bold"},"(b) lab-guard");
  function drawE(E,nodes,active){ E.forEach(e=>{
    let used=false; if(active) for(let i=0;i+1<path.length;i++){ if(path[i]===e.a&&(path[i+1]===e.b||(e.b===null&&path[i+1]===(e.to||"exit")))) used=true; }
    const d=e.pts.map((p,i)=>{const q=P(p[0],p[1]);return (i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1);}).join(" ");
    const a={d:d,fill:"none",stroke:used?hl:fg,"stroke-width":used?3:(e.st==="short"?2.2:1.1)};
    if(e.b!==null) a["marker-end"]=used?"url(#ahh)":"url(#ah)";
    if(e.st==="fall") a["stroke-dasharray"]="6 4"; if(e.st==="short") a["stroke-dasharray"]="1.5 3";
    el("path",a);
    if(e.lab){const q=P(e.lp[0],e.lp[1]), L=e.lab.split("\n"); L.forEach((t,i)=>el("text",{x:q[0],y:q[1]-(L.length-1-i)*11,"font-size":10,"text-anchor":e.a[0]==="g"||e.a[0]==="h"?"start":"middle"},t));} }); }
  function drawN(nodes,active){ for(const k in nodes){ const n=nodes[k], q=P(n.x,n.y), cur=active&&k===s.node, seen=active&&path.includes(k), sk=active&&(s.skip||[]).includes(k);
    const st=cur?hl:fg, sw=cur?3.2:(seen?2:1), fill=cur?css("--cellhl"):(n.sh==="s"?css("--cellhl"):css("--cell"));
    if(n.sh==="d"){const w=2.7*SX/2,h=1.0*SY/2; el("polygon",{points:`${q[0]-w},${q[1]} ${q[0]},${q[1]-h} ${q[0]+w},${q[1]} ${q[0]},${q[1]+h}`,fill:fill,stroke:st,"stroke-width":sw});}
    else {const w=(k[0]==="g"||k[0]==="h"?2.0:2.5)*SX,h=0.85*SY; el("rect",{x:q[0]-w/2,y:q[1]-h/2,width:w,height:h,fill:fill,stroke:st,"stroke-width":sw});
      if(n.sh==="m") el("rect",{x:q[0]-w/2+3,y:q[1]-h/2+3,width:w-6,height:h-6,fill:"none",stroke:st});}
    const ls=n.lab.split("\n"); ls.forEach((t,i)=>el("text",{x:q[0],y:q[1]+4+(i-(ls.length-1)/2)*11,"text-anchor":"middle","font-size":9.5,"font-family":"ui-monospace,monospace"},t));
    if(sk){const w=1.35*SX; el("line",{x1:q[0]-w,y1:q[1]+8,x2:q[0]+w,y2:q[1]-8,stroke:css("--hl2"),"stroke-width":2.5}); el("text",{x:q[0]-w-4,y:q[1]+4,"font-size":10,"text-anchor":"end",fill:css("--hl2")},"kimaradt");}
    if(n.title) el("text",{x:q[0]-(n.sh==="d"?1.35:1.0)*SX,y:q[1]-(n.sh==="d"?0.5:0.425)*SY-4,"font-size":9.5,"font-weight":"bold"},n.title); } }
  drawE(AE,AN,isIf); drawN(AN,isIf); drawE(BE,BN,!isIf); drawN(BN,!isIf);
}
function runIf(){ const x=parseInt(document.getElementById("ix").value,10);
  if(!(x>=-1&&x<=65535)){status.textContent="x a laborban −1 vagy 0…65535 lehet.";return;} setSteps(ifSteps(x)); }
function runGuard(){ setSteps(guardSteps(+document.getElementById("gc").value, document.getElementById("gs").checked)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
