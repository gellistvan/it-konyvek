<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMOV vagy SCVTF</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>W0 (egész) <input type="number" id="w" value="10" min="-2147483648" max="2147483647" style="width:10em"></label>
 <button id="go">Mindkét út</button>
 <button class="ex" data-v="3">3</button><button class="ex" data-v="10">10</button><button class="ex" data-v="-1">−1</button><button class="ex" data-v="16777217">16777217</button>
</div>
<div id="status" aria-live="polite"></div>
<table id="tb" style="width:100%"></table>
<p class="small" id="self"></p>

<p class="small">FMOV: a W0 32 bitje változatlanul kerül S0-ba (a bitminta float-ként értelmezve). SCVTF: az előjeles egész értékét kerekíti a legközelebbi float-ra (16777217 → 16777216). FCVTZU/FCVTZS: nulla felé csonkít, telít; NaN → 0.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"conds": ["eq", "ne", "mi", "lo", "gt", "ge", "ls", "lt", "le", "hi", "hs", "vs", "vc"], "rows": [{"name": "egyenlő", "a": 1.0, "b": 1.0, "nzcv": "0110", "truth": {"eq": 1, "ne": 0, "mi": 0, "lo": 0, "gt": 0, "ge": 1, "ls": 1, "lt": 0, "le": 1, "hi": 0, "hs": 1, "vs": 0, "vc": 1}}, {"name": "nagyobb", "a": 2.0, "b": 1.0, "nzcv": "0010", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 1, "ge": 1, "ls": 0, "lt": 0, "le": 0, "hi": 1, "hs": 1, "vs": 0, "vc": 1}}, {"name": "kisebb", "a": 1.0, "b": 2.0, "nzcv": "1000", "truth": {"eq": 0, "ne": 1, "mi": 1, "lo": 1, "gt": 0, "ge": 0, "ls": 1, "lt": 1, "le": 1, "hi": 0, "hs": 0, "vs": 0, "vc": 1}}, {"name": "rendezetlen (NaN)", "a": "NaN", "b": 1.0, "nzcv": "0011", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 0, "ge": 0, "ls": 0, "lt": 1, "le": 1, "hi": 1, "hs": 1, "vs": 1, "vc": 0}}], "extra": [{"a": "-0.0", "b": "0.0", "nzcv": "0110", "truth": {"eq": 1, "ne": 0, "mi": 0, "lo": 0, "gt": 0, "ge": 1, "ls": 1, "lt": 0, "le": 1, "hi": 0, "hs": 1, "vs": 0, "vc": 1}}, {"a": "inf", "b": "1.0", "nzcv": "0010", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 1, "ge": 1, "ls": 0, "lt": 0, "le": 0, "hi": 1, "hs": 1, "vs": 0, "vc": 1}}, {"a": "1.0", "b": "nan", "nzcv": "0011", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 0, "ge": 0, "ls": 0, "lt": 1, "le": 1, "hi": 1, "hs": 1, "vs": 1, "vc": 0}}, {"a": "-inf", "b": "inf", "nzcv": "1000", "truth": {"eq": 0, "ne": 1, "mi": 1, "lo": 1, "gt": 0, "ge": 0, "ls": 1, "lt": 1, "le": 1, "hi": 0, "hs": 0, "vs": 0, "vc": 1}}], "conv": [{"w": 3, "fmov_bits": 3, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1077936128, "scvtf_u": 3, "scvtf_s": 3}, {"w": 10, "fmov_bits": 10, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1092616192, "scvtf_u": 10, "scvtf_s": 10}, {"w": -1, "fmov_bits": 4294967295, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 3212836864, "scvtf_u": 0, "scvtf_s": -1}, {"w": 0, "fmov_bits": 0, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 0, "scvtf_u": 0, "scvtf_s": 0}, {"w": 16777217, "fmov_bits": 16777217, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1266679808, "scvtf_u": 16777216, "scvtf_s": 16777216}]};

const dv = new DataView(new ArrayBuffer(4));
function asF(u){ dv.setUint32(0, u >>> 0); return dv.getFloat32(0); }
function bitsOf(x){ dv.setFloat32(0, x); return dv.getUint32(0); }
function cvtzu(x){ if (Number.isNaN(x) || x <= 0) return 0; return x >= 4294967295 ? 4294967295 : Math.trunc(x); }
function cvtzs(x){ if (Number.isNaN(x)) return 0; if (x >= 2147483647) return 2147483647; if (x <= -2147483648) return -2147483648; return Math.trunc(x); }
function fields(u){ const s = u >>> 31, e = (u >>> 23) & 255, f = u & 0x7FFFFF;
  const kind = e === 255 ? (f ? "NaN" : "végtelen") : e === 0 ? (f ? "denormális" : "nulla") : "normalizált";
  return "sign " + s + ", exp " + e.toString(2).padStart(8, "0") + " (" + e + "), fraction 0x" + f.toString(16).toUpperCase() + " – " + kind; }
function h(u){ return "0x" + (u >>> 0).toString(16).toUpperCase().padStart(8, "0"); }
function b3(u){ const s = (u >>> 0).toString(2).padStart(32, "0"); return s[0] + " | " + s.slice(1, 9) + " | " + s.slice(9); }
function fv(x){ return Number.isNaN(x) ? "NaN" : (x !== 0 && Math.abs(x) < 1e-30 ? x.toExponential(2) : String(x)).replace(".", ",").replace("-", "−"); }
function paths(w){ const u = w >>> 0, fm = asF(u), sc = Math.fround(w);
  return {u, fmb: u, fm, fmu: cvtzu(fm), fms: cvtzs(fm), scb: bitsOf(sc), sc, scu: cvtzu(sc), scs: cvtzs(sc)}; }
let ok = true;
DATA.conv.forEach(c => { const p = paths(c.w); if (p.fmb !== c.fmov_bits || p.fmu !== c.fmov_u || p.fms !== c.fmov_s || p.scb !== c.scvtf_bits || p.scu !== c.scvtf_u || p.scs !== c.scvtf_s) ok = false; });
$("self").textContent = "Önellenőrzés (a lap modellje vs. unicorn: fmov/scvtf + fcvtzu/fcvtzs, W0 = 3, 10, −1, 0, 16777217): " + (ok ? "OK" : "ELTÉRÉS");
function run(){
  const w = Number($("w").value);
  if (!Number.isInteger(w) || w < -2147483648 || w > 2147483647) { $("status").textContent = "32 bites előjeles egészet adj meg."; return; }
  const p = paths(w);
  const rows = [["", "FMOV S0, W0 (bitmásolás)", "SCVTF S0, W0 (értékkonverzió)"],
    ["S0 bitminta", h(p.fmb), h(p.scb)], ["bitek (1 | 8 | 23)", b3(p.fmb), b3(p.scb)], ["mezők", fields(p.fmb), fields(p.scb)],
    ["float érték", fv(p.fm), fv(p.sc)], ["FCVTZU W1, S0", String(p.fmu), String(p.scu)], ["FCVTZS W2, S0", String(p.fms), String(p.scs)]];
  $("tb").innerHTML = rows.map((r, i) => "<tr>" + r.map((c, j) => (i === 0 || j === 0 ? "<th>" : "<td class='mono' style='font-size:12px'>") + c + (i === 0 || j === 0 ? "</th>" : "</td>")).join("") + "</tr>").join("");
  $("status").textContent = "W0 = " + w + " (" + h(p.u) + "): FMOV → " + fv(p.fm) + ", FCVTZU " + p.fmu + "; SCVTF → " + fv(p.sc) + ", FCVTZU " + p.scu + ".";
}
$("go").onclick = run;
$("w").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
document.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("w").value = b.dataset.v; run(); });
run();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
