<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Állapotszó-mezők és bitmező-utasítások</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>szó <input id="wd" size="11" value="0xA55A3CED" aria-label="Állapotszó"></label> <label>W1 <input id="sv" size="7" value="0x123" aria-label="Forrásérték"></label> <label>utasítás <select id="ins"><option>UBFX</option><option>SBFX</option><option>BFI</option></select></label> <label>lsb <input id="lsb" type="range" min="0" max="31" value="8" aria-label="lsb"> <span id="lv" class="small">8</span></label> <label>width <input id="wid" type="range" min="1" max="32" value="8" aria-label="width"> <span id="wv" class="small">8</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A tag 0xA55A, count 0x3C, delta 0b11101 (előjelesen −3), mode 0b101; BFI 0x123-mal 0xA55A23ED, 9 bites szélességgel 0xA55B23ED."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kezdő lépéssor a statikus ábra négy alpanelje (UBFX, SBFX, BFI #8, BFI #9). A vezérlőkkel saját szó, forrásérték, utasítás és mező (0 ≤ lsb < 32, 1 ≤ width ≤ 32 − lsb) adható meg. Az értékeket a fejezet lab-bitfield.S kódjának keystone + Unicorn futtatásával ellenőriztük.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "UBFX #8,#8: mező = 60 → W0=0x0000003C", "ins": "UBFX", "w": "0xA55A3CED", "s": "0x123", "p": 8, "k": 8, "r": "0x0000003C", "line": -1}, {"msg": "SBFX #3,#5: u=29 → s=−3, W0=0xFFFFFFFD", "ins": "SBFX", "w": "0xA55A3CED", "s": "0x123", "p": 3, "k": 5, "r": "0xFFFFFFFD", "line": -1}, {"msg": "BFI #8,#8: W1=0x123 alsó 8 bitje → W0=0xA55A23ED", "ins": "BFI", "w": "0xA55A3CED", "s": "0x123", "p": 8, "k": 8, "r": "0xA55A23ED", "line": -1}, {"msg": "BFI #8,#9: W1=0x123 alsó 9 bitje → W0=0xA55B23ED", "ins": "BFI", "w": "0xA55A3CED", "s": "0x123", "p": 8, "k": 9, "r": "0xA55B23ED", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const M32 = 0xFFFFFFFFn;
function calc(ins, w, s, p, k){
  const P = BigInt(p), K = BigInt(k), m = ((1n << K) - 1n);
  if (ins === "UBFX") { const r = (w >> P) & m; return {r, msg: "UBFX #" + p + ",#" + k + ": mező = " + r + " → W0=" + hx(r)}; }
  if (ins === "SBFX") { const u = (w >> P) & m; const sv = (u >> (K - 1n)) ? u - (1n << K) : u; const r = BigInt.asUintN(32, sv);
     return {r, msg: "SBFX #" + p + ",#" + k + ": u=" + u + " → s=" + sv + ", W0=" + hx(r)}; }
  const mm = m << P; const r = (w & ~mm & M32) | ((s << P) & mm);
  return {r, msg: "BFI #" + p + ",#" + k + ": W1=0x" + s.toString(16).toUpperCase() + " alsó " + k + " bitje → W0=" + hx(r)};
}
const hx = v => "0x" + v.toString(16).toUpperCase().padStart(8, "0");
function recompute(){
  const ins = document.getElementById("ins").value, p = +document.getElementById("lsb").value, k = +document.getElementById("wid").value;
  document.getElementById("lv").textContent = p; document.getElementById("wv").textContent = k;
  let w, s; try { w = BigInt(document.getElementById("wd").value.trim()) & M32; s = BigInt(document.getElementById("sv").value.trim()) & M32; }
  catch(e){ status.textContent = "Érvénytelen szám."; return; }
  if (k < 1 || p + k > 32) { setSteps([{msg: "Hiba: a #" + p + ", #" + k + " mező túllóg a 32 bites regiszteren (lsb + width ≤ 32) – a GNU as ezt elutasítja.", err: true, w: hx(w), s: "0x" + s.toString(16), p, k, ins, r: hx(w), line: -1}]); return; }
  const c = calc(ins, w, s, p, k);
  setSteps([{msg: c.msg, ins, w: hx(w), s: "0x" + s.toString(16).toUpperCase(), p, k, r: hx(c.r), line: -1}]);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 920 300"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hlc = css("--cellhl"), hl = css("--hl"), hl2 = css("--hl2"), mut = css("--muted");
  const X0 = 80, W = 22, w = BigInt(s.w), r = BigInt(s.r), src = BigInt(s.s), p = s.p, k = s.k;
  const FLD = [["tag", 16, 16], ["count", 8, 8], ["delta", 3, 5], ["mode", 0, 3]];
  function bits(y, v, lab, cls){
    el("text", {x: X0 - 8, y: y + 16, "text-anchor": "end", "font-size": 13, "font-family": "ui-monospace,monospace"}, lab);
    for (let j = 0; j < 32; j++) { const b = 31 - j, on = Number((v >> BigInt(b)) & 1n), c = cls ? cls(b) : "";
      el("rect", {x: X0 + j * W, y, width: W, height: 22, fill: c === "sel" || c === "sgn" ? hlc : cell, stroke: c === "chg" || c === "sgn" || c === "drop" ? hl2 : (c === "sel" ? hl : line),
        "stroke-width": c ? 2.2 : 0.6, "stroke-dasharray": c === "zero" ? "3 2" : "none"});
      el("text", {x: X0 + j * W + W / 2, y: y + 16, "text-anchor": "middle", "font-size": 12, "font-family": "ui-monospace,monospace"}, String(on));
      if (c === "drop") el("path", {d: `M${X0 + j * W} ${y} l${W} 22 M${X0 + j * W + W} ${y} l${-W} 22`, stroke: hl2, "stroke-width": 1.5});
    }
    [16, 8, 3].forEach(b => el("line", {x1: X0 + (32 - b) * W, y1: y - 3, x2: X0 + (32 - b) * W, y2: y + 25, stroke: line, "stroke-width": 2}));
    el("text", {x: X0 + 32 * W + 8, y: y + 16, "font-size": 13, "font-family": "ui-monospace,monospace", "font-weight": "bold"}, hx(v));
  }
  FLD.forEach(([n, fp, fk]) => el("text", {x: X0 + (32 - fp - fk / 2) * W, y: 18, "text-anchor": "middle", "font-size": 12, fill: mut}, n + " " + (fp + fk - 1) + ":" + fp));
  const insel = b => (b >= p && b < p + k) ? "sel" : "";
  bits(26, w, "W0 be", s.ins === "BFI" ? "" : insel);
  if (s.err) { el("text", {x: X0, y: 110, "font-size": 14, fill: hl2}, "érvénytelen mező: lsb + width > 32"); return; }
  let y = 80;
  if (s.ins === "BFI") { bits(y, src, "W1", b => b < k ? "sel" : ((b < 32 && (src >> BigInt(b)) & 1n) ? "drop" : "")); y += 54; }
  const cls = b => {
    if (s.ins === "UBFX") return b < k ? "sel" : "zero";
    if (s.ins === "SBFX") return b < k ? "sel" : "sgn";
    return ((r ^ w) >> BigInt(b)) & 1n ? "chg" : (b >= p && b < p + k ? "sel" : "");
  };
  bits(y, r, "W0 ki", cls);
  const leg = {UBFX: "kiemelt = a kinyert mező (a 0. bittől), szaggatott = nullával feltöltve",
               SBFX: "kiemelt = a mező; narancs keret = a mező felső bitjének másolata (előjelkiterjesztés)",
               BFI: "kiemelt = a beillesztett mező; narancs keret = megváltozott bit; áthúzott W1-bit = eldobva"}[s.ins];
  el("text", {x: X0, y: y + 56, "font-size": 13}, leg);
  if (s.ins === "BFI" && ((r ^ w) >> 16n)) el("text", {x: X0, y: y + 78, "font-size": 13, fill: hl2, "font-weight": "bold"}, "a tag mező (31:16) is megváltozott – sérült!");
  if (s.ins === "SBFX") el("text", {x: X0, y: y + 78, "font-size": 13, fill: mut}, "W-írás után X0 = 0x00000000" + hx(r).slice(2));
}

["wd", "sv", "ins"].forEach(id => document.getElementById(id).addEventListener("change", recompute));
["lsb", "wid"].forEach(id => document.getElementById(id).addEventListener("input", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
