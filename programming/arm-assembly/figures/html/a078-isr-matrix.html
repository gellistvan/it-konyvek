<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Megosztott állapot és preempció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="pr" aria-pressed="false">Prioritások felcserélése</button><span id="selinfo" class="small" aria-live="polite"></span>
<script>
const SN = [{"msg": "main fut (legmélyebb lánc: status_line → uart_put_u32 → uart_putc). Verem: 64 B; NVIC aktív: –; pending: –", "line": 0, "k": 0, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": []}, {"msg": "bájt érkezik: IRQ0 pending. Verem: 64 B; NVIC aktív: –; pending: IRQ0", "line": 1, "k": 1, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": ["IRQ0"]}, {"msg": "UART0_Handler belép (nyers 0x60): 1. keret, +36 B. Verem: 100 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 2, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "UART0_Handler prológus: +16 B. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 3, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "timer-tick: IRQ8 pending; 0x40 < 0x60, ezért preemptál. Verem: 116 B; NVIC aktív: IRQ0; pending: IRQ8", "line": 3, "k": 4, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": ["IRQ8"]}, {"msg": "TIMER0_Handler belép: 2. keret, +36 B. Verem: 152 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 5, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "TIMER0_Handler prológus: +16 B → csúcs 168 B (≈ 170 B). Verem: 168 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 6, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "nyugtázás, tick_count++. Verem: 168 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 7, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "kilépés vissza a UART0_Handler-be. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 5, "k": 8, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "nyugtázás, DATA, ring_push. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 5, "k": 9, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "kilépés a main-be. Verem: 64 B; NVIC aktív: –; pending: –", "line": 6, "k": 10, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": []}], SS = [{"msg": "main fut (legmélyebb lánc: status_line → uart_put_u32 → uart_putc). Verem: 64 B; NVIC aktív: –; pending: –", "line": 0, "k": 0, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": [], "pend": []}, {"msg": "bájt érkezik: IRQ0 pending. Verem: 64 B; NVIC aktív: –; pending: IRQ0", "line": 1, "k": 1, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": [], "pend": ["IRQ0"]}, {"msg": "UART0_Handler belép (nyers 0x40): 1. keret, +36 B. Verem: 100 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 2, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "UART0_Handler prológus: +16 B. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 3, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "timer-tick: IRQ8 pending; 0x60 > 0x40, nem preemptál – a tick késik. Verem: 116 B; NVIC aktív: IRQ0; pending: IRQ8", "line": 3, "k": 4, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ0"], "pend": ["IRQ8"]}, {"msg": "nyugtázás, DATA, ring_push. Verem: 116 B; NVIC aktív: IRQ0; pending: IRQ8", "line": 5, "k": 5, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ0"], "pend": ["IRQ8"]}, {"msg": "UART0_Handler kilép: IRQ8 pending → tail-chain (a keret marad). Verem: 100 B; NVIC aktív: IRQ8; pending: –", "line": 4, "k": 6, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ8"], "pend": []}, {"msg": "TIMER0_Handler prológus: +16 B → csúcs 116 B. Verem: 116 B; NVIC aktív: IRQ8; pending: –", "line": 4, "k": 7, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ8"], "pend": []}, {"msg": "nyugtázás, tick_count++ (késve). Verem: 116 B; NVIC aktív: IRQ8; pending: –", "line": 4, "k": 8, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": ["IRQ8"], "pend": []}, {"msg": "kilépés a main-be. Verem: 64 B; NVIC aktív: –; pending: –", "line": 6, "k": 9, "swapped": true, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["UART", 116], ["TIMER", 100], ["TIMER", 116], ["TIMER", 116], ["main", 64]], "act": [], "pend": []}]; let SW = false;
document.getElementById("pr").onclick = () => { SW = !SW; document.getElementById("pr").setAttribute("aria-pressed", String(SW));
  setSteps(SW ? SS : SN); };
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Adatfolyam: minden megosztott változónak egy írója van; idővonal: a timer-ISR a UART-ISR-t preemptálja"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A veremértékek a 20.1.5 levezetett becslése (keret 36 B = 32 B + 4 B igazítás, legrosszabb eset; ISR-mentés 16 B), nem mérés. Felcserélt prioritásnál a timer csak a UART-ISR után, láncolva (tail-chain) fut, a tick késik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "main fut (legmélyebb lánc: status_line → uart_put_u32 → uart_putc). Verem: 64 B; NVIC aktív: –; pending: –", "line": 0, "k": 0, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": []}, {"msg": "bájt érkezik: IRQ0 pending. Verem: 64 B; NVIC aktív: –; pending: IRQ0", "line": 1, "k": 1, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": ["IRQ0"]}, {"msg": "UART0_Handler belép (nyers 0x60): 1. keret, +36 B. Verem: 100 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 2, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "UART0_Handler prológus: +16 B. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 2, "k": 3, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "timer-tick: IRQ8 pending; 0x40 < 0x60, ezért preemptál. Verem: 116 B; NVIC aktív: IRQ0; pending: IRQ8", "line": 3, "k": 4, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": ["IRQ8"]}, {"msg": "TIMER0_Handler belép: 2. keret, +36 B. Verem: 152 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 5, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "TIMER0_Handler prológus: +16 B → csúcs 168 B (≈ 170 B). Verem: 168 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 6, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "nyugtázás, tick_count++. Verem: 168 B; NVIC aktív: IRQ0, IRQ8; pending: –", "line": 4, "k": 7, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0", "IRQ8"], "pend": []}, {"msg": "kilépés vissza a UART0_Handler-be. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 5, "k": 8, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "nyugtázás, DATA, ring_push. Verem: 116 B; NVIC aktív: IRQ0; pending: –", "line": 5, "k": 9, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": ["IRQ0"], "pend": []}, {"msg": "kilépés a main-be. Verem: 64 B; NVIC aktív: –; pending: –", "line": 6, "k": 10, "swapped": false, "ev": [["main", 64], ["main", 64], ["UART", 100], ["UART", 116], ["UART", 116], ["TIMER", 152], ["TIMER", 168], ["TIMER", 168], ["UART", 116], ["UART", 116], ["main", 64]], "act": [], "pend": []}];
const CODE = ["main: status_line → uart_put_u32 → uart_putc  (64 B)", "UART RX: bájt érkezik → IRQ0 pending", "UART0_Handler: belépés (+36 B keret) és prológus (+16 B)", "Timer0 nullátmenet → IRQ8 pending", "TIMER0_Handler: nyugtázás, tick_count++", "UART0_Handler: nyugtázás (W1C), DATA, ring_push", "kilépés a main-be"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VARS = {"rx_ring.head": ["UART0_Handler", ["main"]], "rx_ring.buf": ["UART0_Handler", ["main"]], "rx_ring.overrun": ["UART0_Handler", ["main"]], "rx_ring.tail": ["main", ["UART0_Handler"]], "tick_count": ["TIMER0_Handler", ["main"]], "tick_base": ["main", ["main"]], "overrun_base": ["main", ["main"]], "seen": ["main", ["main"]]};
let SEL = null;
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 410");
  const box = (x, y, w, h, t, id, thick) => {
    const on = SEL && (VARS[SEL][0] === id || VARS[SEL][1].includes(id));
    const wr = SEL && VARS[SEL][0] === id;
    el("rect", {x, y, width: w, height: h, rx: 6, fill: id === "main" ? css("--cellhl") : css("--cell"),
      stroke: wr ? css("--hl2") : (on ? css("--hl") : css("--line")), "stroke-width": wr ? 4 : (on ? 3 : (thick ? 2.5 : 1.2))});
    t.split("\n").forEach((ln, i, a) => el("text", {x: x + w / 2, y: y + h / 2 + 5 + (i - (a.length - 1) / 2) * 15,
      "text-anchor": "middle", "font-size": 12}, ln));
  };
  box(10, 10, 160, 44, "UART0_Handler\nIRQ0, nyers " + (s.swapped ? "0x40" : "0x60"), "UART0_Handler", s.swapped);
  box(390, 10, 160, 44, "TIMER0_Handler\nIRQ8, nyers " + (s.swapped ? "0x60" : "0x40"), "TIMER0_Handler", !s.swapped);
  box(180, 62, 200, 44, "main\n(K3, K4, WFI: kritikus szakasz)", "main", false);
  const vs = Object.keys(VARS);
  vs.forEach((v, i) => {
    const x = 10 + (i % 4) * 137, y = 118 + Math.floor(i / 4) * 30, on = v === SEL;
    const g = el("rect", {x, y, width: 130, height: 24, rx: 4, fill: on ? css("--cellhl") : css("--cell"),
      stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 2.5 : 1, tabindex: 0, role: "button",
      "aria-label": v + " kiválasztása", style: "cursor:pointer"});
    const t = el("text", {x: x + 65, y: y + 16, "text-anchor": "middle", "font-size": 11, style: "cursor:pointer"}, v);
    const pick = () => { SEL = SEL === v ? null : v; document.getElementById("selinfo").textContent = SEL ?
      `${SEL}: író = ${VARS[SEL][0]}, olvasó(k) = ${VARS[SEL][1].join(", ")}` : ""; render(STEPS[k]); };
    g.addEventListener("click", pick); t.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
  });
  el("text", {x: 10, y: 190, "font-size": 11, fill: css("--muted")}, "Kattints egy változóra: narancs keret = író, kék = olvasó.");
  // idővonal
  const ev = s.ev, L = 100, cw = 440 / ev.length, lanes = {main: 236, UART: 260, TIMER: 284};
  [["main", 236], ["UART0-ISR", 260], ["TIMER0-ISR", 284]].forEach(([n, y]) =>
    el("text", {x: L - 6, y: y + 5, "text-anchor": "end", "font-size": 12}, n));
  const Y = d => 400 - d * 0.42;
  el("text", {x: L - 6, y: 385, "text-anchor": "end", "font-size": 12}, "verem [B]");
  for (let j = 0; j <= s.k; j++) {
    const [c, d] = ev[j], x = L + j * cw, on = j === s.k;
    el("rect", {x, y: lanes[c] - 9, width: cw, height: 18, fill: c === "main" ? css("--cellhl") : css("--cell"),
      stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": c === "TIMER" ? "2 2" : ""});
    if (j > 0) el("line", {x1: x, y1: Y(ev[j - 1][1]), x2: x, y2: Y(d), stroke: css("--fg"), "stroke-width": 2});
    el("line", {x1: x, y1: Y(d), x2: x + cw, y2: Y(d), stroke: on ? css("--hl") : css("--fg"), "stroke-width": on ? 4 : 2});
    if (j === 0 || ev[j - 1][1] !== d) el("text", {x: x + cw / 2, y: Y(d) - 4, "text-anchor": "middle", "font-size": 11}, String(d));
  }
  el("text", {x: 10, y: 212, "font-size": 12}, "NVIC aktív: " + (s.act.join(", ") || "–") + "   pending: " + (s.pend.join(", ") || "–"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
