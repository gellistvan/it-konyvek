<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az i-k-j kernel egy lépése: broadcast, négyes FMLA-szelet, skalár farok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n: <input type="range" id="n" min="1" max="12" value="5" style="min-width:90px;flex:0" oninput="reload()" aria-label="n"> <span id="nv">5</span></label><label>i: <input type="range" id="i" min="0" max="4" value="1" style="min-width:90px;flex:0" oninput="reload()" aria-label="i"> <span id="iv">1</span></label><label>k: <input type="range" id="kk" min="0" max="4" value="2" style="min-width:90px;flex:0" oninput="reload()" aria-label="k"> <span id="kv">2</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A, B és C rács; az A egy eleme mind a négy sávba másolódik, a B és C sorának négyes szeletei fmla-val, a maradék skalár fmadd-dal frissül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Minta: A[i][k] = i·n + k (n = 5-re 5i + k), B csupa 1, mint a 15.2.5.1 ABI-tesztjében; n = 5-re a lab_sgemm.S unicornos futtatásával egyezik (C[1][*] = 35, C[4][*] = 110). A C sorai az aktuális i előtt kész értékek, utána „·”.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "i = 1, k = 2: ldr s0, [x25, x27, lsl #2] → a = A[1][2] = 7; dup v0.4s → 7 | 7 | 7 | 7. x25 = A+20, x28 = B+40, x26 = C+20 (bájt).", "line": 1, "j": -1, "done": 0, "row": [11.0, 11.0, 11.0, 11.0, 11.0], "a": 7, "n": 5, "i": 1, "k": 2}, {"msg": "j = 0..3: ldr q1 = C[1][0..3], ldr q2 = B[2][0..3], fmla v1 += v0·v2, str q1; x4 = j·4 = 0. C-sor: 18, 18, 18, 18, 11", "line": 4, "j": 0, "w": 4, "done": 4, "row": [18.0, 18.0, 18.0, 18.0, 11.0], "a": 7, "n": 5, "i": 1, "k": 2}, {"msg": "farok j = 4: ldr s1, ldr s2, fmadd s1 = s0·s2 + s1, str s1. C-sor: 18, 18, 18, 18, 18", "line": 7, "j": 4, "w": 1, "done": 5, "row": [18.0, 18.0, 18.0, 18.0, 18.0], "a": 7, "n": 5, "i": 1, "k": 2}];
const CODE = ["ldr  s0, [x25, x27, lsl #2]     // a = A_row[k]", "dup  v0.4s, v0.s[0]             // broadcast 4 sávra", "mul/lsl/add x28 = B + k*n*4     // B_row", "ldr  q1, [x26, x4]  ;  ldr q2, [x28, x4]", "fmla v1.4s, v0.4s, v2.4s        // C += a * B, 4 elem", "str  q1, [x26, x4]", "ldr  s1, [x26, x2, lsl #2] ; ldr s2, [x28, x2, lsl #2]", "fmadd s1, s0, s2, s1            // skaláris maradék", "str  s1, [x26, x2, lsl #2]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function Aval(i, k, n){ return n === 5 ? 5 * i + k : n * i + k; }
function rowAfter(i, k, n){ let s = 0; for (let t = 0; t <= k; t++) s += Aval(i, t, n); return Array(n).fill(s); }
function build(n, i, k){
  const a = Aval(i, k, n), before = k > 0 ? rowAfter(i, k - 1, n) : Array(n).fill(0);
  const st = [{msg: `i = ${i}, k = ${k}: ldr s0, [x25, x27, lsl #2] → a = A[${i}][${k}] = ${a}; dup v0.4s → ${a} | ${a} | ${a} | ${a}. x25 = A+${i * n * 4}, x28 = B+${k * n * 4}, x26 = C+${i * n * 4} (bájt).`, line: 1, j: -1, done: 0, row: before, a: a, n: n, i: i, k: k}];
  const row = before.slice(); let j = 0;
  while (j + 4 <= n) { for (let t = j; t < j + 4; t++) row[t] += a;
    st.push({msg: `j = ${j}..${j + 3}: ldr q1 = C[${i}][${j}..${j + 3}], ldr q2 = B[${k}][${j}..${j + 3}], fmla v1 += v0·v2, str q1; x4 = j·4 = ${j * 4}. C-sor: ` + row.join(", "), line: 4, j: j, w: 4, done: j + 4, row: row.slice(), a: a, n: n, i: i, k: k}); j += 4; }
  while (j < n) { row[j] += a;
    st.push({msg: `farok j = ${j}: ldr s1, ldr s2, fmadd s1 = s0·s2 + s1, str s1. C-sor: ` + row.join(", "), line: 7, j: j, w: 1, done: j + 1, row: row.slice(), a: a, n: n, i: i, k: k}); j += 1; }
  return st;
}
function reload(){
  const n = +document.getElementById("n").value;
  const iEl = document.getElementById("i"), kEl = document.getElementById("kk");
  iEl.max = n - 1; kEl.max = n - 1;
  if (+iEl.value > n - 1) iEl.value = n - 1; if (+kEl.value > n - 1) kEl.value = n - 1;
  document.getElementById("nv").textContent = n; document.getElementById("iv").textContent = iEl.value; document.getElementById("kv").textContent = kEl.value;
  setSteps(build(n, +iEl.value, +kEl.value));
}
function render(s){
  svg.innerHTML = "";
  const n = s.n, cs = Math.min(30, 160 / n), gap = 22, x0 = 14, y0 = 46;
  const W = 3 * n * cs + 2 * gap + 2 * x0;
  svg.setAttribute("viewBox", `0 0 ${Math.max(560, W)} ${y0 + n * cs + 70}`);
  const fs = Math.max(8, Math.min(13, cs * 0.45));
  [["A", 0], ["B", 1], ["C", 2]].forEach(([nm, g]) => {
    const gx = x0 + g * (n * cs + gap);
    el("text", {x: gx + n * cs / 2, y: y0 - 10, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, nm);
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      let fill = css("--cell"), sw = 0.6, txt = "";
      if (nm === "A") { txt = Aval(r, c, n); if (r === s.i && c === s.k) sw = 3.2; }
      if (nm === "B") { txt = "1"; if (r === s.k) fill = (c < Math.floor(n / 4) * 4) ? css("--cellhl") : css("--cell"); }
      if (nm === "C") { if (r < s.i) txt = rowAfter(r, n - 1, n)[0]; else if (r === s.i) txt = s.row[c]; else txt = "·";
        if (r === s.i && s.j >= 0 && c >= s.j && c < s.j + s.w) { fill = css("--cellhl"); sw = 2.6; } }
      if (nm === "B" && r === s.k && s.j >= 0 && c >= s.j && c < s.j + s.w) sw = 2.6;
      const rr = el("rect", {x: gx + c * cs, y: y0 + r * cs, width: cs, height: cs, fill: fill, stroke: css("--line"), "stroke-width": sw});
      if ((nm === "B" && r === s.k) || (nm === "C" && r === s.i)) if (c >= Math.floor(n / 4) * 4) rr.setAttribute("stroke-dasharray", "3 2");
      el("text", {x: gx + c * cs + cs / 2, y: y0 + r * cs + cs / 2 + fs * 0.35, "text-anchor": "middle", "font-size": fs}, String(txt));
    }
  });
  const yb = y0 + n * cs + 26;
  el("text", {x: x0, y: yb, "font-size": 13}, `v0 = ${s.a} | ${s.a} | ${s.a} | ${s.a};  x25 = A+${s.i * n * 4};  x28 = B+${s.k * n * 4};  x26 = C+${s.i * n * 4}` + (s.j >= 0 ? `;  ${s.w === 4 ? "x4" : "x2"} = ${s.w === 4 ? s.j * 4 : s.j}` : ""));
  el("text", {x: x0, y: yb + 20, "font-size": 11.5, fill: css("--muted")}, "szürke: négyes vektorszelet (fmla); szaggatott keret: skalár farok (fmadd); vastag: aktuális elem(ek)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
