<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A64 logikai immediate felépítése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--on:#333;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--on:#ddd;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
label{white-space:nowrap}
input[type=range]{width:150px;vertical-align:middle}
input[type=text]{font:13px ui-monospace,monospace;width:13em}
button{font:inherit;padding:2px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
#res{margin:2px 0 6px;min-height:1.5em;color:var(--hl)}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Minta építése">
  <label>szélesség <select id="wd" aria-label="Műveleti szélesség"><option>32</option><option>64</option></select></label>
  <label>elemhossz <select id="e" aria-label="Elemhossz"><option>2</option><option>4</option><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label>
  <label>futam <input id="r" type="range" min="1" max="15" value="8" aria-label="Az 1-es futam hossza"> <span id="rv" class="mono"></span></label>
  <label>forgatás <input id="rot" type="range" min="0" max="15" value="0" aria-label="Forgatás jobbra"> <span id="rotv" class="mono"></span></label>
</div>
<div class="ctl" role="group" aria-label="Fordított mód">
  <label>konstans: <input id="hex" type="text" value="0x00FF00FF" aria-label="Vizsgálandó konstans hexában"></label>
  <button id="chk">Kódolható?</button>
  <span class="small">példák:</span>
  <button class="ex">0x00FF00FF</button><button class="ex">0x80000001</button><button class="ex">0x00000005</button><button class="ex">0x55555555</button><button class="ex">0xFFFFFFF7</button>
</div>
<div id="status" aria-live="polite"></div>
<div id="res" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 270" role="img" aria-label="A logikai immediate négy lépése: elem, futam, forgatás, ismétlés"></svg>
<p class="small">A64 logikai immediate (AND/ORR/EOR/ANDS): N/immr/imms mezők. A kódoló a legkisebb ismétlődő elemet keresi; a
fejezet táblázatának 8 konstansát és mind az 1302 érvényes 32 bites mintát keystone assemblerrel ellenőriztük. A csupa 0 és
csupa 1 minta nem kódolható.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
const $ = id => document.getElementById(id);
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mk(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
const M = n => (1n << BigInt(n)) - 1n;
function ror(x, r, e){ r = BigInt(r % e); const E = BigInt(e); return ((x >> r) | (x << (E - r))) & M(e); }
function build(e, run, rot, width){
  const elem = ror(M(run), rot, e); let v = 0n;
  for (let i = 0; i < width / e; i++) v |= elem << BigInt(i * e);
  const imms = ((~(e - 1) << 1) & 0x3f) | (run - 1);
  return {v, elem, N: e === 64 ? 1 : 0, immr: rot, imms};
}
function encode(v, width){
  for (const e of [2, 4, 8, 16, 32, 64]) {
    if (e > width) break;
    const elem = v & M(e); let rep = true;
    for (let i = 0; i < width / e; i++) if (((v >> BigInt(i * e)) & M(e)) !== elem) { rep = false; break; }
    if (!rep) continue;
    let run = 0; for (let b = 0; b < e; b++) if ((elem >> BigInt(b)) & 1n) run++;
    if (run === 0 || run === e) return null;
    for (let rot = 0; rot < e; rot++) if (ror(M(run), rot, e) === elem) return Object.assign({e, run, rot}, build(e, run, rot, width));
    return null;
  }
  return null;
}
const hexw = (v, w) => "0x" + v.toString(16).toUpperCase().padStart(w / 4, "0");
function row(y, val, n, e, lab){
  const cw = Math.min(22, 640 / n), x0 = 115;
  mk("text", {x: x0 - 8, y: y + 14, "text-anchor": "end", "font-size": 12}, lab);
  for (let j = 0; j < n; j++) {
    const on = (val >> BigInt(n - 1 - j)) & 1n;
    mk("rect", {x: x0 + j * cw, y, width: cw, height: 18, fill: on ? css("--on") : css("--cell"), stroke: css("--line"), "stroke-width": 0.5});
  }
  for (let j = 0; j <= n; j += e) mk("line", {x1: x0 + j * cw, y1: y - 3, x2: x0 + j * cw, y2: y + 21, stroke: css("--line"), "stroke-width": 2.5});
}
function draw(){
  const width = +$("wd").value; let e = +$("e").value;
  if (e > width) { e = width; $("e").value = String(e); }
  $("r").max = e - 1; $("rot").max = e - 1;
  if (+$("r").value > e - 1) $("r").value = e - 1;
  if (+$("rot").value > e - 1) $("rot").value = e - 1;
  const run = +$("r").value, rot = +$("rot").value;
  $("rv").textContent = run; $("rotv").textContent = rot;
  const b = build(e, run, rot, width);
  svg.innerHTML = "";
  row(10, 0n, e, e, "1. elem: " + e + " bit");
  row(50, M(run), e, e, "2. futam: " + run);
  row(90, b.elem, e, e, "3. ROR " + rot);
  row(140, b.v, width, e, "4. ismétlés");
  const enc = encode(b.v, width), canon = enc && (enc.e !== e || enc.rot !== rot || enc.run !== run);
  mk("text", {x: 115, y: 190, "font-size": 13, class: "mono"}, hexw(b.v, width));
  mk("text", {x: 115, y: 212, "font-size": 13}, "N=" + b.N + ", immr=" + b.immr + ", imms=0b" + b.imms.toString(2).padStart(6, "0"));
  if (canon) mk("text", {x: 115, y: 234, "font-size": 12, fill: css("--muted")}, "(ugyanez a minta kisebb elemmel is előáll: elem=" + enc.e + ", futam=" + enc.run + ", forgatás=" + enc.rot + "; az assembler azt kódolja)");
  mk("text", {x: 115, y: 258, "font-size": 12, fill: css("--muted")}, "sötét cella = 1, világos = 0; vastag vonal = elemhatár; a legfelső bit balra");
  $("status").textContent = "elem=" + e + ", futam=" + run + ", forgatás=" + rot + " → " + hexw(b.v, width);
}
function check(){
  const width = +$("wd").value; let v;
  try { v = BigInt($("hex").value.trim()); } catch (err) { $("res").textContent = "Érvénytelen szám."; return; }
  if (v < 0n || v > M(width)) { $("res").textContent = "A konstans nem fér el " + width + " biten."; return; }
  const enc = encode(v, width);
  if (!enc) { $("res").textContent = hexw(v, width) + " (" + width + " bit): NEM kódolható logikai immediate-ként."; return; }
  $("res").textContent = hexw(v, width) + " (" + width + " bit): kódolható – elem=" + enc.e + ", futam=" + enc.run + ", forgatás=" + enc.rot +
     "; N=" + enc.N + ", immr=" + enc.immr + ", imms=0b" + enc.imms.toString(2).padStart(6, "0");
  $("e").value = String(enc.e); $("r").max = enc.e - 1; $("rot").max = enc.e - 1; $("r").value = enc.run; $("rot").value = enc.rot; draw();
}
["wd", "e", "r", "rot"].forEach(id => $(id).addEventListener("input", draw));
$("chk").addEventListener("click", check);
$("hex").addEventListener("keydown", ev => { if (ev.key === "Enter") check(); });
document.querySelectorAll(".ex").forEach(bt => bt.addEventListener("click", () => { $("hex").value = bt.textContent; check(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw(); check();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
