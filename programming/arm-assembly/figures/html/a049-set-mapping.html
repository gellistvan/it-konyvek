<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set-leképezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>lépésköz (bájt) <input type="number" id="st" value="4096" min="1" max="1048576" style="width:8em"></label>
 <button class="ex" data-v="64">64 B</button><button class="ex" data-v="128">128 B</button><button class="ex" data-v="4096">4096 B</button>
 <label>hozzáférések <input type="number" id="nmax" value="32" min="1" max="512" style="width:5em"></label>
</div>
<div class="ctl" role="group" aria-label="Léptetés">
 <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite" class="mono"></div>
<svg id="v" viewBox="0 0 760 170" role="img" aria-label="64 set × 8 utas modell-L1: foglalt helyek, aktuális hozzáférés"></svg>
<p id="cmp" class="small"></p>

<p class="small">Modell: L = 64 bájt, S = 64 set, 8 utas, LRU; set = ⌊cím/64⌋ mod 64; a hozzáférések a 0. címtől indulnak. Kezdőállapot: 4096 B-os lépés, 16 hozzáférés után (a 9. volt az első kiszorítás). Modell, nem mérés.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


const L = 64, S = 64, WAYS = 8; let ev = [], cur = 0, tm = null;
const svgV = $("v");
function gcd(a, b){ while (b) [a, b] = [b, a % b]; return a; }
function build(step, n){ const sets = Array.from({length: S}, () => []), out = [];
  for (let i = 0; i < n; i++) { const addr = i * step, line = Math.floor(addr / L), s = line % S, st = sets[s], j = st.indexOf(line);
    let kind, evicted = null;
    if (j >= 0) { st.splice(j, 1); st.push(line); kind = "találat"; }
    else { st.push(line); kind = "hiba"; if (st.length > WAYS) { evicted = st.shift(); kind = "hiba + kiszorítás"; } }
    out.push({addr, line, s, kind, evicted, snap: sets.map(x => x.slice())}); }
  return out; }
function draw(){
  svgV.innerHTML = "";
  const CW = 11, X0 = 20, Y0 = 20, e = cur ? ev[cur - 1] : null, sets = e ? e.snap : Array.from({length: S}, () => []);
  for (let s = 0; s < S; s++) for (let w = 0; w < WAYS; w++) { const occ = w < sets[s].length, now = e && e.s === s && sets[s][w] === e.line;
    const r = mk(svgV, "rect", {x: X0 + s * CW, y: Y0 + w * CW, width: CW, height: CW, fill: occ ? css("--muted") : css("--cell"), stroke: now ? css("--hl") : css("--grid"), "stroke-width": now ? 3 : 0.5});
    if (occ) { const t = document.createElementNS(NS, "title"); t.textContent = "set " + s + ", sor " + sets[s][w]; r.appendChild(t); } }
  [0, 16, 32, 48, 63].forEach(s => mk(svgV, "text", {x: X0 + s * CW + CW / 2, y: Y0 + WAYS * CW + 14, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(s)));
  mk(svgV, "text", {x: X0, y: Y0 + WAYS * CW + 34, "font-size": 12, fill: css("--muted")}, "oszlop = set (0…63), sor = utas (8); sötét = foglalt; kék keret = az aktuális sor helye");
  if (e && e.s !== undefined) mk(svgV, "text", {x: X0 + e.s * CW + CW / 2, y: Y0 - 6, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "▼");
  const used = sets.filter(x => x.length).length, step = +$("st").value;
  $("cnt").textContent = cur + "/" + ev.length;
  $("status").textContent = !e ? "Kezdőállapot: üres cache." : cur + ". hozzáférés: cím " + e.addr + " → sor " + e.line + " → set " + e.s + ": " + e.kind + (e.evicted !== null ? " (kiszorítva: " + e.evicted + ". sor)" : "");
  const k = step / L;
  $("cmp").textContent = "Bejárt setek eddig: " + used + (Number.isInteger(k) && k >= 1 ? "; a képlet S/gcd(k, S) = 64/gcd(" + k + ", 64) = " + (S / gcd(k, S)) + " (elég hozzáférés után)" : "; a lépés nem egész számú sor (k = " + k + "), a képlet k ≥ 1 egész sorlépésre vonatkozik");
}
function stop(){ if (tm) { clearInterval(tm); tm = null; } $("play").textContent = "▶ Lejátszás"; }
function rebuild(){ stop(); const st = Math.max(1, +$("st").value | 0), n = Math.max(1, Math.min(512, +$("nmax").value | 0)); ev = build(st, n); cur = Math.min(16, n); draw(); }
["st", "nmax"].forEach(id => $(id).addEventListener("change", rebuild));
document.querySelectorAll(".ex").forEach(b => b.onclick = () => { $("st").value = b.dataset.v; rebuild(); });
$("first").onclick = () => { stop(); cur = 0; draw(); };
$("prev").onclick = () => { stop(); cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { stop(); cur = Math.min(ev.length, cur + 1); draw(); };
$("play").onclick = () => { if (tm) { stop(); return; } if (cur >= ev.length) cur = 0; $("play").textContent = "⏸ Szünet";
  tm = setInterval(() => { if (cur >= ev.length) stop(); else { cur++; draw(); } }, 400); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
rebuild();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
