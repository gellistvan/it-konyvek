<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FCMP és feltételkódok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>a <input type="text" id="a" value="NaN" spellcheck="false" style="width:7em"></label>
 <label>b <input type="text" id="b" value="1.0" spellcheck="false" style="width:7em"></label>
 <button id="go">FCMP a, b</button>
 <button id="q1">a = NaN, b = 1.0: HI vs GT</button>
 <button id="q2">LE vs LS</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 230" role="img" aria-label="Négy kimenetel, NZCV és 13 feltételkód igazságtáblája"></svg>
<p class="small" id="self"></p>

<p class="small">A bemenet float32-re kerekül (Math.fround). −0 és +0 egyenlő; ha bármelyik operandus NaN, az eredmény rendezetlen (NZCV = 0011). A táblázat értékei unicorn-emulátorból (fcmp s0, s1 + cset).</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"conds": ["eq", "ne", "mi", "lo", "gt", "ge", "ls", "lt", "le", "hi", "hs", "vs", "vc"], "rows": [{"name": "egyenlő", "a": 1.0, "b": 1.0, "nzcv": "0110", "truth": {"eq": 1, "ne": 0, "mi": 0, "lo": 0, "gt": 0, "ge": 1, "ls": 1, "lt": 0, "le": 1, "hi": 0, "hs": 1, "vs": 0, "vc": 1}}, {"name": "nagyobb", "a": 2.0, "b": 1.0, "nzcv": "0010", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 1, "ge": 1, "ls": 0, "lt": 0, "le": 0, "hi": 1, "hs": 1, "vs": 0, "vc": 1}}, {"name": "kisebb", "a": 1.0, "b": 2.0, "nzcv": "1000", "truth": {"eq": 0, "ne": 1, "mi": 1, "lo": 1, "gt": 0, "ge": 0, "ls": 1, "lt": 1, "le": 1, "hi": 0, "hs": 0, "vs": 0, "vc": 1}}, {"name": "rendezetlen (NaN)", "a": "NaN", "b": 1.0, "nzcv": "0011", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 0, "ge": 0, "ls": 0, "lt": 1, "le": 1, "hi": 1, "hs": 1, "vs": 1, "vc": 0}}], "extra": [{"a": "-0.0", "b": "0.0", "nzcv": "0110", "truth": {"eq": 1, "ne": 0, "mi": 0, "lo": 0, "gt": 0, "ge": 1, "ls": 1, "lt": 0, "le": 1, "hi": 0, "hs": 1, "vs": 0, "vc": 1}}, {"a": "inf", "b": "1.0", "nzcv": "0010", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 1, "ge": 1, "ls": 0, "lt": 0, "le": 0, "hi": 1, "hs": 1, "vs": 0, "vc": 1}}, {"a": "1.0", "b": "nan", "nzcv": "0011", "truth": {"eq": 0, "ne": 1, "mi": 0, "lo": 0, "gt": 0, "ge": 0, "ls": 0, "lt": 1, "le": 1, "hi": 1, "hs": 1, "vs": 1, "vc": 0}}, {"a": "-inf", "b": "inf", "nzcv": "1000", "truth": {"eq": 0, "ne": 1, "mi": 1, "lo": 1, "gt": 0, "ge": 0, "ls": 1, "lt": 1, "le": 1, "hi": 0, "hs": 0, "vs": 0, "vc": 1}}], "conv": [{"w": 3, "fmov_bits": 3, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1077936128, "scvtf_u": 3, "scvtf_s": 3}, {"w": 10, "fmov_bits": 10, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1092616192, "scvtf_u": 10, "scvtf_s": 10}, {"w": -1, "fmov_bits": 4294967295, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 3212836864, "scvtf_u": 0, "scvtf_s": -1}, {"w": 0, "fmov_bits": 0, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 0, "scvtf_u": 0, "scvtf_s": 0}, {"w": 16777217, "fmov_bits": 16777217, "fmov_u": 0, "fmov_s": 0, "scvtf_bits": 1266679808, "scvtf_u": 16777216, "scvtf_s": 16777216}]};

const C = DATA.conds, ROWS = DATA.rows, HEADS = {lo: "CC/LO", hs: "CS/HS"}, COP = {eq: "==", ne: "!=", mi: "<", lo: "<", gt: ">", ge: ">=", ls: "<="}, TRAP = ["hi", "lt", "le", "hs"];
const svgV = $("v"); let focus = [];
function parse(t){ t = t.trim().toLowerCase().replace(",", "."); if (t === "nan") return NaN; if (t === "inf" || t === "+inf") return Infinity; if (t === "-inf") return -Infinity; if (t === "-0") return -0; if (t === "") return undefined; const x = Number(t); return Number.isNaN(x) ? undefined : Math.fround(x); }
function fcmp(a, b){ if (Number.isNaN(a) || Number.isNaN(b)) return "0011"; if (a === b) return "0110"; return a < b ? "1000" : "0010"; }
function truth(nzcv){ const [n, z, c, v] = nzcv.split("").map(Number);
  return {eq: z === 1, ne: z === 0, mi: n === 1, lo: c === 0, gt: z === 0 && n === v, ge: n === v, ls: c === 0 || z === 1, lt: n !== v, le: z === 1 || n !== v, hi: c === 1 && z === 0, hs: c === 1, vs: v === 1, vc: v === 0}; }
// önellenőrzés: a JS-modell = az emulátor (unicorn) eredménye
let ok = true;
ROWS.concat(DATA.extra).forEach(r => { const t = truth(r.nzcv); C.forEach(c => { if (+t[c] !== r.truth[c]) ok = false; }); });
ROWS.forEach(r => { const a = r.a === "NaN" ? NaN : r.a; if (fcmp(a, r.b) !== r.nzcv) ok = false; });
$("self").textContent = "Önellenőrzés (a lap modellje vs. unicorn-emulátor, fcmp + cset): " + (ok ? "OK" : "ELTÉRÉS");
function draw(nzcv){
  svgV.innerHTML = "";
  const X0 = 190, CW = 43, RH = 30, Y0 = 40;
  C.forEach((c, j) => mk(svgV, "text", {x: X0 + j * CW + CW / 2, y: Y0 - 12, "text-anchor": "middle", class: "mono", "font-size": 12, "font-weight": focus.includes(c) ? "bold" : "normal", fill: focus.includes(c) ? css("--hl") : undefined}, HEADS[c] || c.toUpperCase()));
  ROWS.forEach((r, i) => { const y = Y0 + i * RH, on = r.nzcv === nzcv;
    mk(svgV, "rect", {x: 2, y: y, width: X0 + 13 * CW - 2, height: RH, fill: on ? css("--cellhl") : "none", stroke: on ? css("--hl") : "none", "stroke-width": 2});
    mk(svgV, "text", {x: 8, y: y + 20, "font-size": 13, "font-weight": on ? "bold" : "normal"}, r.name);
    mk(svgV, "text", {x: 140, y: y + 20, class: "mono", "font-size": 13}, r.nzcv);
    const t = truth(r.nzcv);
    C.forEach((c, j) => { const trap = i === 3 && TRAP.includes(c);
      mk(svgV, "rect", {x: X0 + j * CW + 2, y: y + 3, width: CW - 4, height: RH - 6, fill: t[c] ? css("--cell2") : css("--cell"), stroke: focus.includes(c) && on ? css("--hl") : css("--line"), "stroke-width": trap ? 3 : (focus.includes(c) && on ? 3 : 0.6)});
      mk(svgV, "text", {x: X0 + j * CW + CW / 2, y: y + 20, "text-anchor": "middle", "font-size": 15, "font-weight": t[c] ? "bold" : "normal", fill: t[c] ? undefined : css("--muted")}, t[c] ? "✓" : "✗"); });
  });
  mk(svgV, "text", {x: 8, y: Y0 + 4 * RH + 24, "font-size": 13, "font-weight": "bold"}, "C-operátor");
  C.forEach((c, j) => mk(svgV, "text", {x: X0 + j * CW + CW / 2, y: Y0 + 4 * RH + 24, "text-anchor": "middle", class: "mono", "font-size": 13}, COP[c] || "–"));
  mk(svgV, "text", {x: 8, y: Y0 + 4 * RH + 52, "font-size": 12, fill: css("--muted")}, "vastag keret: a rendezetlen sorban is igaz („csapda”) – HI, LT, LE, CS/HS");
}
function run(){
  const a = parse($("a").value), b = parse($("b").value);
  if (a === undefined || b === undefined) { $("status").textContent = "Számot, NaN-t, inf-et vagy -0-t adj meg."; return; }
  const nz = fcmp(a, b), t = truth(nz), on = C.filter(c => t[c]).map(c => (HEADS[c] || c.toUpperCase()));
  const f = x => Object.is(x, -0) ? "-0" : String(x);
  $("status").textContent = "FCMP " + f(a) + ", " + f(b) + " → NZCV = " + nz + "; igaz: " + on.join(", ") + (focus.length ? " | " + focus.map(c => (HEADS[c] || c.toUpperCase()) + " = " + (t[c] ? "igaz" : "hamis")).join(", ") : "");
  draw(nz);
}
$("go").onclick = () => { focus = []; run(); };
["a", "b"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") { focus = []; run(); } }));
$("q1").onclick = () => { $("a").value = "NaN"; $("b").value = "1.0"; focus = ["hi", "gt"]; run(); };
$("q2").onclick = () => { $("a").value = "NaN"; $("b").value = "1.0"; focus = ["le", "ls"]; run(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", run);
focus = ["hi", "gt", "ls", "le"]; run();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
