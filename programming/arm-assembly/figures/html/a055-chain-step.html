<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A64 lánclépés: ldp lépteti a vermet, ret csak X30-ra ugrik</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="epi" checked onchange="reload()"> X30-at betöltő epilógus a G1-ben (ldp x29, x30, [sp], #16)</label><label><input type="checkbox" id="pac" onchange="reload()"> PAC (autiasp a ret előtt)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Veremoszlop négy cellával és regiszterdoboz; az ldp két cellát olvas és SP-t 16-tal növeli, a ret csak a PC-t állítja X30-ra."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Unicorn-nyomkövetés absztrakt címkékkel (figures/data/a055_chain_step_calc.py): S = a kezdő SP, G1/G2 = kódcímek, A/B = kísérő adat. Epilógus nélkül a G1 = add x0, x0, #1; ret önmagára tér vissza. A PAC-ág sematikus. Fogalmi, defenzív szemléltetés, nem működő payload.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: SP = S; a veremben [S] = A, [S+8] = G1, [S+16] = B, [S+24] = G2.", "sp": 0, "x29": "(korábbi)", "x30": "(korábbi)", "pc": "driver (+0)", "reads": [], "ins": "(kezdőállapot)", "line": -1, "x0": 0}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (driver); SP = S+16, X29 = A, X30 = G1, PC = driver (+4), olvasott cellák: S+0, S+8", "sp": 16, "x29": "A", "x30": "G1", "pc": "driver (+4)", "reads": [0, 1], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 0}, {"msg": "utasítás: ret (driver); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 0}, {"msg": "utasítás: add x0, x0, #1 (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "add x0, x0, #1", "line": -1, "x0": 1}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (G1); SP = S+32, X29 = B, X30 = G2, PC = G1, olvasott cellák: S+16, S+24", "sp": 32, "x29": "B", "x30": "G2", "pc": "G1", "reads": [2, 3], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 1}, {"msg": "utasítás: ret (G1); SP = S+32, X29 = B, X30 = G2, PC = G2, olvasott cellák: nincs", "sp": 32, "x29": "B", "x30": "G2", "pc": "G2", "reads": [], "ins": "ret", "line": -1, "x0": 1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"1|0": [{"msg": "Kezdőállapot: SP = S; a veremben [S] = A, [S+8] = G1, [S+16] = B, [S+24] = G2.", "sp": 0, "x29": "(korábbi)", "x30": "(korábbi)", "pc": "driver (+0)", "reads": [], "ins": "(kezdőállapot)", "line": -1, "x0": 0}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (driver); SP = S+16, X29 = A, X30 = G1, PC = driver (+4), olvasott cellák: S+0, S+8", "sp": 16, "x29": "A", "x30": "G1", "pc": "driver (+4)", "reads": [0, 1], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 0}, {"msg": "utasítás: ret (driver); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 0}, {"msg": "utasítás: add x0, x0, #1 (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "add x0, x0, #1", "line": -1, "x0": 1}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (G1); SP = S+32, X29 = B, X30 = G2, PC = G1, olvasott cellák: S+16, S+24", "sp": 32, "x29": "B", "x30": "G2", "pc": "G1", "reads": [2, 3], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 1}, {"msg": "utasítás: ret (G1); SP = S+32, X29 = B, X30 = G2, PC = G2, olvasott cellák: nincs", "sp": 32, "x29": "B", "x30": "G2", "pc": "G2", "reads": [], "ins": "ret", "line": -1, "x0": 1}], "0|0": [{"msg": "Kezdőállapot: SP = S; a veremben [S] = A, [S+8] = G1, [S+16] = B, [S+24] = G2.", "sp": 0, "x29": "(korábbi)", "x30": "(korábbi)", "pc": "driver (+0)", "reads": [], "ins": "(kezdőállapot)", "line": -1, "x0": 0}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (driver); SP = S+16, X29 = A, X30 = G1, PC = driver (+4), olvasott cellák: S+0, S+8", "sp": 16, "x29": "A", "x30": "G1", "pc": "driver (+4)", "reads": [0, 1], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 0}, {"msg": "utasítás: ret (driver); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 0}, {"msg": "utasítás: add x0, x0, #1 (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "add x0, x0, #1", "line": -1, "x0": 1}, {"msg": "utasítás: ret (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 1}, {"msg": "utasítás: add x0, x0, #1 (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "add x0, x0, #1", "line": -1, "x0": 2}, {"msg": "utasítás: ret (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 2}, {"msg": "utasítás: add x0, x0, #1 (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "add x0, x0, #1", "line": -1, "x0": 3}, {"msg": "utasítás: ret (G1); SP = S+16, X29 = A, X30 = G1, PC = G1, olvasott cellák: nincs", "sp": 16, "x29": "A", "x30": "G1", "pc": "G1", "reads": [], "ins": "ret", "line": -1, "x0": 3}], "1|1": [{"msg": "Kezdőállapot: SP = S; a veremben [S] = A, [S+8] = G1, [S+16] = B, [S+24] = G2.", "sp": 0, "x29": "(korábbi)", "x30": "(korábbi)", "pc": "driver (+0)", "reads": [], "ins": "(kezdőállapot)", "line": -1, "x0": 0}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (driver); SP = S+16, X29 = A, X30 = G1, PC = driver (+4), olvasott cellák: S+0, S+8", "sp": 16, "x29": "A", "x30": "G1", "pc": "driver (+4)", "reads": [0, 1], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 0}, {"msg": "utasítás: autiasp; hitelesítés: sikertelen (a veremből jött G1-nek nincs érvényes PAC-ja) → X30 mérgezett (FEAT_FPAC: itt kivétel)", "sp": 16, "x29": "A", "x30": "mérgezett", "pc": "driver (+8)", "reads": [], "ins": "autiasp", "line": -1, "x0": 0}, {"msg": "utasítás: ret; hitelesítés: sikertelen → fault, a G1 nem fut", "sp": 16, "x29": "A", "x30": "mérgezett", "pc": "fault", "reads": [], "ins": "ret", "line": -1, "x0": 0, "fault": 1}], "0|1": [{"msg": "Kezdőállapot: SP = S; a veremben [S] = A, [S+8] = G1, [S+16] = B, [S+24] = G2.", "sp": 0, "x29": "(korábbi)", "x30": "(korábbi)", "pc": "driver (+0)", "reads": [], "ins": "(kezdőállapot)", "line": -1, "x0": 0}, {"msg": "utasítás: ldp x29, x30, [sp], #16 (driver); SP = S+16, X29 = A, X30 = G1, PC = driver (+4), olvasott cellák: S+0, S+8", "sp": 16, "x29": "A", "x30": "G1", "pc": "driver (+4)", "reads": [0, 1], "ins": "ldp x29, x30, [sp], #16", "line": -1, "x0": 0}, {"msg": "utasítás: autiasp; hitelesítés: sikertelen (a veremből jött G1-nek nincs érvényes PAC-ja) → X30 mérgezett (FEAT_FPAC: itt kivétel)", "sp": 16, "x29": "A", "x30": "mérgezett", "pc": "driver (+8)", "reads": [], "ins": "autiasp", "line": -1, "x0": 0}, {"msg": "utasítás: ret; hitelesítés: sikertelen → fault, a G1 nem fut", "sp": 16, "x29": "A", "x30": "mérgezett", "pc": "fault", "reads": [], "ins": "ret", "line": -1, "x0": 0, "fault": 1}]};
function reload(){ setSteps(ALL[(document.getElementById("epi").checked ? 1 : 0) + "|" + (document.getElementById("pac").checked ? 1 : 0)]); }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 260");
  const cells = ["kísérő adat A", "G1 címe", "kísérő adat B", "G2 címe"], ch = 40, y0 = 200;
  el("text", {x: 20, y: 22, "font-size": 13, "font-weight": "bold"}, "Verem (felfelé növekvő cím)");
  for (let k = 0; k < 4; k++) {
    const y = y0 - (k + 1) * ch + 30, rd = s.reads.includes(k);
    el("rect", {x: 70, y: y, width: 170, height: ch, fill: rd ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": rd ? 3 : 1});
    el("text", {x: 155, y: y + ch / 2 + 5, "text-anchor": "middle", "font-size": 13}, cells[k]);
    el("text", {x: 64, y: y + ch / 2 + 5, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, "S+" + 8 * k);
  }
  const spk = s.sp / 8, ysp = y0 - spk * ch + 30;
  el("line", {x1: 290, y1: ysp, x2: 246, y2: ysp, stroke: css("--fg"), "stroke-width": 3});
  el("text", {x: 296, y: ysp + 5, "font-size": 13, "font-weight": "bold"}, "SP = S+" + s.sp);
  const regs = [["X29", s.x29], ["X30", s.x30], ["SP", "S+" + s.sp], ["PC", s.pc], ["X0", String(s.x0)]];
  regs.forEach((r, i) => {
    const y = 40 + i * 36, f = s.fault && (r[0] === "PC" || r[0] === "X30");
    el("rect", {x: 380, y: y, width: 170, height: 30, fill: css("--cell"), stroke: f ? css("--hl2") : css("--line"), "stroke-width": f ? 3 : 1, "stroke-dasharray": f ? "5 3" : "none"});
    el("text", {x: 390, y: y + 20, "font-size": 13, "font-weight": "bold"}, r[0]);
    el("text", {x: 430, y: y + 20, "font-size": 13}, r[1]);
  });
  el("text", {x: 20, y: 250, "font-size": 13}, "utasítás: " + s.ins + (s.ins === "ret" && !s.fault ? "  (memóriát nem olvas, SP-t nem változtat)" : ""));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
