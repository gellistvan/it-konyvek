<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex-M3 memóriatérkép – címdekóder</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>cím: <input id="ain" size="11" value="0xE000E100" aria-label="32 bites cím (hexa)" onkeydown="if(event.key==='Enter')goAddr(this.value)"></label><button onclick="goAddr(document.getElementById('ain').value)">Dekódol</button><button onclick="goAddr('0x00000004')">0x00000004</button><button onclick="goAddr('0x20010000')">0x20010000</button><button onclick="goAddr('0x20400010')">0x20400010</button><button onclick="goAddr('0x40004000')">0x40004000</button><button onclick="goAddr('0xE000E010')">0xE000E010</button><button onclick="goAddr('0xE000E100')">0xE000E100</button>
<script>
function decodeJs(a){
  a>>>=0; const u=a>>>29;
  const unit=["Code","SRAM","Peripheral","External RAM","External RAM","External device","External device","System"][u];
  const h=(v,n)=>"0x"+v.toString(16).toUpperCase().padStart(n,"0");
  const st=[["A[31:29]","0b"+u.toString(2).padStart(3,"0"),unit+" egység"]];
  if (u===7){
    const hi=a>>>20, ppb=hi===0xE00;
    st.push(["A[31:20]",h(hi,3),ppb?"PPB":"nem PPB: gyártói (vendor) rész"]);
    if (ppb){
      const blk=(a>>>12)&255, scs=blk===0x0E;
      st.push(["A[19:12]",h(blk,2),scs?"SCS (0xE000E000–0xE000EFFF)":"más PPB-blokk (ITM, DWT, FPB …)"]);
      if (scs){
        const off=a&0xFFF; let w;
        if (off>=0x010&&off<=0x01F) w= off===0x010?"SysTick (SYST_CSR = 0xE000E010)":"SysTick regiszter";
        else if (off>=0x100&&off<=0x11F) w="NVIC ISER"+((off-0x100)>>2);
        else w="SCS-regiszter (SCB, NVIC …)";
        st.push(["A[11:0]",h(off,3),w]);
      }
    }
  }
  let an;
  if (a<=0x003FFFFF) an="AN385: ZBT SSRAM1 („FLASH” a linker scriptben)";
  else if (a>=0x20000000&&a<=0x203FFFFF) an="AN385: SSRAM2/3, kanonikus RAM";
  else if (a>=0x20400000&&a<=0x207FFFFF) an="AN385: tükör → "+h(a-0x400000,8)+" (ugyanaz a bájt)";
  else if (a===0x40004000) an="AN385: UART0 (CMSDK APB)";
  else if (u===2) an="AN385: perifériatartomány (CMSDK/MPS2 eszközök)";
  else if (u===7&&(a>>>20)===0xE00) an="AN385: a mag PPB-je (SCS)";
  else an="AN385: nincs kitöltve (hozzáférés: fault vagy a modell viselkedése)";
  const out=[{a:a,n:0,line:-1,msg:"Cím: "+h(a,8)}];
  st.forEach((x,i)=>out.push({a:a,n:i+1,line:i,msg:x[0]+" = "+x[1]+": "+x[2]}));
  out.push({a:a,n:st.length+1,line:4,msg:an,an:an});
  const lines=out.slice(1).map(o=>o.msg);
  out.forEach(o=>o.lines=lines.slice(0,o.n));
  return out;
}
function goAddr(v){
  const a=parseInt(String(v).replace(/^0x/i,""),16);
  if (isNaN(a)||a<0||a>0xFFFFFFFF){ document.getElementById("ain").setAttribute("aria-invalid","true"); return; }
  document.getElementById("ain").value="0x"+(a>>>0).toString(16).toUpperCase().padStart(8,"0");
  const st=decodeJs(a); setSteps(st); show(st.length-1);
}
</script>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 4 GiB-os címtér nyolc 512 MiB-os egysége, a PPB nagyítva; mellette az AN385 4 MiB-os SSRAM1 és SSRAM2/3 blokkja, a 0x20400000-s tükör nyíllal az eredetire mutat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A régióhatárok a 16.3.2 táblázatából, az AN385-leképezés a 16.3 QEMU-táblázatából (QEMU 8.2.2 hw/arm/mps2.c) származik; a 0x40004000 = UART0 a Memory-mapped perifériák és GPIO alfejezet címe. A dekóder a 16.3.3 lépéseit követi.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": 3758153984, "n": 0, "line": -1, "msg": "Cím: 0xE000E100", "lines": []}, {"a": 3758153984, "n": 1, "line": 0, "msg": "A[31:29] = 0b111: System egység", "lines": ["A[31:29] = 0b111: System egység"]}, {"a": 3758153984, "n": 2, "line": 1, "msg": "A[31:20] = 0xE00: PPB", "lines": ["A[31:29] = 0b111: System egység", "A[31:20] = 0xE00: PPB"]}, {"a": 3758153984, "n": 3, "line": 2, "msg": "A[19:12] = 0x0E: SCS (0xE000E000–0xE000EFFF)", "lines": ["A[31:29] = 0b111: System egység", "A[31:20] = 0xE00: PPB", "A[19:12] = 0x0E: SCS (0xE000E000–0xE000EFFF)"]}, {"a": 3758153984, "n": 4, "line": 3, "msg": "A[11:0] = 0x100: NVIC ISER0", "lines": ["A[31:29] = 0b111: System egység", "A[31:20] = 0xE00: PPB", "A[19:12] = 0x0E: SCS (0xE000E000–0xE000EFFF)", "A[11:0] = 0x100: NVIC ISER0"]}, {"a": 3758153984, "n": 5, "line": 4, "msg": "AN385: a mag PPB-je (SCS)", "an": "AN385: a mag PPB-je (SCS)", "lines": ["A[31:29] = 0b111: System egység", "A[31:20] = 0xE00: PPB", "A[19:12] = 0x0E: SCS (0xE000E000–0xE000EFFF)", "A[11:0] = 0x100: NVIC ISER0", "AN385: a mag PPB-je (SCS)"]}];
const CODE = ["A[31:29]: 512 MiB-os egység (Code, SRAM, Peripheral, External RAM/device, System)", "A[31:20] == 0xE00 ? PPB : gyártói rész", "A[19:12] == 0x0E ? SCS (0xE000E000–0xE000EFFF)", "A[11:0]: regiszter az SCS-ben (0x010 SysTick, 0x100 NVIC ISER0)", "AN385: SSRAM1 / SSRAM2-3 / tükör (cím − 0x400000) / periféria / kitöltetlen"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hx(v){return "0x"+(v>>>0).toString(16).toUpperCase().padStart(8,"0");}
function render(s){
  svg.setAttribute("viewBox","0 0 640 300");
  svg.innerHTML = "";
  const a = s.a>>>0, u = a>>>29;
  const names = ["Code","SRAM","Peripheral","Ext. RAM","Ext. RAM","Ext. device","Ext. device","System"];
  for (let i=0;i<8;i++){
    const y = 275 - (i+1)*30, on = (i===u);
    el("rect",{x:40,y:y,width:140,height:30,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":on?3:1});
    el("text",{x:110,y:y+19,"text-anchor":"middle","font-size":12},names[i]+" ("+i.toString(2).padStart(3,"0")+")");
  }
  el("text",{x:110,y:24,"text-anchor":"middle","font-size":12,"font-weight":"bold"},"A[31:29]");
  // bitmezők
  const bits = a.toString(2).padStart(32,"0");
  const grp = [[0,3,"31:29"],[3,12,"28:20"],[12,20,"19:12"],[20,32,"11:0"]];
  for (let i=0;i<32;i++){
    const x = 210 + i*13;
    const g = i<3?1:(i<12?2:(i<20?3:4));
    const on = s.n>=g && g<=4;
    el("rect",{x:x,y:60,width:13,height:20,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":0.6});
    el("text",{x:x+6.5,y:75,"text-anchor":"middle","font-size":10},bits[i]);
  }
  grp.forEach(g=>el("text",{x:210+(g[0]+g[1])/2*13,y:96,"text-anchor":"middle","font-size":11,fill:css("--muted")},"A["+g[2]+"]"));
  el("text",{x:210,y:45,"font-size":14,"font-weight":"bold"},hx(a));
  (s.lines||[]).forEach((t,i)=>el("text",{x:210,y:130+i*22,"font-size":12,
      "font-weight":(i===s.n-1)?"bold":"normal"},t));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
