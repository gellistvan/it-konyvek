<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOVZ/MOVK/MOVN mezőírás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="prog">Utasítássor (soronként: MOVZ/MOVK/MOVN Xn|Wn, #imm16[, lsl #0/16/32/48]):</label><textarea id="prog" rows="5" cols="44" style="font:13px ui-monospace,monospace;width:100%">movz x3, #0xcdef
movk x3, #0x89ab, lsl #16
movk x3, #0x4567, lsl #32
movk x3, #0x0123, lsl #48</textarea><button type="button" onclick="loadProg(document.getElementById('prog').value.split('\n').map(s=>s.trim()).filter(s=>s))">Betöltés</button><span>Példák:</span><button type="button" onclick="loadProg(PRESETS['5.1.4 táblája'])">5.1.4 táblája</button><button type="button" onclick="loadProg(PRESETS['3. feladat (hibás)'])">3. feladat (hibás)</button><button type="button" onclick="loadProg(PRESETS['1. feladat (MOVN)'])">1. feladat (MOVN)</button><button type="button" onclick="loadProg(PRESETS['2. feladat (X11, X12)'])">2. feladat (X11, X12)</button><button type="button" onclick="loadProg(PRESETS['W-cél: lsl #32'])">W-cél: lsl #32</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az X3 négy 16 bites mezője lépésenként; a MOVZ nulláz, a MOVK megtart, a MOVN invertál."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A mezőmodell eredményeit a fejezet utasításainak unicorn-futtatásával vetettük össze (0x0123456789abcdef, 0x0123456789ab0000, 0xffffffffedcbffff, 0xfedcba9876543210, 0xffffffffffff1234). A W-célú lsl #32/#48 kódolhatatlan: az assembler elutasítja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: a regiszter tartalma ismeretlen (????). Lépés ▶ az első utasításhoz.", "line": -1, "regs": {}, "st": {}, "cur": null}, {"msg": "movz x3, #0xcdef  →  X3 = 0x000000000000cdef", "line": 0, "regs": {"3": [52719, 0, 0, 0]}, "st": {"3": ["W", "Z", "Z", "Z"]}, "cur": 3}, {"msg": "movk x3, #0x89ab, lsl #16  →  X3 = 0x0000000089abcdef", "line": 1, "regs": {"3": [52719, 35243, 0, 0]}, "st": {"3": ["K", "W", "K", "K"]}, "cur": 3}, {"msg": "movk x3, #0x4567, lsl #32  →  X3 = 0x0000456789abcdef", "line": 2, "regs": {"3": [52719, 35243, 17767, 0]}, "st": {"3": ["K", "K", "W", "K"]}, "cur": 3}, {"msg": "movk x3, #0x0123, lsl #48  →  X3 = 0x0123456789abcdef", "line": 3, "regs": {"3": [52719, 35243, 17767, 291]}, "st": {"3": ["K", "K", "K", "W"]}, "cur": 3}];
const CODE = ["movz x3, #0xcdef", "movk x3, #0x89ab, lsl #16", "movk x3, #0x4567, lsl #32", "movk x3, #0x0123, lsl #48"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PRESETS = {"5.1.4 táblája": ["movz x3, #0xcdef", "movk x3, #0x89ab, lsl #16", "movk x3, #0x4567, lsl #32", "movk x3, #0x0123, lsl #48"], "3. feladat (hibás)": ["movz x3, #0xcdef", "movz x3, #0x89ab, lsl #16", "movk x3, #0x4567, lsl #32", "movk x3, #0x0123, lsl #48"], "1. feladat (MOVN)": ["movn x2, #0x1234, lsl #16"], "2. feladat (X11, X12)": ["movz x11, #0x3210", "movk x11, #0x7654, lsl #16", "movk x11, #0xba98, lsl #32", "movk x11, #0xfedc, lsl #48", "movn x12, #0xedcb"], "W-cél: lsl #32": ["movz w3, #0x1234", "movk w3, #0x5678, lsl #32"]};
const RXI = /^\s*(movz|movk|movn)\s+([xw])(\d+)\s*,\s*#(0x[0-9a-f]+|\d+)\s*(?:,\s*lsl\s*#(\d+))?\s*$/i;
function hex4(v){return v===null||v===undefined?"????":v.toString(16).padStart(4,"0");}
function hexv(f){return [3,2,1,0].map(j=>hex4(f[j])).join("");}
function computeSteps(lines){
  const regs={}, out=[{msg:"Kezdőállapot: a regiszter tartalma ismeretlen (????). Lépés ▶ az első utasításhoz.",line:-1,regs:{},st:{},cur:null}];
  for(let i=0;i<lines.length;i++){
    const ins=lines[i], m=RXI.exec(ins);
    if(!m){out.push({msg:`${ins}: nem értelmezhető utasítás (MOVZ/MOVK/MOVN Xn|Wn, #imm16[, lsl #s])`,line:i,regs:JSON.parse(JSON.stringify(regs)),st:{},cur:null,err:1});continue;}
    const op=m[1].toLowerCase(), w=m[2].toLowerCase(), n=+m[3], imm=parseInt(m[4]), sh=+(m[5]||0);
    let err=null;
    if(imm>0xffff) err="az immediate 16 bites (0…0xffff)";
    else if(![0,16,32,48].includes(sh)) err="az eltolás 0, 16, 32 vagy 48 lehet";
    else if(w==="w"&&sh>16) err="W-célnál csak 0 vagy 16 (az assembler elutasítja)";
    if(err){out.push({msg:`${ins}: HIBA – ${err}`,line:i,regs:JSON.parse(JSON.stringify(regs)),st:{},cur:n,err:1});continue;}
    const hw=sh/16, old=regs[n]||[null,null,null,null], width=w==="w"?2:4, nw=[], st=[];
    for(let j=0;j<4;j++){
      if(j>=width){nw.push(0);st.push("Z");}
      else if(op==="movz"){nw.push(j===hw?imm:0);st.push(j===hw?"W":"Z");}
      else if(op==="movk"){nw.push(j===hw?imm:old[j]);st.push(j===hw?"W":"K");}
      else {nw.push((~(j===hw?imm:0))&0xffff);st.push("N");}
    }
    regs[n]=nw; const s={}; s[n]=st;
    out.push({msg:`${ins}  →  X${n} = 0x${hexv(nw)}`+(w==="w"?"  (W-cél: a felső 32 bit nullázódott)":""),line:i,regs:JSON.parse(JSON.stringify(regs)),st:s,cur:n});
  }
  return out;
}
function loadProg(lines){
  document.getElementById("prog").value=lines.join("\n");
  const L=lines; codeEl.innerHTML=L.map((l,i)=>`<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
  codeEl.style.display="";
  setSteps(computeSteps(L));
}
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 620 "+Math.max(150,60+Object.keys(s.regs).length*70));
  const fg=css("--fg");
  const defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
  defs.innerHTML=`<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-opacity="0.45" stroke-width="1.2"/></pattern>`;
  [0,1,2,3].forEach(j=>el("text",{x:120+j*115+55,y:24,"text-anchor":"middle","font-size":12},`[${63-16*j}:${48-16*j}] hw=${3-j}`));
  const keys=Object.keys(s.regs).sort((a,b)=>a-b);
  if(!keys.length) el("text",{x:20,y:70,"font-size":13},"(még nincs írt regiszter)");
  keys.forEach((k,r)=>{
    const y=40+r*70, f=s.regs[k], st=(s.st||{})[k];
    el("text",{x:10,y:y+30,"font-size":14,"font-weight":+k===s.cur?"bold":"normal"},"X"+k);
    [0,1,2,3].forEach(j=>{const hw=3-j, t=st?st[hw]:"";
      const a={x:120+j*115,y:y,width:108,height:44,fill:css("--cell"),stroke:fg,"stroke-width":1};
      if(t==="W"){a["stroke-width"]=4;} else if(t==="K"){a["stroke-dasharray"]="2 3";a["stroke-width"]=1.6;} else if(t==="N"){a.fill=fg;}
      el("rect",a); if(t==="Z") el("rect",{x:a.x,y:a.y,width:108,height:44,fill:"url(#hz)",stroke:"none"});
      const tx={x:a.x+54,y:y+28,"text-anchor":"middle","font-size":17,"font-family":"ui-monospace,monospace"};
      if(t==="N") tx.fill=css("--bg"); if(t==="W"||t==="N") tx["font-weight"]="bold";
      el("text",tx,hex4(f[hw]));
    });
    el("text",{x:120,y:y+60,"font-size":12,fill:css("--muted")},"= 0x"+hexv(f)+(st?"   (vastag: beírt, sraffozott: nullázott, pontozott: megtartott, sötét: invertált)":""));
  });
  if(s.err) el("text",{x:20,y:Math.max(140,40+keys.length*70+20),"font-size":14,"font-weight":"bold",fill:css("--hl2")},"Hibás utasítás – lásd az állapotsort");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
