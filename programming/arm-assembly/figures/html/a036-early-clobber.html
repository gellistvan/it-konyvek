<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korai felülírás: =r és =&r</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>megkötés <select id="md"><option value="=r">"=r"</option><option value="=&amp;r">"=&amp;r"</option></select></label> <label>a kimenet regisztere <select id="oreg"><option value="x0">X0</option><option value="x1">X1</option><option value="x2">X2</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hibás változat: out és a ugyanabban az X0-ban, az eredmény 40; javított: külön regiszter, az eredmény 21."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdetben a hibás eset ("=r", out = X0). A megkötés és a kimeneti regiszter választható; "=&r" mellett az X0/X1 kiosztás tiltott. a = 1, b = 10 (a = X0, b = X1). Az állapotok a lab-early.c sablonjának keystone + Unicorn futtatásából származnak; a regiszterszámokat a valóságban a GCC választja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "kezdet: X0=1, X1=10, X2=0; out=1", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x0", "mode": "=r", "forbidden": false, "ins": "kezdet"}, {"msg": "lsl x0, x1, #1: X0=20, X1=10, X2=0; out=20", "line": 1, "regs": {"x0": 20, "x1": 10, "x2": 0}, "i": 1, "out": "x0", "mode": "=r", "forbidden": false, "ins": "lsl x0, x1, #1"}, {"msg": "add x0, x0, x0: X0=40, X1=10, X2=0; out=40 – visszatérési érték 40 (HIBÁS, helyes: 21)", "line": 2, "regs": {"x0": 40, "x1": 10, "x2": 0}, "i": 2, "out": "x0", "mode": "=r", "forbidden": false, "ins": "add x0, x0, x0"}];
const CODE = ["__asm__(", "    \"lsl %x[out], %x[b], #1\\n\\t\"", "    \"add %x[out], %x[out], %x[a]\"", "    : [out] \"=r\" / \"=&r\" (out)", "    : [a] \"r\" (a), [b] \"r\" (b));", "// fordító által beszúrt visszatérés: mov x0, <out> (ha out ≠ X0)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"=r|x0": [{"msg": "kezdet: X0=1, X1=10, X2=0; out=1", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x0", "mode": "=r", "forbidden": false, "ins": "kezdet"}, {"msg": "lsl x0, x1, #1: X0=20, X1=10, X2=0; out=20", "line": 1, "regs": {"x0": 20, "x1": 10, "x2": 0}, "i": 1, "out": "x0", "mode": "=r", "forbidden": false, "ins": "lsl x0, x1, #1"}, {"msg": "add x0, x0, x0: X0=40, X1=10, X2=0; out=40 – visszatérési érték 40 (HIBÁS, helyes: 21)", "line": 2, "regs": {"x0": 40, "x1": 10, "x2": 0}, "i": 2, "out": "x0", "mode": "=r", "forbidden": false, "ins": "add x0, x0, x0"}], "=r|x1": [{"msg": "kezdet: X0=1, X1=10, X2=0; out=10", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x1", "mode": "=r", "forbidden": false, "ins": "kezdet"}, {"msg": "lsl x1, x1, #1: X0=1, X1=20, X2=0; out=20", "line": 1, "regs": {"x0": 1, "x1": 20, "x2": 0}, "i": 1, "out": "x1", "mode": "=r", "forbidden": false, "ins": "lsl x1, x1, #1"}, {"msg": "add x1, x1, x0: X0=1, X1=21, X2=0; out=21", "line": 2, "regs": {"x0": 1, "x1": 21, "x2": 0}, "i": 2, "out": "x1", "mode": "=r", "forbidden": false, "ins": "add x1, x1, x0"}, {"msg": "mov x0, x1: X0=21, X1=21, X2=0; out=21 – visszatérési érték 21 (helyes)", "line": 5, "regs": {"x0": 21, "x1": 21, "x2": 0}, "i": 3, "out": "x1", "mode": "=r", "forbidden": false, "ins": "mov x0, x1"}], "=r|x2": [{"msg": "kezdet: X0=1, X1=10, X2=0; out=0", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x2", "mode": "=r", "forbidden": false, "ins": "kezdet"}, {"msg": "lsl x2, x1, #1: X0=1, X1=10, X2=20; out=20", "line": 1, "regs": {"x0": 1, "x1": 10, "x2": 20}, "i": 1, "out": "x2", "mode": "=r", "forbidden": false, "ins": "lsl x2, x1, #1"}, {"msg": "add x2, x2, x0: X0=1, X1=10, X2=21; out=21", "line": 2, "regs": {"x0": 1, "x1": 10, "x2": 21}, "i": 2, "out": "x2", "mode": "=r", "forbidden": false, "ins": "add x2, x2, x0"}, {"msg": "mov x0, x2: X0=21, X1=10, X2=21; out=21 – visszatérési érték 21 (helyes)", "line": 5, "regs": {"x0": 21, "x1": 10, "x2": 21}, "i": 3, "out": "x2", "mode": "=r", "forbidden": false, "ins": "mov x0, x2"}], "=&r|x0": [{"msg": "TILTOTT kiosztás – kezdet: X0=1, X1=10, X2=0; out=1", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x0", "mode": "=&r", "forbidden": true, "ins": "kezdet"}, {"msg": "TILTOTT kiosztás – lsl x0, x1, #1: X0=20, X1=10, X2=0; out=20", "line": 1, "regs": {"x0": 20, "x1": 10, "x2": 0}, "i": 1, "out": "x0", "mode": "=&r", "forbidden": true, "ins": "lsl x0, x1, #1"}, {"msg": "TILTOTT kiosztás – add x0, x0, x0: X0=40, X1=10, X2=0; out=40 – visszatérési érték 40 (HIBÁS, helyes: 21)", "line": 2, "regs": {"x0": 40, "x1": 10, "x2": 0}, "i": 2, "out": "x0", "mode": "=&r", "forbidden": true, "ins": "add x0, x0, x0"}], "=&r|x1": [{"msg": "TILTOTT kiosztás – kezdet: X0=1, X1=10, X2=0; out=10", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x1", "mode": "=&r", "forbidden": true, "ins": "kezdet"}, {"msg": "TILTOTT kiosztás – lsl x1, x1, #1: X0=1, X1=20, X2=0; out=20", "line": 1, "regs": {"x0": 1, "x1": 20, "x2": 0}, "i": 1, "out": "x1", "mode": "=&r", "forbidden": true, "ins": "lsl x1, x1, #1"}, {"msg": "TILTOTT kiosztás – add x1, x1, x0: X0=1, X1=21, X2=0; out=21", "line": 2, "regs": {"x0": 1, "x1": 21, "x2": 0}, "i": 2, "out": "x1", "mode": "=&r", "forbidden": true, "ins": "add x1, x1, x0"}, {"msg": "TILTOTT kiosztás – mov x0, x1: X0=21, X1=21, X2=0; out=21 – visszatérési érték 21 (helyes)", "line": 5, "regs": {"x0": 21, "x1": 21, "x2": 0}, "i": 3, "out": "x1", "mode": "=&r", "forbidden": true, "ins": "mov x0, x1"}], "=&r|x2": [{"msg": "kezdet: X0=1, X1=10, X2=0; out=0", "line": -1, "regs": {"x0": 1, "x1": 10, "x2": 0}, "i": 0, "out": "x2", "mode": "=&r", "forbidden": false, "ins": "kezdet"}, {"msg": "lsl x2, x1, #1: X0=1, X1=10, X2=20; out=20", "line": 1, "regs": {"x0": 1, "x1": 10, "x2": 20}, "i": 1, "out": "x2", "mode": "=&r", "forbidden": false, "ins": "lsl x2, x1, #1"}, {"msg": "add x2, x2, x0: X0=1, X1=10, X2=21; out=21", "line": 2, "regs": {"x0": 1, "x1": 10, "x2": 21}, "i": 2, "out": "x2", "mode": "=&r", "forbidden": false, "ins": "add x2, x2, x0"}, {"msg": "mov x0, x2: X0=21, X1=10, X2=21; out=21 – visszatérési érték 21 (helyes)", "line": 5, "regs": {"x0": 21, "x1": 10, "x2": 21}, "i": 3, "out": "x2", "mode": "=&r", "forbidden": false, "ins": "mov x0, x2"}]};
function pick(){ const m = document.getElementById("md").value, o = document.getElementById("oreg").value; setSteps(ALL[m + "|" + o]); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 260"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hlc = css("--cellhl"), hl = css("--hl"), hl2 = css("--hl2"), mut = css("--muted");
  const prev = STEPS[Math.max(0, k - 1)].regs;
  el("text", {x: 20, y: 28, "font-size": 15, "font-weight": "bold"}, (s.mode === "=r" ? 'Hibás: "=r"' : 'Javított: "=&r"') + " – kiosztás: out = " + s.out.toUpperCase() + ", a = X0, b = X1");
  el("text", {x: 20, y: 52, "font-size": 12, fill: mut}, "egy lehetséges kiosztás – a valódi regisztereket a GCC választja");
  el("text", {x: 20, y: 88, "font-size": 15, "font-family": "ui-monospace,monospace"}, s.i ? s.ins : "kezdet: a = 1, b = 10");
  ["x0", "x1", "x2"].forEach((r, j) => {
    const ch = k > 0 && prev[r] !== s.regs[r], x = 20 + j * 150, y = 110;
    const role = [r === "x0" ? "a" : (r === "x1" ? "b" : ""), r === s.out ? "out" : ""].filter(Boolean).join(" = ");
    el("rect", {x, y, width: 130, height: 54, fill: ch ? hlc : cell, stroke: (role.includes("a") && role.includes("out")) ? hl2 : line, "stroke-width": ch ? 3 : 1.2});
    el("text", {x: x + 65, y: y + 24, "text-anchor": "middle", "font-size": 16, "font-family": "ui-monospace,monospace", "font-weight": "bold"}, r.toUpperCase() + " = " + s.regs[r]);
    el("text", {x: x + 65, y: y + 44, "text-anchor": "middle", "font-size": 12, fill: mut}, role || "–");
  });
  if (s.mode === "=r" && s.out === "x0" && s.i >= 1) el("text", {x: 20, y: 192, "font-size": 13, fill: hl2, "font-weight": "bold"}, "az a = 1 bemenet felülíródott – az add már 20-at olvas a helyett");
  if (s.forbidden) el("text", {x: 20, y: 215, "font-size": 13, fill: hl2, "font-weight": "bold"}, '"=&r" mellett ezt a kiosztást a GCC NEM választhatja: a kimenet nem eshet egybe egyik bemenettel sem');
  el("text", {x: 20, y: 245, "font-size": 12, fill: mut}, "vastag keret = ebben a lépésben írt regiszter; narancs keret = a kimenet és az a bemenet közös regisztere");
}

["md", "oreg"].forEach(id => document.getElementById(id).addEventListener("change", pick));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
