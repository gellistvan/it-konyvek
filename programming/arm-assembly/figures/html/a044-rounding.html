<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerekítés binary32-re</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>bemenet <input type="text" id="val" value="16777217" spellcheck="false"></label>
 <button id="go">Kerekít</button>
 <button id="nx">Következő könyvbeli példa ▶</button>
 <span class="small">16777217 → 16777219 → 33554435 → 0.1</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 170" role="img" aria-label="Számegyenes a két szomszédos float32 értékkel és a kerekítés irányával"></svg>
<table><tbody id="tb"></tbody></table>

<p class="small">A kerekítés a böngésző Math.fround függvénye (IEEE 754 binary32, round to nearest, ties to even). A decimális bemenet előbb double-re kerül; a guard/round/sticky bitek ebből a double-ből számolódnak (a float32 23 fraction-bitje utáni 29 bit). 0.1 → 0x3DCCCCCD.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


const EXS = ["16777217", "16777219", "33554435", "0.1"]; let ei = 0;
const svgV = $("v"), dv = new DataView(new ArrayBuffer(8));
function f32bits(x){ dv.setFloat32(0, x); return dv.getUint32(0); }
function fromBits(u){ dv.setUint32(0, u >>> 0); return dv.getFloat32(0); }
function dbits(x){ dv.setFloat64(0, x); return dv.getBigUint64(0); }
function fmt(x){ return String(x).replace(".", ","); }
function run(){
  const t = $("val").value.trim().replace(",", "."), x = Number(t);
  if (!isFinite(x) || t === "") { $("status").textContent = "Véges számot adj meg."; return; }
  const ax = Math.abs(x);
  if (ax !== 0 && (ax < 1.1754943508222875e-38 || ax >= 3.4028234663852886e38)) { $("status").textContent = "Ez a lap a normalizált float32 tartományra készült."; return; }
  const r = Math.fround(x), rb = f32bits(r);
  let lo, hi;
  if (r === x) { lo = hi = r; } else if (r < x) { lo = r; hi = fromBits(x > 0 ? rb + 1 : rb - 1); } else { hi = r; lo = fromBits(x > 0 ? rb - 1 : rb + 1); }
  const frac = dbits(x) & ((1n << 52n) - 1n);
  const g = Number((frac >> 28n) & 1n), rd = Number((frac >> 27n) & 1n), st = (frac & ((1n << 27n) - 1n)) !== 0n ? 1 : 0;
  const kind = r === x ? "pontosan ábrázolható" : (g === 0 ? "guard = 0 → lefelé (a kisebb abszolút értékű szomszéd)" : (rd || st ? "félút fölött → felfelé" : "pontos félút → a páros utolsó bitű szomszéd"));
  $("status").textContent = fmt(x) + " → " + fmt(r) + " (0x" + rb.toString(16).toUpperCase().padStart(8, "0") + "): " + kind;
  const rows = [["alsó szomszéd", fmt(lo) + " (utolsó bit " + (f32bits(lo) & 1) + ")"], ["felső szomszéd", fmt(hi) + " (utolsó bit " + (f32bits(hi) & 1) + ")"],
    ["lépésköz (ULP)", fmt(hi - lo || 0)], ["guard / round / sticky", g + " / " + rd + " / " + st], ["eredmény", fmt(r) + " = 0x" + rb.toString(16).toUpperCase().padStart(8, "0")]];
  $("tb").innerHTML = rows.map(q => "<tr><th>" + q[0] + "</th><td class='mono' style='text-align:left'>" + q[1] + "</td></tr>").join("");
  svgV.innerHTML = "";
  const span = (hi - lo) || Math.abs(x) * 1e-7 || 1, L = lo - span * 0.6, R = hi + span * 0.6;
  const X = v => 40 + (v - L) / (R - L) * 680;
  mk(svgV, "line", {x1: 30, y1: 90, x2: 730, y2: 90, stroke: css("--line"), "stroke-width": 1.5});
  [lo, hi].forEach(v => { mk(svgV, "circle", {cx: X(v), cy: 90, r: 7, fill: css("--fg")}); mk(svgV, "text", {x: X(v), y: 125, "text-anchor": "middle", class: "mono", "font-size": 13}, fmt(v)); mk(svgV, "text", {x: X(v), y: 145, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "utolsó bit " + (f32bits(v) & 1)); });
  if (lo !== hi) mk(svgV, "line", {x1: X((lo + hi) / 2), y1: 78, x2: X((lo + hi) / 2), y2: 102, stroke: css("--muted"), "stroke-dasharray": "3 3"});
  if (lo !== hi) mk(svgV, "text", {x: X((lo + hi) / 2), y: 72, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "félút");
  mk(svgV, "circle", {cx: X(x), cy: 90, r: 7, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 3});
  mk(svgV, "text", {x: X(x), y: 40, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "bemenet " + fmt(x));
  if (r !== x) { const x1 = X(x), x2 = X(r); mk(svgV, "path", {d: "M" + x1 + " 80 Q " + (x1 + x2) / 2 + " 50 " + x2 + " 80", fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    mk(svgV, "polygon", {points: x2 + ",82 " + (x2 + (x2 > x1 ? -9 : 9)) + ",74 " + (x2 + (x2 > x1 ? -2 : 2)) + ",72", fill: css("--hl")}); }
}
$("go").onclick = run;
$("val").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
$("nx").onclick = () => { ei = (ei + 1) % EXS.length; $("val").value = EXS[ei]; run(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", run);
run();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
