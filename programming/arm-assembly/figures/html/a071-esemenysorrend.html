let STEPS = [{"msg": "(1) Thread módban kiolvassuk a t0-t.", "line": 0, "hl": 0, "upto": 1, "span": [-3, 11], "title": "(A) Alappróba: Thread-trigger", "seg": [[0, -3, 0, "Thread-kód", "thr"], [0, 0, 4, "utasítások + buszírás", "thr"], [3, 4, 5, "", "pend"], [2, 5, 7.5, "L_entry", "entry"], [2, 7.5, 11, "lab_irq_isr", "irq"]], "ev": [[0, "t0"], [4, "ISPR-írás"], [7.6, "t1"]]}, {"msg": "A t0 utáni utasítások és az NVIC_ISPR0-írás buszátvitele.", "line": 1, "hl": 1, "upto": 4, "span": [-3, 11], "title": "(A) Alappróba: Thread-trigger", "seg": [[0, -3, 0, "Thread-kód", "thr"], [0, 0, 4, "utasítások + buszírás", "thr"], [3, 4, 5, "", "pend"], [2, 5, 7.5, "L_entry", "entry"], [2, 7.5, 11, "lab_irq_isr", "irq"]], "ev": [[0, "t0"], [4, "ISPR-írás"], [7.6, "t1"]]}, {"msg": "(2) Az írás után az IRQ6 pending (a pending a t0 UTÁN kezdődik).", "line": 2, "hl": 2, "upto": 5, "span": [-3, 11], "title": "(A) Alappróba: Thread-trigger", "seg": [[0, -3, 0, "Thread-kód", "thr"], [0, 0, 4, "utasítások + buszírás", "thr"], [3, 4, 5, "", "pend"], [2, 5, 7.5, "L_entry", "entry"], [2, 7.5, 11, "lab_irq_isr", "irq"]], "ev": [[0, "t0"], [4, "ISPR-írás"], [7.6, "t1"]]}, {"msg": "(3) Belépés: 8 szó stacking + vektorlekérés (L_entry).", "line": 3, "hl": 3, "upto": 7.5, "span": [-3, 11], "title": "(A) Alappróba: Thread-trigger", "seg": [[0, -3, 0, "Thread-kód", "thr"], [0, 0, 4, "utasítások + buszírás", "thr"], [3, 4, 5, "", "pend"], [2, 5, 7.5, "L_entry", "entry"], [2, 7.5, 11, "lab_irq_isr", "irq"]], "ev": [[0, "t0"], [4, "ISPR-írás"], [7.6, "t1"]]}, {"msg": "(4) A kezelő első mérőpontja kiolvassa a t1-et: t1 − t0 = utasítások + buszírás + L_entry.", "line": 4, "hl": 4, "upto": 11, "span": [-3, 11], "title": "(A) Alappróba: Thread-trigger", "seg": [[0, -3, 0, "Thread-kód", "thr"], [0, 0, 4, "utasítások + buszírás", "thr"], [3, 4, 5, "", "pend"], [2, 5, 7.5, "L_entry", "entry"], [2, 7.5, 11, "lab_irq_isr", "irq"]], "ev": [[0, "t0"], [4, "ISPR-írás"], [7.6, "t1"]]}];
const CODE = ["Thread: t0 = DWT_CYCCNT            (1)", "Thread: NVIC_ISPR0 = 1u << 6        (2) IRQ6 pending", "SysTick (0x20) fut: a magasabb prioritású kezelő", "NVIC: pending → elfogadás", "belépés: stacking + vektor (vagy tail-chain)  (3)", "lab_irq_isr: t1 = DWT_CYCCNT        (4)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = "";
  const lanes = ["Thread", "SysTick (0x20)", "IRQ6 (0x80)", "IRQ6 pending"];
  const L = 130, R = 550, top = 50, lh = 46, a0 = s.span[0], a1 = s.span[1];
  svg.setAttribute("viewBox", "0 0 560 " + (top + lh * 4 + 30));
  const X = t => L + (t - a0) / (a1 - a0) * (R - L);
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, s.title);
  lanes.forEach((n, i) => {
    el("text", {x: L - 8, y: top + i * lh + 5, "text-anchor": "end", "font-size": 13}, n);
    el("line", {x1: L, y1: top + i * lh, x2: R, y2: top + i * lh, stroke: css("--muted"), "stroke-width": 0.5, "stroke-dasharray": "2 4"});
  });
  s.seg.forEach((g, j) => {
    const [ln, a, b, lab, kind] = g;
    if (a >= s.upto) return;
    const bb = Math.min(b, s.upto), y = top + ln * lh, on = j === s.hl;
    if (kind === "pend") {
      el("line", {x1: X(a), y1: y, x2: X(bb), y2: y, stroke: css("--hl2"), "stroke-width": on ? 5 : 3, "stroke-dasharray": "7 4"});
      return;
    }
    const fill = kind === "thr" ? css("--cellhl") : css("--cell");
    el("rect", {x: X(a), y: y - 14, width: Math.max(1, X(bb) - X(a)), height: 28, fill: fill,
                stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    if (kind === "sys") for (let q = X(a); q < X(bb); q += 8)
      el("line", {x1: q, y1: y + 14, x2: Math.min(q + 10, X(bb)), y2: y - 14 + Math.max(0, q + 10 - X(bb)) * 2.8, stroke: css("--muted"), "stroke-width": 0.8});
    if (kind === "irq") for (let q = X(a) + 4; q < X(bb); q += 8) el("circle", {cx: q, cy: y, r: 1.3, fill: css("--muted")});
    if (lab && X(bb) - X(a) > 40) el("text", {x: (X(a) + X(bb)) / 2, y: y + 5, "text-anchor": "middle", "font-size": 12,
        "font-weight": on ? "bold" : "normal"}, lab);
  });
  s.ev.forEach(([t, lab]) => {
    if (t > s.upto || (lab !== "t0" && lab !== "t1")) return;
    el("line", {x1: X(t), y1: top - 22, x2: X(t), y2: top + lh * 3 + 14, stroke: css("--fg"), "stroke-width": 1.2, "stroke-dasharray": "2 2"});
    el("text", {x: X(t), y: top - 26, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, lab);
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
