<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XOR-összecsukás: lab_parity32</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>bemenet <input id="hin" size="12" value="0xffffffff" aria-label="Bemenet hexában"></label> <label><input id="s16" type="checkbox"> 16-os lépés kihagyása</label> <label><input id="nand" type="checkbox"> végső AND kihagyása</label> <button onclick="recompute()">Újraszámolás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt EOR-lépés után az érték 0xaaaaaaaa; csak a 0. bit a paritás, ezért kell AND #1."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdetben a 0xffffffff bemenet (a statikus ábra b része). A 0x00010000 bemenet a 16-os lépés kihagyásával 0 paritást ad (helyes: 1). Az értékeket a fejezet lab_parity32 kódjának keystone + Unicorn futtatásával ellenőriztük.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "bemenet: W0=0xffffffff", "v": "0xffffffff", "s": 32, "line": -1}, {"msg": "lépés s=16: W0=0xffff0000, eddig összecsukott bitek száma = 2", "v": "0xffff0000", "s": 16, "line": 0}, {"msg": "lépés s=8: W0=0xff00ff00, eddig összecsukott bitek száma = 4", "v": "0xff00ff00", "s": 8, "line": 1}, {"msg": "lépés s=4: W0=0xf0f0f0f0, eddig összecsukott bitek száma = 8", "v": "0xf0f0f0f0", "s": 4, "line": 2}, {"msg": "lépés s=2: W0=0xcccccccc, eddig összecsukott bitek száma = 16", "v": "0xcccccccc", "s": 2, "line": 3}, {"msg": "lépés s=1: W0=0xaaaaaaaa, eddig összecsukott bitek száma = 32", "v": "0xaaaaaaaa", "s": 1, "line": 4}, {"msg": "and #1: W0=0x00000000 → paritás = 0", "v": "0x00000000", "s": 1, "line": 5, "fin": true}];
const CODE = ["eor     w0, w0, w0, lsr #16", "eor     w0, w0, w0, lsr #8", "eor     w0, w0, w0, lsr #4", "eor     w0, w0, w0, lsr #2", "eor     w0, w0, w0, lsr #1", "and     w0, w0, #1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function recompute(){
  let x; try { x = Number(BigInt(document.getElementById("hin").value.trim()) & 0xFFFFFFFFn); } catch(e){ status.textContent = "Érvénytelen bemenet."; return; }
  const sk = document.getElementById("s16").checked, na = document.getElementById("nand").checked;
  const hx = v => "0x" + (v >>> 0).toString(16).padStart(8, "0");
  const L = [{msg: "bemenet: W0=" + hx(x), v: hx(x), s: 32, line: -1}];
  let cur = x >>> 0, folded = 1; let c = 0;
  for (let i = 0; i < 5; i++) { const s = [16, 8, 4, 2, 1][i]; if (sk && s === 16) continue;
    cur = (cur ^ (cur >>> s)) >>> 0; folded *= 2;
    L.push({msg: "lépés s=" + s + ": W0=" + hx(cur) + ", eddig összecsukott bitek száma = " + folded, v: hx(cur), s, line: i}); }
  let pop = 0; for (let b = 0; b < 32; b++) pop += (x >>> b) & 1;
  if (!na) { cur = cur & 1; L.push({msg: "and #1: W0=" + hx(cur) + " → paritás = " + cur + (cur === (pop & 1) ? " (helyes)" : " – HIBÁS, a helyes paritás " + (pop & 1)), v: hx(cur), s: 1, line: 5, fin: true}); }
  else L.push({msg: "AND kihagyva: W0=" + hx(cur) + (cur > 1 ? " – nem 0/1, a felső bitek szemetek (helyes paritás: " + (pop & 1) + ")" : ""), v: hx(cur), s: 1, line: -1, fin: true});
  setSteps(L);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 900 250"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hlc = css("--cellhl"), hl = css("--hl"), mut = css("--muted"), fg = css("--fg");
  const X0 = 80, W = 22, v = parseInt(s.v, 16) >>> 0, prev = parseInt(STEPS[Math.max(0, k - 1)].v, 16) >>> 0, sh = s.s;
  function bitrow(y, val, lab, useful){
    el("text", {x: X0 - 8, y: y + 16, "text-anchor": "end", "font-size": 13}, lab);
    for (let j = 0; j < 32; j++) { const b = 31 - j, on = (val >>> b) & 1, junk = b >= useful;
      el("rect", {x: X0 + j * W, y, width: W, height: 22, fill: on ? (junk ? hlc : fg) : cell, stroke: line, "stroke-width": 0.6, opacity: junk ? 0.55 : 1}); }
    el("rect", {x: X0 + (32 - useful) * W, y, width: useful * W, height: 22, fill: "none", stroke: hl, "stroke-width": 2.5});
    el("text", {x: X0 + 32 * W + 8, y: y + 16, "font-size": 13, "font-family": "ui-monospace,monospace", "font-weight": "bold"}, "0x" + val.toString(16).padStart(8, "0"));
  }
  el("text", {x: X0, y: 16, "font-size": 11, fill: mut}, "31"); el("text", {x: X0 + 32 * W, y: 16, "text-anchor": "end", "font-size": 11, fill: mut}, "0");
  if (k > 0) bitrow(24, prev, "előtte", STEPS[k - 1].s);
  bitrow(110, v, k === 0 ? "bemenet" : (s.fin ? "eredmény" : "s=" + sh), sh);
  if (k > 0 && !s.fin) {
    // néhány reprezentatív i+s → i nyíl
    const idx = [0, Math.max(0, sh - 1)].filter((x, i, a) => a.indexOf(x) === i);
    idx.forEach(i => { const xa = X0 + (31 - i - sh) * W + W / 2, xb = X0 + (31 - i) * W + W / 2;
      el("path", {d: `M${xa} 48 C ${xa} 80 ${xb} 78 ${xb} 106`, fill: "none", stroke: hl, "stroke-width": 1.5, "stroke-dasharray": "4 3", "marker-end": "url(#ah)"}); });
    el("text", {x: X0, y: 160, "font-size": 12.5}, "az i + " + sh + ". bit az i. pozícióra XOR-olódik (szaggatott nyíl); hasznos tartomány: az alsó " + sh + " bit (kék keret)");
  }
  el("text", {x: X0, y: 185, "font-size": 12.5, fill: mut}, "halvány cella = a hasznos tartományon kívüli „szemétbit”; csak a 0. bit a paritás");
  const d = document.createElementNS(NS, "defs");
  d.innerHTML = `<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${hl}"/></marker>`;
  svg.appendChild(d);
}

["hin", "s16", "nand"].forEach(id => document.getElementById(id).addEventListener("change", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
