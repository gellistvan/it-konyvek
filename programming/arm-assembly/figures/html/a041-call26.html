<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALL26-relokáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>P (hívás címe) <input type="text" id="P" value="0x400614" spellcheck="false"></label>
 <label>S (lab_adjust címe) <input type="text" id="S" value="0x4005f0" spellcheck="false"></label>
 <label>A (addend) <input type="text" id="A" value="0" spellcheck="false" style="width:5em"></label>
 <button id="go">Számol</button>
 <button id="obj">Objektum (imm26 = 0)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 150" role="img" aria-label="A BL gépi szó bitmezői"></svg>
<table><tbody id="tb"></tbody></table>

<p class="small">A kezdő P és S érték szemléltető cím, nem a könyv mérése. A képletet keystone-nal ellenőriztük (a valódi bl-kódolás minden vizsgált párra egyezett, a +128 MiB − 4 határon is).</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


const svgV = $("v");
function parse(s){ s = s.trim().toLowerCase(); const neg = s.startsWith("-"); if (neg) s = s.slice(1);
  const v = s.startsWith("0x") ? BigInt(s) : BigInt(s.length ? s : "x"); return neg ? -v : v; }
function draw(word, imm, ok){
  svgV.innerHTML = "";
  const x0 = 10, cw = 23;
  for (let b = 31; b >= 0; b--) {
    const i = 31 - b, bit = Number((BigInt(word) >> BigInt(b)) & 1n), link = b <= 25;
    mk(svgV, "rect", {x: x0 + i * cw, y: 50, width: cw, height: 34, fill: link ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    mk(svgV, "text", {x: x0 + i * cw + cw / 2, y: 73, "text-anchor": "middle", class: "mono", "font-size": 15}, String(bit));
    if (b % 4 === 3 || b === 0) mk(svgV, "text", {x: x0 + i * cw + cw / 2, y: 42, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(b));
  }
  mk(svgV, "text", {x: x0 + 3 * cw, y: 108, "text-anchor": "middle", "font-size": 13}, "[31:26] = 100101 (BL)");
  mk(svgV, "text", {x: x0 + 19 * cw, y: 108, "text-anchor": "middle", "font-size": 13}, "[25:0] = imm26 (a linker írja)");
  mk(svgV, "text", {x: x0, y: 18, "font-size": 14, "font-weight": "bold", class: "mono"}, "gépi szó: 0x" + word.toString(16).padStart(8, "0") + (ok ? "" : "  (nem kódolható)"));
}
function calc(){
  let P, S, A;
  try { P = parse($("P").value); S = parse($("S").value); A = parse($("A").value); }
  catch (e) { $("status").textContent = "Hibás szám: hexadecimálisan 0x… vagy decimálisan add meg."; return; }
  const d = S + A - P, lo = -(1n << 27n), hi = (1n << 27n);
  const inRange = d >= lo && d < hi, al = (d % 4n) === 0n;
  const imm = Number((d >> 2n) & 0x3FFFFFFn);
  const word = (0x94000000 | imm) >>> 0;
  const rows = [["S + A − P", d.toString() + " bájt (0x" + (d < 0n ? "-" + (-d).toString(16) : d.toString(16)) + ")"],
    ["imm26 = (S + A − P) >> 2", "0x" + imm.toString(16).padStart(7, "0") + " (26 bites, kettes komplemens)"],
    ["tartomány", "−134217728 … +134217724 bájt (−128 MiB … +128 MiB − 4)"]];
  $("tb").innerHTML = rows.map(r => "<tr><th>" + r[0] + "</th><td class='mono'>" + r[1] + "</td></tr>").join("");
  if (!al) { $("status").innerHTML = "<span class='warn'>A cél nem 4 bájtra igazított: BL-lel nem érhető el.</span>"; draw(word, imm, false); return; }
  if (!inRange) { $("status").innerHTML = "<span class='warn'>Tartományon kívül: veneer szükséges</span> (a linker köztes ugrókódot illeszt be, a BL a veneerre mutat)."; draw(word, imm, false); return; }
  $("status").textContent = "A linker a 0x94000000 helyőrzőt erre írja át: 0x" + word.toString(16).padStart(8, "0") + " (bl " + (d >= 0n ? "+" : "") + d + ").";
  draw(word, imm, true);
}
$("go").onclick = calc;
["P", "S", "A"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") calc(); }));
$("obj").onclick = () => { $("tb").innerHTML = ""; $("status").textContent = "Objektumban (linkelés előtt): imm26 = 0, gépi szó 0x94000000; a valódi célt az R_AARCH64_CALL26 bejegyzés adja meg."; draw(0x94000000, 0, true); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", calc);
calc();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
