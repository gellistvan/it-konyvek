<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorrendi és oszloponkénti bejárás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>STRIDE <select id="d"><option value="1">1 (sorrendi)</option><option value="32" selected>32</option><option value="1024">1024</option></select></label>
 <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button><button id="end">Végére</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 250" role="img" aria-label="8 × 32-es kicsinyített rács, a bejárási sorrend és a cache-sor-határok"></svg>
<table><tbody id="tb"></tbody></table>

<p class="small">A rács kicsinyített (STRIDE = 32, N = 256). A teljes méretű L1-hibaszámok a 13.1.12 modelljéből, determinisztikus LRU-szimulációval (figures/data/a049_cache_calc.py): sorrendi 65 536, stride 32 és stride 1024 egyaránt 1 048 576. Ez modell, nem mérés; a valódi rangsort natív AArch64-en kell mérni.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"full": {"1": {"reads": 1048576, "misses": 65536}, "32": {"reads": 1048576, "misses": 1048576}, "1024": {"reads": 1048576, "misses": 1048576}}};

const ROWS = 8, D = 32, N = 256, FULL = DATA.full; let cur = 0, tm = null, ord = [];
const svgV = $("v");
function order(d){ if (d === 1) return [...Array(N).keys()]; const o = []; for (let c = 0; c < D; c++) for (let k = c; k < N; k += D) o.push(k); return o; }
function draw(){
  svgV.innerHTML = "";
  const CW = 22, X0 = 20, Y0 = 20, seen = new Map(), lines = new Set(); let sw = 0;
  ord.slice(0, cur).forEach((k, i) => { seen.set(k, i + 1); lines.add(k >> 4); if (i && (ord[i - 1] >> 4) !== (k >> 4)) sw++; });
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < D; c++) { const k = r * D + c, n = seen.get(k), last = cur && ord[cur - 1] === k;
    mk(svgV, "rect", {x: X0 + c * CW, y: Y0 + r * CW, width: CW, height: CW, fill: n ? css("--cellhl") : css("--cell"), stroke: last ? css("--hl") : css("--grid"), "stroke-width": last ? 3 : 0.6});
    if (n && n <= 99) mk(svgV, "text", {x: X0 + c * CW + CW / 2, y: Y0 + r * CW + 15, "text-anchor": "middle", "font-size": 9}, String(n)); }
  [0, 16, 32].forEach(c => mk(svgV, "line", {x1: X0 + c * CW, y1: Y0, x2: X0 + c * CW, y2: Y0 + ROWS * CW, stroke: css("--line"), "stroke-width": 3}));
  mk(svgV, "text", {x: X0, y: Y0 + ROWS * CW + 22, "font-size": 12, fill: css("--muted")}, "vastag vonal: 64 bájtos cache-sor határa (16 elem); szám: hányadikként olvastuk (99-ig)");
  const d = $("d").value, full = FULL[d];
  $("cnt").textContent = cur + "/" + N;
  $("tb").innerHTML = "<tr><th>kicsinyített rács (N = 256)</th><td>olvasott elemek: " + cur + "</td><td>érintett cache-sorok: " + lines.size + "</td><td>sorváltások: " + sw + "</td></tr>" +
    "<tr><th>teljes méret (N = 1 048 576), modell-L1</th><td colspan='3'>L = 64, S = 64, 8 utas, LRU: " + full.misses.toLocaleString("hu-HU") + " L1-hiba " + full.reads.toLocaleString("hu-HU") + " olvasásból</td></tr>";
  const k = cur ? ord[cur - 1] : null;
  $("status").textContent = cur === 0 ? "STRIDE = " + d + (d === "1024" ? " (a kicsinyített rácson ugyanaz az oszloponkénti sorrend, mint a 32-nél)" : "") + ": léptess a bejáráshoz." :
    cur + ". olvasás: k = " + k + " (sor " + Math.floor(k / D) + ", oszlop " + (k % D) + "), cache-sor " + (k >> 4) + (cur > 1 && (ord[cur - 2] >> 4) === (k >> 4) ? " – ugyanaz a sor, mint az előző" : " – másik sor, mint az előző");
}
function stop(){ if (tm) { clearInterval(tm); tm = null; } $("play").textContent = "▶ Lejátszás"; }
function rebuild(){ stop(); const d = +$("d").value; ord = order(d === 1 ? 1 : D); cur = 20; draw(); }
$("d").onchange = rebuild;
$("first").onclick = () => { stop(); cur = 0; draw(); };
$("prev").onclick = () => { stop(); cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { stop(); cur = Math.min(N, cur + 1); draw(); };
$("end").onclick = () => { stop(); cur = N; draw(); };
$("play").onclick = () => { if (tm) { stop(); return; } if (cur >= N) cur = 0; $("play").textContent = "⏸ Szünet";
  tm = setInterval(() => { if (cur >= N) stop(); else { cur++; draw(); } }, 120); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
rebuild();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
