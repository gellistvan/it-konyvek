<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMSDK timer: VALUE, RELOAD és IRQ</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Periféria:</span>
<button id="kc" aria-pressed="true">CMSDK</button><button id="ks" aria-pressed="false">SysTick</button>
<label>új érték: <input id="nv" type="number" min="1" max="7" value="5" style="width:3.5em"></label>
<button id="wr">RELOAD írása ebben a ciklusban</button><button id="wv">VALUE írása ebben a ciklusban</button>
<button id="clr">Beavatkozások törlése</button>
<script>
let EV = [[6, "reload", 5]], KIND = "cmsdk";
function rerun(stay){ const kk = stay ? k : 0; setSteps(stepsOf(simT(KIND, EV), KIND)); show(kk); }
document.getElementById("kc").onclick = () => { KIND = "cmsdk"; document.getElementById("kc").setAttribute("aria-pressed", "true");
  document.getElementById("ks").setAttribute("aria-pressed", "false"); rerun(true); };
document.getElementById("ks").onclick = () => { KIND = "systick"; document.getElementById("ks").setAttribute("aria-pressed", "true");
  document.getElementById("kc").setAttribute("aria-pressed", "false"); rerun(true); };
function nv(){ return Math.max(1, Math.min(7, parseInt(document.getElementById("nv").value) || 5)); }
document.getElementById("wr").onclick = () => { EV = EV.filter(e => e[0] !== k); EV.push([k, "reload", nv()]); rerun(true); };
document.getElementById("wv").onclick = () => { EV = EV.filter(e => e[0] !== k); EV.push([k, "value", nv()]); rerun(true); };
document.getElementById("clr").onclick = () => { EV = []; rerun(true); };
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Lépcsős fűrészfog 3-tól 0-ig, minden nullánál megszakításkérés; futás közbeni RELOAD-írás"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

const CODE = ["CTRL = ENABLE | INTEN; RELOAD = 3   (az írás VALUE-t is tölt)", "minden ciklus: VALUE ← VALUE − 1", "VALUE = 0 után: VALUE ← RELOAD, INTSTATUS ← 1 → IRQ8", "futás közbeni írás: CMSDK RELOAD → VALUE is; SysTick RVR → csak a következő nullánál"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function simT(kind, events){
  let reload = 3, v = 3, ints = 0, ack = -1; const out = [];
  for (let t = 0; t < 17; t++) {
    let irq = false, note = "";
    if (t > 0) { if (v === 0) { v = reload; irq = true; ints = 1; ack = t + 1; } else v -= 1; }
    events.forEach(([te, what, val]) => { if (te === t) {
      if (what === "reload") { reload = val; note = "RELOAD ← " + val; if (kind === "cmsdk") v = val; }
      else { v = val; note = "VALUE ← " + val; } } });
    if (ack === t) { ints = 0; ack = -1; note = (note ? note + "; " : "") + "ISR: INTSTATUS W1C"; }
    out.push({t, v, ints, irq, note, reload});
  }
  return out;
}
function stepsOf(tr, kind){
  return tr.map(r => { const later = tr.filter(x => x.irq && x.t > r.t); const nxt = later.length ? later[0].t : null;
    const msg = `ciklus ${r.t}: VALUE = ${r.v}, INTSTATUS = ${r.ints}` + (r.irq ? " — nullaátlépés: IRQ8 kérés" : "") +
      (r.note ? " — " + r.note : "") + (nxt !== null ? `; következő IRQ: ${nxt}. ciklus` : "");
    const line = r.irq ? 2 : ((r.note.includes("RELOAD") || r.note.includes("VALUE")) ? 3 : 1);
    return {msg, line, k: r.t, tr, kind}; });
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 270");
  const tr = s.tr, L = 50, cw = 29, Y = v => 200 - v * 22;
  el("text", {x: 8, y: 20, "font-size": 13, "font-weight": "bold"}, s.kind === "cmsdk" ? "CMSDK APB timer" : "SysTick");
  [0, 3, 5].forEach(v => { el("line", {x1: L, y1: Y(v), x2: L + 17 * cw, y2: Y(v), stroke: css("--muted"), "stroke-width": 0.4, "stroke-dasharray": "2 3"});
    el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, String(v)); });
  for (let j = 0; j <= s.k; j++) {
    const r = tr[j], x = L + j * cw, on = j === s.k;
    if (j > 0) el("line", {x1: x, y1: Y(tr[j - 1].v), x2: x, y2: Y(r.v), stroke: css("--fg"), "stroke-width": 2});
    el("line", {x1: x, y1: Y(r.v), x2: x + cw, y2: Y(r.v), stroke: on ? css("--hl") : css("--fg"), "stroke-width": on ? 4 : 2});
    el("text", {x: x + cw / 2, y: Y(r.v) - 5, "text-anchor": "middle", "font-size": 11}, String(r.v));
    if (r.irq) { el("line", {x1: x, y1: 70, x2: x, y2: 45, stroke: css("--hl2"), "stroke-width": 2});
      el("text", {x: x, y: 40, "text-anchor": "middle", "font-size": 11, fill: css("--hl2")}, "IRQ"); }
    if (r.note.includes("←")) { el("line", {x1: x, y1: 50, x2: x, y2: 205, stroke: css("--hl"), "stroke-dasharray": "2 2"});
      el("text", {x: x + 3, y: 62, "font-size": 11, fill: css("--hl")}, r.note.split(";")[0]); }
    el("line", {x1: x, y1: 245 - 16 * r.ints, x2: x + cw, y2: 245 - 16 * r.ints, stroke: css("--muted"), "stroke-width": 2});
    if (j > 0 && tr[j - 1].ints !== r.ints) el("line", {x1: x, y1: 245, x2: x, y2: 229, stroke: css("--muted"), "stroke-width": 2});
    el("text", {x: x + cw / 2, y: 262, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(j));
  }
  el("text", {x: L - 6, y: 241, "text-anchor": "end", "font-size": 10}, "INTST.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
