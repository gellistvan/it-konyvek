<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab_fact(5) veremkeretei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt egymás alatti 32 bájtos veremkeret; a mentett X19 értékek felülről: main X19, 5, 4, 3, 2; az aktuális SP 160 bájttal a belépési SP alatt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lépések a fejezet lab-a030-rec.s kódjának futásából (keystone + Unicorn helyettesítő eszközlánc) származnak; az 5. lépés a GDB-táblázat állapota (X0 = 1, X19 = 1, SP = E−160, [SP+16] = 2). E és M szemléltető jelölés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés – prológus, n=5: új 32 bájtos keret (a mentett X19 = a main X19-e, M). n=5, X0=5, X19=5, SP=E−32", "line": 7, "regs": {"x0": "5", "x19": "5", "sp": "E−32", "x29": "E−32", "x30": "R_main"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"]], "depth": 1}, {"msg": "2. lépés – prológus, n=4: új 32 bájtos keret (a mentett X19 = a hívó n-je, 5). n=4, X0=4, X19=4, SP=E−64", "line": 7, "regs": {"x0": "4", "x19": "4", "sp": "E−64", "x29": "E−64", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"]], "depth": 2}, {"msg": "3. lépés – prológus, n=3: új 32 bájtos keret (a mentett X19 = a hívó n-je, 4). n=3, X0=3, X19=3, SP=E−96", "line": 7, "regs": {"x0": "3", "x19": "3", "sp": "E−96", "x29": "E−96", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"], ["E−64", "vissza: mul x0, x0, x19", "4", "igazítás, nem használt"]], "depth": 3}, {"msg": "4. lépés – prológus, n=2: új 32 bájtos keret (a mentett X19 = a hívó n-je, 3). n=2, X0=2, X19=2, SP=E−128", "line": 7, "regs": {"x0": "2", "x19": "2", "sp": "E−128", "x29": "E−128", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"], ["E−64", "vissza: mul x0, x0, x19", "4", "igazítás, nem használt"], ["E−96", "vissza: mul x0, x0, x19", "3", "igazítás, nem használt"]], "depth": 4}, {"msg": "5. lépés – prológus, n=1: új 32 bájtos keret (a mentett X19 = a hívó n-je, 2). n=1, X0=1, X19=1, SP=E−160 – a lab_fact_base töréspont: egyezik a GDB-táblázattal ([SP+16] = 2)", "line": 12, "regs": {"x0": "1", "x19": "1", "sp": "E−160", "x29": "E−160", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"], ["E−64", "vissza: mul x0, x0, x19", "4", "igazítás, nem használt"], ["E−96", "vissza: mul x0, x0, x19", "3", "igazítás, nem használt"], ["E−128", "vissza: mul x0, x0, x19", "2", "igazítás, nem használt"]], "depth": 5}, {"msg": "6. lépés – visszatérés: a keret megszűnt, X19 visszatöltve a mentett értékből. X0=1, X19=2, SP=E−128", "line": 16, "regs": {"x0": "1", "x19": "2", "sp": "E−128", "x29": "E−128", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"], ["E−64", "vissza: mul x0, x0, x19", "4", "igazítás, nem használt"], ["E−96", "vissza: mul x0, x0, x19", "3", "igazítás, nem használt"]], "depth": 4}, {"msg": "7. lépés – visszatérés: a keret megszűnt, X19 visszatöltve a mentett értékből. X0=2, X19=3, SP=E−96", "line": 16, "regs": {"x0": "2", "x19": "3", "sp": "E−96", "x29": "E−96", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"], ["E−64", "vissza: mul x0, x0, x19", "4", "igazítás, nem használt"]], "depth": 3}, {"msg": "8. lépés – visszatérés: a keret megszűnt, X19 visszatöltve a mentett értékből. X0=6, X19=4, SP=E−64", "line": 16, "regs": {"x0": "6", "x19": "4", "sp": "E−64", "x29": "E−64", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"], ["E−32", "vissza: mul x0, x0, x19", "5", "igazítás, nem használt"]], "depth": 2}, {"msg": "9. lépés – visszatérés: a keret megszűnt, X19 visszatöltve a mentett értékből. X0=24, X19=5, SP=E−32", "line": 16, "regs": {"x0": "24", "x19": "5", "sp": "E−32", "x29": "E−32", "x30": "mul-cím"}, "frames": [["main kerete", "vissza a main-be", "M (a main X19-e)", "igazítás, nem használt"]], "depth": 1}, {"msg": "10. lépés – visszatérés: a keret megszűnt, X19 visszatöltve a mentett értékből. X0=120, X19=M, SP=E – vissza a main-be, 5! = 120", "line": 16, "regs": {"x0": "120", "x19": "M", "sp": "E", "x29": "main kerete", "x30": "R_main"}, "frames": [], "depth": 0}];
const CODE = ["lab_fact:", "    stp  x29, x30, [SP, #-32]!", "    mov  x29, SP", "    str  x19, [SP, #16]", "    mov  x19, x0", "    cmp  x0, #1", "    b.ls lab_fact_base", "    sub  x0, x0, #1", "    bl   lab_fact", "    mul  x0, x0, x19", "    b    .Lfact_return", "lab_fact_base:", "    mov  x0, #1", ".Lfact_return:", "    ldr  x19, [SP, #16]", "    ldp  x29, x30, [SP], #32", "    ret"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 470"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hl = css("--hl"), mut = css("--muted"), hl2 = css("--hl2");
  const X = 110, W = 270, H = 20, TOP = 40;
  el("line", {x1: X - 20, y1: TOP, x2: X + W + 20, y2: TOP, stroke: line, "stroke-dasharray": "5 3"});
  el("text", {x: X - 6, y: TOP - 6, "text-anchor": "end", "font-size": 12}, "E (belépési SP)");
  el("text", {x: X + W / 2, y: TOP - 22, "text-anchor": "middle", "font-size": 12, fill: mut}, "↑ magasabb címek: a main kerete");
  const NM = ["+0 X29", "+8 X30", "+16 X19", "+24"];
  s.frames.forEach((fr, f) => {
    const yb = TOP + (f + 1) * 4 * H;           // a keret +0 rekeszének alja
    for (let q = 0; q < 4; q++) {
      const y = yb - (q + 1) * H;
      el("rect", {x: X, y, width: W, height: H, fill: q === 2 ? "url(#hatch)" : cell, stroke: line, "stroke-width": 0.8,
                  "stroke-dasharray": q === 3 ? "3 2" : "none"});
      el("text", {x: X + 6, y: y + 14, "font-size": 11, "font-family": "ui-monospace,monospace", fill: mut}, NM[q]);
      const t = el("text", {x: X + 80, y: y + 14, "font-size": 12, "font-weight": q === 2 ? "bold" : "normal"}, fr[q]);
    }
    el("rect", {x: X, y: yb - 4 * H, width: W, height: 4 * H, fill: "none", stroke: f === s.frames.length - 1 ? hl : line, "stroke-width": f === s.frames.length - 1 ? 3 : 1.8});
    el("text", {x: X - 8, y: yb - 4, "text-anchor": "end", "font-size": 12, "font-family": "ui-monospace,monospace"}, "E−" + (32 * (f + 1)));
    el("text", {x: X - 8, y: yb - 2 * H + 4, "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, "n = " + (5 - f));
    if (f > 0) {
      const y0 = yb - H / 2, y1 = yb - 4 * H - H / 2;
      el("path", {d: `M${X + W} ${y0} C ${X + W + 40} ${y0} ${X + W + 40} ${y1} ${X + W + 4} ${y1}`, fill: "none", stroke: line, "stroke-dasharray": "5 3", "marker-end": "url(#ah)"});
    }
  });
  if (s.frames.length) {
    const ysp = TOP + s.frames.length * 4 * H;
    el("text", {x: X - 8, y: ysp + 18, "text-anchor": "end", "font-size": 12, "font-weight": "bold", fill: hl}, "SP →");
  }
  // regiszterdoboz
  const RX = 440, RY = 60;
  el("rect", {x: RX, y: RY, width: 185, height: 140, fill: cell, stroke: line});
  el("text", {x: RX + 8, y: RY + 20, "font-size": 13, "font-weight": "bold"}, "Regiszterek");
  [["X0", s.regs.x0], ["X19", s.regs.x19], ["SP", s.regs.sp], ["X29", s.regs.x29], ["X30", s.regs.x30]].forEach(([n, v], j) => {
    el("text", {x: RX + 10, y: RY + 44 + j * 21, "font-size": 13, "font-family": "ui-monospace,monospace", "font-weight": "bold"}, n);
    el("text", {x: RX + 55, y: RY + 44 + j * 21, "font-size": 13, "font-family": "ui-monospace,monospace"}, v);
  });
  el("rect", {x: RX, y: 230, width: 26, height: 16, fill: "url(#hatch)", stroke: line});
  el("text", {x: RX + 34, y: 243, "font-size": 12}, "mentett X19 = a hívó n-je");
  el("text", {x: RX, y: 268, "font-size": 12}, "szaggatott nyíl: mentett X29");
  el("text", {x: RX, y: 284, "font-size": 12}, "(keretrekord-lánc)");
  el("text", {x: RX, y: 310, "font-size": 12, fill: mut}, "E = a lab_fact(5) belépési SP-je,");
  el("text", {x: RX, y: 326, "font-size": 12, fill: mut}, "M = a main X19-e");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${cell}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${mut}" stroke-width="1.2"/></pattern>` +
    `<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${line}"/></marker>`;
  svg.insertBefore(defs, svg.firstChild);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
