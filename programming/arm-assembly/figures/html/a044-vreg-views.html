<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V0 nézetei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>célnézet <select id="vw"><option value="8">B0 (8 bit)</option><option value="16">H0 (16 bit)</option><option value="32" selected>S0 (32 bit)</option><option value="64">D0 (64 bit)</option><option value="128">Q0 (128 bit)</option></select></label>
 <label>írt érték (hexa) <input type="text" id="val" value="0xC1460000" spellcheck="false" style="width:22em"></label>
 <button id="go">Ír</button> <button id="reset">Előtte-állapot</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 210" role="img" aria-label="V0 128 bitje bájtonként: írt, nullázott és változatlan bájtok"></svg>

<p class="small">Skaláris írás (Bn/Hn/Sn/Dn célregiszter, pl. fmov, ldr, fadd) az írt rész fölötti biteket nullázza; ezt unicorn-emulátorban mind az öt nézetre ellenőriztük (ldr b0/h0/s0/d0/q0, fmov s0, w0). A kiinduló érték jelölt mintaadat.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"v0": "0123456789abcdeffedcba9876543210"};

const V0 = BigInt("0x" + DATA.v0); let cur = V0, lastN = 0;
const svgV = $("v");
function hex(v, n){ return v.toString(16).toUpperCase().padStart(n, "0"); }
function draw(){
  svgV.innerHTML = "";
  const X0 = 20, CW = 45;
  mk(svgV, "text", {x: X0, y: 18, "font-size": 12, fill: css("--muted")}, "bájt 15 (bit 127–120) … bájt 0 (bit 7–0)");
  for (let i = 0; i < 16; i++) {
    const byte = 15 - i, v = Number((cur >> BigInt(8 * byte)) & 0xFFn), wr = lastN && byte < lastN / 8, z = lastN && !wr;
    mk(svgV, "rect", {x: X0 + i * CW, y: 40, width: CW, height: 40, fill: z ? css("--cell2") : css("--cell"), stroke: css("--line"), "stroke-width": wr ? 3 : 0.8});
    if (z) mk(svgV, "line", {x1: X0 + i * CW, y1: 40, x2: X0 + (i + 1) * CW, y2: 80, stroke: css("--muted")});
    mk(svgV, "text", {x: X0 + i * CW + CW / 2, y: 66, "text-anchor": "middle", class: "mono", "font-size": 15, "font-weight": wr ? "bold" : "normal"}, hex(v, 2));
  }
  [["Q0/V0", 128], ["D0", 64], ["S0", 32], ["H0", 16], ["B0", 8]].forEach(([nm, n], k) => {
    const w = n / 8 * CW, x = X0 + 16 * CW - w, y = 95 + k * 22;
    mk(svgV, "rect", {x: x, y: y, width: w, height: 16, fill: +$("vw").value === n ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    mk(svgV, "text", {x: w > 300 ? x + 6 : x - 6, y: y + 13, "text-anchor": w > 300 ? "start" : "end", class: "mono", "font-size": 12}, nm + " (" + (n - 1) + "–0)");
  });
}
function write(){
  const n = +$("vw").value; let t = $("val").value.trim().replace(/_/g, "");
  if (!/^(0x)?[0-9a-f]+$/i.test(t)) { $("status").textContent = "Hibás hexa érték."; return; }
  let v = BigInt(t.toLowerCase().startsWith("0x") ? t : "0x" + t);
  const mask = (1n << BigInt(n)) - 1n;
  const trunc = v > mask; v &= mask;
  cur = v; lastN = n;      // skaláris írás: az írt rész fölött minden bit 0
  $("status").textContent = (n === 128 ? "Q0 írása: mind a 128 bit az új érték." : ["", "", "", "", "", "", "", "", "B0", "", "", "", "", "", "", "", "H0"][n] || (n === 32 ? "S0" : "D0")) + (n < 128 ? " írása: V0[" + (n - 1) + ":0] = 0x" + hex(v, n / 4) + ", V0[127:" + n + "] = 0 (nullázva)." : "") + (trunc ? " (A bevitt érték csonkolva " + n + " bitre.)" : "");
  draw();
}
$("go").onclick = write;
$("val").addEventListener("keydown", e => { if (e.key === "Enter") write(); });
$("vw").onchange = write;
$("reset").onclick = () => { cur = V0; lastN = 0; $("status").textContent = "Előtte: V0 = 0x" + hex(V0, 32) + " (jelölt mintaadat)."; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
write();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
