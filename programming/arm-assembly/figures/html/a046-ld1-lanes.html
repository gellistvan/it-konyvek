<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LD1 és a lane-ek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>elrendezés <select id="arr"><option>16B</option><option>8H</option><option selected>4S</option><option>2D</option><option>8B</option><option>4H</option><option>2S</option><option>1D</option></select></label>
 <label><input type="checkbox" id="two"> ld1 {v0.2s} (csak 8 bájt; 3. feladat hibája)</label>
 <span class="small">Kattints egy memóriabájtra vagy lane-re (Tab + Enter is).</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 250" role="img" aria-label="V0 lane-jei és a memória 16 bájtja összekötve"></svg>

<p class="small">src = {1.0f, 2.0f, 3.0f, 4.0f}; a regisztertartalom unicorn-emulátorból (ld1 {v0.4s} és ld1 {v0.2s}). Little-endian: a 0. lane a legkisebb címről töltődik, és a regiszter legkisebb helyértékű bitjeit foglalja el.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"progs": {"swapends": ["ld1     {v0.4s}, [x1]", "mov     v1.16b, v0.16b", "ins     v1.s[0], v0.s[3]", "ins     v1.s[3], v0.s[0]", "st1     {v1.4s}, [x0]"], "rev4_bug": ["ld1     {v0.2s}, [x1]", "mov     v1.16b, v0.16b", "ins     v1.s[0], v0.s[1]", "ins     v1.s[1], v0.s[0]", "st1     {v1.4s}, [x0]"], "rev4_fix": ["ld1     {v0.4s}, [x1]", "rev64   v0.4s, v0.4s", "ext     v0.16b, v0.16b, v0.16b, #8", "st1     {v0.4s}, [x0]"]}, "traces": {"1,2,3,4": {"swapends": [{"line": 0, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [1.0, 2.0, 3.0, 4.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 4.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 1.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 1.0], "dst": [4.0, 2.0, 3.0, 1.0]}], "rev4_bug": [{"line": 0, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [1.0, 2.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 2.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 1.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 1.0, 0.0, 0.0], "dst": [2.0, 1.0, 0.0, 0.0]}], "rev4_fix": [{"line": 0, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [2.0, 1.0, 4.0, 3.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [4.0, 3.0, 2.0, 1.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [4.0, 3.0, 2.0, 1.0], "v1": [null, null, null, null], "dst": [4.0, 3.0, 2.0, 1.0]}]}, "5,6,7,8": {"swapends": [{"line": 0, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [5.0, 6.0, 7.0, 8.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 8.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 5.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 5.0], "dst": [8.0, 6.0, 7.0, 5.0]}], "rev4_bug": [{"line": 0, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [5.0, 6.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 6.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 5.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 5.0, 0.0, 0.0], "dst": [6.0, 5.0, 0.0, 0.0]}], "rev4_fix": [{"line": 0, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [6.0, 5.0, 8.0, 7.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [8.0, 7.0, 6.0, 5.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [8.0, 7.0, 6.0, 5.0], "v1": [null, null, null, null], "dst": [8.0, 7.0, 6.0, 5.0]}]}}, "mem": "0000803f000000400000404000008040", "ld1": {"4s": "4080000040400000400000003f800000", "2s": "0000000000000000400000003f800000"}};

const MEM = DATA.mem.match(/../g).map(h => parseInt(h, 16)); let sel = 0;
const svgV = $("v");
function hx(v, n){ return v.toString(16).toUpperCase().padStart(n, "0"); }
function draw(){
  svgV.innerHTML = "";
  const two = $("two").checked, a = $("arr").value, sz = {B: 1, H: 2, S: 4, D: 8}[a.slice(-1)], n = parseInt(a), view = n * sz;
  const reg = MEM.map((b, i) => two && i >= 8 ? 0 : b);       // V0 bájtjai (0. bájt = bit 7..0)
  const X0 = 50, CW = 42, YR = 50, YM = 190;
  mk(svgV, "text", {x: X0, y: 20, "font-size": 12}, "V0: bit 127 (balra) … bit 0 (jobbra)" + (view < 16 ? " — a ." + a.toLowerCase() + " nézet csak az alsó 64 bit" : ""));
  const lane = Math.floor(sel / sz);
  for (let L = 0; L < 16 / sz; L++) {
    const x = X0 + (16 - (L + 1) * sz) * CW, inView = L < n, on = L === lane && sel < view;
    let val = 0n; for (let k = sz - 1; k >= 0; k--) val = (val << 8n) | BigInt(reg[L * sz + k]);
    const r = mk(svgV, "rect", {x: x, y: YR, width: sz * CW, height: 50, fill: !inView ? css("--cell2") : (on ? css("--cellhl") : css("--cell")), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, tabindex: inView ? 0 : -1, role: "button", style: "cursor:pointer", "aria-label": "lane " + L});
    if (inView) { const pick = () => { sel = L * sz; draw(); }; r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter") pick(); }); }
    mk(svgV, "text", {x: x + sz * CW / 2, y: YR + 20, "text-anchor": "middle", "font-size": 11, fill: css("--muted"), "pointer-events": "none"}, inView ? "lane " + L : "–");
    if (inView) mk(svgV, "text", {x: x + sz * CW / 2, y: YR + 40, "text-anchor": "middle", class: "mono", "font-size": sz === 1 ? 12 : 13, "pointer-events": "none"}, (sz > 1 ? "0x" : "") + val.toString(16).toUpperCase().padStart(2 * sz, "0"));
    if (two && L * sz >= 8) mk(svgV, "text", {x: x + sz * CW / 2, y: YR - 6, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "0");
  }
  if (two) mk(svgV, "text", {x: X0 + 4 * CW, y: YR + 70, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "felső 64 bit nullázva (ld1 {v0.2s})");
  mk(svgV, "text", {x: X0, y: YM + 72, "font-size": 12}, "memória (src), növekvő cím →");
  MEM.forEach((b, i) => { const x = X0 + i * CW, on = Math.floor(i / sz) === lane && sel < view, loaded = !(two && i >= 8);
    const r = mk(svgV, "rect", {x: x, y: YM, width: CW, height: 34, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": loaded ? "" : "4 3", tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": "+" + i + " bájt"});
    const pick = () => { sel = i; draw(); }; r.addEventListener("click", pick); r.addEventListener("keydown", e => { if (e.key === "Enter") pick(); });
    mk(svgV, "text", {x: x + CW / 2, y: YM + 22, "text-anchor": "middle", class: "mono", "font-size": 13, "pointer-events": "none"}, hx(b, 2));
    mk(svgV, "text", {x: x + CW / 2, y: YM + 50, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "+" + i); });
  if (sel < view) { const xm = X0 + (Math.floor(sel / sz) * sz + sz / 2) * CW, xl = X0 + (16 - (lane + 0.5) * sz) * CW;
    mk(svgV, "line", {x1: xm, y1: YM, x2: xl, y2: YR + 50, stroke: css("--hl"), "stroke-width": 3}); }
  const f = sz === 4 ? " (float " + new DataView(new Uint8Array(reg.slice(lane * 4, lane * 4 + 4)).buffer).getFloat32(0, true) + ")" : "";
  $("status").textContent = sel >= view ? "A +" + sel + " bájt nem része a ." + a.toLowerCase() + " nézetnek." : (two && sel >= 8 ? "ld1 {v0.2s}: a +" + sel + " bájt nem töltődik be; a regiszter megfelelő része 0." :
    "+" + (lane * sz) + "…+" + (lane * sz + sz - 1) + " bájt → ." + a.toLowerCase() + " lane " + lane + f + "; a legkisebb cím a legkisebb helyértékű bájt.");
}
$("arr").onchange = () => { sel = 0; draw(); }; $("two").onchange = draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
