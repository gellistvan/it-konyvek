<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szokásos hívás és végpozíciós átadás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="radio" name="vv" id="vc" checked onchange="variant()"> lab-call (szokásos hívás)</label> <label><input type="radio" name="vv" id="vb" onchange="variant()"> lab-base (végpozíciós átadás)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szokásos hívásnál lab_tail elmenti az X30-at és saját ret-tel tér vissza; végpozíciós átadásnál egyetlen b utasítás után lab_leaf ret-je közvetlenül a main-be tér vissza; az eredmény mindkét esetben 12."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">lab_tail(5), lab_leaf(x) = x + 7. A két lab_tail-alak a fejezetben közölt GCC-mintázatok (stp/bl/ldp/ret, illetve b lab_leaf) A64-modellje, keystone + Unicorn alatt futtatva; nem rögzített GCC-kimenet. E = a belépési SP, R_main / R_tail = visszatérési címek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "main: mov w0, #5 → X30 = (a main hívója); SP = E; W0 = 5", "line": 1, "fn": "main", "w0": 5, "x30": "–", "sp": "E", "frame": false, "slot": ""}, {"msg": "main: bl lab_tail → X30 = R_main; SP = E; W0 = 5", "line": 2, "fn": "main", "w0": 5, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_tail: stp x29, x30, [sp, #-16]! → X30 = R_main; SP = E−16; W0 = 5", "line": 4, "fn": "lab_tail", "w0": 5, "x30": "R_main", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_tail: bl lab_leaf → X30 = R_tail; SP = E−16; W0 = 5", "line": 5, "fn": "lab_tail", "w0": 5, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_leaf: add w0, w0, #7 → X30 = R_tail; SP = E−16; W0 = 12", "line": 9, "fn": "lab_leaf", "w0": 12, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_leaf: ret → X30 = R_tail; SP = E−16; W0 = 12", "line": 10, "fn": "lab_leaf", "w0": 12, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_tail: ldp x29, x30, [sp], #16 → X30 = R_main; SP = E; W0 = 12", "line": 6, "fn": "lab_tail", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_tail: ret → X30 = R_main; SP = E; W0 = 12 – visszatérés a main-be, W0 = 12", "line": 7, "fn": "lab_tail", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}];
const CODE = ["main:", "    mov  w0, #5", "    bl   lab_tail", "lab_tail:", "    stp  x29, x30, [sp, #-16]!", "    bl   lab_leaf", "    ldp  x29, x30, [sp], #16", "    ret", "lab_leaf:", "    add  w0, w0, #7", "    ret"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = [{"msg": "main: mov w0, #5 → X30 = (a main hívója); SP = E; W0 = 5", "line": 1, "fn": "main", "w0": 5, "x30": "–", "sp": "E", "frame": false, "slot": ""}, {"msg": "main: bl lab_tail → X30 = R_main; SP = E; W0 = 5", "line": 2, "fn": "main", "w0": 5, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_tail: stp x29, x30, [sp, #-16]! → X30 = R_main; SP = E−16; W0 = 5", "line": 4, "fn": "lab_tail", "w0": 5, "x30": "R_main", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_tail: bl lab_leaf → X30 = R_tail; SP = E−16; W0 = 5", "line": 5, "fn": "lab_tail", "w0": 5, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_leaf: add w0, w0, #7 → X30 = R_tail; SP = E−16; W0 = 12", "line": 9, "fn": "lab_leaf", "w0": 12, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_leaf: ret → X30 = R_tail; SP = E−16; W0 = 12", "line": 10, "fn": "lab_leaf", "w0": 12, "x30": "R_tail", "sp": "E−16", "frame": true, "slot": "R_main"}, {"msg": "lab_tail: ldp x29, x30, [sp], #16 → X30 = R_main; SP = E; W0 = 12", "line": 6, "fn": "lab_tail", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_tail: ret → X30 = R_main; SP = E; W0 = 12 – visszatérés a main-be, W0 = 12", "line": 7, "fn": "lab_tail", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}], SBASE = [{"msg": "main: mov w0, #5 → X30 = (a main hívója); SP = E; W0 = 5", "line": 1, "fn": "main", "w0": 5, "x30": "–", "sp": "E", "frame": false, "slot": ""}, {"msg": "main: bl lab_tail → X30 = R_main; SP = E; W0 = 5", "line": 2, "fn": "main", "w0": 5, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_tail: b lab_leaf → X30 = R_main; SP = E; W0 = 5", "line": 4, "fn": "lab_tail", "w0": 5, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_leaf: add w0, w0, #7 → X30 = R_main; SP = E; W0 = 12", "line": 6, "fn": "lab_leaf", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}, {"msg": "lab_leaf: ret → X30 = R_main; SP = E; W0 = 12 – visszatérés a main-be, W0 = 12", "line": 7, "fn": "lab_leaf", "w0": 12, "x30": "R_main", "sp": "E", "frame": false, "slot": ""}];
const LINES = {"lab-call": ["main:", "    mov  w0, #5", "    bl   lab_tail", "lab_tail:", "    stp  x29, x30, [sp, #-16]!", "    bl   lab_leaf", "    ldp  x29, x30, [sp], #16", "    ret", "lab_leaf:", "    add  w0, w0, #7", "    ret"], "lab-base": ["main:", "    mov  w0, #5", "    bl   lab_tail", "lab_tail:", "    b    lab_leaf", "lab_leaf:", "    add  w0, w0, #7", "    ret"]};
function variant(){
  const key = document.getElementById("vb").checked ? "lab-base" : "lab-call";
  codeEl.innerHTML = LINES[key].map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
  setSteps(key === "lab-base" ? SBASE : SC);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 250"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hlc = css("--cellhl"), hl = css("--hl"), mut = css("--muted");
  ["main", "lab_tail", "lab_leaf"].forEach((n, i) => {
    const on = s.fn === n;
    el("rect", {x: 20 + i * 205, y: 12, width: 185, height: 34, fill: on ? hlc : cell, stroke: on ? hl : line, "stroke-width": on ? 3 : 1});
    el("text", {x: 112 + i * 205, y: 35, "text-anchor": "middle", "font-size": 15, "font-family": "ui-monospace,monospace"}, n);
  });
  [["W0", String(s.w0)], ["X30", s.x30], ["SP", s.sp]].forEach(([n, v], j) => {
    const prev = STEPS[Math.max(0, k - 1)], ch = k > 0 && prev[n.toLowerCase()] !== s[n.toLowerCase()];
    el("rect", {x: 20 + j * 140, y: 80, width: 125, height: 40, fill: ch ? hlc : cell, stroke: ch ? hl : line, "stroke-width": ch ? 3 : 1});
    el("text", {x: 30 + j * 140, y: 106, "font-size": 15, "font-weight": "bold"}, n);
    el("text", {x: 75 + j * 140, y: 106, "font-size": 15, "font-family": "ui-monospace,monospace"}, v);
  });
  el("text", {x: 450, y: 74, "font-size": 13, "font-weight": "bold"}, "verem");
  if (s.frame) {
    el("rect", {x: 450, y: 80, width: 170, height: 26, fill: cell, stroke: line});
    el("text", {x: 458, y: 98, "font-size": 13, "font-family": "ui-monospace,monospace"}, "[E−8]  = " + s.slot);
    el("rect", {x: 450, y: 106, width: 170, height: 26, fill: cell, stroke: line});
    el("text", {x: 458, y: 124, "font-size": 13, "font-family": "ui-monospace,monospace"}, "[E−16] = mentett X29");
  } else el("text", {x: 450, y: 100, "font-size": 13, fill: mut}, "nincs veremkeret (SP = E)");
  el("text", {x: 20, y: 165, "font-size": 12.5, fill: mut}, "BL: X30 ← a következő utasítás címe; B: X30 érintetlen; RET: PC ← X30 (memóriát nem olvas)");
  el("text", {x: 20, y: 188, "font-size": 12.5, fill: mut}, "relokáció: " + (STEPS === SBASE ? "R_AARCH64_JUMP26 (b lab_leaf)" : "R_AARCH64_CALL26 (bl lab_leaf)"));
  if (k === STEPS.length - 1) el("text", {x: 20, y: 222, "font-size": 15, "font-weight": "bold", fill: hl}, "visszatérés a main-be, W0 = 12");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
