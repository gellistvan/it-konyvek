<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az fma-edge ellenpélda a float-rácson</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Tagméret: <select id="term" onchange="reload()"><option value="108">0x1.08p103 (felezőpont fölött)</option><option value="100">0x1.0p103 (pont felezőpont: páros felé)</option><option value="0f8">0x1.fp102 (felezőpont alatt)</option></select></label><label><input type="checkbox" id="half" onchange="reload()"> bemenet felezve (FLT_MAX/2 szerződés)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Számegyenes a FLT_MAX közelében: minden 0,52 ulp-os tag egy teljes ulp-ot ad a kerekítés után, a harmadik lépés +∞-re kerekít, bár a pontos összeg FLT_MAX alatt marad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Pontos racionális számolás, RNE-kerekítés float-ra; FZ = 0, k-sorrend, a B minden eleme 1. Üres kör: pontos FMA-eredmény, teli kör: kerekített részösszeg, rombusz: a pontos összeg s₀₀. A felezett bemenetnél a legnagyobb részösszeg 0x1p127, véges: nincs túlcsordulás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiindulás: a₀ = 0x1.fffffap127, a tag a_k = 0x1.08p103 = 0,515625 ulp; pontos összeg 0x1.fffffd18p127 (−0,453 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap127; pontos részösszeg 0x1.fffffap127 (−2,0000 ulp); kerekített: 0x1.fffffap127", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1.08p103; pontos részösszeg 0x1.fffffb08p127 (−1,4844 ulp); kerekített: 0x1.fffffcp127", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0]]}, {"msg": "k = 2: a_k = 0x1.08p103; pontos részösszeg 0x1.fffffd08p127 (−0,4844 ulp); kerekített: 0x1.fffffep127", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0]]}, {"msg": "k = 3: a_k = 0x1.08p103; pontos részösszeg 0x1.ffffff08p127 (+0,5156 ulp); kerekített: +∞ – TÚLCSORDULÁS", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0], [3, 0.515625, null]]}];
const CODE = ["c = 0", "for k in 0..n−1:  c = fmaf(A[i][k], B[k][j], c)   // RNE kerekítés minden lépés után"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"108|0": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap127, a tag a_k = 0x1.08p103 = 0,515625 ulp; pontos összeg 0x1.fffffd18p127 (−0,453 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap127; pontos részösszeg 0x1.fffffap127 (−2,0000 ulp); kerekített: 0x1.fffffap127", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1.08p103; pontos részösszeg 0x1.fffffb08p127 (−1,4844 ulp); kerekített: 0x1.fffffcp127", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0]]}, {"msg": "k = 2: a_k = 0x1.08p103; pontos részösszeg 0x1.fffffd08p127 (−0,4844 ulp); kerekített: 0x1.fffffep127", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0]]}, {"msg": "k = 3: a_k = 0x1.08p103; pontos részösszeg 0x1.ffffff08p127 (+0,5156 ulp); kerekített: +∞ – TÚLCSORDULÁS", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0], [3, 0.515625, null]]}], "grid": [-3.0, -2.0, -1.0, 0.0], "thr": 0.5, "exact": -0.453125, "half": false}, "108|1": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap126, a tag a_k = 0x1.08p102 = 0,515625 ulp; pontos összeg 0x1.fffffd18p126 (−0,453 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap126; pontos részösszeg 0x1.fffffap126 (−2,0000 ulp); kerekített: 0x1.fffffap126", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1.08p102; pontos részösszeg 0x1.fffffb08p126 (−1,4844 ulp); kerekített: 0x1.fffffcp126", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0]]}, {"msg": "k = 2: a_k = 0x1.08p102; pontos részösszeg 0x1.fffffd08p126 (−0,4844 ulp); kerekített: 0x1.fffffep126", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0]]}, {"msg": "k = 3: a_k = 0x1.08p102; pontos részösszeg 0x1.ffffff08p126 (+0,5156 ulp); kerekített: 0x1p127", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.484375, -1.0], [2, -0.484375, 0.0], [3, 0.515625, 1.0]]}], "grid": [-3.0, -2.0, -1.0, 0.0, 1.0, 3.0], "thr": null, "exact": -0.453125, "half": true}, "100|0": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap127, a tag a_k = 0x1p103 = 0,5 ulp; pontos összeg 0x1.fffffdp127 (−0,500 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap127; pontos részösszeg 0x1.fffffap127 (−2,0000 ulp); kerekített: 0x1.fffffap127", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1p103; pontos részösszeg 0x1.fffffbp127 (−1,5000 ulp); kerekített: 0x1.fffffcp127", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0]]}, {"msg": "k = 2: a_k = 0x1p103; pontos részösszeg 0x1.fffffdp127 (−0,5000 ulp); kerekített: 0x1.fffffcp127", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0], [2, -0.5, -1.0]]}, {"msg": "k = 3: a_k = 0x1p103; pontos részösszeg 0x1.fffffdp127 (−0,5000 ulp); kerekített: 0x1.fffffcp127", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0], [2, -0.5, -1.0], [3, -0.5, -1.0]]}], "grid": [-3.0, -2.0, -1.0, 0.0], "thr": 0.5, "exact": -0.5, "half": false}, "100|1": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap126, a tag a_k = 0x1p102 = 0,5 ulp; pontos összeg 0x1.fffffdp126 (−0,500 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap126; pontos részösszeg 0x1.fffffap126 (−2,0000 ulp); kerekített: 0x1.fffffap126", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1p102; pontos részösszeg 0x1.fffffbp126 (−1,5000 ulp); kerekített: 0x1.fffffcp126", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0]]}, {"msg": "k = 2: a_k = 0x1p102; pontos részösszeg 0x1.fffffdp126 (−0,5000 ulp); kerekített: 0x1.fffffcp126", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0], [2, -0.5, -1.0]]}, {"msg": "k = 3: a_k = 0x1p102; pontos részösszeg 0x1.fffffdp126 (−0,5000 ulp); kerekített: 0x1.fffffcp126", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.5, -1.0], [2, -0.5, -1.0], [3, -0.5, -1.0]]}], "grid": [-3.0, -2.0, -1.0, 0.0, 1.0, 3.0], "thr": null, "exact": -0.5, "half": true}, "0f8|0": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap127, a tag a_k = 0x1.fp102 = 0,484375 ulp; pontos összeg 0x1.fffffce8p127 (−0,547 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap127; pontos részösszeg 0x1.fffffap127 (−2,0000 ulp); kerekített: 0x1.fffffap127", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1.fp102; pontos részösszeg 0x1.fffffaf8p127 (−1,5156 ulp); kerekített: 0x1.fffffap127", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0]]}, {"msg": "k = 2: a_k = 0x1.fp102; pontos részösszeg 0x1.fffffaf8p127 (−1,5156 ulp); kerekített: 0x1.fffffap127", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0], [2, -1.515625, -2.0]]}, {"msg": "k = 3: a_k = 0x1.fp102; pontos részösszeg 0x1.fffffaf8p127 (−1,5156 ulp); kerekített: 0x1.fffffap127", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0], [2, -1.515625, -2.0], [3, -1.515625, -2.0]]}], "grid": [-3.0, -2.0, -1.0, 0.0], "thr": 0.5, "exact": -0.546875, "half": false}, "0f8|1": {"steps": [{"msg": "Kiindulás: a₀ = 0x1.fffffap126, a tag a_k = 0x1.fp101 = 0,484375 ulp; pontos összeg 0x1.fffffce8p126 (−0,547 ulp)", "line": -1, "k": -1, "pts": []}, {"msg": "k = 0: a_k = 0x1.fffffap126; pontos részösszeg 0x1.fffffap126 (−2,0000 ulp); kerekített: 0x1.fffffap126", "line": 0, "k": 0, "pts": [[0, -2.0, -2.0]]}, {"msg": "k = 1: a_k = 0x1.fp101; pontos részösszeg 0x1.fffffaf8p126 (−1,5156 ulp); kerekített: 0x1.fffffap126", "line": 1, "k": 1, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0]]}, {"msg": "k = 2: a_k = 0x1.fp101; pontos részösszeg 0x1.fffffaf8p126 (−1,5156 ulp); kerekített: 0x1.fffffap126", "line": 1, "k": 2, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0], [2, -1.515625, -2.0]]}, {"msg": "k = 3: a_k = 0x1.fp101; pontos részösszeg 0x1.fffffaf8p126 (−1,5156 ulp); kerekített: 0x1.fffffap126", "line": 1, "k": 3, "pts": [[0, -2.0, -2.0], [1, -1.515625, -2.0], [2, -1.515625, -2.0], [3, -1.515625, -2.0]]}], "grid": [-3.0, -2.0, -1.0, 0.0, 1.0, 3.0], "thr": null, "exact": -0.546875, "half": true}};
function key(){ return document.getElementById("term").value + "|" + (document.getElementById("half").checked ? 1 : 0); }
function reload(){ setSteps(ALL[key()].steps); }
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 290");
  const d = ALL[key()];
  const lo = Math.min(-3.3, ...d.grid) - 0.2, hi = Math.max(1.5, ...d.grid.slice(-1)) + 0.3;
  const X = v => 20 + (v - lo) / (hi - lo) * 520, y0 = 215;
  el("line", {x1: 10, x2: 550, y1: y0, y2: y0, stroke: css("--line"), "stroke-width": 1.2});
  if (d.thr !== null) {
    el("rect", {x: X(d.thr), y: 20, width: 550 - X(d.thr), height: y0 - 20, fill: css("--cellhl"), opacity: 0.6});
    el("line", {x1: X(d.thr), x2: X(d.thr), y1: 20, y2: y0 + 8, stroke: css("--fg"), "stroke-dasharray": "6 4", "stroke-width": 1.5});
    el("text", {x: X(d.thr) + 6, y: 36, "font-size": 13, "font-weight": "bold"}, "+∞");
    el("text", {x: X(d.thr) + 4, y: y0 + 40, "font-size": 11}, "FLT_MAX + ulp/2");
  }
  d.grid.forEach(g => { el("line", {x1: X(g), x2: X(g), y1: y0 - 8, y2: y0 + 8, stroke: css("--line"), "stroke-width": 2});
    el("text", {x: X(g), y: y0 + 24, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, (g > 0 ? "+" : "") + String(g).replace(".", ",").replace("-", "−")); });
  el("text", {x: 10, y: y0 + 58, "font-size": 11.5, fill: css("--muted")}, "tengely: ulp-egység a bináda legnagyobb float-jától (" + (d.half ? "0x1.fffffep126" : "FLT_MAX = 0x1.fffffep127") + "); rácspont = float");
  el("path", {d: `M${X(d.exact)},${y0 - 7} l7,7 l-7,7 l-7,-7 z`, fill: css("--muted")});
  let prev = null;
  s.pts.forEach((p, i) => {
    const y = 50 + p[0] * 38;
    if (prev !== null) el("line", {x1: X(prev), x2: X(p[1]), y1: y, y2: y, stroke: css("--fg"), "stroke-width": 1.3});
    el("circle", {cx: X(p[1]), cy: y, r: 6, fill: p[0] === 0 ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 2});
    if (p[2] !== null) { if (p[0] > 0) { el("line", {x1: X(p[1]), x2: X(p[2]), y1: y + 10, y2: y + 10, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "3 3"}); el("circle", {cx: X(p[2]), cy: y, r: 6, fill: css("--fg")}); } prev = p[2]; }
    else { el("text", {x: X(p[1]) + 10, y: y + 5, "font-size": 13, "font-weight": "bold"}, "→ +∞"); prev = null; }
    el("text", {x: 12, y: y + 5, "font-size": 12}, "k = " + p[0]);
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
