<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMP és feltételkódok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c00000;--cell:#fff;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#ff7070;--cell:#262626;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input[type=text]{font:14px ui-monospace,monospace;width:11em}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 8px;min-height:2.9em}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.box{border:1px solid var(--line);padding:8px 10px}
table{border-collapse:collapse}
td,th{padding:2px 8px;text-align:left}
.sq{display:inline-block;width:14px;height:14px;border:1.5px solid var(--fg);vertical-align:middle}
.sq.on{background:var(--fg)}
tr.u td{border-left:2px dashed var(--fg)} tr.s td{border-left:2px solid var(--fg)}
tr.u td+td,tr.s td+td{border-left:none}
.chg{color:var(--hl2);font-weight:bold}
.old{text-decoration:line-through;color:var(--muted)}
.mono{font-family:ui-monospace,monospace}
.flags span{display:inline-block;width:34px;text-align:center;border:1.5px solid var(--fg);margin-right:4px;font-weight:bold;padding:4px 0}
.flags span.on{background:var(--fg);color:var(--bg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Bemenet">
  <label>a = 0x<input type="text" id="a" value="80000000" aria-label="a hexában"></label>
  <label>b = 0x<input type="text" id="b" value="00000001" aria-label="b hexában"></label>
  <label>szélesség <select id="w"><option value="32" selected>W (32 bit)</option><option value="64">X (64 bit)</option></select></label>
  <label><input type="checkbox" id="adds"> közbeiktatott <span class="mono">adds w14, w2, w2</span> (3. feladat)</label>
  <button id="lab">Labor adatai</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="cols">
  <div class="box"><b>Bemenet</b><div id="inp" class="mono"></div></div>
  <div class="box"><b>CMP a, b</b><div id="sub" class="mono"></div><div class="flags" id="flags" aria-label="NZCV"></div><div id="why" class="small"></div></div>
  <div class="box"><b>Feltételkódok</b> <span class="small">(szaggatott: előjel nélküli, folytonos: előjeles)</span><table id="tab"></table></div>
  <div class="box"><b>CSEL</b><div id="csel" class="mono"></div></div>
</div>
<p class="small">A kezdőállapot és a 3. feladat értékei egyeznek a lab-csel.s unicorn-futtatásával (NZCV = 0011, W5 = 0x80000000, W6 = 1; a beszúrt ADDS után NZCV = 0000, W5 = 1, W6 = 0x80000000).</p>
<script>
const CONDS = [["EQ", "Z = 1", ""], ["NE", "Z = 0", ""], ["HS", "C = 1", "u"], ["LO", "C = 0", "u"], ["HI", "C = 1 és Z = 0", "u"], ["LS", "C = 0 vagy Z = 1", "u"], ["MI", "N = 1", ""], ["PL", "N = 0", ""], ["GE", "N = V", "s"], ["LT", "N ≠ V", "s"], ["GT", "Z = 0 és N = V", "s"], ["LE", "Z = 1 vagy N ≠ V", "s"]];
const FN = {EQ:f=>f.Z===1,NE:f=>f.Z===0,HS:f=>f.C===1,LO:f=>f.C===0,HI:f=>f.C===1&&f.Z===0,LS:f=>f.C===0||f.Z===1,
  MI:f=>f.N===1,PL:f=>f.N===0,GE:f=>f.N===f.V,LT:f=>f.N!==f.V,GT:f=>f.Z===0&&f.N===f.V,LE:f=>f.Z===1||f.N!==f.V};
const $=id=>document.getElementById(id);
function flagsSub(a,b,n){const M=(1n<<BigInt(n)), m=M-1n, r=(a-b)&m, hb=1n<<BigInt(n-1);
  const s=v=>v&hb?v-M:v; const N=Number(r>>BigInt(n-1)), Z=+(r===0n), C=+(a>=b), V=+(s(a)-s(b)!==s(r));
  return {r,N,Z,C,V};}
function hx(v,n){return "0x"+v.toString(16).padStart(n/4,"0");}
function sg(v,n){const M=1n<<BigInt(n);return v&(1n<<BigInt(n-1))?v-M:v;}
function upd(){
  const n=+$("w").value, M=1n<<BigInt(n);
  let a,b; try{a=BigInt("0x"+$("a").value.trim()); b=BigInt("0x"+$("b").value.trim());}catch(e){$("status").textContent="Hibás hexa bemenet.";return;}
  if(a>=M||b>=M){$("status").textContent=`Az érték nem fér el ${n} biten.`;return;}
  const f0=flagsSub(a,b,n);
  let f=f0;
  // ADDS w14, w2, w2: mindig 32 bites, a b alsó 32 bitjével
  if($("adds").checked){const b32=b&0xffffffffn, s=(b32+b32), r=s&0xffffffffn, hb=0x80000000n;
    const sv=v=>v&hb?v-0x100000000n:v; f={r:f0.r,N:Number(r>>31n),Z:+(r===0n),C:+(s>0xffffffffn),V:+(sv(b32)+sv(b32)!==sv(r))};}
  $("inp").innerHTML=`a = ${hx(a,n)}<br>&nbsp; előjeles ${sg(a,n)}, előjel nélküli ${a}<br>b = ${hx(b,n)}<br>&nbsp; előjeles ${sg(b,n)}, előjel nélküli ${b}`.replace(/-/g,"−");
  $("sub").innerHTML=`a − b = ${hx(f0.r,n)}`+($("adds").checked?`<br><span class="chg">utána ADDS: NZCV felülírva</span>`:"");
  $("flags").innerHTML=["N","Z","C","V"].map(k=>`<span class="${f[k]?"on":""}" title="${k}">${k}=${f[k]}</span>`).join("");
  const why=[]; if(f0.V&&!$("adds").checked) why.push("az előjeles különbség nem fér el → V = 1");
  $("why").textContent=why.join("; ");
  $("tab").innerHTML="<tr><th></th><th>kód</th><th>feltétel</th><th>érték</th></tr>"+CONDS.map(([nm,form,g])=>{
    const t=FN[nm](f), t0=FN[nm](f0), ch=t!==t0;
    return `<tr class="${g}"><td><span class="sq ${t?"on":""}"></span></td><td class="mono"><b>${nm}</b></td><td>${form}</td><td class="${ch?"chg":""}">${ch?`<span class="old">${t0?"igaz":"hamis"}</span> → `:""}${t?"igaz":"hamis"}</td></tr>`;}).join("");
  const lt=FN.LT(f), lo=FN.LO(f), R=n===32?"W":"X";
  const w5=lt?a:b, w6=lo?a:b;
  $("csel").innerHTML=`CSEL ${R}5, ${R}1, ${R}2, LT → ${R}5 = ${hx(w5,n)}<br>CSEL ${R}6, ${R}1, ${R}2, LO → ${R}6 = ${hx(w6,n)}<br>CSET ${R==="W"?"W":"W"}3, LT → ${+lt}; CSET W4, LO → ${+lo}`;
  $("status").textContent=`NZCV = ${f.N}${f.Z}${f.C}${f.V}; LT = ${lt?"igaz":"hamis"}, LO = ${lo?"igaz":"hamis"}, MI = ${FN.MI(f)?"igaz":"hamis"}; ${R}5 = ${hx(w5,n)}, ${R}6 = ${hx(w6,n)}.`;
}
["a","b","w","adds"].forEach(id=>$(id).addEventListener(id==="adds"||id==="w"?"change":"input",upd));
$("lab").onclick=()=>{$("a").value="80000000";$("b").value="00000001";$("w").value="32";$("adds").checked=false;upd();};
upd();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
