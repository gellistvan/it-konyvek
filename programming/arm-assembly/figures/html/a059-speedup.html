<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyorsulásfelbontás: QEMU-mérés és hipotetikus natív</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
select,input,button{font:inherit}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
#status{margin:4px 0 6px;min-height:2.9em}
.small{font-size:12px;color:var(--muted)}
.own input{width:5em}
.f{cursor:help}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Nézet">
  <label>Adat: <select id="mode"><option value="m">mért (QEMU)</option><option value="h">hipotetikus natív</option><option value="b" selected>mindkettő</option></select></label>
  <label>Kiemelt n: <select id="nn"><option>64</option><option>128</option><option selected>256</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 345" role="img" aria-label="Csoportos oszlopdiagram a négy változat mediánjáról és a három részgyorsulás vonaldiagramja"></svg>
<details><summary>Saját mérés beillesztése (ms, n-enként ijk, ikj, ikj_vec, asm)</summary>
<div class="own" id="own"></div>
<button id="apply">Ábra újrarajzolása a saját adatokkal</button> <button id="reset">Könyv adatai</button>
</details>
<p class="small">Mért: a 15.3.7.1 táblázata (GNU + QEMU 8.2.2, x86-64 host, emulációs idő). Hipotetikus: a 15.3.7 illusztratív, kitalált natív nagyságrendű táblázata, nem mérés. A tényezőkre vitt egér vagy a Tab-fókusz a képletet mutatja.</p>
<script>
const BOOK = {m: {"64": [1.81, 1.98, 1.44, 1.61], "128": [16.4, 17.0, 12.2, 13.4], "256": [122.0, 130.0, 96.7, 131.0]}, h: {"64": [1.4218, 0.742, 0.289, 0.3256], "128": [11.384, 5.93, 2.34, 2.612], "256": [91.123, 47.6, 18.95, 20.875]}};
let DATA = JSON.parse(JSON.stringify(BOOK));
const NS = [64, 128, 256], VAR = ["ijk", "ikj", "ikj_vec", "asm"], FN = ["sorrend", "C-vektor", "kézi asm"];
const FORM = [["t_ijk", "t_ikj", 0, 1], ["t_ikj", "t_ikj,vec", 1, 2], ["t_ikj,vec", "t_asm", 2, 3]];
const NSV = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
const c = s => s.toString().replace(".", ",");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag, a, t, par){const e = document.createElementNS(NSV, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; (par || svg).appendChild(e); return e;}
function fac(t, f){ return t[FORM[f][2]] / t[FORM[f][3]]; }
function say(src, n, f){
  const t = DATA[src][n], v = fac(t, f);
  document.getElementById("status").textContent = `${src === "m" ? "mért (QEMU)" : "hipotetikus natív"}, n = ${n}: ${FN[f]} = ${FORM[f][0]} / ${FORM[f][1]} = ${c(t[FORM[f][2]])} / ${c(t[FORM[f][3]])} = ${c(v.toFixed(2))}`;
}
function draw(){
  svg.innerHTML = "";
  const mode = document.getElementById("mode").value, hn = +document.getElementById("nn").value;
  const src = mode === "h" ? "h" : "m";
  // (a) oszlopok, log skála 0,1 … 1000 ms
  const X0 = 46, Y0 = 280, H = 230, W = 250;
  const lo = Math.log10(0.1), hi = Math.log10(1000), Y = v => Y0 - (Math.log10(v) - lo) / (hi - lo) * H;
  el("text", {x: 4, y: 22, "font-size": 12.5, "font-weight": "bold"}, `(a) medián idő [ms], log – ${src === "m" ? "mérve (QEMU)" : "hipotetikus natív"}`);
  [0.1, 1, 10, 100, 1000].forEach(v => { el("line", {x1: X0, x2: X0 + W, y1: Y(v), y2: Y(v), stroke: css("--cellhl")}); el("text", {x: X0 - 4, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, c(v)); });
  const fills = [css("--cell"), css("--cellhl"), css("--cell"), css("--fg")], dash = ["none", "none", "3 2", "none"];
  NS.forEach((n, i) => {
    const gx = X0 + 12 + i * 80;
    VAR.forEach((nm, v) => {
      const t = DATA[src][n][v], x = gx + v * 16;
      el("rect", {x: x, y: Y(t), width: 14, height: Y0 - Y(t), fill: fills[v], stroke: css("--line"), "stroke-width": n === hn ? 2 : 0.8, "stroke-dasharray": dash[v]});
    });
    el("text", {x: gx + 30, y: Y0 + 16, "text-anchor": "middle", "font-size": 12, "font-weight": n === hn ? "bold" : "normal"}, "n = " + n);
  });
  VAR.forEach((nm, v) => { el("rect", {x: X0 + 4 + v * 62, y: Y0 + 26, width: 12, height: 12, fill: fills[v], stroke: css("--line"), "stroke-dasharray": dash[v]}); el("text", {x: X0 + 20 + v * 62, y: Y0 + 37, "font-size": 11}, nm); });
  // (b) tényezők
  const BX = 340, BW = 200, BY0 = 280, BH = 230, ylo = 0.5, yhi = 3.0, BYf = v => BY0 - (v - ylo) / (yhi - ylo) * BH, BXf = i => BX + 10 + i * 85;
  el("text", {x: BX - 30, y: 22, "font-size": 12.5, "font-weight": "bold"}, "(b) részgyorsulások");
  [0.5, 1, 1.5, 2, 2.5, 3].forEach(v => { el("line", {x1: BX, x2: BX + BW, y1: BYf(v), y2: BYf(v), stroke: v === 1 ? css("--fg") : css("--cellhl"), "stroke-dasharray": v === 1 ? "2 3" : "none"}); el("text", {x: BX - 4, y: BYf(v) + 4, "text-anchor": "end", "font-size": 11}, c(v.toFixed(1))); });
  NS.forEach((n, i) => el("text", {x: BXf(i), y: BY0 + 16, "text-anchor": "middle", "font-size": 12, "font-weight": n === hn ? "bold" : "normal"}, String(n)));
  const shapes = ["circle", "rect", "path"];
  const srcs = mode === "b" ? ["m", "h"] : [src];
  srcs.forEach(s => {
    for (let f = 0; f < 3; f++) {
      const pts = NS.map((n, i) => [BXf(i), BYf(Math.min(yhi, Math.max(ylo, fac(DATA[s][n], f))))]);
      el("polyline", {points: pts.map(p => p.join(",")).join(" "), fill: "none", stroke: s === "m" ? css("--fg") : css("--muted"), "stroke-width": 1.8, "stroke-dasharray": s === "m" ? "none" : "6 4"});
      pts.forEach((p, i) => {
        const g = el("g", {class: "f", tabindex: 0, role: "button", "aria-label": `${FN[f]}, n = ${NS[i]}, ${s === "m" ? "mért" : "hipotetikus"}`});
        const fillc = s === "m" ? css("--fg") : css("--bg");
        if (f === 0) el("circle", {cx: p[0], cy: p[1], r: 6, fill: fillc, stroke: css("--fg"), "stroke-width": 1.6}, undefined, g);
        else if (f === 1) el("rect", {x: p[0] - 5.5, y: p[1] - 5.5, width: 11, height: 11, fill: fillc, stroke: css("--fg"), "stroke-width": 1.6}, undefined, g);
        else el("path", {d: `M${p[0]},${p[1] - 7} l6.5,11 l-13,0 z`, fill: fillc, stroke: css("--fg"), "stroke-width": 1.6}, undefined, g);
        g.addEventListener("mouseenter", () => say(s, NS[i], f)); g.addEventListener("focus", () => say(s, NS[i], f));
      });
    }
  });
  ["○ sorrend", "□ C-vektor", "△ kézi asm"].forEach((t, i) => el("text", {x: BX + i * 70, y: BY0 + 37, "font-size": 11}, t));
  el("text", {x: BX - 30, y: BY0 + 54, "font-size": 10.5, fill: css("--muted")}, "teli: mért; üres, szaggatott: hipotetikus");
  if (!document.getElementById("status").dataset.touched) {
    const t = DATA[src][hn];
    document.getElementById("status").textContent = `n = ${hn} (${src === "m" ? "mért" : "hipotetikus"}): ` + FN.map((nm, f) => `${nm} = ${c(fac(t, f).toFixed(2))}`).join(", ") + `; összesen ijk/asm = ${c((t[0] / t[3]).toFixed(2))}`;
  }
}
function buildOwn(){
  const box = document.getElementById("own"); box.innerHTML = "";
  NS.forEach(n => { const p = document.createElement("div"); p.textContent = "n = " + n + ": ";
    VAR.forEach((nm, v) => { const i = document.createElement("input"); i.id = `o${n}_${v}`; i.value = c(DATA.m[n][v]); i.setAttribute("aria-label", `${nm}, n = ${n}, ms`); p.appendChild(i); p.appendChild(document.createTextNode(" ")); });
    box.appendChild(p); });
}
document.getElementById("apply").onclick = () => {
  NS.forEach(n => VAR.forEach((nm, v) => { const x = parseFloat(document.getElementById(`o${n}_${v}`).value.replace(",", ".")); if (x > 0) DATA.m[n][v] = x; }));
  document.getElementById("mode").value = "m"; draw();
};
document.getElementById("reset").onclick = () => { DATA = JSON.parse(JSON.stringify(BOOK)); buildOwn(); draw(); };
["mode", "nn"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
buildOwn(); draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
