<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU-teher és megtérülési pont</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--warn:#b00020}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--warn:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.grid{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;max-width:620px}
input[type=range]{width:100%}
#out{margin:6px 0;min-height:3em}
#warn{color:var(--warn);font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
button{font:inherit;padding:3px 10px;cursor:pointer}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="grid" role="group" aria-label="Modellparaméterek">
<label for="n">N [esemény/s]</label><input id="n" type="range" min="1" max="6" step="0.01" value="3"><span id="nv"></span>
<label for="tp">T_poll [µs]</label><input id="tp" type="range" min="5" max="200" step="1" value="50"><span id="tpv"></span>
<label for="cw">c_wake [ciklus]</label><input id="cw" type="range" min="0" max="100" step="1" value="30"><span id="cwv"></span>
<label for="cc">c_check [ciklus]</label><input id="cc" type="range" min="1" max="50" step="1" value="6"><span id="ccv"></span>
<label for="ci">c_ISR [ciklus/esemény]</label><input id="ci" type="range" min="12" max="300" step="1" value="60"><span id="civ"></span>
</div>
<div id="out" aria-live="polite"></div>
<div id="warn" aria-live="polite"></div>
<svg id="g" viewBox="0 0 560 270" role="img" aria-label="Aktív CPU-teher az eseménysűrűség függvényében, logaritmikus tengelyekkel"></svg>
<p><button id="play">▶ Idővonal lejátszása</button> <span class="small">1 ms, az aktuális N-nel (f_cpu = 25 MHz)</span></p>
<svg id="t" viewBox="0 0 560 120" role="img" aria-label="1 ms-os idővonal: busy-poll, időszakos lekérdezés, interrupt"></svg>
<p class="small">Levezetett modell, nem mérés: C_busy = f_cpu; C_poll = (c_wake + c_check)/T_poll; C_irq = N·c_ISR;
N* = c_poll/(T_poll·c_ISR), az időszakos modell csak N ≤ 1/T_poll esetén érvényes. A rövid aktív szakaszok az
idővonalon legalább 2 px szélesek.</p>
<script>
const F = 25e6, NS = "http://www.w3.org/2000/svg";
const g = document.getElementById("g"), t = document.getElementById("t");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mk(svg, tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]);
  if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function fmt(x){ if (x >= 1000) return Math.round(x).toLocaleString("hu-HU");
  return (Math.round(x * 1000) / 1000).toString().replace(".", ","); }
function P(){ const v = id => +document.getElementById(id).value;
  return {N: Math.pow(10, v("n")), tp: v("tp") * 1e-6, cw: v("cw"), cc: v("cc"), ci: v("ci")}; }
function calc(p){ const cpoll = p.cw + p.cc;
  return {poll: 100 * cpoll / p.tp / F, irq: 100 * p.N * p.ci / F, nstar: cpoll / (p.tp * p.ci), nmax: 1 / p.tp, cpoll}; }
let anim = null, frac = 1;
function draw(){
  const p = P(), r = calc(p);
  document.getElementById("nv").textContent = fmt(p.N);
  document.getElementById("tpv").textContent = fmt(p.tp * 1e6);
  ["cw", "cc", "ci"].forEach(i => document.getElementById(i + "v").textContent = document.getElementById(i).value);
  document.getElementById("out").textContent =
    `N* = ${fmt(r.nstar)} esemény/s; N = ${fmt(p.N)}/s mellett: busy-poll 100 %, időszakos ${fmt(r.poll)} %, ` +
    `interrupt ${fmt(r.irq)} %. ${p.N < r.nstar ? "Az interrupt" : "Az időszakos lekérdezés"} használ kevesebb aktív ciklust.`;
  document.getElementById("warn").textContent = p.N > r.nmax ?
    `Figyelem: N > 1/T_poll = ${fmt(r.nmax)}/s – az időszakos modell itt érvénytelen (bájtvesztés).` :
    (r.nstar > r.nmax ? `Az N* = ${fmt(r.nstar)} az érvényességi határ (${fmt(r.nmax)}/s) fölé esik.` : "");
  // log–log grafikon
  g.innerHTML = "";
  const L = 60, R = 525, T = 12, B = 230, X = n => L + (Math.log10(n) - 1) / 5 * (R - L),
        Y = c => T + (Math.log10(400) - Math.log10(c)) / (Math.log10(400) + 3) * (B - T);
  for (let e = 1; e <= 6; e++) { mk(g, "line", {x1: X(10 ** e), y1: T, x2: X(10 ** e), y2: B, stroke: css("--grid")});
    mk(g, "text", {x: X(10 ** e), y: B + 16, "text-anchor": "middle", "font-size": 12}, fmt(10 ** e)); }
  [0.001, 0.01, 0.1, 1, 10, 100].forEach(c => { mk(g, "line", {x1: L, y1: Y(c), x2: R, y2: Y(c), stroke: css("--grid")});
    mk(g, "text", {x: L - 5, y: Y(c) + 4, "text-anchor": "end", "font-size": 12}, fmt(c)); });
  mk(g, "text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "N [esemény/s]");
  mk(g, "text", {x: 12, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 12 ${(T + B) / 2})`}, "teher [% f_cpu]");
  mk(g, "line", {x1: L, y1: Y(100), x2: R, y2: Y(100), stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "2 3"});
  mk(g, "text", {x: R - 4, y: Y(100) - 5, "text-anchor": "end", "font-size": 12}, "busy-poll 100 %");
  const xm = X(Math.min(1e6, Math.max(10, r.nmax)));
  if (r.poll > 0.001 && r.poll < 400) {
    mk(g, "line", {x1: L, y1: Y(r.poll), x2: xm, y2: Y(r.poll), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "8 4"});
    mk(g, "line", {x1: xm, y1: Y(r.poll), x2: R, y2: Y(r.poll), stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": "2 4"});
    mk(g, "text", {x: L + 4, y: Y(r.poll) - 5, "font-size": 12, fill: css("--hl")}, `időszakos ${fmt(r.poll)} %`);
  }
  const n0 = 10, n1 = 1e6, c0 = 100 * n0 * p.ci / F, c1 = 100 * n1 * p.ci / F;
  const clip = (n) => Math.max(1e-3, Math.min(400, 100 * n * p.ci / F));
  const na = Math.max(n0, 1e-3 * F / (100 * p.ci)), nb = Math.min(n1, 400 * F / (100 * p.ci));
  mk(g, "line", {x1: X(na), y1: Y(clip(na)), x2: X(nb), y2: Y(clip(nb)), stroke: css("--hl2"), "stroke-width": 2.2});
  mk(g, "text", {x: X(100), y: Y(clip(100)) - 10, "font-size": 12, fill: css("--hl2")}, "interrupt");
  if (r.nstar >= 10 && r.nstar <= 1e6) {
    mk(g, "circle", {cx: X(r.nstar), cy: Y(r.poll), r: 5, fill: css("--fg")});
    mk(g, "text", {x: X(r.nstar) + 7, y: Y(r.poll) + 16, "font-size": 12, "font-weight": "bold"}, `N* = ${fmt(r.nstar)}`);
  }
  mk(g, "line", {x1: X(p.N), y1: T, x2: X(p.N), y2: B, stroke: css("--fg"), "stroke-width": 1, "stroke-dasharray": "1 2"});
  mk(g, "circle", {cx: X(p.N), cy: Y(Math.max(1e-3, r.irq)), r: 4, fill: css("--bg"), stroke: css("--hl2"), "stroke-width": 2});
  drawT(p, r);
}
function drawT(p, r){
  t.innerHTML = "";
  const L = 90, R = 550, X = us => L + us / 1000 * (R - L), lim = frac * 1000;
  const rows = [["busy-poll", 22], ["időszakos", 56], ["interrupt", 90]];
  rows.forEach(([n, y]) => { mk(t, "text", {x: L - 6, y: y + 5, "text-anchor": "end", "font-size": 12}, n);
    mk(t, "rect", {x: L, y: y - 11, width: R - L, height: 22, fill: "none", stroke: css("--muted"), "stroke-width": 0.6}); });
  const bar = (y, a, w) => { if (a > lim) return; mk(t, "rect", {x: X(a), y: y - 11, width: Math.max(2, X(Math.min(a + w, lim)) - X(a)), height: 22, fill: css("--fg")}); };
  bar(22, 0, 1000);
  if (p.N <= r.nmax) for (let a = 0; a < 1000; a += p.tp * 1e6) bar(56, a, r.cpoll / F * 1e6);
  const per = 1e6 / p.N, isr = p.ci / F * 1e6; let cnt = 0;
  for (let a = per * 0.4; a < 1000 && cnt < 2000; a += per, cnt++) bar(90, a, isr);
  mk(t, "line", {x1: X(lim), y1: 6, x2: X(lim), y2: 106, stroke: css("--hl"), "stroke-width": 1.5});
  mk(t, "text", {x: L, y: 116, "font-size": 11}, `0 µs … 1000 µs; ébredések: ${p.N <= r.nmax ? Math.round(1000 / (p.tp * 1e6)) : "–"}, ISR-ek: ${cnt}`);
}
document.querySelectorAll("input").forEach(i => i.addEventListener("input", draw));
document.getElementById("play").onclick = () => {
  const b = document.getElementById("play");
  if (anim) { clearInterval(anim); anim = null; b.textContent = "▶ Idővonal lejátszása"; return; }
  frac = 0; b.textContent = "⏸ Szünet";
  anim = setInterval(() => { frac = Math.min(1, frac + 0.02); drawT(P(), calc(P()));
    if (frac >= 1) { clearInterval(anim); anim = null; b.textContent = "▶ Idővonal lejátszása"; } }, 60);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
