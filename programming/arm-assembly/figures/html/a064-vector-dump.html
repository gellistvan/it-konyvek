<p class="small">A dump a 16.4.5 közölt objdump-kimenete; a .text-elrendezést keystone-nal ellenőriztük (b.w _startup 4 bájt, a többi b . 2 bájt).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 1, "ph": 0, "bad": false, "line": -1, "msg": "Slot 1 (Reset), offset 0x04: bájtcsoport „41 00 00 00” (memóriasorrend)."}, {"k": 1, "ph": 1, "bad": false, "line": 0, "msg": "Little-endian visszaolvasás: a legmagasabb című bájt áll elöl: 00 00 00 41 → 0x00000041."}, {"k": 1, "ph": 2, "bad": false, "line": 2, "msg": "Bit0 = 1 (Thumb); a kezelő címe 0x40: Reset_Handler."}];
const CODE = ["szó = b0 | b1<<8 | b2<<16 | b3<<24     @ little-endian visszaolvasás", "slot 0: kezdeti MSP (_estack)", "slot k > 0: kezelőcím | 1 (Thumb-bit); bit0 nélkül a .text-be mutat", "fenntartott slot (7–10, 13): 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SLOTS = [{"off": 0, "name": "Initial SP", "group": "00004020", "word": 541065216, "handler": null, "reserved": false}, {"off": 4, "name": "Reset", "group": "41000000", "word": 65, "handler": "Reset_Handler", "reserved": false}, {"off": 8, "name": "NMI", "group": "45000000", "word": 69, "handler": "NMI_Handler", "reserved": false}, {"off": 12, "name": "HardFault", "group": "47000000", "word": 71, "handler": "HardFault_Handler", "reserved": false}, {"off": 16, "name": "MemManage", "group": "00000000", "word": 0, "handler": null, "reserved": false}, {"off": 20, "name": "BusFault", "group": "00000000", "word": 0, "handler": null, "reserved": false}, {"off": 24, "name": "UsageFault", "group": "00000000", "word": 0, "handler": null, "reserved": false}, {"off": 28, "name": "Reserved", "group": "00000000", "word": 0, "handler": null, "reserved": true}, {"off": 32, "name": "Reserved", "group": "00000000", "word": 0, "handler": null, "reserved": true}, {"off": 36, "name": "Reserved", "group": "00000000", "word": 0, "handler": null, "reserved": true}, {"off": 40, "name": "Reserved", "group": "00000000", "word": 0, "handler": null, "reserved": true}, {"off": 44, "name": "SVCall", "group": "49000000", "word": 73, "handler": "SVC_Handler", "reserved": false}, {"off": 48, "name": "DebugMonitor", "group": "00000000", "word": 0, "handler": null, "reserved": false}, {"off": 52, "name": "Reserved", "group": "00000000", "word": 0, "handler": null, "reserved": true}, {"off": 56, "name": "PendSV", "group": "4b000000", "word": 75, "handler": "PendSV_Handler", "reserved": false}, {"off": 60, "name": "SysTick", "group": "4d000000", "word": 77, "handler": "SysTick_Handler", "reserved": false}], TEXT = [{"name": "Reset_Handler", "addr": 64}, {"name": "NMI_Handler", "addr": 68}, {"name": "HardFault_Handler", "addr": 70}, {"name": "SVC_Handler", "addr": 72}, {"name": "PendSV_Handler", "addr": 74}, {"name": "SysTick_Handler", "addr": 76}, {"name": "_startup", "addr": 78}];
let BAD = false;
function render(s){
  svg.setAttribute("viewBox","0 0 640 420");
  svg.innerHTML = "";
  const ln = css("--line");
  // dump-csoportok (kattinthatók)
  el("text",{x:10,y:18,"font-size":12,"font-weight":"bold"},"objdump -s -j .vectors – kattints egy bájtcsoportra:");
  for (let r=0;r<4;r++){
    el("text",{x:10,y:44+r*22,"font-size":12,style:"font-family:ui-monospace,monospace"},"0x"+(r*16).toString(16).padStart(2,"0"));
    for (let c=0;c<4;c++){
      const k = r*4+c, g = (BAD&&k===1) ? "40000000" : SLOTS[k].group, on = k===s.k;
      const r_ = el("rect",{x:60+c*80,y:30+r*22,width:76,height:20,fill:on?css("--cellhl"):css("--cell"),
         stroke:(BAD&&k===1)?css("--hl2"):ln,"stroke-width":on?2.5:0.8,style:"cursor:pointer",tabindex:0,role:"button",
         "aria-label":"slot "+k});
      r_.addEventListener("click",()=>pick(k));
      r_.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(k);}});
      const t = el("text",{x:98+c*80,y:45+r*22,"text-anchor":"middle","font-size":12,style:"font-family:ui-monospace,monospace"},g);
      t.style.pointerEvents="none";
    }
  }
  // slot-oszlop
  for (let k=0;k<16;k++){
    const y = 130+k*17, sl = SLOTS[k], on = k===s.k;
    const w = (BAD&&k===1) ? 0x40 : sl.word;
    el("rect",{x:10,y:y,width:300,height:17,fill:on?css("--cellhl"):css("--cell"),stroke:ln,"stroke-width":on?2:0.5,
       "stroke-dasharray":sl.reserved?"3 2":"none"});
    el("text",{x:14,y:y+13,"font-size":11,style:"font-family:ui-monospace,monospace"},"0x"+sl.off.toString(16).padStart(2,"0").toUpperCase());
    el("text",{x:60,y:y+13,"font-size":11},sl.name);
    el("text",{x:305,y:y+13,"font-size":11,style:"font-family:ui-monospace,monospace","text-anchor":"end",
       fill:(BAD&&k===1)?css("--hl2"):css("--fg")},w?"0x"+w.toString(16).padStart(8,"0"):"0");
  }
  // .text
  el("text",{x:470,y:122,"font-size":12,"font-weight":"bold","text-anchor":"middle"},".text 0x40–0x4F");
  const ty = {};
  TEXT.forEach((t,i)=>{
    const n = t.name==="Reset_Handler"?4:2, y = 130+(t.addr-0x40)*12;
    const tgt = s.ph>=2 && SLOTS[s.k].handler===t.name && !(BAD&&s.k===1);
    el("rect",{x:420,y:y,width:100,height:n*12,fill:tgt?css("--cellhl"):css("--cell"),stroke:ln,"stroke-width":tgt?2.5:0.8});
    el("text",{x:415,y:y+11,"font-size":10,"text-anchor":"end",style:"font-family:ui-monospace,monospace"},"0x"+t.addr.toString(16));
    el("text",{x:525,y:y+11,"font-size":11},t.name);
    ty[t.name] = y+6;
  });
  if (s.ph>=2 && SLOTS[s.k].handler && !(BAD&&s.k===1)){
    el("line",{x1:310,y1:130+s.k*17+8,x2:418,y2:ty[SLOTS[s.k].handler],stroke:css("--hl"),"stroke-width":2.5});
    el("text",{x:330,y:385,"font-size":12},"bit0 nélkül → "+SLOTS[s.k].handler+" (+1 = Thumb-bit)");
  }
  if (BAD&&s.k===1&&s.ph>=2) el("text",{x:330,y:385,"font-size":13,"font-weight":"bold",fill:css("--hl2")},"Reset = 0x00000040 (páros): INVSTATE");
  if (s.ph>=1){
    const g = (BAD&&s.k===1)?"40000000":SLOTS[s.k].group, b=[0,2,4,6].map(i=>g.slice(i,i+2));
    el("text",{x:330,y:405,"font-size":12,style:"font-family:ui-monospace,monospace"},b.join(" ")+"  →  0x"+b.slice().reverse().join(""));
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
