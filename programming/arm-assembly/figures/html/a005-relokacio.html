<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relokáció: bl lab_add22</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="stop();show(0);setTimeout(function(){show(1);},700);setTimeout(function(){show(2);},1700);">Linkelés ▶</button><span class="small">egérrel a bl sorra mutatva a kódszó mezői kiemelődnek (szürke: 6 bites opcode, fehér: imm26)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalon a lab-main.o bl utasítása R_AARCH64_CALL26 relokációval és U lab_add22 szimbólummal, jobb oldalon a lab-app-ban ugyanez a lab_add22 címére mutat; alul a bl kódszó bitjei."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A BL kódolása (100101 + imm26) és az imm26 számítása keystone-nal ellenőrzött; a main utasítássorrendje és minden cím illusztratív példa (a tényleges értékeket az objdump -dr / nm kimenete adja).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"o": [" 0: a9be7bfd  stp x29, x30, [sp, #-32]!", " 4: 52800280  mov w0, #0x14  // #20", " 8: 910003fd  mov x29, sp", " c: f9000bf3  str x19, [sp, #16]", "10: 94000000  bl 10 <main+0x10>"], "rel": "10: R_AARCH64_CALL26  lab_add22", "nm": ["U __printf_chk", "U lab_add22", "T main"], "math": ["nm: T lab_add22", "0: 11005800  add w0, w0, #22", "4: d65f03c0  ret"], "app": ["400600: a9be7bfd  stp x29, x30, [sp, #-32]!", "400604: 52800280  mov w0, #0x14  // #20", "400608: 910003fd  mov x29, sp", "40060c: f9000bf3  str x19, [sp, #16]", "400610: 9400004c  bl 400740 <lab_add22>"], "add22": ["400740: 11005800  add w0, w0, #22", "400744: d65f03c0  ret"], "printf": "<__printf_chk>: 407a30 …", "k": 0, "word": 2483027968, "line": 0, "bfl": "bl a .o-ban:", "msg": "A lab-main.o-ban a bl kódszava 94000000: opcode 100101, imm26 = 0 – a mező ideiglenes. Mellette a relokáció: R_AARCH64_CALL26 lab_add22 a 0x10 eltolásnál; nm: U lab_add22, U __printf_chk (feloldatlan)."}, {"o": [" 0: a9be7bfd  stp x29, x30, [sp, #-32]!", " 4: 52800280  mov w0, #0x14  // #20", " 8: 910003fd  mov x29, sp", " c: f9000bf3  str x19, [sp, #16]", "10: 94000000  bl 10 <main+0x10>"], "rel": "10: R_AARCH64_CALL26  lab_add22", "nm": ["U __printf_chk", "U lab_add22", "T main"], "math": ["nm: T lab_add22", "0: 11005800  add w0, w0, #22", "4: d65f03c0  ret"], "app": ["400600: a9be7bfd  stp x29, x30, [sp, #-32]!", "400604: 52800280  mov w0, #0x14  // #20", "400608: 910003fd  mov x29, sp", "40060c: f9000bf3  str x19, [sp, #16]", "400610: 9400004c  bl 400740 <lab_add22>"], "add22": ["400740: 11005800  add w0, w0, #22", "400744: d65f03c0  ret"], "printf": "<__printf_chk>: 407a30 …", "k": 1, "word": 2483027968, "line": 1, "bfl": "relokáció:", "msg": "Linkelés: a linker elhelyezi a main-t és a lab_add22-t, majd a relokáció szerint kiszámolja: imm26 = (S + A − P) / 4 = (0x400740 − 0x400610) / 4 = 0x4c."}, {"o": [" 0: a9be7bfd  stp x29, x30, [sp, #-32]!", " 4: 52800280  mov w0, #0x14  // #20", " 8: 910003fd  mov x29, sp", " c: f9000bf3  str x19, [sp, #16]", "10: 94000000  bl 10 <main+0x10>"], "rel": "10: R_AARCH64_CALL26  lab_add22", "nm": ["U __printf_chk", "U lab_add22", "T main"], "math": ["nm: T lab_add22", "0: 11005800  add w0, w0, #22", "4: d65f03c0  ret"], "app": ["400600: a9be7bfd  stp x29, x30, [sp, #-32]!", "400604: 52800280  mov w0, #0x14  // #20", "400608: 910003fd  mov x29, sp", "40060c: f9000bf3  str x19, [sp, #16]", "400610: 9400004c  bl 400740 <lab_add22>"], "add22": ["400740: 11005800  add w0, w0, #22", "400744: d65f03c0  ret"], "printf": "<__printf_chk>: 407a30 …", "k": 2, "word": 2483028044, "line": 2, "bfl": "bl a lab-app-ban:", "msg": "A lab-app-ban a bl kódszava 9400004c: opcode 100101, imm26 = 0x4c; a hívás a lab_add22 végleges címére (0x400740) mutat. A címek példák, a buildtől függnek."}];
const CODE = ["lab-main.o:  10: 94000000  bl 10 <main+0x10>    ; 10: R_AARCH64_CALL26  lab_add22", "relokáció:   imm26 = (0x400740 - 0x400610) / 4 = 0x4c", "lab-app:     400610: 9400004c  bl 400740 <lab_add22>"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 720 330");
  svg.innerHTML = "";
  const MONO = "font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre";
  const line = css("--line"), hl = css("--hl2"), mut = css("--muted"), fg = css("--fg");
  const t = (x, y, txt, o) => el("text", Object.assign({x: x, y: y, "font-size": 12.5, style: MONO}, o || {}), txt);
  // bal: lab-main.o
  el("rect", {x: 4, y: 4, width: 340, height: 214, fill: "none", stroke: line});
  el("text", {x: 12, y: 22, "font-size": 14, "font-weight": "bold"}, "lab-main.o  (ELF REL)");
  s.o.forEach((l, i) => t(14, 44 + i * 18, l, i === 4 ? {"font-weight": "bold", fill: s.k === 0 ? fg : mut} : {}));
  // relokáció
  const ry = s.k === 0 ? 124 : s.k === 1 ? 106 : 106;
  if (s.k < 2) {
    el("rect", {x: 10, y: ry, width: 300, height: 20, fill: "url(#hatch)", stroke: hl, "stroke-width": s.k === 1 ? 3 : 1.2});
    t(16, ry + 15, s.rel, {fill: fg});
  }
  t(14, 166, "nm lab-main.o:", {fill: mut});
  s.nm.forEach((l, i) => t(130, 166 + i * 16, l));
  // feloldatlan / feloldott nyíl a bl sorról a lab_add22 felé
  if (s.k === 0) {
    el("path", {d: "M 300 112 C 340 112, 340 268, 360 268", fill: "none", stroke: line, "stroke-width": 1.6, "stroke-dasharray": "6 4"});
    el("text", {x: 318, y: 200, "font-size": 18, "font-weight": "bold"}, "?");
  }
  // lab-math.o
  el("rect", {x: 4, y: 228, width: 340, height: 70, fill: "none", stroke: line});
  el("text", {x: 12, y: 246, "font-size": 14, "font-weight": "bold"}, "lab-math.o  (ELF REL)");
  s.math.forEach((l, i) => t(14, 264 + i * 16, l));
  // jobb: lab-app
  el("rect", {x: 356, y: 4, width: 340, height: 294, fill: "none", stroke: line, "stroke-dasharray": s.k === 2 ? "none" : "3 3"});
  el("text", {x: 364, y: 22, "font-size": 14, "font-weight": "bold", fill: s.k === 2 ? fg : mut}, "lab-app  (ELF EXEC, statikus)");
  if (s.k >= 1) {
    s.app.forEach((l, i) => t(364, 44 + i * 18, l, i === 4 ? {"font-weight": "bold", fill: s.k === 2 ? hl : mut} : {}));
    t(364, 150, "<lab_add22>:");
    s.add22.forEach((l, i) => t(376, 168 + i * 16, l));
    t(364, 218, s.printf);
    el("text", {x: 376, y: 234, "font-size": 12, "font-style": "italic", fill: mut}, "(a libc.a-ból beemelt tag)");
  } else {
    el("text", {x: 526, y: 150, "text-anchor": "middle", "font-size": 13, fill: mut}, "(még nincs linkelve)");
  }
  if (s.k === 2) {
    el("path", {d: "M 690 112 C 715 112, 715 146, 690 146", fill: "none", stroke: hl, "stroke-width": 2.2});
    el("polygon", {points: "690,146 699,141 699,151", fill: hl});
  }
  // a bl kódszó bitmezői
  const bits = s.word.toString(2).padStart(32, "0");
  const bx = 120, by = 304, cw = 17;
  el("text", {x: 10, y: by + 15, "font-size": 12.5, fill: mut, id: "bfl"}, s.bfl);
  for (let i = 0; i < 32; i++) {
    el("rect", {x: bx + i * cw, y: by, width: cw, height: 20, fill: i < 6 ? css("--cellhl") : css("--cell"), stroke: line, "stroke-width": 0.8});
    el("text", {x: bx + i * cw + cw / 2, y: by + 15, "text-anchor": "middle", "font-size": 11.5, style: MONO}, bits[i]);
  }
  // egérrel a bl sorra mutatva kiemelés
  svg.querySelectorAll("text").forEach(e => { if (e.textContent.indexOf(" bl ") >= 0) {
    e.style.cursor = "help";
    e.addEventListener("mouseenter", () => svg.querySelectorAll("rect").forEach(r => { if (+r.getAttribute("y") === by) r.setAttribute("stroke", hl); }));
    e.addEventListener("mouseleave", () => svg.querySelectorAll("rect").forEach(r => { if (+r.getAttribute("y") === by) r.setAttribute("stroke", line); }));
  }});
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = '<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="' + mut + '" stroke-width="1"/></pattern>';
  svg.insertBefore(defs, svg.firstChild);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
