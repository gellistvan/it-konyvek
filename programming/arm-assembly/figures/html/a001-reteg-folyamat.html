<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-hidden útja a C-forrástól a futásig</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra: lab-hidden.c, gcc -S, lab-hidden.s, as, lab-hidden.o, linker, lab-hidden, qemu-aarch64, kimenet; a lépés nyila kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kódpanel a 2.1.5.1 négy parancsát mutatja egy sorba vonva. A .s kivonat a fejezet várható, leegyszerűsített utasításmintája (GCC -O2), a kimenet a C-szabályokból levezetett érték.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"step": 0, "line": 0, "note": "a lab_rises_s törzsében már nincs összeadás: mov w0, #1 – az összeadás eltűnt", "msg": "1. C-forrás → assemblyforrás – réteg: C-fordító. Mit vizsgálunk benne? Milyen műveleteket hagyott el vagy alakított át? – a lab_rises_s törzsében már nincs összeadás: mov w0, #1 – az összeadás eltűnt"}, {"step": 1, "line": 1, "note": "a printf még feloldatlan hivatkozás a tárgyfájlban", "msg": "2. assemblyforrás → tárgyfájl – réteg: Assembler. Mit vizsgálunk benne? Utasításkódok, szimbólumok, később feloldandó hivatkozások – a printf még feloldatlan hivatkozás a tárgyfájlban"}, {"step": 2, "line": 2, "note": "a printf és a libc itt kerül be (statikus linkelés)", "msg": "3. tárgyfájl → futtatható ELF – réteg: Linker. Mit vizsgálunk benne? Hol találhatók a hívott függvények és adatok? – a printf és a libc itt kerül be (statikus linkelés)"}, {"step": 3, "line": 3, "note": "kimenet: unsigned_next=0 / signed_rises=1 / exit=0", "msg": "4. futtatható ELF → futás – réteg: Betöltés és végrehajtás. Mit vizsgálunk benne? Milyen állapotváltozások történnek? – kimenet: unsigned_next=0 / signed_rises=1 / exit=0"}];
const CODE = ["aarch64-linux-gnu-gcc -std=c11 -O2 -fno-inline -Wall -Wextra -march=armv8-a -mlittle-endian -S lab-hidden.c -o lab-hidden.s", "aarch64-linux-gnu-as -march=armv8-a -EL lab-hidden.s -o lab-hidden.o", "aarch64-linux-gnu-gcc -march=armv8-a -mlittle-endian -static lab-hidden.o -o lab-hidden", "qemu-aarch64 ./lab-hidden; printf 'exit=%s\\n' \"$?\""];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const FILES = [{"id": "c", "x": 1.45, "name": "lab-hidden.c", "kind": "C-forrás", "layer": "C-forrás"}, {"id": "s", "x": 4.8, "name": "lab-hidden.s", "kind": "assemblyforrás", "layer": "Assemblyforrás"}, {"id": "o", "x": 8.3, "name": "lab-hidden.o", "kind": "tárgyfájl\n(ELF REL)", "layer": null}, {"id": "e", "x": 11.8, "name": "lab-hidden", "kind": "futtatható\nELF, statikus", "layer": null}, {"id": "out", "x": 15.45, "name": "kimenet", "kind": "unsigned_next=0\nsigned_rises=1\nexit=0", "layer": null}], TOOLS = [{"x": 3.05, "l1": "aarch64-linux-", "l2": "gnu-gcc -S", "layer": "C-fordító"}, {"x": 6.55, "l1": "aarch64-linux-", "l2": "gnu-as", "layer": "Assembler"}, {"x": 10.05, "l1": "aarch64-linux-", "l2": "gnu-gcc -static", "layer": "Linker"}, {"x": 13.55, "l1": "qemu-aarch64", "l2": "./lab-hidden", "layer": "Betöltés és végrehajtás"}], SNIP = ["lab_next_u:  add w0, w0, #1", "             ret", "lab_rises_s: mov w0, #1", "             ret"];
const MONO = "font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre";
const SC = 40, OX = 10, OY = 10, YMAX = 5.6;
function X(x){return OX + x * SC;} function Y(y){return OY + (YMAX - y) * SC;}
function render(s){
  svg.setAttribute("viewBox", "0 0 690 260");
  svg.innerHTML = "";
  const fg = css("--fg"), line = css("--line"), hl = css("--hl2");
  FILES.forEach((f, i) => {
    const on = (i === s.step || i === s.step + 1);
    const x0 = X(f.x - 1.3), y0 = Y(3.55 + 1.25);
    if (f.id === "out") {
      el("rect", {x: x0, y: y0 - 10, width: 104, height: 70, fill: on ? css("--cellhl") : css("--cell"),
        stroke: on ? hl : line, "stroke-width": on ? 3 : 1.2, "stroke-dasharray": "2 3"});
      el("text", {x: X(f.x), y: y0 - 14, "text-anchor": "middle", "font-size": 12, "font-style": "italic"}, "kimenet");
      if (s.step === 3) f.kind.split("\n").forEach((t, j) =>
        el("text", {x: X(f.x), y: y0 + 8 + j * 16, "text-anchor": "middle", "font-size": 12, style: MONO}, t));
      else el("text", {x: X(f.x), y: y0 + 26, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "(még nem fut)");
      return;
    }
    el("rect", {x: x0, y: y0, width: 104, height: 50, fill: on ? css("--cellhl") : css("--cell"),
      stroke: on ? hl : line, "stroke-width": on ? 3 : 1.4});
    el("text", {x: X(f.x), y: y0 + 21, "text-anchor": "middle", "font-size": 12, style: MONO, "font-weight": "bold"}, f.name);
    el("text", {x: X(f.x), y: y0 + 39, "text-anchor": "middle", "font-size": 11}, f.kind);
    if (f.layer) el("text", {x: X(f.x), y: y0 - 6, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, "réteg: " + f.layer);
  });
  TOOLS.forEach((t, i) => {
    const on = i === s.step, x0 = X(t.x - 1.5), y0 = Y(1.75 + 1.0);
    el("rect", {x: x0, y: y0, width: 120, height: 40, rx: 12, fill: css("--cell"),
      stroke: on ? hl : line, "stroke-width": on ? 3 : 1.2, "stroke-dasharray": "6 4"});
    el("text", {x: X(t.x), y: y0 + 16, "text-anchor": "middle", "font-size": 10.5, style: MONO}, t.l1);
    el("text", {x: X(t.x), y: y0 + 32, "text-anchor": "middle", "font-size": 11, style: MONO, "font-weight": "bold"}, t.l2);
    el("text", {x: X(t.x), y: y0 + 54, "text-anchor": "middle", "font-size": 11, "font-style": "italic", fill: on ? hl : css("--muted")}, "réteg: " + t.layer);
    const a = FILES[i], b = FILES[i + 1];
    const st = {stroke: on ? hl : line, "stroke-width": on ? 3.5 : 1.3, fill: "none"};
    el("line", Object.assign({x1: X(a.x + 0.5), y1: Y(3.55), x2: X(t.x - 1.25), y2: Y(2.75)}, st));
    const bx = X(b.x - 0.5), by = Y(3.55) + (b.id === "out" ? 10 : 0), sx = X(t.x + 1.25), sy = Y(2.75);
    el("line", Object.assign({x1: sx, y1: sy, x2: bx, y2: by}, st));
    const ang = Math.atan2(by - sy, bx - sx), L = 10;
    el("polygon", {points: `${bx},${by} ${bx - L * Math.cos(ang - 0.4)},${by - L * Math.sin(ang - 0.4)} ${bx - L * Math.cos(ang + 0.4)},${by - L * Math.sin(ang + 0.4)}`,
      fill: on ? hl : line});
  });
  // lépésenkénti kiemelés alul
  if (s.step === 0) {
    el("rect", {x: X(1.0), y: Y(1.0), width: 345, height: 56, fill: "none", stroke: hl, "stroke-dasharray": "2 3", "stroke-width": 1.5});
    SNIP.forEach((t, j) => el("text", {x: X(1.15), y: Y(1.0) + 13 + j * 13, "font-size": 11, style: MONO}, t));
    el("text", {x: X(1.0) + 338, y: Y(1.0) + 39, "text-anchor": "end", "font-size": 11, "font-weight": "bold", fill: hl}, "← az összeadás eltűnt");
  } else {
    el("text", {x: 345, y: 246, "text-anchor": "middle", "font-size": 12, fill: hl}, s.note);
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
