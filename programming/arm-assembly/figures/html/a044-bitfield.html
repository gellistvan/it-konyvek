<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>binary32 bitmezők</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>float érték <input type="text" id="val" value="-12.375" spellcheck="false"></label>
 <button id="go">Kódol</button>
 <label>vagy hexa bitminta <input type="text" id="hex" value="0xC1460000" spellcheck="false"></label>
 <button id="gohex">Dekódol</button>
</div>
<div class="ctl"><button class="ex" data-v="-12.375">−12,375</button><button class="ex" data-v="0.1">0,1</button><button class="ex" data-v="-10">−10</button><button class="ex" data-h="0xC1200000">0xC1200000</button><span class="small">Bitre kattintva (vagy Tab + Enter) átbillenthető.</span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 150" role="img" aria-label="32 bit: előjel, exponens, fraction és hexa jegyek"></svg>
<table><tbody id="tb"></tbody></table>

<p class="small">A kódolás a böngésző Float32 (IEEE 754 binary32, round to nearest, ties to even) átalakítását használja. 0xC1200000 → −10 (1. feladat).</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


let W = 0xC1460000 >>> 0;
const svgV = $("v"), dv = new DataView(new ArrayBuffer(4));
function f2w(x){ dv.setFloat32(0, x); return dv.getUint32(0); }
function w2f(u){ dv.setUint32(0, u >>> 0); return dv.getFloat32(0); }
function fmt(x){ if (Number.isNaN(x)) return "NaN"; if (!isFinite(x)) return x > 0 ? "+inf" : "-inf"; if (Object.is(x, -0)) return "-0"; return String(x).replace(".", ",").replace("-", "−"); }
function draw(){
  svgV.innerHTML = "";
  const X0 = 20, CW = 22, Y = 50;
  for (let k = 0; k < 32; k++) {
    const b = (W >>> (31 - k)) & 1, fld = k === 0 ? 0 : (k < 9 ? 1 : 2);
    const r = mk(svgV, "rect", {x: X0 + k * CW, y: Y, width: CW, height: 30, fill: fld === 0 ? css("--cell") : (fld === 1 ? css("--cell2") : css("--cellhl")), stroke: css("--line"), "stroke-width": 0.8, tabindex: 0, role: "button", "aria-label": "bit " + (31 - k) + " = " + b, style: "cursor:pointer"});
    const flip = () => { W = (W ^ (1 << (31 - k))) >>> 0; update(); };
    r.addEventListener("click", flip); r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { flip(); e.preventDefault(); } });
    mk(svgV, "text", {x: X0 + k * CW + CW / 2, y: Y + 21, "text-anchor": "middle", class: "mono", "font-size": 15, "pointer-events": "none"}, String(b));
    if ([0, 1, 8, 9, 31].includes(k)) mk(svgV, "text", {x: X0 + k * CW + CW / 2, y: Y - 6, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(31 - k));
    if (k % 4 === 0 && k) mk(svgV, "line", {x1: X0 + k * CW, y1: Y - 2, x2: X0 + k * CW, y2: Y + 32, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "4 3"});
  }
  [[0, 1], [1, 9], [9, 32]].forEach(([a, b]) => mk(svgV, "rect", {x: X0 + a * CW, y: Y, width: (b - a) * CW, height: 30, fill: "none", stroke: css("--line"), "stroke-width": 2.5}));
  for (let n = 0; n < 8; n++) mk(svgV, "text", {x: X0 + (4 * n + 2) * CW, y: Y + 58, "text-anchor": "middle", class: "mono", "font-size": 17, "font-weight": "bold"}, ((W >>> (28 - 4 * n)) & 15).toString(16).toUpperCase());
  mk(svgV, "text", {x: X0, y: 20, "font-size": 12}, "sign");
  mk(svgV, "text", {x: X0 + 2 * CW, y: 20, "font-size": 12}, "exponent (30–23)");
  mk(svgV, "text", {x: X0 + 9 * CW, y: 20, "font-size": 12}, "fraction (22–0)");
  mk(svgV, "text", {x: X0, y: 140, "font-size": 12, fill: css("--muted")}, "szaggatott vonal: nibble-határ (egy hexa jegy = 4 bit)");
}
function update(){
  const s = W >>> 31, e = (W >>> 23) & 255, f = W & 0x7FFFFF, x = w2f(W);
  let kind, mant, ex;
  if (e === 255) { kind = f ? "NaN" : "végtelen"; mant = "–"; ex = "–"; }
  else if (e === 0) { kind = f ? "szubnormális (rejtett bit 0)" : "nulla"; mant = "0," + f.toString(2).padStart(23, "0"); ex = "−126"; }
  else { kind = "normalizált"; mant = "1," + f.toString(2).padStart(23, "0").replace(/0+$/, "") ; ex = String(e - 127).replace("-", "−"); if (mant.endsWith(",")) mant += "0"; }
  const rows = [["hexa", "0x" + W.toString(16).toUpperCase().padStart(8, "0")], ["sign", s + (s ? " (negatív)" : " (pozitív)")],
    ["exponensmező", e.toString(2).padStart(8, "0") + " = " + e + (e > 0 && e < 255 ? " → kitevő " + ex : "")],
    ["fraction", f.toString(2).padStart(23, "0") + " = 0x" + f.toString(16).toUpperCase()],
    ["mantissza (rejtett bittel)", mant + "₂"], ["osztály", kind], ["érték (float)", fmt(x)]];
  $("tb").innerHTML = rows.map(r => "<tr><th>" + r[0] + "</th><td class='mono' style='text-align:left'>" + r[1] + "</td></tr>").join("");
  $("hex").value = "0x" + W.toString(16).toUpperCase().padStart(8, "0");
  $("status").textContent = "0x" + W.toString(16).toUpperCase().padStart(8, "0") + " = " + fmt(x) + " (" + kind + ")";
  draw();
}
function enc(){ const t = $("val").value.trim().replace(",", ".").toLowerCase();
  const x = t === "nan" ? NaN : (t === "inf" || t === "+inf") ? Infinity : t === "-inf" ? -Infinity : Number(t);
  if (Number.isNaN(x) && t !== "nan") { $("status").textContent = "Nem szám: " + t; return; } W = f2w(x); update(); }
function dec(){ const t = $("hex").value.trim(); const u = parseInt(t.replace(/^0x/i, ""), 16);
  if (!/^(0x)?[0-9a-f]{1,8}$/i.test(t)) { $("status").textContent = "Hibás hexa bitminta."; return; } W = u >>> 0; update(); }
$("go").onclick = enc; $("gohex").onclick = dec;
$("val").addEventListener("keydown", e => { if (e.key === "Enter") enc(); });
$("hex").addEventListener("keydown", e => { if (e.key === "Enter") dec(); });
document.querySelectorAll(".ex").forEach(b => b.onclick = () => { if (b.dataset.h) { $("hex").value = b.dataset.h; dec(); } else { $("val").value = b.dataset.v; enc(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
update();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
