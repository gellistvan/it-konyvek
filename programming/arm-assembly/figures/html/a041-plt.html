<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>printf hívásútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
 <label><input type="checkbox" id="load" checked> betöltés után (a GOT-cella kitöltve)</label>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="Statikus és dinamikus hívásút"></svg>

<p class="small">Szerkezeti vázlat címek nélkül. A PLT-kód pontos alakja toolchain-függő; az AArch64 glibc szokásos bejegyzését mutatjuk (adrp/ldr/add/br). Lusta kötésnél a GOT-cella kezdetben a feloldó kódra (PLT0) mutat; azonnali kötésnél (BIND_NOW) a betöltő már induláskor kitölti.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = [{"side": "s", "node": "smain", "msg": "Statikus: a main egy közvetlen bl utasítással hív …"}, {"side": "s", "node": "sio", "msg": "… a _IO_printf törzsébe, amely ugyanebben az ELF-ben van (a statikus glibc printf-aliasa). Nincs PLT, nincs GOT."}, {"side": "d", "node": "dmain", "msg": "Dinamikus: a main hívása bl <printf@plt> – ez még nem a formázó kód."}, {"side": "d", "node": "plt", "msg": "A .plt bejegyzés rövid ugrókód: adrp/ldr a GOT-cellát olvassa, a br x17 oda ugrik, ahová a cella mutat."}, {"side": "d", "node": "got", "msg": "A .got.plt cellát a dinamikus betöltő (INTERP) tölti ki: betöltéskor, vagy lusta kötésnél az első híváskor."}, {"side": "d", "node": "libc", "msg": "A valódi printf a NEEDED bejegyzésben megnevezett libc.so.6-ban van, az ELF-en kívül."}];

const S = DATA; let cur = 0;
const svgV = $("v");
const N = {smain: [40, 60, 220, 40, "main"], sio: [40, 200, 220, 80, "_IO_printf (törzs, ugyanebben az ELF-ben)"],
  dmain: [330, 60, 170, 40, "main"], plt: [330, 150, 210, 110, ""], got: [580, 150, 150, 60, ""],
  libc: [330, 305, 300, 44, "libc.so.6: printf (külön fájl)"]};
function node(id, on){
  const [x, y, w, h, t] = N[id];
  const r = mk(svgV, "rect", {x: x, y: y, width: w, height: h, rx: 6, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1.2, tabindex: 0, role: "button", style: "cursor:pointer", "aria-label": id});
  const k = S.findIndex(s => s.node === id);
  r.addEventListener("click", () => { cur = k; draw(); });
  r.addEventListener("keydown", e => { if (e.key === "Enter") { cur = k; draw(); } });
  if (t) { const lines = t.length > 26 && id === "sio" ? ["_IO_printf", "(törzs, ugyanebben az ELF-ben)"] : [t];
    lines.forEach((l, i) => mk(svgV, "text", {x: x + w / 2, y: y + h / 2 + 5 + (i - (lines.length - 1) / 2) * 17, "text-anchor": "middle", class: "mono", "font-size": 13, "pointer-events": "none"}, l)); }
}
function arrow(x1, y1, x2, y2, t){
  mk(svgV, "line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.5});
  const a = Math.atan2(y2 - y1, x2 - x1), L = 9;
  mk(svgV, "polygon", {points: [x2, y2, x2 - L * Math.cos(a - 0.4), y2 - L * Math.sin(a - 0.4), x2 - L * Math.cos(a + 0.4), y2 - L * Math.sin(a + 0.4)].join(","), fill: css("--line")});
  if (t) mk(svgV, "text", {x: (x1 + x2) / 2 + 6, y: (y1 + y2) / 2 + 4, class: "mono", "font-size": 12}, t);
}
function draw(){
  const s = S[cur], loaded = $("load").checked; svgV.innerHTML = "";
  $("cnt").textContent = (cur + 1) + "/" + S.length;
  mk(svgV, "rect", {x: 20, y: 20, width: 270, height: 280, fill: "none", stroke: css("--muted"), "stroke-dasharray": "6 4"});
  mk(svgV, "text", {x: 30, y: 40, "font-weight": "bold"}, "lab-static.elf");
  mk(svgV, "rect", {x: 310, y: 20, width: 440, height: 270, fill: "none", stroke: css("--muted"), "stroke-dasharray": "6 4"});
  mk(svgV, "text", {x: 320, y: 40, "font-weight": "bold"}, "lab-dynamic.elf");
  ["smain", "sio", "dmain", "plt", "got", "libc"].forEach(id => node(id, s.node === id));
  [".plt: printf@plt", "adrp x16, <GOT lap>", "ldr  x17, [x16, …]", "add  x16, x16, …", "br   x17"].forEach((l, i) =>
    mk(svgV, "text", {x: 340, y: 172 + i * 20, class: "mono", "font-size": 12.5, "font-weight": i ? "normal" : "bold", "pointer-events": "none"}, l));
  mk(svgV, "text", {x: 585, y: 143, "font-weight": "bold", "font-size": 13}, ".got.plt");
  mk(svgV, "text", {x: 655, y: 178, "text-anchor": "middle", "font-size": 12.5, "pointer-events": "none"}, loaded ? "→ libc printf" : "→ PLT0 (resolver)");
  mk(svgV, "text", {x: 655, y: 196, "text-anchor": "middle", "font-size": 11, fill: css("--muted"), "pointer-events": "none"}, loaded ? "betöltő írta" : "a fájlban, lusta kötés");
  arrow(150, 100, 150, 198, "bl <_IO_printf>");
  arrow(415, 100, 415, 148, "bl <printf@plt>");
  arrow(540, 200, 578, 182, "");
  arrow(360, 260, 360, 303, "br x17");
  mk(svgV, "text", {x: 560, y: 245, "font-size": 12, fill: css("--muted")}, "NEEDED libc.so.6");
  mk(svgV, "text", {x: 560, y: 262, "font-size": 12, fill: css("--muted")}, "INTERP: dinamikus betöltő");
  let msg = s.msg;
  if (s.node === "got") msg += loaded ? " Most a cella a libc printf címét tartalmazza." :
    " A fájlban (lusta kötésnél) a cella még a PLT0 feloldó kódra mutat; az első hívás után a betöltő átírja.";
  $("status").textContent = msg;
}
$("prev").onclick = () => { cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { cur = Math.min(S.length - 1, cur + 1); draw(); };
$("load").onchange = draw;
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") $("next").onclick(); if (e.key === "ArrowLeft") $("prev").onclick(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
