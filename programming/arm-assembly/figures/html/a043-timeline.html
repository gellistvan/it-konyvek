<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A mérési intervallum</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Léptetés">
 <button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
 <input id="pos" type="range" min="0" max="9" value="0" aria-label="Lépés">
 <span id="cnt" class="small"></span>
 <label>REPEATS <select id="rep"><option>1000</option><option selected>2000</option><option>4000</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 130" role="img" aria-label="A main szakaszai időrendben, mért és nem mért részek"></svg>
<pre class="code" id="code" aria-label="lab-time.c main"></pre>

<p class="small">A kódpanel a fejezet lab-time.c main() függvénye. Elvárt checksum = 8390656 · REPEATS (1000 → 8390656000, 2000 → 16781312000, 4000 → 33562624000). Időértéket nem mutatunk: a futási idő hostfüggő.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"steps": [{"line": 7, "m": "no", "name": "adat", "msg": "data[] feltöltése (data[i] = i + 1): mérésen kívül."}, {"line": 9, "m": "no", "name": "elvárt", "msg": "Elvárt egyhívásos összeg: N(N+1)/2 = 8390656 – mérésen kívül."}, {"line": 12, "m": "no", "name": "bemelegítés", "msg": "Bemelegítő hívás + első ellenőrzés (8390656): mérésen kívül."}, {"line": 21, "m": "edge", "name": "start", "msg": "lab_stamp(&start): a mért intervallum kezdete; a clock_gettime saját költségének egy része már bent van."}, {"line": 23, "m": "yes", "name": "mért", "msg": "Mért blokk: REPEATS × lab_sum_u32(data, 4096) + total += (a C-ciklus és a hívás költsége is bent van)."}, {"line": 24, "m": "edge", "name": "end", "msg": "lab_stamp(&end): az intervallum vége; a hívás elejéig tartó rész még a mért időbe esik."}, {"line": 26, "m": "no", "name": "tárolás", "msg": "elapsed[s], totals[s] tárolása – már a záró időbélyeg után, nem mért. (s = 0 … 8: kilencszer ismétlődik.)"}, {"line": 35, "m": "no", "name": "ellenőrzés", "msg": "Ellenőrzés: totals[s] == expected · REPEATS és elapsed[s] > 0 – mérésen kívül."}, {"line": 52, "m": "no", "name": "statisztika", "msg": "min / mean / sd számítása: mérésen kívül."}, {"line": 53, "m": "no", "name": "printf", "msg": "Kiírás (printf): mérésen kívül."}], "code": ["int main(void)", "{", "    static uint32_t data[N];", "    int64_t elapsed[SAMPLES];", "    uint64_t totals[SAMPLES];", "", "    for (size_t i = 0; i < N; ++i)", "        data[i] = (uint32_t)(i + 1);", "", "    const uint64_t expected = (uint64_t)N * (N + 1) / 2;", "", "    /* Bemelegítés és első helyességellenőrzés: mérésen kívül. */", "    if (lab_sum_u32(data, N) != expected) {", "        fputs(\"warmup checksum error\\n\", stderr);", "        return 1;", "    }", "", "    for (unsigned s = 0; s < SAMPLES; ++s) {", "        struct timespec start, end;", "        uint64_t total = 0;", "", "        lab_stamp(&start);", "        for (unsigned r = 0; r < REPEATS; ++r)", "            total += lab_sum_u32(data, N);", "        lab_stamp(&end);", "", "        elapsed[s] = lab_elapsed_ns(&start, &end);", "        totals[s] = total;", "    }", "", "    /* Ellenőrzés, statisztika és minden normál kiírás: mérésen kívül. */", "    int64_t minimum = elapsed[0];", "    double mean = 0.0;", "", "    for (unsigned s = 0; s < SAMPLES; ++s) {", "        if (totals[s] != expected * REPEATS || elapsed[s] <= 0) {", "            fputs(\"invalid sample or checksum\\n\", stderr);", "            return 1;", "        }", "        if (elapsed[s] < minimum)", "            minimum = elapsed[s];", "        mean += (double)elapsed[s];", "    }", "    mean /= SAMPLES;", "", "    double squared_deviations = 0.0;", "    for (unsigned s = 0; s < SAMPLES; ++s) {", "        double d = (double)elapsed[s] - mean;", "        squared_deviations += d * d;", "        printf(\"sample[%u]_ns=%\" PRId64 \"\\n\", s, elapsed[s]);", "    }", "", "    double sd = sqrt(squared_deviations / (SAMPLES - 1));", "    printf(\"checksum=%\" PRIu64 \"\\n\", totals[SAMPLES - 1]);", "    printf(\"min_ns=%\" PRId64 \" mean_ns=%.1f sd_ns=%.1f\\n\",", "           minimum, mean, sd);", "    printf(\"ns_per_call=%.3f\\n\", mean / REPEATS);", "    return 0;", "}"]};

const S = DATA.steps, CODE = DATA.code; let cur = 0;
const svgV = $("v");
$("code").innerHTML = CODE.map((l, i) => "<span id='L" + i + "'>" + (l.replace(/&/g, "&amp;").replace(/</g, "&lt;") || " ") + "</span>").join("");
const SEG = [["adat", 70], ["elvárt", 50], ["bemelegítés", 90], ["start", 30], ["mért", 190], ["end", 30], ["tárolás", 60], ["ellenőrzés", 80], ["statisztika", 70], ["printf", 50]];
function draw(){
  const s = S[cur], R = +$("rep").value; svgV.innerHTML = "";
  $("pos").value = cur; $("cnt").textContent = (cur + 1) + "/" + S.length;
  let x = 5;
  SEG.forEach(([nm, w], k) => {
    const st = S[k].m, on = k === cur;
    mk(svgV, "rect", {x: x, y: 40, width: w, height: 40, fill: st === "yes" ? css("--cellhl") : (st === "edge" ? css("--cell2") : css("--cell")), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1});
    mk(svgV, "text", {x: x + w / 2, y: 64, "text-anchor": "middle", "font-size": 11}, nm);
    mk(svgV, "text", {x: x + w / 2, y: 98, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, st === "yes" ? "mért" : (st === "edge" ? "határ" : "nem mért"));
    x += w + 3;
  });
  mk(svgV, "text", {x: 5, y: 22, "font-size": 12}, "a mért blokk (start … end) s = 0 … 8 között kilencszer ismétlődik; a tengely nem arányos");
  mk(svgV, "text", {x: 5, y: 122, "font-size": 12, "font-weight": "bold"}, "elvárt checksum (REPEATS = " + R + "): " + (8390656 * R).toLocaleString("hu-HU"));
  $("status").textContent = (s.m === "yes" ? "[MÉRT] " : s.m === "edge" ? "[HATÁR] " : "[NEM MÉRT] ") + s.msg.replace("REPEATS ×", "REPEATS = " + R + " ×");
  CODE.forEach((_, i) => $("L" + i).classList.toggle("on", i === s.line));
}
$("prev").onclick = () => { cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { cur = Math.min(S.length - 1, cur + 1); draw(); };
$("pos").oninput = () => { cur = +$("pos").value; draw(); };
$("rep").onchange = draw;
document.addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") $("next").onclick(); if (e.key === "ArrowLeft") $("prev").onclick(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
