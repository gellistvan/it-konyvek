<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Védőlap és hibás skálázás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>n <input type="range" id="n" min="1" max="16" value="2" style="width:120px"></label> <span id="nv" class="mono"></span>
 <label>i <input type="range" id="i" min="0" max="1" value="1" style="width:120px"></label> <span id="iv" class="mono"></span>
</div>
<div class="ctl">
 <label>tail <select id="tail"><option value="1" selected>1 (a védőlap előtt)</option><option value="0">0 (a lap elején)</option></select></label>
 <label>skála <select id="sc"><option value="8" selected>8 (hibás: A+8i)</option><option value="4">4 (helyes: A+4i)</option></select></label>
</div>
<div id="status" aria-live="polite" class="mono"></div>
<svg id="v" viewBox="0 0 760 200" role="img" aria-label="Az olvasható lap vége vagy eleje, a tömb és a képzett cím"></svg>

<p class="small">A lab-offset.c run_case() modellje (P = 4096 bájt). Az állapotsor a program kimenetének formáját követi; a SIGSEGV-nél a program kiírás nélkül áll le (a shell 139-et lát). A tömbön kívüli, de olvasható cellák az érintetlen anonim leképezés miatt 0-t adnak.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}


const PAGE = 4096, svgV = $("v");
function runCase(n, i, tail, sc){
  const off = tail ? PAGE - 4 * n : 0, mem = {};
  for (let j = 0; j < n; j++) mem[off + 4 * j] = 1000 + 17 * j;
  const expected = mem[off + 4 * i], addr = off + sc * i;
  if (addr + 4 > PAGE) return {r: "SIGSEGV", expected, addr, off};
  const got = (addr in mem) ? mem[addr] : 0;
  return {r: got === expected ? "OK" : "FAIL", got, expected, addr, off};
}
function draw(){
  const n = +$("n").value; $("i").max = n - 1; if (+$("i").value > n - 1) $("i").value = n - 1;
  const i = +$("i").value, tail = +$("tail").value, sc = +$("sc").value;
  $("nv").textContent = n; $("iv").textContent = i;
  const c = runCase(n, i, tail, sc);
  svgV.innerHTML = "";
  const CW = 22, X0 = 20, NC = 32, startCell = tail ? PAGE / 4 - 18 : 0;
  for (let k = 0; k < NC; k++) {
    const a = (startCell + k) * 4, x = X0 + k * CW, guard = a >= PAGE;
    const inArr = a >= c.off && a < c.off + 4 * n;
    const isT = a === c.addr, isOk = a === c.off + 4 * i;
    mk(svgV, "rect", {x: x, y: 80, width: CW, height: 34, fill: guard ? css("--cellhl") : (inArr ? css("--cell") : css("--cell2")), stroke: css("--line"), "stroke-width": isT ? 3 : 0.8, "stroke-dasharray": isT && sc === 8 ? "4 2" : ""});
    if (guard) mk(svgV, "line", {x1: x, y1: 80, x2: x + CW, y2: 114, stroke: css("--muted")});
    if (inArr) mk(svgV, "text", {x: x + CW / 2, y: 101, "text-anchor": "middle", "font-size": 9, class: "mono"}, String(1000 + 17 * ((a - c.off) / 4)));
    else if (!guard) mk(svgV, "text", {x: x + CW / 2, y: 101, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "0");
    if (isOk) { mk(svgV, "text", {x: x + CW / 2, y: 140, "text-anchor": "middle", "font-size": 12}, "▲ helyes"); }
    if (isT) { mk(svgV, "text", {x: x + CW / 2, y: 64, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "▼ " + (sc === 8 ? "hibás" : "képzett")); }
  }
  const bk = (PAGE / 4 - startCell); if (bk >= 0 && bk <= NC) { const xb = X0 + bk * CW; mk(svgV, "line", {x1: xb, y1: 40, x2: xb, y2: 160, stroke: css("--line"), "stroke-width": 2.5});
    mk(svgV, "text", {x: xb + 4, y: 175, "font-size": 12}, "B+P: védőlap →"); mk(svgV, "text", {x: xb - 4, y: 175, "font-size": 12, "text-anchor": "end"}, "← olvasható lap (RW)"); }
  mk(svgV, "text", {x: X0, y: 30, "font-size": 12, fill: css("--muted")}, tail ? "a lap vége (B+P−72 … B+P+56)" : "a lap eleje (B … B+124)");
  if (c.addr >= (startCell + NC) * 4) mk(svgV, "text", {x: X0 + NC * CW - 4, y: 64, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, "hibás cím: B+" + c.addr + " (az ablakon kívül) ▶");
  const rel = "A+" + (sc * i) + " = B+" + c.addr;
  $("status").textContent = c.r === "SIGSEGV" ? "SIGSEGV (status=139): a képzett cím " + rel + " már a védőlapon van."
    : c.r === "FAIL" ? "FAIL: n=" + n + " i=" + i + " tail=" + tail + " got=" + c.got + " expected=" + c.expected
    : "OK: n=" + n + " i=" + i + " tail=" + tail + " got=" + c.got + " (" + rel + ")";
}
["n", "i", "tail", "sc"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
