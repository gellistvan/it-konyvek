<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A .data LMA-ja és VMA-ja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A .data 20 bájtja a flash 0x1d0 címén töltődik be, és a startup a RAM 0x20000000 címére másolja; a .bss csak címet és méretet kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Címek: a 16.5.3.3 GNU ld 2.42-es nm-kimenete; a LOAD szegmens értékei a fejezet ellenőrzési megjegyzéséből. A másolás és a nullázás a lab-startup.s ciklusának emulált futása (keystone + unicorn); a .data kezdeti szavai szemléltető minták.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "(1) Linkelés után: csak a FLASH-kép létezik; a .data a 0x1d0 címen (LMA) van a fájlban, a szekciófejléc sh_addr-je mégis 0x20000000 (VMA).", "ph": 1, "nc": 0, "nz": 0, "line": 0, "hl": "sh"}, {"msg": "(2) QEMU-betöltés: a LOAD szegmens 0x14 bájtja (FileSiz) a PhysAddr = 0x1d0 címre kerül; a RAM tartalma még meghatározatlan (MemSiz 0x28 – a .bss-t a fájl nem hordozza).", "ph": 2, "nc": 0, "nz": 0, "line": 1, "hl": "load"}, {"msg": "(3) .data-másolás 1/5: [0x000001d0] → [0x20000000] = 0xda7a0000; r1 = 0x20000004.", "ph": 3, "nc": 1, "nz": 0, "line": 3, "hl": "data"}, {"msg": "(3) .data-másolás 2/5: [0x000001d4] → [0x20000004] = 0xda7a0001; r1 = 0x20000008.", "ph": 3, "nc": 2, "nz": 0, "line": 3, "hl": "data"}, {"msg": "(3) .data-másolás 3/5: [0x000001d8] → [0x20000008] = 0xda7a0002; r1 = 0x2000000c.", "ph": 3, "nc": 3, "nz": 0, "line": 3, "hl": "data"}, {"msg": "(3) .data-másolás 4/5: [0x000001dc] → [0x2000000c] = 0xda7a0003; r1 = 0x20000010.", "ph": 3, "nc": 4, "nz": 0, "line": 3, "hl": "data"}, {"msg": "(3) .data-másolás 5/5: [0x000001e0] → [0x20000010] = 0xda7a0004; r1 = 0x20000014 = _edata → bhs: kilépés.", "ph": 3, "nc": 5, "nz": 0, "line": 3, "hl": "data"}, {"msg": "(4) .bss-nullázás 1/5: [0x20000014] = 0.", "ph": 4, "nc": 5, "nz": 1, "line": 5, "hl": "bss"}, {"msg": "(4) .bss-nullázás 2/5: [0x20000018] = 0.", "ph": 4, "nc": 5, "nz": 2, "line": 5, "hl": "bss"}, {"msg": "(4) .bss-nullázás 3/5: [0x2000001c] = 0.", "ph": 4, "nc": 5, "nz": 3, "line": 5, "hl": "bss"}, {"msg": "(4) .bss-nullázás 4/5: [0x20000020] = 0.", "ph": 4, "nc": 5, "nz": 4, "line": 5, "hl": "bss"}, {"msg": "(4) .bss-nullázás 5/5: [0x20000024] = 0 – r1 = 0x20000028 = _ebss, kész; bl main.", "ph": 4, "nc": 5, "nz": 5, "line": 5, "hl": "bss"}];
const CODE = ["linkelés: .data VMA = 0x20000000 (sh_addr), LMA = 0x1d0 (LOAD PhysAddr)", "QEMU -kernel: a LOAD szegmens FileSiz bájtja a PhysAddr címre (flash-kép)", "    ldr r0, =_sidata; ldr r1, =_sdata; ldr r2, =_edata", "1:  cmp r1, r2; bhs 2f; ldr r3, [r0], #4; str r3, [r1], #4; b 1b", "2:  ldr r1, =_sbss; ldr r2, =_ebss; movs r3, #0", "3:  cmp r1, r2; bhs 4f; str r3, [r1], #4; b 3b"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const INIT = [3665428480, 3665428481, 3665428482, 3665428483, 3665428484];
function render(s){
  svg.setAttribute("viewBox","0 0 640 330");
  svg.innerHTML = "";
  const ln = css("--line"), hl = css("--hl2");
  const hx = v => "0x"+v.toString(16).padStart(8,"0");
  el("text",{x:110,y:20,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"FLASH (LMA)");
  el("text",{x:420,y:20,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"RAM (VMA)");
  for (let k=0;k<5;k++){
    const y = 40+k*24, a = 0x1d0+4*k;
    el("rect",{x:60,y:y,width:100,height:22,fill:css("--cellhl"),stroke:ln,"stroke-width":(s.ph===3&&s.nc===k+1)?3:1});
    el("text",{x:110,y:y+15,"text-anchor":"middle","font-size":11,style:"font-family:ui-monospace,monospace"},INIT[k].toString(16));
    el("text",{x:55,y:y+15,"text-anchor":"end","font-size":11,style:"font-family:ui-monospace,monospace"},"0x"+a.toString(16));
  }
  el("text",{x:110,y:172,"text-anchor":"middle","font-size":11},".data betöltési kép (_sidata)");
  for (let k=0;k<10;k++){
    const y = 40+k*24, a = 0x20000000+4*k, isData = k<5;
    let txt, fill = css("--cell");
    if (s.ph<2) txt = "–";
    else if (isData && s.nc>k) { txt = INIT[k].toString(16); fill = css("--cellhl"); }
    else if (!isData && s.nz>k-5) { txt = "00000000"; }
    else txt = "?";
    const cur = (isData && s.ph===3 && s.nc===k+1) || (!isData && s.ph===4 && s.nz===k-4);
    el("rect",{x:370,y:y,width:100,height:22,fill:fill,stroke:cur?hl:ln,"stroke-width":cur?3:1,
       "stroke-dasharray":isData?"none":"4 3"});
    el("text",{x:420,y:y+15,"text-anchor":"middle","font-size":11,style:"font-family:ui-monospace,monospace"},txt);
    el("text",{x:365,y:y+15,"text-anchor":"end","font-size":11,style:"font-family:ui-monospace,monospace"},hx(a));
  }
  [["_sdata",0],["_edata = _sbss",5],["_ebss",10]].forEach(p=>{
    const y = 40+p[1]*24;
    el("line",{x1:470,y1:y,x2:500,y2:y,stroke:ln});
    el("text",{x:504,y:y+4,"font-size":11},p[0]);
  });
  if (s.ph===3){
    const yf = 51+(s.nc-1)*24, yr = 51+(s.nc-1)*24;
    el("line",{x1:160,y1:yf,x2:368,y2:yr,stroke:hl,"stroke-width":2.5,"marker-end":""});
    el("text",{x:235,y:yf-6,"text-anchor":"middle","font-size":11,fill:hl},"másolás");
  }
  const F = {sh:".data sh_addr = 0x20000000 (VMA)", load:"LOAD: PhysAddr 0x000001d0, FileSiz 0x14, MemSiz 0x28",
             data:"_sidata = LOADADDR(.data) = 0x1d0 → _sdata…_edata", bss:".bss: NOBITS, _sbss…_ebss (MemSiz − FileSiz)"};
  el("text",{x:20,y:300,"font-size":12,"font-weight":"bold"},"ELF-mező: "+F[s.hl]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
