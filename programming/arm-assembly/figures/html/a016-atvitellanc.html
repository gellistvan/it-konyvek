<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Átvitellánc és NZCV</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = 0x<input id="ia" value="ffffffff" size="9" style="font-family:monospace"></label><label>b = 0x<input id="ib" value="00000001" size="9" style="font-family:monospace"></label><label><select id="op"><option value="adds">ADDS</option><option value="subs">SUBS</option></select></label><button type="button" onclick="loadCase()">Betöltés</button><span>Előbeállítás:</span><button type="button" onclick="preset('00000001','00000001','adds')">1+1</button><button type="button" onclick="preset('ffffffff','00000001','adds')">0xffffffff+1</button><button type="button" onclick="preset('7fffffff','00000001','adds')">0x7fffffff+1</button><button type="button" onclick="preset('80000000','80000000','adds')">0x80000000+0x80000000</button><button type="button" onclick="preset('80000000','ffffffff','adds')">1. feladat</button><button type="button" onclick="preset('00000000','00000001','subs')">0 − 1</button><button type="button" onclick="preset('00000000','00000000','subs')">0 − 0</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="32 bites összeadás bitcellákkal; az átvitel bitenként halad, a végén az NZCV és az MRS-érték."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A bitenkénti modell eredményét a fejezet eseteire unicorn ADDS/SUBS + MRS NZCV futtatással vetettük össze (0b0000, 0b0110, 0b1001, 0b0111, 0b0011; SUBS 0−1: 0b1000, 0−0: 0b0110). Kitöltött négyzet = 1. Az oszlopok jobbról balra: 0. … 31. bit.</p>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){

  svg.innerHTML = "";

function rippleSteps(a,b,op){
  a=a>>>0; b=b>>>0;
  const bb = op==="subs" ? (~b)>>>0 : b;
  const c=[op==="subs"?1:0], r=[], out=[];
  const hx=v=>"0x"+(v>>>0).toString(16).padStart(8,"0");
  out.push({msg:`${op.toUpperCase()} W2, W0, W1 — a = ${hx(a)}, b = ${hx(b)}`+(op==="subs"?` → összeadóba NOT(b) = ${hx(bb)}, c0 = 1`:", c0 = 0")+". Lépés ▶: bitenként halad az átvitel.",line:0,a:a,b:bb,c:c.slice(),r:[],k:-1,op:op});
  for(let i=0;i<32;i++){
    const ai=(a>>>i)&1, bi=(bb>>>i)&1, s=ai+bi+c[i];
    r.push(s&1); c.push(s>>1);
    out.push({msg:`bit ${i}: a=${ai}, b=${bi}, c_${i}=${c[i]} → r_${i}=${s&1}, c_${i+1}=${s>>1}`,line:1,a:a,b:bb,c:c.slice(),r:r.slice(),k:i,op:op});
  }
  let rv=0; for(let i=31;i>=0;i--) rv=((rv<<1)|r[i])>>>0;
  const N=r[31], Z=+(rv===0), C=c[32], V=c[31]^c[32], nz=""+N+Z+C+V;
  out.push({msg:`Eredmény ${hx(rv)}; N = r31 = ${N}, Z = ${Z}, C = c32 = ${C}`+(op==="subs"?(C?" (nincs kölcsönzés)":" (kölcsönzés)"):"")+`, V = c31 ⊕ c32 = ${c[31]} ⊕ ${c[32]} = ${V}; NZCV = 0b${nz}; MRS X11, NZCV → 0x${(parseInt(nz,2)*0x10000000).toString(16).padStart(8,"0")}`,line:2,a:a,b:bb,c:c.slice(),r:r.slice(),k:32,op:op,fin:{N,Z,C,V,nz,rv}});
  return out;
}

function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 730 250");
  const fg=css("--fg"), hl=css("--hl"), W=19, X0=670;
  const defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
  defs.innerHTML=`<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`;
  [["a",40],["b'",64],["c",88],["r",112]].forEach(([l,y])=>el("text",{x:X0+W+14,y:y+13,"font-size":12},l));
  for(let i=0;i<32;i++){
    const x=X0-i*W, cur=i===s.k;
    if(cur) el("rect",{x:x-2,y:22,width:W,height:118,fill:css("--cellhl"),stroke:hl,"stroke-width":2});
    if(i%4===0||i===31) el("text",{x:x+W/2-1,y:18,"text-anchor":"middle","font-size":10,fill:css("--muted")},String(i));
    const vals=[(s.a>>>i)&1,(s.b>>>i)&1, i<s.c.length?s.c[i]:null, i<s.r.length?s.r[i]:null];
    vals.forEach((v,k)=>{ const y=40+k*24;
      el("rect",{x:x,y:y,width:W-4,height:W-4,fill:v===1?fg:css("--cell"),stroke:fg,"stroke-width":v===null?0.4:1,"stroke-dasharray":v===null?"2 2":""});
    });
  }
  // kimenő átvitel és jelzők
  const done=s.k>=32;
  const c32 = s.c.length>32 ? s.c[32] : null, c31 = s.c.length>31 ? s.c[31] : null;
  el("text",{x:2,y:100,"font-size":12},"c32 →");
  el("rect",{x:42,y:86,width:15,height:15,fill:c32===1?fg:css("--cell"),stroke:fg,"stroke-dasharray":c32===null?"2 2":""});
  const f=s.fin;
  const y=170;
  [["N","r31",f&&f.N],["Z","NOR(r)",f&&f.Z],["C","c32",f&&f.C],["V","c31⊕c32",f&&f.V]].forEach(([n,src,v],i)=>{
    const x=120+i*120;
    el("rect",{x:x,y:y,width:44,height:36,fill:v===1?fg:css("--cell"),stroke:fg,"stroke-width":done?2:1});
    el("text",{x:x+22,y:y+24,"text-anchor":"middle","font-size":16,"font-weight":"bold",fill:v===1?css("--bg"):fg},done?String(v):"?");
    el("text",{x:x+52,y:y+14,"font-size":12},n);
    el("text",{x:x+52,y:y+30,"font-size":11,fill:css("--muted")},"= "+src);
  });
  el("text",{x:120,y:236,"font-size":13},done?`NZCV = 0b${f.nz}   MRS X11, NZCV → 0x${(parseInt(f.nz,2)*0x10000000).toString(16).padStart(8,"0")}`:(c31!==null?`c31 = ${c31}`:""));
}
function loadCase(){
  const a=parseInt(document.getElementById("ia").value,16), b=parseInt(document.getElementById("ib").value,16);
  const op=document.getElementById("op").value;
  if(!(a>=0&&a<=0xffffffff&&b>=0&&b<=0xffffffff)){status.textContent="Hibás bemenet: 32 bites hexa értéket adj meg.";return;}
  setSteps(rippleSteps(a,b,op));
}
function preset(a,b,op){document.getElementById("ia").value=a;document.getElementById("ib").value=b;document.getElementById("op").value=op;loadCase();}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
