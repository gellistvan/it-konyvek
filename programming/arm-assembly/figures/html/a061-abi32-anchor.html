<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab_abi_call32 horgonyos SP-visszaállítása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Hívott:</span><label><input type="radio" name="bad" value="4" checked onchange="setSteps(STEPS4)"> bad_sp4</label><label><input type="radio" name="bad" value="8" onchange="setSteps(STEPS8)"> bad_sp8</label><script>const STEPS4 = [{"msg": "Kezdet: SP = S (a lab_abi32_outer belépési SP-je).", "sp": 0, "mask": -1, "upto": 0, "line": -1, "sh": 4, "anchor": 0}, {"msg": "(1) lab_abi32_outer: push {r4-r11, lr} (9 szó, S−36…S−4) + sub sp, sp, #4 → SP = S−40; a saját SP-jét a keret aljára (S−40) írja.", "sp": -40, "mask": -1, "upto": 1, "line": 0, "sh": 4, "anchor": 0}, {"msg": "(2) lab_abi_call32: push {r3-r11, lr} (10 szó, S−80…S−44; a legalsó a mentett r3 = &result); a horgonyba S−80 kerül.", "sp": -80, "mask": -1, "upto": 2, "line": 1, "sh": 4, "anchor": 1}, {"msg": "(3) lab_t32_bad_sp4: sub sp, sp, #4 → SP = S−84, majd bx lr: szabályos visszatérés, de eltolt SP-vel.", "sp": -84, "mask": 0, "upto": 3, "line": 2, "sh": 4, "anchor": 1}, {"msg": "(4) ellenőrzés: SP (S−84) ≠ horgony (S−80) → bit 8: maszk = 0x00000100.", "sp": -84, "mask": 256, "upto": 3, "line": 3, "sh": 4, "anchor": 1}, {"msg": "(5) mov sp, r3 → SP = S−80 (a horgonyból); a horgony újra 0.", "sp": -80, "mask": 256, "upto": 3, "line": 4, "sh": 4, "anchor": 2}, {"msg": "(5) ldr r3, [sp] = &result; *result = 3; pop {r3-r11, pc} az S−80…S−44 szavakról: PC ← a mentett lr. A hívó mintái épek, a maszk 0x00000100. Korábbi változat: a pop az S−84 címről indult volna, PC ← 0x1b1b1b1b (→ 0x1b1b1b1a), fault.", "sp": -80, "mask": 256, "upto": 3, "line": 5, "sh": 4, "anchor": 2, "pop": 1, "oldpc": "0x1b1b1b1a"}]; const STEPS8 = [{"msg": "Kezdet: SP = S (a lab_abi32_outer belépési SP-je).", "sp": 0, "mask": -1, "upto": 0, "line": -1, "sh": 8, "anchor": 0}, {"msg": "(1) lab_abi32_outer: push {r4-r11, lr} (9 szó, S−36…S−4) + sub sp, sp, #4 → SP = S−40; a saját SP-jét a keret aljára (S−40) írja.", "sp": -40, "mask": -1, "upto": 1, "line": 0, "sh": 8, "anchor": 0}, {"msg": "(2) lab_abi_call32: push {r3-r11, lr} (10 szó, S−80…S−44; a legalsó a mentett r3 = &result); a horgonyba S−80 kerül.", "sp": -80, "mask": -1, "upto": 2, "line": 1, "sh": 8, "anchor": 1}, {"msg": "(3) lab_t32_bad_sp8: sub sp, sp, #8 → SP = S−88, majd bx lr: szabályos visszatérés, de eltolt SP-vel.", "sp": -88, "mask": 0, "upto": 3, "line": 2, "sh": 8, "anchor": 1}, {"msg": "(4) ellenőrzés: SP (S−88) ≠ horgony (S−80) → bit 8: maszk = 0x00000100.", "sp": -88, "mask": 256, "upto": 3, "line": 3, "sh": 8, "anchor": 1}, {"msg": "(5) mov sp, r3 → SP = S−80 (a horgonyból); a horgony újra 0.", "sp": -80, "mask": 256, "upto": 3, "line": 4, "sh": 8, "anchor": 2}, {"msg": "(5) ldr r3, [sp] = &result; *result = 3; pop {r3-r11, pc} az S−80…S−44 szavakról: PC ← a mentett lr. A hívó mintái épek, a maszk 0x00000100. Korábbi változat: a pop az S−88 címről indult volna, PC ← 0x1a1a1a1a, fault.", "sp": -80, "mask": 256, "upto": 3, "line": 5, "sh": 8, "anchor": 2, "pop": 1, "oldpc": "0x1a1a1a1a"}];</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Veremábra: a teszthívó a hívás előtti SP-t statikus horgonyba menti, a 4 bájttal eltolt SP-t onnan állítja vissza; a régi változat a sérült SP-ről a hívó r11-mintáját töltötte a PC-be."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az S a lab_abi32_outer belépési SP-je; minden cím ehhez viszonyított. Az értékek a tools/pair forrásainak emulált futásából (keystone + unicorn, Thumb, M-profil) származnak; a korábbi változat ugyanez a kód a mov sp, r3 nélkül.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: SP = S (a lab_abi32_outer belépési SP-je).", "sp": 0, "mask": -1, "upto": 0, "line": -1, "sh": 4, "anchor": 0}, {"msg": "(1) lab_abi32_outer: push {r4-r11, lr} (9 szó, S−36…S−4) + sub sp, sp, #4 → SP = S−40; a saját SP-jét a keret aljára (S−40) írja.", "sp": -40, "mask": -1, "upto": 1, "line": 0, "sh": 4, "anchor": 0}, {"msg": "(2) lab_abi_call32: push {r3-r11, lr} (10 szó, S−80…S−44; a legalsó a mentett r3 = &result); a horgonyba S−80 kerül.", "sp": -80, "mask": -1, "upto": 2, "line": 1, "sh": 4, "anchor": 1}, {"msg": "(3) lab_t32_bad_sp4: sub sp, sp, #4 → SP = S−84, majd bx lr: szabályos visszatérés, de eltolt SP-vel.", "sp": -84, "mask": 0, "upto": 3, "line": 2, "sh": 4, "anchor": 1}, {"msg": "(4) ellenőrzés: SP (S−84) ≠ horgony (S−80) → bit 8: maszk = 0x00000100.", "sp": -84, "mask": 256, "upto": 3, "line": 3, "sh": 4, "anchor": 1}, {"msg": "(5) mov sp, r3 → SP = S−80 (a horgonyból); a horgony újra 0.", "sp": -80, "mask": 256, "upto": 3, "line": 4, "sh": 4, "anchor": 2}, {"msg": "(5) ldr r3, [sp] = &result; *result = 3; pop {r3-r11, pc} az S−80…S−44 szavakról: PC ← a mentett lr. A hívó mintái épek, a maszk 0x00000100. Korábbi változat: a pop az S−84 címről indult volna, PC ← 0x1b1b1b1b (→ 0x1b1b1b1a), fault.", "sp": -80, "mask": 256, "upto": 3, "line": 5, "sh": 4, "anchor": 2, "pop": 1, "oldpc": "0x1b1b1b1a"}];
const CODE = ["lab_abi32_outer: push {r4-r11, lr}; sub sp, sp, #4; str sp, [sp]", "lab_abi_call32:  push {r3-r11, lr}; str sp -> lab_abi32_sp (horgony)", "                 blx r12            @ hívott: sub sp, sp, #N; bx lr", "                 cmp sp, horgony; it ne; orrne r2, #(1 << 8)", "                 mov sp, r3         @ SP a horgonyból", "                 ldr r3, [sp]; str r0, [r3]; pop {r3-r11, pc}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PATV = {"r4": "0x14141414", "r5": "0x15151515", "r6": "0x16161616", "r7": "0x17171717", "r8": "0x18181818", "r9": "0x19191919", "r10": "0x1A1A1A1A", "r11": "0x1B1B1B1B"};
function render(s){
  svg.setAttribute("viewBox","0 0 640 380");
  svg.innerHTML = "";
  const R = 14, Y0 = 40;                 // 1 szó = 14 px, S a Y0-nál
  const Y = off => Y0 + (-off) / 4 * R;  // a szó felső éle: off+4 -> Y(off+4)
  const ln = css("--line"), fg = css("--fg");
  const X = 140, W = 190;
  el("text",{x:X+W/2,y:24,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"verem (1 szó = 4 bájt)");
  const words = [];
  const outer = ["saját SP","r4","r5","r6","r7","r8","r9","r10","r11","lr"];
  outer.forEach((r,i)=>words.push({off:-40+4*i,name:"outer: "+r,val:i==0?"S−40":(i<9?PATV[r]:"→ C"),grp:1}));
  const call = ["r3","r4","r5","r6","r7","r8","r9","r10","r11","lr"];
  call.forEach((r,i)=>words.push({off:-80+4*i,name:"call32: "+r,val:i==0?"&result":(i<9?PATV[r]:"→ outer"),grp:2}));
  for (let o=-84;o>=-80-s.sh;o-=4) words.push({off:o,name:"(nem írt)",val:"?",grp:3});
  words.forEach(w=>{
    const vis = (w.grp==1 && s.upto>=1) || (w.grp==2 && s.upto>=2) || (w.grp==3 && s.upto>=3);
    const inPop = s.pop && w.grp==2;
    el("rect",{x:X,y:Y(w.off+4),width:W,height:R,fill:inPop?css("--cellhl"):css("--cell"),stroke:ln,
       "stroke-width":w.grp==2&&vis?1.6:0.7,"stroke-dasharray":w.grp==3?"3 2":"none"});
    if (vis){
      el("text",{x:X+4,y:Y(w.off+4)+11,"font-size":10},w.name);
      el("text",{x:X+W-4,y:Y(w.off+4)+11,"font-size":10,"text-anchor":"end",style:"font-family:ui-monospace,monospace"},w.val);
    }
    if (w.off%20==0 || w.off<-80) el("text",{x:X-6,y:Y(w.off+4)+11,"font-size":10,"text-anchor":"end",fill:css("--muted")},"S−"+(-w.off));
  });
  el("text",{x:X-6,y:Y(0)+4,"font-size":10,"text-anchor":"end","font-weight":"bold"},"S");
  // SP-mutató
  const ys = Y(s.sp);
  el("line",{x1:X+W+4,y1:ys,x2:X+W+44,y2:ys,stroke:css("--hl2"),"stroke-width":3});
  el("text",{x:X+W+48,y:ys+4,"font-size":12,fill:css("--hl2"),"font-weight":"bold"},"SP = "+(s.sp?"S−"+(-s.sp):"S"));
  // horgony
  el("rect",{x:420,y:250,width:180,height:42,fill:css("--cell"),stroke:ln,"stroke-width":s.anchor==1?3:1.2});
  el("text",{x:510,y:268,"text-anchor":"middle","font-size":11},"lab_abi32_sp (.bss)");
  el("text",{x:510,y:285,"text-anchor":"middle","font-size":12,"font-weight":"bold"},s.anchor==1?"S−80":"0 (szabad)");
  // maszk
  el("text",{x:420,y:320,"font-size":12},"maszk (r2): "+(s.mask<0?"–":"0x"+s.mask.toString(16).padStart(8,"0")));
  if (s.pop){
    el("text",{x:420,y:345,"font-size":11},"pop: S−80…S−44 → PC ← lr");
    el("text",{x:420,y:365,"font-size":11,fill:css("--hl2")},"korábbi: S−"+(80+s.sh)+" … → PC = "+s.oldpc);
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
