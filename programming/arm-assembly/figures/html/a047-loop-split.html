<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fő ciklus és maradék</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>n <input type="range" id="n" min="0" max="40" value="17" style="width:200px"></label> <b id="nv" class="mono"></b>
 <label><input type="checkbox" id="lsl" checked> lsl x5, x5, #2 megvan</label>
 <label><input type="checkbox" id="cbz" checked> cbz x5 megvan</label>
</div>
<div class="ctl" role="group" aria-label="Léptetés">
 <button id="first">⏮</button><button id="prev">◀ Iteráció</button><button id="play">▶ Lejátszás</button><button id="next">Iteráció ▶</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite" class="mono"></div>
<svg id="v" viewBox="0 0 760 150" role="img" aria-label="A c tömb elemei: vektorosan vagy skalárisan készültek, túlírás"></svg>
<pre class="code" id="code" aria-label="add_i32_neon"></pre>
<p class="small" id="self"></p>

<p class="small">Kezdőállapot: n = 17, helyes kód, a futás vége (46 utasítás). Az lsl x5 kikapcsolásával 105 utasítás, 4 + 13 elem. A cbz x5 törlésével n < 4-re a fő ciklus egyszer lefut, és a c tömbön túl is ír. Utasításszám ret-tel, determinisztikus számlálás (nem időmérés).</p>

const svgV = $("v");
$("code").innerHTML = SRC.map(l => "<span>" + l + "</span>").join("");
function model(n, lsl, cbz){
  let x4 = 0; const x5 = lsl ? (n >> 2) << 2 : n >> 2; let cnt = 2 + (+lsl) + (+cbz);
  const st = [{kind: "start", elems: [], x4, x5, cnt}];
  if (!(cbz && x5 === 0)) { do { cnt += 8; st.push({kind: "v", elems: [x4, x4 + 1, x4 + 2, x4 + 3], x4: x4 + 4, x5, cnt}); x4 += 4; } while (x4 < x5); }
  cnt += 2;
  while (x4 < n) { cnt += 7; st.push({kind: "s", elems: [x4], x4: x4 + 1, x5, cnt}); x4 += 1; }
  cnt += 1; st.push({kind: "end", elems: [], x4, x5, cnt}); return st; }
let ok = true;
Object.entries(DATA.res).forEach(([key, rows]) => rows.forEach((r, n) => { const st = model(n, key[0] === "1", key[1] === "1");
  const all = k => st.filter(s => s.kind === k).flatMap(s => s.elems);
  const v = all("v"), s = all("s");
  if (st[st.length - 1].cnt !== r.count || v.filter(e => e < n).length !== r.vec || s.filter(e => e < n).length !== r.sca || v.concat(s).filter(e => e >= n).length !== r.over) ok = false; }));
$("self").textContent = "Önellenőrzés (a lap modellje vs. unicorn, n = 0…40, mind a négy változat): " + (ok ? "OK" : "ELTÉRÉS");

    if (CW > 16 || e % 4 === 0) mk(svgV, "text", {x: X0 + e * CW + CW / 2, y: 100, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(e)); }
  if (len > N) mk(svgV, "text", {x: X0 + N * CW + 2, y: 30, "font-size": 12, "font-weight": "bold", fill: css("--bad")}, "túlírás a c után ▼");

  $("cnt").textContent = cur + "/" + (steps.length - 1);
  const label = {start: "belépés", v: "fő ciklus-iteráció", s: "skaláris iteráció", end: "ret"}[s.kind];
  $("status").textContent = label + ": x3 = " + N + ", x4 = " + s.x4 + ", x5 = " + s.x5 + " | utasítások eddig: " + s.cnt + (s.kind === "v" ? " | kilépés? " + s.x4 + " < " + s.x5 + " → " + (s.x4 < s.x5 ? "igaz, újra" : "hamis") : "");
  $("code").querySelectorAll("span").forEach((e, i) => e.classList.toggle("on", i === LINES[s.kind]));
}
function stop(){ if (tm) { clearInterval(tm); tm = null; } $("play").textContent = "▶ Lejátszás"; }
function rebuild(){ stop(); N = +$("n").value; $("nv").textContent = N; steps = model(N, $("lsl").checked, $("cbz").checked); cur = steps.length - 1; draw(); }
["n", "lsl", "cbz"].forEach(id => $(id).addEventListener("input", rebuild));
$("first").onclick = () => { stop(); cur = 0; draw(); };
$("prev").onclick = () => { stop(); cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { stop(); cur = Math.min(steps.length - 1, cur + 1); draw(); };
$("play").onclick = () => { if (tm) { stop(); return; } if (cur >= steps.length - 1) cur = 0; $("play").textContent = "⏸ Szünet";
  tm = setInterval(() => { if (cur >= steps.length - 1) stop(); else { cur++; draw(); } }, 500); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
rebuild();
