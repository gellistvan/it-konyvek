<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane-állapotok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl">
 <label>program <select id="prog"><option value="swapends">lab_swapends</option><option value="rev4_bug">lab_rev4 – hibás</option><option value="rev4_fix">lab_rev4 – javított</option></select></label>
 <label>src <input type="text" id="src" value="1, 2, 3, 4" spellcheck="false" style="width:10em"></label>
 <button id="load">Betölt</button>
</div>
<div class="ctl" role="group" aria-label="Léptetés">
 <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 170" role="img" aria-label="V0, V1 és dst négy lane-je"></svg>
<pre class="code" id="code" aria-label="Kód"></pre>
<p class="small" id="self"></p>

<p class="small">A src értékei float32-re kerülnek. A lane-ek 0-tól 3-ig balról jobbra (a tömb sorrendjében). A kódok a fejezet asm-blokkjai; a lap modellje az emulátor (unicorn) nyomaival egyezik.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"progs": {"swapends": ["ld1     {v0.4s}, [x1]", "mov     v1.16b, v0.16b", "ins     v1.s[0], v0.s[3]", "ins     v1.s[3], v0.s[0]", "st1     {v1.4s}, [x0]"], "rev4_bug": ["ld1     {v0.2s}, [x1]", "mov     v1.16b, v0.16b", "ins     v1.s[0], v0.s[1]", "ins     v1.s[1], v0.s[0]", "st1     {v1.4s}, [x0]"], "rev4_fix": ["ld1     {v0.4s}, [x1]", "rev64   v0.4s, v0.4s", "ext     v0.16b, v0.16b, v0.16b, #8", "st1     {v0.4s}, [x0]"]}, "traces": {"1,2,3,4": {"swapends": [{"line": 0, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [1.0, 2.0, 3.0, 4.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 4.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 1.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [4.0, 2.0, 3.0, 1.0], "dst": [4.0, 2.0, 3.0, 1.0]}], "rev4_bug": [{"line": 0, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [1.0, 2.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 2.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 1.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [1.0, 2.0, 0.0, 0.0], "v1": [2.0, 1.0, 0.0, 0.0], "dst": [2.0, 1.0, 0.0, 0.0]}], "rev4_fix": [{"line": 0, "v0": [1.0, 2.0, 3.0, 4.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [2.0, 1.0, 4.0, 3.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [4.0, 3.0, 2.0, 1.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [4.0, 3.0, 2.0, 1.0], "v1": [null, null, null, null], "dst": [4.0, 3.0, 2.0, 1.0]}]}, "5,6,7,8": {"swapends": [{"line": 0, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [5.0, 6.0, 7.0, 8.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 8.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 5.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [8.0, 6.0, 7.0, 5.0], "dst": [8.0, 6.0, 7.0, 5.0]}], "rev4_bug": [{"line": 0, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [5.0, 6.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 6.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 5.0, 0.0, 0.0], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 4, "v0": [5.0, 6.0, 0.0, 0.0], "v1": [6.0, 5.0, 0.0, 0.0], "dst": [6.0, 5.0, 0.0, 0.0]}], "rev4_fix": [{"line": 0, "v0": [5.0, 6.0, 7.0, 8.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 1, "v0": [6.0, 5.0, 8.0, 7.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 2, "v0": [8.0, 7.0, 6.0, 5.0], "v1": [null, null, null, null], "dst": [0.0, 0.0, 0.0, 0.0]}, {"line": 3, "v0": [8.0, 7.0, 6.0, 5.0], "v1": [null, null, null, null], "dst": [8.0, 7.0, 6.0, 5.0]}]}}, "mem": "0000803f000000400000404000008040", "ld1": {"4s": "4080000040400000400000003f800000", "2s": "0000000000000000400000003f800000"}};

const P = DATA.progs; let prog = "swapends", src = [1, 2, 3, 4], states = [], cur = 0;
const svgV = $("v");
function effect(ins){ ins = ins.split(/\s+/).join(" ");
  if (ins.startsWith("ld1") && ins.includes(".2s")) return {v0: [[0, 1], [2, 3]]};
  if (ins.startsWith("ld1")) return {v0: [[0, 1, 2, 3], []]};
  if (ins.startsWith("st1")) return {dst: [[0, 1, 2, 3], []]};
  let m = ins.match(/^ins (v\d)\.s\[(\d)\]/); if (m) return {[m[1]]: [[+m[2]], []]};
  m = ins.match(/^(?:mov|rev64|ext) (v\d)/); return {[m[1]]: [[0, 1, 2, 3], []]}; }
function exec(lines, s){
  let v = {v0: [null, null, null, null], v1: [null, null, null, null]}, dst = [0, 0, 0, 0]; const out = [];
  lines.forEach(l => { const t = l.split(/\s+/).join(" ");
    if (t.startsWith("ld1") && t.includes(".2s")) v.v0 = [s[0], s[1], 0, 0];
    else if (t.startsWith("ld1")) v.v0 = s.slice();
    else if (t.startsWith("mov v1.16b, v0.16b")) v.v1 = v.v0.slice();
    else if (t.startsWith("ins")) { const m = t.match(/ins (v\d)\.s\[(\d)\], (v\d)\.s\[(\d)\]/); const nv = v[m[1]].slice(); nv[+m[2]] = v[m[3]][+m[4]]; v[m[1]] = nv; }
    else if (t.startsWith("rev64")) { const a = v.v0; v.v0 = [a[1], a[0], a[3], a[2]]; }
    else if (t.startsWith("ext")) { const a = v.v0; v.v0 = [a[2], a[3], a[0], a[1]]; }
    else if (t.startsWith("st1")) { const m = t.match(/\{(v\d)/); dst = v[m[1]].map(x => x === null ? NaN : x); }
    out.push({v0: v.v0.slice(), v1: v.v1.slice(), dst: dst.slice()}); });
  return out; }
// önellenőrzés: a lap modellje = unicorn-nyom (két bemenet, három program)
let ok = true;
Object.entries(DATA.traces).forEach(([k, tr]) => { const s = k.split(",").map(Number);
  Object.keys(P).forEach(p => exec(P[p], s).forEach((st, i) => ["v0", "v1", "dst"].forEach(r => st[r].forEach((x, j) => { if (x !== tr[p][i][r][j]) ok = false; })))); });
$("self").textContent = "Önellenőrzés (a lap modellje vs. unicorn-nyom, src = {1,2,3,4} és {5,6,7,8}): " + (ok ? "OK" : "ELTÉRÉS");
function fmt(x){ return x === null ? "?" : (Number.isNaN(x) ? "?" : String(x).replace(".", ",")); }
function draw(){
  svgV.innerHTML = "";
  const L = P[prog], st = cur ? states[cur - 1] : {v0: [null, null, null, null], v1: [null, null, null, null], dst: [0, 0, 0, 0]};
  const eff = cur ? effect(L[cur - 1]) : {};
  [["v0", "V0"], ["v1", "V1"], ["dst", "dst[0..3]"]].forEach(([r, nm], ri) => {
    const x0 = 20 + ri * 250, [wr, zr] = eff[r] || [[], []];
    mk(svgV, "text", {x: x0, y: 30, "font-weight": "bold"}, nm);
    for (let k = 0; k < 4; k++) { const z = zr.includes(k), w = wr.includes(k);
      mk(svgV, "rect", {x: x0 + k * 52, y: 50, width: 50, height: 46, fill: z ? css("--cell2") : css("--cell"), stroke: w ? css("--hl") : css("--line"), "stroke-width": w ? 4 : 1});
      if (z) mk(svgV, "path", {d: "M" + (x0 + k * 52) + " 50 l50 46 M" + (x0 + k * 52 + 50) + " 50 l-50 46", stroke: css("--muted")});
      mk(svgV, "text", {x: x0 + k * 52 + 25, y: 80, "text-anchor": "middle", class: "mono", "font-size": 17, "font-weight": w ? "bold" : "normal"}, fmt(st[r][k]));
      mk(svgV, "text", {x: x0 + k * 52 + 25, y: 115, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, (r === "dst" ? "[" + k + "]" : "lane " + k)); }
  });
  mk(svgV, "text", {x: 20, y: 150, "font-size": 12, fill: css("--muted")}, "vastag kék keret: most írt lane; áthúzott: nullázott lane; ?: ismeretlen kezdeti tartalom");
  $("cnt").textContent = cur + "/" + L.length;
  $("status").textContent = cur === 0 ? "Kezdőállapot: src = {" + src.join(", ") + "}, dst = {0, 0, 0, 0}." : L[cur - 1].split(/\s+/).join(" ") + " → V0 = {" + st.v0.map(fmt).join(", ") + "}, V1 = {" + st.v1.map(fmt).join(", ") + "}, dst = {" + st.dst.map(fmt).join(", ") + "}";
  $("code").querySelectorAll("span").forEach((e, i) => e.classList.toggle("on", i === cur - 1));
}
function load(){
  const s = $("src").value.split(/[;,\s]+/).filter(x => x).map(x => Math.fround(Number(x.replace(",", "."))));
  if (s.length !== 4 || s.some(x => !isFinite(x))) { $("status").textContent = "Négy számot adj meg (pl. 1, 2, 3, 4)."; return; }
  src = s; prog = $("prog").value; states = exec(P[prog], src); cur = 0;
  $("code").innerHTML = P[prog].map(l => "<span>" + l + "</span>").join("") + "<span>ret</span>";
  draw(); }
$("load").onclick = load; $("prog").onchange = load;
$("src").addEventListener("keydown", e => { if (e.key === "Enter") load(); });
$("first").onclick = () => { cur = 0; draw(); };
$("prev").onclick = () => { cur = Math.max(0, cur - 1); draw(); };
$("next").onclick = () => { cur = Math.min(P[prog].length, cur + 1); draw(); };
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") $("next").onclick(); if (e.key === "ArrowLeft") $("prev").onclick(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
load();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
