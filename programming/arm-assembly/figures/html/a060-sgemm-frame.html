<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab_sgemm kerete és a keret-határ szerződés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="offs">(b) offset: <b id="offv">24</b></label><input id="offs" type="range" min="0" max="32" step="8" value="24" aria-label="A második panel stp-offsetje" oninput="OFFV=+this.value;document.getElementById('offv').textContent=this.value;show(k);document.getElementById('res').textContent=OFFV+' + 16 ≤ 32: '+(P2[OFFV].ok?'igaz, ':'hamis, ')+P2[OFFV].msg;"><span id="res" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Veremábra: öt mentési pár SP0−80 és SP0 között; mellette egy 32 bájtos keret, amelyben a [sp,#24]-re írt 16 bájt 8 bájttal a hívó keretébe nyúlik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az értékek a tools/zaro1/lab_sgemm.S prológusának és epilógusának emulált futásából (keystone + unicorn, AArch64) és a 15.4 audit-szkriptjének bájtalapú szerződéséből származnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Belépés: SP = SP0. A keret még nincs megnyitva; x19–x28 a hívó értékeit tartja.", "sp": 0, "cur": -1, "saved": [], "line": -1}, {"msg": "stp x19, x20, [sp, #−80]!: ír SP0−80 … SP0−64 (16 bájt); SP = SP0−80. A pre−indexelt alak előbb SP −= 80, aztán ír.", "sp": -80, "cur": 0, "saved": [0], "rd": 0, "line": 0}, {"msg": "stp x21, x22, [sp, #16]: ír SP0−64 … SP0−48 (16 bájt); SP = SP0−80.", "sp": -80, "cur": 1, "saved": [0, 1], "rd": 0, "line": 1}, {"msg": "stp x23, x24, [sp, #32]: ír SP0−48 … SP0−32 (16 bájt); SP = SP0−80.", "sp": -80, "cur": 2, "saved": [0, 1, 2], "rd": 0, "line": 2}, {"msg": "stp x25, x26, [sp, #48]: ír SP0−32 … SP0−16 (16 bájt); SP = SP0−80.", "sp": -80, "cur": 3, "saved": [0, 1, 2, 3], "rd": 0, "line": 3}, {"msg": "stp x27, x28, [sp, #64]: ír SP0−16 … SP0 (16 bájt); SP = SP0−80.", "sp": -80, "cur": 4, "saved": [0, 1, 2, 3, 4], "rd": 0, "line": 4}, {"msg": "ldp x19, x20, [sp]: olvas SP0−80 … SP0−64 – ugyanaz a sáv, amelyet a stp x19 … mentett.", "sp": -80, "cur": 0, "saved": [0, 1, 2, 3, 4], "rd": 1, "line": 5}, {"msg": "ldp x21, x22, [sp, #16]: olvas SP0−64 … SP0−48 – ugyanaz a sáv, amelyet a stp x21 … mentett.", "sp": -80, "cur": 1, "saved": [0, 1, 2, 3, 4], "rd": 1, "line": 6}, {"msg": "ldp x23, x24, [sp, #32]: olvas SP0−48 … SP0−32 – ugyanaz a sáv, amelyet a stp x23 … mentett.", "sp": -80, "cur": 2, "saved": [0, 1, 2, 3, 4], "rd": 1, "line": 7}, {"msg": "ldp x25, x26, [sp, #48]: olvas SP0−32 … SP0−16 – ugyanaz a sáv, amelyet a stp x25 … mentett.", "sp": -80, "cur": 3, "saved": [0, 1, 2, 3, 4], "rd": 1, "line": 8}, {"msg": "ldp x27, x28, [sp, #64]: olvas SP0−16 … SP0 – ugyanaz a sáv, amelyet a stp x27 … mentett.", "sp": -80, "cur": 4, "saved": [0, 1, 2, 3, 4], "rd": 1, "line": 9}, {"msg": "add sp, sp, #80: SP = SP0, a keret lezárva; minden mentett regiszter visszaállt.", "sp": 0, "cur": -1, "saved": [], "rd": 0, "line": 10}];
const CODE = ["stp x19, x20, [sp, #-80]!", "stp x21, x22, [sp, #16]", "stp x23, x24, [sp, #32]", "stp x25, x26, [sp, #48]", "stp x27, x28, [sp, #64]", "ldp x19, x20, [sp]", "ldp x21, x22, [sp, #16]", "ldp x23, x24, [sp, #32]", "ldp x25, x26, [sp, #48]", "ldp x27, x28, [sp, #64]", "add sp, sp, #80"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const P2 = {"0": {"off": 0, "lo": -32, "hi": -16, "ok": true, "msg": "PASS"}, "8": {"off": 8, "lo": -24, "hi": -8, "ok": true, "msg": "PASS"}, "16": {"off": 16, "lo": -16, "hi": 0, "ok": true, "msg": "PASS"}, "24": {"off": 24, "lo": -8, "hi": 8, "ok": false, "msg": "FAIL: iras a keret hatarain kivul: SP0-8, 16 bajt"}, "32": {"off": 32, "lo": 0, "hi": 16, "ok": false, "msg": "FAIL: iras a keret hatarain kivul: SP0+0, 16 bajt"}};
let OFFV = 24;
function render(s){
  svg.setAttribute("viewBox","0 0 640 330");
  svg.innerHTML = "";
  const Y = b => 60 + (16 - b) * 2.6;       // bájt -> y
  const fg = css("--fg"), ln = css("--line");
  el("text",{x:110,y:22,"text-anchor":"middle","font-size":14,"font-weight":"bold"},"(a) lab_sgemm kerete");
  el("rect",{x:60,y:Y(16),width:100,height:Y(0)-Y(16),fill:css("--cellhl"),stroke:ln});
  el("text",{x:110,y:(Y(16)+Y(0))/2+4,"text-anchor":"middle","font-size":11},"a hívó kerete");
  const PR = ["x19|x20","x21|x22","x23|x24","x25|x26","x27|x28"];
  for (let i=0;i<5;i++){
    const lo = -80 + 16*i, on = s.cur===i, has = s.saved.includes(i);
    el("rect",{x:60,y:Y(lo+16),width:100,height:Y(lo)-Y(lo+16),fill:on?css("--cellhl"):css("--cell"),
       stroke:ln,"stroke-width":on?3:1});
    el("text",{x:110,y:(Y(lo)+Y(lo+16))/2+4,"text-anchor":"middle","font-size":12,
       fill:has||on?fg:css("--muted")}, has||on ? PR[i].replace("|"," | ") : "(üres)");
    el("text",{x:55,y:Y(lo)+4,"text-anchor":"end","font-size":11},"SP0−"+(-lo));
  }
  el("text",{x:55,y:Y(0)+4,"text-anchor":"end","font-size":11,"font-weight":"bold"},"SP0");
  const ys = Y(s.sp);
  el("line",{x1:165,y1:ys,x2:200,y2:ys,stroke:css("--hl2"),"stroke-width":3});
  el("text",{x:204,y:ys+4,"font-size":12,fill:css("--hl2")},"SP = " + (s.sp ? "SP0−"+(-s.sp) : "SP0"));
  if (s.cur>=0) el("text",{x:110,y:Y(-80)+18,"text-anchor":"middle","font-size":11},
       s.rd ? "olvasás (ldp)" : "írás (stp)");
  // (b) panel
  const X = 400, p = P2[OFFV];
  el("text",{x:X+90,y:22,"text-anchor":"middle","font-size":14,"font-weight":"bold"},"(b) sub sp, sp, #32");
  el("rect",{x:X,y:Y(16),width:100,height:Y(0)-Y(16),fill:css("--cellhl"),stroke:ln});
  el("text",{x:X+50,y:(Y(16)+Y(0))/2+4,"text-anchor":"middle","font-size":11},"hívó");
  el("rect",{x:X,y:Y(0),width:100,height:Y(-32)-Y(0),fill:css("--cell"),stroke:ln,"stroke-width":3});
  [0,-8,-16,-24,-32].forEach(b=>el("text",{x:X-5,y:Y(b)+4,"text-anchor":"end","font-size":11},b? "SP0−"+(-b):"SP0"));
  const lo = p.lo, hi = p.hi, inHi = Math.min(hi,0);
  el("rect",{x:X+115,y:Y(inHi),width:40,height:Y(lo)-Y(inHi),fill:css("--cell"),stroke:fg,"stroke-width":2});
  if (hi>0) el("rect",{x:X+115,y:Y(hi),width:40,height:Y(Math.max(lo,0))-Y(hi),fill:css("--hl2"),
       stroke:fg,"stroke-dasharray":"4 3","fill-opacity":0.45});
  el("text",{x:X+135,y:Y(lo)+16,"text-anchor":"middle","font-size":11},"[sp, #"+OFFV+"]");
  el("text",{x:X+90,y:285,"text-anchor":"middle","font-size":12,"font-weight":"bold",
     fill:p.ok?fg:css("--hl2")}, OFFV+" + 16 ≤ 32: "+(p.ok?"igaz":"hamis"));
  el("text",{x:X+90,y:305,"text-anchor":"middle","font-size":11,
     fill:p.ok?fg:css("--hl2")}, p.msg);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
