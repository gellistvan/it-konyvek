<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-branch vezérlési gráfja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>X0 (előjeles) = <input id="ix0" value="7" size="8" style="font-family:monospace"></label><label>X2 = 0x<input id="ix2" value="1" size="17" style="font-family:monospace"></label><label><input type="checkbox" id="iw"> <code>cbnz w2</code> (3. feladat)</label><button type="button" onclick="loadIn()">Betöltés</button><span>Sorok:</span><button type="button" onclick="pre('7','1',false)">① 7/1</button><button type="button" onclick="pre('0','1',false)">② 0/1</button><button type="button" onclick="pre('-1','1',false)">③ −1/1</button><button type="button" onclick="pre('7','0',false)">④ 7/0</button><button type="button" onclick="pre('11','1',false)">⑤ 11/1</button><button type="button" onclick="pre('7','0000000100000000',false)">3. feladat: cbnz x2</button><button type="button" onclick="pre('7','0000000100000000',true)">3. feladat: cbnz w2</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy döntési pont, öt végállapot (0–4), mindegyik a külön objektumban lévő lab_exit-be ugrik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lépéssor modelljét a fejezet öt bemenetére és a 3. feladatra unicorn-futtatással vetettük össze (állapotok 0, 1, 2, 3, 4; 3. feladat: cbnz x2 → 0, cbnz w2 → 3). Dupla rombusz: NZCV-t olvasó B.cond; egyszeres: CBZ/CBNZ.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "start: X0 = 7, X2 = 0x0000000000000001, NZCV = ----", "line": 0, "node": "start", "path": ["start"]}, {"msg": "d_cbz: X0 = 7, X2 = 0x0000000000000001, NZCV = ----; következő PC: fall-through", "line": 1, "node": "d_cbz", "path": ["start", "d_cbz"]}, {"msg": "d_lt: X0 = 7, X2 = 0x0000000000000001, NZCV = 0010; következő PC: fall-through", "line": 2, "node": "d_lt", "path": ["start", "d_cbz", "d_lt"]}, {"msg": "d_gt: X0 = 7, X2 = 0x0000000000000001, NZCV = 1000; következő PC: fall-through", "line": 3, "node": "d_gt", "path": ["start", "d_cbz", "d_lt", "d_gt"]}, {"msg": "d_en: X0 = 7, X2 = 0x0000000000000001, NZCV = 1000; következő PC: taken", "line": 4, "node": "d_en", "path": ["start", "d_cbz", "d_lt", "d_gt", "d_en"]}, {"msg": "r0: X0 = 7, X2 = 0x0000000000000001, NZCV = 1000", "line": 6, "node": "r0", "path": ["start", "d_cbz", "d_lt", "d_gt", "d_en", "r0"]}, {"msg": "exit: X0 = 7, X2 = 0x0000000000000001, NZCV = 1000; kilépési állapot 0", "line": 10, "node": "exit", "path": ["start", "d_cbz", "d_lt", "d_gt", "d_en", "r0", "exit"]}];
const CODE = ["_start: mov x0, #LAB_X ; mov x2, #LAB_EN", "cbz x0, .Lzero", "cmp x0, #0 ; b.lt .Lnegative", "cmp x0, #10 ; b.gt .Llarge", "cbnz x2, .Lenabled", "movz w0, #3 ; b lab_exit", ".Lenabled:  movz w0, #0 ; b lab_exit", ".Lzero:     movz w0, #1 ; b lab_exit", ".Lnegative: movz w0, #2 ; b lab_exit", ".Llarge:    movz w0, #4 ; b lab_exit", "lab_exit (lab-exit.o): movz x8, #93 ; svc #0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = {"start": {"x": 2.2, "y": 10.2, "sh": "r", "lab": "mov x0, #LAB_X\nmov x2, #LAB_EN"}, "d_cbz": {"x": 2.2, "y": 8.6, "sh": "d", "lab": "cbz x0"}, "d_lt": {"x": 2.2, "y": 7.1, "sh": "dd", "lab": "cmp x0,#0\nb.lt"}, "d_gt": {"x": 2.2, "y": 5.6, "sh": "dd", "lab": "cmp x0,#10\nb.gt"}, "d_en": {"x": 2.2, "y": 4.1, "sh": "d", "lab": "cbnz x2"}, "r3": {"x": 2.2, "y": 2.6, "sh": "r", "lab": "W0 = 3\nb lab_exit"}, "r1": {"x": 6.4, "y": 8.6, "sh": "r", "lab": ".Lzero: W0 = 1\nb lab_exit"}, "r2": {"x": 6.4, "y": 7.1, "sh": "r", "lab": ".Lnegative: W0 = 2\nb lab_exit"}, "r4": {"x": 6.4, "y": 5.6, "sh": "r", "lab": ".Llarge: W0 = 4\nb lab_exit"}, "r0": {"x": 6.4, "y": 4.1, "sh": "r", "lab": ".Lenabled: W0 = 0\nb lab_exit"}, "exit": {"x": 6.4, "y": 1.0, "sh": "x", "lab": "lab_exit:\nmovz x8, #93; svc #0"}}, EDGES = [["start", "d_cbz", "", false], ["d_cbz", "r1", "X0 = 0", true], ["d_cbz", "d_lt", "", false], ["d_lt", "r2", "N ≠ V", true], ["d_lt", "d_gt", "", false], ["d_gt", "r4", "Z=0, N=V", true], ["d_gt", "d_en", "", false], ["d_en", "r0", "X2 ≠ 0", true], ["d_en", "r3", "", false]];
const M64 = (1n<<64n)-1n;
function sgn(v){return v>>63n ? v-(1n<<64n) : v;}
function cmpf(a,b){const r=(a-b)&M64; return [Number(r>>63n), +(r===0n), +(a>=b), +(sgn(a)-sgn(b)!==sgn(r))];}
const LINE = {start:0,d_cbz:1,d_lt:2,d_gt:3,d_en:4,r3:5,r0:6,r1:7,r2:8,r4:9,exit:10};
function branchSteps(x0,x2,w){
  const ux0=BigInt.asUintN(64,x0), st=[["start",null,""]]; let nz=null, status;
  if(ux0===0n){st.push(["d_cbz",nz,"taken"]);st.push(["r1",nz,""]);status=1;}
  else{ st.push(["d_cbz",nz,"fall-through"]); nz=cmpf(ux0,0n); const lt=nz[0]!==nz[3];
    st.push(["d_lt",nz,lt?"taken":"fall-through"]);
    if(lt){st.push(["r2",nz,""]);status=2;}
    else{ nz=cmpf(ux0,10n); const gt=nz[1]===0&&nz[0]===nz[3]; st.push(["d_gt",nz,gt?"taken":"fall-through"]);
      if(gt){st.push(["r4",nz,""]);status=4;}
      else{ const v=w?(x2&0xffffffffn):x2; st.push(["d_en",nz,v?"taken":"fall-through"]); st.push([v?"r0":"r3",nz,""]); status=v?0:3; } } }
  st.push(["exit",nz,""]);
  const out=[], path=[];
  st.forEach(([node,nz,br])=>{ path.push(node);
    let msg=`${node}: X0 = ${x0}, X2 = 0x${BigInt.asUintN(64,x2).toString(16).padStart(16,"0")}, NZCV = ${nz?nz.join(""):"----"}`;
    if(br) msg+=`; következő PC: ${br}`; if(node==="exit") msg+=`; kilépési állapot ${status}`;
    out.push({msg:msg.replace("X0 = -","X0 = −"),line:LINE[node],node:node,path:path.slice(),w:w}); });
  return out;
}
const SX=60, SY=40, OX=10, OY=11;
function P(x,y){return [OX+(x-0.4)*SX,(OY-y)*SY];}
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 560 470");
  const fg=css("--fg"), hl=css("--hl"), path=s.path||[];
  const defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
  defs.innerHTML=`<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`;
  const used=(a,b)=>{for(let i=0;i+1<path.length;i++) if(path[i]===a&&path[i+1]===b) return true; return false;};
  EDGES.forEach(([a,b,lab,taken])=>{
    const A=NODES[a], B=NODES[b]; let p0,p1;
    if(A.y===B.y){p0=P(A.x+1.45,A.y);p1=P(B.x-1.5,B.y);} else {p0=P(A.x,A.y-0.5);p1=P(B.x,B.y+0.48);}
    const u=used(a,b), at={x1:p0[0],y1:p0[1],x2:p1[0],y2:p1[1],stroke:u?hl:fg,"stroke-width":u?3.2:1.1,"marker-end":u?"url(#ahh)":"url(#ah)"};
    if(!taken) at["stroke-dasharray"]="6 4"; el("line",at);
    if(lab) el("text",{x:(p0[0]+p1[0])/2,y:p0[1]-5,"text-anchor":"middle","font-size":10.5},lab);
  });
  // eredmény -> lab_exit
  const ex=NODES.exit, endN=path.length>1?path[path.length-2]:null, done=path.includes("exit");
  ["r1","r2","r4","r0"].forEach(n=>{const q=P(NODES[n].x+1.5,NODES[n].y), b=P(8.4,NODES[n].y), on=done&&endN===n;
    el("line",{x1:q[0],y1:q[1],x2:b[0],y2:b[1],stroke:on?hl:fg,"stroke-width":on?3.2:1.1});
    if(on){const e=P(8.4,ex.y);el("line",{x1:b[0],y1:b[1],x2:e[0],y2:e[1],stroke:hl,"stroke-width":3.2});}});
  let b0=P(8.4,NODES.r1.y), b1=P(8.4,ex.y); el("line",{x1:b0[0],y1:b0[1],x2:b1[0],y2:b1[1],stroke:fg});
  let e1=P(ex.x+1.7,ex.y); el("line",{x1:b1[0],y1:b1[1],x2:e1[0],y2:e1[1],stroke:(done&&endN!=="r3")?hl:fg,"stroke-width":(done&&endN!=="r3")?3.2:1.1,"marker-end":"url(#ah)"});
  const r3=P(NODES.r3.x,NODES.r3.y-0.48), r3b=P(NODES.r3.x,ex.y), e2=P(ex.x-1.7,ex.y), on3=done&&endN==="r3";
  el("path",{d:`M${r3[0]} ${r3[1]} L${r3b[0]} ${r3b[1]} L${e2[0]} ${e2[1]}`,fill:"none",stroke:on3?hl:fg,"stroke-width":on3?3.2:1.1,"marker-end":"url(#ah)"});
  const lt=P(8.45,2.2); el("text",{x:lt[0]+4,y:lt[1],"font-size":10},"JUMP26");
  for(const k in NODES){const n=NODES[k], q=P(n.x,n.y), cur=k===s.node, seen=path.includes(k);
    const sw=cur?3.4:(seen?2:1), st=cur?hl:fg, fill=cur?css("--cellhl"):css("--cell");
    if(n.sh==="d"||n.sh==="dd"){const w=1.45*SX,h=0.55*SY;
      el("polygon",{points:`${q[0]-w},${q[1]} ${q[0]},${q[1]-h} ${q[0]+w},${q[1]} ${q[0]},${q[1]+h}`,fill:fill,stroke:st,"stroke-width":sw});
      if(n.sh==="dd") el("polygon",{points:`${q[0]-w*0.84},${q[1]} ${q[0]},${q[1]-h*0.84} ${q[0]+w*0.84},${q[1]} ${q[0]},${q[1]+h*0.84}`,fill:"none",stroke:st,"stroke-width":1});}
    else {const w=(n.sh==="x"?3.4:3.0)*SX,h=0.95*SY, a={x:q[0]-w/2,y:q[1]-h/2,width:w,height:h,fill:fill,stroke:st,"stroke-width":sw}; if(n.sh==="x")a["stroke-dasharray"]="6 4"; el("rect",a);
      if(n.sh==="x") el("text",{x:q[0],y:q[1]-h/2-5,"text-anchor":"middle","font-size":10},"lab-exit.o (külön objektum)");}
    const ls=(k==="d_en"&&s.w?"cbnz w2":n.lab).split("\n"); ls.forEach((t,i)=>el("text",{x:q[0],y:q[1]+4+(i-(ls.length-1)/2)*12,"text-anchor":"middle","font-size":10,"font-family":"ui-monospace,monospace"},t));
  }
}
function loadIn(){
  let x0,x2; try{x0=BigInt(document.getElementById("ix0").value.trim().replace("−","-")); x2=BigInt("0x"+document.getElementById("ix2").value.trim().replace(/^0x/,""));}catch(e){status.textContent="Hibás bemenet (X0 decimális, X2 hexa).";return;}
  if(x0< -(1n<<63n) || x0>=(1n<<63n) || x2>M64){status.textContent="Az érték nem fér el 64 biten.";return;}
  setSteps(branchSteps(x0,x2,document.getElementById("iw").checked));
}
function pre(x0,x2,w){document.getElementById("ix0").value=x0;document.getElementById("ix2").value=x2;document.getElementById("iw").checked=w;loadIn();}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
