<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cortex-M3 kivételkeret</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Belépési SP:</span><label><input type="radio" name="al" checked onchange="setSteps(STA)"> 0x20000F00 (8-ra igazított)</label><label><input type="radio" name="al" onchange="setSteps(STB)"> 0x20000EFC (csak 4-re)</label><script>const STA = [{"msg": "Belépés előtt: SP = 0x20000F00 (8-ra igazított).", "n": 0, "sp": 536874752, "line": 0, "f": 536874752}, {"msg": "xPSR a 0x20000EFC címre (offset +0x1C az új SP-től); bit 9 = 0.", "n": 1, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "PC a 0x20000EF8 címre (offset +0x18 az új SP-től) – ez a folytatási cím.", "n": 2, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "LR a 0x20000EF4 címre (offset +0x14 az új SP-től).", "n": 3, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R12 a 0x20000EF0 címre (offset +0x10 az új SP-től).", "n": 4, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R3 a 0x20000EEC címre (offset +0x0C az új SP-től).", "n": 5, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R2 a 0x20000EE8 címre (offset +0x08 az új SP-től).", "n": 6, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R1 a 0x20000EE4 címre (offset +0x04 az új SP-től).", "n": 7, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R0 a 0x20000EE0 címre (offset +0x00 az új SP-től).", "n": 8, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "Új SP = 0x20000EE0 (R0); LR = EXC_RETURN (pl. 0xFFFFFFF9).", "n": 8, "al": 0, "sp": 536874720, "line": 2, "f": 536874752}, {"msg": "HardFault-kezelő olvasása: [SP, #24] = [0x20000EF8] = mentett PC (a 16.4 2. feladatának ldr r1, [r0, #24] sora).", "n": 8, "al": 0, "sp": 536874720, "line": 3, "rd": 1, "f": 536874752}]; const STB = [{"msg": "Belépés előtt: SP = 0x20000EFC (nem 8-ra igazított).", "n": 0, "sp": 536874748, "line": 0, "f": 536874748}, {"msg": "Igazítási szó a 0x20000EF8 címen (kihagyva): a keret fölött marad; a mentett xPSR 9. bitje ezt jelzi.", "n": 0, "al": 1, "sp": 536874748, "line": 0, "f": 536874748}, {"msg": "xPSR a 0x20000EF4 címre (offset +0x1C az új SP-től); bit 9 = 1.", "n": 1, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "PC a 0x20000EF0 címre (offset +0x18 az új SP-től) – ez a folytatási cím.", "n": 2, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "LR a 0x20000EEC címre (offset +0x14 az új SP-től).", "n": 3, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "R12 a 0x20000EE8 címre (offset +0x10 az új SP-től).", "n": 4, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "R3 a 0x20000EE4 címre (offset +0x0C az új SP-től).", "n": 5, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "R2 a 0x20000EE0 címre (offset +0x08 az új SP-től).", "n": 6, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "R1 a 0x20000EDC címre (offset +0x04 az új SP-től).", "n": 7, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "R0 a 0x20000ED8 címre (offset +0x00 az új SP-től).", "n": 8, "al": 1, "sp": 536874748, "line": 1, "f": 536874748}, {"msg": "Új SP = 0x20000ED8 (R0); LR = EXC_RETURN (pl. 0xFFFFFFF9).", "n": 8, "al": 1, "sp": 536874712, "line": 2, "f": 536874748}, {"msg": "HardFault-kezelő olvasása: [SP, #24] = [0x20000EF0] = mentett PC (a 16.4 2. feladatának ldr r1, [r0, #24] sora).", "n": 8, "al": 1, "sp": 536874712, "line": 3, "rd": 1, "f": 536874748}];</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc mentett szó R0-tól xPSR-ig; igazítatlan SP-nél egy kihagyott szó a keret fölött, az offsetek változatlanok."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az elrendezés az Armv7-M PushStack szabályából számolt (a tools/cm-run.py modellje is ezt követi); a hardver a szavakat más sorrendben is írhatja, a végső elrendezés azonos.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Belépés előtt: SP = 0x20000F00 (8-ra igazított).", "n": 0, "sp": 536874752, "line": 0, "f": 536874752}, {"msg": "xPSR a 0x20000EFC címre (offset +0x1C az új SP-től); bit 9 = 0.", "n": 1, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "PC a 0x20000EF8 címre (offset +0x18 az új SP-től) – ez a folytatási cím.", "n": 2, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "LR a 0x20000EF4 címre (offset +0x14 az új SP-től).", "n": 3, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R12 a 0x20000EF0 címre (offset +0x10 az új SP-től).", "n": 4, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R3 a 0x20000EEC címre (offset +0x0C az új SP-től).", "n": 5, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R2 a 0x20000EE8 címre (offset +0x08 az új SP-től).", "n": 6, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R1 a 0x20000EE4 címre (offset +0x04 az új SP-től).", "n": 7, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "R0 a 0x20000EE0 címre (offset +0x00 az új SP-től).", "n": 8, "al": 0, "sp": 536874752, "line": 1, "f": 536874752}, {"msg": "Új SP = 0x20000EE0 (R0); LR = EXC_RETURN (pl. 0xFFFFFFF9).", "n": 8, "al": 0, "sp": 536874720, "line": 2, "f": 536874752}, {"msg": "HardFault-kezelő olvasása: [SP, #24] = [0x20000EF8] = mentett PC (a 16.4 2. feladatának ldr r1, [r0, #24] sora).", "n": 8, "al": 0, "sp": 536874720, "line": 3, "rd": 1, "f": 536874752}];
const CODE = ["belépés: SP < 8-ra igazítás? (STKALIGN = 1) → igazítási szó a keret fölött", "a nyolc szó végső elrendezése: R0 +0x00 … xPSR +0x1C (a hardver sorrendje eltérhet)", "SP ← keret alja (R0); LR ← EXC_RETURN (pl. 0xFFFFFFF9); PC ← vektor", "HardFault-kezelő: ldr r1, [r0, #24]  @ r0 = SP → mentett PC (folytatási cím)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ORD = ["R0","R1","R2","R3","R12","LR","PC","xPSR"];
function render(s){
  svg.setAttribute("viewBox","0 0 640 340");
  svg.innerHTML = "";
  const TOP = 0x20000F00, ln = css("--line"), hl = css("--hl2");
  const Y = a => 30 + (TOP - a) / 4 * 26;      // cím → vízszintes határvonal; az a című szó Y(a+4)…Y(a)
  const pad = (s.f & 4) ? 4 : 0, nsp = pad ? ((s.f - 0x20) & ~4) >>> 0 : s.f - 0x20;
  for (let a = TOP - 4; a >= TOP - 44; a -= 4){
    el("text",{x:200,y:Y(a+4)+13,"text-anchor":"end","font-size":12,style:"font-family:ui-monospace,monospace",fill:css("--muted")},"0x"+a.toString(16).toUpperCase());
    el("rect",{x:210,y:Y(a+4),width:170,height:26,fill:css("--cell"),stroke:ln,"stroke-width":0.4});
  }
  if (pad && s.al){
    const a = s.f - 4;
    el("rect",{x:210,y:Y(a+4),width:170,height:26,fill:css("--cellhl"),stroke:ln,"stroke-dasharray":"4 3"});
    el("text",{x:295,y:Y(a+4)+17,"text-anchor":"middle","font-size":12},"igazítási szó (kihagyva)");
  }
  for (let i = 7; i >= 8 - s.n; i--){
    const a = nsp + 4*i, on = (s.rd && ORD[i]==="PC") || (i===8-s.n && !s.rd && s.line===1);
    el("rect",{x:210,y:Y(a+4),width:170,height:26,fill:on?css("--cellhl"):css("--cell"),stroke:on?hl:ln,"stroke-width":on?3:1.4});
    el("text",{x:295,y:Y(a+4)+17,"text-anchor":"middle","font-size":13},ORD[i]+(ORD[i]==="xPSR"?" (bit9 = "+(pad?1:0)+")":""));
    el("text",{x:390,y:Y(a+4)+17,"font-size":12,style:"font-family:ui-monospace,monospace"},"+0x"+(4*i).toString(16).toUpperCase().padStart(2,"0"));
  }
  const yo = Y(s.f);
  el("line",{x1:180,y1:yo,x2:450,y2:yo,stroke:ln,"stroke-dasharray":"6 4","stroke-width":1.5});
  el("text",{x:455,y:yo+4,"font-size":12},"régi SP");
  const ys = Y(s.sp);
  el("line",{x1:150,y1:ys,x2:208,y2:ys,stroke:hl,"stroke-width":3});
  el("text",{x:10,y:ys+4,"font-size":13,fill:hl,"font-weight":"bold"},"SP = 0x"+s.sp.toString(16).toUpperCase());
  if (s.rd) el("text",{x:455,y:Y(nsp+28)+17,"font-size":12,fill:hl},"← [SP, #24]: mentett PC");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
