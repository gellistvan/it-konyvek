<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-step.gdb állapotai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#2e6b2e;--bad:#a01010;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#8fd08f;--bad:#ff8080;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:140px}
input[type=text],input[type=number]{width:11em;padding:2px 4px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg .mono{font-family:ui-monospace,monospace;white-space:pre}
pre.code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--grid);padding:2px 6px;text-align:center}
.small{font-size:12px;color:var(--muted)}
.warn{color:var(--bad);font-weight:bold}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Léptetés">
 <button id="first" title="Kezdőállapot">⏮</button>
 <button id="prev">◀ Lépés</button>
 <button id="play">▶ Lejátszás</button>
 <button id="next">Lépés ▶</button>
 <button id="five" title="A stepi 5 öt utasítását egyszerre hajtja végre">stepi 5 egyben</button>
 <input id="pos" type="range" min="0" max="9" value="0" aria-label="Állapot">
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="Kódpanel a PC-vel, regisztertábla és a verem két szava"></svg>

<p class="small">* és vastag keret: az előző megálláshoz képest változott érték. A PC mindig a következő, még végre nem hajtott utasításra mutat. A „stepi 5 egyben” a 2. stepi utáni állapotból egyszerre ugrik az LDP elé, mint a lab-step.gdb. Értékek: a fejezet kódja unicorn-emulátorban; címek szimbolikusan.</p>
<script>

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function $(id){return document.getElementById(id);}

const DATA = {"steps": [{"cmd": "break *lab_call · continue", "msg": "break *lab_call → a BL előtt állunk (még nem futott le): X0 = &lab_values, X1 = 7.", "line": 3, "regs": {"x0": "&lab_values", "x1": "7", "x2": "–", "x3": "–", "x29": "entry_fp", "x30": "–", "sp": "entry_sp", "pc": "lab_call"}, "stack": null, "changed": [], "sch": false}, {"cmd": "stepi", "msg": "stepi: a BL lefutott → PC = lab_sum, X30 = lab_after (a visszatérési cím).", "line": 10, "regs": {"x0": "&lab_values", "x1": "7", "x2": "–", "x3": "–", "x29": "entry_fp", "x30": "lab_after", "sp": "entry_sp", "pc": "lab_sum"}, "stack": null, "changed": ["x30", "pc"], "sch": false}, {"cmd": "stepi", "msg": "stepi: STP lefutott → SP = entry_sp − 16, [SP] = belépési X29, [SP+8] = lab_after; p $sp == $entry_sp - 16 → 1", "line": 11, "regs": {"x0": "&lab_values", "x1": "7", "x2": "–", "x3": "–", "x29": "entry_fp", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+4"}, "stack": ["entry_fp", "lab_after"], "changed": ["sp", "pc"], "sch": true}, {"cmd": "stepi 5 (1/5)", "msg": "stepi 5 (1/5): mov x29, sp → X29 = SP (keretmutató).", "line": 12, "regs": {"x0": "&lab_values", "x1": "7", "x2": "–", "x3": "–", "x29": "entry_sp − 16", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+8"}, "stack": ["entry_fp", "lab_after"], "changed": ["x29", "pc"], "sch": false}, {"cmd": "stepi 5 (2/5)", "msg": "stepi 5 (2/5): ldr x2, [x0] → X2 = 0x0000000200000001.", "line": 13, "regs": {"x0": "&lab_values", "x1": "7", "x2": "0x0000000200000001", "x3": "–", "x29": "entry_sp − 16", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+12"}, "stack": ["entry_fp", "lab_after"], "changed": ["x2", "pc"], "sch": false}, {"cmd": "stepi 5 (3/5)", "msg": "stepi 5 (3/5): ldr x3, [x0, #8] → X3 = 0x0000000400000003.", "line": 14, "regs": {"x0": "&lab_values", "x1": "7", "x2": "0x0000000200000001", "x3": "0x0000000400000003", "x29": "entry_sp − 16", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+16"}, "stack": ["entry_fp", "lab_after"], "changed": ["x3", "pc"], "sch": false}, {"cmd": "stepi 5 (4/5)", "msg": "stepi 5 (4/5): add x0, x2, x3 → X0 = 0x0000000600000004.", "line": 15, "regs": {"x0": "0x0000000600000004", "x1": "7", "x2": "0x0000000200000001", "x3": "0x0000000400000003", "x29": "entry_sp − 16", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+20"}, "stack": ["entry_fp", "lab_after"], "changed": ["x0", "pc"], "sch": false}, {"cmd": "stepi 5 (5/5)", "msg": "stepi 5 (5/5): add x0, x0, x1 → p/x $x0 → 0x000000060000000b; x/i $pc → ldp (még nem futott le).", "line": 16, "regs": {"x0": "0x000000060000000b", "x1": "7", "x2": "0x0000000200000001", "x3": "0x0000000400000003", "x29": "entry_sp − 16", "x30": "lab_after", "sp": "entry_sp − 16", "pc": "lab_sum+24"}, "stack": ["entry_fp", "lab_after"], "changed": ["x0", "pc"], "sch": false}, {"cmd": "stepi", "msg": "stepi: LDP lefutott → p $sp == $entry_sp → 1, p $x29 == $entry_fp → 1.", "line": 17, "regs": {"x0": "0x000000060000000b", "x1": "7", "x2": "0x0000000200000001", "x3": "0x0000000400000003", "x29": "entry_fp", "x30": "lab_after", "sp": "entry_sp", "pc": "lab_sum+28"}, "stack": null, "changed": ["x29", "sp", "pc"], "sch": true}, {"cmd": "stepi", "msg": "stepi: RET lefutott → PC = lab_after; x/i $pc → adrp x2, lab_result.", "line": 4, "regs": {"x0": "0x000000060000000b", "x1": "7", "x2": "0x0000000200000001", "x3": "0x0000000400000003", "x29": "entry_fp", "x30": "lab_after", "sp": "entry_sp", "pc": "lab_after"}, "stack": null, "changed": ["pc"], "sch": false}], "dis": ["adrp x0, lab_values", "add  x0, x0, :lo12:lab_values", "mov  w1, #7", "bl   lab_sum", "adrp x2, lab_result", "add  x2, x2, :lo12:lab_result", "str  x0, [x2]", "mov  w0, #0", "mov  w8, #93", "svc  #0", "stp  x29, x30, [sp, #-16]!", "mov  x29, sp", "ldr  x2, [x0]", "ldr  x3, [x0, #8]", "add  x0, x2, x3", "add  x0, x0, x1", "ldp  x29, x30, [sp], #16", "ret"], "show": [3, 4, 10, 11, 12, 13, 14, 15, 16, 17], "lab": {"3": "lab_call", "4": "lab_after", "10": "lab_sum"}, "regs": ["x0", "x1", "x2", "x3", "x29", "x30", "sp", "pc"]};

const S = DATA.steps, DIS = DATA.dis, SHOW = DATA.show, LAB = DATA.lab, REGS = DATA.regs;
let cur = 0, tm = null;
const svgV = $("v");
function draw(){
  const s = S[cur]; svgV.innerHTML = "";
  $("pos").value = cur; $("cnt").textContent = (cur + 1) + "/" + S.length + " · " + s.cmd;
  $("status").textContent = s.msg;
  mk(svgV, "text", {x: 8, y: 16, "font-weight": "bold", "font-size": 13}, "disassembly");
  SHOW.forEach((li, r) => {
    const y = 34 + r * 25, on = li === s.line;
    if (on) { mk(svgV, "rect", {x: 26, y: y - 11, width: 290, height: 22, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
              mk(svgV, "text", {x: 2, y: y + 5, "font-weight": "bold", "font-size": 12}, "PC▶"); }
    const lab = LAB[li] ? LAB[li] + ": " : "";
    mk(svgV, "text", {x: 32, y: y + 5, "font-size": 13, class: "mono", "font-weight": on ? "bold" : "normal"}, lab + DIS[li]);
  });
  mk(svgV, "text", {x: 340, y: 16, "font-weight": "bold", "font-size": 13}, "regiszterek");
  REGS.forEach((r, i) => {
    const y = 34 + i * 30, ch = s.changed.includes(r);
    mk(svgV, "text", {x: 340, y: y + 5, "font-size": 13, class: "mono"}, r.toUpperCase());
    mk(svgV, "rect", {x: 380, y: y - 12, width: 200, height: 24, fill: css("--cell"), stroke: css("--line"), "stroke-width": ch ? 3 : 1});
    mk(svgV, "text", {x: 386, y: y + 5, "font-size": 12.5, class: "mono", "font-weight": ch ? "bold" : "normal"}, s.regs[r] + (ch ? " *" : ""));
  });
  mk(svgV, "text", {x: 600, y: 16, "font-weight": "bold", "font-size": 13}, "verem");
  ["[SP]", "[SP+8]"].forEach((n, j) => {
    const y = 34 + j * 30, v = s.stack ? s.stack[j] : "–";
    mk(svgV, "text", {x: 600, y: y + 5, "font-size": 12, class: "mono"}, n);
    mk(svgV, "rect", {x: 652, y: y - 12, width: 104, height: 24, fill: s.stack ? css("--cell") : css("--cell2"), stroke: css("--line"), "stroke-width": s.sch && s.stack ? 3 : 1});
    mk(svgV, "text", {x: 656, y: y + 5, "font-size": 11.5, class: "mono"}, v + (s.sch && s.stack ? " *" : ""));
  });
}
function go(i){ cur = Math.max(0, Math.min(S.length - 1, i)); draw(); }
function stop(){ if (tm) { clearInterval(tm); tm = null; } $("play").textContent = "▶ Lejátszás"; }
$("first").onclick = () => { stop(); go(0); };
$("prev").onclick = () => { stop(); go(cur - 1); };
$("next").onclick = () => { stop(); go(cur + 1); };
$("five").onclick = () => { stop(); if (cur >= 2 && cur < 7) go(7); else if (cur < 2) go(2); else go(cur + 1); };
$("pos").oninput = () => { stop(); go(+$("pos").value); };
$("play").onclick = () => { if (tm) { stop(); return; } if (cur >= S.length - 1) go(0);
  $("play").textContent = "⏸ Szünet"; tm = setInterval(() => { if (cur >= S.length - 1) stop(); else go(cur + 1); }, 1100); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); go(cur + 1); } if (e.key === "ArrowLeft") { stop(); go(cur - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
