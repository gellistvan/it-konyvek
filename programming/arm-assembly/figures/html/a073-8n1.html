<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8N1 keret és bitidő-nyújtás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bájt (hexa): <input id="by" value="41" size="3" maxlength="2" aria-label="Küldött bájt hexadecimálisan"></label>
<label>ISR hossza: <input id="il" type="range" min="0" max="1" step="0.1" value="0.6" style="width:100px" aria-label="ISR hossza bitidőben"></label><span id="ilv">0,6</span>
<label>ISR helye: <select id="ib" aria-label="Melyik bit alatt fut az ISR">
<option value="0">S</option><option value="1">b0</option><option value="2">b1</option><option value="3">b2</option>
<option value="4" selected>b3</option><option value="5">b4</option><option value="6">b5</option><option value="7">b6</option>
<option value="8">b7</option><option value="9">P</option></select></label>
<script>
function upd(){ const v = parseInt(document.getElementById("by").value, 16);
  P = {byte: (isNaN(v) ? 0x41 : v) & 0xFF, ib: +document.getElementById("ib").value, il: +document.getElementById("il").value};
  document.getElementById("ilv").textContent = String(P.il).replace(".", ",");
  setSteps(stepsFor(P.byte, P.ib, P.il)); }
["by", "il", "ib"].forEach(i => document.getElementById(i).addEventListener("change", upd));
document.getElementById("il").addEventListener("input", upd);
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 0x41 bájt 8N1 jelalakja; egy megszakítás megnyújtja a 3. adatbitet, a későbbi minták elcsúsznak"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: a vevő a start lefutó élétől a névleges bitközepeken mintavételez; az ISR a megszakított bit idejét nyújtja meg, a későbbi élek ennyivel később jönnek. Egy minta akkor csúszik át a szomszéd bitre, ha a halmozott eltolás > 0,5 bitidő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Bájt 0x41: keret = 0 1 0 0 0 0 0 1 0 1 (S, b0…b7 LSB-first, P). Tétlen vonal: 1.", "line": 0, "k": -1}, {"msg": "bit S: szint = 0, str = 0, vevő mintája = 0 → helyes", "line": 1, "k": 0}, {"msg": "bit b0: szint = 1, str = maszk, vevő mintája = 1 → helyes", "line": 2, "k": 1}, {"msg": "bit b1: szint = 0, str = 0, vevő mintája = 0 → helyes", "line": 2, "k": 2}, {"msg": "bit b2: szint = 0, str = 0, vevő mintája = 0 → helyes", "line": 2, "k": 3}, {"msg": "bit b3: szint = 0, str = 0, vevő mintája = 0 → helyes", "line": 2, "k": 4}, {"msg": "bit b4: szint = 0, str = 0, vevő mintája = 0 → helyes (a minta a b3 bitre esik)", "line": 2, "k": 5}, {"msg": "bit b5: szint = 0, str = 0, vevő mintája = 0 → helyes (a minta a b4 bitre esik)", "line": 2, "k": 6}, {"msg": "bit b6: szint = 1, str = maszk, vevő mintája = 0 → HIBÁS (a minta a b5 bitre esik)", "line": 2, "k": 7}, {"msg": "bit b7: szint = 0, str = 0, vevő mintája = 1 → HIBÁS (a minta a b6 bitre esik)", "line": 2, "k": 8}, {"msg": "bit P: szint = 1, str = maszk, vevő mintája = 0 → HIBÁS (a minta a b7 bitre esik)", "line": 3, "k": 9}];
const CODE = ["tétlen: kimenet = 1", "start bit: str 0 (maszkolt írás), várakozás delay ciklus", "8 adatbit LSB-first: str (byte & 1 ? maszk : 0); byte >>= 1; várakozás", "stop bit: str maszk, várakozás"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function sim(byte, ib, il){
  const bits = [0]; for (let i = 0; i < 8; i++) bits.push((byte >> i) & 1); bits.push(1);
  const segs = []; let t = 0;
  bits.forEach((b, k) => { const d = 1 + (k === ib ? il : 0); segs.push([t, t + d, b]); t += d; });
  const samp = bits.map((b, k) => { const ts = k + 0.5; let src = 0;
    segs.forEach((g, i) => { if (g[0] <= ts && ts < g[1]) src = i; }); return [ts, segs[src][2], b, src]; });
  return {bits, segs, samp};
}
const NM = ["S","b0","b1","b2","b3","b4","b5","b6","b7","P"];
function stepsFor(byte, ib, il){
  const r = sim(byte, ib, il);
  const out = [{msg: `Bájt 0x${byte.toString(16).toUpperCase().padStart(2,"0")}: keret = ${r.bits.join(" ")} (S, b0…b7 LSB-first, P). Tétlen vonal: 1.`, line: 0, k: -1}];
  r.samp.forEach(([ts, got, exp, src], k) => {
    const ok = got === exp ? "helyes" : "HIBÁS", slip = src === k ? "" : ` (a minta a ${NM[src]} bitre esik)`;
    out.push({msg: `bit ${NM[k]}: szint = ${exp}, str = ${exp ? "maszk" : "0"}, vevő mintája = ${got} → ${ok}${slip}`,
              line: k === 0 ? 1 : (k <= 8 ? 2 : 3), k: k});
  });
  return out;
}
let P = {byte: 0x41, ib: 4, il: 0.6};
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 250");
  const r = sim(P.byte, P.ib, P.il), X = t => 40 + (t + 0.6) * 42, Y = v => v ? 70 : 150;
  for (let k = 0; k <= 11; k++) el("line", {x1: X(k), y1: 40, x2: X(k), y2: 175, stroke: css("--muted"), "stroke-width": 0.4, "stroke-dasharray": "1 3"});
  let d = `M ${X(-0.6)} ${Y(1)}`, prev = 1;
  r.segs.forEach(([a, e, b]) => { d += ` L ${X(a)} ${Y(prev)} L ${X(a)} ${Y(b)} L ${X(e)} ${Y(b)}`; prev = b; });
  d += ` L ${X(11.5)} ${Y(1)}`;
  el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  r.segs.forEach(([a, e, b], k) => {
    const on = k === s.k;
    if (on) el("rect", {x: X(a), y: 45, width: X(e) - X(a), height: 125, fill: css("--cellhl"), opacity: 0.5});
    el("text", {x: (X(a) + X(e)) / 2, y: 36, "text-anchor": "middle", "font-size": 13, "font-weight": on ? "bold" : "normal"}, NM[k]);
    el("text", {x: (X(a) + X(e)) / 2, y: 58, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(b));
  });
  if (P.il > 0 && P.ib >= 0) {
    const a = r.segs[P.ib][0] + 0.3;
    el("rect", {x: X(a), y: 182, width: X(a + P.il) - X(a), height: 16, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": "3 2"});
    el("text", {x: X(a) + (X(a + P.il) - X(a)) / 2, y: 214, "text-anchor": "middle", "font-size": 12}, "ISR");
  }
  r.samp.forEach(([ts, got, exp, src], k) => {
    if (k > s.k) return;
    const bad = got !== exp;
    el("line", {x1: X(ts), y1: 62, x2: X(ts), y2: 158, stroke: css("--hl"), "stroke-width": 1, "stroke-dasharray": "4 3"});
    el("circle", {cx: X(ts), cy: Y(got), r: 6, fill: bad ? css("--hl2") : css("--bg"), stroke: bad ? css("--hl2") : css("--hl"), "stroke-width": 2});
  });
  el("text", {x: 40, y: 240, "font-size": 12, fill: css("--muted")}, "idő [bitidő]; kör: a vevő mintája a névleges bitközépen (teli = hibás)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
