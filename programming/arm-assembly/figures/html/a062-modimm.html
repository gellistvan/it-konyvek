<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumb-2 módosított immediate dekóder</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>félszavak: <input id="hw1" size="5" value="f04f" aria-label="1. félszó (hexa)"> <input id="hw2" size="5" value="5568" aria-label="2. félszó (hexa)"></label><button onclick="decHw()">Dekódol</button><label>konstans: 0x<input id="cst" size="9" value="3a000000" aria-label="32 bites konstans (hexa)"></label><button onclick="encConst()">Kódol</button><button onclick="document.getElementById('hw1').value='f04f';document.getElementById('hw2').value='4561';decHw()">f04f 4561</button><button onclick="document.getElementById('cst').value='12345678';encConst()">0x12345678</button>
<script>
function rorJs(x,n){n%=32;return n?((x>>>n)|(x<<(32-n)))>>>0:x>>>0;}
function expandJs(imm12){
  if ((imm12>>10)===0){const t=(imm12>>8)&3,b=imm12&255;
    return {special:true,t:t,val:[b,(b<<16)|b,((b<<24)|(b<<8))>>>0,(b*0x01010101)>>>0][t]};}
  const rot=imm12>>7, base=0x80|(imm12&0x7F);
  return {special:false,rot:rot,base:base,val:rorJs(base,rot)};
}
function decodeJs(hw1,hw2){
  const i=(hw1>>10)&1, imm3=(hw2>>12)&7, rd=(hw2>>8)&15, imm8=hw2&255;
  const imm12=(i<<11)|(imm3<<8)|imm8, e=expandJs(imm12);
  return Object.assign({hw1:hw1,hw2:hw2,i:i,imm3:imm3,rd:rd,imm8:imm8,imm12:imm12},e);
}
function stepsFor(d){
  const h=v=>"0x"+(v>>>0).toString(16).toUpperCase();
  const st=[{d:d,ph:-1,line:-1,msg:"Bemenet: "+h(d.hw1)+" "+h(d.hw2).slice(2)+" (memóriában: "+[d.hw1&255,d.hw1>>8,d.hw2&255,d.hw2>>8].map(x=>x.toString(16).padStart(2,"0")).join(" ")+")."},
    {d:d,ph:0,line:0,msg:"Mezők: az 1. félszó felső 5 bitje 11110 → 32 bites utasítás; i = "+d.i+", imm3 = "+d.imm3.toString(2).padStart(3,"0")+", Rd = r"+d.rd+", imm8 = "+h(d.imm8)+"."},
    {d:d,ph:1,line:2,msg:"imm12 = i:imm3:imm8 = "+h(d.imm12)+"."}];
  if (d.special){
    st.push({d:d,ph:2,line:3,msg:"imm12[11:10] = 00: nem forgatott alak, hanem ismétlődő bájtminta (típus "+d.t+")."});
  } else {
    st.push({d:d,ph:2,line:4,msg:"Alapérték = 1:imm12[6:0] = "+h(d.base)+" (az implicit 1-es bit a 7. helyen); forgatás = imm12[11:7] = "+d.rot+"."});
    st.push({d:d,ph:3,line:5,msg:h(d.base)+" ROR "+d.rot+": a 7…0. bit a "+((7-d.rot+32)%32)+"…"+((0-d.rot+32)%32)+". helyre kerül."});
  }
  st.push({d:d,ph:4,line:5,msg:"Eredmény: mov.w r"+d.rd+", #"+h(d.val)+"."});
  return st;
}
function encodeJs(c){
  c>>>=0;
  for (let imm12=0; imm12<4096; imm12++){ if (expandJs(imm12).val===c) return imm12; }
  return -1;
}
function decHw(){
  const a=parseInt(document.getElementById("hw1").value,16), b=parseInt(document.getElementById("hw2").value,16);
  if (isNaN(a)||isNaN(b)||(a>>11)!==0x1E){ setSteps([{d:decodeJs(0xF04F,0x5568),ph:-1,line:-1,err:"Érvénytelen bemenet: az 1. félszó felső 5 bitje legyen 11110 (pl. f04f).",msg:"Érvénytelen bemenet."}]); return; }
  setSteps(stepsFor(decodeJs(a&0xFFFF,b&0xFFFF)));
}
function encConst(){
  const c=parseInt(document.getElementById("cst").value,16);
  if (isNaN(c)){ return; }
  const imm12=encodeJs(c);
  if (imm12<0){
    setSteps([{d:decodeJs(0xF04F,0x5568),ph:-1,line:-1,err:"0x"+(c>>>0).toString(16).toUpperCase()+": nem módosított immediate (MOVW/MOVT kell)",
      msg:"0x"+(c>>>0).toString(16).toUpperCase()+" nem kódolható módosított immediate-ként: nem módosított immediate (MOVW/MOVT kell)."}]);
    return;
  }
  const rd=5, hw1=0xF04F|((imm12>>11)<<10), hw2=(((imm12>>8)&7)<<12)|(rd<<8)|(imm12&255);
  document.getElementById("hw1").value=hw1.toString(16); document.getElementById("hw2").value=hw2.toString(16);
  setSteps(stepsFor(decodeJs(hw1,hw2)));
}
</script>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bitmező-ábra: a f04f 5568 utasításból összerakott imm12 = 0x568, a forgatás 10, az alapérték 0xE8, eredmény 0x3A000000."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A dekódolás a ThumbExpandImm szabálya (Armv7-M ARM); a kezdőállapot a 16.2.8 3. megoldásának f04f 5568 kódja (keystone-nal fordítva, capstone-nal visszafejtve).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": -1, "line": -1, "msg": "Bemenet: 0xF04F 5568 (memóriában: 4f f0 68 55)."}, {"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": 0, "line": 0, "msg": "Mezők: az 1. félszó felső 5 bitje 11110 → 32 bites utasítás; i = 0, imm3 = 101, Rd = r5, imm8 = 0x68."}, {"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": 1, "line": 2, "msg": "imm12 = i:imm3:imm8 = 0x568."}, {"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": 2, "line": 4, "msg": "Alapérték = 1:imm12[6:0] = 0xE8 (az implicit 1-es bit a 7. helyen); forgatás = imm12[11:7] = 10."}, {"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": 3, "line": 5, "msg": "0xE8 ROR 10: a 7…0. bit a 29…22. helyre kerül."}, {"d": {"hw1": 61519, "hw2": 21864, "i": 0, "imm3": 5, "rd": 5, "imm8": 104, "imm12": 1384, "special": false, "rot": 10, "base": 232, "val": 973078528}, "ph": 4, "line": 5, "msg": "Eredmény: mov.w r5, #0x3A000000."}];
const CODE = ["hw1 = 11110 i 0 0010 S 1111  (MOV.W Rd, #const, T2)", "hw2 = 0 imm3 Rd imm8", "imm12 = i:imm3:imm8", "if imm12[11:10] == 00: ismétlődő minta (00XY, 00XY00XY, XY00XY00, XYXYXYXY)", "else: alap = 1:imm12[6:0]; forgatás = imm12[11:7]", "eredmény = ROR(alap, forgatás)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CORE = { hw1: 0xF04F, hw2: 0x5568 };
function bitsRow(x0, y, v, n, kind, lbl, w){
  for (let b = n - 1; b >= 0; b--) {
    const x = x0 + (n - 1 - b) * w, kd = kind(b);
    el("rect",{x:x,y:y,width:w,height:18,fill:kd?css("--cellhl"):css("--cell"),stroke:css("--line"),
       "stroke-width":kd==="imp"?2:0.7,"stroke-dasharray":kd==="imp"?"3 2":"none"});
    el("text",{x:x+w/2,y:y+13,"text-anchor":"middle","font-size":11},String((v>>>b)&1));
  }
  if (lbl) el("text",{x:x0-6,y:y+13,"text-anchor":"end","font-size":11},lbl);
}
function hex(v,n){return "0x"+(v>>>0).toString(16).toUpperCase().padStart(n,"0");}
function render(s){
  svg.setAttribute("viewBox","0 0 640 300");
  svg.innerHTML = "";
  const d = s.d, ph = s.ph;
  bitsRow(70, 20, d.hw1, 16, b => ph>=0 && (b>=11 || (ph>=0 && b===10)) ? 1 : 0, hex(d.hw1,4), 15);
  bitsRow(380, 20, d.hw2, 16, b => ph>=0 && (b<=14 && b!==11 && b!==10 && b!==9 && b!==8) ? 1 : 0, hex(d.hw2,4), 15);
  el("text",{x:70,y:58,"font-size":10},"11110 | i="+d.i+" | 0 | "+((d.hw1>>5)&15).toString(2).padStart(4,"0")+" | S="+((d.hw1>>4)&1)+" | "+(d.hw1&15).toString(2).padStart(4,"0"));
  el("text",{x:380,y:58,"font-size":10},"0 | imm3="+d.imm3.toString(2).padStart(3,"0")+" | Rd=r"+d.rd+" | imm8="+hex(d.imm8,2));
  if (ph>=1){
    bitsRow(220, 80, d.imm12, 12, b => (d.special? b>=8 : b>=7) ? 1 : 0, "imm12 =", 16);
    el("text",{x:420,y:93,"font-size":12,"font-weight":"bold"},"= "+hex(d.imm12,3));
  }
  if (ph>=2){
    if (d.special){
      el("text",{x:20,y:140,"font-size":12},"imm12[11:10] = 00: ismétlődő minta, típus "+d.t+", bájt "+hex(d.imm12&255,2));
    } else {
      bitsRow(70, 125, d.base, 32, b => b===7 ? "imp" : (b<7?1:0), "alap", 16);
      el("text",{x:70,y:162,"font-size":11},"alap = 1:imm12[6:0] = "+hex(d.base,2)+",  forgatás = imm12[11:7] = "+d.rot);
    }
  }
  if (ph>=3 && !d.special){
    bitsRow(70, 190, d.val, 32, b => b===((7-d.rot+32)%32) ? "imp" : ((((b+d.rot)%32)<7)?1:0), "ROR "+d.rot, 16);
  }
  if (ph>=4){
    el("text",{x:70,y:250,"font-size":14,"font-weight":"bold"},"eredmény = "+hex(d.val,8));
  }
  if (s.err) el("text",{x:20,y:250,"font-size":13,"font-weight":"bold",fill:css("--hl2")},s.err);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
