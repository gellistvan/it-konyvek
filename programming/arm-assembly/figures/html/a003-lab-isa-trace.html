<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-isa állapota utasításonként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="X0, X1, X2, X8 két félre osztva és a lab_values nyolc bájtja; lépésenként kiemelve a változott mező."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az értékeket a fejezet lab-isa.s _start-ja adja keystone + unicorn helyettesítő emulátorban futtatva (nem GNU as/QEMU); X2 a lab_values futásidejű címe, amely a linkeléstől függ.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: a _start előtt az X0, X1, X2, X8 tartalma ismeretlen; a memóriában 25 00 00 00 00 00 00 00 (.word 37, .word 0).", "line": -1, "regs": {"x0": {"hi": "?", "lo": "?", "ones": false}, "x1": {"hi": "?", "lo": "?", "ones": false}, "x2": {"hi": "?", "lo": "?", "ones": false}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": [], "zeroed": false, "stored": false, "mem": [37, 0, 0, 0, 0, 0, 0, 0], "memch": []}, {"msg": "1. adr     x2, lab_values: X2 = a lab_values címe (PC-relatív ADR)", "line": 1, "regs": {"x0": {"hi": "?", "lo": "?", "ones": false}, "x1": {"hi": "?", "lo": "?", "ones": false}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": ["x2"], "zeroed": false, "stored": false, "mem": [37, 0, 0, 0, 0, 0, 0, 0], "memch": []}, {"msg": "2. movn    x1, #0: MOVN: minden bit 1 (X1 = −1 előjelesen)", "line": 2, "regs": {"x0": {"hi": "?", "lo": "?", "ones": false}, "x1": {"hi": "ffffffff", "lo": "ffffffff", "ones": true}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": ["x1"], "zeroed": false, "stored": false, "mem": [37, 0, 0, 0, 0, 0, 0, 0], "memch": []}, {"msg": "3. ldr     w1, [x2]: a W1 írása nullázza az X1 felső 32 bitjét. Tipikus hiba: „Az X1 felső fele biztosan megmarad.” Ellenpróba: a program előbb minden bitet egyre állít, majd betölt a W1 célregiszterbe; a nullás felső fél cáfolja a hipotézist.", "line": 3, "regs": {"x0": {"hi": "?", "lo": "?", "ones": false}, "x1": {"hi": "00000000", "lo": "00000025", "ones": false}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": ["x1"], "zeroed": true, "stored": false, "mem": [37, 0, 0, 0, 0, 0, 0, 0], "memch": []}, {"msg": "4. add     w0, w1, #5: W0 = 0x25 + 5 = 0x2a; X0 felső fele is nulla", "line": 4, "regs": {"x0": {"hi": "00000000", "lo": "0000002a", "ones": false}, "x1": {"hi": "00000000", "lo": "00000025", "ones": false}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": ["x0"], "zeroed": false, "stored": false, "mem": [37, 0, 0, 0, 0, 0, 0, 0], "memch": []}, {"msg": "5. str     w0, [x2, #4]: little-endian: a legkisebb helyi értékű bájt a legkisebb címen", "line": 5, "regs": {"x0": {"hi": "00000000", "lo": "0000002a", "ones": false}, "x1": {"hi": "00000000", "lo": "00000025", "ones": false}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "?", "lo": "?", "ones": false}}, "changed": [], "zeroed": false, "stored": true, "mem": [37, 0, 0, 0, 42, 0, 0, 0], "memch": [4, 5, 6, 7]}, {"msg": "6. movz    x8, #93: X8 = 93 = 0x5d: exit; X0 = 42 a kilépési állapot. A lab_before_exit állapot egyezik a könyv táblájával (X0 = 0x2a, X1 = 0x25).", "line": 8, "regs": {"x0": {"hi": "00000000", "lo": "0000002a", "ones": false}, "x1": {"hi": "00000000", "lo": "00000025", "ones": false}, "x2": {"sym": "&lab_values"}, "x8": {"hi": "00000000", "lo": "0000005d", "ones": false}}, "changed": ["x8"], "zeroed": false, "stored": true, "mem": [37, 0, 0, 0, 42, 0, 0, 0], "memch": []}];
const CODE = ["_start:", "    adr     x2, lab_values", "    movn    x1, #0", "    ldr     w1, [x2]", "    add     w0, w1, #5", "    str     w0, [x2, #4]", "", "lab_before_exit:", "    movz    x8, #93", "    svc     #0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const MONO = "font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre";
  const line = css("--line"), hl = css("--hl2"), mut = css("--muted");
  el("text", {x: 210, y: 22, "text-anchor": "middle", "font-size": 13, fill: mut}, "felső 32 bit");
  el("text", {x: 430, y: 22, "text-anchor": "middle", "font-size": 13, fill: mut}, "W-nézet (alsó 32 bit)");
  ["x0", "x1", "x2", "x8"].forEach((r, j) => {
    const y = 34 + j * 46, v = s.regs[r], ch = s.changed.includes(r);
    el("text", {x: 60, y: y + 25, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, r.toUpperCase());
    if (v.sym) {
      el("rect", {x: 100, y: y, width: 440, height: 36, fill: css("--cell"), stroke: ch ? hl : line, "stroke-width": ch ? 3.5 : 1.2});
      el("text", {x: 320, y: y + 24, "text-anchor": "middle", "font-size": 15, style: MONO}, v.sym + "  (a futásidejű cím)");
      return;
    }
    [[100, v.hi], [320, v.lo]].forEach(([x0, t], k) => {
      const unk = t === "?", zero = s.zeroed && r === "x1" && k === 0;
      el("rect", {x: x0, y: y, width: 220, height: 36, fill: v.ones ? css("--cellhl") : css("--cell"),
        stroke: ch && !unk ? hl : line, "stroke-width": ch && !unk ? 3.5 : 1.2, "stroke-dasharray": unk ? "2 3" : "none"});
      if (zero) for (let q = 0; q < 220; q += 12) el("line", {x1: x0 + q, y1: y + 36, x2: x0 + Math.min(q + 18, 220), y2: y + 36 - 36 * Math.min(18, 220 - q) / 18, stroke: hl, "stroke-width": 1});
      if (zero) el("rect", {x: x0 + 62, y: y + 8, width: 96, height: 22, fill: css("--cell")});
      el("text", {x: x0 + 110, y: y + 24, "text-anchor": "middle", "font-size": 15, style: MONO, fill: unk ? mut : css("--fg")}, t);
    });
    if (s.zeroed && r === "x1") el("text", {x: 550, y: y + 24, "font-size": 12, fill: hl}, "← nullázva");
  });
  el("text", {x: 60, y: 250, "text-anchor": "middle", "font-size": 13}, "lab_values");
  s.mem.forEach((b, i) => {
    const x0 = 100 + i * 55, ch = s.memch.includes(i);
    el("rect", {x: x0, y: 226, width: 55, height: 36, fill: s.stored && i >= 4 ? css("--cellhl") : css("--cell"), stroke: ch ? hl : line, "stroke-width": ch ? 3.5 : 1.2});
    el("text", {x: x0 + 27, y: 250, "text-anchor": "middle", "font-size": 15, style: MONO}, b.toString(16).padStart(2, "0"));
    el("text", {x: x0 + 27, y: 278, "text-anchor": "middle", "font-size": 12, fill: mut}, "+" + i);
  });
  if (s.stored) el("text", {x: 320, y: 304, "text-anchor": "middle", "font-size": 13, fill: hl}, "little-endian: a legkisebb helyi értékű bájt (2a) a legkisebb címen (+4)");
  el("text", {x: 320, y: 324, "text-anchor": "middle", "font-size": 12, fill: mut}, "vastag/színes keret: változott; szürke: csupa egy / tárolt szó; pontozott: ismeretlen");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
