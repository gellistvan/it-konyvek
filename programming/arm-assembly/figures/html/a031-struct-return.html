<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struktúra-visszaadás AAPCS64 alatt</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span id="fields" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 8 bájtos struktúra mindkét mezője X0-ban; a 16 bájtos X0-ban és X1-ben; a 24 bájtos a hívó tárolójában, amelynek címét X8 adja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lépések a négy esetet váltják (8 / 16 / 24 bájt, valamint egy kitöltéses 16 bájtos példa); a mezőértékek beírhatók (decimális vagy 0x… alak). Kezdőértékek: a fejezet első tesztesete (a = 20, b = 7), a lab-return.S kódjának Unicornos futásával ellenőrizve. AArch64 Linux, LP64, little-endian.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "sizeof=8, hely: X0 – X0 = 0x0000000200000001 (a first az alsó 32 bit)", "case": 0, "line": -1}, {"msg": "sizeof=16, hely: X0+X1 – X0 = 27, X1 = 13 (lab_pair(20, 7))", "case": 1, "line": -1}, {"msg": "sizeof=24, hely: [X8] – a hívó tárolója: +0 = 27, +8 = 13, +16 = 19; X0 = 20, X1 = 7 nem tolódik el", "case": 2, "line": -1}, {"msg": "sizeof=16 (1–7. bájt kitöltés), hely: X0+X1 – X0 alsó bájtja = tag, a többi bájt határozatlan; X1 = value", "case": 3, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CASES = [{"key": "w8", "title": "struct lab_words { uint32_t first, second; }", "size": 8, "where": "X0", "fields": [{"n": "first", "off": 0, "sz": 4, "v": 1}, {"n": "second", "off": 4, "sz": 4, "v": 2}], "msg": "sizeof=8, hely: X0 – X0 = 0x0000000200000001 (a first az alsó 32 bit)"}, {"key": "p16", "title": "struct lab_pair_value { uint64_t sum, difference; }", "size": 16, "where": "X0+X1", "fields": [{"n": "sum", "off": 0, "sz": 8, "v": 27}, {"n": "difference", "off": 8, "sz": 8, "v": 13}], "msg": "sizeof=16, hely: X0+X1 – X0 = 27, X1 = 13 (lab_pair(20, 7))"}, {"key": "t24", "title": "struct lab_triple_value { uint64_t sum, difference, xor_value; }", "size": 24, "where": "[X8]", "fields": [{"n": "sum", "off": 0, "sz": 8, "v": 27}, {"n": "difference", "off": 8, "sz": 8, "v": 13}, {"n": "xor_value", "off": 16, "sz": 8, "v": 19}], "msg": "sizeof=24, hely: [X8] – a hívó tárolója: +0 = 27, +8 = 13, +16 = 19; X0 = 20, X1 = 7 nem tolódik el"}, {"key": "pad", "title": "struct { uint8_t tag; uint64_t value; } – kitöltéssel", "size": 16, "where": "X0+X1", "fields": [{"n": "tag", "off": 0, "sz": 1, "v": 5}, {"n": "value", "off": 8, "sz": 8, "v": 1000}], "msg": "sizeof=16 (1–7. bájt kitöltés), hely: X0+X1 – X0 alsó bájtja = tag, a többi bájt határozatlan; X1 = value"}];
let selByte = -1;
function vals(ci){ return CASES[ci].fields.map((f, j) => { const e = document.getElementById("f" + j); return (e && e.dataset.case == ci && e.value !== "") ? e.value : String(f.v); }); }
function toBytes(ci){
  const c = CASES[ci], b = new Array(c.size).fill(null), V = vals(ci);
  c.fields.forEach((f, j) => { let x; try { x = BigInt.asUintN(8 * f.sz, BigInt(V[j].trim())); } catch(e){ x = 0n; }
    for (let i = 0; i < f.sz; i++) { b[f.off + i] = {v: Number((x >> BigInt(8 * i)) & 255n), f: j}; } });
  return b;
}
function hx2(v){ return v === null ? "??" : v.toString(16).padStart(2, "0"); }
function fieldInputs(ci){
  const c = CASES[ci], box = document.getElementById("fields");
  if (box.dataset.case == ci) return;
  box.dataset.case = ci;
  box.innerHTML = c.fields.map((f, j) => `<label>${f.n} = <input id="f${j}" data-case="${ci}" size="20" value="${f.v}" aria-label="${f.n} értéke"></label>`).join(" ");
  c.fields.forEach((f, j) => document.getElementById("f" + j).addEventListener("input", () => show(k)));
}
function render(s){
  const ci = s.case, c = CASES[ci]; fieldInputs(ci);
  svg.setAttribute("viewBox", "0 0 760 330"); svg.innerHTML = "";
  const line = css("--line"), cell = css("--cell"), hlc = css("--cellhl"), hl = css("--hl"), mut = css("--muted");
  const pats = ["url(#p0)", "url(#p1)", "url(#p2)"];
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="p0" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${cell}"/><circle cx="3" cy="3" r="1" fill="${mut}"/></pattern>` +
    `<pattern id="p1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${cell}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${mut}"/></pattern>` +
    `<pattern id="p2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${cell}"/><path d="M0,0 L6,6 M6,0 L0,6" stroke="${mut}" stroke-width="0.7"/></pattern>` +
    `<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="${line}"/></marker>`;
  svg.appendChild(defs);
  const B = toBytes(ci), w = 28, X = 120;
  el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, c.title);
  el("text", {x: X - 8, y: 72, "text-anchor": "end", "font-size": 12}, "memóriakép");
  B.forEach((b, i) => {
    const x = X + i * w, on = i === selByte;
    const r = el("rect", {x, y: 52, width: w, height: 28, fill: b === null ? cell : pats[b.f % 3], stroke: on ? hl : line, "stroke-width": on ? 3 : 0.8, "stroke-dasharray": b === null ? "3 2" : "none", tabindex: 0, role: "button", "aria-label": "bájt " + i});
    r.style.cursor = "pointer";
    r.addEventListener("click", () => { selByte = (selByte === i ? -1 : i); show(k); });
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { selByte = (selByte === i ? -1 : i); show(k); e.preventDefault(); } });
    const t = el("text", {x: x + w / 2, y: 71, "text-anchor": "middle", "font-size": 11.5, "font-family": "ui-monospace,monospace"}, b === null ? "··" : hx2(b.v));
    t.style.pointerEvents = "none";
    el("text", {x: x + w / 2, y: 46, "text-anchor": "middle", "font-size": 10, fill: mut}, String(i));
  });
  c.fields.forEach((f, j) => {
    el("text", {x: X + (f.off + f.sz / 2) * w, y: 98, "text-anchor": "middle", "font-size": 12}, f.n);
  });
  if (c.where === "[X8]") {
    // a hívó tárolója: X8 mutat a kezdetére
    el("rect", {x: 20, y: 160, width: 90, height: 30, fill: cell, stroke: line, "stroke-width": 2.5});
    el("text", {x: 65, y: 180, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "X8");
    el("path", {d: `M110 175 C 120 120 ${X - 20} 120 ${X} 82`, fill: "none", stroke: line, "stroke-dasharray": "5 3", "marker-end": "url(#ah)"});
    el("text", {x: 130, y: 150, "font-size": 12}, "a hívó keretében lévő tároló címe");
    [["X0", "a = 20"], ["X1", "b = 7"]].forEach(([n, v], j) => {
      el("rect", {x: 20, y: 215 + j * 40, width: 150, height: 30, fill: cell, stroke: line, "stroke-width": 2.5});
      el("text", {x: 30, y: 235 + j * 40, "font-size": 13, "font-weight": "bold"}, n);
      el("text", {x: 70, y: 235 + j * 40, "font-size": 13, "font-family": "ui-monospace,monospace"}, v);
    });
    el("text", {x: 190, y: 245, "font-size": 12}, "a, b bemenet: a rejtett X8 nem tolja el őket");
    c.fields.forEach((f, j) => el("text", {x: X + f.off * w + 2, y: 116, "font-size": 11, fill: mut}, "+" + f.off));
  } else {
    const regs = c.size <= 8 ? ["X0"] : ["X0", "X1"];
    regs.forEach((rn, r) => {
      const y = 170 + r * 70;
      el("text", {x: X - 8, y: y + 20, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, rn);
      let hex = "0x";
      for (let jj = 0; jj < 8; jj++) {
        const bi = r * 8 + 7 - jj, b = B[bi], x = X + jj * w, on = bi === selByte;
        el("rect", {x, y, width: w, height: 28, fill: b === null ? cell : pats[b.f % 3], stroke: on ? hl : line, "stroke-width": on ? 3 : 0.8});
        el("text", {x: x + w / 2, y: y + 19, "text-anchor": "middle", "font-size": 11.5, "font-family": "ui-monospace,monospace"}, b === null ? "··" : hx2(b.v));
        hex += b === null ? "??" : hx2(b.v);
        if (on) el("line", {x1: X + bi % 8 * 0 + selByte * w + w / 2, y1: 82, x2: x + w / 2, y2: y - 2, stroke: hl, "stroke-width": 2, "marker-end": "url(#ah)"});
      }
      el("rect", {x: X, y, width: 8 * w, height: 28, fill: "none", stroke: line, "stroke-width": 2.5});
      el("text", {x: X, y: y + 42, "font-size": 10, fill: mut}, "63");
      el("text", {x: X + 8 * w, y: y + 42, "text-anchor": "end", "font-size": 10, fill: mut}, "0");
      el("text", {x: X + 8 * w + 12, y: y + 19, "font-size": 13, "font-family": "ui-monospace,monospace"}, "= " + hex);
    });
    el("text", {x: X, y: 155, "font-size": 12, fill: mut}, "a regiszterben a 7. bájt balra (MSB), a 0. jobbra (LSB) – little-endian");
  }
  const sel = selByte >= 0 && selByte < c.size ? (B[selByte] === null ? `a(z) ${selByte}. bájt kitöltés (értéke határozatlan)` :
     (c.where === "[X8]" ? `a(z) ${selByte}. bájt → [X8 + ${selByte}]` : `a(z) ${selByte}. bájt → X${Math.floor(selByte / 8)} ${8 * (selByte % 8) + 7}:${8 * (selByte % 8)}. bitje`)) : "kattints egy memóriabájtra a leképezéshez";
  el("text", {x: 10, y: 320, "font-size": 12.5, fill: hl}, sel);
  status.textContent = `sizeof=${c.size}, hely: ${c.where}` + (ci === k && vals(ci).every((v, j) => v === String(c.fields[j].v)) ? " – " + s.msg.split(" – ")[1] : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
