<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ugrótábla lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kulcs = <input id="key" value="12" size="6" style="font-family:monospace"></label><label><input type="checkbox" id="bgt"> B.GT (hibás változat)</label><label><input type="checkbox" id="hole"> 12-es eset törölve (2. feladat)</label><button type="button" onclick="runSw()">Betöltés</button><button type="button" onclick="document.getElementById('key').value=-1;runSw()">-1</button><button type="button" onclick="document.getElementById('key').value=9;runSw()">9</button><button type="button" onclick="document.getElementById('key').value=10;runSw()">10</button><button type="button" onclick="document.getElementById('key').value=11;runSw()">11</button><button type="button" onclick="document.getElementById('key').value=12;runSw()">12</button><button type="button" onclick="document.getElementById('key').value=13;runSw()">13</button><button type="button" onclick="document.getElementById('key').value=14;runSw()">14</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kulcsból 10 levonásával index lesz; 0–3 között a táblából kiolvasott címre ugrik, minden más index, a negatív kulcsoké is, a defaultra megy."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A modellt a lab-switch unicorn-futtatásával vetettük össze (−1/9/14 → 99, 10…13 → 60…63; 12 törölve: 61/99/63/99; B.GT és key 9 vagy −1: táblán kívüli olvasás, unicorn-hiba). A 139-es állapot a fejezet QEMU-mérése.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "mov w0, #12: W0 = 0x0000000c", "line": 0, "ph": 0, "key": 12, "w1": null, "nz": null, "off": null, "st": null, "bc": "b.hi", "hole": false}, {"msg": "sub w1, w0, #10: W1 = 0x00000002 (előjel nélkül 2)", "line": 1, "ph": 1, "key": 12, "w1": 2, "nz": null, "off": null, "st": null, "bc": "b.hi", "hole": false}, {"msg": "cmp w1, #3: NZCV = 1000; B.HI nem ugrik", "line": 2, "ph": 2, "key": 12, "w1": 2, "nz": "1000", "off": null, "st": null, "bc": "b.hi", "hole": false}, {"msg": "ldr x3, [b + 16]: X3 = .Lr62", "line": 3, "ph": 3, "key": 12, "w1": 2, "nz": "1000", "off": 16, "st": null, "bc": "b.hi", "hole": false}, {"msg": "br x3 → .Lr62", "line": 4, "ph": 4, "key": 12, "w1": 2, "nz": "1000", "off": 16, "st": null, "bc": "b.hi", "hole": false}, {"msg": ".Lr62: status = 62", "line": 5, "ph": 5, "key": 12, "w1": 2, "nz": "1000", "off": 16, "st": 62, "bc": "b.hi", "hole": false}];
const CODE = ["mov w0, #LAB_KEY", "sub w1, w0, #10", "cmp w1, #3 ; b.hi .Ldefault   (hibás változat: b.gt)", "adr x2, .Ltable ; ldr x3, [x2, w1, uxtw #3]", "br x3", ".LrNN: mov w0, #NN ; .Ldefault: mov w0, #99 ; exit"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function swModel(key,bc,hole){ const w1=((key-10)>>>0), r=((w1-3)>>>0), sw=v=>v>=0x80000000?v-0x100000000:v;
  const N=r>>>31, Z=+(r===0), C=+(w1>=3), V=+(sw(w1)-3!==sw(r)); const taken = bc==="b.hi" ? (C===1&&Z===0) : (Z===0&&N===V);
  const nz=""+N+Z+C+V; if(taken) return {w1,nz,taken:true,off:null,st:99};
  const off=8*w1; if(w1>3) return {w1,nz,taken:false,off,st:139};
  return {w1,nz,taken:false,off,st:[60,61,hole?99:62,63][w1]}; }
function swSteps(key,bc,hole){ const m=swModel(key,bc,hole), hx=v=>"0x"+(v>>>0).toString(16).padStart(8,"0"), b={key,bc,hole};
  const S=(o)=>Object.assign({},b,o), out=[S({msg:`mov w0, #${key}: W0 = ${hx(key)}`,line:0,ph:0,w1:null,nz:null,off:null,st:null})];
  out.push(S({msg:`sub w1, w0, #10: W1 = ${hx(m.w1)} (előjel nélkül ${m.w1})`,line:1,ph:1,w1:m.w1,nz:null,off:null,st:null}));
  out.push(S({msg:`cmp w1, #3: NZCV = ${m.nz}; ${bc.toUpperCase()} ${m.taken?"ugrik a defaultra":"nem ugrik"}`,line:2,ph:2,w1:m.w1,nz:m.nz,off:null,st:m.taken?99:null}));
  if(m.taken){out.push(S({msg:"default: w0 = 99 → status = 99",line:5,ph:5,w1:m.w1,nz:m.nz,off:null,st:99}));return out;}
  if(m.st===139){out.push(S({msg:`ldr x3, [b + 8·${m.w1}]: táblán kívüli olvasás (b + 0x${m.off.toString(16)}), SIGSEGV (mérve: 139)`,line:3,ph:3,w1:m.w1,nz:m.nz,off:m.off,st:139}));return out;}
  const tgt=(hole&&m.w1===2)?".Ldefault":`.Lr${60+m.w1}`;
  out.push(S({msg:`ldr x3, [b + ${m.off}]: X3 = ${tgt}`,line:3,ph:3,w1:m.w1,nz:m.nz,off:m.off,st:null}));
  out.push(S({msg:`br x3 → ${tgt}`,line:4,ph:4,w1:m.w1,nz:m.nz,off:m.off,st:null}));
  out.push(S({msg:`${tgt}: status = ${m.st}`,line:5,ph:5,w1:m.w1,nz:m.nz,off:m.off,st:m.st}));
  return out; }
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 680 300");
  const fg=css("--fg"), hl=css("--hl"), hl2=css("--hl2");
  const defs=document.createElementNS(NS,"defs"); svg.appendChild(defs);
  defs.innerHTML=`<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`;
  const hx=v=>"0x"+(v>>>0).toString(16).padStart(8,"0");
  // regiszterek
  [["W0",hx(s.key)],["W1",s.w1===null?"?":hx(s.w1)],["NZCV",s.nz||"?"],["cím",s.off===null?"?":(s.off<=24?`b + ${s.off}`:`b + 0x${s.off.toString(16)}`)],["eredmény",s.st===null?"?":(s.st===139?"SIGSEGV (139)":String(s.st))]].forEach(([n,v],i)=>{
    el("text",{x:10,y:30+i*26,"font-size":13},n); el("text",{x:80,y:30+i*26,"font-size":13,"font-family":"ui-monospace,monospace","font-weight":i===s.ph?"bold":"normal"},v);});
  // számegyenes
  const X0=230, X1=470, Y=60;
  el("line",{x1:X0,y1:Y,x2:X1,y2:Y,stroke:fg,"stroke-width":1.5});
  el("rect",{x:X0,y:Y-8,width:36,height:16,fill:css("--cellhl"),stroke:fg});
  el("text",{x:X0+18,y:Y-12,"text-anchor":"middle","font-size":11},"[0,3] tábla");
  el("text",{x:(X0+36+X1)/2,y:Y+24,"text-anchor":"middle","font-size":11},s.bc==="b.hi"?"4 … 2³²−1: default (B.HI)":"B.GT: előjelesen nézi, a nagy index átjut!");
  el("text",{x:X0,y:Y+40,"font-size":10.5,fill:css("--muted")},"0"); el("text",{x:X1,y:Y+40,"text-anchor":"end","font-size":10.5,fill:css("--muted")},"2³²−1");
  if(s.w1!==null){ const xx = s.w1<=3 ? X0+4+s.w1*9 : X0+40+Math.log2(s.w1+1)/32*(X1-X0-50);
    el("path",{d:`M${xx} ${Y-26} L${xx-6} ${Y-36} L${xx+6} ${Y-36} z`,fill:hl}); el("text",{x:xx,y:Y-40,"text-anchor":"middle","font-size":11,"font-weight":"bold"},"W1"); }
  // tábla
  const TX=500, TY=120;
  el("text",{x:TX,y:TY-12,"font-size":12,"font-weight":"bold"},".Ltable");
  for(let i=0;i<4;i++){ const y=TY+i*34, tgt=(s.hole&&i===2)?".Ldefault":`.Lr${60+i}`, on=s.ph>=3&&s.off===8*i;
    el("text",{x:TX-6,y:y+20,"text-anchor":"end","font-size":11,"font-family":"ui-monospace,monospace"},`b+${8*i}`);
    el("rect",{x:TX,y:y,width:90,height:28,fill:on?css("--cellhl"):css("--cell"),stroke:on?hl:fg,"stroke-width":on?3:1});
    el("text",{x:TX+45,y:y+19,"text-anchor":"middle","font-size":12,"font-family":"ui-monospace,monospace"},tgt); }
  // kódblokkok
  const CX=230, CY=130;
  el("text",{x:CX,y:CY-12,"font-size":12,"font-weight":"bold"},"célblokkok");
  [60,61,62,63,99].forEach((v,i)=>{ const y=CY+i*30, on=s.ph>=4&&s.st===v&&!(v===99&&s.ph<5); const lab=v===99?".Ldefault: w0=99":`.Lr${v}: w0=${v}`;
    el("rect",{x:CX,y:y,width:150,height:24,fill:on?css("--cellhl"):css("--cell"),stroke:on?hl:fg,"stroke-width":on?3:1});
    el("text",{x:CX+75,y:y+17,"text-anchor":"middle","font-size":12,"font-family":"ui-monospace,monospace"},lab); });
  if(s.st===139) el("text",{x:TX-40,y:TY+160,"font-size":13,"font-weight":"bold",fill:hl2},"✗ táblán kívüli olvasás → SIGSEGV (139)");
  if(s.ph>=4&&s.off!==null&&s.st!==139){ const i=s.off/8, y1=TY+i*34+14, tv=(s.hole&&i===2)?99:60+i, j=[60,61,62,63,99].indexOf(tv), y2=CY+j*30+12;
    el("path",{d:`M${TX} ${y1} C ${TX-50} ${y1}, ${CX+200} ${y2}, ${CX+152} ${y2}`,fill:"none",stroke:hl,"stroke-width":2.6,"marker-end":"url(#ah)"}); }
}
function runSw(){ const k=parseInt(document.getElementById("key").value,10);
  if(!(k>=-1&&k<=65535)){status.textContent="A kulcs a laborban −1 vagy 0…65535 lehet.";return;}
  setSteps(swSteps(k, document.getElementById("bgt").checked?"b.gt":"b.hi", document.getElementById("hole").checked)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
