<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az A64 regiszterkészlet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--hi:#d9d9d9;--line:#000;--sel:#ffe08a}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--hi:#4a4a4a;--line:#ddd;--sel:#6b5a1e}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
svg .mono{font-family:ui-monospace,monospace}
svg g.reg{cursor:pointer}
svg g.reg:focus{outline:none}
svg g.reg:focus rect.lo{stroke:var(--hl);stroke-width:3}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label><input type="checkbox" id="wmode"> „Wn írása” mód (a kiválasztott regiszterbe W-nézeten írunk)</label>
  <button id="reset">Kijelölés törlése</button>
</div>
<div id="status" aria-live="polite">Kattints egy regiszterre (vagy Tab + Enter) a szerepéhez és a megőrzési szabályhoz.</div>
<svg id="v" viewBox="0 0 760 700" role="img" aria-label="31 darab 64 bites általános regiszter AAPCS64-szerepcsoportokkal; külön az SP, a PC és a nulla-regiszter; a 31-es regiszterkód formától függően SP-t vagy XZR-t jelent."></svg>
<p class="small">Szerepek: a fejezet AAPCS64-táblázata. Vastag keret: a hívott függvény megőrzi; szaggatott: a hívó menti. A 31-es kód példái keystone-nal assemblált kódolásokból (Rn/Rd = 31).</p>
<script>
const REGS = [{"n": 0, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 1, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 2, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 3, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 4, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 5, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 6, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 7, "lab": "argumentum,\neredmény", "kind": "caller", "txt": "Egész és mutató argumentumok, eredményátadás; híváson át nem őrződik meg."}, {"n": 8, "lab": "közvetett eredmény", "kind": "caller", "txt": "Közvetett eredmény helyének átadása; híváson át nem őrződik meg."}, {"n": 9, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 10, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 11, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 12, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 13, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 14, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 15, "lab": "ideiglenes", "kind": "caller", "txt": "Ideiglenes értékek; híváson át nem garantált a megőrzésük."}, {"n": 16, "lab": "IP0 / IP1", "kind": "caller", "txt": "Linker-veneer, PLT szabadon felülírhatja a hívás és a belépés között."}, {"n": 17, "lab": "IP0 / IP1", "kind": "caller", "txt": "Linker-veneer, PLT szabadon felülírhatja a hívás és a belépés között."}, {"n": 18, "lab": "platform", "kind": "spec", "txt": "Platformfüggő szerep; hordozható kódban ne foglald le önkényesen."}, {"n": 19, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 20, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 21, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 22, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 23, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 24, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 25, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 26, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 27, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 28, "lab": "megőrzendő", "kind": "callee", "txt": "A hívott függvény megőrzi: visszatérés előtt a teljes 64 bites értéket vissza kell állítania."}, {"n": 29, "lab": "FP (keretmutató)", "kind": "callee", "txt": "Keretmutató; megőrzendő."}, {"n": 30, "lab": "LR (kapcsolatregiszter)", "kind": "spec", "txt": "A BL ide írja a visszatérési címet."}];
const CODE31 = [{"src": "add x0, sp, #16", "word": "0x910043e0", "field": "Rn", "value": 31, "meaning": "SP", "disasm": "add x0, sp, #0x10"}, {"src": "add sp, sp, #16", "word": "0x910043ff", "field": "Rd", "value": 31, "meaning": "SP", "disasm": "add sp, sp, #0x10"}, {"src": "ldr x0, [sp, #8]", "word": "0xf94007e0", "field": "Rn", "value": 31, "meaning": "SP", "disasm": "ldr x0, [sp, #8]"}, {"src": "orr x0, xzr, x1", "word": "0xaa0103e0", "field": "Rn", "value": 31, "meaning": "XZR", "disasm": "mov x0, x1"}, {"src": "subs xzr, x1, x2", "word": "0xeb02003f", "field": "Rd", "value": 31, "meaning": "XZR", "disasm": "cmp x1, x2"}];
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const st = document.getElementById("status");
let sel = -1;
function mk(tag, a, txt, parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(parent||svg).appendChild(e);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const RH = 20, Y0 = 34, XH = 60, XL = 190, W = 130;
function rule(k){return k==="callee"?"a hívott függvény megőrzi (visszatérés előtt a teljes 64 bitet vissza kell állítania)":k==="caller"?"a hívó menti, ha szüksége van rá (a hívott szabadon felülírhatja)":"különleges szerep";}
function draw(){
  svg.innerHTML = "";
  const wm = document.getElementById("wmode").checked;
  mk("text",{x:XH+W/2,y:24,"text-anchor":"middle","font-size":12},"bit 63…32");
  mk("text",{x:XL+W/2,y:24,"text-anchor":"middle","font-size":12},"bit 31…0");
  REGS.forEach(r=>{
    const y = Y0 + r.n*RH, on = r.n===sel;
    const g = mk("g",{class:"reg",tabindex:0,role:"button","aria-label":"X"+r.n+": "+r.lab});
    mk("text",{x:XH-8,y:y+14,"text-anchor":"end","font-size":13,class:"mono"},"X"+r.n,g);
    const zero = on && wm;
    mk("rect",{x:XH,y:y+1,width:W,height:RH-2,fill:on?cv("--sel"):cv("--hi"),stroke:cv("--line"),"stroke-width":1},undefined,g);
    mk("text",{x:XH+W/2,y:y+14,"text-anchor":"middle","font-size":12,class:"mono"},zero?"00000000":"felső 32 bit",g);
    if(zero) mk("line",{x1:XH+4,y1:y+RH/2,x2:XH+W-4,y2:y+RH/2,stroke:cv("--fg"),"stroke-width":1.2},undefined,g);
    mk("rect",{class:"lo",x:XL,y:y+1,width:W,height:RH-2,fill:on?cv("--sel"):cv("--cell"),stroke:cv("--line"),"stroke-width":1},undefined,g);
    mk("text",{x:XL+W/2,y:y+14,"text-anchor":"middle","font-size":12,class:"mono"},zero?"W"+r.n+" ← érték":"W"+r.n,g);
    g.addEventListener("click",()=>pick(r.n));
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(r.n);}});
  });
  // csoportkeretek
  const groups=[];REGS.forEach(r=>{const l=groups[groups.length-1];if(l&&l.lab===r.lab)l.b=r.n;else groups.push({a:r.n,b:r.n,lab:r.lab,kind:r.kind});});
  groups.forEach(gr=>{
    const y0=Y0+gr.a*RH, h=(gr.b-gr.a+1)*RH;
    const a={x:XH-3,y:y0,width:XL+W-XH+6,height:h,fill:"none",stroke:cv("--line"),"pointer-events":"none"};
    if(gr.kind==="callee")a["stroke-width"]=3.2;else if(gr.kind==="caller"){a["stroke-width"]=1.4;a["stroke-dasharray"]="6 4";}else a["stroke-width"]=0.8;
    mk("rect",a);
    mk("path",{d:`M${XL+W+10} ${y0+1} h6 v${h-2} h-6`,fill:"none",stroke:cv("--line")});
    mk("text",{x:XL+W+22,y:y0+h/2+4,"font-size":12},gr.lab);
  });
  // különálló elemek
  const xs=486;
  mk("text",{x:xs,y:40,"font-size":13,"font-weight":"bold"},"Nem tagjai az X0–X30 készletnek:");
  [["SP","64 bit; WSP csak egyes formákban"],["PC","nem általános operandus"],["XZR / WZR","olvasva 0, írva eldob"]].forEach((it,i)=>{
    const y=56+i*58; mk("rect",{x:xs,y:y,width:268,height:48,fill:cv("--cell"),stroke:cv("--line"),"stroke-width":1.4});
    mk("text",{x:xs+8,y:y+19,"font-size":13,"font-weight":"bold",class:"mono"},it[0]);
    mk("text",{x:xs+8,y:y+38,"font-size":11.5},it[1]);
  });
  const yc=250; mk("rect",{x:xs+30,y:yc,width:190,height:30,fill:cv("--hi"),stroke:cv("--line")});
  mk("text",{x:xs+125,y:yc+20,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"regiszterkód 31");
  mk("line",{x1:xs+90,y1:yc+30,x2:xs+50,y2:yc+80,stroke:cv("--line"),"stroke-width":1.5});
  mk("line",{x1:xs+160,y1:yc+30,x2:xs+200,y2:yc+80,stroke:cv("--line"),"stroke-width":1.5,"stroke-dasharray":"6 4"});
  mk("text",{x:xs+50,y:yc+98,"text-anchor":"middle","font-size":14,"font-weight":"bold",class:"mono"},"SP");
  mk("text",{x:xs+200,y:yc+98,"text-anchor":"middle","font-size":14,"font-weight":"bold",class:"mono"},"XZR");
  CODE31.forEach(c=>{
    const isSP=c.meaning==="SP", list=CODE31.filter(d=>d.meaning===c.meaning), i=list.indexOf(c);
    mk("text",{x:isSP?xs-10:xs+140,y:yc+122+i*18,"font-size":11.5,class:"mono"},c.src);
    mk("text",{x:isSP?xs-10:xs+140,y:yc+122+list.length*18+4,"font-size":11,fill:cv("--muted")},i===0?(isSP?"(ADD imm, betöltés bázisa)":"(ORR, SUBS célja)"):"");
  });
  mk("text",{x:xs-10,y:yc+220,"font-size":11.5,fill:cv("--muted")},"Kódolások (keystone):");
  CODE31.forEach((c,i)=>mk("text",{x:xs-10,y:yc+240+i*17,"font-size":11,class:"mono",fill:cv("--muted")},`${c.word}  ${c.field}=31 → ${c.meaning}`));
}
function pick(n){
  sel=n; const r=REGS[n], wm=document.getElementById("wmode").checked;
  let m=`X${n} / W${n}: ${r.lab}. ${r.txt} Megőrzés: ${rule(r.kind)}.`;
  if(wm) m+=` Wn írása: W${n} ← 32 bites érték, az X${n} felső 32 bitje 0 lesz (nullakiterjesztés).`;
  st.textContent=m; draw();
  const g=svg.querySelectorAll("g.reg")[n]; if(g) g.focus();
}
document.getElementById("wmode").addEventListener("change",()=>{ if(sel>=0) pick(sel); else draw(); });
document.getElementById("reset").addEventListener("click",()=>{sel=-1;st.textContent="Nincs kijelölt regiszter.";draw();});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
