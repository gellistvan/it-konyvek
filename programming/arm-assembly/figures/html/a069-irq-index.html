<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy IRQ-szám három indexelése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>IRQn (0–239): <input id="irq" type="number" min="0" max="239" value="8" onchange="goIrq()"></label><button onclick="goIrq()">Számol</button><button onclick="document.getElementById('irq').value=8;goIrq()">IRQ 8</button><button onclick="document.getElementById('irq').value=33;goIrq()">IRQ 33</button>
<script>
function stepsJs(n){
  const h=(v,k)=>"0x"+(v>>>0).toString(16).toUpperCase().padStart(k||8,"0");
  const iser=0xE000E100+4*(n>>5), mask=(1<<(n&31))>>>0, w=0xE000E400+4*(n>>2), l=n&3;
  const st=[{n:n,ph:1,line:-1,msg:"IRQ "+n+": ISER"+(n>>5)+" ("+h(iser)+"), bit "+(n&31)+", maszk "+h(mask)+"."},
    {n:n,ph:2,line:-1,msg:"IPR-szó "+h(w)+" (IRQn/4 = "+(n>>2)+"), sáv "+l+" (bitek "+(8*l+7)+":"+(8*l)+"), bájt "+h(w+l)+"."},
    {n:n,ph:3,line:-1,msg:"Vektortábla: index 16 + "+n+" = "+(16+n)+", offset 0x"+(4*(16+n)).toString(16).toUpperCase()+"."}];
  // a nvic_set_priority regiszterei (r1 = 0xC0) – ugyanaz a sorrend, mint az emulált futásban
  const r0a=n, r2a=(n&3), r2b=r2a*8, r0b=n&~3, r3a=0xE400, r3b=0xE000E400, r3c=r3b+r0b, old=0;
  const r12a=0xFF, r12b=(0xFF<<r2b)>>>0, r0c=old&~r12b, r12c=(0xC0<<r2b)>>>0, r0d=(r0c|r12c)>>>0;
  const R=[[r0a,0,0,0],[r0a,r2a,0,0],[r0a,r2b,0,0],[r0b,r2b,0,0],[r0b,r2b,r3a,0],[r0b,r2b,r3b,0],[r0b,r2b,r3c,0],
    [old,r2b,r3c,0],[old,r2b,r3c,r12a],[old,r2b,r3c,r12b],[r0c,r2b,r3c,r12b],[r0c,r2b,r3c,r12c],[r0d,r2b,r3c,r12c],[r0d,r2b,r3c,r12c]];
  R.forEach((g,k)=>st.push({n:n,ph:3,line:k,regs:g,msg:"nvic_set_priority, "+(k+1)+". utasítás: r0="+h(g[0],1)+", r2="+h(g[1],1)+", r3="+h(g[2],1)+", r12="+h(g[3],1)}));
  return st;
}
function goIrq(){
  const v=parseInt(document.getElementById("irq").value,10);
  if (isNaN(v)||v<0||v>239){ document.getElementById("irq").setAttribute("aria-invalid","true"); return; }
  document.getElementById("irq").removeAttribute("aria-invalid");
  setSteps(stepsJs(v));
}
</script>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="IRQ 8 az ISER0 8. bitje, az IPR 0xE000E408-as bájtja és a vektortábla 24. szava; IRQ 33 az ISER1 1. bitje, a 0xE000E421-es IPR-bájt és a 49. vektor."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kezdőállapot (IRQ 8) regiszterértékei a nvic_set_priority emulált futásából (keystone + unicorn) származnak, prioritásbájt 0xC0 és kezdetben nulla IPR-szó mellett; más IRQ-ra a lap ugyanazt a sorrendet számolja (a szkript assert-tel ellenőrzi a 8-as és 33-as esetet).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 8, "ph": 1, "line": -1, "msg": "IRQ 8: ISER0 (0xE000E100), bit 8, maszk 0x00000100."}, {"n": 8, "ph": 2, "line": -1, "msg": "IPR-szó 0xE000E408 (IRQn/4 = 2), sáv 0 (bitek 7:0), bájt 0xE000E408."}, {"n": 8, "ph": 3, "line": -1, "msg": "Vektortábla: index 16 + 8 = 24, offset 0x60."}, {"n": 8, "ph": 3, "line": 0, "regs": [8, 0, 0, 0], "msg": "nvic_set_priority: uxtb r1, r1 → r0=0x8, r2=0x0, r3=0x0, r12=0x0"}, {"n": 8, "ph": 3, "line": 1, "regs": [8, 0, 0, 0], "msg": "nvic_set_priority: ubfx r2, r0, #0, #2 → r0=0x8, r2=0x0, r3=0x0, r12=0x0"}, {"n": 8, "ph": 3, "line": 2, "regs": [8, 0, 0, 0], "msg": "nvic_set_priority: lsls r2, r2, #3 → r0=0x8, r2=0x0, r3=0x0, r12=0x0"}, {"n": 8, "ph": 3, "line": 3, "regs": [8, 0, 0, 0], "msg": "nvic_set_priority: bic r0, r0, #3 → r0=0x8, r2=0x0, r3=0x0, r12=0x0"}, {"n": 8, "ph": 3, "line": 4, "regs": [8, 0, 58368, 0], "msg": "nvic_set_priority: movw r3, #0xe400 → r0=0x8, r2=0x0, r3=0xE400, r12=0x0"}, {"n": 8, "ph": 3, "line": 5, "regs": [8, 0, 3758154752, 0], "msg": "nvic_set_priority: movt r3, #0xe000 → r0=0x8, r2=0x0, r3=0xE000E400, r12=0x0"}, {"n": 8, "ph": 3, "line": 6, "regs": [8, 0, 3758154760, 0], "msg": "nvic_set_priority: add r3, r0 → r0=0x8, r2=0x0, r3=0xE000E408, r12=0x0"}, {"n": 8, "ph": 3, "line": 7, "regs": [0, 0, 3758154760, 0], "msg": "nvic_set_priority: ldr r0, [r3] → r0=0x0, r2=0x0, r3=0xE000E408, r12=0x0"}, {"n": 8, "ph": 3, "line": 8, "regs": [0, 0, 3758154760, 255], "msg": "nvic_set_priority: movs.w ip, #0xff → r0=0x0, r2=0x0, r3=0xE000E408, r12=0xFF"}, {"n": 8, "ph": 3, "line": 9, "regs": [0, 0, 3758154760, 255], "msg": "nvic_set_priority: lsls.w ip, ip, r2 → r0=0x0, r2=0x0, r3=0xE000E408, r12=0xFF"}, {"n": 8, "ph": 3, "line": 10, "regs": [0, 0, 3758154760, 255], "msg": "nvic_set_priority: bic.w r0, r0, ip → r0=0x0, r2=0x0, r3=0xE000E408, r12=0xFF"}, {"n": 8, "ph": 3, "line": 11, "regs": [0, 0, 3758154760, 192], "msg": "nvic_set_priority: lsls.w ip, r1, r2 → r0=0x0, r2=0x0, r3=0xE000E408, r12=0xC0"}, {"n": 8, "ph": 3, "line": 12, "regs": [192, 0, 3758154760, 192], "msg": "nvic_set_priority: orrs.w r0, r0, ip → r0=0xC0, r2=0x0, r3=0xE000E408, r12=0xC0"}, {"n": 8, "ph": 3, "line": 13, "regs": [192, 0, 3758154760, 192], "msg": "nvic_set_priority: str r0, [r3] → r0=0xC0, r2=0x0, r3=0xE000E408, r12=0xC0"}];
const CODE = ["uxtb    r1, r1", "ubfx    r2, r0, #0, #2", "lsls    r2, r2, #3", "bic     r0, r0, #3", "movw    r3, #(NVIC_IPR & 0xFFFF)", "movt    r3, #(NVIC_IPR >> 16)", "add     r3, r3, r0", "ldr     r0, [r3]", "movs    r12, #0xFF", "lsls    r12, r12, r2", "bic     r0, r0, r12", "lsls    r12, r1, r2", "orrs    r0, r0, r12", "str     r0, [r3]", "dsb", "isb", "bx      lr"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hx(v,n){return "0x"+(v>>>0).toString(16).toUpperCase().padStart(n||8,"0");}
function render(s){
  svg.setAttribute("viewBox","0 0 640 330");
  svg.innerHTML = "";
  const n = s.n, ln = css("--line"), hl = css("--hl2");
  // ISER
  el("text",{x:10,y:20,"font-size":13,"font-weight":"bold"},"ISER"+(n>>5)+" ("+hx(0xE000E100+4*(n>>5))+")");
  for (let b=31;b>=0;b--){
    const on = s.ph>=1 && b===(n&31);
    el("rect",{x:20+(31-b)*18,y:30,width:18,height:20,fill:on?hl:css("--cell"),"fill-opacity":on?0.6:1,stroke:ln,"stroke-width":0.5});
    if (b%8===0||b===31) el("text",{x:29+(31-b)*18,y:64,"text-anchor":"middle","font-size":10,fill:css("--muted")},String(b));
  }
  // IPR
  const w = 0xE000E400 + 4*(n>>2), lane = n&3;
  el("text",{x:10,y:95,"font-size":13,"font-weight":"bold"},"IPR-szó "+hx(w)+" (IRQ "+(n&~3)+"–"+((n&~3)+3)+")");
  for (let l=3;l>=0;l--){
    const on = s.ph>=2 && l===lane;
    el("rect",{x:20+(3-l)*144,y:105,width:144,height:24,fill:on?hl:css("--cell"),"fill-opacity":on?0.6:1,stroke:ln});
    el("text",{x:92+(3-l)*144,y:122,"text-anchor":"middle","font-size":12},"IRQ "+((n&~3)+l)+"  ["+(8*l+7)+":"+(8*l)+"]");
  }
  // vektortábla
  el("text",{x:10,y:160,"font-size":13,"font-weight":"bold"},"Vektortábla");
  for (let k=-2;k<=2;k++){
    const idx = 16+n+k, on = s.ph>=3 && k===0;
    el("rect",{x:200+k*90,y:170,width:86,height:26,fill:on?hl:css("--cell"),"fill-opacity":on?0.6:1,stroke:ln});
    el("text",{x:243+k*90,y:188,"text-anchor":"middle","font-size":12},idx+" ("+hx(4*idx,2)+")");
  }
  el("text",{x:10,y:222,"font-size":12},"kivételszám = 16 + IRQn = "+(16+n)+" — NEM az IPR indexe");
  if (n>31) el("text",{x:10,y:242,"font-size":12,fill:hl},"QEMU AN385: nem megvalósított (csak IRQ 0–31)");
  if (s.regs){
    const nm = ["r0","r2","r3","r12"];
    nm.forEach((r,i)=>{ el("text",{x:20+i*150,y:290,"font-size":13,style:"font-family:ui-monospace,monospace"},r+" = "+hx(s.regs[i])); });
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
