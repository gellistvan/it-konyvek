<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A tömörítés megtérülési küszöbe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--hatch:#999}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--hatch:#777}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:auto 1fr 5.5em;gap:4px 10px;align-items:center;margin-bottom:6px;max-width:640px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block;max-width:760px}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Modellparaméterek">
  <label for="S">S (MiB)</label><input id="S" type="range" min="1" max="1000" step="1" value="100"><b id="Sv"></b>
  <label for="r">r (arány)</label><input id="r" type="range" min="0.05" max="0.95" step="0.05" value="0.4"><b id="rv"></b>
  <label for="tc">t_c (s)</label><input id="tc" type="range" min="0" max="5" step="0.1" value="1"><b id="tcv"></b>
  <label for="td">t_d (s)</label><input id="td" type="range" min="0" max="5" step="0.1" value="0.5"><b id="tdv"></b>
</div>
<div class="row">
  <label><input id="st" type="checkbox"> átfedéses (streaming) modell: T_comp = max(rS/B, t_c, t_d) + 0,05 s</label>
  <button id="rst">Könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Log-log grafikon: tömörítés nélküli és tömörített átviteli idő a sávszélesség függvényében, a megtérülési küszöbbel"></svg>
<p class="small">Elméleti modell, nem mérés. Alapmodell: nincs átfedés, nincs RTT, t_c és t_d B-től független.
A streaming modellben a tömörítés, az átvitel és a kitömörítés átfed; az indulási késleltetés rögzítetten 0,05 s.
A két jelölt pont a könyv két számpéldája (B = 10 és 100 MiB/s).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",").replace("-", "−");
const g = id => +document.getElementById(id).value;
const L = 62, Rr = 540, T = 14, Bt = 280;
const X = b => L + (Rr - L) * Math.log10(b) / 3, Y = t => Bt - (Bt - T) * (Math.log10(Math.min(100, Math.max(0.1, t))) + 1) / 3;
function model(){ const S = g("S"), r = g("r"), tc = g("tc"), td = g("td"), st = document.getElementById("st").checked;
  return {S, r, tc, td, st, raw: b => S / b, comp: st ? (b => Math.max(r * S / b, tc, td) + 0.05) : (b => r * S / b + tc + td)}; }
function bstar(m){ // T_raw - T_comp csökken B-ben; felezés logaritmikus skálán
  const f = b => m.raw(b) - m.comp(b);
  let lo = 1e-4, hi = 1e7; if (f(hi) > 0) return Infinity; if (f(lo) <= 0) return 0;
  for (let i = 0; i < 200; i++) { const mid = Math.sqrt(lo * hi); if (f(mid) > 0) lo = mid; else hi = mid; }
  return Math.sqrt(lo * hi); }
function path(f){ let p = ""; for (let i = 0; i <= 300; i++) { const b = Math.pow(10, 3 * i / 300); p += (p ? "L" : "M") + X(b).toFixed(1) + "," + Y(f(b)).toFixed(1); } return p; }
function draw(){
  const m = model();
  document.getElementById("Sv").textContent = m.S + " MiB"; document.getElementById("rv").textContent = fmt(m.r, 2);
  document.getElementById("tcv").textContent = fmt(m.tc, 1) + " s"; document.getElementById("tdv").textContent = fmt(m.td, 1) + " s";
  svg.innerHTML = "";
  const defs = el("defs", {}); const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "h"); pat.setAttribute("width", 6); pat.setAttribute("height", 6); pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 6); pl.setAttribute("stroke", css("--hatch")); pl.setAttribute("stroke-width", 1.4);
  pat.appendChild(pl); defs.appendChild(pat);
  [0.1, 1, 10, 100].forEach(t => { el("line", {x1: L, y1: Y(t), x2: Rr, y2: Y(t), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11}, fmt(t, t < 1 ? 1 : 0)); });
  [1, 10, 100, 1000].forEach(b => { el("line", {x1: X(b), y1: T, x2: X(b), y2: Bt, stroke: css("--grid")}); el("text", {x: X(b), y: Bt + 15, "text-anchor": "middle", "font-size": 11}, String(b)); });
  el("line", {x1: L, y1: Bt, x2: Rr, y2: Bt, stroke: css("--line")}); el("line", {x1: L, y1: T, x2: L, y2: Bt, stroke: css("--line")});
  el("text", {x: (L + Rr) / 2, y: Bt + 34, "text-anchor": "middle", "font-size": 12}, "sávszélesség B (MiB/s, log)");
  el("text", {x: 16, y: (T + Bt) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 16 ${(T + Bt) / 2})`}, "teljes idő T (s, log)");
  const bs = bstar(m);
  // sraffozott tartomány: ahol T_comp < T_raw (B < B*)
  const bmax = Math.min(1000, bs);
  if (bmax > 1) { let up = "", dn = ""; const N = 150;
    for (let i = 0; i <= N; i++) { const b = Math.pow(10, Math.log10(bmax) * i / N); up += (up ? "L" : "M") + X(b).toFixed(1) + "," + Y(m.raw(b)).toFixed(1); }
    for (let i = N; i >= 0; i--) { const b = Math.pow(10, Math.log10(bmax) * i / N); dn += "L" + X(b).toFixed(1) + "," + Y(m.comp(b)).toFixed(1); }
    el("path", {d: up + dn + "Z", fill: "url(#h)", stroke: "none"}); }
  el("path", {d: path(m.raw), fill: "none", stroke: css("--fg"), "stroke-width": 2.4});
  el("path", {d: path(m.comp), fill: "none", stroke: css("--hl"), "stroke-width": 2.4, "stroke-dasharray": "8 5"});
  if (bs >= 1 && bs <= 1000) { el("line", {x1: X(bs), y1: T, x2: X(bs), y2: Bt, stroke: css("--fg"), "stroke-dasharray": "2 4", "stroke-width": 1.6});
    el("text", {x: X(bs) + 6, y: T + 16, "font-size": 12}, "B* = " + fmt(bs, 1) + " MiB/s"); }
  [10, 100].forEach(b => { [[m.raw(b), css("--fg")], [m.comp(b), css("--hl")]].forEach(([t, c]) => {
      el("circle", {cx: X(b), cy: Y(t), r: 4.5, fill: c}); const isC = c === css("--hl"); el("text", {x: isC ? X(b) + 8 : X(b) - 8, y: isC ? Y(t) - 8 : Y(t) + 4, "text-anchor": isC ? "start" : "end", "font-size": 11, fill: c}, fmt(t, t < 10 ? 1 : 0) + " s"); }); });
  // jelmagyarázat
  const lx = 100, ly = 214;
  el("line", {x1: lx, y1: ly, x2: lx + 26, y2: ly, stroke: css("--fg"), "stroke-width": 2.4}); el("text", {x: lx + 32, y: ly + 4, "font-size": 11}, "tömörítés nélkül: S/B");
  el("line", {x1: lx, y1: ly + 18, x2: lx + 26, y2: ly + 18, stroke: css("--hl"), "stroke-width": 2.4, "stroke-dasharray": "8 5"}); el("text", {x: lx + 32, y: ly + 22, "font-size": 11}, m.st ? "tömörítve (streaming)" : "tömörítve: rS/B + t_c + t_d");
  el("rect", {x: lx, y: ly + 30, width: 26, height: 12, fill: "url(#h)", stroke: css("--muted")}); el("text", {x: lx + 32, y: ly + 40, "font-size": 11}, "a tömörítés megéri");
  let st;
  if (!isFinite(bs)) st = "A tömörítés minden vizsgált B-nél megéri.";
  else if (bs <= 0) st = "A tömörítés egyetlen B-nél sem éri meg.";
  else st = `B* = ${fmt(bs, 1)} MiB/s: ennél lassabb hálózaton a tömörítés gyorsít, gyorsabbon lassít.`;
  st += ` B = 10: ${fmt(m.raw(10), 2)} s / ${fmt(m.comp(10), 2)} s; B = 100: ${fmt(m.raw(100), 2)} s / ${fmt(m.comp(100), 2)} s (nyers / tömörített).`;
  document.getElementById("status").textContent = st;
}
["S", "r", "tc", "td", "st"].forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("rst").onclick = () => { document.getElementById("S").value = 100; document.getElementById("r").value = 0.4; document.getElementById("tc").value = 1; document.getElementById("td").value = 0.5; document.getElementById("st").checked = false; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
