<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVL-beszúrás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kulcsok: <input id="inp" value="10, 20, 30, 15, 25" size="20" aria-label="Kulcssorozat"></label><button onclick="load()">Betöltés</button><span class="small">Határesetek:</span><button onclick="load([3,2,1])">3, 2, 1</button><button onclick="load([1,2,3])">1, 2, 3</button><button onclick="load([3,1,2])">3, 1, 2</button><button onclick="load([1,3,2])">1, 3, 2</button><button onclick="load([10,20,30,15,25])">Könyv</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="AVL-fa felépítése a 10, 20, 30, 15, 25 kulcsokkal; a 30 után a 10 sérül, bal forgatás után 20 a gyökér; a végén 20 (10 (–, 15), 30 (25, –))."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az avl_insert a 8.3 pszeudokódja (visszafelé haladó ciklus a szülőmutatókon). A négy határeset mindegyikének végén a gyökér a 2. Kezdőállapot: a könyv sorozata.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"nodes": {}, "root": null, "line": -1, "hl": null, "bad": null, "rot": null, "msg": "Üres AVL-fa (NIL magassága −1, levélé 0)."}, {"nodes": {"10": [null, null, 0]}, "root": 10, "line": 1, "hl": 10, "bad": null, "rot": null, "msg": "insert(10): BST-beszúrás, a fa gyökere"}, {"nodes": {"10": [null, null, 0]}, "root": 10, "line": 13, "hl": null, "bad": null, "rot": null, "done": 10, "msg": "insert(10) kész: gyökér 10, magasság 0"}, {"nodes": {"10": [null, 20, 0], "20": [null, null, 0]}, "root": 10, "line": 1, "hl": 20, "bad": null, "rot": null, "msg": "insert(20): BST-beszúrás, a 10 jobb gyermeke"}, {"nodes": {"10": [null, 20, 1], "20": [null, null, 0]}, "root": 10, "line": 5, "hl": 10, "bad": null, "rot": null, "msg": "insert(20): update_height(10) → h = 1, balance = -1"}, {"nodes": {"10": [null, 20, 1], "20": [null, null, 0]}, "root": 10, "line": 13, "hl": null, "bad": null, "rot": null, "done": 20, "msg": "insert(20) kész: gyökér 10, magasság 1"}, {"nodes": {"10": [null, 20, 1], "20": [null, 30, 0], "30": [null, null, 0]}, "root": 10, "line": 1, "hl": 30, "bad": null, "rot": null, "msg": "insert(30): BST-beszúrás, a 20 jobb gyermeke"}, {"nodes": {"10": [null, 20, 1], "20": [null, 30, 1], "30": [null, null, 0]}, "root": 10, "line": 5, "hl": 20, "bad": null, "rot": null, "msg": "insert(30): update_height(20) → h = 1, balance = -1"}, {"nodes": {"10": [null, 20, 2], "20": [null, 30, 1], "30": [null, null, 0]}, "root": 10, "line": 5, "hl": 10, "bad": 10, "rot": null, "msg": "insert(30): update_height(10) → h = 2, balance = -2  – SÉRÜL (|b| = 2)"}, {"nodes": {"10": [null, null, 0], "20": [10, 30, 1], "30": [null, null, 0]}, "root": 20, "line": 10, "hl": 20, "bad": null, "rot": "bal", "msg": "insert(30): bal forgatás → új részfagyökér 20"}, {"nodes": {"10": [null, null, 0], "20": [10, 30, 1], "30": [null, null, 0]}, "root": 20, "line": 13, "hl": null, "bad": null, "rot": null, "done": 30, "msg": "insert(30) kész: gyökér 20, magasság 1"}, {"nodes": {"10": [null, 15, 0], "20": [10, 30, 1], "30": [null, null, 0], "15": [null, null, 0]}, "root": 20, "line": 1, "hl": 15, "bad": null, "rot": null, "msg": "insert(15): BST-beszúrás, a 10 jobb gyermeke"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 1], "30": [null, null, 0], "15": [null, null, 0]}, "root": 20, "line": 5, "hl": 10, "bad": null, "rot": null, "msg": "insert(15): update_height(10) → h = 1, balance = -1"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [null, null, 0], "15": [null, null, 0]}, "root": 20, "line": 5, "hl": 20, "bad": null, "rot": null, "msg": "insert(15): update_height(20) → h = 2, balance = 1"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [null, null, 0], "15": [null, null, 0]}, "root": 20, "line": 13, "hl": null, "bad": null, "rot": null, "done": 15, "msg": "insert(15) kész: gyökér 20, magasság 2"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [25, null, 0], "15": [null, null, 0], "25": [null, null, 0]}, "root": 20, "line": 1, "hl": 25, "bad": null, "rot": null, "msg": "insert(25): BST-beszúrás, a 30 bal gyermeke"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [25, null, 1], "15": [null, null, 0], "25": [null, null, 0]}, "root": 20, "line": 5, "hl": 30, "bad": null, "rot": null, "msg": "insert(25): update_height(30) → h = 1, balance = 1"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [25, null, 1], "15": [null, null, 0], "25": [null, null, 0]}, "root": 20, "line": 5, "hl": 20, "bad": null, "rot": null, "msg": "insert(25): update_height(20) → h = 2, balance = 0"}, {"nodes": {"10": [null, 15, 1], "20": [10, 30, 2], "30": [25, null, 1], "15": [null, null, 0], "25": [null, null, 0]}, "root": 20, "line": 13, "hl": null, "bad": null, "rot": null, "done": 25, "msg": "insert(25) kész: gyökér 20, magasság 2"}];
const CODE = ["avl_insert(tree, key):", "    new_node = avl_bst_insert(tree, key)", "    node = new_node.parent", "    while node != NIL:", "        update_height(node)", "        balance = height(node.left) - height(node.right)", "        if balance > 1:", "            if key < node.left.key: node = right_rotate(tree, node)", "            else: node.left = left_rotate(tree, node.left); node = right_rotate(tree, node)", "        else if balance < -1:", "            if key > node.right.key: node = left_rotate(tree, node)", "            else: node.right = right_rotate(tree, node.right); node = left_rotate(tree, node)", "        node = node.parent", "    return tree.root"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let KEYSEQ = [10, 20, 30, 15, 25];
function run(keys){
  const n = {}; let root = null; const st = [];
  const H = x => x === null ? -1 : n[x].h, upd = x => { n[x].h = 1 + Math.max(H(n[x].l), H(n[x].r)); }, B = x => H(n[x].l) - H(n[x].r);
  const rot = (x, d) => { const o = d === "l" ? "r" : "l", y = n[x][o]; n[x][o] = n[y][d]; if (n[y][d] !== null) n[n[y][d]].p = x;
    const p = n[x].p; n[y].p = p; if (p === null) root = y; else if (x === n[p].l) n[p].l = y; else n[p].r = y; n[y][d] = x; n[x].p = y; upd(x); upd(y); return y; };
  const snap = () => { const nodes = {}; for (const k in n) nodes[k] = [n[k].l, n[k].r, n[k].h]; return {nodes, root}; };
  const push = (o) => st.push(Object.assign(snap(), {hl: null, bad: null, rot: null}, o));
  push({line: -1, msg: "Üres AVL-fa (NIL magassága −1, levélé 0)."});
  for (const key of keys) {
    let p = null, x = root, dup = false;
    while (x !== null) { p = x; if (key === x) { dup = true; break; } x = key < x ? n[x].l : n[x].r; }
    if (dup) { push({line: 1, hl: key, msg: `insert(${key}): duplikált kulcs → ValueError, a fa változatlan`}); continue; }
    n[key] = {l: null, r: null, p, h: 0};
    if (p === null) root = key; else if (key < p) n[p].l = key; else n[p].r = key;
    push({line: 1, hl: key, msg: `insert(${key}): BST-beszúrás` + (p !== null ? `, a ${p} ${key < p ? "bal" : "jobb"} gyermeke` : ", a fa gyökere")});
    let node = p;
    while (node !== null) {
      upd(node); const b = B(node);
      push({line: 5, hl: node, bad: Math.abs(b) > 1 ? node : null, msg: `insert(${key}): update_height(${node}) → h = ${n[node].h}, balance = ${b}` + (Math.abs(b) > 1 ? "  – SÉRÜL (|b| = 2)" : "")});
      if (b > 1) {
        if (key < n[node].l) { node = rot(node, "r"); push({line: 7, hl: node, rot: "jobb", msg: `insert(${key}): jobb forgatás → új részfagyökér ${node}`}); }
        else { rot(n[node].l, "l"); node = rot(node, "r"); push({line: 8, hl: node, rot: "bal-jobb", msg: `insert(${key}): bal-jobb (dupla) forgatás → új részfagyökér ${node}`}); }
      } else if (b < -1) {
        if (key > n[node].r) { node = rot(node, "l"); push({line: 10, hl: node, rot: "bal", msg: `insert(${key}): bal forgatás → új részfagyökér ${node}`}); }
        else { rot(n[node].r, "r"); node = rot(node, "l"); push({line: 11, hl: node, rot: "jobb-bal", msg: `insert(${key}): jobb-bal (dupla) forgatás → új részfagyökér ${node}`}); }
      }
      node = n[node].p;
    }
    push({line: 13, done: key, msg: `insert(${key}) kész: gyökér ${root}, magasság ${H(root)}`});
  }
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const pos = {}; let c = 0, dm = 0;
  const rec = (x, d) => { if (x === null || x === undefined) return; const v = s.nodes[x]; rec(v[0], d + 1); pos[x] = [c++, d]; dm = Math.max(dm, d); rec(v[1], d + 1); };
  rec(s.root, 0);
  const dx = Math.min(70, 500 / Math.max(1, c)), dy = Math.min(62, 210 / Math.max(1, dm)), X = i => 280 - (c - 1) * dx / 2 + i * dx, Y = d => 34 + d * dy;
  const Hh = x => x === null ? -1 : s.nodes[x][2];
  for (const x in pos) for (const ch of s.nodes[x].slice(0, 2)) if (ch !== null) el("line", {x1: X(pos[x][0]), y1: Y(pos[x][1]), x2: X(pos[ch][0]), y2: Y(pos[ch][1]), stroke: css("--line"), "stroke-width": 1.4});
  for (const x in pos) {
    const cx = X(pos[x][0]), cy = Y(pos[x][1]), b = Hh(s.nodes[x][0]) - Hh(s.nodes[x][1]), hl = String(s.hl) === x, bad = Math.abs(b) > 1;
    el("circle", {cx, cy, r: 17, fill: hl ? css("--hl") : css("--cell"), stroke: css("--line"), "stroke-width": hl ? 3 : 1.4});
    if (bad) el("circle", {cx, cy, r: 22, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
    el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 14, fill: hl ? css("--bg") : css("--fg")}, x);
    el("text", {x: cx + 20, y: cy - 16, "font-size": 11, "font-weight": bad ? "bold" : "normal"}, `h=${s.nodes[x][2]}, b=${b}`.replace("-", "−"));
  }
  if (s.rot) el("text", {x: 20, y: 262, "font-size": 14, "font-weight": "bold"}, "↻ " + s.rot + " forgatás");
  el("text", {x: 20, y: 290, "font-size": 11, fill: css("--muted")}, "h = magasság (NIL: −1), b = h(bal) − h(jobb) · kiemelt = aktuális node · narancs dupla kör = |b| = 2");
}
function load(seq){
  const msg = document.getElementById("err");
  const keys = seq || document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (keys.length < 1 || keys.length > 15 || keys.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–15 egész kulcsot adjon meg."; return; }
  msg.textContent = ""; if (seq) document.getElementById("inp").value = seq.join(", "); KEYSEQ = keys; setSteps(run(keys));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
