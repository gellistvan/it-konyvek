<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRU-gyorsítótár lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>c = <input id="cap" value="2" size="2" aria-label="Kapacitás"></label><label>műveletek: <input id="ops" value="put(1, 1); put(2, 2); get(1); put(3, 3)" size="36" aria-label="Műveletsor"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('cap').value=0;document.getElementById('ops').value='put(1, 5); get(1)';load()">Példa: c = 0</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="LRU-gyorsítótár hash-táblával és kétirányú listával: put(1,1), put(2,2), get(1), put(3,3) után a lista head, 3, 1, tail; a 2 kiesik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Lista eleje = legfrissebb, vége = legrégebbi; head/tail őrszem. Kezdőállapot: a fejezet LRUCache-kódjának futása c = 2 kapacitással. c = 0 esetén a beszúrt csomópont azonnal kiesik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"lst": [], "keys": [], "cur": null, "gone": null, "moved": false, "line": -1, "msg": "Üres gyorsítótár, c = 2: head ⇄ tail", "cap": 2}, {"lst": [[1, 1]], "keys": [1], "cur": 1, "gone": null, "moved": false, "line": 12, "msg": "put(1, 1): új csomópont a hash-táblába és a lista elejére", "cap": 2}, {"lst": [[2, 2], [1, 1]], "keys": [1, 2], "cur": 2, "gone": null, "moved": false, "line": 12, "msg": "put(2, 2): új csomópont a hash-táblába és a lista elejére", "cap": 2}, {"lst": [[2, 2], [1, 1]], "keys": [1, 2], "cur": 1, "gone": null, "moved": false, "line": 2, "msg": "get(1): találat a hash-táblában → csomópont 1:1", "cap": 2}, {"lst": [[2, 2]], "keys": [1, 2], "cur": 1, "gone": null, "moved": true, "line": 3, "msg": "get(1): _remove – a 1 kicsatolva a listából", "cap": 2}, {"lst": [[1, 1], [2, 2]], "keys": [1, 2], "cur": 1, "gone": null, "moved": false, "line": 4, "msg": "get(1): _add_to_front – 1 a lista elejére (legfrissebb); érték = 1", "cap": 2, "res": "get(1) = 1"}, {"lst": [[3, 3], [1, 1], [2, 2]], "keys": [1, 2, 3], "cur": 3, "gone": null, "moved": false, "line": 12, "msg": "put(3, 3): új csomópont a hash-táblába és a lista elejére", "cap": 2}, {"lst": [[3, 3], [1, 1]], "keys": [1, 3], "cur": null, "gone": [2, 2], "moved": false, "line": 15, "msg": "put(3, 3): 3 > c = 2 → a lista vége (tail.prev = 2) kiesik, a hash-táblából is törölve", "cap": 2}];
const CODE = ["def get(self, key):", "    if key not in self.cache: return _MISS", "    node = self.cache[key]", "    self._remove(node)", "    self._add_to_front(node)", "    return node.value", "def put(self, key, value):", "    if key in self.cache:", "        node.value = value; self._remove(node)", "        self._add_to_front(node)", "    else:", "        new_node = _Node(key, value); self.cache[key] = new_node", "        self._add_to_front(new_node)", "        if len(self.cache) > self.capacity:", "            to_remove = self.tail.prev; self._remove(to_remove)", "            del self.cache[to_remove.key]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 230");
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  const n = s.lst.length, W = 60, H = 34, gap = 22, x0 = 150, y0 = 70;
  const X = i => x0 + i * (W + gap);
  const box = (x, y, t, o) => { el("rect", Object.assign({x, y, width: W, height: H, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2}, o || {}));
    el("text", {x: x + W / 2, y: y + 22, "text-anchor": "middle", "font-size": 14}, t); };
  box(X(0), y0, "head", {fill: css("--cellhl")});
  s.lst.forEach((kv, i) => box(X(i + 1), y0, kv[0] + ":" + kv[1], kv[0] === s.cur ? {stroke: css("--hl"), "stroke-width": 4} : {}));
  box(X(n + 1), y0, "tail", {fill: css("--cellhl")});
  for (let i = 0; i <= n; i++) el("line", {x1: X(i) + W + 2, y1: y0 + H / 2, x2: X(i + 1) - 2, y2: y0 + H / 2, stroke: css("--line"), "stroke-width": 1.4, "marker-end": "url(#ah)", "marker-start": "url(#ah)"});
  el("text", {x: X(1), y: y0 - 14, "font-size": 12, fill: css("--muted")}, "← legfrissebb … legrégebbi →");
  el("text", {x: 20, y: 24, "font-size": 12, fill: css("--muted")}, "hash-tábla");
  const keys = s.keys.slice(); if (s.gone && !keys.includes(s.gone[0])) keys.push(s.gone[0]); keys.sort((a, b) => a - b);
  keys.forEach((k, i) => { const y = 34 + i * 30, gone = s.gone && s.gone[0] === k;
    el("rect", {x: 20, y, width: 50, height: 24, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 45, y: y + 17, "text-anchor": "middle", "font-size": 13, "text-decoration": gone ? "line-through" : "none"}, String(k));
    if (gone) el("line", {x1: 16, y1: y + 12, x2: 74, y2: y + 12, stroke: css("--line"), "stroke-width": 2});
    else { const j = s.lst.findIndex(kv => kv[0] === k); if (j >= 0) el("path", {d: `M70,${y + 12} C110,${y + 12} ${X(j + 1) + W / 2 - 30},${y0 + H + 40} ${X(j + 1) + W / 2},${y0 + H + 3}`, fill: "none", stroke: css("--muted"), "stroke-width": 1.2, "marker-end": "url(#ah)"}); } });
  if (s.gone) { const x = X(n + 1) + W + 30; box(x, y0, s.gone[0] + ":" + s.gone[1], {"stroke-dasharray": "5 4"});
    el("line", {x1: x - 4, y1: y0 - 4, x2: x + W + 4, y2: y0 + H + 4, stroke: css("--line"), "stroke-width": 2});
    el("text", {x: x + W / 2, y: y0 + H + 20, "text-anchor": "middle", "font-size": 12, "font-style": "italic"}, "kiesett"); }
  if (s.moved) el("text", {x: 280, y: 200, "text-anchor": "middle", "font-size": 13, "font-style": "italic"}, "a csomópont kicsatolva, a hash-tábla még rá mutat");
  if (s.res !== undefined) el("text", {x: 550, y: 24, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, s.res);
  el("text", {x: 550, y: 220, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, `kapacitás c = ${s.cap}`);
}
function simulate(cap, ops){
  const steps = [], lst = [], cache = {};
  const snap = (line, msg, cur, gone, moved, res) => steps.push({lst: lst.map(x => x.slice()), keys: Object.keys(cache).map(Number), cur: cur === undefined ? null : cur, gone: gone || null, moved: !!moved, line, msg, cap, res});
  snap(-1, `Üres gyorsítótár, c = ${cap}: head ⇄ tail`);
  for (const op of ops) {
    if (op[0] === "get") { const k = op[1];
      if (!(k in cache)) { snap(1, `get(${k}): nincs a hash-táblában → _MISS`, null, null, false, `get(${k}) = _MISS`); continue; }
      const i = lst.findIndex(x => x[0] === k), node = lst[i]; snap(2, `get(${k}): találat a hash-táblában → csomópont ${k}:${node[1]}`, k);
      lst.splice(i, 1); snap(3, `get(${k}): _remove – a ${k} kicsatolva a listából`, k, null, true);
      lst.unshift(node); snap(4, `get(${k}): _add_to_front – ${k} a lista elejére (legfrissebb); érték = ${node[1]}`, k, null, false, `get(${k}) = ${node[1]}`); }
    else { const [_, k, v] = op;
      if (k in cache) { const i = lst.findIndex(x => x[0] === k), node = lst[i]; node[1] = v; lst.splice(i, 1);
        snap(8, `put(${k}, ${v}): létező kulcs, érték frissítve, kicsatolva`, k, null, true); lst.unshift(node); snap(9, `put(${k}, ${v}): a lista elejére fűzve`, k); }
      else { cache[k] = true; lst.unshift([k, v]); snap(12, `put(${k}, ${v}): új csomópont a hash-táblába és a lista elejére`, k);
        if (Object.keys(cache).length > cap) { const old = lst.pop(); delete cache[old[0]];
          snap(15, `put(${k}, ${v}): ${Object.keys(cache).length + 1} > c = ${cap} → a lista vége (tail.prev = ${old[0]}) kiesik, a hash-táblából is törölve`, null, old); } } } }
  return steps;
}
function load(){
  const e = document.getElementById("err"), cap = parseInt(document.getElementById("cap").value, 10), ops = [];
  if (!(cap >= 0 && cap <= 5)) { e.textContent = "Kapacitás: 0–5."; return; }
  for (const part of document.getElementById("ops").value.split(";")) { const t = part.trim(); if (!t) continue;
    let m = t.match(/^get\s*\(\s*(-?\d+)\s*\)$/i); if (m) { ops.push(["get", +m[1]]); continue; }
    m = t.match(/^put\s*\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)$/i); if (m) { ops.push(["put", +m[1], +m[2]]); continue; }
    e.textContent = "Hibás művelet: „" + t + "” (get(k) vagy put(k, v))."; return; }
  if (ops.length > 12) { e.textContent = "Legfeljebb 12 művelet."; return; }
  e.textContent = ""; setSteps(simulate(cap, ops));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
