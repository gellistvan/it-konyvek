<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verem tömbös és láncolt reprezentációban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Műveletek: <input id="inp" value="push 10, push 20, push 30, pop, push 40" size="40" aria-label="Saját műveletsor (push x / pop, vesszővel elválasztva)"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('inp').value='push 1, push 2, push 3, push 4, push 5, push 6';load()">Példa: túlcsordulás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Balra ötcellás tömb a top mutatóval, jobbra láncolt lista a head mutatóval; minden művelet mindkét reprezentációt egyszerre módosítja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Pszeudokód a 2.3.4–2.3.5-ből (1-től indexelt A[1..N], N = 5). Mindkét pszeudokód aktuális sora kiemelve. Túlcsordulás csak a tömbös reprezentációban van; ekkor a láncolt verem tovább nő, a két állapot eltér. Kezdőállapot: a könyv műveletsora.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"A": [null, null, null, null, null], "top": 0, "lst": [], "op": "kezdet", "line": -1, "line2": -1, "aerr": null, "lerr": null, "msg": "Kezdet: top = 0, head = nil (üres verem)"}, {"A": [10, null, null, null, null], "top": 1, "lst": [10], "op": "push(10)", "line": 2, "line2": 7, "aerr": null, "lerr": null, "msg": "1. lépés, push(10); tömbös: top = 1, A[1..1] = [10]; láncolt: head → 10"}, {"A": [10, 20, null, null, null], "top": 2, "lst": [20, 10], "op": "push(20)", "line": 2, "line2": 7, "aerr": null, "lerr": null, "msg": "2. lépés, push(20); tömbös: top = 2, A[1..2] = [10, 20]; láncolt: head → 20 → 10"}, {"A": [10, 20, 30, null, null], "top": 3, "lst": [30, 20, 10], "op": "push(30)", "line": 2, "line2": 7, "aerr": null, "lerr": null, "msg": "3. lépés, push(30); tömbös: top = 3, A[1..3] = [10, 20, 30]; láncolt: head → 30 → 20 → 10"}, {"A": [10, 20, 30, null, null], "top": 2, "lst": [20, 10], "op": "pop()", "line": 4, "line2": 9, "aerr": null, "lerr": null, "msg": "4. lépés, pop() → 30; tömbös: top = 2, A[1..2] = [10, 20]; láncolt: head → 20 → 10"}, {"A": [10, 20, 40, null, null], "top": 3, "lst": [40, 20, 10], "op": "push(40)", "line": 2, "line2": 7, "aerr": null, "lerr": null, "msg": "5. lépés, push(40); tömbös: top = 3, A[1..3] = [10, 20, 40]; láncolt: head → 40 → 20 → 10"}];
const CODE = ["// tömbös verem, A[1..N], top", "push(x): if top = N then hiba \"túlcsordulás\"", "  top ← top + 1; A[top] ← x", "pop(): if top = 0 then hiba \"alulcsordulás\"", "  x ← A[top]; top ← top - 1; return x", "// láncolt listás verem, head", "push(x): új ← new Node; új.érték ← x", "  új.next ← head; head ← új", "pop(): if head = nil then hiba \"alulcsordulás\"", "  x ← head.érték; head ← head.next; return x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  const L2 = document.getElementById("L" + s.line2); if (L2) L2.classList.add("on");
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.2"/></pattern>'
    + '<pattern id="dp" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1" fill="' + css("--muted") + '"/></pattern></defs>';
  svg.setAttribute("viewBox", "0 0 560 300");
  const n = s.A.length, ch = Math.min(36, 220 / n), cw = 70, cx = 70, yb = 262;
  el("text", {x: cx + cw/2, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "tömbös verem");
  for (let i = 0; i < n; i++) {
    const y = yb - (i + 1) * ch, occ = i < s.top, v = s.A[i];
    el("rect", {x: cx, y, width: cw, height: ch, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    el("rect", {x: cx, y, width: cw, height: ch, fill: occ ? "url(#hp)" : "url(#dp)", stroke: css("--line"), "stroke-width": 1.2});
    if (v !== null) {
      if (occ) el("rect", {x: cx + cw/2 - 16, y: y + ch/2 - 10, width: 32, height: 20, fill: css("--bg")});
      el("text", {x: cx + cw/2, y: y + ch/2 + 6, "text-anchor": "middle", "font-size": 16, "font-weight": occ ? "bold" : "normal", opacity: occ ? 1 : 0.45}, String(v));
      if (!occ) el("line", {x1: cx + 15, y1: y + ch - 5, x2: cx + cw - 15, y2: y + 5, stroke: css("--line"), "stroke-width": 1.4});
    }
    el("text", {x: cx - 8, y: y + ch/2 + 5, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, "A[" + (i + 1) + "]");
  }
  const ty = s.top > 0 ? yb - (s.top - 0.5) * ch : yb + 8;
  el("line", {x1: cx + cw + 60, y1: ty, x2: cx + cw + 8, y2: ty, stroke: css("--line"), "stroke-width": 2});
  el("path", {d: `M${cx+cw+16},${ty-6} L${cx+cw+4},${ty} L${cx+cw+16},${ty+6} Z`, fill: css("--line")});
  el("text", {x: cx + cw + 64, y: ty + 5, "font-size": 14}, "top = " + s.top);
  if (s.aerr) {
    el("rect", {x: cx - 6, y: yb - n * ch - 6, width: cw + 12, height: n * ch + 12, fill: "none", stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "7 5"});
    el("text", {x: cx + cw/2, y: 40, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, 'hiba "' + s.aerr + '"');
  }
  // láncolt lista
  const lx = 286, ly = 130;
  el("text", {x: 420, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "láncolt listás verem");
  el("text", {x: lx - 6, y: ly + 20, "font-size": 14, "font-weight": "bold"}, "head");
  const show = s.lst.slice(0, 3), nw = 40, pw = 16, gap = 14;
  let x = lx + 44;
  el("line", {x1: lx + 36, y1: ly + 15, x2: x - 2, y2: ly + 15, stroke: css("--line"), "stroke-width": 1.6});
  if (!show.length) el("text", {x: x + 4, y: ly + 20, "font-size": 14}, "nil");
  show.forEach((v, j) => {
    const yy = ly + (j % 2) * 0;
    el("rect", {x, y: yy, width: nw, height: 30, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    el("rect", {x, y: yy, width: nw, height: 30, fill: "url(#hp)", stroke: css("--line"), "stroke-width": 1.2});
    el("rect", {x: x + nw/2 - 15, y: yy + 6, width: 30, height: 18, fill: css("--bg")});
    el("text", {x: x + nw/2, y: yy + 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, String(v));
    el("rect", {x: x + nw, y: yy, width: pw, height: 30, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    if (j === s.lst.length - 1) el("text", {x: x + nw + pw/2, y: yy + 45, "text-anchor": "middle", "font-size": 11}, "nil");
    else if (j < show.length - 1) {
      el("line", {x1: x + nw + pw/2, y1: yy + 15, x2: x + nw + pw + gap - 2, y2: yy + 15, stroke: css("--line"), "stroke-width": 1.6});
      el("path", {d: `M${x+nw+pw+gap-8},${yy+10} L${x+nw+pw+gap},${yy+15} L${x+nw+pw+gap-8},${yy+20} Z`, fill: css("--line")});
    } else el("text", {x: x + nw + pw/2, y: yy + 45, "text-anchor": "middle", "font-size": 12}, "→ … (+" + (s.lst.length - 3) + ")");
    x += nw + pw + gap;
  });
  el("path", {d: `M${lx+44-8},${ly+10} L${lx+44},${ly+15} L${lx+44-8},${ly+20} Z`, fill: css("--line")});
  el("text", {x: 420, y: 205, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "lista hossza = " + s.lst.length + " = a verem mérete");
  if (s.lerr) el("text", {x: 420, y: 90, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, 'hiba "' + s.lerr + '"');
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11.5, fill: css("--muted")},
     "sraffozott = a verem eleme · pontozott = tartalék · áthúzott = érvénytelen rekesz · szaggatott keret = hiba");
}
function trace(ops, n){
  let A = Array(n).fill(null), top = 0, head = [];
  const st = [{A: A.slice(), top: 0, lst: [], line: -1, line2: -1, aerr: null, lerr: null, msg: "Kezdet: top = 0, head = nil (üres verem)"}];
  for (const o of ops) {
    let aerr = null, lerr = null, res = null, line, line2, lab;
    if (o[0] === "push") {
      lab = "push(" + o[1] + ")";
      if (top === n) { aerr = "túlcsordulás"; line = 1; } else { top++; A[top-1] = o[1]; line = 2; }
      head = [o[1]].concat(head); line2 = 7;
    } else {
      lab = "pop()";
      if (top === 0) { aerr = "alulcsordulás"; line = 3; } else { res = A[top-1]; top--; line = 4; }
      if (!head.length) { lerr = "alulcsordulás"; line2 = 8; } else { if (res === null) res = head[0]; head = head.slice(1); line2 = 9; }
    }
    const msg = st.length + ". lépés, " + lab + (res !== null ? " → " + res : "") + (aerr ? '; tömbös: hiba "' + aerr + '"' : "")
      + (lerr ? '; láncolt: hiba "' + lerr + '"' : "") + "; tömbös: top = " + top + ", A[1.." + top + "] = [" + A.slice(0, top).join(", ")
      + "]; láncolt: head → " + (head.length ? head.join(" → ") : "nil");
    st.push({A: A.slice(), top, lst: head.slice(), line, line2, aerr, lerr, msg});
  }
  return st;
}
function load(){
  const e = document.getElementById("err");
  const toks = document.getElementById("inp").value.split(/[,;\n]+/).map(t => t.trim()).filter(t => t);
  const ops = [];
  for (const t of toks) {
    let m;
    if ((m = t.match(/^push\s*\(?\s*(-?\d+)\s*\)?$/i))) ops.push(["push", +m[1]]);
    else if (/^pop\s*(\(\s*\))?$/i.test(t)) ops.push(["pop", null]);
    else { e.textContent = "Ismeretlen művelet: " + t; return; }
  }
  if (ops.length > 30) { e.textContent = "Legfeljebb 30 művelet."; return; }
  e.textContent = ""; setSteps(trace(ops, 5));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
