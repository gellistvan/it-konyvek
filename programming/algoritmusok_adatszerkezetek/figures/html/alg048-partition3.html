<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARTITION3 lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A = <input id="arr" value="8, 4, 2, 5, 1, 9, 7" size="20" aria-label="Tömb"></label><label>x = <input id="x" value="7" size="3" aria-label="Pivot"></label><button onclick="runP()">PARTITION3</button><label>k = <input id="k" value="4" size="2" aria-label="k"></label><button onclick="runQ()">QUICKSELECT folytatással</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét cellás tömb lépésenként; négy zóna (kisebb, egyenlő, feldolgozatlan, nagyobb) és az lt, i, gt mutatók; a végén 4, 2, 5, 1 | 7 | 9, 8."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt; invariáns: A[bal..lt−1] < x, A[lt..i−1] = x, A[gt+1..jobb] > x. Kezdőállapot: a 13.3.4 első trace-e (x = 7). A QUICKSELECT gomb az első hívásban a megadott x-et, a további hívásokban a résztömb első elemét használja pivotként (mint a könyv második lépése); k = 4 → 5.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [8, 4, 2, 5, 1, 9, 7], "bal": 1, "jobb": 7, "lt": 1, "i": 1, "gt": 7, "x": 7, "sw": null, "line": 1, "msg": "Kezdetben: [8, 4, 2, 5, 1, 9, 7], lt = 1, i = 1, gt = 7 (x = 7)"}, {"a": [7, 4, 2, 5, 1, 9, 8], "bal": 1, "jobb": 7, "lt": 1, "i": 1, "gt": 6, "x": 7, "sw": [1, 7], "line": 6, "msg": "i = 1: 8 > 7, csere A[1] ↔ A[7] → [7, 4, 2, 5, 1, 9, 8], gt = 6"}, {"a": [7, 4, 2, 5, 1, 9, 8], "bal": 1, "jobb": 7, "lt": 1, "i": 2, "gt": 6, "x": 7, "sw": null, "line": 7, "msg": "i = 1: 7 = 7, i = 2"}, {"a": [4, 7, 2, 5, 1, 9, 8], "bal": 1, "jobb": 7, "lt": 2, "i": 3, "gt": 6, "x": 7, "sw": [1, 2], "line": 4, "msg": "i = 2: 4 < 7, csere A[1] ↔ A[2] → [4, 7, 2, 5, 1, 9, 8], lt = 2, i = 3"}, {"a": [4, 2, 7, 5, 1, 9, 8], "bal": 1, "jobb": 7, "lt": 3, "i": 4, "gt": 6, "x": 7, "sw": [2, 3], "line": 4, "msg": "i = 3: 2 < 7, csere A[2] ↔ A[3] → [4, 2, 7, 5, 1, 9, 8], lt = 3, i = 4"}, {"a": [4, 2, 5, 7, 1, 9, 8], "bal": 1, "jobb": 7, "lt": 4, "i": 5, "gt": 6, "x": 7, "sw": [3, 4], "line": 4, "msg": "i = 4: 5 < 7, csere A[3] ↔ A[4] → [4, 2, 5, 7, 1, 9, 8], lt = 4, i = 5"}, {"a": [4, 2, 5, 1, 7, 9, 8], "bal": 1, "jobb": 7, "lt": 5, "i": 6, "gt": 6, "x": 7, "sw": [4, 5], "line": 4, "msg": "i = 5: 1 < 7, csere A[4] ↔ A[5] → [4, 2, 5, 1, 7, 9, 8], lt = 5, i = 6"}, {"a": [4, 2, 5, 1, 7, 9, 8], "bal": 1, "jobb": 7, "lt": 5, "i": 6, "gt": 5, "x": 7, "sw": [6, 6], "line": 6, "msg": "i = 6: 9 > 7, csere A[6] ↔ A[6] (önmaga) → [4, 2, 5, 1, 7, 9, 8], gt = 5"}, {"a": [4, 2, 5, 1, 7, 9, 8], "bal": 1, "jobb": 7, "lt": 5, "i": 6, "gt": 5, "x": 7, "sw": null, "line": 8, "msg": "i = 6 > gt = 5: leállás; lt = 5, gt = 5"}];
const CODE = ["PARTITION3(A, bal, jobb, x):", "    lt := bal; i := bal; gt := jobb", "    WHILE i <= gt DO", "        IF A[i] < x THEN", "            CSERE(A[lt], A[i]); lt++; i++", "        ELSEIF A[i] > x THEN", "            CSERE(A[i], A[gt]); gt--", "        ELSE i++", "    RETURN (lt, gt)", "QUICKSELECT(A, bal, jobb, k):", "    IF bal == jobb THEN RETURN A[bal]", "    (lt, gt) := PARTITION3(A, bal, jobb, pivot)", "    IF lt <= k <= gt THEN RETURN A[k]", "    ELSEIF k < lt THEN QUICKSELECT(A, bal, lt−1, k)", "    ELSE QUICKSELECT(A, gt+1, jobb, k)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  const a = s.a, n = a.length, W = Math.min(60, 500 / n), x0 = (560 - n * W) / 2, y0 = 100;
  svg.setAttribute("viewBox", "0 0 560 250");
  svg.innerHTML = '<defs><pattern id="pl" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.6"/></pattern>'
    + '<pattern id="pg" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="' + css("--muted") + '"/></pattern>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const cx = j => x0 + (j - 1) * W + W / 2;
  for (let j = 1; j <= n; j++) { const out = j < s.bal || j > s.jobb; let z = "un";
    if (!out && s.lt !== null) z = j < s.lt ? "lt" : j < s.i ? "eq" : j <= s.gt ? "un" : "gt";
    el("rect", {x: x0 + (j - 1) * W, y: y0, width: W, height: W, fill: out ? css("--bg") : z === "eq" ? css("--cellhl") : css("--cell"), stroke: out ? css("--muted") : css("--line"), "stroke-dasharray": out ? "3 3" : "none"});
    if (!out && (z === "lt" || z === "gt")) el("rect", {x: x0 + (j - 1) * W, y: y0, width: W, height: W, fill: z === "lt" ? "url(#pl)" : "url(#pg)", stroke: "none"});
    el("text", {x: cx(j), y: y0 + W / 2 + 6, "text-anchor": "middle", "font-size": 18, fill: out ? css("--muted") : css("--fg"), "font-weight": "bold"}, String(a[j - 1]));
    el("text", {x: cx(j), y: y0 - 30, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(j)); }
  if (s.lt !== null) {
    const ptr = (p, lab, up, dx) => { if (p < 1 || p > n) return; const X = cx(p) + dx;
      if (up) { el("path", {d: `M${X - 7},${y0 - 22} L${X + 7},${y0 - 22} L${X},${y0 - 8} z`, fill: css("--fg")}); el("text", {x: X, y: y0 - 40, "text-anchor": "middle", "font-size": 13}, lab); }
      else { if (lab === "i") el("circle", {cx: X, cy: y0 + W + 14, r: 6, fill: "none", stroke: css("--fg"), "stroke-width": 2}); else el("path", {d: `M${X - 7},${y0 + W + 22} L${X + 7},${y0 + W + 22} L${X},${y0 + W + 8} z`, fill: css("--fg")});
        el("text", {x: X, y: y0 + W + 40, "text-anchor": "middle", "font-size": 13}, lab); } };
    const same = s.lt === s.i; ptr(s.lt, "lt", false, same ? -14 : 0); ptr(s.i, "i", false, same ? 14 : 0); ptr(s.gt, "gt", true, 0);
    if (s.i > n) el("text", {x: cx(n) + W, y: y0 + W + 40, "font-size": 13}, "i = " + s.i);
    el("text", {x: 10, y: 22, "font-size": 14}, `x = ${s.x}, résztömb [${s.bal}..${s.jobb}], lt = ${s.lt}, i = ${s.i}, gt = ${s.gt}`); }
  if (s.sw) { const [p, q] = s.sw; el("path", {d: p === q ? `M${cx(p) - 10},${y0 - 2} C${cx(p) - 20},${y0 - 30} ${cx(p) + 20},${y0 - 30} ${cx(p) + 10},${y0 - 2}` : `M${cx(p)},${y0 - 2} Q${(cx(p) + cx(q)) / 2},${y0 - 60} ${cx(q)},${y0 - 2}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "marker-end": "url(#ah)", "marker-start": "url(#ah)"}); }
  if (s.res !== undefined) el("text", {x: 280, y: 235, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, "QUICKSELECT eredménye: " + s.res);
  el("text", {x: 10, y: 205, "font-size": 11.5, fill: css("--muted")}, "átlós = < x · szürke = = x · fehér = feldolgozatlan · pontozott = > x · szaggatott = a résztömbön kívül");
}
function partition3(A, bal, jobb, x, steps, pre){ let lt = bal, i = bal, gt = jobb; const sl = () => A.slice(bal - 1, jobb).join(", ");
  const snap = (line, msg, sw) => steps.push({a: A.slice(), bal, jobb, lt, i, gt, x, sw: sw || null, line, msg: pre + msg});
  snap(1, `Kezdetben: [${sl()}], lt = ${lt}, i = ${i}, gt = ${gt} (x = ${x})`);
  while (i <= gt) { const v = A[i - 1];
    if (v < x) { [A[lt - 1], A[i - 1]] = [A[i - 1], A[lt - 1]]; const sw = [lt, i]; lt++; i++; snap(4, `i = ${i - 1}: ${v} < ${x}, csere A[${sw[0]}] ↔ A[${sw[1]}] → [${sl()}], lt = ${lt}, i = ${i}`, sw); }
    else if (v > x) { [A[i - 1], A[gt - 1]] = [A[gt - 1], A[i - 1]]; const sw = [i, gt]; gt--; snap(6, `i = ${i}: ${v} > ${x}, csere A[${sw[0]}] ↔ A[${sw[1]}]` + (sw[0] === sw[1] ? " (önmaga)" : "") + ` → [${sl()}], gt = ${gt}`, sw); }
    else { i++; snap(7, `i = ${i - 1}: ${v} = ${x}, i = ${i}`); } }
  snap(8, `i = ${i} > gt = ${gt}: leállás; lt = ${lt}, gt = ${gt}`); return [lt, gt]; }
function quickselect(A, bal, jobb, k, pivot, steps){
  for (let guard = 0; guard < 50; guard++) {
    if (bal === jobb) { steps.push({a: A.slice(), bal, jobb, lt: null, i: null, gt: null, x: null, sw: null, line: 10, msg: `QUICKSELECT: bal = jobb = ${bal}, egy elem → visszaadja A[${bal}] = ${A[bal - 1]}`, res: A[bal - 1]}); return; }
    const x = pivot !== null ? pivot : A[bal - 1]; pivot = null;
    const [lt, gt] = partition3(A, bal, jobb, x, steps, `QUICKSELECT([${bal}..${jobb}], k = ${k}), x = ${x}: `), last = steps[steps.length - 1];
    if (lt <= k && k <= gt) { steps.push(Object.assign({}, last, {line: 12, msg: `lt = ${lt} ≤ k = ${k} ≤ gt = ${gt} → visszaadja A[${k}] = ${A[k - 1]}`, res: A[k - 1]})); return; }
    if (k < lt) { steps.push(Object.assign({}, last, {line: 13, msg: `k = ${k} < lt = ${lt} → bal oldal [${bal}..${lt - 1}]`})); jobb = lt - 1; }
    else { steps.push(Object.assign({}, last, {line: 14, msg: `k = ${k} > gt = ${gt} → jobb oldal [${gt + 1}..${jobb}]`})); bal = gt + 1; } } }
function readIn(){ const e = document.getElementById("err"), a = document.getElementById("arr").value.split(/[ ,;]+/).filter(t => t).map(Number), x = Number(document.getElementById("x").value);
  if (a.length < 1 || a.length > 10 || a.some(v => !Number.isInteger(v))) { e.textContent = "1–10 egész számot adjon meg."; return null; }
  if (!a.includes(x)) { e.textContent = "Az x legyen a tömb egyik eleme."; return null; } e.textContent = ""; return [a, x]; }
function runP(){ const r = readIn(); if (!r) return; const st = []; partition3(r[0].slice(), 1, r[0].length, r[1], st, ""); setSteps(st); }
function runQ(){ const r = readIn(); if (!r) return; const k = parseInt(document.getElementById("k").value, 10);
  if (!(k >= 1 && k <= r[0].length)) { document.getElementById("err").textContent = "1 ≤ k ≤ n."; return; }
  const st = []; quickselect(r[0].slice(), 1, r[0].length, k, r[1], st); setSteps(st); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
