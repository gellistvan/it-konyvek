<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediánok mediánja: ötös csoportok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n <input id="n" type="range" min="5" max="60" value="25" aria-label="n" oninput="document.getElementById('nv').textContent=this.value"> <b id="nv">25</b></label><label>seed <input id="seed" value="1" size="4" aria-label="Seed"></label><button onclick="load('perm')">Véletlen bemenet</button><button onclick="load('new')">Új seed</button><button onclick="load('book')">A könyv példája</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt ötös csoport oszlopokban, a mediánok középen; a mediánok mediánja, a 13, kiemelve; a biztosan nagyobb vagy egyenlő és a biztosan kisebb vagy egyenlő elemek mintázattal, majd a partíció két oldala."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">5 elemű csoportok, különböző kulcsok. Kezdőállapot: a könyv n = 25 elemű példája (x = 13). Véletlen bemenet: az 1..n mulberry32 + Fisher–Yates permutációja, rögzített seeddel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 25, "m": 5, "line": -1, "cols": [[12, 3, 25, 7, 18], [1, 20, 9, 14, 6], [22, 5, 16, 11, 24], [8, 19, 2, 23, 13], [15, 10, 21, 4, 17]], "med": false, "x": null, "ranges": false, "part": false, "msg": "1. Csoportosítás: a könyv n = 25 elemű példája, 5 csoport (az utolsó 5 elemű)"}, {"n": 25, "m": 5, "line": -1, "cols": [[3, 7, 12, 18, 25], [1, 6, 9, 14, 20], [5, 11, 16, 22, 24], [2, 8, 13, 19, 23], [4, 10, 15, 17, 21]], "med": false, "x": null, "ranges": false, "part": false, "msg": "2. Minden csoport rendezése (alulról felfelé növekvő)"}, {"n": 25, "m": 5, "line": -1, "cols": [[3, 7, 12, 18, 25], [1, 6, 9, 14, 20], [5, 11, 16, 22, 24], [2, 8, 13, 19, 23], [4, 10, 15, 17, 21]], "med": true, "x": null, "ranges": false, "part": false, "msg": "3. Csoportmediánok kiemelve, középre igazítva: 12, 9, 16, 13, 15"}, {"n": 25, "m": 5, "line": -1, "cols": [[1, 6, 9, 14, 20], [3, 7, 12, 18, 25], [2, 8, 13, 19, 23], [4, 10, 15, 17, 21], [5, 11, 16, 22, 24]], "med": true, "x": 13, "ranges": false, "part": false, "msg": "4. Oszlopok rendezése a mediánjuk szerint (9 ≤ 12 ≤ 13 ≤ 15 ≤ 16); pivot x = a mediánok ⌈m/2⌉ = 3-edik eleme = 13"}, {"n": 25, "m": 5, "line": -1, "cols": [[1, 6, 9, 14, 20], [3, 7, 12, 18, 25], [2, 8, 13, 19, 23], [4, 10, 15, 17, 21], [5, 11, 16, 22, 24]], "med": true, "x": 13, "ranges": true, "part": false, "ge": [13, 15, 16, 17, 19, 21, 22, 23, 24], "le": [1, 2, 3, 6, 7, 8, 9, 12, 13], "msg": "5. Biztosan ≥ x: 9 elem, biztosan ≤ x: 9 elem; mindkettő ≥ 3n/10 − 6 = 1,5"}, {"n": 25, "m": 5, "line": -1, "cols": [[1, 6, 9, 14, 20], [3, 7, 12, 18, 25], [2, 8, 13, 19, 23], [4, 10, 15, 17, 21], [5, 11, 16, 22, 24]], "med": true, "x": 13, "ranges": true, "part": true, "ge": [13, 15, 16, 17, 19, 21, 22, 23, 24], "le": [1, 2, 3, 6, 7, 8, 9, 12, 13], "L": 12, "R": 12, "msg": "6. Partíció x = 13 körül: |{< x}| = 12, |{> x}| = 12; a rekurzív részfeladat legfeljebb 12 ≤ 7n/10 + 6 = 23,5 elemű"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function perm(n, seed){ const r = mulberry32(seed), a = []; for (let i = 1; i <= n; i++) a.push(i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function f1(v){ return v.toFixed(1).replace(".", ",").replace("-", "−"); }
function stepsFor(a, label){
  const n = a.length, groups = []; for (let i = 0; i < n; i += 5) groups.push(a.slice(i, i + 5));
  const sg = groups.map(g => g.slice().sort((p, q) => p - q)), med = sg.map(g => g[Math.floor((g.length - 1) / 2)]), m = med.length;
  const order = [...Array(m).keys()].sort((p, q) => med[p] - med[q]), x = med.slice().sort((p, q) => p - q)[Math.ceil(m / 2) - 1];
  const xc = order.indexOf(med.indexOf(x)), cols = order.map(c => sg[c]), ge = new Set(), le = new Set();
  cols.forEach((g, ci) => { const mi = Math.floor((g.length - 1) / 2); if (ci >= xc) g.slice(mi).forEach(v => ge.add(v)); if (ci <= xc) g.slice(0, mi + 1).forEach(v => le.add(v)); });
  const L = a.filter(v => v < x).length, R = a.filter(v => v > x).length;
  const b = {n, m};
  return [
    Object.assign({}, b, {cols: groups, med: false, x: null, ranges: false, part: false, line: -1, msg: `1. Csoportosítás: ${label}, ${m} csoport (az utolsó ${groups[m-1].length} elemű)`}),
    Object.assign({}, b, {cols: sg, med: false, x: null, ranges: false, part: false, line: -1, msg: "2. Minden csoport rendezése (alulról felfelé növekvő)"}),
    Object.assign({}, b, {cols: sg, med: true, x: null, ranges: false, part: false, line: -1, msg: "3. Csoportmediánok kiemelve, középre igazítva: " + med.join(", ")}),
    Object.assign({}, b, {cols, med: true, x, ranges: false, part: false, line: -1, msg: `4. Oszlopok rendezése a mediánjuk szerint (${order.map(c => med[c]).join(" ≤ ")}); pivot x = a mediánok ⌈m/2⌉ = ${Math.ceil(m/2)}-edik eleme = ${x}`}),
    Object.assign({}, b, {cols, med: true, x, ranges: true, part: false, ge: [...ge], le: [...le], line: -1,
      msg: `5. Biztosan ≥ x: ${ge.size} elem, biztosan ≤ x: ${le.size} elem; mindkettő ≥ 3n/10 − 6 = ${f1(3 * n / 10 - 6)}`}),
    Object.assign({}, b, {cols, med: true, x, ranges: true, part: true, ge: [...ge], le: [...le], L, R, line: -1,
      msg: `6. Partíció x = ${x} körül: |{< x}| = ${L}, |{> x}| = ${R}; a rekurzív részfeladat legfeljebb ${Math.max(L, R)} ≤ 7n/10 + 6 = ${f1(7 * n / 10 + 6)} elemű`})];
}
function render(s){
  const m = s.cols.length, W = Math.min(46, 520 / m), H = Math.min(30, W * 0.7), x0 = (560 - m * W) / 2, ymid = 120;
  svg.setAttribute("viewBox", "0 0 560 320");
  svg.innerHTML = '<defs><pattern id="pge" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.6"/></pattern>'
    + '<pattern id="ple" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.2" fill="' + css("--muted") + '"/></pattern>'
    + '<pattern id="pbo" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0,0 L7,7 M7,0 L0,7" stroke="' + css("--muted") + '" stroke-width="1.2"/></pattern></defs>';
  const ge = new Set(s.ge || []), le = new Set(s.le || []);
  s.cols.forEach((g, ci) => { const mi = s.med ? Math.floor((g.length - 1) / 2) : 2;
    g.forEach((v, r) => { const y = ymid - (r - mi) * H, X = x0 + ci * W + 2, isMed = s.med && r === Math.floor((g.length - 1) / 2);
      el("rect", {x: X, y, width: W - 4, height: H - 2, fill: css("--cell"), stroke: css("--line"), "stroke-width": isMed ? 3 : 1});
      if (s.ranges) { const a = ge.has(v), b = le.has(v); if (a || b) el("rect", {x: X, y, width: W - 4, height: H - 2, fill: a && b ? "url(#pbo)" : a ? "url(#pge)" : "url(#ple)", stroke: "none"}); }
      if (s.x === v) el("rect", {x: X - 4, y: y - 4, width: W + 4, height: H + 6, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
      el("text", {x: X + (W - 4) / 2, y: y + H / 2 + 4, "text-anchor": "middle", "font-size": Math.min(14, W / 3), "font-weight": isMed ? "bold" : "normal"}, String(v)); }); });
  if (s.ranges) el("text", {x: 280, y: 238, "text-anchor": "middle", "font-size": 13}, `biztosan ≥ x: ${ge.size}   ·   biztosan ≤ x: ${le.size}`);
  if (s.part) {
    const tot = s.L + 1 + s.R, sc = 480 / tot, y = 252;
    el("rect", {x: 40, y, width: s.L * sc, height: 18, fill: "url(#ple)", stroke: css("--line")});
    el("rect", {x: 40 + s.L * sc, y, width: sc, height: 18, fill: css("--hl"), stroke: css("--line")});
    el("rect", {x: 40 + (s.L + 1) * sc, y, width: s.R * sc, height: 18, fill: "url(#pge)", stroke: css("--line")});
    el("text", {x: 40 + s.L * sc / 2, y: y + 32, "text-anchor": "middle", "font-size": 12}, `< x: ${s.L}`);
    el("text", {x: 40 + (s.L + 1) * sc + s.R * sc / 2, y: y + 32, "text-anchor": "middle", "font-size": 12}, `> x: ${s.R}`);
  }
  el("text", {x: 280, y: 312, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "átlós: biztosan ≥ x · pontozott: biztosan ≤ x · kereszt: mindkettő · vastag: csoportmedián · kék keret: x");
}
const BOOK = [12, 3, 25, 7, 18, 1, 20, 9, 14, 6, 22, 5, 16, 11, 24, 8, 19, 2, 23, 13, 15, 10, 21, 4, 17];
function load(mode){
  if (mode === "book") { setSteps(stepsFor(BOOK, "a könyv n = 25 elemű példája")); return; }
  const n = +document.getElementById("n").value; document.getElementById("nv").textContent = n;
  let seed = parseInt(document.getElementById("seed").value, 10); if (isNaN(seed)) seed = 1;
  if (mode === "new") { seed = seed + 1; document.getElementById("seed").value = seed; }
  setSteps(stepsFor(perm(n, seed), `az 1..${n} seed = ${seed} permutációja`));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
