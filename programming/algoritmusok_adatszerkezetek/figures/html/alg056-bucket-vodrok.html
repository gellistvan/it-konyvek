<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bucket sort vödrei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bemenet: <select id="src" onchange="load()" aria-label="Bemenet"><option value="ex" selected>könyv példája (n = 10)</option><option value="torz">torz (2.1), növekvő</option><option value="torzr">torz, csökkenő</option><option value="own">saját</option></select></label><label>Vödrök: <select id="mf" onchange="load()" aria-label="Vödörszám"><option value="0.5">n/2</option><option value="1" selected>n</option><option value="2">2n</option></select></label><label>Saját: <input id="inp" value="0,78; 0,17; 0,39; 0,26; 0,72" size="26" aria-label="Saját kulcsok"></label><button onclick="document.getElementById('src').value='own';load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Számegyenes tíz szelettel; a tíz kulcs egyenként a vödrébe kerül, majd a vödrök beszúró rendezéssel rendeződnek és összefűződnek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú vödörindex = ⌊m·x⌋ + 1 (15.3.5); kezdőállapot: a könyv n = 10 elemű példája, m = n. A torz bemenetnél (n = 100) mind a 100 elem a B[51]-be kerül; a beszúró rendezés költsége a sorrendtől függ: növekvő sorrendben 99, csökkenőben 4950 összehasonlítás (számlálás, nem mérés).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"B": [[], [], [], [], [], [], [], [], [], []], "cur": null, "idx": null, "phase": "start", "sorted": [], "nc": 0, "res": null, "line": 1, "msg": "Kezdet: n = 10, m = 10 vödör, B[1..10] üres"}, {"B": [[], [], [], [], [], [], [], [0.78], [], []], "cur": 1, "idx": 8, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 1: A[1] = 0,78, idx = ⌊10 · 0,78⌋ + 1 = 8 → B[8]"}, {"B": [[], [0.17], [], [], [], [], [], [0.78], [], []], "cur": 2, "idx": 2, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 2: A[2] = 0,17, idx = ⌊10 · 0,17⌋ + 1 = 2 → B[2]"}, {"B": [[], [0.17], [], [0.39], [], [], [], [0.78], [], []], "cur": 3, "idx": 4, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 3: A[3] = 0,39, idx = ⌊10 · 0,39⌋ + 1 = 4 → B[4]"}, {"B": [[], [0.17], [0.26], [0.39], [], [], [], [0.78], [], []], "cur": 4, "idx": 3, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 4: A[4] = 0,26, idx = ⌊10 · 0,26⌋ + 1 = 3 → B[3]"}, {"B": [[], [0.17], [0.26], [0.39], [], [], [], [0.78, 0.72], [], []], "cur": 5, "idx": 8, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 5: A[5] = 0,72, idx = ⌊10 · 0,72⌋ + 1 = 8 → B[8]"}, {"B": [[], [0.17], [0.26], [0.39], [], [], [], [0.78, 0.72], [], [0.94]], "cur": 6, "idx": 10, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 6: A[6] = 0,94, idx = ⌊10 · 0,94⌋ + 1 = 10 → B[10]"}, {"B": [[], [0.17], [0.26, 0.21], [0.39], [], [], [], [0.78, 0.72], [], [0.94]], "cur": 7, "idx": 3, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 7: A[7] = 0,21, idx = ⌊10 · 0,21⌋ + 1 = 3 → B[3]"}, {"B": [[], [0.17, 0.12], [0.26, 0.21], [0.39], [], [], [], [0.78, 0.72], [], [0.94]], "cur": 8, "idx": 2, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 8: A[8] = 0,12, idx = ⌊10 · 0,12⌋ + 1 = 2 → B[2]"}, {"B": [[], [0.17, 0.12], [0.26, 0.21, 0.23], [0.39], [], [], [], [0.78, 0.72], [], [0.94]], "cur": 9, "idx": 3, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 9: A[9] = 0,23, idx = ⌊10 · 0,23⌋ + 1 = 3 → B[3]"}, {"B": [[], [0.17, 0.12], [0.26, 0.21, 0.23], [0.39], [], [], [0.68], [0.78, 0.72], [], [0.94]], "cur": 10, "idx": 7, "phase": "szétosztás", "sorted": [], "nc": 0, "res": null, "line": 4, "msg": "i = 10: A[10] = 0,68, idx = ⌊10 · 0,68⌋ + 1 = 7 → B[7]"}, {"B": [[], [0.12, 0.17], [0.26, 0.21, 0.23], [0.39], [], [], [0.68], [0.78, 0.72], [], [0.94]], "cur": null, "idx": 2, "phase": "rendezés", "sorted": [2], "nc": 1, "res": null, "line": 6, "msg": "B[2] beszúró rendezéssel: [0,12; 0,17], 1 összehasonlítás; eddig összesen 1"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.78, 0.72], [], [0.94]], "cur": null, "idx": 3, "phase": "rendezés", "sorted": [2, 3], "nc": 4, "res": null, "line": 6, "msg": "B[3] beszúró rendezéssel: [0,21; 0,23; 0,26], 3 összehasonlítás; eddig összesen 4"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.78, 0.72], [], [0.94]], "cur": null, "idx": 4, "phase": "rendezés", "sorted": [2, 3, 4], "nc": 4, "res": null, "line": 6, "msg": "B[4] beszúró rendezéssel: [0,39], 0 összehasonlítás; eddig összesen 4"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.78, 0.72], [], [0.94]], "cur": null, "idx": 7, "phase": "rendezés", "sorted": [2, 3, 4, 7], "nc": 4, "res": null, "line": 6, "msg": "B[7] beszúró rendezéssel: [0,68], 0 összehasonlítás; eddig összesen 4"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.72, 0.78], [], [0.94]], "cur": null, "idx": 8, "phase": "rendezés", "sorted": [2, 3, 4, 7, 8], "nc": 5, "res": null, "line": 6, "msg": "B[8] beszúró rendezéssel: [0,72; 0,78], 1 összehasonlítás; eddig összesen 5"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.72, 0.78], [], [0.94]], "cur": null, "idx": 10, "phase": "rendezés", "sorted": [2, 3, 4, 7, 8, 10], "nc": 5, "res": null, "line": 6, "msg": "B[10] beszúró rendezéssel: [0,94], 0 összehasonlítás; eddig összesen 5"}, {"B": [[], [0.12, 0.17], [0.21, 0.23, 0.26], [0.39], [], [], [0.68], [0.72, 0.78], [], [0.94]], "cur": null, "idx": null, "phase": "összefűzés", "sorted": [2, 3, 4, 7, 8, 10], "nc": 5, "res": [0.12, 0.17, 0.21, 0.23, 0.26, 0.39, 0.68, 0.72, 0.78, 0.94], "line": 7, "msg": "Összefűzés: [0,12; 0,17; 0,21; 0,23; 0,26; 0,39; 0,68; 0,72; 0,78; 0,94]"}];
const CODE = ["BucketSort(A, n):   // m vödör (alapesetben m = n)", "  B[1..m] = üres listák", "  for i = 1 to n:", "    idx = floor(m * A[i]) + 1", "    B[idx].append(A[i])", "  for j = 1 to m:", "    beszúró rendezés B[j]-n", "  A = B[1] + B[2] + ... + B[m]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = [0.78, 0.17, 0.39, 0.26, 0.72, 0.94, 0.21, 0.12, 0.23, 0.68];
function c2(x){ let s = x.toFixed(6).replace(/0+$/, ""); if (s.split(".")[1].length < 2) s = x.toFixed(2); return s.replace(".", ","); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const m = s.B.length, n = CUR.length, L = 30, R = 530, Wd = (R - L) / m;
  // számegyenes
  el("line", {x1: L, y1: 70, x2: R, y2: 70, stroke: css("--line"), "stroke-width": 1.5});
  for (let j = 0; j <= m; j++) if (m <= 20 || j % 10 === 0) el("line", {x1: L + j*Wd, y1: 64, x2: L + j*Wd, y2: 76, stroke: css("--line")});
  el("text", {x: L, y: 92, "text-anchor": "middle", "font-size": 11}, "0"); el("text", {x: R, y: 92, "text-anchor": "middle", "font-size": 11}, "1");
  const shown = s.phase === "start" ? 0 : (s.phase === "szétosztás" ? s.cur : n);
  if (n <= 20) CUR.forEach((x, i) => { if (i >= shown) return;
    const on = s.phase === "szétosztás" && i + 1 === s.cur;
    el("circle", {cx: L + x * (R - L), cy: 70, r: on ? 6 : 4, fill: on ? css("--hl2") : css("--fg")});
    if (on) el("text", {x: L + x * (R - L), y: 52, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, c2(x));
  });
  else el("text", {x: 280, y: 52, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, `${n} kulcs (a pontok összeérnek)`);
  // vödrök: kis n-nél listák, egyébként hisztogram
  const yb = 290, mx = Math.max(1, ...s.B.map(b => b.length));
  if (n <= 20 && m <= 20) {
    s.B.forEach((b, j) => {
      const X = L + j*Wd, on = s.idx === j + 1;
      el("rect", {x: X + 2, y: 120, width: Wd - 4, height: yb - 120, fill: b.length ? css("--cell") : css("--cellhl"), stroke: css("--line"),
                  "stroke-width": on ? 3 : 1, "stroke-dasharray": b.length ? "none" : "3 3"});
      el("text", {x: X + Wd/2, y: yb + 15, "text-anchor": "middle", "font-size": m > 10 ? 9 : 11, fill: css("--muted")}, String(j + 1));
      b.forEach((v, h) => el("text", {x: X + Wd/2, y: yb - 10 - h * 18, "text-anchor": "middle", "font-size": m > 10 ? 9 : 12,
                                      "font-weight": s.sorted.includes(j + 1) ? "bold" : "normal"}, c2(v)));
    });
  } else {
    s.B.forEach((b, j) => { if (!b.length) return;
      const h = b.length / mx * 150;
      el("rect", {x: L + j*Wd, y: yb - h, width: Math.max(Wd, 1.5), height: h, fill: css("--fg")});
    });
    el("line", {x1: L, y1: yb, x2: R, y2: yb, stroke: css("--line")});
    el("text", {x: 280, y: yb + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, `vödörméret-hisztogram (${m} vödör, legnagyobb: ${mx})`);
  }
  el("text", {x: 280, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"},
     `fázis: ${s.phase} · n = ${n} · m = ${m} vödör · összehasonlítás a vödrökben: ${s.nc}`);
  if (s.res && n <= 12) el("text", {x: 280, y: 112, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, s.res.map(c2).join("; "));
}
function bidx(x, m){ return Math.floor(Math.round(m * x * 1e9) / 1e9) + 1; }
function bucket(a, m){
  const n = a.length; m = m || n;
  const B = Array.from({length: m}, () => []);
  const cp = () => B.map(b => b.slice());
  const out = [{B: cp(), cur: null, idx: null, phase: "start", sorted: [], nc: 0, res: null, line: 1, msg: `Kezdet: n = ${n}, m = ${m} vödör, B[1..${m}] üres`}];
  a.forEach((x, i0) => { const i = i0 + 1, j = bidx(x, m); B[j-1].push(x);
    out.push({B: cp(), cur: i, idx: j, phase: "szétosztás", sorted: [], nc: 0, res: null, line: 4, msg: `i = ${i}: A[${i}] = ${c2(x)}, idx = ⌊${m} · ${c2(x)}⌋ + 1 = ${j} → B[${j}]`}); });
  let nc = 0; const done = [];
  for (let j = 1; j <= m; j++) {
    const b = B[j-1]; if (!b.length) continue;
    let c = 0;
    for (let p = 1; p < b.length; p++) { const key = b[p]; let q = p - 1;
      while (q >= 0) { c++; if (b[q] > key) { b[q+1] = b[q]; q--; } else break; }
      b[q+1] = key; }
    nc += c; done.push(j);
    out.push({B: cp(), cur: null, idx: j, phase: "rendezés", sorted: done.slice(), nc, res: null, line: 6,
              msg: `B[${j}] beszúró rendezéssel: [${b.map(c2).join("; ")}], ${c} összehasonlítás; eddig összesen ${nc}`});
  }
  const res = [].concat(...B);
  out.push({B: cp(), cur: null, idx: null, phase: "összefűzés", sorted: done.slice(), nc, res, line: 7,
            msg: n <= 20 ? `Összefűzés: [${res.map(c2).join("; ")}]` : `Összefűzés: ${n} elem rendezve; összehasonlítások a vödrökben: ${nc}`});
  return out;
}
function load(){
  const e = document.getElementById("err"), kind = document.getElementById("src").value;
  let a;
  if (kind === "ex") a = [0.78, 0.17, 0.39, 0.26, 0.72, 0.94, 0.21, 0.12, 0.23, 0.68];
  else if (kind === "torz") a = Array.from({length: 100}, (_, i) => 0.5 + (i + 1) * 1e-6);
  else if (kind === "torzr") a = Array.from({length: 100}, (_, i) => 0.5 + (100 - i) * 1e-6);
  else {
    a = document.getElementById("inp").value.split(/[ ;]+/).filter(x => x !== "").map(x => Number(x.replace(",", ".")));
    if (a.length < 2 || a.length > 20 || a.some(x => !(x >= 0 && x < 1))) { e.textContent = "2–20 számot adjon meg a [0; 1) intervallumból, szóközzel vagy pontosvesszővel elválasztva (tizedesvessző megengedett)."; return; }
  }
  const f = +document.getElementById("mf").value, m = Math.max(1, Math.round(a.length * f));
  e.textContent = ""; CUR = a; setSteps(bucket(a, m));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
