<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ütközéskezelés m = 7-re</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Módszer: <select id="meth" onchange="load()" aria-label="Módszer"><option value="chain">láncolás</option><option value="lin" selected>lineáris</option><option value="quad">kvadratikus</option><option value="dbl">kettős</option></select></label><label>Kulcsok: <input id="keys" value="10, 22, 31, 4, 15, 28" size="18" aria-label="Kulcsok"></label><label>m = <input id="mm" type="number" value="7" min="2" max="13" style="width:3.5em" aria-label="Táblaméret"></label><label>Törlés: <input id="del" value="22" size="3" aria-label="Törlendő kulcs"></label><select id="mode" onchange="load()" aria-label="Törlés módja"><option value="sir">sírkővel (†)</option><option value="nil">hibásan NIL-lel</option></select><label>majd keresés: <input id="find" value="15" size="3" aria-label="Keresett kulcs"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hétrésű hash tábla; a kulcsok próbánként kerülnek a helyükre, az ütközések jelölve; a 22 törlése után a 15 keresése a sírkövön átlép."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">0-tól indexelt rések (a fejezet pszeudokódja). Kezdőállapot: a könyv példája lineáris próbával, majd Delete(22) sírkővel és Search(15). A „hibásan NIL-lel” mód a 7.2.18 rossz törlését mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1, "T": [null, null, null, null, null, null, null], "L": [[], [], [], [], [], [], []], "m": 7, "probes": 0, "n": 0, "chain": false}];
const CODE = ["Insert(T, k):", "  első_szabad = -1; i = 0", "  while i < m:  j = h(k, i)", "    if T[j] == NIL: T[első_szabad≠-1 ? első_szabad : j] = k; return", "    else if T[j] == TÖRÖLT: első_szabad ← j, ha még -1", "    else if T[j].kulcs == k: frissítés; return", "    i = i + 1", "  if első_szabad ≠ -1: T[első_szabad] = k  else hiba „tábla tele”", "Search(T, k):  i = 0", "  while i < m:  j = h(k, i)", "    if T[j] == NIL: return NIL", "    else if T[j] ≠ TÖRÖLT és T[j].kulcs == k: return j", "    i = i + 1", "Delete(T, k): ... T[j] = TÖRÖLT   (hibás változat: T[j] = NIL)", "Láncolás: Insert = a lista fejére fűzés, O(1)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CFG = {method: "lin", m: 7, keys: [10, 22, 31, 4, 15, 28], del: 22, mode: "sir", find: 15};
function hf(meth, k, i, m){ const b = ((k % m) + m) % m; if (meth === "lin") return (b + i) % m; if (meth === "quad") return (b + i*i) % m; return (b + i * (1 + (((k % 5) + 5) % 5))) % m; }
function trace(c){
  const m = c.m, st = []; let probes = 0, n = 0;
  const T = new Array(m).fill(null), L = Array.from({length: m}, () => []);
  const name = {chain: "láncolás", lin: "lineáris próba", quad: "kvadratikus próba (c₁ = 0, c₂ = 1)", dbl: "kettős hashelés, h₂(k) = 1 + (k mod 5)"}[c.method];
  const push = (o) => st.push(Object.assign({T: T.slice(), L: L.map(x => x.slice()), m, probes, n, chain: c.method === "chain"}, o));
  push({msg: `Üres tábla, m = ${m}; módszer: ${name}.`, line: -1});
  for (const k of c.keys) {
    if (c.method === "chain") { const j = ((k % m) + m) % m; L[j].unshift(k); n++; probes++;
      push({msg: `Insert(${k}): h′(${k}) = ${j}, a ${j}. lista fejére. α = n/m = ${n}/${m}`, line: 14, j, ok: true}); continue; }
    let first = -1, done = false;
    for (let i = 0; i < m && !done; i++) {
      const j = hf(c.method, k, i, m); probes++;
      if (T[j] === null) { const at = first === -1 ? j : first; T[at] = k; n++; done = true;
        push({msg: `Insert(${k}), ${i+1}. próba: h(${k}, ${i}) = ${j} szabad → T[${at}] = ${k}. Próbák eddig: ${probes}, α = ${n}/${m}`, line: 3, j, ok: true}); }
      else if (T[j] === "†") { if (first === -1) first = j; push({msg: `Insert(${k}), ${i+1}. próba: h(${k}, ${i}) = ${j} sírkő – megjegyezzük, tovább keresünk`, line: 4, j}); }
      else if (T[j] === k) { done = true; push({msg: `Insert(${k}), ${i+1}. próba: a kulcs már bent van (T[${j}]) – frissítés`, line: 5, j, ok: true}); }
      else push({msg: `Insert(${k}), ${i+1}. próba: h(${k}, ${i}) = ${j} foglalt (${T[j]}) – ütközés`, line: 6, j, bad: true});
    }
    if (!done) { if (first !== -1) { T[first] = k; n++; push({msg: `Insert(${k}): a sorozat végigért, T[${first}] = ${k} (sírkő helyére)`, line: 7, j: first, ok: true}); }
      else push({msg: `Insert(${k}): HIBA – „tábla tele” vagy a próbasorozat nem fedi le a táblát`, line: 7, err: true}); }
  }
  if (c.method === "chain") {
    if (c.del !== null) { const j = ((c.del % m) + m) % m, p = L[j].indexOf(c.del); if (p >= 0) { L[j].splice(p, 1); n--; }
      push({msg: `Delete(${c.del}) láncolásnál: egyszerűen kifűzzük a ${j}. listából – nincs szükség sírkőre.`, line: 14, j}); }
    if (c.find !== null) { const j = ((c.find % m) + m) % m;
      push({msg: `Search(${c.find}): a ${j}. lista bejárása → ${L[j].includes(c.find) ? "megtalálva" : "nem található"}.`, line: 14, j, ok: L[j].includes(c.find)}); }
    return st;
  }
  if (c.del !== null) {
    for (let i = 0; i < m; i++) { const j = hf(c.method, c.del, i, m);
      if (T[j] === null) { push({msg: `Delete(${c.del}): NIL a ${j}. résen – nem található`, line: 13, j}); break; }
      if (T[j] === c.del) { T[j] = c.mode === "sir" ? "†" : null; n--;
        push({msg: `Delete(${c.del}): T[${j}] = ${c.mode === "sir" ? "TÖRÖLT (†, sírkő)" : "NIL (HIBÁS: a próbasorozat megszakad)"}`, line: 13, j, bad: c.mode !== "sir"}); break; }
    }
  }
  if (c.find !== null) {
    for (let i = 0; i < m; i++) { const j = hf(c.method, c.find, i, m); probes++;
      if (T[j] === null) { push({msg: `Search(${c.find}), ${i+1}. próba: T[${j}] = NIL → megáll: „nem található”` + (c.mode === "nil" ? " (a NIL-törlés miatt HIBÁS eredmény, ha a kulcs bent van)" : ""), line: 10, j, bad: true}); break; }
      if (T[j] !== "†" && T[j] === c.find) { push({msg: `Search(${c.find}), ${i+1}. próba: T[${j}] = ${c.find} → megtalálva (${j}. rés)`, line: 11, j, ok: true}); break; }
      push({msg: `Search(${c.find}), ${i+1}. próba: T[${j}] = ${T[j] === "†" ? "† – átlépjük" : T[j] + " – más kulcs, tovább"}`, line: 12, j});
    }
  }
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const m = s.m, w = Math.min(64, 520 / m), x0 = (560 - m*w) / 2, y0 = 70;
  for (let j = 0; j < m; j++) {
    const v = s.chain ? null : s.T[j], occ = v !== null && v !== "†", cur = s.j === j;
    el("rect", {x: x0 + j*w, y: y0, width: w, height: 44, fill: occ ? css("--cellhl") : css("--cell"), stroke: cur ? (s.bad ? css("--hl2") : css("--hl")) : css("--line"), "stroke-width": cur ? 4 : 1.2, "stroke-dasharray": cur && s.bad ? "6 3" : ""});
    el("text", {x: x0 + j*w + w/2, y: y0 + 29, "text-anchor": "middle", "font-size": 18, "font-weight": v === "†" ? "bold" : "normal"}, s.chain ? (s.L[j].length ? "•" : "–") : (v === null ? "–" : String(v)));
    el("text", {x: x0 + j*w + w/2, y: y0 - 8, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(j));
    if (s.chain) s.L[j].forEach((k, d) => { el("rect", {x: x0 + j*w + 6, y: y0 + 56 + d*30, width: w - 12, height: 24, rx: 5, fill: css("--cell"), stroke: css("--line")});
      el("text", {x: x0 + j*w + w/2, y: y0 + 73 + d*30, "text-anchor": "middle", "font-size": 14}, String(k)); });
  }
  if (s.j !== undefined && s.j !== null) el("text", {x: x0 + s.j*w + w/2, y: y0 - 26, "text-anchor": "middle", "font-size": 18}, s.bad ? "✗" : (s.ok ? "✓" : "▼"));
  el("text", {x: 20, y: 270, "font-size": 14}, `próbák száma: ${s.probes} · α = n/m = ${s.n}/${s.m} = ${(s.n/s.m).toFixed(2).replace(".", ",")}`);
  el("text", {x: 20, y: 292, "font-size": 12, fill: css("--muted")}, "szürke = foglalt · – = NIL · † = TÖRÖLT (sírkő) · ✗ ütközés / NIL-megállás · ✓ siker");
}
function load(){
  const msg = document.getElementById("err");
  const keys = document.getElementById("keys").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const m = +document.getElementById("mm").value;
  const dv = document.getElementById("del").value.trim(), fv = document.getElementById("find").value.trim();
  if (!Number.isInteger(m) || m < 2 || m > 13) { msg.textContent = "2 ≤ m ≤ 13 legyen."; return; }
  if (keys.length < 1 || keys.length > m || keys.some(x => !Number.isInteger(x) || x < 0 || x > 9999)) { msg.textContent = `1–${m} nemnegatív egész kulcsot adjon meg.`; return; }
  msg.textContent = "";
  CFG = {method: document.getElementById("meth").value, m, keys, del: dv === "" ? null : +dv, mode: document.getElementById("mode").value, find: fv === "" ? null : +fv};
  setSteps(trace(CFG));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };

STEPS = trace(CFG); 


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
