<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strassen: hozzájárulási térkép</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>A = [[<input id="a11" value="1" size="2" aria-label="A11" oninput="show(k)">, <input id="a12" value="2" size="2" aria-label="A12" oninput="show(k)">], [<input id="a21" value="3" size="2" aria-label="A21" oninput="show(k)">, <input id="a22" value="4" size="2" aria-label="A22" oninput="show(k)">]]</span><span>B = [[<input id="b11" value="5" size="2" aria-label="B11" oninput="show(k)">, <input id="b12" value="6" size="2" aria-label="B12" oninput="show(k)">], [<input id="b21" value="7" size="2" aria-label="B21" oninput="show(k)">, <input id="b22" value="8" size="2" aria-label="B22" oninput="show(k)">]]</span><button onclick="setMats([1,2,3,4],[5,6,7,8])">Számpélda (2.6)</button><button onclick="setMats([2,0,1,3],[1,4,2,5])">Másik példa</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A hét Strassen-szorzat dobozai és a négy C-blokk; a kiválasztott blokkhoz vezető előjeles nyilak és a kifejtési táblázat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 2.2 Strassen-változata; a tényezők sorrendje nem cserélhető. Kezdőállapot: a 2.6 számpéldája (A = [[1, 2], [3, 4]], B = [[5, 6], [7, 8]]): C11 = 19, C12 = 22, C21 = 43, C22 = 50.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"blk": null, "line": -1, "msg": "Áttekintés: hét szorzat, négy célblokk. Válasszon C-blokkot (léptetés vagy kattintás)."}, {"blk": "11", "line": -1, "msg": "C11 = M1 + M4 − M5 + M7; a kifejtésben csak A11·B11 + A12·B21 marad, a számpéldán C11 = 19"}, {"blk": "12", "line": -1, "msg": "C12 = M3 + M5; a kifejtésben csak A11·B12 + A12·B22 marad, a számpéldán C12 = 22"}, {"blk": "21", "line": -1, "msg": "C21 = M2 + M4; a kifejtésben csak A21·B11 + A22·B21 marad, a számpéldán C21 = 43"}, {"blk": "22", "line": -1, "msg": "C22 = M1 − M2 + M3 + M6; a kifejtésben csak A21·B12 + A22·B22 marad, a számpéldán C22 = 50"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const S = {"M": {"1": [[[1, "11"], [1, "22"]], [[1, "11"], [1, "22"]]], "2": [[[1, "21"], [1, "22"]], [[1, "11"]]], "3": [[[1, "11"]], [[1, "12"], [-1, "22"]]], "4": [[[1, "22"]], [[1, "21"], [-1, "11"]]], "5": [[[1, "11"], [1, "12"]], [[1, "22"]]], "6": [[[1, "21"], [-1, "11"]], [[1, "11"], [1, "12"]]], "7": [[[1, "12"], [-1, "22"]], [[1, "21"], [1, "22"]]]}, "C": {"11": [[1, 1], [4, 1], [5, -1], [7, 1]], "12": [[3, 1], [5, 1]], "21": [[2, 1], [4, 1]], "22": [[1, 1], [2, -1], [3, 1], [6, 1]]}, "T": {"1": "(A11+A22)(B11+B22)", "2": "(A21+A22)·B11", "3": "A11·(B12−B22)", "4": "A22·(B21−B11)", "5": "(A11+A12)·B22", "6": "(A21−A11)(B11+B12)", "7": "(A12−A22)(B21+B22)"}};
function gv(id){ const v = Number(document.getElementById(id).value); return Number.isFinite(v) ? v : 0; }
function mats(){ return [[[gv("a11"), gv("a12")], [gv("a21"), gv("a22")]], [[gv("b11"), gv("b12")], [gv("b21"), gv("b22")]]]; }
function g(X, s){ return X[+s[0] - 1][+s[1] - 1]; }
function expand(i){ const o = {}; S.M[i][0].forEach(([sa, a]) => S.M[i][1].forEach(([sb, b]) => { const k = "A" + a + "B" + b; o[k] = (o[k] || 0) + sa * sb; })); return o; }
function fmt(v){ return String(v).replace("-", "−"); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 420");
  const [A, B] = mats(), m = {}, c = {};
  for (const i in S.M) m[i] = S.M[i][0].reduce((t, [sg, x]) => t + sg * g(A, x), 0) * S.M[i][1].reduce((t, [sg, x]) => t + sg * g(B, x), 0);
  for (const k in S.C) c[k] = S.C[k].reduce((t, [i, sg]) => t + sg * m[i], 0);
  const cls = [[A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]], [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]];
  const sel = s.blk, used = sel ? S.C[sel].map(t => String(t[0])) : [];
  const MY = i => 20 + (i - 1) * 36, CP = {"11": [470, 8], "12": [470, 74], "21": [470, 140], "22": [470, 206]};
  for (const i in S.M) {
    const on = used.includes(i);
    el("rect", {x: 6, y: MY(+i), width: 238, height: 28, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: 12, y: MY(+i) + 19, "font-size": 12.5, "font-weight": on ? "bold" : "normal"}, `M${i} = ${S.T[i]} = ${fmt(m[i])}`);
  }
  for (const k in S.C) S.C[k].forEach(([i, sg], q) => {
    const on = k === sel, [x, y] = CP[k], ty = y + 10 + q * 14;
    el("line", {x1: 244, y1: MY(i) + 14, x2: x - 50, y2: ty, stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 2.6 : 0.8, "stroke-dasharray": sg > 0 ? "" : "6 4", opacity: sel && !on ? 0.35 : 1});
    el("text", {x: x - 47, y: ty + 4, "font-size": 12, "font-weight": "bold", fill: on ? css("--hl2") : css("--muted")}, sg > 0 ? "+" : "−");
  });
  for (const k in CP) {
    const [x, y] = CP[k], on = k === sel;
    const r = el("rect", {x: x - 36, y, width: 120, height: 60, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3.5 : 1.4, style: "cursor:pointer", tabindex: 0, role: "button", "aria-label": "C" + k + " kiválasztása"});
    r.addEventListener("click", () => show(["11", "12", "21", "22"].indexOf(k) + 1));
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") show(["11", "12", "21", "22"].indexOf(k) + 1); });
    el("text", {x: x + 24, y: y + 20, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", "pointer-events": "none"}, "C" + k + " = " + fmt(c[k]));
    el("text", {x: x + 24, y: y + 36, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted"), "pointer-events": "none"}, ["bal felső", "jobb felső", "bal alsó", "jobb alsó"][["11", "12", "21", "22"].indexOf(k)]);
    const ok = c[k] === cls[+k[0] - 1][+k[1] - 1];
    el("text", {x: x + 24, y: y + 53, "text-anchor": "middle", "font-size": 11, fill: css("--muted"), "pointer-events": "none"}, (ok ? "✔ klasszikus " : "✘ klasszikus ") + fmt(cls[+k[0] - 1][+k[1] - 1]));
  }
  el("text", {x: 6, y: 284, "font-size": 11, fill: css("--muted")}, "folytonos = + · szaggatott = − · kattintson egy C-blokkra (vagy Tab + Enter)");
  if (!sel) { el("text", {x: 6, y: 310, "font-size": 13}, "Válasszon C-blokkot a kifejtési táblázathoz."); return; }
  const rows = S.C[sel].map(([i, sg]) => { const e = expand(i), o = {}; for (const k in e) o[k] = sg * e[k]; return [i, sg, o]; });
  const cols = [...new Set(rows.flatMap(r => Object.keys(r[2])))].sort(), cw = Math.min(56, 470 / cols.length), x0 = 70, y0 = 312;
  cols.forEach((k, j) => el("text", {x: x0 + j*cw + cw/2, y: y0 - 6, "text-anchor": "middle", "font-size": 10.5}, k.slice(0, 3) + "·" + k.slice(3)));
  rows.forEach(([i, sg, o], r) => {
    el("text", {x: 6, y: y0 + r*18 + 13, "font-size": 12}, (sg > 0 ? "+" : "−") + "M" + i);
    cols.forEach((k, j) => { el("rect", {x: x0 + j*cw, y: y0 + r*18, width: cw, height: 18, fill: css("--cell"), stroke: css("--line"), "stroke-width": 0.6});
      if (o[k]) el("text", {x: x0 + j*cw + cw/2, y: y0 + r*18 + 13, "text-anchor": "middle", "font-size": 11.5}, (o[k] > 0 ? "+" : "−") + Math.abs(o[k])); });
  });
  const yt = y0 + rows.length * 18 + 2;
  el("text", {x: 6, y: yt + 13, "font-size": 12, "font-weight": "bold"}, "Σ");
  cols.forEach((k, j) => { const v = rows.reduce((t, r) => t + (r[2][k] || 0), 0);
    el("rect", {x: x0 + j*cw, y: yt, width: cw, height: 18, fill: v ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": v ? 2 : 0.6});
    el("text", {x: x0 + j*cw + cw/2, y: yt + 13, "text-anchor": "middle", "font-size": 11.5, "font-weight": "bold"}, fmt(v)); });
}
function setMats(a, b){ const ids = ["11", "12", "21", "22"]; ids.forEach((k, q) => { document.getElementById("a" + k).value = a[q]; document.getElementById("b" + k).value = b[q]; }); show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
