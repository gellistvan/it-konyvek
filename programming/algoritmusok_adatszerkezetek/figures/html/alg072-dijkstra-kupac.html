<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijkstra lusta törléssel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Élek: <input id="inp" size="44" aria-label="Élek és súlyok" value="A->B:4, A->C:2, B->D:3, C->B:1, C->D:5, D->E:1"></label><label><input id="cl" type="checkbox" onchange="load()"> lezárásos változat (final[])</label><button onclick="load()">Betöltés</button><button onclick="neg()">Negatív példa</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Dijkstra az A forrásból; kivételi sorrend (0,A), (2,C), (3,B), (4,B) elavult, (6,D), (7,D) elavult, (7,E); végső dist A 0, B 3, C 2, D 6, E 7."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.3.4 dijkstra_shortest_path átirata (lusta törlés). A „lezárásos változat” a T-A8-019 szerinti final[] jelzőt használja: a negatív példán B = 5, D = 6 (hibás), a csak elavultságot szűrő kód −4 és −3.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["dist[s] = 0; pq = [(0, s)]", "while pq:", "    d, u = heappop(pq)", "    if d > dist[u]: continue   # elavult", "    [lezárásos: if final[u]: continue; final[u] = True]", "    for v, w in graph[u]:", "        if [not final[v] and] dist[u] + w < dist[v]:", "            dist[v] = dist[u] + w; parent[v] = u; heappush"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const POSK = {"A,B,C,D,E": {A: [60, 140], B: [190, 50], C: [190, 230], D: [320, 140], E: [430, 140]},
              "A,B,C,D": {A: [60, 140], B: [210, 50], C: [210, 230], D: [380, 50]}};
let EDGES = [];
function parse(txt){ return [...txt.matchAll(/([A-Za-z])\s*->\s*([A-Za-z])\s*:\s*(-?\d+)/g)].map(x => [x[1].toUpperCase(), x[2].toUpperCase(), +x[3]]); }
function dij(edges, closed){
  EDGES = edges; const V = [...new Set(edges.flatMap(e => [e[0], e[1]]))].sort(), g = {}; V.forEach(v => g[v] = []);
  edges.forEach(([u, v, w]) => g[u].push([v, w]));
  const dist = {}, par = {}, fin = new Set(); V.forEach(v => { dist[v] = null; par[v] = null; });
  const s = V.includes("A") ? "A" : V[0]; dist[s] = 0; let pq = [[0, s]]; const gone = [];
  const cmp = (a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);
  const st = [{V, dist: {...dist}, par: {...par}, fin: [], cur: null, heap: pq.slice(), gone: [], line: 0, msg: `Kezdet: dist[${s}] = 0, kupac = [(0, ${s})]`}];
  let guard = 0;
  while (pq.length && guard++ < 400) { pq.sort(cmp); const [d, u] = pq.shift();
    const stale = d > dist[u] || (closed && fin.has(u)); gone.push([d, u, stale]);
    if (stale) { st.push({V, dist: {...dist}, par: {...par}, fin: [...fin], cur: u, heap: pq.slice().sort(cmp), gone: gone.slice(), line: d > dist[u] ? 3 : 4,
        msg: `heappop → (${d}, ${u}): ${d > dist[u] ? `${d} > dist[${u}] = ${dist[u]}` : `${u} már lezárt`}, elavult bejegyzés, kihagyjuk`}); continue; }
    fin.add(u); const rel = [];
    for (const [v, w] of g[u]) { if (closed && fin.has(v)) { rel.push(`${v} lezárt, kihagyva`); continue; }
      const nd = dist[u] + w; if (dist[v] === null || nd < dist[v]) { rel.push(`dist[${v}] = ${nd}`); dist[v] = nd; par[v] = u; pq.push([nd, v]); } }
    st.push({V, dist: {...dist}, par: {...par}, fin: [...fin], cur: u, heap: pq.slice().sort(cmp), gone: gone.slice(), line: rel.length ? 7 : 5,
      msg: `heappop → (${d}, ${u}): ` + (rel.length ? "relaxálás: " + rel.join(", ") : "nincs javítás")}); }
  st[st.length - 1].msg += " — vége: dist = {" + V.map(v => v + ":" + (dist[v] === null ? "∞" : dist[v])).join(", ") + "}";
  return st;
}
const mm = v => v === null || v === undefined ? "∞" : String(v).replace("-", "−");
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 320");
  el("defs", {}).innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${css("--fg")}"/></marker>`;
  const key = s.V.join(","); let P = POSK[key];
  if (!P) { P = {}; s.V.forEach((v, i) => { const a = 2 * Math.PI * i / s.V.length - Math.PI / 2; P[v] = [230 + 150 * Math.cos(a), 150 + 115 * Math.sin(a)]; }); }
  for (const [u, v, w] of EDGES) { const p = s.par[v] === u, [x0, y0] = P[u], [x1, y1] = P[v], L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
    el("line", {x1: x0 + ux * 24, y1: y0 + uy * 24, x2: x1 - ux * 26, y2: y1 - uy * 26, stroke: p ? css("--fg") : css("--muted"), "stroke-width": p ? 4 : 1.4, "marker-end": "url(#ar)"});
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; el("rect", {x: mx - 13, y: my - 10, width: 26, height: 18, fill: css("--bg")});
    const ta = {x: mx, y: my + 4, "text-anchor": "middle", "font-size": 13}; if (w < 0) { ta.fill = css("--hl2"); ta["font-weight"] = "bold"; } el("text", ta, mm(w)); }
  for (const v of s.V) { const [x, y] = P[v], f = s.fin.includes(v);
    if (f) el("circle", {cx: x, cy: y, r: 25, fill: "none", stroke: css("--line"), "stroke-width": 1.4});
    el("circle", {cx: x, cy: y, r: 19, fill: f ? css("--cellhl") : css("--cell"), stroke: v === s.cur ? css("--hl") : css("--line"), "stroke-width": v === s.cur ? 4 : 1.4});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, v);
    el("text", {x, y: y + (y < 100 ? -32 : 42), "text-anchor": "middle", "font-size": 13, fill: css("--hl")}, "dist=" + mm(s.dist[v])); }
  const hx = 480; el("text", {x: hx + 30, y: 20, "text-anchor": "middle", "font-size": 12, "font-style": "italic"}, "kupac");
  const rows = s.gone.slice(-1).map(g => [g[0], g[1], g[2] ? "x" : "ki"]).concat(s.heap.map(h => [h[0], h[1], "bent"]));
  rows.slice(0, 12).forEach(([d, u, k], i) => { const y = 30 + i * 22;
    el("rect", {x: hx, y, width: 62, height: 19, fill: k === "bent" ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": k === "bent" ? 1 : 2.4});
    el("text", {x: hx + 31, y: y + 14, "text-anchor": "middle", "font-size": 12}, `(${mm(d)},${u})`);
    if (k === "x") el("line", {x1: hx + 3, y1: y + 10, x2: hx + 59, y2: y + 10, stroke: css("--fg"), "stroke-width": 2}); });
  el("text", {x: 10, y: 296, "font-size": 11, fill: css("--muted")}, "dupla keret + szürke = lezárt · vastag keret = most kivett · vastag nyíl = parent-él");
  el("text", {x: 10, y: 312, "font-size": 11, fill: css("--muted")}, "kupac: felül a most kivett bejegyzés (áthúzva, ha elavult), alatta a bent maradók");
}
function load(){
  const e = parse(document.getElementById("inp").value), err = document.getElementById("err");
  if (e.length < 1 || e.length > 14) { err.textContent = "1–14 él „X->Y:súly” alakban."; return; }
  err.textContent = e.some(x => x[2] < 0) ? "Figyelem: negatív élsúly – a Dijkstra garanciája nem érvényes!" : "";
  setSteps(dij(e, document.getElementById("cl").checked));
}
function neg(){ document.getElementById("inp").value = "A->B:5, A->C:6, C->B:-10, B->D:1"; load(); }

STEPS = dij([['A', 'B', 4], ['A', 'C', 2], ['B', 'D', 3], ['C', 'B', 1], ['C', 'D', 5], ['D', 'E', 1]], false);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
