<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BUILD-MAX-HEAP lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb (1-alapú): <input id="inp" value="4, 1, 3, 2, 16, 9, 10, 14, 8, 7" size="28" aria-label="Saját tömb"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az [4, 1, 3, 2, 16, 9, 10, 14, 8, 7] tömb kupaccá alakítása i = 5-től 1-ig; eredmény [16, 14, 10, 8, 7, 9, 3, 2, 4, 1], 7 csere."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú BUILD-MAX-HEAP(A, n) és MAX-HEAP-SIFT-DOWN (9.2). Az i = 5 hívásnál A[5] = 16 ≥ A[10] = 7, ezért nincs csere. Kezdőállapot: a könyv példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], "i": null, "cur": null, "cmp": [], "path": [], "done": [], "swaps": 0, "line": 1, "msg": "Kezdőállapot: n = 10, heap_size = 10; a levelek (6…10) önmagukban kupacok"}, {"a": [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], "i": 5, "cur": 5, "cmp": [], "path": [5], "done": [], "swaps": 0, "line": 3, "msg": "i = 5: MAX-HEAP-SIFT-DOWN(A, 5, 10) hívása, A[5] = 16; a gyermekek részfái már kupacok"}, {"a": [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], "i": 5, "cur": 5, "cmp": [10], "path": [5], "done": [], "swaps": 0, "line": 11, "msg": "i = 5, aktuális = 5, largest = 5 (16 ≥ 7) → break; e hívás cseréi: 0, összesen: 0"}, {"a": [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], "i": 4, "cur": 4, "cmp": [], "path": [4], "done": [5], "swaps": 0, "line": 3, "msg": "i = 4: MAX-HEAP-SIFT-DOWN(A, 4, 10) hívása, A[4] = 2; a gyermekek részfái már kupacok"}, {"a": [4, 1, 3, 2, 16, 9, 10, 14, 8, 7], "i": 4, "cur": 4, "cmp": [8, 9], "path": [4], "done": [5], "swaps": 0, "line": 8, "msg": "i = 4, aktuális = 4, largest = 8: 2 vs. 14, 8"}, {"a": [4, 1, 3, 14, 16, 9, 10, 2, 8, 7], "i": 4, "cur": 8, "cmp": [], "path": [4, 8], "done": [5], "swaps": 1, "line": 12, "swap": [4, 8], "msg": "i = 4, largest = 8, csere: 2 ↔ 14 → [4, 1, 3, 14, 16, 9, 10, 2, 8, 7]; cserék összesen: 1"}, {"a": [4, 1, 3, 14, 16, 9, 10, 2, 8, 7], "i": 4, "cur": 8, "cmp": [], "path": [4, 8], "done": [5], "swaps": 1, "line": 11, "msg": "i = 4, aktuális = 8, largest = 8 (nincs gyermeke) → break; e hívás cseréi: 1, összesen: 1"}, {"a": [4, 1, 3, 14, 16, 9, 10, 2, 8, 7], "i": 3, "cur": 3, "cmp": [], "path": [3], "done": [4, 5], "swaps": 1, "line": 3, "msg": "i = 3: MAX-HEAP-SIFT-DOWN(A, 3, 10) hívása, A[3] = 3; a gyermekek részfái már kupacok"}, {"a": [4, 1, 3, 14, 16, 9, 10, 2, 8, 7], "i": 3, "cur": 3, "cmp": [6, 7], "path": [3], "done": [4, 5], "swaps": 1, "line": 8, "msg": "i = 3, aktuális = 3, largest = 7: 3 vs. 9, 10"}, {"a": [4, 1, 10, 14, 16, 9, 3, 2, 8, 7], "i": 3, "cur": 7, "cmp": [], "path": [3, 7], "done": [4, 5], "swaps": 2, "line": 12, "swap": [3, 7], "msg": "i = 3, largest = 7, csere: 3 ↔ 10 → [4, 1, 10, 14, 16, 9, 3, 2, 8, 7]; cserék összesen: 2"}, {"a": [4, 1, 10, 14, 16, 9, 3, 2, 8, 7], "i": 3, "cur": 7, "cmp": [], "path": [3, 7], "done": [4, 5], "swaps": 2, "line": 11, "msg": "i = 3, aktuális = 7, largest = 7 (nincs gyermeke) → break; e hívás cseréi: 1, összesen: 2"}, {"a": [4, 1, 10, 14, 16, 9, 3, 2, 8, 7], "i": 2, "cur": 2, "cmp": [], "path": [2], "done": [3, 4, 5], "swaps": 2, "line": 3, "msg": "i = 2: MAX-HEAP-SIFT-DOWN(A, 2, 10) hívása, A[2] = 1; a gyermekek részfái már kupacok"}, {"a": [4, 1, 10, 14, 16, 9, 3, 2, 8, 7], "i": 2, "cur": 2, "cmp": [4, 5], "path": [2], "done": [3, 4, 5], "swaps": 2, "line": 8, "msg": "i = 2, aktuális = 2, largest = 5: 1 vs. 14, 16"}, {"a": [4, 16, 10, 14, 1, 9, 3, 2, 8, 7], "i": 2, "cur": 5, "cmp": [], "path": [2, 5], "done": [3, 4, 5], "swaps": 3, "line": 12, "swap": [2, 5], "msg": "i = 2, largest = 5, csere: 1 ↔ 16 → [4, 16, 10, 14, 1, 9, 3, 2, 8, 7]; cserék összesen: 3"}, {"a": [4, 16, 10, 14, 1, 9, 3, 2, 8, 7], "i": 2, "cur": 5, "cmp": [10], "path": [2, 5], "done": [3, 4, 5], "swaps": 3, "line": 8, "msg": "i = 2, aktuális = 5, largest = 10: 1 vs. 7"}, {"a": [4, 16, 10, 14, 7, 9, 3, 2, 8, 1], "i": 2, "cur": 10, "cmp": [], "path": [2, 5, 10], "done": [3, 4, 5], "swaps": 4, "line": 12, "swap": [5, 10], "msg": "i = 2, largest = 10, csere: 1 ↔ 7 → [4, 16, 10, 14, 7, 9, 3, 2, 8, 1]; cserék összesen: 4"}, {"a": [4, 16, 10, 14, 7, 9, 3, 2, 8, 1], "i": 2, "cur": 10, "cmp": [], "path": [2, 5, 10], "done": [3, 4, 5], "swaps": 4, "line": 11, "msg": "i = 2, aktuális = 10, largest = 10 (nincs gyermeke) → break; e hívás cseréi: 2, összesen: 4"}, {"a": [4, 16, 10, 14, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 1, "cmp": [], "path": [1], "done": [2, 3, 4, 5], "swaps": 4, "line": 3, "msg": "i = 1: MAX-HEAP-SIFT-DOWN(A, 1, 10) hívása, A[1] = 4; a gyermekek részfái már kupacok"}, {"a": [4, 16, 10, 14, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 1, "cmp": [2, 3], "path": [1], "done": [2, 3, 4, 5], "swaps": 4, "line": 8, "msg": "i = 1, aktuális = 1, largest = 2: 4 vs. 16, 10"}, {"a": [16, 4, 10, 14, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 2, "cmp": [], "path": [1, 2], "done": [2, 3, 4, 5], "swaps": 5, "line": 12, "swap": [1, 2], "msg": "i = 1, largest = 2, csere: 4 ↔ 16 → [16, 4, 10, 14, 7, 9, 3, 2, 8, 1]; cserék összesen: 5"}, {"a": [16, 4, 10, 14, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 2, "cmp": [4, 5], "path": [1, 2], "done": [2, 3, 4, 5], "swaps": 5, "line": 8, "msg": "i = 1, aktuális = 2, largest = 4: 4 vs. 14, 7"}, {"a": [16, 14, 10, 4, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 4, "cmp": [], "path": [1, 2, 4], "done": [2, 3, 4, 5], "swaps": 6, "line": 12, "swap": [2, 4], "msg": "i = 1, largest = 4, csere: 4 ↔ 14 → [16, 14, 10, 4, 7, 9, 3, 2, 8, 1]; cserék összesen: 6"}, {"a": [16, 14, 10, 4, 7, 9, 3, 2, 8, 1], "i": 1, "cur": 4, "cmp": [8, 9], "path": [1, 2, 4], "done": [2, 3, 4, 5], "swaps": 6, "line": 8, "msg": "i = 1, aktuális = 4, largest = 9: 4 vs. 2, 8"}, {"a": [16, 14, 10, 8, 7, 9, 3, 2, 4, 1], "i": 1, "cur": 9, "cmp": [], "path": [1, 2, 4, 9], "done": [2, 3, 4, 5], "swaps": 7, "line": 12, "swap": [4, 9], "msg": "i = 1, largest = 9, csere: 4 ↔ 8 → [16, 14, 10, 8, 7, 9, 3, 2, 4, 1]; cserék összesen: 7"}, {"a": [16, 14, 10, 8, 7, 9, 3, 2, 4, 1], "i": 1, "cur": 9, "cmp": [], "path": [1, 2, 4, 9], "done": [2, 3, 4, 5], "swaps": 7, "line": 11, "msg": "i = 1, aktuális = 9, largest = 9 (nincs gyermeke) → break; e hívás cseréi: 3, összesen: 7"}, {"a": [16, 14, 10, 8, 7, 9, 3, 2, 4, 1], "i": null, "cur": null, "cmp": [], "path": [], "done": [1, 2, 3, 4, 5], "swaps": 7, "line": 2, "msg": "Kész: [16, 14, 10, 8, 7, 9, 3, 2, 4, 1] max-kupac; cserék összesen: 7"}];
const CODE = ["BUILD-MAX-HEAP(A, n)", "1  heap_size = n", "2  for i = floor(n / 2) downto 1:", "3      MAX-HEAP-SIFT-DOWN(A, i, heap_size)", "", "MAX-HEAP-SIFT-DOWN(A, i, heap_size)", "2  while true:", "5      largest = i", "6–9    largest = a legnagyobb A[i], A[l], A[r] közül", "10     if largest == i:", "11         break", "12     cseréljük A[i] és A[largest] elemet", "13     i = largest"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function build(a0){
  const a = a0.slice(), n = a.length; let total = 0;
  const st = [{a: a.slice(), i: null, cur: null, cmp: [], path: [], done: [], swaps: 0, line: 1,
               msg: `Kezdőállapot: n = ${n}, heap_size = ${n}; a levelek (${Math.floor(n/2)+1}…${n}) önmagukban kupacok`}];
  for (let i = Math.floor(n/2); i >= 1; i--) {
    const done = []; for (let j = i + 1; j <= Math.floor(n/2); j++) done.push(j);
    st.push({a: a.slice(), i, cur: i, cmp: [], path: [i], done, swaps: total, line: 3,
             msg: `i = ${i}: MAX-HEAP-SIFT-DOWN(A, ${i}, ${n}) hívása, A[${i}] = ${a[i-1]}; a gyermekek részfái már kupacok`});
    let c = i, path = [i], local = 0;
    while (true) {
      const l = 2*c, r = 2*c + 1; let lg = c;
      if (l <= n && a[l-1] > a[lg-1]) lg = l;
      if (r <= n && a[r-1] > a[lg-1]) lg = r;
      const kids = [l, r].filter(x => x <= n);
      if (lg === c) {
        const why = kids.length ? `${a[c-1]} ≥ ${kids.map(x => a[x-1]).join(", ")}` : "nincs gyermeke";
        st.push({a: a.slice(), i, cur: c, cmp: kids, path: path.slice(), done, swaps: total, line: 11,
                 msg: `i = ${i}, aktuális = ${c}, largest = ${c} (${why}) → break; e hívás cseréi: ${local}, összesen: ${total}`});
        break;
      }
      st.push({a: a.slice(), i, cur: c, cmp: kids, path: path.slice(), done, swaps: total, line: 8,
               msg: `i = ${i}, aktuális = ${c}, largest = ${lg}: ${a[c-1]} vs. ${kids.map(x => a[x-1]).join(", ")}`});
      [a[c-1], a[lg-1]] = [a[lg-1], a[c-1]]; total++; local++;
      st.push({a: a.slice(), i, cur: lg, cmp: [], path: path.concat([lg]), done, swaps: total, line: 12, swap: [c, lg],
               msg: `i = ${i}, largest = ${lg}, csere: ${a[lg-1]} ↔ ${a[c-1]} → [${a.join(", ")}]; cserék összesen: ${total}`});
      path.push(lg); c = lg;
    }
  }
  const all = []; for (let j = 1; j <= Math.floor(n/2); j++) all.push(j);
  st.push({a: a.slice(), i: null, cur: null, cmp: [], path: [], done: all, swaps: total, line: 2, msg: `Kész: [${a.join(", ")}] max-kupac; cserék összesen: ${total}`});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const a = s.a, n = a.length, D = Math.max(1, Math.floor(Math.log2(n))), dy = Math.min(55, 170 / D);
  const P = v => { const d = Math.floor(Math.log2(v)), k = v - 2 ** d; return [20 + (k + 0.5) * 520 / 2 ** d, 26 + d * dy]; };
  const sub = new Set();
  const addSub = r => { const q = [r]; while (q.length) { const x = q.pop(); sub.add(x); for (const c of [2*x, 2*x+1]) if (c <= n) q.push(c); } };
  s.done.forEach(addSub);
  const pe = new Set(); for (let t = 1; t < s.path.length; t++) pe.add(s.path[t]);
  for (let c = 2; c <= n; c++) { const [x0, y0] = P(Math.floor(c/2)), [x1, y1] = P(c);
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: pe.has(c) ? css("--hl2") : css("--line"), "stroke-width": pe.has(c) ? 4 : 1.1}); }
  const r = n > 15 ? 11 : 15;
  for (let v = 1; v <= n; v++) {
    const [x, y] = P(v), internal = v <= Math.floor(n/2), unproc = internal && s.i !== null && v < s.i && !sub.has(v) || (s.i === null && s.line === 1 && internal);
    const cm = s.cmp.includes(v);
    el("circle", {cx: x, cy: y, r, fill: v === s.cur ? css("--cellhl") : css("--cell"), stroke: cm ? css("--hl2") : css("--line"),
                  "stroke-width": sub.has(v) ? 3 : cm ? 2.5 : 1.2, "stroke-dasharray": unproc ? "2 3" : cm ? "5 3" : "none"});
    if (v === s.i) el("circle", {cx: x, cy: y, r: r + 5, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": n > 15 ? 10 : 13}, String(a[v-1]));
  }
  const w = Math.min(40, 520 / n), x0 = 280 - n * w / 2, ay = 232;
  for (let v = 1; v <= n; v++) {
    const x = x0 + (v - 1) * w;
    el("rect", {x, y: ay, width: w, height: w, fill: v === s.cur ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": s.path.includes(v) ? 3 : 1.1});
    el("text", {x: x + w/2, y: ay + w/2 + 5, "text-anchor": "middle", "font-size": 13}, String(a[v-1]));
    el("text", {x: x + w/2, y: ay + w + 13, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(v));
    if (v === s.i) el("text", {x: x + w/2, y: ay - 5, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "i");
  }
  el("text", {x: 4, y: 306, "font-size": 13, "font-weight": "bold"}, `cserék összesen: ${s.swaps}`);
  el("text", {x: 4, y: 324, "font-size": 11, fill: css("--muted")}, "kék dupla kör = i · vastag kör = kész részfa · pontozott = feldolgozatlan belső csúcs · narancs = csereút");
}
function load(){
  const msg = document.getElementById("err");
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (a.length < 1 || a.length > 15 || a.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–15 egész számot adjon meg."; return; }
  msg.textContent = ""; setSteps(build(a));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
