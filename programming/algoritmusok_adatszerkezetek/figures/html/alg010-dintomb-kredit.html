<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamikus tömb kreditekkel és potenciállal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Nézet: <select id="vw" onchange="reload()"><option value="kredit">kredit nézet</option><option value="pot">potenciál nézet</option></select></label><label>Növekedési tényező: <select id="gf" onchange="reload()"><option value="2">2 (duplázás)</option><option value="1.5">1,5</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Dinamikus tömb cellái beszúrásonként; a másoláskor a régi cellák kreditjei fedezik a másolást, a potenciál visszaesik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Duplázó stratégia, kezdőkapacitás 0, egységköltség = egy elem írása; Φ = 2·size − capacity (4.1.6). Kredit nézet: minden beszúrás 3 egységet fizet (az első 2-t). 1,5-ös tényezőnél az új kapacitás max(capacity + 1, ⌈1,5·capacity⌉). Kezdőállapot: üres tömb; a lépésszámláló 0–16 beszúrás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": -1, "msg": "Kezdőállapot: üres tömb (size = 0, capacity = 0, Φ = 0)."}, {"k": 1, "line": -1, "msg": ""}, {"k": 2, "line": -1, "msg": ""}, {"k": 3, "line": -1, "msg": ""}, {"k": 4, "line": -1, "msg": ""}, {"k": 5, "line": -1, "msg": ""}, {"k": 6, "line": -1, "msg": ""}, {"k": 7, "line": -1, "msg": ""}, {"k": 8, "line": -1, "msg": ""}, {"k": 9, "line": -1, "msg": ""}, {"k": 10, "line": -1, "msg": ""}, {"k": 11, "line": -1, "msg": ""}, {"k": 12, "line": -1, "msg": ""}, {"k": 13, "line": -1, "msg": ""}, {"k": 14, "line": -1, "msg": ""}, {"k": 15, "line": -1, "msg": ""}, {"k": 16, "line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let G = 2, VIEW = "kredit";
function grow(cap){ if (cap === 0) return 1; return G === 2 ? 2 * cap : Math.max(cap + 1, Math.ceil(1.5 * cap)); }
function sim(n){
  let size = 0, cap = 0, phi = 0, bank = 0; const rows = [];
  for (let i = 1; i <= n; i++) {
    const cap0 = cap; let copied = 0;
    if (size === cap) { copied = size; cap = grow(cap); }
    size++; const c = copied + 1, np = 2 * size - cap, acc = i === 1 ? 2 : 3; bank += acc - c;
    rows.push({i, size, cap0, cap, c, copied, phi0: phi, phi: np, dphi: np - phi, chat: c + np - phi, acc, bank});
    phi = np;
  }
  return rows;
}
let ROWS = sim(16);
function coins(size, cap){ if (size === 0) return []; if (cap === 1) return [1];
  const h = cap / 2, o = []; for (let j = h + 1; j <= size; j++) o.push(j, j - h); return o; }
const sg = v => (v >= 0 ? "+" : "−") + Math.abs(v);
function msgFor(r){
  if (!r) return "Kezdőállapot: üres tömb (size = 0, capacity = 0, Φ = 0).";
  const cp = r.copied ? `átméretezés ${r.cap0} → ${r.cap}, ${r.copied} elem másolása + 1 írás` : "nincs átméretezés, 1 írás";
  if (VIEW === "kredit") {
    const ok = r.bank >= 0;
    return `i = ${r.i}: ${cp}, cᵢ = ${r.c}. Befizetés ĉᵢ = ${r.acc} (1 az írásra, ${r.acc - 1} kredit)` +
      (r.copied ? `; a másolást ${r.copied} kredit fedezi` : "") + `. Kreditegyenleg: ${r.bank}` +
      (ok ? "" : "  – HIÁNY: a 3 egységes befizetés ennél a tényezőnél nem elég!");
  }
  return `i = ${r.i}: ${cp}. Φ = 2·${r.size} − ${r.cap} = ${r.phi}; ĉᵢ = cᵢ + ΔΦ = ${r.c} + (${sg(r.dphi)}) = ${r.chat}` +
    (r.chat > 3 ? "  – nagyobb 3-nál: ennél a tényezőnél ez a Φ nem ad 3-as korlátot" : "");
}
function render(s){
  const k = s.k, r = k ? ROWS[k - 1] : null;
  status.textContent = msgFor(r);
  svg.setAttribute("viewBox", "0 0 640 520"); svg.innerHTML = "";
  const w = 31, x0 = 62;
  const cell = (x, y, filled, bold, lbl, faded) => {
    el("rect", {x, y, width: w, height: w, fill: filled ? css("--cellhl") : css("--cell"), stroke: css("--line"),
               "stroke-width": bold ? 3.5 : 1, opacity: faded ? 0.5 : 1});
    if (lbl) el("text", {x: x + w/2, y: y + w/2 + 5, "text-anchor": "middle", "font-size": 12, opacity: faded ? 0.6 : 1}, lbl);
  };
  const coin = (x, y, faded) => { el("circle", {cx: x, cy: y, r: 7, fill: css("--cell"), stroke: faded ? css("--muted") : css("--line"),
               "stroke-dasharray": faded ? "3 2" : "none"}); el("text", {x, y: y + 4, "text-anchor": "middle", "font-size": 9, style: "fill:" + (faded ? css("--muted") : css("--fg"))}, "1"); };
  const drawCoins = (list, y, faded) => { const cnt = {}; list.forEach(j => { const q = cnt[j] = (cnt[j] || 0) + 1; coin(x0 + (j - 0.5) * w + (q === 1 ? -6 : 6), y, faded); }); };
  let yNew = 130;
  if (r && r.copied) {
    el("text", {x: 8, y: 52, "font-size": 12, style: "fill:" + css("--muted")}, "előtte");
    for (let j = 1; j <= r.cap0; j++) cell(x0 + (j-1)*w, 36, j <= r.copied, false, "x" + j, true);
    if (VIEW === "kredit" && G === 2) drawCoins(coins(r.copied, r.cap0), 26, true);
    for (let j = 1; j <= r.copied; j++) el("line", {x1: x0 + (j-0.5)*w, y1: 70, x2: x0 + (j-0.5)*w, y2: yNew - 18, stroke: css("--line"), "stroke-dasharray": "4 3", "marker-end": "url(#ah)"});
    el("text", {x: x0 + r.copied * w + 8, y: 100, "font-size": 12, "font-style": "italic"}, `másolás (${r.copied} elem)`);
  }
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`;
  const size = r ? r.size : 0, cap = r ? r.cap : 0;
  el("text", {x: 8, y: yNew + 20, "font-size": 12}, k ? "utána" : "");
  for (let j = 1; j <= cap; j++) cell(x0 + (j-1)*w, yNew, j <= size, r && j === r.i, j <= size ? "x" + j : "", false);
  if (!cap) el("text", {x: x0, y: yNew + 20, "font-size": 13, style: "fill:" + css("--muted")}, "(capacity = 0: nincs lefoglalt cella)");
  if (VIEW === "kredit") {
    if (G === 2) drawCoins(coins(size, cap), yNew - 10, false);
    const b = r ? r.bank : 0;
    el("text", {x: 8, y: yNew + w + 26, "font-size": 12}, "kreditbank: " + b + (b < 0 ? "  (negatív – a kredit nem fedezi a másolást)" : ""));
    for (let q = 0; q < Math.max(0, b); q++) coin(x0 + 92 + q * 17, yNew + w + 22, false);
  } else {
    // Φ-történet oszlopdiagram
    const by = yNew + w + 92, sc = 6;
    el("text", {x: 8, y: yNew + w + 26, "font-size": 12}, "Φ = 2·size − capacity lépésenként:");
    el("line", {x1: x0, y1: by, x2: x0 + 16 * 34, y2: by, stroke: css("--line")});
    ROWS.forEach((q, t) => { if (t >= k) return; const h = q.phi * sc;
      el("rect", {x: x0 + t * 34 + 6, y: by - h, width: 22, height: h, fill: t === k - 1 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": t === k - 1 ? 2.5 : 1});
      el("text", {x: x0 + t * 34 + 17, y: by - h - 3, "text-anchor": "middle", "font-size": 10}, String(q.phi));
      el("text", {x: x0 + t * 34 + 17, y: by + 12, "text-anchor": "middle", "font-size": 10, style: "fill:" + css("--muted")}, String(q.i)); });
  }
  // táblázat
  const ty = 300, cx = [40, 80, 130, 210, 260, 350, 410], hd = ["i", "size", "capacity", "cᵢ", "Φ", "ΔΦ", "ĉᵢ"];
  hd.forEach((h, t) => el("text", {x: cx[t], y: ty, "font-size": 12, "font-weight": "bold"}, h));
  el("text", {x: 470, y: ty, "font-size": 12, "font-weight": "bold"}, VIEW === "kredit" ? "bank" : "");
  let sc = 0, sh = 0;
  ROWS.forEach((q, t) => { if (t >= k) return; sc += q.c; sh += VIEW === "kredit" ? q.acc : q.chat; });
  const first = Math.max(0, k - 12);
  for (let t = first; t < k; t++) {
    const q = ROWS[t], yy = ty + 15 * (t - first + 1), on = t === k - 1;
    if (on) el("rect", {x: 34, y: yy - 11, width: 520, height: 14, fill: css("--cellhl")});
    const v = [q.i, q.size, q.copied ? `${q.cap0}→${q.cap}` : (q.i === 1 ? "0→1" : q.cap), q.c, `${q.phi0}→${q.phi}`, sg(q.dphi), VIEW === "kredit" ? q.acc : q.chat];
    v.forEach((x, u) => el("text", {x: cx[u], y: yy, "font-size": 11.5, "font-weight": on ? "bold" : "normal"}, String(x)));
    if (VIEW === "kredit") el("text", {x: 470, y: yy, "font-size": 11.5}, String(q.bank));
  }
  if (k) el("text", {x: 40, y: ty + 15 * (Math.min(k, 12) + 1) + 4, "font-size": 12, "font-weight": "bold"},
            `Σcᵢ = ${sc},  Σĉᵢ = ${sh}  ` + (sc <= sh ? "(Σcᵢ ≤ Σĉᵢ)" : "(Σcᵢ > Σĉᵢ – a korlát sérül)"));
}
function reload(){ G = +document.getElementById("gf").value; VIEW = document.getElementById("vw").value; ROWS = sim(16); show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
