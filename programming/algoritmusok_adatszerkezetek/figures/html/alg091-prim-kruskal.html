<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prim és Kruskal párhuzamosan</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><label>Prim kezdőcsúcsa: <select id="start" onchange="load()" aria-label="Prim kezdőcsúcsa"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Prim és Kruskal ugyanazon az A–E gráfon: Prim A-ból az A, C, D, E, B sorrendben emel ki (kulcsváltozások B: 4 → 3, E: 6 → 2), Kruskal a C-D, A-C, D-E, B-C éleket veszi be és az A-B, B-D, C-E éleket elutasítja; mindkettő a 8 súlyú MST-t adja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.2.4 példája. Prim: a könyv 6 lépése (1. a kezdőállapot); Kruskal: 7 lépés, az unió rang szerint, úttömörítéssel. A pszeudokód break-je a 4. bevett él után megállna, a példa a szemléltetés kedvéért mind a 7 élt végigviszi. Holtversenynél a táblázat sorrendje dönt.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 1, "msg": ""}, {"k": 1, "line": 6, "msg": ""}, {"k": 2, "line": 6, "msg": ""}, {"k": 3, "line": 6, "msg": ""}, {"k": 4, "line": 3, "msg": ""}, {"k": 5, "line": 3, "msg": ""}, {"k": 6, "line": -1, "msg": ""}, {"k": 7, "line": -1, "msg": ""}];
const CODE = ["PrimMST(G, w, s):", " key[·] = ∞; parent[·] = NIL", " while Q nem üres:", "  u = Q.kiveszMin()", "  for (u, v) in Adj[u]:", "   if not in_tree[v] és", "      w(u,v) < key[v]: frissít", " return {(parent[v], v)}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const V = ["A","B","C","D","E"];
const E = [["A","B",4],["A","C",2],["B","C",3],["B","D",5],["C","D",1],["C","E",6],["D","E",2]];
const W = {}; E.forEach(([a, b, w]) => { W[a + b] = w; W[b + a] = w; });
const ADJ = {A: [], B: [], C: [], D: [], E: []}; E.forEach(([a, b]) => { ADJ[a].push(b); ADJ[b].push(a); });
const POS0 = {A: [20, 120], B: [110, 30], C: [110, 120], D: [200, 70], E: [200, 200]};
const KSRT = E.map((e, i) => [e, i]).sort((x, y) => x[0][2] - y[0][2] || x[1] - y[1]).map(x => x[0]);
const S = k => k === Infinity ? "∞" : String(k);
function prim(s){
  const key = {}, par = {}, inT = {}; V.forEach(v => { key[v] = Infinity; par[v] = null; inT[v] = false; }); key[s] = 0;
  const st = [{key: {...key}, par: {...par}, tree: [], cur: null, ch: [], line: 1, msg: `1. Kezdetben S = {${s}}, key[${s}] = 0, a többi ∞.`}];
  const order = []; let n = 1;
  while (order.length < V.length) {
    let u = null; for (const v of V) if (!inT[v] && (u === null || key[v] < key[u])) u = v;
    inT[u] = true; order.push(u); n++;
    const ch = [];
    for (const v of ADJ[u]) if (!inT[v] && W[u + v] < key[v]) { ch.push([v, key[v], W[u + v]]); par[v] = u; key[v] = W[u + v]; }
    const tE = order.filter(x => par[x]).map(x => par[x] + "-" + x);
    let m = order.length === 1 ? `${n}. Kiemeljük ${u}-t.` : `${n}. Kiemeljük ${u}-t, súly ${key[u]}, fa éle ${par[u]}-${u}. T = {${tE.join(", ")}}.`;
    m += ch.length ? " Frissítés: " + ch.map(c => `key[${c[0]}] = ${c[2]}` + (c[1] === Infinity ? "" : ` (${c[1]} helyett)`)).join(", ") + "." : (order.length < V.length ? " Nincs kulcsváltozás." : "");
    st.push({key: {...key}, par: {...par}, tree: order.slice(), cur: u, ch, line: ch.length ? 6 : 3, msg: m});
  }
  const w = V.filter(v => par[v]).reduce((a, v) => a + key[v], 0);
  st[st.length - 1].msg += ` Az eredmény súlya ${w}.`;
  return st;
}
function kruskal(){
  const parent = {}, rank = {}; V.forEach(v => { parent[v] = v; rank[v] = 0; });
  const find = x => { if (parent[x] !== x) parent[x] = find(parent[x]); return parent[x]; };
  const st = [{parent: {...parent}, acc: [], rej: [], i: -1, comps: V.map(v => [v]), msg: "Kezdetben minden csúcs külön komponens."}];
  const acc = [], rej = [];
  KSRT.forEach(([u, v, w], i) => {
    const ok = find(u) !== find(v);
    if (ok) { const rx = find(u), ry = find(v); if (rank[rx] < rank[ry]) parent[rx] = ry; else if (rank[rx] > rank[ry]) parent[ry] = rx; else { parent[ry] = rx; rank[rx]++; } acc.push(u + v); }
    else rej.push(u + v);
    const cm = {}; V.forEach(x => (cm[find(x)] = cm[find(x)] || []).push(x));
    const comps = Object.values(cm);
    const cs = comps.map(c => "{" + c.join(",") + "}").join(", ");
    st.push({parent: {...parent}, acc: acc.slice(), rej: rej.slice(), i, comps,
      msg: `${i + 1}. ${u}-${v} (${w}): ` + (ok ? `${u} és ${v} különböző komponensben van, bevesszük. Komponensek: ${cs}.` : `${u} és ${v} már azonos komponensben van, kihagyjuk.` + (acc.length === 4 && rej.length === 1 ? " (A pszeudokód break-je már a 4. lépés után megállna; a példa végigviszi.)" : ""))});
  });
  return st;
}
let PST = prim("A"), KST = kruskal();
function build(){ const out = [];
  for (let k = 0; k < 8; k++) { const p = PST[Math.min(k, PST.length - 1)], q = KST[k];
    out.push({k, line: k < PST.length ? p.line : -1, msg: "Prim – " + (k < PST.length ? p.msg : "kész.") + "   |   Kruskal – " + q.msg}); }
  return out; }
function drawG(ox, oy, title){ G_text(ox, oy - 12, title, {size: 13, bold: true}); const P = {}; for (const v of V) P[v] = [POS0[v][0] + ox, POS0[v][1] + oy]; return P; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 432"); G_defs();
  const k = s.k === undefined ? 0 : s.k;
  // Prim
  const p = PST[Math.min(k, PST.length - 1)], tr = new Set(p.tree), P = drawG(20, 40, "Prim");
  const tE = new Set(p.tree.filter(x => p.par[x]).map(x => [p.par[x], x].sort().join("")));
  for (const [a, b, w] of E) { const kk = [a, b].sort().join("");
    let o = {r: 15, w: 1, color: css("--muted"), label: w, lsize: 11};
    if (tE.has(kk)) o = {r: 15, w: 4.5, label: w, lsize: 11};
    else if (tr.has(a) !== tr.has(b)) o = {r: 15, w: 1.6, dash: "6 4", label: w, lsize: 11};
    if (p.cur && p.par[p.cur] && kk === [p.par[p.cur], p.cur].sort().join("")) o.color = css("--hl2");
    G_edge(P[a], P[b], o); }
  for (const v of V) { G_node(P[v], v, {r: 15, fill: tr.has(v) ? css("--fg") : css("--cell"), tfill: tr.has(v) ? css("--bg") : undefined, w: v === p.cur ? 3.5 : 1.5, stroke: v === p.cur ? css("--hl2") : undefined, size: 13});
    if (!tr.has(v)) { const ch = p.ch.some(c => c[0] === v); G_text(P[v][0] + 14, P[v][1] - 14, S(p.key[v]) + (ch ? "*" : ""), {size: 12, bold: ch, halo: true}); } }
  // Prim tábla
  G_text(20, 290, "v", {bold: true}); G_text(60, 290, "key", {bold: true}); G_text(110, 290, "parent", {bold: true}); G_text(170, 290, "fában", {bold: true});
  V.forEach((v, i) => { const y = 308 + i * 17; G_text(20, y, v); G_text(60, y, S(p.key[v]), {bold: p.ch.some(c => c[0] === v)}); G_text(110, y, p.par[v] || "NIL"); G_text(170, y, tr.has(v) ? "✓" : ""); });
  // Kruskal
  const q = KST[k], Q = drawG(330, 40, "Kruskal");
  const pat = ["url(#hp)", "url(#dp)", css("--cellhl")], comps = q.comps.filter(c => c.length > 1);
  for (const [a, b, w] of E) { const kk = a + b; let o = {r: 15, w: 1, color: css("--muted"), label: w, lsize: 11};
    if (q.acc.includes(kk)) o = {r: 15, w: 4.5, label: w, lsize: 11};
    if (q.rej.includes(kk)) o = {r: 15, w: 1.4, dash: "2 4", label: w, lsize: 11};
    if (q.i >= 0 && KSRT[q.i][0] + KSRT[q.i][1] === kk) o.color = q.acc.includes(kk) ? css("--hl") : css("--hl2");
    G_edge(Q[a], Q[b], o);
    if (q.rej.includes(kk)) { const m = G_mid(Q[a], Q[b], 0, 0.3); G_cross(m[0], m[1], 5); } }
  for (const v of V) { const ci = comps.findIndex(c => c.includes(v)); G_node(Q[v], v, {r: 15, fill: ci >= 0 ? pat[ci % 3] : css("--cell"), pat: ci >= 0 && ci < 2, size: 13}); }
  G_text(330, 290, "rendezett éllista", {bold: true});
  KSRT.forEach(([a, b, w], i) => { const y = 308 + i * 13.5; const mark = i <= q.i ? (q.acc.includes(a + b) ? "✓" : "✗") : "";
    G_text(330, y, `${a}-${b} ${w} ${mark}${i === q.i ? " ◀" : ""}`, {size: 11, bold: i === q.i}); });
  G_text(460, 290, "DSU parent", {bold: true});
  V.forEach((v, i) => G_text(460, 308 + i * 17, `${v} → ${q.parent[v]}`, {size: 12}));
  G_text(20, 426, "teli = fában (Prim) · szám = key, * = most változott · mintázat = közös komponens (Kruskal) · szaggatott = határél · × = elutasítva", {size: 10, fill: css("--muted")});
}
function load(){ PST = prim(document.getElementById("start").value); setSteps(build()); }

STEPS = build();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
