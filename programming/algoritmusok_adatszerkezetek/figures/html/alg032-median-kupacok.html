<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medián két kupaccal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szám: <input id="inp" type="number" value="7" style="width:5em" aria-label="Új szám"></label><button onclick="addNum()">add</button><button onclick="resetSeq([])">Üres</button><button onclick="resetSeq([5, 15, 1, 3, 8])">Könyv: 5, 15, 1, 3, 8</button><label><input id="neg" type="checkbox" onchange="show(k)"> bal tömb negált (tárolt) alakban</label><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A két kupac az 5, 15, 1, 3, 8 beszúrások után; a mediánok 5, 10, 5, 4, 5; a 3 és a 8 beszúrásakor az 5 átkerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet MedianKeeper osztálya; a kupacok tömbjei a Python heapq elrendezését követik (a JS a heapq átirata). Kezdőállapot: üres; a ▶ a könyv 5, 15, 1, 3, 8 sorozatát játssza le.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"bal": [], "jobb": [], "x": null, "moved": null, "mto": null, "med": null, "line": 10, "msg": "Üres állapot: median() → ValueError(„üres adatfolyamnak nincs mediánja”)"}, {"bal": [-5], "jobb": [], "x": 5, "moved": null, "mto": null, "med": null, "line": 2, "nw": 5, "msg": "add(5): üres bal → a bal (max) kupacba; |bal| = 1, |jobb| = 0"}, {"bal": [-5], "jobb": [], "x": 5, "moved": null, "mto": null, "med": 5, "line": 11, "end": true, "msg": "add(5) után: bal = {5}, jobb = {}, median() = 5,0"}, {"bal": [-5], "jobb": [15], "x": 15, "moved": null, "mto": null, "med": null, "line": 4, "nw": 15, "msg": "add(15): x > max(bal) → a jobb (min) kupacba; |bal| = 1, |jobb| = 1"}, {"bal": [-5], "jobb": [15], "x": 15, "moved": null, "mto": null, "med": 10.0, "line": 12, "end": true, "msg": "add(15) után: bal = {5}, jobb = {15}, median() = 10,0"}, {"bal": [-5, -1], "jobb": [15], "x": 1, "moved": null, "mto": null, "med": null, "line": 2, "nw": 1, "msg": "add(1): x ≤ max(bal) → a bal (max) kupacba; |bal| = 2, |jobb| = 1"}, {"bal": [-5, -1], "jobb": [15], "x": 1, "moved": null, "mto": null, "med": 5, "line": 11, "end": true, "msg": "add(1) után: bal = {5, 1}, jobb = {15}, median() = 5,0"}, {"bal": [-5, -1, -3], "jobb": [15], "x": 3, "moved": null, "mto": null, "med": null, "line": 2, "nw": 3, "msg": "add(3): x ≤ max(bal) → a bal (max) kupacba; |bal| = 3, |jobb| = 1"}, {"bal": [-3, -1], "jobb": [5, 15], "x": 3, "moved": 5, "mto": "jobb", "med": null, "line": 6, "msg": "add(3): méretegyensúly sérül → a(z) 5 átkerül a jobb kupacba"}, {"bal": [-3, -1], "jobb": [5, 15], "x": 3, "moved": 5, "mto": "jobb", "med": 4.0, "line": 12, "end": true, "msg": "add(3) után: bal = {3, 1}, jobb = {5, 15}, median() = 4,0"}, {"bal": [-3, -1], "jobb": [5, 15, 8], "x": 8, "moved": null, "mto": null, "med": null, "line": 4, "nw": 8, "msg": "add(8): x > max(bal) → a jobb (min) kupacba; |bal| = 2, |jobb| = 3"}, {"bal": [-5, -1, -3], "jobb": [8, 15], "x": 8, "moved": 5, "mto": "bal", "med": null, "line": 8, "msg": "add(8): méretegyensúly sérül → a(z) 5 átkerül a bal kupacba"}, {"bal": [-5, -1, -3], "jobb": [8, 15], "x": 8, "moved": 5, "mto": "bal", "med": 5, "line": 11, "end": true, "msg": "add(8) után: bal = {5, 3, 1}, jobb = {8, 15}, median() = 5,0"}];
const CODE = ["def add(self, x):", "    if not self.bal or x <= -self.bal[0]:", "        heapq.heappush(self.bal, -x)", "    else:", "        heapq.heappush(self.jobb, x)", "    if len(self.bal) > len(self.jobb) + 1:", "        heapq.heappush(self.jobb, -heapq.heappop(self.bal))", "    elif len(self.jobb) > len(self.bal):", "        heapq.heappush(self.bal, -heapq.heappop(self.jobb))", "def median(self):", "    if not self.bal: raise ValueError(...)", "    if len(self.bal) > len(self.jobb): return -self.bal[0]", "    return (-self.bal[0] + self.jobb[0]) / 2.0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SEQ = [5, 15, 1, 3, 8];
// a Python heapq pontos átirata (heappush / heappop és _siftdown / _siftup)
function siftdown(h, start, pos){ const it = h[pos]; while (pos > start) { const pp = (pos - 1) >> 1, p = h[pp]; if (it < p) { h[pos] = p; pos = pp; continue; } break; } h[pos] = it; }
function siftup(h, pos){ const end = h.length, start = pos, it = h[pos]; let c = 2*pos + 1;
  while (c < end) { const r = c + 1; if (r < end && !(h[c] < h[r])) c = r; h[pos] = h[c]; pos = c; c = 2*pos + 1; }
  h[pos] = it; siftdown(h, start, pos); }
function hpush(h, x){ h.push(x); siftdown(h, 0, h.length - 1); }
function hpop(h){ const last = h.pop(); if (h.length) { const r = h[0]; h[0] = last; siftup(h, 0); return r; } return last; }
const fm = m => m === null ? "ValueError" : m.toFixed(1).replace(".", ",").replace("-", "−");
const med = (b, j) => !b.length ? null : b.length > j.length ? -b[0] : (-b[0] + j[0]) / 2;
function run(seq){
  const bal = [], jobb = [], st = [{bal: [], jobb: [], x: null, moved: null, mto: null, med: null, line: 10, msg: "Üres állapot: median() → ValueError(„üres adatfolyamnak nincs mediánja”)"}];
  for (const x of seq) {
    let side;
    if (!bal.length || x <= -bal[0]) { hpush(bal, -x); side = "bal"; } else { hpush(jobb, x); side = "jobb"; }
    st.push({bal: bal.slice(), jobb: jobb.slice(), x, moved: null, mto: null, med: null, line: side === "bal" ? 2 : 4, nw: x,
             msg: `add(${x}): ${side === "bal" ? (bal.length > 1 ? "x ≤ max(bal)" : "üres bal") : "x > max(bal)"} → a ${side === "bal" ? "bal (max)" : "jobb (min)"} kupacba; |bal| = ${bal.length}, |jobb| = ${jobb.length}`});
    let moved = null, mto = null, line = 0;
    if (bal.length > jobb.length + 1) { moved = -hpop(bal); hpush(jobb, moved); mto = "jobb"; line = 6; }
    else if (jobb.length > bal.length) { moved = hpop(jobb); hpush(bal, -moved); mto = "bal"; line = 8; }
    const m = med(bal, jobb);
    if (moved !== null) st.push({bal: bal.slice(), jobb: jobb.slice(), x, moved, mto, med: null, line, msg: `add(${x}): méretegyensúly sérül → a(z) ${moved} átkerül a ${mto} kupacba`});
    const sb = bal.map(v => -v).sort((a, b) => a - b), sj = jobb.slice().sort((a, b) => a - b);
    st.push({bal: bal.slice(), jobb: jobb.slice(), x, moved, mto, med: m, line: bal.length > jobb.length ? 11 : 12, end: true,
             msg: `add(${x}) után: bal = {${sb.join(", ")}}, jobb = {${sj.join(", ")}}, median() = ${fm(m)}`});
  }
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const neg = document.getElementById("neg") && document.getElementById("neg").checked;
  const tree = (vals, cx, filled, hl, title) => {
    el("text", {x: cx, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, title);
    const P = k => { const i = k + 1, d = Math.floor(Math.log2(i)), j = i - 2 ** d; return [cx - 120 + (j + 0.5) * 240 / 2 ** d, 46 + d * 44]; };
    for (let k = 1; k < vals.length; k++) { const [x0, y0] = P((k - 1) >> 1), [x1, y1] = P(k); el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--line"), "stroke-width": 1.2}); }
    vals.forEach((v, k) => { const [x, y] = P(k);
      el("circle", {cx: x, cy: y, r: 15, fill: filled ? css("--fg") : css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
      if (v === hl) el("circle", {cx: x, cy: y, r: 20, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13, fill: filled ? css("--bg") : css("--fg")}, String(v)); });
    if (!vals.length) el("text", {x: cx, y: 52, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "(üres)");
  };
  const B = s.bal.map(v => -v);
  tree(B, 140, true, s.mto === "bal" ? s.moved : (s.nw !== undefined && s.line === 2 ? s.nw : null), "bal: max-kupac");
  tree(s.jobb, 420, false, s.mto === "jobb" ? s.moved : (s.nw !== undefined && s.line === 4 ? s.nw : null), "jobb: min-kupac");
  if (s.moved !== null && s.line >= 5) el("text", {x: 280, y: 60, "text-anchor": "middle", "font-size": 22, fill: css("--hl2")}, s.mto === "jobb" ? "→" : "←");
  const all = B.concat(s.jobb), lo = Math.min(0, ...all), hi = Math.max(16, ...all), X = v => 40 + (v - lo) / (hi - lo || 1) * 480, yl = 220;
  el("line", {x1: 40, y1: yl, x2: 520, y2: yl, stroke: css("--line")});
  [lo, (lo + hi) / 2, hi].forEach(t => el("text", {x: X(t), y: yl + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(Math.round(t))));
  B.forEach(v => el("circle", {cx: X(v), cy: yl - 9, r: 7, fill: css("--fg"), stroke: css("--line")}));
  s.jobb.forEach(v => el("circle", {cx: X(v), cy: yl - 9, r: 7, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5}));
  if (s.med !== null) { el("line", {x1: X(s.med), y1: yl + 4, x2: X(s.med), y2: yl - 34, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "5 3"});
                        el("text", {x: X(s.med) + 4, y: yl - 26, "font-size": 12, fill: css("--hl")}, "medián " + fm(s.med)); }
  const arr = (h, isBal) => "[" + h.map(v => isBal && !neg ? -v : v).join(", ") + "]";
  el("text", {x: 10, y: 256, "font-size": 12}, `self.bal ${neg ? "(tárolt, negált)" : "(értékek)"} = ${arr(s.bal, true)}   self.jobb = ${arr(s.jobb, false)}`);
  const okA = !s.jobb.length || !s.bal.length || -s.bal[0] <= s.jobb[0], d = s.bal.length - s.jobb.length, okB = d === 0 || d === 1;
  el("text", {x: 10, y: 276, "font-size": 12, fill: okA ? css("--fg") : css("--hl2")}, (okA ? "✓" : "✗") + " max(bal) ≤ min(jobb)");
  el("text", {x: 200, y: 276, "font-size": 12, fill: okB ? css("--fg") : css("--hl2")}, (okB ? "✓" : "✗") + ` |bal| − |jobb| = ${d} ∈ {0, 1}` + (okB ? "" : " (átrendezés következik)"));
  el("text", {x: 10, y: 296, "font-size": 13, "font-weight": "bold"}, "median() = " + fm(med(s.bal, s.jobb)));
  el("text", {x: 10, y: 322, "font-size": 11, fill: css("--muted")}, "teli kör = bal (alsó fél) · üres kör = jobb (felső fél) · narancs gyűrű = új vagy áthelyezett elem");
}
function addNum(){
  const msg = document.getElementById("err"), v = Number(document.getElementById("inp").value);
  if (!Number.isInteger(v) || Math.abs(v) > 99) { msg.textContent = "−99 és 99 közötti egész számot adjon meg."; return; }
  if (SEQ.length >= 15) { msg.textContent = "Legfeljebb 15 elem."; return; }
  msg.textContent = ""; SEQ.push(v); const st = run(SEQ); setSteps(st); show(st.length - 1);
}
function resetSeq(list){ SEQ = list.slice(); document.getElementById("err").textContent = ""; setSteps(run(SEQ)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
