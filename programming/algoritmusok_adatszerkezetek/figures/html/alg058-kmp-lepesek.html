<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KMP-keresés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Mód: <select id="md" onchange="load()" aria-label="Mód"><option value="kmp" selected>KMP</option><option value="naiv">naiv</option><option value="pi">π-tábla felépítése</option></select></label><label>T: <input id="tt" value="abababaca" size="13" aria-label="Szöveg"></label><label>P: <input id="pp" value="ababaca" size="9" aria-label="Minta"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A T = abababaca szöveg alatt a P = ababaca minta; az illeszkedő karakterek sraffozva, az i = 6-os eltérésnél a minta π[5] = 3 alapján 2-vel jobbra csúszik, végül a 3. pozíción teljes találat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú pszeudokód (16.1.5). Kezdőállapot: T = abababaca, P = ababaca, q = 0. Az eltolás a minta előtti szövegpozíciók száma. Ezen a bemeneten a KMP 10, a naiv keresés 14 összehasonlítást végez; az egyetlen találat a 3. pozíció. A π-tábla mód a PREFIX-FUGGVENY lépéseit mutatja (q, k).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "kmp", "i": null, "q": 0, "s": 0, "cmp": null, "res": null, "jump": null, "found": [], "nc": 0, "line": 1, "msg": "Kezdet: T = abababaca, P = ababaca, π = [0, 0, 1, 2, 3, 0, 1], q = 0"}, {"mode": "kmp", "i": 1, "q": 1, "s": 0, "cmp": [1, 1], "res": "eq", "jump": null, "found": [], "nc": 1, "line": 6, "msg": "i = 1: P[1] = T[1] = a → q = 1"}, {"mode": "kmp", "i": 2, "q": 2, "s": 0, "cmp": [2, 2], "res": "eq", "jump": null, "found": [], "nc": 2, "line": 6, "msg": "i = 2: P[2] = T[2] = b → q = 2"}, {"mode": "kmp", "i": 3, "q": 3, "s": 0, "cmp": [3, 3], "res": "eq", "jump": null, "found": [], "nc": 3, "line": 6, "msg": "i = 3: P[3] = T[3] = a → q = 3"}, {"mode": "kmp", "i": 4, "q": 4, "s": 0, "cmp": [4, 4], "res": "eq", "jump": null, "found": [], "nc": 4, "line": 6, "msg": "i = 4: P[4] = T[4] = b → q = 4"}, {"mode": "kmp", "i": 5, "q": 5, "s": 0, "cmp": [5, 5], "res": "eq", "jump": null, "found": [], "nc": 5, "line": 6, "msg": "i = 5: P[5] = T[5] = a → q = 5"}, {"mode": "kmp", "i": 6, "q": 5, "s": 0, "cmp": [6, 6], "res": "ne", "jump": null, "found": [], "nc": 6, "line": 3, "msg": "i = 6: P[6] = c ≠ T[6] = b"}, {"mode": "kmp", "i": 6, "q": 3, "s": 2, "cmp": null, "res": null, "jump": [5, 3], "found": [], "nc": 6, "line": 4, "msg": "i = 6: q = π[5] = 3 → a minta 2 pozícióval jobbra csúszik (eltolás 2); i nem változik"}, {"mode": "kmp", "i": 6, "q": 4, "s": 2, "cmp": [6, 4], "res": "eq", "jump": null, "found": [], "nc": 7, "line": 6, "msg": "i = 6: P[4] = T[6] = b → q = 4"}, {"mode": "kmp", "i": 7, "q": 5, "s": 2, "cmp": [7, 5], "res": "eq", "jump": null, "found": [], "nc": 8, "line": 6, "msg": "i = 7: P[5] = T[7] = a → q = 5"}, {"mode": "kmp", "i": 8, "q": 6, "s": 2, "cmp": [8, 6], "res": "eq", "jump": null, "found": [], "nc": 9, "line": 6, "msg": "i = 8: P[6] = T[8] = c → q = 6"}, {"mode": "kmp", "i": 9, "q": 7, "s": 2, "cmp": [9, 7], "res": "eq", "jump": null, "found": [], "nc": 10, "line": 6, "msg": "i = 9: P[7] = T[9] = a → q = 7"}, {"mode": "kmp", "i": 9, "q": 7, "s": 2, "cmp": null, "res": "found", "jump": null, "found": [3], "nc": 10, "line": 8, "msg": "i = 9: q = m = 7 → találat: 3 (T[3..9]); q = π[7] = 1 – vége: 10 összehasonlítás, találatok: [3]"}];
const CODE = ["KMP-KERESES(T, P):", "  π = PREFIX-FUGGVENY(P); q = 0", "  for i = 1 to n:", "    while q > 0 és P[q+1] != T[i]:", "      q = π[q]", "    ha q < m és P[q+1] == T[i]:", "      q = q + 1", "    ha q == m:", "      eredmény.HOZZÁAD(i - m + 1)", "      q = π[q]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CT = "abababaca", CP = "ababaca";
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.3"/></pattern></defs>';
  const T = CT, P = CP, n = T.length, m = P.length, pi = PIF(P);
  const w = Math.min(40, 500 / Math.max(n, m + 1)), x0 = 40;
  const cell = (x, y, ch, o) => { o = o || {};
    el("rect", {x, y, width: w, height: w, fill: css("--cell"), stroke: css("--line"), "stroke-width": o.bold ? 3 : 1.2});
    if (o.hatch) el("rect", {x, y, width: w, height: w, fill: "url(#hp)", stroke: "none"});
    if (o.hatch) el("rect", {x: x + w/2 - 9, y: y + w/2 - 11, width: 18, height: 22, fill: css("--bg")});
    el("text", {x: x + w/2, y: y + w/2 + 6, "text-anchor": "middle", "font-size": 17, "font-family": "monospace"}, ch);
    if (o.x) { el("line", {x1: x + 4, y1: y + 4, x2: x + w - 4, y2: y + w - 4, stroke: css("--hl2"), "stroke-width": 2.5});
               el("line", {x1: x + w - 4, y1: y + 4, x2: x + 4, y2: y + w - 4, stroke: css("--hl2"), "stroke-width": 2.5}); } };
  if (s.mode === "pi") {
    el("text", {x: 20, y: 30, "font-size": 14, "font-weight": "bold"}, `PREFIX-FUGGVENY · q = ${s.q} · k = ${s.k}`);
    for (let j = 1; j <= m; j++) {
      cell(x0 + (j-1)*w, 80, P[j-1], {bold: j === s.q, hatch: j <= s.k});
      el("text", {x: x0 + (j-0.5)*w, y: 72, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(j));
      el("text", {x: x0 + (j-0.5)*w, y: 80 + w + 24, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, j <= s.q ? String(s.pi[j-1]) : "·");
    }
    el("text", {x: x0 - 8, y: 80 + w + 24, "text-anchor": "end", "font-size": 13}, "π");
    el("text", {x: 20, y: 250, "font-size": 12, fill: css("--muted")}, "sraffozott = P[1..k], a leghosszabb valódi prefix, amely a P[1..q] szuffixe");
    return;
  }
  const yT = 70, yP = 130;
  for (let p = 1; p <= n; p++) {
    cell(x0 + (p-1)*w, yT, T[p-1], {bold: s.cmp && s.cmp[0] === p});
    el("text", {x: x0 + (p-0.5)*w, y: yT - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(p));
  }
  el("text", {x: x0 - 10, y: yT + w/2 + 6, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, "T");
  for (let j = 1; j <= m; j++) {
    const p = s.s + j; if (p > n + m) continue;
    const matched = s.mode === "kmp" ? j <= s.q : (s.cmp ? (j < s.cmp[1] || (j === s.cmp[1] && s.res === "eq")) : false);
    cell(x0 + (p-1)*w, yP, P[j-1], {hatch: matched, x: s.cmp && s.res === "ne" && s.cmp[1] === j});
  }
  el("text", {x: x0 + s.s*w - 10, y: yP + w/2 + 6, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, "P");
  if (s.i) el("text", {x: x0 + (s.i-0.5)*w, y: yT - 22, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl")}, "↓ i");
  el("text", {x: 20, y: 24, "font-size": 14, "font-weight": "bold"},
     (s.mode === "kmp" ? "KMP" : "naiv") + (s.i ? ` · i = ${s.i}` : "") + ` · q = ${s.q} · eltolás = ${s.s} · összehasonlítás: ${s.nc}` + (s.found.length ? ` · találat: ${s.found.join(", ")}` : ""));
  if (s.mode === "kmp") {
    const yp = 220;
    el("text", {x: x0 - 10, y: yp + 20, "text-anchor": "end", "font-size": 13}, "π");
    for (let j = 1; j <= m; j++) {
      el("rect", {x: x0 + (j-1)*w, y: yp, width: w, height: 28, fill: css("--cell"), stroke: css("--line"),
                  "stroke-width": s.jump && s.jump[0] === j ? 3 : 1});
      el("text", {x: x0 + (j-0.5)*w, y: yp + 20, "text-anchor": "middle", "font-size": 14, "font-weight": s.jump && s.jump[1] === pi[j] && s.jump[0] === j ? "bold" : "normal"}, String(pi[j]));
      el("text", {x: x0 + (j-0.5)*w, y: yp + 44, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(j));
    }
    if (s.jump) el("text", {x: x0 + m*w + 12, y: yp + 20, "font-size": 13, fill: css("--hl2")}, `π[${s.jump[0]}] = ${s.jump[1]}: ugrás ${s.jump[0] - s.jump[1]}-vel`);
  }
}
function PIF(P){ const m = P.length, pi = new Array(m + 1).fill(0); let k = 0;
  for (let q = 2; q <= m; q++) { while (k > 0 && P[k] !== P[q-1]) k = pi[k]; if (P[k] === P[q-1]) k++; pi[q] = k; } return pi; }
function prefixSteps(P){
  const m = P.length, pi = new Array(m + 1).fill(0); let k = 0; const st = [];
  for (let q = 2; q <= m; q++) {
    while (k > 0 && P[k] !== P[q-1]) { st.push({mode: "pi", q, k, pi: pi.slice(1), line: 3, msg: `q = ${q}: P[${k+1}] = ${P[k]} ≠ P[${q}] = ${P[q-1]} → k = π[${k}] = ${pi[k]}`}); k = pi[k]; }
    let how;
    if (P[k] === P[q-1]) { k++; how = `P[${k}] = P[${q}] = ${P[q-1]} → k = ${k}`; } else how = `P[1] = ${P[0]} ≠ P[${q}] = ${P[q-1]}, k = 0`;
    pi[q] = k;
    st.push({mode: "pi", q, k, pi: pi.slice(1), line: 6, msg: `q = ${q}: ${how}; π[${q}] = ${k}`});
  }
  if (!st.length) st.push({mode: "pi", q: 1, k: 0, pi: [0], line: -1, msg: "Egybetűs minta: π[1] = 0"});
  return st;
}
function kmp(T, P){
  const n = T.length, m = P.length, pi = PIF(P); let q = 0, nc = 0; const found = [];
  const out = [{mode: "kmp", i: null, q: 0, s: 0, cmp: null, res: null, jump: null, found: [], nc: 0, line: 1,
                msg: `Kezdet: T = ${T}, P = ${P}, π = [${pi.slice(1).join(", ")}], q = 0`}];
  for (let i = 1; i <= n; i++) {
    while (q > 0 && P[q] !== T[i-1]) {
      nc++;
      out.push({mode: "kmp", i, q, s: i - 1 - q, cmp: [i, q + 1], res: "ne", jump: null, found: found.slice(), nc, line: 3, msg: `i = ${i}: P[${q+1}] = ${P[q]} ≠ T[${i}] = ${T[i-1]}`});
      const old = q; q = pi[q];
      out.push({mode: "kmp", i, q, s: i - 1 - q, cmp: null, res: null, jump: [old, q], found: found.slice(), nc, line: 4, msg: `i = ${i}: q = π[${old}] = ${q} → a minta ${old - q} pozícióval jobbra csúszik (eltolás ${i - 1 - q}); i nem változik`});
    }
    if (q < m) {
      nc++;
      if (P[q] === T[i-1]) { q++; out.push({mode: "kmp", i, q, s: i - q, cmp: [i, q], res: "eq", jump: null, found: found.slice(), nc, line: 6, msg: `i = ${i}: P[${q}] = T[${i}] = ${T[i-1]} → q = ${q}`}); }
      else out.push({mode: "kmp", i, q, s: i - q, cmp: [i, q + 1], res: "ne", jump: null, found: found.slice(), nc, line: 5, msg: `i = ${i}: P[1] = ${P[0]} ≠ T[${i}] = ${T[i-1]}, q = 0 marad`});
    }
    if (q === m) {
      found.push(i - m + 1);
      out.push({mode: "kmp", i, q, s: i - m, cmp: null, res: "found", jump: null, found: found.slice(), nc, line: 8, msg: `i = ${i}: q = m = ${m} → találat: ${i - m + 1} (T[${i - m + 1}..${i}]); q = π[${m}] = ${pi[m]}`});
      q = pi[m];
    }
  }
  out[out.length-1].msg += ` – vége: ${nc} összehasonlítás, találatok: ${found.length ? "[" + found.join(", ") + "]" : "nincs"}`;
  return out;
}
function naive(T, P){
  const n = T.length, m = P.length; let nc = 0; const found = [];
  const out = [{mode: "naiv", i: null, q: 0, s: 0, cmp: null, res: null, jump: null, found: [], nc: 0, line: -1, msg: `Naiv keresés: T = ${T}, P = ${P}`}];
  for (let s = 0; s <= n - m; s++) {
    let j = 1;
    while (j <= m) {
      nc++; const ok = P[j-1] === T[s+j-1];
      out.push({mode: "naiv", i: s + j, q: ok ? j : j - 1, s, cmp: [s + j, j], res: ok ? "eq" : "ne", jump: null, found: found.slice(), nc, line: -1,
                msg: `s = ${s}, j = ${j}: P[${j}] = ${P[j-1]} ${ok ? "=" : "≠"} T[${s+j}] = ${T[s+j-1]}`});
      if (!ok) break; j++;
    }
    if (j > m) { found.push(s + 1); out[out.length-1].found = found.slice(); out[out.length-1].msg += ` → találat: ${s + 1}`; }
  }
  out[out.length-1].msg += ` – vége: ${nc} összehasonlítás (a szövegindex visszalép)`;
  return out;
}
function load(){
  const e = document.getElementById("err"), T = document.getElementById("tt").value.trim(), P = document.getElementById("pp").value.trim();
  if (!T || !P || T.length > 12 || P.length > T.length) { e.textContent = "1–12 karakteres T és legfeljebb ilyen hosszú, nem üres P kell."; return; }
  e.textContent = ""; CT = T; CP = P;
  const md = document.getElementById("md").value;
  setSteps(md === "kmp" ? kmp(T, P) : md === "naiv" ? naive(T, P) : prefixSteps(P));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
