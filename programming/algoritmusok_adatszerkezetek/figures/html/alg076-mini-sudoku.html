<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini-Sudoku MRV-vel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Cellaválasztás: <select id="h" onchange="load()" aria-label="Cellaválasztás"><option value="mrv">MRV</option><option value="naiv">naiv (első üres)</option></select></label><label>Értéksorrend: <select id="o" onchange="load()" aria-label="Értéksorrend"><option value="asc">növekvő</option><option value="desc">csökkenő</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4×4-es mini-Sudoku kitöltése MRV-vel: (1,2)=2, (2,2)=4, (2,1)=3, (2,4)=2, (3,2)=1, (3,4)=3, (4,1)=4, (4,3)=2."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.3.2 SOLVE / FIND_EMPTY_MRV / CANDIDATES átirata 4×4-es táblára (2×2 blokkok, 1-től indexelt sor/oszlop). MRV-vel (bármely értéksorrendben) 0 visszalépés; a naiv cellaválasztás csökkenő értéksorrenddel 1 visszalépést mutat ((2,1)=4 után a (2,2) jelöltlistája üres).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["SOLVE(board):", "    (r, c) = FIND_EMPTY_MRV(board)   [naiv: első üres cella]", "    if (r, c) == NIL: return IGAZ", "    for num in CANDIDATES(board, r, c):", "        board[r][c] = num", "        if SOLVE(board): return IGAZ", "        board[r][c] = 0      // visszalépés", "    return NIL"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const B0 = [[1,0,3,4],[0,0,1,0],[2,0,4,0],[0,3,0,1]];
function cand(b, r, c){ const u = new Set(b[r]); for (let k = 0; k < 4; k++) u.add(b[k][c]); const br = (r >> 1) * 2, bc = (c >> 1) * 2;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) u.add(b[br + i][bc + j]); return [1, 2, 3, 4].filter(d => !u.has(d)); }
function pick(b, mrv){ let best = null, bc = 10; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (b[r][c] === 0) {
  if (!mrv) return [r, c]; const k = cand(b, r, c); if (k.length < bc) { bc = k.length; best = [r, c]; if (!k.length) return [r, c]; } } return best; }
function solve(mrv, desc){
  const b = B0.map(r => r.slice()), st = []; let back = 0;
  const snap = (line, msg, cur, dead) => st.push({b: b.map(r => r.slice()), cur: cur || null, line, msg, back, dead: !!dead});
  snap(-1, "Kiindulás: a jelöltlisták az üres cellákban");
  function rec(){ const p = pick(b, mrv); if (!p) return true; const [r, c] = p; let cs = cand(b, r, c); if (desc) cs = cs.slice().reverse();
    if (!cs.length) snap(3, `(${r + 1},${c + 1}): üres jelöltlista → zsákutca`, p, true);
    for (const v of cs) { const opts = cand(b, r, c); b[r][c] = v; snap(4, `(${r + 1},${c + 1}) jelöltjei {${opts.join(", ")}} → ${v}`, p);
      if (rec()) return true; b[r][c] = 0; back++; snap(6, `visszalépés: (${r + 1},${c + 1}) = ${v} visszavonva`, p); }
    return false; }
  const ok = rec(); snap(2, (ok ? "Kész: nincs üres cella" : "NIL") + `; visszalépések száma: ${back}`); return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300"); const z = 62, x0 = 40, y0 = 30;
  el("defs", {}).innerHTML = `<pattern id="ph" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="0" y1="4" x2="8" y2="4" stroke="${css("--muted")}" stroke-width="1"/></pattern>` +
    `<pattern id="pv" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="4" y1="0" x2="4" y2="8" stroke="${css("--muted")}" stroke-width="1"/></pattern>` +
    `<pattern id="pd" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.1" fill="${css("--muted")}"/></pattern>`;
  if (s.cur) { const [r, c] = s.cur, br = (r >> 1) * 2, bc = (c >> 1) * 2;
    el("rect", {x: x0, y: y0 + r * z, width: 4 * z, height: z, fill: "url(#ph)"}); el("rect", {x: x0 + c * z, y: y0, width: z, height: 4 * z, fill: "url(#pv)"});
    el("rect", {x: x0 + bc * z, y: y0 + br * z, width: 2 * z, height: 2 * z, fill: "url(#pd)"}); }
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { const x = x0 + c * z, y = y0 + r * z, v = s.b[r][c], g = B0[r][c] !== 0;
    el("rect", {x, y, width: z, height: z, fill: "none", stroke: css("--line"), "stroke-width": 0.8});
    if (v) { el("rect", {x: x + 16, y: y + 12, width: 30, height: 38, fill: css("--bg")});
      el("text", {x: x + z / 2, y: y + 41, "text-anchor": "middle", "font-size": 28, "font-weight": g ? "bold" : "normal", "font-style": g ? "normal" : "italic", "text-decoration": g ? "none" : "underline"}, String(v)); }
    else { const k = cand(s.b, r, c); el("rect", {x: x + 8, y: y + 22, width: z - 16, height: 18, fill: css("--bg")});
      el("text", {x: x + z / 2, y: y + 36, "text-anchor": "middle", "font-size": 13, fill: k.length ? css("--muted") : css("--hl2"), "font-weight": k.length ? "normal" : "bold"}, k.length ? k.join(" ") : "∅"); } }
  for (const k of [0, 2, 4]) { el("line", {x1: x0, y1: y0 + k * z, x2: x0 + 4 * z, y2: y0 + k * z, stroke: css("--line"), "stroke-width": 3});
    el("line", {x1: x0 + k * z, y1: y0, x2: x0 + k * z, y2: y0 + 4 * z, stroke: css("--line"), "stroke-width": 3}); }
  if (s.cur) { const [r, c] = s.cur; el("rect", {x: x0 + c * z, y: y0 + r * z, width: z, height: z, fill: "none", stroke: s.dead ? css("--hl2") : css("--hl"), "stroke-width": 5});
    if (s.dead) el("line", {x1: x0 + c * z + 6, y1: y0 + r * z + 6, x2: x0 + (c + 1) * z - 6, y2: y0 + (r + 1) * z - 6, stroke: css("--fg"), "stroke-width": 4}); }
  for (let k = 0; k < 4; k++) { el("text", {x: x0 + (k + 0.5) * z, y: y0 - 8, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, k + 1);
    el("text", {x: x0 - 10, y: y0 + (k + 0.5) * z + 4, "text-anchor": "end", "font-size": 12, fill: css("--muted")}, k + 1); }
  el("text", {x: 330, y: 50, "font-size": 15}, "visszalépések: " + s.back);
  ["félkövér = bemenet", "dőlt, aláhúzott = a megoldó írta", "kis számok = jelöltlista, ∅ = üres", "vastag keret = vizsgált cella",
   "vízszintes / függőleges vonalkázás:", "  a kényszert adó sor / oszlop", "pontozás = a 2×2 blokk", "áthúzott cella = zsákutca"].forEach((t, i) =>
    el("text", {x: 330, y: 90 + i * 20, "font-size": 12, fill: css("--muted")}, t));
}
function load(){ setSteps(solve(document.getElementById("h").value === "mrv", document.getElementById("o").value === "desc")); }

STEPS = solve(true, false);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
