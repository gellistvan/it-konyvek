<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ford–Fulkerson rossz útválasztással vs. Edmonds–Karp</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="M">M =</label><input id="M" type="range" min="1" max="20" value="5" style="flex:0 1 140px" oninput="load()" aria-label="M értéke"><b id="Mv">5</b><label>jobb oldal: <select id="mode" onchange="load()" aria-label="Jobb oldali algoritmus"><option value="bfs">Edmonds–Karp (BFS)</option><option value="dfs">saját DFS-sorrend</option></select></label><span id="ord" style="display:none">s: <select id="os" onchange="load()" aria-label="s szomszédsorrendje"><option>ab</option><option>ba</option></select> a: <select id="oa" onchange="load()" aria-label="a szomszédsorrendje"><option>bts</option><option>tbs</option><option>sbt</option></select> b: <select id="ob" onchange="load()" aria-label="b szomszédsorrendje"><option>ats</option><option>tas</option><option>sat</option></select></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalt a kényszerített, váltakozó útválasztás M = 5 mellett 10 iterációt tesz, jobb oldalt az Edmonds–Karp 2 iterációval végez; mindkettő |f| = 10."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 25.2.4 hálózata. A 2M iteráció csak rosszindulatú, felváltva s→a→b→t és s→b→a→t utat adó útválasztással jön létre; a „saját DFS-sorrend” móddal ellenőrizhető, hogy egy szokásos DFS bármely szomszédsorrenddel néhány (legfeljebb 4) iterációban végez.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

let M = 5, MODE = "bfs";
const POSL = {s: [20, 150], a: [130, 60], b: [130, 240], t: [240, 150]};
const POSR = {s: [320, 150], a: [430, 60], b: [430, 240], t: [540, 150]};
const net = () => ({"s-a": M, "s-b": M, "a-b": 1, "a-t": M, "b-t": M});
function resid(C, f){ const r = {}; for (const k in C) { const [u, v] = k.split("-"); r[k] = (r[k] || 0) + C[k] - f[k]; r[v + "-" + u] = (r[v + "-" + u] || 0) + f[k]; } return r; }
function aug(C, f, p){ const r = resid(C, f); let b = Infinity; for (let i = 0; i + 1 < p.length; i++) b = Math.min(b, r[p[i] + "-" + p[i + 1]]);
  for (let i = 0; i + 1 < p.length; i++) { const k = p[i] + "-" + p[i + 1]; if (k in C && C[k] - f[k] > 0) f[k] += b; else f[p[i + 1] + "-" + p[i]] -= b; } return b; }
function forced(){ const C = net(), f = {}; for (const k in C) f[k] = 0; const h = [{f: {...f}, p: null, b: 0}]; let k = 0;
  while (true) { const p = k % 2 === 0 ? ["s","a","b","t"] : ["s","b","a","t"], r = resid(C, f);
    if (Math.min(r[p[0] + "-" + p[1]], r[p[1] + "-" + p[2]], r[p[2] + "-" + p[3]]) <= 0) break; const b = aug(C, f, p); k++; h.push({f: {...f}, p, b}); }
  return h; }
function adjOf(){ if (MODE === "bfs") return {s: ["a","b"], a: ["b","t","s"], b: ["t","a","s"], t: ["a","b"]};
  return {s: document.getElementById("os").value.split(""), a: document.getElementById("oa").value.split(""), b: document.getElementById("ob").value.split(""), t: ["a","b"]}; }
function other(){ const C = net(), f = {}; for (const k in C) f[k] = 0; const h = [{f: {...f}, p: null, b: 0}], adj = adjOf();
  while (true) { const r = resid(C, f), par = {s: null}; let found = false;
    if (MODE === "bfs") { const q = ["s"]; while (q.length) { const u = q.shift(); for (const v of adj[u]) if (!(v in par) && (r[u + "-" + v] || 0) > 0) { par[v] = u; q.push(v); } } found = "t" in par; }
    else { const go = u => { if (u === "t") return true; for (const v of adj[u]) if (!(v in par) && (r[u + "-" + v] || 0) > 0) { par[v] = u; if (go(v)) return true; } return false; }; found = go("s"); }
    if (!found) break; const p = ["t"]; let x = "t"; while (par[x]) { x = par[x]; p.push(x); } p.reverse(); const b = aug(C, f, p); h.push({f: {...f}, p, b}); if (h.length > 4 * M + 5) break; }
  return h; }
let HL = [], HR = [];
function build(){ HL = forced(); HR = other(); const n = Math.max(HL.length, HR.length), st = [];
  const v = f => f["s-a"] + f["s-b"], nm = MODE === "bfs" ? "Edmonds–Karp (BFS)" : "DFS (saját sorrend)";
  for (let k = 0; k < n; k++) { const l = HL[Math.min(k, HL.length - 1)], r = HR[Math.min(k, HR.length - 1)];
    const ml = k === 0 ? "kezdés, f = 0" : (k < HL.length ? `${k}. iteráció: ${l.p.join("→")} (+${l.b}), |f| = ${v(l.f)}` : `kész ${HL.length - 1} iteráció után, |f| = ${v(l.f)}`);
    const mr = k === 0 ? "kezdés, f = 0" : (k < HR.length ? `${k}. iteráció: ${r.p.join("→")} (+${r.b}), |f| = ${v(r.f)}` : `kész ${HR.length - 1} iteráció után, |f| = ${v(r.f)}`);
    st.push({k, msg: `Kényszerített: ${ml}.   |   ${nm}: ${mr}.`}); }
  return st; }
function draw(P, h, k, title, last){ const C = net(), s = h[Math.min(k, h.length - 1)], pe = new Set();
  if (k > 0 && k < h.length && s.p) for (let i = 0; i + 1 < s.p.length; i++) pe.add(s.p[i] + "-" + s.p[i + 1]);
  G_text(P.s[0], 22, title, {bold: true});
  for (const e in C) { const [u, v] = e.split("-"), on = pe.has(e), rev = pe.has(v + "-" + u);
    G_edge(P[u], P[v], {dir: true, w: on ? 4 : 1.5, color: on ? css("--hl2") : undefined, label: `${s.f[e]}/${C[e]}`});
    if (rev) G_edge(P[v], P[u], {dir: true, w: 3, dash: "7 5", curve: 40, color: css("--hl2")}); }
  for (const v of ["s","a","b","t"]) G_node(P[v], v, {r: 16});
  const done = Math.min(k, h.length - 1), val = s.f["s-a"] + s.f["s-b"];
  G_text(P.s[0], 290, `iteráció: ${done}${k >= h.length - 1 ? " (kész)" : ""} · |f| = ${val}`, {size: 13, bold: true}); }
function render(s){ svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 580 330"); G_defs();
  if (!HL.length) build();
  draw(POSL, HL, s.k, "Kényszerített útválasztás", true);
  draw(POSR, HR, s.k, MODE === "bfs" ? "Edmonds–Karp (BFS)" : "DFS, saját szomszédsorrend", false);
  G_text(10, 320, "narancs = az aktuális növelő út; szaggatott ív = a b→a visszaélen haladó szakasz; címke f/c", {size: 11, fill: css("--muted")}); }
function load(){ M = +document.getElementById("M").value; document.getElementById("Mv").textContent = M;
  MODE = document.getElementById("mode").value; document.getElementById("ord").style.display = MODE === "dfs" ? "inline" : "none"; setSteps(build()); }

STEPS = build();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
