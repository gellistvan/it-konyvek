<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top-k min-kupac döntetlenkezeléssel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szógyakoriságok: <input id="inp" value="alma:3; dió:2; banán:2; citrom:1; barack:2" size="34" aria-label="Szó:gyakoriság lista"></label><label>k = <input id="kk" type="number" min="1" max="7" value="3" style="width:3.5em" aria-label="k"></label><label><input id="nat" type="checkbox" onchange="load()"> hibás, természetes (frekvencia, szó) kulcs</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Min-kupac k = 3-mal az alma 3, dió 2, banán 2, citrom 1, barack 2 sorozaton; a gyökér a dió, majd a barack beszúrásakor a dió kiesik; kimenet alma 3, banán 2, barack 2."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet top_k_heap függvénye (Python, heapq). A lejátszó a heapq heappush/heapreplace algoritmusát követi, így a kupac tömbje azonos a Pythonéval. A kapcsoló a természetes (frekvencia, szó) kulcsot mutatja: ekkor a banán esik ki, a dió marad – hibásan.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"word": "alma", "freq": 3, "op": "push", "out": null, "line": 5, "heap": [[3, "alma"]], "msg": "alma(3): |H| < k → heappush; gyökér: alma(3)", "correct": true}, {"word": "dió", "freq": 2, "op": "push", "out": null, "line": 5, "heap": [[2, "dió"], [3, "alma"]], "msg": "dió(2): |H| < k → heappush; gyökér: dió(2)", "correct": true}, {"word": "banán", "freq": 2, "op": "push", "out": null, "line": 5, "heap": [[2, "dió"], [3, "alma"], [2, "banán"]], "msg": "banán(2): |H| < k → heappush; gyökér: dió(2)", "correct": true}, {"word": "citrom", "freq": 1, "op": "skip", "out": [1, "citrom"], "line": 6, "heap": [[2, "dió"], [3, "alma"], [2, "banán"]], "msg": "citrom(1): nem jobb a gyökérnél dió(2) → kimarad; gyökér: dió(2)", "correct": true}, {"word": "barack", "freq": 2, "op": "replace", "out": [2, "dió"], "line": 7, "heap": [[2, "barack"], [3, "alma"], [2, "banán"]], "msg": "barack(2): jobb a gyökérnél, dió(2) → heapreplace, dió kiesik; gyökér: barack(2)", "correct": true}, {"word": null, "op": "end", "out": null, "line": 8, "heap": [[2, "barack"], [3, "alma"], [2, "banán"]], "res": [[3, "alma"], [2, "banán"], [2, "barack"]], "msg": "Kimenet (−freq, szó) szerint: (3, alma), (2, banán), (2, barack)", "correct": true}];
const CODE = ["def top_k_heap(counts, k):", "    heap = []", "    for word, freq in counts.items():", "        item = _Candidate(freq, word)", "        if len(heap) < k:", "            heapq.heappush(heap, item)", "        elif heap[0] < item:", "            heapq.heapreplace(heap, item)", "    return sorted(heap, key=(−freq, word))"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CNT = [["alma", 3], ["dió", 2], ["banán", 2], ["citrom", 1], ["barack", 2]], KK = 3;
const LTC = (a, b) => a[0] !== b[0] ? a[0] < b[0] : a[1] > b[1];     // _Candidate.__lt__
const LTN = (a, b) => a[0] !== b[0] ? a[0] < b[0] : a[1] < b[1];     // természetes (freq, word)
function sdown(h, start, pos, lt){ const it = h[pos]; while (pos > start) { const pp = (pos - 1) >> 1; if (lt(it, h[pp])) { h[pos] = h[pp]; pos = pp; continue; } break; } h[pos] = it; }
function sup(h, pos, lt){ const end = h.length, start = pos, it = h[pos]; let c = 2*pos + 1;
  while (c < end) { const r = c + 1; if (r < end && !lt(h[c], h[r])) c = r; h[pos] = h[c]; pos = c; c = 2*pos + 1; } h[pos] = it; sdown(h, start, pos, lt); }
function trace(cnt, k, correct){
  const lt = correct ? LTC : LTN, h = [], st = [];
  for (const [w, f] of cnt) { const it = [f, w]; let op, out = null, line, msg;
    if (h.length < k) { h.push(it); sdown(h, 0, h.length - 1, lt); op = "push"; line = 5; msg = `${w}(${f}): |H| < k → heappush`; }
    else if (lt(h[0], it)) { out = h[0]; h[0] = it; sup(h, 0, lt); op = "replace"; line = 7; msg = `${w}(${f}): jobb a gyökérnél, ${out[1]}(${out[0]}) → heapreplace, ${out[1]} kiesik`; }
    else { op = "skip"; out = it; line = 6; msg = `${w}(${f}): nem jobb a gyökérnél ${h[0][1]}(${h[0][0]}) → kimarad`; }
    st.push({word: w, freq: f, op, out, line, heap: h.map(x => x.slice()), correct, msg: msg + `; gyökér: ${h[0][1]}(${h[0][0]})`}); }
  const res = h.slice().sort((a, b) => (b[0] - a[0]) || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0));
  st.push({word: null, op: "end", out: null, line: 8, heap: h.map(x => x.slice()), res, correct, msg: (correct ? "" : "HIBÁS kulcs – ") + "Kimenet (−freq, szó) szerint: " + res.map(([f, w]) => `(${f}, ${w})`).join(", ")});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 300");
  const h = s.heap || [], bw = 104, bh = 28;
  el("text", {x: 10, y: 22, "font-size": 15, "font-weight": "bold"}, s.correct === false ? "hibás kulcs: (frekvencia, szó)" : "helyes kulcs: _Candidate (döntetlennél a nagyobb szó a rosszabb)");
  const P = i => { const d = Math.floor(Math.log2(i + 1)), first = 2 ** d - 1, cnt = 2 ** d; return [20 + (i - first + 0.5) * (420 / cnt), 60 + d * 62]; };
  h.forEach((e, i) => { if (i > 0) { const [x, y] = P(i), [px, py] = P((i - 1) >> 1); el("line", {x1: px, y1: py + bh/2, x2: x, y2: y - bh/2, stroke: css("--line"), "stroke-width": 1.2}); } });
  h.forEach((e, i) => { const [x, y] = P(i), w = Math.min(bw, 420 / 2 ** Math.floor(Math.log2(i + 1)) - 6), isNew = s.word === e[1];
    el("rect", {x: x - w/2, y: y - bh/2, width: w, height: bh, rx: 6, fill: isNew ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": i === 0 ? 3.5 : 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": w < 70 ? 11 : 14}, `${e[1]}(${e[0]})`); });
  if (h.length) el("text", {x: P(0)[0] + bw/2 + 8, y: P(0)[1] + 5, "font-size": 12, fill: css("--muted")}, "← gyökér = heap[0]");
  if (s.out) { const x = 520, y = 80;
    el("rect", {x: x - 52, y: y - 14, width: 104, height: 28, rx: 6, fill: css("--cell"), stroke: css("--line")});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 14}, `${s.out[1]}(${s.out[0]})`);
    el("line", {x1: x - 52, y1: y + 14, x2: x + 52, y2: y - 14, stroke: s.op === "replace" ? "#c00000" : css("--line"), "stroke-width": 2.5});
    el("text", {x, y: y - 22, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, s.op === "replace" ? "kiesik" : "kimarad"); }
  if (s.res) el("text", {x: 10, y: 262, "font-size": 15, "font-weight": "bold", fill: s.correct === false ? "#c00000" : css("--fg")}, "kimenet: " + s.res.map(([f, w]) => `(${f}, ${w})`).join(", "));
  el("text", {x: 10, y: 292, "font-size": 12, fill: css("--muted")}, "heapq min-kupac: vastag = gyökér · szürke = új elem · áthúzva = kieső/kimaradó");
}
function load(){
  const msg = document.getElementById("err");
  try { CNT = document.getElementById("inp").value.split(/[;,]\s*/).filter(x => x.trim()).map(p => { const [w, f] = p.trim().split(/[: ]+/); if (!w || !Number.isInteger(+f)) throw 0; return [w, +f]; }); }
  catch (e) { msg.textContent = "Formátum: szó:gyakoriság; pl. alma:3; dió:2"; return; }
  KK = +document.getElementById("kk").value;
  if (CNT.length < 1 || CNT.length > 14 || !(KK >= 1 && KK <= 7)) { msg.textContent = "1–14 szó, 1 ≤ k ≤ 7."; return; }
  msg.textContent = ""; setSteps(trace(CNT, KK, !document.getElementById("nat").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
