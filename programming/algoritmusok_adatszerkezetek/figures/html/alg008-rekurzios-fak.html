<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekurziós fák szintösszegekkel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = <select id="ia" onchange="load()" aria-label="a ="><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>b = <select id="ib" onchange="load()" aria-label="b ="><option selected>2</option><option>3</option><option>4</option></select></label><label>d = <select id="id" onchange="load()" aria-label="d ="><option>0</option><option selected>1</option><option>2</option></select></label><label>n = b^ <select id="ik" onchange="load()" aria-label="n = b^"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label><button onclick="preset(2, 2, 1, 3)">(a) 2T(n/2)+n, n = 8</button><button onclick="preset(3, 4, 2, 2)">(b) 3T(n/4)+cn², n = 16</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Rekurziós fa szintenként kibontva; jobbra a szintösszegek oszlopa és a kumulált összeg."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Idealizált modell: n a b hatványa, c = 1, T(1) = f(1) = 1. Lépés ▶ = egy szinttel mélyebb kibontás; 4 szint után (vagy 27-nél több csúcsnál) a szint összevont sorként jelenik meg. Az eset a mestertétel szerinti összevetés: log_b a és d.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": 2, "b": 2, "d": 1, "n": 8, "upto": 0, "line": 1, "msg": "szint 0: 2^0 · f(8/2^0) = 1 · 8^1 = 8; eddigi összeg 8; 2. eset: log_b a = d = 1 → Θ(n^1 log n)"}, {"a": 2, "b": 2, "d": 1, "n": 8, "upto": 1, "line": 1, "msg": "szint 1: 2^1 · f(8/2^1) = 2 · 4^1 = 8; eddigi összeg 16; 2. eset: log_b a = d = 1 → Θ(n^1 log n)"}, {"a": 2, "b": 2, "d": 1, "n": 8, "upto": 2, "line": 1, "msg": "szint 2: 2^2 · f(8/2^2) = 4 · 2^1 = 8; eddigi összeg 24; 2. eset: log_b a = d = 1 → Θ(n^1 log n)"}, {"a": 2, "b": 2, "d": 1, "n": 8, "upto": 3, "line": 1, "msg": "szint 3: 2^3 · f(8/2^3) = 8 · 1^1 = 8; eddigi összeg 32; 2. eset: log_b a = d = 1 → Θ(n^1 log n)"}];
const CODE = ["T(n) = a·T(n/b) + n^d", "szint i: aⁱ · (n/bⁱ)^d", "T(n) = Σ szintösszegek"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function levels(a, b, d, n){ const out = []; let i = 0, size = n; while (true) { const cnt = Math.pow(a, i); out.push([i, cnt, size, Math.pow(size, d), cnt * Math.pow(size, d)]); if (size <= 1) return out; size = size / b; i++; } }
function caseOf(a, b, d){ const e = Math.log(a) / Math.log(b), f = x => (Math.round(x * 100) / 100).toString().replace(".", ",");
  if (Math.abs(e - d) < 1e-9) return `2. eset: log_b a = d = ${d} → Θ(n^${d} log n)`;
  if (e > d) return `1. eset: log_b a ≈ ${f(e)} > d = ${d} → Θ(n^(log_b a)), a levelek dominálnak`;
  return `3. eset: log_b a ≈ ${f(e)} < d = ${d} → Θ(n^${d}), a gyökér dominál`; }
function build(a, b, d, n){ const L = levels(a, b, d, n), k = caseOf(a, b, d); let acc = 0;
  return L.map(r => { acc += r[4]; return {a, b, d, n, upto: r[0], line: 1,
    msg: `szint ${r[0]}: ${a}^${r[0]} · f(${n}/${b}^${r[0]}) = ${r[1]} · ${r[2]}^${d} = ${r[4]}; eddigi összeg ${acc}; ${k}`}; }); }
function render(s){
  svg.innerHTML = "";
  const L = levels(s.a, s.b, s.d, s.n), W = 400, x0 = 10, dy = 50, y0 = 44;
  svg.setAttribute("viewBox", `0 0 560 ${Math.max(300, y0 + L.length * dy + 40)}`);
  el("text", {x: 480, y: 16, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "szintösszeg");
  let prev = null, acc = 0;
  L.forEach(r => {
    const [i, cnt, size, ce, ls] = r, y = y0 + i * dy;
    if (i > s.upto) return;
    acc += ls;
    if (i < 4 && cnt <= 27) {
      const xs = []; for (let j = 0; j < cnt; j++) xs.push(x0 + (j + 0.5) * W / cnt);
      const bw = Math.min(56, W / cnt * 0.85);
      xs.forEach((x, j) => {
        if (prev) { const px = prev[Math.floor(j / (cnt / prev.length))]; el("line", {x1: px, y1: y - dy + 14, x2: x, y2: y - 13, stroke: css("--line"), "stroke-width": 0.8}); }
        el("rect", {x: x - bw/2, y: y - 13, width: bw, height: 26, rx: 4, fill: i === s.upto ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.1});
        if (bw >= 14) el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": Math.min(13, bw / 3 + 4)}, String(+size.toFixed(4)).replace(".", ","));
      });
      prev = xs;
    } else {
      el("rect", {x: x0, y: y - 13, width: W, height: 26, fill: i === s.upto ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-dasharray": "5 3"});
      el("text", {x: x0 + W/2, y: y + 5, "text-anchor": "middle", "font-size": 13}, `${cnt} csúcs, mindegyik mérete ${+size.toFixed(4)} (összevont szint)`);
      prev = null;
    }
    el("rect", {x: 425, y: y - 13, width: 110, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2.2});
    el("text", {x: 480, y: y + 5, "text-anchor": "middle", "font-size": 13}, String(+ls.toFixed(4)).replace(".", ","));
  });
  const yb = y0 + (s.upto + 1) * dy;
  el("text", {x: 480, y: yb, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Σ = " + String(+acc.toFixed(4)).replace(".", ","));
}
function load(){
  const a = +document.getElementById("ia").value, b = +document.getElementById("ib").value, d = +document.getElementById("id").value, k = +document.getElementById("ik").value;
  setSteps(build(a, b, d, Math.pow(b, k)));
}
function preset(a, b, d, k){ document.getElementById("ia").value = a; document.getElementById("ib").value = b; document.getElementById("id").value = d; document.getElementById("ik").value = k; load(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
