<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az euklideszi algoritmus négyzetekre bontással</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = <input id="ia" type="number" min="1" max="200" value="48" style="width:5em"></label><label>b = <input id="ib" type="number" min="1" max="200" value="18" style="width:5em"></label><button onclick="load()">Betöltés</button><button onclick="load(89, 55)">Fibonacci-legrosszabb eset (89, 55)</button><button onclick="load(48, 18)">Könyv példája (48, 18)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy a×b-s téglalapból iterációnként a rövidebb oldallal megegyező négyzeteket vágunk le; a legkisebb négyzet oldala a legnagyobb közös osztó."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Python-kód a 2.2.6-ból. Az a mod b a q-szoros kivonás maradéka: minden iteráció q darab b oldalú négyzetet vág le. Feltétel: a, b ≥ 0, (a, b) ≠ (0, 0). Kezdőállapot: a könyv 48, 18 példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": 48, "b": 18, "it": 0, "squares": [], "line": 2, "msg": "Kezdet: a = 48, b = 18; invariáns: gcd(a, b) = gcd(48, 18)"}, {"a": 18, "b": 12, "it": 1, "q": 2, "side": 18, "squares": [[0, 0, 18, 1], [18, 0, 18, 1]], "line": 3, "msg": "1. iteráció: 48 = 2·18 + 12 → a = 18, b = 12; invariáns: gcd(a, b) = gcd(48, 18)"}, {"a": 12, "b": 6, "it": 2, "q": 1, "side": 12, "squares": [[0, 0, 18, 1], [18, 0, 18, 1], [36, 0, 12, 2]], "line": 3, "msg": "2. iteráció: 18 = 1·12 + 6 → a = 12, b = 6; invariáns: gcd(a, b) = gcd(48, 18)"}, {"a": 6, "b": 0, "it": 3, "q": 2, "side": 6, "squares": [[0, 0, 18, 1], [18, 0, 18, 1], [36, 0, 12, 2], [36, 12, 6, 3], [42, 12, 6, 3]], "line": 3, "msg": "3. iteráció: 12 = 2·6 + 0 → a = 6, b = 0; invariáns: gcd(a, b) = gcd(48, 18); a ciklus leáll, eredmény 6"}, {"a": 6, "b": 0, "it": 3, "squares": [[0, 0, 18, 1], [18, 0, 18, 1], [36, 0, 12, 2], [36, 12, 6, 3], [42, 12, 6, 3]], "line": 4, "done": true, "msg": "Vége: b = 0, return a → eredmény 6 = gcd(48, 18); 3 iteráció, a legkisebb négyzet oldala 6"}];
const CODE = ["def gcd(a: int, b: int) -> int:", "    assert a >= 0 and b >= 0 and (a != 0 or b != 0)", "    while b != 0:", "        a, b = b, a % b", "    return a"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PAT = ['<pattern id="p1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="STROKE" stroke-width="1.3"/></pattern>',
             '<pattern id="p2" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="STROKE"/></pattern>',
             '<pattern id="p3" width="6" height="6" patternUnits="userSpaceOnUse"></pattern>',
             '<pattern id="p4" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="STROKE" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="STROKE" stroke-width="1"/></pattern>'];
function render(s){
  const st = css("--muted");
  svg.innerHTML = "<defs>" + PAT.join("").replace(/STROKE/g, st) + "</defs>";
  svg.setAttribute("viewBox", "0 0 560 300");
  const W = CUR[0], H = CUR[1], sc = Math.min(500 / W, 210 / H), x0 = (560 - W * sc) / 2, y0 = 20;
  // matematikai y lefelé: a négyzet (x, y) bal alsó sarka -> SVG
  const X = x => x0 + x * sc, Y = y => y0 + (H - y) * sc;
  el("rect", {x: X(0), y: Y(H), width: W * sc, height: H * sc, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2});
  s.squares.forEach(q => {
    const [x, y, side, it] = q, last = it === s.it && !s.done;
    el("rect", {x: X(x), y: Y(y + side), width: side * sc, height: side * sc, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    el("rect", {x: X(x), y: Y(y + side), width: side * sc, height: side * sc, fill: "url(#p" + (((it - 1) % 4) + 1) + ")",
                stroke: css("--line"), "stroke-width": last ? 4 : ((it - 1) % 4 === 2 ? 3 : 1.2)});
    if (side * sc >= 26) {
      el("rect", {x: X(x + side / 2) - 22, y: Y(y + side / 2) - 11, width: 44, height: 20, fill: css("--bg"), opacity: 0.85});
      el("text", {x: X(x + side / 2), y: Y(y + side / 2) + 5, "text-anchor": "middle", "font-size": 13}, side + "×" + side);
    }
  });
  el("text", {x: 280, y: 262, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"},
     "a = " + s.a + ", b = " + s.b + (s.done ? "   →  gcd = " + s.a : ""));
  el("text", {x: 280, y: 288, "text-anchor": "middle", "font-size": 12, fill: css("--muted")},
     "mintázat = az iteráció sorszáma · vastag keret = most levágott négyzetek");
}
let CUR = [48, 18];
function euclid(a0, b0){
  let a = a0, b = b0, x = 0, y = 0, w = a0, h = b0, it = 0, all = [];
  const st = [{a, b, it: 0, squares: [], line: 2, msg: `Kezdet: a = ${a}, b = ${b}; invariáns: gcd(a, b) = gcd(${a0}, ${b0})`}];
  while (b !== 0) {
    it++;
    const q = Math.floor(a / b), r = a % b, pa = a, pb = b;
    for (let j = 0; j < q; j++) {
      if (w >= h) { all.push([x, y, h, it]); x += h; w -= h; } else { all.push([x, y, w, it]); y += w; h -= w; }
    }
    a = pb; b = r;
    st.push({a, b, it, squares: all.slice(), line: 3,
             msg: `${it}. iteráció: ${pa} = ${q}·${pb} + ${r} → a = ${a}, b = ${b}; invariáns: gcd(a, b) = gcd(${a0}, ${b0})` + (b === 0 ? `; a ciklus leáll, eredmény ${a}` : "")});
  }
  st.push({a, b, it, squares: all.slice(), line: 4, done: true,
           msg: `Vége: b = 0, return a → eredmény ${a} = gcd(${a0}, ${b0}); ${it} iteráció, a legkisebb négyzet oldala ${a}`});
  return st;
}
function load(a, b){
  const e = document.getElementById("err");
  if (a === undefined) { a = +document.getElementById("ia").value; b = +document.getElementById("ib").value; }
  else { document.getElementById("ia").value = a; document.getElementById("ib").value = b; }
  if (![a, b].every(v => Number.isInteger(v) && v >= 1 && v <= 200)) { e.textContent = "1 és 200 közötti egészeket adjon meg."; return; }
  e.textContent = ""; CUR = [a, b]; setSteps(euclid(a, b));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
