<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tömbös verem állapotai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Műveletek: <input id="inp" value="push 3, push 7, push 5, pop, push 9, push 2, push 1" size="44" aria-label="Saját műveletsor (push x / pop / top, vesszővel elválasztva)"></label><label>capacity: <input id="cap" type="range" min="2" max="8" value="4" oninput="document.getElementById('capv').textContent=this.value" aria-label="capacity"> <span id="capv">4</span></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tömbös verem cellasorként; a topIndex mutató a push műveletekkel nő, a pop-pal csökken, a kivett elem áthúzva bent marad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (2.1.5, Stack_Tomb). Kezdőállapot: capacity = 4 és a könyv műveletsora; a 0. lépés a create(4).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"S": [null, null, null, null], "top": 0, "cap": 4, "label": "create(4)", "res": null, "err": null, "line": 1, "msg": "0. lépés, create(4); topIndex = 0; invariáns: S[1..0] = []"}, {"S": [3, null, null, null], "top": 1, "cap": 4, "label": "push(3)", "res": null, "err": null, "line": 5, "msg": "1. lépés, push(3); topIndex = 1; invariáns: S[1..1] = [3]"}, {"S": [3, 7, null, null], "top": 2, "cap": 4, "label": "push(7)", "res": null, "err": null, "line": 5, "msg": "2. lépés, push(7); topIndex = 2; invariáns: S[1..2] = [3, 7]"}, {"S": [3, 7, 5, null], "top": 3, "cap": 4, "label": "push(5)", "res": null, "err": null, "line": 5, "msg": "3. lépés, push(5); topIndex = 3; invariáns: S[1..3] = [3, 7, 5]"}, {"S": [3, 7, 5, null], "top": 2, "cap": 4, "label": "pop()", "res": 5, "err": null, "line": 13, "msg": "4. lépés, pop() → 5; topIndex = 2; invariáns: S[1..2] = [3, 7]"}, {"S": [3, 7, 9, null], "top": 3, "cap": 4, "label": "push(9)", "res": null, "err": null, "line": 5, "msg": "5. lépés, push(9); topIndex = 3; invariáns: S[1..3] = [3, 7, 9]"}, {"S": [3, 7, 9, 2], "top": 4, "cap": 4, "label": "push(2)", "res": null, "err": null, "line": 5, "msg": "6. lépés, push(2); topIndex = 4; invariáns: S[1..4] = [3, 7, 9, 2]"}, {"S": [3, 7, 9, 2], "top": 4, "cap": 4, "label": "push(1)", "res": null, "err": "tele", "line": 4, "msg": "7. lépés, push(1): error \"tele\"; topIndex = 4; invariáns: S[1..4] = [3, 7, 9, 2]"}];
const CODE = ["create(c):", "    capacity <- c; topIndex <- 0", "push(self, x):", "    if topIndex = capacity then", "        error \"tele\"", "    topIndex <- topIndex + 1", "    S[topIndex] <- x", "top(self):", "    if is_empty(self) then error", "    return S[topIndex]", "pop(self):", "    if is_empty(self) then error", "    x <- S[topIndex]", "    topIndex <- topIndex − 1", "    return x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.2"/></pattern></defs>';
  svg.setAttribute("viewBox", "0 0 560 260");
  const n = s.cap, w = Math.min(60, 480 / Math.max(n, 1)), x0 = (560 - n * w) / 2, y0 = 90;
  el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"},
     s.label + (s.res !== null && s.res !== undefined ? " → " + s.res : ""));
  for (let i = 0; i < n; i++) {
    const occ = i < s.top, v = s.S[i];
    el("rect", {x: x0 + i*w, y: y0, width: w, height: w, fill: occ ? css("--cellhl") : css("--cell"),
                stroke: css("--line"), "stroke-width": 1.2});
    if (occ) el("rect", {x: x0 + i*w, y: y0, width: w, height: w, fill: "url(#hp)", stroke: css("--line"), "stroke-width": 1.2});
    if (v !== null) {
      const t = el("text", {x: x0 + i*w + w/2, y: y0 + w/2 + 7, "text-anchor": "middle", "font-size": 20,
                             "font-weight": occ ? "bold" : "normal", opacity: occ ? 1 : 0.4}, String(v).replace("-", "−"));
      if (!occ) el("line", {x1: x0 + i*w + 8, y1: y0 + w - 8, x2: x0 + i*w + w - 8, y2: y0 + 8, stroke: css("--line"), "stroke-width": 1.5});
    }
    el("text", {x: x0 + i*w + w/2, y: y0 - 6, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i + 1));
  }
  if (s.err) {
    el("rect", {x: x0 - 8, y: y0 - 22, width: n*w + 16, height: w + 30, fill: "none", stroke: css("--line"),
                "stroke-width": 2, "stroke-dasharray": "7 5"});
    el("text", {x: 280, y: 58, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, 'error "' + s.err + '"');
  }
  const px = s.top > 0 ? x0 + (s.top - 0.5) * w : x0 - 14;
  el("line", {x1: px, y1: y0 + w + 45, x2: px, y2: y0 + w + 8, stroke: css("--line"), "stroke-width": 2});
  el("path", {d: `M${px-6},${y0+w+16} L${px},${y0+w+6} L${px+6},${y0+w+16} Z`, fill: css("--line")});
  el("text", {x: px, y: y0 + w + 62, "text-anchor": "middle", "font-size": 14}, "topIndex = " + s.top);
  el("text", {x: 280, y: 252, "text-anchor": "middle", "font-size": 12, fill: css("--muted")},
     "sraffozott = a verem eleme · áthúzott = érvénytelen rekesz · szaggatott keret = hiba");
}
function trace(ops){
  let cap = 0, top = 0, S = [];
  const st = [];
  ops.forEach((o, k) => {
    let err = null, res = null, line = -1, label;
    if (o[0] === "create") { cap = o[1]; top = 0; S = Array(cap).fill(null); line = 1; label = "create(" + cap + ")"; }
    else if (o[0] === "push") { label = "push(" + o[1] + ")";
      if (top === cap) { err = "tele"; line = 4; } else { top++; S[top-1] = o[1]; line = 5; } }
    else if (o[0] === "pop") { label = "pop()";
      if (top === 0) { err = "üres"; line = 11; } else { res = S[top-1]; top--; line = 13; } }
    else { label = "top()";
      if (top === 0) { err = "üres"; line = 8; } else { res = S[top-1]; line = 9; } }
    const msg = k + ". lépés, " + label + (res !== null ? " → " + res : "") + (err ? ': error "' + err + '"' : "")
      + "; topIndex = " + top + "; invariáns: S[1.." + top + "] = [" + S.slice(0, top).join(", ") + "]";
    st.push({S: S.slice(), top, cap, label, res, err, line, msg});
  });
  return st;
}
function load(){
  const cap = +document.getElementById("cap").value, e = document.getElementById("err");
  const toks = document.getElementById("inp").value.split(/[,;\n]+/).map(t => t.trim()).filter(t => t);
  const ops = [["create", cap]];
  for (const t of toks) {
    let m;
    if ((m = t.match(/^push\s*\(?\s*(-?\d+)\s*\)?$/i))) ops.push(["push", +m[1]]);
    else if (/^pop\s*(\(\s*\))?$/i.test(t)) ops.push(["pop", null]);
    else if (/^top\s*(\(\s*\))?$/i.test(t)) ops.push(["top", null]);
    else { e.textContent = "Ismeretlen művelet: " + t; return; }
  }
  if (ops.length > 40) { e.textContent = "Legfeljebb 40 művelet."; return; }
  e.textContent = ""; setSteps(trace(ops));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
