<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aho–Corasick-keresés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját szöveg: <input id="inp" value="ushers" size="18" aria-label="Saját szöveg"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('inp').value='ahishers';load()">Példa: ahishers</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Aho–Corasick-automata tíz csúccsal; lépésenként kiemelve az aktuális karakter, csúcs, átmenet és output lánc."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Minták: he, she, his, hers (rögzítve). Teljes átmeneti tábla; a pozíció 1-alapú, a találat a minta utolsó karakterének pozíciója. Kezdőállapot: a könyv „ushers” példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "node": "root", "prev": null, "kind": null, "chain": [], "matches": [], "line": 1, "msg": "Kezdet: node = root, matches = üres", "text": "ushers"}, {"i": 1, "node": "root", "prev": "root", "kind": "gyökér", "chain": [], "matches": [], "line": 4, "msg": "i = 1, c = 'u': root –u→ root (nincs 'u' kezdetű prefix). Nincs találat", "text": "ushers"}, {"i": 2, "node": "s", "prev": "root", "kind": "trie", "chain": [], "matches": [], "line": 4, "msg": "i = 2, c = 's': root –s→ s közvetlen trie-él. Nincs találat", "text": "ushers"}, {"i": 3, "node": "sh", "prev": "s", "kind": "trie", "chain": [], "matches": [], "line": 4, "msg": "i = 3, c = 'h': s –h→ sh közvetlen trie-él. Nincs találat", "text": "ushers"}, {"i": 4, "node": "she", "prev": "sh", "kind": "trie", "chain": ["he"], "matches": [["she", 4], ["he", 4]], "line": 7, "msg": "i = 4, c = 'e': sh –e→ she közvetlen trie-él. Találat: (she, 4), (he, 4); output lánc: she → he", "text": "ushers"}, {"i": 5, "node": "her", "prev": "she", "kind": "örökölt", "chain": [], "matches": [["she", 4], ["he", 4]], "line": 4, "msg": "i = 5, c = 'r': she –r→ her öröklött él (she.fail = he, he.children['r'] = her). Nincs találat", "text": "ushers"}, {"i": 6, "node": "hers", "prev": "her", "kind": "trie", "chain": [], "matches": [["she", 4], ["he", 4], ["hers", 6]], "line": 5, "msg": "i = 6, c = 's': her –s→ hers közvetlen trie-él. Találat: (hers, 6)", "text": "ushers"}, {"i": 7, "node": "hers", "prev": null, "kind": null, "chain": [], "matches": [["she", 4], ["he", 4], ["hers", 6]], "line": 9, "msg": "Vége: return (she, 4), (he, 4), (hers, 6)", "text": "ushers"}];
const CODE = ["SearchAC(root, Text[1..n]):", "    node ← root; matches ← üres lista", "    for i ← 1 to n:", "        c ← Text[i]", "        node ← node.children[c]", "        if node.is_end: jelent (id, i)", "        out ← node.output", "        while out ≠ NIL:", "            jelent (out.id, i); out ← out.output", "    return matches"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const AC = {"pos": {"root": [0, 0], "h": [1, 1.0], "he": [2, 1.6], "her": [3, 1.6], "hers": [4, 1.6], "hi": [2, 0.4], "his": [3, 0.4], "s": [1, -1.2], "sh": [2, -1.2], "she": [3, -1.2]}, "trie": [["root", "h", "h"], ["root", "s", "s"], ["h", "e", "he"], ["h", "i", "hi"], ["he", "r", "her"], ["s", "h", "sh"], ["sh", "e", "she"], ["hi", "s", "his"], ["her", "s", "hers"]], "fail": {"root": "root", "h": "root", "s": "root", "he": "root", "hi": "root", "sh": "h", "her": "root", "his": "s", "she": "he", "hers": "s"}, "out": {"root": null, "h": null, "s": null, "he": null, "hi": null, "sh": null, "her": null, "his": null, "she": "he", "hers": null}, "end": ["he", "she", "his", "hers"], "tbl": {"root": {"h": "h", "s": "s", "a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "h": {"e": "he", "i": "hi", "a": "root", "b": "root", "c": "root", "d": "root", "f": "root", "g": "root", "h": "h", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "he": {"r": "her", "a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "h", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "s": {"h": "sh", "a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "sh": {"e": "she", "a": "root", "b": "root", "c": "root", "d": "root", "f": "root", "g": "root", "h": "h", "i": "hi", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "she": {"a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "h", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "her", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "hi": {"s": "his", "a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "h", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "his": {"a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "sh", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "her": {"s": "hers", "a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "h", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}, "hers": {"a": "root", "b": "root", "c": "root", "d": "root", "e": "root", "f": "root", "g": "root", "h": "sh", "i": "root", "j": "root", "k": "root", "l": "root", "m": "root", "n": "root", "o": "root", "p": "root", "q": "root", "r": "root", "s": "s", "t": "root", "u": "root", "v": "root", "w": "root", "x": "root", "y": "root", "z": "root"}}, "trieMap": {"root": {"h": "h", "s": "s"}, "h": {"e": "he", "i": "hi"}, "he": {"r": "her"}, "s": {"h": "sh"}, "sh": {"e": "she"}, "she": {}, "hi": {"s": "his"}, "his": {}, "her": {"s": "hers"}, "hers": {}}};
function X(p){return 40 + p[0]*112;} function Y(p){return 175 - p[1]*62;}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 368");
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="' + css("--line") + '"/></marker>' +
                   '<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="' + css("--hl2") + '"/></marker>';
  // szöveg
  const t = s.text, cw = Math.min(30, 520 / Math.max(1, t.length));
  for (let j = 0; j < t.length; j++) {
    const on = j + 1 === s.i;
    el("rect", {x: 20 + j*cw, y: 8, width: cw, height: 26, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: 20 + j*cw + cw/2, y: 27, "text-anchor": "middle", "font-size": 15}, t[j]);
    el("text", {x: 20 + j*cw + cw/2, y: 46, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(j+1));
  }
  const R = 17, shorten = (a, b, r) => { const dx = b[0]-a[0], dy = b[1]-a[1], L = Math.hypot(dx, dy) || 1; return [a[0]+dx*r/L, a[1]+dy*r/L, b[0]-dx*r/L, b[1]-dy*r/L]; };
  AC.trie.forEach(([u, c, v]) => {
    const a = [X(AC.pos[u]), Y(AC.pos[u])], b = [X(AC.pos[v]), Y(AC.pos[v])], q = shorten(a, b, R);
    const used = s.kind === "trie" && s.prev === u && s.node === v;
    el("line", {x1: q[0], y1: q[1], x2: q[2], y2: q[3], stroke: used ? css("--hl2") : css("--line"), "stroke-width": used ? 3.5 : 1.3, "marker-end": used ? "url(#ah2)" : "url(#ah)"});
    el("text", {x: (a[0]+b[0])/2, y: (a[1]+b[1])/2 - 6, "text-anchor": "middle", "font-size": 13, "font-style": "italic", "font-weight": "bold"}, c);
  });
  for (const u in AC.fail) {
    const f = AC.fail[u]; if (u === "root" || f === "root") continue;
    const a = [X(AC.pos[u]), Y(AC.pos[u])], b = [X(AC.pos[f]), Y(AC.pos[f])], q = shorten(a, b, R);
    const mx = (q[0]+q[2])/2 + (q[3]-q[1])*0.25, my = (q[1]+q[3])/2 - (q[2]-q[0])*0.25;
    el("path", {d: `M${q[0]},${q[1]} Q${mx},${my} ${q[2]},${q[3]}`, fill: "none", stroke: css("--muted"), "stroke-dasharray": "6 4", "stroke-width": 1.2, "marker-end": "url(#ah)"});
  }
  if (s.kind === "örökölt") {
    const a = [X(AC.pos[s.prev]), Y(AC.pos[s.prev])], b = [X(AC.pos[s.node]), Y(AC.pos[s.node])], q = shorten(a, b, R);
    const mx = (q[0]+q[2])/2 - 30, my = (q[1]+q[3])/2 + 40;
    el("path", {d: `M${q[0]},${q[1]} Q${mx},${my} ${q[2]},${q[3]}`, fill: "none", stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": "2 4", "marker-end": "url(#ah2)"});
    el("text", {x: mx, y: my + 4, "text-anchor": "middle", "font-size": 11, fill: css("--hl2")}, "öröklött él");
  }
  for (const u in AC.out) {
    const o = AC.out[u]; if (!o) continue;
    const a = [X(AC.pos[u]), Y(AC.pos[u])], b = [X(AC.pos[o]), Y(AC.pos[o])], q = shorten(a, b, R);
    const on = s.chain.length && s.node === u;
    [-2.5, 2.5].forEach(d => el("path", {d: `M${q[0]+d},${q[1]} Q${(q[0]+q[2])/2+70},${(q[1]+q[3])/2} ${q[2]+d},${q[3]}`, fill: "none", stroke: on ? css("--hl") : css("--line"), "stroke-dasharray": "1.5 3", "stroke-width": on ? 2.4 : 1.2, "marker-end": d > 0 ? "url(#ah)" : ""}));
  }
  for (const u in AC.pos) {
    const p = AC.pos[u], cur = u === s.node, inChain = s.chain.includes(u);
    el("circle", {cx: X(p), cy: Y(p), r: R, fill: cur ? css("--cellhl") : css("--cell"), stroke: inChain ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : (inChain ? 3 : 1.3)});
    if (AC.end.includes(u)) el("circle", {cx: X(p), cy: Y(p), r: R - 4, fill: "none", stroke: css("--line"), "stroke-width": 1});
    el("text", {x: X(p), y: Y(p) + 4, "text-anchor": "middle", "font-size": u.length > 3 ? 10 : 11.5, "font-weight": cur ? "bold" : "normal"}, u);
  }
  el("text", {x: 20, y: 300, "font-size": 13}, "Találatok: " + (s.matches.length ? s.matches.map(m => "(" + m[0] + ", " + m[1] + ")").join(", ") : "–"));
  el("text", {x: 20, y: 322, "font-size": 11, fill: css("--muted")}, "folytonos = trie-él · szaggatott = failure link (a gyökérre mutatók nincsenek rajzolva)");
  el("text", {x: 20, y: 340, "font-size": 11, fill: css("--muted")}, "kettős pontvonal = output link · dupla kör = mintavég");
  el("text", {x: 20, y: 358, "font-size": 11, fill: css("--muted")}, "vastag keret = aktuális csúcs · narancs = a most használt átmenet");
}
function search(text){
  let node = "root", matches = [];
  const st = [{i: 0, node, prev: null, kind: null, chain: [], matches: [], line: 1, text, msg: "Kezdet: node = root, matches = üres"}];
  for (let i = 1; i <= text.length; i++) {
    const c = text[i-1], prev = node;
    node = (AC.tbl[prev] && AC.tbl[prev][c] !== undefined) ? AC.tbl[prev][c] : "root";
    let kind = node === "root" ? "gyökér" : ((AC.trieMap[prev] || {})[c] === node ? "trie" : "örökölt");
    const found = []; if (AC.end.includes(node)) found.push(node);
    const chain = []; let o = AC.out[node];
    while (o) { chain.push(o); found.push(o); o = AC.out[o]; }
    matches = matches.concat(found.map(f => [f, i]));
    let how;
    if (kind === "örökölt") how = `${prev} –${c}→ ${node} öröklött él (${prev}.fail = ${AC.fail[prev]}, ${AC.fail[prev]}.children['${c}'] = ${node})`;
    else if (kind === "trie") how = `${prev} –${c}→ ${node} közvetlen trie-él`;
    else how = `${prev} –${c}→ root (nincs '${c}' kezdetű prefix)`;
    const res = found.length ? "Találat: " + found.map(f => `(${f}, ${i})`).join(", ") : "Nincs találat";
    st.push({i, node, prev, kind, chain, matches, text, line: chain.length ? 7 : (found.length ? 5 : 4),
             msg: `i = ${i}, c = '${c}': ${how}. ${res}` + (chain.length ? "; output lánc: " + [node].concat(chain).join(" → ") : "")});
  }
  st.push({i: text.length + 1, node, prev: null, kind: null, chain: [], matches, text, line: 9,
           msg: "Vége: return " + (matches.map(m => `(${m[0]}, ${m[1]})`).join(", ") || "üres lista")});
  return st;
}
function load(){
  const v = document.getElementById("inp").value.trim().toLowerCase(), e = document.getElementById("err");
  if (!/^[a-z]{1,16}$/.test(v)) { e.textContent = "1–16 kisbetű (a–z) adható meg."; return; }
  e.textContent = ""; setSteps(search(v));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
