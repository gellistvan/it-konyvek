<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A számláló rendezés fázisai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb (0–9): <input id="inp" value="2, 5, 3, 0, 2, 3, 0, 3" size="24" aria-label="Saját tömb"></label><label><input id="fwd" type="checkbox" onchange="load()"> előrefelé haladás (j = 1..n, hibás)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az A, C és B tömb lépésenként: a számlálás és a prefixösszeg után a C-mutatók szerint hátulról előre kerülnek az elemek a B-be; az azonos kulcsok sorrendje megmarad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A és B 1-alapú, C 0-alapú (15.1.3). Kezdőállapot: A = [2, 5, 3, 0, 2, 3, 0, 3], k = 5, C csupa 0; 8 számlálás + 5 prefixösszeg + 8 elhelyezés. Saját bemenetnél k = a legnagyobb kulcs. Az „előrefelé” kapcsolóval az azonos kulcsok sorrendje megfordul (15.1.5).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"C": [0, 0, 0, 0, 0, 0], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "kezdet", "j": null, "ci": null, "bp": null, "line": 0, "blocks": null, "msg": "Kezdet: A = [2, 5, 3, 0, 2, 3, 0, 3], k = 5, C[0..5] = [0, 0, 0, 0, 0, 0]"}, {"C": [0, 0, 1, 0, 0, 0], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 1, "ci": 2, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 1: A[1] = 2 → C[2] = 1"}, {"C": [0, 0, 1, 0, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 2, "ci": 5, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 2: A[2] = 5 → C[5] = 1"}, {"C": [0, 0, 1, 1, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 3, "ci": 3, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 3: A[3] = 3 → C[3] = 1"}, {"C": [1, 0, 1, 1, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 4, "ci": 0, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 4: A[4] = 0 → C[0] = 1"}, {"C": [1, 0, 2, 1, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 5, "ci": 2, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 5: A[5] = 2 → C[2] = 2"}, {"C": [1, 0, 2, 2, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 6, "ci": 3, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 6: A[6] = 3 → C[3] = 2"}, {"C": [2, 0, 2, 2, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 7, "ci": 0, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 7: A[7] = 0 → C[0] = 2"}, {"C": [2, 0, 2, 3, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "számlálás", "j": 8, "ci": 3, "bp": null, "line": 2, "blocks": null, "msg": "Számlálás, j = 8: A[8] = 3 → C[3] = 3; C = [2, 0, 2, 3, 0, 1]"}, {"C": [2, 2, 2, 3, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "prefixösszeg", "j": null, "ci": 1, "bp": null, "line": 5, "blocks": null, "msg": "Prefixösszeg, i = 1: C[1] = C[1] + C[0] = 2"}, {"C": [2, 2, 4, 3, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "prefixösszeg", "j": null, "ci": 2, "bp": null, "line": 5, "blocks": null, "msg": "Prefixösszeg, i = 2: C[2] = C[2] + C[1] = 4"}, {"C": [2, 2, 4, 7, 0, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "prefixösszeg", "j": null, "ci": 3, "bp": null, "line": 5, "blocks": null, "msg": "Prefixösszeg, i = 3: C[3] = C[3] + C[2] = 7"}, {"C": [2, 2, 4, 7, 7, 1], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "prefixösszeg", "j": null, "ci": 4, "bp": null, "line": 5, "blocks": null, "msg": "Prefixösszeg, i = 4: C[4] = C[4] + C[3] = 7"}, {"C": [2, 2, 4, 7, 7, 8], "B": [null, null, null, null, null, null, null, null], "order": [null, null, null, null, null, null, null, null], "phase": "prefixösszeg", "j": null, "ci": 5, "bp": null, "line": 5, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Prefixösszeg, i = 5: C[5] = C[5] + C[4] = 8; C = [2, 2, 4, 7, 7, 8]"}, {"C": [2, 2, 4, 6, 7, 8], "B": [null, null, null, null, null, null, "3⁸", null], "order": [null, null, null, null, null, null, 1, null], "phase": "elhelyezés", "j": 8, "ci": 3, "bp": 7, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 8: A[8] = 3⁸, C[3] = 7 → B[7] = 3⁸, majd C[3] = 6"}, {"C": [1, 2, 4, 6, 7, 8], "B": [null, "0⁷", null, null, null, null, "3⁸", null], "order": [null, 2, null, null, null, null, 1, null], "phase": "elhelyezés", "j": 7, "ci": 0, "bp": 2, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 7: A[7] = 0⁷, C[0] = 2 → B[2] = 0⁷, majd C[0] = 1"}, {"C": [1, 2, 4, 5, 7, 8], "B": [null, "0⁷", null, null, null, "3⁶", "3⁸", null], "order": [null, 2, null, null, null, 3, 1, null], "phase": "elhelyezés", "j": 6, "ci": 3, "bp": 6, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 6: A[6] = 3⁶, C[3] = 6 → B[6] = 3⁶, majd C[3] = 5"}, {"C": [1, 2, 3, 5, 7, 8], "B": [null, "0⁷", null, "2⁵", null, "3⁶", "3⁸", null], "order": [null, 2, null, 4, null, 3, 1, null], "phase": "elhelyezés", "j": 5, "ci": 2, "bp": 4, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 5: A[5] = 2⁵, C[2] = 4 → B[4] = 2⁵, majd C[2] = 3"}, {"C": [0, 2, 3, 5, 7, 8], "B": ["0⁴", "0⁷", null, "2⁵", null, "3⁶", "3⁸", null], "order": [5, 2, null, 4, null, 3, 1, null], "phase": "elhelyezés", "j": 4, "ci": 0, "bp": 1, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 4: A[4] = 0⁴, C[0] = 1 → B[1] = 0⁴, majd C[0] = 0"}, {"C": [0, 2, 3, 4, 7, 8], "B": ["0⁴", "0⁷", null, "2⁵", "3³", "3⁶", "3⁸", null], "order": [5, 2, null, 4, 6, 3, 1, null], "phase": "elhelyezés", "j": 3, "ci": 3, "bp": 5, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 3: A[3] = 3³, C[3] = 5 → B[5] = 3³, majd C[3] = 4"}, {"C": [0, 2, 3, 4, 7, 7], "B": ["0⁴", "0⁷", null, "2⁵", "3³", "3⁶", "3⁸", "5²"], "order": [5, 2, null, 4, 6, 3, 1, 7], "phase": "elhelyezés", "j": 2, "ci": 5, "bp": 8, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 2: A[2] = 5², C[5] = 8 → B[8] = 5², majd C[5] = 7"}, {"C": [0, 2, 2, 4, 7, 7], "B": ["0⁴", "0⁷", "2¹", "2⁵", "3³", "3⁶", "3⁸", "5²"], "order": [5, 2, 8, 4, 6, 3, 1, 7], "phase": "elhelyezés", "j": 1, "ci": 2, "bp": 3, "line": 9, "blocks": [[1, 2], [3, 2], [3, 4], [5, 7], [8, 7], [8, 8]], "msg": "Elhelyezés, j = 1: A[1] = 2¹, C[2] = 3 → B[3] = 2¹, majd C[2] = 2; B = [0⁴, 0⁷, 2¹, 2⁵, 3³, 3⁶, 3⁸, 5²] – stabil: az azonos kulcsok eredeti sorrendben"}];
const CODE = ["1  C[0..k] = új tömb, csupa 0", "2  for j = 1 to A.hossz", "3      C[A[j]] = C[A[j]] + 1", "4  // C[i] = az i kulcs darabszáma", "5  for i = 1 to k", "6      C[i] = C[i] + C[i-1]", "7  // C[i] = a ≤ i kulcsok száma", "8  //      = az i blokk utolsó helye", "9  for j = A.hossz downto 1", "10     B[C[A[j]]] = A[j]", "11     C[A[j]] = C[A[j]] - 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR_A = [2, 5, 3, 0, 2, 3, 0, 3];
function render(s){
  const a = CUR_A, n = a.length, k = s.C.length - 1;
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const w = Math.min(42, 470 / n), xa = 70;
  const row = (y, vals, base, hi, dash, lab, sub) => {
    vals.forEach((v, q) => {
      const idx = q + base;
      el("rect", {x: xa + q*w, y, width: w, height: w, fill: hi === idx ? css("--cellhl") : css("--cell"), stroke: css("--line"),
                  "stroke-width": hi === idx ? 3 : 1.2, "stroke-dasharray": dash === idx ? "6 3" : "none"});
      if (v !== null) el("text", {x: xa + (q+0.5)*w, y: y + w/2 + 6, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, String(v));
      el("text", {x: xa + (q+0.5)*w, y: y + w + 13, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(idx));
      if (sub && sub[q]) el("text", {x: xa + (q+1)*w - 3, y: y + 11, "text-anchor": "end", "font-size": 10, fill: css("--hl2")}, String(sub[q]));
    });
    el("text", {x: xa - 12, y: y + w/2 + 6, "text-anchor": "end", "font-size": 16, "font-weight": "bold"}, lab);
  };
  const SUPD = "⁰¹²³⁴⁵⁶⁷⁸⁹", sup = m => String(m).split("").map(c => SUPD[+c]).join("");
  row(44, a.map((v, q) => v + sup(q + 1)), 1, s.j, null, "A");
  row(124, s.C, 0, s.phase === "elhelyezés" ? null : s.ci, s.phase === "elhelyezés" ? s.ci : null, "C");
  row(204, s.B, 1, s.bp, null, "B", s.order);
  if (s.blocks) s.blocks.forEach(([lo, hi], v) => { if (lo <= hi && hi < n)
    el("line", {x1: xa + hi*w, y1: 198, x2: xa + hi*w, y2: 210 + w, stroke: css("--line"), "stroke-width": 3}); });
  if (s.bp) {
    el("line", {x1: xa + (s.j-0.5)*w, y1: 44 + w + 16, x2: xa + (s.bp-0.5)*w, y2: 202, stroke: css("--hl"), "stroke-width": 2.5, "marker-end": "url(#ah)"});
  }
  svg.insertAdjacentHTML("afterbegin", '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="' + css("--hl") + '"/></marker></defs>');
  el("text", {x: 280, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"},
     `fázis: ${s.phase}` + (s.j ? ` · j = ${s.j} · A[j] = ${a[s.j-1]}` : "") + (s.ci !== null && s.ci !== undefined ? ` · C[${s.ci}] = ${s.C[s.ci]}` : ""));
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")},
     "felső index = A-beli hely · narancs szám = érkezési sorszám · vastag vonal = kulcsblokk határa");
}
function arr(a){ return "[" + a.map(x => x === null ? "_" : String(x)).join(", ") + "]"; }
function counting(a, k, forward){
  const SUPD = "⁰¹²³⁴⁵⁶⁷⁸⁹", sup = m => String(m).split("").map(c => SUPD[+c]).join("");
  const lab = j => `${a[j-1]}${sup(j)}`;
  const n = a.length, C = new Array(k + 1).fill(0), B = new Array(n).fill(null), order = new Array(n).fill(null);
  const out = [{C: C.slice(), B: B.slice(), order: order.slice(), phase: "kezdet", j: null, ci: null, bp: null, line: 0, blocks: null,
                msg: `Kezdet: A = ${arr(a)}, k = ${k}, C[0..${k}] = ${arr(C)}`}];
  for (let j = 1; j <= n; j++) {
    C[a[j-1]]++;
    out.push({C: C.slice(), B: B.slice(), order: order.slice(), phase: "számlálás", j, ci: a[j-1], bp: null, line: 2, blocks: null,
              msg: `Számlálás, j = ${j}: A[${j}] = ${a[j-1]} → C[${a[j-1]}] = ${C[a[j-1]]}`});
  }
  out[out.length-1].msg += `; C = ${arr(C)}`;
  for (let i = 1; i <= k; i++) {
    C[i] += C[i-1];
    out.push({C: C.slice(), B: B.slice(), order: order.slice(), phase: "prefixösszeg", j: null, ci: i, bp: null, line: 5, blocks: null,
              msg: `Prefixösszeg, i = ${i}: C[${i}] = C[${i}] + C[${i-1}] = ${C[i]}`});
  }
  const blocks = []; for (let v = 0; v <= k; v++) blocks.push([v ? C[v-1] + 1 : 1, C[v]]);
  out[out.length-1].msg += `; C = ${arr(C)}`;
  out[out.length-1].blocks = blocks;
  let cnt = 0;
  for (let t = 1; t <= n; t++) {
    const j = forward ? t : n + 1 - t, v = a[j-1], pos = C[v];
    B[pos-1] = lab(j); cnt++; order[pos-1] = cnt; C[v]--;
    out.push({C: C.slice(), B: B.slice(), order: order.slice(), phase: "elhelyezés", j, ci: v, bp: pos, line: 9, blocks,
              msg: `Elhelyezés, j = ${j}: A[${j}] = ${lab(j)}, C[${v}] = ${pos} → B[${pos}] = ${lab(j)}, majd C[${v}] = ${C[v]}`});
  }
  out[out.length-1].msg += `; B = ${arr(B)}` + (forward ? " – az azonos kulcsok sorrendje megfordult (instabil)" : " – stabil: az azonos kulcsok eredeti sorrendben");
  return out;
}
function load(){
  const e = document.getElementById("err");
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (raw.length < 1 || raw.length > 12 || raw.some(x => !Number.isInteger(x) || x < 0 || x > 9)) { e.textContent = "1–12 darab 0 és 9 közötti egész számot adjon meg."; return; }
  e.textContent = ""; CUR_A = raw;
  setSteps(counting(raw, Math.max(...raw), document.getElementById("fwd").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
