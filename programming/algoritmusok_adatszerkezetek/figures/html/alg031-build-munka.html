<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bottom-up építés munkája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th{background:var(--code)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <label for="n">n =</label>
  <input id="n" type="range" min="1" max="1023" value="15" aria-label="Kupacméret n">
  <input id="nv" type="number" min="1" max="1023" value="15" style="width:5em" aria-label="n értéke">
  <label><input id="nai" type="checkbox" checked> naiv becslés</label>
  <button onclick="setN(15)">n = 15</button><button onclick="setN(1023)">n = 1023</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 280" role="img" aria-label="Oszlopdiagram: csúcsok száma és munka magasságonként, összesítő oszlop a naiv becsléssel és a 2n korláttal."></svg>
<table aria-label="Magasságonkénti adatok"><thead><tr><th>h</th><th>csúcsok</th><th>⌈n/2<sup>h+1</sup>⌉</th><th>munka</th></tr></thead><tbody id="tb"></tbody></table>
<p class="small">Számlálás, nem mérés: az i csúcs magassága ⌊log₂(n/i)⌋, a SIFT-DOWN legrosszabb esetben ennyi cserét végez.
Üres oszlop = csúcsok száma, vonalkázott = munka; az összesítőnél szaggatott = naiv becslés ⌊n/2⌋·⌊log₂ n⌋, pontozott = 2n.
Kezdőállapot: a könyv n = 15 példája.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function prof(n){
  let H = 0; while (2 ** (H + 1) <= n) H++; const cnt = new Array(H + 1).fill(0);
  for (let i = 1; i <= n; i++) { let h = 0; while (i * 2 ** (h + 1) <= n) h++; cnt[h]++; }
  const bound = cnt.map((_, h) => Math.ceil(n / 2 ** (h + 1)));
  const work = cnt.map((c, h) => c * h);
  return {H, cnt, bound, work, W: work.reduce((a, b) => a + b, 0), naive: Math.floor(n / 2) * H};
}
function draw(){
  const n = +document.getElementById("n").value, p = prof(n), showN = document.getElementById("nai").checked;
  document.getElementById("nv").value = n;
  document.getElementById("status").textContent =
    `n = ${n}: összes munka (legrosszabb eset) = ${p.W} ≤ 2n = ${2*n}` + (showN ? `; naiv becslés ⌊n/2⌋ · ⌊log₂ n⌋ = ${p.naive}` : "")
    + ` · arány munka/n = ${(p.W / n).toFixed(2).replace(".", ",")}`;
  svg.innerHTML = `<defs><pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1.3"/></pattern></defs>`;
  const x0 = 50, y0 = 240, top = 20, groups = p.H + 2, gw = Math.min(100, 560 / groups);
  const vmax = Math.max(2 * n, ...p.cnt, ...p.work, showN ? p.naive : 0);
  const Y = v => y0 - (y0 - top) * v / vmax;
  el("line", {x1: x0, y1: y0, x2: x0 + gw * groups, y2: y0, stroke: css("--line")});
  el("line", {x1: x0, y1: y0, x2: x0, y2: top, stroke: css("--line")});
  const raw = vmax / 4, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 5, 10].map(m => m * mag).find(s => s >= raw);
  for (let v = 0; v <= vmax; v += step) {
    el("line", {x1: x0 - 4, y1: Y(v), x2: x0, y2: Y(v), stroke: css("--line")});
    el("text", {x: x0 - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); }
  const bw = gw * 0.36;
  for (let h = 0; h <= p.H; h++) {
    const gx = x0 + h * gw + gw / 2;
    el("rect", {x: gx - bw, y: Y(p.cnt[h]), width: bw, height: y0 - Y(p.cnt[h]), fill: css("--cell"), stroke: css("--line")});
    el("rect", {x: gx, y: Y(p.work[h]), width: bw, height: y0 - Y(p.work[h]), fill: "url(#hp)", stroke: css("--line")});
    if (p.H <= 6) { el("text", {x: gx - bw/2, y: Y(p.cnt[h]) - 3, "text-anchor": "middle", "font-size": 10}, String(p.cnt[h]));
                    el("text", {x: gx + bw/2, y: Y(p.work[h]) - 3, "text-anchor": "middle", "font-size": 10}, String(p.work[h])); }
    el("text", {x: gx, y: y0 + 15, "text-anchor": "middle", "font-size": 11}, "h=" + h);
  }
  const sx = x0 + (p.H + 1) * gw + gw / 2;
  el("rect", {x: sx - bw/2, y: Y(p.W), width: bw, height: y0 - Y(p.W), fill: "url(#hp)", stroke: css("--line"), "stroke-width": 1.6});
  el("text", {x: sx, y: Y(p.W) - 3, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "Σ " + p.W);
  el("text", {x: sx, y: y0 + 15, "text-anchor": "middle", "font-size": 11}, "összes");
  el("line", {x1: sx - gw/2, y1: Y(2*n), x2: sx + gw/2, y2: Y(2*n), stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "2 3"});
  el("text", {x: sx - gw/2 - 4, y: Y(2*n) + 4, "text-anchor": "end", "font-size": 11}, "2n = " + 2*n);
  if (showN) { el("line", {x1: sx - gw/2, y1: Y(p.naive), x2: sx + gw/2, y2: Y(p.naive), stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "7 4"});
               el("text", {x: sx - gw/2 - 4, y: Y(p.naive) + 4, "text-anchor": "end", "font-size": 11, fill: css("--hl2")}, "naiv " + p.naive); }
  el("text", {x: x0 + 6, y: 270, "font-size": 11, fill: css("--muted")}, "üres = csúcsok száma · vonalkázott = munka (csúcsszám · h)");
  document.getElementById("tb").innerHTML = p.cnt.map((c, h) => `<tr><td>${h}</td><td>${c}</td><td>${p.bound[h]}</td><td>${p.work[h]}</td></tr>`).join("")
    + `<tr><th>Σ</th><th>${n}</th><th></th><th>${p.W}</th></tr>`;
}
function setN(v){ v = Math.max(1, Math.min(1023, Math.round(+v) || 1)); document.getElementById("n").value = v; draw(); }
document.getElementById("n").addEventListener("input", draw);
document.getElementById("nv").addEventListener("change", e => setN(e.target.value));
document.getElementById("nai").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
