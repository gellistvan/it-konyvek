<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fenwick-fa blokkjai és bejárásai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Mód: <select id="mode" aria-label="Művelet"><option value="p">prefixSum(i)</option><option value="u">pointAdd(i, delta)</option></select></label><label>i = <input id="idx" type="range" min="1" max="8" value="6" aria-label="Index" oninput="document.getElementById('idxv').textContent=this.value"> <b id="idxv">6</b></label><label>delta: <input id="dl" value="5" size="4" aria-label="Delta"></label><button onclick="run()">Futtatás</button><button onclick="reset()">Alaphelyzet</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc elemű tömb fölött, alatta a tree[i] blokkok sávjai lowbit szerinti szinteken; a prefixSum(6) a 6-os és 4-es blokkot, a pointAdd(3, 5) a 3, 4, 8 blokkot érinti."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelve, n = 8. Kezdőállapot: a könyv prefixSum(6), majd pointAdd(3, 5) trace-e (a = [2, 1, 1, 3, 2, 3, 4, 5]). A pointAdd futtatása módosítja az aktuális tömböt; az Alaphelyzet visszaállítja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "p", "tree": [2, 3, 1, 7, 2, 5, 4, 21], "cur": 6, "path": [6], "sum": 5, "line": 4, "msg": "i = 6; lowbit(6) = 2; sum += tree[6] ⇒ sum = 5; i = 6 − 2 = 4", "a": [2, 1, 1, 3, 2, 3, 4, 5]}, {"mode": "p", "tree": [2, 3, 1, 7, 2, 5, 4, 21], "cur": 4, "path": [6, 4], "sum": 12, "line": 4, "msg": "i = 4; lowbit(4) = 4; sum += tree[4] ⇒ sum = 12; i = 4 − 4 = 0", "a": [2, 1, 1, 3, 2, 3, 4, 5]}, {"mode": "p", "tree": [2, 3, 1, 7, 2, 5, 4, 21], "cur": null, "path": [6, 4], "sum": 12, "line": 5, "msg": "i = 0; ciklus vége; prefixSum(6) = 12", "a": [2, 1, 1, 3, 2, 3, 4, 5]}, {"mode": "u", "tree": [2, 3, 6, 7, 2, 5, 4, 21], "cur": 3, "path": [3], "line": 10, "msg": "pointAdd(3, 5): i = 3; tree[3] += 5 ⇒ tree[3] = 6; i = 3 + lowbit(3) = 3 + 1 = 4", "a": [2, 1, 6, 3, 2, 3, 4, 5]}, {"mode": "u", "tree": [2, 3, 6, 12, 2, 5, 4, 21], "cur": 4, "path": [3, 4], "line": 10, "msg": "i = 4; tree[4] += 5 ⇒ tree[4] = 12; i = 4 + lowbit(4) = 4 + 4 = 8", "a": [2, 1, 6, 3, 2, 3, 4, 5]}, {"mode": "u", "tree": [2, 3, 6, 12, 2, 5, 4, 26], "cur": 8, "path": [3, 4, 8], "line": 10, "msg": "i = 8; tree[8] += 5 ⇒ tree[8] = 26; i = 8 + lowbit(8) = 8 + 8 = 16 > 8, ciklus vége", "a": [2, 1, 6, 3, 2, 3, 4, 5]}, {"mode": "u", "tree": [2, 3, 6, 12, 2, 5, 4, 26], "cur": null, "path": [3, 4, 8], "line": 8, "msg": "i = 16 > 8, ciklus vége; tree = [2, 3, 6, 12, 2, 5, 4, 26]", "a": [2, 1, 6, 3, 2, 3, 4, 5]}];
const CODE = ["function prefixSum(i):", "    sum = 0", "    while i > 0:", "        sum = sum + tree[i]", "        i = i - lowbit(i)", "    return sum", " ", "function pointAdd(i, delta):", "    while i <= n:", "        tree[i] = tree[i] + delta", "        i = i + lowbit(i)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LEVJ = {1:0, 2:1, 4:2, 8:3, 16:4};
function lb(i){ return i & (-i); }
function render(s){
  const n = s.tree.length, W = Math.min(50, 400 / n), x0 = 70, top = 10;
  const nl = Math.floor(Math.log2(n)) + 1;
  svg.setAttribute("viewBox", `0 0 560 ${80 + nl * 52 + 20}`);
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="2"/></pattern>'
    + '<pattern id="hu" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="' + css("--muted") + '"/></pattern></defs>';
  const a = s.a || CURA;
  a.forEach((v, j) => {
    el("rect", {x: x0 + j*W, y: top + 16, width: W, height: 28, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: x0 + j*W + W/2, y: top + 35, "text-anchor": "middle", "font-size": 14}, String(v).replace("-", "−"));
    el("text", {x: x0 + j*W + W/2, y: top + 11, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(j + 1));
  });
  el("text", {x: x0 - 8, y: top + 35, "text-anchor": "end", "font-size": 13, "font-style": "italic"}, "a");
  for (let i = 1; i <= n; i++) {
    const L = lb(i), lev = Math.round(Math.log2(L)), y = 70 + lev * 52;
    const on = s.path.includes(i), cur = s.cur === i;
    el("rect", {x: x0 + (i - L) * W + 2, y, width: L * W - 4, height: 30, fill: on ? css("--cellhl") : css("--cell"),
                stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : (on ? 2.5 : 1)});
    if (on) el("rect", {x: x0 + (i - L) * W + 2, y, width: L * W - 4, height: 30, fill: s.mode === "p" ? "url(#hp)" : "url(#hu)", stroke: "none"});
    const t = el("text", {x: x0 + (i - L/2) * W, y: y + 19, "text-anchor": "middle", "font-size": L > 1 ? 13 : 10.5, "font-weight": on ? "bold" : "normal"},
       L > 1 ? `tree[${i}] = ${s.tree[i-1]}` : `${s.tree[i-1]}`);
    el("text", {x: x0 + (i - L/2) * W, y: y + 42, "text-anchor": "middle", "font-size": 10, fill: css("--muted")},
       L > 1 ? i.toString(2) : `t[${i}]`);
  }
  for (let lv = 0; lv < nl; lv++) el("text", {x: x0 - 8, y: 90 + lv * 52, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "lowbit " + (1 << lv));
  if (s.mode === "p" && s.sum !== undefined) el("text", {x: 556, y: top + 35, "text-anchor": "end", "font-size": 14, "font-weight": "bold"}, "sum = " + s.sum);
}
const A0 = [2, 1, 1, 3, 2, 3, 4, 5];
let CURA = A0.slice();
function build(a){ const n = a.length, t = new Array(n + 1).fill(0);
  for (let i = 1; i <= n; i++) for (let j = i - lb(i) + 1; j <= i; j++) t[i] += a[j-1]; return t; }
function prefixSteps(a, i0){
  const t = build(a), st = []; let s = 0, i = i0; const path = [];
  while (i > 0) { const L = lb(i); s += t[i]; path.push(i); const j = i - L;
    st.push({mode: "p", a, tree: t.slice(1), cur: i, path: path.slice(), sum: s, line: 4,
      msg: `i = ${i}; lowbit(${i}) = ${L}; sum += tree[${i}] ⇒ sum = ${s}; i = ${i} − ${L} = ${j}`}); i = j; }
  st.push({mode: "p", a, tree: t.slice(1), cur: null, path: path.slice(), sum: s, line: 5, msg: `i = 0; ciklus vége; prefixSum(${i0}) = ${s}`});
  return st;
}
function addSteps(a, i0, d){
  const t = build(a), n = a.length, st = [], path = []; let i = i0;
  const a2 = a.slice(); a2[i0-1] += d;
  while (i <= n) { const L = lb(i); t[i] += d; path.push(i); const j = i + L;
    st.push({mode: "u", a: a2, tree: t.slice(1), cur: i, path: path.slice(), line: 10,
      msg: `i = ${i}; tree[${i}] += ${d} ⇒ tree[${i}] = ${t[i]}; i = ${i} + lowbit(${i}) = ${i} + ${L} = ${j}` + (j > n ? ` > ${n}, ciklus vége` : "")}); i = j; }
  st.push({mode: "u", a: a2, tree: t.slice(1), cur: null, path: path.slice(), line: 8, msg: `i = ${i} > ${n}, ciklus vége; tree = [${t.slice(1).join(", ")}]`});
  return [st, a2];
}
function run(){
  const m = document.getElementById("mode").value, i = +document.getElementById("idx").value;
  const d = parseInt(document.getElementById("dl").value, 10);
  document.getElementById("idxv").textContent = i;
  if (m === "p") setSteps(prefixSteps(CURA, i));
  else { if (isNaN(d)) { document.getElementById("err").textContent = "A delta egész szám legyen."; return; }
         document.getElementById("err").textContent = "";
         const r = addSteps(CURA, i, d); setSteps(r[0]); CURA = r[1]; }
}
function reset(){ CURA = A0.slice(); document.getElementById("mode").value = "p"; document.getElementById("idx").value = 6; run(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
