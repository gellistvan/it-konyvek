<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bináris keresés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A = <input id="arr" value="3, 7, 11, 18, 25, 42" size="22" aria-label="Tömb"></label><label>keresett: <input id="x" value="18" size="4" aria-label="Keresett érték"></label><button onclick="load()">Futtatás</button><button onclick="document.getElementById('x').value=20;document.getElementById('arr').value='3, 7, 11, 18, 25, 42';load()">Példa: 20</button><button onclick="document.getElementById('arr').value='5, 2, 9';document.getElementById('x').value=5;load()">Rendezetlen: [5, 2, 9], 5</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat cellás rendezett tömb; lépésenként a kizárt tartomány sraffozott, az also és felso mutató közeledik, a kozep cella vastag keretes."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt, kozep = also + (felso − also) div 2. Kezdőállapot: a 3.4. példa, a 18 keresése; a „Példa: 20” a második táblázatot játssza le.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"lo": 1, "hi": 6, "mid": null, "line": 2, "res": null, "msg": "also = 1, felso = 6; invariáns: ha 18 szerepel, akkor A[1..6]-ban van", "a": [3, 7, 11, 18, 25, 42]}, {"lo": 1, "hi": 6, "mid": 3, "line": 8, "res": null, "msg": "also = 1, felso = 6, kozep = 3, A[kozep] = 11 < 18, also ← 4; invariáns: ha 18 szerepel, akkor A[4..6]-ban van", "a": [3, 7, 11, 18, 25, 42]}, {"lo": 4, "hi": 6, "mid": 5, "line": 10, "res": null, "msg": "also = 4, felso = 6, kozep = 5, A[kozep] = 25 > 18, felso ← 4; invariáns: ha 18 szerepel, akkor A[4..4]-ban van", "a": [3, 7, 11, 18, 25, 42]}, {"lo": 4, "hi": 4, "mid": 4, "line": 6, "res": 4, "msg": "also = 4, felso = 4, kozep = 4, A[kozep] = 18 = 18 → egyenlő, visszaadja 4", "a": [3, 7, 11, 18, 25, 42]}];
const CODE = ["BinarisKeresesIterativ(A, n, keresett)", "1   also ← 1", "2   felso ← n", "3   amíg also ≤ felso végezd el", "4       kozep ← also + (felso − also) div 2", "5       ha A[kozep] = keresett akkor", "6           add vissza kozep", "7       különben ha A[kozep] < keresett akkor", "8           also ← kozep + 1", "9       különben", "10          felso ← kozep − 1", "13  add vissza NINCS"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CURA = [3, 7, 11, 18, 25, 42];
function render(s){
  const a = s.a || CURA, n = a.length, W = Math.min(64, 520 / n), x0 = (560 - n * W) / 2, y0 = 110;
  svg.setAttribute("viewBox", "0 0 560 260");
  svg.innerHTML = '<defs><pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.6"/></pattern></defs>';
  a.forEach((v, j) => { const i = j + 1, out = !(s.lo <= i && i <= s.hi), mid = i === s.mid;
    el("rect", {x: x0 + j * W, y: y0, width: W, height: W, fill: out ? css("--cellhl") : css("--cell"), stroke: mid ? css("--hl") : css("--line"), "stroke-width": mid ? 4 : 1.2});
    if (out) el("rect", {x: x0 + j * W, y: y0, width: W, height: W, fill: "url(#hx)", stroke: "none"});
    el("text", {x: x0 + j * W + W / 2, y: y0 + W / 2 + 6, "text-anchor": "middle", "font-size": 18, "font-weight": mid ? "bold" : "normal"}, String(v).replace("-", "−"));
    el("text", {x: x0 + j * W + W / 2, y: y0 - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i)); });
  const cx = i => x0 + (i - 1) * W + W / 2;
  if (s.lo >= 1 && s.lo <= n) { el("path", {d: `M${cx(s.lo) - 9},${y0 + W + 22} L${cx(s.lo) + 9},${y0 + W + 22} L${cx(s.lo)},${y0 + W + 6} z`, fill: css("--fg")});
    el("text", {x: cx(s.lo), y: y0 + W + 38, "text-anchor": "middle", "font-size": 13}, "also = " + s.lo); }
  else el("text", {x: 280, y: y0 + W + 38, "text-anchor": "middle", "font-size": 13}, `also = ${s.lo}`);
  if (s.hi >= 1 && s.hi <= n) { el("path", {d: `M${cx(s.hi) - 9},${y0 - 40} L${cx(s.hi) + 9},${y0 - 40} L${cx(s.hi)},${y0 - 24} z`, fill: css("--fg")});
    el("text", {x: cx(s.hi), y: y0 - 46, "text-anchor": "middle", "font-size": 13}, "felso = " + s.hi); }
  else el("text", {x: 280, y: y0 - 46, "text-anchor": "middle", "font-size": 13}, `felso = ${s.hi}`);
  if (s.res !== null && s.res !== undefined) el("text", {x: 280, y: 248, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, s.res === "NINCS" ? "eredmény: NINCS" : "eredmény: index " + s.res);
}
function trace(a, x){
  let lo = 1, hi = a.length; const inv = (lo, hi) => `invariáns: ha ${x} szerepel, akkor A[${lo}..${hi}]-ban van`;
  const st = [{a, lo, hi, mid: null, line: 2, res: null, msg: `also = 1, felso = ${hi}; ` + inv(lo, hi)}];
  while (lo <= hi) { const mid = lo + Math.floor((hi - lo) / 2), v = a[mid - 1];
    if (v === x) { st.push({a, lo, hi, mid, line: 6, res: mid, msg: `also = ${lo}, felso = ${hi}, kozep = ${mid}, A[kozep] = ${v} = ${x} → egyenlő, visszaadja ${mid}`}); return st; }
    let nlo = lo, nhi = hi, dec, line; if (v < x) { nlo = mid + 1; dec = `${v} < ${x}, also ← ${mid + 1}`; line = 8; } else { nhi = mid - 1; dec = `${v} > ${x}, felso ← ${mid - 1}`; line = 10; }
    st.push({a, lo, hi, mid, line, res: null, msg: `also = ${lo}, felso = ${hi}, kozep = ${mid}, A[kozep] = ${dec}; ` + (nlo <= nhi ? inv(nlo, nhi) : "az intervallum üres")});
    lo = nlo; hi = nhi; }
  st.push({a, lo, hi, mid: null, line: 11, res: "NINCS", msg: `also = ${lo} > felso = ${hi}: az intervallum üres → NINCS`});
  return st;
}
function load(force){
  const e = document.getElementById("err"), a = document.getElementById("arr").value.split(/[ ,;]+/).filter(t => t !== "").map(Number), x = Number(document.getElementById("x").value);
  if (a.length < 1 || a.length > 12 || a.some(v => !Number.isFinite(v)) || !Number.isFinite(x)) { e.textContent = "1–12 számot és egy keresett értéket adjon meg."; return; }
  const sorted = a.every((v, i) => i === 0 || a[i - 1] <= v);
  e.textContent = sorted ? "" : "Figyelem: a tömb nem rendezett, a bináris keresés eredménye hibás lehet (lásd: [5, 2, 9], keresett 5 → NINCS, holott A[1] = 5).";
  CURA = a; setSteps(trace(a, x));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
