<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felező sávok és a 2n korlát</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:1.6em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl"><button id="prev">◀ Sáv</button><button id="next">Új sáv ▶</button><button id="reset">⏮ Újra</button>
<label>n = <select id="n"><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 170" role="img" aria-label="Egy 2n hosszú téglalap, amelyet a felező sávok egyre jobban kitöltenek"></svg>
<p class="small">q = 1/2; a munka az aktuális mérettel arányos (minden sáv egy szint munkája). Kezdőállapot: n = 16,
minden sáv látszik (16 + 8 + 4 + 2 + 1 = 31 &lt; 32), mint a könyv ábráján; az „Újra” gombbal sávonként építhető fel.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

let n = 16, k = 5;
function bands(){ const b = []; let x = 0, w = n; while (w >= 1) { b.push([x, w]); x += w; w = Math.floor(w / 2); } return b; }
function draw(){
  const B = bands(); k = Math.max(0, Math.min(B.length, k));
  svg.innerHTML = "";
  const sc = 600 / (2 * n), x0 = 20, y0 = 50, h = 60;
  el("rect", {x: x0, y: y0, width: 2 * n * sc, height: h, fill: "none", stroke: css("--line"), "stroke-width": 2});
  let sum = 0;
  B.slice(0, k).forEach(([x, w], i) => { sum += w;
    el("rect", {x: x0 + x * sc, y: y0, width: w * sc, height: h, fill: i % 2 ? css("--cellhl") : css("--muted"), "fill-opacity": i % 2 ? 1 : 0.45, stroke: css("--line")});
    if (w * sc > 18) el("text", {x: x0 + (x + w / 2) * sc, y: y0 + h / 2 + 5, "text-anchor": "middle", "font-size": 13}, String(w)); });
  el("text", {x: x0, y: 30, "font-size": 15, "font-weight": "bold"}, k ? B.slice(0, k).map(b => b[1]).join(" + ") + " = " + sum + " < " + 2 * n : "üres");
  el("text", {x: x0 + n * sc, y: y0 + h + 30, "text-anchor": "middle", "font-size": 14}, "2n = " + 2 * n);
  document.getElementById("status").textContent = `${k} sáv: részösszeg ${sum}, a 2n = ${2 * n} határig hiányzik ${2 * n - sum}.`;
}
document.getElementById("next").onclick = () => { k++; draw(); };
document.getElementById("prev").onclick = () => { k--; draw(); };
document.getElementById("reset").onclick = () => { k = 0; draw(); };
document.getElementById("n").onchange = e => { n = +e.target.value; k = 0; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
