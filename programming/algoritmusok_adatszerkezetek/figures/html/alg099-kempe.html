<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kempe-láncok az ötszín-tételben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Eset: <select id="case" onchange="load()" aria-label="Eset"><option value="2">2. eset (v1, v3 egy komponensben)</option><option value="1">1. eset (külön komponens)</option></select></label><label>Csere: <select id="var" onchange="load()" aria-label="Csere helye"><option value="v2">v2 komponensében (2 szabadul)</option><option value="v4">v4 komponensében (4 szabadul)</option></select></label><label>színpár <select id="c1" aria-label="Első szín"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select><select id="c2" aria-label="Második szín"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option></select></label><button onclick="doSwap()">csere</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az ötszín-tétel nehéz esete: v körül öt különböző színű szomszéd; az 1–3 váltakozó út v1-ből v3-ba zárt görbét alkot, amely elválasztja v2-t és v4-et; a v2 komponensében végzett 2–4 csere után a 2-es szín szabad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 26.2.5 bizonyításának két esete egy-egy kis síkgráfon. A „v4 komponensében” változat a fejezet szövegének lépését mutatja: ekkor v4 kapja a 2-es színt, és a 4-es szín szabadul fel v számára (nem a 2-es).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const GR = {"g1": {"pos": {"v": [160.0, 200.0], "v1": [160.0, 104.0], "v2": [251.3, 170.3], "v3": [216.4, 277.7], "v4": [103.6, 277.7], "v5": [68.7, 170.3], "x": [94.0, 38.0], "y": [4.0, 80.0]}, "edges": [["v", "v1"], ["v", "v2"], ["v", "v3"], ["v", "v4"], ["v", "v5"], ["v1", "v2"], ["v2", "v3"], ["v3", "v4"], ["v4", "v5"], ["v5", "v1"], ["v1", "x"], ["x", "y"]], "col": {"v": 0, "v1": 1, "v2": 2, "v3": 3, "v4": 4, "v5": 5, "x": 3, "y": 1}}, "g2": {"pos": {"v": [160.0, 200.0], "v1": [160.0, 104.0], "v2": [251.3, 170.3], "v3": [216.4, 277.7], "v4": [103.6, 277.7], "v5": [68.7, 170.3], "p": [268.0, 38.0], "q": [358.0, 170.0], "r": [298.0, 125.6]}, "edges": [["v", "v1"], ["v", "v2"], ["v", "v3"], ["v", "v4"], ["v", "v5"], ["v1", "v2"], ["v2", "v3"], ["v3", "v4"], ["v4", "v5"], ["v5", "v1"], ["v1", "p"], ["p", "q"], ["q", "v3"], ["v2", "r"]], "col": {"v": 0, "v1": 1, "v2": 2, "v3": 3, "v4": 4, "v5": 5, "p": 3, "q": 1, "r": 4}}};

const CURVE = ["v", "v1", "p", "q", "v3"];
let G = GR.g2;
function adjOf(g){ const a = {}; for (const v in g.pos) a[v] = []; g.edges.forEach(([u, w]) => { a[u].push(w); a[w].push(u); }); return a; }
function kempe(g, col, s, c1, c2){ const A = adjOf(g), comp = new Set([s]), st = [s]; while (st.length) { const u = st.pop(); for (const w of A[u]) if (!comp.has(w) && (col[w] === c1 || col[w] === c2)) { comp.add(w); st.push(w); } } return comp; }
function swapC(col, comp, c1, c2){ const o = {...col}; comp.forEach(v => o[v] = col[v] === c1 ? c2 : c1); return o; }
const nb = col => [1,2,3,4,5].map(i => col["v" + i]);
function script(){
  const cs = document.getElementById("case").value, varr = document.getElementById("var").value, st = [];
  if (cs === "1") { G = GR.g1; const c0 = {...G.col};
    st.push({col: c0, msg: "v-t elhagytuk; a szomszédai ciklikus sorrendben v1..v5, színük 1, 2, 3, 4, 5 – mind az öt szín foglalt."});
    const k = kempe(G, c0, "v1", 1, 3);
    st.push({col: c0, hl: [...k], msg: `Az 1–3 színű részgráfban v1 komponense {${[...k].join(", ")}}; v3 nincs benne (1. eset).`});
    const c1 = swapC(c0, k, 1, 3);
    st.push({col: c1, hl: [...k], msg: `Csere v1 komponensében (1 ↔ 3): v1 = ${c1.v1}. v szomszédainak színei: ${nb(c1).join(", ")} – az 1-es szín szabad.`});
    st.push({col: {...c1, v: 1}, hl: ["v"], msg: "v megkapja az 1-es színt; a színezés legális marad."});
  } else { G = GR.g2; const c0 = {...G.col};
    st.push({col: c0, msg: "v-t elhagytuk; a szomszédai ciklikus sorrendben v1..v5, színük 1, 2, 3, 4, 5 – mind az öt szín foglalt."});
    const k = kempe(G, c0, "v1", 1, 3);
    st.push({col: c0, hl: [...k], path: true, msg: `Az 1–3 színű részgráfban v1 és v3 egy komponensben van: a váltakozó út v1–p–q–v3 (2. eset).`});
    st.push({col: c0, hl: [...k], path: true, region: true, msg: "Az út a vv1 és vv3 élekkel zárt (Jordan-) görbét alkot: v2 a belsejében, v4 kívül van."});
    if (varr === "v2") { const k2 = kempe(G, c0, "v2", 2, 4);
      st.push({col: c0, hl: [...k2], region: true, msg: `v2 {2,4}-komponense {${[...k2].join(", ")}}: a görbén belül marad (síkgráfban nem keresztezheti), v4-et nem éri el.`});
      const c2 = swapC(c0, k2, 2, 4);
      st.push({col: c2, hl: [...k2], region: true, msg: `Csere v2 komponensében (2 ↔ 4): v2 = ${c2.v2}. v szomszédainak színei: ${nb(c2).join(", ")} – a 2-es szín szabad.`});
      st.push({col: {...c2, v: 2}, hl: ["v"], region: true, msg: "v megkapja a 2-es színt; a színezés legális."});
    } else { const k4 = kempe(G, c0, "v4", 2, 4);
      st.push({col: c0, hl: [...k4], region: true, msg: `v4 {2,4}-komponense {${[...k4].join(", ")}}: a görbén kívül van, v2-t nem éri el.`});
      const c4 = swapC(c0, k4, 2, 4);
      st.push({col: c4, hl: [...k4], region: true, msg: `Csere v4 komponensében (2 ↔ 4): v4 = ${c4.v4}. v szomszédainak színei: ${nb(c4).join(", ")} – most a 4-es szín szabad (nem a 2-es!).`});
      st.push({col: {...c4, v: 4}, hl: ["v"], region: true, msg: "v megkapja a 4-es színt; ez a változat is működik, de a 4-es színt szabadítja fel."}); }
  }
  return st;
}
let PICK = null;
const PAT = () => ({0: css("--cell"), 1: css("--cellhl"), 2: "url(#hp)", 3: "url(#dp)", 4: css("--cell"), 5: css("--cell")});
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 390"); G_defs();
  const P = G.pos, hl = new Set(s.hl || []);
  if (s.region && G === GR.g2) el("polygon", {points: CURVE.map(v => P[v].join(",")).join(" "), fill: css("--cellhl"), stroke: "none", opacity: 0.6});
  const PE = ["v1-p", "p-q", "q-v3"], CE = PE.concat(["v-v1", "v-v3"]);
  const onPath = (u, w) => G === GR.g2 && ((s.path && PE.includes(u + "-" + w)) || (s.region && CE.includes(u + "-" + w)));
  G.edges.forEach(([u, w]) => { const both = hl.has(u) && hl.has(w) && s.col[u] && s.col[w];
    G_edge(P[u], P[w], {r: 19, w: onPath(u, w) ? 4 : both ? 4 : 1.4, color: both ? css("--hl2") : undefined}); });
  for (const v in P) { const c = s.col[v];
    const n = G_node(P[v], c ? String(c) : "?", {r: 19, fill: PAT()[c], pat: c === 2 || c === 3, w: hl.has(v) ? 4 : 1.5, stroke: hl.has(v) ? css("--hl2") : undefined, dash: c === 4 ? "4 2" : c === 5 ? "1 2" : "", bold: true});
    G_text(P[v][0] + (P[v][0] >= 160 ? 22 : -22), P[v][1] - 16, v, {size: 12, anchor: P[v][0] >= 160 ? "start" : "end", halo: true});
    G_click(n, () => { const a = +document.getElementById("c1").value, b = +document.getElementById("c2").value;
      if (!(s.col[v] === a || s.col[v] === b)) { status.textContent = `${v} színe ${s.col[v] || "nincs"}: nem tartozik a {${a},${b}} színpárhoz.`; return; }
      PICK = {v, a, b, comp: [...kempe(G, s.col, v, a, b)]}; status.textContent = `${v} {${a},${b}}-Kempe-lánca: {${PICK.comp.join(", ")}}. A „csere” gomb felcseréli a két színt ebben a komponensben.`;
      const s2 = Object.assign({}, s, {hl: PICK.comp}); render(s2); }, `${v} Kempe-láncának kiemelése`); }
  G_text(450, 30, "színkód", {bold: true});
  [1,2,3,4,5].forEach((c, i) => { el("circle", {cx: 462, cy: 50 + i * 26, r: 10, fill: PAT()[c], stroke: css("--line"), "stroke-dasharray": c === 4 ? "4 2" : c === 5 ? "1 2" : ""}); if (c === 2 || c === 3) el("circle", {cx: 462, cy: 50 + i * 26, r: 5, fill: css("--cell")}); G_text(480, 55 + i * 26, String(c), {size: 12}); });
  G_text(10, 366, "szürke terület = a v–v1–p–q–v3 zárt görbe belseje · narancs = kiemelt Kempe-lánc · a szám a csúcs színe", {size: 10.5, fill: css("--muted")});
  G_text(10, 382, "Szabad játék: válassz színpárt, kattints egy csúcsra (Kempe-lánc), majd „csere”.", {size: 10.5, fill: css("--muted")});
}
function doSwap(){ if (!PICK) { status.textContent = "Előbb kattints egy csúcsra a Kempe-lánc kiemeléséhez."; return; }
  const k = +document.getElementById("pos").value, s = STEPS[k], c = swapC(s.col, new Set(PICK.comp), PICK.a, PICK.b);
  const ok = G.edges.every(([u, w]) => !c[u] || !c[w] || c[u] !== c[w]);
  const ns = {col: c, hl: PICK.comp, region: s.region, msg: `Csere (${PICK.a} ↔ ${PICK.b}) a {${PICK.comp.join(", ")}} komponensben; v szomszédainak színei: ${nb(c).join(", ")}` + (ok ? "; a színezés legális." : "; HIBA: nem legális!")};
  PICK = null; const L = STEPS.slice(0, k + 1).concat([ns]); setSteps(L); show(L.length - 1); }
function load(){ PICK = null; setSteps(script()); }

STEPS = script();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
