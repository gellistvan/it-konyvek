<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LZ77: átfedő egyezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="ov" type="checkbox" checked onchange="load()"> átfedés engedélyezve</label><label>Bemenet: <input id="inp" value="abababab" size="12" aria-label="Saját bemenet"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az abababab bemenet LZ77-kódolása három hármassal, majd a (2, 6, EOF) hármas karakterenkénti dekódolása."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (28.2.3), W_s = W_l = 8, döntetlennél a legkisebb d. Átfedés nélkül: (0,0,'a'), (0,0,'b'), (2,2,'a'), (4,3,EOF).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "enc", "p": 1, "d": 0, "l": 0, "tok": [], "line": 3, "msg": "p = 1: LeghosszabbEgyezes → nincs egyezés (l = 0)"}, {"ph": "enc", "p": 1, "d": 0, "l": 0, "tok": [[0, 0, "a"]], "line": 4, "msg": "kimenet.Hozzaad((0, 0, 'a')); p ← 2"}, {"ph": "enc", "p": 2, "d": 0, "l": 0, "tok": [[0, 0, "a"]], "line": 3, "msg": "p = 2: LeghosszabbEgyezes → nincs egyezés (l = 0)"}, {"ph": "enc", "p": 2, "d": 0, "l": 0, "tok": [[0, 0, "a"], [0, 0, "b"]], "line": 4, "msg": "kimenet.Hozzaad((0, 0, 'b')); p ← 3"}, {"ph": "enc", "p": 3, "d": 2, "l": 6, "tok": [[0, 0, "a"], [0, 0, "b"]], "line": 3, "msg": "p = 3: LeghosszabbEgyezes → d = 2, l = 6; átfedő: l = 6 > d = 2"}, {"ph": "enc", "p": 3, "d": 2, "l": 6, "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]], "line": 6, "msg": "kimenet.Hozzaad((2, 6, EOF)); p ← 9"}, {"ph": "dec", "out": ["a"], "src": null, "dst": 1, "k": 0, "line": 9, "msg": "(0, 0, 'a'): A.Hozzaad('a')", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b"], "src": null, "dst": 2, "k": 1, "line": 9, "msg": "(0, 0, 'b'): A.Hozzaad('b')", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a"], "src": 1, "dst": 3, "k": 2, "line": 11, "msg": "(2, 6, EOF): 1. másolt karakter: A[1] = 'a' → A[3]", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a", "b"], "src": 2, "dst": 4, "k": 2, "line": 11, "msg": "(2, 6, EOF): 2. másolt karakter: A[2] = 'b' → A[4]", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a", "b", "a"], "src": 3, "dst": 5, "k": 2, "line": 11, "msg": "(2, 6, EOF): 3. másolt karakter: A[3] = 'a' → A[5] (a forrás egy korábban másolt karakter)", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a", "b", "a", "b"], "src": 4, "dst": 6, "k": 2, "line": 11, "msg": "(2, 6, EOF): 4. másolt karakter: A[4] = 'b' → A[6] (a forrás egy korábban másolt karakter)", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a", "b", "a", "b", "a"], "src": 5, "dst": 7, "k": 2, "line": 11, "msg": "(2, 6, EOF): 5. másolt karakter: A[5] = 'a' → A[7] (a forrás egy korábban másolt karakter)", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}, {"ph": "dec", "out": ["a", "b", "a", "b", "a", "b", "a", "b"], "src": 6, "dst": 8, "k": 2, "line": 11, "msg": "(2, 6, EOF): 6. másolt karakter: A[6] = 'b' → A[8] (a forrás egy korábban másolt karakter)", "tok": [[0, 0, "a"], [0, 0, "b"], [2, 6, "EOF"]]}];
const CODE = ["LZ77_Kodol(A[1..n], W_s, W_l):", "    kimenet ← üres lista; p ← 1", "    amíg p ≤ n:", "        (d, l) ← LeghosszabbEgyezes(A, p, W_s, W_l)", "        ha l = 0: kimenet.Hozzaad((0, 0, A[p])); p ← p + 1", "        különben ha p + l ≤ n: kimenet.Hozzaad((d, l, A[p + l])); p ← p + l + 1", "        különben: kimenet.Hozzaad((d, l, EOF)); p ← n + 1", "LZ77_Dekodol(K):", "    minden (d, l, c) hármasra K-ban:", "        ha d = 0: A.Hozzaad(c)", "        különben: poz ← Hossz(A) − d + 1", "            ismételd l-szer: A.Hozzaad(A[poz]); poz ← poz + 1", "            ha c ≠ EOF: A.Hozzaad(c)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TXT = "abababab";
const WS = 8, WL = 8;
function longest(A, p, ov){ const n = A.length; let best = [0, 0];
  for (let d = 1; d <= Math.min(WS, p - 1); d++) { let l = 0;
    while (l < Math.min(WL, n - p + 1)) { const src = p - d + l; if (!ov && src >= p) break; if (A[src - 1] !== A[p + l - 1]) break; l++; }
    if (l > best[1]) best = [d, l]; }
  return best; }
const ft = t => `(${t[0]}, ${t[1]}, ${t[2] === "EOF" ? "EOF" : "'" + t[2] + "'"})`;
function trace(A, ov){
  const n = A.length, st = [], out = []; let p = 1;
  while (p <= n) { const [d, l] = longest(A, p, ov);
    st.push({ph: "enc", p, d, l, tok: out.map(t => t.slice()), line: 3, msg: `p = ${p}: LeghosszabbEgyezes → ` + (l ? `d = ${d}, l = ${l}` : "nincs egyezés (l = 0)") + (l > d && d > 0 ? `; átfedő: l = ${l} > d = ${d}` : "")});
    let t, np, line;
    if (l === 0) { t = [0, 0, A[p - 1]]; np = p + 1; line = 4; } else if (p + l <= n) { t = [d, l, A[p + l - 1]]; np = p + l + 1; line = 5; } else { t = [d, l, "EOF"]; np = n + 1; line = 6; }
    out.push(t); st.push({ph: "enc", p, d, l, tok: out.map(x => x.slice()), line, msg: `kimenet.Hozzaad(${ft(t)}); p ← ${np}`}); p = np; }
  const B = [];
  out.forEach((t, k) => { const [d, l, c] = t;
    if (d === 0) { B.push(c); st.push({ph: "dec", out: B.slice(), src: null, dst: B.length, k, tok: out, line: 9, msg: `${ft(t)}: A.Hozzaad('${c}')`}); return; }
    let poz = B.length - d + 1; const start = B.length;
    for (let i = 0; i < l; i++) { B.push(B[poz - 1]);
      st.push({ph: "dec", out: B.slice(), src: poz, dst: B.length, k, tok: out, line: 11, msg: `${ft(t)}: ${i + 1}. másolt karakter: A[${poz}] = '${B[poz - 1]}' → A[${B.length}]` + (poz > start ? " (a forrás egy korábban másolt karakter)" : "")}); poz++; }
    if (c !== "EOF") { B.push(c); st.push({ph: "dec", out: B.slice(), src: null, dst: B.length, k, tok: out, line: 12, msg: `${ft(t)}: záró karakter A.Hozzaad('${c}')`}); } });
  return st; }
function render(s){
  svg.innerHTML = ""; const n = TXT.length, w = Math.min(54, 500 / Math.max(n, 8)), x0 = 30, cx = i => x0 + (i - 0.5) * w;
  svg.setAttribute("viewBox", "0 0 560 300");
  const toks = s.ph === "enc" ? s.tok : s.tok;
  if (s.ph === "enc") {
    const y = 110, p = s.p, d = s.d, l = s.l;
    el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, "Kódolás (bemenet A)");
    for (let i = 1; i <= n; i++) { const hit = l > 0 && i >= p && i < p + l;
      el("rect", {x: x0 + (i - 1) * w, y, width: w, height: w, fill: hit ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
      if (hit) for (let h = 6; h < w; h += 8) el("line", {x1: x0 + (i - 1) * w + h, y1: y + w, x2: x0 + (i - 1) * w + Math.min(w, h + 8), y2: y + w - Math.min(8, w - h), stroke: css("--muted")});
      el("text", {x: cx(i), y: y + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, TXT[i - 1]);
      el("text", {x: cx(i), y: y + w + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i)); }
    const a = Math.max(1, p - WS); if (p - 1 >= a) el("rect", {x: x0 + (a - 1) * w - 3, y: y - 3, width: (p - a) * w + 6, height: w + 6, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "7 4"});
    const b = Math.min(n, p + WL - 1); el("rect", {x: x0 + (p - 1) * w - 6, y: y - 6, width: (b - p + 1) * w + 12, height: w + 12, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "2 4"});
    el("text", {x: cx(p), y: y + w + 40, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "↑ p");
    if (l > 0) { const xa = cx(p), xb = cx(p - d); el("path", {d: `M${xa},${y - 8} C${xa},${y - 60} ${xb},${y - 60} ${xb},${y - 10}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
      el("path", {d: `M${xb - 6},${y - 20} L${xb},${y - 9} L${xb + 6},${y - 20}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
      el("text", {x: (xa + xb) / 2, y: y - 50, "text-anchor": "middle", "font-size": 13, fill: css("--hl")}, `d = ${d}, l = ${l}`); }
    el("text", {x: 10, y: 250, "font-size": 12, fill: css("--muted")}, "szaggatott = keresőpuffer · pontozott = előretekintő puffer · sraffozott = egyező cellák");
  } else {
    const y = 110, B = s.out;
    el("text", {x: 10, y: 22, "font-size": 14, "font-weight": "bold"}, "Dekódolás (kimenet A)");
    for (let i = 1; i <= n; i++) { const v = i <= B.length ? B[i - 1] : "";
      el("rect", {x: x0 + (i - 1) * w, y, width: w, height: w, fill: i === s.src ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": i === s.dst ? 4 : 1.2});
      el("text", {x: cx(i), y: y + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, v);
      el("text", {x: cx(i), y: y + w + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i)); }
    if (s.src) { const xa = cx(s.src), xb = cx(s.dst); el("path", {d: `M${xa},${y - 6} C${xa},${y - 55} ${xb},${y - 55} ${xb},${y - 9}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
      el("path", {d: `M${xb - 6},${y - 20} L${xb},${y - 9} L${xb + 6},${y - 20}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
      el("text", {x: (xa + xb) / 2, y: y - 46, "text-anchor": "middle", "font-size": 13, fill: css("--hl")}, `poz = ${s.src} → ${s.dst}`); }
    el("text", {x: 10, y: 250, "font-size": 12, fill: css("--muted")}, "szürke = a másolás forrása (poz) · vastag keret = az éppen írt cella");
  }
  el("text", {x: 10, y: 280, "font-size": 13}, "Hármasok: " + (toks.length ? toks.map((t, i) => (s.ph === "dec" && i === s.k ? "▶" : "") + ft(t)).join(", ") : "–"));
}
function load(){
  const v = document.getElementById("inp").value, err = document.getElementById("err");
  if (v.length < 1 || v.length > 10 || /[\s,]/.test(v)) { err.textContent = "1–10 karakter, szóköz és vessző nélkül."; return; }
  err.textContent = ""; TXT = v; setSteps(trace(v, document.getElementById("ov").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
