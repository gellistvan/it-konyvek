<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip list keresés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Keresett kulcs: <input id="key" value="10" size="5" aria-label="Keresett kulcs"></label><button onclick="load()">Keresés</button><button onclick="document.getElementById('key').value=11;load()">Példa: 11 (NIL)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négyszintű skip list a fej és az 1, 3, 7, 10, 14, 19 kulcsok oszlopaival; a keresési út jobbra és lefelé lépve halad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 1/2; a szintek a 12.2.7 szövegében rögzítettek (L2 = {1, 7, 14, 19}, L3 = {1, 14}, L4 = {1}). Kezdőállapot: a 10 keresése; szaggatott oszlop = a keresés (eddig) nem érintette.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"x": null, "lvl": 4, "kind": "start", "line": 1, "msg": "SKIP-SEARCH(S, 10): x = fej, i = 4", "moves": []}, {"x": 1, "lvl": 4, "kind": "move", "line": 4, "moves": [["r", null, 1, 4]], "msg": "L4: fej → következő 1 < 10, jobbra lépünk: x = 1"}, {"x": 1, "lvl": 3, "kind": "down", "line": 2, "moves": [["r", null, 1, 4], ["d", 1, 1, 4]], "msg": "L4: 1 → következő NIL, lefelé (L3)"}, {"x": 1, "lvl": 2, "kind": "down", "line": 2, "moves": [["r", null, 1, 4], ["d", 1, 1, 4], ["d", 1, 1, 3]], "msg": "L3: 1 → következő 14 ≥ 10, lefelé (L2)"}, {"x": 7, "lvl": 2, "kind": "move", "line": 4, "moves": [["r", null, 1, 4], ["d", 1, 1, 4], ["d", 1, 1, 3], ["r", 1, 7, 2]], "msg": "L2: 1 → következő 7 < 10, jobbra lépünk: x = 7"}, {"x": 7, "lvl": 1, "kind": "down", "line": 2, "moves": [["r", null, 1, 4], ["d", 1, 1, 4], ["d", 1, 1, 3], ["r", 1, 7, 2], ["d", 7, 7, 2]], "msg": "L2: 7 → következő 14 ≥ 10, lefelé (L1)"}, {"x": 10, "lvl": 1, "kind": "final", "line": 7, "moves": [["r", null, 1, 4], ["d", 1, 1, 4], ["d", 1, 1, 3], ["r", 1, 7, 2], ["d", 7, 7, 2], ["r", 7, 10, 1]], "found": true, "msg": "L1: 7 → következő 10 ≥ 10; x = x.forward[1] = 10 = 10: találat"}];
const CODE = ["SKIP-SEARCH(S, k)", "    x = S.head", "    for i = S.maxLevel downto 1", "        while x.forward[i] != NIL and x.forward[i].key < k", "            x = x.forward[i]", "    x = x.forward[1]", "    if x != NIL and x.key == k", "        return x", "    else", "        return NIL"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const KEYS = [1, 3, 7, 10, 14, 19], HEIGHT = {'1': 4, '3': 1, '7': 2, '10': 1, '14': 3, '19': 2}, MAXL = 4;
function fwd(x, i){ const st = x === null ? 0 : KEYS.indexOf(x) + 1; for (const k of KEYS.slice(st)) if (HEIGHT[k] >= i) return k; return null; }
const nm = x => x === null ? "fej" : String(x);
function search(k){
  let x = null; const steps = [], moves = [];
  steps.push({x: null, lvl: MAXL, line: 1, msg: `SKIP-SEARCH(S, ${k}): x = fej, i = ${MAXL}`, moves: []});
  for (let i = MAXL; i >= 1; i--) while (true) { const f = fwd(x, i);
    if (f !== null && f < k) { moves.push(["r", x, f, i]); steps.push({x: f, lvl: i, line: 4, moves: moves.slice(), msg: `L${i}: ${nm(x)} → következő ${f} < ${k}, jobbra lépünk: x = ${f}`}); x = f; }
    else { const why = f === null ? "NIL" : `${f} ≥ ${k}`;
      if (i > 1) { moves.push(["d", x, x, i]); steps.push({x, lvl: i - 1, line: 2, moves: moves.slice(), msg: `L${i}: ${nm(x)} → következő ${why}, lefelé (L${i-1})`}); }
      else { const nx = fwd(x, 1), found = nx !== null && nx === k; if (found) moves.push(["r", x, nx, 1]);
        steps.push({x: found ? nx : x, lvl: 1, line: found ? 7 : 9, moves: moves.slice(), found,
          msg: `L1: ${nm(x)} → következő ${why}; x = x.forward[1] = ${nx === null ? "NIL" : nx}` + (found ? ` = ${k}: találat` : ` ≠ ${k}: NIL (nincs a listában)`)}); }
      break; } }
  return steps;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 260");
  svg.innerHTML = '<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--muted") + '"/></marker>'
    + '<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const X = {"null": 56}; KEYS.forEach((k, j) => X[k] = 110 + j * 66); const XN = 110 + KEYS.length * 66 - 10;
  const Y = i => 200 - (i - 1) * 46, W = 36, H = 28;
  const used = new Set(), visited = new Set([null]); s.moves.forEach(m => { visited.add(m[2]); });
  [null].concat(KEYS).forEach(x => { const h = x === null ? MAXL : HEIGHT[x];
    for (let i = 1; i <= h; i++) { const cur = s.x === x && s.lvl === i;
      el("rect", {x: X[x] - W/2, y: Y(i) - H/2, width: W, height: H, fill: x === null ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : 1.1, "stroke-dasharray": visited.has(x) ? "none" : "3 3"});
      if (x !== null) el("text", {x: X[x], y: Y(i) + 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(x)); }
    el("text", {x: X[x], y: 238, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: visited.has(x) ? css("--fg") : css("--muted")}, nm(x)); });
  for (let i = 1; i <= MAXL; i++) { el("text", {x: 4, y: Y(i) + 5, "font-size": 12}, "L" + i); el("text", {x: XN + 8, y: Y(i) + 4, "font-size": 11}, "NIL");
    [null].concat(KEYS).forEach(x => { if (x !== null && HEIGHT[x] < i) return; const f = fwd(x, i);
      el("line", {x1: X[x] + W/2, y1: Y(i), x2: f === null ? XN + 4 : X[f] - W/2 - 1, y2: Y(i), stroke: css("--muted"), "stroke-width": 1, "marker-end": "url(#a1)"}); }); }
  s.moves.forEach((m, n) => { const [kind, a, b, i] = m;
    if (kind === "r") el("line", {x1: X[a] + W/2, y1: Y(i) - 4, x2: X[b] - W/2 - 2, y2: Y(i) - 4, stroke: css("--hl2"), "stroke-width": 4, "marker-end": "url(#a2)"});
    else el("line", {x1: X[a] + W/2 + 8, y1: Y(i) + 4, x2: X[a] + W/2 + 8, y2: Y(i - 1) - 6, stroke: css("--hl2"), "stroke-width": 4, "marker-end": "url(#a2)"});
    const tx = kind === "r" ? (X[a] + X[b]) / 2 : X[a] + W/2 + 20, ty = kind === "r" ? Y(i) - 14 : (Y(i) + Y(i - 1)) / 2;
    el("text", {x: tx, y: ty, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, String(n + 1)); });
}
function load(){
  const v = Number(document.getElementById("key").value.replace(",", ".")), e = document.getElementById("err");
  if (!isFinite(v)) { e.textContent = "Számot adjon meg."; return; } e.textContent = ""; setSteps(search(v));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
