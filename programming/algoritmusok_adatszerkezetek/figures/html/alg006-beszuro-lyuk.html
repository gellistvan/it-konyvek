<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beszúró rendezés a logikai lyukkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb: <input id="inp" value="3, 1, 3, 2" size="22" aria-label="Saját tömb"></label><label><input id="ge" type="checkbox" onchange="load()"> &gt;= összehasonlítás (hibás, instabil)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tömb lépésenként; a kulcs kiemelése után a helye lyuk, a nagyobb elemek jobbra tolódnak, a lyuk balra vándorol, végül a kulcs a lyukba kerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (3.1.4). A két 3-as 3ᵃ, 3ᵇ jelölése az eredeti sorrendet követi; a while szigorú > feltétele miatt a rendezés stabil. Kezdőállapot: A = [3, 1, 3, 2].</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"A": ["3ᵃ", "1", "3ᵇ", "2"], "key": null, "hole": null, "j": null, "i": null, "kind": "start", "sorted": 1, "line": -1, "msg": "Kezdet: A = [3ᵃ, 1, 3ᵇ, 2]"}, {"A": ["3ᵃ", null, "3ᵇ", "2"], "key": "1", "hole": 2, "j": 2, "i": 1, "kind": "pick", "sorted": 2, "line": 1, "msg": "j = 2, kulcs = 1, i = 1, lyuk = 2; A = [3ᵃ, _, 3ᵇ, 2]; invariáns: A[1..1] változatlan, a lyuktól jobbra nincs elem"}, {"A": [null, "3ᵃ", "3ᵇ", "2"], "key": "1", "hole": 1, "j": 2, "i": 0, "kind": "shift", "frm": 1, "to": 2, "sorted": 2, "line": 4, "msg": "j = 2, kulcs = 1, i = 0, lyuk = 1; jobb oldal: A[2..2] = [3ᵃ]; invariáns: A[1..0] változatlan, A[2..2] > kulcs"}, {"A": ["1", "3ᵃ", "3ᵇ", "2"], "key": null, "hole": null, "j": 2, "i": 0, "kind": "put", "put": 1, "shifts": 1, "sorted": 2, "line": 6, "msg": "j = 2: A[1] = kulcs (1), 1 eltolás; A = [1, 3ᵃ, 3ᵇ, 2]; A[1..2] rendezett"}, {"A": ["1", "3ᵃ", null, "2"], "key": "3ᵇ", "hole": 3, "j": 3, "i": 2, "kind": "pick", "sorted": 3, "line": 1, "msg": "j = 3, kulcs = 3ᵇ, i = 2, lyuk = 3; A = [1, 3ᵃ, _, 2]; invariáns: A[1..2] változatlan, a lyuktól jobbra nincs elem"}, {"A": ["1", "3ᵃ", "3ᵇ", "2"], "key": null, "hole": null, "j": 3, "i": 2, "kind": "put", "put": 3, "shifts": 0, "sorted": 3, "line": 6, "msg": "j = 3: A[3] = kulcs (3ᵇ), 0 eltolás; A = [1, 3ᵃ, 3ᵇ, 2]; A[1..3] rendezett"}, {"A": ["1", "3ᵃ", "3ᵇ", null], "key": "2", "hole": 4, "j": 4, "i": 3, "kind": "pick", "sorted": 4, "line": 1, "msg": "j = 4, kulcs = 2, i = 3, lyuk = 4; A = [1, 3ᵃ, 3ᵇ, _]; invariáns: A[1..3] változatlan, a lyuktól jobbra nincs elem"}, {"A": ["1", "3ᵃ", null, "3ᵇ"], "key": "2", "hole": 3, "j": 4, "i": 2, "kind": "shift", "frm": 3, "to": 4, "sorted": 4, "line": 4, "msg": "j = 4, kulcs = 2, i = 2, lyuk = 3; jobb oldal: A[4..4] = [3ᵇ]; invariáns: A[1..2] változatlan, A[4..4] > kulcs"}, {"A": ["1", null, "3ᵃ", "3ᵇ"], "key": "2", "hole": 2, "j": 4, "i": 1, "kind": "shift", "frm": 2, "to": 3, "sorted": 4, "line": 4, "msg": "j = 4, kulcs = 2, i = 1, lyuk = 2; jobb oldal: A[3..4] = [3ᵃ, 3ᵇ]; invariáns: A[1..1] változatlan, A[3..4] > kulcs"}, {"A": ["1", "2", "3ᵃ", "3ᵇ"], "key": null, "hole": null, "j": 4, "i": 1, "kind": "put", "put": 2, "shifts": 2, "sorted": 4, "line": 6, "msg": "j = 4: A[2] = kulcs (2), 2 eltolás; A = [1, 2, 3ᵃ, 3ᵇ]; A[1..4] rendezett – kész: [1, 2, 3ᵃ, 3ᵇ]"}];
const CODE = ["for j = 2 to n:", "    kulcs = A[j]", "    i = j - 1", "    while i >= 1 and A[i] > kulcs:", "        A[i+1] = A[i]", "        i = i - 1", "    A[i+1] = kulcs"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.2"/></pattern>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="' + css("--line") + '"/></marker></defs>';
  svg.setAttribute("viewBox", "0 0 560 260");
  const n = s.A.length, w = Math.min(56, 520 / n), x0 = (560 - n * w) / 2, y0 = 130;
  s.A.forEach((v, j) => {
    const p = j + 1, hole = v === null, put = s.kind === "put" && p === s.put;
    const pref = !hole && s.sorted && p <= s.sorted && s.kind !== "put" && s.kind !== "start";
    el("rect", {x: x0 + j*w, y: y0, width: w, height: w, fill: css("--cell"), stroke: css("--line"),
                "stroke-width": put ? 4 : (hole ? 2 : 1.2), "stroke-dasharray": hole ? "6 4" : "none"});
    if (pref) el("rect", {x: x0 + j*w, y: y0, width: w, height: w, fill: "url(#hp)", stroke: "none"});
    if (!hole) {
      el("rect", {x: x0 + j*w + w/2 - 17, y: y0 + w/2 - 12, width: 34, height: 24, fill: css("--bg"), opacity: pref ? 1 : 0});
      el("text", {x: x0 + j*w + w/2, y: y0 + w/2 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, v);
    }
    el("text", {x: x0 + j*w + w/2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(p));
  });
  if (s.key !== null && s.key !== undefined) {
    const hx = x0 + (s.hole - 1) * w;
    el("rect", {x: hx + 6, y: y0 - 58, width: w - 12, height: 34, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: hx + w/2, y: y0 - 35, "text-anchor": "middle", "font-size": 16}, s.key);
    el("text", {x: hx + w/2, y: y0 - 64, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "kulcs");
  }
  if (s.kind === "shift") {
    const a = x0 + (s.frm - 0.5) * w, b = x0 + (s.to - 0.5) * w;
    el("path", {d: `M${a},${y0 + 4} Q${(a + b)/2},${y0 - 18} ${b - 4},${y0 + 2}`, fill: "none", stroke: css("--line"), "stroke-width": 3, "marker-end": "url(#ah)"});
  }
  el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"},
     s.kind === "start" ? "kezdőállapot" : `j = ${s.j}` + (s.kind === "pick" ? ": kulcsfelvétel" : s.kind === "shift" ? ": eltolás" : ": visszaírás"));
  el("text", {x: 280, y: 250, "text-anchor": "middle", "font-size": 12, fill: css("--muted")},
     "sraffozott = A[1..j] eredeti elemei · szaggatott = lyuk · vastag keret = visszaírt kulcs");
}
const SUP = "ᵃᵇᶜᵈᵉᶠᵍʰⁱʲ";
function trace(a0, ge){
  const cnt = {}, seen = {}; a0.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
  const A = a0.map(v => { const k = seen[v] || 0; seen[v] = k + 1; return String(v).replace("-", "−") + (cnt[v] > 1 ? SUP[k] : ""); });
  const val = {}; A.forEach((t, j) => val[t] = a0[j]);
  const arr = B => "[" + B.map(x => x === null ? "_" : x).join(", ") + "]";
  const n = A.length, st = [{A: A.slice(), key: null, kind: "start", sorted: 1, line: -1, msg: "Kezdet: A = " + arr(A)}];
  for (let j = 2; j <= n; j++) {
    const key = A[j-1]; A[j-1] = null; let i = j - 1, sh = 0;
    st.push({A: A.slice(), key, hole: j, j, i, kind: "pick", sorted: j, line: 1,
             msg: `j = ${j}, kulcs = ${key}, i = ${i}, lyuk = ${i+1}; A = ${arr(A)}; invariáns: A[1..${i}] változatlan, a lyuktól jobbra nincs elem`});
    while (i >= 1 && (ge ? val[A[i-1]] >= val[key] : val[A[i-1]] > val[key])) {
      A[i] = A[i-1]; A[i-1] = null; i--; sh++;
      st.push({A: A.slice(), key, hole: i + 1, j, i, kind: "shift", frm: i + 1, to: i + 2, sorted: j, line: 4,
               msg: `j = ${j}, kulcs = ${key}, i = ${i}, lyuk = ${i+1}; jobb oldal: A[${i+2}..${j}] = [${A.slice(i+1, j).join(", ")}]; invariáns: A[1..${i}] változatlan, A[${i+2}..${j}] ${ge ? "≥" : ">"} kulcs`});
    }
    A[i] = key;
    st.push({A: A.slice(), key: null, j, i, kind: "put", put: i + 1, shifts: sh, sorted: j, line: 6,
             msg: `j = ${j}: A[${i+1}] = kulcs (${key}), ${sh} eltolás; A = ${arr(A)}; A[1..${j}] rendezett`});
  }
  st[st.length-1].msg += " – kész: " + arr(A) + (ge ? " (>= mellett az egyenlő kulcsok sorrendje felcserélődhet: instabil)" : "");
  return st;
}
function load(){
  const e = document.getElementById("err");
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (raw.length < 2 || raw.length > 10 || raw.some(x => !Number.isInteger(x))) { e.textContent = "2–10 egész számot adjon meg."; return; }
  e.textContent = ""; setSteps(trace(raw, document.getElementById("ge").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
