<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A rekurzív faktoriális hívási verme</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n = <select id="nn" onchange="load()" aria-label="n értéke"><option>0</option><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label><input id="nb" type="checkbox" onchange="load()"> alapeset (és az n &lt; 0 ellenőrzés) kihagyása</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Veremkeretek egymásra rakva: F(3), F(2), F(1), F(0), majd a visszatérések 1, 1, 2, 6 értékkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Pszeudokód a 2.3.7-ből (FaktorialisRekurziv). Kezdőállapot: n = 3, 8 lépés (4 hívás + 4 visszatérés). A hibás változatban az alapeset és a negatív-ellenőrzés is hiányzik; a lejátszó 10 keret után megáll.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"frames": [3], "active": 3, "line": 3, "ret": null, "msg": "veremmélység = 1; aktív hívás: F(3) – kiértékeli: 3 * F(2)"}, {"frames": [3, 2], "active": 2, "line": 3, "ret": null, "msg": "veremmélység = 2; aktív hívás: F(2) – kiértékeli: 2 * F(1)"}, {"frames": [3, 2, 1], "active": 1, "line": 3, "ret": null, "msg": "veremmélység = 3; aktív hívás: F(1) – kiértékeli: 1 * F(0)"}, {"frames": [3, 2, 1, 0], "active": 0, "line": 2, "ret": null, "msg": "veremmélység = 4; aktív hívás: F(0) – alapeset, visszaad 1"}, {"frames": [3, 2, 1], "active": 1, "line": 2, "ret": [0, 1], "msg": "F(0) visszatér: 1 (alapeset); veremmélység = 3; aktív hívás: F(1)"}, {"frames": [3, 2], "active": 2, "line": 3, "ret": [1, 1], "msg": "F(1) visszatér: 1 * 1 = 1; veremmélység = 2; aktív hívás: F(2)"}, {"frames": [3], "active": 3, "line": 3, "ret": [2, 2], "msg": "F(2) visszatér: 2 * 1 = 2; veremmélység = 1; aktív hívás: F(3)"}, {"frames": [], "active": null, "line": 3, "ret": [3, 6], "msg": "F(3) visszatér: 3 * 2 = 6; veremmélység = 0; a hívó megkapja: 6"}];
const CODE = ["FaktorialisRekurziv(n):", "  if n < 0 then hiba \"negatív bemenet\"", "  if n = 0 then return 1        // alapeset", "  else return n * FaktorialisRekurziv(n-1)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = "";
  const fr = s.frames, n = Math.max(fr.length, 4), h = Math.min(40, 230 / n), w = 220, x0 = 60, yb = 268;
  svg.setAttribute("viewBox", "0 0 560 300");
  el("text", {x: x0 + w/2, y: 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "hívási verem (teteje felül)");
  fr.forEach((m, i) => {
    const y = yb - (i + 1) * h, top = i === fr.length - 1;
    const base = m === 0 && !s.nobase;
    el("rect", {x: x0, y: y + 2, width: w, height: h - 4, rx: 5, fill: top ? css("--cellhl") : css("--cell"),
                stroke: css("--line"), "stroke-width": top ? 3 : 1.2});
    el("text", {x: x0 + w/2, y: y + h/2 + 5, "text-anchor": "middle", "font-size": Math.min(14, h * 0.45)},
       "F(" + String(m).replace("-", "−") + "): " + (base ? "alapeset → 1" : "vár: " + String(m).replace("-", "−") + " * ?"));
  });
  el("line", {x1: x0 - 10, y1: yb, x2: x0 + w + 10, y2: yb, stroke: css("--line"), "stroke-width": 2});
  el("text", {x: x0 + w/2, y: yb + 20, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "veremmélység = " + fr.length);
  if (s.over) el("text", {x: 420, y: 140, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "végtelen rekurzió /");
  if (s.over) el("text", {x: 420, y: 162, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "veremtúlcsordulás");
  if (s.ret) {
    el("text", {x: 420, y: 120, "text-anchor": "middle", "font-size": 15}, "visszatérés (szaggatott nyíl):");
    el("line", {x1: 420, y1: 135, x2: 420, y2: 185, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "6 4"});
    el("path", {d: "M413,178 L420,192 L427,178 Z", fill: css("--line")});
    el("text", {x: 420, y: 215, "text-anchor": "middle", "font-size": 17, "font-weight": "bold"},
       "F(" + s.ret[0] + ") = " + s.ret[1]);
  } else if (!s.over) {
    el("text", {x: 420, y: 120, "text-anchor": "middle", "font-size": 15}, "hívás (folytonos nyíl):");
    el("line", {x1: 420, y1: 192, x2: 420, y2: 140, stroke: css("--line"), "stroke-width": 2});
    el("path", {d: "M413,147 L420,133 L427,147 Z", fill: css("--line")});
    el("text", {x: 420, y: 215, "text-anchor": "middle", "font-size": 17, "font-weight": "bold"},
       "F(" + String(s.active).replace("-", "−") + ") elindul");
  }
}
const MAXF = 10;
function trace(n, nobase){
  const st = [], stack = [];
  function call(m){
    stack.push(m);
    const d = stack.length;
    if (nobase && d >= MAXF) {
      st.push({frames: stack.slice(), active: m, line: 3, nobase: true, over: true, ret: null,
               msg: `veremmélység = ${d}; aktív hívás: F(${m}) – az alapeset hiányzik, a hívások soha nem érnek véget: végtelen rekurzió / veremtúlcsordulás`});
      return null;
    }
    const base = m === 0 && !nobase;
    st.push({frames: stack.slice(), active: m, line: base ? 2 : 3, ret: null, nobase,
             msg: `veremmélység = ${d}; aktív hívás: F(${m})` + (base ? " – alapeset, visszaad 1" : ` – kiértékeli: ${m} * F(${m-1})`)});
    let v, sub;
    if (base) v = 1; else { sub = call(m - 1); if (sub === null) return null; v = m * sub; }
    stack.pop();
    st.push({frames: stack.slice(), active: stack.length ? stack[stack.length-1] : null, line: base ? 2 : 3, ret: [m, v], nobase,
             msg: `F(${m}) visszatér: ${base ? "1 (alapeset)" : m + " * " + sub + " = " + v}; veremmélység = ${stack.length}`
                  + (stack.length ? `; aktív hívás: F(${stack[stack.length-1]})` : "; a hívó megkapja: " + v)});
    return v;
  }
  call(n);
  return st;
}
function load(){
  setSteps(trace(+document.getElementById("nn").value, document.getElementById("nb").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
