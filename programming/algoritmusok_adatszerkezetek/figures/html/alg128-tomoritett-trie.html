<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefixkeresés tömörített trie-ban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>prefix: <input id="pre" value="alm" size="8" aria-label="Prefix"></label><label>szótár: <input id="dict" value="alma, almafa, al, körte, körtefa, alma" size="30" aria-label="Szótár"></label><button onclick="load()">Keresés</button><button onclick="document.getElementById('pre').value='al';load()">„al”</button><button onclick="document.getElementById('pre').value='z';load()">„z”</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tömörített trie: gyökér, al, ma, fa élek és körte, fa élek; az alm prefix a ma él első karaktere után áll meg; eredmény alma, almafa."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet prefix_search és _collect függvényének (Python) lépésenkénti átirata. Kezdőállapot: a teszt fixed szótára, prefix = „alm”.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": 1, "acc": "", "rest": "alm", "line": 1, "msg": "prefix = „alm”: node = gyökér, acc = „”, rest = „alm”"}, {"cur": 2, "edge": 2, "j": 2, "acc": "al", "rest": "m", "line": 6, "msg": "él „al”: j = 2 = |lab| → az él végére lépünk; acc = „al”, rest = „m”"}, {"cur": 3, "edge": 3, "j": 1, "mid": 1, "acc": "alma", "rest": "", "line": 7, "msg": "él „ma”: j = 1 = |rest| < |lab| → a prefix az él belsejében ér véget („m|a”); a prefix csúcsa az él alatti csúcs, acc = „alma”"}, {"cur": 3, "acc": "alma", "rest": "", "line": 11, "got": ["alma"], "msg": "_collect: „alma” terminális → gyűjtve"}, {"cur": 4, "acc": "almafa", "rest": "", "line": 11, "got": ["alma", "almafa"], "msg": "_collect: „almafa” terminális → gyűjtve"}, {"cur": null, "acc": "alma", "rest": "", "line": 9, "res": ["alma", "almafa"], "got": ["alma", "almafa"], "msg": "eredmény: [alma, almafa]"}];
const CODE = ["def prefix_search(root, prefix):", "    node, acc, rest = root, \"\", prefix", "    while rest:", "        child = node.children.get(rest[0])", "        if child is None: return []", "        lab = child.label; j = közös előtag hossza", "        if j == len(lab): lépés az él végére", "        elif j == len(rest): él belsejében vége", "        else: return []", "    _collect(node, acc, out); return sorted(out)", "def _collect(node, acc, out):", "    if node.terminal: out.append(acc)", "    gyerekek első karakter szerint: _collect(...)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let WORDS = ["alma", "almafa", "al", "körte", "körtefa", "alma"], ROOT = null, NID = 0;
function Node(label){ return {id: ++NID, label: label || "", children: {}, terminal: false}; }
function ins(node, word){
  if (!word) { node.terminal = true; return; }
  const child = node.children[word[0]];
  if (!child) { const leaf = Node(word); leaf.terminal = true; node.children[word[0]] = leaf; return; }
  const lab = child.label; let i = 0; while (i < lab.length && i < word.length && lab[i] === word[i]) i++;
  if (i === lab.length) { ins(child, word.slice(i)); return; }
  const mid = Node(lab.slice(0, i)), old = Node(lab.slice(i)); old.children = child.children; old.terminal = child.terminal;
  mid.children[lab[i]] = old; node.children[word[0]] = mid;
  if (i === word.length) mid.terminal = true; else { const leaf = Node(word.slice(i)); leaf.terminal = true; mid.children[word[i]] = leaf; }
}
function buildT(words){ NID = 0; const r = Node(""); [...new Set(words)].sort().forEach(w => ins(r, w)); return r; }
function trace(root, prefix){
  const st = []; let node = root, acc = "", rest = [...prefix];
  st.push({cur: node.id, acc, rest: rest.join(""), line: 1, msg: `prefix = „${prefix}”: node = gyökér, acc = „”, rest = „${rest.join("")}”`});
  while (rest.length) {
    const child = node.children[rest[0]];
    if (!child) { st.push({cur: node.id, acc, rest: rest.join(""), line: 4, res: [], msg: `nincs „${rest[0]}” kezdetű gyerek → []`}); return st; }
    const lab = [...child.label]; let j = 0; while (j < rest.length && j < lab.length && rest[j] === lab[j]) j++;
    if (j === lab.length) { st.push({cur: child.id, edge: child.id, j, acc: acc + child.label, rest: rest.slice(j).join(""), line: 6, msg: `él „${child.label}”: j = ${j} = |lab| → az él végére lépünk; acc = „${acc + child.label}”, rest = „${rest.slice(j).join("")}”`});
      node = child; acc += child.label; rest = rest.slice(j); }
    else if (j === rest.length) { st.push({cur: child.id, edge: child.id, j, mid: j, acc: acc + child.label, rest: "", line: 7, msg: `él „${child.label}”: j = ${j} = |rest| < |lab| → a prefix az él belsejében ér véget („${lab.slice(0, j).join("")}|${lab.slice(j).join("")}”); acc = „${acc + child.label}”`});
      node = child; acc += child.label; rest = []; }
    else { st.push({cur: node.id, edge: child.id, j, acc, rest: rest.join(""), line: 8, res: [], msg: `él „${child.label}”: eltérés a(z) ${j}. pozíción → []`}); return st; }
  }
  const out = [];
  const col = (n, a) => { if (n.terminal) { out.push(a); st.push({cur: n.id, acc: a, rest: "", line: 11, got: out.slice(), msg: `_collect: „${a}” terminális → gyűjtve`}); }
    else st.push({cur: n.id, acc: a, rest: "", line: 12, got: out.slice(), msg: `_collect: „${a}” nem terminális`});
    Object.keys(n.children).sort().forEach(f => { const c = n.children[f]; col(c, a + c.label); }); };
  col(node, acc);
  const res = out.slice().sort();
  st.push({cur: null, acc, rest: "", line: 9, res, got: out.slice(), msg: `eredmény: [${res.join(", ")}]`});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 300");
  const root = ROOT || (ROOT = buildT(WORDS));
  const P = {}, NODES = {}; let nx = 0, md = 0;
  const lay = (n, d) => { NODES[n.id] = n; md = Math.max(md, d); const ks = Object.keys(n.children).sort();
    if (!ks.length) { P[n.id] = [nx++, d]; return P[n.id][0]; } const xs = ks.map(c => lay(n.children[c], d + 1)); P[n.id] = [(xs[0] + xs[xs.length-1]) / 2, d]; return P[n.id][0]; };
  lay(root, 0);
  const sx = Math.min(120, 380 / Math.max(1, nx - 1)), sy = Math.min(70, 230 / Math.max(1, md)), X = v => 40 + v * sx + (nx === 1 ? 160 : 0), Y = d => 24 + d * sy;
  const parent = {}; for (const id in NODES) for (const c in NODES[id].children) parent[NODES[id].children[c].id] = +id;
  for (const id in NODES) { if (!(id in parent)) continue; const p = parent[id], n = NODES[id];
    const x1 = X(P[p][0]), y1 = Y(P[p][1]), x2 = X(P[id][0]), y2 = Y(P[id][1]), on = +id === s.edge;
    el("line", {x1, y1, x2, y2, stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.3});
    const lab = s.mid !== undefined && on ? [...n.label].slice(0, s.mid).join("") + "│" + [...n.label].slice(s.mid).join("") : n.label;
    el("text", {x: (x1 + x2) / 2 + 8, y: (y1 + y2) / 2 + 4, "font-size": 15, "font-weight": on ? "bold" : "normal"}, "„" + lab + "”"); }
  for (const id in NODES) { const n = NODES[id], x = X(P[id][0]), y = Y(P[id][1]), cur = +id === s.cur;
    el("circle", {cx: x, cy: y, r: 13, fill: cur ? css("--hl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
    if (n.terminal) el("circle", {cx: x, cy: y, r: 9, fill: "none", stroke: cur ? "#fff" : css("--line"), "stroke-width": 1.3}); }
  el("text", {x: 400, y: 30, "font-size": 14}, `acc = „${s.acc}”`);
  el("text", {x: 400, y: 52, "font-size": 14}, `rest = „${s.rest}”`);
  if (s.j !== undefined) el("text", {x: 400, y: 74, "font-size": 14}, `j = ${s.j}`);
  if (s.got) el("text", {x: 400, y: 100, "font-size": 14}, `out = [${s.got.join(", ")}]`);
  if (s.res) el("text", {x: 400, y: 126, "font-size": 15, "font-weight": "bold"}, `eredmény: [${s.res.join(", ")}]`);
  el("text", {x: 10, y: 292, "font-size": 12, fill: css("--muted")}, "dupla kör = terminális · kék csúcs = aktuális · kék él = vizsgált élcímke · │ = a prefix vége az élen belül");
}
function load(){
  const msg = document.getElementById("err");
  const ws = document.getElementById("dict").value.split(/[ ,;]+/).filter(x => x);
  if (ws.length < 1 || ws.length > 14) { msg.textContent = "1–14 szót adjon meg."; return; }
  msg.textContent = ""; WORDS = ws; ROOT = buildT(ws); setSteps(trace(ROOT, document.getElementById("pre").value));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
