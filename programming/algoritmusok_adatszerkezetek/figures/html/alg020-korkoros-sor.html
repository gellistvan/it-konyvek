<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körkörös sor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n = <select id="n" aria-label="Kapacitás"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label> <button onclick="resetOps(false)">Üres sor n-nel</button><label>érték: <input id="val" size="3" aria-label="Beszúrandó érték"></label><button onclick="addOp('enq')">enqueue</button><button onclick="addOp('deq')">dequeue</button><button onclick="resetOps(true)">Könyv példája</button><span class="small">Műveletek: <span id="ops">enq(a), enq(b), enq(c), deq, deq, enq(d), enq(e), enq(f), deq, deq, deq, deq</span></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négycellás körkörös puffer gyűrűként és tömbként; a front és rear jelölő körbefordul, tele és üres állapotban is ugyanarra a cellára mutat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (2.1). Kezdőállapot: n = 4 és a könyv műveletsora; a saját műveletek gombjai a sor végéhez fűznek, az „Üres sor n-nel” új sort kezd.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"T": [null, null, null, null], "front": 1, "rear": 1, "size": 0, "line": 0, "err": false, "cell": null, "msg": "Kezdetben üres: front = 1, rear = 1, méret = 0 (front = rear!)"}, {"T": ["a", null, null, null], "front": 1, "rear": 2, "size": 1, "line": 5, "err": false, "cell": 1, "msg": "1. enqueue(a) → T[1] = a; rear = 2; front = 1, rear = 2, méret = 1"}, {"T": ["a", "b", null, null], "front": 1, "rear": 3, "size": 2, "line": 5, "err": false, "cell": 2, "msg": "2. enqueue(b) → T[2] = b; rear = 3; front = 1, rear = 3, méret = 2"}, {"T": ["a", "b", "c", null], "front": 1, "rear": 4, "size": 3, "line": 5, "err": false, "cell": 3, "msg": "3. enqueue(c) → T[3] = c; rear = 4; front = 1, rear = 4, méret = 3"}, {"T": [null, "b", "c", null], "front": 2, "rear": 4, "size": 2, "line": 12, "err": false, "cell": 1, "msg": "4. dequeue() → a (T[1] ürítve); front = 2; front = 2, rear = 4, méret = 2"}, {"T": [null, null, "c", null], "front": 3, "rear": 4, "size": 1, "line": 12, "err": false, "cell": 2, "msg": "5. dequeue() → b (T[2] ürítve); front = 3; front = 3, rear = 4, méret = 1"}, {"T": [null, null, "c", "d"], "front": 3, "rear": 1, "size": 2, "line": 5, "err": false, "cell": 4, "msg": "6. enqueue(d) → T[4] = d; rear = 1; front = 3, rear = 1, méret = 2"}, {"T": ["e", null, "c", "d"], "front": 3, "rear": 2, "size": 3, "line": 5, "err": false, "cell": 1, "msg": "7. enqueue(e) → T[1] = e; rear = 2; front = 3, rear = 2, méret = 3"}, {"T": ["e", "f", "c", "d"], "front": 3, "rear": 3, "size": 4, "line": 5, "err": false, "cell": 2, "msg": "8. enqueue(f) → T[2] = f; rear = 3; front = 3, rear = 3, méret = 4  – TELE: front = rear, csak a méret különbözteti meg az üres sortól"}, {"T": ["e", "f", null, "d"], "front": 4, "rear": 3, "size": 3, "line": 12, "err": false, "cell": 3, "msg": "9. dequeue() → c (T[3] ürítve); front = 4; front = 4, rear = 3, méret = 3"}, {"T": ["e", "f", null, null], "front": 1, "rear": 3, "size": 2, "line": 12, "err": false, "cell": 4, "msg": "10. dequeue() → d (T[4] ürítve); front = 1; front = 1, rear = 3, méret = 2"}, {"T": [null, "f", null, null], "front": 2, "rear": 3, "size": 1, "line": 12, "err": false, "cell": 1, "msg": "11. dequeue() → e (T[1] ürítve); front = 2; front = 2, rear = 3, méret = 1"}, {"T": [null, null, null, null], "front": 3, "rear": 3, "size": 0, "line": 12, "err": false, "cell": 2, "msg": "12. dequeue() → f (T[2] ürítve); front = 3; front = 3, rear = 3, méret = 0  – ÜRES: front = rear"}];
const CODE = ["sor: T[1..n], front_index = 1, rear_index = 1, méret = 0", "enqueue(x):", "    ha méret == n: hiba \"sor tele\"", "    T[rear_index] := x", "    rear_index := (rear_index mod n) + 1", "    méret := méret + 1", "dequeue():", "    ha méret == 0: hiba \"sor üres\"", "    x := T[front_index]", "    T[front_index] := ÜRES", "    front_index := (front_index mod n) + 1", "    méret := méret - 1", "    vissza x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR_N = 4, CUR_OPS = [['enq', 'a'], ['enq', 'b'], ['enq', 'c'], ['deq', null], ['deq', null], ['enq', 'd'], ['enq', 'e'], ['enq', 'f'], ['deq', null], ['deq', null], ['deq', null], ['deq', null]];
function render(s){
  svg.innerHTML = "";
  const n = s.T.length, cx = 120, cy = 140, R = 95, r0 = 42;
  for (let i = 0; i < n; i++) {
    const a1 = (90 - i*360/n) * Math.PI/180, a0 = (90 - (i+1)*360/n) * Math.PI/180;
    const P = (r, a) => [cx + r*Math.cos(a), cy - r*Math.sin(a)];
    const [x1,y1] = P(R,a0), [x2,y2] = P(R,a1), [x3,y3] = P(r0,a1), [x4,y4] = P(r0,a0);
    const big = 360/n > 180 ? 1 : 0, v = s.T[i];
    el("path", {d:`M${x1},${y1} A${R},${R} 0 ${big} 0 ${x2},${y2} L${x3},${y3} A${r0},${r0} 0 ${big} 1 ${x4},${y4} Z`,
      fill: v ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": (s.cell === i+1) ? 3.5 : 1.2});
    const am = (a0 + a1)/2, [tx,ty] = P((R+r0)/2, am), [ix,iy] = P(R+13, am);
    if (v) el("text", {x: tx, y: ty+6, "text-anchor":"middle", "font-size":18, "font-weight":"bold"}, v);
    el("text", {x: ix, y: iy+4, "text-anchor":"middle", "font-size":11, fill: css("--muted")}, String(i+1));
  }
  // tömb
  const w = Math.min(44, 300/n), x0 = 250, y0 = 95;
  for (let i = 0; i < n; i++) {
    const v = s.T[i];
    el("rect", {x: x0+i*w, y: y0, width: w, height: w, fill: v ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": (s.cell === i+1) ? 3.5 : 1.2});
    if (v) el("text", {x: x0+i*w+w/2, y: y0+w/2+6, "text-anchor":"middle", "font-size":18, "font-weight":"bold"}, v);
    el("text", {x: x0+i*w+w/2, y: y0-6, "text-anchor":"middle", "font-size":11, fill: css("--muted")}, String(i+1));
  }
  const fx = x0+(s.front-1)*w+w/2, rx = x0+(s.rear-1)*w+w/2, same = s.front === s.rear ? 9 : 0;
  el("path", {d:`M${fx-same},${y0+w+6} l-7,13 l14,0 Z`, fill: css("--fg")});
  el("text", {x: fx-same, y: y0+w+34, "text-anchor":"middle", "font-size":12}, "F");
  el("circle", {cx: rx+same, cy: y0+w+13, r: 6, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: rx+same, y: y0+w+34, "text-anchor":"middle", "font-size":12}, "R");
  el("text", {x: x0, y: 210, "font-size":15}, `front = ${s.front}, rear = ${s.rear}, méret = ${s.size}`);
  const ok = s.rear === ((s.front - 1 + s.size) % n) + 1;
  el("text", {x: x0, y: 236, "font-size":12.5}, `rear = ((front − 1 + méret) mod n) + 1 : ${ok ? "igaz" : "HAMIS"}`);
  if (s.err) {
    el("rect", {x: 246, y: 248, width: 300, height: 34, fill: "none", stroke: "#c00000", "stroke-width": 3});
    el("text", {x: 256, y: 270, "font-size":13, "font-weight":"bold"}, "HIBA: " + (s.line === 2 ? "sor tele" : "sor üres") + " – nincs változás");
  }
  el("text", {x: 10, y: 290, "font-size":11, fill: css("--muted")}, "szürke = foglalt · fehér = ÜRES · ▲ F = front_index · ○ R = rear_index");
}
function trace(n, ops){
  const T = new Array(n).fill(null); let front = 1, rear = 1, size = 0;
  const st = [{T: T.slice(), front, rear, size, line: 0, err: false, cell: null, msg: `Kezdetben üres: front = 1, rear = 1, méret = 0 (front = rear!)`}];
  ops.forEach(([op, x], j) => {
    const k = j + 1; let msg, line, cell;
    if (op === "enq") {
      if (size === n) { st.push({T: T.slice(), front, rear, size, line: 2, err: true, cell: null, msg: `${k}. enqueue(${x}): HIBA – „sor tele” (méret = n = ${n}); az állapot nem változik`}); return; }
      T[rear-1] = x; cell = rear; rear = (rear % n) + 1; size++; line = 5;
      msg = `${k}. enqueue(${x}) → T[${cell}] = ${x}; rear = ${rear}`;
    } else {
      if (size === 0) { st.push({T: T.slice(), front, rear, size, line: 7, err: true, cell: null, msg: `${k}. dequeue(): HIBA – „sor üres” (méret = 0); az állapot nem változik`}); return; }
      const v = T[front-1]; T[front-1] = null; cell = front; front = (front % n) + 1; size--; line = 12;
      msg = `${k}. dequeue() → ${v} (T[${cell}] ürítve); front = ${front}`;
    }
    msg += `; front = ${front}, rear = ${rear}, méret = ${size}`;
    if (size === n) msg += "  – TELE: front = rear, csak a méret különbözteti meg az üres sortól";
    else if (size === 0) msg += "  – ÜRES: front = rear";
    st.push({T: T.slice(), front, rear, size, line, err: false, cell, msg});
  });
  return st;
}
let nextLetter = 0;
function opsText(){ document.getElementById("ops").textContent = CUR_OPS.length ? CUR_OPS.map(([o,x]) => o === "enq" ? `enq(${x})` : "deq").join(", ") : "(üres)"; }
function addOp(op){
  if (CUR_OPS.length >= 30) return;
  let x = null;
  if (op === "enq") { x = document.getElementById("val").value.trim() || String.fromCharCode(97 + (nextLetter++ % 26)); document.getElementById("val").value = ""; }
  CUR_OPS.push([op, x === null ? null : x.slice(0, 3)]); opsText(); const S = trace(CUR_N, CUR_OPS); setSteps(S); show(S.length - 1);
}
function resetOps(book){
  CUR_N = book ? 4 : +document.getElementById("n").value; if (book) document.getElementById("n").value = "4";
  CUR_OPS = book ? [['enq', 'a'], ['enq', 'b'], ['enq', 'c'], ['deq', null], ['deq', null], ['enq', 'd'], ['enq', 'e'], ['enq', 'f'], ['deq', null], ['deq', null], ['deq', null], ['deq', null]] : []; nextLetter = 0; opsText(); setSteps(trace(CUR_N, CUR_OPS));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
