<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trie: keresés, beszúrás, törlés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szó: <input id="inp" value="cart" size="12" aria-label="Szó"></label><button onclick="run('keres')">Keres</button><label><input id="pref" type="checkbox"> prefix (starts_with)</label><button onclick="run('beszur')">Beszúr</button><button onclick="run('torol')">Töröl</button><button onclick="resetT()">Alaphelyzet</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A car, cat, cart, dog, do kulcsok trie-ja; a gyökérből c és d ág indul, 5 terminál csúcs, összesen 9 csúcs."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 11.1 BESZÚR / KERES / TÖRÖL-RÉSZ pszeudokódja. A műveletek egymás után ugyanazon a trie-n hatnak (pl. a „cart” törlésekor csak a t csúcs tűnik el, a car terminál marad). Kezdőállapot: a könyv trie-ja, utána a KERES("do") lépései.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": ["", false, [["c", ["c", false, [["a", ["ca", false, [["r", ["car", true, [["t", ["cart", true, []]]]]], ["t", ["cat", true, []]]]]]]]], ["d", ["d", false, [["o", ["do", true, [["g", ["dog", true, []]]]]]]]]]], "path": [], "cur": null, "line": -1, "msg": "A car, cat, cart, dog, do trie-ja: 9 csúcs (a gyökérrel), 5 terminál"}, {"tree": ["", false, [["c", ["c", false, [["a", ["ca", false, [["r", ["car", true, [["t", ["cart", true, []]]]]], ["t", ["cat", true, []]]]]]]]], ["d", ["d", false, [["o", ["do", true, [["g", ["dog", true, []]]]]]]]]]], "path": [""], "cur": "", "line": 5, "msg": "KERES(\"do\"): u = gyökér"}, {"tree": ["", false, [["c", ["c", false, [["a", ["ca", false, [["r", ["car", true, [["t", ["cart", true, []]]]]], ["t", ["cat", true, []]]]]]]]], ["d", ["d", false, [["o", ["do", true, [["g", ["dog", true, []]]]]]]]]]], "path": ["", "d"], "cur": "d", "line": 7, "msg": "i = 1: 'd' → u = „d”"}, {"tree": ["", false, [["c", ["c", false, [["a", ["ca", false, [["r", ["car", true, [["t", ["cart", true, []]]]]], ["t", ["cat", true, []]]]]]]]], ["d", ["d", false, [["o", ["do", true, [["g", ["dog", true, []]]]]]]]]]], "path": ["", "d", "do"], "cur": "do", "line": 7, "msg": "i = 2: 'o' → u = „do”"}, {"tree": ["", false, [["c", ["c", false, [["a", ["ca", false, [["r", ["car", true, [["t", ["cart", true, []]]]]], ["t", ["cat", true, []]]]]]]]], ["d", ["d", false, [["o", ["do", true, [["g", ["dog", true, []]]]]]]]]]], "path": ["", "d", "do"], "cur": "do", "line": 8, "msg": "vége: return IGAZ (terminál)"}];
const CODE = ["BESZÚR(T, s): u = T.gyökér", "  for i = 1 to |s|: c = s[i]", "      if c not in u.gyerekek: u.gyerekek[c] = ÚJ-CSÚCS()", "      u = u.gyerekek[c]", "  u.terminál = IGAZ", "KERES(T, s): u = T.gyökér", "  for i = 1 to |s|: if s[i] not in u.gyerekek: return HAMIS", "      u = u.gyerekek[s[i]]", "  return u.terminál   (starts_with: return IGAZ)", "TÖRÖL-RÉSZ(u, s, i):", "  if i > |s|: if not u.terminál: return HAMIS, HAMIS", "              u.terminál = HAMIS; return IGAZ, (u.gyerekek üres)", "  if s[i] not in u.gyerekek: return HAMIS, HAMIS", "  talált, törölhető = TÖRÖL-RÉSZ(u.gyerekek[s[i]], s, i + 1)", "  if törölhető: töröljük u.gyerekek[s[i]]-t", "  return talált, törölhető and not u.terminál and u.gyerekek üres"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TRIE = null;
function mk(){ return {ch: {}, term: false}; }
function build(keys){ const T = mk(); for (const k of keys) { let u = T; for (const c of k) { if (!u.ch[c]) u.ch[c] = mk(); u = u.ch[c]; } u.term = true; } return T; }
function snap(T){ const rec = (u, p) => [p, u.term, Object.keys(u.ch).sort().map(c => [c, rec(u.ch[c], p + c)])]; return rec(T, ""); }
function cnt(s){ return 1 + s[2].reduce((a, [, c]) => a + cnt(c), 0); }
function terms(s){ return (s[1] ? 1 : 0) + s[2].reduce((a, [, c]) => a + terms(c), 0); }
const show_ = p => p === "" ? "gyökér" : "„" + p + "”";
function opSteps(op, s){
  const st = [], path = [""]; let u = TRIE, p = "";
  const push = (line, msg, extra) => st.push(Object.assign({tree: snap(TRIE), path: path.slice(), cur: p, line, msg}, extra || {}));
  if (op === "keres" || op === "prefix") {
    const nm = op === "keres" ? "KERES" : "starts_with";
    push(5, `${nm}("${s}"): u = gyökér`);
    for (let i = 0; i < s.length; i++) { const c = s[i];
      if (!u.ch[c]) { push(6, `i = ${i + 1}: '${c}' nincs a(z) ${show_(p)} gyermekei között → return HAMIS`); return st; }
      u = u.ch[c]; p += c; path.push(p); push(7, `i = ${i + 1}: '${c}' → u = ${show_(p)}`); }
    if (op === "prefix") push(8, s === "" ? `üres prefix: return ${Object.keys(TRIE.ch).length || TRIE.term ? "IGAZ" : "HAMIS"}` : "vége: return IGAZ (az út létezik; a takarítás miatt van alatta kulcs)");
    else push(8, `vége: return ${u.term ? "IGAZ (terminál)" : "HAMIS (nem terminál)"}`);
  } else if (op === "beszur") {
    push(0, `BESZÚR("${s}"): u = gyökér`);
    for (let i = 0; i < s.length; i++) { const c = s[i], nw = !u.ch[c];
      if (nw) u.ch[c] = mk(); u = u.ch[c]; p += c; path.push(p);
      push(nw ? 2 : 3, `i = ${i + 1}: '${c}' ` + (nw ? `nem volt gyermek → ÚJ-CSÚCS ${show_(p)}` : `már létezik → u = ${show_(p)}`), {fresh: nw ? p : null}); }
    const was = u.term; u.term = true; push(4, `u.terminál = IGAZ` + (was ? " (már kulcs volt)" : ` → ${show_(p)} kulcs lett`) + ` · csúcsok: ${cnt(snap(TRIE))}`);
  } else if (op === "torol") {
    const chain = [TRIE]; push(9, `TÖRÖL-RÉSZ(gyökér, "${s}", 1)`);
    for (let i = 0; i < s.length; i++) { const c = s[i];
      if (!u.ch[c]) { push(12, `i = ${i + 1}: '${c}' nincs → return HAMIS, HAMIS (a trie változatlan)`); return st; }
      u = u.ch[c]; p += c; path.push(p); chain.push(u); push(13, `i = ${i + 1}: rekurzió → ${show_(p)}`); }
    if (!u.term) { push(10, `i > |s|: ${show_(p)} nem terminál → return HAMIS, HAMIS (nem volt kulcs)`); return st; }
    u.term = false; let del = Object.keys(u.ch).length === 0;
    push(11, `i > |s|: ${show_(p)} terminál jelzése törölve; törölhető = ${del ? "IGAZ (nincs gyermeke)" : "HAMIS (van gyermeke)"}`);
    if (!del) { push(15, `${show_(p)} megmarad (van gyermeke) → nincs takarítás · csúcsok: ${cnt(snap(TRIE))}`); return st; }
    for (let i = s.length - 1; i >= 0; i--) { const par = chain[i], c = s[i], pp = s.slice(0, i);
      if (del) { delete par.ch[c]; p = pp; path.pop(); push(14, `törölhető → a(z) „${pp + c}” csúcs törölve ${show_(pp)} alól`); }
      del = del && !par.term && Object.keys(par.ch).length === 0 && i > 0;
      if (!del) { p = pp; push(15, `${show_(pp)}: ` + (par.term ? "terminál, megmarad" : Object.keys(par.ch).length ? "van más gyermeke, megmarad" : "gyökér, megmarad") + ` → a takarítás leáll · csúcsok: ${cnt(snap(TRIE))}`); break; }
    }
  }
  return st;
}
function lay(s){ const pos = {}; let nx = 0;
  const walk = (n, d) => { if (!n[2].length) { pos[n[0]] = [nx++, d]; return; } n[2].forEach(([, c]) => walk(c, d + 1));
    const xs = n[2].map(([, c]) => pos[c[0]][0]); pos[n[0]] = [(Math.min(...xs) + Math.max(...xs)) / 2, d]; };
  walk(s, 0); return [pos, nx]; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const [pos, nx] = lay(s.tree), D = Math.max(...Object.values(pos).map(p => p[1]), 1);
  const dx = Math.min(80, 500 / Math.max(1, nx - 1)), X = p => 280 - (nx - 1) * dx / 2 + pos[p][0] * dx, dy = Math.min(62, 250 / D), Y = p => 28 + pos[p][1] * dy;
  const onPath = new Set(s.path);
  const edges = n => { for (const [c, ch] of n[2]) { const on = onPath.has(ch[0]) && onPath.has(n[0]);
      el("line", {x1: X(n[0]), y1: Y(n[0]), x2: X(ch[0]), y2: Y(ch[0]), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 4 : 1.4});
      const left = X(ch[0]) <= X(n[0]); el("text", {x: (X(n[0]) + X(ch[0])) / 2 + (left ? -6 : 6), y: (Y(n[0]) + Y(ch[0])) / 2 + 4, "text-anchor": left ? "end" : "start", "font-size": 14, "font-style": "italic", "font-weight": "bold"}, c);
      edges(ch); } };
  edges(s.tree);
  const nodes = n => { const x = X(n[0]), y = Y(n[0]), cur = n[0] === s.cur;
      el("circle", {cx: x, cy: y, r: 18, fill: cur ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3.5 : 1.4});
      if (n[1]) el("circle", {cx: x, cy: y, r: 13, fill: "none", stroke: css("--line"), "stroke-width": 1.4});
      el("text", {x, y: y + 4, "text-anchor": "middle", "font-size": n[0].length > 3 ? 9 : 11}, n[0] || "ε");
      n[2].forEach(([, c]) => nodes(c)); };
  nodes(s.tree);
  el("text", {x: 10, y: 322, "font-size": 12}, `csúcsok: ${cnt(s.tree)} · terminál: ${terms(s.tree)} · dupla kör = terminál · narancs = bejárt út`);
}
let KEYS = ["car", "cat", "cart", "dog", "do"];
function run(op){
  const msg = document.getElementById("err"), w = document.getElementById("inp").value.trim().toLowerCase();
  if (!/^[a-záéíóöőúüű]{0,12}$/.test(w) || (w === "" && op !== "prefix")) { msg.textContent = "1–12 kisbetűs betűt adjon meg."; return; }
  msg.textContent = ""; if (!TRIE) TRIE = build(KEYS);
  const st = opSteps(op === "keres" && document.getElementById("pref").checked ? "prefix" : op, w); setSteps(st);
}
function resetT(){ TRIE = build(KEYS); document.getElementById("err").textContent = "Visszaállítva a könyv trie-jára."; setSteps([{tree: snap(TRIE), path: [], cur: null, line: -1, msg: "A car, cat, cart, dog, do trie-ja: 9 csúcs (a gyökérrel), 5 terminál"}]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
