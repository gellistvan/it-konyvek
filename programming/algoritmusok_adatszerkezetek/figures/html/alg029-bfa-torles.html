<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-fa törlés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Fa: <input id="tree" value="[20 40] ([10] [30] [50 60])" size="30" aria-label="Fa szöveges formában"></label><label>törlendő: <input id="del" value="10, 40" size="6" aria-label="Törlendő kulcsok"></label><button onclick="load()">Betöltés</button><button onclick="load('[20 40] ([10] [30] [50 60])', [10, 40])">(1)+(2)</button><button onclick="load('[20] ([10 15] [25])', [25])">(3)</button><button onclick="load('[20] ([10] [25 30])', [10])">(4)</button><button onclick="load('[30] ([10] ([5] [15]) [40] ([35] [45]))', [40])">(5)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="B-fa törlés t = 2-vel: a 10 törlése összevonással, majd a 40 törlése előd felvitelével; további gombok a kölcsönzés balról, jobbról és a gyökérzsugorodás esetére."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 8.4.5 pszeudokódja, t = 2. Faformátum: „[kulcsok] (gyerek1 gyerek2 …)”, pl. [20] ([10 15] [25]). Kezdőállapot: a könyv példája (a 10, majd a 40 törlése).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": {"id": 1, "k": [20, 40], "c": [{"id": 2, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": -1, "msg": "Kiinduló fa (t = 2): [20 40] ([10] [30] [50 60])", "t": 2}, {"tree": {"id": 1, "k": [20, 40], "c": [{"id": 2, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 0, "msg": "B-FA-TOROL(10)", "t": 2, "cur": 1, "start": 10}, {"tree": {"id": 1, "k": [20, 40], "c": [{"id": 2, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 4, "msg": "[20 40]: i = 1, a(z) 1. gyerek [10] kulcsszáma 1 = t − 1 → előbb pótolni kell", "t": 2, "cur": 1, "child": 2}, {"tree": {"id": 1, "k": [40], "c": [{"id": 2, "k": [10, 20, 30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 13, "msg": "ÖSSZEVONÁS: a testvér is t − 1 kulcsos → [10 20 30] (a 20 lejött a szülőből)", "t": 2, "cur": 1, "mv": {"op": "összevonás", "x": 1, "y": 2, "z": 3, "down": 20, "merged": 2}}, {"tree": {"id": 1, "k": [40], "c": [{"id": 2, "k": [20, 30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 3, "msg": "levél: a 10 törlése → [20 30]", "t": 2, "cur": 2}, {"tree": {"id": 1, "k": [40], "c": [{"id": 2, "k": [20, 30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": -1, "msg": "Törlés(10) kész: [40] ([20 30] [50 60])", "t": 2, "done": 10}, {"tree": {"id": 1, "k": [40], "c": [{"id": 2, "k": [20, 30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 0, "msg": "B-FA-TOROL(40)", "t": 2, "cur": 1, "start": 40}, {"tree": {"id": 1, "k": [30], "c": [{"id": 2, "k": [20, 30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 6, "msg": "a 40 belső csomópontban (i = 1); a bal gyereknek 2 ≥ t kulcsa van → előd = 30 a helyére, majd törlés a bal részfából", "t": 2, "cur": 1, "mv": {"op": "előd", "up": 30}}, {"tree": {"id": 1, "k": [30], "c": [{"id": 2, "k": [20], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 3, "msg": "levél: a 30 törlése → [20]", "t": 2, "cur": 2}, {"tree": {"id": 1, "k": [30], "c": [{"id": 2, "k": [20], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": -1, "msg": "Törlés(40) kész: [30] ([20] [50 60])", "t": 2, "done": 40}];
const CODE = ["B-FA-TOROL(T, k): B-FA-TOROL-NEM-GYOKER(T.gyoker, k)", "    if T.gyoker.n == 0 és nem levél: T.gyoker = T.gyoker.gyerek[1]   // gyökérzsugorodás", "B-FA-TOROL-NEM-GYOKER(x, k):", "    if x.level: i keresése; ha k == x.kulcs[i]: kulcsok balra tolása, x.n = x.n − 1", "    else: i = 1; while i ≤ x.n és k > x.kulcs[i]: i = i + 1", "        if i ≤ x.n és k == x.kulcs[i]:          // k belső csomópontban", "            if x.gyerek[i].n ≥ t: pred = B-FA-MAX(x.gyerek[i]); x.kulcs[i] = pred; TOROL(x.gyerek[i], pred)", "            else if x.gyerek[i+1].n ≥ t: succ = B-FA-MIN(…); x.kulcs[i] = succ; TOROL(x.gyerek[i+1], succ)", "            else: B-FA-OSSZEVON(x, i); TOROL(x.gyerek[i], k)", "        else:                                     // k a gyerekben lehet", "            if x.gyerek[i].n == t − 1:", "                if i > 1 és x.gyerek[i−1].n ≥ t: B-FA-KOLCSONOZ-BALRA(x, i)", "                else if i ≤ x.n és x.gyerek[i+1].n ≥ t: B-FA-KOLCSONOZ-JOBBRA(x, i)", "                else: if i > 1: B-FA-OSSZEVON(x, i−1); i = i − 1  else: B-FA-OSSZEVON(x, i)", "            B-FA-TOROL-NEM-GYOKER(x.gyerek[i], k)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SRC = "[20 40] ([10] [30] [50 60])", DELS = [10, 40], TT = 2;
function parse(src){
  let cnt = 0; const toks = src.match(/\[[^\]]*\]|\(|\)/g) || []; let p = 0;
  const node = () => { if (p >= toks.length || toks[p][0] !== "[") throw "Hibás fa: „[kulcsok]” csomópontot vártam.";
    const ks = toks[p++].slice(1, -1).trim().split(/\s+/).filter(x => x !== "").map(Number);
    if (ks.some(x => !Number.isInteger(x))) throw "Csak egész kulcsok."; const n = {id: ++cnt, k: ks, c: []};
    if (p < toks.length && toks[p] === "(") { p++; while (p < toks.length && toks[p] !== ")") n.c.push(node()); if (p >= toks.length) throw "Hiányzó „)”."; p++; }
    return n; };
  const r = node(); if (p !== toks.length) throw "Fölösleges jelek a fa után."; return r;
}
const fmt = x => `[${x.k.join(" ")}]` + (x.c.length ? " (" + x.c.map(fmt).join(" ") + ")" : "");
const snap = x => ({id: x.id, k: x.k.slice(), c: x.c.map(snap)});
function run(src, dels, t){
  const holder = [parse(src)], st = [];
  const push = (line, msg, kw) => st.push(Object.assign({tree: snap(holder[0]), line, msg, t}, kw || {}));
  const S = a => a.join(" ");
  push(-1, `Kiinduló fa (t = ${t}): ${fmt(holder[0])}`);
  const kmax = x => { while (x.c.length) x = x.c[x.c.length-1]; return x.k[x.k.length-1]; };
  const kmin = x => { while (x.c.length) x = x.c[0]; return x.k[0]; };
  const bl = (x, i) => { const y = x.c[i], z = x.c[i-1], down = x.k[i-1], up = z.k[z.k.length-1]; y.k.unshift(down); if (y.c.length) y.c.unshift(z.c.pop()); x.k[i-1] = z.k.pop(); return {op: "kölcsönzés balról", x: x.id, y: y.id, z: z.id, down, up}; };
  const br = (x, i) => { const y = x.c[i], z = x.c[i+1], down = x.k[i], up = z.k[0]; y.k.push(down); x.k[i] = z.k.shift(); if (y.c.length) y.c.push(z.c.shift()); return {op: "kölcsönzés jobbról", x: x.id, y: y.id, z: z.id, down, up}; };
  const mg = (x, i) => { const y = x.c[i], z = x.c[i+1], down = x.k[i]; y.k = y.k.concat([down], z.k); y.c = y.c.concat(z.c); x.k.splice(i, 1); x.c.splice(i+1, 1); return {op: "összevonás", x: x.id, y: y.id, z: z.id, down, merged: y.id}; };
  const tor = (x, k) => {
    if (!x.c.length) { if (x.k.includes(k)) { x.k.splice(x.k.indexOf(k), 1); push(3, `levél: a ${k} törlése → [${S(x.k)}]`, {cur: x.id}); } else push(3, `levél: a ${k} nincs a fában – nincs teendő`, {cur: x.id}); return; }
    let i = 0; while (i < x.k.length && k > x.k[i]) i++;
    if (i < x.k.length && k === x.k[i]) {
      const y = x.c[i], z = x.c[i+1];
      if (y.k.length >= t) { const pred = kmax(y); x.k[i] = pred; push(6, `a ${k} belső csomópontban (i = ${i+1}); a bal gyereknek ${y.k.length} ≥ t kulcsa van → előd = ${pred} a helyére, majd törlés a bal részfából`, {cur: x.id, mv: {op: "előd", up: pred}}); tor(y, pred); }
      else if (z.k.length >= t) { const succ = kmin(z); x.k[i] = succ; push(7, `a ${k} belső csomópontban (i = ${i+1}); a jobb gyereknek ${z.k.length} ≥ t kulcsa van → utód = ${succ} a helyére`, {cur: x.id, mv: {op: "utód", up: succ}}); tor(z, succ); }
      else { const mv = mg(x, i); push(8, `a ${k} belső csomópontban (i = ${i+1}); mindkét gyerek t − 1 kulcsos → összevonás: [${S(y.k)}]`, {cur: x.id, mv}); tor(y, k); }
      return;
    }
    const ch = x.c[i];
    push(4, `[${S(x.k)}]: i = ${i+1}, a(z) ${i+1}. gyerek [${S(ch.k)}] kulcsszáma ${ch.k.length}` + (ch.k.length === t-1 ? " = t − 1 → előbb pótolni kell" : " ≥ t → továbbléphetünk"), {cur: x.id, child: ch.id});
    if (ch.k.length === t-1) {
      if (i > 0 && x.c[i-1].k.length >= t) { const mv = bl(x, i); push(11, `KÖLCSÖNZÉS BALRÓL: a ${mv.down} le a gyerekbe, a bal testvér ${mv.up}-a fel a szülőbe`, {cur: x.id, mv}); }
      else if (i < x.k.length && x.c[i+1].k.length >= t) { const mv = br(x, i); push(12, `KÖLCSÖNZÉS JOBBRÓL: a ${mv.down} le a gyerekbe, a jobb testvér ${mv.up}-a fel a szülőbe`, {cur: x.id, mv}); }
      else { let mv; if (i > 0) { mv = mg(x, i-1); i--; } else mv = mg(x, i);
        push(13, `ÖSSZEVONÁS: a testvér is t − 1 kulcsos → [${S(x.c[i].k)}] (a ${mv.down} lejött a szülőből)`, {cur: x.id, mv}); }
    }
    tor(x.c[i], k);
  };
  for (const k of dels) {
    push(0, `B-FA-TOROL(${k})`, {cur: holder[0].id, start: k});
    tor(holder[0], k);
    const r = holder[0];
    if (!r.k.length && r.c.length) { holder[0] = r.c[0]; push(1, `a gyökér kiürült → GYÖKÉRZSUGORODÁS: az új gyökér ${fmt(holder[0]).split(" (")[0]}, a magasság eggyel csökken`, {cur: holder[0].id, shrink: true}); }
    push(-1, `Törlés(${k}) kész: ${fmt(holder[0])}`, {done: k});
  }
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const t = s.t || TT, KWp = 34, KHp = 28, P = {}; let cur = 0;
  const rec = (x, d) => { const w = Math.max(1, x.k.length) * KWp; if (!x.c.length) { P[x.id] = [cur, d, x]; cur += w + 14; return cur - 14 - w/2; }
    const cs = x.c.map(c => rec(c, d + 1)), mid = (cs[0] + cs[cs.length-1]) / 2; P[x.id] = [mid - w/2, d, x]; return mid; };
  rec(s.tree, 0);
  const ox = Math.max(10, (560 - (cur - 14)) / 2), Y = d => 30 + d * 70, mv = s.mv || {};
  for (const id in P) { const [lx, d, x] = P[id]; x.c.forEach((c, j) => { const [cx, cd, cn] = P[c.id];
    el("line", {x1: ox + lx + j*KWp, y1: Y(d) + KHp, x2: ox + cx + Math.max(1, cn.k.length)*KWp/2, y2: Y(cd), stroke: css("--line"), "stroke-width": 1.2}); }); }
  for (const id in P) { const [lx, d, x] = P[id], isCur = +id === s.cur, poor = x.k.length === t - 1 && +id !== s.tree.id;
    if (!x.k.length) el("rect", {x: ox + lx, y: Y(d), width: KWp, height: KHp, fill: "none", stroke: css("--muted"), "stroke-dasharray": "4 3"});
    x.k.forEach((key, j) => {
      el("rect", {x: ox + lx + j*KWp, y: Y(d), width: KWp, height: KHp, fill: poor ? css("--cellhl") : css("--cell"), stroke: isCur ? css("--hl") : css("--line"), "stroke-width": key === mv.down || key === mv.up ? 4 : isCur ? 3 : 1.2});
      el("text", {x: ox + lx + j*KWp + KWp/2, y: Y(d) + 19, "text-anchor": "middle", "font-size": 14}, String(key)); });
    if (+id === mv.merged) el("rect", {x: ox + lx - 4, y: Y(d) - 4, width: x.k.length*KWp + 8, height: KHp + 8, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
    if (+id === s.child) el("text", {x: ox + lx + x.k.length*KWp/2, y: Y(d) + KHp + 16, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, `gyerek: ${x.k.length} kulcs`);
  }
  if (mv.op) el("text", {x: 10, y: 262, "font-size": 14, "font-weight": "bold"}, mv.op + (mv.down !== undefined ? ` – le: ${mv.down}` : "") + (mv.up !== undefined ? `, fel: ${mv.up}` : ""));
  el("text", {x: 10, y: 288, "font-size": 11, fill: css("--muted")}, "szürke = szűkölködő (t − 1 kulcs) · vastag keret = mozgó kulcs · dupla keret = összevont · kék = aktuális x");
}
function load(src, dels){
  const msg = document.getElementById("err");
  try {
    const s = src || document.getElementById("tree").value, d = dels || document.getElementById("del").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
    if (!d.length || d.some(x => !Number.isInteger(x))) throw "Adjon meg törlendő egész kulcso(ka)t.";
    const st = run(s, d, TT); if (src) { document.getElementById("tree").value = src; document.getElementById("del").value = dels.join(", "); }
    msg.textContent = ""; SRC = s; DELS = d; setSteps(st);
  } catch (e) { msg.textContent = String(e); }
}
const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
