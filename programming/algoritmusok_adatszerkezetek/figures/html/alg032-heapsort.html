<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heapsort lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb (legfeljebb 15 elem): <input id="inp" value="4, 10, 3, 5, 1" size="22" aria-label="Saját tömb"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A [4, 10, 3, 5, 1] tömb rendezése: kupacépítés után [10, 5, 3, 4, 1], majd a gyökér cseréi a farokba; a végén [1, 3, 4, 5, 10]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú HEAPSORT (9.3). Az invariáns pontjai az iteráció elején (süllyesztés után) teljesülnek; a csere és a süllyesztés közben az 1. pont átmenetileg sérül. Kezdőállapot: a könyv példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [4, 10, 3, 5, 1], "hs": 5, "i": null, "swap": null, "path": [], "line": 0, "row": true, "msg": "Kiinduló tömb, n = 5; még nem kupac", "inv": [false, true, true], "built": false}, {"a": [10, 5, 3, 4, 1], "hs": 5, "i": null, "swap": null, "path": [], "line": 2, "row": true, "msg": "BUILD-MAX-HEAP után: A[1..5] max-kupac, heap_size = 5, a farok üres", "inv": [true, true, true], "built": true}, {"a": [1, 5, 3, 4, 10], "hs": 4, "i": 5, "swap": [1, 5], "path": [], "line": 5, "row": true, "msg": "i = 5: csere A[1] ↔ A[5] (10 a farokba), heap_size = 4", "inv": [false, true, true], "built": true}, {"a": [5, 1, 3, 4, 10], "hs": 4, "i": 5, "swap": [1, 2], "path": [1, 2], "line": 6, "row": false, "sift": true, "msg": "i = 5: MAX-HEAPIFY(A, 1, 4) – csere A[1] ↔ A[2] → [5, 1, 3, 4 | 10]", "inv": [false, true, true], "built": true}, {"a": [5, 4, 3, 1, 10], "hs": 4, "i": 5, "swap": [2, 4], "path": [1, 2, 4], "line": 6, "row": true, "sift": true, "msg": "i = 5: MAX-HEAPIFY(A, 1, 4) – csere A[2] ↔ A[4] → [5, 4, 3, 1 | 10]", "inv": [true, true, true], "built": true}, {"a": [1, 4, 3, 5, 10], "hs": 3, "i": 4, "swap": [1, 4], "path": [], "line": 5, "row": true, "msg": "i = 4: csere A[1] ↔ A[4] (5 a farokba), heap_size = 3", "inv": [false, true, true], "built": true}, {"a": [4, 1, 3, 5, 10], "hs": 3, "i": 4, "swap": [1, 2], "path": [1, 2], "line": 6, "row": true, "sift": true, "msg": "i = 4: MAX-HEAPIFY(A, 1, 3) – csere A[1] ↔ A[2] → [4, 1, 3 | 5, 10]", "inv": [true, true, true], "built": true}, {"a": [3, 1, 4, 5, 10], "hs": 2, "i": 3, "swap": [1, 3], "path": [], "line": 5, "row": true, "msg": "i = 3: csere A[1] ↔ A[3] (4 a farokba), heap_size = 2", "inv": [true, true, true], "built": true}, {"a": [3, 1, 4, 5, 10], "hs": 2, "i": 3, "swap": null, "path": [1], "line": 6, "row": true, "sift": true, "msg": "i = 3: MAX-HEAPIFY(A, 1, 2) – nincs csere", "inv": [true, true, true], "built": true}, {"a": [1, 3, 4, 5, 10], "hs": 1, "i": 2, "swap": [1, 2], "path": [], "line": 5, "row": true, "msg": "i = 2: csere A[1] ↔ A[2] (3 a farokba), heap_size = 1", "inv": [true, true, true], "built": true}, {"a": [1, 3, 4, 5, 10], "hs": 1, "i": 2, "swap": null, "path": [1], "line": 6, "row": true, "sift": true, "msg": "i = 2: MAX-HEAPIFY(A, 1, 1) – nincs csere", "inv": [true, true, true], "built": true}, {"a": [1, 3, 4, 5, 10], "hs": 1, "i": null, "swap": null, "path": [], "line": 3, "row": false, "msg": "Vége (i = 1): [1, 3, 4, 5, 10] nemcsökkenő sorrendben", "inv": [true, true, true], "built": true}];
const CODE = ["HEAPSORT(A)", "  BUILD-MAX-HEAP(A)", "  heap_size = n", "  for i = n downto 2:", "      csere A[1] <-> A[i]", "      heap_size = heap_size - 1", "      MAX-HEAPIFY(A, 1, heap_size)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function heapsort(a0){
  const a = a0.slice(), n = a.length, st = [];
  const sift = (i, hs, cb) => { while (true) { const l = 2*i, r = 2*i + 1; let lg = i;
    if (l <= hs && a[l-1] > a[lg-1]) lg = l; if (r <= hs && a[r-1] > a[lg-1]) lg = r;
    if (lg === i) return; [a[i-1], a[lg-1]] = [a[lg-1], a[i-1]]; if (cb) cb(i, lg); i = lg; } };
  st.push({a: a.slice(), hs: n, i: null, swap: null, path: [], line: 0, built: false, msg: `Kiinduló tömb, n = ${n}; még nem kupac`});
  for (let i = Math.floor(n/2); i >= 1; i--) sift(i, n);
  st.push({a: a.slice(), hs: n, i: null, swap: null, path: [], line: 2, built: true, msg: `BUILD-MAX-HEAP után: A[1..${n}] max-kupac, heap_size = ${n}, a farok üres`});
  let hs = n;
  for (let i = n; i >= 2; i--) {
    [a[0], a[i-1]] = [a[i-1], a[0]]; hs--;
    st.push({a: a.slice(), hs, i, swap: [1, i], path: [], line: 5, built: true, msg: `i = ${i}: csere A[1] ↔ A[${i}] (${a[i-1]} a farokba), heap_size = ${hs}`});
    const path = [1];
    sift(1, hs, (p, c) => { path.push(c); st.push({a: a.slice(), hs, i, swap: [p, c], path: path.slice(), line: 6, built: true, sift: true,
      msg: `i = ${i}: MAX-HEAPIFY(A, 1, ${hs}) – csere A[${p}] ↔ A[${c}] → [${a.slice(0, hs).join(", ")} | ${a.slice(hs).join(", ")}]`}); });
    if (path.length === 1) st.push({a: a.slice(), hs, i, swap: null, path: [1], line: 6, built: true, sift: true, msg: `i = ${i}: MAX-HEAPIFY(A, 1, ${hs}) – nincs csere`});
  }
  st.push({a: a.slice(), hs: 1, i: null, swap: null, path: [], line: 3, built: true, msg: `Vége (i = 1): [${a.join(", ")}] nemcsökkenő sorrendben`});
  return st;
}
function inv(a, hs){
  const p1 = a.slice(0, hs).every((_, j) => j === 0 || a[Math.floor((j+1)/2) - 1] >= a[j]);
  const tail = a.slice(hs), srt = a.slice().sort((x, y) => x - y).slice(hs);
  const p2 = tail.every((x, j) => j === 0 || tail[j-1] <= x) && tail.every((x, j) => x === srt[j]);
  const p3 = !tail.length || !hs || Math.max(...a.slice(0, hs)) <= Math.min(...tail);
  return [p1, p2, p3];
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const a = s.a, n = a.length, hs = s.built ? s.hs : n, w = Math.min(46, 500 / n), x0 = 280 - n * w / 2, ay = 200;
  el("defs", {}).innerHTML = `<pattern id="tp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.2"/></pattern>`;
  const D = Math.max(1, Math.floor(Math.log2(Math.max(1, hs)))), dy = Math.min(48, 130 / D);
  const P = v => { const d = Math.floor(Math.log2(v)), k = v - 2 ** d; return [60 + (k + 0.5) * 440 / 2 ** d, 24 + d * dy]; };
  for (let c = 2; c <= hs; c++) { const [xa, ya] = P(Math.floor(c/2)), [xb, yb] = P(c), on = s.sift && s.path.includes(c);
    el("line", {x1: xa, y1: ya, x2: xb, y2: yb, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3.5 : 1.2, "stroke-dasharray": on ? "7 4" : "none"}); }
  for (let v = 1; v <= hs; v++) { const [x, y] = P(v), sw = s.swap && s.sift && s.swap.includes(v);
    el("circle", {cx: x, cy: y, r: 15, fill: sw ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": sw ? 3 : 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, String(a[v-1])); }
  for (let v = 1; v <= n; v++) {
    const x = x0 + (v - 1) * w, tail = s.built && v > hs, sw = s.swap && s.swap.includes(v);
    el("rect", {x, y: ay, width: w, height: w, fill: css("--cell"), stroke: css("--line"), "stroke-width": sw ? 3.5 : 1.2});
    if (tail) el("rect", {x, y: ay, width: w, height: w, fill: "url(#tp)", stroke: "none"});
    el("text", {x: x + w/2, y: ay + w/2 + 5, "text-anchor": "middle", "font-size": 15, "font-weight": tail ? "bold" : "normal"}, String(a[v-1]));
    el("text", {x: x + w/2, y: ay + w + 13, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(v));
  }
  if (s.built) { const xs = x0 + hs * w; el("line", {x1: xs, y1: ay - 8, x2: xs, y2: ay + w + 8, stroke: css("--hl"), "stroke-width": 4}); }
  if (s.swap && !s.sift) { const xa = x0 + (s.swap[0] - 0.5) * w, xb = x0 + (s.swap[1] - 0.5) * w;
    el("path", {d: `M${xa},${ay-4} Q${(xa+xb)/2},${ay-40} ${xb},${ay-4}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
    el("text", {x: (xa+xb)/2, y: ay - 26, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, "⇄"); }
  el("text", {x: 4, y: 286, "font-size": 13, "font-weight": "bold"}, `heap_size = ${s.built ? hs : "–"}` + (s.i ? `, i = ${s.i}` : ""));
  if (s.built) { const I = inv(a, hs), t = ["1. A[1..heap_size] max-kupac", "2. a farok a legnagyobb elemek, rendezve", "3. kupac ≤ farok"];
    t.forEach((x, j) => el("text", {x: 210 + (j === 2 ? 0 : 0), y: 274 + j * 16, "font-size": 12, fill: I[j] ? css("--fg") : css("--hl2")}, (I[j] ? "✓ " : "✗ ") + x + (I[j] ? " – teljesül" : " – sérül")));
  }
  el("text", {x: 4, y: 324, "font-size": 11, fill: css("--muted")}, "vonalkázott = rendezett farok · kék vonal = határ · narancs = csere / süllyesztés útja");
}
function load(){
  const msg = document.getElementById("err");
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (a.length < 1 || a.length > 15 || a.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–15 egész számot adjon meg."; return; }
  msg.textContent = ""; setSteps(heapsort(a));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
