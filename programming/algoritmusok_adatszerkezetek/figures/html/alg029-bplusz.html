<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B+-fa tartománykeresés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = <input id="ra" type="number" value="5" style="width:4em" aria-label="Tartomány alsó vége"></label><label>b = <input id="rb" type="number" value="15" style="width:4em" aria-label="Tartomány felső vége"></label><label><input id="cmp" type="checkbox"> összehasonlítás: B-fa inorder bejárással</label><button onclick="load()">Keresés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="B+-fa [7 13] gyökérrel és három láncolt levéllel; az [5, 15] tartománykeresés a gyökérből az első levélbe lép, majd a láncon halad, 4 blokkolvasással 6 találatot ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">t = 3 B+-fa a 8.4.6 példájából. A B-fa összehasonlításban ugyanezek a kulcsok egyszer szerepelnek (gyökér [7 13], levelek [1 3 5], [9 11], [15 17]); gyorsítótár nélküli blokkolvasás-számlálás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "R", "reads": 1, "hits": [], "line": 1, "msg": "a gyökér [7 13] beolvasása (olvasás: 1)"}, {"node": "L0", "reads": 2, "hits": [], "line": 4, "msg": "5 → 1. gyerek (a < 7): a(z) 1. levél [1 3 5] beolvasása (olvasás: 2)"}, {"node": "L0", "reads": 2, "hits": [5], "line": 5, "cur": 5, "msg": "KIÍR(5)"}, {"node": "L1", "reads": 3, "hits": [5], "line": 6, "msg": "a levéllánc következő eleme: [7 9 11] beolvasása (olvasás: 3)"}, {"node": "L1", "reads": 3, "hits": [5, 7], "line": 5, "cur": 7, "msg": "KIÍR(7)"}, {"node": "L1", "reads": 3, "hits": [5, 7, 9], "line": 5, "cur": 9, "msg": "KIÍR(9)"}, {"node": "L1", "reads": 3, "hits": [5, 7, 9, 11], "line": 5, "cur": 11, "msg": "KIÍR(11)"}, {"node": "L2", "reads": 4, "hits": [5, 7, 9, 11], "line": 6, "msg": "a levéllánc következő eleme: [13 15 17] beolvasása (olvasás: 4)"}, {"node": "L2", "reads": 4, "hits": [5, 7, 9, 11, 13], "line": 5, "cur": 13, "msg": "KIÍR(13)"}, {"node": "L2", "reads": 4, "hits": [5, 7, 9, 11, 13, 15], "line": 5, "cur": 15, "msg": "KIÍR(15)"}, {"node": "L2", "reads": 4, "hits": [5, 7, 9, 11, 13, 15], "line": 5, "stop": 17, "msg": "17 > 15 → megállunk. Találatok: 5, 7, 9, 11, 13, 15; 4 blokkolvasás"}];
const CODE = ["B+-TARTOMÁNY(T, a, b):", "    x = T.gyoker                          // 1 blokkolvasás", "    while nem x.level:", "        i = 1 + |{ j : x.kulcs[j] ≤ a }|  // c_i: k_(i−1) ≤ kulcs < k_i", "        x = x.gyerek[i]                   // + 1 blokkolvasás", "    for minden k ∈ x, a ≤ k:  ha k > b: return;  KIÍR(k)", "    x = x.következő (levéllánc), ha NIL: return   // + 1 blokkolvasás", "B-fa inorder tartománybejárás: a belső csúcsot minden kulcsa előtt/után újra olvassuk"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let A = 5, Bb = 15, MODE = "bplus";
const ROOT = [7, 13], LEAVES = [[1, 3, 5], [7, 9, 11], [13, 15, 17]], BLEAVES = [[1, 3, 5], [9, 11], [15, 17]];
function bplus(a, b){
  const st = []; let reads = 1; const hits = [];
  st.push({node: "R", reads, hits: [], line: 1, msg: `a gyökér [7 13] beolvasása (olvasás: ${reads})`});
  const i = ROOT.filter(k => k <= a).length; reads++;
  st.push({node: "L" + i, reads, hits: [], line: 4, msg: `${a} → ${i+1}. gyerek (` + (i === 0 ? "a < 7" : `${ROOT[i-1]} ≤ a` + (i < ROOT.length ? ` < ${ROOT[i]}` : "")) + `): a(z) ${i+1}. levél [${LEAVES[i].join(" ")}] beolvasása (olvasás: ${reads})`});
  let li = i;
  while (true) {
    for (const k of LEAVES[li]) { if (k < a) continue;
      if (k > b) { st.push({node: "L" + li, reads, hits: hits.slice(), line: 5, stop: k, msg: `${k} > ${b} → megállunk. Találatok: ${hits.join(", ")}; ${reads} blokkolvasás`}); return st; }
      hits.push(k); st.push({node: "L" + li, reads, hits: hits.slice(), line: 5, cur: k, msg: `KIÍR(${k})`}); }
    li++;
    if (li === LEAVES.length) { st.push({node: null, reads, hits: hits.slice(), line: 6, msg: `a levéllánc vége (NIL). Találatok: ${hits.join(", ") || "–"}; ${reads} blokkolvasás`}); return st; }
    reads++; st.push({node: "L" + li, reads, hits: hits.slice(), line: 6, msg: `a levéllánc következő eleme: [${LEAVES[li].join(" ")}] beolvasása (olvasás: ${reads})`});
  }
}
function binorder(a, b){
  // B-fa (gyökér [7 13], levelek [1 3 5], [9 11], [15 17]) inorder tartománybejárása; a gyökeret minden visszatéréskor újraolvassuk
  const st = []; let reads = 0; const hits = []; let stop = false, wasLeaf = false;
  const visitLeaf = li => { reads++; wasLeaf = true; st.push({node: "L" + li, reads, hits: hits.slice(), line: 7, msg: `B-fa: a(z) ${li+1}. levél [${BLEAVES[li].join(" ")}] beolvasása (olvasás: ${reads})`});
    for (const k of BLEAVES[li]) { if (k < a) continue; if (k > b) { stop = true; st.push({node: "L" + li, reads, hits: hits.slice(), line: 7, stop: k, msg: `B-fa: ${k} > ${b} → megállunk. Találatok: ${hits.join(", ")}; ${reads} blokkolvasás (a gyökér többször)`}); return; }
      hits.push(k); st.push({node: "L" + li, reads, hits: hits.slice(), line: 7, cur: k, msg: `B-fa: KIÍR(${k})`}); } };
  reads++; st.push({node: "R", reads, hits: [], line: 7, msg: `B-fa: a gyökér [7 13] beolvasása (olvasás: ${reads})`});
  for (let i = 0; i <= ROOT.length && !stop; i++) {
    const lo = i === 0 ? -Infinity : ROOT[i-1], hi = i < ROOT.length ? ROOT[i] : Infinity;
    if (hi > a && lo < b) visitLeaf(i);
    if (stop || i === ROOT.length) break;
    const k = ROOT[i]; if (k > b) { st.push({node: "R", reads, hits: hits.slice(), line: 7, stop: k, msg: `B-fa: ${k} > ${b} → megállunk; ${reads} blokkolvasás`}); stop = true; break; }
    if (wasLeaf) { wasLeaf = false; reads++; st.push({node: "R", reads, hits: hits.slice(), line: 7, msg: `B-fa: vissza a gyökérbe – újraolvasás (olvasás: ${reads})`}); }
    if (k >= a) { hits.push(k); st.push({node: "R", reads, hits: hits.slice(), line: 7, cur: k, msg: `B-fa: KIÍR(${k}) a gyökérből`}); }
  }
  if (!stop) st.push({node: null, reads, hits: hits.slice(), line: 7, msg: `B-fa: vége. Találatok: ${hits.join(", ") || "–"}; ${reads} blokkolvasás`});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const bt = MODE === "btree", leaves = bt ? BLEAVES : LEAVES, KWp = 34, KHp = 30, rx = 246, ry = 40, lx = [30, 210, 390], ly = 160;
  ROOT.forEach((k, j) => { const on = s.node === "R";
    el("rect", {x: rx + j*KWp, y: ry, width: KWp, height: KHp, fill: on ? css("--hl") : css("--cellhl"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: rx + j*KWp + KWp/2, y: ry + 20, "text-anchor": "middle", "font-size": 15, fill: on ? css("--bg") : css("--fg"), "text-decoration": bt && s.hits.includes(k) ? "underline" : ""}, String(k)); });
  el("text", {x: rx + KWp, y: ry - 8, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, bt ? "B-fa gyökér: valódi kulcsok" : "gyökér: irányítókulcsok");
  leaves.forEach((leaf, li) => {
    const on = s.node === "L" + li, w = leaf.length * KWp;
    el("line", {x1: rx + li*KWp, y1: ry + KHp, x2: lx[li] + w/2, y2: ly, stroke: css("--line"), "stroke-width": 1.2});
    leaf.forEach((k, j) => { const hit = s.hits.includes(k), cur = k === s.cur || k === s.stop;
      el("rect", {x: lx[li] + j*KWp, y: ly, width: KWp, height: KHp, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : on ? 2.5 : 1.2});
      el("text", {x: lx[li] + j*KWp + KWp/2, y: ly + 20, "text-anchor": "middle", "font-size": 15, "font-weight": hit ? "bold" : "normal", "text-decoration": hit ? "underline" : ""}, String(k)); });
    if (!bt && li < 2) el("path", {d: `M${lx[li] + w + 4},${ly + KHp/2} L${lx[li+1] - 6},${ly + KHp/2} m-8,-5 l8,5 l-8,5`, fill: "none", stroke: css("--line"), "stroke-dasharray": "5 3", "stroke-width": 1.4});
  });
  el("text", {x: 20, y: 240, "font-size": 15, "font-weight": "bold"}, `blokkolvasások: ${s.reads}   találatok: ${s.hits.length ? s.hits.join(", ") : "–"}`);
  el("text", {x: 20, y: 284, "font-size": 11, fill: css("--muted")}, bt ? "B-fa: a kulcsok egyszer szerepelnek, a gyökérbe minden levél után vissza kell térni (újraolvasás)" : "kiemelt = most olvasott csomópont · szaggatott = levéllánc · aláhúzott = találat");
}
function load(){
  const a = +document.getElementById("ra").value, b = +document.getElementById("rb").value, msg = document.getElementById("err");
  if (!Number.isFinite(a) || !Number.isFinite(b) || a > b) { msg.textContent = "a ≤ b legyen."; return; }
  msg.textContent = ""; A = a; Bb = b; MODE = document.getElementById("cmp").checked ? "btree" : "bplus"; setSteps(MODE === "btree" ? binorder(a, b) : bplus(a, b));
}
const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
