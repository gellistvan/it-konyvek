<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piros-fekete beszúrás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kulcsok: <input id="inp" value="10, 30, 20, 5" size="18" aria-label="Kulcssorozat"></label><button onclick="load()">Betöltés</button><button onclick="load([10,30,20,5])">(a)+(b): 10, 30, 20, 5</button><button onclick="load([10,20,30])">(c): 10, 20, 30</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Piros-fekete fa a 10, 30, 20, 5 beszúrásaival: 2. és 3. eset forgatással, majd az 5 után 1. eset átszínezéssel; a végén 20, 10 és 30 fekete, 5 piros."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A javított, tree-s rb_insert (8.3.8.1). Kezdőállapot: a 10, 30, 20, majd az 5 beszúrása.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"nodes": {"10": [null, null, "R"]}, "root": 10, "line": 1, "msg": "insert(10): PIROS csúcsként a BST-helyére (gyökér)", "z": 10, "par": null, "gp": null, "unc": null, "case": null, "props": [true, false, true, true, true], "bh": 1}, {"nodes": {"10": [null, null, "B"]}, "root": 10, "line": 12, "msg": "tree.root.color = BLACK (10 átszínezve)", "z": null, "par": null, "gp": null, "unc": null, "case": null, "props": [true, true, true, true, true], "bh": 1}, {"nodes": {"10": [null, 30, "B"], "30": [null, null, "R"]}, "root": 10, "line": 1, "msg": "insert(30): PIROS csúcsként a BST-helyére (a 10 jobb gyermeke)", "z": 30, "par": 10, "gp": null, "unc": null, "case": null, "props": [true, true, true, true, true], "bh": 1}, {"nodes": {"10": [null, 30, "B"], "30": [null, null, "R"]}, "root": 10, "line": 12, "msg": "tree.root.color = BLACK (10 már fekete)", "z": null, "par": null, "gp": null, "unc": null, "case": null, "props": [true, true, true, true, true], "bh": 1}, {"nodes": {"10": [null, 30, "B"], "30": [20, null, "R"], "20": [null, null, "R"]}, "root": 10, "line": 1, "msg": "insert(20): PIROS csúcsként a BST-helyére (a 30 bal gyermeke)", "z": 20, "par": 30, "gp": 10, "unc": null, "case": null, "props": [true, true, true, false, true], "bh": 1}, {"nodes": {"10": [null, 20, "B"], "30": [null, null, "R"], "20": [null, 30, "R"]}, "root": 10, "line": 10, "msg": "2. eset: a nagybácsi (NIL) FEKETE, z belső unoka → jobb forgatás a szülőn (30)", "z": 30, "par": 20, "gp": 10, "unc": null, "case": 2, "props": [true, true, true, false, true], "bh": 1}, {"nodes": {"10": [null, null, "R"], "30": [null, null, "R"], "20": [10, 30, "B"]}, "root": 20, "line": 11, "msg": "3. eset: külső unoka → 20 FEKETE, 10 PIROS, bal forgatás a nagyszülőn (10)", "z": 30, "par": 20, "gp": null, "unc": null, "case": 3, "props": [true, true, true, true, true], "bh": 1}, {"nodes": {"10": [null, null, "R"], "30": [null, null, "R"], "20": [10, 30, "B"]}, "root": 20, "line": 12, "msg": "tree.root.color = BLACK (20 már fekete)", "z": null, "par": null, "gp": null, "unc": null, "case": null, "props": [true, true, true, true, true], "bh": 1}, {"nodes": {"10": [5, null, "R"], "30": [null, null, "R"], "20": [10, 30, "B"], "5": [null, null, "R"]}, "root": 20, "line": 1, "msg": "insert(5): PIROS csúcsként a BST-helyére (a 10 bal gyermeke)", "z": 5, "par": 10, "gp": 20, "unc": 30, "case": null, "props": [true, true, true, false, true], "bh": 1}, {"nodes": {"10": [5, null, "B"], "30": [null, null, "B"], "20": [10, 30, "R"], "5": [null, null, "R"]}, "root": 20, "line": 5, "msg": "1. eset: a nagybácsi (30) PIROS → 10 és 30 FEKETE, 20 PIROS; z = 20", "z": 5, "par": 10, "gp": 20, "unc": 30, "case": 1, "props": [true, false, true, true, true], "bh": 2}, {"nodes": {"10": [5, null, "B"], "30": [null, null, "B"], "20": [10, 30, "B"], "5": [null, null, "R"]}, "root": 20, "line": 12, "msg": "tree.root.color = BLACK (20 átszínezve)", "z": null, "par": null, "gp": null, "unc": null, "case": null, "props": [true, true, true, true, true], "bh": 2}];
const CODE = ["rb_insert(tree, key):", "    z = új csúcs(key); BST_insert(tree, z); z.color = RED", "    while z.parent.color == RED:", "        if z.parent == z.parent.parent.left:", "            y = z.parent.parent.right          // nagybácsi", "            if y.color == RED: 1. eset – szülő, y FEKETE; nagyszülő PIROS; z = nagyszülő", "            else: if z == z.parent.right: z = z.parent; left_rotate(tree, z)   // 2. eset", "                  szülő FEKETE; nagyszülő PIROS; right_rotate(tree, nagyszülő) // 3. eset", "        else:  y = z.parent.parent.left        // szimmetrikus ág", "            if y.color == RED: 1. eset (mint fent)", "            else: if z == z.parent.left: z = z.parent; right_rotate(tree, z)   // 2. eset", "                  szülő FEKETE; nagyszülő PIROS; left_rotate(tree, nagyszülő)  // 3. eset", "    tree.root.color = BLACK"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let KEYSEQ = [10, 30, 20, 5];
function run(keys){
  const n = {}; let root = null; const st = [];
  const col = x => x === null ? "B" : n[x].c;
  const rot = (x, d) => { const o = d === "l" ? "r" : "l", y = n[x][o]; n[x][o] = n[y][d]; if (n[y][d] !== null) n[n[y][d]].p = x;
    const p = n[x].p; n[y].p = p; if (p === null) root = y; else if (x === n[p].l) n[p].l = y; else n[p].r = y; n[y][d] = x; n[x].p = y; };
  const push = (line, msg, z, kase) => { const nodes = {}; for (const k in n) nodes[k] = [n[k].l, n[k].r, n[k].c];
    const p = z !== null && n[z] ? n[z].p : null, g = p !== null ? n[p].p : null; let u = null; if (g !== null) u = p === n[g].l ? n[g].r : n[g].l;
    st.push({nodes, root, line, msg, z, par: p, gp: g, unc: u, case: kase || null}); };
  for (const key of keys) {
    let p = null, x = root, dup = false;
    while (x !== null) { p = x; if (key === x) { dup = true; break; } x = key < x ? n[x].l : n[x].r; }
    if (dup) { push(1, `insert(${key}): a kulcs már bent van – kihagyjuk`, null); continue; }
    n[key] = {l: null, r: null, p, c: "R"}; if (p === null) root = key; else if (key < p) n[p].l = key; else n[p].r = key;
    let z = key;
    push(1, `insert(${key}): PIROS csúcsként a BST-helyére` + (p !== null ? ` (a ${p} ${key < p ? "bal" : "jobb"} gyermeke)` : " (gyökér)"), z);
    while (col(n[z].p) === "R") {
      let par = n[z].p, g = n[par].p; const left = par === n[g].l, y = left ? n[g].r : n[g].l;
      if (col(y) === "R") { n[par].c = "B"; n[y].c = "B"; n[g].c = "R"; push(left ? 5 : 9, `1. eset: a nagybácsi (${y}) PIROS → ${par} és ${y} FEKETE, ${g} PIROS; z = ${g}`, z, 1); z = g; }
      else {
        if (left && z === n[par].r) { z = par; rot(z, "l"); push(6, `2. eset: a nagybácsi (${y !== null ? y : "NIL"}) FEKETE, z belső unoka → bal forgatás a szülőn (${z})`, z, 2); }
        else if (!left && z === n[par].l) { z = par; rot(z, "r"); push(10, `2. eset: a nagybácsi (${y !== null ? y : "NIL"}) FEKETE, z belső unoka → jobb forgatás a szülőn (${z})`, z, 2); }
        par = n[z].p; g = n[par].p; n[par].c = "B"; n[g].c = "R"; rot(g, left ? "r" : "l");
        push(left ? 7 : 11, `3. eset: külső unoka → ${par} FEKETE, ${g} PIROS, ${left ? "jobb" : "bal"} forgatás a nagyszülőn (${g})`, z, 3);
      }
    }
    const rec = n[root].c === "R"; n[root].c = "B";
    push(12, "tree.root.color = BLACK" + (rec ? ` (${root} átszínezve)` : ` (${root} már fekete)`), null);
  }
  return st;
}
function check(s){
  const N = s.nodes, root = s.root;
  const p2 = root === null || N[root][2] === "B";
  const p4 = Object.values(N).every(v => !(v[2] === "R" && v.slice(0, 2).some(c => c !== null && N[c][2] === "R")));
  const bh = x => { if (x === null) return 1; const [l, r, c] = N[x], a = bh(l), b = bh(r); if (a === null || b === null || a !== b) return null; return a + (c === "B" ? 1 : 0); };
  let h = null; if (root !== null) { const a = bh(N[root][0]), b = bh(N[root][1]); h = a !== null && a === b ? a : null; }
  return [[true, p2, true, p4, root === null || h !== null], h];
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 300");
  const pos = {}; let c = 0, dm = 0;
  const rec = (x, d) => { if (x === null || x === undefined) return; const v = s.nodes[x]; rec(v[0], d + 1); pos[x] = [c++, d]; dm = Math.max(dm, d); rec(v[1], d + 1); };
  rec(s.root, 0);
  const dx = Math.min(56, 340 / Math.max(1, c)), dy = Math.min(52, 170 / Math.max(1, dm + 1)), X = i => 190 - (c - 1) * dx / 2 + i * dx, Y = d => 34 + d * dy;
  for (const x in pos) s.nodes[x].slice(0, 2).forEach((ch, k) => {
    if (ch !== null) el("line", {x1: X(pos[x][0]), y1: Y(pos[x][1]), x2: X(pos[ch][0]), y2: Y(pos[ch][1]), stroke: css("--line"), "stroke-width": 1.3});
    else { const nx = X(pos[x][0]) + (k ? 12 : -12), ny = Y(pos[x][1]) + 30; el("line", {x1: X(pos[x][0]), y1: Y(pos[x][1]), x2: nx, y2: ny, stroke: css("--line"), "stroke-width": 0.8}); el("rect", {x: nx - 4, y: ny - 4, width: 8, height: 8, fill: css("--fg")}); }
  });
  const tag = {}; [["z", s.z], ["szülő", s.par], ["nagyszülő", s.gp], ["nagybácsi", s.unc]].forEach(([t, v]) => { if (v !== null && v !== undefined) tag[v] = (tag[v] ? tag[v] + ", " : "") + t; });
  for (const x in pos) {
    const cx = X(pos[x][0]), cy = Y(pos[x][1]), red = s.nodes[x][2] === "R";
    el("circle", {cx, cy, r: 16, fill: red ? css("--bg") : css("--fg"), stroke: red ? "#c00000" : css("--fg"), "stroke-width": red ? 3 : 1.2, "stroke-dasharray": red ? "5 3" : ""});
    el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 13, fill: red ? css("--fg") : css("--bg")}, x);
    if (red) el("text", {x: cx + 11, y: cy + 17, "font-size": 9, "font-weight": "bold"}, "P");
    if (tag[x]) el("text", {x: cx - 20, y: cy - 12, "text-anchor": "end", "font-size": 11, "font-style": "italic", fill: css("--hl")}, tag[x]);
  }
  const [props, h] = check(s), names = ["1. minden csúcs piros vagy fekete", "2. a gyökér fekete", "3. a NIL levelek feketék", "4. piros csúcs gyermekei feketék", "5. azonos fekete magasság"];
  el("text", {x: 380, y: 24, "font-size": 13, "font-weight": "bold"}, "invariánsok");
  props.forEach((ok, i) => el("text", {x: 380, y: 46 + i * 20, "font-size": 11.5, fill: ok ? css("--fg") : "#c00000", "font-weight": ok ? "normal" : "bold"}, (ok ? "✓ " : "✗ ") + names[i]));
  el("text", {x: 380, y: 160, "font-size": 12}, "bh(gyökér) = " + (h === null ? "eltér!" : h) + " (NIL-ekkel, gyökér nélkül)");
  if (s.case) el("text", {x: 380, y: 186, "font-size": 14, "font-weight": "bold"}, s.case + ". eset");
  el("text", {x: 10, y: 292, "font-size": 11, fill: css("--muted")}, "fekete = teli kör · piros = szaggatott keretes kör „P” indexszel · ■ = NIL (fekete)");
}
function load(seq){
  const msg = document.getElementById("err");
  const keys = seq || document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (keys.length < 1 || keys.length > 12 || keys.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–12 egész kulcsot adjon meg."; return; }
  msg.textContent = ""; if (seq) document.getElementById("inp").value = seq.join(", "); KEYSEQ = keys; setSteps(run(keys));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
