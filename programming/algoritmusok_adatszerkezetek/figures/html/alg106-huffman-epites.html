function huffman(ws){
  const nodes = ws.map(([s, w]) => ({w, s, l: null, r: null}));
  let Q = ws.map(([s, w], i) => [w, i, i]), seq = Q.length;
  const key = (a, b) => a[0] - b[0] || a[1] - b[1]; Q.sort(key);
  const lab = n => nodes[n].s !== null ? nodes[n].s + ":" + nodes[n].w : String(nodes[n].w);
  const qs = () => Q.map(q => q[0]), roots = (ex) => Q.map(q => q[2]).concat(ex || []);
  const snap = o => Object.assign({nodes: nodes.map(d => Object.assign({}, d))}, o);
  const st = [snap({roots: roots(), Q: qs(), x: null, y: null, z: null, line: 4, msg: `Kezdet: ${ws.length} levél a Q-ban; Q = ${qs().join(", ")}`})];
  let k = 0;
  while (Q.length > 1) { k++;
    const [wx, , x] = Q.shift();
    st.push(snap({roots: roots([x]), Q: qs(), x, y: null, z: null, line: 6, msg: `${k}. összevonás: x <- KIVESZ_MIN(Q) = ${lab(x)}; Q = ${qs().join(", ")}`}));
    const [wy, , y] = Q.shift();
    st.push(snap({roots: roots([x, y]), Q: qs(), x, y, z: null, line: 7, msg: `${k}. összevonás: y <- KIVESZ_MIN(Q) = ${lab(y)}; részösszeg ${wx} + ${wy} = ${wx + wy}`}));
    const z = nodes.length; nodes.push({w: wx + wy, s: null, l: x, r: y}); Q.push([wx + wy, seq++, z]); Q.sort(key);
    st.push(snap({roots: roots(), Q: qs(), x, y, z, line: 11, msg: `${k}. összevonás: z = ${wx + wy} (bal: ${lab(x)}, jobb: ${lab(y)}); BESZÚR(Q, z); Q = ${qs().join(", ")}`}));
  }
  const root = Q[0][2], C = {};
  const walk = (n, p) => { const d = nodes[n]; if (d.s !== null) { C[d.s] = p; return; } walk(d.l, p + "0"); walk(d.r, p + "1"); };
  walk(root, "");
  let tot = 0, L = 0, H = 0; ws.forEach(([s, w]) => { tot += w; L += w * C[s].length; });

    msg: `Kész: gyökér ${nodes[root].w}; L = ${L}/${tot} = ${(L / tot).toFixed(2).replace(".", ",")} bit/szimbólum, H = ${H.toFixed(3).replace(".", ",")} bit/szimbólum`}));

function render(s){
  svg.innerHTML = "";

  const minLeaf = n => N[n].s !== null ? n : Math.min(minLeaf(N[n].l), minLeaf(N[n].r));
  const pos = {}; let nx = 0, maxd = 0;
  const walk = (n, dep) => { const d = N[n]; maxd = Math.max(maxd, dep);
    if (d.s !== null) { pos[n] = [nx, dep]; nx += 1; return; } walk(d.l, dep + 1); walk(d.r, dep + 1); pos[n] = [(pos[d.l][0] + pos[d.r][0]) / 2, dep]; };
  s.roots.slice().sort((a, b) => minLeaf(a) - minLeaf(b)).forEach(r => { walk(r, 0); nx += 0.35; });
  const Wd = Math.max(nx, 4), dx = Math.min(80, 540 / Wd), dy = Math.min(62, 300 / (maxd + 1));
  const tblH = s.done ? 22 * (Object.keys(s.C).length + 1) + 10 : 0, H = 80 + (maxd + 1) * dy + 40 + tblH;
  svg.setAttribute("viewBox", `0 0 580 ${Math.max(300, H)}`);
  const X = v => 20 + dx * (v + 0.5) + (540 - dx * Wd) / 2, Y = d => 46 + d * dy;
  for (const n in pos) { const d = N[n]; if (d.s !== null) continue;
    [[d.l, "0"], [d.r, "1"]].forEach(([c, b]) => {
      el("line", {x1: X(pos[n][0]), y1: Y(pos[n][1]), x2: X(pos[c][0]), y2: Y(pos[c][1]), stroke: css("--line"), "stroke-width": 1.4});
      el("text", {x: (X(pos[n][0]) + X(pos[c][0])) / 2 + (b === "0" ? -9 : 9), y: (Y(pos[n][1]) + Y(pos[c][1])) / 2, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, b); }); }
  for (const n in pos) { const d = N[n], x = X(pos[n][0]), y = Y(pos[n][1]), sel = +n === s.x || +n === s.y, nw = +n === s.z && !s.done;
    if (d.s !== null) { el("rect", {x: x - 24, y: y - 13, width: 48, height: 26, fill: sel ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": sel ? 3.5 : 1.2});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, lab(n));
      if (s.done) el("text", {x, y: y + 30, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, s.C[d.s] || "ε"); }
    else { el("circle", {cx: x, cy: y, r: 17, fill: sel ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": sel ? 3.5 : 1.2});
      if (nw) el("circle", {cx: x, cy: y, r: 22, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, lab(n)); } }
  const yb = 46 + (maxd + 1) * dy + 18;
  if (!s.done) el("text", {x: 290, y: yb, "text-anchor": "middle", "font-size": 13}, "Q (súly szerint): " + (s.Q.length ? s.Q.join(", ") : "∅"));
  else { el("text", {x: 290, y: yb, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Kódtábla");
    Object.keys(s.C).sort().forEach((c, i) => el("text", {x: 290, y: yb + 22 * (i + 1), "text-anchor": "middle", "font-size": 13}, `${c}: ${s.C[c] || "ε (üres szó)"}`)); }
  el("text", {x: 8, y: 16, "font-size": 11, fill: css("--muted")}, "téglalap = levél · kör = belső csúcs · vastag = kivett · dupla kör = új z · bal 0, jobb 1");
}
function load(){
  const m = [...document.getElementById("inp").value.matchAll(/([^\s,:;]+)\s*:\s*(\d+)/g)].map(x => [x[1], +x[2]]);
  const err = document.getElementById("err");
  if (m.length < 1 || m.length > 20 || m.some(x => x[1] <= 0) || new Set(m.map(x => x[0])).size !== m.length) { err.textContent = "1–20 különböző szimbólum, pozitív egész súllyal (pl. a:45, b:13)."; return; }
  err.textContent = ""; setSteps(huffman(m));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
