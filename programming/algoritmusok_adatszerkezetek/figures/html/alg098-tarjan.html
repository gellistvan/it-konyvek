<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarjan-algoritmus lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><label>Gráf: <select id="g" onchange="load()" aria-label="Gráf"><option value="book">a fejezet példája</option><option value="ext">kibővített (1→6, 6→4)</option><option value="own">saját éllista</option></select></label><label><input id="nochk" type="checkbox" onchange="load()"> onStack-ellenőrzés kikapcsolása</label><input id="own" size="24" value="1-2, 2-3, 3-1, 3-4" aria-label="Saját éllista"><button onclick="document.getElementById('g').value='own';load()">Saját gráf</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tarjan SCC-algoritmusa az öt csúcsú gráfon: a disc/low értékek, a verem és a kiadott komponensek {5, 4}, majd {3, 2, 1}."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 26.1.3 példája (Adj[3] = (1, 4)). A kibővített gráfon az onStack-ellenőrzés kikapcsolásával látszik a hiba: low[6] = disc[4] = 4 < disc[6], így a 6 tévesen az {1, 2, 3} komponensbe kerül ({6, 3, 2, 1}); ellenőrzéssel a kimenet {5, 4}, {6}, {3, 2, 1}. Saját gráf: „1-2, 2-3, …” irányított élek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = ["DFS(v):", "  index++; disc[v] = low[v] = index", "  S.push(v); onStack[v] = igaz", "  minden w ∈ Adj[v]:", "    ha disc[w] == −1: DFS(w)", "      low[v] = min(low[v], low[w])", "    különben ha onStack[w]:", "      low[v] = min(low[v], disc[w])", "  ha low[v] == disc[v]:", "    pop-olás v-ig → komponens"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

let ADJ = {1: [2], 2: [3], 3: [1, 4], 4: [5], 5: [4]}, CHECK = true;
const POS5 = {1: [60, 150], 2: [170, 60], 3: [170, 240], 4: [320, 240], 5: [320, 60], 6: [100, 288]};
function posFor(adj){ const V = Object.keys(adj).map(Number); if (V.every(v => v in POS5)) return POS5;
  const P = {}; V.forEach((v, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / V.length; P[v] = [190 + 130 * Math.cos(a), 150 + 120 * Math.sin(a)]; }); return P; }
function run(){
  const V = Object.keys(ADJ).map(Number).sort((a, b) => a - b), disc = {}, low = {}, on = {}, S = [], out = [], st = [], kind = {}; let idx = 0;
  V.forEach(v => { disc[v] = -1; low[v] = -1; on[v] = false; });
  const snap = (v, line, msg, extra) => st.push(Object.assign({v, line, msg, disc: {...disc}, low: {...low}, S: S.slice(), out: out.map(c => c.slice()), kind: {...kind}}, extra || {}));
  const dfs = v => { idx++; disc[v] = low[v] = idx; S.push(v); on[v] = true; snap(v, 1, `DFS(${v}): disc[${v}] = low[${v}] = ${idx}; verem = [${S.join(", ")}].`);
    for (const w of ADJ[v]) {
      if (disc[w] === -1) { kind[v + "-" + w] = "fa"; dfs(w); const o = low[v]; low[v] = Math.min(low[v], low[w]); snap(v, 5, `Vissza ${v}-be: low[${v}] = min(${o}, low[${w}] = ${low[w]}) = ${low[v]}.`, {e: [v, w]}); }
      else if (on[w] || !CHECK) { kind[v + "-" + w] = "vissza"; const o = low[v]; low[v] = Math.min(low[v], disc[w]);
        snap(v, 7, `${v} → ${w}: ${on[w] ? "a " + w + " a veremben van" : "a " + w + " NINCS a veremben (onStack-ellenőrzés kikapcsolva!)"}; low[${v}] = min(${o}, disc[${w}] = ${disc[w]}) = ${low[v]}.`, {e: [v, w]}); }
      else { kind[v + "-" + w] = "kereszt"; snap(v, 6, `${v} → ${w}: ${w} már kiadott komponensben van – low[${v}] nem változik.`, {e: [v, w]}); } }
    if (low[v] === disc[v]) { const c = []; let w; do { w = S.pop(); on[w] = false; c.push(w); } while (w !== v); out.push(c);
      snap(v, 9, `low[${v}] = disc[${v}] = ${disc[v]}: kiadás {${c.join(", ")}}; verem = [${S.join(", ")}].`); } };
  for (const v of V) if (disc[v] === -1) dfs(v);
  st[st.length - 1].msg += ` Kimenet: ${out.map(c => "{" + c.join(", ") + "}").join(", ")}.`;
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 350"); G_defs();
  const P = posFor(ADJ), pats = ["url(#hp)", "url(#dp)", css("--cellhl")];
  s.out.forEach((c, i) => c.forEach(v => el("circle", {cx: P[v][0], cy: P[v][1], r: 27, fill: pats[i % 3], stroke: "none"})));
  for (const u in ADJ) for (const w of ADJ[u]) { const k = s.kind[u + "-" + w], both = ADJ[w] && ADJ[w].includes(+u);
    const cur = s.e && s.e[0] === +u && s.e[1] === w;
    G_edge(P[u], P[w], {r: 18, dir: true, w: k === "fa" ? 3.2 : 1.5, dash: k === "vissza" ? "7 5" : k === "kereszt" ? "2 4" : "", curve: both ? 18 : 0,
      color: cur ? css("--hl2") : k ? undefined : css("--muted")}); }
  for (const v in P) { if (!(v in ADJ)) continue; const onS = s.S.includes(+v);
    G_node(P[v], v, {r: 18, w: +v === s.v ? 4 : 1.5, stroke: +v === s.v ? css("--hl2") : undefined, dash: onS ? "" : undefined});
    if (s.disc[v] > 0) G_text(P[v][0], P[v][1] - 24, `${s.disc[v]}/${s.low[v]}`, {size: 12, anchor: "middle", halo: true, bold: +v === s.v}); }
  // verem oszlopként
  const x0 = 420; G_text(x0, 22, "verem S", {bold: true});
  el("rect", {x: x0, y: 30, width: 46, height: 230, fill: "none", stroke: css("--line")});
  s.S.forEach((v, i) => { const y = 260 - (i + 1) * 30; el("rect", {x: x0 + 3, y: y + 2, width: 40, height: 26, fill: css("--cellhl"), stroke: css("--line")}); G_text(x0 + 23, y + 20, String(v), {anchor: "middle", size: 14}); });
  G_text(x0 + 56, 22, "kiadva", {bold: true});
  s.out.forEach((c, i) => G_text(x0 + 56, 44 + i * 18, "{" + c.join(", ") + "}", {size: 12}));
  G_text(10, 326, "címke: disc/low · vastag = faél · szaggatott = visszaél (low ← disc) · pontozott = kiadott komponensbe mutató él", {size: 10.5, fill: css("--muted")});
  G_text(10, 342, "minta = kiadott SCC · narancs = aktuális csúcs/él", {size: 10.5, fill: css("--muted")});
}
function load(){ const g = document.getElementById("g").value; CHECK = !document.getElementById("nochk").checked;
  if (g === "book") ADJ = {1: [2], 2: [3], 3: [1, 4], 4: [5], 5: [4]};
  else if (g === "ext") ADJ = {1: [2, 6], 2: [3], 3: [1, 4], 4: [5], 5: [4], 6: [4]};
  else { const A = {}; for (const part of document.getElementById("own").value.split(/[,;\n]+/)) { const m = part.trim().match(/^(\d+)\s*(?:->|→|-)\s*(\d+)$/);
      if (!m) continue; const u = +m[1], w = +m[2]; (A[u] = A[u] || []).push(w); if (!(w in A)) A[w] = []; }
    if (!Object.keys(A).length) { status.textContent = "Nem értelmezhető éllista. Minta: 1-2, 2-3, 3-1"; return; } ADJ = A; }
  setSteps(run()); }

STEPS = run();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
