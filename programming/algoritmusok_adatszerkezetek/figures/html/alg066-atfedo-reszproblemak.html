<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Átfedő részproblémák: érmeváltás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Mód: <select id="mode" onchange="load()" aria-label="Mód"><option value="naiv">naiv</option><option value="memo">memoizált</option><option value="bu">bottom-up</option></select></label><label>M <input id="M" type="range" min="1" max="12" value="6" aria-label="M" oninput="document.getElementById('Mv').textContent=this.value" onchange="load()"> <b id="Mv">6</b></label><label>C: <input id="coins" value="1, 3, 4" size="9" aria-label="Címletek"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A minimális érmeváltás hívásfája C = {1, 3, 4}, M = 6 esetén; naiv módban 24 hívás, memoizált módban a táblatalálatok levágják az ismételt ágakat, bottom-up módban a dp-tábla balról jobbra töltődik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){

const INF = Infinity;
function fmt(v){ return v === null || v === undefined ? "·" : (v === INF ? "∞" : String(v)); }
function layout(nodes, n){
  const kids = {}; for (let i = 0; i < n; i++) kids[i] = [];
  for (let i = 0; i < n; i++) if (nodes[i].p !== null) kids[nodes[i].p].push(i);
  const pos = {}; let nx = 0;
  (function walk(i, d){ if (!kids[i].length) { pos[i] = [nx++, d]; return; } kids[i].forEach(k => walk(k, d + 1));
    const xs = kids[i].map(k => pos[k][0]); pos[i] = [(Math.min(...xs) + Math.max(...xs)) / 2, d]; })(0, 0);
  return [pos, nx];
}
function render(s){
  svg.innerHTML = "";
  const m = s.m;
  if (s.mode === "bu") {
    svg.setAttribute("viewBox", "0 0 560 200");
    const w = Math.min(60, 520 / (m + 1));
    for (let x = 0; x <= m; x++) {
      const cur = x === s.x, src = s.c !== null && x === s.x - s.c;
      el("rect", {x: 20 + x*w, y: 70, width: w, height: 44, fill: cur ? css("--cellhl") : css("--cell"), stroke: src ? css("--hl2") : css("--line"), "stroke-width": cur || src ? 3 : 1});
      el("text", {x: 20 + x*w + w/2, y: 98, "text-anchor": "middle", "font-size": 17, "font-weight": "bold"}, fmt(s.dp[x]));
      el("text", {x: 20 + x*w + w/2, y: 62, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(x));
    }
    if (s.c !== null) el("text", {x: 20, y: 150, "font-size": 13}, `aktuális: x = ${s.x}, c = ${s.c} → dp[${s.x - s.c}] (narancs keret) + 1`);
    el("text", {x: 20, y: 30, "font-size": 13}, "bottom-up: a tábla balról jobbra töltődik");
    return;
  }
  const N = s.nodes, n = s.n, [pos, nl] = layout(N, Math.max(n, 1));
  const depth = Math.max(1, ...Object.values(pos).map(p => p[1]));
  const W = 540 / Math.max(nl, 1), H = Math.min(46, 250 / depth), r = Math.max(6, Math.min(12, W * 0.4));
  svg.setAttribute("viewBox", "0 0 560 " + (60 + depth * H + 120));
  const P = i => [10 + (pos[i][0] + 0.5) * W, 40 + pos[i][1] * H];
  el("text", {x: 10, y: 18, "font-size": 13}, `hívások: ${s.calls}` + (s.mode === "memo" ? `   táblatalálat: ${s.hits}` : ""));
  for (let i = 1; i < n; i++) { const a = P(N[i].p), b = P(i); el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: css("--line"), "stroke-width": 0.8}); }
  for (let i = 0; i < n; i++) {
    const [cx, cy] = P(i), nd = N[i], cur = i === s.cur, done = s.ret[i] !== undefined;
    el("circle", {cx, cy, r, fill: nd.hit ? css("--code") : (done ? css("--cellhl") : css("--cell")), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": nd.hit ? "3 2" : ""});
    el("text", {x: cx, y: cy + 4, "text-anchor": "middle", "font-size": Math.min(12, r + 1)}, String(nd.x));
  }
  const ty = 60 + depth * H + 20, w = Math.min(40, 400 / (m + 1));
  el("text", {x: 10, y: ty + 18, "font-size": 12}, s.mode === "memo" ? "memo dp:" : "(naiv: nincs tábla)");
  if (s.mode === "memo") for (let x = 0; x <= m; x++) {
    el("rect", {x: 80 + x*w, y: ty, width: w, height: 26, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 80 + x*w + w/2, y: ty + 18, "text-anchor": "middle", "font-size": 13}, x === 0 ? "0" : fmt(s.dp[x]));
    el("text", {x: 80 + x*w + w/2, y: ty + 40, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(x));
  }
  el("text", {x: 10, y: ty + 70, "font-size": 11, fill: css("--muted")}, "csúcs = hívás x-szel · sötétebb = visszatért · narancs = aktuális");
  el("text", {x: 10, y: ty + 86, "font-size": 11, fill: css("--muted")}, "szaggatott körvonal = találat a táblában (nincs gyereke)");
}
function topDown(coins, m, memo){
  const nodes = [], st = [], dp = {}, rets = {}, c = {calls: 0, hits: 0}, mode = memo ? "memo" : "naiv";
  const snap = (line, msg, cur) => { const d = []; for (let x = 0; x <= m; x++) d.push(dp[x] === undefined ? null : dp[x]);
    st.push({mode, m, nodes, n: nodes.length, line, msg, cur, calls: c.calls, hits: c.hits, dp: d, ret: Object.assign({}, rets)}); };
  function call(x, p, cc){
    const id = nodes.length; c.calls++; const hit = memo && x > 0 && dp[x] !== undefined;
    nodes.push({x, p, c: cc, hit});
    if (x === 0) { rets[id] = 0; snap(1, `hívás #${c.calls}: x = 0 → return 0`, id); return 0; }
    if (hit) { c.hits++; rets[id] = dp[x]; snap(2, `hívás #${c.calls}: x = ${x} → találat a táblában: dp[${x}] = ${fmt(dp[x])}`, id); return dp[x]; }
    snap(3, `hívás #${c.calls}: x = ${x}, best ← ∞`, id);
    let best = INF; for (const k of coins) if (k <= x) best = Math.min(best, call(x - k, id, k) + 1);
    if (memo) dp[x] = best; rets[id] = best;
    snap(6, `x = ${x} kész: best = ${fmt(best)}` + (memo ? `, dp[${x}] ← ${fmt(best)}` : " (naiv: nem tároljuk)"), id);
    return best;
  }
  snap(-1, `C = [${coins.join(", ")}], M = ${m}: ${memo ? "memoizált" : "naiv"} rekurzió indul`, null);
  call(m, null, null);
  st[st.length - 1].msg += `. Vége: ${c.calls} hívás` + (memo ? `, ebből ${c.hits} táblatalálat` : "");
  return st;
}
function bottomUp(coins, m){
  const dp = [0]; for (let x = 1; x <= m; x++) dp.push(INF);
  const st = [{mode: "bu", m, line: 8, x: 0, c: null, dp: dp.slice(), msg: "dp[0] ← 0, a többi ∞"}];
  for (let x = 1; x <= m; x++) for (const c of coins) if (c <= x && dp[x - c] !== INF) {
    const old = dp[x]; dp[x] = Math.min(dp[x], dp[x - c] + 1);
    st.push({mode: "bu", m, line: 10, x, c, dp: dp.slice(), msg: `x = ${x}, c = ${c}: dp[${x - c}] + 1 = ${dp[x - c] + 1}` + (dp[x] < old ? ` < ${fmt(old)} → dp[${x}] = ${dp[x]}` : ` ≥ ${dp[x]}, marad`)});
  }
  return st;
}
function load(){
  const coins = document.getElementById("coins").value.split(/[ ,;]+/).filter(v => v !== "").map(Number);
  const m = +document.getElementById("M").value, mode = document.getElementById("mode").value, e = document.getElementById("err");
  document.getElementById("Mv").textContent = m;
  if (!coins.length || coins.length > 5 || coins.some(v => !Number.isInteger(v) || v < 1 || v > 12)) { e.textContent = "1–5 címlet, mindegyik 1–12 közötti egész."; return; }
  if (mode === "naiv" && m > 8) { e.textContent = "Naiv módban M ≤ 8 (a fa exponenciálisan nő)."; return; }
  e.textContent = ""; const cs = [...new Set(coins)].sort((a, b) => a - b);
  setSteps(mode === "bu" ? bottomUp(cs, m) : topDown(cs, m, mode === "memo"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
