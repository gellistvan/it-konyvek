<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skip list: a keresés útja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Keresett x: <input id="key" value="19" size="5" aria-label="Keresett kulcs"></label><label><input id="bk" type="checkbox"> visszafelé elemzés (balra/felfelé)</label><button onclick="load()">Keresés</button><button onclick="document.getElementById('key').value=20;load()">Példa: 20 (nincs benne)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy szintű skip list a 3…26 kulcsokkal; a 19 keresése a fejtoronyból jobbra és lefelé haladva a 17-es csomópontnál áll meg."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">p = 1/2 sorsolás egy lehetséges kimenete; 0-tól számozott szintek; a fejtorony csomópontjainak kulcsa −∞. Kezdőállapot: a 19 keresése a header 3. szintjéről (8 lépés). A visszafelé elemzés a megtalált útvonalat fordítva járja be, és számolja a balra/felfelé lépéseket.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": null, "lvl": 3, "line": 1, "msg": "szint 3, current = fej (−∞), current.right.key = 21 – current = header; keresett x = 19", "moves": [], "peek": []}, {"cur": null, "lvl": 2, "line": 5, "msg": "szint 2, current = fej (−∞), current.right.key = 9 – az előző szinten a jobb szomszéd 21 nem kisebb 19-nél: lefelé lépünk (current = current.down)", "moves": [["d", null, null, 3]], "peek": [[null, 3]]}, {"cur": 9, "lvl": 2, "line": 4, "msg": "szint 2, current = 9, current.right.key = 21 – 9 < 19: jobbra lépünk (current = current.right)", "moves": [["d", null, null, 3], ["r", null, 9, 2]], "peek": [[null, 3]]}, {"cur": 9, "lvl": 1, "line": 5, "msg": "szint 1, current = 9, current.right.key = 17 – az előző szinten a jobb szomszéd 21 nem kisebb 19-nél: lefelé lépünk (current = current.down)", "moves": [["d", null, null, 3], ["r", null, 9, 2], ["d", 9, 9, 2]], "peek": [[null, 3], [9, 2]]}, {"cur": 17, "lvl": 1, "line": 4, "msg": "szint 1, current = 17, current.right.key = 21 – 17 < 19: jobbra lépünk (current = current.right)", "moves": [["d", null, null, 3], ["r", null, 9, 2], ["d", 9, 9, 2], ["r", 9, 17, 1]], "peek": [[null, 3], [9, 2]]}, {"cur": 17, "lvl": 0, "line": 5, "msg": "szint 0, current = 17, current.right.key = 19 – az előző szinten a jobb szomszéd 21 nem kisebb 19-nél: lefelé lépünk (current = current.down)", "moves": [["d", null, null, 3], ["r", null, 9, 2], ["d", 9, 9, 2], ["r", 9, 17, 1], ["d", 17, 17, 1]], "peek": [[null, 3], [9, 2], [17, 1]]}, {"cur": 17, "lvl": 0, "line": 6, "msg": "szint 0, current = 17, current.right.key = 19 – 19 nem kisebb 19-nél: a 0. szint while-ja leáll", "moves": [["d", null, null, 3], ["r", null, 9, 2], ["d", 9, 9, 2], ["r", 9, 17, 1], ["d", 17, 17, 1]], "peek": [[null, 3], [9, 2], [17, 1], [17, 0]]}, {"cur": 17, "lvl": 0, "line": 8, "msg": "szint 0, current = 17, current.right.key = 19 – SkipListSearch visszaadja: 17 (szigorú előd); SkipListContains: 17.right.key = 19 → a 19 csomópontja", "moves": [["d", null, null, 3], ["r", null, 9, 2], ["d", 9, 9, 2], ["r", 9, 17, 1], ["d", 17, 17, 1]], "peek": [[null, 3], [9, 2], [17, 1], [17, 0]], "ret": true, "found": 19}];
const CODE = ["SkipListSearch(header, x):", "    current = header", "    while current.down != NIL:", "        while current.right != NIL and current.right.key < x:", "            current = current.right", "        current = current.down", "    while current.right != NIL and current.right.key < x:", "        current = current.right", "    return current", "SkipListContains(header, x):", "    pred = SkipListSearch(header, x)", "    if pred.right != NIL and pred.right.key == x:", "        return pred.right", "    return NIL"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const KEYS = [3, 6, 7, 9, 12, 17, 19, 21, 25, 26], HGT = [1, 2, 1, 3, 1, 2, 1, 4, 1, 2], TOP = 3;
const HEIGHT = {}; KEYS.forEach((k, j) => HEIGHT[k] = HGT[j]);
function right(c, l){ const st = c === null ? 0 : KEYS.indexOf(c) + 1; for (const k of KEYS.slice(st)) if (HEIGHT[k] > l) return k; return null; }
const nm = c => c === null ? "fej (−∞)" : String(c);
const rk = (c, l) => { const r = right(c, l); return r === null ? "NIL" : String(r); };
function search(x){
  let cur = null, lvl = TOP; const moves = [], peek = [], steps = [];
  const snap = (line, msg, extra) => steps.push(Object.assign({cur, lvl, line, msg: `szint ${lvl}, current = ${nm(cur)}, current.right.key = ${rk(cur, lvl)} – ` + msg, moves: moves.map(m => m.slice()), peek: peek.map(p => p.slice())}, extra || {}));
  snap(1, `current = header; keresett x = ${x}`);
  let r;
  while (true) {
    while (true) { r = right(cur, lvl);
      if (r !== null && r < x) { moves.push(["r", cur, r, lvl]); cur = r; snap(lvl > 0 ? 4 : 7, `${r} < ${x}: jobbra lépünk (current = current.right)`); }
      else { peek.push([cur, lvl]); break; } }
    if (lvl === 0) break;
    const why = r === null ? "NIL" : `${r} nem kisebb ${x}-nél`;
    moves.push(["d", cur, cur, lvl]); lvl -= 1;
    snap(5, `az előző szinten a jobb szomszéd ${why}: lefelé lépünk (current = current.down)`);
  }
  r = right(cur, 0);
  snap(6, `${r === null ? "NIL" : r + " nem kisebb " + x + "-nél"}: a 0. szint while-ja leáll`);
  const found = r !== null && r === x;
  snap(8, `SkipListSearch visszaadja: ${nm(cur)} (szigorú előd); SkipListContains: ` + (found ? `${cur}.right.key = ${x} → a ${x} csomópontja` : "NIL (nincs a listában)"), {ret: true, found: found ? r : null});
  return steps;
}
function backward(fw){
  // a végső út fordítva: balra (r) és felfelé (d) lépések
  const L = fw[fw.length - 1], mv = L.moves.slice().reverse(), steps = [];
  let left = 0, up = 0, cur = L.cur, lvl = 0;
  steps.push({cur, lvl, line: 8, moves: L.moves, peek: [], back: mv.length, ret: true, found: L.found,
              msg: `Visszafelé elemzés: indulás a szigorú elődtől (${nm(cur)}, 0. szint); balra 0, felfelé 0`});
  mv.forEach((m, n) => {
    if (m[0] === "r") { left++; cur = m[1]; } else { up++; lvl = m[3]; }
    steps.push({cur, lvl, line: m[0] === "r" ? (m[3] > 0 ? 4 : 7) : 5, moves: L.moves, peek: [], back: mv.length - n - 1,
                msg: `Visszafelé: ${m[0] === "r" ? "balra" : "felfelé"} → szint ${lvl}, current = ${nm(cur)}; balra ${left}, felfelé ${up}`});
  });
  steps[steps.length - 1].msg += ` – elértük a fejtorony tetejét: összesen ${left + up} lépés (balra ${left}, felfelé ${up} ≤ header.level = ${TOP})`;
  return steps;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 270");
  svg.innerHTML = '<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--muted") + '"/></marker>'
    + '<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const X = {"null": 70}; KEYS.forEach((k, j) => X[k] = 122 + j * 48); const XN = 122 + KEYS.length * 48;
  const Y = l => 205 - l * 50, W = 32, H = 24;
  const shown = s.moves;
  const pk = new Set(s.peek.map(p => String(p[0]) + "/" + p[1]));
  [null].concat(KEYS).forEach(c => { const h = c === null ? TOP + 1 : HEIGHT[c];
    for (let l = 0; l < h; l++) { const r = right(c, l), isPk = pk.has(String(c) + "/" + l);
      el("line", {x1: X[c] + W/2, y1: Y(l), x2: r === null ? XN - 14 : X[r] - W/2 - 2, y2: Y(l), stroke: css("--muted"), "stroke-width": isPk ? 2 : 1, "stroke-dasharray": isPk ? "5 4" : "none", "marker-end": "url(#a1)"});
      if (l > 0) el("line", {x1: X[c], y1: Y(l) + H/2, x2: X[c], y2: Y(l - 1) - H/2 - 2, stroke: css("--muted"), "stroke-width": 1, "marker-end": "url(#a1)"}); } });
  shown.forEach((m, n) => { const [kind, a, b, l] = m, done = s.back !== undefined && n >= s.back, da = done ? "3 3" : "none";
    if (kind === "r") el("line", {x1: X[a] + W/2, y1: Y(l) - 3, x2: X[b] - W/2 - 3, y2: Y(l) - 3, stroke: css("--hl2"), "stroke-width": 4, "stroke-dasharray": da, "marker-end": "url(#a2)"});
    else el("line", {x1: X[a] - 6, y1: Y(l) + H/2, x2: X[a] - 6, y2: Y(l - 1) - H/2 - 3, stroke: css("--hl2"), "stroke-width": 4, "stroke-dasharray": da, "marker-end": "url(#a2)"});
    const tx = kind === "r" ? (X[a] + X[b]) / 2 : X[a] - 18, ty = kind === "r" ? Y(l) - 9 : (Y(l) + Y(l - 1)) / 2 + 4;
    el("text", {x: tx, y: ty, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, String(n + 1)); });
  [null].concat(KEYS).forEach(c => { const h = c === null ? TOP + 1 : HEIGHT[c];
    for (let l = 0; l < h; l++) { const cur = s.cur === c && s.lvl === l, ret = s.ret && c === s.cur && l === 0 && s.back === undefined;
      el("rect", {x: X[c] - W/2, y: Y(l) - H/2, width: W, height: H, fill: c === null ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 4 : 1.2});
      if (ret) el("rect", {x: X[c] - W/2 - 4, y: Y(l) - H/2 - 4, width: W + 8, height: H + 8, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
      if (s.found !== null && s.found !== undefined && c === s.found && l === 0) el("rect", {x: X[c] - W/2 - 4, y: Y(l) - H/2 - 4, width: W + 8, height: H + 8, fill: "none", stroke: css("--hl2"), "stroke-width": 1.5, "stroke-dasharray": "4 3"});
      el("text", {x: X[c], y: Y(l) + 5, "text-anchor": "middle", "font-size": 12}, c === null ? "−∞" : String(c)); } });
  for (let l = 0; l <= TOP; l++) { el("text", {x: 4, y: Y(l) + 4, "font-size": 12}, l + ". szint"); el("text", {x: XN - 10, y: Y(l) + 4, "font-size": 11}, "NIL"); }
  el("text", {x: 4, y: 258, "font-size": 12, fill: css("--muted")}, s.back === undefined ? "vastag = keresési út · szaggatott = megvizsgált, nem követett right · kettős keret = szigorú előd" : "visszafelé elemzés: pontozott vastag = már visszafelé bejárt szakasz (balra / felfelé)");
}
function load(){
  const v = Number(document.getElementById("key").value.replace(",", ".")), e = document.getElementById("err");
  if (!isFinite(v)) { e.textContent = "Számot adjon meg."; return; }
  e.textContent = ""; const fw = search(v); setSteps(document.getElementById("bk").checked ? backward(fw) : fw);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
