<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fokszámok, út és kör</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
svg .hit{cursor:pointer}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Rétegek">
  <label><input type="checkbox" id="lp" checked> út 1–2–3–4–5</label>
  <label><input type="checkbox" id="lc" checked> kör 1–2–3–1</label>
  <label><input type="checkbox" id="ld" checked> fokszámok</label>
  <button id="clr">Kijelölés törlése</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 700 300" role="img" aria-label="Az ötcsúcsú gráf fokszámai 2, 2, 3, 2, 1; az 1-2-3-4-5 út és az 1-2-3-1 kör kiemelve; a függőségi lánc ki/be fokszámai."></svg>
<p class="small">Kattintson egy csúcsra (vagy Tab + Enter): a szomszédai és a fokszáma kiemelődik. Vastag kék = út, szaggatott narancs = kör.
Egyszerű gráf, hurok nélkül. Kezdőállapot: a 10.1 6. szakaszának példája és az 1.2 függőségi gráfja.</p>
<script>
const D = {"V": [1, 2, 3, 4, 5], "E": [[1, 2], [1, 3], [2, 3], [3, 4], [4, 5]], "path": [1, 2, 3, 4, 5], "dep": ["alap", "fordítás", "tesztelés", "telepítés"], "dout": [1, 1, 1, 0], "din": [0, 1, 1, 1]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(par||svg).appendChild(e);return e;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
let sel = null;
const P = {1: [60, 220], 2: [150, 100], 3: [240, 220], 4: [340, 220], 5: [440, 220]};
const on = id => document.getElementById(id).checked;
const deg = v => D.E.filter(e => e.includes(v)).length;
const nb = v => D.E.filter(e => e.includes(v)).map(e => e[0] === v ? e[1] : e[0]);
const inPath = (a, b) => D.path.some((x, i) => i < D.path.length - 1 && ((x === a && D.path[i+1] === b) || (x === b && D.path[i+1] === a)));
function draw(){
  svg.innerHTML = "";
  el("text", {x: 250, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "(a) irányítatlan gráf");
  for (const [a, b] of D.E) {
    const hl = sel !== null && (a === sel || b === sel), p = on("lp") && inPath(a, b);
    el("line", {x1: P[a][0], y1: P[a][1], x2: P[b][0], y2: P[b][1], stroke: p ? css("--hl") : hl ? css("--hl2") : css("--line"), "stroke-width": p ? 6 : hl ? 3.5 : 1.4});
  }
  if (on("lc")) { const c = [1, 2, 3].map(v => P[v]), cx = (c[0][0] + c[1][0] + c[2][0]) / 3, cy = (c[0][1] + c[1][1] + c[2][1]) / 3;
    el("polygon", {points: c.map(([x, y]) => `${cx + 0.6*(x-cx)},${cy + 0.6*(y-cy)}`).join(" "), fill: "none", stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "7 4"});
    el("text", {x: cx, y: cy + 6, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "kör"); }
  for (const v of D.V) {
    const [x, y] = P[v], isSel = v === sel, isNb = sel !== null && nb(sel).includes(v);
    const g = el("g", {class: "hit", tabindex: 0, role: "button", "aria-label": `${v}. csúcs, fokszám ${deg(v)}`, "data-v": v});
    el("circle", {cx: x, cy: y, r: 20, fill: isSel ? css("--hl") : isNb ? css("--cellhl") : css("--cell"), stroke: isNb ? css("--hl2") : css("--line"), "stroke-width": isSel || isNb ? 3.5 : 1.6}, undefined, g);
    el("text", {x, y: y + 6, "text-anchor": "middle", "font-size": 17, fill: isSel ? css("--bg") : css("--fg")}, String(v), g);
    if (on("ld")) el("text", {x, y: v === 2 ? y - 28 : y + 40, "text-anchor": "middle", "font-size": 13}, "deg = " + deg(v));
  }
  const s = D.V.map(deg);
  el("text", {x: 30, y: 285, "font-size": 13, "font-weight": "bold"}, `Σ deg = ${s.join(" + ")} = ${s.reduce((a, b) => a + b, 0)} = 2 · |E| = 2 · ${D.E.length}`);
  // (b)
  el("text", {x: 600, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "(b) függőségi digráf");
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`;
  D.dep.forEach((v, k) => { const y = 45 + k * 58;
    el("rect", {x: 530, y, width: 100, height: 30, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.4});
    el("text", {x: 580, y: y + 20, "text-anchor": "middle", "font-size": 13}, v);
    el("text", {x: 636, y: y + 20, "font-size": 12}, `${D.dout[k]}/${D.din[k]}`);
    if (k < 3) el("line", {x1: 580, y1: y + 31, x2: 580, y2: y + 56, stroke: css("--line"), "stroke-width": 1.6, "marker-end": "url(#ah)"}); });
  el("text", {x: 530, y: 285, "font-size": 12}, "ki/be · Σ ki = Σ be = 3 = |E|");
  svg.querySelectorAll(".hit").forEach(g => {
    g.addEventListener("click", () => pick(+g.dataset.v));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(+g.dataset.v); } });
  });
}
const status = document.getElementById("status");
function msg(){ status.textContent = sel === null ? "Válasszon egy csúcsot. Fokszámok: " + D.V.map(v => `deg(${v}) = ${deg(v)}`).join(", ")
  : `deg(${sel}) = ${deg(sel)}; szomszédai: ${nb(sel).sort((a, b) => a - b).join(", ")}` + (sel === 5 ? " (levél: egyetlen szomszéd)" : ""); }
function pick(v){ sel = v; draw(); msg(); const f = svg.querySelector(`.hit[data-v="${v}"]`); if (f) f.focus(); }
["lp", "lc", "ld"].forEach(id => document.getElementById(id).addEventListener("change", () => { draw(); msg(); }));
document.getElementById("clr").onclick = () => { sel = null; draw(); msg(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw(); msg();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
