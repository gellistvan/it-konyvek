<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-királynő backtracking</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n = <select id="n" onchange="load()" aria-label="Táblaméret"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>Mód: <select id="fo" onchange="load()" aria-label="Megoldások"><option value="1">csak az első megoldás</option><option value="0">összes megoldás</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4×4-es tábla lépésenként; az (1,1) kezdés két zsákutcába fut, az (1,2) kezdésből a (2, 4, 1, 3) megoldás adódik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.2 N-Queens-All pszeudokódja, 1-től indexelt tömbökkel. Kezdőállapot: n = 4, első megoldásig. Összes megoldás módban n = 4-re 2, n = 8-ra 92 megoldás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["Backtrack(r):", "    ha r > n: megoldások.hozzáad(queen); visszatér", "    minden c ∈ 1..n:", "        d1 ← r − c + n; d2 ← r + c − 1", "        ha col[c], diag1[d1], diag2[d2] mind hamis:", "            queen[r] ← c; col[c] ← diag1[d1] ← diag2[d2] ← igaz", "            Backtrack(r + 1)", "            col[c] ← diag1[d1] ← diag2[d2] ← hamis"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function queens(n, firstOnly){
  const col = new Array(n + 1).fill(false), d1 = new Array(2 * n).fill(false), d2 = new Array(2 * n).fill(false), q = [], st = [];
  let calls = 0, sols = 0, stop = false;
  const snap = (line, msg, extra) => st.push(Object.assign({n, q: q.slice(), col: col.slice(1), d1: d1.slice(1), d2: d2.slice(1), calls, sols, line, msg}, extra || {}));
  function bt(r){
    calls++;
    if (r > n) { sols++; snap(1, `${sols}. megoldás: (${q.join(", ")})`, {sol: true}); if (firstOnly) stop = true; return; }
    let placed = false;
    for (let c = 1; c <= n && !stop; c++) { const a = r - c + n, b = r + c - 1;
      if (!col[c] && !d1[a] && !d2[b]) { placed = true; q.push(c); col[c] = d1[a] = d2[b] = true;
        snap(5, `(${r},${c}) lerakva: col[${c}], diag1[${a}], diag2[${b}] ← igaz`);
        bt(r + 1); if (stop) return;
        col[c] = d1[a] = d2[b] = false; q.pop(); snap(7, `visszalépés: (${r},${c}) levéve, a tömbök visszaállítva`); } }
    if (!placed) snap(4, `${r}. sor: nincs szabad oszlop (minden c ütközik) → zsákutca`, {dead: r});
  }
  snap(0, `Kezdés: n = ${n}, minden tömb hamis`); bt(1);
  st.push({...st[st.length - 1], line: -1, dead: undefined, msg: `Vége: ${sols} megoldás, ${calls} rekurzív hívás` + (firstOnly ? " (első megoldásnál leállva)" : "")});
  return st;
}
function render(s){
  svg.innerHTML = ""; const n = s.n, z = Math.min(36, 280 / n), x0 = 30, y0 = 30;
  svg.setAttribute("viewBox", "0 0 560 330");
  el("defs", {}).innerHTML = ["0 0 0 8", "0 0 8 8", "0 8 8 0"].map((d, i) => { const [a, b, c, e] = d.split(" ");
    return `<pattern id="h${i}" width="8" height="8" patternUnits="userSpaceOnUse"><line x1="${i === 0 ? 4 : a}" y1="${b}" x2="${i === 0 ? 4 : c}" y2="${e}" stroke="${css("--fg")}" stroke-width="1"/></pattern>`; }).join("");
  const at = {}; s.q.forEach((c0, i) => { const r0 = i + 1; for (let r = 1; r <= n; r++) for (let c = 1; c <= n; c++) { if (r === r0 && c === c0) continue;
    const k = at[r + "," + c] = at[r + "," + c] || new Set(); if (c === c0) k.add(0); if (r - c === r0 - c0) k.add(1); if (r + c === r0 + c0) k.add(2); } });
  for (let r = 1; r <= n; r++) for (let c = 1; c <= n; c++) { const x = x0 + (c - 1) * z, y = y0 + (r - 1) * z, k = at[r + "," + c] || new Set(), isQ = s.q[r - 1] === c;
    el("rect", {x, y, width: z, height: z, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1});
    if (!isQ) k.forEach(i => el("rect", {x, y, width: z, height: z, fill: `url(#h${i})`, stroke: "none"}));
    if (isQ) el("text", {x: x + z / 2, y: y + z * 0.7, "text-anchor": "middle", "font-size": z * 0.6, "font-weight": "bold"}, "Q"); }
  for (let k = 1; k <= n; k++) { el("text", {x: x0 + (k - 0.5) * z, y: y0 - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, k);
    el("text", {x: x0 - 8, y: y0 + (k - 0.5) * z + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, k); }
  if (s.dead) el("rect", {x: x0, y: y0 + (s.dead - 1) * z, width: n * z, height: z, fill: "none", stroke: css("--hl2"), "stroke-width": 4});
  const tx = x0 + n * z + 24;
  [["col[1..n]", s.col], ["diag1[1..2n−1]", s.d1], ["diag2[1..2n−1]", s.d2]].forEach(([nm, a], j) => {
    el("text", {x: tx, y: y0 + 4 + j * 46, "font-size": 12}, nm);
    a.forEach((v, i) => { el("rect", {x: tx + i * 15, y: y0 + 10 + j * 46, width: 14, height: 16, fill: v ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 0.8});
      el("text", {x: tx + i * 15 + 7, y: y0 + 22 + j * 46, "text-anchor": "middle", "font-size": 10}, v ? "1" : "0"); }); });
  el("text", {x: tx, y: y0 + 160, "font-size": 13}, `queen = (${s.q.join(", ")})`);
  el("text", {x: tx, y: y0 + 182, "font-size": 13}, `rekurzív hívások: ${s.calls}`); el("text", {x: tx, y: y0 + 202, "font-size": 13}, `megoldások: ${s.sols}`);
  el("text", {x: 10, y: 322, "font-size": 11, fill: css("--muted")}, "minta: függőleges = oszlop · „\\” = főátló (r − c + n) · „/” = mellékátló (r + c − 1) · narancs keret = zsákutca-sor");
}
function load(){ setSteps(queens(+document.getElementById("n").value, document.getElementById("fo").value === "1")); }

STEPS = queens(4, true);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
