<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSD radix rekeszfa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szavak: <input id="inp" value="cat, cap, car, dog, do, apple" size="28" aria-label="Saját szólista"></label><label>cutoff: <input id="cut" type="range" min="1" max="6" value="1" style="width:90px" aria-label="cutoff" onchange="load()"> <span id="cutv">1</span></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span><div id="node" class="small" style="flex-basis:100%" aria-live="polite"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A cat, cap, car, dog, do, apple szavak rekurzív rekeszfája: az első karakter szerint a, c, d rekesz; a d alatt az o, majd a 0-s rekeszben a do, a g rekeszben a dog."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">15.2.9, 3.2: a hiányzó karakter a 0-s rekesz (∅), rá nincs rekurzió. Kezdőállapot: [cat, cap, car, dog, do, apple], cutoff = 1. Nagyobb cutoff mellett a kis csoportok stabil beszúró rendezéssel zárulnak (vastag keret, „beszúró” felirat).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": null, "done": [], "line": 0, "res": null, "msg": "Kezdet: L = [cat, cap, car, dog, do, apple], pos = 1, cutoff = 1"}, {"cur": 0, "done": [0], "line": 3, "res": null, "msg": "MSD([cat, cap, car, dog, do, apple], pos = 1): rekeszek a 1. karakter szerint – a: [apple]; c: [cat, cap, car]; d: [dog, do]"}, {"cur": 2, "done": [0, 2], "line": 3, "res": null, "msg": "MSD([cat, cap, car], pos = 2): rekeszek a 2. karakter szerint – a: [cat, cap, car]"}, {"cur": 4, "done": [0, 2, 4], "line": 3, "res": null, "msg": "MSD([cat, cap, car], pos = 3): rekeszek a 3. karakter szerint – p: [cap]; r: [car]; t: [cat]"}, {"cur": 3, "done": [0, 2, 4, 3], "line": 3, "res": null, "msg": "MSD([dog, do], pos = 2): rekeszek a 2. karakter szerint – o: [dog, do]"}, {"cur": 8, "done": [0, 2, 4, 3, 8], "line": 3, "res": null, "msg": "MSD([dog, do], pos = 3): rekeszek a 3. karakter szerint – ∅: [do]; g: [dog]"}, {"cur": null, "done": [0, 2, 4, 3, 8], "line": 9, "res": ["apple", "cap", "car", "cat", "do", "dog"], "msg": "Eredmény (a levelek balról jobbra): [apple, cap, car, cat, do, dog]"}];
const CODE = ["MSD_STRING_SORT(L, pos):   // b, cutoff adott", "  if |L| <= cutoff: return STABLE_SORT(L, pos)", "  buckets[0..b] = üres listák", "  for s in L: buckets[MSD_CHAR(s, pos)] += s", "  result = buckets[0]   // nincs rekurzió", "  for c = 1 to b:", "    if |buckets[c]| = 1: result += buckets[c]", "    else if |buckets[c]| > 1:", "      result += MSD_STRING_SORT(buckets[c], pos+1)", "  return result"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TREE = [{"id": 0, "w": ["cat", "cap", "car", "dog", "do", "apple"], "pos": 1, "key": null, "parent": null, "kind": "node", "ch": [1, 2, 3]}, {"id": 1, "w": ["apple"], "pos": 2, "key": "a", "parent": 0, "kind": "leaf", "ch": []}, {"id": 2, "w": ["cat", "cap", "car"], "pos": 2, "key": "c", "parent": 0, "kind": "node", "ch": [4]}, {"id": 3, "w": ["dog", "do"], "pos": 2, "key": "d", "parent": 0, "kind": "node", "ch": [8]}, {"id": 4, "w": ["cat", "cap", "car"], "pos": 3, "key": "a", "parent": 2, "kind": "node", "ch": [5, 6, 7]}, {"id": 5, "w": ["cap"], "pos": 4, "key": "p", "parent": 4, "kind": "leaf", "ch": []}, {"id": 6, "w": ["car"], "pos": 4, "key": "r", "parent": 4, "kind": "leaf", "ch": []}, {"id": 7, "w": ["cat"], "pos": 4, "key": "t", "parent": 4, "kind": "leaf", "ch": []}, {"id": 8, "w": ["dog", "do"], "pos": 3, "key": "o", "parent": 3, "kind": "node", "ch": [9, 10]}, {"id": 9, "w": ["do"], "pos": 4, "key": "∅", "parent": 8, "kind": "end", "ch": []}, {"id": 10, "w": ["dog"], "pos": 4, "key": "g", "parent": 8, "kind": "leaf", "ch": []}], SELN = null;
function nodeInfo(id){
  SELN = id; const N = TREE[id];
  const kind = {node: "rekurzív hívás", leaf: "levél (egyelemű rekesz)", end: "0-s rekesz: a szavak itt véget érnek, nincs rekurzió", cutoff: "cutoff alatti csoport: stabil beszúró rendezés"}[N.kind];
  document.getElementById("node").textContent = `Kijelölt csomópont: [${N.w.join(", ")}], pos = ${N.pos}` +
    (N.key ? `, rekesz: ${N.key === "∅" ? "∅ (0)" : "'" + N.key + "'"}` : ", gyökér") + ` – ${kind}` + (N.sorted ? ` → [${N.sorted.join(", ")}]` : "");
}
function layout(){
  const P = {}; let nx = 0;
  const walk = (id, d) => {
    const ch = TREE[id].ch, x0 = nx;
    if (!ch.length) { P[id] = [nx++, d, 1]; return P[id][0]; }
    const xs = ch.map(c => walk(c, d + 1));
    P[id] = [(Math.min(...xs) + Math.max(...xs)) / 2, d, nx - x0]; return P[id][0];
  };
  walk(0, 0);
  return [P, nx];
}
function render(s){
  svg.innerHTML = "";
  const [P, nl] = layout(), depth = Math.max(...Object.values(P).map(p => p[1]));
  const H = 70 + depth * 72 + 60;
  svg.setAttribute("viewBox", `0 0 560 ${H}`);
  const sx = 560 / Math.max(nl, 1), X = id => (P[id][0] + 0.5) * sx, Y = id => 34 + P[id][1] * 72;
  const vis = id => id === 0 || s.done.includes(TREE[id].parent);
  TREE.forEach(N => { if (N.parent !== null && vis(N.id)) {
    el("line", {x1: X(N.parent), y1: Y(N.parent) + 18, x2: X(N.id), y2: Y(N.id) - 14, stroke: css("--line"), "stroke-width": 1.3});
    el("text", {x: (X(N.parent) + X(N.id)) / 2 + (X(N.id) >= X(N.parent) ? 6 : -6), y: (Y(N.parent) + Y(N.id)) / 2 + 4,
                "text-anchor": X(N.id) >= X(N.parent) ? "start" : "end", "font-size": 13, "font-weight": "bold", fill: css("--hl2")},
       N.key === "∅" ? "∅" : "'" + N.key + "'");
  }});
  TREE.forEach(N => { if (!vis(N.id)) return;
    const leaf = N.kind === "leaf" || N.kind === "end", cut = N.kind === "cutoff" && s.done.includes(N.id);
    const t1 = (cut ? N.sorted : N.w).join(", "), t2 = leaf ? "" : (cut ? `beszúró, pos = ${N.pos}` : `pos = ${N.pos}`);
    const w = Math.min(P[N.id][2] * sx - 6, Math.max(56, 6.6 * Math.max(t1.length, t2.length) + 14)), h = leaf ? 26 : 38;
    const on = s.cur === N.id;
    el("rect", {x: X(N.id) - w/2, y: Y(N.id) - h/2, width: w, height: h, rx: 7, fill: N.kind === "end" ? css("--cellhl") : css("--cell"),
                stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : (leaf || cut ? 2.2 : 1.2),
                "stroke-dasharray": N.kind === "end" ? "4 3" : "none", style: "cursor:pointer", tabindex: 0, role: "button",
                "aria-label": "csomópont " + t1, onclick: `nodeInfo(${N.id})`, onkeydown: `if(event.key==='Enter')nodeInfo(${N.id})`});
    el("text", {x: X(N.id), y: Y(N.id) + (leaf ? 5 : -2), "text-anchor": "middle", "font-size": 12, "font-weight": leaf ? "bold" : "normal", "pointer-events": "none"}, t1);
    if (t2) el("text", {x: X(N.id), y: Y(N.id) + 13, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted"), "pointer-events": "none"}, t2);
  });
  if (s.res) el("text", {x: 280, y: H - 14, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "eredmény: " + s.res.join(", "));
  if (SELN !== null && SELN < TREE.length) nodeInfo(SELN); else document.getElementById("node").textContent = "Kattintson egy csomópontra a részleteihez.";
}
function ls(w){ return "[" + w.join(", ") + "]"; }
function msd(words, cutoff){
  const nodes = [], steps = [];
  const mk = (w, pos, key, parent, kind) => { nodes.push({id: nodes.length, w: w.slice(), pos, key, parent, kind, ch: []});
    if (parent !== null) nodes[parent].ch.push(nodes.length - 1); return nodes.length - 1; };
  mk(words, 1, null, null, "node");
  steps.push({cur: null, done: [], line: 0, res: null, msg: `Kezdet: L = ${ls(words)}, pos = 1, cutoff = ${cutoff}`});
  const done = [];
  const rec = nid => {
    const N = nodes[nid], L = N.w, pos = N.pos;
    if (L.length <= cutoff) {
      N.kind = "cutoff";
      N.sorted = L.slice().sort((a, b) => { const x = a.slice(pos - 1), y = b.slice(pos - 1); return x < y ? -1 : x > y ? 1 : 0; });
      done.push(nid);
      steps.push({cur: nid, done: done.slice(), line: 1, res: null,
                  msg: `MSD(${ls(L)}, pos = ${pos}): |L| = ${L.length} ≤ cutoff = ${cutoff} → stabil beszúró rendezés: ${ls(N.sorted)}`});
      return N.sorted;
    }
    const zero = L.filter(s => s.length < pos);
    const chars = [...new Set(L.filter(s => s.length >= pos).map(s => s[pos-1]))].sort();
    if (zero.length) mk(zero, pos + 1, "∅", nid, "end");
    chars.forEach(c => { const g = L.filter(s => s.length >= pos && s[pos-1] === c); mk(g, pos + 1, c, nid, g.length === 1 ? "leaf" : "node"); });
    done.push(nid);
    const desc = N.ch.map(c => `${nodes[c].key}: ${ls(nodes[c].w)}`).join("; ");
    steps.push({cur: nid, done: done.slice(), line: 3, res: null, msg: `MSD(${ls(L)}, pos = ${pos}): rekeszek a ${pos}. karakter szerint – ${desc}`});
    let res = [];
    N.ch.forEach(c => { const C = nodes[c]; res = res.concat(C.kind === "end" || C.kind === "leaf" ? C.w : rec(c)); });
    return res;
  };
  const res = rec(0);
  steps.push({cur: null, done: done.slice(), line: 9, res, msg: `Eredmény (a levelek balról jobbra): ${ls(res)}`});
  return [nodes, steps];
}
function load(){
  const e = document.getElementById("err");
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "");
  if (raw.length < 2 || raw.length > 8 || raw.some(x => x.length > 8)) { e.textContent = "2–8 szót adjon meg (szavanként legfeljebb 8 karakter)."; return; }
  const cut = +document.getElementById("cut").value;
  document.getElementById("cutv").textContent = String(cut);
  e.textContent = ""; SELN = null;
  const [t, st] = msd(raw, cut); TREE = t; setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
