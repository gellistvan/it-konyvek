<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max-flow = min-cut = 12</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A fő példahálózat az f áramlással (|f| = 12), az S = {s, a} vágás 5 + 3 + 4 = 12 kapacitással, és a maradék gráf, amelyben s-ből csak a érhető el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 25.1 négycsúcsú példája. A négy lehetséges s–t vágás kapacitása 15 ({s}), 12 ({s, a}), 20 ({s, b}) és 14 ({s, a, b}); f(S,T) mindegyikre 12 (lemma), az egyenlőség c(S,T)-vel csak a minimális vágásnál áll.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const CAP = {"s-a": 10, "s-b": 5, "a-b": 3, "a-t": 4, "b-t": 10};
const F = {"s-a": 7, "s-b": 5, "a-b": 3, "a-t": 4, "b-t": 8};
const POS = {s: [70, 160], a: [270, 60], b: [270, 260], t: [470, 160]};
let SS = new Set(["s", "a"]);
function resid(){ const r = {}; for (const k in CAP) { const [u, v] = k.split("-"); if (CAP[k] - F[k] > 0) r[k] = CAP[k] - F[k]; if (F[k] > 0) r[v + "-" + u] = F[k]; } return r; }
function reach(){ const r = resid(), R = new Set(["s"]), st = ["s"]; while (st.length) { const u = st.pop(); for (const k in r) { const [x, y] = k.split("-"); if (x === u && !R.has(y)) { R.add(y); st.push(y); } } } return R; }
function cutInfo(){ let c = 0, f = 0; const ce = [], back = [];
  for (const k in CAP) { const [u, v] = k.split("-"); if (SS.has(u) && !SS.has(v)) { c += CAP[k]; f += F[k]; ce.push(k); } if (!SS.has(u) && SS.has(v)) { f -= F[k]; back.push(k); } }
  return {c, f, ce, back}; }
function build(){
  const I = cutInfo(), Sn = "{" + [...SS].sort((x, y) => "sabt".indexOf(x) - "sabt".indexOf(y)).join(", ") + "}", Tn = "{" + ["s","a","b","t"].filter(x => !SS.has(x)).join(", ") + "}";
  return [
    {view: "G", cut: false, msg: "G az f áramlással: |f| = f(s,a) + f(s,b) = 7 + 5 = 12 (kimenő oldalon 4 + 8 = 12)."},
    {view: "G", cut: true, msg: `Vágás S = ${Sn} | T = ${Tn}: c(S,T) = ${I.ce.map(k => CAP[k]).join(" + ") || 0} = ${I.c}; f(S,T) = ${I.f}` + (I.back.length ? ` (a T → S élek, ${I.back.join(", ").replaceAll("-", "→")}, áramlása levonva; kapacitásuk nem számít)` : "") + ". " + (I.c === 12 ? "|f| = c(S,T): ez minimális vágás." : `|f| = 12 < c(S,T) = ${I.c}: nem minimális.`)},
    {view: "Gf", cut: false, msg: "A maradék gráf G_f: előremutató s→a (3), b→t (2); visszamutató a→s (7), b→s (5), b→a (3), t→a (4), t→b (8) – 7 él."},
    {view: "Gf", cut: false, reach: true, msg: "s-ből a maradék gráfban csak a érhető el (s→a, 3); a-ból az a→b és a→t telített. Az elérhető halmaz {s, a} éppen a minimális vágás S oldala; nincs növelő út, f maximális."}];
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 348"); G_defs();
  const I = cutInfo();
  if (s.reach) for (const v of reach()) el("circle", {cx: POS[v][0], cy: POS[v][1], r: 32, fill: "url(#dp)", stroke: "none"});
  for (const v of SS) if (s.cut) el("circle", {cx: POS[v][0], cy: POS[v][1], r: 27, fill: css("--cellhl"), stroke: css("--fg"), "stroke-dasharray": "5 3"});
  if (s.view === "G") for (const k in CAP) { const [u, v] = k.split("-"), ce = s.cut && I.ce.includes(k), bk = s.cut && I.back.includes(k);
    G_edge(POS[u], POS[v], {r: 18, dir: true, w: ce ? 4.5 : 1.5, dash: bk ? "3 4" : "", color: ce ? css("--hl2") : undefined, label: `${F[k]}/${CAP[k]}`}); }
  else { const r = resid(); for (const k in r) { const [u, v] = k.split("-"), back = !(k in CAP), both = (v + "-" + u) in r;
    G_edge(POS[u], POS[v], {r: 18, dir: true, dash: back ? "7 5" : "", w: 1.6, curve: both ? 26 : 0, label: r[k]}); } }
  for (const v of ["s", "a", "b", "t"]) { const c = G_node(POS[v], v, {r: 18, w: SS.has(v) ? 2.6 : 1.5});
    if (v === "a" || v === "b") G_click(c, () => { if (SS.has(v)) SS.delete(v); else SS.add(v); setSteps(build()); show(1); }, `${v} áthelyezése a vágás másik oldalára`); }
  G_text(10, 312, `S = {${[...SS].join(", ")}} · c(S,T) = ${I.c} · f(S,T) = ${I.f} · |f| = 12`, {size: 13, bold: true});
  G_text(10, 328, "Kattints a-ra vagy b-re: S ↔ T. Szürke = S, narancs = vágásél (S→T), pontozott = T→S él;", {size: 10.5, fill: css("--muted")});
  G_text(10, 342, "G_f-ben szaggatott = visszamutató maradék él, pöttyös háttér = s-ből elérhető.", {size: 10.5, fill: css("--muted")});
}

STEPS = build();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
