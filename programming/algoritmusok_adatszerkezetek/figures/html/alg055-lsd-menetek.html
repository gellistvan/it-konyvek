<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSD radix rendezés rekeszekkel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját kulcsok: <input id="inp" value="329, 457, 657, 839, 436, 720, 355" size="30" aria-label="Saját kulcsok"></label><label><input id="uns" type="checkbox" onchange="load()"> instabil (rekeszen belül fordított sorrend)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A hét kulcs menetenként az egyesek, a tízesek, majd a százasok szerint rekeszekbe kerül; a rekeszek sorrendben ürülnek, a rekeszen belüli sorrend a korábbi menet sorrendje."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">b = 10, d = 3 (15.2.3). Kezdőállapot: [329, 457, 657, 839, 436, 720, 355]. Felül az aktuális sorrend a sorszámokkal, alul a rekeszek; a kártya sarkában a menet előtti sorszám. Az „instabil” kapcsoló a rekeszen belül fordítva ürít, és hibás végeredményt ad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [], [], [], []], "cur": null, "phase": "start", "line": 0, "msg": "Kezdet: A = [329, 457, 657, 839, 436, 720, 355], b = 10, d = 3"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [], [], [], [[329, 1]]], "cur": 1, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 329 (előző sorszám 1), jegy = 9 → rekesz 9"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [], [[457, 2]], [], [[329, 1]]], "cur": 2, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 457 (előző sorszám 2), jegy = 7 → rekesz 7"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [], [[457, 2], [657, 3]], [], [[329, 1]]], "cur": 3, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 657 (előző sorszám 3), jegy = 7 → rekesz 7"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [], [[457, 2], [657, 3]], [], [[329, 1], [839, 4]]], "cur": 4, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 839 (előző sorszám 4), jegy = 9 → rekesz 9"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[], [], [], [], [], [], [[436, 5]], [[457, 2], [657, 3]], [], [[329, 1], [839, 4]]], "cur": 5, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 436 (előző sorszám 5), jegy = 6 → rekesz 6"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[[720, 6]], [], [], [], [], [], [[436, 5]], [[457, 2], [657, 3]], [], [[329, 1], [839, 4]]], "cur": 6, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 720 (előző sorszám 6), jegy = 0 → rekesz 0"}, {"k": 1, "seq": [329, 457, 657, 839, 436, 720, 355], "bk": [[[720, 6]], [], [], [], [], [[355, 7]], [[436, 5]], [[457, 2], [657, 3]], [], [[329, 1], [839, 4]]], "cur": 7, "phase": "place", "line": 4, "msg": "1. menet (egyesek): 355 (előző sorszám 7), jegy = 5 → rekesz 5"}, {"k": 1, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[[720, 6]], [], [], [], [], [[355, 7]], [[436, 5]], [[457, 2], [657, 3]], [], [[329, 1], [839, 4]]], "cur": null, "phase": "collect", "line": 5, "msg": "1. menet vége: a rekeszek kiürítése sorrendben → [720, 355, 436, 457, 657, 329, 839]"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1]], [], [], [], [], [], [], []], "cur": 1, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 720 (előző sorszám 1), jegy = 2 → rekesz 2"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1]], [], [], [[355, 2]], [], [], [], []], "cur": 2, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 355 (előző sorszám 2), jegy = 5 → rekesz 5"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1]], [[436, 3]], [], [[355, 2]], [], [], [], []], "cur": 3, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 436 (előző sorszám 3), jegy = 3 → rekesz 3"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1]], [[436, 3]], [], [[355, 2], [457, 4]], [], [], [], []], "cur": 4, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 457 (előző sorszám 4), jegy = 5 → rekesz 5"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1]], [[436, 3]], [], [[355, 2], [457, 4], [657, 5]], [], [], [], []], "cur": 5, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 657 (előző sorszám 5), jegy = 5 → rekesz 5"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1], [329, 6]], [[436, 3]], [], [[355, 2], [457, 4], [657, 5]], [], [], [], []], "cur": 6, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 329 (előző sorszám 6), jegy = 2 → rekesz 2"}, {"k": 2, "seq": [720, 355, 436, 457, 657, 329, 839], "bk": [[], [], [[720, 1], [329, 6]], [[436, 3], [839, 7]], [], [[355, 2], [457, 4], [657, 5]], [], [], [], []], "cur": 7, "phase": "place", "line": 4, "msg": "2. menet (tízesek): 839 (előző sorszám 7), jegy = 3 → rekesz 3"}, {"k": 2, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [[720, 1], [329, 6]], [[436, 3], [839, 7]], [], [[355, 2], [457, 4], [657, 5]], [], [], [], []], "cur": null, "phase": "collect", "line": 5, "msg": "2. menet vége: a rekeszek kiürítése sorrendben → [720, 329, 436, 839, 355, 457, 657]"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [], [], [], [], [[720, 1]], [], []], "cur": 1, "phase": "place", "line": 4, "msg": "3. menet (százasok): 720 (előző sorszám 1), jegy = 7 → rekesz 7"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2]], [], [], [], [[720, 1]], [], []], "cur": 2, "phase": "place", "line": 4, "msg": "3. menet (százasok): 329 (előző sorszám 2), jegy = 3 → rekesz 3"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2]], [[436, 3]], [], [], [[720, 1]], [], []], "cur": 3, "phase": "place", "line": 4, "msg": "3. menet (százasok): 436 (előző sorszám 3), jegy = 4 → rekesz 4"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2]], [[436, 3]], [], [], [[720, 1]], [[839, 4]], []], "cur": 4, "phase": "place", "line": 4, "msg": "3. menet (százasok): 839 (előző sorszám 4), jegy = 8 → rekesz 8"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2], [355, 5]], [[436, 3]], [], [], [[720, 1]], [[839, 4]], []], "cur": 5, "phase": "place", "line": 4, "msg": "3. menet (százasok): 355 (előző sorszám 5), jegy = 3 → rekesz 3"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2], [355, 5]], [[436, 3], [457, 6]], [], [], [[720, 1]], [[839, 4]], []], "cur": 6, "phase": "place", "line": 4, "msg": "3. menet (százasok): 457 (előző sorszám 6), jegy = 4 → rekesz 4"}, {"k": 3, "seq": [720, 329, 436, 839, 355, 457, 657], "bk": [[], [], [], [[329, 2], [355, 5]], [[436, 3], [457, 6]], [], [[657, 7]], [[720, 1]], [[839, 4]], []], "cur": 7, "phase": "place", "line": 4, "msg": "3. menet (százasok): 657 (előző sorszám 7), jegy = 6 → rekesz 6"}, {"k": 3, "seq": [329, 355, 436, 457, 657, 720, 839], "bk": [[], [], [], [[329, 2], [355, 5]], [[436, 3], [457, 6]], [], [[657, 7]], [[720, 1]], [[839, 4]], []], "cur": null, "phase": "collect", "line": 5, "msg": "3. menet vége: a rekeszek kiürítése sorrendben → [329, 355, 436, 457, 657, 720, 839] – rendezett"}];
const CODE = ["LSD_RADIX(A, d, b):", "  for k = 1 to d:   // egyes, tízes, ...", "    rekesz[0..b-1] = üres listák", "    for x in A (sorrendben):", "      rekesz[jegy_k(x)].append(x)", "    A = rekesz[0] + ... + rekesz[b-1]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PLACE = ["egyesek", "tízesek", "százasok", "ezresek", "tízezresek"];
function render(s){
  svg.setAttribute("viewBox", "0 0 560 295");
  svg.innerHTML = "";
  const n = s.seq.length, k = s.k;
  // felül: az aktuális sorrend (place: a menet előtti; collect/start: az új)
  const w = Math.min(54, 520 / n), xs = (560 - n * w) / 2;
  s.seq.forEach((x, q) => {
    const on = s.phase === "place" && s.cur === q + 1, done = s.phase === "place" && q + 1 < s.cur;
    el("rect", {x: xs + q*w + 2, y: 34, width: w - 4, height: 28, fill: on ? css("--cellhl") : css("--cell"),
                stroke: css("--line"), "stroke-width": on ? 3 : 1.2, opacity: done ? 0.35 : 1});
    el("text", {x: xs + (q+0.5)*w, y: 54, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", opacity: done ? 0.35 : 1}, String(x));
    el("text", {x: xs + (q+0.5)*w, y: 76, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(q + 1));
  });
  el("text", {x: 280, y: 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"},
     k === 0 ? "bemenet" : `${k}. menet (${PLACE[k-1]})` + (s.phase === "collect" ? " – kiürítés után" : ""));
  if (k === 0) return;
  const bw = 54, x0 = 10, yb = 270;
  for (let c = 0; c < 10; c++) {
    const X = x0 + c * bw;
    el("path", {d: `M${X+3},${yb-150} L${X+3},${yb} L${X+bw-3},${yb} L${X+bw-3},${yb-150}`, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: X + bw/2, y: yb + 16, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, String(c));
    s.bk[c].forEach(([x, q], h) => {
      const yy = yb - 27 - h * 27, last = s.phase === "place" && q === s.cur;
      el("rect", {x: X + 4, y: yy, width: bw - 8, height: 24, fill: last ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": last ? 2.5 : 1});
      const t = String(x), pos = t.length - k;
      const tx = el("text", {x: X + bw/2 - 4, y: yy + 16, "text-anchor": "middle", "font-size": 14});
      const a = document.createElementNS(NS, "tspan"); a.textContent = pos > 0 ? t.slice(0, pos) : ""; a.setAttribute("fill", css("--muted")); tx.appendChild(a);
      const b = document.createElementNS(NS, "tspan"); b.textContent = pos >= 0 ? t[pos] : "0"; b.setAttribute("font-weight", "bold"); b.setAttribute("text-decoration", "underline"); tx.appendChild(b);
      const d = document.createElementNS(NS, "tspan"); d.textContent = pos >= 0 ? t.slice(pos + 1) : t; d.setAttribute("fill", css("--muted")); tx.appendChild(d);
      el("text", {x: X + bw - 8, y: yy + 9, "text-anchor": "end", "font-size": 8.5, "font-style": "italic"}, String(q));
    });
  }
}
function arr(a){ return "[" + a.join(", ") + "]"; }
function digit(x, k){ return Math.floor(x / Math.pow(10, k - 1)) % 10; }
function lsd(a, unstable){
  const D = Math.max(String(Math.max(...a)).length, 1);
  let seq = a.slice();
  const emp = () => Array.from({length: 10}, () => []);
  const out = [{k: 0, seq: seq.slice(), bk: emp(), cur: null, phase: "start", line: 0, msg: `Kezdet: A = ${arr(seq)}, b = 10, d = ${D}`}];
  for (let k = 1; k <= D; k++) {
    const bk = emp();
    seq.forEach((x, i) => {
      const q = i + 1, c = digit(x, k);
      bk[c].push([x, q]);
      out.push({k, seq: seq.slice(), bk: bk.map(b => b.map(e => e.slice())), cur: q, phase: "place", line: 4,
                msg: `${k}. menet (${PLACE[k-1]}): ${x} (előző sorszám ${q}), jegy = ${c} → rekesz ${c}`});
    });
    let ns = [];
    bk.forEach(b => { const bb = unstable ? b.slice().reverse() : b; ns = ns.concat(bb.map(e => e[0])); });
    seq = ns;
    out.push({k, seq: seq.slice(), bk: bk.map(b => b.map(e => e.slice())), cur: null, phase: "collect", line: 5,
              msg: `${k}. menet vége: a rekeszek kiürítése sorrendben → ${arr(seq)}`});
  }
  const ok = seq.every((x, i) => i === 0 || seq[i-1] <= x);
  out[out.length-1].msg += ok ? " – rendezett" : " – NEM rendezett (az instabil szétosztás elrontja a korábbi menetek munkáját)";
  return out;
}
function load(){
  const e = document.getElementById("err");
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (raw.length < 2 || raw.length > 9 || raw.some(x => !Number.isInteger(x) || x < 0 || x > 99999)) { e.textContent = "2–9 darab 0 és 99999 közötti egész számot adjon meg (rekeszenként legfeljebb 6 fér el)."; return; }
  e.textContent = ""; setSteps(lsd(raw, document.getElementById("uns").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
