<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treap-beszúrás forgatásokkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kulcs <input id="key" value="CA" size="4" aria-label="Kulcs"></label><label>prioritás <input id="pri" value="65" size="4" aria-label="Prioritás"></label><button onclick="ins()">Beszúrás</button><button onclick="reset()">Alaphelyzet (BB, 80)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Treap: a BB (80) BST-beszúrással a C bal gyermeke lesz, majd jobbra forgatás C-nél és balra forgatás B-nél után a D (90) bal gyermeke, gyermekei B (60) és C (40)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Max-kupac a prioritásra, a kulcsok szótári sorrendben. Kezdőállapot: a kiinduló treap, majd 4 lépés. A saját beszúrás az aktuális (utolsó) fához ad hozzá; a jelzők a BST- és a kupacinvariánst szöveggel is mutatják.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": ["D", 90, ["B", 60, ["A", 20, null, null], ["C", 40, null, null]], ["F", 70, ["E", 30, null, null], null]], "new": "BB", "mark": null, "kind": null, "line": 0, "depth": 0, "msg": "Kiinduló treap; beszúrandó: BB (prioritás 80)", "ino": ["A", "B", "C", "D", "E", "F"], "bst": true, "heap": true}, {"tree": ["D", 90, ["B", 60, ["A", 20, null, null], ["C", 40, ["BB", 80, null, null], null]], ["F", 70, ["E", 30, null, null], null]], "new": "BB", "mark": ["C", "BB"], "kind": "bad", "line": 2, "depth": 3, "msg": "BST-beszúrás: BB (80) a C (40) bal gyermeke; 80 > 40 → a kupactulajdonság sérül", "ino": ["A", "B", "BB", "C", "D", "E", "F"], "bst": true, "heap": false}, {"tree": ["D", 90, ["B", 60, ["A", 20, null, null], ["BB", 80, null, ["C", 40, null, null]]], ["F", 70, ["E", 30, null, null], null]], "new": "BB", "mark": ["BB", "C"], "kind": "rot", "line": 6, "depth": 2, "msg": "BB.priority = 80 > szülő (40) → RotateRight(C): BB kerül C helyére (C lesz a jobb gyermeke); még sérül: 80 > 60", "ino": ["A", "B", "BB", "C", "D", "E", "F"], "bst": true, "heap": false}, {"tree": ["D", 90, ["BB", 80, ["B", 60, ["A", 20, null, null], null], ["C", 40, null, null]], ["F", 70, ["E", 30, null, null], null]], "new": "BB", "mark": ["BB", "B"], "kind": "rot", "line": 10, "depth": 1, "msg": "BB.priority = 80 > szülő (60) → RotateLeft(B): BB kerül B helyére (B lesz a bal gyermeke)", "ino": ["A", "B", "BB", "C", "D", "E", "F"], "bst": true, "heap": true}, {"tree": ["D", 90, ["BB", 80, ["B", 60, ["A", 20, null, null], null], ["C", 40, null, null]], ["F", 70, ["E", 30, null, null], null]], "new": "BB", "mark": null, "kind": "done", "line": 5, "depth": 0, "msg": "BB.priority = 80 < szülő (90) → nincs forgatás; kész: BB a D bal gyermeke", "ino": ["A", "B", "BB", "C", "D", "E", "F"], "bst": true, "heap": true}];
const CODE = ["TreapInsert(root, key):", "    if root == NIL:", "        return newNode(key, RandomPriority())", "    if key < root.key:", "        root.left = TreapInsert(root.left, key)", "        if root.left.priority > root.priority:", "            root = RotateRight(root)", "    else:", "        root.right = TreapInsert(root.right, key)", "        if root.right.priority > root.priority:", "            root = RotateLeft(root)", "    return root"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const INIT = ["D", 90, ["B", 60, ["A", 20, null, null], ["C", 40, null, null]], ["F", 70, ["E", 30, null, null], null]], FINAL = ["D", 90, ["BB", 80, ["B", 60, ["A", 20, null, null], null], ["C", 40, null, null]], ["F", 70, ["E", 30, null, null], null]];
const clone = t => t === null ? null : [t[0], t[1], clone(t[2]), clone(t[3])];
const inorder = t => t === null ? [] : inorder(t[2]).concat([t[0]], inorder(t[3]));
const heapOk = t => t === null || ([t[2], t[3]].every(c => c === null || c[1] < t[1]) && heapOk(t[2]) && heapOk(t[3]));
const bstOk = t => { const s = inorder(t); return s.every((a, i) => i === 0 || s[i-1] < a); };
function insertSteps(root0, k, p){
  const steps = [], H = {root: clone(root0)};
  const snap = (line, depth, msg, mark, kind) => { const r = H.root; steps.push({tree: clone(r), new: k, mark: mark || null, kind: kind || null, line, depth, msg, ino: inorder(r), bst: bstOk(r), heap: heapOk(r)}); };
  snap(0, 0, `Kiinduló treap; beszúrandó: ${k} (prioritás ${p})`);
  let dup = false;
  function rec(t, depth, parent, side){
    if (t === null) { const node = [k, p, null, null];
      if (parent === null) H.root = node; else parent[side] = node;
      const par = parent ? `a ${parent[0]} (${parent[1]}) ${side === 2 ? "bal" : "jobb"} gyermeke` : "a gyökér";
      const bad = parent && p > parent[1];
      snap(2, depth, `BST-beszúrás: ${k} (${p}) ${par}` + (bad ? `; ${p} > ${parent[1]} → a kupactulajdonság sérül` : ""), bad ? [parent[0], k] : null, "bad");
      return node; }
    if (k === t[0]) { dup = true; snap(11, depth, `${k} már szerepel; a fa változatlan`); return t; }
    const s = k < t[0] ? 2 : 3, child = rec(t[s], depth + 1, t, s); t[s] = child;
    if (!dup && child[1] > t[1]) { let y, line, nm;
      if (s === 2) { y = t[2]; t[2] = y[3]; y[3] = t; line = 6; nm = "RotateRight"; }
      else { y = t[3]; t[3] = y[2]; y[2] = t; line = 10; nm = "RotateLeft"; }
      if (parent === null) H.root = y; else parent[side] = y;
      const still = parent !== null && y[1] > parent[1];
      snap(line, depth, `${y[0]}.priority = ${y[1]} > szülő (${t[1]}) → ${nm}(${t[0]}): ${y[0]} kerül ${t[0]} helyére (${t[0]} lesz a ${s === 2 ? "jobb" : "bal"} gyermeke)` + (still ? `; még sérül: ${y[1]} > ${parent[1]}` : ""), [y[0], t[0]], "rot");
      return y; }
    return t;
  }
  rec(H.root, 0, null, null);
  if (dup) return steps;
  const path = []; let t = H.root;
  while (t !== null && t[0] !== k) { path.push(t); t = k < t[0] ? t[2] : t[3]; }
  if (path.length) { const par = path[path.length - 1], l = par[2] === t;
    snap(l ? 5 : 9, path.length - 1, `${k}.priority = ${p} < szülő (${par[1]}) → nincs forgatás; kész: ${k} a ${par[0]} ${l ? "bal" : "jobb"} gyermeke`, null, "done"); }
  else snap(11, 0, `${k} a gyökér; kész`, null, "done");
  return steps;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 600 330");
  svg.innerHTML = "";
  const pos = {}, pr = {}; let n = 0;
  (function w(t, d){ if (t === null) return; w(t[2], d + 1); pos[t[0]] = [n++, d]; pr[t[0]] = t[1]; w(t[3], d + 1); })(s.tree, 0);
  const dx = Math.min(78, 560 / Math.max(n, 1)), x0 = 300 - (n - 1) * dx / 2, P = {};
  for (const key in pos) P[key] = [x0 + pos[key][0] * dx, 34 + pos[key][1] * 62];
  (function ed(t){ if (t === null) return; for (const c of [t[2], t[3]]) if (c !== null) {
      const on = s.mark && ((s.mark[0] === t[0] && s.mark[1] === c[0]) || (s.mark[1] === t[0] && s.mark[0] === c[0])), bad = on && s.kind === "bad";
      el("line", {x1: P[t[0]][0], y1: P[t[0]][1], x2: P[c[0]][0], y2: P[c[0]][1], stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 4 : 1.3, "stroke-dasharray": bad ? "6 4" : "none"});
      if (bad) el("text", {x: (P[t[0]][0] + P[c[0]][0]) / 2 + 10, y: (P[t[0]][1] + P[c[0]][1]) / 2, "font-size": 20, "font-weight": "bold"}, "!");
      ed(c); } })(s.tree);
  for (const key in P) { const [x, y] = P[key], nw = key === s.new;
    el("circle", {cx: x, cy: y, r: 23, fill: nw ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.3});
    if (nw) el("circle", {cx: x, cy: y, r: 28, fill: "none", stroke: css("--hl"), "stroke-width": 2});
    el("text", {x, y: y - 2, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, key);
    el("text", {x, y: y + 13, "text-anchor": "middle", "font-size": 11}, String(pr[key])); }
  const ok = (b, nm) => el("text", {x: nm === "BST" ? 330 : 470, y: 318, "font-size": 13, "font-weight": "bold", fill: b ? "#2e7d32" : "#c62828"}, (b ? "● " : "▲ ") + nm + (b ? ": rendben" : ": sérül"));
  el("text", {x: 8, y: 298, "font-size": 13}, "inorder: " + s.ino.join(", "));
  el("text", {x: 8, y: 318, "font-size": 12, fill: css("--muted")}, "rekurziós szint: " + s.depth);
  ok(s.bst, "BST"); ok(s.heap, "kupac");
}
let ROOT = FINAL;
function ins(){
  const k = document.getElementById("key").value.trim(), p = parseInt(document.getElementById("pri").value, 10), e = document.getElementById("err");
  if (!/^[A-Za-z]{1,3}$/.test(k) || isNaN(p)) { e.textContent = "Kulcs: 1–3 betű (szótári sorrend); prioritás: egész szám."; return; }
  if (inorder(ROOT).length >= 12) { e.textContent = "Legfeljebb 12 csúcs (az Alaphelyzet visszaállítja a kiinduló fát)."; return; }
  if (inorder(ROOT).length) { const pr = []; (function w(t){ if (t) { pr.push(t[1]); w(t[2]); w(t[3]); } })(ROOT); if (pr.includes(p)) { e.textContent = "A prioritások legyenek különbözők."; return; } }
  e.textContent = ""; const st = insertSteps(ROOT, k, p); ROOT = st[st.length - 1].tree; setSteps(st);
}
function reset(){ ROOT = INIT; document.getElementById("err").textContent = ""; setSteps(insertSteps(INIT, "BB", 80)); ROOT = FINAL; }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
