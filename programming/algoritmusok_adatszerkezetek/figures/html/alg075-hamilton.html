<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamilton-kör backtracking</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="preset('ex')">Példagráf</button><button onclick="preset('star')">Csillag K₁,₄</button><span class="small">Él be/ki: kattintson két csúcsra.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Ötcsúcsú gráf; a backtracking a path-t 0, 1, 2, 3, 4 sorrendben építi, majd a 4–0 záróéllel kört kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.2 Hamilton-kor pszeudokódja rendezett szomszédsági listákkal, a 0 rögzítve. Kezdőállapot: a 20.2.10 példagráfja; a végeredmény [0, 1, 2, 3, 4].</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1, "path": [0], "visited": []}];
const CODE = ["Keres(u, mélység):", "    ha mélység == n:", "        ha 0 ∈ adj[u]: return path másolata", "        return HIÁNY", "    minden v ∈ adj[u]:", "        ha visited[v] hamis:", "            path.hozzáad(v); visited[v] ← igaz", "            eredmény ← Keres(v, mélység + 1); ha nem HIÁNY: return", "            visited[v] ← hamis; path.töröl_utolsó()", "    return HIÁNY"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let N = 5, E = [], SEL = null;
const PP = k => [150 + 110 * Math.cos(-Math.PI / 2 - 2 * Math.PI * k / N), 150 + 110 * Math.sin(-Math.PI / 2 - 2 * Math.PI * k / N)];
function ham(){
  const adj = Array.from({length: N}, () => []); E.forEach(([u, v]) => { adj[u].push(v); adj[v].push(u); }); adj.forEach(a => a.sort((x, y) => x - y));
  const vis = new Array(N).fill(false), path = [0], st = []; vis[0] = true;
  st.push({path: [0], visited: vis.slice(), line: 0, msg: "Kezdés: path = [0], visited[0] = igaz"});
  let guard = 0;
  function keres(u, d){
    if (++guard > 3000) return null;
    if (d === N) { const ok = adj[u].includes(0); st.push({path: path.slice(), visited: vis.slice(), line: ok ? 2 : 3, closed: ok, msg: `mélység = n = ${N}: záró él ${u}–0 ` + (ok ? `létezik → kör: [${path.join(", ")}]` : "nincs → HIÁNY, visszalépés")}); return ok ? path.slice() : null; }
    for (const v of adj[u]) if (!vis[v]) { path.push(v); vis[v] = true; st.push({path: path.slice(), visited: vis.slice(), line: 6, msg: `${u} → ${v}: path = [${path.join(", ")}]`});
      const r = keres(v, d + 1); if (r) return r; vis[v] = false; path.pop(); st.push({path: path.slice(), visited: vis.slice(), line: 8, msg: `visszalépés: ${v} levéve, path = [${path.join(", ")}]`}); }
    st.push({path: path.slice(), visited: vis.slice(), line: 9, msg: `${u}: nincs több látogatatlan szomszéd → HIÁNY`}); return null;
  }
  const r = N < 3 ? null : keres(0, 1);
  st.push({...st[st.length - 1], line: -1, msg: r ? `Eredmény: [${r.join(", ")}]` : "Eredmény: HIÁNY (nincs Hamilton-kör)" + (adj.some(a => a.length < 2) ? ` – van 2-nél kisebb fokú csúcs` : "")});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const onP = new Set(); for (let i = 0; i + 1 < s.path.length; i++) onP.add(Math.min(s.path[i], s.path[i + 1]) + "-" + Math.max(s.path[i], s.path[i + 1]));
  if (s.closed) onP.add(Math.min(0, s.path[s.path.length - 1]) + "-" + Math.max(0, s.path[s.path.length - 1]));
  E.forEach(([u, v]) => { const [x0, y0] = PP(u), [x1, y1] = PP(v), on = onP.has(Math.min(u, v) + "-" + Math.max(u, v));
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 5 : 1.4}); });
  for (let k = 0; k < N; k++) { const [x, y] = PP(k), cur = s.path[s.path.length - 1] === k;
    const c = el("circle", {cx: x, cy: y, r: 18, fill: s.visited[k] ? css("--cellhl") : css("--cell"), stroke: SEL === k ? css("--hl2") : (cur ? css("--hl") : css("--line")), "stroke-width": cur || SEL === k ? 4 : 1.4});
    c.style.cursor = "pointer"; c.addEventListener("click", () => pick(k));
    const t = el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, String(k)); t.style.pointerEvents = "none"; }
  el("text", {x: 320, y: 40, "font-size": 14}, "path = [" + s.path.join(", ") + "]");
  el("text", {x: 320, y: 70, "font-size": 13}, "visited:");
  s.visited.forEach((v, i) => { el("rect", {x: 320 + i * 30, y: 80, width: 28, height: 24, fill: v ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    el("text", {x: 334 + i * 30, y: 97, "text-anchor": "middle", "font-size": 12}, v ? "i" : "h"); el("text", {x: 334 + i * 30, y: 120, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, i); });
  el("text", {x: 320, y: 160, "font-size": 12, fill: css("--muted")}, "narancs = a path élei (a végén a záróél is)");
  el("text", {x: 320, y: 180, "font-size": 12, fill: css("--muted")}, "szürke csúcs = visited · i = igaz, h = hamis");
  el("text", {x: 320, y: 210, "font-size": 12, fill: css("--muted")}, "Gráfszerkesztés: kattintson két csúcsra,");
  el("text", {x: 320, y: 228, "font-size": 12, fill: css("--muted")}, "az él be-/kikapcsol (a futás újraindul).");
}
function pick(w){ if (SEL === null) { SEL = w; show(k); return; } if (SEL !== w) { const i = E.findIndex(([u, v]) => (u === SEL && v === w) || (u === w && v === SEL));
    if (i >= 0) E.splice(i, 1); else E.push([Math.min(SEL, w), Math.max(SEL, w)]); } SEL = null; setSteps(ham()); }
function preset(name){ N = 5; SEL = null; E = name === "star" ? [[0,1],[0,2],[0,3],[0,4]] : [[0,1],[0,2],[0,4],[1,2],[1,3],[2,3],[2,4],[3,4]]; setSteps(ham()); }

E = [[0, 1], [0, 2], [0, 4], [1, 2], [1, 3], [2, 3], [2, 4], [3, 4]]; STEPS = ham();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
