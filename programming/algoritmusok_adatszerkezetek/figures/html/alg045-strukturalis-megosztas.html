<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strukturális megosztás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span class="small">verzió:</span><button onclick="pick('s1')">s1</button><button onclick="pick('s2')">s2</button><button onclick="pick('s3')">s3</button><button onclick="pick(null)">aktuális</button><label>BST kulcs: <input id="bk" value="22" size="3" aria-label="Beszúrandó kulcs"></label><button onclick="insB()">Beszúrás (path copying)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Perzisztens verem három csomóponttal és négy verzióval, alatta path copying BST-ben: a 27 beszúrása négy új csomópontot hoz létre, a 10-es részfa megosztott."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A régi csomópontok soha nem módosulnak. Kezdőállapot: a 12.4.3 példája (s0–s3, pop(s2), pop(s3)) és a BST {20, 10, 30, 25} + 27. A saját kulcs a legutóbbi BST-verzióba szúr; a verziógomb a kiválasztott veremverzióból elérhető csomópontokat emeli ki.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 0, "ver": "s0", "stk": [], "cur": null, "msg": "s0 = empty_stack(): üres verem (NIL)"}, {"line": 1, "ver": "s1", "stk": [["s1", 10, null]], "cur": "s1", "msg": "s1 = push(s0, 10): új csomópont [10], next = NIL"}, {"line": 1, "ver": "s2", "stk": [["s1", 10, null], ["s2", 20, "s1"]], "cur": "s2", "msg": "s2 = push(s1, 20): új csomópont [20], next → [10] (megosztva s1-gyel)"}, {"line": 1, "ver": "s3", "stk": [["s1", 10, null], ["s2", 20, "s1"], ["s3", 30, "s1"]], "cur": "s3", "msg": "s3 = push(s1, 30): új csomópont [30], next → ugyanarra a [10]-re: két bejövő él"}, {"line": 2, "ver": "s1", "pop": "s2", "stk": [["s1", 10, null], ["s2", 20, "s1"], ["s3", 30, "s1"]], "cur": "s1", "msg": "pop(s2) = (20, s1): nincs új csomópont, s2 és s1 változatlan"}, {"line": 2, "ver": "s1", "pop": "s3", "stk": [["s1", 10, null], ["s2", 20, "s1"], ["s3", 30, "s1"]], "cur": "s1", "msg": "pop(s3) = (30, s1): szintén s1-et adja vissza; 3 csomópont, 4 verzió"}];
const CODE = ["s0 = empty_stack()", "push(s, x): return Node(x, next = s)   // O(1), 1 új csomópont", "pop(s): return (s.value, s.next)        // O(1), nincs írás", "insert(t, k): t-től k helyéig az utat másolja (path copying)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SEL = null, BV = [], BN = 0;
function nodeB(k, l, r, copy){ return {id: ++BN, key: k, left: l, right: r, copy: copy || null}; }
function bins(t, k, nw){ if (t === null) { const n = nodeB(k, null, null, null); nw.push(n); return n; }
  let c; if (k < t.key) c = nodeB(t.key, bins(t.left, k, nw), t.right, t); else if (k > t.key) c = nodeB(t.key, t.left, bins(t.right, k, nw), t); else return t;
  nw.push(c); return c; }
function ino(t){ return t === null ? [] : ino(t.left).concat([t.key], ino(t.right)); }
(function(){ let t = null; for (const k of [20, 10, 30, 25]) t = bins(t, k, []); BV.push({root: t, nw: []}); const nw = []; BV.push({root: bins(t, 27, nw), nw}); })();
function render(s){
  svg.setAttribute("viewBox", "0 0 560 420");
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  // (a) verem
  el("text", {x: 10, y: 18, "font-size": 13, "font-weight": "bold"}, "(a) perzisztens verem");
  const NP = {s1: [150, 110], s2: [70, 50], s3: [230, 50]}, reach = new Set();
  const sel = SEL || s.ver; let c = sel; while (c) { reach.add(c); const n = s.stk.find(x => x[0] === c); c = n ? n[2] : null; }
  s.stk.forEach(([id, v, nx]) => { if (nx) el("line", {x1: NP[id][0], y1: NP[id][1] + 14, x2: NP[nx][0] + (id === "s2" ? -10 : 10), y2: NP[nx][1] - 16, stroke: css("--line"), "stroke-width": 1.6, "marker-end": "url(#ah)"}); });
  s.stk.forEach(([id, v]) => { const on = reach.has(id), cur = s.cur === id;
    el("rect", {x: NP[id][0] - 26, y: NP[id][1] - 14, width: 52, height: 28, fill: on ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3.5 : 1.2});
    el("text", {x: NP[id][0], y: NP[id][1] + 5, "text-anchor": "middle", "font-size": 14}, `[${v}]`); });
  [["s1", 330, 110], ["s2", 330, 50], ["s3", 400, 50]].forEach(([nm, x, y]) => { if (!s.stk.find(z => z[0] === nm)) return;
    el("rect", {x: x - 18, y: y - 12, width: 36, height: 24, fill: "none", stroke: css("--line"), "stroke-dasharray": "4 3", "stroke-width": nm === sel ? 3 : 1});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, nm); });
  el("text", {x: 300, y: 145, "font-size": 12, fill: css("--muted")}, `kijelölt verzió: ${sel} = [${(function(){ const o = []; let q = sel; while (q) { const n = s.stk.find(x => x[0] === q); if (!n) break; o.push(n[1]); q = n[2]; } return o.join(", "); })()}]`);
  if (s.pop) el("text", {x: 300, y: 165, "font-size": 12, "font-style": "italic"}, `${s.pop} változatlan; a pop eredménye s1`);
  // (b) BST path copying
  el("line", {x1: 0, y1: 182, x2: 560, y2: 182, stroke: css("--muted"), "stroke-dasharray": "2 4"});
  el("text", {x: 10, y: 202, "font-size": 13, "font-weight": "bold"}, "(b) path copying a BST-ben");
  const oldV = BV[BV.length - 2], newV = BV[BV.length - 1], nwid = new Set(newV.nw.map(n => n.id)), P = {};
  const ol = ino(oldV.root).length, nl = ino(newV.root).length;
  (function lay(t, x0, x1, y){ if (t === null) return; const x = (x0 + x1) / 2; P[t.id] = [x, y]; lay(t.left, x0, x, y + 46); lay(t.right, x, x1, y + 46); })(oldV.root, 10, 270, 240);
  (function lay(t, x0, x1, y){ if (t === null || !nwid.has(t.id)) return; const x = (x0 + x1) / 2; P[t.id] = [x, y]; lay(t.left, x0, x, y + 46); lay(t.right, x, x1, y + 46); })(newV.root, 290, 550, 240);
  const seen = new Set(), all = [];
  (function w(t){ if (t === null || seen.has(t.id)) return; seen.add(t.id); all.push(t); w(t.left); w(t.right); })(oldV.root);
  (function w(t){ if (t === null || seen.has(t.id)) return; seen.add(t.id); all.push(t); w(t.left); w(t.right); })(newV.root);
  all.forEach(n => [n.left, n.right].forEach(c => { if (c && P[n.id] && P[c.id]) { const sh = nwid.has(n.id) && !nwid.has(c.id);
    el("line", {x1: P[n.id][0], y1: P[n.id][1], x2: P[c.id][0], y2: P[c.id][1], stroke: sh ? css("--hl2") : css("--line"), "stroke-width": sh ? 2.6 : 1.2}); } }));
  all.forEach(n => { if (!P[n.id]) return; const [x, y] = P[n.id], nw = nwid.has(n.id);
    if (nw && n.copy) el("circle", {cx: x, cy: y, r: 19, fill: "none", stroke: css("--line"), "stroke-width": 1.4});
    el("circle", {cx: x, cy: y, r: 15, fill: nw && !n.copy ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12}, n.key + (nw && n.copy ? "′" : "")); });
  el("text", {x: 140, y: 222, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "régi verzió: " + ino(oldV.root).join(", "));
  el("text", {x: 420, y: 222, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "új verzió: " + ino(newV.root).join(", "));
  el("text", {x: 280, y: 412, "text-anchor": "middle", "font-size": 12.5}, `új csomópont: ${newV.nw.length}, megosztott (az új verzióból elérhető régi): ${nl - newV.nw.length}`);
}
function pick(v){ SEL = v; show(k); }
function insB(){ const e = document.getElementById("err"), key = parseInt(document.getElementById("bk").value, 10);
  if (isNaN(key)) { e.textContent = "Egész kulcsot adjon meg."; return; }
  const cur = BV[BV.length - 1]; if (ino(cur.root).includes(key)) { e.textContent = "A kulcs már szerepel: nincs új verzió (0 új csomópont)."; return; }
  if (ino(cur.root).length >= 12) { e.textContent = "Legfeljebb 12 kulcs."; return; }
  e.textContent = ""; const nw = []; BV.push({root: bins(cur.root, key, nw), nw}); show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
