<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MST, klaszterezés és Approx-TSP</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><label for="k">k =</label><input id="k" type="range" min="1" max="5" value="3" style="flex:0 1 120px" oninput="setK(this.value)" aria-label="Klaszterek száma"><b id="kv">3</b><button onclick="addPt()">+ pont</button><button onclick="reset()">Alaphelyzet</button><label><input type="checkbox" checked onchange="SHOWOPT=this.checked;show(+document.getElementById('pos').value)"> optimum</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az öt pont MST-je (8,48), a k = 3 single-linkage klaszterezés ({P1}, {P2, P3, P5}, {P4}), az Approx-TSP DFS-sétája és rövidített túrája (14,64) és az optimális túra (13,81)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.4 példája: P1 = (0,0), P2 = (1,3), P3 = (4,2), P4 = (5,0), P5 = (2,2). A fa szomszédsági listái csúcsindex szerint rendezve, a DFS P1-ből indul. A pontok egérrel húzhatók (0,1-es rácsra), legfeljebb 8 pontig bővíthető; az optimum a P1-ből induló sorrendek felsorolása.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = ["ApproxTSP(T, adj, start):", "  s = üres; DFS_visit(start, −1, adj, s)", "  minden u ∈ s:", "    ha nem visited[u]: visited[u] = igaz;", "                     tour.append(u)", "  tour.append(start)", "DFS_visit(u, parent, adj, s):", "  s.append(u)", "  minden v ∈ adj[u], v ≠ parent:", "    DFS_visit(v, u, adj, s); s.append(u)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const P0 = [[0,0],[1,3],[4,2],[5,0],[2,2]];
let PTS = P0.map(p => p.slice()), K = 3, DRAG = -1, SHOWOPT = true;
const dist = (a, b) => Math.hypot(PTS[a][0] - PTS[b][0], PTS[a][1] - PTS[b][1]);
const f2 = x => x.toFixed(2).replace(".", ",");
function mst(){ const n = PTS.length, par = [...Array(n).keys()], f = x => { while (par[x] !== x) x = par[x]; return x; }, es = [], t = [];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) es.push([dist(i, j), i, j]);
  es.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  for (const [w, i, j] of es) if (f(i) !== f(j)) { par[f(i)] = f(j); t.push([i, j]); } return t; }
function clusters(T, k){ const n = PTS.length, keep = T.slice().sort((a, b) => dist(...a) - dist(...b)).slice(0, Math.max(0, n - k));
  const par = [...Array(n).keys()], f = x => { while (par[x] !== x) x = par[x]; return x; }; keep.forEach(([i, j]) => par[f(i)] = f(j));
  const cid = {}, lab = []; for (let x = 0; x < n; x++) { const r = f(x); if (!(r in cid)) cid[r] = Object.keys(cid).length; lab.push(cid[r]); }
  return {lab, removed: T.filter(e => !keep.includes(e))}; }
function tourLen(t){ let s = 0; for (let i = 0; i + 1 < t.length; i++) s += dist(t[i], t[i + 1]); return s; }
function opt(){ const n = PTS.length, rest = [...Array(n).keys()].slice(1); let best = null, bl = Infinity;
  const perm = (a, l) => { if (l === a.length) { const t = [0, ...a, 0], L = tourLen(t); if (L < bl - 1e-12) { bl = L; best = t; } return; }
    for (let i = l; i < a.length; i++) { [a[l], a[i]] = [a[i], a[l]]; perm(a, l + 1); [a[l], a[i]] = [a[i], a[l]]; } };
  perm(rest, 0); return best; }
function compute(){
  const T = mst(), n = PTS.length, adj = {}; for (let i = 0; i < n; i++) adj[i] = [];
  T.forEach(([i, j]) => { adj[i].push(j); adj[j].push(i); }); for (const v in adj) adj[v].sort((a, b) => a - b);
  const walk = [], st = [], wM = T.reduce((s, e) => s + dist(...e), 0);
  const nm = a => a.map(x => "P" + (x + 1)).join(", ");
  const visit = (u, p) => { walk.push(u); st.push({ph: "s", walk: walk.slice(), line: 7, msg: `DFS-séta: s = [${nm(walk)}]`});
    for (const v of adj[u]) if (v !== p) { visit(v, u); walk.push(u); st.push({ph: "s", walk: walk.slice(), line: 9, msg: `Visszatérés ${"P" + (u + 1)}-be: s = [${nm(walk)}]`}); } };
  st.push({ph: "m", walk: [], line: -1, msg: `MST (Kruskal, pontos távolságokkal): ${T.map(([i, j]) => `P${i + 1}P${j + 1} ${f2(dist(i, j))}`).join(", ")}; összköltség ${f2(wM)}.`});
  visit(0, -1);
  const seen = new Set(), tour = [];
  walk.forEach((u, i) => { const nw = !seen.has(u); if (nw) { seen.add(u); tour.push(u); }
    st.push({ph: "r", walk: walk.slice(), ri: i, tour: tour.slice(), line: nw ? 4 : 2, msg: `Rövidítés, s[${i + 1}] = P${u + 1}: ` + (nw ? `új, tour = [${nm(tour)}]` : "már meglátogatott, átugorjuk")}); });
  tour.push(0); const wT = tourLen(tour), O = n <= 8 ? opt() : null, wO = O ? tourLen(O) : NaN;
  st.push({ph: "t", walk: walk.slice(), tour: tour.slice(), opt: O, line: 5, msg: `Túra: ${nm(tour)}; hossza ${f2(wT)} ≤ 2 · ${f2(wM)} = ${f2(2 * wM)}.` + (O ? ` Optimum (felsorolással): ${nm(O)} = ${f2(wO)}; arány ${f2(wT / wO)}.` : "")});
  return st;
}
const X0 = 30, Y0 = 290, SC = 52;
const sx = x => X0 + x * SC, sy = y => Y0 - y * SC;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 620 342"); G_defs();
  const T = mst(), C = clusters(T, K), n = PTS.length;
  // rács
  for (let i = 0; i <= 5; i++) { el("line", {x1: sx(i), y1: sy(0), x2: sx(i), y2: sy(5), stroke: css("--cellhl"), "stroke-width": 1});
    el("line", {x1: sx(0), y1: sy(i), x2: sx(5), y2: sy(i), stroke: css("--cellhl"), "stroke-width": 1});
    G_text(sx(i), sy(0) + 14, String(i), {size: 10, anchor: "middle", fill: css("--muted")}); G_text(sx(0) - 8, sy(i) + 4, String(i), {size: 10, anchor: "end", fill: css("--muted")}); }
  T.forEach(([i, j]) => el("line", {x1: sx(PTS[i][0]), y1: sy(PTS[i][1]), x2: sx(PTS[j][0]), y2: sy(PTS[j][1]), stroke: s.ph === "m" ? css("--fg") : css("--cellhl"), "stroke-width": s.ph === "m" ? 3 : 8, "stroke-linecap": "round"}));
  if (s.opt && SHOWOPT) for (let i = 0; i + 1 < s.opt.length; i++) { const a = PTS[s.opt[i]], b = PTS[s.opt[i + 1]];
    el("line", {x1: sx(a[0]), y1: sy(a[1]), x2: sx(b[0]), y2: sy(b[1]), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "7 5"}); }
  const w = s.walk || [];
  if (s.ph === "s") for (let i = 0; i + 1 < w.length; i++) G_edge([sx(PTS[w[i]][0]), sy(PTS[w[i]][1])], [sx(PTS[w[i + 1]][0]), sy(PTS[w[i + 1]][1])], {r: 10, dir: true, curve: 9, w: 1.6, color: i === w.length - 2 ? css("--hl2") : css("--line"), label: i + 1, lsize: 10});
  const t = s.tour || [];
  for (let i = 0; i + 1 < t.length; i++) { const a = t[i], b = t[i + 1], inM = T.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
    G_edge([sx(PTS[a][0]), sy(PTS[a][1])], [sx(PTS[b][0]), sy(PTS[b][1])], {r: 10, dir: true, w: 2.6, dash: inM ? "" : "2 4"}); }
  for (let i = 0; i < n; i++) { const cx = sx(PTS[i][0]), cy = sy(PTS[i][1]);
    const c = el("circle", {cx, cy, r: 9, fill: s.ri !== undefined && w[s.ri] === i ? css("--hl2") : css("--cell"), stroke: css("--line"), "stroke-width": 1.8});
    c.style.cursor = "grab"; c.addEventListener("pointerdown", ev => { DRAG = i; ev.preventDefault(); });
    G_text(cx + 11, cy - 9, "P" + (i + 1), {size: 12, bold: true, halo: true}); }
  // jobb oldal: klaszterezés
  const ox = 360, oy = 230, sc = 44, qx = x => ox + x * sc, qy = y => oy - y * sc, shapes = ["kör", "háromszög", "négyzet", "rombusz", "csillag", "kereszt", "ötszög", "x"];
  G_text(ox - 10, 20, `single-linkage, k = ${K}`, {bold: true});
  T.forEach(([i, j]) => { const rm = C.removed.includes(T.find(e => e[0] === i && e[1] === j));
    el("line", {x1: qx(PTS[i][0]), y1: qy(PTS[i][1]), x2: qx(PTS[j][0]), y2: qy(PTS[j][1]), stroke: css("--line"), "stroke-width": rm ? 1 : 2.6, "stroke-dasharray": rm ? "5 4" : "none"}); });
  for (let i = 0; i < n; i++) { const x = qx(PTS[i][0]), y = qy(PTS[i][1]), c = C.lab[i] % 8, f = css("--cell"), st = css("--line");
    if (c === 0) el("circle", {cx: x, cy: y, r: 7, fill: f, stroke: st, "stroke-width": 1.8});
    else if (c === 1) el("polygon", {points: `${x},${y - 8} ${x - 8},${y + 6} ${x + 8},${y + 6}`, fill: f, stroke: st, "stroke-width": 1.8});
    else if (c === 2) el("rect", {x: x - 7, y: y - 7, width: 14, height: 14, fill: f, stroke: st, "stroke-width": 1.8});
    else if (c === 3) el("polygon", {points: `${x},${y - 9} ${x + 8},${y} ${x},${y + 9} ${x - 8},${y}`, fill: f, stroke: st, "stroke-width": 1.8});
    else el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, String(c + 1));
    G_text(x + 9, y - 8, "P" + (i + 1), {size: 10}); }
  const groups = []; C.lab.forEach((c, i) => (groups[c] = groups[c] || []).push("P" + (i + 1)));
  groups.forEach((g, j) => G_text(ox - 10, 262 + j * 15, `{${g.join(", ")}}: ${shapes[j] || j + 1}`, {size: 11}));
  G_text(10, 322, "Szürke sáv = MST · számozott nyíl = DFS-séta · vastag = túra (pontozott = rövidítés)", {size: 10.5, fill: css("--muted")});
  G_text(10, 336, "kék szaggatott = optimum · a pontok egérrel húzhatók", {size: 10.5, fill: css("--muted")});
}
function svgPoint(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener("pointermove", ev => { if (DRAG < 0) return; const q = svgPoint(ev);
  PTS[DRAG] = [Math.max(0, Math.min(5, Math.round((q.x - X0) / SC * 10) / 10)), Math.max(0, Math.min(5, Math.round((Y0 - q.y) / SC * 10) / 10))];
  const k = +document.getElementById("pos").value; STEPS = compute(); show(Math.min(k, STEPS.length - 1)); });
window.addEventListener("pointerup", () => { if (DRAG >= 0) { DRAG = -1; setSteps(compute()); } });
function setK(v){ K = Math.max(1, Math.min(PTS.length, +v)); document.getElementById("kv").textContent = K; show(+document.getElementById("pos").value); }
function addPt(){ if (PTS.length >= 8) { status.textContent = "Legfeljebb 8 pont (az optimum felsorolással számolódik)."; return; }
  const cand = [[3,4],[0,4],[5,4],[3,1],[1,1],[4,4],[2,0.5]]; PTS.push(cand[(PTS.length - 5) % cand.length].slice());
  document.getElementById("k").max = PTS.length; setSteps(compute()); }
function reset(){ PTS = P0.map(p => p.slice()); document.getElementById("k").max = 5; setK(3); document.getElementById("k").value = 3; setSteps(compute()); }

STEPS = compute();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
