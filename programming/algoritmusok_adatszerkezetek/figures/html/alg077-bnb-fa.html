<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch-and-bound fa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első csomópont">⏮</button>
  <button id="prev">◀ Lépés</button>
  <button id="next">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Csomópont kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
  <label>Kezdő best: <select id="nn" aria-label="Kezdő felső korlát"><option value="0">∞</option><option value="1">29 (legközelebbi szomszéd)</option></select></label>
  <label>Holtverseny: <select id="ge" aria-label="Holtversenyszabály"><option value="1">≥ (utolsó maximális: a szöveg (4,2)-je)</option><option value="0">&gt; (első maximális: a pszeudokód)</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="Branch-and-bound keresési fa a 4 városos TSP-példán; a csomópontokra kattintva a mátrix látható."></svg>
<p class="small">A 20.4 pszeudokód Python-futásának eredménye (DFS, előbb a bevételi ág, vágás LB ≥ best). Kattintson egy
csomópontra a hozzá tartozó redukált mátrixért. Tömör él = bevétel, szaggatott = kizárás; áthúzott = vágott csomópont.</p>
<script>
const DATA = {"00": [{"id": 0, "parent": null, "label": "gyökér", "lb": 28, "size": 4, "status": "", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 1, 0, 1], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(gyökér): LB = 28, 4×4 mátrix; LB < best = ∞; elágazás a (1,3) élen (büntetés 1)", "choice": [1, 3], "forb": null}, {"id": 1, "parent": 0, "label": "+(1,3)", "lb": 29, "size": 3, "status": "", "rows": [2, 3, 4], "cols": [1, 2, 4], "M": [[0, null, 0], [null, 4, 0], [0, 0, null]], "msg": "Search(+(1,3)): LB = 29, 3×3 mátrix, tiltott záróél 3→1; LB < best = ∞; elágazás a (3,4) élen (büntetés 4)", "choice": [3, 4], "forb": [3, 1]}, {"id": 2, "parent": 1, "label": "+(3,4)", "lb": 29, "size": 2, "status": "", "rows": [2, 4], "cols": [1, 2], "M": [[0, null], [null, 0]], "msg": "Search(+(3,4)): LB = 29, 2×2 mátrix, tiltott záróél 4→1; LB < best = ∞; elágazás a (2,1) élen (büntetés ∞)", "choice": [2, 1], "forb": [4, 1]}, {"id": 3, "parent": 2, "label": "+(2,1)", "lb": 29, "size": 1, "status": "best", "rows": [4], "cols": [2], "M": [[0]], "msg": "Search(+(2,1)): LB = 29, 1×1 mátrix — levél: (4,2) zárja a kört 1→3→4→2→1, költség 29 → best := 29", "choice": null, "forb": null}, {"id": 4, "parent": 1, "label": "−(3,4)", "lb": 33, "size": 3, "status": "cut", "rows": [2, 3, 4], "cols": [1, 2, 4], "M": [[0, null, 0], [null, 0, null], [0, 0, null]], "msg": "Search(−(3,4)): LB = 33, 3×3 mátrix — vágás: LB = 33 ≥ best = 29", "choice": null, "forb": null}, {"id": 5, "parent": 0, "label": "−(1,3)", "lb": 29, "size": 4, "status": "cut", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 0, null, 0], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(−(1,3)): LB = 29, 4×4 mátrix — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": null}], "01": [{"id": 0, "parent": null, "label": "gyökér", "lb": 28, "size": 4, "status": "", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 1, 0, 1], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(gyökér): LB = 28, 4×4 mátrix; LB < best = 29; elágazás a (1,3) élen (büntetés 1)", "choice": [1, 3], "forb": null}, {"id": 1, "parent": 0, "label": "+(1,3)", "lb": 29, "size": 3, "status": "cut", "rows": [2, 3, 4], "cols": [1, 2, 4], "M": [[0, null, 0], [null, 4, 0], [0, 0, null]], "msg": "Search(+(1,3)): LB = 29, 3×3 mátrix, tiltott záróél 3→1 — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": [3, 1]}, {"id": 2, "parent": 0, "label": "−(1,3)", "lb": 29, "size": 4, "status": "cut", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 0, null, 0], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(−(1,3)): LB = 29, 4×4 mátrix — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": null}], "10": [{"id": 0, "parent": null, "label": "gyökér", "lb": 28, "size": 4, "status": "", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 1, 0, 1], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(gyökér): LB = 28, 4×4 mátrix; LB < best = ∞; elágazás a (4,2) élen (büntetés 1)", "choice": [4, 2], "forb": null}, {"id": 1, "parent": 0, "label": "+(4,2)", "lb": 29, "size": 3, "status": "", "rows": [1, 2, 3], "cols": [1, 3, 4], "M": [[null, 0, 1], [0, 3, null], [0, null, 0]], "msg": "Search(+(4,2)): LB = 29, 3×3 mátrix, tiltott záróél 2→4; LB < best = ∞; elágazás a (1,3) élen (büntetés 4)", "choice": [1, 3], "forb": [2, 4]}, {"id": 2, "parent": 1, "label": "+(1,3)", "lb": 29, "size": 2, "status": "", "rows": [2, 3], "cols": [1, 4], "M": [[0, null], [null, 0]], "msg": "Search(+(1,3)): LB = 29, 2×2 mátrix, tiltott záróél 3→1; LB < best = ∞; elágazás a (3,4) élen (büntetés ∞)", "choice": [3, 4], "forb": [3, 1]}, {"id": 3, "parent": 2, "label": "+(3,4)", "lb": 29, "size": 1, "status": "best", "rows": [2], "cols": [1], "M": [[0]], "msg": "Search(+(3,4)): LB = 29, 1×1 mátrix — levél: (2,1) zárja a kört 1→3→4→2→1, költség 29 → best := 29", "choice": null, "forb": null}, {"id": 4, "parent": 1, "label": "−(1,3)", "lb": 33, "size": 3, "status": "cut", "rows": [1, 2, 3], "cols": [1, 3, 4], "M": [[null, null, 0], [0, 0, null], [0, null, 0]], "msg": "Search(−(1,3)): LB = 33, 3×3 mátrix — vágás: LB = 33 ≥ best = 29", "choice": null, "forb": null}, {"id": 5, "parent": 0, "label": "−(4,2)", "lb": 29, "size": 4, "status": "cut", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 0, 0, 1], [1, null, 4, 0], [0, 3, null, 0], [1, null, 0, null]], "msg": "Search(−(4,2)): LB = 29, 4×4 mátrix — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": null}], "11": [{"id": 0, "parent": null, "label": "gyökér", "lb": 28, "size": 4, "status": "", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 1, 0, 1], [1, null, 4, 0], [0, 4, null, 0], [1, 0, 0, null]], "msg": "Search(gyökér): LB = 28, 4×4 mátrix; LB < best = 29; elágazás a (4,2) élen (büntetés 1)", "choice": [4, 2], "forb": null}, {"id": 1, "parent": 0, "label": "+(4,2)", "lb": 29, "size": 3, "status": "cut", "rows": [1, 2, 3], "cols": [1, 3, 4], "M": [[null, 0, 1], [0, 3, null], [0, null, 0]], "msg": "Search(+(4,2)): LB = 29, 3×3 mátrix, tiltott záróél 2→4 — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": [2, 4]}, {"id": 2, "parent": 0, "label": "−(4,2)", "lb": 29, "size": 4, "status": "cut", "rows": [1, 2, 3, 4], "cols": [1, 2, 3, 4], "M": [[null, 0, 0, 1], [1, null, 4, 0], [0, 3, null, 0], [1, null, 0, null]], "msg": "Search(−(4,2)): LB = 29, 4×4 mátrix — vágás: LB = 29 ≥ best = 29", "choice": null, "forb": null}]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let NODES = [], k = 0, sel = 0;
const pos = document.getElementById("pos"), st = document.getElementById("status");
function layout(){ const kids = {}; NODES.forEach(x => kids[x.id] = NODES.filter(y => y.parent === x.id).map(y => y.id));
  const P = {}; let nx = 0; const walk = (i, d) => { if (!kids[i].length) { P[i] = [nx++, d]; return; } kids[i].forEach(c => walk(c, d + 1)); P[i] = [kids[i].reduce((a, c) => a + P[c][0], 0) / kids[i].length, d]; };
  walk(0, 0); return [P, nx]; }
function draw(){
  svg.innerHTML = ""; const [P, W] = layout(), sx = Math.min(150, 380 / Math.max(1, W)), X = i => 66 + P[i][0] * sx, Y = i => 30 + P[i][1] * 66;
  NODES.slice(0, k + 1).forEach(x => { if (x.parent === null) return; const inc = x.label[0] === "+";
    el("line", {x1: X(x.parent), y1: Y(x.parent) + 14, x2: X(x.id), y2: Y(x.id) - 14, stroke: css("--line"), "stroke-width": inc ? 2.2 : 1.4, "stroke-dasharray": inc ? "none" : "6 4"}); });
  NODES.slice(0, k + 1).forEach(x => { const cx = X(x.id), cy = Y(x.id), cut = x.status === "cut", best = x.status === "best", cur = x.id === k;
    const r = el("rect", {x: cx - 62, y: cy - 14, width: 124, height: 28, rx: 6, fill: best ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur || x.id === sel ? 3.5 : 1.2, "stroke-dasharray": cut ? "5 3" : "none"});
    r.style.cursor = "pointer"; r.addEventListener("click", () => { sel = x.id; draw(); });
    const t = el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 11}, `${x.label} | LB ${x.lb} | ${x.size}×${x.size}`); t.style.pointerEvents = "none";
    if (cut) el("line", {x1: cx - 58, y1: cy + 10, x2: cx + 58, y2: cy - 10, stroke: css("--fg"), "stroke-width": 1.2}); });
  // a kiválasztott csomópont mátrixa
  const m = NODES[Math.min(sel, k)], z = 30, x0 = 400, y0 = 40;
  el("text", {x: x0, y: 22, "font-size": 12, "font-weight": "bold"}, `mátrix: ${m.label}`);
  m.cols.forEach((c, j) => el("text", {x: x0 + 20 + j * z + z / 2, y: y0 + 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, c));
  m.M.forEach((row, i) => { el("text", {x: x0 + 12, y: y0 + 14 + i * z + z / 2 + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, m.rows[i]);
    row.forEach((v, j) => { el("rect", {x: x0 + 20 + j * z, y: y0 + 14 + i * z, width: z, height: z, fill: v === null ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 0.8});
      el("text", {x: x0 + 20 + j * z + z / 2, y: y0 + 14 + i * z + z / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": v === 0 ? "bold" : "normal"}, v === null ? "∞" : String(v)); }); });
  if (m.forb) el("text", {x: x0, y: y0 + 30 + m.M.length * z, "font-size": 11}, `tiltott záróél: ${m.forb[0]}→${m.forb[1]}`);
  if (m.choice) el("text", {x: x0, y: y0 + 46 + m.M.length * z, "font-size": 11}, `elágazás: (${m.choice[0]},${m.choice[1]})`);
}
function show(i){ k = Math.max(0, Math.min(NODES.length - 1, i)); sel = k; pos.value = k; document.getElementById("cnt").textContent = `${k + 1}/${NODES.length}`; st.textContent = NODES[k].msg; draw(); }
function load(){ NODES = DATA[document.getElementById("ge").value + document.getElementById("nn").value]; pos.max = NODES.length - 1; show(0); }
document.getElementById("first").onclick = () => show(0);
document.getElementById("prev").onclick = () => show(k - 1);
document.getElementById("next").onclick = () => show(k + 1);
pos.oninput = () => show(+pos.value);
document.getElementById("nn").onchange = load; document.getElementById("ge").onchange = load;
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(k + 1); if (e.key === "ArrowLeft") show(k - 1); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
load();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
