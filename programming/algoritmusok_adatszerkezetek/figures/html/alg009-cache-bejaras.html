<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache-hatás a mátrixbejárásban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>bejárás: <select id="ord" onchange="load()" aria-label="Bejárási sorrend"><option value="row">soros</option><option value="col">oszlopos</option></select></label><label>cache-méret: <select id="cl" onchange="load()" aria-label="Cache-sorok száma"><option>1</option><option selected>2</option><option>3</option><option>4</option></select> sor</label><label>cache-sor hossza: <select id="ll" onchange="load()" aria-label="Cache-sor hossza"><option>2</option><option selected>4</option><option>8</option></select> elem</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4×4-es mátrix és sorfolytonos memóriaképe; lépésenként kiemelve az aktuális elem, a cache tartalma és a hiányok száma."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, determinisztikus cache-modell (teljesen asszociatív, LRU), nem mérés. Alapbeállítás: 2 sor × 4 elem; a 16. elérés után soros bejárásnál 4, oszlopos bejárásnál 16 hiány.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cl": null, "i": null, "j": null, "addr": null, "hit": null, "cache": [], "miss": 0, "k": 0, "line": -1, "msg": "Kezdet: üres cache (2 sor × 4 elem, LRU); elérések 0, cache-hiányok 0"}, {"cl": 0, "i": 0, "j": 0, "addr": 0, "hit": false, "cache": [0], "miss": 1, "k": 1, "line": 1, "msg": "elérések 1, cache-hiányok 1 – a00 (cím 0, 0. cache-sor): hiány, betöltés"}, {"cl": 0, "i": 0, "j": 1, "addr": 1, "hit": true, "cache": [0], "miss": 1, "k": 2, "line": 1, "msg": "elérések 2, cache-hiányok 1 – a01 (cím 1, 0. cache-sor): találat"}, {"cl": 0, "i": 0, "j": 2, "addr": 2, "hit": true, "cache": [0], "miss": 1, "k": 3, "line": 1, "msg": "elérések 3, cache-hiányok 1 – a02 (cím 2, 0. cache-sor): találat"}, {"cl": 0, "i": 0, "j": 3, "addr": 3, "hit": true, "cache": [0], "miss": 1, "k": 4, "line": 1, "msg": "elérések 4, cache-hiányok 1 – a03 (cím 3, 0. cache-sor): találat"}, {"cl": 1, "i": 1, "j": 0, "addr": 4, "hit": false, "cache": [0, 1], "miss": 2, "k": 5, "line": 1, "msg": "elérések 5, cache-hiányok 2 – a10 (cím 4, 1. cache-sor): hiány, betöltés"}, {"cl": 1, "i": 1, "j": 1, "addr": 5, "hit": true, "cache": [0, 1], "miss": 2, "k": 6, "line": 1, "msg": "elérések 6, cache-hiányok 2 – a11 (cím 5, 1. cache-sor): találat"}, {"cl": 1, "i": 1, "j": 2, "addr": 6, "hit": true, "cache": [0, 1], "miss": 2, "k": 7, "line": 1, "msg": "elérések 7, cache-hiányok 2 – a12 (cím 6, 1. cache-sor): találat"}, {"cl": 1, "i": 1, "j": 3, "addr": 7, "hit": true, "cache": [0, 1], "miss": 2, "k": 8, "line": 1, "msg": "elérések 8, cache-hiányok 2 – a13 (cím 7, 1. cache-sor): találat"}, {"cl": 2, "i": 2, "j": 0, "addr": 8, "hit": false, "cache": [1, 2], "miss": 3, "k": 9, "line": 1, "msg": "elérések 9, cache-hiányok 3 – a20 (cím 8, 2. cache-sor): hiány, betöltés"}, {"cl": 2, "i": 2, "j": 1, "addr": 9, "hit": true, "cache": [1, 2], "miss": 3, "k": 10, "line": 1, "msg": "elérések 10, cache-hiányok 3 – a21 (cím 9, 2. cache-sor): találat"}, {"cl": 2, "i": 2, "j": 2, "addr": 10, "hit": true, "cache": [1, 2], "miss": 3, "k": 11, "line": 1, "msg": "elérések 11, cache-hiányok 3 – a22 (cím 10, 2. cache-sor): találat"}, {"cl": 2, "i": 2, "j": 3, "addr": 11, "hit": true, "cache": [1, 2], "miss": 3, "k": 12, "line": 1, "msg": "elérések 12, cache-hiányok 3 – a23 (cím 11, 2. cache-sor): találat"}, {"cl": 3, "i": 3, "j": 0, "addr": 12, "hit": false, "cache": [2, 3], "miss": 4, "k": 13, "line": 1, "msg": "elérések 13, cache-hiányok 4 – a30 (cím 12, 3. cache-sor): hiány, betöltés"}, {"cl": 3, "i": 3, "j": 1, "addr": 13, "hit": true, "cache": [2, 3], "miss": 4, "k": 14, "line": 1, "msg": "elérések 14, cache-hiányok 4 – a31 (cím 13, 3. cache-sor): találat"}, {"cl": 3, "i": 3, "j": 2, "addr": 14, "hit": true, "cache": [2, 3], "miss": 4, "k": 15, "line": 1, "msg": "elérések 15, cache-hiányok 4 – a32 (cím 14, 3. cache-sor): találat"}, {"cl": 3, "i": 3, "j": 3, "addr": 15, "hit": true, "cache": [2, 3], "miss": 4, "k": 16, "line": 1, "msg": "elérések 16, cache-hiányok 4 – a33 (cím 15, 3. cache-sor): találat"}];
const CODE = ["for i in range(n):   # soros", "    for j in range(n): total += mat[i][j]", "for j in range(n):   # oszlopos", "    for i in range(n): total += mat[i][j]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function sim(col, lines, len){
  const st = [{cl: null, i: null, j: null, addr: null, hit: null, cache: [], miss: 0, k: 0, line: -1,
               msg: `Kezdet: üres cache (${lines} sor × ${len} elem, LRU); elérések 0, cache-hiányok 0`}];
  let cache = [], miss = 0, k = 0;
  for (let p = 0; p < 4; p++) for (let q = 0; q < 4; q++) {
    const i = col ? q : p, j = col ? p : q, addr = i * 4 + j, cl = Math.floor(addr / len), hit = cache.includes(cl);
    if (hit) cache.splice(cache.indexOf(cl), 1); else { miss++; if (cache.length === lines) cache.shift(); }
    cache.push(cl); k++;
    st.push({cl, i, j, addr, hit, cache: cache.slice(), miss, k, line: col ? 3 : 1,
             msg: `elérések ${k}, cache-hiányok ${miss} – a${i}${j} (cím ${addr}, ${cl}. cache-sor): ${hit ? "találat" : "hiány, betöltés"}`});
  }
  return st;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 300");
  const len = +document.getElementById("ll").value;
  // mátrix
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const on = s.i === i && s.j === j;
    el("rect", {x: 20 + j * 40, y: 20 + i * 34, width: 40, height: 34, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3.5 : 1});
    el("text", {x: 40 + j * 40, y: 42 + i * 34, "text-anchor": "middle", "font-size": 13}, "a" + "₀₁₂₃"[i] + "₀₁₂₃"[j]);
  }
  // memória
  const mx = 20, my = 190, w = 32;
  el("text", {x: mx, y: my - 10, "font-size": 12, fill: css("--muted")}, "memória (sorfolytonos címek), vastag keret = cache-sor");
  for (let a = 0; a < 16; a++) {
    const on = s.addr === a, inC = s.cache.includes(Math.floor(a / len));
    el("rect", {x: mx + a * w, y: my, width: w, height: 30, fill: inC ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 0.8});
    if (on) el("rect", {x: mx + a * w + 2, y: my + 2, width: w - 4, height: 26, fill: "none", stroke: css("--hl"), "stroke-width": 3});
    el("text", {x: mx + a * w + w/2, y: my + 20, "text-anchor": "middle", "font-size": 11}, "a" + "₀₁₂₃"[Math.floor(a / 4)] + "₀₁₂₃"[a % 4]);
    el("text", {x: mx + a * w + w/2, y: my + 44, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(a));
  }
  for (let L = 0; L < 16 / len; L++) el("rect", {x: mx + L * len * w, y: my, width: len * w, height: 30, fill: "none", stroke: css("--line"), "stroke-width": 2.6});
  // cache tábla
  el("text", {x: 230, y: 30, "font-size": 13, "font-weight": "bold"}, "cache (LRU: legrégebbi felül)");
  const lines = +document.getElementById("cl").value;
  for (let r = 0; r < lines; r++) {
    const c = s.cache[r];
    el("rect", {x: 230, y: 40 + r * 30, width: 300, height: 26, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: 238, y: 58 + r * 30, "font-size": 12}, c === undefined ? `${r}. hely: üres` :
       `${r}. hely: ${c}. cache-sor (címek ${c * len}–${c * len + len - 1})`);
  }
  if (s.hit !== null) el("text", {x: 230, y: 60 + lines * 30, "font-size": 15, "font-weight": "bold"}, s.hit ? "találat" : "hiány → betöltés");
  el("text", {x: 230, y: 150, "font-size": 13}, `elérések ${s.k}, cache-hiányok ${s.miss}`);
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11.5, fill: css("--muted")}, "szürke = a cache-ben lévő sorok címei · kék keret = aktuális elérés · szemléltető modell, nem mérés");
}
function load(){
  setSteps(sim(document.getElementById("ord").value === "col", +document.getElementById("cl").value, +document.getElementById("ll").value));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
