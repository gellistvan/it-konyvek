<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trie + max-heap top-k</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szótár: <input id="dict" value="app:3; apple:3; apt:5; bat:2" size="28" aria-label="Szótár, szó:gyakoriság párok"></label><label>prefix: <input id="pre" value="ap" size="5" aria-label="Prefix"></label><label>k = <input id="kk" type="number" min="1" max="12" value="2" style="width:3.5em" aria-label="k"></label><button onclick="load()">Betöltés</button><button onclick="tieTest()">Döntetlenteszt (aa…ak, k = 10)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Trie az app, apple, apt, bat szavakkal; a query ap, k = 2 bejárása app, apple, apt sorrendben; a heap gyökere előbb app, majd apple, végül az apt beszúrásakor az apple kikerül; eredmény apt 5, app 3."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet 4.2 pszeudokódja (build, query, collect); a heap tömbös bináris max-heap a (−frequency, word) kulcs szerint. Kezdőállapot: a 4.3/4. teszteset szótára, query(„ap”), k = 2.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": "ap", "path": ["", "a", "ap"], "heap": [], "line": 2, "msg": "query(„ap”), k = 2: a prefix csúcsa megvan; üres max-heap, kulcs (−frequency, word)"}, {"cur": "ap", "path": ["", "a", "ap"], "vis": ["ap"], "heap": [], "line": 10, "msg": "csúcs „ap”: nem szóvég, a gyerekek betűrendben: p, t"}, {"cur": "app", "path": ["", "a", "ap"], "vis": ["ap", "app"], "heap": [[3, "app"]], "line": 7, "op": "ins", "msg": "„app” (3) szóvég: heap.size < k → beszúrás; gyökér (legrosszabb bent lévő): („app”, 3)"}, {"cur": "appl", "path": ["", "a", "ap"], "vis": ["ap", "app", "appl"], "heap": [[3, "app"]], "line": 10, "msg": "csúcs „appl”: nem szóvég, a gyerekek betűrendben: e"}, {"cur": "apple", "path": ["", "a", "ap"], "vis": ["ap", "app", "appl", "apple"], "heap": [[3, "apple"], [3, "app"]], "line": 7, "op": "ins", "msg": "„apple” (3) szóvég: heap.size < k → beszúrás; gyökér (legrosszabb bent lévő): („apple”, 3)"}, {"cur": "apt", "path": ["", "a", "ap"], "vis": ["ap", "app", "appl", "apple", "apt"], "heap": [[3, "app"], [5, "apt"]], "line": 9, "op": "rep", "out": [3, "apple"], "msg": "„apt” (5): kulcs (−5, „apt”) < gyökér kulcsa (−3, „apple”) → a gyökér („apple”, 3) kikerül, „apt” be"}, {"cur": null, "path": ["", "a", "ap"], "vis": ["ap", "app", "appl", "apple", "apt"], "heap": [[3, "app"], [5, "apt"]], "line": 4, "res": [["apt", 5], ["app", 3]], "msg": "Eredmény (−frequency, word) szerint rendezve: („apt”, 5), („app”, 3)"}];
const CODE = ["query(prefix):", "    node = a prefix csúcsa (ha nincs: return [])", "    heap = üres max-heap, kulcs (−frequency, word)", "    collect(node, prefix, heap)", "    rendezés (−frequency, word) szerint; return", "collect(node, word_so_far, heap):", "    if node.is_word:", "        if heap.size < k: heap.insert(elem)", "        else if kulcs(elem) < kulcs(heap.max):", "            heap.extract_max(); heap.insert(elem)", "    for each (ch, child), ch szerint rendezve:", "        collect(child, word_so_far + ch, heap)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let NODES = null;
function buildT(d){
  const nodes = {"": {ch: {}, w: false, f: 0}};
  for (const [word, fr] of d) { let cur = "";
    for (const c of word) { const nxt = cur + c; if (!(c in nodes[cur].ch)) { nodes[cur].ch[c] = nxt; nodes[nxt] = {ch: {}, w: false, f: 0}; } cur = nxt; }
    if (nodes[cur].w) nodes[cur].f += fr; else { nodes[cur].w = true; nodes[cur].f = fr; } }
  return nodes;
}
const KEYC = (a, b) => (b[0] - a[0]) || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);   // kulcs(a) − kulcs(b) előjele; kulcs = (−f, w)
function hIns(h, e){ h.push(e); let i = h.length - 1; while (i > 0 && KEYC(h[(i-1)>>1], h[i]) < 0) { [h[i], h[(i-1)>>1]] = [h[(i-1)>>1], h[i]]; i = (i-1)>>1; } }
function hExt(h){ const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0;
  while (true) { const l = 2*i+1, r = 2*i+2; let m = i; if (l < h.length && KEYC(h[l], h[m]) > 0) m = l; if (r < h.length && KEYC(h[r], h[m]) > 0) m = r; if (m === i) break; [h[i], h[m]] = [h[m], h[i]]; i = m; } }
  return top; }
function query(nodes, prefix, k){
  const st = []; let path = [""], node = "";
  for (const c of prefix) { if (!(c in nodes[node].ch)) { st.push({cur: node, path, heap: [], line: 1, msg: `A(z) „${prefix}” prefixnek nincs csúcsa → []`, res: []}); return st; }
    node = nodes[node].ch[c]; path = path.concat([node]); }
  const heap = [], vis = [];
  st.push({cur: node, path, heap: [], line: 2, msg: `query(„${prefix}”), k = ${k}: a prefix csúcsa megvan; üres max-heap, kulcs (−frequency, word)`});
  const cp = () => heap.map(x => x.slice());
  const collect = (n, wsf) => { vis.push(n); const nd = nodes[n];
    if (nd.w) { const e = [nd.f, wsf];
      if (heap.length < k) { hIns(heap, e); st.push({cur: n, path, vis: vis.slice(), heap: cp(), line: 7, op: "ins", msg: `„${wsf}” (${nd.f}) szóvég: heap.size < k → beszúrás; gyökér (legrosszabb bent lévő): („${heap[0][1]}”, ${heap[0][0]})`}); }
      else if (KEYC(e, heap[0]) < 0) { const old = hExt(heap); hIns(heap, e);
        st.push({cur: n, path, vis: vis.slice(), heap: cp(), line: 9, op: "rep", out: old, msg: `„${wsf}” (${nd.f}): kulcs (−${nd.f}, „${wsf}”) < gyökér kulcsa (−${old[0]}, „${old[1]}”) → a gyökér („${old[1]}”, ${old[0]}) kikerül, „${wsf}” be`}); }
      else st.push({cur: n, path, vis: vis.slice(), heap: cp(), line: 8, op: "skip", msg: `„${wsf}” (${nd.f}): nem jobb a gyökérnél (−${heap[0][0]}, „${heap[0][1]}”) → kimarad`});
    } else st.push({cur: n, path, vis: vis.slice(), heap: cp(), line: 10, msg: `csúcs „${wsf}”: nem szóvég, a gyerekek betűrendben: ${Object.keys(nd.ch).sort().join(", ") || "–"}`});
    for (const c of Object.keys(nd.ch).sort()) collect(nd.ch[c], wsf + c); };
  collect(node, prefix);
  const res = heap.slice().sort(KEYC).map(([f, w]) => [w, f]);
  st.push({cur: null, path, vis: vis.slice(), heap: cp(), line: 4, res, msg: "Eredmény (−frequency, word) szerint rendezve: " + res.map(([w, f]) => `(„${w}”, ${f})`).join(", ")});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 330");
  const nodes = NODES || buildT([["app", 3], ["apple", 3], ["apt", 5], ["bat", 2]]);
  // trie elrendezés (levelek egyenközűen)
  const P = {}; let nx = 0, maxd = 0;
  const lay = (n, d) => { maxd = Math.max(maxd, d); const ks = Object.keys(nodes[n].ch).sort();
    if (!ks.length) { P[n] = [nx++, d]; return P[n][0]; } const xs = ks.map(c => lay(nodes[n].ch[c], d + 1)); P[n] = [(xs[0] + xs[xs.length-1]) / 2, d]; return P[n][0]; };
  lay("", 0);
  const W = 330, sx = Math.min(46, (W - 30) / Math.max(1, nx - 1 || 1)), sy = Math.min(52, 290 / Math.max(1, maxd)), X = v => 20 + v * sx + (nx <= 1 ? 140 : 0), Y = d => 22 + d * sy;
  const R = Math.min(13, sx * 0.38), inPath = new Set(s.path || []), vis = new Set(s.vis || []);
  for (const n in P) for (const c in nodes[n].ch) { const m = nodes[n].ch[c];
    el("line", {x1: X(P[n][0]), y1: Y(P[n][1]), x2: X(P[m][0]), y2: Y(P[m][1]), stroke: css("--line"), "stroke-width": inPath.has(n) && inPath.has(m) ? 4 : 1.2});
    el("text", {x: (X(P[n][0]) + X(P[m][0])) / 2 + 4, y: (Y(P[n][1]) + Y(P[m][1])) / 2, "font-size": 12, "font-style": "italic"}, c); }
  for (const n in P) { const nd = nodes[n], cur = n === s.cur, x = X(P[n][0]), y = Y(P[n][1]);
    el("circle", {cx: x, cy: y, r: R, fill: cur ? css("--hl") : vis.has(n) ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    if (nd.w) el("circle", {cx: x, cy: y, r: R - 3.5, fill: "none", stroke: cur ? "#fff" : css("--line"), "stroke-width": 1.2});
    if (nd.w) { if (sx >= 40) el("text", {x: x + R + 2, y: y + 4, "font-size": 11}, `${n}:${nd.f}`);
      else el("text", {x, y: y + R + 12, "text-anchor": "middle", "font-size": 10}, String(nd.f)); } }
  // heap fa- és tömbnézet
  const h = s.heap || [], hx = 470, bw = 112;
  el("text", {x: 360, y: 18, "font-size": 13, "font-weight": "bold"}, `max-heap (${h.length} elem)`);
  const HP = i => { const d = Math.floor(Math.log2(i + 1)), first = 2 ** d - 1, cnt = 2 ** d; return [360 + (i - first + 0.5) * (270 / cnt), 46 + d * 50]; };
  h.forEach((e, i) => { const [x, y] = HP(i); if (i > 0) { const [px, py] = HP((i - 1) >> 1); el("line", {x1: px, y1: py + 12, x2: x, y2: y - 12, stroke: css("--line"), "stroke-width": 1}); } });
  h.forEach((e, i) => { const [x, y] = HP(i), w = Math.min(bw, 270 / 2 ** Math.floor(Math.log2(i + 1)) - 4);
    el("rect", {x: x - w/2, y: y - 12, width: w, height: 24, rx: 5, fill: css("--cell"), stroke: css("--line"), "stroke-width": i === 0 ? 3 : 1});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": w < 60 ? 9 : 12}, w < 60 ? `${e[1]}:${e[0]}` : `(−${e[0]}, „${e[1]}”)`); });
  el("text", {x: 360, y: 268, "font-size": 12}, "tömb: [" + h.map(e => e[1]).join(", ") + "]");
  if (s.out) el("text", {x: 360, y: 288, "font-size": 12, "font-weight": "bold"}, `kikerült: („${s.out[1]}”, ${s.out[0]})`);
  if (s.res) el("text", {x: 360, y: 308, "font-size": 12, "font-weight": "bold"}, "eredmény: " + s.res.map(([w, f]) => `(${w}, ${f})`).join(", "));
  el("text", {x: 10, y: 326, "font-size": 11, fill: css("--muted")}, "dupla kör = szóvég · vastag él = prefix útja · kék = aktuális · szürke = bejárt · vastag keret = heap gyökere (legrosszabb)");
}
function load(dict){
  const msg = document.getElementById("err");
  let d = dict;
  if (!d) { try { d = document.getElementById("dict").value.split(/[;,]\s*/).filter(x => x.trim()).map(p => { const [w, f] = p.trim().split(/[: ]+/); if (!w || !/^[a-zà-ű]+$/i.test(w) || !Number.isInteger(+f)) throw 0; return [w, +f]; }); }
    catch (e) { msg.textContent = "Szótár formátuma: szó:gyakoriság; pl. app:3; apple:3"; return; } }
  const k = +document.getElementById("kk").value, pre = document.getElementById("pre").value;
  if (d.length < 1 || d.length > 16 || !(k >= 1 && k <= 12)) { msg.textContent = "1–16 szó, 1 ≤ k ≤ 12."; return; }
  msg.textContent = ""; NODES = buildT(d); setSteps(query(NODES, pre, k));
}
function tieTest(){
  const ws = []; for (let c = "k".charCodeAt(0); c >= 97; c--) ws.push(["a" + String.fromCharCode(c), 1]);
  document.getElementById("dict").value = ws.map(([w, f]) => `${w}:${f}`).join("; ");
  document.getElementById("kk").value = 10; document.getElementById("pre").value = "a"; load();
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
