<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treap-beszúrás forgatásokkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kulcs <input id="key" value="25" size="3" aria-label="Kulcs"></label><label>prioritás <input id="pri" value="8" size="3" aria-label="Prioritás"></label><button onclick="ins()">Beszúrás</button><label>seed <input id="seed" value="1" size="3" aria-label="Seed"></label><button onclick="rnd()">Véletlen prioritás</button><button onclick="reset()">Üres fa</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Treap lépésenként: 10(5), 20(7), 30(2), 40(9) beszúrása; a 20 és a 40 balra forgatással kerül feljebb, a végső gyökér 40(9)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Max-kupac a prioritásokon, BST a kulcsokon. Kezdőállapot: a 12.2.13 példája (7 lépés). A saját beszúrás a példa végső fájához (vagy az üres fához) ad hozzá; az inorder-sor mindig növekvő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": [10, 5, null, null], "new": 10, "bad": null, "rot": null, "line": 1, "msg": "t == NIL → NEW-NODE(10, 5): 10(5) a gyökér", "ino": [10], "heap": true}, {"tree": [10, 5, null, [20, 7, null, null]], "new": 20, "bad": [10, 20], "rot": null, "line": 6, "msg": "BST-leszállás: 20(7) a 10(5) jobb gyereke; 7 > 5 → kupacsértés", "ino": [10, 20], "heap": false}, {"tree": [20, 7, [10, 5, null, null], null], "new": 20, "bad": null, "rot": [10, "L"], "line": 7, "msg": "t.right.priority = 7 > 5 → ROTATE-LEFT(10): 20 kerül 10 helyére; a kupac helyreállt", "ino": [10, 20], "heap": true}, {"tree": [20, 7, [10, 5, null, null], [30, 2, null, null]], "new": 30, "bad": null, "rot": null, "line": 6, "msg": "BST-leszállás: 30(2) a 20(7) jobb gyereke; a kupac rendben", "ino": [10, 20, 30], "heap": true}, {"tree": [20, 7, [10, 5, null, null], [30, 2, null, [40, 9, null, null]]], "new": 40, "bad": [30, 40], "rot": null, "line": 6, "msg": "BST-leszállás: 40(9) a 30(2) jobb gyereke; 9 > 2 → kupacsértés", "ino": [10, 20, 30, 40], "heap": false}, {"tree": [20, 7, [10, 5, null, null], [40, 9, [30, 2, null, null], null]], "new": 40, "bad": [20, 40], "rot": [30, "L"], "line": 7, "msg": "t.right.priority = 9 > 2 → ROTATE-LEFT(30): 40 kerül 30 helyére; még sért: 9 > 7", "ino": [10, 20, 30, 40], "heap": false}, {"tree": [40, 9, [20, 7, [10, 5, null, null], [30, 2, null, null]], null], "new": 40, "bad": null, "rot": [20, "L"], "line": 7, "msg": "t.right.priority = 9 > 7 → ROTATE-LEFT(20): 40 kerül 20 helyére; a kupac helyreállt", "ino": [10, 20, 30, 40], "heap": true}];
const CODE = ["TREAP-INSERT(t, k, priority)", "    if t == NIL: return NEW-NODE(k, priority)", "    if k < t.key", "        t.left = TREAP-INSERT(t.left, k, priority)", "        if t.left.priority > t.priority: t = ROTATE-RIGHT(t)", "    else if k > t.key", "        t.right = TREAP-INSERT(t.right, k, priority)", "        if t.right.priority > t.priority: t = ROTATE-LEFT(t)", "    return t"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function clone(t){ return t === null ? null : [t[0], t[1], clone(t[2]), clone(t[3])]; }
function inorder(t){ return t === null ? [] : inorder(t[2]).concat([t[0]], inorder(t[3])); }
function heapOk(t){ if (t === null) return true; return [t[2], t[3]].every(c => c === null || c[1] < t[1]) && heapOk(t[2]) && heapOk(t[3]); }
function insertSteps(root, k, p){
  const steps = []; root = clone(root);
  const snap = (line, msg, bad, rot) => steps.push({tree: clone(root), new: k, bad: bad || null, rot: rot || null, line, msg, ino: inorder(root), heap: heapOk(root)});
  if (root === null) { root = [k, p, null, null]; snap(1, `t == NIL → NEW-NODE(${k}, ${p}): ${k}(${p}) a gyökér`); return [root, steps]; }
  const path = []; let t = root, side;
  while (true) { path.push(t);
    if (k === t[0]) { snap(8, `${k} már jelen van; a fa változatlan`); return [root, steps]; }
    side = k < t[0] ? 2 : 3;
    if (t[side] === null) { t[side] = [k, p, null, null];
      snap(side === 2 ? 3 : 6, `BST-leszállás: ${k}(${p}) a ${t[0]}(${t[1]}) ${side === 2 ? "bal" : "jobb"} gyereke` + (p > t[1] ? `; ${p} > ${t[1]} → kupacsértés` : "; a kupac rendben"), p > t[1] ? [t[0], k] : null); break; }
    t = t[side]; }
  let child = t[side];
  for (let i = path.length - 1; i >= 0; i--) { const par = path[i], s2 = par[2] === child ? 2 : 3;
    if (!(child[1] > par[1])) break;
    let y, line, nm, cond;
    if (s2 === 3) { y = par[3]; par[3] = y[2]; y[2] = par; line = 7; nm = "ROTATE-LEFT"; cond = `t.right.priority = ${y[1]} > ${par[1]}`; }
    else { y = par[2]; par[2] = y[3]; y[3] = par; line = 4; nm = "ROTATE-RIGHT"; cond = `t.left.priority = ${y[1]} > ${par[1]}`; }
    if (i === 0) root = y; else { const gp = path[i-1]; if (gp[2] === par) gp[2] = y; else gp[3] = y; }
    const gp = i > 0 ? path[i-1] : null, bad = gp !== null && y[1] > gp[1] ? [gp[0], y[0]] : null;
    snap(line, `${cond} → ${nm}(${par[0]}): ${y[0]} kerül ${par[0]} helyére` + (bad ? `; még sért: ${y[1]} > ${gp[1]}` : "; a kupac helyreállt"), bad, [par[0], nm === "ROTATE-LEFT" ? "L" : "R"]);
    child = y; }
  return [root, steps];
}
function layout(t){ const pos = {}, pr = {}; let nxt = 0;
  (function w(t, d){ if (t === null) return; w(t[2], d + 1); pos[t[0]] = [nxt++, d]; pr[t[0]] = t[1]; w(t[3], d + 1); })(t, 0); return [pos, pr, nxt]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const [pos, pr, n] = layout(s.tree), dx = Math.min(80, 520 / Math.max(n, 1)), x0 = 280 - (n - 1) * dx / 2;
  const P = {}; for (const k in pos) P[k] = [x0 + pos[k][0] * dx, 36 + pos[k][1] * 56];
  (function ed(t){ if (t === null) return; for (const c of [t[2], t[3]]) if (c !== null) { const bad = s.bad && s.bad[0] === t[0] && s.bad[1] === c[0];
      el("line", {x1: P[t[0]][0], y1: P[t[0]][1], x2: P[c[0]][0], y2: P[c[0]][1], stroke: bad ? css("--hl2") : css("--line"), "stroke-width": bad ? 3 : 1.3, "stroke-dasharray": bad ? "6 4" : "none"});
      if (bad) el("text", {x: (P[t[0]][0] + P[c[0]][0]) / 2 + 10, y: (P[t[0]][1] + P[c[0]][1]) / 2, "font-size": 20, "font-weight": "bold"}, "!"); ed(c); } })(s.tree);
  for (const k in P) { const [x, y] = P[k], nw = +k === s.new, piv = s.rot && s.rot[0] === +k;
    el("circle", {cx: x, cy: y, r: 22, fill: nw ? css("--cellhl") : css("--cell"), stroke: piv ? css("--hl") : css("--line"), "stroke-width": nw || piv ? 3.5 : 1.3});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12.5}, `${k}(${pr[k]})`); }
  el("text", {x: 10, y: 275, "font-size": 13}, "inorder: " + s.ino.join(", "));
  el("text", {x: 550, y: 275, "text-anchor": "end", "font-size": 13, "font-weight": "bold", fill: s.heap ? css("--fg") : css("--hl2")}, s.heap ? "kupacinvariáns: ✓" : "kupacinvariáns: sérül (!)");
}
let ROOT = [40, 9, [20, 7, [10, 5, null, null], [30, 2, null, null]], null];
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let RNG = mulberry(1);
function ins(){
  const k = parseInt(document.getElementById("key").value, 10), p = parseInt(document.getElementById("pri").value, 10), e = document.getElementById("err");
  if (isNaN(k) || isNaN(p)) { e.textContent = "Egész kulcs és prioritás kell."; return; }
  if (inorder(ROOT).length >= 12) { e.textContent = "Legfeljebb 12 csúcs (az Alaphelyzet törli a fát)."; return; }
  e.textContent = ""; const r = insertSteps(ROOT, k, p); ROOT = r[0]; setSteps(r[1]);
}
function rnd(){ const sd = parseInt(document.getElementById("seed").value, 10) || 1; if (rnd.sd !== sd) { RNG = mulberry(sd); rnd.sd = sd; }
  document.getElementById("pri").value = 1 + Math.floor(RNG() * 99); }
function reset(){ ROOT = null; document.getElementById("err").textContent = "Üres fa: szúrjon be saját (kulcs, prioritás) párokat."; setSteps([{tree: null, new: null, bad: null, rot: null, line: 1, msg: "Üres treap", ino: [], heap: true}]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
