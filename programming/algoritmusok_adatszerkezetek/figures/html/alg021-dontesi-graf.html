<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döntési gráf lineáris struktúrához</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
svg{flex:1 1 300px;width:100%;max-width:430px;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
svg .clk{cursor:pointer}
#side{flex:1 1 260px}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
th{background:var(--code);font-weight:600}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Válasz">
  <button id="yes">igen</button><button id="no">nem</button>
  <button id="back">◀ Vissza</button><button id="reset">⏮ Újra</button>
  <span class="small">Válaszolhat a gombokkal, vagy a rajzon az aktuális kérdés „igen”/„nem” élére kattintva.</span>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 420 520" role="img" aria-label="Döntési gráf: LIFO?, FIFO?, középső beszúrás ismert pozíción?, indexelés is?, dinamikus foglalás tilos? kérdésekkel"></svg>
  <div id="side"><div id="leaf"></div></div>
</div>
<p class="small">A döntés a műveleti profil alapján; a konstans tényezőket mérés dönti el (6. labor). A táblázat cellái
a 2. szakasz összehasonlító táblázatából valók.</p>
<script>
const D = {"nodes": {"d1": {"t": "q", "txt": "LIFO?", "x": 2.6, "y": 10.0, "out": {"igen": "l1", "nem": "d2"}}, "d2": {"t": "q", "txt": "FIFO?", "x": 2.6, "y": 8.4, "out": {"igen": "l2", "nem": "d3"}}, "d3": {"t": "q", "txt": "Középső beszúrás/\ntörlés ismert\npozíción?", "x": 2.6, "y": 6.6, "out": {"nem": "l3", "igen": "d4"}}, "d4": {"t": "q", "txt": "Indexelés is?", "x": 2.6, "y": 4.8, "out": {"igen": "l4", "nem": "d5"}}, "d5": {"t": "q", "txt": "Dinamikus\nfoglalás tilos?", "x": 2.6, "y": 3.1, "out": {"igen": "l5", "nem": "l6"}}, "l1": {"t": "l", "txt": "Dinamikus tömb\n(veremként)", "x": 6.55, "y": 10.0, "out": {}}, "l2": {"t": "l", "txt": "Körkörös tömb /\nblokkos deque", "x": 6.55, "y": 8.4, "out": {}}, "l3": {"t": "l", "txt": "Dinamikus tömb\n(indexelés, bejárás)", "x": 6.55, "y": 6.6, "out": {}}, "l4": {"t": "l", "txt": "Fejlett struktúra\n(skip list, B-fa)", "x": 6.55, "y": 4.8, "out": {}}, "l5": {"t": "l", "txt": "Intruzív lista", "x": 6.55, "y": 3.1, "out": {}}, "l6": {"t": "l", "txt": "Kétszeresen\nláncolt lista", "x": 2.6, "y": 1.4, "out": {}}}, "rows": ["Elérés (get(i))", "Beszúrás elejére", "Beszúrás végére", "Beszúrás közepére (k)", "Törlés elejéről", "Törlés közepéről (k)", "Memória (gyakorlati)"], "cols": {"Dinamikus tömb (Vector)": ["Θ(1)", "Θ(n)", "Θ(1) amortizált", "Θ(n−k)", "Θ(n)", "Θ(n−k)", "Alacsony konstans, egybefüggő"], "Láncolt lista (Singly/Doubly)": ["Θ(k)", "Θ(1)", "Θ(1) vagy Θ(n)*", "Θ(k)", "Θ(1)", "Θ(k)", "Magas konstans (heap overhead), fragmentált"], "Sor / Deque (Körkörös tömb)": ["Θ(1) (eleje/vége)", "Θ(1)", "Θ(1)", "Θ(min(k, n−k))", "Θ(1)", "Θ(min(k, n−k))", "Alacsony konstans"]}, "leafcol": {"l1": "Dinamikus tömb (Vector)", "l2": "Sor / Deque (Körkörös tömb)", "l3": "Dinamikus tömb (Vector)", "l4": null, "l5": "Láncolt lista (Singly/Doubly)", "l6": "Láncolt lista (Singly/Doubly)"}, "note": {"l1": "Verem: push/pop a tömb végén Θ(1) amortizáltan, egybefüggő memória.", "l2": "Sor/deque: mindkét vég Θ(1) a körkörös pufferrel (6.3.6); blokkos deque, ha nem lehet egy nagy összefüggő terület.", "l3": "Alapértelmezés: indexelés Θ(1), cache-barát bejárás.", "l4": "A 2. táblázatban nincs ilyen oszlop: indexelés és középső módosítás együtt O(log n) struktúrát kíván (skip list, B-fa, rangfa – későbbi fejezetek).", "l5": "A láncolt lista oszlopa érvényes, de a mutatók a felhasználói rekordban vannak, külön foglalás nélkül.", "l6": "Az O(1) középső művelet csak ismert csomóponton igaz (a keresés Θ(k)); a konstans tényezőket mérés dönti el (6. labor) – mérj!"}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const X = x => 20 + x * 52, Y = y => 520 - (y * 46 + 20);
let path = ["d1"], ans = [];
function lines(g, txt, x, y, fs, bold){ const L = txt.split("\n"); L.forEach((s, i) => el("text", {x, y: y + (i - (L.length-1)/2) * (fs+2) + fs/3, "text-anchor": "middle", "font-size": fs, "font-weight": bold ? "bold" : "normal"}, s)); }
function draw(){
  svg.innerHTML = "";
  const cur = path[path.length-1], on = new Set(path);
  for (const [k, n] of Object.entries(D.nodes)) for (const [a, b] of Object.entries(n.out)) {
    const m = D.nodes[b], used = on.has(k) && on.has(b) && path.indexOf(b) === path.indexOf(k) + 1;
    const x0 = X(n.x), y0 = Y(n.y), x1 = X(m.x), y1 = Y(m.y);
    const right = Math.abs(n.y - m.y) < 1e-6;
    const xs = right ? x0 + 60 : x0, ys = right ? y0 : y0 + 30, xe = right ? x1 - 66 : x1, ye = right ? y1 : y1 - (m.t === "q" ? 30 : 24);
    const g = el("g", {class: k === cur ? "clk" : ""});
    const ln = document.createElementNS(NS, "line"); [["x1",xs],["y1",ys],["x2",xe],["y2",ye],["stroke", used ? css("--hl") : css("--line")],["stroke-width", used ? 4 : 1.3]].forEach(([p,v]) => ln.setAttribute(p, v)); g.appendChild(ln);
    const hd = document.createElementNS(NS, "path"); const ang = Math.atan2(ye-ys, xe-xs);
    hd.setAttribute("d", `M${xe},${ye} L${xe-9*Math.cos(ang-0.4)},${ye-9*Math.sin(ang-0.4)} L${xe-9*Math.cos(ang+0.4)},${ye-9*Math.sin(ang+0.4)} Z`);
    hd.setAttribute("fill", used ? css("--hl") : css("--line")); g.appendChild(hd);
    const tx = document.createElementNS(NS, "text"); tx.setAttribute("x", right ? (xs+xe)/2 : xs + 6); tx.setAttribute("y", right ? ys - 5 : (ys+ye)/2 + 4);
    tx.setAttribute("text-anchor", right ? "middle" : "start"); tx.setAttribute("font-size", 12); tx.setAttribute("font-style", "italic");
    if (k === cur) { tx.setAttribute("font-weight", "bold"); tx.setAttribute("text-decoration", "underline"); }
    tx.textContent = a; g.appendChild(tx);
    if (k === cur) { const hit = document.createElementNS(NS, "rect"); const bx = Math.min(xs, xe) - 8, by = Math.min(ys, ye) - 14;
      hit.setAttribute("x", bx); hit.setAttribute("y", by); hit.setAttribute("width", Math.abs(xe-xs) + 16); hit.setAttribute("height", Math.abs(ye-ys) + 22);
      hit.setAttribute("fill", "transparent"); g.appendChild(hit); g.addEventListener("click", () => go(a)); }
  }
  for (const [k, n] of Object.entries(D.nodes)) {
    const x = X(n.x), y = Y(n.y), act = k === cur, vis = on.has(k);
    if (n.t === "q") el("path", {d: `M${x-60},${y} L${x},${y-30} L${x+60},${y} L${x},${y+30} Z`, fill: vis ? css("--cellhl") : css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": act ? 3.5 : 1});
    else el("rect", {x: x-66, y: y-24, width: 132, height: 48, rx: 6, fill: vis ? css("--cellhl") : css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": act ? 4.5 : 2.6});
    lines(null, n.txt, x, y, n.t === "q" ? 10.5 : 11, n.t !== "q");
  }
}
function info(){
  const cur = path[path.length-1], n = D.nodes[cur], st = document.getElementById("status"), lf = document.getElementById("leaf");
  const trail = ans.map((a, i) => D.nodes[path[i]].txt.replace(/\/\n/g, "/").replace(/\n/g, " ") + " → " + a).join("; ");
  if (n.t === "q") { st.textContent = (trail ? trail + ". " : "") + "Kérdés: " + n.txt.replace(/\/\n/g, "/").replace(/\n/g, " "); lf.innerHTML = ""; }
  else {
    st.textContent = trail + ". Javaslat: " + n.txt.replace(/\/\n/g, "/").replace(/\n/g, " ");
    const c = D.leafcol[cur];
    let h = `<p>${D.note[cur]}</p>`;
    if (c) h += `<table><thead><tr><th>Művelet</th><th>${c}</th></tr></thead><tbody>` + D.rows.map((r, i) => `<tr><td>${r}</td><td>${D.cols[c][i]}</td></tr>`).join("") + "</tbody></table>";
    lf.innerHTML = h;
  }
  document.getElementById("yes").disabled = document.getElementById("no").disabled = n.t !== "q";
  document.getElementById("back").disabled = path.length < 2;
}
function go(a){ const cur = path[path.length-1], n = D.nodes[cur]; if (n.t !== "q") return; ans.push(a); path.push(n.out[a]); draw(); info(); }
document.getElementById("yes").onclick = () => go("igen");
document.getElementById("no").onclick = () => go("nem");
document.getElementById("back").onclick = () => { if (path.length > 1) { path.pop(); ans.pop(); draw(); info(); } };
document.getElementById("reset").onclick = () => { path = ["d1"]; ans = []; draw(); info(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw(); info();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
