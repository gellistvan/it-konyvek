<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinic: szintgráf és blokkoló áramlás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><input id="own" size="40" value="s-a 10, s-b 10, a-b 2, a-t 5, b-t 10" aria-label="Saját hálózat: irányított élek kapacitással"><button onclick="load()">Saját hálózat</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Dinic a négycsúcsú példán: a szintek s = 0, a = b = 1, t = 2, az a → b él azonos szintre mutat, ezért kimarad; a blokkoló áramlás 5 + 10 = 15, a 2. fázisban t nem érhető el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 25.3.8 (1.7) példája. A szomszédsági listák az éllista sorrendjében épülnek (a visszamutató bejegyzésekkel együtt); a csúcsok a BFS-szintjük szerinti oszlopokban állnak. Saját hálózat: „u-v kapacitás” elemek vesszővel elválasztva, s forrás, t nyelő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = ["DinicMaxFlow(G, s, t):", "  while BFS_szintek(c_f, s, t):", "    cur ← első él minden csúcsra", "    while (pushed ← DFS(s, ∞)) > 0: folyam += pushed", "DFS(u, limit): ha u = t: return limit", "  for i ← cur[u] .. deg(u): cur[u] ← i; v ← szomszéd(u, i)", "    ha c_f[u][v] > 0 és szint[v] = szint[u] + 1:", "      pushed ← DFS(v, min(limit, c_f[u][v]))", "      ha pushed > 0: c_f frissítése; return pushed", "  return 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

let EDG = [["s","a",10],["s","b",10],["a","b",2],["a","t",5],["b","t",10]];
function trace(edges){
  const V = []; edges.forEach(([u, v]) => { for (const x of [u, v]) if (!V.includes(x)) V.push(x); });
  if (!V.includes("s") || !V.includes("t")) return [{msg: "A hálózatban legyen s és t csúcs.", V, cf: {}, adj: {}, lvl: {}, cap: {}}];
  const cf = {}, adj = {}, cap = {}; V.forEach(x => adj[x] = []);
  edges.forEach(([u, v, c]) => { cf[u + "-" + v] = (cf[u + "-" + v] || 0) + c; if (!(v + "-" + u in cf)) cf[v + "-" + u] = 0; cap[u + "-" + v] = (cap[u + "-" + v] || 0) + c;
    if (!adj[u].includes(v)) adj[u].push(v); if (!adj[v].includes(u)) adj[v].push(u); });
  const st = [], snap = o => st.push(Object.assign({V, adj, cap, cf: {...cf}}, o));
  let flow = 0, phase = 0;
  while (phase < 50) { phase++;
    const lvl = {s: 0}, q = ["s"];
    snap({lvl: {...lvl}, phase, line: 1, flow, msg: `${phase}. fázis, BFS: szint(s) = 0.`});
    while (q.length) { const u = q.shift(); for (const v of adj[u]) if (!(v in lvl) && cf[u + "-" + v] > 0) { lvl[v] = lvl[u] + 1; q.push(v);
      snap({lvl: {...lvl}, phase, line: 1, flow, hi: [u, v], msg: `${phase}. fázis, BFS: szint(${v}) = ${lvl[v]} (a ${u}→${v} élen, c_f = ${cf[u + "-" + v]}).`}); } }
    if (!("t" in lvl)) { snap({lvl: {...lvl}, phase, line: 1, flow, reach: true, msg: `${phase}. fázis: a BFS nem éri el t-t (elérhető: ${Object.keys(lvl).join(", ")}). Vége, a maximális folyam ${flow}.`}); break; }
    const lgN = V.flatMap(u => adj[u].filter(v => u in lvl && v in lvl && cf[u + "-" + v] > 0 && lvl[v] === lvl[u] + 1).map(v => u + "→" + v));
    const excl = V.flatMap(u => adj[u].filter(v => u in lvl && v in lvl && cf[u + "-" + v] > 0 && lvl[v] === lvl[u]).map(v => u + "→" + v));
    snap({lvl: {...lvl}, phase, line: 2, flow, lg: true, msg: `Szintgráf: ${lgN.join(", ")}.` + (excl.length ? ` Kizárva (azonos szint): ${excl.join(", ")}.` : "")});
    const cur = {}; V.forEach(x => cur[x] = 0); let blk = 0;
    const dfs = (u, lim, path) => {
      if (u === "t") return lim;
      for (let i = cur[u]; i < adj[u].length; i++) { cur[u] = i; const v = adj[u][i];
        if (cf[u + "-" + v] > 0 && lvl[v] === lvl[u] + 1) {
          snap({lvl: {...lvl}, phase, line: 7, flow, lg: true, cur: {...cur}, path: path.concat([v]), msg: `DFS(${v}, ${Math.min(lim, cf[u + "-" + v]) === Infinity ? "∞" : Math.min(lim, cf[u + "-" + v])}) a ${u}→${v} élen (cur[${u}] = ${u}→${v}).`});
          const p = dfs(v, Math.min(lim, cf[u + "-" + v]), path.concat([v]));
          if (p > 0) { cf[u + "-" + v] -= p; cf[v + "-" + u] += p; return p; } } }
      cur[u] = adj[u].length;
      snap({lvl: {...lvl}, phase, line: 9, flow, lg: true, cur: {...cur}, path: path, msg: `DFS(${u}): nincs több szintgráf-él – 0-t ad vissza (cur[${u}] a lista végén).`});
      return 0; };
    while (true) { const p = dfs("s", Infinity, ["s"]); if (!p) break; blk += p; flow += p;
      snap({lvl: {...lvl}, phase, line: 8, flow, lg: true, cur: {...cur}, msg: `Frissítés: ${p} egység a t-be; blokkoló áramlás eddig ${blk}, összesen ${flow}.`}); }
    snap({lvl: {...lvl}, phase, line: 3, flow, lg: true, msg: `${phase}. fázis vége: a blokkoló áramlás ${blk}; folyam ${flow}.`});
  }
  const L0 = st.find(x => x.lg) || st[st.length - 1], P0 = layout(L0);
  st.forEach(x => x.P = P0);
  return st;
}
function layout(s){ const cols = {}; for (const v of s.V) { const L = v in s.lvl ? s.lvl[v] : 9; (cols[L] = cols[L] || []).push(v); }
  const keys = Object.keys(cols).map(Number).sort((a, b) => a - b), P = {};
  keys.forEach((L, i) => { const c = cols[L]; c.forEach((v, j) => P[v] = [40 + i * (440 / Math.max(1, keys.length - 1)), 150 + (j - (c.length - 1) / 2) * 110]); });
  return P; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 336"); G_defs();
  const P = s.P || layout(s);
  for (const v of s.V) if (v in s.lvl) { G_text(P[v][0], P[v][1] + (P[v][1] > 150 ? 36 : -26), `szint ${s.lvl[v]}`, {size: 11, anchor: "middle", fill: css("--muted"), halo: true}); }
  const onP = new Set(); if (s.path) for (let i = 0; i + 1 < s.path.length; i++) onP.add(s.path[i] + "-" + s.path[i + 1]);
  for (const k in s.cf) { const [u, v] = k.split("-"); if (s.cf[k] <= 0) continue;
    const back = !(k in s.cap), both = s.cf[v + "-" + u] > 0, inLg = s.lg && u in s.lvl && v in s.lvl && s.lvl[v] === s.lvl[u] + 1;
    const same = s.lg && u in s.lvl && v in s.lvl && s.lvl[v] === s.lvl[u];
    const hi = s.hi && s.hi[0] === u && s.hi[1] === v;
    G_edge(P[u], P[v], {r: 18, dir: true, w: onP.has(k) ? 4.5 : inLg ? 2.4 : 1.1, dash: back ? "7 5" : same ? "2 4" : "", curve: both ? 22 : 0,
      color: onP.has(k) || hi ? css("--hl2") : (s.lg && !inLg) ? css("--muted") : undefined, label: s.cf[k] + (same ? " (azonos szint)" : "")}); }
  if (s.cur) for (const u of s.V) { const i = s.cur[u]; if (i < s.adj[u].length && u !== "t") { const v = s.adj[u][i], m = G_mid(P[u], P[v], 0, 0.3);
    G_text(m[0], m[1] - 10, "cur", {size: 10, bold: true, fill: css("--hl"), anchor: "middle", halo: true}); } }
  for (const v of s.V) { const r = s.reach && v in s.lvl; G_node(P[v], v, {r: 18, fill: r ? "url(#dp)" : undefined, pat: r}); }
  G_text(10, 300, `fázis: ${s.phase || 0} · folyam: ${s.flow || 0}`, {size: 13, bold: true});
  G_text(10, 316, "címke: c_f · vastag = szintgráf-él · szaggatott = visszamutató maradék él", {size: 10.5, fill: css("--muted")});
  G_text(10, 330, "pontozott = azonos szintre mutató (kizárt) él · narancs = aktuális út · cur = current-arc mutató · pöttyös = elérhető", {size: 10.5, fill: css("--muted")});
}
function load(){ const txt = document.getElementById("own").value, E = [];
  for (const part of txt.split(/[,;\n]+/)) { const m = part.trim().match(/^(\w+)\s*(?:->|→|-)\s*(\w+)\s+(\d+)$/); if (m) E.push([m[1], m[2], +m[3]]); }
  if (!E.length) { status.textContent = "Nem értelmezhető hálózat. Minta: s-a 10, s-b 10, a-b 2, a-t 5, b-t 10"; return; }
  setSteps(trace(E)); }

STEPS = trace(EDG);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
