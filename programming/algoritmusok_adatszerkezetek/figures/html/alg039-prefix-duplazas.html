<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefix-duplázás lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sztring: <input id="inp" value="banana" size="16" aria-label="Sztring"></label><label><input id="bug" type="checkbox" onchange="load()"> hibás változat: 0-tól induló rangok, 0-s kitöltés</label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('bug').checked=true;load('aa')">Példa: „aa” hibásan</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Prefix-duplázás a banana sztringen: k = 1 után SA = [6, 2, 4, 1, 3, 5], rank = [3, 2, 4, 2, 4, 1]; k = 2 után SA = [6, 4, 2, 1, 5, 3]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 11.2 SuffixArrayPrefixDoubling a T-A4-070 javításával (1-től induló rangok, 0-s kitöltés). A hibás kapcsolóval a 0-tól induló változat az „aa” bemeneten [1, 2]-t ad a helyes [2, 1] helyett. Kezdőállapot: banana.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": "init", "k": 0, "rank": [2, 1, 3, 1, 3, 1], "line": 1, "msg": "Kezdő rangok (1-től): 'a' = 1, 'b' = 2, 'n' = 3 → rank = [2, 1, 3, 1, 3, 1]"}, {"phase": "pairs", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "line": 4, "msg": "k = 1: párok (rank[i], rank[i+1]) → (2,1), (1,3), (3,1), (1,3), (3,1), (1,0)"}, {"phase": "sorted", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "line": 5, "msg": "k = 1: rendezés → SA = [6, 2, 4, 1, 3, 5]"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1}, "j": 1, "line": 6, "msg": "k = 1: új_rank[6] = 1"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1, "2": 2}, "j": 2, "line": 7, "msg": "k = 1: új_rank[2] = 2 (új pár → +1)"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1, "2": 2, "4": 2}, "j": 3, "line": 7, "msg": "k = 1: új_rank[4] = 2 (azonos pár, mint az előző)"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1, "2": 2, "4": 2, "1": 3}, "j": 4, "line": 7, "msg": "k = 1: új_rank[1] = 3 (új pár → +1)"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1, "2": 2, "4": 2, "1": 3, "3": 4}, "j": 5, "line": 7, "msg": "k = 1: új_rank[3] = 4 (új pár → +1)"}, {"phase": "assign", "k": 1, "rank": [2, 1, 3, 1, 3, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "part": {"6": 1, "2": 2, "4": 2, "1": 3, "3": 4, "5": 4}, "j": 6, "line": 7, "msg": "k = 1: új_rank[5] = 4 (azonos pár, mint az előző)"}, {"phase": "done", "k": 1, "rank": [3, 2, 4, 2, 4, 1], "pair": [[2, 1], [1, 3], [3, 1], [1, 3], [3, 1], [1, 0]], "SA": [6, 2, 4, 1, 3, 5], "line": 8, "msg": "k = 1 vége: rank = [3, 2, 4, 2, 4, 1], SA = [6, 2, 4, 1, 3, 5]; k ← 2"}, {"phase": "pairs", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "line": 4, "msg": "k = 2: párok (rank[i], rank[i+2]) → (3,4), (2,2), (4,4), (2,1), (4,0), (1,0)"}, {"phase": "sorted", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "line": 5, "msg": "k = 2: rendezés → SA = [6, 4, 2, 1, 5, 3]"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1}, "j": 1, "line": 6, "msg": "k = 2: új_rank[6] = 1"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2}, "j": 2, "line": 7, "msg": "k = 2: új_rank[4] = 2 (új pár → +1)"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3}, "j": 3, "line": 7, "msg": "k = 2: új_rank[2] = 3 (új pár → +1)"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4}, "j": 4, "line": 7, "msg": "k = 2: új_rank[1] = 4 (új pár → +1)"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4, "5": 5}, "j": 5, "line": 7, "msg": "k = 2: új_rank[5] = 5 (új pár → +1)"}, {"phase": "assign", "k": 2, "rank": [3, 2, 4, 2, 4, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4, "5": 5, "3": 6}, "j": 6, "line": 7, "msg": "k = 2: új_rank[3] = 6 (új pár → +1)"}, {"phase": "done", "k": 2, "rank": [4, 3, 6, 2, 5, 1], "pair": [[3, 4], [2, 2], [4, 4], [2, 1], [4, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "line": 8, "msg": "k = 2 vége: rank = [4, 3, 6, 2, 5, 1], SA = [6, 4, 2, 1, 5, 3]; k ← 4"}, {"phase": "pairs", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "line": 4, "msg": "k = 4: párok (rank[i], rank[i+4]) → (4,5), (3,1), (6,0), (2,0), (5,0), (1,0)"}, {"phase": "sorted", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "line": 5, "msg": "k = 4: rendezés → SA = [6, 4, 2, 1, 5, 3]"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1}, "j": 1, "line": 6, "msg": "k = 4: új_rank[6] = 1"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2}, "j": 2, "line": 7, "msg": "k = 4: új_rank[4] = 2 (új pár → +1)"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3}, "j": 3, "line": 7, "msg": "k = 4: új_rank[2] = 3 (új pár → +1)"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4}, "j": 4, "line": 7, "msg": "k = 4: új_rank[1] = 4 (új pár → +1)"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4, "5": 5}, "j": 5, "line": 7, "msg": "k = 4: új_rank[5] = 5 (új pár → +1)"}, {"phase": "assign", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "part": {"6": 1, "4": 2, "2": 3, "1": 4, "5": 5, "3": 6}, "j": 6, "line": 7, "msg": "k = 4: új_rank[3] = 6 (új pár → +1)"}, {"phase": "done", "k": 4, "rank": [4, 3, 6, 2, 5, 1], "pair": [[4, 5], [3, 1], [6, 0], [2, 0], [5, 0], [1, 0]], "SA": [6, 4, 2, 1, 5, 3], "line": 8, "msg": "k = 4 vége: rank = [4, 3, 6, 2, 5, 1], SA = [6, 4, 2, 1, 5, 3]; k ← 8"}, {"phase": "end", "k": 8, "rank": [4, 3, 6, 2, 5, 1], "SA": [6, 4, 2, 1, 5, 3], "line": 9, "msg": "k = 8 ≥ n = 6 → return SA = [6, 4, 2, 1, 5, 3]"}];
const CODE = ["SuffixArrayPrefixDoubling(S[1..n]):", "  rank[i] = a S[i] karakter rangja (1, 2, …, σ)", "  k = 1", "  while k < n:", "    pár[i] = (rank[i], rank[i+k]), ha i + k ≤ n, különben (rank[i], 0)", "    SA = az indexek a párok szerint (stabilan) rendezve", "    új_rank[SA[1]] = 1", "    for i = 2 to n: új_rank[SA[i]] = új_rank[SA[i-1]] + (pár[SA[i]] ≠ pár[SA[i-1]])", "    rank = új_rank; k = 2k", "  return SA"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = "banana";
function doubling(s, buggy){
  const n = s.length, base = buggy ? 0 : 1, alpha = [...new Set(s)].sort(), rec = [];
  let rank = [...s].map(c => alpha.indexOf(c) + base);
  rec.push({phase: "init", k: 0, rank: rank.slice(), line: 1, msg: `Kezdő rangok (${base}-tól): ` + alpha.map(c => `'${c}' = ${alpha.indexOf(c) + base}`).join(", ") + ` → rank = [${rank.join(", ")}]`});
  let SA = [...Array(n).keys()].map(i => i + 1).sort((a, b) => rank[a-1] - rank[b-1] || a - b), k = 1;
  const cmp = (p, q) => p[0] - q[0] || p[1] - q[1];
  while (k < n) {
    const pair = [...Array(n).keys()].map(i => [rank[i], i + 1 + k <= n ? rank[i + k] : 0]);
    rec.push({phase: "pairs", k, rank: rank.slice(), pair, line: 4, msg: `k = ${k}: párok (rank[i], rank[i+${k}]) → ` + pair.map(p => `(${p[0]},${p[1]})`).join(", ")});
    SA = [...Array(n).keys()].map(i => i + 1).sort((a, b) => cmp(pair[a-1], pair[b-1]) || a - b);
    rec.push({phase: "sorted", k, rank: rank.slice(), pair, SA: SA.slice(), line: 5, msg: `k = ${k}: rendezés → SA = [${SA.join(", ")}]`});
    const nr = new Array(n).fill(0); nr[SA[0]-1] = base;
    for (let j = 1; j < n; j++) nr[SA[j]-1] = nr[SA[j-1]-1] + (cmp(pair[SA[j]-1], pair[SA[j-1]-1]) !== 0 ? 1 : 0);
    for (let j = 0; j < n; j++) { const part = {}; for (let t = 0; t <= j; t++) part[SA[t]] = nr[SA[t]-1];
      const same = j > 0 && cmp(pair[SA[j]-1], pair[SA[j-1]-1]) === 0;
      rec.push({phase: "assign", k, rank: rank.slice(), pair, SA: SA.slice(), part, j: j + 1, line: j ? 7 : 6, msg: `k = ${k}: új_rank[${SA[j]}] = ${nr[SA[j]-1]}` + (j ? (same ? " (azonos pár, mint az előző)" : " (új pár → +1)") : "")}); }
    rank = nr;
    rec.push({phase: "done", k, rank: rank.slice(), pair, SA: SA.slice(), line: 8, msg: `k = ${k} vége: rank = [${rank.join(", ")}], SA = [${SA.join(", ")}]; k ← ${2*k}`});
    k *= 2;
  }
  const nv = [...Array(n).keys()].map(i => i + 1).sort((a, b) => s.slice(a-1) < s.slice(b-1) ? -1 : 1), ok = nv.join() === SA.join();
  rec.push({phase: "end", k, rank: rank.slice(), SA: SA.slice(), line: 9, ok, naive: nv,
            msg: `k = ${k} ≥ n = ${n} → return SA = [${SA.join(", ")}]` + (ok ? " ✓ egyezik a naiv rendezéssel" : ` ✗ HIBÁS – a helyes SA [${nv.join(", ")}]`)});
  return rec;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const n = CUR.length, k = s.k || 1, order = s.SA || [...Array(n).keys()].map(i => i + 1);
  const cw = Math.min(64, 500 / n);
  el("text", {x: 10, y: 20, "font-size": 13, "font-weight": "bold"}, `S = ${CUR}` + (s.phase === "init" ? "" : `, k = ${k}`) + (s.phase === "pairs" ? " (pozíció szerinti sorrend)" : s.SA ? " (rendezett sorrend)" : ""));
  ["pozíció i", "2k-prefix", "pár", "rank[i]", "új rang"].forEach((h, r) => el("text", {x: 10, y: 60 + r * 46, "font-size": 11, fill: css("--muted")}, h));
  order.forEach((i, j) => { const x = 90 + j * cw;
    el("text", {x: x + cw/2, y: 60, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, String(i));
    if (s.phase !== "init" && s.phase !== "end") { const a = CUR.slice(i-1, i-1+k), b = CUR.slice(i-1+k, i-1+2*k);
      el("rect", {x: x + 2, y: 86, width: cw/2 - 3, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.4});
      el("rect", {x: x + cw/2, y: 86, width: cw/2 - 3, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": "4 3"});
      el("text", {x: x + cw/4, y: 104, "text-anchor": "middle", "font-size": Math.min(13, 60 / Math.max(1, k)), class: "m"}, a);
      el("text", {x: x + 3*cw/4, y: 104, "text-anchor": "middle", "font-size": Math.min(13, 60 / Math.max(1, k))}, b || "∅");
      const p = s.pair[i-1]; el("text", {x: x + cw/2, y: 152, "text-anchor": "middle", "font-size": 13}, `(${p[0]},${p[1]})`); }
    el("text", {x: x + cw/2, y: 198, "text-anchor": "middle", "font-size": 13}, String(s.rank[i-1]));
    if (s.part && s.part[i] !== undefined) { const cur = j + 1 === s.j;
      el("rect", {x: x + 6, y: 226, width: cw - 12, height: 26, fill: cur ? css("--cellhl") : css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : 1.2});
      el("text", {x: x + cw/2, y: 244, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, String(s.part[i])); }
  });
  if (s.SA) el("text", {x: 10, y: 286, "font-size": 13, "font-weight": "bold"}, `SA = [${s.SA.join(", ")}]`);
  if (s.phase === "end") el("text", {x: 10, y: 306, "font-size": 13, "font-weight": "bold", fill: s.ok ? css("--fg") : css("--hl2")}, s.ok ? "✓ helyes (egyezik a naiv rendezéssel)" : `✗ HIBÁS: a helyes SA = [${s.naive.join(", ")}]`);
  el("text", {x: 10, y: 324, "font-size": 11, fill: css("--muted")}, "folytonos keret = első k-blokk · szaggatott = második k-blokk · ∅ = kitöltés (rang 0)");
}
function load(ex){
  const msg = document.getElementById("err"), w = (ex || document.getElementById("inp").value).trim();
  if (ex) document.getElementById("inp").value = ex;
  if (!/^[a-z]{1,16}$/.test(w)) { msg.textContent = "1–16 angol kisbetűt adjon meg."; return; }
  msg.textContent = ""; CUR = w; setSteps(doubling(w, document.getElementById("bug").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
