<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ternáris keresés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>f: <select id="fn" aria-label="Függvény"><option value="par">−(x − 0,3141)²</option><option value="plat">max(0, x − 0,75) – plató</option><option value="own">−(x − p)², saját p</option></select></label><label>p = <input id="pp" value="0,7" size="4" aria-label="Saját csúcshely"></label><label>ε = 10^−<input id="eps" type="range" min="1" max="16" value="2" aria-label="Pontosság kitevője"> <b id="epsv">0,01</b></label><button onclick="load()">Futtatás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Unimodális görbe a [0, 1] intervallumon; minden iterációban két harmadoló pont, a sraffozott harmad kiesik, az intervallum 2/3-ára rövidül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szigorúan unimodális f, maximumkeresés; m1 = l + (r − l)/3, m2 = r − (r − l)/3. Kezdőállapot: f(x) = −(x − 0,3141)², ε = 0,01. A plató-példa a 13.2.7 figyelmeztetését mutatja; ε = 10^−16 közelében lebegőpontos stagnálás léphet fel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"l": 0.0, "r": 1.0, "m1": null, "m2": null, "xb": 0.5, "line": 1, "msg": "l = 0,0000, r = 1,0000; x_best = 0,5000"}, {"l": 0.0, "r": 1.0, "m1": 0.3333333333333333, "m2": 0.6666666666666667, "cut": [0.6666666666666667, 1.0], "xb": 0.3333333333333333, "line": 7, "it": 1, "msg": "1. iteráció: l = 0,0000, r = 1,0000, m1 = 0,3333, m2 = 0,6667, f(m1) = −0,0004, f(m2) = −0,1243; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3333"}, {"l": 0.0, "r": 0.6666666666666667, "m1": 0.22222222222222224, "m2": 0.44444444444444453, "cut": [0.44444444444444453, 0.6666666666666667], "xb": 0.3333333333333333, "line": 7, "it": 2, "msg": "2. iteráció: l = 0,0000, r = 0,6667, m1 = 0,2222, m2 = 0,4444, f(m1) = −0,0084, f(m2) = −0,0170; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3333"}, {"l": 0.0, "r": 0.44444444444444453, "m1": 0.14814814814814817, "m2": 0.2962962962962964, "cut": [0.0, 0.14814814814814817], "xb": 0.2962962962962964, "line": 6, "it": 3, "msg": "3. iteráció: l = 0,0000, r = 0,4444, m1 = 0,1481, m2 = 0,2963, f(m1) = −0,0275, f(m2) = −0,0003; f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik); x_best = 0,2963"}, {"l": 0.14814814814814817, "r": 0.44444444444444453, "m1": 0.24691358024691362, "m2": 0.34567901234567905, "cut": [0.14814814814814817, 0.24691358024691362], "xb": 0.2962962962962964, "line": 6, "it": 4, "msg": "4. iteráció: l = 0,1481, r = 0,4444, m1 = 0,2469, m2 = 0,3457, f(m1) = −0,0045, f(m2) = −0,0010; f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik); x_best = 0,2963"}, {"l": 0.24691358024691362, "r": 0.44444444444444453, "m1": 0.3127572016460906, "m2": 0.37860082304526754, "cut": [0.37860082304526754, 0.44444444444444453], "xb": 0.3127572016460906, "line": 7, "it": 5, "msg": "5. iteráció: l = 0,2469, r = 0,4444, m1 = 0,3128, m2 = 0,3786, f(m1) = −0,0000, f(m2) = −0,0042; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3128"}, {"l": 0.24691358024691362, "r": 0.37860082304526754, "m1": 0.29080932784636493, "m2": 0.33470507544581624, "cut": [0.24691358024691362, 0.29080932784636493], "xb": 0.3127572016460906, "line": 6, "it": 6, "msg": "6. iteráció: l = 0,2469, r = 0,3786, m1 = 0,2908, m2 = 0,3347, f(m1) = −0,0005, f(m2) = −0,0004; f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik); x_best = 0,3128"}, {"l": 0.29080932784636493, "r": 0.37860082304526754, "m1": 0.32007315957933247, "m2": 0.3493369913123, "cut": [0.3493369913123, 0.37860082304526754], "xb": 0.3127572016460906, "line": 7, "it": 7, "msg": "7. iteráció: l = 0,2908, r = 0,3786, m1 = 0,3201, m2 = 0,3493, f(m1) = −0,0000, f(m2) = −0,0012; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3128"}, {"l": 0.29080932784636493, "r": 0.3493369913123, "m1": 0.3103185490016766, "m2": 0.32982777015698833, "cut": [0.32982777015698833, 0.3493369913123], "xb": 0.3127572016460906, "line": 7, "it": 8, "msg": "8. iteráció: l = 0,2908, r = 0,3493, m1 = 0,3103, m2 = 0,3298, f(m1) = −0,0000, f(m2) = −0,0002; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3128"}, {"l": 0.29080932784636493, "r": 0.32982777015698833, "m1": 0.3038154752832394, "m2": 0.3168216227201139, "cut": [0.29080932784636493, 0.3038154752832394], "xb": 0.3127572016460906, "line": 6, "it": 9, "msg": "9. iteráció: l = 0,2908, r = 0,3298, m1 = 0,3038, m2 = 0,3168, f(m1) = −0,0001, f(m2) = −0,0000; f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik); x_best = 0,3128"}, {"l": 0.3038154752832394, "r": 0.32982777015698833, "m1": 0.3124862402411557, "m2": 0.32115700519907203, "cut": [0.32115700519907203, 0.32982777015698833], "xb": 0.3127572016460906, "line": 7, "it": 10, "msg": "10. iteráció: l = 0,3038, r = 0,3298, m1 = 0,3125, m2 = 0,3212, f(m1) = −0,0000, f(m2) = −0,0000; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3128"}, {"l": 0.3038154752832394, "r": 0.32115700519907203, "m1": 0.3095959852551836, "m2": 0.3153764952271278, "cut": [0.3038154752832394, 0.3095959852551836], "xb": 0.3153764952271278, "line": 6, "it": 11, "msg": "11. iteráció: l = 0,3038, r = 0,3212, m1 = 0,3096, m2 = 0,3154, f(m1) = −0,0000, f(m2) = −0,0000; f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik); x_best = 0,3154"}, {"l": 0.3095959852551836, "r": 0.32115700519907203, "m1": 0.3134496585698131, "m2": 0.31730333188444254, "cut": [0.31730333188444254, 0.32115700519907203], "xb": 0.3134496585698131, "line": 7, "it": 12, "msg": "12. iteráció: l = 0,3096, r = 0,3212, m1 = 0,3134, m2 = 0,3173, f(m1) = −0,0000, f(m2) = −0,0000; f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik); x_best = 0,3134"}, {"l": 0.3095959852551836, "r": 0.31730333188444254, "m1": null, "m2": null, "xb": 0.3134496585698131, "line": 9, "msg": "vége: r − l = 0,0077 ≤ ε = 0,0100; return x_best = 0,3134"}];
const CODE = ["TernarySearchMax(f, l, r, eps):", "    x_best ← (l + r) / 2; y_best ← f(x_best)", "    while r − l > eps:", "        m1 ← l + (r − l) / 3;  m2 ← r − (r − l) / 3", "        if m1 = l or m2 = r or m1 = m2: break   // stagnálás", "        y1 ← f(m1);  y2 ← f(m2)", "        if y1 < y2: l ← m1", "        else: r ← m2", "        (x_best, y_best) frissítése m1, m2 alapján", "    return x_best"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const FUN = {
  par: {name: "−(x − 0,3141)²", f: x => -((x - 0.3141) ** 2), p: 0.3141},
  plat: {name: "max(0, x − 0,75) (plató!)", f: x => Math.max(0, x - 0.75), p: 1},
  own: {name: "−(x − p)²", f: null, p: 0.7}
};
let CUR = "par";
const c4 = v => v.toFixed(4).replace(".", ",").replace("-", "−");
function trace(fn, l, r, eps){
  let xb = (l + r) / 2, yb = fn(xb), it = 0; const st = [{l, r, m1: null, m2: null, xb, line: 1, msg: `l = ${c4(l)}, r = ${c4(r)}; x_best = ${c4(xb)}`}];
  while (r - l > eps && it < 60) { it++; const m1 = l + (r - l) / 3, m2 = r - (r - l) / 3;
    if (m1 === l || m2 === r || m1 === m2) { st.push({l, r, m1, m2, xb, line: 4, msg: "lebegőpontos stagnálás: nincs új harmadoló pont, kilépés", stag: true}); break; }
    const y1 = fn(m1), y2 = fn(m2); let dec, nl = l, nr = r, line, cut;
    if (y1 < y2) { dec = "f(m1) < f(m2) → l ← m1 (az [l, m1] harmad kiesik)"; nl = m1; line = 6; cut = [l, m1]; }
    else { dec = "f(m1) ≥ f(m2) → r ← m2 (az [m2, r] harmad kiesik)" + (y1 === y2 ? " – egyenlőség: plató esetén ez téves lehet!" : ""); nr = m2; line = 7; cut = [m2, r]; }
    for (const [xm, ym] of [[m1, y1], [m2, y2]]) if (ym > yb) { xb = xm; yb = ym; }
    st.push({l, r, m1, m2, cut, xb, line, it, msg: `${it}. iteráció: l = ${c4(l)}, r = ${c4(r)}, m1 = ${c4(m1)}, m2 = ${c4(m2)}, f(m1) = ${c4(y1)}, f(m2) = ${c4(y2)}; ${dec}; x_best = ${c4(xb)}`});
    l = nl; r = nr; }
  st.push({l, r, m1: null, m2: null, xb, line: 9, msg: r - l <= eps ? `vége: r − l = ${c4(r - l)} ≤ ε = ${c4(eps)}; return x_best = ${c4(xb)}` : `vége (stagnálás): return x_best = ${c4(xb)}`});
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = '<defs><pattern id="hx" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.5"/></pattern></defs>';
  const F = FUN[CUR], X = x => 40 + x * 500; let lo = Infinity, hi = -Infinity; const pts = [];
  for (let i = 0; i <= 200; i++) { const x = i / 200, y = F.f(x); pts.push([x, y]); lo = Math.min(lo, y); hi = Math.max(hi, y); }
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const Y = y => 200 - (y - lo) / (hi - lo) * 170;
  if (s.cut) el("rect", {x: X(s.cut[0]), y: 25, width: X(s.cut[1]) - X(s.cut[0]), height: 180, fill: "url(#hx)", stroke: "none"});
  el("polyline", {points: pts.map(([x, y]) => `${X(x)},${Y(y)}`).join(" "), fill: "none", stroke: css("--line"), "stroke-width": 2});
  el("line", {x1: X(F.p), y1: 25, x2: X(F.p), y2: 205, stroke: css("--muted"), "stroke-dasharray": "2 3"});
  el("text", {x: X(F.p) + 4, y: 38, "font-size": 13, "font-style": "italic"}, "p");
  for (const [m, nm] of [[s.m1, "m₁"], [s.m2, "m₂"]]) if (m !== null && m !== undefined) {
    el("line", {x1: X(m), y1: 25, x2: X(m), y2: 205, stroke: css("--hl"), "stroke-dasharray": "6 4", "stroke-width": 1.6});
    el("circle", {cx: X(m), cy: Y(F.f(m)), r: 5, fill: css("--hl")}); el("text", {x: X(m) + 4, y: 218, "font-size": 12}, nm); }
  el("rect", {x: X(s.l), y: 232, width: Math.max(1, X(s.r) - X(s.l)), height: 18, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: 40, y: 270, "font-size": 12}, `[l, r] = [${c4(s.l)}, ${c4(s.r)}], hossz ${c4(s.r - s.l)}`);
  el("path", {d: `M${X(s.xb)},226 l-6,-10 l12,0 z`, fill: css("--hl2")}); el("text", {x: 540, y: 270, "text-anchor": "end", "font-size": 12}, `x_best = ${c4(s.xb)}`);
  el("line", {x1: 40, y1: 205, x2: 540, y2: 205, stroke: css("--muted")});
  for (const t of [0, 0.25, 0.5, 0.75, 1]) el("text", {x: X(t), y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t).replace(".", ","));
}
function load(){ CUR = document.getElementById("fn").value; const eps = Math.pow(10, -(+document.getElementById("eps").value));
  document.getElementById("epsv").textContent = String(eps).replace(".", ",");
  if (CUR === "own") { const p = Number(document.getElementById("pp").value.replace(",", ".")); if (!(p >= 0 && p <= 1)) { document.getElementById("err").textContent = "p ∈ [0, 1]"; return; }
    FUN.own.p = p; FUN.own.f = x => -((x - p) ** 2); }
  document.getElementById("err").textContent = CUR === "plat" ? "Plató: az f(m1) = f(m2) esetben a döntés a maximumot is kidobhatja (13.2.7)." : "";
  setSteps(trace(FUN[CUR].f, 0, 1, eps)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
