<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Részhalmaz-összeg döntési fája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>S: <input id="inp" value="2, 3, 5, 7" size="12" aria-label="Saját S"></label><label>T = <input id="t" type="range" min="0" max="17" value="10" oninput="load()" aria-label="Célösszeg T"> <b id="tv">10</b></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('inp').value='2, 3, 5, 7';document.getElementById('t').value=9;load()">T = 9</button><button onclick="document.getElementById('inp').value='2, 3, 5, 7';document.getElementById('t').value=11;load()">T = 11</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Részhalmaz-összeg backtracking S = [2, 3, 5, 7] bemenettel; T = 10 esetén 4 hívás, a megoldás [2, 3, 5]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.1.4 pszeudokódja (1-től indexelt S, szuffix-összegek, két nyesési szabály). Kezdőállapot: T = 10. Ellenőrzött hívásszámok: T = 10: 4, T = 11: 12 (NIL), T = 9: 8 ([2, 7]). A csúszka a T-t állítja (0–17).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["Keres(S, T, szuffix, i, aktualis, megoldas):", "    if aktualis == T: return IGAZ", "    if i > n: return HAMIS", "    if aktualis + S[i] <= T:            // beválasztás", "        megoldas.hozzaad(S[i]); if Keres(…, i+1, aktualis+S[i]): return IGAZ", "        megoldas.eltavolit_utolso()      // visszalépés", "    if aktualis + szuffix[i+1] >= T:     // kihagyás", "        if Keres(…, i+1, aktualis): return IGAZ", "    return HAMIS"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function search(S, T){
  S = S.slice().sort((a, b) => a - b); const n = S.length, suf = new Array(n + 2).fill(0);
  for (let i = n; i >= 1; i--) suf[i] = suf[i + 1] + S[i - 1];
  const calls = [], vals = {}, marks = {}, sol = [], st = [];
  const snap = (line, msg, path) => st.push({S, n, calls: calls.slice(), vals: {...vals}, marks: JSON.parse(JSON.stringify(marks)), cur: path, sol: sol.slice(), line, msg});
  function keres(i, cur, path){
    calls.push(path); vals[path] = [i, cur]; marks[path] = {};
    snap(0, `${calls.length}. hívás: Keres(i = ${i}, aktuális = ${cur}), megoldas = [${sol.join(", ")}]`, path);
    if (cur === T) { marks[path].goal = true; snap(1, `aktuális = ${cur} = T → IGAZ, megoldás: [${sol.join(", ")}]`, path); return true; }
    if (i > n) { snap(2, `i = ${i} > n = ${n} → HAMIS`, path); return false; }
    const a = S[i - 1];
    if (cur + a <= T) { marks[path].L = "call"; sol.push(a); if (keres(i + 1, cur + a, path + "1")) return true; sol.pop();
      snap(5, `visszalépés (i = ${i}): ${a} kivéve, megoldas = [${sol.join(", ")}]`, path); }
    else { marks[path].L = "over"; snap(3, `i = ${i}: ${cur} + ${a} = ${cur + a} > T = ${T} → túllépés-nyesés`, path); }
    if (cur + suf[i + 1] >= T) { marks[path].R = "call"; if (keres(i + 1, cur, path + "0")) return true; }
    else { marks[path].R = "hope"; snap(6, `i = ${i}: ${cur} + szuffix[${i + 1}] = ${cur + suf[i + 1]} < T = ${T} → reménytelenség-nyesés`, path); }
    snap(8, `Keres(i = ${i}, aktuális = ${cur}) → HAMIS`, path); return false;
  }
  const ok = keres(1, 0, "");
  st.push({...st[st.length - 1], cur: null, line: -1, msg: ok ? `Eredmény: [${sol.join(", ")}] (${calls.length} hívás a ${2 ** (n + 1) - 1} csúcsból)` : `Eredmény: NIL (${calls.length} hívás a ${2 ** (n + 1) - 1} csúcsból)`});
  return st;
}
function render(s){
  svg.innerHTML = ""; const n = s.n, L = 2 ** n, W = 540 / L, H = 52, Y0 = 34;
  svg.setAttribute("viewBox", `0 0 560 ${Y0 + n * H + 74}`);
  const P = p => { let idx = 0; for (const b of p) idx = idx * 2 + (b === "1" ? 0 : 1); const span = 2 ** (n - p.length); return [10 + (idx * span + span / 2) * W, Y0 + p.length * H]; };
  for (const p of s.calls) { const [x, y] = P(p), [i] = s.vals[p], m = s.marks[p] || {};
    [["L", "1"], ["R", "0"]].forEach(([side, b]) => { const stt = m[side]; if (!stt) return; const [cx, cy] = P(p + b);
      if (stt === "call") { el("line", {x1: x, y1: y, x2: cx, y2: cy, stroke: css("--line"), "stroke-width": b === "1" ? 2.4 : 1.4});
        el("text", {x: (x + cx) / 2 + (b === "1" ? -6 : 6), y: (y + cy) / 2, "text-anchor": b === "1" ? "end" : "start", "font-size": 11}, b === "1" ? "+" + s.S[i - 1] : "−"); }
      else { const mx = x + (cx - x) * 0.55, my = y + (cy - y) * 0.55;
        el("line", {x1: x, y1: y, x2: mx, y2: my, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": stt === "over" ? "none" : "4 3"});
        el("text", {x: mx + (stt === "over" ? -2 : 2), y: my + 13, "text-anchor": stt === "over" ? "end" : "start", "font-size": 10, "font-weight": "bold", fill: css("--hl2")}, stt === "over" ? "✕ >T" : "✕ <T"); } }); }
  s.calls.forEach((p, k) => { const [x, y] = P(p), [i, sm] = s.vals[p], on = p === s.cur, r = Math.min(17, W * 0.45 + 6);
    if ((s.marks[p] || {}).goal) el("circle", {cx: x, cy: y, r: r + 4, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
    el("circle", {cx: x, cy: y, r, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : 1.3});
    el("text", {x, y: y + 4, "text-anchor": "middle", "font-size": r < 14 ? 9 : 11}, `${i},${sm}`);
    el("text", {x: x + r + 1, y: y - r + 4, "font-size": 9, fill: css("--muted")}, String(k + 1)); });
  const yb = Y0 + n * H + 44;
  el("text", {x: 10, y: yb, "font-size": 13}, `S = [${s.S.join(", ")}] · megoldas = [${s.sol.join(", ")}] · hívások: ${s.calls.length}`);
  el("text", {x: 10, y: yb + 20, "font-size": 11, fill: css("--muted")}, "csúcs = (i, aktuális) · bal = beválasztás (+a_i), jobb = kihagyás (−) · dupla kör = cél · ✕ = nyesés");
}
function load(){
  const S = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x).map(Number), T = +document.getElementById("t").value;
  const err = document.getElementById("err");
  if (S.length < 1 || S.length > 5 || S.some(x => !Number.isInteger(x) || x < 1 || x > 99)) { err.textContent = "1–5 pozitív egész elem."; return; }
  err.textContent = ""; document.getElementById("tv").textContent = T; setSteps(search(S, T));
}

STEPS = search([2, 3, 5, 7], 10);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
