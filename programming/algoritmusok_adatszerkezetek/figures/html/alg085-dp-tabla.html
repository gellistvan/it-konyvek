const INF = Infinity, fv = x => x === INF ? "∞" : String(x);
function fptas(w, p, W, eps){
  const orig = []; w.forEach((x, i) => { if (x <= W) orig.push(i); });
  const wc = orig.map(i => w[i]), pc = orig.map(i => p[i]), n = orig.length;
  if (!n) return null;
  const K = eps * Math.max(...pc) / n, ph = pc.map(x => Math.floor(x / K)), PH = ph.reduce((a, b) => a + b, 0);
  const D = Array.from({length: n + 1}, () => Array(PH + 1).fill(INF)); D[0][0] = 0;
  const src = Array.from({length: n + 1}, () => Array(PH + 1).fill(null)), shown = Array.from({length: n + 1}, () => Array(PH + 1).fill(false));
  const view = () => D.map((row, i) => row.map((x, v) => shown[i][v] ? (x === INF ? "∞" : x) : null));
  const S = [], push = o => S.push(Object.assign({src: src.map(r => r.slice()), path: [], vmax: null, cur: null, ph, wc, orig, W}, o));
  const init = view(); init[0][0] = 0;
  push({kind: "init", D: init, line: 0, msg: `K = ε·Pmax/n = ${String(+K.toFixed(4)).replace(".", ",")}, p̂ = [${ph.join(", ")}], P̂ = ${PH}; kezdetben csak D[0][0] = 0`});
  shown[0].fill(true); push({kind: "row0", D: view(), line: 0, msg: `D[0][v] = ∞ minden v = 1..${PH} értékre`});
  for (let i = 1; i <= n; i++) for (let v = 0; v <= PH; v++) {
    const up = D[i-1][v]; D[i][v] = up; src[i][v] = "up"; let cand = null;
    if (v >= ph[i-1]) { cand = D[i-1][v - ph[i-1]] + wc[i-1]; if (cand < D[i][v]) { D[i][v] = cand; src[i][v] = "diag"; } }
    shown[i][v] = true;
    const msg = cand === null ? `D[${i}][${v}] = D[${i-1}][${v}] = ${fv(up)} (v < p̂[${i}] = ${ph[i-1]}: csak a „nem választjuk” ág)`
      : `D[${i}][${v}] = min(D[${i-1}][${v}] = ${fv(up)}, D[${i-1}][${v - ph[i-1]}] + w[${i}] = ${fv(D[i-1][v - ph[i-1]])} + ${wc[i-1]} = ${fv(cand)}) = ${fv(D[i][v])}`;
    push({kind: "cell", D: view(), cur: [i, v], line: cand !== null ? 5 : 3, msg, rowend: v === PH}); }
  let vmax = -1;
  for (let v = PH; v >= 0; v--) { const ok = D[n][v] <= W;
    push({kind: "vmax", D: view(), cur: [n, v], line: 7, msg: `v = ${v}: D[${n}][${v}] = ${fv(D[n][v])} ` + (ok ? `≤ W = ${W} → v_max = ${v}` : (D[n][v] !== INF ? `> W = ${W}` : "(elérhetetlen)"))});
    if (ok) { vmax = v; break; } }
  const x = Array(w.length).fill(0); let cv = vmax; const path = [[n, vmax]];
  for (let i = n; i >= 1; i--) { const take = cv >= ph[i-1] && D[i][cv] === D[i-1][cv - ph[i-1]] + wc[i-1]; let msg;
    if (take) { x[orig[i-1]] = 1; msg = `i = ${i}: D[${i}][${cv}] = ${D[i][cv]} = D[${i-1}][${cv - ph[i-1]}] + ${wc[i-1]} → a(z) ${orig[i-1] + 1}. tárgy választva; current_v = ${cv - ph[i-1]}`; cv -= ph[i-1]; }
    else { const prev = cv >= ph[i-1] ? D[i-1][cv - ph[i-1]] : null;
      msg = `i = ${i}: D[${i}][${cv}] = ${fv(D[i][cv])} ≠ ` + (prev !== null ? `D[${i-1}][${cv - ph[i-1]}] + ${wc[i-1]} = ${fv(prev + wc[i-1])}` : `(v < p̂[${i}])`) + ` → nem választva; current_v = ${cv}`; }
    path.push([i - 1, cv]); push({kind: "back", D: view(), cur: [i - 1, cv], line: take ? 11 : 10, path: path.map(q => q.slice()), vmax, msg}); }
  let prof = 0, wt = 0; x.forEach((b, i) => { if (b) { prof += p[i]; wt += w[i]; } });
  push({kind: "done", D: view(), line: 12, path, vmax, msg: `x = [${x.join(", ")}]; eredeti profit = ${prof}, súly = ${wt} ≤ W = ${W}`});
  return S;
}
let ALL = null;
function render(s){

  svg.setAttribute("viewBox", `0 0 ${Math.max(600, x0 + (PH + 1) * cw + 10)} ${y0 + (n + 1) * ch + 70}`);
  svg.innerHTML = '<defs><pattern id="hh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="' + css("--muted") + '" stroke-width="1.5"/></pattern>'
    + '<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const W = s.W !== undefined ? s.W : 8;
  for (let v = 0; v <= PH; v++) el("text", {x: x0 + v * cw + cw / 2, y: y0 - 8, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(v));

  for (let i = 0; i <= n; i++) { el("text", {x: x0 - 8, y: y0 + i * ch + ch / 2 + 5, "text-anchor": "end", "font-size": 13}, "i = " + i);
    for (let v = 0; v <= PH; v++) { const val = D[i][v], X = x0 + v * cw, Y = y0 + i * ch, cur = s.cur && s.cur[0] === i && s.cur[1] === v;
      el("rect", {x: X, y: Y, width: cw, height: ch, fill: val === null ? css("--bg") : (val === "∞" ? css("--cell") : css("--cellhl")), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3.5 : 0.8});
      if (val !== null && val !== "∞" && val > W) el("rect", {x: X + 1, y: Y + 1, width: cw - 2, height: ch - 2, fill: "url(#hh)", "pointer-events": "none"});
      if (val !== null) el("text", {x: X + cw / 2, y: Y + ch / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": s.path.some(q => q[0] === i && q[1] === v) ? "bold" : "normal", fill: val === "∞" ? css("--muted") : css("--fg")}, String(val));
      if (val !== null && val !== "∞" && i > 0 && s.src[i][v]) el("text", {x: X + 3, y: Y + 10, "font-size": 9, fill: css("--muted")}, s.src[i][v] === "diag" ? "↘" : "↓"); } }
  if (s.vmax !== null && s.vmax >= 0) el("rect", {x: x0 + s.vmax * cw - 3, y: y0 + n * ch - 3, width: cw + 6, height: ch + 6, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
  for (let j = 1; j < s.path.length; j++) { const [i0, v0] = s.path[j-1], [i1, v1] = s.path[j];
    el("line", {x1: x0 + v0 * cw + cw / 2, y1: y0 + i0 * ch + 6, x2: x0 + v1 * cw + cw / 2, y2: y0 + i1 * ch + ch - 6, stroke: css("--hl2"), "stroke-width": 3, "stroke-dasharray": v0 === v1 ? "6 4" : "none", "marker-end": "url(#ab)"}); }
  el("text", {x: 8, y: y0 + (n + 1) * ch + 24, "font-size": 12, fill: css("--muted")}, "↓ = D[i−1][v] adta a minimumot, ↘ = D[i−1][v − p̂ᵢ] + wᵢ; sraffozott = érték > W; kettős keret = v_max;");
  el("text", {x: 8, y: y0 + (n + 1) * ch + 42, "font-size": 12, fill: css("--muted")}, "narancs nyíl = visszafejtés (szaggatott = nem választva, folytonos = választva)");
}
function applyMode(){ const rows = document.getElementById("rows").checked; setSteps(rows ? ALL.filter(s => s.kind !== "cell" || s.rowend) : ALL); }
function load(){
  const num = id => document.getElementById(id).value.split(/[ ,;]+/).filter(x => x !== "").map(Number), e = document.getElementById("err");
  const w = num("w"), p = num("p"), W = Number(document.getElementById("W").value), eps = Number(document.getElementById("eps").value.replace(",", "."));
  if (!w.length || w.length > 6 || w.length !== p.length || [...w, ...p, W].some(x => !Number.isInteger(x) || x <= 0) || !(eps > 0 && eps < 1)) { e.textContent = "1–6 pozitív egész súly és profit (azonos számban), egész W > 0, 0 < ε < 1."; return; }
  const S = fptas(w, p, W, eps); if (!S) { e.textContent = "Minden tárgy nehezebb W-nél: x = 0."; return; }
  if (S[0].D[0].length > 41) { e.textContent = `P̂ = ${S[0].D[0].length - 1} túl nagy a megjelenítéshez (≤ 40): növelje ε-t.`; return; }
  e.textContent = ""; ALL = S; applyMode();
}
ALL = fptas([5, 3, 4], [60, 50, 30], 8, 0.5);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
