<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD-lánc, sponge és HMAC</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három szerkezet lépésenként: Merkle–Damgård-lánc és a hosszabbítási támadás, sponge rate és capacity résszel, HMAC belső és külső hash."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Méretek SHA-256 / SHA3-256 esetén. A halvány elemek a későbbi lépésekben kerülnek sorra; kék = az aktuális lépés. A 2.2, a 3. és a 4.1 szakasz közös ábrája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"panel": "a", "show": ["a1"], "hl": "a1", "msg": "1) MD: IV = H₀ (8 × 32 bit), f(H₀, M₁) – a láncolt állapot 256 bit.", "line": -1}, {"panel": "a", "show": ["a1", "a2"], "hl": "a2", "msg": "2) MD: f(·, M₂) – minden blokk ugyanabba a 256 bites állapotba kerül.", "line": -1}, {"panel": "a", "show": ["a1", "a2", "a3"], "hl": "a3", "msg": "3) MD: a padding blokk után a kimenet H(m) = a teljes belső állapot.", "line": -1}, {"panel": "a", "show": ["a1", "a2", "a3", "att"], "hl": "att", "msg": "4) Támadó: H(m)-et új IV-ként használja, f(H(m), extra ‖ pad′) = H(m ‖ pad(m) ‖ extra) – m nélkül.", "line": -1}, {"panel": "b", "show": ["b1"], "hl": "b1", "msg": "5) Sponge: a P₁, P₂ blokkok csak az r = 1088 bites részbe kerülnek (XOR), majd Keccak-f[1600].", "line": -1}, {"panel": "b", "show": ["b1", "b2"], "hl": "b2", "msg": "6) Sponge: a kimenet (squeeze) csak az r részből olvas; a c = 512 bit rejtve marad.", "line": -1}, {"panel": "b", "show": ["b1", "b2", "batt"], "hl": "batt", "msg": "7) Támadó a sponge-on: Z-ből nem áll elő a teljes 1600 bites állapot – ismeretlen kapacitás, a folytatás megáll.", "line": -1}, {"panel": "c", "show": ["c1"], "hl": "c1", "msg": "8) HMAC: belső = SHA256((K′ ⊕ ipad) ‖ m), ipad = 0x36 B-szer.", "line": -1}, {"panel": "c", "show": ["c1", "c2"], "hl": "c2", "msg": "9) HMAC: tag = SHA256((K′ ⊕ opad) ‖ belső), opad = 0x5c; a külső hash kulcsot tartalmaz, ezért a tag nem folytatható.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PAN = {"a": {"h": 7.0, "title": "(a) Merkle–Damgård (SHA-256): a kivonat = a teljes belső állapot", "items": [["box", 0.2, 3.6, 2.6, 1.2, "IV = H₀\n8 × 32 bit", "plain", "a1"], ["box", 3.7, 5.7, 1.8, 0.9, "M₁", "plain", "a1"], ["arr", 4.6, 5.7, 4.6, 4.8, "solid", "a1"], ["box", 3.8, 3.6, 1.6, 1.2, "f", "thick", "a1"], ["arr", 2.8, 4.2, 3.8, 4.2, "solid", "a1"], ["box", 6.7, 5.7, 1.8, 0.9, "M₂", "plain", "a2"], ["arr", 7.6, 5.7, 7.6, 4.8, "solid", "a2"], ["box", 6.8, 3.6, 1.6, 1.2, "f", "thick", "a2"], ["arr", 5.4, 4.2, 6.8, 4.2, "solid", "a2"], ["box", 9.7, 5.7, 1.8, 0.9, "pad(m)", "plain", "a3"], ["arr", 10.6, 5.7, 10.6, 4.8, "solid", "a3"], ["box", 9.8, 3.6, 1.6, 1.2, "f", "thick", "a3"], ["arr", 8.4, 4.2, 9.8, 4.2, "solid", "a3"], ["box", 12.6, 3.6, 2.9, 1.2, "H(m)\n= belső állapot", "plain", "a3"], ["arr", 11.4, 4.2, 12.6, 4.2, "solid", "a3"], ["box", 16.3, 5.7, 3.4, 0.9, "extra ‖ pad′", "dash", "att"], ["arr", 17.2, 5.7, 17.2, 4.8, "dash", "att"], ["box", 16.4, 3.6, 1.6, 1.2, "f", "dashthick", "att"], ["arr", 15.5, 4.2, 16.4, 4.2, "dash", "att"], ["txt", 15.95, 4.6, "új IV", 7.5, "center", "att"], ["box", 12.6, 0.5, 7.1, 1.1, "H(m ‖ pad(m) ‖ extra) – m ismerete nélkül", "dash", "att"], ["arr", 17.2, 3.6, 17.2, 1.6, "dash", "att"], ["txt", 0.2, 1.65, "m = M₁ ‖ M₂, blokkok 512 bitesek;", 8, "left", "a1"], ["txt", 0.2, 1.05, "szaggatott = amit a támadó számol:", 8, "left", "att"], ["txt", 0.2, 0.45, "H(m) és |m| elég a folytatáshoz", 8, "left", "att"]]}, "b": {"h": 6.2, "title": "(b) Sponge (SHA3-256): 1600 bites állapot = r = 1088 | c = 512 bit", "items": [["band", 0.2, 3.0, 13.2, 1.2, "", "b1"], ["band", 0.2, 1.4, 13.2, 1.6, "///", "b1"], ["txt", 10.1, 3.6, "r = 1088 bit (rate)", 8, "left", "b1"], ["txt", 0.3, 1.0, "c = 512 bit (capacity): soha nem kerül ki", 8, "left", "b1"], ["box", 0.4, 1.4, 1.3, 2.8, "0", "plain", "b1"], ["xor", 2.5, 3.6, "b1"], ["box", 1.95, 5.2, 1.1, 0.8, "P₁", "plain", "b1"], ["arr", 2.5, 5.2, 2.5, 3.9, "solid", "b1"], ["arr", 1.7, 3.6, 2.2, 3.6, "solid", "b1"], ["box", 3.3, 1.4, 1.9, 2.8, "Keccak-f\n[1600]", "thick", "b1"], ["arr", 2.8, 3.6, 3.3, 3.6, "solid", "b1"], ["xor", 6.1, 3.6, "b1"], ["box", 5.55, 5.2, 1.1, 0.8, "P₂", "plain", "b1"], ["arr", 6.1, 5.2, 6.1, 3.9, "solid", "b1"], ["arr", 5.2, 3.6, 5.8, 3.6, "solid", "b1"], ["box", 6.9, 1.4, 1.9, 2.8, "Keccak-f\n[1600]", "thick", "b1"], ["arr", 6.4, 3.6, 6.9, 3.6, "solid", "b1"], ["arr", 9.6, 4.2, 9.6, 5.2, "solid", "b2"], ["box", 8.9, 5.2, 3.0, 0.8, "Z = első 256 bit", "plain", "b2"], ["arr", 8.8, 3.6, 9.6, 3.6, "solid", "b2"], ["txt", 9.8, 4.65, "a kimenet csak az r részből", 7.5, "left", "b2"], ["box", 14.6, 1.4, 1.9, 2.8, "Keccak-f\n?", "dashthick", "batt"], ["box", 14.0, 5.2, 5.6, 0.8, "támadó: Z ismert, de c nem", "dash", "batt"], ["arr", 15.5, 5.2, 15.5, 4.2, "dash", "batt"], ["txt", 16.7, 2.2, "ismeretlen\nkapacitás:\na folytatás\nelakad", 8, "left", "batt"]]}, "c": {"h": 5.2, "title": "(c) HMAC-SHA256: kettős, kulcsolt beágyazás (B = 64 bájt)", "items": [["box", 0.2, 3.6, 4.0, 0.9, "K′ ⊕ ipad (0x36…)", "key", "c1"], ["box", 4.6, 3.6, 1.6, 0.9, "m", "plain", "c1"], ["arr", 2.2, 3.6, 2.2, 2.7, "solid", "c1"], ["arr", 5.4, 3.6, 5.4, 2.7, "solid", "c1"], ["box", 0.2, 1.4, 7.6, 1.3, "belső = SHA256((K′ ⊕ ipad) ‖ m)", "thick", "c1"], ["box", 9.6, 3.6, 4.0, 0.9, "K′ ⊕ opad (0x5c…)", "key", "c2"], ["arr", 11.6, 3.6, 11.6, 2.7, "solid", "c2"], ["arr", 7.8, 2.05, 9.6, 2.05, "solid", "c2"], ["box", 9.6, 1.4, 10.1, 1.3, "tag = SHA256((K′ ⊕ opad) ‖ belső)", "thick", "c2"], ["txt", 0.2, 0.75, "K′ = a B bájtra kiegészített (hosszú kulcsnál előbb hash-elt) kulcs; vastag keret = kulcsot tartalmazó bemenet.", 7.6, "left", "c1"], ["txt", 0.2, 0.2, "A tag-ből a külső hash nem folytatható kulcs nélkül, és a támadó a belső kivonatot sem látja.", 7.6, "left", "c2"]]}}, W = 20, S = 28;
function render(s){
  svg.innerHTML = ""; const d = PAN[s.panel], H = d.h;
  svg.setAttribute("viewBox", `0 0 ${W * S} ${H * S + 26}`);
  const X = x => x * S, Y = y => (H - y) * S + 26;
  el("text", {x: 4, y: 16, "font-size": 13, "font-weight": "bold"}, d.title);
  const op = g => s.show.includes(g) ? 1 : 0.18, hot = g => g === s.hl;
  const defs = el("defs", {}); const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hh"); pat.setAttribute("width", 7); pat.setAttribute("height", 7); pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 7); pl.setAttribute("stroke", css("--muted")); pl.setAttribute("stroke-width", 1.2); pat.appendChild(pl); defs.appendChild(pat);
  const lines = (x, y, t, fs, anchor, g, bold) => { const ps = t.split("\n"); ps.forEach((p, i) => el("text", {x, y: y + (i - (ps.length - 1) / 2) * fs * 1.2 + fs * 0.35, "text-anchor": anchor, "font-size": fs, "font-weight": bold ? "bold" : "normal", opacity: op(g)}, p)); };
  d.items.filter(it => it[0] === "band").forEach(([, x, y, w, h, hatch, g]) => el("rect", {x: X(x), y: Y(y + h), width: w * S, height: h * S, fill: hatch ? "url(#hh)" : css("--code"), stroke: css("--muted"), opacity: op(g)}));
  d.items.forEach(it => {
    if (it[0] === "box") { const [, x, y, w, h, t, st, g] = it;
      const sw = (st === "thick" || st === "dashthick" || st === "key" ? 2.6 : 1.2) + (hot(g) ? 1 : 0);
      el("rect", {x: X(x), y: Y(y + h), width: w * S, height: h * S, rx: 5, fill: css("--cell"), stroke: hot(g) ? css("--hl") : css("--line"), "stroke-width": sw, "stroke-dasharray": st.startsWith("dash") ? "6 4" : "", opacity: op(g)});
      const mx = Math.max(...t.split("\n").map(q => q.length)); lines(X(x + w / 2), Y(y + h / 2), t, Math.min(12, (w * S - 6) / (mx * (st === "key" ? 0.58 : 0.5))), "middle", g, st === "key"); }
    else if (it[0] === "arr") { const [, x0, y0, x1, y1, st, g] = it, col = hot(g) ? css("--hl") : css("--line");
      el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: col, "stroke-width": hot(g) ? 2.2 : 1.4, "stroke-dasharray": st === "dash" ? "6 4" : "", opacity: op(g)});
      const a = Math.atan2(Y(y1) - Y(y0), X(x1) - X(x0)), L = 8, xe = X(x1), ye = Y(y1);
      el("path", {d: `M${xe},${ye} L${xe - L * Math.cos(a - 0.4)},${ye - L * Math.sin(a - 0.4)} L${xe - L * Math.cos(a + 0.4)},${ye - L * Math.sin(a + 0.4)} Z`, fill: col, opacity: op(g)}); }
    else if (it[0] === "txt") { const [, x, y, t, fs, ha, g] = it; lines(X(x), Y(y), t, fs * 1.3, ha === "left" ? "start" : "middle", g); }
    else if (it[0] === "xor") { const [, x, y, g] = it; el("circle", {cx: X(x), cy: Y(y), r: 0.3 * S, fill: css("--cell"), stroke: css("--line"), opacity: op(g)});
      el("text", {x: X(x), y: Y(y) + 5, "text-anchor": "middle", "font-size": 15, opacity: op(g)}, "⊕"); }
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
