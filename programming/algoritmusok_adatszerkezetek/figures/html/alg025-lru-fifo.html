<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LRU és FIFO kiszorítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>C = <select id="cap" aria-label="Kapacitás"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label><button onclick="restart(false)">Üres cache</button><label>kulcs <input id="key" size="2" value="D" aria-label="Kulcs"></label><label>érték <input id="val" size="3" value="4" aria-label="Érték"></label><button onclick="addOp('get')">get</button><button onclick="addOp('put')">put</button><button onclick="restart(true)">Könyv példája</button><span class="small">Műveletek: <span id="ops">put(A, 1), put(B, 2), get(A), put(C, 3)</span></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="LRU cache hash táblával és kétszeresen láncolt listával, alatta FIFO sor; a put(C) után az LRU-ban A és C, a FIFO-ban B és C marad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A GET/PUT pszeudokód a 7.4.14 alapján. Kezdőállapot: C = 2 és a könyv műveletsora; a saját műveletek a sor végéhez fűződnek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"lru": [], "val": {}, "fifo": [], "moved": null, "ev": null, "fev": null, "op": "", "line": -1, "msg": "Üres cache, C = 2; a lista feje a legutóbb használt, a farka a legrégebben használt.", "cap": 2}, {"lru": ["A"], "val": {"A": 1}, "fifo": ["A"], "moved": "A", "ev": null, "fev": null, "op": "put(A, 1)", "line": 10, "msg": "1. put(A, 1): új csomópont a lista elejére, H-ba beszúrva. LRU = [A], FIFO = [A]", "cap": 2}, {"lru": ["B", "A"], "val": {"A": 1, "B": 2}, "fifo": ["A", "B"], "moved": "B", "ev": null, "fev": null, "op": "put(B, 2)", "line": 10, "msg": "2. put(B, 2): új csomópont a lista elejére, H-ba beszúrva. LRU = [B, A], FIFO = [A, B]", "cap": 2}, {"lru": ["A", "B"], "val": {"A": 1, "B": 2}, "fifo": ["A", "B"], "moved": "A", "ev": null, "fev": null, "op": "get(A)", "line": 3, "msg": "3. get(A) → 1. LRU = [A, B], FIFO = [A, B]", "cap": 2}, {"lru": ["C", "A"], "val": {"A": 1, "C": 3}, "fifo": ["B", "C"], "moved": "C", "ev": "B", "fev": "A", "op": "put(C, 3)", "line": 12, "msg": "4. put(C, 3): új csomópont a lista elejére, H-ba beszúrva; méret > C → a farok (B) kiszorul (evict); FIFO: a legrégebben beszúrt (A) esik ki. LRU = [C, A], FIFO = [B, C]", "cap": 2}];
const CODE = ["GET(k):", "    ha H.KERES(k) = NIL: vissza -1", "    csomópont ← H.KERES(k)", "    LISTA.MOZGAT_ELÖRE(csomópont)", "    vissza csomópont.érték", "PUT(k, v):", "    ha H.KERES(k) ≠ NIL:", "        csomópont.érték ← v; LISTA.MOZGAT_ELÖRE(csomópont)", "    különben:", "        csomópont ← ÚJ_CSOMÓPONT(k, v); LISTA.BESZÚR_ELÖL(csomópont)", "        H.BESZÚR(k, csomópont)", "        ha LISTA.MÉRET > C:", "            legrégebbi ← LISTA.FAROK; LISTA.TÖRÖL(…); H.TÖRÖL(…)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CAP = 2, OPS = [["put", "A", 1], ["put", "B", 2], ["get", "A", null], ["put", "C", 3]];
function trace(cap, ops){
  const lru = [], val = {}, fifo = [];
  const st = [{lru: [], val: {}, fifo: [], moved: null, ev: null, fev: null, op: "", line: -1, cap,
               msg: `Üres cache, C = ${cap}; a lista feje a legutóbb használt, a farka a legrégebben használt.`}];
  ops.forEach(([op, k, v], i) => {
    const n = i + 1; let moved = null, ev = null, fev = null, line, msg;
    if (op === "get") {
      let res;
      if (!(k in val)) { line = 1; res = "−1 (nincs bent; a sorrend nem változik)"; }
      else { lru.splice(lru.indexOf(k), 1); lru.unshift(k); moved = k; line = 3; res = String(val[k]); }
      msg = `${n}. get(${k}) → ${res}`;
    } else if (k in val) {
      val[k] = v; lru.splice(lru.indexOf(k), 1); lru.unshift(k); moved = k; line = 7;
      msg = `${n}. put(${k}, ${v}): már bent – érték frissítve, a lista elejére (FIFO-ban a sorrend marad)`;
    } else {
      val[k] = v; lru.unshift(k); moved = k; line = 10;
      msg = `${n}. put(${k}, ${v}): új csomópont a lista elejére, H-ba beszúrva`;
      if (lru.length > cap) { ev = lru.pop(); delete val[ev]; line = 12; msg += `; méret > C → a farok (${ev}) kiszorul (evict)`; }
      fifo.push(k); if (fifo.length > cap) { fev = fifo.shift(); msg += `; FIFO: a legrégebben beszúrt (${fev}) esik ki`; }
    }
    msg += `. LRU = [${lru.join(", ")}], FIFO = [${fifo.join(", ")}]`;
    st.push({lru: lru.slice(), val: Object.assign({}, val), fifo: fifo.slice(), moved, ev, fev, cap,
             op: `${op}(${k}${v === null ? "" : ", " + v})`, line, msg});
  });
  return st;
}
function node(x, y, t, thick, dashed){
  el("rect", {x, y, width: 62, height: 34, rx: 5, fill: dashed ? "none" : css("--cell"), stroke: dashed ? css("--muted") : css("--line"), "stroke-width": thick ? 4 : 1.3, "stroke-dasharray": dashed ? "5 3" : ""});
  el("text", {x: x + 31, y: y + 22, "text-anchor": "middle", "font-size": 15, fill: dashed ? css("--muted") : css("--fg")}, t);
  if (dashed) el("line", {x1: x + 4, y1: y + 30, x2: x + 58, y2: y + 4, stroke: css("--hl2"), "stroke-width": 2.5});
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const cap = s.cap || CAP;
  el("text", {x: 10, y: 22, "font-size": 13, "font-weight": "bold"}, "LRU");
  el("text", {x: 60, y: 22, "font-size": 12, fill: css("--muted")}, "H (kulcs → csomópont)          lista: fej (legutóbb használt) → farok");
  const keys = Object.keys(s.val).sort();
  s.lru.forEach((k, i) => { node(150 + i * 78, 70, k + ":" + s.val[k], k === s.moved, false);
    if (i) { el("line", {x1: 150 + i*78 - 16, y1: 82, x2: 150 + i*78 - 2, y2: 82, stroke: css("--line"), "marker-end": ""}); el("text", {x: 150 + i*78 - 9, y: 98, "text-anchor": "middle", "font-size": 13}, "⇄"); } });
  keys.forEach((k, j) => { const y = 50 + j * 26;
    el("rect", {x: 20, y, width: 34, height: 22, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: 37, y: y + 16, "text-anchor": "middle", "font-size": 13}, k);
    const ti = s.lru.indexOf(k); el("path", {d: `M54,${y + 11} C100,${y + 11} ${150 + ti*78 + 10},${60} ${150 + ti*78 + 31},70`, fill: "none", stroke: css("--muted"), "stroke-width": 1.2}); });
  if (s.ev) { node(150 + s.lru.length * 78, 70, s.ev, false, true); el("text", {x: 150 + s.lru.length*78 + 31, y: 124, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "evict"); }
  el("text", {x: 10, y: 172, "font-size": 13, "font-weight": "bold"}, "FIFO");
  el("text", {x: 60, y: 172, "font-size": 12, fill: css("--muted")}, "beszúrási sorrend: régi → új (a get nem módosítja)");
  s.fifo.forEach((k, i) => node(150 + i * 78, 186, k, false, false));
  if (s.fev) { node(60, 186, s.fev, false, true); el("text", {x: 91, y: 240, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "kiesik"); }
  const ok = s.lru.length === Object.keys(s.val).length && s.lru.length <= cap;
  el("text", {x: 10, y: 280, "font-size": 13}, `Invariáns: lista hossza = |H| = ${s.lru.length} ≤ C = ${cap}; fej = legutóbb használt ${s.lru.length ? "(" + s.lru[0] + ")" : ""} – ${ok ? "teljesül" : "SÉRÜL"}`);
}
function opsText(){ document.getElementById("ops").textContent = OPS.map(([o, k, v]) => o === "get" ? `get(${k})` : `put(${k}, ${v})`).join(", ") || "(üres)"; }
function addOp(op){
  const k = (document.getElementById("key").value.trim() || "A").slice(0, 2), v = +document.getElementById("val").value || 0;
  if (OPS.length >= 20) return;
  OPS.push(op === "get" ? ["get", k, null] : ["put", k, v]); opsText();
  const S = trace(CAP, OPS); setSteps(S); show(S.length - 1);
}
function restart(book){
  CAP = book ? 2 : +document.getElementById("cap").value; if (book) document.getElementById("cap").value = "2";
  OPS = book ? [["put", "A", 1], ["put", "B", 2], ["get", "A", null], ["put", "C", 3]] : []; opsText(); setSteps(trace(CAP, OPS));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
