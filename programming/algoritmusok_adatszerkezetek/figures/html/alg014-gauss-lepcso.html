<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gauss-párosítás pontlépcsővel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
#status{margin:4px 0 6px;min-height:1.6em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="ctl"><label for="n">n =</label><input id="n" type="range" min="1" max="20" value="5" aria-label="n értéke"><b id="nv"></b></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 340" role="img" aria-label="Két egymásba illő pontlépcső egy n-szer (n+1)-es téglalapban"></svg>
<p class="small">a₁ = 1, d = 1. Teli kör: az i-edik oszlop i pontja (1 + 2 + … + n, a beágyazott ciklus belső
műveleteinek száma); üres kör: ugyanez a lépcső 180°-kal elforgatva. Kezdőállapot: n = 5, mint a könyv ábráján.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function draw(){
  const n = +document.getElementById("n").value; document.getElementById("nv").textContent = n;
  svg.innerHTML = "";
  const s = Math.min(46, 300 / (n + 1)), x0 = 40, y0 = 320, r = Math.max(3, s * 0.36);
  let f = 0, e = 0;
  for (let k = 1; k <= n; k++) for (let q = 1; q <= n + 1; q++) {
    const full = q <= k; full ? f++ : e++;
    el("circle", {cx: x0 + (k - 0.5) * s, cy: y0 - (q - 0.5) * s, r, fill: full ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.3});
  }
  el("rect", {x: x0 - 3, y: y0 - (n + 1) * s - 3, width: n * s + 6, height: (n + 1) * s + 6, fill: "none", stroke: css("--muted"), "stroke-dasharray": "5 3"});
  const tx = Math.max(x0 + n * s + 30, 330);
  el("text", {x: tx, y: 60, "font-size": 16}, `● teli pontok: ${f}`);
  el("text", {x: tx, y: 88, "font-size": 16}, `○ üres pontok: ${e}`);
  el("text", {x: tx, y: 124, "font-size": 16, "font-weight": "bold"}, `2·S = ${n}·${n + 1} = ${n * (n + 1)}`);
  el("text", {x: tx, y: 152, "font-size": 16, "font-weight": "bold"}, `S = n(n+1)/2 = ${n * (n + 1) / 2}`);
  document.getElementById("status").textContent = `n = ${n}: a teli pontok száma ${f} = n(n+1)/2; a téglalap ${n}×${n + 1} = ${n * (n + 1)} pont.`;
}
document.getElementById("n").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
