<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-fa beszúrás proaktív splittel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kulcsok: <input id="inp" value="10, 20, 30, 40, 50, 60" size="22" aria-label="Kulcssorozat"></label><label>t = <select id="tt" aria-label="Minimális fokszám"><option selected>2</option><option>3</option><option>4</option></select></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="B-fa t = 2-vel a 10, 20, 30, 40, 50, 60 beszúrásával; a 40-nél gyökérsplit, a 60-nál a telített jobb gyerek splitje belépés előtt; a végén [20 40] gyökér, gyerekei [10], [30], [50 60]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 8.4.4 pszeudokódja (1-től indexelt tömbök). Kezdőállapot: t = 2 és a könyv sorozata.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": null, "line": -1, "msg": "Üres B-fa, t = 2: egy csomópontban legfeljebb 2t − 1 = 3 kulcs.", "t": 2}, {"tree": {"id": 1, "k": [10], "c": []}, "line": 6, "msg": "insert(10): üres fa → új levélgyökér [10]", "t": 2, "cur": 1, "done": 10}, {"tree": {"id": 1, "k": [10, 20], "c": []}, "line": 6, "msg": "insert(20): levél [10 20], a 20 a(z) 2. helyre", "t": 2, "cur": 1, "newkey": 20, "done": 20}, {"tree": {"id": 1, "k": [10, 20, 30], "c": []}, "line": 6, "msg": "insert(30): levél [10 20 30], a 30 a(z) 3. helyre", "t": 2, "cur": 1, "newkey": 30, "done": 30}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}]}, "line": 2, "msg": "insert(40): a gyökér telített (3 kulcs) → új gyökér, split: a 20 felmegy, [10] és [30] – a magasság eggyel nő", "t": 2, "cur": 2, "y": 1, "z": 3, "up": 20}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}]}, "line": 7, "msg": "insert(40): belső csomópont [20], i = 2 → a(z) 2. gyerek [30]", "t": 2, "cur": 2, "child": 3}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30, 40], "c": []}]}, "line": 6, "msg": "insert(40): levél [30 40], a 40 a(z) 2. helyre", "t": 2, "cur": 3, "newkey": 40, "done": 40}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30, 40], "c": []}]}, "line": 7, "msg": "insert(50): belső csomópont [20], i = 2 → a(z) 2. gyerek [30 40]", "t": 2, "cur": 2, "child": 3}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30, 40, 50], "c": []}]}, "line": 6, "msg": "insert(50): levél [30 40 50], a 50 a(z) 3. helyre", "t": 2, "cur": 3, "newkey": 50, "done": 50}, {"tree": {"id": 2, "k": [20], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30, 40, 50], "c": []}]}, "line": 7, "msg": "insert(60): belső csomópont [20], i = 2 → a(z) 2. gyerek [30 40 50]", "t": 2, "cur": 2, "child": 3}, {"tree": {"id": 2, "k": [20, 40], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}, {"id": 4, "k": [50], "c": []}]}, "line": 8, "msg": "insert(60): a gyerek telített → split belépés előtt: a 40 felmegy, [30] és [50]", "t": 2, "cur": 2, "y": 3, "z": 4, "up": 40}, {"tree": {"id": 2, "k": [20, 40], "c": [{"id": 1, "k": [10], "c": []}, {"id": 3, "k": [30], "c": []}, {"id": 4, "k": [50, 60], "c": []}]}, "line": 6, "msg": "insert(60): levél [50 60], a 60 a(z) 2. helyre", "t": 2, "cur": 4, "newkey": 60, "done": 60}];
const CODE = ["B-FA-BESZUR(T, k):", "    r = T.gyoker; if r.n == 2t − 1:", "        s = ÚJ-CSOMÓPONT; T.gyoker = s; s.gyerek[1] = r; B-FA-SPLIT-GYEREK(s, 1)", "        B-FA-BESZUR-NEM-TELITETT(s, k)", "    else B-FA-BESZUR-NEM-TELITETT(r, k)", "B-FA-BESZUR-NEM-TELITETT(x, k):", "    if x.level: i keresése, kulcsok eltolása, x.kulcs[i] = k, x.n = x.n + 1", "    else: i = a megfelelő gyerek indexe", "        if x.gyerek[i].n == 2t − 1: B-FA-SPLIT-GYEREK(x, i); if k > x.kulcs[i]: i = i + 1", "        B-FA-BESZUR-NEM-TELITETT(x.gyerek[i], k)", "B-FA-SPLIT-GYEREK(x, i): y = x.gyerek[i]; z = új (y jobb t − 1 kulcsa); y.kulcs[t] → x"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let KEYSEQ = [10, 20, 30, 40, 50, 60], TT = 2;
function run(keys, t){
  let cnt = 0, root = null; const st = [];
  const N = (k, c) => ({id: ++cnt, k: k || [], c: c || []});
  const snap = x => x === null ? null : {id: x.id, k: x.k.slice(), c: x.c.map(snap)};
  const push = (line, msg, kw) => st.push(Object.assign({tree: snap(root), line, msg, t}, kw || {}));
  const S = a => a.join(" ");
  push(-1, `Üres B-fa, t = ${t}: egy csomópontban legfeljebb 2t − 1 = ${2*t-1} kulcs.`);
  const split = (x, i) => { const y = x.c[i], leaf = !y.c.length, z = N(y.k.slice(t), leaf ? [] : y.c.slice(t)), up = y.k[t-1];
    y.k = y.k.slice(0, t-1); y.c = leaf ? [] : y.c.slice(0, t); x.c.splice(i+1, 0, z); x.k.splice(i, 0, up); return [y, z, up]; };
  for (const k of keys) {
    if (root === null) { root = N([k]); push(6, `insert(${k}): üres fa → új levélgyökér [${k}]`, {cur: root.id, done: k}); continue; }
    let x = root;
    if (root.k.length === 2*t-1) { const s = N([], [root]); root = s; const [y, z, up] = split(s, 0);
      push(2, `insert(${k}): a gyökér telített (${2*t-1} kulcs) → új gyökér, split: a ${up} felmegy, [${S(y.k)}] és [${S(z.k)}] – a magasság eggyel nő`, {cur: s.id, y: y.id, z: z.id, up}); x = s; }
    while (true) {
      if (!x.c.length) {
        if (x.k.includes(k)) { push(6, `insert(${k}): már jelen van – nincs új kulcs`, {cur: x.id, done: k}); break; }
        const i = x.k.filter(v => v < k).length; x.k.splice(i, 0, k);
        push(6, `insert(${k}): levél [${S(x.k)}], a ${k} a(z) ${i+1}. helyre`, {cur: x.id, newkey: k, done: k}); break;
      }
      if (x.k.includes(k)) { push(7, `insert(${k}): belső elválasztóként már jelen van – nincs új kulcs`, {cur: x.id, done: k}); break; }
      let i = x.k.filter(v => v < k).length;
      push(7, `insert(${k}): belső csomópont [${S(x.k)}], i = ${i+1} → a(z) ${i+1}. gyerek [${S(x.c[i].k)}]`, {cur: x.id, child: x.c[i].id});
      if (x.c[i].k.length === 2*t-1) { const [y, z, up] = split(x, i);
        push(8, `insert(${k}): a gyerek telített → split belépés előtt: a ${up} felmegy, [${S(y.k)}] és [${S(z.k)}]`, {cur: x.id, y: y.id, z: z.id, up});
        if (k === up) { push(8, `insert(${k}): a felvitt elválasztó éppen ${k} – nincs új kulcs`, {cur: x.id, done: k}); break; }
        if (k > up) i++; }
      x = x.c[i];
    }
  }
  return st;
}
function check(tr, t){ const depths = new Set(); let ok = true, msg = [];
  const rec = (x, d, isRoot) => { const n = x.k.length;
    if (n > 2*t-1) { ok = false; msg.push(`[${x.k.join(" ")}]: több mint 2t − 1 kulcs`); }
    if (!isRoot && n < t-1) { ok = false; msg.push(`[${x.k.join(" ")}]: kevesebb mint t − 1 kulcs`); }
    if (x.c.length && x.c.length !== n + 1) { ok = false; msg.push("gyerekszám ≠ n + 1"); }
    if (!x.c.length) depths.add(d); x.c.forEach(c => rec(c, d + 1, false)); };
  if (tr) rec(tr, 0, true); if (depths.size > 1) { ok = false; msg.push("a levelek mélysége eltér"); }
  return [ok, msg, [...depths]]; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const t = s.t || TT;
  if (!s.tree) { el("text", {x: 20, y: 60, "font-size": 14}, "(üres fa)"); return; }
  const KWp = 38, KHp = 30, P = {}; let cur = 0;
  const rec = (x, d) => { const w = x.k.length * KWp; if (!x.c.length) { P[x.id] = [cur, d, x]; cur += w + 14; return cur - 14 - w/2; }
    const cs = x.c.map(c => rec(c, d + 1)), mid = (cs[0] + cs[cs.length-1]) / 2; P[x.id] = [mid - w/2, d, x]; return mid; };
  rec(s.tree, 0);
  const total = cur - 14, ox = Math.max(10, (560 - total) / 2), Y = d => 30 + d * 70;
  for (const id in P) { const [lx, d, x] = P[id]; x.c.forEach((c, j) => { const [cx, cd, cn] = P[c.id];
    el("line", {x1: ox + lx + j*KWp, y1: Y(d) + KHp, x2: ox + cx + cn.k.length*KWp/2, y2: Y(cd), stroke: css("--line"), "stroke-width": 1.2}); }); }
  for (const id in P) { const [lx, d, x] = P[id], full = x.k.length === 2*t-1, isCur = +id === s.cur;
    x.k.forEach((key, j) => {
      el("rect", {x: ox + lx + j*KWp, y: Y(d), width: KWp, height: KHp, fill: full ? css("--cellhl") : css("--cell"), stroke: isCur ? css("--hl") : css("--line"), "stroke-width": key === s.up ? 4 : isCur ? 3 : 1.2});
      el("text", {x: ox + lx + j*KWp + KWp/2, y: Y(d) + 20, "text-anchor": "middle", "font-size": 15, "font-weight": key === s.up || key === s.newkey ? "bold" : "normal"}, String(key)); });
    if (+id === s.z) el("rect", {x: ox + lx - 4, y: Y(d) - 4, width: x.k.length*KWp + 8, height: KHp + 8, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
    if (+id === s.y || +id === s.z) el("text", {x: ox + lx + x.k.length*KWp/2, y: Y(d) + KHp + 16, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, +id === s.y ? "y" : "z");
  }
  const [ok, msg, dep] = check(s.tree, t);
  el("text", {x: 10, y: 262, "font-size": 13, "font-weight": "bold", fill: ok ? css("--fg") : "#c00000"}, ok ? `✓ invariáns: kulcsszámok t − 1…2t − 1 = ${t-1}…${2*t-1} (gyökér ≥ 1), levélmélység ${dep.join(", ")}` : "✗ " + msg.join("; "));
  el("text", {x: 10, y: 288, "font-size": 11, fill: css("--muted")}, "szürke = telített (2t − 1 kulcs) · vastag keret = felvitt kulcs · dupla keret = új z csomópont · kék = aktuális x");
}
function load(){
  const keys = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), t = +document.getElementById("tt").value, msg = document.getElementById("err");
  if (keys.length < 1 || keys.length > 24 || keys.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–24 egész kulcsot adjon meg."; return; }
  msg.textContent = ""; KEYSEQ = keys; TT = t; setSteps(run(keys, t));
}
const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
