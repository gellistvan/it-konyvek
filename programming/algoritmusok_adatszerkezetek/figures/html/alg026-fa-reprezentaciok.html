<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bináris fa reprezentációi</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
#status,#status2{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
svg .clk{cursor:pointer}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="small">Kattintson egy csúcsra vagy tömbcellára (vagy Tab + Enter): kiemelődik a tömbbeli helye, a szülője (⌊i/2⌋) és a gyermekei (2i, 2i + 1).</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 225" role="img" aria-label="Hat csúcsú majdnem teljes bináris fa és tömbös reprezentációja T[1..6]"></svg>
<div class="ctl"><label for="n">Jobbra lánc hossza n =</label><input id="n" type="range" min="1" max="6" value="4" aria-label="Lánc hossza"><b id="nv">4</b></div>
<div id="status2" aria-live="polite"></div>
<svg id="w" viewBox="0 0 560 90" role="img" aria-label="A jobbra lánc tömbös tárolása: a foglalt cellák az 1, 3, 7, … indexeken"></svg>
<p class="small">1-től indexelt tömb: bal gyermek 2i, jobb gyermek 2i + 1, szülő ⌊i/2⌋. Egy n csúcsú jobbra lánc utolsó csúcsa a 2ⁿ − 1 indexre kerül.</p>
<script>
const D = {"level": ["A", "B", "C", "D", "E", "F"]};
const NS = "http://www.w3.org/2000/svg";
function mk(svg){ return (tag, a, t) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }; }
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const sv = document.getElementById("v"), el = mk(sv), sw = document.getElementById("w"), ew = mk(sw);
const POS = {1: [200, 30], 2: [110, 90], 3: [290, 90], 4: [65, 150], 5: [155, 150], 6: [245, 150]};
let sel = 2;
function draw(){
  sv.innerHTML = "";
  const n = D.level.length, par = Math.floor(sel / 2), kids = [2 * sel, 2 * sel + 1].filter(j => j <= n);
  const role = j => j === sel ? "sel" : j === par ? "par" : kids.includes(j) ? "kid" : "";
  for (let j = 2; j <= n; j++) { const p = Math.floor(j / 2); el("line", {x1: POS[p][0], y1: POS[p][1], x2: POS[j][0], y2: POS[j][1], stroke: css("--line"), "stroke-width": 1.3}); }
  for (let j = 1; j <= n; j++) {
    const r = role(j), [x, y] = POS[j];
    const g = el("g", {class: "clk", tabindex: 0, role: "button", "aria-label": `${D.level[j-1]} csúcs, index ${j}`});
    const c = document.createElementNS(NS, "circle"); [["cx", x], ["cy", y], ["r", 18], ["fill", r === "sel" ? css("--hl") : r ? css("--cellhl") : css("--cell")], ["stroke", css("--line")], ["stroke-width", r ? 3 : 1.3], ["stroke-dasharray", r === "par" ? "5 3" : ""]].forEach(([k, v]) => c.setAttribute(k, v)); g.appendChild(c);
    const t = document.createElementNS(NS, "text"); [["x", x], ["y", y + 6], ["text-anchor", "middle"], ["font-size", 17]].forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = D.level[j-1]; if (r === "sel") t.style.fill = css("--bg"); g.appendChild(t);
    g.addEventListener("click", () => { sel = j; draw(); }); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { sel = j; draw(); } });
  }
  const x0 = 360, w = 30, y0 = 110;
  el("text", {x: x0 - 8, y: y0 + 21, "text-anchor": "end", "font-size": 15, "font-style": "italic"}, "T");
  for (let j = 1; j <= n; j++) {
    const r = role(j), g = el("g", {class: "clk"});
    const rc = document.createElementNS(NS, "rect"); [["x", x0 + (j-1)*w], ["y", y0], ["width", w], ["height", 32], ["fill", r === "sel" ? css("--hl") : r ? css("--cellhl") : css("--cell")], ["stroke", css("--line")], ["stroke-width", r ? 3 : 1.2], ["stroke-dasharray", r === "par" ? "5 3" : ""]].forEach(([k, v]) => rc.setAttribute(k, v)); g.appendChild(rc);
    const t = document.createElementNS(NS, "text"); [["x", x0 + (j-1)*w + w/2], ["y", y0 + 22], ["text-anchor", "middle"], ["font-size", 15]].forEach(([k, v]) => t.setAttribute(k, v)); t.textContent = D.level[j-1]; if (r === "sel") t.style.fill = css("--bg"); g.appendChild(t);
    g.addEventListener("click", () => { sel = j; draw(); });
    el("text", {x: x0 + (j-1)*w + w/2, y: y0 + 50, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(j));
  }
  el("text", {x: 20, y: 215, "font-size": 12, fill: css("--muted")}, "kitöltött = kiválasztott · szürke vastag = gyermek (2i, 2i + 1) · szaggatott = szülő (⌊i/2⌋)");
  const name = D.level[sel-1];
  document.getElementById("status").textContent = `${name}: i = ${sel}; szülő ⌊${sel}/2⌋ = ${par ? par + " (" + D.level[par-1] + ")" : "nincs (gyökér)"}; ` +
    `bal gyermek 2i = ${2*sel}${2*sel <= n ? " (" + D.level[2*sel-1] + ")" : " > 6 → nincs"}; jobb gyermek 2i + 1 = ${2*sel+1}${2*sel+1 <= n ? " (" + D.level[2*sel] + ")" : " > 6 → nincs"}`;
}
function chain(){
  const n = +document.getElementById("n").value, size = 2 ** n - 1, occ = new Set(Array.from({length: n}, (_, i) => 2 ** (i + 1) - 1));
  document.getElementById("nv").textContent = n;
  sw.innerHTML = "";
  const w = Math.min(34, 540 / size);
  for (let j = 1; j <= size; j++) {
    const o = occ.has(j);
    ew("rect", {x: 10 + (j-1)*w, y: 14, width: w, height: 30, fill: o ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    if (!o) ew("line", {x1: 10 + (j-1)*w, y1: 44, x2: 10 + j*w, y2: 14, stroke: css("--muted"), "stroke-width": 0.8});
    if (o || size <= 15) ew("text", {x: 10 + (j-1)*w + w/2, y: 62, "text-anchor": "middle", "font-size": 11, fill: o ? css("--fg") : css("--muted")}, String(j));
  }
  document.getElementById("status2").textContent = `n = ${n} csúcsú jobbra lánc: foglalt indexek ${[...occ].join(", ")}; szükséges tömbméret 2^${n} − 1 = ${size}, ebből ${size - n} üres (kihasználtság ${(100 * n / size).toFixed(1).replace(".", ",")} %).`;
}
document.getElementById("n").addEventListener("input", chain);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { draw(); chain(); });
draw(); chain();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
