<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekeszfoglaltság hash függvényekkel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--bar:#555}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--bar:#bbb}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button,select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <label>Lépésköz (k = d·i): <input id="d" type="range" min="0" max="5" value="3" aria-label="Lépésköz"> <b id="dv">8</b></label>
  <label>m = <select id="m" aria-label="Táblaméret"><option>1024</option><option>1021</option><option>1543</option><option>1000</option></select></label>
  <label><input id="mult" type="checkbox"> szorzó módszer (A = (√5 − 1)/2)</label>
  <button id="b1">(a) könyv: 8, 1024</button><button id="b2">(b) 8, 1543</button><button id="b3">(c) 8, 1024, szorzó</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 260" role="img" aria-label="Hisztogram: rekeszenkénti kulcsszám a rekeszindex függvényében"></svg>
<p class="small">n = 4096 kulcs, k = d·i (i = 1…4096). Szaggatott vonal: n/m. χ² = Σ (O − n/m)² / (n/m), m − 1 szabadsági fokkal.
Szemléltető, mintázatos bemenet; determinisztikus számlálás, nem mérés.</p>
<script>
const STEPS = [1, 2, 4, 8, 16, 100], N = 4096, A = (Math.sqrt(5) - 1) / 2;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f = (x, d) => x.toFixed(d).replace(".", ",");
function update(){
  const d = STEPS[+document.getElementById("d").value], m = +document.getElementById("m").value, mult = document.getElementById("mult").checked;
  document.getElementById("dv").textContent = d;
  const c = new Array(m).fill(0);
  for (let i = 1; i <= N; i++) { const k = d * i; const fr = (k * A) % 1; c[mult ? Math.floor(m * fr) : k % m]++; }
  const e = N / m; let chi = 0, ne = 0, mx = 0;
  c.forEach(o => { chi += (o - e) * (o - e) / e; if (o) ne++; if (o > mx) mx = o; });
  document.getElementById("status").textContent = `${mult ? "Szorzó" : "Osztó"} módszer, k = ${d}·i, m = ${m}: ${ne} nem üres rekesz (${f(100*ne/m, 1)} %), max = ${mx}, n/m = ${f(e, 2)}, χ² = ${f(chi, chi > 100 ? 0 : 1)}`;
  svg.innerHTML = "";
  const L = 46, R = 630, T = 12, B = 220, ymax = Math.max(4, Math.ceil(mx * 1.1)), sx = (R - L) / m, sy = (B - T) / ymax;
  let p = "";
  c.forEach((o, h) => { if (o) p += `M${L + h*sx},${B}v${-o*sy}h${Math.max(sx, 0.6)}v${o*sy}z`; });
  el("path", {d: p, fill: css("--bar")});
  el("line", {x1: L, y1: B - e*sy, x2: R, y2: B - e*sy, stroke: css("--fg"), "stroke-dasharray": "6 4", "stroke-width": 1.2});
  el("text", {x: R, y: B - e*sy - 4, "text-anchor": "end", "font-size": 11}, "n/m = " + f(e, 2));
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: css("--line")}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: css("--line")});
  const yt = ymax > 20 ? 8 : ymax > 8 ? 2 : 1;
  for (let y = 0; y <= ymax; y += yt) { el("text", {x: L - 5, y: B - y*sy + 4, "text-anchor": "end", "font-size": 11}, String(y)); }
  [0, Math.round(m/4), Math.round(m/2), Math.round(3*m/4), m - 1].forEach(h => el("text", {x: L + h*sx, y: B + 15, "text-anchor": "middle", "font-size": 11}, String(h)));
  el("text", {x: (L+R)/2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "rekeszindex h(k)");
  el("text", {x: 12, y: (T+B)/2, "font-size": 12, transform: `rotate(-90 12 ${(T+B)/2})`, "text-anchor": "middle"}, "kulcs / rekesz");
}
["d", "m", "mult"].forEach(id => document.getElementById(id).addEventListener("input", update));
const preset = (m, mult) => () => { document.getElementById("d").value = 3; document.getElementById("m").value = m; document.getElementById("mult").checked = mult; update(); };
document.getElementById("b1").onclick = preset(1024, false);
document.getElementById("b2").onclick = preset(1543, false);
document.getElementById("b3").onclick = preset(1024, true);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
update();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
