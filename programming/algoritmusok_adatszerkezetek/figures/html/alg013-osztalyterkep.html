<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bonyolultsági osztályok térképe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
#status{margin:4px 0 6px;min-height:4.4em;padding:4px 8px;background:var(--code)}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
svg .pr{cursor:pointer}
svg .pr:hover text,svg .pr:focus text{text-decoration:underline}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Világ kiválasztása">
  <button id="w1" aria-pressed="true">Ha P ≠ NP</button>
  <button id="w2" aria-pressed="false">Ha P = NP</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Venn-diagram a P, NP, co-NP, NP-teljes és NP-nehéz osztályokkal; a problémanevek kattinthatók."></svg>
<p class="small">Döntési problémák, Karp-redukció (≤_p); a P ≠ NP nyitott kérdés. A „?” jelölt helye nem bizonyított.
A problémanevekre kattintva (vagy Tab + Enter) a fejezetbeli definíció és a redukciós lánc jelenik meg.</p>
<script>
const G = {"NP": {"cx": 1.2, "cy": 0.0, "w": 6.0, "h": 4.0}, "CONP": {"cx": -1.2, "cy": 0.0, "w": 6.0, "h": 4.0}, "PP": {"cx": 0.0, "cy": 0.15, "w": 2.3, "h": 2.5}, "NPC_X": 2.75, "CONPC_X": -3.0, "NPH": {"x0": 2.75, "x1": 6.9, "y0": -2.25, "y1": 2.25}, "LAB": {"PATH": [0.0, 0.7], "CONTAINS": [0.0, 0.3], "LP": [0.0, -0.1], "prímteszt": [0.0, -0.5], "gráfizomorfizmus?": [1.95, -1.05], "TSP-optimalizálás": [5.55, 0.55], "megállási probléma": [5.55, 0.05], "TAUTOLÓGIA": [-3.55, -0.2]}, "NPC_LIST": ["SAT", "3-SAT", "CLIQUE", "VERTEX-COVER", "HAM-CYCLE", "SUBSET-SUM"]}, PROB = {"PATH": ["P", "Adott gráf, s és t csúcs: van-e út s-ből t-be? (4.4.1) Szélességi kereséssel polinomiális.", ""], "CONTAINS": ["P", "Adott A[1..n] tömb és x: szerepel-e x a tömbben? (labor) Θ(n) idő.", ""], "LP": ["P", "Lineáris programozás (4.4.2 felsorolása): polinomiális algoritmus létezik.", ""], "prímteszt": ["P", "Adott N: prím-e? Az AKS-algoritmus óta tudjuk, hogy P-ben van (4.4.2).", ""], "SAT": ["NPC", "Kielégíthető-e egy Boole-formula? A Cook–Levin-tétel szerint az első ismert NP-teljes probléma.", "minden NP-beli A ≤_p SAT"], "3-SAT": ["NPC", "Mint a SAT, de minden klóz pontosan három literált tartalmaz.", "SAT ≤_p 3-SAT; 3-SAT ≤_p CLIQUE ≤_p VERTEX-COVER; 3-SAT ≤_p SUBSET-SUM"], "CLIQUE": ["NPC", "Van-e a gráfban k méretű teljes részgráf?", "3-SAT ≤_p CLIQUE ≤_p VERTEX-COVER"], "VERTEX-COVER": ["NPC", "Van-e legfeljebb k csúcs, amely minden élt lefed?", "3-SAT ≤_p CLIQUE ≤_p VERTEX-COVER"], "HAM-CYCLE": ["NPC", "HAMILTONIAN-CYCLE: van-e minden csúcsot pontosan egyszer érintő kör?", "HAMILTONIAN-CYCLE ≤_p TSP (döntési változat)"], "SUBSET-SUM": ["NPC", "Van-e adott W összegű részhalmaz? (Pszeudopolinomiális DP létezik, 4.4.8.)", "3-SAT ≤_p SUBSET-SUM"], "TSP-optimalizálás": ["NPH", "A legrövidebb körút megkeresése: NP-nehéz, de nem döntési probléma, ezért nincs NP-ben (4.4.6).", "HAMILTONIAN-CYCLE ≤_p TSP döntési változata"], "megállási probléma": ["NPH", "Megáll-e egy program egy bemeneten? Eldönthetetlen, így nincs NP-ben, de NP-nehéz (kiegészítő példa, a fejezet nem tárgyalja).", "SAT ≤_p megállási probléma"], "gráfizomorfizmus?": ["NPI", "Izomorf-e két gráf? NP-ben van; nem ismert, hogy P-ben van-e vagy NP-teljes (kiegészítő példa, a fejezet nem tárgyalja). Ladner tétele: ha P ≠ NP, léteznek NP-köztes problémák.", ""], "TAUTOLÓGIA": ["coNPC", "Igaz-e egy formula minden értékelésre? co-NP-teljes (4.4.7).", "a SAT komplementerével rokon: φ tautológia ⇔ ¬φ nem kielégíthető"]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(parent||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const SX = 640 / 11.6, X = x => (x + 4.4) * SX, Y = y => 165 - y * SX;
let world = 1;
const AREA = {P: "P", NPC: "NP-teljes", NPH: "NP-nehéz (NP-n kívül)", NPI: "NP-köztes jelölt", coNPC: "co-NP-teljes"};
function info(nm){
  const [ar, def, red] = PROB[nm];
  let where = AREA[ar];
  if (world === 2 && ["P", "NPC", "NPI", "coNPC"].includes(ar)) where = "P = NP (ebben a világban minden nemtriviális NP-beli probléma NP-teljes és P-ben van)";
  document.getElementById("status").innerHTML = "";
  const st = document.getElementById("status");
  const b = document.createElement("b"); b.textContent = nm + " – " + where + ". "; st.appendChild(b);
  st.appendChild(document.createTextNode(def + (red ? "  Redukció: " + red + "." : "")));
}
function label(nm, x, y, fs){
  const g = el("g", {class: "pr", tabindex: 0, role: "button", "aria-label": nm});
  el("text", {x: X(x), y: Y(y) + 4, "text-anchor": "middle", "font-size": fs || 11}, nm, g);
  g.addEventListener("click", () => info(nm));
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); info(nm); } });
}
function ellipse(e, attrs){ return el("ellipse", Object.assign({cx: X(e.cx), cy: Y(e.cy), rx: e.w / 2 * SX, ry: e.h / 2 * SX}, attrs)); }
function draw(){
  svg.innerHTML = "";
  const fg = css("--line"), mu = css("--muted");
  el("defs", {}).innerHTML =
    `<pattern id="hat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${mu}" stroke-width="2"/></pattern>` +
    `<pattern id="hat2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${mu}" stroke-width="1.2"/></pattern>` +
    `<pattern id="dot" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="${mu}"/></pattern>` +
    `<clipPath id="cnp"><ellipse cx="${X(G.NP.cx)}" cy="${Y(G.NP.cy)}" rx="${G.NP.w/2*SX}" ry="${G.NP.h/2*SX}"/></clipPath>` +
    `<clipPath id="ccp"><ellipse cx="${X(G.CONP.cx)}" cy="${Y(G.CONP.cy)}" rx="${G.CONP.w/2*SX}" ry="${G.CONP.h/2*SX}"/></clipPath>`;
  if (world === 1) {
    const h = G.NPH;
    el("rect", {x: X(h.x0), y: Y(h.y1), width: (h.x1 - h.x0) * SX, height: (h.y1 - h.y0) * SX, rx: 26, fill: "none", stroke: fg, "stroke-dasharray": "7 4", "stroke-width": 1.6});
    ellipse(G.NP, {fill: css("--cell"), stroke: fg, "stroke-width": 1.6});
    el("rect", {x: X(G.NPC_X), y: 0, width: 400, height: 330, fill: "url(#hat)", "clip-path": "url(#cnp)"});
    el("rect", {x: 0, y: 0, width: X(G.CONPC_X), height: 330, fill: "url(#hat2)", "clip-path": "url(#ccp)"});
    ellipse(G.CONP, {fill: "none", stroke: fg, "stroke-width": 1.3, "stroke-dasharray": "10 3 2 3"});
    ellipse(G.NP, {fill: "none", stroke: fg, "stroke-width": 1.6});
    ellipse(G.PP, {fill: "url(#dot)", stroke: fg, "stroke-width": 1.4});
    ellipse(Object.assign({}, G.PP, {w: G.PP.w - 0.25, h: G.PP.h - 0.85}), {fill: css("--bg"), "fill-opacity": 0.85, stroke: "none"});
    el("text", {x: X(G.PP.cx), y: Y(G.PP.cy + G.PP.h / 2 - 0.35), "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "P");
    el("text", {x: X(G.NP.cx + 1.0), y: Y(1.4), "font-size": 15, "font-weight": "bold"}, "NP");
    el("text", {x: X(G.CONP.cx - 1.6), y: Y(1.4), "font-size": 15, "font-weight": "bold"}, "co-NP");
    el("text", {x: X(1.95), y: Y(-0.55), "text-anchor": "middle", "font-size": 11}, "NP-köztes (Ladner)");
    el("text", {x: X(3.45), y: Y(1.15), "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "NP-teljes");
    el("text", {x: X(-3.55), y: Y(0.65), "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "co-NP-teljes");
    el("text", {x: X(5.55), y: Y(1.5), "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "NP-nehéz");
    for (const nm in G.LAB) label(nm, G.LAB[nm][0], G.LAB[nm][1], nm.length > 12 ? 10 : 11);
    G.NPC_LIST.forEach((nm, k) => label(nm, 3.45, 0.62 - 0.33 * k, nm.length > 8 ? 9.5 : 10.5));
  } else {
    el("rect", {x: X(0.9), y: Y(2.25), width: 4.8 * SX, height: 4.5 * SX, rx: 26, fill: "none", stroke: fg, "stroke-dasharray": "7 4", "stroke-width": 1.6});
    el("ellipse", {cx: X(0), cy: Y(0), rx: 2.0 * SX, ry: 2.0 * SX, fill: "url(#hat)", stroke: fg, "stroke-width": 1.6});
    el("ellipse", {cx: X(0), cy: Y(-0.1), rx: 1.85 * SX, ry: 1.7 * SX, fill: css("--bg"), "fill-opacity": 1});
    el("text", {x: X(0), y: Y(0.85), "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "P = NP = co-NP");
    el("text", {x: X(0), y: Y(0.55), "text-anchor": "middle", "font-size": 11}, "= NP-teljes (∅ és Σ* kivételével)");
    ["PATH", "CONTAINS", "LP", "prímteszt", "SAT", "3-SAT", "CLIQUE", "VERTEX-COVER", "HAM-CYCLE", "SUBSET-SUM", "gráfizomorfizmus?", "TAUTOLÓGIA"]
      .forEach((nm, k) => label(nm, -0.75 + 1.5 * (k % 2), 0.15 - 0.33 * Math.floor(k / 2), 10));
    el("text", {x: X(3.9), y: Y(1.5), "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "NP-nehéz");
    label("TSP-optimalizálás", 3.95, 0.4, 11); label("megállási probléma", 3.95, -0.1, 11);
  }
  document.getElementById("w1").setAttribute("aria-pressed", world === 1);
  document.getElementById("w2").setAttribute("aria-pressed", world === 2);
}
document.getElementById("w1").onclick = () => { world = 1; draw(); document.getElementById("status").textContent = "Ha P ≠ NP: P és az NP-teljes problémák diszjunktak NP-n belül, köztük NP-köztes problémák lehetnek (Ladner); az NP-nehéz terület kilép NP-ből."; };
document.getElementById("w2").onclick = () => { world = 2; draw(); document.getElementById("status").textContent = "Ha P = NP: P, NP, co-NP egybeesik, és minden nemtriviális NP-beli probléma NP-teljes; az NP-nehéz terület továbbra is kinyúlik (pl. eldönthetetlen problémák)."; };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
document.getElementById("status").textContent = "Ha P ≠ NP: P és az NP-teljes problémák diszjunktak NP-n belül, köztük NP-köztes problémák lehetnek (Ladner); az NP-nehéz terület kilép NP-ből. Kattintson egy problémanévre!";
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
