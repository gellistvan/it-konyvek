<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomuto-partíció lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb: <input id="inp" value="5, 2, 4, 7, 1, 3, 2, 6" size="22" aria-label="Saját tömb"></label><label><input id="p3" type="checkbox" onchange="load()"> háromutas partition3</label><button onclick="load()">Betöltés</button><button onclick="load('4, 4, 4, 4, 4, 4')">Csupa azonos kulcs</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc cellás tömb lépésenként; a pivotnál nem nagyobb elemek sraffozott, a nagyobbak pontozott tartománya nő, végül a 6-os pivot a 7. helyre kerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú indexelés, Lomuto-séma, pivot = utolsó elem (17.2.16). Kezdőállapot: A = [5, 2, 4, 7, 1, 3, 2, 6], 7 ciklusiteráció + záró csere. A háromutas kapcsoló a labor partition3-ját mutatja (pivot = első elem).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"A": [5, 2, 4, 7, 1, 3, 2, 6], "i": 0, "jn": 1, "j": null, "sw": null, "q": null, "line": 2, "inv": [true, true, true, true], "x": 6, "msg": "Kezdet: x = A[8] = 6, i = 0, j = 1 (p = 1, r = 8)", "mode": 2}, {"A": [5, 2, 4, 7, 1, 3, 2, 6], "i": 1, "jn": 2, "j": 1, "sw": [1, 1], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 1: A[1] = 5 ≤ 6 → i = 1, swap önmagával", "mode": 2}, {"A": [5, 2, 4, 7, 1, 3, 2, 6], "i": 2, "jn": 3, "j": 2, "sw": [2, 2], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 2: A[2] = 2 ≤ 6 → i = 2, swap önmagával", "mode": 2}, {"A": [5, 2, 4, 7, 1, 3, 2, 6], "i": 3, "jn": 4, "j": 3, "sw": [3, 3], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 3: A[3] = 4 ≤ 6 → i = 3, swap önmagával", "mode": 2}, {"A": [5, 2, 4, 7, 1, 3, 2, 6], "i": 3, "jn": 5, "j": 4, "sw": null, "q": null, "line": 4, "inv": [true, true, true, true], "x": 6, "msg": "j = 4: A[4] = 7 > 6, nincs csere (a > x tartomány bővül)", "mode": 2}, {"A": [5, 2, 4, 1, 7, 3, 2, 6], "i": 4, "jn": 6, "j": 5, "sw": [4, 5], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 5: A[5] = 1 ≤ 6 → i = 4, swap A[4] ↔ A[5] → [5,2,4,1,7,3,2,6]", "mode": 2}, {"A": [5, 2, 4, 1, 3, 7, 2, 6], "i": 5, "jn": 7, "j": 6, "sw": [5, 6], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 6: A[6] = 3 ≤ 6 → i = 5, swap A[5] ↔ A[6] → [5,2,4,1,3,7,2,6]", "mode": 2}, {"A": [5, 2, 4, 1, 3, 2, 7, 6], "i": 6, "jn": 8, "j": 7, "sw": [6, 7], "q": null, "line": 6, "inv": [true, true, true, true], "x": 6, "msg": "j = 7: A[7] = 2 ≤ 6 → i = 6, swap A[6] ↔ A[7] → [5,2,4,1,3,2,7,6]", "mode": 2}, {"A": [5, 2, 4, 1, 3, 2, 6, 7], "i": 6, "jn": 8, "j": null, "sw": [7, 8], "q": 7, "line": 7, "inv": [true, true, true, true], "x": 6, "msg": "Záró csere A[7] ↔ A[8] → [5,2,4,1,3,2,6,7]; q = 7: bal rész 6 elem, jobb rész 1 elem", "mode": 2}];
const CODE = ["PARTITION(A, p, r)", "    x = A[r]             // pivot", "    i = p - 1", "    for j = p to r - 1", "        if A[j] ≤ x", "            i = i + 1", "            swap A[i], A[j]", "    swap A[i+1], A[r]", "    return i + 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.3"/></pattern>'
    + '<pattern id="dp" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="' + css("--muted") + '"/></pattern>'
    + '<pattern id="xp" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,0L8,8M8,0L0,8" stroke="' + css("--muted") + '" stroke-width="1"/></pattern>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="' + css("--line") + '"/></marker></defs>';
  const n = s.A.length, w = Math.min(56, 520 / n), x0 = (560 - n * w) / 2, y0 = 100;
  const three = s.mode === 3, last = !three && s.q !== null && s.q !== undefined;
  for (let p = 1; p <= n; p++) {
    let pat = null;
    if (three) pat = p < s.lt ? "hp" : (p < s.i ? "xp" : (p > s.gt ? "dp" : null));
    else if (last) pat = p < s.q ? "hp" : (p > s.q ? "dp" : null);
    else pat = p <= s.i ? "hp" : (p < s.jn && p < n ? "dp" : null);
    el("rect", {x: x0 + (p-1)*w, y: y0, width: w, height: w, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    if (pat) el("rect", {x: x0 + (p-1)*w, y: y0, width: w, height: w, fill: `url(#${pat})`, stroke: "none"});
    el("rect", {x: x0 + (p-0.5)*w - 14, y: y0 + w/2 - 12, width: 28, height: 24, fill: css("--bg"), opacity: pat ? 1 : 0});
    el("text", {x: x0 + (p-0.5)*w, y: y0 + w/2 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, String(s.A[p-1]));
    el("text", {x: x0 + (p-0.5)*w, y: y0 - 6, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(p));
  }
  if (three) {
    const mk = (p, t, dy, col) => el("text", {x: x0 + (p-0.5)*w, y: y0 + w + dy, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: col}, t);
    mk(Math.min(s.lt, n), "↑ lt = " + s.lt, 24, css("--hl"));
    if (s.i <= n) mk(s.i, "↑ i = " + s.i, 46, css("--hl2"));
    mk(Math.max(1, Math.min(s.gt, n)), "↑ gt = " + s.gt, 68, css("--fg"));
    el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, `háromutas partition3 · v = ${s.v}`);
    el("text", {x: 280, y: 268, "text-anchor": "middle", "font-size": 12.5}, "A[1..lt−1] < v · A[lt..i−1] = v · A[i..gt] feldolgozatlan · A[gt+1..n] > v");
    el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "sraffozott = < v · rácsos = v · fehér = feldolgozatlan · pontozott = > v");
    return;
  }
  const pv = last ? s.q : n;
  el("rect", {x: x0 + (pv-1)*w, y: y0, width: w, height: w, fill: "none", stroke: css("--line"), "stroke-width": 4});
  if (s.sw && s.sw[0] !== s.sw[1]) {
    const a = x0 + (s.sw[0]-0.5)*w, b = x0 + (s.sw[1]-0.5)*w;
    el("path", {d: `M${a},${y0 + w + 4} Q${(a+b)/2},${y0 + w + 30 + 5*Math.abs(s.sw[1]-s.sw[0])} ${b},${y0 + w + 4}`, fill: "none",
                stroke: css("--line"), "stroke-width": 2.5, "marker-start": "url(#ah)", "marker-end": "url(#ah)"});
  }
  if (!last) {
    const ip = s.i >= 1 ? x0 + (s.i-0.5)*w : x0 - w/2;
    el("text", {x: ip, y: y0 + w + 62, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl")}, "↑ i = " + s.i);
    if (s.jn < n) el("text", {x: x0 + (s.jn-0.5)*w, y: y0 + w + 82, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "↑ j = " + s.jn);
  }
  el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"},
     `x = ${s.x} · i = ${s.i}` + (last ? ` · q = ${s.q}` : (s.jn < n ? ` · következő j = ${s.jn}` : " · ciklus vége")));
  const lab = ["A[p..i] ≤ x", "A[i+1..j−1] > x", "A[j..r−1] feldolgozatlan", "A[r] = x"];
  lab.forEach((t, q) => el("text", {x: 70 + q * 140, y: 268, "text-anchor": "middle", "font-size": 12.5}, (s.inv[q] ? "✔ " : "✘ ") + t));
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")},
     "sraffozott = ≤ x · pontozott = > x · fehér = feldolgozatlan · vastag keret = pivot");
}
function arr(a){ return "[" + a.join(",") + "]"; }
function inv(A, i, jn, x){ const n = A.length; return [A.slice(0, i).every(v => v <= x), A.slice(i, jn - 1).every(v => v > x), true, A[n-1] === x]; }
function partition(a){
  const A = a.slice(), n = A.length, x = A[n-1]; let i = 0;
  const out = [{mode: 2, A: A.slice(), i: 0, jn: 1, j: null, sw: null, q: null, line: 2, inv: inv(A, 0, 1, x), x,
                msg: `Kezdet: x = A[${n}] = ${x}, i = 0, j = 1 (p = 1, r = ${n})`}];
  for (let j = 1; j <= n - 1; j++) {
    let sw, msg, line;
    if (A[j-1] <= x) {
      i++; const t = A[i-1]; A[i-1] = A[j-1]; A[j-1] = t; sw = [i, j];
      msg = i !== j ? `j = ${j}: A[${j}] = ${A[i-1]} ≤ ${x} → i = ${i}, swap A[${i}] ↔ A[${j}] → ${arr(A)}` : `j = ${j}: A[${j}] = ${A[i-1]} ≤ ${x} → i = ${i}, swap önmagával`;
      line = 6;
    } else { sw = null; msg = `j = ${j}: A[${j}] = ${A[j-1]} > ${x}, nincs csere (a > x tartomány bővül)`; line = 4; }
    out.push({mode: 2, A: A.slice(), i, jn: j + 1, j, sw, q: null, line, inv: inv(A, i, j + 1, x), x, msg});
  }
  const t = A[i]; A[i] = A[n-1]; A[n-1] = t;
  out.push({mode: 2, A: A.slice(), i, jn: n, j: null, sw: [i + 1, n], q: i + 1, line: 7, inv: [true, true, true, true], x,
            msg: `Záró csere A[${i+1}] ↔ A[${n}] → ${arr(A)}; q = ${i+1}: bal rész ${i} elem, jobb rész ${n-i-1} elem`});
  return out;
}
function partition3(a){
  const A = a.slice(), n = A.length, v = A[0]; let lt = 1, i = 2, gt = n;
  const out = [{mode: 3, A: A.slice(), lt, i, gt, v, line: -1, msg: `Háromutas: v = A[1] = ${v}, lt = 1, i = 2, gt = ${n}`}];
  while (i <= gt) {
    let msg;
    if (A[i-1] < v) { const t = A[lt-1]; A[lt-1] = A[i-1]; A[i-1] = t; msg = `A[${i}] < ${v}: csere A[${lt}] ↔ A[${i}], lt = ${lt+1}, i = ${i+1} → ${arr(A)}`; lt++; i++; }
    else if (A[i-1] > v) { const t = A[i-1]; A[i-1] = A[gt-1]; A[gt-1] = t; msg = `A[${i}] > ${v}: csere A[${i}] ↔ A[${gt}], gt = ${gt-1} → ${arr(A)}`; gt--; }
    else { msg = `A[${i}] = ${v}: i = ${i+1}`; i++; }
    out.push({mode: 3, A: A.slice(), lt, i, gt, v, line: -1, msg});
  }
  out[out.length-1].msg += `. Vége: < ${v}: ${arr(A.slice(0, lt-1))}, = ${v}: ${arr(A.slice(lt-1, gt))}, > ${v}: ${arr(A.slice(gt))}`;
  return out;
}
function load(v){
  const e = document.getElementById("err");
  if (v) document.getElementById("inp").value = v;
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (raw.length < 2 || raw.length > 10 || raw.some(x => !Number.isInteger(x))) { e.textContent = "2–10 egész számot adjon meg."; return; }
  e.textContent = ""; setSteps(document.getElementById("p3").checked ? partition3(raw) : partition(raw));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
