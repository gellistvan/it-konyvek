<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súlyozott intervallum-ütemezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Intervallumok (s f w; …): <input id="inp" value="1 4 3; 3 5 2; 0 6 5; 5 7 4; 3 9 6; 5 9 2" size="34" aria-label="Intervallumok"></label><label><input id="gr" type="checkbox" onchange="load()"> mohó (legkorábbi befejezés)</label><button onclick="load()">Betöltés</button><button onclick="load('book')">Kidolgozott példa</button><button onclick="load('abc')">18.4.2 A/B/C</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat intervallum időtengelyen, p(j)-nyilakkal; lépésenként az M-tábla kitöltése, majd a rekonstrukció, végül az I1 és I4 kiválasztása."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Félig nyitott intervallumok, az érintkezés nem ütközés (f_i ≤ s_j); 1-től indexelt pszeudokód, rekonstrukció >= feltétellel. Kezdőállapot: a kidolgozott példa (M[6] = 7, {I1, I4}); a mohó kapcsolóval az A/B/C példán {A, C} = 4 a DP 100-zal szemben.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": "p", "j": null, "M": [0, null, null, null, null, null, null], "sel": [], "line": 0, "msg": "p(j) = a legnagyobb i < j, amelyre f_i ≤ s_j: p = [0, 0, 0, 2, 0, 2]", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": []}, {"phase": "fill", "j": 1, "M": [0, 3, null, null, null, null, null], "sel": [], "line": 2, "msg": "j = 1: ki: M[0] = 0; be: w_1 + M[p(1)] = 3 + M[0] = 3 → M[1] = 3 (be)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be"]}, {"phase": "fill", "j": 2, "M": [0, 3, 3, null, null, null, null], "sel": [], "line": 2, "msg": "j = 2: ki: M[1] = 3; be: w_2 + M[p(2)] = 2 + M[0] = 2 → M[2] = 3 (ki)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki"]}, {"phase": "fill", "j": 3, "M": [0, 3, 3, 5, null, null, null], "sel": [], "line": 2, "msg": "j = 3: ki: M[2] = 3; be: w_3 + M[p(3)] = 5 + M[0] = 5 → M[3] = 5 (be)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be"]}, {"phase": "fill", "j": 4, "M": [0, 3, 3, 5, 7, null, null], "sel": [], "line": 2, "msg": "j = 4: ki: M[3] = 5; be: w_4 + M[p(4)] = 4 + M[2] = 7 → M[4] = 7 (be)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be"]}, {"phase": "fill", "j": 5, "M": [0, 3, 3, 5, 7, 7, null], "sel": [], "line": 2, "msg": "j = 5: ki: M[4] = 7; be: w_5 + M[p(5)] = 6 + M[0] = 6 → M[5] = 7 (ki)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki"]}, {"phase": "fill", "j": 6, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [], "line": 2, "msg": "j = 6: ki: M[5] = 7; be: w_6 + M[p(6)] = 2 + M[2] = 5 → M[6] = 7 (ki)", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "rec", "j": 6, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [], "line": 5, "path": [6, 5], "msg": "j = 6: w_6 + M[2] = 5 < M[5] = 7 → I6 ki, j := 5", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "rec", "j": 5, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [], "line": 5, "path": [6, 5, 4], "msg": "j = 5: w_5 + M[0] = 6 < M[4] = 7 → I5 ki, j := 4", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "rec", "j": 4, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [4], "line": 4, "path": [6, 5, 4, 2], "msg": "j = 4: w_4 + M[2] = 7 ≥ M[3] = 5 → I4 be, j := p(4) = 2", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "rec", "j": 2, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [4], "line": 5, "path": [6, 5, 4, 2, 1], "msg": "j = 2: w_2 + M[0] = 2 < M[1] = 3 → I2 ki, j := 1", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "rec", "j": 1, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [1, 4], "line": 4, "path": [6, 5, 4, 2, 1, 0], "msg": "j = 1: w_1 + M[0] = 3 ≥ M[0] = 0 → I1 be, j := p(1) = 0", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}, {"phase": "end", "j": null, "M": [0, 3, 3, 5, 7, 7, 7], "sel": [1, 4], "line": 6, "path": [6, 5, 4, 2, 1, 0], "msg": "Optimum M[6] = 7, kiválasztva: {I1, I4}", "iv": [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], "p": [0, 0, 0, 0, 2, 0, 2], "br": [null, "be", "ki", "be", "be", "ki", "ki"]}];
const CODE = ["rendezd I-t f_i szerint; p[j] := max{i < j : f_i ≤ s_j} (vagy 0)", "M[0] := 0", "for j := 1 to n: M[j] := max(M[j−1], w_j + M[p[j]])", "j := n; while j > 0:", "    if w_j + M[p[j]] >= M[j−1]: S.hozzáad(j); j := p[j]", "    else: j := j − 1", "return (M[n], megfordított S)", "Mohó: a legkorábban befejeződő kompatibilis intervallum"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function solve(iv){
  iv = iv.slice().sort((a, b) => a[2] - b[2]); const n = iv.length, p = [0], M = [0], st = [], br = [null];
  for (let j = 1; j <= n; j++) { let q = 0; for (let i = j - 1; i >= 1; i--) if (iv[i-1][2] <= iv[j-1][1]) { q = i; break; } p.push(q); }
  const blank = () => { const a = [0]; for (let j = 1; j <= n; j++) a.push(null); return a; };
  st.push({iv, p, M: blank(), br: [], phase: "p", line: 0, sel: [], msg: "p(j) = a legnagyobb i < j, amelyre f_i ≤ s_j: p = [" + p.slice(1).join(", ") + "]"});
  for (let j = 1; j <= n; j++) { const w = iv[j-1][3], a = M[j-1], b = w + M[p[j]]; M.push(Math.max(a, b)); br.push(b >= a ? "be" : "ki");
    const Mm = blank(); for (let k = 0; k <= j; k++) Mm[k] = M[k];
    st.push({iv, p, M: Mm, br: br.slice(), phase: "fill", j, line: 2, sel: [], msg: `j = ${j}: ki: M[${j-1}] = ${a}; be: w_${j} + M[p(${j})] = ${w} + M[${p[j]}] = ${b} → M[${j}] = ${M[j]} (${br[j]})`}); }
  const S = []; let j = n; const path = [n];
  while (j > 0) { const w = iv[j-1][3]; let msg, line;
    if (w + M[p[j]] >= M[j-1]) { S.push(j); msg = `j = ${j}: w_${j} + M[${p[j]}] = ${w + M[p[j]]} ≥ M[${j-1}] = ${M[j-1]} → ${iv[j-1][0]} be, j := p(${j}) = ${p[j]}`; j = p[j]; line = 4; }
    else { msg = `j = ${j}: w_${j} + M[${p[j]}] = ${w + M[p[j]]} < M[${j-1}] = ${M[j-1]} → ${iv[j-1][0]} ki, j := ${j-1}`; j--; line = 5; }
    path.push(j); st.push({iv, p, M: M.slice(), br: br.slice(), phase: "rec", j: path[path.length - 2], line, sel: S.slice(), path: path.slice(), msg}); }
  st.push({iv, p, M: M.slice(), br: br.slice(), phase: "end", line: 6, sel: S.slice(), path: path.slice(), msg: `Optimum M[${n}] = ${M[n]}, kiválasztva: {` + S.slice().reverse().map(k => iv[k-1][0]).join(", ") + "}"});
  return st;
}
function greedy(iv){
  iv = iv.slice().sort((a, b) => a[2] - b[2]); let last = -Infinity; const sel = [], st = [];
  const opt = solve(iv), best = opt[opt.length - 1].M[iv.length];
  st.push({iv, p: null, M: null, br: [], phase: "greedy", line: 7, sel: [], msg: "Mohó: befejezési idő szerint sorban, a kompatibilis intervallumot mindig elfogadjuk"});
  iv.forEach((t, k) => { const ok = t[1] >= last; if (ok) { sel.push(k + 1); last = t[2]; }
    st.push({iv, p: null, M: null, br: [], phase: "greedy", j: k + 1, line: 7, sel: sel.slice(), msg: `${t[0]} [${t[1]}, ${t[2]}), w = ${t[3]}: ` + (ok ? "kompatibilis → elfogadjuk" : "ütközik → kihagyjuk")}); });
  const gw = sel.reduce((a, k) => a + iv[k-1][3], 0);
  st.push({iv, p: null, M: null, br: [], phase: "greedy", line: 7, sel: sel.slice(), msg: `Mohó: {${sel.map(k => iv[k-1][0]).join(", ")}} = ${gw}; a DP optimuma ${best}`});
  return st;
}
function render(s){
  svg.innerHTML = ""; const iv = s.iv, n = iv.length, T = Math.max(10, ...iv.map(t => t[2])), H = Math.min(30, 220 / n);
  svg.setAttribute("viewBox", `0 0 560 ${70 + n * H + 30}`);
  const X = t => 40 + t * (360 / T), y0 = 30 + n * H + 10, Y = j => y0 - j * H;
  svg.insertAdjacentHTML("beforeend", '<defs><pattern id="hp" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.5"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="' + css("--line") + '"/></marker></defs>');
  el("line", {x1: X(0), y1: y0, x2: X(T), y2: y0, stroke: css("--line")});
  for (let t = 0; t <= T; t++) el("text", {x: X(t), y: y0 + 14, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t));
  el("text", {x: 30, y: y0 + 4, "text-anchor": "end", "font-size": 11, "font-weight": "bold"}, "0");
  iv.forEach((t, k) => { const j = k + 1, y = Y(j), sel = s.sel.includes(j), cur = s.j === j;
    el("rect", {x: X(t[1]), y: y - H * 0.3, width: X(t[2]) - X(t[1]), height: H * 0.6, fill: sel ? "url(#hp)" : css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 3 : (sel ? 2.5 : 1)});
    el("text", {x: 30, y: y + 4, "text-anchor": "end", "font-size": 11.5, "font-weight": "bold"}, t[0]);
    el("text", {x: (X(t[1]) + X(t[2])) / 2, y: y + 4, "text-anchor": "middle", "font-size": 10}, "w=" + t[3]);
    if (s.p) { const q = s.p[j]; const on = s.phase === "fill" && cur;
      if (q) el("line", {x1: X(t[1]), y1: y + H * 0.3, x2: X(iv[q-1][2]), y2: Y(q) - H * 0.3, stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": "5 3", "marker-end": "url(#ah)"});
      else if (on) el("line", {x1: X(t[1]), y1: y + H * 0.3, x2: X(t[1]), y2: y0, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 3", "marker-end": "url(#ah)"});
    }
    if (s.M) { const v = s.M[j]; el("text", {x: 430, y: y + 4, "font-size": 12}, `M[${j}] = ${v === null ? "?" : v}`);
      if (s.br[j]) el("text", {x: 505, y: y + 4, "font-size": 12, "font-weight": s.br[j] === "be" ? "bold" : "normal"}, s.br[j]); }
  });
  if (s.M) el("text", {x: 430, y: y0 + 4, "font-size": 12}, "M[0] = 0");
  if (s.phase === "fill" && s.j) { const q = s.p[s.j];
    el("text", {x: 430, y: 20, "font-size": 11, fill: css("--hl")}, `ki: M[${s.j - 1}] · be: w + M[${q}]`); }
  el("text", {x: 40, y: y0 + 32, "font-size": 10.5, fill: css("--muted")}, s.phase === "greedy" ? "sraffozott = a mohó által elfogadott" : "szaggatott nyíl: s_j → a p(j) intervallum vége · sraffozott = kiválasztott · narancs = aktuális");
}
const BOOK = [["I1", 1, 4, 3], ["I2", 3, 5, 2], ["I3", 0, 6, 5], ["I4", 5, 7, 4], ["I5", 3, 9, 6], ["I6", 5, 9, 2]], ABC = [["A", 1, 3, 2], ["B", 2, 5, 100], ["C", 4, 6, 2]];
function parse(){ const e = document.getElementById("err"); const parts = document.getElementById("inp").value.split(";").map(x => x.trim()).filter(x => x);
  const out = []; for (let k = 0; k < parts.length; k++) { const v = parts[k].split(/[ ,]+/).map(Number);
    if (v.length !== 3 || v.some(x => !Number.isFinite(x)) || v[1] <= v[0] || v[0] < 0 || v[1] > 30) { e.textContent = "Formátum: s f w; s f w; … (0 ≤ s < f ≤ 30), legfeljebb 10 intervallum."; return null; }
    out.push(["I" + (k + 1), v[0], v[1], v[2]]); }
  if (!out.length || out.length > 10) { e.textContent = "1–10 intervallum adható meg."; return null; }
  e.textContent = ""; return out; }
function load(set){
  let iv = set === "book" ? BOOK : (set === "abc" ? ABC : parse()); if (!iv) return;
  if (set) document.getElementById("inp").value = iv.map(t => t.slice(1).join(" ")).join("; ");
  setSteps(document.getElementById("gr").checked ? greedy(iv) : solve(iv)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
