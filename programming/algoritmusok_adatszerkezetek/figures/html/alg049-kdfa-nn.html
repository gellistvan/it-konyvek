<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>k-d fa legközelebbi szomszéd</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kattintás: <select id="mode" aria-label="Kattintás módja"><option value="q">q áthelyezése</option><option value="p">pont hozzáadása</option></select></label><label><input id="pr" type="checkbox" checked onchange="recompute()"> metszés (pruning)</label><button onclick="PTS=JSON.parse('[[2, 3], [5, 4], [9, 6], [4, 7], [8, 1], [7, 2]]');Q=[9,2];recompute()">Alaphelyzet</button><span class="small">A síkra kattintva (0,5-ös rács) q áthelyezhető vagy új pont adható hozzá.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat pont a [0, 10]² síkon váltakozó x- és y-vágásokkal, mellette a k-d fa; a q = (9, 2) legközelebbi szomszédja (8, 1), a gyökér bal részfája metszés miatt kimarad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">2D, euklideszi távolság, kezdeti δ = +∞; mediános építés (páros méretnél felső medián). Kezdőállapot: a klasszikus hatpontos példa, q = (9, 2). A metszés kikapcsolásával minden csúcs látogatott (tipikus hiba 3).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": null, "best": null, "bd": 1e+308, "vis": [], "pruned": [], "msg": "NN-keresés q = (9,2), kezdeti δ = +∞"}, {"cur": [7, 2], "best": [7, 2], "bd": 2.0, "vis": [[7, 2]], "pruned": [], "msg": "csúcs (7,2), x-vágás: d = 2 → új legjobb 2"}, {"cur": [9, 6], "best": [7, 2], "bd": 2.0, "vis": [[7, 2], [9, 6]], "pruned": [], "msg": "csúcs (9,6), y-vágás: d = 4 ≥ legjobb 2"}, {"cur": [8, 1], "best": [8, 1], "bd": 1.4142135623730951, "vis": [[7, 2], [9, 6], [8, 1]], "pruned": [], "msg": "csúcs (8,1), x-vágás: d = 1,41 → új legjobb 1,41"}, {"cur": [7, 2], "best": [8, 1], "bd": 1.4142135623730951, "vis": [[7, 2], [9, 6], [8, 1]], "pruned": [[5, 4]], "msg": "csúcs (7,2), x-vágás, |q_x − 7| = 2 > legjobb 1,41 → a bal részfa kimarad"}, {"cur": null, "best": [8, 1], "bd": 1.4142135623730951, "vis": [[7, 2], [9, 6], [8, 1]], "pruned": [[5, 4]], "msg": "Vége: a legközelebbi pont (8,1), távolság 1,41; meglátogatott csúcsok: 3"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PTS = [[2, 3], [5, 4], [9, 6], [4, 7], [8, 1], [7, 2]], Q = [9, 2], MODE = "q";
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const fm = v => v === Infinity ? "+∞" : (Math.round(v * 100) / 100).toString().replace(".", ",");
const pp = p => `(${String(p[0]).replace(".", ",")},${String(p[1]).replace(".", ",")})`;
function build(pts, depth){ if (!pts.length) return null; const ax = depth % 2, s = pts.slice().sort((a, b) => (a[ax] - b[ax]) || (a[1 - ax] - b[1 - ax])), mid = Math.floor(s.length / 2);
  return {p: s[mid], ax, l: build(s.slice(0, mid), depth + 1), r: build(s.slice(mid + 1), depth + 1)}; }
let T = null;
function nn(root, q, prune){ let bp = null, bd = Infinity; const steps = [], visited = [], pruned = [];
  const snap = (node, msg) => steps.push({cur: node ? node.p : null, best: bp, bd, vis: visited.slice(), pruned: pruned.slice(), msg});
  function rec(node){ if (!node) return; visited.push(node.p); const d = dist(node.p, q), upd = d < bd; if (upd) { bp = node.p; bd = d; } const a = node.ax;
    snap(node, `csúcs ${pp(node.p)}, ${a ? "y" : "x"}-vágás: d = ${fm(d)}` + (upd ? ` → új legjobb ${fm(d)}` : ` ≥ legjobb ${fm(bd)}`));
    const [near, far] = q[a] < node.p[a] ? [node.l, node.r] : [node.r, node.l]; rec(near); if (!far) return;
    const gap = Math.abs(q[a] - node.p[a]), side = far === node.l ? "bal" : "jobb", nm = a ? "q_y" : "q_x";
    if (prune && gap >= bd) { pruned.push(far.p); snap(node, `csúcs ${pp(node.p)}, ${a ? "y" : "x"}-vágás, |${nm} − ${node.p[a]}| = ${fm(gap)} > legjobb ${fm(bd)} → a ${side} részfa kimarad`); }
    else { snap(node, `csúcs ${pp(node.p)}: |${nm} − ${node.p[a]}| = ${fm(gap)}` + (prune ? ` < legjobb ${fm(bd)}` : " (metszés kikapcsolva)") + ` → a ${side} részfát is bejárjuk`); rec(far); } }
  snap(null, `NN-keresés q = ${pp(q)}, kezdeti δ = +∞`); rec(root);
  steps.push(Object.assign({}, steps[steps.length - 1], {cur: null, msg: `Vége: a legközelebbi pont ${pp(bp)}, távolság ${fm(bd)}; meglátogatott csúcsok: ${visited.length}`}));
  return steps; }
const eq = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];
function sub(node, out){ if (!node) return out; out.push(node.p); sub(node.l, out); sub(node.r, out); return out; }
function findNode(node, p){ if (!node) return null; if (eq(node.p, p)) return node; return findNode(node.l, p) || findNode(node.r, p); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 290"); svg.innerHTML = "";
  const S = 26, ox = 10, oy = 270, X = x => ox + x * S, Y = y => oy - y * S;
  const prunedPts = new Set(); s.pruned.forEach(p => sub(findNode(T, p), []).forEach(z => prunedPts.add(z.join(","))));
  el("rect", {x: X(0), y: Y(10), width: 10 * S, height: 10 * S, fill: css("--cell"), stroke: css("--line")});
  (function cut(node, x0, x1, y0, y1){ if (!node) return; const [px, py] = node.p;
    if (node.ax === 0) { el("line", {x1: X(px), y1: Y(y0), x2: X(px), y2: Y(y1), stroke: css("--line"), "stroke-width": 1.6}); cut(node.l, x0, px, y0, y1); cut(node.r, px, x1, y0, y1); }
    else { el("line", {x1: X(x0), y1: Y(py), x2: X(x1), y2: Y(py), stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": "6 4"}); cut(node.l, x0, x1, y0, py); cut(node.r, x0, x1, py, y1); } })(T, 0, 10, 0, 10);
  // metszett régiók: a metszett részfák csúcsainak befoglaló régiója
  (function reg(node, x0, x1, y0, y1){ if (!node) return; if (s.pruned.some(p => eq(p, node.p))) { el("rect", {x: X(x0), y: Y(y1), width: (x1 - x0) * S, height: (y1 - y0) * S, fill: css("--cellhl"), opacity: 0.55}); return; }
    const [px, py] = node.p; if (node.ax === 0) { reg(node.l, x0, px, y0, y1); reg(node.r, px, x1, y0, y1); } else { reg(node.l, x0, x1, y0, py); reg(node.r, x0, x1, py, y1); } })(T, 0, 10, 0, 10);
  PTS.forEach(p => { const v = s.vis.some(z => eq(z, p)), c = eq(p, s.cur);
    el("circle", {cx: X(p[0]), cy: Y(p[1]), r: c ? 7 : 5, fill: v ? css("--fg") : css("--cell"), stroke: c ? css("--hl") : css("--line"), "stroke-width": c ? 3 : 1.5});
    el("text", {x: X(p[0]) + 7, y: Y(p[1]) - 6, "font-size": 10, fill: css("--muted")}, pp(p)); });
  if (s.best) el("circle", {cx: X(Q[0]), cy: Y(Q[1]), r: s.bd * S, fill: "none", stroke: css("--hl2"), "stroke-dasharray": "3 3", "stroke-width": 1.6});
  el("text", {x: X(Q[0]), y: Y(Q[1]) + 6, "text-anchor": "middle", "font-size": 18, fill: css("--hl2")}, "★");
  // fa
  const pos = {}; let nx = 0; (function lay(n, d){ if (!n) return; lay(n.l, d + 1); pos[n.p.join(",")] = [300 + nx * 0, d]; nx++; lay(n.r, d + 1); })(T, 0);
  const cnt = nx, dx = Math.min(70, 250 / Math.max(cnt, 1)); nx = 0; (function lay(n, d){ if (!n) return; lay(n.l, d + 1); pos[n.p.join(",")] = [290 + nx * dx + dx / 2, 30 + d * 52]; nx++; lay(n.r, d + 1); })(T, 0);
  (function ed(n){ if (!n) return; for (const c of [n.l, n.r]) if (c) { const a = pos[n.p.join(",")], b = pos[c.p.join(",")], pr = prunedPts.has(c.p.join(","));
      el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: pr ? css("--muted") : css("--line"), "stroke-dasharray": pr ? "4 3" : "none"}); ed(c); } })(T);
  (function nd(n){ if (!n) return; const [x, y] = pos[n.p.join(",")], vi = s.vis.findIndex(z => eq(z, n.p)), pr = prunedPts.has(n.p.join(",")), c = eq(n.p, s.cur);
    el("rect", {x: x - 26, y: y - 12, width: 52, height: 24, fill: pr ? css("--cellhl") : css("--cell"), stroke: c ? css("--hl") : css("--line"), "stroke-width": c ? 3.5 : (vi >= 0 ? 2.5 : 1)});
    el("text", {x, y: y + 4, "text-anchor": "middle", "font-size": 11}, pp(n.p)); if (vi >= 0) el("text", {x: x + 30, y: y - 8, "font-size": 11, "font-weight": "bold"}, String(vi + 1)); nd(n.l); nd(n.r); })(T);
  el("text", {x: 290, y: 280, "font-size": 12}, `meglátogatott csúcsok: ${s.vis.length} / ${PTS.length}` + (s.best ? `; legjobb ${pp(s.best)}, d = ${fm(s.bd)}` : ""));
}
function recompute(){ T = build(PTS, 0); setSteps(nn(T, Q, document.getElementById("pr").checked)); }
T = build(PTS, 0);
svg.addEventListener("click", ev => { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const m = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = Math.round((m.x - 10) / 26 * 2) / 2, y = Math.round((270 - m.y) / 26 * 2) / 2; if (x < 0 || x > 10 || y < 0 || y > 10) return;
  if (document.getElementById("mode").value === "q") Q = [x, y]; else if (PTS.length < 15 && !PTS.some(p => p[0] === x && p[1] === y)) PTS.push([x, y]); recompute(); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
