<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agglomeratív klaszterezés és dendrogram</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="lk">linkage:</label><select id="lk" onchange="relink()" aria-label="Linkage szabály"><option value="single">single</option><option value="complete">complete</option><option value="average">average</option></select><label for="h">vágási magasság h:</label><input id="h" type="range" min="0" max="12" step="0.1" value="5" oninput="recut()" aria-label="Vágási magasság"><b id="hv">5,0</b><span id="cutmsg" class="small" aria-live="polite">h = 5,0: k = 2: {A,B,C}, {D,E,F}</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat pont két hármas csoportban és a dendrogram; öt összevonás lépésenként, mozgatható vágási vonal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Euklideszi távolság; döntetlennél az aktív klaszterek sorrendjében első pár. Az 5. összevonás single linkage mellett √85: ezt a C–D és a B–D pár is adja. A vágás a h alatti összevonásokat tartja meg; h = 5-nél k = 2, h &gt; √85 esetén k = 1.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": -1, "msg": "Kezdet: hat egyelemű klaszter (A–F), még nincs összevonás."}, {"k": 1, "line": -1, "msg": "1. lépés: {A} + {B}, magasság 1 – min = d(A,B) = 1"}, {"k": 2, "line": -1, "msg": "2. lépés: {A,B} + {C}, magasság 1 – min = d(A,C) = 1"}, {"k": 3, "line": -1, "msg": "3. lépés: {D} + {E}, magasság 1 – min = d(D,E) = 1"}, {"k": 4, "line": -1, "msg": "4. lépés: {D,E} + {F}, magasság 1 – min = d(D,F) = 1"}, {"k": 5, "line": -1, "msg": "5. lépés: {A,B,C} + {D,E,F}, magasság √85 ≈ 9,22 – min = d(C,D) = √85 ≈ 9,22"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NM = "ABCDEF", PT = [[1,1],[1,2],[2,1],[8,8],[8,9],[9,8]];
let MER = [{"a": [0], "b": [1], "h": 1.0}, {"a": [0, 1], "b": [2], "h": 1.0}, {"a": [3], "b": [4], "h": 1.0}, {"a": [3, 4], "b": [5], "h": 1.0}, {"a": [0, 1, 2], "b": [3, 4, 5], "h": 9.219544457292887}];
const dd = (i, j) => Math.hypot(PT[i][0] - PT[j][0], PT[i][1] - PT[j][1]);
const fmt = h => { const q = Math.round(h * h); return Math.abs(Math.sqrt(q) - h) < 1e-9 && !Number.isInteger(h) ? `√${q} ≈ ${h.toFixed(2).replace(".", ",")}` : h.toFixed(Number.isInteger(h) ? 0 : 3).replace(".", ","); };
const cs = c => "{" + c.map(i => NM[i]).join(",") + "}";
function agglo(link){
  let act = PT.map((_, i) => [i]); const out = [];
  const agg = {single: v => Math.min(...v), complete: v => Math.max(...v), average: v => v.reduce((s, x) => s + x, 0) / v.length}[link];
  while (act.length > 1) {
    let best = null;
    for (let a = 0; a < act.length; a++) for (let b = a + 1; b < act.length; b++) {
      const v = []; act[a].forEach(i => act[b].forEach(j => v.push(dd(i, j))));
      const h = agg(v); if (!best || h < best[0] - 1e-12) best = [h, a, b];
    }
    const [h, a, b] = best; out.push({a: act[a], b: act[b], h});
    const nc = act[a].concat(act[b]).sort((x, y) => x - y);
    act = act.filter((_, k) => k !== a && k !== b).concat([nc]).sort((x, y) => x[0] - y[0]);
  }
  return out;
}
function why(m, link){
  const v = []; m.a.forEach(i => m.b.forEach(j => v.push([dd(i, j), NM[i] + "," + NM[j]])));
  if (link === "average") return `átlag(${v.length} pártávolság) = ${fmt(m.h)}`;
  const pick = v.reduce((p, q) => (link === "single" ? q[0] <= p[0] + 1e-12 : q[0] > p[0] + 1e-12) ? q : p);
  return `${link === "single" ? "min" : "max"} = d(${pick[1]}) = ${fmt(pick[0])}`;
}
function stepsFor(link){
  const st = [{k: 0, line: -1, msg: "Kezdet: hat egyelemű klaszter (A–F), még nincs összevonás."}];
  MER.forEach((m, i) => st.push({k: i + 1, line: -1, msg: `${i + 1}. lépés: ${cs(m.a)} + ${cs(m.b)}, magasság ${fmt(m.h)} – ${why(m, link)}`}));
  return st;
}
function partition(h){
  let cl = PT.map((_, i) => [i]);
  MER.forEach(m => { if (m.h < h) { const ca = cl.find(c => c.includes(m.a[0])), cb = cl.find(c => c.includes(m.b[0])); cl = cl.filter(c => c !== ca && c !== cb).concat([ca.concat(cb).sort()]); } });
  return cl.sort((x, y) => x[0] - y[0]);
}
function leafOrder(){
  const kids = {}; MER.forEach(m => { kids[m.a.concat(m.b).sort().join()] = [m.a.slice().sort().join(), m.b.slice().sort().join()]; });
  const out = []; (function walk(key){ if (kids[key]) { walk(kids[key][0]); walk(kids[key][1]); } else out.push(+key); })(MER[MER.length - 1].a.concat(MER[MER.length - 1].b).sort().join());
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const H = +document.getElementById("h").value, part = partition(H);
  // bal: pontok
  const PX = v => 20 + v * 22, PY = v => 250 - v * 22;
  el("rect", {x: PX(0), y: PY(10), width: 220, height: 220, fill: "none", stroke: css("--cellhl")});
  const cur = s.k ? MER[s.k - 1] : null;
  part.forEach((c, ci) => { if (c.length > 1) { const xs = c.map(i => PX(PT[i][0])), ys = c.map(i => PY(PT[i][1]));
    el("rect", {x: Math.min(...xs) - 12, y: Math.min(...ys) - 12, width: Math.max(...xs) - Math.min(...xs) + 24, height: Math.max(...ys) - Math.min(...ys) + 24, rx: 10, fill: "none", stroke: css("--muted"), "stroke-dasharray": ci % 2 ? "2 3" : "6 3"}); } });
  if (cur) { let best = null; cur.a.forEach(i => cur.b.forEach(j => { const v = dd(i, j); if (!best || v <= best[0] + 1e-12) best = [v, i, j]; }));
    el("line", {x1: PX(PT[best[1]][0]), y1: PY(PT[best[1]][1]), x2: PX(PT[best[2]][0]), y2: PY(PT[best[2]][1]), stroke: css("--hl2"), "stroke-width": 3}); }
  PT.forEach((p, i) => { const on = cur && (cur.a.includes(i) || cur.b.includes(i));
    el("circle", {cx: PX(p[0]), cy: PY(p[1]), r: on ? 7 : 5, fill: i < 3 ? css("--bg") : css("--muted"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.3});
    el("text", {x: PX(p[0]) + (i % 3 === 2 ? 9 : -14), y: PY(p[1]) + (i % 3 === 1 ? -6 : 14), "font-size": 12}, NM[i]); });
  el("text", {x: 20, y: 280, "font-size": 12}, `vágás h = ${H.toFixed(1).replace(".", ",")}: k = ${part.length}`);
  el("text", {x: 20, y: 298, "font-size": 12}, part.map(cs).join(", "));
  // jobb: dendrogram
  const ord = leafOrder(), X0 = 300, Y0 = 260, sx = 52, sy = 22, LX = i => X0 + 30 + ord.indexOf(i) * sx, HY = h => Y0 - h * sy;
  const maxh = Math.max(11, Math.ceil(MER[MER.length - 1].h) + 1);
  const sy2 = 230 / maxh, HY2 = h => Y0 - h * sy2;
  el("line", {x1: X0, y1: HY2(0), x2: X0, y2: HY2(maxh), stroke: css("--line")});
  for (let v = 0; v <= maxh; v += 2) { el("line", {x1: X0 - 4, y1: HY2(v), x2: X0, y2: HY2(v), stroke: css("--line")}); el("text", {x: X0 - 7, y: HY2(v) + 4, "text-anchor": "end", "font-size": 10}, String(v)); }
  el("text", {x: X0 - 26, y: 140, "font-size": 11, transform: `rotate(-90 ${X0 - 26} 140)`, "text-anchor": "middle"}, "magasság");
  ord.forEach(i => el("text", {x: LX(i), y: Y0 + 18, "text-anchor": "middle", "font-size": 13}, NM[i]));
  const node = {};
  MER.slice(0, s.k).forEach((m, i) => {
    const ka = m.a.slice().sort().join(), kb = m.b.slice().sort().join();
    const [xa, ha] = node[ka] || [LX(m.a[0]), 0], [xb, hb] = node[kb] || [LX(m.b[0]), 0];
    el("path", {d: `M${xa},${HY2(ha)}V${HY2(m.h)}H${xb}V${HY2(hb)}`, fill: "none", stroke: i === s.k - 1 ? css("--hl2") : css("--line"), "stroke-width": i === s.k - 1 ? 3 : 1.8});
    node[m.a.concat(m.b).sort().join()] = [(xa + xb) / 2, m.h];
    el("text", {x: (xa + xb) / 2, y: HY2(m.h) - 5, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(i + 1));
  });
  el("line", {x1: X0, y1: HY2(H), x2: X0 + 320, y2: HY2(H), stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: X0 + 320, y: HY2(H) - 5, "text-anchor": "end", "font-size": 11, fill: css("--hl")}, `vágás: k = ${part.length}`);
}
function relink(){ const l = document.getElementById("lk").value; MER = agglo(l); setSteps(stepsFor(l)); }
function recut(){ document.getElementById("hv").textContent = (+document.getElementById("h").value).toFixed(1).replace(".", ","); const p = partition(+document.getElementById("h").value); document.getElementById("cutmsg").textContent = `h = ${document.getElementById("hv").textContent}: k = ${p.length}: ` + p.map(cs).join(", "); show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
