<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csereargumentum lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A vágási tulajdonság csereargumentuma: a vágás S = {1, 2}, a könnyű e = (2,3) él, a T fában a 2–1–3 út, a kicserélt f = (1,3) él, és a T − f + e feszítőfa súlya 11 helyett 8."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az 5. szakasz gráfja; T szándékosan nem optimális feszítőfa, hogy a csere látható legyen. Az S halmaz csúcskattintással (vagy Tab + Enter) módosítható; a könnyű él, a fabeli út, f és a csere újraszámolódik. Holtversenynél a listában korábbi él a könnyű él.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 1, "msg": "1. A vágás: S = {1, 2}, V ∖ S = {3, 4, 5}; vágásélek (1,3) = 5, (2,3) = 2, (2,4) = 4. T súlya 11.", "S": [1, 2]}, {"ph": 2, "msg": "2. A vágás könnyű éle e = (2,3), w = 2; e nincs T-ben.", "S": [1, 2]}, {"ph": 3, "msg": "3. T-ben az e végpontjait (u = 2, v = 3) összekötő egyetlen út: 2–1–3.", "S": [1, 2]}, {"ph": 4, "msg": "4. Az út a vágást az f = (1,3) élen lépi át; w(e) = 2 ≤ w(f) = 5.", "S": [1, 2]}, {"ph": 5, "msg": "5. f törlése: T két komponensre esik, {1, 2} és {3, 4, 5}; u és v különböző komponensben van.", "S": [1, 2]}, {"ph": 6, "msg": "6. e beillesztése összeköti a két komponenst: T′ = T − f + e feszítőfa, súlya 11 − 5 + 2 = 8 ≤ 11.", "S": [1, 2]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const E = [[1,2,3],[1,3,5],[2,3,2],[2,4,4],[3,4,1],[3,5,6],[4,5,2]];
const TREE = [[1,2],[1,3],[3,4],[4,5]];
const POS = {1: [70, 60], 2: [70, 210], 3: [230, 120], 4: [270, 260], 5: [400, 130]};
let SEL = new Set([1, 2]);
const K = (a, b) => Math.min(a, b) + "-" + Math.max(a, b);
function analyse(S){
  const cut = E.filter(([a, b]) => S.has(a) !== S.has(b));
  if (!cut.length) return {cut, e: null};
  let e = cut[0]; for (const x of cut) if (x[2] < e[2]) e = x;
  const inT = TREE.some(([a, b]) => K(a, b) === K(e[0], e[1]));
  const u = S.has(e[0]) ? e[0] : e[1], v = u === e[0] ? e[1] : e[0];
  const adj = {}; for (let i = 1; i <= 5; i++) adj[i] = [];
  TREE.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
  const par = {[u]: 0}, st = [u]; while (st.length) { const x = st.pop(); for (const y of adj[x]) if (!(y in par)) { par[y] = x; st.push(y); } }
  const path = [v]; let x = v; while (par[x]) { x = par[x]; path.push(x); } path.reverse();
  const pe = []; for (let i = 0; i + 1 < path.length; i++) pe.push(K(path[i], path[i + 1]));
  const cutK = new Set(cut.map(([a, b]) => K(a, b)));
  const fk = pe.find(k => cutK.has(k));
  const f = fk ? E.find(([a, b]) => K(a, b) === fk) : null;
  const rest = TREE.filter(([a, b]) => K(a, b) !== fk);
  // komponens f törlése után
  const ad2 = {}; for (let i = 1; i <= 5; i++) ad2[i] = []; rest.forEach(([a, b]) => { ad2[a].push(b); ad2[b].push(a); });
  const side = new Set([u]), q = [u]; while (q.length) { const y = q.pop(); for (const z of ad2[y]) if (!side.has(z)) { side.add(z); q.push(z); } }
  return {cut, e, inT, u, v, path, pe, f, side};
}
function build(S){
  const A = analyse(S), w = E.reduce((s, [a, b, c]) => s + (TREE.some(t => K(t[0], t[1]) === K(a, b)) ? c : 0), 0);
  const Ss = "{" + [...S].sort().join(", ") + "}", R = "{" + [1,2,3,4,5].filter(x => !S.has(x)).join(", ") + "}";
  const out = [];
  if (!A.cut.length) return [{ph: 0, msg: "Válassz S-be legalább egy, de nem minden csúcsot (kattints a csúcsokra)."}];
  out.push({ph: 1, msg: `1. A vágás: S = ${Ss}, V ∖ S = ${R}; vágásélek: ${A.cut.map(x => `(${x[0]},${x[1]}) = ${x[2]}`).join(", ")}. T súlya ${w}.`});
  out.push({ph: 2, msg: `2. A vágás könnyű éle e = (${A.e[0]},${A.e[1]}), w = ${A.e[2]}` + (A.inT ? "; e már T-ben van, nincs mit cserélni." : "; e nincs T-ben.")});
  if (A.inT) return out;
  const B = [1,2,3,4,5].filter(x => !A.side.has(x));
  out.push({ph: 3, msg: `3. T-ben az e végpontjait (u = ${A.u}, v = ${A.v}) összekötő egyetlen út: ${A.path.join("–")}.`});
  out.push({ph: 4, msg: `4. Az út a vágást az f = (${A.f[0]},${A.f[1]}) élen lépi át; w(e) = ${A.e[2]} ≤ w(f) = ${A.f[2]}.`});
  out.push({ph: 5, msg: `5. f törlése: T két komponensre esik, {${[...A.side].sort().join(", ")}} és {${B.join(", ")}}; u és v különböző komponensben van.`});
  out.push({ph: 6, msg: `6. e beillesztése összeköti a két komponenst: T′ = T − f + e feszítőfa, súlya ${w} − ${A.f[2]} + ${A.e[2]} = ${w - A.f[2] + A.e[2]} ≤ ${w}.`});
  return out;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330"); G_defs();
  const A = analyse(SEL), ph = s.ph || 0, ek = A.e ? K(A.e[0], A.e[1]) : "", fk = A.f ? K(A.f[0], A.f[1]) : "";
  if (ph >= 5 && A.side) for (const x of [1,2,3,4,5]) el("circle", {cx: POS[x][0], cy: POS[x][1], r: 30, fill: A.side.has(x) ? "url(#hp)" : css("--cellhl"), stroke: "none"});
  for (const x of SEL) el("circle", {cx: POS[x][0], cy: POS[x][1], r: 24, fill: "none", stroke: css("--fg"), "stroke-dasharray": "5 3", "stroke-width": 1.4});
  const cutK = new Set(A.cut.map(([a, b]) => K(a, b))), peK = new Set(A.pe || []);
  for (const [a, b, w] of E) {
    const k = K(a, b), inT = TREE.some(t => K(t[0], t[1]) === k);
    let o = {w: 1, color: css("--muted"), label: w};
    if (inT) o = {w: 4, label: w};
    if (ph >= 1 && cutK.has(k) && !inT) o = {w: 2.2, dash: "8 5", label: w};
    if (ph >= 1 && cutK.has(k) && inT) o = {w: 4, dash: "10 4", label: w};
    if (ph >= 2 && k === ek) o = {w: ph >= 6 ? 5 : 2.6, dash: ph >= 6 ? "" : "8 5", color: css("--hl2"), label: w + (ph >= 6 ? " (e, új)" : " (e)")};
    if (ph >= 5 && k === fk) o = {w: 1, dash: "2 4", color: css("--muted"), label: w + " (f törölve)"};
    G_edge(POS[a], POS[b], o);
    if (ph >= 3 && ph < 5 && peK.has(k)) { const dx = 7; el("line", {x1: POS[a][0] + dx, y1: POS[a][1], x2: POS[b][0] + dx, y2: POS[b][1], stroke: css("--hl"), "stroke-width": 3, "stroke-dasharray": "2 4"}); }
    if (ph === 4 && k === fk) { const m = G_mid(POS[a], POS[b]); G_cross(m[0] + 14, m[1] - 4, 7); G_text(m[0] + 22, m[1] - 12, "f", {size: 14, bold: true}); }
  }
  for (const x of [1,2,3,4,5]) { const c = G_node(POS[x], x, {r: 17, w: SEL.has(x) ? 2.6 : 1.5});
    G_click(c, () => { if (SEL.has(x)) SEL.delete(x); else SEL.add(x); setSteps(build(SEL)); }, `${x}. csúcs ${SEL.has(x) ? "kivétele S-ből" : "felvétele S-be"}`); }
  G_text(10, 296, "Kattints egy csúcsra: S-be tesz / kivesz (szaggatott kör = S).", {size: 11, fill: css("--muted")});
  G_text(10, 310, "vastag = T éle · szaggatott = vágásél · narancs = e · pontozott kék = fabeli út · × = f · háttér = komponensek", {size: 11, fill: css("--muted")});
  G_text(10, 324, "T rögzített (nem optimális) feszítőfa: {(1,2), (1,3), (3,4), (4,5)}, súly 11.", {size: 11, fill: css("--muted")});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
