<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bipartit párosítás áramlással és a Kőnig-tétel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kezdés: <select id="m0" onchange="load()" aria-label="Kiinduló párosítás"><option value="m0">M = {a2–b1, a3–b2}</option><option value="empty">M = ∅ (EK augmentálások)</option></select></label><button onclick="addA()">+ A-csúcs</button><button onclick="addB()">+ B-csúcs</button><button onclick="toCut()">min-cut → lefogó halmaz</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A bipartit példa áramlási hálózata, a maradék gráf, amelyben s-ből az a1, b1, a2 érhető el, és a lefogó halmaz C = {a3, b1}; |M| = |C| = 2."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kis bipartit példa a 25.4.4 konstrukciójához. Az „M = ∅” kezdés az Edmonds–Karp augmentálásait mutatja (az eredmény itt {a1–b1, a3–b2}, a lefogó halmaz ugyanúgy {a3, b1}). Saját gráf: kattints egy A-, majd egy B-csúcsra az él felvételéhez/törléséhez; legfeljebb 5–5 csúcs.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

let GA = ["a1","a2","a3"], GB = ["b1","b2","b3"], GE = [["a1","b1"],["a2","b1"],["a3","b1"],["a3","b2"],["a3","b3"]], SEL = null;
const M0 = [["a2","b1"],["a3","b2"]];
function gpos(){ const P = {s: [40, 150], t: [520, 150]}, n = Math.max(GA.length, GB.length), dy = Math.min(80, 240 / Math.max(1, n - 1));
  GA.forEach((a, i) => P[a] = [190, 150 + (i - (GA.length - 1) / 2) * dy]); GB.forEach((b, i) => P[b] = [370, 150 + (i - (GB.length - 1) / 2) * dy]); return P; }
function run(fromM0){
  const cap = {}, f = {}; GA.forEach(a => cap["s-" + a] = 1); GB.forEach(b => cap[b + "-t"] = 1); GE.forEach(([a, b]) => cap[a + "-" + b] = 1);
  for (const k in cap) f[k] = 0;
  if (fromM0) M0.forEach(([a, b]) => { if (("s-" + a) in cap && (a + "-" + b) in cap && (b + "-t") in cap) { f["s-" + a] = 1; f[a + "-" + b] = 1; f[b + "-t"] = 1; } });
  const resid = () => { const r = {}; for (const k in cap) { const [u, v] = k.split("-"); if (cap[k] - f[k] > 0) r[k] = 1; if (f[k] > 0) r[v + "-" + u] = 1; } return r; };
  const Mof = () => GE.filter(([a, b]) => f[a + "-" + b] > 0).map(([a, b]) => a + "–" + b);
  const st = [], snap = o => st.push(Object.assign({cap, f: {...f}, r: resid(), M: Mof()}, o));
  snap({msg: fromM0 ? "Kiinduló párosítás {a2–b1, a3–b2}: az M-éleken 1 egység áramlik (s→a, a→b, b→t)." : "Kiinduló áramlás 0, M = ∅. Edmonds–Karp: BFS a maradék gráfban."});
  let it = 0;
  while (it < 50) {
    const r = resid(), par = {s: null}, q = ["s"];
    while (q.length) { const u = q.shift(); for (const k in r) { const [x, y] = k.split("-"); if (x === u && !(y in par)) { par[y] = u; q.push(y); } } }
    if (!("t" in par)) {
      const S = Object.keys(par), X = GA.filter(a => S.includes(a)), Y = GB.filter(b => S.includes(b)), C = GA.filter(a => !X.includes(a)).concat(Y);
      const ok = GE.every(([a, b]) => C.includes(a) || C.includes(b)), M = Mof();
      snap({reach: S, msg: `Nincs s → t út: a párosítás maximális, |M| = ${M.length} (${M.join(", ") || "∅"}). A maradékból elérhető S_c = {${S.join(", ")}}.`});
      snap({reach: S, C, msg: `X = A ∩ S_c = {${X.join(", ")}}, Y = B ∩ S_c = {${Y.join(", ")}}; C = (A ∖ X) ∪ Y = {${C.join(", ")}}. ` + (ok ? `Minden él lefogva, |M| = |C| = ${C.length}.` : "HIBA: nem minden él lefogott!")});
      break; }
    it++; const p = ["t"]; let x = "t"; while (par[x]) { x = par[x]; p.push(x); } p.reverse();
    const pe = []; for (let i = 0; i + 1 < p.length; i++) pe.push(p[i] + "-" + p[i + 1]);
    snap({path: pe, msg: `${it}. augmentálás: ${p.join(" → ")}` + (pe.some(k => !(k in cap)) ? " (alternáló út: visszaélen át cseréli a párosítást)." : ".")});
    for (const k of pe) { if (k in cap) f[k] += 1; else { const [u, v] = k.split("-"); f[v + "-" + u] -= 1; } }
    snap({path: pe, done: true, msg: `Frissítés: M = {${Mof().join(", ")}}, |M| = ${Mof().length}.`});
  }
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 348"); G_defs();
  const P = gpos(), onP = new Set(s.path || []);
  if (s.reach) for (const v of s.reach) if (!(s.C && (v === "s" || v === "t"))) el("circle", {cx: P[v][0], cy: P[v][1], r: 26, fill: "url(#dp)", stroke: "none"});
  if (s.C) { for (const [a, b] of GE) G_edge(P[a], P[b], {r: 17, w: s.M.includes(a + "–" + b) ? 4 : 1.4}); }
  else for (const k in s.r) { const [u, v] = k.split("-"), back = !(k in s.cap), on = onP.has(k);
    const flowing = !back && s.f[k] > 0;
    G_edge(P[u], P[v], {r: 17, dir: true, w: on ? 4 : 1.3, dash: back ? "6 4" : "", color: on ? css("--hl2") : undefined}); }
  for (const v of ["s", "t"].concat(GA, GB)) {
    if (s.C && (v === "s" || v === "t")) continue;
    if (s.C && s.C.includes(v)) { el("rect", {x: P[v][0] - 16, y: P[v][1] - 16, width: 32, height: 32, fill: css("--fg"), stroke: css("--line")});
      G_text(P[v][0], P[v][1] + 5, v, {anchor: "middle", size: 13, fill: css("--bg")}); continue; }
    const c = G_node(P[v], v, {r: 16, size: 13, w: SEL === v ? 4 : 1.5, stroke: SEL === v ? css("--hl2") : undefined});
    if (GA.includes(v) || GB.includes(v)) G_click(c, () => pick(v), `${v} kijelölése élhez`); }
  G_text(10, 312, `M = {${s.M.join(", ")}} · |M| = ${s.M.length}` + (s.C ? ` · C = {${s.C.join(", ")}}` : ""), {size: 13, bold: true});
  G_text(10, 328, "G_f: folytonos = előremutató, szaggatott = visszamutató · narancs = augmentáló út · pöttyös = s-ből elérhető", {size: 10.5, fill: css("--muted")});
  G_text(10, 342, "teli négyzet = C (lefogó halmaz) · kattints egy A-, majd egy B-csúcsra: él felvétele/törlése", {size: 10.5, fill: css("--muted")});
}
function pick(v){ if (!SEL) { SEL = v; show(+document.getElementById("pos").value); return; }
  const a = GA.includes(SEL) ? SEL : v, b = GB.includes(SEL) ? SEL : v;
  if (GA.includes(a) && GB.includes(b) && a !== b) { const i = GE.findIndex(e => e[0] === a && e[1] === b); if (i >= 0) GE.splice(i, 1); else GE.push([a, b]); }
  SEL = null; load(); }
function addA(){ if (GA.length < 5) { GA.push("a" + (GA.length + 1)); load(); } }
function addB(){ if (GB.length < 5) { GB.push("b" + (GB.length + 1)); load(); } }
function load(){ setSteps(run(document.getElementById("m0").value === "m0")); }
function toCut(){ show(STEPS.length - 1); }

STEPS = run(true);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
