<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csereargumentum: y helyére x</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
  <label>Optimális O: <select id="sel" aria-label="Optimális halmaz választása"></select></label>
  <button id="swap">Csere</button>
  <button id="reset">Vissza</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 230" role="img" aria-label="Két idővonal: O és O′; az y = (3,5) helyére x = (1,4) kerül, az intervallumok átfedésmentesek maradnak."></svg>
<p class="small">A 19.1.18 példateszt mind a négy maximális (4 elemű) átfedésmentes részhalmaza; x = (1,4) a legkorábban
befejeződő intervallum, y az O legkorábban befejeződő eleme. Félig nyitott intervallumok: f ≤ s esetén nincs átfedés.</p>
<script>
const OPT = [[[1, 4], [5, 7], [8, 11], [12, 14]], [[1, 4], [5, 7], [8, 12], [12, 14]], [[3, 5], [5, 7], [8, 11], [12, 14]], [[3, 5], [5, 7], [8, 12], [12, 14]]], X = [1, 4];
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const L = 40, R = 520, TX = t => L + (R - L) * t / 14, YO = 70, YP = 160;
const sel = document.getElementById("sel"), st = document.getElementById("status");
OPT.forEach((o, i) => { const op = document.createElement("option"); op.value = i; op.textContent = "{" + o.map(iv => "(" + iv + ")").join(", ") + "}"; sel.appendChild(op); });
let anim = null, t = 0, done = false;
function same(a, b){ return a[0] === b[0] && a[1] === b[1]; }
function draw(){
  const O = OPT[+sel.value], y = O[0], has = same(y, X), nxt = O[1];
  svg.innerHTML = "";
  el("defs", {}).innerHTML = `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="2"/></pattern>`;
  el("text", {x: 26, y: YO + 6, "text-anchor": "end", "font-size": 16, "font-weight": "bold"}, "O");
  el("text", {x: 26, y: YP + 6, "text-anchor": "end", "font-size": 16, "font-weight": "bold"}, "O′");
  for (const v of [X[1], y[1]]) el("line", {x1: TX(v), y1: 30, x2: TX(v), y2: 195, stroke: css("--muted"), "stroke-dasharray": "2 4"});
  el("text", {x: TX(X[1]) - 4, y: 26, "text-anchor": "end", "font-size": 12}, "f_x = " + X[1]);
  if (!has) el("text", {x: TX(y[1]) + 4, y: 26, "font-size": 12}, "f_y = " + y[1]);
  const bar = (iv, yy, kind, op) => { const h = kind === "o" ? 10 : 22;
    el("rect", {x: TX(iv[0]), y: yy - h / 2, width: TX(iv[1]) - TX(iv[0]), height: h, fill: kind === "x" ? css("--fg") : kind === "y" ? "url(#hp)" : css("--cellhl"), stroke: css("--line"), opacity: op === undefined ? 1 : op});
    el("text", {x: (TX(iv[0]) + TX(iv[1])) / 2, y: yy - h / 2 - 5, "text-anchor": "middle", "font-size": 12}, `(${iv[0]},${iv[1]})`); };
  O.forEach((iv, i) => bar(iv, YO, i === 0 ? (has ? "x" : "y") : "o"));
  O.slice(1).forEach(iv => bar(iv, YP, "o"));
  if (!has) {
    // animált csere: y elhalványul, x a felső sorból lecsúszik a helyére
    const e = t; el("rect", {x: TX(y[0]), y: YP - 11, width: TX(y[1]) - TX(y[0]), height: 22, fill: "url(#hp)", stroke: css("--line"), opacity: 1 - e, "stroke-dasharray": "3 3"});
    const yy = 110 - 50 + (YP - 60) * e; if (e > 0) bar(X, yy, "x");
  } else bar(X, YP, "x");
  el("line", {x1: L, y1: 200, x2: R, y2: 200, stroke: css("--line")});
  for (let k = 0; k <= 14; k += 2) el("text", {x: TX(k), y: 216, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(k));
}
function msg(){
  const O = OPT[+sel.value], y = O[0], nxt = O[1];
  if (same(y, X)) { st.textContent = "Ez az O már tartalmazza x = (1,4)-et: nincs mit cserélni, O′ = O."; return; }
  st.textContent = done ? `Csere kész: f_x = ${X[1]} ≤ s(${nxt}) = ${nxt[0]} ✓ – O′ = O − {(${y})} ∪ {(1,4)} átfedésmentes, |O′| = |O| = ${O.length}.`
    : `y = (${y}) az O legkorábban befejeződő eleme; f_x = ${X[1]} ≤ f_y = ${y[1]} ≤ s(${nxt}) = ${nxt[0]}. Nyomja meg a „Csere” gombot.`;
}
function reset(){ if (anim) cancelAnimationFrame(anim); anim = null; t = 0; done = false; draw(); msg(); }
document.getElementById("swap").onclick = () => {
  if (same(OPT[+sel.value][0], X)) { msg(); return; }
  if (anim) return; const t0 = performance.now();
  const step = now => { t = Math.min(1, (now - t0) / 900); draw(); if (t < 1) anim = requestAnimationFrame(step); else { anim = null; done = true; msg(); } };
  anim = requestAnimationFrame(step);
};
document.getElementById("reset").onclick = reset;
sel.onchange = reset;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
sel.value = 3; reset();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
