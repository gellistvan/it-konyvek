<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generáló rekurziók fája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Generálás: <select id="m" onchange="load()" aria-label="Generálás"><option value="P">PERMUTE</option><option value="S">SUBSETS</option></select></label><label>n = <select id="n" onchange="load()" aria-label="n"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A PERMUTE és a SUBSETS rekurziós fája A = [1, 2, 3]-ra; a levelek balról jobbra a kimeneti sorrendet adják."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.3.4 PERMUTE és a 20.3.5 SUBSETS pszeudokódja, A = [1, …, n]. Kezdőállapot: PERMUTE, n = 3.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["PERMUTE(A, prefix, used, depth):", "    if depth == n: KIÍR(prefix); return", "    for i = 1..n: if not used[i]:", "        used[i] = IGAZ; prefix.hozzáad(A[i]); PERMUTE(…, depth + 1)", "        prefix.vesz_vissza(); used[i] = HAMIS", "SUBSETS(A, i, chosen):", "    if i > n: KIÍR(chosen); return", "    SUBSETS(A, i + 1, chosen)            // kihagyás (0)", "    chosen.hozzáad(A[i]); SUBSETS(A, i + 1, chosen)   // bevétel (1)", "    chosen.vesz_vissza()"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function gen(mode, n){
  const A = Array.from({length: n}, (_, i) => i + 1), st = [], tree = [[], []], out = [];
  // tree: [csúcsok (kulcs), élek]; kulcs: PERMUTE-nál a prefix sztring, SUBSETS-nél a bitmaszk
  const snap = (line, msg, cur, extra) => st.push(Object.assign({mode, n, nodes: tree[0].slice(), edges: tree[1].slice(), out: out.slice(), cur, line, msg}, extra));
  if (mode === "P") {
    const used = new Array(n).fill(false), prefix = []; tree[0].push("");
    const rec = (d) => { const key = prefix.join("");
      snap(d === n ? 1 : 2, `PERMUTE(depth = ${d}): prefix = [${prefix.join(", ")}], used = [${used.map(u => u ? "I" : "H").join(" ")}]`, key, {used: used.slice(), prefix: prefix.slice()});
      if (d === n) { out.push(prefix.join(" ")); snap(1, `KIÍR: ${prefix.join(" ")} (${out.length}. kimenet)`, key, {used: used.slice(), prefix: prefix.slice(), hit: out.length - 1}); return; }
      for (let i = 0; i < n; i++) if (!used[i]) { used[i] = true; prefix.push(A[i]); const k2 = prefix.join(""); tree[0].push(k2); tree[1].push([key, k2]); rec(d + 1); prefix.pop(); used[i] = false; } };
    rec(0);
  } else {
    const chosen = []; tree[0].push("");
    const rec = (i, mask) => {
      snap(i > n ? 6 : 7, `SUBSETS(i = ${i}): chosen = [${chosen.join(", ")}], maszk = ${mask || "–"}`, mask, {chosen: chosen.slice()});
      if (i > n) { out.push(`${mask}: [${chosen.join(", ")}]`); snap(6, `KIÍR: [${chosen.join(", ")}] (maszk ${mask}, ${out.length}. kimenet)`, mask, {chosen: chosen.slice(), hit: out.length - 1}); return; }
      tree[0].push(mask + "0"); tree[1].push([mask, mask + "0"]); rec(i + 1, mask + "0");
      chosen.push(A[i - 1]); tree[0].push(mask + "1"); tree[1].push([mask, mask + "1"]); rec(i + 1, mask + "1"); chosen.pop(); };
    rec(1, "");
  }
  st.push({...st[st.length - 1], line: -1, hit: undefined, msg: `Vége: ${out.length} kimenet (balról jobbra a levelek sorrendje)`});
  return st;
}
function render(s){
  svg.innerHTML = ""; const n = s.n, H = 60, Y0 = 26;
  const tot = s.mode === "P" ? [1, 1, 2, 6, 24][n] : 2 ** n;
  svg.setAttribute("viewBox", `0 0 560 ${Math.max(Y0 + n * H + 40, 50 + tot * 15)}`);
  const pos = {};
  if (s.mode === "P") { // levelek a teljes fa szerint (n! db), lexikografikus sorrendben
    const fact = k => k <= 1 ? 1 : k * fact(k - 1), L = fact(n), W = 400 / L;
    const place = (key, used, lo) => { const d = key.length, span = fact(n - d); pos[key] = [20 + (lo + span / 2) * W, Y0 + d * H];
      let c = lo; for (let i = 1; i <= n; i++) if (!used.includes(i)) { place(key + i, used.concat([i]), c); c += fact(n - d - 1); } };
    place("", [], 0);
  } else { const L = 2 ** n, W = 400 / L;
    const place = (m) => { const d = m.length, span = 2 ** (n - d), idx = m ? parseInt(m, 2) : 0; pos[m] = [20 + (idx * span + span / 2) * W, Y0 + d * H]; if (d < n) { place(m + "0"); place(m + "1"); } };
    place(""); }
  for (const [u, v] of s.edges) { const [x0, y0] = pos[u], [x1, y1] = pos[v], b = v[v.length - 1];
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--line"), "stroke-width": s.mode === "S" && b === "1" ? 2.2 : 1.2, "stroke-dasharray": s.mode === "S" && b === "0" ? "5 3" : "none"});
    if (n <= 3) el("text", {x: (x0 + x1) / 2 + (x1 < x0 ? -5 : 5), y: (y0 + y1) / 2, "text-anchor": x1 < x0 ? "end" : "start", "font-size": 10, fill: css("--muted")}, s.mode === "P" ? b : (b === "1" ? "1" : "0")); }
  for (const key of s.nodes) { const [x, y] = pos[key], leaf = key.length === n, on = key === s.cur, r = n <= 3 ? 15 : 10;
    el("circle", {cx: x, cy: y, r, fill: leaf ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.2});
    const lab = s.mode === "P" ? (key || "[]") : "[" + [...key].map((b, i) => b === "1" ? i + 1 : null).filter(x => x).join(",") + "]";
    if (n <= 3 || leaf || key === "") el("text", {x, y: y + 4, "text-anchor": "middle", "font-size": n <= 3 ? 10 : 8}, lab); }
  // kimeneti lista
  el("text", {x: 440, y: 22, "font-size": 12, "font-weight": "bold"}, "kimenet");
  s.out.forEach((o, i) => el("text", {x: 440, y: 40 + i * 15, "font-size": 11, "font-weight": i === s.hit ? "bold" : "normal", fill: i === s.hit ? css("--hl") : css("--fg")}, `${i + 1}. ${o}`));
  const st = s.mode === "P" ? `prefix = [${(s.prefix || []).join(", ")}] · used = [${(s.used || []).map(u => u ? "I" : "H").join(" ")}]` : `chosen = [${(s.chosen || []).join(", ")}]`;
  el("text", {x: 10, y: Y0 + n * H + 30, "font-size": 13}, st);
}
function load(){ setSteps(gen(document.getElementById("m").value, +document.getElementById("n").value)); }

STEPS = gen("P", 3);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
