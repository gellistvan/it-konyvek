<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokkszintű fa-redukció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A (8 elem): <input id="inp" value="3, -1, 7, 0, 2, -5, 4, 11" size="22" aria-label="Bemenet, 8 egész"></label><label>n = <select id="nn" aria-label="Érvényes elemek száma n"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option></select></label><label><input id="nob" type="checkbox"> barrier kikapcsolása</label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('nn').value='5';load()">Részleges blokk (n = 5)</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc szál közös memóriás redukciója: betöltés 3, −1, 7, 0, 2, −5, 4, 11; stride 4 után 5, −6, 11, 11; stride 2 után 16, 5; stride 1 után 21."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet reduceBlockKernel pszeudokódja (0-tól indexelt, C-szerű), egy blokk, gid = tid. A „barrier kikapcsolása” egy lehetséges hibás ütemezést mutat: minden kör a társ cellájának előző kör előtti (régi) értékét olvassa. Kezdőállapot: a könyv példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sh": [3, -1, 7, 0, 2, -5, 4, 11], "line": 0, "stride": null, "active": [0, 1, 2, 3, 4, 5, 6, 7], "pad": [false, false, false, false, false, false, false, false], "bad": [], "msg": "Betöltés: sh = [3, −1, 7, 0, 2, −5, 4, 11]"}, {"sh": [3, -1, 7, 0, 2, -5, 4, 11], "line": 1, "stride": null, "active": [], "pad": [false, false, false, false, false, false, false, false], "bad": [], "barrier": true, "msg": "syncthreads(): minden szál befejezte a betöltést"}, {"sh": [5, -6, 11, 11, 2, -5, 4, 11], "line": 5, "stride": 4, "active": [0, 1, 2, 3], "pad": [false, false, false, false, false, false, false, false], "bad": [], "pairs": [[4, 0], [5, 1], [6, 2], [7, 3]], "msg": "stride = 4: sh[0] = 3 + 2 = 5, sh[1] = −1 + (−5) = −6, sh[2] = 7 + 4 = 11, sh[3] = 0 + 11 = 11"}, {"sh": [5, -6, 11, 11, 2, -5, 4, 11], "line": 6, "stride": 4, "active": [], "pad": [false, false, false, false, false, false, false, false], "bad": [], "barrier": true, "msg": "syncthreads(): a stride = 4 kör írásai mindenki számára láthatók"}, {"sh": [16, 5, 11, 11, 2, -5, 4, 11], "line": 5, "stride": 2, "active": [0, 1], "pad": [false, false, false, false, false, false, false, false], "bad": [], "pairs": [[2, 0], [3, 1]], "msg": "stride = 2: sh[0] = 5 + 11 = 16, sh[1] = −6 + 11 = 5"}, {"sh": [16, 5, 11, 11, 2, -5, 4, 11], "line": 6, "stride": 2, "active": [], "pad": [false, false, false, false, false, false, false, false], "bad": [], "barrier": true, "msg": "syncthreads(): a stride = 2 kör írásai mindenki számára láthatók"}, {"sh": [21, 5, 11, 11, 2, -5, 4, 11], "line": 5, "stride": 1, "active": [0], "pad": [false, false, false, false, false, false, false, false], "bad": [], "pairs": [[1, 0]], "msg": "stride = 1: sh[0] = 16 + 5 = 21"}, {"sh": [21, 5, 11, 11, 2, -5, 4, 11], "line": 6, "stride": 1, "active": [], "pad": [false, false, false, false, false, false, false, false], "bad": [], "barrier": true, "msg": "syncthreads(): a stride = 1 kör írásai mindenki számára láthatók"}, {"sh": [21, 5, 11, 11, 2, -5, 4, 11], "line": 9, "stride": 0, "active": [0], "pad": [false, false, false, false, false, false, false, false], "bad": [], "msg": "out = sh[0] = 21 = az első 8 elem összege"}];
const CODE = ["sh[tid] = (gid < n) ? A[gid] : 0;", "syncthreads();", "stride = BLOCK / 2;", "while (stride > 0) {", "    if (tid < stride)", "        sh[tid] += sh[tid + stride];", "    syncthreads();", "    stride = stride / 2;", "}", "if (tid == 0) out[blockIdx.x] = sh[0];"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const M_ = v => String(v).replace("-", "−"), P_ = v => v < 0 ? `(${M_(v)})` : M_(v);
function reduceSteps(a, n, barrier){
  const B = 8, sh = a.map((v, i) => i < n ? v : 0), pad = sh.map((_, i) => i >= n);
  const st = [{sh: sh.slice(), line: 0, stride: null, pad, bad: [], msg: `Betöltés: sh = [${sh.map(M_).join(", ")}]` + (n < B ? `; tid ≥ n = ${n} → 0 (kitöltés)` : "")}];
  if (barrier) st.push({sh: sh.slice(), line: 1, stride: null, pad, bad: [], barrier: true, msg: "syncthreads(): minden szál befejezte a betöltést"});
  let prev = sh.slice(); const corr = sh.slice();
  for (let s = B / 2; s > 0; s = Math.floor(s / 2)) {
    const before = sh.slice(), src = barrier ? before : prev;
    for (let t = 0; t < s; t++) sh[t] = before[t] + src[t + s];
    for (let t = 0; t < s; t++) corr[t] = corr[t] + corr[t + s];
    const bad = barrier ? [] : [...Array(s).keys()].filter(i => sh[i] !== corr[i]);
    st.push({sh: sh.slice(), line: 5, stride: s, pad, bad, pairs: [...Array(s).keys()].map(t => [t + s, t]),
      msg: `stride = ${s}: ` + [...Array(s).keys()].map(t => `sh[${t}] = ${M_(before[t])} + ${P_(src[t + s])} = ${M_(sh[t])}`).join(", ") + (bad.length ? `  ✗ régi érték olvasva (helyesen: ${bad.map(i => M_(corr[i])).join(", ")})` : "")});
    if (barrier) st.push({sh: sh.slice(), line: 6, stride: s, pad, bad: [], barrier: true, msg: `syncthreads(): a stride = ${s} kör írásai mindenki számára láthatók`});
    prev = before;
  }
  const ok = sh[0] === corr[0];
  st.push({sh: sh.slice(), line: 9, stride: 0, pad, bad: ok ? [] : [0], msg: `out = sh[0] = ${M_(sh[0])}` + (ok ? ` = az első ${n} elem összege` : `  ✗ HIBÁS (helyes összeg: ${M_(corr[0])})`)});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 300");
  const cw = 60, x0 = 60, y0 = 150, ch = 46;
  el("text", {x: 10, y: 24, "font-size": 15, "font-weight": "bold"}, s.line === 0 ? "betöltés" : s.stride ? `stride = ${s.stride}` : s.line === 9 ? "eredmény" : "");
  if (s.barrier) { el("line", {x1: x0 - 10, y1: y0 + ch + 30, x2: x0 + 8*cw + 10, y2: y0 + ch + 30, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "8 5"});
    el("text", {x: x0 + 4*cw, y: y0 + ch + 50, "text-anchor": "middle", "font-size": 14, "font-style": "italic"}, "syncthreads() – barrier"); }
  const act = s.line === 5 ? s.stride : s.line === 9 ? 1 : 8;
  if (s.pairs) {
    el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
    s.pairs.forEach(([src, dst]) => el("path", {d: `M ${x0 + src*cw + cw/2} ${y0 - 4} Q ${x0 + (src + dst)*cw/2 + cw/2} ${y0 - 70 - 10*(src - dst)} ${x0 + dst*cw + cw/2} ${y0 - 4}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2, "marker-end": "url(#ah)"}));
  }
  for (let i = 0; i < 8; i++) {
    const on = i < act, bad = (s.bad || []).includes(i), x = x0 + i*cw;
    el("rect", {x, y: y0, width: cw, height: ch, fill: on ? css("--cell") : css("--cellhl"), stroke: bad ? "#d00000" : css("--line"), "stroke-width": bad ? 4 : (on && s.line === 5) ? 2.5 : 1});
    if (!on) for (let h = -ch; h < cw; h += 9) el("line", {x1: x + Math.max(0, h), y1: y0 + Math.max(0, -h), x2: x + Math.min(cw, h + ch), y2: y0 + Math.min(ch, ch - (h + ch - cw) * (h + ch > cw)), stroke: css("--muted"), "stroke-width": 0.6});
    if (s.pad[i] && s.line === 0) el("text", {x: x + cw/2, y: y0 + ch - 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "kitöltés");
    el("text", {x: x + cw/2, y: y0 + 29, "text-anchor": "middle", "font-size": 18, "font-weight": on ? "bold" : "normal", fill: bad ? "#d00000" : on ? css("--fg") : css("--muted")}, String(s.sh[i]).replace("-", "−"));
    el("text", {x: x + cw/2, y: y0 + ch + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "tid " + i);
  }
  el("text", {x: 10, y: 292, "font-size": 12, fill: css("--muted")}, "nyíl: sh[i + stride] → sh[i] · szürke sraffozás = inaktív szál · piros keret = hibás (régi értékből számolt) cella");
}
function load(){
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), n = +document.getElementById("nn").value, msg = document.getElementById("err");
  if (raw.length !== 8 || raw.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "Pontosan 8 egész számot adjon meg (|x| ≤ 999)."; return; }
  msg.textContent = ""; setSteps(reduceSteps(raw, n, !document.getElementById("nob").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
