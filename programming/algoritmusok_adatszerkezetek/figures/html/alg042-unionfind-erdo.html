<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Union-find erdő lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n = <input id="nn" value="5" size="2" aria-label="Elemszám"></label><label>Műveletek: <input id="ops" value="U 1 2; U 3 4; U 5 2; U 2 4; F 4" size="34" aria-label="Műveletsor"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('nn').value=8;document.getElementById('ops').value='U 1 2; U 3 4; U 1 3; U 5 6; U 7 8; U 5 7; U 1 5; F 8';load()">Példa: n = 8, mélyebb út</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt elemű union-find erdő, alatta a szülő- és rangtömb; a műveletek lépésenként, a FIND visszafelé a gyökérre köti át az út csúcsait."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú, rang szerinti unió + rekurzív úttömörítés, egyenlő rangnál rx marad a gyökér. Kezdőállapot: a 12.1.7 kidolgozott példája. A FIND felfelé menete pontozott kerettel, a visszafelé átkötés egyenként látszik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"par": [1, 2, 3, 4, 5], "rank": [0, 0, 0, 0, 0], "line": 4, "msg": "UNION(1, 2) kezdődik", "chg": [], "path": [], "old": null, "op": "UNION(1, 2)"}, {"par": [1, 2, 3, 4, 5], "rank": [0, 0, 0, 0, 0], "line": 3, "msg": "UNION(1, 2) / FIND(1): szülő[1] = 1, a gyökér 1", "chg": [], "path": [1], "old": null, "op": "UNION(1, 2) / FIND(1)"}, {"par": [1, 2, 3, 4, 5], "rank": [0, 0, 0, 0, 0], "line": 3, "msg": "UNION(1, 2) / FIND(2): szülő[2] = 2, a gyökér 2", "chg": [], "path": [2], "old": null, "op": "UNION(1, 2) / FIND(2)"}, {"par": [1, 1, 3, 4, 5], "rank": [1, 0, 0, 0, 0], "line": 10, "msg": "UNION(1, 2): rx = 1, ry = 2, rang egyenlő → szülő[2] = 1, rang[1] = 1", "chg": [["p", 2], ["r", 1]], "path": [], "old": null, "op": "UNION(1, 2)"}, {"par": [1, 1, 3, 4, 5], "rank": [1, 0, 0, 0, 0], "line": 4, "msg": "UNION(3, 4) kezdődik", "chg": [], "path": [], "old": null, "op": "UNION(3, 4)"}, {"par": [1, 1, 3, 4, 5], "rank": [1, 0, 0, 0, 0], "line": 3, "msg": "UNION(3, 4) / FIND(3): szülő[3] = 3, a gyökér 3", "chg": [], "path": [3], "old": null, "op": "UNION(3, 4) / FIND(3)"}, {"par": [1, 1, 3, 4, 5], "rank": [1, 0, 0, 0, 0], "line": 3, "msg": "UNION(3, 4) / FIND(4): szülő[4] = 4, a gyökér 4", "chg": [], "path": [4], "old": null, "op": "UNION(3, 4) / FIND(4)"}, {"par": [1, 1, 3, 3, 5], "rank": [1, 0, 1, 0, 0], "line": 10, "msg": "UNION(3, 4): rx = 3, ry = 4, rang egyenlő → szülő[4] = 3, rang[3] = 1", "chg": [["p", 4], ["r", 3]], "path": [], "old": null, "op": "UNION(3, 4)"}, {"par": [1, 1, 3, 3, 5], "rank": [1, 0, 1, 0, 0], "line": 4, "msg": "UNION(5, 2) kezdődik", "chg": [], "path": [], "old": null, "op": "UNION(5, 2)"}, {"par": [1, 1, 3, 3, 5], "rank": [1, 0, 1, 0, 0], "line": 3, "msg": "UNION(5, 2) / FIND(5): szülő[5] = 5, a gyökér 5", "chg": [], "path": [5], "old": null, "op": "UNION(5, 2) / FIND(5)"}, {"par": [1, 1, 3, 3, 5], "rank": [1, 0, 1, 0, 0], "line": 1, "msg": "UNION(5, 2) / FIND(2): szülő[2] = 1 ≠ 2 → rekurzió felfelé", "chg": [], "path": [2], "old": null, "op": "UNION(5, 2) / FIND(2)"}, {"par": [1, 1, 3, 3, 5], "rank": [1, 0, 1, 0, 0], "line": 3, "msg": "UNION(5, 2) / FIND(2): szülő[1] = 1, a gyökér 1", "chg": [], "path": [2, 1], "old": null, "op": "UNION(5, 2) / FIND(2)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 8, "msg": "UNION(5, 2): rx = 5, ry = 1, rang[5] = 0 < rang[1] = 1 → szülő[5] = 1", "chg": [["p", 5]], "path": [], "old": null, "op": "UNION(5, 2)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 4, "msg": "UNION(2, 4) kezdődik", "chg": [], "path": [], "old": null, "op": "UNION(2, 4)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 1, "msg": "UNION(2, 4) / FIND(2): szülő[2] = 1 ≠ 2 → rekurzió felfelé", "chg": [], "path": [2], "old": null, "op": "UNION(2, 4) / FIND(2)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 3, "msg": "UNION(2, 4) / FIND(2): szülő[1] = 1, a gyökér 1", "chg": [], "path": [2, 1], "old": null, "op": "UNION(2, 4) / FIND(2)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 1, "msg": "UNION(2, 4) / FIND(4): szülő[4] = 3 ≠ 4 → rekurzió felfelé", "chg": [], "path": [4], "old": null, "op": "UNION(2, 4) / FIND(4)"}, {"par": [1, 1, 3, 3, 1], "rank": [1, 0, 1, 0, 0], "line": 3, "msg": "UNION(2, 4) / FIND(4): szülő[3] = 3, a gyökér 3", "chg": [], "path": [4, 3], "old": null, "op": "UNION(2, 4) / FIND(4)"}, {"par": [1, 1, 1, 3, 1], "rank": [2, 0, 1, 0, 0], "line": 10, "msg": "UNION(2, 4): rx = 1, ry = 3, rang egyenlő → szülő[3] = 1, rang[1] = 2", "chg": [["p", 3], ["r", 1]], "path": [], "old": null, "op": "UNION(2, 4)"}, {"par": [1, 1, 1, 3, 1], "rank": [2, 0, 1, 0, 0], "line": 0, "msg": "FIND(4) kezdődik", "chg": [], "path": [], "old": null, "op": "FIND(4)"}, {"par": [1, 1, 1, 3, 1], "rank": [2, 0, 1, 0, 0], "line": 1, "msg": "FIND(4): szülő[4] = 3 ≠ 4 → rekurzió felfelé", "chg": [], "path": [4], "old": null, "op": "FIND(4)"}, {"par": [1, 1, 1, 3, 1], "rank": [2, 0, 1, 0, 0], "line": 1, "msg": "FIND(4): szülő[3] = 1 ≠ 3 → rekurzió felfelé", "chg": [], "path": [4, 3], "old": null, "op": "FIND(4)"}, {"par": [1, 1, 1, 3, 1], "rank": [2, 0, 1, 0, 0], "line": 3, "msg": "FIND(4): szülő[1] = 1, a gyökér 1", "chg": [], "path": [4, 3, 1], "old": null, "op": "FIND(4)"}, {"par": [1, 1, 1, 1, 1], "rank": [2, 0, 1, 0, 0], "line": 2, "msg": "FIND(4): visszafelé szülő[4] = 1 (tömörítés, régi szülő 3)", "chg": [["p", 4]], "path": [4, 3, 1], "old": [4, 3], "op": "FIND(4)"}, {"par": [1, 1, 1, 1, 1], "rank": [2, 0, 1, 0, 0], "line": 3, "msg": "FIND(4) = 1; szülő = [1, 1, 1, 1, 1]", "chg": [["p", 4]], "path": [], "old": null, "op": "FIND(4)"}];
const CODE = ["FIND(x):", "    HA szülő[x] != x AKKOR", "        szülő[x] = FIND(szülő[x])   // úttömörítés", "    VISSZA szülő[x]", "UNION(x, y):", "    rx = FIND(x)", "    ry = FIND(y)", "    HA rx == ry AKKOR VISSZA", "    HA rang[rx] < rang[ry] AKKOR szülő[rx] = ry", "    KÜLÖNBEN HA rang[rx] > rang[ry] AKKOR szülő[ry] = rx", "    KÜLÖNBEN szülő[ry] = rx; rang[rx] += 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function layout(par){
  const n = par.length, kids = {}, roots = [], pos = {}; let nxt = 0;
  for (let v = 1; v <= n; v++) kids[v] = [];
  for (let v = 1; v <= n; v++) { const p = par[v-1]; if (p === v) roots.push(v); else kids[p].push(v); }
  function walk(v, d){ if (!kids[v].length) { pos[v] = [nxt++, d]; } else { const xs = kids[v].map(c => walk(c, d + 1)); pos[v] = [(Math.min(...xs) + Math.max(...xs)) / 2, d]; } return pos[v][0]; }
  roots.forEach(r => walk(r, 0));
  return [pos, roots, nxt];
}
function render(s){
  const n = s.par.length;
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  const [pos, roots, w] = layout(s.par), dx = Math.min(80, 520 / Math.max(w, 1)), x0 = 280 - (w - 1) * dx / 2;
  const P = {}; for (const v in pos) P[v] = [x0 + pos[v][0] * dx, 40 + pos[v][1] * 62];
  const R = 20;
  function edge(a, b, extra){ const [x1, y1] = P[a], [x2, y2] = P[b], L = Math.hypot(x2 - x1, y2 - y1) || 1;
    return el("line", Object.assign({x1: x1 + (x2 - x1) * R / L, y1: y1 + (y2 - y1) * R / L, x2: x2 - (x2 - x1) * (R + 4) / L, y2: y2 - (y2 - y1) * (R + 4) / L, stroke: css("--line"), "stroke-width": 1.4, "marker-end": "url(#ah)"}, extra || {})); }
  for (let v = 1; v <= n; v++) if (s.par[v-1] !== v) edge(v, s.par[v-1], (s.old && s.old[0] === v) ? {"stroke-width": 3} : {});
  if (s.old) { edge(s.old[0], s.old[1], {"stroke-dasharray": "5 4", stroke: css("--muted")});
    const [a, b] = [P[s.old[0]], P[s.old[1]]]; el("text", {x: (a[0] + b[0]) / 2 + 8, y: (a[1] + b[1]) / 2, "font-size": 16, fill: css("--muted")}, "×");
    el("text", {x: a[0] - 26, y: a[1] - 26, "text-anchor": "end", "font-size": 12, "font-style": "italic"}, "tömörítés"); }
  for (let v = 1; v <= n; v++) { const [x, y] = P[v], onp = s.path.includes(v), last = s.path.length && s.path[s.path.length - 1] === v;
    if (roots.includes(v)) el("circle", {cx: x, cy: y, r: R + 5, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
    el("circle", {cx: x, cy: y, r: R, fill: onp ? css("--cellhl") : css("--cell"), stroke: last ? css("--hl") : css("--line"), "stroke-width": last ? 4 : 1.4, "stroke-dasharray": onp && !last ? "3 3" : "none"});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, `${v}(${s.rank[v-1]})`); }
  const chg = new Set(s.chg.map(c => c[0] + c[1])), cw = Math.min(56, 440 / n), ax0 = 280 - n * cw / 2;
  [["szülő", s.par, "p"], ["rang", s.rank, "r"]].forEach(([name, arr, key], row) => { const y = 250 + row * 36;
    el("text", {x: ax0 - 8, y: y + 22, "text-anchor": "end", "font-size": 13}, name);
    arr.forEach((v, i) => { const on = chg.has(key + (i + 1));
      el("rect", {x: ax0 + i * cw, y, width: cw, height: 32, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3.5 : 1});
      el("text", {x: ax0 + i * cw + cw / 2, y: y + 22, "text-anchor": "middle", "font-size": 15, "font-weight": on ? "bold" : "normal"}, String(v));
      if (row === 0) el("text", {x: ax0 + i * cw + cw / 2, y: y - 4, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i + 1)); }); });
}
function simulate(ops, n){
  const par = [0], rank = [0], steps = []; for (let v = 1; v <= n; v++) { par.push(v); rank.push(0); }
  const snap = (line, msg, chg, path, old) => steps.push({par: par.slice(1), rank: rank.slice(1), line, msg, chg: (chg || []).slice(), path: (path || []).slice(), old: old || null});
  function find(x, label, chg){ const path = [x];
    while (par[path[path.length-1]] !== path[path.length-1]) { const t = path[path.length-1]; snap(1, `${label}: szülő[${t}] = ${par[t]} ≠ ${t} → rekurzió felfelé`, [], path); path.push(par[t]); }
    const r = path[path.length-1]; snap(3, `${label}: szülő[${r}] = ${r}, a gyökér ${r}`, [], path);
    for (const v of path.slice(0, -1).reverse()) if (par[v] !== r) { const old = [v, par[v]]; par[v] = r; chg.push(["p", v]);
      snap(2, `${label}: visszafelé szülő[${v}] = ${r} (tömörítés, régi szülő ${old[1]})`, [["p", v]], path, old); }
    return r; }
  for (const op of ops) { const label = op[0] === "U" ? `UNION(${op[1]}, ${op[2]})` : `FIND(${op[1]})`, chg = [];
    snap(op[0] === "U" ? 4 : 0, `${label} kezdődik`);
    if (op[0] === "F") { const r = find(op[1], label, chg); snap(3, `${label} = ${r}; szülő = [${par.slice(1).join(", ")}]`, chg); continue; }
    const x = op[1], y = op[2], rx = find(x, label + ` / FIND(${x})`, chg), ry = find(y, label + ` / FIND(${y})`, chg);
    if (rx === ry) snap(7, `${label}: rx = ry = ${rx}, már azonos halmaz`, chg);
    else if (rank[rx] < rank[ry]) { par[rx] = ry; chg.push(["p", rx]); snap(8, `${label}: rx = ${rx}, ry = ${ry}, rang[${rx}] = ${rank[rx]} < rang[${ry}] = ${rank[ry]} → szülő[${rx}] = ${ry}`, chg); }
    else if (rank[rx] > rank[ry]) { par[ry] = rx; chg.push(["p", ry]); snap(9, `${label}: rx = ${rx}, ry = ${ry}, rang[${rx}] = ${rank[rx]} > rang[${ry}] = ${rank[ry]} → szülő[${ry}] = ${rx}`, chg); }
    else { par[ry] = rx; rank[rx] += 1; chg.push(["p", ry], ["r", rx]); snap(10, `${label}: rx = ${rx}, ry = ${ry}, rang egyenlő → szülő[${ry}] = ${rx}, rang[${rx}] = ${rank[rx]}`, chg); } }
  return steps;
}
function load(){
  const e = document.getElementById("err"), n = parseInt(document.getElementById("nn").value, 10), ops = [];
  if (!(n >= 1 && n <= 10)) { e.textContent = "n: 1–10."; return; }
  for (const part of document.getElementById("ops").value.split(";")) { const t = part.trim().split(/[\s,]+/).filter(x => x);
    if (!t.length) continue; const k = t[0].toUpperCase(), a = t.slice(1).map(Number);
    if ((k === "U" && a.length === 2 || k === "F" && a.length === 1) && a.every(v => Number.isInteger(v) && v >= 1 && v <= n)) ops.push([k].concat(a));
    else { e.textContent = "Hibás művelet: „" + part.trim() + "” (U x y vagy F x, 1 ≤ x, y ≤ n)."; return; } }
  e.textContent = ""; setSteps(simulate(ops, n));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
