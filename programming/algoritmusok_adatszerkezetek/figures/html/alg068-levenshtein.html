<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levenshtein-tábla és backtrace</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>X: <input id="X" value="kutya" size="12" aria-label="X"></label><label>Y: <input id="Y" value="kacsa" size="12" aria-label="Y"></label><label>Mód: <select id="mode" onchange="load()" aria-label="Mód"><option value="fill">kitöltés</option><option value="back">backtrace</option></select></label><button onclick="load()">Betöltés</button><span class="small">6.3 tesztpárok:</span><button onclick="load('a', '')">„a” → „”</button><button onclick="load('', 'abc')">„” → „abc”</button><button onclick="load('kutya', 'kacsa')">„kutya” → „kacsa”</button><button onclick="load('alma', 'almafa')">„alma” → „almafa”</button><button onclick="load('abcdef', 'azced')">„abcdef” → „azced”</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kutya és a kacsa Levenshtein-táblája cellánként kitöltve; backtrace módban a helyettesítések és a köztes szavak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egységköltségek; d[i, j] = az X[1..i] → Y[1..j] távolság. Kezdőállapot: kutya → kacsa, kitöltés mód; backtrace módban a köztes alakok katya, kacya, kacsa (u→a, t→c, y→s), d[5, 5] = 3.</p>

 1 + min(törlés 4, beszúrás 3, helyettesítés 3) = 4"}, {"x": "kutya", "y": "kacsa", "d": [[0, 1, 2, 3, 4, 5], [1, 0, 1, 2, 3, 4], [2, 1, 1, 2, 3, 4], [3, 2, 2, 2, 3, 4], [4, 3, 3, 3, 3, 4], [5, 4, 3, 4, 4, 3]], "mode": "fill", "k": 21, "i": 5, "j": 1, "line": 3, "msg": "X[5] = a ≠ Y[1] = k: 1 + min(törlés 3, beszúrás 5, helyettesítés 4) = 4"}, {"x": "kutya", "y": "kacsa", "d": [[0, 1, 2, 3, 4, 5], [1, 0, 1, 2, 3, 4], [2, 1, 1, 2, 3, 4], [3, 2, 2, 2, 3, 4], [4, 3, 3, 3, 3, 4], [5, 4, 3, 4, 4, 3]], "mode": "fill", "k": 22, "i": 5, "j": 2, "line": 2, "msg": "X[5] = Y[2] = a: d[5,2] = d[4,1] = 3"}, {"x": "kutya", "y": "kacsa", "d": [[0, 1, 2, 3, 4, 5], [1, 0, 1, 2, 3, 4], [2, 1, 1, 2, 3, 4], [3, 2, 2, 2, 3, 4], [4, 3, 3, 3, 3, 4], [5, 4, 3, 4, 4, 3]], "mode": "fill", "k": 23, "i": 5, "j": 3, "line": 3, "msg": "X[5] = a ≠ Y[3] = c: 1 + min(törlés 3, beszúrás 3, helyettesítés 3) = 4"}, {"x": "kutya", "y": "kacsa", "d": [[0, 1, 2, 3, 4, 5], [1, 0, 1, 2, 3, 4], [2, 1, 1, 2, 3, 4], [3, 2, 2, 2, 3, 4], [4, 3, 3, 3, 3, 4], [5, 4, 3, 4, 4, 3]], "mode": "fill", "k": 24, "i": 5, "j": 4, "line": 3, "msg": "X[5] = a ≠ Y[4] = s: 1 + min(törlés 3, beszúrás 4, helyettesítés 3) = 4"}, {"x": "kutya", "y": "kacsa", "d": [[0, 1, 2, 3, 4, 5], [1, 0, 1, 2, 3, 4], [2, 1, 1, 2, 3, 4], [3, 2, 2, 2, 3, 4], [4, 3, 3, 3, 3, 4], [5, 4, 3, 4, 4, 3]], "mode": "fill", "k": 25, "i": 5, "j": 5, "line": 2, "msg": "X[5] = Y[5] = a: d[5,5] = d[4,4] = 3. Kész: d[5, 5] = 3"}];
const CODE = ["for i = 0 to m: d[i, 0] := i;  for j = 0 to n: d[0, j] := j", "for i = 1 to m: for j = 1 to n:", "    if X[i] == Y[j]: d[i, j] := d[i−1, j−1]", "    else: d[i, j] := 1 + min(d[i−1, j]  (törlés ↑),", "                            d[i, j−1]  (beszúrás ←),", "                            d[i−1, j−1] (helyettesítés ↖))", "backtrace (m, n)-ből: ↖ ha egyezés/helyettesítés adja,", "    különben ↑ törlés, különben ← beszúrás"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function lev(x, y){ const m = x.length, n = y.length, d = [];
  for (let i = 0; i <= m; i++) { d.push(new Array(n + 1).fill(0)); d[i][0] = i; } for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = x[i-1] === y[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j], d[i][j-1], d[i-1][j-1]);
  return d; }
function steps(x, y, mode){
  const m = x.length, n = y.length, d = lev(x, y), st = [];
  if (mode === "fill") {
    st.push({x, y, d, mode, k: 0, line: 0, msg: `Kezdet: d[i, 0] = i, d[0, j] = j; ${m}×${n} cella kitöltése soronként`});
    let k = 0;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) { k++;
      const eq = x[i-1] === y[j-1];
      st.push({x, y, d, mode, k, i, j, line: eq ? 2 : 3, msg: eq ? `X[${i}] = Y[${j}] = ${x[i-1]}: d[${i},${j}] = d[${i-1},${j-1}] = ${d[i][j]}`
        : `X[${i}] = ${x[i-1]} ≠ Y[${j}] = ${y[j-1]}: 1 + min(törlés ${d[i-1][j]}, beszúrás ${d[i][j-1]}, helyettesítés ${d[i-1][j-1]}) = ${d[i][j]}`}); }
    st[st.length - 1].msg += `. Kész: d[${m}, ${n}] = ${d[m][n]}`;
    return st;
  }
  let i = m, j = n; const ops = [];
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && d[i][j] === d[i-1][j-1] + (x[i-1] !== y[j-1] ? 1 : 0)) { ops.push([x[i-1] === y[j-1] ? "egyezés" : "helyettesítés", i, j]); i--; j--; }
    else if (i > 0 && d[i][j] === d[i-1][j] + 1) { ops.push(["törlés", i, j]); i--; }
    else { ops.push(["beszúrás", i, j]); j--; }
  }
  ops.reverse();
  const path = [[0, 0]];
  st.push({x, y, d, mode, k: m * n, path: path.slice(), line: 6, msg: `Backtrace (${m}, ${n})-ből visszafelé; az alábbi lépések előre sorrendben: kiinduló szó „${x}”`});
  ops.forEach(([o, a, b]) => { path.push([a, b]);
    const w = y.slice(0, b) + x.slice(a);
    const what = o === "egyezés" ? `${x[a-1]} = ${y[b-1]} (költség 0)` : (o === "helyettesítés" ? `${x[a-1]} → ${y[b-1]}` : (o === "törlés" ? `${x[a-1]} törlése` : `${y[b-1]} beszúrása`));
    st.push({x, y, d, mode, k: m * n, path: path.slice(), line: o === "törlés" || o === "beszúrás" ? 7 : 6, msg: `(${a}, ${b}) ${o}: ${what} → „${w}”`}); });
  st[st.length - 1].msg += `. Távolság d[${m}, ${n}] = ${d[m][n]}`;
  return st;
}
function render(s){
  svg.innerHTML = "";
  const x = s.x, y = s.y, m = x.length, n = y.length, d = s.d;
  const c = Math.min(40, 420 / (n + 2), 280 / (m + 2)), W = (n + 2) * c + 10, H = (m + 2) * c + 40;
  svg.setAttribute("viewBox", `0 0 ${Math.max(W, 320)} ${H}`);
  const ps = (s.path || []).map(p => p[0] + "," + p[1]);
  const done = (i, j) => i === 0 || j === 0 || (i - 1) * n + j <= s.k;
  for (let j = 1; j <= n; j++) el("text", {x: (j + 1.5) * c, y: c * 0.75, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, y[j-1]);
  for (let i = 1; i <= m; i++) el("text", {x: c * 0.5, y: (i + 1.5) * c + 5, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, x[i-1]);
  for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) {
    const X0 = (j + 1) * c, Y0 = (i + 1) * c, cur = s.mode === "fill" && i === s.i && j === s.j, onp = ps.includes(i + "," + j);
    const nb = s.mode === "fill" && s.i !== undefined && ((i === s.i - 1 && j === s.j - 1) || (i === s.i - 1 && j === s.j) || (i === s.i && j === s.j - 1));
    el("rect", {x: X0, y: Y0, width: c, height: c, fill: cur || onp ? css("--cellhl") : (nb ? css("--code") : css("--cell")), stroke: cur || onp ? css("--hl2") : (nb ? css("--hl") : css("--line")), "stroke-width": cur || onp ? 3 : (nb ? 2.5 : 0.6)});
    if (done(i, j)) el("text", {x: X0 + c / 2, y: Y0 + c * 0.65, "text-anchor": "middle", "font-size": Math.min(15, c * 0.45), "font-weight": onp ? "bold" : "normal"}, String(d[i][j]));
    if (nb) el("text", {x: X0 + c * 0.2, y: Y0 + c * 0.3, "text-anchor": "middle", "font-size": 10, fill: css("--hl")}, i === s.i - 1 && j === s.j - 1 ? "↖" : (i === s.i - 1 ? "↑" : "←"));
  }
  el("text", {x: 6, y: H - 12, "font-size": 11.5, fill: css("--muted")}, s.mode === "fill" ? "kék: ↖ helyettesítés/egyezés, ↑ törlés, ← beszúrás forrása · narancs = aktuális" : "narancs = a backtrace útja (0,0)-tól");
}
function load(a, b){
  if (a !== undefined) { document.getElementById("X").value = a; document.getElementById("Y").value = b; }
  const x = document.getElementById("X").value, y = document.getElementById("Y").value, e = document.getElementById("err");
  if (x.length > 12 || y.length > 12 || x.length + y.length === 0) { e.textContent = "X, Y: legfeljebb 12 karakter, nem lehet mindkettő üres."; return; }
  e.textContent = ""; setSteps(steps(x, y, document.getElementById("mode").value));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
