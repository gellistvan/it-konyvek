<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervallumütemezés mohón</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Intervallumok: <input id="inp" size="48" aria-label="Saját intervallumlista" value="(1,4), (3,5), (0,6), (5,7), (3,8), (5,9), (6,10), (8,11), (8,12), (2,13), (12,14)"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tizenegy intervallum idővonalon; a mohó a (1,4), (5,7), (8,11) és (12,14) intervallumot választja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.1.6 pszeudokódja, 1-től indexelt i; félig nyitott intervallumok (s_i ≥ utolsó_befejezés). Kezdőállapot: a 19.1.18 példateszt 11 intervalluma.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [], "last": null, "cur": -1, "line": 2, "msg": "Rendezés befejezési idő szerint kész (n = 11); M = ∅, utolsó_befejezés = −∞"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true], "last": 4, "cur": 0, "line": 6, "msg": "i=1: s=1 ≥ utolsó_befejezés=−∞ → kiválasztva; utolsó_befejezés := 4"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false], "last": 4, "cur": 1, "line": 4, "msg": "i=2: s=3 < utolsó_befejezés=4 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false], "last": 4, "cur": 2, "line": 4, "msg": "i=3: s=0 < utolsó_befejezés=4 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true], "last": 7, "cur": 3, "line": 6, "msg": "i=4: s=5 ≥ utolsó_befejezés=4 → kiválasztva; utolsó_befejezés := 7"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false], "last": 7, "cur": 4, "line": 4, "msg": "i=5: s=3 < utolsó_befejezés=7 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false], "last": 7, "cur": 5, "line": 4, "msg": "i=6: s=5 < utolsó_befejezés=7 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false, false], "last": 7, "cur": 6, "line": 4, "msg": "i=7: s=6 < utolsó_befejezés=7 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false, false, true], "last": 11, "cur": 7, "line": 6, "msg": "i=8: s=8 ≥ utolsó_befejezés=7 → kiválasztva; utolsó_befejezés := 11"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false, false, true, false], "last": 11, "cur": 8, "line": 4, "msg": "i=9: s=8 < utolsó_befejezés=11 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false, false, true, false, false], "last": 11, "cur": 9, "line": 4, "msg": "i=10: s=2 < utolsó_befejezés=11 → elvetve"}, {"a": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 8], [5, 9], [6, 10], [8, 11], [8, 12], [2, 13], [12, 14]], "dec": [true, false, false, true, false, false, false, true, false, false, true], "last": 14, "cur": 10, "line": 6, "msg": "i=11: s=12 ≥ utolsó_befejezés=11 → kiválasztva; utolsó_befejezés := 14. Vége: M = {(1,4), (5,7), (8,11), (12,14)}, |M| = 4"}];
const CODE = ["IntervallumMohó(A):", "    Rendezés befejezési idő (f) szerint", "    M ← üres; utolsó_befejezés ← −∞", "    Ciklus i = 1-től n-ig:", "        Ha s_i ≥ utolsó_befejezés:", "            M ← M ∪ {A[i]}", "            utolsó_befejezés ← f_i", "    Vissza M"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; const a = s.a, n = a.length;
  const H = 40 + (n - 1) * 22 + 84; svg.setAttribute("viewBox", `0 0 560 ${H}`);
  const T = Math.max(1, ...a.map(iv => iv[1])), t0 = Math.min(0, ...a.map(iv => iv[0]));
  const L = 40, R = 420, X = t => L + (R - L) * (t - t0) / (T - t0), Y = r => 40 + r * 22;
  if (s.last !== null) { el("line", {x1: X(s.last), y1: 26, x2: X(s.last), y2: Y(n - 1) + 10, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 4"});
    el("text", {x: X(s.last), y: 20, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "utolsó_befejezés = " + s.last); }
  else el("text", {x: L, y: 20, "font-size": 12, fill: css("--hl")}, "utolsó_befejezés = −∞");
  a.forEach(([b, e], r) => {
    const y = Y(r), done = r < s.dec.length, ok = done && s.dec[r];
    if (r === s.cur) el("rect", {x: 4, y: y - 10, width: 552, height: 20, fill: css("--cellhl")});
    el("text", {x: 30, y: y + 4, "text-anchor": "end", "font-size": 12}, String(r + 1));
    el("line", {x1: X(b), y1: y, x2: X(e), y2: y, stroke: done ? css("--fg") : css("--muted"), "stroke-width": ok ? 6 : (done ? 2 : 1.5),
                "stroke-dasharray": done && !ok ? "6 4" : "none"});
    el("text", {x: X(e) + 6, y: y + 5, "font-size": 13, "font-weight": "bold"}, done ? (ok ? "✓" : "×") : "");
    el("text", {x: 440, y: y + 4, "font-size": 12}, `(${b}, ${e})` + (done ? (ok ? "  kiválasztva" : "  elvetve") : ""));
  });
  const yb = Y(n - 1) + 24; el("line", {x1: L, y1: yb, x2: R, y2: yb, stroke: css("--line")});
  const stp = Math.max(1, Math.ceil((T - t0) / 14));
  for (let t = t0; t <= T; t += stp) el("text", {x: X(t), y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t));
  el("text", {x: 10, y: yb + 36, "font-size": 11, fill: css("--muted")}, "vastag + ✓ = kiválasztott · szaggatott + × = elvetett");
  el("text", {x: 10, y: yb + 52, "font-size": 11, fill: css("--muted")}, "szürke sáv = aktuális i · pontozott függőleges = utolsó_befejezés");
}
function greedy(a){
  a = a.slice().sort((p, q) => p[1] - q[1]); let last = null; const dec = [];
  const st = [{a, dec: [], last: null, cur: -1, line: 2, msg: `Rendezés befejezési idő szerint kész (n = ${a.length}); M = ∅, utolsó_befejezés = −∞`}];
  a.forEach(([s, f], k) => { const i = k + 1, ok = last === null || s >= last, before = last;
    let msg; if (ok) { dec.push(true); last = f; msg = `i=${i}: s=${s} ≥ utolsó_befejezés=${before === null ? "−∞" : before} → kiválasztva; utolsó_befejezés := ${f}`; }
    else { dec.push(false); msg = `i=${i}: s=${s} < utolsó_befejezés=${before} → elvetve`; }
    st.push({a, dec: dec.slice(), last, cur: k, line: ok ? 6 : 4, msg}); });
  const M = a.filter((iv, k) => dec[k]);
  st[st.length - 1].msg += `. Vége: M = {${M.map(iv => "(" + iv[0] + "," + iv[1] + ")").join(", ")}}, |M| = ${M.length}`;
  return st;
}
function load(){
  const txt = document.getElementById("inp").value, err = document.getElementById("err");
  const m = [...txt.matchAll(/\(\s*(-?\d+)\s*,\s*(-?\d+)\s*\)/g)].map(x => [+x[1], +x[2]]);
  if (m.length < 1 || m.length > 16 || m.some(([s, f]) => !(s < f))) { err.textContent = "1–16 intervallumot adjon meg (s, f) alakban, s < f."; return; }
  err.textContent = ""; setSteps(greedy(m));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
