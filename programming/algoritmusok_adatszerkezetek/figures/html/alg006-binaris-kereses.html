<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bináris keresés bal/kozep/jobb mutatókkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Rendezett tömb: <input id="inp" value="2, 4, 7, 9, 12" size="18" aria-label="Rendezett tömb"></label><label>x = <input id="ix" value="9" size="4" aria-label="Keresett érték"></label><label><input id="bug" type="checkbox"> bal &lt; jobb (hibás)</label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('ix').value='8';load()">x = 8</button><button onclick="demo()">Hibás feltétel: [5], x = 5</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Rendezett tömb; a [bal, jobb] keresési intervallum lépésenként szűkül, a kizárt cellák áthúzva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (3.1.9, zárt intervallum). A „nincs találat” jele a fejezet kódja szerint −1. Kezdőállapot: A = [2, 4, 7, 9, 12], x = 9.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"bal": 1, "jobb": 5, "kozep": null, "res": null, "line": 1, "kind": "init", "msg": "Kezdet: bal = 1, jobb = 5; invariáns: x ∈ A ⇒ x ∈ A[bal..jobb]"}, {"bal": 1, "jobb": 5, "kozep": 3, "res": null, "line": 5, "kind": "step", "msg": "bal = 1, jobb = 5, kozep = 3, A[kozep] = 7 < 9 → bal = 4; invariáns: x ∈ A ⇒ x ∈ A[bal..jobb]"}, {"bal": 4, "jobb": 5, "kozep": 4, "res": 4, "line": 4, "kind": "found", "msg": "bal = 4, jobb = 5, kozep = 4, A[kozep] = 9: A[kozep] = x → return 4 (találat)"}];
const CODE = ["bal = 1", "jobb = n", "while bal <= jobb:", "    kozep = (bal + jobb) / 2", "    if A[kozep] == x: return kozep", "    elif A[kozep] < x: bal = kozep + 1", "    else: jobb = kozep - 1", "return -1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 560 240");
  const a = CUR, n = a.length, w = Math.min(60, 520 / n), x0 = (560 - n * w) / 2, y0 = 80;
  a.forEach((v, j) => {
    const p = j + 1, out = !(s.bal <= p && p <= s.jobb), hit = s.kind === "found" && p === s.kozep;
    el("rect", {x: x0 + j*w, y: y0, width: w, height: w, fill: out ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": hit ? 4 : 1.2});
    if (out) el("line", {x1: x0 + j*w, y1: y0 + w, x2: x0 + j*w + w, y2: y0, stroke: css("--muted"), "stroke-width": 1});
    el("text", {x: x0 + j*w + w/2, y: y0 + w/2 + 6, "text-anchor": "middle", "font-size": 18, "font-weight": out ? "normal" : "bold", opacity: out ? 0.5 : 1}, String(v).replace("-", "−"));
    el("text", {x: x0 + j*w + w/2, y: y0 - 8, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(p));
    const m = []; if (p === s.bal) m.push("B"); if (p === s.kozep) m.push("K"); if (p === s.jobb) m.push("J");
    if (m.length) el("text", {x: x0 + j*w + w/2, y: y0 + w + 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, m.join(","));
  });
  if (s.kozep) { const cx = x0 + (s.kozep - 0.5) * w; el("path", {d: `M${cx-8},${y0-40} L${cx+8},${y0-40} L${cx},${y0-26} Z`, fill: css("--line")}); }
  if (s.bal <= s.jobb) {
    const a1 = x0 + (s.bal - 1) * w + 3, a2 = x0 + s.jobb * w - 3, yb = y0 + w + 34;
    el("path", {d: `M${a1},${yb-8} L${a1},${yb} L${a2},${yb} L${a2},${yb-8}`, fill: "none", stroke: css("--line"), "stroke-width": 2.5});
  } else el("text", {x: 280, y: y0 + w + 46, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "üres intervallum: bal = " + s.bal + " > jobb = " + s.jobb);
  el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"},
     "x = " + String(XV).replace("-", "−") + (s.res === null || s.res === undefined ? "" : (s.res === -1 ? " → −1 (nincs találat)" : " → " + s.res)));
  el("text", {x: 280, y: 232, "text-anchor": "middle", "font-size": 12, fill: css("--muted")},
     "B, K, J = bal, kozep, jobb · ▼ = kozep · zárójel = [bal, jobb] · áthúzott = kizárt cella");
}
let CUR = [2, 4, 7, 9, 12], XV = 9;
const INV = "invariáns: x ∈ A ⇒ x ∈ A[bal..jobb]";
function trace(a, x, buggy){
  const n = a.length; let bal = 1, jobb = n;
  const st = [{bal, jobb, kozep: null, res: null, line: 1, kind: "init", msg: `Kezdet: bal = 1, jobb = ${n}; ${INV}`}];
  while (buggy ? bal < jobb : bal <= jobb) {
    const kozep = Math.floor((bal + jobb) / 2), v = a[kozep-1];
    const base = `bal = ${bal}, jobb = ${jobb}, kozep = ${kozep}, A[kozep] = ${v}`;
    if (v === x) { st.push({bal, jobb, kozep, res: kozep, line: 4, kind: "found", msg: `${base}: A[kozep] = x → return ${kozep} (találat)`}); return st; }
    if (v < x) { st.push({bal, jobb, kozep, res: null, line: 5, kind: "step", msg: `${base} < ${x} → bal = ${kozep+1}; ${INV}`}); bal = kozep + 1; }
    else { st.push({bal, jobb, kozep, res: null, line: 6, kind: "step", msg: `${base} > ${x} → jobb = ${kozep-1}; ${INV}`}); jobb = kozep - 1; }
  }
  const rel = bal > jobb ? ">" : (bal === jobb ? "=" : "<"), cond = buggy ? "bal < jobb" : "bal <= jobb";
  st.push({bal, jobb, kozep: null, res: -1, line: 7, kind: "empty",
           msg: `bal = ${bal} ${rel} jobb = ${jobb}: a ${cond} feltétel hamis → return −1 (nincs találat)` + (buggy && a.includes(x) ? "  HIBÁS: x jelen van, de az egyelemű intervallumot nem vizsgáltuk" : "")});
  return st;
}
function load(){
  const e = document.getElementById("err");
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(t => t !== "").map(Number);
  const x = Number(document.getElementById("ix").value);
  if (raw.length < 1 || raw.length > 12 || raw.some(v => !Number.isInteger(v)) || !Number.isInteger(x)) { e.textContent = "1–12 egész számot és egész x-et adjon meg."; return; }
  if (raw.some((v, i) => i > 0 && raw[i-1] > v)) { e.textContent = "A tömb legyen növekvő sorrendben rendezett (előfeltétel)."; return; }
  e.textContent = ""; CUR = raw; XV = x; setSteps(trace(raw, x, document.getElementById("bug").checked));
}
function demo(){ document.getElementById("inp").value = "5"; document.getElementById("ix").value = "5"; document.getElementById("bug").checked = true; load(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
