<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill climbing a 8 bites függvényen</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>döntetlenszabály: <select id="rule" onchange="rerun()" aria-label="Döntetlenszabály"><option value="jobb">jobb blokk először</option><option value="bal">legkisebb index</option><option value="rnd">véletlen (seed)</option></select></label><label>seed <input id="seed" type="number" value="0" min="0" style="width:5em" onchange="rerun()" aria-label="Seed"></label><label><input id="edit" type="checkbox"> Kezdővektor mód (kattintás a felső sor bitjeire)</label><button onclick="START=[0,0,0,0,0,0,0,0];rerun()">00000000</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolcbites vektor lépésenként, alatta a nyolc szomszéd értéke; a döntetlenszabály dönti el, hogy a 7-es lokális vagy a 8-as globális csúcs a vége."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">f(x) = Σ x_i + 3·Π(1 − x_i, i = 1..4)·Π(x_i, i = 5..8); steepest ascent, csak szigorú javítás. Kezdőállapot: 00000000, „jobb blokk először” szabály (a könyv első útja).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"x": [0, 0, 0, 0, 0, 0, 0, 0], "f": 0, "nb": [1, 1, 1, 1, 1, 1, 1, 1], "flip": null, "nxt": 4, "msg": "Kezdet: x = 00000000, f = 0; a szomszédok értéke: 1, 1, 1, 1, 1, 1, 1, 1", "line": 1}, {"x": [0, 0, 0, 0, 1, 0, 0, 0], "f": 1, "nb": [2, 2, 2, 2, 0, 2, 2, 2], "flip": 4, "nxt": 5, "msg": "1. lépés (jobb blokk először): a(z) 5. bit átbillentve → x = 00001000, f = 1", "line": 5}, {"x": [0, 0, 0, 0, 1, 1, 0, 0], "f": 2, "nb": [3, 3, 3, 3, 1, 1, 3, 3], "flip": 5, "nxt": 6, "msg": "2. lépés (jobb blokk először): a(z) 6. bit átbillentve → x = 00001100, f = 2", "line": 5}, {"x": [0, 0, 0, 0, 1, 1, 1, 0], "f": 3, "nb": [4, 4, 4, 4, 2, 2, 2, 7], "flip": 6, "nxt": 7, "msg": "3. lépés (jobb blokk először): a(z) 7. bit átbillentve → x = 00001110, f = 3", "line": 5}, {"x": [0, 0, 0, 0, 1, 1, 1, 1], "f": 7, "nb": [5, 5, 5, 5, 3, 3, 3, 3], "flip": 7, "nxt": null, "msg": "x = 00001111, f = 7, nincs javító szomszéd (lokális maximum)", "line": 4}];
const CODE = ["HillClimbing(x0):", "  x ← x0; x_best ← x", "  while k < max_iter:", "    V ← { y ∈ N(x) : f(y) > f(x_best) }", "    if V = ∅: return x_best", "    válassz y ∈ V, f(y) maximális (döntetlenszabály)", "    x ← y; x_best ← x; k ← k + 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const fx = x => x.reduce((a, b) => a + b, 0) + 3 * (x.slice(0, 4).every(b => !b) && x.slice(4).every(b => b) ? 1 : 0);
const nbs = x => x.map((_, k) => x.map((b, j) => j === k ? 1 - b : b));
const RT = {jobb: "jobb blokk először", bal: "legkisebb index", rnd: "véletlen"};
function mulberry32(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let START = [0,0,0,0,0,0,0,0];
function climb(x0, rule, seed){
  const r = mulberry32(seed); let x = x0.slice(); const path = [{x: x.slice(), f: fx(x), flip: null, nb: nbs(x).map(fx)}];
  for (let it = 0; it < 50; it++) {
    const nb = nbs(x).map(fx), V = [...Array(8).keys()].filter(k => nb[k] > fx(x));
    if (!V.length) break;
    const best = Math.max(...V.map(k => nb[k])), ties = V.filter(k => nb[k] === best);
    let k; if (rule === "jobb") { const rt = ties.filter(k => k >= 4); k = rt.length ? Math.min(...rt) : Math.min(...ties); }
    else if (rule === "bal") k = Math.min(...ties); else k = ties[Math.floor(r() * ties.length)];
    x[k] = 1 - x[k]; path.push({x: x.slice(), f: fx(x), flip: k, nb: nbs(x).map(fx)});
  }
  return path.map((p, i) => { const last = i === path.length - 1, s = p.x.join("");
    let msg = i === 0 ? `Kezdet: x = ${s}, f = ${p.f}; a szomszédok értéke: ${p.nb.join(", ")}` : `${i}. lépés (${RT[rule]}): a(z) ${p.flip + 1}. bit átbillentve → x = ${s}, f = ${p.f}`, line = i === 0 ? 1 : 5;
    if (last) { msg = `x = ${s}, f = ${p.f}, nincs javító szomszéd` + (p.f < 8 ? " (lokális maximum)" : " (globális maximum)"); line = 4; }
    return {x: p.x, f: p.f, nb: p.nb, flip: p.flip, nxt: last ? null : path[i + 1].flip, msg, line}; });
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const W = 44, X0 = 70;
  el("text", {x: 20, y: 30, "font-size": 13}, "x =");
  s.x.forEach((b, k) => {
    const r = el("rect", {x: X0 + k * W, y: 10, width: W, height: W, fill: b ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": k === s.flip ? 4 : 1.2});
    el("text", {x: X0 + k * W + W / 2, y: 38, "text-anchor": "middle", "font-size": 18}, String(b));
    el("text", {x: X0 + k * W + W / 2, y: 68, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(k + 1));
  });
  el("text", {x: X0 + 8 * W + 12, y: 38, "font-size": 15, "font-weight": "bold"}, `f = ${s.f}`);
  el("text", {x: 20, y: 100, "font-size": 12}, "a nyolc szomszéd (k. bit átbillentve) értéke; a kiválasztott kiemelve:");
  s.nb.forEach((v, k) => {
    const on = k === s.nxt, imp = v > s.f;
    el("rect", {x: X0 + k * W, y: 112, width: W, height: 34, fill: on ? css("--hl") : css("--bg"), stroke: css("--line"), "stroke-width": imp ? 2 : 1, "stroke-dasharray": imp ? "" : "3 3"});
    el("text", {x: X0 + k * W + W / 2, y: 135, "text-anchor": "middle", "font-size": 15, fill: on ? css("--bg") : css("--fg")}, String(v));
    el("text", {x: X0 + k * W + W / 2, y: 162, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, `${k + 1}. bit`);
  });
  el("text", {x: 20, y: 200, "font-size": 12, fill: css("--muted")}, "folytonos keret = javító szomszéd (f(y) > f(x)), szaggatott = nem javító;");
  el("text", {x: 20, y: 218, "font-size": 12, fill: css("--muted")}, "a felső sorban a cellára kattintva saját kezdővektor adható meg (Kezdővektor mód).");
}
function rerun(){ setSteps(climb(START, document.getElementById("rule").value, +document.getElementById("seed").value || 0)); }
svg.addEventListener("click", e => {
  if (!document.getElementById("edit").checked) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) * 560 / r.width, vy = (e.clientY - r.top) * 300 / r.height;
  const k = Math.floor((vx - 70) / 44); if (vy > 60 || k < 0 || k > 7) return;
  START[k] = 1 - START[k]; rerun();
});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
