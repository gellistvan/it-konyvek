<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFS és DFS lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bejárás: <select id="mode" onchange="load()" aria-label="Bejárás"><option>BFS</option><option>DFS</option></select></label><label>Kezdőcsúcs: <select id="start" onchange="load()" aria-label="Kezdőcsúcs"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="BFS és DFS az 1-es csúcsból a hatcsúcsú gráfon; a BFS sorrendje 1, 2, 3, 4, 5, 6, a DFS sorrendje 1, 2, 4, 6, 5, 3."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 10.3 BFS és DFS-VISIT pszeudokódja, rendezett szomszédsági listákkal (2.2 és 3.2 példa). A DFS más kezdőcsúccsal a maradék fehér csúcsokból indított további fákat is bejárja. Kezdőállapot: BFS az 1-es csúcsból.</p>

[[1, 2], [1, 3]], "line": 3, "msg": "2. lépés: u = DEQUEUE(Q) = 2, Q = [3]"}, {"mode": "BFS", "col": {"1": 2, "2": 1, "3": 1, "4": 1, "5": 0, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": null, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": null, "6": null}, "f": {}, "Q": [3, 4], "cur": 2, "edge": [2, 4], "tree": [[1, 2], [1, 3], [2, 4]], "line": 5, "msg": "2. lépés: 4 fehér → szürke, d[4] = 2, π[4] = 2, Q = [3, 4]"}, {"mode": "BFS", "col": {"1": 2, "2": 1, "3": 1, "4": 1, "5": 1, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "f": {}, "Q": [3, 4, 5], "cur": 2, "edge": [2, 5], "tree": [[1, 2], [1, 3], [2, 4], [2, 5]], "line": 5, "msg": "2. lépés: 5 fehér → szürke, d[5] = 2, π[5] = 2, Q = [3, 4, 5]"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 1, "4": 1, "5": 1, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "f": {}, "Q": [3, 4, 5], "cur": 2, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5]], "line": 6, "msg": "2. lépés vége: 2 fekete, Q = [3, 4, 5]", "key": 2}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 1, "4": 1, "5": 1, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "f": {}, "Q": [4, 5], "cur": 3, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5]], "line": 3, "msg": "3. lépés: u = DEQUEUE(Q) = 3, Q = [4, 5]"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 1, "5": 1, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "f": {}, "Q": [4, 5], "cur": 3, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5]], "line": 6, "msg": "3. lépés vége: 3 fekete (nincs új fehér szomszéd), Q = [4, 5]", "key": 3}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 1, "5": 1, "6": 0}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": null}, "f": {}, "Q": [5], "cur": 4, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5]], "line": 3, "msg": "4. lépés: u = DEQUEUE(Q) = 4, Q = [5]"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 1, "5": 1, "6": 1}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [5, 6], "cur": 4, "edge": [4, 6], "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 5, "msg": "4. lépés: 6 fehér → szürke, d[6] = 3, π[6] = 4, Q = [5, 6]"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 2, "5": 1, "6": 1}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [5, 6], "cur": 4, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 6, "msg": "4. lépés vége: 4 fekete, Q = [5, 6]", "key": 4}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 2, "5": 1, "6": 1}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [6], "cur": 5, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 3, "msg": "5. lépés: u = DEQUEUE(Q) = 5, Q = [6]"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 2, "5": 2, "6": 1}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [6], "cur": 5, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 6, "msg": "5. lépés vége: 5 fekete (nincs új fehér szomszéd), Q = [6]", "key": 5}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 2, "5": 2, "6": 1}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [], "cur": 6, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 3, "msg": "6. lépés: u = DEQUEUE(Q) = 6, Q = []"}, {"mode": "BFS", "col": {"1": 2, "2": 2, "3": 2, "4": 2, "5": 2, "6": 2}, "d": {"1": 0, "2": 1, "3": 1, "4": 2, "5": 2, "6": 3}, "pi": {"1": null, "2": 1, "3": 1, "4": 2, "5": 2, "6": 4}, "f": {}, "Q": [], "cur": 6, "edge": null, "tree": [[1, 2], [1, 3], [2, 4], [2, 5], [4, 6]], "line": 6, "msg": "6. lépés vége: 6 fekete (nincs új fehér szomszéd), Q = []", "key": 6}];
const CODE = ["BFS(G, s)", " 5-9  s.color = GRAY; s.d = 0; ENQUEUE(Q, s)", "10  while Q ≠ ∅", "11      u = DEQUEUE(Q)", "12      for each v ∈ G.Adj[u]", "13-17       if v.color == WHITE: GRAY, v.d = u.d + 1, v.π = u, ENQUEUE", "18      u.color = BLACK", "DFS-VISIT(G, u)", " 1-3  time = time + 1; u.d = time; u.color = GRAY", " 4  for each v ∈ G.Adj[u]", " 5-7      if v.color == WHITE: v.π = u; DFS-VISIT(G, v)", " 8-10 u.color = BLACK; time = time + 1; u.f = time"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ADJ = {1: [2, 3], 2: [1, 4, 5], 3: [1, 5], 4: [2, 6], 5: [2, 3, 6], 6: [4, 5]};
const POS = {1: [200, 40], 2: [120, 110], 3: [280, 110], 4: [80, 180], 5: [210, 180], 6: [145, 250]};
const EDGES = [[1,2],[1,3],[2,4],[2,5],[3,5],[4,6],[5,6]];
function bfs(s){
  const col = {}, d = {}, pi = {}; for (const v in ADJ) { col[v] = 0; d[v] = null; pi[v] = null; }
  col[s] = 1; d[s] = 0; const Q = [s], tree = [], st = []; let k = 0;
  const snap = (line, msg, cur, edge) => st.push({mode: "BFS", col: {...col}, d: {...d}, pi: {...pi}, f: {}, Q: Q.slice(), cur: cur || null, edge: edge || null, tree: tree.slice(), line, msg});
  snap(1, `Inicializálás: s = ${s} szürke, d[${s}] = 0, Q = [${s}]`);
  while (Q.length) { const u = Q.shift(); k++; snap(3, `${k}. lépés: u = DEQUEUE(Q) = ${u}, Q = [${Q.join(", ")}]`, u); let nw = 0;
    for (const v of ADJ[u]) if (col[v] === 0) { col[v] = 1; d[v] = d[u] + 1; pi[v] = u; Q.push(v); tree.push([u, v]); nw++;
      snap(5, `${k}. lépés: ${v} fehér → szürke, d[${v}] = ${d[v]}, π[${v}] = ${u}, Q = [${Q.join(", ")}]`, u, [u, v]); }
    col[u] = 2; snap(6, `${k}. lépés vége: ${u} fekete${nw ? "" : " (nincs új fehér szomszéd)"}, Q = [${Q.join(", ")}]`, u); }
  return st;
}
function dfs(s){
  const col = {}, d = {}, f = {}, pi = {}; for (const v in ADJ) { col[v] = 0; pi[v] = null; }
  const tree = [], stack = [], st = []; let time = 0;
  const snap = (line, msg, cur, edge) => st.push({mode: "DFS", col: {...col}, d: {...d}, pi: {...pi}, f: {...f}, Q: stack.slice(), cur: cur || null, edge: edge || null, tree: tree.slice(), line, msg, time});
  const visit = u => { time++; d[u] = time; col[u] = 1; stack.push(u);
    snap(8, `DFS-VISIT(${u}): time = ${time}, d[${u}] = ${d[u]}, szürke; verem = [${stack.join(", ")}]`, u, pi[u] ? [pi[u], u] : null);
    for (const v of ADJ[u]) if (col[v] === 0) { pi[v] = u; tree.push([u, v]); visit(v); }
    col[u] = 2; time++; f[u] = time; stack.pop(); snap(11, `${u} fekete: time = ${time}, f[${u}] = ${f[u]}; verem = [${stack.join(", ")}]`, u); };
  snap(-1, `Kezdés: minden csúcs fehér, time = 0; DFS-VISIT(${s})`);
  for (const u of [s].concat(Object.keys(ADJ).map(Number).filter(v => v !== s))) if (col[u] === 0) visit(u);
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 360");
  el("defs", {}).innerHTML = `<pattern id="gp" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${css("--fg")}" stroke-width="1.6"/></pattern>`;
  const tr = new Set(s.tree.map(([a, b]) => Math.min(a, b) + "-" + Math.max(a, b)));
  for (const [a, b] of EDGES) { const t = tr.has(a + "-" + b), ed = s.edge && ((s.edge[0] === a && s.edge[1] === b) || (s.edge[0] === b && s.edge[1] === a));
    const done = s.col[a] && s.col[b];
    el("line", {x1: POS[a][0], y1: POS[a][1], x2: POS[b][0], y2: POS[b][1], stroke: ed ? css("--hl2") : css("--line"), "stroke-width": t ? 5 : 1.4, "stroke-dasharray": !t && done ? "6 4" : "none"}); }
  for (const v in POS) { const [x, y] = POS[v], c = s.col[v];
    el("circle", {cx: x, cy: y, r: 17, fill: c === 2 ? css("--fg") : c === 1 ? "url(#gp)" : css("--cell"), stroke: +v === s.cur ? css("--hl") : css("--line"), "stroke-width": +v === s.cur ? 4 : 1.4});
    if (c === 1) el("circle", {cx: x, cy: y, r: 9, fill: css("--cell"), stroke: "none"});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 14, fill: c === 2 ? css("--bg") : css("--fg")}, v);
    const lab = s.mode === "BFS" ? (s.d[v] === null ? "" : "d=" + s.d[v]) : (s.d[v] === undefined ? "" : `${s.d[v]}/${s.f[v] === undefined ? "–" : s.f[v]}`);
    el("text", {x: x + 21, y: y - 12, "font-size": 12}, lab); }
  el("text", {x: 10, y: 300, "font-size": 13, "font-weight": "bold"}, (s.mode === "BFS" ? "Q (sor) = [" : "rekurziós verem = [") + s.Q.join(", ") + "]");
  // táblázat
  const tx = 370; (s.mode === "BFS" ? ["u", "d", "π"] : ["u", "d", "f", "π"]).forEach((h, j) => el("text", {x: tx + j * 36, y: 22, "font-size": 12, "font-weight": "bold"}, h));
  for (let v = 1; v <= 6; v++) { const y = 22 + v * 20, cells = s.mode === "BFS" ? [v, s.d[v] === null ? "∞" : s.d[v], s.pi[v] || "NIL"]
      : [v, s.d[v] === undefined ? "–" : s.d[v], s.f[v] === undefined ? "–" : s.f[v], s.pi[v] || "NIL"];
    cells.forEach((c, j) => el("text", {x: tx + j * 36, y, "font-size": 12, "font-weight": j === 0 ? "bold" : "normal"}, String(c))); }
  if (s.mode === "DFS") { // zárójelezés
    const order = Object.keys(s.d).sort((a, b) => s.d[a] - s.d[b]), X = t => 330 + t * 17;
    el("text", {x: 330, y: 182, "font-size": 11, fill: css("--muted")}, "zárójelezés: [d, f]");
    order.forEach((v, j) => { const y = 192 + j * 14, f = s.f[v] === undefined ? s.time + 0.5 : s.f[v];
      el("rect", {x: X(s.d[v]) - 4, y, width: (f - s.d[v]) * 17 + 8, height: 10, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": s.f[v] === undefined ? "3 2" : "none"});
      el("text", {x: X(s.d[v]) - 7, y: y + 9, "text-anchor": "end", "font-size": 10}, v); });
    for (let t = 1; t <= 12; t++) el("text", {x: X(t), y: 292, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, t);
  }
  el("text", {x: 10, y: 350, "font-size": 11, fill: css("--muted")}, "üres = fehér · vonalkázott = szürke · teli = fekete · vastag = faél · szaggatott = nem faél · narancs = aktuális él");
}
function load(){ const s = +document.getElementById("start").value, m = document.getElementById("mode").value; setSteps(m === "BFS" ? bfs(s) : dfs(s)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
