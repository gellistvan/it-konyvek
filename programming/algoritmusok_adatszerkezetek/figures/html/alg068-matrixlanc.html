<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mátrixlánc-DP lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>p = <input id="pv" value="5, 4, 6, 2, 7" size="20" aria-label="Dimenzióvektor"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('pv').value='10, 30, 5, 60';load()">6.2 3. teszt</button><button onclick="document.getElementById('pv').value='5, 10, 3, 12, 5, 50, 6';load()">6.2 5. teszt</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az m- és s-tábla átlónkénti kitöltése a [5, 4, 6, 2, 7] dimenzióvektorra; a végén a zárójelezés rekonstrukciója."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú indexek, költség = skaláris szorzások száma. Kezdőállapot: p = [5, 4, 6, 2, 7] (a 6.2 4. tesztje, várt 158); a végén m[1, 4] = 158, s[1, 4] = 3, ((A1 · (A2 · A3)) · A4).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----

let STEPS = [{"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0}, "s": {}, "cur": null, "k": null, "cands": [], "L": 1, "line": 0, "msg": "n = 4: m[i, i] = 0 minden i-re"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120}, "s": {"1,2": 1}, "cur": [1, 2], "k": 1, "cands": [[1, 120]], "L": 2, "line": 6, "msg": "L = 2, (i, j) = (1, 2), k = 1: m[1,1] + m[2,2] + 5·4·6 = 0 + 0 + 120 = 120 → új minimum, s[1,2] = 1"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48}, "s": {"1,2": 1, "2,3": 2}, "cur": [2, 3], "k": 2, "cands": [[2, 48]], "L": 2, "line": 6, "msg": "L = 2, (i, j) = (2, 3), k = 2: m[2,2] + m[3,3] + 4·6·2 = 0 + 0 + 48 = 48 → új minimum, s[2,3] = 2"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84}, "s": {"1,2": 1, "2,3": 2, "3,4": 3}, "cur": [3, 4], "k": 3, "cands": [[3, 84]], "L": 2, "line": 6, "msg": "L = 2, (i, j) = (3, 4), k = 3: m[3,3] + m[4,4] + 6·2·7 = 0 + 0 + 84 = 84 → új minimum, s[3,4] = 3"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1}, "cur": [1, 3], "k": 1, "cands": [[1, 88]], "L": 3, "line": 6, "msg": "L = 3, (i, j) = (1, 3), k = 1: m[1,1] + m[2,3] + 5·4·2 = 0 + 48 + 40 = 88 → új minimum, s[1,3] = 1"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1}, "cur": [1, 3], "k": 2, "cands": [[1, 88], [2, 180]], "L": 3, "line": 5, "msg": "L = 3, (i, j) = (1, 3), k = 2: m[1,2] + m[3,3] + 5·6·2 = 120 + 0 + 60 = 180 ≥ 88, marad"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 252}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 2}, "cur": [2, 4], "k": 2, "cands": [[2, 252]], "L": 3, "line": 6, "msg": "L = 3, (i, j) = (2, 4), k = 2: m[2,2] + m[3,4] + 4·6·7 = 0 + 84 + 168 = 252 → új minimum, s[2,4] = 2"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3}, "cur": [2, 4], "k": 3, "cands": [[2, 252], [3, 104]], "L": 3, "line": 6, "msg": "L = 3, (i, j) = (2, 4), k = 3: m[2,3] + m[4,4] + 4·2·7 = 48 + 0 + 56 = 104 → új minimum, s[2,4] = 3"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 244}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 1}, "cur": [1, 4], "k": 1, "cands": [[1, 244]], "L": 4, "line": 6, "msg": "L = 4, (i, j) = (1, 4), k = 1: m[1,1] + m[2,4] + 5·4·7 = 0 + 104 + 140 = 244 → új minimum, s[1,4] = 1"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 244}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 1}, "cur": [1, 4], "k": 2, "cands": [[1, 244], [2, 414]], "L": 4, "line": 5, "msg": "L = 4, (i, j) = (1, 4), k = 2: m[1,2] + m[3,4] + 5·6·7 = 120 + 84 + 210 = 414 ≥ 244, marad"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "cur": [1, 4], "k": 3, "cands": [[1, 244], [2, 414], [3, 158]], "L": 4, "line": 6, "msg": "L = 4, (i, j) = (1, 4), k = 3: m[1,3] + m[4,4] + 5·2·7 = 88 + 0 + 70 = 158 → új minimum, s[1,4] = 3"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [1, 4], "line": 9, "msg": "Zárójelezés(1, 4): k = s[1,4] = 3 → (1..3) · (4..4)"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [1, 3], "line": 9, "msg": "Zárójelezés(1, 3): k = s[1,3] = 1 → (1..1) · (2..3)"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [1, 1], "line": 8, "msg": "Zárójelezés(1, 1): A1"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [2, 3], "line": 9, "msg": "Zárójelezés(2, 3): k = s[2,3] = 2 → (2..2) · (3..3)"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [2, 2], "line": 8, "msg": "Zárójelezés(2, 2): A2"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [3, 3], "line": 8, "msg": "Zárójelezés(3, 3): A3"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "rec": [4, 4], "line": 8, "msg": "Zárójelezés(4, 4): A4"}, {"n": 4, "p": [5, 4, 6, 2, 7], "m": {"1,1": 0, "2,2": 0, "3,3": 0, "4,4": 0, "1,2": 120, "2,3": 48, "3,4": 84, "1,3": 88, "2,4": 104, "1,4": 158}, "s": {"1,2": 1, "2,3": 2, "3,4": 3, "1,3": 1, "2,4": 3, "1,4": 3}, "tree": "((A1 · (A2 · A3)) · A4)   (m[1, 4] = 158)", "line": -1, "msg": "Optimális zárójelezés: ((A1 · (A2 · A3)) · A4), költség 158"}];
const CODE = ["for i = 1 to n: m[i, i] := 0", "for L = 2 to n:", "  for i = 1 to n − L + 1:", "    j := i + L − 1; m[i, j] := ∞", "    for k = i to j − 1:", "      költség := m[i,k] + m[k+1,j] + p[i−1]·p[k]·p[j]", "      if költség < m[i, j]: m[i, j] := költség; s[i, j] := k", "OptimalisZarojelezes(s, i, j):", "  if i == j: return \"A\" + i", "  k := s[i, j]; return \"(\" + bal(i..k) + \" · \" + jobb(k+1..j) + \")\""];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 330");
  const n = s.n, c = Math.min(52, 250 / n), h = Math.min(30, 180 / n), x0 = 40, y0 = 40;
  const key = (i, j) => i + "," + j;
  el("text", {x: x0, y: 20, "font-size": 13, "font-weight": "bold"}, "m[i, j]");
  el("text", {x: x0 + n * c + 40, y: 20, "font-size": 13, "font-weight": "bold"}, "s[i, j]");
  const used = s.cur && s.k ? [key(s.cur[0], s.k), key(s.k + 1, s.cur[1])] : [];
  for (let t = 0; t < 2; t++) {
    const X0 = x0 + t * (n * c + 40), V = t === 0 ? s.m : s.s;
    for (let i = 1; i <= n; i++) for (let j = i + t; j <= n; j++) {
      const K = key(i, j), cur = s.cur && s.cur[0] === i && s.cur[1] === j, u = t === 0 && used.includes(K), onr = s.rec && s.rec[0] === i && s.rec[1] === j;
      el("rect", {x: X0 + (j - 1) * c, y: y0 + (i - 1) * h, width: c, height: h, fill: cur || onr ? css("--cellhl") : (u ? css("--code") : css("--cell")),
                  stroke: cur || onr ? css("--hl2") : (u ? css("--hl") : css("--line")), "stroke-width": cur || u || onr ? 3 : 0.8});
      if (V[K] !== undefined) el("text", {x: X0 + (j - 0.5) * c, y: y0 + (i - 0.5) * h + 5, "text-anchor": "middle", "font-size": Math.min(13, h * 0.5)}, String(V[K]));
    }
    for (let j = 1; j <= n; j++) el("text", {x: X0 + (j - 0.5) * c, y: y0 - 4, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "j=" + j);
  }
  for (let i = 1; i <= n; i++) el("text", {x: x0 - 4, y: y0 + (i - 0.5) * h + 4, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "i=" + i);
  let y = y0 + n * h + 28;
  if (s.cands && s.cands.length) {
    const best = Math.min(...s.cands.map(q => q[1]));
    el("text", {x: x0, y, "font-size": 12.5, "font-weight": "bold"}, `jelöltek m[${s.cur[0]}, ${s.cur[1]}]-re (L = ${s.L}):`);
    s.cands.forEach((q, r) => el("text", {x: x0 + 10, y: y + 18 + r * 17, "font-size": 12.5, "font-weight": q[1] === best ? "bold" : "normal"}, `k = ${q[0]}: ${q[1]}` + (q[1] === best ? "  ← eddigi minimum" : "")));
  }
  if (s.tree) el("text", {x: x0, y, "font-size": 15, "font-weight": "bold"}, s.tree);
  el("text", {x: x0, y: 320, "font-size": 11, fill: css("--muted")}, "narancs = aktuális (i, j) · kék = a felhasznált m[i, k] és m[k+1, j] · p = [" + s.p.join(", ") + "]");
}
function chain(p){
  const n = p.length - 1, m = {}, s = {}, st = [];
  for (let i = 1; i <= n; i++) m[i + "," + i] = 0;
  st.push({n, p, m: Object.assign({}, m), s: {}, cur: null, k: null, cands: [], L: 1, line: 0, msg: `n = ${n}: m[i, i] = 0 minden i-re`});
  for (let L = 2; L <= n; L++) for (let i = 1; i <= n - L + 1; i++) {
    const j = i + L - 1; let best = null; const cands = [];
    for (let k = i; k < j; k++) {
      const a = m[i + "," + k], b = m[(k + 1) + "," + j], pp = p[i - 1] * p[k] * p[j], cost = a + b + pp; cands.push([k, cost]);
      const upd = best === null || cost < best; if (upd) { best = cost; s[i + "," + j] = k; } m[i + "," + j] = best;
      st.push({n, p, m: Object.assign({}, m), s: Object.assign({}, s), cur: [i, j], k, cands: cands.slice(), L, line: upd ? 6 : 5,
               msg: `L = ${L}, (i, j) = (${i}, ${j}), k = ${k}: ${a} + ${b} + ${p[i-1]}·${p[k]}·${p[j]} = ${cost}` + (upd ? ` → új minimum, s[${i},${j}] = ${k}` : ` ≥ ${best}, marad`)});
    }
  }
  const M = Object.assign({}, m), S = Object.assign({}, s);
  function par(i, j){
    if (i === j) { st.push({n, p, m: M, s: S, rec: [i, j], line: 8, msg: `Zárójelezés(${i}, ${j}): A${i}`}); return "A" + i; }
    const k = S[i + "," + j];
    st.push({n, p, m: M, s: S, rec: [i, j], line: 9, msg: `Zárójelezés(${i}, ${j}): k = s[${i},${j}] = ${k} → (${i}..${k}) · (${k+1}..${j})`});
    return "(" + par(i, k) + " · " + par(k + 1, j) + ")";
  }
  if (n >= 1) { const t = par(1, n); st.push({n, p, m: M, s: S, tree: t + `   (m[1, ${n}] = ${M["1," + n]})`, line: -1, msg: `Optimális zárójelezés: ${t}, költség ${M["1," + n]}`}); }
  return st;
}
function load(){
  const p = document.getElementById("pv").value.split(/[ ,;]+/).filter(v => v !== "").map(Number), e = document.getElementById("err");
  if (p.length < 2 || p.length > 9 || p.some(v => !Number.isInteger(v) || v < 1 || v > 99)) { e.textContent = "2–9 pozitív egész (n ≤ 8 mátrix)."; return; }
  e.textContent = ""; setSteps(chain(p));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
