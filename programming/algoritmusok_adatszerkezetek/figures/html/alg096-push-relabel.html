<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Push-relabel lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><label>Feldolgozási sorrend: <select id="ord" onchange="load()" aria-label="Feldolgozási sorrend"><option value="a">a, b</option><option value="b">b, a</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A push-relabel tíz művelete a négycsúcsú példán: a csúcsok a magasságuknak megfelelő szinten, a túlcsordulás oszlopként; a végén e(t) = 15, h(a) = h(b) = 5, a felesleg visszafolyik s-be."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 25.3.17 (2.8) példája. Az aktív csúcsokat sorban, teljes kisütéssel dolgozzuk fel; a szomszédok sorrendje a: t, b, s és b: t, a, s. A „b, a” sorrend más műveletsort ad, a végeredmény ugyanúgy 15.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = ["PushRelabelMaxFlow(G, s, t):", "  h[s] ← |V|; telítjük az (s,v) éleket", "  while létezik aktív u:", "    ha van megengedett (u,v): push(u, v)", "    különben: relabel(u)", "push(u, v): δ ← min(e[u], c_f[u][v])", "  c_f[u][v] −= δ; c_f[v][u] += δ; e[u] −= δ; e[v] += δ", "relabel(u): h[u] ← 1 + min{h[v] : c_f[u][v] > 0}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

const V = ["s","a","b","t"], CAP = {"s-a": 10, "s-b": 10, "a-b": 2, "a-t": 5, "b-t": 10};
const NB = {s: ["a","b"], a: ["t","b","s"], b: ["t","a","s"], t: ["a","b"]};
function run(first){
  const cf = {}; for (const k in CAP) { const [u, v] = k.split("-"); cf[k] = (cf[k] || 0) + CAP[k]; if (!(v + "-" + u in cf)) cf[v + "-" + u] = 0; }
  const h = {s: 4, a: 0, b: 0, t: 0}, e = {s: 0, a: 0, b: 0, t: 0};
  for (const v of NB.s) { const c = CAP["s-" + v]; cf["s-" + v] -= c; cf[v + "-s"] += c; e[v] += c; e.s -= c; }
  const st = [{op: "init", h: {...h}, e: {...e}, cf: {...cf}, line: 1, msg: "Inicializálás: h(s) = 4, h(a) = h(b) = h(t) = 0; az s→a és s→b élek telítése: e(a) = e(b) = 10, e(s) = −20."}];
  const q = [first, first === "a" ? "b" : "a"];
  while (q.length) { const u = q.shift();
    while (e[u] > 0) { const v = NB[u].find(w => cf[u + "-" + w] > 0 && h[u] === h[w] + 1);
      if (v === undefined) { const old = h[u], out = NB[u].filter(w => cf[u + "-" + w] > 0).map(w => h[w]); h[u] = out.length ? 1 + Math.min(...out) : 5;
        st.push({op: "relabel", u, old, h: {...h}, e: {...e}, cf: {...cf}, line: 7, msg: `relabel(${u}): nincs megengedett él; h(${u}) = 1 + min{${NB[u].filter(w => cf[u + "-" + w] > 0).map(w => `h(${w}) = ${h[w]}`).join(", ")}} = ${h[u]} (korábban ${old}).`}); }
      else { const d = Math.min(e[u], cf[u + "-" + v]); cf[u + "-" + v] -= d; cf[v + "-" + u] += d; e[u] -= d; e[v] += d;
        if (v !== "s" && v !== "t" && !q.includes(v) && v !== u) q.push(v);
        st.push({op: "push", u, v, d, h: {...h}, e: {...e}, cf: {...cf}, line: 5, msg: `push(${u}, ${v}): h(${u}) = ${h[u]} = h(${v}) + 1; δ = ${d}; e(${u}) = ${n(e[u])}, e(${v}) = ${n(e[v])}; c_f(${u},${v}) = ${cf[u + "-" + v]}, c_f(${v},${u}) = ${cf[v + "-" + u]}.`}); } } }
  st[st.length - 1].msg += ` Nincs több aktív csúcs: a maximális áramlás e(t) = ${e.t}.`;
  return st;
}
const n = x => String(x).replace("-", "−");
const X = {s: 50, a: 160, b: 270, t: 380}, Y = h => 270 - h * 45;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 330"); G_defs();
  for (let i = 0; i <= 5; i++) { el("line", {x1: 20, x2: 420, y1: Y(i), y2: Y(i), stroke: css("--cellhl"), "stroke-width": 1}); G_text(8, Y(i) + 4, String(i), {size: 11, fill: css("--muted")}); }
  G_text(8, 16, "h", {bold: true});
  for (const k in CAP) { const [u, v] = k.split("-"); if (s.cf[k] > 0) el("line", {x1: X[u], y1: Y(s.h[u]), x2: X[v], y2: Y(s.h[v]), stroke: css("--muted"), "stroke-width": 1}); }
  if (s.op === "relabel") G_edge([X[s.u] - 24, Y(s.old)], [X[s.u] - 24, Y(s.h[s.u])], {r: 4, dir: true, dash: "6 4", w: 2, color: css("--hl")});
  if (s.op === "push") G_edge([X[s.u], Y(s.h[s.u])], [X[s.v], Y(s.h[s.v])], {r: 17, dir: true, w: 4, curve: -30, color: css("--hl2"), label: "δ = " + s.d, lbold: true});
  if (s.op === "init") for (const v of ["a","b"]) G_edge([X.s, Y(4)], [X[v], Y(0)], {r: 17, dir: true, w: 3, color: css("--hl2"), label: 10});
  for (const v of V) { G_node([X[v], Y(s.h[v])], v, {r: 16, w: s.u === v ? 4 : 1.5, stroke: s.u === v ? css("--hl2") : undefined});
    if (v !== "s" && s.e[v] > 0 && v !== "t") el("rect", {x: X[v] + 20, y: Y(s.h[v]) - s.e[v] * 4, width: 9, height: s.e[v] * 4, fill: "url(#hp)", stroke: css("--line")});
    if (v !== "s") G_text(X[v] + 33, Y(s.h[v]) + 4, `e=${s.e[v]}`, {size: 12, halo: true}); }
  // tábla
  const tx = 440; G_text(tx, 20, "csúcs h  e", {bold: true});
  V.forEach((v, i) => G_text(tx, 40 + i * 17, `${v}:   ${s.h[v]}   ${n(s.e[v])}`, {size: 12}));
  G_text(tx, 125, "c_f", {bold: true});
  ["s-a","a-s","s-b","b-s","a-b","b-a","a-t","t-a","b-t","t-b"].forEach((k, i) => G_text(tx + (i % 2) * 72, 143 + Math.floor(i / 2) * 17, `${k.replace("-", "→")}: ${s.cf[k]}`, {size: 11.5}));
  G_text(10, 300, "vízszintes rácsvonal = magasság · narancs nyíl = push (δ) · kék szaggatott = relabel · oszlop = e(u)", {size: 11, fill: css("--muted")});
  G_text(10, 316, "megengedett él: c_f(u,v) > 0 és h(u) = h(v) + 1; szürke vonal = c_f > 0 eredeti él", {size: 11, fill: css("--muted")});
}
function load(){ setSteps(run(document.getElementById("ord").value)); }

STEPS = run('a');


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
