<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomuto-partíció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb: <input id="inp" value="6, 1, 3, 8, 2, 9, 5" size="20" aria-label="Saját tömb"></label><button onclick="load()">Betöltés</button><button onclick="load('4, 4, 4, 4, 4, 4')">Csupa azonos kulcs</button><button onclick="load('1, 2, 3, 4, 5, 6')">Rendezett bemenet</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét cellás tömb lépésenként; a pivotnál nem nagyobb elemek sraffozott, a nagyobbak pontozott tartománya nő, végül a pivot a 4. helyre kerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód (14.3.2), pivot = utolsó elem. Kezdőállapot: A = [6, 1, 3, 8, 2, 9, 5], i = 0, j = 1; 6 ciklusiteráció + 1 záró csere. Csupa azonos kulcsnál minden elem a ≤ tartományba kerül, a felosztás (n − 1, 0).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"A": [6, 1, 3, 8, 2, 9, 5], "i": 0, "jn": 1, "j": null, "sw": null, "q": null, "line": 2, "inv": [true, true, true], "pivot": 5, "msg": "Kezdet: pivot = A[7] = 5, i = 0, j = 1; mindkét első tartomány üres"}, {"A": [6, 1, 3, 8, 2, 9, 5], "i": 0, "jn": 2, "j": 1, "sw": null, "q": null, "line": 4, "inv": [true, true, true], "pivot": 5, "msg": "j = 1: A[1] = 6 > 5, nincs csere (a > pivot tartomány bővül)"}, {"A": [1, 6, 3, 8, 2, 9, 5], "i": 1, "jn": 3, "j": 2, "sw": [1, 2], "q": null, "line": 6, "inv": [true, true, true], "pivot": 5, "msg": "j = 2: A[2] = 1 ≤ 5 → i = 1, csere A[1] ↔ A[2] → [1, 6, 3, 8, 2, 9, 5]"}, {"A": [1, 3, 6, 8, 2, 9, 5], "i": 2, "jn": 4, "j": 3, "sw": [2, 3], "q": null, "line": 6, "inv": [true, true, true], "pivot": 5, "msg": "j = 3: A[3] = 3 ≤ 5 → i = 2, csere A[2] ↔ A[3] → [1, 3, 6, 8, 2, 9, 5]"}, {"A": [1, 3, 6, 8, 2, 9, 5], "i": 2, "jn": 5, "j": 4, "sw": null, "q": null, "line": 4, "inv": [true, true, true], "pivot": 5, "msg": "j = 4: A[4] = 8 > 5, nincs csere (a > pivot tartomány bővül)"}, {"A": [1, 3, 2, 8, 6, 9, 5], "i": 3, "jn": 6, "j": 5, "sw": [3, 5], "q": null, "line": 6, "inv": [true, true, true], "pivot": 5, "msg": "j = 5: A[5] = 2 ≤ 5 → i = 3, csere A[3] ↔ A[5] → [1, 3, 2, 8, 6, 9, 5]"}, {"A": [1, 3, 2, 8, 6, 9, 5], "i": 3, "jn": 7, "j": 6, "sw": null, "q": null, "line": 4, "inv": [true, true, true], "pivot": 5, "msg": "j = 6: A[6] = 9 > 5, nincs csere (a > pivot tartomány bővül)"}, {"A": [1, 3, 2, 5, 6, 9, 8], "i": 3, "jn": 7, "j": null, "sw": [4, 7], "q": 4, "line": 7, "inv": [true, true, true], "pivot": 5, "msg": "Záró csere A[4] ↔ A[7] → [1, 3, 2, 5, 6, 9, 8]; q = 4: balra [1, 3, 2], jobbra [6, 9, 8]"}];
const CODE = ["Partition(A, bal, jobb):", "    pivot = A[jobb]", "    i = bal - 1", "    ciklus j = bal-tól jobb - 1-ig:", "        ha A[j] <= pivot:", "            i = i + 1", "            Csere(A[i], A[j])", "    Csere(A[i + 1], A[jobb])", "    vissza i + 1"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = '<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'
    + '<line x1="0" y1="0" x2="0" y2="8" stroke="' + css("--muted") + '" stroke-width="1.3"/></pattern>'
    + '<pattern id="dp" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="' + css("--muted") + '"/></pattern>'
    + '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="' + css("--line") + '"/></marker></defs>';
  const n = s.A.length, w = Math.min(56, 520 / n), x0 = (560 - n * w) / 2, y0 = 100;
  const last = s.q !== null && s.q !== undefined;
  for (let p = 1; p <= n; p++) {
    let pat = null;
    if (last) pat = p < s.q ? "hp" : (p > s.q ? "dp" : null);
    else pat = p <= s.i ? "hp" : (p < s.jn && p < n ? "dp" : null);
    el("rect", {x: x0 + (p-1)*w, y: y0, width: w, height: w, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    if (pat) el("rect", {x: x0 + (p-1)*w, y: y0, width: w, height: w, fill: `url(#${pat})`, stroke: "none"});
    el("rect", {x: x0 + (p-0.5)*w - 14, y: y0 + w/2 - 12, width: 28, height: 24, fill: css("--bg"), opacity: pat ? 1 : 0});
    el("text", {x: x0 + (p-0.5)*w, y: y0 + w/2 + 7, "text-anchor": "middle", "font-size": 19, "font-weight": "bold"}, String(s.A[p-1]));
    el("text", {x: x0 + (p-0.5)*w, y: y0 - 6, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(p));
  }
  const pv = last ? s.q : n;
  el("rect", {x: x0 + (pv-1)*w, y: y0, width: w, height: w, fill: "none", stroke: css("--line"), "stroke-width": 3});
  el("rect", {x: x0 + (pv-1)*w + 5, y: y0 + 5, width: w - 10, height: w - 10, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
  if (s.sw && s.sw[0] !== s.sw[1]) {
    const a = x0 + (s.sw[0]-0.5)*w, b = x0 + (s.sw[1]-0.5)*w;
    el("path", {d: `M${a},${y0 + w + 4} Q${(a+b)/2},${y0 + w + 30 + 5*Math.abs(s.sw[1]-s.sw[0])} ${b},${y0 + w + 4}`, fill: "none",
                stroke: css("--line"), "stroke-width": 2.5, "marker-start": "url(#ah)", "marker-end": "url(#ah)"});
  }
  if (!last) {
    const ip = s.i >= 1 ? x0 + (s.i-0.5)*w : x0 - w/2;
    el("text", {x: ip, y: y0 + w + 62, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl")}, "↑ i = " + s.i);
    if (s.jn < n) el("text", {x: x0 + (s.jn-0.5)*w, y: y0 + w + 82, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "↑ j = " + s.jn);
  }
  el("text", {x: 280, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"},
     `pivot = ${s.pivot} · i = ${s.i}` + (last ? ` · q = ${s.q}` : (s.jn < n ? ` · következő j = ${s.jn}` : " · ciklus vége")));
  const lab = ["A[bal..i] ≤ pivot", "A[i+1..j−1] > pivot", "A[j..jobb−1] feldolgozatlan"];
  lab.forEach((t, q) => el("text", {x: 90 + q * 165, y: 268, "text-anchor": "middle", "font-size": 12.5},
     (s.inv[q] ? "✔ " : "✘ ") + t));
  el("text", {x: 280, y: 292, "text-anchor": "middle", "font-size": 11, fill: css("--muted")},
     "sraffozott = ≤ pivot · pontozott = > pivot · fehér = feldolgozatlan · dupla keret = pivot");
}
function arr(a){ return "[" + a.join(", ") + "]"; }
function inv(A, i, jn, pivot){ return [A.slice(0, i).every(x => x <= pivot), A.slice(i, jn - 1).every(x => x > pivot), true]; }
function partition(a){
  const A = a.slice(), n = A.length, pivot = A[n-1]; let i = 0;
  const out = [{A: A.slice(), i: 0, jn: 1, j: null, sw: null, q: null, line: 2, inv: inv(A, 0, 1, pivot), pivot,
                msg: `Kezdet: pivot = A[${n}] = ${pivot}, i = 0, j = 1; mindkét első tartomány üres`}];
  for (let j = 1; j <= n - 1; j++) {
    let sw, msg, line;
    if (A[j-1] <= pivot) {
      i++; const t = A[i-1]; A[i-1] = A[j-1]; A[j-1] = t; sw = [i, j];
      msg = i !== j ? `j = ${j}: A[${j}] = ${A[i-1]} ≤ ${pivot} → i = ${i}, csere A[${i}] ↔ A[${j}] → ${arr(A)}`
                    : `j = ${j}: A[${j}] = ${A[i-1]} ≤ ${pivot} → i = ${i}, csere önmagával`;
      line = 6;
    } else { sw = null; msg = `j = ${j}: A[${j}] = ${A[j-1]} > ${pivot}, nincs csere (a > pivot tartomány bővül)`; line = 4; }
    out.push({A: A.slice(), i, jn: j + 1, j, sw, q: null, line, inv: inv(A, i, j + 1, pivot), pivot, msg});
  }
  const t = A[i]; A[i] = A[n-1]; A[n-1] = t;
  out.push({A: A.slice(), i, jn: n, j: null, sw: [i + 1, n], q: i + 1, line: 7, inv: [true, true, true], pivot,
            msg: `Záró csere A[${i+1}] ↔ A[${n}] → ${arr(A)}; q = ${i+1}: balra ${arr(A.slice(0, i))}, jobbra ${arr(A.slice(i + 1))}`});
  return out;
}
function load(v){
  const e = document.getElementById("err");
  if (v) document.getElementById("inp").value = v;
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (raw.length < 2 || raw.length > 10 || raw.some(x => !Number.isInteger(x))) { e.textContent = "2–10 egész számot adjon meg."; return; }
  e.textContent = ""; setSteps(partition(raw));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
