<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAX-HEAPIFY lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját tömb (1-alapú, i = 1): <input id="inp" value="1, 9, 8, 7, 6, 5, 4" size="22" aria-label="Saját tömb"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('inp').value='10, 14, 9, 8, 7, 16';load()">Példa: [10, 14, 9, 8, 7, 16]</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A [1, 9, 8, 7, 6, 5, 4] tömb lesüllyesztése: az 1 előbb a 9-cel, majd a 7-tel cserélődik; eredmény [9, 7, 8, 1, 6, 5, 4]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú MAX-HEAPIFY-ITERATIVE (9.1.3), a labor 5. tesztje. A [10, 14, 9, 8, 7, 16] tömbben a 9 gyökerű részfa nem kupac (16 > 9), így az előfeltétel sérül. Kezdőállapot: a könyv példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [1, 9, 8, 7, 6, 5, 4], "i": 1, "cmp": [], "lg": null, "path": [1], "swap": null, "swaps": 0, "line": 0, "msg": "Kezdőállapot: MAX-HEAPIFY(A, 1, 7); az i = 1 csúcs (1) sértheti a kupactulajdonságot"}, {"a": [1, 9, 8, 7, 6, 5, 4], "i": 1, "cmp": [2, 3], "lg": 2, "path": [1], "swap": null, "swaps": 0, "line": 7, "msg": "i = 1, bal = 2, jobb = 3: 1 vs. 9, 8 → legnagyobb = 2"}, {"a": [9, 1, 8, 7, 6, 5, 4], "i": 2, "cmp": [], "lg": null, "path": [1, 2], "swap": [1, 2], "swaps": 1, "line": 13, "msg": "csere(A[1], A[2]) → [9, 1, 8, 7, 6, 5, 4], i = 2; cserék: 1"}, {"a": [9, 1, 8, 7, 6, 5, 4], "i": 2, "cmp": [4, 5], "lg": 4, "path": [1, 2], "swap": null, "swaps": 1, "line": 7, "msg": "i = 2, bal = 4, jobb = 5: 1 vs. 7, 6 → legnagyobb = 4"}, {"a": [9, 7, 8, 1, 6, 5, 4], "i": 4, "cmp": [], "lg": null, "path": [1, 2, 4], "swap": [2, 4], "swaps": 2, "line": 13, "msg": "csere(A[2], A[4]) → [9, 7, 8, 1, 6, 5, 4], i = 4; cserék: 2"}, {"a": [9, 7, 8, 1, 6, 5, 4], "i": 4, "cmp": [], "lg": 4, "path": [1, 2, 4], "swap": null, "swaps": 2, "line": 10, "msg": "i = 4 levél (bal = 8 > n = 7) → legnagyobb = i, kilépés; cserék: 2"}];
const CODE = ["MAX-HEAPIFY-ITERATIVE(A, i, n)", "    amíg igaz:", "        bal = 2 * i", "        jobb = 2 * i + 1", "        legnagyobb = i", "        ha bal <= n és A[bal] > A[legnagyobb]:", "            legnagyobb = bal", "        ha jobb <= n és A[jobb] > A[legnagyobb]:", "            legnagyobb = jobb", "        ha legnagyobb == i:", "            kilépés", "        különben:", "            csere(A[i], A[legnagyobb])", "            i = legnagyobb"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function hsteps(a0, i){
  const a = a0.slice(), n = a.length, path = [i]; let sw = 0;
  const st = [{a: a.slice(), i, cmp: [], lg: null, path: path.slice(), swap: null, swaps: 0, line: 0,
               msg: `Kezdőállapot: MAX-HEAPIFY(A, ${i}, ${n}); az i = ${i} csúcs (${a[i-1]}) sértheti a kupactulajdonságot`}];
  while (true) {
    const b = 2*i, j = 2*i + 1; let lg = i;
    if (b <= n && a[b-1] > a[lg-1]) lg = b;
    if (j <= n && a[j-1] > a[lg-1]) lg = j;
    const kids = [b, j].filter(x => x <= n);
    if (!kids.length) { st.push({a: a.slice(), i, cmp: [], lg: i, path: path.slice(), swap: null, swaps: sw, line: 10,
        msg: `i = ${i} levél (bal = ${b} > n = ${n}) → legnagyobb = i, kilépés; cserék: ${sw}`}); break; }
    st.push({a: a.slice(), i, cmp: kids, lg, path: path.slice(), swap: null, swaps: sw, line: 7,
        msg: `i = ${i}, bal = ${b}, jobb = ${j}${j <= n ? "" : " (> n)"}: ${a[i-1]} vs. ${kids.map(x => a[x-1]).join(", ")} → legnagyobb = ${lg}`});
    if (lg === i) { st.push({a: a.slice(), i, cmp: kids, lg, path: path.slice(), swap: null, swaps: sw, line: 10,
        msg: `legnagyobb == i = ${i} → kilépés; cserék: ${sw}`}); break; }
    [a[i-1], a[lg-1]] = [a[lg-1], a[i-1]]; sw++; path.push(lg);
    st.push({a: a.slice(), i: lg, cmp: [], lg: null, path: path.slice(), swap: [i, lg], swaps: sw, line: 13,
        msg: `csere(A[${i}], A[${lg}]) → [${a.join(", ")}], i = ${lg}; cserék: ${sw}`});
    i = lg;
  }
  return st;
}
function heapFrom(a, r){ const n = a.length, s = [r]; while (s.length) { const x = s.pop(); for (const c of [2*x, 2*x+1]) if (c <= n) { if (a[c-1] > a[x-1]) return false; s.push(c); } } return true; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 320");
  const a = s.a, n = a.length, D = Math.floor(Math.log2(n)), dy = Math.min(60, 170 / Math.max(1, D));
  const P = v => { const d = Math.floor(Math.log2(v)), k = v - 2 ** d; return [20 + (k + 0.5) * 520 / 2 ** d, 30 + d * dy]; };
  const touched = new Set(s.path.concat(s.cmp)), pe = new Set();
  for (let t = 1; t < s.path.length; t++) pe.add(s.path[t]);
  for (let c = 2; c <= n; c++) { const [x0, y0] = P(Math.floor(c/2)), [x1, y1] = P(c);
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--line"), "stroke-width": pe.has(c) ? 4.5 : 1.2, "stroke-dasharray": touched.has(c) ? "none" : "2 4"}); }
  const r = n > 15 ? 12 : 17;
  for (let v = 1; v <= n; v++) {
    const [x, y] = P(v), cur = v === s.i, cm = s.cmp.includes(v), lg = v === s.lg && !cur;
    el("circle", {cx: x, cy: y, r, fill: lg ? css("--cellhl") : css("--cell"), stroke: cm ? css("--hl2") : css("--line"),
                  "stroke-width": cm ? 2.5 : 1.3, "stroke-dasharray": cm ? "5 3" : touched.has(v) ? "none" : "2 3"});
    if (cur) el("circle", {cx: x, cy: y, r: r + 5, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": n > 15 ? 11 : 14}, String(a[v-1]));
  }
  if (s.swap) { const [x0, y0] = P(s.swap[0]), [x1, y1] = P(s.swap[1]);
    el("text", {x: (x0 + x1)/2 - 26, y: (y0 + y1)/2, "text-anchor": "middle", "font-size": 18, fill: css("--hl2")}, "⇅"); }
  const w = Math.min(40, 520 / n), x0 = 280 - n * w / 2, ay = 232;
  for (let v = 1; v <= n; v++) {
    const x = x0 + (v - 1) * w, cur = v === s.i, cm = s.cmp.includes(v);
    el("rect", {x, y: ay, width: w, height: w, fill: s.path.slice(0, -1).includes(v) ? css("--cellhl") : css("--cell"),
                stroke: cm ? css("--hl2") : css("--line"), "stroke-width": cur ? 4 : cm ? 2.5 : 1.2, "stroke-dasharray": cm ? "5 3" : "none"});
    el("text", {x: x + w/2, y: ay + w/2 + 5, "text-anchor": "middle", "font-size": 14}, String(a[v-1]));
    el("text", {x: x + w/2, y: ay + w + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(v));
    if (cur) el("text", {x: x + w/2, y: ay - 6, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "i");
    if (v === s.lg && !cur) el("text", {x: x + w/2, y: ay - 6, "text-anchor": "middle", "font-size": 11}, "lg");
  }
  el("text", {x: 4, y: 300, "font-size": 12, "font-weight": "bold"}, `cserék: ${s.swaps}`);
  el("text", {x: 4, y: 316, "font-size": 11, fill: css("--muted")}, "kék dupla kör = i · narancs szaggatott = összehasonlított · lg = legnagyobb · vastag él = út");
}
function load(){
  const msg = document.getElementById("err");
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  if (a.length < 1 || a.length > 15 || a.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–15 egész számot adjon meg."; return; }
  const bad = [2, 3].filter(c => c <= a.length && !heapFrom(a, c));
  msg.textContent = bad.length ? `Figyelem: az előfeltétel sérül, a(z) ${bad.join(" és ")} gyökerű részfa nem kupac – a MAX-HEAPIFY eredménye nem feltétlenül kupac.` : "Előfeltétel teljesül: a gyökér két részfája kupac.";
  setSteps(hsteps(a, 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
