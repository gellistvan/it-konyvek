<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csúszó ablak maximuma deque-val</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Saját A: <input id="inp" value="1, 3, 3, 2, 5, 1" size="20" aria-label="Saját tömb"></label><label>k = <input id="kk" type="number" min="1" max="11" value="3" style="width:3.5em" aria-label="Ablakméret"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat elemű tömb csúszó hármas ablakkal; alatta a deque indexei és értékei, az eldobott indexek áthúzva; a kimenet 3, 3, 5, 5."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-től indexelt pszeudokód; a deque értékei nem növekvők (egyenlő értéket nem dobunk el). Kezdőállapot: a könyv A = [1, 3, 3, 2, 5, 1], k = 3 példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "D": [], "drop": [], "out": [], "ins": 0, "rem": 0, "line": 1, "msg": "Kezdetben D üres."}, {"i": 1, "D": [1], "drop": [], "out": [], "ins": 1, "rem": 0, "line": 5, "msg": "i = 1: addLast(1); D = [1]"}, {"i": 2, "D": [], "drop": [[1, "removeLast"]], "out": [], "ins": 1, "rem": 1, "line": 4, "msg": "i = 2: A[1] = 1 < A[2] = 3 → removeLast (1 eldobva)"}, {"i": 2, "D": [2], "drop": [], "out": [], "ins": 2, "rem": 1, "line": 5, "msg": "i = 2: addLast(2); D = [2]"}, {"i": 3, "D": [2, 3], "drop": [], "out": [], "ins": 3, "rem": 1, "line": 5, "msg": "i = 3: addLast(3); D = [2, 3]"}, {"i": 3, "D": [2, 3], "drop": [], "out": [3], "ins": 3, "rem": 1, "line": 8, "msg": "i = 3: ablak A[1..3], maximum = A[2] = 3; kimenet: [3]"}, {"i": 4, "D": [2, 3, 4], "drop": [], "out": [3], "ins": 4, "rem": 1, "line": 5, "msg": "i = 4: addLast(4); D = [2, 3, 4]"}, {"i": 4, "D": [2, 3, 4], "drop": [], "out": [3, 3], "ins": 4, "rem": 1, "line": 8, "msg": "i = 4: ablak A[2..4], maximum = A[2] = 3; kimenet: [3, 3]"}, {"i": 5, "D": [2, 3], "drop": [[4, "removeLast"]], "out": [3, 3], "ins": 4, "rem": 2, "line": 4, "msg": "i = 5: A[4] = 2 < A[5] = 5 → removeLast (4 eldobva)"}, {"i": 5, "D": [2], "drop": [[3, "removeLast"]], "out": [3, 3], "ins": 4, "rem": 3, "line": 4, "msg": "i = 5: A[3] = 3 < A[5] = 5 → removeLast (3 eldobva)"}, {"i": 5, "D": [], "drop": [[2, "removeLast"]], "out": [3, 3], "ins": 4, "rem": 4, "line": 4, "msg": "i = 5: A[2] = 3 < A[5] = 5 → removeLast (2 eldobva)"}, {"i": 5, "D": [5], "drop": [], "out": [3, 3], "ins": 5, "rem": 4, "line": 5, "msg": "i = 5: addLast(5); D = [5]"}, {"i": 5, "D": [5], "drop": [], "out": [3, 3, 5], "ins": 5, "rem": 4, "line": 8, "msg": "i = 5: ablak A[3..5], maximum = A[5] = 5; kimenet: [3, 3, 5]"}, {"i": 6, "D": [5, 6], "drop": [], "out": [3, 3, 5], "ins": 6, "rem": 4, "line": 5, "msg": "i = 6: addLast(6); D = [5, 6]"}, {"i": 6, "D": [5, 6], "drop": [], "out": [3, 3, 5, 5], "ins": 6, "rem": 4, "line": 8, "msg": "i = 6: ablak A[4..6], maximum = A[5] = 5; kimenet: [3, 3, 5, 5]"}, {"i": 6, "D": [5, 6], "drop": [], "out": [3, 3, 5, 5], "ins": 6, "rem": 4, "line": -1, "msg": "Vége: kimenet [3, 3, 5, 5]; deque-ba került 6, onnan törölt 4 index (összesen 10 ≤ 2n = 12) → O(n)."}];
const CODE = ["CsúszóMax(A[1..n], k):", "    D := üres deque (indexeket tárol)", "    for i := 1 to n:", "        while D nem üres és A[getLast(D)] < A[i]:", "            removeLast(D)", "        addLast(D, i)", "        while getFirst(D) ≤ i − k:", "            removeFirst(D)", "        if i ≥ k: kiír A[getFirst(D)]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CA = [1, 3, 3, 2, 5, 1], CK = 3;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 470 280");
  const a = s.a || CA, k = s.k || CK, n = a.length, w = Math.min(46, 430 / n), x0 = 20, y0 = 40;
  el("text", {x: x0, y: 24, "font-size": 13, fill: css("--muted")}, "A (ablak = vastag keret)");
  a.forEach((v, j) => {
    const i = j + 1;
    el("rect", {x: x0 + j*w, y: y0, width: w, height: 40, fill: i === s.i ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
    el("text", {x: x0 + j*w + w/2, y: y0 + 26, "text-anchor": "middle", "font-size": 16}, String(v).replace("-", "−"));
    el("text", {x: x0 + j*w + w/2, y: y0 + 56, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
  });
  if (s.i > 0) { const lo = Math.max(1, s.i - k + 1);
    el("rect", {x: x0 + (lo-1)*w, y: y0, width: (s.i-lo+1)*w, height: 40, fill: "none", stroke: css("--hl"), "stroke-width": 4}); }
  el("text", {x: x0, y: 132, "font-size": 13, fill: css("--muted")}, "deque D (index: érték); eleje balra");
  let x = x0;
  s.D.forEach(j => {
    el("rect", {x, y: 142, width: 60, height: 36, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.2});
    el("text", {x: x + 30, y: 166, "text-anchor": "middle", "font-size": 14}, j + ": " + a[j-1]); x += 62; });
  x += 14;
  s.drop.forEach(([j, how]) => {
    el("rect", {x, y: 142, width: 60, height: 36, fill: "none", stroke: css("--muted"), "stroke-dasharray": "4 3"});
    el("text", {x: x + 30, y: 166, "text-anchor": "middle", "font-size": 14, fill: css("--muted")}, j + ": " + a[j-1]);
    el("line", {x1: x + 4, y1: 174, x2: x + 56, y2: 146, stroke: css("--hl2"), "stroke-width": 2.5});
    el("text", {x: x + 30, y: 196, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, how); x += 64; });
  el("text", {x: x0, y: 236, "font-size": 15}, "kimenet: [" + s.out.join(", ") + "]");
  el("text", {x: x0, y: 262, "font-size": 13}, `deque-ba került: ${s.ins}, onnan törölt: ${s.rem}; összesen ${s.ins + s.rem} ≤ 2n = ${2*n}`);
}
function trace(a, k){
  const D = [], out = []; let ins = 0, rem = 0;
  const st = [{a, k, i: 0, D: [], drop: [], out: [], ins: 0, rem: 0, line: 1, msg: "Kezdetben D üres."}];
  const snap = (i, drop, line, msg) => st.push({a, k, i, D: D.slice(), drop, out: out.slice(), ins, rem, line, msg});
  for (let i = 1; i <= a.length; i++) {
    while (D.length && a[D[D.length-1]-1] < a[i-1]) { const j = D.pop(); rem++;
      snap(i, [[j, "removeLast"]], 4, `i = ${i}: A[${j}] = ${a[j-1]} < A[${i}] = ${a[i-1]} → removeLast (${j} eldobva)`); }
    D.push(i); ins++;
    snap(i, [], 5, `i = ${i}: addLast(${i}); D = [${D.join(", ")}]`);
    while (D[0] <= i - k) { const j = D.shift(); rem++;
      snap(i, [[j, "removeFirst"]], 7, `i = ${i}: ${j} ≤ i − k = ${i-k}, kicsúszott az ablakból → removeFirst`); }
    if (i >= k) { out.push(a[D[0]-1]);
      snap(i, [], 8, `i = ${i}: ablak A[${i-k+1}..${i}], maximum = A[${D[0]}] = ${a[D[0]-1]}; kimenet: [${out.join(", ")}]`); }
  }
  st.push({a, k, i: a.length, D: D.slice(), drop: [], out: out.slice(), ins, rem, line: -1,
           msg: `Vége: kimenet [${out.join(", ")}]; deque-ba került ${ins}, onnan törölt ${rem} index (összesen ${ins+rem} ≤ 2n = ${2*a.length}) → O(n).`});
  return st;
}
function load(){
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const k = +document.getElementById("kk").value, msg = document.getElementById("err");
  if (a.length < 1 || a.length > 11 || a.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "1–11 egész számot adjon meg (|x| ≤ 999)."; return; }
  if (!Number.isInteger(k) || k < 1 || k > a.length) { msg.textContent = "1 ≤ k ≤ n legyen."; return; }
  msg.textContent = ""; CA = a; CK = k; setSteps(trace(a, k));
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
