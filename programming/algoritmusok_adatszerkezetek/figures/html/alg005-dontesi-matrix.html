<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döntési mátrix súlycsúszkákkal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
.wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 5px;text-align:center}
th{background:var(--code);font-weight:600}
td.k{text-align:left}
td input[type=number]{width:3.2em;font:inherit;background:var(--cell);color:var(--fg);border:1px solid var(--muted)}
td input[type=range]{width:110px}
svg{flex:1 1 300px;width:100%;max-width:520px;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <button id="bBase">Alap</button>
  <button id="bSens">Érzékenység</button>
  <label><input id="gate" type="checkbox" checked> memóriakapu: E kizárása (≥ 137 MiB &gt; 128 MiB)</label>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <table aria-label="Pontozótábla és súlyok">
    <thead><tr><th>Kritérium</th><th>súly (nyers)</th><th>normált</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th></tr></thead>
    <tbody id="tb"></tbody>
    <tfoot><tr><th>Súlyozott összeg</th><th></th><th id="wsum"></th><th id="tA"></th><th id="tB"></th><th id="tC"></th><th id="tD"></th><th id="tE"></th></tr></tfoot>
  </table>
  <svg id="v" viewBox="0 0 520 230" role="img" aria-label="Vízszintes oszlopdiagram a súlyozott összegek rangsorával"></svg>
</div>
<p class="small">A pontozótábla (0–5) a 2.4.4.1 becslése, nem mérés; a cellák szerkeszthetők. A súlyok 0–0,5
között állíthatók, a program 1-re normálja őket. Kezdőállapot: a könyv alapsúlyai.</p>
<script>
const D = {"alts": ["A", "B", "C", "D", "E"], "names": {"A": "dinamikus tömb", "B": "hash tábla", "C": "piros-fekete fa", "D": "skip list", "E": "B-fa"}, "crit": ["Műveleti idő", "Tartomány lekérdezés", "Memóriahatékonyság", "Implementáció és karbantartás", "Cache-lokalitás"], "scores": {"A": [2, 2, 5, 5, 5], "B": [5, 2, 5, 4, 3], "C": [4, 5, 4, 2, 2], "D": [4, 5, 3, 4, 3], "E": [3, 5, 2, 3, 4]}, "base": [0.35, 0.2, 0.2, 0.15, 0.1], "sens": [0.2, 0.35, 0.2, 0.15, 0.1]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = x => x.toFixed(2).replace(".", ",");
const tb = document.getElementById("tb");
D.crit.forEach((c, i) => {
  const tr = document.createElement("tr");
  let h = `<td class="k">${c}</td><td><input type="range" id="w${i}" min="0" max="0.5" step="0.05" aria-label="${c} súlya"> <span id="wv${i}"></span></td><td id="wn${i}"></td>`;
  D.alts.forEach(a => { h += `<td><input type="number" id="s${a}${i}" min="0" max="5" step="1" aria-label="${a} pontja: ${c}"></td>`; });
  tr.innerHTML = h; tb.appendChild(tr);
});
function setW(w){ w.forEach((v, i) => { document.getElementById("w" + i).value = v; }); update(); }
D.alts.forEach(a => D.scores[a].forEach((p, i) => { document.getElementById("s" + a + i).value = p; }));
const PAT = {A: "", B: '<line x1="0" y1="0" x2="0" y2="7" stroke="S" stroke-width="1.3"/>',
             C: '<circle cx="3.5" cy="3.5" r="1.1" fill="S"/>', D: '<line x1="0" y1="0" x2="0" y2="7" stroke="S"/><line x1="0" y1="0" x2="7" y2="0" stroke="S"/>',
             E: '<line x1="0" y1="0" x2="0" y2="7" stroke="S" stroke-width="1.3"/>'};
const ROT = {A: 0, B: 45, C: 0, D: 45, E: -45};
function update(){
  const raw = D.crit.map((_, i) => +document.getElementById("w" + i).value);
  const sum = raw.reduce((x, y) => x + y, 0);
  const w = raw.map(x => sum > 0 ? x / sum : 0);
  raw.forEach((x, i) => { document.getElementById("wv" + i).textContent = fmt(x); document.getElementById("wn" + i).textContent = fmt(w[i]); });
  document.getElementById("wsum").textContent = "Σ = " + fmt(w.reduce((x, y) => x + y, 0));
  const gate = document.getElementById("gate").checked, tot = {};
  for (const a of D.alts) {
    let t = 0;
    D.crit.forEach((_, i) => { let p = +document.getElementById("s" + a + i).value; p = Math.max(0, Math.min(5, isNaN(p) ? 0 : p)); t += w[i] * p; });
    tot[a] = Math.round(t * 1e4) / 1e4;
    document.getElementById("t" + a).textContent = fmt(tot[a]) + (gate && a === "E" ? " (kizárva)" : "");
  }
  const ex = a => gate && a === "E";
  const order = D.alts.slice().sort((x, y) => (ex(x) - ex(y)) || (tot[y] - tot[x]) || x.localeCompare(y));
  const ranked = order.filter(a => !ex(a));
  const st = document.getElementById("status");
  if (sum === 0) st.textContent = "Minden súly 0: nincs rangsor.";
  else st.textContent = `Vezető: ${ranked[0]} (${fmt(tot[ranked[0]])}); különbség a 2. helyhez: ${fmt(tot[ranked[0]] - tot[ranked[1]])}`
     + " · rangsor: " + ranked.map(a => `${a} ${fmt(tot[a])}`).join(" > ") + (gate ? " · E kizárva" : "");
  // diagram
  const s = css("--muted");
  svg.innerHTML = "<defs>" + D.alts.map(a => `<pattern id="p${a}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(${ROT[a]})">${PAT[a].replace(/S/g, s)}</pattern>`).join("") + "</defs>";
  const x0 = 150, sc = 300 / 5;
  order.forEach((a, k) => {
    const y = 12 + k * 38, e = ex(a);
    el("text", {x: x0 - 8, y: y + 19, "text-anchor": "end", "font-size": 13}, a + ": " + D.names[a]);
    el("rect", {x: x0, y, width: tot[a] * sc, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": e ? "5 4" : "none", opacity: e ? 0.6 : 1});
    el("rect", {x: x0, y, width: tot[a] * sc, height: 26, fill: `url(#p${a})`, stroke: "none", opacity: e ? 0.6 : 1});
    el("text", {x: x0 + tot[a] * sc + 6, y: y + 18, "font-size": 13, "font-weight": e ? "normal" : "bold"}, fmt(tot[a]) + (e ? " kizárva" : ""));
  });
  el("line", {x1: x0, y1: 200, x2: x0 + 300, y2: 200, stroke: css("--line")});
  for (let t = 0; t <= 5; t++) { el("line", {x1: x0 + t*sc, y1: 200, x2: x0 + t*sc, y2: 205, stroke: css("--line")}); el("text", {x: x0 + t*sc, y: 220, "text-anchor": "middle", "font-size": 12}, String(t)); }
}
document.querySelectorAll("input").forEach(i => i.addEventListener("input", update));
document.getElementById("gate").addEventListener("change", update);
document.getElementById("bBase").onclick = () => setW(D.base);
document.getElementById("bSens").onclick = () => setW(D.sens);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
setW(D.base);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
