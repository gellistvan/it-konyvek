<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohó-Max-Cut lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="opt" type="checkbox" onchange="show(k)"> optimális vágás mutatása</label><label><input id="ed" type="checkbox" onchange="EDIT=this.checked;SEL=null;show(k)"> élszerkesztés kattintással</label><label>n = <input id="nn" value="6" size="2" aria-label="Csúcsok száma"></label><button onclick="newGraph()">Üres gráf (n csúcs)</button><button onclick="reset()">A könyv példája</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hatcsúcsú gráf; a mohó algoritmus a 0–5 csúcsokat sorban A-ba vagy B-be teszi, a végén 4 vágott él az optimális 7 helyett."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">0-tól indexelt csúcsok, feldolgozási sorrend 0…5, döntetlen (a ≥ b) esetén B. Kezdőállapot: minden csúcs feldolgozatlan, majd 6 lépés. Az optimum kimerítő kereséssel számolódik (n ≤ 12).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"side": [-1, -1, -1, -1, -1, -1], "cur": null, "a": null, "b": null, "rows": [], "line": 0, "msg": "Kezdetben minden csúcs feldolgozatlan (side = −1); A = B = ∅"}, {"side": [1, -1, -1, -1, -1, -1], "cur": 0, "a": 0, "b": 0, "rows": [[0, 0, 0]], "line": 5, "msg": "i = 0: a = 0, b = 0 → a ≥ b, B-be; d = 0, c = 0 ≥ d/2; Σc = 0 ≥ Σd/2 = 0"}, {"side": [1, 1, -1, -1, -1, -1], "cur": 1, "a": 0, "b": 0, "rows": [[0, 0, 0], [1, 0, 0]], "line": 5, "msg": "i = 1: a = 0, b = 0 → a ≥ b, B-be; d = 0, c = 0 ≥ d/2; Σc = 0 ≥ Σd/2 = 0"}, {"side": [1, 1, 0, -1, -1, -1], "cur": 2, "a": 0, "b": 1, "rows": [[0, 0, 0], [1, 0, 0], [2, 1, 1]], "line": 7, "msg": "i = 2: a = 0, b = 1 → a < b, A-ba; d = 1, c = 1 ≥ d/2; Σc = 1 ≥ Σd/2 = 0,5"}, {"side": [1, 1, 0, 1, -1, -1], "cur": 3, "a": 1, "b": 1, "rows": [[0, 0, 0], [1, 0, 0], [2, 1, 1], [3, 2, 1]], "line": 5, "msg": "i = 3: a = 1, b = 1 → a ≥ b, B-be; d = 2, c = 1 ≥ d/2; Σc = 2 ≥ Σd/2 = 1,5"}, {"side": [1, 1, 0, 1, 1, -1], "cur": 4, "a": 1, "b": 1, "rows": [[0, 0, 0], [1, 0, 0], [2, 1, 1], [3, 2, 1], [4, 2, 1]], "line": 5, "msg": "i = 4: a = 1, b = 1 → a ≥ b, B-be; d = 2, c = 1 ≥ d/2; Σc = 3 ≥ Σd/2 = 2,5"}, {"side": [1, 1, 0, 1, 1, 1], "cur": 5, "a": 1, "b": 1, "rows": [[0, 0, 0], [1, 0, 0], [2, 1, 1], [3, 2, 1], [4, 2, 1], [5, 2, 1]], "line": 8, "msg": "i = 5: a = 1, b = 1 → a ≥ b, B-be; d = 2, c = 1 ≥ d/2; Σc = 4 ≥ Σd/2 = 3,5 — vége: A = {2}, cut = 4 ≥ |E|/2 = 3,5; az optimum 7 (S = {0, 2}), arány 7/4"}];
const CODE = ["A ← ∅;  B ← ∅", "minden i ∈ V sorrendben:", "    a_szomszéd ← |{ j : {i,j} ∈ E és j ∈ A }|", "    b_szomszéd ← |{ j : {i,j} ∈ E és j ∈ B }|", "    ha a_szomszéd ≥ b_szomszéd:", "        B ← B ∪ {i}", "    különben:", "        A ← A ∪ {i}", "cut ← |{ {u,v} ∈ E : u ∈ A, v ∈ B }|", "return (A, B, cut)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let N = 6, E = [[0, 3], [0, 4], [0, 5], [1, 2], [2, 3], [2, 4], [2, 5]], POS = [[141.0, 50.0], [438.0, 242.0], [357.0, 50.0], [60.0, 242.0], [186.0, 242.0], [312.0, 242.0]], OPTV = 7, OPTS = [0, 2], EDIT = false, SEL = null;
function steps(n, E){
  const ad = Array.from({length: n}, () => []); E.forEach(([u, v]) => { ad[u].push(v); ad[v].push(u); });
  const side = Array(n).fill(-1), rows = [], st = [{side: side.slice(), cur: null, a: null, b: null, rows: [], line: 0, msg: "Kezdetben minden csúcs feldolgozatlan (side = −1); A = B = ∅"}];
  for (let v = 0; v < n; v++) { const a = ad[v].filter(u => side[u] === 0).length, b = ad[v].filter(u => side[u] === 1).length;
    side[v] = a >= b ? 1 : 0; const d = a + b, c = side[v] === 1 ? a : b; rows.push([v, d, c]);
    const sd = rows.reduce((s, r) => s + r[1], 0), sc = rows.reduce((s, r) => s + r[2], 0);
    st.push({side: side.slice(), cur: v, a, b, rows: rows.map(r => r.slice()), line: side[v] === 1 ? 5 : 7,
      msg: `i = ${v}: a = ${a}, b = ${b} → ${side[v] === 1 ? "a ≥ b, B-be" : "a < b, A-ba"}; d = ${d}, c = ${c} ≥ d/2; Σc = ${sc} ≥ Σd/2 = ${String(sd / 2).replace(".", ",")}`}); }
  const cut = E.filter(([u, v]) => side[u] !== side[v]).length;
  let best = -1, arg = 0; for (let m = 0; m < (1 << Math.max(0, n - 1)); m++) { let c = 0; E.forEach(([u, v]) => { if (((m >> u) & 1) !== ((m >> v) & 1)) c++; }); if (c > best) { best = c; arg = m; } }
  OPTV = best; OPTS = []; for (let v = 0; v < n; v++) if ((arg >> v) & 1) OPTS.push(v);
  const L = st[st.length - 1]; L.line = 8;
  L.msg += ` — vége: cut = ${cut} ≥ |E|/2 = ${String(E.length / 2).replace(".", ",")}; az optimum ${best} (S = {${OPTS.join(", ")}})` + (cut ? `, arány ${best}/${cut}` : "");
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300");
  svg.innerHTML = "";
  const P = v => [POS[v][0], POS[v][1]], showOpt = document.getElementById("opt") && document.getElementById("opt").checked;
  const side = showOpt ? Array.from({length: N}, (_, v) => OPTS.includes(v) ? 0 : 1) : s.side;
  E.forEach(([u, v]) => { const done = side[u] >= 0 && side[v] >= 0, cut = done && side[u] !== side[v];
    el("line", {x1: P(u)[0], y1: P(u)[1], x2: P(v)[0], y2: P(v)[1], stroke: done ? css("--line") : css("--muted"), "stroke-width": cut ? 4 : 1.4, "stroke-dasharray": done && !cut ? "6 4" : "none"}); });
  for (let v = 0; v < N; v++) { const [x, y] = P(v), sd = side[v], cur = !showOpt && s.cur === v, sel = EDIT && SEL === v;
    const fill = sd < 0 ? css("--cellhl") : (sd === 0 ? css("--cellhl") : css("--cell"));
    if (sd === 0) el("rect", {x: x - 18, y: y - 18, width: 36, height: 36, fill, stroke: css("--line"), "stroke-width": 1.5, "data-v": v});
    else el("circle", {cx: x, cy: y, r: 19, fill, stroke: sd < 0 ? css("--muted") : css("--line"), "stroke-width": 1.5, "stroke-dasharray": sd < 0 ? "3 3" : "none", "data-v": v});
    if (cur || sel) el(sd === 0 ? "rect" : "circle", sd === 0 ? {x: x - 24, y: y - 24, width: 48, height: 48, fill: "none", stroke: css("--hl"), "stroke-width": 2.5} : {cx: x, cy: y, r: 25, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, "pointer-events": "none"}, String(v)); }
  // tábla
  const tx = 470, col = (y, a, b, c, bold) => [a, b, c].forEach((t, i) => el("text", {x: tx + i * 38, y, "font-size": 13, "text-anchor": "middle", "font-weight": bold ? "bold" : "normal"}, String(t)));
  if (showOpt) el("text", {x: tx - 10, y: 22, "font-size": 13, "font-weight": "bold"}, "optimum");
  else { col(22, "j", "d_j", "c_j", true); s.rows.forEach((r, i) => col(42 + i * 17, r[0], r[1], r[2]));
    const sd = s.rows.reduce((a, r) => a + r[1], 0), sc = s.rows.reduce((a, r) => a + r[2], 0);
    col(46 + s.rows.length * 17, "Σ", sd, sc, true);
    el("text", {x: tx - 18, y: 66 + s.rows.length * 17, "font-size": 12}, `Σc = ${sc} ≥ Σd/2 = ${String(sd / 2).replace(".", ",")}`); }
  if (showOpt) el("text", {x: tx - 10, y: 42, "font-size": 13}, `S = {${OPTS.join(", ")}}: ${OPTV} él`);
  el("text", {x: 8, y: 292, "font-size": 12, fill: css("--muted")}, EDIT ? "Szerkesztés: kattintson két csúcsra az él be-/kikapcsolásához" : "négyzet = A, kör = B, szaggatott kör = feldolgozatlan; vastag él = vágott, szaggatott = nem vágott");
}
svg.addEventListener("click", ev => { if (!EDIT) return; const t = ev.target.getAttribute("data-v"); if (t === null) return; const v = +t;
  if (SEL === null) { SEL = v; show(k); return; } if (SEL !== v) { const a = Math.min(SEL, v), b = Math.max(SEL, v), i = E.findIndex(e => e[0] === a && e[1] === b);
    if (i >= 0) E.splice(i, 1); else E.push([a, b]); } SEL = null; setSteps(steps(N, E)); });
function circ(n){ const P = []; for (let v = 0; v < n; v++) { const t = -Math.PI / 2 + 2 * Math.PI * v / n; P.push([220 + 130 * Math.cos(t), 145 + 120 * Math.sin(t)]); } return P; }
function newGraph(){ const n = parseInt(document.getElementById("nn").value, 10), e = document.getElementById("err");
  if (!(n >= 2 && n <= 12)) { e.textContent = "2 ≤ n ≤ 12"; return; } e.textContent = ""; N = n; E = []; POS = circ(n); EDIT = true; SEL = null; document.getElementById("ed").checked = true; setSteps(steps(N, E)); }
function reset(){ N = 6; E = [[0, 3], [0, 4], [0, 5], [1, 2], [2, 3], [2, 4], [2, 5]]; POS = [[141.0, 50.0], [438.0, 242.0], [357.0, 50.0], [60.0, 242.0], [186.0, 242.0], [312.0, 242.0]]; EDIT = false; SEL = null; document.getElementById("ed").checked = false; setSteps(steps(N, E)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
