<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A benchmark mérési ciklusa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>W = <span id="wv">5</span> <input id="ww" type="range" min="3" max="10" value="5" oninput="load()" aria-label="Warm-up futtatások W"></label><label>M = <span id="mv">10</span> <input id="mm" type="range" min="10" max="100" value="10" oninput="load()" aria-label="Mért futtatások M"></label><button onclick="document.getElementById('mm').value=100;load()">M = 100</button><span id="err" class="small" aria-live="polite">p95 rangja: ⌈0,95·10⌉ = 10</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal 5 warm-up és 10 mért futtatással; mindegyikben generálás és rendezés, a mértekben ellenőrzés is; a mért ablak csak a rendezést fogja közre; p95 rangja M = 10-re 10."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet 32.3.11 pszeudokódja (1-től indexelt) és Python-kódja (seed + j, j = 0-tól). Sematikus, nem mért adat: időt nem ábrázolunk. A Python-kódban a warm-up rendezés nem jár ellenőrzéssel.</p>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const p95r = m => Math.ceil(0.95 * m - 1e-12);
function stepsFor(w, m, seed){
  const st = [], R = [];
  for (let j = 0; j < w; j++) R.push({kind: "w", seed: seed + j, idx: j});
  for (let i = 0; i < m; i++) R.push({kind: "m", seed: seed + w + i, idx: i});
  R.forEach((x, r) => { const warm = x.kind === "w", base = warm ? 1 : 7, lab = warm ? `warm-up ${x.idx + 1}/${w}` : `mért ${x.idx + 1}/${m}`;
    st.push({run: r, seg: "gen", line: base, msg: `${lab}: A := Generál(n, ${x.seed}) – nem mért szakasz`});
    st.push({run: r, seg: "t0", line: base + 1, msg: `${lab}: t_start rögzítése`});
    st.push({run: r, seg: "sort", line: base + 2, msg: `${lab}: Rendezés(A) – ` + (warm ? "ez is fut, de az idejét eldobjuk" : "csak ez esik a mért ablakba")});
    st.push({run: r, seg: "t1", line: base + 3, msg: `${lab}: t_end rögzítése`});
    if (warm) st.push({run: r, seg: "drop", line: 5, msg: `${lab}: az eredményt eldobjuk (bemelegítés: cache, JIT, frekvenciaskálázás)`});
    else { st.push({run: r, seg: "store", line: 11, msg: `${lab}: L[${x.idx + 1}] := t_end − t_start`});
           st.push({run: r, seg: "chk", line: 12, msg: `${lab}: rendezettség-ellenőrzés a t_end UTÁN – nem számít bele a mért időbe`}); } });
  st.push({run: null, seg: "stat", line: 13, msg: `Statisztika L[1..${m}]-ből: medián, átlag, szórás; p95 = a ⌈0,95·${m}⌉ = ${p95r(m)}. rendezett minta` + (p95r(m) === m ? " (= maximum)" : "")});
  st.push({run: null, seg: "ret", line: 14, msg: "return L, Stat"});
  st.forEach(s => Object.assign(s, {W: w, M: m, seed}));
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 300");
  const n = s.W + s.M, slot = 580 / n, x0 = 10, y = 70, h = 34;
  const curRun = s.run === null ? n : s.run;
  const order = ["gen", "t0", "sort", "t1", "drop", "store", "chk"], si = order.indexOf(s.seg);
  for (let r = 0; r < n; r++) {
    const warm = r < s.W, X = x0 + r * slot, g = slot * 0.3, so = slot * 0.42, c = warm ? 0 : slot * 0.18;
    const done = r < curRun, isCur = r === curRun, past = k => done || (isCur && si >= order.indexOf(k));
    const op = k => past(k) ? 1 : 0.25;
    el("rect", {x: X, y, width: g, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 0.8, opacity: op("gen")});
    el("rect", {x: X + g, y, width: so, height: h, fill: warm ? css("--cellhl") : css("--fg"), stroke: css("--line"), "stroke-width": 0.8, opacity: op("sort")});
    if (!warm) { el("rect", {x: X + g + so, y, width: c, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 0.8, "stroke-dasharray": "3 2", opacity: op("chk")});
      if (past("t0")) el("line", {x1: X + g, y1: y - 6, x2: X + g, y2: y + h + 6, stroke: css("--hl2"), "stroke-width": 2});
      if (past("t1")) el("line", {x1: X + g + so, y1: y - 6, x2: X + g + so, y2: y + h + 6, stroke: css("--hl2"), "stroke-width": 2}); }
    if (isCur) el("rect", {x: X - 2, y: y - 9, width: g + so + c + 4, height: h + 18, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    if (slot > 22 || r % 2 === 0) el("text", {x: X + (g + so + c) / 2, y: y + h + 22, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "+" + (warm ? r : r));
  }
  el("text", {x: x0, y: 30, "font-size": 13, fill: css("--muted")}, `warm-up: ${s.W} futtatás (eldobva)`);
  el("text", {x: x0 + s.W * slot, y: 50, "font-size": 13, "font-weight": "bold"}, `mért: ${s.M} futtatás → L[1..${s.M}]`);
  el("text", {x: x0, y: y + h + 40, "font-size": 11, fill: css("--muted")}, "szám = seed-eltolás (seed + j); narancs vonal = t0/t1 – a mért ablak csak a rendezést fogja közre");
  // L kitöltöttsége
  const filled = s.run === null ? s.M : Math.max(0, s.run - s.W + (s.run >= s.W && order.indexOf(s.seg) >= order.indexOf("store") ? 1 : 0));
  el("text", {x: x0, y: 182, "font-size": 13}, `L: ${filled}/${s.M} mért érték (sematikus, nem mért adat)`);
  const cw2 = Math.min(26, 580 / s.M);
  for (let i = 0; i < s.M; i++) el("rect", {x: x0 + i * cw2, y: 190, width: cw2 - 2, height: 16, fill: i < filled ? css("--fg") : css("--cell"), stroke: css("--line"), "stroke-width": 0.6});
  const pr = p95r(s.M);
  el("text", {x: x0, y: 236, "font-size": 14, "font-weight": "bold"}, `p95 (nearest-rank): ⌈0,95·${s.M}⌉ = ${pr}. rendezett minta` + (pr === s.M ? " = a maximum" : ""));
  el("text", {x: x0, y: 258, "font-size": 13}, `medián: ` + (s.M % 2 ? `a(z) ${(s.M + 1) / 2}. minta` : `a(z) ${s.M / 2}. és ${s.M / 2 + 1}. minta átlaga`));
  el("text", {x: x0, y: 280, "font-size": 12, fill: css("--muted")}, "fehér = Generál (nem mért) · sötét = mért Rendezés · szürke = warm-up rendezés");
  el("text", {x: x0, y: 297, "font-size": 12, fill: css("--muted")}, "szaggatott keret = rendezettség-ellenőrzés t1 után (nem mért)");
}
function load(){
  const w = +document.getElementById("ww").value, m = +document.getElementById("mm").value;
  document.getElementById("wv").textContent = w; document.getElementById("mv").textContent = m;
  document.getElementById("err").textContent = `p95 rangja: ⌈0,95·${m}⌉ = ${p95r(m)}`;
  setSteps(stepsFor(w, m, 12345));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 450);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
