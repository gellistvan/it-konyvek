<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mintakeresés suffix tömbben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Szöveg: <input id="txt" value="banana" size="14" aria-label="Szöveg"></label><label>Minta: <input id="pat" value="an" size="8" aria-label="Minta"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('txt').value='banana';document.getElementById('pat').value='na';load()">Példa: na</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A banana hat rendezett szuffixa SA- és LCP-értékkel; a két bináris keresés bal, jobb és közép mutatója lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">1-alapú indexelés (16.4.1). Kezdőállapot: T = banana, P = an; várt eredmény [2, 3], kezdőpozíciók 2 és 4 (a 0-alapú Python-kódban 1 és 3).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": "alsó", "bal": 1, "jobb": 7, "mid": null, "cmp": null, "k": 0, "line": 2, "msg": "Alsó korlát: bal = 1, jobb = n + 1 = 7", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "alsó", "bal": 1, "jobb": 7, "mid": 4, "cmp": 1, "k": 1, "line": 5, "msg": "alsó korlát: bal = 1, jobb = 7, közép = 4: „banana” vs „an” → +1 (szuffix > P); jobb := 4", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "alsó", "bal": 1, "jobb": 4, "mid": 2, "cmp": 0, "k": 2, "line": 5, "msg": "alsó korlát: bal = 1, jobb = 4, közép = 2: „ana” vs „an” → 0 (P prefix); jobb := 2", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "alsó", "bal": 1, "jobb": 2, "mid": 1, "cmp": -1, "k": 1, "line": 4, "msg": "alsó korlát: bal = 1, jobb = 2, közép = 1: „a” vs „an” → −1 (szuffix < P); bal := 2", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "alsó", "bal": 2, "jobb": 2, "mid": null, "cmp": null, "k": 0, "line": 6, "msg": "alsó := bal = 2", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "felső", "bal": 1, "jobb": 7, "mid": null, "cmp": null, "k": 0, "line": 7, "msg": "Felső korlát: bal = 1, jobb = n + 1 = 7", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "felső", "bal": 1, "jobb": 7, "mid": 4, "cmp": 1, "k": 1, "line": 10, "msg": "felső korlát: bal = 1, jobb = 7, közép = 4: „banana” vs „an” → +1 (szuffix > P); jobb := 4", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "felső", "bal": 1, "jobb": 4, "mid": 2, "cmp": 0, "k": 2, "line": 9, "msg": "felső korlát: bal = 1, jobb = 4, közép = 2: „ana” vs „an” → 0 (P prefix); bal := 3", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "felső", "bal": 3, "jobb": 4, "mid": 3, "cmp": 0, "k": 2, "line": 9, "msg": "felső korlát: bal = 3, jobb = 4, közép = 3: „anana” vs „an” → 0 (P prefix); bal := 4", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "felső", "bal": 4, "jobb": 4, "mid": null, "cmp": null, "k": 0, "line": 11, "msg": "felső := bal = 4", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}, {"phase": "kész", "bal": 2, "jobb": 4, "mid": null, "cmp": null, "k": 0, "line": 12, "msg": "Eredmény: [2, 3], z = 2, kezdőpozíciók (1-alapú): 2, 4", "d": {"t": "banana", "p": "an", "sa": [6, 4, 2, 1, 5, 3], "lcp": [0, 1, 3, 0, 0, 2]}}];
const CODE = ["Össz = SzuffixÖsszehasonlítás: −1/0/+1", "KeresésSuffixTömbben(T, SA, n, P, m):", "  bal := 1; jobb := n + 1   // alsó", "  Amíg bal < jobb: közép := ⌊(bal+jobb)/2⌋", "    Ha Össz(SA[közép]) < 0: bal := közép + 1", "    Különben: jobb := közép", "  alsó := bal", "  bal := 1; jobb := n + 1   // felső", "  Amíg bal < jobb: közép := ⌊(bal+jobb)/2⌋", "    Ha Össz(SA[közép]) <= 0: bal := közép + 1", "    Különben: jobb := közép", "  felső := bal", "  térj vissza [alsó, felső − 1]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; const D = s.d, n = D.t.length; svg.setAttribute("viewBox", "0 0 560 " + (70 + n*30 + 56));
  el("text", {x: 20, y: 22, "font-size": 13}, "T = „" + D.t + "”, P = „" + D.p + "”" + (s.phase === "kész" ? "" : " · " + s.phase + " korlát"));
  ["i", "SA[i]", "szuffix", "LCP"].forEach((h, j) => el("text", {x: [30, 75, 130, 470][j], y: 52, "font-size": 12, "font-weight": "bold"}, h));
  const cw = Math.min(22, 320 / n);
  for (let r = 0; r < n; r++) {
    const y = 64 + r*30, i = r + 1, suf = D.t.slice(D.sa[r] - 1);
    const inRange = i >= s.bal && i < s.jobb && s.phase !== "kész";
    const hit = s.phase === "kész" && i >= s.bal && i < s.jobb;
    el("rect", {x: 14, y: y, width: 530, height: 26, fill: hit ? css("--cellhl") : (inRange ? css("--code") : css("--bg")), stroke: i === s.mid ? css("--hl2") : "none", "stroke-width": 3});
    el("text", {x: 30, y: y + 18, "font-size": 13}, String(i));
    el("text", {x: 80, y: y + 18, "font-size": 13}, String(D.sa[r]));
    for (let j = 0; j < suf.length; j++) {
      const cmpd = i === s.mid && j < s.k;
      el("rect", {x: 130 + j*cw, y: y + 3, width: cw, height: 20, fill: cmpd ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": cmpd && j === s.k - 1 ? 2.5 : 0.8});
      el("text", {x: 130 + j*cw + cw/2, y: y + 18, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, suf[j]);
    }
    el("rect", {x: 470, y: y + 7, width: D.lcp[r]*14, height: 12, fill: css("--muted")});
    el("text", {x: 476 + D.lcp[r]*14, y: y + 18, "font-size": 12}, String(D.lcp[r]));
  }
  // mutatók
  const py = r => 64 + (r - 1)*30 + 13;
  const mark = (r, lab, dx, col) => { el("text", {x: 4 + dx, y: py(Math.min(r, n + 1)) + 5, "font-size": 12, "font-weight": "bold", fill: col, "text-anchor": "end"}, lab); };
  if (s.phase !== "kész") {
    el("text", {x: 410, y: py(s.bal) + 5, "font-size": 12, fill: css("--hl")}, "← bal = " + s.bal);
    el("text", {x: 410, y: Math.min(py(s.jobb), 64 + n*30 + 10) + 5, "font-size": 12, fill: css("--hl")}, (s.jobb > n ? "↑ " : "← ") + "jobb = " + s.jobb);
    if (s.mid) el("text", {x: 340, y: py(s.mid) + 5, "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "közép " + (s.cmp > 0 ? "+1" : (s.cmp < 0 ? "−1" : "0")));
  }
  el("text", {x: 20, y: 64 + n*30 + 30, "font-size": 11, fill: css("--muted")}, "világos háttér = a még vizsgált [bal, jobb) tartomány · narancs keret = közép");
  el("text", {x: 20, y: 64 + n*30 + 46, "font-size": 11, fill: css("--muted")}, "szürke cellák = összehasonlított karakterek · sötét háttér = találatok (végeredmény)");
}
function sufArr(t){ const n = t.length, sa = []; for (let i = 1; i <= n; i++) sa.push(i);
  sa.sort((a, b) => { const x = t.slice(a-1), y = t.slice(b-1); return x < y ? -1 : (x > y ? 1 : 0); });
  const lc = [0]; for (let i = 1; i < n; i++) { const x = t.slice(sa[i-1]-1), y = t.slice(sa[i]-1); let k = 0; while (k < x.length && k < y.length && x[k] === y[k]) k++; lc.push(k); }
  return [sa, lc]; }
function cmp(t, s, p){ const n = t.length, m = p.length; let k = 1;
  while (k <= m && s + k - 1 <= n) { if (t[s+k-2] < p[k-1]) return [-1, k]; if (t[s+k-2] > p[k-1]) return [1, k]; k++; }
  return k > m ? [0, k-1] : [-1, k-1]; }
function search(t, p){
  const [sa, lc] = sufArr(t), n = t.length, d = {t, p, sa, lcp: lc}, st = [], res = {};
  [["alsó", 2, 4, 6], ["felső", 7, 9, 11]].forEach(([ph, l0, lt, le]) => {
    let bal = 1, jobb = n + 1;
    st.push({d, phase: ph, bal, jobb, mid: null, cmp: null, k: 0, line: l0, msg: `${ph[0].toUpperCase() + ph.slice(1)} korlát: bal = 1, jobb = n + 1 = ${n+1}`});
    while (bal < jobb) {
      const mid = Math.floor((bal + jobb) / 2), [c, k] = cmp(t, sa[mid-1], p), suf = t.slice(sa[mid-1]-1);
      const right = ph === "alsó" ? c < 0 : c <= 0;
      const sg = c < 0 ? "−1 (szuffix < P)" : (c === 0 ? "0 (P prefix)" : "+1 (szuffix > P)");
      st.push({d, phase: ph, bal, jobb, mid, cmp: c, k, line: right ? lt : lt + 1,
               msg: `${ph} korlát: bal = ${bal}, jobb = ${jobb}, közép = ${mid}: „${suf}” vs „${p}” → ${sg}; ` + (right ? `bal := ${mid+1}` : `jobb := ${mid}`)});
      if (right) bal = mid + 1; else jobb = mid;
    }
    res[ph] = bal;
    st.push({d, phase: ph, bal, jobb, mid: null, cmp: null, k: 0, line: le, msg: `${ph} := bal = ${bal}`});
  });
  const a = res["alsó"], b = res["felső"] - 1, pos = [];
  for (let i = a; i <= b; i++) pos.push(sa[i-1]); pos.sort((x, y) => x - y);
  st.push({d, phase: "kész", bal: a, jobb: b + 1, mid: null, cmp: null, k: 0, line: 12,
           msg: `Eredmény: [${a}, ${b}]` + (a <= b ? `, z = ${b-a+1}, kezdőpozíciók (1-alapú): ${pos.join(", ")}` : " (üres, P nem fordul elő)")});
  return st;
}
function load(){
  const t = document.getElementById("txt").value.trim(), p = document.getElementById("pat").value.trim(), e = document.getElementById("err");
  if (t.length < 1 || t.length > 14 || p.length < 1 || p.length > 8) { e.textContent = "Szöveg: 1–14, minta: 1–8 karakter."; return; }
  e.textContent = ""; setSteps(search(t, p));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
