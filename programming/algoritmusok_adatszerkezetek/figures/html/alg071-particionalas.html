<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervallumparticionálás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Intervallumok: <input id="inp" size="34" aria-label="Saját intervallumok" value="(0,3), (0,4), (2,5), (3,6), (4,7), (6,8)"></label><label>Sorrend: <select id="by" onchange="load()" aria-label="Rendezési sorrend"><option value="start">kezdési idő</option><option value="finish">befejezési idő</option></select></label><button onclick="load()">Betöltés</button><button onclick="ce()">Ellenpélda</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat intervallum három erőforrás-sávon; a 6. lépésben a (6,8) a 3. erőforrásra kerül, mert Q minimuma (5, 3)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.2.3 pszeudokódja; félig nyitott intervallumok, Q kulcsa (utolsó befejezés, erőforrás-azonosító). Az „Ellenpélda” a [0,1), [0,2), [1,4), [2,3) bemenet: kezdési sorrenddel 2, befejezési sorrenddel 3 sáv.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["Intervallumparticionálás(s, f, n):", "    Rendezés s_i szerint; d = 0; Q = üres", "    for i = 1 to n:", "        if Q nem üres és Q.min_key().idő <= s_i:", "            (utolsó, j) = Q.extract_min()", "            hozzárendelés[id_i] = j; Q.insert(f_i, j)", "        else:", "            d = d + 1; hozzárendelés[id_i] = d", "            Q.insert(f_i, d)", "    return d és hozzárendelés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function part(iv, by){
  const ord = iv.map((x, i) => i).sort((a, b) => by === "start" ? iv[a][0] - iv[b][0] : iv[a][1] - iv[b][1]);
  let Q = [], d = 0; const asg = {}; const key = (a, b) => a[0] - b[0] || a[1] - b[1];
  const st = [{iv, asg: {}, Q: [], cur: -1, d: 0, line: 1, msg: `Rendezés ${by === "start" ? "kezdési" : "befejezési"} idő szerint: ` + ord.map(i => `(${iv[i]})`).join(", ") + "; d = 0, Q = ∅"}];
  ord.forEach((i, k) => { const [s, f] = iv[i]; Q.sort(key); const before = Q.map(q => q.slice()); let msg, line;
    if (Q.length && Q[0][0] <= s) { const [last, j] = Q.shift(); asg[i] = j; Q.push([f, j]); line = 5;
      msg = `${k + 1}. lépés (${s},${f}): Q minimuma (${last}, ${j}), ${last} ≤ ${s} → a ${j}. erőforrásra; új kulcs (${f}, ${j})`; }
    else { d++; asg[i] = d; Q.push([f, d]); line = 8;
      msg = `${k + 1}. lépés (${s},${f}): ` + (before.length ? `Q minimuma (${before[0]}), ${s} < ${before[0][0]}` : "Q üres") + ` → új erőforrás ${d}`; }
    Q.sort(key); st.push({iv, asg: {...asg}, Q: before, Qafter: Q.map(q => q.slice()), cur: i, d, line, msg}); });
  // maximális átfedés
  const ev = []; iv.forEach(([s, f]) => { ev.push([s, 1]); ev.push([f, -1]); }); ev.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  let c = 0, m = 0, at = null; ev.forEach(([t, x]) => { c += x; if (c > m) { m = c; at = t; } });
  st.push({iv, asg: {...asg}, Q: [], cur: -1, d, line: 9, mo: m, at,
           msg: `Vége: ${d} erőforrás; maximális átfedés ${m} (t = ${at}-tól)` + (d === m ? " → optimális" : ` → ${d} > ${m}, NEM optimális (befejezés szerinti sorrend)`)});
  return st;
}
function render(s){
  svg.innerHTML = ""; const iv = s.iv, D = Math.max(1, s.d, ...Object.values(s.asg));
  const T = Math.max(...iv.map(x => x[1])), t0 = Math.min(0, ...iv.map(x => x[0]));
  const L = 100, R = 540, X = t => L + (R - L) * (t - t0) / (T - t0), Y = j => 30 + (j - 1) * 46;
  svg.setAttribute("viewBox", `0 0 560 ${Y(D) + 140}`);
  el("defs", {}).innerHTML = `<pattern id="p2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.5"/></pattern>` +
    `<pattern id="p3" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--fg")}"/></pattern>`;
  const fill = j => j % 3 === 1 ? css("--cellhl") : j % 3 === 2 ? "url(#p2)" : "url(#p3)";
  if (s.mo) el("rect", {x: X(s.at), y: 10, width: Math.max(4, X(s.at + 1) - X(s.at)), height: Y(D) + 20, fill: "none", stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "5 3"});
  if (s.d === 0) el("text", {x: L, y: Y(1) + 5, "font-size": 13, fill: css("--muted")}, "még nincs erőforrás; feldolgozandó: " + iv.map(x => `[${x[0]},${x[1]})`).join(", "));
  for (let j = 1; j <= s.d; j++) el("text", {x: L - 8, y: Y(j) + 5, "text-anchor": "end", "font-size": 13}, j + ". erőforrás");
  iv.forEach((x, i) => { const j = s.asg[i]; if (j === undefined) return;
    el("rect", {x: X(x[0]) + 1, y: Y(j) - 15, width: X(x[1]) - X(x[0]) - 2, height: 30, fill: fill(j), stroke: css("--line"), "stroke-width": i === s.cur ? 4 : 1.2});
    el("rect", {x: (X(x[0]) + X(x[1])) / 2 - 22, y: Y(j) - 9, width: 44, height: 18, fill: css("--bg"), opacity: 0.85});
    el("text", {x: (X(x[0]) + X(x[1])) / 2, y: Y(j) + 5, "text-anchor": "middle", "font-size": 12}, `[${x[0]},${x[1]})`); });
  const yb = Y(Math.max(1, D)) + 28; el("line", {x1: L, y1: yb, x2: R, y2: yb, stroke: css("--line")});
  for (let t = t0; t <= T; t++) el("text", {x: X(t), y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t));
  if (s.cur >= 0) { el("text", {x: 10, y: yb + 44, "font-size": 13}, "Q a lépés előtt: " + (s.Q.length ? s.Q.map(q => `(${q[0]}, ${q[1]})`).join(", ") : "∅") + "   (első = minimum)");
    el("text", {x: 10, y: yb + 64, "font-size": 13}, "Q a lépés után: " + s.Qafter.map(q => `(${q[0]}, ${q[1]})`).join(", ")); }
  el("text", {x: 10, y: yb + 90, "font-size": 11, fill: css("--muted")}, "vastag keret = aktuális intervallum · szaggatott keret = a maximális átfedés kezdete");
}
function load(){
  const m = [...document.getElementById("inp").value.matchAll(/[\[(]\s*(-?\d+)\s*,\s*(-?\d+)\s*[\])]/g)].map(x => [+x[1], +x[2]]);
  const err = document.getElementById("err");
  if (m.length < 1 || m.length > 14 || m.some(([s, f]) => !(s < f))) { err.textContent = "1–14 intervallum, (s, f) alakban, s < f."; return; }
  err.textContent = ""; setSteps(part(m, document.getElementById("by").value));
}
function ce(){ document.getElementById("inp").value = "[0,1), [0,2), [1,4), [2,3)"; load(); }

STEPS = part([[0, 3], [0, 4], [2, 5], [3, 6], [4, 7], [6, 8]], "start");


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
