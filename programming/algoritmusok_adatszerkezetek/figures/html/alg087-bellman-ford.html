<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellman–Ford körönként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>élsorrend: <select id="ord" onchange="reload()" aria-label="Élsorrend"><option value="book">a könyv sorrendje</option><option value="rev">fordított sorrend</option></select></label><label><input id="neg" type="checkbox" onchange="reload()"> 4→1 súlya −4 (negatív kör: 2→4→1→2 = −2)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négycsúcsú irányított gráf negatív élekkel; a Bellman–Ford élenként relaxál, az 1. kör után d = [0, 2, 5, 2], a 2. kör után d = [0, 2, 5, 0], az ellenőrző körben nincs javulás."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Forrás: 1; helyben frissítés. Kezdőállapot: indítás, majd 6 él × 3 kör és az ellenőrző kör. A fordított élsorrendnél több kör kell a végleges értékekhez; a −4 súlyú 4→1 éllel az ellenőrző kör „negatív kör van” jelzést ad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"d": [0, null, null, null], "pi": [null, null, null, null], "rnd": 0, "e": null, "imp": false, "line": 4, "msg": "Indítás: d[1] = 0, a többi ∞", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 4, null, null], "pi": [null, 1, null, null], "rnd": 1, "e": [1, 2], "imp": true, "line": 9, "msg": "1. kör, (1,2): d[1] + (4) = 4 < ∞ → d[2] = 4, π[2] = 1", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 4, 5, null], "pi": [null, 1, 1, null], "rnd": 1, "e": [1, 3], "imp": true, "line": 9, "msg": "1. kör, (1,3): d[1] + (5) = 5 < ∞ → d[3] = 5, π[3] = 1", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 4, 5, 2], "pi": [null, 1, 1, 2], "rnd": 1, "e": [2, 4], "imp": true, "line": 9, "msg": "1. kör, (2,4): d[2] + (−2) = 2 < ∞ → d[4] = 2, π[4] = 2", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 2], "pi": [null, 3, 1, 2], "rnd": 1, "e": [3, 2], "imp": true, "line": 9, "msg": "1. kör, (3,2): d[3] + (−3) = 2 < 4 → d[2] = 2, π[2] = 3", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 2], "pi": [null, 3, 1, 2], "rnd": 1, "e": [3, 4], "imp": false, "line": 7, "msg": "1. kör, (3,4): d[3] + (1) = 6 ≥ 2, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 2], "pi": [null, 3, 1, 2], "rnd": 1, "e": [4, 1], "imp": false, "line": 7, "msg": "1. kör, (4,1): d[4] + (2) = 4 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 2], "pi": [null, 3, 1, 2], "rnd": 2, "e": [1, 2], "imp": false, "line": 7, "msg": "2. kör, (1,2): d[1] + (4) = 4 ≥ 2, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 2], "pi": [null, 3, 1, 2], "rnd": 2, "e": [1, 3], "imp": false, "line": 7, "msg": "2. kör, (1,3): d[1] + (5) = 5 ≥ 5, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 2, "e": [2, 4], "imp": true, "line": 9, "msg": "2. kör, (2,4): d[2] + (−2) = 0 < 2 → d[4] = 0, π[4] = 2", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 2, "e": [3, 2], "imp": false, "line": 7, "msg": "2. kör, (3,2): d[3] + (−3) = 2 ≥ 2, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 2, "e": [3, 4], "imp": false, "line": 7, "msg": "2. kör, (3,4): d[3] + (1) = 6 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 2, "e": [4, 1], "imp": false, "line": 7, "msg": "2. kör, (4,1): d[4] + (2) = 2 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [1, 2], "imp": false, "line": 7, "msg": "3. kör, (1,2): d[1] + (4) = 4 ≥ 2, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [1, 3], "imp": false, "line": 7, "msg": "3. kör, (1,3): d[1] + (5) = 5 ≥ 5, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [2, 4], "imp": false, "line": 7, "msg": "3. kör, (2,4): d[2] + (−2) = 0 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [3, 2], "imp": false, "line": 7, "msg": "3. kör, (3,2): d[3] + (−3) = 2 ≥ 2, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [3, 4], "imp": false, "line": 7, "msg": "3. kör, (3,4): d[3] + (1) = 6 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 3, "e": [4, 1], "imp": false, "line": 7, "msg": "3. kör, (4,1): d[4] + (2) = 2 ≥ 0, nincs változás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [1, 2], "imp": false, "line": 12, "msg": "Ellenőrző kör, (1,2): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [1, 3], "imp": false, "line": 12, "msg": "Ellenőrző kör, (1,3): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [2, 4], "imp": false, "line": 12, "msg": "Ellenőrző kör, (2,4): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [3, 2], "imp": false, "line": 12, "msg": "Ellenőrző kör, (3,2): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [3, 4], "imp": false, "line": 12, "msg": "Ellenőrző kör, (3,4): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": [4, 1], "imp": false, "line": 12, "msg": "Ellenőrző kör, (4,1): nincs javulás", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}, {"d": [0, 2, 5, 0], "pi": [null, 3, 1, 2], "rnd": 4, "e": null, "imp": false, "line": 14, "msg": "Ellenőrző kör: nincs javulás, nincs negatív kör; d = [0, 2, 5, 0]", "E": [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]]}];
const CODE = ["BellmanFord(G, w, s):", "1   n ← |V|", "2   d[1..n] ← [∞, ..., ∞]", "3   π[1..n] ← [NIL, ..., NIL]", "4   d[s] ← 0", "5   for i ← 1 to n-1 do", "6       for each (u,v) in E do", "7           if d[u] != ∞ and d[u] + w(u,v) < d[v] then", "8               d[v] ← d[u] + w(u,v)", "9               π[v] ← u", "10  // negatív kör ellenőrzése", "11  for each (u,v) in E do", "12      if d[u] != ∞ and d[u] + w(u,v) < d[v] then", "13          return \"negatív kör van\"", "14  return d"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VV = [1, 2, 3, 4], BASE = [[1, 2, 4], [1, 3, 5], [2, 4, -2], [3, 2, -3], [3, 4, 1], [4, 1, 2]];
const fm = x => x === null || x === Infinity ? "∞" : String(x).replace("-", "−");
function curE(){ let E = BASE.map(e => e.slice()); if (document.getElementById("neg") && document.getElementById("neg").checked) E = E.map(e => (e[0] === 4 && e[1] === 1) ? [4, 1, -4] : e);
  if (document.getElementById("ord") && document.getElementById("ord").value === "rev") E = E.slice().reverse(); return E; }
function bf(E, s){
  const n = VV.length, d = {}, pi = {}; VV.forEach(v => { d[v] = Infinity; pi[v] = null; }); d[s] = 0;
  const snap = o => Object.assign({d: VV.map(v => d[v] === Infinity ? null : d[v]), pi: VV.map(v => pi[v]), E}, o);
  const st = [snap({rnd: 0, e: null, imp: false, line: 4, msg: `Indítás: d[${s}] = 0, a többi ∞`})];
  for (let i = 1; i < n; i++) for (const [u, v, w] of E) { const ok = d[u] !== Infinity && d[u] + w < d[v], old = d[v];
    if (ok) { d[v] = d[u] + w; pi[v] = u; }
    st.push(snap({rnd: i, e: [u, v], imp: ok, line: ok ? 9 : 7, msg: `${i}. kör, (${u},${v}): ` + (d[u] === Infinity && !ok ? "d[u] = ∞, kihagyva" : `d[${u}] + (${fm(w)}) = ${fm(d[u] + w)} ` + (ok ? `< ${fm(old)} → d[${v}] = ${fm(d[v])}, π[${v}] = ${u}` : `≥ ${fm(old)}, nincs változás`))})); }
  let neg = false;
  for (const [u, v, w] of E) { const bad = d[u] !== Infinity && d[u] + w < d[v];
    st.push(snap({rnd: n, e: [u, v], imp: bad, line: bad ? 13 : 12, msg: `Ellenőrző kör, (${u},${v}): ` + (bad ? `d[${u}] + (${fm(w)}) = ${fm(d[u] + w)} < ${fm(d[v])} → negatív kör van` : "nincs javulás")}));
    if (bad) { neg = true; break; } }
  if (!neg) st.push(snap({rnd: n, e: null, imp: false, line: 14, msg: "Ellenőrző kör: nincs javulás, nincs negatív kör; d = [" + VV.map(v => fm(d[v])).join(", ") + "]"}));
  return st;
}
const P = {1: [120, 60], 2: [330, 60], 3: [120, 240], 4: [330, 240]};
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300");
  svg.innerHTML = '<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker>'
    + '<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const E = s.E || BASE;
  E.forEach(([u, v, w]) => { const [x0, y0] = P[u], [x1, y1] = P[v], L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
    const X0 = x0 + ux * 22, Y0 = y0 + uy * 22, X1 = x1 - ux * 24, Y1 = y1 - uy * 24, cur = s.e && s.e[0] === u && s.e[1] === v, tree = s.pi[v - 1] === u;
    if (tree && !cur) { el("line", {x1: X0, y1: Y0, x2: X1 - ux * 6, y2: Y1 - uy * 6, stroke: css("--line"), "stroke-width": 7}); el("line", {x1: X0, y1: Y0, x2: X1 - ux * 6, y2: Y1 - uy * 6, stroke: css("--bg"), "stroke-width": 3});
      el("path", {d: `M${X1},${Y1}L${X1 - ux * 11 - uy * 6},${Y1 - uy * 11 + ux * 6}L${X1 - ux * 11 + uy * 6},${Y1 - uy * 11 - ux * 6}Z`, fill: css("--line")}); }
    else el("line", {x1: X0, y1: Y0, x2: X1, y2: Y1, stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? (s.imp ? 4.5 : 2.5) : 1.4, "stroke-dasharray": w < 0 && !cur ? "8 3 2 3" : (cur && !s.imp ? "6 4" : "none"), "marker-end": cur ? "url(#m2)" : "url(#m1)"});
    const t = (u === 3 && v === 2) || (u === 4 && v === 1) ? 0.3 : 0.5;
    el("rect", {x: x0 + (x1 - x0) * t - 14, y: y0 + (y1 - y0) * t - 10, width: 28, height: 18, fill: css("--bg")});
    el("text", {x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t + 4, "text-anchor": "middle", "font-size": 13, fill: w < 0 ? css("--hl2") : css("--fg")}, fm(w)); });
  VV.forEach(v => { const [x, y] = P[v]; el("circle", {cx: x, cy: y, r: 20, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15}, String(v));
    el("text", {x, y: y + (y < 150 ? -30 : 40), "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "d = " + fm(s.d[v - 1])); });
  const tx = 430; el("text", {x: tx, y: 30, "font-size": 13, "font-weight": "bold"}, s.rnd === 0 ? "indítás" : (s.rnd < 4 ? s.rnd + ". kör" : "ellenőrző kör"));
  [["v", "d", "π"]].concat(VV.map(v => [v, fm(s.d[v - 1]), s.pi[v - 1] === null ? "NIL" : s.pi[v - 1]])).forEach((r, i) => r.forEach((c, j) => el("text", {x: tx + 10 + j * 45, y: 58 + i * 20, "text-anchor": "middle", "font-size": 13, "font-weight": i === 0 ? "bold" : "normal"}, String(c))));
  el("text", {x: tx, y: 180, "font-size": 12, fill: css("--muted")}, "élsorrend:");
  E.forEach(([u, v], i) => el("text", {x: tx + (i % 3) * 52, y: 198 + Math.floor(i / 3) * 17, "font-size": 12, "font-weight": s.e && s.e[0] === u && s.e[1] === v ? "bold" : "normal"}, `(${u},${v})`));
}
function reload(){ setSteps(bf(curE(), 1)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
