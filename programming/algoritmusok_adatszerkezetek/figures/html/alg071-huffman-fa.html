<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huffman-fa építése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Gyakoriságok: <input id="inp" size="36" aria-label="Saját gyakoriságlista" value="a:45, b:13, c:12, d:16, e:9, f:5"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A Huffman-fa öt összevonási lépése: 14, 25, 30, 55, 100; a végső kódok a:0, b:101, c:100, d:111, e:1101, f:1100."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.2.2 pszeudokódja; holtversenynél a korábban beszúrt csomópont jön ki előbb. Bal gyermek = az elsőként kivett (0), jobb = a második (1). Kezdőállapot: a könyv a:45 … f:5 példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1, "roots": [], "Q": []}];
const CODE = ["Huffman(C, p, n):", "    Q = üres minimum-kupac", "    for i = 1 to n: Q.insert(leaf(c_i, p_i))", "    for i = 1 to n-1:", "        x = Q.extract_min()", "        y = Q.extract_min()", "        z = új csúcs: freq x+y, bal x, jobb y", "        Q.insert(z)", "    return Q.extract_min()  // a gyökér"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let NODES = [], PATH = null;
function huffman(freq){
  NODES = freq.map(([ch, f]) => ({f, ch, l: null, r: null}));
  let Q = NODES.map((d, i) => [d.f, i, i]), seq = NODES.length;
  const key = (a, b) => a[0] - b[0] || a[1] - b[1];
  Q.sort(key);
  const st = [{roots: Q.map(q => q[2]), Q: Q.map(q => q[0]), x: null, y: null, z: null, line: 2,
               msg: `Kezdet: ${freq.length} levél a minimum-kupacban; Q = ${Q.map(q => q[0]).join(", ")}`}];
  for (let k = 1; k < freq.length; k++) {
    const qx = Q.shift(), qy = Q.shift(), z = NODES.length;
    st.push({roots: Q.map(q => q[2]).concat([qx[2], qy[2]]), Q: Q.map(q => q[0]), x: qx[2], y: qy[2], z: null, line: 5,
             msg: `${k}. lépés: x = extract_min() = ${lab(qx[2])}, y = extract_min() = ${lab(qy[2])}`});
    NODES.push({f: qx[0] + qy[0], ch: null, l: qx[2], r: qy[2]});
    Q.push([qx[0] + qy[0], seq++, z]); Q.sort(key);
    st.push({roots: Q.map(q => q[2]), Q: Q.map(q => q[0]), x: qx[2], y: qy[2], z, line: 7,
             msg: `${k}. lépés: ${lab(qx[2])} + ${lab(qy[2])} → ${qx[0] + qy[0]}; insert; Q = ${Q.map(q => q[0]).join(", ")}`});
  }
  const C = {}; const walk = (n, p) => { const d = NODES[n]; if (d.ch !== null) { C[d.ch] = p || "0"; return; } walk(d.l, p + "0"); walk(d.r, p + "1"); };
  const root = st[st.length - 1].roots[0]; walk(root, "");
  let L = 0, T = 0; freq.forEach(([ch, f]) => { L += f * C[ch].length; T += f; });
  st.push({roots: [root], Q: [], x: null, y: null, z: root, line: 8, done: true, C,
           msg: `Kész: gyökér ${NODES[root].f}; L = ${L} bit / ${T} karakter = ${(L / T).toFixed(2).replace(".", ",")} bit/karakter. Kattintson egy levélre!`});
  return st;
}
function lab(n){ const d = NODES[n]; return d.ch !== null ? d.ch + ":" + d.f : String(d.f); }
function minLeaf(n){ const d = NODES[n]; return d.ch !== null ? n : Math.min(minLeaf(d.l), minLeaf(d.r)); }
let CURS = null;
function render(s){
  CURS = s; svg.innerHTML = "";
  const pos = {}; let nx = 0, maxd = 0;
  const walk = (n, dep) => { const d = NODES[n]; maxd = Math.max(maxd, dep);
    if (d.ch !== null) { pos[n] = [nx, dep]; nx += 1; return; } walk(d.l, dep + 1); walk(d.r, dep + 1); pos[n] = [(pos[d.l][0] + pos[d.r][0]) / 2, dep]; };
  s.roots.slice().sort((a, b) => minLeaf(a) - minLeaf(b)).forEach(r => { walk(r, 0); nx += 0.4; });
  const W = Math.max(nx, 4), dx = Math.min(80, 520 / W), H = 90 + (maxd + 1) * 62;
  svg.setAttribute("viewBox", `0 0 560 ${Math.max(300, H)}`);
  const X = v => 20 + dx * (v + 0.5) + (520 - dx * W) / 2, Y = d => 40 + d * 62;
  const onPath = new Set(PATH && s.done ? PATH : []);
  for (const n in pos) { const d = NODES[n]; if (d.ch !== null) continue;
    [[d.l, "0"], [d.r, "1"]].forEach(([c, b]) => { const hot = onPath.has(+c) && onPath.has(+n);
      el("line", {x1: X(pos[n][0]), y1: Y(pos[n][1]), x2: X(pos[c][0]), y2: Y(pos[c][1]), stroke: hot ? css("--hl2") : css("--line"), "stroke-width": hot ? 4 : 1.4});
      el("text", {x: (X(pos[n][0]) + X(pos[c][0])) / 2 + (b === "0" ? -9 : 9), y: (Y(pos[n][1]) + Y(pos[c][1])) / 2, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, b); }); }
  for (const n in pos) { const d = NODES[n], x = X(pos[n][0]), y = Y(pos[n][1]), sel = +n === s.x || +n === s.y, nw = +n === s.z;
    if (d.ch !== null) { const r = el("rect", {x: x - 24, y: y - 13, width: 48, height: 26, fill: sel ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": sel ? 3.5 : 1.2});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, lab(n));
      if (s.done) { r.style.cursor = "pointer"; r.addEventListener("click", () => pick(+n));
        el("text", {x, y: y + 30, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, s.C[d.ch]); } }
    else { el("circle", {cx: x, cy: y, r: 17, fill: sel ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": nw || sel ? 3.5 : 1.2});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, lab(n)); } }
  if (!s.done) el("text", {x: 280, y: H - 8, "text-anchor": "middle", "font-size": 13}, "Q (növekvő): " + (s.Q.length ? s.Q.join(", ") : "∅"));
  el("text", {x: 10, y: 16, "font-size": 11, fill: css("--muted")}, "téglalap = levél · kör = belső csomópont · vastag keret = kivett / új csomópont · bal él 0, jobb él 1");
}
function pick(n){
  const par = {}; NODES.forEach((d, i) => { if (d.ch === null) { par[d.l] = i; par[d.r] = i; } });
  PATH = [n]; let c = n; while (par[c] !== undefined) { c = par[c]; PATH.push(c); }
  render(CURS); status.textContent = `${NODES[n].ch}: a gyökértől ${CURS.C[NODES[n].ch]} (bal = 0, jobb = 1), ${CURS.C[NODES[n].ch].length} bit`;
}
function load(){
  const m = [...document.getElementById("inp").value.matchAll(/([^\s,:;]+)\s*:\s*(\d+)/g)].map(x => [x[1], +x[2]]);
  const err = document.getElementById("err");
  if (m.length < 2 || m.length > 10 || m.some(x => x[1] <= 0) || new Set(m.map(x => x[0])).size !== m.length) { err.textContent = "2–10 különböző karakter, pozitív gyakoriság (pl. a:45, b:13)."; return; }
  err.textContent = ""; PATH = null; setSteps(huffman(m));
}

STEPS = huffman([['a', 45], ['b', 13], ['c', 12], ['d', 16], ['e', 9], ['f', 5]]);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
