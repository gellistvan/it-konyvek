<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kifejezésfa bejárásai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bejárás: <select id="kind" onchange="reload()" aria-label="Bejárás"><option value="pre">preorder</option><option value="in">inorder (zárójelezve)</option><option value="post">postorder</option><option value="level">szintfolytonos</option></select></label><label><input id="evm" type="checkbox" checked onchange="show(k)"> postorder: kiértékelés veremmel</label><label>Saját kifejezés: <input id="expr" value="(3 + 5) * (2 - 8)" size="20" aria-label="Saját kifejezés"></label><button onclick="load()">Fa felépítése</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A ((3 + 5) * (2 − 8)) kifejezésfa; a választott bejárás lépésenként kiemeli a csúcsokat, mellette a rekurziós verem vagy a sor, alul a kimenet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a könyv ((3 + 5) * (2 − 8)) fája preorder bejárással. A saját kifejezésben a * és / erősebben köt, mint a + és −; balról jobbra kötnek.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"cur": null, "stack": [], "q": [], "out": "", "ev": [], "line": -1, "msg": "preorder bejárás indul a gyökérből (*)."}, {"cur": "r", "stack": ["r"], "q": [], "out": "*", "ev": [], "line": 2, "msg": "KIÍR(*)"}, {"cur": "p", "stack": ["r", "p"], "q": [], "out": "* +", "ev": [], "line": 2, "msg": "KIÍR(+)"}, {"cur": "a", "stack": ["r", "p", "a"], "q": [], "out": "* + 3", "ev": [], "line": 2, "msg": "KIÍR(3)"}, {"cur": "b", "stack": ["r", "p", "b"], "q": [], "out": "* + 3 5", "ev": [], "line": 2, "msg": "KIÍR(5)"}, {"cur": "m", "stack": ["r", "m"], "q": [], "out": "* + 3 5 -", "ev": [], "line": 2, "msg": "KIÍR(−)"}, {"cur": "c", "stack": ["r", "m", "c"], "q": [], "out": "* + 3 5 - 2", "ev": [], "line": 2, "msg": "KIÍR(2)"}, {"cur": "d", "stack": ["r", "m", "d"], "q": [], "out": "* + 3 5 - 2 8", "ev": [], "line": 2, "msg": "KIÍR(8)"}, {"cur": null, "stack": [], "q": [], "out": "* + 3 5 - 2 8", "ev": [], "line": -1, "msg": "Vége. preorder: * + 3 5 - 2 8"}];
const CODE = ["Bejár(x):", "    ha x = NIL: vissza", "    [preorder]  KIÍR(x)", "    Bejár(x.bal)", "    [inorder]   KIÍR(x)   (zárójelezve: „(” belépéskor, „)” kilépéskor)", "    Bejár(x.jobb)", "    [postorder] KIÍR(x)", "Szintfolytonos(gyökér):  Q ← [gyökér]", "    amíg Q nem üres: x ← Q.KI(); KIÍR(x); Q.BE(x.bal); Q.BE(x.jobb)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TREE = {"r": ["*", "p", "m"], "p": ["+", "a", "b"], "m": ["−", "c", "d"], "a": ["3", null, null], "b": ["5", null, null], "c": ["2", null, null], "d": ["8", null, null]}, ROOT = "r", KIND = "pre";
const NAME = {pre: "preorder", in: "inorder (zárójelezve)", post: "postorder", level: "szintfolytonos"};
const LINE = {pre: 2, in: 4, post: 6, level: 8};
const asc = s => s.replace("−", "-");
const fmt = v => (Number.isInteger(v) ? String(v) : String(+v.toPrecision(3))).replace("-", "−").replace(".", ",");
const par = v => v >= 0 ? fmt(v) : "(" + fmt(v) + ")";
function apply(op, x, y){ return op === "+" ? x + y : op === "−" ? x - y : op === "*" ? x * y : (y ? x / y : NaN); }
function trace(tree, root, kind){
  const st = [], out = [], ev = [];
  st.push({cur: null, stack: [], q: [], out: "", ev: [], line: -1, msg: `${NAME[kind]} bejárás indul a gyökérből (${tree[root][0]}).`});
  const snap = (cur, stack, q, extra) => st.push({cur, stack: stack.slice(), q: q.slice(), out: kind !== "in" ? out.join(" ") : out.join(""), ev: ev.slice(), line: LINE[kind], msg: `KIÍR(${tree[cur][0]})` + (extra || "")});
  if (kind === "level") {
    const q = [root];
    while (q.length) { const x = q.shift(); out.push(asc(tree[x][0])); for (const c of tree[x].slice(1)) if (c) q.push(c);
      snap(x, [], q, `; a sor: [${q.map(c => tree[c][0]).join(", ")}]`); }
  } else {
    const rec = (x, stack) => {
      if (x === null) return;
      const [lab, l, r] = tree[x]; stack = stack.concat([x]); const leaf = l === null && r === null;
      if (kind === "pre") { out.push(asc(lab)); snap(x, stack, []); }
      if (kind === "in" && !leaf) out.push("(");
      rec(l, stack);
      if (kind === "in") { out.push(leaf ? asc(lab) : ` ${asc(lab)} `); snap(x, stack, []); }
      rec(r, stack);
      if (kind === "in" && !leaf) out.push(")");
      if (kind === "post") { out.push(asc(lab)); let extra;
        if (leaf) { ev.push(parseFloat(lab)); extra = `; kiértékelés: push ${lab}`; }
        else { const yv = ev.pop(), xv = ev.pop(); ev.push(apply(lab, xv, yv)); extra = `; kiértékelés: ${par(xv)} ${lab} ${par(yv)} = ${fmt(ev[ev.length-1])}`; }
        snap(x, stack, [], extra); }
    };
    rec(root, []);
  }
  const fin = kind !== "in" ? out.join(" ") : out.join("");
  st.push({cur: null, stack: [], q: [], out: fin, ev: ev.slice(), line: -1, msg: `Vége. ${NAME[kind]}: ${fin}` + (kind === "post" ? `; a kifejezés értéke ${fmt(ev[0])}` : "")});
  return st;
}
function layout(tree, root){ const pos = {}; let c = 0, dmax = 0;
  const rec = (x, d) => { if (x === null) return; rec(tree[x][1], d + 1); pos[x] = [c++, d]; dmax = Math.max(dmax, d); rec(tree[x][2], d + 1); };
  rec(root, 0); return {pos, n: c, dmax}; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const L = layout(TREE, ROOT), dx = Math.min(70, 360 / Math.max(1, L.n)), dy = Math.min(62, 190 / Math.max(1, L.dmax)), X = i => 30 + dx/2 + i * dx, Y = d => 30 + d * dy;
  for (const [x, [lab, l, r]] of Object.entries(TREE)) for (const c of [l, r]) if (c) el("line", {x1: X(L.pos[x][0]), y1: Y(L.pos[x][1]), x2: X(L.pos[c][0]), y2: Y(L.pos[c][1]), stroke: css("--line"), "stroke-width": 1.4});
  const onStack = new Set(s.stack), inQ = new Set(s.q);
  for (const [x, [lab, l, r]] of Object.entries(TREE)) {
    const cx = X(L.pos[x][0]), cy = Y(L.pos[x][1]), cur = x === s.cur, leaf = l === null && r === null;
    const fill = cur ? css("--hl") : (onStack.has(x) || inQ.has(x)) ? css("--cellhl") : css("--cell");
    if (leaf) el("rect", {x: cx - 17, y: cy - 17, width: 34, height: 34, fill, stroke: css("--line"), "stroke-width": cur ? 3 : 1.4});
    else el("circle", {cx, cy, r: 18, fill, stroke: css("--line"), "stroke-width": cur ? 3 : 1.4});
    el("text", {x: cx, y: cy + 6, "text-anchor": "middle", "font-size": 17, fill: cur ? css("--bg") : css("--fg")}, lab);
  }
  const px = 420;
  el("text", {x: px, y: 24, "font-size": 13, "font-weight": "bold"}, KIND === "level" ? "sor (Q)" : "rekurziós verem");
  const items = KIND === "level" ? s.q : s.stack.slice().reverse();
  items.forEach((x, i) => { el("rect", {x: px, y: 34 + i * 26, width: 120, height: 24, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: px + 60, y: 51 + i * 26, "text-anchor": "middle", "font-size": 13}, KIND === "level" ? TREE[x][0] : `Bejár(${TREE[x][0]})`); });
  if (KIND === "post" && document.getElementById("evm").checked) {
    el("text", {x: px, y: 214, "font-size": 13, "font-weight": "bold"}, "kiértékelő verem");
    el("text", {x: px, y: 234, "font-size": 14}, "[" + s.ev.map(fmt).join(", ") + "]");
  }
  el("text", {x: 20, y: 270, "font-size": 13, fill: css("--muted")}, "kimenet:");
  el("text", {x: 80, y: 270, "font-size": 15, "font-family": "ui-monospace,monospace"}, s.out.replace(/-/g, "−"));
  el("text", {x: 20, y: 292, "font-size": 11, fill: css("--muted")}, "kör = operátor, négyzet = operandus · kiemelt = aktuális csúcs · szürke = a veremben / a sorban");
}
function parse(src){
  const toks = src.replace(/−/g, "-").match(/\d+(?:[.,]\d+)?|[-+*/()]/g) || [];
  if (toks.join("") !== src.replace(/\s+/g, "").replace(/−/g, "-")) throw "Csak számok, + − * / és zárójel megengedett.";
  const prec = {"+": 1, "-": 1, "*": 2, "/": 2}, out = [], ops = []; let id = 0; const T = {};
  const mk = (lab, l, r) => { const k = "n" + (id++); T[k] = [lab, l, r]; return k; };
  const red = () => { const op = ops.pop(); const r = out.pop(), l = out.pop(); if (l === undefined || r === undefined) throw "Hibás kifejezés."; out.push(mk(op === "-" ? "−" : op, l, r)); };
  for (const t of toks) {
    if (/\d/.test(t)) out.push(mk(t.replace(",", "."), null, null));
    else if (t === "(") ops.push(t);
    else if (t === ")") { while (ops.length && ops[ops.length-1] !== "(") red(); if (!ops.length) throw "Zárójelhiba."; ops.pop(); }
    else { while (ops.length && ops[ops.length-1] !== "(" && prec[ops[ops.length-1]] >= prec[t]) red(); ops.push(t); }
  }
  while (ops.length) { if (ops[ops.length-1] === "(") throw "Zárójelhiba."; red(); }
  if (out.length !== 1) throw "Hibás kifejezés.";
  if (Object.keys(T).length > 13) throw "Legfeljebb 13 csúcs (7 operandus) legyen.";
  return [T, out[0]];
}
function reload(){ KIND = document.getElementById("kind").value; setSteps(trace(TREE, ROOT, KIND)); }
function load(){
  const msg = document.getElementById("err");
  try { const [T, r] = parse(document.getElementById("expr").value); TREE = T; ROOT = r; msg.textContent = ""; reload(); }
  catch (e) { msg.textContent = String(e); }
}

const _render0 = render; render = function(s){ _render0(s); svg.querySelectorAll("text[fill]").forEach(t => t.style.fill = t.getAttribute("fill")); };


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
