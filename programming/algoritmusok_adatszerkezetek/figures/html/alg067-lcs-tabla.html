<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCS-tábla és visszakövetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>X: <input id="X" value="ABCBDAB" size="12" aria-label="X"></label><label>Y: <input id="Y" value="BDCABA" size="12" aria-label="Y"></label><label>Mód: <select id="mode" onchange="load()" aria-label="Mód"><option value="fill">kitöltés</option><option value="back">visszakövetés</option></select></label><label>Holtverseny: <select id="tie" onchange="load()" aria-label="Holtverseny iránya"><option value="up">↑ (fel)</option><option value="left">← (balra)</option></select></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az ABCBDAB és a BDCABA LCS-táblája; kitöltés cellánként, majd visszakövetés a veremmel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function table(x, y){ const m = x.length, n = y.length, dp = []; for (let i = 0; i <= m; i++) { dp.push(new Array(n + 1).fill(0)); }
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) dp[i][j] = x[i-1] === y[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
  return dp; }
function steps(x, y, mode, up){
  const m = x.length, n = y.length, dp = table(x, y), st = [];
  if (mode === "fill") {
    st.push({x, y, dp, mode, k: 0, line: -1, msg: `Kezdet: a 0. sor és a 0. oszlop 0; ${m}×${n} cella kitöltése soronként`});
    let k = 0;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) { k++;
      const eq = x[i-1] === y[j-1];
      st.push({x, y, dp, mode, k, i, j, line: eq ? 1 : 2, msg: eq ? `X[${i}] = Y[${j}] = ${x[i-1]}: dp[${i-1}][${j-1}] + 1 = ${dp[i][j]}`
        : `X[${i}] = ${x[i-1]} ≠ Y[${j}] = ${y[j-1]}: max(dp[${i-1}][${j}] = ${dp[i-1][j]}, dp[${i}][${j-1}] = ${dp[i][j-1]}) = ${dp[i][j]}`}); }
    st[st.length - 1].msg += `. Kész: dp[${m}][${n}] = ${dp[m][n]}`;
    return st;
  }
  let i = m, j = n; const S = [], path = [[i, j]];
  st.push({x, y, dp, mode, k: m * n, i, j, S: [], path: path.slice(), line: 3, msg: `i = ${i}, j = ${j}, S = üres`});
  while (i > 0 && j > 0) {
    let msg, line;
    if (x[i-1] === y[j-1]) { S.push(x[i-1]); msg = `X[${i}] = Y[${j}] = ${x[i-1]}: push, átlósan ↖`; i--; j--; line = 5; }
    else if (up ? dp[i-1][j] >= dp[i][j-1] : dp[i-1][j] > dp[i][j-1]) { msg = `dp[${i-1}][${j}] = ${dp[i-1][j]} ${up ? "≥" : ">"} dp[${i}][${j-1}] = ${dp[i][j-1]}: fel ↑`; i--; line = 6; }
    else { msg = `dp[${i-1}][${j}] = ${dp[i-1][j]}, dp[${i}][${j-1}] = ${dp[i][j-1]}: balra ←`; j--; line = 7; }
    path.push([i, j]);
    st.push({x, y, dp, mode, k: m * n, i, j, S: S.slice(), path: path.slice(), line, msg: msg + `; S = [${S.join(", ")}]`});
  }
  const res = S.slice().reverse().join("");
  st.push({x, y, dp, mode, k: m * n, i, j, S: S.slice(), path: path.slice(), line: 8, msg: `Vége: LCS = „${res}” (hossz ${res.length})`});
  return st;
}
function render(s){
  svg.innerHTML = "";
  const x = s.x, y = s.y, m = x.length, n = y.length, dp = s.dp, up = !document.getElementById || !document.getElementById("tie") || document.getElementById("tie").value === "up";
  const c = Math.min(38, 420 / (n + 2), 280 / (m + 2)), W = (n + 2) * c + 10, H = (m + 2) * c + 50;
  svg.setAttribute("viewBox", `0 0 ${Math.max(W, 300)} ${H}`);
  const pathSet = new Set((s.path || []).map(p => p[0] + "," + p[1]));
  const done = (i, j) => i === 0 || j === 0 || (i - 1) * n + j <= s.k;
  for (let j = 1; j <= n; j++) el("text", {x: (j + 1.5) * c, y: c * 0.75, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, y[j-1]);
  for (let i = 1; i <= m; i++) el("text", {x: c * 0.5, y: (i + 1.5) * c + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, x[i-1]);
  for (let i = 0; i <= m; i++) for (let j = 0; j <= n; j++) {
    const X0 = (j + 1) * c, Y0 = (i + 1) * c, cur = s.mode === "fill" && i === s.i && j === s.j;
    const nb = s.mode === "fill" && s.i !== undefined && ((i === s.i - 1 && j === s.j - 1) || (i === s.i - 1 && j === s.j) || (i === s.i && j === s.j - 1));
    const onp = pathSet.has(i + "," + j);
    el("rect", {x: X0, y: Y0, width: c, height: c, fill: cur ? css("--cellhl") : (nb ? css("--code") : css("--cell")), stroke: cur || onp ? css("--hl2") : (nb ? css("--hl") : css("--line")), "stroke-width": cur || onp ? 3 : (nb ? 2.5 : 0.6)});
    if (done(i, j)) {
      el("text", {x: X0 + c * 0.62, y: Y0 + c * 0.7, "text-anchor": "middle", "font-size": Math.min(14, c * 0.42), "font-weight": onp ? "bold" : "normal"}, String(dp[i][j]));
      if (i && j) { const a = x[i-1] === y[j-1] ? "↖" : ((up ? dp[i-1][j] >= dp[i][j-1] : dp[i-1][j] > dp[i][j-1]) ? "↑" : "←");
        el("text", {x: X0 + c * 0.22, y: Y0 + c * 0.38, "text-anchor": "middle", "font-size": Math.min(11, c * 0.3), fill: css("--muted")}, a); }
    }
  }
  if (s.S) el("text", {x: 6, y: H - 14, "font-size": 13}, "verem S (alul az első push): [" + s.S.join(", ") + "]");
  else el("text", {x: 6, y: H - 14, "font-size": 12, fill: css("--muted")}, "kék = a három szomszéd ([i−1][j−1], [i−1][j], [i][j−1]) · narancs = aktuális cella");
}
function load(){
  const x = document.getElementById("X").value.trim(), y = document.getElementById("Y").value.trim(), e = document.getElementById("err");
  if (x.length < 1 || x.length > 12 || y.length < 1 || y.length > 12) { e.textContent = "X és Y: 1–12 karakter."; return; }
  e.textContent = ""; setSteps(steps(x, y, document.getElementById("mode").value, document.getElementById("tie").value === "up"));
}

else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
