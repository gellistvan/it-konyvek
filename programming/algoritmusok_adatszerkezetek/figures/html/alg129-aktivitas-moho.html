<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohó aktivitásválasztás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Intervallumok: <input id="inp" value="(1,4) (3,5) (0,6) (5,7) (3,9) (5,9) (6,10) (8,11) (8,12) (2,14) (12,16)" size="40" aria-label="Intervallumok (s, f) párokként"></label><label><input id="bs" type="checkbox" onchange="load()"> hibás mohó: kezdési idő szerint</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="11 intervallum idővonalon befejezési idő szerint; a mohó a [1,4), [5,7), [8,11), [12,16) intervallumokat választja, a határvonal végül 16-nál áll."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet greedy_activity_selector függvénye (Python, 0-tól indexelt) a demó 11 intervallumán. A kapcsoló a kezdési idő szerinti, hibás mohó változatot mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0], "k": 0, "m": null, "line": 1, "bs": false, "msg": "rendezés befejezési idő szerint; az első (1, 4) mindig bekerül: selected = [0], k = 0, határ f[k] = 4"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0], "k": 0, "m": 1, "line": 3, "ok": false, "bs": false, "msg": "m = 1: s[1] = 3 < f[0] = 4 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0], "k": 0, "m": 2, "line": 3, "ok": false, "bs": false, "msg": "m = 2: s[2] = 0 < f[0] = 4 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3], "k": 3, "m": 3, "line": 4, "ok": true, "bs": false, "msg": "m = 3: s[3] = 5 ≥ f[0] = 4 → kiválaszt; k = 3, új határ 7"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3], "k": 3, "m": 4, "line": 3, "ok": false, "bs": false, "msg": "m = 4: s[4] = 3 < f[3] = 7 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3], "k": 3, "m": 5, "line": 3, "ok": false, "bs": false, "msg": "m = 5: s[5] = 5 < f[3] = 7 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3], "k": 3, "m": 6, "line": 3, "ok": false, "bs": false, "msg": "m = 6: s[6] = 6 < f[3] = 7 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3, 7], "k": 7, "m": 7, "line": 4, "ok": true, "bs": false, "msg": "m = 7: s[7] = 8 ≥ f[3] = 7 → kiválaszt; k = 7, új határ 11"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3, 7], "k": 7, "m": 8, "line": 3, "ok": false, "bs": false, "msg": "m = 8: s[8] = 8 < f[7] = 11 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3, 7], "k": 7, "m": 9, "line": 3, "ok": false, "bs": false, "msg": "m = 9: s[9] = 2 < f[7] = 11 → átfed, kimarad"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3, 7, 10], "k": 10, "m": 10, "line": 4, "ok": true, "bs": false, "msg": "m = 10: s[10] = 12 ≥ f[7] = 11 → kiválaszt; k = 10, új határ 16"}, {"iv": [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]], "sel": [0, 3, 7, 10], "k": 10, "m": null, "line": 5, "bs": false, "end": true, "msg": "return [0, 3, 7, 10] – 4 tevékenység"}];
const CODE = ["n = len(s); if n == 0: return []", "selected = [0]; k = 0", "for m in range(1, n):", "    if s[m] >= f[k]:", "        selected.append(m); k = m", "return selected"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let IV = [[1, 4], [3, 5], [0, 6], [5, 7], [3, 9], [5, 9], [6, 10], [8, 11], [8, 12], [2, 14], [12, 16]];
function trace(iv, byStart){
  const srt = iv.map((x, i) => [x[0], x[1], i]).sort((a, b) => (byStart ? a[0] - b[0] : a[1] - b[1]) || a[2] - b[2]).map(x => [x[0], x[1]]);
  const s = srt.map(x => x[0]), f = srt.map(x => x[1]), st = [];
  if (!srt.length) return [{iv: [], sel: [], k: null, m: null, line: 0, msg: "üres bemenet → []", end: true}];
  st.push({iv: srt, sel: [0], k: 0, m: null, line: 1, bs: byStart, msg: `rendezés ${byStart ? "kezdési" : "befejezési"} idő szerint; az első (${s[0]}, ${f[0]}) mindig bekerül: selected = [0], k = 0, határ f[k] = ${f[0]}`});
  const sel = [0]; let k = 0;
  for (let m = 1; m < s.length; m++) { const ok = s[m] >= f[k], cond = `m = ${m}: s[${m}] = ${s[m]} ${ok ? "≥" : "<"} f[${k}] = ${f[k]}`;
    if (ok) { sel.push(m); k = m; }
    st.push({iv: srt, sel: sel.slice(), k, m, line: ok ? 4 : 3, ok, bs: byStart, msg: cond + (ok ? ` → kiválaszt; k = ${m}, új határ ${f[k]}` : " → átfed, kimarad")}); }
  st.push({iv: srt, sel: sel.slice(), k, m: null, line: 5, bs: byStart, end: true, msg: `return [${sel.join(", ")}] – ${sel.length} tevékenység` + (byStart ? " (HIBÁS mohó: a legkorábban kezdődő nem biztonságos)" : "")});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 330");
  const iv = s.iv, n = iv.length, T = Math.max(16, ...iv.map(x => x[1])), x0 = 90, W = 490, X = t => x0 + t / T * W, rh = Math.min(24, 270 / Math.max(1, n)), Y = i => 14 + i * rh;
  for (let t = 0; t <= T; t += T > 30 ? 5 : 2) { el("line", {x1: X(t), y1: Y(0) - 4, x2: X(t), y2: Y(n), stroke: css("--cellhl"), "stroke-width": 0.6});
    el("text", {x: X(t), y: Y(n) + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t)); }
  const sel = new Set(s.sel);
  iv.forEach(([a, b], i) => { const chosen = sel.has(i) && (s.m === null || i <= s.m || s.end), cur = i === s.m, decided = s.m === null ? (s.end || i === 0) : i <= s.m;
    const y = Y(i) + 3, h = rh - 6;
    el("rect", {x: X(a), y, width: X(b) - X(a), height: h, fill: chosen ? css("--fg") : css("--cell"), stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3 : 1, opacity: decided ? 1 : 0.45});
    if (decided && !chosen) for (let xx = X(a); xx < X(b) - 3; xx += 7) el("line", {x1: xx, y1: y + h, x2: Math.min(xx + h, X(b)), y2: y + Math.max(0, h - (X(b) - xx)), stroke: css("--muted"), "stroke-width": 0.8});
    el("circle", {cx: X(a), cy: y + h/2, r: 4, fill: css("--fg"), stroke: css("--line")});
    el("circle", {cx: X(b), cy: y + h/2, r: 4, fill: css("--bg"), stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: x0 - 8, y: y + h/2 + 4, "text-anchor": "end", "font-size": 12, "font-weight": chosen ? "bold" : "normal"}, `${i}: [${a}, ${b})`); });
  if (s.k !== null && s.k !== undefined && n) { const b = iv[s.k][1];
    el("line", {x1: X(b), y1: Y(0) - 8, x2: X(b), y2: Y(n), stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "7 4"});
    el("text", {x: X(b), y: Y(n) + 30, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, `f[k] = ${b} (k = ${s.k})`); }
}
function load(){
  const msg = document.getElementById("err");
  const raw = document.getElementById("inp").value.match(/-?\d+\s*,\s*-?\d+/g) || [];
  const iv = raw.map(p => p.split(",").map(Number));
  if (iv.length < 1 || iv.length > 14 || iv.some(([a, b]) => !(a < b) || a < 0 || b > 60)) { msg.textContent = "1–14 intervallum (s, f) alakban, 0 ≤ s < f ≤ 60."; return; }
  msg.textContent = ""; IV = iv; setSteps(trace(iv, document.getElementById("bs").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
