<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijkstra lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Éllista: <input id="edges" size="46" value="s a 2; s b 3; a c 5; a b 1; a d 4; b c 1; b d 2; c d 1" aria-label="Éllista: u v súly, pontosvesszővel elválasztva"></label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('edges').value='s a 2; s b 3; a c 5; a b 1; a d 4; b c 1; b d 2; c d 1; d a -4';load()">Példa negatív éllel</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Ötcsúcsú irányított gráf; a Dijkstra sorban kiveszi az s, a, b, c, d csúcsokat, a végső távolságok 0, 2, 3, 4, 5, az előd-élek a←s, b←s, c←b, d←b."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Nemnegatív súlyok, szigorú < relaxáció, csak a Q-beli szomszédokra. Kezdőállapot: indítás, majd 5 lépés (a 23.1.4 táblázata). A forrás egy csúcsra kattintva választható.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"d": {"s": 0, "a": null, "b": null, "c": null, "d": null}, "pi": {"s": null, "a": null, "b": null, "c": null, "d": null}, "S": [], "Q": ["s", "a", "b", "c", "d"], "u": null, "rel": [], "line": 4, "msg": "Indítás: d[s] = 0, a többi ∞; S = ∅, Q = V"}, {"d": {"s": 0, "a": 2, "b": 3, "c": null, "d": null}, "pi": {"s": null, "a": "s", "b": "s", "c": null, "d": null}, "S": ["s"], "Q": ["a", "b", "c", "d"], "u": "s", "rel": [["s", "a", true], ["s", "b", true]], "line": 10, "msg": "1. lépés: u = s kivétele (d = 0); s→a: 0 + 2 = 2 < ∞ → d[a] = 2; s→b: 0 + 3 = 3 < ∞ → d[b] = 3"}, {"d": {"s": 0, "a": 2, "b": 3, "c": 7, "d": 6}, "pi": {"s": null, "a": "s", "b": "s", "c": "a", "d": "a"}, "S": ["s", "a"], "Q": ["b", "d", "c"], "u": "a", "rel": [["a", "c", true], ["a", "b", false], ["a", "d", true]], "line": 10, "msg": "2. lépés: u = a kivétele (d = 2); a→c: 2 + 5 = 7 < ∞ → d[c] = 7; a→b: 2 + 1 = 3 ≥ 3, nem javít; a→d: 2 + 4 = 6 < ∞ → d[d] = 6"}, {"d": {"s": 0, "a": 2, "b": 3, "c": 4, "d": 5}, "pi": {"s": null, "a": "s", "b": "s", "c": "b", "d": "b"}, "S": ["s", "a", "b"], "Q": ["c", "d"], "u": "b", "rel": [["b", "c", true], ["b", "d", true]], "line": 10, "msg": "3. lépés: u = b kivétele (d = 3); b→c: 3 + 1 = 4 < 7 → d[c] = 4; b→d: 3 + 2 = 5 < 6 → d[d] = 5"}, {"d": {"s": 0, "a": 2, "b": 3, "c": 4, "d": 5}, "pi": {"s": null, "a": "s", "b": "s", "c": "b", "d": "b"}, "S": ["s", "a", "b", "c"], "Q": ["d"], "u": "c", "rel": [["c", "d", false]], "line": 10, "msg": "4. lépés: u = c kivétele (d = 4); c→d: 4 + 1 = 5 ≥ 5, nem javít"}, {"d": {"s": 0, "a": 2, "b": 3, "c": 4, "d": 5}, "pi": {"s": null, "a": "s", "b": "s", "c": "b", "d": "b"}, "S": ["s", "a", "b", "c", "d"], "Q": [], "u": "d", "rel": [], "line": 6, "msg": "5. lépés: u = d kivétele (d = 5); nincs Q-beli szomszéd"}];
const CODE = ["Dijkstra(G=(V,E), w, s)", "   for each v in V: d[v] = ∞; π[v] = nil", "   d[s] = 0", "   S = ∅", "   Q = V        // min-prioritási sor, kulcs d[v]", "   while Q ≠ ∅:", "       u = Extract-Min(Q)", "       S = S ∪ {u}", "       for each v in Adj[u]:", "           if v ∈ Q:", "               Relax(u, v)   // ha d[u] + w(u,v) < d[v]: d[v], π[v] frissül", "   return d, π"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let VV = ["s", "a", "b", "c", "d"], EE = [["s", "a", 2], ["s", "b", 3], ["a", "c", 5], ["a", "b", 1], ["a", "d", 4], ["b", "c", 1], ["b", "d", 2], ["c", "d", 1]], SRC = "s";
const DEFPOS = {"s": [0.0, 1.0], "a": [1.6, 2.0], "b": [1.6, 0.0], "c": [3.2, 2.0], "d": [3.2, 0.0]};
let POSN = Object.assign({}, DEFPOS);
const fm = x => x === null || x === Infinity ? "∞" : String(x);
function dijkstra(V, E, s){
  const d = {}, pi = {}; V.forEach(v => { d[v] = Infinity; pi[v] = null; }); d[s] = 0;
  const S = [], Q = V.slice(), adj = {}; V.forEach(v => adj[v] = E.filter(e => e[0] === v).map(e => [e[1], e[2]]));
  const key = v => [d[v], V.indexOf(v)], cmp = (x, y) => { const a = key(x), b = key(y); return a[0] - b[0] || a[1] - b[1]; };
  const snap = o => Object.assign({d: Object.fromEntries(V.map(v => [v, d[v] === Infinity ? null : d[v]])), pi: Object.assign({}, pi), S: S.slice(), Q: Q.slice().sort(cmp)}, o);
  const st = [snap({u: null, rel: [], line: 4, msg: `Indítás: d[${s}] = 0, a többi ∞; S = ∅, Q = V`})];
  while (Q.length) { Q.sort(cmp); const u = Q.shift(); S.push(u); const rel = [], parts = [];
    adj[u].forEach(([v, w]) => { if (!Q.includes(v)) return; const nd = d[u] + w;
      if (nd < d[v]) { parts.push(`${u}→${v}: ${fm(d[u])} + ${w} = ${fm(nd)} < ${fm(d[v])} → d[${v}] = ${fm(nd)}`); d[v] = nd; pi[v] = u; rel.push([u, v, true]); }
      else { parts.push(`${u}→${v}: ${fm(d[u])} + ${w} = ${fm(nd)} ≥ ${fm(d[v])}, nem javít`); rel.push([u, v, false]); } });
    st.push(snap({u, rel, line: rel.length ? 10 : 6, msg: `${S.length}. lépés: u = ${u} kivétele (d = ${fm(d[u])}); ` + (parts.length ? parts.join("; ") : "nincs Q-beli szomszéd")})); }
  return st;
}
const PX = p => 70 + p[0] * 105, PY = p => 245 - p[1] * 95;
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300");
  svg.innerHTML = '<defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker>'
    + '<marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  const rel = {}; s.rel.forEach(r => rel[r[0] + ">" + r[1]] = r[2]);
  EE.forEach(([a, b, w]) => { const p0 = POSN[a], p1 = POSN[b], x0 = PX(p0), y0 = PY(p0), x1 = PX(p1), y1 = PY(p1), L = Math.hypot(x1 - x0, y1 - y0) || 1;
    const ux = (x1 - x0) / L, uy = (y1 - y0) / L, X0 = x0 + ux * 20, Y0 = y0 + uy * 20, X1 = x1 - ux * 22, Y1 = y1 - uy * 22;
    const on = (a + ">" + b) in rel, ok = rel[a + ">" + b], tree = s.pi[b] === a;
    if (tree && !on) { el("line", {x1: X0, y1: Y0, x2: X1 - ux * 6, y2: Y1 - uy * 6, stroke: css("--line"), "stroke-width": 7}); el("line", {x1: X0, y1: Y0, x2: X1 - ux * 6, y2: Y1 - uy * 6, stroke: css("--bg"), "stroke-width": 3});
      el("path", {d: `M${X1},${Y1}L${X1 - ux * 11 - uy * 6},${Y1 - uy * 11 + ux * 6}L${X1 - ux * 11 + uy * 6},${Y1 - uy * 11 - ux * 6}Z`, fill: css("--line")}); }
    else el("line", {x1: X0, y1: Y0, x2: X1, y2: Y1, stroke: on ? css("--hl2") : (tree ? css("--line") : css("--muted")), "stroke-width": on && ok ? 4 : (on ? 2 : 1.2), "stroke-dasharray": on && !ok ? "6 4" : "none", "marker-end": on ? "url(#m2)" : "url(#m1)"});
    const t = (DEFPOS[a] && ((a === "a" && b === "d") || (a === "b" && b === "c"))) ? 0.3 : 0.5;
    el("rect", {x: x0 + (x1 - x0) * t - 9, y: y0 + (y1 - y0) * t - 9, width: 18, height: 16, fill: css("--bg")});
    el("text", {x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t + 4, "text-anchor": "middle", "font-size": 12, fill: w < 0 ? css("--hl2") : css("--fg")}, String(w).replace("-", "−")); });
  VV.forEach(v => { const p = POSN[v], x = PX(p), y = PY(p), done = s.S.includes(v);
    el("circle", {cx: x, cy: y, r: 18, fill: done ? css("--fg") : css("--cell"), stroke: css("--line"), "stroke-width": 1.4, "data-v": v, style: "cursor:pointer"});
    if (s.u === v) el("circle", {cx: x, cy: y, r: 24, fill: "none", stroke: css("--hl"), "stroke-width": 2.5});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, "font-weight": v === SRC ? "bold" : "normal", fill: done ? css("--bg") : css("--fg"), "pointer-events": "none"}, v);
    el("text", {x, y: y + (p[1] > 1 ? -28 : 38), "text-anchor": "middle", "font-size": 12}, "d = " + fm(s.d[v])); });
  const tx = 455; el("text", {x: tx, y: 20, "font-size": 13, "font-weight": "bold"}, "Q (d szerint):");
  s.Q.forEach((v, i) => el("text", {x: tx, y: 40 + i * 17, "font-size": 13}, `${v}: ${fm(s.d[v])}`));
  const row = (y, a, b, c, bold) => [a, b, c].forEach((t, i) => el("text", {x: tx + 8 + i * 36, y, "font-size": 12.5, "text-anchor": "middle", "font-weight": bold ? "bold" : "normal"}, t));
  row(64 + s.Q.length * 17, "v", "d", "π", true);
  VV.forEach((v, i) => row(82 + s.Q.length * 17 + i * 16, v, fm(s.d[v]), s.pi[v] || "nil"));
}
svg.addEventListener("click", ev => { const v = ev.target.getAttribute && ev.target.getAttribute("data-v"); if (!v) return; SRC = v; setSteps(dijkstra(VV, EE, SRC)); });
function circ(V){ const P = {}; V.forEach((v, i) => { const t = Math.PI - 2 * Math.PI * i / V.length; P[v] = [1.6 + 1.5 * Math.cos(t), 1.0 + 1.05 * Math.sin(t)]; }); return P; }
function load(){
  const e = document.getElementById("err"), txt = document.getElementById("edges").value, E2 = [], V2 = [];
  for (const part of txt.split(";").map(x => x.trim()).filter(x => x)) { const m = part.split(/\s+/);
    if (m.length !== 3 || isNaN(Number(m[2].replace("−", "-")))) { e.textContent = "Formátum: u v súly; …"; return; }
    const w = Number(m[2].replace("−", "-")); E2.push([m[0], m[1], w]); [m[0], m[1]].forEach(x => { if (!V2.includes(x)) V2.push(x); }); }
  if (V2.length < 2 || V2.length > 8) { e.textContent = "2–8 csúcs."; return; }
  VV = V2; EE = E2; POSN = V2.every(v => v in DEFPOS) ? Object.assign({}, DEFPOS) : circ(V2); if (!VV.includes(SRC)) SRC = VV[0];
  e.textContent = EE.some(x => x[2] < 0) ? "Figyelem: negatív él – a Dijkstra előfeltétele sérül, az eredmény hibás lehet!" : "";
  setSteps(dijkstra(VV, EE, SRC));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
