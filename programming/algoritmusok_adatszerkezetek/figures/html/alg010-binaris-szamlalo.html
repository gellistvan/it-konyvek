<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bináris számláló és potenciál</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Saját kezdőállapot (kattintson a bitekre):</span><button id="bb3" onclick="tog(3)" aria-label="b3 bit átbillentése">b3 = 0</button><button id="bb2" onclick="tog(2)" aria-label="b2 bit átbillentése">b2 = 0</button><button id="bb1" onclick="tog(1)" aria-label="b1 bit átbillentése">b1 = 0</button><button id="bb0" onclick="tog(0)" aria-label="b0 bit átbillentése">b0 = 0</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy bit cellaként lépésenként; a megforduló bitek vastag kerettel, alatta a költségek és a potenciál."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Költség = megfordított bitek száma; Φ = az 1-esek száma; nincs túlcsordulás (n < 2^k, k = 4). Kezdőállapot: 0000, a lépés 0–15 között választható.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"v": 0, "b": [0, 0, 0, 0], "flip": [], "t": null, "cost": null, "phi": 0, "dphi": null, "tot": 0, "k": 0, "line": -1, "msg": "Kezdőállapot: 0000, Φ = 0"}, {"v": 1, "b": [0, 0, 0, 1], "flip": [3], "t": 0, "cost": 1, "phi": 1, "dphi": 1, "tot": 1, "k": 1, "line": -1, "msg": "1. inkrementálás: 0000 → 0001; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 0 → 1, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 2, "b": [0, 0, 1, 0], "flip": [3, 2], "t": 1, "cost": 2, "phi": 1, "dphi": 0, "tot": 3, "k": 2, "line": -1, "msg": "2. inkrementálás: 0001 → 0010; t = 1 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 2; Φ 1 → 1, ΔΦ = 1 − t = 0; ĉ = (t + 1) + (1 − t) = 2 + (0) = 2"}, {"v": 3, "b": [0, 0, 1, 1], "flip": [3], "t": 0, "cost": 1, "phi": 2, "dphi": 1, "tot": 4, "k": 3, "line": -1, "msg": "3. inkrementálás: 0010 → 0011; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 1 → 2, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 4, "b": [0, 1, 0, 0], "flip": [3, 2, 1], "t": 2, "cost": 3, "phi": 1, "dphi": -1, "tot": 7, "k": 4, "line": -1, "msg": "4. inkrementálás: 0011 → 0100; t = 2 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 3; Φ 2 → 1, ΔΦ = 1 − t = −1; ĉ = (t + 1) + (1 − t) = 3 + (−1) = 2"}, {"v": 5, "b": [0, 1, 0, 1], "flip": [3], "t": 0, "cost": 1, "phi": 2, "dphi": 1, "tot": 8, "k": 5, "line": -1, "msg": "5. inkrementálás: 0100 → 0101; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 1 → 2, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 6, "b": [0, 1, 1, 0], "flip": [3, 2], "t": 1, "cost": 2, "phi": 2, "dphi": 0, "tot": 10, "k": 6, "line": -1, "msg": "6. inkrementálás: 0101 → 0110; t = 1 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 2; Φ 2 → 2, ΔΦ = 1 − t = 0; ĉ = (t + 1) + (1 − t) = 2 + (0) = 2"}, {"v": 7, "b": [0, 1, 1, 1], "flip": [3], "t": 0, "cost": 1, "phi": 3, "dphi": 1, "tot": 11, "k": 7, "line": -1, "msg": "7. inkrementálás: 0110 → 0111; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 2 → 3, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 8, "b": [1, 0, 0, 0], "flip": [3, 2, 1, 0], "t": 3, "cost": 4, "phi": 1, "dphi": -2, "tot": 15, "k": 8, "line": -1, "msg": "8. inkrementálás: 0111 → 1000; t = 3 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 4; Φ 3 → 1, ΔΦ = 1 − t = −2; ĉ = (t + 1) + (1 − t) = 4 + (−2) = 2"}, {"v": 9, "b": [1, 0, 0, 1], "flip": [3], "t": 0, "cost": 1, "phi": 2, "dphi": 1, "tot": 16, "k": 9, "line": -1, "msg": "9. inkrementálás: 1000 → 1001; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 1 → 2, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 10, "b": [1, 0, 1, 0], "flip": [3, 2], "t": 1, "cost": 2, "phi": 2, "dphi": 0, "tot": 18, "k": 10, "line": -1, "msg": "10. inkrementálás: 1001 → 1010; t = 1 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 2; Φ 2 → 2, ΔΦ = 1 − t = 0; ĉ = (t + 1) + (1 − t) = 2 + (0) = 2"}, {"v": 11, "b": [1, 0, 1, 1], "flip": [3], "t": 0, "cost": 1, "phi": 3, "dphi": 1, "tot": 19, "k": 11, "line": -1, "msg": "11. inkrementálás: 1010 → 1011; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 2 → 3, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 12, "b": [1, 1, 0, 0], "flip": [3, 2, 1], "t": 2, "cost": 3, "phi": 2, "dphi": -1, "tot": 22, "k": 12, "line": -1, "msg": "12. inkrementálás: 1011 → 1100; t = 2 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 3; Φ 3 → 2, ΔΦ = 1 − t = −1; ĉ = (t + 1) + (1 − t) = 3 + (−1) = 2"}, {"v": 13, "b": [1, 1, 0, 1], "flip": [3], "t": 0, "cost": 1, "phi": 3, "dphi": 1, "tot": 23, "k": 13, "line": -1, "msg": "13. inkrementálás: 1100 → 1101; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 2 → 3, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}, {"v": 14, "b": [1, 1, 1, 0], "flip": [3, 2], "t": 1, "cost": 2, "phi": 3, "dphi": 0, "tot": 25, "k": 14, "line": -1, "msg": "14. inkrementálás: 1101 → 1110; t = 1 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 2; Φ 3 → 3, ΔΦ = 1 − t = 0; ĉ = (t + 1) + (1 − t) = 2 + (0) = 2"}, {"v": 15, "b": [1, 1, 1, 1], "flip": [3], "t": 0, "cost": 1, "phi": 4, "dphi": 1, "tot": 26, "k": 15, "line": -1, "msg": "15. inkrementálás: 1110 → 1111; t = 0 darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = 1; Φ 3 → 4, ΔΦ = 1 − t = 1; ĉ = (t + 1) + (1 − t) = 1 + (1) = 2"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let START = 0;
function popc(v){ let c = 0; while (v) { c += v & 1; v >>= 1; } return c; }
function bitsOf(v){ return [3, 2, 1, 0].map(i => (v >> i) & 1); }
function trace(start){
  const st = [{v: start, b: bitsOf(start), flip: [], t: null, cost: null, phi: popc(start), dphi: null, tot: 0, k: 0, line: -1,
               msg: `Kezdőállapot: ${bitsOf(start).join("")}, Φ = ${popc(start)}`}];
  let v = start, tot = 0;
  while (v < 15) {
    let t = 0; while ((v >> t) & 1) t++;
    const nv = v + 1, flip = []; for (let j = 0; j <= t; j++) flip.push(3 - j);
    const p0 = popc(v), p1 = popc(nv); tot += t + 1; const k = st.length;
    st.push({v: nv, b: bitsOf(nv), flip, t, cost: t + 1, phi: p1, dphi: p1 - p0, tot, k, line: -1,
      msg: `${k}. inkrementálás: ${bitsOf(v).join("")} → ${bitsOf(nv).join("")}; t = ${t} darab 1→0 és 1 darab 0→1 fordítás; tényleges költség t + 1 = ${t + 1}; Φ ${p0} → ${p1}, ΔΦ = 1 − t = ${p1 - p0}; ĉ = (t + 1) + (1 − t) = ${t + 1} + (${p1 - p0}) = 2`.replace(/\(-/g, "(−").replace(/= -/g, "= −")});
    v = nv;
  }
  if (st.length === 1) st[0].msg += " – 1111 után túlcsordulna (n < 2^k feltétel), nincs több lépés.";
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300"); svg.innerHTML = "";
  const w = 64, x0 = 60, y0 = 40;
  s.b.forEach((b, j) => {
    const fl = s.flip.includes(j);
    el("rect", {x: x0 + j * (w + 8), y: y0, width: w, height: w, fill: b ? css("--line") : css("--cell"), stroke: css("--line"), "stroke-width": fl ? 5 : 1.2});
    el("text", {x: x0 + j * (w + 8) + w/2, y: y0 + w/2 + 10, "text-anchor": "middle", "font-size": 28, style: "fill:" + (b ? css("--bg") : css("--fg"))}, String(b));
    el("text", {x: x0 + j * (w + 8) + w/2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "b" + (3 - j) + (fl ? (b ? "  ↑1" : "  ↓0") : ""));
  });
  el("text", {x: 380, y: 60, "font-size": 15}, "érték: " + s.v);
  el("text", {x: 380, y: 84, "font-size": 15}, "Φ = " + s.phi + " (1-esek)");
  el("text", {x: 380, y: 108, "font-size": 15}, "Σ költség = " + s.tot);
  el("text", {x: 380, y: 132, "font-size": 15}, "2·lépés = " + 2 * s.k);
  // költségsáv lépésenként
  const by = 270; el("text", {x: 20, y: 180, "font-size": 13}, "tényleges költség lépésenként (sötét) és Φ (vonal):");
  STEPS.forEach((q, i) => { if (i === 0 || i > s.k) return; const x = 20 + (i - 1) * 34;
    el("rect", {x, y: by - q.cost * 16, width: 22, height: q.cost * 16, fill: i === s.k ? css("--hl") : css("--cellhl"), stroke: css("--line")});
    el("text", {x: x + 11, y: by + 14, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i)); });
  let d = ""; STEPS.forEach((q, i) => { if (i > s.k) return; const x = 20 + (i - 1) * 34 + 11; d += (d ? " L" : "M") + (i === 0 ? 20 - 12 : x) + "," + (by - q.phi * 16); });
  if (s.k) el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "5 3"});
  el("line", {x1: 8, y1: by, x2: 552, y2: by, stroke: css("--line")});
}
function tog(i){ START ^= (1 << i); document.getElementById("bb" + i).textContent = "b" + i + " = " + ((START >> i) & 1); setSteps(trace(START)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
