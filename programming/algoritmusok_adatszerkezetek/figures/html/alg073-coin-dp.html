<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin change DP és mohó</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Címletek: <input id="c" value="1, 3, 4" size="10" aria-label="Címletek"></label><label>n = <input id="n" value="6" size="3" aria-label="Célösszeg"></label><label><input id="gr" type="checkbox" checked onchange="show(k)"> mohó út</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A dp tábla m = 0-tól 6-ig: 0, 1, 2, 1, 1, 2, 2; a DP-út 6 → 3 → 0 (2 érme), a mohó út 6 → 2 → 1 → 0 (3 érme)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.4.4 dp_erme átirata, C = {1, 3, 4}, n = 6 kezdőállapottal; holtversenynél minden minimális jelölt nyerő, a visszafejtés a nagyobb címletet választja. Az utolsó lépés mutatja a DP-utat és a mohó utat.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": -1}];
const CODE = ["dp[0] = 0", "for m = 1 to n:", "    jelöltek: dp[m − c] + 1 minden c ≤ m-re", "    dp[m] = min(jelöltek)  (∞, ha nincs)", "visszafejtés: m → m − c (nyerő c), amíg m > 0"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function build(coins, n){
  const dp = [0], cand = {0: []}, st = [];
  st.push({dp: dp.slice(), m: 0, cand: [], line: 1, msg: `dp[0] = 0 (az üres összeg 0 érméből áll); C = {${coins.join(", ")}}, n = ${n}`, n, coins});
  for (let m = 1; m <= n; m++) { const cs = coins.filter(c => c <= m).map(c => [c, dp[m - c] + 1]);
    dp[m] = cs.length ? Math.min(...cs.map(x => x[1])) : Infinity; cand[m] = cs;
    const txt = cs.length ? cs.map(([c, v]) => `dp[${m - c}]+1 = ${v === Infinity ? "∞" : v}`).join(", ") : "nincs c ≤ m";
    st.push({dp: dp.slice(), m, cand: cs, line: 3, n, coins, msg: `m = ${m}: ${txt} → dp[${m}] = ${dp[m] === Infinity ? "∞" : dp[m]}`}); }
  // visszafejtés és mohó
  let B = null; if (dp[n] !== Infinity) { B = [n]; while (B[B.length - 1] > 0) { const m = B[B.length - 1]; const c = Math.max(...cand[m].filter(x => x[1] === dp[m]).map(x => x[0])); B.push(m - c); } }
  let G = [n], r = n; coins.slice().sort((a, b) => b - a).forEach(c => { while (r >= c) { r -= c; G.push(r); } }); if (r !== 0) G = null;
  st.push({dp: dp.slice(), m: -1, cand: [], line: 4, n, coins, B, G,
    msg: `Kész: DP ${B ? (B.length - 1) + " érme (" + B.slice(0, -1).map((a, i) => a - B[i + 1]).join(" + ") + ")" : "nincs megoldás"}; mohó ${G ? (G.length - 1) + " érme (" + G.slice(0, -1).map((a, i) => a - G[i + 1]).join(" + ") + ")" : "elakad (nincs megoldás)"}`});
  return st;
}
function arcPath(x0, x1, y, up, k){ const h = Math.min(120, k * Math.abs(x1 - x0) / 2) * (up ? -1 : 1), mx = (x0 + x1) / 2;
  return [`M${x0},${y} Q${mx},${y + 2 * h} ${x1},${y}`, mx, y + h]; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  el("defs", {}).innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0L10,5L0,10z" fill="${css("--fg")}"/></marker>`;
  const n = s.n, w = Math.min(64, 500 / (n + 1)), x0 = (560 - w * (n + 1)) / 2, y0 = 150, X = m => x0 + m * w + w / 2;
  for (let m = 0; m <= n; m++) { const known = m < s.dp.length, on = m === s.m, src = s.cand.some(c => m === s.m - c[0]);
    el("rect", {x: x0 + m * w, y: y0, width: w, height: 40, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": src ? "4 2" : "none"});
    el("text", {x: X(m), y: y0 + 26, "text-anchor": "middle", "font-size": 16}, known ? (s.dp[m] === Infinity ? "∞" : String(s.dp[m])) : "");
    el("text", {x: X(m), y: y0 + 56, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "m=" + m); }
  if (s.m > 0) s.cand.forEach(([c, v]) => { const win = v === s.dp[s.m], [d, mx, my] = arcPath(X(s.m), X(s.m - c), y0, true, 0.9);
    el("path", {d, fill: "none", stroke: win ? css("--fg") : css("--muted"), "stroke-width": win ? 3 : 1.3, "stroke-dasharray": win ? "none" : "5 4", "marker-end": "url(#ar)"});
    el("text", {x: mx, y: my - 4, "text-anchor": "middle", "font-size": 12}, `+1 (${c})`); });
  const showG = document.getElementById("gr").checked;
  if (s.B) for (let i = 0; i + 1 < s.B.length; i++) { const [d, mx, my] = arcPath(X(s.B[i]), X(s.B[i + 1]), y0, true, 0.7);
    el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 4, "marker-end": "url(#ar)"}); el("text", {x: mx, y: my - 4, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, String(s.B[i] - s.B[i + 1])); }
  if (s.G && showG) for (let i = 0; i + 1 < s.G.length; i++) { const [d, mx, my] = arcPath(X(s.G[i]), X(s.G[i + 1]), y0 + 62, false, 0.4);
    el("path", {d, fill: "none", stroke: css("--hl2"), "stroke-width": 2.2, "stroke-dasharray": "2 4", "marker-end": "url(#ar)"}); el("text", {x: mx, y: my + 16, "text-anchor": "middle", "font-size": 13}, String(s.G[i] - s.G[i + 1])); }
  if (s.m > 0) s.cand.forEach(([c, v], i) => el("text", {x: 12, y: 250 + i * 16, "font-size": 12, "font-weight": v === s.dp[s.m] ? "bold" : "normal"}, `c = ${c}: dp[${s.m - c}] + 1 = ${v === Infinity ? "∞" : v}` + (v === s.dp[s.m] ? "  ← min" : "")));
  el("text", {x: 548, y: 14, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "vastag = nyerő jelölt / DP-út · szaggatott = nem nyerő · pontozott (alul) = mohó út");
}
function load(){
  const coins = [...new Set(document.getElementById("c").value.split(/[ ,;]+/).filter(x => x).map(Number))].sort((a, b) => a - b), n = +document.getElementById("n").value;
  const err = document.getElementById("err");
  if (!coins.length || coins.some(c => !Number.isInteger(c) || c < 1 || c > 50) || !Number.isInteger(n) || n < 1 || n > 20) { err.textContent = "Címletek: pozitív egészek (≤ 50); n: 1–20."; return; }
  err.textContent = ""; setSteps(build(coins, n));
}

STEPS = build([1, 3, 4], 6);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
