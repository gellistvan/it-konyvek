<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohó színezés lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>pre#code{flex:1 1 100%}</style><label>Gráf: <select id="pre" onchange="load(false)" aria-label="Gráf"><option value="p4">P4 (a–b–c–d)</option><option value="c5">C5</option><option value="own">saját éllista</option></select></label><input id="own" size="22" value="a-b, b-c, c-d, d-a, a-e" aria-label="Saját éllista"><label>Sorrend: <input id="ord" size="16" value="a, b, c, d" aria-label="Csúcssorrend"></label><button onclick="load(true)">Futtatás</button><button onclick="document.getElementById('ord').value='a, d, b, c';load(true)">a, d, b, c</button><button onclick="worst()">Legrosszabb sorrend keresése</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Mohó színezés a P4 úton: a, b, c, d sorrendben 2 szín, a, d, b, c sorrendben 3 szín; a C5 körön 0..4 sorrendben 3 szín."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 26.2.2 MohóSzínezés pszeudokódja. A sorrend a szövegmezőben adható meg (vesszővel); a „legrosszabb sorrend” az összes sorrendet kipróbálja (n ≤ 8). A színezett csúcs fölött a színszám, a kitöltés mintája is a színt kódolja (fekete-fehérben is olvasható).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = ["MohóSzínezés(G):", " 1. szín[1..n] ← 0", " 2. használt[0..n+1] ← hamis", " 3. ciklus u a sorrendben:", " 4.   minden v ∈ N(u), szín[v] ≠ 0:", " 5.     használt[szín[v]] ← igaz", " 6.   c ← 1", " 7.   amíg használt[c]:", " 8.     c ← c + 1", " 9.   szín[u] ← c", "10.   minden v ∈ N(u), szín[v] ≠ 0:", "11.     használt[szín[v]] ← hamis", "13. vissza szín"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G_defs(){
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`
   + `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl2")}"/></marker>`
   + `<marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`
   + `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="2"/></pattern>`
   + `<pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.2" fill="${css("--muted")}"/></pattern>`;
  return d;
}
// Él P-ből Q-ba; o: {r, w, dash, dir, curve (px, bal oldalra +), label, color, lpos}
function G_edge(P, Q, o){
  o = o || {};
  const r = o.r === undefined ? 16 : o.r, c = o.curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const cx = (P[0] + Q[0]) / 2 + c * nx, cy = (P[1] + Q[1]) / 2 + c * ny;
  const u1 = Math.hypot(cx - P[0], cy - P[1]) || 1, u2 = Math.hypot(Q[0] - cx, Q[1] - cy) || 1;
  const x1 = P[0] + r * (cx - P[0]) / u1, y1 = P[1] + r * (cy - P[1]) / u1;
  const ex = r + (o.dir ? 1 : 0), x2 = Q[0] - ex * (Q[0] - cx) / u2, y2 = Q[1] - ex * (Q[1] - cy) / u2;
  const col = o.color || css("--line");
  const a = {d: `M${x1.toFixed(1)},${y1.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`,
    fill: "none", stroke: col, "stroke-width": o.w || 1.4};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  if (o.dir) a["marker-end"] = o.color === css("--hl2") ? "url(#ah2)" : o.color === css("--hl") ? "url(#ah3)" : "url(#ah)";
  const p = el("path", a);
  if (o.label !== undefined && o.label !== null && o.label !== "") {
    const t = o.lpos === undefined ? 0.5 : o.lpos;
    const mx = (1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], my = (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1];
    G_text(mx, my + 4, String(o.label), {size: o.lsize || 12, anchor: "middle", halo: true, bold: o.lbold});
  }
  return p;
}
function G_mid(P, Q, curve, t){
  t = t === undefined ? 0.5 : t; const c = curve || 0;
  const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1;
  const cx = (P[0] + Q[0]) / 2 - c * dy / L, cy = (P[1] + Q[1]) / 2 + c * dx / L;
  return [(1 - t) * (1 - t) * P[0] + 2 * t * (1 - t) * cx + t * t * Q[0], (1 - t) * (1 - t) * P[1] + 2 * t * (1 - t) * cy + t * t * Q[1]];
}
// Csúcs; o: {r, fill, w, dash, stroke, tfill, size, bold}
function G_node(P, label, o){
  o = o || {};
  const c = el("circle", {cx: P[0], cy: P[1], r: o.r || 16, fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"),
    "stroke-width": o.w || 1.5});
  if (o.dash) c.setAttribute("stroke-dasharray", o.dash);
  if (o.pat) el("circle", {cx: P[0], cy: P[1], r: (o.r || 16) * 0.55, fill: css("--cell"), stroke: "none"});
  const t = {x: P[0], y: P[1] + 5, "text-anchor": "middle", "font-size": o.size || 14, "pointer-events": "none"};
  if (o.tfill) t.fill = o.tfill;
  if (o.bold) t["font-weight"] = "bold";
  el("text", t, String(label));
  return c;
}
function G_cross(x, y, s){ s = s || 6; const col = css("--fg");
  el("line", {x1: x - s, y1: y - s, x2: x + s, y2: y + s, stroke: col, "stroke-width": 2.2});
  el("line", {x1: x - s, y1: y + s, x2: x + s, y2: y - s, stroke: col, "stroke-width": 2.2}); }
// Szöveg; o: {size, anchor, bold, fill, halo}
function G_text(x, y, s, o){
  o = o || {};
  const a = {x, y, "font-size": o.size || 12, "text-anchor": o.anchor || "start"};
  if (o.bold) a["font-weight"] = "bold";
  if (o.fill) a.fill = o.fill;
  if (o.halo) { a.stroke = css("--bg"); a["stroke-width"] = 4; a["paint-order"] = "stroke"; a["stroke-linejoin"] = "round"; if (!o.fill) a.fill = css("--fg"); }
  return el("text", a, s);
}
// Kattintható/billentyűzettel kezelhető elem
function G_click(e, fn, label){ e.setAttribute("tabindex", "0"); e.setAttribute("role", "button"); if (label) e.setAttribute("aria-label", label);
  e.style.cursor = "pointer"; e.addEventListener("click", fn);
  e.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fn(); } }); }

let ADJ = {a: ["b"], b: ["a","c"], c: ["b","d"], d: ["c"]}, ORDER = ["a","b","c","d"];
function greedy(adj, order){
  const col = {}; Object.keys(adj).forEach(v => col[v] = 0); const st = [];
  const D = Math.max(...Object.values(adj).map(a => a.length));
  st.push({col: {...col}, u: null, used: [], line: 1, D, msg: `Sorrend: ${order.join(", ")}; minden csúcs színezetlen (0). Δ = ${D}, korlát Δ + 1 = ${D + 1}.`});
  for (const u of order) {
    const used = [...new Set(adj[u].map(v => col[v]).filter(x => x))].sort((a, b) => a - b);
    st.push({col: {...col}, u, used, line: 5, D, msg: `${u}: a már színezett szomszédok színei → használt = {${used.join(", ")}}.`});
    let c = 1; while (used.includes(c)) c++;
    col[u] = c;
    st.push({col: {...col}, u, used, c, line: 9, D, msg: `${u}: a legkisebb szabad szín c = ${c}; szín[${u}] = ${c}. Eddig ${Math.max(...Object.values(col))} szín.`});
  }
  st.push({col: {...col}, u: null, used: [], line: 12, D, msg: `Kész: ${Math.max(...Object.values(col))} szín (korlát Δ + 1 = ${D + 1}).`});
  return st;
}
function lay(adj){ const V = Object.keys(adj), P = {}, isPath = V.length === 4 && ADJ.a && ADJ.d && ADJ.a.length === 1 && ADJ.d.length === 1 && ADJ.b.length === 2;
  if (isPath) V.forEach((v, i) => P[v] = [70 + i * 110, 150]);
  else V.forEach((v, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / V.length; P[v] = [220 + 120 * Math.cos(a), 150 + 115 * Math.sin(a)]; });
  return P; }
const FILLS = () => [css("--cell"), css("--cellhl"), "url(#hp)", "url(#dp)", css("--muted"), css("--hl"), css("--hl2"), css("--fg")];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 320"); G_defs();
  const P = lay(ADJ), F = FILLS(), done = new Set();
  for (const u in ADJ) for (const v of ADJ[u]) { const k = [u, v].sort().join("|"); if (done.has(k)) continue; done.add(k);
    G_edge(P[u], P[v], {r: 20, w: s.u && (u === s.u || v === s.u) && s.line === 5 ? 3 : 1.5, color: s.u && (u === s.u || v === s.u) && s.line === 5 ? css("--hl2") : undefined}); }
  for (const v in P) { const c = s.col[v];
    G_node(P[v], v, {r: 20, fill: F[c % F.length], pat: c === 2 || c === 3, w: v === s.u ? 4 : 1.5, stroke: v === s.u ? css("--hl2") : undefined, tfill: c >= 4 ? css("--bg") : undefined});
    if (c) G_text(P[v][0], P[v][1] - 26, "szín " + c, {size: 12, anchor: "middle", bold: true, halo: true}); }
  // használt tömb
  const n = Object.keys(ADJ).length; G_text(440, 30, "használt[c]", {bold: true});
  for (let c = 1; c <= Math.min(n + 1, 9); c++) { const on = s.line === 5 && s.used.includes(c) || (s.line === 9 && s.used.includes(c));
    el("rect", {x: 440, y: 40 + (c - 1) * 24, width: 24, height: 22, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    G_text(470, 56 + (c - 1) * 24, `${c}: ${on ? "igaz" : "hamis"}` + (s.c === c ? "  ← c" : ""), {size: 12, bold: s.c === c}); }
  const used = Math.max(0, ...Object.values(s.col));
  G_text(10, 290, `felhasznált színek: ${used} · Δ + 1 = ${s.D + 1} · sorrend: ${ORDER.join(", ")}`, {size: 13, bold: true});
  G_text(10, 310, "vastag narancs = aktuális csúcs; a narancs élek a 4–5. sorban vizsgált szomszédok; a minta/árnyalat a színt kódolja", {size: 10.5, fill: css("--muted")});
}
function parseG(){ const p = document.getElementById("pre").value;
  if (p === "p4") ADJ = {a: ["b"], b: ["a","c"], c: ["b","d"], d: ["c"]};
  else if (p === "c5") ADJ = {0: [1, 4].map(String), 1: ["0","2"], 2: ["1","3"], 3: ["2","4"], 4: ["3","0"]};
  else { const A = {}; for (const part of document.getElementById("own").value.split(/[,;\n]+/)) { const m = part.trim().match(/^(\w+)\s*-\s*(\w+)$/); if (!m || m[1] === m[2]) continue;
      (A[m[1]] = A[m[1]] || []); (A[m[2]] = A[m[2]] || []); if (!A[m[1]].includes(m[2])) { A[m[1]].push(m[2]); A[m[2]].push(m[1]); } }
    if (!Object.keys(A).length) { status.textContent = "Nem értelmezhető éllista. Minta: a-b, b-c, c-a"; return false; } ADJ = A; }
  return true; }
function load(keepOrder){ if (!parseG()) return; const V = Object.keys(ADJ);
  let o = document.getElementById("ord").value.split(/[\s,]+/).filter(x => x);
  if (!keepOrder || o.length !== V.length || !o.every(x => V.includes(x))) { o = V.slice(); if (document.getElementById("pre").value === "p4" && keepOrder === undefined) o = ["a","b","c","d"]; }
  ORDER = o; document.getElementById("ord").value = o.join(", "); setSteps(greedy(ADJ, ORDER)); }
function worst(){ if (!parseG()) return; const V = Object.keys(ADJ); if (V.length > 8) { status.textContent = "Csak n ≤ 8-ra (8! sorrend)."; return; }
  let best = null, bc = 0; const perm = (a, l) => { if (l === a.length) { const st = greedy(ADJ, a), c = Math.max(...Object.values(st[st.length - 1].col)); if (c > bc) { bc = c; best = a.slice(); } return; }
    for (let i = l; i < a.length; i++) { [a[l], a[i]] = [a[i], a[l]]; perm(a, l + 1); [a[l], a[i]] = [a[i], a[l]]; } };
  perm(V.slice(), 0); ORDER = best; document.getElementById("ord").value = best.join(", "); setSteps(greedy(ADJ, ORDER));
  status.textContent = `Legrosszabb sorrend: ${best.join(", ")} → ${bc} szín. ` + status.textContent; }

STEPS = greedy(ADJ, ORDER);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
