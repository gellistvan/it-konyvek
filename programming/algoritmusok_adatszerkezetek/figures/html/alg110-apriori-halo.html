<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apriori: elemhalmaz-háló és vágás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="ms">Küszöb (min_supp_abs):</label><input id="ms" type="range" min="1" max="4" value="2" style="flex:0 1 140px" oninput="load()" aria-label="Támogatottsági küszöb"><b id="msv">2</b></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Háromelemű elemhalmaz-háló négy szinten; szintenként jelöltek, számlálás és szűrés; a {kenyér, sonka} nem gyakori, ezért {kenyér, vaj, sonka} vágott."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 6.1 labor négy tranzakciója (T1 = kenyér, vaj; T2 = kenyér, vaj, sonka; T3 = vaj, sonka; T4 = kenyér). count = abszolút támogatottság. Kezdőállapot: min_supp_abs = 2, ahogy a könyv példájában.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "betöltés…", "line": -1}];
const CODE = ["Apriori(D, I, min_supp_abs):", "  F_1 = { {i} : count({i}) ≥ min }", "  while F_{k-1} ≠ ∅:", "    C_k = apriori_gen(F_{k-1})", "    count[S] minden S ∈ C_k-ra", "    F_k = { S ∈ C_k : count[S] ≥ min }", "  return F", "apriori_gen: egyesítés + metszés", "  (has_infrequent_subset → elvetve)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ITEMS = ["kenyér", "vaj", "sonka"], SH = {"kenyér": "k", "vaj": "v", "sonka": "s"};
const D = [["kenyér","vaj"], ["kenyér","vaj","sonka"], ["vaj","sonka"], ["kenyér"]];
const ALL = [[], ["kenyér"], ["vaj"], ["sonka"], ["kenyér","vaj"], ["kenyér","sonka"], ["vaj","sonka"], ["kenyér","vaj","sonka"]];
const nm = S => S.length ? "{" + S.map(x => SH[x]).join(",") + "}" : "∅";
const id = S => S.join("|");
const cnt = S => D.filter(T => S.every(x => T.includes(x))).length;
function subsets(c){ return c.map((_, i) => c.filter((_, j) => j !== i)); }
function gen(Fp, k){
  const C = [], ids = new Set(Fp.map(id));
  for (const p of Fp) for (const q of Fp) {
    if (p === q) continue;
    if (id(p.slice(0, k-2)) !== id(q.slice(0, k-2))) continue;
    if (ITEMS.indexOf(p[k-2]) >= ITEMS.indexOf(q[k-2])) continue;
    const c = ITEMS.filter(x => p.includes(x) || q.includes(x));
    if (subsets(c).some(s => !ids.has(id(s)))) continue;
    C.push(c);
  }
  return C;
}
function trace(ms){
  const st = {}; ALL.forEach(S => st[id(S)] = "unk"); st[""] = "root";
  const snap = (msg, line, level, extra) => Object.assign({msg, line, level, st: Object.assign({}, st), ms}, extra || {});
  const steps = [snap(`Kiindulás: 4 tranzakció, min_supp_abs = ${ms}; még egyetlen elemhalmazt sem számoltunk.`, -1, 0)];
  let Fk = [];
  ITEMS.forEach(i => { const ok = cnt([i]) >= ms; st[i] = ok ? "freq" : "infreq"; if (ok) Fk.push([i]); });
  steps.push(snap(`F₁: a C₁ számlálása (k = ${cnt(["kenyér"])}, v = ${cnt(["vaj"])}, s = ${cnt(["sonka"])}); F₁ = {` + Fk.map(nm).join(", ") + "}", 1, 1));
  let F = Fk.slice(), k = 2;
  while (Fk.length) {
    const C = gen(Fk, k), cids = new Set(C.map(id));
    ALL.filter(S => S.length === k).forEach(S => { st[id(S)] = cids.has(id(S)) ? "cand" : "pruned"; });
    const fids = new Set(Fk.map(id));
    const cut = ALL.filter(S => S.length === k && !cids.has(id(S))).map(S => nm(S) + " (mert " + subsets(S).filter(x => !fids.has(id(x))).map(nm).join(", ") + " nem gyakori)");
    steps.push(snap(`C${k} = apriori_gen(F${k-1}) = {` + C.map(nm).join(", ") + "}" + (cut.length ? "; nem jelölt (vágott): " + cut.join(", ") : ""), 3, k));
    if (!C.length) { steps.push(snap(`C${k} = ∅, ezért F${k} = ∅: a keresés leáll.`, 2, k)); break; }
    steps.push(snap(`Számlálás a ${k}. szinten: ` + C.map(S => nm(S) + " = " + cnt(S)).join(", "), 4, k));
    Fk = C.filter(S => cnt(S) >= ms);
    C.forEach(S => { st[id(S)] = cnt(S) >= ms ? "freq" : "infreq"; });
    F = F.concat(Fk);
    steps.push(snap(`F${k} = {` + Fk.map(nm).join(", ") + `} (count ≥ ${ms})`, 5, k));
    k++;
    if (k > ITEMS.length) break;
  }
  steps.push(snap("Vége: F = {" + F.map(nm).join(", ") + "}", 6, 0));
  return steps;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const L = [[[]], ALL.slice(1,4), ALL.slice(4,7), ALL.slice(7)], P = {};
  L.forEach((lev, r) => lev.forEach((S, j) => { P[id(S)] = [280 + (j - (lev.length - 1) / 2) * 170, 30 + r * 82]; }));
  if (s.level) el("rect", {x: 8, y: P[id(L[s.level][0])][1] - 26, width: 544, height: 52, fill: "none", stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "6 4", rx: 8});
  L.slice(0, 3).forEach((lev, r) => lev.forEach(a => L[r+1].forEach(b => {
    if (!a.every(x => b.includes(x))) return;
    const pr = s.st[id(b)] === "pruned";
    el("line", {x1: P[id(a)][0], y1: P[id(a)][1] + 20, x2: P[id(b)][0], y2: P[id(b)][1] - 20, stroke: pr ? css("--muted") : css("--line"), "stroke-dasharray": pr ? "2 4" : "", "stroke-width": 1.2});
  })));
  ALL.forEach(S => {
    const [x, y] = P[id(S)], t = s.st[id(S)];
    const sty = {freq: [3, "", css("--cell")], infreq: [1.3, "6 4", css("--cellhl")], pruned: [1.3, "2 3", css("--bg")],
                 cand: [2, "", css("--bg")], unk: [1, "", css("--bg")], root: [1, "", css("--bg")]}[t];
    el("rect", {x: x - 70, y: y - 20, width: 140, height: 40, rx: 8, fill: sty[2], stroke: t === "cand" ? css("--hl2") : css("--line"), "stroke-width": sty[0], "stroke-dasharray": sty[1]});
    el("text", {x, y: y - 3, "text-anchor": "middle", "font-size": 13, "font-weight": t === "freq" ? "bold" : "normal"}, S.length ? "{" + S.join(", ") + "}" : "∅");
    const sub = t === "root" ? "4 tranzakció" : t === "unk" ? "–" : t === "pruned" ? "vágott, nem számolt" : t === "cand" ? "jelölt" : "count = " + cnt(S);
    el("text", {x, y: y + 13, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, sub);
    if (t === "pruned") { el("line", {x1: x - 66, y1: y - 16, x2: x + 66, y2: y + 16, stroke: css("--line")}); el("line", {x1: x - 66, y1: y + 16, x2: x + 66, y2: y - 16, stroke: css("--line")}); }
  });
  el("text", {x: 8, y: 322, "font-size": 11, fill: css("--muted")}, "vastag = gyakori · szaggatott, szürke = nem gyakori · áthúzott, pontozott él = vágott · narancs keret = jelölt");
}
function load(){ const ms = +document.getElementById("ms").value; document.getElementById("msv").textContent = ms; setSteps(trace(ms)); }

STEPS = trace(2);   // kezdőállapot: a könyv küszöbe (a Python-assertekkel egyező logika)


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
