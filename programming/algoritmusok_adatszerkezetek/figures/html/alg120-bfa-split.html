<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-fa: proaktív split</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kezdőfa (beszúrási sorrend): <input id="pre" value="3, 10, 12, 5, 15, 7" size="18" aria-label="Kezdőfa kulcsai"></label><label>Beszúrandó: <input id="inp" value="6" size="8" aria-label="Beszúrandó kulcsok"></label><label>t = <select id="tt" aria-label="Minimális fokszám t"><option selected>2</option><option>3</option></select></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="B-fa t = 2-vel: a gyökér [10], gyerekei [3 5 7] és [12 15]; a 6 beszúrásakor a telített [3 5 7] belépés előtt kettéválik, az 5 a gyökérbe kerül, a 6 a [7] levélbe: végül [5 10] → [3], [6 7], [12 15]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 3.1 beszúrási vázlata (t = a szöveg B-je). I/O: csúcsolvasás a lefelé haladáskor, split = 3 blokkírás, levél = 1. Kezdőállapot: a könyvbeli példa (kezdőfa a 3, 10, 12, 5, 15, 7 sorozatból).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"tree": {"id": 2, "k": [10], "c": [{"id": 1, "k": [3, 5, 7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": 0, "msg": "Kezdőfa (t = 2, csúcsonként legfeljebb 2t − 1 = 3 kulcs = egy blokk); beszúrandó: 6", "t": 2, "reads": 0, "writes": 0, "cur": null}, {"tree": {"id": 2, "k": [10], "c": [{"id": 1, "k": [3, 5, 7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": 1, "msg": "insert(6): a gyökér [10] beolvasva", "t": 2, "reads": 1, "writes": 0, "cur": 2}, {"tree": {"id": 2, "k": [10], "c": [{"id": 1, "k": [3, 5, 7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": 1, "msg": "insert(6): 6 a(z) 1. gyerek felé; [3 5 7] beolvasva – telített (3 kulcs), belépés előtt vágjuk", "t": 2, "reads": 2, "writes": 0, "cur": 2, "child": 1}, {"tree": {"id": 2, "k": [5, 10], "c": [{"id": 1, "k": [3], "c": []}, {"id": 4, "k": [7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": 4, "msg": "insert(6): split – a 5 felmegy a szülőbe: [5 10]; gyerekek [3] és [7] (3 blokkírás)", "t": 2, "reads": 2, "writes": 3, "cur": 2, "z": 4, "up": 5}, {"tree": {"id": 2, "k": [5, 10], "c": [{"id": 1, "k": [3], "c": []}, {"id": 4, "k": [6, 7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": 6, "msg": "insert(6): levél → [6 7] (1 blokkírás)", "t": 2, "reads": 2, "writes": 4, "cur": 4, "newkey": 6}, {"tree": {"id": 2, "k": [5, 10], "c": [{"id": 1, "k": [3], "c": []}, {"id": 4, "k": [6, 7], "c": []}, {"id": 3, "k": [12, 15], "c": []}]}, "line": -1, "msg": "Kész: 2 csúcsolvasás, 4 blokkírás; minden levél azonos mélységben.", "t": 2, "reads": 2, "writes": 4, "cur": null, "end": true}];
const CODE = ["Beszúrás(K):", "1. Keresés lefelé; telített", "   (2t − 1 kulcsú) gyereket", "   belépés ELŐTT vágunk", "2. Split: középső kulcs fel,", "   két t − 1 kulcsú csúcs", "3. Levél: K a helyére"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PRE = [3, 10, 12, 5, 15, 7];
function run(pre, keys, t){
  let cnt = 0, root = null, loud = false; const st = [], io = {r: 0, w: 0};
  const N = (k, c) => ({id: ++cnt, k: k || [], c: c || []});
  const snap = x => x === null ? null : {id: x.id, k: x.k.slice(), c: x.c.map(snap)};
  const push = (line, msg, kw) => { if (loud) st.push(Object.assign({tree: snap(root), line, msg, t, reads: io.r, writes: io.w}, kw || {})); };
  const S = a => a.join(" ");
  const split = (x, i) => { const y = x.c[i], leaf = !y.c.length, z = N(y.k.slice(t), leaf ? [] : y.c.slice(t)), up = y.k[t-1];
    y.k = y.k.slice(0, t-1); y.c = leaf ? [] : y.c.slice(0, t); x.c.splice(i+1, 0, z); x.k.splice(i, 0, up); io.w += 3; return [y, z, up]; };
  const insert = k => {
    if (root === null) { root = N([k]); io.w++; push(6, `insert(${k}): üres fa → új levélgyökér [${k}]`, {cur: root.id, newkey: k}); return; }
    let x = root; io.r++;
    push(1, `insert(${k}): a gyökér [${S(root.k)}] beolvasva`, {cur: root.id});
    if (root.k.length === 2*t-1) { const s = N([], [root]); root = s; const [y, z, up] = split(s, 0);
      push(4, `insert(${k}): a gyökér telített → új gyökér, split: a ${up} felmegy; [${S(y.k)}] és [${S(z.k)}] (a fa eggyel magasabb)`, {cur: s.id, z: z.id, up}); x = s; }
    while (true) {
      if (!x.c.length) {
        if (x.k.includes(k)) { push(6, `insert(${k}): már szerepel – nincs új kulcs`, {cur: x.id}); return; }
        const i = x.k.filter(v => v < k).length; x.k.splice(i, 0, k); io.w++;
        push(6, `insert(${k}): levél → [${S(x.k)}] (1 blokkírás)`, {cur: x.id, newkey: k}); return;
      }
      if (x.k.includes(k)) { push(1, `insert(${k}): már szerepel elválasztóként – nincs új kulcs`, {cur: x.id}); return; }
      let i = x.k.filter(v => v < k).length; const ch = x.c[i]; io.r++; const full = ch.k.length === 2*t-1;
      push(1, `insert(${k}): ${k} a(z) ${i+1}. gyerek felé; [${S(ch.k)}] beolvasva` + (full ? ` – telített (${2*t-1} kulcs), belépés előtt vágjuk` : ""), {cur: x.id, child: ch.id});
      if (full) { const [y, z, up] = split(x, i);
        push(4, `insert(${k}): split – a ${up} felmegy a szülőbe: [${S(x.k)}]; gyerekek [${S(y.k)}] és [${S(z.k)}] (3 blokkírás)`, {cur: x.id, z: z.id, up});
        if (k === up) { push(1, `insert(${k}): a felvitt kulcs éppen ${k} – nincs új kulcs`, {cur: x.id}); return; }
        if (k > up) i++; }
      x = x.c[i];
    }
  };
  pre.forEach(insert);
  io.r = 0; io.w = 0; loud = true;
  push(0, `Kezdőfa (t = ${t}, csúcsonként legfeljebb 2t − 1 = ${2*t-1} kulcs = egy blokk); beszúrandó: ${keys.join(", ")}`, {cur: null});
  keys.forEach(insert);
  push(-1, `Kész: ${io.r} csúcsolvasás, ${io.w} blokkírás; minden levél azonos mélységben.`, {cur: null, end: true});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 600 300");
  const t = s.t, SL = 2*t - 1;
  if (!s.tree) { el("text", {x: 20, y: 60, "font-size": 14}, "(üres fa)"); return; }
  const KWp = 44, KHp = 34, P = {}; let cur = 0; const W = SL * KWp, GAP = 12;
  const rec = (x, d) => { if (!x.c.length) { P[x.id] = [cur, d, x]; cur += W + GAP; return cur - GAP - W/2; }
    const cs = x.c.map(c => rec(c, d + 1)), mid = (cs[0] + cs[cs.length-1]) / 2; P[x.id] = [mid - W/2, d, x]; return mid; };
  rec(s.tree, 0);
  const total = cur - GAP, sc = Math.min(1, 580 / total), ox = Math.max(10, (600 - total * sc) / 2), Y = d => 36 + d * 72;
  const X = v => ox + v * sc;
  for (const id in P) { const [lx, d, x] = P[id]; x.c.forEach((c, j) => { const [cx, cd] = P[c.id];
    el("line", {x1: X(lx + j*KWp), y1: Y(d) + KHp, x2: X(cx + W/2), y2: Y(cd), stroke: css("--line"), "stroke-width": +c.id === s.child ? 3 : 1.2}); }); }
  for (const id in P) { const [lx, d, x] = P[id], full = x.k.length === SL, isCur = +id === s.cur, isCh = +id === s.child;
    for (let j = 0; j < SL; j++) { const key = j < x.k.length ? x.k[j] : null;
      el("rect", {x: X(lx + j*KWp), y: Y(d), width: KWp*sc, height: KHp, fill: full ? css("--cellhl") : css("--cell"),
        stroke: (isCur || isCh) ? css("--hl") : css("--line"), "stroke-width": key !== null && key === s.up ? 4 : (isCur || isCh) ? 3 : 1.1,
        "stroke-dasharray": key === null ? "4 3" : "none"});
      if (key !== null) el("text", {x: X(lx + j*KWp + KWp/2), y: Y(d) + 23, "text-anchor": "middle", "font-size": Math.max(11, Math.round(17 * sc)),
        "font-weight": key === s.up || key === s.newkey ? "bold" : "normal"}, String(key)); }
    if (+id === s.z) el("text", {x: X(lx + W/2), y: Y(d) + KHp + 16, "text-anchor": "middle", "font-size": 12, "font-style": "italic"}, "új csúcs");
    if (isCh) el("text", {x: X(lx + W/2), y: Y(d) - 6, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "beolvasva");
  }
  el("text", {x: 10, y: 262, "font-size": 14, "font-weight": "bold"}, `I/O: ${s.reads} csúcsolvasás · ${s.writes} blokkírás`);
  el("text", {x: 10, y: 288, "font-size": 12, fill: css("--muted")}, "csúcs = blokk · szürke = telített · szaggatott = üres rekesz · vastag keret = felvitt kulcs · kék = aktuális");
}
function load(){
  const parse = id => document.getElementById(id).value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const pre = parse("pre"), keys = parse("inp"), t = +document.getElementById("tt").value, msg = document.getElementById("err");
  if (keys.length < 1 || keys.length > 8 || pre.length > 20 || pre.concat(keys).some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { msg.textContent = "Kezdőfa: legfeljebb 20, beszúrandó: 1–8 egész kulcs (|x| ≤ 999)."; return; }
  msg.textContent = ""; setSteps(run(pre, keys, t));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
