<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prim és Kruskal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Algoritmus: <select id="alg" onchange="load()" aria-label="Algoritmus"><option value="P">Prim</option><option value="K">Kruskal</option></select></label><label>Prim-kezdőcsúcs: <select id="st" onchange="START=this.value;document.getElementById('alg').value='P';load()" aria-label="Kezdőcsúcs"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></label><span class="small">(vagy kattintson egy csúcsra)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Prim az A csúcsból: A–C, C–E, C–D, A–B; Kruskal: C–E, A–C, C–D, A–B, majd D–E és B–C elutasítva; összsúly 10."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 19.3.2 prim_mst (lusta kupac, holtversenynél a kisebb csúcsnév) és a 19.3.3 kruskal_mst (rendezés (w, u, v) szerint, DSU) átirata. Kezdőállapot: Prim az A csúcsból.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"alg": "P", "tree": [], "intree": [], "key": {"A": 0, "B": null, "C": null, "D": null, "E": null}, "cur": null, "rej": [], "line": 0, "msg": "Kezdet: key[A] = 0, a sorban (A, 0)"}, {"alg": "P", "tree": [], "intree": ["A"], "key": {"A": 0, "B": 4, "C": 2, "D": null, "E": null}, "cur": "A", "rej": [], "line": 5, "msg": "Kivesszük A-t: T = {A}; frissítés: key[B]=4, key[C]=2"}, {"alg": "P", "tree": [["A", "C"]], "intree": ["A", "C"], "key": {"A": 0, "B": 4, "C": 2, "D": 3, "E": 1}, "cur": "C", "rej": [], "line": 5, "msg": "Kivesszük C-t: +A–C (2); T = {A, C}; frissítés: key[D]=3, key[E]=1"}, {"alg": "P", "tree": [["A", "C"], ["C", "E"]], "intree": ["A", "C", "E"], "key": {"A": 0, "B": 4, "C": 2, "D": 3, "E": 1}, "cur": "E", "rej": [], "line": 3, "msg": "Kivesszük E-t: +C–E (1); T = {A, C, E}; nincs kulcsfrissítés"}, {"alg": "P", "tree": [["A", "C"], ["C", "D"], ["C", "E"]], "intree": ["A", "C", "D", "E"], "key": {"A": 0, "B": 4, "C": 2, "D": 3, "E": 1}, "cur": "D", "rej": [], "line": 3, "msg": "Kivesszük D-t: +C–D (3); T = {A, C, D, E}; nincs kulcsfrissítés"}, {"alg": "P", "tree": [["A", "B"], ["A", "C"], ["C", "D"], ["C", "E"]], "intree": ["A", "B", "C", "D", "E"], "key": {"A": 0, "B": 4, "C": 2, "D": 3, "E": 1}, "cur": "B", "rej": [], "line": 3, "msg": "Kivesszük B-t: +A–B (4); T = {A, B, C, D, E}; nincs kulcsfrissítés"}];
const CODE = ["Prim: pq = [(0, s)]", "  while pq: _, u = heappop(pq)", "    if in_tree[u]: continue", "    in_tree[u] = True", "    for v, w in graph[u]:", "      if not in_tree[v] and w < key[v]: frissít, push", "Kruskal: élek rendezése (w, u, v) szerint", "  for w, u, v in edges:", "    if find(u) != find(v): union(u, v); T.append((u, v))", "    else: elutasítva (kör)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const V = ["A", "B", "C", "D", "E"], E = [["A","B",4],["A","C",2],["B","C",5],["C","D",3],["C","E",1],["D","E",4]];
const P = {A: [80, 50], B: [330, 50], C: [205, 140], D: [80, 230], E: [330, 230]};
function prim(s){
  const g = {}; V.forEach(v => g[v] = []); E.forEach(([u, v, w]) => { g[u].push([v, w]); g[v].push([u, w]); });
  const key = {}, par = {}, inT = new Set(); V.forEach(v => { key[v] = null; par[v] = null; });
  key[s] = 0; let pq = [[0, V.indexOf(s), s]];
  const st = [{alg: "P", tree: [], intree: [], key: {...key}, cur: null, rej: [], line: 0, msg: `Kezdet: key[${s}] = 0, a sorban (${s}, 0)`}];
  while (pq.length) { pq.sort((a, b) => a[0] - b[0] || a[1] - b[1]); const [, , u] = pq.shift();
    if (inT.has(u)) { st.push({...st[st.length - 1], cur: u, line: 2, msg: `${u} már a fában: elavult bejegyzés, kihagyjuk`}); continue; }
    inT.add(u); const upd = [];
    for (const [v, w] of g[u]) if (!inT.has(v) && (key[v] === null || w < key[v])) { key[v] = w; par[v] = u; pq.push([w, V.indexOf(v), v]); upd.push(`key[${v}]=${w}`); }
    const tree = V.filter(x => inT.has(x) && par[x]).map(x => [par[x], x]);
    st.push({alg: "P", tree, intree: [...inT], key: {...key}, cur: u, rej: [], line: upd.length ? 5 : 3,
      msg: `Kivesszük ${u}-t: ${par[u] ? `+${par[u]}–${u} (${key[u]}); ` : ""}T = {${V.filter(x => inT.has(x)).join(", ")}}; ` + (upd.length ? "frissítés: " + upd.join(", ") : "nincs kulcsfrissítés")}); }
  const tot = V.filter(v => par[v]).reduce((a, v) => a + key[v], 0);
  st[st.length - 1].msg += ` – kész, összsúly ${tot}`; return st;
}
function kruskal(){
  const es = E.map(([u, v, w]) => [w, V.indexOf(u), V.indexOf(v)]).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  const par = V.map((_, i) => i), find = x => { while (par[x] !== x) x = par[x]; return x; }, comp = () => V.map((_, i) => find(i));
  const tree = [], rej = [];
  const st = [{alg: "K", tree: [], rej: [], comp: comp(), cur: null, line: 6, msg: "Rendezett élek: " + es.map(([w, u, v]) => `(${V[u]}-${V[v]}, ${w})`).join(", ")}];
  let tot = 0;
  for (const [w, u, v] of es) { const a = find(u), b = find(v); let msg, line;
    if (a !== b) { par[b] = a; tree.push([V[u], V[v]]); tot += w; msg = `(${V[u]}-${V[v]}, ${w}): különböző komponensek → hozzáadjuk`; line = 8; }
    else { rej.push([V[u], V[v]]); msg = `(${V[u]}-${V[v]}, ${w}): ${V[u]} és ${V[v]} egy komponensben → elutasítva`; line = 9; }
    st.push({alg: "K", tree: tree.slice(), rej: rej.slice(), comp: comp(), cur: [V[u], V[v]], line, msg}); }
  st[st.length - 1].msg += ` – kész, összsúly ${tot}`; return st;
}
function hull(pts){ pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); if (pts.length < 3) return pts;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of pts.slice().reverse()) { while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1)); }
const same = (e, u, v) => (e[0] === u && e[1] === v) || (e[0] === v && e[1] === u);
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 560 300");
  const pats = ["////", "dots", "back", "cross", "plus"];
  el("defs", {}).innerHTML =
    `<pattern id="q0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.5"/></pattern>` +
    `<pattern id="q1" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><circle cx="3" cy="3" r="1.3" fill="${css("--fg")}"/></pattern>` +
    `<pattern id="q2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.5"/></pattern>` +
    `<pattern id="q3" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cell")}"/><path d="M0,0L6,6M6,0L0,6" stroke="${css("--fg")}" stroke-width="1"/></pattern>` +
    `<pattern id="q4" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="${css("--cell")}"/><path d="M3.5,0V7M0,3.5H7" stroke="${css("--fg")}" stroke-width="1"/></pattern>`;
  if (s.alg === "P" && s.intree.length) { const pts = []; s.intree.forEach(v => { for (let t = 0; t < 24; t++) pts.push([P[v][0] + 36 * Math.cos(t * Math.PI / 12), P[v][1] + 36 * Math.sin(t * Math.PI / 12)]); });
    el("polygon", {points: hull(pts).map(p => p.join(",")).join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 5"}); }
  for (const [u, v, w] of E) { const t = s.tree.some(e => same(e, u, v)), r = s.rej.some(e => same(e, u, v)), c = s.cur && s.alg === "K" && same(s.cur, u, v);
    el("line", {x1: P[u][0], y1: P[u][1], x2: P[v][0], y2: P[v][1], stroke: c ? css("--hl2") : (t || r ? css("--line") : css("--muted")), "stroke-width": t ? 6 : (c ? 3 : 1.4), "stroke-dasharray": r ? "7 5" : "none", opacity: t || r || c ? 1 : 0.55});
    const mx = (P[u][0] + P[v][0]) / 2, my = (P[u][1] + P[v][1]) / 2;
    el("rect", {x: mx - 10, y: my - 10, width: 20, height: 18, fill: css("--bg")}); el("text", {x: mx, y: my + 4, "text-anchor": "middle", "font-size": 13}, String(w));
    if (r) el("text", {x: mx + 16, y: my - 6, "font-size": 14, "font-weight": "bold"}, "✕"); }
  for (const v of V) { const [x, y] = P[v]; let fill = css("--cell");
    if (s.alg === "P" && s.intree.includes(v)) fill = "url(#q0)";
    if (s.alg === "K") { const r = s.comp[V.indexOf(v)], sz = s.comp.filter(c => c === r).length; if (sz > 1) fill = `url(#q${[...new Set(s.comp)].sort().indexOf(r) % 5})`; }
    const node = el("circle", {cx: x, cy: y, r: 20, fill, stroke: css("--line"), "stroke-width": v === s.cur ? 4 : 1.4});
    node.style.cursor = "pointer"; node.addEventListener("click", () => { document.getElementById("alg").value = "P"; START = v; load(); });
    el("circle", {cx: x, cy: y, r: 10, fill: css("--cell")}); el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, v);
    if (s.alg === "P" && !s.intree.includes(v) && s.key[v] !== null) el("text", {x: x + (x < 200 ? -30 : 30), y: y - 24, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "key=" + s.key[v]); }
  el("text", {x: 400, y: 30, "font-size": 13, "font-weight": "bold"}, s.alg === "P" ? `Prim (${START}-ból)` : "Kruskal");
  const tot = s.tree.reduce((a, e) => a + E.find(([u, v]) => same(e, u, v))[2], 0);
  el("text", {x: 400, y: 52, "font-size": 12}, "T élei: " + (s.tree.length ? s.tree.map(e => e.join("–")).join(", ") : "–"));
  el("text", {x: 400, y: 72, "font-size": 12}, "összsúly: " + tot);
  const lg = s.alg === "P" ? ["vonalkázott csúcs = a fában", "pontozott görbe = a vágás", "key = legolcsóbb él a fához", "kattintás csúcsra = új kezdőcsúcs"]
    : ["azonos mintázat = egy DSU-komponens", "narancs = vizsgált él", "szaggatott + ✕ = elutasított (kör)"];
  lg.forEach((t, i) => el("text", {x: 380, y: 200 + i * 18, "font-size": 11, fill: css("--muted")}, t));
}
let START = "A";
function load(){ document.getElementById("st").value = START; const a = document.getElementById("alg").value; setSteps(a === "P" ? prim(START) : kruskal()); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
