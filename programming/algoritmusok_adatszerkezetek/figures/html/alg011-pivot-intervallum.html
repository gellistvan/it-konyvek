<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mikor hasonlítjuk össze z_i-t és z_j-t?</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>n = <input id="n" type="range" min="2" max="16" value="8" aria-label="n"> <b id="nv"></b></label>
  <label>i = <input id="i" type="range" min="1" max="8" value="3" aria-label="i"> <b id="iv"></b></label>
  <label>j = <input id="j" type="range" min="1" max="8" value="6" aria-label="j"> <b id="jv"></b></label>
</div>
<div class="ctl" role="group" aria-label="Kísérlet">
  <button id="step">Véletlen pivot ▶</button>
  <button id="k1000">1000 kísérlet</button>
  <button id="reset">Új kísérlet / nullázás</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 250" role="img" aria-label="Rendezett kulcsok számegyenesen, a z_i és z_j közötti intervallum kiemelve; a húzott pivotok és a felosztás látszik."></svg>
<p class="small">Különböző kulcsok, a pivot a z_i-t és z_j-t is tartalmazó résztömbből egyenletesen és függetlenül
(csak ez a résztömb számít). Véletlenszám-generátor: mulberry32, rögzített seed (12345), így a kísérletsor
reprodukálható. Kezdőállapot: n = 8, i = 3, j = 6, mint a statikus ábrán.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd = mulberry32(12345);
let n, I, J, lo, hi, picks, outcome, trials, hits;
const $ = id => document.getElementById(id);
const fmt = x => x.toFixed(3).replace(".", ",");
function readParams(){
  n = +$("n").value; $("i").max = n - 1; $("j").max = n; $("j").min = 2;
  I = +$("i").value; J = +$("j").value;
  if (I > n - 1) { I = n - 1; $("i").value = I; }
  if (J > n) { J = n; $("j").value = J; }
  if (J <= I) { J = I + 1; $("j").value = J; }
  $("nv").textContent = n; $("iv").textContent = I; $("jv").textContent = J;
}
function newTrial(){ lo = 1; hi = n; picks = []; outcome = null; }
function resetAll(){ readParams(); rnd = mulberry32(12345); trials = 0; hits = 0; newTrial(); draw(); }
function pivotStep(){
  if (outcome) newTrial();
  const p = lo + Math.floor(rnd() * (hi - lo + 1));
  picks.push({p, lo, hi});
  if (p === I || p === J) outcome = "cmp";
  else if (p > I && p < J) outcome = "sep";
  else if (p < I) lo = p + 1; else hi = p - 1;
  if (outcome) { trials++; if (outcome === "cmp") hits++; }
}
function runTrial(){ newTrial(); while (!outcome) pivotStep(); }
function draw(){
  svg.innerHTML = "";
  const w = Math.min(36, 600 / n), x0 = (640 - n * w) / 2 + w / 2, y = 90;
  const X = z => x0 + (z - 1) * w;
  el("rect", {x: X(I) - w/2, y: y - 22, width: (J - I + 1) * w, height: 44, fill: css("--cellhl")});
  el("rect", {x: X(lo) - w/2, y: y - 30, width: (hi - lo + 1) * w, height: 60, fill: "none", stroke: css("--fg"), "stroke-dasharray": "5 3"});
  el("text", {x: X(lo) - w/2, y: y - 36, "font-size": 12, style: "fill:" + css("--muted")}, `közös résztömb [${lo}..${hi}]`);
  el("line", {x1: X(1) - w/2, y1: y, x2: X(n) + w/2, y2: y, stroke: css("--line")});
  const last = picks.length ? picks[picks.length - 1].p : null;
  for (let z = 1; z <= n; z++) {
    const key = z === I || z === J, wasP = picks.some(q => q.p === z);
    el("circle", {cx: X(z), cy: y, r: key ? 14 : 11, fill: key ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": wasP ? 3.5 : 1});
    el("text", {x: X(z), y: y + 4, "text-anchor": "middle", "font-size": 11, style: "fill:" + css("--fg")}, "z" + z);
  }
  picks.forEach((q, t) => {
    el("text", {x: X(q.p), y: y + 40 + 14 * (t % 3), "text-anchor": "middle", "font-size": 11, "font-weight": q.p === last ? "bold" : "normal", style: "fill:" + css("--fg")}, (t + 1) + ". pivot");
  });
  if (outcome === "cmp") {
    el("path", {d: `M${X(I)},${y - 16} Q${(X(I) + X(J)) / 2},${y - 70} ${X(J)},${y - 16}`, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  } else if (outcome === "sep") {
    el("line", {x1: X(last) + w/2, y1: y - 40, x2: X(last) + w/2, y2: y + 30, stroke: css("--fg"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  }
  // valószínűség-sáv
  const m = J - I + 1, bw = Math.min(40, 400 / m), bx = 30, by = 190;
  for (let k = 0; k < m; k++) {
    const hit = k === 0 || k === m - 1;
    el("rect", {x: bx + k * bw, y: by, width: bw, height: 22, fill: hit ? css("--fg") : css("--cell"), "fill-opacity": hit ? 0.35 : 1, stroke: css("--line")});
  }
  el("text", {x: bx + m * bw + 10, y: by + 16, "font-size": 13, style: "fill:" + css("--fg")}, `elméleti: 2/(j − i + 1) = 2/${m} = ${fmt(2 / m)}`);
  el("text", {x: bx, y: by + 42, "font-size": 13, style: "fill:" + css("--fg")}, trials ? `empirikus: ${hits}/${trials} = ${fmt(hits / trials)} (kísérletek: ${trials})` : "empirikus: még nincs lezárt kísérlet");
  let msg;
  if (!picks.length) msg = `Új kísérlet: n = ${n}, a vizsgált pár z${I} és z${J}. Nyomja meg a „Véletlen pivot ▶” gombot.`;
  else {
    const q = picks[picks.length - 1];
    if (outcome === "cmp") msg = `A pivot z${q.p} a [${q.lo}..${q.hi}] résztömbből: az intervallum végpontja, ezért z${I} és z${J} összehasonlításra kerül.`;
    else if (outcome === "sep") msg = `A pivot z${q.p} a két elem közé esik: z${I} és z${J} különböző részbe kerül, soha nem hasonlítjuk össze őket.`;
    else msg = `A pivot z${q.p} az intervallumon kívül esik: nem dönt, a közös résztömb [${lo}..${hi}] lesz.`;
  }
  $("status").textContent = msg;
}
$("step").onclick = () => { pivotStep(); draw(); };
$("k1000").onclick = () => { for (let t = 0; t < 1000; t++) runTrial(); draw(); };
$("reset").onclick = resetAll;
["n", "i", "j"].forEach(id => $(id).addEventListener("input", resetAll));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
resetAll();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
