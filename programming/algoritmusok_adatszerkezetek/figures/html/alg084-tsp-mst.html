<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MST-alapú 2-approximáció a metrikus TSP-re</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="showopt" type="checkbox" checked onchange="show(k)"> optimális kör az utolsó lépésben</label><button onclick="addPt()">Új pont</button><button onclick="reset()">Az öt pontos példa</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt pont a síkon: az MST csillag A-ból, az Euler-túra minden faélt kétszer jár be, a rövidítés az A→B→C→D→E→A kört adja; az optimális kör A→C→E→B→D→A."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Euklideszi távolság; Prim az első pontból (A), szigorú < relációval; a DFS a gyermekeket betűrendben járja be. Kezdőállapot: az ábra öt pontja (A(2,2), B(4,2), C(0,0), D(2,3), E(3,0)); az utolsó lépés az arányt is kiírja (OPT kimerítő kereséssel, n ≤ 9).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": "mst", "ei": 0, "H": [], "skip": [], "line": 1, "msg": "T = MST (Prim A-ból): AB, AC, AD, AE; d(T) ≈ 8,06"}, {"phase": "euler", "ei": 1, "H": [], "skip": [], "line": 4, "msg": "Euler-lépés 1: A → B (gyermek bejárása); d(L) eddig ≈ 2,00"}, {"phase": "euler", "ei": 2, "H": [], "skip": [], "line": 7, "msg": "Euler-lépés 2: B → A (visszatérés a szülőhöz); d(L) eddig ≈ 4,00"}, {"phase": "euler", "ei": 3, "H": [], "skip": [], "line": 4, "msg": "Euler-lépés 3: A → C (gyermek bejárása); d(L) eddig ≈ 6,83"}, {"phase": "euler", "ei": 4, "H": [], "skip": [], "line": 7, "msg": "Euler-lépés 4: C → A (visszatérés a szülőhöz); d(L) eddig ≈ 9,66"}, {"phase": "euler", "ei": 5, "H": [], "skip": [], "line": 4, "msg": "Euler-lépés 5: A → D (gyermek bejárása); d(L) eddig ≈ 10,66"}, {"phase": "euler", "ei": 6, "H": [], "skip": [], "line": 7, "msg": "Euler-lépés 6: D → A (visszatérés a szülőhöz); d(L) eddig ≈ 11,66"}, {"phase": "euler", "ei": 7, "H": [], "skip": [], "line": 4, "msg": "Euler-lépés 7: A → E (gyermek bejárása); d(L) eddig ≈ 13,89"}, {"phase": "euler", "ei": 8, "H": [], "skip": [], "line": 7, "msg": "Euler-lépés 8: E → A (visszatérés a szülőhöz); d(L) eddig ≈ 16,13"}, {"phase": "short", "ei": 8, "H": ["A"], "skip": [], "line": 12, "msg": "L[0] = A: H = [A]"}, {"phase": "short", "ei": 8, "H": ["A", "B"], "skip": [], "line": 12, "msg": "L[1] = B új: H-ba kerül (faél A → B, ≈ 2,00)"}, {"phase": "short", "ei": 8, "H": ["A", "B"], "skip": ["A"], "line": 11, "msg": "L[2] = A már szerepel (seen): kihagyjuk"}, {"phase": "short", "ei": 8, "H": ["A", "B", "C"], "skip": ["A"], "line": 12, "msg": "L[3] = C új: rövidítés B → C, átugorva: A; d(B,C) ≈ 4,47 ≤ 4,83 (megtakarítás ≈ 0,36)"}, {"phase": "short", "ei": 8, "H": ["A", "B", "C"], "skip": ["A"], "line": 11, "msg": "L[4] = A már szerepel (seen): kihagyjuk"}, {"phase": "short", "ei": 8, "H": ["A", "B", "C", "D"], "skip": ["A"], "line": 12, "msg": "L[5] = D új: rövidítés C → D, átugorva: A; d(C,D) ≈ 3,61 ≤ 3,83 (megtakarítás ≈ 0,22)"}, {"phase": "short", "ei": 8, "H": ["A", "B", "C", "D"], "skip": ["A"], "line": 11, "msg": "L[6] = A már szerepel (seen): kihagyjuk"}, {"phase": "short", "ei": 8, "H": ["A", "B", "C", "D", "E"], "skip": ["A"], "line": 12, "msg": "L[7] = E új: rövidítés D → E, átugorva: A; d(D,E) ≈ 3,16 ≤ 3,24 (megtakarítás ≈ 0,07)"}, {"phase": "done", "ei": 8, "H": ["A", "B", "C", "D", "E"], "skip": [], "line": 14, "msg": "Kör zárása E → A: d(H) ≈ 15,48; OPT ≈ 11,30 (A→C→E→B→D→A); d(T) ≈ 8,06 ≤ OPT ≤ d(H) ≤ 2·d(T) ≈ 16,13; arány d(H)/OPT ≈ 1,37"}];
const CODE = ["MetricTSP2Approx(G, d):", "    T = MinimumSpanningTree(G, d)   // Prim A-ból", "    L = []", "    DFS(T, root, L):", "        L.append(root)", "        for each (root, w) in T:", "            DFS(T, w, L)", "            L.append(root)", "    H = []", "    seen = új üres halmaz", "    for v in L:", "        if v nem seen:", "            H.append(v)", "            seen.add(v)", "    // H visszavezetése a kiinduló csúcsba zárja a kört", "    return H"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PTS = {"A": [2, 2], "B": [4, 2], "C": [0, 0], "D": [2, 3], "E": [3, 0]};
const fmt = x => x.toFixed(2).replace(".", ",");
const D = (P, u, v) => Math.hypot(P[u][0] - P[v][0], P[u][1] - P[v][1]);
function prim(P){ const nm = Object.keys(P), key = {}, par = {}, done = new Set();
  nm.forEach(v => { key[v] = Infinity; par[v] = null; }); key[nm[0]] = 0;
  while (done.size < nm.length) { let u = null; nm.forEach(v => { if (!done.has(v) && (u === null || key[v] < key[u])) u = v; }); done.add(u);
    nm.forEach(v => { if (!done.has(v) && D(P, u, v) < key[v] - 1e-12) { key[v] = D(P, u, v); par[v] = u; } }); }
  const ch = {}; nm.forEach(v => ch[v] = nm.filter(w => par[w] === v).sort()); return [par, ch]; }
function euler(ch, r){ const L = []; (function dfs(x){ L.push(x); ch[x].forEach(w => { dfs(w); L.push(x); }); })(r); return L; }
const tourLen = (T, P) => T.reduce((s, v, i) => s + D(P, v, T[(i + 1) % T.length]), 0);
function opt(P){ const nm = Object.keys(P), rest = nm.slice(1); let best = [Infinity, null];
  (function perm(a, used){ if (a.length === rest.length) { const T = [nm[0]].concat(a), c = tourLen(T, P); if (c < best[0] - 1e-12) best = [c, T]; return; }
    for (const v of rest) if (!used.has(v)) { used.add(v); a.push(v); perm(a, used); a.pop(); used.delete(v); } })([], new Set());
  return best; }
let MSTE = [], LL = [], BEST = null;
function build(P){
  const [par, ch] = prim(P), nm = Object.keys(P), root = nm[0];
  MSTE = nm.filter(v => par[v]).map(v => [par[v], v]); const dt = MSTE.reduce((s, e) => s + D(P, e[0], e[1]), 0);
  LL = euler(ch, root); BEST = opt(P);
  const st = [{phase: "mst", ei: 0, H: [], skip: [], line: 1, msg: `T = MST (Prim ${root}-ból): ` + MSTE.map(e => e[0] + e[1]).join(", ") + `; d(T) ≈ ${fmt(dt)}`}];
  let run = 0;
  for (let i = 1; i < LL.length; i++) { run += D(P, LL[i-1], LL[i]); const back = LL.slice(0, i).includes(LL[i]);
    st.push({phase: "euler", ei: i, H: [], skip: [], line: back ? 7 : 4, msg: `Euler-lépés ${i}: ${LL[i-1]} → ${LL[i]} (${back ? "visszatérés a szülőhöz" : "gyermek bejárása"}); d(L) eddig ≈ ${fmt(run)}`}); }
  const H = [], seen = new Set(); let last = null, acc = 0, skip = [];
  LL.forEach((v, i) => { if (i) acc += D(P, LL[i-1], v);
    if (!seen.has(v)) { let msg;
      if (last !== null && skip.length) msg = `L[${i}] = ${v} új: rövidítés ${last} → ${v}, átugorva: ${skip.join("→")}; d(${last},${v}) ≈ ${fmt(D(P, last, v))} ≤ ${fmt(acc)} (megtakarítás ≈ ${fmt(acc - D(P, last, v))})`;
      else if (last !== null) msg = `L[${i}] = ${v} új: H-ba kerül (faél ${last} → ${v}, ≈ ${fmt(D(P, last, v))})`;
      else msg = `L[0] = ${v}: H = [${v}]`;
      H.push(v); seen.add(v); st.push({phase: "short", ei: LL.length - 1, H: H.slice(), skip: skip.slice(), line: 12, msg}); last = v; acc = 0; skip = []; }
    else { skip.push(v); if (i < LL.length - 1) st.push({phase: "short", ei: LL.length - 1, H: H.slice(), skip: skip.slice(), line: 11, msg: `L[${i}] = ${v} már szerepel (seen): kihagyjuk`}); } });
  const dh = tourLen(H, P);
  st.push({phase: "done", ei: LL.length - 1, H: H.slice(), skip: [], line: 14, msg: `Kör zárása ${H[H.length-1]} → ${H[0]}: d(H) ≈ ${fmt(dh)}; OPT ≈ ${fmt(BEST[0])} (${BEST[1].concat([BEST[1][0]]).join("→")}); d(T) ≈ ${fmt(dt)} ≤ OPT ≤ d(H) ≤ 2·d(T) ≈ ${fmt(2 * dt)}; arány d(H)/OPT ≈ ${fmt(dh / BEST[0])}`});
  return st;
}
const SC = 62, OX = 60, OY = 255, X = p => OX + p[0] * SC, Y = p => OY - p[1] * SC;
function render(s){
  svg.setAttribute("viewBox", "0 0 600 300");
  svg.innerHTML = '<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl2") + '"/></marker></defs>';
  for (let x = 0; x <= 6; x++) el("line", {x1: X([x, 0]), y1: Y([0, -0.4]), x2: X([x, 0]), y2: Y([0, 3.9]), stroke: css("--cellhl"), "stroke-width": 0.6});
  for (let y = 0; y <= 3; y++) el("line", {x1: X([-0.4, 0]), y1: Y([0, y]), x2: X([6.4, 0]), y2: Y([0, y]), stroke: css("--cellhl"), "stroke-width": 0.6});
  const P = PTS, ln = (u, v, a) => el("line", Object.assign({x1: X(P[u]), y1: Y(P[u]), x2: X(P[v]), y2: Y(P[v])}, a));
  MSTE.forEach(([u, v]) => ln(u, v, {stroke: s.phase === "mst" || s.phase === "euler" ? css("--line") : css("--muted"), "stroke-width": s.phase === "mst" ? 4 : 1.2, "stroke-dasharray": s.phase === "short" || s.phase === "done" ? "2 4" : "none"}));
  if (s.phase === "euler") for (let i = 1; i <= s.ei; i++) { const u = LL[i-1], v = LL[i], dx = X(P[v]) - X(P[u]), dy = Y(P[v]) - Y(P[u]), l = Math.hypot(dx, dy) || 1, nx = -dy / l * 7, ny = dx / l * 7;
    el("line", {x1: X(P[u]) + nx + dx / l * 16, y1: Y(P[u]) + ny + dy / l * 16, x2: X(P[v]) + nx - dx / l * 18, y2: Y(P[v]) + ny - dy / l * 18, stroke: css("--hl2"), "stroke-width": i === s.ei ? 3 : 1.6, "marker-end": "url(#ar)"});
    el("text", {x: (X(P[u]) + X(P[v])) / 2 + 2.4 * nx, y: (Y(P[u]) + Y(P[v])) / 2 + 2.4 * ny + 4, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, String(i)); }
  if (s.phase === "short" || s.phase === "done") { for (let i = 1; i < s.H.length; i++) { const tree = MSTE.some(e => (e[0] === s.H[i-1] && e[1] === s.H[i]) || (e[1] === s.H[i-1] && e[0] === s.H[i]));
      ln(s.H[i-1], s.H[i], {stroke: css("--fg"), "stroke-width": 2.4, "stroke-dasharray": tree ? "none" : "7 4"}); }
    if (s.phase === "done") ln(s.H[s.H.length-1], s.H[0], {stroke: css("--fg"), "stroke-width": 2.4});
    if (s.phase === "done" && document.getElementById("showopt").checked) { const T = BEST[1]; T.forEach((v, i) => ln(v, T[(i + 1) % T.length], {stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "10 3 2 3"})); } }
  Object.keys(P).forEach(v => { el("circle", {cx: X(P[v]), cy: Y(P[v]), r: 14, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.5, "data-v": v, style: "cursor:grab"});
    el("text", {x: X(P[v]), y: Y(P[v]) + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", "pointer-events": "none"}, v); });
  el("text", {x: 8, y: 292, "font-size": 12, fill: css("--muted")}, "A pontok húzhatók (rácsra illesztve). Vastag = MST, nyíl = Euler-lépés, szaggatott = rövidítő él.");
}
let DRAG = null;
function svgPt(ev){ const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; return [(ev.clientX - r.left) / r.width * vb.width, (ev.clientY - r.top) / r.height * vb.height]; }
svg.addEventListener("pointerdown", ev => { const v = ev.target.getAttribute && ev.target.getAttribute("data-v"); if (v) { DRAG = v; svg.setPointerCapture(ev.pointerId); } });
svg.addEventListener("pointermove", ev => { if (!DRAG) return; const [px, py] = svgPt(ev);
  const nx = Math.max(0, Math.min(8, Math.round((px - OX) / SC * 2) / 2)), ny = Math.max(-0.5, Math.min(3.5, Math.round((OY - py) / SC * 2) / 2));
  if (nx === PTS[DRAG][0] && ny === PTS[DRAG][1]) return; PTS[DRAG] = [nx, ny]; const kk = k; STEPS = build(PTS); pos.max = STEPS.length - 1; show(Math.min(kk, STEPS.length - 1)); });
svg.addEventListener("pointerup", () => { DRAG = null; });
function addPt(){ const nm = Object.keys(PTS); if (nm.length >= 9) { document.getElementById("err").textContent = "Legfeljebb 9 pont (kimerítő OPT)."; return; }
  const name = "ABCDEFGHI"[nm.length]; PTS[name] = [ (nm.length * 1.7) % 6, (nm.length * 1.3) % 3.5 ]; document.getElementById("err").textContent = ""; setSteps(build(PTS)); }
function reset(){ PTS = JSON.parse(JSON.stringify({"A": [2, 2], "B": [4, 2], "C": [0, 0], "D": [2, 3], "E": [3, 0]})); setSteps(build(PTS)); }
build(PTS);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
