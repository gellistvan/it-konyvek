<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kupac: fa- és tömbnézet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
svg .hit{cursor:pointer}
svg .hit:focus{outline:none}
svg .hit:focus-visible circle, svg .hit:focus-visible rect{stroke-width:4}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Beállítások">
  <span>Indexelés:</span>
  <label><input type="radio" name="base" value="1" checked> 1-alapú (pszeudokód)</label>
  <label><input type="radio" name="base" value="0"> 0-alapú (Python)</label>
  <button id="clr">Kijelölés törlése</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="A 16, 14, 10, 8, 7, 9 max-kupac fája és tömbje; egy csúcsra kattintva a szülő és a gyermekek kiemelődnek."></svg>
<p class="small">Kattintson egy csúcsra vagy tömbcellára (vagy Tab + Enter). Kiemelés: kék = kiválasztott, narancs keret = gyermek,
szaggatott narancs = szülő. A 7. hely nem létezik (7 &gt; n = 6). Kezdőállapot: a 9.1.2 kupaca, nincs kijelölés.</p>
<script>
const A = [16, 14, 10, 8, 7, 9], n = A.length;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(par||svg).appendChild(e);return e;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
let sel = null;
const base = () => +document.querySelector("input[name=base]:checked").value;
const lvl = i => Math.floor(Math.log2(i));
function tpos(i){ const d = lvl(i), k = i - 2 ** d; return [30 + (k + 0.5) * 300 / 2 ** d, 50 + d * 85]; }
const AX = 400, AW = 48, AY = 190;
function info(i){
  const b = base(), j = i - 1;
  const L = 2 * i, R = 2 * i + 1, P = Math.floor(i / 2);
  const show = x => b ? x : x - 1;
  const desc = (lab, x) => x >= 1 && x <= n ? `${lab} = ${show(x)} (${A[x-1]})` : `${lab}: nincs (${show(x)} ${b ? ">" : "≥"} ${b ? n : n})`;
  const formula = b ? `bal = 2·${i} = ${L}, jobb = 2·${i} + 1 = ${R}, szülő = ⌊${i}/2⌋ = ${P}`
                    : `bal = 2·${j} + 1 = ${L-1}, jobb = 2·${j} + 2 = ${R-1}, szülő = ⌊(${j} − 1)/2⌋ = ${Math.floor((j-1)/2)}`;
  return `i = ${show(i)} (érték ${A[i-1]}): ` + formula.replace("−1", "−1") + " → "
         + [desc("bal", L), desc("jobb", R), i === 1 ? "szülő: nincs (gyökér)" : `szülő = ${show(P)} (${A[P-1]})`].join("; ");
}
function draw(){
  svg.innerHTML = "";
  const b = base(), hl = css("--hl"), hl2 = css("--hl2"), line = css("--line"), cell = css("--cell"), mut = css("--muted");
  const role = i => sel === null ? "" : i === sel ? "sel" : (i === 2*sel || i === 2*sel+1) ? "kid" : (sel > 1 && i === Math.floor(sel/2)) ? "par" : "";
  el("text", {x: 180, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "(a) fa");
  el("text", {x: AX + 3.5*AW, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "(b) tömb");
  for (let i = 2; i <= 7; i++) { const [x0,y0] = tpos(Math.floor(i/2)), [x1,y1] = tpos(i);
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: line, "stroke-width": 1.4, "stroke-dasharray": i > n ? "3 4" : "none"}); }
  ["0. szint", "1. szint", "2. szint"].forEach((t, d) => el("text", {x: 4, y: 50 + d*85 - 26, "font-size": 11, fill: mut}, t));
  for (let i = 1; i <= 7; i++) {
    const [x, y] = tpos(i), r = role(i);
    const g = el("g", i <= n ? {class: "hit", tabindex: 0, role: "button", "aria-label": `${b ? i : i-1}. csúcs, érték ${A[i-1]}`, "data-i": i} : {});
    el("circle", {cx: x, cy: y, r: 20, fill: r === "sel" ? hl : cell, stroke: r === "kid" || r === "par" ? hl2 : line,
                  "stroke-width": r ? 3.5 : 1.4, "stroke-dasharray": i > n ? "4 3" : r === "par" ? "6 3" : "none"}, undefined, g);
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, fill: r === "sel" ? css("--bg") : css("--fg")}, i <= n ? String(A[i-1]) : "–", g);
    el("text", {x, y: y + 36, "text-anchor": "middle", "font-size": 11, fill: mut}, i <= n ? String(b ? i : i - 1) : `${b ? 7 : 6}: nincs`);
  }
  // tömb
  el("text", {x: AX - 6, y: AY - 10, "text-anchor": "end", "font-size": 11, fill: mut}, b ? "index (1-alapú)" : "index (0-alapú)");
  for (let i = 1; i <= 7; i++) {
    const x = AX + (i-1)*AW, r = role(i);
    const g = el("g", i <= n ? {class: "hit", tabindex: 0, role: "button", "aria-label": `${b ? i : i-1}. cella, érték ${A[i-1]}`, "data-i": i} : {});
    el("rect", {x, y: AY, width: AW, height: AW, fill: r === "sel" ? hl : cell, stroke: r === "kid" || r === "par" ? hl2 : line,
                "stroke-width": r ? 3.5 : 1.2, "stroke-dasharray": i > n ? "4 3" : r === "par" ? "6 3" : "none"}, undefined, g);
    el("text", {x: x + AW/2, y: AY + AW/2 + 6, "text-anchor": "middle", "font-size": 16, fill: r === "sel" ? css("--bg") : css("--fg")}, i <= n ? String(A[i-1]) : "", g);
    el("text", {x: x + AW/2, y: AY - 8, "text-anchor": "middle", "font-size": 12}, String(b ? i : i - 1));
    el("text", {x: x + AW/2, y: AY + AW + 16, "text-anchor": "middle", "font-size": 11, fill: mut}, "szint " + lvl(i));
  }
  // ívek: a kijelölt csúcs gyermekeihez (vagy alapból a 9.1.2 példái)
  const arcs = sel === null ? [[2,4],[2,5],[3,6],[3,7]] : [[sel, 2*sel], [sel, 2*sel+1]];
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${line}"/></marker>`;
  for (const [p, c] of arcs) {
    if (c > 7) continue;
    const x0 = AX + (p - 0.5)*AW, x1 = AX + (c - 0.5)*AW, h = 18 + (x1 - x0) * 0.35;
    el("path", {d: `M${x0},${AY-22} C${x0},${AY-22-h} ${x1},${AY-22-h} ${x1},${AY-22}`, fill: "none", stroke: line,
                "stroke-width": 1.5, "stroke-dasharray": c % 2 ? "6 4" : "none", "marker-end": "url(#ah)", opacity: c > n ? 0.6 : 1});
    if (c > n) { const mx = (x0 + x1)/2, my = AY - 22 - 0.75*h;
      el("path", {d: `M${mx-7},${my-7} L${mx+7},${my+7} M${mx-7},${my+7} L${mx+7},${my-7}`, stroke: line, "stroke-width": 2.5});
      el("text", {x: mx + 12, y: my - 6, "font-size": 11}, `${b ? c : c-1} ${b ? ">" : "≥"} n = ${n}`); }
  }
  el("text", {x: 755, y: 290, "text-anchor": "end", "font-size": 11, fill: mut}, "ív: folytonos = bal gyermek, szaggatott = jobb gyermek, áthúzott = nincs");
  svg.querySelectorAll(".hit").forEach(g => {
    g.addEventListener("click", () => pick(+g.dataset.i));
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(+g.dataset.i); } });
  });
}
const status = document.getElementById("status");
function pick(i){ sel = i; draw(); status.textContent = info(i);
  const f = svg.querySelector(`.hit[data-i="${i}"]`); if (f) f.focus(); }
function refresh(){ draw(); status.textContent = sel === null ? `n = ${n}; ${base() ? "bal(i) = 2i, jobb(i) = 2i + 1, szülő(i) = ⌊i/2⌋" : "bal(i) = 2i + 1, jobb(i) = 2i + 2, szülő(i) = ⌊(i − 1)/2⌋"}. Válasszon egy csúcsot vagy cellát.` : info(sel); }
document.querySelectorAll("input[name=base]").forEach(r => r.addEventListener("change", refresh));
document.getElementById("clr").onclick = () => { sel = null; refresh(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refresh);
refresh();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
