<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>walk_ints + accept_limited trace</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>threshold: <input id="thr" type="number" value="0" aria-label="threshold"></label><label>limit: <input id="lim" type="number" value="2" min="0" max="10" aria-label="limit"></label><button onclick="recalc()">Újraszámolás</button><button onclick="document.getElementById('thr').value=0;document.getElementById('lim').value=3;recalc()">Példa: limit = 3</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A rendezett tömb első két negatív eleme kimarad, a 0 és a 4 elfogadása után az accepted eléri a 2-t, az INT_MAX-nál a callback CB_STOP-ot ad, és a bejárás leáll."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A könyv példája: values = {INT_MAX, −3, 0, INT_MIN, 4} qsort után; visitor_state = {0, 2, 0}. limit = 3 esetén a bejárás CB_OK-val ér véget (accepted = 3).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"rows": [], "acc": 0, "cur": null, "line": 0, "done": false, "msg": "visitor_state = { threshold 0, limit 2, accepted 0 }; walk_ints(values, 5, accept_limited, &visitor_state)"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}], "acc": 0, "cur": 0, "line": 10, "done": false, "msg": "fn(items[0] = INT_MIN, ctx): value < threshold? igen → CB_OK, accepted = 0"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "−3", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}], "acc": 0, "cur": 1, "line": 10, "done": false, "msg": "fn(items[1] = −3, ctx): value < threshold? igen → CB_OK, accepted = 0"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "−3", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "0", "c1": "nem", "c2": "nem (0 < 2)", "r": "CB_OK", "acc": 1, "kind": "acc"}], "acc": 1, "cur": 2, "line": 13, "done": false, "msg": "fn(items[2] = 0, ctx): value < threshold? nem; accepted >= limit? nem (0 < 2) → CB_OK, accepted = 1"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "−3", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "0", "c1": "nem", "c2": "nem (0 < 2)", "r": "CB_OK", "acc": 1, "kind": "acc"}, {"v": "4", "c1": "nem", "c2": "nem (1 < 2)", "r": "CB_OK", "acc": 2, "kind": "acc"}], "acc": 2, "cur": 3, "line": 13, "done": false, "msg": "fn(items[3] = 4, ctx): value < threshold? nem; accepted >= limit? nem (1 < 2) → CB_OK, accepted = 2"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "−3", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "0", "c1": "nem", "c2": "nem (0 < 2)", "r": "CB_OK", "acc": 1, "kind": "acc"}, {"v": "4", "c1": "nem", "c2": "nem (1 < 2)", "r": "CB_OK", "acc": 2, "kind": "acc"}, {"v": "INT_MAX", "c1": "nem", "c2": "igen (2 >= 2)", "r": "CB_STOP", "acc": 2, "kind": "stop"}], "acc": 2, "cur": 4, "line": 11, "done": false, "msg": "fn(items[4] = INT_MAX, ctx): value < threshold? nem; accepted >= limit? igen (2 >= 2) → CB_STOP, accepted = 2"}, {"rows": [{"v": "INT_MIN", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "−3", "c1": "igen", "c2": "–", "r": "CB_OK", "acc": 0, "kind": "skip"}, {"v": "0", "c1": "nem", "c2": "nem (0 < 2)", "r": "CB_OK", "acc": 1, "kind": "acc"}, {"v": "4", "c1": "nem", "c2": "nem (1 < 2)", "r": "CB_OK", "acc": 2, "kind": "acc"}, {"v": "INT_MAX", "c1": "nem", "c2": "igen (2 >= 2)", "r": "CB_STOP", "acc": 2, "kind": "stop"}], "acc": 2, "cur": null, "line": 3, "done": true, "msg": "walk_ints visszatér: result=CB_STOP, accepted=2"}];
const CODE = ["enum cb_result walk_ints(const int *items, size_t count, callback_fn fn, void *ctx) {", "    for (size_t i = 0; i < count; ++i) {", "        enum cb_result result = fn(items[i], ctx);", "        if (result == CB_STOP) return CB_STOP;", "        if (result != CB_OK) return CB_ERROR;", "    }", "    return CB_OK;", "}", "enum cb_result accept_limited(int value, void *ctx) {", "    struct counter *state = ctx;", "    if (value < state->threshold) return CB_OK;", "    if (state->accepted >= state->limit) return CB_STOP;", "    ++state->accepted;", "    return CB_OK;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VALS = [-2147483648, -3, 0, 4, 2147483647], NAMESV = {"-2147483648":"INT_MIN","2147483647":"INT_MAX"};
function nmv(v){ return (NAMESV[String(v)] || String(v)).replace("-","−"); }
const COLS = [["elem", 150], ["value <\nthreshold?", 215], ["accepted >=\nlimit?", 225], ["visszat\u00e9r\u00e9s", 175], ["accepted\nut\u00e1na", 195]];
let THR = 0, LIM = 2;
function render(s){
  svg.setAttribute("viewBox","0 0 1000 480"); svg.innerHTML="";
  const X0=40, CW=118, CH=62, Y0=56, rows=s.rows, line=css("--line");
  el("text",{x:X0,y:30,"font-size":19,"font-weight":"bold"},"rendezett values (qsort után)");
  VALS.forEach((v,i)=>{
    const kind = i<rows.length ? rows[i].kind : null, x=X0+i*CW;
    el("rect",{x:x,y:Y0,width:CW,height:CH,fill:kind==="skip"?css("--cellhl"):css("--cell"),stroke:s.cur===i?css("--hl"):line,
      "stroke-width":s.cur===i?4:(kind==="acc"||kind==="stop"?3:1.2),"stroke-dasharray":kind==="skip"?"2 4":""});
    if(kind==="stop"){ el("rect",{x:x+5,y:Y0+5,width:CW-10,height:CH-10,fill:"none",stroke:line,"stroke-width":1.2});
      el("text",{x:x+CW/2,y:Y0-10,"text-anchor":"middle","font-size":17,"font-weight":"bold"},"STOP"); }
    el("text",{x:x+CW/2,y:Y0+CH/2+7,"text-anchor":"middle","font-size":19},nmv(v));
    el("text",{x:x+CW/2,y:Y0+CH+20,"text-anchor":"middle","font-size":15,fill:css("--muted")},"["+i+"]");
  });
  el("rect",{x:690,y:Y0-10,width:290,height:104,fill:css("--cell"),stroke:line,"stroke-width":2});
  ["struct counter visitor_state","threshold "+THR+", limit "+LIM,"accepted "+s.acc].forEach((t,j)=>
    el("text",{x:835,y:Y0+18+j*28,"text-anchor":"middle","font-size":18,"font-weight":j===2?"bold":"normal"},t));
  let x=X0; const ty=190;
  COLS.forEach(([h,w])=>{ el("rect",{x:x,y:ty,width:w,height:40,fill:css("--cellhl"),stroke:line});
    el("text",{x:x+w/2,y:ty+26,"text-anchor":"middle","font-size":16,"font-weight":"bold"},h.replace("\n"," ")); x+=w; });
  rows.forEach((r,j)=>{ x=X0; const vals=[r.v,r.c1,r.c2,r.r,String(r.acc)];
    COLS.forEach(([h,w],c)=>{ el("rect",{x:x,y:ty+40+j*36,width:w,height:36,fill:css("--cell"),stroke:line,"stroke-width":r.kind==="stop"?2.6:1});
      el("text",{x:x+w/2,y:ty+40+j*36+24,"text-anchor":"middle","font-size":16,"font-weight":r.kind==="stop"?"bold":"normal"},vals[c]); x+=w; });
  });
  if(s.done) el("text",{x:X0,y:ty+40+5*36+34,"font-size":18,"font-weight":"bold"},s.msg);
}
function traceJS(values,thr,lim){
  let acc=0; const rows=[], st=[{rows:[],acc:0,cur:null,line:0,done:false,
    msg:"visitor_state = { threshold "+thr+", limit "+lim+", accepted 0 }; walk_ints(values, "+values.length+", accept_limited, &visitor_state)"}];
  let result="CB_OK";
  for(let i=0;i<values.length;i++){
    const v=values[i]; let r,kind,c1,c2,line;
    if(v<thr){r="CB_OK";kind="skip";c1="igen";c2="–";line=10;}
    else if(acc>=lim){r="CB_STOP";kind="stop";c1="nem";c2="igen ("+acc+" >= "+lim+")";line=11;}
    else{acc++;r="CB_OK";kind="acc";c1="nem";c2="nem ("+(acc-1)+" < "+lim+")";line=13;}
    rows.push({v:nmv(v),c1,c2,r,acc,kind});
    st.push({rows:rows.map(o=>Object.assign({},o)),acc,cur:i,line,done:false,
      msg:"fn(items["+i+"] = "+nmv(v)+", ctx): value < threshold? "+c1+(c2!=="–"?"; accepted >= limit? "+c2:"")+" → "+r+", accepted = "+acc});
    if(r==="CB_STOP"){result="CB_STOP";break;}
  }
  st.push({rows:rows.map(o=>Object.assign({},o)),acc,cur:null,line:result==="CB_STOP"?3:6,done:true,
    msg:"walk_ints visszatér: result="+result+", accepted="+acc});
  return st;
}
function recalc(){
  const t=parseInt(document.getElementById("thr").value,10), l=parseInt(document.getElementById("lim").value,10);
  const m=document.getElementById("err");
  if(!Number.isInteger(t)||!Number.isInteger(l)||l<0||l>10){m.textContent="threshold: egész; limit: 0–10.";return;}
  m.textContent=""; THR=t; LIM=l; setSteps(traceJS(VALS,t,l));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
