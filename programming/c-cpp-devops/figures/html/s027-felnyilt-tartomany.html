<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A [first, last) tartomány bejárása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Tömb (4 elem): <input id="inp" value="12, 7, -3, 9" size="16" aria-label="A samples tömb négy eleme"></label><button onclick="loadArr()">Betöltés</button><button onclick="document.getElementById('inp').value='12, 7, 3, 9';loadArr()">Példa: nincs negatív</button><span id="err" class="small" aria-live="polite"></span><label style="flex-basis:100%">p + n kipróbálása: n = <input id="noff" type="range" min="0" max="5" value="0" oninput="offMsg()" aria-label="n értéke a first + n kifejezésben" style="width:180px"></label><span id="offmsg" class="small" aria-live="polite">first + 0: dereferálható elem (cím 0x1000)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy elemű int tömb; a p pointer a 0. elemtől lép, a 2. indexen talál negatív értéket; a 4. pozíció one-past végpont, az 5. pozíció képzése már UB."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A könyv samples = {12, 7, -3, 9} példája; várt kimenet: count=4, index=2 value=-3. Címek: illusztráció, nem mérés (sizeof(int) == 4).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 0, "hit": null, "line": 2, "msg": "p = first (index 0); p != last (0 ≠ 4) → a törzs fut", "a": [12, 7, -3, 9]}, {"p": 0, "hit": null, "line": 3, "msg": "*p = a[0] = 12 < 0 → hamis", "a": [12, 7, -3, 9]}, {"p": 1, "hit": null, "line": 2, "msg": "++p → index 1; p != last (1 ≠ 4) → a törzs fut", "a": [12, 7, -3, 9]}, {"p": 1, "hit": null, "line": 3, "msg": "*p = a[1] = 7 < 0 → hamis", "a": [12, 7, -3, 9]}, {"p": 2, "hit": null, "line": 2, "msg": "++p → index 2; p != last (2 ≠ 4) → a törzs fut", "a": [12, 7, -3, 9]}, {"p": 2, "hit": null, "line": 3, "msg": "*p = a[2] = -3 < 0 → igaz", "a": [12, 7, -3, 9]}, {"p": 2, "hit": 2, "line": 4, "msg": "return p: hit = first + 2; index = hit − first = 2  →  count=4, index=2 value=-3", "a": [12, 7, -3, 9]}];
const CODE = ["static int *find_first_negative(int *first, int *last)", "{", "    for (int *p = first; p != last; ++p) {", "        if (*p < 0) {", "            return p;", "        }", "    }", "    return last;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 1000 330"); svg.innerHTML="";
  const a=s.a||CUR, X0=150, CW=120, CH=62, cy=130, fg=css("--fg");
  if(!document.getElementById("mk")){
    const d=document.createElementNS(NS,"defs");
    d.innerHTML='<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="'+fg+'"/></marker>';
    d.id="mk"; svg.appendChild(d);
  } else svg.appendChild(document.getElementById("mk"));
  for(let i=0;i<6;i++){
    const x=X0+i*CW;
    let dash="", lw=1.4, txt="", sub="", addr="";
    if(i<4){ txt=String(a[i]).replace("-","−"); lw=(i===s.p&&s.p<4)?4:1.4; sub="["+i+"] +"+(4*i)+" B"; addr="0x"+(0x1000+4*i).toString(16);}
    else if(i===4){ dash="7 4"; txt="one-past"; sub="képezhető"; addr="0x1010";}
    else { dash="1.5 3.5"; txt="a + 5"; sub="UB: képzés"; addr="—";}
    const fill=(s.hit===i&&i<4)?css("--cellhl"):css("--cell");
    el("rect",{x:x,y:cy,width:CW,height:CH,fill:fill,stroke:css("--line"),"stroke-width":lw,"stroke-dasharray":dash});
    if(i===5){el("line",{x1:x,y1:cy,x2:x+CW,y2:cy+CH,stroke:css("--line")});el("line",{x1:x,y1:cy+CH,x2:x+CW,y2:cy,stroke:css("--line")});}
    el("text",{x:x+CW/2,y:cy+CH/2+7,"text-anchor":"middle","font-size":i<4?22:19},txt);
    el("text",{x:x+CW/2,y:cy+CH+24,"text-anchor":"middle","font-size":17},sub);
    el("text",{x:x+CW/2,y:cy+CH+48,"text-anchor":"middle","font-size":16,fill:css("--muted")},addr);
  }
  function ptr(i,label,dx,w,dash,below){
    const x=X0+i*CW+CW/2+dx;
    if(below){el("line",{x1:x,y1:cy+CH+110,x2:x,y2:cy+CH+60,stroke:fg,"stroke-width":w,"stroke-dasharray":dash||"","marker-end":"url(#ar)"});
      el("text",{x:x,y:cy+CH+128,"text-anchor":"middle","font-size":18,"font-weight":"bold"},label);}
    else{el("line",{x1:x,y1:cy-52,x2:x,y2:cy-3,stroke:fg,"stroke-width":w,"stroke-dasharray":dash||"","marker-end":"url(#ar)"});
      el("text",{x:x,y:cy-60,"text-anchor":"middle","font-size":18,"font-weight":w>2?"bold":"normal"},label);}
  }
  ptr(0,"first",-30,1.3); ptr(4,"last",0,1.3);
  if(s.p!==undefined&&s.p!==null) ptr(s.p,"p",30,3.2);
  if(s.hit!==undefined&&s.hit!==null) ptr(s.hit,"hit",44,3.2,"6 4");
  const n=+document.getElementById("noff").value;
  ptr(n,"first + "+n,0,1.6,"2 3",true);
}
let CUR=[12, 7, -3, 9];
function trace(a){
  const n=a.length, st=[]; let p=0;
  st.push({a,p:0,hit:null,line:2,msg:"p = first (index 0); p != last (0 ≠ "+n+") → a törzs fut"});
  while(p!==n){
    const v=a[p];
    if(v<0){ st.push({a,p,hit:null,line:3,msg:"*p = a["+p+"] = "+v+" < 0 → igaz"});
      st.push({a,p,hit:p,line:4,msg:"return p: hit = first + "+p+"; index = hit − first = "+p+"  →  count="+n+", index="+p+" value="+v});
      return st;}
    st.push({a,p,hit:null,line:3,msg:"*p = a["+p+"] = "+v+" < 0 → hamis"});
    p++;
    if(p!==n) st.push({a,p,hit:null,line:2,msg:"++p → index "+p+"; p != last ("+p+" ≠ "+n+") → a törzs fut"});
    else st.push({a,p,hit:null,line:2,msg:"++p → p == last (one-past, index "+n+"): képezhető, nem dereferálható; kilépés"});
  }
  st.push({a,p:n,hit:n,line:7,msg:"return last: nincs találat  →  count="+n+", not found"});
  return st;
}
function loadArr(){
  const raw=document.getElementById("inp").value.split(/[ ,;]+/).filter(x=>x!=="").map(Number);
  const m=document.getElementById("err");
  if(raw.length!==4||raw.some(x=>!Number.isInteger(x))){m.textContent="Pontosan 4 egész számot adjon meg.";return;}
  m.textContent=""; CUR=raw; setSteps(trace(raw));
}
function offMsg(){
  const n=+document.getElementById("noff").value, o=document.getElementById("offmsg");
  o.textContent = n<4 ? "first + "+n+": dereferálható elem (cím 0x"+(0x1000+4*n).toString(16)+")"
    : (n===4 ? "first + 4 = last: one-past (0x1010) – képezhető, összehasonlítható, de nem dereferálható"
             : "first + 5: UB – már a pointer képzése tilos");
  show(k);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
