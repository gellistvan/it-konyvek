<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lower_bound: a [t0, t1) időablak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>t0 <input id="t0" type="number" min="800" max="1300" step="1" value="1000" style="width:5.5em"></label> <label>t1 <input id="t1" type="number" min="800" max="1300" step="1" value="1200" style="width:5.5em"></label> <button id="go" onclick="recompute()">Újraszámol</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat rekord; az első keresés az 1-es, a második a 4-es indexnél áll meg; a köztük lévő három rekord átlaga 201,7."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A felezés a libstdc++ __lower_bound hű átirata (half = len >> 1). Kezdőállapot: t0 = 1000, t1 = 1200, a g++ 15.2-vel futtatott conn_query kimenete: találat=3 átlag=201.7. Saját t0/t1: egész 800–1300.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: rendezett vektor, mindkét keresés a teljes [0,6) tartományon (t0=1000, t1=1200).", "line": 0, "ph": 0, "f": 0, "n": 6, "mid": -1, "res": [null, null]}, {"msg": "lower_bound(1000): first=0, len=6, közép=3, comp=hamis (1000 < 1000) → [0,3)", "line": 6, "ph": 0, "f": 0, "n": 3, "mid": 3, "res": [null, null]}, {"msg": "lower_bound(1000): first=0, len=3, közép=1, comp=hamis (1000 < 1000) → [0,1)", "line": 6, "ph": 0, "f": 0, "n": 1, "mid": 1, "res": [null, null]}, {"msg": "lower_bound(1000): first=0, len=1, közép=0, comp=igaz (900 < 1000) → [1,1)", "line": 4, "ph": 0, "f": 1, "n": 0, "mid": 0, "res": [null, null]}, {"msg": "lower_bound(1000) = 1 (alsó határ)", "line": 8, "ph": 0, "f": 1, "n": 0, "mid": -1, "res": [1, null]}, {"msg": "lower_bound(1200): first=0, len=6, közép=3, comp=igaz (1000 < 1200) → [4,6)", "line": 4, "ph": 1, "f": 4, "n": 2, "mid": 3, "res": [1, null]}, {"msg": "lower_bound(1200): first=4, len=2, közép=5, comp=hamis (1200 < 1200) → [4,5)", "line": 6, "ph": 1, "f": 4, "n": 1, "mid": 5, "res": [1, null]}, {"msg": "lower_bound(1200): first=4, len=1, közép=4, comp=hamis (1200 < 1200) → [4,4)", "line": 6, "ph": 1, "f": 4, "n": 0, "mid": 4, "res": [1, null]}, {"msg": "lower_bound(1200) = 4 (felső határ)", "line": 8, "ph": 1, "f": 4, "n": 0, "mid": -1, "res": [1, 4]}, {"msg": "találat=3 átlag=201.7", "line": -1, "ph": 2, "f": 0, "n": 0, "mid": -1, "res": [1, 4]}];
const CODE = ["while (len > 0) {                       // libstdc++ __lower_bound", "    auto half = len >> 1;", "    auto middle = first + half;", "    if (comp(*middle, t)) {             // middle->ts_ms < t", "        first = middle + 1;             // igaz: a jobb fél marad", "        len = len - half - 1;", "    } else len = half;                  // hamis: a bal fél marad", "}", "return first;"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DATA = [[900, 1, 140], [1000, 3, 180], [1000, 5, 205], [1000, 7, 220], [1200, 4, 275], [1200, 9, 310]];
function lb(t){let f=0,n=DATA.length;const st=[];while(n>0){const h=n>>1,m=f+h,c=DATA[m][0]<t;
  const nf=c?m+1:f, nn=c?n-h-1:h; st.push([f,n,m,c,nf,nn]); f=nf; n=nn;} return [st,f];}
function stepsFor(t0,t1){const out=[],res=[null,null];
  out.push({msg:`Kezdőállapot: rendezett vektor, mindkét keresés a teljes [0,6) tartományon (t0=${t0}, t1=${t1}).`,line:0,ph:0,f:0,n:6,mid:-1,res:res.slice()});
  [[0,t0],[1,t1]].forEach(([ph,t])=>{const [st,r]=lb(t);
    st.forEach(([f,n,m,c,nf,nn])=>out.push({msg:`lower_bound(${t}): first=${f}, len=${n}, közép=${m}, comp=${c?"igaz":"hamis"} (${DATA[m][0]} < ${t}) → [${nf},${nf+nn})`,line:c?4:6,ph:ph,f:nf,n:nn,mid:m,res:res.slice()}));
    res[ph]=r; out.push({msg:`lower_bound(${t}) = ${r}`+(ph===0?" (alsó határ)":" (felső határ)"),line:8,ph:ph,f:r,n:0,mid:-1,res:res.slice()});});
  const lo=res[0],hi=res[1],n=Math.max(0,hi-lo);let s=0;for(let i=lo;i<hi;i++)s+=DATA[i][2];
  out.push({msg:`találat=${n} átlag=${(n?s/n:0).toFixed(1)}`,line:-1,ph:2,f:0,n:0,mid:-1,res:res.slice()});return out;}
function tval(id){return Math.max(800,Math.min(1300,parseInt(document.getElementById(id).value,10)||0));}
function render(s){
  const T=[tval("t0"),tval("t1")];
  svg.setAttribute("viewBox","0 0 1000 400");
  const X0=300,CW=110,fg=css("--fg"),mu=css("--muted"),cell=css("--cell"),hl=css("--cellhl");
  let h=`<defs><pattern id="hp" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="${mu}" stroke-width="1.4"/></pattern></defs>`;
  const tx=(x,y,t,o)=>{o=o||{};h+=`<text x="${x}" y="${y}" font-size="${o.fs||18}" text-anchor="${o.a||"middle"}"${o.b?' font-weight="bold"':""}${o.m?' fill="'+mu+'"':""}>${t}</text>`;};
  tx(10,30,"index",{a:"start",m:1}); tx(10,72,"ts (conn_id · rtt)",{a:"start"});
  const lo=s.res[0],hi=s.res[1];
  DATA.forEach((c,i)=>{const x=X0+i*CW, win=(s.ph===2&&i>=lo&&i<hi);
    tx(x+CW/2,30,i,{m:1});
    h+=`<rect x="${x}" y="44" width="${CW}" height="52" fill="${win?hl:cell}" stroke="${fg}" stroke-width="${win?3.5:1.2}"/>`;
    tx(x+CW/2,66,c[0],{fs:19,b:1}); tx(x+CW/2,88,c[1]+" · "+c[2],{fs:15});});
  [0,1].forEach(b=>{const y0=130+b*125, t=T[b];
    tx(10,y0+18,`lower_bound(t${b}=${t})`,{a:"start",b:1});
    tx(10,y0+48,`ts < ${t}:`,{a:"start"});
    let f=0,n=6,mid=-1,done=false;
    if(s.ph>b){f=s.res[b];n=0;done=true;} else if(s.ph===b){f=s.f;n=s.n;mid=s.mid;done=(s.res[b]!==null);}
    DATA.forEach((c,i)=>{const x=X0+i*CW, out=(s.ph>=b)&&!(i>=f&&i<f+n), y=y0+56;
      tx(x+CW/2,y0+48,c[0]<t?"I":"H",{b:c[0]<t});
      h+=`<rect x="${x}" y="${y}" width="${CW}" height="40" fill="${cell}" stroke="${fg}" stroke-width="${i===mid?4:1.2}"/>`;
      if(out)h+=`<rect x="${x}" y="${y}" width="${CW}" height="40" fill="url(#hp)"/>`;
      tx(x+CW/2,y+26,c[0],{fs:17,b:i===mid});});
    if(s.ph>=b){const xf=X0+f*CW, xl=X0+(f+n)*CW, y=y0+108;
      if(done){h+=`<path d="M${xf} ${y+8}V${y-10}" stroke="${fg}" stroke-width="3"/>`; tx(xf+6,y+8,`= ${f}`,{a:"start",b:1});}
      else{tx(xf,y+8,"first",{fs:15}); if(n>0||true)tx(xl,y+8,"first+len",{fs:15});
        h+=`<path d="M${xf} ${y-6}V${y-14}M${xl} ${y-6}V${y-14}" stroke="${fg}" stroke-width="2"/>`;}}
  });
  if(s.ph===2){const n=Math.max(0,hi-lo);tx(10,392,`[${lo}, ${hi}) → ${s.msg}`,{a:"start",b:1});}
  svg.innerHTML=h;
}
function recompute(){const a=tval("t0"),b=tval("t1");document.getElementById("t0").value=a;document.getElementById("t1").value=b;setSteps(stepsFor(a,b));}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
