<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineáris próbálás tombstone-nal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>
:root{--f-w:#fff;--f-g:#e6e6e6;--f-d:#bdbdbd;--f-k:#404040;--f-hl:#d6e4f0;--f-hl2:#f8dcc8;
--c-k:#000;--c-mut:#777;--c-hl:#1f4e79;--c-hl2:#c55a11;--c-err:#b00000;--c-inv:#fff;--c-ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--f-w:#262626;--f-g:#3a3a3a;--f-d:#5a5a5a;--f-k:#cfcfcf;
--f-hl:#24425f;--f-hl2:#5a3a20;--c-k:#ddd;--c-mut:#999;--c-hl:#8fb8e8;--c-hl2:#f0a060;--c-err:#ff7b7b;
--c-inv:#111;--c-ok:#7fd08f}}
.ctl label{white-space:nowrap} .ctl input[type=text]{font:13px ui-monospace,monospace;padding:2px 4px}
</style>
<label>kulcs <input id="kk" type="text" size="7" value="log" aria-label="kulcs"></label>
<label>kezdőhely <select id="kh" aria-label="kezdőhely"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></label>
<button id="bI">Beszúr</button><button id="bD">Töröl</button><button id="bF">Keres</button>
<label><input id="bug" type="checkbox"> hibás törlés (EMPTY)</label>
<button id="bR">Rehash (16)</button><button id="b0">Könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc slotos tábla; az env, log, port kulcsok a 2–4. slotban; a log törlése után a 3. slot tombstone, a port keresése átlép rajta és a 4. slotban talál; EMPTY esetén a keresés tévesen leállna."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető hash (H(env) = H(log) = H(port) = 2), nem mérés. Saját művelet: a gombok az aktuális lépés táblájából folytatják (a beszúrás korlátja a fejezet szerint n &lt; m/2). Jelölés: teli = LIVE, csíkozott † = DEAD, üres = EMPTY; szaggatott útvonal = hibás ág.</p>

}

function kcss(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function kFill(f){return f==="n"?"none":kcss("--f-"+f);}
function kCol(c){return kcss("--c-"+c);}
const KDASH_ = {solid:"", dash:"5 3", dot:"1.2 2.2", dashdot:"6 2 1.5 2"};
function kDefs(){
  const d = el("defs", {});
  const mk = (id, body) => { const p = document.createElementNS(NS, "pattern");
    p.setAttribute("id", id); p.setAttribute("width", 6); p.setAttribute("height", 6);
    p.setAttribute("patternUnits", "userSpaceOnUse"); p.innerHTML = body; d.appendChild(p); };
  const s = kCol("k");
  mk("kh-s", `<path d="M-1,1 l2,-2 M0,6 l6,-6 M5,7 l2,-2" stroke="${s}" stroke-width="0.9"/>`);
  mk("kh-b", `<path d="M-1,5 l2,2 M0,0 l6,6 M5,-1 l2,2" stroke="${s}" stroke-width="0.9"/>`);
  mk("kh-d", `<circle cx="3" cy="3" r="0.9" fill="${s}"/>`);
  mk("kh-x", `<path d="M0,0 l6,6 M6,0 l-6,6" stroke="${s}" stroke-width="0.8"/>`);
}
const KHP_ = {"/":"kh-s", "\\":"kh-b", ".":"kh-d", "x":"kh-x"};
function kHead(p0, p1, col, size){
  const dx = p1[0]-p0[0], dy = p1[1]-p0[1], L = Math.hypot(dx, dy) || 1, ux = dx/L, uy = dy/L;
  const bx = p1[0]-ux*size, by = p1[1]-uy*size, w = size*0.42;
  el("polygon", {points: `${p1[0]},${p1[1]} ${bx-uy*w},${by+ux*w} ${bx+uy*w},${by-ux*w}`, fill: col, stroke: col});
}
function drawScene(P){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${KW_} ${KH_}`); kDefs();
  for (const p of P){
    if (p.t === "r" || p.t === "c"){
      const a = p.t === "r" ? {x:p.x, y:p.y, width:p.w, height:p.h, rx:p.rx||0} : {cx:p.x, cy:p.y, r:p.r};
      Object.assign(a, {fill: kFill(p.f), stroke: kCol(p.c), "stroke-width": p.lw, "stroke-dasharray": KDASH_[p.ls]});
      el(p.t === "r" ? "rect" : "circle", a);
      if (p.h_){ const b = p.t === "r" ? {x:p.x, y:p.y, width:p.w, height:p.h, rx:p.rx||0} : {cx:p.x, cy:p.y, r:p.r};
        b.fill = `url(#${KHP_[p.h_]})`; b.stroke = "none"; el(p.t === "r" ? "rect" : "circle", b); }
    } else if (p.t === "l"){
      const pts = p.p.map(q => q.join(",")).join(" "), col = kCol(p.c);
      if (p.d){ el("polyline", {points: pts, fill: "none", stroke: col, "stroke-width": p.lw*3.2});
                el("polyline", {points: pts, fill: "none", stroke: kcss("--bg"), "stroke-width": p.lw*1.2}); }
      else el("polyline", {points: pts, fill: "none", stroke: col, "stroke-width": p.lw, "stroke-dasharray": KDASH_[p.ls]});
      const hs = 10 + p.lw*1.5, n = p.p.length;
      if (p.ar === "end" || p.ar === "both") kHead(p.p[n-2], p.p[n-1], col, hs);
      if (p.ar === "start" || p.ar === "both") kHead(p.p[1], p.p[0], col, hs);
    } else if (p.t === "t"){
      const a = {x: p.x, y: p.y, "text-anchor": p.a, "dominant-baseline": "central", "font-size": p.fs, fill: kCol(p.c)};
      if (p.b) a["font-weight"] = "bold"; if (p.i) a["font-style"] = "italic";
      if (p.m) a["font-family"] = "ui-monospace,DejaVu Sans Mono,monospace";
      el("text", a, p.s);
    }
  }
}
function render(s){ drawScene(s.P); }

const BOOK_ = STEPS.slice();
let T_ = null;
function tInit(){ T_ = {m: 8, s: []}; for (let i = 0; i < 8; i++) T_.s.push(["E", "", 0]); }
function tFromLast(){ const f = STEPS[k]; T_ = {m: f.m, s: f.slots.map(x => x.slice())}; }
function tCnt(){ let n = 0, d = 0; for (const x of T_.s){ if (x[0] === "L") n++; if (x[0] === "D") d++; } return [n, d]; }
function tFrame(title, probes, line, msg, bad, place){
  const [n, d] = tCnt(), m = T_.m, cnt = `n=${n}, d=${d}, α=${n}/${m}, β=${n + d}/${m}`;
  const vis = probes.map(p => p[0]).join(", ") || "–";
  const f = {slots: T_.s.map(x => x.slice()), m, probes: probes.map(p => p.slice()), title, bad: !!bad,
             place: place === undefined ? null : place, line, cnt, n, d, msg: `${msg}  |  ${cnt}, vizsgált slotok: ${vis}`};
  f.P = sceneJ(f); return f;
}
function tFind(key, h, title, bad){
  const fr = [], pr = []; let i = h % T_.m;
  for (let c = 0; c < T_.m; c++){
    const [st, kk] = T_.s[i];
    if (st === "E"){ pr.push([i, "empty"]); fr.push(tFrame(title, pr, 3, `keres(${key}): a ${i}. slot EMPTY → „nincs ilyen kulcs”`, bad)); return [fr, null]; }
    if (st === "L" && kk === key){ pr.push([i, "hit"]); fr.push(tFrame(title, pr, 4, `keres(${key}): találat a ${i}. slotban`)); return [fr, i]; }
    pr.push([i, st === "D" ? "dead" : "ne"]);
    fr.push(tFrame(title, pr, 5, `keres(${key}): a ${i}. slot ` + (st === "D" ? "DEAD, átlépjük" : `${kk} ≠ ${key}, tovább`)));
    i = (i + 1) % T_.m;
  }
  fr.push(tFrame(title, pr, 2, `keres(${key}): m vizsgálat után sincs találat`)); return [fr, null];
}
function tInsert(key, h, title){
  const fr = [], pr = []; let tomb = null, i = h % T_.m, stop = null;
  if (!(tCnt()[0] < Math.floor(T_.m / 2))){ fr.push(tFrame(title, [], 8, `beszúr(${key}): n < m/2 nem teljesül → előbb rehash (növelés) kell`)); return fr; }
  for (let c = 0; c < T_.m; c++){
    const [st, kk] = T_.s[i];
    if (st === "E"){ pr.push([i, "free"]); fr.push(tFrame(title, pr, 7, `beszúr(${key}): a ${i}. slot EMPTY → a keresés leáll` + (tomb !== null ? `; cél az első tombstone (${tomb})` : ""))); stop = i; break; }
    if (st === "L" && kk === key){ pr.push([i, "hit"]); fr.push(tFrame(title, pr, 7, `beszúr(${key}): a kulcs már a ${i}. slotban van → értékcsere`)); return fr; }
    let msg;
    if (st === "D"){ pr.push([i, tomb === null ? "tomb" : "dead"]); msg = `beszúr(${key}): a ${i}. slot DEAD` + (tomb === null ? " → első tombstone megjegyezve, keresés tovább" : ", tovább"); if (tomb === null) tomb = i; }
    else { pr.push([i, "ne"]); msg = `beszúr(${key}): a ${i}. slot ${kk} ≠ ${key}, tovább`; }
    fr.push(tFrame(title, pr, 7, msg)); i = (i + 1) % T_.m;
  }
  const tgt = tomb !== null ? tomb : stop;
  T_.s[tgt] = ["L", key, h];
  fr.push(tFrame(title, pr, 8, `beszúr(${key}): a kulcs a ${tgt}. slotba kerül`, false, tgt)); return fr;
}
function tErase(key, h, title, buggy){
  const [fr, i] = tFind(key, h, title); if (i === null) return fr;
  const pr = fr[fr.length - 1].probes;
  T_.s[i] = buggy ? ["E", "", 0] : ["D", "", 0];
  fr.push(tFrame(title, pr, 9, `töröl(${key}): a ${i}. slot ` + (buggy ? "EMPTY (HIBÁS törlés!)" : "DEAD (tombstone)"), false, i)); return fr;
}
function tRehash(nm, title){
  const live = T_.s.filter(x => x[0] === "L"), ns = [];
  if (live.length > nm / 2) return [tFrame(title, [], 10, "CFG_LIMIT: live > m′/2")];
  for (let i = 0; i < nm; i++) ns.push(["E", "", 0]);
  for (const [st, kk, h] of live){ let p = h % nm; while (ns[p][0] === "L") p = (p + 1) % nm; ns[p] = [st, kk, h]; }
  T_ = {m: nm, s: ns};
  return [tFrame(title, [], 10, `cfg_rehash(t, ${nm}): a tombstone-ok eltűntek, used == live == ${tCnt()[0]}`)];
}
const VERD_ = {"ne": "≠", "dead": "† átlép", "hit": "találat", "empty": "EMPTY: leáll", "tomb": "† tomb", "free": "EMPTY: ide"};
function sceneJ(f){
  const P = [], W = 720, m = f.m, cw = m === 8 ? 70 : 40, x0 = (W - m * cw) / 2, y0 = 86;
  const R = (x, y, w, h, o) => P.push(Object.assign({t: "r", x, y, w, h, f: "w", h_: "", lw: 1.2, ls: "solid", c: "k", rx: 0}, o || {}));
  const X = (x, y, s, o) => P.push(Object.assign({t: "t", x, y, s, fs: 14, a: "middle", b: false, i: false, c: "k", m: false}, o || {}));
  const Ln = (p, o) => P.push(Object.assign({t: "l", p, lw: 1.4, ls: "solid", ar: "", c: "k", d: false}, o || {}));
  X(14, 16, f.title, {fs: 15, a: "start", b: true});
  f.slots.forEach(([st, kk], i) => {
    const x = x0 + i * cw;
    if (st === "L"){ R(x, y0, cw, 46, {f: "d"}); X(x + cw / 2, y0 + 23, kk, {fs: m === 8 ? 15 : 13, b: true, m: true}); }
    else if (st === "D"){ R(x, y0, cw, 46, {h_: "/"}); R(x + cw / 2 - 11, y0 + 12, 22, 22, {lw: 0}); X(x + cw / 2, y0 + 23, "†", {fs: 17, b: true}); }
    else R(x, y0, cw, 46);
    if (f.place === i) R(x - 3, y0 - 3, cw + 6, 52, {f: "n", lw: 3});
    X(x + cw / 2, y0 + 60, String(i), {fs: 13, c: "mut"});
    if (m === 8) X(x + cw / 2, y0 + 78, {L: "LIVE", D: "DEAD", E: "EMPTY"}[st], {fs: 13});
  });
  const pr = f.probes, ls = f.bad ? "dash" : "solid";
  pr.forEach(([i, v], j) => {
    const cx = x0 + i * cw + cw / 2; let lab = VERD_[v];
    if (f.bad && v === "empty") lab = "leáll ✗";
    X(cx, j % 2 === 0 ? 34 : 52, `${j + 1}. ${lab}`, {fs: 13, b: ["hit", "empty", "free"].includes(v), c: f.bad && v === "empty" ? "err" : "k"});
    if (j === 0) Ln([[cx, 62], [cx, y0 - 2]], {lw: 1.6, ls, ar: "end"});
    else { const px = x0 + pr[j - 1][0] * cw + cw / 2;
      if (i > pr[j - 1][0]) Ln([[px + 6, y0 - 2], [px + 6, 68], [cx - 6, 68], [cx - 6, y0 - 2]], {lw: 1.6, ls, ar: "end"}); }
  });
  if (pr.length) X(W - 14, 16, `kezdőhely: ${pr[0][0]}`, {fs: 13, a: "end", c: "mut"});
  let tail = f.cnt;
  if (f.bad && pr.length && pr[pr.length - 1][1] === "empty") tail += "   →  „nincs ilyen kulcs”: TÉVES (a kulcs a táblában van)";
  X(14, y0 + 100, tail, {fs: 14, a: "start", c: f.bad ? "err" : "k"});
  return P;
}
function kRun(kind){
  tFromLast();
  const key = (document.getElementById("kk").value || "x").trim().slice(0, 8), h = +document.getElementById("kh").value;
  let fr;
  if (kind === "I") fr = tInsert(key, h, `beszúr(${key}), kezdőhely ${h}`);
  else if (kind === "D") fr = tErase(key, h, `töröl(${key})` + (document.getElementById("bug").checked ? " – HIBÁS (EMPTY)" : ""), document.getElementById("bug").checked);
  else if (kind === "F") { const r = tFind(key, h, `keres(${key}), kezdőhely ${h}`); fr = r[0]; }
  else fr = tRehash(16, "cfg_rehash(t, 16)");
  const base = STEPS.slice(0, k + 1); setSteps(base.concat(fr)); show(base.length + fr.length - 1);
}
document.getElementById("bI").onclick = () => kRun("I");
document.getElementById("bD").onclick = () => kRun("D");
document.getElementById("bF").onclick = () => kRun("F");
document.getElementById("bR").onclick = () => kRun("R");
document.getElementById("b0").onclick = () => setSteps(BOOK_.slice());


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
