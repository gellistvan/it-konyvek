<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A közös cleanup ág kilépési útjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kilépési ok: <select id="case" onchange="pickCase()" aria-label="Kilépési ok"><option value="handle_nomem">A kezelőobjektum foglalása sikertelen</option><option value="argument">Hibás argumentum vagy méret</option><option value="label_nomem">A címke foglalása sikertelen</option><option value="values_nomem">Az értéktömb foglalása sikertelen</option><option value="negative" selected>Negatív érték másolás közben ({4, −1, 8})</option><option value="success">Siker</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra a batch_create foglalási lépéseivel; minden hibaág a közös cleanup címkére fut, és csak a már megszerzett erőforrásokat szabadítja fel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet ownership.c függvényeinek vezérlési útja; a hat eset eredménye (visszatérési kód, *out, 0 élő allokáció hibánál) GCC 15.2 + ASan futtatással ellenőrizve. Kezdőállapot: negatív érték, {4, −1, 8}.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "negative"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "negative"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "negative"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "negative"}, {"line": 12, "res": ["L", "L", ""], "out": "NULL", "msg": "b->label = malloc(…): a címke élő", "case": "negative"}, {"line": 14, "res": ["L", "L", ""], "out": "NULL", "msg": "memcpy: a címke másolata kész", "case": "negative"}, {"line": 15, "res": ["L", "L", "L"], "out": "NULL", "msg": "b->values = malloc(…): az értéktömb élő", "case": "negative"}, {"line": 19, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[0] = 4 ≥ 0 → b->values[0] = 4", "case": "negative"}, {"line": 18, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[1] = -1 < 0 → status = BATCH_VALUE; goto cleanup (belső)", "case": "negative"}, {"line": 23, "res": ["L", "F", "F"], "out": "NULL", "msg": "batch_deinit(b): values felszabadítva, label felszabadítva; *b = {0}", "case": "negative"}, {"line": 22, "res": ["L", "F", "F"], "out": "NULL", "msg": "return BATCH_VALUE (4)", "case": "negative"}, {"line": 6, "res": ["L", "F", "F"], "out": "NULL", "msg": "status = BATCH_VALUE → goto cleanup (külső)", "case": "negative"}, {"line": 24, "res": ["F", "F", "F"], "out": "NULL", "msg": "batch_destroy(b): batch_deinit(b) (már csak NULL mezők), majd free(b): a kezelőobjektum felszabadítva", "case": "negative"}, {"line": 9, "res": ["F", "F", "F"], "out": "NULL", "msg": "visszatérés: BATCH_VALUE (4), *out == NULL – minden megszerzett erőforrás pontosan egyszer szabadult fel", "case": "negative"}];
const CODE = ["batch_create(label, values, count, &out) {", "    *out = NULL;", "    b = malloc(sizeof *b);", "    if (b == NULL) return BATCH_NOMEM;", "    *b = (struct batch){0};", "    status = batch_init(b, label, values, count);", "    if (status != BATCH_OK) goto cleanup;", "    *out = b;  b = NULL;               /* tulajdonlás átadása */", "cleanup:", "    batch_destroy(b);  return status;  /* b == NULL: semmi */", "batch_init(b, label, values, count) {", "    if (label == NULL || ... || label[0] == '\\0') return BATCH_ARGUMENT;", "    b->label = malloc(label_length + 1);", "    if (b->label == NULL) { status = BATCH_NOMEM; goto cleanup; }", "    memcpy(b->label, label, label_length + 1);", "    b->values = malloc(count * sizeof *b->values);", "    if (b->values == NULL) { status = BATCH_NOMEM; goto cleanup; }", "    for (size_t i = 0; i < count; ++i) {", "        if (values[i] < 0) { status = BATCH_VALUE; goto cleanup; }", "        b->values[i] = values[i]; }", "    b->count = count;  return BATCH_OK;", "cleanup:", "    batch_deinit(b);  return status;", "batch_deinit(b): free(b->values); free(b->label); *b = (struct batch){0};", "batch_destroy(b): if (b == NULL) return; batch_deinit(b); free(b);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALLSTEPS = {"handle_nomem": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "handle_nomem"}, {"line": 2, "res": ["", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b) → NULL", "case": "handle_nomem"}, {"line": 3, "res": ["", "", ""], "out": "NULL", "msg": "return BATCH_NOMEM (3): semmi nem volt megszerezve, *out == NULL", "case": "handle_nomem"}], "argument": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "argument"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "argument"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "argument"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "argument"}, {"line": 11, "res": ["L", "", ""], "out": "NULL", "msg": "label[0] == '\\0' → return BATCH_ARGUMENT (1); a batch_init nem foglalt semmit", "case": "argument"}, {"line": 6, "res": ["L", "", ""], "out": "NULL", "msg": "status = BATCH_ARGUMENT → goto cleanup (külső)", "case": "argument"}, {"line": 24, "res": ["F", "", ""], "out": "NULL", "msg": "batch_destroy(b): batch_deinit(b) (már csak NULL mezők), majd free(b): a kezelőobjektum felszabadítva", "case": "argument"}, {"line": 9, "res": ["F", "", ""], "out": "NULL", "msg": "visszatérés: BATCH_ARGUMENT (1), *out == NULL – minden megszerzett erőforrás pontosan egyszer szabadult fel", "case": "argument"}], "label_nomem": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "label_nomem"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "label_nomem"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "label_nomem"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "label_nomem"}, {"line": 12, "res": ["L", "", ""], "out": "NULL", "msg": "b->label = malloc(…) → NULL", "case": "label_nomem"}, {"line": 13, "res": ["L", "", ""], "out": "NULL", "msg": "status = BATCH_NOMEM; goto cleanup (belső)", "case": "label_nomem"}, {"line": 23, "res": ["L", "", ""], "out": "NULL", "msg": "batch_deinit(b): free(NULL) kétszer – nincs teendő; *b = {0}", "case": "label_nomem"}, {"line": 22, "res": ["L", "", ""], "out": "NULL", "msg": "return BATCH_NOMEM (3)", "case": "label_nomem"}, {"line": 6, "res": ["L", "", ""], "out": "NULL", "msg": "status = BATCH_NOMEM → goto cleanup (külső)", "case": "label_nomem"}, {"line": 24, "res": ["F", "", ""], "out": "NULL", "msg": "batch_destroy(b): batch_deinit(b) (már csak NULL mezők), majd free(b): a kezelőobjektum felszabadítva", "case": "label_nomem"}, {"line": 9, "res": ["F", "", ""], "out": "NULL", "msg": "visszatérés: BATCH_NOMEM (3), *out == NULL – minden megszerzett erőforrás pontosan egyszer szabadult fel", "case": "label_nomem"}], "values_nomem": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "values_nomem"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "values_nomem"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "values_nomem"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "values_nomem"}, {"line": 12, "res": ["L", "L", ""], "out": "NULL", "msg": "b->label = malloc(…): a címke élő", "case": "values_nomem"}, {"line": 14, "res": ["L", "L", ""], "out": "NULL", "msg": "memcpy: a címke másolata kész", "case": "values_nomem"}, {"line": 15, "res": ["L", "L", ""], "out": "NULL", "msg": "b->values = malloc(…) → NULL", "case": "values_nomem"}, {"line": 16, "res": ["L", "L", ""], "out": "NULL", "msg": "status = BATCH_NOMEM; goto cleanup (belső)", "case": "values_nomem"}, {"line": 23, "res": ["L", "F", ""], "out": "NULL", "msg": "batch_deinit(b): label felszabadítva; *b = {0}", "case": "values_nomem"}, {"line": 22, "res": ["L", "F", ""], "out": "NULL", "msg": "return BATCH_NOMEM (3)", "case": "values_nomem"}, {"line": 6, "res": ["L", "F", ""], "out": "NULL", "msg": "status = BATCH_NOMEM → goto cleanup (külső)", "case": "values_nomem"}, {"line": 24, "res": ["F", "F", ""], "out": "NULL", "msg": "batch_destroy(b): batch_deinit(b) (már csak NULL mezők), majd free(b): a kezelőobjektum felszabadítva", "case": "values_nomem"}, {"line": 9, "res": ["F", "F", ""], "out": "NULL", "msg": "visszatérés: BATCH_NOMEM (3), *out == NULL – minden megszerzett erőforrás pontosan egyszer szabadult fel", "case": "values_nomem"}], "negative": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "negative"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "negative"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "negative"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "negative"}, {"line": 12, "res": ["L", "L", ""], "out": "NULL", "msg": "b->label = malloc(…): a címke élő", "case": "negative"}, {"line": 14, "res": ["L", "L", ""], "out": "NULL", "msg": "memcpy: a címke másolata kész", "case": "negative"}, {"line": 15, "res": ["L", "L", "L"], "out": "NULL", "msg": "b->values = malloc(…): az értéktömb élő", "case": "negative"}, {"line": 19, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[0] = 4 ≥ 0 → b->values[0] = 4", "case": "negative"}, {"line": 18, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[1] = -1 < 0 → status = BATCH_VALUE; goto cleanup (belső)", "case": "negative"}, {"line": 23, "res": ["L", "F", "F"], "out": "NULL", "msg": "batch_deinit(b): values felszabadítva, label felszabadítva; *b = {0}", "case": "negative"}, {"line": 22, "res": ["L", "F", "F"], "out": "NULL", "msg": "return BATCH_VALUE (4)", "case": "negative"}, {"line": 6, "res": ["L", "F", "F"], "out": "NULL", "msg": "status = BATCH_VALUE → goto cleanup (külső)", "case": "negative"}, {"line": 24, "res": ["F", "F", "F"], "out": "NULL", "msg": "batch_destroy(b): batch_deinit(b) (már csak NULL mezők), majd free(b): a kezelőobjektum felszabadítva", "case": "negative"}, {"line": 9, "res": ["F", "F", "F"], "out": "NULL", "msg": "visszatérés: BATCH_VALUE (4), *out == NULL – minden megszerzett erőforrás pontosan egyszer szabadult fel", "case": "negative"}], "success": [{"line": 1, "res": ["", "", ""], "out": "NULL", "msg": "*out = NULL", "case": "success"}, {"line": 2, "res": ["L", "", ""], "out": "NULL", "msg": "b = malloc(sizeof *b): a kezelőobjektum élő", "case": "success"}, {"line": 4, "res": ["L", "", ""], "out": "NULL", "msg": "*b = (struct batch){0}: label = NULL, values = NULL (üres állapot)", "case": "success"}, {"line": 5, "res": ["L", "", ""], "out": "NULL", "msg": "batch_init(b, …) hívása", "case": "success"}, {"line": 12, "res": ["L", "L", ""], "out": "NULL", "msg": "b->label = malloc(…): a címke élő", "case": "success"}, {"line": 14, "res": ["L", "L", ""], "out": "NULL", "msg": "memcpy: a címke másolata kész", "case": "success"}, {"line": 15, "res": ["L", "L", "L"], "out": "NULL", "msg": "b->values = malloc(…): az értéktömb élő", "case": "success"}, {"line": 19, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[0] = 3 ≥ 0 → b->values[0] = 3", "case": "success"}, {"line": 19, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[1] = 7 ≥ 0 → b->values[1] = 7", "case": "success"}, {"line": 19, "res": ["L", "L", "L"], "out": "NULL", "msg": "values[2] = 2 ≥ 0 → b->values[2] = 2", "case": "success"}, {"line": 20, "res": ["L", "L", "L"], "out": "NULL", "msg": "b->count = 3; return BATCH_OK", "case": "success"}, {"line": 6, "res": ["L", "L", "L"], "out": "NULL", "msg": "status == BATCH_OK", "case": "success"}, {"line": 7, "res": ["Á", "Á", "Á"], "out": "b", "msg": "*out = b; b = NULL: a tulajdonlás a hívóhoz kerül", "case": "success"}, {"line": 9, "res": ["Á", "Á", "Á"], "out": "b", "msg": "batch_destroy(NULL): nincs teendő; visszatérés BATCH_OK (0), *out == b", "case": "success"}]};
function render(s){
  svg.setAttribute("viewBox","0 0 1000 200"); svg.innerHTML="";
  const names=["kezelőobjektum","címke","értéktömb"], line=css("--line");
  el("text",{x:20,y:28,"font-size":17,"font-weight":"bold"},"erőforrás-oszlop");
  names.forEach((n,i)=>{
    const r=s.res[i], x=20+i*250, y=44;
    el("rect",{x:x,y:y,width:230,height:64,fill:r==="L"?css("--cellhl"):css("--cell"),stroke:line,
      "stroke-width":r==="L"?3:1.2,"stroke-dasharray":r===""?"4 4":""});
    el("text",{x:x+115,y:y+26,"text-anchor":"middle","font-size":17},n);
    el("text",{x:x+115,y:y+50,"text-anchor":"middle","font-size":16,"font-weight":"bold"},
       {"":"nincs megszerezve","L":"élő","F":"felszabadítva","Á":"átadva a hívónak"}[r]);
    if(r==="F"){el("line",{x1:x+6,y1:y+58,x2:x+224,y2:y+6,stroke:line,"stroke-width":2});}
  });
  el("rect",{x:770,y:44,width:200,height:64,fill:css("--cell"),stroke:line,"stroke-width":s.out==="b"?3:1.2});
  el("text",{x:870,y:70,"text-anchor":"middle","font-size":17},"*out");
  el("text",{x:870,y:96,"text-anchor":"middle","font-size":18,"font-weight":"bold"},s.out==="b"?"b (hívó)":"NULL");
  el("text",{x:20,y:150,"font-size":14,fill:css("--muted")},"szürke + vastag keret: élő; áthúzott: felszabadítva; szaggatott: nem szerzett. A kódpanelen a kiemelt sor az aktuális lépés.");
}
function pickCase(){ setSteps(ALLSTEPS[document.getElementById("case").value]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
