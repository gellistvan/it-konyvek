<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>layout_stride padding memóriatérképe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>sorok <input id="e0" type="number" min="1" max="5" value="3" style="width:4em"></label><label>oszlopok <input id="e1" type="number" min="1" max="6" value="4" style="width:4em"></label><label>sorstride s0 <input id="s0" type="number" min="1" max="8" value="5" style="width:4em"></label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tizennégy cellás puffer; a 0–3, 5–8 és 10–13 indexű cellák a 3×4-es mátrix elemei, a 4. és 9. cella padding."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a 43.2.3 példája (extents<3,4>, strides{5,1}). Az offseteket a fejezet képlete adja; a libc++ layout_stride::mapping ugyanezt adta (Clang 22, figures/data/s223_*).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"e0": 3, "e1": 4, "s0": 5, "cur": null, "line": -1, "msg": "extents<3,4>, strides{5,1}: span = 14, size() = 12, padding: buf[4], buf[9]. Lépj tovább az elemek leképezéséhez."}, {"e0": 3, "e1": 4, "s0": 5, "cur": [0, 0], "line": 1, "msg": "m[0,0] → offset = 5·0 + 1·0 = 0"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [0, 1], "line": 1, "msg": "m[0,1] → offset = 5·0 + 1·1 = 1"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [0, 2], "line": 1, "msg": "m[0,2] → offset = 5·0 + 1·2 = 2"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [0, 3], "line": 1, "msg": "m[0,3] → offset = 5·0 + 1·3 = 3"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [1, 0], "line": 1, "msg": "m[1,0] → offset = 5·1 + 1·0 = 5"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [1, 1], "line": 1, "msg": "m[1,1] → offset = 5·1 + 1·1 = 6"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [1, 2], "line": 1, "msg": "m[1,2] → offset = 5·1 + 1·2 = 7"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [1, 3], "line": 1, "msg": "m[1,3] → offset = 5·1 + 1·3 = 8"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [2, 0], "line": 1, "msg": "m[2,0] → offset = 5·2 + 1·0 = 10"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [2, 1], "line": 1, "msg": "m[2,1] → offset = 5·2 + 1·1 = 11"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [2, 2], "line": 1, "msg": "m[2,2] → offset = 5·2 + 1·2 = 12"}, {"e0": 3, "e1": 4, "s0": 5, "cur": [2, 3], "line": 1, "msg": "m[2,3] → offset = 5·2 + 1·3 = 13  (legnagyobb offset)"}, {"e0": 3, "e1": 4, "s0": 5, "cur": null, "line": 2, "msg": "required_span_size() = 1 + (3−1)·5 + (4−1)·1 = 14; 12 használt + 2 padding (buf[4], buf[9]) – a 12 int-es puffer kevés."}];
const CODE = ["std::layout_stride::mapping<std::extents<std::size_t, 3, 4>> map(ext{}, std::array{5uz, 1uz});", "map(i, j) == i * map.stride(0) + j * map.stride(1)   // 5·i + j", "map.required_span_size() == 1 + (3 - 1) * 5 + (4 - 1) * 1   // 14  (a puffer legalább ennyi int)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function lay(e0, e1, s0){
  const offs = {}; for (let i = 0; i < e0; i++) for (let j = 0; j < e1; j++) offs[i*s0 + j] = [i, j];
  const span = (e0 && e1) ? 1 + (e0-1)*s0 + (e1-1) : 0;
  return {offs, span};
}
function render(s){
  svg.innerHTML = "";
  const L = lay(s.e0, s.e1, s.s0), n = L.span, w = Math.min(46, 620 / Math.max(n, 1)), x0 = 20, y0 = 90;
  svg.setAttribute("viewBox", "0 0 " + Math.max(660, x0*2 + n*w) + " 180");
  const curOff = s.cur ? s.cur[0]*s.s0 + s.cur[1] : -1;
  for (let q = 0; q < n; q++){
    const ij = L.offs[q], x = x0 + q*w, on = q === curOff;
    const g = el("g", {});
    const r = el("rect", {x, y: y0, width: w, height: w, fill: ij ? css("--cell") : css("--cellhl"),
      stroke: css("--line"), "stroke-width": on ? 4 : 1.2, "stroke-dasharray": ij ? "" : "4 3"});
    g.appendChild(r);
    const t = el("title", {}, ij ? `m[${ij[0]},${ij[1]}] → offset ${s.s0}·${ij[0]} + ${ij[1]} = ${q}` : `buf[${q}]: padding (nem használt)`);
    r.appendChild(t);
    el("text", {x: x + w/2, y: y0 + w/2 + 5, "text-anchor": "middle", "font-size": Math.min(13, w*0.3)}, ij ? `(${ij[0]},${ij[1]})` : "pad");
    el("text", {x: x + w/2, y: y0 - 8, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(q));
  }
  for (let i = 0; i < s.e0; i++){
    const a = x0 + i*s.s0*w, b = a + s.e1*w;
    el("line", {x1: a + 3, y1: y0 + w + 10, x2: b - 3, y2: y0 + w + 10, stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: (a + b)/2, y: y0 + w + 26, "text-anchor": "middle", "font-size": 12}, `${i}. sor`);
  }
  el("text", {x: x0, y: 40, "font-size": 14}, `extents<${s.e0},${s.e1}>, strides{${s.s0},1}: span = ${n}, size() = ${s.e0*s.e1}, padding = ${n - s.e0*s.e1}`);
  el("text", {x: x0, y: 62, "font-size": 12, fill: css("--muted")}, "felső szám = buf-index · szürke, szaggatott = padding · vastag keret = aktuális elem · vigye az egeret egy cellára");
}
function load(){
  const e0 = +document.getElementById("e0").value, e1 = +document.getElementById("e1").value, s0 = +document.getElementById("s0").value;
  const err = document.getElementById("err");
  if (!(e0 >= 1 && e0 <= 5 && e1 >= 1 && e1 <= 6 && s0 >= 1 && s0 <= 8)) { err.textContent = "sorok 1–5, oszlopok 1–6, sorstride 1–8"; return; }
  if (s0 < e1 && e0 > 1) { err.textContent = `előfeltétel-sértés: s0 = ${s0} < ${e1} oszlop → átfedő (nem egyedi) leképezés, a layout_stride nem fogadja el`; return; }
  err.textContent = "";
  const span = 1 + (e0-1)*s0 + (e1-1);
  const st = [{e0, e1, s0, cur: null, line: -1, msg: `extents<${e0},${e1}>, strides{${s0},1}: span = ${span}, size() = ${e0*e1}, padding = ${span - e0*e1}`}];
  for (let i = 0; i < e0; i++) for (let j = 0; j < e1; j++)
    st.push({e0, e1, s0, cur: [i, j], line: 1, msg: `m[${i},${j}] → offset = ${s0}·${i} + 1·${j} = ${i*s0 + j}`});
  st.push({e0, e1, s0, cur: null, line: 2, msg: `required_span_size() = 1 + (${e0}−1)·${s0} + (${e1}−1)·1 = ${span}; ${e0*e1} használt + ${span - e0*e1} padding`});
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
