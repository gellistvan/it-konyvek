<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpressure-hiszterézis (conn_step)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="evout" checked> EPOLLOUT, send</label><input id="snd" type="number" min="0" max="4096" value="1000" aria-label="send bájtszám (0 = EAGAIN)"><label><input type="checkbox" id="evin" checked> EPOLLIN, recv</label><input id="rcv" type="number" min="0" max="4096" value="1024" aria-label="recv bájtszám (0 = EOF)"><button id="own" type="button">Saját lépés hozzáfűzése</button><button id="rst" type="button">Könyv lépései</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A used lépcsős görbéje 0-ról 4096-ra nő, ekkor az olvasás szünetel; 2048 alá csökkenve újraindul; EOF után a sor kiürül és a kapcsolat lezárható; alatta a paused, az interest és az állapot."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell, nem mérés (RX_CAP = 1024, TX_CAP = 4096, TX_LOW = 2048). Saját lépés: send 0 = EAGAIN, recv 0 = EOF; a recv-et a want = min(1024, 4096 − used) korlátozza – nagyobb kért érték nem megengedett, a modell jelzi és levágja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdetben: used = 0, paused = hamis, ACTIVE, interest = IN|RDHUP.", "line": 0, "used": 0, "paused": false, "interest": "IN|RDHUP", "state": "ACTIVE", "ret": 0}, {"msg": "1. lépés: recv want = min(1024, 4096) = 1024 → 1024. used = 1024, paused = hamis, interest = IN|RDHUP|OUT, állapot = ACTIVE, visszatérés = 0.", "line": 9, "used": 1024, "paused": false, "interest": "IN|RDHUP|OUT", "state": "ACTIVE", "ret": 0}, {"msg": "2. lépés: recv want = min(1024, 3072) = 1024 → 1024. used = 2048, paused = hamis, interest = IN|RDHUP|OUT, állapot = ACTIVE, visszatérés = 0.", "line": 9, "used": 2048, "paused": false, "interest": "IN|RDHUP|OUT", "state": "ACTIVE", "ret": 0}, {"msg": "3. lépés: recv want = min(1024, 2048) = 1024 → 1024. used = 3072, paused = hamis, interest = IN|RDHUP|OUT, állapot = ACTIVE, visszatérés = 0.", "line": 9, "used": 3072, "paused": false, "interest": "IN|RDHUP|OUT", "state": "ACTIVE", "ret": 0}, {"msg": "4. lépés: send: EAGAIN (nincs előrehaladás); recv want = min(1024, 1024) = 1024 → 1024. used = 4096, paused = igaz, interest = OUT, állapot = ACTIVE, visszatérés = 0.", "line": 12, "used": 4096, "paused": true, "interest": "OUT", "state": "ACTIVE", "ret": 0}, {"msg": "5. lépés: send 1000; nincs recv (paused). used = 3096, paused = igaz, interest = OUT, állapot = ACTIVE, visszatérés = 0.", "line": 3, "used": 3096, "paused": true, "interest": "OUT", "state": "ACTIVE", "ret": 0}, {"msg": "6. lépés: send 1100; recv want = min(1024, 2100) = 1024 → 1024. used = 3020, paused = hamis, interest = IN|RDHUP|OUT, állapot = ACTIVE, visszatérés = 0.", "line": 5, "used": 3020, "paused": false, "interest": "IN|RDHUP|OUT", "state": "ACTIVE", "ret": 0}, {"msg": "7. lépés: recv want = 1024 → 0 (EOF) → DRAINING. used = 3020, paused = hamis, interest = OUT, állapot = DRAINING, visszatérés = 0.", "line": 10, "used": 3020, "paused": false, "interest": "OUT", "state": "DRAINING", "ret": 0}, {"msg": "8. lépés: send 3020; nincs recv. used = 0, paused = hamis, interest = –, állapot = DRAINING, visszatérés = 1.", "line": 13, "used": 0, "paused": false, "interest": "–", "state": "DRAINING", "ret": 1}];
const CODE = ["int conn_step(struct conn *c, uint32_t events) {", "  if ((events & EPOLLOUT) && c->used != 0) {", "      ssize_t n = send(c->fd, c->tx, c->used, MSG_NOSIGNAL);", "      ... c->used -= done; memmove(...);  /* EAGAIN: nincs előrehaladás */", "  }", "  if (c->used <= TX_LOW) c->paused = false;", "  if (c->state == ACTIVE && !c->paused && (events & (EPOLLIN | EPOLLRDHUP))) {", "      size_t want = min(TX_CAP - c->used, sizeof c->rx);", "      ssize_t n = recv(c->fd, c->rx, want, 0);", "      if (n > 0) { memcpy(...); c->used += got; }", "      else if (n == 0) c->state = DRAINING;", "  }", "  if (c->used == TX_CAP) c->paused = true;", "  return c->state == DRAINING && c->used == 0 ? 1 : 0;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 1000 430");
  const H=STEPS, X=i=>90+i*(860/Math.max(8,H.length-1)), Y=u=>300-u*(260/4096);
  const fg=css("--fg"), mut=css("--muted"), hl=css("--hl");
  [[4096,"7 4","TX_CAP = 4096: szüneteltetés"],[2048,"2 4","TX_LOW = 2048: újraengedélyezés"]].forEach(([u,d,t])=>{
    el("line",{x1:80,x2:990,y1:Y(u),y2:Y(u),stroke:fg,"stroke-dasharray":d});
    el("text",{x:985,y:Y(u)-6,"text-anchor":"end","font-size":15},t);});
  [0,1024,2048,3072,4096].forEach(u=>el("text",{x:72,y:Y(u)+5,"text-anchor":"end","font-size":13,fill:mut},String(u)));
  el("text",{x:10,y:24,"font-size":14,fill:mut},"used (C bájt)");
  let d="";
  for(let i=0;i<=k;i++){const x=X(i),y=Y(H[i].used); d+=(i?`H${x}V${y}`:`M${x} ${y}`);}
  el("path",{d:d,fill:"none",stroke:fg,"stroke-width":3});
  for(let i=0;i<H.length;i++){
    const on=i===k, x=X(i), s2=H[i], vis=i<=k;
    el("text",{x:x,y:330,"text-anchor":"middle","font-size":14,fill:on?hl:mut,"font-weight":on?"bold":"normal"},String(i));
    if(!vis) continue;
    el("circle",{cx:x,cy:Y(s2.used),r:on?7:4,fill:on?hl:fg});
    el("text",{x:x,y:Y(s2.used)-12,"text-anchor":"middle","font-size":14},String(s2.used));
    el("rect",{x:x-28,y:342,width:56,height:22,fill:s2.paused?css("--line"):css("--cell"),stroke:fg});
    el("text",{x:x,y:385,"text-anchor":"middle","font-size":12},s2.interest);
    el("text",{x:x,y:405,"text-anchor":"middle","font-size":12},s2.state==="ACTIVE"?"ACTIVE":"DRAINING");
  }
  el("text",{x:10,y:358,"font-size":13,fill:mut},"paused");
  el("text",{x:10,y:385,"font-size":13,fill:mut},"interest");
  el("text",{x:10,y:405,"font-size":13,fill:mut},"állapot");
}
// saját lépés: a conn_step JS-átirata (ugyanaz a logika, mint a Python-modellben)
function ownStep(){
  const last=STEPS[k];
  const sendN=Math.max(0,Math.min(4096,+document.getElementById("snd").value||0));
  const recvN=Math.max(0,Math.min(4096,+document.getElementById("rcv").value||0));
  const doOut=document.getElementById("evout").checked, doIn=document.getElementById("evin").checked;
  let used=last.used, paused=last.paused, state=last.state, parts=[];
  if(state==="CLOSED"){return;}
  if(doOut && used!==0){ if(sendN===0) parts.push("send: EAGAIN"); else {const s=Math.min(sendN,used); used-=s; parts.push(`send ${s}`+(sendN>s?` (legfeljebb used = ${s+used} küldhető)`:""));} }
  if(used<=2048) paused=false;
  if(state==="ACTIVE" && !paused && doIn){
    const want=Math.min(4096-used,1024); let r=recvN;
    if(r>want){parts.push(`NEM MEGENGEDETT: recv ${r} > want = ${want}; a recv legfeljebb want bájtot ad`); r=want;}
    if(r>0){used+=r; parts.push(`recv want = ${want} → ${r}`);} else {state="DRAINING"; parts.push(`recv want = ${want} → 0 (EOF) → DRAINING`);}
  } else if(doIn) parts.push(paused?"nincs recv (paused)":"nincs recv");
  if(used===4096) paused=true;
  const ret=(state==="DRAINING"&&used===0)?1:0;
  const m=[]; if(state==="ACTIVE"&&!paused) m.push("IN","RDHUP"); if(used!==0) m.push("OUT");
  const it=m.length?m.join("|"):"–";
  const n=k+1;
  const list=STEPS.slice(0,k+1).concat([{msg:`${n}. (saját) lépés: ${parts.join("; ")||"nincs művelet"}. used = ${used}, paused = ${paused?"igaz":"hamis"}, interest = ${it}, állapot = ${state}, visszatérés = ${ret}.`,
     line: ret?13:(paused&&used===4096?12:(parts.length?9:5)), used:used, paused:paused, interest:it, state:state, ret:ret}]);
  setSteps(list); show(list.length-1);
}
document.getElementById("own").onclick=ownStep;
document.getElementById("rst").onclick=()=>setSteps(BASE);
const BASE=STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
