<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szeletelő view-k</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Nézet"><button data-v="chunk" aria-pressed="true" onclick="pick('chunk')">chunk</button><button data-v="slide" aria-pressed="false" onclick="pick('slide')">slide</button><button data-v="chunk_by" aria-pressed="false" onclick="pick('chunk_by')">chunk_by</button><button data-v="stride" aria-pressed="false" onclick="pick('stride')">stride</button></span><label>n = <input id="nn" type="range" min="0" max="7" value="3" oninput="load()" aria-label="n"> <span id="nv">3</span></label><label>v: <input id="inA" value="1, 2, 3, 4, 5, 6, 7" size="16" aria-label="Bemenet chunk/slide/stride"></label><label>w: <input id="inB" value="1, 2, 3, 10, 11, 20" size="16" aria-label="Bemenet chunk_by"></label><label>pred: <select id="pred" onchange="load()"><option value="abs1">|a−b| ≤ 1</option><option value="eq">a == b</option><option value="lt">a &lt; b</option></select></label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span><span id="selfcheck" class="small" hidden></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 1–7 sorozat chunk(3) után három szeletre (az utolsó egyelemű), slide(3) után öt átfedő ablakra, stride(3) után az 1, 4, 7 elemekre bomlik; az 1, 2, 3, 10, 11, 20 sorozat chunk_by-jal a szomszédos különbségek alapján [1,2,3], [10,11], [20] csoportokra."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a 42.3 példái (v = 1…7, n = 3; w = 1, 2, 3, 10, 11, 20, pred |a−b| ≤ 1). Az eredmény a könyv példáinak lefuttatásából (g++ 15.2, -std=c++23), nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"view": "chunk", "sl": [[0, 3]], "line": 0, "msg": "chunk(3): 1. szelet [1,2,3]; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "chunk", "sl": [[3, 6]], "line": 0, "msg": "chunk(3): 2. szelet [4,5,6]; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "chunk", "sl": [[6, 7]], "line": 0, "msg": "chunk(3): 3. szelet [7] – rövidebb utolsó szelet; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}];
const CODE = ["v | std::views::chunk(n)        // nem átfedő szeletek, ⌈N/n⌉ darab", "v | std::views::slide(n)        // átfedő ablakok, N−n+1 darab (N ≥ n)", "w | std::views::chunk_by(pred)  // pred(előző, aktuális) hamis → vágás", "v | std::views::stride(n)       // minden n-edik elem, ⌈N/n⌉ darab"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PYD = {"A": {"chunk": [{"view": "chunk", "sl": [[0, 3]], "line": 0, "msg": "chunk(3): 1. szelet [1,2,3]; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "chunk", "sl": [[3, 6]], "line": 0, "msg": "chunk(3): 2. szelet [4,5,6]; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "chunk", "sl": [[6, 7]], "line": 0, "msg": "chunk(3): 3. szelet [7] – rövidebb utolsó szelet; darabszám ⌈7/3⌉ = 3", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}], "slide": [{"view": "slide", "sl": [[0, 3]], "line": 1, "msg": "slide(3): 1. ablak 123; 7−3+1 = 5 ablak (átfedő)", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "slide", "sl": [[1, 4]], "line": 1, "msg": "slide(3): 2. ablak 234; 7−3+1 = 5 ablak (átfedő)", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "slide", "sl": [[2, 5]], "line": 1, "msg": "slide(3): 3. ablak 345; 7−3+1 = 5 ablak (átfedő)", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "slide", "sl": [[3, 6]], "line": 1, "msg": "slide(3): 4. ablak 456; 7−3+1 = 5 ablak (átfedő)", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "slide", "sl": [[4, 7]], "line": 1, "msg": "slide(3): 5. ablak 567; 7−3+1 = 5 ablak (átfedő)", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}], "chunk_by": [{"view": "chunk_by", "pair": 0, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(1, 2) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "pair": 1, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(2, 3) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "pair": 2, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(3, 4) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "pair": 3, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(4, 5) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "pair": 4, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(5, 6) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "pair": 5, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(6, 7) = igaz ✓", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}, {"view": "chunk_by", "sl": [[0, 7]], "line": 2, "msg": "chunk_by: utolsó csoport [1,2,3,4,5,6,7]", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": [true, true, true, true, true, true]}], "stride": [{"view": "stride", "sl": [[0, 1]], "line": 3, "msg": "stride(3): 1. elem = 1 (index 0); ⌈7/3⌉ = 3 elem", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "stride", "sl": [[3, 4]], "line": 3, "msg": "stride(3): 2. elem = 4 (index 3); ⌈7/3⌉ = 3 elem", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}, {"view": "stride", "sl": [[6, 7]], "line": 3, "msg": "stride(3): 3. elem = 7 (index 6); ⌈7/3⌉ = 3 elem", "v": [1, 2, 3, 4, 5, 6, 7], "n": 3, "ck": []}]}, "B": {"chunk": [{"view": "chunk", "sl": [[0, 3]], "line": 0, "msg": "chunk(3): 1. szelet [1,2,3]; darabszám ⌈6/3⌉ = 2", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}, {"view": "chunk", "sl": [[3, 6]], "line": 0, "msg": "chunk(3): 2. szelet [10,11,20]; darabszám ⌈6/3⌉ = 2", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}], "slide": [{"view": "slide", "sl": [[0, 3]], "line": 1, "msg": "slide(3): 1. ablak 1,2,3; 6−3+1 = 4 ablak (átfedő)", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}, {"view": "slide", "sl": [[1, 4]], "line": 1, "msg": "slide(3): 2. ablak 2,3,10; 6−3+1 = 4 ablak (átfedő)", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}, {"view": "slide", "sl": [[2, 5]], "line": 1, "msg": "slide(3): 3. ablak 3,10,11; 6−3+1 = 4 ablak (átfedő)", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}, {"view": "slide", "sl": [[3, 6]], "line": 1, "msg": "slide(3): 4. ablak 10,11,20; 6−3+1 = 4 ablak (átfedő)", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}], "chunk_by": [{"view": "chunk_by", "pair": 0, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(1, 2) = igaz ✓", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "pair": 1, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(2, 3) = igaz ✓", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "pair": 2, "ok": false, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(3, 10) = hamis ✗ → vágás", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "sl": [[0, 3]], "line": 2, "msg": "chunk_by: csoport [1,2,3]", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "pair": 3, "ok": true, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(10, 11) = igaz ✓", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "pair": 4, "ok": false, "line": 2, "msg": "chunk_by(|a−b| ≤ 1): pred(11, 20) = hamis ✗ → vágás", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "sl": [[3, 5]], "line": 2, "msg": "chunk_by: csoport [10,11]", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}, {"view": "chunk_by", "sl": [[5, 6]], "line": 2, "msg": "chunk_by: utolsó csoport [20]", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": [true, true, false, true, false]}], "stride": [{"view": "stride", "sl": [[0, 1]], "line": 3, "msg": "stride(3): 1. elem = 1 (index 0); ⌈6/3⌉ = 2 elem", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}, {"view": "stride", "sl": [[3, 4]], "line": 3, "msg": "stride(3): 2. elem = 10 (index 3); ⌈6/3⌉ = 2 elem", "v": [1, 2, 3, 10, 11, 20], "n": 3, "ck": []}]}};
const PREDS = {abs1: ["|a−b| ≤ 1", (a, b) => Math.abs(a - b) <= 1], eq: ["a == b", (a, b) => a === b], lt: ["a < b", (a, b) => a < b]};
function cdiv(a, b){ return Math.floor((a + b - 1) / b); }
function compute(v, n, pk){
  const N = v.length, S = {chunk: [], slide: [], chunk_by: [], stride: []}, [pname, pred] = PREDS[pk || "abs1"];
  if (n <= 0) {
    const msg = "előfeltétel-sértés (n > 0): a view nem számol (UB / assert)";
    ["chunk", "slide", "stride"].forEach(key => S[key].push({view: key, sl: [], msg, line: -1, bad: true}));
  } else {
    const cnt = cdiv(N, n);
    for (let q = 0; q < cnt; q++) { const a = q*n, b = Math.min(N, q*n + n);
      S.chunk.push({view: "chunk", sl: [[a, b]], line: 0, msg: `chunk(${n}): ${q+1}. szelet [${v.slice(a, b).join(",")}]`
        + (b - a < n ? " – rövidebb utolsó szelet" : "") + `; darabszám ⌈${N}/${n}⌉ = ${cnt}`}); }
    const nw = N >= n ? N - n + 1 : 0;
    for (let q = 0; q < nw; q++) S.slide.push({view: "slide", sl: [[q, q + n]], line: 1,
      msg: `slide(${n}): ${q+1}. ablak ${Math.max(...v) < 10 ? v.slice(q, q+n).join("") : v.slice(q, q+n).join(",")}; ${N}−${n}+1 = ${nw} ablak (átfedő)`});
    if (nw === 0) S.slide.push({view: "slide", sl: [], line: 1, msg: `slide(${n}): N = ${N} < n = ${n} → 0 ablak`});
    for (let q = 0; q < cdiv(N, n); q++) S.stride.push({view: "stride", sl: [[q*n, q*n + 1]], line: 3,
      msg: `stride(${n}): ${q+1}. elem = ${v[q*n]} (index ${q*n}); ⌈${N}/${n}⌉ = ${cdiv(N, n)} elem`});
  }
  let start = 0; const checks = [];
  for (let i = 0; i < N - 1; i++) { const ok = !!pred(v[i], v[i+1]); checks.push(ok);
    S.chunk_by.push({view: "chunk_by", pair: i, ok, line: 2, msg: `chunk_by(${pname}): pred(${v[i]}, ${v[i+1]}) = ${ok ? "igaz ✓" : "hamis ✗ → vágás"}`});
    if (!ok) { S.chunk_by.push({view: "chunk_by", sl: [[start, i + 1]], line: 2, msg: `chunk_by: csoport [${v.slice(start, i + 1).join(",")}]`}); start = i + 1; } }
  if (N) S.chunk_by.push({view: "chunk_by", sl: [[start, N]], line: 2, msg: `chunk_by: utolsó csoport [${v.slice(start, N).join(",")}]`});
  for (const key in S) S[key].forEach(s => { s.v = v; s.n = n; s.ck = key === "chunk_by" ? checks : []; });
  return S;
}
let CUR = {A: PYD.A, B: PYD.B}, VIEW = "chunk";
function src(){ return VIEW === "chunk_by" ? CUR.B : CUR.A; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 300");
  const v = s.v, N = v.length, cw = Math.min(56, 600 / Math.max(N, 1)), x0 = 20, y0 = 60, ch = 34;
  if (s.bad) { el("text", {x: 320, y: 150, "text-anchor": "middle", "font-size": 18, fill: css("--hl2")}, "előfeltétel-sértés (n > 0)"); return; }
  const shown = STEPS.slice(0, k + 1).filter(t => t.sl && t.sl.length).map(t => t.sl[0]);
  const cur = s.sl && s.sl.length ? s.sl[0] : null;
  const dash = ["", "6 4", "2 3"];
  v.forEach((x, i) => {
    const skip = VIEW === "stride" && i % s.n !== 0;
    el("rect", {x: x0 + i*cw, y: y0, width: cw, height: ch, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, opacity: skip ? 0.45 : 1});
    el("text", {x: x0 + i*cw + cw/2, y: y0 + ch/2 + 6, "text-anchor": "middle", "font-size": 16, fill: skip ? css("--muted") : css("--fg")}, String(x));
  });
  if (VIEW === "chunk" || VIEW === "chunk_by") {
    shown.forEach((sl, q) => { const on = cur && sl[0] === cur[0] && sl[1] === cur[1];
      el("rect", {x: x0 + sl[0]*cw + 3, y: y0 - 5, width: (sl[1] - sl[0])*cw - 6, height: ch + 10, fill: on ? css("--cellhl") : "none",
        "fill-opacity": 0.5, stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : 2, "stroke-dasharray": dash[q % 3]}); });
  }
  if (VIEW === "chunk_by") {
    s.ck.forEach((ok, i) => { const done = STEPS.slice(0, k + 1).some(t => t.pair === i); if (!done) return;
      const xm = x0 + (i + 1)*cw, on = s.pair === i;
      el("text", {x: xm, y: y0 - 14, "text-anchor": "middle", "font-size": on ? 20 : 16, "font-weight": "bold", fill: ok ? "#2e8b3e" : "#d03030"}, ok ? "✓" : "✗");
      if (!ok) el("path", {d: `M${xm} ${y0 - 8}V${y0 + ch + 8}`, stroke: css("--line"), "stroke-width": 4}); });
  }
  if (VIEW === "slide") {
    shown.forEach((sl, q) => { const on = cur && sl[0] === cur[0];
      el("rect", {x: x0 + sl[0]*cw + 3, y: y0 + ch + 12 + q*22, width: (sl[1] - sl[0])*cw - 6, height: 18, fill: on ? css("--cellhl") : css("--cell"),
        stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1.2, "stroke-dasharray": dash[q % 3]});
      el("text", {x: x0 + (sl[0] + sl[1])/2*cw, y: y0 + ch + 26 + q*22, "text-anchor": "middle", "font-size": 13}, v.slice(sl[0], sl[1]).join(",")); });
  }
  if (VIEW === "stride") {
    shown.forEach(sl => { const on = cur && sl[0] === cur[0];
      el("rect", {x: x0 + sl[0]*cw, y: y0, width: cw, height: ch, fill: on ? css("--cellhl") : "none", "fill-opacity": 0.6,
        stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 3}); });
  }
  const pipe = {chunk: `v | std::views::chunk(${s.n})`, slide: `v | std::views::slide(${s.n})`, chunk_by: "w | std::views::chunk_by(pred)", stride: `v | std::views::stride(${s.n})`}[VIEW];
  el("text", {x: x0, y: 24, "font-size": 15, "font-family": "ui-monospace,monospace"}, pipe);
}
function pick(view){ VIEW = view; document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === view)); setSteps(src()[view]); }
function load(){
  const n = +document.getElementById("nn").value; document.getElementById("nv").textContent = n;
  const parse = id => document.getElementById(id).value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const a = parse("inA"), b = parse("inB"), e = document.getElementById("err");
  if ([a, b].some(r => r.length < 1 || r.length > 12 || r.some(x => !Number.isInteger(x)))) { e.textContent = "1–12 egész számot adj meg soronként."; return; }
  e.textContent = ""; const pk = document.getElementById("pred").value;
  CUR = {A: compute(a, n, pk), B: compute(b, n, pk)}; pick(VIEW);
}
document.getElementById("selfcheck").textContent =
  (JSON.stringify(compute([1,2,3,4,5,6,7], 3, "abs1")) === JSON.stringify(PYD.A) &&
   JSON.stringify(compute([1,2,3,10,11,20], 3, "abs1")) === JSON.stringify(PYD.B)) ? "ok" : "MISMATCH";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
