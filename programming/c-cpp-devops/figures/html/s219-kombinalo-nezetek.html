<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kombináló nézetek bejárása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Nézet"><button data-v="enumerate" aria-pressed="true" onclick="pick('enumerate')">enumerate</button><button data-v="pairwise" aria-pressed="false" onclick="pick('pairwise')">pairwise</button><button data-v="cartesian" aria-pressed="false" onclick="pick('cartesian')">cartesian_product</button><button data-v="zip" aria-pressed="false" onclick="pick('zip')">zip_transform</button></span><label>ms (≤ 6 érték): <input id="inp" value="12, 40, 7, 90" size="18" aria-label="Saját ms-értékek"></label><button onclick="load()">Újraszámolás</button><span id="err" class="small" aria-live="polite"></span><span id="selfcheck" class="small" hidden></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy nézet: enumerate-indexek, pairwise kettes ablakok 28, −33, 83 különbséggel, a 4×4-es Descartes-szorzat bejárási sorrendje egy kiemelt WARN-párral, valamint a zip_transform összegei."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a 42.2.7 logzip.cpp példája. A szintek saját bemenetnél ciklikusan ismétlődnek (INFO, WARN, WARN, ERROR). A kimenet a könyv kódjának futtatásából (g++ 15.2), nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"view": "enumerate", "hl": [0], "line": 1, "out": "0 INFO 12", "msg": "enumerate: index 0 (előjeles ptrdiff_t) + referencia a recs[0]-re → „0 INFO 12”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [1], "line": 1, "out": "1 WARN 40", "msg": "enumerate: index 1 (előjeles ptrdiff_t) + referencia a recs[1]-re → „1 WARN 40”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [2], "line": 1, "out": "2 WARN 7", "msg": "enumerate: index 2 (előjeles ptrdiff_t) + referencia a recs[2]-re → „2 WARN 7”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [3], "line": 1, "out": "3 ERROR 90", "msg": "enumerate: index 3 (előjeles ptrdiff_t) + referencia a recs[3]-re → „3 ERROR 90”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}];
const CODE = ["for (auto&& [i, r] : std::views::enumerate(recs))", "    std::cout << i << ' ' << r.level << ' ' << r.ms << '\\n';", "for (auto&& [a, b] : recs | std::views::pairwise)", "    std::cout << \"delta \" << (b.ms - a.ms) << '\\n';", "for (auto&& [a, b] : std::views::cartesian_product(recs, recs))", "    if (a.level == b.level && a.ms < b.ms) ++worse;", "std::cout << \"worse pairs: \" << worse << '\\n';", "for (int s : std::views::zip_transform(std::plus<>{}, msv, msv))  // msv: transform(&rec::ms)", "    std::cout << \"2x \" << s << '\\n';"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PYV = {"enumerate": [{"view": "enumerate", "hl": [0], "line": 1, "out": "0 INFO 12", "msg": "enumerate: index 0 (előjeles ptrdiff_t) + referencia a recs[0]-re → „0 INFO 12”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [1], "line": 1, "out": "1 WARN 40", "msg": "enumerate: index 1 (előjeles ptrdiff_t) + referencia a recs[1]-re → „1 WARN 40”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [2], "line": 1, "out": "2 WARN 7", "msg": "enumerate: index 2 (előjeles ptrdiff_t) + referencia a recs[2]-re → „2 WARN 7”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "enumerate", "hl": [3], "line": 1, "out": "3 ERROR 90", "msg": "enumerate: index 3 (előjeles ptrdiff_t) + referencia a recs[3]-re → „3 ERROR 90”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}], "pairwise": [{"view": "pairwise", "hl": [0, 1], "line": 3, "out": "delta 28", "msg": "pairwise: ablak [0, 1], b.ms − a.ms = 40 − 12 = 28 → „delta 28”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "pairwise", "hl": [1, 2], "line": 3, "out": "delta -33", "msg": "pairwise: ablak [1, 2], b.ms − a.ms = 7 − 40 = −33 → „delta −33”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "pairwise", "hl": [2, 3], "line": 3, "out": "delta 83", "msg": "pairwise: ablak [2, 3], b.ms − a.ms = 90 − 7 = 83 → „delta 83”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}], "cartesian": [{"view": "cartesian", "hl": [0, 0], "ij": [0, 0], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 1/16. pár (a = recs[0], b = recs[0]): INFO 12 / INFO 12; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [0, 1], "ij": [0, 1], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 2/16. pár (a = recs[0], b = recs[1]): INFO 12 / WARN 40; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [0, 2], "ij": [0, 2], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 3/16. pár (a = recs[0], b = recs[2]): INFO 12 / WARN 7; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [0, 3], "ij": [0, 3], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 4/16. pár (a = recs[0], b = recs[3]): INFO 12 / ERROR 90; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [1, 0], "ij": [1, 0], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 5/16. pár (a = recs[1], b = recs[0]): WARN 40 / INFO 12; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [1, 1], "ij": [1, 1], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 6/16. pár (a = recs[1], b = recs[1]): WARN 40 / WARN 40; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [1, 2], "ij": [1, 2], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 7/16. pár (a = recs[1], b = recs[2]): WARN 40 / WARN 7; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [1, 3], "ij": [1, 3], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 8/16. pár (a = recs[1], b = recs[3]): WARN 40 / ERROR 90; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [2, 0], "ij": [2, 0], "hit": false, "cnt": 0, "line": 5, "out": "", "msg": "cartesian_product: 9/16. pár (a = recs[2], b = recs[0]): WARN 7 / INFO 12; számláló = 0", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [2, 1], "ij": [2, 1], "hit": true, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 10/16. pár (a = recs[2], b = recs[1]): WARN 7 / WARN 40 – azonos szint és a.ms < b.ms → TALÁLAT; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [2, 2], "ij": [2, 2], "hit": false, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 11/16. pár (a = recs[2], b = recs[2]): WARN 7 / WARN 7; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [2, 3], "ij": [2, 3], "hit": false, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 12/16. pár (a = recs[2], b = recs[3]): WARN 7 / ERROR 90; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [3, 0], "ij": [3, 0], "hit": false, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 13/16. pár (a = recs[3], b = recs[0]): ERROR 90 / INFO 12; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [3, 1], "ij": [3, 1], "hit": false, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 14/16. pár (a = recs[3], b = recs[1]): ERROR 90 / WARN 40; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [3, 2], "ij": [3, 2], "hit": false, "cnt": 1, "line": 5, "out": "", "msg": "cartesian_product: 15/16. pár (a = recs[3], b = recs[2]): ERROR 90 / WARN 7; számláló = 1", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "cartesian", "hl": [3, 3], "ij": [3, 3], "hit": false, "cnt": 1, "line": 5, "out": "worse pairs: 1", "msg": "cartesian_product: 16/16. pár (a = recs[3], b = recs[3]): ERROR 90 / ERROR 90; számláló = 1 → „worse pairs: 1”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}], "zip": [{"view": "zip", "hl": [0], "line": 8, "out": "2x 24", "msg": "zip_transform(plus, ms, ms): 12 + 12 = 24 → „2x 24”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "zip", "hl": [1], "line": 8, "out": "2x 80", "msg": "zip_transform(plus, ms, ms): 40 + 40 = 80 → „2x 80”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "zip", "hl": [2], "line": 8, "out": "2x 14", "msg": "zip_transform(plus, ms, ms): 7 + 7 = 14 → „2x 14”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}, {"view": "zip", "hl": [3], "line": 8, "out": "2x 180", "msg": "zip_transform(plus, ms, ms): 90 + 90 = 180 → „2x 180”", "lv": ["INFO", "WARN", "WARN", "ERROR"], "ms": [12, 40, 7, 90]}]};
const LVC = ["INFO", "WARN", "WARN", "ERROR"];
function compute(lv, ms){
  const n = ms.length, V = {enumerate: [], pairwise: [], cartesian: [], zip: []};
  for (let i = 0; i < n; i++) V.enumerate.push({view: "enumerate", hl: [i], line: 1, out: `${i} ${lv[i]} ${ms[i]}`,
    msg: `enumerate: index ${i} (előjeles ptrdiff_t) + referencia a recs[${i}]-re → „${i} ${lv[i]} ${ms[i]}”`});
  for (let i = 0; i < Math.max(0, n - 1); i++) { const d = ms[i+1] - ms[i];
    V.pairwise.push({view: "pairwise", hl: [i, i+1], line: 3, out: `delta ${d}`,
      msg: `pairwise: ablak [${i}, ${i+1}], b.ms − a.ms = ${ms[i+1]} − ${ms[i]} = ${d} → „delta ${d}”`.replace(/-/g, "−")}); }
  let cnt = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const hit = lv[i] === lv[j] && ms[i] < ms[j]; cnt += hit ? 1 : 0; const last = i === n-1 && j === n-1;
    V.cartesian.push({view: "cartesian", hl: [i, j], ij: [i, j], hit, cnt, line: 5, out: last ? `worse pairs: ${cnt}` : "",
      msg: `cartesian_product: ${i*n + j + 1}/${n*n}. pár (a = recs[${i}], b = recs[${j}]): ${lv[i]} ${ms[i]} / ${lv[j]} ${ms[j]}`
        + (hit ? " – azonos szint és a.ms < b.ms → TALÁLAT" : "") + `; számláló = ${cnt}` + (last ? ` → „worse pairs: ${cnt}”` : "")});
  }
  for (let i = 0; i < n; i++) V.zip.push({view: "zip", hl: [i], line: 8, out: `2x ${2*ms[i]}`,
    msg: `zip_transform(plus, ms, ms): ${ms[i]} + ${ms[i]} = ${2*ms[i]} → „2x ${2*ms[i]}”`});
  for (const key in V) V[key].forEach(s => { s.lv = lv; s.ms = ms; });
  return V;
}
let CURV = PYV, VIEW = "enumerate";
function short(lv, ms, i){ return lv[i][0] + " " + ms[i]; }
function box(x, y, w, h, on, txt, fs, dash){
  el("rect", {x, y, width: w, height: h, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"),
    "stroke-width": on ? 3 : 1.1, "stroke-dasharray": dash || ""});
  if (txt !== undefined) el("text", {x: x + w/2, y: y + h/2 + fs*0.35, "text-anchor": "middle", "font-size": fs}, txt);
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 330");
  const lv = s.lv, ms = s.ms, n = ms.length, cw = Math.min(100, 560 / n), x0 = 70;
  el("text", {x: 4, y: 26, "font-size": 13, "font-weight": "bold"}, "lines");
  el("text", {x: 4, y: 72, "font-size": 13, "font-weight": "bold"}, "recs");
  for (let i = 0; i < n; i++) {
    const x = x0 + i * cw, on = s.hl.includes(i) && s.view !== "cartesian";
    const onc = s.view === "cartesian" && s.hl.includes(i);
    box(x, 12, cw - 8, 22, false, `"${lv[i]} ${ms[i]}"`, 12);
    box(x, 56, cw - 8, 24, on || onc, `{${lv[i]}, ${ms[i]}}`, 12);

    el("text", {x: x + (cw-8)/2, y: 96, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
  }
  const y = 112;
  if (s.view === "enumerate") {
    const i = s.hl[0], x = x0 + i * cw + (cw - 8)/2;
    el("rect", {x: x - 18, y: y + 20, width: 36, height: 24, rx: 4, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
    el("text", {x, y: y + 37, "text-anchor": "middle", "font-size": 14}, String(i));
    el("path", {d: `M${x} ${y + 20}V${y - 30}`, stroke: css("--hl"), "stroke-width": 2.5, fill: "none"});
    el("text", {x: 70, y: y + 76, "font-size": 13}, "tuple<ptrdiff_t, rec&>: az index előjeles, a második tag a recs elemére hivatkozik");
  } else if (s.view === "pairwise") {
    const [a, b] = s.hl, xa = x0 + a * cw + 4, xb = x0 + b * cw + cw - 12;
    el("path", {d: `M${xa} ${y - 26}V${y + 4}H${xb}V${y - 26}`, stroke: css("--hl"), "stroke-width": 3, fill: "none"});
    el("text", {x: (xa + xb)/2, y: y + 24, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, s.out.replace("-", "−"));
    el("text", {x: 70, y: y + 76, "font-size": 13}, `ablakok száma = max(0, n − 1) = ${Math.max(0, n - 1)}; a tagok referenciák`);
  } else if (s.view === "cartesian") {
    const G = Math.min(34, 170 / n), gx = 330, gy = y + 18;

      for (let j = 0; j < n; j++) {
        const q = i*n + j, st = STEPS[q], done = q <= k;

    el("text", {x: 4, y: y + 26, "font-size": 12}, "ms");

    el("text", {x: 4, y: y + 114, "font-size": 12}, "2x");
  }

function pick(v){ VIEW = v; document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); setSteps(CURV[v]); }
function load(){
  const raw = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const e = document.getElementById("err");
  if (raw.length < 1 || raw.length > 6 || raw.some(x => !Number.isInteger(x) || x < 0 || x > 9999)) { e.textContent = "1–6 nemnegatív egész ms-értéket adj meg."; return; }
  e.textContent = ""; CURV = compute(raw.map((_, i) => LVC[i % 4]), raw); pick(VIEW);
}
document.getElementById("selfcheck").textContent =
  JSON.stringify(compute(PYV.enumerate[0].lv, PYV.enumerate[0].ms)) === JSON.stringify(PYV) ? "ok" : "MISMATCH";


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
