<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A rekordparser állapotgépe</title><style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

table{border-collapse:collapse;font:13px ui-monospace,monospace;margin-top:6px}
td,th{border:1px solid var(--muted);padding:2px 5px;text-align:center}
td.on{outline:3px solid var(--hl)} th{font-weight:normal;color:var(--muted)}
input[type=text]{width:16em;font:13px ui-monospace,monospace}
</style></head><body>
<div class="ctl"><label>Bemenet (\n = sortörés): <input type="text" id="inp" value="a=7\ncpu=12"></label>
<label>Darabolás (feed-határok, pl. 2,5): <input type="text" id="cut" value="" style="width:6em"></label>
<button id="go" type="button">Újraszámol</button></div>
<div class="ctl" role="group" aria-label="Lépések"><button id="first" type="button">⏮</button>
<button id="prev" type="button">◀ Lépés</button><button id="next" type="button">Lépés ▶</button>
<input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés"><span id="cnt" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 510" role="img" aria-label="Állapotdiagram két fő állapottal (név, szám) és hibaélekkel egy közös hibaállapotba; a rekordzáró sortörés a név állapotba vezet vissza."></svg>
<div style="overflow-x:auto"><table id="tab"></table></div>
<p class="small">A JS a fejezet src/diag_core.cpp feed/finish logikájának átirata (max_input itt 1 MiB); a darabolás
csak a feed-hívások határát mutatja – az offset a munkamenet elejétől számít, ezért a végeredmény nem függ tőle.</p>
<script>
const BASE={"W": 1000, "H": 510, "nodes": [{"id": "key", "x": 60, "y": 130, "w": 260, "h": 76, "label": "key\n(név olvasása)", "shape": "round", "fs": 18, "bold": true, "hl": false}, {"id": "number", "x": 600, "y": 130, "w": 260, "h": 76, "label": "number\n(szám olvasása)", "shape": "round", "fs": 18, "bold": true, "hl": false}, {"id": "finished", "x": 60, "y": 380, "w": 260, "h": 64, "label": "finished", "shape": "round", "fs": 18, "double": true, "hl": false}, {"id": "failed", "x": 600, "y": 380, "w": 260, "h": 64, "label": "failed (error_)", "shape": "round", "fs": 18, "double": true, "hl": false}], "edges": [{"id": "e_kk", "pts": [[130, 130], [130, 84], [250, 84], [250, 130]], "label": "a–z [klen < 16] / ++klen", "lx": 190, "ly": 66, "fs": 18, "hl": false, "bg": false}, {"id": "e_nn", "pts": [[670, 130], [670, 84], [790, 84], [790, 130]], "label": "0–9 [digits < 5, value ≤ ⌊(65535−d)/10⌋]\n/ value = 10·value + d, ++digits", "lx": 730, "ly": 44, "fs": 18, "hl": false, "bg": false}, {"id": "e_kn", "pts": [[320, 150], [600, 150]], "label": "'=' [klen ≠ 0] /\ndigits = 0, value = 0", "lx": 460, "ly": 122, "fs": 18, "hl": false, "bg": false}, {"id": "e_nk", "pts": [[600, 190], [320, 190]], "label": "'\\n' [digits ≠ 0] /\n++records, sum += value,\nklen = 0", "lx": 460, "ly": 238, "fs": 18, "hl": false, "bg": false}, {"id": "e_kfin", "pts": [[160, 206], [160, 380]], "label": "finish()\n[klen = 0]", "lx": 150, "ly": 300, "ha": "right", "fs": 18, "hl": false, "bg": false}, {"id": "e_kf", "pts": [[280, 206], [280, 312], [650, 312], [650, 380]], "label": "a–z [klen = 16] | egyéb / syntax", "lx": 465, "ly": 336, "fs": 18, "ls": "dash", "hl": false, "bg": false}, {"id": "e_nf", "pts": [[800, 206], [800, 380]], "label": "0–9 [egyébként]\n| egyéb / syntax", "lx": 812, "ly": 290, "ha": "left", "fs": 18, "ls": "dash", "hl": false, "bg": false}, {"id": "e_ff", "pts": [[320, 412], [600, 412]], "label": "feed() / state", "lx": 460, "ly": 396, "fs": 18, "ls": "dash", "hl": false, "bg": false}], "texts": [{"x": 560, "y": 458, "s": "bármely állapotból: bytes = max_input / too_large\nfinish() [number ∨ klen ≠ 0] / truncated", "fs": 18, "ha": "center", "va": "top", "bold": false}]}; const INIT=[{"b": "a", "a": "key", "e": "e_kk", "y": 1, "err": null}, {"b": "=", "a": "number", "e": "e_kn", "y": 2, "err": null}, {"b": "7", "a": "number", "e": "e_nn", "y": 3, "err": null}, {"b": "\\n", "a": "key", "e": "e_nk", "y": 4, "err": null}, {"b": "c", "a": "key", "e": "e_kk", "y": 5, "err": null}, {"b": "p", "a": "key", "e": "e_kk", "y": 6, "err": null}, {"b": "u", "a": "key", "e": "e_kk", "y": 7, "err": null}, {"b": "=", "a": "number", "e": "e_kn", "y": 8, "err": null}, {"b": "1", "a": "number", "e": "e_nn", "y": 9, "err": null}, {"b": "2", "a": "number", "e": "e_nn", "y": 10, "err": null}, {"b": "finish()", "a": "failed", "e": "e_nt", "y": 10, "err": "truncated"}];

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a["font-family"]="ui-monospace,monospace";
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

function run(chunks){const st={phase:"key",klen:0,digits:0,value:0,records:0,sum:0,bytes:0,err:null,eoff:null,fin:false};
 const S=[];const fail=k=>{if(st.err===null){st.err=k;st.eoff=st.bytes;}};
 const snap=()=>({klen:st.klen,digits:st.digits,value:st.value,records:st.records,sum:st.sum,y:st.bytes,err:st.err,eoff:st.eoff});
 outer: for(let ci=0;ci<chunks.length;ci++){ if(st.err!==null)break;
  if(st.fin){fail("state");S.push(Object.assign({b:"feed()",c:ci,p:"finished",a:"failed",e:"e_ff"},snap()));break;}
  for(const b of chunks[ci]){const p=st.phase;let e=null;
   if(st.bytes===1048576){fail("too_large");S.push(Object.assign({b,c:ci,p,a:"failed",e:"e_lim"},snap()));break outer;}
   if(st.phase==="key"){ if(b>="a"&&b<="z"){ if(st.klen===16){fail("syntax");e="e_kf";} else {st.klen++;e="e_kk";} }
     else if(b==="="&&st.klen!==0){st.phase="number";st.digits=0;st.value=0;e="e_kn";} else {fail("syntax");e="e_kf";} }
   else { if(b>="0"&&b<="9"){const d=b.charCodeAt(0)-48; if(st.digits===5||st.value>Math.floor((65535-d)/10)){fail("syntax");e="e_nf";}
       else{st.value=st.value*10+d;st.digits++;e="e_nn";} }
     else if(b==="\n"&&st.digits!==0){st.records++;st.sum+=st.value;st.phase="key";st.klen=0;e="e_nk";} else {fail("syntax");e="e_nf";} }
   if(st.err!==null){S.push(Object.assign({b,c:ci,p,a:"failed",e},snap()));break outer;}
   st.bytes++; S.push(Object.assign({b,c:ci,p,a:st.phase,e},snap())); } }
 if(st.err===null){const p=st.phase; if(p!=="key"||st.klen!==0){fail("truncated");S.push(Object.assign({b:"finish()",c:-1,p,a:"failed",e:p==="key"?"e_kt":"e_nt"},snap()));}
   else{st.fin=true;S.push(Object.assign({b:"finish()",c:-1,p:"key",a:"finished",e:"e_kfin"},snap()));}}
 return S;}
const vis=b=>b==="\n"?"\\n":b;
let STEPS=[],k=0;
function parse(){const raw=document.getElementById("inp").value.replace(/\\n/g,"\n");
 const cuts=document.getElementById("cut").value.split(",").map(x=>parseInt(x,10)).filter(x=>x>0&&x<raw.length).sort((a,b)=>a-b);
 const ch=[];let p=0;for(const c of cuts){ch.push(raw.slice(p,c));p=c;}ch.push(raw.slice(p));return ch;}
function load(){STEPS=run(parse());k=0;const pos=document.getElementById("pos");pos.max=STEPS.length;draw();}
function draw(){const pos=document.getElementById("pos");pos.value=k;
 document.getElementById("cnt").textContent=`${k}/${STEPS.length}`;
 const D=JSON.parse(JSON.stringify(BASE));const s=k>0?STEPS[k-1]:null;
 const hs=s?s.a:"key",he=s?s.e:null;
 D.nodes.forEach(n=>n.hl=(n.id===hs));
 D.edges.forEach(e=>e.hl=(e.id===he)||(he==="e_kt"&&e.id==="e_kf")||(he==="e_nt"&&e.id==="e_nf"));
 if(he==="e_lim"||he==="e_kt"||he==="e_nt")D.texts.forEach(t=>t.bold=true);
 dg_draw(document.getElementById("v"),D);
 let m;
 if(!s)m="Kezdőállapot: key, klen = 0, bytes = 0. Lépés ▶: a következő bájt.";
 else if(s.b==="finish()")m=s.a==="finished"?`finish(): key és klen = 0 → finished. records = ${s.records}, sum = ${s.sum}, bytes = ${s.y}.`:
   `finish(): ${s.p}${s.p==="key"?" (klen = "+s.klen+")":""} → ${s.err}, offset = ${s.eoff}.`;
 else if(s.b==="feed()")m=`feed() a finish() után → state, offset = ${s.eoff}.`;
 else m=`${s.c+1}. feed, bájt '${vis(s.b)}': ${s.p} → ${s.a}`+(s.err?` – ${s.err}, offset = ${s.eoff}`:`; klen = ${s.klen}, digits = ${s.digits}, value = ${s.value}, records = ${s.records}, sum = ${s.sum}, bytes = ${s.y}`);
 document.getElementById("status").textContent=m;
 const t=document.getElementById("tab");
 const R=[["bájt",x=>vis(x.b)],["feed #",x=>x.c<0?"–":x.c+1],["állapot",x=>x.a],["klen",x=>x.klen],["digits",x=>x.digits],["value",x=>x.value],["bytes",x=>x.y]];
 t.innerHTML=R.map(([l,f])=>`<tr><th>${l}</th>`+STEPS.map((x,i)=>`<td class="${i===k-1?"on":""}">${String(f(x)).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`).join("")+"</tr>").join("");}
document.getElementById("go").onclick=load;
document.getElementById("first").onclick=()=>{k=0;draw();};
document.getElementById("prev").onclick=()=>{k=Math.max(0,k-1);draw();};
document.getElementById("next").onclick=()=>{k=Math.min(STEPS.length,k+1);draw();};
document.getElementById("pos").oninput=e=>{k=+e.target.value;draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
load();
try{const h=new URLSearchParams((location.hash||"").slice(1));if(h.get("k")){k=+h.get("k");draw();}}catch(e){}
const chk=STEPS.map(s=>[vis(s.b),s.a,s.e,s.y,s.err].join("|")).join(";");
if(chk!==INIT.map(s=>[s.b,s.a,s.e,s.y,s.err].join("|")).join(";"))document.getElementById("status").textContent="HIBA: a JS és a Python nyom eltér";
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
