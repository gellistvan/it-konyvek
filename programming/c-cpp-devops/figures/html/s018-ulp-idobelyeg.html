<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A double lépésköze nagy időbélyegeknél</title><style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style></head><body>
<div class="ctl"><label for="lt">log₂ t:</label><input id="lt" type="range" min="0" max="34" step="any" value="30.6629"
 aria-label="Időbélyeg kettes alapú logaritmusa" style="flex:1;min-width:200px">
 <button type="button" id="b17">1,7·10⁹ s</button><button type="button" id="b31">2³¹ s</button>
 <button type="button" id="b32">2³² s</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 420" role="img" aria-label="Lépcsős függvény: az időbélyeg növekedésével a reprezentálható double értékek távolsága kétszereződik minden 2-hatvány-határnál; 2^32 másodperc fölött 953,7 nanoszekundum."></svg>
<p class="small">Δ(t) = 2^(⌊log₂ t⌋ − 52) s (binary64, normál tartomány); számítás, nem mérés. A könyv példája: t ≈ 1,7·10⁹ s → 238,4 ns.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v"), st=document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
const X0=90,X1=970,Y0=360,Y1=30, LMIN=Math.log10(1e-7), LMAX=Math.log10(5e4);
function xs(l){return X0+(X1-X0)*l/34;}
function ys(ns){return Y0-(Y0-Y1)*(Math.log10(ns)-LMIN)/(LMAX-LMIN);}
function ulpns(t){return Math.pow(2,Math.floor(Math.log2(t))-52)*1e9;}
function fmt(x,d){return x.toFixed(d).replace(".",",");}
function draw(){
  svg.innerHTML=""; const fg=css("--fg"), mu=css("--muted");
  el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:fg}); el("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:fg});
  for(let e=0;e<=34;e+=2){el("line",{x1:xs(e),y1:Y0,x2:xs(e),y2:Y0+6,stroke:fg});el("text",{x:xs(e),y:Y0+22,"text-anchor":"middle","font-size":14},"2^"+e);}
  [1e-6,1e-4,1e-2,1,100,1e4].forEach(v=>{el("line",{x1:X0-6,y1:ys(v),x2:X0,y2:ys(v),stroke:fg});
    el("text",{x:X0-10,y:ys(v)+5,"text-anchor":"end","font-size":14},v>=1?String(v):v.toExponential(0).replace("e","·10^"));});
  el("text",{x:(X0+X1)/2,y:Y0+44,"text-anchor":"middle","font-size":15},"t (s), kettes alapú log. skála");
  el("text",{x:20,y:Y1-10,"font-size":15},"Δ (ns, log.)");
  el("line",{x1:X0,y1:ys(100),x2:X1,y2:ys(100),stroke:mu,"stroke-dasharray":"6 4"});
  el("text",{x:X0+6,y:ys(100)-6,"font-size":14,fill:mu},"100 ns");
  for(let e=0;e<34;e++){const u=Math.pow(2,e-52)*1e9; el("line",{x1:xs(e),y1:ys(u),x2:xs(e+1),y2:ys(u),stroke:fg,"stroke-width":2.5});}
  const l=+document.getElementById("lt").value, t=Math.pow(2,l), u=ulpns(t);
  el("circle",{cx:xs(l),cy:ys(u),r:7,fill:css("--hl")});
  el("line",{x1:xs(l),y1:Y0,x2:xs(l),y2:ys(u),stroke:css("--hl"),"stroke-dasharray":"3 3"});
  const ok=u<=100;
  st.textContent="t = "+(t>=1e6?t.toExponential(4).replace(".",",").replace("e+","·10^"):fmt(t,3))+" s → ulp(t) = "
    +(u>=1?fmt(u,1)+" ns":u.toExponential(3).replace(".",",").replace("e","·10^")+" ns")
    +(ok?" – egy 100 ns-os különbség mindig megőrződik.":" – egy 100 ns-os különbség NEM garantáltan őrződik meg (ulp > 100 ns).");
}
document.getElementById("lt").addEventListener("input",draw);
[["b17",Math.log2(1.7e9)],["b31",31],["b32",32]].forEach(([id,v])=>document.getElementById(id).onclick=()=>{document.getElementById("lt").value=v;draw();});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
