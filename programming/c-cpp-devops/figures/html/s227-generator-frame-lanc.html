<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekurzív generator frame-lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A fa bejárásának lépései; a felfüggesztett coroutine frame-ek a heapen láncot alkotnak, a natív verem sekély."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az értékek a fejezet walk() példájának g++ 15.2-es futtatásából (élő-frame-számlálóval), nem mérés. A natív verem kerete -O0 mellett a lánc hosszától függetlenül 319–655 bájtra volt a main lokálisától.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "name": "root", "chain": ["root"], "native": ["main()", "begin()"], "line": 1, "msg": "1. elem: root – a heap-lánc 1 frame (walk(root)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → begin()."}, {"k": 1, "name": "etc", "chain": ["root", "etc"], "native": ["main()", "operator++"], "line": 1, "msg": "2. elem: etc – a heap-lánc 2 frame (walk(root) → walk(etc)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → operator++."}, {"k": 2, "name": "nginx.conf", "chain": ["root", "etc", "nginx.conf"], "native": ["main()", "operator++"], "line": 1, "msg": "3. elem: nginx.conf – a heap-lánc 3 frame (walk(root) → walk(etc) → walk(nginx.conf)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → operator++."}, {"k": 3, "name": "var", "chain": ["root", "var"], "native": ["main()", "operator++"], "line": 1, "msg": "4. elem: var – a heap-lánc 2 frame (walk(root) → walk(var)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → operator++."}, {"k": 4, "name": "log", "chain": ["root", "var", "log"], "native": ["main()", "operator++"], "line": 1, "msg": "5. elem: log – a heap-lánc 3 frame (walk(root) → walk(var) → walk(log)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → operator++."}, {"k": 5, "name": "app.log", "chain": ["root", "var", "log", "app.log"], "native": ["main()", "operator++"], "line": 1, "msg": "6. elem: app.log – a heap-lánc 4 frame (walk(root) → walk(var) → walk(log) → walk(app.log)); a legbelső co_yield n-nél áll, a többi elements_of-nál vár. Natív verem: main() → operator++."}, {"k": 6, "name": null, "chain": [], "native": ["main()"], "line": 6, "msg": "Vége: walk(root) kimerült, minden frame felszabadult (élő frame: 0); a ciklus kilép."}];
const CODE = ["std::generator<const Node&> walk(const Node& n) {", "    co_yield n;", "    for (const auto& child : n.children) {", "        co_yield std::ranges::elements_of(walk(child));", "    }", "}", "for (const std::string& name : names)   // main: a fogyasztó léptet", "    std::cout << name << '\\n';"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const TREE = [["root", 0], ["etc", 1], ["nginx.conf", 2], ["var", 1], ["log", 2], ["app.log", 3]];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 340");
  el("text", {x: 20, y: 24, "font-size": 13, fill: css("--muted")}, "fa (preorder)");
  TREE.forEach((t, i) => {
    const y = 52 + i * 38, x = 24 + t[1] * 26, on = t[0] === s.name, alive = s.chain.includes(t[0]) && !on;
    const w = t[0].length * 8.5 + 14;
    if (t[1]) el("path", {d: `M${x - 18} ${y - 26}V${y}H${x}`, fill: "none", stroke: css("--muted")});
    if (on || alive) el("rect", {x: x, y: y - 13, width: w, height: 26, fill: on ? css("--cellhl") : "none", stroke: css("--line"),
       "stroke-width": on ? 3 : 1.2, "stroke-dasharray": on ? "" : "5 3"});
    el("text", {x: x + 7, y: y + 5, "font-size": 15, "font-weight": on ? "bold" : "normal"}, t[0]);
  });
  const hx = 230, hw = 210;
  el("text", {x: hx + hw/2, y: 24, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "heap: coroutine-frame-lánc");
  s.chain.forEach((c, i) => {
    const y = 40 + i * 62, last = i === s.chain.length - 1;
    el("rect", {x: hx, y, width: hw, height: 48, fill: last ? css("--cellhl") : css("--cell"), stroke: css("--line"),
      "stroke-width": last ? 3 : 1.2, "stroke-dasharray": last ? "" : "6 4"});
    el("text", {x: hx + hw/2, y: y + 20, "text-anchor": "middle", "font-size": 15, "font-weight": last ? "bold" : "normal"}, `walk(${c})`);
    el("text", {x: hx + hw/2, y: y + 39, "text-anchor": "middle", "font-size": 13}, last ? "aktív: co_yield n" : "felfüggesztve: elements_of");
    if (!last) el("path", {d: `M${hx + hw/2} ${y + 48}V${y + 60}`, stroke: css("--line"), "stroke-width": 1.5});
  });
  if (!s.chain.length) el("text", {x: hx + hw/2, y: 80, "text-anchor": "middle", "font-size": 14}, "(üres – minden frame felszabadult)");
  const nx = 490, nw = 130;
  el("text", {x: nx + nw/2, y: 24, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "natív verem");
  s.native.forEach((c, i) => {
    el("rect", {x: nx, y: 40 + i * 44, width: nw, height: 34, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2});
    el("text", {x: nx + nw/2, y: 62 + i * 44, "text-anchor": "middle", "font-size": 14}, c);
  });
  if (s.chain.length) {
    const ty = 40 + (s.chain.length - 1) * 62 + 24;
    el("path", {d: `M${nx} ${40 + 44 + 17}L${hx + hw + 6} ${ty}`, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "2 4", fill: "none"});
    el("text", {x: nx + nw/2, y: 150, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "resume ↙ a legbelső");
    el("text", {x: nx + nw/2, y: 166, "text-anchor": "middle", "font-size": 12, fill: css("--hl")}, "frame-re (pontozott)");
  }
  el("text", {x: 20, y: 332, "font-size": 12, fill: css("--muted")}, `élő walk-frame: ${s.chain.length} · natív keret: ${s.native.length} (a fa mélységétől független)`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
