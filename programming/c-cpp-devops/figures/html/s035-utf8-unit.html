<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az utf8_unit szabályai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bájtok (hex): <input id="hex" value="41 C3 A1 00 42" size="22" aria-label="Bemeneti bájtok hexadecimálisan"></label><button onclick="loadHex()">Bejárás</button><span class="small">Próbák:</span><button onclick="loadHex('41 C3 A1 00 42')">41 C3 A1 00 42</button><button onclick="loadHex('C3')">C3</button><button onclick="loadHex('C0 80')">C0 80</button><button onclick="loadHex('ED A0 80')">ED A0 80</button><button onclick="loadHex('F4 90 80 80')">F4 90 80 80</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az UTF-8 kezdőbájt-osztályai és a második oktett tiltott tartományai, mellette a 41 C3 A1 00 42 puffer négy egységre bontása."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet utf8_unit függvénye: 1 = érvényes egység, 0 = hiányos, −1 = hibás. A próbák a lépéssor végére ugranak (hiba esetén a megállás helyére). Kezdőállapot: a könyv puffere.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"buf": [65, 195, 161, 0, 66], "off": 0, "used": 0, "status": null, "count": 0, "line": -1, "units": [], "msg": "offset=0, count=0: a 5 oktettes puffer bejárása indul"}, {"buf": [65, 195, 161, 0, 66], "off": 0, "used": 1, "status": 1, "count": 1, "line": 4, "units": [[0, 1]], "msg": "offset=0, used=1, status=1 (00–7F: egybájtos (ASCII)); count=1"}, {"buf": [65, 195, 161, 0, 66], "off": 1, "used": 2, "status": 1, "count": 2, "line": 16, "units": [[0, 1], [1, 2]], "msg": "offset=1, used=2, status=1 (2 bájtos egység); count=2"}, {"buf": [65, 195, 161, 0, 66], "off": 3, "used": 1, "status": 1, "count": 3, "line": 4, "units": [[0, 1], [1, 2], [3, 1]], "msg": "offset=3, used=1, status=1 (00–7F: egybájtos (ASCII)); count=3"}, {"buf": [65, 195, 161, 0, 66], "off": 4, "used": 1, "status": 1, "count": 4, "line": 4, "units": [[0, 1], [1, 2], [3, 1], [4, 1]], "msg": "offset=4, used=1, status=1 (00–7F: egybájtos (ASCII)); count=4"}, {"buf": [65, 195, 161, 0, 66], "off": 5, "used": 0, "status": 1, "count": 4, "line": -1, "units": [[0, 1], [1, 2], [3, 1], [4, 1]], "msg": "octets=5, scalar_values=4"}];
const CODE = ["static int utf8_unit(const unsigned char *p, size_t n, size_t *used)", "{", "    if (n == 0) return 0;", "    unsigned char b = p[0];  size_t k;", "    if (b <= 0x7F) { *used = 1; return 1; }", "    if (b >= 0xC2 && b <= 0xDF) k = 2;", "    else if (b >= 0xE0 && b <= 0xEF) k = 3;", "    else if (b >= 0xF0 && b <= 0xF4) k = 4;", "    else return -1;", "    for (size_t i = 1; i < k; ++i) {", "        if (i == n) return 0;", "        unsigned char c = p[i];", "        if (c < 0x80 || c > 0xBF) return -1;", "        if (i == 1 && ((b == 0xE0 && c < 0xA0) || (b == 0xED && c > 0x9F) ||", "                       (b == 0xF0 && c < 0x90) || (b == 0xF4 && c > 0x8F))) return -1;", "    }", "    *used = k; return 1;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 1000 250"); svg.innerHTML="";
  const buf=s.buf, CW=Math.min(84, 900/Math.max(buf.length,1)), X0=60, line=css("--line");
  el("text",{x:10,y:58,"font-size":14,fill:css("--muted")},"offset");
  buf.forEach((b,i)=>{
    const unit=s.units.find(u=>i>=u[0]&&i<u[0]+u[1]);
    const cur=(s.status!==null)&&i>=s.off&&i<s.off+Math.max(s.used,1);
    el("rect",{x:X0+i*CW,y:70,width:CW,height:54,fill:unit?css("--cell"):css("--cellhl"),stroke:cur?css("--hl"):line,
      "stroke-width":cur?4:1.2,"stroke-dasharray":(s.status!==null&&s.status!==1&&i===s.off)?"6 3":""});
    el("text",{x:X0+i*CW+CW/2,y:104,"text-anchor":"middle","font-size":20,"font-family":"ui-monospace,monospace"},
       b.toString(16).toUpperCase().padStart(2,"0"));
    el("text",{x:X0+i*CW+CW/2,y:60,"text-anchor":"middle","font-size":13,fill:css("--muted")},String(i));
  });
  s.units.forEach((u,j)=>{ const x=X0+u[0]*CW, w=u[1]*CW;
    el("path",{d:`M${x+3} 134V144H${x+w-3}V134`,fill:"none",stroke:line,"stroke-width":2});
    el("text",{x:x+w/2,y:164,"text-anchor":"middle","font-size":14},"egység "+(j+1)); });
  const st=s.status===null?"–":String(s.status).replace("-","−");
  el("text",{x:10,y:205,"font-size":18},"offset = "+s.off+"   used = "+s.used+"   status = "+st+"   count = "+s.count);
  el("text",{x:10,y:235,"font-size":14,fill:css("--muted")},"szürke: még nem feldolgozott vagy hibás rész; vastag keret: az aktuális egység; szaggatott: itt áll meg");
}
const PY_RULES = [["E0", 128, 159, "overlong"], ["ED", 160, 191, "surrogate"], ["F0", 128, 143, "overlong"], ["F4", 144, 191, "> U+10FFFF"]];

function unitJS(p){
  const n=p.length; if(n===0) return [0,0,2,"üres bemenet"];
  const b=p[0], h=x=>x.toString(16).toUpperCase().padStart(2,"0"); let kk;
  if(b<=0x7F) return [1,1,4,"00–7F: egybájtos (ASCII)"];
  if(b>=0xC2&&b<=0xDF) kk=2; else if(b>=0xE0&&b<=0xEF) kk=3; else if(b>=0xF0&&b<=0xF4) kk=4;
  else return [-1,0,8,h(b)+": "+(b<=0xBF?"80–BF: folytatóbájt nem lehet kezdőbájt":(b<=0xC1?"C0/C1: mindig overlong":"F5–FF: U+10FFFF fölötti / nem használt"))];
  for(let i=1;i<kk;i++){
    if(i===n) return [0,0,10,"hiányos: "+kk+" bájt kellene, csak "+n+" van"];
    const c=p[i];
    if(c<0x80||c>0xBF) return [-1,0,12,h(c)+" nem folytatóbájt (80–BF)"];
    if(i===1){
      if(b===0xE0&&c<0xA0) return [-1,0,13,"E0 után "+h(c)+": overlong (80–9F tiltva)"];
      if(b===0xED&&c>0x9F) return [-1,0,13,"ED után "+h(c)+": surrogate (A0–BF tiltva)"];
      if(b===0xF0&&c<0x90) return [-1,0,14,"F0 után "+h(c)+": overlong (80–8F tiltva)"];
      if(b===0xF4&&c>0x8F) return [-1,0,14,"F4 után "+h(c)+": U+10FFFF fölött (90–BF tiltva)"];
    }
  }
  return [1,kk,16,kk+" bájtos egység"];
}
function walkJS(buf){
  const st=[{buf,off:0,used:0,status:null,count:0,line:-1,units:[],msg:"offset=0, count=0: a "+buf.length+" oktettes puffer bejárása indul"}];
  let off=0,count=0; const units=[];
  while(off<buf.length){
    const [s,used,ln,why]=unitJS(buf.slice(off));
    if(s!==1){ st.push({buf,off,used:0,status:s,count,line:ln,units:units.slice(),msg:"offset="+off+", status="+s+": "+why+" → „UTF-8 error at "+off+": "+s+"”"}); return st; }
    units.push([off,used]); count++;
    st.push({buf,off,used,status:s,count,line:ln,units:units.slice(),msg:"offset="+off+", used="+used+", status="+s+" ("+why+"); count="+count});
    off+=used;
  }
  st.push({buf,off,used:0,status:1,count,line:-1,units:units.slice(),msg:"octets="+buf.length+", scalar_values="+count});
  return st;
}
function loadHex(v){
  if(v!==undefined) document.getElementById("hex").value=v;
  const parts=document.getElementById("hex").value.trim().split(/[\s,]+/).filter(x=>x!=="");
  const m=document.getElementById("err");
  if(!parts.length||parts.length>12||parts.some(x=>!/^[0-9a-fA-F]{1,2}$/.test(x))){m.textContent="1–12 hexadecimális bájt (pl. 41 C3 A1).";return;}
  m.textContent=""; const steps=walkJS(parts.map(x=>parseInt(x,16))); setSteps(steps); show(steps.length-1);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
