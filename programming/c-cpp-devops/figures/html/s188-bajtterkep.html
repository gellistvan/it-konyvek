<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Struktúra bájttérképe tagsorrend szerint</title><style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

.mem{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--muted);padding:2px 4px;margin:2px;border-radius:4px;cursor:grab}
.mem.drag{opacity:.4} .mem button{padding:0 5px}
</style></head><body>
<div class="ctl" role="group" aria-label="Tagsorrend (húzással vagy a ◀ ▶ gombokkal)"><span>Tagsorrend:</span><span id="mems"></span></div>
<div class="ctl"><label><input type="checkbox" id="rec"> Rec (37.3.10 1. feladat: bool, double, int, char)</label>
<button id="best" type="button">Méret szerint csökkenő sorrend</button></div>
<div class="ctl" role="group" aria-label="Lépések"><button id="prev" type="button">◀ Lépés</button><button id="next" type="button">Lépés ▶</button>
<button id="all" type="button">Mind</button><span id="cnt" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 820 190" role="img" aria-label="Bájttérkép: a tagok offsetjei, a kitöltés és a farokpadding a választott sorrendben"></svg>
<p class="small">x86-64 System V LP64 (GCC 15.2 futással ellenőrizve: Order1 = 16, Order2 = 24, Rec = 24, átrendezve 16 bájt). Képlet: o = round_up(előző vég, alignof(tag)); sizeof = round_up(utolsó vég, max alignof). A szabvány a konkrét offseteket nem garantálja – ABI-megfigyelés.</p>
<script>
const T={c:["char",1,1],i:["int",4,4],d:["double",8,8],active:["bool",1,1],value:["double",8,8],count:["int",4,4],tag:["char",1,1]};
const INIT=["c: o=round_up(0,1)=0", "i: o=round_up(1,4)=4", "d: o=round_up(8,8)=8", "sizeof = round_up(16,8)=16"];
const SH={1:"--fill3",4:"--fill2",8:"--fill1"};
let order=["c","i","d"], k=0;
const ru=(x,a)=>Math.ceil(x/a)*a;
function lay(){let end=0;const L=[];for(const m of order){const [t,s,a]=T[m];const o=ru(end,a);L.push({m,t,s,a,prev:end,o});end=o+s;}
  const al=Math.max(...order.map(m=>T[m][2]));return {L,end,al,size:ru(end,al)};}
function msgs(R){const r=R.L.map(x=>`${x.m}: o=round_up(${x.prev},${x.a})=${x.o}`);r.push(`sizeof = round_up(${R.end},${R.al})=${R.size}`);return r;}
const svg=document.getElementById("v"),NS="http://www.w3.org/2000/svg";
function mk(tag,a,t){const e=document.createElementNS(NS,tag);for(const x in a)e.setAttribute(x,a[x]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function draw(){
  const R=lay(), M=msgs(R), n=R.L.length; k=Math.max(0,Math.min(k,n+1));
  svg.innerHTML=""; const defs=mk("defs",{});
  defs.innerHTML=`<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern>`;
  const W=30,x0=30,y0=60, shown=Math.min(k,n), total=(k>n)?R.size:(shown?R.L[shown-1].o+R.L[shown-1].s:0);
  for(let b=0;b<24;b++){mk("rect",{x:x0+b*W,y:y0,width:W,height:46,fill:b<R.size&&k>n?"url(#hp)":"none",stroke:css("--muted"),"stroke-width":0.6,"stroke-dasharray":b<total?"":"3 3"});
    mk("text",{x:x0+b*W+W/2,y:y0-8,"text-anchor":"middle","font-size":11,fill:css("--muted")},String(b));}
  if(k>0&&k<=n){for(let b=0;b<total;b++)mk("rect",{x:x0+b*W,y:y0,width:W,height:46,fill:"url(#hp)",opacity:0.8});}
  R.L.slice(0,shown).forEach((x,j)=>{const cur=(j===shown-1&&k<=n);
    mk("rect",{x:x0+x.o*W,y:y0,width:x.s*W,height:46,fill:css(SH[x.s]),stroke:cur?css("--hl"):css("--fg"),"stroke-width":cur?4:1.5});
    mk("text",{x:x0+(x.o+x.s/2)*W,y:y0+28,"text-anchor":"middle","font-size":x.s>1?14:Math.min(12,48/x.m.length),"font-weight":"bold",fill:x.s===8?css("--bg"):css("--fg")},x.s>1?`${x.m} (${x.t})`:x.m);
    if(cur)mk("text",{x:x0+Math.max(0,x.o*W),y:y0+70,"font-size":13,"font-family":"ui-monospace,monospace"},`o = round_up(${x.prev}, ${x.a}) = ${x.o}`);});
  for(let b=0;b<=24;b+=8)mk("line",{x1:x0+b*W,y1:y0-4,x2:x0+b*W,y2:y0+50,stroke:css("--fg"),"stroke-width":3});
  if(k>n){const pad=R.size-R.L.reduce((s,x)=>s+x.s,0);
    mk("text",{x:x0,y:y0+75,"font-size":13,"font-family":"ui-monospace,monospace"},`sizeof = round_up(${R.end}, ${R.al}) = ${R.size};  padding = ${pad} bájt (sraffozott)`);}
  const st=document.getElementById("status");
  st.textContent= k===0 ? `Sorrend: { ${order.map(m=>T[m][0]+" "+m).join("; ")}; } – Lépés ▶: a tagok elhelyezése egyenként.` : M.slice(0,k).join("; ");
  document.getElementById("cnt").textContent=`${k}/${n+1}`;
}
function chips(){const box=document.getElementById("mems");box.innerHTML="";
  order.forEach((m,j)=>{const s=document.createElement("span");s.className="mem";s.draggable=true;s.dataset.j=j;
    s.innerHTML=`<button type="button" aria-label="${m} balra">◀</button><code>${T[m][0]} ${m}</code><button type="button" aria-label="${m} jobbra">▶</button>`;
    const [bl,br]=s.querySelectorAll("button");
    bl.onclick=()=>mv(j,j-1); br.onclick=()=>mv(j,j+1);
    s.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",j);s.classList.add("drag");});
    s.addEventListener("dragend",()=>s.classList.remove("drag"));
    s.addEventListener("dragover",e=>e.preventDefault());
    s.addEventListener("drop",e=>{e.preventDefault();mv(+e.dataTransfer.getData("text/plain"),j);});
    box.appendChild(s);});}
function mv(a,b){if(b<0||b>=order.length||a===b)return;const [x]=order.splice(a,1);order.splice(b,0,x);k=0;chips();draw();}
document.getElementById("prev").onclick=()=>{k--;draw();};
document.getElementById("next").onclick=()=>{k++;draw();};
document.getElementById("all").onclick=()=>{k=order.length+1;draw();};
document.getElementById("rec").onchange=e=>{order=e.target.checked?["active","value","count","tag"]:["c","i","d"];k=0;chips();draw();};
document.getElementById("best").onclick=()=>{order.sort((p,q)=>T[q][2]-T[p][2]);k=0;chips();draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
try{const h=new URLSearchParams((location.hash||"").slice(1));if(h.get("rec")==="1"){document.getElementById("rec").checked=true;order=["active","value","count","tag"];}if(h.get("k"))k=+h.get("k");}catch(e){}
chips();draw();
if(k===0&&msgs(lay()).join("|")!==INIT.join("|"))document.getElementById("status").textContent="HIBA: a JS és a Python számítás eltér";
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
