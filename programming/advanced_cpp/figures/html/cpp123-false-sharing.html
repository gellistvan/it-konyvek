<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cache-vonal forgalom: atomic, false sharing, részösszeg</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>minta: <select id="pat" onchange="applyInput()"><option value="1">1. közös atomic</option><option value="2">2. false sharing (ellenpélda)</option><option value="3">3. helyi összeg + AlignedSum</option></select></label><label>szálak: <input id="thr" type="range" min="1" max="8" value="4" oninput="applyInput()"> <span id="thrv">4</span></label><label>elemek: <input id="nel" type="range" min="8" max="64" value="16" oninput="applyInput()"> <span id="nelv">16</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Magok és L1-gyorsítótáraik felül, alul 64 bájtos cache-vonalak; a lépés kiemeli az író magot, a célrekeszt és a vonal átadását a magok között."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető koherencia-modell, nem mérés: egy vonalat egyszerre egy mag írhat (Modified); más mag írásakor a vonal átkerül. A végrehajtási sorrend modellezett round-robin átfedés. 64 bájtos vonal (x86-64; platformfüggő). A 2. minta a könyv kódjában nem szerepel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"pat": 1, "T": 4, "core": 0, "ln": 0, "slot": 0, "frm": -1, "tr": 0, "etr": 0, "line": 1, "owner": {"0": 0}, "msg": "C0 fetch_add: a vonal betöltése a memóriából, átadások: 0"}, {"pat": 1, "T": 4, "core": 1, "ln": 0, "slot": 0, "frm": 0, "tr": 1, "etr": 0, "line": 1, "owner": {"0": 1}, "msg": "C1 fetch_add: a vonal C0→C1, átadások: 1"}, {"pat": 1, "T": 4, "core": 2, "ln": 0, "slot": 0, "frm": 1, "tr": 2, "etr": 0, "line": 1, "owner": {"0": 2}, "msg": "C2 fetch_add: a vonal C1→C2, átadások: 2"}, {"pat": 1, "T": 4, "core": 3, "ln": 0, "slot": 0, "frm": 2, "tr": 3, "etr": 0, "line": 1, "owner": {"0": 3}, "msg": "C3 fetch_add: a vonal C2→C3, átadások: 3"}, {"pat": 1, "T": 4, "core": 0, "ln": 0, "slot": 0, "frm": 3, "tr": 4, "etr": 0, "line": 1, "owner": {"0": 0}, "msg": "C0 fetch_add: a vonal C3→C0, átadások: 4"}, {"pat": 1, "T": 4, "core": 1, "ln": 0, "slot": 0, "frm": 0, "tr": 5, "etr": 0, "line": 1, "owner": {"0": 1}, "msg": "C1 fetch_add: a vonal C0→C1, átadások: 5"}, {"pat": 1, "T": 4, "core": 2, "ln": 0, "slot": 0, "frm": 1, "tr": 6, "etr": 0, "line": 1, "owner": {"0": 2}, "msg": "C2 fetch_add: a vonal C1→C2, átadások: 6"}, {"pat": 1, "T": 4, "core": 3, "ln": 0, "slot": 0, "frm": 2, "tr": 7, "etr": 0, "line": 1, "owner": {"0": 3}, "msg": "C3 fetch_add: a vonal C2→C3, átadások: 7"}, {"pat": 1, "T": 4, "core": 0, "ln": 0, "slot": 0, "frm": 3, "tr": 8, "etr": 0, "line": 1, "owner": {"0": 0}, "msg": "C0 fetch_add: a vonal C3→C0, átadások: 8"}, {"pat": 1, "T": 4, "core": 1, "ln": 0, "slot": 0, "frm": 0, "tr": 9, "etr": 0, "line": 1, "owner": {"0": 1}, "msg": "C1 fetch_add: a vonal C0→C1, átadások: 9"}, {"pat": 1, "T": 4, "core": 2, "ln": 0, "slot": 0, "frm": 1, "tr": 10, "etr": 0, "line": 1, "owner": {"0": 2}, "msg": "C2 fetch_add: a vonal C1→C2, átadások: 10"}, {"pat": 1, "T": 4, "core": 3, "ln": 0, "slot": 0, "frm": 2, "tr": 11, "etr": 0, "line": 1, "owner": {"0": 3}, "msg": "C3 fetch_add: a vonal C2→C3, átadások: 11"}, {"pat": 1, "T": 4, "core": 0, "ln": 0, "slot": 0, "frm": 3, "tr": 12, "etr": 0, "line": 1, "owner": {"0": 0}, "msg": "C0 fetch_add: a vonal C3→C0, átadások: 12"}, {"pat": 1, "T": 4, "core": 1, "ln": 0, "slot": 0, "frm": 0, "tr": 13, "etr": 0, "line": 1, "owner": {"0": 1}, "msg": "C1 fetch_add: a vonal C0→C1, átadások: 13"}, {"pat": 1, "T": 4, "core": 2, "ln": 0, "slot": 0, "frm": 1, "tr": 14, "etr": 0, "line": 1, "owner": {"0": 2}, "msg": "C2 fetch_add: a vonal C1→C2, átadások: 14"}, {"pat": 1, "T": 4, "core": 3, "ln": 0, "slot": 0, "frm": 2, "tr": 15, "etr": 0, "line": 1, "owner": {"0": 3}, "msg": "C3 fetch_add: a vonal C2→C3, átadások: 15"}, {"pat": 1, "T": 4, "core": 0, "ln": 0, "slot": 0, "frm": 3, "tr": 15, "etr": 1, "line": 7, "owner": {"0": 0}, "msg": "vége (C0 olvas): ciklus közbeni átadások: 15 (16 írásból), a végén: 1"}];
const CODE = ["// 1. közös atomic (parallel_sum_naive)", "sum.fetch_add(rec.value * scale, std::memory_order_relaxed);", "// 2. ellenpélda (NEM a könyv kódja): double partial[T], igazítás nélkül", "partial[i] += rec.value * scale;", "// 3. könyv: parallel_sum – helyi összeg, majd AlignedSum (64 bájtos vonal)", "local += rec.value * scale;", "partial_sums[i].value = local;   // szálanként egyszer, a ciklus után", "sum.load()  /  for (auto& p : partial_sums) total += p.value;   // a végén"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML="";
  const Tn=s.T, W=Math.max(560, Tn*95+40), cw=(W-40)/Tn;
  svg.setAttribute("viewBox", `0 0 ${W} 300`);
  const d=el("defs",{}); d.innerHTML=`<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css('--fg')}"/></marker><pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--muted')}" stroke-width="1"/></pattern>`;
  for(let c=0;c<Tn;c++){const x=20+c*cw;
    const on=(c===s.core);
    el("rect",{x:x+4,y:10,width:cw-8,height:40,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":on?3:1.2});
    el("text",{x:x+cw/2,y:28,"text-anchor":"middle","font-size":14,"font-weight":"bold"},"C"+c);
    if(s.pat===3) el("text",{x:x+cw/2,y:44,"text-anchor":"middle","font-size":11},"local");
    const held=Object.keys(s.owner).filter(l=>s.owner[l]===c);
    el("rect",{x:x+4,y:62,width:cw-8,height:34,fill:css("--cell"),stroke:css("--line"),"stroke-dasharray":"4 2"});
    el("text",{x:x+cw/2,y:84,"text-anchor":"middle","font-size":12},"L1"+(held.length?": M "+held.map(l=>"#"+l).join(","):""));
  }
  // memória: vonalak
  const nl = s.pat===3 ? Tn : 1, lw=Math.min(480,(W-40)/nl-10), sw=lw/8, y0=190;
  el("text",{x:20,y:y0-12,"font-size":12,fill:css("--muted")},"memória / közös cache (64 bájtos vonalak, 8 bájtos rekeszek)");
  const lx=l=> s.pat===3 ? 20+l*((W-40)/nl) : (W-lw)/2;
  for(let l=0;l<nl;l++){
    for(let k=0;k<8;k++){
      let lab="", pad=false;
      if(s.pat===1) lab = k===0?"sum":"";
      else if(s.pat===2) lab = k<Tn?"p["+k+"]":"";
      else { lab = k===0?"ps["+l+"]":""; pad = k>0; }
      const on = (l===s.ln && k===s.slot);
      el("rect",{x:lx(l)+k*sw,y:y0,width:sw,height:36,fill:pad?"url(#hz)":(on?css("--cellhl"):css("--cell")),stroke:css("--line"),"stroke-width":on?3:1});
      if(lab) el("text",{x:lx(l)+k*sw+sw/2,y:y0+23,"text-anchor":"middle","font-size":Math.min(12,sw*0.42)},lab);
    }
    el("text",{x:lx(l)+lw/2,y:y0+52,"text-anchor":"middle","font-size":11,fill:css("--muted")},"vonal #"+l+(s.owner[l]!==undefined?" (M: C"+s.owner[l]+")":""));
  }
  if(s.ln>=0){
    const cx=20+s.core*cw+cw/2, tx=lx(s.ln)+s.slot*sw+sw/2;
    el("path",{d:`M${cx} 96 L ${tx} ${y0-2}`,stroke:css("--fg"),"stroke-width":2.5,"marker-end":"url(#ar)",fill:"none"});
    if(s.frm>=0 && s.frm!==s.core){const fx=20+s.frm*cw+cw/2;
      el("path",{d:`M${fx} 100 Q ${(fx+cx)/2} 150 ${cx} 100`,stroke:css("--hl2"),"stroke-width":2.5,"stroke-dasharray":"7 4","marker-end":"url(#ar)",fill:"none"});
      el("text",{x:(fx+cx)/2,y:142,"text-anchor":"middle","font-size":12,"font-weight":"bold"},"vonalátadás");}
  }
  el("text",{x:20,y:285,"font-size":14,"font-weight":"bold"},`vonalátadások a ciklusban: ${s.tr}   ·   a végén: ${s.etr}`);
}
function sim(pat,T,n){
  const chunk=Math.ceil(n/T); const owner={}; let tr=0, etr=0; const st=[]; const order=[];
  for(let r=0;r<chunk;r++)for(let c=0;c<T;c++){const j=c*chunk+r; if(j<Math.min((c+1)*chunk,n))order.push([c,j]);}
  for(const [c,j] of order){
    if(pat===3){st.push({pat,T,core:c,ln:-1,slot:-1,frm:-2,tr,etr,line:5,owner:Object.assign({},owner),msg:`C${c}: local += elem[${j}] (regiszter/stack) – nincs vonalelérés, átadások: ${tr}`});continue;}
    const ln=0, slot=pat===1?0:c; const prev=owner[ln]===undefined?-1:owner[ln]; const what=pat===1?"fetch_add":`partial[${c}] +=`; let m;
    if(prev===c) m=`C${c} ${what}: a vonal már C${c}-nél (Modified), átadások: ${tr}`;
    else if(prev===-1) m=`C${c} ${what}: a vonal betöltése a memóriából, átadások: ${tr}`;
    else {tr++; m=`C${c} ${what}: a vonal C${prev}→C${c}, átadások: ${tr}`;}
    owner[ln]=c; st.push({pat,T,core:c,ln,slot,frm:prev,tr,etr,line:pat===1?1:3,owner:Object.assign({},owner),msg:m});
  }
  if(pat===3){
    for(let c=0;c<T;c++){owner[c]=c; st.push({pat,T,core:c,ln:c,slot:0,frm:-1,tr,etr,line:6,owner:Object.assign({},owner),msg:`C${c}: partial_sums[${c}].value = local – egyszeri írás a saját 64 bájtos vonalba (memóriából), átadások: ${tr}`});}
    for(let c=0;c<T;c++){const prev=owner[c]; if(prev!==0)etr++; owner[c]=0; st.push({pat,T,core:0,ln:c,slot:0,frm:prev!==0?prev:-2,tr,etr,line:7,owner:Object.assign({},owner),msg:`végső összegzés (C0 olvassa partial_sums[${c}]): ciklus közbeni átadások: ${tr}, a végén: ${etr}`});}
  } else {
    const prev=owner[0]===undefined?-1:owner[0]; if(prev!==0)etr++; owner[0]=0;
    st.push({pat,T,core:0,ln:0,slot:0,frm:prev!==0?prev:-2,tr,etr,line:7,owner:Object.assign({},owner),msg:`vége (C0 olvas): ciklus közbeni átadások: ${tr} (${n} írásból), a végén: ${etr}`});
  }
  return st;
}
function applyInput(){
  const pat=+document.getElementById("pat").value, T=+document.getElementById("thr").value, n=+document.getElementById("nel").value;
  document.getElementById("thrv").textContent=T; document.getElementById("nelv").textContent=n;
  setSteps(sim(pat,T,n));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
