<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ötpontos stencil és dupla buffer</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>nx <input id="nx" type="number" min="3" max="12" value="8" style="width:4em"></label><label>ny <input id="ny" type="number" min="3" max="12" value="6" style="width:4em"></label><button type="button" onclick="applyInput()">Alkalmaz</button><label><input id="inpl" type="checkbox" onchange="applyInput()"> egy buffer (in-place)</label><button type="button" onclick="SWAPPED=!SWAPPED;status.textContent='std::swap(in, out): most '+(SWAPPED?'B':'A')+' az in, '+(SWAPPED?'A':'B')+' az out';render(STEPS[k])">swap</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két rács: a bemeneti rács öt cellájából nyilak mutatnak a kimeneti rács frissített cellájába; a belső sorok szálakhoz rendelve; a lépés végén a két buffer cseréje."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A heat_step_par átirata (nx=8, ny=6 alapból; a lejátszás az i=19 cellától indul, majd körbeér). A szálkiosztás illusztratív (T(y−1) mod 3); a std::execution::par tényleges felosztását a háttér dönti el. A peremcellák rögzített 0 értékűek, nem íródnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"x": 3, "y": 2, "i": 19, "t": 1, "line": 5, "msg": "y=2, x=3, i=19 (T1): out[19] = in[19] + 0.25·(in[18]+in[20]+in[11]+in[27]−4·in[19])"}, {"x": 4, "y": 2, "i": 20, "t": 1, "line": 5, "msg": "y=2, x=4, i=20 (T1): out[20] = in[20] + 0.25·(in[19]+in[21]+in[12]+in[28]−4·in[20])"}, {"x": 5, "y": 2, "i": 21, "t": 1, "line": 5, "msg": "y=2, x=5, i=21 (T1): out[21] = in[21] + 0.25·(in[20]+in[22]+in[13]+in[29]−4·in[21])"}, {"x": 6, "y": 2, "i": 22, "t": 1, "line": 5, "msg": "y=2, x=6, i=22 (T1): out[22] = in[22] + 0.25·(in[21]+in[23]+in[14]+in[30]−4·in[22])"}, {"x": 1, "y": 3, "i": 25, "t": 2, "line": 5, "msg": "y=3, x=1, i=25 (T2): out[25] = in[25] + 0.25·(in[24]+in[26]+in[17]+in[33]−4·in[25])"}, {"x": 2, "y": 3, "i": 26, "t": 2, "line": 5, "msg": "y=3, x=2, i=26 (T2): out[26] = in[26] + 0.25·(in[25]+in[27]+in[18]+in[34]−4·in[26])"}, {"x": 3, "y": 3, "i": 27, "t": 2, "line": 5, "msg": "y=3, x=3, i=27 (T2): out[27] = in[27] + 0.25·(in[26]+in[28]+in[19]+in[35]−4·in[27])"}, {"x": 4, "y": 3, "i": 28, "t": 2, "line": 5, "msg": "y=3, x=4, i=28 (T2): out[28] = in[28] + 0.25·(in[27]+in[29]+in[20]+in[36]−4·in[28])"}, {"x": 5, "y": 3, "i": 29, "t": 2, "line": 5, "msg": "y=3, x=5, i=29 (T2): out[29] = in[29] + 0.25·(in[28]+in[30]+in[21]+in[37]−4·in[29])"}, {"x": 6, "y": 3, "i": 30, "t": 2, "line": 5, "msg": "y=3, x=6, i=30 (T2): out[30] = in[30] + 0.25·(in[29]+in[31]+in[22]+in[38]−4·in[30])"}, {"x": 1, "y": 4, "i": 33, "t": 0, "line": 5, "msg": "y=4, x=1, i=33 (T0): out[33] = in[33] + 0.25·(in[32]+in[34]+in[25]+in[41]−4·in[33])"}, {"x": 2, "y": 4, "i": 34, "t": 0, "line": 5, "msg": "y=4, x=2, i=34 (T0): out[34] = in[34] + 0.25·(in[33]+in[35]+in[26]+in[42]−4·in[34])"}, {"x": 3, "y": 4, "i": 35, "t": 0, "line": 5, "msg": "y=4, x=3, i=35 (T0): out[35] = in[35] + 0.25·(in[34]+in[36]+in[27]+in[43]−4·in[35])"}, {"x": 4, "y": 4, "i": 36, "t": 0, "line": 5, "msg": "y=4, x=4, i=36 (T0): out[36] = in[36] + 0.25·(in[35]+in[37]+in[28]+in[44]−4·in[36])"}, {"x": 5, "y": 4, "i": 37, "t": 0, "line": 5, "msg": "y=4, x=5, i=37 (T0): out[37] = in[37] + 0.25·(in[36]+in[38]+in[29]+in[45]−4·in[37])"}, {"x": 6, "y": 4, "i": 38, "t": 0, "line": 5, "msg": "y=4, x=6, i=38 (T0): out[38] = in[38] + 0.25·(in[37]+in[39]+in[30]+in[46]−4·in[38])"}, {"x": -1, "y": -1, "i": -1, "t": -1, "line": -1, "swap": true, "msg": "Lépés vége: std::swap(in, out) – a következő időlépés a most írt buffert olvassa."}, {"x": 1, "y": 1, "i": 9, "t": 0, "line": 5, "msg": "y=1, x=1, i=9 (T0): out[9] = in[9] + 0.25·(in[8]+in[10]+in[1]+in[17]−4·in[9])"}, {"x": 2, "y": 1, "i": 10, "t": 0, "line": 5, "msg": "y=1, x=2, i=10 (T0): out[10] = in[10] + 0.25·(in[9]+in[11]+in[2]+in[18]−4·in[10])"}, {"x": 3, "y": 1, "i": 11, "t": 0, "line": 5, "msg": "y=1, x=3, i=11 (T0): out[11] = in[11] + 0.25·(in[10]+in[12]+in[3]+in[19]−4·in[11])"}, {"x": 4, "y": 1, "i": 12, "t": 0, "line": 5, "msg": "y=1, x=4, i=12 (T0): out[12] = in[12] + 0.25·(in[11]+in[13]+in[4]+in[20]−4·in[12])"}, {"x": 5, "y": 1, "i": 13, "t": 0, "line": 5, "msg": "y=1, x=5, i=13 (T0): out[13] = in[13] + 0.25·(in[12]+in[14]+in[5]+in[21]−4·in[13])"}, {"x": 6, "y": 1, "i": 14, "t": 0, "line": 5, "msg": "y=1, x=6, i=14 (T0): out[14] = in[14] + 0.25·(in[13]+in[15]+in[6]+in[22]−4·in[14])"}, {"x": 1, "y": 2, "i": 17, "t": 1, "line": 5, "msg": "y=2, x=1, i=17 (T1): out[17] = in[17] + 0.25·(in[16]+in[18]+in[9]+in[25]−4·in[17])"}, {"x": 2, "y": 2, "i": 18, "t": 1, "line": 5, "msg": "y=2, x=2, i=18 (T1): out[18] = in[18] + 0.25·(in[17]+in[19]+in[10]+in[26]−4·in[18])"}];
const CODE = ["std::for_each(std::execution::par, ys.begin(), ys.end(),", "              [&](std::size_t y) {", "    for (std::size_t x = 1; x + 1 < nx; ++x) {", "        const std::size_t i = y * nx + x;", "        // ötpontos stencil: bal, jobb, fent, lent, közép", "        out[i] = in[i] + 0.25 * (in[i - 1] + in[i + 1] + in[i - nx] + in[i + nx] - 4.0 * in[i]);", "    }", "});", "std::swap(in, out);   // lépés vége (a hívó oldalon)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let INPLACE = false, SWAPPED = false, NXv = 8, NYv = 6;
function thr(y){return (y-1)%3;}
function render(s){
  svg.innerHTML = "";
  const nx=NXv, ny=NYv, c=Math.min(34, Math.floor(360/Math.max(nx,ny))), W = INPLACE ? nx*c+170 : 2*nx*c+230, H = ny*c+110;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="p0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--fg')}" stroke-width="1"/></pattern>`+
   `<pattern id="p1" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${css('--fg')}"/></pattern>`+
   `<pattern id="p2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--fg')}" stroke-width="1"/><line x1="0" y1="0" x2="6" y2="0" stroke="${css('--fg')}" stroke-width="1"/></pattern>`+
   `<pattern id="pb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--muted')}" stroke-width="1"/></pattern>`+
   `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css('--fg')}"/></marker>`;
  const reads = s.i>=0 ? [s.i, s.i-1, s.i+1, s.i-nx, s.i+nx] : [];
  function grid(x0, y0, title, role){
    el("text", {x:x0+nx*c/2, y:y0-10, "text-anchor":"middle", "font-size":14, "font-weight":"bold"}, title);
    for(let y=0;y<ny;y++){
      el("rect", {x:x0-34, y:y0+y*c+3, width:28, height:c-6, fill: (y>0&&y<ny-1)?`url(#p${thr(y)})`:"none", stroke:(y>0&&y<ny-1)?css("--fg"):"none"});
      if(y>0&&y<ny-1) el("text", {x:x0-20, y:y0+y*c+c/2+4, "text-anchor":"middle", "font-size":11, "font-weight":"bold", fill:css("--fg"), stroke:css("--bg"), "stroke-width":3, "paint-order":"stroke"}, "T"+thr(y));
      for(let x=0;x<nx;x++){
        const i=y*nx+x, b=(x==0||y==0||x==nx-1||y==ny-1);
        let sw=0.8, dash="", fill=b?"url(#pb)":css("--cell");
        const isW = (i===s.i && (role==="out"||INPLACE)), isR = reads.includes(i) && (role==="in"||INPLACE);
        let conflict = false;
        if(INPLACE && s.i>=0 && (i===s.i-nx||i===s.i+nx) && i>=nx && i<nx*(ny-1) && thr(Math.floor(i/nx))!==thr(s.y)) conflict = true;
        if(isR){ sw=2.2; dash="3 3"; fill = css("--cellhl"); }
        if(isW){ sw=3.2; dash=""; }
        if(conflict){ sw=4; dash="8 4"; }
        el("rect", {x:x0+x*c, y:y0+y*c, width:c, height:c, fill:fill, stroke:css("--line"), "stroke-width":sw, "stroke-dasharray":dash});
        el("text", {x:x0+x*c+c/2, y:y0+y*c+c/2+(b?-2:4), "text-anchor":"middle", "font-size":Math.min(12,c*0.38)}, String(i));
        if(b) el("text", {x:x0+x*c+c/2, y:y0+y*c+c-4, "text-anchor":"middle", "font-size":Math.min(10,c*0.3), "font-weight":"bold"}, "0");
      }
    }
  }
  const y0 = 40;
  if(!INPLACE){
    const a = SWAPPED ? "B" : "A", b = SWAPPED ? "A" : "B";
    grid(50, y0, `in = buffer ${a}`, "in"); const ox = 50+nx*c+130; grid(ox, y0, `out = buffer ${b}`, "out");
    if(s.i>=0){
      const tx = ox + (s.x)*c + c/2, ty = y0 + s.y*c + c/2;
      reads.forEach(j=>{const sx=50+(j%nx)*c+c/2, sy=y0+Math.floor(j/nx)*c+c/2;
        el("path", {d:`M${sx} ${sy} Q ${(sx+tx)/2} ${(sy+ty)/2 - 40} ${tx-6} ${ty}`, fill:"none", stroke:css("--fg"), "stroke-width":j===s.i?2:1, "marker-end":"url(#ar)", opacity:0.8});});
    }
    const sy = y0+ny*c+40;
    el("path", {d:`M${50+nx*c/2} ${sy} H ${ox+nx*c/2}`, stroke:css("--fg"), "stroke-width": s.swap?3.5:1.2, "marker-end":"url(#ar)", "marker-start":"url(#ar)", fill:"none", "stroke-dasharray": s.swap?"":"5 4"});
    el("text", {x:(50+ox+nx*c)/2, y:sy+22, "text-anchor":"middle", "font-size":13, "font-weight": s.swap?"bold":"normal"}, "lépés vége: std::swap(in, out)");
  } else {
    grid(50, y0, "egy buffer (in-place): in = out", "both");
    el("text", {x:50, y:y0+ny*c+30, "font-size":13, "font-weight":"bold"}, "vastag szaggatott keret: más szál által írt sor olvasása = data race (UB)");
    el("text", {x:50, y:y0+ny*c+50, "font-size":12, fill:css("--muted")}, "a bal szomszéd (i−1) már felülírt értéket ad: sorrendfüggő eredmény");
  }
}
function computeSteps(nx, ny, inplace){
  const st=[];
  for(let y=1;y<ny-1;y++) for(let x=1;x<nx-1;x++){
    const i=y*nx+x, l=i-1, r=i+1, u=i-nx, d=i+nx, t=(y-1)%3;
    let msg=`y=${y}, x=${x}, i=${i} (T${t}): out[${i}] = in[${i}] + 0.25·(in[${l}]+in[${r}]+in[${u}]+in[${d}]−4·in[${i}])`;
    if(inplace){
      const bad=[];
      if(y-1>=1 && (y-2)%3!==t) bad.push(`in[${u}] (T${(y-2)%3} írja)`);
      if(y+1<=ny-2 && y%3!==t) bad.push(`in[${d}] (T${y%3} írja)`);
      msg = `egy buffer – y=${y}, x=${x}, i=${i}: ` + (bad.length ? `ütköző olvasás: ${bad.join(", ")} → data race (UB)` : "nincs másik szál a szomszéd sorokban") + `; in[${l}] már felülírt (sorrendfüggő)`;
    }
    st.push({x:x,y:y,i:i,t:t,line:5,msg:msg});
  }
  if(!inplace) st.push({x:-1,y:-1,i:-1,t:-1,line:8,swap:true,msg:"Lépés vége: std::swap(in, out) – a következő időlépés a most írt buffert olvassa."});
  return st;
}
function applyInput(){
  const nx=Math.max(3,Math.min(12,+document.getElementById("nx").value||8));
  const ny=Math.max(3,Math.min(12,+document.getElementById("ny").value||6));
  document.getElementById("nx").value=nx; document.getElementById("ny").value=ny;
  NXv=nx; NYv=ny; INPLACE=document.getElementById("inpl").checked; SWAPPED=false;
  setSteps(computeSteps(nx, ny, INPLACE));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
