<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector-újraallokálás és lógó referencia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
 <label>tárolás: <select id="mode"><option value="val">std::vector&lt;Texture&gt; (érték)</option><option value="up">std::vector&lt;std::unique_ptr&lt;Texture&gt;&gt;</option><option value="dq">std::deque&lt;Texture&gt;</option></select></label>
 <button id="load" type="button">load() ▶</button>
 <button id="reset" type="button">⏮ Újra</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="A tároló puffere, a régi felszabadított pufferek és a tex referencia állapota load() hívásonként"></svg>
<p class="small">A capacity-sorozat a libstdc++ (g++ 15.2) futásából: 1→2→4→8 (implementációfüggő). A deque blokkmérete itt illusztratív (4 elem/blokk); a libstdc++ 512 bájtos blokkot használ. A lógó referenciát a program nem használhatja: a puszta használata UB.</p>
<script>
const NAMES=["stone","wood","grass","sand","water","lava","ice","moss"];
const svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(t,a,x){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
let n=1, anim=0;
function capOf(k){let c=0;for(let i=1;i<=k;i++){if(i>c)c=c?2*c:1;}return c;}
function defs(){el("defs",{}).innerHTML=`<pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css('--fg')}" stroke-width="1.1"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css('--fg')}"/></marker><marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css('--err')}"/></marker>`;}
function box(x,y,w,h,txt,o){o=o||{};el("rect",{x:x,y:y,width:w,height:h,fill:o.freed?"url(#hz)":css("--cell"),stroke:css("--fg"),"stroke-width":o.lw||1.3,"stroke-dasharray":o.freed?"5 3":""});
  if(txt){if(o.freed)el("rect",{x:x+w/2-30,y:y+h/2-10,width:60,height:18,fill:css("--bg")});el("text",{x:x+w/2,y:y+h/2+5,"text-anchor":"middle","font-size":13},txt);}}
function draw(){
  svg.innerHTML="";defs();
  const mode=document.getElementById("mode").value, cap=capOf(n);
  const caps=[];for(let i=1;i<=n;i++){const c=capOf(i);if(!caps.includes(c))caps.push(c);}
  const cw=78, ch=40;
  let texX=0, texY=0, valid=true, msg="";
  const lastRealloc = n>1 && capOf(n)!==capOf(n-1);
  if(mode!=="dq"){
    // régi pufferek (felszabadítva)
    let y=30;
    el("text",{x:20,y:20,"font-size":13,"font-weight":"bold"},"vector puffer(ek)");
    caps.forEach((c,bi)=>{const cur=(bi===caps.length-1);const yy=30+bi*58;
      el("text",{x:20,y:yy+26,"font-size":12},(cur?"aktuális ":"régi ")+"cap="+c);
      for(let j=0;j<c;j++){const filled = cur ? j<n : j<Math.min(c, n);
        const lab = !filled? "" : (mode==="val" ? NAMES[j] : "ptr");
        box(110+j*cw, yy+6, cw, ch, cur? (j<n?lab:"–") : lab, {freed:!cur});}
      if(!cur) el("text",{x:110+c*cw+8,y:yy+30,"font-size":12,fill:css("--muted")},"felszabadítva");
    });
    const yCur = 30+(caps.length-1)*58;
    if(mode==="val"){
      texX = 110+cw/2; texY = 30+6+ch; valid = caps.length===1;
      // a tex az első pufferben lévő stone-ra mutat
      const t0y = 36;
      el("text",{x:30,y:330,"font-size":14,"font-weight":"bold"},"tex");
      el("path",{d:`M60 325 C 90 300, ${texX} 200, ${texX} ${t0y+ch+2}`,fill:"none",stroke:valid?css("--fg"):css("--err"),"stroke-width":2.4,"stroke-dasharray":valid?"":"8 5","marker-end":valid?"url(#ar)":"url(#ae)"});
      if(!valid) el("text",{x:80,y:350,"font-size":13,"font-weight":"bold",fill:css("--err")},"lógó referencia – használata UB");
      else el("text",{x:80,y:350,"font-size":13},"érvényes referencia");
      if(lastRealloc&&anim){for(let j=0;j<n-1;j++){el("path",{d:`M${110+j*cw+cw/2} ${yCur-58+6+ch} L ${110+j*cw+cw/2} ${yCur+6}`,stroke:css("--hl"),"stroke-width":1.5,"marker-end":"url(#ar)",fill:"none"});}}
    } else {
      // heap objektumok
      el("text",{x:20,y:262,"font-size":12,fill:css("--muted")},"heap:");
      for(let j=0;j<n;j++){box(110+j*cw, 270, cw, ch, NAMES[j], {lw:j===0?2.6:1.3});
        el("path",{d:`M${110+j*cw+cw/2} ${yCur+6+ch} L ${110+j*cw+cw/2} 268`,stroke:css("--fg"),"stroke-width":1,"marker-end":"url(#ar)",fill:"none"});}
      el("text",{x:20,y:345,"font-size":14,"font-weight":"bold"},"tex");
      el("path",{d:`M52 340 C 80 340, 100 330, ${110+cw/2} ${272+ch}`,fill:"none",stroke:css("--fg"),"stroke-width":2.4,"marker-end":"url(#ar)"});
      el("text",{x:110+cw+20,y:345,"font-size":13},"stabil cím: a Texture{stone} nem mozdul");
    }
    msg = `size=${n}, capacity=${cap}. `;
    if(lastRealloc) msg += `capacity ${capOf(n-1)}→${cap}: újraallokálás, `+(mode==="val"?"minden korábbi referencia érvénytelen (az elemek átköltöztek).":"csak a mutatók költöztek, a Texture objektumok helyben maradtak.");
    else if(n===1) msg += "Az első load(): tex az új elemre mutat.";
    else msg += "Volt szabad kapacitás: nincs újraallokálás.";
    if(mode==="val") msg += valid ? " tex: érvényes." : " tex: LÓGÓ (UB, ha használjuk).";
    else msg += " tex: érvényes (stabil cím).";
  } else {
    const B=4; const nb=Math.ceil(n/B);
    el("text",{x:20,y:20,"font-size":13,"font-weight":"bold"},"deque: blokk-térkép + rögzített blokkok");
    el("text",{x:20,y:56,"font-size":12},"térkép");
    for(let b=0;b<nb;b++){box(110+b*60, 36, 60, 32, "blk"+b);}
    for(let b=0;b<nb;b++){const y=120+b*58;
      el("path",{d:`M${110+b*60+30} 68 L 128 ${y+20}`,stroke:css("--muted"),"stroke-width":1,fill:"none","marker-end":"url(#ar)"});
      for(let j=0;j<B;j++){const i=b*B+j; box(110+j*cw+20, y, cw, ch, i<n?NAMES[i]:"–", {lw:i===0?2.6:1.3});}}
    el("text",{x:30,y:345,"font-size":14,"font-weight":"bold"},"tex");
    el("path",{d:`M60 340 C 70 300, 80 200, ${110+20+cw/2} ${120+ch+2}`,fill:"none",stroke:css("--fg"),"stroke-width":2.4,"marker-end":"url(#ar)"});
    msg = `size=${n}, ${nb} blokk. A végére beszúrás (push_back/emplace_back) új blokkot foglal, de a meglévő elemeket nem mozgatja: tex érvényes (az iterátorok viszont érvénytelenné válhatnak).`;
  }
  document.getElementById("status").textContent=msg;
  document.getElementById("cnt").textContent=`load() hívások: ${n}/8`;
}
document.getElementById("load").onclick=()=>{if(n<8){n++;anim=1;draw();}};
document.getElementById("reset").onclick=()=>{n=1;anim=0;draw();};
document.getElementById("mode").onchange=()=>{draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
