<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bump-pointer arena kitöltése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="mal" type="checkbox" onchange="show(k)"> összehasonlítás: std::vector (malloc/free)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az arena memóriasávja lépésenként: minden növekedés új blokkot foglal a végén, a régi blokkok halottak maradnak; a végén used = 12 188 bájt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">arena_vector duplázó növekedése, int (4 bájt, alignof 4, padding = 0); g++ 15.2, x86-64. A 11. lépés után used() = 8188, a másolás után 12 188.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": false}], "used": 4, "size": 1, "cap": 1, "new": 0, "line": 2, "dealloc": false, "msg": "1. növekedés (push_back #1): kapacitás 1 int → új 4 bájtos blokk a 0. bájttól; ar.used() = 4"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": false}], "used": 12, "size": 2, "cap": 2, "new": 1, "line": 2, "dealloc": true, "msg": "2. növekedés (push_back #2): kapacitás 2 int → új 8 bájtos blokk a 4. bájttól; a régi 4 bájtos blokk deallocate-je no-op; ar.used() = 12"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": false}], "used": 28, "size": 3, "cap": 4, "new": 2, "line": 2, "dealloc": true, "msg": "3. növekedés (push_back #3): kapacitás 4 int → új 16 bájtos blokk a 12. bájttól; a régi 8 bájtos blokk deallocate-je no-op; ar.used() = 28"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": false}], "used": 60, "size": 5, "cap": 8, "new": 3, "line": 2, "dealloc": true, "msg": "4. növekedés (push_back #5): kapacitás 8 int → új 32 bájtos blokk a 28. bájttól; a régi 16 bájtos blokk deallocate-je no-op; ar.used() = 60"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": false}], "used": 124, "size": 9, "cap": 16, "new": 4, "line": 2, "dealloc": true, "msg": "5. növekedés (push_back #9): kapacitás 16 int → új 64 bájtos blokk a 60. bájttól; a régi 32 bájtos blokk deallocate-je no-op; ar.used() = 124"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": false}], "used": 252, "size": 17, "cap": 32, "new": 5, "line": 2, "dealloc": true, "msg": "6. növekedés (push_back #17): kapacitás 32 int → új 128 bájtos blokk a 124. bájttól; a régi 64 bájtos blokk deallocate-je no-op; ar.used() = 252"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": false}], "used": 508, "size": 33, "cap": 64, "new": 6, "line": 2, "dealloc": true, "msg": "7. növekedés (push_back #33): kapacitás 64 int → új 256 bájtos blokk a 252. bájttól; a régi 128 bájtos blokk deallocate-je no-op; ar.used() = 508"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": true}, {"owner": "vec", "cap": 128, "start": 508, "size": 512, "dead": false}], "used": 1020, "size": 65, "cap": 128, "new": 7, "line": 2, "dealloc": true, "msg": "8. növekedés (push_back #65): kapacitás 128 int → új 512 bájtos blokk a 508. bájttól; a régi 256 bájtos blokk deallocate-je no-op; ar.used() = 1020"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": true}, {"owner": "vec", "cap": 128, "start": 508, "size": 512, "dead": true}, {"owner": "vec", "cap": 256, "start": 1020, "size": 1024, "dead": false}], "used": 2044, "size": 129, "cap": 256, "new": 8, "line": 2, "dealloc": true, "msg": "9. növekedés (push_back #129): kapacitás 256 int → új 1024 bájtos blokk a 1020. bájttól; a régi 512 bájtos blokk deallocate-je no-op; ar.used() = 2044"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": true}, {"owner": "vec", "cap": 128, "start": 508, "size": 512, "dead": true}, {"owner": "vec", "cap": 256, "start": 1020, "size": 1024, "dead": true}, {"owner": "vec", "cap": 512, "start": 2044, "size": 2048, "dead": false}], "used": 4092, "size": 257, "cap": 512, "new": 9, "line": 2, "dealloc": true, "msg": "10. növekedés (push_back #257): kapacitás 512 int → új 2048 bájtos blokk a 2044. bájttól; a régi 1024 bájtos blokk deallocate-je no-op; ar.used() = 4092"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": true}, {"owner": "vec", "cap": 128, "start": 508, "size": 512, "dead": true}, {"owner": "vec", "cap": 256, "start": 1020, "size": 1024, "dead": true}, {"owner": "vec", "cap": 512, "start": 2044, "size": 2048, "dead": true}, {"owner": "vec", "cap": 1024, "start": 4092, "size": 4096, "dead": false}], "used": 8188, "size": 513, "cap": 1024, "new": 10, "line": 2, "dealloc": true, "msg": "11. növekedés (push_back #513): kapacitás 1024 int → új 4096 bájtos blokk a 4092. bájttól; a régi 2048 bájtos blokk deallocate-je no-op; ar.used() = 8188"}, {"blocks": [{"owner": "vec", "cap": 1, "start": 0, "size": 4, "dead": true}, {"owner": "vec", "cap": 2, "start": 4, "size": 8, "dead": true}, {"owner": "vec", "cap": 4, "start": 12, "size": 16, "dead": true}, {"owner": "vec", "cap": 8, "start": 28, "size": 32, "dead": true}, {"owner": "vec", "cap": 16, "start": 60, "size": 64, "dead": true}, {"owner": "vec", "cap": 32, "start": 124, "size": 128, "dead": true}, {"owner": "vec", "cap": 64, "start": 252, "size": 256, "dead": true}, {"owner": "vec", "cap": 128, "start": 508, "size": 512, "dead": true}, {"owner": "vec", "cap": 256, "start": 1020, "size": 1024, "dead": true}, {"owner": "vec", "cap": 512, "start": 2044, "size": 2048, "dead": true}, {"owner": "vec", "cap": 1024, "start": 4092, "size": 4096, "dead": false}, {"owner": "vec2", "cap": 1000, "start": 8188, "size": 4000, "dead": false}], "used": 12188, "size": 1000, "cap": 1000, "new": 11, "line": 4, "dealloc": false, "msg": "vec2 = vec: a másolat reserve(1000)-je új 4000 bájtos blokk a 8188. bájttól; ar.used() = 12188 (az élő blokkok: vec 4096 B, vec2 4000 B)"}];
const CODE = ["for (int i = 0; i < 1000; ++i) vec.push_back(i);", "  // tele: new_cap = cap ? 2·cap : 1; reserve(new_cap)", "  //   new_data = allocate(new_cap) → arena: offset_ += padding + 4·new_cap", "  //   elemek átvitele; deallocate(data_, cap) → no-op", "arena_vector<int, alloc_t> vec2 = vec;   // reserve(1000): +4000 B", "assert(ar.used() == 12188);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  const mal = document.getElementById("mal") && document.getElementById("mal").checked;
  const X0 = 20, W = 600, sx = v => X0 + W * v / 12500;
  // 1. sáv: valódi arány (0–12 500 B)
  el("text", {x: X0, y: 18, "font-size": 12}, mal ? "std::vector + malloc: a régi blokk visszakerül a heapre (a cím újrahasznosítható)" : "Arena, valódi arányban (0–12 500 B)");
  s.blocks.forEach((b, j) => {
    const dead = b.dead, isNew = j === s.new;
    el("rect", {x: sx(b.start), y: 28, width: Math.max(sx(b.start + b.size) - sx(b.start), 1), height: 40,
      fill: dead ? (mal ? css("--bg") : css("--cellhl")) : css("--hl"), stroke: css("--line"),
      "stroke-dasharray": dead && mal ? "3 2" : "", "stroke-width": isNew ? 3 : 0.8});
  });
  el("line", {x1: sx(s.used), y1: 22, x2: sx(s.used), y2: 76, stroke: css("--hl2"), "stroke-width": 3});
  el("text", {x: Math.min(sx(s.used) + 4, 520), y: 90, "font-size": 12, fill: css("--hl2")}, "offset_ = " + s.used);
  // 2. sáv: blokkonként egyenlő szélesség (vázlat)
  el("text", {x: X0, y: 120, "font-size": 12}, "Blokkok egyenlő szélességű vázlatban (méret, bájt):");
  const n = s.blocks.length, bw = Math.min(W / 12, 50);
  s.blocks.forEach((b, j) => {
    const x = X0 + j * bw, dead = b.dead;
    el("rect", {x: x, y: 130, width: bw - 3, height: 44, fill: dead ? (mal ? css("--bg") : css("--cellhl")) : css("--hl"),
      stroke: css("--line"), "stroke-dasharray": dead && mal ? "3 2" : "", "stroke-width": j === s.new ? 3 : 1});
    el("text", {x: x + bw / 2 - 1.5, y: 156, "text-anchor": "middle", "font-size": 11, fill: dead ? css("--fg") : "#fff"}, String(b.size));
    el("text", {x: x + bw / 2 - 1.5, y: 188, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, b.owner === "vec2" ? "vec2" : "c=" + b.cap);
    if (dead) el("text", {x: x + bw / 2 - 1.5, y: 202, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, mal ? "free" : "halott");
  });
  const liveB = s.blocks.filter(b => !b.dead).reduce((a, b) => a + b.size, 0);
  el("text", {x: X0, y: 232, "font-size": 14}, `vec: size = ${s.size}, capacity = ${s.blocks.filter(b=>b.owner==="vec").slice(-1)[0].cap}` + (s.blocks.some(b=>b.owner==="vec2") ? " · vec2: size = 1000, capacity = 1000" : ""));
  el("text", {x: X0, y: 254, "font-size": 14}, mal ? `élő heap-bájtok: ${liveB} (a régi blokkok visszaadva)` : `ar.used() = ${s.used} bájt; ebből élő: ${liveB}, halott: ${s.used - liveB}`);
  el("text", {x: X0, y: 276, "font-size": 12, fill: css("--muted")}, s.dealloc ? (mal ? "deallocate → free(): a régi blokk visszakerül" : "deallocate(régi blokk) → no-op (bump pointer)") : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
