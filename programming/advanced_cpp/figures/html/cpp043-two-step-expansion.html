<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy- és kétlépcsős expandálás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Példa: <select id="ex"><option value="to_string">TO_STRING (egylépcsős)</option><option value="stringize" selected>STRINGIZE (kétlépcsős)</option><option value="concat1">CONCAT, egylépcsős (a##b)</option><option value="concat2">CONCAT, kétlépcsős</option></select></label> <label>makrónév <input id="mname" size="9" value="VALUE"></label> <label>értéke <input id="mval" size="6" value="42"></label> <button id="exbtn" type="button">Levezetés</button> <span id="exmsg" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A TO_STRING(VALUE) három lépésben a VALUE szöveget adja, mert az x a # operandusa és nem kap előkiterjesztést; a STRINGIZE(VALUE) öt lépésben a 42 szöveget: előkiterjesztés, behelyettesítés, újraszkennelés. A CONCAT ugyanígy PREFIX_bar, illetve foo_bar eredményt ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">[cpp.subst] szerint; a végeredmények a g++ 15.2 -E -P kimenetével egyeznek (helyben ellenőrizve).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. STRINGIZE(VALUE): x = VALUE", "line": 3, "tok": ["STRINGIZE", "(", "VALUE", ")"], "hl": [2], "k": "plain", "i": 0, "kind": "stringize", "all": ["STRINGIZE(VALUE): x = VALUE", "x nem # operandusa → előkiterjesztés:\nVALUE → 42", "behelyettesítés: STRINGIZE_DETAIL(42)", "↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = 42, a # operandusa", "eredmény: \"42\""], "kinds": ["plain", "exp", "plain", "rescan", "result"]}, {"msg": "2. x nem # operandusa → előkiterjesztés: VALUE → 42", "line": 3, "tok": ["STRINGIZE", "(", "42", ")"], "hl": [2], "k": "exp", "i": 1, "kind": "stringize", "all": ["STRINGIZE(VALUE): x = VALUE", "x nem # operandusa → előkiterjesztés:\nVALUE → 42", "behelyettesítés: STRINGIZE_DETAIL(42)", "↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = 42, a # operandusa", "eredmény: \"42\""], "kinds": ["plain", "exp", "plain", "rescan", "result"]}, {"msg": "3. behelyettesítés: STRINGIZE_DETAIL(42)", "line": 3, "tok": ["STRINGIZE_DETAIL", "(", "42", ")"], "hl": [0], "k": "plain", "i": 2, "kind": "stringize", "all": ["STRINGIZE(VALUE): x = VALUE", "x nem # operandusa → előkiterjesztés:\nVALUE → 42", "behelyettesítés: STRINGIZE_DETAIL(42)", "↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = 42, a # operandusa", "eredmény: \"42\""], "kinds": ["plain", "exp", "plain", "rescan", "result"]}, {"msg": "4. ↻ újraszkennelés: STRINGIZE_DETAIL hívása, x = 42, a # operandusa", "line": 2, "tok": ["STRINGIZE_DETAIL", "(", "42", ")"], "hl": [0, 2], "k": "rescan", "i": 3, "kind": "stringize", "all": ["STRINGIZE(VALUE): x = VALUE", "x nem # operandusa → előkiterjesztés:\nVALUE → 42", "behelyettesítés: STRINGIZE_DETAIL(42)", "↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = 42, a # operandusa", "eredmény: \"42\""], "kinds": ["plain", "exp", "plain", "rescan", "result"]}, {"msg": "5. eredmény: \"42\"", "line": 2, "tok": ["\"42\""], "hl": [0], "k": "result", "i": 4, "kind": "stringize", "all": ["STRINGIZE(VALUE): x = VALUE", "x nem # operandusa → előkiterjesztés:\nVALUE → 42", "behelyettesítés: STRINGIZE_DETAIL(42)", "↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = 42, a # operandusa", "eredmény: \"42\""], "kinds": ["plain", "exp", "plain", "rescan", "result"]}];
const CODE = ["#define VALUE 42            // a makrónév és értéke lent átírható", "#define TO_STRING(x) #x", "#define STRINGIZE_DETAIL(x) #x", "#define STRINGIZE(x) STRINGIZE_DETAIL(x)", "#define CONCAT_DETAIL(a, b) a##b", "#define CONCAT(a, b) CONCAT_DETAIL(a, b)   // egylépcsős változat: a##b"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MONO="font-family:ui-monospace,'DejaVu Sans Mono',monospace";
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 760 330");
  el("text",{x:10,y:22,"font-size":14,fill:css("--muted")},"Token-sor az aktuális lépés után:");
  let x=10; const cw=0.6*17;
  s.tok.forEach((t,i)=>{const w=Math.max(t.length*cw+12,22), on=s.hl.includes(i);
    el("rect",{x:x,y:32,width:w,height:30,fill:on?css("--cellhl"):css("--cell"),stroke:on?css("--hl"):css("--line"),"stroke-width":on?3:1});
    el("text",{x:x+w/2,y:53,"text-anchor":"middle","font-size":17,style:MONO,"font-weight":on?"bold":"normal"},t);
    x+=w+4;});
  s.all.forEach((t,j)=>{ if(j>s.i) return;
    const y=84+j*48, k=s.kinds[j], on=(j===s.i);
    el("rect",{x:10,y:y,width:740,height:42,fill:k==="result"?css("--cellhl"):css("--cell"),stroke:on?css("--hl"):css("--line"),
      "stroke-width":on?3:(k==="exp"?2.4:1.2),"stroke-dasharray":k==="noexp"?"7 4":""});
    if(k==="rescan") el("rect",{x:14,y:y+4,width:732,height:34,fill:"none",stroke:css("--line")});
    const lines=(j+1+". "+t).split("\n");
    lines.forEach((l,q)=>el("text",{x:22,y:y+(lines.length===1?27:18+q*17),"font-size":lines.length===1?16:14.5,"font-weight":k==="result"?"bold":"normal"},l));
  });
}
const DEFAULTS={to_string:["VALUE","42"],stringize:["VALUE","42"],concat1:["PREFIX","foo"],concat2:["PREFIX","foo"]};
const LM={to_string:[1],stringize:[2,3],concat1:[5],concat2:[4,5]};
function genJ(kind,name,value){
  if(kind==="to_string"){const c=["TO_STRING","(",name,")"];
    return [{t:"TO_STRING("+name+"): x = "+name,k:"plain",tok:c,hl:[2],line:0},
            {t:"x a # operandusa →\nNINCS előkiterjesztés",k:"noexp",tok:c,hl:[2],line:0},
            {t:'eredmény: "'+name+'"',k:"result",tok:['"'+name+'"'],hl:[0],line:0}];}
  if(kind==="stringize") return [
    {t:"STRINGIZE("+name+"): x = "+name,k:"plain",tok:["STRINGIZE","(",name,")"],hl:[2],line:1},
    {t:"x nem # operandusa → előkiterjesztés:\n"+name+" → "+value,k:"exp",tok:["STRINGIZE","(",value,")"],hl:[2],line:1},
    {t:"behelyettesítés: STRINGIZE_DETAIL("+value+")",k:"plain",tok:["STRINGIZE_DETAIL","(",value,")"],hl:[0],line:1},
    {t:"↻ újraszkennelés: STRINGIZE_DETAIL hívása,\nx = "+value+", a # operandusa",k:"rescan",tok:["STRINGIZE_DETAIL","(",value,")"],hl:[0,2],line:0},
    {t:'eredmény: "'+value+'"',k:"result",tok:['"'+value+'"'],hl:[0],line:0}];
  const c=["CONCAT","(",name,",","_bar",")"];
  if(kind==="concat1") return [
    {t:"CONCAT("+name+", _bar): a = "+name+", b = _bar",k:"plain",tok:c,hl:[2,4],line:0},
    {t:"a és b a ## operandusai →\nNINCS előkiterjesztés",k:"noexp",tok:c,hl:[2,4],line:0},
    {t:"eredmény: "+name+"_bar (✗ nem deklarált)",k:"result",tok:[name+"_bar"],hl:[0],line:0}];
  return [
    {t:"CONCAT("+name+", _bar): a = "+name+", b = _bar",k:"plain",tok:c,hl:[2,4],line:1},
    {t:"a, b nem ## operandus → előkiterjesztés:\n"+name+" → "+value+", _bar marad",k:"exp",tok:["CONCAT","(",value,",","_bar",")"],hl:[2],line:1},
    {t:"behelyettesítés: CONCAT_DETAIL("+value+", _bar)",k:"plain",tok:["CONCAT_DETAIL","(",value,",","_bar",")"],hl:[0],line:1},
    {t:"↻ újraszkennelés: CONCAT_DETAIL hívása,\na = "+value+", b = _bar, a ## operandusai",k:"rescan",tok:["CONCAT_DETAIL","(",value,",","_bar",")"],hl:[0,2,4],line:0},
    {t:"eredmény: "+value+"_bar",k:"result",tok:[value+"_bar"],hl:[0],line:0}];
}
function stepsJ(kind,name,value){const g=genJ(kind,name,value);
  return g.map((s,i)=>({msg:(i+1)+". "+s.t.replace("\n"," "),line:LM[kind][s.line],tok:s.tok,hl:s.hl,k:s.k,i:i,kind:kind,all:g.map(x=>x.t),kinds:g.map(x=>x.k)}));}
function okIdent(t){return /^[A-Za-z_][A-Za-z0-9_]*$/.test(t);}
function apply(){
  const kind=document.getElementById("ex").value;
  let name=document.getElementById("mname").value.trim(), value=document.getElementById("mval").value.trim();
  const m=document.getElementById("exmsg");
  if(!okIdent(name)||!value||/[\s(),#]/.test(value)){m.textContent="A név azonosító legyen, az érték egyetlen token (pl. VERSION és 3).";return;}
  m.textContent="#define "+name+" "+value; setSteps(stepsJ(kind,name,value));
}
document.getElementById("ex").addEventListener("change",()=>{const d=DEFAULTS[document.getElementById("ex").value];
  document.getElementById("mname").value=d[0];document.getElementById("mval").value=d[1];apply();});
document.getElementById("exbtn").onclick=apply;


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
