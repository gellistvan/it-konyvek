const svgEl=document.getElementById("v"), statusEl=document.getElementById("status");

let post=null;

document.getElementById("i").value="2"; document.getElementById("j").value="1";  // a statikus ábra állapota
let trT=null, trOut=[];
function trStop(){ if(trT){clearInterval(trT); trT=null;} document.getElementById("tr").textContent="Bejárás ▶"; }
document.getElementById("tr").onclick=()=>{
  if(trT){trStop();return;}
  const lay=document.getElementById("lay").value, oneD=(lay==="col"||lay==="diag");
  const seq=[]; for(let a=0;a<3;a++){ if(oneD) seq.push([a,0]); else for(let b=0;b<3;b++) seq.push([a,b]); }
  let n=0; trOut=[]; document.getElementById("out").textContent="kiírva: ";
  document.getElementById("tr").textContent="⏸ Szünet";
  const stepF=()=>{ if(n>=seq.length){trStop();return;}
    document.getElementById("i").value=String(seq[n][0]); document.getElementById("j").value=String(seq[n][1]); draw();
    const m=/érték (\d+)/.exec(statusEl.textContent); trOut.push(m?m[1]:"?");
    document.getElementById("out").textContent="kiírva ("+(oneD?"for k":"for i { for j }")+"): "+trOut.join(" "); n++; };
  stepF(); trT=setInterval(stepF,800);
};

  CONTROLS.filter(c=>c.type==="step").forEach(c=>{document.getElementById(c.id+"_cnt").textContent=

  const S=STATES[CONTROLS.filter(c=>c.id!==STAGE_CTL).map(c=>vals[c.id]).join("|")];
  const D=JSON.parse(JSON.stringify(S.D));
  if(STAGE_CTL){const sv=+vals[STAGE_CTL];
    ["nodes","edges","texts"].forEach(f=>{D[f]=(D[f]||[]).filter(o=>!(o.stage>sv));
      D[f].forEach(o=>{if(o.stage===sv){if(f==="texts")o.bold=true; else o.hl=true;}});});}
  const out=dg_draw(svgEl,D);
  [...D.nodes,...D.edges].forEach(o=>{ if(o.act&&out[o.id]){const g=out[o.id];
     g.setAttribute("data-act","1"); g.setAttribute("tabindex","0"); g.setAttribute("role","button");
     g.setAttribute("aria-label",o.actlabel||o.id);
     const f=()=>setCtl(o.act.ctl,o.act.val); g.addEventListener("click",f);
     g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});}});
  statusEl.textContent=(S.msgs&&STAGE_CTL)?S.msgs[+vals[STAGE_CTL]]:S.msg;
