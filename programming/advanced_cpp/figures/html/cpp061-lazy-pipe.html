<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lusta pipe kiértékelése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>numbers: <input id="inp" value="1, 2, 3, 4, 5, 6" size="18" aria-label="Bemeneti számok"></label><label>predikátum: <select id="pred" aria-label="Predikátum"><option value="even">páros</option><option value="odd">páratlan</option><option value="gt3">&gt; 3</option></select></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat elem közül a páratlanokat a szűrő elutasítja, a párosok négyzetre emelve 4, 16, 36 sorrendben jutnak a kimenetre."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A hívássorrend a g++ 15.2 (libstdc++) helyben naplózott futásával egyezik: 6 predikátum- és 3 transform-hívás, kimenet 4 16 36. A filter a begin() első hívásakor gyorsítótárazza az első találatot.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"op": "begin", "pos": 1, "ev": [["PRED", 1, false], ["PRED", 2, true]], "out": [], "np": 2, "nx": 0, "rej": [0], "acc": [1], "msg": "1. begin(): pred(1) = hamis, pred(2) = igaz → az it a 2-n áll; kimenet: — · predikátumhívás: 2, transform-hívás: 0", "line": 0, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "deref", "pos": 1, "ev": [["XF", 2, 4]], "out": [4], "np": 2, "nx": 1, "rej": [0], "acc": [1], "msg": "2. *it: transform(2) = 4 → az it a 2-n áll; kimenet: 4 · predikátumhívás: 2, transform-hívás: 1", "line": 2, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "incr", "pos": 3, "ev": [["PRED", 3, false], ["PRED", 4, true]], "out": [4], "np": 4, "nx": 1, "rej": [0, 2], "acc": [1, 3], "msg": "3. ++it: pred(3) = hamis, pred(4) = igaz → az it a 4-n áll; kimenet: 4 · predikátumhívás: 4, transform-hívás: 1", "line": 1, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "deref", "pos": 3, "ev": [["XF", 4, 16]], "out": [4, 16], "np": 4, "nx": 2, "rej": [0, 2], "acc": [1, 3], "msg": "4. *it: transform(4) = 16 → az it a 4-n áll; kimenet: 4 16 · predikátumhívás: 4, transform-hívás: 2", "line": 2, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "incr", "pos": 5, "ev": [["PRED", 5, false], ["PRED", 6, true]], "out": [4, 16], "np": 6, "nx": 2, "rej": [0, 2, 4], "acc": [1, 3, 5], "msg": "5. ++it: pred(5) = hamis, pred(6) = igaz → az it a 6-n áll; kimenet: 4 16 · predikátumhívás: 6, transform-hívás: 2", "line": 1, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "deref", "pos": 5, "ev": [["XF", 6, 36]], "out": [4, 16, 36], "np": 6, "nx": 3, "rej": [0, 2, 4], "acc": [1, 3, 5], "msg": "6. *it: transform(6) = 36 → az it a 6-n áll; kimenet: 4 16 36 · predikátumhívás: 6, transform-hívás: 3", "line": 2, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}, {"op": "incr", "pos": 6, "ev": [], "out": [4, 16, 36], "np": 6, "nx": 3, "rej": [0, 2, 4], "acc": [1, 3, 5], "msg": "7. ++it: nincs több elem → vége (end); kimenet: 4 16 36 · predikátumhívás: 6, transform-hívás: 3", "line": 1, "nums": [1, 2, 3, 4, 5, 6], "pname": "n % 2 == 0"}];
const CODE = ["auto it = even_squares.begin();   // filter: keres az első találatig (gyorsítótárazva)", "for (; it != end; ++it)           // ++it: keres a következő találatig", "    std::cout << *it << ' ';      // *it: transform(n) – minden *it-nél újra fut"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PREDS = {even: [n => n % 2 === 0, "n % 2 == 0"], odd: [n => n % 2 !== 0, "n % 2 != 0"], gt3: [n => n > 3, "n > 3"]};
function pullJ(nums, pk){
  const pred = PREDS[pk][0], st = [], out = [], rej = [], acc = []; let np = 0, nx = 0;
  const seek = s => { const ev = []; for (let i = s; i < nums.length; i++) { const r = pred(nums[i]); np++; ev.push(["PRED", nums[i], r]); (r ? acc : rej).push(i); if (r) return [i, ev]; } return [nums.length, ev]; };
  const mk = (op, pos, ev) => { const k = st.length + 1, evs = ev.map(e => e[0] === "PRED" ? `pred(${e[1]}) = ${e[2] ? "igaz" : "hamis"}` : `transform(${e[1]}) = ${e[2]}`).join(", ");
    st.push({op, pos, ev, out: out.slice(), np, nx, rej: rej.slice(), acc: acc.slice(), nums, pname: PREDS[pk][1], line: {begin: 0, deref: 2, incr: 1}[op],
      msg: `${k}. ${{begin: "begin()", deref: "*it", incr: "++it"}[op]}: ${evs || "nincs több elem"} → ${pos >= nums.length ? "vége (end)" : "az it a " + nums[pos] + "-n áll"}; kimenet: ${out.join(" ") || "—"} · predikátumhívás: ${np}, transform-hívás: ${nx}`}); };
  let [pos, ev] = seek(0); mk("begin", pos, ev);
  while (pos < nums.length) { const y = nums[pos] * nums[pos]; nx++; out.push(y); mk("deref", pos, [["XF", nums[pos], y]]); [pos, ev] = seek(pos + 1); mk("incr", pos, ev); }
  return st;
}
function load(){
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), err = document.getElementById("err");
  if (!a.length || a.length > 12 || a.some(x => !Number.isInteger(x))) { err.textContent = "1–12 egész számot adjon meg."; return; }
  err.textContent = ""; setSteps(pullJ(a, document.getElementById("pred").value));
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 230");
  svg.innerHTML = "";
  const n = s.nums.length, W = Math.min(48, 300 / n), X0 = 16, Y = 70;
  s.nums.forEach((v, i) => {
    const acc = s.acc.includes(i), rej = s.rej.includes(i), cur = i === s.pos;
    el("rect", {x: X0 + i*W, y: Y, width: W - 2, height: 44, fill: cur ? css("--hl") : css("--cell"), stroke: css("--line"), "stroke-width": acc ? 3.5 : 1});
    el("text", {x: X0 + i*W + W/2 - 1, y: Y + 29, "text-anchor": "middle", "font-size": 18, fill: cur ? "#fff" : css("--fg")}, String(v));
    if (rej) el("line", {x1: X0 + i*W + 5, y1: Y + 40, x2: X0 + i*W + W - 7, y2: Y + 4, stroke: css("--line"), "stroke-width": 2});
  });
  el("text", {x: X0, y: Y - 14, "font-size": 12, fill: css("--muted")}, "numbers");
  const gx = X0 + n * W + 20;
  const fOn = s.ev.some(e => e[0] === "PRED"), tOn = s.ev.some(e => e[0] === "XF");
  el("rect", {x: gx, y: Y, width: 120, height: 44, rx: 8, fill: fOn ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": fOn ? 3 : 1});
  el("text", {x: gx + 60, y: Y + 20, "text-anchor": "middle", "font-size": 12}, "filter");
  el("text", {x: gx + 60, y: Y + 36, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, s.pname || "n % 2 == 0");
  el("rect", {x: gx + 140, y: Y, width: 110, height: 44, rx: 8, fill: tOn ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": tOn ? 3 : 1});
  el("text", {x: gx + 195, y: Y + 20, "text-anchor": "middle", "font-size": 12}, "transform");
  el("text", {x: gx + 195, y: Y + 36, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "n * n");
  el("text", {x: gx + 60, y: Y + 64, "text-anchor": "middle", "font-size": 12}, "hívások: " + s.np);
  el("text", {x: gx + 195, y: Y + 64, "text-anchor": "middle", "font-size": 12}, "hívások: " + s.nx);
  el("text", {x: X0, y: 30, "font-size": 14, "font-weight": "bold"}, ({begin: "begin()", deref: "*it", incr: "++it"})[s.op] + " – a for ciklus húzza az elemet");
  el("text", {x: X0, y: 200, "font-size": 15}, "for (int x : even_squares) kimenet: " + (s.out.join(" ") || "—"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
