<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Függőségi lánc és SIMD</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n: <input id="nn" type="range" min="1" max="40" value="19" oninput="reload()" aria-label="Elemszám"> <span id="nnv">19</span></label><label>akkumulátorok (b): <select id="acc" onchange="reload()" aria-label="Akkumulátorok száma"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label><label><input id="fl" type="checkbox" onchange="reload()"> fold-left vektorizálás (c)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az egyakkumulátoros összegzés 19 egymásra épülő lépés; négy akkumulátorral négy párhuzamos rövidebb lánc; AVX-szel két 8 sávos lépés, horizontális összegzés és 3 elemes maradék."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés: 4 ciklus FP-add/FMA késleltetés, 2 végrehajtó egység, betöltés és ciklusvezérlés nélkül. Kitöltött = kész, vastag keret = folyamatban, szaggatott = még nem indult; sraffozott = maradék.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "msg": "ciklus 0: kész (a) 0/19, (b) 0/22, (c) 0/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 4, "msg": "ciklus 4: kész (a) 1/19, (b) 2/22, (c) 1/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 8, "msg": "ciklus 8: kész (a) 2/19, (b) 6/22, (c) 2/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 12, "msg": "ciklus 12: kész (a) 3/19, (b) 10/22, (c) 3/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 16, "msg": "ciklus 16: kész (a) 4/19, (b) 14/22, (c) 4/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 20, "msg": "ciklus 20: kész (a) 5/19, (b) 17/22, (c) 5/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 24, "msg": "ciklus 24: kész (a) 6/19, (b) 19/22, (c) 6/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 28, "msg": "ciklus 28: kész (a) 7/19, (b) 20/22, (c) 7/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 32, "msg": "ciklus 32: kész (a) 8/19, (b) 21/22, (c) 8/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 36, "msg": "ciklus 36: kész (a) 9/19, (b) 22/22, (c) 9/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 40, "msg": "ciklus 40: kész (a) 10/19, (b) 22/22, (c) 10/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 44, "msg": "ciklus 44: kész (a) 11/19, (b) 22/22, (c) 11/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 48, "msg": "ciklus 48: kész (a) 12/19, (b) 22/22, (c) 12/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 52, "msg": "ciklus 52: kész (a) 13/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 56, "msg": "ciklus 56: kész (a) 14/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 60, "msg": "ciklus 60: kész (a) 15/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 64, "msg": "ciklus 64: kész (a) 16/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 68, "msg": "ciklus 68: kész (a) 17/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 72, "msg": "ciklus 72: kész (a) 18/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}, {"t": 76, "msg": "ciklus 76: kész (a) 19/19, (b) 22/22, (c) 13/13 művelet · modellciklusok: (a) 76, (b) 36, (c) 52", "line": -1}];
const CODE = ["// (a) sum_scalar", "for (std::size_t i = 0; i < n; ++i) sum += data[i];", "// (b) sum_unrolled4 (A akkumulátor)", "for (; i + 4 <= n; i += 4) { sum0 += data[i]; sum1 += data[i + 1]; sum2 += ...; sum3 += ...; }", "for (; i < n; ++i) sum0 += data[i];                     // maradék", "return (sum0 + sum1) + (sum2 + sum3);", "// (c) sum_of_squares_avx2", "for (; i + 8 <= n; i += 8) sum_vec = _mm256_fmadd_ps(v, v, sum_vec);", "for (std::size_t j = 0; j < 8; ++j) sum += lane[j];      // horizontális összegzés", "for (; i < n; ++i) sum += data[i] * data[i];            // tail"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

document.head.insertAdjacentHTML("beforeend","<style>.ctl label{display:inline-flex;align-items:center;gap:5px} select,input{font:inherit}</style>");
const LAT=4, UNITS=2; let PN=19, PA=4, PF=false;
function schedule(ops){const used={}; for(const o of ops){let t=0; for(const d of o.deps) t=Math.max(t,ops[d].end);
  while((used[t]||0)>=UNITS) t++; used[t]=(used[t]||0)+1; o.start=t; o.end=t+LAT;} return ops;}
function laneScalar(n){const ops=[]; for(let i=0;i<n;i++) ops.push({row:0,lab:String(i+1),deps:i?[i-1]:[],line:1}); return schedule(ops);}
function laneUnrolled(n,A){const ops=[], last={}; const full=Math.floor(n/A)*A;
  for(let i=0;i<full;i++){const j=i%A; ops.push({row:j,lab:String(i+1),deps:(j in last)?[last[j]]:[],line:3}); last[j]=ops.length-1;}
  for(let i=full;i<n;i++){ops.push({row:0,lab:String(i+1),deps:(0 in last)?[last[0]]:[],line:4,hatch:true}); last[0]=ops.length-1;}
  let level=[]; for(let j=0;j<A;j++) level.push(j in last?last[j]:null);
  while(level.length>1){const nx=[]; for(let q=0;q+1<level.length;q+=2){ops.push({row:A,lab:"+",deps:[level[q],level[q+1]].filter(d=>d!==null),line:5}); nx.push(ops.length-1);} level=nx;}
  return schedule(ops);}
function laneAvx(n,fl){const ops=[], nv=Math.floor(n/8);
  if(fl){for(let i=0;i<n;i++) ops.push({row:1,lab:String(i+1),deps:i?[i-1]:[],line:i<8*nv?7:9,hatch:i>=8*nv}); return schedule(ops);}
  for(let v=0;v<nv;v++) ops.push({row:0,lab:(8*v+1)+"–"+(8*v+8),deps:v?[v-1]:[],line:7,vec:true});
  let prev=nv?nv-1:null;
  for(let j=0;j<8;j++){ops.push({row:1,lab:"j="+j,deps:prev!==null?[prev]:[],line:8}); prev=ops.length-1;}
  for(let i=8*nv;i<n;i++){ops.push({row:2,lab:String(i+1),deps:[prev],line:9,hatch:true}); prev=ops.length-1;}
  return schedule(ops);}
function total(L){return L.length?Math.max(...L.map(o=>o.end)):0;}
function lanes(){return [laneScalar(PN), laneUnrolled(PN,PA), laneAvx(PN,PF)];}
function mkSteps(){const L=lanes(), T=L.map(total), tmax=Math.max(...T), out=[]; let t=0;
  while(true){const done=L.map(l=>l.filter(o=>o.end<=t).length);
    out.push({t, line:-1, msg:`ciklus ${t}: kész (a) ${done[0]}/${L[0].length}, (b) ${done[1]}/${L[1].length}, (c) ${done[2]}/${L[2].length} művelet · modellciklusok: (a) ${T[0]}, (b) ${T[1]}, (c) ${T[2]}`});
    if(t>=tmax) break; t=Math.min(t+LAT,tmax);}
  return out;}
function render(s){
  svg.innerHTML=""; const L=lanes(), T=L.map(total), tmax=Math.max(...T);
  const X0=130, W=988, sc=(W-X0-80)/tmax, fg=css("--fg"), hl=css("--hl"), mut=css("--muted"), cellhl=css("--cellhl"), cell=css("--cell");
  const defs=el("defs",{}); defs.innerHTML=`<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`;
  const accRows=[]; for(let j=0;j<PA;j++) accRows.push("sum"+j); if(PA>1) accRows.push("összevonás");
  const spec=[["(a) sum_scalar – 1 akkumulátor",["sum"],null],[`(b) ${PA} akkumulátor (a maradék a sum0-ba)`,accRows,null],
    [PF?"(c) fold-left vektorizálás: vektoros betöltés, soros összeadás":"(c) sum_of_squares_avx2",PF?["(betöltés)","soros +"]:["FMA (8 sáv)","horiz. 8→1","tail"],PF?null:0]];
  const lines=new Set(); let y=6;
  spec.forEach(([title,rows,vecrow],li)=>{
    el("text",{x:0,y:y+14,"font-size":16,"font-weight":"bold"},title+` – ${T[li]} ciklus`);
    const ys={}; let yy=y+24; const rh=PA===8&&li===1?16:22;
    rows.forEach((nm,r)=>{const h=(r===vecrow)?40:rh; ys[r]=[yy,h]; el("text",{x:X0-8,y:yy+h/2+5,"text-anchor":"end","font-size":13},nm); yy+=h+5;});
    L[li].forEach((o,k)=>{const [ry,h]=ys[o.row]; const x=X0+o.start*sc, w=Math.max(1,LAT*sc-2);
      const past=o.end<=s.t, act=o.start<=s.t&&s.t<o.end;
      if(act) lines.add(o.line);
      const r=el("rect",{x,y:ry,width:w,height:h,fill:past?cellhl:cell,stroke:act?hl:(o.start<s.t||past?fg:mut),"stroke-width":act?3:1,"stroke-dasharray":(o.start>s.t)?"3 3":""});
      if(o.hatch) el("rect",{x,y:ry,width:w,height:h,fill:"url(#hp)",opacity:0.5});
      if(o.vec) for(let q=1;q<8;q++) el("line",{x1:x,y1:ry+q*h/8,x2:x+w,y2:ry+q*h/8,stroke:fg,"stroke-width":0.4});
      if(w>(o.lab.length*7+4)) el("text",{x:x+w/2,y:ry+h/2+5,"text-anchor":"middle","font-size":12},o.lab);
      o.deps.forEach(d=>{const p=L[li][d]; const [py,ph]=ys[p.row]; const xe=X0+p.end*sc-2;
        if(p.row===o.row) el("path",{d:`M${xe-4} ${ry}V${ry-4}H${x+4}V${ry}`,fill:"none",stroke:fg,"stroke-width":0.8,"marker-end":"url(#ar)"});
        else el("line",{x1:xe,y1:py+ph/2,x2:x,y2:ry+h/2,stroke:fg,"stroke-width":0.8,"marker-end":"url(#ar)"});});
    });
    y=yy+10; });
  const xc=X0+s.t*sc; el("line",{x1:xc,y1:4,x2:xc,y2:y,stroke:hl,"stroke-width":2});
  const step=tmax>80?16:8; for(let c=0;c<=tmax;c+=step){el("text",{x:X0+c*sc,y:y+14,"text-anchor":"middle","font-size":12,fill:mut},String(c));}
  el("text",{x:X0-8,y:y+14,"text-anchor":"end","font-size":12,fill:mut},"ciklus");
  svg.setAttribute("viewBox",`0 0 ${W} ${y+24}`);
  lines.forEach(l=>{const e=document.getElementById("L"+l); if(e) e.classList.add("on");});
}
function reload(){PN=+document.getElementById("nn").value; PA=+document.getElementById("acc").value; PF=document.getElementById("fl").checked;
  document.getElementById("nnv").textContent=PN; setSteps(mkSteps());}
setTimeout(()=>{const h=(location.hash||"").slice(1); if(!h) return; const p=Object.fromEntries(h.split("&").map(x=>x.split("=")));
  if(p.n) document.getElementById("nn").value=p.n; if(p.a) document.getElementById("acc").value=p.a; if(p.f) document.getElementById("fl").checked=p.f==="1";
  reload(); show(STEPS.length-1);},0);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
