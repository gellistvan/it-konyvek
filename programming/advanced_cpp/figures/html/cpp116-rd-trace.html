<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekurzív leszállás lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>:root{--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}@media (prefers-color-scheme:dark){:root{--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}</style><label>Bemenet (30.3.6) <select id="inpsel"><option value="1+2">"1+2" → 3</option><option value="3*4+5">"3*4+5" → 17</option><option value="3*(4+5)">"3*(4+5)" → 27</option><option value="(1+2)*(3+4)">"(1+2)*(3+4)" → 21</option><option value="10/3">"10/3" → 3,33333</option><option value="1+2*3">"1+2*3" → 7</option><option value=" 2 + 3 * 4 - 5 " selected>" 2 + 3 * 4 - 5 " → 9</option><option value="((1+2)*(3+4))">"((1+2)*(3+4))" → 21</option><option value="8-4-2">"8-4-2" → 2</option><option value="1+2*">"1+2*" → Expected number</option><option value="(1+2">"(1+2" → Expected &#x27;)&#x27;</option><option value="1++2">"1++2" → Expected number</option><option value="abc">"abc" → Expected number</option><option value="1 2">"1 2" → Unexpected trailing input</option></select></label><label>saját: <input id="own" value=" 2 + 3 * 4 - 5 " size="16" aria-label="Saját bemenet"></label><button id="go" type="button">Elemzés</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A rekurzív leszállású parser hívásverme és bemeneti kurzora lépésenként; a 2 + 3 * 4 - 5 bemenet eredménye 9."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 30.3.3 Parser JS-portja (ugyanazok a hibaüzenetek); közvetlen kiértékelés, AST nélkül. A beépített bemenet lépései a Python-átiratból készültek, a többi bemenetet a JS-port számolja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. parse_number → 2", "line": 45, "inp": " 2 + 3 * 4 - 5 ", "pos": 2, "stack": [{"fn": "parse_expr", "v": "", "ex": ""}, {"fn": "parse_term", "v": "", "ex": ""}, {"fn": "parse_factor", "v": "", "ex": ""}, {"fn": "parse_number", "v": "2", "ex": "2"}], "res": null, "err": null}, {"msg": "2. parse_term vissza a parse_expr-be: 2", "line": 76, "inp": " 2 + 3 * 4 - 5 ", "pos": 3, "stack": [{"fn": "parse_expr", "v": "2", "ex": "2"}], "res": null, "err": null}, {"msg": "3. parse_expr: consume('+')", "line": 79, "inp": " 2 + 3 * 4 - 5 ", "pos": 4, "stack": [{"fn": "parse_expr", "v": "2", "ex": "2"}], "res": null, "err": null}, {"msg": "4. parse_number → 3", "line": 45, "inp": " 2 + 3 * 4 - 5 ", "pos": 6, "stack": [{"fn": "parse_expr", "v": "2", "ex": "2"}, {"fn": "parse_term", "v": "", "ex": ""}, {"fn": "parse_factor", "v": "", "ex": ""}, {"fn": "parse_number", "v": "3", "ex": "3"}], "res": null, "err": null}, {"msg": "5. parse_term: consume('*')", "line": 64, "inp": " 2 + 3 * 4 - 5 ", "pos": 8, "stack": [{"fn": "parse_expr", "v": "2", "ex": "2"}, {"fn": "parse_term", "v": "3", "ex": "3"}], "res": null, "err": null}, {"msg": "6. parse_term: value = 3 · 4 = 12", "line": 65, "inp": " 2 + 3 * 4 - 5 ", "pos": 10, "stack": [{"fn": "parse_expr", "v": "2", "ex": "2"}, {"fn": "parse_term", "v": "12", "ex": "*(3, 4)"}], "res": null, "err": null}, {"msg": "7. parse_expr: value = 2 + 12 = 14", "line": 80, "inp": " 2 + 3 * 4 - 5 ", "pos": 11, "stack": [{"fn": "parse_expr", "v": "14", "ex": "+(2, *(3, 4))"}], "res": null, "err": null}, {"msg": "8. parse_expr: consume('-')", "line": 81, "inp": " 2 + 3 * 4 - 5 ", "pos": 12, "stack": [{"fn": "parse_expr", "v": "14", "ex": "+(2, *(3, 4))"}], "res": null, "err": null}, {"msg": "9. parse_number → 5", "line": 45, "inp": " 2 + 3 * 4 - 5 ", "pos": 14, "stack": [{"fn": "parse_expr", "v": "14", "ex": "+(2, *(3, 4))"}, {"fn": "parse_term", "v": "", "ex": ""}, {"fn": "parse_factor", "v": "", "ex": ""}, {"fn": "parse_number", "v": "5", "ex": "5"}], "res": null, "err": null}, {"msg": "10. parse_expr: value = 14 − 5 = 9", "line": 82, "inp": " 2 + 3 * 4 - 5 ", "pos": 15, "stack": [{"fn": "parse_expr", "v": "9", "ex": "-(+(2, *(3, 4)), 5)"}], "res": null, "err": null}, {"msg": "11. skip_whitespace, a bemenet üres → eredmény: 9   (fa: -(+(2, *(3, 4)), 5))", "line": 10, "inp": " 2 + 3 * 4 - 5 ", "pos": 15, "stack": [], "res": "9", "err": null}];
const CODE = ["class Parser {", "public:", "    explicit Parser(std::string_view input) : input_(input) {}", "", "    auto parse() -> double {", "        double result = parse_expr();", "        skip_whitespace();", "        if (!input_.empty()) {", "            throw std::runtime_error(\"Unexpected trailing input\");", "        }", "        return result;", "    }", "", "private:", "    std::string_view input_;", "", "    void skip_whitespace() {", "        while (!input_.empty() && std::isspace(static_cast<unsigned char>(input_.front()))) {", "            input_.remove_prefix(1);", "        }", "    }", "", "    bool consume(char c) {", "        skip_whitespace();", "        if (!input_.empty() && input_.front() == c) {", "            input_.remove_prefix(1);", "            return true;", "        }", "        return false;", "    }", "", "    auto parse_number() -> double {", "        skip_whitespace();", "        std::size_t len = 0;", "        while (len < input_.size() && std::isdigit(static_cast<unsigned char>(input_[len]))) {", "            ++len;", "        }", "        if (len == 0) {", "            throw std::runtime_error(\"Expected number\");", "        }", "        double value = 0.0;", "        for (std::size_t i = 0; i < len; ++i) {", "            value = value * 10.0 + (input_[i] - '0');", "        }", "        input_.remove_prefix(len);", "        return value;", "    }", "", "    auto parse_factor() -> double {", "        skip_whitespace();", "        if (consume('(')) {", "            double value = parse_expr();", "            if (!consume(')')) {", "                throw std::runtime_error(\"Expected ')'\");", "            }", "            return value;", "        }", "        return parse_number();", "    }", "", "    auto parse_term() -> double {", "        double value = parse_factor();", "        while (true) {", "            skip_whitespace();", "            if (consume('*')) {", "                value *= parse_factor();", "            } else if (consume('/')) {", "                value /= parse_factor();", "            } else {", "                break;", "            }", "        }", "        return value;", "    }", "", "    auto parse_expr() -> double {", "        double value = parse_term();", "        while (true) {", "            skip_whitespace();", "            if (consume('+')) {", "                value += parse_term();", "            } else if (consume('-')) {", "                value -= parse_term();", "            } else {", "                break;", "            }", "        }", "        return value;", "    }", "};"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const RD_LN = {"num_ret": 45, "num_err": 38, "lpar": 50, "rpar": 53, "term_first": 61, "mul": 65, "div": 67, "cmul": 64, "cdiv": 66, "expr_first": 76, "add": 80, "sub": 82, "cadd": 79, "csub": 81, "trail": 8, "ret": 10};
const RD_WS = " \t\n\v\f\r";
function rdFmt(v){
  if (Number.isNaN(v)) return "NaN";
  if (!Number.isFinite(v)) return v > 0 ? "∞" : "−∞";
  if (Number.isInteger(v)) return String(v).replace("-", "−");
  let s = String(parseFloat(v.toPrecision(6)));
  return s.replace(".", ",").replace("-", "−");
}
function rdTrace(inp){
  const st = {pos: 0, stack: [], steps: [], quiet: false};
  const ERR = {};
  function emit(msg, line, res, err){
    st.steps.push({msg: (st.steps.length + 1) + ". " + msg, line: line, inp: inp, pos: st.pos,
      stack: st.stack.map(f => ({fn: f.fn, v: f.v === null ? "" : rdFmt(f.v), ex: f.ex})),
      res: res === undefined ? null : res, err: err === undefined ? null : err});
  }
  function skip(){ while (st.pos < inp.length && RD_WS.includes(inp[st.pos])) st.pos++; }
  function consume(c){ skip(); if (st.pos < inp.length && inp[st.pos] === c) { st.pos++; return true; } return false; }
  function push(fn){ const f = {fn: fn, v: null, ex: ""}; st.stack.push(f); return f; }
  function number(quiet){
    const f = push("parse_number"); skip();
    let n = 0;
    while (st.pos + n < inp.length && "0123456789".includes(inp[st.pos + n])) n++;
    if (n === 0) { emit("parse_number: nincs számjegy → hiba: Expected number", RD_LN.num_err, null, "Expected number"); throw ERR; }
    let v = 0.0;
    for (const ch of inp.slice(st.pos, st.pos + n)) v = v * 10.0 + (ch.charCodeAt(0) - 48);
    st.pos += n; f.v = v; f.ex = rdFmt(v);
    if (!quiet) emit("parse_number → " + rdFmt(v), RD_LN.num_ret);
    st.stack.pop(); return [v, rdFmt(v)];
  }
  function factor(){
    const quiet = st.quiet; st.quiet = false;
    const f = push("parse_factor"); skip();
    if (consume("(")) {
      emit("parse_factor: consume('(') – zárójeles részkifejezés", RD_LN.lpar);
      const r = expr();
      if (!consume(")")) { emit("parse_factor: hiányzó ')' → hiba: Expected ')'", RD_LN.rpar, null, "Expected ')'"); throw ERR; }
      f.v = r[0]; f.ex = r[1];
      emit("parse_factor: consume(')') → " + rdFmt(r[0]), RD_LN.rpar);
      st.stack.pop(); return r;
    }
    const r = number(quiet); st.stack.pop(); return r;
  }
  function term(){
    const f = push("parse_term");
    let [v, ex] = factor(); f.v = v; f.ex = ex;
    for (;;) {
      skip();
      let hit = false;
      for (const [op, cl, ll] of [["*", "cmul", "mul"], ["/", "cdiv", "div"]]) {
        if (consume(op)) {
          emit("parse_term: consume('" + op + "')", RD_LN[cl]);
          st.quiet = true;
          const [r, rex] = factor();
          const old = v;
          v = op === "*" ? v * r : v / r;
          ex = op + "(" + ex + ", " + rex + ")"; f.v = v; f.ex = ex;
          emit("parse_term: value = " + rdFmt(old) + (op === "*" ? " · " : " / ") + rdFmt(r) + " = " + rdFmt(v), RD_LN[ll]);
          hit = true; break;
        }
      }
      if (!hit) break;
    }
    st.stack.pop(); return [v, ex];
  }
  function expr(){
    const f = push("parse_expr");
    let [v, ex] = term(); f.v = v; f.ex = ex;
    emit("parse_term vissza a parse_expr-be: " + rdFmt(v), RD_LN.expr_first);
    for (;;) {
      skip();
      let hit = false;
      for (const [op, cl, ll] of [["+", "cadd", "add"], ["-", "csub", "sub"]]) {
        if (consume(op)) {
          emit("parse_expr: consume('" + op + "')", RD_LN[cl]);
          const [r, rex] = term();
          const old = v;
          v = op === "+" ? v + r : v - r;
          ex = op + "(" + ex + ", " + rex + ")"; f.v = v; f.ex = ex;
          emit("parse_expr: value = " + rdFmt(old) + (op === "+" ? " + " : " − ") + rdFmt(r) + " = " + rdFmt(v), RD_LN[ll]);
          hit = true; break;
        }
      }
      if (!hit) break;
    }
    st.stack.pop(); return [v, ex];
  }
  try {
    const [v, ex] = expr();
    skip();
    if (st.pos < inp.length) emit("parse: maradék bemenet → hiba: Unexpected trailing input", RD_LN.trail, null, "Unexpected trailing input");
    else emit("skip_whitespace, a bemenet üres → eredmény: " + rdFmt(v) + "   (fa: " + ex + ")", RD_LN.ret, rdFmt(v));
  } catch (e) { if (e !== ERR) throw e; }
  return st.steps;
}

function render(s){
  const n = s.inp.length, cw = Math.min(34, 520 / Math.max(n, 1));
  const H = 120 + 44 * Math.max(s.stack.length, 1) + 60;
  svg.setAttribute("viewBox", "0 0 560 " + H);
  svg.innerHTML = "";
  const x0 = (560 - cw * n) / 2;
  for (let i = 0; i < n; i++) {
    const used = i < s.pos;
    el("rect", {x: x0 + i * cw, y: 10, width: cw, height: 32, fill: used ? css("--cellhl") : css("--cell"),
      stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": used ? "3 2" : ""});
    el("text", {x: x0 + i * cw + cw / 2, y: 32, "text-anchor": "middle", "font-size": 16,
      fill: used || s.inp[i] === " " ? css("--muted") : css("--fg"),
      style: "font-family:ui-monospace,monospace"}, s.inp[i] === " " ? "␣" : s.inp[i]);
  }
  const cx = x0 + s.pos * cw;
  el("line", {x1: cx, y1: 70, x2: cx, y2: 46, stroke: css("--hl"), "stroke-width": 3});
  el("polygon", {points: `${cx - 6},52 ${cx + 6},52 ${cx},43`, fill: css("--hl")});
  el("text", {x: cx, y: 86, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "kurzor (pos = " + s.pos + ")");
  const yb = H - 40;
  s.stack.forEach((f, k) => {
    const act = k === s.stack.length - 1, y = yb - 44 * (k + 1);
    el("rect", {x: 60, y: y, width: 440, height: 38, rx: 4, fill: css("--cell"), stroke: act ? css("--hl") : css("--line"),
      "stroke-width": act ? 3.5 : 1.2});
    el("text", {x: 72, y: y + 24, "font-size": 15, "font-weight": act ? "bold" : "normal"}, f.fn + (f.v !== "" ? "   value = " + f.v : ""));
    if (f.ex && f.fn !== "parse_number") el("text", {x: 490, y: y + 24, "text-anchor": "end", "font-size": 13, fill: css("--muted")}, "≡ " + f.ex);
  });
  const res = s.err ? "hiba: " + s.err : (s.res !== null ? "eredmény: " + s.res : "");
  if (res) el("text", {x: 280, y: H - 12, "text-anchor": "middle", "font-size": 16, "font-weight": "bold",
    fill: s.err ? "#c00000" : css("--fg")}, res);
  el("text", {x: 280, y: yb + 16, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "hívásverem (alul a legkülső)");
}
const inpSel = document.getElementById("inpsel"), own = document.getElementById("own");
inpSel.addEventListener("change", () => { own.value = inpSel.value; setSteps(rdTrace(inpSel.value)); });
document.getElementById("go").addEventListener("click", () => setSteps(rdTrace(own.value)));
own.addEventListener("keydown", e => { if (e.key === "Enter") setSteps(rdTrace(own.value)); e.stopPropagation(); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
