<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fold-formák kifejezésfája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forma: <select id="fform"><option value="ul">(... op args)</option><option value="ur">(args op ...)</option>
<option value="bl">(0 op ... op args)</option><option value="br">(args op ... op 0)</option></select></label>
<label>Operátor: <select id="fop"><option value="-">-</option><option value="+">+</option><option value=",">, (kiírás)</option></select></label>
<label>Csomag: <input id="fpack" value="10, 3, 2" size="12" aria-label="Csomag elemei vesszővel"></label>
<button id="fadd" type="button">+ elem</button><button id="fdel" type="button">− utolsó</button>
<script>
function fread(){const t=document.getElementById("fpack").value.trim(); if(!t) return [];
  return t.split(",").map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));}
function frun(){setSteps(fsteps(document.getElementById("fform").value,document.getElementById("fop").value,fread()));}
["fform","fop","fpack"].forEach(id=>document.getElementById(id).addEventListener("change",frun));
document.getElementById("fadd").addEventListener("click",()=>{const p=fread(); p.push(p.length?p[p.length-1]-1:1);
  document.getElementById("fpack").value=p.join(", "); frun();});
document.getElementById("fdel").addEventListener("click",()=>{const p=fread(); p.pop();
  document.getElementById("fpack").value=p.join(", "); frun();});
</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A négy fold-forma kifejezésfája a 10, 3, 2 csomagra kivonással: a unary left fold eredménye 5, a unary right 9, a binary left nulla kezdőértékkel −15, a binary right 9."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A zárójelezés a fold szabálya; az operandusok kiértékelési sorrendje csak beépített ',', '&&', '||' esetén rögzített. Üres csomag: unary '-'/'+' fold ill-formed, ',' fold értéke void(), binary fold eredménye az init. A kezdőállapot a g++ 15.2 futtatással egyezik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "A fa a zárójelezést mutatja; Lépés ▶ alulról kiértékeli a belső csúcsokat.", "line": 0, "nodes": [{"k": "pack", "v": 10, "x": 0, "d": 2}, {"k": "pack", "v": 3, "x": 1, "d": 2}, {"k": "pack", "v": 2, "x": 2, "d": 1}, {"k": "op", "l": 0, "r": 1, "x": 0.5, "d": 1}, {"k": "op", "l": 3, "r": 2, "x": 1.25, "d": 0}], "root": 4, "vals": {}}, {"msg": "10 - 3 = 7", "line": 0, "nodes": [{"k": "pack", "v": 10, "x": 0, "d": 2}, {"k": "pack", "v": 3, "x": 1, "d": 2}, {"k": "pack", "v": 2, "x": 2, "d": 1}, {"k": "op", "l": 0, "r": 1, "x": 0.5, "d": 1}, {"k": "op", "l": 3, "r": 2, "x": 1.25, "d": 0}], "root": 4, "vals": {"3": 7}}, {"msg": "7 - 2 = 5   (gyökér: az eredmény 5)", "line": 0, "nodes": [{"k": "pack", "v": 10, "x": 0, "d": 2}, {"k": "pack", "v": 3, "x": 1, "d": 2}, {"k": "pack", "v": 2, "x": 2, "d": 1}, {"k": "op", "l": 0, "r": 1, "x": 0.5, "d": 1}, {"k": "op", "l": 3, "r": 2, "x": 1.25, "d": 0}], "root": 4, "vals": {"3": 7, "4": 5}}];
const CODE = ["(... - args)        // unary left:   ((a1 - a2) - a3)", "(args - ...)        // unary right:  a1 - (a2 - a3)", "(0 - ... - args)    // binary left:  ((0 - a1) - a2) - a3", "(args - ... - 0)    // binary right: a1 - (a2 - (a3 - 0))"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fbuild(form, pack){
  const nodes=[]; const leaf=(k,v)=>{nodes.push({k:k,v:v});return nodes.length-1;};
  const op=(l,r)=>{nodes.push({k:"op",l:l,r:r});return nodes.length-1;};
  let seq=pack.map(v=>leaf("pack",v));
  if(form==="bl"||form==="br"){const i=leaf("init",0); seq = form==="bl" ? [i].concat(seq) : seq.concat([i]);}
  if(!seq.length) return {nodes:nodes,root:-1};
  let t;
  if(form==="ul"||form==="bl"){t=seq[0]; for(let j=1;j<seq.length;j++) t=op(t,seq[j]);}
  else {t=seq[seq.length-1]; for(let j=seq.length-2;j>=0;j--) t=op(seq[j],t);}
  return {nodes:nodes,root:t};
}
function fnum(v){return String(v).replace("-","−");}
function fsteps(form, o, pack){
  const line=["ul","ur","bl","br"].indexOf(form);
  const B=fbuild(form,pack);
  if(B.root<0){
    let m;
    if(o===",") m="üres csomag: a ',' fold értéke void()";
    else if(form==="ul"||form==="ur") m="ill-formed: üres unary fold (csak &&, || és , engedi meg)";
    else m="";
    return [{msg:m,line:line,nodes:[],root:-1,vals:{}}];
  }
  const nodes=B.nodes; let cnt=0;
  (function walk(i,d){const n=nodes[i]; if(n.k!=="op"){n.x=cnt++;n.d=d;} else {walk(n.l,d+1);walk(n.r,d+1);n.x=(nodes[n.l].x+nodes[n.r].x)/2;n.d=d;}})(B.root,0);
  const val={}; nodes.forEach((n,i)=>{if(n.k!=="op")val[i]=n.v;});
  const order=[]; (function po(i){const n=nodes[i]; if(n.k==="op"){po(n.l);po(n.r);order.push(i);}})(B.root);
  const out=[{msg:"A fa a zárójelezést mutatja; Lépés ▶ alulról kiértékeli a belső csúcsokat.",line:line,nodes:nodes,root:B.root,vals:{}}];
  let vals={};
  order.forEach(i=>{const a=val[nodes[i].l], b=val[nodes[i].r];
    const v = o==="-" ? a-b : (o==="+" ? a+b : b); val[i]=v; vals=Object.assign({},vals); vals[String(i)]=v;
    const t = o===","? `${fnum(a)} , ${fnum(b)} → ${fnum(v)}` : `${fnum(a)} ${o} ${fnum(b)} = ${fnum(v)}`;
    out.push({msg:t+(i===B.root?`   (gyökér: az eredmény ${fnum(v)})`:""),line:line,nodes:nodes,root:B.root,vals:vals});});
  return out;
}

function render(s){
  svg.innerHTML="";
  const fg=css("--fg"), hl=css("--hl");
  if(s.root<0){svg.setAttribute("viewBox","0 0 560 120");
    el("text",{x:280,y:64,"text-anchor":"middle","font-size":18,"font-weight":"bold"},s.msg||"üres csomag, binary fold: az eredmény az init (0)");return;}
  const nl=s.nodes.filter(n=>n.k!=="op").length, maxd=Math.max(...s.nodes.map(n=>n.d));
  const DX=86, DY=64, R=22, W=Math.max(560,(nl-1)*DX+160), H=70+maxd*DY+50;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const x0=W/2-(nl-1)*DX/2, P=n=>[x0+n.x*DX, 50+n.d*DY];
  const last = Object.keys(s.vals).length ? Object.keys(s.vals).map(Number).pop() : -1;
  s.nodes.forEach(n=>{ if(n.k==="op"){ const [x1,y1]=P(n); [n.l,n.r].forEach(c=>{const [x2,y2]=P(s.nodes[c]);
      el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:fg,"stroke-width":1.4});}); }});
  s.nodes.forEach((n,i)=>{ const [x,y]=P(n);
    if(n.k==="op"){ const done=(String(i) in s.vals);
      el("circle",{cx:x,cy:y,r:R,fill:done?css("--cellhl"):css("--cell"),stroke:i===last?hl:fg,"stroke-width":i===last?3.5:1.4});
      el("text",{x:x,y:y+6,"text-anchor":"middle","font-size":18},document.getElementById("fop").value);
      if(done) el("text",{x:x+R+6,y:y-14,"font-size":16,"font-weight":i===s.root?"bold":"normal"},"= "+fnum(s.vals[String(i)]));
    } else if(n.k==="pack"){
      el("circle",{cx:x,cy:y,r:R,fill:css("--cell"),stroke:fg,"stroke-width":1.4});
      el("text",{x:x,y:y+6,"text-anchor":"middle","font-size":17},fnum(n.v));
    } else {
      el("rect",{x:x-R,y:y-R,width:2*R,height:2*R,fill:css("--cell"),stroke:fg,"stroke-width":2.6});
      el("text",{x:x,y:y+6,"text-anchor":"middle","font-size":17},fnum(n.v));
    }});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
