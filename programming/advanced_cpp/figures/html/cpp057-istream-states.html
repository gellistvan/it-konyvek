<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>istream_iterator olvasási lépései</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bemenet: <input id="inp" value="1 2 abc 3" size="18" aria-label="Bemeneti szöveg"></label><label><input id="vw" type="checkbox"> istream_view mód</label><button onclick="load()">Betöltés</button><button onclick="document.getElementById('inp').value='1 2 3';load()">Példa: „1 2 3”</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az iterátor a konstruktorban és minden léptetéskor olvas; az abc-nél a failbit beáll, az eofbit nem, a 3 olvasatlan marad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">std::istringstream, operator>>(int), libstdc++ (g++ 15.2): a lépések a helyben futtatott naplóval egyeznek (figures/data/cpp057_istream_states_calc.*). A copy ciklusa kiírva: for (; first != last; ++first) *out = *first.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"s": "1 2 abc 3", "op": "ctor", "line": 1, "pos": 1, "val": 1, "tok": [0, 1], "fail": false, "eof": false, "end": false, "nums": [], "msg": "istream_iterator<int>(input): a konstruktor olvas: 1; pozíció 1"}, {"s": "1 2 abc 3", "op": "deref", "line": 2, "pos": 1, "val": 1, "tok": [0, 1], "fail": false, "eof": false, "end": false, "nums": [1], "msg": "*it = 1 → push_back; a dereferálás NEM olvas"}, {"s": "1 2 abc 3", "op": "incr", "line": 3, "pos": 3, "val": 2, "tok": [2, 3], "fail": false, "eof": false, "end": false, "nums": [1], "msg": "++it olvas: 2; pozíció 3"}, {"s": "1 2 abc 3", "op": "deref", "line": 2, "pos": 3, "val": 2, "tok": [2, 3], "fail": false, "eof": false, "end": false, "nums": [1, 2], "msg": "*it = 2 → push_back; a dereferálás NEM olvas"}, {"s": "1 2 abc 3", "op": "incr", "line": 3, "pos": 4, "val": null, "tok": null, "fail": true, "eof": false, "end": true, "nums": [1, 2], "msg": "++it olvas: sikertelen → failbit = 1, eofbit = 0; it == end-of-stream"}, {"s": "1 2 abc 3", "op": "done", "line": 4, "pos": 4, "val": null, "tok": null, "fail": true, "eof": false, "end": true, "nums": [1, 2], "msg": "copy vége: numbers = {1, 2}; fail() && !eof() = true → „Hiba a bemenetben”; olvasatlan: „abc 3”"}];
const CODE = ["auto r = std::views::istream<int>(input);     // csak istream_view módban", "std::istream_iterator<int> it(input), last;   // konstruktor: OLVAS", "for (; it != last; ++it)  numbers.push_back(*it);   // *it: nem olvas", "                          // ++it: OLVAS; hiba → it == end-of-stream", "if (input.fail() && !input.eof()) std::cerr << \"Hiba a bemenetben\\n\";"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function readInt(s, p){
  const n = s.length;
  while (p < n && /\s/.test(s[p])) p++;
  if (p === n) return [p, null, true, true];
  let q = p; if (s[q] === "+" || s[q] === "-") q++;
  const d0 = q; while (q < n && s[q] >= "0" && s[q] <= "9") q++;
  if (q === d0) return [q, null, true, q === n];
  return [q, parseInt(s.slice(p, q), 10), false, q === n];
}
function trace(s, view){
  const st = [], nums = []; let fail = false, eof = false, p = 0, v = null, f, e, tok = null;
  const push = (op, line, msg, end) => st.push({s, op, line, pos: p, val: end ? null : v, tok, fail, eof, end, nums: nums.slice(), msg});
  if (view) push("view", 0, "views::istream<int>(input): a view létrehozása még NEM olvas (pozíció 0)", false);
  let p0 = p; [p, v, f, e] = readInt(s, p); fail = fail || f; eof = eof || e; let end = f;
  tok = end ? null : [p - String(v).length, p];
  push("ctor", view ? 0 : 1, (view ? "begin(): az ELSŐ olvasás itt történik" : "istream_iterator<int>(input): a konstruktor olvas") +
       (end ? ` – sikertelen → end-of-stream (failbit = ${+fail}, eofbit = ${+eof})` : `: ${v}; pozíció ${p}`), end);
  while (!end) {
    nums.push(v);
    push("deref", 2, `*it = ${v} → push_back; a dereferálás NEM olvas`, false);
    [p, v, f, e] = readInt(s, p); fail = fail || f; eof = eof || e; end = f;
    tok = end ? null : [p - String(v).length, p];
    push("incr", 3, "++it olvas: " + (end ? `sikertelen → failbit = 1, eofbit = ${+eof}; it == end-of-stream` : `${v}; pozíció ${p}` + (eof ? " (eofbit = 1, a szám a bemenet végéig tartott)" : "")), end);
  }
  const err = fail && !eof;
  push("done", 4, `copy vége: numbers = {${nums.join(", ")}}; fail() && !eof() = ${err} → ` + (err ? "„Hiba a bemenetben”" : "fájlvége, nincs hibaüzenet") +
       (p < s.length && s.slice(p).trim() ? `; olvasatlan: „${s.slice(p)}”` : ""), true);
  return st;
}
function load(){ setSteps(trace(document.getElementById("inp").value, document.getElementById("vw").checked)); }

function render(s){
  svg.setAttribute("viewBox", "0 0 600 230");
  svg.innerHTML = "";
  const n = s.s.length, W = Math.min(40, 560 / Math.max(n, 1)), X0 = 20, Y = 40;
  for (let i = 0; i < n; i++) {
    const tok = s.tok && i >= s.tok[0] && i < s.tok[1];
    el("rect", {x: X0 + i*W, y: Y, width: W, height: 36, fill: tok ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": tok ? 2.5 : 1});
    el("text", {x: X0 + i*W + W/2, y: Y + 24, "text-anchor": "middle", "font-size": 17, fill: s.s[i] === " " ? css("--muted") : css("--fg")}, s.s[i] === " " ? "·" : s.s[i]);
  }
  const px = X0 + Math.min(s.pos, n) * W;
  el("polygon", {points: `${px-8},${Y+56} ${px+8},${Y+56} ${px},${Y+42}`, fill: css("--hl2")});
  el("text", {x: px, y: Y + 72, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "pozíció " + s.pos);
  const cells = [["tárolt érték", s.end ? "end-of-stream" : (s.val === null ? "—" : String(s.val))], ["failbit", s.fail ? "1" : "0"], ["eofbit", s.eof ? "1" : "0"], ["numbers", "{" + s.nums.join(", ") + "}"]];
  cells.forEach((c, i) => {
    el("text", {x: 20 + i * 145, y: 160, "font-size": 12, fill: css("--muted")}, c[0]);
    el("text", {x: 20 + i * 145, y: 184, "font-size": 18, "font-weight": (c[0].endsWith("bit") && c[1] === "1") ? "bold" : "normal"}, c[1]);
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
