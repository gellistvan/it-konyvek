<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AoS és SoA cache-vonalak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>részecskék: <input id="nn" type="range" min="1" max="32" value="8" oninput="reload()" aria-label="Részecskeszám"> <span id="nnv">8</span></label><label>ciklus: <select id="md" onchange="reload()" aria-label="A ciklus által használt mezők"><option value="pos">csak pozíció (x, y, z)</option><option value="all">minden mező</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az AoS elrendezésben 8 részecske 7 vonalat foglal, ebből a pozíciófrissítés a bájtok 43%-át használja; SoA-ban 3 vonalat tölt be, mind hasznos."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: 64 bájtos vonal, 64-gyel igazított tömbkezdet, double = 8 bájt, sizeof(Particle) = 56; a ciklus által érintett bájtok vonalai (prefetch nélkül). Statikus számolás, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdet: 8 részecske, csak pozíció (x, y, z); még nincs betöltött vonal", "line": 0, "k": 0, "n": 8, "mode": "pos"}, {"msg": "P0: kezdő ofszet 0 B (vonalon belül 0), nem lépi át a vonalhatárt · betöltve AoS: 1 vonal, SoA: 3 vonal", "line": 2, "k": 1, "n": 8, "mode": "pos"}, {"msg": "P1: kezdő ofszet 56 B (vonalon belül 56), átlépi a vonalhatárt · betöltve AoS: 2 vonal, SoA: 3 vonal", "line": 2, "k": 2, "n": 8, "mode": "pos"}, {"msg": "P2: kezdő ofszet 112 B (vonalon belül 48), átlépi a vonalhatárt · betöltve AoS: 3 vonal, SoA: 3 vonal", "line": 2, "k": 3, "n": 8, "mode": "pos"}, {"msg": "P3: kezdő ofszet 168 B (vonalon belül 40), átlépi a vonalhatárt · betöltve AoS: 3 vonal, SoA: 3 vonal", "line": 2, "k": 4, "n": 8, "mode": "pos"}, {"msg": "P4: kezdő ofszet 224 B (vonalon belül 32), átlépi a vonalhatárt · betöltve AoS: 4 vonal, SoA: 3 vonal", "line": 2, "k": 5, "n": 8, "mode": "pos"}, {"msg": "P5: kezdő ofszet 280 B (vonalon belül 24), átlépi a vonalhatárt · betöltve AoS: 5 vonal, SoA: 3 vonal", "line": 2, "k": 6, "n": 8, "mode": "pos"}, {"msg": "P6: kezdő ofszet 336 B (vonalon belül 16), átlépi a vonalhatárt · betöltve AoS: 6 vonal, SoA: 3 vonal", "line": 2, "k": 7, "n": 8, "mode": "pos"}, {"msg": "Vége (8 részecske): AoS 7 vonal, hasznos 192/448 B = 43% · SoA 3 vonal, 192/192 B = 100% · átlépő részecske: 6", "line": 2, "k": 8, "n": 8, "mode": "pos"}];
const CODE = ["// AoS: for (auto& p : ps) ...       SoA: for (size_t i = 0; i < n; ++i) ...", "for (size_t i = 0; i < n; ++i) {", "    x[i] += ...; y[i] += ...; z[i] += ...;        // csak pozíció: 3 mező", "    /* + vx, vy, vz, mass */                      // minden mező: 7 mező", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

document.head.insertAdjacentHTML("beforeend","<style>.ctl label{display:inline-flex;align-items:center;gap:5px} select,input{font:inherit}</style>");
const LINE=64, SZ=56, FIELDS=["x","y","z","vx","vy","vz","mass"];
let NN=8, MODE="pos";
function model(n, mode){
  const used = mode==="pos"?3:7; const aos=new Set();
  for(let i=0;i<n;i++){const a=SZ*i; for(let l=Math.floor(a/LINE); l<=Math.floor((a+8*used-1)/LINE); l++) aos.add(l);}
  const per=Math.ceil(8*n/LINE), soa=used*per, useful=8*used*n;
  const cross=[]; for(let i=0;i<n;i++) if((SZ*i)%LINE+SZ>LINE) cross.push(i);
  return {aos:aos.size, soa, useful, aosPct:Math.round(100*useful/(aos.size*LINE)), soaPct:Math.round(100*useful/(soa*LINE)), cross, used};
}
function mkSteps(n, mode){
  const st=[], used=mode==="pos"?3:7;
  for(let k=0;k<=n;k++){
    const m=model(k,mode), M=model(n,mode);
    let msg;
    if(k===0) msg=`Kezdet: ${n} részecske, ${mode==="pos"?"csak pozíció (x, y, z)":"minden mező"}; még nincs betöltött vonal`;
    else { const a=SZ*(k-1), off=a%LINE;
      msg=`P${k-1}: kezdő ofszet ${a} B (vonalon belül ${off}), ${off+SZ>LINE?"átlépi":"nem lépi át"} a vonalhatárt · betöltve AoS: ${m.aos} vonal, SoA: ${m.soa} vonal`;
      if(k===n) msg=`Vége (${n} részecske): AoS ${M.aos} vonal, hasznos ${M.useful}/${M.aos*LINE} B = ${M.aosPct}% · SoA ${M.soa} vonal, ${M.useful}/${M.soa*LINE} B = ${M.soaPct}% · átlépő részecske: ${M.cross.length}`;}
    st.push({msg, line: k===0?0:(mode==="pos"?2:3), k, n, mode});
  }
  return st;
}
function render(s){
  svg.innerHTML="";
  const n=s.n, k=s.k, mode=s.mode, used=mode==="pos"?3:7;
  const nl=Math.ceil(SZ*n/LINE), u=Math.min(2, 880/(nl*LINE)), X0=70, YA=60, YS=200;
  svg.setAttribute("viewBox","0 0 988 330");
  const fg=css("--fg"), g1=css("--cellhl"), cell=css("--cell");
  const defs=el("defs",{}); defs.innerHTML=`<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern>`;
  // betöltött vonalak eddig
  const loaded=new Set(); for(let i=0;i<k;i++){const a=SZ*i; for(let l=Math.floor(a/LINE); l<=Math.floor((a+8*used-1)/LINE); l++) loaded.add(l);}
  el("text",{x:0,y:20,"font-size":18,"font-weight":"bold"},`AoS: ${n} × 56 B = ${SZ*n} B = ${nl} vonal (érintett eddig: ${loaded.size})`);
  for(let l=0;l<nl;l++){ if(loaded.has(l)) el("rect",{x:X0+l*LINE*u,y:YA-6,width:LINE*u,height:56,fill:g1});
    if(nl<=16 || l%2===0) el("text",{x:X0+(l+0.5)*LINE*u,y:YA+70,"text-anchor":"middle","font-size":nl<=10?16:12,fill:css("--muted")},nl<=10?"vonal "+l:String(l)); }
  for(let i=0;i<n;i++){
    const a=SZ*i, cr=(a%LINE)+SZ>LINE;
    for(let f=0;f<7;f++){ const on=f<used; const r=el("rect",{x:X0+(a+8*f)*u,y:YA,width:8*u,height:44,fill:on?css("--muted"):cell,stroke:css("--bg"),"stroke-width":0.6});
      if(!on) el("rect",{x:X0+(a+8*f)*u,y:YA,width:8*u,height:44,fill:"url(#hp)",opacity:0.6}); }
    const g=el("rect",{x:X0+a*u,y:YA,width:SZ*u,height:44,fill:"transparent",stroke:i===k-1?css("--hl"):fg,"stroke-width":i===k-1?4:(cr?2.6:1)});
    const t=document.createElementNS(NS,"title"); t.textContent=`P${i}: kezdő ofszet ${a} B (vonal ${Math.floor(a/LINE)}, vonalon belül ${a%LINE} B) – ${cr?"átlépi":"nem lépi át"} a vonalhatárt`; g.appendChild(t);
    if(n<=12) el("text",{x:X0+(a+28)*u,y:YA-14,"text-anchor":"middle","font-size":16},"P"+i+(cr?"*":""));
  }
  for(let l=0;l<=nl;l++) el("line",{x1:X0+l*LINE*u,y1:YA-6,x2:X0+l*LINE*u,y2:YA+52,stroke:fg,"stroke-dasharray":"6 4","stroke-width":1.2});
  el("text",{x:X0-8,y:YA+28,"text-anchor":"end","font-size":18,"font-weight":"bold"},"AoS");
  // SoA
  const per=Math.ceil(8*n/LINE), uw=Math.min(125, 880/7);
  el("text",{x:0,y:YS-22,"font-size":18,"font-weight":"bold"},`SoA: 7 tömb × ${8*n} B (${per} vonal / tömb)`);
  const done=Math.ceil(8*k/LINE);
  FIELDS.forEach((nm,f)=>{ const on=f<used, x=X0+f*uw;
    el("rect",{x:x+2,y:YS,width:uw-4,height:44,fill:on?(done>0?g1:cell):cell,stroke:fg,"stroke-width":on?2:0.8});
    if(!on) el("rect",{x:x+2,y:YS,width:uw-4,height:44,fill:"url(#hp)",opacity:0.6});
    el("text",{x:x+uw/2,y:YS+28,"text-anchor":"middle","font-size":16,"font-weight":on?"bold":"normal"},`${nm}: ${on?done:0}/${per}`);});
  el("text",{x:X0-8,y:YS+28,"text-anchor":"end","font-size":18,"font-weight":"bold"},"SoA");
  const M=model(k,mode);
  el("text",{x:0,y:YS+80,"font-size":16},`Eddig (${k} részecske): AoS ${M.aos} vonal = ${M.aos*LINE} B, ebből hasznos ${M.useful} B` + (k?` (${M.aosPct}%)`:"") + ` · SoA ${M.soa} vonal` + (k?` (${M.soaPct}%)`:""));
  el("text",{x:0,y:YS+108,"font-size":13,fill:css("--muted")},"tömör = használt mező · sraffozott = nem használt · szürke háttér = betöltött vonal · vastag keret, * = vonalhatárt átlépő részecske (hover: ofszet)");
}
function reload(){ NN=+document.getElementById("nn").value; MODE=document.getElementById("md").value;
  document.getElementById("nnv").textContent=NN; setSteps(mkSteps(NN,MODE)); show(STEPS.length-1); }
setTimeout(()=>{ const h=(location.hash||"").slice(1); if(!h){ show(STEPS.length-1); return; } const p=Object.fromEntries(h.split("&").map(x=>x.split("=")));
  if(p.n){document.getElementById("nn").value=p.n;} if(p.m){document.getElementById("md").value=p.m;} reload(); }, 0);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
