<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free list: LIFO-újrahasznosítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="bA">allocate</button>
<label>slot <select id="sK"><option>0</option><option>1</option><option>2</option><option selected>3</option></select></label>
<button id="bD">deallocate(slot k)</button><button id="bDD">dupla deallocate(slot k)</button>
<button id="bR">a 20.2.8 példa lépései</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy slot; a konstruktor után a lista slot3-tól slot0 felé halad; w1 a slot3-at, w2 a slot2-t kapja; felszabadítás után a slot3 ismét a lista elején van, és w3 újra a slot3-at kapja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">ObjectPool<Widget, 4> a 20.2.8 példából (x86-64: sizeof(Widget) = 16). A lépések a g++ 15.2 futtatással egyeznek. A saját műveletsor az aktuális lépés állapotából indul; a dupla deallocate undefined behavior, a modell csak a lista szerkezetét mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "(0) konstruktor után: free_head_ → slot3 → slot2 → slot1 → slot0 → nullptr (fordított láncolás)", "line": 2, "live": [null, null, null, null], "nxt": [-1, 0, 1, 2], "head": 3, "cnt": 0}, {"msg": "(1) w1 = make_unique(1, 1.5) → slot3; free_head_ = node->next = slot2", "line": 4, "live": [null, null, null, "w1: id=1, 1,5"], "nxt": [-1, 0, 1, null], "head": 2, "cnt": 1}, {"msg": "(2) w2 = make_unique(2, 2.5) → slot2; allocated = 2", "line": 5, "live": [null, null, "w2: id=2, 2,5", "w1: id=1, 1,5"], "nxt": [-1, 0, null, null], "head": 1, "cnt": 2}, {"msg": "(3) a blokk vége: w2 szűnik meg először (fordított deklarációs sorrend) → slot2 a lista elejére", "line": 7, "live": [null, null, null, "w1: id=1, 1,5"], "nxt": [-1, 0, 1, null], "head": 2, "cnt": 1}, {"msg": "(4) w1 megszűnik → slot3 a lista elején; allocated = 0", "line": 7, "live": [null, null, null, null], "nxt": [-1, 0, 1, 2], "head": 3, "cnt": 0}, {"msg": "(5) w3 = make_unique(3, 3.5) → ismét slot3 (LIFO: a legutóbb felszabadított slot)", "line": 4, "live": [null, null, null, "w3: id=3, 3,5"], "nxt": [-1, 0, 1, null], "head": 2, "cnt": 1}];
const CODE = ["ObjectPool() { for (auto& slot : slots_) {", "    FreeNode* node = ::new (static_cast<void*>(slot.storage)) FreeNode{free_head_};", "    free_head_ = node; } }", "T* allocate(Args&&... args) {   // if (!free_head_) throw std::bad_alloc{};", "    FreeNode* node = free_head_;  free_head_ = node->next;", "    T* p = ::new (static_cast<void*>(node)) T(std::forward<Args>(args)...);  ++allocated_count_; }", "void deallocate(T* p) {   p->~T();  --allocated_count_;", "    FreeNode* node = ::new (static_cast<void*>(p)) FreeNode{free_head_};  free_head_ = node; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function chainOf(s){ const out = []; let k = s.head; const seen = new Set();
  while (k !== -1 && k !== null && !seen.has(k)) { seen.add(k); out.push(k); k = s.nxt[k]; }
  return {out, cyc: k !== -1 && k !== null}; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 620 250");
  const fg = css("--fg"), mu = css("--muted"), red = "#c00000";
  const d = el("defs", {});
  d.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${red}"/></marker>`;
  const X = k => 150 + k * 112, Y = 70, BW = 90, BH = 64;
  for (let k = 0; k < s.live.length; k++){
    const lv = s.live[k];
    el("text", {x: X(k) + BW / 2, y: Y - 8, "text-anchor": "middle", "font-size": 13, fill: mu}, "slot" + k);
    el("rect", {x: X(k), y: Y, width: BW, height: BH, fill: lv ? css("--cellhl") : css("--cell"), stroke: fg,
      "stroke-width": lv ? 2.2 : 1.3, "stroke-dasharray": lv ? "" : "5 3"});
    if (lv) { const [nm, val] = lv.split(": ");
      el("text", {x: X(k) + BW / 2, y: Y + 26, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, nm);
      el("text", {x: X(k) + BW / 2, y: Y + 46, "text-anchor": "middle", "font-size": 12}, val); }
    else { const nx = s.nxt[k];
      el("text", {x: X(k) + BW / 2, y: Y + 26, "text-anchor": "middle", "font-size": 13}, "FreeNode");
      el("text", {x: X(k) + BW / 2, y: Y + 46, "text-anchor": "middle", "font-size": 12}, "next: " + (nx === -1 ? "nullptr" : "slot" + nx)); }
  }
  const c = chainOf(s);
  if (c.out.length){ const h = c.out[0];
    el("path", {d: `M 40 ${Y + BH + 70} Q ${X(h) - 20} ${Y + BH + 70} ${X(h) + BW / 2} ${Y + BH + 2}`, fill: "none", stroke: fg, "stroke-width": 3, "marker-end": "url(#ah)"}); }
  el("text", {x: 20, y: Y + BH + 92, "font-size": 14, "font-weight": "bold"}, "free_head_" + (c.out.length ? "" : " = nullptr"));
  const pairs = c.out.slice(1).map((b, i) => [c.out[i], b]);
  if (c.cyc) pairs.push([c.out[c.out.length - 1], s.nxt[c.out[c.out.length - 1]]]);
  pairs.forEach(([a, b], i) => {
    const bad = c.cyc && i === pairs.length - 1, x1 = X(a) + BW / 2 - 14, x2 = X(b) + BW / 2 + 14, y = Y + BH + 2;
    const dep = a === b ? 60 : 24 + 14 * Math.abs(a - b);
    const p = a === b ? `M ${x1} ${y} C ${x1 - 30} ${y + dep} ${x1 + 58} ${y + dep} ${x1 + 28} ${y + 3}`
                      : `M ${x1} ${y} Q ${(x1 + x2) / 2} ${y + dep} ${x2} ${y + 3}`;
    el("path", {d: p, fill: "none", stroke: bad ? red : fg, "stroke-width": bad ? 2.4 : 1.4, "stroke-dasharray": "5 3", "marker-end": bad ? "url(#ar)" : "url(#ah)"});
  });
  el("text", {x: 600, y: 24, "text-anchor": "end", "font-size": 14}, `allocated_count_ = ${s.cnt}`);
  if (c.cyc) el("text", {x: 20, y: 24, "font-size": 15, "font-weight": "bold", fill: red}, "UB: dupla felszabadítás – ciklus a free listben");
  else el("text", {x: 20, y: 24, "font-size": 13, fill: mu}, "lista: free_head_ → " + c.out.map(k => "slot" + k).concat(["nullptr"]).join(" → "));
}
// ---- saját műveletsor (a fejezet kódjának átirata) ----
let PL_ = null, NW_ = 0, LAST_ = -1;
function plStart(){ if (!PL_) { const s = STEPS[pos.value | 0]; PL_ = {live: s.live.slice(), nxt: s.nxt.slice(), head: s.head, cnt: s.cnt, hist: [s]}; NW_ = 3; } }
function plPush(msg, line){ const s = {msg, line, live: PL_.live.slice(), nxt: PL_.nxt.slice(), head: PL_.head, cnt: PL_.cnt};
  PL_.hist.push(s); setSteps(PL_.hist.slice()); show(PL_.hist.length - 1); }
document.getElementById("bA").addEventListener("click", () => { plStart();
  if (PL_.head === -1) { plPush("allocate: free_head_ == nullptr → throw std::bad_alloc", 3); return; }
  const k = PL_.head; NW_ += 1; PL_.head = PL_.nxt[k]; PL_.nxt[k] = null;
  const again = PL_.live[k] !== null; PL_.live[k] = `w${NW_}: id=${NW_}`; PL_.cnt += 1;
  plPush(`allocate → slot${k}` + (again ? " – UB: ez a slot már egy élő objektumé (a ciklus miatt kétszer kiadva)" : ""), 4); });
document.getElementById("bD").addEventListener("click", () => { plStart();
  const k = parseInt(document.getElementById("sK").value, 10);
  if (PL_.live[k] === null) { status.textContent = `slot${k} szabad: a rendes deallocate-hoz élő objektum kell (dupla felszabadításhoz a másik gomb).`; return; }
  PL_.live[k] = null; PL_.cnt -= 1; PL_.nxt[k] = PL_.head; PL_.head = k; LAST_ = k;
  plPush(`deallocate(slot${k}): p->~T(), FreeNode{free_head_} → slot${k} a lista elejére`, 7); });
document.getElementById("bDD").addEventListener("click", () => { plStart();
  const k = parseInt(document.getElementById("sK").value, 10);
  if (PL_.live[k] !== null) { status.textContent = `slot${k} élő: előbb a rendes deallocate kell.`; return; }
  PL_.cnt -= 1; PL_.nxt[k] = PL_.head; PL_.head = k;
  plPush(`dupla deallocate(slot${k}): a már szabad slotot újra a lista elejére fűzi – UB (20.2.6.1), a lista ciklust tartalmaz`, 7); });
document.getElementById("bR").addEventListener("click", () => { PL_ = null; setSteps(DEMO_); });
const DEMO_ = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
