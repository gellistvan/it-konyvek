<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erase-remove idióma</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>v: <input id="inp" value="1, 2, 3, 2, 4, 2, 5" size="20" aria-label="Bemeneti vektor"></label><label>érték: <input id="val" value="2" size="3" aria-label="Eltávolítandó érték"></label><label><input id="one" type="checkbox"> std::erase (C++20)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A hételemű vektorból a remove a négy megtartott elemet előre írja és new_end-et adja; a méret 7 marad, a farok meghatározatlan; az erase után a vektor 1 3 4 5."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A farok [new_end, end) értéke nem specifikált; a látható 4 2 5 a libstdc++ (g++ 15.2) futtatott állapota (implementációfüggő). C++20-tól std::erase(v, 2) egy lépésben.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"v": [1, 2, 3, 2, 4, 2, 5], "r": null, "w": 0, "act": "", "skip": [], "size": 7, "ne": null, "line": 0, "msg": "Kezdet: v = {1, 2, 3, 2, 4, 2, 5}, eltávolítandó: 2; w = 0, size() = 7"}, {"v": [1, 2, 3, 2, 4, 2, 5], "r": 0, "w": 1, "act": "keep", "wr": 0, "skip": [], "size": 7, "ne": null, "line": 4, "msg": "r = 0: v[0] = 1 megtartva → w == r, nincs értékadás; w = 1"}, {"v": [1, 2, 3, 2, 4, 2, 5], "r": 1, "w": 1, "act": "skip", "skip": [1], "size": 7, "ne": null, "line": 5, "msg": "r = 1: v[1] = 2 == 2 → kihagyva; w = 1 marad"}, {"v": [1, 3, 3, 2, 4, 2, 5], "r": 2, "w": 2, "act": "move", "wr": 1, "skip": [1], "size": 7, "ne": null, "line": 3, "msg": "r = 2: v[2] = 3 megtartva → v[1] = std::move(v[2]) = 3; w = 2"}, {"v": [1, 3, 3, 2, 4, 2, 5], "r": 3, "w": 2, "act": "skip", "skip": [1, 3], "size": 7, "ne": null, "line": 5, "msg": "r = 3: v[3] = 2 == 2 → kihagyva; w = 2 marad"}, {"v": [1, 3, 4, 2, 4, 2, 5], "r": 4, "w": 3, "act": "move", "wr": 2, "skip": [1, 3], "size": 7, "ne": null, "line": 3, "msg": "r = 4: v[4] = 4 megtartva → v[2] = std::move(v[4]) = 4; w = 3"}, {"v": [1, 3, 4, 2, 4, 2, 5], "r": 5, "w": 3, "act": "skip", "skip": [1, 3, 5], "size": 7, "ne": null, "line": 5, "msg": "r = 5: v[5] = 2 == 2 → kihagyva; w = 3 marad"}, {"v": [1, 3, 4, 5, 4, 2, 5], "r": 6, "w": 4, "act": "move", "wr": 3, "skip": [1, 3, 5], "size": 7, "ne": null, "line": 3, "msg": "r = 6: v[6] = 5 megtartva → v[3] = std::move(v[6]) = 5; w = 4"}, {"v": [1, 3, 4, 5, 4, 2, 5], "r": null, "w": 4, "act": "ret", "skip": [1, 3, 5], "size": 7, "ne": 4, "line": 6, "msg": "remove vége: new_end = begin + 4, size() = 7 (változatlan); a [4, 7) farok meghatározatlan – itt (libstdc++): 4 2 5"}, {"v": [1, 3, 4, 5], "r": null, "w": 4, "act": "erase", "skip": [], "size": 4, "ne": 4, "line": 7, "msg": "v.erase(new_end, v.end()) → v = {1, 3, 4, 5}, size() = 4"}];
const CODE = ["auto w = first;                                  // író pozíció", "for (auto r = first; r != last; ++r)            // olvasó pozíció", "    if (!(*r == value)) {                       // megtartjuk", "        if (w != r) *w = std::move(*r);         // mozgató értékadás előre", "        ++w;", "    }                                           // különben: kihagyjuk", "return w;                                       // new_end", "v.erase(new_end, v.end());                      // a farok levágása"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function trace(v0, val, one){
  const v = v0.slice(), st = [];
  st.push({v: v.slice(), r: null, w: 0, act: "", skip: [], size: v.length, ne: null, line: one ? -1 : 0,
           msg: `Kezdet: v = {${v.join(", ")}}, eltávolítandó: ${val}; w = 0, size() = ${v.length}`});
  if (one) {
    const v2 = v.filter(x => x !== val);
    st.push({v: v2, r: null, w: v2.length, act: "erase", skip: [], size: v2.length, ne: v2.length, line: -1,
             msg: `std::erase(v, ${val}) (C++20): egy lépésben → v = {${v2.join(", ")}}, size() = ${v2.length}; visszatérési érték: ${v.length - v2.length} (törölt elemek)`});
    return st;
  }
  const skipped = []; let w = 0;
  for (let r = 0; r < v.length; r++) {
    if (v[r] === val) { skipped.push(r);
      st.push({v: v.slice(), r, w, act: "skip", skip: skipped.slice(), size: v.length, ne: null, line: 5, msg: `r = ${r}: v[${r}] = ${v[r]} == ${val} → kihagyva; w = ${w} marad`});
    } else { const moved = w !== r; if (moved) v[w] = v[r];
      st.push({v: v.slice(), r, w: w + 1, act: moved ? "move" : "keep", wr: w, skip: skipped.slice(), size: v.length, ne: null, line: moved ? 3 : 4,
               msg: `r = ${r}: v[${r}] = ${v[r]} megtartva → ` + (moved ? `v[${w}] = std::move(v[${r}]) = ${v[w]}; ` : "w == r, nincs értékadás; ") + `w = ${w + 1}`});
      w++; }
  }
  st.push({v: v.slice(), r: null, w, act: "ret", skip: skipped.slice(), size: v.length, ne: w, line: 6,
           msg: `remove vége: new_end = begin + ${w}, size() = ${v.length} (változatlan); a [${w}, ${v.length}) farok meghatározatlan – ebben a modellben: ${v.slice(w).join(" ") || "üres"}`});
  const v2 = v.slice(0, w);
  st.push({v: v2, r: null, w, act: "erase", skip: [], size: v2.length, ne: w, line: 7, msg: `v.erase(new_end, v.end()) → v = {${v2.join(", ")}}, size() = ${v2.length}`});
  return st;
}
function load(){
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const val = Number(document.getElementById("val").value), err = document.getElementById("err");
  if (!a.length || a.length > 12 || a.some(x => !Number.isInteger(x)) || !Number.isInteger(val)) { err.textContent = "1–12 egész számot és egész eltávolítandó értéket adjon meg."; return; }
  err.textContent = ""; setSteps(trace(a, val, document.getElementById("one").checked));
}

function render(s){
  svg.setAttribute("viewBox", "0 0 600 175");
  svg.innerHTML = "";
  const n = Math.max(s.v.length, 1), W = Math.min(64, 520 / n), X0 = 40, Y = 52;
  s.v.forEach((x, i) => {
    const tail = s.act === "ret" && i >= s.ne, skip = s.skip.includes(i) && i >= s.w && s.act !== "ret",
          done = s.act !== "" && s.act !== "erase" && i < s.w && !tail, cur = (s.act === "move" && i === s.wr);
    el("rect", {x: X0 + i*W, y: Y, width: W, height: 48, fill: cur ? css("--hl") : (tail ? css("--cellhl") : (done ? css("--cellhl") : css("--cell"))),
      stroke: css("--line"), "stroke-dasharray": tail ? "4 3" : "", "stroke-width": cur ? 3 : 1.2});
    el("text", {x: X0 + i*W + W/2, y: Y + 31, "text-anchor": "middle", "font-size": 20, fill: cur ? "#fff" : css("--fg")}, String(x).replace("-", "−"));
    el("text", {x: X0 + i*W + W/2, y: Y + 64, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    if (skip) el("line", {x1: X0 + i*W + 8, y1: Y + 42, x2: X0 + i*W + W - 8, y2: Y + 6, stroke: css("--line"), "stroke-width": 2});
  });
  if (s.r !== null) { const x = X0 + s.r * W + W/2; el("polygon", {points: `${x-8},${Y-22} ${x+8},${Y-22} ${x},${Y-8}`, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.5}); el("text", {x: x + 11, y: Y - 11, "font-size": 13}, "r"); }
  if (["skip", "move", "keep", "ret"].includes(s.act)) { const x = X0 + s.w * W; el("polygon", {points: `${x-8},${Y+92} ${x+8},${Y+92} ${x},${Y+78}`, fill: css("--hl2")});
    el("text", {x: x + 11, y: Y + 92, "font-size": 13, fill: css("--hl2")}, s.act === "ret" ? "w = new_end" : "w"); }
  if (s.act === "move") { const a = X0 + s.r * W + W/2, b = X0 + s.wr * W + W/2; el("path", {d: `M ${a} ${Y - 2} Q ${(a+b)/2} ${Y - 45} ${b} ${Y - 2}`, fill: "none", stroke: css("--hl"), "stroke-width": 2.5}); }
  el("text", {x: 40, y: 168, "font-size": 14}, `size() = ${s.size}` + (s.ne !== null ? ` · new_end − begin = ${s.ne}` : ""));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
