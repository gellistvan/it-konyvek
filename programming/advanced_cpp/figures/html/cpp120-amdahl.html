<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amdahl-törvény</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

.pt{cursor:crosshair}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
 <label>soros hányad s: <input id="s" type="range" min="0" max="20" step="0.5" value="5" aria-label="soros hányad százalékban"> <span id="sv">5,0%</span></label>
 <label>p max: <select id="pmax"><option value="16">16</option><option value="64">64</option><option value="128" selected>128</option><option value="1024">1024</option></select></label>
 <label><input type="checkbox" id="cmp" checked> összevetés: s = 2% és 5%</label>
</div>
<div class="ctl">
 <label>saját mért gyorsulások (p:S párok): <input id="meas" type="text" size="28" placeholder="pl. 2:1.9 4:3.4 8:5.1"></label>
 <button id="apply" type="button">Rajzol</button>
 <label>p kiválasztása: <input id="pp" type="range" min="0" max="7" value="4" aria-label="kiválasztott szálszám"></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 420" role="img" aria-label="Amdahl-görbe: gyorsulás a szálszám függvényében, log-log skálán, az ideális egyenessel és a soros hányad szerinti határral"></svg>
<p class="small">S(p) = 1 / (s + (1 − s)/p); határérték p → ∞ esetén 1/s. Elméleti görbe, nem mérés; a memória-sávszélesség miatti telítődést nem tartalmazza. A saját mért pontok csak a böngészőben jelennek meg. Az egérrel a görbe fölött mozogva is kiválasztható p.</p>
<script>
const svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(t,a,x){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
function hu(v,d){return v.toFixed(d).replace(".",",");}
function S(p,s){return 1/(s+(1-s)/p);}
let meas=[], psel=16;
const L=70,R=610,T=20,B=370;
function draw(){
  const s=+document.getElementById("s").value/100, pmax=+document.getElementById("pmax").value;
  document.getElementById("sv").textContent=hu(s*100,1)+"%";
  const pp=document.getElementById("pp"); const kmax=Math.round(Math.log2(pmax)); pp.max=kmax;
  if(+pp.value>kmax) pp.value=kmax; psel=Math.pow(2,+pp.value);
  svg.innerHTML="";
  const lx=p=>L+(R-L)*Math.log2(p)/Math.log2(pmax), ly=v=>B-(B-T)*Math.log2(v)/Math.log2(pmax);
  el("defs",{}).innerHTML=`<marker id="tri" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"><path d="M5 0L10 9H0z" fill="${css('--hl2')}"/></marker><marker id="sq" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><rect x="1" y="1" width="8" height="8" fill="${css('--bg')}" stroke="${css('--hl')}" stroke-width="2"/></marker>`;
  for(let k=0;k<=kmax;k++){const p=Math.pow(2,k);
    el("line",{x1:lx(p),x2:lx(p),y1:T,y2:B,stroke:css("--muted"),"stroke-dasharray":"1 3"});
    el("line",{x1:L,x2:R,y1:ly(p),y2:ly(p),stroke:css("--muted"),"stroke-dasharray":"1 3"});
    if(kmax<=8||k%2==0){el("text",{x:lx(p),y:B+16,"text-anchor":"middle","font-size":12},String(p));
    el("text",{x:L-6,y:ly(p)+4,"text-anchor":"end","font-size":12},String(p));}}
  el("rect",{x:L,y:T,width:R-L,height:B-T,fill:"none",stroke:css("--fg")});
  el("text",{x:(L+R)/2,y:B+36,"text-anchor":"middle","font-size":13},"p (szálszám, log₂ skála)");
  el("text",{x:16,y:(T+B)/2,"text-anchor":"middle","font-size":13,transform:`rotate(-90 16 ${(T+B)/2})`},"gyorsulás S(p) (log₂ skála)");
  const P=[];for(let k=0;k<=kmax*8;k++)P.push(Math.pow(2,k/8));
  const path=f=>"M"+P.map(p=>lx(p)+" "+ly(Math.min(pmax,f(p)))).join("L");
  el("path",{d:path(p=>p),fill:"none",stroke:css("--fg"),"stroke-width":1.2});
  const curves=[[s,css("--fg"),"","3"]];
  if(document.getElementById("cmp").checked){curves.push([0.02,css("--hl"),"7 4","sq"]);curves.push([0.05,css("--hl2"),"2 3","tri"]);}
  curves.forEach(([sv,col,dash,mk],ci)=>{
    if(ci===0&&sv===0)return;
    el("path",{d:path(p=>S(p,sv)),fill:"none",stroke:col,"stroke-width":ci?1.8:2.6,"stroke-dasharray":dash});
    if(mk!=="3")for(let k=0;k<=kmax;k++){const p=Math.pow(2,k);el("path",{d:`M${lx(p)} ${ly(S(p,sv))}L${lx(p)+0.01} ${ly(S(p,sv))}`,stroke:col,"marker-start":`url(#${mk})`});}
    if(sv>0&&1/sv<=pmax){el("line",{x1:L,x2:R,y1:ly(1/sv),y2:ly(1/sv),stroke:col,"stroke-dasharray":"6 2 1 2","stroke-width":0.8});
      el("text",{x:L+6,y:ly(1/sv)-4,"font-size":12,fill:col},"1/s = "+hu(1/sv,(1/sv)%1?1:0));}
  });
  meas.forEach(([p,v])=>{if(p>=1&&p<=pmax&&v>0){el("circle",{cx:lx(p),cy:ly(Math.min(v,pmax)),r:5,fill:"none",stroke:css("--err"),"stroke-width":2});
     el("line",{x1:lx(p)-4,x2:lx(p)+4,y1:ly(Math.min(v,pmax))-4,y2:ly(Math.min(v,pmax))+4,stroke:css("--err"),"stroke-width":1.5});}});
  const v=S(psel,s);
  el("line",{x1:lx(psel),x2:lx(psel),y1:T,y2:B,stroke:css("--hl"),"stroke-width":1.5});
  el("circle",{cx:lx(psel),cy:ly(v),r:6,fill:css("--hl"),stroke:css("--bg")});
  // jelmagyarázat
  const lg=[["ideális S = p",css("--fg"),""],["aktuális s",css("--fg"),""]];
  el("text",{x:R-8,y:B-60,"text-anchor":"end","font-size":12},"vékony: ideális S = p; vastag: aktuális s");
  if(document.getElementById("cmp").checked)el("text",{x:R-8,y:B-42,"text-anchor":"end","font-size":12},"szaggatott □: s = 2%; pontozott △: s = 5%");
  if(meas.length)el("text",{x:R-8,y:B-24,"text-anchor":"end","font-size":12,fill:css("--err")},"⊗ saját mért pontok");
  let msg=`s = ${hu(s*100,1)}%, p = ${psel}: S(p) = ${hu(v,3)}, hatékonyság S(p)/p = ${hu(100*v/psel,1)}%`+(s>0?`; határ 1/s = ${hu(1/s,(1/s)%1?2:0)}`:"; s = 0: ideális, korlát nélkül");
  const m=meas.find(q=>q[0]===psel); if(m) msg+=`; mért: ${hu(m[1],2)} (a modell ${hu(100*m[1]/v,0)}%-a)`;
  document.getElementById("status").textContent=msg;
}
["s","pmax","cmp","pp"].forEach(id=>{const e=document.getElementById(id);e.addEventListener("input",draw);e.addEventListener("change",draw);});
document.getElementById("apply").onclick=()=>{meas=document.getElementById("meas").value.trim().split(/[\s;,]+/).filter(x=>x.includes(":")).map(x=>{const [a,b]=x.split(":");return [Math.round(+a),+(b.replace(",","."))];}).filter(q=>isFinite(q[0])&&isFinite(q[1]));draw();};
svg.addEventListener("mousemove",ev=>{const r=svg.getBoundingClientRect();const x=(ev.clientX-r.left)*640/r.width;const pmax=+document.getElementById("pmax").value;
  const k=Math.round(Math.log2(pmax)*(x-L)/(R-L)); const pp=document.getElementById("pp"); if(k>=0&&k<=+pp.max&&+pp.value!==k){pp.value=k;draw();}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
