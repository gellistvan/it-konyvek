<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Külső fragmentáció: 1 MiB heap</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>változat <select id="vsel"><option value="b" selected>a szöveg forgatókönyve</option>
<option value="c">+ C felszabadítása (coalescing)</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="1 MiB heap: A, B, C 256 KiB-os blokkok; B felszabadítása után két nem szomszédos 256 KiB-os szabad rés van, ezért egy 512 KiB-os kérés sikertelen."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.3.6.4 HeapSim (first-fit) futása 1 KiB-os egységekkel; a metrikák a kód free_total, largest_free, free_blocks függvényei. Fejléc nélküli, idealizált heap; mozgatás (compaction) nincs.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Üres 1 MiB-os heap (1024 KiB, egy szabad blokk)", "line": 0, "B": [{"off": 0, "size": 1024, "req": 0, "free": true, "name": ""}], "M": {"total": 1024, "largest": 1024, "count": 1}, "req": null}, {"msg": "allocate(256) → A = [0, 256) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 768, "req": 0, "free": true, "name": ""}], "M": {"total": 768, "largest": 768, "count": 1}, "req": null}, {"msg": "allocate(256) → B = [256, 512) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 512, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 512, "count": 1}, "req": null}, {"msg": "allocate(256) → C = [512, 768) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 256, "largest": 256, "count": 1}, "req": null}, {"msg": "B felszabadítása: két nem szomszédos szabad rés, összesen 512 KiB, a legnagyobb 256 KiB", "line": 2, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": null}, {"msg": "allocate(512) → npos: SIKERTELEN – van 512 KiB szabad, de nincs 512 KiB-os összefüggő blokk", "line": 4, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": {"size": 512, "ok": false}}];
const CODE = ["HeapSim h(1024, Strategy::FirstFit);          // 1 egység = 1 KiB", "auto a = h.allocate(256), b = h.allocate(256), c = h.allocate(256);", "h.deallocate(b);", "assert(h.free_total() == 512 && h.largest_free() == 256 && h.free_blocks() == 2);", "assert(h.allocate(512) == HeapSim::npos);  // külső fragmentáció", "h.deallocate(c);   // kiegészítés: coalescing → [256, 1024)", "h.allocate(512);   // most sikeres"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}
const VB_ = [{"msg": "Üres 1 MiB-os heap (1024 KiB, egy szabad blokk)", "line": 0, "B": [{"off": 0, "size": 1024, "req": 0, "free": true, "name": ""}], "M": {"total": 1024, "largest": 1024, "count": 1}, "req": null}, {"msg": "allocate(256) → A = [0, 256) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 768, "req": 0, "free": true, "name": ""}], "M": {"total": 768, "largest": 768, "count": 1}, "req": null}, {"msg": "allocate(256) → B = [256, 512) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 512, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 512, "count": 1}, "req": null}, {"msg": "allocate(256) → C = [512, 768) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 256, "largest": 256, "count": 1}, "req": null}, {"msg": "B felszabadítása: két nem szomszédos szabad rés, összesen 512 KiB, a legnagyobb 256 KiB", "line": 2, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": null}, {"msg": "allocate(512) → npos: SIKERTELEN – van 512 KiB szabad, de nincs 512 KiB-os összefüggő blokk", "line": 4, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": {"size": 512, "ok": false}}]; const VC_ = [{"msg": "Üres 1 MiB-os heap (1024 KiB, egy szabad blokk)", "line": 0, "B": [{"off": 0, "size": 1024, "req": 0, "free": true, "name": ""}], "M": {"total": 1024, "largest": 1024, "count": 1}, "req": null}, {"msg": "allocate(256) → A = [0, 256) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 768, "req": 0, "free": true, "name": ""}], "M": {"total": 768, "largest": 768, "count": 1}, "req": null}, {"msg": "allocate(256) → B = [256, 512) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 512, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 512, "count": 1}, "req": null}, {"msg": "allocate(256) → C = [512, 768) KiB", "line": 1, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 256, "free": false, "name": "B"}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 256, "largest": 256, "count": 1}, "req": null}, {"msg": "B felszabadítása: két nem szomszédos szabad rés, összesen 512 KiB, a legnagyobb 256 KiB", "line": 2, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": null}, {"msg": "allocate(512) → npos: SIKERTELEN – van 512 KiB szabad, de nincs 512 KiB-os összefüggő blokk", "line": 4, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 256, "req": 0, "free": true, "name": ""}, {"off": 512, "size": 256, "req": 256, "free": false, "name": "C"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 512, "largest": 256, "count": 2}, "req": {"size": 512, "ok": false}}, {"msg": "C felszabadítása: a coalescing összevonja a szomszédos szabad blokkokat → [256, 1024)", "line": 5, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 768, "req": 0, "free": true, "name": ""}], "M": {"total": 768, "largest": 768, "count": 1}, "req": null}, {"msg": "allocate(512) → [256, 768) KiB: SIKERES", "line": 6, "B": [{"off": 0, "size": 256, "req": 256, "free": false, "name": "A"}, {"off": 256, "size": 512, "req": 512, "free": false, "name": "512"}, {"off": 768, "size": 256, "req": 0, "free": true, "name": ""}], "M": {"total": 256, "largest": 256, "count": 1}, "req": {"size": 512, "ok": true}}];

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 640 220");
  const fg = css("--fg"), mu = css("--muted"), X0 = 30, BW = 580, sx = BW / 1024, Y = 70, H = 48;
  s.B.forEach(b => {
    el("rect", {x: X0 + b.off * sx, y: Y, width: b.size * sx, height: H, fill: b.free ? css("--cell") : css("--fg"), stroke: fg, "stroke-width": 1.2});
    el("text", {x: X0 + (b.off + b.size / 2) * sx, y: Y + H / 2 + 5, "text-anchor": "middle", "font-size": 14,
      fill: b.free ? fg : css("--bg"), "font-weight": b.free ? "normal" : "bold"}, b.free ? `szabad ${b.size} KiB` : `${b.name} (${b.size})`);
  });
  for (let v = 0; v <= 1024; v += 256) el("text", {x: X0 + v * sx, y: Y + H + 18, "text-anchor": "middle", "font-size": 12, fill: mu}, String(v));
  if (s.req){ const ok = s.req.ok, x = X0 + 256 * sx, w = 512 * sx;
    el("rect", {x, y: Y - 34, width: w, height: 26, fill: "none", stroke: ok ? fg : "#c00000", "stroke-width": 2, "stroke-dasharray": "6 4"});
    el("text", {x: x + w / 2, y: Y - 16, "text-anchor": "middle", "font-size": 13, fill: ok ? fg : "#c00000", "font-weight": "bold"},
       ok ? "512 KiB-os kérés: SIKERES" : "512 KiB-os kérés: SIKERTELEN (nincs ilyen összefüggő rés)"); }
  const m = s.M, rows = [["free_total", m.total + " KiB"], ["largest_free", m.largest + " KiB"], ["free_blocks", String(m.count)]];
  rows.forEach(([k, v], i) => { el("text", {x: X0 + i * 200, y: 180, "font-size": 14, "font-family": "ui-monospace,monospace"}, `${k} = ${v}`); });
  el("text", {x: X0, y: 206, "font-size": 12, fill: mu}, "sötét: foglalt · világos: szabad · idealizált heap, fejléc és compaction nélkül");
}
document.getElementById("vsel").addEventListener("change", e => setSteps(e.target.value === "c" ? VC_ : VB_));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
