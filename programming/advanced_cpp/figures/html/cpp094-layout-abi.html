<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padding és layoutváltozás ABI-hatása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text:not([font-family]){font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

ol#mem{margin:4px 0;padding-left:1.6em} ol#mem li{margin:2px 0} ol#mem code{display:inline-block;min-width:7em}
h3{font-size:15px;margin:10px 0 4px}
</style>
</head>
<body>
<h3>1. Tagsorrend és padding</h3>
<div class="ctl"><label>Kiindulás: <select id="preset"><option value="Layout1">Layout1</option><option value="Layout2">Layout2</option><option value="vegyes">vegyes (char, double, short, int, char)</option></select></label>
<span class="small">A ↑/↓ gombbal rendezd át a tagokat.</span></div>
<ol id="mem" aria-label="Tagok sorrendje"></ol>
<div id="status" aria-live="polite"></div>
<svg id="v1" viewBox="0 0 1000 140" role="img" aria-label="A struktúra bájttérképe: tagok szürkén, padding vonalkázva, 4 bájtos rácsvonalakkal."></svg>
<h3>2. Layoutváltozás: régi kliens, új könyvtár</h3>
<div class="ctl"><label>Könyvtár: <select id="ver"><option value="v1">v1 (name_[64])</option><option value="v2" selected>v2 (+ double scale_)</option></select></label></div>
<div id="status2" aria-live="polite"></div>
<svg id="v2" viewBox="0 0 1000 400" role="img" aria-label="A Circle és a Square objektum bájttérképe a kliens és a könyvtár nézetéből; v2-ben a 72–79 bájt ütközik (Circle) vagy a blokkon kívül esik (Square)."></svg>
<p class="small">x86-64 SysV, g++ 15.2; a layout platformfüggő. A 2. rész a ténylegesen futtatott kísérlet kimenetét mutatja; a C–D sáv nem arányos.</p>
<script>
const TYPES={"char": [1, 1], "short": [2, 2], "int": [4, 4], "double": [8, 8]};
const PRESETS={"Layout1": [["a", "char"], ["b", "int"], ["c", "char"]], "Layout2": [["b", "int"], ["a", "char"], ["c", "char"]], "vegyes": [["c1", "char"], ["d", "double"], ["s", "short"], ["i", "int"], ["c2", "char"]]};
const STATES={"v1": {"D": {"W": 1000, "H": 240, "nodes": [{"id": "Cs0", "x": 40.0, "y": 42, "w": 90.0, "h": 52, "label": "vptr", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Cs1", "x": 130.0, "y": 42, "w": 260.0, "h": 52, "label": "Shape::name_[64]", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Cs2", "x": 390.0, "y": 42, "w": 110.0, "h": 52, "label": "Circle::r_", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Ds0", "x": 40.0, "y": 158, "w": 90.0, "h": 52, "label": "vptr", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Ds1", "x": 130.0, "y": 158, "w": 260.0, "h": 52, "label": "Shape::name_[64]", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}], "edges": [], "texts": [{"x": 10, "y": 20, "s": "C  v1 – a kliens nézete: new Circle (sizeof 80; Shape = 72)", "fs": 18, "ha": "left", "bold": true}, {"x": 40.0, "y": 108, "s": "0", "fs": 18, "col": "mut"}, {"x": 130.0, "y": 108, "s": "8", "fs": 18, "col": "mut"}, {"x": 390.0, "y": 108, "s": "72", "fs": 18, "col": "mut"}, {"x": 500.0, "y": 108, "s": "80", "fs": 18, "col": "mut"}, {"x": 520, "y": 68, "s": "a kliens a v1 fejléccel\nfordult: r_ a 72-es eltoláson", "fs": 18, "ha": "left", "italic": true}, {"x": 10, "y": 136, "s": "D  v1 könyvtár: ugyanaz a nézet, nincs ütközés", "fs": 18, "ha": "left", "bold": true}, {"x": 40.0, "y": 224, "s": "0", "fs": 18, "col": "mut"}, {"x": 130.0, "y": 224, "s": "8", "fs": 18, "col": "mut"}, {"x": 390.0, "y": 224, "s": "72", "fs": 18, "col": "mut"}, {"x": 410, "y": 184, "s": "Circle: r_ = 2, area = 12,5664 (helyes)", "fs": 18, "ha": "left"}]}, "msg": "v1 könyvtár: a kliens és a könyvtár ugyanazt a 72 bájtos Shape-et látja; Circle: r_ = 2, area = 12,5664."}, "v2": {"D": {"W": 1000, "H": 374, "nodes": [{"id": "Cs0", "x": 40.0, "y": 42, "w": 90.0, "h": 52, "label": "vptr", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Cs1", "x": 130.0, "y": 42, "w": 260.0, "h": 52, "label": "Shape::name_[64]", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Cs2", "x": 390.0, "y": 42, "w": 110.0, "h": 52, "label": "Circle::r_", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Ds0", "x": 40.0, "y": 158, "w": 90.0, "h": 52, "label": "vptr", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Ds1", "x": 130.0, "y": 158, "w": 260.0, "h": 52, "label": "Shape::name_[64]", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Ds2", "x": 390.0, "y": 158, "w": 110.0, "h": 52, "label": "r_ / scale_", "shape": "rect", "fs": 18, "bg": true, "fill": "w", "hatch": "xx", "lw": 2.2}, {"id": "Qs0", "x": 40.0, "y": 282, "w": 90.0, "h": 52, "label": "vptr", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Qs1", "x": 130.0, "y": 282, "w": 260.0, "h": 52, "label": "Shape::name_[64]", "shape": "rect", "fs": 18, "bg": false, "fill": "g"}, {"id": "Qs2", "x": 390.0, "y": 282, "w": 110.0, "h": 52, "label": "scale_", "shape": "rect", "fs": 18, "bg": true, "fill": "w", "hatch": "xx", "ls": "dash", "lw": 2.2}], "edges": [], "texts": [{"x": 10, "y": 20, "s": "C  v1 – a kliens nézete: new Circle (sizeof 80; Shape = 72)", "fs": 18, "ha": "left", "bold": true}, {"x": 40.0, "y": 108, "s": "0", "fs": 18, "col": "mut"}, {"x": 130.0, "y": 108, "s": "8", "fs": 18, "col": "mut"}, {"x": 390.0, "y": 108, "s": "72", "fs": 18, "col": "mut"}, {"x": 500.0, "y": 108, "s": "80", "fs": 18, "col": "mut"}, {"x": 520, "y": 68, "s": "a kliens a v1 fejléccel\nfordult: r_ a 72-es eltoláson", "fs": 18, "ha": "left", "italic": true}, {"x": 10, "y": 136, "s": "D  v2 könyvtár nézete ugyanerre (Shape + double scale_)", "fs": 18, "ha": "left", "bold": true}, {"x": 40.0, "y": 224, "s": "0", "fs": 18, "col": "mut"}, {"x": 130.0, "y": 224, "s": "8", "fs": 18, "col": "mut"}, {"x": 390.0, "y": 224, "s": "72", "fs": 18, "col": "mut"}, {"x": 500.0, "y": 224, "s": "80", "fs": 18, "col": "mut"}, {"x": 520, "y": 184, "s": "Circle: kliens r_ ↔ könyvtár scale_ →\ncsendes felülírás: r_ = 1 (várt 2),\narea = 3,14159; ASan nem jelez", "fs": 18, "ha": "left", "col": "err"}, {"x": 10, "y": 260, "s": "   ugyanez new Square-rel (nincs saját tag, a blokk 72 bájtos)", "fs": 18, "ha": "left", "bold": true}, {"x": 40.0, "y": 348, "s": "0", "fs": 18, "col": "mut"}, {"x": 130.0, "y": 348, "s": "8", "fs": 18, "col": "mut"}, {"x": 390.0, "y": 348, "s": "72", "fs": 18, "col": "mut"}, {"x": 500.0, "y": 348, "s": "80", "fs": 18, "col": "mut"}, {"x": 520, "y": 308, "s": "72–79 a blokkon kívül → ASan:\nheap-buffer-overflow, WRITE of size 8,\n0 bytes after 72-byte region", "fs": 18, "ha": "left", "col": "err"}]}, "msg": "v2 könyvtár, régi kliens: a könyvtár a set_name-ben a 72-es eltolásra írja a scale_-t. Circle: ez a kliens r_ tagja → csendes felülírás (r_ = 1, area = 3,14159), ASan nem jelez. Square: a 72–79 bájt a 72 bájtos blokkon kívül → ASan heap-buffer-overflow."}};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a["font-family"]="ui-monospace,monospace";
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="circle"){shp="ellipse";geo={cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2};}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

let mem=PRESETS.Layout1.map(x=>x.slice());
function layout(m){let off=0,al=1;const out=[];for(const [n,t] of m){const [sz,a]=TYPES[t];off=Math.ceil(off/a)*a;out.push([n,t,off,sz]);off+=sz;al=Math.max(al,a);}
  return [out,Math.ceil(off/al)*al,al];}
function drawLayout(){
  const [lay,size,al]=layout(mem); const unit=Math.min(60,900/size); const D={W:1000,H:130,nodes:[],edges:[],texts:[]};
  let pos=0,i=0,pad=0; const segs=[];
  for(const [n,t,off,sz] of lay){if(off>pos){segs.push([pos,off,"pad","pad"]);pad+=off-pos;} segs.push([off,off+sz,n,"field"]);pos=off+sz;}
  if(size>pos){segs.push([pos,size,"pad","pad"]);pad+=size-pos;}
  const x0=40,y=30;
  D.texts.push({x:10,y:12,s:"struct S { "+mem.map(([n,t])=>t+" "+n).join("; ")+"; }   sizeof = "+size+", alignof = "+al,fs:18,ha:"left",bold:true,mono:true});
  segs.forEach(([a,b,l,k],j)=>D.nodes.push(Object.assign({id:"s"+j,x:x0+a*unit,y:y,w:(b-a)*unit,h:52,label:(b-a)*unit>=24||k==="field"?l:"",shape:"rect",fs:18,bg:k!=="field"},
     k==="field"?{fill:"g"}:{fill:"w",hatch:"//"})));
  const ticks=[...new Set([0,size,...segs.map(s=>s[0])])].sort((p,q)=>p-q);
  ticks.forEach(t=>D.texts.push({x:x0+t*unit,y:y+66,s:String(t),fs:17,col:"mut"}));
  for(let g=0;g<=size;g+=4)D.edges.push({id:"g"+g,pts:[[x0+g*unit,y-8],[x0+g*unit,y+56]],arrow:"none",ls:"dot",col:"mut"});
  dg_draw(document.getElementById("v1"),D);
  const used=lay.reduce((s,x)=>s+x[3],0);
  document.getElementById("status").textContent="sizeof = "+size+" bájt, alignof = "+al+"; tagok összesen "+used+" bájt, padding "+pad+" bájt. "+
    "Offsetek: "+lay.map(([n,t,o])=>n+"@"+o).join(", ")+".";
  const ol=document.getElementById("mem"); ol.innerHTML="";
  mem.forEach(([n,t],j)=>{const li=document.createElement("li");
    li.innerHTML=`<code>${t} ${n};</code> <button type="button" aria-label="${n} feljebb" ${j?"":"disabled"}>↑</button> <button type="button" aria-label="${n} lejjebb" ${j<mem.length-1?"":"disabled"}>↓</button>`;
    const [up,dn]=li.querySelectorAll("button");
    up.onclick=()=>{[mem[j-1],mem[j]]=[mem[j],mem[j-1]];drawLayout();ol.querySelectorAll("button")[2*(j-1)].focus();};
    dn.onclick=()=>{[mem[j+1],mem[j]]=[mem[j],mem[j+1]];drawLayout();ol.querySelectorAll("button")[2*(j+1)+1].focus();};
    ol.appendChild(li);});
}
function drawCD(){const S=STATES[document.getElementById("ver").value];dg_draw(document.getElementById("v2"),S.D);
  document.getElementById("status2").textContent=S.msg;}
document.getElementById("preset").onchange=e=>{mem=PRESETS[e.target.value].map(x=>x.slice());drawLayout();};
document.getElementById("ver").onchange=drawCD;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{drawLayout();drawCD();});
drawLayout();drawCD();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
