<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blokkoló submit és drain leállítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>workerek <select id="pw"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label><label>sorkorlát <select id="pq"><option value="0">0 (korlátlan)</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option></select></label><label>feladatidő <select id="pd"><option value="5" selected>5 ms</option><option value="10">10 ms</option><option value="20">20 ms</option></select></label><label><input type="checkbox" id="pc"> cancel mód (ellenpélda)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A tasks_ sor három slottal, a beküldő main szál, két worker és a tíz future cellája; a sor betelésekor a beküldő a not_full_-on vár, a destruktor után minden future kész."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Determinisztikus eseményszimuláció a ThreadPool szabályaival (nem mérés, egy lehetséges ütemezés; a submit ideje 0, a feladatidő rögzített). A cancel mód szemléltető ellenpélda: a fejezet poolja drainel.</p>

function reload(){const W=document.getElementById("pw").value, Q=document.getElementById("pq").value,
  c=document.getElementById("pc").checked?1:0; QMAX=+Q; DMS=+document.getElementById("pd").value;
  setSteps(conv(ALL[W+"|"+Q+"|"+c]));}
["pw","pq","pc"].forEach(id=>document.getElementById(id).addEventListener("change",reload));
document.getElementById("pd").addEventListener("change",()=>{DMS=+document.getElementById("pd").value; show(k);});
function box(x,y,w,h,txt,o){o=o||{};
  el("rect",{x:x,y:y,width:w,height:h,fill:o.fill||css("--cell"),stroke:o.hl?css("--hl"):css("--line"),
    "stroke-width":o.hl?3:1.2,"stroke-dasharray":o.dash?"6 4":""});
  if(o.hatch)el("rect",{x:x,y:y,width:w,height:h,fill:"url(#hp)",opacity:0.5});
  String(txt).split("\n").forEach((l,i,a)=>el("text",{x:x+w/2,y:y+h/2+5+(i-(a.length-1)/2)*17,"text-anchor":"middle","font-size":14},l));}
function render(s){
  svg.setAttribute("viewBox","0 0 700 330"); svg.innerHTML="";
  el("defs",{}).innerHTML=`<pattern id="hp" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--fg")}" stroke-width="1.2"/></pattern>`;
  const hl=new Set(s.hl);
  el("text",{x:690,y:18,"text-anchor":"end","font-size":14},`t = ${s.t*DMS} ms   stop_ = ${s.stop?"true":"false"}`);
  const ml={run:`main\nsubmit(${Math.min(s.i,9)})`,blocked:`main: submit(${s.i})\nvár: not_full_`,dtor:"main:\n~ThreadPool (join)",done:"main:\nget() × 10"}[s.mst];
  box(6,34,190,80,ml,{dash:s.mst==="blocked",hl:hl.has("main")});
  const n=QMAX===0?6:QMAX;
  el("text",{x:220,y:28,"font-size":14},"tasks_ "+(QMAX===0?"(korlátlan)":`(max ${QMAX})`));
  for(let j=0;j<n;j++){const v=j<s.q.length?s.q[j]:"";box(214+j*46,40,46,46,v===""?"":String(v),{fill:v===""?css("--cell"):css("--cellhl"),hl:hl.has("q"+j)});}
  if(QMAX===0&&s.q.length>n)el("text",{x:214+n*46+6,y:68,"font-size":14},"+"+(s.q.length-n));
  s.w.forEach((w,j)=>{const lab=w==="i"?"vár (cv_)":(w==="x"?"kilépett":"fut: "+w.slice(1));
    box(520,34+j*40,170,34,`W${j+1}: ${lab}`,{dash:w==="i",fill:w[0]==="r"?css("--cellhl"):css("--cell"),hl:hl.has("w"+j)});});
  el("text",{x:6,y:208,"font-size":14},"futs (i·i; × = broken_promise)");
  s.f.forEach((v,j)=>{box(6+j*68,216,62,44,v===1?String(j*j):(v===2?"×":""),{hatch:v===1,hl:hl.has("f"+j)});
    el("text",{x:37+j*68,y:280,"text-anchor":"middle","font-size":12,fill:css("--muted")},String(j));});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
