    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

const svgEl=document.getElementById("v"), statusEl=document.getElementById("status");
function ctlVal(c){const e=document.getElementById(c.id);
  if(c.type==="step")return c.options[+e.value][0];
  if(c.type==="check")return e.checked?"1":"0"; return e.value;}
function setCtl(id,val){const c=CONTROLS.find(x=>x.id===id); if(!c)return; const e=document.getElementById(id);
  if(c.type==="step")e.value=c.options.findIndex(o=>o[0]===val);
  else if(c.type==="check")e.checked=(val==="1"); else e.value=val; draw();}
let post=null;

function draw(){
  const vals={}; CONTROLS.forEach(c=>vals[c.id]=ctlVal(c));
  CONTROLS.filter(c=>c.type==="step").forEach(c=>{document.getElementById(c.id+"_cnt").textContent=
     (+document.getElementById(c.id).value+1)+"/"+c.options.length+" – "+c.options[+document.getElementById(c.id).value][1];});
  const S=STATES[CONTROLS.filter(c=>c.id!==STAGE_CTL).map(c=>vals[c.id]).join("|")];
  const D=JSON.parse(JSON.stringify(S.D));
  if(STAGE_CTL){const sv=+vals[STAGE_CTL];
    ["nodes","edges","texts"].forEach(f=>{D[f]=(D[f]||[]).filter(o=>!(o.stage>sv));
      D[f].forEach(o=>{if(o.stage===sv){if(f==="texts")o.bold=true; else o.hl=true;}});});}
  const out=dg_draw(svgEl,D);
  [...D.nodes,...D.edges].forEach(o=>{ if(o.act&&out[o.id]){const g=out[o.id];
     g.setAttribute("data-act","1"); g.setAttribute("tabindex","0"); g.setAttribute("role","button");
     g.setAttribute("aria-label",o.actlabel||o.id);
     const f=()=>setCtl(o.act.ctl,o.act.val); g.addEventListener("click",f);
     g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});}});
  statusEl.textContent=(S.msgs&&STAGE_CTL)?S.msgs[+vals[STAGE_CTL]]:S.msg;
  const ce=document.getElementById("cmd"); if(ce)ce.textContent=S.cmd||"";
  if(post)post(D,vals,out);
}
CONTROLS.forEach(c=>{const e=document.getElementById(c.id);
  e.addEventListener(c.type==="step"?"input":"change",draw);
  if(c.type==="step"){const n=c.options.length;
    document.getElementById(c.id+"_prev").onclick=()=>{e.value=Math.max(0,+e.value-1);draw();};
    document.getElementById(c.id+"_next").onclick=()=>{e.value=Math.min(n-1,+e.value+1);draw();};}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
// kezdőállapot URL-hashből (pl. #st=4&miss=1) – ellenőrzéshez/hivatkozáshoz
try{(location.hash||"").slice(1).split("&").forEach(p=>{const [a,b]=p.split("="); const c=CONTROLS.find(x=>x.id===a);
  if(!c||b===undefined)return; const e=document.getElementById(a);
  if(c.type==="step")e.value=+b; else if(c.type==="check")e.checked=(b==="1"); else e.value=decodeURIComponent(b);});}catch(err){}
draw();
</script>
