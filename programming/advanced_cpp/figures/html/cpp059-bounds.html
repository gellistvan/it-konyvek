<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lower_bound, upper_bound, equal_range</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Algoritmus: <select id="alg" aria-label="Algoritmus"><option value="lower_bound">lower_bound</option><option value="upper_bound">upper_bound</option><option value="equal_range">equal_range</option><option value="binary_search">binary_search</option><option value="lab">labor: [2, 4) két lower_bound-dal</option></select></label><label>érték: <select id="val" aria-label="Keresett érték"><option>0</option><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label><label>v: <input id="inp" value="1, 2, 2, 3, 4, 4, 4, 5" size="20" aria-label="Rendezett bemenet"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolcelemű rendezett vektor; a 4-esnél kisebb elemek után van a lower_bound határa, a 4-esnél nem nagyobbak után az upper_bound határa; a kettő között a három 4-es."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A felezési lépések a libstdc++ (g++ 15.2) algoritmusát követik; naplózó komparátorral ellenőrizve (figures/data/cpp059_bounds_calc.*). Előfeltétel: a tartomány a keresett értékre nézve particionált.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": [1, 2, 2, 3, 4, 4, 4, 5], "x": 4, "first": 0, "len": 8, "mid": null, "lo": null, "hi": null, "line": 0, "msg": "lower_bound(v, 4): first = 0, len = 8"}, {"a": [1, 2, 2, 3, 4, 4, 4, 5], "x": 4, "first": 0, "len": 8, "mid": 4, "lo": null, "hi": null, "line": 2, "msg": "1. összehasonlítás (lower): first = 0, len = 8, half = 4, middle = 4: v[4] = 4 < 4? hamis"}, {"a": [1, 2, 2, 3, 4, 4, 4, 5], "x": 4, "first": 0, "len": 4, "mid": 2, "lo": null, "hi": null, "line": 2, "msg": "2. összehasonlítás (lower): first = 0, len = 4, half = 2, middle = 2: v[2] = 2 < 4? igaz"}, {"a": [1, 2, 2, 3, 4, 4, 4, 5], "x": 4, "first": 3, "len": 1, "mid": 3, "lo": null, "hi": null, "line": 2, "msg": "3. összehasonlítás (lower): first = 3, len = 1, half = 0, middle = 3: v[3] = 3 < 4? igaz"}, {"a": [1, 2, 2, 3, 4, 4, 4, 5], "x": 4, "first": null, "len": 0, "mid": null, "lo": 4, "hi": null, "line": 4, "msg": "Vége (3 összehasonlítás): lower_bound = 4"}];
const CODE = ["len = last − first;  while (len > 0) { half = len >> 1; middle = first + half;", "", "  lower_bound:  if (comp(*middle, value)) { first = middle + 1; len -= half + 1; } else len = half;", "  upper_bound:  if (comp(value, *middle)) len = half; else { first = middle + 1; len -= half + 1; }", "}  return first;   // equal_range: közös felezés, majd lower_bound(first, middle) + upper_bound(middle+1, …)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function lowerJ(a, x, first, last, log, key){
  let ln = last - first; key = key || (e => e);
  while (ln > 0) { const half = ln >> 1, mid = first + half, c = key(a[mid]) < x;
    log.push({kind: "e<val", first, len: ln, half, mid, res: c, phase: "lower"});
    if (c) { first = mid + 1; ln = ln - half - 1; } else ln = half; }
  return first;
}
function upperJ(a, x, first, last, log){
  let ln = last - first;
  while (ln > 0) { const half = ln >> 1, mid = first + half, c = x < a[mid];
    log.push({kind: "val<e", first, len: ln, half, mid, res: c, phase: "upper"});
    if (c) ln = half; else { first = mid + 1; ln = ln - half - 1; } }
  return first;
}
function eqJ(a, x, log){
  let first = 0, ln = a.length;
  while (ln > 0) { const half = ln >> 1, mid = first + half; const c1 = a[mid] < x;
    log.push({kind: "e<val", first, len: ln, half, mid, res: c1, phase: "közös"});
    if (c1) { first = mid + 1; ln = ln - half - 1; continue; }
    const c2 = x < a[mid];
    log.push({kind: "val<e", first, len: ln, half, mid, res: c2, phase: "közös"});
    if (c2) { ln = half; continue; }
    const lo = lowerJ(a, x, first, mid, log), hi = upperJ(a, x, mid + 1, first + ln, log);
    return [lo, hi];
  }
  return [first, first];
}
function build(alg, x, a){
  const log = []; let res, lo = null, hi = null;
  if (alg === "lower_bound") { res = lowerJ(a, x, 0, a.length, log); lo = res; }
  else if (alg === "upper_bound") { res = upperJ(a, x, 0, a.length, log); hi = res; }
  else if (alg === "equal_range") { [lo, hi] = eqJ(a, x, log); }
  else { lo = lowerJ(a, x, 0, a.length, log); let c = null;
         if (lo < a.length) { c = x < a[lo]; log.push({kind: "val<e", first: lo, len: 0, half: 0, mid: lo, res: c, phase: "ellenőrzés"}); }
         res = lo < a.length && !c; }
  const st = [{a, x, first: 0, len: a.length, mid: null, lo: null, hi: null, line: 0, msg: `${alg}(v, ${x}): first = 0, len = ${a.length}`}];
  log.forEach((d, i) => {
    const cmp = d.kind === "e<val" ? `v[${d.mid}] = ${a[d.mid]} < ${x}` : `${x} < v[${d.mid}] = ${a[d.mid]}`;
    st.push({a, x, first: d.first, len: d.len, mid: d.mid, lo: null, hi: null, line: d.kind === "e<val" ? 2 : 3,
      msg: `${i + 1}. összehasonlítás (${d.phase}): first = ${d.first}, len = ${d.len}, half = ${d.half}, middle = ${d.mid}: ${cmp}? ${d.res ? "igaz" : "hamis"}`});
  });
  let fin = alg === "binary_search" ? `binary_search = ${res} (lower_bound = ${lo})` :
            alg === "equal_range" ? `equal_range = [${lo}, ${hi}), ${hi - lo} elem` : `${alg} = ${res}`;
  st.push({a, x, first: null, len: 0, mid: null, lo, hi, line: 4, msg: `Vége (${log.length} összehasonlítás): ` + fin});
  return st;
}
function lab(){
  const ts = [1, 2, 2, 3, 3, 4, 5], pl = ["start", "tick", "tick", "stop", "report", "flush", "exit"], log1 = [], log2 = [];
  const lo = lowerJ(ts, 2, 0, ts.length, log1), hi = lowerJ(ts, 4, lo, ts.length, log2);
  const st = [{a: ts, x: 2, first: 0, len: ts.length, mid: null, lo: null, hi: null, labels: pl, line: 0, msg: "Labor: [t_min, t_max) = [2, 4) a log időbélyegein (1, 2, 2, 3, 3, 4, 5)"}];
  log1.forEach(d => st.push({a: ts, x: 2, first: d.first, len: d.len, mid: d.mid, lo: null, hi: null, labels: pl, line: 2, msg: `lower_bound(…, 2): middle = ${d.mid}: ${ts[d.mid]} < 2? ${d.res ? "igaz" : "hamis"}`}));
  st.push({a: ts, x: 2, first: null, len: 0, mid: null, lo, hi: null, labels: pl, line: 4, msg: `lower = ${lo} („${pl[lo]}”)`});
  log2.forEach(d => st.push({a: ts, x: 4, first: d.first, len: d.len, mid: d.mid, lo, hi: null, labels: pl, line: 2, msg: `lower_bound(lower, end, 4): middle = ${d.mid}: ${ts[d.mid]} < 4? ${d.res ? "igaz" : "hamis"}`}));
  st.push({a: ts, x: 4, first: null, len: 0, mid: null, lo, hi, labels: pl, line: 4, msg: `upper = ${hi}; std::distance(lo, hi) = ${hi - lo}; első: „${pl[lo]}”, utolsó: „${pl[hi - 1]}” (a 4-es „flush” kívül esik)`});
  return st;
}
function load(){
  const alg = document.getElementById("alg").value;
  if (alg === "lab") { setSteps(lab()); return; }
  const a = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const err = document.getElementById("err");
  if (!a.length || a.length > 14 || a.some(x => !Number.isInteger(x))) { err.textContent = "1–14 egész szám kell."; return; }
  for (let i = 1; i < a.length; i++) if (a[i] < a[i-1]) { err.textContent = "A bemenetnek rendezettnek kell lennie (particionáltság)."; return; }
  err.textContent = ""; setSteps(build(alg, Number(document.getElementById("val").value), a));
}

function render(s){
  svg.setAttribute("viewBox", "0 0 600 200");
  svg.innerHTML = "";
  const n = s.a.length, W = Math.min(60, 540 / n), X0 = 30, Y = 50;
  s.a.forEach((x, i) => {
    const inRange = s.first !== null && i >= s.first && i < s.first + s.len, mid = i === s.mid;
    el("rect", {x: X0 + i*W, y: Y, width: W, height: 46, fill: mid ? css("--hl") : (inRange ? css("--cellhl") : css("--cell")), stroke: css("--line"), "stroke-width": mid ? 3 : 1.2});
    el("text", {x: X0 + i*W + W/2, y: Y + 30, "text-anchor": "middle", "font-size": 19, fill: mid ? "#fff" : css("--fg")}, String(x));
    el("text", {x: X0 + i*W + W/2, y: Y - 8, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(i));
    if (s.labels) el("text", {x: X0 + i*W + W/2, y: Y + 62, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, s.labels[i]);
  });
  const mark = (p, lab, dy) => { const x = X0 + p * W; el("line", {x1: x, y1: Y - 4, x2: x, y2: Y + 76, stroke: css("--hl2"), "stroke-width": 4});
    el("text", {x: x, y: Y + 92 + dy, "text-anchor": "middle", "font-size": 13, fill: css("--hl2")}, lab); };
  if (s.lo !== null && s.lo !== undefined) mark(s.lo, "lower = " + s.lo, 0);
  if (s.hi !== null && s.hi !== undefined) mark(s.hi, "upper = " + s.hi, s.lo === s.hi ? 16 : 0);
  if (s.lo !== null && s.hi !== null && s.lo !== undefined && s.hi !== undefined && s.hi > s.lo)
    el("path", {d: `M ${X0 + s.lo*W} ${Y + 118} v 8 H ${X0 + s.hi*W} v -8`, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: 30, y: 190, "font-size": 12, fill: css("--muted")}, s.first !== null ? `szürke = a még vizsgált [first, first + len) = [${s.first}, ${s.first + s.len}); kiemelt = middle` : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
