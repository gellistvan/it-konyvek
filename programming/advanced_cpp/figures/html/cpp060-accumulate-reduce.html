<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>accumulate és reduce</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bemenet: <input id="inp" value="1e16, 1, -1e16, 1" size="22" aria-label="Számok vesszővel"></label><label>Zárójelezés: <select id="mode" aria-label="Zárójelezés"><option value="chain">lánc (accumulate)</option><option value="pair">páronkénti fa</option><option value="perm">véletlen permutáció + fa</option></select></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két kiértékelési fa; a lánc eredménye 1, a fa eredménye 0, mert a nagy tagok mellett az 1-esek kerekítéssel elvesznek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">IEEE 754 binary64 (a JS Number is az), kerekítés a legközelebbire. A reduce zárójelezése implementációfüggő; a „páronkénti fa” egy lehetséges változat (4 elemre ugyanaz, mint a libstdc++ policy nélküli reduce-é). Kezdőállapot: lánc mód.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"T": {"N": [{"leaf": true, "v": 0.0, "lab": "init 0"}, {"leaf": true, "v": 1e+16, "lab": "1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": true, "v": -1e+16, "lab": "−1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": false, "kids": [0, 1]}, {"leaf": false, "kids": [5, 2]}, {"leaf": false, "kids": [6, 3]}, {"leaf": false, "kids": [7, 4]}], "order": [5, 6, 7, 8], "root": 8, "perm": [0, 1, 2, 3]}, "done": {}, "cur": null, "line": -1, "acc": 1.0, "msg": "Kezdet: accumulate-lánc; init = 0"}, {"T": {"N": [{"leaf": true, "v": 0.0, "lab": "init 0"}, {"leaf": true, "v": 1e+16, "lab": "1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": true, "v": -1e+16, "lab": "−1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": false, "kids": [0, 1]}, {"leaf": false, "kids": [5, 2]}, {"leaf": false, "kids": [6, 3]}, {"leaf": false, "kids": [7, 4]}], "order": [5, 6, 7, 8], "root": 8, "perm": [0, 1, 2, 3]}, "done": {"5": 1e+16}, "cur": 5, "line": -1, "acc": 1.0, "msg": "1. művelet: 0 + 1·10^16 = 1·10^16"}, {"T": {"N": [{"leaf": true, "v": 0.0, "lab": "init 0"}, {"leaf": true, "v": 1e+16, "lab": "1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": true, "v": -1e+16, "lab": "−1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": false, "kids": [0, 1]}, {"leaf": false, "kids": [5, 2]}, {"leaf": false, "kids": [6, 3]}, {"leaf": false, "kids": [7, 4]}], "order": [5, 6, 7, 8], "root": 8, "perm": [0, 1, 2, 3]}, "done": {"5": 1e+16, "6": 1e+16}, "cur": 6, "line": -1, "acc": 1.0, "msg": "2. művelet: 1·10^16 + 1 = 1·10^16  (kerekítés: információ veszett el)"}, {"T": {"N": [{"leaf": true, "v": 0.0, "lab": "init 0"}, {"leaf": true, "v": 1e+16, "lab": "1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": true, "v": -1e+16, "lab": "−1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": false, "kids": [0, 1]}, {"leaf": false, "kids": [5, 2]}, {"leaf": false, "kids": [6, 3]}, {"leaf": false, "kids": [7, 4]}], "order": [5, 6, 7, 8], "root": 8, "perm": [0, 1, 2, 3]}, "done": {"5": 1e+16, "6": 1e+16, "7": 0.0}, "cur": 7, "line": -1, "acc": 1.0, "msg": "3. művelet: 1·10^16 + −1·10^16 = 0"}, {"T": {"N": [{"leaf": true, "v": 0.0, "lab": "init 0"}, {"leaf": true, "v": 1e+16, "lab": "1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": true, "v": -1e+16, "lab": "−1·10^16"}, {"leaf": true, "v": 1.0, "lab": "1"}, {"leaf": false, "kids": [0, 1]}, {"leaf": false, "kids": [5, 2]}, {"leaf": false, "kids": [6, 3]}, {"leaf": false, "kids": [7, 4]}], "order": [5, 6, 7, 8], "root": 8, "perm": [0, 1, 2, 3]}, "done": {"5": 1e+16, "6": 1e+16, "7": 0.0, "8": 1.0}, "cur": 8, "line": -1, "acc": 1.0, "msg": "4. művelet: 0 + 1 = 1 · végeredmény 1; a páronkénti fa (reduce) eredménye 0 – ELTÉR"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function fmtN(x){ if (x === 0) return "0"; const a = Math.abs(x);
  if (a >= 1e6 || (a < 1e-3)) { const e = Math.floor(Math.log10(a)), m = x / Math.pow(10, e);
    return (Math.abs(Math.round(m * 1e6) / 1e6 - Math.round(m)) < 1e-9 ? String(Math.round(m)).replace("-", "−") : String(+m.toPrecision(7)).replace(".", ",").replace("-", "−")) + "·10^" + e; }
  return String(+x.toPrecision(12)).replace(".", ",").replace("-", "−"); }
let SEED = 12345;
function rnd(){ SEED = (SEED * 1103515245 + 12345) % 2147483648; return SEED / 2147483648; }
function buildTree(vals, mode){
  // csúcsok: {id, leaf, v, kids:[i,j], x, d}; a kiértékelési sorrend: postorder
  const N = [], order = [];
  const leaf = (v, lab) => { N.push({leaf: true, v, lab: lab || fmtN(v)}); return N.length - 1; };
  const add = (i, j) => { N.push({leaf: false, kids: [i, j]}); const id = N.length - 1; order.push(id); return id; };
  const init = leaf(0, "init 0");
  let xs = vals.slice(), perm = vals.map((_, i) => i);
  if (mode === "perm") { for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; } xs = perm.map(i => vals[i]); }
  const L = xs.map((v, i) => leaf(v));
  let root;
  if (mode === "chain") { root = init; L.forEach(l => { root = add(root, l); }); }
  else { const rec = (lo, hi) => hi - lo === 1 ? L[lo] : add(rec(lo, (lo + hi) >> 1), rec((lo + hi) >> 1, hi)); root = add(init, rec(0, L.length)); }
  return {N, order, root, perm};
}
function steps(vals, mode){
  const T = buildTree(vals, mode), done = {}, st = [];
  let accv = 0; vals.forEach(v => accv = accv + v);   // accumulate = lánc
  const val = id => T.N[id].leaf ? T.N[id].v : done[id];
  st.push({T, done: {}, cur: null, line: -1, acc: accv, msg: "Kezdet: " + (mode === "chain" ? "accumulate-lánc" : (mode === "pair" ? "páronkénti (kiegyensúlyozott) fa" : "véletlen permutáció + fa (sorrend: " + T.perm.map(i => i + 1).join(", ") + ")")) + "; init = 0"});
  T.order.forEach((id, k) => {
    const [i, j] = T.N[id].kids, a = val(i), b = val(j), r = a + b;
    done[id] = r;
    const lost = (r - a) !== b || (r - b) !== a;
    st.push({T, done: Object.assign({}, done), cur: id, line: -1, acc: accv,
      msg: `${k + 1}. művelet: ${fmtN(a)} + ${fmtN(b)} = ${fmtN(r)}` + (lost ? "  (kerekítés: információ veszett el)" : "")});
  });
  const fin = done[T.root];
  st[st.length - 1].msg += ` · végeredmény ${fmtN(fin)}; accumulate (lánc) = ${fmtN(accv)}` + (fin === accv ? " – egyezik" : " – ELTÉR");
  return st;
}
function load(){
  const raw = document.getElementById("inp").value.split(/[;,\s]+/).filter(x => x !== "").map(Number);
  const err = document.getElementById("err");
  if (raw.length < 2 || raw.length > 10 || raw.some(x => !Number.isFinite(x))) { err.textContent = "2–10 véges számot adjon meg (pl. 1e16, 1, -1e16, 1)."; return; }
  err.textContent = ""; setSteps(steps(raw, document.getElementById("mode").value));
}

function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  const T = s.T, N = T.N, depth = {}, xs = {};
  // elrendezés: levelek egyenközűen (az init balra), belső csúcs a gyerekek fölött
  let li = 0; const leaves = N.map((n, i) => n.leaf ? i : -1).filter(i => i >= 0);
  leaves.forEach((i, k) => { xs[i] = 50 + k * (540 / Math.max(1, leaves.length - 1)); depth[i] = 0; });
  const lay = id => { const n = N[id]; if (n.leaf) return; n.kids.forEach(lay); xs[id] = (xs[n.kids[0]] + xs[n.kids[1]]) / 2; depth[id] = 1 + Math.max(depth[n.kids[0]], depth[n.kids[1]]); };
  lay(T.root);
  const H = Math.max(...Object.values(depth)), Y = d => 250 - d * (200 / Math.max(H, 1));
  N.forEach((n, id) => { if (!n.leaf) n.kids.forEach(c => el("line", {x1: xs[id], y1: Y(depth[id]), x2: xs[c], y2: Y(depth[c]), stroke: css("--line"), "stroke-width": 1.3})); });
  N.forEach((n, id) => {
    const x = xs[id], y = Y(depth[id]);
    if (n.leaf) { el("rect", {x: x - 36, y: y - 13, width: 72, height: 26, rx: 5, fill: css("--cell"), stroke: css("--line")});
      el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 12}, n.lab); return; }
    const has = s.done[id] !== undefined, cur = id === s.cur;
    el("circle", {cx: x, cy: y, r: 13, fill: cur ? css("--hl") : (has ? css("--cellhl") : css("--cell")), stroke: css("--line"), "stroke-width": cur ? 3 : 1.2});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 15, fill: cur ? "#fff" : css("--fg")}, "+");
    if (has) el("text", {x: x + 17, y: y - 8, "font-size": 12, "font-weight": "bold"}, "= " + fmtN(s.done[id]));
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
