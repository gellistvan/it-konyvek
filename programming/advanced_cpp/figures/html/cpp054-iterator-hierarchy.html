<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iterátortag-ek és conceptek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Típus: <select id="typ" onchange="stop(); show(+this.value)" aria-label="Iterátortípus"><option value="0">istream_iterator&lt;int&gt;</option><option value="1">forward_list&lt;int&gt;::iterator</option><option value="2">ForwardListIterator&lt;int&gt;</option><option value="3">list&lt;int&gt;::iterator</option><option value="4">vector&lt;bool&gt;::iterator</option><option value="5">vector&lt;int&gt;::iterator</option><option value="6">int*</option><option value="7">ostream_iterator&lt;int&gt;</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két párhuzamos lánc az inputtól a contiguousig; az output külön ág; a C++20-ban közös gyökér az input_or_output_iterator. A kiválasztott típus tag-szintje és legerősebb conceptje kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Besorolás: g++ 15.2.0, libstdc++, -std=c++20 (figures/data/cpp054_iterator_hierarchy_calc.*). Kettős vonal = concept-finomítás, egyszeres = tag-öröklés, pontozott = ITER_CONCEPT-leképezés, szaggatott keret = C++20-újdonság.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": "istream_iterator<int>", "cl": "input", "tl": "input", "cat": "input_iterator_tag", "con": "input_iterator", "vt": "int", "rt": "const int&", "line": -1, "msg": "istream_iterator<int>: iterator_category = input_iterator_tag, legerősebb concept = std::input_iterator."}, {"t": "forward_list<int>::iterator", "cl": "forward", "tl": "forward", "cat": "forward_iterator_tag", "con": "forward_iterator", "vt": "int", "rt": "int&", "line": -1, "msg": "forward_list<int>::iterator: iterator_category = forward_iterator_tag, legerősebb concept = std::forward_iterator."}, {"t": "ForwardListIterator<int>", "cl": "forward", "tl": "forward", "cat": "forward_iterator_tag", "con": "forward_iterator", "vt": "int", "rt": "int&", "line": -1, "msg": "ForwardListIterator<int>: iterator_category = forward_iterator_tag, legerősebb concept = std::forward_iterator."}, {"t": "list<int>::iterator", "cl": "bidirectional", "tl": "bidirectional", "cat": "bidirectional_iterator_tag", "con": "bidirectional_iterator", "vt": "int", "rt": "int&", "line": -1, "msg": "list<int>::iterator: iterator_category = bidirectional_iterator_tag, legerősebb concept = std::bidirectional_iterator."}, {"t": "vector<bool>::iterator", "cl": "random_access", "tl": "random_access", "cat": "random_access_iterator_tag", "con": "random_access_iterator", "vt": "bool", "rt": "_Bit_reference", "line": -1, "msg": "vector<bool>::iterator: iterator_category = random_access_iterator_tag, legerősebb concept = std::random_access_iterator. A contiguous_iterator NEM teljesül (proxy referencia: _Bit_reference)."}, {"t": "vector<int>::iterator", "cl": "contiguous", "tl": "random_access", "cat": "random_access_iterator_tag", "con": "contiguous_iterator", "vt": "int", "rt": "int&", "line": -1, "msg": "vector<int>::iterator: iterator_category = random_access_iterator_tag, legerősebb concept = std::contiguous_iterator. A tag random_access, a contiguous szint csak az iterator_concept-ből (int*: elsődleges traits) jön."}, {"t": "int*", "cl": "contiguous", "tl": "random_access", "cat": "random_access_iterator_tag", "con": "contiguous_iterator", "vt": "int", "rt": "int&", "line": -1, "msg": "int*: iterator_category = random_access_iterator_tag, legerősebb concept = std::contiguous_iterator. A tag random_access, a contiguous szint csak az iterator_concept-ből (int*: elsődleges traits) jön."}, {"t": "ostream_iterator<int>", "cl": "output", "tl": "output", "cat": "output_iterator_tag", "con": "output_iterator", "vt": "nincs (value_type = void)", "rt": "ostream_iterator<int, char, char_traits<char> >&", "line": -1, "msg": "ostream_iterator<int>: iterator_category = output_iterator_tag, legerősebb concept = std::output_iterator."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = [{"kind": "tag", "lv": "input", "x": 2.0, "y": 1.75, "t": "input_iterator_tag", "d": false}, {"kind": "tag", "lv": "forward", "x": 2.0, "y": 2.9, "t": "forward_iterator_tag", "d": false}, {"kind": "tag", "lv": "bidirectional", "x": 2.0, "y": 4.05, "t": "bidirectional_iterator_tag", "d": false}, {"kind": "tag", "lv": "random_access", "x": 2.0, "y": 5.199999999999999, "t": "random_access_iterator_tag", "d": false}, {"kind": "tag", "lv": "contiguous", "x": 2.0, "y": 6.35, "t": "contiguous_iterator_tag", "d": true}, {"kind": "tag", "lv": "output", "x": 2.0, "y": 8.299999999999999, "t": "output_iterator_tag", "d": false}, {"kind": "con", "lv": "root", "x": 6.0, "y": 0.6, "t": "input_or_output_iterator", "d": false}, {"kind": "con", "lv": "input", "x": 6.0, "y": 1.75, "t": "input_iterator", "d": false}, {"kind": "con", "lv": "forward", "x": 6.0, "y": 2.9, "t": "forward_iterator", "d": false}, {"kind": "con", "lv": "bidirectional", "x": 6.0, "y": 4.05, "t": "bidirectional_iterator", "d": false}, {"kind": "con", "lv": "random_access", "x": 6.0, "y": 5.199999999999999, "t": "random_access_iterator", "d": false}, {"kind": "con", "lv": "contiguous", "x": 6.0, "y": 6.35, "t": "contiguous_iterator", "d": false}, {"kind": "con", "lv": "output", "x": 6.0, "y": 8.299999999999999, "t": "output_iterator<It, T>", "d": false}], LEVELS = ["input", "forward", "bidirectional", "random_access", "contiguous"], YOUT = 8.299999999999999, EXL = {"input": "istream_iterator<int>", "forward": "forward_list<int>::iterator,\nForwardListIterator<int>", "bidirectional": "list<int>::iterator", "random_access": "vector<bool>::iterator (proxy;\nnem contiguous)", "contiguous": "vector<int>::iterator, int*\n(tag: random_access_iterator_tag)", "output": "ostream_iterator<int>"}, TYPES = ["istream_iterator<int>", "forward_list<int>::iterator", "ForwardListIterator<int>", "list<int>::iterator", "vector<bool>::iterator", "vector<int>::iterator", "int*", "ostream_iterator<int>"];
function render(s){
  const U = 50, H = 470;
  svg.setAttribute("viewBox", "0 0 640 " + H);
  svg.innerHTML = "";
  const X = x => x * U + 10, Yp = y => y * U + 34;
  el("text", {x: X(2.0), y: 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Cpp17 tag-ek");
  el("text", {x: X(6.0), y: 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "C++20 conceptek");
  // vonalak
  for (let i = 0; i + 1 < LEVELS.length; i++) {
    const a = NODES.find(n => n.kind === "tag" && n.lv === LEVELS[i]), b = NODES.find(n => n.kind === "tag" && n.lv === LEVELS[i+1]);
    el("line", {x1: X(a.x), y1: Yp(a.y) + 15, x2: X(b.x), y2: Yp(b.y) - 15, stroke: css("--line"), "stroke-width": 1.3});
    const c = NODES.find(n => n.kind === "con" && n.lv === LEVELS[i]), d = NODES.find(n => n.kind === "con" && n.lv === LEVELS[i+1]);
    el("line", {x1: X(c.x) - 3, y1: Yp(c.y) + 15, x2: X(d.x) - 3, y2: Yp(d.y) - 15, stroke: css("--line")});
    el("line", {x1: X(c.x) + 3, y1: Yp(c.y) + 15, x2: X(d.x) + 3, y2: Yp(d.y) - 15, stroke: css("--line")});
  }
  const r = NODES.find(n => n.lv === "root"), inp = NODES.find(n => n.kind === "con" && n.lv === "input");
  el("line", {x1: X(r.x), y1: Yp(r.y) + 15, x2: X(inp.x), y2: Yp(inp.y) - 15, stroke: css("--line"), "stroke-width": 2.5});
  const xr = X(r.x) + 98;
  el("polyline", {points: `${X(r.x)+88},${Yp(r.y)} ${xr},${Yp(r.y)} ${xr},${Yp(YOUT)} ${X(r.x)+88},${Yp(YOUT)}`, fill: "none", stroke: css("--line"), "stroke-width": 2.5});
  NODES.forEach(n => { if (n.kind === "tag" && n.lv !== "root") {
    const c = NODES.find(m => m.kind === "con" && m.lv === n.lv);
    el("line", {x1: X(n.x) + 88, y1: Yp(n.y), x2: X(c.x) - 88, y2: Yp(c.y), stroke: css("--muted"), "stroke-dasharray": "2 3"}); } });
  // csomópontok
  NODES.forEach(n => {
    const on = (n.kind === "tag" && n.lv === s.tl) || (n.kind === "con" && n.lv === s.cl);
    el("rect", {x: X(n.x) - 88, y: Yp(n.y) - 15, width: 176, height: 30, rx: 5,
      fill: on ? css("--hl") : (n.kind === "con" ? css("--cellhl") : css("--cell")), stroke: css("--line"),
      "stroke-dasharray": n.d ? "5 3" : "", "stroke-width": on ? 2.5 : 1});
    el("text", {x: X(n.x), y: Yp(n.y) + 4.5, "text-anchor": "middle", "font-size": 12, "font-family": "ui-monospace,monospace",
      fill: on ? "#fff" : css("--fg")}, n.t);
  });
  // táblázat
  const tb = [["típus", s.t], ["iter_value_t", s.vt], ["iter_reference_t", s.rt], ["iterator_category", s.cat], ["legerősebb concept", "std::" + s.con]];
  tb.forEach((row, i) => {
    el("text", {x: 432, y: 120 + i * 40, "font-size": 12, fill: css("--muted")}, row[0]);
    el("text", {x: 432, y: 138 + i * 40, "font-size": 12.5, "font-family": "ui-monospace,monospace"}, row[1].length > 30 ? row[1].slice(0, 29) + "…" : row[1]);
  });
  const sel = document.getElementById("typ"); if (sel && sel.value !== String(k)) sel.value = String(k);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
