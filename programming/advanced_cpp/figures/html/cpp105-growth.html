<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Növekedési politikák: kapacitás és mozgatásszám</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#ccc;--a:#000;--b:#666;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#444;--a:#eee;--b:#999;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
input[type=range]{min-width:180px}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
table{border-collapse:collapse;margin:4px 0}td,th{border:1px solid var(--muted);padding:2px 8px;text-align:right}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label>n (log) <input id="n" type="range" min="0" max="600" value="600" aria-label="push_back-ek száma, logaritmikus csúszka"> <span id="nv"></span></label>
<label>FixedIncrement lépése <select id="inc"><option value="256">256</option><option value="1024" selected>1024</option><option value="4096">4096</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<table aria-label="Összesítés"><tr><th></th><th>reallokáció</th><th>mozgatás</th><th>kapacitás</th></tr>
<tr><th>DoubleGrowth</th><td id="dr"></td><td id="dm"></td><td id="dc"></td></tr>
<tr><th>FixedIncrement</th><td id="fr"></td><td id="fm"></td><td id="fc"></td></tr></table>
<svg id="v" viewBox="0 0 900 340" role="img" aria-label="Két grafikon: a kapacitás lépcsős görbéje és a kumulált elemmozgatás logaritmikus skálán a push_back-ek számának függvényében, DoubleGrowth folytonos, FixedIncrement szaggatott vonallal."></svg>
<p class="small">Analitikus számítás a labor DoubleGrowth és FixedIncrement new_capacity függvényének pontos átiratával
(push_back: needed = size + 1; reallokációkor size elem mozog). Nem mért idő; a futásidőt a hallgató méri.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dbl(cur,need){let c=cur===0?1:cur*2;while(c<need)c*=2;return c;}
function fix(inc){return (cur,need)=>need<=cur?cur:Math.ceil(need/inc)*inc;}
function sim(pol,n){let cap=0,mv=0,size=0;const ev=[];while(size<n){const need=size+1;if(need>cap){const nw=pol(cap,need);mv+=size;ev.push([need,cap,nw,mv]);cap=nw;}size=Math.min(n,cap);}return ev;}
const th=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g," ");
function nOf(v){return Math.max(1,Math.round(Math.pow(10,v/100)));}
function draw(){
  const n=nOf(+document.getElementById("n").value), inc=+document.getElementById("inc").value;
  document.getElementById("nv").textContent=th(n);
  const D=sim(dbl,n), F=sim(fix(inc),n);
  const last=e=>e.length?e[e.length-1]:[0,0,0,0];
  document.getElementById("dr").textContent=D.length; document.getElementById("dm").textContent=th(last(D)[3]); document.getElementById("dc").textContent=th(last(D)[2]);
  document.getElementById("fr").textContent=F.length; document.getElementById("fm").textContent=th(last(F)[3]); document.getElementById("fc").textContent=th(last(F)[2]);
  const ratio=last(F)[3]/Math.max(1,last(D)[3]);
  document.getElementById("status").textContent=`n = ${th(n)}: a fix ${inc}-es lépés ${F.length} reallokációval ${th(last(F)[3])} elemet mozgat, a duplázó ${D.length} reallokációval ${th(last(D)[3])}-t (arány ≈ ${ratio<10?ratio.toFixed(1).replace(".",","):th(Math.round(ratio))}×).`;
  svg.innerHTML="";
  const fg=css("--fg"),A=css("--a"),B=css("--b"),G=css("--grid");
  const P=[{x0:70,title:"(A) kapacitás(n)"},{x0:520,title:"(B) összes mozgatás (log)"}], W=340,H=230,y0=40;
  const capMax=Math.max(last(D)[2],last(F)[2],n), mvMax=Math.max(10,last(F)[3],last(D)[3])*2;
  P.forEach((p,k)=>{
    el("text",{x:p.x0,y:22,"font-size":14,"font-weight":"bold"},p.title);
    el("rect",{x:p.x0,y:y0,width:W,height:H,fill:"none",stroke:G});
    for(let i=0;i<=4;i++){const x=p.x0+W*i/4;el("line",{x1:x,y1:y0,x2:x,y2:y0+H,stroke:G,"stroke-dasharray":"2 3"});
      el("text",{x:x,y:y0+H+16,"font-size":12,"text-anchor":"middle"},th(Math.round(n*i/4)));}
    el("text",{x:p.x0+W/2,y:y0+H+34,"font-size":12,"text-anchor":"middle"},"push_back-ek száma, n");
    if(k===0){for(let i=0;i<=4;i++){const y=y0+H-H*i/4;el("text",{x:p.x0-6,y:y+4,"font-size":11,"text-anchor":"end"},th(Math.round(capMax*i/4)));}}
    else{for(let e=0;Math.pow(10,e)<=mvMax;e+=2){const y=y0+H-H*Math.log10(Math.pow(10,e))/Math.log10(mvMax);
      el("line",{x1:p.x0,y1:y,x2:p.x0+W,y2:y,stroke:G,"stroke-dasharray":"2 3"});el("text",{x:p.x0-6,y:y+4,"font-size":11,"text-anchor":"end"},"10^"+e);}}
  });
  const X=(p,v)=>P[p].x0+W*v/n, YC=v=>y0+H-H*v/capMax, YM=v=>y0+H-H*Math.log10(Math.max(1,v))/Math.log10(mvMax);
  [[D,A,""],[F,B,"6 4"]].forEach(([ev,col,da])=>{
    let d="M"+X(0,0)+" "+YC(0), m="M"+X(1,0)+" "+YM(1);
    ev.forEach(e=>{d+=`L${X(0,e[0]-1)} ${YC(e[1])}L${X(0,e[0])} ${YC(e[2])}`; m+=`L${X(1,e[0])} ${YM(e[3]===0?1:e[3])}`;});
    const L=last(ev); d+=`L${X(0,n)} ${YC(L[2])}`; m+=`L${X(1,n)} ${YM(Math.max(1,L[3]))}`;
    el("path",{d:d,fill:"none",stroke:col,"stroke-width":2,"stroke-dasharray":da});
    el("path",{d:m,fill:"none",stroke:col,"stroke-width":2,"stroke-dasharray":da});
  });
  el("line",{x1:90,y1:58,x2:120,y2:58,stroke:A,"stroke-width":2});el("text",{x:126,y:62,"font-size":12},"DoubleGrowth");
  el("line",{x1:90,y1:76,x2:120,y2:76,stroke:B,"stroke-width":2,"stroke-dasharray":"6 4"});el("text",{x:126,y:80,"font-size":12},"FixedIncrement ("+inc+")");
}
document.getElementById("n").addEventListener("input",draw);
document.getElementById("inc").addEventListener("change",draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
