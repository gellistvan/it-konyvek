<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A FOR_EACH makrólánc kibontása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="args">Saját argumentumlista (1–5 elem):</label> <input id="args" type="text" size="34" value="&quot;alpha&quot;, &quot;beta&quot;, &quot;gamma&quot;"> <button id="argbtn" type="button">Levezetés</button> <span id="argmsg" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A SELECT_FOR_EACH hat rekesze (_1–_4, NAME, ...) az argumentumokkal; a NAME rekeszbe eső FOR_EACH_N név dönt, majd a lánc lépésenként kibomlik PRINT hívásokká."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A sorok a g++ 15.2 -E -P kimenetével egyeznek (a PRINT makró kibontatlan). Öt elemnél a NAME rekeszbe adat kerül: érvénytelen kód.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Az adatargumentumok (3 db) és a FOR_EACH_4 … FOR_EACH_1 nevek a SELECT_FOR_EACH rekeszeibe kerülnek.", "line": 5, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 0, "nl": 0}, {"msg": "2. A NAME rekesz értéke FOR_EACH_3: ez lesz a SELECT_FOR_EACH eredménye.", "line": 4, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 1, "nl": 0}, {"msg": "3. Kibontás: FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "line": 4, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 2, "nl": 1}, {"msg": "4. Kibontás: PRINT(\"alpha\"); FOR_EACH_2(PRINT, \"beta\", \"gamma\")", "line": 2, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 2, "nl": 2}, {"msg": "5. Kibontás: PRINT(\"alpha\"); PRINT(\"beta\"); FOR_EACH_1(PRINT, \"gamma\")", "line": 1, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 2, "nl": 3}, {"msg": "6. Kibontás: PRINT(\"alpha\"); PRINT(\"beta\"); PRINT(\"gamma\")  (kész)", "line": 0, "p": {"slots": ["\"alpha\"", "\"beta\"", "\"gamma\"", "FOR_EACH_4"], "name": "FOR_EACH_3", "rest": ["FOR_EACH_2", "FOR_EACH_1"], "lines": [[["FOR_EACH_3(PRINT, \"alpha\", \"beta\", \"gamma\")", "new"]], [["PRINT(\"alpha\"); FOR_EACH_2", "new"], ["(PRINT, \"beta\", \"gamma\")", "pend"]], [["PRINT(\"alpha\"); ", "done"], ["PRINT(\"beta\"); FOR_EACH_1", "new"], ["(PRINT, \"gamma\")", "pend"]], [["PRINT(\"alpha\"); PRINT(\"beta\"); ", "done"], ["PRINT(\"gamma\")", "new"]]], "err": false}, "phase": 2, "nl": 4}];
const CODE = ["#define FOR_EACH_1(macro, a1) macro(a1)", "#define FOR_EACH_2(macro, a1, a2) macro(a1); FOR_EACH_1(macro, a2)", "#define FOR_EACH_3(macro, a1, a2, a3) macro(a1); FOR_EACH_2(macro, a2, a3)", "#define FOR_EACH_4(macro, a1, a2, a3, a4) macro(a1); FOR_EACH_3(macro, a2, a3, a4)", "#define SELECT_FOR_EACH(_1, _2, _3, _4, NAME, ...) NAME", "#define FOR_EACH(macro, ...) SELECT_FOR_EACH(__VA_ARGS__, FOR_EACH_4, FOR_EACH_3, FOR_EACH_2, FOR_EACH_1)(macro, __VA_ARGS__)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CWJ = 0.602*15, SWJ = [100,100,100,100,125,215], HEADJ = ["_1","_2","_3","_4","NAME","..."];
function mono(x,y,t,attrs){const a=Object.assign({x:x,y:y,"font-size":15,style:"font-family:ui-monospace,'DejaVu Sans Mono',monospace"},attrs||{});return el("text",a,t);}
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 780 300");
  const p=s.p, vals=p.slots.concat([p.name, p.rest.length? p.rest.join(", ") : "(üres)"]);
  let x=20;
  for(let i=0;i<6;i++){
    const w=SWJ[i], sel=(i===4 && s.phase>=1), err=sel&&p.err;
    el("rect",{x:x,y:20,width:w,height:26,fill:css("--cellhl"),stroke:css("--line")});
    el("text",{x:x+w/2,y:38,"text-anchor":"middle","font-size":14,"font-weight":sel?"bold":"normal"},HEADJ[i]+(sel?" ★":""));
    el("rect",{x:x,y:46,width:w,height:32,fill:css("--cell"),stroke:err?css("--hl2"):(sel?css("--hl"):css("--line")),"stroke-width":sel?3.5:1.2,"stroke-dasharray":err?"6 4":""});
    let v=vals[i]; if(v.length*CWJ>w-6){v=v.slice(0,Math.floor((w-10)/CWJ)-1)+"…";}
    mono(x+w/2,67,v,{"text-anchor":"middle","font-weight":sel?"bold":"normal"});
    x+=w;
  }
  for(let j=0;j<s.nl;j++){
    const y=112+28*j; let cx=40;
    el("text",{x:20,y:y,"font-size":13,fill:css("--muted")},p.err?"→":(j+1)+".");
    p.lines[j].forEach(([t,sty])=>{
      const w=t.length*CWJ;
      if(sty==="done") el("rect",{x:cx-2,y:y-15,width:w-CWJ+4,height:21,fill:"none",stroke:css("--muted"),"stroke-dasharray":"1.5 3"});
      const a={"font-weight":(sty==="new"&&j===s.nl-1)?"bold":"normal"};
      if(sty==="err") a.fill=css("--hl2");
      mono(cx,y,t,a); cx+=w;
    });
    if(p.err){el("rect",{x:36,y:y-17,width:cx-30,height:25,fill:"none",stroke:css("--hl2"),"stroke-width":2,"stroke-dasharray":"6 4"});
      el("text",{x:20,y:y+30,"font-size":15,"font-weight":"bold",fill:css("--hl2")},"HIBA: a NAME rekeszbe adat került – érvénytelen kód.");}
  }
}
const FEJ=["FOR_EACH_4","FOR_EACH_3","FOR_EACH_2","FOR_EACH_1"];
function planJ(args){
  const lst=args.concat(FEJ), slots=lst.slice(0,4), name=lst[4], rest=lst.slice(5), lines=[];
  let err=true;
  if(FEJ.includes(name) && +name.slice(-1)===args.length){
    err=false; const k=args.length;
    lines.push([[name+"(PRINT, "+args.join(", ")+")","new"]]);
    for(let i=1;i<=k;i++){
      const seg=[], done=args.slice(0,i-1).map(a=>"PRINT("+a+");");
      if(done.length) seg.push([done.join(" ")+" ","done"]);
      if(i<k){seg.push(["PRINT("+args[i-1]+"); FOR_EACH_"+(k-i),"new"]); seg.push(["(PRINT, "+args.slice(i).join(", ")+")","pend"]);}
      else seg.push(["PRINT("+args[i-1]+")","new"]);
      lines.push(seg);
    }
  } else lines.push([[name+"(PRINT, "+args.join(", ")+")","err"]]);
  return {slots:slots,name:name,rest:rest,lines:lines,err:err};
}
function flatJ(l){return l.map(x=>x[0]).join("");}
function stepsJ(args){
  const p=planJ(args), out=[{msg:"1. Az adatargumentumok ("+args.length+" db) és a FOR_EACH_4 … FOR_EACH_1 nevek a SELECT_FOR_EACH rekeszeibe kerülnek.",line:5,p:p,phase:0,nl:0}];
  if(p.err){out.push({msg:"2. A NAME rekeszbe adat kerül ("+p.name+"): az eredmény "+flatJ(p.lines[0])+" – HIBA, érvénytelen kód.",line:4,p:p,phase:1,nl:1});return out;}
  out.push({msg:"2. A NAME rekesz értéke "+p.name+": ez lesz a SELECT_FOR_EACH eredménye.",line:4,p:p,phase:1,nl:0});
  const k=args.length;
  p.lines.forEach((l,j)=>{
    out.push({msg:(j+3)+". Kibontás: "+flatJ(l)+(j===p.lines.length-1?"  (kész)":""),line:j===0?4:k-j,p:p,phase:2,nl:j+1});});
  return out;
}
function runArgs(){
  const raw=document.getElementById("args").value.split(",").map(t=>t.trim()).filter(t=>t.length);
  const msg=document.getElementById("argmsg");
  if(raw.length<1||raw.length>5){msg.textContent="1–5 elemet adj meg, vesszővel elválasztva.";return;}
  msg.textContent="";
  setSteps(stepsJ(raw));
}
document.getElementById("argbtn").onclick=runArgs;
document.getElementById("args").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();runArgs();}});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
