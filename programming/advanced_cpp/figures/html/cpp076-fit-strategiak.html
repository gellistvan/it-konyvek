<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allokációs stratégiák összehasonlítása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="radiogroup" aria-label="stratégia"><label><input type="radio" name="strat" value="first" checked> first-fit</label> <label><input type="radio" name="strat" value="best"> best-fit</label> <label><input type="radio" name="strat" value="worst"> worst-fit</label> <label><input type="radio" name="strat" value="next"> next-fit</label> </span>
<label>saját kérés (B) <input id="iReq" type="number" min="1" max="1100" value="100" style="width:5em"></label>
<button id="bReq">kérés az aktuális állapotra</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szabad blokkok 100, 300, 200, 160 bájt; first-fit és worst-fit a 300-ast, best-fit a 160-ast (10 bájt maradék), next-fit a 200-ast választja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

// A 20.3.6.4 HeapSim JS-átirata (first/best/worst/next-fit, split, coalescing) – a Python-változattal azonos.
function hsNew(blocks, strategy, rover){ return {B: blocks.map(b => Object.assign({}, b)), s: strategy, rover: rover || 0}; }
function hsPick(h, n){
  const B = h.B;
  if (h.s === "next"){ let st = 0; while (st < B.length && B[st].off < h.rover) st++;
    for (let k = 0; k < B.length; k++){ const i = (st + k) % B.length; if (B[i].free && B[i].size >= n) return i; } return -1; }
  let p = -1;
  for (let i = 0; i < B.length; i++){ const b = B[i]; if (!b.free || b.size < n) continue;
    if (h.s === "first") return i;
    if (p < 0 || (h.s === "best" && b.size < B[p].size) || (h.s === "worst" && b.size > B[p].size)) p = i; }
  return p;
}
function hsAlloc(h, n, name){ const i = hsPick(h, n); if (i < 0) return -1; const b = h.B[i];
  if (b.size > n){ h.B.splice(i + 1, 0, {off: b.off + n, size: b.size - n, req: 0, free: true, name: ""}); b.size = n; }
  b.free = false; b.req = n; b.name = name || ""; h.rover = b.off + n; return i; }
function hsFree(h, off){ const b = h.B.find(x => x.off === off && !x.free); b.free = true; b.req = 0; b.name = "";
  for (let i = 0; i + 1 < h.B.length;){ if (h.B[i].free && h.B[i + 1].free){ h.B[i].size += h.B[i + 1].size; h.B.splice(i + 1, 1); } else i++; } }
function hsMetrics(B){ const f = B.filter(b => b.free).map(b => b.size);
  return {total: f.reduce((a, b) => a + b, 0), largest: f.length ? Math.max(...f) : 0, count: f.length}; }

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 660 230");
  const fg = css("--fg"), mu = css("--muted"), X0 = 20, BW = 620, sx = BW / 1100, Y = 80, H = 50;
  const d = el("defs", {});
  d.innerHTML = `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,6 l6,-6 M-1,1 l2,-2 M5,7 l2,-2" stroke="${fg}" stroke-width="0.9"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker>`;
  const FN = {0: "F1", 200: "F2", 600: "F3", 900: "F4"};
  s.B.forEach(b => {
    const isNew = !b.free && s.pick && b.off === s.pick[0];
    el("rect", {x: X0 + b.off * sx, y: Y, width: b.size * sx, height: H, fill: b.free ? css("--cell") : (isNew ? css("--cellhl") : css("--fg")), stroke: fg});
    if (b.free && s.rem && b.off === s.rem[0]) el("rect", {x: X0 + b.off * sx, y: Y, width: b.size * sx, height: H, fill: "url(#hp)", stroke: fg});
    const lab = b.free ? ((FN[b.off] && !(s.rem && b.off === s.rem[0]) ? FN[b.off] + " " : "") + b.size) : (isNew ? String(b.req) : "");
    if (b.size * sx > 22) el("text", {x: X0 + (b.off + b.size / 2) * sx, y: Y + H / 2 + 5, "text-anchor": "middle", "font-size": 13,
      "font-weight": isNew ? "bold" : "normal", fill: (b.free || isNew) ? fg : css("--bg")}, lab);
  });
  if (s.pick) el("rect", {x: X0 + s.pick[0] * sx, y: Y - 3, width: s.pick[1] * sx, height: H + 6, fill: "none", stroke: css("--hl"), "stroke-width": 3.5});
  if (s.rover !== null && s.rover !== undefined){ const x = X0 + s.rover * sx;
    el("line", {x1: x, y1: Y + H + 36, x2: x, y2: Y + H + 3, stroke: fg, "stroke-width": 1.6, "marker-end": "url(#ah)"});
    el("text", {x: x, y: Y + H + 50, "text-anchor": "middle", "font-size": 13}, `next-fit rover = ${s.rover}`); }
  for (let v = 0; v <= 1100; v += 100) el("text", {x: X0 + v * sx, y: Y - 10, "text-anchor": "middle", "font-size": 11, fill: mu}, String(v));
  const m = s.M;
  el("text", {x: X0, y: 30, "font-size": 14, "font-family": "ui-monospace,monospace"},
     `free_total = ${m.total} B   largest_free = ${m.largest} B   free_blocks = ${m.count}`);
  el("text", {x: X0, y: 222, "font-size": 12, fill: mu}, "sötét: foglalt · kék keret: választott blokk · világos: most kiosztott · vonalkázás: maradék");
}
let FT_ = null;
function ftStrategy(){ return document.querySelector('input[name="strat"]:checked').value; }
function ftLoad(){ FT_ = null; setSteps(ALL_[ftStrategy()]); }
document.querySelectorAll('input[name="strat"]').forEach(r => r.addEventListener("change", ftLoad));
document.getElementById("bReq").addEventListener("click", () => {
  const st = STEPS[pos.value | 0], n = Math.max(1, parseInt(document.getElementById("iReq").value, 10) || 1);
  const h = hsNew(st.B, ftStrategy(), st.rover === null || st.rover === undefined ? 0 : st.rover);
  const M = () => { const q = hsMetrics(h.B); return {total: q.total, largest: q.largest, count: q.count}; };
  const i = hsPick(h, n), base = STEPS.slice(0, (pos.value | 0) + 1), rv = () => (ftStrategy() === "next" ? h.rover : null);
  if (i < 0) { base.push({msg: `saját kérés ${n} B: nincs elég nagy szabad blokk → npos (sikertelen)`, line: -1, B: h.B, pick: null, rem: null, req: n, rover: rv(), M: M()}); }
  else { const po = h.B[i].off, ps = h.B[i].size; hsAlloc(h, n, String(n));
    base.push({msg: `saját kérés ${n} B → ${ps} B @${po}; maradék ${ps - n} B · free_blocks = ${M().count}, largest_free = ${M().largest} B`,
               line: -1, B: h.B, pick: [po, ps], rem: ps > n ? [po + n, ps - n] : null, req: n, rover: rv(), M: M()}); }
  setSteps(base); show(base.length - 1);
});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
