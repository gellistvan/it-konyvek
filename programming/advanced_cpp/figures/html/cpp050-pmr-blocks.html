<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMR upstream blokkok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Nézet: <select id="mode" onchange="show(k)" aria-label="Nézet"><option value="both">mindkét eset</option><option value="heap">csak heap</option><option value="mono">csak monotonic</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 15 kapacitásbővítés lépésenként: heap esetben minden bővítés új upstream kérés, monotonic esetben 8 upstream blokk, a régi vektorblokkok bent maradnak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">g++ 15.2.0, libstdc++, -std=c++20 -O2, x86-64, N = 10 000; helyben futtatott naplózás, implementációfüggő. Végállapot: 15 / 131 068 (heap) és 8 / 132 352 (monotonic).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "cap": 1, "req": 4, "blk": 0, "off": 0, "newup": true, "hc": [1, 4], "mc": [1, 1088], "line": 3, "msg": "1. bővítés: kapacitás 1 int, kért 4 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 1 / 4 B. Monotonic: ÚJ upstream blokk #1 (1088 B), a régi blokk bent marad → 1 / 1088 B."}, {"i": 1, "cap": 2, "req": 8, "blk": 0, "off": 4, "newup": false, "hc": [2, 12], "mc": [1, 1088], "line": 3, "msg": "2. bővítés: kapacitás 2 int, kért 8 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 2 / 12 B. Monotonic: a #1 blokkból, eltolás 4 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 2, "cap": 4, "req": 16, "blk": 0, "off": 12, "newup": false, "hc": [3, 28], "mc": [1, 1088], "line": 3, "msg": "3. bővítés: kapacitás 4 int, kért 16 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 3 / 28 B. Monotonic: a #1 blokkból, eltolás 12 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 3, "cap": 8, "req": 32, "blk": 0, "off": 28, "newup": false, "hc": [4, 60], "mc": [1, 1088], "line": 3, "msg": "4. bővítés: kapacitás 8 int, kért 32 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 4 / 60 B. Monotonic: a #1 blokkból, eltolás 28 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 4, "cap": 16, "req": 64, "blk": 0, "off": 60, "newup": false, "hc": [5, 124], "mc": [1, 1088], "line": 3, "msg": "5. bővítés: kapacitás 16 int, kért 64 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 5 / 124 B. Monotonic: a #1 blokkból, eltolás 60 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 5, "cap": 32, "req": 128, "blk": 0, "off": 124, "newup": false, "hc": [6, 252], "mc": [1, 1088], "line": 3, "msg": "6. bővítés: kapacitás 32 int, kért 128 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 6 / 252 B. Monotonic: a #1 blokkból, eltolás 124 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 6, "cap": 64, "req": 256, "blk": 0, "off": 252, "newup": false, "hc": [7, 508], "mc": [1, 1088], "line": 3, "msg": "7. bővítés: kapacitás 64 int, kért 256 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 7 / 508 B. Monotonic: a #1 blokkból, eltolás 252 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 7, "cap": 128, "req": 512, "blk": 0, "off": 508, "newup": false, "hc": [8, 1020], "mc": [1, 1088], "line": 3, "msg": "8. bővítés: kapacitás 128 int, kért 512 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 8 / 1020 B. Monotonic: a #1 blokkból, eltolás 508 B, nincs upstream kérés, a régi blokk bent marad → 1 / 1088 B."}, {"i": 8, "cap": 256, "req": 1024, "blk": 1, "off": 0, "newup": true, "hc": [9, 2044], "mc": [2, 2688], "line": 3, "msg": "9. bővítés: kapacitás 256 int, kért 1024 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 9 / 2044 B. Monotonic: ÚJ upstream blokk #2 (1600 B), a régi blokk bent marad → 2 / 2688 B."}, {"i": 9, "cap": 512, "req": 2048, "blk": 2, "off": 0, "newup": true, "hc": [10, 4092], "mc": [3, 5056], "line": 3, "msg": "10. bővítés: kapacitás 512 int, kért 2048 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 10 / 4092 B. Monotonic: ÚJ upstream blokk #3 (2368 B), a régi blokk bent marad → 3 / 5056 B."}, {"i": 10, "cap": 1024, "req": 4096, "blk": 3, "off": 0, "newup": true, "hc": [11, 8188], "mc": [4, 9216], "line": 3, "msg": "11. bővítés: kapacitás 1024 int, kért 4096 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 11 / 8188 B. Monotonic: ÚJ upstream blokk #4 (4160 B), a régi blokk bent marad → 4 / 9216 B."}, {"i": 11, "cap": 2048, "req": 8192, "blk": 4, "off": 0, "newup": true, "hc": [12, 16380], "mc": [5, 17472], "line": 3, "msg": "12. bővítés: kapacitás 2048 int, kért 8192 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 12 / 16380 B. Monotonic: ÚJ upstream blokk #5 (8256 B), a régi blokk bent marad → 5 / 17472 B."}, {"i": 12, "cap": 4096, "req": 16384, "blk": 5, "off": 0, "newup": true, "hc": [13, 32764], "mc": [6, 33920], "line": 3, "msg": "13. bővítés: kapacitás 4096 int, kért 16384 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 13 / 32764 B. Monotonic: ÚJ upstream blokk #6 (16448 B), a régi blokk bent marad → 6 / 33920 B."}, {"i": 13, "cap": 8192, "req": 32768, "blk": 6, "off": 0, "newup": true, "hc": [14, 65532], "mc": [7, 66752], "line": 3, "msg": "14. bővítés: kapacitás 8192 int, kért 32768 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 14 / 65532 B. Monotonic: ÚJ upstream blokk #7 (32832 B), a régi blokk bent marad → 7 / 66752 B."}, {"i": 14, "cap": 16384, "req": 65536, "blk": 7, "off": 0, "newup": true, "hc": [15, 131068], "mc": [8, 132352], "line": 3, "msg": "15. bővítés: kapacitás 16384 int, kért 65536 bájt. Heap: új upstream kérés, a régi blokk visszaadva → 15 / 131068 B. Monotonic: ÚJ upstream blokk #8 (65600 B), a régi blokk bent marad → 8 / 132352 B."}];
const CODE = ["std::pmr::vector<int> vec(resource);", "for (std::size_t i = 0; i < N; ++i)", "    vec.push_back(static_cast<int>(i));", "    // bővítéskor: resource->allocate(4 · új kapacitás, 4)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const UPH = [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536], UPM = [1088, 1600, 2368, 4160, 8256, 16448, 32832, 65600], VECM = [[4, 0, 0], [8, 0, 4], [16, 0, 12], [32, 0, 28], [64, 0, 60], [128, 0, 124], [256, 0, 252], [512, 0, 508], [1024, 1, 0], [2048, 2, 0], [4096, 3, 0], [8192, 4, 0], [16384, 5, 0], [32768, 6, 0], [65536, 7, 0]];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 430");
  svg.innerHTML = "";
  const mode = (document.getElementById("mode") || {value: "both"}).value;
  const X0 = 70, W = 470, lx = v => X0 + W * Math.log10(Math.max(v, 1)) / Math.log10(600000);
  let y = 8;
  function panel(title, rows, draw){
    el("text", {x: 6, y: y + 12, "font-size": 13, "font-weight": "bold"}, title);
    y += 20;
    rows.forEach((r, j) => { draw(r, j, y); y += 14; });
    y += 10;
  }
  if (mode !== "mono") panel(`(a) heap-backed – allocations = ${s.hc[0]}, bytes_allocated = ${s.hc[1]}`, UPH.slice(0, s.i + 1), (b, j, yy) => {
    const live = j === s.i;
    el("rect", {x: X0, y: yy, width: lx(b) - X0, height: 11, fill: live ? css("--hl") : css("--cell"),
                stroke: css("--line"), "stroke-dasharray": live ? "" : "2 2", "stroke-width": live ? 2 : 1});
    el("text", {x: 6, y: yy + 10, "font-size": 10, fill: css("--muted")}, "#" + (j + 1));
    el("text", {x: lx(b) + 4, y: yy + 10, "font-size": 10}, b + " B" + (live ? " – élő, új kérés" : " – visszaadva"));
  });
  if (mode !== "heap") {
    const used = UPM.slice(0, s.mc[0]);
    panel(`(b) monotonic – allocations = ${s.mc[0]}, bytes_allocated = ${s.mc[1]}`, used, (b, j, yy) => {
      el("rect", {x: X0, y: yy - 1, width: lx(b) - X0, height: 13, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2.5});
      VECM.forEach((v, r) => {
        if (v[1] !== j || r > s.i) return;
        const live = r === s.i, a = Math.max(v[2], 1);
        el("rect", {x: lx(a), y: yy + 2, width: Math.max(lx(v[2] + v[0]) - lx(a), 1.5), height: 7,
                    fill: live ? css("--hl") : css("--cellhl"), stroke: css("--line"), "stroke-width": live ? 1.5 : 0.6});
      });
      el("text", {x: 6, y: yy + 10, "font-size": 10, fill: css("--muted")}, "#" + (j + 1));
      el("text", {x: lx(b) + 4, y: yy + 10, "font-size": 10}, b + " B" + (j === s.blk ? (s.newup ? " – ÚJ upstream blokk" : " – innen, upstream kérés nélkül") : ""));
    });
  }
  el("text", {x: 6, y: Math.min(y + 8, 425), "font-size": 11, fill: css("--muted")},
     "logaritmikus bájtskála · kiemelt = élő vektorblokk · szürke = régi blokk (monotonic: bent marad; heap: visszaadva)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
