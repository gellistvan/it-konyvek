<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RingBuffer abszolút pozíció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N: <select id="nsel" onchange="doClear()" aria-label="Kapacitás"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label><label>érték: <input id="val" size="4" value="6" aria-label="Beszúrandó érték"></label><button onclick="doPush()">push_back(x)</button><button onclick="doPreset()">15.2.11: push_back(1…5)</button><button onclick="doClear()">Ürítés</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy cellás körpuffer 5, 2, 3, 4 tartalommal, head = 1; az abszolút pozíciók 1-től 4-ig a 2, 3, 4, 5 elemekre mutatnak, az 5-ös pozíció az end."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a 15.2.11 tesztje (RingBuffer<int, 4>, push_back 1…5). A push_back teli puffernél felülír; minden push_back érvényteleníti az iterátorokat, ezért a bejárás újraindul.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": null, "out": [], "line": 0, "msg": "push_back(1, 2, 3, 4, 5) után: head_ = 1, size_ = 4; begin = 1, end = 5 (abszolút pozíció)"}, {"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": 1, "out": [2], "line": 2, "msg": "it.abs_pos_ = 1 → data_[1 % 4] = data_[1] = 2; kimenet: 2"}, {"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": 2, "out": [2, 3], "line": 2, "msg": "it.abs_pos_ = 2 → data_[2 % 4] = data_[2] = 3; kimenet: 2 3"}, {"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": 3, "out": [2, 3, 4], "line": 2, "msg": "it.abs_pos_ = 3 → data_[3 % 4] = data_[3] = 4; kimenet: 2 3 4"}, {"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": 4, "out": [2, 3, 4, 5], "line": 2, "msg": "it.abs_pos_ = 4 → data_[4 % 4] = data_[0] = 5; kimenet: 2 3 4 5"}, {"n": 4, "data": [5, 2, 3, 4], "over": {"0": 1}, "head": 1, "size": 4, "b": 1, "e": 5, "log": [1, 2, 3, 4, 5], "cur": 5, "out": [2, 3, 4, 5], "line": 1, "msg": "it.abs_pos_ = 5 == end → a ciklus véget ér; kimenet: 2 3 4 5"}];
const CODE = ["for (auto it = rb.begin(); ", "     it != rb.end();          // abs_pos_ összehasonlítása", "     ++it) out(*it);          // *it = data_[abs_pos_ % N]; ++abs_pos_"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let RB = {n: 4, data: [null, null, null, null], over: {}, head: 0, size: 0, next: 1, log: []};
function rbPush(v){
  const r = RB;
  if (r.size < r.n) { r.data[(r.head + r.size) % r.n] = v; r.size++; }
  else { r.over[r.head] = r.data[r.head]; r.data[r.head] = v; r.head = (r.head + 1) % r.n; }
  r.log.push(v); r.next = v + 1;
}
function rbSteps(){
  const r = RB, b = r.head, e = r.head + r.size, st = [];
  const snap = {n: r.n, data: r.data.slice(), over: Object.assign({}, r.over), head: r.head, size: r.size, b, e, log: r.log.slice()};
  st.push(Object.assign({cur: null, out: [], line: 0, msg: r.size === 0 ? "Üres puffer: begin = end = " + b + " (head_ = " + r.head + ", size_ = 0)" :
    `push_back(${r.log.join(", ")}) után: head_ = ${r.head}, size_ = ${r.size}; begin = ${b}, end = ${e} (abszolút pozíció)`}, snap));
  const out = [];
  for (let p = b; p < e; p++) {
    out.push(r.data[p % r.n]);
    st.push(Object.assign({cur: p, out: out.slice(), line: 2, msg: `it.abs_pos_ = ${p} → data_[${p} % ${r.n}] = data_[${p % r.n}] = ${r.data[p % r.n]}; kimenet: ${out.join(" ")}`}, snap));
  }
  st.push(Object.assign({cur: e, out: out.slice(), line: 1, msg: `it.abs_pos_ = ${e} == end → a ciklus véget ér; kimenet: ${out.join(" ") || "(üres)"}`}, snap));
  return st;
}
function rbReset(n){ RB = {n, data: Array(n).fill(null), over: {}, head: 0, size: 0, next: 1, log: []}; }
function doPush(){ const f = document.getElementById("val"); let v = parseInt(f.value, 10); if (!Number.isFinite(v)) v = RB.next; rbPush(v); f.value = RB.next; setSteps(rbSteps()); }
function doPreset(){ rbReset(+document.getElementById("nsel").value); [1,2,3,4,5].forEach(rbPush); document.getElementById("val").value = RB.next; setSteps(rbSteps()); }
function doClear(){ rbReset(+document.getElementById("nsel").value); document.getElementById("val").value = 1; setSteps(rbSteps()); }

function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const n = s.n, CW = Math.min(64, 440 / n), XP = 90, YP = 50;
  el("text", {x: XP - 8, y: YP + CW/2 + 5, "text-anchor": "end", "font-size": 13}, "data_");
  for (let i = 0; i < n; i++) {
    const on = s.cur !== null && s.cur < s.e && s.cur % n === i;
    el("rect", {x: XP + i*CW, y: YP, width: CW, height: CW, fill: on ? css("--hl") : (i === s.head ? css("--cellhl") : css("--cell")), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: XP + i*CW + CW/2, y: YP + CW/2 + 7, "text-anchor": "middle", "font-size": 20, fill: on ? "#fff" : css("--fg")}, s.data[i] === null ? "·" : String(s.data[i]));
    el("text", {x: XP + i*CW + CW/2, y: YP - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "[" + i + "]");
    if (s.over[i] !== undefined) { el("text", {x: XP + i*CW + 10, y: YP + 15, "font-size": 11, fill: css("--muted")}, String(s.over[i]));
      el("line", {x1: XP + i*CW + 6, y1: YP + 18, x2: XP + i*CW + 22, y2: YP + 4, stroke: css("--line")}); }
  }
  el("text", {x: XP + n*CW + 12, y: YP + 20, "font-size": 13}, `head_ = ${s.head}`);
  el("text", {x: XP + n*CW + 12, y: YP + 40, "font-size": 13}, `size_ = ${s.size}`);
  // abszolút pozíciók
  const YA = 190, AW = Math.min(56, 520 / Math.max(1, s.e - s.b + 1));
  el("text", {x: XP - 8, y: YA + 22, "text-anchor": "end", "font-size": 13}, "abs_pos_");
  for (let p = s.b; p <= s.e; p++) {
    const x = XP + (p - s.b) * AW, isEnd = p === s.e, on = p === s.cur;
    el("rect", {x: x + 4, y: YA, width: AW - 8, height: 34, fill: on ? css("--hl2") : css("--cell"), stroke: css("--line"), "stroke-dasharray": isEnd ? "5 3" : "", "stroke-width": on ? 3 : 1});
    el("text", {x: x + AW/2, y: YA + 23, "text-anchor": "middle", "font-size": 16, fill: on ? "#fff" : css("--fg")}, String(p));
    if (!isEnd) el("line", {x1: x + AW/2, y1: YA - 2, x2: XP + (p % n) * CW + CW/2, y2: YP + CW + 2, stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 2.5 : 1});
    if (p === s.b) el("text", {x: x + AW/2, y: YA + 52, "text-anchor": "middle", "font-size": 12}, "begin");
    if (isEnd) el("text", {x: x + AW/2, y: YA + (p === s.b ? 66 : 52), "text-anchor": "middle", "font-size": 12}, "end");
  }
  el("text", {x: 20, y: 290, "font-size": 15}, "for (int x : rb) kimenet: " + (s.out.length ? s.out.join(" ") : "—"));
  const pe = (s.head + s.size) % n;
  el("text", {x: 20, y: 318, "font-size": 12, fill: css("--muted")},
     `Ellenpélda (fizikai index tárolása): begin = ${s.head}, end = (${s.head} + ${s.size}) % ${n} = ${pe}` + (s.size === n ? " → begin == end, üres bejárás!" : ""));
}

rbReset(4); [1,2,3,4,5].forEach(rbPush);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
