<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bump allocation: current_ és igazítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>méret n <input id="iN" type="number" min="1" max="1024" value="1" style="width:5em"></label>
<label>igazítás <input id="iA" type="number" min="1" max="256" value="8" style="width:4.5em"></label>
<button id="bAlloc">allocate</button><button id="bDestroy">destroy (utolsó élő)</button>
<button id="bReset">reset</button><button id="bDemo">demo() lépései</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bájtsáv a MonotonicArena elejéről a begin_, current_ és end_ mutatókkal; a demo két foglalása, destroy_at, reset és egy igazítási rés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 20.1.4 MonotonicArena::allocate hű átirata (std::align). Méretek: x86-64, g++ 15.2/libstdc++ (sizeof(Point) = 8, alignof = 4; sizeof(NamedValue) = 40, alignof = 8), platformfüggők. A saját bemenet új (üres) arénán indul; a sáv 64 bájtnál hosszabb tartalomnál átméreteződik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. lépés: MonotonicArena arena(1024) – current_ = begin_ (eltolás 0), end_ = begin_ + 1024", "line": -1, "cur": 0, "blocks": [], "pads": [], "ptrs": [], "info": ""}, {"msg": "1. allocate(sizeof(Point) = 8, alignof(Point) = 4): std::align sikeres, p1 = begin_ + 0, current_ = 8, space = 1016", "line": 4, "cur": 8, "blocks": [{"a": 0, "b": 8, "label": "Point{1,2}", "st": "live"}], "pads": [], "ptrs": [{"name": "p1", "off": 0, "ok": true}], "info": ""}, {"msg": "2. allocate(sizeof(NamedValue) = 40, alignof(NamedValue) = 8): az eltolás 8 már igazított, p2 = begin_ + 8, current_ = 48", "line": 4, "cur": 48, "blocks": [{"a": 0, "b": 8, "label": "Point{1,2}", "st": "live"}, {"a": 8, "b": 48, "label": "NamedValue{\"test\", 42}", "st": "live"}], "pads": [], "ptrs": [{"name": "p1", "off": 0, "ok": true}, {"name": "p2", "off": 8, "ok": true}], "info": ""}, {"msg": "3. std::destroy_at(p2): a [8, 48) tartományban nincs élő objektum, de a memória a resetig foglalt marad (deallocate no-op)", "line": 10, "cur": 48, "blocks": [{"a": 0, "b": 8, "label": "Point{1,2}", "st": "live"}, {"a": 8, "b": 48, "label": "NamedValue{\"test\", 42}", "st": "dead"}], "pads": [], "ptrs": [{"name": "p1", "off": 0, "ok": true}, {"name": "p2", "off": 8, "ok": true}], "info": ""}, {"msg": "4. reset(): current_ = begin_ = 0. A régi bájtok ott maradnak, de p1 és p2 érvénytelen (ugyanoda mutat, mégsem szabad használni)", "line": 9, "cur": 0, "blocks": [{"a": 0, "b": 8, "label": "Point{1,2}", "st": "stale"}, {"a": 8, "b": 48, "label": "NamedValue{\"test\", 42}", "st": "stale"}], "pads": [], "ptrs": [{"name": "p1", "off": 0, "ok": false}, {"name": "p2", "off": 8, "ok": false}], "info": ""}, {"msg": "2b (változat, új arénán): allocate(1, 1) → [0, 1), current_ = 1", "line": 4, "cur": 1, "blocks": [{"a": 0, "b": 1, "label": "1 B", "st": "live"}], "pads": [], "ptrs": [{"name": "q1", "off": 0, "ok": true}], "info": ""}, {"msg": "2b: allocate(8, 8): std::align 1-ről 8-ra kerekít → igazítási rés [1, 8) = 7 B, q2 = begin_ + 8, current_ = 16", "line": 4, "cur": 16, "blocks": [{"a": 0, "b": 1, "label": "1 B", "st": "live"}, {"a": 8, "b": 16, "label": "8 B", "st": "live"}], "pads": [[1, 8]], "ptrs": [{"name": "q1", "off": 0, "ok": true}, {"name": "q2", "off": 8, "ok": true}], "info": ""}];
const CODE = ["void* allocate(std::size_t n, std::size_t alignment = alignof(std::max_align_t)) {", "    std::size_t space = static_cast<std::size_t>(end_ - current_);", "    void* aligned = current_;", "    if (std::align(alignment, n, aligned, space)) {", "        current_ = static_cast<std::byte*>(aligned) + n;", "        return aligned;", "    }", "    throw std::bad_alloc{};", "}", "void reset() noexcept { current_ = begin_; }", "std::destroy_at(p2);   // demo(): a nem triviális NamedValue destruktora a reset előtt"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SHADE_ = {live: "--cellhl", dead: "--cell", stale: "--code"};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 230");
  const fg = css("--fg"), mu = css("--muted");
  const d = el("defs", {});
  d.innerHTML = `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,6 l6,-6 M-1,1 l2,-2 M5,7 l2,-2" stroke="${fg}" stroke-width="0.9"/></pattern>
  <pattern id="dp" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="${fg}"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker>`;
  let hi = s.cur; s.blocks.forEach(b => hi = Math.max(hi, b.b));
  const win = Math.min(1024, Math.max(64, Math.ceil(hi / 32) * 32)), X0 = 50, BW = 650, sx = BW / win, Y = 100;
  const X = v => X0 + v * sx;
  el("rect", {x: X0, y: Y, width: BW, height: 36, fill: css("--bg"), stroke: fg});
  const tick = win <= 64 ? 8 : (win <= 256 ? 32 : 128);
  for (let v = 0; v <= win; v += tick){ el("line", {x1: X(v), x2: X(v), y1: Y, y2: Y + 36, stroke: mu, "stroke-width": 0.6});
    el("text", {x: X(v), y: Y + 52, "text-anchor": "middle", "font-size": 12, fill: mu}, String(v)); }
  if (win < 1024) el("text", {x: X(win) + 8, y: Y + 24, "font-size": 18}, "…");
  s.pads.forEach(([a, b]) => { el("rect", {x: X(a), y: Y, width: (b - a) * sx, height: 36, fill: "url(#hp)", stroke: fg});
    el("text", {x: X((a + b) / 2), y: Y - 8, "text-anchor": "middle", "font-size": 12}, `rés ${b - a} B`); });
  s.blocks.forEach(b => {
    el("rect", {x: X(b.a), y: Y, width: (b.b - b.a) * sx, height: 36, fill: css(SHADE_[b.st]), stroke: fg,
      "stroke-width": b.st === "live" ? 2 : 1, "stroke-dasharray": b.st === "live" ? "" : "2 2"});
    if (b.st === "dead") el("rect", {x: X(b.a), y: Y, width: (b.b - b.a) * sx, height: 36, fill: "url(#dp)", stroke: "none"});
    const lab = b.st === "live" ? b.label : (b.st === "dead" ? "nincs élő obj." : b.label + " (régi)");
    if ((b.b - b.a) * sx > 60) el("text", {x: X((b.a + b.b) / 2), y: Y + 23, "text-anchor": "middle", "font-size": 12,
      fill: b.st === "stale" ? mu : fg}, lab);
  });
  s.ptrs.forEach((p, i) => { const x = X(p.off) + 4, ty = 30 + (i % 3) * 18;
    el("line", {x1: x + 12, y1: ty + 4, x2: x, y2: Y - 2, stroke: p.ok ? fg : mu, "stroke-width": 1.3,
      "stroke-dasharray": p.ok ? "" : "4 3", "marker-end": "url(#ah)"});
    el("text", {x: x + 14, y: ty, "font-size": 13, fill: p.ok ? fg : mu}, p.name + (p.ok ? "" : " (érvénytelen)")); });
  el("line", {x1: X(0) - 20, y1: Y + 80, x2: X(0), y2: Y + 38, stroke: fg, "stroke-width": 1.3, "marker-end": "url(#ah)"});
  el("text", {x: X(0) - 40, y: Y + 94, "font-size": 13}, "begin_");
  el("line", {x1: X(s.cur) + 16, y1: Y + 86, x2: X(s.cur), y2: Y + 38, stroke: css("--hl"), "stroke-width": 2.6, "marker-end": "url(#ah)"});
  el("text", {x: X(s.cur) + 18, y: Y + 100, "font-size": 14, "font-weight": "bold", fill: css("--hl")}, `current_ = ${s.cur}`);
  el("text", {x: 750, y: Y + 100, "text-anchor": "end", "font-size": 13}, "end_ = begin_ + 1024 →");
  el("text", {x: 750, y: 20, "text-anchor": "end", "font-size": 13, fill: mu},
     `space = end_ − current_ = ${1024 - s.cur} B` + (s.info ? " · " + s.info : ""));
}
// ---- saját bemenet: a MonotonicArena::allocate (std::align) átirata ----
let AR_ = null;
function arClone(){ return JSON.parse(JSON.stringify(AR_)); }
function arPush(msg, line, info){ AR_.hist.push(Object.assign(arClone().st, {msg, line, info: info || ""})); setSteps(AR_.hist.slice()); show(AR_.hist.length - 1); }
function arInit(){ if (!AR_) AR_ = {st: {cur: 0, blocks: [], pads: [], ptrs: []}, hist: [], n: 0}; }
document.getElementById("bAlloc").addEventListener("click", () => {
  arInit();
  const n = Math.max(1, parseInt(document.getElementById("iN").value, 10) || 1);
  const al = parseInt(document.getElementById("iA").value, 10) || 1;
  if (al & (al - 1)) { status.textContent = "Az igazítás 2-hatvány kell legyen (a std::align előfeltétele)."; return; }
  const s = AR_.st, a = Math.ceil(s.cur / al) * al, space = 1024 - s.cur;
  if (n + (a - s.cur) > space) { arPush(`allocate(${n}, ${al}): std::align → nullptr (space = ${space} B) → throw std::bad_alloc`, 7, "bad_alloc"); return; }
  const pad = a - s.cur;
  if (pad > 0) s.pads.push([s.cur, a]);
  AR_.n += 1; const nm = "m" + AR_.n;
  s.blocks.push({a, b: a + n, label: `${n} B`, st: "live"}); s.ptrs.push({name: nm, off: a, ok: true});
  s.cur = a + n;
  arPush(`allocate(${n}, ${al}): std::align sikeres, ${nm} = begin_ + ${a}` + (pad > 0 ? `, igazítási rés ${pad} B` : "") + `, current_ = ${s.cur}`, 4);
});
document.getElementById("bDestroy").addEventListener("click", () => {
  arInit(); const s = AR_.st, b = [...s.blocks].reverse().find(x => x.st === "live");
  if (!b) { status.textContent = "Nincs élő objektum."; return; }
  b.st = "dead"; arPush(`destroy_at: a [${b.a}, ${b.b}) tartományban nincs élő objektum; a memória a resetig foglalt`, 10);
});
document.getElementById("bReset").addEventListener("click", () => {
  arInit(); const s = AR_.st; s.cur = 0; s.pads = [];
  s.blocks.forEach(b => b.st = "stale"); s.ptrs.forEach(p => p.ok = false);
  arPush("reset(): current_ = begin_; a régi mutatók érvénytelenek, a bájtok tartalma megmaradt", 9);
  s.blocks = []; s.ptrs = [];
});
document.getElementById("bDemo").addEventListener("click", () => { AR_ = null; setSteps(DEMO_); });
const DEMO_ = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
