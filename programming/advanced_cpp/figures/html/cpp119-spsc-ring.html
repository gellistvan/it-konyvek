<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPSC ring buffer</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>:root{--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}@media (prefers-color-scheme:dark){:root{--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}</style><label>érték <input id="pval" type="number" value="14" aria-label="push értéke"></label><button id="bpush" type="button">push(érték)</button><button id="bpop" type="button">pop()</button><label><input id="rel" type="checkbox"> relaxed sorrend (hibás)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy rekeszes körpuffer: három push után a negyedik visszautasítva, mert egy rés üresen marad; a termelő release tárolása és a fogyasztó acquire olvasása szinkronizációs élt hoz létre, relaxed sorrenddel ez az él hiányzik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">SpscRingBuffer&lt;int, 4&gt; (31.2.9), a 7 előre beállított lépés g++ 15.2-vel futtatva; a push/pop gombok a JS-ben ugyanazt a logikát követik (egy szálon). C++20 memóriamodell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. Kezdet: read_ = 0, write_ = 0 – üres (read_ == write_).", "r": 0, "w": 0, "buf": [0, 0, 0, 0], "op": "init", "res": "-", "line": -1}, {"msg": "1. push(10) → true: buffer_[0] = 10, write_ = 1 (release tárolás); 1 elem.", "r": 0, "w": 1, "buf": [10, 0, 0, 0], "op": "push(10)", "res": "true", "line": 5}, {"msg": "2. push(11) → true: buffer_[1] = 11, write_ = 2 (release tárolás); 2 elem.", "r": 0, "w": 2, "buf": [10, 11, 0, 0], "op": "push(11)", "res": "true", "line": 5}, {"msg": "3. push(12) → true: buffer_[2] = 12, write_ = 3 (release tárolás); 3 elem.", "r": 0, "w": 3, "buf": [10, 11, 12, 0], "op": "push(12)", "res": "true", "line": 5}, {"msg": "4. push(13) → false: (3+1)%4 == read_ (0) – teli: 3 elem tárolva, N−1 = 3; egy rés mindig kimarad.", "r": 0, "w": 3, "buf": [10, 11, 12, 0], "op": "push(13)", "res": "false", "line": 3}, {"msg": "5. pop() → 10: read_ = 1 (release tárolás); 2 elem.", "r": 1, "w": 3, "buf": [10, 11, 12, 0], "op": "pop()", "res": "10", "line": 12}, {"msg": "6. push(13) → true: buffer_[3] = 13, write_ = 0 (release tárolás); 3 elem.", "r": 1, "w": 0, "buf": [10, 11, 12, 13], "op": "push(13)", "res": "true", "line": 5}];
const CODE = ["bool push(const T& value) {", "    const auto write_idx = write_.load(std::memory_order_relaxed);", "    const auto next_idx = (write_idx + 1) % N;", "    if (next_idx == read_.load(std::memory_order_acquire)) return false; // full", "    buffer_[write_idx] = value;", "    write_.store(next_idx, std::memory_order_release);", "    return true;", "}", "std::optional<T> pop() {", "    const auto read_idx = read_.load(std::memory_order_relaxed);", "    if (read_idx == write_.load(std::memory_order_acquire)) return std::nullopt; // empty", "    T value = buffer_[read_idx];", "    read_.store((read_idx + 1) % N, std::memory_order_release);", "    return value;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let RELAXED = false;
const NN = 4;
function render(s){
  svg.setAttribute("viewBox", "0 0 560 330");
  svg.innerHTML = "";
  const cx = 130, cy = 140, R1 = 95, R0 = 45;
  const n = ((s.w - s.r) % NN + NN) % NN;
  const fullGap = s.op.startsWith("push") && s.res === "false";
  for (let j = 0; j < NN; j++) {
    const a0 = -Math.PI / 2 + j * 2 * Math.PI / NN, a1 = a0 + 2 * Math.PI / NN;
    const p = (r, a) => (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
    const occ = ((j - s.r) % NN + NN) % NN < n;
    const gap = fullGap && j === s.w;
    el("path", {d: `M${p(R0, a0)} L${p(R1, a0)} A${R1} ${R1} 0 0 1 ${p(R1, a1)} L${p(R0, a1)} A${R0} ${R0} 0 0 0 ${p(R0, a0)} Z`,
      fill: occ ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1.4,
      "stroke-dasharray": gap ? "3 3" : ""});
    const am = (a0 + a1) / 2;
    el("text", {x: cx + 70 * Math.cos(am), y: cy + 70 * Math.sin(am) + 6, "text-anchor": "middle", "font-size": 18}, occ ? String(s.buf[j]) : (gap ? "rés" : ""));
    el("text", {x: cx + 110 * Math.cos(am), y: cy + 110 * Math.sin(am) + 5, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(j));
    const lbl = [];
    if (j === s.r) lbl.push("read_");
    if (j === s.w) lbl.push("write_");
    if (lbl.length) el("text", {x: cx + 140 * Math.cos(am), y: cy + 140 * Math.sin(am) + 5, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: css("--hl")}, lbl.join(" = "));
  }
  el("text", {x: cx, y: cy + 6, "text-anchor": "middle", "font-size": 14}, n + " / " + (NN - 1));
  el("text", {x: cx, y: 316, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "read_ = " + s.r + ", write_ = " + s.w + ", tárolt elem: " + n);
  // idővonal
  const x0 = 300, bad = RELAXED;
  el("text", {x: 430, y: 30, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: bad ? "#c00000" : css("--fg")}, bad ? "relaxed: nincs szinkronizáció" : "release / acquire");
  [["termelő", 70, "buffer_[w] = v", "write_.store(" + (bad ? "relaxed" : "release") + ")"],
   ["fogyasztó", 200, "write_.load(" + (bad ? "relaxed" : "acquire") + ")", "buffer_[r] olvasás"]].forEach(([who, y, a, b]) => {
    el("text", {x: x0, y: y - 18, "font-size": 13, fill: css("--muted")}, who);
    el("rect", {x: x0, y: y - 10, width: 118, height: 36, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: x0 + 59, y: y + 13, "text-anchor": "middle", "font-size": 11.5}, a);
    el("rect", {x: x0 + 128, y: y - 10, width: 126, height: 36, fill: css("--cell"), stroke: css("--line")});
    el("text", {x: x0 + 191, y: y + 13, "text-anchor": "middle", "font-size": 11.5}, b);
  });
  el("line", {x1: x0 + 191, y1: 96, x2: x0 + 59, y2: 190, stroke: bad ? "#c00000" : css("--fg"), "stroke-width": bad ? 1.5 : 3.5, "stroke-dasharray": bad ? "6 4" : ""});
  el("polygon", {points: `${x0 + 59},190 ${x0 + 62},178 ${x0 + 71},185`, fill: bad ? "#c00000" : css("--fg")});
  if (bad) {
    el("text", {x: x0 + 125, y: 150, "text-anchor": "middle", "font-size": 26, "font-weight": "bold", fill: "#c00000"}, "✕");
    el("text", {x: 430, y: 255, "text-anchor": "middle", "font-size": 13, fill: "#c00000"}, "a fogyasztó a régi buffer_ értéket láthatja:");
    el("text", {x: 430, y: 273, "text-anchor": "middle", "font-size": 13, fill: "#c00000"}, "adatverseny, UB (TSan jelzi)");
  } else {
    el("text", {x: x0 + 140, y: 150, "font-size": 13, "font-style": "italic"}, "szinkronizál-vele");
    el("text", {x: 430, y: 255, "text-anchor": "middle", "font-size": 13}, "→ happens-before: a buffer_[w] írása");
    el("text", {x: 430, y: 273, "text-anchor": "middle", "font-size": 13}, "látható a buffer_[r] olvasásakor");
  }
}
function ringNext(op, val){
  const s = STEPS[k];
  const t = {r: s.r, w: s.w, buf: s.buf.slice(), op: op, res: ""};
  const idx = STEPS.length;
  if (op === "pop()") {
    if (t.r === t.w) { t.res = "nullopt"; t.msg = idx + ". pop() → std::nullopt: read_ == write_ (" + t.r + ") – üres."; t.line = 10; }
    else { t.res = String(t.buf[t.r]); t.r = (t.r + 1) % NN; t.msg = idx + ". pop() → " + t.res + ": read_ = " + t.r + " (release tárolás); " + (((t.w - t.r) % NN + NN) % NN) + " elem."; t.line = 12; }
  } else {
    const nx = (t.w + 1) % NN;
    if (nx === t.r) { t.res = "false"; t.msg = idx + ". " + op + " → false: (" + t.w + "+1)%" + NN + " == read_ (" + t.r + ") – teli: " + (NN - 1) + " elem, N−1; egy rés mindig kimarad."; t.line = 3; }
    else { t.buf[t.w] = val; t.res = "true"; t.msg = idx + ". " + op + " → true: buffer_[" + t.w + "] = " + val + ", write_ = " + nx + " (release tárolás); " + (((nx - t.r) % NN + NN) % NN) + " elem."; t.w = nx; t.line = 5; }
  }
  const list = STEPS.slice(0, k + 1); list.push(t);
  setSteps(list); show(list.length - 1);
}
document.getElementById("bpush").addEventListener("click", () => {
  const v = parseInt(document.getElementById("pval").value, 10) || 0; ringNext("push(" + v + ")", v);
  document.getElementById("pval").value = v + 1; });
document.getElementById("bpop").addEventListener("click", () => ringNext("pop()"));
document.getElementById("pval").addEventListener("keydown", e => e.stopPropagation());
document.getElementById("rel").addEventListener("change", e => { RELAXED = e.target.checked; show(k); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
