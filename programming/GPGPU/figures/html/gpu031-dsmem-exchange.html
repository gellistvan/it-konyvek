<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSMEM-csere kétblokkos klaszterben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="nos" type="checkbox" onchange="toggle()"> második cluster.sync() nélkül (hibás változat)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Block 0 a map_shared_rank-kel Block 1 smem[0]=1000 értékét olvassa; két cluster.sync() fogja közre az olvasást."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">__cluster_dims__(2,1,1), 1 klaszter, 256 szál/blokk, 1024 B shared/blokk, CC 9.0+ (9.2.5 kernel). A lépések sorrendet mutatnak, nem mért időt; a hibás változat egy lehetséges ütemezés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "line": 0, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "1/5 Inicializálás: Block 0 smem = 0, 1, …, 255; Block 1 smem = 1000, …, 1255. d_result = (−1, −1)."}, {"ph": 1, "line": 1, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "2/5 cluster.sync() #1: mindkét blokk minden szála megérkezett, az írások a klaszterben láthatók."}, {"ph": 2, "line": 2, "res": [-1, -1], "arrows": 1, "exit": [0, 0], "bad": 0, "msg": "3/5 map_shared_rank: a saját smem címéből a másik blokk ugyanazon eltolású címe lesz."}, {"ph": 3, "line": 3, "res": [0, 0], "arrows": 2, "exit": [0, 0], "bad": 0, "msg": "4/5 Olvasás (tid 0): Block 0 → 1000, Block 1 → 0; egyezik a várttal, d_result = (0, 0)."}, {"ph": 4, "line": 4, "res": [0, 0], "arrows": 2, "exit": [1, 1], "bad": 0, "msg": "5/5 cluster.sync() #2 (kilépés tiltva): csak most léphetnek ki a blokkok, a shared memória addig él."}];
const CODE = ["smem[tid] = block_rank * 1000 + tid;                 // 1. inicializálás", "cluster.sync();                                      // 2. #1: a klaszter minden írása látható", "int* remote_smem = cluster.map_shared_rank(smem, 1 - block_rank);", "if (tid == 0) d_result[block_rank] = (remote_smem[0] == (1-block_rank)*1000) ? 0 : 1;", "cluster.sync();                                      // 7. #2: amíg a másik olvas, senki nem lép ki"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 380");
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${css("--muted")}"/></pattern><pattern id="ps" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  const cells = [0, 1, 2, -1, 255];
  [0, 1].forEach(b => {
    const x0 = b ? 420 : 40;
    el("rect", {x: x0 - 10, y: 40, width: 300, height: 110, fill: "none", stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": s.exit[b] && !s.bad && s.ph < 4 ? "6 4" : "none"});
    el("text", {x: x0 + 140, y: 60, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "Block " + b + (s.exit[b] ? " (kilépett)" : ""));
    cells.forEach((t, k) => {
      el("rect", {x: x0 + k * 56, y: 75, width: 56, height: 34, fill: t < 0 ? css("--cell") : (b ? "url(#ps)" : "url(#pd)"), stroke: css("--line")});
      el("rect", {x: x0 + k * 56 + 8, y: 82, width: 40, height: 20, fill: css("--bg"), opacity: 0.85});
      el("text", {x: x0 + k * 56 + 28, y: 97, "text-anchor": "middle", "font-size": 13}, t < 0 ? "…" : String(b * 1000 + t));
      if (t >= 0) el("text", {x: x0 + k * 56 + 28, y: 125, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "[" + t + "]");
    });
    if (s.ph < 1) el("text", {x: x0 + 140, y: 143, "text-anchor": "middle", "font-size": 12}, "smem[tid] = " + b + "·1000 + tid");
  });
  if (s.arrows >= 1) {
    const ok = s.arrows !== 4;
    el("path", {d: "M68,72 C200,22 360,22 448,72", fill: "none", stroke: s.arrows === 4 ? css("--hl2") : css("--fg"), "stroke-width": 2.5, "marker-end": "url(#ah)", "stroke-dasharray": s.arrows === 4 ? "6 4" : "none"});
    el("text", {x: 258, y: 20, "text-anchor": "middle", "font-size": 13, fill: s.arrows === 4 ? css("--hl2") : css("--fg")},
       "Block 0: map_shared_rank(smem, 1)[0]" + (s.arrows === 2 ? " → 1000" : s.arrows === 4 ? " → definiálatlan ×" : ""));
    if (s.arrows !== 4 || true) {
      el("path", {d: "M448,112 C360,190 200,190 68,112", fill: "none", stroke: css("--fg"), "stroke-width": 2.5, "stroke-dasharray": "8 4", "marker-end": "url(#ah)"});
      el("text", {x: 258, y: 182, "text-anchor": "middle", "font-size": 13}, "Block 1: map_shared_rank(smem, 0)[0]" + (s.arrows >= 2 ? " → 0" : ""));
    }
  }
  // idővonal
  const names = ["init", "sync #1", "leképezés", "olvasás + d_result", "sync #2 / kilépés"];
  names.forEach((n, i) => {
    const x = 40 + i * 140, on = i === s.ph, sync = i === 1 || i === 4;
    el("rect", {x: x, y: 215, width: 130, height: 34, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1});
    el("text", {x: x + 65, y: 237, "text-anchor": "middle", "font-size": 12, "font-weight": sync ? "bold" : "normal"}, n);
  });
  el("text", {x: 600, y: 270, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, document.getElementById("nos").checked ? "(itt nincs barrier!)" : "kilépés tiltva, amíg a másik olvas");
  el("text", {x: 180, y: 270, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "láthatóság");
  // d_result tábla
  el("text", {x: 40, y: 310, "font-size": 13, "font-weight": "bold"}, "d_result");
  [0, 1].forEach(b => {
    const v = s.res[b], bad = v === "?";
    el("rect", {x: 120 + b * 90, y: 292, width: 80, height: 28, fill: bad ? css("--hl2") : css("--cell"), stroke: css("--line")});
    el("text", {x: 160 + b * 90, y: 311, "text-anchor": "middle", "font-size": 14}, bad ? "?" : String(v).replace("-", "−"));
    el("text", {x: 160 + b * 90, y: 338, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "[" + b + "]");
  });
  el("text", {x: 320, y: 311, "font-size": 12, fill: css("--muted")}, "−1: még nem írt · 0: a távoli érték egyezik a várttal · 1: eltér");
}
const OK = [{"ph": 0, "line": 0, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "1/5 Inicializálás: Block 0 smem = 0, 1, …, 255; Block 1 smem = 1000, …, 1255. d_result = (−1, −1)."}, {"ph": 1, "line": 1, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "2/5 cluster.sync() #1: mindkét blokk minden szála megérkezett, az írások a klaszterben láthatók."}, {"ph": 2, "line": 2, "res": [-1, -1], "arrows": 1, "exit": [0, 0], "bad": 0, "msg": "3/5 map_shared_rank: a saját smem címéből a másik blokk ugyanazon eltolású címe lesz."}, {"ph": 3, "line": 3, "res": [0, 0], "arrows": 2, "exit": [0, 0], "bad": 0, "msg": "4/5 Olvasás (tid 0): Block 0 → 1000, Block 1 → 0; egyezik a várttal, d_result = (0, 0)."}, {"ph": 4, "line": 4, "res": [0, 0], "arrows": 2, "exit": [1, 1], "bad": 0, "msg": "5/5 cluster.sync() #2 (kilépés tiltva): csak most léphetnek ki a blokkok, a shared memória addig él."}], BAD = [{"ph": 0, "line": 0, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "1/5 Inicializálás: Block 0 smem = 0, 1, …, 255; Block 1 smem = 1000, …, 1255. d_result = (−1, −1)."}, {"ph": 1, "line": 1, "res": [-1, -1], "arrows": 0, "exit": [0, 0], "bad": 0, "msg": "2/5 cluster.sync() #1: mindkét blokk minden szála megérkezett, az írások a klaszterben láthatók."}, {"ph": 2, "line": 2, "res": [-1, -1], "arrows": 1, "exit": [0, 0], "bad": 0, "msg": "3/5 map_shared_rank: a saját smem címéből a másik blokk ugyanazon eltolású címe lesz."}, {"ph": 3, "line": 3, "res": [-1, 0], "arrows": 3, "exit": [0, 1], "bad": 0, "msg": "4/5 (2. sync nélkül) Block 1 gyorsabb: olvas (0), d_result[1] = 0, majd kilép – a shared memóriája megszűnik."}, {"ph": 4, "line": 3, "res": ["?", 0], "arrows": 4, "exit": [0, 1], "bad": 1, "msg": "5/5 (2. sync nélkül) Block 0 most olvasná Block 1 smem[0]-t: a cél már nem él – definiálatlan viselkedés, d_result[0] tetszőleges."}];
function toggle(){ setSteps(document.getElementById("nos").checked ? BAD : OK); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
