<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Üzenetátadás fence-szel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="fp" type="checkbox" onchange="setF()"> producer-fence (2)</label><label><input id="fc" type="checkbox" onchange="setF()"> fogyasztó-fence (5)</label><button onclick="nextEx()">Következő megengedett végrehajtás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Producer és fogyasztó műveletei egy megengedett sorrendben; a memória állapota és a fogyasztó által olvasott r."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: fence nélkül, az első megengedett végrehajtás. Egyszerűsített operációs modell a message-passing litmus-teszthez; a pontos szabály a CUDA/PTX memóriamodell. Hogy egy GPU ténylegesen produkálja-e az r = 0-t, nem garantált.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 0, "payload": 0, "flag": 0, "r": null, "msg": "Végrehajtás 1/12: (1) → (3) → (4) → (6); megengedett eredmények: {0, 42}", "ex": ["P1", "P3", "C4", "C6"], "allowed": [0, 42]}, {"k": 1, "line": 1, "payload": 42, "flag": 0, "r": null, "msg": "(1) payload = 42 · payload = 42, flag = 0", "ex": ["P1", "P3", "C4", "C6"], "allowed": [0, 42]}, {"k": 2, "line": 3, "payload": 42, "flag": 1, "r": null, "msg": "(3) atomicExch(&flag, 1) · payload = 42, flag = 1", "ex": ["P1", "P3", "C4", "C6"], "allowed": [0, 42]}, {"k": 3, "line": 4, "payload": 42, "flag": 1, "r": null, "msg": "(4) flag == 1 (pörgés vége) · payload = 42, flag = 1", "ex": ["P1", "P3", "C4", "C6"], "allowed": [0, 42]}, {"k": 4, "line": 6, "payload": 42, "flag": 1, "r": 42, "msg": "(6) r = payload → r = 42 · payload = 42, flag = 1", "ex": ["P1", "P3", "C4", "C6"], "allowed": [0, 42]}];
const CODE = ["// Producer (blokk 0)            // Fogyasztó (blokk 1)", "payload = 42;              // (1)", "__threadfence();           // (2)  (kapcsolható)", "atomicExch(&flag, 1);      // (3)", "while (atomicAdd(&flag, 0) == 0) {}   // (4)", "__threadfence();           // (5)  (kapcsolható)", "r = payload;               // (6)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"00": [{"ex": ["P1", "P3", "C4", "C6"], "r": 42}, {"ex": ["P1", "P3", "C6", "C4"], "r": 42}, {"ex": ["P1", "C6", "P3", "C4"], "r": 42}, {"ex": ["C6", "P1", "P3", "C4"], "r": 0}, {"ex": ["P3", "P1", "C4", "C6"], "r": 42}, {"ex": ["P3", "C4", "P1", "C6"], "r": 42}, {"ex": ["P3", "C4", "C6", "P1"], "r": 0}, {"ex": ["P3", "P1", "C6", "C4"], "r": 42}, {"ex": ["P3", "C6", "P1", "C4"], "r": 0}, {"ex": ["P3", "C6", "C4", "P1"], "r": 0}, {"ex": ["C6", "P3", "P1", "C4"], "r": 0}, {"ex": ["C6", "P3", "C4", "P1"], "r": 0}], "01": [{"ex": ["P1", "P3", "C4", "C5", "C6"], "r": 42}, {"ex": ["P3", "P1", "C4", "C5", "C6"], "r": 42}, {"ex": ["P3", "C4", "P1", "C5", "C6"], "r": 42}, {"ex": ["P3", "C4", "C5", "P1", "C6"], "r": 42}, {"ex": ["P3", "C4", "C5", "C6", "P1"], "r": 0}], "10": [{"ex": ["P1", "P2", "P3", "C4", "C6"], "r": 42}, {"ex": ["P1", "P2", "P3", "C6", "C4"], "r": 42}, {"ex": ["P1", "P2", "C6", "P3", "C4"], "r": 42}, {"ex": ["P1", "C6", "P2", "P3", "C4"], "r": 42}, {"ex": ["C6", "P1", "P2", "P3", "C4"], "r": 0}], "11": [{"ex": ["P1", "P2", "P3", "C4", "C5", "C6"], "r": 42}]}, LBL = {"P1": "(1) payload = 42", "P2": "(2) __threadfence()", "P3": "(3) atomicExch(&flag, 1)", "C4": "(4) flag == 1 (pörgés vége)", "C5": "(5) __threadfence()", "C6": "(6) r = payload"}, LN = {"P1": 1, "P2": 2, "P3": 3, "C4": 4, "C5": 5, "C6": 6};
let FP = false, FC = false, IDX = 0;
function cur(){ return ALL[(FP ? "1" : "0") + (FC ? "1" : "0")]; }
function gen(){ const L = cur(), E = L[IDX % L.length], allowed = [...new Set(L.map(x => x.r))].sort((a, b) => a - b);
  const out = [{k: 0, line: 0, payload: 0, flag: 0, r: null, ex: E.ex, allowed, msg: `Végrehajtás ${IDX % L.length + 1}/${L.length}: ` + E.ex.map(e => "(" + e[1] + ")").join(" → ") + `; megengedett eredmények: {${allowed.join(", ")}}`}];
  let pay = 0, flag = 0, rv = null;
  E.ex.forEach((e, k) => { if (e === "P1") pay = 42; else if (e === "P3") flag = 1; else if (e === "C6") rv = pay;
    out.push({k: k + 1, line: LN[e], payload: pay, flag, r: rv, ex: E.ex, allowed, msg: LBL[e] + (e === "C6" ? " → r = " + rv : "") + ` · payload = ${pay}, flag = ${flag}`}); });
  return out; }
function render(s){
  svg.setAttribute("viewBox", "0 0 720 300"); svg.innerHTML = "";
  const ex = s.ex || cur()[0].ex, allowed = s.allowed || [...new Set(cur().map(x => x.r))].sort((a, b) => a - b);
  el("text", {x: 10, y: 60, "font-size": 13}, "Producer"); el("text", {x: 10, y: 150, "font-size": 13}, "Fogyasztó");
  ex.forEach((e, k) => { const x = 100 + k * 100, y = e[0] === "P" ? 38 : 128, done = k < s.k;
    el("rect", {x, y, width: 92, height: 34, rx: 6, fill: done ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": k === s.k - 1 ? 3 : 1});
    el("text", {x: x + 46, y: y + 15, "text-anchor": "middle", "font-size": 11}, "(" + e[1] + ")");
    el("text", {x: x + 46, y: y + 29, "text-anchor": "middle", "font-size": 10}, {P1: "payload = 42", P2: "fence", P3: "flag = 1", C4: "flag == 1", C5: "fence", C6: "r = payload"}[e]); });
  el("text", {x: 100, y: 200, "font-size": 14}, `memória: payload = ${s.payload}, flag = ${s.flag}`);
  el("text", {x: 100, y: 228, "font-size": 15, "font-weight": "bold", fill: s.r === 0 ? css("--hl2") : css("--fg")}, "r = " + (s.r === null ? "–" : s.r));
  el("text", {x: 100, y: 258, "font-size": 14}, `megengedett eredmények: {${allowed.join(", ")}}` + (allowed.length === 1 ? "  (r = 0 kizárt)" : ""));
  el("text", {x: 10, y: 290, "font-size": 11, fill: css("--muted")}, "balról jobbra: láthatóvá válás / végrehajtás sorrendje; egyszerűsített modell a CUDA/PTX memóriamodell litmus-tesztjéhez");
}
function setF(){ FP = document.getElementById("fp").checked; FC = document.getElementById("fc").checked; IDX = 0; setSteps(gen()); }
function nextEx(){ IDX++; setSteps(gen()); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
