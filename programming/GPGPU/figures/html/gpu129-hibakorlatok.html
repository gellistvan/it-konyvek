<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibakorlátok és a tolerancia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#ddd;--line:#000;--bad:#999;--ok:#1f4e79}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#3a3a3a;--line:#ddd;--bad:#777;--ok:#8fb8e8}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
input,select{font:inherit}input[type=number],input[type=text]{width:8em}
</style>
</head>
<body>
<div class="ctl">
  <label>n = 2^<input id="ln" type="number" min="10" max="30" value="20" style="width:4em"></label>
  <label>blokkméret: <select id="blk"><option>64</option><option>128</option><option selected>256</option><option>512</option><option>1024</option></select></label>
  <label>pontosság: <select id="prec"><option value="24" selected>FP32 (u = 2^-24)</option><option value="11">FP16 (u = 2^-11)</option><option value="53">FP64 (u = 2^-53)</option></select></label>
</div>
<div class="ctl">
  <label>tolerancia ε_rel: <input id="eps" type="text" value="1e-4"></label>
  <label>saját mért rel_err: <input id="me" type="text" placeholder="pl. 4.5e-7"></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 800 220" role="img" aria-label="Logaritmikus relatívhiba-tengely a gépi epszilonnal, a tipikus és a pesszimista becsléssel, a toleranciával és a saját mért hibával"></svg>
<p class="small">A fejezet becslései: pesszimista ≈ (log₂(blokk) + n/blokk) · u (a blokkon belüli fa szintjei + az atomikus
összeadások száma), tipikus ≈ √(n/blokk) · u. A tolerancia mérnöki döntés a kettő között; a saját mért hibával finomítandó.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function s(v){return v.toExponential(2).replace(".",",").replace("e-","·10^-").replace("e+","·10^");}
function draw(){
  const ln=+document.getElementById("ln").value, blk=+document.getElementById("blk").value, p=+document.getElementById("prec").value;
  const eps=parseFloat(document.getElementById("eps").value.replace(",",".")), me=parseFloat(document.getElementById("me").value.replace(",","."));
  const n=Math.pow(2,ln), u=Math.pow(2,-p), depth=Math.log2(blk), atom=Math.max(1,n/blk);
  const typ=Math.sqrt(atom)*u, pess=(depth+atom)*u;
  const vals=[u,typ,pess].concat(eps>0?[eps]:[]).concat(me>0?[me]:[]);
  const lo=Math.floor(Math.log10(Math.min(...vals)))-0.3, hi=Math.ceil(Math.log10(Math.max(...vals)))+0.3;
  svg.innerHTML="";
  const defs=E("defs",{}); defs.innerHTML=`<pattern id="h" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--bad")}" stroke-width="1"/></pattern>`;
  const X0=30,X1=770,Y=120, xs=v=>X0+(Math.log10(v)-lo)*(X1-X0)/(hi-lo);
  if(eps>0){E("rect",{x:xs(eps),y:20,width:X1-xs(eps),height:150,fill:"url(#h)"});}
  E("line",{x1:X0,x2:X1,y1:Y,y2:Y,stroke:css("--line"),"stroke-width":1.5});
  for(let e=Math.ceil(lo);e<=Math.floor(hi);e++){E("line",{x1:xs(10**e),x2:xs(10**e),y1:Y-4,y2:Y+4,stroke:css("--line")});E("text",{x:xs(10**e),y:Y+70,"text-anchor":"middle","font-size":12},"10^"+e);}
  E("text",{x:X0,y:16,"font-size":13,"font-weight":"bold"},"VALIDÁCIÓ: sikeres");
  if(eps>0){E("line",{x1:xs(eps),x2:xs(eps),y1:20,y2:170,stroke:css("--line"),"stroke-width":4});
    E("text",{x:xs(eps)+6,y:16,"font-size":13,"font-weight":"bold"},"sikertelen");
    E("text",{x:xs(eps)-8,y:Y+52,"text-anchor":"end","font-size":12,"font-weight":"bold"},"ε_rel = "+s(eps));}
  const mk=(v,shape,lab,up)=>{const x=xs(v);
    if(shape==="D")E("rect",{x:x-6,y:Y-6,width:12,height:12,fill:css("--bg"),stroke:css("--line"),"stroke-width":2,transform:`rotate(45 ${x} ${Y})`});
    if(shape==="o")E("circle",{cx:x,cy:Y,r:7,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});
    if(shape==="^")E("path",{d:`M ${x} ${Y-9} L ${x+8} ${Y+6} L ${x-8} ${Y+6} Z`,fill:css("--line")});
    if(shape==="s")E("rect",{x:x-7,y:Y-7,width:14,height:14,fill:"none",stroke:css("--ok"),"stroke-width":3});
    E("text",{x:x,y:up?Y-38:Y+30,"text-anchor":"middle","font-size":12},lab[0]);E("text",{x:x,y:up?Y-22:Y+46,"text-anchor":"middle","font-size":12},lab[1]);};
  mk(u,"D",["u","≈ "+s(u)],true);
  mk(typ,"o",["tipikus √(n/blokk)·u","≈ "+s(typ)],false);
  mk(pess,"^",[`pesszimista (${depth}+${atom})·u`,"≈ "+s(pess)],true);
  if(me>0)mk(me,"s",["saját mért",s(me)],false);
  let msg=`n = 2^${ln}, blokk = ${blk}: fa-mélység ${depth}, atomikus tagok ${atom}; u ≈ ${s(u)}, tipikus ≈ ${s(typ)}, pesszimista ≈ ${s(pess)}.`;
  if(eps>0) msg+= eps<typ?" A tolerancia a tipikus hiba ALATT van: hamis riasztások várhatók.":(eps>pess?" A tolerancia a pesszimista korlát felett van: túl engedékeny.":" A tolerancia a tipikus és a pesszimista becslés között van.");
  if(me>0&&eps>0) msg+= me<=eps?` A mért hiba (${s(me)}) a tolerancián belül van: sikeres.`:` A mért hiba (${s(me)}) a tolerancia felett van: sikertelen.`;
  document.getElementById("status").textContent=msg;
}
["ln","blk","prec","eps","me"].forEach(i=>{document.getElementById(i).addEventListener("input",draw);document.getElementById(i).addEventListener("change",draw);});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
