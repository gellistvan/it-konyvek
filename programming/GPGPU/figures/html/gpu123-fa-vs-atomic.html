<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rögzített fa vs. atomikus érkezési sorrend</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="newrun">Új futás (véletlen sorrend)</button>
<label>x0 <input id="x0" size="8" value="1e8"></label><label>x1 <input id="x1" size="5" value="1"></label>
<label>x2 <input id="x2" size="8" value="-1e8"></label><label>x3 <input id="x3" size="5" value="1"></label>
<button id="setx">értékek beállítása</button>
<span id="cnt2" class="small" aria-live="polite">különböző atomikus eredmények eddig: 1 (1)</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal: rögzített fa-redukció négy FP32 értéken, eredménye mindig 2. Jobb: atomikus akkumulátor lépésenként az aktuális érkezési sorrendben."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">FP32 (Math.fround, round-to-nearest-even). Az „Új futás” véletlen érkezési sorrendet sorsol; a fa eredménye nem változik. A könyv példája: x = (10⁸, 1, −10⁸, 1), a fa eredménye 2, az atomikus eredmény 0, 1 vagy 2.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 2, "order": [0, 1, 2, 3], "t": 0, "acc": [], "lost": [], "msg": "1. futás: érkezési sorrend x0, x1, x2, x3; az akkumulátor 0."}, {"line": 3, "order": [0, 1, 2, 3], "t": 1, "acc": [100000000.0], "lost": [0.0], "msg": "1. atomicAdd: 0 + (10⁸) = 10⁸ (FP32)"}, {"line": 3, "order": [0, 1, 2, 3], "t": 2, "acc": [100000000.0, 100000000.0], "lost": [0.0, 1.0], "msg": "2. atomicAdd: 10⁸ + (1) = 10⁸ (FP32) – kerekítési veszteség: 1"}, {"line": 3, "order": [0, 1, 2, 3], "t": 3, "acc": [100000000.0, 100000000.0, 0.0], "lost": [0.0, 1.0, 0.0], "msg": "3. atomicAdd: 10⁸ + (−10⁸) = 0 (FP32)"}, {"line": 3, "order": [0, 1, 2, 3], "t": 4, "acc": [100000000.0, 100000000.0, 0.0, 1.0], "lost": [0.0, 1.0, 0.0, 0.0], "msg": "4. atomicAdd: 0 + (1) = 1 (FP32). Eredmény: 1; a fa eredménye: 2."}];
const CODE = ["// rögzített fa (blokkon belül, s = 2, 1):", "for (s = n/2; s > 0; s >>= 1) if (tid < s) x[tid] += x[tid + s];", "// atomikus: minden szál a saját részösszegét adja hozzá", "atomicAdd(result, x[tid]);   // a sorrendet a hardver dönti el"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let XV = [1e8, 1, -1e8, 1].map(Math.fround);
const SEEN = new Map([["1", 1]]);
let runNo = 1;
function fmt(v){ if (Math.abs(v) === 1e8) return (v < 0 ? "−" : "") + "10⁸"; return String(v).replace("-", "−"); }
function treeOf(x){ const a = x.slice(); const lv = []; for (let s = 2; s >= 1; s >>= 1){ for (let i = 0; i < s; i++) a[i] = Math.fround(a[i] + a[i + s]); lv.push(a.slice(0, s)); } return lv; }
function runOf(order){ let acc = 0; const out = []; for (const j of order){ const nw = Math.fround(acc + XV[j]); out.push({j: j, before: acc, after: nw, lost: (acc + XV[j]) - nw}); acc = nw; } return out; }
function stepsOf(order, title){
  const run = runOf(order), T = treeOf(XV);
  const st = [{line: 2, order: order, t: 0, acc: [], lost: [], msg: `${title}: érkezési sorrend ${order.map(j => "x" + j).join(", ")}; az akkumulátor 0.`}];
  run.forEach((r, t) => {
    let m = `${t + 1}. atomicAdd: ${fmt(r.before)} + (${fmt(XV[r.j])}) = ${fmt(r.after)} (FP32)` + (r.lost !== 0 ? ` – kerekítési veszteség: ${fmt(Math.abs(r.lost))}` : "");
    if (t === run.length - 1) m += `. Eredmény: ${fmt(r.after)}; a fa eredménye: ${fmt(T[1][0])}.`;
    st.push({line: 3, order: order, t: t + 1, acc: run.slice(0, t + 1).map(q => q.after), lost: run.slice(0, t + 1).map(q => q.lost), msg: m});
  });
  return [st, run[run.length - 1].after];
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 300"); svg.innerHTML = "";
  const T = treeOf(XV);
  const box = (x, y, w, h, t, o) => { el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2}, o || {})); el("text", {x: x + w / 2, y: y + h / 2 + 5, "text-anchor": "middle", "font-size": 14}, t); };
  el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, "rögzített fa (nem változik)");
  const xs = [10, 80, 150, 220];
  XV.forEach((v, i) => { box(xs[i], 60, 62, 34, fmt(v)); el("text", {x: xs[i] + 31, y: 52, "text-anchor": "middle", "font-size": 12}, "x" + i); });
  [[45, 0, 2], [185, 1, 3]].forEach(([x, a, b], q) => { box(x, 150, 62, 34, fmt(T[0][q])); [a, b].forEach(src => el("line", {x1: xs[src] + 31, y1: 94, x2: x + 31, y2: 150, stroke: css("--line")})); });
  box(115, 235, 62, 34, fmt(T[1][0]), {"stroke-width": 3.5});
  [76, 216].forEach(x => el("line", {x1: x, y1: 184, x2: 146, y2: 235, stroke: css("--line")}));
  el("text", {x: 10, y: 292, "font-size": 12}, "s = 2, majd s = 1");
  // atomikus futás
  el("text", {x: 330, y: 20, "font-size": 14, "font-weight": "bold"}, `${runNo}. futás: ${s.order.map(j => "x" + j).join(", ")}`);
  box(325, 60, 62, 34, "0", {"stroke-dasharray": "4 3"}); el("text", {x: 356, y: 112, "text-anchor": "middle", "font-size": 12}, "akkumulátor");
  s.order.forEach((j, t) => {
    const xb = 400 + t * 90, x = xb + 34;
    if (t < s.t) {
      const lost = s.lost[t] !== 0, lastOne = t === s.order.length - 1, cur = t === s.t - 1;
      el("text", {x: xb + 40, y: 52, "text-anchor": "middle", "font-size": 13}, "+ x" + j);
      box(xb, 60, 80, 34, fmt(s.acc[t]), {fill: lost ? css("--cellhl") : css("--cell"), "stroke-width": lastOne ? 3.5 : (cur ? 2.5 : 1.2), "stroke-dasharray": lost ? "6 3" : ""});
      if (lost) el("text", {x: xb + 40, y: 112, "text-anchor": "middle", "font-size": 12}, "veszteség: " + fmt(Math.abs(s.lost[t])));
      if (lost && Math.abs(s.lost[t]) === Math.abs(XV[j])) el("line", {x1: xb + 18, x2: xb + 62, y1: 47, y2: 47, stroke: css("--line"), "stroke-width": 1.6});
    } else el("text", {x: xb + 40, y: 52, "text-anchor": "middle", "font-size": 13, fill: css("--muted")}, "x" + j);
  });
  el("text", {x: 330, y: 170, "font-size": 13}, "Különböző atomikus végeredmények eddig:");
  let q = 0; SEEN.forEach((c, v) => { el("text", {x: 340 + (q % 4) * 100, y: 195 + Math.floor(q / 4) * 20, "font-size": 13}, `${fmt(+v)} (${c}×)`); q++; });
}
function shuffle(){ const o = [0, 1, 2, 3]; for (let i = 3; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; }
document.getElementById("newrun").addEventListener("click", () => {
  runNo++; const o = shuffle(); const [st, res] = stepsOf(o, runNo + ". futás");
  SEEN.set(String(res), (SEEN.get(String(res)) || 0) + 1);
  document.getElementById("cnt2").textContent = `különböző atomikus eredmények eddig: ${SEEN.size} (${[...SEEN.keys()].map(v => fmt(+v)).join(", ")})`;
  setSteps(st);
});
document.getElementById("setx").addEventListener("click", () => {
  const v = [0, 1, 2, 3].map(i => +document.getElementById("x" + i).value.replace(",", "."));
  if (!v.every(Number.isFinite)) return;
  XV = v.map(Math.fround); SEEN.clear(); runNo = 1;
  const [st, res] = stepsOf([0, 1, 2, 3], "1. futás"); SEEN.set(String(res), 1);
  document.getElementById("cnt2").textContent = `különböző atomikus eredmények eddig: 1 (${fmt(res)})`;
  setSteps(st);
});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
