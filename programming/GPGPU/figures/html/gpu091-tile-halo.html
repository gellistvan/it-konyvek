<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bemeneti tile, halo és két betöltési menet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" onchange="WARP=this.checked;show(5)"> warp-nézet a 6. lépésben (bankszámok, ütköző bankok)</label><span class="small">A 6. lépésben egy cellára kattintva a (ty, tx) = (sor, oszlop) szál ablaka jelenik meg.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="18×18-as shared memory rács; a belső 16×16 a kimeneti tile, a külső gyűrű a halo. A cellákban a betöltő szál tid-je: az első menetben 0–255, a másodikban 0–67. A kiválasztott kimeneti pixel 3×3-as ablaka kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.2.5 conv2d_tiled kernelje: 32×32 bemenet, blockDim = (16, 16), (0, 0) blokk, 3×3-as szűrő, FP32. A bankszám 32 bankos, 4 bájtos szóra számolt.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 1, "line": -1, "msg": "1. A blokk 16×16-os kimeneti tile-t számol (vastag keret): a (0, 0) blokk az y[0..15][0..15] pixeleket."}, {"st": 2, "line": 2, "msg": "2. A 3×3-as szűrőhöz körben 1 cellás halo kell: a bemeneti tile 18×18 = 324 elem. A (0, 0) blokk bal és felső halója a képen kívül esik → 0 (szürke); a jobb és alsó a szomszéd blokkok adatai (pontozott)."}, {"st": 3, "line": 3, "msg": "3. 1. menet: i = tid = 0…255, mind a 256 szál tölt; smem_y = i / 18, smem_x = i % 18. A 256. elem (i = 255) a 14. sor 3. oszlopa."}, {"st": 4, "line": 3, "msg": "4. 2. menet: i = tid + 256 = 256…323, csak a tid = 0…67 szálak aktívak (68 elem, dupla keret); a többi 188 szál kilép a ciklusból."}, {"st": 5, "line": 9, "msg": "5. __syncthreads(): a számítás csak akkor kezdődhet, ha mind a 324 elem a shared memoryban van."}, {"st": 6, "line": 12, "msg": "6. Számítás: a (ty, tx) szál a smem[ty..ty+2][tx..tx+2] ablakból számol. Kattintson egy belső cellára más pixel választásához."}];
const CODE = ["int tid = ty * blockDim.x + tx;            // 0..255", "int total_smem = (TILE_H + 2) * (TILE_W + 2); // 324", "// halo: a tile körül 1 cella", "for (int i = tid; i < total_smem; i += nthreads) {", "    int smem_y = i / (TILE_W + 2), smem_x = i % (TILE_W + 2);", "    int glob_y = blockIdx.y * TILE_H - 1 + smem_y;", "    int glob_x = blockIdx.x * TILE_W - 1 + smem_x;", "    smem[smem_y][smem_x] = (belül) ? x[glob_y * W + glob_x] : 0.0f;", "}", "__syncthreads();", "for (int r = 0; r < KR; ++r)", "    for (int s = 0; s < KS; ++s)", "        acc += smem[ty + r][tx + s] * wr[r * KS + s];"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = [[[0, 0, "zero"], [1, 0, "zero"], [2, 0, "zero"], [3, 0, "zero"], [4, 0, "zero"], [5, 0, "zero"], [6, 0, "zero"], [7, 0, "zero"], [8, 0, "zero"], [9, 0, "zero"], [10, 0, "zero"], [11, 0, "zero"], [12, 0, "zero"], [13, 0, "zero"], [14, 0, "zero"], [15, 0, "zero"], [16, 0, "zero"], [17, 0, "zero"]], [[18, 0, "zero"], [19, 0, "tile"], [20, 0, "tile"], [21, 0, "tile"], [22, 0, "tile"], [23, 0, "tile"], [24, 0, "tile"], [25, 0, "tile"], [26, 0, "tile"], [27, 0, "tile"], [28, 0, "tile"], [29, 0, "tile"], [30, 0, "tile"], [31, 0, "tile"], [32, 0, "tile"], [33, 0, "tile"], [34, 0, "tile"], [35, 0, "nb"]], [[36, 0, "zero"], [37, 0, "tile"], [38, 0, "tile"], [39, 0, "tile"], [40, 0, "tile"], [41, 0, "tile"], [42, 0, "tile"], [43, 0, "tile"], [44, 0, "tile"], [45, 0, "tile"], [46, 0, "tile"], [47, 0, "tile"], [48, 0, "tile"], [49, 0, "tile"], [50, 0, "tile"], [51, 0, "tile"], [52, 0, "tile"], [53, 0, "nb"]], [[54, 0, "zero"], [55, 0, "tile"], [56, 0, "tile"], [57, 0, "tile"], [58, 0, "tile"], [59, 0, "tile"], [60, 0, "tile"], [61, 0, "tile"], [62, 0, "tile"], [63, 0, "tile"], [64, 0, "tile"], [65, 0, "tile"], [66, 0, "tile"], [67, 0, "tile"], [68, 0, "tile"], [69, 0, "tile"], [70, 0, "tile"], [71, 0, "nb"]], [[72, 0, "zero"], [73, 0, "tile"], [74, 0, "tile"], [75, 0, "tile"], [76, 0, "tile"], [77, 0, "tile"], [78, 0, "tile"], [79, 0, "tile"], [80, 0, "tile"], [81, 0, "tile"], [82, 0, "tile"], [83, 0, "tile"], [84, 0, "tile"], [85, 0, "tile"], [86, 0, "tile"], [87, 0, "tile"], [88, 0, "tile"], [89, 0, "nb"]], [[90, 0, "zero"], [91, 0, "tile"], [92, 0, "tile"], [93, 0, "tile"], [94, 0, "tile"], [95, 0, "tile"], [96, 0, "tile"], [97, 0, "tile"], [98, 0, "tile"], [99, 0, "tile"], [100, 0, "tile"], [101, 0, "tile"], [102, 0, "tile"], [103, 0, "tile"], [104, 0, "tile"], [105, 0, "tile"], [106, 0, "tile"], [107, 0, "nb"]], [[108, 0, "zero"], [109, 0, "tile"], [110, 0, "tile"], [111, 0, "tile"], [112, 0, "tile"], [113, 0, "tile"], [114, 0, "tile"], [115, 0, "tile"], [116, 0, "tile"], [117, 0, "tile"], [118, 0, "tile"], [119, 0, "tile"], [120, 0, "tile"], [121, 0, "tile"], [122, 0, "tile"], [123, 0, "tile"], [124, 0, "tile"], [125, 0, "nb"]], [[126, 0, "zero"], [127, 0, "tile"], [128, 0, "tile"], [129, 0, "tile"], [130, 0, "tile"], [131, 0, "tile"], [132, 0, "tile"], [133, 0, "tile"], [134, 0, "tile"], [135, 0, "tile"], [136, 0, "tile"], [137, 0, "tile"], [138, 0, "tile"], [139, 0, "tile"], [140, 0, "tile"], [141, 0, "tile"], [142, 0, "tile"], [143, 0, "nb"]], [[144, 0, "zero"], [145, 0, "tile"], [146, 0, "tile"], [147, 0, "tile"], [148, 0, "tile"], [149, 0, "tile"], [150, 0, "tile"], [151, 0, "tile"], [152, 0, "tile"], [153, 0, "tile"], [154, 0, "tile"], [155, 0, "tile"], [156, 0, "tile"], [157, 0, "tile"], [158, 0, "tile"], [159, 0, "tile"], [160, 0, "tile"], [161, 0, "nb"]], [[162, 0, "zero"], [163, 0, "tile"], [164, 0, "tile"], [165, 0, "tile"], [166, 0, "tile"], [167, 0, "tile"], [168, 0, "tile"], [169, 0, "tile"], [170, 0, "tile"], [171, 0, "tile"], [172, 0, "tile"], [173, 0, "tile"], [174, 0, "tile"], [175, 0, "tile"], [176, 0, "tile"], [177, 0, "tile"], [178, 0, "tile"], [179, 0, "nb"]], [[180, 0, "zero"], [181, 0, "tile"], [182, 0, "tile"], [183, 0, "tile"], [184, 0, "tile"], [185, 0, "tile"], [186, 0, "tile"], [187, 0, "tile"], [188, 0, "tile"], [189, 0, "tile"], [190, 0, "tile"], [191, 0, "tile"], [192, 0, "tile"], [193, 0, "tile"], [194, 0, "tile"], [195, 0, "tile"], [196, 0, "tile"], [197, 0, "nb"]], [[198, 0, "zero"], [199, 0, "tile"], [200, 0, "tile"], [201, 0, "tile"], [202, 0, "tile"], [203, 0, "tile"], [204, 0, "tile"], [205, 0, "tile"], [206, 0, "tile"], [207, 0, "tile"], [208, 0, "tile"], [209, 0, "tile"], [210, 0, "tile"], [211, 0, "tile"], [212, 0, "tile"], [213, 0, "tile"], [214, 0, "tile"], [215, 0, "nb"]], [[216, 0, "zero"], [217, 0, "tile"], [218, 0, "tile"], [219, 0, "tile"], [220, 0, "tile"], [221, 0, "tile"], [222, 0, "tile"], [223, 0, "tile"], [224, 0, "tile"], [225, 0, "tile"], [226, 0, "tile"], [227, 0, "tile"], [228, 0, "tile"], [229, 0, "tile"], [230, 0, "tile"], [231, 0, "tile"], [232, 0, "tile"], [233, 0, "nb"]], [[234, 0, "zero"], [235, 0, "tile"], [236, 0, "tile"], [237, 0, "tile"], [238, 0, "tile"], [239, 0, "tile"], [240, 0, "tile"], [241, 0, "tile"], [242, 0, "tile"], [243, 0, "tile"], [244, 0, "tile"], [245, 0, "tile"], [246, 0, "tile"], [247, 0, "tile"], [248, 0, "tile"], [249, 0, "tile"], [250, 0, "tile"], [251, 0, "nb"]], [[252, 0, "zero"], [253, 0, "tile"], [254, 0, "tile"], [255, 0, "tile"], [0, 1, "tile"], [1, 1, "tile"], [2, 1, "tile"], [3, 1, "tile"], [4, 1, "tile"], [5, 1, "tile"], [6, 1, "tile"], [7, 1, "tile"], [8, 1, "tile"], [9, 1, "tile"], [10, 1, "tile"], [11, 1, "tile"], [12, 1, "tile"], [13, 1, "nb"]], [[14, 1, "zero"], [15, 1, "tile"], [16, 1, "tile"], [17, 1, "tile"], [18, 1, "tile"], [19, 1, "tile"], [20, 1, "tile"], [21, 1, "tile"], [22, 1, "tile"], [23, 1, "tile"], [24, 1, "tile"], [25, 1, "tile"], [26, 1, "tile"], [27, 1, "tile"], [28, 1, "tile"], [29, 1, "tile"], [30, 1, "tile"], [31, 1, "nb"]], [[32, 1, "zero"], [33, 1, "tile"], [34, 1, "tile"], [35, 1, "tile"], [36, 1, "tile"], [37, 1, "tile"], [38, 1, "tile"], [39, 1, "tile"], [40, 1, "tile"], [41, 1, "tile"], [42, 1, "tile"], [43, 1, "tile"], [44, 1, "tile"], [45, 1, "tile"], [46, 1, "tile"], [47, 1, "tile"], [48, 1, "tile"], [49, 1, "nb"]], [[50, 1, "zero"], [51, 1, "nb"], [52, 1, "nb"], [53, 1, "nb"], [54, 1, "nb"], [55, 1, "nb"], [56, 1, "nb"], [57, 1, "nb"], [58, 1, "nb"], [59, 1, "nb"], [60, 1, "nb"], [61, 1, "nb"], [62, 1, "nb"], [63, 1, "nb"], [64, 1, "nb"], [65, 1, "nb"], [66, 1, "nb"], [67, 1, "nb"]]];
let PIX = [3, 5], WARP = false;
function render(s){
  svg.setAttribute("viewBox", "0 0 780 480"); svg.innerHTML = "";
  const c = 24, X0 = 30, Y0 = 30, st = s.st;
  for (let y = 0; y < 18; y++) {
    el("text", {x: X0 - 4, y: Y0 + y*c + 16, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, String(y));
    for (let x = 0; x < 18; x++) {
      const [tid, ps, kind] = G[y][x];
      const halo = kind !== "tile";
      let show = st >= 3 && (ps === 0 || st >= 4);
      let fill = css("--cell");
      if (st >= 2 && kind === "zero") fill = css("--cellhl");
      if (st === 3 && ps === 0) fill = kind === "zero" ? css("--cellhl") : css("--cell");
      el("rect", {x: X0 + x*c, y: Y0 + y*c, width: c, height: c, fill, stroke: css("--line"),
                  "stroke-width": 0.5, "stroke-dasharray": (st >= 2 && kind === "nb") ? "2 2" : "",
                  opacity: (st === 1 && halo) ? 0.25 : 1, "data-x": x, "data-y": y, style: "cursor:pointer"});
      if (st >= 4 && ps === 1) el("rect", {x: X0 + x*c + 3, y: Y0 + y*c + 3, width: c - 6, height: c - 6, fill: "none", stroke: css("--line"), "stroke-width": 0.8});
      let t = "";
      if (WARP && st >= 6) {
        const ty = PIX[0], wty = ty - (ty % 2);
        if ((y === wty || y === wty + 1) && x < 16) t = String((y * 18 + x) % 32);
      } else if (show) t = String(tid);
      if (t) el("text", {x: X0 + x*c + c/2, y: Y0 + y*c + 16, "text-anchor": "middle", "font-size": 9, style: "pointer-events:none"}, t);
    }
  }
  el("rect", {x: X0 + c, y: Y0 + c, width: 16*c, height: 16*c, fill: "none", stroke: css("--line"), "stroke-width": 3});
  if (st >= 2) el("rect", {x: X0 - 1, y: Y0 - 1, width: 18*c + 2, height: 18*c + 2, fill: "none", stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  const xi = 480;
  let lines = [];
  if (st === 1) lines = ["kimeneti tile: 16×16 = 256 pixel", "blockDim = (16, 16) → 256 szál"];
  if (st === 2) lines = ["bemeneti tile + halo: 18×18 = 324", "szürke: zero padding (35 cella)", "szaggatott: szomszéd blokk adatai"];
  if (st === 3) lines = ["1. menet: i = tid, 256 elem", "(sorok 0–13 és a 14. sor 0–3. eleme)"];
  if (st === 4) lines = ["2. menet: i = tid + 256", "68 elem (dupla keret), tid 0…67", "1. menet 256 + 2. menet 68 = 324"];
  if (st === 5) lines = ["__syncthreads()", "minden szál megvárja a betöltést"];
  if (st >= 6) {
    const [ty, tx] = PIX;
    lines = [`(ty, tx) = (${ty}, ${tx})`, `ablak: smem[${ty}..${ty+2}][${tx}..${tx+2}]`, `kimenet: y[${ty}][${tx}] (blokk (0, 0))`];
    if (WARP) {
      const wty = ty - (ty % 2), bk = [];
      for (const yy of [wty, wty + 1]) for (let x = 0; x < 16; x++) bk.push((yy * 18 + x) % 32);
      const dup = [...new Set(bk.filter((b, i) => bk.indexOf(b) !== i))].sort((a, b) => a - b);
      lines.push(`warp: ty = ${wty} és ${wty + 1} (32 szál), r = s = 0`, "cellákban: bank = (sor·18 + oszlop) mod 32",
                 `ütköző bankok: ${dup.join(", ")} → 2-utas konfliktus`);
    }
    el("rect", {x: X0 + tx*c, y: Y0 + ty*c, width: 3*c, height: 3*c, fill: "none", stroke: css("--hl"), "stroke-width": 3.5});
    el("circle", {cx: X0 + (tx+1.5)*c, cy: Y0 + (ty+1.5)*c, r: 8, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  }
  lines.forEach((t, i) => el("text", {x: xi, y: 60 + i*22, "font-size": 13}, t));
  svg.querySelectorAll("rect[data-x]").forEach(r => r.addEventListener("click", () => {
    const x = +r.getAttribute("data-x"), y = +r.getAttribute("data-y");
    if (x >= 16 || y >= 16) return;           // a (ty, tx) ablaka a smem[ty..ty+2][tx..tx+2]
    PIX = [y, x]; show(5);
  }));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
