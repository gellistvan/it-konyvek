<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamenkénti események és az all_done</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>blokk/kernel: <input type="range" min="0" max="5" value="5" aria-label="Blokkszám kernelenként" oninput="NB=[16,64,256,1024,4096,16384][+this.value];document.getElementById('nbv').textContent=NB;reload()"> <span id="nbv">16384</span></label><label><input type="checkbox" onchange="LEG=this.checked;reload()"> flag nélküli streamek + legacy default streames cudaMemcpy a 2. kernel után</label><span id="res" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal Host, Stream 0–3 és GPU sávval: a host kiadja a 16 parancsot; a négy start esemény szinte egyszerre, a stop események lépcsőzetesen teljesülnek; a három cudaStreamWaitEvent szaggatott nyíllal az all_done-ba fut."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Elméleti modell, nem mérés: 204 egyidejű blokk, ~0,2 ms egy 16384 blokkos kernel, 0,003 ms host-parancsonként, a legacy memcpy 0,1 ms. A valódi értékeket a labor mérési naplója adja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "line": 0, "msg": "1. host-parancs: cudaEventRecord(start_0, s_0)"}, {"n": 2, "line": 1, "msg": "2. host-parancs: vectorAdd<<<nb, 256, 0, s_0>>>  (K0)"}, {"n": 3, "line": 2, "msg": "3. host-parancs: cudaEventRecord(stop_0, s_0)"}, {"n": 4, "line": 3, "msg": "4. host-parancs: cudaEventRecord(start_1, s_1)"}, {"n": 5, "line": 4, "msg": "5. host-parancs: vectorAdd<<<nb, 256, 0, s_1>>>  (K1)"}, {"n": 6, "line": 5, "msg": "6. host-parancs: cudaEventRecord(stop_1, s_1)"}, {"n": 7, "line": 6, "msg": "7. host-parancs: cudaEventRecord(start_2, s_2)"}, {"n": 8, "line": 7, "msg": "8. host-parancs: vectorAdd<<<nb, 256, 0, s_2>>>  (K2)"}, {"n": 9, "line": 8, "msg": "9. host-parancs: cudaEventRecord(stop_2, s_2)"}, {"n": 10, "line": 9, "msg": "10. host-parancs: cudaEventRecord(start_3, s_3)"}, {"n": 11, "line": 10, "msg": "11. host-parancs: vectorAdd<<<nb, 256, 0, s_3>>>  (K3)"}, {"n": 12, "line": 11, "msg": "12. host-parancs: cudaEventRecord(stop_3, s_3)"}, {"n": 13, "line": 12, "msg": "13. host-parancs: cudaStreamWaitEvent(s_3, stop_0)"}, {"n": 14, "line": 13, "msg": "14. host-parancs: cudaStreamWaitEvent(s_3, stop_1)"}, {"n": 15, "line": 14, "msg": "15. host-parancs: cudaStreamWaitEvent(s_3, stop_2)"}, {"n": 16, "line": 15, "msg": "16. host-parancs: cudaEventRecord(all_done, s_3)"}, {"n": 17, "line": 16, "msg": "17. host-parancs: cudaEventSynchronize(all_done)"}, {"line": -1, "msg": "Vége: a streamidők (start_i → stop_i) a közös kezdettől a saját kernel végéig mérnek; nagy kernelnél lépcsőt adnak, kis blokkszámnál kiegyenlítődnek."}];
const CODE = ["cudaEventRecord(start_events[0], streams[0]);", "vectorAdd<<<blocks, threads, 0, streams[0]>>>(…);   // K0", "cudaEventRecord(stop_events[0], streams[0]);", "cudaEventRecord(start_events[1], streams[1]);", "vectorAdd<<<blocks, threads, 0, streams[1]>>>(…);   // K1", "cudaEventRecord(stop_events[1], streams[1]);", "cudaEventRecord(start_events[2], streams[2]);", "vectorAdd<<<blocks, threads, 0, streams[2]>>>(…);   // K2", "cudaEventRecord(stop_events[2], streams[2]);", "cudaEventRecord(start_events[3], streams[3]);", "vectorAdd<<<blocks, threads, 0, streams[3]>>>(…);   // K3", "cudaEventRecord(stop_events[3], streams[3]);", "cudaStreamWaitEvent(streams[last], stop_events[0], 0);", "cudaStreamWaitEvent(streams[last], stop_events[1], 0);", "cudaStreamWaitEvent(streams[last], stop_events[2], 0);", "cudaEventRecord(all_done, streams[3]);", "cudaEventSynchronize(all_done);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CAP = 204, TAU = 0.0024691358024691358, COST = 0.003, MEMCPY = 0.1;
let NB = 16384, LEG = false, R = null;
function cmds(leg){ const c = [];
  for (let i = 0; i < 4; i++) { c.push(["rec", i, "start_" + i], ["launch", i, "K" + i], ["rec", i, "stop_" + i]); if (leg && i === 1) c.push(["memcpy", "D", "cudaMemcpy"]); }
  for (let i = 0; i < 3; i++) c.push(["wait", 3, "stop_" + i]);
  c.push(["rec", 3, "all_done"], ["sync", null, "all_done"]); return c; }
// egyszerű bináris kupac a slotok felszabadulási idejére
function hpush(h, v){ h.push(v); let i = h.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (h[p] <= h[i]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } }
function hpop(h){ const top = h[0], last = h.pop(); if (h.length) { h[0] = last; let i = 0; for (;;) { const l = 2*i+1, r = l+1; let m = i;
  if (l < h.length && h[l] < h[m]) m = l; if (r < h.length && h[r] < h[m]) m = r; if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } } return top; }
function sim(nb, leg){
  let t = 0, last = 0, dd = 0; const sr = {0: 0, 1: 0, 2: 0, 3: 0, D: 0}, ev = {}, kern = {}, host = [], ops = [];
  const h = []; for (let i = 0; i < CAP; i++) h.push(0);
  cmds(leg).forEach(([kind, s, name], idx) => {
    const t0 = t;
    if (kind === "sync") { t = Math.max(t, ev[name]); host.push([t0, t, kind, idx]); return; }
    t += COST; let ready = Math.max(t, sr[s]); if (leg && s !== "D") ready = Math.max(ready, dd);
    if (kind === "rec") { ev[name] = ready; sr[s] = ready; ops.push([s, ready, ready, name, kind, idx]); }
    else if (kind === "wait") { sr[s] = Math.max(ready, ev[name]); ops.push([s, ready, sr[s], name, kind, idx]); }
    else if (kind === "launch") { let st = null, en = 0;
      for (let b = 0; b < nb; b++) { const f = hpop(h), b0 = Math.max(ready, f, last); last = b0; hpush(h, b0 + TAU); if (st === null) st = b0; en = Math.max(en, b0 + TAU); }
      kern[name] = [st, en]; sr[s] = en; ops.push([s, ready, en, name, kind, idx]); }
    else if (kind === "memcpy") { const r = Math.max(ready, sr[0], sr[1], sr[2], sr[3]); dd = r + MEMCPY; sr.D = dd;
      ops.push(["D", r, dd, name, kind, idx]); host.push([t0, dd, kind, idx]); t = dd; return; }
    host.push([t0, t, kind, idx]);
  });
  const times = [0, 1, 2, 3].map(i => ev["stop_" + i] - ev["start_" + i]);
  return {host, ops, ev, kern, times, total: Math.max(t, ev.all_done)};
}
function f2(x){ return x.toFixed(3).replace(".", ","); }
function render(s){
  if (!R) R = sim(NB, LEG);
  svg.setAttribute("viewBox", "0 0 780 400"); svg.innerHTML = "";
  const rows = ["Host", "Stream 0", "Stream 1", "Stream 2", "Stream 3"].concat(LEG ? ["default"] : []).concat(["GPU"]);
  const Y = {}; rows.forEach((r, i) => { Y[r] = 40 + i * 44; el("text", {x: 8, y: Y[r] + 4, "font-size": 12}, r);
    el("line", {x1: 80, x2: 770, y1: Y[r], y2: Y[r], stroke: css("--muted"), "stroke-width": 0.4}); });
  const T = Math.max(R.total, 0.05) * 1.1, X = v => 80 + v / T * 680;
  const cur = s.n === undefined ? 99 : s.n - 1;   // eddig kiadott host-parancs indexe (a legacy memcpy miatt eltolva)
  const shown = idx => idx <= cur + (LEG && cur >= 6 ? 1 : 0);
  R.host.forEach(([a, b, kind, idx]) => { if (!shown(idx)) return;
    el("rect", {x: X(a), y: Y.Host - 8, width: Math.max(1.5, X(b) - X(a)), height: 16, fill: kind === "sync" || kind === "memcpy" ? "none" : css("--cellhl"), stroke: css("--line"), "stroke-width": 0.6, "stroke-dasharray": kind === "sync" ? "3 2" : ""}); });
  R.ops.forEach(([st, a, b, name, kind, idx]) => { if (!shown(idx)) return;
    const y = st === "D" ? Y["default"] : Y["Stream " + st];
    if (kind === "launch") el("rect", {x: X(a), y: y - 3, width: Math.max(1, X(b) - X(a)), height: 6, fill: css("--muted")});
    if (kind === "memcpy") el("rect", {x: X(a), y: y - 10, width: X(b) - X(a), height: 20, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
    if (kind === "rec" && name.startsWith("start")) el("path", {d: `M${X(a)},${y - 8} l6,12 l-12,0 z`, fill: "none", stroke: css("--line"), "stroke-width": 1.5});
    if (kind === "rec" && name.startsWith("stop")) el("circle", {cx: X(a), cy: y, r: 5, fill: css("--fg")});
    if (kind === "rec" && name === "all_done") el("text", {x: X(a), y: y + 7, "text-anchor": "middle", "font-size": 20}, "☆");
    if (kind === "wait") { const e = R.ev[name], i = +name.slice(-1);
      el("line", {x1: X(e), y1: Y["Stream " + i], x2: X(b), y2: y, stroke: css("--hl"), "stroke-width": 1.2, "stroke-dasharray": "5 3"}); }
  });
  for (let i = 0; i < 4; i++) { const kk = R.kern["K" + i]; if (!kk || !shown(3*i + 1 + (LEG && i >= 2 ? 1 : 0))) continue;
    el("rect", {x: X(kk[0]), y: Y.GPU - 12, width: Math.max(2, X(kk[1]) - X(kk[0])), height: 24 - 0 * i, fill: "none", stroke: css("--line"), "stroke-width": 1.2});
    el("text", {x: X(kk[0]) + 3, y: Y.GPU + 25 + 0, "font-size": 11}, "K" + i); }
  if (cur >= 15) for (let i = 0; i < 4; i++) { const a = R.ev["start_" + i], b = R.ev["stop_" + i], y = Y["Stream " + i] - 14;
    el("line", {x1: X(a), x2: X(b), y1: y, y2: y, stroke: css("--hl2"), "stroke-width": 1.5});
    el("text", {x: X(b) + 4, y: y + 4, "font-size": 11, fill: css("--hl2")}, f2(b - a) + " ms"); }
  el("text", {x: 80, y: Y.GPU + 48, "font-size": 11, fill: css("--muted")}, `0 … ${f2(T)} ms (elméleti modell, illusztratív; ${NB} blokk/kernel, ${CAP} egyidejű blokk)`);
}
function reload(){ R = sim(NB, LEG); render(STEPS[k]);
  document.getElementById("res").textContent = "streamidők: " + R.times.map(f2).join(" / ") + " ms"; }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
