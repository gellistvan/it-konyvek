<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UM-labor: lapok helye és page faultok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="pc" onchange="{const i=k;setSteps(this.checked?SON:SOFF);show(i);}"> c prefetch-elése (a 4. lépésben; a labor kódjában nincs)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az a, b, c tömbök 8-8 blokkja a CPU- vagy a GPU-memóriában, lépésenként, page fault jelölővel"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető modell a 26.4.4 laborjához (n = 2^22 float, 16 MiB tömbönként); nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "title": "1. lépés\nhost init", "loc": {"a": "CPU", "b": "CPU", "c": "-"}, "fault": [], "line": 0, "msg": "1. lépés: a host inicializálja a-t és b-t → a, b lapjai a CPU-memóriában jönnek létre; c még nincs leképezve (első iteráció)."}, {"n": 2, "title": "2. lépés\nhideg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": ["a", "b", "c"], "line": 1, "msg": "2. lépés: hideg kernel → a és b blokkjai page faulttal, egyenként vándorolnak a GPU-ra; c az első GPU-s érintéskor a GPU-n jön létre."}, {"n": 3, "title": "3. lépés\nhost ellenőrzés", "loc": {"a": "GPU", "b": "GPU", "c": "CPU"}, "fault": ["c"], "line": 2, "msg": "3. lépés: a host ellenőrzés olvassa c-t → CPU-oldali faultok, c a CPU-ra kerül; a és b a GPU-n marad."}, {"n": 4, "title": "4. lépés\nprefetch", "loc": {"a": "GPU", "b": "GPU", "c": "CPU"}, "fault": [], "line": 4, "msg": "4. lépés: a, b prefetch a hostra, majd prefetch a, b → GPU (tömbös átvitel, fault nélkül); c a CPU-n marad (a labor nem prefetch-eli)."}, {"n": 5, "title": "5. lépés\nmeleg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": ["c"], "line": 6, "msg": "5. lépés: meleg kernel → a és b a GPU-n van, de c blokkjai page faulttal vándorolnak vissza (a „meleg” mérés nem meleg, lásd T-G11-009)."}];
const CODE = ["for (int i = 0; i < n; ++i) { a[i] = 1.0f; b[i] = 2.0f; }   // host init", "vectorAdd<<<grid, block>>>(a, b, c, n);                    // 1. fázis: hideg kernel", "for (int i = 0; i < n; ++i) if (c[i] != 3.0f) { ... }      // host ellenőrzés: olvassa c-t", "cudaMemPrefetchAsync(a, bytes, cudaCpuDeviceId, 0); /* b is */  // a, b vissza a hostra", "cudaMemPrefetchAsync(a, bytes, device, 0); /* b is */           // prefetch a, b -> GPU", "cudaMemPrefetchAsync(c, bytes, device, 0);   // NINCS a laborban (kapcsoló)", "vectorAdd<<<grid, block>>>(a, b, c, n);                    // 2. fázis: meleg kernel"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox","0 0 640 300");
  svg.innerHTML="";
  const L=css("--line");
  el("text",{x:150,y:22,"text-anchor":"middle","font-weight":"bold"},"CPU-memória");
  el("text",{x:450,y:22,"text-anchor":"middle","font-weight":"bold"},"GPU-memória");
  el("rect",{x:40,y:32,width:240,height:210,fill:"none",stroke:L,"stroke-dasharray":"6 4"});
  el("rect",{x:340,y:32,width:240,height:210,fill:"none",stroke:L});
  // vonalkázási minta
  const defs=el("defs",{});const pat=document.createElementNS(NS,"pattern");
  pat.setAttribute("id","h");pat.setAttribute("width",6);pat.setAttribute("height",6);pat.setAttribute("patternUnits","userSpaceOnUse");pat.setAttribute("patternTransform","rotate(45)");
  const ln=document.createElementNS(NS,"line");ln.setAttribute("x1",0);ln.setAttribute("y1",0);ln.setAttribute("x2",0);ln.setAttribute("y2",6);ln.setAttribute("stroke",L);ln.setAttribute("stroke-width",1.4);pat.appendChild(ln);defs.appendChild(pat);
  ["a","b","c"].forEach((arr,r)=>{
    const y=60+r*65;
    el("text",{x:20,y:y+22,"text-anchor":"middle","font-family":"monospace","font-size":18},arr);
    const loc=s.loc[arr];
    if(loc==="-"){el("text",{x:160,y:y+22,"text-anchor":"middle","font-style":"italic"},"nincs lap");return;}
    const x0=(loc==="CPU")?50:350;
    for(let i=0;i<8;i++){
      el("rect",{x:x0+i*28,y:y,width:24,height:32,fill:loc==="CPU"?"url(#h)":css("--cellhl"),stroke:L});
      if(s.fault.includes(arr)) el("text",{x:x0+i*28+12,y:y-4,"text-anchor":"middle","font-weight":"bold"},"×");
    }
  });
  const pc=document.getElementById("pc");
  el("text",{x:320,y:272,"text-anchor":"middle","font-size":13},`${s.title.replace("\n"," – ")} · 1 blokk = 2 MiB · × = page fault · c prefetch: ${pc&&pc.checked?"be":"ki"}`);
  el("text",{x:320,y:292,"text-anchor":"middle","font-size":12,fill:css("--muted")},"Pascal+ GPU, Linux, concurrentManagedAccess = 1; első iteráció");
}
const SOFF=[{"n": 1, "title": "1. lépés\nhost init", "loc": {"a": "CPU", "b": "CPU", "c": "-"}, "fault": [], "line": 0, "msg": "1. lépés: a host inicializálja a-t és b-t → a, b lapjai a CPU-memóriában jönnek létre; c még nincs leképezve (első iteráció)."}, {"n": 2, "title": "2. lépés\nhideg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": ["a", "b", "c"], "line": 1, "msg": "2. lépés: hideg kernel → a és b blokkjai page faulttal, egyenként vándorolnak a GPU-ra; c az első GPU-s érintéskor a GPU-n jön létre."}, {"n": 3, "title": "3. lépés\nhost ellenőrzés", "loc": {"a": "GPU", "b": "GPU", "c": "CPU"}, "fault": ["c"], "line": 2, "msg": "3. lépés: a host ellenőrzés olvassa c-t → CPU-oldali faultok, c a CPU-ra kerül; a és b a GPU-n marad."}, {"n": 4, "title": "4. lépés\nprefetch", "loc": {"a": "GPU", "b": "GPU", "c": "CPU"}, "fault": [], "line": 4, "msg": "4. lépés: a, b prefetch a hostra, majd prefetch a, b → GPU (tömbös átvitel, fault nélkül); c a CPU-n marad (a labor nem prefetch-eli)."}, {"n": 5, "title": "5. lépés\nmeleg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": ["c"], "line": 6, "msg": "5. lépés: meleg kernel → a és b a GPU-n van, de c blokkjai page faulttal vándorolnak vissza (a „meleg” mérés nem meleg, lásd T-G11-009)."}], SON=[{"n": 1, "title": "1. lépés\nhost init", "loc": {"a": "CPU", "b": "CPU", "c": "-"}, "fault": [], "line": 0, "msg": "1. lépés: a host inicializálja a-t és b-t → a, b lapjai a CPU-memóriában jönnek létre; c még nincs leképezve (első iteráció)."}, {"n": 2, "title": "2. lépés\nhideg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": ["a", "b", "c"], "line": 1, "msg": "2. lépés: hideg kernel → a és b blokkjai page faulttal, egyenként vándorolnak a GPU-ra; c az első GPU-s érintéskor a GPU-n jön létre."}, {"n": 3, "title": "3. lépés\nhost ellenőrzés", "loc": {"a": "GPU", "b": "GPU", "c": "CPU"}, "fault": ["c"], "line": 2, "msg": "3. lépés: a host ellenőrzés olvassa c-t → CPU-oldali faultok, c a CPU-ra kerül; a és b a GPU-n marad."}, {"n": 4, "title": "4. lépés\nprefetch", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": [], "line": 5, "msg": "4. lépés: a, b prefetch a hostra, majd prefetch a, b → GPU (tömbös átvitel, fault nélkül); c is prefetch-elve → GPU."}, {"n": 5, "title": "5. lépés\nmeleg kernel", "loc": {"a": "GPU", "b": "GPU", "c": "GPU"}, "fault": [], "line": 6, "msg": "5. lépés: meleg kernel → nincs page fault: mindhárom tömb a GPU-n van."}];


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
