<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>a·b + c két kerekítéssel és FMA-val</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a = <input id="ia" size="14" value="1.00000012"></label>
<label>b = <input id="ib" size="14" value="0.99999988"></label>
<label>c = <input id="ic" size="8" value="-1"></label>
<button id="go">számol</button><button id="bk">a könyv példája</button>
<span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A kétlépéses és az FMA-számítás lépésenként: pontos szorzat, kerekítés, c hozzáadása, végső kerekítés"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A JS pontos egész (BigInt) aritmetikával és round-to-nearest-even kerekítéssel számol; a saját bemenetet FP32-re kerekíti. A könyv példája: 0,0 (kétlépéses) és −2^-46 ≈ −1,42·10⁻¹⁴ (FMA).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 0, "k": 0, "msg": "Bemenet: a = 1 + 2^-23, b = 1 − 2^-23, c = −1 (mind pontosan ábrázolható FP32-ben)."}, {"line": 1, "k": 1, "msg": "A pontos szorzat 1 − 2^-46: ez az 1 alatt van, de sokkal közelebb hozzá, mint a legközelebbi FP32-szám (1 − 2^-24)."}, {"line": 2, "k": 2, "msg": "Kétlépéses ág: FP32-ben az 1 alatti számok távolsága 2^-24, így a szorzat 1,0-ra kerekedik. Az FMA-ág nem kerekít, a pontos szorzattal megy tovább."}, {"line": 3, "k": 3, "msg": "A c hozzáadása: kétlépéses ágon 1,0 + (−1) = 0; FMA-ágon 1 − 2^-46 + (−1) = −2^-46."}, {"line": 4, "k": 4, "msg": "Végső kerekítés: a kétlépéses művelet 0,0-t ad, az FMA −2^-46 ≈ −1,42·10⁻¹⁴-t, ami FP32-ben is ábrázolható (0xA8800000)."}];
const CODE = ["a, b, c: FP32 bemenet", "p = a·b  (pontos szorzat, végtelen pontossággal)", "kétlépéses: q = fl(p)   |   FMA: nincs kerekítés, q = p", "s = q + c  (pontos összeg)", "eredmény = fl(s)   (kétlépéses: 2. kerekítés, FMA: az egyetlen kerekítés)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BOOK = {a: 1 + Math.pow(2,-23), b: 1 - Math.pow(2,-23), c: -1};
let IN = BOOK;
function bitsOf(x){const b=new DataView(new ArrayBuffer(4));b.setFloat32(0,x);return b.getUint32(0);}
function hex(x){return "0x"+bitsOf(x).toString(16).toUpperCase().padStart(8,"0");}
function dec(x){ // FP32 -> [BigInt m, int e]  (x = m * 2^e)
  const u=bitsOf(x), sg=u>>>31, ex=(u>>>23)&255, fr_=u&0x7fffff;
  let m, e; if(ex===0){m=fr_;e=-149;} else {m=fr_|0x800000;e=ex-150;}
  return [BigInt(sg?-m:m), e];
}
function rnd32(S, E){ // RNE kerekítés FP32-re: S*2^E (S BigInt)
  if(S===0n) return 0;
  const neg=S<0n; let M=neg?-S:S; const L=M.toString(2).length;
  let q=Math.max(E+L-24, -149);
  if(q>E){const sh=BigInt(q-E), half=1n<<(sh-1n), rem=M&((1n<<sh)-1n); M>>=sh;
    if(rem>half||(rem===half&&(M&1n)))M+=1n;}
  else q=E;
  return Math.fround((neg?-1:1)*Number(M)*Math.pow(2,q));
}
function addX(x, y){ // pontos összeg: [S,E]
  const e=Math.min(x[1],y[1]); return [(x[0]<<BigInt(x[1]-e))+(y[0]<<BigInt(y[1]-e)), e];
}
function exactStr(S,E){ // pontos érték szövegként (közelítő tizedes + 2-hatvány alak, ha egyszerű)
  const v=Number(S)*Math.pow(2,E); return v.toPrecision(17).replace(/\.?0+$/,"").replace(".",",").replace("-","−");
}
function calc(a,b,c){
  const A=dec(a), Bv=dec(b), Cv=dec(c);
  const P=[A[0]*Bv[0], A[1]+Bv[1]];
  const q2=rnd32(P[0],P[1]);
  const S2=addX(dec(q2), Cv), r2=rnd32(S2[0],S2[1]);
  const Sf=addX(P, Cv), rf=rnd32(Sf[0],Sf[1]);
  return {P:P,q2:q2,S2:S2,r2:r2,Sf:Sf,rf:rf};
}
function f32s(x){return (x===0?"0":x.toPrecision(9)).replace(".",",").replace("-","−")+" ["+hex(x)+"]";}
function render(s){
  svg.setAttribute("viewBox","0 0 760 300"); svg.innerHTML="";
  const a=IN.a,b=IN.b,c=IN.c, R=calc(a,b,c), k=s.k;
  el("text",{x:10,y:22,"font-size":14,"font-weight":"bold"},"bemenet");
  el("text",{x:10,y:44,"font-size":13},`a = ${f32s(a)}   b = ${f32s(b)}   c = ${f32s(c)}`);
  const rows=[["kétlépéses: fl(fl(a·b) + c)",[
      ["a·b (pontos)", exactStr(R.P[0],R.P[1])],
      ["1. kerekítés", f32s(R.q2)],
      ["+ c (pontos)", exactStr(R.S2[0],R.S2[1])],
      ["2. kerekítés", f32s(R.r2)]]],
    ["FMA: fl(a·b + c)",[
      ["a·b (pontos)", exactStr(R.P[0],R.P[1])],
      ["nincs kerekítés", exactStr(R.P[0],R.P[1])],
      ["+ c (pontos)", exactStr(R.Sf[0],R.Sf[1])],
      ["egy kerekítés", f32s(R.rf)]]]];
  rows.forEach(([t,cells],r)=>{
    const y0=78+r*110;
    el("text",{x:10,y:y0,"font-size":14,"font-weight":"bold"},t);
    cells.forEach(([h,v],q)=>{
      const x=10+q*187, on=(q+1)===k, done=(q+1)<=k;
      el("rect",{x:x,y:y0+10,width:178,height:70,rx:6,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":on?3:1,"stroke-dasharray":done?"":"4 3"});
      el("text",{x:x+8,y:y0+30,"font-size":12},h);
      if(done) el("text",{x:x+8,y:y0+54,"font-size":11},v.length>31?v.slice(0,31)+"…":v);
      if(q<3) el("text",{x:x+180,y:y0+50,"font-size":14},"→");
    });
  });
  if(k>=4){
    const d=R.r2!==R.rf;
    el("text",{x:10,y:296,"font-size":13,"font-weight":"bold"}, d?`A két eredmény eltér: ${f32s(R.r2)} vs. ${f32s(R.rf)}`:"A két eredmény ezen a bemeneten megegyezik.");
  }
}
function setIn(a,b,c){
  const e=document.getElementById("err");
  if(![a,b,c].every(Number.isFinite)){e.textContent="Hibás szám.";return;}
  IN={a:Math.fround(a),b:Math.fround(b),c:Math.fround(c)}; e.textContent="";
  const R=calc(IN.a,IN.b,IN.c);
  const m=[
    {k:0,line:0,msg:`Saját bemenet (FP32-re kerekítve): a = ${f32s(IN.a)}, b = ${f32s(IN.b)}, c = ${f32s(IN.c)}.`},
    {k:1,line:1,msg:`A pontos szorzat: ${exactStr(R.P[0],R.P[1])}.`},
    {k:2,line:2,msg:`Kétlépéses ág: fl(a·b) = ${f32s(R.q2)}; az FMA-ág nem kerekít.`},
    {k:3,line:3,msg:`+ c: kétlépéses ${exactStr(R.S2[0],R.S2[1])}, FMA ${exactStr(R.Sf[0],R.Sf[1])} (pontos értékek).`},
    {k:4,line:4,msg:`Végső kerekítés: kétlépéses ${f32s(R.r2)}, FMA ${f32s(R.rf)}.`}];
  setSteps(m);
}
document.getElementById("go").addEventListener("click",()=>setIn(+document.getElementById("ia").value.replace(",","."),+document.getElementById("ib").value.replace(",","."),+document.getElementById("ic").value.replace(",",".")));
document.getElementById("bk").addEventListener("click",()=>{IN=BOOK;setSteps(BOOK_STEPS);});
const BOOK_STEPS = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
