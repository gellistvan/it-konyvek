<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Képességek compute capability szerint</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--bar:#3a3a3a;--line:#000;--grid:#ddd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--bar:#cfcfcf;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
select,input,button{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;background:var(--code);padding:4px 8px}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.cap{cursor:pointer}
.cap:focus{outline:none}
.cap:focus .nm{text-decoration:underline}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="cc">CC:</label>
  <select id="cc"><option value="0">(mind)</option></select>
  <label for="paste">vagy a laborprogram sora:</label>
  <input id="paste" size="26" placeholder="Compute capability: 8.6" aria-label="Bemásolt Compute capability sor">
  <button id="go">Beolvas</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 660 340" role="img" aria-label="Idővonal CC 7.0-tól 12.x-ig; vízszintes sávok mutatják, melyik CC-től érhető el egy képesség; a TMEM csak CC 10.x-en."></svg>
<p class="small">Dokumentáció alapján (CUDA C++ Programming Guide, PTX ISA, whitepaperek); a 10.x/12.x értékek a használt CUDA-verzióval ellenőrizendők. BW DC = Blackwell adatközponti, BW GeF. = Blackwell GeForce. Egy sávra (vagy a nevére) kattintva a <code>__CUDA_ARCH__</code> feltétel és a fordítási cél jelenik meg.</p>
<script>
const D = {"cols": [{"cc": 70, "lab": "7.0", "short": "Volta", "year": 2017, "tc": 1}, {"cc": 75, "lab": "7.5", "short": "Turing", "year": 2018, "tc": 2}, {"cc": 80, "lab": "8.0", "short": "A100", "year": 2020, "tc": 3}, {"cc": 86, "lab": "8.6", "short": "GA10x", "year": 2020, "tc": 3}, {"cc": 89, "lab": "8.9", "short": "Ada", "year": 2022, "tc": 4}, {"cc": 90, "lab": "9.0", "short": "Hopper", "year": 2022, "tc": 4}, {"cc": 100, "lab": "10.x", "short": "BW DC", "year": 2024, "tc": 5}, {"cc": 120, "lab": "12.x", "short": "BW GeF.", "year": 2025, "tc": 5}], "caps": [{"name": "Independent Thread Scheduling", "start": 70, "exc": [], "info": "__CUDA_ARCH__ >= 700; -arch=sm_70 vagy újabb. A warp-szintű kódban __syncwarp() / *_sync intrinsicek kellenek."}, {"name": "Tensor Core FP16", "start": 70, "exc": [], "info": "__CUDA_ARCH__ >= 700; wmma (mma.h) FP16 bemenet, FP16/FP32 akkumulátor; cél: sm_70."}, {"name": "INT8 Tensor Core", "start": 75, "exc": [], "info": "__CUDA_ARCH__ >= 750 (az INT8 wmma CC 7.2-től); cél: sm_75. Az INT4 mód a Hopperből (9.0) kimaradt."}, {"name": "TF32 és BF16 TC", "start": 80, "exc": [], "info": "__CUDA_ARCH__ >= 800; wmma/mma tf32, __nv_bfloat16; cél: sm_80."}, {"name": "2:4 strukturált ritkítás", "start": 80, "exc": [], "info": "__CUDA_ARCH__ >= 800; mma.sp (cuSPARSELt); cél: sm_80."}, {"name": "cp.async", "start": 80, "exc": [], "info": "__CUDA_ARCH__ >= 800; cuda::memcpy_async / __pipeline_memcpy_async; cél: sm_80."}, {"name": "FP8 Tensor Core", "start": 89, "exc": [], "info": "__CUDA_ARCH__ >= 890; __nv_fp8_e4m3 / e5m2 MMA; cél: sm_89 (Hopperen wgmma: sm_90a)."}, {"name": "TMA + thread block cluster", "start": 90, "exc": [], "info": "__CUDA_ARCH__ >= 900; cp.async.bulk.tensor, __cluster_dims__, cooperative_groups::cluster_group; cél: sm_90 (wgmma-hoz sm_90a)."}, {"name": "FP4/FP6 Tensor Core", "start": 100, "exc": [], "info": "CC 10.x: tcgen05.mma, cél sm_100a; CC 12.x: mma (block-scaled), cél sm_120a; ellenőrizendő a CUDA-verzióval."}, {"name": "TMEM / tcgen05", "start": 100, "exc": [120], "info": "Csak CC 10.x: tcgen05.* utasítások és Tensor Memory, cél: sm_100a; a 12.x (GeForce Blackwell) nem támogatja."}]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, p){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(p||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const avail = (c, cc) => cc >= c.start && !c.exc.includes(cc);
const sel = document.getElementById("cc");
D.cols.forEach(c => { const o = document.createElement("option"); o.value = c.cc; o.textContent = `${c.lab} – ${c.short} (${c.year})`; sel.appendChild(o); });
function draw(){
  const cur = +sel.value; svg.innerHTML = "";
  const LW = 200, CW = 56, RH = 25, top = 86;
  D.cols.forEach((c, j) => { const x = LW + j * CW, on = c.cc === cur;
    if (on) el("rect", {x: x, y: 4, width: CW, height: top + D.caps.length * RH, fill: css("--code"), stroke: css("--hl"), "stroke-width": 2.5});
    el("circle", {cx: x + CW / 2, cy: 18, r: 10, fill: css("--cell"), stroke: css("--line")}); el("text", {x: x + CW / 2, y: 22, "text-anchor": "middle", "font-size": 11}, String(c.tc));
    el("text", {x: x + CW / 2, y: 46, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, c.lab);
    el("text", {x: x + CW / 2, y: 62, "text-anchor": "middle", "font-size": 11}, c.short);
    el("text", {x: x + CW / 2, y: 77, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(c.year)); });
  el("text", {x: LW - 8, y: 22, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "Tensor Core gen.");
  D.caps.forEach((c, i) => { const y = top + i * RH, ok = cur === 0 || avail(c, cur), g = el("g", {class: "cap", tabindex: 0, role: "button", opacity: ok ? 1 : 0.25, "aria-label": c.name + (ok ? "" : " – nem elérhető")});
    el("text", {class: "nm", x: LW - 8, y: y + 17, "text-anchor": "end", "font-size": 12.5}, c.name, g);
    D.cols.forEach((col, j) => { const x = LW + j * CW;
      if (avail(c, col.cc)) el("rect", {x: x, y: y + 4, width: CW, height: RH - 8, fill: css("--bar")}, undefined, g);
      else if (col.cc >= c.start) { el("rect", {x: x + 3, y: y + 4, width: CW - 6, height: RH - 8, fill: css("--cell"), stroke: css("--line")}, undefined, g); el("line", {x1: x + 3, y1: y + 4, x2: x + CW - 3, y2: y + RH - 4, stroke: css("--line")}, undefined, g); el("text", {x: x + CW / 2, y: y + 16, "text-anchor": "middle", "font-size": 10.5}, "nincs", g); } });
    const f = () => { document.getElementById("status").textContent = `${c.name}: ${c.info}` + (cur ? (avail(c, cur) ? ` – a kiválasztott CC-n elérhető.` : ` – a kiválasztott CC-n NEM elérhető.`) : ""); };
    g.addEventListener("click", f); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f(); } }); });
  if (cur) { const na = D.caps.filter(c => !avail(c, cur)).map(c => c.name); document.getElementById("status").textContent = `CC ${D.cols.find(c => c.cc === cur).lab}: ${D.caps.length - na.length} képesség elérhető` + (na.length ? `; nem elérhető: ${na.join(", ")}.` : "."); }
}
function parse(){
  const m = /(\d+)\s*\.\s*(\d+)/.exec(document.getElementById("paste").value);
  if (!m) { document.getElementById("status").textContent = "Nem találtam „X.Y” alakú compute capability-t a sorban."; return; }
  const v = +m[1] * 10 + +m[2], maj = +m[1];
  const col = D.cols.find(c => c.cc === v) || D.cols.find(c => Math.floor(c.cc / 10) === maj && maj >= 10) || D.cols.filter(c => c.cc <= v).pop();
  if (!col) { document.getElementById("status").textContent = "7.0-nál régebbi CC: az ábra képességei közül egyik sem érhető el."; return; }
  sel.value = col.cc; draw();
  if (col.cc !== v) document.getElementById("status").textContent += ` (A beolvasott ${m[1]}.${m[2]} a legközelebbi oszlopként: ${col.lab}.)`;
}
sel.addEventListener("change", draw);
document.getElementById("go").onclick = parse;
document.getElementById("paste").addEventListener("keydown", e => { if (e.key === "Enter") parse(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
document.getElementById("status").textContent = "Válassz CC-t, vagy másold be a laborprogram „Compute capability: X.Y” sorát; egy sávra kattintva részletek.";
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
