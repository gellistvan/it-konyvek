<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A warp címeinek szektor-leképezése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>stride: <input id="st" type="range" min="1" max="1024" value="1" oninput="cfg()" aria-label="Stride elemben"> <b id="stv">1</b></label><label>eltolás (B): <input id="of" type="range" min="0" max="124" step="4" value="0" oninput="cfg()" aria-label="Eltolás bájtban"> <b id="ofv">0</b></label><label>elemméret: <select id="es" onchange="cfg()"><option>4</option><option>8</option><option>16</option></select> B</label><span class="small">11.1.10:</span><button onclick="q(32)">a) tomb[i*32]</button><button onclick="q(2)">b) tomb[i*2]</button><button onclick="q(1)">c) tomb[i]</button><button onclick="q(1024)">d) tomb[(i%32)*1024]</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folytonos igazított olvasás 4 szektort, eltolt 5-öt, kettes stride 8-at, nyolcas stride 32-t érint; a kihasználtság 100, 80, 50, 12,5 és 25 százalék."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">CC 6.0+ szektormodell, 32 bájtos szektor, 128 bájtos cache line, egyetlen warp egyetlen utasítása; szemléltetés, nem mérés. A lépések a fejezet öt számpéldája és a float4 eset; a csúszka stride-ja 1–1024 (a d) kérdés 1024-es lépésköze miatt).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stride": 1, "offset": 0, "esize": 4, "sb": 4, "line": -1, "msg": "(1) stride 1, igazított: 4 szektor, 1 cache line, kihasználtság 100%"}, {"stride": 1, "offset": 4, "esize": 4, "sb": 4, "line": -1, "msg": "(2) 4 bájtos eltolás: 5 szektor, 2 cache line, kihasználtság 80%"}, {"stride": 2, "offset": 0, "esize": 4, "sb": 8, "line": -1, "msg": "(3) stride 2: 8 szektor, 2 cache line, kihasználtság 50%"}, {"stride": 8, "offset": 0, "esize": 4, "sb": 32, "line": -1, "msg": "(4) stride 8: 32 szektor, 8 cache line, kihasználtság 12,5%"}, {"stride": 1, "offset": 0, "esize": 4, "sb": 16, "line": -1, "msg": "(5) AoS Particle.x: 16 szektor, 4 cache line, kihasználtság 25%"}, {"stride": 1, "offset": 0, "esize": 16, "sb": 16, "line": -1, "msg": "float4 (16 bájt/lane): 16 szektor, 4 cache line, kihasználtság 100%"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function acc(sb, offset, es){
  const used = new Set(), addrs = [];
  for (let i = 0; i < 32; i++) { const a = offset + i * sb; addrs.push(a); for (let b = a; b < a + es; b++) used.add(b); }
  const sec = [...new Set([...used].map(b => Math.floor(b / 32)))].sort((a, b) => a - b);
  const lines = new Set([...used].map(b => Math.floor(b / 128))).size;
  return {addrs, used, sec, lines, util: 32 * es / (32 * sec.length)};
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  const c = acc(s.sb, s.offset, s.esize), n = c.sec.length;
  const cw = Math.min(80, 700 / n), x0 = 30, y0 = 170;
  const pos = {}; c.sec.forEach((v, k) => pos[v] = k);
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="hz" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${css("--muted")}" stroke-width="1"/></pattern>`;
  c.sec.forEach((sv, k) => {
    const x = x0 + k * cw;
    for (let b = 0; b < 8; b++) { let full = true; for (let q = 0; q < 4; q++) if (!c.used.has(sv * 32 + b * 4 + q)) full = false;
      el("rect", {x: x + b * cw / 8, y: y0, width: cw / 8, height: 30, fill: full ? css("--fg") : "url(#hz)", stroke: "none"}); }
    el("rect", {x: x, y: y0, width: cw, height: 30, fill: "none", stroke: css("--line"), "stroke-width": 1});
    if (sv % 4 === 0) el("line", {x1: x, x2: x, y1: y0 - 8, y2: y0 + 38, stroke: css("--fg"), "stroke-width": 3});
    if (k > 0 && c.sec[k - 1] !== sv - 1) el("text", {x: x, y: y0 + 52, "text-anchor": "middle", "font-size": 12, fill: css("--hl2")}, "…");
    if (n <= 16 || k % 4 === 0) el("text", {x: x + cw / 2, y: y0 + 50, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "#" + sv);
  });
  for (let i = 0; i < 32; i++) {
    const lx = x0 + i * 22 + 11, a = c.addrs[i], sv = Math.floor(a / 32), tx = x0 + pos[sv] * cw + (a % 32) / 32 * cw + 2;
    el("circle", {cx: lx, cy: 60, r: 4, fill: css("--fg")});
    el("line", {x1: lx, y1: 64, x2: tx, y2: y0 - 2, stroke: css("--muted"), "stroke-width": 0.8});
    if (i % 8 === 0 || i === 31) el("text", {x: lx, y: 50, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "lane " + i);
  }
  const pct = (Math.round(c.util * 1000) / 10).toString().replace(".", ",");
  el("text", {x: x0, y: 26, "font-size": 15, "font-weight": "bold"}, `${n} szektor · ${c.lines} cache line · ${32 * s.esize} hasznos / ${32 * n} betöltött bájt · ${pct}%`);
  el("text", {x: x0, y: 270, "font-size": 11, fill: css("--muted")}, "teli = hasznos bájt, csíkozott = betöltött, de nem használt; vastag vonal = 128 bájtos cache line-határ; … = kihagyott (nem érintett) szektorok");
}
function cfg(){
  const st = +document.getElementById("st").value, of = +document.getElementById("of").value, es = +document.getElementById("es").value;
  document.getElementById("stv").textContent = st; document.getElementById("ofv").textContent = of;
  const c = acc(st * es, of, es), pct = (Math.round(c.util * 1000) / 10).toString().replace(".", ",");
  setSteps([{stride: st, offset: of, esize: es, sb: st * es, line: -1, msg: `stride ${st}, eltolás ${of} B, elem ${es} B: ${c.sec.length} szektor, ${c.lines} cache line, kihasználtság ${pct}%`}]);
}
function q(st){ document.getElementById("st").value = st; document.getElementById("of").value = 0; document.getElementById("es").value = 4; cfg(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
