<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roofline – névleges és effektív plafonok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:140px}
input[type=number]{width:4.5em;font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Hardver">
  <label>B<sub>peak</sub> <input id="B" type="range" min="100" max="4000" step="1"><b id="Bv"></b> GB/s</label>
  <label>P<sub>peak</sub> <input id="P" type="range" min="1000" max="100000" step="100"><b id="Pv"></b> GFLOP/s</label>
  <label>η<sub>B</sub> <input id="eb" type="range" min="0.3" max="1" step="0.01"><b id="ebv"></b></label>
  <label>η<sub>P</sub> <input id="ep" type="range" min="0.3" max="1" step="0.01"><b id="epv"></b></label>
</div>
<div class="ctl" role="group" aria-label="Kernel">
  <label>f [FLOP/elem] <input id="f" type="number" min="0.01" step="any"></label>
  <label>r [B/elem] <input id="r" type="number" min="0" step="any"></label>
  <label>w [B/elem] <input id="w" type="number" min="0" step="any"></label>
  <button id="lab">Labor (vectorTriad, A100)</button>
  <button id="q">Önellenőrző kérdés</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 620 400" role="img" aria-label="Log–log Roofline-ábra: ferde sávszélességi és vízszintes számítási plafon, a kernel pontja"></svg>
<p class="small">Elméleti modell, nem mérés: P = min(η<sub>P</sub>·P<sub>peak</sub>, η<sub>B</sub>·B<sub>peak</sub>·I),
I = f/(r + w). Folytonos vastag: névleges plafon; szaggatott: effektív plafon; kör: ridge point; háromszög: a kernel.
Kezdőállapot: a labor A100 40 GB PCIe adatlapértékei, η<sub>B</sub> = 0,80 feltevés.</p>
<script>
const D = {"B": 1555.0, "P": 19500.0, "eb": 0.8, "ep": 1.0, "f": 2, "r": 8, "w": 4};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(t, a, s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!==undefined)e.textContent=s;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){return x.toLocaleString("hu-HU",{minimumFractionDigits:d,maximumFractionDigits:d});}
const $ = id => document.getElementById(id);
const X0=70, X1=600, Y0=360, Y1=20, LX0=-2, LX1=2, LY0=0, LY1=5;
const sx = I => X0 + (Math.log10(I) - LX0) / (LX1 - LX0) * (X1 - X0);
const sy = P => Y0 - (Math.log10(P) - LY0) / (LY1 - LY0) * (Y0 - Y1);
function roof(B, P, dash, color, w){
  const pts = [];
  for (let i = 0; i <= 200; i++){ const l = LX0 + (LX1 - LX0) * i / 200, I = Math.pow(10, l);
    const p = Math.max(1, Math.min(1e5, Math.min(P, B * I))); pts.push(sx(I).toFixed(1) + "," + sy(p).toFixed(1)); }
  el("polyline", {points: pts.join(" "), fill: "none", stroke: color, "stroke-width": w, "stroke-dasharray": dash});
}
function setAll(o){ for (const k of ["B","P","eb","ep","f","r","w"]) $(k).value = o[k]; draw(); }
function draw(){
  const B=+$("B").value, P=+$("P").value, eb=+$("eb").value, ep=+$("ep").value;
  const f=Math.max(1e-9,+$("f").value), r=Math.max(0,+$("r").value), w=Math.max(0,+$("w").value);
  $("Bv").textContent=hu(B,0); $("Pv").textContent=hu(P,0); $("ebv").textContent=hu(eb,2); $("epv").textContent=hu(ep,2);
  const Be=eb*B, Pe=ep*P, ridgeN=P/B, ridge=Pe/Be, I=f/Math.max(1e-12,r+w), perf=Math.min(Pe, Be*I);
  const mem = I < ridge, ratio = (1/Be)/(I/Pe);   // T_mem/T_comp = ridge/I
  svg.innerHTML = "";
  // rács és tengelyek
  for (let l = LX0; l <= LX1; l++){ const x = sx(Math.pow(10,l));
    el("line",{x1:x,y1:Y1,x2:x,y2:Y0,stroke:css("--grid")});
    el("text",{x:x,y:Y0+18,"text-anchor":"middle","font-size":12}, hu(Math.pow(10,l), l<0?-l:0)); }
  for (let l = LY0; l <= LY1; l++){ const y = sy(Math.pow(10,l));
    el("line",{x1:X0,y1:y,x2:X1,y2:y,stroke:css("--grid")});
    el("text",{x:X0-6,y:y+4,"text-anchor":"end","font-size":12}, hu(Math.pow(10,l),0)); }
  el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:css("--line")}); el("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:css("--line")});
  el("text",{x:(X0+X1)/2,y:Y0+36,"text-anchor":"middle","font-size":13},"számítási intenzitás I [FLOP/bájt] (log)");
  el("text",{x:16,y:(Y0+Y1)/2,"text-anchor":"middle","font-size":13,transform:`rotate(-90 16 ${(Y0+Y1)/2})`},"GFLOP/s (log)");
  roof(B, P, "", css("--line"), 3);
  roof(Be, Pe, "8 5", css("--hl"), 2);
  if (ridgeN > 0.01 && ridgeN < 100){ el("circle",{cx:sx(ridgeN),cy:sy(P),r:6,fill:css("--bg"),stroke:css("--line"),"stroke-width":2});
    el("text",{x:sx(ridgeN),y:sy(P)-10,"text-anchor":"middle","font-size":12},"névleges ridge "+hu(ridgeN,2)); }
  if (ridge > 0.01 && ridge < 100){ el("circle",{cx:sx(ridge),cy:sy(Pe),r:5,fill:css("--hl")});
    el("text",{x:sx(ridge)+8,y:sy(Pe)+18,"font-size":12,fill:css("--hl")},"effektív ridge "+hu(ridge,2)); }
  if (I > 0.01 && I < 100 && perf >= 1){ const x=sx(I), y=sy(perf);
    el("polygon",{points:`${x},${y-9} ${x-8},${y+6} ${x+8},${y+6}`,fill:css("--hl2"),stroke:css("--line")});
    el("line",{x1:x,y1:y+6,x2:x,y2:Y0,stroke:css("--hl2"),"stroke-dasharray":"2 3"});
    el("text",{x:x+10,y:y+16,"font-size":12},"kernel: "+hu(perf,1)+" GFLOP/s"); }
  $("status").textContent = `I = ${hu(I,4)} FLOP/bájt, ridge (effektív) = ${hu(ridge,2)} FLOP/bájt (névleges ${hu(ridgeN,2)}) – `
    + (mem ? "memória-korlátos" : "számítás-korlátos") + `; várt P = ${hu(perf,1)} GFLOP/s; T_mem/T_comp = ${hu(ratio,2)}.`;
}
for (const k of ["B","P","eb","ep","f","r","w"]) $(k).addEventListener("input", draw);
$("lab").onclick = () => setAll(D);
$("q").onclick = () => setAll({B:900, P:14000, eb:1, ep:1, f:1, r:4, w:4});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setAll(D);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
