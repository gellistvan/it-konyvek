<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blelloch-scan lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>bemenet (8 vagy 16 szám): <input id="inp" value="3, 1, 7, 0, 4, 1, 6, 3" size="26" aria-label="Saját bemenet"></label><button onclick="rebuild()">Betöltés</button><label><input id="hs" type="checkbox" onchange="rebuild()"> Hillis–Steele mód (inclusive)</label><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét lépés nyilakkal: az up-sweep után az utolsó cellában 25 áll, a down-sweep végén a sor [0, 3, 4, 11, 11, 15, 16, 22]."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">0-alapú index, összeadás, BLOCK_SIZE = 8 (vagy 16). Munka n = 8-ra: Blelloch 7 + 7 = 14 művelet (a down-sweep cserét és összeadást végez), Hillis–Steele 7 + 6 + 4 = 17 összeadás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "bemenet", "stride": 0, "arr": [3, 1, 7, 0, 4, 1, 6, 3], "writes": [], "pairs": [], "adds": 0, "msg": "bemenet: [3, 1, 7, 0, 4, 1, 6, 3] → [3, 1, 7, 0, 4, 1, 6, 3]; összeadások eddig: 0", "line": 0, "mode": "b", "cnt": 0}, {"ph": "up", "stride": 1, "arr": [3, 4, 7, 7, 4, 5, 6, 9], "writes": [1, 3, 5, 7], "pairs": [[0, 1], [2, 3], [4, 5], [6, 7]], "adds": 4, "msg": "up-sweep, stride = 1, írt indexek: 1, 3, 5, 7 → [3, 4, 7, 7, 4, 5, 6, 9]; összeadások eddig: 4", "line": 2, "mode": "b", "cnt": 4}, {"ph": "up", "stride": 2, "arr": [3, 4, 7, 11, 4, 5, 6, 14], "writes": [3, 7], "pairs": [[1, 3], [5, 7]], "adds": 2, "msg": "up-sweep, stride = 2, írt indexek: 3, 7 → [3, 4, 7, 11, 4, 5, 6, 14]; összeadások eddig: 6", "line": 2, "mode": "b", "cnt": 6}, {"ph": "up", "stride": 4, "arr": [3, 4, 7, 11, 4, 5, 6, 25], "writes": [7], "pairs": [[3, 7]], "adds": 1, "msg": "up-sweep, stride = 4, írt indexek: 7 → [3, 4, 7, 11, 4, 5, 6, 25]; összeadások eddig: 7", "line": 2, "mode": "b", "cnt": 7}, {"ph": "gyökér", "stride": 0, "arr": [3, 4, 7, 11, 4, 5, 6, 0], "writes": [7], "pairs": [], "adds": 0, "msg": "gyökér nullázása: temp[7] = 0 → [3, 4, 7, 11, 4, 5, 6, 0]; összeadások eddig: 7", "line": 3, "mode": "b", "cnt": 7}, {"ph": "down", "stride": 4, "arr": [3, 4, 7, 0, 4, 5, 6, 11], "writes": [7], "pairs": [[3, 7]], "adds": 1, "msg": "down-sweep, stride = 4, írt indexek: 3, 7 → [3, 4, 7, 0, 4, 5, 6, 11]; összeadások eddig: 8", "line": 5, "mode": "b", "cnt": 8}, {"ph": "down", "stride": 2, "arr": [3, 0, 7, 4, 4, 11, 6, 16], "writes": [3, 7], "pairs": [[1, 3], [5, 7]], "adds": 2, "msg": "down-sweep, stride = 2, írt indexek: 1, 3, 5, 7 → [3, 0, 7, 4, 4, 11, 6, 16]; összeadások eddig: 10", "line": 5, "mode": "b", "cnt": 10}, {"ph": "down", "stride": 1, "arr": [0, 3, 4, 11, 11, 15, 16, 22], "writes": [1, 3, 5, 7], "pairs": [[0, 1], [2, 3], [4, 5], [6, 7]], "adds": 4, "msg": "down-sweep, stride = 1, írt indexek: 0, 1, 2, 3, 4, 5, 6, 7 → [0, 3, 4, 11, 11, 15, 16, 22]; összeadások eddig: 14 (exclusive scan).", "line": 5, "mode": "b", "cnt": 14}];
const CODE = ["temp[tid] = input[tid]; __syncthreads();", "for (stride = 1; stride < BLOCK_SIZE; stride <<= 1) {   // up-sweep", "    idx = (tid + 1) * (stride << 1) - 1; if (idx < BLOCK_SIZE) temp[idx] += temp[idx - stride]; }", "if (tid == 0) temp[BLOCK_SIZE - 1] = 0;", "for (stride = BLOCK_SIZE >> 1; stride > 0; stride >>= 1) {   // down-sweep", "    if (idx < BLOCK_SIZE) { left = temp[idx - stride]; temp[idx - stride] = temp[idx]; temp[idx] += left; } }", "output[tid] = temp[tid];", "// Hillis–Steele: for (d = 1; d < n; d <<= 1) x'[i] = (i >= d) ? x[i] + x[i - d] : x[i];"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function blelloch(x){
  const n = x.length, t = x.slice(), rows = [{ph: "bemenet", stride: 0, arr: t.slice(), writes: [], pairs: [], adds: 0}];
  for (let s = 1; s < n; s <<= 1){ const ids = []; for (let tid = 0; tid < n; tid++){ const i = (tid + 1) * 2 * s - 1; if (i < n) ids.push(i); } ids.forEach(i => t[i] += t[i - s]); rows.push({ph: "up", stride: s, arr: t.slice(), writes: ids, pairs: ids.map(i => [i - s, i]), adds: ids.length}); }
  t[n - 1] = 0; rows.push({ph: "gyökér", stride: 0, arr: t.slice(), writes: [n - 1], pairs: [], adds: 0});
  for (let s = n >> 1; s > 0; s >>= 1){ const ids = []; for (let tid = 0; tid < n; tid++){ const i = (tid + 1) * 2 * s - 1; if (i < n) ids.push(i); } ids.forEach(i => { const l = t[i - s]; t[i - s] = t[i]; t[i] += l; }); rows.push({ph: "down", stride: s, arr: t.slice(), writes: ids, pairs: ids.map(i => [i - s, i]), adds: ids.length}); }
  return rows;
}
function hillis(x){
  const n = x.length; let a = x.slice(); const rows = [{ph: "bemenet", stride: 0, arr: a.slice(), writes: [], pairs: [], adds: 0}];
  for (let d = 1; d < n; d <<= 1){ const b = a.map((v, i) => i >= d ? v + a[i - d] : v), w = []; for (let i = d; i < n; i++) w.push(i); rows.push({ph: "hs", stride: d, arr: b.slice(), writes: w, pairs: w.map(i => [i - d, i]), adds: w.length}); a = b; }
  return rows;
}
function toSteps(rows, mode){
  let cnt = 0; const out = rows.map(r => {
    cnt += r.adds; let msg, line;
    if (r.ph === "bemenet"){ msg = "bemenet: [" + r.arr.join(", ") + "]"; line = 0; }
    else if (r.ph === "up"){ msg = "up-sweep, stride = " + r.stride + ", írt indexek: " + r.writes.join(", "); line = 2; }
    else if (r.ph === "gyökér"){ msg = "gyökér nullázása: temp[" + r.writes[0] + "] = 0"; line = 3; }
    else if (r.ph === "down"){ msg = "down-sweep, stride = " + r.stride + ", írt indexek: " + r.pairs.map(p => p[0] + ", " + p[1]).join(", "); line = 5; }
    else { msg = "Hillis–Steele, d = " + r.stride + ": x[i] += x[i − " + r.stride + "], i = " + r.stride + ".." + (r.arr.length - 1); line = 7; }
    msg += " → [" + r.arr.join(", ") + "]; összeadások eddig: " + cnt;
    return Object.assign({}, r, {msg: msg, line: line, mode: mode, cnt: cnt});
  });
  out[out.length - 1].msg += mode === "b" ? " (exclusive scan)." : " (inclusive scan).";
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  const n = s.arr.length, w = Math.min(64, 560 / n), x0 = (600 - n * w) / 2, y = 150;
  const wr = new Set(s.writes); if (s.ph === "down") s.pairs.forEach(p => wr.add(p[0]));
  const rd = new Set(s.pairs.map(p => p[0]));
  // halvány fa (Blelloch) a rács fölött
  if (s.mode === "b"){ for (let lv = 1; (1 << lv) <= n; lv++){ const st = 1 << lv; for (let i = st - 1; i < n; i += st){ el("line", {x1: x0 + (i - st / 2) * w + w / 2, y1: 40 + (Math.log2(n) - lv + 1) * 18, x2: x0 + i * w + w / 2, y2: 40 + (Math.log2(n) - lv) * 18, stroke: mu, "stroke-width": 0.6, opacity: 0.5}); el("line", {x1: x0 + i * w + w / 2, y1: 40 + (Math.log2(n) - lv + 1) * 18, x2: x0 + i * w + w / 2, y2: 40 + (Math.log2(n) - lv) * 18, stroke: mu, "stroke-width": 0.6, opacity: 0.5}); } } }
  s.arr.forEach((v, i) => {
    el("rect", {x: x0 + i * w, y: y, width: w, height: 44, fill: wr.has(i) ? ch_ : cl, stroke: wr.has(i) ? h2 : ln, "stroke-width": wr.has(i) ? 3 : 1, "stroke-dasharray": (rd.has(i) && !wr.has(i)) ? "5 3" : "none"});
    el("text", {x: x0 + i * w + w / 2, y: y + 28, "text-anchor": "middle", "font-size": w < 40 ? 12 : 16}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y + 62, "text-anchor": "middle", "font-size": 10, fill: mu}, String(i));
  });
  s.pairs.forEach(([a, b]) => {
    const xa = x0 + a * w + w / 2, xb = x0 + b * w + w / 2, hgt = 20 + (b - a) * 4;
    el("path", {d: "M" + xa + " " + y + " Q " + (xa + xb) / 2 + " " + (y - hgt) + " " + xb + " " + (y - 2), fill: "none", stroke: hl, "stroke-width": 1.6});
    el("circle", {cx: xb, cy: y - 2, r: 3, fill: hl});
    if (s.ph === "down"){ el("path", {d: "M" + xb + " " + (y + 44) + " Q " + (xa + xb) / 2 + " " + (y + 44 + hgt) + " " + xa + " " + (y + 46), fill: "none", stroke: h2, "stroke-width": 1.4, "stroke-dasharray": "4 3"}); el("circle", {cx: xa, cy: y + 46, r: 3, fill: h2}); }
  });
  el("text", {x: 10, y: 270, "font-size": 13, "font-weight": "bold"}, (s.mode === "b" ? "Blelloch" : "Hillis–Steele") + " – összeadások eddig: " + s.cnt);
  el("text", {x: 10, y: 290, "font-size": 11, fill: mu}, s.ph === "down" ? "Folytonos nyíl: jobb gyermek = bal régi értéke + szülő; szaggatott: a bal gyermek a szülő értékét kapja." : "Nyíl: a forráscellából a célcellába adott érték; szaggatott keret: olvasott cella.");
}
function rebuild(){
  const raw = document.getElementById("inp").value.split(/[\s,;]+/).filter(v => v !== "").map(Number), msg = document.getElementById("err");
  msg.textContent = "";
  if (raw.some(v => !Number.isFinite(v)) || ![8, 16].includes(raw.length)){ msg.textContent = "8 vagy 16 számot adj meg."; return; }
  const hs = document.getElementById("hs").checked;
  setSteps(hs ? toSteps(hillis(raw), "h") : toSteps(blelloch(raw), "b"));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
