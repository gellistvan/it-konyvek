<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sávszélesség és munkahalmaz</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
input,button,textarea{font:inherit}
input[type=number]{width:6.5em}
input[type=range]{flex:1;min-width:180px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
textarea{width:100%;height:4.5em}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label>L2 (MB): <input id="l2" type="number" min="1" step="any" value="40.0" aria-label="L2 mérete MB-ban"></label>
  <label>L2-sávszélesség (GB/s): <input id="bl2" type="number" min="1" step="any" value="5000.0" aria-label="L2-sávszélesség"></label>
  <label>DRAM (GB/s): <input id="bd" type="number" min="1" step="any" value="1555.0" aria-label="DRAM-sávszélesség"></label>
  <button id="a100">A100 alapérték</button>
</div>
<div class="ctl">
  <label for="ws">munkahalmaz:</label>
  <input id="ws" type="range" min="0" max="12" step="0.01" value="11" aria-label="munkahalmaz log2 MiB">
  <span id="wsv"></span>
  <button id="p32">32 MiB (11.3)</button> <button id="p2048">2048 MiB (13.2)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="Effektív sávszélesség a munkahalmaz függvényében: az L2 méretéig magas plató, utána a DRAM-sávszélességre esik."></svg>
<label class="small" for="meas">Saját mért pontok, soronként „méret MiB; GB/s” (pl. 2048; 1480):</label>
<textarea id="meas" aria-label="saját mért pontok"></textarea>
<p class="small">Sematikus modell, nem mérés: W ≤ L2 esetén L2-plató, felette feltételezett L2-találati arány h = (L2/W)², és 1/BW = h/BW_L2 + (1 − h)/BW_DRAM. Az alapértékek az A100 számai (L2 = 40 MB, L2 ≈ 5 TB/s nagyságrendi becslés, DRAM 1555 GB/s). A saját GPU görbéjét a laborral kell felvenni.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function $(id){ return document.getElementById(id); }
function num(id){ return parseFloat(String($(id).value).replace(",", ".")); }
function hu(v, d){ let s = v.toFixed(d); const p = s.split("."); if (p[0].length > 4) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " "); return p.join(","); }
const MIB = 1048576;
function bw(wMiB, l2MB, bl2, bd){ const w = wMiB * MIB, l2 = l2MB * 1e6; if (w <= l2) return bl2; const h = (l2 / w) ** 2; return 1 / (h / bl2 + (1 - h) / bd); }
function draw(){
  const l2 = num("l2"), bl2 = num("bl2"), bd = num("bd"), lw = +$("ws").value, w = 2 ** lw;
  $("wsv").textContent = `${hu(w, w < 10 ? 1 : 0)} MiB`;
  if (!(l2 > 0 && bl2 > 0 && bd > 0)) { $("status").textContent = "Adj meg pozitív értékeket."; return; }
  svg.innerHTML = "";
  const X0 = 70, X1 = 740, Y0 = 16, Y1 = 300, ymax = Math.max(bl2, bd) * 1.15;
  const X = m => X0 + Math.log2(m) / 12 * (X1 - X0), Y = v => Y1 - v / ymax * (Y1 - Y0), fg = css("--fg"), mu = css("--muted");
  [1, 4, 16, 64, 256, 1024, 4096].forEach(m => { el("line", {x1: X(m), y1: Y0, x2: X(m), y2: Y1, stroke: mu, "stroke-width": 0.4, "stroke-dasharray": "2 3"}); el("text", {x: X(m), y: Y1 + 16, "text-anchor": "middle", "font-size": 11}, String(m)); });
  const step = ymax > 4000 ? 1000 : ymax > 1500 ? 500 : ymax > 600 ? 200 : 100;
  for (let v = 0; v <= ymax; v += step) { el("line", {x1: X0, y1: Y(v), x2: X1, y2: Y(v), stroke: mu, "stroke-width": 0.4, "stroke-dasharray": "2 3"}); el("text", {x: X0 - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, hu(v, 0)); }
  el("text", {x: (X0 + X1) / 2, y: Y1 + 34, "text-anchor": "middle", "font-size": 12}, "munkahalmaz (forrás + cél, MiB, log2 skála)");
  el("text", {x: 14, y: (Y0 + Y1) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(Y0 + Y1) / 2})`}, "effektív GB/s");
  let d = "";
  for (let i = 0; i <= 600; i++) { const m = 2 ** (12 * i / 600); d += (i ? " L " : "M ") + X(m).toFixed(1) + " " + Y(bw(m, l2, bl2, bd)).toFixed(1); }
  el("path", {d: d, fill: "none", stroke: fg, "stroke-width": 2.6});
  const l2m = l2 * 1e6 / MIB;
  [[l2m, "L2", "6 4"], [3 * l2m, "3 × L2", "2 3"]].forEach(([m, t, da]) => { if (m >= 1 && m <= 4096) { el("line", {x1: X(m), y1: Y0, x2: X(m), y2: Y1, stroke: fg, "stroke-dasharray": da}); el("text", {x: X(m) + 4, y: Y0 + 12, "font-size": 11}, t); } });
  // saját pontok
  $("meas").value.split(/\n/).forEach(line => { const p = line.split(";").map(s => parseFloat(s.replace(",", "."))); if (p.length >= 2 && p[0] > 0 && p[1] >= 0 && p[0] <= 4096) el("rect", {x: X(p[0]) - 5, y: Y(p[1]) - 5, width: 10, height: 10, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2}); });
  // mozgó pont
  const b = bw(w, l2, bl2, bd);
  el("circle", {cx: X(w), cy: Y(b), r: 7, fill: css("--hl2"), stroke: fg, "stroke-width": 1.2});
  const ok = w * MIB >= 3 * l2 * 1e6;
  const plateau = w * MIB <= l2 * 1e6 ? "L2-platón (az L2-t méri)" : (b < bd * 1.02 ? "DRAM-platón" : "átmeneti szakaszon");
  $("status").textContent = `munkahalmaz ${hu(w, w < 10 ? 1 : 0)} MiB: modell ${hu(b, 0)} GB/s, ${plateau}; „legalább 3 × L2” (${hu(3 * l2m, 1)} MiB) feltétel: ${ok ? "teljesül" : "NEM teljesül"}`;
}
["l2", "bl2", "bd", "ws", "meas"].forEach(id => $(id).addEventListener("input", draw));
$("a100").onclick = () => { $("l2").value = 40.0; $("bl2").value = 5000.0; $("bd").value = 1555.0; draw(); };
$("p32").onclick = () => { $("ws").value = 5; draw(); };
$("p2048").onclick = () => { $("ws").value = 11; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
