<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súly-állandós szisztolikus tömb</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A = <input id="inA" size="14" value="1 2; 3 4" aria-label="A mátrix, soronként pontosvesszővel"></label><label>B = <input id="inB" size="14" value="5 6; 7 8" aria-label="B mátrix"></label><button onclick="runInput()">Szimuláció</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="2×2-es szisztolikus tömb ciklusonként: rögzített súlyok, ferdített aktivációk, részösszegek lefelé"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Időzítési modell: (j, k) az A_ij-t az i + j + k. ciklusban dolgozza fel, a C_ik az i + k + N − 1. ciklusban lép ki; a súlybetöltés nincs ábrázolva. A kódpanel a 27.1.2 táblázata.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. ciklus: (0,0): 0 + 1·5 = 5 · kihasználtság: 1/4", "line": 1, "rows": [1], "t": 0, "act": [{"j": 0, "k": 0, "i": 0, "pin": 0, "a": 1, "w": 5, "out": 5, "exit": false}], "N": 2, "A": [[1, 2], [3, 4]], "B": [[5, 6], [7, 8]]}, {"msg": "1. ciklus: (1,0): 5 + 2·7 = 19 → C00; (0,0): 0 + 3·5 = 15; (0,1): 0 + 1·6 = 6 · kihasználtság: 3/4", "line": 2, "rows": [2, 3, 4], "t": 1, "act": [{"j": 0, "k": 0, "i": 1, "pin": 0, "a": 3, "w": 5, "out": 15, "exit": false}, {"j": 0, "k": 1, "i": 0, "pin": 0, "a": 1, "w": 6, "out": 6, "exit": false}, {"j": 1, "k": 0, "i": 0, "pin": 5, "a": 2, "w": 7, "out": 19, "exit": true}], "N": 2, "A": [[1, 2], [3, 4]], "B": [[5, 6], [7, 8]]}, {"msg": "2. ciklus: (1,0): 15 + 4·7 = 43 → C10; (1,1): 6 + 2·8 = 22 → C01; (0,1): 0 + 3·6 = 18 · kihasználtság: 3/4", "line": 5, "rows": [5, 6, 7], "t": 2, "act": [{"j": 0, "k": 1, "i": 1, "pin": 0, "a": 3, "w": 6, "out": 18, "exit": false}, {"j": 1, "k": 0, "i": 1, "pin": 15, "a": 4, "w": 7, "out": 43, "exit": true}, {"j": 1, "k": 1, "i": 0, "pin": 6, "a": 2, "w": 8, "out": 22, "exit": true}], "N": 2, "A": [[1, 2], [3, 4]], "B": [[5, 6], [7, 8]]}, {"msg": "3. ciklus: (1,1): 18 + 4·8 = 50 → C11 · kihasználtság: 1/4", "line": 8, "rows": [8], "t": 3, "act": [{"j": 1, "k": 1, "i": 1, "pin": 18, "a": 4, "w": 8, "out": 50, "exit": true}], "N": 2, "A": [[1, 2], [3, 4]], "B": [[5, 6], [7, 8]]}];
const CODE = ["ciklus | egység | művelet | eredmény", "0 | (0,0) | 0 + 1·5 | részösszeg 5", "1 | (1,0) | 5 + 2·7 | C00 = 19", "1 | (0,0) | 0 + 3·5 | részösszeg 15", "1 | (0,1) | 0 + 1·6 | részösszeg 6", "2 | (1,0) | 15 + 4·7 | C10 = 43", "2 | (1,1) | 6 + 2·8 | C01 = 22", "2 | (0,1) | 0 + 3·6 | részösszeg 18", "3 | (1,1) | 18 + 4·8 | C11 = 50"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR={A:[[1, 2], [3, 4]],B:[[5, 6], [7, 8]]};
function render(s){
  const N=s.N, cs=Math.min(90, 240/N), x0=150, y0=40;
  svg.setAttribute("viewBox","0 0 560 "+(y0+N*cs+80));
  svg.innerHTML="";
  const L=css("--line");
  const act={}; s.act.forEach(u=>act[u.j+","+u.k]=u);
  for(let j=0;j<N;j++) for(let k=0;k<N;k++){
    const u=act[j+","+k], x=x0+k*cs, y=y0+j*cs;
    el("rect",{x,y,width:cs-8,height:cs-8,fill:u?css("--cellhl"):css("--cell"),stroke:L,"stroke-width":u?3:1});
    el("text",{x:x+5,y:y+15,"font-size":12,fill:css("--muted")},"w="+s.B[j][k]);
    if(u){el("text",{x:x+(cs-8)/2,y:y+cs/2,"text-anchor":"middle","font-size":13},`${u.pin}+${u.a}·${u.w}`);
          el("text",{x:x+(cs-8)/2,y:y+cs/2+18,"text-anchor":"middle","font-size":14,"font-weight":"bold"},"="+u.out);
          if(k<N-1) el("line",{x1:x+cs-12,y1:y+cs*0.3,x2:x+cs+2,y2:y+cs*0.3,stroke:L,"stroke-width":2,"marker-end":"url(#ar)"});
          el("line",{x1:x+(cs-8)*0.2,y1:y+cs-12,x2:x+(cs-8)*0.2,y2:y+cs+2,stroke:L,"stroke-width":2,"stroke-dasharray":"5 3","marker-end":"url(#ar)"});}
  }
  const d=el("defs",{});const m=document.createElementNS(NS,"marker");
  m.setAttribute("id","ar");m.setAttribute("markerWidth",8);m.setAttribute("markerHeight",8);m.setAttribute("refX",6);m.setAttribute("refY",3);m.setAttribute("orient","auto");
  const pth=document.createElementNS(NS,"path");pth.setAttribute("d","M0,0 L6,3 L0,6 z");pth.setAttribute("fill",L);m.appendChild(pth);d.appendChild(m);
  for(let j=0;j<N;j++){const i=s.t-j; el("text",{x:x0-10,y:y0+j*cs+cs/2,"text-anchor":"end","font-size":13},(i>=0&&i<N)?`A${i}${j}=${s.A[i][j]} →`:"– →");}
  for(let k=0;k<N;k++) el("text",{x:x0+k*cs+(cs-8)/2,y:y0-8,"text-anchor":"middle","font-size":12,fill:css("--muted")},"0 ↓");
  const outs=s.act.filter(u=>u.exit).map(u=>`C${u.i}${u.k}=${u.out}`);
  el("text",{x:x0+N*cs/2,y:y0+N*cs+22,"text-anchor":"middle","font-size":14},"kilép: "+(outs.length?outs.join(", "):"–"));
  el("text",{x:x0+N*cs/2,y:y0+N*cs+44,"text-anchor":"middle","font-size":13,fill:css("--muted")},`${s.t}. ciklus · kihasználtság ${s.act.length}/${N*N} = ${Math.round(100*s.act.length/(N*N))}%`);
  (s.rows||[]).forEach(r=>{const e=document.getElementById("L"+r); if(e) e.classList.add("on");});
}
function simulate(A,B){
  const N=A.length, ps={}, steps=[], rows=["ciklus | egység | művelet | eredmény"];
  for(let t=0;t<=3*(N-1);t++){
    const act=[];
    for(let j=0;j<N;j++) for(let k=0;k<N;k++){const i=t-j-k; if(i>=0&&i<N){const pin=j>0?ps[i+","+(j-1)+","+k]:0, out=pin+A[i][j]*B[j][k]; ps[i+","+j+","+k]=out; act.push({j,k,i,pin,a:A[i][j],w:B[j][k],out,exit:j===N-1});}}
    act.sort((p,q)=>(q.j-p.j)||(p.k-q.k));
    const myrows=[];
    act.forEach(u=>{myrows.push(rows.length); rows.push(`${t} | (${u.j},${u.k}) | ${u.pin} + ${u.a}·${u.w} | `+(u.exit?`C${u.i}${u.k} = ${u.out}`:`részösszeg ${u.out}`));});
    const msg=`${t}. ciklus: `+act.map(u=>`(${u.j},${u.k}): ${u.pin} + ${u.a}·${u.w} = ${u.out}`+(u.exit?` → C${u.i}${u.k}`:"")).join("; ")+` · kihasználtság: ${act.length}/${N*N}`;
    steps.push({msg,line:myrows[0],rows:myrows,t,act,N,A,B});
  }
  return {steps,rows};
}
function parseM(txt){const r=txt.trim().split(/\s*;\s*/).map(row=>row.trim().split(/[\s,]+/).map(Number));return r;}
function runInput(){
  const A=parseM(document.getElementById("inA").value), B=parseM(document.getElementById("inB").value), N=A.length;
  const ok=(N===2||N===3)&&B.length===N&&A.every(r=>r.length===N&&r.every(Number.isFinite))&&B.every(r=>r.length===N&&r.every(Number.isFinite));
  if(!ok){status.textContent="Hibás bemenet: két 2×2-es vagy 3×3-as mátrix kell, soronként pontosvesszővel (pl. 1 2; 3 4).";return;}
  const res=simulate(A,B);
  codeEl.innerHTML=res.rows.map((l,i)=>`<span id="L${i}">${l}</span>`).join("");
  setSteps(res.steps);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
