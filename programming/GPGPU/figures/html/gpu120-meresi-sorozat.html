<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mérési sorozat: warm-up, kiugró érték, átlag és medián</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--band:#d9d9d9;--bar:#bbb;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--band:#3a3a3a;--bar:#666;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
input[type=range]{min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}td,th{padding:2px 8px;text-align:right;border-bottom:1px solid var(--band)}
</style>
</head>
<body>
<div class="ctl">
  <label>warm-up hossza: <input id="w" type="range" min="0" max="20" value="10" aria-describedby="status"> <b id="wv">10</b> indítás</label>
  <label><input id="out" type="checkbox" checked> a kiugró érték (42. indítás) bent van</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 820 330" role="img" aria-label="Ismétlésenkénti futásidők és a mért értékek hisztogramja átlag-, medián- és p95-vonallal"></svg>
<table id="tab" aria-label="Statisztika: kiugró értékkel és nélküle"></table>
<p class="small">Szintetikus illusztráció, nem mérés. Az 1. indítás (120 ms) a hideg indítás, mindig kimarad;
a warm-up a 2. indítástól számít. Szórás: minta-szórás (n − 1); p95 lineáris interpolációval.</p>
<script>
const D = {"series": [120.0, 0.7, 0.689, 0.678, 0.667, 0.656, 0.644, 0.633, 0.622, 0.611, 0.6, 0.563, 0.588, 0.574, 0.567, 0.573, 0.579, 0.592, 0.584, 0.58, 0.568, 0.584, 0.565, 0.565, 0.549, 0.584, 0.582, 0.574, 0.591, 0.582, 0.578, 0.568, 0.589, 0.587, 0.596, 0.585, 0.589, 0.584, 0.591, 0.576, 0.559, 0.8, 0.574, 0.569, 0.586, 0.583, 0.585, 0.589, 0.581, 0.591, 0.569, 0.587, 0.593, 0.569, 0.582, 0.581, 0.573, 0.582, 0.591, 0.583, 0.579], "outRun": 42, "warm": 10};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag, a, t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function f3(x){return x.toFixed(3).replace(".", ",");}
function pct(v, p){const s=[...v].sort((a,b)=>a-b);const h=(s.length-1)*p/100, lo=Math.floor(h);return lo+1<s.length? s[lo]+(h-lo)*(s[lo+1]-s[lo]) : s[lo];}
function st(v){const n=v.length, m=v.reduce((a,b)=>a+b,0)/n;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(n-1));
  return {n:n, mean:m, med:pct(v,50), sd:sd, cv:100*sd/m, p95:pct(v,95)};}
function sel(w, withOut){const r=[];for(let i=2+w;i<=D.series.length;i++){if(!withOut&&i===D.outRun)continue;r.push(D.series[i-1]);}return r;}
function draw(){
  const w=+document.getElementById("w").value, withOut=document.getElementById("out").checked;
  document.getElementById("wv").textContent = w;
  const v = sel(w, withOut), S = st(v), S2 = st(sel(w, !withOut));
  svg.innerHTML = "";
  // bal panel: sorozat (0,54–0,85 ms; az 1. indítás csak jelölve)
  const X0=50, X1=440, Y0=40, Y1=290, xs=i=>X0+(i-0.5)*(X1-X0)/62, ys=t=>Y1-(t-0.54)*(Y1-Y0)/(0.85-0.54);
  E("rect",{x:xs(1.5),y:Y0,width:xs(2+w)-xs(1.5)-(w?0:0),height:Y1-Y0,fill:css("--band")});
  E("line",{x1:X0,y1:Y1,x2:X1,y2:Y1,stroke:css("--line")}); E("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:css("--line")});
  [0.55,0.60,0.65,0.70,0.75,0.80,0.85].forEach(t=>{E("line",{x1:X0-4,x2:X0,y1:ys(t),y2:ys(t),stroke:css("--line")});E("text",{x:X0-7,y:ys(t)+4,"text-anchor":"end","font-size":11},t.toFixed(2).replace(".",","));});
  [1,11,21,31,41,51,61].forEach(i=>{E("text",{x:xs(i),y:Y1+15,"text-anchor":"middle","font-size":11},String(i));});
  E("text",{x:(X0+X1)/2,y:Y1+32,"text-anchor":"middle","font-size":12},"ismétlés sorszáma");
  E("text",{x:14,y:(Y0+Y1)/2,"font-size":12,transform:`rotate(-90 14 ${(Y0+Y1)/2})`,"text-anchor":"middle"},"idő (ms)");
  E("text",{x:xs(1),y:Y0-8,"font-size":11},"▲ 1. indítás: 120 ms (tengelyen kívül, kimarad)");
  if (w>0) E("text",{x:xs(1.5)+3,y:Y0+14,"font-size":11},"warm-up (nem számít)");
  let path="";
  for(let i=2;i<=D.series.length;i++){path+=(i===2?"M":"L")+xs(i).toFixed(1)+","+ys(D.series[i-1]).toFixed(1);}
  E("path",{d:path,fill:"none",stroke:css("--muted"),"stroke-width":1});
  for(let i=2;i<=D.series.length;i++){
    const t=D.series[i-1], inc = i>=2+w && (withOut || i!==D.outRun);
    if(i===D.outRun) E("circle",{cx:xs(i),cy:ys(t),r:6,fill:css("--bg"),stroke:css("--line"),"stroke-width":inc?2:1,"stroke-dasharray":inc?"":"2 2"});
    else E("circle",{cx:xs(i),cy:ys(t),r:2.6,fill:inc?css("--line"):css("--muted")});
  }
  E("text",{x:xs(D.outRun)+9,y:ys(0.80)+4,"font-size":11},"kiugró: 0,80 ms (másik folyamat)");
  // jobb panel: hisztogram
  const H0=500, H1=800, lo=0.545, hi=0.815, bw=0.01, hx=t=>H0+(t-lo)*(H1-H0)/(hi-lo);
  const nb=Math.round((hi-lo)/bw), cnt=new Array(nb).fill(0);
  v.forEach(t=>{const b=Math.min(nb-1,Math.max(0,Math.floor((t-lo)/bw+1e-9)));cnt[b]++;});
  const cm=Math.max(...cnt,1), hy=c=>Y1-c*(Y1-Y0-60)/cm;
  cnt.forEach((c,b)=>{if(c)E("rect",{x:hx(lo+b*bw),y:hy(c),width:(H1-H0)/nb,height:Y1-hy(c),fill:css("--bar"),stroke:css("--line"),"stroke-width":0.6});});
  E("line",{x1:H0,y1:Y1,x2:H1,y2:Y1,stroke:css("--line")});
  [0.56,0.60,0.64,0.68,0.72,0.76,0.80].forEach(t=>E("text",{x:hx(t),y:Y1+15,"text-anchor":"middle","font-size":11},t.toFixed(2).replace(".",",")));
  E("text",{x:(H0+H1)/2,y:Y1+32,"text-anchor":"middle","font-size":12},"idő (ms) – a számított értékek hisztogramja");
  [[S.med,"","medián"],[S.mean,"6 4","átlag"],[S.p95,"2 3","p95"]].forEach(([x,da,lab],q)=>{
    E("line",{x1:hx(x),x2:hx(x),y1:Y0+10,y2:Y1,stroke:css("--line"),"stroke-width":1.8,"stroke-dasharray":da});
    E("line",{x1:H1-150,x2:H1-120,y1:Y0+4+q*16,y2:Y0+4+q*16,stroke:css("--line"),"stroke-width":1.8,"stroke-dasharray":da});
    E("text",{x:H1-114,y:Y0+8+q*16,"font-size":11},`${lab}: ${f3(x)} ms`);
  });
  E("text",{x:H0,y:Y0-8,"font-size":11},`n = ${S.n}, szórás ${f3(S.sd)} ms, CV ${S.cv.toFixed(1).replace(".",",")} %`);
  const a=withOut?S:S2, b=withOut?S2:S;
  document.getElementById("tab").innerHTML = `<tr><th></th><th>n</th><th>átlag</th><th>medián</th><th>szórás</th><th>CV</th><th>p95</th></tr>`+
    [["kiugróval",a],["kiugró nélkül",b]].map(([l,s])=>`<tr><th style="text-align:left">${l}</th><td>${s.n}</td><td>${f3(s.mean)}</td><td>${f3(s.med)}</td><td>${f3(s.sd)}</td><td>${s.cv.toFixed(1).replace(".",",")} %</td><td>${f3(s.p95)}</td></tr>`).join("");
  document.getElementById("status").textContent =
    `warm-up: ${w} indítás, a kiugró érték ${withOut?"bent":"kihagyva"}: átlag ${f3(S.mean)} ms, medián ${f3(S.med)} ms, szórás ${f3(S.sd)} ms, CV ${S.cv.toFixed(1).replace(".",",")} %, p95 ${f3(S.p95)} ms. ` +
    `A kiugró érték az átlagot ${f3(Math.abs(a.mean-b.mean))} ms-mal, a mediánt csak ${f3(Math.abs(a.med-b.med))} ms-mal mozdítja el.`;
}
document.getElementById("w").addEventListener("input", draw);
document.getElementById("out").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
