<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Súly-stacionárius szisztolikus tömb</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>W (soronként, 9 egész): <input id="inW" size="18" value="1 2 3 4 5 6 7 8 9"></label><label>x⁽⁰⁾: <input id="inX0" size="6" value="1 1 1"></label><label>x⁽¹⁾: <input id="inX1" size="6" value="1 0 2"></label><button id="go">Számol</button><table id="tab" class="small" style="border-collapse:collapse;width:100%" aria-label="Cellaállapotok"></table></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="3×3-as MAC-rács ütemenként; a bemenetek ferdén balról, a parciális összegek lefelé haladnak, alul (12, 15, 18) és (15, 18, 21) lép ki."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus súly-stacionárius tömb (TPU v1-szerű); a valós MXU 128×128 vagy 256×256 cellás. A v. vektor i. eleme a t = v + i ütemben lép be (ferde betáplálás), a j. kimenet a t = v + j + 2 ütemben lép ki.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "cells": [[{"v": 0, "x": 1, "pin": 0, "pout": 1}, null, null], [null, null, null], [null, null, null]], "pend": [[[1, 1, 1]], [[0, 1, 1], [1, 0, 2]], [[0, 1, 2], [1, 2, 3]]], "out": [[], [], []], "msg": "0. ütem: 1 aktív cella.", "line": 3}, {"t": 1, "cells": [[{"v": 1, "x": 1, "pin": 0, "pout": 1}, {"v": 0, "x": 1, "pin": 0, "pout": 2}, null], [{"v": 0, "x": 1, "pin": 1, "pout": 5}, null, null], [null, null, null]], "pend": [[], [[1, 0, 1]], [[0, 1, 1], [1, 2, 2]]], "out": [[], [], []], "msg": "1. ütem: 3 aktív cella.", "line": 3}, {"t": 2, "cells": [[null, {"v": 1, "x": 1, "pin": 0, "pout": 2}, {"v": 0, "x": 1, "pin": 0, "pout": 3}], [{"v": 1, "x": 0, "pin": 1, "pout": 1}, {"v": 0, "x": 1, "pin": 2, "pout": 7}, null], [{"v": 0, "x": 1, "pin": 5, "pout": 12}, null, null]], "pend": [[], [], [[1, 2, 1]]], "out": [[[0, 12]], [], []], "msg": "2. ütem: 5 aktív cella. Kilép alul: y⁽⁰⁾₀ = 12.", "line": 4}, {"t": 3, "cells": [[null, null, {"v": 1, "x": 1, "pin": 0, "pout": 3}], [null, {"v": 1, "x": 0, "pin": 2, "pout": 2}, {"v": 0, "x": 1, "pin": 3, "pout": 9}], [{"v": 1, "x": 2, "pin": 1, "pout": 15}, {"v": 0, "x": 1, "pin": 7, "pout": 15}, null]], "pend": [[], [], []], "out": [[[0, 12], [1, 15]], [[0, 15]], []], "msg": "3. ütem: 5 aktív cella. Kilép alul: y⁽¹⁾₀ = 15, y⁽⁰⁾₁ = 15.", "line": 4}, {"t": 4, "cells": [[null, null, null], [null, null, {"v": 1, "x": 0, "pin": 3, "pout": 3}], [null, {"v": 1, "x": 2, "pin": 2, "pout": 18}, {"v": 0, "x": 1, "pin": 9, "pout": 18}]], "pend": [[], [], []], "out": [[[0, 12], [1, 15]], [[0, 15], [1, 18]], [[0, 18]]], "msg": "4. ütem: 3 aktív cella. Kilép alul: y⁽¹⁾₁ = 18, y⁽⁰⁾₂ = 18.", "line": 4}, {"t": 5, "cells": [[null, null, null], [null, null, null], [null, null, {"v": 1, "x": 2, "pin": 3, "pout": 21}]], "pend": [[], [], []], "out": [[[0, 12], [1, 15]], [[0, 15], [1, 18]], [[0, 18], [1, 21]]], "msg": "5. ütem: 1 aktív cella. Kilép alul: y⁽¹⁾₂ = 21. Mindkét kimenet teljes.", "line": 4}];
const CODE = ["minden t = 0, 1, …, 5 ütemben, minden (i, j) cellában egyszerre:", "  x ← a bal szomszéd előző ütembeli x-e      (bemenet balról jobbra)", "  psum_ki ← psum_be + x · W[i][j]             (psum_be a felső szomszédtól, a 0. sorban 0)", "  ferde betáplálás: x⁽ᵛ⁾ᵢ a t = v + i ütemben lép be az i. sorba", "  kimenet: y⁽ᵛ⁾ⱼ = psum_ki az alsó sorban, a t = v + j + 2 ütemben"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SUPS = ["⁽⁰⁾", "⁽¹⁾"], SUBS = ["₀", "₁", "₂"];
function simulate(W, X){
  const n = 3, V = X.length, T = V - 1 + 2 * (n - 1), out = [];
  for (let t = 0; t <= T; t++) {
    const cells = [[null, null, null], [null, null, null], [null, null, null]], newOut = []; let act = 0;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = t - i - j;
      if (v >= 0 && v < V) { let pin = 0; for (let q = 0; q < i; q++) pin += X[v][q] * W[q][j]; cells[i][j] = {v: v, x: X[v][i], pin: pin, pout: pin + X[v][i] * W[i][j]}; act++; } }
    const pend = [0, 1, 2].map(i => X.map((x, v) => [v, x[i], v + i - t]).filter(p => p[2] > 0));
    const outs = [0, 1, 2].map(j => X.map((x, v) => [v, [0, 1, 2].reduce((a, q) => a + x[q] * W[q][j], 0), v + j + n - 1]).filter(p => p[2] <= t).map(p => [p[0], p[1]]));
    for (let j = 0; j < n; j++) if (cells[n - 1][j]) newOut.push(`y${SUPS[cells[n - 1][j].v]}${SUBS[j]} = ${cells[n - 1][j].pout}`);
    let msg = `${t}. ütem: ${act} aktív cella.`;
    if (newOut.length) msg += " Kilép alul: " + newOut.join(", ") + ".";
    if (t === T) msg += " Mindkét kimenet teljes.";
    out.push({t: t, cells: cells, pend: pend, out: outs, msg: msg, line: newOut.length ? 4 : (t < n ? 3 : 2)});
  }
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const C = 78, X0 = 250, Y0 = 20;
  for (let i = 0; i < 3; i++) {
    el("text", {x: X0 - 14, y: Y0 + i * C + C / 2 - 26, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, i + ". sor");
    s.pend[i].forEach(p => { const cx = X0 - 30 - (p[2] - 1) * 44, cy = Y0 + i * C + C / 2;
      el("circle", {cx: cx, cy: cy, r: 15, fill: css("--cell"), stroke: css("--line"), "stroke-dasharray": "3 2"});
      el("text", {x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 14}, String(p[1]));
      el("text", {x: cx, y: cy - 19, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, SUPS[p[0]]); });
    el("text", {x: X0 - 6, y: Y0 + i * C + C / 2 + 5, "text-anchor": "end", "font-size": 14}, "→");
    for (let j = 0; j < 3; j++) { const c = s.cells[i][j], x = X0 + j * C, y = Y0 + i * C;
      el("rect", {x: x + 3, y: y + 3, width: C - 6, height: C - 6, rx: 4, fill: c ? css("--cellhl") : css("--cell"), stroke: c ? css("--line") : css("--muted"), "stroke-width": c ? 3 : 1, "stroke-dasharray": c ? "" : "3 3"});
      el("text", {x: x + C / 2, y: y + 19, "text-anchor": "middle", "font-size": 12, fill: c ? css("--fg") : css("--muted")}, "w = " + WW[i][j]);
      if (c) { el("circle", {cx: x + 22, cy: y + 48, r: 14, fill: css("--cell"), stroke: css("--line")});
        el("text", {x: x + 22, y: y + 53, "text-anchor": "middle", "font-size": 14}, String(c.x));
        el("rect", {x: x + 40, y: y + 35, width: 32, height: 26, fill: css("--cell"), stroke: css("--line"), "stroke-width": 2});
        el("text", {x: x + 56, y: y + 53, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, String(c.pout));
        el("text", {x: x + C - 6, y: y + 19, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, SUPS[c.v]); } } }
  for (let j = 0; j < 3; j++) { const x = X0 + j * C + C / 2;
    el("text", {x: x, y: Y0 + 3 * C + 14, "text-anchor": "middle", "font-size": 14}, "↓");
    s.out[j].forEach((o, r) => el("text", {x: x, y: Y0 + 3 * C + 34 + r * 20, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, String(o[1]))); }
  el("text", {x: X0 + 3 * C + 8, y: Y0 + 3 * C + 34, "font-size": 12, fill: css("--muted")}, "y⁽⁰⁾");
  el("text", {x: X0 + 3 * C + 8, y: Y0 + 3 * C + 54, "font-size": 12, fill: css("--muted")}, "y⁽¹⁾");
  el("text", {x: 6, y: 318, "font-size": 11, fill: css("--muted")}, "kör: áthaladó x · négyzet: lefelé kilépő parciális összeg · szürke cella: aktív");
  let tb = "<tr><th>cella</th>" + [0, 1, 2].map(j => `<th>j = ${j}</th>`).join("") + "</tr>";
  for (let i = 0; i < 3; i++) tb += `<tr><th>i = ${i}</th>` + [0, 1, 2].map(j => { const c = s.cells[i][j]; return c ? `<td>x = ${c.x}, psum ${c.pin} → ${c.pout}</td>` : "<td>–</td>"; }).join("") + "</tr>";
  document.getElementById("tab").innerHTML = tb;
}
let WW = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
function parseList(str, n){ const a = str.split(/[\s,;]+/).filter(x => x !== "").map(Number); return a.length === n && a.every(Number.isInteger) ? a : null; }
document.getElementById("go").addEventListener("click", () => {
  const w = parseList(document.getElementById("inW").value, 9), a = parseList(document.getElementById("inX0").value, 3), b = parseList(document.getElementById("inX1").value, 3);
  if (!w || !a || !b) { status.textContent = "Hibás bemenet: W-hez 9, x-ekhez 3–3 egész szám kell (vesszővel vagy szóközzel elválasztva)."; return; }
  WW = [w.slice(0, 3), w.slice(3, 6), w.slice(6, 9)];
  setSteps(simulate(WW, [a, b]));
});


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
