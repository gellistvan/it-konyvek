<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aszinkron hibajelentés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Eset: <select id="cs" onchange="pick()" aria-label="Eset"><option value="ok">érvényes kernel</option><option value="illegal" selected>illegális cím</option><option value="config">2048 szálas blokk</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Host- és GPU-sáv lépésenként; illegális címnél a cudaGetLastError még cudaSuccess, a hibát a cudaDeviceSynchronize adja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a 6.4.3 badKernel<<<2, 1024>>>(nullptr) példája. Sematikus, nem mért időzítés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": 0, "ret": null, "last": "cudaSuccess", "gpu": "sorban áll", "msg": "Indítás: a hívás azonnal visszatér, a kernel a streambe kerül", "i": 0}, {"line": 1, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "sorban áll", "msg": "cudaGetLastError() → cudaSuccess (a futási hiba még nem látszik)", "i": 1}, {"line": 2, "ret": null, "last": "cudaSuccess", "gpu": "hiba", "msg": "A kernel fut, és illegális címre ír: a hardver megjelöli a hibát (a host még nem tud róla)", "i": 2}, {"line": 3, "ret": "cudaErrorIllegalAddress", "last": "cudaErrorIllegalAddress", "gpu": "hiba", "msg": "cudaDeviceSynchronize() → cudaErrorIllegalAddress – sticky hiba: a kontextus használhatatlan", "i": 3}, {"line": 4, "ret": "cudaErrorIllegalAddress", "last": "cudaErrorIllegalAddress", "gpu": "hiba", "msg": "További API-hívás → cudaErrorIllegalAddress (sticky: minden további hívás ezt adja)", "i": 4}];
const CODE = ["badKernel<<<grid, block>>>(d_bad);          // 1. indítás (aszinkron)", "cudaError_t launchErr = cudaGetLastError();  // 2. indítási hiba?", "/* ... a GPU a háttérben futtatja (vagy nem) a kernelt ... */  // 3.", "cudaError_t runErr = cudaDeviceSynchronize(); // 4. futási hiba?", "cudaMemcpy(h, d, bytes, cudaMemcpyDeviceToHost); // 5. további API-hívás"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SIM = {"ok": [{"line": 0, "ret": null, "last": "cudaSuccess", "gpu": "sorban áll", "msg": "Indítás: a hívás azonnal visszatér, a kernel a streambe kerül", "i": 0}, {"line": 1, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "sorban áll", "msg": "cudaGetLastError() → cudaSuccess", "i": 1}, {"line": 2, "ret": null, "last": "cudaSuccess", "gpu": "kész", "msg": "A kernel hibátlanul lefut", "i": 2}, {"line": 3, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "kész", "msg": "cudaDeviceSynchronize() → cudaSuccess", "i": 3}, {"line": 4, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "kész", "msg": "További API-hívás → cudaSuccess", "i": 4}], "illegal": [{"line": 0, "ret": null, "last": "cudaSuccess", "gpu": "sorban áll", "msg": "Indítás: a hívás azonnal visszatér, a kernel a streambe kerül", "i": 0}, {"line": 1, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "sorban áll", "msg": "cudaGetLastError() → cudaSuccess (a futási hiba még nem látszik)", "i": 1}, {"line": 2, "ret": null, "last": "cudaSuccess", "gpu": "hiba", "msg": "A kernel fut, és illegális címre ír: a hardver megjelöli a hibát (a host még nem tud róla)", "i": 2}, {"line": 3, "ret": "cudaErrorIllegalAddress", "last": "cudaErrorIllegalAddress", "gpu": "hiba", "msg": "cudaDeviceSynchronize() → cudaErrorIllegalAddress – sticky hiba: a kontextus használhatatlan", "i": 3}, {"line": 4, "ret": "cudaErrorIllegalAddress", "last": "cudaErrorIllegalAddress", "gpu": "hiba", "msg": "További API-hívás → cudaErrorIllegalAddress (sticky: minden további hívás ezt adja)", "i": 4}], "config": [{"line": 0, "ret": null, "last": "cudaErrorInvalidConfiguration", "gpu": "nem indul", "msg": "Indítás: a konfiguráció érvénytelen (2048 > 1024 szál/blokk) – a hibát a futtatókörnyezet azonnal rögzíti", "i": 0}, {"line": 1, "ret": "cudaErrorInvalidConfiguration", "last": "cudaSuccess", "gpu": "nem indul", "msg": "cudaGetLastError() → cudaErrorInvalidConfiguration", "i": 1}, {"line": 2, "ret": null, "last": "cudaSuccess", "gpu": "nem fut", "msg": "A GPU-sáv üres: a kernel nem indult el", "i": 2}, {"line": 3, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "nem fut", "msg": "cudaDeviceSynchronize() → cudaSuccess", "i": 3}, {"line": 4, "ret": "cudaSuccess", "last": "cudaSuccess", "gpu": "nem fut", "msg": "További API-hívás → cudaSuccess", "i": 4}]}, NAMES = {"ok": "érvényes kernel (<<<2, 1024>>>, érvényes mutató)", "illegal": "illegális cím (<<<2, 1024>>>, nullptr)", "config": "2048 szálas blokk (<<<1, 2048>>>)"};
let CASE = "illegal";
function render(s){
  svg.setAttribute("viewBox", "0 0 700 300"); svg.innerHTML = "";
  const seq = SIM[CASE], kk = s.i;
  el("text", {x: 10, y: 22, "font-size": 13, "font-weight": "bold"}, NAMES[CASE]);
  el("text", {x: 10, y: 75, "font-size": 13}, "Host szál");
  el("text", {x: 10, y: 175, "font-size": 13}, "GPU stream");
  const boxes = [["<<<…>>>", 110, 70], ["cudaGetLastError()", 190, 130], [null, 0, 0], ["cudaDeviceSynchronize()", 330, 160], ["további hívás", 510, 170]];
  for (let i = 0; i <= kk; i++) {
    const st = seq[i], b = boxes[i];
    if (b[0]) {
      el("rect", {x: b[1], y: 55, width: b[2], height: 30, fill: i === kk ? css("--cellhl") : css("--cell"), stroke: css("--line")});
      el("text", {x: b[1] + b[2] / 2, y: 75, "text-anchor": "middle", "font-size": 11}, b[0]);
      if (st.ret) { const bad = st.ret !== "cudaSuccess";
        el("rect", {x: b[1] - 4, y: 95, width: b[2] + 8, height: 24, fill: css("--bg"), stroke: css("--line"), "stroke-width": bad ? 3 : 1});
        el("text", {x: b[1] + b[2] / 2, y: 112, "text-anchor": "middle", "font-size": 10, "font-weight": bad ? "bold" : "normal"}, st.ret); }
    }
    if (i === 2) {
      if (st.gpu === "nem fut") el("text", {x: 190, y: 175, "font-size": 12, "font-style": "italic", fill: css("--muted")}, "üres – a kernel nem indul");
      else { el("rect", {x: 200, y: 158, width: 280, height: 26, fill: css("--cellhl"), stroke: css("--line")});
        el("text", {x: 215, y: 176, "font-size": 12}, "badKernel" + (st.gpu === "hiba" ? "  ↯ illegális cím" : "  ✓ kész")); }
    }
    if (i === 3 && st.gpu !== "nem fut") el("line", {x1: 335, x2: 485, y1: 90, y2: 90, stroke: css("--line"), "stroke-dasharray": "2 3", "stroke-width": 2});
  }
  el("text", {x: 10, y: 235, "font-size": 13}, "a szál utolsó hibája: ");
  el("text", {x: 170, y: 235, "font-size": 13, "font-weight": "bold", fill: s.last === "cudaSuccess" ? css("--fg") : css("--hl2")}, s.last);
  el("text", {x: 10, y: 285, "font-size": 11, fill: css("--muted")}, "sematikus, nem mért időzítés; hibakódok a CUDA Runtime API dokumentációja szerint");
}
function pick(){ CASE = document.getElementById("cs").value; setSteps(SIM[CASE]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
