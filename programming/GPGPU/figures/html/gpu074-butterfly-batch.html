<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pillangóháló és cufftPlanMany</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>saját bemenet (8 elem): <input id="inp" size="22" value="1, 2, 3, 4, 0, 0, 0, 0" aria-label="Saját bemenet"></label> <button onclick="loadx()">Betöltés</button> <span id="err" class="small" aria-live="polite"></span></div><div class="ctl"><label>n <input id="pn" type="range" min="1" max="16" value="8" oninput="show(k)" style="width:70px"> <span id="pnv">8</span></label> <label>istride <input id="pst" type="range" min="1" max="4" value="1" oninput="show(k)" style="width:60px"> <span id="pstv">1</span></label> <label>idist <input id="pdi" type="range" min="1" max="32" value="16" oninput="show(k)" style="width:90px"> <span id="pdiv">16</span></label> <label>batch <input id="pbt" type="range" min="1" max="8" value="4" oninput="show(k)" style="width:70px"> <span id="pbtv">4</span></label> <button onclick="document.getElementById('pdi').value=8;show(k)">hibás: idist = 8</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a radix-2 pillangóháló szintenként a köztes értékekkel, alul a cufftPlanMany memóriaelrendezése: sorok, a batch-ek által kiolvasott cellák kiemelésével."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Tankönyvi iteratív radix-2 DIT FFT; a cuFFT belső algoritmusa ettől eltérhet. A memóriarács fizikai elrendezése rögzített (soronként 16 elem, ebből 8 adat); a csúszkák a terv paramétereit állítják. Kezdőállapot: x = (1, 2, 3, 4, 0, 0, 0, 0), batch = 4, n = 8, idist = 16.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": 0, "line": 0, "msg": "Bitfordított bemenet: a[i] = x[bitrev(i)] = (1, 0, 3, 0, 2, 0, 4, 0)"}, {"st": 1, "line": 3, "msg": "1. szint: 4 független pillangó, w = W_8^0 → (1, 1, 3, 3, 2, 2, 4, 4)"}, {"st": 2, "line": 3, "msg": "2. szint: 4 független pillangó, w = W_8^0, W_8^2 → (4, 1−3i, −2, 1+3i, 6, 2−4i, −2, 2+4i)"}, {"st": 3, "line": 3, "msg": "3. szint: 4 független pillangó, w = W_8^0, W_8^1, W_8^2, W_8^3 → (10, −0,41−7,24i, −2+2i, 2,41−1,24i, −2, 2,41+1,24i, −2−2i, −0,41+7,24i)"}];
const CODE = ["a = bitreverse(x)                         // 0. lépés: bitfordított sorrend", "for (s = 1; s < N; s *= 2)                // szintek: s = 1, 2, 4", "  for (k = 0; k < N; k += 2*s)            // független pillangók", "    for (j = 0; j < s; ++j) { w = W_N^(j*N/(2s)); t = w*a[k+j+s]; u = a[k+j];", "                              a[k+j] = u + t; a[k+j+s] = u - t; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let XIN = [1, 2, 3, 4, 0, 0, 0, 0];
const BRV = [0, 4, 2, 6, 1, 5, 3, 7];
function cf(re, im){
  const f = v => { const r = Math.round(v * 100) / 100; return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0+$/, "")).replace(".", ","); };
  if (Math.abs(im) < 5e-3) return f(re).replace("-", "−");
  if (Math.abs(re) < 5e-3) return (f(im) + "i").replace("-", "−");
  return (f(re) + (im > 0 ? "+" : "") + f(im) + "i").replace(/-/g, "−");
}
function stages(x){
  let re = BRV.map(i => x[i]), im = re.map(() => 0); const out = [{re: re.slice(), im: im.slice(), fl: []}];
  for (let s = 1; s < 8; s *= 2) { const m = 2*s, fl = [];
    for (let kk = 0; kk < 8; kk += m) for (let j = 0; j < s; j++) { const e = j * (8 / m), wr = Math.cos(2*Math.PI*e/8), wi = -Math.sin(2*Math.PI*e/8);
      const a = kk + j, b = kk + j + s, tr = wr*re[b] - wi*im[b], ti = wr*im[b] + wi*re[b];
      const ur = re[a], ui = im[a]; re[a] = ur + tr; im[a] = ui + ti; re[b] = ur - tr; im[b] = ui - ti; fl.push([a, b, e]); }
    out.push({re: re.slice(), im: im.slice(), fl}); }
  return out;
}
function mkSteps(x){
  const S = stages(x);
  return S.map((q, c) => ({st: c, line: c === 0 ? 0 : 3, msg: (c === 0 ? "Bitfordított bemenet: a[i] = x[bitrev(i)] = " : `${c}. szint: 4 független pillangó, w = ` + [...new Set(q.fl.map(f => "W_8^" + f[2]))].sort().join(", ") + " → ") + "(" + q.re.map((r, i) => cf(r, q.im[i])).join(", ") + ")"}));
}
function gv(id){ return +document.getElementById(id).value; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 560");
  const d = document.createElementNS(NS, "defs");
  d.innerHTML = `<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.2"/></pattern>`;
  svg.appendChild(d);
  const S = stages(XIN), cx = [20, 200, 380, 560], bw = [110, 110, 120, 180], yy = i => 40 + i * 30;
  const heads = ["bitfordított bemenet", "1. szint", "2. szint", "3. szint = X_k"];
  for (let c = 0; c <= s.st; c++) {
    el("text", {x: cx[c] + bw[c]/2, y: 22, "text-anchor": "middle", "font-size": 12, "font-weight": c === s.st ? "bold" : "normal"}, heads[c]);
    for (let i = 0; i < 8; i++) {
      el("rect", {x: cx[c], y: yy(i) - 11, width: bw[c], height: 22, fill: c === s.st ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 1});
      const lab = (c === 0 ? `x${BRV[i]} = ` : c === 3 ? `X${i} = ` : "") + cf(S[c].re[i], S[c].im[i]);
      el("text", {x: cx[c] + bw[c]/2, y: yy(i) + 4, "text-anchor": "middle", "font-size": 12}, lab);
    }
    if (c > 0) S[c].fl.forEach(([a, b, e]) => { const x0 = cx[c-1] + bw[c-1], x1 = cx[c], on = c === s.st;
      [[a, a], [a, b], [b, a], [b, b]].forEach(([p, q]) => el("line", {x1: x0, y1: yy(p), x2: x1, y2: yy(q), stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 1.6 : 0.8}));
      el("text", {x: x0 + 6, y: yy(b) + 16, "font-size": 10, fill: on ? css("--hl2") : css("--muted")}, "W" + e); });
  }
  // (b) cufftPlanMany
  const n = gv("pn"), st = gv("pst"), di = gv("pdi"), bt = gv("pbt");
  ["pn", "pst", "pdi", "pbt"].forEach(id => document.getElementById(id + "v").textContent = gv(id));
  const Y = 300, cw = 40, rh = 26, size = bt * 16;
  el("text", {x: 20, y: Y - 12, "font-size": 13, "font-weight": "bold"}, `cufftPlanMany: input[b·${di} + x·${st}], fizikai puffer ${bt} sor × 16 (adat: soronként az első 8 elem)`);
  const own = {}; let oob = 0;
  for (let b = 0; b < bt; b++) for (let x = 0; x < n; x++) { const q = b*di + x*st; if (q >= size) oob++; (own[q] = own[q] || []).push(b); }
  const shown = Math.min(bt, 8);
  for (let r = 0; r < shown; r++) { el("text", {x: 70, y: Y + r*rh + 17, "text-anchor": "end", "font-size": 11}, r + ". sor");
    for (let c = 0; c < 16; c++) { const q = r*16 + c, o = own[q] || [];
      el("rect", {x: 80 + c*cw, y: Y + r*rh, width: cw - 2, height: rh - 3, fill: c < 8 ? "url(#hd)" : css("--cell"), stroke: o.length > 1 ? css("--hl2") : (o.length ? css("--fg") : css("--muted")), "stroke-width": o.length ? 2.4 : 0.6});
      if (o.length) { el("rect", {x: 80 + c*cw + 6, y: Y + r*rh + 4, width: cw - 14, height: rh - 11, fill: css("--bg")});
        el("text", {x: 80 + c*cw + cw/2 - 1, y: Y + r*rh + 16, "text-anchor": "middle", "font-size": 10, fill: o.length > 1 ? css("--hl2") : css("--fg")}, "b" + o.join(",")); } } }
  const ov = Object.values(own).filter(o => o.length > 1).length;
  let stray = 0; for (const q in own) { const c = q % 16; if (q < size && c >= 8) stray += own[q].length; }
  const ok = !ov && !oob && !stray && n === 8;
  const msg = ok ? "helyes elrendezés: minden batch a saját sorának adatát olvassa" :
    [ov ? `${ov} cellát több batch is olvas (átfedés)` : "", oob ? `${oob} olvasás a pufferen kívülre esik (túlindexelés)` : "", stray ? `${stray} olvasás nem-adat (padding) cellára esik` : "", n !== 8 ? `n = ${n}: nem a sor 8 adatelemét transzformálja` : ""].filter(x => x).join("; ");
  el("text", {x: 20, y: Y + shown*rh + 24, "font-size": 13, fill: ok ? css("--hl") : css("--hl2")}, (ok ? "" : "figyelmeztetés: ") + msg);
}
function loadx(){
  const t = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), e = document.getElementById("err");
  if (t.length !== 8 || t.some(x => !Number.isFinite(x))) { e.textContent = "Pontosan 8 valós számot adjon meg."; return; }
  e.textContent = ""; XIN = t; setSteps(mkSteps(XIN));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
