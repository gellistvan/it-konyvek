<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 18 × 18-as csempe betöltése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>blokk: <select id="blk"><option value="inner">belső blokk (3, 3), 256 × 256</option><option value="corner">bal-alsó sarok (0, 0), 256 × 256</option><option value="right">jobb szél (15, 5), nx = 250, ny = 203</option></select></label><label><input id="bug" type="checkbox"> hibás betöltés (a belső-pont feltételhez kötve)</label><span id="info" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 18 × 18-as shared memory csempe cellái: saját elemek, halo-csíkok és a kiválasztott szál betöltött és olvasott cellái"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A rajzon a sor (ty) felfelé nő. A számítás a fejezet heat_step_tiled kernelének feltételeit követi (TILE = 16). A „hibás betöltés” a betöltést is a belső-pont feltételhez köti: a sarokblokkban ilyenkor inicializálatlan olvasás keletkezik (? jel).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "ph": 0, "msg": "Kattints egy szálra (a belső 16 × 16 cellák egyikére): kiemelődik, mit tölt be (vastag keret) és mit olvas (kereszt). Válassz blokkot és lépj végig a fázisokon."}, {"line": 0, "ph": 1, "msg": "1) Minden rácson belüli szál betölti a saját elemét: tile[ty + 1][tx + 1]."}, {"line": 1, "ph": 2, "msg": "2) A szélső szálak a halót is töltik: tx == 0 a bal, tx == 15 a jobb, ty == 0 az alsó, ty == 15 a felső csíkot – ha a szomszéd a rácson belül van. A sarkokat senki nem tölti."}, {"line": 2, "ph": 3, "msg": "3) __syncthreads(): ezután minden betöltött cella látható a blokk minden szálának."}, {"line": 3, "ph": 4, "msg": "4) Számítás csak a belső pontokra; a perempontok szálai betöltöttek, de nem számolnak."}];
const CODE = ["if (in_grid) tile[ty+1][tx+1] = u_old[j*nx + i];            // 1) saját elem", "if (tx == 0 && i > 0 ...) tile[ty+1][0] = ...;  // 2) bal halo; jobb: tx == 15, alsó: ty == 0, felső: ty == 15", "__syncthreads();                                         // 3) a csempe kész", "if (1 <= i < nx-1 && 1 <= j < ny-1) u_new[...] = f(5 pontos kereszt a tile-ból);   // 4) számítás"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BLOCKS = {"inner": {"bx": 3, "by": 3, "nx": 256, "ny": 256, "name": "belső blokk (3, 3), 256 × 256"}, "corner": {"bx": 0, "by": 0, "nx": 256, "ny": 256, "name": "bal-alsó sarok (0, 0), 256 × 256"}, "right": {"bx": 15, "by": 5, "nx": 250, "ny": 203, "name": "jobb szél (15, 5), nx = 250, ny = 203"}};
let SEL = {tx: 0, ty: 5};
function kern(b, buggy){
  const loads = {}, comp = {}, T = 16;
  for (let ty = 0; ty < T; ty++) for (let tx = 0; tx < T; tx++){
    const i = b.bx * T + tx, j = b.by * T + ty, inter = i >= 1 && i < b.nx - 1 && j >= 1 && j < b.ny - 1, g = buggy ? inter : true;
    const L = [];
    if (g && i < b.nx && j < b.ny) { loads[(ty+1)+","+(tx+1)] = {tx: tx, ty: ty, kind: "own"}; L.push([ty+1, tx+1]); }
    if (g && tx === 0 && i > 0 && j < b.ny) { loads[(ty+1)+",0"] = {tx: tx, ty: ty, kind: "L"}; L.push([ty+1, 0]); }
    if (g && tx === T-1 && i+1 < b.nx && j < b.ny) { loads[(ty+1)+","+(T+1)] = {tx: tx, ty: ty, kind: "R"}; L.push([ty+1, T+1]); }
    if (g && ty === 0 && j > 0 && i < b.nx) { loads["0,"+(tx+1)] = {tx: tx, ty: ty, kind: "B"}; L.push([0, tx+1]); }
    if (g && ty === T-1 && j+1 < b.ny && i < b.nx) { loads[(T+1)+","+(tx+1)] = {tx: tx, ty: ty, kind: "U"}; L.push([T+1, tx+1]); }
    comp[tx+","+ty] = {inter: inter, loads: L, i: i, j: j};
  }
  return {loads: loads, comp: comp};
}
const CS = 15, OX = 40, OY = 10;
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = "";
  const b = BLOCKS[document.getElementById("blk").value], bug = document.getElementById("bug").checked, K = kern(b, bug), ph = s.ph;
  const defs = el("defs", {}); const fg = css("--line");
  defs.innerHTML = `<pattern id="pL" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="2" y1="0" x2="2" y2="4" stroke="${fg}" stroke-width="1"/></pattern>`+
    `<pattern id="pR" width="4" height="4" patternUnits="userSpaceOnUse"><line x1="0" y1="2" x2="4" y2="2" stroke="${fg}" stroke-width="1"/></pattern>`+
    `<pattern id="pB" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.9" fill="${fg}"/></pattern>`+
    `<pattern id="pU" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${fg}" stroke-width="1"/></pattern>`;
  const X = c => OX + c * CS, Y = r => OY + (17 - r) * CS;
  const sel = K.comp[SEL.tx + "," + SEL.ty];
  const selLoads = new Set(sel.loads.map(q => q.join(",")));
  const reads = sel.inter ? [[SEL.ty+1, SEL.tx+1], [SEL.ty+1, SEL.tx], [SEL.ty+1, SEL.tx+2], [SEL.ty, SEL.tx+1], [SEL.ty+2, SEL.tx+1]] : [];
  for (let r = 0; r < 18; r++) for (let c = 0; c < 18; c++){
    const key = r + "," + c, L = K.loads[key], corner = (r === 0 || r === 17) && (c === 0 || c === 17);
    let fill = css("--cell");
    const shown = L && ((L.kind === "own" && ph >= 1) || (L.kind !== "own" && ph >= 2));
    if (shown) fill = L.kind === "own" ? (K.comp[(c-1)+","+(r-1)].inter ? css("--cellhl") : css("--muted")) : `url(#p${L.kind})`;
    el("rect", {x: X(c), y: Y(r), width: CS, height: CS, fill: fill, stroke: css("--line"), "stroke-width": 0.4, "data-c": c, "data-r": r});
    if (corner) { el("line", {x1: X(c)+2, y1: Y(r)+2, x2: X(c)+CS-2, y2: Y(r)+CS-2, stroke: css("--line")}); el("line", {x1: X(c)+CS-2, y1: Y(r)+2, x2: X(c)+2, y2: Y(r)+CS-2, stroke: css("--line")}); }
    if (ph >= 4 && reads.some(q => q[0] === r && q[1] === c) && !L) el("text", {x: X(c)+CS/2, y: Y(r)+CS-3, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "?");
  }
  sel.loads.forEach(([r, c]) => { if ((ph >= 1 && r === SEL.ty+1 && c === SEL.tx+1) || ph >= 2) el("rect", {x: X(c)+1, y: Y(r)+1, width: CS-2, height: CS-2, fill: "none", stroke: css("--hl2"), "stroke-width": 2.6}); });
  if (ph >= 4 && sel.inter) {
    const cx = X(SEL.tx+1) + CS/2, cy = Y(SEL.ty+1) + CS/2;
    el("line", {x1: cx - 1.5*CS, x2: cx + 1.5*CS, y1: cy, y2: cy, stroke: css("--hl"), "stroke-width": 2.5});
    el("line", {x1: cx, x2: cx, y1: cy - 1.5*CS, y2: cy + 1.5*CS, stroke: css("--hl"), "stroke-width": 2.5});
  }
  if (ph === 3) el("text", {x: OX + 9*CS, y: OY + 9*CS + 5, "text-anchor": "middle", "font-size": 16, "font-weight": "bold"}, "__syncthreads()");
  const tx0 = OX + 18*CS + 20;
  el("text", {x: tx0, y: 24, "font-size": 13, "font-weight": "bold"}, b.name);
  el("text", {x: tx0, y: 44, "font-size": 12}, `kiválasztott szál: tx = ${SEL.tx}, ty = ${SEL.ty} (i = ${sel.i}, j = ${sel.j})`);
  el("text", {x: tx0, y: 62, "font-size": 12}, sel.inter ? "belső pont: számol" : (sel.i < b.nx && sel.j < b.ny ? "peremszál vagy hibás ág: nem számol" : "rácson kívül: nem tölt, nem számol"));
  el("text", {x: tx0, y: 80, "font-size": 12}, `betölt: ${sel.loads.length} cella (narancs keret)`);
  [["pL","bal halo: tx == 0"],["pR","jobb halo: tx == 15"],["pB","alsó halo: ty == 0"],["pU","felső halo: ty == 15"]].forEach(([p, t], q) => {
    el("rect", {x: tx0, y: 110 + q*22, width: 16, height: 16, fill: `url(#${p})`, stroke: css("--line")}); el("text", {x: tx0 + 24, y: 123 + q*22, "font-size": 12}, t); });
  el("rect", {x: tx0, y: 198, width: 16, height: 16, fill: css("--cellhl"), stroke: css("--line")}); el("text", {x: tx0 + 24, y: 211, "font-size": 12}, "saját elem, számol");
  el("rect", {x: tx0, y: 220, width: 16, height: 16, fill: css("--muted"), stroke: css("--line")}); el("text", {x: tx0 + 24, y: 233, "font-size": 12}, "saját elem, nem számol (perem)");
  el("text", {x: tx0, y: 258, "font-size": 12}, "fehér: nincs betöltve; ? : inicializálatlan olvasás");
  el("text", {x: tx0, y: 276, "font-size": 12}, "sarok (×): az 5 pontos stencilhez nem kell");
  let bad = 0; Object.values(K.comp).forEach(q => { if (!q.inter) return; const tx = q.i - b.bx*16, ty = q.j - b.by*16;
    [[ty+1, tx+1], [ty+1, tx], [ty+1, tx+2], [ty, tx+1], [ty+2, tx+1]].forEach(([r, c]) => { if (!K.loads[r+","+c]) bad++; }); });
  document.getElementById("info").textContent = bad ? `Inicializálatlan olvasás: ${bad} esetben (a blokkon belül).` : "Minden számoló szál csak betöltött cellát olvas.";
}
svg.addEventListener("click", e => {
  const t = e.target; if (!t.dataset || t.dataset.c === undefined) return;
  const c = +t.dataset.c, r = +t.dataset.r; if (c < 1 || c > 16 || r < 1 || r > 16) return;
  SEL = {tx: c - 1, ty: r - 1}; show(k);
});
document.getElementById("blk").addEventListener("change", () => show(k));
document.getElementById("bug").addEventListener("change", () => show(k));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
