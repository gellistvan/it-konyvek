<title>Bankleképezés 32-es, 33-as és 34-es sorhossznál</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}

svg{width:100%;height:auto;display:block}

pre#code span{display:block;padding:0 4px}

svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

function render(s){

  svg.innerHTML = "";

function render(s){

    for (let c = 0; c < cols; c += (cols > 32 ? 4 : 4)) el("text", {x: x0 + c * cw + cw / 2, y: y0 - 6, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(c)); }
  else el("text", {x: x0, y: y0 - 8, "font-size": 11, fill: css("--muted")}, "s_data szavai soronként 32-esével (cellában a bank); kiemelve a tid által olvasott 4·tid");
  el("text", {x: x0, y: 18, "font-size": 14, "font-weight": "bold"}, `${s.nb} különböző bank · ${s.ways}-utas` + (s.ways === 1 ? " (konfliktusmentes)" : "") + ` · menet ${s.k + 1}/${s.ways}`);
  el("text", {x: x0, y: H - 30, "font-size": 11, fill: css("--muted")}, "narancs = ebben a menetben kiszolgált szavak; szürke = korábbi menetek; a cellában a bank = szóindex % 32");
  el("text", {x: x0, y: H - 12, "font-size": 11, fill: css("--muted")}, self ? "s_data[4 * tid]: 0, 4, …, 28 – bankonként 4 különböző szó" : (P.mode === "col" ? `tile[x][${P.y}]: lane x a (${L}·x + ${P.y}) szót olvassa` : `tile[${P.y}][x]: lane x a (${L}·${P.y} + x) szót olvassa`));
}
function analyseJS(words){
  const per = {}; words.forEach(w => { const b = w % 32; (per[b] = per[b] || new Set()).add(w); });
  let ways = 0; const order = {};
  Object.values(per).forEach(set => { const a = [...set].sort((p, q) => p - q); ways = Math.max(ways, a.length); a.forEach((w, k) => order[w] = k); });
  const passes = []; for (let k = 0; k < ways; k++) passes.push(words.map((w, l) => [w, l]).filter(p => order[p[0]] === k).map(p => p[1]));
  return {ways, nb: Object.keys(per).length, passes};
}
function par(){ return {L: +document.getElementById("L").value, y: +document.getElementById("wy").value, mode: document.getElementById("md").value}; }
function cfg(){
  const P = par(); document.getElementById("Lv").textContent = P.L; document.getElementById("wyv").textContent = P.y;
  let words = [], head = "";
  if (P.mode === "q") { for (let t = 0; t < 32; t++) words.push(4 * t); head = "11.2.11: s_data[4 * tid]"; }
  else if (P.mode === "col") { for (let x = 0; x < 32; x++) words.push(P.L * x + P.y); head = `L = ${P.L}, oszlopmenti olvasás, y = ${P.y}`; }
  else { for (let x = 0; x < 32; x++) words.push(P.L * P.y + x); head = `L = ${P.L}, soros olvasás, y = ${P.y}`; }
  const r = analyseJS(words);
  setSteps(r.passes.map((lanes, k) => ({words, served: lanes, k, ways: r.ways, nb: r.nb, line: -1,
    msg: `${head}: ${r.nb} különböző bank, ${r.ways}-utas` + (r.ways === 1 ? " (konfliktusmentes)" : "") + ` – ${k + 1}. kiszolgálási menet / ${r.ways}: ${lanes.length} lane`})));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
