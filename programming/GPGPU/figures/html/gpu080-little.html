<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little-törvény – a memóriacső</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--empty:#bbb;--box:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--empty:#555;--box:#333}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:150px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>késleltetés T <input id="T" type="range" min="200" max="1000" step="10"><b id="Tv"></b> ns</label>
  <label>B<sub>eff</sub> <input id="B" type="range" min="100" max="3000" step="1"><b id="Bv"></b> GB/s</label>
  <label>warp-betöltés/SM <input id="wl" type="range" min="1" max="64" step="1"><b id="wlv"></b></label>
  <button id="play">▶ Áramlás (10 s)</button>
  <button id="reset">Alapérték (500 ns, 1244 GB/s, 45)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 210" role="img" aria-label="Memóriacső: balra egy SM, jobbra a DRAM; a csőben a folyamatban levő szektorkérések"></svg>
<p class="small">Egy SM csöve (a 108-ból): oszlop = 1 warp-betöltés = 4 szektor (32 B, coalesced 32 bites betöltés).
Szükséges: N = λ·T, λ = B<sub>eff</sub>/32 B; elérhető: warp-betöltés/SM · 4 · 108;
becsült sávszélesség = min(1, elérhető/szükséges)·B<sub>eff</sub>. Illusztratív késleltetés, elméleti modell, nem mérés.</p>
<script>
const D = {"T": 500, "B": 1244, "wl": 45, "sm": 108, "sect": 32, "spw": 4};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(t, a, s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!==undefined)e.textContent=s;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function hu(x, d){return x.toLocaleString("hu-HU",{minimumFractionDigits:d,maximumFractionDigits:d});}
const $ = id => document.getElementById(id);
let phase = 0, timer = null, t0 = 0;
function draw(){
  const T=+$("T").value, B=+$("B").value, wl=+$("wl").value;
  $("Tv").textContent=T; $("Bv").textContent=hu(B,0); $("wlv").textContent=wl;
  const lam = B*1e9/D.sect, N = lam*T*1e-9, perSM = N/D.sm, needWL = perSM/D.spw;
  const avail = wl*D.spw*D.sm, frac = Math.min(1, avail/N), bw = frac*B;
  svg.innerHTML = "";
  const cols = Math.max(1, Math.ceil(needWL)), X0 = 70, X1 = 570, W = (X1-X0)/cols;
  el("rect",{x:8,y:40,width:56,height:110,fill:css("--box"),stroke:css("--line")});
  el("text",{x:36,y:100,"text-anchor":"middle","font-size":13},"SM");
  el("rect",{x:576,y:40,width:56,height:110,fill:css("--box"),stroke:css("--line")});
  el("text",{x:604,y:100,"text-anchor":"middle","font-size":13},"DRAM");
  el("rect",{x:X0,y:40,width:X1-X0,height:110,fill:"none",stroke:css("--line"),"stroke-width":2.5});
  const shown = Math.min(cols, wl);
  for (let j = 0; j < cols; j++){
    const on = j < shown;
    // áramlás: a teli oszlopok a fázissal körbeforognak a csőben
    const jj = on ? (j + phase) % cols : j;
    for (let r = 0; r < 4; r++){
      el("rect",{x:X0+jj*W+W*0.12,y:46+r*26,width:Math.max(1,W*0.76),height:20,
        fill:on?css("--hl"):"none",stroke:on?css("--line"):css("--empty"),"stroke-width":on?0.6:0.8,
        "stroke-dasharray":on?"":"2 2"});
    }
  }
  el("line",{x1:X0,y1:168,x2:X1,y2:168,stroke:css("--line")});
  el("text",{x:(X0+X1)/2,y:186,"text-anchor":"middle","font-size":13},`cső hossza: T = ${T} ns; szükséges oszlop/SM: ${hu(needWL,1)}`);
  el("text",{x:X0,y:30,"font-size":13},`folyamatban: ${hu(Math.floor(Math.min(avail,N)),0)} / szükséges ${hu(Math.floor(N),0)} szektor – a cső ${hu(frac*100,0)} %-ig telt`);
  $("status").textContent = `szükséges: N = λ·T = ${hu(lam/1e9,1)}·10⁹/s · ${T} ns ≈ ${hu(Math.floor(N),0)} szektor = ${hu(perSM,1)}/SM = ${hu(needWL,1)} warp-betöltés/SM; `
    + `elérhető: ${wl}·4·${D.sm} = ${hu(avail,0)} szektor; becsült sávszélesség = min(1; ${hu(avail/N,2)})·${hu(B,0)} ≈ ${hu(bw,0)} GB/s.`;
}
function stop(){ if (timer){ clearInterval(timer); timer = null; } $("play").textContent = "▶ Áramlás (10 s)"; phase = 0; draw(); }
$("play").onclick = () => {
  if (timer){ stop(); return; }
  t0 = Date.now(); $("play").textContent = "⏸ Megállítás";
  timer = setInterval(() => { phase++; draw(); if (Date.now() - t0 > 10000) stop(); }, 250);
};
for (const k of ["T","B","wl"]) $(k).addEventListener("input", draw);
$("reset").onclick = () => { $("T").value = D.T; $("B").value = D.B; $("wl").value = D.wl; stop(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
$("T").value = D.T; $("B").value = D.B; $("wl").value = D.wl; draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
