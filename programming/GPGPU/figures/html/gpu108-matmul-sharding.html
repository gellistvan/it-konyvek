<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shardolt mátrixszorzás 2 × 4-es mesh-en</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--cell:#fff;--sel:#ffd9b0;--line:#000;--bad:#c00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--cell:#262626;--sel:#6a4a2a;--line:#ddd;--bad:#ff7070}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
g.dev{cursor:pointer}#status{min-height:4.4em;margin:4px 0}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl"><label><input type="checkbox" id="bad"> hibás változat: A P('x', 'y') × B P('y', None) (a kontrakciós dimenzió is shardolt)</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 385" role="img" aria-label="Mesh 2×4 eszközzel, A sorsávjai, B oszlopsávjai, C blokkjai; kattintson egy eszközre"></svg>
<p class="small">Eszközre kattintva (vagy Tab + Enter) kiemelődik a nála lévő A-, B- és C-blokk. N = 8192, f32; TPU v3-8,
8 TensorCore; a fizikai topológiát a mesh csak közelíti.</p>
<script>
const N=8192, MX=2, MY=4, SZ={"A": 128, "B": 64, "C": 32};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let sel=[1,2];
function draw(){
  svg.innerHTML="";const L=cs("--line"),bad=document.getElementById("bad").checked,[si,sj]=sel;
  const d=el("defs",{});const m=document.createElementNS(NS,"marker");m.setAttribute("id","ar");m.setAttribute("markerWidth",8);m.setAttribute("markerHeight",8);m.setAttribute("refX",6);m.setAttribute("refY",3);m.setAttribute("orient","auto");
  const p=document.createElementNS(NS,"path");p.setAttribute("d","M0,0 L6,3 L0,6 z");p.setAttribute("fill",L);m.appendChild(p);d.appendChild(m);
  el("text",{x:110,y:18,"text-anchor":"middle","font-weight":"bold"},"mesh (2, 4): ('x', 'y')");
  for(let i=0;i<MX;i++)for(let j=0;j<MY;j++){const x=12+j*50,y=30+i*50,on=i===si&&j===sj;
    const g=el("g",{class:"dev",tabindex:0,role:"button","aria-label":`D${i*MY+j}, x=${i}, y=${j}`});
    el("rect",{x,y,width:44,height:44,rx:5,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1.2},undefined,g);
    el("text",{x:x+22,y:y+20,"text-anchor":"middle","font-weight":"bold","font-size":13},"D"+(i*MY+j),g);
    el("text",{x:x+22,y:y+36,"text-anchor":"middle","font-size":10},`(${i},${j})`,g);
    const act=()=>{sel=[i,j];draw();};g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});}
  // A, B, C (a sémarajz méretarányos: N × N = 160 × 160 px)
  const S=160, ax=20, bx=230, cx=480, y0=150;
  el("text",{x:ax+S/2,y:y0-8,"text-anchor":"middle","font-size":12},bad?"A: P('x', 'y')":"A: P('x', None)");
  el("text",{x:bx+S/2,y:y0-8,"text-anchor":"middle","font-size":12},bad?"B: P('y', None)":"B: P(None, 'y')");
  el("text",{x:cx+S/2,y:y0-8,"text-anchor":"middle","font-size":12},"C: P('x', 'y')");
  if(!bad){
    for(let i=0;i<MX;i++){const on=i===si;el("rect",{x:ax,y:y0+i*S/2,width:S,height:S/2,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1});el("text",{x:ax+S/2,y:y0+i*S/2+S/4+5,"text-anchor":"middle"},"A"+i);}
    for(let j=0;j<MY;j++){const on=j===sj;el("rect",{x:bx+j*S/4,y:y0,width:S/4,height:S,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1});el("text",{x:bx+j*S/4+S/8,y:y0+S/2+5,"text-anchor":"middle"},"B"+j);}
  } else {
    for(let i=0;i<MX;i++)for(let j=0;j<MY;j++){const on=i===si&&j===sj;el("rect",{x:ax+j*S/4,y:y0+i*S/2,width:S/4,height:S/2,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1});el("text",{x:ax+j*S/4+S/8,y:y0+i*S/2+S/4+5,"text-anchor":"middle","font-size":11},`A${i}${j}`);}
    for(let j=0;j<MY;j++){const on=j===sj;el("rect",{x:bx,y:y0+j*S/4,width:S,height:S/4,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1});el("text",{x:bx+S/2,y:y0+j*S/4+S/8+5,"text-anchor":"middle"},"B"+j);}
  }
  el("text",{x:205,y:y0+S/2+6,"text-anchor":"middle","font-size":20},"·");el("text",{x:425,y:y0+S/2+6,"text-anchor":"middle","font-size":20},"=");
  for(let i=0;i<MX;i++)for(let j=0;j<MY;j++){const on=i===si&&j===sj;el("rect",{x:cx+j*S/4,y:y0+i*S/2,width:S/4,height:S/2,fill:on?cs("--sel"):cs("--cell"),stroke:on?cs("--hl"):L,"stroke-width":on?3:1});el("text",{x:cx+j*S/4+S/8,y:y0+i*S/2+S/4+5,"text-anchor":"middle","font-size":11},`C${i}${j}`);}
  if(bad){el("path",{d:`M${bx+S},${y0+S+14} C${bx+S+60},${y0+S+40} ${cx-40},${y0+S+40} ${cx},${y0+S+14}`,fill:"none",stroke:cs("--bad"),"stroke-width":2.5,"stroke-dasharray":"6 4","marker-end":"url(#ar)"});
    el("text",{x:(bx+S+cx)/2,y:y0+S+50,"text-anchor":"middle",fill:cs("--bad"),"font-weight":"bold"},"kommunikáció: psum / reduce-scatter az 'y' mentén");}
  const dev=si*MY+sj, h=N/MX, q=N/MY;
  let msg;
  if(!bad) msg=`D${dev} = D(${si}, ${sj}) tartja: A${si} = A[${si*h}:${(si+1)*h}, :] (${h} × ${N}, ${SZ.A} MiB, az x=${si} sor négy eszközén replikálva), B${sj} = B[:, ${sj*q}:${(sj+1)*q}] (${N} × ${q}, ${SZ.B} MiB, az y=${sj} oszlop két eszközén), és kiszámolja a C${si}${sj} = A${si} · B${sj} blokkot (${h} × ${q}, ${SZ.C} MiB). A kontrakciós dimenzió teljes, ezért nincs kommunikáció.`;
  else msg=`Hibás: D${dev} csak A${si}${sj} = A[${si*h}:${(si+1)*h}, ${sj*q}:${(sj+1)*q}]-t és B${sj} = B[${sj*q}:${(sj+1)*q}, :]-t látja, így csak egy ${h} × ${N}-es RÉSZÖSSZEGET tud számolni (a kontrakciós dimenzió negyedéből). A C${si}${sj} előállításához az 'y' mentén a négy részösszeget össze kell adni (psum / reduce-scatter) – ez kommunikáció.`;
  document.getElementById("status").textContent=msg;
}
document.getElementById("bad").onchange=draw;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
