<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A hibaminta-katalógus döntési útja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="sym">„Melyik ellenőrzés hiányzik?” – tünet:</label><select id="sym" onchange="sym(this.value)"><option value="tour">(minden csomópont sorban)</option><option value="E06">a cudaMalloc hibát ad</option><option value="E02">a kernel el sem indul, a launch utáni lekérdezés hibát ad</option><option value="ILL">a szinkronizálás IllegalAddress-t ad, utána minden hívás hibás</option><option value="E05">ritkán eltérő eredmény shared memóriás kernelben</option><option value="E01">a host néha 0-t vagy régi adatot lát</option><option value="E03">látszólag helyes futás, de máshol sérül az adat</option><option value="INI">a kimenet szemét, de nincs hibakód</option></select><pre id="det" class="small" style="width:100%;white-space:pre-wrap;margin:4px 0;display:none"></pre></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az API-hiba, a launch-hiba, a futási hiba és a nem determinisztikus hiba elágazásai a megfelelő ellenőrzéshez és sanitizer-eszközhöz vezetnek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kódrészletek a 10.4 labor E01–E06 mintáiból (rövidítve); a várt kimenetek a katalógustábla szerint, nem futtatott eredmény. A hibakódok a CUDA Runtime API dokumentációja szerint; a pontos kód a toolkittől függhet (E04).</p>

// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"node": "S", "line": -1, "msg": "hibás eredmény vagy hibakód", "code": "", "exp": ""}, {"node": "Q1", "line": -1, "msg": "az API-hívás közvetlenül hibát ad?", "code": "", "exp": ""}, {"node": "E06", "line": -1, "msg": "E06: cudaErrorMemoryAllocation azonnali, nem sticky – CHECK_CUDA, cudaMemGetInfo – nem sticky", "code": "cudaMalloc(&ptr, free_mem + (1ULL << 30)); // biztos túl nagy", "exp": "cudaMalloc sikertelen: … (cudaErrorMemoryAllocation)"}, {"node": "Q2", "line": -1, "msg": "a launch utáni cudaGetLastError jelez?", "code": "", "exp": ""}, {"node": "E02", "line": -1, "msg": "E02, E04: launch-konfiguráció InvalidConfiguration / LaunchOutOfResources, nem sticky – nem sticky", "code": "dummy<<<1, 1025>>>(d_out);   // E02\nsm_kernel<<<1, 32, max_smem + 1>>>();   // E04", "exp": "Launch hiba: invalid configuration argument (E04-nél a toolkittől függően LaunchOutOfResources is lehet)"}, {"node": "Q3", "line": -1, "msg": "a szinkronizálás jelez?", "code": "", "exp": ""}, {"node": "ILL", "line": -1, "msg": "cudaErrorIllegalAddress STICKY: kontextus elveszett, újraindítás; hely: memcheck – STICKY", "code": "kernel<<<…>>>(…); cudaDeviceSynchronize();   // → IllegalAddress", "exp": "minden további CUDA-hívás ugyanazt a hibát adja (sticky)"}, {"node": "Q4", "line": -1, "msg": "hibás vagy nem determinisztikus eredmény: tünet?", "code": "", "exp": ""}, {"node": "E05", "line": -1, "msg": "shared verseny racecheck (E05) – nem sticky", "code": "s[t] = t; out[t] = s[(t + 1) % 64];   // race_kernel<<<1, 64>>>, nincs __syncthreads()", "exp": "racecheck hazard-jelentés (RAW) a shared memóriára"}, {"node": "E01", "line": -1, "msg": "host-olvasás stream- szinkron nélkül (E01) – nem sticky", "code": "cudaMemcpyAsync(h_a, d_a, …); printf(\"%f\", h_a[0]);   // verseny", "exp": "első kiírás nem definiált, a szinkron utáni 3.141500"}, {"node": "E03", "line": -1, "msg": "csendes túlírás memcheck (E03) – nem sticky", "code": "if (idx == n) buf[idx] = 1;   // oob_write<<<1, 12 // ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 480");
  const X = x => 70 + (x + 2.2) * 50, Y = y => 26 + (11.6 - y) * 32;
  const onPath = new Set(STEPS.slice(0, k + 1).map(t => t.node));
  EDGES.forEach(([a, b, lab]) => {
    const A = NODES[a], B = NODES[b];
    let x1 = X(A.x), y1 = Y(A.y), x2 = X(B.x), y2 = Y(B.y);
    if (B.kind === "q" || (a === "Q4")) { y1 += A.kind === "q" ? 34 : 18; y2 -= B.kind === "q" ? 34 : 20; }
    else { x1 += 80; x2 -= 4 + 0; x2 = X(B.x - 1.6); }
    const on = onPath.has(a) && onPath.has(b);
    el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 3 : 1.2});
    if (lab) el("text", {x: (x1 + x2) / 2 + 6, y: (y1 + y2) / 2 - 4, "font-size": 11}, lab);
  });
  Object.keys(NODES).forEach(id => {
    const n = NODES[id], x = X(n.x), y = Y(n.y), on = id === s.node, lines = n.txt.split("\n");
    let g;
    if (n.kind === "q") g = el("polygon", {points: `${x-80},${y} ${x},${y-34} ${x+80},${y} ${x},${y+34}`, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.2, style: "cursor:pointer"});
    else { const w = n.kind === "start" ? 150 : (n.y > 0 ? 230 : 140), x0 = (n.kind === "start" || n.y < 0) ? x - w / 2 : X(n.x - 1.6);
      g = el("rect", {x: x0, y: y - 22, width: w, height: 44, rx: 10, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": n.sticky ? 3.5 : (on ? 3 : 1.2), "stroke-dasharray": n.sticky ? "6 3" : "none", style: "cursor:pointer"});
      n.cx = x0 + w / 2; }
    g.addEventListener("click", () => { const i = STEPS.findIndex(t => t.node === id); if (i >= 0) show(i); else setSteps([ALLS[id]]); });
    const cx = n.kind === "q" ? x : n.cx, fs = n.kind === "q" ? 9.5 : 10;
    lines.forEach((t, j) => el("text", {x: cx, y: y + 4 + (j - (lines.length - 1) / 2) * 12, "text-anchor": "middle", "font-size": fs, style: "pointer-events:none"}, t));
  });
  const box = document.getElementById("det");
  box.textContent = s.code ? ("Kódrészlet:\n" + s.code + "\n\nVárt kimenet: " + s.exp) : "";
  box.style.display = s.code ? "block" : "none";
}

": [{"node": "S", "line": -1, "msg": "hibás eredmény vagy hibakód", "code": "", "exp": ""}, {"node": "Q1", "line": -1, "msg": "az API-hívás közvetlenül hibát ad?", "code": "", "exp": ""}, {"node": "Q2", "line": -1, "msg": "a launch utáni cudaGetLastError jelez?", "code": "", "exp": ""}, {"node": "Q3", "line": -1, "msg": "a szinkronizálás jelez?", "code": "", "exp": ""}, {"node": "Q4", "line": -1, "msg": "hibás vagy nem determinisztikus eredmény: tünet?", "code": "", "exp": ""}, {"node": "INI", "line": -1, "msg": "inicializálatlan olvasás initcheck – nem sticky", "code": "cudaMalloc(&in, …); kernel(in, out);   // nincs cudaMemset/cudaMemcpy", "exp": "initcheck: Uninitialized __global__ memory read"}]};
const ALLS = {}; TOURS.forEach(t => ALLS[t.node] = t);
function sym(v){ if (v === "tour") setSteps(TOURS); else setSteps(PATHS[v]); show(0); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
