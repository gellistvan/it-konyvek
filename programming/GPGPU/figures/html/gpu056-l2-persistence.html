<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2-perzisztencia: A–B–A</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="per" type="checkbox" checked onchange="rebuild()"> perzisztencia</label><label>set-aside: <input id="sa" type="range" min="0" max="12" value="4" oninput="rebuild()" aria-label="Set-aside MiB" style="flex:0 1 90px"> <span id="sao">2,0</span> MiB</label><label>A: <input id="asz" type="range" min="1" max="16" value="4" oninput="rebuild()" aria-label="A mérete MiB" style="flex:0 1 90px"> <span id="aso">2,0</span> MiB</label><label>hitRatio: <input id="hr" type="range" min="0" max="100" value="100" oninput="rebuild()" aria-label="hitRatio" style="flex:0 1 90px"> <span id="hro">1,00</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Perzisztencia nélkül a B puffer kiszorítja A-t az L2-ből, perzisztens ablakkal A a set-aside részben megmarad, és a második olvasás L2-találat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor értékei: L2 = 6 MiB (RTX 3090 példa), set-aside = 2 MiB, A = 2 MiB, B = 4 × L2, window = A. Modell: P = min(hitRatio · window, set-aside) bájt perzisztens; a többi vonal normál, ezeket a B kicseréli.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. readKernel(A): A (2,0 MiB) betöltődik; ebből perzisztens 2,0 MiB a set-aside részben.", "line": 0, "i": 0, "segs": [[0, 2.0, "Ap"], [2.0, 2.0, "A"], [2.0, 6.0, "üres"]], "S": 2.0, "L2": 6.0, "kept": 1.0, "A": 2.0, "h": 1.0, "persist": true}, {"msg": "polluteKernel(B): a 24 MiB-os B minden nem perzisztens vonalat kicserél; A-ból L2-ben marad: 100%.", "line": 1, "i": 1, "segs": [[0, 2.0, "Ap"], [2.0, 6.0, "B"]], "S": 2.0, "L2": 6.0, "kept": 1.0, "A": 2.0, "h": 1.0, "persist": true}, {"msg": "2. readKernel(A): A 100%-a L2-találat, 0%-a DRAM-ból jön.", "line": 0, "i": 2, "segs": [[0, 2.0, "Ap"], [2.0, 2.0, "A"], [2.0, 6.0, "B"]], "S": 2.0, "L2": 6.0, "kept": 1.0, "A": 2.0, "h": 1.0, "persist": true}];
const CODE = ["readKernel<<<…, stream>>>(d_A, d_output, A_n);      // 1. és 3. lépés", "polluteKernel<<<…, stream>>>(d_B, d_dummy, B_n);    // 2. lépés (B = 4 × L2)", "// perzisztencia: cudaDeviceSetLimit(cudaLimitPersistingL2CacheSize, set-aside);", "// accessPolicyWindow: base_ptr = d_A, num_bytes = window, hitRatio, hitProp = Persisting"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function cm(x, d){ return x.toFixed(d).replace(".", ","); }
function model(L2, S, A, h, persist){
  if (!persist) S = 0;
  const P = persist ? Math.min(h * A, S) : 0, nonp = A - P, free = L2 - P;
  const s1 = [[0, P, "Ap"], [P, P + Math.min(nonp, free), "A"]]; s1.push([s1[1][1], L2, "üres"]);
  const s2 = [[0, P, "Ap"], [P, L2, "B"]];
  const rl = Math.min(nonp, free);
  const s3 = [[0, P, "Ap"], [P, P + rl, "A"], [P + rl, L2, "B"]];
  return [[s1, s2, s3], A ? P / A : 0, P];
}
const KN = ["1. readKernel(A)", "polluteKernel(B)", "2. readKernel(A)"];
function stepsFor(L2, S, A, h, persist){
  const [st, kept, P] = model(L2, S, A, h, persist), out = [];
  for (let i = 0; i < 3; i++){
    let msg;
    if (i === 0) msg = KN[0] + ": A (" + cm(A, 1) + " MiB) betöltődik; ebből perzisztens " + cm(P, 1) + " MiB " + (persist ? "a set-aside részben." : "(nincs perzisztens ablak).");
    else if (i === 1) msg = KN[1] + ": a " + cm(4 * L2, 0) + " MiB-os B minden nem perzisztens vonalat kicserél; A-ból L2-ben marad: " + cm(100 * kept, 0) + "%.";
    else msg = KN[2] + ": A " + cm(100 * kept, 0) + "%-a L2-találat, " + cm(100 * (1 - kept), 0) + "%-a DRAM-ból jön.";
    out.push({msg: msg, line: [0, 1, 0][i], i: i, segs: st[i], S: persist ? S : 0, L2: L2, kept: kept, A: A, h: h, persist: persist});
  }
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  const X0 = 20, W = 560, sc = W / s.L2;
  el("text", {x: X0, y: 24, "font-size": 14, "font-weight": "bold"}, KN[s.i] + " után – L2 = " + cm(s.L2, 0) + " MiB" + (s.persist ? ", set-aside = " + cm(s.S, 1) + " MiB" : ", perzisztencia nélkül"));
  const fill = {Ap: hl, A: hl, B: ch_, "üres": cl};
  s.segs.forEach(([a, b, c]) => { if (b > a){
    el("rect", {x: X0 + a * sc, y: 60, width: (b - a) * sc, height: 70, fill: fill[c], stroke: ln, "stroke-width": 0.8, opacity: c === "A" ? 0.6 : 1});
    if ((b - a) * sc > 50) el("text", {x: X0 + (a + b) / 2 * sc, y: 100, "text-anchor": "middle", "font-size": 13, fill: c === "B" || c === "üres" ? css("--fg") : "#fff"}, (c === "Ap" ? "A (perzisztens)" : c === "A" ? "A (normál)" : c) + " " + cm(b - a, 1) + " MiB");
  }});
  for (let m = 1; m < s.L2; m++) el("line", {x1: X0 + m * sc, x2: X0 + m * sc, y1: 60, y2: 130, stroke: mu, "stroke-dasharray": "2 3"});
  if (s.S > 0){ el("rect", {x: X0, y: 54, width: s.S * sc, height: 82, fill: "none", stroke: h2, "stroke-width": 3.5}); el("text", {x: X0, y: 152, "font-size": 12, fill: h2}, "set-aside"); }
  el("text", {x: X0, y: 190, "font-size": 14}, "A-ból L2-ben maradó hányad a B után: " + cm(100 * s.kept, 0) + "%");
  if (s.i === 2) el("text", {x: X0, y: 216, "font-size": 15, "font-weight": "bold", fill: s.kept > 0.99 ? hl : h2}, s.kept > 0.99 ? "L2-találat" : (s.kept > 0 ? "részben L2-találat, részben DRAM" : "DRAM-ból (miss)"));
  if (s.persist && s.h * s.A > s.S + 1e-9) el("text", {x: X0, y: 240, "font-size": 12, fill: h2}, "hitRatio · window > set-aside: a perzisztens vonalak egymást is kiszorítják (a modell a set-aside méretét tartja meg).");
  el("text", {x: X0, y: 262, "font-size": 11, fill: mu}, "Sematikus modell, nem mérés; a kiszorítási heurisztika implementációfüggő; cc ≥ 8.0.");
}
function rebuild(){
  const g = id => +document.getElementById(id).value;
  const S = g("sa") / 2, A = g("asz") / 2, h = g("hr") / 100, p = document.getElementById("per").checked;
  document.getElementById("sao").textContent = cm(S, 1); document.getElementById("aso").textContent = cm(A, 1);
  document.getElementById("hro").textContent = cm(h, 2);
  const keep = k; setSteps(stepsFor(6, S, A, h, p)); show(keep);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
