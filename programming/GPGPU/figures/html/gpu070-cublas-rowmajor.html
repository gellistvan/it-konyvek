<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sor-fő tárolás és cuBLAS</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>M <input id="M" type="range" min="1" max="6" value="2" oninput="reload()" style="width:80px"> <span id="Mv">2</span></label> <label>K <input id="K" type="range" min="1" max="6" value="3" oninput="reload()" style="width:80px"> <span id="Kv">3</span></label> <label>N <input id="N" type="range" min="1" max="6" value="4" oninput="reload()" style="width:80px"> <span id="Nv">4</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A d_A, d_B, d_C lineáris tömb sor-fő és column-major nézetben, majd a helyes és a szándékosan hibás cublasSgemm-hívás eredménye a CPU-referenciával összevetve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A cublasSgemm column-major szemantikájának JavaScript-szimulációja (CUBLAS_OP_N mindkét operandusra, alpha = 1, beta = 0, FP32 helyett egész értékek); A = 1..M·K, B = 1..K·N sor-fő. Kezdőállapot: M = 2, K = 3, N = 4, a fejezet példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"sc": 0, "line": 0, "msg": "d_A: a sor-fő A (2×3) memóriaképe ugyanaz, mint a column-major Aᵀ (3×2)-é; lda = K = 3"}, {"sc": 1, "line": 0, "msg": "d_B: a sor-fő B (3×4) = column-major Bᵀ (4×3); ldb = N = 4"}, {"sc": 2, "line": 0, "msg": "d_C: a várt sor-fő C (2×4) = column-major Cᵀ (4×2); ldc = N = 4"}, {"sc": 3, "line": 2, "msg": "Helyes hívás: m = N = 4, n = M = 2, k = K = 3; Cᵀ = Bᵀ · Aᵀ → d_C sor-fő C-ként olvasva = 38 44 50 56 83 98 113 128, egyezik a CPU-referenciával"}, {"sc": 4, "line": 5, "msg": "Szándékosan hibás hívás: lda = M = 2 → a d_A 2-es lépésközzel olvasott oszlopai (1 2), (3 4), (5 6); d_C = 22 28 49 64 76 100 103 136, nem egyezik"}];
const CODE = ["// Sor-fő A (MxK), B (KxN), C (MxN):", "// column-major nézetben B^T (NxK), A^T (KxM), C^T (NxM): m = N, n = M, k = K", "cublasSgemm(handle, CUBLAS_OP_N, CUBLAS_OP_N, N, M, K,", "            &alpha, d_B, N, d_A, K, &beta, d_C, N);", "// Szándékosan hibás (ne használd): a column-major recept sor-fő adatokra", "cublasSgemm(handle, CUBLAS_OP_N, CUBLAS_OP_N, M, N, K, &alpha, d_A, M, d_B, K, &beta, d_C, M);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SEL = null;
function gv(id){ return +document.getElementById(id).value; }
function sg(m, n, k, A, lda, B, ldb, ldc){
  const C = new Array(ldc*(n-1) + m).fill(0); let oob = false;
  for (let j = 0; j < n; j++) for (let i = 0; i < m; i++) { let s = 0;
    for (let p = 0; p < k; p++) { const ia = i + p*lda, ib = p + j*ldb; if (ia >= A.length || ib >= B.length) { oob = true; continue; } s += A[ia]*B[ib]; }
    C[i + j*ldc] = s; }
  return {C, oob};
}
function data(){
  const M = gv("M"), K = gv("K"), N = gv("N");
  ["M","K","N"].forEach(id => document.getElementById(id + "v").textContent = gv(id));
  const A = Array.from({length: M*K}, (_, i) => i + 1), B = Array.from({length: K*N}, (_, i) => i + 1);
  const ref = []; for (let i = 0; i < M; i++) for (let j = 0; j < N; j++) { let s = 0; for (let p = 0; p < K; p++) s += A[i*K + p]*B[p*N + j]; ref.push(s); }
  const good = sg(N, M, K, B, N, A, K, N), bad = sg(M, N, K, A, M, B, K, M);
  return {M, K, N, A, B, ref, good, bad};
}
function cell(x, y, w, v, on, dash, cb){
  const r = el("rect", {x, y, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": dash ? "4 3" : "none"});
  if (cb) { r.style.cursor = "pointer"; r.addEventListener("click", cb); }
  const t = el("text", {x: x + w/2, y: y + w/2 + 4, "text-anchor": "middle", "font-size": Math.min(w > 26 ? 13 : 11, 1.8*w/Math.max(2, String(v).length))}, String(v));
  t.style.pointerEvents = "none";
}
function linear(x, y, arr, w, label, idxSel){
  el("text", {x, y: y - 6, "font-size": 12}, label);
  arr.forEach((v, i) => { cell(x + i*w, y, w, v, i === idxSel, false, () => { SEL = i; show(k); });
    el("text", {x: x + i*w + w/2, y: y + w + 12, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(i)); });
}
function grid(x, y, r, c, w, f, label, selIdx, dash){
  el("text", {x, y: y - 6, "font-size": 12}, label);
  for (let i = 0; i < r; i++) for (let j = 0; j < c; j++) { const q = f(i, j);
    cell(x + j*w, y + i*w, w, q.v, q.idx === selIdx, dash, q.idx === undefined ? null : () => { SEL = q.idx; show(k); }); }
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 400");
  const D = data(), {M, K, N, A, B} = D, w = 30;
  const ops = [[A, M, K, "d_A", "A", "lda = K = " + K], [B, K, N, "d_B", "B", "ldb = N = " + N], [D.ref, M, N, "d_C (várt)", "C", "ldc = N = " + N]];
  if (s.sc <= 2) {
    const [arr, r, c, nm, L, ld] = ops[s.sc], sel = SEL !== null && SEL < arr.length ? SEL : null;
    const ww = Math.min(w, 720 / arr.length);
    status.textContent = `${nm}: a sor-fő ${L} (${r}×${c}) memóriaképe ugyanaz, mint a column-major ${L}ᵀ (${c}×${r})-é; ${ld}`;
    linear(20, 40, arr, ww, nm + " – lineáris memória (kattints egy cellára)", sel);
    grid(40, 130, r, c, w, (i, j) => ({v: arr[i*c + j], idx: i*c + j}), `sor-fő ${L} (${r}×${c})`, sel);
    grid(80 + c*w + 60, 130, c, r, w, (i, j) => ({v: arr[j*c + i], idx: j*c + i}), `column-major ${L}ᵀ (${c}×${r})`, sel);
    el("text", {x: 40, y: 130 + Math.max(r, c)*w + 30, "font-size": 13}, `${ld}: a sor-fő sorhossz egyben a column-major oszlophossz (vezető dimenzió)`);
    if (sel !== null) el("text", {x: 40, y: 130 + Math.max(r, c)*w + 52, "font-size": 13, fill: css("--hl2")}, `${nm}[${sel}] = sor-fő ${L}[${(sel / c) | 0}][${sel % c}] = column-major ${L}ᵀ(${sel % c}, ${(sel / c) | 0})`);
  } else {
    const good = s.sc === 3, R = good ? D.good : D.bad;
    const ok = !R.oob && R.C.length >= M*N && D.ref.every((v, i) => v === R.C[i]);
    if (good) {
      el("text", {x: 20, y: 24, "font-size": 13}, `cublasSgemm(h, N, N, m = ${N}, n = ${M}, k = ${K}, d_B, ldb = ${N}, d_A, lda = ${K}, d_C, ldc = ${N})`);
      grid(20, 60, N, K, 24, (i, j) => ({v: B[j*N + i]}), `Bᵀ (${N}×${K})`, null, false);
      grid(90 + K*24, 60, K, M, 24, (i, j) => ({v: A[j*K + i]}), `Aᵀ (${K}×${M})`, null, false);
      grid(160 + (K + M)*24, 60, N, M, 24, (i, j) => ({v: R.C[j*N + i]}), `Cᵀ (${N}×${M})`, null, false);
    } else {
      el("text", {x: 20, y: 24, "font-size": 13, fill: css("--hl2")}, `Szándékosan hibás: cublasSgemm(h, N, N, ${M}, ${N}, ${K}, d_A, lda = ${M}, d_B, ldb = ${K}, d_C, ldc = ${M})`);
      grid(20, 60, M, K, 24, (i, j) => { const q = i + j*M; return {v: q < A.length ? A[q] : "?"}; }, `„A” lda = ${M} lépésközzel`, null, true);
      grid(160 + K*24, 60, K, N, 24, (i, j) => { const q = i + j*K; return {v: q < B.length ? B[q] : "?"}; }, `„B” ldb = ${K} lépésközzel`, null, true);
    }
    const flat = R.C.slice(0, M*N);
    linear(20, 240, flat, Math.min(34, 720 / Math.max(1, flat.length)), "d_C, sor-fő C-ként olvasva", null);
    linear(20, 310, D.ref, Math.min(34, 720 / D.ref.length), "CPU-referencia (sor-fő C)", null);
    el("text", {x: 740, y: 222, "text-anchor": "end", "font-size": 15, "font-weight": "bold", fill: ok ? css("--hl") : css("--hl2")}, ok ? "egyezik" : (R.oob ? "nem egyezik + tömbön kívüli olvasás" : "nem egyezik"));
    status.textContent = s.msg.split(":")[0] + `: M = ${M}, K = ${K}, N = ${N} → ` + (ok ? "az eredmény egyezik a CPU-referenciával" : "az eredmény NEM egyezik a CPU-referenciával" + (R.oob ? " (a hívás a tömbön kívülre is olvasna)" : ""));
  }
}
function reload(){ SEL = null; show(k); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
