<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy LSD radix menet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kulcsok (0–3): <input id="inp" value="2, 0, 3, 2, 1, 2, 0, 2" size="30" aria-label="Kulcsok"></label><label>blokkméret: <select id="bs"><option>2</option><option selected>4</option><option>8</option></select></label><label><input id="at" type="checkbox"> atomikus scatter (nem stabil)</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc kulcs két blokkban: blokk-hisztogramok, rekesz-major tömb és scan, rank, stabil kimenet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető méret: 2 bites számjegy (4 rekesz). A labor 8 bites számjegyet, 256 szálas blokkot és 256 rekeszt használ. Kezdőállapot: [2, 0, 3, 2 | 1, 2, 0, 2], blokkméret 4.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "line": 0, "msg": "(1) Bemenet: 8 kulcs 2 blokkban (blokkméret 4)."}, {"ph": 1, "line": 1, "msg": "(2) Blokkonkénti hisztogram (count_kernel): blokk 0 = [1, 0, 2, 1]."}, {"ph": 2, "line": 2, "msg": "(3) Rekesz-major tömb hist[bin·2+blokk] = [1, 1, 0, 1, 2, 2, 1, 0]; exkluzív scan = [0, 1, 2, 2, 3, 5, 7, 8]."}, {"ph": 3, "line": 3, "msg": "(4) rank: a blokkon belül a kisebb tid-ű, azonos rekeszű szálak száma = [0, 0, 0, 1, 0, 0, 0, 1]."}, {"ph": 4, "line": 4, "msg": "(5) Kimenet offsets + rank: [0a, 0b, 1a, 2a, 2b, 2c, 2d, 3a] – az azonos kulcsok eredeti sorrendje megmarad."}];
const CODE = ["int bin = (key >> shift) & MASK;                 // (1) számjegy", "atomicAdd(&s_hist[bin], 1);                      // (2) count_kernel: blokk-hisztogram", "hist[bin * num_blocks + blockIdx.x] = s_hist[bin];  // (3) rekesz-major + exkluzív scan -> offsets", "for (i = 0; i < tid; ++i) rank += (s_bins[i] == bin);  // (4) rank", "output[offsets[bin * num_blocks + blockIdx.x] + rank] = key;  // (5) stabil scatter"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = {keys: [2, 0, 3, 2, 1, 2, 0, 2], bs: 4, atomic: false, sel: -1, perm: null};
function names(keys){ const seen = {}; return keys.map(k => { seen[k] = (seen[k] || 0) + 1; return k + "abcdefghijklmnop"[seen[k]-1]; }); }
function pass(keys, bs){
  const n = keys.length, nb = Math.ceil(n / bs), B = 4;
  const bh = []; for (let b = 0; b < nb; b++) bh.push([0,0,0,0]);
  keys.forEach((k, i) => bh[Math.floor(i / bs)][k]++);
  const hist = []; for (let bin = 0; bin < B; bin++) for (let b = 0; b < nb; b++) hist.push(bh[b][bin]);
  const scan = []; let acc = 0; hist.forEach(h => { scan.push(acc); acc += h; });
  const rank = keys.map((k, i) => { const b0 = Math.floor(i / bs) * bs; let r = 0; for (let j = b0; j < i; j++) r += keys[j] === k; return r; });
  const dest = keys.map((k, i) => scan[k * nb + Math.floor(i / bs)] + rank[i]);
  const nm = names(keys), out = new Array(n); dest.forEach((d, i) => out[d] = i);
  return {nb, bh, hist, scan, rank, dest, nm, out};
}
function trace(keys, bs){
  const r = pass(keys, bs), j = a => a.join(", ");
  const msgs = [`(1) Bemenet: ${keys.length} kulcs ${r.nb} blokkban (blokkméret ${bs}).`,
    `(2) Blokkonkénti hisztogram (count_kernel): blokk 0 = [${j(r.bh[0])}].`,
    `(3) Rekesz-major tömb hist[bin·${r.nb}+blokk] = [${j(r.hist)}]; exkluzív scan = [${j(r.scan)}].`,
    `(4) rank: a blokkon belül a kisebb tid-ű, azonos rekeszű szálak száma = [${j(r.rank)}].`,
    `(5) Kimenet offsets + rank: [${j(r.out.map(i => r.nm[i]))}] – az azonos kulcsok eredeti sorrendje megmarad.`];
  return msgs.map((m, p) => ({ph: p, line: p, msg: m}));
}
function shade(b){ return b % 2 ? css("--cellhl") : css("--cell"); }
function cellR(x, y, w, h, txt, b, strong, fs){
  el("rect", {x, y, width: w, height: h, fill: b === null ? css("--cell") : shade(b), stroke: css("--line"), "stroke-width": strong ? 3 : 1});
  if (b === 1) el("line", {x1: x, y1: y + h, x2: x + 6, y2: y + h - 6, stroke: css("--muted")});
  el("text", {x: x + w/2, y: y + h/2 + 5, "text-anchor": "middle", "font-size": fs || 13}, txt);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const keys = CUR.keys, bs = CUR.bs, r = pass(keys, bs), n = keys.length;
  const w = Math.min(36, 520 / Math.max(n, r.hist.length)), x0 = 110;
  const sel = CUR.sel, sk = sel >= 0 ? keys[r.out[sel]] : -1, sb = sel >= 0 ? Math.floor(r.out[sel] / bs) : -1;
  const lab = (y, t) => el("text", {x: 4, y: y + 20, "font-size": 12, "font-weight": "bold"}, t);
  lab(10, "(1) bemenet");
  keys.forEach((k, i) => cellR(x0 + i*w, 10, w, 28, r.nm[i], Math.floor(i / bs) % 2, sel >= 0 && r.out[sel] === i, 12));
  if (s.ph >= 1) { lab(55, "(2) blokk-hiszt."); r.bh.forEach((h, b) => {
      el("text", {x: x0 + b * (4*w + 10), y: 52, "font-size": 10, fill: css("--muted")}, "blokk " + b);
      h.forEach((v, bin) => cellR(x0 + b * (4*w + 10) + bin*w, 56, w, 26, String(v), b % 2, false, 12)); }); }
  if (s.ph >= 2) { lab(100, "(3) hist / scan");
    r.hist.forEach((v, j) => {
      const bin = Math.floor(j / r.nb), b = j % r.nb, hit = bin === sk && b === sb;
      cellR(x0 + j*w, 100, w, 26, String(v), b % 2, false, 12);
      cellR(x0 + j*w, 128, w, 26, String(r.scan[j]), null, hit, 12);
      el("text", {x: x0 + j*w + w/2, y: 96, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, bin + "," + b);
    }); }
  if (s.ph >= 3) { lab(172, "(4) rank");
    keys.forEach((k, i) => cellR(x0 + i*w, 172, w, 28, String(r.rank[i]), Math.floor(i / bs) % 2, sel >= 0 && r.out[sel] === i, 12)); }
  if (s.ph >= 4) { lab(222, CUR.atomic ? "(5) atomikus" : "(5) kimenet");
    let order = r.out.slice();
    if (CUR.atomic) { if (!CUR.perm) { CUR.perm = order.slice(); for (let a = 0; a < 4; a++) { const idx = []; CUR.perm.forEach((v, p) => { if (keys[v] === a) idx.push(p); });
        const vals = idx.map(p => CUR.perm[p]).sort(() => Math.random() - 0.5); idx.forEach((p, q) => CUR.perm[p] = vals[q]); } } order = CUR.perm; }
    order.forEach((i, d) => {
      const g = el("rect", {x: x0 + d*w, y: 222, width: w, height: 28, fill: css("--cell"), stroke: css("--line"), "stroke-width": d === sel ? 3 : 1, cursor: "pointer"});
      g.addEventListener("click", () => { CUR.sel = CUR.sel === d ? -1 : d; show(k); });
      el("text", {x: x0 + d*w + w/2, y: 241, "text-anchor": "middle", "font-size": 12}, r.nm[i]);
      el("text", {x: x0 + d*w + w/2, y: 266, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(d));
    });
    if (sel >= 0 && !CUR.atomic) { const i = r.out[sel];
      el("text", {x: 4, y: 296, "font-size": 13}, `${r.nm[i]}: offsets[${keys[i]}·${r.nb}+${sb}] + rank = ${r.scan[keys[i]*r.nb+sb]} + ${r.rank[i]} = ${sel}`); }
    else el("text", {x: 4, y: 296, "font-size": 12, fill: css("--muted")}, CUR.atomic ? "atomikus scatter: az azonos kulcsok sorrendje futásonként változhat – nem stabil" : "Kattintson egy kimeneti elemre: a cél = offsets[bin·num_blocks + blokk] + rank tagjai kiemelődnek.");
  }
}
function load(){
  const v = document.getElementById("inp").value.split(/[ ,;|]+/).filter(x => x !== "").map(Number);
  const m = document.getElementById("err");
  if (v.length < 1 || v.length > 16 || v.some(x => !Number.isInteger(x) || x < 0 || x > 3)) { m.textContent = "1–16 kulcs, mindegyik 0–3 (2 bites számjegy)."; return; }
  m.textContent = ""; CUR.keys = v; CUR.bs = +document.getElementById("bs").value; CUR.atomic = document.getElementById("at").checked;
  CUR.sel = -1; CUR.perm = null; setSteps(trace(CUR.keys, CUR.bs));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
