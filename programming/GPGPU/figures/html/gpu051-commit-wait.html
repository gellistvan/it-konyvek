<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cp.async commit és wait_prior</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N az első wait_prior-ban: <input id="nsl" type="range" min="0" max="2" value="1" oninput="rebuild()" aria-label="wait_prior N" style="flex:0 1 90px"> <span id="nout">1</span></label><label><input id="syn" type="checkbox" checked onchange="rebuild()"> __syncthreads() a 2. panelen</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal: három commitált csoport; wait_prior(1) után a két régebbi kész, a legújabb még fut; alatta két szál, a másik szál adatához __syncthreads kell."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, nem mért időzítés (utasítás 1 egység, cp.async 6 egység); cc ≥ 8.0. A wait_prior(N) a hívó szál saját csoportjaira vonatkozik: a legutóbbi N kivételével mindnek késznek kell lennie.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "t = 0–2: 2× __pipeline_memcpy_async – a másolások a G0 csoportba kerülnek (még nincs lezárva). Függő csoportok: {}. Nem lezárt: G0.", "line": 0, "k": 0, "t0": 0, "t1": 2, "pend": [], "N": 1, "sync": true}, {"msg": "t = 2: __pipeline_commit() lezárja a G0 csoportot. Függő csoportok: {G0}.", "line": 1, "k": 1, "t0": 2, "t1": 3, "pend": [0], "N": 1, "sync": true}, {"msg": "t = 3–5: 2× __pipeline_memcpy_async – a másolások a G1 csoportba kerülnek (még nincs lezárva). Függő csoportok: {G0}. Nem lezárt: G1.", "line": 0, "k": 2, "t0": 3, "t1": 5, "pend": [0], "N": 1, "sync": true}, {"msg": "t = 5: __pipeline_commit() lezárja a G1 csoportot. Függő csoportok: {G0, G1}.", "line": 1, "k": 3, "t0": 5, "t1": 6, "pend": [0, 1], "N": 1, "sync": true}, {"msg": "t = 6–7: 1× __pipeline_memcpy_async – a másolások a G2 csoportba kerülnek (még nincs lezárva). Függő csoportok: {G1}. Nem lezárt: G2.", "line": 0, "k": 4, "t0": 6, "t1": 7, "pend": [1], "N": 1, "sync": true}, {"msg": "t = 7: __pipeline_commit() lezárja a G2 csoportot. Függő csoportok: {G1, G2}.", "line": 1, "k": 5, "t0": 7, "t1": 8, "pend": [1, 2], "N": 1, "sync": true}, {"msg": "t = 8: wait_prior(1) – blokkol, amíg legfeljebb a legutóbbi 1 csoport fut; megvárja: G1, visszatér t = 10-kor. Függő csoportok: {G2}.", "line": 2, "k": 6, "t0": 8, "t1": 10, "pend": [2], "N": 1, "sync": true}, {"msg": "t = 10–11: számítás a már megérkezett adatokon. Függő csoportok: {G2}.", "line": 3, "k": 7, "t0": 10, "t1": 11, "pend": [2], "N": 1, "sync": true}, {"msg": "t = 11: wait_prior(0) – blokkol, amíg legfeljebb a legutóbbi 0 csoport fut; megvárja: G2, visszatér t = 12-kor. Függő csoportok: {}.", "line": 4, "k": 8, "t0": 11, "t1": 12, "pend": [], "N": 1, "sync": true}];
const CODE = ["__pipeline_memcpy_async(dst, src, 16);   // cp.async kiadása (G-be gyűlik)", "__pipeline_commit();                     // a csoport lezárása", "__pipeline_wait_prior(N);                // legfeljebb a legutóbbi N csoport fut még", "compute(...);                            // számítás", "__pipeline_wait_prior(0);                // minden saját csoport kész", "__syncthreads();                         // más szálak másolatai is láthatók"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAT = 6;
function simulate(N1){
  const prog = [["cp",0],["cp",0],["commit",0],["cp",1],["cp",1],["commit",1],["cp",2],["commit",2],["wait",N1],["compute",null],["wait",0]];
  let t = 0; const ins = [], groups = [], done = {}, issue = {}; let open = [];
  for (const [op, arg] of prog){
    if (op === "cp"){ open.push(t + LAT); if (!(arg in issue)) issue[arg] = t; ins.push([t, t + 1, "cp", arg]); t += 1; }
    else if (op === "commit"){ done[arg] = Math.max(...open); groups.push({g: arg, issue: issue[arg], done: done[arg], ncopy: open.length}); open = []; ins.push([t, t + 1, "commit", arg]); t += 1; }
    else if (op === "wait"){ const com = Object.keys(done).map(Number).sort((a, b) => a - b); const must = arg < com.length ? com.slice(0, com.length - arg) : []; const te = Math.max(t + 1, ...must.map(g => done[g])); ins.push([t, te, "wait_prior(" + arg + ")", arg]); t = te; }
    else { ins.push([t, t + 1, "számítás", null]); t += 1; }
  }
  return [ins, groups];
}
function makeSteps(N1, sync){
  const [ins, groups] = simulate(N1); const merged = [];
  for (const it of ins){
    const L = merged[merged.length - 1];
    if (L && it[2] === "cp" && L[2] === "cp" && L[3] === it[3]) merged[merged.length - 1] = [L[0], it[1], "cp", it[3], 2];
    else merged.push([it[0], it[1], it[2], it[3], it[2] === "cp" ? 1 : 0]);
  }
  const lines = {"cp": 0, "commit": 1, "számítás": 3}, out = [], com = [];
  merged.forEach((m, i) => {
    const [a, b, lab, arg, n] = m;
    if (lab === "commit") com.push(arg);
    const pend = groups.filter(g => g.done > b && com.includes(g.g)).map(g => g.g);
    const open = groups.filter(g => !com.includes(g.g) && g.issue < b).map(g => g.g);
    const ps = "{" + pend.map(g => "G" + g).join(", ") + "}";
    let msg;
    if (lab === "cp") msg = "t = " + a + "–" + b + ": " + n + "× __pipeline_memcpy_async – a másolások a G" + arg + " csoportba kerülnek (még nincs lezárva).";
    else if (lab === "commit") msg = "t = " + a + ": __pipeline_commit() lezárja a G" + arg + " csoportot.";
    else if (lab.startsWith("wait")){ const must = arg < com.length ? com.slice(0, com.length - arg) : []; const waited = groups.filter(g => must.includes(g.g) && g.done > a).map(g => "G" + g.g); msg = "t = " + a + ": " + lab + " – blokkol, amíg legfeljebb a legutóbbi " + arg + " csoport fut; " + (waited.length ? "megvárja: " + waited.join(", ") + ", visszatér t = " + b + "-kor" : "nem kell várni") + "."; }
    else msg = "t = " + a + "–" + b + ": számítás a már megérkezett adatokon.";
    msg += " Függő csoportok: " + ps + ".";
    if (open.length) msg += " Nem lezárt: " + open.map(g => "G" + g).join(", ") + ".";
    out.push({msg: msg, line: (lab in lines) ? lines[lab] : (i < merged.length - 1 ? 2 : 4), k: i, t0: a, t1: b, pend: pend, N: N1, sync: sync});
  });
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 340");
  const [ins, groups] = simulate(s.N);
  const X0 = 110, U = 30, ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch = css("--cellhl"), mu = css("--muted");
  const tx = t => X0 + t * U;
  el("text", {x: 4, y: 34, "font-size": 12}, "utasítások");
  // utasítássor
  const merged = [];
  for (const it of ins){ const L = merged[merged.length - 1]; if (L && it[2] === "cp" && L[2] === "cp" && L[3] === it[3]) L[1] = it[1]; else merged.push(it.slice()); }
  merged.forEach((m, i) => {
    const [a, b, lab] = m, cur = i === s.k, past = i <= s.k;
    el("rect", {x: tx(a), y: 18, width: (b - a) * U, height: 26, fill: cur ? ch : cl, stroke: cur ? h2 : ln, "stroke-width": cur ? 3 : 1, opacity: past ? 1 : 0.35});
    const sh = lab === "cp" ? "cp×" + (b - a) : lab === "commit" ? "C" + m[3] : lab === "számítás" ? "sz" : "W(" + m[3] + ")";
    el("text", {x: tx(a) + (b - a) * U / 2, y: 35, "text-anchor": "middle", "font-size": 11, opacity: past ? 1 : 0.35}, sh);
  });
  // csoportsávok az aktuális időpontig
  const now = s.t1, pats = ["solid", "ferde", "pont"];
  groups.forEach(g => {
    const y = 62 + g.g * 34;
    el("text", {x: 4, y: y + 16, "font-size": 12}, "G" + g.g + " (" + g.ncopy + " másolás)");
    if (g.issue >= now) return;
    const end = Math.min(g.done, now);
    el("rect", {x: tx(g.issue), y: y, width: (end - g.issue) * U, height: 22, fill: g.g === 0 ? ch : cl, stroke: ln, "stroke-width": 1, "stroke-dasharray": g.g === 2 ? "2 2" : (g.g === 1 ? "6 2" : "none")});
    if (g.done <= now){ el("circle", {cx: tx(g.done), cy: y + 11, r: 5, fill: ln}); el("text", {x: tx(g.done) + 8, y: y + 16, "font-size": 11}, "kész"); }
    else el("text", {x: tx(end) + 6, y: y + 16, "font-size": 11, fill: h2}, "fut…");
  });
  el("line", {x1: tx(now), x2: tx(now), y1: 12, y2: 162, stroke: h2, "stroke-width": 2, "stroke-dasharray": "5 3"});
  for (let t = 0; t <= 14; t += 2) el("text", {x: tx(t), y: 176, "text-anchor": "middle", "font-size": 10, fill: mu}, String(t));
  el("text", {x: tx(now) + 4, y: 12, "font-size": 11, fill: h2}, "most: t = " + now);
  el("text", {x: 4, y: 192, "font-size": 10, fill: mu}, "cp = __pipeline_memcpy_async, Cg = __pipeline_commit(), W(N) = __pipeline_wait_prior(N), sz = számítás");
  // 2. panel
  const yb = 214, ok = s.sync;
  el("text", {x: 4, y: yb, "font-size": 12, "font-weight": "bold"}, "Két szál, mindkettő wait_prior(0) után; B az A elemét olvassa – __syncthreads(): " + (ok ? "be" : "ki"));
  [["A szál", 7, 0], ["B szál", 3, 1]].forEach(([nm, dn, r]) => {
    const y = yb + 14 + r * 40;
    el("text", {x: 4, y: y + 17, "font-size": 12}, nm);
    el("rect", {x: tx(0), y: y, width: dn * U, height: 24, fill: cl, stroke: ln, "stroke-dasharray": "6 2"});
    el("text", {x: tx(dn / 2), y: y + 17, "text-anchor": "middle", "font-size": 11}, "saját cp.async");
    el("circle", {cx: tx(dn), cy: y + 12, r: 5, fill: ln});
  });
  const tr = ok ? 8 : 4;
  if (ok){ el("rect", {x: tx(7), y: yb + 8, width: 6, height: 76, fill: ln}); el("text", {x: tx(7) + 10, y: yb + 96, "font-size": 11}, "__syncthreads()"); }
  el("line", {x1: tx(tr), x2: tx(tr), y1: yb + 40, y2: yb + 54, stroke: ok ? hl : h2, "stroke-width": 2.5, "stroke-dasharray": ok ? "none" : "4 3"});
  el("text", {x: tx(tr) + 8, y: yb + 70, "font-size": 12, "font-weight": "bold", fill: ok ? hl : h2}, ok ? "✓ B olvasása t = 8: helyes" : "X B olvasása t = 4: A elemének érkezése (t = 7) előtt – hibás");
}
function rebuild(){
  const N1 = +document.getElementById("nsl").value;
  document.getElementById("nout").textContent = N1;
  const keep = k;
  setSteps(makeSteps(N1, document.getElementById("syn").checked));
  show(keep);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
