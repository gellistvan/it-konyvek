<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid-stride bejárás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>gridDim.x <input id="g" type="range" min="1" max="4" value="2" oninput="rebuild()"> <b id="gv">2</b></label><label>blockDim.x <input id="b" type="range" min="2" max="8" value="4" oninput="rebuild()"> <b id="bv">4</b></label><label>N <input id="n" type="range" min="1" max="40" value="19" oninput="rebuild()"> <b id="nv">19</b></label><label><input id="bad" type="checkbox" onchange="rebuild()"> hibás stride = blockDim.x</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Tömbcellák iterációnként; az aktív szálak b.t felirattal, a cellák alatt a feldolgozások száma."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a könyv illusztrációja – 2 blokk × 4 szál, N = 19, stride = 8, 3 iteráció. A valódi kódban a blokkméret 256. A „hibás stride” a 6.3.5 1. hibája (átfedő feldolgozás).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": -1, "line": 0, "msg": "Kezdőállapot (0. iteráció előtt): gridDim.x = 2, blockDim.x = 4, N = 19, stride = 8; 3 iteráció következik"}, {"k": 0, "line": 3, "msg": "0. iteráció: 8 aktív szál (0.0→0, 0.1→1, 0.2→2, 0.3→3, 1.0→4, 1.1→5, 1.2→6, 1.3→7)"}, {"k": 1, "line": 3, "msg": "1. iteráció: 8 aktív szál (0.0→8, 0.1→9, 0.2→10, 0.3→11, 1.0→12, 1.1→13, 1.2→14, 1.3→15)"}, {"k": 2, "line": 3, "msg": "2. iteráció: 3 aktív szál (0.0→16, 0.1→17, 0.2→18)"}];
const CODE = ["long long idx = (long long)blockIdx.x * blockDim.x + threadIdx.x;", "long long stride = (long long)blockDim.x * gridDim.x;", "for (long long i = idx; i < N; i += stride) {", "  C[i] = A[i] + B[i];", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let P = {g: 2, b: 4, n: 19, bad: false};
function walkJS(p){
  const stride = p.bad ? p.b : p.b * p.g, th = [];
  for (let bi = 0; bi < p.g; bi++) for (let ti = 0; ti < p.b; ti++) th.push([bi, ti]);
  const its = [];
  for (let k = 0; ; k++) {
    const row = th.map(([bi, ti]) => { const i = bi * p.b + ti + k * stride; return {bi, ti, i, a: i < p.n}; });
    if (!row.some(r => r.a)) break;
    its.push(row);
  }
  return {stride, its};
}
function render(s){
  const W = walkJS(P), n = P.n, rows = W.its.length;
  const cw = Math.min(26, 640 / Math.max(n, 8)), x0 = 40, thrs = P.g * P.b;
  const rh = 26, top = 60, h = top + 70 + thrs * 17 + 30;
  svg.setAttribute("viewBox", `0 0 ${Math.max(700, x0 + n * cw + 20)} ${h}`);
  svg.innerHTML = "";
  // feldolgozási számláló az eddigi iterációkban
  const cnt = new Array(n).fill(0), who = Array.from({length: n}, () => []);
  for (let k = 0; k <= s.k && k < rows; k++) W.its[k].forEach(r => { if (r.a) { cnt[r.i]++; who[r.i].push(r.bi + "." + r.ti); } });
  el("text", {x: x0, y: 20, "font-size": 13}, `stride = ${W.stride}${P.bad ? " (HIBÁS: blockDim.x)" : " = blockDim.x · gridDim.x"} · iterációk: ${rows}`);
  for (let i = 0; i < n; i++) {
    const cur = s.k >= 0 && W.its[s.k] && W.its[s.k].find(r => r.a && r.i === i);
    const done = cnt[i] > 0;
    el("rect", {x: x0 + i * cw, y: top, width: cw, height: rh, fill: cur ? (cur.bi % 2 ? css("--cell") : css("--cellhl")) : css("--cell"),
      stroke: css("--line"), "stroke-width": cur ? 3 : 1, "stroke-dasharray": cur && cur.bi % 2 ? "4 2" : "none"});
    if (cur) el("text", {x: x0 + i * cw + cw / 2, y: top + 17, "text-anchor": "middle", "font-size": 10}, cur.bi + "." + cur.ti);
    el("text", {x: x0 + i * cw + cw / 2, y: top - 5, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(i));
    if (done) el("text", {x: x0 + i * cw + cw / 2, y: top + rh + 14, "text-anchor": "middle", "font-size": 10,
      "font-weight": cnt[i] > 1 ? "bold" : "normal", fill: cnt[i] > 1 ? css("--hl2") : css("--muted")}, cnt[i] + "×");
  }
  el("text", {x: x0, y: top + rh + 30, "font-size": 11, fill: css("--muted")}, "cella alatt: hányszor dolgozták fel eddig (2× = átfedés)");
  // állapottábla szálanként
  let y = top + rh + 52;
  const cols = [x0, x0 + 80, x0 + 130, x0 + 230];
  ["szál (b.t)", "idx", "aktuális i", "állapot"].forEach((t, c) => el("text", {x: cols[c], y, "font-size": 11, "font-weight": "bold"}, t));
  W.its.length && W.its[0].forEach((r, j) => {
    y += 17;
    const cur = s.k >= 0 && s.k < rows ? W.its[s.k][j] : null;
    const st = s.k < 0 ? "indul" : (cur.a ? "aktív" : "kilépett (i ≥ N)");
    const at = cur && !cur.a ? {fill: css("--muted")} : {};
    [`${r.bi}.${r.ti}`, String(r.i), cur ? String(cur.i) : "–", st].forEach((t, c) =>
      el("text", Object.assign({x: cols[c], y, "font-size": 11, "font-weight": cur && cur.a ? "bold" : "normal"}, at), t));
  });
}
function rebuild(){
  P = {g: +document.getElementById("g").value, b: +document.getElementById("b").value,
       n: +document.getElementById("n").value, bad: document.getElementById("bad").checked};
  document.getElementById("gv").textContent = P.g; document.getElementById("bv").textContent = P.b;
  document.getElementById("nv").textContent = P.n;
  const W = walkJS(P), st = [{k: -1, line: 0, msg: `Kezdőállapot (0. iteráció előtt): gridDim.x = ${P.g}, blockDim.x = ${P.b}, N = ${P.n}, stride = ${W.stride}; ${W.its.length} iteráció következik`}];
  W.its.forEach((row, k) => { const a = row.filter(r => r.a).map(r => `${r.bi}.${r.ti}→${r.i}`);
    st.push({k, line: 3, msg: `${k}. iteráció: ${a.length} aktív szál (${a.join(", ")})`}); });
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
