<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>W slotos gyűrűpuffer és eseménylánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>W: <input type="range" min="1" max="8" value="4" aria-label="Slotok száma" oninput="PW=+this.value;document.getElementById('wv').textContent=PW;reload()"> <span id="wv">4</span></label><label>kernel/másolás: <input type="range" min="2" max="30" value="6" aria-label="Kernelidő" oninput="PK=this.value/10;document.getElementById('kv').textContent=(PK).toFixed(1).replace('.',',');reload()"> <span id="kv">0,6</span></label><label><input type="checkbox" onchange="WAIT=!this.checked;reload()"> a host-várakozás kikapcsolása</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal Host, copy_stream, compute_stream és out_stream sávval nyolc chunkra; a 4. chunk kiadása az out_done(0)-ig blokkol; alul a négy slot foglaltsága és a folyamatban lévő chunkok száma."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Elméleti modell, illusztratív időtartamokkal (H2D = D2H = 1, kernel 0,6, kiadás 0,1), nem mérés. A host-várakozás kikapcsolásakor a chunk i a W-vel korábbi chunk még használt d_in/d_out pufferét írhatja (mintázott sávok).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0.1, "line": 1, "msg": "t = 0,10: chunk 0 – kiadás"}, {"t": 0.2, "line": 1, "msg": "t = 0,20: chunk 1 – kiadás"}, {"t": 0.30000000000000004, "line": 1, "msg": "t = 0,30: chunk 2 – kiadás"}, {"t": 0.4, "line": 1, "msg": "t = 0,40: chunk 3 – kiadás"}, {"t": 1.1, "line": 3, "msg": "t = 1,10: chunk 0 – copy_done"}, {"t": 1.7000000000000002, "line": 5, "msg": "t = 1,70: chunk 0 – compute_done"}, {"t": 2.1, "line": 3, "msg": "t = 2,10: chunk 1 – copy_done"}, {"t": 2.7, "line": 7, "msg": "t = 2,70: chunk 0 – out_done + callback"}, {"t": 2.7, "line": 5, "msg": "t = 2,70: chunk 1 – compute_done"}, {"t": 2.8000000000000003, "line": 2, "msg": "t = 2,80: chunk 4 – kiadás (a host eddig várt az out_done(0)-re)"}, {"t": 3.1, "line": 3, "msg": "t = 3,10: chunk 2 – copy_done"}, {"t": 3.7, "line": 7, "msg": "t = 3,70: chunk 1 – out_done + callback"}, {"t": 3.7, "line": 5, "msg": "t = 3,70: chunk 2 – compute_done"}, {"t": 3.8000000000000003, "line": 2, "msg": "t = 3,80: chunk 5 – kiadás (a host eddig várt az out_done(1)-re)"}, {"t": 4.1, "line": 3, "msg": "t = 4,10: chunk 3 – copy_done"}, {"t": 4.699999999999999, "line": 5, "msg": "t = 4,70: chunk 3 – compute_done"}, {"t": 4.7, "line": 7, "msg": "t = 4,70: chunk 2 – out_done + callback"}, {"t": 4.8, "line": 2, "msg": "t = 4,80: chunk 6 – kiadás (a host eddig várt az out_done(2)-re)"}, {"t": 5.1, "line": 3, "msg": "t = 5,10: chunk 4 – copy_done"}, {"t": 5.699999999999999, "line": 5, "msg": "t = 5,70: chunk 4 – compute_done"}, {"t": 5.7, "line": 7, "msg": "t = 5,70: chunk 3 – out_done + callback"}, {"t": 5.8, "line": 2, "msg": "t = 5,80: chunk 7 – kiadás (a host eddig várt az out_done(3)-re)"}, {"t": 6.1, "line": 3, "msg": "t = 6,10: chunk 5 – copy_done"}, {"t": 6.699999999999999, "line": 5, "msg": "t = 6,70: chunk 5 – compute_done"}, {"t": 6.7, "line": 7, "msg": "t = 6,70: chunk 4 – out_done + callback"}, {"t": 7.1, "line": 3, "msg": "t = 7,10: chunk 6 – copy_done"}, {"t": 7.699999999999999, "line": 5, "msg": "t = 7,70: chunk 6 – compute_done"}, {"t": 7.7, "line": 7, "msg": "t = 7,70: chunk 5 – out_done + callback"}, {"t": 8.1, "line": 3, "msg": "t = 8,10: chunk 7 – copy_done"}, {"t": 8.7, "line": 7, "msg": "t = 8,70: chunk 6 – out_done + callback"}, {"t": 8.7, "line": 5, "msg": "t = 8,70: chunk 7 – compute_done"}, {"t": 9.7, "line": 7, "msg": "t = 9,70: chunk 7 – out_done + callback"}];
const CODE = ["for (size_t i = 0; i < count; ++i) {", "    Slot& s = slots[i % W];", "    cudaEventSynchronize(s.out_done);            // W-vel korábbi chunk vége", "    cudaMemcpyAsync(s.d_in, s.h_in, …, copy_stream);  cudaEventRecord(s.copy_done, copy_stream);", "    cudaStreamWaitEvent(compute_stream, s.copy_done);  scale_kernel<<<…, compute_stream>>>(…);", "    cudaEventRecord(s.compute_done, compute_stream);", "    cudaStreamWaitEvent(out_stream, s.compute_done);  cudaMemcpyAsync(s.h_out, s.d_out, …, out_stream);", "    cudaLaunchHostFunc(out_stream, on_d2h_done, &finished);  cudaEventRecord(s.out_done, out_stream);", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PW = 4, PK = 0.6, PC = 1.0, WAIT = true, CHS = null;
function sim(w, n, d, wait){
  let t = 0, cs = 0, ks = 0, os = 0; const od = {}, ch = [];
  for (let i = 0; i < n; i++) { const slot = i % w, w0 = t; if (wait) t = Math.max(t, od[slot] || 0);
    const bl = t > w0 ? [w0, t] : null; t += d.issue;
    const h0 = Math.max(t, cs), h1 = h0 + d.h2d; cs = h1; const k0 = Math.max(h1, ks, t), k1 = k0 + d.k; ks = k1;
    const o0 = Math.max(k1, os, t), o1 = o0 + d.d2h; os = o1;
    ch.push({i, slot, issue: [w0, t], bl, h2d: [h0, h1], k: [k0, k1], d2h: [o0, o1]}); od[slot] = o1; }
  // felülírás: chunk i H2D-je a d_in-t írja, amíg a chunk i−w kernele olvassa; kernele a d_out-ot, amíg az i−w D2H-ja olvassa
  ch.forEach(c => { const p = ch[c.i - w]; c.race = !!p && (c.h2d[0] < p.k[1] || c.k[0] < p.d2h[1]); });
  return ch; }
function mk(){ CHS = sim(PW, 8, {h2d: PC, k: PK, d2h: PC, issue: 0.1}, WAIT);
  const ev = []; CHS.forEach(c => { ev.push([c.issue[1], "kiadás", c.i, c.bl ? 2 : 1]); ev.push([c.h2d[1], "copy_done", c.i, 3]);
    ev.push([c.k[1], "compute_done", c.i, 5]); ev.push([c.d2h[1], "out_done + callback", c.i, 7]); });
  ev.sort((a, b) => a[0] - b[0] || a[2] - b[2]);
  return ev.map(([t, what, i, line]) => ({t, line, msg: `t = ${t.toFixed(2).replace(".", ",")}: chunk ${i} – ${what}` +
    (what === "kiadás" && CHS[i].bl ? ` (a host eddig várt az out_done(${i - PW})-re)` : "") + (CHS[i].race && what === "kiadás" ? " – FELÜLÍRT PUFFER!" : "")})); }
function render(s){
  if (!CHS) mk();
  svg.setAttribute("viewBox", "0 0 780 360"); svg.innerHTML = "";
  const T = CHS[CHS.length - 1].d2h[1] * 1.03, X = v => 130 + v / T * 640, now = s.t;
  const L = {Host: 40, copy: 90, compute: 140, out: 190};
  Object.entries(L).forEach(([n, y]) => el("text", {x: 6, y: y + 5, "font-size": 12}, n === "Host" ? "Host" : n + "_stream"));
  let inflight = 0, fin = 0;
  CHS.forEach(c => {
    if (c.issue[1] <= now && now < c.d2h[1]) inflight++; if (c.d2h[1] <= now) fin++;
    if (c.bl && c.bl[0] <= now) el("rect", {x: X(c.bl[0]), y: L.Host - 10, width: X(Math.min(now, c.bl[1])) - X(c.bl[0]), height: 20, fill: "none", stroke: css("--hl2"), "stroke-dasharray": "3 2"});
    if (c.issue[1] <= now) el("rect", {x: X(c.issue[1] - 0.1), y: L.Host - 10, width: Math.max(2, X(c.issue[1]) - X(c.issue[1] - 0.1)), height: 20, fill: css("--muted")});
    [["copy", c.h2d], ["compute", c.k], ["out", c.d2h]].forEach(([ln, [a, b]]) => { if (a > now) return;
      el("rect", {x: X(a), y: L[ln] - 12, width: X(Math.min(b, now)) - X(a), height: 24, fill: c.race ? "url(#hat)" : css("--cell"), stroke: css("--line")});
      el("text", {x: X(a) + 4, y: L[ln] + 5, "font-size": 11}, String(c.i)); });
  });
  el("line", {x1: X(now), x2: X(now), y1: 20, y2: 210, stroke: css("--hl"), "stroke-width": 1.5});
  // gyűrű
  const d = el("defs", {}); const pt = document.createElementNS(NS, "pattern"); pt.setAttribute("id", "hat"); pt.setAttribute("width", 6); pt.setAttribute("height", 6); pt.setAttribute("patternUnits", "userSpaceOnUse");
  const pl = document.createElementNS(NS, "path"); pl.setAttribute("d", "M0,6 L6,0"); pl.setAttribute("stroke", css("--hl2")); pt.appendChild(pl); d.appendChild(pt);
  const sw = Math.min(90, 740 / PW);
  for (let sl = 0; sl < PW; sl++) {
    const cur = CHS.filter(c => c.slot === sl && c.issue[0] <= now).pop();
    const busy = cur && now < cur.d2h[1];
    el("rect", {x: 20 + sl * sw, y: 250, width: sw - 8, height: 50, fill: busy ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": busy ? 2.5 : 1});
    el("text", {x: 20 + sl * sw + (sw - 8) / 2, y: 270, "text-anchor": "middle", "font-size": 12}, "S" + sl);
    el("text", {x: 20 + sl * sw + (sw - 8) / 2, y: 290, "text-anchor": "middle", "font-size": 11}, cur ? "chunk " + cur.i + (busy ? "" : " (kész)") : "üres");
  }
  const races = CHS.filter(c => c.race && c.issue[1] <= now).length;
  el("text", {x: 20, y: 330, "font-size": 13}, `folyamatban: ${inflight} (≤ W = ${PW} ${inflight <= PW ? "✓" : "✗"}),  finished (callback): ${fin}` + (races ? `,  felülírt puffer: ${races} chunk (mintázott)` : ""));
}
function reload(){ setSteps(mk()); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
