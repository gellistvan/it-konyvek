<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle-redukció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sávok: <select id="nl" aria-label="Sávszám"><option>8</option><option>16</option><option>32</option></select></label><label>Változat: <select id="kd" aria-label="Változat"><option value="down">down (fa)</option><option value="xor">xor (pillangó)</option><option value="up">up (scan)</option></select></label><label>Bemenet: <input id="inp" size="22" placeholder="üres: 1, 2, …, n" aria-label="Saját bemenet"></label><button onclick="load()">Betöltés</button><button onclick="ones()">32 × 1</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A sávok értékei lépésenként; down változatnál csak a 0. sáv gyűjti a teljes összeget."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: 8 sáv, bemenet 1…8, down változat (a 0. sáv a végén 36). A kódpanelen a három változat ciklusa (width = sávszám); a kód 32 sávval és offset = 16-tal indul.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"vals": [1, 2, 3, 4, 5, 6, 7, 8], "off": 0, "step": 0, "kind": "down", "line": 0, "msg": "Bemenet (8 sáv), összeg = 36"}, {"vals": [6, 8, 10, 12, 10, 12, 14, 16], "off": 4, "step": 1, "kind": "down", "line": 1, "msg": "offset = 4: a 0. sávban 6"}, {"vals": [16, 20, 20, 24, 24, 28, 28, 32], "off": 2, "step": 2, "kind": "down", "line": 1, "msg": "offset = 2: a 0. sávban 16"}, {"vals": [36, 40, 44, 48, 52, 56, 60, 64], "off": 1, "step": 3, "kind": "down", "line": 1, "msg": "offset = 1: a 0. sávban 36"}];
const CODE = ["for (int offset = width / 2; offset > 0; offset >>= 1)", "    val += __shfl_down_sync(0xffffffff, val, offset);", "for (int offset = width / 2; offset > 0; offset >>= 1)", "    val += __shfl_xor_sync(0xffffffff, val, offset);", "for (int offset = 1; offset < width; offset <<= 1) {", "    float y = __shfl_up_sync(0xffffffff, val, offset);", "    if (lane >= offset) val += y; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let KIND = "down";
function shf(v, kind, off){ const n = v.length; return v.map((_, l) => kind === "down" ? v[l + off < n ? l + off : l] : kind === "up" ? v[l - off >= 0 ? l - off : l] : v[l ^ off]); }
function gen(vals, kind){
  const n = vals.length, out = [], l0 = {down: 0, xor: 2, up: 4}[kind];
  let cur = vals.slice(), k = 0;
  out.push({vals: cur, off: 0, step: 0, kind, line: l0, msg: `Bemenet (${n} sáv), összeg = ${vals.reduce((a, b) => a + b, 0)}`});
  if (kind === "up") { for (let off = 1; off < n; off *= 2) { const g = shf(cur, "up", off); cur = cur.map((v, l) => l >= off ? v + g[l] : v); k++;
      out.push({vals: cur, off, step: k, kind, line: 6, msg: `offset = ${off}: sávok: ${cur.slice(0, 8).join(", ")}${n > 8 ? "…" : ""}`}); } }
  else for (let off = n / 2; off > 0; off = Math.floor(off / 2)) { const g = shf(cur, kind, off); cur = cur.map((v, l) => v + g[l]); k++;
      out.push({vals: cur, off, step: k, kind, line: l0 + 1, msg: `offset = ${off}: ` + (kind === "down" ? "a 0. sávban " + cur[0] : (new Set(cur)).size === 1 ? "minden sávban " + cur[0] : "sávok: " + cur.slice(0, 8).join(", ") + (n > 8 ? "…" : ""))}); }
  return out;
}
function render(s){
  const n = s.vals.length, cw = Math.min(64, 680 / n);
  svg.setAttribute("viewBox", "0 0 720 260"); svg.innerHTML = "";
  const useN = s.kind === "down" && s.step > 0 ? Math.max(1, n >> s.step) : n;
  const prev = STEPS[Math.max(0, s.step - 1)];
  el("text", {x: 20, y: 24, "font-size": 13}, s.step === 0 ? "bemenet" : `offset = ${s.off} után (${s.kind})`);
  for (let l = 0; l < n; l++) { const x = 20 + l * cw, on = l < useN;
    if (s.step > 0) { const src = s.kind === "down" ? (l + s.off < n ? l + s.off : -1) : s.kind === "up" ? (l - s.off >= 0 ? l - s.off : -1) : l ^ s.off;
      if (src >= 0) el("line", {x1: 20 + src * cw + cw / 2, y1: 70, x2: x + cw / 2, y2: 130, stroke: css("--muted"), "stroke-width": 1, "stroke-dasharray": s.kind === "xor" ? "4 3" : "none"}); }
    if (s.step > 0) { el("rect", {x, y: 40, width: cw - 2, height: 28, fill: css("--cell"), stroke: css("--muted")});
      if (cw > 18) el("text", {x: x + cw / 2 - 1, y: 59, "text-anchor": "middle", "font-size": Math.min(12, cw * .4), fill: css("--muted")}, prev.vals[l]); }
    el("rect", {x, y: 132, width: cw - 2, height: 34, fill: on ? css("--cell") : css("--cellhl"), stroke: css("--line"), "stroke-width": on && s.step > 0 ? 2.5 : .8});
    if (cw > 14) el("text", {x: x + cw / 2 - 1, y: 154, "text-anchor": "middle", "font-size": Math.min(14, cw * .45), "font-style": on ? "normal" : "italic"}, s.vals[l]);
    if (cw > 14 || l % 4 === 0) el("text", {x: x + cw / 2 - 1, y: 184, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, l);
  }
  el("text", {x: 20, y: 214, "font-size": 12, fill: css("--muted")}, "felső sor: az előző értékek; vonal: forrás → cél sáv; szürke, dőlt: a végeredményhez nem hozzájáruló érték");
  el("text", {x: 20, y: 240, "font-size": 14, "font-weight": "bold"}, s.kind === "down" ? `0. sáv: ${s.vals[0]}` : s.kind === "xor" ? `0. sáv: ${s.vals[0]} (xor: a végén minden sávban ugyanaz)` : `inkluzív prefixösszeg; utolsó sáv: ${s.vals[n - 1]}`);
}
function load(){
  const n = +document.getElementById("nl").value, kind = document.getElementById("kd").value, e = document.getElementById("err");
  let v = document.getElementById("inp").value.trim();
  let vals = v === "" ? Array.from({length: n}, (_, i) => i + 1) : v.split(/[ ,;]+/).filter(x => x).map(Number);
  if (vals.some(x => !Number.isFinite(x))) { e.textContent = "számokat adjon meg"; return; }
  if (vals.length !== n) { e.textContent = `${vals.length} szám helyett ${n} kell – kiegészítve/levágva`; vals = Array.from({length: n}, (_, i) => vals.length ? vals[i % vals.length] : i + 1); }
  else e.textContent = "";
  KIND = kind; setSteps(gen(vals, kind));
}
function ones(){ document.getElementById("nl").value = "32"; document.getElementById("inp").value = Array(32).fill(1).join(", "); document.getElementById("kd").value = "down"; load(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
