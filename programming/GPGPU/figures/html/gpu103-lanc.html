<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A JAX/XLA fordítási lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
g.st{cursor:pointer}#status{min-height:1.6em;margin:4px 0;font-weight:bold}.small{font-size:12px;color:var(--muted)}
pre{margin:6px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;overflow-x:auto;min-height:9em}
</style></head><body>
<svg id="v" viewBox="0 0 900 200" role="img" aria-label="A JAX/XLA fordítási lánc szintjei; kattintson egy dobozra a kimenetéhez"></svg>
<div id="status" aria-live="polite"></div>
<pre id="out"></pre>
<p class="small">Kattintás vagy Tab + Enter: az adott szint sematikus kimenete. A jaxpr és a StableHLO a 27.2.6 <code>make_jaxpr</code>-példájára
(f32[4,3]), a HLO-k a 27.2.1/27.2.3 illusztrációira (a labor f-je, f32[1024,128]) épülnek; illusztráció, nem valós dump. JAX 0.4.3x–0.12.</p>
<script>
const ST=[["py", "Python-\nfüggvény", "jax", null], ["jaxpr", "jaxpr", "jax", "jax.make_jaxpr(f)(x)"], ["shlo", "StableHLO\n(MLIR)", "jax", "jax.jit(f).lower(x)\n.as_text()"], ["hlo0", "HLO\nbefore_opt.", "xla", "XLA_FLAGS=\n--xla_dump_to=…"], ["pass", "passzok", "xla", null], ["hlo1", "HLO\nafter_opt.", "xla", "jax.jit(f).lower(x)\n.compile().as_text()"], ["code", "célkód", "xla", null]], OUT={"py": ["# a 27.2.6 make_jaxpr-példája", "def f(x):", "    y = jnp.sin(x)", "    z = y * x", "    return jnp.sum(z, axis=1)", "", "print(jax.make_jaxpr(f)(jnp.ones((4, 3))))"], "jaxpr": ["# illusztráció (jax.make_jaxpr, a pontos forma verziófüggő)", "{ lambda ; a:f32[4,3]. let", "    b:f32[4,3] = sin a", "    c:f32[4,3] = mul b a", "    d:f32[4] = reduce_sum[axes=(1,)] c", "  in (d,) }", "", "# jax.grad / jax.vmap: jaxpr → jaxpr transzformáció, még az XLA előtt"], "shlo": ["// illusztráció (jax.jit(f).lower(x).as_text()), verziófüggő", "func.func public @main(%arg0: tensor<4x3xf32>) -> tensor<4xf32> {", "  %0 = stablehlo.sine %arg0 : tensor<4x3xf32>", "  %1 = stablehlo.multiply %0, %arg0 : tensor<4x3xf32>", "  %cst = stablehlo.constant dense<0.0> : tensor<f32>", "  %2 = stablehlo.reduce(%1 init: %cst) applies stablehlo.add", "         across dimensions = [1] : (tensor<4x3xf32>, tensor<f32>) -> tensor<4xf32>", "  return %2 : tensor<4xf32>", "}"], "hlo0": ["// illusztráció a 27.2.1-ből (a labor f-je, max-szal; nem valós dump)", "ENTRY %main (x: f32[1024,128]) -> f32[1024] {", "  %y = f32[1024,128] sine(%x)", "  %z = f32[1024,128] multiply(%y, %x)", "  %w = f32[1024] reduce(%z, %zero), dimensions={1}, to_apply=%add", "  %m = f32[] reduce(%x, %ninf), dimensions={0,1}, to_apply=%max", "  %b = f32[1024] broadcast(%m), dimensions={}", "  ROOT %result = f32[1024] add(%w, %b)", "}"], "pass": ["A 27.2.2 passzai (sorrendjük és nevük verziófüggő):", "  1. inliner és egyszerűsítés", "  2. algebrai egyszerűsítés (x * 1 → x, x + 0 → x)", "  3. elrendezés-hozzárendelés (layout assignment)", "  4. fúzió (kLoop, kInput, kOutput, multi-output)", "  5. csempézés (tiling)", "Passzonkénti dump: --xla_dump_hlo_pass_re=<minta>"], "hlo1": ["// illusztráció a 27.2.3-ból (nem valós dump)", "%fusion.row_sum (x: f32[1024,128]) -> f32[1024] { sine, multiply, reduce dim 1 }", "%fusion.global_max (x: f32[1024,128]) -> f32[] { reduce dims {0,1} }", "ROOT %fusion.out = f32[1024] fusion(%fusion.row_sum, %fusion.global_max), kind=kLoop"], "code": ["GPU: LLVM IR → PTX (→ SASS a driverben), cuBLAS-/cuDNN-/Triton-hívások", "TPU: zárt backend (a felhasználó nem látja a gépi kódot)", "A GPU-s fájlnevek (pl. *.ptx, sm_8.0_gpu_after_optimizations) verziófüggők."]}, PASSES=["egyszerűsítés", "algebrai egysz.", "layout assign.", "fúzió", "csempézés"];
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let cur="jaxpr";
function draw(){
  svg.innerHTML="";const L=cs("--line");
  const d=el("defs",{});const m=document.createElementNS(NS,"marker");m.setAttribute("id","ar");m.setAttribute("markerWidth",8);m.setAttribute("markerHeight",8);m.setAttribute("refX",6);m.setAttribute("refY",3);m.setAttribute("orient","auto");
  const p=document.createElementNS(NS,"path");p.setAttribute("d","M0,0 L6,3 L0,6 z");p.setAttribute("fill",L);m.appendChild(p);d.appendChild(m);
  let x=6;const pos=[];
  ST.forEach(([id,lab,side,api],i)=>{const w=id==="pass"?130:106, on=cur===id;
    const g=el("g",{class:"st",tabindex:0,role:"button","aria-label":lab.replace("\n"," ")});
    el("rect",{x,y:60,width:w,height:56,rx:8,fill:on?cs("--cellhl"):cs("--cell"),stroke:L,"stroke-width":side==="xla"?3:1.2},undefined,g);
    lab.split("\n").forEach((t,k,a)=>el("text",{x:x+w/2,y:88+(k-(a.length-1)/2)*16+5,"text-anchor":"middle","font-size":13},t,g));
    if(api){api.split("\n").forEach((t,k)=>el("text",{x:x+w/2,y:(i%2?140:170)+k*14,"text-anchor":"middle","font-size":10.5,"font-family":"monospace"},t,g));}
    const act=()=>{cur=id;draw();};g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
    pos.push([x,w]);x+=w+22;});
  for(let i=0;i<pos.length-1;i++) el("line",{x1:pos[i][0]+pos[i][1],y1:88,x2:pos[i+1][0]-2,y2:88,stroke:L,"stroke-width":1.5,"marker-end":"url(#ar)"});
  const [jx,jw]=pos[1];
  el("path",{d:`M${jx+25},60 C${jx+25},24 ${jx+jw-25},24 ${jx+jw-25},58`,fill:"none",stroke:L,"stroke-width":1.4,"marker-end":"url(#ar)"});
  el("text",{x:jx+jw-14,y:32,"font-size":11},"grad / vmap: jaxpr → jaxpr");
  el("text",{x:(pos[0][0]+pos[2][0]+pos[2][1])/2,y:12,"text-anchor":"middle","font-size":11,fill:cs("--muted")},"JAX (vékony keret)");
  el("text",{x:(pos[3][0]+pos[6][0]+pos[6][1])/2,y:12,"text-anchor":"middle","font-size":11,fill:cs("--muted")},"XLA (vastag keret)");
  const s=ST.find(t=>t[0]===cur);
  document.getElementById("status").textContent=s[1].replace("\n"," ")+(s[3]?" – lekérdezés: "+s[3].replace("\n",""):"");
  document.getElementById("out").textContent=OUT[cur].join("\n");
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
