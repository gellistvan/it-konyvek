<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCL platformok felmérése és a context</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="swap" onchange="swapOrder()"> Platformsorrend felcserélése (más gép / ICD-konfiguráció)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az ICD loader két platformot lát; lépésenként a platform- és eszközlekérdezés, majd a context létrehozása a GPU-platformon."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltétel: egy context = egy platform; a platformok sorrendje az ICD loadertől függ. A kapcsolóval a sorrend felcserélhető: a „mindig az első platform” stratégia ekkor CPU helyett GPU-t választ, a típus szerinti választás változatlan.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stage": 0, "line": 0, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "1. clGetPlatformIDs: a loader két ICD-platformot talál ([0] Intel(R) OpenCL, [1] NVIDIA CUDA). A sorrendet az ICD loader adja, nem a teljesítmény."}, {"stage": 1, "line": 1, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "2. clGetPlatformInfo(CL_PLATFORM_NAME, CL_PLATFORM_VENDOR): a platform egy implementáció (gyártói ICD), nem hardver."}, {"stage": 2, "line": 2, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "3. clGetDeviceIDs(platform, CL_DEVICE_TYPE_ALL): platformonként egy eszköz – [0]: Intel CPU; [1]: NVIDIA GPU."}, {"stage": 3, "line": 3, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "4. clGetDeviceInfo(CL_DEVICE_TYPE, CL_DEVICE_GLOBAL_MEM_SIZE): Intel CPU = CPU, rendszer-RAM (megosztott); NVIDIA GPU = GPU, saját VRAM (diszkrét)."}, {"stage": 4, "line": 5, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "first": "Intel CPU", "bytype": "NVIDIA GPU", "msg": "5. Választás és clCreateContext: a „mindig az első platform” stratégia most Intel CPU-t választ (CPU); a típus szerinti választás (CL_DEVICE_TYPE_GPU) mindig az NVIDIA GPU-t. A context egyetlen platform eszközeit foghatja össze."}];
const CODE = ["clGetPlatformIDs(0, NULL, &n);  clGetPlatformIDs(n, ids, NULL);", "clGetPlatformInfo(ids[p], CL_PLATFORM_NAME, sizeof name, name, NULL);", "clGetDeviceIDs(ids[p], CL_DEVICE_TYPE_ALL, 1, &dev[p], NULL);", "clGetDeviceInfo(dev[p], CL_DEVICE_TYPE / CL_DEVICE_GLOBAL_MEM_SIZE, ...);", "cl_context_properties pr[] = {CL_CONTEXT_PLATFORM, (cl_context_properties)ids[p], 0};", "ctx = clCreateContext(pr, 1, &dev[p], NULL, NULL, &err);  // egy platform eszközei"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALT = {a: [{"stage": 0, "line": 0, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "1. clGetPlatformIDs: a loader két ICD-platformot talál ([0] Intel(R) OpenCL, [1] NVIDIA CUDA). A sorrendet az ICD loader adja, nem a teljesítmény."}, {"stage": 1, "line": 1, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "2. clGetPlatformInfo(CL_PLATFORM_NAME, CL_PLATFORM_VENDOR): a platform egy implementáció (gyártói ICD), nem hardver."}, {"stage": 2, "line": 2, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "3. clGetDeviceIDs(platform, CL_DEVICE_TYPE_ALL): platformonként egy eszköz – [0]: Intel CPU; [1]: NVIDIA GPU."}, {"stage": 3, "line": 3, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "msg": "4. clGetDeviceInfo(CL_DEVICE_TYPE, CL_DEVICE_GLOBAL_MEM_SIZE): Intel CPU = CPU, rendszer-RAM (megosztott); NVIDIA GPU = GPU, saját VRAM (diszkrét)."}, {"stage": 4, "line": 5, "order": ["Intel(R) OpenCL", "NVIDIA CUDA"], "first": "Intel CPU", "bytype": "NVIDIA GPU", "msg": "5. Választás és clCreateContext: a „mindig az első platform” stratégia most Intel CPU-t választ (CPU); a típus szerinti választás (CL_DEVICE_TYPE_GPU) mindig az NVIDIA GPU-t. A context egyetlen platform eszközeit foghatja össze."}], b: [{"stage": 0, "line": 0, "order": ["NVIDIA CUDA", "Intel(R) OpenCL"], "msg": "1. clGetPlatformIDs: a loader két ICD-platformot talál ([0] NVIDIA CUDA, [1] Intel(R) OpenCL). A sorrendet az ICD loader adja, nem a teljesítmény."}, {"stage": 1, "line": 1, "order": ["NVIDIA CUDA", "Intel(R) OpenCL"], "msg": "2. clGetPlatformInfo(CL_PLATFORM_NAME, CL_PLATFORM_VENDOR): a platform egy implementáció (gyártói ICD), nem hardver."}, {"stage": 2, "line": 2, "order": ["NVIDIA CUDA", "Intel(R) OpenCL"], "msg": "3. clGetDeviceIDs(platform, CL_DEVICE_TYPE_ALL): platformonként egy eszköz – [0]: NVIDIA GPU; [1]: Intel CPU."}, {"stage": 3, "line": 3, "order": ["NVIDIA CUDA", "Intel(R) OpenCL"], "msg": "4. clGetDeviceInfo(CL_DEVICE_TYPE, CL_DEVICE_GLOBAL_MEM_SIZE): NVIDIA GPU = GPU, saját VRAM (diszkrét); Intel CPU = CPU, rendszer-RAM (megosztott)."}, {"stage": 4, "line": 5, "order": ["NVIDIA CUDA", "Intel(R) OpenCL"], "first": "NVIDIA GPU", "bytype": "NVIDIA GPU", "msg": "5. Választás és clCreateContext: a „mindig az első platform” stratégia most NVIDIA GPU-t választ (GPU); a típus szerinti választás (CL_DEVICE_TYPE_GPU) mindig az NVIDIA GPU-t. A context egyetlen platform eszközeit foghatja össze."}]};
const PINFO = {"Intel(R) OpenCL": {dev: "Intel CPU", t: "CPU", mem: "rendszer-RAM"},
               "NVIDIA CUDA": {dev: "NVIDIA GPU", t: "GPU", mem: "saját VRAM"}};
function swapOrder(){ setSteps(document.getElementById("swap").checked ? ALT.b : ALT.a); }
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = "";
  const L = css("--line"), C = css("--cell"), H = css("--cellhl");
  el("rect", {x: 10, y: 20, width: 130, height: 40, fill: C, stroke: L});
  el("text", {x: 75, y: 45, "text-anchor": "middle", "font-size": 13}, "Alkalmazás");
  el("rect", {x: 10, y: 110, width: 130, height: 80, fill: s.stage === 0 ? H : C, stroke: L, "stroke-width": s.stage === 0 ? 3 : 1});
  el("text", {x: 75, y: 135, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "ICD loader");
  el("text", {x: 75, y: 155, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, "libOpenCL.so");
  el("text", {x: 75, y: 172, "text-anchor": "middle", "font-size": 10, "font-family": "monospace"}, "vendors/*.icd");
  el("line", {x1: 75, y1: 60, x2: 75, y2: 110, stroke: L});
  s.order.forEach((name, i) => {
    const y = 15 + i * 140, info = PINFO[name];
    const isCtx = s.stage === 4 && info.dev === s.bytype;
    el("rect", {x: 190, y: y, width: 360, height: 125, fill: "none", stroke: L, "stroke-width": s.stage <= 1 ? 4 : 2.5});
    el("line", {x1: 140, y1: 150, x2: 190, y2: y + 30, stroke: L});
    el("text", {x: 200, y: y + 20, "font-size": 13, "font-weight": "bold"}, "[" + i + "] " + (s.stage >= 1 ? name : "platform"));
    if (s.stage >= 2) {
      const hl = s.stage === 3 || (s.stage === 4 && (info.dev === s.first || isCtx));
      el("rect", {x: 205, y: y + 32, width: 150, height: 44, fill: hl ? H : C, stroke: L, "stroke-width": hl ? 2.5 : 1});
      el("text", {x: 280, y: y + 52, "text-anchor": "middle", "font-size": 12}, "eszköz: " + info.dev);
      if (s.stage >= 3) el("text", {x: 280, y: y + 69, "text-anchor": "middle", "font-size": 11}, info.t + ", " + info.mem);
    }
    if (s.stage === 4) {
      if (isCtx) {
        el("rect", {x: 370, y: y + 32, width: 170, height: 84, fill: H, stroke: L});
        el("text", {x: 455, y: y + 50, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "context");
        el("text", {x: 455, y: y + 68, "text-anchor": "middle", "font-size": 11}, "queue · program");
        el("text", {x: 455, y: y + 84, "text-anchor": "middle", "font-size": 11}, "kernel · buffer");
      }
      if (!isCtx) el("text", {x: 370, y: y + 60, "font-size": 11, fill: css("--hl2")}, "✗ nem tehető a GPU contextjébe");
      const tags = [];
      if (info.dev === s.first) tags.push("„első platform” választása");
      if (isCtx) tags.push("típus szerinti (GPU) választás");
      tags.forEach((t, j) => el("text", {x: 205, y: y + 94 + j * 15, "font-size": 11, fill: css("--hl2")}, "← " + t));
    }
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
