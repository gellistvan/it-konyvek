<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Két lépcsős blokkredukció tiled_partition<32>-vel</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="bs">Blokkméret:</label><select id="bs" onchange="setB(this.value)"><option>64</option><option>128</option><option selected>256</option><option>1024</option></select><span class="small">(1024: a 3. önellenőrző kérdés utolsó szála kiemelve)</span><div id="info" aria-live="polite" style="width:100%"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="8 sor 32 szál, soronként 4096-os részösszeg, majd az első warp 32768-ra összegez"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">N = 2^20 elem (mind 1,0), 32 blokk, grid-stride ciklus (9.1.6 labor). Kezdőállapot: blockDim = 256. Az eredmény blokkonként minden blokkméretnél 2^20 / 32 = 32768.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"phase": 0, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 1, "msg": "1/4 Részösszeg: 256 szál, mindegyik 128 elemet ad össze (2^20 / (32 · 256)), minden cella 128."}, {"phase": 1, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 3, "msg": "2/4 Warp-redukció: a 8 csempe mindegyike cg::reduce-szal összegez: 32 · 128 = 4096."}, {"phase": 2, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 5, "msg": "3/4 A csempék 0. lane-je a shared_warpsum[meta_group_rank] helyre ír (8 elem), majd block.sync()."}, {"phase": 3, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 8, "msg": "4/4 Második redukció a 0. csempében: lane 0–7 = 4096, lane 8–31 = 0; output[blockIdx.x] = 32768."}];
const CODE = ["float sum = 0.0f;  // grid-stride ciklus: szálanként 2^20 / (32 · blockDim) elem", "for (idx = blockIdx.x*blockDim.x + threadIdx.x; idx < n; idx += gridDim.x*blockDim.x) sum += input[idx];", "cg::thread_block_tile<32> tile = cg::tiled_partition<32>(block);", "float warp_sum = cg::reduce(tile, sum, cg::plus<float>());", "if (tile.thread_rank() == 0) shared_warpsum[tile.meta_group_rank()] = warp_sum;", "block.sync();", "if (tile.meta_group_rank() == 0) {", "  float v = (tile.thread_rank() < blockDim/32) ? shared_warpsum[tile.thread_rank()] : 0.0f;", "  float final_sum = cg::reduce(tile, v, cg::plus<float>());", "  if (tile.thread_rank() == 0) output[blockIdx.x] = final_sum; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SEL = null;
function render(s){
  svg.innerHTML = "";
  const B = s.B, nt = B / 32, cw = 17, ch = nt > 8 ? 12 : 20, x0 = 70, y0 = 30;
  const H = y0 + nt * ch + 175;
  svg.setAttribute("viewBox", "0 0 760 " + H);
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1"/></pattern>`;
  for (let c = 0; c < 32; c += (c === 24 ? 7 : 8)) el("text", {x: x0 + c*cw + cw/2, y: y0 - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(c));
  el("text", {x: x0 + 31*cw + cw/2, y: y0 - 6, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "31");
  for (let t = 0; t < nt; t++) {
    const y = y0 + t * ch;
    if (nt <= 8 || t % 4 === 0 || t === nt - 1) el("text", {x: x0 - 6, y: y + ch/2 + 4, "text-anchor": "end", "font-size": 11}, "csempe " + t);
    for (let c = 0; c < 32; c++) {
      const g = t * 32 + c, on = SEL === g;
      const r = el("rect", {x: x0 + c*cw, y: y, width: cw, height: ch, fill: t % 2 ? css("--cellhl") : css("--cell"),
        stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 0.5, style: "cursor:pointer"});
      r.addEventListener("click", () => { SEL = g; render(s); info(s); });
    }
    if (s.phase >= 1) el("text", {x: x0 + 32*cw + 8, y: y + ch/2 + 4, "font-size": nt > 8 ? 10 : 12}, "→ " + s.ws);
    if (s.phase >= 2) {
      el("rect", {x: x0 + 32*cw + 70, y: y + 1, width: 60, height: ch - 2, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: x0 + 32*cw + 100, y: y + ch/2 + 4, "text-anchor": "middle", "font-size": nt > 8 ? 10 : 12}, String(s.ws));
    }
  }
  if (s.phase === 0) el("text", {x: x0 + 32*cw + 8, y: y0 + 14, "font-size": 12}, "minden cella = " + s.per);
  if (s.phase >= 2) el("text", {x: 750, y: y0 - 6, "text-anchor": "end", "font-size": 11}, "shared_warpsum[" + nt + "]");
  const yb = y0 + nt * ch + 18;
  if (s.phase >= 2) { el("line", {x1: 20, x2: 740, y1: yb, y2: yb, stroke: css("--fg"), "stroke-dasharray": "8 5", "stroke-width": 2});
                      el("text", {x: 740, y: yb - 5, "text-anchor": "end", "font-size": 12}, "block.sync()"); }
  if (s.phase >= 3) {
    const y2 = yb + 30;
    el("text", {x: x0 - 6, y: y2 + 15, "text-anchor": "end", "font-size": 11}, "csempe 0");
    for (let c = 0; c < 32; c++) el("rect", {x: x0 + c*cw, y: y2, width: cw, height: 20, fill: c < nt ? css("--cellhl") : "url(#hz)", stroke: css("--line"), "stroke-width": 0.6});
    el("text", {x: x0, y: y2 + 38, "font-size": 12}, "lane 0–" + (nt - 1) + ": " + s.ws + (nt < 32 ? ",  lane " + nt + "–31: 0" : ""));
    el("text", {x: x0 + 32*cw + 8, y: y2 + 15, "font-size": 14, "font-weight": "bold"}, "→ " + s.fin);
    el("text", {x: x0, y: y2 + 60, "font-size": 14, "font-weight": "bold"}, "output[blockIdx.x] = " + s.fin);
  }
  if (s.B !== 256) el("text", {x: 20, y: H - 6, "font-size": 11, fill: css("--muted")}, "A labor kódja shared_warpsum[8]-at foglal (256 szál); " + s.B + " szálnál " + nt + " elem kell.");
  info(s);
}
function info(s){
  const o = document.getElementById("info");
  if (SEL === null || SEL >= s.B) { o.textContent = "Kattints egy szálra (cellára) a rangok kiírásához."; return; }
  o.textContent = "block.thread_rank() = " + SEL + ",  tile.meta_group_rank() = " + SEL + " / 32 = " + Math.floor(SEL / 32)
    + ",  tile.thread_rank() = " + SEL + " % 32 = " + (SEL % 32) + (SEL % 32 === 0 ? "  (csempevezető: ő írja a shared_warpsum[" + Math.floor(SEL/32) + "] elemet)" : "");
}
const ALL = {"64": [{"phase": 0, "B": 64, "per": 512, "ws": 16384, "fin": 32768, "line": 1, "msg": "1/4 Részösszeg: 64 szál, mindegyik 512 elemet ad össze (2^20 / (32 · 64)), minden cella 512."}, {"phase": 1, "B": 64, "per": 512, "ws": 16384, "fin": 32768, "line": 3, "msg": "2/4 Warp-redukció: a 2 csempe mindegyike cg::reduce-szal összegez: 32 · 512 = 16384."}, {"phase": 2, "B": 64, "per": 512, "ws": 16384, "fin": 32768, "line": 5, "msg": "3/4 A csempék 0. lane-je a shared_warpsum[meta_group_rank] helyre ír (2 elem), majd block.sync()."}, {"phase": 3, "B": 64, "per": 512, "ws": 16384, "fin": 32768, "line": 8, "msg": "4/4 Második redukció a 0. csempében: lane 0–1 = 16384, lane 2–31 = 0; output[blockIdx.x] = 32768."}], "128": [{"phase": 0, "B": 128, "per": 256, "ws": 8192, "fin": 32768, "line": 1, "msg": "1/4 Részösszeg: 128 szál, mindegyik 256 elemet ad össze (2^20 / (32 · 128)), minden cella 256."}, {"phase": 1, "B": 128, "per": 256, "ws": 8192, "fin": 32768, "line": 3, "msg": "2/4 Warp-redukció: a 4 csempe mindegyike cg::reduce-szal összegez: 32 · 256 = 8192."}, {"phase": 2, "B": 128, "per": 256, "ws": 8192, "fin": 32768, "line": 5, "msg": "3/4 A csempék 0. lane-je a shared_warpsum[meta_group_rank] helyre ír (4 elem), majd block.sync()."}, {"phase": 3, "B": 128, "per": 256, "ws": 8192, "fin": 32768, "line": 8, "msg": "4/4 Második redukció a 0. csempében: lane 0–3 = 8192, lane 4–31 = 0; output[blockIdx.x] = 32768."}], "256": [{"phase": 0, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 1, "msg": "1/4 Részösszeg: 256 szál, mindegyik 128 elemet ad össze (2^20 / (32 · 256)), minden cella 128."}, {"phase": 1, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 3, "msg": "2/4 Warp-redukció: a 8 csempe mindegyike cg::reduce-szal összegez: 32 · 128 = 4096."}, {"phase": 2, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 5, "msg": "3/4 A csempék 0. lane-je a shared_warpsum[meta_group_rank] helyre ír (8 elem), majd block.sync()."}, {"phase": 3, "B": 256, "per": 128, "ws": 4096, "fin": 32768, "line": 8, "msg": "4/4 Második redukció a 0. csempében: lane 0–7 = 4096, lane 8–31 = 0; output[blockIdx.x] = 32768."}], "1024": [{"phase": 0, "B": 1024, "per": 32, "ws": 1024, "fin": 32768, "line": 1, "msg": "1/4 Részösszeg: 1024 szál, mindegyik 32 elemet ad össze (2^20 / (32 · 1024)), minden cella 32."}, {"phase": 1, "B": 1024, "per": 32, "ws": 1024, "fin": 32768, "line": 3, "msg": "2/4 Warp-redukció: a 32 csempe mindegyike cg::reduce-szal összegez: 32 · 32 = 1024."}, {"phase": 2, "B": 1024, "per": 32, "ws": 1024, "fin": 32768, "line": 5, "msg": "3/4 A csempék 0. lane-je a shared_warpsum[meta_group_rank] helyre ír (32 elem), majd block.sync()."}, {"phase": 3, "B": 1024, "per": 32, "ws": 1024, "fin": 32768, "line": 8, "msg": "4/4 Második redukció a 0. csempében: lane 0–31 = 1024; output[blockIdx.x] = 32768."}]};
function setB(b){ SEL = b === 1024 ? 1023 : null; setSteps(ALL[b]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
