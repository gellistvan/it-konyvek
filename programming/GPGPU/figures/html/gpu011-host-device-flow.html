<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host–device lépések: vektorösszeadás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="nosync"> szinkronizáció nélkül (4.2.7, 4. pont)</label><svg width="0" height="0" style="position:absolute"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs></svg></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram: foglalás, H→D másolás, aszinkron kernelindítás, szinkronizáció, D→H másolás, felszabadítás"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 4.2.5 példakódja (N = 1024, <<<4, 256>>>). Folytonos nyíl = blokkoló hívás, szaggatott = aszinkron, sraffozott = host vár / számítás alatt. Sematikus idővonal, nem méretarányos, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. cudaMalloc ×3: d_A, d_B, d_C a global memoryban (3 × 4096 B); blokkoló hívás.", "line": 1, "n": 1, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "üres", "d_B": "üres", "d_C": "üres"}, "nosync": false}, {"msg": "2. cudaMemcpy H→D: h_A → d_A, h_B → d_B; a host megvárja a másolás végét (blokkoló).", "line": 2, "n": 2, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "üres"}, "nosync": false}, {"msg": "3. vectorAdd<<<4, 256>>>: a launch aszinkron, a host azonnal továbbfut; a GPU-n 4 × 256 = 1024 szál számolja C[i] = A[i] + B[i]-t.", "line": 4, "n": 3, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "számítás alatt"}, "nosync": false}, {"msg": "4. cudaGetLastError: csak az indítási hibát látja (pl. túl nagy blokk); a kernel ekkor még fut.", "line": 5, "n": 4, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "számítás alatt"}, "nosync": false}, {"msg": "5. cudaDeviceSynchronize: a host vár (sraffozott), amíg a kernel véget ér; itt jelentkezik a kernel futásidejű hibája.", "line": 6, "n": 5, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "eredmény"}, "nosync": false}, {"msg": "6. cudaMemcpy D→H: d_C → h_C; blokkoló hívás.", "line": 7, "n": 6, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "adat", "d_B": "adat", "d_C": "eredmény"}, "nosync": false}, {"msg": "7. CPU-ellenőrzés FP32-ben, 1e-5 tűréssel: h_C[i] == h_A[i] + h_B[i] → PASSED.", "line": 8, "n": 7, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "adat", "d_B": "adat", "d_C": "eredmény"}, "nosync": false}, {"msg": "8. cudaFree ×3: a device-tömbök felszabadítása.", "line": 9, "n": 8, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "nincs", "d_B": "nincs", "d_C": "nincs"}, "nosync": false}];
const CODE = ["std::vector<float> h_A(N), h_B(N), h_C(N);   // N = 1024, feltöltés", "cudaMalloc(&d_A, N*sizeof(float));  // d_B, d_C ugyanígy", "cudaMemcpy(d_A, h_A.data(), N*sizeof(float), cudaMemcpyHostToDevice);", "cudaMemcpy(d_B, h_B.data(), N*sizeof(float), cudaMemcpyHostToDevice);", "vectorAdd<<<gridSize, blockSize>>>(d_A, d_B, d_C, N);   // <<<4, 256>>>", "CUDA_CHECK(cudaGetLastError());", "CUDA_CHECK(cudaDeviceSynchronize());", "cudaMemcpy(h_C.data(), d_C, N*sizeof(float), cudaMemcpyDeviceToHost);", "for (i...) if (fabs(h_C[i] - (h_A[i] + h_B[i])) > 1e-5f) ...;  // PASSED", "cudaFree(d_A); cudaFree(d_B); cudaFree(d_C);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DEF = [{"n": 1, "name": "cudaMalloc ×3", "hs": [0.0, 1.0], "ds": [0.15, 0.95, "foglalás"], "kind": "block"}, {"n": 2, "name": "cudaMemcpy H→D", "hs": [1.2, 2.6], "ds": [1.3, 2.5, "H→D\nmásolás"], "kind": "block"}, {"n": 3, "name": "kernelindítás", "hs": [2.8, 3.1], "ds": [3.3, 6.0, "vectorAdd\n4 blokk × 256 szál"], "kind": "async"}, {"n": 4, "name": "cudaGetLastError", "hs": [3.2, 3.5], "ds": null, "kind": null}, {"n": 5, "name": "cudaDeviceSynchronize", "hs": [3.6, 6.0], "ds": null, "kind": "sync"}, {"n": 6, "name": "cudaMemcpy D→H", "hs": [6.2, 7.4], "ds": [6.3, 7.3, "D→H\nmásolás"], "kind": "block"}, {"n": 7, "name": "CPU-ellenőrzés (PASSED)", "hs": [7.6, 8.6], "ds": null, "kind": null}, {"n": 8, "name": "cudaFree ×3", "hs": [8.8, 9.6], "ds": [8.9, 9.5, "felszabadítás"], "kind": "block"}];
const NOSYNC = [{"msg": "1. cudaMalloc ×3: d_A, d_B, d_C a global memoryban (3 × 4096 B); blokkoló hívás.", "line": 1, "n": 1, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "üres", "d_B": "üres", "d_C": "üres"}, "nosync": true}, {"msg": "2. cudaMemcpy H→D: h_A → d_A, h_B → d_B; a host megvárja a másolás végét (blokkoló).", "line": 2, "n": 2, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "üres"}, "nosync": true}, {"msg": "3. vectorAdd<<<4, 256>>>: a launch aszinkron, a host azonnal továbbfut; a GPU-n 4 × 256 = 1024 szál számolja C[i] = A[i] + B[i]-t.", "line": 4, "n": 3, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "számítás alatt"}, "nosync": true}, {"msg": "4. cudaGetLastError: csak az indítási hibát látja (pl. túl nagy blokk); a kernel ekkor még fut.", "line": 5, "n": 4, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "számítás alatt"}, "nosync": true}, {"msg": "5. (kimarad) cudaDeviceSynchronize nélkül a host azonnal „kész”-nek hiszi a kernelt, miközben a kernel-sáv még fut: egy host-órás mérés itt megállna, a kernel futásidejű hibája rejtve marad. A következő blokkoló hívás (a default streamen a cudaMemcpy D→H) implicit megvárja a kernelt, és csak ott derül ki a hiba (4.2.7, 4. pont).", "line": -1, "n": 5, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "üres", "d_A": "adat", "d_B": "adat", "d_C": "számítás alatt"}, "nosync": true}, {"msg": "6. cudaMemcpy D→H: d_C → h_C; blokkoló hívás.", "line": 7, "n": 6, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "adat", "d_B": "adat", "d_C": "eredmény"}, "nosync": true}, {"msg": "7. CPU-ellenőrzés FP32-ben, 1e-5 tűréssel: h_C[i] == h_A[i] + h_B[i] → PASSED.", "line": 8, "n": 7, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "adat", "d_B": "adat", "d_C": "eredmény"}, "nosync": true}, {"msg": "8. cudaFree ×3: a device-tömbök felszabadítása.", "line": 9, "n": 8, "mem": {"h_A": "adat", "h_B": "adat", "h_C": "eredmény", "d_A": "nincs", "d_B": "nincs", "d_C": "nincs"}, "nosync": true}], SYNC = STEPS.slice();
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const X = t => 110 + t * 52, YH = 70, YD = 170, H = 34;
  el("text", {x: 8, y: YH + 4, "font-size": 13, "font-weight": "bold"}, "Host (CPU)");
  el("text", {x: 8, y: YD + 4, "font-size": 13, "font-weight": "bold"}, "Device (GPU)");
  DEF.forEach(d => {
    if (d.n > s.n) return;
    const cur = d.n === s.n;
    let hs = d.hs.slice();
    if (s.nosync && d.kind === "sync") { hs = [d.hs[0], d.hs[0] + 0.15]; }
    if (!(s.nosync && d.kind === "sync")) {
      el("rect", {x: X(hs[0]), y: YH - H/2, width: X(hs[1]) - X(hs[0]), height: H,
        fill: d.kind === "sync" ? "url(#hatch)" : css("--cellhl"), stroke: css("--line"), "stroke-width": cur ? 3 : 1});
    }
    el("text", {x: (X(hs[0]) + X(hs[1])) / 2, y: YH - H/2 - 8, "text-anchor": "middle", "font-size": 13, "font-weight": cur ? "bold" : "normal"}, String(d.n));
    if (d.ds) {
      let e = d.ds[1];
      el("rect", {x: X(d.ds[0]), y: YD - H/2, width: X(e) - X(d.ds[0]), height: H,
        fill: d.n === 3 ? css("--hl") : css("--cell"), "fill-opacity": d.n === 3 ? 0.45 : 1, stroke: css("--line"), "stroke-width": cur ? 3 : 1});
      el("text", {x: (X(d.ds[0]) + X(e)) / 2, y: YD + 5, "text-anchor": "middle", "font-size": 11}, d.n === 3 ? "vectorAdd 4×256" : "");
      if (d.n !== 3) el("text", {x: (X(d.ds[0]) + X(e)) / 2, y: YD + H/2 + 14, "text-anchor": "middle", "font-size": 10.5}, d.ds[2].replace("\n", " "));
      const x = X(hs[0]) + 6;
      el("line", {x1: x, y1: YH + H/2, x2: x, y2: YD - H/2 - 4, stroke: css("--line"), "stroke-width": 1.6, "stroke-dasharray": d.kind === "async" ? "6 4" : "none", "marker-end": "url(#ar)"});
    }
  });
  if (s.n >= 5 && !s.nosync) {
    el("line", {x1: X(6.0), y1: YD - H/2, x2: X(6.0), y2: YH + H/2 + 4, stroke: css("--line"), "stroke-dasharray": "2 3", "marker-end": "url(#ar)"});
  }
  if (s.nosync && s.n === 5) {
    el("text", {x: X(3.7), y: YH + 4, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "host: „kész”");
    el("text", {x: X(4.6), y: YD + 32, "font-size": 12, fill: css("--hl2")}, "… a kernel még fut");
  }
  // memóriaterek
  const arrs = [["h_A","h_B","h_C"],["d_A","d_B","d_C"]];
  const shade = {"nincs": "none", "üres": css("--cell"), "adat": css("--cellhl"), "számítás alatt": "url(#hatch)", "eredmény": css("--hl")};
  arrs.forEach((row, r) => {
    const y = 232 + r * 46;
    el("text", {x: 8, y: y + 20, "font-size": 12}, r ? "global memory:" : "rendszermemória:");
    row.forEach((a, i) => {
      const st = s.mem[a], x = 130 + i * 168;
      el("rect", {x: x, y: y, width: 160, height: 30, fill: shade[st], "fill-opacity": st === "eredmény" ? 0.45 : 1, stroke: css("--line"), "stroke-dasharray": st === "nincs" ? "4 3" : "none"});
      el("text", {x: x + 80, y: y + 20, "text-anchor": "middle", "font-size": 12}, a + ": " + st);
    });
  });
}

document.getElementById("nosync").addEventListener("change", e => { const p = k; setSteps(e.target.checked ? NOSYNC : SYNC); show(p); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
