<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMA-kiadási idővonal (ILP és WLP)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>ILP: <input id="ilp" type="range" min="1" max="8" value="1" oninput="recompute()" aria-label="ILP"> <span id="ilpv">1</span></label> <label>aktív warp/ütemező: <input id="wa" type="range" min="1" max="8" value="1" oninput="recompute()" aria-label="aktív warp ütemezőnként"> <span id="wav">1</span></label> <label>L_FMA: <input id="lat" type="range" min="2" max="8" value="4" oninput="recompute()" aria-label="FMA-késleltetés ciklusban"> <span id="latv">4</span></label> <button onclick="preset(1,1,4)">(a)</button> <button onclick="preset(4,1,4)">(b)</button> <button onclick="preset(2,2,4)">(c)</button> <button onclick="preset(1,4,4)">(d)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy ütemező kiadási sávja ciklusonként; egy warp egy lánccal csak minden negyedik ciklusban ad ki FMA-t, négy független lánc vagy négy warp minden ciklust kitölt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: 1 kiadás/ciklus/ütemező, egy lánc a kiadása után L ciklusig nem adható ki újra, körforgásos választás warp-fő sorrendben (W0.a0, W0.a1, …). A kódpanel a 12.3.3 négy akkumulátoros ciklusa (ILP ≤ 4 esetén kiemelve az aktuális lánc). Nem mért idővonal.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "line": 2, "msg": "ciklus 0: kiadva W0.a0; eddig 1 kiadás, 0 buborék, kihasználtság 100%; modell min(1, ILP·W/L) = 25%"}, {"t": 1, "line": -1, "msg": "ciklus 1: buborék (nincs kiadható lánc); eddig 1 kiadás, 1 buborék, kihasználtság 50%; modell min(1, ILP·W/L) = 25%"}, {"t": 2, "line": -1, "msg": "ciklus 2: buborék (nincs kiadható lánc); eddig 1 kiadás, 2 buborék, kihasználtság 33%; modell min(1, ILP·W/L) = 25%"}, {"t": 3, "line": -1, "msg": "ciklus 3: buborék (nincs kiadható lánc); eddig 1 kiadás, 3 buborék, kihasználtság 25%; modell min(1, ILP·W/L) = 25%"}, {"t": 4, "line": 2, "msg": "ciklus 4: kiadva W0.a0; eddig 2 kiadás, 3 buborék, kihasználtság 40%; modell min(1, ILP·W/L) = 25%"}, {"t": 5, "line": -1, "msg": "ciklus 5: buborék (nincs kiadható lánc); eddig 2 kiadás, 4 buborék, kihasználtság 33%; modell min(1, ILP·W/L) = 25%"}, {"t": 6, "line": -1, "msg": "ciklus 6: buborék (nincs kiadható lánc); eddig 2 kiadás, 5 buborék, kihasználtság 29%; modell min(1, ILP·W/L) = 25%"}, {"t": 7, "line": -1, "msg": "ciklus 7: buborék (nincs kiadható lánc); eddig 2 kiadás, 6 buborék, kihasználtság 25%; modell min(1, ILP·W/L) = 25%"}, {"t": 8, "line": 2, "msg": "ciklus 8: kiadva W0.a0; eddig 3 kiadás, 6 buborék, kihasználtság 33%; modell min(1, ILP·W/L) = 25%"}, {"t": 9, "line": -1, "msg": "ciklus 9: buborék (nincs kiadható lánc); eddig 3 kiadás, 7 buborék, kihasználtság 30%; modell min(1, ILP·W/L) = 25%"}, {"t": 10, "line": -1, "msg": "ciklus 10: buborék (nincs kiadható lánc); eddig 3 kiadás, 8 buborék, kihasználtság 27%; modell min(1, ILP·W/L) = 25%"}, {"t": 11, "line": -1, "msg": "ciklus 11: buborék (nincs kiadható lánc); eddig 3 kiadás, 9 buborék, kihasználtság 25%; modell min(1, ILP·W/L) = 25%"}, {"t": 12, "line": 2, "msg": "ciklus 12: kiadva W0.a0; eddig 4 kiadás, 9 buborék, kihasználtság 31%; modell min(1, ILP·W/L) = 25%"}, {"t": 13, "line": -1, "msg": "ciklus 13: buborék (nincs kiadható lánc); eddig 4 kiadás, 10 buborék, kihasználtság 29%; modell min(1, ILP·W/L) = 25%"}, {"t": 14, "line": -1, "msg": "ciklus 14: buborék (nincs kiadható lánc); eddig 4 kiadás, 11 buborék, kihasználtság 27%; modell min(1, ILP·W/L) = 25%"}, {"t": 15, "line": -1, "msg": "ciklus 15: buborék (nincs kiadható lánc); eddig 4 kiadás, 12 buborék, kihasználtság 25%; modell min(1, ILP·W/L) = 25%"}, {"t": 16, "line": 2, "msg": "ciklus 16: kiadva W0.a0; eddig 5 kiadás, 12 buborék, kihasználtság 29%; modell min(1, ILP·W/L) = 25%"}, {"t": 17, "line": -1, "msg": "ciklus 17: buborék (nincs kiadható lánc); eddig 5 kiadás, 13 buborék, kihasználtság 28%; modell min(1, ILP·W/L) = 25%"}, {"t": 18, "line": -1, "msg": "ciklus 18: buborék (nincs kiadható lánc); eddig 5 kiadás, 14 buborék, kihasználtság 26%; modell min(1, ILP·W/L) = 25%"}, {"t": 19, "line": -1, "msg": "ciklus 19: buborék (nincs kiadható lánc); eddig 5 kiadás, 15 buborék, kihasználtság 25%; modell min(1, ILP·W/L) = 25%"}];
const CODE = ["float acc0 = 0, acc1 = 0, acc2 = 0, acc3 = 0;", "for (int i = 0; i < n; i += 4) {", "    acc0 = a0 * acc0 + b0;   // lánc a0", "    acc1 = a1 * acc1 + b1;   // lánc a1", "    acc2 = a2 * acc2 + b2;   // lánc a2", "    acc3 = a3 * acc3 + b3;   // lánc a3", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CYCLES = 20;
function g(id){ return +document.getElementById(id).value; }
function simIssue(ilp, w, lat){
  const n = ilp * w, ready = new Array(n).fill(0), out = []; let ptr = 0;
  for (let t = 0; t < CYCLES; t++) {
    let pick = null;
    for (let j = 0; j < n; j++) { const c = (ptr + j) % n; if (ready[c] <= t) { pick = c; break; } }
    if (pick !== null) { ready[pick] = t + lat; ptr = pick + 1; }
    out.push(pick);
  }
  return out;
}
function nm(c, ilp){ return "W" + Math.floor(c / ilp) + ".a" + (c % ilp); }
function cur(){ return {ilp: g("ilp"), w: g("wa"), lat: g("lat")}; }
function recompute(){
  const p = cur(); ["ilp", "wa", "lat"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  const res = simIssue(p.ilp, p.w, p.lat), st = [];
  let used = 0;
  for (let t = 0; t < CYCLES; t++) {
    const c = res[t]; if (c !== null) used++;
    st.push({t: t, line: (c !== null && p.ilp <= 4) ? 2 + (c % p.ilp) : -1,
      msg: `ciklus ${t}: ` + (c !== null ? `kiadva ${nm(c, p.ilp)}` : "buborék (nincs kiadható lánc)") + `; eddig ${used} kiadás, ${t + 1 - used} buborék, kihasználtság ${Math.round(100 * used / (t + 1))}%; modell min(1, ILP·W/L) = ${Math.round(100 * Math.min(1, p.ilp * p.w / p.lat))}%`});
  }
  setSteps(st);
}
function preset(i, w, l){ document.getElementById("ilp").value = i; document.getElementById("wa").value = w; document.getElementById("lat").value = l; recompute(); }
function render(s){
  const p = cur(); ["ilp", "wa", "lat"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  const res = simIssue(p.ilp, p.w, p.lat), n = p.ilp * p.w, rows = Math.min(n, 16);
  svg.innerHTML = ""; const H = 90 + rows * 18 + 30; svg.setAttribute("viewBox", `0 0 760 ${H}`);
  const cw = 640 / CYCLES, X = t => 100 + t * cw;
  el("text", {x: 4, y: 16, "font-size": 12, "font-weight": "bold"}, "kiadási sáv (1 ütemező)");
  for (let t = 0; t < CYCLES; t++) {
    const c = res[t], done = t <= s.t;
    el("rect", {x: X(t), y: 24, width: cw - 1, height: 30, fill: done ? (c === null ? css("--cell") : (c % 2 ? css("--cellhl") : css("--muted"))) : css("--cell"), stroke: t === s.t ? css("--hl2") : css("--fg"), "stroke-width": t === s.t ? 3 : 0.6, "stroke-dasharray": done && c === null ? "3 2" : ""});
    if (done) el("text", {x: X(t) + cw / 2, y: 44, "text-anchor": "middle", "font-size": n > 1 && p.w > 1 ? 8.5 : 10}, c === null ? "–" : (p.w === 1 ? "a" + (c % p.ilp) : nm(c, p.ilp)));
    el("text", {x: X(t) + cw / 2, y: 68, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(t));
  }
  el("text", {x: 4, y: 86, "font-size": 12, "font-weight": "bold"}, "láncok: kiadás → eredmény (+L)");
  for (let c = 0; c < rows; c++) {
    const y = 94 + c * 18;
    el("text", {x: 92, y: y + 12, "text-anchor": "end", "font-size": 10.5}, nm(c, p.ilp));
    el("line", {x1: X(0), y1: y + 8, x2: X(CYCLES), y2: y + 8, stroke: css("--muted"), "stroke-width": 0.4});
    for (let t = 0; t <= s.t; t++) if (res[t] === c) {
      const x1 = X(Math.min(t + p.lat, CYCLES));
      el("rect", {x: X(t), y: y + 2, width: x1 - X(t), height: 12, fill: css("--cellhl"), stroke: css("--fg"), "stroke-width": 0.8});
      el("rect", {x: X(t), y: y + 2, width: cw - 1, height: 12, fill: css("--fg")});
    }
  }
  if (n > rows) el("text", {x: 100, y: 94 + rows * 18 + 14, "font-size": 11, fill: css("--muted")}, `… további ${n - rows} lánc nem látszik`);
  el("text", {x: 100, y: H - 6, "font-size": 11, fill: css("--muted")}, "fekete: kiadás ciklusa; szürke sáv: a lánc a késleltetés alatt nem adható ki újra");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 700);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
