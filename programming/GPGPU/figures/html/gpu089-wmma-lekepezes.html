<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WMMA makro-tile leképezése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--w0:#fff;--w1:#e3e3e3;--w2:#cfcfcf;--w3:#bbb;--pad:#ddd;--grid:#bbb}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--w0:#262626;--w1:#333;--w2:#404040;--w3:#4d4d4d;--pad:#3a3a3a;--grid:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 8px}
input[type=range]{width:180px}
#status{margin:4px 0 6px;min-height:4.3em;font:13px/1.5 ui-monospace,monospace}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Kiválasztás">
  <label>szál tx <input id="tx" type="range" min="0" max="127" step="1" value="0"><b id="txv"></b></label>
  <label>warp <select id="wp"><option>0</option><option>1</option><option>2</option><option>3</option></select></label>
  <button id="kp">◀ K-lépés</button><button id="kn">K-lépés ▶</button><b id="kv"></b>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 330" role="img" aria-label="A blokk C-csempéje warpokra osztva; a kijelölt szál As- és Bs-darabja kiemelve; a globális A/B-ablak a K-lépéssel mozog"></svg>
<p class="small">TILE_M = TILE_N = 64, TILE_K = 16, PAD = 8, 128 szál, B row-major K×N. A szál kiválasztása a warpot is beállítja (warp_id = tx/32).
A globális ábrán K = 64 (4 K-lépés) szemléltető érték. Sötét: a szál 16 bájtos darabja; keretezett: a warp C-régiója és a hozzá tartozó As-sorok / Bs-oszlopok.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(t, a, s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!==undefined)e.textContent=s;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const $ = id => document.getElementById(id);
const KG = 64; let k0 = 0;
function draw(){
  const tx = +$("tx").value, w = +$("wp").value;
  $("txv").textContent = tx; $("kv").textContent = `k0 = ${k0}`;
  const wr = Math.floor(w/2)*32, wc = (w%2)*32, ra = Math.floor(tx/2), ca = (tx%2)*8, rb = Math.floor(tx/8), cb = (tx%8)*8;
  svg.innerHTML = "";
  const WF = [css("--w0"), css("--w1"), css("--w2"), css("--w3")];
  // C 64x64, 3 px/elem
  const CX = 10, CY = 30, s = 3;
  el("text", {x: CX, y: 20, "font-size": 13, "font-weight": "bold"}, "C-csempe 64×64");
  for (let q = 0; q < 4; q++){ const r0 = Math.floor(q/2)*32, c0 = (q%2)*32;
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++)
      el("rect", {x: CX + (c0+16*j)*s, y: CY + (r0+16*i)*s, width: 16*s, height: 16*s, fill: WF[q], stroke: css("--grid"), "stroke-width": 0.8});
    el("text", {x: CX + (c0+16)*s, y: CY + (r0+16)*s + 4, "text-anchor": "middle", "font-size": 12}, `warp ${q}`); }
  el("rect", {x: CX + wc*s, y: CY + wr*s, width: 32*s, height: 32*s, fill: "none", stroke: css("--hl2"), "stroke-width": 3});
  // As 64x24, 4 px/elem vízszintesen, 3 px/sor
  const AX = 230, AY = 30;
  el("text", {x: AX, y: 20, "font-size": 13, "font-weight": "bold"}, "As[64][24]");
  el("rect", {x: AX, y: AY, width: 16*4, height: 64*s, fill: css("--cell"), stroke: css("--line")});
  el("rect", {x: AX + 64, y: AY, width: 8*4, height: 64*s, fill: css("--pad"), stroke: css("--line")});
  el("rect", {x: AX, y: AY + wr*s, width: 64, height: 32*s, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  el("rect", {x: AX + ca*4, y: AY + ra*s, width: 32, height: s, fill: css("--hl"), stroke: css("--hl"), "stroke-width": 1.5});
  // Bs 16x72, 3 px/elem, 6 px/sor
  const BX = 360, BY = 30;
  el("text", {x: BX, y: 20, "font-size": 13, "font-weight": "bold"}, "Bs[16][72]");
  el("rect", {x: BX, y: BY, width: 64*s, height: 16*6, fill: css("--cell"), stroke: css("--line")});
  el("rect", {x: BX + 64*s, y: BY, width: 8*s, height: 16*6, fill: css("--pad"), stroke: css("--line")});
  el("rect", {x: BX + wc*s, y: BY, width: 32*s, height: 16*6, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  el("rect", {x: BX + cb*s, y: BY + rb*6, width: 8*s, height: 6, fill: css("--hl"), stroke: css("--hl"), "stroke-width": 1.5});
  // globális A (64×K) és B (K×64) ablak
  const GX = 360, GY = 160;
  el("text", {x: GX, y: GY - 8, "font-size": 13, "font-weight": "bold"}, `globális A (64×${KG}) és B (${KG}×64), K = ${KG}`);
  el("rect", {x: GX, y: GY, width: KG*2, height: 64*2, fill: css("--cell"), stroke: css("--line")});
  el("rect", {x: GX + k0*2, y: GY, width: 16*2, height: 64*2, fill: css("--w2"), stroke: css("--hl2"), "stroke-width": 2});
  el("text", {x: GX + KG, y: GY + 64*2 + 16, "text-anchor": "middle", "font-size": 12}, "A_tile[:, k0..k0+15]");
  el("rect", {x: GX + KG*2 + 30, y: GY, width: 64*2, height: KG*2, fill: css("--cell"), stroke: css("--line")});
  el("rect", {x: GX + KG*2 + 30, y: GY + k0*2, width: 64*2, height: 16*2, fill: css("--w2"), stroke: css("--hl2"), "stroke-width": 2});
  el("text", {x: GX + KG*2 + 30 + 64, y: GY + KG*2 + 16, "text-anchor": "middle", "font-size": 12}, "B_tile[k0..k0+15, :]");
  $("status").textContent = `tx = ${tx} (warp ${Math.floor(tx/32)}): row_a = tx/2 = ${ra}, col_a = (tx%2)·8 = ${ca} → As[${ra}][${ca}..${ca+7}] ← A_tile[${ra}·K + ${k0} + ${ca}..]; `
    + `row_b = tx/8 = ${rb}, col_b = (tx%8)·8 = ${cb} → Bs[${rb}][${cb}..${cb+7}] ← B_tile[(${k0} + ${rb})·N + ${cb}..]. `
    + `warp ${w}: warp_row = ${wr}, warp_col = ${wc}; a_frag[i] ← As[${wr}+16i][0], b_frag[j] ← Bs[0][${wc}+16j].`;
}
$("tx").addEventListener("input", () => { $("wp").value = String(Math.floor(+$("tx").value / 32)); draw(); });
$("wp").addEventListener("change", draw);
$("kn").onclick = () => { k0 = Math.min(KG - 16, k0 + 16); draw(); };
$("kp").onclick = () => { k0 = Math.max(0, k0 - 16); draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
