<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalar és warp-per-row CSR</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>kernel: <select id="kern" onchange="reload()"><option value="sc">scalar (szál/sor)</option><option value="wp">warp-per-row (warp/sor)</option></select></label> <label>sorhosszak: <input id="inp" size="28" value="3, 5, 2, 40, 4, 3, 6, 1" aria-label="Sorhosszak"></label> <button onclick="reload()">Betöltés</button> <span id="err" class="small" aria-live="polite"></span></div><div class="ctl"><span id="sum" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A values tömb szektorhatárokkal és az adott iterációban olvasott elemekkel; alatta a scalar kernel lane-jei (aktív vagy tétlen) vagy a warp-per-row kernel soronkénti 32 lane-es warpjai."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sorhosszak 3, 5, 2, 40, 4, 3, 6, 1 (nnz = 64), FP64: 32 bájtos szektor = 4 elem, a values tömb szektorhatáron kezdődik. A szektorszám a values tömbre vonatkozik; az x[col_idx[j]] olvasás mátrixfüggő, nincs ábrázolva. Kezdőállapot: scalar kernel, j = 0.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"kind": "sc", "j": 0, "line": 1, "msg": "scalar, iteráció j = 0: aktív lane 8/8, érintett szektor 6"}, {"kind": "sc", "j": 1, "line": 1, "msg": "scalar, iteráció j = 1: aktív lane 7/8, érintett szektor 6"}, {"kind": "sc", "j": 2, "line": 1, "msg": "scalar, iteráció j = 2: aktív lane 6/8, érintett szektor 5"}, {"kind": "sc", "j": 3, "line": 1, "msg": "scalar, iteráció j = 3: aktív lane 4/8, érintett szektor 4"}, {"kind": "sc", "j": 4, "line": 1, "msg": "scalar, iteráció j = 4: aktív lane 3/8, érintett szektor 3"}, {"kind": "sc", "j": 5, "line": 1, "msg": "scalar, iteráció j = 5: aktív lane 2/8, érintett szektor 2"}, {"kind": "sc", "j": 6, "line": 1, "msg": "scalar, iteráció j = 6: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 7, "line": 1, "msg": "scalar, iteráció j = 7: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 8, "line": 1, "msg": "scalar, iteráció j = 8: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 9, "line": 1, "msg": "scalar, iteráció j = 9: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 10, "line": 1, "msg": "scalar, iteráció j = 10: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 11, "line": 1, "msg": "scalar, iteráció j = 11: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 12, "line": 1, "msg": "scalar, iteráció j = 12: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 13, "line": 1, "msg": "scalar, iteráció j = 13: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 14, "line": 1, "msg": "scalar, iteráció j = 14: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 15, "line": 1, "msg": "scalar, iteráció j = 15: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 16, "line": 1, "msg": "scalar, iteráció j = 16: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 17, "line": 1, "msg": "scalar, iteráció j = 17: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 18, "line": 1, "msg": "scalar, iteráció j = 18: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 19, "line": 1, "msg": "scalar, iteráció j = 19: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 20, "line": 1, "msg": "scalar, iteráció j = 20: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 21, "line": 1, "msg": "scalar, iteráció j = 21: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 22, "line": 1, "msg": "scalar, iteráció j = 22: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 23, "line": 1, "msg": "scalar, iteráció j = 23: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 24, "line": 1, "msg": "scalar, iteráció j = 24: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 25, "line": 1, "msg": "scalar, iteráció j = 25: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 26, "line": 1, "msg": "scalar, iteráció j = 26: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 27, "line": 1, "msg": "scalar, iteráció j = 27: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 28, "line": 1, "msg": "scalar, iteráció j = 28: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 29, "line": 1, "msg": "scalar, iteráció j = 29: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 30, "line": 1, "msg": "scalar, iteráció j = 30: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 31, "line": 1, "msg": "scalar, iteráció j = 31: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 32, "line": 1, "msg": "scalar, iteráció j = 32: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 33, "line": 1, "msg": "scalar, iteráció j = 33: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 34, "line": 1, "msg": "scalar, iteráció j = 34: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 35, "line": 1, "msg": "scalar, iteráció j = 35: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 36, "line": 1, "msg": "scalar, iteráció j = 36: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 37, "line": 1, "msg": "scalar, iteráció j = 37: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 38, "line": 1, "msg": "scalar, iteráció j = 38: aktív lane 1/8, érintett szektor 1"}, {"kind": "sc", "j": 39, "line": 1, "msg": "scalar, iteráció j = 39: aktív lane 1/8, érintett szektor 1"}];
const CODE = ["// scalar: egy szál = egy sor", "for (int j = start; j < end; ++j) sum += values[j] * x[col_idx[j]];", "// warp-per-row: egy warp = egy sor", "for (int j = start + lane; j < end; j += warpSize) sum += values[j] * x[col_idx[j]];", "for (int offset = warpSize / 2; offset > 0; offset >>= 1)", "    sum += __shfl_down_sync(0xffffffffu, sum, offset);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let LN = [3, 5, 2, 40, 4, 3, 6, 1];
function rp(l){ const r = [0]; l.forEach(x => r.push(r[r.length-1] + x)); return r; }
function mk(l, kind){
  const R = rp(l), st = [];
  if (kind === "sc") {
    const mx = Math.max(...l);
    for (let j = 0; j < mx; j++) { const idx = l.map((L, i) => j < L ? R[i] + j : null), a = idx.filter(x => x !== null);
      const sec = new Set(a.map(x => Math.floor(x / 4))).size;
      st.push({kind, j, idx, line: 1, msg: `scalar, iteráció j = ${j}: aktív lane ${a.length}/${l.length}, érintett szektor ${sec}`}); }
  } else {
    const its = Math.max(...l.map(L => Math.ceil(L / 32)));
    for (let it = 0; it < its; it++) { const per = l.map((L, r) => { const idx = []; for (let q = 0; q < 32; q++) if (it*32 + q < L) idx.push(R[r] + it*32 + q); return idx; });
      const act = per.reduce((s, p) => s + p.length, 0), aw = per.filter(p => p.length).length, sec = per.reduce((s, p) => s + new Set(p.map(x => Math.floor(x / 4))).size, 0);
      st.push({kind, it, per, line: 3, msg: `warp-per-row, iteráció ${it}: ${aw} aktív warp, aktív lane ${act}/${aw*32} (aktív warpokban), érintett szektor ${sec}`}); }
    [16, 8, 4, 2, 1].forEach(o => st.push({kind, sh: o, line: 5, msg: `shuffle-redukció, offset = ${o}: lane i += lane i+${o} (i < ${o}); minden warpban, a rövid soroknál is mind az 5 lépés lefut`}));
  }
  return st;
}
function sumry(){
  const l = LN, nnz = l.reduce((a, b) => a + b, 0), mx = Math.max(...l), wi = l.reduce((a, L) => a + Math.ceil(L / 32), 0);
  return `Összesítés: scalar ${mx} iteráció, aktív lane-arány ${nnz}/${l.length*mx} = ${(100*nnz/(l.length*mx)).toFixed(0)}%; warp-per-row ${wi} warp-iteráció (+5 shuffle-lépés), arány ${nnz}/${wi*32} = ${(100*nnz/(wi*32)).toFixed(0)}%`;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 " + (120 + LN.length * 22 + 70));
  const R = rp(LN), nnz = R[R.length-1], X = 150, cw = Math.min(14, 600 / nnz);
  document.getElementById("sum").textContent = sumry();
  // values tömb szektorhatárokkal
  const y0 = 30;
  el("text", {x: X - 8, y: y0 + 13, "text-anchor": "end", "font-size": 12}, "values[ ]");
  const rd = new Set(s.kind === "sc" ? (s.idx || []).filter(x => x !== null) : (s.per ? s.per.flat() : []));
  for (let q = 0; q < nnz; q++) el("rect", {x: X + q*cw, y: y0, width: cw, height: 18, fill: rd.has(q) ? css("--fg") : css("--cell"), stroke: css("--muted"), "stroke-width": 0.4});
  for (let q = 0; q <= nnz; q += 4) el("line", {x1: X + q*cw, y1: y0 - 4, x2: X + q*cw, y2: y0 + 22, stroke: css("--line"), "stroke-width": 1.6});
  for (let r = 0; r < LN.length; r++) if (LN[r] * cw > 14) el("text", {x: X + (R[r] + LN[r]/2)*cw, y: y0 + 34, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, "sor " + r);
  el("text", {x: X, y: y0 - 8, "font-size": 11, fill: css("--muted")}, "vastag függőleges vonal = 32 bájtos szektorhatár (4 double)");
  const Y = 90;
  if (s.kind === "sc") {
    el("text", {x: 20, y: Y, "font-size": 13, "font-weight": "bold"}, `scalar: lane i = sor i, iteráció j = ${s.j}`);
    LN.forEach((L, i) => { const y = Y + 18 + i*22, on = s.idx[i] !== null;
      el("circle", {cx: 40, cy: y, r: 7, fill: on ? css("--fg") : "none", stroke: css("--fg"), "stroke-width": 1.2});
      el("text", {x: 54, y: y + 4, "font-size": 12}, `lane ${i} (len ${L})` + (on ? ` → values[${s.idx[i]}]` : " tétlen"));
      // történet: aktív iterációk sávja
      const hw = Math.min(10, 400 / Math.max(...LN));
      for (let j = 0; j <= s.j; j++) el("rect", {x: 300 + j*hw, y: y - 6, width: hw - 1, height: 12, fill: j < L ? css("--fg") : css("--cellhl")});
    });
    el("text", {x: 300, y: Y, "font-size": 11, fill: css("--muted")}, "eddigi iterációk: fekete = aktív, szürke = tétlen");
  } else if (s.sh) {
    el("text", {x: 20, y: Y, "font-size": 13, "font-weight": "bold"}, `warp-per-row: shuffle-redukció, offset = ${s.sh}`);
    const lw = 18, xs = 40, yy = Y + 60;
    for (let q = 0; q < 32; q++) { el("rect", {x: xs + q*lw, y: yy, width: lw - 2, height: 18, fill: q < s.sh ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 0.6});
      el("text", {x: xs + q*lw + 8, y: yy + 32, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(q)); }
    for (let q = 0; q < s.sh; q++) el("path", {d: `M ${xs + (q + s.sh)*lw + 8} ${yy} Q ${xs + (q + s.sh/2)*lw + 8} ${yy - 30 - s.sh} ${xs + q*lw + 8} ${yy}`, fill: "none", stroke: css("--hl"), "stroke-width": 1});
    el("text", {x: 40, y: yy + 60, "font-size": 12}, "a végén a 0. lane tartja a sor összegét és írja y[row]-t");
  } else {
    el("text", {x: 20, y: Y, "font-size": 13, "font-weight": "bold"}, `warp-per-row: warp r = sor r, iteráció ${s.it}`);
    const lw = 9;
    s.per.forEach((p, r) => { const y = Y + 12 + r*22;
      el("text", {x: 20, y: y + 12, "font-size": 12}, `sor ${r} (${LN[r]})`);
      for (let q = 0; q < 32; q++) el("rect", {x: 110 + q*lw, y, width: lw - 1, height: 14, fill: q < p.length ? css("--fg") : css("--cell"), stroke: css("--muted"), "stroke-width": 0.4});
      const sec = new Set(p.map(x => Math.floor(x / 4))).size;
      el("text", {x: 110 + 32*lw + 8, y: y + 12, "font-size": 12}, p.length ? `${p.length}/32 aktív, ${sec} szektor` : "nincs több elem (a warp a redukcióra vár)"); });
  }
}
function reload(){
  const t = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), e = document.getElementById("err");
  if (t.length < 1 || t.length > 32 || t.some(x => !Number.isInteger(x) || x < 0 || x > 128) || t.every(x => x === 0) || t.reduce((a, b) => a + b, 0) > 512) { e.textContent = "1–32 sorhossz (0–128), összesen legfeljebb 512."; return; }
  e.textContent = ""; LN = t; setSteps(mk(LN, document.getElementById("kern").value));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
