<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Row-major és column-major nézet a cuBLAS-hívásban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="opn" type="checkbox" onchange="OPN=this.checked;render(STEPS[k])"> OP_N-re váltás a W-n (hibás hívás)</label><span class="small">A 3. lépéstől egy Y-cellára kattintva kiemelődik a W-sor és az X-sor.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az X, a W és az Y memóriája egy-egy lineáris sorként, alatta a row-major és a column-major mátrixnézet ugyanazokkal a cellasorszámokkal; a cuBLAS Yᵀ = W·Xᵀ-t számol m = 4, n = 2, k = 3, lda = 3, ldb = 3, ldc = 4 paraméterekkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">FP32, cublasSgemm, a bias külön kernelben. Mintaadat: N = 2, K = 3, M = 4 (egész értékű, rögzített seed). A cellákban a memóriabeli sorszám.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"stage": 1, "line": -1, "msg": "1/4 – X (N×K = 2×3) memóriája egyetlen sor: x00 x01 x02 | x10 x11 x12. Row-major 2×3-ként olvasva X, column-major 3×2-ként (ldb = K = 3) olvasva Xᵀ: az oszlopok X sorai."}, {"stage": 2, "line": 1, "msg": "2/4 – W (M×K = 4×3) memóriája column-major 3×4-ként (lda = K = 3) Wᵀ; a CUBLAS_OP_T ezt transzponálja vissza, így a szorzásban W (4×3) vesz részt."}, {"stage": 3, "line": 2, "msg": "3/4 – Yᵀ = W · Xᵀ: az Yᵀ (m, n) eleme a W m-edik sorának és az X n-edik sorának skaláris szorzata. Kattintson egy Y-cellára!"}, {"stage": 4, "line": 3, "msg": "4/4 – A cuBLAS az Yᵀ-t column-major 4×2-ként írja (ldc = M = 4); ugyanez a memória row-major 2×4-ként éppen Y = X·Wᵀ. Paraméterek: m = 4, n = 2, k = 3, lda = 3, ldb = 3, ldc = 4."}];
const CODE = ["// row-major Y = X·Wᵀ  ⇔  column-major Yᵀ = W·Xᵀ", "cublasSgemm(h, CUBLAS_OP_T, CUBLAS_OP_N,", "            /*m=*/M, /*n=*/N, /*k=*/K, &alpha, d_W, /*lda=*/K, d_X, /*ldb=*/K,", "            &beta, d_Y, /*ldc=*/M);     // M=4, N=2, K=3"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"X": [[3.0, 1.0, 1.0], [3.0, 1.0, 2.0]], "W": [[2.0, -2.0, -3.0], [-1.0, -2.0, 3.0], [3.0, -3.0, 0.0], [2.0, -3.0, 2.0]], "Y": [[1.0, -2.0, 6.0, 5.0], [-2.0, 1.0, 6.0, 7.0]]};
let SEL = [0, 1];            // kiválasztott Y-elem (n, m)
let OPN = false;
const CW = 30;
function cell(x, y, txt, opt){
  opt = opt || {};
  el("rect", {x, y, width: CW, height: CW, fill: opt.hl ? css("--cellhl") : css("--cell"),
              stroke: css("--line"), "stroke-width": opt.bold ? 3 : 1, "stroke-dasharray": opt.dash ? "5 3" : "",
              style: opt.click ? "cursor:pointer" : "", "data-n": opt.n, "data-m": opt.m});
  const t = el("text", {x: x + CW/2, y: y + CW/2 + 4, "text-anchor": "middle", "font-size": opt.fs || 12}, txt);
  if (opt.click) t.setAttribute("style", "pointer-events:none");
}
function memrow(x, y, names, label, hl){
  el("text", {x: x - 8, y: y + 20, "text-anchor": "end", "font-size": 13}, label);
  names.forEach((nm, i) => { cell(x + i*CW, y, nm, {fs: 11, hl: hl && hl.includes(i)});
    el("text", {x: x + i*CW + CW/2, y: y - 4, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(i)); });
}
function grid(x, y, R, C, idx, dash, title, hl){
  for (let i = 0; i < R; i++) for (let j = 0; j < C; j++) {
    const k = idx(i, j); cell(x + j*CW, y + i*CW, String(k), {dash, hl: hl && hl.includes(k), fs: 12});
  }
  el("text", {x: x + C*CW/2, y: y + R*CW + 15, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, title);
}
function render(s){
  svg.setAttribute("viewBox", "0 0 780 640");
  svg.innerHTML = "";
  const [n, m] = SEL;
  const xh = s.stage >= 3 ? [3*n, 3*n+1, 3*n+2] : null;
  const wh = s.stage >= 3 ? [3*m, 3*m+1, 3*m+2] : null;
  const yh = s.stage >= 3 ? [n*4 + m] : null;
  // X sáv
  memrow(110, 22, ["x00","x01","x02","x10","x11","x12"], "X memória", xh);
  grid(330, 8, 2, 3, (i,j) => i*3+j, false, "row-major 2×3 = X", xh);
  grid(460, 8, 3, 2, (i,j) => j*3+i, true, "column-major 3×2 = Xᵀ", xh);
  el("text", {x: 540, y: 40, "font-size": 13}, "ldb = K = 3,  OP_N");
  if (s.stage >= 2) {
    const ty = 140;
    memrow(110, ty + 14, ["w00","w01","w02","w10","w11","w12","w20","w21","w22","w30","w31","w32"].slice(0, 12), "", wh);
    el("text", {x: 102, y: ty + 34, "text-anchor": "end", "font-size": 13}, "W memória");
    grid(110, ty + 62, 4, 3, (i,j) => i*3+j, false, "row-major 4×3 = W", wh);
    grid(240, ty + 62, 3, 4, (i,j) => j*3+i, true, "column-major 3×4 = Wᵀ", wh);
    el("text", {x: 380, y: ty + 90, "font-size": 13}, "lda = K = 3");
    el("text", {x: 380, y: ty + 110, "font-size": 13}, OPN ? "OP_N: op(A) = 4×3 column-major?" : "OP_T → W (4×3)");
    if (OPN) {
      el("text", {x: 380, y: ty + 132, "font-size": 12, fill: css("--hl2")}, "lda = 3 < m = 4 → CUBLAS_STATUS_INVALID_VALUE");
      el("text", {x: 380, y: ty + 150, "font-size": 12, fill: css("--hl2")}, "(ha K = M lenne: nincs hiba, csendben rossz eredmény)");
    }
  }
  if (s.stage >= 3) {
    const ty = 372;
    el("text", {x: 20, y: ty, "font-size": 13}, "Y (row-major 2×4), kattintható:");
    for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) {
      const v = D.Y[i][j];
      cell(20 + j*CW, ty + 10 + i*CW, String(v).replace("-", "−"), {click: true, n: i, m: j, bold: i === n && j === m, hl: i === n && j === m});
    }
    const wr = D.W[m].map(v => String(v).replace("-", "−")).join(", ");
    const xr = D.X[n].map(v => String(v).replace("-", "−")).join(", ");
    el("text", {x: 20, y: ty + 96, "font-size": 13}, `Yᵀ[${m}][${n}] = Y[${n}][${m}] = W[${m},:] · X[${n},:]`);
    el("text", {x: 20, y: ty + 116, "font-size": 13}, `= (${wr}) · (${xr}) = ${String(D.Y[n][m]).replace("-", "−")}`);
  }
  if (s.stage >= 4) {
    memrow(470, 382, ["y00","y01","y02","y03","y10","y11","y12","y13"], "Y memória", yh);
    grid(470, 425, 4, 2, (i,j) => j*4+i, true, "column-major 4×2 = Yᵀ (ldc = 4)", yh);
    grid(560, 425, 2, 4, (i,j) => i*4+j, false, "row-major 2×4 = Y", yh);
    const ty = 582;
    el("rect", {x: 20, y: ty, width: 740, height: 50, fill: "none", stroke: css("--line"), "stroke-width": 2});
    el("text", {x: 30, y: ty + 20, "font-size": 13, "font-family": "monospace"}, "Yᵀ (4×2) = W (4×3) · Xᵀ (3×2):  cublasSgemm(h, OP_T, OP_N,");
    el("text", {x: 30, y: ty + 40, "font-size": 13, "font-family": "monospace"}, "m=4, n=2, k=3, lda=3, ldb=3, ldc=4)   column-major 4×2 = Yᵀ ⇔ row-major 2×4 = Y");
  }
  svg.querySelectorAll("rect[data-n]").forEach(r => {
    if (r.getAttribute("data-n") === "undefined") return;
    r.addEventListener("click", () => { SEL = [+r.getAttribute("data-n"), +r.getAttribute("data-m")]; render(STEPS[k]); });
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
