<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Három olvasói út a könyv hét részén</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--line:#000;--code:#f3f3f3;--fillA:#404040;--grid:#bbb}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--line:#ddd;--code:#2a2a2a;--fillA:#cfcfcf;--grid:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.col{cursor:pointer}
.col:focus{outline:none}
.col:focus rect.hd{stroke:var(--hl);stroke-width:3}
#info{background:var(--code);padding:6px 10px;min-height:4.2em;font-size:13px}
#info ol{margin:2px 0 0 18px;padding:0}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Olvasói utak kiválasztása">
  <label><input type="checkbox" id="cA" checked> A – CUDA-alkalmazásfejlesztő</label>
  <label><input type="checkbox" id="cB" checked> B – teljesítménymérnök</label>
  <label><input type="checkbox" id="cC" checked> C – heterogén platformok / ML</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 712 340" role="img" aria-label="Táblázatszerű térkép: három sor (olvasói utak), hét oszlop (részek); kitöltött cellák jelölik, melyik út melyik részt használja."></svg>
<div id="info" aria-live="polite">Mutass egy rész oszlopára (vagy Tab-bal lépj rá), és itt megjelennek a rész fejezetei.</div>
<p class="small">Javasolt sorrend; az utak kombinálhatók. A „Kiválasztott utak uniója” sor a bejelölt utak által érintett összes részt mutatja.</p>
<script>
const D = {"parts": [{"r": "I", "t": "Alapok és GPU-architektúra", "ch": ["Előszó és olvasói útmutató", "A GPGPU térképe és a CUDA ökoszisztéma", "GPU-architektúra: SIMT, warp, SM és memória", "CUDA fejlesztőkörnyezet és az első kernel", "CUDA execution model: thread, block, grid és warp"]}, {"r": "II", "t": "CUDA programozási modell", "ch": ["Kernelírás, indexelés és launch konfiguráció", "Memóriaterek: global, shared, local, constant és texture", "Szinkronizáció, atomics és warp intrinsics", "Cooperative groups, thread block clusters és grid sync", "Hibakezelés, debugging és compute-sanitizer"]}, {"r": "III", "t": "Teljesítmény és memória", "ch": ["Coalescing, bank conflicts és vectorizált hozzáférés", "Occupancy, register pressure és latency hiding", "Roofline, sávszélesség és compute intensity", "Shared memory tiling, async copy és pipelining", "Cache, L2, persistence és memóriamodellek"]}, {"r": "IV", "t": "Párhuzamos algoritmusok", "ch": ["Redukciók, scan és histogram", "Rendezés, keresés és selection", "Stencil, PDE és iteratív megoldók", "Sparse és dense lineáris algebra", "FFT, Monte Carlo és random számok", "Párhuzamos minták és teljesítménymodellek"]}, {"r": "V", "t": "CUDA-ökoszisztéma és mélytanulás", "ch": ["Könyvtárak: cuBLAS, cuSPARSE, cuFFT, cuRAND, Thrust, CUB", "CUTLASS, tensor cores és mixed precision", "Deep learning kernelek: GEMM, conv és attention", "Streams, events, CUDA graphs és aszinkron végrehajtás", "Multi-GPU, NCCL, NVLink és unified memory"]}, {"r": "VI", "t": "TPU, OpenCL és más modellek", "ch": ["TPU architektúra és XLA", "JAX és TPU programozás", "OpenCL programozási modell", "OpenCL kernelek, memória és hordozhatóság"]}, {"r": "VII", "t": "Mérnökség és záróprojekt", "ch": ["Profilozás, benchmarkolás és energia", "Numerikus pontosság, determinizmus és hordozhatóság", "Záróprojekt: optimalizált GPGPU rendszer"]}], "paths": [{"key": "A", "name": "A – CUDA-alkalmazásfejlesztő", "topics": {"I": "alapok", "II": "prog. modell, hibakeresés", "V": "könyvtárak"}, "lines": {"I": ["alapok"], "II": ["prog. modell,", "hibakeresés"], "V": ["könyvtárak"]}, "label": ["A: alkalmazás-", "fejlesztő"]}, {"key": "B", "name": "B – teljesítménymérnök", "topics": {"I": "alapok", "II": "prog. modell", "III": "memóriahozzáférés, occupancy", "IV": "párhuzamos algoritmusok", "V": "tensor core, streamek", "VII": "profilozás, benchmark"}, "lines": {"I": ["alapok"], "II": ["prog. modell"], "III": ["memória-", "hozzáférés,", "occupancy"], "IV": ["párhuzamos", "algoritmusok"], "V": ["tensor core,", "streamek"], "VII": ["profilozás,", "benchmark"]}, "label": ["B: teljesít-", "ménymérnök"]}, {"key": "C", "name": "C – heterogén platformok / ML", "topics": {"I": "közös fogalmak", "V": "NVIDIA-ökoszisztéma", "VI": "TPU, OpenCL", "VII": "hordozhatóság, pontosság"}, "lines": {"I": ["közös", "fogalmak"], "V": ["NVIDIA-öko-", "szisztéma"], "VI": ["TPU,", "OpenCL"], "VII": ["hordozható-", "ság, pontos-", "ság"]}, "label": ["C: heterogén", "platform / ML"]}]};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(p||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const X0 = 118, CW = 84, RH = 58, Y0 = 78;
let focusPart = -1;
function pattern(){
  const defs = el("defs", {});
  const h = el("pattern", {id: "hB", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, undefined, defs);
  el("rect", {width: 8, height: 8, fill: css("--cell")}, undefined, h);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 8, stroke: css("--line"), "stroke-width": 2.2}, undefined, h);
  const d = el("pattern", {id: "hC", width: 7, height: 7, patternUnits: "userSpaceOnUse"}, undefined, defs);
  el("rect", {width: 7, height: 7, fill: css("--cell")}, undefined, d);
  el("circle", {cx: 3.5, cy: 3.5, r: 1.3, fill: css("--line")}, undefined, d);
}
function wrapText(x, y, s, size, maxw, attrs){
  const words = s.split(" "), lines = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (t.length * size * 0.55 > maxw && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  const y0 = y - (lines.length - 1) * size * 0.55;
  lines.forEach((l, i) => el("text", Object.assign({x: x, y: y0 + i * size * 1.1, "text-anchor": "middle", "font-size": size}, attrs || {}), l));
}
function draw(){
  const sel = D.paths.filter(p => document.getElementById("c" + p.key).checked);
  svg.innerHTML = ""; pattern();
  const fills = {A: css("--fillA"), B: "url(#hB)", C: "url(#hC)"};
  D.parts.forEach((p, j) => {
    const g = el("g", {class: "col", tabindex: 0, role: "button", "aria-label": p.r + ". rész: " + p.t});
    el("rect", {class: "hd", x: X0 + j * CW + 2, y: 4, width: CW - 4, height: Y0 - 10, fill: j === focusPart ? css("--code") : "none", stroke: css("--grid"), rx: 4}, undefined, g);
    el("text", {x: X0 + j * CW + CW / 2, y: 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, p.r + ". rész", g);
    const tt = el("title", {}, p.t, g);
    g.addEventListener("mouseenter", () => info(j)); g.addEventListener("focus", () => info(j)); g.addEventListener("click", () => info(j));
    wrapTextG(g, X0 + j * CW + CW / 2, 36, p.t, 9.5, CW - 6);
  });
  D.paths.forEach((p, i) => {
    const y = Y0 + i * RH, on = sel.includes(p);
    p.label.forEach((l, i) => el("text", {x: 6, y: y + RH / 2 + 5 + (i - (p.label.length - 1) / 2) * 16, "font-size": 13, "font-weight": "bold", opacity: on ? 1 : 0.35}, l));
    D.parts.forEach((q, j) => {
      const x = X0 + j * CW, has = q.r in p.topics && on;
      el("rect", {x: x + 3, y: y + 3, width: CW - 6, height: RH - 6, fill: has ? fills[p.key] : css("--cell"), stroke: has ? css("--line") : css("--grid"), "stroke-width": has ? 1.6 : 1, "stroke-dasharray": has ? "" : "3 3", rx: 3});
      if (has) {
        const L = p.lines[q.r], hh = L.length * 12 + 4;
        if (p.key !== "A") el("rect", {x: x + 6, y: y + RH / 2 - hh / 2, width: CW - 12, height: hh, fill: css("--bg"), opacity: 0.9, rx: 3});
        L.forEach((l, i) => el("text", {x: x + CW / 2, y: y + RH / 2 + 4 + (i - (L.length - 1) / 2) * 12, "text-anchor": "middle", "font-size": 10.5, fill: p.key === "A" ? css("--bg") : css("--fg")}, l));
      }
    });
  });
  const yU = Y0 + 3 * RH + 10, used = new Set();
  sel.forEach(p => Object.keys(p.topics).forEach(r => used.add(r)));
  el("text", {x: 6, y: yU + 22, "font-size": 12}, "Kiválasztott utak");
  el("text", {x: 6, y: yU + 37, "font-size": 12}, "uniója:");
  D.parts.forEach((q, j) => {
    const x = X0 + j * CW, u = used.has(q.r);
    el("rect", {x: x + 3, y: yU + 6, width: CW - 6, height: 36, fill: u ? css("--hl") : css("--cell"), opacity: u ? 0.8 : 1, stroke: css("--grid"), rx: 3});
    el("text", {x: x + CW / 2, y: yU + 29, "text-anchor": "middle", "font-size": 13, fill: u ? css("--bg") : css("--muted")}, u ? "olvasandó" : "–");
  });
  const nm = sel.map(p => p.key).join(" + ") || "nincs kiválasztott út";
  const list = D.parts.filter(q => used.has(q.r)).map(q => q.r).join(", ");
  document.getElementById("status").textContent = sel.length ? `${nm}: érintett részek ${list} (${used.size} a 7-ből)` : "Nincs kiválasztott út.";
}
function wrapTextG(g, x, y, s, size, maxw){
  const words = s.split(" "), lines = []; let cur = "";
  words.forEach(w => { const t = cur ? cur + " " + w : w; if (t.length * size * 0.55 > maxw && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  lines.slice(0, 3).forEach((l, i) => el("text", {x: x, y: y + i * size * 1.15, "text-anchor": "middle", "font-size": size, fill: css("--muted")}, l, g));
}
function info(j){
  focusPart = j; const p = D.parts[j];
  const who = D.paths.filter(q => p.r in q.topics).map(q => q.key + " (" + q.topics[p.r] + ")").join("; ");
  document.getElementById("info").innerHTML = `<b>${p.r}. rész – ${p.t}</b> · utak: ${who || "–"}<ol>` + p.ch.map(c => `<li>${c.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</li>`).join("") + "</ol>";
  draw();
}
["A", "B", "C"].forEach(k => document.getElementById("c" + k).addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
