<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D rács leképezése lineáris memóriára</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>W <input type="range" id="W" min="1" max="16" value="3" style="width:90px"></label><label>H <input type="range" id="H" min="1" max="16" value="5" style="width:90px"></label><label>blokk x <input type="range" id="bx" min="1" max="8" value="2" style="width:70px"></label><label>blokk y <input type="range" id="by" min="1" max="8" value="2" style="width:70px"></label><label>pitch <input type="range" id="ld" min="3" max="20" step="1" value="4" style="width:90px"> <span id="ldv" class="small"></span></label><label>nézet <select id="view"><option value="2d" selected>2D példa</option><option value="3d">3D (2 × 3 × 4)</option><option value="hd">önellenőrző: 1920 × 1080</option></select></label><svg width="0" height="0" style="position:absolute"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5"/></pattern></defs></svg><style>.ctl:first-child{display:none}</style></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A (2,3) szál a row-major sorban a 11., column-majorban a 13., 16 bájtos pitch mellett a 14. elemre esik"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kattints egy nem tétlen szálra a rácson. A pitch float-elemben (ld), bájtban 4 · ld. Kis példa; a coalescing: a szomszédos threadIdx.x → szomszédos ix → szomszédos címek row-majorban.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": 2}];
const CODE = ["int ix = blockIdx.x * blockDim.x + threadIdx.x;", "int iy = blockIdx.y * blockDim.y + threadIdx.y;", "if (ix < W && iy < H) {", "    idx = iy * W + ix;            // row-major", "    idx = ix * H + iy;            // column-major", "    idx = iy * ld + ix;           // pitch: ld = pitch / sizeof(float)", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SEL = [2, 3];
function C(){ const g = id => +document.getElementById(id).value; return {W: g("W"), H: g("H"), bx: g("bx"), by: g("by"), ld: Math.max(g("ld"), g("W")), mode: document.getElementById("view").value}; }
function render(s){
  const c = C(); svg.innerHTML = "";
  document.getElementById("ldv").textContent = c.ld + " float = " + (4 * c.ld) + " B";
  if (c.mode === "hd") return renderHD();
  if (c.mode === "3d") return render3D(c);
  const GX = Math.ceil(c.W / c.bx), GY = Math.ceil(c.H / c.by), TW = GX * c.bx, TH = GY * c.by;
  if (SEL[0] >= c.W) SEL[0] = c.W - 1; if (SEL[1] >= c.H) SEL[1] = c.H - 1;
  const cs = Math.min(30, 260 / Math.max(TW, TH)), mx = 20, my = 24;
  const bandN = Math.max(c.W * c.H, c.ld * c.H), bw = Math.min(30, 600 / bandN), y0 = my + TH * cs + 30;
  svg.setAttribute("viewBox", "0 0 640 " + (y0 + 3 * 60 + 10));
  for (let ty = 0; ty < TH; ty++) for (let tx = 0; tx < TW; tx++) {
    const idle = tx >= c.W || ty >= c.H, sel = tx === SEL[0] && ty === SEL[1], x = mx + tx * cs, y = my + ty * cs;
    const r = el("rect", {x: x, y: y, width: cs, height: cs, fill: idle ? css("--bg") : (sel ? css("--hl") : css("--cell")), "fill-opacity": sel ? 0.6 : 1, stroke: css("--line"), "stroke-width": sel ? 3 : 0.6, "stroke-dasharray": idle ? "3 2" : "none", style: idle ? "" : "cursor:pointer"});
    if (idle) { el("line", {x1: x + 3, y1: y + 3, x2: x + cs - 3, y2: y + cs - 3, stroke: css("--muted")}); el("line", {x1: x + cs - 3, y1: y + 3, x2: x + 3, y2: y + cs - 3, stroke: css("--muted")}); }
    else { r.addEventListener("click", () => { SEL = [tx, ty]; show(k); }); if (cs >= 26) el("text", {x: x + cs / 2, y: y + cs / 2 + 4, "text-anchor": "middle", "font-size": 9, "pointer-events": "none"}, tx + "," + ty); }
  }
  for (let b = 0; b <= GX; b++) el("line", {x1: mx + b * c.bx * cs, y1: my, x2: mx + b * c.bx * cs, y2: my + TH * cs, stroke: css("--line"), "stroke-width": 2.2});
  for (let b = 0; b <= GY; b++) el("line", {x1: mx, y1: my + b * c.by * cs, x2: mx + TW * cs, y2: my + b * c.by * cs, stroke: css("--line"), "stroke-width": 2.2});
  const ix = SEL[0], iy = SEL[1], bxi = Math.floor(ix / c.bx), byi = Math.floor(iy / c.by);
  const rm = iy * c.W + ix, cm = ix * c.H + iy, pm = iy * c.ld + ix;
  const tx0 = mx + TW * cs + 24;
  const lines = [`grid = (${GX}, ${GY}), blokk ${c.bx} × ${c.by}; tétlen szál: ${TW * TH - c.W * c.H}`,
    `blockIdx = (${bxi}, ${byi}), threadIdx = (${ix - bxi * c.bx}, ${iy - byi * c.by})`,
    `ix = ${bxi}·${c.bx} + ${ix - bxi * c.bx} = ${ix},  iy = ${byi}·${c.by} + ${iy - byi * c.by} = ${iy}`,
    `row-major:    ${iy}·${c.W} + ${ix} = ${rm}`, `column-major: ${ix}·${c.H} + ${iy} = ${cm}`,
    `pitch:        ${iy}·${c.ld} + ${ix} = ${pm}  (${pm * 4} B)`];
  lines.forEach((t, i) => el("text", {x: tx0, y: my + 14 + i * 20, "font-size": 12.5, "font-family": "ui-monospace,monospace"}, t));
  const bands = [["row-major", c.W * c.H, i => [i % c.W, Math.floor(i / c.W)], rm], ["column-major", c.W * c.H, i => [Math.floor(i / c.H), i % c.H], cm], ["pitch", c.ld * c.H, i => (i % c.ld) < c.W ? [i % c.ld, Math.floor(i / c.ld)] : null, pm]];
  bands.forEach((b, j) => { const y = y0 + j * 60;
    el("text", {x: 20, y: y - 6, "font-size": 12}, b[0]);
    for (let i = 0; i < b[1]; i++) { const v = b[2](i), on = i === b[3];
      el("rect", {x: 20 + i * bw, y: y, width: bw, height: 26, fill: v === null ? "url(#hatch)" : (on ? css("--hl") : css("--cell")), "fill-opacity": on ? 0.6 : 1, stroke: css("--line"), "stroke-width": on ? 3 : 0.5});
      if (bw >= 26 && v) el("text", {x: 20 + i * bw + bw / 2, y: y + 17, "text-anchor": "middle", "font-size": 9}, v[0] + "," + v[1]);
      if (on || (bw >= 14 && i % 5 === 0)) el("text", {x: 20 + i * bw + bw / 2, y: y + 40, "text-anchor": "middle", "font-size": 10, fill: on ? css("--fg") : css("--muted"), "font-weight": on ? "bold" : "normal"}, String(i)); }
  });
  document.getElementById("status").textContent = `(${ix}, ${iy}) elem: row-major ${rm}, column-major ${cm}, pitch-csel ${pm} (${pm * 4} bájt).`;
}
function render3D(c){
  const D = 2, H = 3, W = 4; svg.setAttribute("viewBox", "0 0 640 250");
  el("text", {x: 20, y: 20, "font-size": 13, "font-weight": "bold"}, "3D: D × H × W = 2 × 3 × 4,  idx = (iz · H + iy) · W + ix");
  for (let z = 0; z < D; z++) { el("text", {x: 20 + z * 250, y: 50, "font-size": 12}, "iz = " + z);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const idx = (z * H + y) * W + x;
      el("rect", {x: 20 + z * 250 + x * 50, y: 60 + y * 50, width: 46, height: 46, fill: idx === 23 ? css("--hl") : css("--cell"), "fill-opacity": idx === 23 ? 0.6 : 1, stroke: css("--line")});
      el("text", {x: 43 + z * 250 + x * 50, y: 89 + y * 50, "text-anchor": "middle", "font-size": 13}, String(idx)); } }
  el("text", {x: 20, y: 240, "font-size": 12.5}, "például (ix, iy, iz) = (3, 2, 1): (1 · 3 + 2) · 4 + 3 = 23; az ix a leggyorsabban változó index");
  document.getElementById("status").textContent = "3D nézet: (3, 2, 1) → (1·3 + 2)·4 + 3 = 23.";
}
function renderHD(){
  svg.setAttribute("viewBox", "0 0 640 230");
  const GX = Math.ceil(1920 / 16), GY = Math.ceil(1080 / 16), s = 600 / (GX * 16);
  el("rect", {x: 20, y: 20, width: 1920 * s, height: GY * 16 * s, fill: "url(#hatch)", stroke: css("--line")});
  el("rect", {x: 20, y: 20, width: 1920 * s, height: 1080 * s, fill: css("--cell"), stroke: css("--line")});
  el("text", {x: 320, y: 20 + 540 * s, "text-anchor": "middle", "font-size": 14}, "1920 × 1080 kép, blokk 16 × 16");
  el("text", {x: 20, y: 20 + GY * 16 * s + 22, "font-size": 13}, `grid = (⌈1920/16⌉, ⌈1080/16⌉) = (${GX}, ${GY}); az utolsó sorblokk (blockIdx.y = ${GY - 1}) iy = ${(GY - 1) * 16}–${GY * 16 - 1}`);
  el("text", {x: 20, y: 20 + GY * 16 * s + 42, "font-size": 13}, `tétlen sorok: 1080–${GY * 16 - 1} (${GY * 16 - 1080} sor, ${(GY * 16 - 1080) * 1920} szál, sraffozva); oszlopirányban nincs tétlen szál`);
  document.getElementById("status").textContent = `Önellenőrző kérdés: grid ${GX} × ${GY}, tétlen sorok 1080–${GY * 16 - 1} (${GY * 16 - 1080} sor).`;
}
["W", "H", "bx", "by", "ld"].forEach(id => document.getElementById(id).addEventListener("input", () => { if (id === "W") document.getElementById("ld").min = document.getElementById("W").value; show(k); }));
document.getElementById("view").addEventListener("change", () => show(k));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
