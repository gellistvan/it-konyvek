<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redukció: fa, shuffle, blokk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód: <select id="mode" onchange="rebuild()" aria-label="Mód"><option value="fa" selected>fa (shared)</option><option value="shuffle">shuffle (warp)</option><option value="blokk">blokk</option></select></label><label>saját bemenet: <input id="inp" value="3, 1, 7, 0, 4, 1, 6, 3" size="26" aria-label="Saját bemenet"></label><button onclick="rebuild()">Betöltés</button><button onclick="document.getElementById('inp').value=Array.from({length:32},(_, i)=>i).join(', ');document.getElementById('mode').value='shuffle';rebuild()">Példa: val = lane</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc elem három szinten egyetlen összeggé redukálódik; 32 sáv öt shuffle-lépésben; nyolc warpösszeg a shared memórián át az első warpba kerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">blockDim.x = 256, warp = 32, FP32. Shuffle módban a 32-nél rövidebb bemenetet 0-val töltjük fel (a fejezet javaslata szerint). Kezdőállapot: a 16.1 fa-példája.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Bemenet: sdata = [3, 1, 7, 0, 4, 1, 6, 3] (8 szál).", "line": 0, "mode": "fa", "arr": [3, 1, 7, 0, 4, 1, 6, 3], "s": 0, "n": 8}, {"msg": "s = 4, aktív szálak: 0–3, részösszegek: [7, 2, 13, 3]", "line": 1, "mode": "fa", "arr": [7, 2, 13, 3, 4, 1, 6, 3], "s": 4, "n": 8}, {"msg": "s = 2, aktív szálak: 0–1, részösszegek: [20, 5]", "line": 1, "mode": "fa", "arr": [20, 5, 13, 3, 4, 1, 6, 3], "s": 2, "n": 8}, {"msg": "s = 1, aktív szálak: 0, részösszegek: [25] – a blokk összege sdata[0] = 25.", "line": 1, "mode": "fa", "arr": [25, 5, 13, 3, 4, 1, 6, 3], "s": 1, "n": 8}];
const CODE = ["sdata[tid] = in[i]; __syncthreads();", "for (s = blockDim.x / 2; s > 0; s >>= 1) { if (tid < s) sdata[tid] += sdata[tid + s]; __syncthreads(); }", "for (offset = 16; offset > 0; offset >>= 1) val += __shfl_down_sync(0xffffffff, val, offset);", "if (lane == 0) sdata[warpId] = val;  __syncthreads();", "if (warpId == 0) { val = (lane < numWarps) ? sdata[lane] : 0; val = warpReduceSum(val); }", "if (lane == 0) g_odata[blockIdx.x] = val;"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function treeLv(a){ a = a.slice(); const lv = [[0, a.slice()]]; for (let s = a.length >> 1; s > 0; s >>= 1){ for (let t = 0; t < s; t++) a[t] += a[t + s]; lv.push([s, a.slice()]); } return lv; }
function shuf(v){ v = v.slice(); const rows = [[0, v.slice()]]; for (let off = 16; off > 0; off >>= 1){ v = v.map((x, l) => x + (l + off < 32 ? v[l + off] : x)); rows.push([off, v.slice()]); } return rows; }
function stepsTree(a){
  const lv = treeLv(a), out = [{msg: "Bemenet: sdata = [" + a.join(", ") + "] (" + a.length + " szál).", line: 0, mode: "fa", arr: lv[0][1], s: 0, n: a.length}];
  lv.slice(1).forEach(([s, arr]) => out.push({msg: "s = " + s + ", aktív szálak: " + (s > 1 ? "0–" + (s - 1) : "0") + ", részösszegek: [" + arr.slice(0, s).join(", ") + "]", line: 1, mode: "fa", arr: arr, s: s, n: a.length}));
  out[out.length - 1].msg += " – a blokk összege sdata[0] = " + lv[lv.length - 1][1][0] + ".";
  return out;
}
function stepsShuf(v){
  const rows = shuf(v);
  return rows.map(([off, arr], r) => ({msg: off ? "offset = " + off + ": a(z) 0–" + (off - 1) + ". sáv hozzáadja a lane + " + off + " értékét; 0. sáv: " + arr[0] + (r === 5 ? " = a warp összege." : ".") : "Kezdőállapot: val = [" + arr.join(", ") + "].", line: off ? 2 : 0, mode: "shuffle", arr: arr, off: off, prev: r ? rows[r - 1][1] : arr}));
}
function stepsBlock(){
  const W = []; for (let w = 0; w < 8; w++){ let s = 0; for (let t = 32 * w; t < 32 * w + 32; t++) s += t; W.push(s); }
  const tot = W.reduce((x, y) => x + y, 0), out = [];
  out.push({msg: "val = tid (0–255); minden warp a saját 32 értékét redukálja shuffle-lel (5 lépés).", line: 2, mode: "blokk", ph: 0, W: W, tot: tot});
  out.push({msg: "A warpok 0. szálai: sdata[warpId] = warpösszeg; __syncthreads(). sdata = [" + W.join(", ") + "].", line: 3, mode: "blokk", ph: 1, W: W, tot: tot});
  out.push({msg: "Az első warp betölti a 8 warpösszeget (a 8–31. sáv 0), és újra shuffle-redukál.", line: 4, mode: "blokk", ph: 2, W: W, tot: tot});
  out.push({msg: "A 0. szál kiírja: g_odata[blockIdx.x] = " + tot + ".", line: 5, mode: "blokk", ph: 3, W: W, tot: tot});
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  function cell(x, y, w, h, t, on, dim){ el("rect", {x: x, y: y, width: w, height: h, fill: dim ? ch_ : cl, stroke: on ? h2 : (dim ? mu : ln), "stroke-width": on ? 3 : 1, "stroke-dasharray": dim ? "2 2" : "none"}); if (t !== null) el("text", {x: x + w / 2, y: y + h / 2 + 5, "text-anchor": "middle", "font-size": w < 20 ? 9 : 14, fill: dim ? mu : css("--fg")}, String(t)); }
  if (s.mode === "fa"){
    const n = s.n, w = Math.min(60, 560 / n), x0 = (600 - n * w) / 2, live = s.s ? s.s : n;
    el("text", {x: 10, y: 30, "font-size": 13}, s.s ? "s = " + s.s + ": sdata[tid] += sdata[tid + " + s.s + "]" : "bemenet");
    s.arr.forEach((v, i) => { cell(x0 + i * w, 120, w, 44, i < live ? v : null, s.s && i < s.s, i >= live); el("text", {x: x0 + i * w + w / 2, y: 182, "text-anchor": "middle", "font-size": 10, fill: mu}, String(i)); });
    if (s.s) for (let t = 0; t < s.s; t++){ const xa = x0 + (t + s.s) * w + w / 2, xb = x0 + t * w + w / 2; el("path", {d: "M" + xa + " 118 Q " + (xa + xb) / 2 + " " + (60 - 8 * Math.log2(s.s)) + " " + xb + " 118", fill: "none", stroke: hl, "stroke-width": 1.5}); el("circle", {cx: xb, cy: 118, r: 3, fill: hl}); }
  } else if (s.mode === "shuffle"){
    const w = 17.5, x0 = 20;
    el("text", {x: 10, y: 24, "font-size": 13}, s.off ? "offset = " + s.off + " (előtte → utána)" : "val = lane");
    [[s.prev, 60], [s.arr, 170]].forEach(([arr, y], r) => arr.forEach((v, l) => { const mean = !s.off || (r === 0 ? (s.off === 16 || l < 2 * s.off) : l < s.off); cell(x0 + l * w, y, w, 36, mean ? v : null, r === 1 && s.off && l < s.off, !mean); }));
    if (s.off) for (let l = 0; l < s.off; l++) el("line", {x1: x0 + (l + s.off) * w + w / 2, y1: 98, x2: x0 + l * w + w / 2, y2: 168, stroke: hl, "stroke-width": 1});
    for (let l = 0; l < 32; l += 4) el("text", {x: x0 + l * w + w / 2, y: 222, "text-anchor": "middle", "font-size": 10, fill: mu}, String(l));
    el("text", {x: 10, y: 256, "font-size": 12, fill: mu}, "Szürke, szaggatott: a végeredményhez már nem használt sáv.");
    el("text", {x: 10, y: 274, "font-size": 12, fill: mu}, "Ha lane + offset ≥ 32, a szál a saját értékét kapja vissza (a 0. sáv eredményét nem érinti).");
  } else {
    const W = s.W;
    el("text", {x: 10, y: 24, "font-size": 13}, "blokk: 256 szál = 8 warp");
    W.forEach((v, w) => { cell(20 + w * 62, 60, 58, 36, s.ph >= 1 ? v : "warp " + w, s.ph === 0, false); });
    el("text", {x: 20, y: 120, "font-size": 12}, s.ph >= 1 ? "sdata[0..7]" : "warponként shuffle-redukció");
    if (s.ph >= 2){ el("line", {x1: 270, y1: 100, x2: 270, y2: 170, stroke: hl, "stroke-width": 2}); cell(200, 175, 140, 36, s.ph === 3 ? s.tot : "warp 0: shuffle", s.ph === 2, false); }
    if (s.ph === 3) el("text", {x: 350, y: 199, "font-size": 13, "font-weight": "bold"}, "→ g_odata[blockIdx.x] = " + s.tot);
  }
}
function parseIn(){
  const raw = document.getElementById("inp").value.split(/[\s,;]+/).filter(x => x !== "").map(Number);
  if (raw.some(x => !Number.isFinite(x))) return null; return raw;
}
function rebuild(){
  const m = document.getElementById("mode").value, msg = document.getElementById("err");
  msg.textContent = "";
  if (m === "blokk"){ setSteps(stepsBlock()); return; }
  let a = parseIn();
  if (!a){ msg.textContent = "Csak számokat adj meg."; return; }
  if (m === "fa"){ if (![2, 4, 8, 16, 32].includes(a.length)){ msg.textContent = "A fa-módhoz 2, 4, 8, 16 vagy 32 szám kell."; return; } setSteps(stepsTree(a)); }
  else { if (a.length > 32){ msg.textContent = "Legfeljebb 32 szám."; return; } while (a.length < 32) a.push(0); setSteps(stepsShuf(a)); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
