<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCL címterek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl2:#c55a11;--err:#b00020;--cell:#fff;--on:#ffd9b8;--off:#f0f0f0;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl2:#f0a060;--err:#ff6b6b;--cell:#262626;--on:#6a4020;--off:#2a2a2a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl2);font-weight:bold}
#status{margin:4px 0 6px;min-height:3em}
#status.err{color:var(--err)}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
code{font-size:13px}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Work-item kiválasztása">
  <span>Work-item:</span><button data-g="0" aria-pressed="false">0 (WG0)</button><button data-g="1" aria-pressed="false">1 (WG0)</button><button data-g="4" aria-pressed="false">4 (WG1)</button><button data-g="5" aria-pressed="false">5 (WG1)</button>
  <label><input type="checkbox" id="noq"> <code>__global</code> minősítő elhagyása</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 330" role="img" aria-label="A mutatóváltozó a work-item privát memóriájában van, a mutatott puffer a global memóriában; a local memóriát csak a work-group látja."></svg>
<p class="small"><code>__kernel void compute(__global float *a, float b) { int i = get_global_id(0); a[i] = a[i] * b; }</code> – global = 8, local = 4; work-groupononként két work-item látszik. Feltétel: OpenCL C 1.2.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
const SHOWN = [0, 1, 4, 5], LOCAL = 4, ERR = "error: pointer arguments to kernel functions must reside in '__global', '__constant' or '__local' address space";
let sel = 5;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function draw(){
  const L = css("--line"), ON = css("--on"), OFF = css("--off"), A = css("--hl2"), noq = document.getElementById("noq").checked;
  const wg = Math.floor(sel / LOCAL);
  svg.innerHTML = '<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="' + L + '"/></marker></defs>';
  mk("rect", {x: 5, y: 5, width: 450, height: 320, fill: "none", stroke: L, "stroke-width": 1.5});
  mk("text", {x: 12, y: 22, "font-size": 13, "font-weight": "bold"}, "eszköz (device)");
  const cx = {};
  [0, 1].forEach(w => {
    const x0 = 15 + w * 220;
    mk("rect", {x: x0, y: 30, width: 210, height: 170, fill: "none", stroke: L});
    mk("text", {x: x0 + 6, y: 46, "font-size": 12}, "work-group " + w);
    mk("rect", {x: x0 + 8, y: 160, width: 194, height: 32, fill: w === wg ? ON : OFF, stroke: L, "stroke-dasharray": "2 0"});
    mk("text", {x: x0 + 105, y: 181, "text-anchor": "middle", "font-size": 12}, "__local (WG" + w + ")" + (w === wg ? " – látja" : " – nem látja"));
    SHOWN.filter(g => Math.floor(g / LOCAL) === w).forEach((g, j) => {
      const bx = x0 + 8 + j * 90, on = g === sel;
      mk("rect", {x: bx, y: 55, width: 82, height: 95, fill: on ? ON : OFF, stroke: L, "stroke-width": on ? 2.5 : 1});
      mk("text", {x: bx + 41, y: 72, "text-anchor": "middle", "font-size": 12, "font-weight": on ? "bold" : "normal"}, "work-item " + g);
      mk("text", {x: bx + 41, y: 92, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, "__private:");
      mk("text", {x: bx + 41, y: 109, "text-anchor": "middle", "font-size": 11}, "a (mutató)");
      mk("text", {x: bx + 41, y: 125, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, "b = 2.0f");
      mk("text", {x: bx + 41, y: 141, "text-anchor": "middle", "font-size": 11, "font-family": "monospace"}, "i = " + g);
      cx[g] = bx + 41;
    });
    mk("text", {x: x0 + 195, y: 105, "text-anchor": "middle", "font-size": 16}, "…");
  });
  mk("rect", {x: 15, y: 212, width: 430, height: 52, fill: ON, stroke: L});
  mk("text", {x: 22, y: 228, "font-size": 12, "font-family": "monospace"}, "__global");
  for (let k = 0; k < 8; k++) {
    mk("rect", {x: 90 + k * 44, y: 230, width: 44, height: 28, fill: k === sel ? A : css("--cell"), stroke: L});
    mk("text", {x: 112 + k * 44, y: 249, "text-anchor": "middle", "font-size": 12}, "a[" + k + "]");
  }
  mk("rect", {x: 15, y: 274, width: 430, height: 40, fill: ON, stroke: L});
  mk("text", {x: 230, y: 299, "text-anchor": "middle", "font-size": 12}, "__constant – a kernel csak olvassa (🔒)");
  const x1 = cx[sel], x2 = 112 + sel * 44;
  if (x1 !== undefined) {
    mk("line", {x1: x1, y1: 112, x2: x2, y2: 230, stroke: noq ? css("--err") : L, "stroke-width": 2.5, "stroke-dasharray": noq ? "6 4" : "none", "marker-end": "url(#ah)"});
    if (noq) { const mx = (x1 + x2) / 2, my = 171; mk("line", {x1: mx - 12, y1: my - 12, x2: mx + 12, y2: my + 12, stroke: css("--err"), "stroke-width": 4}); mk("line", {x1: mx - 12, y1: my + 12, x2: mx + 12, y2: my - 12, stroke: css("--err"), "stroke-width": 4}); }
  }
  mk("rect", {x: 475, y: 140, width: 75, height: 60, rx: 6, fill: css("--cell"), stroke: L});
  mk("text", {x: 512, y: 175, "text-anchor": "middle", "font-size": 13}, "host");
  mk("line", {x1: 475, y1: 190, x2: 447, y2: 238, stroke: L, "stroke-width": 1.5, "marker-end": "url(#ah)"});
  mk("line", {x1: 490, y1: 200, x2: 447, y2: 294, stroke: L, "stroke-width": 1.5, "marker-end": "url(#ah)"});
  mk("text", {x: 470, y: 320, "font-size": 11}, "API: írás/olvasás");
  const st = document.getElementById("status");
  st.className = noq ? "err" : "";
  st.textContent = noq ? "Fordítási hiba (clBuildProgram, OpenCL C 1.2): " + ERR + ". A minősítetlen pointee __private volna, ami host által átadott pufferre nem értelmezhető."
    : "work-item " + sel + " (WG" + wg + ", local " + (sel % LOCAL) + ") látja: saját __private (a mutatóérték, b = 2.0f), a WG" + wg + " __local memóriáját, a __global puffert és a __constant területet; a WG" + (1 - wg) + " __local memóriáját nem. Az a mutató a[" + sel + "]-ra mutat (i = get_global_id(0)).";
  document.querySelectorAll("button[data-g]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.g === sel ? "true" : "false"));
}
document.querySelectorAll("button[data-g]").forEach(b => b.addEventListener("click", () => { sel = +b.dataset.g; draw(); }));
document.getElementById("noq").addEventListener("change", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
