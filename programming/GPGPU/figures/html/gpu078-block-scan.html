<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Háromlépéses scan</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>bemenet (max. 16): <input id="inp" size="26" value="3, 1, 7, 0, 4, 1, 6, 3" aria-label="Bemenet"></label> <label>blokkméret <select id="bs" onchange="load()"><option>2</option><option selected>4</option><option>8</option></select></label> <label><input id="skip" type="checkbox" onchange="load()"> barrier kihagyása</label> <button onclick="load()">Betöltés</button> <span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A bemenet, a shared memory temp tömbje a Hillis–Steele-szinteken, az exkluzív lokális kimenet, a blokkösszegek és offsetek, majd a végeredmény; a barrierek vastag vonalként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet scan_block_kernel, scan_offset_kernel és scan_add_offset_kernel kódjának átirata. A „barrier kihagyása” mód egy lehetséges hibás interleavinget mutat (a szálak tid szerint sorban olvasnak és írnak), a valós ütemezés ettől eltérhet. Kezdőállapot: y = (3, 1, 7, 0, 4, 1, 6, 3), blokkméret 4.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": "read", "off": 1, "temp": [3, 1, 7, 0, 4, 1, 6, 3], "other": [0, 3, 1, 7, 0, 4, 1, 6], "line": 2, "msg": "offset = 1: minden szál beolvassa temp[tid − 1]-et (tid ≥ 1), majd barrier"}, {"ph": "write", "off": 1, "temp": [3, 4, 8, 7, 4, 5, 7, 9], "line": 4, "msg": "offset = 1: temp[tid] += other → (3, 4, 8, 7, 4, 5, 7, 9); barrier"}, {"ph": "read", "off": 2, "temp": [3, 4, 8, 7, 4, 5, 7, 9], "other": [0, 0, 3, 4, 0, 0, 4, 5], "line": 2, "msg": "offset = 2: minden szál beolvassa temp[tid − 2]-et (tid ≥ 2), majd barrier"}, {"ph": "write", "off": 2, "temp": [3, 4, 11, 11, 4, 5, 11, 14], "line": 4, "msg": "offset = 2: temp[tid] += other → (3, 4, 11, 11, 4, 5, 11, 14); barrier"}, {"ph": "excl", "temp": [3, 4, 11, 11, 4, 5, 11, 14], "out": [0, 3, 4, 11, 0, 4, 5, 11], "line": 7, "msg": "exkluzívra tolás: out = (0, 3, 4, 11, 0, 4, 5, 11)"}, {"ph": "sums", "temp": [3, 4, 11, 11, 4, 5, 11, 14], "out": [0, 3, 4, 11, 0, 4, 5, 11], "sums": [11, 14], "line": 8, "msg": "block_sums = (11, 14)"}, {"ph": "offs", "temp": [3, 4, 11, 11, 4, 5, 11, 14], "out": [0, 3, 4, 11, 0, 4, 5, 11], "sums": [11, 14], "offs": [0, 11], "line": 9, "msg": "block_offsets = exkluzív scan(block_sums) = (0, 11)"}, {"ph": "add", "temp": [3, 4, 11, 11, 4, 5, 11, 14], "out": [0, 3, 4, 11, 0, 4, 5, 11], "sums": [11, 14], "offs": [0, 11], "z": [0, 3, 4, 11, 11, 15, 16, 22], "line": 10, "msg": "z = (0, 3, 4, 11, 11, 15, 16, 22); ellenőrzés: z[7] + y[7] = 25 = Σy, egyezik a soros exkluzív scannel"}];
const CODE = ["temp[tid] = val;  __syncthreads();", "for (offset = 1; offset < blockDim.x; offset <<= 1) {", "    float other = (tid >= offset) ? temp[tid - offset] : 0.0f;   // olvasás", "    __syncthreads();", "    temp[tid] += other;                                          // írás", "    __syncthreads();", "}", "out[idx] = (tid == 0) ? 0.0f : temp[tid - 1];   // exkluzív", "if (tid == blockDim.x - 1) block_sums[blockIdx.x] = temp[tid];", "scan_offset_kernel: block_offsets = exkluzív scan(block_sums)", "scan_add_offset_kernel: out[idx] += block_offsets[blockIdx.x]"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let YIN = [3, 1, 7, 0, 4, 1, 6, 3];
function gv(id){ return +document.getElementById(id).value; }
function trace(y, bs, skip){
  const n = y.length, nb = Math.ceil(n / bs), st = [];
  let temp = []; for (let b = 0; b < nb; b++) for (let t = 0; t < bs; t++) temp.push(b*bs + t < n ? y[b*bs + t] : 0);
  for (let off = 1; off < bs; off <<= 1) {
    const other = temp.map((v, i) => (i % bs) >= off ? temp[i - off] : 0);
    if (!skip) {
      st.push({ph: "read", off, temp: temp.slice(), other, line: 2, msg: `offset = ${off}: minden szál beolvassa temp[tid − ${off}]-et (tid ≥ ${off}), majd barrier`});
      temp = temp.map((v, i) => v + other[i]);
      st.push({ph: "write", off, temp: temp.slice(), line: 4, msg: `offset = ${off}: temp[tid] += other → (${temp.join(", ")}); barrier`});
    } else {
      const rd = [];
      for (let i = 0; i < temp.length; i++) { const t = i % bs; if (t >= off) { rd[i] = temp[i - off]; temp[i] += temp[i - off]; } else rd[i] = 0; }
      st.push({ph: "write", off, temp: temp.slice(), other: rd, line: 4, bad: true, msg: `barrier NÉLKÜL, offset = ${off} (egy lehetséges interleaving: a szálak tid szerint sorban olvasnak és írnak) → (${temp.join(", ")})`});
    }
  }
  const out = temp.map((v, i) => (i % bs) === 0 ? 0 : temp[i - 1]).slice(0, n);
  st.push({ph: "excl", temp: temp.slice(), out, line: 7, msg: `exkluzívra tolás: out = (${out.join(", ")})`});
  const sums = []; for (let b = 0; b < nb; b++) sums.push(temp[b*bs + bs - 1]);
  st.push({ph: "sums", temp: temp.slice(), out, sums, line: 8, msg: `block_sums = (${sums.join(", ")})`});
  const offs = []; let s = 0; sums.forEach(v => { offs.push(s); s += v; });
  st.push({ph: "offs", temp: temp.slice(), out, sums, offs, line: 9, msg: `block_offsets = exkluzív scan(block_sums) = (${offs.join(", ")})`});
  const z = out.map((v, i) => v + offs[Math.floor(i / bs)]);
  const ref = []; let a = 0; y.forEach(v => { ref.push(a); a += v; });
  const ok = z.every((v, i) => v === ref[i]);
  st.push({ph: "add", temp: temp.slice(), out, sums, offs, z, line: 10, msg: `z = (${z.join(", ")}); ellenőrzés: ` + (ok ? `z[${n-1}] + y[${n-1}] = ${z[n-1] + y[n-1]} = Σy, egyezik a soros exkluzív scannel` : `HIBÁS, a helyes: (${ref.join(", ")})`)});
  return st;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 400");
  const d = document.createElementNS(NS, "defs");
  d.innerHTML = `<pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.4"/></pattern>`;
  svg.appendChild(d);
  const bs = gv("bs"), n = YIN.length, nb = Math.ceil(n / bs), cw = Math.min(40, 640 / (nb*bs + nb)), X = i => 100 + i*cw + Math.floor(i / bs) * cw * 0.6;
  function rowv(y, vals, label, hl, cur){
    el("text", {x: 92, y: y + cw*0.6, "text-anchor": "end", "font-size": 12}, label);
    vals.forEach((v, i) => { const h = hl && hl.includes(i);
      el("rect", {x: X(i), y, width: cw - 2, height: cw - 4, fill: h ? "url(#hd)" : css("--cell"), stroke: cur ? css("--hl2") : css("--line"), "stroke-width": cur ? 2 : 1});
      if (h) el("rect", {x: X(i) + cw*0.18, y: y + cw*0.2, width: cw*0.6, height: cw*0.48, fill: css("--bg")});
      el("text", {x: X(i) + cw/2 - 1, y: y + cw*0.6, "text-anchor": "middle", "font-size": Math.min(13, cw*0.45)}, String(v)); });
  }
  for (let b = 0; b < nb; b++) el("text", {x: X(b*bs) + bs*cw/2, y: 22, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, b + ". blokk");
  rowv(30, YIN, "bemenet y", null, false);
  const tl = s.temp.length;
  const upd = []; if (s.off) for (let i = 0; i < tl; i++) if ((i % bs) >= s.off) upd.push(i);
  rowv(100, s.temp, s.ph === "read" ? "temp (olvasás)" : "temp", s.ph === "write" ? upd : null, s.ph === "read" || s.ph === "write");
  if (s.ph === "read" || s.ph === "write") upd.forEach(i => el("line", {x1: X(i - s.off) + cw/2, y1: 100 - 6, x2: X(i) + cw/2, y2: 100 - 1, stroke: s.bad ? css("--hl2") : css("--fg"), "stroke-width": 1.2}));
  if (s.ph === "read") el("text", {x: 100, y: 92, "font-size": 11, fill: css("--muted")}, "other = (" + s.other.join(", ") + ")");
  if (s.ph === "read" || (s.ph === "write" && !s.bad)) el("line", {x1: 96, y1: 100 + cw + 2, x2: X(tl - 1) + cw, y2: 100 + cw + 2, stroke: css("--fg"), "stroke-width": 4});
  if (s.bad) el("text", {x: 100, y: 100 + cw + 16, "font-size": 12, fill: css("--hl2")}, "nincs __syncthreads(): a nagyobb tid már a frissített értéket olvashatja");
  if (s.out) rowv(180, s.out, "exkluzív out", null, s.ph === "excl");
  if (s.sums) { el("text", {x: 92, y: 260 + 16, "text-anchor": "end", "font-size": 12}, "block_sums");
    s.sums.forEach((v, b) => { el("rect", {x: X(b*bs), y: 260, width: bs*cw - 4, height: 22, fill: css("--cellhl"), stroke: css("--line")}); el("text", {x: X(b*bs) + bs*cw/2, y: 276, "text-anchor": "middle", "font-size": 12}, "Σ = " + v + (s.offs ? ", offset = " + s.offs[b] : "")); }); }
  if (s.z) rowv(310, s.z, "végeredmény z", null, true);
}
function load(){
  const t = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number), e = document.getElementById("err");
  if (t.length < 1 || t.length > 16 || t.some(x => !Number.isInteger(x) || Math.abs(x) > 999)) { e.textContent = "1–16 egész szám (|x| < 1000)."; return; }
  e.textContent = ""; YIN = t; setSteps(trace(YIN, gv("bs"), document.getElementById("skip").checked));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
