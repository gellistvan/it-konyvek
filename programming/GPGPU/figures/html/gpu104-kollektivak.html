<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kollektívák négy eszközön</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kollektíva: <select id="op" onchange="buildSteps()"><option value="mind">mind az öt</option><option value="psum">psum</option><option value="pmean">pmean</option><option value="all_gather">all_gather</option><option value="psum_scatter">psum_scatter</option><option value="ppermute">ppermute</option></select></label><label>x = <input id="vec" size="16" value="0, 1, 2, 3" aria-label="bemenetvektor"></label><label>eszközök: <select id="nd"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><button onclick="buildSteps()">Újraszámolás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Eszközönkénti bemenet és eredmény a psum, pmean, all_gather, psum_scatter és ppermute kollektívánál"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">pmap, axis_name='i', FP32. A psum_scatter bemenete eszközönként a teljes x vektor; a ppermute perm = [(i, i+1 mod n)]. Ha a vektor rövidebb az eszközszámnál, 0-val töltjük ki.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"op": "psum", "ph": 1, "inp": [0.0, 1.0, 2.0, 3.0], "out": [6.0, 6.0, 6.0, 6.0], "msg": "psum – 1. bemenet: D0: 0, D1: 1, D2: 2, D3: 3"}, {"op": "psum", "ph": 2, "inp": [0.0, 1.0, 2.0, 3.0], "out": [6.0, 6.0, 6.0, 6.0], "msg": "psum – 2. kommunikáció (all-reduce)"}, {"op": "psum", "ph": 3, "inp": [0.0, 1.0, 2.0, 3.0], "out": [6.0, 6.0, 6.0, 6.0], "msg": "psum – 3. eredmény: D0: 6, D1: 6, D2: 6, D3: 6"}, {"op": "pmean", "ph": 1, "inp": [0.0, 1.0, 2.0, 3.0], "out": [1.5, 1.5, 1.5, 1.5], "msg": "pmean – 1. bemenet: D0: 0, D1: 1, D2: 2, D3: 3"}, {"op": "pmean", "ph": 2, "inp": [0.0, 1.0, 2.0, 3.0], "out": [1.5, 1.5, 1.5, 1.5], "msg": "pmean – 2. kommunikáció (all-reduce)"}, {"op": "pmean", "ph": 3, "inp": [0.0, 1.0, 2.0, 3.0], "out": [1.5, 1.5, 1.5, 1.5], "msg": "pmean – 3. eredmény: D0: 1,5, D1: 1,5, D2: 1,5, D3: 1,5"}, {"op": "all_gather", "ph": 1, "inp": [0.0, 1.0, 2.0, 3.0], "out": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "msg": "all_gather – 1. bemenet: D0: 0, D1: 1, D2: 2, D3: 3"}, {"op": "all_gather", "ph": 2, "inp": [0.0, 1.0, 2.0, 3.0], "out": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "msg": "all_gather – 2. kommunikáció (all-gather)"}, {"op": "all_gather", "ph": 3, "inp": [0.0, 1.0, 2.0, 3.0], "out": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "msg": "all_gather – 3. eredmény: D0: [0, 1, 2, 3], D1: [0, 1, 2, 3], D2: [0, 1, 2, 3], D3: [0, 1, 2, 3]"}, {"op": "psum_scatter", "ph": 1, "inp": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "out": [0.0, 4.0, 8.0, 12.0], "msg": "psum_scatter – 1. bemenet: D0: [0, 1, 2, 3], D1: [0, 1, 2, 3], D2: [0, 1, 2, 3], D3: [0, 1, 2, 3]"}, {"op": "psum_scatter", "ph": 2, "inp": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "out": [0.0, 4.0, 8.0, 12.0], "msg": "psum_scatter – 2. kommunikáció (reduce-scatter)"}, {"op": "psum_scatter", "ph": 3, "inp": [[0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0], [0.0, 1.0, 2.0, 3.0]], "out": [0.0, 4.0, 8.0, 12.0], "msg": "psum_scatter – 3. eredmény: D0: 0, D1: 4, D2: 8, D3: 12"}, {"op": "ppermute", "ph": 1, "inp": [0.0, 1.0, 2.0, 3.0], "out": [3.0, 0.0, 1.0, 2.0], "msg": "ppermute – 1. bemenet: D0: 0, D1: 1, D2: 2, D3: 3"}, {"op": "ppermute", "ph": 2, "inp": [0.0, 1.0, 2.0, 3.0], "out": [3.0, 0.0, 1.0, 2.0], "msg": "ppermute – 2. kommunikáció (collective-permute)"}, {"op": "ppermute", "ph": 3, "inp": [0.0, 1.0, 2.0, 3.0], "out": [3.0, 0.0, 1.0, 2.0], "msg": "ppermute – 3. eredmény: D0: 3, D1: 0, D2: 1, D3: 2"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const HLO={"psum": "all-reduce", "pmean": "all-reduce", "all_gather": "all-gather", "psum_scatter": "reduce-scatter", "ppermute": "collective-permute"};
function f1(v){return Array.isArray(v)?"["+v.map(f1).join(", ")+"]":(Math.round(v*1000)/1000).toString().replace(".",",");}
function coll(op,x){const n=x.length,s=x.reduce((a,b)=>a+b,0);
  if(op==="psum")return[x.slice(),x.map(()=>s)];
  if(op==="pmean")return[x.slice(),x.map(()=>s/n)];
  if(op==="all_gather")return[x.slice(),x.map(()=>x.slice())];
  if(op==="psum_scatter")return[x.map(()=>x.slice()),x.map(v=>n*v)];
  return[x.slice(),x.map((_,k)=>x[(k-1+n)%n])];}
function render(s){
  const n=s.inp.length, cw=Math.min(120,520/n), x0=(560-n*cw)/2;
  svg.setAttribute("viewBox","0 0 560 300");svg.innerHTML="";const L=css("--line");
  el("text",{x:280,y:22,"text-anchor":"middle","font-weight":"bold"},`${s.op}  →  HLO: ${HLO[s.op]}`);
  for(let k=0;k<n;k++){
    el("text",{x:x0+k*cw+cw/2,y:50,"text-anchor":"middle"},"D"+k);
    el("rect",{x:x0+k*cw+4,y:60,width:cw-8,height:50,fill:css("--cell"),stroke:L});
    el("text",{x:x0+k*cw+cw/2,y:90,"text-anchor":"middle","font-size":Array.isArray(s.inp[k])?11:16},f1(s.inp[k]));
    if(s.ph===3){el("rect",{x:x0+k*cw+4,y:200,width:cw-8,height:50,fill:css("--cellhl"),stroke:L,"stroke-width":2});
      el("text",{x:x0+k*cw+cw/2,y:230,"text-anchor":"middle","font-size":Array.isArray(s.out[k])?11:16,"font-weight":"bold"},f1(s.out[k]));}
  }
  if(s.ph>=2){
    if(s.op==="ppermute"){for(let k=0;k<n;k++){const a=x0+k*cw+cw/2,b=x0+((k+1)%n)*cw+cw/2;
        el("path",{d:`M${a},112 C${a},160 ${b},150 ${b},196`,fill:"none",stroke:L,"stroke-width":1.6});
        el("text",{x:b,y:196,"text-anchor":"middle","font-size":12},"▼");}}
    else{el("rect",{x:x0+4,y:138,width:n*cw-8,height:34,rx:8,fill:"none",stroke:L,"stroke-dasharray":"5 3"});
      for(let k=0;k<n;k++){el("line",{x1:x0+k*cw+cw/2,y1:112,x2:x0+k*cw+cw/2,y2:138,stroke:L,"stroke-width":1.4});el("line",{x1:x0+k*cw+cw/2,y1:172,x2:x0+k*cw+cw/2,y2:198,stroke:L,"stroke-width":1.4});}
      const t={psum:"⊕ összeg mindenkinek",pmean:"⊕ összeg ÷ n mindenkinek",all_gather:"összegyűjtés: mindenki megkapja mindet",psum_scatter:"⊕ elemenként, a k. elem D_k-ra"}[s.op];
      el("text",{x:280,y:160,"text-anchor":"middle"},t);}
  }
  el("text",{x:280,y:285,"text-anchor":"middle","font-size":12,fill:css("--muted")},["","1. bemenet","2. kommunikáció","3. eredmény"][s.ph]);
}
function buildSteps(){
  const x=document.getElementById("vec").value.split(/[\s,;]+/).filter(t=>t!=="").map(Number);
  let n=+document.getElementById("nd").value;
  if(!x.every(Number.isFinite)||x.length<2){status.textContent="Hibás bemenet: legalább két szám kell.";return;}
  const v=[];for(let k=0;k<n;k++)v.push(k<x.length?x[k]:0);
  const ops=document.getElementById("op").value==="mind"?["psum","pmean","all_gather","psum_scatter","ppermute"]:[document.getElementById("op").value];
  const st=[];ops.forEach(op=>{const [inp,out]=coll(op,v);
    st.push({op,ph:1,inp,out,msg:`${op} – 1. bemenet: `+inp.map((t,k)=>`D${k}: ${f1(t)}`).join(", ")});
    st.push({op,ph:2,inp,out,msg:`${op} – 2. kommunikáció (${HLO[op]})`});
    st.push({op,ph:3,inp,out,msg:`${op} – 3. eredmény: `+out.map((t,k)=>`D${k}: ${f1(t)}`).join(", ")});});
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
