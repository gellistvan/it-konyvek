<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A jit életciklusa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--cell:#fff;--g1:#d0d0d0;--g2:#707070;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--cell:#262626;--g1:#555;--g2:#999;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}button{font:13px ui-monospace,monospace;padding:3px 8px;cursor:pointer}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
#status{min-height:2.9em;margin:4px 0}.cols{display:flex;gap:10px;flex-wrap:wrap}.cols>div{flex:1;min-width:220px}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;min-height:6em;overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" id="btns" role="group" aria-label="Hívások"></div>
<div class="ctl"><button id="pp" title="Előző fázis">◀ fázis</button><button id="pn" title="Következő fázis">fázis ▶</button>
<button id="reset">Alaphelyzet</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 200" role="img" aria-label="A hívások idővonala: trace, jaxpr, XLA-fordítás és futás fázisok"></svg>
<div class="cols"><div><b>Konzol</b><pre id="con"></pre></div>
<div><b>Cache (kulcs → lefordítva)</b><table id="cache"><thead><tr><th>függvény</th><th>kulcs</th></tr></thead><tbody></tbody></table></div></div>
<p class="small">Kulcs: a bemenetek alakja és dtype-ja, valamint a statikus argumentumok értéke. A <code>print</code> csak trace közben fut
(egyszer kulcsonként), a <code>jax.debug.print</code> minden futáskor. Az időarányok szemléltetők, nem mérés; JAX 0.4.x–0.12.</p>
<script>
const CALLS={"noisy(1.0)": ["noisy", "float32[]", "trace: JitTracer(~float32[])", "érték: 1.0"], "noisy(2.0)": ["noisy", "float32[]", "trace: JitTracer(~float32[])", "érték: 2.0"], "noisy(jnp.ones(3))": ["noisy", "float32[3]", "trace: JitTracer(float32[3])", "érték: [1. 1. 1.]"], "f(x, True)": ["f", "float32[3], flag=True", null, null], "f(x, False)": ["f", "float32[3], flag=False", null, null]}, DUR={"trace": 3, "jaxpr": 1.5, "compile": 6, "exec": 1.5};
const NAMES={trace:"trace – a Python-törzs fut (print kiír, a tracer absztrakt értéket hordoz)",jaxpr:"jaxpr / lowering – a rögzített műveletekből gráf lesz",compile:"XLA-fordítás – a gráfból gépi kód (egyszer kulcsonként)",exec:"futás – a lefordított kód fut az eszközön (jax.debug.print kiír)"};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
let hist=[], cache=[], ph=0;
function call(c){const [fn,key,tr,rt]=CALLS[c],hit=cache.some(k=>k[0]===fn&&k[1]===key);
  const phases=hit?["exec"]:["trace","jaxpr","compile","exec"];const cons=[];if(!hit&&tr)cons.push(tr);if(rt)cons.push(rt);
  if(!hit)cache.push([fn,key]);hist.push({c,hit,phases,cons});if(hist.length>5)hist.shift();ph=0;draw();}
function draw(){
  svg.innerHTML="";const L=cs("--line");
  const d=el("defs",{});const p=document.createElementNS(NS,"pattern");p.setAttribute("id","hh");p.setAttribute("width",6);p.setAttribute("height",6);p.setAttribute("patternUnits","userSpaceOnUse");p.setAttribute("patternTransform","rotate(45)");
  p.innerHTML=`<line x1="0" y1="0" x2="0" y2="6" stroke="${L}" stroke-width="1.3"/>`;d.appendChild(p);
  const fill={trace:"url(#hh)",jaxpr:cs("--cell"),compile:cs("--g1"),exec:cs("--g2")};
  svg.setAttribute("viewBox",`0 0 640 ${Math.max(60,hist.length*36+20)}`);
  hist.forEach((h,r)=>{const y=10+r*36,last=r===hist.length-1;
    el("text",{x:170,y:y+19,"text-anchor":"end","font-family":"monospace","font-size":12},h.c);
    el("text",{x:178,y:y+19,"font-size":13},h.hit?"✓":"×");
    let x=196;h.phases.forEach((q,i)=>{const w=DUR[q]*30,on=last&&i===ph;
      el("rect",{x,y,width:w,height:26,fill:fill[q],stroke:on?cs("--hl"):L,"stroke-width":on?3.5:1});
      if(q==="trace"){el("rect",{x,y,width:w,height:26,fill:"none",stroke:on?cs("--hl"):L,"stroke-width":on?3.5:1});}
      if(w>=40) el("text",{x:x+w/2,y:y+17,"text-anchor":"middle","font-size":11,fill:q==="exec"?"#fff":cs("--fg")},q==="compile"?"XLA":q);
      x+=w;});});
  const con=[];hist.forEach((h,r)=>{const last=r===hist.length-1;h.cons.forEach(l=>{if(!last)con.push(l);else{const isTr=l.startsWith("trace:");const pi=h.phases.indexOf(isTr?"trace":"exec");if(ph>=pi)con.push(l);}});});
  document.getElementById("con").textContent=con.join("\n");
  const tb=document.querySelector("#cache tbody");tb.innerHTML="";cache.forEach(k=>{const tr=document.createElement("tr");tr.innerHTML=`<td>${k[0]}</td><td><code>${k[1]}</code></td>`;tb.appendChild(tr);});
  if(!hist.length){document.getElementById("status").textContent="Nyomjon meg egy hívás-gombot.";return;}
  const h=hist[hist.length-1],q=h.phases[ph];
  document.getElementById("status").textContent=`${h.c}: ${h.hit?"cache-hit – nincs trace és fordítás":"cache-miss – trace és fordítás"}. ${ph+1}/${h.phases.length}. fázis: ${NAMES[q]}.`;
}
const B=document.getElementById("btns");Object.keys(CALLS).forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>call(c);B.appendChild(b);});
document.getElementById("pn").onclick=()=>{if(hist.length){ph=Math.min(ph+1,hist[hist.length-1].phases.length-1);draw();}};
document.getElementById("pp").onclick=()=>{if(hist.length){ph=Math.max(ph-1,0);draw();}};
document.getElementById("reset").onclick=()=>{hist=[];cache=[];ph=0;init();};
function init(){["noisy(1.0)","noisy(2.0)","noisy(jnp.ones(3))"].forEach(c=>call(c));ph=hist[hist.length-1].phases.length-1;draw();}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
init();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
