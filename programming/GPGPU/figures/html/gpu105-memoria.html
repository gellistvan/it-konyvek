<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU és TPU memóriahierarchia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
svg{width:100%;max-width:640px;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
g.lv{cursor:pointer}#info{min-height:4.4em;margin:6px 0;padding:6px 8px;border-left:3px solid var(--hl)}a{color:var(--hl)}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<svg id="v" viewBox="0 0 520 420" role="img" aria-label="GPU és TPU memóriahierarchia egymás mellett; kattintson egy szintre"></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Keret: vastag = programozó kezeli, szaggatott = hardveres cache, pontozott = XLA-fordító (Pallas-szal kézzel).
Sematikus; generációfüggő, számértékek a gyártói adatlapon.</p>
<script>
const GPU=[["g_reg", "regiszterek\n(szálanként)", "prog", 0, "Szálanként privát, a leggyorsabb szint; a változók regiszterbe kerülnek, a kiosztást a fordító végzi, de a regiszterhasználatot (és így az occupancyt) a programozó a kóddal befolyásolja.", ["gpu008", "Memóriahierarchia: regiszter, shared, L1/L2, global"]], ["g_sh", "shared\nmemory", "prog", 1, "Blokkonként megosztott, a programozó explicit tölti és szinkronizálja (__syncthreads); a tiling alapja.", ["gpu023", "Shared memory és élettartam"]], ["g_l1", "L1", "hw", 1, "SM-enkénti hardveres cache, a shared memoryval közös SRAM-ból; csak hintekkel befolyásolható.", ["gpu054", "L1 és L2 cache"]], ["g_l2", "L2 (chip)", "hw", 2, "Az egész chip közös hardveres cache-e; a globális memória minden hozzáférése rajta megy át.", ["gpu054", "L1 és L2 cache"]], ["g_hbm", "HBM / GDDR\n(globális)", "prog", 3, "Az eszköz fő memóriája; a programozó foglal (cudaMalloc) és mozgat, a coalescing a hatékonyság feltétele.", ["gpu038", "Globális memória coalescing"]]], TPU=[["t_reg", "vektorregiszterek\n+ MXU", "xla", 0, "Az MXU-t a vektorregiszterek táplálják; az ütemezést az XLA végzi, Pallas-kernelben a programozó.", ["gpu102", "TPU-architektúra"]], ["t_vmem", "VMEM\n(on-chip SRAM)", "xla", 1, "A shared memory közelítő megfelelője; az adatmozgást HBM és VMEM között az XLA ütemezi (csempézés), Pallas-kernelben kézzel írható.", ["gpu103", "XLA és a gráffordítás (csempézés)"]], ["t_hbm", "HBM", "xla", 3, "A TPU fő memóriája; a puffereket és a tiled layoutot az XLA tervezi, a programozó az alakkal, a batch-csel és a shardinggal hat rá.", ["gpu109", "JAX teljesítmény és korlátok"]]], WHO={"prog": "programozó", "hw": "hardveres cache", "xla": "XLA-fordító (Pallas-szal kézzel)"};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const ST={prog:{w:4,d:""},hw:{w:1.6,d:"7 4"},xla:{w:1.8,d:"2 3"}}, Y=[40,110,180,250];
let cur="t_vmem";
function draw(){
  svg.innerHTML="";const L=cs("--line");
  el("text",{x:120,y:24,"text-anchor":"middle","font-weight":"bold"},"GPU");el("text",{x:400,y:24,"text-anchor":"middle","font-weight":"bold"},"TPU");
  const pos={};
  const box=(it,x,w)=>{const [id,lab,who,lvl]=it,on=cur===id,g=el("g",{class:"lv",tabindex:0,role:"button","aria-label":lab.replace("\n"," ")});
    el("rect",{x,y:Y[lvl],width:w,height:50,rx:8,fill:on?cs("--cellhl"):cs("--cell"),stroke:L,"stroke-width":ST[who].w,"stroke-dasharray":ST[who].d},undefined,g);
    lab.split("\n").forEach((t,k,a)=>el("text",{x:x+w/2,y:Y[lvl]+29+(k-(a.length-1)/2)*16,"text-anchor":"middle","font-size":13},t,g));
    const act=()=>{cur=id;draw();};g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
    pos[id]=[x,Y[lvl],w];};
  GPU.forEach(it=>{let x=20,w=200;if(it[0]==="g_sh")w=125;if(it[0]==="g_l1"){x=150;w=70;}box(it,x,w);});
  TPU.forEach(it=>box(it,300,200));
  el("text",{x:400,y:Y[2]+30,"text-anchor":"middle","font-size":12,fill:cs("--muted"),"font-style":"italic"},"(nincs megfelelő szint)");
  el("line",{x1:222,y1:Y[1]+25,x2:298,y2:Y[1]+25,stroke:L,"stroke-dasharray":"6 4"});el("text",{x:260,y:Y[1]+18,"text-anchor":"middle"},"≈");
  el("line",{x1:222,y1:Y[3]+25,x2:298,y2:Y[3]+25,stroke:L,"stroke-dasharray":"6 4"});el("text",{x:260,y:Y[3]+18,"text-anchor":"middle"},"=");
  el("text",{x:120,y:335,"text-anchor":"middle","font-size":12},"NVLink / NVSwitch, PCIe (NCCL)");
  el("text",{x:400,y:335,"text-anchor":"middle","font-size":12},"ICI (2D/3D torus)");
  el("text",{x:260,y:360,"text-anchor":"middle","font-size":12,"font-style":"italic",fill:cs("--muted")},"interconnect");
  const it=[...GPU,...TPU].find(t=>t[0]===cur);
  const info=document.getElementById("info");
  info.innerHTML="";const b=document.createElement("b");b.textContent=it[1].replace("\n"," ")+" – "+WHO[it[2]]+": ";info.appendChild(b);
  info.appendChild(document.createTextNode(it[4]+" "));
  const a=document.createElement("a");a.href="../../"+it[5][0]+".html";a.target="_top";a.textContent="→ "+it[5][1];info.appendChild(a);
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
