<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A laborjel spektruma</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>f₁ (cos) <input id="f1" type="range" min="1" max="32" value="4" oninput="show(k)" style="width:90px"> <span id="f1v">4</span></label> <label>A₁ <input id="a1" type="range" min="0" max="20" value="10" oninput="show(k)" style="width:70px"> <span id="a1v">1,0</span></label> <label>f₂ (sin) <input id="f2" type="range" min="1" max="32" value="8" oninput="show(k)" style="width:90px"> <span id="f2v">8</span></label> <label>A₂ <input id="a2" type="range" min="0" max="20" value="10" oninput="show(k)" style="width:70px"> <span id="a2v">1,0</span></label> <label><input id="r2c" type="checkbox" onchange="show(k)"> R2C fél spektrum</label> <label><input id="norm" type="checkbox" onchange="show(k)"> normalizálás (1/N)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a jel N = 1024 mintán, középen az |X_k| szárdiagram a csúcsokkal, alul a normalizálás nélküli inverz FFT és az eredeti jel aránya (konstans 1024)."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Élő DFT JavaScriptben (FP64, N = 1024, cuFFT-konvenció: előre irány negatív kitevővel, az inverz 1/N nélkül). Kezdőállapot: a labor jele, cos(2π·4t) + sin(2π·8t), csúcsok 512 magassággal.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"view": 0, "line": -1, "msg": "Időtartomány: x[i] = cos(2π·4t) + sin(2π·8t), t = i/N, N = 1024"}, {"view": 1, "line": -1, "msg": "C2C spektrum: csúcsok a 4., 8., 1016. és 1020. indexen, mindegyik |X_k| = 512 = N/2"}, {"view": 2, "line": -1, "msg": "R2C: csak a k = 0…N/2 tartomány (513 elem) kerül a kimenetbe; a többi X_{N−k} = conj(X_k)"}, {"view": 3, "line": -1, "msg": "Inverz FFT normalizálás nélkül: a rekonstruált jel az eredeti N = 1024-szerese"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NN = 1024;
let CACHE = null;
function gv(id){ return +document.getElementById(id).value; }
function compute(){
  const f1 = gv("f1"), f2 = gv("f2"), a1 = gv("a1") / 10, a2 = gv("a2") / 10;
  const key = [f1, f2, a1, a2].join(",");
  if (CACHE && CACHE.key === key) return CACHE;
  const x = new Float64Array(NN);
  for (let i = 0; i < NN; i++) { const t = i / NN; x[i] = a1*Math.cos(2*Math.PI*f1*t) + a2*Math.sin(2*Math.PI*f2*t); }
  const cs = new Float64Array(NN), sn = new Float64Array(NN);
  for (let q = 0; q < NN; q++) { cs[q] = Math.cos(2*Math.PI*q/NN); sn[q] = Math.sin(2*Math.PI*q/NN); }
  const re = new Float64Array(NN), im = new Float64Array(NN), mag = new Float64Array(NN);
  for (let kk = 0; kk < NN; kk++) { let r = 0, m = 0; for (let n = 0; n < NN; n++) { const q = (kk*n) % NN; r += x[n]*cs[q]; m -= x[n]*sn[q]; }
    re[kk] = r; im[kk] = m; mag[kk] = Math.hypot(r, m); }
  CACHE = {key, f1, f2, a1, a2, x, re, im, mag};
  return CACHE;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 470");
  ["f1","f2"].forEach(id => document.getElementById(id + "v").textContent = gv(id));
  ["a1","a2"].forEach(id => document.getElementById(id + "v").textContent = (gv(id)/10).toFixed(1).replace(".", ","));
  const C = compute(), r2c = document.getElementById("r2c").checked, norm = document.getElementById("norm").checked;
  const X0 = 60, Wd = 680, xs = i => X0 + i / NN * Wd;
  // (a) jel
  const amax = Math.max(1e-9, C.a1 + C.a2), ya = v => 78 - v / amax * 50;
  el("text", {x: 10, y: 16, "font-size": 12, "font-weight": s.view === 0 ? "bold" : "normal"}, "(a) x[i]");
  el("line", {x1: X0, y1: ya(0), x2: X0 + Wd, y2: ya(0), stroke: css("--muted"), "stroke-width": 0.5});
  let d = ""; for (let i = 0; i < NN; i++) d += (i ? " L " : "M ") + xs(i).toFixed(1) + " " + ya(C.x[i]).toFixed(1);
  el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 1.3});
  // (b) spektrum
  const mmax = Math.max(1, ...C.mag), yb = v => 310 - v / mmax * 120, kmax = r2c ? NN / 2 : NN - 1, xk = kk => X0 + kk / (r2c ? NN/2 : NN) * Wd;
  el("text", {x: 10, y: 150, "font-size": 12, "font-weight": s.view === 1 || s.view === 2 ? "bold" : "normal"}, r2c ? "(b) |X_k|, R2C: k = 0…N/2 (513 elem)" : "(b) |X_k|, C2C: k = 0…N−1");
  el("line", {x1: X0, y1: 310, x2: X0 + Wd, y2: 310, stroke: css("--line")});
  if (!r2c) el("rect", {x: X0, y: 185, width: xk(NN/2) - X0, height: 125, fill: css("--cellhl"), opacity: 0.45});
  const pk = [];
  for (let kk = 0; kk <= kmax; kk++) { if (C.mag[kk] > 1e-6 * mmax + 1e-9) { el("line", {x1: xk(kk), y1: 310, x2: xk(kk), y2: yb(C.mag[kk]), stroke: kk > NN/2 ? css("--muted") : css("--fg"), "stroke-width": 2, "stroke-dasharray": kk > NN/2 ? "4 2" : "none"});
      if (C.mag[kk] > 0.01 * mmax) pk.push(kk); } }
  pk.forEach((kk, q) => el("text", {x: xk(kk) + (kk > NN/2 ? -4 : 4), y: yb(C.mag[kk]) - 4 - (q % 2) * 12, "text-anchor": kk > NN/2 ? "end" : "start", "font-size": 11, "dx": kk > NN/2 ? -6 : 6}, `k = ${kk}: ${C.mag[kk].toFixed(1).replace(".", ",")}`));
  [0, NN/4, NN/2, 3*NN/4, NN].filter(v => v <= kmax + 1).forEach(v => el("text", {x: xk(v), y: 324, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(v)));
  // (c) rekonstrukció arány
  const yc = v => 450 - v / 1100 * 85;
  el("text", {x: 10, y: 355, "font-size": 12, "font-weight": s.view === 3 ? "bold" : "normal"}, norm ? "(c) inverz FFT + 1/N: y[i] / x[i] = 1" : "(c) inverz FFT normalizálás nélkül: y[i] / x[i] = N = 1024");
  el("line", {x1: X0, y1: yc(0), x2: X0 + Wd, y2: yc(0), stroke: css("--line")});
  el("line", {x1: X0, y1: yc(norm ? 1 : NN), x2: X0 + Wd, y2: yc(norm ? 1 : NN), stroke: css("--fg"), "stroke-width": 2});
  el("text", {x: X0 - 6, y: yc(NN) + 4, "text-anchor": "end", "font-size": 10}, "1024");
  el("text", {x: X0 - 6, y: yc(0) + 4, "text-anchor": "end", "font-size": 10}, "0");
  const top = pk.filter(kk => kk <= NN/2);
  if (s.view === 3) status.textContent = norm ? "Inverz FFT + 1/N normalizálás: a rekonstruált jel megegyezik az eredetivel (arány 1)" : "Inverz FFT normalizálás nélkül: a rekonstruált jel az eredeti N = 1024-szerese";
  if (s.view !== 3) status.textContent = (s.view === 0 ? `Időtartomány: x[i] = ${C.a1.toFixed(1).replace(".", ",")}·cos(2π·${C.f1}t) + ${C.a2.toFixed(1).replace(".", ",")}·sin(2π·${C.f2}t)` :
     `Csúcsok (k ≤ N/2): ` + top.map(kk => `${kk} (${C.mag[kk].toFixed(1).replace(".", ",")})`).join(", ") + (r2c ? "; R2C: 513 komplex kimenet" : `; tükörképek: ` + pk.filter(kk => kk > NN/2).join(", ")));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
