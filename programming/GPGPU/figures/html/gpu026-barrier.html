<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A __syncthreads() barrier</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Eset: <select id="cs" onchange="pick()" aria-label="Eset"><option value="a" selected>a) helyes barrier</option><option value="b">b) elfelejtett barrier</option><option value="c_go">c) divergens – továbblép</option><option value="c_dead">c) divergens – holtpont</option></select></label><button onclick="shuffleDelays()">Warp-késleltetés véletlenítése</button><button onclick="resetDelays()">Alapértékek</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy warp írási és várakozási sávja; a 0. szál összegzése és a 128 sdata-elem friss vagy régi állapota."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a) helyes barrier, warponkénti írási idő 2; 3; 2,5; 6,5 egység. Sematikus, nem mért idővonal; a régi érték a modellben 0. A c) esetek meghatározatlan viselkedést mutatnak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 0: írások: W0 0/32, W1 0/32, W2 0/32, W3 0/32"}, {"t": 0.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 0.5: írások: W0 0/32, W1 0/32, W2 0/32, W3 0/32"}, {"t": 1.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 1: írások: W0 0/32, W1 0/32, W2 0/32, W3 0/32"}, {"t": 1.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 1.5: írások: W0 0/32, W1 0/32, W2 0/32, W3 0/32"}, {"t": 2.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 2: írások: W0 32/32, W1 0/32, W2 0/32, W3 0/32"}, {"t": 2.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 2.5: írások: W0 32/32, W1 0/32, W2 32/32, W3 0/32"}, {"t": 3.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 3: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 3.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 3.5: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 4.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 4: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 4.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 4.5: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 5.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 5: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 5.5, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 5.5: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 6.0, "line": 1, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 6: írások: W0 32/32, W1 32/32, W2 32/32, W3 0/32"}, {"t": 6.5, "line": 5, "nread": 0, "ps": 0, "nstale": 0, "msg": "t = 6.5: a 0. szál 0/128 elemet olvasott, részösszeg = 0"}, {"t": 7.0, "line": 5, "nread": 12, "ps": 66, "nstale": 0, "msg": "t = 7: a 0. szál 12/128 elemet olvasott, részösszeg = 66"}, {"t": 7.5, "line": 5, "nread": 25, "ps": 300, "nstale": 0, "msg": "t = 7.5: a 0. szál 25/128 elemet olvasott, részösszeg = 300"}, {"t": 8.0, "line": 5, "nread": 38, "ps": 703, "nstale": 0, "msg": "t = 8: a 0. szál 38/128 elemet olvasott, részösszeg = 703"}, {"t": 8.5, "line": 5, "nread": 51, "ps": 1275, "nstale": 0, "msg": "t = 8.5: a 0. szál 51/128 elemet olvasott, részösszeg = 1275"}, {"t": 9.0, "line": 5, "nread": 64, "ps": 2016, "nstale": 0, "msg": "t = 9: a 0. szál 64/128 elemet olvasott, részösszeg = 2016"}, {"t": 9.5, "line": 5, "nread": 76, "ps": 2850, "nstale": 0, "msg": "t = 9.5: a 0. szál 76/128 elemet olvasott, részösszeg = 2850"}, {"t": 10.0, "line": 5, "nread": 89, "ps": 3916, "nstale": 0, "msg": "t = 10: a 0. szál 89/128 elemet olvasott, részösszeg = 3916"}, {"t": 10.5, "line": 5, "nread": 102, "ps": 5151, "nstale": 0, "msg": "t = 10.5: a 0. szál 102/128 elemet olvasott, részösszeg = 5151"}, {"t": 11.0, "line": 5, "nread": 115, "ps": 6555, "nstale": 0, "msg": "t = 11: a 0. szál 115/128 elemet olvasott, részösszeg = 6555"}, {"t": 11.5, "line": 5, "nread": 128, "ps": 8128, "nstale": 0, "msg": "t = 11.5: a 0. szál 128/128 elemet olvasott, részösszeg = 8128"}, {"t": 12.0, "line": 5, "nread": 128, "ps": 8128, "nstale": 0, "msg": "t = 12: a 0. szál 128/128 elemet olvasott, részösszeg = 8128"}];
const CODE = ["__shared__ float sdata[256];", "sdata[tid] = (idx < n) ? input[idx] : 0.0f;    // írás", "/* a) __syncthreads();  b) –  c) if (tid == 0) __syncthreads(); */", "                                                // barrier (esetfüggő)", "if (tid == 0) {", "  for (int i = 0; i < blockDim.x; ++i) sum += sdata[i];   // olvasás", "  output[blockIdx.x] = sum; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NW = 4, WS = 32, R = 5, TEND = 12, E0 = [2.0, 3.0, 2.5, 6.5], EF = [2.0, 2.5, 2.2, 3.0];
let E = E0.slice(), CASE = "a", shuffled = false;
function wrAt(i){ return E[Math.floor(i / WS)]; }
function sim(){
  if (CASE === "c_dead") return {start: null, reads: [], dead: true, bar: null};
  const bar = CASE === "a" ? Math.max(...E) : null, start = CASE === "a" ? bar : E[0], reads = [];
  for (let i = 0; i < NW * WS; i++) { const t = start + R * (i + 1) / (NW * WS); reads.push([i, t, t >= wrAt(i)]); }
  return {start, reads, dead: false, bar};
}
function gen(){
  const S = sim(), out = [];
  for (let q = 0; q <= TEND / .5; q++) { const t = q * .5;
    const done = E.map(e => t >= e ? WS : 0);
    if (S.dead) { out.push({t, line: t < E[0] ? 2 : 3, nread: 0, ps: 0, nstale: 0, msg: `t = ${t}: ` + (t >= E[0] ? "a 0. szál a barriernél vár – a többi szál sosem érkezik meg (holtpont)" : "a warpok írják az sdata-t")}); continue; }
    const rd = S.reads.filter(r => r[1] <= t + 1e-9), ps = rd.filter(r => r[2]).reduce((a, r) => a + r[0], 0), ns = rd.filter(r => !r[2]).length;
    if (t >= S.start) out.push({t, line: 5, nread: rd.length, ps, nstale: ns, msg: `t = ${t}: a 0. szál ${rd.length}/128 elemet olvasott, részösszeg = ${ps}` + (ns ? `, ${ns} régi érték!` : "")});
    else out.push({t, line: CASE !== "a" || t < Math.max(...E) ? 1 : 3, nread: 0, ps: 0, nstale: 0, msg: `t = ${t}: írások: ` + done.map((d, w) => `W${w} ${d}/32`).join(", ")});
  }
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 720 330"); svg.innerHTML = ""; defs();
  const S = sim(), x0 = 60, sc = 640 / TEND, t = s.t;
  for (let w = 0; w < NW; w++) { const y = 30 + w * 34;
    el("text", {x: 10, y: y + 18, "font-size": 12}, "W" + w);
    const e = Math.min(E[w], t);
    el("rect", {x: x0, y, width: e * sc, height: 24, fill: "url(#hw)", stroke: css("--line")});
    if (w === 0 && S.start !== null && t > S.start) el("rect", {x: x0 + S.start * sc, y, width: (Math.min(t, S.start + R) - S.start) * sc, height: 24, fill: "url(#hr)", stroke: css("--line")});
    const waitEnd = S.dead && w === 0 ? t : (S.bar !== null ? Math.min(t, S.bar) : E[w]);
    if (t > E[w] && waitEnd > E[w]) el("line", {x1: x0 + E[w] * sc, x2: x0 + waitEnd * sc, y1: y + 12, y2: y + 12, stroke: css("--line"), "stroke-dasharray": "2 3", "stroke-width": 2});
  }
  if (S.bar !== null) el("line", {x1: x0 + S.bar * sc, x2: x0 + S.bar * sc, y1: 22, y2: 166, stroke: css("--line"), "stroke-dasharray": "6 3"});
  el("line", {x1: x0 + t * sc, x2: x0 + t * sc, y1: 22, y2: 166, stroke: css("--hl2"), "stroke-width": 2});
  // a 0. szál olvasásai: 128 kis cella
  const cw = 640 / 128;
  for (let i = 0; i < 128; i++) { const r = S.reads[i], read = r && r[1] <= t + 1e-9;
    el("rect", {x: x0 + i * cw, y: 190, width: cw, height: 22, fill: !read ? css("--cell") : r[2] ? css("--cellhl") : "url(#hb)", stroke: css("--muted"), "stroke-width": .3}); }
  el("text", {x: 10, y: 206, "font-size": 11}, "sdata");
  el("text", {x: x0, y: 230, "font-size": 11, fill: css("--muted")}, "szürke: friss értéket olvasott · sraffozott: régi értéket (0) · üres: még nem olvasta");
  el("text", {x: x0, y: 262, "font-size": 15, "font-weight": "bold", fill: s.nstale ? css("--hl2") : css("--fg")},
     S.dead ? "nincs összeg: a kernel nem tér vissza" : `részösszeg = ${s.ps}  (helyes végösszeg: 8128)`);
  if (CASE.startsWith("c")) el("text", {x: x0, y: 290, "font-size": 13, fill: css("--hl2")}, "meghatározatlan viselkedés – compute-sanitizer --tool synccheck jelzi");
  el("text", {x: x0, y: 318, "font-size": 11, fill: css("--muted")}, "E = [" + E.map(e => e.toFixed(1).replace(".", ",")).join("; ") + "] (warponkénti írási idő) · sematikus, ütemezőfüggő");
}
function defs(){ const d = el("defs", {});
  d.innerHTML = `<pattern id="hw" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1"/></pattern>
  <pattern id="hr" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="3" x2="6" y2="3" stroke="${css("--line")}" stroke-width="1"/></pattern>
  <pattern id="hb" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${css("--hl2")}" stroke-width="2"/></pattern>`; }
function pick(){ CASE = document.getElementById("cs").value; if (!shuffled) E = (CASE.startsWith("c") ? EF : E0).slice(); setSteps(gen()); }
function shuffleDelays(){ shuffled = true; E = [0, 1, 2, 3].map(() => Math.round((1.5 + Math.random() * 5.5) * 10) / 10); setSteps(gen()); }
function resetDelays(){ shuffled = false; E = (CASE.startsWith("c") ? EF : E0).slice(); setSteps(gen()); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
