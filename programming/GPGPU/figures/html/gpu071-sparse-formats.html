<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COO, CSR és ELL</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>ELL-memória: <select id="lay" onchange="show(k)"><option value="col">oszlop-fő (values[k·m + row])</option><option value="row">sor-fő (values[row·k_max + k])</option></select></label> <button onclick="SEL=null;show(k)">kijelölés törlése</button></div><div class="ctl"><label>Saját mátrix (sorok ;-vel): <input id="inp" size="44" value="0 2 0 0 0; 0 0 0 4 0; 5 0 0 0 6; 0 0 7 0 0" aria-label="Saját mátrix"></label> <button onclick="load()">Betöltés</button> <span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 4×5-ös ritka mátrix sűrű alakja, COO- és CSR-tömbjei a row_ptr-intervallumokkal, valamint ELL logikai táblája és lineáris memóriaképe a szálak olvasási címeivel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">0-alapú indexek, −1 = padding (keresztsraffozás), oszlop-fő ELL: values[k·m + row]. A sűrű mátrix vagy a COO/CSR tömbök egy nemnulla cellájára kattintva minden formátumban kiemelődik ugyanaz az elem. Kezdőállapot: a 19.2.2 mátrixa.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"kind": "csr", "i": 0, "line": 1, "msg": "CSR, 0. sor: [row_ptr[0], row_ptr[1]) = [0, 1) → 1 elem: col_idx = [1], values = [2]"}, {"kind": "csr", "i": 1, "line": 1, "msg": "CSR, 1. sor: [row_ptr[1], row_ptr[2]) = [1, 2) → 1 elem: col_idx = [3], values = [4]"}, {"kind": "csr", "i": 2, "line": 1, "msg": "CSR, 2. sor: [row_ptr[2], row_ptr[3]) = [2, 4) → 2 elem: col_idx = [0, 4], values = [5, 6]"}, {"kind": "csr", "i": 3, "line": 1, "msg": "CSR, 3. sor: [row_ptr[3], row_ptr[4]) = [4, 5) → 1 elem: col_idx = [2], values = [7]"}, {"kind": "ell", "k": 0, "line": 4, "msg": "ELL, k = 0: a 0..3. szál a col_ind/values [0..3] címeit olvassa – egymás melletti cellák (koaleszkált)"}, {"kind": "ell", "k": 1, "line": 4, "msg": "ELL, k = 1: a 0..3. szál a col_ind/values [4..7] címeit olvassa – egymás melletti cellák (koaleszkált)"}];
const CODE = ["// CSR: az i. sor elemei a [row_ptr[i], row_ptr[i+1]) intervallumban", "for (int j = row_ptr[row]; j < row_ptr[row + 1]; ++j) sum += values[j] * x[col_idx[j]];", "// ELL (oszlop-fő): a row. szál k. lépése", "for (int k = 0; k < k_max; ++k) {", "    int c = col_ind[k * m + row];  if (c >= 0) sum += values[k * m + row] * x[c]; }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let DM = [[0, 2, 0, 0, 0], [0, 0, 0, 4, 0], [5, 0, 0, 0, 6], [0, 0, 7, 0, 0]], SEL = null;
function fmts(D){
  const m = D.length, ri = [], ci = [], v = [], rp = [0];
  D.forEach((r, i) => { r.forEach((x, j) => { if (x !== 0) { ri.push(i); ci.push(j); v.push(x); } }); rp.push(v.length); });
  let km = 0; for (let i = 0; i < m; i++) km = Math.max(km, rp[i+1] - rp[i]);
  const ec = new Array(m*km).fill(-1), ev = new Array(m*km).fill(0), eo = new Array(m*km).fill(-1);
  for (let i = 0; i < m; i++) for (let j = rp[i]; j < rp[i+1]; j++) { const k = j - rp[i]; ec[k*m + i] = ci[j]; ev[k*m + i] = v[j]; eo[k*m + i] = j; }
  return {m, n: D[0].length, ri, ci, v, rp, km, ec, ev, eo};
}
function mkSteps(F){
  const st = [];
  for (let i = 0; i < F.m; i++) { const a = F.rp[i], b = F.rp[i+1];
    st.push({kind: "csr", i, line: 1, msg: `CSR, ${i}. sor: [row_ptr[${i}], row_ptr[${i+1}]) = [${a}, ${b}) → ${b-a} elem` + (b > a ? `: col_idx = [${F.ci.slice(a, b).join(", ")}], values = [${F.v.slice(a, b).join(", ")}]` : "")}); }
  for (let k = 0; k < F.km; k++) st.push({kind: "ell", k, line: 4, msg: ""});
  return st;
}
function sg(x){ return String(x).replace("-", "−"); }
function box(x, y, w, h, t, on, pad, cb, dash){
  const r = el("rect", {x, y, width: w, height: h, fill: pad ? "url(#xh)" : (on ? css("--cellhl") : css("--cell")), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 2.5 : 1, "stroke-dasharray": dash ? "4 3" : "none"});
  if (cb) { r.style.cursor = "pointer"; r.addEventListener("click", cb); }
  if (t !== null) { if (pad) el("rect", {x: x + w/2 - 9, y: y + h/2 - 8, width: 18, height: 15, fill: css("--bg")});
    const q = el("text", {x: x + w/2, y: y + h/2 + 4, "text-anchor": "middle", "font-size": Math.min(13, w*0.6)}, sg(t)); q.style.pointerEvents = "none"; }
  return r;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 470");
  const d = document.createElementNS(NS, "defs");
  d.innerHTML = `<pattern id="xh" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0L6 6M6 0L0 6" stroke="${css("--muted")}" stroke-width="0.8"/></pattern>`;
  svg.appendChild(d);
  const F = fmts(DM), m = F.m, n = F.n, cm = document.getElementById("lay").value === "col";
  // kiemelés: kiválasztott nemnulla (j = COO/CSR index) vagy a lépés
  const selJ = SEL, rowHL = s.kind === "csr" ? s.i : -1;
  // sűrű
  const c1 = Math.min(28, 230 / Math.max(m, n));
  el("text", {x: 20, y: 20, "font-size": 13, "font-weight": "bold"}, `sűrű (${m}×${n}), nnz = ${F.v.length}`);
  DM.forEach((r, i) => r.forEach((x, j) => {
    let jj = -1; for (let q = F.rp[i]; q < F.rp[i+1]; q++) if (F.ci[q] === j) jj = q;
    box(20 + j*c1, 34 + i*c1, c1, c1, x, (jj >= 0 && jj === selJ) || (x !== 0 && i === rowHL), false, x !== 0 ? () => { SEL = jj; show(k); } : null);
  }));
  // COO/CSR
  const nn = F.v.length, w2 = Math.min(30, 400 / Math.max(nn, m + 1)), X = 340;
  el("text", {x: X - 90, y: 20, "font-size": 13, "font-weight": "bold"}, "COO és CSR");
  const lab = (y, t) => el("text", {x: X - 8, y: y + w2/2 + 4, "text-anchor": "end", "font-size": 12}, t);
  lab(34, "row_ptr"); F.rp.forEach((x, i) => box(X + i*w2, 34, w2, w2, x, i === rowHL || i === rowHL + 1 && rowHL >= 0, false));
  const y2 = 34 + w2 + 50;
  lab(y2, "row_idx"); lab(y2 + w2, "col_idx"); lab(y2 + 2*w2, "values");
  for (let j = 0; j < nn; j++) { const on = j === selJ || (rowHL >= 0 && j >= F.rp[rowHL] && j < F.rp[rowHL+1]);
    box(X + j*w2, y2, w2, w2, F.ri[j], on, false, () => { SEL = j; show(k); });
    box(X + j*w2, y2 + w2, w2, w2, F.ci[j], on, false, () => { SEL = j; show(k); });
    box(X + j*w2, y2 + 2*w2, w2, w2, F.v[j], on, false, () => { SEL = j; show(k); });
    el("text", {x: X + j*w2 + w2/2, y: y2 + 3*w2 + 12, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(j)); }
  for (let i = 0; i <= m; i++) { const on = i === rowHL || i === rowHL + 1;
    el("line", {x1: X + i*w2 + w2/2, y1: 34 + w2, x2: X + F.rp[i]*w2 + 2, y2: y2 - 2, stroke: on ? css("--hl2") : css("--muted"), "stroke-width": on ? 2 : 0.8, "stroke-dasharray": i === m ? "4 3" : "none"}); }
  if (rowHL >= 0) { const a = F.rp[rowHL], b = F.rp[rowHL+1], yb = y2 + 3*w2 + 18;
    el("path", {d: `M ${X + a*w2 + 2} ${yb} L ${X + a*w2 + 2} ${yb + 6} L ${X + b*w2 - 2} ${yb + 6} L ${X + b*w2 - 2} ${yb}`, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
    el("text", {x: X + (a + b)*w2/2, y: yb + 22, "text-anchor": "middle", "font-size": 12}, `[${a}, ${b})` + (a === b ? " üres sor" : "")); }
  // ELL
  const Y3 = 260, c3 = Math.min(24, 150 / Math.max(m, 1));
  el("text", {x: 20, y: Y3 - 14, "font-size": 13, "font-weight": "bold"}, `ELL, k_max = ${F.km} (logikai nézet)`);
  for (let i = 0; i < m; i++) for (let kk = 0; kk < F.km; kk++) { const q = kk*m + i, p = F.ec[q] < 0, on = (F.eo[q] === selJ && selJ !== null) || (s.kind === "ell" && kk === s.k);
    box(20 + kk*c3, Y3 + i*c3, c3, c3, F.ec[q], on, p, null);
    box(40 + F.km*c3 + kk*c3, Y3 + i*c3, c3, c3, F.ev[q], on, p, null); }
  el("text", {x: 20, y: Y3 + m*c3 + 14, "font-size": 11, fill: css("--muted")}, "col_ind | values");
  const L = m*F.km, w4 = Math.min(30, 470 / Math.max(L, 1)), X4 = 270, kk = s.kind === "ell" ? s.k : 0;
  el("text", {x: X4, y: Y3 - 14, "font-size": 13, "font-weight": "bold"}, cm ? "memória: oszlop-fő (values[k·m + row])" : "memória: sor-fő (values[row·k_max + k])");
  const memC = [], memV = [], memO = [];
  for (let q = 0; q < L; q++) { const row = cm ? q % m : (q / F.km) | 0, kq = cm ? (q / m) | 0 : q % F.km, src = kq*m + row; memC.push(F.ec[src]); memV.push(F.ev[src]); memO.push(F.eo[src]); }
  const addr = []; for (let t = 0; t < m; t++) addr.push(cm ? kk*m + t : t*F.km + kk);
  const yC = Y3 + 50, yV = yC + w4 + 14;
  el("text", {x: X4 - 6, y: yC + w4/2 + 4, "text-anchor": "end", "font-size": 12}, "col_ind");
  el("text", {x: X4 - 6, y: yV + w4/2 + 4, "text-anchor": "end", "font-size": 12}, "values");
  for (let q = 0; q < L; q++) { const on = s.kind === "ell" && addr.includes(q) || (memO[q] === selJ && selJ !== null);
    box(X4 + q*w4, yC, w4, w4, memC[q], on, memC[q] < 0, null); box(X4 + q*w4, yV, w4, w4, memV[q], on, memC[q] < 0, null);
    el("text", {x: X4 + q*w4 + w4/2, y: yV + w4 + 12, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, String(q)); }
  if (s.kind === "ell") {
    addr.forEach((a, t) => { el("line", {x1: X4 + a*w4 + w4/2, y1: yC - 22, x2: X4 + a*w4 + w4/2, y2: yC - 2, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": cm ? "none" : "4 3"});
      if (m <= 16 || t % 2 === 0) el("text", {x: X4 + a*w4 + w4/2, y: yC - 26, "text-anchor": "middle", "font-size": 10}, "t" + t); });
    const lo = Math.min(...addr), hi = Math.max(...addr), stride = m > 1 ? addr[1] - addr[0] : 1;
    status.textContent = `ELL, k = ${kk}: a 0..${m-1}. szál a(z) ${addr.join(", ")} címet olvassa; érintett tartomány [${lo}, ${hi}], ${hi - lo + 1} elem, lépésköz ${stride} → ` + (stride === 1 ? "egymás melletti cellák (koaleszkált)" : "szétszórt cellák (nem koaleszkált)");
  }
  if (selJ !== null && selJ < nn) status.textContent = `kiválasztott nemnulla: A[${F.ri[selJ]}][${F.ci[selJ]}] = ${F.v[selJ]} → COO/CSR index ${selJ}; ELL: k = ${selJ - F.rp[F.ri[selJ]]}, cím ${cm ? "k·m + row = " + ((selJ - F.rp[F.ri[selJ]])*m + F.ri[selJ]) : "row·k_max + k = " + (F.ri[selJ]*F.km + selJ - F.rp[F.ri[selJ]])}`;
}
function load(){
  const t = document.getElementById("inp").value.trim().split(";").map(r => r.trim().split(/[ ,]+/).filter(x => x !== "").map(Number));
  const e = document.getElementById("err");
  if (t.length < 1 || t.length > 8 || t.some(r => r.length !== t[0].length || r.length > 8 || r.some(x => !Number.isFinite(x))) || t.every(r => r.every(x => x === 0))) { e.textContent = "Legfeljebb 8×8, egyforma hosszú sorok ';'-vel elválasztva, legalább egy nemnulla."; return; }
  e.textContent = ""; DM = t; SEL = null; setSteps(mkSteps(fmts(DM)));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
