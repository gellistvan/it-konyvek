<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUDA és OpenCL fogalmi térképe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--mem:#ececec;--cellhl:#ffd9b8;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--mem:#333;--cellhl:#6a4020;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
input[type=number]{width:7em;font:inherit}
#status,#calc{margin:4px 0 6px;min-height:1.5em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
svg g.it{cursor:pointer}
svg g.it:focus{outline:none}
svg g.it:focus rect{stroke-width:3}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div id="status" aria-live="polite">Kattints (vagy Tab + Enter) egy CUDA- vagy OpenCL-elemre: kiemelődik a párja és a táblázat sora.</div>
<svg id="v" viewBox="0 0 560 470" role="img" aria-label="A CUDA grid–block–warp–thread és az OpenCL NDRange–work-group–sub-group–work-item hierarchia egymás mellett, memóriaterekkel és névcsapdákkal."></svg>
<div class="ctl" role="group" aria-label="Méretkalkulátor">
  <strong>Méretkalkulátor:</strong>
  <label>n (elemszám): <input id="n" type="number" min="1" value="1048576"></label>
  <label>blokk / work-group méret: <input id="b" type="number" min="1" max="1024" value="256"></label>
</div>
<div id="calc" aria-live="polite"></div>
<p class="small">Feltétel: NVIDIA GPU, OpenCL C 1.2; a sub-group csak támogatás esetén. A CUDA gridmérete blokkokban, az OpenCL global_work_size work-itemekben értendő.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
const PAIRS = [["grid", "grid", "NDRange", "exec", "A teljes indextér; CUDA: blokkokban, OpenCL: work-itemekben méretezve."], ["block", "block", "work-group", "exec", "Szinkronizálható egység közös (shared/local) memóriával."], ["warp", "warp (32)", "sub-group*", "exec", "SIMD-végrehajtási egység; OpenCL-ben a méret eszközfüggő, cl_khr_subgroups vagy 2.1+ kell."], ["thread", "thread", "work-item", "exec", "Az egyes végrehajtási egység."], ["kern", "__global__ függvény", "__kernel függvény", "exec", "Kernelfüggvény; OpenCL-ben futásidejű fordítás és cl_kernel objektum."], ["gmem", "global memory", "__global", "mem", "Device-memória, minden szál/work-item látja."], ["smem", "__shared__", "__local", "mem", "A block/work-group közös memóriája."], ["reg", "regiszter /\n„local memory” (spill)", "__private", "mem", "Szálankénti változók; túlcsorduláskor device-memória."], ["cmem", "__constant__", "__constant", "mem", "Csak olvasható, cache-elt címtér."], ["tex", "texture", "image", "mem", "Hasonló cél, eltérő kezelés."]], TRAPS = [["kern", "gmem", "__global__ (CUDA: kernelfüggvény) ≠ __global (OpenCL: címtér)"], ["reg", "smem", "CUDA „local memory” (spill, device-memória) ≠ OpenCL __local (= shared)"]];
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t, par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(par||svg).appendChild(e);return e;}
let sel = null;
function draw(){
  svg.innerHTML = "";
  const L = css("--line"), A = css("--hl2");
  mk("text", {x: 110, y: 20, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "CUDA");
  mk("text", {x: 450, y: 20, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, "OpenCL");
  let y = 50; const ys = {};
  PAIRS.forEach((p, i) => {
    const [k, c, o, grp] = p;
    if (i === 0) mk("text", {x: 10, y: y - 8, "font-size": 12, "font-style": "italic"}, "végrehajtási hierarchia");
    if (grp === "mem" && PAIRS[i - 1][3] === "exec") { y += 14; mk("text", {x: 10, y: y - 8, "font-size": 12, "font-style": "italic"}, "memóriaterek"); }
    const on = sel === k, h = c.includes("\n") ? 40 : 30;
    ys[k] = y + h / 2;
    const tr = TRAPS.filter(t => t[0] === k || t[1] === k);
    [[10, c, "cuda"], [340, o, "ocl"]].forEach(([x, t, side]) => {
      const g = mk("g", {class: "it", tabindex: 0, role: "button", "aria-pressed": on ? "true" : "false", "aria-label": (side === "cuda" ? "CUDA: " : "OpenCL: ") + t.replace("\n", " ")});
      mk("rect", {x: x, y: y, width: 210, height: h, rx: 6, fill: on ? css("--cellhl") : (grp === "mem" ? css("--mem") : css("--cell")), stroke: L, "stroke-width": on ? 2.5 : 1.2}, undefined, g);
      t.split("\n").forEach((s, j, a) => mk("text", {x: x + 105, y: y + h / 2 + 5 + (j - (a.length - 1) / 2) * 15, "text-anchor": "middle", "font-size": 13, "font-family": s.startsWith("__") ? "monospace" : "inherit"}, s, g));
      g.addEventListener("click", () => pick(k));
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(k); } });
    });
    mk("line", {x1: 220, y1: y + h / 2, x2: 340, y2: y + h / 2, stroke: on ? A : L, "stroke-width": on ? 3 : 1.3});
    y += h + 8;
  });
  TRAPS.forEach(([a, b]) => {
    const on = sel === a || sel === b;
    mk("line", {x1: 220, y1: ys[a] - 6, x2: 340, y2: ys[b] + 6, stroke: on ? A : L, "stroke-width": on ? 2.5 : 1.3, "stroke-dasharray": "6 4"});
    mk("circle", {cx: 280, cy: (ys[a] + ys[b]) / 2, r: 9, fill: css("--bg"), stroke: L});
    mk("text", {x: 280, y: (ys[a] + ys[b]) / 2 + 5, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "!");
  });
  svg.setAttribute("viewBox", "0 0 560 " + (y + 4));
}
function pick(k){
  sel = k; draw();
  const p = PAIRS.find(q => q[0] === k);
  const tr = TRAPS.filter(t => t[0] === k || t[1] === k).map(t => " Névcsapda: " + t[2] + ".").join("");
  document.getElementById("status").textContent = "Táblázat sora: " + p[1].replace("\n", " ") + " ↔ " + p[2] + " – " + p[4] + tr;
  const g = [...svg.querySelectorAll("g.it")].find(x => x.getAttribute("aria-pressed") === "true"); if (g) g.focus();
}
function calc(){
  const n = Math.max(1, +document.getElementById("n").value || 1), b = Math.max(1, +document.getElementById("b").value || 1);
  const grid = Math.ceil(n / b), glob = grid * b;
  document.getElementById("calc").textContent = "CUDA: kernel<<<" + grid + ", " + b + ">>> (grid = ⌈n / blokk⌉ = " + grid + " blokk) · OpenCL: global_work_size = " + glob +
    ", local_work_size = " + b + " (" + grid + " work-group" + (glob > n ? "; " + (glob - n) + " felesleges work-item, határellenőrzés kell" : "") + "). Tipikus hiba: OpenCL-ben global = " + grid + " (blokkszám) → csak " + grid + " work-item fut.";
}
["n", "b"].forEach(id => document.getElementById(id).addEventListener("input", calc));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw(); calc();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
