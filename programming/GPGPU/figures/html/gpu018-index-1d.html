<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1D globális index</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N <input type="range" id="n" min="1" max="2048" value="1000" style="width:130px"></label><label>blokkméret <input type="range" id="bs" min="32" max="1024" step="32" value="256" style="width:120px"></label><label>képlet <select id="form"><option value="ok" selected>helyes</option><option value="sw">felcserélt</option></select></label><label><input type="checkbox" id="chk" checked> határellenőrzés</label><label>blockIdx <input type="number" id="bi" min="0" max="3" value="3" style="width:4.5em"></label><label>threadIdx <input type="number" id="ti" min="0" max="255" value="231" style="width:5em"></label><svg width="0" height="0" style="position:absolute"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5"/></pattern></defs></svg><style>.ctl:first-child{display:none}</style></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Helyes képletnél minden elem egyszer, a 3. blokk utolsó 24 szála tétlen; felcserélt képletnél csak 16 elem kap értéket"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sötét = feldolgozott elem, sraffozott = tömbön kívüli tartomány. A blokkok végrehajtási sorrendje nem rögzített; az ábra csak a leképezést mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "", "line": 0}];
const CODE = ["int idx = blockIdx.x * blockDim.x + threadIdx.x;   // helyes", "if (idx < n) {                                     // határellenőrzés", "    c[idx] = a[idx] + b[idx];", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function cfgI(){ const g = id => document.getElementById(id); return {n: +g("n").value, B: +g("bs").value, sw: g("form").value === "sw", chk: g("chk").checked, b: +g("bi").value, t: +g("ti").value}; }
function render(s){
  const c = cfgI(), G = Math.ceil(c.n / c.B), T = G * c.B;
  const bi = document.getElementById("bi"), ti = document.getElementById("ti");
  bi.max = G - 1; ti.max = c.B - 1; if (c.b > G - 1) { bi.value = G - 1; c.b = G - 1; } if (c.t > c.B - 1) { ti.value = c.B - 1; c.t = c.B - 1; }
  const written = new Uint8Array(Math.max(T, c.n)); let idle = 0, oob = 0, mx = 0, proc = 0;
  for (let b = 0; b < G; b++) for (let t = 0; t < c.B; t++) {
    const idx = c.sw ? t * c.B + b : b * c.B + t; mx = Math.max(mx, idx);
    if (idx < c.n) { if (!written[idx]) proc++; written[idx] = 1; } else if (c.chk) idle++; else oob++;
  }
  svg.setAttribute("viewBox", "0 0 640 222"); svg.innerHTML = "";
  const L = Math.max(T, c.n), w = 600 / L, X = i => 20 + i * w;
  el("rect", {x: X(c.n), y: 60, width: Math.max(0, (L - c.n) * w), height: 40, fill: "url(#hatch)", stroke: css("--line")});
  el("rect", {x: 20, y: 60, width: c.n * w, height: 40, fill: css("--cell"), stroke: css("--line")});
  let run = -1;
  for (let i = 0; i <= c.n; i++) { const on = i < c.n && written[i];
    if (on && run < 0) run = i; if (!on && run >= 0) { el("rect", {x: X(run), y: 60, width: Math.max(1.5, (i - run) * w), height: 40, fill: css("--fg")}); run = -1; } }
  for (let b = 0; b < G && G <= 64; b++) { el("line", {x1: X(b * c.B), y1: 50, x2: X(b * c.B), y2: 104, stroke: css("--hl"), "stroke-width": 1}); if (G <= 8) el("text", {x: X(b * c.B + c.B / 2), y: 46, "text-anchor": "middle", "font-size": 11}, b + ". blokk"); }
  el("text", {x: 20, y: 118, "font-size": 11}, "0"); el("text", {x: X(c.n), y: 118, "text-anchor": "middle", "font-size": 11}, String(c.n));
  const idx = c.sw ? c.t * c.B + c.b : c.b * c.B + c.t;
  const inb = idx < c.n;
  if (idx < L) el("path", {d: `M${X(idx + 0.5)},140 l-7,12 h14 z`, fill: css("--hl2")});
  const f = c.sw ? `${c.t} · ${c.B} + ${c.b} = ${idx}` : `${c.b} · ${c.B} + ${c.t} = ${idx}`;
  el("text", {x: 20, y: 172, "font-size": 14, "font-weight": "bold"}, `szál (blockIdx = ${c.b}, threadIdx = ${c.t}): idx = ${f}` + (inb ? "" : (c.chk ? " → tétlen (idx ≥ n)" : " → TÚLÍRÁS")));
  el("text", {x: 20, y: 196, "font-size": 13}, `grid = ${G} blokk, ${T} szál; feldolgozott elem: ${proc}, tétlen szál: ${idle}`);
  el("text", {x: 20, y: 214, "font-size": 13}, `tömbön kívüli írás: ${oob}; legnagyobb index: ${mx}`);
  document.getElementById("status").textContent = `${c.sw ? "felcserélt" : "helyes"} képlet, határellenőrzés ${c.chk ? "be" : "ki"}: feldolgozott elemek ${proc} / ${c.n}, tétlen szálak ${idle}, tömbön kívüli írások ${oob}.`;
  document.getElementById("L0").textContent = c.sw ? "int idx = threadIdx.x * blockDim.x + blockIdx.x;   // FELCSERÉLT (hibás)" : "int idx = blockIdx.x * blockDim.x + threadIdx.x;   // helyes";
  document.getElementById("L1").textContent = c.chk ? "if (idx < n) {                                     // határellenőrzés" : "{                                                  // határellenőrzés NINCS";
}
["n", "bs", "bi", "ti"].forEach(id => document.getElementById(id).addEventListener("input", () => show(k)));
["form", "chk"].forEach(id => document.getElementById(id).addEventListener("change", () => show(k)));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
