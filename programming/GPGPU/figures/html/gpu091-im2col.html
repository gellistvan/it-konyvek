<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>im2col és implicit GEMM</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="impl" type="checkbox" onchange="IMPL=this.checked;render(STEPS[k])"> implicit GEMM (az A elrejtése, indexképlet)</label><span class="small">A csúszka a kimeneti pixelt (p, q ∈ 0…3) választja; kezdőállapot: (0, 0), az ábra a (1, 1)-et mutatja (6. lépés).</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4×4-es bemenet nullkerettel, a kiválasztott kimeneti pixel 3×3-as ablaka, az A mátrix 16×9-es sorai közül a megfelelő sor kiemelve, mellette az Y = A·B kimenet; az x5 kilenc előfordulása sraffozott."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">FP32, NCHW, N = C = 1, H = W = 4, 3×3-as szűrő, stride = 1, pad = 1, K = 2. Az indexek 0-tól számoltak.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 0, "q": 0, "row": 0, "line": 1, "msg": "(p, q) = (0, 0) → az A 0. sora (0-tól) = az ablak kiterítése: 0, 0, 0, 0, x0, x1, 0, x4, x5;  Y[0, k] = A[0, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 0, "q": 1, "row": 1, "line": 1, "msg": "(p, q) = (0, 1) → az A 1. sora (0-tól) = az ablak kiterítése: 0, 0, 0, x0, x1, x2, x4, x5, x6;  Y[1, k] = A[1, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 0, "q": 2, "row": 2, "line": 1, "msg": "(p, q) = (0, 2) → az A 2. sora (0-tól) = az ablak kiterítése: 0, 0, 0, x1, x2, x3, x5, x6, x7;  Y[2, k] = A[2, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 0, "q": 3, "row": 3, "line": 1, "msg": "(p, q) = (0, 3) → az A 3. sora (0-tól) = az ablak kiterítése: 0, 0, 0, x2, x3, 0, x6, x7, 0;  Y[3, k] = A[3, :] · B[:, k]."}, {"p": 1, "q": 0, "row": 4, "line": 1, "msg": "(p, q) = (1, 0) → az A 4. sora (0-tól) = az ablak kiterítése: 0, x0, x1, 0, x4, x5, 0, x8, x9;  Y[4, k] = A[4, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 1, "q": 1, "row": 5, "line": 1, "msg": "(p, q) = (1, 1) → az A 5. sora (0-tól) = az ablak kiterítése: x0, x1, x2, x4, x5, x6, x8, x9, x10;  Y[5, k] = A[5, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 1, "q": 2, "row": 6, "line": 1, "msg": "(p, q) = (1, 2) → az A 6. sora (0-tól) = az ablak kiterítése: x1, x2, x3, x5, x6, x7, x9, x10, x11;  Y[6, k] = A[6, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 1, "q": 3, "row": 7, "line": 1, "msg": "(p, q) = (1, 3) → az A 7. sora (0-tól) = az ablak kiterítése: x2, x3, 0, x6, x7, 0, x10, x11, 0;  Y[7, k] = A[7, :] · B[:, k]."}, {"p": 2, "q": 0, "row": 8, "line": 1, "msg": "(p, q) = (2, 0) → az A 8. sora (0-tól) = az ablak kiterítése: 0, x4, x5, 0, x8, x9, 0, x12, x13;  Y[8, k] = A[8, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 2, "q": 1, "row": 9, "line": 1, "msg": "(p, q) = (2, 1) → az A 9. sora (0-tól) = az ablak kiterítése: x4, x5, x6, x8, x9, x10, x12, x13, x14;  Y[9, k] = A[9, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 2, "q": 2, "row": 10, "line": 1, "msg": "(p, q) = (2, 2) → az A 10. sora (0-tól) = az ablak kiterítése: x5, x6, x7, x9, x10, x11, x13, x14, x15;  Y[10, k] = A[10, :] · B[:, k]. Ebben a sorban x5 is szerepel."}, {"p": 2, "q": 3, "row": 11, "line": 1, "msg": "(p, q) = (2, 3) → az A 11. sora (0-tól) = az ablak kiterítése: x6, x7, 0, x10, x11, 0, x14, x15, 0;  Y[11, k] = A[11, :] · B[:, k]."}, {"p": 3, "q": 0, "row": 12, "line": 1, "msg": "(p, q) = (3, 0) → az A 12. sora (0-tól) = az ablak kiterítése: 0, x8, x9, 0, x12, x13, 0, 0, 0;  Y[12, k] = A[12, :] · B[:, k]."}, {"p": 3, "q": 1, "row": 13, "line": 1, "msg": "(p, q) = (3, 1) → az A 13. sora (0-tól) = az ablak kiterítése: x8, x9, x10, x12, x13, x14, 0, 0, 0;  Y[13, k] = A[13, :] · B[:, k]."}, {"p": 3, "q": 2, "row": 14, "line": 1, "msg": "(p, q) = (3, 2) → az A 14. sora (0-tól) = az ablak kiterítése: x9, x10, x11, x13, x14, x15, 0, 0, 0;  Y[14, k] = A[14, :] · B[:, k]."}, {"p": 3, "q": 3, "row": 15, "line": 1, "msg": "(p, q) = (3, 3) → az A 15. sora (0-tól) = az ablak kiterítése: x10, x11, 0, x14, x15, 0, 0, 0, 0;  Y[15, k] = A[15, :] · B[:, k]."}];
const CODE = ["for (p, q) kimeneti pixel:            // sor = n·PQ + p·Q + q", "    A[sor, c·RS + r·S + s] = x[n, c, p − pad + r, q − pad + s]   (képen kívül: 0)", "Y = A · B                             // (NPQ × CRS) · (CRS × K)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const A = [[null, null, null, null, 0, 1, null, 4, 5], [null, null, null, 0, 1, 2, 4, 5, 6], [null, null, null, 1, 2, 3, 5, 6, 7], [null, null, null, 2, 3, null, 6, 7, null], [null, 0, 1, null, 4, 5, null, 8, 9], [0, 1, 2, 4, 5, 6, 8, 9, 10], [1, 2, 3, 5, 6, 7, 9, 10, 11], [2, 3, null, 6, 7, null, 10, 11, null], [null, 4, 5, null, 8, 9, null, 12, 13], [4, 5, 6, 8, 9, 10, 12, 13, 14], [5, 6, 7, 9, 10, 11, 13, 14, 15], [6, 7, null, 10, 11, null, 14, 15, null], [null, 8, 9, null, 12, 13, null, null, null], [8, 9, 10, 12, 13, 14, null, null, null], [9, 10, 11, 13, 14, 15, null, null, null], [10, 11, null, 14, 15, null, null, null, null]];
let IMPL = false;
function rc(x, y, w, h, t, o){ o = o || {};
  el("rect", {x, y, width: w, height: h, fill: o.hl ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": o.b ? 3 : 0.8});
  if (o.hatch) el("rect", {x, y, width: w, height: h, fill: "url(#hat)", stroke: "none"});
  if (t !== "") el("text", {x: x + w/2, y: y + h/2 + 4, "text-anchor": "middle", "font-size": o.fs || 11}, t); }
function render(s){
  svg.setAttribute("viewBox", "0 0 780 430"); svg.innerHTML = "";
  const d = el("defs", {}); const pt = document.createElementNS(NS, "pattern");
  pt.setAttribute("id", "hat"); pt.setAttribute("width", 6); pt.setAttribute("height", 6); pt.setAttribute("patternUnits", "userSpaceOnUse");
  const ln = document.createElementNS(NS, "path"); ln.setAttribute("d", "M0,6 L6,0"); ln.setAttribute("stroke", css("--muted")); ln.setAttribute("stroke-width", 1);
  pt.appendChild(ln); d.appendChild(pt);
  const c = 30, X0 = 20, Y0 = 40;
  el("text", {x: X0, y: 26, "font-size": 13}, "bemenet 4×4 + pad 1");
  for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) {
    const h = i - 1, w = j - 1, ins = h >= 0 && h < 4 && w >= 0 && w < 4, idx = h * 4 + w;
    const inWin = i >= s.p && i < s.p + 3 && j >= s.q && j < s.q + 3;
    rc(X0 + j*c, Y0 + i*c, c, c, ins ? "x" + idx : "0", {hl: inWin, hatch: ins && idx === 5, fs: 11});
  }
  el("rect", {x: X0 + s.q*c, y: Y0 + s.p*c, width: 3*c, height: 3*c, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  if (!IMPL) {
    const ax = 250, aw = 34, ah = 21;
    el("text", {x: ax, y: 26, "font-size": 13}, "A = im2col(X): 16 × 9");
    for (let i = 0; i < 16; i++) {
      el("text", {x: ax - 6, y: Y0 + i*ah + 15, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, String(i));
      for (let j = 0; j < 9; j++) { const v = A[i][j]; rc(ax + j*aw, Y0 + i*ah, aw, ah, v === null ? "0" : "x" + v, {hl: i === s.row, hatch: v === 5, fs: 10}); }
    }
    el("rect", {x: ax, y: Y0 + s.row*ah, width: 9*aw, height: ah, fill: "none", stroke: css("--hl"), "stroke-width": 3});
    el("text", {x: ax, y: Y0 + 16*ah + 22, "font-size": 12}, "|A| = 144 elem (|X| = 16); az x5 előfordulásai (sraffozva): 9 sorban, összesen 9");
  } else {
    const ax = 250;
    el("text", {x: ax, y: 26, "font-size": 13}, "Implicit GEMM: az A nem készül el");
    el("text", {x: ax, y: 60, "font-size": 12}, `a B-tile-lal szorzott A-sor (sor = p·Q + q = ${s.row}) betöltéskor számolva:`);
    for (let j = 0; j < 9; j++) {
      const r = Math.floor(j/3), sx = j % 3, h = s.p - 1 + r, w = s.q - 1 + sx, v = A[s.row][j];
      el("text", {x: ax, y: 86 + j*22, "font-size": 12, "font-family": "monospace"},
        `oszlop ${j} = c·RS + r·S + s (r=${r}, s=${sx}) → x[0, 0, ${h}, ${w}]` + (v === null ? "  képen kívül → 0" : `  = x${v}`));
    }
  }
  const bx = 690, bw = 34, ah = 21;
  el("text", {x: 588, y: 26, "font-size": 13}, "B: 9 × 2");
  for (let i = 0; i < 9; i++) for (let kk = 0; kk < 2; kk++) rc(588 + kk*bw, Y0 + i*ah, bw, ah, (kk ? "u" : "w") + i, {fs: 10});
  el("text", {x: bx, y: 26, "font-size": 13}, "Y = A·B");
  for (let i = 0; i < 16; i++) for (let kk = 0; kk < 2; kk++) rc(bx + kk*bw, Y0 + i*ah, bw, ah, i === s.row ? "y" + i + "," + kk : "", {hl: i === s.row, fs: 9});
  el("text", {x: X0, y: 260, "font-size": 12}, `kimeneti pixel (p, q) = (${s.p}, ${s.q})`);
  el("text", {x: X0, y: 280, "font-size": 12}, `sor = p·Q + q = ${s.row}`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
