<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radix select két menetben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Kulcsok (hex): <input id="inp" size="52" value="12A0, 3405, 12FF, 1203, 7710, 1250, 3400, 12A1, 0099, 1288" aria-label="Kulcsok hexadecimálisan"></label><label>k: <input id="kk" type="number" min="0" max="15" value="4" style="width:4em" aria-label="k rang, 0 alapú"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A két hisztogram-menet: hisztogram, prefix, célbucket és szűkítés, a current_k és result értékével."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A szemléltetés 16 bites kulcsot (2 menet) használ; a labor 32 bites kulcsánál 4 menet van. Kezdőállapot: a statikus ábra 10 kulcsa, k = 4 (0 alapú).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 0, "ph": 0, "line": 0, "msg": "1. menet: hisztogram a 10 elemű szegmensen (bit_offset = 8)."}, {"p": 0, "ph": 1, "line": 1, "msg": "prefix (exkluzív) számítása; current_k = 4."}, {"p": 0, "ph": 2, "line": 3, "msg": "célbucket 0x12: 1 ≤ 4 < 1 + 6; current_k = 3, result = 0x1200."}, {"p": 0, "ph": 3, "line": 4, "msg": "szűkítés: 6 elem marad (sorrend tetszőleges)."}, {"p": 1, "ph": 0, "line": 0, "msg": "2. menet: hisztogram a 6 elemű szegmensen (bit_offset = 0)."}, {"p": 1, "ph": 1, "line": 1, "msg": "prefix (exkluzív) számítása; current_k = 3."}, {"p": 1, "ph": 2, "line": 3, "msg": "célbucket 0xA0: 3 ≤ 3 < 3 + 1; current_k = 0, result = 0x12A0. Eredmény: 0x12A0 = a rendezett sor 4. indexű eleme."}];
const CODE = ["radixHistogramKernel(d_current, d_hist, bit_offset, current_n);   // 1. hisztogram", "for (b = 0; b < 256; ++b) { if (current_k < prefix + h_hist[b]) { target_bucket = b; break; }", "                            prefix += h_hist[b]; }", "current_k -= prefix;  result |= target_bucket << bit_offset;", "radixFilterKernel(d_current, d_next, d_counter, bit_offset, target_bucket, current_n);  // 4. szűkítés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = {keys: [4768, 13317, 4863, 4611, 30480, 4688, 13312, 4769, 153, 4744], k: 4};
const hx = (v, d) => v.toString(16).toUpperCase().padStart(d, "0");
function sel(keys, k){
  let seg = keys.slice(), ck = k, result = 0; const ps = [];
  for (let bi = 1; bi >= 0; bi--) {
    const off = bi * 8, hist = new Array(256).fill(0); seg.forEach(x => hist[(x >> off) & 255]++);
    let prefix = 0, target = -1; const pre = {};
    for (let b = 0; b < 256; b++) { pre[b] = prefix; if (target < 0 && ck < prefix + hist[b]) target = b; prefix += hist[b]; }
    const kb = ck; ck -= pre[target]; result |= target << off;
    const nxt = seg.filter(x => ((x >> off) & 255) === target);
    ps.push({off, seg, hist, pre, target, kb, ka: ck, result, next: nxt}); seg = nxt;
  }
  return {result, ps};
}
function trace(keys, k){
  const r = sel(keys, k), st = [];
  r.ps.forEach((p, i) => { const tb = p.target;
    st.push({p: i, ph: 0, line: 0, msg: `${i+1}. menet: hisztogram a ${p.seg.length} elemű szegmensen (bit_offset = ${p.off}).`});
    st.push({p: i, ph: 1, line: 1, msg: `prefix (exkluzív) számítása; current_k = ${p.kb}.`});
    st.push({p: i, ph: 2, line: 3, msg: `célbucket 0x${hx(tb,2)}: ${p.pre[tb]} ≤ ${p.kb} < ${p.pre[tb]} + ${p.hist[tb]}; current_k = ${p.ka}, result = 0x${hx(p.result,4)}.`});
    if (i < r.ps.length - 1) st.push({p: i, ph: 3, line: 4, msg: `szűkítés: ${p.next.length} elem marad (sorrend tetszőleges).`});
  });
  st[st.length-1].msg += ` Eredmény: 0x${hx(r.result,4)} = a rendezett sor ${k}. indexű eleme.`;
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 320");
  svg.innerHTML = "";
  const r = sel(CUR.keys, CUR.k), p = r.ps[s.p];
  const bs = []; for (let b = 0; b < 256; b++) if (p.hist[b]) bs.push(b);
  el("text", {x: 10, y: 20, "font-size": 13, "font-weight": "bold"}, `${s.p+1}. menet – ${s.p === 0 ? "felső" : "alsó"} bájt, szegmens: ` + p.seg.map(x => hx(x,4)).join(" "));
  const mx = Math.max(...bs.map(b => p.hist[b])), bw = Math.min(70, 560 / bs.length), x0 = 40, y0 = 220, sc = 130 / mx;
  bs.forEach((b, i) => {
    const tgt = s.ph >= 2 && b === p.target, x = x0 + i * bw;
    el("rect", {x: x + 6, y: y0 - p.hist[b] * sc, width: bw - 12, height: p.hist[b] * sc, fill: tgt ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": tgt ? 3 : 1});
    el("text", {x: x + bw/2, y: y0 + 16, "text-anchor": "middle", "font-size": 13}, hx(b, 2));
    el("text", {x: x + bw/2, y: y0 - p.hist[b] * sc - 6, "text-anchor": "middle", "font-size": 12}, String(p.hist[b]));
    if (s.ph >= 1) el("text", {x: x + bw/2, y: y0 + 34, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "pre " + p.pre[b]);
  });
  el("text", {x: 4, y: y0 + 16, "font-size": 11, fill: css("--muted")}, "bkt");
  const done = s.ph >= 2 ? p.result : (s.p ? r.ps[s.p - 1].result : 0);
  el("text", {x: 10, y: 285, "font-size": 13}, `current_k = ${s.ph >= 2 ? p.ka : p.kb}   prefix → célbucket: ${s.ph >= 2 ? "0x" + hx(p.target, 2) : "?"}   result = 0x${hx(done, 4)}`);
  if (s.ph === 3) el("text", {x: 10, y: 308, "font-size": 12, fill: css("--muted")}, "szűkített szegmens: " + p.next.map(x => hx(x,4)).join(", "));
}
function load(){
  const v = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(x => parseInt(x, 16));
  const kk = +document.getElementById("kk").value, m = document.getElementById("err");
  if (v.length < 1 || v.length > 16 || v.some(x => !Number.isInteger(x) || x < 0 || x > 0xFFFF) || !Number.isInteger(kk) || kk < 0 || kk >= v.length) {
    m.textContent = "1–16 hexadecimális 16 bites kulcs és 0 ≤ k < n kell."; return; }
  m.textContent = ""; CUR = {keys: v, k: kk}; setSteps(trace(v, kk));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
