<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupancy-kalkulátor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--panel:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--panel:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:6px 0}button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:150px}output{display:inline-block;min-width:3.5em;font-weight:bold}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
#out{background:var(--panel);padding:8px;border-radius:6px;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="group" aria-label="Előre beállított esetek">Esetek:
<button data-case="A">(A) 256 szál, 16 reg.</button><button data-case="B">(B) + 32 KiB shared</button>
<button data-case="C">(C) önellenőrző kérdés</button><button data-case="D">(D) CC 8.9, 32 szál</button></div>
<div class="ctl">
<label>CC <select id="cc"></select></label>
<label>blokkméret <input type="range" id="blk" min="32" max="1024" step="32" value="256"> <output id="blkv"></output></label>
<label>regiszter/szál <input type="range" id="reg" min="8" max="255" value="16"> <output id="regv"></output></label>
<label>shared/blokk (KiB) <input type="range" id="sh" min="0" max="228" value="0"> <output id="shv"></output></label>
</div>
<div id="status" aria-live="polite" style="font-weight:bold;margin:4px 0"></div>
<svg id="v" viewBox="0 0 640 230" role="img" aria-label="Négy sáv: szál-, regiszter-, shared- és blokkplafon-korlát; a legrövidebb a szűk keresztmetszet"></svg>
<div id="out"></div>
<p class="small">Regiszter-granularitás 256/warp, shared-tartalék 1 KiB/blokk (CC 8.0+; CC 7.5-ön 0), a carveout a CC maximuma; 65536 regiszter/SM. A CUDA occupancy API (cudaOccupancyMaxActiveBlocksPerMultiprocessor) ugyanígy számol; a valós carveout-beállítás eltérhet.</p>
<script>
const CC = {"7.5": {"thr": 1024, "cap": 16, "smem": 64, "res": 0}, "8.0": {"thr": 2048, "cap": 32, "smem": 164, "res": 1}, "8.6": {"thr": 1536, "cap": 16, "smem": 100, "res": 1}, "8.9": {"thr": 1536, "cap": 24, "smem": 100, "res": 1}, "9.0": {"thr": 2048, "cap": 32, "smem": 228, "res": 1}}, CASES = {"A": ["CC 8.0, 256 szál, 16 reg., 0 shared", ["8.0", 256, 16, 0]], "B": ["CC 8.0, 256 szál, 16 reg., 32 KiB shared", ["8.0", 256, 16, 32]], "C": ["önellenőrző kérdés: CC 8.0, 128 szál, 20 reg.", ["8.0", 128, 20, 0]], "D": ["CC 8.9, 32 szál, 16 reg., 0 shared", ["8.9", 32, 16, 0]]}, NAMES = ["szál-limit", "regiszter-limit", "shared-limit", "blokkplafon"];
const $ = id => document.getElementById(id), svg = $("v"), NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function el(tag, a, t){const e = document.createElementNS(NS, tag); for (const q in a) e.setAttribute(q, a[q]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e;}
Object.keys(CC).forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; $("cc").appendChild(o); });
$("cc").value = "8.0";
function calc(cc, block, reg, sh){
  const p = CC[cc], wpb = Math.ceil(block / 32), maxw = p.thr / 32;
  const lt = Math.floor(maxw / wpb), rpw = Math.ceil(32 * reg / 256) * 256, lr = Math.floor(65536 / (wpb * rpw));
  const ls = sh === 0 ? null : Math.floor(p.smem / (sh + p.res)), lc = p.cap;
  const b = Math.min(lt, lr, ls === null ? Infinity : ls, lc);
  return {lims: [lt, lr, ls, lc], blocks: b, wpb: wpb, maxw: maxw, rpw: rpw, warps: b * wpb, occ: b * wpb / maxw, p: p};
}
function upd(){
  const cc = $("cc").value, blk = +$("blk").value, reg = +$("reg").value, sh = +$("sh").value;
  $("blkv").textContent = blk; $("regv").textContent = reg; $("shv").textContent = sh;
  const r = calc(cc, blk, reg, sh);
  svg.innerHTML = "";
  const xs = 440 / Math.max(64, ...r.lims.filter(v => v !== null));
  r.lims.forEach((v, i) => {
    const y = 14 + i * 50, isMin = v !== null && v === r.blocks;
    el("text", {x: 4, y: y + 22, "font-size": 13}, NAMES[i]);
    if (v === null) { el("text", {x: 120, y: y + 22, "font-size": 13, fill: css("--muted")}, "nincs korlát (0 shared)"); return; }
    el("rect", {x: 120, y: y, width: Math.max(2, v * xs), height: 32, fill: isMin ? css("--hl") : css("--cellhl"), "fill-opacity": isMin ? 0.55 : 1, stroke: css("--line"), "stroke-width": isMin ? 3.5 : 1});
    el("text", {x: 126 + v * xs, y: y + 22, "font-size": 13, "font-weight": isMin ? "bold" : "normal"}, v + (isMin ? "  ◀ min (szűk keresztmetszet)" : ""));
  });
  const pct = Math.round(100 * r.occ);
  $("status").textContent = r.blocks === 0 ? "A blokk nem fér el egy SM-en: 0 rezidens blokk (a kernel nem indítható)." :
    `${r.blocks} rezidens blokk/SM, ${r.warps} / ${r.maxw} aktív warp → occupancy ${pct}%`;
  const p = r.p;
  $("out").textContent =
    `warp/blokk = ⌈${blk} / 32⌉ = ${r.wpb};  max warp/SM = ${p.thr} / 32 = ${r.maxw}\n` +
    `szál-limit      = ⌊${r.maxw} / ${r.wpb}⌋ = ${r.lims[0]}\n` +
    `regiszter-limit = ⌊65536 / (${r.wpb} · ${r.rpw})⌋ = ${r.lims[1]}   (⌈32 · ${reg} / 256⌉ · 256 = ${r.rpw} reg./warp; egyszerű hányados: ⌊65536 / (${blk} · ${reg})⌋ = ${Math.floor(65536 / (blk * reg))})\n` +
    (sh === 0 ? "shared-limit    = – (nincs shared-igény)\n" : `shared-limit    = ⌊${p.smem} / (${sh} + ${p.res})⌋ = ${r.lims[2]}   (carveout ${p.smem} KiB, tartalék ${p.res} KiB/blokk)\n`) +
    `blokkplafon     = ${p.cap}   (CC ${cc})\n` +
    `minimum = ${r.blocks} blokk; aktív warp = ${r.blocks} · ${r.wpb} = ${r.warps}; occupancy = ${r.warps} / ${r.maxw} = ${pct}%`;
}
["blk", "reg", "sh"].forEach(id => $(id).addEventListener("input", upd)); $("cc").addEventListener("change", upd);
document.querySelectorAll("button[data-case]").forEach(b => b.addEventListener("click", () => {
  const c = CASES[b.dataset.case][1]; $("cc").value = c[0]; $("blk").value = c[1]; $("reg").value = c[2]; $("sh").value = c[3]; upd(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
upd();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
