<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online softmax lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>logitok: <input id="ls" value="1 3 2 5 0 4" size="16" aria-label="Logitok"></label><label>V: <input id="lv" value="10 20 30 40 50 60" size="18" aria-label="V-értékek"></label><label>B<sub>c</sub>: <input id="bc" type="range" min="1" max="6" value="3" aria-label="Blokkméret" oninput="BCJ=+this.value;document.getElementById('bcv').textContent=this.value;load()"> <span id="bcv">3</span></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Állapottábla hat logitra: j, s_j, m_new, átskálázó tényező, ℓ, O és O/ℓ; a j = 1 és j = 3 sorban új maximum miatt átskálázás, a végén az eredmény egyezik a kétmenetes softmaxszal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">FP64-es JavaScript-számítás, d = 1 a szemléltetéshez; a -Infinity kezdőérték miatt j = 0-nál a tényező 0. A blokkméret csak a K,V-blokkok határait változtatja, az eredményt nem.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"rows": [], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 0, "msg": "Kezdet: m = −∞, ℓ = 0, O = 0. 2 K,V-blokk (B_c = 3)."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 5, "msg": "j = 0: s = 1,00, m_new = 1,00, skálázó tényező e^(m−m_new) = 0,000; ℓ = 1,000, O = 10,00. Új blokk (1.) betöltése a shared memoryba."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 3, "msg": "j = 1: s = 3,00, m_new = 3,00, skálázó tényező e^(m−m_new) = 0,135 (új maximum: a korábbi ℓ és O átskálázódik); ℓ = 1,135, O = 21,35."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}, {"j": 2, "s": 2.0, "mn": 3.0, "f": 1.0, "l": 1.5032147244080551, "o": 32.389736067509396, "r": 21.54697897884417, "resc": false}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 5, "msg": "j = 2: s = 2,00, m_new = 3,00, skálázó tényező e^(m−m_new) = 1,000; ℓ = 1,503, O = 32,39."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}, {"j": 2, "s": 2.0, "mn": 3.0, "f": 1.0, "l": 1.5032147244080551, "o": 32.389736067509396, "r": 21.54697897884417, "resc": false}, {"j": 3, "s": 5.0, "mn": 5.0, "f": 0.1353352832366127, "l": 1.2034379904932109, "o": 44.38347410465551, "r": 36.88056589144707, "resc": true}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 3, "msg": "j = 3: s = 5,00, m_new = 5,00, skálázó tényező e^(m−m_new) = 0,135 (új maximum: a korábbi ℓ és O átskálázódik); ℓ = 1,203, O = 44,38. Új blokk (2.) betöltése a shared memoryba."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}, {"j": 2, "s": 2.0, "mn": 3.0, "f": 1.0, "l": 1.5032147244080551, "o": 32.389736067509396, "r": 21.54697897884417, "resc": false}, {"j": 3, "s": 5.0, "mn": 5.0, "f": 0.1353352832366127, "l": 1.2034379904932109, "o": 44.38347410465551, "r": 36.88056589144707, "resc": true}, {"j": 4, "s": 0.0, "mn": 5.0, "f": 1.0, "l": 1.2101759374922962, "o": 44.72037145460978, "r": 36.95361151146212, "resc": false}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 5, "msg": "j = 4: s = 0,00, m_new = 5,00, skálázó tényező e^(m−m_new) = 1,000; ℓ = 1,210, O = 44,72."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}, {"j": 2, "s": 2.0, "mn": 3.0, "f": 1.0, "l": 1.5032147244080551, "o": 32.389736067509396, "r": 21.54697897884417, "resc": false}, {"j": 3, "s": 5.0, "mn": 5.0, "f": 0.1353352832366127, "l": 1.2034379904932109, "o": 44.38347410465551, "r": 36.88056589144707, "resc": true}, {"j": 4, "s": 0.0, "mn": 5.0, "f": 1.0, "l": 1.2101759374922962, "o": 44.72037145460978, "r": 36.95361151146212, "resc": false}, {"j": 5, "s": 4.0, "mn": 5.0, "f": 1.0, "l": 1.5780553786637386, "o": 66.79313792489631, "r": 42.326231910476565, "resc": false}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 5, "msg": "j = 5: s = 4,00, m_new = 5,00, skálázó tényező e^(m−m_new) = 1,000; ℓ = 1,578, O = 66,79."}, {"rows": [{"j": 0, "s": 1.0, "mn": 1.0, "f": 0.0, "l": 1.0, "o": 10.0, "r": 10.0, "resc": false}, {"j": 1, "s": 3.0, "mn": 3.0, "f": 0.1353352832366127, "l": 1.1353352832366128, "o": 21.353352832366127, "r": 18.807970779778824, "resc": true}, {"j": 2, "s": 2.0, "mn": 3.0, "f": 1.0, "l": 1.5032147244080551, "o": 32.389736067509396, "r": 21.54697897884417, "resc": false}, {"j": 3, "s": 5.0, "mn": 5.0, "f": 0.1353352832366127, "l": 1.2034379904932109, "o": 44.38347410465551, "r": 36.88056589144707, "resc": true}, {"j": 4, "s": 0.0, "mn": 5.0, "f": 1.0, "l": 1.2101759374922962, "o": 44.72037145460978, "r": 36.95361151146212, "resc": false}, {"j": 5, "s": 4.0, "mn": 5.0, "f": 1.0, "l": 1.5780553786637386, "o": 66.79313792489631, "r": 42.326231910476565, "resc": false}], "s": [1.0, 3.0, 2.0, 5.0, 0.0, 4.0], "v": [10.0, 20.0, 30.0, 40.0, 50.0, 60.0], "bc": 3, "line": 7, "fin": 42.32623191047658, "msg": "Vége: O/ℓ = 42,3262; kétmenetes softmax·V = 42,3262 → egyezik."}];
const CODE = ["for each K,V block (B_c x d) in K,V:", "    load K block and V block into shared memory", "    for each column j in K block:", "        m_new = max(m, s_j)", "        l_new = l * exp(m - m_new) + exp(s_j - m_new)", "        acc   = acc * exp(m - m_new) + V_j * exp(s_j - m_new)", "        m = m_new;  l = l_new", "write O = acc / l"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let BCJ = 3;
function fmt(x, d){ if (x === -Infinity) return "−∞"; return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function trace(s, v, bc){
  let m = -Infinity, l = 0, o = 0; const rows = [], st = [];
  st.push({rows: [], s, v, bc, line: 0, msg: `Kezdet: m = −∞, ℓ = 0, O = 0. ${Math.ceil(s.length / bc)} K,V-blokk (B_c = ${bc}).`});
  for (let j = 0; j < s.length; j++) {
    const mn = Math.max(m, s[j]), f = m === -Infinity ? 0 : Math.exp(m - mn);
    l = l * f + Math.exp(s[j] - mn); o = o * f + v[j] * Math.exp(s[j] - mn);
    rows.push({j, s: s[j], mn, f, l, o, r: o / l, resc: f > 0 && f < 1});
    const blk = j % bc === 0 ? ` Új blokk (${j / bc + 1}.) betöltése a shared memoryba.` : "";
    st.push({rows: rows.slice(), s, v, bc, line: f > 0 && f < 1 ? 3 : 5,
      msg: `j = ${j}: s = ${fmt(s[j], 2)}, m_new = ${fmt(mn, 2)}, skálázó tényező e^(m−m_new) = ${fmt(f, 3)}` +
           (f > 0 && f < 1 ? " (új maximum: a korábbi ℓ és O átskálázódik)" : "") + `; ℓ = ${fmt(l, 3)}, O = ${fmt(o, 2)}.` + blk});
    m = mn;
  }
  const mx = Math.max(...s), p = s.map(x => Math.exp(x - mx)), sp = p.reduce((a, b) => a + b, 0);
  const two = p.reduce((a, pi, i) => a + pi * v[i], 0) / sp;
  st.push({rows: rows.slice(), s, v, bc, line: 7, fin: two,
    msg: `Vége: O/ℓ = ${fmt(o / l, 4)}; kétmenetes softmax·V = ${fmt(two, 4)} → ${Math.abs(o / l - two) < 1e-9 * Math.max(1, Math.abs(two)) ? "egyezik" : "ELTÉR"}.`});
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 340"); svg.innerHTML = "";
  const cx = [30, 80, 150, 240, 370, 470, 590, 700], hd = ["j", "s_j", "m_new", "e^(m−m_new)", "ℓ", "O", "O/ℓ"];
  hd.forEach((h, i) => el("text", {x: (cx[i] + cx[i+1]) / 2, y: 24, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, h));
  el("line", {x1: 30, x2: 700, y1: 32, y2: 32, stroke: css("--line")});
  const rh = 30;
  s.rows.forEach((r, n) => {
    const y = 40 + n * rh;
    if (r.resc) el("rect", {x: 30, y: y, width: 670, height: rh - 4, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2.5});
    [String(r.j), fmt(r.s, 2), fmt(r.mn, 2), fmt(r.f, 3), fmt(r.l, 3), fmt(r.o, 2), fmt(r.r, 4)].forEach((t, i) =>
      el("text", {x: (cx[i] + cx[i+1]) / 2, y: y + 18, "text-anchor": "middle", "font-size": 13}, t));
    if ((r.j + 1) % s.bc === 0 && r.j + 1 < s.s.length) el("line", {x1: 30, x2: 700, y1: y + rh - 2, y2: y + rh - 2, stroke: css("--line"), "stroke-dasharray": "6 4", "stroke-width": 1.5});
  });
  if (s.fin !== undefined) {
    const y = 50 + s.rows.length * rh;
    el("text", {x: 30, y: y + 14, "font-size": 13}, `kétmenetes softmax·V = ${fmt(s.fin, 4)}  (vastag keret = átskálázás, szaggatott = blokkhatár)`);
  }
}
function load(){
  const sv = document.getElementById("ls").value.split(/[ ,;]+/).filter(x => x).map(x => Number(x.replace(",", ".")));
  const vv = document.getElementById("lv").value.split(/[ ;]+|,\s+/).filter(x => x).map(x => Number(x.replace(",", ".")));
  const er = document.getElementById("err");
  if (sv.length < 1 || sv.length > 8 || sv.length !== vv.length || sv.concat(vv).some(x => !isFinite(x))) { er.textContent = "1–8 logit és ugyanannyi V-érték kell."; return; }
  er.textContent = ""; setSteps(trace(sv, vv, Math.min(BCJ, sv.length)));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
