<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konstans cache kiszolgálás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Index: <select id="ex" onchange="pick()" aria-label="Indexkifejezés"><option value="0">c_params[0]</option><option value="tid % 2">c_params[tid % 2]</option><option value="tid % 4" selected>c_params[tid % 4]</option><option value="tid % 32">c_params[tid % 32]</option><option value="tid / 8">c_params[tid / 8]</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A warp 32 szála nyilakkal a c_params elemeire mutat; a különböző címek egymás után, sorosítva kerülnek kiszolgálásra."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: c_params[tid % 4] – 4 különböző cím, 4 sorosított kiszolgálás (a statikus ábra c) panelje). Sematikus; a szabály a CUDA Programming Guide konstans memóriára vonatkozó leírásán alapul.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"srv": 0, "line": 0, "msg": "c_params[tid % 4]: 4 különböző cím → 4 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 8 szál (0…28)"}, {"srv": 2, "line": 1, "msg": "2. kiszolgálás: c_params[1] → 8 szál (1…29)"}, {"srv": 3, "line": 1, "msg": "3. kiszolgálás: c_params[2] → 8 szál (2…30)"}, {"srv": 4, "line": 1, "msg": "4. kiszolgálás: c_params[3] → 8 szál (3…31)"}];
const CODE = ["__constant__ float c_params[32];", "float p = c_params[INDEX];   // egy warp 32 szála egyszerre kér"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"0": [{"srv": 0, "line": 0, "msg": "c_params[0]: 1 különböző cím → 1 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 32 szál (0…31) – broadcast"}], "tid % 2": [{"srv": 0, "line": 0, "msg": "c_params[tid % 2]: 2 különböző cím → 2 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 16 szál (0…30)"}, {"srv": 2, "line": 1, "msg": "2. kiszolgálás: c_params[1] → 16 szál (1…31)"}], "tid % 4": [{"srv": 0, "line": 0, "msg": "c_params[tid % 4]: 4 különböző cím → 4 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 8 szál (0…28)"}, {"srv": 2, "line": 1, "msg": "2. kiszolgálás: c_params[1] → 8 szál (1…29)"}, {"srv": 3, "line": 1, "msg": "3. kiszolgálás: c_params[2] → 8 szál (2…30)"}, {"srv": 4, "line": 1, "msg": "4. kiszolgálás: c_params[3] → 8 szál (3…31)"}], "tid % 32": [{"srv": 0, "line": 0, "msg": "c_params[tid % 32]: 32 különböző cím → 32 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 1 szál (0…0)"}, {"srv": 2, "line": 1, "msg": "2. kiszolgálás: c_params[1] → 1 szál (1…1)"}, {"srv": 3, "line": 1, "msg": "3. kiszolgálás: c_params[2] → 1 szál (2…2)"}, {"srv": 4, "line": 1, "msg": "4. kiszolgálás: c_params[3] → 1 szál (3…3)"}, {"srv": 5, "line": 1, "msg": "5. kiszolgálás: c_params[4] → 1 szál (4…4)"}, {"srv": 6, "line": 1, "msg": "6. kiszolgálás: c_params[5] → 1 szál (5…5)"}, {"srv": 7, "line": 1, "msg": "7. kiszolgálás: c_params[6] → 1 szál (6…6)"}, {"srv": 8, "line": 1, "msg": "8. kiszolgálás: c_params[7] → 1 szál (7…7)"}, {"srv": 9, "line": 1, "msg": "9. kiszolgálás: c_params[8] → 1 szál (8…8)"}, {"srv": 10, "line": 1, "msg": "10. kiszolgálás: c_params[9] → 1 szál (9…9)"}, {"srv": 11, "line": 1, "msg": "11. kiszolgálás: c_params[10] → 1 szál (10…10)"}, {"srv": 12, "line": 1, "msg": "12. kiszolgálás: c_params[11] → 1 szál (11…11)"}, {"srv": 13, "line": 1, "msg": "13. kiszolgálás: c_params[12] → 1 szál (12…12)"}, {"srv": 14, "line": 1, "msg": "14. kiszolgálás: c_params[13] → 1 szál (13…13)"}, {"srv": 15, "line": 1, "msg": "15. kiszolgálás: c_params[14] → 1 szál (14…14)"}, {"srv": 16, "line": 1, "msg": "16. kiszolgálás: c_params[15] → 1 szál (15…15)"}, {"srv": 17, "line": 1, "msg": "17. kiszolgálás: c_params[16] → 1 szál (16…16)"}, {"srv": 18, "line": 1, "msg": "18. kiszolgálás: c_params[17] → 1 szál (17…17)"}, {"srv": 19, "line": 1, "msg": "19. kiszolgálás: c_params[18] → 1 szál (18…18)"}, {"srv": 20, "line": 1, "msg": "20. kiszolgálás: c_params[19] → 1 szál (19…19)"}, {"srv": 21, "line": 1, "msg": "21. kiszolgálás: c_params[20] → 1 szál (20…20)"}, {"srv": 22, "line": 1, "msg": "22. kiszolgálás: c_params[21] → 1 szál (21…21)"}, {"srv": 23, "line": 1, "msg": "23. kiszolgálás: c_params[22] → 1 szál (22…22)"}, {"srv": 24, "line": 1, "msg": "24. kiszolgálás: c_params[23] → 1 szál (23…23)"}, {"srv": 25, "line": 1, "msg": "25. kiszolgálás: c_params[24] → 1 szál (24…24)"}, {"srv": 26, "line": 1, "msg": "26. kiszolgálás: c_params[25] → 1 szál (25…25)"}, {"srv": 27, "line": 1, "msg": "27. kiszolgálás: c_params[26] → 1 szál (26…26)"}, {"srv": 28, "line": 1, "msg": "28. kiszolgálás: c_params[27] → 1 szál (27…27)"}, {"srv": 29, "line": 1, "msg": "29. kiszolgálás: c_params[28] → 1 szál (28…28)"}, {"srv": 30, "line": 1, "msg": "30. kiszolgálás: c_params[29] → 1 szál (29…29)"}, {"srv": 31, "line": 1, "msg": "31. kiszolgálás: c_params[30] → 1 szál (30…30)"}, {"srv": 32, "line": 1, "msg": "32. kiszolgálás: c_params[31] → 1 szál (31…31)"}], "tid / 8": [{"srv": 0, "line": 0, "msg": "c_params[tid / 8]: 4 különböző cím → 4 kiszolgálási lépés; shared memóriában ugyanez 1 lépés"}, {"srv": 1, "line": 1, "msg": "1. kiszolgálás: c_params[0] → 8 szál (0…7)"}, {"srv": 2, "line": 1, "msg": "2. kiszolgálás: c_params[1] → 8 szál (8…15)"}, {"srv": 3, "line": 1, "msg": "3. kiszolgálás: c_params[2] → 8 szál (16…23)"}, {"srv": 4, "line": 1, "msg": "4. kiszolgálás: c_params[3] → 8 szál (24…31)"}]};
let EX = "tid % 4";
function idxOf(e, t){ return e === "0" ? 0 : e === "tid % 2" ? t % 2 : e === "tid % 4" ? t % 4 : e === "tid % 32" ? t % 32 : Math.floor(t / 8); }
function render(s){
  svg.setAttribute("viewBox", "0 0 720 330"); svg.innerHTML = "";
  const idx = Array.from({length: 32}, (_, t) => idxOf(EX, t)), addrs = [...new Set(idx)].sort((a, b) => a - b);
  const cur = s.srv > 0 ? addrs[s.srv - 1] : -1, done = new Set(addrs.slice(0, s.srv));
  const nE = Math.max(4, Math.max(...addrs) + 1), ew = Math.min(60, 680 / nE);
  for (let t = 0; t < 32; t++) {
    const x = 20 + t * 21.5 + 10, a = idx[t], ex = 20 + a * ew + ew / 2;
    el("line", {x1: x, y1: 60, x2: ex, y2: 170, stroke: a === cur ? css("--hl2") : css("--muted"), "stroke-width": a === cur ? 2 : .6, opacity: a === cur || cur < 0 ? 1 : .35});
    el("circle", {cx: x, cy: 50, r: 8, fill: a === cur ? css("--hl2") : done.has(a) ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    el("text", {x, y: 30, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, t);
  }
  for (let a = 0; a < nE; a++) {
    const used = addrs.includes(a);
    el("rect", {x: 20 + a * ew, y: 170, width: ew - 2, height: 30, fill: a === cur ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": used ? 2 : .5});
    el("text", {x: 20 + a * ew + ew / 2 - 1, y: 190, "text-anchor": "middle", "font-size": Math.min(12, ew * .45)}, "[" + a + "]");
  }
  el("text", {x: 20, y: 18, "font-size": 12}, "warp szálai (0–31)");
  el("text", {x: 20, y: 236, "font-size": 12}, "kiszolgálási sorrend (egy doboz = egy sorosított lépés)");
  addrs.forEach((a, k) => { const bw = Math.min(40, 680 / addrs.length);
    el("rect", {x: 20 + k * bw, y: 245, width: bw - 3, height: 26, fill: k < s.srv ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": k === s.srv - 1 ? 3 : 1});
    if (bw > 16) el("text", {x: 20 + k * bw + bw / 2 - 1.5, y: 263, "text-anchor": "middle", "font-size": 11}, k + 1); });
  el("text", {x: 20, y: 300, "font-size": 13}, `kiszolgálási lépések (konstans cache): ${addrs.length}   ·   shared memóriában: 1`);
  el("text", {x: 20, y: 320, "font-size": 11, fill: css("--muted")}, "sematikus; a pontos késleltetés architektúrafüggő");
}
function pick(){ EX = document.getElementById("ex").value; setSteps(ALL[EX]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
