<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statikus és dinamikus munkakiosztás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sorköltségek: <input id="cost" value="1, 1, 10, 1, 1, 1, 1, 1, 1" size="28" aria-label="Sorköltségek"></label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két Gantt-sáv: statikus kiosztásnál a B2 12 egységig dolgozik, dinamikus kiosztásnál 10 egység a teljes idő."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modellidő, nem mérés; egy lépés = egy atomicAdd. Kezdőállapot: 3 blokk, 9 sor, a 2. sor 10 egység.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "line": 0, "msg": "Kezdés: globalWorkCounter = 0 (a host nullázta), 3 rezidens blokk, 9 sor"}, {"n": 1, "line": 1, "msg": "t = 0: B0 atomicAdd → row = 0 (költség 1); számláló = 1"}, {"n": 2, "line": 1, "msg": "t = 0: B1 atomicAdd → row = 1 (költség 1); számláló = 2"}, {"n": 3, "line": 1, "msg": "t = 0: B2 atomicAdd → row = 2 (költség 10); számláló = 3"}, {"n": 4, "line": 1, "msg": "t = 1: B0 atomicAdd → row = 3 (költség 1); számláló = 4"}, {"n": 5, "line": 1, "msg": "t = 1: B1 atomicAdd → row = 4 (költség 1); számláló = 5"}, {"n": 6, "line": 1, "msg": "t = 2: B0 atomicAdd → row = 5 (költség 1); számláló = 6"}, {"n": 7, "line": 1, "msg": "t = 2: B1 atomicAdd → row = 6 (költség 1); számláló = 7"}, {"n": 8, "line": 1, "msg": "t = 3: B0 atomicAdd → row = 7 (költség 1); számláló = 8"}, {"n": 9, "line": 1, "msg": "t = 3: B1 atomicAdd → row = 8 (költség 1); számláló = 9"}, {"n": 10, "line": 3, "msg": "t = 4: B0 atomicAdd → row = 9 ≥ numRows = 9 → a blokk kilép; számláló = 10"}, {"n": 11, "line": 3, "msg": "t = 4: B1 atomicAdd → row = 10 ≥ numRows = 9 → a blokk kilép; számláló = 11"}, {"n": 12, "line": 3, "msg": "t = 10: B2 atomicAdd → row = 11 ≥ numRows = 9 → a blokk kilép; számláló = 12 · Vége: statikus 12, dinamikus 10 egység"}];
const CODE = ["while (true) {", "  if (threadIdx.x == 0) row = atomicAdd(&globalWorkCounter, 1u);", "  __syncthreads();", "  if (row >= numRows) break;      // nincs több munka: a blokk kilép", "  ... a sor összegzése, blokkon belüli redukció ...", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let COSTS = [1, 1, 10, 1, 1, 1, 1, 1, 1];
const NB = 3;
function stat(c){ const segs = [], end = []; for (let b = 0; b < NB; b++){ let t = 0; for (let r = b; r < c.length; r += NB){ segs.push([b, r, t, t + c[r]]); t += c[r]; } end.push(t);} return {segs, end}; }
function dyn(c){ const free = new Array(NB).fill(0), alive = new Array(NB).fill(true), segs = [], reqs = []; let cnt = 0;
  while (alive.some(x => x)) { let b = -1; for (let i = 0; i < NB; i++) if (alive[i] && (b < 0 || free[i] < free[b])) b = i;
    const t = free[b], row = cnt++; reqs.push({b, t, row, counter: cnt, exit: row >= c.length});
    if (row >= c.length) alive[b] = false; else { segs.push([b, row, t, t + c[row]]); free[b] = t + c[row]; } }
  return {segs, end: free, reqs, cnt}; }
function render(s){
  const S = stat(COSTS), D = dyn(COSTS), T = Math.max(...S.end, ...D.end, 1);
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = "";
  const x0 = 50, sc = 620 / T;
  function panel(y0, title, segs, ends, upto, fin){
    el("text", {x: 10, y: y0 - 8, "font-size": 13, "font-weight": "bold"}, title);
    for (let b = 0; b < NB; b++) { el("text", {x: 12, y: y0 + b * 32 + 20, "font-size": 12}, "B" + b);
      el("line", {x1: x0, x2: x0 + T * sc, y1: y0 + b * 32 + 15, y2: y0 + b * 32 + 15, stroke: css("--muted"), "stroke-dasharray": "2 3"}); }
    segs.forEach((g, i) => { if (upto !== undefined && i >= upto) return;
      const [b, r, a, e] = g, y = y0 + b * 32 + 3, lng = COSTS[r] > 1;
      el("rect", {x: x0 + a * sc, y, width: (e - a) * sc, height: 24, fill: lng ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": lng ? 2 : 1});
      el("text", {x: x0 + (a + e) / 2 * sc, y: y + 17, "text-anchor": "middle", "font-size": 12}, String(r)); });
    if (fin) { const E = Math.max(...ends); el("line", {x1: x0 + E * sc, x2: x0 + E * sc, y1: y0 - 4, y2: y0 + NB * 32, stroke: css("--line"), "stroke-dasharray": "6 3", "stroke-width": 1.5}); el("text", {x: x0 + E * sc - 4, y: y0 - 8, "font-size": 12, "text-anchor": "end"}, "vége: " + E); }
  }
  panel(30, "Statikus (b, b+3, b+6)", S.segs, S.end, undefined, true);
  const done = s.n, served = D.reqs.slice(0, done).filter(r => !r.exit).length;
  panel(170, "Dinamikus (atomicAdd)", D.segs, D.end, served, done >= D.reqs.length);
  if (done > 0) { const r = D.reqs[done - 1]; el("rect", {x: 6, y: 170 + r.b * 32 + 3, width: 30, height: 24, fill: "none", stroke: css("--hl2"), "stroke-width": 3});
    if (r.exit) el("text", {x: x0 + r.t * sc + 4, y: 170 + r.b * 32 + 20, "font-size": 12, fill: css("--hl2")}, "kilép (row = " + r.row + ")"); }
  el("text", {x: 10, y: 300, "font-size": 13}, "globalWorkCounter = " + (done ? D.reqs[done - 1].counter : 0) + (done >= D.reqs.length ? "  (= sorok + " + NB + " kilépő kérés)" : ""));
  el("text", {x: 10, y: 322, "font-size": 11, fill: css("--muted")}, "modellidő, nem mérés; egyenlő időben a kisebb blokkindex kér előbb");
}
function load(){
  const v = document.getElementById("cost").value.split(/[ ,;]+/).filter(x => x).map(Number), e = document.getElementById("err");
  if (v.length < 1 || v.length > 20 || v.some(x => !Number.isInteger(x) || x < 1 || x > 20)) { e.textContent = "1–20 db, 1–20 közötti egész költség."; return; }
  e.textContent = ""; COSTS = v; const D = dyn(v), S = stat(v);
  const st = [{n: 0, line: 0, msg: `Kezdés: globalWorkCounter = 0, ${NB} rezidens blokk, ${v.length} sor`}];
  D.reqs.forEach((r, k) => st.push({n: k + 1, line: r.exit ? 3 : 1, msg: r.exit ? `t = ${r.t}: B${r.b} atomicAdd → row = ${r.row} ≥ numRows = ${v.length} → a blokk kilép; számláló = ${r.counter}` : `t = ${r.t}: B${r.b} atomicAdd → row = ${r.row} (költség ${v[r.row]}); számláló = ${r.counter}`}));
  st[st.length - 1].msg += ` · Vége: statikus ${Math.max(...S.end)}, dinamikus ${Math.max(...D.end)} egység`;
  setSteps(st);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
