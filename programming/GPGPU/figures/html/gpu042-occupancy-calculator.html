<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupancy-kalkulátor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 8px}
input[type=range]{width:150px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
table{border-collapse:collapse;font-size:13px;margin-top:6px}
td,th{border:1px solid var(--muted);padding:2px 8px;text-align:right}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label>Hardver: <select id="hw" aria-label="Hardver"><option value="did">didaktikus SM (2048 szál, 32 blokk)</option><option value="3080">RTX 3080 (1536 szál, 16 blokk)</option></select></label>
</div>
<div class="ctl">
  <label>blokkméret: <input id="tb" type="range" min="32" max="1024" step="32" value="256" aria-label="blokkméret"> <span id="tbv"></span></label>
  <label>regiszter/szál: <input id="rt" type="range" min="8" max="255" step="1" value="64" aria-label="regiszter szálanként"> <span id="rtv"></span></label>
  <label>shared/blokk (KiB): <input id="sb" type="range" min="0" max="100" step="1" value="0" aria-label="shared memory blokkonként KiB-ban"> <span id="sbv"></span></label>
</div>
<div class="ctl" role="group" aria-label="Előbeállítások"><button onclick="preset('p1')">12.1.3/1</button> <button onclick="preset('p2')">12.1.3/2</button> <button onclick="preset('p3')">12.1.3/3</button> <button onclick="preset('p4')">12.1.3/4</button> <button onclick="preset('self')">Önellenőrző</button> <button onclick="preset('self10')">Önellenőrző, 10 KiB</button> <button onclick="preset('rtx')">RTX 3080 (labor)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 330" role="img" aria-label="A négy blokkszám-korlát vízszintes oszlopként, a minimum függőleges vonallal, alatta a warp-rács kitöltése."></svg>
<div id="tab"></div>
<p class="small">Didaktikus modell a fejezet képleteivel, allokációs granularitás nélkül: B = min(B_T, B_R, B_S, B_slot), W_b = ⌈T_b/32⌉, O = B·W_b/W_max. A pontos érték a cudaOccupancyMaxActiveBlocksPerMultiprocessor. Mindkét hardveren 65 536 regiszter és 100 KiB shared memory/SM.</p>
<script>
const HW = {"did": {"name": "didaktikus SM", "T": 2048, "slot": 32, "R": 65536, "S": 100}, "3080": {"name": "RTX 3080 (CC 8.6)", "T": 1536, "slot": 16, "R": 65536, "S": 100}}, PRE = {"p1": {"label": "12.1.3/1", "hw": "did", "tb": 256, "rt": 64, "sb": 0}, "p2": {"label": "12.1.3/2", "hw": "did", "tb": 256, "rt": 32, "sb": 0}, "p3": {"label": "12.1.3/3", "hw": "did", "tb": 32, "rt": 14, "sb": 0}, "p4": {"label": "12.1.3/4", "hw": "did", "tb": 256, "rt": 32, "sb": 40}, "self": {"label": "Önellenőrző", "hw": "did", "tb": 192, "rt": 40, "sb": 20}, "self10": {"label": "Önellenőrző, 10 KiB", "hw": "did", "tb": 192, "rt": 40, "sb": 10}, "rtx": {"label": "RTX 3080 (labor)", "hw": "3080", "tb": 1024, "rt": 14, "sb": 0}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function $(id){ return document.getElementById(id); }
function pct(x){ const v = 100 * x, r = Math.round(v * 1000) / 1000; return (Math.abs(v - r) < 1e-9 ? r.toString() : v.toFixed(1)).replace(".", ",") + "%"; }
function occ(h, tb, rt, sb){
  const bt = Math.floor(h.T / tb), br = Math.floor(h.R / (rt * tb)), bs = sb === 0 ? Infinity : Math.floor(h.S / sb);
  const b = Math.min(bt, br, bs, h.slot), wb = Math.ceil(tb / 32), wmax = h.T / 32;
  return {BT: bt, BR: br, BS: bs, Bslot: h.slot, B: b, Wb: wb, W: b * wb, Wmax: wmax, O: b * wb / wmax};
}
function preset(id){ const p = PRE[id]; $("hw").value = p.hw; $("tb").value = p.tb; $("rt").value = p.rt; $("sb").value = p.sb; draw(); }
function draw(){
  const h = HW[$("hw").value], tb = +$("tb").value, rt = +$("rt").value, sb = +$("sb").value;
  $("tbv").textContent = tb; $("rtv").textContent = rt; $("sbv").textContent = sb;
  const r = occ(h, tb, rt, sb), top = Math.max(64, h.slot);
  svg.innerHTML = "";
  const X = v => 140 + Math.min(v, top) / top * 540;
  const names = [["B_T", "BT", "szál"], ["B_R", "BR", "regiszter"], ["B_S", "BS", "shared"], ["B_slot", "Bslot", "blokkslot"]];
  names.forEach((n, i) => {
    const v = r[n[1]], lim = v === r.B, y = 12 + i * 34;
    el("rect", {x: 140, y: y, width: X(v) - 140, height: 24, fill: lim ? css("--cellhl") : css("--cell"), stroke: lim ? css("--hl2") : css("--fg"), "stroke-width": lim ? 3 : 1});
    el("text", {x: 134, y: y + 17, "text-anchor": "end", "font-size": 13}, n[0] + " (" + n[2] + ")");
    el("text", {x: X(v) + 6, y: y + 17, "font-size": 13, "font-weight": lim ? "bold" : "normal"}, (v === Infinity ? "∞" : String(v)) + (v > top ? " →" : "") + (lim ? "  korlát" : ""));
  });
  el("line", {x1: X(r.B), y1: 6, x2: X(r.B), y2: 150, stroke: css("--fg"), "stroke-width": 3});
  for (let t = 0; t <= top; t += 16) el("text", {x: X(t), y: 166, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, String(t));
  el("text", {x: 410, y: 180, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "blokk/SM");
  // warp-rács
  const cols = 16, cw = 540 / cols;
  for (let w = 0; w < r.Wmax; w++) {
    const row = Math.floor(w / cols), col = w % cols, x = 140 + col * cw, y = 196 + row * 26;
    if (w < r.W) { const blk = Math.floor(w / r.Wb); el("rect", {x: x, y: y, width: cw, height: 26, fill: blk % 2 ? "url(#hz)" : css("--muted"), stroke: css("--fg"), "stroke-width": 0.6}); }
    else el("rect", {x: x, y: y, width: cw, height: 26, fill: css("--cell"), stroke: css("--muted"), "stroke-width": 0.5});
  }
  el("text", {x: 134, y: 214, "text-anchor": "end", "font-size": 12}, "warp-rács");
  el("text", {x: 134, y: 230, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, `(${r.Wmax} hely)`);
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
  const which = names.filter(n => r[n[1]] === r.B).map(n => n[0]).join(" = ");
  $("status").textContent = `B_T = ${r.BT}, B_R = ${r.BR}, B_S = ${r.BS === Infinity ? "∞" : r.BS}, B_slot = ${r.Bslot} → B = ${r.B} (korlát: ${which}); W_b = ${r.Wb}, aktív warp = ${r.W}/${r.Wmax}, O = ${pct(r.O)}`;
  // labor-táblázat az aktuális hardverrel és erőforrásigénnyel
  let t = `<table aria-label="Occupancy blokkméretenként"><tr><th>blokkméret</th><th>B</th><th>warp/SM</th><th>O</th><th>korlát</th></tr>`;
  [32, 64, 128, 256, 512, 1024].forEach(b => { const q = occ(h, b, rt, sb); const lim = names.filter(n => q[n[1]] === q.B).map(n => n[0]).join(", "); t += `<tr><td>${b}</td><td>${q.B}</td><td>${q.W}</td><td>${pct(q.O)}</td><td style="text-align:left">${lim}</td></tr>`; });
  $("tab").innerHTML = t + `</table><div class="small">Blokkméret-táblázat a választott hardverrel, ${rt} regiszter/szál és ${sb} KiB shared/blokk mellett (RTX 3080, 14 regiszter: a 12.1.7 várt oszlopa).</div>`;
}
["hw", "tb", "rt", "sb"].forEach(id => $(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
