<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hierarchikus csempézés és halo-csere</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label for="cs">Klaszterméret (__cluster_dims__):</label><select id="cs" onchange="setCS(this.value)"><option>1</option><option>2</option><option selected>4</option></select></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="8 csempe két 4 blokkos klaszterben; a klaszteren belüli halo DSM-ből, a klaszterek közötti globális memóriából érkezik grid.sync után."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">64 × 32-es rács, 16 × 16-os csempék, 5 pontos Jacobi-stencil (9.4.4). Szemléltetés, CC 9.0+; a klaszter + kooperatív indítás együttes támogatását ellenőrizni kell (9.4.2).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ph": 0, "line": 0, "msg": "1/7 betöltés (csempe → shared)."}, {"ph": 1, "line": 1, "msg": "2/7 cluster.sync() #1."}, {"ph": 2, "line": 2, "msg": "3/7 DSM-halo olvasás – a klaszteren belüli szomszédok shared memóriájából."}, {"ph": 3, "line": 3, "msg": "4/7 cluster.sync() #2."}, {"ph": 4, "line": 4, "msg": "5/7 számítás (Jacobi-lépés)."}, {"ph": 5, "line": 5, "msg": "6/7 szélső cellák → global."}, {"ph": 6, "line": 6, "msg": "7/7 grid.sync()."}];
const CODE = ["tile[ly][lx] = u[gy][gx];                  // 1. saját csempe → shared", "cluster.sync();                            // 2. #1: a szomszéd csempék shared memóriája kész", "halo = cluster.map_shared_rank(tile, r±1)  // klaszteren belül: DSM; különben u[...] (global)", "cluster.sync();                            //    #2: a távoli olvasások vége (kilépés/felülírás ellen)", "unew = 0.25f * (N + S + W + E);            // 3. Jacobi-lépés a belső cellákra", "u_out[...] = szélső cellák;                // 4. klaszterhatár: global írás", "grid.sync();                               //    minden klaszter írt → következő iteráció"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SELT = [1, 0], CS = 4;
const PH = ["betöltés (csempe → shared)", "cluster.sync() #1", "DSM-halo olvasás", "cluster.sync() #2", "számítás (Jacobi-lépés)", "szélső cellák → global", "grid.sync()"];
function src(tx, ty, cs){
  const me = ty * 4 + tx, o = {};
  [["bal", -1, 0], ["jobb", 1, 0], ["felső", 0, -1], ["alsó", 0, 1]].forEach(([s, dx, dy]) => {
    const nx = tx + dx, ny = ty + dy;
    if (nx < 0 || nx >= 4 || ny < 0 || ny >= 2) o[s] = "perem";
    else o[s] = Math.floor((ny * 4 + nx) / cs) === Math.floor(me / cs) ? "DSM" : "global";
  });
  return o;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 420");
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="pd" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="${css("--fg")}"/></pattern><pattern id="ps" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.3"/></pattern>`;
  const c = 8, x0 = 40, y0 = 30, T = 16;
  for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 4; tx++) {
    const b = ty * 4 + tx, on = SELT[0] === tx && SELT[1] === ty;
    const r = el("rect", {x: x0 + tx * T * c, y: y0 + ty * T * c, width: T * c, height: T * c, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), style: "cursor:pointer"});
    r.addEventListener("click", () => { SELT = [tx, ty]; render(s); });
    const t = el("text", {x: x0 + tx * T * c + T * c / 2, y: y0 + ty * T * c + T * c / 2, "text-anchor": "middle", "font-size": 12, style: "pointer-events:none"}, "blokk " + b);
    el("text", {x: x0 + tx * T * c + T * c / 2, y: y0 + ty * T * c + T * c / 2 + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted"), style: "pointer-events:none"}, "klaszter " + Math.floor(b / CS) + ", rang " + (b % CS));
  }
  for (let k = 0; k < 8 / CS; k++) {
    const b0 = k * CS, tx = b0 % 4, ty = Math.floor(b0 / 4);
    el("rect", {x: x0 + tx * T * c, y: y0 + ty * T * c, width: CS * T * c, height: T * c, fill: "none", stroke: css("--fg"), "stroke-width": 4, style: "pointer-events:none"});
  }
  const [sx, sy] = SELT, o = src(sx, sy, CS), X = x0 + sx * T * c, Y = y0 + sy * T * c, hl = s.ph === 2 || s.ph === 0 || s.ph === 5;
  const fillOf = v => v === "DSM" ? "url(#pd)" : v === "global" ? "url(#ps)" : css("--muted");
  const R = {bal: [X - c, Y, c, T * c], jobb: [X + T * c, Y, c, T * c], felső: [X, Y - c, T * c, c], alsó: [X, Y + T * c, T * c, c]};
  for (const k in R) el("rect", {x: R[k][0], y: R[k][1], width: R[k][2], height: R[k][3], fill: fillOf(o[k]), stroke: css("--line"), "stroke-width": (s.ph === 2 && o[k] === "DSM") || ((s.ph === 0 || s.ph === 6) && o[k] === "global") ? 3 : 1, style: "pointer-events:none"});
  el("rect", {x: X - c, y: Y - c, width: (T + 2) * c, height: (T + 2) * c, fill: "none", stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "4 3", style: "pointer-events:none"});
  el("text", {x: 590, y: 50, "font-size": 13, "font-weight": "bold"}, "blokk " + (sy * 4 + sx) + " haloja:");
  ["bal", "jobb", "felső", "alsó"].forEach((k, i) => {
    el("rect", {x: 590, y: 64 + i * 26, width: 18, height: 18, fill: fillOf(o[k]), stroke: css("--line")});
    el("text", {x: 616, y: 78 + i * 26, "font-size": 12}, k + ": " + (o[k] === "DSM" ? "DSM" : o[k] === "global" ? "global + grid.sync()" : "peremfeltétel"));
  });
  el("text", {x: 590, y: 190, "font-size": 11, fill: css("--muted")}, "pötty = DSM, csík = global, szürke = perem;");
  el("text", {x: 590, y: 205, "font-size": 11, fill: css("--muted")}, "vastag keret = klaszter");
  // idővonal
  PH.forEach((p, i) => {
    const x = 20 + i * 104, on = i === s.ph, sync = i === 1 || i === 3 || i === 6;
    el("rect", {x: x, y: 330, width: 98, height: 54, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3.5 : (sync ? 2 : 1)});
    const parts = p.replace(" (", "|(").replace("cluster.sync() ", "cluster.sync()|").replace(" → ", "|→ ").replace("DSM-halo ", "DSM-halo|").split("|");
    parts.forEach((t, j) => el("text", {x: x + 49, y: 352 + j * 15 - (parts.length - 1) * 5, "text-anchor": "middle", "font-size": 11, "font-weight": sync ? "bold" : "normal"}, t));
  });
  el("text", {x: 20, y: 320, "font-size": 12, fill: css("--muted")}, "Kattints egy csempére: kiemelődik a halo-kerete és a forrása.");
}
const MK = CS => PH.map((p, i) => ({ph: i, line: i, msg: (i + 1) + "/7 " + p + (i === 2 ? (CS === 1 ? " (CS = 1: nincs klaszteren belüli szomszéd, minden halo global)" : " – a klaszteren belüli szomszédok shared memóriájából") : "") + "."}));
function setCS(v){ CS = +v; setSteps(MK(CS)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
