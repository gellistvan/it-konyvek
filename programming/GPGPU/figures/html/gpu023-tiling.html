<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csempézett mátrixszorzás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N / TILE: <select id="nt" onchange="setSize()" aria-label="N és TILE"><option value="8/4" selected>8 / 4</option><option value="16/4">16 / 4</option><option value="16/8">16 / 8</option></select></label><label><input id="nb" type="checkbox" onchange="setBar()"> 2. barrier nélkül (hibás)</label><span class="small">C-ben egy cellára kattintva: kimeneti blokk és szál választása</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A, B és C rács a betöltött csempékkel, alattuk az As és Bs shared tömb; a kiválasztott szál részösszege lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: N = 8, TILE = 4, blockIdx = (1, 0), (ty, tx) = (1, 2); a végén sum = C[1][6] = −48. A könyv kódja TILE = 32-vel azonos szerkezetű.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": -1, "ph": "init", "k": -1, "sum": 0, "loads": 0, "line": 0, "msg": "Kezdés: blockIdx = (1, 0), a (1, 2) szál C[1][6]-t számolja; sum = 0", "i": 0}, {"t": 0, "ph": "load", "k": -1, "sum": 0, "loads": 32, "line": 1, "msg": "t = 0: a blokk 4×4 szála betölti A[0–3][0–3] és B[0–3][4–7] csempét", "i": 1}, {"t": 0, "ph": "sync1", "k": -1, "sum": 0, "loads": 32, "line": 3, "msg": "t = 0: 1. barrier – csak akkor olvas bárki, ha a teljes csempe betöltődött", "i": 2}, {"t": 0, "ph": "k", "k": 0, "sum": -6, "loads": 32, "line": 5, "msg": "t = 0, k = 0: sum += As[1][0]·Bs[0][2] = 1·-6 = -6 → sum = -6", "i": 3}, {"t": 0, "ph": "k", "k": 1, "sum": -16, "loads": 32, "line": 5, "msg": "t = 0, k = 1: sum += As[1][1]·Bs[1][2] = 2·-5 = -10 → sum = -16", "i": 4}, {"t": 0, "ph": "k", "k": 2, "sum": -28, "loads": 32, "line": 5, "msg": "t = 0, k = 2: sum += As[1][2]·Bs[2][2] = 3·-4 = -12 → sum = -28", "i": 5}, {"t": 0, "ph": "k", "k": 3, "sum": -40, "loads": 32, "line": 5, "msg": "t = 0, k = 3: sum += As[1][3]·Bs[3][2] = 4·-3 = -12 → sum = -40", "i": 6}, {"t": 0, "ph": "sync2", "k": -1, "sum": -40, "loads": 32, "line": 6, "msg": "t = 0: 2. barrier – a csempét csak akkor írhatja felül a következő betöltés, ha mindenki végzett", "i": 7}, {"t": 1, "ph": "load", "k": -1, "sum": -40, "loads": 64, "line": 1, "msg": "t = 1: a blokk 4×4 szála betölti A[0–3][4–7] és B[4–7][4–7] csempét", "i": 8}, {"t": 1, "ph": "sync1", "k": -1, "sum": -40, "loads": 64, "line": 3, "msg": "t = 1: 1. barrier – csak akkor olvas bárki, ha a teljes csempe betöltődött", "i": 9}, {"t": 1, "ph": "k", "k": 0, "sum": -50, "loads": 64, "line": 5, "msg": "t = 1, k = 0: sum += As[1][0]·Bs[0][2] = 5·-2 = -10 → sum = -50", "i": 10}, {"t": 1, "ph": "k", "k": 1, "sum": -56, "loads": 64, "line": 5, "msg": "t = 1, k = 1: sum += As[1][1]·Bs[1][2] = 6·-1 = -6 → sum = -56", "i": 11}, {"t": 1, "ph": "k", "k": 2, "sum": -56, "loads": 64, "line": 5, "msg": "t = 1, k = 2: sum += As[1][2]·Bs[2][2] = 7·0 = 0 → sum = -56", "i": 12}, {"t": 1, "ph": "k", "k": 3, "sum": -48, "loads": 64, "line": 5, "msg": "t = 1, k = 3: sum += As[1][3]·Bs[3][2] = 8·1 = 8 → sum = -48", "i": 13}, {"t": 1, "ph": "sync2", "k": -1, "sum": -48, "loads": 64, "line": 6, "msg": "t = 1: 2. barrier – a csempét csak akkor írhatja felül a következő betöltés, ha mindenki végzett", "i": 14}, {"t": 2, "ph": "done", "k": -1, "sum": -48, "loads": 64, "line": 8, "msg": "Vége: C[1][6] = -48. A blokk 64 globális betöltést végzett; az egész rácsban minden A/B-elem 2-szer (N/TILE) töltődik be, és csempénként 4-szer (TILE) használódik", "i": 15}];
const CODE = ["for (int t = 0; t < numTiles; ++t) {", "  As[ty][tx] = A[row * N + t * TILE + tx];      // betöltés (határellenőrzéssel)", "  Bs[ty][tx] = B[(t * TILE + ty) * N + col];", "  __syncthreads();                               // 1. barrier: a csempe kész", "  for (int k = 0; k < TILE; ++k)", "    sum += As[ty][k] * Bs[k][tx];", "  __syncthreads();                               // 2. barrier: mindenki végzett az olvasással", "}", "C[row * N + col] = sum;"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CFG = {n: 8, tile: 4, bx: 1, by: 0, ty: 1, tx: 2, nobar: false};
const Av = (i, j) => i + j, Bv = (i, j) => i - j;
function gen(c){
  const {n, tile, bx, by, ty, tx, nobar} = c, row = by * tile + ty, col = bx * tile + tx, nt = Math.ceil(n / tile);
  let s = 0, loads = 0; const out = [{t: -1, ph: "init", k: -1, sum: 0, loads: 0, line: 0,
    msg: `Kezdés: blockIdx = (${bx}, ${by}), a (${ty}, ${tx}) szál C[${row}][${col}]-t számolja; sum = 0`}];
  for (let t = 0; t < nt; t++) {
    loads += 2 * tile * tile;
    out.push({t, ph: "load", k: -1, sum: s, loads, line: 1, msg: `t = ${t}: a blokk ${tile}×${tile} szála betölti A[${by*tile}–${by*tile+tile-1}][${t*tile}–${t*tile+tile-1}] és B[${t*tile}–${t*tile+tile-1}][${bx*tile}–${bx*tile+tile-1}] csempét`});
    out.push({t, ph: "sync1", k: -1, sum: s, loads, line: 3, msg: `t = ${t}: 1. barrier – csak akkor olvas bárki, ha a teljes csempe betöltődött`});
    for (let k = 0; k < tile; k++) {
      const a = Av(row, t * tile + k), b = Bv(t * tile + k, col), race = nobar && t + 1 < nt && k === tile - 1;
      if (race) { const b2 = Bv((t + 1) * tile + k, col);
        out.push({t, ph: "race", k, sum: s + a * b2, loads, line: 5, bad: 1, msg: `2. barrier NÉLKÜL: egy gyorsabb szál (a valódi kódban egy másik warp) már a t = ${t+1} csempét írta Bs[${k}][${tx}]-be (${b} helyett ${b2}); a (${ty}, ${tx}) szál rossz értéket olvas: sum = ${s + a * b2} (helyesen ${s + a * b}) – versenyhelyzet`}); }
      s += race ? a * Bv((t + 1) * tile + k, col) : a * b;
      if (!race) out.push({t, ph: "k", k, sum: s, loads, line: 5, msg: `t = ${t}, k = ${k}: sum += As[${ty}][${k}]·Bs[${k}][${tx}] = ${a}·${b} = ${a*b} → sum = ${s}`});
    }
    if (!nobar) out.push({t, ph: "sync2", k: -1, sum: s, loads, line: 6, msg: `t = ${t}: 2. barrier – a csempét csak akkor írhatja felül a következő betöltés, ha mindenki végzett`});
  }
  out.push({t: nt, ph: "done", k: -1, sum: s, loads, line: 8, msg: (nobar && nt > 1 ? "HIBÁS eredmény (versenyhelyzet). " : "") + `Vége: C[${row}][${col}] = ${s}. A blokk ${loads} globális betöltést végzett; az egész rácsban minden A/B-elem ${nt}-szer (N/TILE) töltődik be, és csempénként ${tile}-szer (TILE) használódik`});
  out.forEach((x, i) => x.i = i); return out;
}
function render(s){
  const {n, tile, bx, by, ty, tx} = CFG, row = by * tile + ty, col = bx * tile + tx, nt = Math.ceil(n / tile);
  svg.setAttribute("viewBox", "0 0 760 470"); svg.innerHTML = "";
  defs();
  const cs = Math.min(22, 200 / n), t = Math.max(0, Math.min(nt - 1, s.t)), showT = s.t >= 0 && s.t < nt;
  function big(x0, y0, label, sel, kind){
    el("text", {x: x0, y: y0 - 8, "font-size": 13, "font-weight": "bold"}, label);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const on = showT && sel && i >= sel[0] && i < sel[0] + tile && j >= sel[1] && j < sel[1] + tile;
      const blk = kind === "C" && Math.floor(i / tile) === by && Math.floor(j / tile) === bx;
      const me = kind === "C" && i === row && j === col;
      const r = el("rect", {x: x0 + j * cs, y: y0 + i * cs, width: cs, height: cs, stroke: css("--muted"), "stroke-width": .5,
        fill: me ? css("--hl") : on ? (kind === "A" ? "url(#hA)" : "url(#hB)") : blk ? css("--cellhl") : css("--cell")});
      if (kind === "C") { r.style.cursor = "pointer"; r.addEventListener("click", () => pickBlock(i, j)); }
    }
  }
  big(20, 40, "A", [by * tile, t * tile], "A");
  big(270, 40, "B", [t * tile, bx * tile], "B");
  big(520, 40, "C (kattintás: blokk + szál)", null, "C");
  const sc = Math.min(30, 200 / tile), y1 = 40 + n * cs + 40, raced = s.ph === "race";
  function small(x0, label, fn, isA){
    el("text", {x: x0, y: y1 - 8, "font-size": 13, "font-weight": "bold"}, label);
    for (let i = 0; i < tile; i++) for (let j = 0; j < tile; j++) {
      const hot = isA ? i === ty : j === tx, cur = s.ph === "k" || s.ph === "race" ? (isA ? (i === ty && j === s.k) : (j === tx && i === s.k)) : false;
      const over = raced && !isA && i === s.k && j === tx;
      el("rect", {x: x0 + j * sc, y: y1 + i * sc, width: sc, height: sc, fill: over ? "url(#hR)" : cur ? css("--cellhl") : css("--cell"),
        stroke: css("--line"), "stroke-width": cur || over ? 3 : hot ? 1.8 : .6});
      if (showT && s.ph !== "load") el("text", {x: x0 + j * sc + sc / 2, y: y1 + i * sc + sc * .65, "text-anchor": "middle", "font-size": Math.min(12, sc * .45)},
        String(fn(i, j)).replace("-", "−"));
    }
  }
  small(20, "As", (i, j) => Av(by * tile + i, t * tile + j), true);
  small(270, "Bs", (i, j) => (raced && i === s.k && j === tx) ? Bv((t + 1) * tile + i, bx * tile + j) : Bv(t * tile + i, bx * tile + j), false);
  const ref = Array.from({length: n}, (_, k) => Av(row, k) * Bv(k, col)).reduce((a, b) => a + b, 0);
  const tx0 = 520;
  el("text", {x: tx0, y: y1 + 10, "font-size": 13}, `szál (${ty}, ${tx}) → C[${row}][${col}]`);
  el("text", {x: tx0, y: y1 + 32, "font-size": 15, "font-weight": "bold", fill: s.bad ? css("--hl2") : css("--fg")}, "sum = " + String(s.sum).replace("-", "−"));
  el("text", {x: tx0, y: y1 + 54, "font-size": 12, fill: css("--muted")}, "várt végeredmény: " + String(ref).replace("-", "−"));
  el("text", {x: tx0, y: y1 + 76, "font-size": 12}, `globális betöltések (blokk): ${s.loads}`);
  el("text", {x: tx0, y: y1 + 96, "font-size": 12}, `betöltés/elem (rács): ${nt} = N/TILE`);
  el("text", {x: tx0, y: y1 + 116, "font-size": 12}, `felhasználás/betöltés: ${tile} = TILE`);
  el("text", {x: 20, y: 462, "font-size": 11, fill: css("--muted")}, "A-csempe: ferde sraffozás, B-csempe: vízszintes; vastag keret: a szál As-sora / Bs-oszlopa; mintaadat A[i][j] = i + j, B[i][j] = i − j");
}
function defs(){ const d = el("defs", {});
  d.innerHTML = `<pattern id="hA" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--line")}" stroke-width="1"/></pattern>
  <pattern id="hB" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="3" x2="6" y2="3" stroke="${css("--line")}" stroke-width="1"/></pattern>
  <pattern id="hR" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${css("--hl2")}" stroke-width="2.5"/></pattern>`; }
function rebuild(){ setSteps(gen(CFG)); }
function pickBlock(i, j){ CFG.by = Math.floor(i / CFG.tile); CFG.bx = Math.floor(j / CFG.tile); CFG.ty = i % CFG.tile; CFG.tx = j % CFG.tile; rebuild(); }
function setSize(){ const [n, tl] = document.getElementById("nt").value.split("/").map(Number);
  CFG = {n, tile: tl, bx: Math.min(1, n / tl - 1), by: 0, ty: Math.min(1, tl - 1), tx: Math.min(2, tl - 1), nobar: document.getElementById("nb").checked}; rebuild(); }
function setBar(){ CFG.nobar = document.getElementById("nb").checked; rebuild(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
