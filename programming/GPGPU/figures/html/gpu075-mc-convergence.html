<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monte Carlo-konvergencia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="jump(100)">×100 minta</button> <button onclick="jump(1000)">×1000 minta</button> <button onclick="newSeeds()">20 új seed</button> <label><input id="anti" type="checkbox" onchange="show(k)"> antitetikus mintavétel</label></div><div class="ctl"><label>σ <input id="sg" type="range" min="5" max="60" value="20" oninput="show(k)" style="width:100px"> <span id="sgv">0,20</span></label> <label>K <input id="kk" type="range" min="60" max="140" value="100" oninput="show(k)" style="width:100px"> <span id="kkv">100</span></label> <label>seed <input id="sd" type="number" min="1" max="99999" value="1" onchange="show(k)" style="width:80px"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Balra a futó Monte Carlo-átlag a mintaszám függvényében a 95%-os sávval és a Black–Scholes-ár vízszintes vonalával; jobbra 20 független seed intervalluma, a C-t nem fedők szaggatottan."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Seedelhető JavaScript-generátor (mulberry32 + Box–Muller), FP64; „Lépés ▶” = ×10 minta (legfeljebb 10^6, böngészőben). S0 = 100, r = 0,05, T = 1; a C analitikus Black–Scholes-ár. Az ábra a CLT-ből következő viselkedést mutatja, nem a labor cuRAND-kimenetét.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 100, "line": -1, "msg": "N = 100: futó átlag és 95%-os sáv"}, {"n": 1000, "line": -1, "msg": "N = 1000: futó átlag és 95%-os sáv"}, {"n": 10000, "line": -1, "msg": "N = 10000: futó átlag és 95%-os sáv"}, {"n": 100000, "line": -1, "msg": "N = 100000: futó átlag és 95%-os sáv"}, {"n": 1000000, "line": -1, "msg": "N = 1000000: futó átlag és 95%-os sáv"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NM = 1000000;
let RUN = null, SEEDS = null, SEEDBASE = 1;
function gv(id){ return +document.getElementById(id).value; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function normals(seed){ const u = mulberry(seed); let spare = null; return function(){ if (spare !== null) { const s = spare; spare = null; return s; } let a = u(); while (a <= 1e-300) a = u(); const b = u(), R = Math.sqrt(-2*Math.log(a)); spare = R*Math.sin(2*Math.PI*b); return R*Math.cos(2*Math.PI*b); }; }
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1/(1 + 0.3275911*x); const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t*Math.exp(-x*x); return s*y; }
function Phi(x){ return 0.5*(1 + erf(x/Math.SQRT2)); }
function params(){ const sg = gv("sg")/100, K = gv("kk"); const d1 = (Math.log(100/K) + (0.05 + sg*sg/2))/sg, d2 = d1 - sg;
  return {sg, K, C: 100*Phi(d1) - K*Math.exp(-0.05)*Phi(d2), anti: document.getElementById("anti").checked}; }
function simulate(seed, n, P){
  const z = normals(seed), dsc = Math.exp(-0.05), mu = 0.05 - P.sg*P.sg/2; let s = 0, s2 = 0; const cp = {};
  const f = x => dsc*Math.max(100*Math.exp(mu + P.sg*x) - P.K, 0);
  for (let i = 1; i <= n; i++) { const x = z(); const v = P.anti ? 0.5*(f(x) + f(-x)) : f(x); s += v; s2 += v*v;
    if (NSTEP.includes(i)) cp[i] = {mu: s/i, se: Math.sqrt(Math.max(0, (s2 - i*(s/i)*(s/i))/(i - 1))/i)}; }
  return cp;
}
const NSTEP = []; for (let e = 2; e <= 6; e += 0.25) NSTEP.push(Math.round(Math.pow(10, e)));
function key(){ const P = params(); return [P.sg, P.K, P.anti, gv("sd")].join(","); }
function ensure(){ const kk = key(); if (!RUN || RUN.key !== kk) { const P = params(); RUN = {key: kk, P, cp: simulate(gv("sd"), NM, P)}; SEEDS = null; } }
function newSeeds(){ ensure(); const n = STEPS[k].n, P = RUN.P; SEEDBASE += 20; SEEDS = {n, key: RUN.key, res: []};
  for (let q = 0; q < 20; q++) { const cp = simulateN(SEEDBASE + q, n, P); SEEDS.res.push(cp); } show(k); }
function simulateN(seed, n, P){ const z = normals(seed), dsc = Math.exp(-0.05), mu = 0.05 - P.sg*P.sg/2; let s = 0, s2 = 0;
  const f = x => dsc*Math.max(100*Math.exp(mu + P.sg*x) - P.K, 0);
  for (let i = 0; i < n; i++) { const x = z(); const v = P.anti ? 0.5*(f(x) + f(-x)) : f(x); s += v; s2 += v*v; }
  const m = s/n; return {mu: m, se: Math.sqrt(Math.max(0, (s2 - n*m*m)/(n - 1))/n)}; }
function jump(f){ let t = k; while (t < STEPS.length - 1 && f > 1) { t++; f /= 10; } show(t); }
function c4(x){ return x.toFixed(4).replace(".", ","); }
function render(s){
  ensure(); svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 380");
  ["sg", "kk"].forEach(id => document.getElementById(id + "v").textContent = id === "sg" ? (gv(id)/100).toFixed(2).replace(".", ",") : gv(id));
  const P = RUN.P, C = P.C, pts = NSTEP.filter(n => n <= s.n).map(n => [n, RUN.cp[n]]);
  // (b) futó átlag a sávval: x = log10 N
  const X0 = 60, X1 = 420, xs = n => X0 + (Math.log10(n) - 2) / 4 * (X1 - X0), last = RUN.cp[NSTEP[0]];
  const half = Math.max(...NSTEP.map(n => Math.abs(RUN.cp[n].mu - C) + 1.96*RUN.cp[n].se)) * 1.1, ys = v => 190 - (v - C) / half * 150;
  el("text", {x: 10, y: 20, "font-size": 12, "font-weight": "bold"}, "futó átlag μ̂_N és μ̂_N ± 1,96·SE");
  let up = "", lo = "";
  pts.forEach(([n, q], i) => { up += (i ? " L " : "M ") + xs(n) + " " + ys(q.mu + 1.96*q.se); lo += (i ? " L " : "M ") + xs(n) + " " + ys(q.mu - 1.96*q.se); });
  el("path", {d: up, fill: "none", stroke: css("--muted"), "stroke-dasharray": "5 3"}); el("path", {d: lo, fill: "none", stroke: css("--muted"), "stroke-dasharray": "5 3"});
  let mu = ""; pts.forEach(([n, q], i) => mu += (i ? " L " : "M ") + xs(n) + " " + ys(q.mu)); el("path", {d: mu, fill: "none", stroke: css("--fg"), "stroke-width": 1.8});
  el("line", {x1: X0, y1: ys(C), x2: X1, y2: ys(C), stroke: css("--hl"), "stroke-width": 1.2});
  el("text", {x: X1 + 4, y: ys(C) + 4, "font-size": 11, fill: css("--hl")}, "C = " + c4(C));
  [2, 3, 4, 5, 6].forEach(e => el("text", {x: xs(Math.pow(10, e)), y: 362, "text-anchor": "middle", "font-size": 11}, "10^" + e));
  el("text", {x: (X0 + X1)/2, y: 378, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "mintaszám N (log skála)");
  const q = RUN.cp[s.n];
  // (c) 20 seed
  const XA = 490, XB = 740;
  el("text", {x: XA - 20, y: 20, "font-size": 12, "font-weight": "bold"}, "20 seed intervalluma");
  if (SEEDS && SEEDS.n === s.n && SEEDS.key === RUN.key) {
    const span = Math.max(...SEEDS.res.map(r => Math.abs(r.mu - C) + 1.96*r.se)) * 1.1, xc = v => (XA + XB)/2 + (v - C) / span * (XB - XA)/2;
    let cov = 0;
    SEEDS.res.forEach((r, i) => { const ok = Math.abs(r.mu - C) <= 1.96*r.se; if (ok) cov++; const y = 40 + i*15;
      el("line", {x1: xc(r.mu - 1.96*r.se), y1: y, x2: xc(r.mu + 1.96*r.se), y2: y, stroke: css("--fg"), "stroke-width": 1.5, "stroke-dasharray": ok ? "none" : "4 3"});
      el("circle", {cx: xc(r.mu), cy: y, r: 3.5, fill: ok ? css("--fg") : css("--bg"), stroke: css("--fg")}); });
    el("line", {x1: xc(C), y1: 30, x2: xc(C), y2: 345, stroke: css("--hl"), "stroke-width": 1.2});
    el("text", {x: (XA + XB)/2, y: 362, "text-anchor": "middle", "font-size": 12}, `${cov}/20 fedi C-t (N = ${s.n})`);
  } else el("text", {x: XA - 20, y: 60, "font-size": 12, fill: css("--muted")}, "Nyomja meg a „20 új seed” gombot.");
  status.textContent = `N = ${s.n}: μ̂ = ${c4(q.mu)}, SE = ${q.se.toFixed(5).replace(".", ",")}, |μ̂ − C| = ${Math.abs(q.mu - C).toFixed(5).replace(".", ",")}, C (analitikus) = ${c4(C)}` + (P.anti ? " (antitetikus)" : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
