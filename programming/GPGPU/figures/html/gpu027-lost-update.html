<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elveszett frissítés és atomicAdd</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="at" type="checkbox" onchange="book()"> atomicAdd</label><label>szálak <input id="nt" type="range" min="2" max="8" value="2" oninput="book()"> <b id="nv">2</b></label><button onclick="shuffle()">Interleaving keverése</button><button onclick="book()">Könyv sorrendje</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két szál regiszterei és a közös counter cella lépésenként; nem atomi esetben az egyik növelés elvész."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: a könyv sorrendje (T0 L, T1 L, T0 I, T1 I, T0 W, T1 W), counter = 5 → 6. Sematikus; a valós interleavinget az ütemező határozza meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"c": 5, "r": [null, null], "th": -1, "op": "", "line": 0, "msg": "Kezdés: counter = 5, 2 szál, nem atomi counter++", "i": 0, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 5, "r": [5, null], "th": 0, "op": "L", "line": 1, "msg": "T0 betölt: r0 = 5", "i": 1, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 5, "r": [5, 5], "th": 1, "op": "L", "line": 1, "msg": "T1 betölt: r1 = 5", "i": 2, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 5, "r": [6, 5], "th": 0, "op": "I", "line": 2, "msg": "T0 növel: r0 = 6", "i": 3, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 5, "r": [6, 6], "th": 1, "op": "I", "line": 2, "msg": "T1 növel: r1 = 6", "i": 4, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 6, "r": [6, 6], "th": 0, "op": "W", "line": 3, "msg": "T0 ír: counter = 6", "i": 5, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}, {"c": 6, "r": [6, 6], "th": 1, "op": "W", "line": 3, "msg": "T1 ír: counter = 6 · vége: várt 7, kapott 6, különbség 1", "i": 6, "order": [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]], "atomic": false, "n": 2}];
const CODE = ["// counter++ három lépésben:", "int r = *counter;      // L: betöltés", "r = r + 1;             // I: növelés", "*counter = r;          // W: visszaírás", "atomicAdd(counter, 1); // atomi: a három lépés oszthatatlan"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let N = 2, ATOMIC = false, ORD = [[0, "L"], [1, "L"], [0, "I"], [1, "I"], [0, "W"], [1, "W"]];
function runJS(order){
  let c = 5; const r = new Array(N).fill(null), out = [{c, r: r.slice(), th: -1, op: "", line: 0, msg: `Kezdés: counter = 5, ${N} szál, ${ATOMIC ? "atomicAdd" : "nem atomi counter++"}`}];
  for (const [th, op] of order) {
    let m, line;
    if (op === "A") { const old = c; c += 1; r[th] = old; m = `T${th}: atomicAdd – olvas ${old}, növel, ír ${c} (oszthatatlan; a többi szál vár)`; line = 4; }
    else if (op === "L") { r[th] = c; m = `T${th} betölt: r${th} = ${c}`; line = 1; }
    else if (op === "I") { r[th] += 1; m = `T${th} növel: r${th} = ${r[th]}`; line = 2; }
    else { c = r[th]; m = `T${th} ír: counter = ${c}`; line = 3; }
    out.push({c, r: r.slice(), th, op, line, msg: m});
  }
  const last = out[out.length - 1]; last.msg += ` · vége: várt ${5 + N}, kapott ${c}, különbség ${5 + N - c}`;
  out.forEach((s, i) => { s.i = i; s.order = order; s.atomic = ATOMIC; s.n = N; });
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 720 320"); svg.innerHTML = "";
  const n = s.n, w = Math.min(80, 640 / n);
  el("rect", {x: 300, y: 30, width: 120, height: 50, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 2});
  el("text", {x: 360, y: 63, "text-anchor": "middle", "font-size": 22}, String(s.c));
  el("text", {x: 360, y: 22, "text-anchor": "middle", "font-size": 12}, "counter");
  for (let t = 0; t < n; t++) { const x = 40 + t * w + (640 - n * w) / 2, act = t === s.th;
    el("rect", {x, y: 150, width: w - 10, height: 50, fill: act ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": act ? 3 : 1, "stroke-dasharray": t % 2 ? "5 3" : "none"});
    el("text", {x: x + (w - 10) / 2, y: 145, "text-anchor": "middle", "font-size": 12}, "T" + t);
    el("text", {x: x + (w - 10) / 2, y: 181, "text-anchor": "middle", "font-size": 14}, "r = " + (s.r[t] === null ? "–" : s.r[t]));
    if (act && s.op !== "I") el("line", {x1: x + (w - 10) / 2, y1: 148, x2: 360, y2: 84, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": s.op === "L" ? "4 3" : "none"});
  }
  // sorrend sáv
  const ord = s.order, bw = Math.min(40, 680 / Math.max(1, ord.length));
  ord.forEach(([th, op], k) => { const x = 20 + k * bw;
    el("rect", {x, y: 240, width: bw - 3, height: 26, fill: k < s.i ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": k === s.i - 1 ? 3 : 1});
    if (bw > 22) el("text", {x: x + (bw - 3) / 2, y: 258, "text-anchor": "middle", "font-size": 10}, "T" + th + (op === "A" ? "" : op)); });
  el("text", {x: 20, y: 290, "font-size": 11, fill: css("--muted")}, "sorrend: L = betölt, I = növel, W = ír; atomi módban egy doboz = egy oszthatatlan atomicAdd");
  el("text", {x: 20, y: 312, "font-size": 13}, `várt − kapott = ${5 + n} − ${s.c} = ${5 + n - s.c}` + (s.i < ord.length ? " (még fut)" : ""));
}
function shuffle(){
  const left = Array.from({length: N}, () => ATOMIC ? ["A"] : ["L", "I", "W"]), out = [];
  while (left.some(x => x.length)) { const c = []; left.forEach((x, t) => { if (x.length) c.push(t); });
    const t = c[Math.floor(Math.random() * c.length)]; out.push([t, left[t].shift()]); }
  setSteps(runJS(out));
}
function book(){ ATOMIC = document.getElementById("at").checked; N = +document.getElementById("nt").value; document.getElementById("nv").textContent = N;
  const o = []; if (ATOMIC) for (let t = 0; t < N; t++) o.push([t, "A"]);
  else if (N === 2) ORD.forEach(x => o.push(x)); else { for (let t = 0; t < N; t++) o.push([t, "L"]); for (let t = 0; t < N; t++) o.push([t, "I"]); for (let t = 0; t < N; t++) o.push([t, "W"]); }
  setSteps(runJS(o)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
