<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stride, szektorok és cache sorok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>stride: <input id="sts" type="range" min="1" max="64" value="8" oninput="rebuild()" aria-label="Stride" style="flex:0 1 180px"> <span id="sto">8</span></label><label>elemméret: <select id="es" onchange="rebuild()" aria-label="Elemméret"><option value="4" selected>4 B</option><option value="8">8 B</option><option value="16">16 B</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Stride 1-nél a warp négy szektort tölt ki teljesen, stride 8 és 32 mellett 32 szektort érint, mindegyikből csak 4 bájtot használ."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">32 B szektor, 128 B cache sor (cc ≥ 7.0); 32 szál, a t. szál címe t·stride·elemméret (128 B-ra igazított tömb). A Lépés gomb szálanként mutatja, melyik szektor töltődik be; a csúszka után a teljes warp látszik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. szál: cím 0 B – új szektor: 0. Eddig 1 szektor, 1 cache sor.", "line": 1, "t": 0, "stride": 8, "es": 4}, {"msg": "1. szál: cím 32 B – új szektor: 1. Eddig 2 szektor, 1 cache sor.", "line": 1, "t": 1, "stride": 8, "es": 4}, {"msg": "2. szál: cím 64 B – új szektor: 2. Eddig 3 szektor, 1 cache sor.", "line": 1, "t": 2, "stride": 8, "es": 4}, {"msg": "3. szál: cím 96 B – új szektor: 3. Eddig 4 szektor, 1 cache sor.", "line": 1, "t": 3, "stride": 8, "es": 4}, {"msg": "4. szál: cím 128 B – új szektor: 4. Eddig 5 szektor, 2 cache sor.", "line": 1, "t": 4, "stride": 8, "es": 4}, {"msg": "5. szál: cím 160 B – új szektor: 5. Eddig 6 szektor, 2 cache sor.", "line": 1, "t": 5, "stride": 8, "es": 4}, {"msg": "6. szál: cím 192 B – új szektor: 6. Eddig 7 szektor, 2 cache sor.", "line": 1, "t": 6, "stride": 8, "es": 4}, {"msg": "7. szál: cím 224 B – új szektor: 7. Eddig 8 szektor, 2 cache sor.", "line": 1, "t": 7, "stride": 8, "es": 4}, {"msg": "8. szál: cím 256 B – új szektor: 8. Eddig 9 szektor, 3 cache sor.", "line": 1, "t": 8, "stride": 8, "es": 4}, {"msg": "9. szál: cím 288 B – új szektor: 9. Eddig 10 szektor, 3 cache sor.", "line": 1, "t": 9, "stride": 8, "es": 4}, {"msg": "10. szál: cím 320 B – új szektor: 10. Eddig 11 szektor, 3 cache sor.", "line": 1, "t": 10, "stride": 8, "es": 4}, {"msg": "11. szál: cím 352 B – új szektor: 11. Eddig 12 szektor, 3 cache sor.", "line": 1, "t": 11, "stride": 8, "es": 4}, {"msg": "12. szál: cím 384 B – új szektor: 12. Eddig 13 szektor, 4 cache sor.", "line": 1, "t": 12, "stride": 8, "es": 4}, {"msg": "13. szál: cím 416 B – új szektor: 13. Eddig 14 szektor, 4 cache sor.", "line": 1, "t": 13, "stride": 8, "es": 4}, {"msg": "14. szál: cím 448 B – új szektor: 14. Eddig 15 szektor, 4 cache sor.", "line": 1, "t": 14, "stride": 8, "es": 4}, {"msg": "15. szál: cím 480 B – új szektor: 15. Eddig 16 szektor, 4 cache sor.", "line": 1, "t": 15, "stride": 8, "es": 4}, {"msg": "16. szál: cím 512 B – új szektor: 16. Eddig 17 szektor, 5 cache sor.", "line": 1, "t": 16, "stride": 8, "es": 4}, {"msg": "17. szál: cím 544 B – új szektor: 17. Eddig 18 szektor, 5 cache sor.", "line": 1, "t": 17, "stride": 8, "es": 4}, {"msg": "18. szál: cím 576 B – új szektor: 18. Eddig 19 szektor, 5 cache sor.", "line": 1, "t": 18, "stride": 8, "es": 4}, {"msg": "19. szál: cím 608 B – új szektor: 19. Eddig 20 szektor, 5 cache sor.", "line": 1, "t": 19, "stride": 8, "es": 4}, {"msg": "20. szál: cím 640 B – új szektor: 20. Eddig 21 szektor, 6 cache sor.", "line": 1, "t": 20, "stride": 8, "es": 4}, {"msg": "21. szál: cím 672 B – új szektor: 21. Eddig 22 szektor, 6 cache sor.", "line": 1, "t": 21, "stride": 8, "es": 4}, {"msg": "22. szál: cím 704 B – új szektor: 22. Eddig 23 szektor, 6 cache sor.", "line": 1, "t": 22, "stride": 8, "es": 4}, {"msg": "23. szál: cím 736 B – új szektor: 23. Eddig 24 szektor, 6 cache sor.", "line": 1, "t": 23, "stride": 8, "es": 4}, {"msg": "24. szál: cím 768 B – új szektor: 24. Eddig 25 szektor, 7 cache sor.", "line": 1, "t": 24, "stride": 8, "es": 4}, {"msg": "25. szál: cím 800 B – új szektor: 25. Eddig 26 szektor, 7 cache sor.", "line": 1, "t": 25, "stride": 8, "es": 4}, {"msg": "26. szál: cím 832 B – új szektor: 26. Eddig 27 szektor, 7 cache sor.", "line": 1, "t": 26, "stride": 8, "es": 4}, {"msg": "27. szál: cím 864 B – új szektor: 27. Eddig 28 szektor, 7 cache sor.", "line": 1, "t": 27, "stride": 8, "es": 4}, {"msg": "28. szál: cím 896 B – új szektor: 28. Eddig 29 szektor, 8 cache sor.", "line": 1, "t": 28, "stride": 8, "es": 4}, {"msg": "29. szál: cím 928 B – új szektor: 29. Eddig 30 szektor, 8 cache sor.", "line": 1, "t": 29, "stride": 8, "es": 4}, {"msg": "30. szál: cím 960 B – új szektor: 30. Eddig 31 szektor, 8 cache sor.", "line": 1, "t": 30, "stride": 8, "es": 4}, {"msg": "31. szál: cím 992 B – új szektor: 31. Eddig 32 szektor, 8 cache sor.", "line": 1, "t": 31, "stride": 8, "es": 4}, {"msg": "A teljes warp: 32 szektor, 8 cache sor, kihasznált 128 B / 1024 B = 12,5%.", "line": 2, "t": 32, "stride": 8, "es": 4}];
const CODE = ["int t = threadIdx.x;                       // 0..31 (egy warp)", "float v = in[t * stride];                  // cím = t·stride·sizeof(elem)", "// szektorok = |{cím / 32}|, cache sorok = |{cím / 128}|, kihasználtság = 32·elem / (szektorok·32)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function cm(x){ return (Math.round(x * 10) / 10).toString().replace(".", ","); }
function stepsFor(stride, es){
  const out = [], ss = [], sl = [];
  for (let t = 0; t < 32; t++){
    const a = t * stride * es, ns = [];
    for (let s = Math.floor(a / 32); s <= Math.floor((a + es - 1) / 32); s++) if (!ss.includes(s)) ns.push(s);
    ns.forEach(s => { ss.push(s); if (!sl.includes(Math.floor(s / 4))) sl.push(Math.floor(s / 4)); });
    out.push({msg: t + ". szál: cím " + a + " B – " + (ns.length ? "új szektor: " + ns.join(", ") : "már betöltött szektorba esik") + ". Eddig " + ss.length + " szektor, " + sl.length + " cache sor.", line: 1, t: t, stride: stride, es: es});
  }
  out.push({msg: "A teljes warp: " + ss.length + " szektor, " + sl.length + " cache sor, kihasznált " + (32 * es) + " B / " + (ss.length * 32) + " B = " + cm(100 * 32 * es / (ss.length * 32)) + "%.", line: 2, t: 32, stride: stride, es: es});
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 340");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  const used = {}, lines = [];
  const upto = Math.min(s.t, 31);
  for (let t = 0; t <= upto; t++){ const a = t * s.stride * s.es; for (let b = a; b < a + s.es; b++){ const sc = Math.floor(b / 32); (used[sc] = used[sc] || new Set()).add(b % 32); const L = Math.floor(sc / 4); if (!lines.includes(L)) lines.push(L); } }
  const cur = s.t < 32 ? s.t * s.stride * s.es : -1;
  const per = 4, SWp = 34, LW = 4 * SWp, maxL = 28;
  lines.slice(0, maxL).forEach((L, n) => {
    const x = 6 + (n % per) * (LW + 12), y = 16 + Math.floor(n / per) * 34;
    for (let k = 0; k < 4; k++){
      const sc = L * 4 + k, xs = x + k * SWp;
      el("rect", {x: xs, y: y, width: SWp, height: 20, fill: used[sc] ? ch_ : cl, stroke: ln, "stroke-width": 0.6, "stroke-dasharray": used[sc] ? "none" : "2 2"});
      if (used[sc]) used[sc].forEach(b => el("rect", {x: xs + b / 32 * SWp, y: y, width: SWp / 32 + 0.3, height: 20, fill: (Math.floor((L * 128 + k * 32 + b) / s.es) * s.es === cur) ? h2 : ln}));
    }
    el("rect", {x: x, y: y, width: 4 * SWp, height: 20, fill: "none", stroke: ln, "stroke-width": 2});
    el("text", {x: x, y: y + 31, "font-size": 9, fill: mu}, "sor " + L + " (" + (L * 128) + " B)");
  });
  if (lines.length > maxL) el("text", {x: 6, y: 16 + 7 * 34 + 14, "font-size": 11}, "… és még " + (lines.length - maxL) + " cache sor");
  const nS = Object.keys(used).length, util = (upto + 1) * s.es / (nS * 32);
  el("text", {x: 6, y: 300, "font-size": 13, "font-weight": "bold"}, "szektorok: " + nS + "   cache sorok: " + lines.length + "   kihasználtság: " + cm(100 * util) + "%");
  el("text", {x: 6, y: 318, "font-size": 11, fill: mu}, "Doboz = 32 B-os szektor (szürke: betöltött), vastag keret = 128 B-os cache sor;");
  el("text", {x: 6, y: 332, "font-size": 11, fill: mu}, "sötét = hasznos bájt, kiemelt = az aktuális szál eleme.");
}
function rebuild(){
  const st = +document.getElementById("sts").value, es = +document.getElementById("es").value;
  document.getElementById("sto").textContent = st;
  setSteps(stepsFor(st, es)); show(32);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
