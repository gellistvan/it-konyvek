<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skalár és float4 betöltés szektorai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="setMode('s')">Skalár</button> <button onclick="setMode('v')">float4</button> <label>bázis mod 16: <input id="off" type="range" min="0" max="12" step="4" value="4" oninput="render(STEPS[k])" aria-label="bázis eltolása bájtban"> <span id="offv">4</span> B</label> <label>elemszám: <input id="nel" type="range" min="1" max="64" step="1" value="40" oninput="render(STEPS[k])" aria-label="elemszám"> <span id="nelv">40</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az 512 bájtot a skalár változat négy, a float4 változat egy warp-utasítással olvassa be; mindkettő 16 szektort érint. Alul a nem igazított tömb fej, törzs és farok része."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: 32 B szektor, 128 B L1-vonal, CC 7.0–9.x; a DRAM-forgalom a két esetben azonos. A fej a 16 bájtos határig tartó skalár elemek, a törzs float4-ekből áll, a farok a maradék.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"mode": "s", "k": 0, "line": 1, "msg": "Skalár: utasítás 0/4 (LDG.E.32), eddig érintett szektor: 0 – a Lépés ▶ adja ki a következő warp-utasítást"}, {"mode": "s", "k": 1, "line": 1, "msg": "Skalár: utasítás 1/4 (LDG.E.32), eddig érintett szektor: 4"}, {"mode": "s", "k": 2, "line": 1, "msg": "Skalár: utasítás 2/4 (LDG.E.32), eddig érintett szektor: 8"}, {"mode": "s", "k": 3, "line": 1, "msg": "Skalár: utasítás 3/4 (LDG.E.32), eddig érintett szektor: 12"}, {"mode": "s", "k": 4, "line": 1, "msg": "Skalár: utasítás 4/4 (LDG.E.32), eddig érintett szektor: 16"}];
const CODE = ["// skalár: szálanként 4 B, 128 B / warp-utasítás", "float v = x[i];               // LDG.E.32 (4 utasítás 512 B-hoz)", "// vektoros: szálanként 16 B, 512 B / warp-utasítás", "float4 v = x4[i];             // LDG.E.128 (1 utasítás 512 B-hoz)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let selT = -1;
const SS = [{"mode": "s", "k": 0, "line": 1, "msg": "Skalár: utasítás 0/4 (LDG.E.32), eddig érintett szektor: 0 – a Lépés ▶ adja ki a következő warp-utasítást"}, {"mode": "s", "k": 1, "line": 1, "msg": "Skalár: utasítás 1/4 (LDG.E.32), eddig érintett szektor: 4"}, {"mode": "s", "k": 2, "line": 1, "msg": "Skalár: utasítás 2/4 (LDG.E.32), eddig érintett szektor: 8"}, {"mode": "s", "k": 3, "line": 1, "msg": "Skalár: utasítás 3/4 (LDG.E.32), eddig érintett szektor: 12"}, {"mode": "s", "k": 4, "line": 1, "msg": "Skalár: utasítás 4/4 (LDG.E.32), eddig érintett szektor: 16"}], SV = [{"mode": "v", "k": 0, "line": 3, "msg": "float4: utasítás 0/1 (LDG.E.128), eddig érintett szektor: 0"}, {"mode": "v", "k": 1, "line": 3, "msg": "float4: utasítás 1/1 (LDG.E.128), eddig érintett szektor: 16"}];
function setMode(m){ selT = -1; setSteps(m === "s" ? SS : SV); }
function pick(t){ selT = (selT === t ? -1 : t); render(STEPS[k]); }
function splitHTB(off, n){ const h = Math.min(n, Math.floor(((16 - off) % 16) / 4)); const b = Math.floor((n - h) / 4); return [h, b, n - h - 4 * b]; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 430");
  const X = b => 90 + b * 1.25, fg = css("--fg"), mu = css("--muted");
  el("text", {x: 4, y: 16, "font-size": 13, "font-weight": "bold"}, s.mode === "s" ? "Skalár (float): 4 warp-utasítás" : "float4: 1 warp-utasítás");
  const rows = s.mode === "s" ? 4 : 1;
  for (let r = 0; r < rows; r++) {
    const y = 32 + r * 40, on = r < s.k;
    el("text", {x: 84, y: y + 20, "text-anchor": "end", "font-size": 11}, s.mode === "s" ? `LDG.E.32 #${r + 1}` : "LDG.E.128");
    for (let t = 0; t < 32; t++) {
      const w = s.mode === "s" ? 4 : 16, a = s.mode === "s" ? 128 * r + 4 * t : 16 * t;
      const hit = on && t === selT;
      const rc = el("rect", {x: X(a), y: y + 6, width: w * 1.25, height: 22, fill: hit ? css("--hl2") : (on ? (t % 2 ? css("--cellhl") : mu) : css("--cell")), stroke: css("--line"), "stroke-width": 0.3, style: "cursor:pointer"});
      rc.addEventListener("click", () => pick(t));
      const tt = document.createElementNS(NS, "title"); tt.textContent = `t${t}: bájt ${a}–${a + w - 1}`; rc.appendChild(tt);
    }
  }
  const yb = 32 + rows * 40;
  for (let b = 0; b <= 512; b += 32) {
    el("line", {x1: X(b), y1: 30, x2: X(b), y2: yb, stroke: fg, "stroke-width": b % 128 === 0 ? 2.5 : 0.6});
    if (b < 512) el("text", {x: X(b + 16), y: yb + 13, "text-anchor": "middle", "font-size": 10, fill: mu}, "S" + (b / 32));
  }
  for (let b = 0; b <= 512; b += 128) el("text", {x: X(b), y: yb + 27, "text-anchor": "middle", "font-size": 10}, String(b));
  const used = s.mode === "s" ? 4 * s.k : 16 * s.k;
  el("text", {x: 4, y: yb + 46, "font-size": 12}, `kiadott warp-utasítás: ${s.k}/${rows}, érintett szektor: ${used}/16, hasznos bájt: ${s.mode === "s" ? 128 * s.k : 512 * s.k}`);
  if (selT >= 0) {
    const w = s.mode === "s" ? 4 : 16, segs = [];
    for (let r = 0; r < rows; r++) { const a = s.mode === "s" ? 128 * r + 4 * selT : 16 * selT; segs.push(`${a}–${a + w - 1}` + (s.mode === "s" ? ` (S${Math.floor(a / 32)})` : ` (S${Math.floor(a / 32)})`)); }
    el("text", {x: 4, y: yb + 64, "font-size": 12, fill: css("--hl2")}, `kijelölt szál t${selT}: bájt ${segs.join(", ")}`);
  } else el("text", {x: 4, y: yb + 64, "font-size": 11, fill: mu}, "Kattints egy cellára: a szál bájttartománya kiemelődik.");
  // (C) fej / törzs / farok
  const off = +document.getElementById("off").value, n = +document.getElementById("nel").value;
  document.getElementById("offv").textContent = off; document.getElementById("nelv").textContent = n;
  const [h, b, tl] = splitHTB(off, n), y0 = 330, cw = Math.min(10, 640 / (n + 4)), XC = byte => 90 + byte / 4 * cw;
  el("text", {x: 4, y: y0 - 34, "font-size": 13, "font-weight": "bold"}, `Nem igazított bázis: bázis mod 16 = ${off} bájt, ${n} elem`);
  for (let bb = 0; bb <= off + 4 * n + 15; bb += 16) el("line", {x1: XC(bb), y1: y0 - 6, x2: XC(bb), y2: y0 + 32, stroke: mu, "stroke-dasharray": "3 3"});
  for (let i = 0; i < h; i++) el("rect", {x: XC(off + 4 * i), y: y0, width: cw, height: 26, fill: "url(#hh)", stroke: fg, "stroke-width": 0.6});
  for (let j = 0; j < b; j++) el("rect", {x: XC(off + 4 * h + 16 * j), y: y0, width: 4 * cw, height: 26, fill: css("--cell"), stroke: fg, "stroke-width": 1.8});
  for (let i = 0; i < tl; i++) el("rect", {x: XC(off + 4 * (h + 4 * b + i)), y: y0, width: cw, height: 26, fill: "url(#hd)", stroke: fg, "stroke-width": 0.6});
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${fg}" stroke-width="1"/></pattern><pattern id="hd" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${css("--cellhl")}"/><circle cx="2" cy="2" r="0.8" fill="${fg}"/></pattern>`;
  svg.insertBefore(defs, svg.firstChild);
  el("text", {x: 4, y: y0 + 54, "font-size": 12}, `fej: ${h} skalár elem, törzs: ${b} × float4 (${4 * b} elem), farok: ${tl} skalár elem`);
  el("text", {x: 4, y: y0 + 72, "font-size": 11, fill: mu}, "Fej: ferde sraffozás, törzs: vastag keret, farok: pontozott; szaggatott vonal = 16 bájtos határ.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
