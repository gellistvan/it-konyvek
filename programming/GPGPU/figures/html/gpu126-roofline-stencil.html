<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roofline: a 2D Jacobi-stencil</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#ddd;--line:#000;--t:#555}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#3a3a3a;--line:#ddd;--t:#aaa}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
input[type=number]{width:7em}
select,input{font:inherit}
</style>
</head>
<body>
<div class="ctl">
  <label>GPU: <select id="gpu"></select></label>
  <label>sávszélesség (GB/s): <input id="bw" type="number" min="10" step="1"></label>
  <label>FP32 csúcs (GFLOP/s): <input id="pk" type="number" min="10" step="10"></label>
</div>
<div class="ctl">
  <label>bájt/cella: <input id="b" type="range" min="8" max="20" step="1" value="8"> <b id="bv">8</b></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 420" role="img" aria-label="Log-log Roofline a sávszélesség- és a számítási tetővel, a stencil pontjával"></svg>
<p class="small">Modell: 4 FLOP/cella, 1000 időlépés 4096 × 4096 rácson; a futásidő-korlát = 1000 · 4096² · (bájt/cella) / sávszélesség.
Adatlapi csúcsok; a pont felső korlát (várt érték), nem mérés. Szaggatott vonal: a sávszélesség 80 %-a (a charter célja).</p>
<script>
const GPUS = [{"id": "a4000", "name": "RTX A4000 (a könyv példája)", "bw": 448.0, "peak": 19169.28}, {"id": "4090", "name": "RTX 4090", "bw": 1008.0, "peak": 82600.0}, {"id": "a100", "name": "A100 (40 GB, SXM)", "bw": 1555.0, "peak": 19500.0}];
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function hu(x,d){return x.toLocaleString("hu-HU",{maximumFractionDigits:d,minimumFractionDigits:0});}
const gS=document.getElementById("gpu"), bwI=document.getElementById("bw"), pkI=document.getElementById("pk"), bI=document.getElementById("b");
GPUS.forEach(g=>{const o=document.createElement("option");o.value=g.id;o.textContent=g.name;gS.appendChild(o);});
function pick(){const g=GPUS.find(q=>q.id===gS.value);bwI.value=g.bw;pkI.value=g.peak;draw();}
function draw(){
  const bw=+bwI.value, pk=+pkI.value, b=+bI.value; document.getElementById("bv").textContent=b;
  if(!(bw>0&&pk>0))return;
  const ai=4/b, perf=Math.min(pk,ai*bw), ridge=pk/bw, tms=1000*4096*4096*b/(bw*1e9)*1e3;
  svg.innerHTML="";
  const X0=80,X1=740,Y0=20,Y1=370, lx0=-1,lx1=3, ly0=1,ly1=5.3;
  const xs=v=>X0+(Math.log10(v)-lx0)*(X1-X0)/(lx1-lx0), ys=v=>Y1-(Math.log10(v)-ly0)*(Y1-Y0)/(ly1-ly0);
  for(let e=lx0;e<=lx1;e++){E("line",{x1:xs(10**e),x2:xs(10**e),y1:Y0,y2:Y1,stroke:css("--grid")});E("text",{x:xs(10**e),y:Y1+16,"text-anchor":"middle","font-size":12},hu(10**e,1));}
  for(let e=ly0;e<=5;e++){E("line",{x1:X0,x2:X1,y1:ys(10**e),y2:ys(10**e),stroke:css("--grid")});E("text",{x:X0-6,y:ys(10**e)+4,"text-anchor":"end","font-size":12},hu(10**e,0));}
  E("text",{x:(X0+X1)/2,y:Y1+36,"text-anchor":"middle","font-size":13},"aritmetikai intenzitás (FLOP/bájt)");
  E("text",{x:16,y:(Y0+Y1)/2,"font-size":13,"text-anchor":"middle",transform:`rotate(-90 16 ${(Y0+Y1)/2})`},"GFLOP/s");
  const roof=f=>{let d="";for(let q=0;q<=200;q++){const v=10**(lx0+(lx1-lx0)*q/200);const y=Math.min(pk,f*v);d+=(q?"L":"M")+xs(v).toFixed(1)+","+ys(Math.max(y,10**ly0)).toFixed(1);}return d;};
  E("path",{d:roof(bw),fill:"none",stroke:css("--line"),"stroke-width":2.6});
  E("path",{d:roof(0.8*bw),fill:"none",stroke:css("--t"),"stroke-width":1.5,"stroke-dasharray":"7 4"});
  if(ridge>10**lx0&&ridge<10**lx1){E("rect",{x:xs(ridge)-5,y:ys(pk)-5,width:10,height:10,fill:css("--line"),transform:`rotate(45 ${xs(ridge)} ${ys(pk)})`});
    E("text",{x:xs(ridge),y:ys(pk)-12,"text-anchor":"middle","font-size":12},`gerincpont ≈ ${hu(ridge,1)} FLOP/B`);}
  [0.2,0.5].forEach(a=>{E("line",{x1:xs(a),x2:xs(a),y1:Y1,y2:ys(Math.min(pk,a*bw)),stroke:css("--muted"),"stroke-dasharray":"2 3"});E("circle",{cx:xs(a),cy:ys(Math.min(pk,a*bw)),r:5,fill:"none",stroke:css("--line"),"stroke-width":1.5});});
  E("circle",{cx:xs(ai),cy:ys(perf),r:7,fill:css("--line")});
  E("text",{x:xs(ai)+12,y:ys(perf)+4,"font-size":13},`${b} B/cella: ${hu(ai,3)} FLOP/B → legfeljebb ${hu(perf,1)} GFLOP/s`);
  E("text",{x:X1-6,y:Y1-10,"text-anchor":"end","font-size":12,fill:css("--muted")},"0,2 = naiv (20 B), 0,5 = ideális (8 B)");
  document.getElementById("status").textContent=`${b} B/cella → intenzitás ${hu(ai,3)} FLOP/bájt, felső korlát ${hu(perf,1)} GFLOP/s (${perf<pk?"memória-korlátos":"számítás-korlátos"}); `+
    `futásidő-korlát 1000 lépésre (4096²): ≈ ${hu(tms,1)} ms; 80 %-os cél mellett ≈ ${hu(tms/0.8,1)} ms.`;
}
gS.addEventListener("change",pick); bwI.addEventListener("input",draw); pkI.addEventListener("input",draw); bI.addEventListener("input",draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
pick();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
