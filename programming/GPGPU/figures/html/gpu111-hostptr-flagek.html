<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host-pointer-flag-ek adatútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="radiogroup" aria-label="Flag">Flag: <label><input type="radio" name="flag" value="COPY" checked onchange="pick()"> COPY_HOST_PTR</label> <label><input type="radio" name="flag" value="USE" onchange="pick()"> USE_HOST_PTR</label> <label><input type="radio" name="flag" value="ALLOC" onchange="pick()"> ALLOC_HOST_PTR</label></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A COPY egyszer másol, a USE a host-tömbre hivatkozik, az ALLOC host által elérhető pinned memóriát foglal; lépésenként látszik, mikor látja a device a host módosítását."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltétel: diszkrét GPU; a tényleges elhelyezés implementációfüggő. hostData: N = 1 << 22 float = 16 MiB (a 29.2 laborja).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"flag": "COPY", "st": 0, "line": 0, "vis": "–", "msg": "1/4 [COPY_HOST_PTR] Létrehozás: a clCreateBuffer a hostData 16 MiB-ját egyszer a device-ra másolja; a hostData ezután felszabadítható."}, {"flag": "COPY", "st": 1, "line": 3, "vis": "–", "msg": "2/4 [COPY_HOST_PTR] Kernel: a device saját másolatát olvassa és írja; a hostData-hoz nem nyúl."}, {"flag": "COPY", "st": 2, "line": 4, "vis": "nem (független másolat)", "msg": "3/4 [COPY_HOST_PTR] Host módosít (hostData[0] = 42): a device ezt nem látja – a két példány független. Láthatóvá csak egy újabb enqueueWriteBuffer tenné. Látszik a device-on? nem (független másolat)."}, {"flag": "COPY", "st": 3, "line": 5, "vis": "nem (független másolat)", "msg": "4/4 [COPY_HOST_PTR] Map/read: a device tartalma jön vissza; a host módosítása nem jutott át."}];
const CODE = ["cl::Buffer b(ctx, CL_MEM_READ_WRITE | CL_MEM_COPY_HOST_PTR,  bytes, hostData.data());", "cl::Buffer b(ctx, CL_MEM_READ_WRITE | CL_MEM_USE_HOST_PTR,   bytes, hostData.data());", "cl::Buffer b(ctx, CL_MEM_READ_WRITE | CL_MEM_ALLOC_HOST_PTR, bytes, nullptr);", "queue.enqueueNDRangeKernel(k, cl::NullRange, cl::NDRange(N));", "hostData[0] = 42.0f;                       // a host módosít", "float* p = (float*)queue.enqueueMapBuffer(b, CL_TRUE, CL_MAP_READ | CL_MAP_WRITE, 0, bytes);", "p[0] = 42.0f;  queue.enqueueUnmapMemObject(b, p);   // unmap: szinkronizációs pont"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"COPY": [{"flag": "COPY", "st": 0, "line": 0, "vis": "–", "msg": "1/4 [COPY_HOST_PTR] Létrehozás: a clCreateBuffer a hostData 16 MiB-ját egyszer a device-ra másolja; a hostData ezután felszabadítható."}, {"flag": "COPY", "st": 1, "line": 3, "vis": "–", "msg": "2/4 [COPY_HOST_PTR] Kernel: a device saját másolatát olvassa és írja; a hostData-hoz nem nyúl."}, {"flag": "COPY", "st": 2, "line": 4, "vis": "nem (független másolat)", "msg": "3/4 [COPY_HOST_PTR] Host módosít (hostData[0] = 42): a device ezt nem látja – a két példány független. Láthatóvá csak egy újabb enqueueWriteBuffer tenné. Látszik a device-on? nem (független másolat)."}, {"flag": "COPY", "st": 3, "line": 5, "vis": "nem (független másolat)", "msg": "4/4 [COPY_HOST_PTR] Map/read: a device tartalma jön vissza; a host módosítása nem jutott át."}], "USE": [{"flag": "USE", "st": 0, "line": 1, "vis": "–", "msg": "1/4 [USE_HOST_PTR] Létrehozás: a buffer a hostData-ra hivatkozik (nincs saját példány); az implementáció gyorsítómásolatot tarthat a device-on. A hostData-nak élnie kell a buffer élettartamáig."}, {"flag": "USE", "st": 1, "line": 3, "vis": "–", "msg": "2/4 [USE_HOST_PTR] Kernel: diszkrét GPU-n az implementáció jellemzően a device-gyorsítómásolatba tölti az adatot (implementációfüggő)."}, {"flag": "USE", "st": 2, "line": 4, "vis": "csak map/unmap vagy szinkronizáció után garantált", "msg": "3/4 [USE_HOST_PTR] Host módosít (hostData[0] = 42): a device-on csak map/unmap vagy szinkronizáció után garantáltan látszik. Látszik a device-on? csak map/unmap vagy szinkronizáció után garantált."}, {"flag": "USE", "st": 3, "line": 5, "vis": "csak map/unmap vagy szinkronizáció után garantált", "msg": "4/4 [USE_HOST_PTR] Map/unmap: a clEnqueueMapBuffer a hostData-val szinkronizált területet ad; unmap után a device nézete konzisztens."}], "ALLOC": [{"flag": "ALLOC", "st": 0, "line": 2, "vis": "–", "msg": "1/4 [ALLOC_HOST_PTR] Létrehozás host_ptr = nullptr mellett: a driver host által elérhető, pinned memóriát foglal; a hostData-hoz nincs kapcsolat."}, {"flag": "ALLOC", "st": 1, "line": 3, "vis": "–", "msg": "2/4 [ALLOC_HOST_PTR] Kernel: az adat DMA-val jut a device-ra, vagy a device közvetlenül olvassa (implementációfüggő)."}, {"flag": "ALLOC", "st": 2, "line": 5, "vis": "csak map/unmap vagy szinkronizáció után garantált", "msg": "3/4 [ALLOC_HOST_PTR] Host módosít: csak a map-elt pointeren keresztül (p[0] = 42); a device-on csak unmap vagy szinkronizáció után garantált. Látszik a device-on? csak map/unmap vagy szinkronizáció után garantált."}, {"flag": "ALLOC", "st": 3, "line": 6, "vis": "csak map/unmap vagy szinkronizáció után garantált", "msg": "4/4 [ALLOC_HOST_PTR] Map/unmap: a clEnqueueMapBuffer a pinned területre ad pointert (másolás nélkül); unmap után a device látja."}]};
function pick(){ const f = document.querySelector('input[name=flag]:checked').value; setSteps(ALL[f]); }
function box2(x, y, w, h, txt, fill, opts){
  const o = opts || {};
  el("rect", {x: x, y: y, width: w, height: h, rx: 6, fill: fill, stroke: css("--line"), "stroke-width": o.sw || 1.2, "stroke-dasharray": o.dash || "none"});
  String(txt).split("\n").forEach((t, i, a) => el("text", {x: x + w / 2, y: y + h / 2 + 5 + (i - (a.length - 1) / 2) * 16, "text-anchor": "middle", "font-size": 13}, t));
}
function arr(x1, y1, x2, y2, dash){
  el("line", {x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": dash ? "6 4" : "none", "marker-end": "url(#ah)"});
}
function render(s){
  svg.setAttribute("viewBox", "0 0 560 300");
  svg.innerHTML = '<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="' + css("--line") + '"/></marker>' +
    '<pattern id="xh" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0,0 L8,8 M8,0 L0,8" stroke="' + css("--line") + '" stroke-width="1"/></pattern></defs>';
  const C = css("--cell"), H = css("--cellhl"), L = css("--line"), A = css("--hl2");
  el("rect", {x: 10, y: 10, width: 540, height: 110, fill: "none", stroke: L});
  el("rect", {x: 10, y: 190, width: 540, height: 100, fill: "none", stroke: L});
  el("text", {x: 18, y: 28, "font-size": 12, "font-style": "italic"}, "Host RAM");
  el("text", {x: 18, y: 284, "font-size": 12, "font-style": "italic"}, "Device VRAM");
  const mod = s.st >= 2;
  if (s.flag === "COPY") {
    box2(40, 40, 170, 60, "hostData (16 MiB)" + (mod ? "\n[0] = 42" : ""), C);
    el("text", {x: 225, y: 75, "font-size": 13, "font-weight": "bold", fill: A}, "felszabadítható");
    box2(40, 210, 170, 60, "buffer (saját példány)" + (s.st >= 1 ? "\nkernel írja" : ""), s.st === 1 ? H : C);
    if (s.st === 0) arr(125, 100, 125, 208, false);
    if (s.st === 3) arr(150, 208, 150, 102, false);
    if (mod) el("text", {x: 260, y: 160, "font-size": 13}, "host módosítás → device: nem látszik");
  } else if (s.flag === "USE") {
    box2(40, 40, 170, 60, "hostData (16 MiB)" + (mod ? "\n[0] = 42" : ""), C, {sw: 2.5});
    el("text", {x: 225, y: 65, "font-size": 13, "font-weight": "bold", fill: A}, "élnie kell a buffer");
    el("text", {x: 225, y: 82, "font-size": 13, "font-weight": "bold", fill: A}, "élettartamáig");
    box2(40, 210, 170, 60, "gyorsítómásolat (?)", s.st >= 1 ? H : C, {dash: "5 4"});
    arr(110, 208, 110, 102, true);
    el("text", {x: 118, y: 160, "font-size": 12}, "buffer → hostData");
    if (s.st === 3) { el("circle", {cx: 300, cy: 155, r: 6, fill: L}); el("text", {x: 312, y: 160, "font-size": 13}, "map/unmap: szinkronizációs pont"); }
    else if (mod) el("text", {x: 260, y: 150, "font-size": 13}, "device: csak map/unmap után garantált");
  } else {
    el("rect", {x: 40, y: 40, width: 170, height: 60, rx: 6, fill: "url(#xh)", stroke: L});
    el("rect", {x: 70, y: 58, width: 110, height: 24, fill: css("--bg")});
    el("text", {x: 125, y: 75, "text-anchor": "middle", "font-size": 13}, "pinned terület");
    el("text", {x: 225, y: 110, "font-size": 13, "font-family": "monospace", "font-weight": "bold", fill: A}, "host_ptr = nullptr");
    if (s.st >= 2) { box2(330, 40, 150, 50, "p (map)" + (mod ? ": p[0] = 42" : ""), H, {dash: "5 4"}); arr(212, 70, 328, 66, true); }
    box2(40, 210, 170, 60, "buffer", s.st === 1 ? H : C);
    arr(125, 100, 125, 208, false);
    el("text", {x: 133, y: 160, "font-size": 12}, "DMA");
    if (mod) el("text", {x: 260, y: 160, "font-size": 13}, "device: csak unmap után garantált");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
