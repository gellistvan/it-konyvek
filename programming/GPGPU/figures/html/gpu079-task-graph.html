<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feladatgráf és kritikus út</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A <input id="tA" type="number" min="1" max="20" value="2" onchange="show(k)" style="width:46px" aria-label="A ideje"></label> <label>B <input id="tB" type="number" min="1" max="20" value="3" onchange="show(k)" style="width:46px" aria-label="B ideje"></label> <label>C <input id="tC" type="number" min="1" max="20" value="1" onchange="show(k)" style="width:46px" aria-label="C ideje"></label> <label>D <input id="tD" type="number" min="1" max="20" value="4" onchange="show(k)" style="width:46px" aria-label="D ideje"></label> <label>E <input id="tE" type="number" min="1" max="20" value="2" onchange="show(k)" style="width:46px" aria-label="E ideje"></label> <label>F <input id="tF" type="number" min="1" max="20" value="1" onchange="show(k)" style="width:46px" aria-label="F ideje"></label> <label>munkások <input id="wk" type="range" min="1" max="4" value="2" oninput="show(k)" style="width:80px"> <span id="wkv">2</span></label><style>div.ctl[aria-label="Lejátszás vezérlői"]{display:none}</style></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hatcsúcsú feladatgráf a kritikus úttal, mellette a hossza; alatta a listás ütemezés Gantt-diagramja a kritikus út és az összes munka / munkásszám alsó korláttal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A csúcsidők átírhatók; a kritikus út és az ütemterv élőben újraszámolódik. Listás ütemezés kritikusút-prioritással, nem megszakítható feladatok, idők tetszőleges egységben. Kezdőállapot: A = 2, B = 3, C = 1, D = 4, E = 2, F = 1, két munkás (befejezés 10).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const NODES = ["A", "B", "C", "D", "E", "F"], EDG = [["A","B"],["A","C"],["B","D"],["C","E"],["D","F"],["E","F"]];
const POS = {A: [60, 150], B: [200, 80], C: [200, 220], D: [340, 80], E: [340, 220], F: [480, 150]};
function tm(){ const o = {}; NODES.forEach(v => { const x = +document.getElementById("t" + v).value; o[v] = Number.isFinite(x) && x > 0 ? Math.round(x) : 1; }); return o; }
const pre = v => EDG.filter(e => e[1] === v).map(e => e[0]), suc = v => EDG.filter(e => e[0] === v).map(e => e[1]);
function crit(T){ const est = {}, par = {};
  NODES.forEach(v => { const p = pre(v); let b = null; p.forEach(u => { if (b === null || est[u] + T[u] > est[b] + T[b] || (est[u] + T[u] === est[b] + T[b] && u < b)) b = u; }); est[v] = b ? est[b] + T[b] : 0; par[v] = b; });
  let sink = NODES[0]; NODES.forEach(v => { if (est[v] + T[v] > est[sink] + T[sink]) sink = v; });
  const path = []; for (let v = sink; v; v = par[v]) path.unshift(v);
  const rest = {}; [...NODES].reverse().forEach(v => { rest[v] = T[v] + Math.max(0, ...suc(v).map(w => rest[w])); });
  return {L: est[sink] + T[sink], path, rest}; }
function sched(T, Wk){ const {rest} = crit(T), fin = {}, wf = new Array(Wk).fill(0), seg = []; const rem = new Set(NODES); let t = 0, guard = 0;
  while (rem.size && guard++ < 1000) { const ready = [...rem].filter(v => pre(v).every(u => fin[u] !== undefined && fin[u] <= t)).sort((a, b) => rest[b] - rest[a] || (a < b ? -1 : 1));
    for (let w = 0; w < Wk; w++) if (wf[w] <= t && ready.length) { const v = ready.shift(); fin[v] = t + T[v]; wf[w] = fin[v]; seg.push([w, t, fin[v], v]); rem.delete(v); }
    const nx = [...wf, ...Object.values(fin)].filter(x => x > t); t = nx.length ? Math.min(...nx) : t + 1; }
  return {seg, end: Math.max(...Object.values(fin))}; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 420");
  const T = tm(), C = crit(T), Wk = +document.getElementById("wk").value, S = sched(T, Wk), tot = NODES.reduce((a, v) => a + T[v], 0);
  document.getElementById("wkv").textContent = Wk;
  const onP = (u, v) => { const i = C.path.indexOf(u); return i >= 0 && C.path[i + 1] === v; };
  const mk = document.createElementNS(NS, "defs");
  mk.innerHTML = `<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(mk);
  EDG.forEach(([u, v]) => { const [x1, y1] = POS[u], [x2, y2] = POS[v], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), r = 30;
    el("line", {x1: x1 + dx/d*r, y1: y1 + dy/d*r, x2: x2 - dx/d*(r + 2), y2: y2 - dy/d*(r + 2), stroke: css("--fg"), "stroke-width": onP(u, v) ? 3.2 : 1.2, "stroke-dasharray": onP(u, v) ? "none" : "6 4", "marker-end": "url(#ar)"}); });
  NODES.forEach(v => { const [x, y] = POS[v], c = C.path.includes(v);
    if (c) el("circle", {cx: x, cy: y, r: 32, fill: "none", stroke: css("--hl2"), "stroke-width": 2});
    el("circle", {cx: x, cy: y, r: 26, fill: c ? css("--cellhl") : css("--cell"), stroke: css("--fg"), "stroke-width": 1.5});
    el("text", {x, y: y - 2, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, v);
    el("text", {x, y: y + 15, "text-anchor": "middle", "font-size": 12}, String(T[v])); });
  el("text", {x: 560, y: 70, "font-size": 13}, "kritikus út: " + C.path.join("–"));
  el("text", {x: 560, y: 90, "font-size": 13}, "hossza: " + C.path.map(v => T[v]).join(" + ") + " = " + C.L);
  el("text", {x: 560, y: 110, "font-size": 13}, "összes munka: " + tot);
  // Gantt
  const Y0 = 290, rh = Math.min(28, 110 / Wk), mx = Math.max(S.end, tot), X = t => 90 + t / mx * 560;
  for (let w = 0; w < Wk; w++) el("text", {x: 84, y: Y0 + w*rh + rh/2 + 4, "text-anchor": "end", "font-size": 12}, (w + 1) + ". munkás");
  S.seg.forEach(([w, a, b, v]) => { el("rect", {x: X(a), y: Y0 + w*rh + 2, width: X(b) - X(a) - 1, height: rh - 4, fill: C.path.includes(v) ? css("--cellhl") : css("--cell"), stroke: css("--line")});
    el("text", {x: (X(a) + X(b))/2, y: Y0 + w*rh + rh/2 + 4, "text-anchor": "middle", "font-size": 12}, v); });
  [["kritikus út", C.L, "none"], ["munka / munkás", tot / Wk, "5 4"]].forEach(([lab, val, da], q) => {
    el("line", {x1: X(val), y1: Y0 - 30 + q*12, x2: X(val), y2: Y0 + Wk*rh + 4, stroke: css("--hl"), "stroke-width": 1.4, "stroke-dasharray": da});
    el("text", {x: X(val) + 3, y: Y0 - 32 + q*12, "font-size": 11, fill: css("--hl")}, lab); });
  for (let q = 0; q <= mx; q += Math.max(1, Math.ceil(mx / 13))) el("text", {x: X(q), y: Y0 + Wk*rh + 18, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, String(q));
  const lb = Math.max(C.L, tot / Wk);
  status.textContent = `${Wk} munkás: befejezés ${S.end}; alsó korlátok: kritikus út ${C.L}, összes munka / munkásszám = ${tot}/${Wk} = ${(tot / Wk).toFixed(2).replace(".", ",")}` + (S.end <= lb + 1e-9 ? " – az ütemterv eléri az alsó korlátot" : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
