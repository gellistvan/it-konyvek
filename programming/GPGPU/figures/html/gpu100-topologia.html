<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU-topológiák és P2P-útvonalak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--gpu:#ddd;--line:#000;--sel:#c55a11}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--gpu:#444;--line:#ddd;--sel:#f0a060}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
g.gpu{cursor:pointer}g.gpu:focus{outline:none}g.gpu:focus rect{stroke-width:3}
#status{min-height:4.4em;margin:4px 0}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl"><label><input type="checkbox" id="peer" checked> peer access engedélyezve (<code>cudaDeviceEnablePeerAccess</code>)</label>
<button id="reset">Alaphelyzet (GPU0 → GPU1, PCIe)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 950 330" role="img" aria-label="Három topológia: PCIe-fa, NVLink-híd, DGX A100 NVSwitch-crossbar. Kattintson két GPU-ra ugyanazon a panelen."></svg>
<p class="small">Kattintással (vagy Tab + Enter) válasszon ki két GPU-t ugyanazon a panelen. Névleges gyártói értékek
(A100, NVLink 3: 25 GB/s irányonként linkenként; PCIe 4.0 x16: kb. 32 GB/s irányonként), nem mérés.</p>
<script>
const D = {"pairs": {"A:0-1": {"topo": "PIX", "peer": "1", "bw": 32, "path": "P2P a PCIe switchen át (a CPU-t és a host DRAM-ot megkerüli)"}, "A:0-2": {"topo": "PHB", "peer": "platformfüggő (gyakran 0)", "bw": 32, "path": "a root complexen (host bridge) át; P2P híján host-staged: GPU → host DRAM → GPU"}, "A:1-2": {"topo": "PHB", "peer": "platformfüggő (gyakran 0)", "bw": 32, "path": "a root complexen (host bridge) át; P2P híján host-staged: GPU → host DRAM → GPU"}, "B:0-1": {"topo": "NV12", "peer": "1", "bw": 300, "path": "közvetlen NVLink-híd (12 link)"}, "C": {"topo": "NV12", "peer": "1", "bw": 300, "path": "NVSwitch-crossbar: 6 switch × 2 link = 12 link GPU-nként"}}, "pcie": 32};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
// GPU-pozíciók panelenként
const G = {A:{0:[20,250],1:[130,250],2:[260,250]}, B:{0:[350,90],1:[480,90]}, C:{}};
for(let i=0;i<8;i++) G.C[i]=[590+i*37,70];
let sel = {panel:"A", a:0, b:1};
let pick = [];
function line(x1,y1,x2,y2,o){return el("line",Object.assign({x1,y1,x2,y2,stroke:cs("--line"),"stroke-width":1.3},o||{}));}
function draw(){
  svg.innerHTML="";
  const L=cs("--line"), S=cs("--sel");
  el("text",{x:10,y:18,"font-weight":"bold"},"(A) PCIe-fa");
  el("text",{x:350,y:18,"font-weight":"bold"},"(B) NVLink-híd");
  el("text",{x:590,y:18,"font-weight":"bold"},"(C) DGX A100: 8 GPU, 6 NVSwitch");
  // A panel
  el("rect",{x:70,y:40,width:150,height:40,rx:6,fill:cs("--cell"),stroke:L});el("text",{x:145,y:65,"text-anchor":"middle"},"CPU + root complex");
  el("rect",{x:235,y:40,width:90,height:40,rx:6,fill:cs("--gpu"),stroke:L});el("text",{x:280,y:65,"text-anchor":"middle"},"host DRAM");
  line(220,60,235,60);
  el("rect",{x:20,y:140,width:150,height:34,rx:6,fill:cs("--cell"),stroke:L});el("text",{x:95,y:162,"text-anchor":"middle"},"PCIe switch");
  line(95,140,120,80); line(290,250,190,80); line(50,250,70,174); line(160,250,120,174);
  // B panel
  const b0=G.B[0], b1=G.B[1];
  el("line",{x1:b0[0]+90,y1:b0[1]+22,x2:b1[0],y2:b1[1]+22,stroke:L,"stroke-width":7});
  el("line",{x1:b0[0]+90,y1:b0[1]+22,x2:b1[0],y2:b1[1]+22,stroke:cs("--bg"),"stroke-width":2.5});
  el("text",{x:465,y:160,"text-anchor":"middle","font-weight":"bold"},"NV12");
  el("text",{x:465,y:182,"text-anchor":"middle"},"300 GB/s irányonként");
  // C panel
  for(let j=0;j<6;j++){const sx=592+j*50; for(let i=0;i<8;i++){const g=G.C[i]; for(const d of [-2,2]) line(g[0]+15+d,g[1]+40,sx+20+d,230,{"stroke-width":0.5});}
    el("rect",{x:sx,y:230,width:40,height:30,rx:5,fill:cs("--cell"),stroke:L,"stroke-width":1.8});el("text",{x:sx+20,y:250,"text-anchor":"middle","font-size":11},"SW"+j);}
  el("text",{x:735,y:290,"text-anchor":"middle","font-size":12},"GPU-nként 6 × 2 = 12 link;");el("text",{x:735,y:306,"text-anchor":"middle","font-size":12},"bármely pár: 300 GB/s irányonként");
  el("rect",{x:375,y:250,width:180,height:34,rx:6,fill:cs("--gpu"),stroke:L,"stroke-dasharray":"4 3"});el("text",{x:465,y:272,"text-anchor":"middle","font-size":12},"host DRAM (PCIe-n át)");
  el("rect",{x:880,y:140,width:62,height:50,rx:6,fill:cs("--gpu"),stroke:L,"stroke-dasharray":"4 3"});el("text",{x:911,y:161,"text-anchor":"middle","font-size":11},"host");el("text",{x:911,y:177,"text-anchor":"middle","font-size":11},"DRAM");
  // útvonal kiemelése
  const peer=document.getElementById("peer").checked;
  const p=sel.panel, A=G[p][sel.a], B=G[p][sel.b], w=(p==="C")?30:90;
  const ca=[A[0]+w/2,A[1]], cb=[B[0]+w/2,B[1]];
  let pts=[], dash="2 4";
  const staged = !peer || (p==="A" && (sel.a===2||sel.b===2));
  if(staged){ // host-staged: GPU → host DRAM → GPU
    pts=[[ca[0],ca[1]],[280,80],[cb[0],cb[1]]]; dash="8 5";
  } else if(p==="A"){ pts=[[ca[0],ca[1]],[95,174],[cb[0],cb[1]]]; }
  else if(p==="B"){ pts=[[A[0]+90,A[1]+30],[B[0],B[1]+30]]; }
  else { const sw=612; pts=[[ca[0],ca[1]+40],[sw,230],[cb[0],cb[1]+40]]; }
  if(p!=="A" && staged){ // a B/C panelen a host-staged út a PCIe-n át megy (a hostot jelképesen a CPU-doboz mutatja)
    pts = p==="B" ? [[ca[0],ca[1]+40],[465,250],[cb[0],cb[1]+40]] : [[ca[0],ca[1]+40],[880,165],[cb[0],cb[1]+40]];
  }
  el("polyline",{points:pts.map(q=>q.join(",")).join(" "),fill:"none",stroke:S,"stroke-width":3.5,"stroke-dasharray":dash});
  // GPU-k
  for(const pn of ["A","B","C"]) for(const id in G[pn]){
    const [x,y]=G[pn][id], gw=(pn==="C")?30:90, on=(pn===sel.panel&&(+id===sel.a||+id===sel.b)) || pick.some(q=>q.panel===pn&&q.id===+id);
    const g=el("g",{class:"gpu",tabindex:0,role:"button","aria-label":`${pn} panel GPU${id}`});
    el("rect",{x,y,width:gw,height:40,rx:6,fill:cs("--gpu"),stroke:on?S:L,"stroke-width":on?3.5:1.3},undefined,g);
    el("text",{x:x+gw/2,y:y+25,"text-anchor":"middle","font-size":pn==="C"?12:14},(pn==="C"?"G":"GPU")+id,g);
    const act=()=>choose(pn,+id); g.addEventListener("click",act); g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});
  }
  // állapotsor
  let info;
  if(p==="A"){ const key=`A:${Math.min(sel.a,sel.b)}-${Math.max(sel.a,sel.b)}`; info=D.pairs[key]; }
  else if(p==="B") info=D.pairs["B:0-1"]; else info=D.pairs["C"];
  let msg=`${p} panel, GPU${sel.a} → GPU${sel.b}: topo -m jelölés ${info.topo}; cudaDeviceCanAccessPeer várhatóan: ${info.peer}. `;
  if(staged) msg+=`Útvonal: host-staged (GPU → host DRAM → GPU), két PCIe-átvitel, irányonként legfeljebb kb. ${D.pcie} GB/s` + (peer?" (a PHB-párnál P2P híján).":" – a peer access ki van kapcsolva.");
  else msg+=`Útvonal: ${info.path}; névlegesen ${info.bw} GB/s irányonként.`;
  document.getElementById("status").textContent=msg;
}
function choose(pn,id){
  if(pick.length===1 && pick[0].panel===pn && pick[0].id!==id){ sel={panel:pn,a:pick[0].id,b:id}; pick=[]; }
  else pick=[{panel:pn,id}];
  draw();
  if(pick.length===1) document.getElementById("status").textContent=`Kiválasztva: ${pn} panel GPU${id}. Válasszon egy második GPU-t ugyanezen a panelen.`;
}
document.getElementById("peer").onchange=draw;
document.getElementById("reset").onclick=()=>{sel={panel:"A",a:0,b:1};pick=[];document.getElementById("peer").checked=true;draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
