<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amdahl-gyorsítás telítődése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.ctl label{min-width:9.5em}
input[type=range]{flex:1;min-width:160px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:1.5em;font-weight:bold}
svg{width:100%;height:auto;display:block;touch-action:none}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label for="p">P (párhuzamos hányad)</label><input id="p" type="range" min="0.5" max="0.999" step="0.001" value="0.95" aria-label="P párhuzamos hányad"><b id="pv"></b></div>
<div class="ctl"><label for="o">állandó overhead</label><input id="o" type="range" min="0" max="0.2" step="0.005" value="0" aria-label="Állandó soros overhead"><b id="ov"></b></div>
<div class="ctl"><label for="n">N (kurzor)</label><input id="n" type="range" min="0" max="4" step="0.01" value="2" aria-label="N értéke logaritmikus skálán"><b id="nv"></b>
<button id="r">alapállapot (P = 0,95, overhead 0)</button><button id="m">mintafeladat (overhead 0,04)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 340" role="img" aria-label="Amdahl-gyorsítás görbéi logaritmikus tengelyekkel; a halvány görbék P = 0,90, 0,95, 0,99, a kiemelt görbe a beállított P és overhead."></svg>
<p class="small">Ideális Amdahl-modell: S(N) = 1 / ((1 − P) + P/N + overhead), a párhuzamos rész tökéletes skálázásával; az overhead a soros futásidő arányában értendő. Elméleti modell, nem mérés. Az N-kurzort a csúszkával vagy a rajzon egérrel/érintéssel mozgathatod.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const fmt = (x, d) => x.toFixed(d).replace(".", ",");
const L = 60, R = 500, T = 14, B = 290, YMAX = Math.log10(200);
const X = lg => L + (R - L) * lg / 4, Y = v => B - (B - T) * Math.log10(Math.max(1, v)) / YMAX;
const S = (N, P, o) => 1 / ((1 - P) + P / N + o);
function curve(P, o, attrs){ let d = ""; for (let i = 0; i <= 200; i++) { const lg = 4 * i / 200; d += (d ? "L" : "M") + X(lg).toFixed(1) + "," + Y(S(Math.pow(10, lg), P, o)).toFixed(1); } el("path", Object.assign({d: d, fill: "none"}, attrs)); }
function draw(){
  const P = +document.getElementById("p").value, o = +document.getElementById("o").value, lg = +document.getElementById("n").value, N = Math.pow(10, lg);
  document.getElementById("pv").textContent = fmt(P, 3); document.getElementById("ov").textContent = fmt(o, 3); document.getElementById("nv").textContent = N < 100 ? fmt(N, 1) : Math.round(N).toLocaleString("hu-HU");
  svg.innerHTML = "";
  [1, 2, 5, 10, 20, 50, 100, 200].forEach(v => { el("line", {x1: L, y1: Y(v), x2: R, y2: Y(v), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); });
  [0, 1, 2, 3, 4].forEach(e => { el("line", {x1: X(e), y1: T, x2: X(e), y2: B, stroke: css("--grid")}); el("text", {x: X(e), y: B + 16, "text-anchor": "middle", "font-size": 11}, ["1", "10", "100", "1000", "10 000"][e]); });
  el("line", {x1: L, y1: B, x2: R, y2: B, stroke: css("--line")}); el("line", {x1: L, y1: T, x2: L, y2: B, stroke: css("--line")});
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "N (log skála)");
  el("text", {x: 14, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 14 ${(T + B) / 2})`}, "S(N) (log skála)");
  [[0.90, "4 0"], [0.95, "7 4"], [0.99, "9 3 2 3"]].forEach(c => { curve(c[0], 0, {stroke: css("--muted"), "stroke-width": 1.2, "stroke-dasharray": c[1]}); const a = 1 / (1 - c[0]); el("text", {x: R + 6, y: Y(S(1e4, c[0], 0)) + 4, "font-size": 11, fill: css("--muted")}, "P = " + fmt(c[0], 2)); });
  const asym = 1 / ((1 - P) + o);
  el("line", {x1: L, y1: Y(asym), x2: R, y2: Y(asym), stroke: css("--hl2"), "stroke-dasharray": "5 4", "stroke-width": 1.5});
  el("text", {x: L + 6, y: Y(asym) - 5, "font-size": 12, fill: css("--hl2")}, "aszimptota 1/((1 − P) + overhead) = " + fmt(asym, 2));
  curve(P, o, {stroke: css("--hl"), "stroke-width": 3});
  const s = S(N, P, o);
  el("line", {x1: X(lg), y1: T, x2: X(lg), y2: B, stroke: css("--hl"), "stroke-width": 1, "stroke-dasharray": "2 3"});
  el("circle", {cx: X(lg), cy: Y(s), r: 6, fill: css("--bg"), stroke: css("--hl"), "stroke-width": 2.5});
  el("text", {x: X(lg) + (lg > 3.2 ? -10 : 10), y: Y(s) + 18, "text-anchor": lg > 3.2 ? "end" : "start", "font-size": 13, "font-weight": "bold"}, "S = " + fmt(s, 2));
  document.getElementById("status").textContent = `N = ${N < 100 ? fmt(N, 1) : Math.round(N).toLocaleString("hu-HU")}: S(N) = ${fmt(s, 2)}; felső korlát N → ∞ esetén ${fmt(asym, 2)} (a korlát ${fmt(100 * s / asym, 1)}%-a)`;
}
["p", "o", "n"].forEach(id => document.getElementById(id).addEventListener("input", draw));
function setN(ev){ const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 600; const lg = Math.max(0, Math.min(4, (x - L) / (R - L) * 4)); document.getElementById("n").value = lg.toFixed(2); draw(); }
svg.addEventListener("pointermove", setN); svg.addEventListener("pointerdown", setN);
document.getElementById("r").onclick = () => { document.getElementById("p").value = 0.95; document.getElementById("o").value = 0; document.getElementById("n").value = 2; draw(); };
document.getElementById("m").onclick = () => { document.getElementById("p").value = 0.95; document.getElementById("o").value = 0.04; document.getElementById("n").value = 2; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
