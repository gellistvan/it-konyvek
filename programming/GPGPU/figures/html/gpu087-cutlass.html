<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUTLASS GEMM hierarchia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--cell:#fff;--g1:#ddd;--g2:#555;--warn:#a00}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--cell:#262626;--g1:#444;--g2:#bbb;--warn:#f88}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;gap:6px;align-items:center}
button,select{font:inherit;padding:3px 8px}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:bold}
#warn{color:var(--warn);font-weight:bold;min-height:1.4em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Szint">
  <span>Szint:</span>
  <button data-z="0">1. threadblock</button><button data-z="1">2. warp</button>
  <button data-z="2">3. mma.sync</button><button data-z="3">4. pipeline</button>
  <button id="play">▶ Pipeline</button>
</div>
<div class="ctl" role="group" aria-label="Alakok">
  <label>threadblock <select id="tb"></select></label>
  <label>warp <select id="wp"></select></label>
  <label>instruction <select id="ins"></select></label>
  <label>stage <input id="st" type="range" min="2" max="6" step="1"><b id="stv"></b></label>
  <button id="lab">Labor (128/64/16·8·16, 3)</button>
</div>
<div id="status" aria-live="polite"></div>
<div id="warn" aria-live="polite"></div>
<svg id="v" viewBox="0 -40 640 340" role="img" aria-label="CUTLASS hierarchia: threadblock tile, warp tile, mma.sync csempék, shared pipeline"></svg>
<p class="small">Sm80, FP16 A/B (2 bájt), FP32 akkumulátor, M = N = K = 16384. Shared-igény = stage·(BM·BK + BK·BN)·2 B (az epilogue
és az igazítás nélkül). 48 KiB fölött a kernelnek opt-in dinamikus shared memória kell (cudaFuncSetAttribute). Kattints a rajzra a következő szinthez.</p>
<script>
const D = {"tb": [128, 128, 32], "wp": [64, 64, 32], "ins": [16, 8, 16], "st": 3};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(t, a, s){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(s!==undefined)e.textContent=s;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const $ = id => document.getElementById(id);
const TBS = [[64,64,32],[128,64,32],[64,128,32],[128,128,32],[128,256,32],[256,128,32],[128,128,64],[64,64,64],[256,128,64]];
const WPS = [[32,32,32],[64,32,32],[32,64,32],[64,64,32],[32,32,64],[64,32,64],[32,64,64],[64,64,64]];
const INS = [[16,8,16],[16,8,8]];
const fmt = a => a.join("×");
function fill(sel, arr, def){ arr.forEach(a => { const o = document.createElement("option"); o.value = fmt(a); o.textContent = fmt(a); sel.appendChild(o); }); sel.value = fmt(def); }
fill($("tb"), TBS, D.tb); fill($("wp"), WPS, D.wp); fill($("ins"), INS, D.ins); $("st").value = D.st;
let zoom = 0, it = 0, timer = null;
const parse = s => s.split("×").map(Number);
function hl(){ document.querySelectorAll("[data-z]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.z === zoom))); }
function draw(){
  const tb = parse($("tb").value), wp = parse($("wp").value), ins = parse($("ins").value), st = +$("st").value;
  $("stv").textContent = st; hl();
  const valid = tb[0] % wp[0] === 0 && tb[1] % wp[1] === 0 && wp[2] === tb[2] && wp[0] % ins[0] === 0 && wp[1] % ins[1] === 0 && wp[2] % ins[2] === 0;
  const warps = (tb[0]/wp[0]) * (tb[1]/wp[1]), mma = (wp[0]/ins[0]) * (wp[1]/ins[1]), ks = wp[2]/ins[2];
  const smem = st * (tb[0]*tb[2] + tb[2]*tb[1]) * 2, kib = smem / 1024;
  svg.innerHTML = "";
  if (!valid){
    $("status").textContent = "Érvénytelen kombináció: a warp tile-nak osztania kell a threadblock tile-t (M, N), a K-mélységnek egyeznie kell, és az instruction shape-nek osztania kell a warp tile-t.";
    $("warn").textContent = ""; return;
  }
  const C = (x, y, w, h, f, extra) => el("rect", Object.assign({x, y, width: w, height: h, fill: f, stroke: css("--line"), "stroke-width": 1}, extra || {}));
  if (zoom === 0){
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) C(200 + j*30, 40 + i*30, 30, 30, (i === 2 && j === 3) ? css("--g2") : css("--cell"), {"stroke-width": (i === 2 && j === 3) ? 3 : 0.5});
    C(40, 100, 120, 30, css("--g1")); el("text", {x: 100, y: 150, "text-anchor": "middle", "font-size": 13}, `A-szelet ${tb[0]}×${tb[2]}`);
    C(290, -35, 30, 70, css("--g1")); el("text", {x: 330, y: 0, "font-size": 13}, `B-szelet ${tb[2]}×${tb[1]}`);
    el("text", {x: 460, y: 120, "font-size": 13}, `grid: ${16384/tb[0]}×${16384/tb[1]} tile`);
    el("text", {x: 460, y: 140, "font-size": 13}, `K/${tb[2]} = ${16384/tb[2]} iteráció`);
  } else if (zoom === 1){
    const nr = tb[0]/wp[0], nc = tb[1]/wp[1], s = 240 / Math.max(nr, nc);
    for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++){
      C(160 + c*s, 30 + r*s, s, s, (r + c) % 2 ? css("--g1") : css("--cell"));
      el("text", {x: 160 + c*s + s/2, y: 30 + r*s + s/2 + 5, "text-anchor": "middle", "font-size": 13}, `warp ${r*nc + c}`);
    }
    el("rect", {x: 160, y: 30, width: nc*s, height: nr*s, fill: "none", stroke: css("--line"), "stroke-width": 3});
    el("text", {x: 160, y: 22, "font-size": 13}, `threadblock ${tb[0]}×${tb[1]}: ${nr}×${nc} warp, egyenként ${wp[0]}×${wp[1]}`);
  } else if (zoom === 2){
    const nr = wp[0]/ins[0], nc = wp[1]/ins[1], cw = Math.min(40, 440 / nc), ch = Math.min(cw * ins[0]/ins[1], 240 / nr);
    for (let r = 0; r < nr; r++) for (let c = 0; c < nc; c++) C(100 + c*cw, 30 + r*ch, cw, ch, (r + c) % 2 ? css("--g1") : css("--cell"), {"stroke-width": 0.6});
    el("text", {x: 100, y: 22, "font-size": 13}, `warp tile ${wp[0]}×${wp[1]}: ${nr}×${nc} = ${mma} mma.sync (${ins[0]}×${ins[1]}) K-lépésenként, ${ks} K-lépés`);
  } else {
    const rows = 5;
    for (let s = 0; s < st; s++) el("text", {x: 120 + s*80 + 36, y: 22, "text-anchor": "middle", "font-size": 12}, `stage ${s}`);
    for (let i = 0; i < rows; i++){
      const iter = it + i, y = 32 + i*48;
      el("text", {x: 110, y: y + 26, "text-anchor": "end", "font-size": 12, "font-weight": i === 0 ? "bold" : "normal"}, `k-iter ${iter}`);
      for (let s = 0; s < st; s++){
        const code = s === iter % st ? "S" : (s === (iter + st - 1) % st ? "B" : "K");
        const f = code === "S" ? css("--g2") : (code === "K" ? css("--g1") : css("--cell"));
        C(120 + s*80, y, 72, 38, f, {"stroke-dasharray": code === "B" ? "4 3" : "", "stroke-width": i === 0 ? 2 : 1});
        el("text", {x: 156 + s*80, y: y + 24, "text-anchor": "middle", "font-size": 12, fill: code === "S" ? css("--bg") : css("--fg")}, code === "S" ? "számol" : (code === "K" ? "kész" : "betölt"));
      }
    }
  }
  $("status").textContent = `${warps} warp (${warps*32} szál); ${mma} mma.sync/warp K-lépésenként, ${ks} K-lépés → ${mma*ks} mma.sync/warp K-tile-onként; `
    + `shared: ${st}·(${tb[0]}·${tb[2]} + ${tb[2]}·${tb[1]})·2 B = ${smem.toLocaleString("hu-HU")} B = ${kib.toLocaleString("hu-HU")} KiB.`;
  $("warn").textContent = kib > 48 ? "⚠ 48 KiB fölött: opt-in dinamikus shared szükséges (cudaFuncSetAttribute … MaxDynamicSharedMemorySize)." : "";
}
document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { zoom = +b.dataset.z; draw(); });
svg.addEventListener("click", () => { zoom = (zoom + 1) % 4; draw(); });
for (const k of ["tb","wp","ins","st"]) $(k).addEventListener("input", draw);
$("lab").onclick = () => { $("tb").value = fmt(D.tb); $("wp").value = fmt(D.wp); $("ins").value = fmt(D.ins); $("st").value = D.st; draw(); };
$("play").onclick = () => {
  if (timer){ clearInterval(timer); timer = null; $("play").textContent = "▶ Pipeline"; return; }
  zoom = 3; it = 0; $("play").textContent = "⏸ Megállítás"; draw();
  timer = setInterval(() => { it++; draw(); if (it >= 12){ clearInterval(timer); timer = null; $("play").textContent = "▶ Pipeline"; } }, 700);
};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
