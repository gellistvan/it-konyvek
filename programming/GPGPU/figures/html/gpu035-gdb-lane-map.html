<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szál-, warp- és lane-koordináták a cuda-gdb-ben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bx: <input id="bx" type="number" min="1" max="32" value="32" style="width:4em" aria-label="blockDim.x"></label><label>By: <input id="by" type="number" min="1" max="32" value="1" style="width:4em" aria-label="blockDim.y"></label><button onclick="cfg()">Beállít</button><button onclick="labor()">Labor (32 × 1) / bemutató</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Egy 16×4-es blokkban a (3,2,0) szál lineáris indexe 35, ez az 1. warp 3. lane-je."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">lin = tx + ty·Bx (tz = 0), warp = lin / 32, lane = lin % 32 (CUDA Programming Guide). A labor (10.2.6) faulty_add<<<1, 32>>> kernelénél a 0. lane j = −1.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"bx": 32, "by": 1, "sx": 0, "sy": 0, "line": 1, "msg": "Labor (32 × 1): cuda thread (0,0,0) = cuda warp 0 + cuda lane 0; print j → −1"}, {"bx": 32, "by": 1, "sx": 1, "sy": 0, "line": 3, "msg": "Labor (32 × 1): cuda thread (1,0,0) = cuda warp 0 + cuda lane 1; print j → 1"}, {"bx": 32, "by": 1, "sx": 3, "sy": 0, "line": 3, "msg": "Labor (32 × 1): cuda thread (3,0,0) = cuda warp 0 + cuda lane 3; print j → 3"}, {"bx": 16, "by": 4, "sx": 3, "sy": 2, "line": 4, "msg": "16 × 4: cuda thread (3,2,0) → lin = 3 + 2·16 = 35 → cuda warp 1 + cuda lane 3."}, {"bx": 16, "by": 4, "sx": 15, "sy": 1, "line": 4, "msg": "16 × 4: cuda thread (15,1,0) → lin = 15 + 1·16 = 31 → cuda warp 0 + cuda lane 31."}, {"bx": 16, "by": 4, "sx": 0, "sy": 2, "line": 4, "msg": "16 × 4: cuda thread (0,2,0) → lin = 0 + 2·16 = 32 → cuda warp 1 + cuda lane 0."}];
const CODE = ["(cuda-gdb) break faulty_add.cu:20", "(cuda-gdb) print j                  # lane 0: −1", "(cuda-gdb) cuda thread (x,y,0)      # szoftveres fókusz", "(cuda-gdb) cuda lane 3              # hardveres fókusz az aktuális warpban", "(cuda-gdb) cuda warp w   +   cuda lane l   ==   cuda thread (x,y,0)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CLICK = null;
function render(s){
  svg.innerHTML = "";
  document.getElementById("bx").value = s.bx; document.getElementById("by").value = s.by;
  const bx = s.bx, by = s.by, sx = CLICK ? CLICK[0] : s.sx, sy = CLICK ? CLICK[1] : s.sy;
  const c = Math.max(14, Math.min(44, Math.floor(720 / bx), Math.floor(300 / by)));
  const x0 = 30, y0 = 30, H = y0 + by * c + 130;
  svg.setAttribute("viewBox", "0 0 760 " + H);
  const defs = el("defs", {});
  defs.innerHTML = `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${css("--muted")}"/></pattern><pattern id="ps" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1"/></pattern>`;
  for (let ty = 0; ty < by; ty++) for (let tx = 0; tx < bx; tx++) {
    const lin = tx + ty * bx, w = Math.floor(lin / 32), on = tx === sx && ty === sy;
    const r = el("rect", {x: x0 + tx * c, y: y0 + ty * c, width: c, height: c, fill: on ? css("--cellhl") : (w % 2 ? "url(#ps)" : "url(#pd)"), stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 0.6, style: "cursor:pointer"});
    r.addEventListener("click", () => { CLICK = [tx, ty]; render(s); });
    if (c >= 20) el("text", {x: x0 + tx * c + c / 2, y: y0 + ty * c + c / 2 + 4, "text-anchor": "middle", "font-size": c >= 30 ? 12 : 10, style: "pointer-events:none"}, String(lin));
  }
  const lin = sx + sy * bx, w = Math.floor(lin / 32), ln = lin % 32, yt = y0 + by * c + 28;
  el("text", {x: x0, y: yt, "font-size": 14, "font-weight": "bold"}, `cuda thread (${sx},${sy},0)  ⇔  cuda warp ${w}  +  cuda lane ${ln}`);
  el("text", {x: x0, y: yt + 22, "font-size": 13}, `lin = ${sx} + ${sy}·${bx} = ${lin};  warp = ${lin} / 32 = ${w};  lane = ${lin} % 32 = ${ln}`);
  if (bx === 32 && by === 1) el("text", {x: x0, y: yt + 44, "font-size": 13, fill: sx === 0 ? css("--hl2") : css("--fg")}, `labor: print j → ${sx === 0 ? "−1 (érvénytelen index: in[−1])" : sx}`);
  el("text", {x: x0, y: yt + 66, "font-size": 11, fill: css("--muted")}, "pötty = páros, csík = páratlan sorszámú warp; " + Math.ceil(bx * by / 32) + " warp, " + (bx * by) + " szál");
}
function cfg(){
  const bx = +document.getElementById("bx").value, by = +document.getElementById("by").value, e = document.getElementById("err");
  if (bx * by > 1024) { e.textContent = "Bx·By legfeljebb 1024."; return; }
  e.textContent = ""; CLICK = null;
  setSteps([{bx: bx, by: by, sx: 0, sy: 0, line: 2, msg: `Saját blokk: ${bx} × ${by}. Kattints egy szálra!`}]);
}
function labor(){ document.getElementById("bx").value = 32; document.getElementById("by").value = 1; CLICK = null; setSteps(TOUR0); }
const TOUR0 = [{"bx": 32, "by": 1, "sx": 0, "sy": 0, "line": 1, "msg": "Labor (32 × 1): cuda thread (0,0,0) = cuda warp 0 + cuda lane 0; print j → −1"}, {"bx": 32, "by": 1, "sx": 1, "sy": 0, "line": 3, "msg": "Labor (32 × 1): cuda thread (1,0,0) = cuda warp 0 + cuda lane 1; print j → 1"}, {"bx": 32, "by": 1, "sx": 3, "sy": 0, "line": 3, "msg": "Labor (32 × 1): cuda thread (3,0,0) = cuda warp 0 + cuda lane 3; print j → 3"}, {"bx": 16, "by": 4, "sx": 3, "sy": 2, "line": 4, "msg": "16 × 4: cuda thread (3,2,0) → lin = 3 + 2·16 = 35 → cuda warp 1 + cuda lane 3."}, {"bx": 16, "by": 4, "sx": 15, "sy": 1, "line": 4, "msg": "16 × 4: cuda thread (15,1,0) → lin = 15 + 1·16 = 31 → cuda warp 0 + cuda lane 31."}, {"bx": 16, "by": 4, "sx": 0, "sy": 2, "line": 4, "msg": "16 × 4: cuda thread (0,2,0) → lin = 0 + 2·16 = 32 → cuda warp 1 + cuda lane 0."}];

["first", "prev", "next", "play"].forEach(id => document.getElementById(id).addEventListener("click", () => { if (CLICK) { CLICK = null; show(k); } }, true));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
