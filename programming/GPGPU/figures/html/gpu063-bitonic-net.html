<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitonic rendezőhálózat</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Bemenet (8 vagy 16 szám): <input id="inp" value="5, 1, 7, 3, 8, 2, 6, 4" size="34" aria-label="Bemenet"></label><label><input id="up" type="checkbox"> minden blokk növekvő</label><button onclick="load()">Betöltés</button><span id="err" class="small" aria-live="polite"></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc vonal, hat lépés compare-exchange szakaszokkal; az aktuális oszlop kiemelve, az állapot a vonalak elején."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A nyílhegy a nagyobb elem célja (lefelé = növekvő). Kezdőállapot: [5, 1, 7, 3, 8, 2, 6, 4]. A „minden blokk növekvő” mód az önellenőrző kérdéshez: a végeredmény ekkor [1, 5, 3, 7, 2, 6, 4, 8].</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"c": -1, "line": 0, "msg": "Bemenet: [5, 1, 7, 3, 8, 2, 6, 4]; n = 8, 6 lépés, lépésenként 4 CE."}, {"c": 0, "line": 2, "msg": "1. lépés: k = 2, j = 1 – 4 CE, ebből 2 csere → [1, 5, 7, 3, 2, 8, 6, 4]"}, {"c": 1, "line": 2, "msg": "2. lépés: k = 4, j = 2 – 4 CE, ebből 2 csere → [1, 3, 7, 5, 6, 8, 2, 4]"}, {"c": 2, "line": 2, "msg": "3. lépés: k = 4, j = 1 – 4 CE, ebből 3 csere → [1, 3, 5, 7, 8, 6, 4, 2]"}, {"c": 3, "line": 2, "msg": "4. lépés: k = 8, j = 4 – 4 CE, ebből 2 csere → [1, 3, 4, 2, 8, 6, 5, 7]"}, {"c": 4, "line": 2, "msg": "5. lépés: k = 8, j = 2 – 4 CE, ebből 2 csere → [1, 2, 4, 3, 5, 6, 8, 7]"}, {"c": 5, "line": 2, "msg": "6. lépés: k = 8, j = 1 – 4 CE, ebből 2 csere → [1, 2, 3, 4, 5, 6, 7, 8]"}];
const CODE = ["for (int k = 2; k <= n; k <<= 1)          // a rendezett blokkok mérete", "  for (int j = k >> 1; j > 0; j >>= 1) {  // a merge távolsága", "    int ixj = i ^ j;  if (ixj > i) { bool up = (i & k) == 0;", "      if (up ? a[i] > a[ixj] : a[i] < a[ixj]) csere(a[i], a[ixj]); }", "    __syncthreads(); }"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let CUR = {a: [5, 1, 7, 3, 8, 2, 6, 4], up: false, sel: -1};
function bit(a0, allUp){
  const a = a0.slice(), n = a.length, cols = [];
  for (let kk = 2; kk <= n; kk <<= 1) for (let j = kk >> 1; j > 0; j >>= 1) {
    const ces = [];
    for (let i = 0; i < n; i++) { const ixj = i ^ j; if (ixj > i) { const up = allUp || (i & kk) === 0;
      ces.push([i, ixj, up, up ? a[i] > a[ixj] : a[i] < a[ixj]]); } }
    ces.forEach(c => { if (c[3]) { const t = a[c[0]]; a[c[0]] = a[c[1]]; a[c[1]] = t; } });
    cols.push({k: kk, j, ces, state: a.slice()});
  }
  return cols;
}
function trace(a, allUp){
  const cols = bit(a, allUp);
  const st = [{c: -1, line: 0, msg: `Bemenet: [${a.join(", ")}]; n = ${a.length}, ${cols.length} lépés, lépésenként ${a.length/2} CE.`}];
  cols.forEach((col, c) => { const ns = col.ces.filter(x => x[3]).length;
    st.push({c, line: 2, msg: `${c+1}. lépés: k = ${col.k}, j = ${col.j} – ${col.ces.length} CE, ebből ${ns} csere → [${col.state.join(", ")}]`}); });
  const fin = cols[cols.length - 1].state, ok = fin.every((v, i) => i === 0 || fin[i-1] <= v);
  st[st.length - 1].msg += ok ? " – rendezett." : " – NEM rendezett (minden blokk növekvő: az irányváltás hiányzik).";
  return st;
}
function render(s){
  const a = CUR.a, n = a.length, cols = bit(a, CUR.up);
  const H = n === 8 ? 300 : 420; svg.setAttribute("viewBox", `0 0 640 ${H}`);
  svg.innerHTML = "";
  const top = 40, dy = (H - 70) / (n - 1), x0 = 70, dx = (640 - x0 - 50) / cols.length;
  const state = s.c < 0 ? a : cols[s.c].state;
  for (let i = 0; i < n; i++) {
    el("line", {x1: 40, y1: top + i*dy, x2: 620, y2: top + i*dy, stroke: css("--line"), "stroke-width": i === CUR.sel ? 2.5 : 0.8});
    const t = el("text", {x: 30, y: top + i*dy + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted"), cursor: "pointer"}, String(i));
    t.addEventListener("click", () => { CUR.sel = CUR.sel === i ? -1 : i; show(k); });
    el("text", {x: 52, y: top + i*dy - 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, String(state[i]));
  }
  cols.forEach((col, c) => {
    const x = x0 + (c + 0.5) * dx, on = c === s.c, past = c < s.c;
    if (on) el("rect", {x: x - dx/2 + 2, y: 8, width: dx - 4, height: H - 26, fill: css("--cellhl"), opacity: 0.5});
    el("text", {x, y: 20, "text-anchor": "middle", "font-size": 11}, `k=${col.k} j=${col.j}`);
    col.ces.forEach((ce, q) => {
      const off = ((q % col.j) - (col.j - 1) / 2) * Math.min(10, dx / (col.j + 1)), xx = x + off;
      const y1 = top + ce[0]*dy, y2 = top + ce[1]*dy, sw = ce[3] && (on || past);
      el("line", {x1: xx, y1, x2: xx, y2, stroke: on ? css("--hl") : css("--line"), "stroke-width": sw ? 3 : 1.2, opacity: on || past ? 1 : 0.35});
      const ya = ce[2] ? y2 : y1, dir = ce[2] ? -1 : 1;
      el("path", {d: `M${xx-4},${ya + dir*8} L${xx+4},${ya + dir*8} L${xx},${ya} Z`, fill: on ? css("--hl") : css("--line"), opacity: on || past ? 1 : 0.35});
    });
  });
  if (CUR.sel >= 0 && s.c >= 0) {
    const col = cols[s.c], i = CUR.sel, ixj = i ^ col.j;
    el("text", {x: 10, y: H - 4, "font-size": 12},
       `i = ${i}, ixj = i ^ j = ${i} ^ ${col.j} = ${ixj}, (i & k) = ${i & col.k} → ${CUR.up || (i & col.k) === 0 ? "növekvő" : "csökkenő"}; ` +
       (ixj > i ? "ez a szál végzi a CE-t" : "a párja (ixj < i) végzi a CE-t"));
  } else el("text", {x: 10, y: H - 4, "font-size": 11, fill: css("--muted")}, "Kattintson egy vonal indexére (bal oldalt): i, ixj, (i & k) és az irány.");
}
function load(){
  const v = document.getElementById("inp").value.split(/[ ,;]+/).filter(x => x !== "").map(Number);
  const m = document.getElementById("err");
  if (!(v.length === 8 || v.length === 16) || v.some(x => !Number.isFinite(x))) { m.textContent = "8 vagy 16 számot adjon meg."; return; }
  m.textContent = ""; CUR.a = v; CUR.up = document.getElementById("up").checked; CUR.sel = -1; setSteps(trace(v, CUR.up));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
