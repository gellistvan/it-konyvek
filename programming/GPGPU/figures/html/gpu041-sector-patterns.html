<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szektorlefedés négy hozzáférési mintára</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 8px}
#status{margin:4px 0 6px;min-height:2.9em;font-weight:600}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label>Minta: <select id="pat" aria-label="Hozzáférési minta">
    <option value="co">coalesced: input[idx]</option>
    <option value="st">strided: input[idx·stride]</option>
    <option value="of">misaligned: input[idx + offset]</option>
    <option value="ra">véletlen: input[perm[idx]]</option>
  </select></label>
  <label>stride: <input id="stride" type="range" min="1" max="32" value="4" aria-label="stride"> <span id="strv">4</span></label>
  <label>offset (elem): <input id="off" type="range" min="0" max="7" value="1" aria-label="offset elemben"> <span id="offv">1</span></label>
  <button id="newp">új permutáció</button> <button id="resetp">alap seed</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 330" role="img" aria-label="Egy warp 32 szálának bájtcímei és a lekért 32 bájtos szektorok; a hasznos bájt fekete, a lekért, de fel nem használt bájt sraffozott."></svg>
<p class="small">A fejezet kerneljeinek indexképletei; 4 B-os float, 32 szálas warp, 32 B szektor (CC 7.0 vagy újabb). Modellérték, nem mérés. Kattints egy szálra (felső sor) vagy egy szektorra: a szál és a szektora kiemelődik. A véletlen minta 32 indexe N = 2^26 elemből, rögzített seedű generátorral.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v"), st = document.getElementById("status");
const RAND0 = [22334757, 63678328, 13702073, 8766152, 38084491, 41169576, 40151809, 17872027, 61398738, 46923504, 52925180, 49152778, 56332843, 59490660, 44777543, 15377013, 45382666, 4859140, 29651357, 14303781, 6435601, 66334165, 15256255, 45147884, 53510269, 47389339, 63203309, 21257283, 26246909, 43129748, 16659485, 12531516];
let rand = RAND0.slice(), seed = 1, sel = -1;
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function lcg(){ seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }
function newPerm(){ const s = new Set(); while (s.size < 32) s.add(Math.floor(lcg() * 67108864)); rand = Array.from(s); sel = -1; draw(); }
function indices(){
  const p = document.getElementById("pat").value, S = +document.getElementById("stride").value, O = +document.getElementById("off").value;
  const r = [];
  for (let t = 0; t < 32; t++) r.push(p === "co" ? t : p === "st" ? t * S : p === "of" ? t + O : rand[t]);
  return r;
}
function comma(x, d){ return x.toFixed(d).replace(".", ","); }
function draw(){
  document.getElementById("strv").textContent = document.getElementById("stride").value;
  document.getElementById("offv").textContent = document.getElementById("off").value;
  const p = document.getElementById("pat").value, idx = indices(), ad = idx.map(i => 4 * i);
  const secs = Array.from(new Set(ad.map(a => Math.floor(a / 32)))).sort((a, b) => a - b);
  const useful = 128, fetched = 32 * secs.length, eff = 100 * useful / fetched;
  svg.innerHTML = ""; svg.setAttribute("viewBox", p === "ra" ? "0 0 760 300" : "0 0 760 215");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hz" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="${css("--cell")}"/><line x1="0" y1="0" x2="0" y2="5" stroke="${css("--fg")}" stroke-width="1"/></pattern>`;
  svg.appendChild(defs);
  // szálak
  el("text", {x: 4, y: 16, "font-size": 12}, "a warp 32 szála (kattintható):");
  for (let t = 0; t < 32; t++) {
    const r = el("rect", {x: 10 + t * 23, y: 24, width: 21, height: 22, fill: t === sel ? css("--hl2") : css("--cellhl"), stroke: css("--line"), "stroke-width": 0.6, style: "cursor:pointer"});
    r.addEventListener("click", () => { sel = sel === t ? -1 : t; draw(); });
    el("text", {x: 20.5 + t * 23, y: 39, "text-anchor": "middle", "font-size": 9, style: "pointer-events:none"}, "t" + t);
  }
  // szektorok
  const contiguous = p !== "ra" && secs[secs.length - 1] - secs[0] < 48;
  const y = 120, h = 46;
  let X;
  if (contiguous) {
    const s0 = 0, s1 = Math.max(secs[secs.length - 1] + 1, 16), w = Math.min(46, 740 / (s1 - s0));
    X = s => 10 + (s - s0) * w;
    for (let s = s0; s <= s1; s++) el("line", {x1: X(s), y1: y - 8, x2: X(s), y2: y + h + 8, stroke: css("--fg"), "stroke-width": s % 4 === 0 ? 2.4 : 0.5});
    for (let s = s0; s < s1; s += (s1 > 32 ? 4 : 1)) el("text", {x: X(s) + 2, y: y + h + 22, "font-size": 9, fill: css("--muted")}, String(32 * s));
    el("text", {x: 10, y: y + h + 38, "font-size": 11}, "bájtcím; vékony vonal: 32 B szektor, vastag: 128 B vonalhatár");
    var W = w;
  } else {
    const w = 740 / 32;
    X = s => 10 + secs.indexOf(s) * w;
    var W = w - 4;
    el("text", {x: 10, y: y + h + 22, "font-size": 11}, "32 különálló szektor a tömb különböző pontjain (a tengely megszakítva)");
  }
  secs.forEach(s => {
    const on = sel >= 0 && Math.floor(ad[sel] / 32) === s;
    const r = el("rect", {x: X(s), y: y, width: W, height: h, fill: "url(#hz)", stroke: on ? css("--hl2") : css("--fg"), "stroke-width": on ? 3 : 0.8, style: "cursor:pointer"});
    r.addEventListener("click", () => { const t = ad.findIndex(a => Math.floor(a / 32) === s); sel = t; draw(); });
    ad.forEach((a, t) => { if (Math.floor(a / 32) === s) el("rect", {x: X(s) + (a - 32 * s) / 32 * W, y: y, width: W / 8, height: h, fill: t === sel ? css("--hl2") : css("--fg"), style: "pointer-events:none"}); });
  });
  if (sel >= 0) {
    const s = Math.floor(ad[sel] / 32);
    el("line", {x1: 20.5 + sel * 23, y1: 47, x2: X(s) + (ad[sel] - 32 * s) / 32 * W + W / 16, y2: y - 2, stroke: css("--hl2"), "stroke-width": 1.8});
  }
  // perm sáv
  if (p === "ra") {
    el("text", {x: 10, y: 228, "font-size": 12}, "+ a perm[idx] olvasása (int, coalesced): 4 szektor, 128/128 B");
    for (let s = 0; s < 4; s++) el("rect", {x: 10 + s * 46, y: 236, width: 46, height: 26, fill: css("--fg"), stroke: css("--line")});
    el("text", {x: 10, y: 290, "font-size": 12, "font-weight": "bold"}, "kernel összesen: (128 + 128)/(128 + " + fetched + ") ≈ " + comma(100 * 256 / (128 + fetched), 1) + "%");
  }
  const name = {co: "coalesced", st: "stride = " + document.getElementById("stride").value, of: "offset = " + document.getElementById("off").value, ra: "véletlen permutáció"}[p];
  st.textContent = `${name}: lekért szektor ${secs.length} / hasznos bájt ${useful} / hatékonyság ${comma(eff, eff % 1 ? 1 : 0)}%` + (sel >= 0 ? ` – t${sel}: index ${idx[sel]}, bájt ${ad[sel]}–${ad[sel] + 3}, szektor ${Math.floor(ad[sel] / 32)}` : "");
}
["pat", "stride", "off"].forEach(id => document.getElementById(id).addEventListener("input", () => { sel = -1; draw(); }));
document.getElementById("stride").addEventListener("input", () => { document.getElementById("pat").value = "st"; draw(); });
document.getElementById("off").addEventListener("input", () => { document.getElementById("pat").value = "of"; draw(); });
document.getElementById("newp").onclick = () => { document.getElementById("pat").value = "ra"; newPerm(); };
document.getElementById("resetp").onclick = () => { seed = 1; rand = RAND0.slice(); document.getElementById("pat").value = "ra"; sel = -1; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
