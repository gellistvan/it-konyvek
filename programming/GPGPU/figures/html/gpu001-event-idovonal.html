<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Időmérés CUDA-eseménypárral</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="sync" checked> szinkronizálás be (eseménypár + cudaEventSynchronize); kikapcsolva: hibás host-óra minta</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két idővonal: a host-szál hívásai és a GPU default streamje; a helyes mintában a mért idő a GPU-n futó kernelt fedi, a hibás mintában csak az indítási hívást."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus, nem arányos idők; egyetlen stream (default stream). A kód a teljes példa 4. blokkja (1.2 labor); a hibás minta szándékosan rossz, csak szemléltetés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. cudaEventRecord(start): a host csak sorba teszi a start eseményt a default streambe, nem vár. GPU: start rögzítve.", "line": 1, "t": 1.0, "gpu": "start rögzítve", "mode": "ok"}, {"msg": "2. Kernelindítás <<<4096, 256>>> (és cudaGetLastError): a hívás azonnal visszatér; a kernel a GPU-n a start után kezd futni.", "line": 2, "t": 2.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "3. cudaEventRecord(stop): ez is csak sorba áll a kernel mögé; a host továbbmegy, a kernel még fut.", "line": 4, "t": 3.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "4. cudaEventSynchronize(stop): a host itt VÁR, amíg a GPU el nem jut a stop eseményig.", "line": 5, "t": 6.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "5. A kernel befejeződött, a GPU rögzíti a stop időbélyeget; a szinkronizálás visszatér.", "line": 5, "t": 9.0, "gpu": "stop rögzítve", "mode": "ok"}, {"msg": "6. cudaEventElapsedTime(start, stop): a mért idő a két GPU-időbélyeg különbsége, a teljes kernelt fedi. HELYES.", "line": 7, "t": 10.0, "gpu": "stop rögzítve", "done": true, "mode": "ok"}];
const CODE = ["for (int i = 0; i < measureIters; ++i) {", "    CHECK_CUDA(cudaEventRecord(start, 0));", "    vectorAdd<<<gridSize, blockSize, 0, 0>>>(d_a, d_b, d_c, N);   // <<<4096, 256>>>", "    CHECK_CUDA(cudaGetLastError());", "    CHECK_CUDA(cudaEventRecord(stop, 0));", "    CHECK_CUDA(cudaEventSynchronize(stop));", "    float ms = 0.0f;", "    CHECK_CUDA(cudaEventElapsedTime(&ms, start, stop));", "    times.push_back(ms);", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SEG = {"ok": {"host": [[["Record", "(start)"], 0.0, 1.4, "run"], [["indítás"], 1.4, 2.6, "run"], [["Record", "(stop)"], 2.6, 4.0, "run"], [["Synchronize(stop):", "a host vár"], 4.0, 9.4, "wait"], [["Elapsed", "Time"], 9.4, 10.8, "run"]], "kernel": [3.0, 9.0], "start": 1.6, "stop": 9.2}, "bad": {"host": [[["chrono", "start"], 0.0, 1.4, "run"], [["indítás"], 1.4, 2.6, "run"], [["chrono", "stop"], 2.6, 4.0, "run"], [["kiírás"], 4.0, 5.4, "run"]], "kernel": [3.0, 9.0], "t0": 0.7, "t1": 3.3}}, STEPS_OK = [{"msg": "1. cudaEventRecord(start): a host csak sorba teszi a start eseményt a default streambe, nem vár. GPU: start rögzítve.", "line": 1, "t": 1.0, "gpu": "start rögzítve", "mode": "ok"}, {"msg": "2. Kernelindítás <<<4096, 256>>> (és cudaGetLastError): a hívás azonnal visszatér; a kernel a GPU-n a start után kezd futni.", "line": 2, "t": 2.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "3. cudaEventRecord(stop): ez is csak sorba áll a kernel mögé; a host továbbmegy, a kernel még fut.", "line": 4, "t": 3.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "4. cudaEventSynchronize(stop): a host itt VÁR, amíg a GPU el nem jut a stop eseményig.", "line": 5, "t": 6.0, "gpu": "kernel fut", "mode": "ok"}, {"msg": "5. A kernel befejeződött, a GPU rögzíti a stop időbélyeget; a szinkronizálás visszatér.", "line": 5, "t": 9.0, "gpu": "stop rögzítve", "mode": "ok"}, {"msg": "6. cudaEventElapsedTime(start, stop): a mért idő a két GPU-időbélyeg különbsége, a teljes kernelt fedi. HELYES.", "line": 7, "t": 10.0, "gpu": "stop rögzítve", "done": true, "mode": "ok"}], STEPS_BAD = [{"msg": "1. std::chrono start: a host-óra elindul. GPU: üres.", "line": 1, "t": 1.0, "gpu": "üres", "mode": "bad"}, {"msg": "2. Kernelindítás <<<4096, 256>>>: a hívás azonnal visszatér, a kernel csak most kezd futni a GPU-n.", "line": 2, "t": 2.0, "gpu": "kernel fut", "mode": "bad"}, {"msg": "3. std::chrono stop szinkronizálás nélkül: a host-óra megáll, pedig a kernel még fut.", "line": 4, "t": 3.0, "gpu": "kernel fut", "mode": "bad"}, {"msg": "4. A host kiírja a mért időt: ez csak az indítási hívás ideje. A GPU-n a kernel továbbra is fut.", "line": 5, "t": 4.0, "gpu": "kernel fut", "mode": "bad"}, {"msg": "5. A kernel jóval a mérés lezárása után fejeződik be. HIBÁS: a kernel futásideje kimaradt a mérésből.", "line": 5, "t": 9.0, "gpu": "kernel kész (mérésen kívül)", "done": true, "mode": "bad"}], CODE_OK = ["for (int i = 0; i < measureIters; ++i) {", "    CHECK_CUDA(cudaEventRecord(start, 0));", "    vectorAdd<<<gridSize, blockSize, 0, 0>>>(d_a, d_b, d_c, N);   // <<<4096, 256>>>", "    CHECK_CUDA(cudaGetLastError());", "    CHECK_CUDA(cudaEventRecord(stop, 0));", "    CHECK_CUDA(cudaEventSynchronize(stop));", "    float ms = 0.0f;", "    CHECK_CUDA(cudaEventElapsedTime(&ms, start, stop));", "    times.push_back(ms);", "}"], CODE_BAD = ["// HIBÁS minta: host-óra, szinkronizálás nélkül", "auto t0 = std::chrono::steady_clock::now();", "vectorAdd<<<gridSize, blockSize, 0, 0>>>(d_a, d_b, d_c, N);   // <<<4096, 256>>>", "CHECK_CUDA(cudaGetLastError());", "auto t1 = std::chrono::steady_clock::now();   // a kernel még fut!", "double ms = std::chrono::duration<double, std::milli>(t1 - t0).count();"];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 250");
  svg.innerHTML = "";
  const D = SEG[s.mode], X = t => 104 + t * 49, yh = 40, yg = 130, H = 46;
  const defs = el("defs", {}), p = document.createElementNS(NS, "pattern");
  p.setAttribute("id", "hw"); p.setAttribute("width", 7); p.setAttribute("height", 7); p.setAttribute("patternUnits", "userSpaceOnUse"); p.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 7); pl.setAttribute("stroke", css("--line")); pl.setAttribute("stroke-width", 1.5);
  p.appendChild(pl); defs.appendChild(p);
  el("text", {x: 6, y: yh + 20, "font-size": 13, "font-weight": "bold"}, "Host");
  el("text", {x: 6, y: yh + 36, "font-size": 11}, "(CPU)");
  el("text", {x: 6, y: yg + 20, "font-size": 13, "font-weight": "bold"}, "GPU");
  el("text", {x: 6, y: yg + 36, "font-size": 11}, "default stream");
  el("line", {x1: X(0), y1: 215, x2: X(10.8), y2: 215, stroke: css("--muted")});
  el("line", {x1: X(s.t), y1: 22, x2: X(s.t), y2: 218, stroke: css("--hl"), "stroke-width": 2, "stroke-dasharray": "4 3"});
  el("text", {x: X(s.t), y: 16, "text-anchor": "middle", "font-size": 11, fill: css("--hl")}, "most");
  D.host.forEach(h => { if (h[1] >= s.t) return; const b = Math.min(h[2], s.t), w = X(b) - X(h[1]) - 2;
    el("rect", {x: X(h[1]) + 1, y: yh, width: w, height: H, fill: h[3] === "wait" ? "url(#hw)" : css("--cellhl"), stroke: css("--line")});
    const L = h[3] === "wait" ? (w > 150 ? ["cudaEventSynchronize(stop):", "a host vár"] : ["vár"]) : h[0];
    if (h[3] === "wait") { const bw = Math.min(w - 8, 190); el("rect", {x: X(h[1]) + 1 + w / 2 - bw / 2, y: yh + 6, width: bw, height: H - 12, fill: css("--bg")}); }
    L.forEach((l, i) => el("text", {x: X(h[1]) + 1 + w / 2, y: yh + H / 2 + 4 + (i - (L.length - 1) / 2) * 13, "text-anchor": "middle", "font-size": 11}, l)); });
  const k0 = D.kernel[0], k1 = Math.min(D.kernel[1], s.t);
  if (s.t > k0) { el("rect", {x: X(k0), y: yg, width: X(k1) - X(k0), height: H, fill: css("--fg"), stroke: css("--line")});
    if (X(k1) - X(k0) > 60) el("text", {x: (X(k0) + X(k1)) / 2, y: yg + H / 2 + 5, "text-anchor": "middle", "font-size": 12, fill: css("--bg")}, "vectorAdd<<<4096, 256>>>"); }
  if (s.mode === "ok") {
    [["start", D.start], ["stop", D.stop]].forEach(m => { if (s.t >= m[1]) { el("line", {x1: X(m[1]), y1: yg - 8, x2: X(m[1]), y2: yg + H + 6, stroke: css("--line"), "stroke-width": 3}); el("text", {x: X(m[1]), y: yg - 12, "text-anchor": "middle", "font-size": 12}, m[0]); } });
    if (s.done) { el("line", {x1: X(D.start), y1: 200, x2: X(D.stop), y2: 200, stroke: css("--line"), "stroke-width": 2}); el("text", {x: (X(D.start) + X(D.stop)) / 2, y: 196, "text-anchor": "middle", "font-size": 12}, "mért idő = stop − start: a teljes kernelt fedi"); }
  } else {
    if (s.t >= D.t1) { el("rect", {x: X(D.t0), y: yh - 6, width: X(D.t1) - X(D.t0), height: H + 12, fill: "none", stroke: css("--line"), "stroke-width": 3, "stroke-dasharray": "7 4"});
      el("line", {x1: X(D.t0), y1: 200, x2: X(D.t1), y2: 200, stroke: css("--line"), "stroke-width": 2, "stroke-dasharray": "6 3"}); el("text", {x: X(D.t0), y: 196, "font-size": 12}, "host-mért idő"); }
    if (s.t > D.t1 && s.t > k0) el("text", {x: X(Math.min(s.t, D.kernel[1])) - 4, y: yg + H + 20, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, "HIBÁS: a kernel a mérés után is fut");
  }
  el("text", {x: 630, y: 240, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "GPU-sáv: " + s.gpu);
}
function loadCode(lines){ codeEl.innerHTML = lines.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join(""); }
document.getElementById("sync").addEventListener("change", e => { const on = e.target.checked; loadCode(on ? CODE_OK : CODE_BAD); setSteps(on ? STEPS_OK : STEPS_BAD); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
