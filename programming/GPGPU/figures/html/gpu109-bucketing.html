<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bucketing és recompiláció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hosszak: <input id="ln" size="34" value="100, 130, 200, 260, 300, 120, 500, 140, 210, 480" aria-label="bemenethosszak"></label><label>bucketek: <input id="bk" size="12" value="128, 256, 512" aria-label="bucket-határok"></label><button onclick="runIn()">Újraszámolás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A bemenetek sávjai bucket nélkül és bucketekkel, fordítás- és cache-jelölővel, a padding vonalkázva"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">× = új shape, fordítás; ✓ = cache-találat. A naplósor formája verziófüggő (JAX_LOG_COMPILES=1). Szemléltető hosszak; a fordítás ideje ms–s nagyságrendű.</p>

, {"n": 300, "p": 300, "c": true}, {"n": 120, "p": 120, "c": true}, {"n": 500, "p": 500, "c": true}, {"n": 140, "p": 140, "c": true}, {"n": 210, "p": 210, "c": true}, {"n": 480, "p": 480, "c": true}], "B": [{"n": 100, "p": 128, "c": true, "over": false}, {"n": 130, "p": 256, "c": true, "over": false}, {"n": 200, "p": 256, "c": false, "over": false}, {"n": 260, "p": 512, "c": true, "over": false}, {"n": 300, "p": 512, "c": false, "over": false}, {"n": 120, "p": 128, "c": false, "over": false}, {"n": 500, "p": 512, "c": false, "over": false}, {"n": 140, "p": 256, "c": false, "over": false}, {"n": 210, "p": 256, "c": false, "over": false}, {"n": 480, "p": 512, "c": false, "over": false}]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function sim(lens,bk){const cache=new Set(),A=[],B=[],cA=new Set();
  lens.forEach(n=>{const ca=!cA.has(n);cA.add(n);A.push({n,p:n,c:ca});
    const big=bk.filter(b=>b>=n);const p=big.length?Math.min(...big):n;const cb=!cache.has(p);cache.add(p);B.push({n,p,c:cb,over:!big.length});});
  return {A,B};}
function mk(lens,bk){const R=sim(lens,bk),st=[];
  for(let i=0;i<lens.length;i++){const a=R.A[i],b=R.B[i];
    const real=lens.slice(0,i+1).reduce((s,v)=>s+v,0),proc=R.B.slice(0,i+1).reduce((s,v)=>s+v.p,0);
    const ca=R.A.slice(0,i+1).filter(t=>t.c).length,cb=R.B.slice(0,i+1).filter(t=>t.c).length;
    let msg=`${i+1}. bemenet, hossz ${a.n}: bucket nélkül ${a.c?"fordít":"cache-találat"}; bucketekkel → ${b.p} ${b.c?"fordít":"cache-találat"}`+(b.over?" (nagyobb minden bucketnél: saját shape!)":"")+`. Fordítások eddig: ${ca} vs ${cb}; kihasználtság ${real}/${proc} = ${(100*real/proc).toFixed(1).replace(".",",")}%.`;
    st.push({msg,i,lens,bk,A:R.A,B:R.B});}
  return st;}
function render(s){
  svg.setAttribute("viewBox","0 0 640 330");svg.innerHTML="";const L=css("--line");
  const d=el("defs",{});const p=document.createElementNS(NS,"pattern");p.setAttribute("id","hp");p.setAttribute("width",6);p.setAttribute("height",6);p.setAttribute("patternUnits","userSpaceOnUse");p.setAttribute("patternTransform","rotate(45)");
  p.innerHTML=`<line x1="0" y1="0" x2="0" y2="6" stroke="${L}" stroke-width="1.3"/>`;d.appendChild(p);
  const n=s.lens.length, w=Math.min(56,440/n), mx=Math.max(...s.B.map(t=>t.p),...s.lens), sc=100/mx;
  [["A",s.A,"(A) bucket nélkül",150],["B",s.B,"(B) bucketek: "+s.bk.join(", "),300]].forEach(([k,R,t,yb])=>{
    el("text",{x:4,y:yb-112,"font-weight":"bold","font-size":13},t);
    R.forEach((r,i)=>{if(i>s.i)return;const x=10+i*w,on=i===s.i;
      el("rect",{x,y:yb-r.n*sc,width:w-8,height:r.n*sc,fill:css("--cellhl"),stroke:on?css("--hl2"):L,"stroke-width":on?2.5:1});
      if(r.p>r.n) el("rect",{x,y:yb-r.p*sc,width:w-8,height:(r.p-r.n)*sc,fill:"url(#hp)",stroke:L});
      el("text",{x:x+(w-8)/2,y:yb-r.p*sc-4,"text-anchor":"middle","font-size":13,"font-weight":"bold"},r.c?"×":"✓");
      el("text",{x:x+(w-8)/2,y:yb+13,"text-anchor":"middle","font-size":10},String(r.n));});
  });
  // cache-tábla
  const keys=[...new Set(s.B.slice(0,s.i+1).map(t=>t.p))];
  el("text",{x:470,y:30,"font-weight":"bold","font-size":12},"cache (bucketekkel)");
  keys.forEach((kk,j)=>el("text",{x:470,y:50+j*18,"font-size":12,"font-family":"monospace"},`float32[${kk}] → lefordítva`));
  const b=s.B[s.i];
  if(b.c) el("text",{x:4,y:325,"font-size":11,"font-family":"monospace",fill:css("--muted")},`JAX_LOG_COMPILES: Compiling f with global shapes and types [ShapedArray(float32[${b.p}])]`);
}
function runIn(){
  const lens=document.getElementById("ln").value.split(/[\s,;]+/).filter(t=>t).map(Number),bk=document.getElementById("bk").value.split(/[\s,;]+/).filter(t=>t).map(Number).sort((a,b)=>a-b);
  if(!lens.length||lens.length>16||!lens.every(v=>Number.isInteger(v)&&v>0)||!bk.every(v=>Number.isInteger(v)&&v>0)){status.textContent="Hibás bemenet: 1–16 pozitív egész hossz és pozitív egész bucket-határok.";return;}
  setSteps(mk(lens,bk));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
