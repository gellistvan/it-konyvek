<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fúzió és memóriaforgalom</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--hbm:#e8e8e8;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--hbm:#3a3a3a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input[type=number]{width:6em;font:inherit}button{font:inherit;padding:3px 10px;cursor:pointer}
svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
#status{min-height:2.9em;margin:4px 0}.small{font-size:12px;color:var(--muted)}
pre{margin:6px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;overflow-x:auto}
pre span{display:block;padding:0 4px}pre span.on{outline:2px solid var(--hl);font-weight:bold}
g.reg{cursor:pointer}
</style></head><body>
<div class="ctl"><label><input type="checkbox" id="fus"> fúzió bekapcsolva</label>
<label>N = <input type="number" id="N" value="1024" min="1" max="1000000"></label>
<label>M = <input type="number" id="M" value="128" min="1" max="1000000"></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 330" role="img" aria-label="Bal oldalt a sin(x)*x+1 kernelei és HBM-átvitelei, jobb oldalt a labor f(x) függvényének fúziós régiói"></svg>
<pre id="hlo" aria-label="Sematikus HLO a fúzió után"></pre>
<p class="small">A (C) rész régióira kattintva (vagy Tab + Enter) a megfelelő HLO-sorok kiemelődnek. Sematikus; a valós
felosztás verzió- és hardverfüggő, a dumpból (<code>after_optimizations</code>) ellenőrizendő.</p>
<script>
const KU=[["sin", ["x"], ["y"]], ["multiply", ["y", "x"], ["z"]], ["add (+1)", ["z"], ["out"]]], KF=[["fusion: sin·x+1", ["x"], ["out"]]], HLO=["%fusion.row_sum (x: f32[1024,128]) -> f32[1024] {", "  %y = f32[1024,128] sine(%x)", "  %z = f32[1024,128] multiply(%y, %x)", "  ROOT %w = f32[1024] reduce(%z, %zero), dimensions={1}, to_apply=%add", "}", "%fusion.global_max (x: f32[1024,128]) -> f32[] {", "  ROOT %m = f32[] reduce(%x, %ninf), dimensions={0,1}, to_apply=%max", "}", "ROOT %fusion.out = f32[1024] fusion(%fusion.row_sum, %fusion.global_max), kind=kLoop   // broadcast + add"], REG={"row_sum": [0, 1, 2, 3, 4], "global_max": [5, 6, 7], "out": [8]};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const hlo=document.getElementById("hlo");
hlo.innerHTML=HLO.map((l,i)=>`<span id="H${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
let region=null;
function transfers(K){const t=[];K.forEach((k,i)=>{k[1].forEach(x=>t.push({d:"r",t:x,k:i}));k[2].forEach(x=>t.push({d:"w",t:x,k:i}));});return t;}
function fmtB(b){const u=["B","KiB","MiB","GiB","TiB"];let i=0;while(b>=1024&&i<4){b/=1024;i++;}return (Math.round(b*100)/100).toString().replace(".",",")+" "+u[i];}
function draw(){
  svg.innerHTML="";const L=cs("--line"),fus=document.getElementById("fus").checked;
  const d=el("defs",{});const m=document.createElementNS(NS,"marker");m.setAttribute("id","ar");m.setAttribute("markerWidth",8);m.setAttribute("markerHeight",8);m.setAttribute("refX",6);m.setAttribute("refY",3);m.setAttribute("orient","auto");
  const p=document.createElementNS(NS,"path");p.setAttribute("d","M0,0 L6,3 L0,6 z");p.setAttribute("fill",L);m.appendChild(p);d.appendChild(m);
  const K=fus?KF:KU, T=transfers(K);
  el("text",{x:200,y:20,"text-anchor":"middle","font-weight":"bold"},fus?"(B) fúzióval":"(A) fúzió nélkül");
  el("rect",{x:10,y:35,width:380,height:50,fill:cs("--hbm"),stroke:L});el("text",{x:16,y:50,"font-size":11},"HBM");
  const tens=fus?["x","out"]:["x","y","z","out"], tx={}; tens.forEach((t,i)=>{tx[t]=60+i*(300/(tens.length-1||1));el("rect",{x:tx[t]-22,y:52,width:44,height:26,fill:cs("--cell"),stroke:L});el("text",{x:tx[t],y:70,"text-anchor":"middle","font-family":"monospace"},t);});
  const kw=fus?300:100, kx=K.map((_,i)=>fus?50:20+i*130);
  K.forEach((k,i)=>{el("rect",{x:kx[i],y:200,width:kw,height:50,rx:8,fill:cs("--cell"),stroke:L,"stroke-width":1.5});el("text",{x:kx[i]+kw/2,y:230,"text-anchor":"middle"},k[0]);});
  if(fus){["y","z"].forEach((r,i)=>{el("rect",{x:150+i*70,y:256,width:40,height:22,fill:"none",stroke:L,"stroke-dasharray":"2 3"});el("text",{x:170+i*70,y:272,"text-anchor":"middle","font-family":"monospace"},r);});el("text",{x:330,y:272,"font-size":12},"regiszterben");}
  const cnt={};
  T.forEach((t,n)=>{const j=cnt[t.k]=(cnt[t.k]||0)+1, xk=kx[t.k]+kw/2+(j-2)*22, xt=tx[t.t]+(t.d==="r"?8:-8);
    const a=t.d==="r"?[xt,78,xk,200]:[xk,200,xt,78];
    el("line",{x1:a[0],y1:a[1],x2:a[2],y2:a[3],stroke:L,"stroke-width":2.2,"marker-end":"url(#ar)"});
    const mx=(xk+xt)/2,my=140+(n%2?14:-10);el("circle",{cx:mx,cy:my,r:9,fill:cs("--bg"),stroke:L});el("text",{x:mx,y:my+4,"text-anchor":"middle","font-size":11},String(n+1));});
  const N=Math.max(1,+document.getElementById("N").value||1), M=Math.max(1,+document.getElementById("M").value||1), unit=N*M*4;
  el("text",{x:200,y:310,"text-anchor":"middle"},`${T.length} átvitel × ${N}·${M}·4 B = ${fmtB(T.length*unit)}`);
  // (C) régiók
  el("line",{x1:405,y1:10,x2:405,y2:320,stroke:cs("--muted"),"stroke-width":0.6});
  el("text",{x:585,y:20,"text-anchor":"middle","font-weight":"bold"},"(C) a labor f(x)-e");
  el("text",{x:585,y:40,"text-anchor":"middle","font-family":"monospace","font-size":12},"x: f32[1024,128]");
  const regs=[["row_sum",420,55,180,140,["sine","multiply","reduce dim 1"],"→ f32[1024]"],["global_max",615,55,135,100,["reduce dims {0,1}"],"→ f32[]"],["out",480,240,210,50,["broadcast + add"],"out: f32[1024]"]];
  regs.forEach(([id,x,y,w,h,ops,shape])=>{const on=region===id;const g=el("g",{class:"reg",tabindex:0,role:"button","aria-label":"fúziós régió "+id});
    el("rect",{x,y,width:w,height:h,fill:on?cs("--hbm"):"none",stroke:L,"stroke-width":on?3:1.5,"stroke-dasharray":"7 4"},undefined,g);
    el("text",{x:x+w/2,y:y+16,"text-anchor":"middle","font-family":"monospace","font-size":12},id==="out"?"fusion.out":"fusion."+id,g);
    ops.forEach((o,i)=>{el("rect",{x:x+12,y:y+26+i*34,width:w-24,height:26,rx:5,fill:cs("--cell"),stroke:L},undefined,g);el("text",{x:x+w/2,y:y+44+i*34,"text-anchor":"middle","font-size":12},o,g);});
    el("text",{x:x+w/2,y:y+h+14,"text-anchor":"middle","font-family":"monospace","font-size":11},id==="out"?"":shape,g);
    if(id==="out") el("text",{x:x+w/2,y:y+h+16,"text-anchor":"middle","font-family":"monospace","font-size":11},shape);
    const act=()=>{region=region===id?null:id;draw();};g.addEventListener("click",act);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act();}});});
  el("line",{x1:510,y1:210,x2:550,y2:240,stroke:L,"stroke-width":1.5,"marker-end":"url(#ar)"});
  el("line",{x1:680,y1:170,x2:640,y2:240,stroke:L,"stroke-width":1.5,"marker-end":"url(#ar)"});
  hlo.querySelectorAll("span").forEach(s=>s.classList.remove("on"));
  if(region) REG[region].forEach(i=>document.getElementById("H"+i).classList.add("on"));
  document.getElementById("status").textContent=(fus?"Fúzióval: ":"Fúzió nélkül: ")+`${T.length} HBM-átvitel (${T.filter(t=>t.d==="r").length} olvasás, ${T.filter(t=>t.d==="w").length} írás) = ${fmtB(T.length*unit)}`+
    (fus?`; a fúzió nélküli ${KU.length? transfers(KU).length:0} átvitelhez képest ${(transfers(KU).length/T.length).toString().replace(".",",")}-szer kevesebb.`:"; y és z a HBM-be íródik, majd onnan visszaolvasódik.")+(region?` Kiemelve: fusion.${region}.`:"");
}
["fus","N","M"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
