<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gyűrű all-reduce lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>P: <input type="range" min="2" max="8" value="4" aria-label="Rankok száma" oninput="PP=+this.value;document.getElementById('pv').textContent=PP;reload()"> <span id="pv">4</span></label><label>S: <select aria-label="Üzenetméret" onchange="SS=+this.value;render(STEPS[k])"><option value="0.25">256 KiB</option><option value="1" selected>1 MiB</option><option value="64">64 MiB</option></select></label><label><input type="checkbox" onchange="TREE=this.checked;reload()"> fa all-reduce</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy rank körben, mindegyiknél négy chunk részösszeggel és a hozzájáruló rankokkal; lépésenként kiemelődik a küldött chunk, három reduce-scatter lépés után minden rank egy teljes chunkot birtokol, hat lépés után mindegyik cella 10."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Ideális, egyenletes linkek; L a lépésenkénti latencia, B a link sávszélessége (26.2.3). A fa változat egyszerű binomiális fa a teljes üzenettel (az NCCL kettős fát és pipeline-t használ).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": [[[1, [0]], [1, [0]], [1, [0]], [1, [0]]], [[2, [1]], [2, [1]], [2, [1]], [2, [1]]], [[3, [2]], [3, [2]], [3, [2]], [3, [2]]], [[4, [3]], [4, [3]], [4, [3]], [4, [3]]]], "send": {}, "t": -1, "line": -1, "sent": 0, "msg": "Kezdet: P = 4, a rank r minden eleme r + 1; 4 chunk rankonként, S/P méretű."}, {"st": [[[1, [0]], [1, [0]], [1, [0]], [5, [0, 3]]], [[3, [0, 1]], [2, [1]], [2, [1]], [2, [1]]], [[3, [2]], [5, [1, 2]], [3, [2]], [3, [2]]], [[4, [3]], [4, [3]], [7, [2, 3]], [4, [3]]]], "send": {"0": 0, "1": 1, "2": 2, "3": 3}, "t": 0, "line": 1, "sent": 1, "msg": "t = 0: rank r küldi a chunk (r − 0) mod 4-et, a fogadó hozzáadja"}, {"st": [[[1, [0]], [1, [0]], [8, [0, 2, 3]], [5, [0, 3]]], [[3, [0, 1]], [2, [1]], [2, [1]], [7, [0, 1, 3]]], [[6, [0, 1, 2]], [5, [1, 2]], [3, [2]], [3, [2]]], [[4, [3]], [9, [1, 2, 3]], [7, [2, 3]], [4, [3]]]], "send": {"0": 3, "1": 0, "2": 1, "3": 2}, "t": 1, "line": 1, "sent": 2, "msg": "t = 1: rank r küldi a chunk (r − 1) mod 4-et, a fogadó hozzáadja"}, {"st": [[[1, [0]], [10, [0, 1, 2, 3]], [8, [0, 2, 3]], [5, [0, 3]]], [[3, [0, 1]], [2, [1]], [10, [0, 1, 2, 3]], [7, [0, 1, 3]]], [[6, [0, 1, 2]], [5, [1, 2]], [3, [2]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [9, [1, 2, 3]], [7, [2, 3]], [4, [3]]]], "send": {"0": 2, "1": 3, "2": 0, "3": 1}, "t": 2, "line": 1, "sent": 3, "msg": "t = 2: rank r küldi a chunk (r − 2) mod 4-et, a fogadó hozzáadja"}, {"st": [[[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [8, [0, 2, 3]], [5, [0, 3]]], [[3, [0, 1]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [7, [0, 1, 3]]], [[6, [0, 1, 2]], [5, [1, 2]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [9, [1, 2, 3]], [7, [2, 3]], [10, [0, 1, 2, 3]]]], "send": {"0": 1, "1": 2, "2": 3, "3": 0}, "t": 3, "line": 3, "sent": 4, "msg": "t = 3: rank r küldi a teljes chunk (r + 1 − 0) mod 4-et, a fogadó felülírja"}, {"st": [[[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [8, [0, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [7, [0, 1, 3]]], [[6, [0, 1, 2]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [9, [1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]]], "send": {"0": 0, "1": 1, "2": 2, "3": 3}, "t": 4, "line": 3, "sent": 5, "msg": "t = 4: rank r küldi a teljes chunk (r + 1 − 1) mod 4-et, a fogadó felülírja"}, {"st": [[[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]], [[10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]], [10, [0, 1, 2, 3]]]], "send": {"0": 3, "1": 0, "2": 1, "3": 2}, "t": 5, "line": 3, "sent": 6, "msg": "t = 5: rank r küldi a teljes chunk (r + 1 − 2) mod 4-et, a fogadó felülírja"}];
const CODE = ["// reduce-scatter: t = 0 … P−2", "send(chunk[(r − t) mod P] → rank r+1);  chunk[(r − 1 − t) mod P] += recv()", "// all-gather: t = P−1 … 2P−3", "send(chunk[(r + 1 − (t − P + 1)) mod P] → rank r+1);  felülírás", "// fa all-reduce (összevetés):", "redukció a gyökérbe log2(P) szinten", "broadcast a gyökérből log2(P) szinten"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PP = 4, SS = 1, TREE = false;
function ringSteps(p){
  let st = []; for (let r = 0; r < p; r++) { st.push([]); for (let c = 0; c < p; c++) st[r].push([r + 1, [r]]); }
  const out = [{st: JSON.parse(JSON.stringify(st)), send: {}, t: -1, line: -1, sent: 0,
    msg: `Kezdet: P = ${p}, a rank r minden eleme r + 1; ${p} chunk rankonként, S/P méretű.`}];
  for (let t = 0; t < 2 * (p - 1); t++) {
    const rs = t < p - 1, send = {};
    for (let r = 0; r < p; r++) send[r] = rs ? ((r - t) % p + p) % p : (((r + 1 - (t - (p - 1))) % p) + p) % p;
    const msgs = {}; for (let r = 0; r < p; r++) msgs[r] = JSON.parse(JSON.stringify(st[r][send[r]]));
    for (let r = 0; r < p; r++) { const d = (r + 1) % p, c = send[r];
      if (rs) st[d][c] = [st[d][c][0] + msgs[r][0], st[d][c][1].concat(msgs[r][1]).sort((a, b) => a - b)]; else st[d][c] = msgs[r]; }
    out.push({st: JSON.parse(JSON.stringify(st)), send, t, line: rs ? 1 : 3, sent: t + 1,
      msg: rs ? `t = ${t}: rank r küldi a chunk (r − ${t}) mod ${p}-t, a fogadó hozzáadja` : `t = ${t}: rank r küldi a teljes chunk (r + 1 − ${t - (p - 1)}) mod ${p}-t, a fogadó felülírja`});
  }
  return out; }
function treeSteps(p){
  // binomiális fa: redukció a rank 0-ba, majd broadcast; az egész S-et küldik
  let v = []; for (let r = 0; r < p; r++) v.push([r + 1, [r]]);
  const out = [{tree: JSON.parse(JSON.stringify(v)), send: {}, t: -1, line: -1, sent: 0, msg: `Fa all-reduce, P = ${p}: ${Math.ceil(Math.log2(p))} redukciós és ugyanennyi broadcast-szint, mindig a teljes S.`}];
  let lv = 0; for (let d = 1; d < p; d *= 2, lv++) { const send = {};
    for (let r = 0; r < p; r++) if (r % (2 * d) === d) { send[r] = r - d; v[r - d] = [v[r - d][0] + v[r][0], v[r - d][1].concat(v[r][1]).sort((a, b) => a - b)]; }
    out.push({tree: JSON.parse(JSON.stringify(v)), send, t: lv, line: 5, sent: lv + 1, msg: `redukció, ${lv + 1}. szint: ` + Object.entries(send).map(([a, b]) => `${a} → ${b}`).join(", ")}); }
  const L = lv; let half = 1; while (half * 2 < p) half *= 2;
  for (let d = half, k2 = 0; d >= 1; d = d / 2, k2++) { const send = {};
    for (let r = 0; r < p; r++) if (r % (2 * d) === 0 && r + d < p) { send[r] = r + d; v[r + d] = JSON.parse(JSON.stringify(v[r])); }
    out.push({tree: JSON.parse(JSON.stringify(v)), send, t: L + k2, line: 6, sent: L + k2 + 1, msg: `broadcast, ${k2 + 1}. szint: ` + Object.entries(send).map(([a, b]) => `${a} → ${b}`).join(", ")}); }
  return out; }
function fmtB(x){ return (x >= 1 ? x.toFixed(3).replace(/\.?0+$/, "") + " MiB" : (x * 1024).toFixed(1).replace(/\.0$/, "") + " KiB").replace(".", ","); }
function render(s){
  svg.setAttribute("viewBox", "0 0 780 420"); svg.innerHTML = "";
  const p = PP, cx = 260, cy = 210, R = p <= 4 ? 140 : 160;
  const rp = r => [cx + R * Math.sin(2 * Math.PI * r / p), cy - R * Math.cos(2 * Math.PI * r / p)];
  for (let r = 0; r < p; r++) { const [x0, y0] = rp(r), [x1, y1] = rp((r + 1) % p);
    if (!TREE) el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--muted"), "stroke-width": 1}); }
  Object.entries(s.send || {}).forEach(([a, c]) => { const ra = +a, rb = TREE ? +c : (ra + 1) % p; const [x0, y0] = rp(ra), [x1, y1] = rp(rb);
    el("line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: css("--hl2"), "stroke-width": 4});
    const mx = x0 + (x1 - x0) * 0.75, my = y0 + (y1 - y0) * 0.75; el("circle", {cx: mx, cy: my, r: 5, fill: css("--hl2")}); });
  const cw = p <= 4 ? 34 : 24;
  for (let r = 0; r < p; r++) { const [x, y] = rp(r);
    el("text", {x, y: y - 26, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "rank " + r);
    const cells = TREE ? [s.tree[r]] : s.st[r]; const w0 = x - cells.length * cw / 2;
    cells.forEach((cell, c) => { const full = cell[1].length === p, sent = !TREE && s.send && s.send[r] === c;
      el("rect", {x: w0 + c * cw, y: y - 18, width: cw, height: 36, fill: full ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": sent ? 3.5 : 1, "stroke-dasharray": full ? "" : "4 2"});
      el("text", {x: w0 + c * cw + cw / 2, y: y - 2, "text-anchor": "middle", "font-size": 13}, String(cell[0]));
      el("text", {x: w0 + c * cw + cw / 2, y: y + 13, "text-anchor": "middle", "font-size": 9, fill: css("--muted")}, cell[1].join("")); }); }
  const steps = TREE ? 2 * Math.ceil(Math.log2(p)) : 2 * (p - 1), per = TREE ? SS : SS / p;
  const lines = [TREE ? "fa all-reduce (binomiális)" : "gyűrű all-reduce", `lépések: ${s.sent} / ${steps}`,
    `küldve rankonként (legfeljebb): ${fmtB(s.sent * per)}`, TREE ? `(a gyökér linkjén a teljes S megy szintenként)` : `végül: 2(P−1)/P · S = ${fmtB(2 * (p - 1) / p * SS)}`,
    TREE ? `T_fa ≈ ${steps}·L + ${steps}·S/B` : `T_ring = ${steps}·L + ${steps}·S/(P·B)`, `L-tag: ${s.sent}·L,  sávszél.-tag: ${s.sent}·${TREE ? "S/B" : "S/(P·B)"}`];
  lines.forEach((t, i) => el("text", {x: 520, y: 60 + i * 24, "font-size": 13}, t));
  el("text", {x: 520, y: 220, "font-size": 11, fill: css("--muted")}, "szürke, folytonos: teljes chunk;");
  el("text", {x: 520, y: 236, "font-size": 11, fill: css("--muted")}, "szaggatott: részleges; vastag: küldött;");
  el("text", {x: 520, y: 252, "font-size": 11, fill: css("--muted")}, "alsó sor: hozzájáruló rankok");
}
function reload(){ setSteps(TREE ? treeSteps(PP) : ringSteps(PP)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
