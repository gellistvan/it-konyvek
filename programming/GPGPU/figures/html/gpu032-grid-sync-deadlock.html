<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid.sync() és a rezidencia-korlát</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>SM: <input id="sm" type="range" min="1" max="8" value="4" oninput="upd()" aria-label="SM-ek száma"> <b id="smv">4</b></label><label>blokk/SM: <input id="sl" type="range" min="1" max="4" value="2" oninput="upd()" aria-label="Blokkhelyek SM-enként"> <b id="slv">2</b></label><label>grid: <input id="gr" type="range" min="1" max="40" value="12" oninput="upd()" aria-label="Grid mérete blokkban"> <b id="grv">12</b></label><label><input id="coop" type="checkbox" onchange="upd()"> kooperatív indítás</label><label><input id="nob" type="checkbox" onchange="upd()"> grid.sync() nélkül (hullámos ütemezés)</label><button onclick="preset(8)">(a) 8 blokk</button><button onclick="preset(12)">(b) 12 blokk</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="4 SM, SM-enként 2 blokkhely; 8 blokknál a barrier feloldódik, 12 blokknál 4 blokk sosem indul el, és a többiek örökké várnak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető modell: a blokkok körbeforgó elhelyezése és az azonos hosszú fázisok egyszerűsítés. Valós kapacitás: cudaOccupancyMaxActiveBlocksPerMultiprocessor × SM-szám. Kezdőállapot: az ábra (b) panelje.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": ["run", "run", "run", "run", "run", "run", "run", "run", "queue", "queue", "queue", "queue"], "where": [[0, 0], [1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], null, null, null, null], "line": 3, "verdict": "", "msg": "max = SM × blokk/SM = 4 × 2 = 8; grid = 12. 8 blokk rezidens, 4 várólistán (nem ütemezett)."}, {"st": ["wait", "wait", "wait", "wait", "wait", "wait", "wait", "wait", "queue", "queue", "queue", "queue"], "where": [[0, 0], [1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], null, null, null, null], "line": 4, "verdict": "", "msg": "A rezidens blokkok elérik a grid.sync()-et: 8/12 megérkezett."}, {"st": ["wait", "wait", "wait", "wait", "wait", "wait", "wait", "wait", "queue", "queue", "queue", "queue"], "where": [[0, 0], [1, 0], [2, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], null, null, null, null], "line": 4, "verdict": "deadlock", "msg": "HOLTPONT: a 8 várakozó blokk nem fejeződik be, így nem szabadul fel hely; a 4 nem ütemezett blokk sosem indul el."}];
const CODE = ["cudaOccupancyMaxActiveBlocksPerMultiprocessor(&max_blocks_per_sm, kernel, block, smem);", "int max_coop = num_sms * max_blocks_per_sm;     // a teljes grid egyszerre rezidens legyen", "cudaLaunchCooperativeKernel(kernel, grid, block, args);   // grid > max_coop: hiba", "  ... 1. fázis (kernelen belül) ...", "  grid.sync();    // a grid MINDEN blokkjának meg kell érkeznie", "  ... 2. fázis ..."];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.innerHTML = "";
  const P = cur(), sms = P.sms, slots = P.slots, cw = Math.min(88, 700 / sms), bh = 30;
  const top = 70, H = top + slots * (bh + 8) + 40 + Math.ceil(Math.max(0, s.st.filter(x => x === "queue").length) / 10) * 34 + 60;
  svg.setAttribute("viewBox", "0 0 760 " + Math.max(260, H));
  const defs = el("defs", {});
  for (let m = 0; m < sms; m++) {
    const x = 30 + m * cw;
    el("rect", {x: x, y: top, width: cw - 8, height: slots * (bh + 8) + 6, fill: "none", stroke: css("--muted")});
    el("text", {x: x + (cw - 8) / 2, y: top + slots * (bh + 8) + 24, "text-anchor": "middle", "font-size": 12}, "SM " + m);
  }
  const bar = s.st.some(x => x === "wait" || x === "pass");
  if (!P.nob) { el("line", {x1: 20, x2: 30 + sms * cw, y1: top - 10, y2: top - 10, stroke: css("--fg"), "stroke-width": 4});
    el("text", {x: 30 + sms * cw + 6, y: top - 6, "font-size": 12}, "grid.sync()"); }
  s.where.forEach((w, i) => {
    const st = s.st[i]; if (!w || st === "queue" || st === "none" || st === "done") return;
    const x = 30 + w[0] * cw + 6, y = top + 4 + (slots - 1 - w[1]) * (bh + 8);
    const fill = st === "pass" || st === "run" ? css("--cellhl") : st === "done" ? css("--cell") : css("--bg");
    el("rect", {x: x, y: y, width: cw - 20, height: bh, fill: fill, stroke: css("--line"), "stroke-width": st === "wait" ? 2.5 : 1.2, "stroke-dasharray": st === "done" ? "2 3" : "none"});
    el("text", {x: x + (cw - 20) / 2, y: y + bh / 2 + 5, "text-anchor": "middle", "font-size": 12}, "B" + i + (st === "done" ? " kész" : st === "wait" ? " vár" : ""));
  });
  const nd = s.st.filter(x => x === "done").length;
  if (nd) el("text", {x: 30, y: 50, "font-size": 12, fill: css("--muted")}, "befejezett blokkok: " + nd + "/" + P.grid);
  const q = s.st.map((x, i) => [x, i]).filter(a => a[0] === "queue");
  const qy = top + slots * (bh + 8) + 46;
  if (q.length) el("text", {x: 30, y: qy, "font-size": 12}, "várólista (nem ütemezett): " + q.length + " blokk");
  q.forEach((a, k) => { const x = 30 + (k % 10) * 70, y = qy + 8 + Math.floor(k / 10) * 34;
    el("rect", {x: x, y: y, width: 60, height: 26, fill: "none", stroke: css("--line"), "stroke-dasharray": "5 3"});
    el("text", {x: x + 30, y: y + 18, "text-anchor": "middle", "font-size": 12}, "B" + a[1]); });
  const v = s.verdict === "deadlock" ? "HOLTPONT" : s.verdict === "reject" ? "cudaErrorCooperativeLaunchTooLarge" : s.verdict === "ok" ? "rendben" : "";
  el("text", {x: 30, y: 26, "font-size": 15, "font-weight": "bold", fill: s.verdict === "deadlock" || s.verdict === "reject" ? css("--hl2") : css("--fg")},
     "max = SM × blokk/SM = " + sms + " × " + slots + " = " + (sms * slots) + "   grid = " + P.grid + (v ? "   → " + v : ""));
}
function cur(){ const g = id => +document.getElementById(id).value;
  return {sms: g("sm"), slots: g("sl"), grid: g("gr"), coop: document.getElementById("coop").checked, nob: document.getElementById("nob").checked}; }
function sim(sms, slots, grid, coop, barrier){
  const cap = sms * slots, head = `max = SM × blokk/SM = ${sms} × ${slots} = ${cap}; grid = ${grid}. `, steps = [];
  if (coop && grid > cap) { steps.push({st: Array(grid).fill("none"), where: Array(grid).fill(null), line: 2, verdict: "reject",
      msg: head + "Kooperatív indítás: grid > max → cudaErrorCooperativeLaunchTooLarge, a kernel el sem indul."}); return steps; }
  const where = Array(grid).fill(null);
  for (let i = 0; i < Math.min(grid, cap); i++) where[i] = [i % sms, Math.floor(i / sms)];
  let st = where.map(w => w ? "run" : "queue"); const q = grid - Math.min(grid, cap);
  steps.push({st: st.slice(), where: where.slice(), line: 3, verdict: "", msg: head + Math.min(grid, cap) + " blokk rezidens" + (q ? ", " + q + " várólistán (nem ütemezett)." : ".")});
  if (barrier) {
    st = st.map(x => x === "run" ? "wait" : x); const arr = st.filter(x => x === "wait").length;
    steps.push({st: st.slice(), where: where.slice(), line: 4, verdict: "", msg: `A rezidens blokkok elérik a grid.sync()-et: ${arr}/${grid} megérkezett.`});
    if (arr === grid) {
      steps.push({st: Array(grid).fill("pass"), where: where.slice(), line: 5, verdict: "ok", msg: `Mind a ${grid} blokk a barriernél van: a grid.sync() feloldódik, a második fázis fut.`});
      steps.push({st: Array(grid).fill("done"), where: where.slice(), line: 5, verdict: "ok", msg: "A kernel befejeződött."});
    } else steps.push({st: st.slice(), where: where.slice(), line: 4, verdict: "deadlock",
      msg: `HOLTPONT: a ${arr} várakozó blokk nem fejeződik be, így nem szabadul fel hely; a ${grid - arr} nem ütemezett blokk sosem indul el.`});
    return steps;
  }
  let wave = 1;
  while (true) {
    st = st.map(x => x === "run" ? "done" : x);
    const nxt = st.map((x, i) => [x, i]).filter(a => a[0] === "queue").slice(0, cap).map(a => a[1]);
    if (!nxt.length) { steps.push({st: st.slice(), where: where.slice(), line: 5, verdict: "ok", msg: `Barrier nélkül nincs holtpont: ${wave}. hullám vége, a kernel kész.`}); break; }
    nxt.forEach((i, k) => { where[i] = [k % sms, Math.floor(k / sms)]; st[i] = "run"; });
    wave++;
    steps.push({st: st.slice(), where: where.slice(), line: 3, verdict: "", msg: `${wave}. hullám: a felszabadult helyekre ${nxt.length} újabb blokk kerül.`});
  }
  return steps;
}
function upd(){ const P = cur();
  ["sm", "sl", "gr"].forEach(id => document.getElementById(id + "v").textContent = document.getElementById(id).value);
  setSteps(sim(P.sms, P.slots, P.grid, P.coop, !P.nob)); }
function preset(g){ document.getElementById("sm").value = 4; document.getElementById("sl").value = 2; document.getElementById("gr").value = g; upd(); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
