<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1D konvolúció: csempe halóval</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>R: <input id="rr" type="range" min="1" max="16" value="3" oninput="recompute()" aria-label="szűrő sugara"> <span id="rrv">3</span></label> <label>T: <input id="tt" type="range" min="32" max="1024" step="32" value="256" oninput="recompute()" aria-label="blokkméret, kimeneti elem blokkonként"> <span id="ttv">256</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A shared memory sáv bal és jobb halóval, a két betöltési menet, alatta a kért és a DRAM-szintű aritmetikai intenzitás a naiv és a csempézett kernelre."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 13.4.4 képletei, FP32: FLOP/elem = 2(2R+1); naiv kért ((2R+1)+1)·4 B/elem; csempézett kért ((T+2R)·4 + T·4) B/blokk; DRAM ideális 8 B/elem; menetek ⌈(T+2R)/T⌉. Modellérték, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": 0, "line": 0, "msg": "R = 3, T = 256: kért naiv 32 B/elem (AI 0,4375), csempézett 8,094 B/elem (AI 1,73), DRAM 8 B/elem (AI 1,75); menetek: 2. A shared sáv (T + 2R = 262 elem) még üres."}, {"p": 1, "line": 1, "msg": "R = 3, T = 256: kért naiv 32 B/elem (AI 0,4375), csempézett 8,094 B/elem (AI 1,73), DRAM 8 B/elem (AI 1,75); menetek: 2. 1. menet: t = 0…255 → s[0…255] (256 elem, threadIdx.x = 0…255)."}, {"p": 2, "line": 1, "msg": "R = 3, T = 256: kért naiv 32 B/elem (AI 0,4375), csempézett 8,094 B/elem (AI 1,73), DRAM 8 B/elem (AI 1,75); menetek: 2. 2. menet: t = 256…261 → s[256…261] (6 elem, threadIdx.x = 0…5)."}, {"p": 3, "line": 4, "msg": "R = 3, T = 256: kért naiv 32 B/elem (AI 0,4375), csempézett 8,094 B/elem (AI 1,73), DRAM 8 B/elem (AI 1,75); menetek: 2. __syncthreads() után a 256 szál a shared sávból számol (2R + 1 = 7 szomszéd)."}];
const CODE = ["extern __shared__ float s[];          // BLOCK + 2R elem", "for (int t = threadIdx.x; t < BLOCK + 2 * R; t += BLOCK)", "    s[t] = (g - R + t >= 0 && g - R + t < N) ? in[g - R + t] : 0.0f;", "__syncthreads();", "out[g] = sum_{k=-R..R} w[k] * s[threadIdx.x + R + k];"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function g(id){ return +document.getElementById(id).value; }
function cm(x, d){ return x.toFixed(d).replace(".", ","); }
function model(R, T){
  const flop = 2 * (2 * R + 1), nb = ((2 * R + 1) + 1) * 4, tb = (T + 2 * R) * 4 + T * 4, passes = Math.ceil((T + 2 * R) / T), loads = [];
  for (let p = 0; p < passes; p++) loads.push(Math.min(T, T + 2 * R - p * T));
  return {flop: flop, naive_b: nb, tiled_b: tb, tiled_per: tb / T, ai_naive: flop / nb, ai_tiled: T * flop / tb, ai_dram: flop / 8, passes: passes, loads: loads, strip: T + 2 * R};
}
function recompute(){
  const R = g("rr"), T = g("tt"), m = model(R, T);
  document.getElementById("rrv").textContent = R; document.getElementById("ttv").textContent = T;
  const head = `R = ${R}, T = ${T}: kért naiv ${m.naive_b} B/elem (AI ${cm(m.ai_naive, 4)}), csempézett ${cm(m.tiled_per, 3)} B/elem (AI ${cm(m.ai_tiled, 2)}), DRAM 8 B/elem (AI ${cm(m.ai_dram, 2)}); menetek: ${m.passes}. `;
  const st = [{p: 0, line: 0, msg: head + `A shared sáv (T + 2R = ${m.strip} elem) még üres.`}];
  let done = 0;
  m.loads.forEach((n, p) => { st.push({p: p + 1, line: 1, msg: head + `${p + 1}. menet: t = ${p * T}…${p * T + n - 1} → s[${done}…${done + n - 1}] (${n} elem, threadIdx.x = 0…${n - 1}).`}); done += n; });
  st.push({p: m.passes + 1, line: 4, msg: head + `__syncthreads() után a ${T} szál a shared sávból számol (2R + 1 = ${2 * R + 1} szomszéd).`});
  setSteps(st);
}
function render(s){
  const R = g("rr"), T = g("tt"), m = model(R, T);
  document.getElementById("rrv").textContent = R; document.getElementById("ttv").textContent = T;
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const fg = css("--fg"), mu = css("--muted");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${css("--cellhl")}"/><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.2"/></pattern>`;
  svg.appendChild(defs);
  // a shared sáv méretarányosan
  const X0 = 20, W = 720, sc = W / m.strip, X = e => X0 + e * sc, y = 70;
  el("text", {x: X0, y: 20, "font-size": 13, "font-weight": "bold"}, `shared sáv: ${R} + ${T} + ${R} = ${m.strip} elem (méretarányos)`);
  let loaded = 0; for (let p = 0; p < Math.min(s.p, m.passes); p++) loaded += m.loads[p];
  el("rect", {x: X(0), y: y, width: X(R) - X(0), height: 40, fill: "url(#hz)", stroke: fg});
  el("rect", {x: X(R), y: y, width: X(R + T) - X(R), height: 40, fill: css("--cell"), stroke: fg});
  el("rect", {x: X(R + T), y: y, width: X(m.strip) - X(R + T), height: 40, fill: "url(#hz)", stroke: fg});
  if (loaded > 0) el("rect", {x: X(0), y: y + 12, width: X(loaded) - X(0), height: 16, fill: mu, opacity: 0.85});
  let off = 0;
  m.loads.forEach((n, p) => {
    const cur = s.p === p + 1, yy = y + 56 + 22 * p;
    el("line", {x1: X(off), y1: yy, x2: X(off + n), y2: yy, stroke: cur ? css("--hl2") : fg, "stroke-width": cur ? 5 : 2});
    el("text", {x: Math.min(X(off) + 4, 600), y: yy + 16, "font-size": 11, fill: cur ? css("--hl2") : fg}, `${p + 1}. menet: ${n} elem`);
    off += n;
  });
  el("text", {x: X0, y: y - 8, "font-size": 11}, `bal halo ${R}`);
  el("text", {x: X(m.strip), y: y - 8, "font-size": 11, "text-anchor": "end"}, `jobb halo ${R}`);
  // AI-sávok
  const yb = 220, maxAI = Math.max(m.ai_dram, m.ai_tiled, m.ai_naive) * 1.1, bx = 250, bw = 440;
  [["AI kért, naiv", m.ai_naive, "4 3"], ["AI kért, csempézett", m.ai_tiled, ""], ["AI DRAM (mindkettő)", m.ai_dram, ""]].forEach((r, i) => {
    const yy = yb + i * 30;
    el("text", {x: bx - 8, y: yy + 15, "text-anchor": "end", "font-size": 12}, r[0]);
    el("rect", {x: bx, y: yy, width: r[1] / maxAI * bw, height: 20, fill: i === 2 ? fg : css("--cellhl"), stroke: fg, "stroke-dasharray": r[2]});
    el("text", {x: bx + r[1] / maxAI * bw + 6, y: yy + 15, "font-size": 12}, cm(r[1], i === 0 ? 4 : 2) + " FLOP/bájt");
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
