<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memóriahierarchia: kapacitás és késleltetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--line:#000;--grid:#ddd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--line:#ddd;--grid:#444;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:6px}
select{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;background:var(--code);padding:4px 8px}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}
.pt{cursor:pointer}
.pt:focus{outline:none}
.pt:focus .mk{stroke:var(--hl);stroke-width:3.5}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <label for="gpu">GPU:</label><select id="gpu"><option>A100</option><option>H100</option><option>RTX 4090</option></select>
  <span role="group" aria-label="Kapacitás nézete"><label><input type="radio" name="m" value="sm" checked> SM-enként</label>
  <label><input type="radio" name="m" value="gpu"> GPU-szinten összegezve</label></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 360" role="img" aria-label="Log–log pontdiagram öt ponttal a regisztertől a globális memóriáig; a kapacitás öt, a késleltetés két-három nagyságrendet nő."></svg>
<p class="small" id="src"></p>
<script>
const LV = {"A100": {"sms": 108, "src": "3.3.1 táblázat", "lv": [["Regiszter", [262144, 262144], true, [1, 1], "egy szál privát", "a leggyorsabb munkaterület, a számítás közvetlen operandusa"], ["Shared", [167936, 167936], true, [20, 30], "egy blokkon belüli szálak", "szoftver által vezérelt on-chip adatterület, adat-újrafelhasználás (tiling)"], ["L1", [196608, 196608], true, [30, 40], "SM-en belüli hardver (a shareddel közös)", "a global/local hozzáférések automatikus gyorsítótára"], ["L2", [40000000.0, 40000000.0], false, [200, 200], "az egész GPU", "az összes SM közös gyorsítótára, a HBM-késleltetés elrejtése"], ["HBM", [40000000000.0, 80000000000.0], false, [400, 700], "device szint", "a nagy adathalmazok tényleges tárolója"]]}, "H100": {"sms": 132, "src": "ellenőrizendő: H100 SXM whitepaper; L2 50 MB és 132 SM a 3.4 alfejezetből", "lv": [["Regiszter", [262144, 262144], true, [1, 1], "egy szál privát", "a leggyorsabb munkaterület"], ["Shared", [233472, 233472], true, [20, 30], "egy blokkon (clusteren) belüli szálak", "on-chip adatterület; Hopperen a cluster blokkjai között is elérhető (DSMEM)"], ["L1", [262144, 262144], true, [30, 40], "SM-en belüli hardver (a shareddel közös)", "a global/local hozzáférések gyorsítótára"], ["L2", [50000000.0, 50000000.0], false, [200, 200], "az egész GPU", "közös gyorsítótár"], ["HBM", [80000000000.0, 80000000000.0], false, [400, 700], "device szint", "HBM3, > 3 TB/s"]]}, "RTX 4090": {"sms": 128, "src": "ellenőrizendő: Ada (AD102) whitepaper", "lv": [["Regiszter", [262144, 262144], true, [1, 1], "egy szál privát", "a leggyorsabb munkaterület"], ["Shared", [102400, 102400], true, [20, 30], "egy blokkon belüli szálak", "on-chip adatterület (max. 100 KiB/SM)"], ["L1", [131072, 131072], true, [30, 40], "SM-en belüli hardver (a shareddel közös)", "a global/local hozzáférések gyorsítótára"], ["L2", [72000000.0, 72000000.0], false, [200, 200], "az egész GPU", "nagy L2 a GDDR6X-sávszélesség kiegészítésére"], ["HBM", [24000000000.0, 24000000000.0], false, [400, 700], "device szint (GDDR6X, nem HBM)", "a nagy adathalmazok tárolója"]]}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, a, t, p){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(t!==undefined)e.textContent=t;(p||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const KiB = 1024, MiB = 1048576;
function hb(b, bin){ for (const [u, s] of (bin ? [[MiB, "MiB"], [KiB, "KiB"]] : [[1e9, "GB"], [1e6, "MB"], [MiB, "MiB"], [KiB, "KiB"]])) if (b >= u * 0.999) { const v = b / u; return (Math.abs(v - Math.round(v)) < 0.05 ? v.toFixed(0) : v.toFixed(1)).replace(".", ",") + " " + s; } return b + " B"; }
const L = 70, R = 620, T = 14, B = 300, X = b => L + (R - L) * (Math.log10(b) - 5) / 6.5, Y = c => B - (B - T) * (Math.log10(c) + 0.3) / 3.5;
let sel = -1;
function draw(){
  const g = document.getElementById("gpu").value, m = document.querySelector("input[name=m]:checked").value, D = LV[g];
  svg.innerHTML = "";
  for (let e = 5; e <= 11; e++) { el("line", {x1: X(Math.pow(10, e)), y1: T, x2: X(Math.pow(10, e)), y2: B, stroke: css("--grid")}); el("text", {x: X(Math.pow(10, e)), y: B + 16, "text-anchor": "middle", "font-size": 11}, "10" + ["⁵", "⁶", "⁷", "⁸", "⁹", "¹⁰", "¹¹"][e - 5]); }
  [1, 10, 100, 1000].forEach(c => { el("line", {x1: L, y1: Y(c), x2: R, y2: Y(c), stroke: css("--grid")}); el("text", {x: L - 6, y: Y(c) + 4, "text-anchor": "end", "font-size": 11}, String(c)); });
  el("text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, "kapacitás (bájt, log)");
  el("text", {x: 16, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: `rotate(-90 16 ${(T + B) / 2})`}, "késleltetés (ciklus, log)");
  D.lv.forEach((v, i) => { const mul = (m === "gpu" && v[2]) ? D.sms : 1, c0 = v[1][0] * mul, c1 = v[1][1] * mul, x = Math.sqrt(c0 * c1), y = Math.sqrt(v[3][0] * v[3][1]);
    const gr = el("g", {class: "pt", tabindex: 0, role: "button", "aria-label": v[0]});
    if (c1 > c0) el("line", {x1: X(c0), y1: Y(y), x2: X(c1), y2: Y(y), stroke: css("--line"), "stroke-width": 1.5}, undefined, gr);
    if (v[3][1] > v[3][0]) el("line", {x1: X(x), y1: Y(v[3][0]), x2: X(x), y2: Y(v[3][1]), stroke: css("--line"), "stroke-width": 1.5}, undefined, gr);
    if (v[2]) el("circle", {class: "mk", cx: X(x), cy: Y(y), r: 7, fill: css("--bg"), stroke: i === sel ? css("--hl") : css("--line"), "stroke-width": i === sel ? 3.5 : 2}, undefined, gr);
    else el("rect", {class: "mk", x: X(x) - 7, y: Y(y) - 7, width: 14, height: 14, fill: css("--fg"), stroke: i === sel ? css("--hl") : css("--line"), "stroke-width": i === sel ? 3.5 : 1}, undefined, gr);
    const lab = `${v[0]}: ${hb(c0, v[2])}${c1 > c0 ? "–" + hb(c1, v[2]) : ""}${v[2] && m === "sm" ? "/SM" : ""}`;
    const right = i === 0 || i === 2 || (m === "gpu" && i < 3 && i !== 1);
    el("text", {x: X(x) + (right ? 12 : -12), y: Y(y) + (i === 1 ? 16 : -10), "text-anchor": right ? "start" : "end", "font-size": 12}, lab, gr);
    const f = () => { sel = i; draw(); document.getElementById("status").textContent = `${v[0]} – láthatóság: ${v[4]}; kapacitás ${lab.split(": ")[1]}; késleltetés ${v[3][0] === v[3][1] ? "~" + v[3][0] : v[3][0] + "–" + v[3][1]} ciklus. Szerep: ${v[5]}.`; };
    gr.addEventListener("click", f); gr.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); f(); } }); });
  document.getElementById("src").textContent = `Üres kör: SM-enkénti szint, teli négyzet: GPU-szintű. ${g}: ${D.sms} SM; forrás: ${D.src}. Tájékoztató nagyságrendek, nem saját mérés.` + (g !== "A100" ? " A késleltetések az A100 nagyságrendjei (ellenőrizendő)." : "");
}
document.getElementById("gpu").addEventListener("change", () => { sel = -1; draw(); document.getElementById("status").textContent = "Kattints egy pontra (vagy Tab + Enter) a láthatóságért és a szerepért."; });
document.querySelectorAll("input[name=m]").forEach(r => r.addEventListener("change", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
document.getElementById("status").textContent = "Kattints egy pontra (vagy Tab + Enter) a láthatóságért és a szerepért.";
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
