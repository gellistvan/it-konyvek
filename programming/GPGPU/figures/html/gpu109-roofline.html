<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roofline RTX 3090</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#c55a11;--line:#000;--grid:#ccc}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;margin-bottom:6px;max-width:640px}
input[type=range]{width:100%}input[type=number]{width:7em;font:inherit}
svg{width:100%;max-width:640px;height:auto;display:block}svg text{font-family:system-ui,sans-serif}svg text:not([fill]){fill:var(--fg)}
#status{min-height:4.4em;margin:4px 0}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl">
<label for="n">GEMM N</label><input id="n" type="range" min="7" max="13" step="1" value="12"><span id="nv"></span>
<label for="r">add_bias sorok</label><input id="r" type="range" min="1" max="8192" step="1" value="128"><span id="rv"></span>
<label for="pk">csúcs (TFLOPS)</label><input id="pk" type="range" min="5" max="100" step="0.1" value="35.6"><span id="pkv"></span>
<label for="bw">sávszél. (GB/s)</label><input id="bw" type="range" min="200" max="3500" step="1" value="936"><span id="bwv"></span>
<label for="me">mért GEMM TFLOPS</label><input id="me" type="number" min="0" step="0.1" placeholder="(üres)"><span class="small">saját mérés</span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 400" role="img" aria-label="Log-log roofline a memória- és a számítási tetővel, az add_bias és a GEMM jelölőjével"></svg>
<p class="small">Alapértelmezés: RTX 3090 adatlapi csúcsai (35,6 TFLOPS FP32, 936 GB/s), nem mérés. GEMM: 2N³ FLOP, 3N²·4 bájt
(AI = N/6); add_bias: sor·128 FLOP, (2·sor·128 + 128)·4 bájt. A valós SGEMM a tető alatt marad.</p>
<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const f=(v,d)=>v.toFixed(d).replace(".",",");
const X0=70,X1=620,Y0=360,Y1=20,LX=[-2,4],LY=[-2,2];
const px=a=>X0+(Math.log10(a)-LX[0])/(LX[1]-LX[0])*(X1-X0), py=p=>Y0-(Math.log10(p)-LY[0])/(LY[1]-LY[0])*(Y0-Y1);
function draw(){
  svg.innerHTML="";const L=cs("--line");
  const N=2**+document.getElementById("n").value, R=+document.getElementById("r").value, PK=+document.getElementById("pk").value, BW=+document.getElementById("bw").value;
  const me=parseFloat(document.getElementById("me").value);
  document.getElementById("nv").textContent=N;document.getElementById("rv").textContent=R;document.getElementById("pkv").textContent=f(PK,1);document.getElementById("bwv").textContent=BW;
  const roof=a=>Math.min(PK,BW*1e9*a/1e12), ridge=PK*1e12/(BW*1e9);
  for(let e=LX[0];e<=LX[1];e++){el("line",{x1:px(10**e),y1:Y1,x2:px(10**e),y2:Y0,stroke:cs("--grid")});el("text",{x:px(10**e),y:Y0+16,"text-anchor":"middle","font-size":11},String(10**e).replace(".",","));}
  for(let e=LY[0];e<=LY[1];e++){el("line",{x1:X0,y1:py(10**e),x2:X1,y2:py(10**e),stroke:cs("--grid")});el("text",{x:X0-6,y:py(10**e)+4,"text-anchor":"end","font-size":11},String(10**e).replace(".",","));}
  el("text",{x:(X0+X1)/2,y:Y0+34,"text-anchor":"middle","font-size":12},"aritmetikai intenzitás (FLOP/bájt)");
  el("text",{x:16,y:(Y0+Y1)/2,"text-anchor":"middle","font-size":12,transform:`rotate(-90 16 ${(Y0+Y1)/2})`},"teljesítmény (TFLOPS)");
  const pts=[];for(let i=0;i<=200;i++){const a=10**(LX[0]+i*(LX[1]-LX[0])/200);pts.push([px(a),py(Math.max(roof(a),0.01))]);}
  el("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:L,"stroke-width":3});
  if(ridge>0.01&&ridge<1e4){el("line",{x1:px(ridge),y1:Y1,x2:px(ridge),y2:Y0,stroke:cs("--muted"),"stroke-dasharray":"5 4"});el("text",{x:px(ridge)+4,y:Y0-8,"font-size":11},`gerincpont ≈ ${f(ridge,1)}`);}
  const gF=2*N**3,gB=3*N*N*4,gA=gF/gB, aF=R*128,aB=(2*R*128+128)*4,aA=aF/aB;
  el("circle",{cx:px(aA),cy:py(roof(aA)),r:7,fill:cs("--bg"),stroke:L,"stroke-width":2});
  el("text",{x:px(aA)+10,y:py(roof(aA))-10,"font-size":12},"add_bias");
  el("rect",{x:px(gA)-7,y:py(roof(gA))-7,width:14,height:14,fill:cs("--muted"),stroke:L});
  el("text",{x:px(gA)-10,y:py(roof(gA))+24,"text-anchor":"end","font-size":12},`GEMM ${N}³`);
  let msg=`GEMM ${N}³: AI = ${f(gA,1)} FLOP/bájt → tető ${f(roof(gA),2)} TFLOPS (${gA>=ridge?"számításkorlátos":"memóriakorlátos"}). add_bias (${R} × 128 + 128): AI = ${f(aA,3)} → tető ${f(roof(aA),3)} TFLOPS (${aA>=ridge?"számításkorlátos":"memóriakorlátos"}). Gerincpont: ${f(ridge,1)} FLOP/bájt.`;
  if(Number.isFinite(me)&&me>0){el("polygon",{points:`${px(gA)},${py(Math.max(me,0.011))-8} ${px(gA)-7},${py(Math.max(me,0.011))+5} ${px(gA)+7},${py(Math.max(me,0.011))+5}`,fill:cs("--hl"),stroke:L});
    msg+=` Mért: ${f(me,2)} TFLOPS = a tető ${f(100*me/roof(gA),1)}%-a (távolság ${f(roof(gA)-me,2)} TFLOPS).`;}
  document.getElementById("status").textContent=msg;
}
["n","r","pk","bw","me"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
