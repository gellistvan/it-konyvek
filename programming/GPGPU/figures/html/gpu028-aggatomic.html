<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp-aggregált atomicAdd</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>counter kezdőértéke: <input id="c0" type="number" value="100" style="width:6em" aria-label="Kezdőérték"></label><button onclick="setC0()">Beállítás</button><span class="small">a predikátum a rajzon, a körre kattintva váltható</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolc sáv predikátummal; a vezető sáv egyetlen atomicAdd-dal foglal helyet, a szálak a bázis és a popcount alapján kapnak indexet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kezdőállapot: pred = [0, 1, 1, 0, 1, 0, 0, 1], counter = 100 → 104, indexek 100–103. 8 sávos szemléltetés; a valós kódban 32 sáv, a maszk 0xffffffff.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "line": 0, "msg": "ballot = 0b10010110 = 0x96 (4 igaz sáv)"}, {"k": 1, "line": 1, "msg": "leader = __ffs(ballot) − 1 = 1"}, {"k": 2, "line": 2, "msg": "a 1. sáv egyetlen atomicAdd-ot hajt végre 4-gyel: base = 100, counter: 100 → 104"}, {"k": 3, "line": 3, "msg": "__shfl_sync: minden sáv megkapja a base = 100 értéket"}, {"k": 4, "line": 4, "msg": "indexek: 1. sáv → 100, 2. sáv → 101, 4. sáv → 102, 7. sáv → 103; atomi műveletek: 4 helyett 1"}];
const CODE = ["unsigned ballot = __ballot_sync(mask, pred);", "int leader = __ffs(ballot) - 1;", "if (lane == leader) base = atomicAdd(counter, __popc(ballot));", "base = __shfl_sync(mask, base, leader);", "return base + __popc(ballot & ((1u << lane) - 1u));"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let PRED = [0, 1, 1, 0, 1, 0, 0, 1], C0 = 100;
const NL = PRED.length;
const popc = x => { let c = 0; while (x) { c += x & 1; x >>>= 1; } return c; };
function agg(){ const ballot = PRED.reduce((b, p, l) => b | (p ? 1 << l : 0), 0), leader = ballot ? Math.log2(ballot & -ballot) : -1;
  const base = ballot ? C0 : 0, counter = C0 + popc(ballot);
  return {ballot, leader, base, counter, idx: PRED.map((p, l) => p ? base + popc(ballot & ((1 << l) - 1)) : null)}; }
function gen(){ const r = agg(), b = r.ballot.toString(2).padStart(8, "0"), h = r.ballot.toString(16).toUpperCase().padStart(2, "0");
  if (!r.ballot) return [{k: 4, line: 0, msg: "ballot = 0: nincs igaz predikátum, nincs atomi művelet"}];
  return [{k: 0, line: 0, msg: `ballot = 0b${b} = 0x${h} (${popc(r.ballot)} igaz sáv)`},
          {k: 1, line: 1, msg: `leader = __ffs(ballot) − 1 = ${r.leader}`},
          {k: 2, line: 2, msg: `a ${r.leader}. sáv egyetlen atomicAdd-ot hajt végre ${popc(r.ballot)}-gyel: base = ${r.base}, counter: ${C0} → ${r.counter}`},
          {k: 3, line: 3, msg: `__shfl_sync: minden sáv megkapja a base = ${r.base} értéket`},
          {k: 4, line: 4, msg: "indexek: " + r.idx.map((v, l) => v === null ? null : `${l}. sáv → ${v}`).filter(x => x).join(", ") + `; atomi műveletek: ${popc(r.ballot)} helyett 1`}]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 720 330"); svg.innerHTML = "";
  const r = agg(), x0 = 150, cw = 48;
  const rows = ["1. ballot", "2. leader", "3. atomicAdd", "4. shfl(base)", "5. saját index"], ys = [55, 110, 165, 220, 275];
  rows.forEach((t, i) => el("text", {x: 10, y: ys[i] + 5, "font-size": 13, "font-weight": i === s.k ? "bold" : "normal", fill: i === s.k ? css("--hl2") : (i > s.k ? css("--muted") : css("--fg"))}, t));
  for (let l = 0; l < NL; l++) { const cx = x0 + l * cw + cw / 2;
    el("text", {x: cx, y: 22, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "sáv " + l);
    const c = el("circle", {cx, cy: ys[0], r: 13, fill: PRED[l] ? css("--fg") : css("--bg"), stroke: css("--line"), "stroke-width": 2});
    c.style.cursor = "pointer"; c.addEventListener("click", () => { PRED[l] = PRED[l] ? 0 : 1; setSteps(gen()); });
    if (s.k >= 1 && l === r.leader) el("text", {x: cx, y: ys[1] + 9, "text-anchor": "middle", "font-size": 26}, "★");
    if (s.k >= 3) { el("rect", {x: cx - 24, y: ys[3] - 15, width: 48, height: 30, fill: css("--cell"), stroke: css("--line")});
      el("text", {x: cx, y: ys[3] + 5, "text-anchor": "middle", "font-size": 13}, r.base); }
    if (s.k >= 4) { const v = r.idx[l]; el("rect", {x: cx - 24, y: ys[4] - 15, width: 48, height: 30, fill: v === null ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": v === null ? .6 : 2.5});
      el("text", {x: cx, y: ys[4] + 5, "text-anchor": "middle", "font-size": 13, "font-style": v === null ? "italic" : "normal"}, v === null ? "–" : v); }
  }
  const b = r.ballot.toString(2).padStart(8, "0");
  if (s.k >= 0) el("text", {x: x0 + NL * cw + 10, y: ys[0] + 5, "font-size": 12}, `0b${b} = 0x${r.ballot.toString(16).toUpperCase().padStart(2, "0")}`);
  if (s.k >= 1) el("text", {x: x0 + NL * cw + 10, y: ys[1] + 5, "font-size": 12}, "leader = " + r.leader);
  if (s.k >= 2 && r.ballot) { const lx = x0 + r.leader * cw + cw / 2;
    el("rect", {x: lx - 26, y: ys[2] - 17, width: 200, height: 34, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 3});
    el("text", {x: lx + 74, y: ys[2] + 5, "text-anchor": "middle", "font-size": 12}, `atomicAdd(counter, ${popc(r.ballot)})`);
    el("text", {x: x0 + NL * cw + 10, y: ys[2] + 5, "font-size": 12}, `counter ${C0} → ${r.counter}`); }
  el("text", {x: 10, y: 318, "font-size": 11, fill: css("--muted")}, "kattintás egy körre: a sáv predikátumának átbillentése · 8 sávos szemléltetés (a valós kódban 32 sáv)");
}
function setC0(){ const v = parseInt(document.getElementById("c0").value, 10); if (Number.isFinite(v)) { C0 = v; setSteps(gen()); } }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
