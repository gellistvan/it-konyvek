<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lekérdezésen alapuló hangolás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl2:#c55a11;--cell:#fff;--dia:#eee;--db:#d9d9d9;--line:#000;--off:#aaa}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl2:#f0a060;--cell:#262626;--dia:#333;--db:#444;--line:#ddd;--off:#666}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input[type=number]{width:5em;font:inherit}
select{font:inherit}
#status{margin:4px 0 6px;min-height:3em;font-weight:bold}
svg{width:100%;max-width:640px;height:auto;display:block;margin:auto}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Eszközprofil">
  <label>Profil: <select id="pr"><option value="nv">NVIDIA RTX 4060 Ti: 48 KiB, subgroup nincs</option><option value="intel">Intel iGPU (példa): 64 KiB, subgroup van</option><option value="emb">beágyazott GPU (példa): 16 KiB, subgroup nincs</option><option value="own">saját értékek</option></select></label>
  <label>local mem (KiB): <input id="lm" type="number" min="0" max="1024"></label>
  <label><input id="sg" type="checkbox"> cl_khr_subgroups</label>
  <label>OpenCL: <select id="ver"><option>1.2</option><option>2.0</option><option>2.1</option><option>2.2</option><option>3.0</option></select></label>
  <label>kernelkorlát (WG): <input id="km" type="number" min="1" max="4096"></label>
  <label>kívánt WG: <input id="wa" type="number" min="1" max="4096"></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="-30 -10 640 900" role="img" aria-label="Folyamatábra az eszközlekérdezéstől a csempeméret-, redukcióváltozat- és work-group-méret-választáson át a mérésig és a kalibrációs adatbázisig."></svg>
<p class="small">A küszöbök a 30.3.4 két csempés (A+B, FP32) számításából: 64×64 → 32 KiB, 32×32 → 8 KiB. OpenCL 3.0-ban a subgroup opcionális képesség: le kell kérdezni (itt a kiterjesztés-jelző dönt). A profilértékek szemléltetők, nem mérések.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
const NODES = {"query": {"k": "rect", "x": 0.3, "y": 0.2, "w": 11.4, "h": 2.7, "t": "Query: clGetDeviceInfo / clGetKernelWorkGroupInfo", "sub": ["CL_DEVICE_TYPE, CL_DEVICE_LOCAL_MEM_SIZE,", "CL_DEVICE_EXTENSIONS, CL_DEVICE_VERSION,", "CL_KERNEL_WORK_GROUP_SIZE,", "CL_KERNEL_PREFERRED_WORK_GROUP_SIZE_MULTIPLE"]}, "d1": {"k": "dia", "x": 0.6, "y": 3.5, "w": 5.4, "h": 1.7, "t": "local_mem ≥ 32 KiB?"}, "t64": {"k": "rect", "x": 7.6, "y": 3.85, "w": 3.8, "h": 1.0, "t": "64×64 csempe"}, "d2": {"k": "dia", "x": 0.6, "y": 5.8, "w": 5.4, "h": 1.7, "t": "local_mem ≥ 8 KiB?"}, "t32": {"k": "rect", "x": 7.6, "y": 6.15, "w": 3.8, "h": 1.0, "t": "32×32 csempe"}, "t16": {"k": "rect", "x": 7.6, "y": 7.75, "w": 3.8, "h": 1.0, "t": "16×16 / nem tiled"}, "d3": {"k": "dia", "x": 2.9, "y": 9.2, "w": 6.2, "h": 2.0, "t": "cl_khr_subgroups\nvagy OpenCL 2.1+?*"}, "rsub": {"k": "rect", "x": 7.2, "y": 11.55, "w": 4.4, "h": 1.0, "t": "subgroup-redukció"}, "rwg": {"k": "rect", "x": 0.4, "y": 11.55, "w": 4.4, "h": 1.0, "t": "work-group-redukció"}, "wg": {"k": "rect", "x": 0.4, "y": 13.05, "w": 11.2, "h": 1.25, "t": "WG = min(kívánt, CL_KERNEL_WORK_GROUP_SIZE),\nlefelé 2-hatványra"}, "exe": {"k": "rect", "x": 1.4, "y": 14.75, "w": 9.2, "h": 1.0, "t": "Execute: 5 warm-up + 20 mért futás, medián"}, "db": {"k": "cyl", "x": 3.0, "y": 16.25, "w": 6.0, "h": 1.9, "t": "kalibrációs adatbázis\n(eszköz + driver kulcs)"}}, EDGES = [["query", "b", "d1", "t", ""], ["d1", "r", "t64", "l", "igen"], ["d1", "b", "d2", "t", "nem"], ["d2", "r", "t32", "l", "igen"], ["d2", "b", "t16", "l", "nem"], ["t64", "bus", "d3", "r", ""], ["t32", "bus", "d3", "r", ""], ["t16", "bus", "d3", "r", ""], ["d3", "r", "rsub", "t", "igen"], ["d3", "l", "rwg", "t", "nem"], ["rsub", "b", "wg", "t", ""], ["rwg", "b", "wg", "t", ""], ["wg", "b", "exe", "t", ""], ["exe", "b", "db", "t", ""]], PROF = {"nv": {"name": "NVIDIA RTX 4060 Ti", "local": 48, "sub": false, "ver": 3.0, "kmax": 1024, "want": 256}, "intel": {"name": "Intel iGPU (példa)", "local": 64, "sub": true, "ver": 3.0, "kmax": 256, "want": 256}, "emb": {"name": "beágyazott GPU (példa)", "local": 16, "sub": false, "ver": 1.2, "kmax": 192, "want": 256}}, TILE = {"t64": "64×64", "t32": "32×32", "t16": "16×16 / nem tiled"}, RED = {"rsub": "subgroup-redukció", "rwg": "work-group-redukció"}, S = 50;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;svg.appendChild(e);return e;}
const $ = id => document.getElementById(id);
function cen(n){ const d = NODES[n]; return [(d.x + d.w / 2) * S, (d.y + d.h / 2) * S]; }
function side(n, s){ const d = NODES[n], [x, y] = cen(n); return {t: [x, d.y * S], b: [x, (d.y + d.h) * S], l: [d.x * S, y], r: [(d.x + d.w) * S, y], bus: [(d.x + d.w) * S, y]}[s]; }
function decide(p){
  const t = p.local >= 32 ? "t64" : (p.local >= 8 ? "t32" : "t16");
  const r = (p.sub || (p.ver >= 2.1 && p.ver < 3.0)) ? "rsub" : "rwg";
  let w = Math.min(p.want, p.kmax), q = 1; while (q * 2 <= w) q *= 2;
  return {nodes: ["query", "d1"].concat(t === "t64" ? ["t64"] : ["d2", t]).concat(["d3", r, "wg", "exe", "db"]), t, r, wg: q};
}
function cur(){ return {local: +$("lm").value, sub: $("sg").checked, ver: +$("ver").value, kmax: Math.max(1, +$("km").value), want: Math.max(1, +$("wa").value)}; }
function load(k){ const p = PROF[k]; $("lm").value = p.local; $("sg").checked = p.sub; $("ver").value = p.ver.toFixed(1); $("km").value = p.kmax; $("wa").value = p.want; }
function draw(){
  const p = cur(), res = decide(p), on = new Set(res.nodes);
  const L = css("--line"), A = css("--hl2"), OFF = css("--off");
  svg.innerHTML = '<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="' + L + '"/></marker><marker id="ahA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="' + A + '"/></marker></defs>';
  EDGES.forEach(([a, sa, b, sb, lab]) => {
    const act = on.has(a) && on.has(b), [x0, y0] = side(a, sa), [x1, y1] = side(b, sb);
    const st = {stroke: act ? A : OFF, "stroke-width": act ? 3.5 : 1.3, fill: "none", "marker-end": act ? "url(#ahA)" : "url(#ah)"};
    if (sa === "bus") { const [xa, ya] = side(a, "r"); mk("path", Object.assign({d: "M" + xa + "," + ya + " L" + 11.9 * S + "," + ya + " L" + 11.9 * S + "," + y1 + " L" + x1 + "," + y1}, st)); }
    else if (sa === "b" && sb === "l") mk("path", Object.assign({d: "M" + x0 + "," + y0 + " L" + x0 + "," + y1 + " L" + x1 + "," + y1}, st));
    else mk("line", Object.assign({x1: x0, y1: y0, x2: x1, y2: y1}, st));
    if (lab) mk("text", {x: (sa === "b" && sb === "l" ? x0 : (x0 + x1) / 2) + 6, y: (y0 + y1) / 2 - 4, "font-size": 13, "font-style": "italic"}, lab);
  });
  Object.entries(NODES).forEach(([n, d]) => {
    const act = on.has(n), x = d.x * S, y = d.y * S, w = d.w * S, h = d.h * S, [cx, cy] = cen(n);
    const sty = {stroke: act ? A : L, "stroke-width": act ? 3.5 : 1.2};
    if (d.k === "rect") mk("rect", Object.assign({x, y, width: w, height: h, rx: 6, fill: css("--cell")}, sty));
    else if (d.k === "dia") mk("polygon", Object.assign({points: [x, cy, cx, y, x + w, cy, cx, y + h].join(","), fill: css("--dia")}, sty));
    else { mk("rect", Object.assign({x, y: y + 12, width: w, height: h - 24, fill: css("--db")}, sty)); mk("ellipse", Object.assign({cx, cy: y + 12, rx: w / 2, ry: 12, fill: css("--db")}, sty)); }
    if (n === "query") {
      mk("text", {x: cx, y: y + 24, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, d.t);
      d.sub.forEach((s, i) => mk("text", {x: x + 14, y: y + 50 + i * 20, "font-size": 12, "font-family": "monospace"}, s));
    } else d.t.split("\n").forEach((s, i, a) => mk("text", {x: cx, y: cy + 5 + (i - (a.length - 1) / 2) * 17 + (d.k === "cyl" ? 6 : 0), "text-anchor": "middle", "font-size": 13}, s));
  });
  const [xq, yq] = side("query", "l"), [xd, yd] = side("db", "l");
  mk("path", {d: "M" + xd + "," + yd + " L-18," + yd + " L-18," + yq + " L" + xq + "," + yq, fill: "none", stroke: L, "stroke-width": 1.5, "stroke-dasharray": "6 4", "marker-end": "url(#ah)"});
  svg.setAttribute("viewBox", "-30 -10 640 " + (NODES.db.y + NODES.db.h + 0.6) * S);
  $("status").textContent = "Választott konfiguráció: " + TILE[res.t] + " csempe (local mem " + p.local + " KiB), " + RED[res.r] +
    " (" + (p.sub ? "cl_khr_subgroups van" : (p.ver >= 2.1 && p.ver < 3.0 ? "OpenCL " + p.ver.toFixed(1) + " core subgroup" : "nincs subgroup")) + "), WG = min(" + p.want + ", " + p.kmax + ") lefelé 2-hatványra = " + res.wg + "; majd 5 warm-up + 20 mért futás (medián), eredmény a kalibrációs adatbázisba.";
}
$("pr").addEventListener("change", () => { if ($("pr").value !== "own") load($("pr").value); draw(); });
["lm", "km", "wa"].forEach(id => $(id).addEventListener("input", () => { $("pr").value = "own"; draw(); }));
["sg", "ver"].forEach(id => $(id).addEventListener("change", () => { $("pr").value = "own"; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
load("nv"); draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
