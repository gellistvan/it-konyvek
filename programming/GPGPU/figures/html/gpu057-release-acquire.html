<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release/acquire és scope</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>rendezés: <select id="md" onchange="rebuild()" aria-label="Rendezési mód"><option value="none" selected>fence nélkül</option><option value="pfence">csak producer fence</option><option value="both">mindkét oldali fence</option><option value="relacq">release/acquire</option></select></label><label>scope: <select id="sc" onchange="rebuild()" aria-label="Scope"><option value="block">block</option><option value="device" selected>device</option><option value="system">system</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalon a block, device és system scope egymásba ágyazott keretei; jobb oldalon két idővonal, fence nélkül a consumer a régi adatot láthatja, release/acquire-ral a 42-t."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A modell szerint megengedett viselkedés (cc ≥ 7.0 PTX memóriamodell), a gyakorlatban ritkán figyelhető meg. A producer és a consumer ugyanazon GPU két különböző blokkjában fut; a kimenethalmazt a négy esemény összes megengedett sorrendjének felsorolása adja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. a producer flag = 1 írása láthatóvá válik. Mód: fence nélkül, scope: device. Lehetséges kimenetek (flag == 1 mellett): {0, 42}.", "line": 1, "order": ["P2"], "mode": "none", "scope": "device", "out": [0, 42], "flag": null, "data": null}, {"msg": "2. a consumer olvassa a flaget: flag = 1. Mód: fence nélkül, scope: device. Lehetséges kimenetek (flag == 1 mellett): {0, 42}.", "line": 2, "order": ["P2", "C1"], "mode": "none", "scope": "device", "out": [0, 42], "flag": 1, "data": null}, {"msg": "3. a consumer olvassa a datát: data = 0. Mód: fence nélkül, scope: device. Lehetséges kimenetek (flag == 1 mellett): {0, 42}.", "line": 3, "order": ["P2", "C1", "C2"], "mode": "none", "scope": "device", "out": [0, 42], "flag": 1, "data": 0}, {"msg": "4. a producer data = 42 írása láthatóvá válik. Mód: fence nélkül, scope: device. Lehetséges kimenetek (flag == 1 mellett): {0, 42}.", "line": 0, "order": ["P2", "C1", "C2", "P1"], "mode": "none", "scope": "device", "out": [0, 42], "flag": 1, "data": 0}];
const CODE = ["data = 42;                               // producer (blokk 0)", "flag = 1;          // fence: __threadfence() előtte | release: flag.store(1, memory_order_release)", "while (flag != 1) {}                     // consumer (blokk 1) | acquire: flag.load(memory_order_acquire)", "int result = data; // fence: __threadfence() előtte"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MODES = {none: [false, false], pfence: [true, false], both: [true, true], relacq: [true, true]};
const SOK = {block: false, device: true, system: true};
const MN = {none: "fence nélkül", pfence: "csak producer fence", both: "mindkét oldali fence", relacq: "release/acquire"};
function perms(a){ if (a.length <= 1) return [a]; const o = []; a.forEach((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).forEach(p => o.push([x].concat(p)))); return o; }
function outcomes(mode, scope){
  let [po, co] = MODES[mode]; if (!SOK[scope]) { po = false; co = false; }
  const res = new Set();
  perms(["P1", "P2", "C1", "C2"]).forEach(p => { const q = e => p.indexOf(e);
    if (po && q("P1") > q("P2")) return; if (co && q("C1") > q("C2")) return;
    const flag = q("P2") < q("C1") ? 1 : 0, data = q("P1") < q("C2") ? 42 : 0; if (flag === 1) res.add(data); });
  return [...res].sort((a, b) => a - b);
}
function stepsFor(mode, scope){
  const [po, co] = MODES[mode], ok = SOK[scope], os = outcomes(mode, scope), bad = !(os.length === 1 && os[0] === 42);
  let order = bad ? ["P2", "C1", "C2", "P1"] : ["P1", "P2", "C1", "C2"];
  if (bad && po && ok) order = ["C2", "P1", "P2", "C1"];
  const T = {P1: "a producer data = 42 írása láthatóvá válik", P2: "a producer flag = 1 írása láthatóvá válik" + (mode === "relacq" ? " (release)" : ""),
             C1: "a consumer olvassa a flaget" + (mode === "relacq" ? " (acquire)" : ""), C2: "a consumer olvassa a datát"};
  const seen = new Set(), out = []; let flag = null, data = null;
  order.forEach((e, n) => {
    seen.add(e);
    if (e === "C1") flag = seen.has("P2") ? 1 : 0;
    if (e === "C2") data = seen.has("P1") ? 42 : 0;
    let msg = (n + 1) + ". " + T[e];
    if (e === "C1") msg += ": flag = " + flag;
    if (e === "C2") msg += ": data = " + data;
    msg += ". Mód: " + MN[mode] + ", scope: " + scope + ((ok || mode === "none") ? "" : " (a két szál különböző blokkban van: block scope nem elég)") + ". Lehetséges kimenetek (flag == 1 mellett): {" + os.join(", ") + "}.";
    out.push({msg: msg, line: {P1: 0, P2: 1, C1: 2, C2: 3}[e], order: order.slice(0, n + 1), mode: mode, scope: scope, out: os, flag: flag, data: data});
  });
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  // scope-keretek (bal)
  const sc = s.scope;
  el("rect", {x: 6, y: 20, width: 210, height: 250, rx: 8, fill: "none", stroke: sc === "system" ? h2 : ln, "stroke-width": sc === "system" ? 3 : 1.2});
  el("text", {x: 14, y: 38, "font-size": 11}, "system: __threadfence_system()");
  el("rect", {x: 16, y: 50, width: 150, height: 200, rx: 8, fill: "none", stroke: sc === "device" ? h2 : ln, "stroke-width": sc === "device" ? 3 : 1.2, "stroke-dasharray": "6 3"});
  el("text", {x: 22, y: 68, "font-size": 11}, "device: __threadfence()");
  [["blokk 0: P", 26], ["blokk 1: C", 96]].forEach(([nm, x]) => {
    el("rect", {x: x, y: 120, width: 62, height: 110, rx: 6, fill: ch_, stroke: sc === "block" ? h2 : ln, "stroke-width": sc === "block" ? 3 : 1, "stroke-dasharray": "2 2"});
    el("text", {x: x + 4, y: 138, "font-size": 10}, nm);
  });
  el("text", {x: 26, y: 112, "font-size": 10}, "block: __threadfence_block()");
  el("rect", {x: 172, y: 170, width: 38, height: 60, rx: 5, fill: cl, stroke: ln});
  el("text", {x: 191, y: 204, "text-anchor": "middle", "font-size": 9}, "host");
  // idővonalak (jobb)
  const X0 = 300, X1 = 590, py = 90, cy = 200;
  el("text", {x: 230, y: py + 4, "font-size": 12}, "producer"); el("text", {x: 230, y: cy + 4, "font-size": 12}, "consumer");
  el("line", {x1: X0, x2: X1, y1: py, y2: py, stroke: ln}); el("line", {x1: X0, x2: X1, y1: cy, y2: cy, stroke: ln});
  const L = {P1: "data = 42", P2: s.mode === "relacq" ? "flag.store(1, rel)" : "flag = 1", C1: s.mode === "relacq" ? "flag.load(acq)" : "flag ?", C2: "data ?"};
  s.order.forEach((e, n) => {
    const x = X0 + 30 + n * 70, onP = e[0] === "P", y = onP ? py : cy;
    el("circle", {cx: x, cy: y, r: 6, fill: n === s.order.length - 1 ? h2 : ln});
    let t = L[e]; if (e === "C1") t = "flag → " + s.flag; if (e === "C2") t = "data → " + s.data;
    el("text", {x: x, y: onP ? y - 14 : y + 22, "text-anchor": "middle", "font-size": 11}, t);
  });
  const iP2 = s.order.indexOf("P2"), iC1 = s.order.indexOf("C1");
  if (iP2 >= 0 && iC1 >= 0){
    const ord = MODES[s.mode][0] && MODES[s.mode][1] && SOK[s.scope];
    el("line", {x1: X0 + 30 + iP2 * 70, y1: py + 6, x2: X0 + 30 + iC1 * 70, y2: cy - 6, stroke: ord ? hl : mu, "stroke-width": ord ? 3.5 : 1.5, "stroke-dasharray": ord ? "none" : "5 3"});
    if (ord) el("text", {x: X0 + 34 + (iP2 + iC1) * 35, y: (py + cy) / 2, "font-size": 10, fill: hl}, "synchronizes-with");
  }
  if (s.data !== null){
    const good = s.data === 42;
    el("text", {x: X0, y: 260, "font-size": 15, "font-weight": "bold", fill: good ? hl : h2}, good ? "✓ result = 42" : "X result = 0 (régi érték)");
  }
  el("text", {x: X0 - 70, y: 288, "font-size": 12}, "lehetséges kimenetek (flag == 1 mellett): {" + s.out.join(", ") + "}");
}
function rebuild(){ setSteps(stepsFor(document.getElementById("md").value, document.getElementById("sc").value)); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
