<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGD-pálya</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>B <input id="lb" type="range" min="0" max="10" value="0" oninput="TR=null;show(k)" style="width:110px" aria-label="Batch-méret (2 hatványai)"> <span id="lbv">1</span></label> <label>η <input id="eta" type="range" min="1" max="100" value="10" oninput="TR=null;show(k)" style="width:110px"> <span id="etav">0,10</span></label> <label>ütemezés <select id="sch" onchange="TR=null;show(k)"><option value="c">konstans</option><option value="t">η·50/(t+50) (1/t)</option><option value="s">η·√(50/(t+50)) (1/√t)</option></select></label> <label>seed <input id="sd" type="number" value="1" min="1" max="99999" onchange="TR=null;show(k)" style="width:70px"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a w paraméter pályája lépésenként a w* = 3 vonallal, alul a hiba log skálán; konstans lépésköznél a stacionárius szórás elméleti sávja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A labor modellje: y = 3x + 0,5 + ε, x ~ U(−1, 1), ε ~ U(−0,05; 0,05), b = 0,5 rögzített, g = −2(y − ŷ)x (½ szorzó nélkül). FP64 JavaScript, seedelhető generátor (mulberry32). Az η·50/(t+50) ütemezés η = 0,1-nél a statikus ábra (d) görbéje: 5/(t + 50).</p>

const CODE = ["for (t = 0; t < T; ++t) {", "    minta B darab (x, ε);  ĝ = mean(−2 (y − ŷ) x)    // ŷ = w x + 0,5", "    η_t = ütemezés(t);  w = w − η_t ĝ;", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let TR = null;
function gv(id){ return +document.getElementById(id).value; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function cfg(){ return {B: Math.round(Math.pow(2, gv("lb"))), eta: gv("eta") / 100, sch: document.getElementById("sch").value, seed: gv("sd")}; }
function etaT(c, t){ return c.sch === "c" ? c.eta : c.sch === "t" ? c.eta * 50 / (t + 50) : c.eta * Math.sqrt(50 / (t + 50)); }
function sim(c){
  const u = mulberry(c.seed), ws = [0], gs = [0]; let w = 0;
  for (let t = 0; t < 200; t++) { let s = 0;
    for (let i = 0; i < c.B; i++) { const x = 2*u() - 1, e = 0.1*u() - 0.05, y = 3*x + 0.5 + e, yh = w*x + 0.5; s += -2*(y - yh)*x; }
    const g = s / c.B; w -= etaT(c, t) * g; ws.push(w); gs.push(g); }
  return {c, ws, gs};
}
function sd(c){ if (c.sch !== "c") return null; const a = 4*c.eta/3 - 4*c.eta*c.eta*(1/9 + 4/(45*c.B)); return a > 0 ? Math.sqrt(4*c.eta*c.eta*(0.01/12)/(3*c.B)/a) : null; }
function ensure(){ const c = cfg(), key = JSON.stringify(c); if (!TR || TR.key !== key) { TR = sim(c); TR.key = key; } }
function f(v, d){ return v.toFixed(d).replace(".", ",").replace("-", "−"); }
function render(s){
  ensure(); svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 420");
  const c = TR.c; document.getElementById("lbv").textContent = c.B; document.getElementById("etav").textContent = f(c.eta, 2);
  const X0 = 70, X1 = 690, xs = t => X0 + t / 200 * (X1 - X0), ymax = Math.max(3.3, ...TR.ws.map(Math.abs)), ys = v => 190 - (v + 0.1) / (ymax + 0.1) * 170;
  el("line", {x1: X0, y1: ys(3), x2: X1, y2: ys(3), stroke: css("--muted")}); el("text", {x: X1 + 4, y: ys(3) + 4, "font-size": 11}, "w* = 3");
  const S = sd(c);
  let d = ""; for (let q = 0; q <= s.t; q++) d += (q ? " L " : "M ") + xs(q).toFixed(1) + " " + ys(TR.ws[q]).toFixed(1);
  el("path", {d, fill: "none", stroke: css("--fg"), "stroke-width": 1.5});
  el("text", {x: 10, y: 18, "font-size": 12}, "w_t");
  [0, 1, 2, 3].forEach(v => el("text", {x: X0 - 6, y: ys(v) + 4, "text-anchor": "end", "font-size": 10}, String(v)));
  // log hiba
  const Y0 = 230, Y1 = 390, lo = -6, hi = 1, yl = v => Y1 - (Math.log10(Math.max(v, 1e-6)) - lo) / (hi - lo) * (Y1 - Y0);
  el("text", {x: 10, y: Y0 - 6, "font-size": 12}, "|w_t − w*| (log)");
  [-6, -4, -2, 0].forEach(e => { el("line", {x1: X0, y1: yl(Math.pow(10, e)), x2: X1, y2: yl(Math.pow(10, e)), stroke: css("--cellhl"), "stroke-width": 0.6});
    el("text", {x: X0 - 6, y: yl(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 10}, "10^" + e); });
  if (S) { el("rect", {x: X0, y: yl(1.96*S), width: X1 - X0, height: Y1 - yl(1.96*S), fill: css("--cellhl"), opacity: 0.5});
    el("text", {x: X1 - 4, y: yl(1.96*S) - 4, "text-anchor": "end", "font-size": 10, fill: css("--muted")}, "elméleti stacionárius sáv: 1,96·sd = " + f(1.96*S, 4)); }
  let d2 = ""; for (let q = 0; q <= s.t; q++) d2 += (q ? " L " : "M ") + xs(q).toFixed(1) + " " + yl(Math.abs(TR.ws[q] - 3)).toFixed(1);
  el("path", {d: d2, fill: "none", stroke: css("--fg"), "stroke-width": 1.2});
  [0, 50, 100, 150, 200].forEach(tt => el("text", {x: xs(tt), y: Y1 + 16, "text-anchor": "middle", "font-size": 10}, String(tt)));
  el("text", {x: (X0 + X1)/2, y: Y1 + 30, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "lépés t");
  status.textContent = s.t === 0 ? `t = 0: w = 0; B = ${c.B}, η = ${f(c.eta, 2)}, ütemezés: ${c.sch === "c" ? "konstans" : c.sch === "t" ? "η·50/(t+50)" : "η·√(50/(t+50))"}` :
    `t = ${s.t}, ĝ = ${f(TR.gs[s.t], 4)}, η_t = ${f(etaT(c, s.t - 1), 4)}, w = ${f(TR.ws[s.t], 5)}, |w − w*| = ${Math.abs(TR.ws[s.t] - 3).toExponential(2).replace(".", ",")}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 60);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
