<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIG-felosztás A100 40 GB-on</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--cell:#fff;--used:#cfcfcf;--line:#000;--bad:#c00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--cell:#262626;--used:#555;--line:#ddd;--bad:#ff7070}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg)}#status{min-height:2.9em;margin:4px 0}.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl"><label>Profil: <select id="prof"></select></label><button id="add">Hozzáadás</button>
<button id="undo">Utolsó törlése</button><button id="ex">Példa: 3g.20gb, 3g.20gb</button><button id="clr">Üres GPU</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Az A100 7 számítási és 8 memóriaszelete, a létrehozott GPU instance-ek keretével"></svg>
<p class="small">Egyszerűsített, darabszám-alapú modell (A100 40 GB, profilok a MIG User Guide szerint; driverfüggő). A valós
elhelyezési szabályok (<code>nvidia-smi mig -lgipp</code>) szigorúbbak: nem minden kombináció hozható létre, ami darabra kijönne.</p>
<script>
const P={"1g.5gb": [1, 1], "2g.10gb": [2, 2], "3g.20gb": [3, 4], "4g.20gb": [4, 4], "7g.40gb": [7, 8]}, NC=7, NM=8;
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function cs(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const sel=document.getElementById("prof");
for(const n in P){const o=document.createElement("option");o.value=n;o.textContent=`${n} (${P[n][0]} számítási, ${P[n][1]} memóriaszelet)`;sel.appendChild(o);}
sel.value="3g.20gb";
let gis=[], msg="";
function alloc(){let c=0,m=0;return gis.map(n=>{const r={n,c0:c,c:P[n][0],m0:m,m:P[n][1]};c+=r.c;m+=r.m;return r;});}
function draw(){
  svg.innerHTML="";const L=cs("--line"),W=560,x0=40,cw=W/NC,mw=W/NM;
  const A=alloc(), uc=A.reduce((s,r)=>s+r.c,0), um=A.reduce((s,r)=>s+r.m,0);
  el("text",{x:320,y:18,"text-anchor":"middle","font-weight":"bold"},"A100 40 GB – számítási szeletek (felül) és memóriaszeletek 5 GB + L2 (alul)");
  for(let i=0;i<NC;i++){const u=i<uc;el("rect",{x:x0+i*cw+3,y:40,width:cw-6,height:60,fill:u?cs("--used"):cs("--cell"),stroke:L,"stroke-dasharray":u?"":"2 3"});el("text",{x:x0+i*cw+cw/2,y:75,"text-anchor":"middle"},"C"+i);}
  for(let j=0;j<NM;j++){const u=j<um;el("rect",{x:x0+j*mw+3,y:190,width:mw-6,height:50,fill:u?cs("--used"):cs("--cell"),stroke:L,"stroke-dasharray":u?"":"2 3"});el("text",{x:x0+j*mw+mw/2,y:220,"text-anchor":"middle"},"M"+j);}
  A.forEach((r,k)=>{const xa=x0+Math.min(r.c0*cw,r.m0*mw),xb=x0+Math.max((r.c0+r.c)*cw,(r.m0+r.m)*mw);
    const e=3,ca=x0+r.c0*cw+e,cb=x0+(r.c0+r.c)*cw-e,ma=x0+r.m0*mw+e,mb=x0+(r.m0+r.m)*mw-e;
    el("polygon",{points:`${ca},32 ${cb},32 ${cb},145 ${mb},145 ${mb},248 ${ma},248 ${ma},145 ${ca},145`,fill:"none",stroke:L,"stroke-width":3});
    el("text",{x:(ca+cb)/2,y:125,"text-anchor":"middle","font-weight":"bold"},"GI "+k+": "+r.n);
    el("text",{x:(ma+mb)/2,y:170,"text-anchor":"middle","font-size":12},`${r.c} szám. + ${r.m} mem.`);});
  el("text",{x:320,y:272,"text-anchor":"middle"},`Foglalt: ${uc}/${NC} számítási, ${um}/${NM} memóriaszelet (${um*5}/40 GB)`);
  if(msg) el("text",{x:320,y:292,"text-anchor":"middle",fill:cs("--bad"),"font-weight":"bold"},msg);
  document.getElementById("status").textContent=(msg?msg+" ":"")+`${gis.length} GPU instance: ${gis.join(", ")||"–"}; szabad: ${NC-uc} számítási, ${NM-um} memóriaszelet.`;
}
document.getElementById("add").onclick=()=>{const n=sel.value,A=alloc(),uc=A.reduce((s,r)=>s+r.c,0),um=A.reduce((s,r)=>s+r.m,0);
  const nc=uc+P[n][0]>NC, nm=um+P[n][1]>NM;
  if(nc||nm){msg=`A(z) ${n} nem fér el: nincs elég ${nc&&nm?"számítási és memória":nc?"számítási":"memória"} szelet.`;}
  else{gis.push(n);msg="";}
  draw();};
document.getElementById("undo").onclick=()=>{gis.pop();msg="";draw();};
document.getElementById("ex").onclick=()=>{gis=["3g.20gb","3g.20gb"];msg="";draw();};
document.getElementById("clr").onclick=()=>{gis=[];msg="";draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
gis=["3g.20gb","3g.20gb"];draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
