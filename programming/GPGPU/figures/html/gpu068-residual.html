<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacobi és red-black GS konvergenciája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:6px}input[type=range]{width:170px}
#status{margin:4px 0 6px;min-height:2.9em}svg{width:100%;height:auto;display:block}svg text:not([fill]){fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl">
<label>n: <input id="n" type="range" min="5" max="10" value="7" aria-label="Rácsméret n, kettes kitevő"> <b id="nv">128</b></label>
<label>tol: <input id="tol" type="range" min="3" max="10" value="6" aria-label="Tolerancia kitevője"> <b id="tv">10^−6</b></label>
<label>görbe: <select id="m" aria-label="Megjelenített módszer"><option value="b">mindkettő</option><option value="j">Jacobi</option><option value="g">red-black GS</option></select></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 320" role="img" aria-label="Relatív reziduál logaritmikus skálán az iterációszám függvényében"></svg>
<p class="small">Elméleti modell, nem mérés (18.3.7): ρ_J = cos(π/(n + 1)), ρ_GS = ρ_J², k = ln(tol)/ln ρ; a labor 50 iterációnként
ellenőriz. Kezdőállapot: n = 128, tol = 10^−6 (a statikus ábra).</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(t, a, x){ const e = document.createElementNS(NS, t); for (const q in a) e.setAttribute(q, a[q]); if (x !== undefined) e.textContent = x; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
const fmt = x => Math.round(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function draw(){
  const n = 2 ** +document.getElementById("n").value, te = +document.getElementById("tol").value, tol = 10 ** -te, m = document.getElementById("m").value;
  document.getElementById("nv").textContent = n; document.getElementById("tv").textContent = "10^−" + te;
  const rj = Math.cos(Math.PI / (n + 1)), kj = Math.log(tol) / Math.log(rj), kg = kj / 2;
  const xmax = (m === "g" ? kg : kj) * 1.25, ymin = -Math.max(te + 2, 8);
  const x0 = 70, x1 = 620, y0 = 20, y1 = 280, X = k => x0 + (x1 - x0) * k / xmax, Y = lg => y0 + (y1 - y0) * (0 - lg) / (0 - ymin);
  svg.innerHTML = "";
  el("line", {x1: x0, y1: y1, x2: x1, y2: y1, stroke: css("--line")}); el("line", {x1: x0, y1: y0, x2: x0, y2: y1, stroke: css("--line")});
  for (let e = 0; e >= ymin; e -= 2) el("text", {x: x0 - 6, y: Y(e) + 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "10^" + (e === 0 ? "0" : "−" + (-e)));
  for (let i = 0; i <= 4; i++) el("text", {x: X(xmax * i / 4), y: y1 + 16, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, fmt(xmax * i / 4));
  el("text", {x: x1, y: y1 + 34, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "iterációszám k");
  el("line", {x1: x0, y1: Y(-te), x2: x1, y2: Y(-te), stroke: css("--muted"), "stroke-dasharray": "6 3"});
  el("text", {x: x1 - 4, y: Y(-te) - 4, "text-anchor": "end", "font-size": 11, fill: css("--muted")}, "tol");
  const curve = (r, dash, col) => { let d = ""; for (let i = 0; i <= 200; i++) { const k = xmax * i / 200, lg = k * Math.log10(r);
      if (lg < ymin) break; d += (i ? "L" : "M") + X(k).toFixed(1) + "," + Y(lg).toFixed(1); }
    el("path", {d, fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": dash}); };
  if (m !== "g") { curve(rj, "none", css("--hl")); el("circle", {cx: X(kj), cy: Y(-te), r: 5, fill: css("--hl")}); }
  if (m !== "j") { curve(rj * rj, "7 4", css("--hl2")); el("circle", {cx: X(kg), cy: Y(-te), r: 5, fill: css("--hl2")}); }
  const stop = k => Math.ceil(k / 50) * 50;
  document.getElementById("status").textContent =
    `n = ${n} (h = 1/${n + 1}), ρ_J = ${rj.toFixed(6).replace(".", ",")}: Jacobi ≈ ${fmt(kj)} iteráció (leállás ${fmt(stop(kj))}), ` +
    `red-black GS ≈ ${fmt(kg)} iteráció (leállás ${fmt(stop(kg))}) a tol = 10^−${te} eléréséig.`;
}
["n", "tol", "m"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
