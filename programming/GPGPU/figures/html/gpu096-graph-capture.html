<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream capture, DAG és gráfindítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" onchange="SKIP=this.checked;setSteps(SKIP ? BAD : GOOD)"> a 9. sor (join cudaStreamWaitEvent) kihagyása</label><label>kernelek száma: <input type="range" min="10" max="1000" step="10" value="1000" aria-label="Kernelek száma" oninput="NK=+this.value;document.getElementById('nk').textContent=NK;render(STEPS[k])"> <span id="nk">1000</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A fork/join vázlat soronként: a capture során kernelA, kernelB és kernelC csomópont jön létre, két él indul a kernelA-ból; a join kihagyásakor az EndCapture unjoined hibát ad. Alul a gráf életciklusa és a stream- és gráfindítás idővonala."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">CUDA 12.x, cudaStreamCaptureModeGlobal. Az idővonal elméleti modell illusztratív egységekkel (kernel 1, indításonkénti CPU-kiadás 1,6, gráfindítás 6, csomópontok közti rés 0,15), nem mérés; a labor mért értékeit a napló adja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ln": 1, "line": 1, "nodes": [], "edges": [], "err": null, "msg": "2. sor: Capture indul az s0-on: a műveletek nem futnak, hanem csomóponttá válnak."}, {"ln": 2, "line": 2, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "3. sor: kernelA: új kernelcsomópont, nincs bejövő él"}, {"ln": 3, "line": 3, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "4. sor: forkEv rögzítése az s0-en: az esemény a frontier-t (kernelA) jegyzi meg (nem csomópont)."}, {"ln": 4, "line": 4, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "5. sor: s1 vár a forkEv-re: az s1 bekerül a capture-be (fork); a következő s1-művelet függ ettől: kernelA."}, {"ln": 5, "line": 5, "nodes": ["kernelA", "kernelB"], "edges": [["kernelA", "kernelB"]], "err": null, "msg": "6. sor: kernelB: új kernelcsomópont, élek: kernelA → kernelB"}, {"ln": 6, "line": 6, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "7. sor: kernelC: új kernelcsomópont, élek: kernelA → kernelC"}, {"ln": 7, "line": 7, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "8. sor: joinEv rögzítése az s1-en: az esemény a frontier-t (kernelB) jegyzi meg (nem csomópont)."}, {"ln": 8, "line": 8, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "9. sor: s0 vár a joinEv-re: join; a következő s0-művelet függ ettől: kernelB."}, {"ln": 9, "line": 9, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "10. sor: cudaStreamEndCapture: kész a cudaGraph_t (3 kernelcsomópont, 2 él)."}];
const CODE = ["// Fork/join: a capture alatt egy második stream bevonása (vázlat; nem fordítva)", "cudaStreamBeginCapture(s0, cudaStreamCaptureModeGlobal);", "kernelA<<<g, b, 0, s0>>>(...);", "cudaEventRecord(forkEv, s0);          // fork: s1 bekerül a capture-be", "cudaStreamWaitEvent(s1, forkEv, 0);", "kernelB<<<g, b, 0, s1>>>(...);        // párhuzamos ág", "kernelC<<<g, b, 0, s0>>>(...);", "cudaEventRecord(joinEv, s1);          // join: s1 visszacsatlakozik s0-ra", "cudaStreamWaitEvent(s0, joinEv, 0);   // a capture vége előtt kötelező", "cudaStreamEndCapture(s0, &graph);"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let NK = 1000, SKIP = false;
const T_K = 1.0, C_L = 1.6, C_G = 6.0, GAP_G = 0.15, LAT = 0.5;
function tl(n){ let t = 0, g = 0; for (let i = 0; i < n; i++) { t += C_L; const st = Math.max(t + LAT, g); g = st + T_K; }
  return {cpuS: t, totS: g, cpuG: C_G, totG: C_G + LAT + n * T_K + (n - 1) * GAP_G}; }
function render(s){
  svg.setAttribute("viewBox", "0 0 780 420"); svg.innerHTML = "";
  // DAG
  const P = {kernelA: [390, 60], kernelB: [300, 160], kernelC: [480, 160]};
  el("text", {x: 290, y: 22, "font-size": 13, "font-weight": "bold"}, "a keletkező DAG");
  (s.edges || []).forEach(([u, v]) => { const [x0, y0] = P[u], [x1, y1] = P[v];
    el("line", {x1: x0, y1: y0 + 18, x2: x1, y2: y1 - 18, stroke: css("--line"), "stroke-width": 1.6, "stroke-dasharray": v === "kernelB" ? "6 4" : ""});
    const ex = x1, ey = y1 - 18, ang = Math.atan2(ey - (y0 + 18), ex - x0), L = 11;
    el("path", {d: `M${ex},${ey} L${ex - L*Math.cos(ang - 0.4)},${ey - L*Math.sin(ang - 0.4)} L${ex - L*Math.cos(ang + 0.4)},${ey - L*Math.sin(ang + 0.4)} Z`, fill: css("--fg")}); });
  (s.nodes || []).forEach(n => { const [x, y] = P[n];
    el("rect", {x: x - 55, y: y - 18, width: 110, height: 36, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.6});
    el("text", {x, y: y + 5, "text-anchor": "middle", "font-size": 13}, n); });
  if (s.err) el("text", {x: 390, y: 230, "text-anchor": "middle", "font-size": 14, fill: css("--hl2"), "font-weight": "bold"}, "HIBA: " + s.err);
  else if (s.ln === 9) el("text", {x: 390, y: 230, "text-anchor": "middle", "font-size": 13}, "cudaGraph_t kész → cudaGraphInstantiate → cudaGraphExec_t → cudaGraphLaunch");
  // életciklus-sáv
  const LC = ["BeginCapture", "rögzítés", "EndCapture", "cudaGraph_t", "Instantiate", "cudaGraphExec_t", "GraphLaunch ×R", "ExecDestroy"];
  const ph = s.ln <= 1 ? 0 : (s.ln < 9 ? 1 : (s.err ? 2 : 3));
  LC.forEach((t, i) => { const x = 10 + i * 96;
    el("rect", {x, y: 250, width: 90, height: 26, fill: i === ph ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": i === ph ? 2.5 : 1});
    el("text", {x: x + 45, y: 267, "text-anchor": "middle", "font-size": 11}, t); });
  // idővonal-modell
  const m = tl(NK), T = Math.max(m.totS, m.totG) * 1.05, X = v => 120 + v / T * 640;
  el("text", {x: 10, y: 305, "font-size": 12, "font-weight": "bold"}, `idővonal ${NK} kernelre (elméleti modell, illusztratív egységek)`);
  [["CPU stream", m.cpuS, 1], ["GPU stream", m.totS, 0], ["CPU gráf", m.cpuG, 1], ["GPU gráf", m.totG, 0]].forEach(([lab, v, cpu], i) => {
    const y = 318 + i * 24; el("text", {x: 10, y: y + 13, "font-size": 12}, lab);
    el("rect", {x: X(0), y, width: X(v) - X(0), height: 16, fill: cpu ? css("--cellhl") : "none", stroke: css("--line"), "stroke-dasharray": cpu ? "" : "4 2"});
    el("text", {x: X(v) + 4, y: y + 13, "font-size": 11, fill: css("--muted")}, v.toFixed(0)); });
}

const GOOD = [{"ln": 1, "line": 1, "nodes": [], "edges": [], "err": null, "msg": "2. sor: Capture indul az s0-on: a műveletek nem futnak, hanem csomóponttá válnak."}, {"ln": 2, "line": 2, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "3. sor: kernelA: új kernelcsomópont, nincs bejövő él"}, {"ln": 3, "line": 3, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "4. sor: forkEv rögzítése az s0-en: az esemény a frontier-t (kernelA) jegyzi meg (nem csomópont)."}, {"ln": 4, "line": 4, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "5. sor: s1 vár a forkEv-re: az s1 bekerül a capture-be (fork); a következő s1-művelet függ ettől: kernelA."}, {"ln": 5, "line": 5, "nodes": ["kernelA", "kernelB"], "edges": [["kernelA", "kernelB"]], "err": null, "msg": "6. sor: kernelB: új kernelcsomópont, élek: kernelA → kernelB"}, {"ln": 6, "line": 6, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "7. sor: kernelC: új kernelcsomópont, élek: kernelA → kernelC"}, {"ln": 7, "line": 7, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "8. sor: joinEv rögzítése az s1-en: az esemény a frontier-t (kernelB) jegyzi meg (nem csomópont)."}, {"ln": 8, "line": 8, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "9. sor: s0 vár a joinEv-re: join; a következő s0-művelet függ ettől: kernelB."}, {"ln": 9, "line": 9, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "10. sor: cudaStreamEndCapture: kész a cudaGraph_t (3 kernelcsomópont, 2 él)."}];
const BAD = [{"ln": 1, "line": 1, "nodes": [], "edges": [], "err": null, "msg": "2. sor: Capture indul az s0-on: a műveletek nem futnak, hanem csomóponttá válnak."}, {"ln": 2, "line": 2, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "3. sor: kernelA: új kernelcsomópont, nincs bejövő él"}, {"ln": 3, "line": 3, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "4. sor: forkEv rögzítése az s0-en: az esemény a frontier-t (kernelA) jegyzi meg (nem csomópont)."}, {"ln": 4, "line": 4, "nodes": ["kernelA"], "edges": [], "err": null, "msg": "5. sor: s1 vár a forkEv-re: az s1 bekerül a capture-be (fork); a következő s1-művelet függ ettől: kernelA."}, {"ln": 5, "line": 5, "nodes": ["kernelA", "kernelB"], "edges": [["kernelA", "kernelB"]], "err": null, "msg": "6. sor: kernelB: új kernelcsomópont, élek: kernelA → kernelB"}, {"ln": 6, "line": 6, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "7. sor: kernelC: új kernelcsomópont, élek: kernelA → kernelC"}, {"ln": 7, "line": 7, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": null, "msg": "8. sor: joinEv rögzítése az s1-en: az esemény a frontier-t (kernelB) jegyzi meg (nem csomópont)."}, {"ln": 8, "line": 8, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB", "stream"], ["kernelA", "kernelC", "stream"]], "err": null, "msg": "9. sor: 9. sor kihagyva: az s0 nem várja meg a joinEv-et."}, {"ln": 9, "line": 9, "nodes": ["kernelA", "kernelB", "kernelC"], "edges": [["kernelA", "kernelB"], ["kernelA", "kernelC"]], "err": "cudaErrorStreamCaptureUnjoined", "msg": "10. sor: cudaStreamEndCapture HIBA: cudaErrorStreamCaptureUnjoined – az s1 nem csatlakozott vissza az s0-ra."}];


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
