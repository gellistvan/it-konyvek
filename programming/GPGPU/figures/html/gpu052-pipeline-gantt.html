<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline idővonal (Gantt)</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>T_m: <input id="tm" type="range" min="1" max="10" value="6" oninput="rebuild()" aria-label="T_m" style="flex:0 1 90px"> <span id="tmo">3</span></label><label>T_c: <input id="tc" type="range" min="1" max="10" value="4" oninput="rebuild()" aria-label="T_c" style="flex:0 1 90px"> <span id="tco">2</span></label><label>STAGES: <select id="st" onchange="rebuild()" aria-label="STAGES"><option value="1">1 (szinkron)</option><option value="2" selected>2</option><option value="3">3</option></select></label><label>csempék: <input id="nn" type="range" min="3" max="10" value="5" oninput="rebuild()" aria-label="Csempék száma" style="flex:0 1 80px"> <span id="nno">5</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Gantt-diagram: a szinkron változatban a másolás és a számítás váltakozik, a pipeline-ban a következő csempe másolása az aktuális számítással egy időben fut."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Sematikus eseménymodell a fejezet kernelének lépéseiből, nem mérés: a másolások egy memóriacsatornán sorban futnak, T_s = 0,5 egység barrierenként, az erőforrás-verseny elhanyagolva. Felül mindig a szinkron változat látszik összehasonlításként.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "0. csempe: a wait t = 0-tól 3-ig vár, barrier után számítás 3,5–5,5. Pufferek: buf0: olvasva: 0. csempe; buf1: töltődik: 1. csempe.", "line": 5, "i": 0, "t": 3.5, "buf": ["olvasva: 0. csempe", "töltődik: 1. csempe"], "S": 2, "n": 5, "Tm": 3.0, "Tc": 2.0, "Ts": 0.5}, {"msg": "1. csempe: a wait t = 6-tól 6,5-ig vár, barrier után számítás 7–9. Pufferek: buf0: töltődik: 2. csempe; buf1: olvasva: 1. csempe.", "line": 5, "i": 1, "t": 7.0, "buf": ["töltődik: 2. csempe", "olvasva: 1. csempe"], "S": 2, "n": 5, "Tm": 3.0, "Tc": 2.0, "Ts": 0.5}, {"msg": "2. csempe: a wait t = 9,5-tól 10-ig vár, barrier után számítás 10,5–12,5. Pufferek: buf0: olvasva: 2. csempe; buf1: töltődik: 3. csempe.", "line": 5, "i": 2, "t": 10.5, "buf": ["olvasva: 2. csempe", "töltődik: 3. csempe"], "S": 2, "n": 5, "Tm": 3.0, "Tc": 2.0, "Ts": 0.5}, {"msg": "3. csempe: a wait t = 13-tól 13,5-ig vár, barrier után számítás 14–16. Pufferek: buf0: töltődik: 4. csempe; buf1: olvasva: 3. csempe.", "line": 5, "i": 3, "t": 14.0, "buf": ["töltődik: 4. csempe", "olvasva: 3. csempe"], "S": 2, "n": 5, "Tm": 3.0, "Tc": 2.0, "Ts": 0.5}, {"msg": "4. csempe: a wait t = 16,5-tól 17-ig vár, barrier után számítás 17,5–19,5. Pufferek: buf0: olvasva: 4. csempe; buf1: szabad.", "line": 5, "i": 4, "t": 17.5, "buf": ["olvasva: 4. csempe", "szabad"], "S": 2, "n": 5, "Tm": 3.0, "Tc": 2.0, "Ts": 0.5}];
const CODE = ["for (p = 0; p < STAGES - 1; ++p) { issue_tile(buf[p], …, p); __pipeline_commit(); }", "for (t = 0; t < my_tiles; ++t) {", "    __pipeline_wait_prior(STAGES - 2);      // a t. csempe kész", "    __syncthreads();                       // látható; a (t-1)%STAGES puffer szabad", "    issue_tile(buf[(t+STAGES-1) % STAGES], …, t + STAGES - 1); __pipeline_commit();", "    feldolgozás(buf[t % STAGES]);           // T_c", "    __syncthreads();                       // a puffer újraírható", "}"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function simulate(S, n, Tm, Tc, Ts){
  const copies = [], comps = [], bars = [], iters = []; let ch = 0;
  if (S === 1){ let t = 0; for (let i = 0; i < n; i++){ copies.push([i, 0, t, t + Tm]); t += Tm; bars.push([t, t + Ts]); t += Ts; iters.push([i, copies[copies.length - 1][2], t - Ts]); comps.push([i, 0, t, t + Tc]); t += Tc; bars.push([t, t + Ts]); t += Ts; } return [copies, comps, bars, iters, t]; }
  const done = {};
  function issue(i, t0){ const st = Math.max(t0, ch); ch = st + Tm; copies.push([i, i % S, st, ch]); done[i] = ch; }
  for (let p = 0; p < Math.min(S - 1, n); p++) issue(p, 0);
  let t = 0;
  for (let i = 0; i < n; i++){
    const w = Math.max(t, done[i]); iters.push([i, t, w]); bars.push([w, w + Ts]); t = w + Ts;
    if (i + S - 1 < n) issue(i + S - 1, t);
    comps.push([i, i % S, t, t + Tc]); t += Tc; bars.push([t, t + Ts]); t += Ts;
  }
  return [copies, comps, bars, iters, t];
}
function cm(x){ return (Math.round(x * 10) / 10).toString().replace(".", ","); }
function stepsFor(S, n, Tm, Tc, Ts){
  const [copies, comps, bars, iters, tot] = simulate(S, n, Tm, Tc, Ts), out = [];
  for (const [i, ts, w] of iters){
    const t = w + Ts, states = [];
    for (let b = 0; b < Math.max(S, 1); b++){
      let st = "szabad";
      for (const [j, bb, a, e] of copies) if (bb === b && a <= t && t < e) st = "töltődik: " + j + ". csempe";
      for (const [j, bb] of comps) if (bb === b && j === i) st = "olvasva: " + j + ". csempe";
      states.push(st);
    }
    const msg = i + ". csempe: a wait t = " + cm(ts) + "-tól " + cm(w) + "-ig vár, barrier után számítás " + cm(w + Ts) + "–" + cm(w + Ts + Tc) + ". Pufferek: " + states.map((s, b) => "buf" + b + ": " + s).join("; ") + ".";
    out.push({msg: msg, line: 5, i: i, t: w + Ts, buf: states, S: S, n: n, Tm: Tm, Tc: Tc, Ts: Ts});
  }
  return out;
}
function render(s){
  svg.innerHTML = "";
  svg.setAttribute("viewBox", "0 0 600 300");
  const ln = css("--line"), hl = css("--hl"), h2 = css("--hl2"), cl = css("--cell"), ch_ = css("--cellhl"), mu = css("--muted");
  const sy = simulate(1, s.n, s.Tm, s.Tc, s.Ts), pp = simulate(s.S, s.n, s.Tm, s.Tc, s.Ts);
  const tmax = Math.max(sy[4], pp[4]), X0 = 120, W = 440, sc = W / tmax, x = t => X0 + t * sc;
  function bar(y, a, e, kind, lab, cur){
    el("rect", {x: x(a), y: y, width: Math.max(1, (e - a) * sc), height: 22, fill: kind === "c" ? cl : ch_, stroke: cur ? h2 : ln, "stroke-width": cur ? 2.5 : 0.8, "stroke-dasharray": kind === "c" ? "5 2" : "none"});
    if ((e - a) * sc > 24) el("text", {x: x(a) + (e - a) * sc / 2, y: y + 15, "text-anchor": "middle", "font-size": 10}, lab);
  }
  el("text", {x: 4, y: 30, "font-size": 12}, "szinkron");
  sy[0].forEach(c => bar(16, c[2], c[3], "c", String(c[0])));
  sy[1].forEach(c => bar(16, c[2], c[3], "k", String(c[0])));
  el("text", {x: x(sy[4]) + 4, y: 32, "font-size": 11, "font-weight": "bold"}, cm(sy[4]));
  const lab = s.S === 1 ? "szinkron (STAGES = 1)" : s.S + " fokozat";
  el("text", {x: 4, y: 76, "font-size": 12}, lab + ": másolás");
  el("text", {x: 4, y: 108, "font-size": 12}, lab + ": számítás");
  pp[0].forEach(c => bar(62, c[2], c[3], "c", s.S > 1 ? c[0] + "·b" + c[1] : String(c[0]), c[0] === s.i + Math.max(s.S - 1, 0) && s.S > 1));
  pp[1].forEach(c => bar(94, c[2], c[3], "k", s.S > 1 ? c[0] + "·b" + c[1] : String(c[0]), c[0] === s.i));
  pp[2].forEach(b => el("line", {x1: x(b[0] + (b[1] - b[0]) / 2), x2: x(b[0] + (b[1] - b[0]) / 2), y1: 58, y2: 120, stroke: mu, "stroke-width": 0.8, "stroke-dasharray": "2 2"}));
  el("text", {x: x(pp[4]) + 4, y: 110, "font-size": 11, "font-weight": "bold"}, cm(pp[4]));
  el("line", {x1: x(s.t), x2: x(s.t), y1: 10, y2: 126, stroke: h2, "stroke-width": 1.8});
  for (let t = 0; t <= tmax; t += (tmax > 40 ? 10 : 5)) el("text", {x: x(t), y: 140, "text-anchor": "middle", "font-size": 10, fill: mu}, String(t));
  // puffertábla
  el("text", {x: 4, y: 172, "font-size": 12, "font-weight": "bold"}, "Pufferállapot a(z) " + s.i + ". csempe számításakor:");
  s.buf.forEach((st, b) => {
    const y = 182 + b * 24;
    el("rect", {x: 10, y: y, width: 300, height: 20, fill: st.startsWith("olvas") ? ch_ : cl, stroke: ln, "stroke-dasharray": st.startsWith("tölt") ? "5 2" : "none"});
    el("text", {x: 18, y: y + 14, "font-size": 12}, "buf" + b + ": " + st);
  });
  const pt = Math.max(s.Tc, s.Tm) + s.Ts, st_ = s.Tc + s.Tm + s.Ts;
  el("text", {x: 330, y: 196, "font-size": 12}, "T_sync ≈ T_c + T_m + T_s = " + cm(st_));
  el("text", {x: 330, y: 216, "font-size": 12}, "T_pipe ≈ max(T_c, T_m) + T_s = " + cm(pt));
  el("text", {x: 330, y: 236, "font-size": 12}, "(csempénként, a fejezet modellje)");
  el("text", {x: 330, y: 260, "font-size": 12, "font-weight": "bold"}, "szimulált: " + cm(sy[4]) + " vs. " + cm(pp[4]));
}
function rebuild(){
  const g = id => +document.getElementById(id).value;
  const Tm = g("tm") / 2, Tc = g("tc") / 2, S = g("st"), n = g("nn");
  document.getElementById("tmo").textContent = cm(Tm); document.getElementById("tco").textContent = cm(Tc);
  document.getElementById("nno").textContent = n;
  setSteps(stepsFor(S, n, Tm, Tc, 0.5));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
