<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bankütközés oszlopos olvasásnál</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Sorhossz R: <select id="R" onchange="reload()"><option>32</option><option>33</option><option>34</option><option>48</option></select></label> <label>ly (a warp rögzített oszlopa): <input id="ly" type="number" min="0" max="31" value="0" style="width:4em" onchange="reload()"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 32 bank és a csempe szavai; a warp 32 olvasása lépésenként kiszolgálva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Feltétel: 32 bank × 4 bájt, float, local = {32, 32}; egy warp = rögzített ly, lx = 0…31. Narancs: az adott lépésben kiszolgált kérés, szürke pont: már kiszolgált. R = 33: ütközési fok 1; R = 32: 32; R = 34: 2; R = 48: 16.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"R": 32, "ly": 0, "served": -1, "d": 32, "line": 3, "msg": "R = 32, ly = 0: a warp 32 kérése (lx = 0…31) a szó = lx·32 + 0, bank = szó mod 32 képlettel 1 különböző bankba esik; ütközési fok = 32, szükséges lépések: 32."}, {"R": 32, "ly": 0, "served": 0, "d": 32, "line": 3, "msg": "1. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 31 lépés."}, {"R": 32, "ly": 0, "served": 1, "d": 32, "line": 3, "msg": "2. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 30 lépés."}, {"R": 32, "ly": 0, "served": 2, "d": 32, "line": 3, "msg": "3. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 29 lépés."}, {"R": 32, "ly": 0, "served": 3, "d": 32, "line": 3, "msg": "4. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 28 lépés."}, {"R": 32, "ly": 0, "served": 4, "d": 32, "line": 3, "msg": "5. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 27 lépés."}, {"R": 32, "ly": 0, "served": 5, "d": 32, "line": 3, "msg": "6. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 26 lépés."}, {"R": 32, "ly": 0, "served": 6, "d": 32, "line": 3, "msg": "7. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 25 lépés."}, {"R": 32, "ly": 0, "served": 7, "d": 32, "line": 3, "msg": "8. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 24 lépés."}, {"R": 32, "ly": 0, "served": 8, "d": 32, "line": 3, "msg": "9. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 23 lépés."}, {"R": 32, "ly": 0, "served": 9, "d": 32, "line": 3, "msg": "10. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 22 lépés."}, {"R": 32, "ly": 0, "served": 10, "d": 32, "line": 3, "msg": "11. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 21 lépés."}, {"R": 32, "ly": 0, "served": 11, "d": 32, "line": 3, "msg": "12. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 20 lépés."}, {"R": 32, "ly": 0, "served": 12, "d": 32, "line": 3, "msg": "13. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 19 lépés."}, {"R": 32, "ly": 0, "served": 13, "d": 32, "line": 3, "msg": "14. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 18 lépés."}, {"R": 32, "ly": 0, "served": 14, "d": 32, "line": 3, "msg": "15. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 17 lépés."}, {"R": 32, "ly": 0, "served": 15, "d": 32, "line": 3, "msg": "16. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 16 lépés."}, {"R": 32, "ly": 0, "served": 16, "d": 32, "line": 3, "msg": "17. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 15 lépés."}, {"R": 32, "ly": 0, "served": 17, "d": 32, "line": 3, "msg": "18. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 14 lépés."}, {"R": 32, "ly": 0, "served": 18, "d": 32, "line": 3, "msg": "19. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 13 lépés."}, {"R": 32, "ly": 0, "served": 19, "d": 32, "line": 3, "msg": "20. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 12 lépés."}, {"R": 32, "ly": 0, "served": 20, "d": 32, "line": 3, "msg": "21. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 11 lépés."}, {"R": 32, "ly": 0, "served": 21, "d": 32, "line": 3, "msg": "22. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 10 lépés."}, {"R": 32, "ly": 0, "served": 22, "d": 32, "line": 3, "msg": "23. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 9 lépés."}, {"R": 32, "ly": 0, "served": 23, "d": 32, "line": 3, "msg": "24. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 8 lépés."}, {"R": 32, "ly": 0, "served": 24, "d": 32, "line": 3, "msg": "25. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 7 lépés."}, {"R": 32, "ly": 0, "served": 25, "d": 32, "line": 3, "msg": "26. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 6 lépés."}, {"R": 32, "ly": 0, "served": 26, "d": 32, "line": 3, "msg": "27. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 5 lépés."}, {"R": 32, "ly": 0, "served": 27, "d": 32, "line": 3, "msg": "28. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 4 lépés."}, {"R": 32, "ly": 0, "served": 28, "d": 32, "line": 3, "msg": "29. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 3 lépés."}, {"R": 32, "ly": 0, "served": 29, "d": 32, "line": 3, "msg": "30. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 2 lépés."}, {"R": 32, "ly": 0, "served": 30, "d": 32, "line": 3, "msg": "31. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 1 lépés."}, {"R": 32, "ly": 0, "served": 31, "d": 32, "line": 3, "msg": "32. lépés / 32: bankonként egy kérés kiszolgálva (1 kérés). Az azonos bankba eső kérések sorosítva: még 0 lépés."}];
const CODE = ["__local float tile[32][R];                  // R = 32 (naiv) vagy 33 (padding)", "tile[ly][lx] = in[y * get_global_size(0) + x];   // írás: soronként", "barrier(CLK_LOCAL_MEM_FENCE);", "... = tile[lx][ly];   // olvasás: szó = lx*R + ly, bank = szó mod 32"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function reqs(R, ly){ const a = []; for (let lx = 0; lx < 32; lx++){ const w = lx * R + ly; a.push({lx, w, b: w % 32, r: Math.floor(w / 32)}); } return a; }
function stepsJS(R, ly){
  const q = reqs(R, ly), cnt = {}, ord = {};
  q.forEach(o => { ord[o.lx] = cnt[o.b] || 0; cnt[o.b] = (cnt[o.b] || 0) + 1; });
  const d = Math.max(...Object.values(cnt)), nb = Object.keys(cnt).length;
  const out = [{R, ly, served: -1, d, line: 3, msg: "R = " + R + ", ly = " + ly + ": a warp 32 kérése (lx = 0…31) a szó = lx·" + R + " + " + ly + ", bank = szó mod 32 képlettel " + nb + " különböző bankba esik; ütközési fok = " + d + ", szükséges lépések: " + d + "."}];
  for (let k = 0; k < d; k++) {
    const n = Object.values(ord).filter(v => v === k).length;
    out.push({R, ly, served: k, d, line: 3, msg: (k + 1) + ". lépés / " + d + ": bankonként egy kérés kiszolgálva (" + n + " kérés). " + (d === 1 ? "Ütközésmentes: egyetlen lépés elég." : "Az azonos bankba eső kérések sorosítva: még " + (d - k - 1) + " lépés.")});
  }
  return out;
}
function reload(){ setSteps(stepsJS(+document.getElementById("R").value, +document.getElementById("ly").value)); }
function render(s){
  const q = reqs(s.R, s.ly), cnt = {}, ord = {};
  q.forEach(o => { ord[o.lx] = cnt[o.b] || 0; cnt[o.b] = (cnt[o.b] || 0) + 1; });
  const rmax = Math.floor((32 * s.R - 1) / 32) + 1, C = 13, x0 = 34, y0 = 30;
  svg.setAttribute("viewBox", "0 0 560 " + (y0 + rmax * C + 12));
  svg.innerHTML = "";
  const L = css("--line"), A = css("--hl2"), G = css("--cellhl"), W = css("--cell");
  for (let b = 0; b < 32; b += 4) el("text", {x: x0 + b * C + C / 2, y: 22, "text-anchor": "middle", "font-size": 10}, String(b));
  for (let r = 0; r < rmax; r++) {
    if (r % 4 === 0) el("text", {x: x0 - 6, y: y0 + r * C + 11, "text-anchor": "end", "font-size": 10}, String(r));
    for (let b = 0; b < 32; b++) {
      const w = r * 32 + b, pad = (w % s.R) >= 32 && w < 32 * s.R;
      el("rect", {x: x0 + b * C, y: y0 + r * C, width: C, height: C, fill: pad ? G : W, stroke: css("--muted"), "stroke-width": 0.3});
    }
  }
  q.forEach(o => {
    const done = s.served >= ord[o.lx], now = s.served === ord[o.lx];
    el("circle", {cx: x0 + o.b * C + C / 2, cy: y0 + o.r * C + C / 2, r: 5, fill: now ? A : (done ? css("--muted") : L), stroke: now ? L : "none"});
  });
  el("text", {x: x0 + 32 * C + 8, y: y0 + 12, "font-size": 12}, "ütközési fok: " + s.d);
  el("text", {x: x0 + 32 * C + 8, y: y0 + 30, "font-size": 12}, "lépések: " + s.d);
  el("text", {x: x0 + 32 * C + 8, y: y0 + 54, "font-size": 11, fill: css("--muted")}, "sor: szó div 32");
  el("text", {x: x0 + 32 * C + 8, y: y0 + 70, "font-size": 11, fill: css("--muted")}, "oszlop: bank");
  el("text", {x: x0 + 32 * C + 8, y: y0 + 86, "font-size": 11, fill: css("--muted")}, "szürke: padding");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
