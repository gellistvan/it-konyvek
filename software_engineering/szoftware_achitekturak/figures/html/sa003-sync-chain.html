<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soros szinkron lánc és aszinkron sor</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>Értesítés ideje: <input id="ps" type="range" min="50" max="3000" step="50" value="200" aria-label="Az Értesítés szolgáltatási ideje (ms)"> <span id="vs">200</span> ms</label>
<label>Időkeret: <input id="pb" type="range" min="100" max="2000" step="50" value="500" aria-label="A Rendelés kísérletenkénti időkerete (ms)"> <span id="vb">500</span> ms</label>
<label>Újrapróbálás: <input id="pr" type="range" min="0" max="3" step="1" value="1" aria-label="Újrapróbálások száma"> <span id="vr">1</span></label>
<button id="slow" title="A (B) panel esete">Lassú eset (2000 ms)</button>
<button id="norm" title="Az (A) panel esete">Normál eset</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal: szinkron láncban a válaszidő 40 + 60 + 200 = 300 ms; lassú Értesítésnél időtúllépés és újrapróbálás; aszinkron változatban a válasz 100 ms."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, nem mért értékek (elméleti modell): a Rendelés 40, a Készlet 60 ms saját munkát végez, a Rendelés időkerete egy kísérletre vonatkozik, a Készletnek nincs saját időkerete, a megszakítás nem terjed tovább. A foglalt szálak száma a Little-törvényből: L = λ·W, λ = 10 kérés/s.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "T = 0 ms: a felhasználó kérése a Rendeléshez; a Rendelés dolgozik (40 ms).", "t": 0, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 40 ms: Rendelés → Készlet hívás (1. kísérlet, időkeret 500 ms); a Készlet dolgozik (60 ms).", "t": 40, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 100 ms: Készlet → Értesítés hívás; az Értesítés szolgáltatási ideje 200 ms.", "t": 100, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 300 ms: az Értesítés kész, válasz a Készletnek.", "t": 300, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 300 ms: a Készlet válaszol a Rendelésnek.", "t": 300, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 300 ms: válasz a felhasználónak. Végponttól végpontig: 40 + 60 + 200 = 300 ms (összeg, nem maximum).", "t": 300, "ph": "sync", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "Aszinkron változat – T = 100 ms: válasz a felhasználónak (Rendelés 40 + Készlet 60 ms); az értesítési üzenet a sorba kerül (felső korlát 10000 üzenet, idempotencia-kulcs: rendelésazonosító).", "t": 100, "ph": "async", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}, {"msg": "T = 300 ms: az Értesítés-fogyasztó feldolgozta az üzenetet (átfutás 200 ms); a felhasználói válasz ettől független. 5 sikertelen kézbesítés után az üzenet a DLQ-ba kerül.", "t": 300, "ph": "async", "line": -1, "st": {"e2e": 300, "ok": true, "busyR": "3", "busyK": "2,6", "busyE": "2", "resp": 100}, "g": {"segs": [["R", 0, 0, 40, "work"], ["K", 0, 40, 100, "work"], ["E", 0, 100, 300, "work"], ["K", 0, 100, 300, "wait"], ["R", 0, 40, 300, "wait"]], "marks": [["R", 300, "ok"]], "arrows": [["R", "K", 40, "call"], ["K", "E", 100, "call"], ["E", "K", 300, "ret"], ["K", "R", 300, "ret"]], "aseg": [["R", 0, 0, 40, "work"], ["R", 0, 40, 100, "wait"], ["K", 0, 40, 100, "work"], ["C", 0, 100, 300, "work"]], "s": 200}}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const P = {"T_ORD": 40, "T_INV": 60, "LAM": 10, "QUEUE_MAX": 10000, "DLQ_AFTER": 5};
function fmtn(x){ let s = x.toFixed(1); if (s.endsWith(".0")) s = s.slice(0, -2); return s.replace(".", ","); }
function simulate(s, B, R){
  const segs = [], marks = [], arrows = [], ev = [];
  const E = (t, msg, ph) => ev.push({t: t, ph: ph || "sync", msg: msg});
  segs.push(["R", 0, 0, P.T_ORD, "work"]);
  E(0, `T = 0 ms: a felhasználó kérése a Rendeléshez; a Rendelés dolgozik (${P.T_ORD} ms).`);
  let t = P.T_ORD, done = null, attempts = 0;
  for (let a = 0; a <= R; a++){
    attempts++;
    arrows.push(["R", "K", t, a === 0 ? "call" : "retry"]);
    E(t, `T = ${t} ms: Rendelés → Készlet hívás (${a + 1}. kísérlet, időkeret ${B} ms); a Készlet dolgozik (${P.T_INV} ms).`);
    segs.push(["K", a, t, t + P.T_INV, "work"]);
    arrows.push(["K", "E", t + P.T_INV, a === 0 ? "call" : "retry"]);
    E(t + P.T_INV, `T = ${t + P.T_INV} ms: Készlet → Értesítés hívás; az Értesítés szolgáltatási ideje ${s} ms.`);
    const end = t + P.T_INV + s;
    if (P.T_INV + s <= B){
      segs.push(["E", a, t + P.T_INV, end, "work"], ["K", a, t + P.T_INV, end, "wait"], ["R", a, t, end, "wait"]);
      arrows.push(["E", "K", end, "ret"], ["K", "R", end, "ret"]);
      E(end, `T = ${end} ms: az Értesítés kész, válasz a Készletnek.`);
      E(end, `T = ${end} ms: a Készlet válaszol a Rendelésnek.`);
      done = end; break;
    }
    segs.push(["E", a, t + P.T_INV, end, "lost"], ["K", a, t + P.T_INV, end, "wait"], ["R", a, t, t + B, "wait"]);
    marks.push(["R", t + B, "x"]);
    E(t + B, `T = ${t + B} ms: időtúllépés a Rendelésben (${B} ms várakozás után); a Készlet és az Értesítés T = ${end} ms-ig tovább dolgozik a kérésen – elhagyott munka.`);
    t += B;
  }
  const W_R = done !== null ? done : t, W_K = attempts * (P.T_INV + s), W_E = attempts * s;
  const busy = {R: P.LAM * W_R / 1000, K: P.LAM * W_K / 1000, E: P.LAM * W_E / 1000};
  if (done !== null){
    marks.push(["R", done, "ok"]);
    E(done, `T = ${done} ms: válasz a felhasználónak. Végponttól végpontig: ${P.T_ORD} + ${P.T_INV} + ${s} = ${done} ms (összeg, nem maximum).`);
  } else {
    marks.push(["R", t, "err"]);
    E(t, `T = ${t} ms: hiba a felhasználónak ${attempts} kísérlet után; az Értesítés ${attempts}× ${s} ms munkát kapott (retry-erősítés).`);
  }
  const resp = P.T_ORD + P.T_INV;
  const aseg = [["R", 0, 0, P.T_ORD, "work"], ["R", 0, P.T_ORD, resp, "wait"], ["K", 0, P.T_ORD, resp, "work"], ["C", 0, resp, resp + s, "work"]];
  E(resp, `Aszinkron változat – T = ${resp} ms: válasz a felhasználónak (Rendelés ${P.T_ORD} + Készlet ${P.T_INV} ms); az értesítési üzenet a sorba kerül (felső korlát ${P.QUEUE_MAX} üzenet, idempotencia-kulcs: rendelésazonosító).`, "async");
  E(resp + s, `T = ${resp + s} ms: az Értesítés-fogyasztó feldolgozta az üzenetet (átfutás ${s} ms); a felhasználói válasz ettől független. ${P.DLQ_AFTER} sikertelen kézbesítés után az üzenet a DLQ-ba kerül.`, "async");
  return {s: s, segs: segs, marks: marks, arrows: arrows, aseg: aseg, ev: ev, done: done, fail_t: done !== null ? null : t, busy: busy, resp: resp};
}
function stepsOf(sc){
  const st = {e2e: sc.done !== null ? sc.done : sc.fail_t, ok: sc.done !== null, busyR: fmtn(sc.busy.R), busyK: fmtn(sc.busy.K), busyE: fmtn(sc.busy.E), resp: sc.resp};
  const geo = {segs: sc.segs, marks: sc.marks, arrows: sc.arrows, aseg: sc.aseg, s: sc.s};
  return sc.ev.map(e => ({msg: e.msg, t: e.t, ph: e.ph, line: -1, st: st, g: geo}));
}
function recompute(){
  const s = +document.getElementById("ps").value, B = +document.getElementById("pb").value, R = +document.getElementById("pr").value;
  document.getElementById("vs").textContent = s; document.getElementById("vb").textContent = B; document.getElementById("vr").textContent = R;
  setSteps(stepsOf(simulate(s, B, R)));
}
function preset(s){ document.getElementById("ps").value = s; document.getElementById("pb").value = 500; document.getElementById("pr").value = 1; recompute(); }
document.getElementById("ps").addEventListener("input", recompute);
document.getElementById("pb").addEventListener("input", recompute);
document.getElementById("pr").addEventListener("input", recompute);
document.getElementById("slow").addEventListener("click", () => preset(2000));
document.getElementById("norm").addEventListener("click", () => preset(200));
function render(s){
  svg.setAttribute("viewBox", "0 0 640 400");
  svg.innerHTML = "";
  const g = s.g, X0 = 96, X1 = 610;
  let tmax = 0;
  g.segs.forEach(q => { tmax = Math.max(tmax, q[3]); });
  g.aseg.forEach(q => { tmax = Math.max(tmax, q[3]); });
  const xs = t => X0 + (X1 - X0) * t / tmax;
  const fills = {work: css("--cellhl"), wait: css("--cell"), lost: css("--cell")};
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<pattern id="hw" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--muted")}" stroke-width="1.2"/></pattern>` +
    `<pattern id="hx" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${css("--muted")}" stroke-width="1"/></pattern>` +
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--line")}"/></marker>`;
  // időtengely
  el("line", {x1: X0, y1: 22, x2: X1, y2: 22, stroke: css("--muted")});
  for (let i = 0; i <= 5; i++){ const tt = Math.round(tmax * i / 5); el("text", {x: xs(tt), y: 16, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, tt + " ms"); }
  function section(y0, rows, names, segs, active, label){
    el("text", {x: 6, y: y0 - 8, "font-size": 12, "font-weight": "bold"}, label);
    const nl = {};
    segs.forEach(q => { nl[q[0]] = Math.max(nl[q[0]] || 1, q[1] + 1); });
    rows.forEach((r, i) => { el("text", {x: 6, y: y0 + i * 34 + 21, "font-size": 12}, names[i]); });
    segs.forEach(q => {
      const i = rows.indexOf(q[0]), n = q[0] === "R" ? 1 : nl[q[0]], h = 24 / n;
      const tEnd = active ? Math.min(q[3], s.t) : q[3];
      if (active && q[2] > s.t) return;
      const y = y0 + i * 34 + 4 + (q[0] === "R" ? 0 : q[1] * h);
      el("rect", {x: xs(q[2]), y: y, width: Math.max(0.5, xs(tEnd) - xs(q[2])), height: h * 0.92, fill: fills[q[4]], stroke: css("--line"), "stroke-width": 0.8});
      if (q[4] !== "work") el("rect", {x: xs(q[2]), y: y, width: Math.max(0.5, xs(tEnd) - xs(q[2])), height: h * 0.92, fill: q[4] === "wait" ? "url(#hw)" : "url(#hx)", stroke: "none"});
    });
    return (row) => y0 + rows.indexOf(row) * 34 + 16;
  }
  const syncAct = s.ph === "sync", asyncAct = s.ph === "async";
  const yS = section(52, ["R", "K", "E"], ["Rendelés", "Készlet", "Értesítés"], g.segs, syncAct, "Szinkron lánc");
  g.arrows.forEach(a => {
    if (syncAct && a[2] > s.t) return;
    const y0 = yS(a[0]), y1 = yS(a[1]), d = y1 > y0 ? 1 : -1;
    el("line", {x1: xs(a[2]), y1: y0 + d * 12, x2: xs(a[2]), y2: y1 - d * 12, stroke: css("--line"), "stroke-width": a[3] === "ret" ? 1 : 1.6, "stroke-dasharray": a[3] === "retry" ? "2 3" : "", "marker-end": "url(#ah)"});
  });
  g.marks.forEach(m => {
    if (syncAct && m[1] > s.t) return;
    const x = xs(m[1]), y = yS(m[0]);
    if (m[2] === "x") el("text", {x: x, y: y + 6, "text-anchor": "middle", "font-size": 18, "font-weight": "bold"}, "✕");
    else el("text", {x: x, y: y - 16, "text-anchor": "middle", "font-size": 12}, m[2] === "ok" ? "▼ válasz" : "▽ hiba");
  });
  const yA = section(212, ["R", "K", "C"], ["Rendelés", "Készlet", "Fogyasztó"], asyncAct ? g.aseg : [], asyncAct, "Aszinkron sor");
  if (!asyncAct) el("text", {x: 330, y: 262, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, "(az utolsó két lépés: ugyanez a kérés aszinkron sorral)");
  if (asyncAct){
    el("line", {x1: xs(s.st.resp), y1: yA("K"), x2: xs(s.st.resp), y2: yA("C") - 12, stroke: css("--line"), "stroke-width": 1.6, "stroke-dasharray": "6 4", "marker-end": "url(#ah)"});
    el("text", {x: xs(s.st.resp) + 6, y: yA("K") + 26, "font-size": 11}, "sor → (idempotencia-kulcs, DLQ)");
    el("text", {x: xs(s.st.resp), y: yA("R") - 16, "text-anchor": "middle", "font-size": 12}, "▼ válasz " + s.st.resp + " ms");
  }
  // kurzor
  const yc0 = syncAct ? 44 : 204, yc1 = syncAct ? 156 : 316;
  el("line", {x1: xs(s.t), y1: yc0, x2: xs(s.t), y2: yc1, stroke: css("--hl2"), "stroke-width": 2});
  el("text", {x: xs(s.t), y: yc1 + 12, "text-anchor": "middle", "font-size": 11, fill: css("--hl2")}, "T = " + s.t);
  // számlálók
  const st = s.st;
  el("text", {x: 6, y: 352, "font-size": 12.5}, `Szinkron: ${st.ok ? "válasz" : "HIBA"} ${st.e2e} ms   ·   aszinkron válasz: ${st.resp} ms (az Értesítéstől független)`);
  el("text", {x: 6, y: 372, "font-size": 12.5}, `Foglalt szálak (λ = ${P.LAM} kérés/s, L = λ·W): Rendelés ${st.busyR} · Készlet ${st.busyK} · Értesítés ${st.busyE}`);
  el("text", {x: 6, y: 392, "font-size": 11, fill: css("--muted")}, "szürke = munka, ferde sraff = várakozás, kockás = elhagyott munka; pontozott nyíl = újrapróbálás");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
