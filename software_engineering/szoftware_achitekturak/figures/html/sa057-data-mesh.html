<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Központi adattárház és data mesh</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>modell: <select id="md"><option value="mesh">data mesh</option><option value="dwh">központi adattárház</option></select></label> <span class="small">Adattermékre (hatszög) kattintva a szerződés kivonata jelenik meg.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Központi modellben minden adat a DWH-csapaton át jut a fogyasztókhoz; data meshben a domainek saját adattermékeket publikálnak közös platformon, közös szabályokkal."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az „új fogyasztói igény” lejátszása mutatja, kihez megy a kérés a két modellben. A Rendelések szerződése a 15.4.3 orders-v2 kivonata; a Szállítási események és a Számlák szemléltető.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Marketing új igényt jelez: „kampányonkénti rendelési adatok”.", "hot": "Marketing", "mode": "mesh", "n": 0}, {"msg": "2. A katalógusban (3: platform) megtalálja a Rendelések adatterméket és a szerződését (2: adat mint termék).", "hot": "Rendelések", "mode": "mesh", "n": 1}, {"msg": "3. Ha új mező kell, az igény a tulajdonos Értékesítés domainhez megy (1: domain-orientált tulajdonlás).", "hot": "Értékesítés", "mode": "mesh", "n": 2}, {"msg": "4. Az új verzió a CI/CD-kapun megy át: szerződés, PII-besorolás, SLO policy (4: federált governance).", "hot": "kapu", "mode": "mesh", "n": 3}, {"msg": "5. Marketing közvetlenül a Rendelések adattermékből olvas – nincs központi sor.", "hot": "Marketing", "mode": "mesh", "n": 4}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const PR = [["Értékesítés", "Rendelések", "séma: orders_v2.avsc; frissesség p95 < 15 perc; teljesség 99,5%; tulajdonos: order-domain"], ["Logisztika", "Szállítási események", "séma: shipment_event.avsc; frissesség p99 < 5 perc; tulajdonos: logisztikai domain (szemléltető)"], ["Pénzügy", "Számlák", "séma: invoice.avsc; napi frissítés 06:00-ig; tulajdonos: pénzügyi domain (szemléltető)"]], CO = ["Marketing", "Controlling", "Ügyfélszolgálat"], FL = {"dwh": [["Marketing új igényt jelez: „kampányonkénti rendelési adatok”.", "Marketing"], ["Az igény a központi DWH-csapat sorába kerül (szűk keresztmetszet: a sor mögött más kérések várnak).", "DWH"], ["A DWH-csapat értelmezi a forrásrendszert, bár nem ismeri az üzleti jelentését (Értékesítés).", "Értékesítés"], ["A DWH-csapat megépíti a betöltést és a riportot; a felelősség és a minőség központi marad.", "DWH"], ["Marketing megkapja az adatot – a teljes átfutás a központi csapat kapacitásán múlik.", "Marketing"]], "mesh": [["Marketing új igényt jelez: „kampányonkénti rendelési adatok”.", "Marketing"], ["A katalógusban (3: platform) megtalálja a Rendelések adatterméket és a szerződését (2: adat mint termék).", "Rendelések"], ["Ha új mező kell, az igény a tulajdonos Értékesítés domainhez megy (1: domain-orientált tulajdonlás).", "Értékesítés"], ["Az új verzió a CI/CD-kapun megy át: szerződés, PII-besorolás, SLO policy (4: federált governance).", "kapu"], ["Marketing közvetlenül a Rendelések adattermékből olvas – nincs központi sor.", "Marketing"]]};
let MODE = "mesh";
function hex(cx, cy, r, a){ let p = ""; for (let i = 0; i < 6; i++) { const t = Math.PI / 3 * i; p += (cx + r * Math.cos(t)) + "," + (cy + r * Math.sin(t)) + " "; } return el("polygon", Object.assign({points: p, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 1.4}, a || {})); }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330");
  svg.innerHTML = ""; defs0();
  const hot = n => s.hot === n;
  if (s.mode === "dwh") {
    PR.forEach((p, i) => { R(20, 40 + i * 90, 130, 40, {fill: hot(p[0]) ? css("--cellhl") : css("--cell"), "stroke-width": hot(p[0]) ? 3 : 1.2}); T(85, 65 + i * 90, p[0], {"font-size": 13, "text-anchor": "middle"}); A(150, 60 + i * 90, 255, 150); });
    R(258, 110, 150, 90, {rx: 6, fill: hot("DWH") ? css("--cellhl") : css("--cell"), "stroke-width": 3}); T(333, 145, "központi", {"font-size": 13, "text-anchor": "middle", "font-weight": "bold"}); T(333, 162, "DWH-csapat", {"font-size": 13, "text-anchor": "middle", "font-weight": "bold"});
    for (let q = 0; q < 6; q++) R(268 + q * 22, 172, 18, 18, {rx: 1, fill: q === 5 && s.n >= 1 ? css("--hl2") : css("--bg")});
    T(333, 222, "sorban álló kérések", {"font-size": 11.5, "text-anchor": "middle", fill: css("--muted")});
    CO.forEach((c, i) => { R(500, 40 + i * 90, 140, 40, {fill: hot(c) ? css("--cellhl") : css("--cell"), "stroke-width": hot(c) ? 3 : 1.2}); T(570, 65 + i * 90, c, {"font-size": 13, "text-anchor": "middle"}); A(410, 150, 498, 60 + i * 90); });
  } else {
    R(10, 8, 640, 34, {rx: 0, fill: "url(#dots)", "stroke-dasharray": "2 3"}); R(60, 15, 540, 20, {rx: 2, fill: css("--bg"), stroke: "none"});
    T(330, 30, "④ federált governance: szerződés kötelező · PII-besorolás · SLO", {"font-size": 12, "text-anchor": "middle"});
    R(10, 280, 640, 40, {rx: 0, fill: "url(#hat)"}); R(40, 290, 580, 20, {rx: 2, fill: css("--bg"), stroke: "none"});
    T(330, 305, "③ önkiszolgáló platform: objektumtár · batch · sémaregiszter · katalógus · CI/CD", {"font-size": 12, "text-anchor": "middle"});
    R(420, 250, 100, 24, {rx: 2, fill: hot("kapu") ? css("--cellhl") : css("--cell"), "stroke-width": hot("kapu") ? 3 : 1.2}); T(470, 267, "CI/CD-kapu", {"font-size": 12, "text-anchor": "middle"});
    A(470, 42, 470, 248, {"stroke-dasharray": "5 3"});
    PR.forEach((p, i) => { const x = 15 + i * 150;
      R(x, 52, 135, 190, {rx: 8, fill: hot(p[0]) ? css("--cellhl") : css("--cell"), "stroke-width": hot(p[0]) ? 3 : 1.2}); T(x + 67, 72, "① " + p[0], {"font-size": 12.5, "text-anchor": "middle", "font-weight": "bold"});
      const h = hex(x + 67, 140, 50, {"stroke-width": hot(p[1]) ? 3.5 : 1.4, stroke: hot(p[1]) ? css("--hl") : css("--line")}); h.style.cursor = "pointer";
      h.addEventListener("click", () => { status.textContent = "② " + p[1] + " – szerződés: " + p[2]; });
      p[1].split(" ").forEach((w, j, arr) => T(x + 67, 140 + (j - (arr.length - 1) / 2) * 15 + 4, w, {"font-size": 12, "text-anchor": "middle", "pointer-events": "none"}));
      T(x + 67, 212, "szerződés:", {"font-size": 10.5, "text-anchor": "middle", fill: css("--muted")}); T(x + 67, 226, "séma, SLO, tulajdonos", {"font-size": 10.5, "text-anchor": "middle", fill: css("--muted")}); });
    CO.forEach((c, i) => { R(500, 60 + i * 55, 140, 34, {fill: hot(c) ? css("--cellhl") : css("--cell"), "stroke-width": hot(c) ? 3 : 1.2}); T(570, 82 + i * 55, c, {"font-size": 12.5, "text-anchor": "middle"}); });
    el("path", {d: "M 82,90 C 82,46 400,46 498,77", fill: "none", stroke: s.n >= 4 ? css("--hl") : css("--line"), "stroke-width": s.n >= 4 ? 2.4 : 1.2, "stroke-dasharray": s.n >= 4 ? "" : "4 3", "marker-end": s.n >= 4 ? "url(#arh)" : "url(#ar)"});
  }
}
function load(){ MODE = document.getElementById("md").value; setSteps(FL[MODE].map((x, i) => ({msg: (i + 1) + ". " + x[0], hot: x[1], mode: MODE, n: i}))); }
document.getElementById("md").addEventListener("change", load);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
