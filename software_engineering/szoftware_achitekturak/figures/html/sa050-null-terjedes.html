<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphQL null-terjedés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hibás mező: <select id="errsel"><option value="vevo">vevo</option><option value="termek">tetelek[0].termek</option><option value="osszeg">osszeg</option><option value="email">vevo.email</option><option value="menny">tetelek[0].mennyiseg</option></select></label><label><input type="checkbox" id="vn"> vevo: Vevo (nullable) – kikapcsolva a könyv sémája: Vevo!</label><span class="small">A fán bármely mezőre kattintva az lesz a hibás mező.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A GraphQL válaszfája; a hibás mező null értéke a legközelebbi nullable ősig terjed. A könyv sémájában a vevo non-null, ezért a rendeles mező lesz null."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Vastag folytonos keret: non-null (!), szaggatott: nullable; sraffozott: elveszett részfa. A szabály a GraphQL-specifikáció mezőhiba-kezelése; a mintaadat a 14.1.3 fixture-je.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. A resolverek lefutnak; minden mező értéket kapna.", "err": null, "cur": null, "nulled": null, "lost": [], "final": false}, {"msg": "2. Hiba a(z) vevo resolverében: a mező értéke null; errors[0].path = [\"rendeles\", \"vevo\"].", "err": "vevo", "cur": "vevo", "nulled": null, "lost": [], "final": false}, {"msg": "3. A(z) vevo non-null (Vevo!), a null a szülőre lép: rendeles.", "err": "vevo", "cur": "rendeles", "nulled": null, "lost": ["vevo", "vnev", "email"], "final": false}, {"msg": "4. A(z) rendeles nullable (Rendeles): itt megáll, rendeles = null.", "err": "vevo", "cur": "rendeles", "nulled": "rendeles", "lost": ["rendeles", "id", "vevo", "vnev", "email", "tetelek", "t0", "termek", "tnev", "menny", "ar", "osszeg", "ertek", "penznem"], "final": false}, {"msg": "5. Végső válasz: HTTP 200, a data és az errors együtt; elveszett részfa: rendeles.", "err": "vevo", "cur": "rendeles", "nulled": "rendeles", "lost": ["rendeles", "id", "vevo", "vnev", "email", "tetelek", "t0", "termek", "tnev", "menny", "ar", "osszeg", "ertek", "penznem"], "final": true, "json": "{\"data\":{\"rendeles\":null},\"errors\":[{\"path\":[\"rendeles\",\"vevo\"]}]}"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const NODES = [["data", null, "data", "", false, null], ["rendeles", "data", "rendeles", "Rendeles", false, null], ["id", "rendeles", "id", "ID!", true, "42"], ["vevo", "rendeles", "vevo", "Vevo!", true, null], ["vnev", "vevo", "nev", "String!", true, "Minta Vevő"], ["email", "vevo", "email", "String!", true, "vevo@example.invalid"], ["tetelek", "rendeles", "tetelek", "[Tetel!]!", true, null], ["t0", "tetelek", "[0]", "Tetel!", true, null], ["termek", "t0", "termek", "Termek!", true, null], ["tnev", "termek", "nev", "String!", true, "Minta Termék"], ["menny", "t0", "mennyiseg", "Int!", true, 2], ["ar", "t0", "ar.ertek", "Int!", true, 150000], ["osszeg", "rendeles", "osszeg", "Money!", true, null], ["ertek", "osszeg", "ertek", "Int!", true, 300000], ["penznem", "osszeg", "penznem", "String!", true, "HUF"]], PAR = {"data": null, "rendeles": "data", "id": "rendeles", "vevo": "rendeles", "vnev": "vevo", "email": "vevo", "tetelek": "rendeles", "t0": "tetelek", "termek": "t0", "tnev": "termek", "menny": "t0", "ar": "t0", "osszeg": "rendeles", "ertek": "osszeg", "penznem": "osszeg"}, KIDS = {"data": ["rendeles"], "rendeles": ["id", "vevo", "tetelek", "osszeg"], "id": [], "vevo": ["vnev", "email"], "vnev": [], "email": [], "tetelek": ["t0"], "t0": ["termek", "menny", "ar"], "termek": ["tnev"], "tnev": [], "menny": [], "ar": [], "osszeg": ["ertek", "penznem"], "ertek": [], "penznem": []};
let CFG = {err: "vevo", vn: false};
function nnul(i){ return i === "vevo" ? !CFG.vn : NODES.find(n => n[0] === i)[4]; }
function nm(i){ return NODES.find(n => n[0] === i)[2]; }
function ty(i){ return i === "vevo" ? (CFG.vn ? "Vevo" : "Vevo!") : NODES.find(n => n[0] === i)[3]; }
function sub(i){ let s = [i]; KIDS[i].forEach(c => { s = s.concat(sub(c)); }); return s; }
function pth(i){ const p = []; while (PAR[i]) { const n = nm(i); if (n === "[0]") p.push(0); else if (n === "ar.ertek") { p.push("ertek"); p.push("ar"); } else p.push(n); i = PAR[i]; } return p.reverse(); }
function bld(i, nul){ if (i === nul) return null; const n = NODES.find(m => m[0] === i);
  if (!KIDS[i].length) return n[5]; if (i === "tetelek") return KIDS[i].map(c => bld(c, nul));
  const o = {}; KIDS[i].forEach(c => { if (nm(c) === "ar.ertek") o.ar = {ertek: bld(c, nul)}; else o[nm(c)] = bld(c, nul); }); return o; }
function trace(err){
  const st = [{msg: "1. A resolverek lefutnak; minden mező értéket kapna.", err: null, cur: null, nulled: null, lost: [], final: false}];
  st.push({msg: "2. Hiba a(z) " + nm(err) + " resolverében: a mező értéke null; errors[0].path = " + JSON.stringify(pth(err)).replace(/,/g, ", ") + ".", err: err, cur: err, nulled: null, lost: [], final: false});
  let cur = err, n = 3;
  while (true) {
    if (nnul(cur)) { const p = PAR[cur]; st.push({msg: n + ". A(z) " + nm(cur) + " non-null (" + ty(cur) + "), a null a szülőre lép: " + nm(p) + ".", err: err, cur: p, nulled: null, lost: sub(cur), final: false}); cur = p; if (cur === "data") break; }
    else { st.push({msg: n + ". A(z) " + nm(cur) + " nullable (" + ty(cur) + "): itt megáll, " + nm(cur) + " = null.", err: err, cur: cur, nulled: cur, lost: sub(cur), final: false}); break; }
    n++;
  }
  const resp = {data: cur === "data" ? null : bld("data", cur), errors: [{path: pth(err)}]};
  st.push({msg: (n + 1) + ". Végső válasz: HTTP 200, a data és az errors együtt; elveszett részfa: " + nm(cur) + ".", err: err, cur: cur, nulled: cur, lost: sub(cur), final: true, json: JSON.stringify(resp)});
  return st;
}
function dep(i){ let d = 0; while (PAR[i]) { i = PAR[i]; d++; } return d; }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 " + (NODES.length * 24 + 20));
  svg.innerHTML = ""; defs0();
  const Y = {};
  NODES.forEach((n, r) => {
    const i = n[0], y = 14 + r * 24, x = 26 + dep(i) * 22; Y[i] = y;
    const lost = s.lost.includes(i) && i !== s.nulled, nn = nnul(i);
    let lab = (n[3] || i === "vevo") ? n[2] + ": " + ty(i) : n[2];
    if (n[5] !== null && !lost && !(s.nulled === i)) lab += " = " + JSON.stringify(n[5]);
    if (i === s.nulled) lab += "  → null";
    if (s.err && i === s.err && !s.final) lab += "  (hiba → null)";
    const w = 7.2 * lab.length + 14;
    if (n[1]) { const px = 26 + dep(n[1]) * 22 + 6; L(px, Y[n[1]] + 9, px, y, {stroke: css("--muted"), "stroke-width": 1}); L(px, y, x, y, {stroke: css("--muted"), "stroke-width": 1}); }
    const rc = R(x, y - 9, w, 18, {rx: 0, fill: lost ? "url(#hat)" : (i === s.cur ? css("--cellhl") : css("--cell")), "stroke-width": nn ? 2.4 : 1, "stroke-dasharray": (nn || i === "data") ? "" : "5 3", stroke: i === s.cur ? css("--hl") : css("--line")});
    rc.style.cursor = (i === "data" || i === "rendeles") ? "default" : "pointer";
    rc.addEventListener("click", () => { if (i === "data" || i === "rendeles") return; CFG.err = i; document.getElementById("errsel").value = i; setSteps(trace(i)); });
    T(x + 6, y + 4, lab, {"font-size": 12, "font-family": "ui-monospace,monospace", "pointer-events": "none"});
  });
  if (s.err) X(12, Y[s.err], 6);
  if (s.cur && s.cur !== s.err) { el("line", {x1: 12, y1: Y[s.err] - 10, x2: 12, y2: Y[s.cur] + 6, stroke: css("--hl2"), "stroke-width": 4, "marker-end": "url(#ar2)"}); }
  if (s.final) {
    const words = s.json.match(/.{1,46}/g), bx = 330, by = 300;
    R(bx, by - 16, 322, words.length * 16 + 28, {rx: 0, fill: css("--code")});
    T(bx + 8, by, "válasz (HTTP 200):", {"font-size": 12, "font-weight": "bold"});
    words.forEach((w, j) => T(bx + 8, by + 18 + j * 16, w, {"font-size": 12, "font-family": "ui-monospace,monospace"}));
  }
}
function recompute(){ CFG.err = document.getElementById("errsel").value; CFG.vn = document.getElementById("vn").checked; setSteps(trace(CFG.err)); }
document.getElementById("errsel").addEventListener("change", recompute);
document.getElementById("vn").addEventListener("change", recompute);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
