<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion-to-photon költségvetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sys:#e6e6e6;--ext:#cfcfcf;--comp:#f3f3f3;--wait:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sys:#3a3a3a;--ext:#4a4a4a;--comp:#303030;--wait:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
input[type=range]{min-width:90px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg);}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="Renderelési mód">
 <label>Mód: <select id="mode" aria-label="renderelési mód"><option value="helyi" selected>helyi</option><option value="edge">edge</option><option value="cloud">cloud</option></select></label>
 <label><input id="sch" type="checkbox" checked> renderelés a scan-outhoz ütemezve</label>
 <button id="reset">Alaphelyzet</button>
</div>
<div id="sliders" class="ctl" style="flex-direction:column;align-items:stretch;gap:2px"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 150" role="img" aria-label="Halmozott sáv: a komponensek késleltetése és a 20 ms-os cél"></svg>

<p class="small">Kezdőállapot: helyi, ütemezett renderelés, alsó becslés (12 ms). Edge: a hálózat egyirányú útja (RTT/2), plusz kódolás és dekódolás; cloud: szemléltető 25 ms egyirányú út. Ütemezés nélkül a megjelenítés 2 ms + 0–11,1 ms scan-out várakozás (90 Hz). Tervezési becslés, nem mért eredmény.</p>
<script>

const COMP = ["szenzor + bemenet", "feldolgozás", "renderelés", "kódolás", "hálózat (egyirányú)", "dekódolás", "scan-out + megjelenítés"], HATCH = ["dots", "diag", "cross", "rdiag", "hor", "plus", "solid"], PRESET = {"helyi": [2, 2, 6, 0, 0, 0, 2], "edge": [2, 2, 6, 2, 2.5, 1.5, 2], "cloud": [2, 2, 6, 2, 25, 1.5, 2]}, PERIOD = 11.1;
const NETRANGE = {helyi: 0, edge: 7.5, cloud: 60};
const NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
const svg = document.getElementById("v"), box = document.getElementById("sliders");
function f1(v){ return (Math.round(v * 10) / 10).toString().replace(".", ","); }
function ranges(mode, sch){
  return [[1, 6], [1, 8], [3, 14], mode === "helyi" ? null : [0.5, 6], mode === "helyi" ? null : [0.5, NETRANGE[mode]], mode === "helyi" ? null : [0.5, 4], sch ? [2, 5] : [2, 2 + PERIOD]];
}
function setup(){
  const mode = document.getElementById("mode").value, sch = document.getElementById("sch").checked, R = ranges(mode, sch);
  box.innerHTML = "";
  COMP.forEach((c, i) => {
    if (!R[i]) return;
    let v = PRESET[mode][i]; if (i === 6) v = sch ? 2 : 2 + PERIOD;
    v = Math.min(R[i][1], Math.max(R[i][0], v));
    const lab = document.createElement("label");
    lab.innerHTML = `<span style="display:inline-block;width:15em">${c}${i === 6 && !sch ? " (2 ms + várakozás 0–11,1)" : ""}:</span> <input id="c${i}" type="range" min="${R[i][0]}" max="${R[i][1]}" step="0.1" value="${v}" style="width:260px" aria-label="${c} (ms)"> <span id="c${i}v"></span> ms`;
    box.appendChild(lab);
    lab.querySelector("input").oninput = draw;
  });
  draw();
}
function draw(){
  const vals = COMP.map((c, i) => { const e = document.getElementById("c" + i); return e ? +e.value : 0; });
  vals.forEach((v, i) => { const s = document.getElementById("c" + i + "v"); if (s) s.textContent = f1(v); });
  const tot = vals.reduce((a, b) => a + b, 0), res = 20 - tot;
  document.getElementById("status").textContent = `Összeg: ${f1(tot)} ms; a 20 ms-os célhoz képest ${res >= 0 ? "tartalék " + f1(res) + " ms" : "TÚLLÉPÉS " + f1(-res) + " ms"} (tervezési becslés, nem mért eredmény).`;
  svg.innerHTML = "";
  const defs = mk(svg, "defs", {}), fg = css("--fg");
  defs.innerHTML = `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>` +
    `<pattern id="diag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}"/></pattern>` +
    `<pattern id="rdiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0 L0,6 M0,0 L6,0" stroke="${fg}"/></pattern>` +
    `<pattern id="hor" width="6" height="5" patternUnits="userSpaceOnUse"><line x1="0" y1="2.5" x2="6" y2="2.5" stroke="${fg}"/></pattern>` +
    `<pattern id="plus" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M4,1 L4,7 M1,4 L7,4" stroke="${fg}"/></pattern>` +
    `<pattern id="solid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="${css("--muted")}"/></pattern>`;
  const X = t => 20 + t / 40 * 600;
  for (let t = 0; t <= 40; t += 5) { mk(svg, "line", {x1: X(t), x2: X(t), y1: 20, y2: 78, stroke: css("--muted"), "stroke-dasharray": "1 3"}); mk(svg, "text", {x: X(t), y: 92, "text-anchor": "middle", "font-size": 11}, String(t)); }
  let x = 0;
  vals.forEach((v, i) => {
    if (v <= 0) return;
    mk(svg, "rect", {x: X(x), y: 30, width: X(x + v) - X(x), height: 40, fill: css("--bg"), stroke: "none"});
    mk(svg, "rect", {x: X(x), y: 30, width: X(x + v) - X(x), height: 40, fill: `url(#${HATCH[i]})`, stroke: css("--line")});
    x += v;
  });
  mk(svg, "line", {x1: X(20), x2: X(20), y1: 14, y2: 80, stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "6 4"});
  mk(svg, "text", {x: X(20), y: 11, "text-anchor": "middle", "font-size": 11.5}, "cél: 20 ms");
  mk(svg, "text", {x: Math.min(X(x) + 6, 600), y: 54, "font-size": 12, "font-weight": tot > 20 ? "bold" : "normal"}, f1(tot) + " ms");
  mk(svg, "text", {x: 320, y: 106, "text-anchor": "middle", "font-size": 11.5}, "késleltetés (ms)");
  // jelmagyarázat
  let lx = 20, ly = 122;
  vals.forEach((v, i) => { if (!document.getElementById("c" + i)) return; const w = 14 + COMP[i].length * 6.2; if (lx + w > 630) { lx = 20; ly += 16; } mk(svg, "rect", {x: lx, y: ly - 9, width: 12, height: 10, fill: `url(#${HATCH[i]})`, stroke: css("--line")}); mk(svg, "text", {x: lx + 16, y: ly, "font-size": 10.5}, COMP[i]); lx += w + 14; });
  svg.setAttribute("viewBox", `0 0 640 ${ly + 8}`);
}
document.getElementById("mode").onchange = setup;
document.getElementById("sch").onchange = setup;
document.getElementById("reset").onclick = () => { document.getElementById("mode").value = "helyi"; document.getElementById("sch").checked = true; setup(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setup();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
