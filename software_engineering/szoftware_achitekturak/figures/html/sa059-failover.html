<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Failover és adatvesztés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>mód: <select id="md"><option value="async">aszinkron</option><option value="sync">többségi szinkron (2/3)</option></select></label> <label>R1 lag: <input type="range" id="l1" min="0" max="5" value="2" style="width:70px"> <b id="v1">2</b></label> <label>R2 lag: <input type="range" id="l2" min="0" max="5" value="1" style="width:70px"> <b id="v2">1</b></label> <label>előléptetett: <select id="pr"><option value="R1">R1</option><option value="R2">R2</option></select></label> <label><input type="checkbox" id="fe" checked> fencing</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Aszinkron replikációnál a lemaradt replika előléptetése nyugtázott írásokat veszít; többségi szinkron replikációnál és a legfrissebb replika előléptetésével nem."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lag az írások számában mért lemaradás (modell, nem mérés). Többségi szinkron módban a nyugtázáshoz legalább egy replikának is rögzítenie kell az írást, ezért a frissebb replika lagja 0.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "w1 nyugtázva a leaderen (aszinkron: a replikák lemaradhatnak). Replikák: R1 w1-ig, R2 w1-ig.", "k": 1, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": false, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "w2 nyugtázva a leaderen (aszinkron: a replikák lemaradhatnak). Replikák: R1 w2-ig, R2 w2-ig.", "k": 2, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": false, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "w3 nyugtázva a leaderen (aszinkron: a replikák lemaradhatnak). Replikák: R1 w3-ig, R2 w3-ig.", "k": 3, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": false, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "w4 nyugtázva a leaderen (aszinkron: a replikák lemaradhatnak). Replikák: R1 w3-ig, R2 w4-ig.", "k": 4, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": false, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "w5 nyugtázva a leaderen (aszinkron: a replikák lemaradhatnak). Replikák: R1 w3-ig, R2 w4-ig.", "k": 5, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": false, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "A leader kiesik. R1 naplója w3-ig, R2 naplója w4-ig tart.", "k": 5, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": true, "prom": "", "lost": [], "split": false, "mode": "async"}, {"msg": "R1 előléptetve. Elveszett nyugtázott írások: 2 (w4, w5). Nem a legfrissebb replikát léptettük elő!", "k": 5, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": true, "prom": "R1", "lost": ["w4", "w5"], "split": false, "mode": "async"}, {"msg": "Fencing: a régi leader tokenje érvénytelen, nem fogadhat írást – nincs split-brain. Elveszett nyugtázott írások: 2.", "k": 5, "lg": {"L": 5, "R1": 3, "R2": 4}, "down": true, "prom": "R1", "lost": ["w4", "w5"], "split": false, "mode": "async"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

function render(s){
  svg.setAttribute("viewBox", "0 0 660 240");
  svg.innerHTML = ""; defs0();
  const rows = [["L", 40], ["R1", 100], ["R2", 160]];
  rows.forEach(([n, y]) => { const dead = n === "L" && s.down, prom = n === s.prom;
    T(56, y + 5, n + (prom ? " (új L)" : dead ? " ✗" : ""), {"font-size": 13, "font-weight": "bold", "text-anchor": "end", fill: prom ? css("--hl") : css("--fg")});
    for (let i = 1; i <= 5; i++) { const x = 70 + (i - 1) * 64, got = i <= Math.min(s.k, s.lg[n]), lostw = s.lost.includes("w" + i) && n === s.prom;
      if (i > s.k) { R(x, y - 16, 56, 32, {rx: 2, fill: "none", stroke: css("--muted"), "stroke-dasharray": "2 3"}); continue; }
      R(x, y - 16, 56, 32, {rx: 2, fill: got ? css("--fg") : css("--cell")}); T(x + 28, y + 5, "w" + i, {"font-size": 12, "text-anchor": "middle", fill: got ? css("--bg") : css("--fg")});
      if (lostw) X(x + 28, y, 12); }
    if (s.split && (n === "L" || prom)) { const x = 70 + 5 * 64; R(x, y - 16, 56, 32, {rx: 2, fill: "url(#hat)", stroke: css("--hl2"), "stroke-width": 2.5}); T(x + 28, y + 5, n === "L" ? "w6" : "w6′", {"font-size": 12, "text-anchor": "middle", "font-weight": "bold"}); } });
  if (s.down) L(20, 22, 640, 22, {stroke: css("--hl2"), "stroke-dasharray": "6 4"});
  T(10, 214, "elveszett nyugtázott írások: " + s.lost.length + (s.lost.length ? " (" + s.lost.join(", ") + ")" : ""), {"font-size": 14, "font-weight": "bold", fill: s.lost.length ? css("--hl2") : css("--fg")});
  T(10, 234, s.mode === "sync" ? "mód: többségi szinkron (2/3)" : "mód: aszinkron", {"font-size": 12, fill: css("--muted")});
}
function trace(){
  const mode = document.getElementById("md").value, l1 = +document.getElementById("l1").value, l2 = +document.getElementById("l2").value,
        prom = document.getElementById("pr").value, fence = document.getElementById("fe").checked;
  document.getElementById("v1").textContent = l1; document.getElementById("v2").textContent = l2;
  let a = l1, b = l2; if (mode === "sync") { if (a <= b) a = 0; else b = 0; }
  const lg = {L: 5, R1: 5 - a, R2: 5 - b}, st = [];
  for (let k = 1; k <= 5; k++) st.push({msg: "w" + k + " nyugtázva a leaderen" + (mode === "sync" ? " (legalább egy replika is tartósan rögzítette)" : " (aszinkron: a replikák lemaradhatnak)") + ". Replikák: R1 w" + Math.min(k, lg.R1) + "-ig, R2 w" + Math.min(k, lg.R2) + "-ig.", k: k, lg: lg, down: false, prom: "", lost: [], split: false, mode: mode});
  st.push({msg: "A leader kiesik. R1 naplója w" + lg.R1 + "-ig, R2 naplója w" + lg.R2 + "-ig tart.", k: 5, lg: lg, down: true, prom: "", lost: [], split: false, mode: mode});
  const lost = []; for (let i = lg[prom] + 1; i <= 5; i++) lost.push("w" + i);
  st.push({msg: prom + " előléptetve. Elveszett nyugtázott írások: " + lost.length + (lost.length ? " (" + lost.join(", ") + ")." : ".") + (lg[prom] < Math.max(lg.R1, lg.R2) ? " Nem a legfrissebb replikát léptettük elő!" : ""), k: 5, lg: lg, down: true, prom: prom, lost: lost, split: false, mode: mode});
  if (!fence) st.push({msg: "Fencing nélkül a régi leader visszatér és w6-ot fogad, az új leader w6′-t: split-brain, ütköző írások. Elveszett: " + lost.length + ".", k: 5, lg: lg, down: true, prom: prom, lost: lost, split: true, mode: mode});
  else st.push({msg: "Fencing: a régi leader tokenje érvénytelen, nem fogadhat írást – nincs split-brain. Elveszett nyugtázott írások: " + lost.length + ".", k: 5, lg: lg, down: true, prom: prom, lost: lost, split: false, mode: mode});
  return st;
}
function upd(){ const keep = +document.getElementById("pos").value; setSteps(trace()); show(keep); }
["md", "l1", "l2", "pr", "fe"].forEach(id => document.getElementById(id).addEventListener("input", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
