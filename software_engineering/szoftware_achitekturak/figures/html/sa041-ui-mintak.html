<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVC, MVP, MVVM</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="bad" onchange="setMode()"> hibás összeg (0): ArgumentException-ág</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három panel: a controller sablont választ, a presenter a nézetinterfészt hívja, a view-model értesítéssel frissíti a kötött nézetet; a modell egyikben sem függ a UI-tól."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Folytonos nyíl: függőség; szaggatott, számozott nyíl: futásidejű adatáramlás. A kódsorok az sa041 vázlataiból valók; az MVVM hibaágban az ErrorMessage settere a javított változat szerint OnPropertyChanged()-et hív. Az MVC-ben 3 lépés van, a 4. lépésben „kész”.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"k": 0, "mode": "ok", "msg": "Függőségek (folytonos nyíl = „ismeri”). A Modell egyik mintában sem függ a UI-tól; léptessen a „Mentés” esemény útjához."}, {"k": 1, "mode": "ok", "msg": "1. lépés – MVC: POST /Create → Controller; MVP: OnSaveClicked; MVVM: TwoWay kötés: NewNumber / NewAmount"}, {"k": 2, "mode": "ok", "msg": "2. lépés – MVC: CreateInvoice; MVP: GetInvoiceNumber / Amount / DueDate; MVVM: SaveCommand"}, {"k": 3, "mode": "ok", "msg": "3. lépés – MVC: View(lista) → sablon (siker: Redirect → Index); MVP: CreateInvoice; MVVM: CreateInvoice"}, {"k": 4, "mode": "ok", "msg": "4. lépés – MVC: kész; MVP: ShowInvoices + ShowMessage; MVVM: Invoices PropertyChanged → kötés"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PAT = [{"key": "mvc", "title": "MVC (webes, kérés-vezérelt)", "view": "Nézet\n(Razor-sablon)", "mid": "InvoiceController", "deps": [["M", "D", ""], ["M", "V", "sablon-\nválasztás"], ["V", "D", "olvasás"]], "ok": [["V", "M", "POST /Create → Controller", "[HttpPost] public IActionResult Create(string number, decimal amount, DateTime dueDate)"], ["M", "D", "CreateInvoice", "_service.CreateInvoice(number, amount, dueDate);"], ["M", "V", "View(lista) → sablon (siker: Redirect → Index)", "return RedirectToAction(nameof(Index));  // Index: return View(invoices);"]], "err": [["V", "M", "POST /Create (összeg = 0)", "[HttpPost] public IActionResult Create(string number, decimal amount, DateTime dueDate)"], ["M", "D", "CreateInvoice → ArgumentException", "_service.CreateInvoice(number, amount, dueDate);  // throw ArgumentException"], ["M", "V", "ModelState-hiba + View(\"Index\", lista)", "ModelState.AddModelError(string.Empty, ex.Message); return View(\"Index\", _service.GetInvoices());"]]}, {"key": "mvp", "title": "MVP (passive view)", "view": "Nézet\n(IInvoiceView megv.)", "mid": "InvoicePresenter", "deps": [["M", "D", ""], ["M", "V", "IInvoiceView"], ["V", "M", ""]], "ok": [["V", "M", "OnSaveClicked", "public void OnSaveClicked()"], ["M", "V", "GetInvoiceNumber / Amount / DueDate", "var number = _view.GetInvoiceNumber(); var amount = _view.GetInvoiceAmount(); ..."], ["M", "D", "CreateInvoice", "_service.CreateInvoice(number, amount, dueDate);"], ["M", "V", "ShowInvoices + ShowMessage", "_view.ShowInvoices(_service.GetInvoices()); _view.ShowMessage(\"Sikeres mentés.\");"]], "err": [["V", "M", "OnSaveClicked", "public void OnSaveClicked()"], ["M", "V", "GetInvoiceNumber / Amount (0) / DueDate", "var number = _view.GetInvoiceNumber(); var amount = _view.GetInvoiceAmount(); ..."], ["M", "D", "CreateInvoice → ArgumentException", "_service.CreateInvoice(number, amount, dueDate);  // throw ArgumentException"], ["M", "V", "ShowError", "_view.ShowError(ex.Message);"]]}, {"key": "mvvm", "title": "MVVM", "view": "Nézet\n(XAML, kötések)", "mid": "InvoiceViewModel", "deps": [["M", "D", ""], ["V", "M", "kötés"]], "ok": [["V", "M", "TwoWay kötés: NewNumber / NewAmount", "<TextBox Text=\"{Binding NewNumber, Mode=TwoWay}\" />"], ["V", "M", "SaveCommand", "<Button Command=\"{Binding SaveCommand}\">Mentés</Button>"], ["M", "D", "CreateInvoice", "_service.CreateInvoice(NewNumber, NewAmount, NewDueDate);"], ["M", "V", "Invoices PropertyChanged → kötés", "LoadInvoices();  // Invoices = new ObservableCollection<Invoice>(...) → OnPropertyChanged()"]], "err": [["V", "M", "TwoWay kötés: NewAmount = 0", "<TextBox Text=\"{Binding NewAmount, Mode=TwoWay}\" />"], ["V", "M", "SaveCommand", "<Button Command=\"{Binding SaveCommand}\">Mentés</Button>"], ["M", "D", "CreateInvoice → ArgumentException", "_service.CreateInvoice(NewNumber, NewAmount, NewDueDate);  // throw ArgumentException"], ["M", "V", "ErrorMessage PropertyChanged → kötés", "ErrorMessage = ex.Message;  // a setter OnPropertyChanged()-et hív (T-S5-009)"]]}];
function stepsFor(mode){
  const out = [{k: 0, mode: mode, msg: "Függőségek (folytonos nyíl = „ismeri”). A Modell egyik mintában sem függ a UI-tól; léptessen a „Mentés” esemény útjához."}];
  for (let k = 0; k < 4; k++) out.push({k: k + 1, mode: mode, msg: `${k + 1}. lépés – ` + PAT.map(p => p.key.toUpperCase() + ": " + (k < p[mode].length ? p[mode][k][2] : "kész")).join("; ")});
  return out;
}
function setMode(){ setSteps(stepsFor(document.getElementById("bad").checked ? "err" : "ok")); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 960 470");
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const Y = {V: 50, M: 175, D: 290}, H = {V: 46, M: 40, D: 56};
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker>` +
    `<marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`;
  svg.appendChild(defs);
  PAT.forEach((p, i) => {
    const x0 = 15 + i * 320, bx = x0 + 40, bw = 250;
    el("text", {x: x0 + 150, y: 24, "text-anchor": "middle", "font-size": 15, "font-weight": "bold"}, p.title);
    [["V", p.view.replace("\n", " ")], ["M", p.mid], ["D", "Modell: InvoiceService + IInvoiceRepository"]].forEach(([n, t]) => {
      el("rect", {x: bx, y: Y[n], width: bw, height: H[n], rx: 6, fill: n === "M" ? css("--cellhl") : css("--cell"), stroke: fg, "stroke-width": 1.4});
      el("text", {x: bx + bw / 2, y: Y[n] + H[n] / 2 + 5, "text-anchor": "middle", "font-size": n === "D" ? 11.5 : 13}, t);
    });
    el("text", {x: bx + bw / 2, y: Y.D + H.D + 16, "text-anchor": "middle", "font-size": 11.5, "font-style": "italic"}, "nem függ a UI-tól");
    const dx = {"M>D": 70, "M>V": 70, "V>M": 100};
    p.deps.forEach(([a, b, lab]) => {
      if (a === "V" && b === "D") {
        el("path", {d: `M ${bx} ${Y.V + 30} C ${bx - 45} ${Y.V + 90}, ${bx - 45} ${Y.D - 10}, ${bx} ${Y.D + 20}`, fill: "none", stroke: fg, "stroke-width": 1.5, "marker-end": "url(#ah)"});
        el("text", {x: bx - 30, y: Y.M + 24, "text-anchor": "middle", "font-size": 11}, lab.replace("\n", ""));
        return;
      }
      const x = bx + dx[a + ">" + b], down = Y[a] > Y[b] ? false : true;
      const y0 = down ? Y[a] + H[a] : Y[a], y1 = down ? Y[b] : Y[b] + H[b];
      el("line", {x1: x, y1: y0, x2: x, y2: y1, stroke: fg, "stroke-width": 1.8, "marker-end": "url(#ah)"});
      if (lab) el("text", {x: x - 5, y: (y0 + y1) / 2 + 4, "text-anchor": "end", "font-size": 11}, lab.replace("-\n", ""));
    });
    const fl = p[s.mode];
    fl.forEach(([a, b, lab, code], k) => {
      if (k + 1 > s.k) return;
      const cur = k + 1 === s.k, x = bx + 140 + 28 * k, down = Y[a] < Y[b];
      const y0 = down ? Y[a] + H[a] : Y[a], y1 = down ? Y[b] : Y[b] + H[b];
      el("line", {x1: x, y1: y0, x2: x, y2: y1, stroke: cur ? hl : mu, "stroke-width": cur ? 3 : 1.4, "stroke-dasharray": "6 4", "marker-end": cur ? "url(#ah2)" : "url(#ah)"});
      el("circle", {cx: x, cy: (y0 + y1) / 2, r: 9, fill: css("--bg"), stroke: cur ? hl : fg, "stroke-width": cur ? 2.2 : 1});
      el("text", {x: x, y: (y0 + y1) / 2 + 4, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, String(k + 1));
    });
    // lépéslista és az aktuális kódsor
    fl.forEach(([a, b, lab], k) => el("text", {x: x0 + 8, y: 380 + 15 * k, "font-size": 11.5, "font-weight": k + 1 === s.k ? "bold" : "normal", fill: k + 1 <= s.k ? fg : mu}, `${k + 1} ${lab}`));
  });
  if (s.k > 0) {
    const lines = PAT.map(p => p.key.toUpperCase() + ": " + (s.k <= p[s.mode].length ? p[s.mode][s.k - 1][3] : "(nincs több lépés)"));
    codeEl.style.display = "block";
    codeEl.textContent = lines.join("\n");
  } else { codeEl.style.display = "block"; codeEl.textContent = "// a lépésekhez tartozó kódsorok (sa041)"; }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
