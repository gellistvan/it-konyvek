<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liveness és readiness idővonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="first">⏮</button><button id="prev">◀ 1 s</button><button id="play">▶ Lejátszás</button><button id="next">1 s ▶</button><button id="scA">A) toggle-ready 20 s-kor</button><button id="scB">B) stall 20 s-kor</button><button id="clr">Törlés (t = 0)</button><button id="tog">toggle-ready most</button><button id="stl">stall most</button><label>readiness period <input id="rp" type="range" min="1" max="10" value="5"> <span id="rpv"></span> s</label><label>küszöb <input id="rf" type="range" min="1" max="5" value="3"> <span id="rfv"></span></label><label>liveness period <input id="lp" type="range" min="2" max="20" value="10"> <span id="lpv"></span> s</label><label>küszöb <input id="lf" type="range" min="1" max="5" value="3"> <span id="lfv"></span></label><label><input id="common" type="checkbox"> közös végpont a két probe-hoz</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 270" role="img" aria-label="Readiness- és liveness-próbák idővonala, a Ready állapot és a konténer élettartama hibainjektálás után"></svg>

<p class="small">Determinisztikus modell, szemléltetés: a próbák az initialDelay + k·period időpontokban futnak (readiness initialDelay 2 s, liveness 5 s); a valóságban a fázis legfeljebb egy periódussal eltolódhat. Kör = sikeres, X = hibás, kiemelt X = a küszöböt elérő hiba. Kezdőállapot: a B forgatókönyv.</p>
<script>
const DATA = {};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let t = 60, timer = null, events = {20: "stall"};
const g = id => document.getElementById(id);
function simulate(events, p, common, tEnd){
  let cs = 0, st = {ready: true, stalled: false}, ready = false, rf = 0, lf = 0;
  const probes = [], restarts = [], series = [];
  for (let t = 0; t <= tEnd; t++) {
    if (events[t] === "toggle") st.ready = !st.ready; else if (events[t] === "stall") st.stalled = true;
    const readyz = st.ready && !st.stalled, healthz = common ? readyz : !st.stalled, rel = t - cs;
    if (rel >= p.r_init && (rel - p.r_init) % p.r_per === 0) {
      if (readyz) { rf = 0; probes.push([t, "r", true, false]); ready = true; }
      else { rf++; const hit = rf === p.r_ft; probes.push([t, "r", false, hit]); if (hit) ready = false; }
    }
    let re = false;
    if (rel >= p.l_init && (rel - p.l_init) % p.l_per === 0) {
      if (healthz) { lf = 0; probes.push([t, "l", true, false]); }
      else { lf++; const hit = lf === p.l_ft; probes.push([t, "l", false, hit]); if (hit) re = true; }
    }
    if (re) { restarts.push(t); cs = t; st = {ready: true, stalled: false}; rf = lf = 0; ready = false; }
    series.push(ready);
  }
  return {probes, restarts, series};
}
function params(){ return {r_init: 2, r_per: +g("rp").value, r_ft: +g("rf").value, l_init: 5, l_per: +g("lp").value, l_ft: +g("lf").value}; }
function draw(){
  ["rp", "rf", "lp", "lf"].forEach(id => g(id + "v").textContent = g(id).value);
  const r = simulate(events, params(), g("common").checked, 60);
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg"), hl = css("--hl2");
  const x0 = 150, w = 590, X = s => x0 + s / 60 * w, rows = {r: 40, ready: 95, l: 150, alive: 205};
  [["readiness-próba", "r"], ["Ready / EndpointSlice", "ready"], ["liveness-próba", "l"], ["konténer él", "alive"]].forEach(([lab, k]) =>
    mk(svg, "text", {x: x0 - 8, y: rows[k] + 4, "text-anchor": "end", "font-size": 12}, lab));
  for (let s = 0; s <= 60; s += 5) { mk(svg, "line", {x1: X(s), x2: X(s), y1: 20, y2: 225, stroke: css("--muted"), "stroke-dasharray": "1 3"});
    mk(svg, "text", {x: X(s), y: 244, "text-anchor": "middle", "font-size": 11}, String(s)); }
  mk(svg, "text", {x: X(30), y: 262, "text-anchor": "middle", "font-size": 12}, "idő (s)");
  for (let s = 0; s < Math.min(t, 60); s++) if (r.series[s]) mk(svg, "rect", {x: X(s), y: rows.ready - 10, width: X(1) - X(0), height: 20, fill: "url(#ph)", stroke: "none"});
  const cuts = [0, ...r.restarts.filter(x => x <= t), Math.min(t, 60)];
  for (let i = 0; i < cuts.length - 1; i++) { mk(svg, "rect", {x: X(cuts[i]), y: rows.alive - 10, width: Math.max(0, X(cuts[i+1]) - X(cuts[i]) - 3), height: 20, fill: css("--fill3"), stroke: fg});
    mk(svg, "text", {x: X(cuts[i]) + 4, y: rows.alive + 4, "font-size": 11}, `${i + 1}. konténer`); }
  r.probes.filter(p => p[0] <= t).forEach(([s, k, ok, hit]) => { const cx = X(s), cy = rows[k];
    if (ok) mk(svg, "circle", {cx, cy, r: 5, fill: css("--bg"), stroke: fg, "stroke-width": 1.5});
    else { const d = hit ? 8 : 5; mk(svg, "path", {d: `M${cx-d},${cy-d} L${cx+d},${cy+d} M${cx+d},${cy-d} L${cx-d},${cy+d}`, stroke: hit ? hl : fg, "stroke-width": hit ? 3.5 : 2}); } });
  Object.keys(events).forEach(s => { if (+s <= t) { mk(svg, "line", {x1: X(+s), x2: X(+s), y1: 18, y2: 225, stroke: hl, "stroke-dasharray": "6 3", "stroke-width": 1.5});
    mk(svg, "text", {x: X(+s) + 3, y: 16, "font-size": 11, fill: hl}, events[s] === "stall" ? "stall" : "toggle-ready"); } });
  if (t < 60) mk(svg, "line", {x1: X(t), x2: X(t), y1: 20, y2: 225, stroke: fg, "stroke-width": 2});
  const nR = r.restarts.filter(x => x <= t).length, rdy = r.series[Math.min(t, 60)];
  status.textContent = `t = ${t} s: Ready = ${rdy ? "true (az EndpointSlice-ban)" : "false (nincs az EndpointSlice-ban)"}, RESTARTS = ${nR}.` +
    (Object.keys(events).length ? " Hibainjektálás: " + Object.entries(events).map(([s, e]) => `${s} s ${e === "stall" ? "/debug/stall" : "/debug/toggle-ready"}`).join(", ") + "." : "");
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
g("play").onclick = () => { if (timer) { stop(); return; } if (t >= 60) t = 0; g("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (t >= 60) stop(); else { t++; draw(); } }, 250); };
g("prev").onclick = () => { stop(); t = Math.max(0, t - 1); draw(); };
g("next").onclick = () => { stop(); t = Math.min(60, t + 1); draw(); };
g("first").onclick = () => { stop(); t = 0; draw(); };
g("scA").onclick = () => { stop(); events = {20: "toggle"}; t = 60; draw(); };
g("scB").onclick = () => { stop(); events = {20: "stall"}; t = 60; draw(); };
g("clr").onclick = () => { stop(); events = {}; t = 0; draw(); };
g("tog").onclick = () => { events[t] = "toggle"; draw(); };
g("stl").onclick = () => { events[t] = "stall"; draw(); };
["rp", "rf", "lp", "lf", "common"].forEach(id => g(id).oninput = g(id).onchange = draw);
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") g("next").click(); if (e.key === "ArrowLeft") g("prev").click(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
