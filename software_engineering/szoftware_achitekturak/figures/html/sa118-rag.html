<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG lekérdezési út</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Felhasználó szerepköre: <select onchange="setRole(this.value)" aria-label="Felhasználó szerepköre"><option>ügyintéző</option><option>vezető</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a dokumentumok darabolása és beágyazása a vektoradatbázisba, alul a jogosultság szerint szűrt visszakeresés, újrarendezés és forrásazonosítós generálás; a szerepkör váltása megváltoztatja a visszakeresett darabok listáját."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Általános, termékfüggetlen vázlat; a dokumentumkészlet és a hasonlósági pontszámok szintetikus, szemléltető értékek (nem modellkimenet). A jogosultsági szűrés a visszakeresésnél, a generálás előtt történik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"c": "user", "msg": "1. A felhasználó kérdez (identitás és szerepkör a munkamenetből): „Mennyi időn belül kell jóváhagyni a szabadságkérelmet, és mekkora keretig dönthet a vezető önállóan?”"}, {"c": "app", "msg": "2. Alkalmazás-integráció: a kérdés és a felhasználó szerepköre továbbítódik."}, {"c": "qemb", "msg": "3. Kérdés-embedding: a kérdés vektorrá alakul (ugyanazzal a modellel, mint az indexelés)."}, {"c": "ret", "msg": "4. Retriever: hibrid keresés; a JOGOSULTSÁGI SZŰRŐ a metaadaton a rangsorolás előtt dob ki minden olyan darabot, amelyhez a szerepkörnek nincs hozzáférése. Mérőpont: recall@5."}, {"c": "rr", "msg": "5. Reranker (opcionális): a jelöltek finomabb újrarendezése."}, {"c": "prompt", "msg": "6. Promptösszeállítás: minden darab forrásazonosítóval (dok-ID, verzió, szakasz)."}, {"c": "llm", "msg": "7. LLM: generálás a kontextusból. Mérőpont: TTFT (első token ideje)."}, {"c": "ans", "msg": "8. Válasz forráshivatkozásokkal; hűségellenőrzés: minden állítás egy visszakeresett forráshoz rendelhető-e. Mérőpont: hűség."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const COMP = {"src": [0, 3.55, "Dokumentum-\nforrás: ID, verzió,\nidő, hozzáf. o.", "off"], "ext": [1, 3.55, "Kinyerés,\ntisztítás", "off"], "chunk": [2, 3.55, "Darabolás\n(méret, átfedés)", "off"], "emb": [3, 3.55, "Embedding-\nmodell", "off"], "vdb": [4, 3.55, "Vektor-\nadatbázis: vektor\n+ metaadat (ID,\nszakasz, hozzáf. o.)", "off"], "user": [0, 2.15, "Felhasználó\n(identitás,\nszerepkör)", "on"], "app": [1, 2.15, "Alkalmazás-\nintegráció", "on"], "qemb": [2, 2.15, "Kérdés-\nembedding", "on"], "ret": [3, 2.15, "Retriever\n(hibrid)\nJOGOSULTSÁGI\nSZŰRŐ", "on"], "rr": [4, 2.15, "Reranker\n(opcionális)", "opt"], "prompt": [4, 1.0, "Prompt\nforrás-\nazonosítókkal", "on"], "llm": [3, 1.0, "LLM\n(generálás)", "on"], "ans": [2, 1.0, "Válasz forrás-\nhivatkozásokkal", "on"], "faith": [1, 1.0, "Hűség-\nellenőrzés\n(állítás–forrás)", "on"]}, FON = ["user", "app", "qemb", "ret", "rr", "prompt", "llm", "ans", "faith"], FOFF = ["src", "ext", "chunk", "emb", "vdb"], CH = [{"id": "D1 v3 §4", "t": "Szabadságkérelem jóváhagyási határideje: 5 munkanap", "cls": "mindenki", "sim": 0.82}, {"id": "D2 v1 §1", "t": "Vezetői önálló jóváhagyási keret", "cls": "vezető", "sim": 0.78}, {"id": "D1 v3 §2", "t": "Szabadságkérelem benyújtása", "cls": "mindenki", "sim": 0.71}, {"id": "D4 v1 §3", "t": "Túlóra elszámolása", "cls": "mindenki", "sim": 0.4}, {"id": "D3 v2 §5", "t": "Bérsávok 2026", "cls": "vezető", "sim": 0.22}, {"id": "D5 v1 §1", "t": "Céges autó igénylése", "cls": "mindenki", "sim": 0.15}], ROLES = {"ügyintéző": ["mindenki"], "vezető": ["mindenki", "vezető"]}, G = {"W": 6.4, "H": 4.45, "X0": 0.05, "COLW": 1.285, "BW": 1.17, "BH": 0.72, "YOFF": 3.55, "YA": 2.15, "YB": 1.0};
let ROLE = "ügyintéző";
function retrieve(role){ return CH.filter(c => ROLES[role].includes(c.cls)).sort((a, b) => b.sim - a.sim).slice(0, 5); }
function setRole(r){ ROLE = r; show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 590");
  const fg = css("--fg"), hl = css("--hl2"), mu = css("--muted"), S = 125, X = v => v * S, Y = v => (G.H - v) * S - 10;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`;
  svg.appendChild(defs);
  const cxv = c => G.X0 + c * G.COLW + G.BW / 2, idx = FON.indexOf(s.c);
  el("rect", {x: X(0.02), y: Y(G.YOFF + 0.82), width: X(G.W - 0.04), height: X(1.42), fill: "none", stroke: mu, "stroke-dasharray": "8 4"});
  el("text", {x: X(0.08), y: Y(G.YOFF + 0.62), "font-size": 13, "font-weight": "bold"}, "Offline indexelés");
  el("rect", {x: X(0.02), y: Y(G.YA + 0.55), width: X(G.W - 0.04), height: X(G.YA - G.YB + 1.05), fill: "none", stroke: fg});
  el("text", {x: X(0.08), y: Y(G.YA + 0.42), "font-size": 13, "font-weight": "bold"}, "Online lekérdezés");
  Object.entries(COMP).forEach(([kk, [c, y, t, fr]]) => {
    const on = kk === s.c, done = FON.includes(kk) && FON.indexOf(kk) <= idx, h = G.BH + (kk === "vdb" || kk === "src" ? 0.1 : 0);
    el("rect", {x: X(G.X0 + c * G.COLW), y: Y(y + h / 2), width: X(G.BW), height: X(h), rx: 7, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : (fr === "off" || done ? fg : mu), "stroke-width": on ? 3.5 : 1.3, "stroke-dasharray": fr === "off" ? "6 3" : (fr === "opt" ? "2 3" : "")});
    const L = t.split("\n"); L.forEach((l, j) => el("text", {x: X(cxv(c)), y: Y(y) + 5 + (j - (L.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 11.5, "font-weight": kk === "ret" ? "bold" : "normal"}, l));
  });
  const A = (a, b, act) => { const [ca, ya] = COMP[a], [cb, yb] = COMP[b]; let p0, p1;
    if (ya === yb) { p0 = [G.X0 + ca * G.COLW + (cb > ca ? G.BW : 0), ya]; p1 = [G.X0 + cb * G.COLW + (cb > ca ? 0 : G.BW), yb]; }
    else { p0 = [cxv(ca), ya - G.BH / 2]; p1 = [cxv(cb), yb + G.BH / 2]; }
    el("line", {x1: X(p0[0]), y1: Y(p0[1]), x2: X(p1[0]), y2: Y(p1[1]), stroke: act ? hl : fg, "stroke-width": act ? 3 : 1.3, "marker-end": act ? "url(#ah2)" : "url(#ah)"}); };
  FOFF.slice(1).forEach((b, i) => A(FOFF[i], b, false));
  FON.slice(1).forEach((b, i) => A(FON[i], b, i + 1 === idx));
  el("line", {x1: X(cxv(4) - 0.3), y1: Y(G.YOFF - G.BH / 2 - 0.08), x2: X(cxv(3) + 0.3), y2: Y(G.YA + G.BH / 2), stroke: s.c === "ret" ? hl : fg, "stroke-width": s.c === "ret" ? 3 : 1.3, "stroke-dasharray": "6 4", "marker-end": s.c === "ret" ? "url(#ah2)" : "url(#ah)"});
  // jelöltlista (a retriever lépéstől)
  if (idx >= 3) {
    const R = retrieve(ROLE), all = CH.slice().sort((a, b) => b.sim - a.sim);
    el("text", {x: 8, y: 502, "font-size": 12.5, "font-weight": "bold"}, `Visszakeresett darabok (szerepkör: ${ROLE}; hasonlóság szemléltető érték):`);
    all.forEach((c, i) => { const inR = R.some(r => r.id === c.id), allowed = ROLES[ROLE].includes(c.cls), x = 8 + (i % 2) * 396, y = 524 + Math.floor(i / 2) * 21;
      el("text", {x: x, y: y, "font-size": 11.5, fill: inR ? fg : mu, "text-decoration": allowed ? "none" : "line-through"}, `${inR ? "✓" : (allowed ? "–" : "✗")} [${c.id}] ${c.t.slice(0, 28)} (${c.sim.toFixed(2).replace(".", ",")})${allowed ? (inR ? "" : " – kívül esik a top-5-ön") : " – szűrő: vezetői"}`); });
    status.textContent = s.msg + ` – ${ROLE}: ${R.length} darab a jelöltek között (${R.map(r => r.id).join(", ")}); ${CH.length - CH.filter(c => ROLES[ROLE].includes(c.cls)).length} darabot a szűrő kizárt.`;
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
