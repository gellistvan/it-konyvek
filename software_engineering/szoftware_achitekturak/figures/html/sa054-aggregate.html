<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aggregate-határ</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>forgatókönyv: <select id="sc"><option value="ok">helyes: visszaigazol(foglalas)</option><option value="bad">hibás: közvetlen tételmódosítás</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A Megrendeles aggregate gyökere védi a tételeket; más aggregate-ekre csak azonosítóval hivatkozik. A hibás forgatókönyvben a közvetlen tételmódosítás megsérti az összérték ≥ 0 invariánst."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető mintaadat (T1 2 × 4990, T2 1 × 12990, T3 3 × 1500 HUF). Vastag keret: root; lekerekített: értékobjektum; pontozott: külső aggregate, amelyre a root csak azonosítóval hivatkozik.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiinduló állapot: a Megrendeles aggregate három tétellel, állapot: létrehozva.", "line": 0, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": false, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "A KeszletFoglalas aggregate (külön tranzakcióban) mindhárom tételt lefoglalta; a root csak a FoglalasId-t ismeri.", "line": 1, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "A Szamlazas szolgáltatás a root metódusát hívja: megrendeles.visszaigazol(foglalas).", "line": 2, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Invariáns-ellenőrzés a rootban: összérték ≥ 0 és minden tétel lefoglalt – mindkettő igaz.", "line": 3, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Állapotváltás egy tranzakcióban: allapot = visszaigazolva.", "line": 4, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "visszaigazolva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Domain esemény: MegrendelesVisszaigazolva (az Ugyfel és a Szamlazas ebből értesül, nem közvetlen hívással).", "line": 5, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "visszaigazolva", "event": "MegrendelesVisszaigazolva", "bad": null, "kind": "ok"}];
const CODE = ["// kiindulás: Megrendeles (root) + 3 MegrendelesTetel (értékobjektum)", "foglalas = keszletFoglalas.foglal(megrendelesId)      // másik aggregate, külön tranzakció", "megrendeles.visszaigazol(foglalas)                     // csak a root metódusa", "  require(osszertek() >= 0 && mindenTetelLefoglalt(foglalas))", "  allapot = VISSZAIGAZOLVA                              // egy tranzakció", "  esemenyek.add(MegrendelesVisszaigazolva(id))", "tetel = megrendeles.tetelek[1]   // HIBÁS: belső elem kiszivárog", "tetel.mennyiseg = -3             // HIBÁS: invariáns-ellenőrzés nélkül"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const OK = [{"msg": "Kiinduló állapot: a Megrendeles aggregate három tétellel, állapot: létrehozva.", "line": 0, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": false, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "A KeszletFoglalas aggregate (külön tranzakcióban) mindhárom tételt lefoglalta; a root csak a FoglalasId-t ismeri.", "line": 1, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "A Szamlazas szolgáltatás a root metódusát hívja: megrendeles.visszaigazol(foglalas).", "line": 2, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Invariáns-ellenőrzés a rootban: összérték ≥ 0 és minden tétel lefoglalt – mindkettő igaz.", "line": 3, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "létrehozva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Állapotváltás egy tranzakcióban: allapot = visszaigazolva.", "line": 4, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "visszaigazolva", "event": null, "bad": null, "kind": "ok"}, {"msg": "Domain esemény: MegrendelesVisszaigazolva (az Ugyfel és a Szamlazas ebből értesül, nem közvetlen hívással).", "line": 5, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": true, "allapot": "visszaigazolva", "event": "MegrendelesVisszaigazolva", "bad": null, "kind": "ok"}], BAD = [{"msg": "Kiinduló állapot: a Megrendeles aggregate három tétellel, állapot: létrehozva.", "line": 0, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": false, "allapot": "létrehozva", "event": null, "bad": null, "kind": "bad"}, {"msg": "Hibás kód a rooton kívül szerez referenciát egy tételre: tetel = megrendeles.tetelek[1].", "line": 6, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", 1, 12990], ["T3", "P-309", 3, 1500]], "ossz": 27470, "inv1": true, "inv2": false, "allapot": "létrehozva", "event": null, "bad": "T2", "kind": "bad"}, {"msg": "Közvetlen módosítás: tetel.mennyiseg = −3 – a root nem fut le, nincs ellenőrzés.", "line": 7, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", -3, 12990], ["T3", "P-309", 3, 1500]], "ossz": -24490, "inv1": false, "inv2": false, "allapot": "létrehozva", "event": null, "bad": "T2", "kind": "bad"}, {"msg": "Az invariáns sérül: összérték = -24490 Ft < 0. Ezt csak a rooton át végzett módosítás akadályozta volna meg.", "line": 7, "t": [["T1", "P-101", 2, 4990], ["T2", "P-207", -3, 12990], ["T3", "P-309", 3, 1500]], "ossz": -24490, "inv1": false, "inv2": false, "allapot": "létrehozva", "event": null, "bad": "T2", "kind": "bad"}];
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330");
  svg.innerHTML = ""; defs0();
  R(120, 10, 360, 230, {rx: 10, fill: css("--cell"), "stroke-dasharray": "6 4"});
  T(300, 28, "Megrendeles aggregate – egy tranzakció", {"font-size": 12.5, "font-weight": "bold", "text-anchor": "middle"});
  R(205, 38, 190, 56, {rx: 0, "stroke-width": 3.2, fill: s.line >= 2 && s.line <= 5 ? css("--cellhl") : css("--cell")});
  T(300, 56, "Megrendeles «root»", {"font-size": 12.5, "font-weight": "bold", "text-anchor": "middle"});
  T(300, 73, "allapot: " + s.allapot, {"font-size": 12, "text-anchor": "middle"});
  T(300, 88, "visszaigazol(foglalas)", {"font-size": 11.5, "text-anchor": "middle", "font-family": "ui-monospace,monospace"});
  s.t.forEach((t, i) => { const x = 130 + i * 116, bad = s.bad === t[0];
    R(x, 120, 108, 62, {rx: 14, fill: bad && t[2] < 0 ? "url(#hat)" : (bad ? css("--cellhl") : css("--cell")), stroke: bad ? css("--hl2") : css("--line"), "stroke-width": bad ? 2.6 : 1.2});
    L(x + 54, 120, 300, 94, {"stroke-width": 0.9});
    T(x + 54, 140, t[0] + " " + t[1], {"font-size": 11.5, "text-anchor": "middle"});
    T(x + 54, 157, "mennyiség: " + String(t[2]).replace("-", "−"), {"font-size": 11.5, "text-anchor": "middle", "font-weight": t[2] < 0 ? "bold" : "normal"});
    T(x + 54, 173, "Penz(" + t[3] + ", HUF)", {"font-size": 11, "text-anchor": "middle"}); });
  R(230, 196, 140, 34, {rx: 12}); T(300, 211, "összérték", {"font-size": 11.5, "text-anchor": "middle"}); T(300, 225, String(s.ossz).replace("-", "−") + " HUF", {"font-size": 12, "text-anchor": "middle", "font-weight": "bold"});
  R(520, 30, 130, 44, {rx: 0, "stroke-dasharray": "2 3"}); T(585, 50, "Ugyfel", {"font-size": 12, "text-anchor": "middle"}); T(585, 66, "aggregate", {"font-size": 11, "text-anchor": "middle"});
  R(520, 150, 130, 44, {rx: 0, "stroke-dasharray": "2 3", fill: s.line >= 1 && s.kind === "ok" ? css("--cellhl") : css("--cell")}); T(585, 170, "KeszletFoglalas", {"font-size": 12, "text-anchor": "middle"}); T(585, 186, "aggregate", {"font-size": 11, "text-anchor": "middle"});
  A(395, 52, 518, 52, {"stroke-dasharray": "5 3"}); T(456, 46, "UgyfelId", {"font-size": 11, "text-anchor": "middle"});
  A(395, 80, 518, 165, {"stroke-dasharray": "5 3"}); T(470, 112, "FoglalasId", {"font-size": 11, "text-anchor": "start"});
  R(4, 46, 100, 40, {rx: 0}); T(54, 63, "Szamlazas", {"font-size": 12, "text-anchor": "middle"}); T(54, 78, "szolgáltatás", {"font-size": 11, "text-anchor": "middle"});
  if (s.kind === "ok") A(104, 66, 203, 66, {"stroke-width": s.line === 2 ? 3 : 1.3});
  else { el("line", {x1: 104, y1: 80, x2: 240, y2: 140, stroke: css("--hl2"), "stroke-width": 2.6, "marker-end": "url(#ar2)"}); X(170, 110, 8); T(10, 120, "közvetlen", {"font-size": 11, fill: css("--hl2")}); T(10, 134, "tételmódosítás", {"font-size": 11, fill: css("--hl2")}); }
  if (s.event) { R(470, 250, 180, 28, {rx: 4, fill: css("--cellhl")}); T(560, 268, "esemény: " + s.event, {"font-size": 11, "text-anchor": "middle"}); }
  [[s.inv1, "összérték ≥ 0"], [s.inv2, "minden tétel lefoglalt (visszaigazoláshoz)"]].forEach(([v, txt], i) => {
    R(10, 252 + i * 34, 440, 28, {rx: 3, fill: v ? css("--cell") : "url(#hat)", stroke: v ? css("--line") : css("--hl2"), "stroke-width": v ? 1.2 : 2.4});
    if (!v) R(16, 257 + i * 34, 420, 18, {rx: 1, fill: css("--bg"), stroke: "none"});
    T(20, 271 + i * 34, (v ? "IGAZ  " : "HAMIS ") + "– " + txt, {"font-size": 12.5, "font-weight": "bold", fill: v ? css("--fg") : css("--hl2")}); });
}
document.getElementById("sc").addEventListener("change", e => setSteps(e.target.value === "ok" ? OK : BAD));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
