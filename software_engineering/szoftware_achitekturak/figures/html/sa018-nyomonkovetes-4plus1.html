  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let sel = "RSZ", step = -1, timer = null;
function missingIn(e){ // nézetek, ahol az elem hiányzik
  const cur = document.getElementById("cur").checked;
  return DATA.VIEWS.filter(v => !(DATA.MAP[e][v] && DATA.MAP[e][v].length) || (cur && v === "log" && DATA.MISSING.includes(e)));
}
function draw(){
  const hl = new Set(), cur = document.getElementById("cur").checked;
  let els = step >= 0 ? DATA.SC[step][2] : [sel];
  els.forEach(e => { DATA.VIEWS.forEach(v => { if (!(cur && v === "log" && DATA.MISSING.includes(e))) (DATA.MAP[e][v] || []).forEach(i => hl.add(i)); });
    for (let c = 0; c < 6; c++) hl.add("t" + e + c); });
  if (step >= 0) hl.add(DATA.SC[step][0]);
  const D = JSON.parse(JSON.stringify(DATA.D));
  if (cur) D.nodes = D.nodes.filter(n => !(n.id === "lAPI" || n.id === "lDB"));
  if (cur) D.edges = D.edges.filter(e => !(e.id === "le1" || e.id === "le3"));
  const g = dg_draw(svg, D, hl);
  // kattintható elemek
  for (const e in DATA.MAP) DATA.VIEWS.forEach(v => (DATA.MAP[e][v] || []).forEach(id => { const n = g[id];
    if (n && !id.startsWith("s")) { n.classList.add("clickable"); n.setAttribute("tabindex", "0"); n.setAttribute("role", "button");
      n.setAttribute("aria-label", DATA.ENAME[e] + " kiválasztása");
      n.onclick = () => pick(e); n.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(e); } }; } }));
  document.querySelectorAll("button[data-e]").forEach(b => b.setAttribute("aria-pressed", String(step < 0 && b.dataset.e === sel)));
  let warn = [];
  els.forEach(e => missingIn(e).forEach(v => warn.push(`hiányzó elem: ${DATA.ENAME[e]} a(z) ${DATA.VNAME[v]} nézetben`)));
  const head = step >= 0 ? `Forgatókönyv ${step + 1}/5: ${DATA.SC[step][1]} – érintett: ${els.map(e => DATA.ENAME[e]).join(", ")}.`
                         : `${DATA.ENAME[sel]}: mind az öt nézetben kiemelve (és a tábla sora).`;
  status.textContent = head + (warn.length ? " FIGYELMEZTETÉS – " + warn.join("; ") + " (a 227. sor szabálya: a nézet hiányos)." : " Minden nézetben megtalálható.");
}
function pick(e){ stopPlay(); sel = e; step = -1; draw(); }
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; document.getElementById("play").textContent = "▶ Forgatókönyv lejátszása"; } }
document.querySelectorAll("button[data-e]").forEach(b => b.addEventListener("click", () => pick(b.dataset.e)));
document.getElementById("play").addEventListener("click", () => {
  if (timer) { stopPlay(); return; }
  step = 0; draw(); document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (step >= 4) { stopPlay(); return; } step++; draw(); }, 1600); });
document.getElementById("next").addEventListener("click", () => { stopPlay(); step = Math.min(4, step + 1); draw(); });
document.getElementById("prev").addEventListener("click", () => { stopPlay(); step = Math.max(0, step - 1); draw(); });
document.getElementById("cur").addEventListener("change", draw);

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
