<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entitásonkénti sorrendkezelés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="exp" onchange="toggleExp(this.checked)"> Megőrzési idő lejárt (a hiányzó #3 nem pótolható)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az R-1 eseményei közül az ismételt #2 kimarad, a #4 visszatartva vár, amíg a #3 visszajátszása után mindkettő sorban feldolgozódik; a kapcsolóval a karanténos eset is lejátszható."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egy partíción egy fogyasztói példány; fiktív azonosítók (a1–a4: R-1, b1–b2: R-2). A kódpanel a fejezet szabályait mutatja; a kiemelt sor az aktuális döntést adó szabály.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": "P0", "ent": "R-1", "seq": 1, "eid": "a1", "cat": "ok", "line": -1, "msg": "R-1#1 (a1, P0): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 1, "buf": [], "done": [], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 1, "eid": "b1", "cat": "ok", "line": -1, "msg": "R-2#1 (b1, P1): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "ok", "line": -1, "msg": "R-1#2 (a2, P0): feldolgozva", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "dup", "line": 0, "msg": "R-1#2 (a2, P0): duplikátum – kihagyva (a várt sorszámnál kisebb / már látott azonosító)", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 4, "eid": "a4", "cat": "held", "line": 1, "msg": "R-1#4 (a4, P0): visszatartva (hiány: #3) – a vártnál nagyobbat (hiányzó előzmény) visszatartja", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "LOG", "ent": "R-1", "seq": 3, "eid": "a3", "cat": "replay", "line": 2, "msg": "Visszajátszás a naplóból: R-1#3 (eseményazonosító a3).", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "LOG", "ent": "R-1", "seq": 3, "eid": "a3", "cat": "flush", "line": 2, "msg": "R-1#3 (a3, napló): puffer kiürítve (#3, #4)", "S": {"R-1": {"exp": 5, "buf": [], "done": ["a1", "a2", "a3", "a4"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 2, "eid": "b2", "cat": "ok", "line": -1, "msg": "R-2#2 (b2, P1): feldolgozva | Végállapot: R-1 feldolgozási sorrendje #1, #2, #3, #4.", "S": {"R-1": {"exp": 5, "buf": [], "done": ["a1", "a2", "a3", "a4"], "q": false}, "R-2": {"exp": 3, "buf": [], "done": ["b1", "b2"], "q": false}}}];
const CODE = ["ha eseményazonosító már látott vagy sorszám < várt: duplikátum, kihagy", "ha sorszám > várt: visszatart (hiányzó előzmény), hiány visszajátszása a naplóból", "ha sorszám = várt: feldolgoz, várt += 1, majd a puffer sorban kiürítve", "ha a hiány nem pótolható (lejárt megőrzés): karantén, „nem konzisztens”, manuális egyeztetés"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = {normal: [{"p": "P0", "ent": "R-1", "seq": 1, "eid": "a1", "cat": "ok", "line": -1, "msg": "R-1#1 (a1, P0): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 1, "buf": [], "done": [], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 1, "eid": "b1", "cat": "ok", "line": -1, "msg": "R-2#1 (b1, P1): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "ok", "line": -1, "msg": "R-1#2 (a2, P0): feldolgozva", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "dup", "line": 0, "msg": "R-1#2 (a2, P0): duplikátum – kihagyva (a várt sorszámnál kisebb / már látott azonosító)", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 4, "eid": "a4", "cat": "held", "line": 1, "msg": "R-1#4 (a4, P0): visszatartva (hiány: #3) – a vártnál nagyobbat (hiányzó előzmény) visszatartja", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "LOG", "ent": "R-1", "seq": 3, "eid": "a3", "cat": "replay", "line": 2, "msg": "Visszajátszás a naplóból: R-1#3 (eseményazonosító a3).", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "LOG", "ent": "R-1", "seq": 3, "eid": "a3", "cat": "flush", "line": 2, "msg": "R-1#3 (a3, napló): puffer kiürítve (#3, #4)", "S": {"R-1": {"exp": 5, "buf": [], "done": ["a1", "a2", "a3", "a4"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 2, "eid": "b2", "cat": "ok", "line": -1, "msg": "R-2#2 (b2, P1): feldolgozva | Végállapot: R-1 feldolgozási sorrendje #1, #2, #3, #4.", "S": {"R-1": {"exp": 5, "buf": [], "done": ["a1", "a2", "a3", "a4"], "q": false}, "R-2": {"exp": 3, "buf": [], "done": ["b1", "b2"], "q": false}}}], quar: [{"p": "P0", "ent": "R-1", "seq": 1, "eid": "a1", "cat": "ok", "line": -1, "msg": "R-1#1 (a1, P0): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 1, "buf": [], "done": [], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 1, "eid": "b1", "cat": "ok", "line": -1, "msg": "R-2#1 (b1, P1): feldolgozva", "S": {"R-1": {"exp": 2, "buf": [], "done": ["a1"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "ok", "line": -1, "msg": "R-1#2 (a2, P0): feldolgozva", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 2, "eid": "a2", "cat": "dup", "line": 0, "msg": "R-1#2 (a2, P0): duplikátum – kihagyva (a várt sorszámnál kisebb / már látott azonosító)", "S": {"R-1": {"exp": 3, "buf": [], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P0", "ent": "R-1", "seq": 4, "eid": "a4", "cat": "held", "line": 1, "msg": "R-1#4 (a4, P0): visszatartva (hiány: #3) – a vártnál nagyobbat (hiányzó előzmény) visszatartja", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": false}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "LOG", "ent": "R-1", "seq": 3, "eid": "a3", "cat": "q", "line": 3, "msg": "A #3 nem pótolható (lejárt a megőrzési idő) → karantén: nem konzisztens; manuális egyeztetés indul.", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": true}, "R-2": {"exp": 2, "buf": [], "done": ["b1"], "q": false}}}, {"p": "P1", "ent": "R-2", "seq": 2, "eid": "b2", "cat": "ok", "line": -1, "msg": "R-2#2 (b2, P1): feldolgozva | Végállapot: R-1 karantén: nem konzisztens.", "S": {"R-1": {"exp": 3, "buf": [4], "done": ["a1", "a2"], "q": true}, "R-2": {"exp": 3, "buf": [], "done": ["b1", "b2"], "q": false}}}]};
let EXPIRED = false;
function toggleExp(v){ EXPIRED = v; setSteps(EXPIRED ? SC.quar : SC.normal); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 400");
  const fg = css("--fg"), hl = css("--hl2"), mu = css("--muted"), L = {P0: 60, LOG: 125, P1: 190};
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="fillp" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="${css("--cellhl")}"/></pattern>`;
  svg.appendChild(defs);
  [["P0", "P0 (R-1)"], ["LOG", "napló / outbox"], ["P1", "P1 (R-2)"]].forEach(([k0, t]) => { el("text", {x: 6, y: L[k0] + 5, "font-size": 12.5, "font-weight": "bold"}, t); el("line", {x1: 115, y1: L[k0], x2: 795, y2: L[k0], stroke: mu, "stroke-width": 0.6}); });
  STEPS.slice(0, k + 1).forEach((e, i) => {
    const x = 120 + i * 84, y = L[e.p], cur = i === k;
    const st = {stroke: cur ? hl : fg, "stroke-width": cur ? 3 : 1.3};
    const fill = e.cat === "ok" || e.cat === "flush" ? css("--cellhl") : css("--cell");
    el("rect", Object.assign({x: x, y: y - 17, width: 76, height: 34, fill: fill, "stroke-dasharray": e.cat === "held" ? "6 4" : ""}, st));
    if (e.cat === "replay") el("rect", {x: x + 4, y: y - 13, width: 68, height: 26, fill: "none", stroke: st.stroke});
    if (e.cat === "dup") el("line", {x1: x, y1: y + 17, x2: x + 76, y2: y - 17, stroke: st.stroke, "stroke-width": 1.5});
    if (e.cat === "q") el("text", {x: x + 38, y: y + 32, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: hl}, "karantén");
    el("text", {x: x + 38, y: y + 5, "text-anchor": "middle", "font-size": 12.5}, `${e.ent}#${e.seq}`);
    el("text", {x: x + 38, y: y - 22, "text-anchor": "middle", "font-size": 10.5, fill: mu}, String(i + 1));
  });
  // állapottábla
  const S = s.S, ty = 250;
  el("text", {x: 6, y: ty, "font-size": 12.5, "font-weight": "bold"}, "Fogyasztói állapottábla");
  ["entitás", "várt sorszám", "visszatartott puffer", "feldolgozott eseményazonosítók", "állapot"].forEach((h, j) => el("text", {x: [6, 80, 190, 330, 560][j], y: ty + 24, "font-size": 12, "font-weight": "bold"}, h));
  ["R-1", "R-2"].forEach((en, r) => {
    const E = S[en], y = ty + 50 + r * 28, act = en === s.ent;
    if (act) el("rect", {x: 2, y: y - 18, width: 796, height: 26, fill: css("--cellhl")});
    [en, "#" + E.exp, E.buf.map(b => "#" + b).join(", ") || "üres", E.done.join(", ") || "–", E.q ? "karantén: nem konzisztens" : "konzisztens"].forEach((v, j) =>
      el("text", {x: [6, 80, 190, 330, 560][j], y: y, "font-size": 12, "font-weight": j === 4 && E.q ? "bold" : "normal", fill: j === 4 && E.q ? hl : fg}, v));
  });
  if (k === STEPS.length - 1) {
    const E = S["R-1"];
    el("text", {x: 6, y: 385, "font-size": 12.5, "font-weight": "bold"}, E.q ? "Végállapot: R-1 karantén: nem konzisztens (a #3 nem pótolható)" : "R-1 végső feldolgozási sorrendje: #1, #2, #3, #4 (az ismételt #2 kimarad)");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
