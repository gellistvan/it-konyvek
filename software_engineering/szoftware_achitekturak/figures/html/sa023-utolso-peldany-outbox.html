<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utolsó példány és outbox</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Változat: <select id="mode" onchange="load()"><option value="good">helyes (B + C panel)</option><option value="bad">hibás (A panel)</option></select></label> <label><input type="checkbox" id="mf" checked onchange="load()"> e-mail-szolgáltató hiba</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két párhuzamos kölcsönzés az utolsó példányra: hibás olvasás-majd-írás, helyes feltételes csökkentés egy tranzakcióban, majd az outbox-esemény kiküldése újrapróbálással."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szaggatott keret = hiba vagy visszagörgetés; pontozott = várakozás sorzárra. PostgreSQL READ COMMITTED viselkedés; szemléltető modell, nem mérés (a feltételes UPDATE sorszámait a szkript sqlite3-mal ellenőrzi).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"p": "B", "col": -1, "msg": "Kezdőállapot: B-42, elérhető = 1, nincs kölcsönzés és outbox-esemény; K1 (O-7) és K2 (O-9) egyszerre indul.", "line": -1}, {"p": "B", "col": 0, "msg": "K1: BEGIN; UPDATE peldany SET elerheto = elerheto − 1 WHERE konyv = 'B-42' AND elerheto > 0 → 1 sor  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 1, "msg": "K2: BEGIN; ugyanaz az UPDATE – vár a K1 által zárolt sorra  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 2, "msg": "K1: INSERT INTO kolcsonzes … ; INSERT INTO outbox (event_id = 'ev-1') … ; COMMIT  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "B", "col": 3, "msg": "K2: a zár feloldása után elerheto = 0, a feltétel hamis → 0 sor; ROLLBACK; hiba: „nincs elérhető példány”, nincs kölcsönzés és outbox-esemény  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "C", "col": 0, "msg": "Outbox-feldolgozó: kiolvassa az ev-1 eseményt (állapot: új)  ‖  Táblák: outbox: ev-1 = új, próbák: 0", "line": -1}, {"p": "C", "col": 1, "msg": "Küldés ev-1 idempotenciakulccsal → e-mail-szolgáltató: 503; az esemény 'új' marad, próbaszám 1  ‖  Táblák: outbox: ev-1 = új, próbák: 1", "line": -1}, {"p": "C", "col": 2, "msg": "Újrapróba ugyanazzal az eseményazonosítóval (ev-1) → 202; a szolgáltató a kulcs alapján nem küld kétszer  ‖  Táblák: outbox: ev-1 = új, próbák: 2", "line": -1}, {"p": "C", "col": 3, "msg": "Outbox-feldolgozó: ev-1 → 'elküldve' (a kölcsönzés közben végig érvényes)  ‖  Táblák: outbox: ev-1 = elküldve, próbák: 2", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PN = {"A": {"title": "(A) Hibás: olvasás, majd írás zár nélkül", "cols": [{"K1": ["SELECT elerheto\n→ 1 (van példány)", "ok"], "K2": ["", ""], "db": ["elérhető = 1\nkölcsönzés: 0\noutbox: 0", "db"]}, {"K1": ["", ""], "K2": ["SELECT elerheto\n→ 1 (van példány)", "ok"], "db": ["elérhető = 1\nkölcsönzés: 0\noutbox: 0", "db"]}, {"K1": ["e = 1 − 1 = 0\n+ kölcsönzés\nCOMMIT", "ok"], "K2": ["", ""], "db": ["elérhető = 0\nkölcsönzés: 1\noutbox: 0", "db"]}, {"K2": ["e = 0 − 1 = −1\n+ kölcsönzés\n× invariáns sérül", "bad"], "K1": ["", ""], "db": ["elérhető = −1\nkölcsönzés: 2\noutbox: 0", "db"]}], "lanes": [["K1", "K1 (O-7)"], ["K2", "K2 (O-9)"], ["db", "adatbázis"]]}, "B": {"title": "(B) Helyes: feltételes csökkentés egy tranzakcióban (UPDATE … AND elerheto > 0)", "cols": [{"K1": ["BEGIN; UPDATE …\nAND elerheto > 0\n→ 1 sor (sorzár)", "ok"], "K2": ["", ""], "db": ["elérhető = 0\nkölcsönzés: 0\noutbox: 0", "db"]}, {"K1": ["", ""], "K2": ["BEGIN; UPDATE …\nvár a K1 sorzárára", "wait"], "db": ["elérhető = 0\nkölcsönzés: 0\noutbox: 0", "db"]}, {"K1": ["INSERT kölcsönzés\n+ outbox (ev-1)\nCOMMIT", "ok"], "K2": ["(vár)", "wait"], "db": ["elérhető = 0\nkölcsönzés: 1\noutbox: 1", "db"]}, {"K1": ["", ""], "K2": ["0 > 0 hamis → 0 sor\nROLLBACK: „nincs\nelérhető példány”", "bad"], "db": ["elérhető = 0\nkölcsönzés: 1\noutbox: 1", "db"]}], "lanes": [["K1", "K1 (O-7)"], ["K2", "K2 (O-9)"], ["db", "adatbázis"]]}, "C": {"title": "(C) Outbox-feldolgozó: kiküldés a commit után (e-mail-szolgáltató hibájával)", "cols": [{"P": ["kiolvasás: ev-1\n(állapot: új)", "ok"], "M": ["", ""], "db": ["ev-1: új\npróbák: 0", "db"]}, {"P": ["küldés (kulcs: ev-1)\npróba 1", "ok"], "M": ["503 – nem elérhető\n× hiba", "bad"], "db": ["ev-1: új\npróbák: 1", "db"]}, {"P": ["újrapróba:\nugyanaz az ev-1\npróba 2", "ok"], "M": ["202 elfogadva", "ok"], "db": ["ev-1: új\npróbák: 2", "db"]}, {"P": ["ev-1 állapota:\n'elküldve'", "ok"], "M": ["", ""], "db": ["ev-1: elküldve\npróbák: 2", "db"]}], "lanes": [["P", "feldolgozó"], ["M", "e-mail-\nszolg."], ["db", "outbox-\ntábla"]]}, "COK": {"title": "(C) Outbox-feldolgozó: kiküldés a commit után (hiba nélkül)", "cols": [{"P": ["kiolvasás: ev-1\n(állapot: új)", "ok"], "M": ["", ""], "db": ["ev-1: új\npróbák: 0", "db"]}, {"P": ["küldés (kulcs: ev-1)\npróba 1", "ok"], "M": ["202 elfogadva", "ok"], "db": ["ev-1: új\npróbák: 1", "db"]}, {"P": ["ev-1 állapota:\n'elküldve'", "ok"], "M": ["", ""], "db": ["ev-1: elküldve\npróbák: 1", "db"]}], "lanes": [["P", "feldolgozó"], ["M", "e-mail-\nszolg."], ["db", "outbox-\ntábla"]]}}, SC = {good: [{"p": "B", "col": -1, "msg": "Kezdőállapot: B-42, elérhető = 1, nincs kölcsönzés és outbox-esemény; K1 (O-7) és K2 (O-9) egyszerre indul.", "line": -1}, {"p": "B", "col": 0, "msg": "K1: BEGIN; UPDATE peldany SET elerheto = elerheto − 1 WHERE konyv = 'B-42' AND elerheto > 0 → 1 sor  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 1, "msg": "K2: BEGIN; ugyanaz az UPDATE – vár a K1 által zárolt sorra  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 2, "msg": "K1: INSERT INTO kolcsonzes … ; INSERT INTO outbox (event_id = 'ev-1') … ; COMMIT  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "B", "col": 3, "msg": "K2: a zár feloldása után elerheto = 0, a feltétel hamis → 0 sor; ROLLBACK; hiba: „nincs elérhető példány”, nincs kölcsönzés és outbox-esemény  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "C", "col": 0, "msg": "Outbox-feldolgozó: kiolvassa az ev-1 eseményt (állapot: új)  ‖  Táblák: outbox: ev-1 = új, próbák: 0", "line": -1}, {"p": "C", "col": 1, "msg": "Küldés ev-1 idempotenciakulccsal → e-mail-szolgáltató: 503; az esemény 'új' marad, próbaszám 1  ‖  Táblák: outbox: ev-1 = új, próbák: 1", "line": -1}, {"p": "C", "col": 2, "msg": "Újrapróba ugyanazzal az eseményazonosítóval (ev-1) → 202; a szolgáltató a kulcs alapján nem küld kétszer  ‖  Táblák: outbox: ev-1 = új, próbák: 2", "line": -1}, {"p": "C", "col": 3, "msg": "Outbox-feldolgozó: ev-1 → 'elküldve' (a kölcsönzés közben végig érvényes)  ‖  Táblák: outbox: ev-1 = elküldve, próbák: 2", "line": -1}], goodok: [{"p": "B", "col": -1, "msg": "Kezdőállapot: B-42, elérhető = 1, nincs kölcsönzés és outbox-esemény; K1 (O-7) és K2 (O-9) egyszerre indul.", "line": -1}, {"p": "B", "col": 0, "msg": "K1: BEGIN; UPDATE peldany SET elerheto = elerheto − 1 WHERE konyv = 'B-42' AND elerheto > 0 → 1 sor  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 1, "msg": "K2: BEGIN; ugyanaz az UPDATE – vár a K1 által zárolt sorra  ‖  Táblák: elérhető = 0, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "B", "col": 2, "msg": "K1: INSERT INTO kolcsonzes … ; INSERT INTO outbox (event_id = 'ev-1') … ; COMMIT  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "B", "col": 3, "msg": "K2: a zár feloldása után elerheto = 0, a feltétel hamis → 0 sor; ROLLBACK; hiba: „nincs elérhető példány”, nincs kölcsönzés és outbox-esemény  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 1", "line": -1}, {"p": "COK", "col": 0, "msg": "Outbox-feldolgozó: kiolvassa az ev-1 eseményt (állapot: új)  ‖  Táblák: outbox: ev-1 = új, próbák: 0", "line": -1}, {"p": "COK", "col": 1, "msg": "Küldés ev-1 idempotenciakulccsal → 202  ‖  Táblák: outbox: ev-1 = új, próbák: 1", "line": -1}, {"p": "COK", "col": 2, "msg": "Outbox-feldolgozó: ev-1 → 'elküldve' (a kölcsönzés közben végig érvényes)  ‖  Táblák: outbox: ev-1 = elküldve, próbák: 1", "line": -1}], bad: [{"p": "A", "col": -1, "msg": "Kezdőállapot: B-42, elérhető = 1, nincs kölcsönzés és outbox-esemény; K1 (O-7) és K2 (O-9) egyszerre indul.", "line": -1}, {"p": "A", "col": 0, "msg": "K1: SELECT elerheto FROM peldany WHERE konyv = 'B-42' → 1  ‖  Táblák: elérhető = 1, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "A", "col": 1, "msg": "K2: SELECT elerheto … → 1 (K1 még nem írt)  ‖  Táblák: elérhető = 1, kölcsönzés: 0, outbox: 0", "line": -1}, {"p": "A", "col": 2, "msg": "K1: UPDATE peldany SET elerheto = elerheto − 1 … ; INSERT kolcsonzes ; COMMIT  ‖  Táblák: elérhető = 0, kölcsönzés: 1, outbox: 0", "line": -1}, {"p": "A", "col": 3, "msg": "K2: UPDATE peldany SET elerheto = elerheto − 1 … ; INSERT kolcsonzes ; COMMIT → elerheto = −1, 2 kölcsönzés: az invariáns sérül!  ‖  Táblák: elérhető = −1, kölcsönzés: 2, outbox: 0", "line": -1}]};
function load(){ const m = document.getElementById("mode").value, f = document.getElementById("mf").checked;
  document.getElementById("mf").disabled = (m === "bad"); setSteps(m === "bad" ? SC.bad : (f ? SC.good : SC.goodok)); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 300");
  const P = PN[s.p];
  // B panel futása után a C panelen az előző B végállapotot is mutatjuk fejlécben
  el("text", {x:8, y:20, "font-weight":"bold", "font-size":14}, P.title);
  const X0 = 110, CW = 150, RH = 64, Y0 = 52;
  P.cols.forEach((c, j) => el("text", {x:X0 + j * CW + CW / 2, y:Y0 - 10, "text-anchor":"middle", "font-size":12, fill:css("--muted")}, "t" + (j + 1)));
  P.lanes.forEach((ln, r) => { const y = Y0 + r * RH;
    ln[1].split("\n").forEach((t, i, a) => el("text", {x:8, y:y + RH / 2 + 5 + (i - (a.length - 1) / 2) * 14, "font-size":13, "font-weight":"bold"}, t));
    P.cols.forEach((c, j) => { if (j > s.col) return; const cell = c[ln[0]]; if (!cell || !cell[0]) return;
      const st = cell[1], cur = j === s.col;
      const r2 = el("rect", {x:X0 + j * CW + 3, y:y + 3, width:CW - 6, height:RH - 6, rx:4, fill: st === "db" ? css("--cellhl") : (st === "wait" ? css("--code") : css("--cell")),
        stroke: cur ? css("--hl") : css("--line"), "stroke-width": cur ? 3 : (st === "bad" ? 2 : 1)});
      if (st === "bad") r2.setAttribute("stroke-dasharray", "5 3"); if (st === "wait") r2.setAttribute("stroke-dasharray", "2 3");
      cell[0].split("\n").forEach((t, i, a) => el("text", {x:X0 + j * CW + CW / 2, y:y + RH / 2 + 4 + (i - (a.length - 1) / 2) * 14, "text-anchor":"middle", "font-size":12, "font-style": st === "wait" ? "italic" : "normal"}, t)); }); });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
