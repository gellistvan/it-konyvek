<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perem- és szolgáltatásközi forgalom</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="bp"> gateway megkerülése (közvetlen hívás a Katalógusra)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A külső kliensek a gatewayen és a BFF-eken át, a belső szolgáltatások egymással mTLS-sel, oldalkocsikon keresztül kommunikálnak; a jogosultsági döntést minden szolgáltatás maga hozza."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Vastag folytonos: északi-déli forgalom; pont-vonal: keleti-nyugati (mesh, mTLS); szaggatott: konfiguráció. Szemléltető topológia a 14.4.2–14.4.4 példáiból.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Mobil → Gateway: HTTPS + Bearer token. A gateway ellenőrzi a TLS-t, a token aláírását, iss/aud/lejárat értékét (kliens + végfelhasználó) és a rate limitet; a kliens X-User-Id fejlécét eldobja.", "on": ["e2"], "authz": false}, {"msg": "2. Gateway → Mobil BFF: a hitelesített kérés a tokennel együtt megy tovább; a BFF kliensspecifikus kompozíciót végez.", "on": ["e5"], "authz": false}, {"msg": "3. Mobil BFF → Katalógus és Kosár párhuzamosan, oldalkocsikon át mTLS-sel: a szolgáltatás-identitást (SPIFFE) a mesh ellenőrzi.", "on": ["e7", "e8"], "authz": false}, {"msg": "4. Katalógus és Kosár saját AuthZ döntést hoz (scope catalog.read; a kosár tulajdonosa a token alanya) – nem a gateway döntésére hagyatkozik.", "on": ["e7", "e8"], "authz": true}, {"msg": "5. A Mobil BFF összeállítja a termékoldal válaszát → Gateway → Mobil kliens.", "on": ["e5", "e2"], "authz": false}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const N = {"web": [2, 62, 16, 8, "Web kliens", "kl"], "mob": [2, 40, 16, 8, "Mobil kliens", "kl"], "par": [2, 14, 16, 8, "Partner", "kl"], "gw": [27.5, 20, 24, 44, "API Gateway\n\nTLS-végződtetés\nOAuth2-token\n(iss, aud,\nlejárat)\nrate limit", "gw"], "wbff": [58, 58, 18, 8, "Web BFF", "bff"], "mbff": [58, 38, 18, 8, "Mobil BFF", "bff"], "kat": [98, 58, 20, 8, "Katalógus", "svc"], "kats": [84, 58, 11, 8, "oldal-\nkocsi", "sc"], "kos": [98, 38, 20, 8, "Kosár", "svc"], "koss": [84, 38, 11, 8, "oldal-\nkocsi", "sc"], "ren": [98, 14, 20, 8, "Rendelés", "svc"], "rens": [84, 14, 11, 8, "oldal-\nkocsi", "sc"], "cp": [84, 76, 34, 7, "vezérlő sík (mesh)", "cp"]}, E = [["e1", "web", "gw", "", "ns"], ["e2", "mob", "gw", "HTTPS + Bearer token", "ns"], ["e3", "par", "gw", "", "ns"], ["e4", "gw", "wbff", "", "ns"], ["e5", "gw", "mbff", "", "ns"], ["e6", "gw", "rens", "", "ns"], ["e7", "mbff", "kats", "", "ew"], ["e8", "mbff", "koss", "", "ew"], ["e9", "wbff", "kats", "", "ew"], ["e10", "kats", "koss", "mTLS (SPIFFE-identitás)", "ew"], ["e11", "koss", "rens", "", "ew"], ["c1", "cp", "kats", "", "cfg"]], SCEN = [[["e2"], "1. Mobil → Gateway: HTTPS + Bearer token. A gateway ellenőrzi a TLS-t, a token aláírását, iss/aud/lejárat értékét (kliens + végfelhasználó) és a rate limitet; a kliens X-User-Id fejlécét eldobja."], [["e5"], "2. Gateway → Mobil BFF: a hitelesített kérés a tokennel együtt megy tovább; a BFF kliensspecifikus kompozíciót végez."], [["e7", "e8"], "3. Mobil BFF → Katalógus és Kosár párhuzamosan, oldalkocsikon át mTLS-sel: a szolgáltatás-identitást (SPIFFE) a mesh ellenőrzi."], [["e7", "e8"], "4. Katalógus és Kosár saját AuthZ döntést hoz (scope catalog.read; a kosár tulajdonosa a token alanya) – nem a gateway döntésére hagyatkozik."], [["e5", "e2"], "5. A Mobil BFF összeállítja a termékoldal válaszát → Gateway → Mobil kliens."]], BYP = [[["bp"], "Gateway megkerülése: a Mobil kliens közvetlenül a Katalógust hívná – a NetworkPolicy blokkolja (csak a gateway és a mesh-identitással rendelkező hívók érik el), a kliens X-User-Id fejléce sem hiteles."]];
function ctr(n, s){ const b = N[n]; const x = b[0], y = 88 - b[1] - b[3], w = b[2], h = b[3];
  return {r: [x + w, y + h / 2], l: [x, y + h / 2], t: [x + w / 2, y], b: [x + w / 2, y + h]}[s]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 124 84");
  svg.innerHTML = ""; defs0();
  const dd = el("defs", {}); dd.innerHTML = `<marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`;
  R(25, 2, 97, 77, {rx: 0, fill: "none", "stroke-width": 0.6});
  T(121, 77.5, "rendszerhatár", {"font-size": 2.6, "text-anchor": "end", "font-weight": "bold"});
  const P = {e1: ["web", "r", "gw", "l"], e2: ["mob", "r", "gw", "l"], e3: ["par", "r", "gw", "l"], e4: ["gw", "r", "wbff", "l"], e5: ["gw", "r", "mbff", "l"],
    e6: ["gw", "r", "rens", "l"], e7: ["mbff", "r", "kats", "l"], e8: ["mbff", "r", "koss", "l"], e9: ["wbff", "r", "kats", "l"], e10: ["kats", "b", "koss", "t"], e11: ["koss", "b", "rens", "t"], c1: ["cp", "b", "kats", "t"]};
  E.forEach(e => { const p = P[e[0]], a = ctr(p[0], p[1]), b = ctr(p[2], p[3]), on = s.on.includes(e[0]);
    const st = e[4] === "ns" ? {"stroke-width": on ? 1.4 : 0.8} : e[4] === "ew" ? {"stroke-width": on ? 1.2 : 0.5, "stroke-dasharray": "2 0.8 0.5 0.8"} : {"stroke-width": 0.3, "stroke-dasharray": "1 1"};
    if (e[0] === "e7" && false) return;
    A(a[0], a[1], b[0], b[1], Object.assign({stroke: on ? css("--hl") : css("--line"), "marker-end": on ? "url(#mh)" : "url(#ms)"}, st)); });
  Object.keys(N).forEach(k => { const b = N[k], x = b[0], y = 88 - b[1] - b[3], st = b[5];
    R(x, y, b[2], b[3], {rx: 1, "stroke-width": st === "gw" ? 0.6 : 0.3, fill: st === "gw" || st === "sc" ? css("--cellhl") : css("--cell"), "stroke-dasharray": st === "cp" ? "1 0.7" : ""});
    const lines = b[4].split("\n").filter(l => l);
    lines.forEach((l, i) => T(x + b[2] / 2, y + b[3] / 2 + (i - (lines.length - 1) / 2) * 3.0 + 0.9, l, {"font-size": st === "gw" && i > 0 ? 2.3 : 2.6, "text-anchor": "middle", "font-weight": i === 0 && st !== "sc" && st !== "cp" ? "bold" : "normal"}));
    if (st === "svc") { R(x + b[2] - 9, y - 3.6, 9, 3.4, {rx: 1, "stroke-width": 0.25, fill: s.authz ? css("--cellhl") : css("--cell")}); T(x + b[2] - 4.5, y - 1, "AuthZ", {"font-size": 2.4, "text-anchor": "middle"}); } });
  T(2, 51, "X-User-Id: 42", {"font-size": 2.6}); L(1.5, 50.2, 18, 50.2, {"stroke-width": 0.4}); T(2, 54.5, "nem hiteles", {"font-size": 2.4, fill: css("--muted")});
  if (s.on.includes("bp")) { const a = ctr("mob", "t"), b = ctr("kat", "l"); el("path", {d: "M" + a[0] + "," + a[1] + " C 30,10 70,10 " + b[0] + "," + b[1], fill: "none", stroke: css("--hl2"), "stroke-width": 1, "stroke-dasharray": "2 1"});
    X(50, 13.5, 2.5, {"stroke-width": 1}); T(54, 13, "NetworkPolicy: blokkolva", {"font-size": 3, fill: css("--hl2"), "font-weight": "bold"}); }
}
function load(){ const bp = document.getElementById("bp").checked; setSteps((bp ? BYP : SCEN).map((x, i) => ({msg: x[1], on: x[0], authz: !bp && i === 3}))); }
document.getElementById("bp").addEventListener("change", load);


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
