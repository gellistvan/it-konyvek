<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konzisztens hashelés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>csomópontok: <b id="vn_">4</b></span> <button id="minus">− csomópont</button> <button id="plus">+ csomópont</button> <label>vizsgált változás: <select id="dir"><option value="add">hozzáadás (N → N+1)</option><option value="rem">eltávolítás (N → N−1)</option></select></label> <label>virtuális pontok: <input type="range" id="vv" min="1" max="50" value="3" style="width:110px"> <b id="vvv">3</b></label> <label>kulcsok: <input type="range" id="kk" min="1000" max="20000" step="1000" value="20000" style="width:110px"> <b id="vkk">20000</b></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Mod N particionálásnál egy új csomópont a kulcsok nagy részét áthelyezi, konzisztens hashelésnél csak kb. egyötödüket; több virtuális ponttal a terhelés kiegyenlítettebb."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Determinisztikus hash (FNV-1a + murmur3 fmix32); a kulcsok „kulcs-0”, „kulcs-1”, … Számolt arányok, nem mérés. Az ideális áthelyezés N → N+1 esetén 1/(N+1).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "4 → 5 csomópont, 3 virtuális pont, 20000 kulcs: mod N 80,6%, gyűrű 19,3% áthelyezés; a terhelés relatív szórása 43,8%.", "mm": 0.8058, "mc": 0.19265, "cnt": [3133, 1990, 7241, 3783, 3853], "sd": 0.43824319732313016, "p1": [[166590052, 1], [622645174, 2], [1171746784, 2], [1276126386, 1], [1511882561, 0], [1979286799, 3], [2353899868, 0], [2574531467, 3], [2895438534, 4], [2946177625, 0], [3259103434, 4], [3300319106, 1], [3859391945, 2], [4058232569, 4], [4190713756, 3]], "n0": 4, "n1": 5, "vn": 3, "nk": 20000}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

function h32(s){ let x = 0x811C9DC5 >>> 0; const b = new TextEncoder().encode(s);
  for (const c of b) { x ^= c; x = Math.imul(x, 0x01000193) >>> 0; }
  x ^= x >>> 16; x = Math.imul(x, 0x85EBCA6B) >>> 0; x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35) >>> 0; x ^= x >>> 16; return x >>> 0; }
function ringOf(n, vn){ const p = []; for (let i = 0; i < n; i++) for (let j = 0; j < vn; j++) p.push([h32(String.fromCharCode(65 + i) + "#" + j), i]); return p.sort((a, b) => a[0] - b[0]); }
function own(p, k){ let lo = 0, hi = p.length; while (lo < hi) { const m = (lo + hi) >> 1; if (p[m][0] < k) lo = m + 1; else hi = m; } return p[lo % p.length][1]; }
let KC = {}; function keys(nk){ if (!KC[nk]) { KC[nk] = []; for (let i = 0; i < nk; i++) KC[nk].push(h32("kulcs-" + i)); } return KC[nk]; }
function calc(n0, n1, vn, nk){ const K = keys(nk), p0 = ringOf(n0, vn), p1 = ringOf(n1, vn); let mm = 0, mc = 0; const cnt = Array(n1).fill(0);
  K.forEach(k => { if (k % n0 !== k % n1) mm++; if (own(p0, k) !== own(p1, k)) mc++; cnt[own(p1, k)]++; });
  const mean = nk / n1, sd = Math.sqrt(cnt.reduce((s, c) => s + (c - mean) * (c - mean), 0) / n1) / mean;
  return {mm: mm / nk, mc: mc / nk, cnt: cnt, sd: sd, p1: p1, n0: n0, n1: n1, vn: vn, nk: nk}; }
function pct(x){ return (x * 100).toFixed(1).replace(".", ",") + "%"; }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 300");
  svg.innerHTML = ""; defs0();
  const cx = 150, cy = 150, R0 = 110; el("circle", {cx: cx, cy: cy, r: R0, fill: "none", stroke: css("--muted")});
  const shapes = ["circle", "rect", "tri", "dia", "star"];
  keys(s.nk).slice(0, 150).forEach(k => { const t = -Math.PI / 2 + 2 * Math.PI * k / 4294967296; el("circle", {cx: cx + 92 * Math.cos(t), cy: cy + 92 * Math.sin(t), r: 1.6, fill: css("--muted")}); });
  s.p1.forEach(([hv, n]) => { const t = -Math.PI / 2 + 2 * Math.PI * hv / 4294967296, x = cx + R0 * Math.cos(t), y = cy + R0 * Math.sin(t);
    el("circle", {cx: x, cy: y, r: 4, fill: n === s.n1 - 1 && s.n1 > s.n0 ? css("--hl2") : css("--fg")}); if (s.vn <= 5) T(cx + 126 * Math.cos(t), cy + 126 * Math.sin(t) + 4, String.fromCharCode(65 + n), {"font-size": 11, "text-anchor": "middle"}); });
  T(cx, cy + 4, s.n0 + " → " + s.n1 + " csomópont", {"font-size": 12, "text-anchor": "middle"});
  // eredmények
  const x0 = 320;
  T(x0, 30, "áthelyezett kulcsok aránya", {"font-size": 13, "font-weight": "bold"});
  [["mod N", s.mm], ["gyűrű", s.mc], ["ideális 1/" + Math.max(s.n0, s.n1), Math.abs(s.n1 - s.n0) / Math.max(s.n0, s.n1)]].forEach(([n, v], i) => {
    T(x0, 58 + i * 26, n, {"font-size": 12}); R(x0 + 90, 46 + i * 26, 220 * v, 16, {rx: 1, fill: i === 0 ? css("--fg") : i === 1 ? "url(#hat)" : css("--cell")}); T(x0 + 96 + 220 * v, 59 + i * 26, pct(v), {"font-size": 12}); });
  T(x0, 150, "terhelés csomópontonként (gyűrű, " + s.n1 + " csomópont)", {"font-size": 13, "font-weight": "bold"});
  const mx = Math.max(...s.cnt), bw = Math.min(30, 300 / s.n1);
  s.cnt.forEach((c, i) => { const hgt = 90 * c / mx; R(x0 + i * bw, 260 - hgt, bw - 4, hgt, {rx: 0, fill: css("--cellhl")}); T(x0 + i * bw + bw / 2 - 2, 274, String.fromCharCode(65 + i), {"font-size": 10.5, "text-anchor": "middle"}); });
  T(x0, 294, "relatív szórás: " + pct(s.sd), {"font-size": 12, "font-weight": "bold"});
}
let NN = 4;
function upd(delta){ NN = Math.max(2, Math.min(10, NN + (delta || 0))); document.getElementById("vn_").textContent = NN;
  const vn = +document.getElementById("vv").value, nk = +document.getElementById("kk").value; document.getElementById("vvv").textContent = vn; document.getElementById("vkk").textContent = nk;
  const d = document.getElementById("dir").value === "add" ? 1 : -1, n1 = Math.max(1, NN + d), r = calc(NN, n1, vn, nk);
  setSteps([Object.assign(r, {msg: NN + " → " + n1 + " csomópont, " + vn + " virtuális pont, " + nk + " kulcs: mod N " + pct(r.mm) + ", gyűrű " + pct(r.mc) + " áthelyezés; a terhelés relatív szórása " + pct(r.sd) + "."})]); }
document.getElementById("plus").addEventListener("click", () => upd(1));
document.getElementById("minus").addEventListener("click", () => upd(-1));
["vv", "kk", "dir"].forEach(id => document.getElementById(id).addEventListener("input", () => upd(0)));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
