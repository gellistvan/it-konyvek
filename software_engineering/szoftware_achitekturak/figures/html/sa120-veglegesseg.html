<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoW és PBFT véglegesség</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sys:#e6e6e6;--ext:#cfcfcf;--comp:#f3f3f3;--wait:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sys:#3a3a3a;--ext:#4a4a4a;--comp:#303030;--wait:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
input[type=range]{min-width:90px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg);}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="PoW paraméterek">
 <label>q (támadó hash-aránya): <input id="q" type="range" min="0.05" max="0.45" step="0.01" value="0.1" aria-label="q"> <span id="qv"></span></label>
 <label>z (megerősítés): <input id="z" type="range" min="0" max="20" step="1" value="6" aria-label="z"> <span id="zv"></span></label>
</div>
<div id="pstat" aria-live="polite" style="min-height:1.5em"></div>
<svg id="pw" viewBox="0 0 560 250" role="img" aria-label="P(z) logaritmikus skálán q = 0,1 és a választott q mellett"></svg>
<div class="ctl" role="group" aria-label="PBFT lépései" style="margin-top:10px">
 <label>n validátor: <select id="n" aria-label="validátorok száma"><option>4</option><option>7</option><option selected>10</option><option>13</option></select></label>
 <button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button>
 <span id="cnt" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="pb" viewBox="0 0 560 300" role="img" aria-label="PBFT üzenetfázisok idővonala"></svg>

<p class="small">Felül: a fejezet képlete (Nakamoto-féle közelítés), élőben számolva; alul: a PBFT üzenetfázisai, f = ⌊(n−1)/3⌋. Szemléltető számítás, nem mérés.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function fact(k){let r=1;for(let i=2;i<=k;i++)r*=i;return r;}
function P(q, z){const p=1-q, l=z*q/p; let s=0; for(let k=0;k<=z;k++) s+=Math.pow(l,k)*Math.exp(-l)/fact(k)*(1-Math.pow(q/p,z-k)); return Math.max(1-s, 1e-300);}
function fmt(v){ if (v >= 0.001) return v.toFixed(4).replace(".", ","); const e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e); return m.toFixed(2).replace(".", ",") + "·10^" + e; }
const pw = document.getElementById("pw"), pb = document.getElementById("pb");
function drawP(){
  const q = +document.getElementById("q").value, z = +document.getElementById("z").value;
  document.getElementById("qv").textContent = q.toFixed(2).replace(".", ",");
  document.getElementById("zv").textContent = z;
  pw.innerHTML = "";
  const X = t => 60 + t / 20 * 480, lmin = -12, Y = v => 20 + (0 - Math.max(Math.log10(v), lmin)) / (-lmin) * 190;
  for (let e = 0; e >= lmin; e -= 2) { mk(pw, "line", {x1: 60, x2: 540, y1: Y(Math.pow(10, e)), y2: Y(Math.pow(10, e)), stroke: css("--muted"), "stroke-dasharray": "2 3", "stroke-width": 0.6}); mk(pw, "text", {x: 55, y: Y(Math.pow(10, e)) + 4, "text-anchor": "end", "font-size": 11}, "10^" + e); }
  for (let t = 0; t <= 20; t += 2) mk(pw, "text", {x: X(t), y: 228, "text-anchor": "middle", "font-size": 11}, String(t));
  mk(pw, "text", {x: 300, y: 246, "text-anchor": "middle", "font-size": 11.5}, "megerősítések száma, z");
  function curve(qq, dash, sh){
    let d = ""; for (let t = 0; t <= 20; t++) d += (t ? " L" : "M") + X(t) + "," + Y(P(qq, t));
    mk(pw, "path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 1.6, "stroke-dasharray": dash});
    for (let t = 0; t <= 20; t++) { const x = X(t), y = Y(P(qq, t)); if (sh === 1) mk(pw, "rect", {x: x - 3, y: y - 3, width: 6, height: 6, fill: css("--bg"), stroke: css("--fg")}); else if (sh === 2) mk(pw, "path", {d: `M${x},${y-4} l4,7 l-8,0 z`, fill: css("--hl2")}); else mk(pw, "circle", {cx: x, cy: y, r: 3, fill: css("--fg")}); }
  }
  curve(0.1, "none", 0); curve(0.3, "6 4", 1);
  if (Math.abs(q - 0.1) > 1e-9 && Math.abs(q - 0.3) > 1e-9) curve(q, "2 3", 2);
  const v = P(q, z);
  mk(pw, "circle", {cx: X(z), cy: Y(v), r: 8, fill: "none", stroke: css("--hl2"), "stroke-width": 2.5});
  mk(pw, "text", {x: 540, y: 14, "text-anchor": "end", "font-size": 11.5}, "● folytonos: q = 0,1   ■ szaggatott: q = 0,3   ▲ pontozott: választott q");
  document.getElementById("pstat").textContent = `q = ${q.toFixed(2).replace(".", ",")}, z = ${z}: a visszaállás valószínűsége P(z) ≈ ${fmt(v)}` + (q >= 0.5 ? "" : "") + " (szemléltető számítás, nem mérés)";
}
let K = 0, STEPS = [];
function build(){
  const n = +document.getElementById("n").value, f = Math.floor((n - 1) / 3), qv = 2 * f + 1;
  STEPS = [{ph: 0, v: 0, msg: `pre-prepare: a vezető (V0) kiosztja a blokkot; n = ${n}, f = ${f}, kvórum 2f+1 = ${qv}`},
           {ph: 1, v: 0, msg: `prepare: a becsületes validátorok egymásnak jelzik, hogy a javaslatot elfogadják`}];
  for (let k = 1; k <= qv; k++) STEPS.push({ph: 2, v: k, msg: `commit szavazatok: ${k}/${qv}` + (k < qv ? " – még nem végleges" : " – VÉGLEGES (a kvórum összegyűlt)")});
  return {n: n, f: f, qv: qv};
}
let CFG = build();
function drawB(){
  const s = STEPS[K], n = CFG.n, f = CFG.f, qv = CFG.qv;
  document.getElementById("cnt").textContent = `${K + 1}/${STEPS.length}`;
  document.getElementById("status").textContent = s.msg;
  pb.innerHTML = "";
  const H = 28 + n * 18 + 30; pb.setAttribute("viewBox", `0 0 560 ${H}`);
  const X = t => 90 + t * 140, Yr = i => 30 + i * 18;
  const defs = mk(pb, "defs", {}); defs.innerHTML = `<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--fg')}" stroke-width="1"/></pattern>`;
  ["pre-prepare", "prepare", "commit"].forEach((l, j) => { mk(pb, "text", {x: X(j + 0.5), y: 16, "text-anchor": "middle", "font-size": 12, "font-weight": s.ph === j ? "bold" : "normal"}, l); mk(pb, "line", {x1: X(j), x2: X(j), y1: 22, y2: Yr(n), stroke: css("--muted"), "stroke-dasharray": "2 3"}); });
  const honest = []; for (let i = 0; i < n - f; i++) honest.push(i);
  for (let i = 0; i < n; i++) {
    const byz = i >= n - f;
    if (byz) mk(pb, "rect", {x: X(0), y: Yr(i) - 7, width: X(3.2) - X(0), height: 14, fill: "url(#hz)", opacity: 0.5});
    mk(pb, "line", {x1: X(0), x2: X(3.2), y1: Yr(i), y2: Yr(i), stroke: css("--muted"), "stroke-width": 0.6});
    mk(pb, "text", {x: 84, y: Yr(i) + 4, "text-anchor": "end", "font-size": 11.5}, "V" + i + (i === 0 ? " (vezető)" : "") + (byz ? " ✗" : ""));
  }
  if (s.ph >= 0) for (let i = 1; i < n; i++) mk(pb, "line", {x1: X(0.08), y1: Yr(0), x2: X(0.85), y2: Yr(i), stroke: css("--muted"), "stroke-width": 0.7});
  if (s.ph >= 1) honest.forEach(i => mk(pb, "path", {d: `M${X(1.5)},${Yr(i)-5} l5,9 l-10,0 z`, fill: css("--fg")}));
  if (s.ph >= 2) for (let k = 1; k <= s.v; k++) { const i = honest[k - 1], x = X(2.1 + 0.8 * (k - 1) / Math.max(1, qv - 1)); mk(pb, "circle", {cx: x, cy: Yr(i), r: 5, fill: k === s.v ? css("--hl2") : css("--fg")}); mk(pb, "text", {x: x + 8, y: Yr(i) + 4, "font-size": 11}, String(k)); }
  if (s.ph === 2 && s.v === qv) { const x = X(2.1 + 0.8) + 14; mk(pb, "line", {x1: x, x2: x, y1: 22, y2: Yr(n - 1) + 10, stroke: css("--hl"), "stroke-width": 3}); mk(pb, "text", {x: x + 6, y: Yr(n - 1) + 24, "font-size": 12, "font-weight": "bold"}, `VÉGLEGES (2f+1 = ${qv})`); }
  mk(pb, "rect", {x: 10, y: H - 16, width: 18, height: 11, fill: "url(#hz)", stroke: css("--fg"), "stroke-width": 0.6});
  mk(pb, "text", {x: 34, y: H - 7, "font-size": 11}, `Byzantine (legfeljebb f = ${f}); ▲ prepare, ● commit szavazat`);
}
function showB(i){ K = Math.max(0, Math.min(STEPS.length - 1, i)); drawB(); }
document.getElementById("q").oninput = drawP; document.getElementById("z").oninput = drawP;
document.getElementById("n").onchange = () => { CFG = build(); showB(0); };
document.getElementById("first").onclick = () => showB(0);
document.getElementById("prev").onclick = () => showB(K - 1);
document.getElementById("next").onclick = () => showB(K + 1);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawP(); drawB(); });
drawP(); showB(0);

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
