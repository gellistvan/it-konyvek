<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C4 ráközelítés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sys:#e6e6e6;--ext:#cfcfcf;--comp:#f3f3f3;--wait:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sys:#3a3a3a;--ext:#4a4a4a;--comp:#303030;--wait:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
input[type=range]{min-width:90px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg);}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.on{outline:2px solid var(--hl);font-weight:bold}
svg{transform-origin:50% 40%}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="C4 ráközelítés">
 <button id="out">◀ Távolítás</button><button id="in">Ráközelítés ▶</button>
 <span id="cnt" class="small"></span>
 <label><input id="path" type="checkbox"> Fizetési útvonal kiemelése</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 370 420" role="img" aria-label="A Rendelés-feldolgozó rendszer C4-szintjei"></svg>

<p class="small">Pontozott kiemelés: a következő szinten kibontott elem; pontozott keret: a kibontott elem határa. Folytonos nyíl: szinkron, szaggatott: aszinkron. Fiktív rendszer; a hibatűrési jellemzők a component szinten.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(parent, tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
const FILLV = {person:"--cell", system:"--sys", container:"--cell", db:"--cell", queue:"--cell", external:"--ext", component:"--comp", ext_person:"--cell"};
const TAGS = {person:"[Személy]", system:"[Szoftverrendszer]", external:"[Külső rendszer]", container:"[Konténer]", db:"[Adattár]", queue:"[Konténer: üzenetsor]", component:"[Komponens]"};
function mtext(g, x, y, lines, fs, opts){
  const n = lines.length, lh = fs * 1.18, y0 = y - (n - 1) * lh / 2;
  const t = mk(g, "text", Object.assign({x: x, y: y0, "text-anchor": "middle", "dominant-baseline": "central", "font-size": fs}, opts || {}));
  lines.forEach((s, i) => { const sp = mk(t, "tspan", {x: x, dy: i ? lh : 0}, s); });
  return t;
}
function drawDiagram(svgEl, D, o){
  o = o || {};
  const hn = new Set(o.hlNodes || []), he = new Set(o.hlEdges || []), dim = o.dim || false;
  const k = D.k, fs = D.fs * k;
  svgEl.innerHTML = "";
  svgEl.setAttribute("viewBox", `0 0 ${D.W} ${D.H}`);
  const defs = mk(svgEl, "defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="${7}" markerHeight="${7}" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--line')}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="${9}" markerHeight="${9}" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--hl')}"/></marker>`;
  (D.bounds || []).forEach(b => {
    const st = b.style || "dashed";
    mk(svgEl, "rect", {x: b.x, y: b.y, width: b.w, height: b.h, fill: "none", stroke: css("--line"),
      "stroke-width": st === "thick" ? 2.6 * k : (st === "dotted" ? 1.8 * k : 1.4 * k),
      "stroke-dasharray": st === "dashed" ? `${6*k} ${3*k}` : (st === "dotted" ? `${1*k} ${2.2*k}` : "none")});
    if (b.lpos === "tr") mk(svgEl, "text", {x: b.x + b.w - 6 * k, y: b.y + 4 * k + fs, "text-anchor": "end", "font-size": fs, "font-style": "italic"}, b.label);
    else mk(svgEl, "text", {x: b.x + 6 * k, y: b.y + b.h - 4 * k, "font-size": fs, "font-style": "italic"}, b.label);
  });
  const labels = [];
  D.edges.forEach(e => {
    const [[x0, y0], [x1, y1]] = e.p, on = he.has(e.id), faint = dim && !on;
    const col = on ? css("--hl") : css("--line");
    const ln = mk(svgEl, "line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: col, "stroke-width": (on ? 2.8 : (e.lw || 1.2)) * k,
      "stroke-dasharray": e.async ? `${5*k} ${3*k}` : "none", "marker-end": on ? "url(#ahh)" : "url(#ah)", opacity: faint ? 0.35 : 1});
    if (e.both) ln.setAttribute("marker-start", on ? "url(#ahh)" : "url(#ah)");
    if (e.label) {
      const t = e.t === undefined ? 0.5 : e.t, lx = x0 + (x1 - x0) * t + (e.dx || 0), ly = y0 + (y1 - y0) * t + (e.dy || 0);
      labels.push([lx, ly, e.label.split("\n"), (e.fs || D.fs) * k, on, faint]);
    }
  });
  D.nodes.forEach(n => {
    const kind = n.kind || "container", on = hn.has(n.id), faint = dim && !on && !(o.keep || []).includes(n.id);
    const g = mk(svgEl, "g", {opacity: faint ? 0.4 : 1, tabindex: o.onClick ? 0 : -1, role: o.onClick ? "button" : "img",
      "aria-label": n.label.replace(/\n/g, " ")});
    if (o.onClick) { g.style.cursor = "pointer"; g.addEventListener("click", () => o.onClick(n)); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); o.onClick(n); } }); }
    const lw = (kind === "system" || on ? 2.6 : (kind === "component" ? 1.0 : 1.3)) * k;
    const stroke = on ? css("--hl") : css("--line"), fill = css(FILLV[kind] || "--cell");
    let ty = n.y + n.h / 2;
    if (kind === "db") {
      const eh = Math.min(n.h * 0.22, 9 * k), rx = n.w / 2, ry = eh / 2, x = n.x, y = n.y, w = n.w, h = n.h;
      mk(g, "path", {d: `M${x},${y+ry} L${x},${y+h-ry} A${rx},${ry} 0 0 0 ${x+w},${y+h-ry} L${x+w},${y+ry}`, fill: fill, stroke: stroke, "stroke-width": lw});
      mk(g, "ellipse", {cx: x + rx, cy: y + ry, rx: rx, ry: ry, fill: fill, stroke: stroke, "stroke-width": lw});
      ty = y + ry + (h - ry) / 2;
    } else {
      const rs = kind === "external" ? 0 : Math.min(n.w, n.h) * 0.08;
      mk(g, "rect", {x: n.x, y: n.y, width: n.w, height: n.h, rx: rs, fill: fill, stroke: stroke, "stroke-width": lw,
        "stroke-dasharray": kind === "external" ? `${4*k} ${2*k}` : "none"});
      if (kind === "queue") [6, 11].forEach(d => mk(g, "line", {x1: n.x + n.w - d * k, y1: n.y, x2: n.x + n.w - d * k, y2: n.y + n.h, stroke: stroke, "stroke-width": 0.8 * k}));
    }
    if (o.zoom === n.id) { const p = 4 * k; mk(g, "rect", {x: n.x - p, y: n.y - p, width: n.w + 2 * p, height: n.h + 2 * p, fill: "none", stroke: css("--hl2"), "stroke-width": 2 * k, "stroke-dasharray": `${1.2*k} ${2.2*k}`}); }
    let tx = n.x + n.w / 2;
    if (kind === "person" || kind === "ext_person") {
      const s = Math.min(n.h * 0.55, 22 * k), ix = n.x + s * 0.55, iy = n.y + n.h / 2 - s * 0.55;
      mk(g, "circle", {cx: ix, cy: iy + s * 0.22, r: s * 0.2, fill: "none", stroke: css("--line"), "stroke-width": k});
      mk(g, "path", {d: `M${ix},${iy+s*0.42} L${ix},${iy+s*0.8} M${ix-s*0.28},${iy+s*0.55} L${ix+s*0.28},${iy+s*0.55} M${ix},${iy+s*0.8} L${ix-s*0.22},${iy+s*1.05} M${ix},${iy+s*0.8} L${ix+s*0.22},${iy+s*1.05}`, fill: "none", stroke: css("--line"), "stroke-width": k});
      tx = n.x + s * 1.1 + (n.w - s * 1.1) / 2;
    }
    const tag = n.tag !== undefined ? n.tag : (TAGS[kind] || "");
    const lines = n.label.split("\n").concat(tag ? [tag] : []);
    mtext(g, tx, ty, lines, (n.fs || D.fs) * k, on ? {"font-weight": "bold"} : {});
  });
  labels.forEach(([lx, ly, lines, f, on, faint]) => {
    const g = mk(svgEl, "g", {opacity: faint ? 0.45 : 1});
    const t = mtext(g, lx, ly, lines, f, on ? {"font-weight": "bold"} : {});
    const bb = t.getBBox();
    const r = document.createElementNS(NS, "rect");
    for (const [a, v] of Object.entries({x: bb.x - 2, y: bb.y - 1, width: bb.width + 4, height: bb.height + 2, rx: 2, fill: css("--bg"), opacity: 0.92})) r.setAttribute(a, v);
    g.insertBefore(r, t);
  });
  (D.texts || []).forEach(t => mk(svgEl, "text", {x: t.x, y: t.y, "font-size": (t.fs || D.fs) * k, "text-anchor": t.anchor === "center" ? "middle" : (t.anchor === "right" ? "end" : "start"), "dominant-baseline": "central", "font-weight": t.bold ? "bold" : "normal"}, t.s));
}

const LV = [{"W": 300, "H": 420, "bounds": [], "texts": [], "nodes": [{"id": "user", "x": 2, "y": 10, "w": 122, "h": 54, "label": "Vásárló", "kind": "person"}, {"id": "admin", "x": 132, "y": 10, "w": 166, "h": 54, "label": "Adminisztrátor", "kind": "person"}, {"id": "sys", "x": 50, "y": 175, "w": 200, "h": 80, "label": "Rendelés-feldolgozó\nrendszer", "kind": "system"}, {"id": "pay", "x": 2, "y": 340, "w": 145, "h": 66, "label": "Külső fizetési\nszolgáltató", "kind": "external", "tag": "[Külső rendszer]"}, {"id": "notify", "x": 155, "y": 340, "w": 143, "h": 66, "label": "Értesítési\nszolgáltató", "kind": "external", "tag": "[Külső rendszer]"}], "edges": [{"id": "c1", "a": "user", "b": "sys", "label": "rendelést\nad le", "t": 0.5, "dx": -30, "p": [[76.19662921348315, 64.0], [130.4494382022472, 175.0]]}, {"id": "c2", "a": "admin", "b": "sys", "label": "rendeléseket\nkezel", "t": 0.5, "dx": 36, "p": [[205.14044943820224, 64.0], [164.6067415730337, 175.0]]}, {"id": "c3", "a": "sys", "b": "pay", "label": "fizetési\ntranzakciót\nkezdeményez", "t": 0.5, "dx": -34, "p": [[130.8860759493671, 255.0], [90.26898734177215, 340.0]]}, {"id": "c4", "a": "sys", "b": "notify", "label": "értesítést\nküld", "t": 0.5, "dx": 34, "p": [[169.36708860759495, 255.0], [210.52215189873417, 340.0]]}], "k": 1.6754850088183422, "fs": 8.4}, {"W": 440, "H": 420, "texts": [], "bounds": [{"x": 4, "y": 84, "w": 432, "h": 256, "label": "Rendelés-feldolgozó rendszer", "style": "dotted", "lpos": "tr"}], "nodes": [{"id": "user", "x": 8, "y": 8, "w": 175, "h": 54, "label": "Vásárló,\nAdminisztrátor", "kind": "person"}, {"id": "api", "x": 16, "y": 104, "w": 140, "h": 54, "label": "Rendelés API"}, {"id": "queue", "x": 290, "y": 104, "w": 140, "h": 54, "label": "Üzenetsor\n(RabbitMQ)", "kind": "queue", "tag": ""}, {"id": "worker", "x": 290, "y": 230, "w": 140, "h": 56, "label": "Worker"}, {"id": "db", "x": 44, "y": 222, "w": 130, "h": 90, "label": "Rendelés DB\n(rendelés +\noutbox)", "kind": "db", "tag": ""}, {"id": "notify", "x": 8, "y": 360, "w": 165, "h": 58, "label": "Értesítési\nszolgáltató", "kind": "external", "tag": "[Külső rendszer]"}, {"id": "pay", "x": 270, "y": 360, "w": 165, "h": 58, "label": "Külső fizetési\nszolgáltató", "kind": "external", "tag": "[Külső rendszer]"}], "edges": [{"id": "k1", "a": "user", "b": "api", "label": "[HTTPS, REST,\nszinkron]", "t": 0.5, "dx": 58, "p": [[92.828125, 62.0], [88.671875, 104.0]]}, {"id": "k2", "a": "api", "b": "db", "label": "[JDBC, szinkron;\nrendelés + outbox\negy tranzakcióban]", "pa": [100, 158], "pb": [100, 222], "t": 0.5, "dx": 82, "p": [[100, 158], [100, 222]]}, {"id": "k3", "a": "api", "b": "queue", "label": "[AMQP, aszinkron,\noutboxból]", "t": 0.5, "async": true, "p": [[156.0, 131.0], [290.0, 131.0]]}, {"id": "k4", "a": "queue", "b": "worker", "label": "[AMQP,\naszinkron]", "t": 0.5, "dx": -44, "async": true, "p": [[360.0, 158.0], [360.0, 230.0]]}, {"id": "k5", "a": "worker", "b": "db", "label": "[JDBC]", "t": 0.45, "dy": -12, "p": [[290.0, 260.50996015936255], [174.0, 264.66932270916334]]}, {"id": "k6", "a": "worker", "b": "pay", "label": "[HTTPS,\nszinkron]", "t": 0.5, "dx": -50, "p": [[358.39694656488547, 286.0], [354.1603053435114, 360.0]]}, {"id": "k7", "a": "api", "b": "notify", "label": "[HTTPS, REST]", "pa": [24, 158], "pb": [24, 360], "t": 0.9, "dx": 52, "p": [[24, 158], [24, 360]]}], "k": 1.6754850088183422, "fs": 8.4}, {"W": 760, "H": 380, "texts": [], "bounds": [{"x": 170, "y": 8, "w": 400, "h": 282, "label": "Worker [konténer]", "style": "dotted", "lpos": "tr"}], "nodes": [{"id": "queue", "x": 0, "y": 30, "w": 140, "h": 56, "label": "Üzenetsor\n(RabbitMQ)", "kind": "queue", "tag": "[Konténer]"}, {"id": "cons", "x": 190, "y": 30, "w": 210, "h": 56, "label": "FizetésiÜzenet-\nFogyasztó", "kind": "component"}, {"id": "pgc", "x": 190, "y": 165, "w": 210, "h": 80, "label": "PaymentGatewayClient\nprocessPayment(\norderId, amount)", "kind": "component"}, {"id": "repo", "x": 430, "y": 165, "w": 125, "h": 56, "label": "Rendelés-\nRepository", "kind": "component", "tag": "[Komp.]"}, {"id": "db", "x": 600, "y": 150, "w": 150, "h": 86, "label": "Rendelés DB", "kind": "db", "tag": "[Konténer]"}, {"id": "pay", "x": 190, "y": 312, "w": 210, "h": 62, "label": "Külső fizetési szolgáltató", "kind": "external", "tag": "[Külső rendszer]"}], "edges": [{"id": "m1", "a": "queue", "b": "cons", "label": "[AMQP]", "t": 0.5, "dy": -16, "async": true, "p": [[140.0, 58.0], [190.0, 58.0]]}, {"id": "m2", "a": "cons", "b": "pgc", "label": "processPayment()", "t": 0.5, "p": [[295.0, 86.0], [295.0, 165.0]]}, {"id": "m3", "a": "cons", "b": "repo", "label": "státusz-\nfrissítés", "t": 0.5, "dx": 34, "p": [[335.96296296296293, 86.0], [451.53703703703707, 165.0]]}, {"id": "m4", "a": "repo", "b": "db", "label": "[JDBC]", "t": 0.5, "dy": -14, "p": [[555.0, 193.0], [600.0, 193.0]]}, {"id": "m5", "a": "pgc", "b": "pay", "label": "[HTTPS, szinkron, timeout 5 s,\n1 retry, idempotencia-kulcs]", "t": 0.5, "dx": 150, "p": [[295.0, 245.0], [295.0, 312.0]]}], "k": 1.6754850088183422, "fs": 8.4}], PATH = [{"e": ["c1", "c3"], "n": ["user", "sys", "pay"]}, {"e": ["k1", "k2", "k3", "k4", "k6"], "n": ["api", "queue", "worker", "pay"]}, {"e": ["m1", "m2", "m5"], "n": ["queue", "cons", "pgc", "pay"]}], ZOOM = ["sys", "worker", null], MSG = ["1/3 Context: a Rendelés-feldolgozó rendszer egyetlen doboz; a pontozott kiemelés jelöli, mit bontunk ki.", "2/3 Container: a pontozott keret a rendszerhatár (az előző panel kibontott doboza). A fizetési hívás a Worker-ből indul; a pontozott kiemelés a következő ráközelítés.", "3/3 Component: a Worker belseje (pontozott keret). A PaymentGatewayClient hívja a külső fizetési szolgáltatót: HTTPS, timeout 5 s, 1 retry, idempotencia-kulccsal."];
const svg = document.getElementById("v"), status = document.getElementById("status");
let lv = 0;
function show(anim){
  const p = document.getElementById("path").checked;
  drawDiagram(svg, LV[lv], {zoom: ZOOM[lv], hlEdges: p ? PATH[lv].e : [], hlNodes: p ? PATH[lv].n : [], dim: p});
  status.textContent = MSG[lv] + (p ? " Kiemelve: rendelés → üzenet → fizetés." : "");
  document.getElementById("cnt").textContent = (lv + 1) + "/3";
  svg.style.maxWidth = lv === 2 ? "820px" : "560px";
  if (anim && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    svg.style.transition = "none"; svg.style.transform = "scale(0.55)"; svg.style.opacity = "0.3";
    requestAnimationFrame(() => requestAnimationFrame(() => { svg.style.transition = "transform 0.5s ease-out, opacity 0.5s"; svg.style.transform = "scale(1)"; svg.style.opacity = "1"; }));
  }
}
document.getElementById("in").onclick = () => { if (lv < 2) { lv++; show(true); } };
document.getElementById("out").onclick = () => { if (lv > 0) { lv--; show(false); } };
document.getElementById("path").onchange = () => show(false);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(false));
show(false);

</script>
