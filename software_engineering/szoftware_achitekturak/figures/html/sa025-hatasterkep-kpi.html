<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatástérkép és KPI-lánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--band:#f0f0f0;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--band:#242424;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl)}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--fg);font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="group" aria-label="Követelmény kiválasztása">
<button id="b_rq1" aria-pressed="false">RQ-1 útja</button><button id="b_rq2" aria-pressed="false">RQ-2 útja</button>
<button id="b_rq3" aria-pressed="false">RQ-3 útja</button><button id="b_none">Kiemelés törlése</button>
<button id="chg" aria-pressed="false">Követelményváltozás: kötelező regisztráció</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 435" role="img" aria-label="Hatástérkép: cél, szereplők, viselkedésváltozások, követelmények, alatta KPI-sáv"></svg>
<p class="small">Kattints egy követelményre (vagy a gombokra): kiemelődik az útja a célig és a hozzá tartozó KPI-k. Szaggatott él, H = hipotézis (méréssel igazolandó). A bázisértékek szimuláltak.</p>
<script>
const N = {"goal": {"x": 5.0, "y": 124.99999999999996, "w": 130.0, "h": 85.0, "lab": "Konverzió\n4,0% → 4,4%\n(negyedév)", "sh": "double"}, "act1": {"x": 160.0, "y": 61.99999999999994, "w": 135.0, "h": 78.0, "lab": "Regisztráció\nnélküli\nlátogató", "sh": "ellipse"}, "act2": {"x": 160.0, "y": 187.99999999999994, "w": 135.0, "h": 62.0, "lab": "Visszatérő\nvásárló", "sh": "ellipse"}, "imp1": {"x": 314.99999999999994, "y": 61.99999999999994, "w": 145.0, "h": 78.0, "lab": "Nagyobb arányban\nfejezi be a\npénztárt", "sh": "round"}, "imp2": {"x": 314.99999999999994, "y": 187.99999999999994, "w": 145.0, "h": 62.0, "lab": "Kevesebb hibát\ntapasztal", "sh": "round"}, "rq1": {"x": 495.0, "y": 59.999999999999964, "w": 220.0, "h": 50.0, "lab": "RQ-1 vendégvásárlás", "sh": "rect"}, "rq2": {"x": 495.0, "y": 124.99999999999996, "w": 220.0, "h": 60.0, "lab": "RQ-2 pénztár p95\n(navigáció→LCP) < 2000 ms", "sh": "rect"}, "rq3": {"x": 495.0, "y": 199.99999999999994, "w": 220.0, "h": 50.0, "lab": "RQ-3 legfeljebb 3 képernyő", "sh": "rect"}, "k_lag": {"x": 5.0, "y": 301.0, "w": 154.99999999999997, "h": 72.0, "lab": "LAGGING\nkonverziós arány\n(%, havi)", "sh": "kpi"}, "k_comp": {"x": 180.0, "y": 301.0, "w": 169.99999999999997, "h": 72.0, "lab": "LEADING\nbefejezési arány\n55% → 60% (heti)", "sh": "kpi"}, "k_p95": {"x": 369.99999999999994, "y": 301.0, "w": 160.0, "h": 72.0, "lab": "LEADING\npénztár p95\n3500 → < 2000 ms\n(szimulált bázis)", "sh": "kpi"}, "k_guest": {"x": 550.0, "y": 301.0, "w": 164.99999999999997, "h": 72.0, "lab": "LEADING\nvendégként leadott\nrendelések ≥ 30%", "sh": "kpi"}}, ED = [["goal", "act1", "-"], ["goal", "act2", "-"], ["act1", "imp1", "-"], ["act2", "imp2", "-"], ["imp1", "rq1", "-"], ["imp1", "rq2", "H"], ["imp1", "rq3", "-"], ["imp2", "rq3", "-"]], KL = [["k_lag", "goal"], ["k_comp", "imp1"], ["k_p95", "rq2"], ["k_guest", "rq1"]], PA = {"rq1": ["rq1", "imp1", "act1", "goal", "k_guest", "k_comp", "k_lag"], "rq2": ["rq2", "imp1", "act1", "goal", "k_p95", "k_comp", "k_lag"], "rq3": ["rq3", "imp1", "imp2", "act1", "act2", "goal", "k_comp", "k_lag"]}, CH = {"goal": "Konverzió\n4,0% → 4,2%\n(negyedév, +5%)", "k_new": "LEADING\nregisztrációs űrlap\nbefejezési aránya"};
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
let sel = null, changed = false;
function el(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function A(k, s){ const n = N[k]; return {l:[n.x, n.y + n.h / 2], r:[n.x + n.w, n.y + n.h / 2], t:[n.x + n.w / 2, n.y], b:[n.x + n.w / 2, n.y + n.h]}[s]; }
const DEAD = () => changed ? ["rq1", "k_guest"] : [];
function draw(){
  svg.innerHTML = ""; const on = sel ? PA[sel].filter(k => !DEAD().includes(k)) : [];
  [["Cél", 70], ["Szereplők", 227], ["Viselkedésváltozás", 400], ["Követelmények", 612]].forEach(([t, x]) => el("text", {x:x, y:34, "text-anchor":"middle", "font-weight":"bold", "font-size":13}, t));
  el("rect", {x:0, y:288, width:720, height:97, fill:css("--band")});
  ED.forEach(([a, b, k]) => { const p = A(a, "r"), q = A(b, "l"), hot = on.includes(a) && on.includes(b), dead = DEAD().includes(b);
    el("line", {x1:p[0], y1:p[1], x2:q[0], y2:q[1], stroke: dead ? css("--muted") : (hot ? css("--hl") : css("--line")), "stroke-width": hot ? 3 : 1.2, "stroke-dasharray": k === "H" || dead ? "6 4" : ""});
    if (k === "H") { const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; el("circle", {cx:mx, cy:my, r:9, fill:css("--bg"), stroke:css("--line")}); el("text", {x:mx, y:my + 4, "text-anchor":"middle", "font-size":11, "font-weight":"bold"}, "H"); } });
  KL.forEach(([a, b]) => { const p = A(a, "t"), q = A(b, "b"), hot = on.includes(a) && on.includes(b);
    el("line", {x1:p[0], y1:p[1], x2:q[0], y2:q[1], stroke: hot ? css("--hl") : css("--muted"), "stroke-width": hot ? 2.5 : 1, "stroke-dasharray":"2 3"}); });
  const keys = Object.keys(N).concat(changed ? ["k_new"] : []);
  keys.forEach(k => { const n = k === "k_new" ? {x:430, y:390, w:285, h:42, lab:"ÚJ LEADING:\nregisztrációs űrlap befejezési aránya", sh:"kpi"} : N[k];
    const hot = on.includes(k), dead = DEAD().includes(k), lab = (k === "goal" && changed) ? CH.goal : n.lab;
    const st = {fill: hot ? css("--cellhl") : css("--cell"), stroke: hot ? css("--hl") : (dead ? css("--muted") : css("--line")), "stroke-width": hot ? 3 : 1.2, "stroke-dasharray": dead ? "5 3" : ""};
    let shp;
    if (n.sh === "ellipse") shp = el("ellipse", Object.assign({cx:n.x + n.w / 2, cy:n.y + n.h / 2, rx:n.w / 2, ry:n.h / 2}, st));
    else shp = el("rect", Object.assign({x:n.x, y:n.y, width:n.w, height:n.h, rx: n.sh === "rect" ? 0 : 9}, st));
    if (n.sh === "double") el("rect", {x:n.x + 5, y:n.y + 5, width:n.w - 10, height:n.h - 10, rx:6, fill:"none", stroke:css("--line")});
    const lines = lab.split("\n");
    lines.forEach((ln, i, a) => { const t = el("text", {x:n.x + n.w / 2, y:n.y + n.h / 2 + 4 + (i - (a.length - 1) / 2) * 14, "text-anchor":"middle", "font-size":12, "text-decoration": dead ? "line-through" : ""}, ln); if (dead) t.setAttribute("fill", css("--muted")); });
    if (k.startsWith("rq") && !dead) { shp.setAttribute("tabindex", "0"); shp.setAttribute("role", "button"); shp.setAttribute("aria-label", lab.replace(/\n/g, " ")); shp.style.cursor = "pointer";
      shp.onclick = () => pick(k); shp.onkeydown = e => { if (e.key === "Enter" || e.key === " ") pick(k); }; } });
  ["rq1", "rq2", "rq3"].forEach(r => document.getElementById("b_" + r).setAttribute("aria-pressed", String(sel === r)));
  document.getElementById("b_rq1").disabled = changed;
  document.getElementById("chg").setAttribute("aria-pressed", String(changed));
  const msg = {rq1:"RQ-1 vendégvásárlás → a látogató nagyobb arányban fejezi be a pénztárt → konverziós cél. KPI-k: vendégként leadott rendelések aránya (≥ 30%), befejezési arány, konverzió.",
    rq2:"RQ-2 pénztár p95 < 2000 ms → (H: hipotézis) befejezési arány 55% → 60% → konverzió. A 60% önmagában 4,36%-ot ad (7,27% × 60%); a 4,4%-hoz 60,5% kellene.",
    rq3:"RQ-3 legfeljebb 3 képernyő → a látogató gyorsabban végez, a visszatérő vásárló kevesebb hibát tapasztal → konverzió. KPI-k: befejezési arány, konverzió."};
  let s = sel ? msg[sel] : "Válassz követelményt az útja kiemeléséhez.";
  if (changed) s = "Követelményváltozás (7.4.6): kötelező regisztráció. RQ-1 törölve, a vendég-KPI értelmetlen, helyére a regisztrációs űrlap befejezési aránya lép; a cél 4,0% → 4,2% (+5%). " + (sel ? s : "");
  document.getElementById("status").textContent = s;
}
function pick(k){ sel = (sel === k) ? null : k; draw(); }
["rq1", "rq2", "rq3"].forEach(r => document.getElementById("b_" + r).onclick = () => pick(r));
document.getElementById("b_none").onclick = () => { sel = null; draw(); };
document.getElementById("chg").onclick = () => { changed = !changed; if (changed && sel === "rq1") sel = null; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
