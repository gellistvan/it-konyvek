<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RollingUpdate és Recreate</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span><label>stratégia <select id="strat"><option>RollingUpdate</option><option>Recreate</option></select></label><label>replicas <input id="rep" type="range" min="1" max="5" value="3"> <span id="repv"></span></label><label>maxSurge <input id="surge" type="range" min="0" max="3" value="1"> <span id="surgev"></span></label><label>maxUnavailable <input id="unav" type="range" min="0" max="3" value="0"> <span id="unavv"></span></label><label><input id="broken" type="checkbox"> az új verzió readiness-e hibás</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 360" role="img" aria-label="A régi és az új ReplicaSet podjai lépésenként, a Service EndpointSlice-ában lévő Ready podok száma"></svg>

<p class="small">Egyszerűsített Deployment-vezérlő modell, szemléltetés. Alapértelmezés: maxSurge 25% (3 replikánál 1), maxUnavailable 25% (3 replikánál lefelé kerekítve 0). A forgalmat a Service irányítja a Ready podokra.</p>
<script>
const DATA = {};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let steps = [], k = 0, timer = null;
const g = id => document.getElementById(id);
function simulate(strategy, R, surge, unavail, broken){
  const pods = Array.from({length: R}, () => ["o", "ready"]), st = [];
  const snap = msg => st.push({pods: pods.map(p => p.slice()), ep: pods.filter(p => p[1] === "ready").length, msg});
  snap(`Kiindulás: ${R} régi (v1.2.3) pod Ready.`);
  for (let it = 0; it < 40; it++) {
    for (let i = pods.length - 1; i >= 0; i--) if (pods[i][1] === "term") pods.splice(i, 1);
    if (pods.length === R && pods.every(p => p[0] === "n" && p[1] === "ready")) break;
    if (strategy === "Recreate") {
      if (pods.some(p => p[0] === "o")) { pods.forEach(p => p[1] = "term"); snap("Recreate: mind a régi pod leáll – kiesés, nincs Ready endpoint."); }
      else if (!pods.length) { for (let i = 0; i < R; i++) pods.push(["n", "start"]); snap(`${R} új (v1.2.4) pod indul; a readiness még nem sikeres.`); }
      else if (!broken) { pods.forEach(p => p[1] = "ready"); snap("Az új podok Ready-vé válnak, bekerülnek az EndpointSlice-ba."); }
      else { snap("Az új podok readiness probe-ja hibás: a szolgáltatás kiesésben marad."); break; }
      continue;
    }
    const starting = pods.filter(p => p[1] === "start");
    if (starting.length && !broken) { starting.forEach(p => p[1] = "ready"); snap(`${starting.length} új pod Ready – bekerül az EndpointSlice-ba.`); continue; }
    const msgs = []; let ready = pods.filter(p => p[1] === "ready").length;
    const olds = pods.filter(p => p[0] === "o" && p[1] !== "term"); let kill = 0;
    while (olds.length && ready - 1 >= R - unavail) { olds.shift()[1] = "term"; ready--; kill++; }
    if (kill) msgs.push(`${kill} régi pod leáll`);
    let live = pods.filter(p => p[1] !== "term").length, nw = pods.filter(p => p[0] === "n").length, start = 0;
    while (live < R + surge && nw < R) { pods.push(["n", "start"]); live++; nw++; start++; }
    if (start) msgs.push(`${start} új pod indul`);
    if (!msgs.length) { snap("A rollout megáll: az új pod nem lesz Ready, régi nem állítható le (maxUnavailable), új nem indítható (maxSurge) – a régi podok kiszolgálnak."); break; }
    snap(msgs.join("; ") + ".");
  }
  return st;
}
function recompute(){
  stop();
  const R = +g("rep").value, s = +g("surge").value, u = +g("unav").value;
  g("repv").textContent = R; g("surgev").textContent = s; g("unavv").textContent = u;
  steps = simulate(g("strat").value, R, s, u, g("broken").checked); k = 0; draw();
}
function draw(){
  const R = +g("rep").value, st = steps[k];
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg"), hl = css("--hl2");
  mk(svg, "text", {x: 20, y: 24, "font-size": 14, "font-weight": "bold"}, `Deployment my-app (replicas: ${R}) · ${g("strat").value}`);
  mk(svg, "text", {x: 20, y: 52, "font-size": 13}, "régi ReplicaSet (v1.2.3)");
  mk(svg, "text", {x: 300, y: 52, "font-size": 13}, "új ReplicaSet (v1.2.4)");
  const col = {o: 20, n: 300}, cnt = {o: 0, n: 0};
  st.pods.forEach(([v, s]) => {
    const x = col[v] + (cnt[v] % 4) * 64, y = 64 + Math.floor(cnt[v] / 4) * 52; cnt[v]++;
    mk(svg, "rect", {x, y, width: 56, height: 40, fill: v === "n" ? css("--fill2") : css("--bg"), stroke: fg,
      "stroke-width": s === "ready" ? 3.5 : 1.3, "stroke-dasharray": s === "start" ? "5 4" : ""});
    mk(svg, "text", {x: x + 28, y: y + 18, "text-anchor": "middle", "font-size": 11}, v === "n" ? "v1.2.4" : "v1.2.3");
    mk(svg, "text", {x: x + 28, y: y + 33, "text-anchor": "middle", "font-size": 10}, s === "ready" ? "Ready" : (s === "start" ? "indul" : "leáll"));
    if (s === "term") mk(svg, "line", {x1: x, y1: y + 40, x2: x + 56, y2: y, stroke: fg, "stroke-width": 2});
  });
  // Service és EndpointSlice
  mk(svg, "rect", {x: 560, y: 40, width: 180, height: 50, rx: 8, fill: css("--fill3"), stroke: fg});
  mk(svg, "text", {x: 650, y: 70, "text-anchor": "middle", "font-size": 13}, "Service my-app");
  mk(svg, "text", {x: 560, y: 116, "font-size": 12}, "EndpointSlice (ready):");
  st.pods.filter(p => p[1] === "ready").forEach(([v], i) => mk(svg, "text", {x: 572, y: 136 + i * 16, "font-size": 12}, `• pod ${v === "n" ? "v1.2.4" : "v1.2.3"}`));
  const bad = st.ep < R;
  mk(svg, "text", {x: 300, y: 200, "font-size": 15, "font-weight": "bold", fill: bad ? hl : fg}, `Ready endpointok: ${st.ep} / kívánt: ${R}`);
  // EP-idősor
  const x0 = 20, y0 = 300, w = 520;
  mk(svg, "text", {x: x0, y: y0 - 40, "font-size": 12}, "Ready endpointok lépésenként:");
  steps.forEach((s2, i) => { const x = x0 + i * Math.min(48, w / steps.length), hh = s2.ep * 8;
    mk(svg, "rect", {x, y: y0 - hh + 30, width: Math.min(40, w / steps.length - 4), height: hh, fill: i === k ? hl : css("--fill2"), stroke: fg, "stroke-width": .6});
    mk(svg, "text", {x: x + 4, y: y0 + 44, "font-size": 11}, String(s2.ep)); });
  status.textContent = `${k}. lépés: ${st.msg} Ready endpointok: ${st.ep} / kívánt: ${R}.`;
  g("cnt").textContent = `${k}/${steps.length - 1}`;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
g("first").onclick = () => { stop(); k = 0; draw(); };
g("prev").onclick = () => { stop(); k = Math.max(0, k - 1); draw(); };
g("next").onclick = () => { stop(); k = Math.min(steps.length - 1, k + 1); draw(); };
g("play").onclick = () => { if (timer) { stop(); return; } if (k >= steps.length - 1) k = 0; g("play").textContent = "⏸ Szünet"; draw();
  timer = setInterval(() => { if (k >= steps.length - 1) stop(); else { k++; draw(); } }, 1000); };
["strat", "rep", "surge", "unav", "broken"].forEach(id => g(id).oninput = g(id).onchange = recompute);
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return; if (e.key === "ArrowRight") g("next").click(); if (e.key === "ArrowLeft") g("prev").click(); });
steps = simulate("RollingUpdate", 3, 1, 0, false);
g("repv").textContent = 3; g("surgev").textContent = 1; g("unavv").textContent = 0;

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
