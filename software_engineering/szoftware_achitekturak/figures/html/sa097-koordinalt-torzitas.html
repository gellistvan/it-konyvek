<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koordinált torzítás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{min-width:140px}
#tm{flex:1}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
table{border-collapse:collapse;margin-top:6px}
td,th{border:1px solid var(--muted);padding:2px 10px;text-align:right}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>Tervezett ütem <input type="range" id="rate" min="0" max="5" step="1" value="3"> <span id="rv"></span></label>
  <label>Beakadás hossza <input type="range" id="stall" min="0" max="2000" step="100" value="1000"> <span id="sv"></span></label>
</div>
<div class="ctl" role="group" aria-label="Lejátszás">
  <button id="play" type="button">▶ Lejátszás</button>

</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 300" role="img" aria-label="Két idővonal: a zárt modellben a beakadás alatt egyetlen lassú kérés fut és nincs új kérés, a nyílt modellben a beakadás alatt is érkeznek kérések, amelyek sorban várnak."></svg>
<table aria-label="Percentilisek"><thead><tr><th></th><th>minta</th><th>p95</th><th>p99</th></tr></thead>
<tbody><tr><th>zárt</th><td id="nc"></td><td id="c95"></td><td id="c99"></td></tr>
<tr><th>nyílt</th><td id="no"></td><td id="o95"></td><td id="o99"></td></tr></tbody></table>
<p class="small">Determinisztikus szimuláció, nem mérés (10 s ablak, 1 ms normál válaszidő, beakadás t = 5 s-nál; percentilis: legközelebbi rang). A táblázat értékeit az ábraszkript Pythonban számolta; a pálcikák az idő múlásával töltődnek fel.</p>

const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, txt){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function sim(rate, stall){ const gap = 1000 / rate, n = Math.floor(WIN / gap), end = STALL_AT + stall;
  const fin = t => (t >= STALL_AT && t < end) ? end : t + BASE; const c = [], o = []; let busy = -1;
  for (let i = 0; i < n; i++) { const t = Math.round(i * gap * 1e6) / 1e6; o.push([t, fin(t) - t]); if (t < busy) continue; const d = fin(t); c.push([t, d - t]); busy = d; }
  return [c, o]; }
let timer = null;
function draw(){
  const rate = RATES[+document.getElementById("rate").value], stall = +document.getElementById("stall").value, now = +document.getElementById("tm").value;
  document.getElementById("rv").textContent = rate + " kérés/s"; document.getElementById("sv").textContent = (stall / 1000).toFixed(1).replace(".", ",") + " s";
  document.getElementById("tv").textContent = "t = " + (now / 1000).toFixed(2).replace(".", ",") + " s";
  const T = TABLE[rate + "|" + stall];
  [["nc", T.nc, ""], ["no", T.no, ""], ["c95", T.c95, " ms"], ["c99", T.c99, " ms"], ["o95", T.o95, " ms"], ["o99", T.o99, " ms"]].forEach(([id, v, u]) => document.getElementById(id).textContent = v + u);
  const [c, o] = sim(rate, stall);

}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("play").addEventListener("click", () => { if (timer) { stop(); return; }
  const r = document.getElementById("tm"); if (+r.value >= WIN) r.value = 0; document.getElementById("play").textContent = "⏸ Szünet";

draw();
