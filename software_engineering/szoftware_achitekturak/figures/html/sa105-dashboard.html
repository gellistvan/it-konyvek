<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architektúra-egészség dashboard</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>#v{background:#fff;border-radius:6px;max-width:860px}#v text:not([fill]){fill:#111} #v g[data-p]{cursor:pointer}</style><span>Rétegek: <label><input type="checkbox" id="L_biz" checked onchange="show(k)"> Üzleti hatás</label> <label><input type="checkbox" id="L_dlv" checked onchange="show(k)"> Szállítási teljesítmény</label> <label><input type="checkbox" id="L_arc" checked onchange="show(k)"> Architektúrális minőség</label> <label><input type="checkbox" id="L_ops" checked onchange="show(k)"> Üzemeltetési egészség</label> </span><label>A: <input id="sA" type="range" min="99" max="100" step="0.01" value="99.99" oninput="show(k)" aria-label="Rendelkezésre állás"> <span id="vA"></span></label><label>p95: <input id="sP" type="range" min="100" max="1000" step="10" value="330" oninput="show(k)" aria-label="p95 válaszidő"> <span id="vP"></span></label><label>Hibaarány: <input id="sE" type="range" min="0" max="3" step="0.1" value="0.2" oninput="show(k)" aria-label="Hibaarány"> <span id="vE"></span></label><div id="res" aria-live="polite" style="width:100%;font-weight:bold"></div><label>Runbook panelenként: <select onchange="rb(this.value)"><option value="">– válassz panelt –</option><option value="conv">Konverziós ráta</option><option value="otime">Rendelésfeld. idő</option><option value="df">Deploy- gyakoriság</option><option value="lt">Lead time</option><option value="cfr">CFR</option><option value="fdrt">Helyreáll. idő</option><option value="rr">Rework rate</option><option value="cyc">Ciklikus függőségek</option><option value="ff">Fitness function passzolás</option><option value="cov">Lefedettség (változó kód)</option><option value="A">Rendelk. állás</option><option value="p95">p95 válaszidő</option><option value="err">Hibaarány</option></select></label><div id="rbx" aria-live="polite" class="small" style="width:100%"></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy sávos dashboard üzleti, szállítási, architektúrális és üzemeltetési mutatókkal; a kompozit 0,77 elfedi a p95 10%-os célsértését."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szintetikus adat, nem mérés. Arányok: cél/érték a rendelkezésre állásra, érték/cél a p95-re és a hibaarányra (1 = cél, 1 fölött rosszabb).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Az üzemeltetési értékeket a csúszkákkal állíthatod; a kompozit és a legrosszabb dimenzió élőben frissül. Panelre kattintva megjelenik a runbook-leírás (Mutatja / Normál / Teendő)."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function G(id){return document.getElementById(id);}
function setLines(id, lines){
  const g = G(id); if (!g) return;
  const old = g.querySelectorAll('text'); if (!old.length) return;
  if (!g.dataset.bb) { const b = g.getBBox(); const fsz = parseFloat(old[0].style.fontSize) || 9;
    g.dataset.bb = JSON.stringify([b.x + b.width / 2, b.y + b.height / 2, fsz]); }
  const [cx, cy, fsz] = JSON.parse(g.dataset.bb), lh = fsz * 1.15, y0 = cy - (lines.length - 1) * lh / 2 + fsz * 0.35;
  old.forEach(t => t.remove());
  lines.forEach((l, i) => { const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', cx); t.setAttribute('y', y0 + i * lh); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('style', "font-size:" + fsz + "px;font-family:'DejaVu Sans'"); t.textContent = l; g.appendChild(t); });
}
function hu(x, d){ return x.toFixed(d).replace('.', ','); }

function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];

}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };

document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
