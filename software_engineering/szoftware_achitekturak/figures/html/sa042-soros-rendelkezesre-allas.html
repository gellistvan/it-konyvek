<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soros rendelkezésre állás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>n: <input id="n" type="range" min="1" max="20" value="10" oninput="upd()" aria-label="láncszemek száma"> <span id="nv">10</span></label> <label>A<sub>i</sub> (%): <input id="ai" type="range" min="99" max="99.99" step="0.01" value="99.9" oninput="upd()" aria-label="szolgáltatásonkénti rendelkezésre állás"> <span id="aiv">99,90</span></label> <label><input type="checkbox" id="fb" onchange="recompute()"> fallback/cache az árkalkulációra</label></div><div class="ctl"><strong id="res">Út: A = 99,90%^10 = 99,00%, éves állásidő ≈ 87,2 óra</strong></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül az út rendelkezésre állása a láncszemek számának függvényében, alul a pénztár, rendelés, árkalkuláció lánc és három egészséges szolgáltatás; a kiesés visszafelé terjed."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Elméleti modell, nem mérés: független meghibásodások, minden tag kötelező, szinkron hívás; éves állásidő = (1 − A)·8760 óra. A fejezet 87,6 órája a 0,990-re kerekített értékből adódik; pontosan 0,999¹⁰ = 0,99004, azaz ≈ 87,2 óra/év.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"down": ["Árkalkuláció"], "deg": [], "msg": "Kiesett: Árkalkuláció."}, {"down": ["Rendelés", "Árkalkuláció"], "deg": [], "msg": "Rendelés: a kötelező szinkron hívás hibára fut, így maga is hibát ad (kaszkád)."}, {"down": ["Pénztár", "Rendelés", "Árkalkuláció"], "deg": [], "msg": "Pénztár: a kötelező szinkron hívás hibára fut, így maga is hibát ad (kaszkád)."}, {"down": ["Pénztár", "Rendelés", "Árkalkuláció"], "deg": [], "msg": "Felhasználói utak – Pénztár (rendelés leadása): nem elérhető; Bejelentkezés: elérhető; Böngészés: elérhető; Fizetési állapot: elérhető."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SERV = ["Pénztár", "Rendelés", "Árkalkuláció", "Felhasználókezelő", "Katalógus", "Fizetés"], CALLS = [["Pénztár", "Rendelés"], ["Rendelés", "Árkalkuláció"]], PATHS = [["Pénztár (rendelés leadása)", ["Pénztár", "Rendelés", "Árkalkuláció"]], ["Bejelentkezés", ["Felhasználókezelő"]], ["Böngészés", ["Katalógus"]], ["Fizetési állapot", ["Fizetés"]]];
let FAILED = ["Árkalkuláció"];
function cascade(failed, fallback){
  const down = new Set(failed), deg = new Set(), steps = [];
  const srt = a => [...a].sort();
  steps.push({down: srt(down), deg: [], msg: "Kiesett: " + srt(down).join(", ") + "."});
  let frontier = new Set(failed);
  while (frontier.size) {
    const nxt = new Set();
    CALLS.forEach(([caller, callee]) => {
      if (frontier.has(callee) && !down.has(caller) && !deg.has(caller)) {
        if (fallback && callee === "Árkalkuláció") { deg.add(caller); steps.push({down: srt(down), deg: srt(deg), msg: `${caller}: az Árkalkuláció hívása hibára fut, de a fallback (gyorsítótárazott ár) miatt degradált módban válaszol.`}); }
        else nxt.add(caller);
      }
    });
    if (nxt.size) { nxt.forEach(x => down.add(x)); steps.push({down: srt(down), deg: srt(deg), msg: srt(nxt).join(", ") + ": a kötelező szinkron hívás hibára fut, így maga is hibát ad (kaszkád)."}); }
    frontier = nxt;
  }
  const res = PATHS.map(([name, chain]) => down.has(chain[0]) ? `${name}: nem elérhető` : chain.some(c => down.has(c) || deg.has(c)) ? `${name}: degradált módban elérhető` : `${name}: elérhető`);
  steps.push({down: srt(down), deg: srt(deg), msg: "Felhasználói utak – " + res.join("; ") + "."});
  return steps;
}
function recompute(){ setSteps(cascade(FAILED, document.getElementById("fb").checked)); }
function toggle(s){ const i = FAILED.indexOf(s); if (i >= 0) FAILED.splice(i, 1); else FAILED.push(s); if (!FAILED.length) { setSteps([{down: [], deg: [], msg: "Minden szolgáltatás egészséges; kattintson egy szolgáltatásra a kieséséhez."}]); return; } recompute(); }
function fmt(x, d){ return x.toFixed(d).replace(".", ","); }
function upd(){
  const n = +document.getElementById("n").value, a = +document.getElementById("ai").value / 100;
  document.getElementById("nv").textContent = n; document.getElementById("aiv").textContent = fmt(a * 100, 2);
  const A = Math.pow(a, n);
  document.getElementById("res").textContent = `Út: A = ${fmt(a * 100, 2)}%^${n} = ${fmt(A * 100, 2)}%, éves állásidő ≈ ${fmt((1 - A) * 8760, 1)} óra`;
  show(k);
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 860 470");
  const fg = css("--fg"), mu = css("--muted");
  const n = +document.getElementById("n").value, a = +document.getElementById("ai").value / 100;
  // felső panel: görbék
  const X = i => 80 + (i - 1) / 19 * 740, ymin = Math.min(97.8, 100 * Math.pow(a, 20) - 0.1), Y = v => 30 + (100.1 - v) / (100.1 - ymin) * 170;
  el("line", {x1: 80, y1: Y(ymin), x2: 820, y2: Y(ymin), stroke: fg});
  el("line", {x1: 80, y1: 30, x2: 80, y2: Y(ymin), stroke: fg});
  [100, (100 + ymin) / 2, ymin].forEach(v => el("text", {x: 74, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, fmt(v, 2) + "%"));
  [1, 5, 10, 15, 20].forEach(i => el("text", {x: X(i), y: Y(ymin) + 16, "text-anchor": "middle", "font-size": 11}, String(i)));
  el("text", {x: 450, y: Y(ymin) + 32, "text-anchor": "middle", "font-size": 12}, "kötelező szolgáltatások száma (n)");
  [[a, "none", "választott A_i"], [0.999, "5 4", "99,9%"], [0.9999, "2 3", "99,99%"]].forEach(([q, da, lab], j) => {
    let d = ""; for (let i = 1; i <= 20; i++) d += (i === 1 ? "M" : "L") + X(i) + " " + Y(100 * Math.pow(q, i)) + " ";
    el("path", {d: d, fill: "none", stroke: j ? mu : fg, "stroke-width": j ? 1.3 : 2.2, "stroke-dasharray": da});
    if (j) el("text", {x: 826, y: Y(100 * Math.pow(q, 20)) + 4, "font-size": 10.5, fill: mu}, lab);
  });
  el("circle", {cx: X(n), cy: Y(100 * Math.pow(a, n)), r: 6, fill: css("--hl2"), stroke: fg});
  el("text", {x: X(n) + (n > 15 ? -10 : 10), y: Y(100 * Math.pow(a, n)) - 10, "text-anchor": n > 15 ? "end" : "start", "font-size": 12, "font-weight": "bold"}, `n = ${n}: ${fmt(100 * Math.pow(a, n), 2)}%`);
  // alsó panel: szolgáltatások
  const P = {"Pénztár": [20, 300], "Rendelés": [215, 300], "Árkalkuláció": [410, 300], "Felhasználókezelő": [620, 260], "Katalógus": [620, 330], "Fizetés": [620, 400]};
  CALLS.forEach(([c, d]) => {
    const down = s.down.includes(d);
    el("line", {x1: P[c][0] + 150, y1: P[c][1] + 14, x2: P[d][0], y2: P[d][1] + 14, stroke: fg, "stroke-width": 1.3});
    el("text", {x: (P[c][0] + 150 + P[d][0]) / 2, y: P[c][1] + 8, "text-anchor": "middle", "font-size": 10}, "szinkron");
    if (down && (s.down.includes(c) || s.deg.includes(c))) el("line", {x1: P[d][0], y1: P[d][1] + 34, x2: P[c][0] + 150, y2: P[c][1] + 34, stroke: css("--hl2"), "stroke-width": 3.2, "stroke-dasharray": "7 4"});
  });
  SERV.forEach(name => {
    const [x, y] = P[name], dn = s.down.includes(name), dg = s.deg.includes(name);
    const r = el("rect", {x: x, y: y, width: 150, height: 48, rx: 6, fill: dn ? css("--cellhl") : css("--cell"), stroke: fg, "stroke-width": dn ? 2.4 : 1.3, "stroke-dasharray": dg ? "5 3" : "none", tabindex: 0, role: "button", "aria-label": name + " kiesése/visszaállítása", style: "cursor:pointer"});
    r.addEventListener("click", () => toggle(name));
    r.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(name); } });
    const t = el("text", {x: x + 75, y: y + 21, "text-anchor": "middle", "font-size": 13, "text-decoration": dn ? "line-through" : "none", style: "pointer-events:none"}, name);
    el("text", {x: x + 75, y: y + 39, "text-anchor": "middle", "font-size": 11, fill: mu, style: "pointer-events:none"}, dn ? "hibás / leállt" : dg ? "degradált" : "egészséges");
  });
  el("text", {x: 30, y: 250, "font-size": 12, fill: mu}, "Kattintson egy szolgáltatásra a kieséséhez (ismét: visszaáll); ▶ a hibaterjedés lépései.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
