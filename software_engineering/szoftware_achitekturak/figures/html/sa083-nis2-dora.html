<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIS2 és DORA jelentési határidők egy mintaincidensen</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl">
<label>t0 (hétfő, óra) <input id="t0h" type="range" min="0" max="23" value="9" aria-label="t0 órája"></label><span id="t0hv" class="small"></span>
<label>minősítés t0 után (h) <input id="clh" type="range" min="0" max="30" value="2" aria-label="minősítés késése"></label><span id="clhv" class="small"></span>
<label>beküldés eltolása a határidőhöz (h): DORA kezdeti <input id="sdi" type="range" min="-4" max="12" value="0"></label><span id="sdiv" class="small"></span>
<label>DORA köztes <input id="sdm" type="range" min="-48" max="24" value="0"></label><span id="sdmv" class="small"></span>
<label>NIS2 bejelentés <input id="snn" type="range" min="-48" max="24" value="0"></label><span id="snnv" class="small"></span>
<button onclick="resetAll()">A könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két idővonal: NIS2 korai előrejelzés, bejelentés és zárójelentés; DORA kezdeti, köztes és zárójelentés, a határidők a kezdőeseményekből számolva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet szabályai szerint; a nemzeti átültetés és a hivatalos szöveg az irányadó. A csúszkák a t0-t, a minősítés idejét és a tényleges beküldéseket állítják; a késve beküldött jelentés ferde csíkozású.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "t0: észlelés és tudomásszerzés – innen fut a NIS2 24/72 órás és a DORA 24 órás plafonja.", "i": 0, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "A DORA szerinti minősítés: nagy incidens – innen fut a 4 órás kezdeti határidő.", "i": 1, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "DORA kezdeti bejelentés: min(minősítés + 4 h, t0 + 24 h). Határidő: hétfő 15:00. Beküldve: hétfő 15:00 – időben.", "i": 2, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "NIS2 korai előrejelzés: t0 + 24 h. Határidő: kedd 09:00.", "i": 3, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "NIS2 incidensbejelentés: t0 + 72 h. Határidő: csütörtök 09:00. Beküldve: csütörtök 09:00 – időben.", "i": 4, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "DORA köztes jelentés: a kezdeti bejelentés beküldésétől + 72 h. Határidő: csütörtök 15:00. Beküldve: csütörtök 15:00 – időben.", "i": 5, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "NIS2 zárójelentés: a 72 órás bejelentés beküldésétől + 1 hónap. Határidő: 04. 06. 09:00.", "i": 6, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}, {"msg": "DORA zárójelentés: a köztes jelentés beküldésétől legfeljebb + 1 hónap. Határidő: 04. 06. 15:00.", "i": 7, "r": {"nis2_early": 1741078800000, "nis2_notif": 1741251600000, "nis2_final": 1743930000000, "dora_init": 1741014000000, "dora_inter": 1741273200000, "dora_final": 1743951600000, "t0": 1740992400000, "cls": 1740999600000}, "sub": {"nis2_notif": 1741251600000, "dora_init": 1741014000000, "dora_inter": 1741273200000}, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DEF = [["t0", "t0: észlelés és tudomásszerzés – innen fut a NIS2 24/72 órás és a DORA 24 órás plafonja."], ["cls", "A DORA szerinti minősítés: nagy incidens – innen fut a 4 órás kezdeti határidő."], ["dora_init", "DORA kezdeti bejelentés: min(minősítés + 4 h, t0 + 24 h)."], ["nis2_early", "NIS2 korai előrejelzés: t0 + 24 h."], ["nis2_notif", "NIS2 incidensbejelentés: t0 + 72 h."], ["dora_inter", "DORA köztes jelentés: a kezdeti bejelentés beküldésétől + 72 h."], ["nis2_final", "NIS2 zárójelentés: a 72 órás bejelentés beküldésétől + 1 hónap."], ["dora_final", "DORA zárójelentés: a köztes jelentés beküldésétől legfeljebb + 1 hónap."]], DAYS = ["vasárnap", "hétfő", "kedd", "szerda", "csütörtök", "péntek", "szombat"];
const H = 3600e3;
function addMonth(t){ const d = new Date(t); d.setUTCMonth(d.getUTCMonth() + 1); return d.getTime(); }
function fmtT(t, t0){ const d = new Date(t); const hh = String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0");
  if (t - t0 < 7 * 24 * H) return DAYS[d.getUTCDay()] + " " + hh;
  return String(d.getUTCMonth() + 1).padStart(2, "0") + ". " + String(d.getUTCDate()).padStart(2, "0") + ". " + hh; }
function v(id){ return +document.getElementById(id).value; }
function compute(){
  ["t0h", "clh", "sdi", "sdm", "snn"].forEach(id => document.getElementById(id + "v").textContent = " " + v(id) + " ");
  const t0 = Date.UTC(2025, 2, 3, v("t0h")), cls = t0 + v("clh") * H, r = {t0: t0, cls: cls}, sub = {};
  r.nis2_early = t0 + 24 * H; r.nis2_notif = t0 + 72 * H; sub.nis2_notif = r.nis2_notif + v("snn") * H; r.nis2_final = addMonth(sub.nis2_notif);
  r.dora_init = Math.min(cls + 4 * H, t0 + 24 * H); sub.dora_init = r.dora_init + v("sdi") * H;
  r.dora_inter = sub.dora_init + 72 * H; sub.dora_inter = r.dora_inter + v("sdm") * H; r.dora_final = addMonth(sub.dora_inter);
  return DEF.map((d, i) => {
    const late = sub[d[0]] !== undefined && sub[d[0]] > r[d[0]];
    let m = d[1] + " Határidő: " + fmtT(r[d[0]], t0) + ".";
    if (sub[d[0]] !== undefined) m += " Beküldve: " + fmtT(sub[d[0]], t0) + (late ? " – KÉSVE (" + Math.round((sub[d[0]] - r[d[0]]) / H) + " h)" : " – időben") + ".";
    return {msg: m, i: i, r: r, sub: sub, line: -1};
  });
}
function resetAll(){ [["t0h", 9], ["clh", 2], ["sdi", 0], ["sdm", 0], ["snn", 0]].forEach(([id, x]) => document.getElementById(id).value = x); setSteps(compute()); }
function render(s){
  if (!s.r) { const st = compute(); s = st[Math.min(s.i || 0, st.length - 1)]; }
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 300");
  el("defs", {}).innerHTML = '<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="' + css("--fg") + '" stroke-width="2"/></pattern>';
  const r = s.r, t0 = r.t0, maxh = (Math.max(r.nis2_final, r.dora_final) - t0) / H;
  const X = t => 90 + 650 * Math.log10(1 + Math.max(0, (t - t0) / H)) / Math.log10(1 + maxh * 1.05), YN = 90, YD = 200;
  [[YN, "NIS2 (kör)"], [YD, "DORA (négyzet)"]].forEach(([y, t]) => { el("line", {x1: 90, y1: y, x2: 745, y2: y, stroke: css("--muted")}); el("text", {x: 4, y: y + 4, "font-size": 12.5}, t); });
  [0, 2, 6, 24, 72, 168, 720].forEach(h => { if (h <= maxh * 1.05) { el("line", {x1: X(t0 + h * H), y1: 268, x2: X(t0 + h * H), y2: 274, stroke: css("--fg")}); el("text", {x: X(t0 + h * H), y: 288, "text-anchor": "middle", "font-size": 11}, h ? "+" + (h < 168 ? h + " h" : (h === 168 ? "1 hét" : "30 nap")) : "t0"); }});
  el("line", {x1: 90, y1: 268, x2: 745, y2: 268, stroke: css("--fg")});
  const keys = DEF.map(d => d[0]);
  keys.forEach((key, i) => {
    if (i > s.i) return;
    const cur = i === s.i, col = cur ? css("--hl2") : css("--fg");
    if (key === "t0" || key === "cls") {
      [YN, YD].forEach(y => { if (key === "cls" && y === YN) return;
        el("line", {x1: X(r[key]), y1: y - 50, x2: X(r[key]), y2: y - 8, stroke: col, "stroke-width": 4});
        el("path", {d: `M ${X(r[key]) - 6} ${y - 12} L ${X(r[key]) + 6} ${y - 12} L ${X(r[key])} ${y - 2} Z`, fill: col}); });
      el("text", {x: X(r[key]) + 6, y: key === "t0" ? 36 : YD - 40, "font-size": 11.5, fill: col}, (key === "t0" ? "t0 " : "minősítés ") + fmtT(r[key], t0));
      return;
    }
    const y = key.startsWith("nis2") ? YN : YD, x = X(r[key]);
    el("line", {x1: x, y1: y - 40, x2: x, y2: y + 40, stroke: col, "stroke-dasharray": "5 4"});
    if (key.startsWith("nis2")) el("circle", {cx: x, cy: y, r: 7, fill: css("--bg"), stroke: col, "stroke-width": 2});
    else el("rect", {x: x - 7, y: y - 7, width: 14, height: 14, fill: css("--bg"), stroke: col, "stroke-width": 2});
    const LP = {nis2_early: [-24, "end"], nis2_notif: [-44, "start"], nis2_final: [-24, "end"], dora_init: [50, "start"], dora_inter: [64, "start"], dora_final: [50, "end"]};
    el("text", {x: x + (LP[key][1] === "end" ? -4 : 4), y: y + LP[key][0], "text-anchor": LP[key][1], "font-size": 11, fill: col}, DEF[i][1].split(":")[0].replace(/^(NIS2|DORA) /, "") + " " + fmtT(r[key], t0));
    if (s.sub[key] !== undefined) {
      const xs = X(s.sub[key]), late = s.sub[key] > r[key];
      el("rect", {x: Math.min(x, xs) - 1, y: y + 10, width: Math.abs(xs - x) + 2, height: 9, fill: late ? "url(#hz)" : css("--cellhl"), stroke: col});
      el("text", {x: xs, y: y + 32, "text-anchor": "middle", "font-size": 10, fill: css("--muted")}, late ? "késve" : "beküldve");
    }
  });
}

for (const id of ["t0h", "clh", "sdi", "sdm", "snn"]) document.getElementById(id).addEventListener("input", () => { const kk = k; setSteps(compute()); show(kk); });
["t0h", "clh", "sdi", "sdm", "snn"].forEach(id => document.getElementById(id + "v").textContent = " " + document.getElementById(id).value + " ");


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
