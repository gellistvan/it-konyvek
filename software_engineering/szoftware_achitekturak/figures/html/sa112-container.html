<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerékpárkölcsönző: container-nézet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>Kapcsolat kiemelése QAS szerint:</span> <button data-q="" aria-pressed="true" onclick="show(0)">Mind</button> <button data-q="QAS-1" aria-pressed="false" onclick="show(1)">QAS-1</button> <button data-q="QAS-2" aria-pressed="false" onclick="show(2)">QAS-2</button> <button data-q="QAS-3" aria-pressed="false" onclick="show(3)">QAS-3</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Rendszerhatáron belül mobil, webes felület, Spring Boot monolit hat modullal, MQTT-broker és PostgreSQL; kívül fizetési és térképszolgáltató, zárak. A kiválasztott QAS érintett élei kiemelve."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Mintamegoldás a 29.3 kata container-diagramjához (ADR-001). Folytonos él: szinkron, szaggatott: aszinkron; dupla keret: külső rendszer. A broker beépítése az ADR-001 szerinti egyszerűsítés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"q": "", "msg": "Áttekintés: rendszerhatáron belül mobil- és webes kliens, Spring Boot monolit hat modullal, beépített MQTT-broker és PostgreSQL; kívül fizetési és térképszolgáltató, zárak. Válasszon QAS-t a kiemeléshez."}, {"q": "QAS-1", "msg": "QAS-1 – bérlési API: kliensoldali end-to-end válaszidő p95 ≤ 1,5 s a 15 perces ablakban, siker ≥ 99%, hiba ≤ 1%. Út: Mobilalkalmazás → REST → Bérlés modul → PostgreSQL."}, {"q": "QAS-2", "msg": "QAS-2 – zár visszaigazolása: zárparancstól az ack-ig p95 ≤ 5 s, 10 s-on belüli siker ≥ 99% (nevező: a kiadott zárparancsok). Út: Zárparancs-kezelő → MQTT-broker (QoS 1) → zár, ack vissza a brokeren át az Állomás modulba; újrapróbálás."}, {"q": "QAS-3", "msg": "QAS-3 – konzisztencia: két egyidejű bérlésből pontosan egy sikerül; sérült bérlési tranzakció = 0. Bérlés → PostgreSQL egy tranzakcióban, egyedi bérlés–zár megkötéssel; a Számlázás a fizetési szolgáltatót idempotencia-kulccsal hívja."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const BX = {"bound": [0.05, 0.62, 4.6, 4.42, "Kerékpárkölcsönző Rendszer", "", "sys"], "mobile": [0.2, 4.0, 2.0, 0.62, "Mobilalkalmazás", "iOS/Android", "cont"], "web": [2.5, 4.0, 2.0, 0.62, "Webes admin felület", "SPA", "cont"], "mono": [0.2, 1.7, 4.3, 2.0, "Spring Boot monolit", "", "cont"], "user": [0.3, 2.65, 1.3, 0.72, "Felhasználó", "regisztráció,\nhitelesítés", "mod"], "report": [1.7, 2.65, 1.3, 0.72, "Riport", "kihasználtság,\nkimutatások", "mod"], "billing": [3.1, 2.65, 1.3, 0.72, "Számlázás", "díjszámítás,\nfizetés indítása", "mod"], "rental": [0.3, 1.8, 1.3, 0.72, "Bérlés", "bérlés indítása/\nzárása", "mod"], "station": [1.7, 1.8, 1.3, 0.72, "Állomás", "dokkok, zár- és\nkerékpárállapot", "mod"], "lockcmd": [3.1, 1.8, 1.3, 0.72, "Zárparancs-kezelő", "nyitás/zárás,\nújrapróbálás", "mod"], "db": [0.2, 0.72, 1.9, 0.62, "PostgreSQL", "egy séma, modulonként\nkülön táblacsoport", "cont"], "broker": [2.6, 0.72, 1.9, 0.62, "MQTT-broker", "beépített (ADR-001)", "cont"], "pay": [4.85, 3.55, 1.5, 0.75, "Fizetési\nszolgáltató", "PCI DSS, token", "ext"], "map": [4.85, 2.45, 1.5, 0.62, "Térkép-\nszolgáltató", "", "ext"], "locks": [4.85, 0.72, 1.5, 0.62, "Zárak, szenzorok", "", "ext"]}, ED = [{"p": [[1.2, 4.0], [1.2, 3.7]], "s": "sync", "t": "REST/HTTPS (QAS-1)", "at": [1.25, 3.85], "ha": "left", "q": ["QAS-1"]}, {"p": [[3.5, 4.0], [3.5, 3.7]], "s": "sync", "t": "REST/HTTPS", "at": [3.55, 3.85], "ha": "left", "q": []}, {"p": [[0.95, 1.8], [0.95, 1.34]], "s": "sync", "t": "tranzakció, egyedi\nbérlés–zár (QAS-3)", "at": [1.02, 1.55], "ha": "left", "q": ["QAS-1", "QAS-3"]}, {"p": [[4.4, 3.01], [4.85, 3.9]], "s": "sync", "t": "", "at": null, "ha": "left", "q": []}, {"p": [[4.5, 2.76], [4.85, 2.76]], "s": "sync", "t": "REST", "at": [4.75, 2.93], "ha": "center", "q": []}, {"p": [[3.75, 1.8], [3.75, 1.34]], "s": "async", "t": "MQTT QoS 1,\nújrapróbálás\n(QAS-2)", "at": [3.8, 1.51], "ha": "left", "q": ["QAS-2"]}, {"p": [[4.5, 1.12], [4.85, 1.12]], "s": "async", "t": "", "at": null, "ha": "left", "q": ["QAS-2"]}, {"p": [[4.85, 0.9], [4.5, 0.9]], "s": "async", "t": "", "at": null, "ha": "left", "q": ["QAS-2"]}, {"p": [[2.9, 1.34], [2.9, 1.6], [2.35, 1.6], [2.35, 1.8]], "s": "async", "t": "ack/állapot", "at": [2.95, 1.48], "ha": "left", "q": ["QAS-2"]}], XL = [[5.6, 3.42, "REST, időkorlát,\nidempotencia-kulcs", ["QAS-3"]], [5.6, 1.66, "MQTT: parancs\nés ack", ["QAS-2"]]], QA = {"QAS-1": {"msg": "QAS-1 – bérlési API: kliensoldali end-to-end válaszidő p95 ≤ 1,5 s a 15 perces ablakban, siker ≥ 99%, hiba ≤ 1%. Út: Mobilalkalmazás → REST → Bérlés modul → PostgreSQL.", "mods": ["mobile", "rental", "db"]}, "QAS-2": {"msg": "QAS-2 – zár visszaigazolása: zárparancstól az ack-ig p95 ≤ 5 s, 10 s-on belüli siker ≥ 99% (nevező: a kiadott zárparancsok). Út: Zárparancs-kezelő → MQTT-broker (QoS 1) → zár, ack vissza a brokeren át az Állomás modulba; újrapróbálás.", "mods": ["lockcmd", "broker", "locks", "station"]}, "QAS-3": {"msg": "QAS-3 – konzisztencia: két egyidejű bérlésből pontosan egy sikerül; sérült bérlési tranzakció = 0. Bérlés → PostgreSQL egy tranzakcióban, egyedi bérlés–zár megkötéssel; a Számlázás a fizetési szolgáltatót idempotencia-kulccsal hívja.", "mods": ["rental", "db", "billing", "pay"]}}, Wd = 6.4, Hd = 5.1, S = 125;
function X(v){ return v * S; } function Y(v){ return (Hd - v) * S; }
function ml(x, y, t, o){
  const lines = String(t).split("\n"), e = el("text", Object.assign({x: x, y: y, "font-size": 12}, o || {}));
  lines.forEach((l, j) => { const s = document.createElementNS(NS, "tspan"); s.setAttribute("x", x); s.setAttribute("dy", j ? "1.1em" : "0"); s.textContent = l; e.appendChild(s); });
  return e;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${Wd * S} ${(Hd - 0.55) * S}`);
  document.querySelectorAll("button[data-q]").forEach(b => b.setAttribute("aria-pressed", b.dataset.q === s.q ? "true" : "false"));
  const fg = css("--fg"), hl = css("--hl2"), mu = css("--muted"), on = s.q ? QA[s.q].mods : [];
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`;
  svg.appendChild(defs);
  Object.entries(BX).forEach(([k, b]) => {
    const [x, y, w, h, t, r, kind] = b, act = on.includes(k), dim = s.q && !act && kind !== "sys" && k !== "mono";
    if (kind === "sys") { el("rect", {x: X(x), y: Y(y + h), width: X(w), height: X(h), fill: "none", stroke: fg, "stroke-dasharray": "8 4"}); el("text", {x: X(x) + 8, y: Y(y + h) + 16, "font-size": 13, "font-weight": "bold"}, t); return; }
    el("rect", {x: X(x), y: Y(y + h), width: X(w), height: X(h), rx: 7, fill: act ? css("--cellhl") : css("--cell"), stroke: act ? hl : fg, "stroke-width": act ? 3.2 : 1.4, opacity: dim ? 0.45 : 1});
    if (kind === "ext") el("rect", {x: X(x + 0.04), y: Y(y + h - 0.04), width: X(w - 0.08), height: X(h - 0.08), rx: 5, fill: "none", stroke: act ? hl : fg, opacity: dim ? 0.45 : 1});
    if (k === "mono") { el("text", {x: X(x) + 8, y: Y(y + h) + 16, "font-size": 12.5, "font-weight": "bold"}, t + " (egyetlen deploy; modulok)"); return; }
    const o = {"text-anchor": "middle", opacity: dim ? 0.5 : 1};
    if (r) { ml(X(x + w / 2), Y(y + h) + 16, t, Object.assign({"font-weight": "bold", "font-size": 12}, o)); ml(X(x + w / 2), Y(y) - 8 - 13.2 * (r.split("\n").length - 1), r, Object.assign({"font-size": 11}, o)); }
    else ml(X(x + w / 2), Y(y + h / 2) + 4 - 6.6 * (t.split("\n").length - 1), t, Object.assign({"font-weight": "bold"}, o));
  });
  ED.forEach(e => {
    const act = s.q && e.q.includes(s.q);
    el("polyline", {points: e.p.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: act ? hl : fg, "stroke-width": act ? 3 : 1.4, "stroke-dasharray": e.s === "sync" ? "" : "7 4", "marker-end": act ? "url(#ah2)" : "url(#ah)", opacity: s.q && !act ? 0.45 : 1});
    if (e.t) ml(X(e.at[0]), Y(e.at[1]) + 4, e.t, {"font-size": 11, "text-anchor": e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle"), stroke: css("--bg"), "stroke-width": 4, "paint-order": "stroke", fill: act ? hl : fg});
  });
  XL.forEach(([x, y, t, q]) => ml(X(x), Y(y) + 11, t, {"font-size": 11, "text-anchor": "middle", fill: s.q && q.includes(s.q) ? hl : fg}));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
