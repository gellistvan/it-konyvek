<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A mintaincidens idővonala és mérőszámai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Checkout HTTP 500 arány percenként 13:58–14:55, alatta az események és a TTD, TTA, TTC, TTM mérőszám."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szintetikus adat; a T-S9-066/067 szerint javított értékekkel (a helyreállítás az alapszinthez kötött).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "14:01 – hiba kezdete. Felelős: –. ", "i": 0, "upto": 61, "roles": [], "journal": ["14:01", "checkout HTTP 500 arány emelkedni kezd (utólag a metrikából)", "–", "2%"], "done": [], "line": -1}, {"msg": "14:02 – riasztás. Felelős: ügyeletes. Mérőszámok eddig: TTD = 1 perc.", "i": 1, "upto": 62, "roles": ["scribe"], "journal": ["14:02", "Riasztás: checkout HTTP 500 arány 12% (küszöb 5%)", "Triage indul", "12%"], "done": ["TTD"], "line": -1}, {"msg": "14:06 – nyugtázás, SEV1. Felelős: IC. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc.", "i": 2, "upto": 66, "roles": ["IC", "scribe"], "journal": ["14:06", "Riasztás nyugtázva", "SEV1, IC kijelölve", "42% (csúcs 14:04)"], "done": ["TTD", "TTA"], "line": -1}, {"msg": "14:08 – incidenscsatorna. Felelős: IC + CL. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc.", "i": 3, "upto": 68, "roles": ["IC", "CL", "scribe"], "journal": ["14:08", "IC megnyitja az incidenscsatornát, CL értesítve", "Kommunikáció: 30 perces ciklus", "–"], "done": ["TTD", "TTA"], "line": -1}, {"msg": "14:10 – 1. státuszfrissítés. Felelős: CL. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc, TTC = 8 perc.", "i": 4, "upto": 70, "roles": ["CL", "scribe"], "journal": ["14:10", "Első státuszfrissítés (status page)", "–", "41%"], "done": ["TTD", "TTA", "TTC"], "line": -1}, {"msg": "14:15 – diagnózis. Felelős: OL. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc, TTC = 8 perc.", "i": 5, "upto": 75, "roles": ["OL", "scribe"], "journal": ["14:15", "OL diagnózis: DB pool 100%", "Döntés: pool 200 → 400 + forgalomterelés", "pool 100%"], "done": ["TTD", "TTA", "TTC"], "line": -1}, {"msg": "14:16 – mitigáció. Felelős: OL. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc, TTC = 8 perc, TTM = 14 perc.", "i": 6, "upto": 76, "roles": ["OL", "scribe"], "journal": ["14:16", "Pool 400, forgalom egy része a másodlagos régióba", "Mitigáció végrehajtva", "38%"], "done": ["TTD", "TTA", "TTC", "TTM"], "line": -1}, {"msg": "14:22 – 3,1%. Felelős: CL. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc, TTC = 8 perc, TTM = 14 perc.", "i": 7, "upto": 82, "roles": ["CL", "scribe"], "journal": ["14:22", "Hibaarány 3,1%-ra csökken", "Még nem helyreállítás (SLO-keret 0,1%)", "3,1%"], "done": ["TTD", "TTA", "TTC", "TTM"], "line": -1}, {"msg": "14:34 – helyreállítás. Felelős: IC. Mérőszámok eddig: TTD = 1 perc, TTA = 4 perc, TTC = 8 perc, TTM = 14 perc.", "i": 8, "upto": 94, "roles": ["IC", "scribe"], "journal": ["14:34", "Hibaarány az alapszinten (0,08%)", "Helyreállítás megerősítve", "0,08%"], "done": ["TTD", "TTA", "TTC", "TTM"], "line": -1}, {"msg": "Postmortem összefoglaló: hatás 14:01–14:34 (33 perc, csúcs 42% HTTP 500); TTD = 1 perc, TTA = 4 perc, TTC = 8 perc, TTM = 14 perc; helyreállítás az alapszinten (0,08%) 14:34-kor, lezárás 14:50.", "i": 9, "upto": 110, "roles": ["IC", "scribe"], "journal": ["14:50", "15 perc stabil alapszint", "Incidens lezárva, postmortem ütemezve", "0,08%"], "done": ["TTD", "TTA", "TTC", "TTM"], "line": -1, "summary": true}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"rate": [[58, 0.08], [59, 0.08], [60, 0.08], [61, 2.0], [62, 12.0], [63, 30.0], [64, 42.0], [65, 41.0], [66, 40.0], [67, 41.0], [68, 42.0], [69, 40.0], [70, 41.0], [71, 40.0], [72, 41.0], [73, 42.0], [74, 41.0], [75, 40.0], [76, 38.0], [77, 25.0], [78, 15.0], [79, 9.0], [80, 6.0], [81, 4.2], [82, 3.1], [83, 2.286], [84, 1.685], [85, 1.242], [86, 0.916], [87, 0.675], [88, 0.498], [89, 0.367], [90, 0.271], [91, 0.2], [92, 0.147], [93, 0.109], [94, 0.08], [95, 0.08], [96, 0.08], [97, 0.08], [98, 0.08], [99, 0.08], [100, 0.08], [101, 0.08], [102, 0.08], [103, 0.08], [104, 0.08], [105, 0.08], [106, 0.08], [107, 0.08], [108, 0.08], [109, 0.08], [110, 0.08], [111, 0.08], [112, 0.08], [113, 0.08], [114, 0.08], [115, 0.08]], "events": [[61, "14:01", "hiba kezdete", "o"], [62, "14:02", "riasztás", "^"], [66, "14:06", "nyugtázás, SEV1", "D"], [68, "14:08", "incidenscsatorna", "s"], [70, "14:10", "1. státuszfrissítés", "s"], [75, "14:15", "diagnózis", "D"], [76, "14:16", "mitigáció", "D"], [82, "14:22", "3,1%", "s"], [94, "14:34", "helyreállítás", "D"], [110, "14:50", "lezárás", "D"]], "metrics": [["TTD", 61, 62, 1], ["TTA", 62, 66, 4], ["TTC", 62, 70, 8], ["TTM", 62, 76, 14]], "thr": 5.0, "slo": 0.1}, ROLES = ["IC", "OL", "CL", "scribe"];
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 780 430");
  const x0 = D.rate[0][0], x1 = D.rate[D.rate.length - 1][0] + 1, X = t => 70 + (t - x0) / (x1 - x0) * 690;
  const Y = v => 20 + (1 - (Math.log10(v) + 1.4) / 3.4) * 170, hl = css("--hl2");
  [[D.thr, "küszöb 5%", "6 4"], [D.slo, "SLO-keret 0,1%", "2 3"]].forEach(([v, t, da]) => {
    el("line", {x1: 70, y1: Y(v), x2: 760, y2: Y(v), stroke: css("--fg"), "stroke-dasharray": da});
    el("text", {x: 758, y: Y(v) - 4, "text-anchor": "end", "font-size": 11}, t); });
  [0.1, 1, 5, 42].forEach(v => el("text", {x: 64, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v).replace(".", ",") + "%"));
  let d = "";
  D.rate.forEach(([t, v], i) => { if (t > s.upto) return; d += (i ? " L " : "M ") + X(t) + " " + Y(v) + " L " + X(Math.min(t + 1, s.upto + (s.summary ? 6 : 0))) + " " + Y(v); });
  el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  el("line", {x1: X(s.upto), y1: 14, x2: X(s.upto), y2: 280, stroke: hl, "stroke-width": 1.5});
  // eseménysáv
  D.events.forEach((e, i) => { if (i > s.i) return; const x = X(e[0]), y = 226, cur = i === s.i, col = cur ? hl : css("--fg");
    if (e[3] === "^") el("path", {d: `M ${x - 7} ${y + 6} L ${x + 7} ${y + 6} L ${x} ${y - 7} Z`, fill: col});
    else if (e[3] === "D") el("path", {d: `M ${x} ${y - 8} L ${x + 7} ${y} L ${x} ${y + 8} L ${x - 7} ${y} Z`, fill: css("--bg"), stroke: col, "stroke-width": 2});
    else if (e[3] === "s") el("rect", {x: x - 6, y: y - 6, width: 12, height: 12, fill: css("--bg"), stroke: col, "stroke-width": 2});
    else el("circle", {cx: x, cy: y, r: 6, fill: css("--bg"), stroke: col, "stroke-width": 2});
    if (cur) el("text", {x: Math.min(Math.max(x, 60), 700), y: y - 14, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: hl}, e[1] + " " + e[2]); });
  D.metrics.forEach((mm, j) => { if (!s.done.includes(mm[0])) return; const y = 246 + j * 13;
    el("path", {d: `M ${X(mm[1])} ${y - 4} L ${X(mm[1])} ${y} L ${X(mm[2])} ${y} L ${X(mm[2])} ${y - 4}`, fill: "none", stroke: css("--fg"), "stroke-width": 1.3});
    el("text", {x: X(mm[2]) + 4, y: y + 4, "font-size": 11}, mm[0] + " = " + mm[3] + " perc"); });
  ["14:00", "14:10", "14:20", "14:30", "14:40", "14:50"].forEach((t, i) => el("text", {x: X(60 + i * 10), y: 310, "text-anchor": "middle", "font-size": 11}, t));
  // szerepek
  ROLES.forEach((r, i) => { const on = s.roles.includes(r);
    el("rect", {x: 70 + i * 90, y: 322, width: 80, height: 24, rx: 5, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : css("--muted"), "stroke-width": on ? 2.5 : 1});
    el("text", {x: 110 + i * 90, y: 339, "text-anchor": "middle", "font-size": 12.5, "font-weight": on ? "bold" : "normal"}, r); });
  el("text", {x: 4, y: 339, "font-size": 11.5}, "Szerepek:");
  // jegyzőkönyv
  const hdr = ["Időpont", "Esemény", "Döntés / beavatkozás", "Hatás (mért)"], cw = [60, 330, 250, 100]; let x = 10;
  hdr.forEach((h, i) => { el("text", {x: x, y: 372, "font-size": 11, "font-weight": "bold"}, h); x += cw[i]; });
  x = 10; s.journal.forEach((c, i) => { el("text", {x: x, y: 392, "font-size": 11.5, fill: hl}, c.length > (i === 1 ? 52 : 40) ? c.slice(0, i === 1 ? 51 : 39) + "…" : c); x += cw[i]; });
  el("text", {x: 4, y: 420, "font-size": 11, fill: css("--muted")}, s.summary ? "Postmortem: a mérőszámok az eseményekből számolva; szintetikus adat." : "Jegyzőkönyv aktuális sora (a 23.3.3 táblázata a javított értékekkel); szintetikus adat.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
