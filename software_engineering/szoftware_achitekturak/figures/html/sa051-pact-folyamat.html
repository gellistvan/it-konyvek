<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogyasztóvezérelt szerződésteszt</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>provider válasza: <select id="var"><option value="helyes">helyes válasz</option><option value="nincs_nev">nev hiányzik</option><option value="mas_nev">nev más érték
(azonos típus)</option><option value="ar_szoveg">ar szövegként</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A fogyasztói teszt mock szerveren pact fájlt állít elő, a provider-verifikáció ezt a futó provideren ellenőrzi; hiányzó mezőnél vagy típuseltérésnél 1-es kilépési kóddal bukik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A like() matcher típusegyezést ellenőriz: azonos típusú más érték (nev: "Másik") zöld marad, a hiányzó mező vagy a szöveges ar piros. Modell a 14.2.18 kódja alapján, nem futtatott Pact-kimenet.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. A consumer Jest-tesztje indul: given('a termek-123 termék létezik'), uponReceiving(…), willRespondWith(like(…)).", "i": 0, "var": "helyes"}, {"msg": "2. executeTest: a Pact elindítja a mock szervert (mockServer.url).", "i": 1, "var": "helyes"}, {"msg": "3. A valódi kliens kód hívja a mockot: TermekKatalogusKliens.getTermek('termek-123').", "i": 2, "var": "helyes"}, {"msg": "4. Assert a kliens oldalán: id, nev, ar a várt értékekkel – a fogyasztó tényleg így használja a választ.", "i": 3, "var": "helyes"}, {"msg": "5. A mock leáll, és megírja a szerződést: pacts/webes-kliens-termek-katalogus.json.", "i": 4, "var": "helyes"}, {"msg": "6. Átadás: a pact fájl az artefakt-tárba / brokerbe kerül, a Provider CI onnan olvassa.", "i": 5, "var": "helyes"}, {"msg": "7. Provider CI: a Verifier lefuttatja a state handlert ('a termek-123 termék létezik') – tesztadat beszúrása.", "i": 6, "var": "helyes"}, {"msg": "8. Verifikáció: GET /products/termek-123 a futó provideren (localhost:8080), a válasz összevetése a szerződéssel. Provider-válasz: helyes válasz → minden mező jelen van, a típusok egyeznek (like) → exit 0.", "i": 7, "var": "helyes", "exit": 0}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const ST = [["c", "1. A consumer Jest-tesztje indul: given('a termek-123 termék létezik'), uponReceiving(…), willRespondWith(like(…))."], ["c", "2. executeTest: a Pact elindítja a mock szervert (mockServer.url)."], ["c", "3. A valódi kliens kód hívja a mockot: TermekKatalogusKliens.getTermek('termek-123')."], ["c", "4. Assert a kliens oldalán: id, nev, ar a várt értékekkel – a fogyasztó tényleg így használja a választ."], ["c", "5. A mock leáll, és megírja a szerződést: pacts/webes-kliens-termek-katalogus.json."], ["b", "6. Átadás: a pact fájl az artefakt-tárba / brokerbe kerül, a Provider CI onnan olvassa."], ["p", "7. Provider CI: a Verifier lefuttatja a state handlert ('a termek-123 termék létezik') – tesztadat beszúrása."], ["p", "8. Verifikáció: GET /products/termek-123 a futó provideren (localhost:8080), a válasz összevetése a szerződéssel."]], VAR = {"helyes": ["helyes válasz", {"id": "termek-123", "nev": "Mechanikus billentyűzet", "ar": 24990}], "nincs_nev": ["nev hiányzik", {"id": "termek-123", "ar": 24990}], "mas_nev": ["nev más érték\n(azonos típus)", {"id": "termek-123", "nev": "Másik", "ar": 24990}], "ar_szoveg": ["ar szövegként", {"id": "termek-123", "nev": "Mechanikus billentyűzet", "ar": "24990"}]}, RES = {"helyes": [0, "minden mező jelen van, a típusok egyeznek (like)"], "nincs_nev": [1, "hiányzó mező: nev"], "mas_nev": [0, "minden mező jelen van, a típusok egyeznek (like)"], "ar_szoveg": [1, "típuseltérés: ar (várt: int, kapott: str)"]};
const BOX = [[20, 60, 260, 40, "1. Jest-teszt: given / uponReceiving / like(…)"], [20, 120, 120, 40, "2. mock szerver"],
  [160, 120, 120, 40, "3. getTermek(…)"], [20, 180, 260, 40, "4. assert: id, nev, ar"],
  [20, 240, 260, 40, "5. pacts/…termek-katalogus.json"], [300, 240, 110, 40, "6. pact fájl"],
  [430, 60, 220, 40, "7. Verifier + state handler"], [430, 120, 220, 40, "8. GET /products/termek-123"]];
function render(s){
  svg.setAttribute("viewBox", "0 0 660 360");
  svg.innerHTML = ""; defs0();
  [[10, 280, "Consumer CI"], [295, 120, "artefakt-tár"], [420, 240, "Provider CI"]].forEach(l => { R(l[0], 20, l[1], 280, {rx: 0, fill: "none", "stroke-dasharray": "5 4", stroke: css("--muted")}); T(l[0] + l[1] / 2, 40, l[2], {"font-size": 13, "font-weight": "bold", "text-anchor": "middle"}); });
  BOX.forEach((b, i) => { const on = i === s.i, done = i < s.i;
    R(b[0], b[1], b[2], b[3], {fill: on ? css("--cellhl") : css("--cell"), "stroke-width": on ? 3 : 1.2, stroke: on ? css("--hl") : css("--line"), opacity: (done || on) ? 1 : 0.55});
    T(b[0] + 8, b[1] + 25, b[4], {"font-size": 12}); });
  if (s.i >= 5) A(280, 260, 298, 260, {"stroke-dasharray": "5 3"});
  if (s.i >= 6) A(410, 250, 428, 85, {"stroke-dasharray": "5 3"});
  if (s.i === 7) {
    const body = VAR[s.var][1], r = RES[s.var];
    R(430, 180, 220, 70, {rx: 2, fill: css("--code")});
    T(438, 198, "provider-válasz:", {"font-size": 12, "font-weight": "bold"});
    T(438, 216, JSON.stringify(body).slice(0, 34), {"font-size": 11, "font-family": "ui-monospace,monospace"});
    T(438, 234, JSON.stringify(body).slice(34), {"font-size": 11, "font-family": "ui-monospace,monospace"});
    R(430, 262, 220, 34, {fill: r[0] === 0 ? css("--cell") : "url(#hat)", "stroke-width": 3, "stroke-dasharray": r[0] === 0 ? "" : "6 3"});
    T(540, 285, "exit " + r[0] + (r[0] === 0 ? " – zöld" : " – piros"), {"font-size": 15, "font-weight": "bold", "text-anchor": "middle"});
    T(20, 330, r[1], {"font-size": 12, fill: css("--muted")});
  }
}
function tr(v){ return ST.map((t, i) => { const s = {msg: t[1], i: i, var: v}; if (i === 7) { s.msg += " Provider-válasz: " + VAR[v][0] + " → " + RES[v][1] + " → exit " + RES[v][0] + "."; s.exit = RES[v][0]; } return s; }); }
document.getElementById("var").addEventListener("change", e => { const keep = +document.getElementById("pos").value; setSteps(tr(e.target.value)); show(keep); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
