<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitOps reconciliációs hurok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="first">⏮</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span><button data-s="staging">staging (selfHeal)</button><button data-s="prod">prod (manuális)</button><button data-s="hpa">HPA</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 800 380" role="img" aria-label="Fejlesztő, Git repó, Argo CD, Kubernetes klaszter és üzemeltető; a drift észlelése és javítása lépésenként"></svg>
<pre class="code" id="code" aria-label="Reconciliációs pszeudokód (18.4.3)"></pre>
<p class="small">Szaggatott: Git → Argo CD (csak olvas), pontozott: élő állapot (watch), folytonos: sync, pont-vonal: kézi beavatkozás. Az ügynök a Gitbe nem ír. Szemléltetés.</p>
<script>
const DATA = {"scen": {"staging": [["1) Synced", 3, 3, "Synced", ["gitargo"], 0, "Staging, selfHeal: true. A Git (config/overlays/staging) replicas: 3, az élő állapot 3 pod: Synced."], ["2) kézi scale", 3, 5, "Synced", ["opk"], 1, "Az üzemeltető kézzel skáláz: kubectl scale --replicas=5 → az élő állapot 5 pod (drift); az ügynök még nem vetette össze."], ["3) OutOfSync", 3, 5, "OutOfSync", ["watch"], 2, "Az Argo CD összeveti a kívánt és az élő állapotot (watch): OutOfSync, diff: /spec/replicas 3 ≠ 5."], ["4) selfHeal sync", 3, 3, "Syncing", ["sync"], 3, "selfHeal: az ügynök sync-kel visszaállítja a klasztert a Git szerinti 3 replikára. A Gitbe nem ír."], ["5) Synced", 3, 3, "Synced", ["gitargo", "watch"], 4, "Ismét Synced: desired 3 / live 3; a hurok folytatódik."]], "prod": [["1) Synced", 3, 3, "Synced", ["gitargo"], 0, "Prod, automated: null (manuális sync). Synced: desired 3 / live 3."], ["2) kézi scale", 3, 5, "Synced", ["opk"], 1, "Kézi beavatkozás: kubectl scale --replicas=5 → live 5."], ["3) OutOfSync", 3, 5, "OutOfSync", ["watch"], 2, "Az Argo CD driftet lát: OutOfSync, /spec/replicas 3 ≠ 5."], ["4′) riasztás", 3, 5, "OutOfSync", ["alert"], 2, "Nincs automatikus sync: riasztás az üzemeltetőnek, a rendszer jóváhagyásra vár (a live 5 marad)."], ["5′) manuális sync", 3, 3, "Synced", ["sync"], 3, "Jóváhagyás után manuális sync: live 3, Synced. (Vagy a változást a Gitben rögzítik, és az lesz a kívánt állapot.)"]], "hpa": [["1) Synced", null, 3, "Synced", ["gitargo"], 0, "HPA-val: a replikaszám nincs a Git Deploymentjében (vagy ignoreDifferences); a HPA-konfiguráció a Gitben van."], ["2) HPA skáláz", null, 5, "Synced", ["hpa"], 1, "A HPA a terhelés miatt 3 → 5 replikára skáláz – tervezett viselkedés."], ["3) nincs drift", null, 5, "Synced", ["watch"], 2, "Az összevetés nem talál eltérést (a replicas mezőt nem az Argo CD kezeli): Synced marad, nincs visszaállítás."]]}, "code": ["figyeld a kívánt állapotot (desired state)", "olvasd a tényleges állapotot (current state)", "ha eltérnek:", "    hajt végre korrekciót (reconcile)", "ismételd"]};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let sc = "staging", k = 0;
const g = id => document.getElementById(id);
const codeEl = g("code"); codeEl.innerHTML = DATA.code.map((l, i) => `<span id="L${i}">${l}</span>`).join("");
function box(x, y, w, h, opts){ return mk(svg, "rect", Object.assign({x, y, width: w, height: h, fill: css("--bg"), stroke: css("--fg"), "stroke-width": 1.4}, opts || {})); }
function arrow(x1, y1, x2, y2, dash, on, label, lx, ly){
  mk(svg, "line", {x1, y1, x2, y2, stroke: on ? css("--hl2") : css("--fg"), "stroke-width": on ? 4 : 1.5, "stroke-dasharray": dash, "marker-end": on ? "url(#arh)" : "url(#ar)"});
  if (label) wrapText(svg, lx, ly, label, {"font-size": 12, "font-style": "italic", fill: on ? css("--hl2") : css("--fg")}, 13);
}
function actor(cx, y, label){ const fg = css("--fg");
  mk(svg, "circle", {cx, cy: y, r: 8, fill: css("--bg"), stroke: fg, "stroke-width": 1.5});
  mk(svg, "path", {d: `M${cx},${y+8} L${cx},${y+26} M${cx-12},${y+14} L${cx+12},${y+14} M${cx-10},${y+40} L${cx},${y+26} L${cx+10},${y+40}`, fill: "none", stroke: fg, "stroke-width": 1.5});
  mk(svg, "text", {x: cx, y: y + 56, "text-anchor": "middle", "font-size": 12}, label); }
function draw(){
  const S = DATA.scen[sc], s = S[k], [lab, des, live, stat, act, line, msg] = s, on = x => act.includes(x);
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg"), hl = css("--hl2");
  actor(50, 30, "Fejlesztő");
  box(130, 20, 220, 70);
  wrapText(svg, 240, 42, `Git repó: config/overlays/${sc === "prod" ? "prod" : "staging"}\n${des === null ? "replicas: – (a HPA kezeli)" : "replicas: " + des}`, {"text-anchor": "middle", "font-size": 12}, 15);
  arrow(68, 55, 128, 55, "", false, "merge", 75, 48);
  const oos = stat !== "Synced";
  box(460, 120, 230, 100, {rx: 12, fill: oos ? "url(#ph)" : css("--fill3"), "stroke-width": oos ? 3 : 1.4});
  box(475, 132, 200, 76, {fill: css("--bg"), stroke: "none"});
  wrapText(svg, 575, 150, `Argo CD: ${stat}\ndesired: ${des === null ? "–" : des}   live: ${live}` + (stat === "OutOfSync" ? "\ndiff: /spec/replicas 3 ≠ 5" : ""), {"text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, 18);
  box(130, 260, 220, 90);
  mk(svg, "text", {x: 140, y: 278, "font-size": 12}, "Kubernetes klaszter" + (sc === "hpa" ? " + HPA" : ""));
  for (let i = 0; i < live; i++) mk(svg, "rect", {x: 145 + i * 40, y: 292, width: 30, height: 40, fill: i >= 3 ? css("--fill2") : css("--bg"), stroke: fg});
  arrow(350, 55, 470, 118, "7 4", on("gitargo"), "webhook / 3 perces\nlekérdezés (olvas)", 400, 70);
  arrow(352, 295, 470, 222, "2 4", on("watch"), "élő állapot\n(watch)", 405, 290);
  arrow(470, 205, 354, 270, "", on("sync"), "sync", 400, 232);
  actor(740, 240, "üzemeltető");
  arrow(690, 150, 735, 230, "", on("alert"), "riasztás", 700, 175);
  if (sc !== "hpa") arrow(725, 285, 352, 320, "8 3 2 3", on("opk"), "kubectl scale --replicas=5", 470, 345);
  else if (on("hpa")) mk(svg, "text", {x: 150, y: 368, "font-size": 12, fill: hl}, "HPA: 3 → 5 replika (tervezett)");
  codeEl.querySelectorAll("span").forEach((x, i) => x.classList.toggle("on", i === line));
  status.textContent = `${lab}: ${msg}`;
  g("cnt").textContent = `${k + 1}/${S.length}`;
  document.querySelectorAll("button[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === sc)));
}
document.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => { sc = b.dataset.s; k = 0; draw(); });
g("first").onclick = () => { k = 0; draw(); };
g("prev").onclick = () => { k = Math.max(0, k - 1); draw(); };
g("next").onclick = () => { k = Math.min(DATA.scen[sc].length - 1, k + 1); draw(); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") g("next").click(); if (e.key === "ArrowLeft") g("prev").click(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
