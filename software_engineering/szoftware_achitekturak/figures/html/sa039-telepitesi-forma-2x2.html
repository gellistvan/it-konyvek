<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telepítési forma és belső szerkezet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal oldalt 2×2-es rács: moduláris monolit, mikroszolgáltatások, Big Ball of Mud, elosztott monolit. Jobb oldalt a négy modul (Rendelés, Készlet, Számlázás, Ügyfél) aktuális állapota a két út lépései szerint."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Két út: a moduláris monolitból modulonkénti, fájdalom-alapú kiválással mikroszolgáltatások (MonolithFirst); a Big Ball of Mudból korai felosztással elosztott monolit (csapda). A cellákra kattintva a fejezet rövid összefoglalója és a tipikus hiba jelenik meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Négy kombináció: a telepítési forma (1 ↔ sok egység) és a belső modularitás két független tengely. Kattints a bal oldali rács egy cellájára, vagy lépj tovább a két út lejátszásához.", "cell": "", "sep": [], "owndb": [], "edges": [["Rendelés", "Készlet", "if"], ["Rendelés", "Számlázás", "if"]], "bounded": true, "note": ""}, {"msg": "1. út, kiindulás – 1 telepítési egység, betartatott modulhatárok: a modulok csak explicit, szűk interfészen (pl. KészletSzolgáltatás) érik el egymást, ACID-tranzakció egy folyamaton belül.", "cell": "MM", "sep": [], "owndb": [], "edges": [["Rendelés", "Készlet", "if"], ["Rendelés", "Számlázás", "if"]], "bounded": true, "note": ""}, {"msg": "A Számlázás modul kiválik (valós fájdalom: önálló telepítési ciklus kell): saját egység, saját adatbázis, a Rendelés aszinkron/szerződéses kapcsolattal éri el.", "cell": "MM", "sep": ["Számlázás"], "owndb": ["Számlázás"], "edges": [["Rendelés", "Készlet", "if"], ["Rendelés", "Számlázás", "async"]], "bounded": true, "note": ""}, {"msg": "A Készlet modul kiválik (önálló skálázás): a Rendelés → Készlet hívás hálózati szerződéssé válik.", "cell": "MM", "sep": ["Számlázás", "Készlet"], "owndb": ["Számlázás", "Készlet"], "edges": [["Rendelés", "Készlet", "async"], ["Rendelés", "Számlázás", "async"]], "bounded": true, "note": ""}, {"msg": "Az Ügyfél modul kiválik; a monolitban már csak a Rendelés maradt.", "cell": "MM", "sep": ["Számlázás", "Készlet", "Ügyfél"], "owndb": ["Számlázás", "Készlet", "Ügyfél"], "edges": [["Rendelés", "Készlet", "async"], ["Rendelés", "Számlázás", "async"]], "bounded": true, "note": ""}, {"msg": "Cél: Sok telepítési egység, mindegyik saját adatbázissal; aszinkron, szerződéses kapcsolatok, önálló skálázás és telepítési ciklus. A modulhatárok már a monolitban készen álltak, ezért a felosztás kis kockázatú.", "cell": "MS", "sep": ["Rendelés", "Készlet", "Számlázás", "Ügyfél"], "owndb": ["Rendelés", "Készlet", "Számlázás", "Ügyfél"], "edges": [["Rendelés", "Készlet", "async"], ["Rendelés", "Számlázás", "async"]], "bounded": true, "note": ""}, {"msg": "2. út, kiindulás – 1 telepítési egység, rendezetlen belső szerkezet: bármely komponens bármelyikre hivatkozhat, nincsenek betartatott határok.", "cell": "BB", "sep": [], "owndb": [], "edges": [["Rendelés", "Készlet", "tangle"], ["Rendelés", "Számlázás", "tangle"], ["Rendelés", "Ügyfél", "tangle"], ["Készlet", "Számlázás", "tangle"], ["Készlet", "Ügyfél", "tangle"], ["Számlázás", "Ügyfél", "tangle"]], "bounded": false, "note": ""}, {"msg": "Korai felosztás: a kódot négy szolgáltatásba szedjük, de az összefonódó hívások hálózati szinkron hívásokká válnak (hívásláncok), az adatbázis közös marad.", "cell": "DM", "sep": ["Rendelés", "Készlet", "Számlázás", "Ügyfél"], "owndb": [], "edges": [["Rendelés", "Készlet", "sync"], ["Rendelés", "Számlázás", "sync"], ["Készlet", "Ügyfél", "sync"], ["Számlázás", "Ügyfél", "sync"]], "bounded": false, "note": ""}, {"msg": "Eredmény – Sok telepítési egység, de szoros csatolás: szinkron hívásláncok és közös adatbázis; egy üzleti funkcióhoz több szolgáltatást kell együtt, sorrendben telepíteni.", "cell": "DM", "sep": ["Rendelés", "Készlet", "Számlázás", "Ügyfél"], "owndb": [], "edges": [["Rendelés", "Készlet", "sync"], ["Rendelés", "Számlázás", "sync"], ["Készlet", "Ügyfél", "sync"], ["Számlázás", "Ügyfél", "sync"]], "bounded": false, "note": "együtt kell telepíteni"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const CELLS={"MM": {"name": "Moduláris monolit", "sum": "1 telepítési egység, betartatott modulhatárok: a modulok csak explicit, szűk interfészen (pl. KészletSzolgáltatás) érik el egymást, ACID-tranzakció egy folyamaton belül.", "err": "Tipikus hiba: a határokat nem tartatja be semmi (nincs build-/architektúrateszt), így lassan Big Ball of Mud lesz."}, "MS": {"name": "Mikroszolgáltatások", "sum": "Sok telepítési egység, mindegyik saját adatbázissal; aszinkron, szerződéses kapcsolatok, önálló skálázás és telepítési ciklus.", "err": "Tipikus hiba: a szétválasztás nem valós fájdalmat enyhít, csak üzemeltetési költséget hoz."}, "BB": {"name": "Big Ball of Mud", "sum": "1 telepítési egység, rendezetlen belső szerkezet: bármely komponens bármelyikre hivatkozhat, nincsenek betartatott határok.", "err": "Tipikus hiba: a változtatások előrejelezhetetlen mellékhatásokkal járnak; a „monolit” rossz híre valójában ezt az állapotot jelenti."}, "DM": {"name": "Elosztott monolit / mikrolit", "sum": "Sok telepítési egység, de szoros csatolás: szinkron hívásláncok és közös adatbázis; egy üzleti funkcióhoz több szolgáltatást kell együtt, sorrendben telepíteni.", "err": "Tipikus hiba: a korai felosztás a tranzakciós határt hálózaton át vágja ketté (elosztott tranzakció / saga kell), előnyök nélkül."}};
const POS={"Rendelés":[440,70],"Készlet":[620,70],"Számlázás":[440,200],"Ügyfél":[620,200]};
const MW=110,MH=40;
function cyl(x,y,w,h){const L=css("--line"),B=css("--cell");
 el("rect",{x:x,y:y,width:w,height:h,fill:B,stroke:"none"});
 el("ellipse",{cx:x+w/2,cy:y+h,rx:w/2,ry:5,fill:B,stroke:L});el("rect",{x:x,y:y,width:w,height:h,fill:B,stroke:"none"});
 el("line",{x1:x,y1:y,x2:x,y2:y+h,stroke:L});el("line",{x1:x+w,y1:y,x2:x+w,y2:y+h,stroke:L});
 el("ellipse",{cx:x+w/2,cy:y,rx:w/2,ry:5,fill:B,stroke:L});}
function arrow(x0,y0,x1,y1,dash,head,curv){const L=css("--line");
 const mx=(x0+x1)/2-(y1-y0)*(curv||0),my=(y0+y1)/2+(x1-x0)*(curv||0);
 el("path",{d:`M${x0},${y0} Q${mx},${my} ${x1},${y1}`,fill:"none",stroke:L,"stroke-width":1.5,"stroke-dasharray":dash||"","marker-end":head?"url(#ah)":""});}
function mini(){const L=css("--line");const cells=[["MM",20,40],["MS",190,40],["BB",20,170],["DM",190,170]];
 el("text",{x:20,y:24,"font-size":12,fill:css("--muted")},"belső modularitás ↑ · telepítési egységek →");
 cells.forEach(c=>{const on=c[0]===cur.cell;const r=el("rect",{x:c[1],y:c[2],width:160,height:115,fill:on?css("--cellhl"):css("--cell"),stroke:L,"stroke-width":on?3:1,rx:6,tabindex:0,role:"button","aria-label":CELLS[c[0]].name,style:"cursor:pointer"});
  const t=el("text",{x:c[1]+80,y:c[2]+62,"text-anchor":"middle","font-size":13,"font-weight":"bold",style:"cursor:pointer"},CELLS[c[0]].name.replace(" / mikrolit",""));
  if(c[0]==="DM") el("text",{x:c[1]+80,y:c[2]+80,"text-anchor":"middle","font-size":12},"(mikrolit)");
  const go=()=>{document.getElementById("status").textContent=CELLS[c[0]].name+": "+CELLS[c[0]].sum+" "+CELLS[c[0]].err;};
  r.addEventListener("click",go);t.addEventListener("click",go);r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});
 el("text",{x:20,y:310,"font-size":11,fill:css("--muted")},"Felül: betartatott határok; alul: rendezetlen.");
 el("text",{x:20,y:326,"font-size":11,fill:css("--muted")},"Bal: 1 telepítési egység; jobb: sok.");}
let cur={};
function render(s){cur=s;svg.setAttribute("viewBox","0 0 780 340");svg.innerHTML="";
 const d=el("defs",{});const m=document.createElementNS(NS,"marker");[["id","ah"],["markerWidth","9"],["markerHeight","9"],["refX","8"],["refY","4.5"],["orient","auto"]].forEach(a=>m.setAttribute(a[0],a[1]));
 const p=document.createElementNS(NS,"path");p.setAttribute("d","M0,0 L9,4.5 L0,9 z");p.setAttribute("fill",css("--line"));m.appendChild(p);d.appendChild(m);
 mini();const L=css("--line");
 el("line",{x1:380,y1:10,x2:380,y2:330,stroke:css("--muted"),"stroke-dasharray":"2 4"});
 const mono=Object.keys(POS).filter(k=>!s.sep.includes(k));
 if(mono.length){const xs=mono.map(k=>POS[k][0]),ys=mono.map(k=>POS[k][1]);
  el("rect",{x:Math.min(...xs)-18,y:Math.min(...ys)-18,width:Math.max(...xs)-Math.min(...xs)+MW+36,height:Math.max(...ys)-Math.min(...ys)+MH+36,fill:"none",stroke:L,"stroke-width":4,rx:6});}
 // közös DB, ha van modul saját DB nélkül
 const shared=Object.keys(POS).filter(k=>!s.owndb.includes(k));
 if(shared.length){cyl(578,135,44,30);el("text",{x:600,y:182,"text-anchor":"middle","font-size":11},s.sep.length===4?"közös DB":"monolit DB");
  shared.forEach(k=>{const q=POS[k];el("line",{x1:q[0]+MW/2,y1:q[1]+MH/2,x2:600,y2:150,stroke:css("--muted"),"stroke-width":1});});}
 s.edges.forEach((e,i)=>{const a=POS[e[0]],b=POS[e[1]];const ax=a[0]+MW/2,ay=a[1]+MH/2,bx=b[0]+MW/2,by=b[1]+MH/2;
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;const sh=e[2]==="tangle"?0:62;
  const x0=ax+ux*sh,y0=ay+uy*Math.min(sh,30),x1=bx-ux*sh,y1=by-uy*Math.min(sh,30);
  if(e[2]==="tangle"){arrow(ax,ay,bx,by,"4 3",false,0.35);arrow(ax,ay,bx,by,"4 3",false,-0.3);}
  else if(e[2]==="if") arrow(x0,y0,x1,y1,"",true,0);
  else if(e[2]==="async") arrow(x0,y0,x1,y1,"7 4",true,0);
  else {arrow(x0,y0,x1,y1,"",true,0.12);arrow(x1,y1,x0,y0,"",true,0.12);} });
 Object.keys(POS).forEach(k=>{const q=POS[k];const unit=s.sep.includes(k);
  if(s.bounded||unit) el("rect",{x:q[0],y:q[1],width:MW,height:MH,rx:5,fill:css("--cell"),stroke:L,"stroke-width":unit?4:1.2});
  else el("rect",{x:q[0]+10,y:q[1]+8,width:MW-20,height:MH-16,fill:css("--cell"),stroke:"none"});
  el("text",{x:q[0]+MW/2,y:q[1]+MH/2+5,"text-anchor":"middle","font-size":14},k);
  if(s.owndb.includes(k)) cyl(q[0]+MW+4,q[1]+8,20,22);});
 const leg={"if":"→ interfészhívás (folyamaton belül)","async":"⇢ aszinkron / szerződéses","sync":"⇄ szinkron hálózati hívás","tangle":"szaggatott: összefonódás"};
 const used=[...new Set(s.edges.map(e=>e[2]))];
 el("text",{x:400,y:290,"font-size":12},"vastag keret: telepítési egység; "+used.map(u=>leg[u]).join("; "));
 if(s.note) el("text",{x:575,y:320,"text-anchor":"middle","font-size":14,"font-weight":"bold",fill:css("--hl2")},"„"+s.note+"”");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
