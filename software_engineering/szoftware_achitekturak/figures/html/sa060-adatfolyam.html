<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analitikai adatfolyam rétegenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button data-m="all">Teljes</button><button data-m="batch">Batch-ág</button><button data-m="stream">Streaming-ág</button><span class="small">Egy rendelési esemény útja:</span><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 810 480" role="img" aria-label="Források, betöltő, bronz, ezüst és arany réteg, három feldolgozó, fogyasztók; batch- és streaming-ág"></svg>

<p class="small">Logikai adatáramlás; a technológia és az ütemezés az ADR-ben rögzítendő. Henger = tartós tároló, lekerekített téglalap = feldolgozó, sima téglalap = külső szereplő.</p>
<script>
const DATA = {"H": 9.6, "nodes": {"src1": ["ext", 1.03, 7.4, 2.0, 1.25, "Rendelési\nesemények\n(JSON)"], "src2": ["ext", 1.03, 5.6, 2.0, 1.25, "Kattintási\nstream\n(Avro)"], "src3": ["ext", 1.03, 3.8, 2.0, 1.25, "Terméktörzs\n(CSV)"], "ing": ["proc", 3.45, 5.6, 1.6, 0.8, "Betöltő"], "bronze": ["store", 5.75, 4.85, 2.15, 2.45, "Nyers\nobjektumtár\nappend-only,\nbeérkezési\nidő szerint\nparticionálva"], "silver": ["store", 8.4, 5.55, 2.0, 1.3, "Tisztított,\nvalidált\nadathalmaz"], "quar": ["store", 8.75, 3.15, 1.5, 0.75, "Karantén"], "stream": ["proc", 9.4, 8.5, 6.8, 0.6, "Csúszóablakos stream-aggregáció"], "hot": ["store", 11.75, 5.85, 2.0, 1.2, "Jelenleg\nnépszerű\ntermékek"], "agg": ["store", 10.98, 3.55, 1.8, 1.2, "Napi aggr.\n/ data mart"], "feat": ["store", 12.8, 3.55, 1.8, 1.2, "ML feature\ntábla"], "batch": ["proc", 9.1, 1.0, 8.8, 0.7, "Napi batch SQL (ELT)"], "rec": ["ext", 15.1, 6.6, 1.9, 0.95, "Online\najánló"], "bi": ["ext", 15.1, 4.8, 1.9, 0.95, "BI\ndashboard"], "ml": ["ext", 15.1, 2.8, 1.9, 0.95, "Modell\ntréning"]}, "edges": [["e1", [[2.03, 7.2], [2.65, 5.95]], "stream", "", null, "stream"], ["e2", [[2.03, 5.6], [2.65, 5.6]], "stream", "", null, "stream"], ["e3", [[2.03, 4.0], [2.65, 5.25]], "stream", "folyamatos", [3.45, 4.75], "stream"], ["e4", [[4.25, 5.6], [4.68, 5.6]], "stream", "", null, "stream"], ["b1", [[5.75, 3.5], [5.75, 1.35]], "batch", "naponta 1×", [5.75, 2.45], "batch"], ["b2", [[7.85, 1.35], [7.85, 4.82]], "batch", "tisztít,\nvalidál", [7.85, 2.35], "batch"], ["b3", [[8.95, 1.35], [8.95, 2.7]], "batch", "", null, "batch"], ["b4", [[9.1, 4.85], [9.1, 4.3], [9.8, 4.3], [9.8, 1.35]], "batch", "olvas", [9.8, 2.35], "batch"], ["b5", [[10.98, 1.35], [10.98, 2.88]], "batch", "", null, "batch"], ["b6", [[12.8, 1.35], [12.8, 2.88]], "batch", "aggregál", [11.89, 2.1], "batch"], ["s1", [[6.5, 6.2], [6.5, 8.2]], "stream", "", null, "stream"], ["s2", [[12.4, 8.2], [12.4, 6.57]], "stream", "~percenként", [12.4, 6.93], "stream"], ["r1", [[12.75, 5.85], [14.15, 6.5]], "read", "", null, "stream"], ["r2", [[10.98, 4.35], [14.15, 4.8]], "read", "", null, "batch"], ["r3", [[13.7, 3.3], [14.15, 2.95]], "read", "", null, "batch"]], "lanes": [["Bronz\n(nyers)", 4.6, 6.9], ["Ezüst\n(finomított)", 7.1, 9.95], ["Arany\n(kiszolgáló)", 10.05, 13.75]], "lane_y": [1.6, 8.0], "bound": [2.4, 0.4, 11.45, 8.65], "path": [[["src1"], [], "Forrás: a rendelési esemény JSON-ként keletkezik a rendelési rendszerben."], [["ing"], ["e1"], "Betöltő: folyamatosan, transzformáció nélkül hozza át az eseményt (streaming él)."], [["bronze"], ["e4"], "Bronz: az első tartós, immutábilis, append-only másolat a beérkezési idő szerinti partícióban; minden későbbi lépés visszavezethető rá (16.3.2)."], [["batch"], ["b1"], "Napi batch SQL (ELT): naponta egyszer a bronzból olvas, és a tárolóban transzformál."], [["silver", "quar"], ["b2", "b3"], "Ezüst: tisztítás, normalizálás, validálás, deduplikáció; a hibás rekord a karanténba kerül (16.3.3)."], [["agg"], ["b4", "b5"], "Arany: denormalizált, aggregált napi data mart; származtatott adat, az ezüstből bármikor újraépíthető (16.3.4)."], [["bi"], ["r2"], "Fogyasztó: a BI dashboard az arany réteg aggregátumát olvassa."]]};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let mode = "all", step = -1;
const S = 50, HH = DATA.H;
const X = x => x * S, Y = y => (HH - y) * S;
function draw(){
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg"), hl = css("--hl2"), muted = css("--muted");
  const P = step >= 0 ? DATA.path[step] : null;
  const onN = id => P ? P[0].includes(id) : false;
  const onE = e => P ? P[1].includes(e[0]) : (mode !== "all" && e[5] === mode);
  const dimE = e => !P && mode !== "all" && e[5] !== mode;
  const ly = DATA.lane_y;
  DATA.lanes.forEach(l => {
    mk(svg, "rect", {x: X(l[1]), y: Y(ly[1]), width: X(l[2]-l[1]), height: X(ly[1]-ly[0]), fill: css("--fill3"), stroke: muted, "stroke-width": .7});
    wrapText(svg, X(l[1]) + 5, Y(ly[1]) + 16, l[0], {"font-size": 13, "font-weight": "bold"}, 15);
  });
  const b = DATA.bound;
  mk(svg, "rect", {x: X(b[0]), y: Y(b[1]+b[3]), width: X(b[2]), height: X(b[3]), fill: "none", stroke: fg, "stroke-dasharray": "7 5", "stroke-width": 1.5});
  mk(svg, "text", {x: X(b[0]) + 4, y: Y(b[1]+b[3]) - 6, "font-size": 13, "font-style": "italic"}, "Rendszerhatár: E-kereskedelmi analitikai platform");
  DATA.edges.forEach(e => {
    const pts = e[1].map(p => X(p[0]) + "," + Y(p[1])).join(" ");
    const on = onE(e);
    const dash = e[2] === "stream" ? "2 4" : (e[2] === "read" ? "8 3 2 3" : "");
    mk(svg, "polyline", {points: pts, fill: "none", stroke: on ? hl : fg, "stroke-width": on ? 4 : (e[2]==="read"?1.2:1.8),
      "stroke-dasharray": dash, "marker-end": on ? "url(#arh)" : "url(#ar)", opacity: dimE(e) ? .25 : 1});
    if (e[3]) {
      const ls = e[3].split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.6 + 6, hl2 = ls.length * 13 + 4;
      mk(svg, "rect", {x: X(e[4][0]) - wl/2, y: Y(e[4][1]) - hl2/2, width: wl, height: hl2, fill: css("--bg"), opacity: .9});
      wrapText(svg, X(e[4][0]), Y(e[4][1]) - (ls.length - 1) * 6.5 + 4, e[3], {"text-anchor": "middle", "font-size": 12, "font-style": "italic"}, 13);
    }
  });
  for (const id in DATA.nodes) {
    const [shape, cx, cy, w, h, text] = DATA.nodes[id];
    const on = onN(id);
    const sw = on ? 4 : 1.4, st = on ? hl : fg;
    const x0 = X(cx - w/2), y0 = Y(cy + h/2), ww = X(w), hh = X(h);
    if (shape === "store") {
      const ry = 7;
      mk(svg, "path", {d: `M${x0},${y0} L${x0},${y0+hh} A${ww/2},${ry} 0 0 0 ${x0+ww},${y0+hh} L${x0+ww},${y0}`, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(svg, "ellipse", {cx: x0+ww/2, cy: y0, rx: ww/2, ry: ry, fill: css("--fill3"), stroke: st, "stroke-width": sw});
    } else if (shape === "proc") {
      mk(svg, "rect", {x: x0, y: y0, width: ww, height: hh, rx: 12, fill: css("--fill2"), stroke: st, "stroke-width": sw});
    } else {
      mk(svg, "rect", {x: x0, y: y0, width: ww, height: hh, fill: css("--bg"), stroke: st, "stroke-width": sw});
    }
    const lines = text.split("\n");
    wrapText(svg, X(cx), Y(cy) - (lines.length - 1) * 6.5 + 5, text, {"text-anchor": "middle", "font-size": 12}, 13);
  }
  if (P) status.textContent = `${step + 1}/${DATA.path.length}. lépés – ${P[2]}`;
  else status.textContent = mode === "all" ? "Teljes adatfolyam: folytonos él = batch, pontozott = streaming, pont-vonal = fogyasztói olvasás."
    : (mode === "batch" ? "Batch-ág: bronz → napi batch SQL (ELT) → ezüst (+ karantén) → arany (data mart, feature tábla) → BI, modell tréning."
                        : "Streaming-ág: források → betöltő → bronz → csúszóablakos stream-aggregáció (~percenként) → „Jelenleg népszerű termékek” → online ajánló.");
  document.querySelectorAll("button[data-m]").forEach(bt => bt.setAttribute("aria-pressed", String(!P && bt.dataset.m === mode)));
}
document.querySelectorAll("button[data-m]").forEach(bt => bt.onclick = () => { mode = bt.dataset.m; step = -1; draw(); });
document.getElementById("prev").onclick = () => { step = Math.max(-1, step - 1); draw(); };
document.getElementById("next").onclick = () => { step = Math.min(DATA.path.length - 1, step + 1); draw(); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("prev").click(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
