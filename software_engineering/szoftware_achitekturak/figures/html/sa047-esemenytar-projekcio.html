<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eseménytár és projekció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Mód: <select id="mode" onchange="rebuild()" aria-label="betöltési mód"><option value="full">teljes visszajátszás + projekció</option><option value="snap">snapshotból (v2)</option></select></label> <label><input type="checkbox" id="dup" onchange="rebuild()"> duplikált v2-kézbesítés</label> <label><input type="checkbox" id="grd" checked onchange="rebuild()"> verzióőr</label> <button onclick="query()">Lekérdezés (GET /orders)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy esemény után a rendelés Paid, a lista összege 2000, a pillanatképből indított betöltés csak v3 és v4 eseményt alkalmaz."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A fejezet apply() és project() pszeudokódjának átirata; a nézetsor version mezője és a verzióőr az idempotens projekciót szemlélteti. Teljes módban minden esemény két lépés: hozzáfűzés (a parancsoldal már látja) és projekció (a nézet frissül); a köztes állapot a frissességi rés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Üres stream: a rendelés még nem létezik.", "cur": 0, "kind": "init", "st": {}, "view": {}, "app": 0, "proj": 0, "mode": "full", "line": -1}, {"msg": "v1 OrderCreated hozzáfűzve; a parancsoldali állapot (visszajátszás) status = Draft. A projekció még nem dolgozta fel (frissességi rés).", "cur": 1, "kind": "append", "st": {"id": "order-123", "customerId": "c1", "status": "Draft", "items": []}, "view": {}, "app": 1, "proj": 0, "mode": "full", "line": 2}, {"msg": "Projekció: v1 feldolgozva → lista total = 0, status = Draft, version = 1.", "cur": 1, "kind": "project", "st": {"id": "order-123", "customerId": "c1", "status": "Draft", "items": []}, "view": {"order-123": {"customerId": "c1", "total": 0, "status": "Draft", "version": 1}}, "app": 1, "proj": 1, "mode": "full", "line": 2}, {"msg": "v2 OrderItemAdded hozzáfűzve; a parancsoldali állapot (visszajátszás) status = Draft. A projekció még nem dolgozta fel (frissességi rés).", "cur": 2, "kind": "append", "st": {"id": "order-123", "customerId": "c1", "status": "Draft", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 0, "status": "Draft", "version": 1}}, "app": 2, "proj": 1, "mode": "full", "line": 4}, {"msg": "Projekció: v2 feldolgozva → lista total = 2000, status = Draft, version = 2.", "cur": 2, "kind": "project", "st": {"id": "order-123", "customerId": "c1", "status": "Draft", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Draft", "version": 2}}, "app": 2, "proj": 2, "mode": "full", "line": 4}, {"msg": "v3 OrderSubmitted hozzáfűzve; a parancsoldali állapot (visszajátszás) status = Submitted. A projekció még nem dolgozta fel (frissességi rés).", "cur": 3, "kind": "append", "st": {"id": "order-123", "customerId": "c1", "status": "Submitted", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Draft", "version": 2}}, "app": 3, "proj": 2, "mode": "full", "line": 6}, {"msg": "Projekció: v3 feldolgozva → lista total = 2000, status = Submitted, version = 3.", "cur": 3, "kind": "project", "st": {"id": "order-123", "customerId": "c1", "status": "Submitted", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Submitted", "version": 3}}, "app": 3, "proj": 3, "mode": "full", "line": 6}, {"msg": "v4 PaymentReceived hozzáfűzve; a parancsoldali állapot (visszajátszás) status = Paid. A projekció még nem dolgozta fel (frissességi rés).", "cur": 4, "kind": "append", "st": {"id": "order-123", "customerId": "c1", "status": "Paid", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Submitted", "version": 3}}, "app": 4, "proj": 3, "mode": "full", "line": 8}, {"msg": "Projekció: v4 feldolgozva → lista total = 2000, status = Paid, version = 4.", "cur": 4, "kind": "project", "st": {"id": "order-123", "customerId": "c1", "status": "Paid", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Paid", "version": 4}}, "app": 4, "proj": 4, "mode": "full", "line": 8}, {"msg": "Végállapot: aggregátum Paid; lista total = 2000, version = 4; PendingOrdersView üres.", "cur": 0, "kind": "done", "st": {"id": "order-123", "customerId": "c1", "status": "Paid", "items": [{"sku": "A", "price": 1000, "quantity": 2}]}, "view": {"order-123": {"customerId": "c1", "total": 2000, "status": "Paid", "version": 4}}, "app": 4, "proj": 4, "mode": "full", "line": -1}];
const CODE = ["function apply(state, event):", "    case event.type of", "        \"OrderCreated\":", "            state.status = \"Draft\"; state.items = []", "        \"OrderItemAdded\":", "            state.items.append(event.payload.item)", "        \"OrderSubmitted\":", "            state.status = \"Submitted\"", "        \"PaymentReceived\":", "            state.status = \"Paid\"", "// project(): view.total += price * quantity; view.status = ...; (verzióőr: ha event.version <= view.version, kihagyás)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EV = [{"v": 1, "type": "OrderCreated", "payload": {"customerId": "c1"}}, {"v": 2, "type": "OrderItemAdded", "payload": {"item": {"sku": "A", "price": 1000, "quantity": 2}}}, {"v": 3, "type": "OrderSubmitted", "payload": {}}, {"v": 4, "type": "PaymentReceived", "payload": {}}], AGG = "order-123", LINE = {"OrderCreated": 2, "OrderItemAdded": 4, "OrderSubmitted": 6, "PaymentReceived": 8};
function cp(x){ return JSON.parse(JSON.stringify(x)); }
function applyEv(st, ev){ const t = ev.type; if (t === "OrderCreated") Object.assign(st, {id: AGG, customerId: ev.payload.customerId, status: "Draft", items: []}); else if (t === "OrderItemAdded") st.items.push(ev.payload.item); else if (t === "OrderSubmitted") st.status = "Submitted"; else if (t === "PaymentReceived") st.status = "Paid"; return st; }
function projectEv(view, ev, guard){
  const row = view[AGG];
  if (guard && row && ev.v <= row.version) return false;
  if (ev.type === "OrderCreated") view[AGG] = {customerId: ev.payload.customerId, total: 0, status: "Draft", version: ev.v};
  else { if (ev.type === "OrderItemAdded") row.total += ev.payload.item.price * ev.payload.item.quantity; else if (ev.type === "OrderSubmitted") row.status = "Submitted"; else if (ev.type === "PaymentReceived") row.status = "Paid"; row.version = Math.max(row.version, ev.v); }
  return true;
}
function build(mode, dup, guard){
  const steps = []; let st = {}, view = {}, appended = 0, projected = 0;
  const snap = (msg, cur, kind, extra) => steps.push(Object.assign({msg: msg, cur: cur, kind: kind, st: cp(st), view: cp(view), app: appended, proj: projected, mode: mode, line: cur ? LINE[EV[cur - 1].type] : -1}, extra || {}));
  if (mode === "snap") {
    appended = 4; projected = 4; EV.forEach(e => projectEv(view, e, true));
    st = {id: AGG, customerId: "c1", status: "Draft", items: [cp(EV[1].payload.item)]};
    snap("loadWithSnapshot: a snapshot betöltve (version = 2, Draft, 1 tétel); readAfter(order-123, 2) = [v3, v4].", 0, "snap", {snapLoaded: true, applies: 0});
    let n = 0;
    EV.filter(e => e.v > 2).forEach(e => { applyEv(st, e); n++; snap(`apply(v${e.v} ${e.type}) – ${n}. apply lépés; status = ${st.status}.`, e.v, "apply", {snapLoaded: true, applies: n}); });
    snap(`Kész: csak ${n} apply lépés kellett (v3, v4); az állapot azonos a teljes visszajátszáséval (Paid).`, 0, "done", {snapLoaded: true, applies: n});
    return steps;
  }
  snap("Üres stream: a rendelés még nem létezik.", 0, "init");
  EV.forEach(e => {
    appended = e.v; applyEv(st, e);
    snap(`v${e.v} ${e.type} hozzáfűzve; a parancsoldali állapot (visszajátszás) status = ${st.status}. A projekció még nem dolgozta fel (frissességi rés).`, e.v, "append");
    projected = e.v; projectEv(view, e, guard);
    const r = view[AGG];
    snap(`Projekció: v${e.v} feldolgozva → lista total = ${r.total}, status = ${r.status}, version = ${r.version}.`, e.v, "project");
    if (dup && e.v === 2) {
      const ok = projectEv(view, e, guard);
      snap(ok ? `v2 ismét kézbesítve, verzióőr nélkül: a total ismét nő → ${view[AGG].total} (hibás).` : `v2 ismét kézbesítve: a verzióőr kihagyja (2 ≤ version ${view[AGG].version}), total = ${view[AGG].total}.`, 2, "dup");
    }
  });
  const r = view[AGG];
  snap(`Végállapot: aggregátum ${st.status}; lista total = ${r.total}, version = ${r.version}; PendingOrdersView ${["Draft", "Submitted"].includes(r.status) ? "tartalmazza a rendelést" : "üres"}.`, 0, "done");
  return steps;
}

function rebuild(){ setSteps(build(document.getElementById("mode").value, document.getElementById("dup").checked, document.getElementById("grd").checked)); }
function query(){
  const s = STEPS[k], r = s.view[AGG];
  status.textContent = !r ? "GET /orders: a nézetben még nincs sor (a projekció lemaradásban)." :
    `GET /orders → order-123: ${r.status}, total ${r.total}, version ${r.version}` + (s.app > s.proj ? ` – ELAVULT: a stream már v${s.app}, a nézet csak v${s.proj}.` : " – a nézet naprakész.");
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 880 340");
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hs" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1"/></pattern>`;
  svg.appendChild(defs);
  el("text", {x: 20, y: 22, "font-size": 13, "font-weight": "bold"}, "Eseménystream order-123");
  EV.forEach((e, i) => {
    const y = 34 + i * 50, on = e.v <= s.app, cur = s.cur === e.v, snapPart = s.mode === "snap" && e.v <= 2, notProj = s.mode !== "snap" && on && e.v > s.proj;
    el("rect", {x: 20, y: y, width: 250, height: 42, rx: 4, fill: snapPart ? "url(#hs)" : css("--cell"), stroke: cur ? hl : fg, "stroke-width": cur ? 3.2 : 1.1, "stroke-dasharray": notProj ? "6 3" : "none", opacity: on ? 1 : 0.35});
    el("text", {x: 30, y: y + 18, "font-size": 12.5, "font-weight": "bold"}, `v${e.v} ${e.type}`);
    el("text", {x: 30, y: y + 35, "font-size": 11, fill: mu}, e.v === 1 ? "customerId c1" : e.v === 2 ? "item: 2 × 1000" : "");
  });
  if (s.mode === "snap") el("text", {x: 20, y: 252, "font-size": 11.5}, "csíkozott: snapshotból (version = 2)");
  el("text", {x: 20, y: 270, "font-size": 11, fill: mu}, "szaggatott keret: még nem projektált esemény");
  // aggregátum
  const st = s.st;
  el("text", {x: 300, y: 22, "font-size": 13, "font-weight": "bold"}, "Aggregátum (parancsoldal)");
  el("rect", {x: 300, y: 34, width: 240, height: 110, rx: 6, fill: s.snapLoaded && s.applies === 0 ? "url(#hs)" : css("--cell"), stroke: fg});
  el("text", {x: 312, y: 62, "font-size": 13}, `status: ${st.status || "–"}`);
  el("text", {x: 312, y: 86, "font-size": 13}, `items: ${st.items ? st.items.length + " tétel" + (st.items.length ? " (2 × 1000)" : "") : "–"}`);
  el("text", {x: 312, y: 110, "font-size": 13}, `customerId: ${st.customerId || "–"}`);
  if (s.mode === "snap") el("text", {x: 312, y: 134, "font-size": 12, fill: hl}, `apply lépések: ${s.applies}`);
  // nézetek
  const r = s.view[AGG];
  el("text", {x: 570, y: 22, "font-size": 13, "font-weight": "bold"}, "„Rendelés lista” nézet");
  el("rect", {x: 570, y: 34, width: 290, height: 64, rx: 6, fill: css("--cell"), stroke: s.kind === "dup" ? hl : fg, "stroke-width": s.kind === "dup" ? 3 : 1.1});
  el("text", {x: 582, y: 60, "font-size": 13}, r ? `order-123 | total ${r.total} | ${r.status}` : "(üres)");
  el("text", {x: 582, y: 84, "font-size": 13}, r ? `version ${r.version}` : "");
  el("text", {x: 570, y: 128, "font-size": 13, "font-weight": "bold"}, "PendingOrdersView (Draft/Submitted)");
  el("rect", {x: 570, y: 138, width: 290, height: 40, rx: 6, fill: css("--cell"), stroke: fg});
  el("text", {x: 582, y: 163, "font-size": 13}, r && ["Draft", "Submitted"].includes(r.status) ? `order-123 (${r.status})` : "(üres)");
  // lemaradás
  if (s.mode !== "snap") {
    const lag = s.app - s.proj;
    el("text", {x: 300, y: 200, "font-size": 13, fill: lag > 0 ? hl : fg, "font-weight": lag > 0 ? "bold" : "normal"}, lag > 0 ? `projekció lemaradása: ${lag} esemény (frissességi rés)` : "a projekció naprakész");
    el("text", {x: 300, y: 222, "font-size": 11, fill: mu}, "aszinkron projekció, frissességi SLO: p95 < 2 s");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
