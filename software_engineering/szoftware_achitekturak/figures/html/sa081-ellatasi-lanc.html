<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az ellátási lánc támadási pontjai és ellenőrzései</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span class="small">Támadási pont:</span><button onclick="selT('T1')" title="1. pont: a forrásfüggőségben">T1</button><button onclick="selT('T2')" title="2. pont: a buildrendszerben">T2</button><button onclick="selT('T3')" title="3. pont: az artefaktum-tárolóban">T3</button><button onclick="selT('T4')" title="4. pont: a szállítási folyamatban">T4</button><button onclick="selT(null)">Kiemelés ki</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Forrás, Függőségek, Build, Registry, Fogyasztó; fölöttük a T1–T4 támadási pont, alattuk a védő ellenőrzések."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A T1–T4 gomb (vagy a támadási pontra kattintás) kiemeli a védő ellenőrzéseket; a lépések a 21.4.14 build.yml vázlatát követik (szemléltetés, a workflow nem futott).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Workflow 1/10: actions/checkout – forrás a taghez", "line": 0, "objs": [], "ctr": []}, {"msg": "Workflow 2/10: actions/setup-node 20.18.1", "line": 1, "objs": [], "ctr": []}, {"msg": "Workflow 3/10: npm ci – a lock fájl szerint, módosítás nélkül – ellenőrzés: lock fájl + npm ci", "line": 2, "objs": [], "ctr": ["lock"]}, {"msg": "Workflow 4/10: docker buildx build --push → digest – a registryben megjelenik: image @sha256:…", "line": 3, "objs": ["image @sha256:…"], "ctr": []}, {"msg": "Workflow 5/10: [scan – a vázlatból hiányzik; publikálás előtt kellene]", "line": 4, "objs": ["image @sha256:…"], "ctr": []}, {"msg": "Workflow 6/10: cosign sign $IMAGE@digest (keyless) – a registryben megjelenik: aláírás (.sig) – ellenőrzés: aláírás a digestre (cosign sign)", "line": 5, "objs": ["image @sha256:…", "aláírás (.sig)"], "ctr": ["sign"]}, {"msg": "Workflow 7/10: syft $IMAGE@digest → CycloneDX SBOM", "line": 6, "objs": ["image @sha256:…", "aláírás (.sig)"], "ctr": []}, {"msg": "Workflow 8/10: cosign attest --type cyclonedx – a registryben megjelenik: SBOM-attesztáció – ellenőrzés: SBOM-attesztáció a digesthez", "line": 7, "objs": ["image @sha256:…", "aláírás (.sig)", "SBOM-attesztáció"], "ctr": ["sbom"]}, {"msg": "Workflow 9/10: actions/attest-build-provenance – a registryben megjelenik: SLSA provenance – ellenőrzés: provenance (platform aláírja)", "line": 8, "objs": ["image @sha256:…", "aláírás (.sig)", "SBOM-attesztáció", "SLSA provenance"], "ctr": ["prov"]}, {"msg": "Workflow 10/10: fogyasztó: 3 ellenőrzés a digestre – ellenőrzés: fogyasztói ellenőr- zés @digest: aláírás, provenance, SBOM-attesztáció", "line": 9, "objs": ["image @sha256:…", "aláírás (.sig)", "SBOM-attesztáció", "SLSA provenance"], "ctr": ["verify"]}];
const CODE = [" 1. actions/checkout – forrás a taghez", " 2. actions/setup-node 20.18.1", " 3. npm ci – a lock fájl szerint, módosítás nélkül", " 4. docker buildx build --push → digest", " 5. [scan – a vázlatból hiányzik; publikálás előtt kellene]", " 6. cosign sign $IMAGE@digest (keyless)", " 7. syft $IMAGE@digest → CycloneDX SBOM", " 8. cosign attest --type cyclonedx", " 9. actions/attest-build-provenance", "10. fogyasztó: 3 ellenőrzés a digestre"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"stages": [["src", "Forrás", "GitHub\nmyorg/myapp"], ["dep", "Függőségek", "package-lock.json\nexpress 4.17.3"], ["bld", "Build", "GitHub Actions\nbuild.yml"], ["reg", "Registry", "registry.example.org\n/myorg/myapp\n@sha256:…"], ["con", "Fogyasztó", "cosign verify\ngh attestation\nverify"]], "sx": {"src": 2.2, "dep": 6.3, "bld": 10.399999999999999, "reg": 14.5, "con": 18.599999999999998}, "attacks": {"T1": ["kártékony\nfüggőségverzió", 6.3, "1. pont: a forrásfüggőségben"], "T2": ["fordító / build-\ndefiníció csere", 10.399999999999999, "2. pont: a buildrendszerben"], "T3": ["artefaktum\nfelülírása", 13.9, "3. pont: az artefaktum-tárolóban"], "T4": ["csere letöltés\nközben (MITM)", 17.7, "4. pont: a szállítási folyamatban"]}, "controls": {"lock": ["lock fájl + npm ci", 6.3, ["T1"], 2], "scan": ["scan (Trivy)\npublikálás előtt", 10.399999999999999, ["T1"], null], "prov": ["provenance\n(platform aláírja)", 10.399999999999999, ["T2"], 8], "sign": ["aláírás a digestre\n(cosign sign)", 14.5, ["T3", "T4"], 5], "sbom": ["SBOM-attesztáció\na digesthez", 14.5, ["T1"], 7], "verify": ["fogyasztói ellenőr-\nzés @digest:\naláírás, provenance,\nSBOM-attesztáció", 18.599999999999998, ["T2", "T3", "T4"], 9]}, "nc": ["kompromittált saját forrás vagy maintainer-fiók: az aláírás és a provenance a rosszindulatú kódot is hitelesíti", "közös, kompromittált toolchain vagy forrástarball: a reprodukálható build sem szűri ki (T-S9-020)", "a scan csak az ismert sebezhetőséget találja meg; az SBOM leltár, nem védelem"], "checks": ["cosign verify --certificate-identity=… \"$IMAGE@$DIGEST\"", "gh attestation verify \"oci://$IMAGE@$DIGEST\" --owner myorg", "cosign verify-attestation --type cyclonedx … \"$IMAGE@$DIGEST\""], "row": {"lock": 0, "prov": 0, "sign": 0, "verify": 0, "scan": 1, "sbom": 1}};
let SELT = null;
function selT(t){
  SELT = t;
  if (t) {
    const cs = Object.keys(D.controls).filter(c => D.controls[c][2].includes(t));
    const ws = cs.map(c => D.controls[c][3]).filter(w => w !== null);
    if (ws.length) show(ws[0]); else show(k);
    status.textContent = t + " (" + D.attacks[t][2] + ") – védő ellenőrzés: " + cs.map(c => D.controls[c][0].replace(/\n/g, " ")).join("; ") + (ws.length ? " (a workflow kiemelt lépése)" : "");
  } else show(k);
}
function txt(x, y, s, a){ const lines = s.split("\n"); lines.forEach((l, i) => el("text", Object.assign({x: x, y: y + i * 14, "text-anchor": "middle", "font-size": 12}, a || {}), l)); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 780 420");
  const X = v => v * 37.5, hl = css("--hl2");
  el("defs", {}).innerHTML = '<pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--muted") + '" stroke-width="1.5"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--fg") + '"/></marker>';
  D.stages.forEach((st, i) => {
    const x = X(D.sx[st[0]]);
    el("rect", {x: x - 68, y: 130, width: 136, height: 72, rx: 7, fill: css("--cellhl"), stroke: css("--line")});
    txt(x, 150, st[1], {"font-weight": "bold", "font-size": 13});
    txt(x, 168, st[2], {"font-size": 10.5});
    if (i < D.stages.length - 1) el("line", {x1: x + 70, y1: 166, x2: X(D.sx[D.stages[i + 1][0]]) - 72, y2: 166, stroke: css("--fg"), "marker-end": "url(#ah)"});
  });
  for (const t in D.attacks) {
    const a = D.attacks[t], x = X(a[1]), on = SELT === t;
    el("rect", {x: x - 62, y: 30, width: 124, height: 58, rx: 6, fill: css("--bg"), stroke: on ? hl : css("--fg"), "stroke-width": on ? 3 : 1.3, "stroke-dasharray": "6 4", style: "cursor:pointer"}).addEventListener("click", () => selT(t));
    el("path", {d: `M ${x - 48} ${36} l -7 13 h 7 l -4 13 l 12 -17 h -7 l 5 -9 z`, fill: on ? hl : css("--fg")});
    el("text", {x: x - 34, y: 50, "font-size": 13, "font-weight": "bold", fill: on ? hl : css("--fg")}, t);
    txt(x + 8, 66, a[0], {"font-size": 11});
    el("line", {x1: x, y1: 88, x2: x, y2: t === "T4" ? 160 : 128, stroke: on ? hl : css("--fg"), "stroke-dasharray": "4 3", "marker-end": "url(#ah)"});
  }
  for (const c in D.controls) {
    const r = D.controls[c], x = X(r[1]);
    const on = (SELT && r[2].includes(SELT)) || s.ctr.includes(c);
    const yy = 232 + D.row[c] * 62, hh = c === "verify" ? 86 : 56;
    if (!D.row[c]) el("line", {x1: x, y1: 202, x2: x, y2: yy, stroke: on ? hl : css("--fg"), "stroke-width": on ? 2.5 : 1});
    el("rect", {x: x - 68, y: yy, width: 136, height: hh, rx: 5, fill: css("--cell"), stroke: on ? hl : css("--fg"), "stroke-width": on ? 3 : 1.4});
    txt(x, yy + 16, r[0], {"font-size": 11});
    el("text", {x: x, y: yy + hh - 8, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, "véd: " + r[2].join(", "));
  }
  // registry objektumok
  const rx = X(D.sx.reg);
    el("text", {x: 6, y: 246, "font-size": 11.5, "font-weight": "bold"}, "Registry tartalma:");
  if (!s.objs.length) el("text", {x: 6, y: 262, "font-size": 11, fill: css("--muted")}, "(üres)");
  s.objs.forEach((o, i) => el("text", {x: 6, y: 262 + i * 15, "font-size": 11}, "← " + o));
  el("rect", {x: 0, y: 360, width: 780, height: 58, fill: "url(#hz)", stroke: css("--fg")});
  el("rect", {x: 5, y: 364, width: 770, height: 50, fill: css("--bg"), stroke: "none", opacity: 0.9});
  el("text", {x: 10, y: 378, "font-size": 11, "font-weight": "bold"}, "Nem fedi le:");
  D.nc.forEach((n, i) => el("text", {x: 90, y: 378 + i * 14, "font-size": 10.5}, "– " + n));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
