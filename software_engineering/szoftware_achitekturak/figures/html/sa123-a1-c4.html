<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 C4-nézetei</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sys:#e6e6e6;--ext:#cfcfcf;--comp:#f3f3f3;--wait:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sys:#3a3a3a;--ext:#4a4a4a;--comp:#303030;--wait:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
input[type=range]{min-width:90px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg);}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.on{outline:2px solid var(--hl);font-weight:bold}
svg{max-width:640px}
</style>
</head>
<body>

<div class="ctl" role="group" aria-label="C4-szint">
 <button id="v0" aria-pressed="true">Context</button>
 <button id="v1" aria-pressed="false">Container</button>
 <button id="v2" aria-pressed="false">Component (a monolit belseje)</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 370 410" role="img" aria-label="Az A1 alternatíva C4-nézete"></svg>

<p class="small">Folytonos nyíl: szinkron, szaggatott: aszinkron; vastag keret: rendszerhatár; szaggatott szürke doboz: külső rendszer. A1 alternatíva (ADR-REND-014), fiktív rendszer.</p>
<script>

const NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(parent, tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
const FILLV = {person:"--cell", system:"--sys", container:"--cell", db:"--cell", queue:"--cell", external:"--ext", component:"--comp", ext_person:"--cell"};
const TAGS = {person:"[Személy]", system:"[Szoftverrendszer]", external:"[Külső rendszer]", container:"[Konténer]", db:"[Adattár]", queue:"[Konténer: üzenetsor]", component:"[Komponens]"};
function mtext(g, x, y, lines, fs, opts){
  const n = lines.length, lh = fs * 1.18, y0 = y - (n - 1) * lh / 2;
  const t = mk(g, "text", Object.assign({x: x, y: y0, "text-anchor": "middle", "dominant-baseline": "central", "font-size": fs}, opts || {}));
  lines.forEach((s, i) => { const sp = mk(t, "tspan", {x: x, dy: i ? lh : 0}, s); });
  return t;
}
function drawDiagram(svgEl, D, o){
  o = o || {};
  const hn = new Set(o.hlNodes || []), he = new Set(o.hlEdges || []), dim = o.dim || false;
  const k = D.k, fs = D.fs * k;
  svgEl.innerHTML = "";
  svgEl.setAttribute("viewBox", `0 0 ${D.W} ${D.H}`);
  const defs = mk(svgEl, "defs", {});
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="${7}" markerHeight="${7}" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--line')}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="${9}" markerHeight="${9}" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--hl')}"/></marker>`;
  (D.bounds || []).forEach(b => {
    const st = b.style || "dashed";
    mk(svgEl, "rect", {x: b.x, y: b.y, width: b.w, height: b.h, fill: "none", stroke: css("--line"),
      "stroke-width": st === "thick" ? 2.6 * k : (st === "dotted" ? 1.8 * k : 1.4 * k),
      "stroke-dasharray": st === "dashed" ? `${6*k} ${3*k}` : (st === "dotted" ? `${1*k} ${2.2*k}` : "none")});
    if (b.lpos === "tr") mk(svgEl, "text", {x: b.x + b.w - 6 * k, y: b.y + 4 * k + fs, "text-anchor": "end", "font-size": fs, "font-style": "italic"}, b.label);
    else mk(svgEl, "text", {x: b.x + 6 * k, y: b.y + b.h - 4 * k, "font-size": fs, "font-style": "italic"}, b.label);
  });
  const labels = [];
  D.edges.forEach(e => {
    const [[x0, y0], [x1, y1]] = e.p, on = he.has(e.id), faint = dim && !on;
    const col = on ? css("--hl") : css("--line");
    const ln = mk(svgEl, "line", {x1: x0, y1: y0, x2: x1, y2: y1, stroke: col, "stroke-width": (on ? 2.8 : (e.lw || 1.2)) * k,
      "stroke-dasharray": e.async ? `${5*k} ${3*k}` : "none", "marker-end": on ? "url(#ahh)" : "url(#ah)", opacity: faint ? 0.35 : 1});
    if (e.both) ln.setAttribute("marker-start", on ? "url(#ahh)" : "url(#ah)");
    if (e.label) {
      const t = e.t === undefined ? 0.5 : e.t, lx = x0 + (x1 - x0) * t + (e.dx || 0), ly = y0 + (y1 - y0) * t + (e.dy || 0);
      labels.push([lx, ly, e.label.split("\n"), (e.fs || D.fs) * k, on, faint]);
    }
  });
  D.nodes.forEach(n => {
    const kind = n.kind || "container", on = hn.has(n.id), faint = dim && !on && !(o.keep || []).includes(n.id);
    const g = mk(svgEl, "g", {opacity: faint ? 0.4 : 1, tabindex: o.onClick ? 0 : -1, role: o.onClick ? "button" : "img",
      "aria-label": n.label.replace(/\n/g, " ")});
    if (o.onClick) { g.style.cursor = "pointer"; g.addEventListener("click", () => o.onClick(n)); g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); o.onClick(n); } }); }
    const lw = (kind === "system" || on ? 2.6 : (kind === "component" ? 1.0 : 1.3)) * k;
    const stroke = on ? css("--hl") : css("--line"), fill = css(FILLV[kind] || "--cell");
    let ty = n.y + n.h / 2;
    if (kind === "db") {
      const eh = Math.min(n.h * 0.22, 9 * k), rx = n.w / 2, ry = eh / 2, x = n.x, y = n.y, w = n.w, h = n.h;
      mk(g, "path", {d: `M${x},${y+ry} L${x},${y+h-ry} A${rx},${ry} 0 0 0 ${x+w},${y+h-ry} L${x+w},${y+ry}`, fill: fill, stroke: stroke, "stroke-width": lw});
      mk(g, "ellipse", {cx: x + rx, cy: y + ry, rx: rx, ry: ry, fill: fill, stroke: stroke, "stroke-width": lw});
      ty = y + ry + (h - ry) / 2;
    } else {
      const rs = kind === "external" ? 0 : Math.min(n.w, n.h) * 0.08;
      mk(g, "rect", {x: n.x, y: n.y, width: n.w, height: n.h, rx: rs, fill: fill, stroke: stroke, "stroke-width": lw,
        "stroke-dasharray": kind === "external" ? `${4*k} ${2*k}` : "none"});
      if (kind === "queue") [6, 11].forEach(d => mk(g, "line", {x1: n.x + n.w - d * k, y1: n.y, x2: n.x + n.w - d * k, y2: n.y + n.h, stroke: stroke, "stroke-width": 0.8 * k}));
    }
    if (o.zoom === n.id) { const p = 4 * k; mk(g, "rect", {x: n.x - p, y: n.y - p, width: n.w + 2 * p, height: n.h + 2 * p, fill: "none", stroke: css("--hl2"), "stroke-width": 2 * k, "stroke-dasharray": `${1.2*k} ${2.2*k}`}); }
    let tx = n.x + n.w / 2;
    if (kind === "person" || kind === "ext_person") {
      const s = Math.min(n.h * 0.55, 22 * k), ix = n.x + s * 0.55, iy = n.y + n.h / 2 - s * 0.55;
      mk(g, "circle", {cx: ix, cy: iy + s * 0.22, r: s * 0.2, fill: "none", stroke: css("--line"), "stroke-width": k});
      mk(g, "path", {d: `M${ix},${iy+s*0.42} L${ix},${iy+s*0.8} M${ix-s*0.28},${iy+s*0.55} L${ix+s*0.28},${iy+s*0.55} M${ix},${iy+s*0.8} L${ix-s*0.22},${iy+s*1.05} M${ix},${iy+s*0.8} L${ix+s*0.22},${iy+s*1.05}`, fill: "none", stroke: css("--line"), "stroke-width": k});
      tx = n.x + s * 1.1 + (n.w - s * 1.1) / 2;
    }
    const tag = n.tag !== undefined ? n.tag : (TAGS[kind] || "");
    const lines = n.label.split("\n").concat(tag ? [tag] : []);
    mtext(g, tx, ty, lines, (n.fs || D.fs) * k, on ? {"font-weight": "bold"} : {});
  });
  labels.forEach(([lx, ly, lines, f, on, faint]) => {
    const g = mk(svgEl, "g", {opacity: faint ? 0.45 : 1});
    const t = mtext(g, lx, ly, lines, f, on ? {"font-weight": "bold"} : {});
    const bb = t.getBBox();
    const r = document.createElementNS(NS, "rect");
    for (const [a, v] of Object.entries({x: bb.x - 2, y: bb.y - 1, width: bb.width + 4, height: bb.height + 2, rx: 2, fill: css("--bg"), opacity: 0.92})) r.setAttribute(a, v);
    g.insertBefore(r, t);
  });
  (D.texts || []).forEach(t => mk(svgEl, "text", {x: t.x, y: t.y, "font-size": (t.fs || D.fs) * k, "text-anchor": t.anchor === "center" ? "middle" : (t.anchor === "right" ? "end" : "start"), "dominant-baseline": "central", "font-weight": t.bold ? "bold" : "normal"}, t.s));
}

"x": 4, "y": 84, "w": 362, "h": 270, "label": "Rendeléskezelő platform [rendszerhatár]", "style": "thick"}], "nodes": [{"id": "ugyfel", "x": 10, "y": 8, "w": 125, "h": 56, "label": "Ügyfél", "kind": "person", "info": "Ügyfél [Személy]."}, {"id": "monolit", "x": 16, "y": 100, "w": 200, "h": 84, "label": "Rendelés-monolit\nmodulok: Rendelés,\nSzámlázás, Készlet", "tag": "[Konténer: Java,\negy deploy egység]", "info": "Rendelés-monolit [Konténer: Java, egy deploy egység]: befogadja és validálja a rendelési kérést, a Rendelés, Számlázás és Készlet modult folyamaton belüli metódushívással koordinálja, és egy tranzakcióban írja a rendelést és az outbox-eseményt. Interfész: HTTPS/REST (rendelés API)."}, {"id": "db", "x": 16, "y": 230, "w": 130, "h": 90, "label": "Rendelés DB\nrendelés +\noutbox tábla", "kind": "db", "tag": "[PostgreSQL]", "info": "Rendelés DB [Adattár: PostgreSQL]: a rendelés, számlázás és készlet modul tranzakciós állapota és az outbox tábla. Interfész: SQL."}, {"id": "relay", "x": 230, "y": 230, "w": 130, "h": 90, "label": "Outbox relay\n(modul vagy\nkülön folyamat)", "tag": "[az ADR dönt]", "info": "Outbox relay: kiolvassa az outbox tábla még el nem küldött eseményeit, és a brokernek publikálja (legalább egyszeri kézbesítés, retry exponenciális backoff-fal). Hogy a monolit része vagy külön folyamat, azt az ADR-ben jelölni kell."}, {"id": "broker", "x": 222, "y": 395, "w": 138, "h": 62, "label": "Message Broker", "kind": "external", "tag": "[külső/platform-\nszolgáltatás]", "info": "Message Broker [külső vagy platformszolgáltatás]: AMQP-üzenetek a külső fogyasztóknak."}, {"id": "fogyaszto", "x": 10, "y": 395, "w": 130, "h": 62, "label": "Külső\nfogyasztók", "kind": "external", "tag": "", "info": "Külső fogyasztók: az eseményekre feliratkozó rendszerek (pl. értesítés, analitika)."}], "edges": [{"id": "y1", "a": "ugyfel", "b": "monolit", "label": "[HTTPS, szinkron]", "t": 0.5, "dx": 82, "dy": -8, "p": [[83.99056603773585, 64.0], [98.76415094339623, 100.0]]}, {"id": "y2", "a": "monolit", "b": "db", "label": "[SQL, szinkron,\negy tranzakció]", "pa": [80, 184], "pb": [80, 230], "t": 0.5, "dx": 66, "p": [[80, 184], [80, 230]]}, {"id": "y3", "a": "relay", "b": "db", "label": "outbox-\nolvasás\n[SQL]", "t": 0.5, "dy": -30, "p": [[230.0, 275.0], [146.0, 275.0]]}, {"id": "y4", "a": "relay", "b": "broker", "label": "[AMQP, aszinkron,\nretry exp. backoff]", "pa": [295, 320], "pb": [295, 395], "t": 0.74, "dx": -100, "async": true, "p": [[295, 320], [295, 395]]}, {"id": "y5", "a": "broker", "b": "fogyaszto", "label": "[AMQP,\naszinkron]", "t": 0.5, "dy": 0, "async": true, "p": [[222.0, 426.0], [140.0, 426.0]]}], "k": 1.6754850088183422, "fs": 8.4}, {"W": 370, "H": 330, "texts": [], "bounds": [{"x": 2, "y": 24, "w": 366, "h": 300, "label": "Rendelés-monolit [konténerhatár]", "style": "dashed"}], "nodes": [{"id": "ctrl", "x": 110, "y": 36, "w": 150, "h": 50, "label": "API Controller", "kind": "component", "info": "API Controller [Komponens]: HTTP-végpontok, validáció. Interfész: REST (POST /rendelesek)."}, {"id": "svc", "x": 95, "y": 130, "w": 180, "h": 50, "label": "RendelésSzolgáltatás", "kind": "component", "info": "RendelésSzolgáltatás [Komponens]: feldolgozza a rendelési parancsot, koordinálja a készlet- és számlázási műveleteket; interfész: RendelésFeldolgozás."}, {"id": "kesz", "x": 6, "y": 240, "w": 86, "h": 54, "label": "Készlet-\nModul", "kind": "component", "fs": 7.4, "tag": "", "info": "KészletModul [Komponens]: készletfoglalás, folyamaton belüli metódushívással."}, {"id": "szamla", "x": 97, "y": 240, "w": 86, "h": 54, "label": "Számlázás-\nModul", "kind": "component", "fs": 7.4, "tag": "", "info": "SzámlázásModul [Komponens]: számla előállítása ugyanabban a folyamatban (nincs külön worker)."}, {"id": "repo", "x": 188, "y": 240, "w": 86, "h": 54, "label": "Rendelés\nRepository", "kind": "component", "fs": 7.4, "tag": "", "info": "Rendelés Repository [Komponens]: a rendelés és az outbox-sor írása egy tranzakcióban."}, { const INTRO = ["Context: a vastag keret a rendszerhatár; a platform hívja a partner készlet-API-t. Kattints egy elemre!",
  "Container: egy deploy egység (benne a Számlázás modul), DB outbox táblával, outbox relay, broker. Kattints egy elemre!",

const svg = document.getElementById("v"), status = document.getElementById("status");
let cur = 0;

function showV(v){ cur = v; [0, 1, 2].forEach(i => document.getElementById("v" + i).setAttribute("aria-pressed", i === v)); drawDiagram(svg, VIEWS[v], {onClick: pick}); status.textContent = INTRO[v]; }
[0, 1, 2].forEach(i => document.getElementById("v" + i).onclick = () => showV(i));
