<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watermark és allowed lateness</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="first" title="Első">⏮</button><button id="prev">◀ Lépés</button><button id="play">▶ Lejátszás</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span><label>watermark-késleltetés <input id="dl" type="range" min="0" max="3" step="0.5" value="1"> <span id="dlv"></span></label><label>allowed lateness <input id="lt" type="range" min="0" max="10" step="1" value="5"> <span id="ltv"></span></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 740 420" role="img" aria-label="Eseményidő a feldolgozási idő függvényében, 5 perces ablak, lépcsős watermark, első kibocsátás, újrakibocsátás és eldobott késő esemény"></svg>

<p class="small">Szemléltető modell, nem mérés. A watermark becslés, nem garancia. f1, f2: a következő ablakok eseményei, amelyek a watermarkot léptetik. A kezdőállapot a statikus ábra (minden érkezés lejátszva).</p>
<script>
const DATA = {"events": [["e1", 1, 1], ["e2", 3, 4], ["e3", 4, 6], ["f1", 6, 7], ["e4", 2, 8], ["f2", 11, 11], ["e5", 1, 12]], "win": [0, 5]};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let k = DATA.events.length, timer = null;
const sl = id => +document.getElementById(id).value;
function sim(delay, lateness){
  let wm = -99, fired = false, closed = false, count = 0; const log = [], wmS = [];
  [...DATA.events].sort((a,b) => a[2]-b[2]).forEach(([name, et, at]) => {
    let kind = "other", out = null;
    if (et >= DATA.win[0] && et < DATA.win[1]) {
      if (closed) kind = "dropped";
      else if (fired) { kind = "late"; count++; out = ["re", count]; }
      else { kind = "ontime"; count++; }
    }
    const w2 = Math.max(wm, et - delay);
    if (w2 !== wm) { wm = w2; wmS.push([at, wm]); }
    if (!fired && wm >= DATA.win[1]) { fired = true; out = ["first", count]; }
    if (fired && !closed && wm >= DATA.win[1] + lateness) closed = true;
    log.push({name, et, at, kind, wm, out, fired, closed, count});
  });
  return {log, wmS};
}
const hm = m => "12:" + String(Math.floor(m)).padStart(2, "0") + (m % 1 ? ":30" : "");
function draw(){
  const delay = sl("dl"), lat = sl("lt");
  document.getElementById("dlv").textContent = fmt(delay) + " perc";
  document.getElementById("ltv").textContent = fmt(lat) + " perc";
  const {log, wmS} = sim(delay, lat);
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg"), mu = css("--muted");
  const x0 = 70, y0 = 380, sx = 50, sy = 26;
  const X = t => x0 + t * sx, Y = e => y0 - e * sy;
  mk(svg, "rect", {x: X(0), y: Y(5), width: X(12.8) - X(0), height: 5 * sy, fill: css("--fill3")});
  mk(svg, "text", {x: X(0.1), y: Y(5) + 14, "font-size": 12}, "ablak [12:00, 12:05)");
  mk(svg, "line", {x1: X(0), x2: X(12.8), y1: Y(5 + lat), y2: Y(5 + lat), stroke: fg, "stroke-dasharray": "8 3 2 3"});
  mk(svg, "text", {x: X(0.1), y: Y(5 + lat) - 4, "font-size": 12}, `lezárási határ: 12:05 + ${fmt(lat)} perc`);
  mk(svg, "line", {x1: X(0), y1: Y(0), x2: X(12.8), y2: Y(0), stroke: fg});
  mk(svg, "line", {x1: X(0), y1: Y(0), x2: X(0), y2: Y(14.3), stroke: fg});
  for (let t = 0; t <= 12; t += 2) {
    mk(svg, "text", {x: X(t), y: y0 + 16, "text-anchor": "middle", "font-size": 11}, hm(t));
    mk(svg, "text", {x: x0 - 6, y: Y(t) + 4, "text-anchor": "end", "font-size": 11}, hm(t));
  }
  mk(svg, "text", {x: X(6.4), y: y0 + 32, "text-anchor": "middle", "font-size": 12}, "feldolgozási (érkezési) idő");
  mk(svg, "text", {x: 14, y: Y(7), "font-size": 12, transform: `rotate(-90 14 ${Y(7)})`, "text-anchor": "middle"}, "eseményidő");
  const shown = log.slice(0, k);
  const tNow = k > 0 ? shown[k-1].at : 0;
  // watermark lépcső a jelenlegi időpontig
  let d = "", prev = null;
  wmS.filter(w => w[0] <= tNow).forEach((w, i, a) => { const tEnd = (i + 1 < a.length) ? a[i+1][0] : (k >= log.length ? 12.8 : tNow);
    d += `${i ? "L" : "M"}${X(w[0])},${Y(Math.max(w[1], -0.5))} L${X(tEnd)},${Y(Math.max(w[1], -0.5))} `; });
  if (d) mk(svg, "path", {d, fill: "none", stroke: fg, "stroke-width": 2.2, "stroke-dasharray": "7 4"});
  let nlab = 0;
  shown.forEach(l => {
    const cx = X(l.at), cy = Y(l.et);
    if (l.kind === "ontime") mk(svg, "circle", {cx, cy, r: 6, fill: css("--bg"), stroke: fg, "stroke-width": 1.6});
    else if (l.kind === "late") mk(svg, "path", {d: `M${cx},${cy-8} L${cx+7},${cy+5} L${cx-7},${cy+5}Z`, fill: css("--fill2"), stroke: fg, "stroke-width": 1.4});
    else if (l.kind === "dropped") mk(svg, "path", {d: `M${cx-6},${cy-6} L${cx+6},${cy+6} M${cx+6},${cy-6} L${cx-6},${cy+6}`, stroke: fg, "stroke-width": 3});
    else mk(svg, "rect", {x: cx - 5, y: cy - 5, width: 10, height: 10, fill: css("--fill3"), stroke: fg});
    mk(svg, "text", {x: cx + 8, y: cy - 6, "font-size": 12}, l.name);
    if (l.out) {
      mk(svg, "line", {x1: cx, x2: cx, y1: y0, y2: y0 - 10, stroke: css("--hl2"), "stroke-width": 3});
      mk(svg, "text", {x: cx, y: y0 - 14 - 14 * (nlab++ % 2), "font-size": 11, "text-anchor": "middle", fill: css("--hl2")}, l.out[0] === "first" ? `kibocsátás: ${l.out[1]}` : `újra: ${l.out[1]}`);
    }
  });
  const nOn = log.filter(l => l.kind === "ontime").length, nLate = log.filter(l => l.kind === "late").length;
  const nDrop = log.filter(l => l.kind === "dropped").length, nOut = log.filter(l => l.out).length;
  let st = "ablak nyitott";
  if (k > 0) { const L = shown[k-1]; st = L.closed ? "lezárva" : (L.fired ? (shown.some(x => x.out && x.out[0] === "re") ? "újrakibocsátva" : "kibocsátva") : "ablak nyitott"); }
  const last = k > 0 ? shown[k-1] : null;
  const what = last ? `${last.name} (eseményidő ${hm(last.et)}) érkezik ${hm(last.at)}-kor: ` +
    ({ontime: "időben, az ablakba kerül", late: "késő, de az allowed latenessen belül – újrakibocsátás", dropped: "a lezárás után érkezett – eldobva / side output", other: "a következő ablak eseménye, csak a watermarkot lépteti"})[last.kind] +
    `; watermark = ${last.wm < 0 ? "–" : hm(last.wm)}. ` : "Kiindulás: még nem érkezett esemény. ";
  status.textContent = what + `Ablak állapota: ${st}. Összesen: ${nOn} időben, ${nLate} késő befogadott, ${nDrop} eldobott, ${nOut} kibocsátás.`;
  document.getElementById("cnt").textContent = `${k}/${log.length}`;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); k = 0; draw(); };
document.getElementById("prev").onclick = () => { stop(); k = Math.max(0, k - 1); draw(); };
document.getElementById("next").onclick = () => { stop(); k = Math.min(DATA.events.length, k + 1); draw(); };
document.getElementById("play").onclick = () => { if (timer) { stop(); return; } if (k >= DATA.events.length) k = 0;
  document.getElementById("play").textContent = "⏸ Szünet"; draw();
  timer = setInterval(() => { if (k >= DATA.events.length) stop(); else { k++; draw(); } }, 1100); };
["dl", "lt"].forEach(id => document.getElementById(id).oninput = () => draw());
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("prev").click(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
