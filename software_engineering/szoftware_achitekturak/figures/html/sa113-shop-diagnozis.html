<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A shop elosztott monolit diagnózisa</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt szolgáltatás gráfja; a checkout–pricing–inventory csoportot közös release, körkörös hívás és terjedő incidens jelöli elosztott monolitként, a reporting nem érintett."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fiktív shop rendszer; a felismerési napló 1–5. sora. Dupla vonal: közös release; vastag szaggatott: szinkron hívási lánc; pontozott: hibaterjedés; ✗: kiesés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"row": 0, "layer": 1, "msg": "1. sor – A checkout 2.4.0 csak a pricing 1.9.0-val telepíthető: ellenőrzés: Változtatási napló és verziótörténet → Megerősített"}, {"row": 1, "layer": 2, "msg": "2. sor – A checkout p95 válaszideje 1,2 s: ellenőrzés: Függőségi gráf: hány szolgáltatáson halad át? → 4 szolgáltatás, pricing és inventory között körkörös hívás → megerősített"}, {"row": 2, "layer": 3, "msg": "3. sor – A pricing kiesése a checkout teljes kiesését okozta: ellenőrzés: Incidensnapló és konfiguráció → Nincs timeout és circuit breaker → megerősített"}, {"row": 3, "layer": 4, "msg": "4. sor – A reporting napi 2 millió kérést kap: ellenőrzés: A deploy-ok függetlenek-e? → Önálló deploy, saját adattár → nem tünet"}, {"row": 4, "layer": 5, "msg": "5. sor – A reporting hetente egyszer lelassul: Nincs elég adat → elégtelen bizonyíték"}, {"row": -1, "layer": 6, "msg": "Végső diagnózis: a checkout–pricing–inventory csoport elosztott monolit (közös release, körkörös szinkron hívás, terjedő incidens); a reporting nem érintett."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const FR = [0.56, -0.2, 3.04, 2.12], P = {"web": [-0.3, 0.95], "checkout": [1.35, 0.95], "pricing": [2.75, 1.6], "inventory": [2.75, 0.25], "reporting": [2.75, 2.8]}, CALLS = [["web", "checkout"], ["checkout", "pricing"], ["checkout", "inventory"], ["pricing", "inventory"], ["inventory", "pricing"], ["reporting", "pricing"]], CHAIN = [["web", "checkout"], ["checkout", "pricing"], ["pricing", "inventory"], ["inventory", "pricing"]], ROWS = [["A checkout 2.4.0 csak a pricing 1.9.0-val telepíthető", "Közös kiadási függőség", "Változtatási napló és verziótörténet", "Megerősített"], ["A checkout p95 válaszideje 1,2 s", "Hosszú szinkron lánc", "Függőségi gráf: hány szolgáltatáson halad át?", "4 szolgáltatás, pricing és inventory között körkörös hívás → megerősített"], ["A pricing kiesése a checkout teljes kiesését okozta", "Hiányzó időtúllépés és circuit breaker", "Incidensnapló és konfiguráció", "Nincs timeout és circuit breaker → megerősített"], ["A reporting napi 2 millió kérést kap", "Nagy forgalom", "A deploy-ok függetlenek-e?", "Önálló deploy, saját adattár → nem tünet"], ["A reporting hetente egyszer lelassul", "Erőforrás-verseny", "Monitoring és profilozás", "Nincs elég adat → elégtelen bizonyíték"]], NW = {"web": 0.7, "checkout": 1.3, "pricing": 1.3, "inventory": 1.3, "reporting": 1.3}, NH = 0.38;
const S = 92, OX = 75, OY = 300;
function X(v){ return OX + v * S; } function Y(v){ return OY - v * S; }
function ml(x, y, t, o){ const lines = String(t).split("\n"), e = el("text", Object.assign({x: x, y: y, "font-size": 12}, o || {}));
  lines.forEach((l, j) => { const s = document.createElementNS(NS, "tspan"); s.setAttribute("x", x); s.setAttribute("dy", j ? "1.15em" : "0"); s.textContent = l; e.appendChild(s); }); return e; }
function curve(a, b, rad){
  const [x1, y1] = [X(P[a][0]), Y(P[a][1])], [x2, y2] = [X(P[b][0]), Y(P[b][1])];
  const mx = (x1 + x2) / 2 - rad * (y2 - y1), my = (y1 + y2) / 2 + rad * (x2 - x1);
  // a doboz szélén kezdődjön/végződjön
  const sh = (a0, xa, ya, xb, yb) => { const dx = xb - xa, dy = yb - ya, L = Math.hypot(dx, dy) || 1, t = Math.min(NW[a0] * S / 2 / Math.abs(dx / L || 1e-9), NH * S / 2 / Math.abs(dy / L || 1e-9)) + 3; return [xa + dx / L * t, ya + dy / L * t]; };
  const [sx, sy] = sh(a, x1, y1, mx, my), [ex, ey] = sh(b, x2, y2, mx, my);
  return `M ${sx} ${sy} Q ${mx} ${my} ${ex} ${ey}`;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 545");
  const fg = css("--fg"), hl = css("--hl2"), L = s.layer;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`;
  svg.appendChild(defs);
  const inChain = (a, b) => CHAIN.some(e => e[0] === a && e[1] === b);
  CALLS.forEach(([a, b]) => {
    const rad = (a === "pricing" && b === "inventory") || (a === "inventory" && b === "pricing") ? 0.25 : 0;
    const ch = L >= 2 && inChain(a, b), now = s.row === 1 && ch;
    el("path", {d: curve(a, b, rad), fill: "none", stroke: now ? hl : fg, "stroke-width": ch ? 3 : 1.3, "stroke-dasharray": ch ? "8 5" : "", "marker-end": now ? "url(#ah2)" : "url(#ah)"});
  });
  if (L >= 1) {
    const c = s.row === 0 ? hl : fg, a = P.checkout, b = P.pricing;
    [-0.05, 0.05].forEach(d => el("line", {x1: X(a[0] - 0.05 + d), y1: Y(a[1] + 0.3 - d), x2: X(b[0] - 0.75 + d), y2: Y(b[1] + 0.12 - d), stroke: c, "stroke-width": 1.6}));
    ml(X(-0.7), Y(3.0), "közös release:\n2.3.0+1.8.0;\n2.4.0+1.9.0", {fill: c});
    ml(X(P.inventory[0] + 0.72), Y(P.inventory[1]) + 4, "önálló release", {fill: c});
    if (L < 4) ml(X(P.reporting[0] + 0.72), Y(P.reporting[1]) + 4, "önálló release", {fill: c});
  }
  if (L >= 2) ml(X(P.web[0]), Y(P.web[1] - 0.45), "lánc: 4 szolg.,\np95 1,2 s", {"text-anchor": "middle", fill: s.row === 1 ? hl : fg});
  if (L >= 3) {
    el("path", {d: curve("pricing", "checkout", 0.35), fill: "none", stroke: s.row === 2 ? hl : fg, "stroke-width": 2.4, "stroke-dasharray": "2 4", "marker-end": s.row === 2 ? "url(#ah2)" : "url(#ah)"});
    ml(X(-0.7), Y(2.3), "kiesés terjed:\nnincs timeout/CB", { fill: s.row === 2 ? hl : fg});
  }
  if (L >= 4) ml(X(P.reporting[0] + 0.72), Y(P.reporting[1] + 0.1), "2 M kérés/nap:\nnem tünet", { fill: s.row === 3 ? hl : fg});
  if (L >= 5) ml(X(P.reporting[0] + 0.72), Y(P.reporting[1] - 0.45), "heti lassulás:\nelégtelen bizonyíték", { fill: s.row === 4 ? hl : fg});
  if (L >= 6) { el("rect", {x: X(FR[0]), y: Y(FR[1] + FR[3]), width: FR[2] * S, height: FR[3] * S, rx: 22, fill: "none", stroke: hl, "stroke-width": 3, "stroke-dasharray": "12 4 3 4"}); ml(X(FR[0] + FR[2] / 2), Y(FR[1]) + 18, "diagnózis: elosztott monolit", {"text-anchor": "middle", "font-weight": "bold", fill: hl}); }
  Object.entries(P).forEach(([n, p]) => {
    el("rect", {x: X(p[0] - NW[n] / 2), y: Y(p[1] + NH / 2), width: NW[n] * S, height: NH * S, rx: 7, fill: css("--cell"), stroke: fg, "stroke-width": 1.5});
    el("text", {x: X(p[0]), y: Y(p[1]) + 5, "text-anchor": "middle", "font-size": 13, "font-family": "monospace"}, n);
    if (L >= 3 && n === "pricing") el("text", {x: X(p[0] + NW[n] / 2), y: Y(p[1] + NH / 2) + 6, "text-anchor": "middle", "font-size": 18, "font-weight": "bold", fill: s.row === 2 ? hl : fg}, "✗");
  });
  // napló-táblázat a gráf alatt
  const ty = 410;
  ROWS.forEach((r, i) => {
    const y = ty + i * 26, on = i === s.row, done = s.row < 0 || i <= s.row;
    el("rect", {x: 4, y: y - 17, width: 792, height: 24, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : css("--muted"), "stroke-width": on ? 2 : 0.6});
    el("text", {x: 10, y: y, "font-size": 11.5, fill: done ? fg : css("--muted")}, `${i + 1}. ${r[0]}`);
    el("text", {x: 790, y: y, "font-size": 11.5, "text-anchor": "end", "font-weight": on ? "bold" : "normal", fill: done ? fg : css("--muted")}, done ? r[3] : "…");
  });
  el("text", {x: 10, y: ty - 24, "font-size": 11.5, "font-weight": "bold"}, "Felismerési napló: tünet → eredmény");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
