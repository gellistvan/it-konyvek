<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotspotok és prioritási mátrix</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
select,button{font:inherit;padding:3px 8px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#row{background:var(--code);padding:6px 10px;min-height:5.5em}
.small{font-size:12px;color:var(--muted)}
g.td{cursor:pointer}
g.td:focus rect{stroke:var(--hl);stroke-width:3}
</style></head><body>
<div class="ctl" role="group" aria-label="Hotspot-paraméterek">
  <label>Churn-ablak <input type="range" id="win" min="0" max="2" step="1" value="1"> <span id="wv"></span></label>
  <label>Komplexitási küszöb <input type="range" id="thr" min="5" max="20" step="1" value="10"> <span id="tv"></span></label>
</div>
<div class="ctl" role="group" aria-label="A kiválasztott TD-tétel szintjei">
  <span id="selname">TD-001</span>
  <label>kamat <select id="km"><option>1</option><option>2</option><option>3</option></select></label>
  <label>kockázat <select id="kk"><option>1</option><option>2</option><option>3</option></select></label>
  <button id="reset" type="button">Alapértékek</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 360" role="img" aria-label="Bal oldalon nyolc fájl pontdiagramja komplexitás és churn szerint a forró pont zónával; jobb oldalon a TD-001, TD-002, TD-003 tétel a kamat–kockázat mátrixban."></svg>
<div id="row" aria-live="polite"></div>
<p class="small">Szintetikus adatok. A (B) mátrixban kattints (vagy Tab + Enter) egy TD-tételre: alul a nyilvántartás sora jelenik meg, a fenti listákkal a kamat és a kockázat szintje átállítható, és a javasolt döntés frissül.</p>
<script>
const FILES = [["BillingRules.cs", 45, 11, 32, 58], ["LegacyExport.cs", 50, 0, 1, 14], ["InvoiceDto.cs", 3, 9, 25, 40], ["TaxCalculator.cs", 28, 7, 18, 30], ["WebhookController.cs", 14, 10, 22, 31], ["ReportRepository.cs", 22, 2, 6, 15], ["CustomerService.cs", 9, 3, 8, 17], ["PdfRenderer.cs", 35, 1, 4, 7]], TD0 = [{"id": "TD-001", "hely": "Billing.Domain", "leiras": "Szétszórt számlázási szabályok", "kamat_txt": "adószabály-módosításonként 2 + 1 óra; havonta 2–3 változtatás (kb. heti 1,4–2,1 óra)", "freq_per_month": [2, 3], "kockazat": 2, "kock_txt": "pénzügyi hatás, de a kézi ellenőrzés részben kompenzál", "kamat": 2}, {"id": "TD-002", "hely": "Data Access", "leiras": "Szinkron (nem async) ORM-lekérdezések", "kamat_txt": "új riportonként 3 óra kapacitás- és időkorlát-hangolás; havonta 2 eset", "freq_per_month": [2, 2], "kockazat": 1, "kock_txt": "belső riport, nincs közvetlen ügyfélhatás", "kamat": 2}, {"id": "TD-003", "hely": "Controller", "leiras": "Fizetési webhook bemenet-validáció nélkül", "kamat_txt": "webhook-hibánként 1 óra naplóellenőrzés; heti 1–2 eset", "freq_per_month": [4.3, 8.7], "kockazat": 3, "kock_txt": "hamisított webhook fizetési állapotot írhat át (biztonsági hiba, azonnal javítandó)", "kamat": 3}], QUAD = {"HH": "azonnal / következő iteráció", "HL": "rutinmunkába építve", "LH": "kompenzáló intézkedés (monitoring)", "LL": "tudatos halasztás"}, WINS = [30, 90, 180], HOT90 = 15;
let TD = JSON.parse(JSON.stringify(TD0)), sel = 0;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, p, txt){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
function dec(km, kk){ return QUAD[(km >= 2 ? "H" : "L") + (kk >= 2 ? "H" : "L")]; }
function draw(){
  const wi = +document.getElementById("win").value, w = WINS[wi], thr = +document.getElementById("thr").value, hot = HOT90 * w / 90;
  document.getElementById("wv").textContent = w + " nap"; document.getElementById("tv").textContent = thr;
  svg.innerHTML = "";
  const ax = 60, ay = 30, aw = 420, ah = 280, X = c => ax + aw * c / 60, Y = v => ay + ah - ah * v / 60;
  mk("rect", {x: X(thr), y: Y(60), width: X(60) - X(thr), height: Y(hot) - Y(60), fill: css("--cellhl"), opacity: 0.8});
  mk("line", {x1: ax, y1: ay + ah, x2: ax + aw, y2: ay + ah, stroke: css("--line")}); mk("line", {x1: ax, y1: ay, x2: ax, y2: ay + ah, stroke: css("--line")});
  mk("line", {x1: X(thr), x2: X(thr), y1: ay, y2: ay + ah, stroke: css("--fg"), "stroke-dasharray": "6 4"});
  mk("line", {x1: ax, x2: ax + aw, y1: Y(hot), y2: Y(hot), stroke: css("--fg"), "stroke-dasharray": "2 3"});
  mk("text", {x: ax + aw - 4, y: ay + 14, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, null, "FORRÓ PONT");
  [0, 20, 40, 60].forEach(v => { mk("text", {x: X(v), y: ay + ah + 16, "text-anchor": "middle", "font-size": 11}, null, String(v)); mk("text", {x: ax - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, null, String(v)); });
  mk("text", {x: ax + aw / 2, y: ay + ah + 34, "text-anchor": "middle", "font-size": 12}, null, "ciklomatikus komplexitás");
  mk("text", {x: ax, y: ay - 10, "font-size": 12}, null, `(A) churn (módosítás / ${w} nap)`);
  const hots = [];
  FILES.forEach(f => { const ch = f[2 + wi], isHot = f[1] > thr && ch >= hot; if (isHot) hots.push(f[0]);
    mk("circle", {cx: X(f[1]), cy: Y(ch), r: 6, fill: isHot ? css("--fg") : css("--bg"), stroke: css("--fg"), "stroke-width": 1.4});
    mk("text", {x: X(f[1]) + 9, y: Y(ch) - 6, "font-size": 11}, null, f[0] + (f[0] === "LegacyExport.cs" && !isHot && f[1] > thr ? " (nincs kamat)" : "")); });
  // (B)
  const bx = 600, by = 40, cs = 85, BX = v => bx + (v - 1) * cs, BY = v => by + (3 - v) * cs;
  mk("text", {x: bx, y: by - 14, "font-size": 12}, null, "(B) kamat × kockázat");
  for (let km = 1; km <= 3; km++) for (let kk = 1; kk <= 3; kk++) {
    const hi = (km >= 2) + (kk >= 2);
    mk("rect", {x: BX(km), y: BY(kk), width: cs, height: cs, fill: hi === 2 ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": 0.8}); }
  mk("line", {x1: BX(2), x2: BX(2), y1: by, y2: by + 3 * cs, stroke: css("--fg"), "stroke-width": 2.5});
  mk("line", {x1: bx, x2: bx + 3 * cs, y1: BY(1), y2: BY(1), stroke: css("--fg"), "stroke-width": 2.5});
  [1, 2, 3].forEach(v => { mk("text", {x: BX(v) + cs / 2, y: by + 3 * cs + 16, "text-anchor": "middle", "font-size": 11}, null, String(v)); mk("text", {x: bx - 8, y: BY(v) + cs / 2 + 4, "text-anchor": "end", "font-size": 11}, null, String(v)); });
  mk("text", {x: bx + 1.5 * cs, y: by + 3 * cs + 34, "text-anchor": "middle", "font-size": 12}, null, "kamat szintje");
  const cnt = {};
  TD.forEach((t, i) => { const key = t.kamat + "," + t.kockazat, n = cnt[key] = (cnt[key] || 0) + 1;
    const g = mk("g", {class: "td", tabindex: 0, role: "button", "aria-label": `${t.id}: kamat ${t.kamat}, kockázat ${t.kockazat}`});
    const x = BX(t.kamat) + 10, y = BY(t.kockazat) + 10 + (n - 1) * 24;
    mk("rect", {x: x, y: y, width: 64, height: 20, fill: i === sel ? css("--hl") : css("--fg"), stroke: css("--line")}, g);
    mk("text", {x: x + 32, y: y + 15, "text-anchor": "middle", "font-size": 12, "font-weight": "bold", fill: css("--bg")}, g, t.id);
    const act = () => { sel = i; sync(); draw(); };
    g.addEventListener("click", act); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }); });
  const t = TD[sel];
  document.getElementById("status").textContent = `Forró pontok (${w} napos ablak, küszöb ${thr}): ${hots.join(", ") || "nincs"}. ${t.id}: kamat ${t.kamat}, kockázat ${t.kockazat} – javasolt döntés: ${dec(t.kamat, t.kockazat)}.`;
  document.getElementById("row").innerHTML = "";
  const row = document.getElementById("row");
  [[t.id + " – " + t.leiras, true], ["Hely: " + t.hely], ["Kamat: " + t.kamat_txt + ` (szint: ${t.kamat})`], ["Kockázat: " + t.kockazat + " – " + t.kock_txt], ["Javasolt döntés: " + dec(t.kamat, t.kockazat), true]].forEach(([s, b]) => { const d = document.createElement("div"); d.textContent = s; if (b) d.style.fontWeight = "bold"; row.appendChild(d); });
}
function sync(){ document.getElementById("selname").textContent = TD[sel].id; document.getElementById("km").value = TD[sel].kamat; document.getElementById("kk").value = TD[sel].kockazat; }
document.getElementById("km").addEventListener("change", e => { TD[sel].kamat = +e.target.value; draw(); });
document.getElementById("kk").addEventListener("change", e => { TD[sel].kockazat = +e.target.value; draw(); });
document.getElementById("reset").addEventListener("click", () => { TD = JSON.parse(JSON.stringify(TD0)); sync(); draw(); });
["win", "thr"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
sync(); draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
