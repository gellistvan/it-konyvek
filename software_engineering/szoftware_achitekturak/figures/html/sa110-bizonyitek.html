<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizonyítéktérkép: Rendeléskezelő</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal a 2017-es monolit- és a 2019-es ajánlószolgáltatás-döntéssel; a köztük lévő oksági kapcsolat két szaggatott hipotézisnyíl, mellettük a szétválasztó bizonyítékok kártyái."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fiktív példa (29.1, Rendeléskezelő). Kiinduló állapot: minden bizonyíték „nem elérhető”, ezért a szétválasztás nem lehetséges. A bizonyosságok a „Bizonytalanság jelölése” szakasz szabálya szerint.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "msg": "1/4 – A két döntés és forrásaik: D-1 (2017, blogbejegyzés) és D-2 (2019, konferencia-előadás); mindkettő állítás, közepes bizonyossággal."}, {"n": 2, "msg": "2/4 – A források csak az időrendet igazolják: 2017-ben monolit indult, 2019-ben megjelent az ajánlószolgáltatás (folytonos nyíl)."}, {"n": 3, "msg": "3/4 – Az ok két versengő hipotézis (szaggatott ívek): H1 korrekciós válasz, H2 független üzleti/szervezeti igény – mindkettő elemzői következtetés, nem tény."}, {"n": 4, "msg": "4/4 – Nem dönthető el: mindkét hipotézis nyitva marad. Kattintson egy bizonyítékkártyára az elérhetőség váltásához."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const EV = [["kapacitásmérés / skálázási\nincidens a D-2 előtt", "H1"], ["ADR a monolit korlátjairól", "H1"], ["új csapat megalakulása", "H2"], ["üzleti igény személyre\nszabott ajánlásra", "H2"], ["commit-/deploy-történet,\ncsapatinterjú", "mindkettő"]], D1 = {"id": "D-1", "title": "D-1: monolitikus\nPHP (2017)", "year": 2017, "src": "Blogbejegyzés –\nállítás – közepes"}, D2 = {"id": "D-2", "title": "D-2: Python\najánlószolgáltatás,\naszinkron üzenetek\n(2019)", "year": 2019, "src": "Konferencia-előadás\n2019 – állítás – közepes"}, HY = ["H1: korrekciós válasz?", "H2: független üzleti/\nszervezeti igény?"];
let AV = [false, false, false, false, false], MIX = 0;   // MIX: a „mindkettő” forrás iránya 0=?, 1=H1, 2=H2
function verdictJS(){
  const h1 = AV[0] || AV[1] || (AV[4] && MIX === 1), h2 = AV[2] || AV[3] || (AV[4] && MIX === 2);
  if (h1 && !h2) return "Az okozati kapcsolat igazolt (H1)";
  if (h2 && !h1) return "Az okozati kapcsolat igazolt (H2)";
  if (h1 && h2) return "Mindkét hipotézisre van bizonyíték: a szétválasztás nem egyértelmű, mindkettő nyitva marad";
  return "Nem dönthető el: mindkét hipotézis nyitva marad";
}
function toggle(i){
  if (i === 4) { if (!AV[4]) { AV[4] = true; MIX = 1; } else if (MIX === 1) MIX = 2; else { AV[4] = false; MIX = 0; } }
  else AV[i] = !AV[i];
  show(k);
}
function tx(x, y, t, o){
  const lines = String(t).split("\n"), a = Object.assign({x: x, y: y, "font-size": 12}, o || {});
  const e = el("text", a);
  lines.forEach((l, j) => { const s = document.createElementNS(NS, "tspan"); s.setAttribute("x", x); s.setAttribute("dy", j ? "1.15em" : (-(lines.length - 1) * 0.575) + "em"); s.textContent = l; e.appendChild(s); });
  return e;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 450");
  const fg = css("--fg"), hl = css("--hl"), hl2 = css("--hl2");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker>`;
  svg.appendChild(defs);
  // idővonal
  el("line", {x1: 10, y1: 400, x2: 480, y2: 400, stroke: fg, "stroke-width": 1.2, "marker-end": "url(#ah)"});
  [[2017, 90], [2018, 242], [2019, 395]].forEach(([y, x]) => { el("line", {x1: x, y1: 393, x2: x, y2: 407, stroke: fg}); tx(x, 425, String(y), {"text-anchor": "middle"}); });
  // döntések
  const B = [[5, 230, 170, 70, D1], [295, 220, 195, 90, D2]];
  B.forEach(([x, y, w, h, d], i) => {
    el("rect", {x: x, y: y, width: w, height: h, rx: 7, fill: s.n === 1 ? css("--cellhl") : css("--cell"), stroke: fg, "stroke-width": 2});
    tx(x + w / 2, y + h / 2 + 4, d.title, {"text-anchor": "middle"});
    tx(x + w / 2, 345, d.src, {"text-anchor": "middle", "font-style": "italic", "font-size": 11});
    el("line", {x1: i ? 395 : 90, y1: 393, x2: i ? 395 : 90, y2: 365, stroke: fg, "stroke-dasharray": "1 3"});
  });
  if (s.n >= 2) {
    el("line", {x1: 175, y1: 265, x2: 293, y2: 265, stroke: s.n === 2 ? hl : fg, "stroke-width": s.n === 2 ? 3.5 : 2.2, "marker-end": "url(#ah)"});
    tx(234, 295, "időrend:\nforrás igazolja", {"text-anchor": "middle", "font-size": 11.5, fill: s.n === 2 ? hl : fg});
  }
  if (s.n >= 3) {
    [[150, HY[0]], [70, HY[1]]].forEach(([top, h], j) => {
      el("path", {d: `M 90 228 C 120 ${top - 20}, 360 ${top - 20}, 392 218`, fill: "none", stroke: s.n === 3 ? hl2 : fg, "stroke-width": 1.8, "stroke-dasharray": "7 5", "marker-end": "url(#ah)"});
      tx(240, top + 8, h + "\n(elemzői következtetés)", {"text-anchor": "middle", "font-size": 11.5, stroke: css("--bg"), "stroke-width": 5, "paint-order": "stroke"});
    });
    tx(240, 28, "Oksági kapcsolat: csak hipotézis", {"text-anchor": "middle", "font-weight": "bold"});
  }
  if (s.n >= 4) {
    tx(650, 28, "Szétválasztó bizonyítékok", {"text-anchor": "middle", "font-weight": "bold"});
    EV.forEach((e, i) => {
      const y = 45 + i * 62, on = AV[i];
      const g = document.createElementNS(NS, "g"); svg.appendChild(g);
      g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.style.cursor = "pointer";
      const dir = i === 4 ? (MIX === 1 ? "H1" : MIX === 2 ? "H2" : "H1 vagy H2") : e[1];
      g.setAttribute("aria-label", e[0].replace("\n", " ") + ": " + (on ? "elérhető, " + dir : "nem elérhető") + " (váltás: Enter)");
      g.onclick = () => toggle(i);
      g.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(i); } };
      const r = document.createElementNS(NS, "rect");
      [["x", 510], ["y", y], ["width", 285], ["height", 54], ["rx", 6], ["fill", on ? css("--cellhl") : css("--cell")], ["stroke", on ? hl : fg], ["stroke-width", on ? 2.6 : 1.3]].forEach(([a, v]) => r.setAttribute(a, v));
      if (!on) r.setAttribute("stroke-dasharray", "1.5 3");
      g.appendChild(r);
      const lines = e[0].split("\n");
      lines.forEach((l, j) => { const t = document.createElementNS(NS, "text"); t.setAttribute("x", 518); t.setAttribute("y", y + 22 + j * 15 - (lines.length - 1) * 4); t.setAttribute("font-size", 12); t.textContent = l; g.appendChild(t); });
      const t2 = document.createElementNS(NS, "text"); t2.setAttribute("x", 787); t2.setAttribute("y", y + 20); t2.setAttribute("text-anchor", "end"); t2.setAttribute("font-size", 12); t2.setAttribute("font-weight", "bold");
      t2.textContent = "→ " + (i === 4 && on ? dir : e[1]); g.appendChild(t2);
      const t3 = document.createElementNS(NS, "text"); t3.setAttribute("x", 787); t3.setAttribute("y", y + 42); t3.setAttribute("text-anchor", "end"); t3.setAttribute("font-size", 11.5); t3.setAttribute("font-style", "italic");
      t3.textContent = on ? "elérhető" : "nem elérhető"; g.appendChild(t3);
    });
    status.textContent = "4/4 – " + verdictJS() + ". (Kattintás/Enter egy kártyán: elérhetőség váltása; a commit-/interjú-forrás iránya: H1 → H2 → nem elérhető.)";
  }
  // jelmagyarázat
  [["", "igazolt kapcsolat (forrás)"], ["7 5", "hipotézis (következtetés)"], ["1.5 3", "hiányzó bizonyíték"]].forEach(([d, t], i) => {
    const y = 375 + i * 22;
    el("line", {x1: 520, y1: y, x2: 560, y2: y, stroke: fg, "stroke-width": 1.8, "stroke-dasharray": d});
    tx(568, y + 4, t, {"font-size": 11.5});
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
