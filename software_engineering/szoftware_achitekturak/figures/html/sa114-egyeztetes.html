<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Háromforrású egyeztetés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Nap: <input id="day" type="range" min="0" max="4" step="1" value="0" oninput="setDay(this.value)" aria-label="Nap (péntektől keddig)" style="width:160px"> <span id="dayv">péntek</span></label> <button id="dup" onclick="addDup()">Duplikált tétel beszúrása</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül a szekvencia: terhelés K1 kulccsal, elveszett válasz, idempotens újrapróbálás, főkönyvi tétel; alul az egyeztető tábla, amelyben a kategóriák a kiválasztott naptól függenek."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Fiktív azonosítók és összegek. L1: péntek, 150 000 Ft, A1 → S1 hétfő; L2: 80 000 Ft, A2 → S2 kedd; L3: 45 000 Ft a főkönyvben, 54 000 Ft a kivonatban. ◷ időzítési különbség, ! valódi eltérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "msg": "1. A fizetési szolgáltatás terhelést indít a PSP felé, Idempotency-Key: K1; a PSP feldolgozza (psp_authorization_id = A1)."}, {"n": 2, "msg": "2. A PSP válasza hálózati hiba miatt elveszik – a szolgáltatás nem tudja, sikerült-e a terhelés."}, {"n": 3, "msg": "3. Újrapróbálás ugyanazzal a K1 kulccsal: a PSP ugyanazt az A1 eredményt adja, nincs második terhelés."}, {"n": 4, "msg": "4. A főkönyv egyetlen tételt rögzít: L1, könyvelési dátum péntek, PSP-ref A1."}, {"n": 5, "msg": "5. A PSP elszámolási napja hétfő: megérkezik a kivonat (S1, 150 000 Ft)."}, {"n": 6, "msg": "6. Egyeztetés A1 alapján: főkönyv ↔ PSP ↔ kivonat; állítsa a Nap csúszkát vagy szúrjon be duplikált tételt."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DAYS = ["péntek", "szombat", "vasárnap", "hétfő", "kedd"], LEDGER0 = [{"id": "L1", "day": 0, "amt": 150000, "ref": "A1"}, {"id": "L2", "day": 0, "amt": 80000, "ref": "A2"}, {"id": "L3", "day": 0, "amt": 45000, "ref": "A3"}], PSP = {"A1": {"st": "settled", "sid": "S1"}, "A2": {"st": "settled", "sid": "S2"}, "A3": {"st": "settled", "sid": "S3"}}, STMT = {"S1": {"day": 3, "amt": 150000}, "S2": {"day": 4, "amt": 80000}, "S3": {"day": 3, "amt": 54000}};
let DAY = 0, LEDGER = LEDGER0.slice();
const fmtFt = a => String(a).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " Ft";
function reconcile(ledger, day){
  const out = [], seen = new Set();
  ledger.forEach(e => {
    if (seen.has(e.ref)) { out.push(["err", `valódi eltérés: duplikált (${e.ref}) – riasztás`]); return; }
    seen.add(e.ref);
    const s = STMT[PSP[e.ref].sid];
    if (s.day > day) out.push(["time", `időzítési különbség: ${DAYS[s.day]}${s.day === 4 ? "en" : "n"} várható`]);
    else if (s.amt !== e.amt) out.push(["err", "valódi eltérés: összeg – riasztás"]);
    else out.push(["ok", "egyező tétel"]);
  });
  return out;
}
function setDay(v){ DAY = +v; document.getElementById("day").value = DAY; document.getElementById("dayv").textContent = DAYS[DAY]; show(k); }
function addDup(){ if (!LEDGER.some(e => e.id === "L1b")) LEDGER = LEDGER.concat([{id: "L1b", day: 0, amt: 150000, ref: "A1"}]); else LEDGER = LEDGER0.slice(); document.getElementById("dup").textContent = LEDGER.length > LEDGER0.length ? "Duplikátum eltávolítása" : "Duplikált tétel beszúrása"; show(k); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 520");
  if (s.n === 5 && DAY < 3) { DAY = 3; document.getElementById("day").value = 3; document.getElementById("dayv").textContent = DAYS[3]; }
  const fg = css("--fg"), hl = css("--hl2"), mu = css("--muted");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${mu}" stroke-width="1.5"/></pattern>`;
  svg.appendChild(defs);
  const LX = [110, 410, 700];
  ["Fizetési szolgáltatás", "PSP", "Főkönyv"].forEach((n, i) => { el("rect", {x: LX[i] - 85, y: 8, width: 170, height: 28, fill: css("--cell"), stroke: fg}); el("text", {x: LX[i], y: 27, "text-anchor": "middle", "font-size": 13}, n); el("line", {x1: LX[i], y1: 36, x2: LX[i], y2: 250, stroke: mu, "stroke-dasharray": "4 3"}); });
  const M = (n, y, a, b, t, o) => { if (s.n < n) return; const c = s.n === n ? hl : fg; o = o || {};
    if (o.lost) { el("line", {x1: LX[a], y1: y, x2: (LX[a] + LX[b]) / 2, y2: y, stroke: c, "stroke-width": 1.8, "stroke-dasharray": "6 4"}); el("text", {x: (LX[a] + LX[b]) / 2, y: y + 7, "text-anchor": "middle", "font-size": 20, "font-weight": "bold", fill: c}, "✗"); }
    else el("line", {x1: LX[a], y1: y, x2: LX[b] + (b > a ? -3 : 3), y2: y, stroke: c, "stroke-width": 1.8, "stroke-dasharray": o.dash ? "6 4" : "", "marker-end": s.n === n ? "url(#ah2)" : "url(#ah)"});
    el("text", {x: o.tx || (LX[a] + LX[b]) / 2, y: y - 6, "text-anchor": "middle", "font-size": 12.5, fill: c}, t); };
  M(1, 70, 0, 1, "1. terhelés, Idempotency-Key: K1");
  if (s.n >= 1) el("text", {x: LX[1] + 8, y: 92, "font-size": 12, fill: s.n === 1 ? hl : fg}, "feldolgoz: A1");
  M(2, 120, 1, 0, "válasz elvész", {lost: true, tx: 300});
  M(3, 160, 0, 1, "2. újrapróbálás, K1");
  M(3, 190, 1, 0, "ugyanaz: A1 (nincs 2. terhelés)", {dash: true});
  M(4, 230, 0, 2, "3. főkönyvi tétel L1: péntek, PSP-ref A1", {tx: 470});
  // egyeztető tábla
  if (s.n < 4) return;
  const R = reconcile(LEDGER, DAY), cols = [[10, "Főkönyv"], [215, "PSP-állapot"], [380, "Kivonat"], [565, "Eredmény"]];
  el("text", {x: 10, y: 282, "font-size": 13, "font-weight": "bold"}, `Egyeztetés – nap: ${DAYS[DAY]}`);
  cols.forEach(([x, t]) => { el("rect", {x: x, y: 292, width: (x === 565 ? 225 : (x === 10 ? 205 : (x === 215 ? 165 : 185))), height: 26, fill: css("--cellhl"), stroke: fg}); el("text", {x: x + 6, y: 310, "font-size": 12.5, "font-weight": "bold"}, t); });
  const SYM = {ok: "✓", time: "◷", err: "!"};
  LEDGER.forEach((e, i) => {
    const y = 318 + i * 30, [cat, txt] = R[i], st = STMT[PSP[e.ref].sid], arrived = st.day <= DAY && s.n >= 5;
    const W = [205, 165, 185, 225];
    const cells = [`${e.id}, ${DAYS[e.day]}, ${fmtFt(e.amt)}`, `${e.ref}, settled, ${PSP[e.ref].sid}`, arrived ? `${PSP[e.ref].sid}, ${DAYS[st.day]}, ${fmtFt(st.amt)}` : "még nincs", s.n >= 6 || s.n === 5 ? `${SYM[cat]} ${txt}` : "…"];
    cols.forEach(([x], j) => {
      el("rect", {x: x, y: y, width: W[j], height: 30, fill: j === 3 && s.n >= 5 ? (cat === "err" ? "url(#hatch)" : (cat === "time" ? "url(#dots)" : css("--cell"))) : css("--cell"), stroke: fg, "stroke-width": cat === "err" && j === 3 ? 2.5 : 0.8});
      el("text", {x: x + 6, y: y + 20, "font-size": j === 3 ? 10.8 : 12.5, "font-weight": j === 3 && cat === "err" ? "bold" : "normal", stroke: j === 3 ? css("--bg") : "none", "stroke-width": 4, "paint-order": "stroke"}, cells[j]);
    });
  });
  const n = {ok: 0, time: 0, err: 0}; R.forEach(r => n[r[0]]++);
  if (s.n >= 5) status.textContent = s.msg + ` | Nap: ${DAYS[DAY]} – L1: ${R[0][1]}; összesen ${n.ok} egyező, ${n.time} időzítési különbség, ${n.err} valódi eltérés${n.err ? " (riasztás)" : ""}.`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
