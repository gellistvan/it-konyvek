<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utility tree – foglalási szolgáltatás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}button,select{font:inherit;padding:2px 8px}
#status{min-height:2.9em;margin:4px 0}svg{width:100%;height:auto;display:block}svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.leaf{cursor:pointer}.leaf:focus{outline:2px solid var(--hl)}.small{font-size:12px;color:var(--muted)}
#full{min-height:3em;border-left:4px solid var(--hl);padding:4px 8px}
</style></head><body>
<div class="ctl"><button id="flt" aria-pressed="false">Szűrő: csak (H,H)/(H,M)</button>
<button id="rst">Könyv címkéi</button><span class="small">Kattints egy levélre (vagy Tab + Enter) a teljes forgatókönyvért; a címkék alább átállíthatók.</span></div>
<div class="ctl" id="sel"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 900 420" role="img" aria-label="Utility tree: gyökér Utility, hat attribútum és kategória, levelek: S1 Teljesítmény / Keresési válaszidő (H,M); S2 Rendelkezésre állás / Foglalási tranzakció (H,H); S3 Konzisztencia / Kettős foglalás (H,H); S4 Biztonság / Hozzáférés-kezelés (M,L); S5 Módosíthatóság / Új fizetési mód (M,M); S6 Üzemeltethetőség / Naplózás (H,L)"></svg>
<div id="full" aria-live="polite"></div>
<p class="small">Adat: a 9.3.18 foglalási példájának „2. Utility tree (részlet)” táblázata. Fontosság × nehézség: H = magas, M = közepes, L = alacsony.</p>
<script>
const DATA=[{"id": "S1", "attr": "Teljesítmény", "cat": "Keresési válaszidő", "text": "Amikor a vendég szállást keres, a rendszer normál terhelés mellett legfeljebb 300 ms alatt visszaadja a találati listát.", "short": "keresés ≤ 300 ms (normál terhelés)", "imp": "H", "dif": "M"}, {"id": "S2", "attr": "Rendelkezésre állás", "cat": "Foglalási tranzakció", "text": "Amikor a vendég foglalást kezdeményez, a foglalási szolgáltatás 99,9%-os havi rendelkezésre állással elérhető; a leállás alatt a foglalás nem vész el.", "short": "foglalás: 99,9 % havi elérhetőség", "imp": "H", "dif": "H"}, {"id": "S3", "attr": "Konzisztencia", "cat": "Kettős foglalás", "text": "Ha egy szobát lefoglaltak, az 1 másodpercen belül ne jelenjen meg szabadként más felhasználó számára.", "short": "foglalt szoba 1 s-on belül nem szabad", "imp": "H", "dif": "H"}, {"id": "S4", "attr": "Biztonság", "cat": "Hozzáférés-kezelés", "text": "A vendéglátói felülethez csak a szállásadó férhet hozzá; a jogosulatlan hozzáférési kísérletek naplózódnak.", "short": "vendéglátói felület csak szállásadónak", "imp": "M", "dif": "L"}, {"id": "S5", "attr": "Módosíthatóság", "cat": "Új fizetési mód", "text": "Egy új fizetési szolgáltató integrációja legfeljebb 5 fejlesztői nap, és nem igényel módosítást a keresési szolgáltatásban.", "short": "új fizetési mód ≤ 5 fejlesztői nap", "imp": "M", "dif": "M"}, {"id": "S6", "attr": "Üzemeltethetőség", "cat": "Naplózás", "text": "Minden foglalási tranzakció naplózza a kérés azonosítóját, az eredményt és a válaszidőt; ezek alapján 5 percen belül megállapítható a hiba oka.", "short": "hiba oka 5 percen belül megállapítható", "imp": "H", "dif": "L"}];const ORIG=DATA.map(d=>[d.imp,d.dif]);let filt=false,open=-1;
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function E(tag,a,t,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(par||svg).appendChild(e);return e;}
function isFocus(d){return d.imp==="H"&&(d.dif==="H"||d.dif==="M");}
function draw(){svg.innerHTML="";const L=css("--line"),RH=62,top=20;
 const ym=top+RH*2.5+22;
 E("rect",{x:5,y:ym-20,width:80,height:40,fill:css("--cell"),stroke:L,"stroke-width":2});E("text",{x:45,y:ym+5,"text-anchor":"middle","font-weight":"bold"},"Utility");
 DATA.forEach((d,i)=>{const y=top+i*RH,yc=y+22;const dim=filt&&!isFocus(d);const op=dim?0.3:1;
  E("polyline",{points:`85,${ym} 95,${ym} 95,${yc} 105,${yc}`,fill:"none",stroke:L});
  E("rect",{x:105,y:y,width:150,height:44,fill:css("--cell"),stroke:L,opacity:op});E("text",{x:180,y:yc+5,"text-anchor":"middle","font-size":13,opacity:op},d.attr);
  E("line",{x1:255,y1:yc,x2:270,y2:yc,stroke:L});
  E("rect",{x:270,y:y,width:150,height:44,fill:css("--cell"),stroke:L,opacity:op});E("text",{x:345,y:yc+5,"text-anchor":"middle","font-size":13,opacity:op},d.cat);
  E("line",{x1:420,y1:yc,x2:435,y2:yc,stroke:L});
  const g=E("g",{class:"leaf",tabindex:0,role:"button","aria-label":d.id+" "+d.short+" ("+d.imp+","+d.dif+")",opacity:op});
  const hh=d.imp==="H"&&d.dif==="H",hm=d.imp==="H"&&d.dif==="M",hl=d.imp==="H"&&d.dif==="L";
  E("rect",{x:435,y:y,width:330,height:44,fill:(hh||hm)?css("--cellhl"):css("--cell"),stroke:L,"stroke-width":hh?2.5:(hm?3:1),"stroke-dasharray":hl?"6 4":""},undefined,g);
  if(hh)E("rect",{x:439,y:y+4,width:322,height:36,fill:"none",stroke:L,"stroke-width":2},undefined,g);
  E("text",{x:445,y:yc+5,"font-weight":"bold","font-size":13},d.id+" ("+d.imp+","+d.dif+")",g);
  E("text",{x:520,y:yc+5,"font-size":12},d.short.length>44?d.short.slice(0,43)+"…":d.short,g);
  if(hl)E("text",{x:760,y:y+14,"text-anchor":"end","font-size":11,"font-style":"italic"},"gyors nyereség",g);
  g.addEventListener("click",()=>{open=i;showFull();});g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open=i;showFull();}});
 });
 // rács
 const GX=772,GY=110,C=40,LV=["H","M","L"],DF=["L","M","H"];
 E("text",{x:GX+C*1.5,y:GY-30,"text-anchor":"middle","font-size":12},"fontosság ×");E("text",{x:GX+C*1.5,y:GY-15,"text-anchor":"middle","font-size":12},"nehézség");
 LV.forEach((im,i)=>{E("text",{x:GX-6,y:GY+i*C+C/2+4,"text-anchor":"end","font-size":12},im);
  DF.forEach((df,j)=>{const foc=im==="H"&&(df==="H"||df==="M");E("rect",{x:GX+j*C,y:GY+i*C,width:C,height:C,fill:foc?css("--cellhl"):css("--cell"),stroke:L,"stroke-width":foc?2:1});
   const ids=DATA.filter(d=>d.imp===im&&d.dif===df).map(d=>d.id);ids.forEach((id,k)=>E("text",{x:GX+j*C+C/2,y:GY+i*C+C/2+4+(k-(ids.length-1)/2)*13,"text-anchor":"middle","font-size":11,"font-weight":"bold"},id));});});
 DF.forEach((df,j)=>E("text",{x:GX+j*C+C/2,y:GY+3*C+14,"text-anchor":"middle","font-size":12},df));
 const f=DATA.filter(isFocus).map(d=>d.id);
 document.getElementById("status").textContent=(filt?"Szűrő bekapcsolva: ":"")+"A későbbi elemzés fókuszát a (H, H) és (H, M) párok adják – most: "+(f.length?f.join(", "):"nincs ilyen levél")+".";
}
function showFull(){const d=DATA[open];document.getElementById("full").textContent=open<0?"":d.id+" – "+d.attr+" / "+d.cat+" ("+d.imp+","+d.dif+"): "+d.text;}
const sel=document.getElementById("sel");
DATA.forEach((d,i)=>{const s=document.createElement("label");s.textContent=d.id+": ";
 ["imp","dif"].forEach(key=>{const q=document.createElement("select");q.setAttribute("aria-label",d.id+(key==="imp"?" fontosság":" nehézség"));
  ["H","M","L"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;q.appendChild(o);});q.value=d[key];q.id=key+i;
  q.onchange=()=>{d[key]=q.value;draw();if(open===i)showFull();};s.appendChild(q);});sel.appendChild(s);});
document.getElementById("flt").onclick=e=>{filt=!filt;e.target.setAttribute("aria-pressed",String(filt));draw();};
document.getElementById("rst").onclick=()=>{DATA.forEach((d,i)=>{d.imp=ORIG[i][0];d.dif=ORIG[i][1];document.getElementById("imp"+i).value=d.imp;document.getElementById("dif"+i).value=d.dif;});draw();showFull();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
