<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borítékoló titkosítás: titkosítás, visszafejtés, KEK- és DEK-rotáció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span class="small">Forgatókönyv:</span><button onclick="pick('A')">Titkosítás</button><button onclick="pick('B')">Visszafejtés</button><button onclick="pick('C')">KEK-rotáció</button><button onclick="pick('D')">DEK-rotáció</button></div>
<div id="status" aria-live="polite"></div>

  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szimbolikus modell (C1/N1/T1: első ciphertext, nonce, tag; enc(DEK1)_v1: DEK1 a KEK v1-gyel burkolva); az AWS KMS műveletneveit követi, szemléltetés, nem futtatott kód.</p>

ain": true}, {"f": "A", "t": "S", "lab": "4 írás: rekord", "plain": false}, {"f": "A", "t": "A", "lab": "5 DEK1 nullázása", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}];

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";

sszafejtés", "plain": true}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(B) Visszafejtés – 5) A plaintext DEK1 nullázása. A rekord nem változott.", "sc": "B", "i": 4, "msgs": [{"f": "S", "t": "A", "lab": "1 rekord olvasása", "plain": false}, {"f": "A", "t": "K", "lab": "2 Decrypt(enc(DEK1)_v1)", "plain": false}, {"f": "K", "t": "A", "lab": "3 DEK1 (plaintext)", "plain": true}, {"f": "A", "t": "A", "lab": "4 AES-GCM visszafejtés", "plain": true}, {"f": "A", "t": "A", "lab": "5 DEK1 nullázása", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}], "C": [{"msg": "(C) KEK-rotáció (v1 → v2) – 1) A KMS új KEK-verziót (v2) hoz létre; a v1 visszafejtésre megmarad.", "sc": "C", "i": 0, "msgs": [{"f": "K", "t": "K", "lab": "1 új KEK-verzió: v2", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(C) KEK-rotáció (v1 → v2) – 2) ReEncrypt(enc(DEK1)_v1 → KEK v2): a DEK1 csak a KMS-en belül létezik nyersen.", "sc": "C", "i": 1, "msgs": [{"f": "K", "t": "K", "lab": "1 új KEK-verzió: v2", "plain": false}, {"f": "A", "t": "K", "lab": "2 ReEncrypt(enc(DEK1)_v1)", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(C) KEK-rotáció (v1 → v2) – 3) Válasz: enc(DEK1)_v2 – plaintext kulcs nem hagyja el a KMS-t.", "sc": "C", "i": 2, "msgs": [{"f": "K", "t": "K", "lab": "1 új KEK-verzió: v2", "plain": false}, {"f": "A", "t": "K", "lab": "2 ReEncrypt(enc(DEK1)_v1)", "plain": false}, {"f": "K", "t": "A", "lab": "3 enc(DEK1)_v2", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v1", "kek_version": "1", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(C) KEK-rotáció (v1 → v2) – 4) ReEncrypt: enc(DEK1)_v1 → enc(DEK1)_v2, kek_version 1 → 2; ciphertext, tag és nonce változatlan (nincs adatátírás).", "sc": "C", "i": 3, "msgs": [{"f": "K", "t": "K", "lab": "1 új KEK-verzió: v2", "plain": false}, {"f": "A", "t": "K", "lab": "2 ReEncrypt(enc(DEK1)_v1)", "plain": false}, {"f": "K", "t": "A", "lab": "3 enc(DEK1)_v2", "plain": false}, {"f": "A", "t": "S", "lab": "4 frissítés: 2 mező", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": ["enc(DEK)", "kek_version"], "line": -1}], "D": [{"msg": "(D) DEK-rotáció – 1) A régi adatkulcs visszafejtése: Decrypt(enc(DEK1)_v2).", "sc": "D", "i": 0, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(D) DEK-rotáció – 2) Válasz: plaintext DEK1; az alkalmazás visszafejti az adatot (AES-GCM, nonce N1).", "sc": "D", "i": 1, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}, {"f": "K", "t": "A", "lab": "2 DEK1 (plaintext)", "plain": true}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(D) DEK-rotáció – 3) Új adatkulcs kérése: GenerateDataKey(demopay-kek, r-001).", "sc": "D", "i": 2, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}, {"f": "K", "t": "A", "lab": "2 DEK1 (plaintext)", "plain": true}, {"f": "A", "t": "K", "lab": "3 GenerateDataKey", "plain": false}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(D) DEK-rotáció – 4) Válasz: plaintext DEK2 és enc(DEK2)_v2.", "sc": "D", "i": 3, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}, {"f": "K", "t": "A", "lab": "2 DEK1 (plaintext)", "plain": true}, {"f": "A", "t": "K", "lab": "3 GenerateDataKey", "plain": false}, {"f": "K", "t": "A", "lab": "4 DEK2 + enc(DEK2)_v2", "plain": true}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(D) DEK-rotáció – 5) Új nonce (N2), újratitkosítás AES-256-GCM-mel a DEK2-vel.", "sc": "D", "i": 4, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}, {"f": "K", "t": "A", "lab": "2 DEK1 (plaintext)", "plain": true}, {"f": "A", "t": "K", "lab": "3 GenerateDataKey", "plain": false}, {"f": "K", "t": "A", "lab": "4 DEK2 + enc(DEK2)_v2", "plain": true}, {"f": "A", "t": "A", "lab": "5 új nonce; AES-256-GCM", "plain": true}], "rec": {"ciphertext": "C1", "tag": "T1", "nonce": "N1", "enc(DEK)": "enc(DEK1)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": [], "line": -1}, {"msg": "(D) DEK-rotáció – 6) Írás: új ciphertext, tag, nonce és enc(DEK2)_v2 – teljes adatátírás; a DEK1 és a DEK2 puffer nullázása.", "sc": "D", "i": 5, "msgs": [{"f": "A", "t": "K", "lab": "1 Decrypt(enc(DEK1)_v2)", "plain": false}, {"f": "K", "t": "A", "lab": "2 DEK1 (plaintext)", "plain": true}, {"f": "A", "t": "K", "lab": "3 GenerateDataKey", "plain": false}, {"f": "K", "t": "A", "lab": "4 DEK2 + enc(DEK2)_v2", "plain": true}, {"f": "A", "t": "A", "lab": "5 új nonce; AES-256-GCM", "plain": true}, {"f": "A", "t": "S", "lab": "6 teljes adatátírás", "plain": false}], "rec": {"ciphertext": "C2", "tag": "T2", "nonce": "N2", "enc(DEK)": "enc(DEK2)_v2", "kek_version": "2", "alg": "AES-256-GCM"}, "ch": ["ciphertext", "tag", "nonce", "enc(DEK)"], "line": -1}]}, FLD = ["ciphertext", "tag", "nonce", "enc(DEK)", "kek_version", "alg"], LX = {A: 110, K: 330, S: 560}, LT = {A: "Alkalmazás", K: "KMS (K     const y = 66 + i * 38, cur = i === s.msgs.length - 1, col = cur ? css("--hl2") : css("--fg");
    const resp = (m.f === "K" && m.t === "A") || m.f === "S";
    if (m.f === m.t) {
      const x = LX[m.f];
      el("path", {d: `M ${x} ${y} C ${x + 40} ${y}, ${x + 40} ${y + 22}, ${x + 4} ${y + 22}`, fill: "none", stroke: col, "stroke-width": cur ? 2.6 : 1.4, "marker-end": cur ? "url(#ahh)" : "url(#ah)"});
      const t = el("text", {x: x + 46, y: y + 15, "font-size": 13, "font-weight": cur ? "bold" : "normal"}, m.lab);
      if (m.plain) el("rect", {x: x + 42, y: y, width: m.lab.length * 7.2 + 8, height: 21, fill: "none", stroke: col, "stroke-dasharray": "1.5 2.5"});
    } else {
      const x0 = LX[m.f], x1 = LX[m.t];
      el("line", {x1: x0, y1: y + 18, x2: x1 + (x1 > x0 ? -2 : 2), y2: y + 18, stroke: col, "stroke-width": cur ? 2.6 : 1.4, "stroke-dasharray": resp ? "7 4" : "", "marker-end": cur ? "url(#ahh)" : "url(#ah)"});
      const mx = (x0 + x1) / 2, w = m.lab.length * 7.2 + 8;
      el("rect", {x: mx - w / 2, y: y - 2, width: w, height: 17, fill: css("--bg"), stroke: m.plain ? col : "none", "stroke-dasharray": "1.5 2.5"});
      el("text", {x: mx, y: y + 11, "text-anchor": "middle", "font-size": 13, "font-weight": cur ? "bold" : "normal"}, m.lab);
    }
  });
  // rekord mezőtábla
  const y0 = 330, cw = 680 / 6;
  el("text", {x: 4, y: y0 - 8, "font-size": 13}, s.rec ? "Adattár-rekord (sraffozott: ebben a lépésben változott)" : "Adattár-rekord: még nincs írva");
  FLD.forEach((f, j) => {
    el("rect", {x: j * cw, y: y0, width: cw, height: 26, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: j * cw + cw / 2, y: y0 + 18, "text-anchor": "middle", "font-size": 12.5}, f);
    const ch = s.ch.includes(f);
    el("rect", {x: j * cw, y: y0 + 26, width: cw, height: 34, fill: ch ? "url(#hz)" : css("--cell"), stroke: ch ? css("--hl2") : css("--line"), "stroke-width": ch ? 2.4 : 1});
    if (s.rec) {
      el("rect", {x: j * cw + 6, y: y0 + 33, width: cw - 12, height: 20, fill: css("--cell"), stroke: "none"});
      el("text", {x: j * cw + cw / 2, y: y0 + 48, "text-anchor": "middle", "font-size": 13}, s.rec[f]);
    }
  });
  if (s.sc === "D" && s.ch.includes("ciphertext")) el("rect", {x: 2, y: y0 - 2, width: 676, height: 64, fill: "none", stroke: css("--fg"), "stroke-width": 3, "stroke-dasharray": "9 5"});
  el("text", {x: 4, y: 425, "font-size": 12, fill: css("--muted")}, "pontozott keret: plaintext kulcsanyag · szaggatott nyíl: válasz · narancs: aktuális lépés");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
