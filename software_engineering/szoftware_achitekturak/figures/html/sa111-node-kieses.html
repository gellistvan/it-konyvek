<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Node-kiesés idővonala</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>tolerationSeconds: <input id="tl" type="range" min="0" max="300" step="10" value="300" oninput="recalc()" aria-label="tolerationSeconds (s)" style="width:150px"> <span id="tlv">300</span> s</label> <label>grace period: <input id="gr" type="range" min="20" max="60" step="5" value="40" oninput="recalc()" aria-label="node-monitor-grace-period (s)" style="width:110px"> <span id="grv">40</span> s</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat sávos idővonal a node kiesésétől az új Pod Ready állapotáig és az Endpoints frissüléséig; alapértelmezett toleranciával az új Ready Pod az 5 perces határ után jelenik meg."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Elméleti modell, nem mérés: Deployment, 2 replika, hálózati tároló; Pod létrehozása 1 s, ütemezés 1 s, image + indítás 20 s, readiness 10 s, Endpoints 2 s (feltevések). A grace period és a tolerancia verzió- és konfigurációfüggő.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "lane": 0, "line": 0, "g": 40, "tol": 300, "msg": "t = 0 s – kubelet/node: a node kiesik, a heartbeat megszűnik. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 40, "lane": 1, "line": 1, "g": 40, "tol": 300, "msg": "t = 40 s – node lifecycle controller: a grace period (40 s) után NotReady/Unknown + unreachable taint. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 340, "lane": 1, "line": 2, "g": 40, "tol": 300, "msg": "t = 340 s – a tolerancia (300 s) lejárt: a Pod evikciója. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 341, "lane": 2, "line": 3, "g": 40, "tol": 300, "msg": "t = 341 s – ReplicaSet: kívánt 2, rendelkezésre álló 1 → új Pod (Pending). | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 342, "lane": 3, "line": 4, "g": 40, "tol": 300, "msg": "t = 342 s – scheduler: az új Pod másik node-ra kötve. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 372, "lane": 4, "line": 5, "g": 40, "tol": 300, "msg": "t = 372 s – új node kubelete: image + indítás + readiness → Ready. Céljel 1: ✗. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}, {"t": 374, "lane": 5, "line": 6, "g": 40, "tol": 300, "msg": "t = 374 s – Endpoints frissül, a forgalom helyreáll. Céljel 2: ✓. | céljel 1 (Ready ≤ 300 s): ✗ 372 s; céljel 2 (forgalom ≤ 600 s): ✓ 374 s"}];
const CODE = ["t = 0: a node kiesik, a heartbeat megszűnik", "t = grace: node lifecycle controller → NotReady/Unknown + unreachable taint", "t = grace + tolerationSeconds: a Pod evikciója", "ReplicaSet: kívánt 2, rendelkezésre álló 1 → új Pod (Pending)", "scheduler: az új Podot másik node-ra köti", "új node kubelete: image, konténerindítás, readiness probe → Ready (céljel 1)", "Endpoints frissül → a forgalom helyreáll (céljel 2)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DUR = {"create": 1, "sched": 1, "start": 20, "ready": 10, "ep": 2}, L1 = 300, L2 = 600, LANES = ["kubelet\n(kiesett node)", "node lifecycle\ncontroller", "ReplicaSet-\nvezérlő", "scheduler", "új node\nkubelete", "Service /\nEndpoints"];
function model(g, tol){
  const m = {grace: g, tol: tol, taint: g, evict: g + tol};
  m.new = m.evict + DUR.create; m.bind = m.new + DUR.sched; m.started = m.bind + DUR.start;
  m.ready = m.started + DUR.ready; m.ep = m.ready + DUR.ep; m.ok1 = m.ready <= L1; m.ok2 = m.ep <= L2; return m;
}
function buildSteps(){
  const g = +document.getElementById("gr").value, tol = +document.getElementById("tl").value;
  document.getElementById("grv").textContent = g; document.getElementById("tlv").textContent = tol;
  const m = model(g, tol), c1 = m.ok1 ? "✓" : "✗", c2 = m.ok2 ? "✓" : "✗";
  const tail = ` | céljel 1 (Ready ≤ 300 s): ${c1} ${m.ready} s; céljel 2 (forgalom ≤ 600 s): ${c2} ${m.ep} s`;
  return [
    {t: 0, lane: 0, line: 0, g: g, tol: tol, msg: "t = 0 s – kubelet/node: a node kiesik, a heartbeat megszűnik." + tail},
    {t: m.taint, lane: 1, line: 1, g: g, tol: tol, msg: `t = ${m.taint} s – node lifecycle controller: a grace period (${g} s) után NotReady/Unknown + unreachable taint.` + tail},
    {t: m.evict, lane: 1, line: 2, g: g, tol: tol, msg: `t = ${m.evict} s – a tolerancia (${tol} s) lejárt: a Pod evikciója.` + tail},
    {t: m.new, lane: 2, line: 3, g: g, tol: tol, msg: `t = ${m.new} s – ReplicaSet: kívánt 2, rendelkezésre álló 1 → új Pod (Pending).` + tail},
    {t: m.bind, lane: 3, line: 4, g: g, tol: tol, msg: `t = ${m.bind} s – scheduler: az új Pod másik node-ra kötve.` + tail},
    {t: m.ready, lane: 4, line: 5, g: g, tol: tol, msg: `t = ${m.ready} s – új node kubelete: image + indítás + readiness → Ready. Céljel 1: ${c1}.` + tail},
    {t: m.ep, lane: 5, line: 6, g: g, tol: tol, msg: `t = ${m.ep} s – Endpoints frissül, a forgalom helyreáll. Céljel 2: ${c2}.` + tail},
  ];
}
function recalc(){ setSteps(buildSteps()); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 330");
  const m = model(s.g, s.tol), fg = css("--fg"), hl = css("--hl"), hl2 = css("--hl2"), mu = css("--muted");
  const X = t => 130 + t / 640 * 660, LY = i => 28 + i * 44;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/></pattern><pattern id="dp" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern>`;
  svg.appendChild(defs);
  LANES.forEach((l, i) => {
    if (i === s.lane) el("rect", {x: 0, y: LY(i) - 20, width: 800, height: 40, fill: css("--cellhl")});
    l.split("\n").forEach((p, j, a) => el("text", {x: 122, y: LY(i) + 4 + (j - (a.length - 1) / 2) * 13, "text-anchor": "end", "font-size": 11.5, "font-weight": i === s.lane ? "bold" : "normal"}, p));
    el("line", {x1: 130, y1: LY(i), x2: 790, y2: LY(i), stroke: mu, "stroke-width": 0.4});
  });
  for (let t = 0; t <= 600; t += 60) el("text", {x: X(t), y: 300, "text-anchor": "middle", "font-size": 10.5}, String(t));
  el("text", {x: 460, y: 322, "text-anchor": "middle", "font-size": 11.5}, "idő a node kiesése óta (s) – elméleti modell, nem mérés");
  [[L1, "5 perc"], [L2, "10 perc"]].forEach(([x, t]) => { el("line", {x1: X(x), y1: 6, x2: X(x), y2: 286, stroke: fg, "stroke-dasharray": "6 4"}); el("text", {x: X(x) - 4, y: 14, "text-anchor": "end", "font-size": 11}, t); });
  const shown = k;  // a lépésindex: csak az eddigi események látszanak
  const R = (i, a, b, fill) => el("rect", {x: X(a), y: LY(i) - 9, width: Math.max(1, X(b) - X(a)), height: 18, fill: fill, stroke: fg, "stroke-width": 0.8});
  R(0, 0, m.grace, "#555");
  el("text", {x: X(0) + 2, y: LY(0) - 12, "font-size": 11, "font-weight": "bold"}, "✗ kiesés");
  if (shown >= 1) { R(1, 0, m.grace, "url(#hp)"); el("text", {x: X(m.grace), y: LY(1) - 12, "font-size": 10.5, "text-anchor": "middle"}, "taint"); }
  if (shown >= 2) { R(1, m.grace, m.evict, "url(#dp)"); el("text", {x: X(m.evict) + 4, y: LY(1) + 4, "font-size": 11}, "evikció"); }
  const mk = (i, t, txt) => { el("circle", {cx: X(t), cy: LY(i), r: 5, fill: fg}); el("text", {x: X(t) + 8, y: LY(i) + 4, "font-size": 11}, txt); };
  if (shown >= 3) mk(2, m.new, "új Pod (Pending)");
  if (shown >= 4) mk(3, m.bind, "kötés másik node-ra");
  if (shown >= 5) { R(4, m.bind, m.started, css("--cellhl")); R(4, m.started, m.ready, "url(#hp)"); el("text", {x: X(m.ready) + 6, y: LY(4) + 4, "font-size": 11, "font-weight": "bold", fill: m.ok1 ? hl : hl2}, `Ready ${m.ready} s ${m.ok1 ? "✓" : "✗"}`); }
  if (shown >= 6) { el("rect", {x: X(m.ep) - 5, y: LY(5) - 5, width: 10, height: 10, fill: fg}); el("text", {x: X(m.ep) + 8, y: LY(5) + 4, "font-size": 11, "font-weight": "bold", fill: m.ok2 ? hl : hl2}, `forgalom ${m.ep} s ${m.ok2 ? "✓" : "✗"}`); }
  el("line", {x1: X(s.t), y1: 6, x2: X(s.t), y2: 286, stroke: hl2, "stroke-width": 2});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
