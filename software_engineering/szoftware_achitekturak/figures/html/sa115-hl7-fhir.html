<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL7 v2 → FHIR leképezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Keresőparaméter: <select id="sp" onchange="pick(this.value)" aria-label="Keresőparaméter"><option value="-1">– válasszon –</option><option value="0">code=…|85354-9</option><option value="1">code=…|8480-6</option><option value="2">component-code=…|8480-6</option><option value="3">combo-code=…|8480-6</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két OBX szegmens az interfész motor lépésein át egy 85354-9 kódú Observation két komponensévé válik; a 8480-6 kódra a code paraméter üres, a component-code találatot ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szintetikus adatok; HL7 v2.5, FHIR R4. A code paraméter az Observation.code, a component-code a component.code, a combo-code mindkét mezőt vizsgálja; a támogatott paramétereket a szerver CapabilityStatement-je sorolja fel.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "src": [0], "dst": [0], "msg": "1. beolvasás: MLLP-üzenet, MSH-10: MSG0001 – az üzenet fogadása, az MSH-10 üzenetazonosító rögzítése."}, {"i": 1, "src": [0, 1, 2, 3, 4], "dst": [], "msg": "2. érvényesítés: szegmensek, kötelező mezők – az ORU^R01 szerkezete és a kötelező mezők ellenőrzése."}, {"i": 2, "src": [1, 3, 4], "dst": [1, 3, 4], "msg": "3. leképezés: OBX → comp., PID → subject – a két OBX egy panel két komponense lesz, az EXT-778 a Patient/123-ra képeződik."}, {"i": 3, "src": [2, 3, 4], "dst": [2, 3, 4], "msg": "4. terminológiai normalizálás: SYS^L → loinc| 8480-6 – helyi kódok → LOINC: BP^L → 85354-9, SYS^L → 8480-6, DIA^L → 8462-4."}, {"i": 4, "src": [], "dst": [0, 1, 2, 3, 4], "msg": "5. célformátum: FHIR R4 Observation – a vitálisjel-profilnak megfelelő Observation (bp) előállítása."}, {"i": 5, "src": [0], "dst": [], "msg": "6. audit: duplikátum- szűrés, napló – ismételt kézbesítéskor (azonos MSG0001) nem keletkezik duplikátum."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const HL7 = ["MSH|…|ORU^R01|MSG0001", "PID|||EXT-778^^^KULSOLAB", "OBR|1||…|BP^Vérnyomás^L", "OBX|1|NM|SYS^Szisztolés^L||128|mm[Hg]", "OBX|2|NM|DIA^Diasztolés^L||82|mm[Hg]"], FH = ["Observation (bp profil)", "subject: Patient/123", "code: 85354-9 (panel)", "component 8480-6: 128", "component 8462-4: 82"], PIPE = [["beolvasás", "MLLP-üzenet,\nMSH-10:\nMSG0001", [0], [0]], ["érvényesítés", "szegmensek,\nkötelező\nmezők", [0, 1, 2, 3, 4], []], ["leképezés", "OBX → comp.,\nPID →\nsubject", [1, 3, 4], [1, 3, 4]], ["terminológiai\nnormalizálás", "SYS^L →\nloinc|\n8480-6", [2, 3, 4], [2, 3, 4]], ["célformátum", "FHIR R4\nObservation", [], [0, 1, 2, 3, 4]], ["audit", "duplikátum-\nszűrés,\nnapló", [0], []]], MAPS = [[1, 1, "EXT-778 → Patient/123", false], [2, 2, "BP^L → 85354-9", true], [3, 3, "SYS^L → 8480-6", true], [4, 4, "DIA^L → 8462-4", true]], SE = [["code", "85354-9", "Observation.code"], ["code", "8480-6", "csak Observation.code"], ["component-code", "8480-6", "component.code"], ["combo-code", "8480-6", "code vagy component.code"]], OBS = {"code": "85354-9", "subject": "Patient/123", "component": [{"code": "8480-6", "value": 128, "unit": "mm[Hg]"}, {"code": "8462-4", "value": 82, "unit": "mm[Hg]"}]};
let SEL = -1, LASTI = 0, PICKING = false;
function searchJS(p, c){ const top = OBS.code === c, comp = OBS.component.some(x => x.code === c); return p === "code" ? top : (p === "component-code" ? comp : top || comp); }
function pick(v){ SEL = +v; PICKING = true; show(k); }
function render(s){
  if (s.i !== LASTI) { LASTI = s.i; if (SEL >= 0 && !PICKING) { SEL = -1; document.getElementById('sp').value = -1; } }
  PICKING = false;
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 800 436");
  const fg = css("--fg"), hl = css("--hl2"), mu = css("--muted");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`;
  svg.appendChild(defs);
  const LY = [40, 64, 88, 112, 136], XR = 505;
  el("text", {x: 6, y: 18, "font-size": 13, "font-weight": "bold"}, "HL7 v2.5 ORU^R01");
  el("text", {x: XR, y: 18, "font-size": 13, "font-weight": "bold"}, "FHIR R4 Observation");
  // keresésnél vizsgált mezők
  let fields = [];
  if (SEL >= 0) { const p = SE[SEL][0]; fields = p === "code" ? [2] : (p === "component-code" ? [3, 4] : [2, 3, 4]); }
  HL7.forEach((t, i) => { const on = s.src.includes(i) && SEL < 0; if (on) el("rect", {x: 2, y: LY[i] - 15, width: 300, height: 21, fill: css("--cellhl")}); el("text", {x: 6, y: LY[i], "font-size": 12, "font-family": "monospace", "font-weight": on ? "bold" : "normal"}, t.replace("Szisztolés", "Sziszt.").replace("Diasztolés", "Diaszt.")); });
  FH.forEach((t, i) => { const on = (s.dst.includes(i) && SEL < 0) || fields.includes(i); if (on) el("rect", {x: XR - 4, y: LY[i] - 15, width: 295, height: 21, fill: css("--cellhl"), stroke: fields.includes(i) ? hl : "none", "stroke-width": 2}); el("text", {x: XR, y: LY[i], "font-size": 12, "font-family": "monospace", "font-weight": on ? "bold" : "normal"}, t); });
  MAPS.forEach(([a, b, t, term]) => {
    const act = SEL < 0 && ((s.i === 2 && !term) || (s.i === 3 && term) || (s.i === 2 && term && a >= 3));
    const x0 = 310, x1 = XR - 8;
    el("line", {x1: x0, y1: LY[a] - 4, x2: x1, y2: LY[b] - 4, stroke: act ? hl : fg, "stroke-width": term ? 4 : 1.5, "marker-end": act ? "url(#ah2)" : "url(#ah)", opacity: act || SEL >= 0 ? 1 : 0.55});
    if (term) el("line", {x1: x0, y1: LY[a] - 4, x2: x1 - 6, y2: LY[b] - 4, stroke: css("--bg"), "stroke-width": 1.6});
    el("text", {x: (x0 + x1) / 2, y: (LY[a] + LY[b]) / 2 - 8, "text-anchor": "middle", "font-size": 11, stroke: css("--bg"), "stroke-width": 4, "paint-order": "stroke", fill: act ? hl : fg}, t);
  });
  // pipeline
  el("text", {x: 6, y: 176, "font-size": 13, "font-weight": "bold"}, "Interfész motor (pipeline)");
  PIPE.forEach(([t, op], i) => {
    const x = 6 + i * 132, on = i === s.i && SEL < 0;
    el("rect", {x: x, y: 186, width: 120, height: 86, rx: 7, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : fg, "stroke-width": on ? 3 : 1.2});
    t.split("\n").forEach((l, j) => el("text", {x: x + 60, y: 204 + j * 14, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, l));
    op.split("\n").forEach((l, j) => el("text", {x: x + 60, y: 236 + j * 14, "text-anchor": "middle", "font-size": 11, "font-style": "italic"}, l));
    if (i < 5) el("line", {x1: x + 120, y1: 225, x2: x + 131, y2: 225, stroke: fg, "marker-end": "url(#ah)"});
  });
  // keresési sáv
  el("text", {x: 6, y: 298, "font-size": 13, "font-weight": "bold"}, "Keresés: GET /Observation?patient=123&…");
  SE.forEach(([p, c, f], i) => {
    const y = 308 + i * 30, ok = searchJS(p, c), on = i === SEL;
    el("rect", {x: 4, y: y, width: 792, height: 26, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : mu, "stroke-width": on ? 2.5 : 0.8});
    el("text", {x: 10, y: y + 18, "font-size": 12.5, "font-family": "monospace", "font-weight": "bold"}, `${ok ? "✓" : "✗"} ${p}=…|${c}`);
    el("text", {x: 330, y: y + 18, "font-size": 12}, `${ok ? "találat" : "üres"} (${f})`);
  });
  if (SEL >= 0) { const [p, c, f] = SE[SEL], ok = searchJS(p, c); status.textContent = `${p}=http://loinc.org|${c}: a szerver által vizsgált mező: ${f} → ${ok ? "találat (a 85354-9 panel)" : "üres találat – a 8480-6 csak komponensként szerepel"}. (Lépés gombra a pipeline-nézet tér vissza.)`; }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
