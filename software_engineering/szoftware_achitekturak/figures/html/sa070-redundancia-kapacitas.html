<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redundancia és kapacitástartalék</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A_p: <input id="ap" type="range" min="0.9" max="0.9999" step="0.0001" value="0.99" oninput="recalc()" style="width:100px" aria-label="A_p:"> <span id="apv">0.99</span></label> <label>n: <input id="n" type="range" min="1" max="5" step="1" value="2" oninput="recalc()" style="width:70px" aria-label="n:"> <span id="nv">2</span></label> <label>A_shared: <input id="as" type="range" min="0.99" max="0.99999" step="1e-05" value="0.999" oninput="recalc()" style="width:100px" aria-label="A_shared:"> <span id="asv">0.999</span></label> <label>terhelés/példány (%): <input id="u" type="range" min="10" max="100" step="5" value="60" oninput="recalc()" style="width:100px" aria-label="terhelés/példány (%):"> <span id="uv">60</span></label> <button onclick="failNow()">Példány kiesése</button> <button onclick="show(0)">Visszaállítás</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Balra párhuzamos alkalmazáspéldányok és egy soros, nem redundáns adatbázis a teljes rendelkezésre állással; jobbra a példányok terhelése, kiesés után a túlélők terhelése, 100% fölött sraffozva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A_total = A_shared · (1 − (1 − A_p)^n); kiesés után a túlélők terhelése n·u/(n−1). Feltételek: független hibák; a képlet csak azt nézi, él-e legalább egy példány, a kapacitást nem. Elméleti modell, nem mérés. 1. lépés: normál üzem, 2. lépés: egy példány kiesett.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"fail": 0, "msg": ""}, {"fail": 1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function g(id){ return +document.getElementById(id).value; }
function hu(x, d){ return x.toFixed(d).replace(".", ","); }
function ft(x, d){ let t = x.toFixed(d === undefined ? 6 : d); if (t.indexOf(".") >= 0) t = t.replace(/0+$/, "").replace(/\.$/, ""); return t.replace(".", ","); }
function recalc(){ ["ap","n","as","u"].forEach(id => document.getElementById(id+"v").textContent = String(g(id)).replace(".", ",")); show(k); }
function failNow(){ show(1); }
function render(s){
  const ap = g("ap"), n = g("n"), as = g("as"), u = g("u") / 100;
  ["ap","n","as","u"].forEach(id => document.getElementById(id+"v").textContent = String(g(id)).replace(".", ","));
  const par = 1 - Math.pow(1 - ap, n), tot = as * par;
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.4"/></pattern>`;
  svg.appendChild(defs);
  // blokkdiagram
  const bh = Math.min(40, 200 / n), gap = 8, h0 = 40;
  for (let i = 0; i < n; i++) {
    const y = h0 + i * (bh + gap), dead = s.fail && i === 0;
    el("rect", {x: 20, y: y, width: 130, height: bh, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3, "stroke-dasharray": dead ? "5 4" : ""});
    el("text", {x: 85, y: y + bh / 2 + 5, "text-anchor": "middle", "font-size": 13}, `App ${i + 1}: ${ft(ap)}` + (dead ? " ✗" : ""));
    el("line", {x1: 150, y1: y + bh / 2, x2: 175, y2: y + bh / 2, stroke: css("--line")});
  }
  const yc = h0 + (n * (bh + gap) - gap) / 2;
  el("line", {x1: 175, y1: h0 + bh / 2, x2: 175, y2: h0 + (n - 1) * (bh + gap) + bh / 2, stroke: css("--line")});
  el("line", {x1: 175, y1: yc, x2: 225, y2: yc, stroke: css("--line"), "marker-end": ""});
  el("rect", {x: 225, y: yc - 22, width: 130, height: 44, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 3, "stroke-dasharray": "7 4"});
  el("text", {x: 290, y: yc + 5, "text-anchor": "middle", "font-size": 13}, `Adatbázis: ${ft(as)}`);
  el("text", {x: 20, y: 22, "font-size": 13}, "párhuzamos példányok  →  soros közös adatbázis");
  el("text", {x: 20, y: 290, "font-size": 13}, `párhuzamos rész: 1 − (1 − ${ft(ap)})^${n} = ${ft(par)}`);
  el("text", {x: 20, y: 312, "font-size": 13, "font-weight": "bold"}, `A_total = ${ft(as)} · ${ft(par)} = ${ft(tot)} (${ft(100 * tot, 4)}%)`);
  // kapacitás
  const X0 = 440, Y = v => 270 - v / 160 * 230, w = Math.min(46, 260 / n);
  el("line", {x1: X0, y1: Y(100), x2: 750, y2: Y(100), stroke: css("--fg"), "stroke-dasharray": "6 4"});
  el("text", {x: 750, y: Y(100) - 5, "text-anchor": "end", "font-size": 12}, "kapacitás 100%");
  el("line", {x1: X0, y1: Y(0), x2: 750, y2: Y(0), stroke: css("--line")});
  const load = s.fail ? (n > 1 ? n * u / (n - 1) : Infinity) : u;
  for (let i = 0; i < n; i++) {
    const x = X0 + 20 + i * (w + 12), dead = s.fail && i === 0;
    if (dead) {
      el("rect", {x: x, y: Y(u * 100), width: w, height: Y(0) - Y(u * 100), fill: "none", stroke: css("--muted"), "stroke-dasharray": "4 3"});
      el("line", {x1: x, y1: Y(0), x2: x + w, y2: Y(u * 100), stroke: css("--muted")});
      el("text", {x: x + w / 2, y: Y(0) + 16, "text-anchor": "middle", "font-size": 11}, "kiesett");
      continue;
    }
    const L = Math.min(load * 100, 160);
    el("rect", {x: x, y: Y(Math.min(L, 100)), width: w, height: Y(0) - Y(Math.min(L, 100)), fill: css("--cellhl"), stroke: css("--line")});
    if (L > 100) el("rect", {x: x, y: Y(L), width: w, height: Y(100) - Y(L), fill: "url(#hb)", stroke: css("--line"), "stroke-width": 1.5});
    el("text", {x: x + w / 2, y: Y(L) - 5, "text-anchor": "middle", "font-size": 12}, isFinite(load) ? hu(load * 100, 0) + "%" : "∞");
    el("text", {x: x + w / 2, y: Y(0) + 16, "text-anchor": "middle", "font-size": 11}, `App ${i + 1}`);
  }
  el("text", {x: X0, y: 22, "font-size": 13}, s.fail ? "egy példány kiesése után" : "normál üzem");
  const over = s.fail && load > 1;
  if (over) el("text", {x: X0, y: 300, "font-size": 13, "font-weight": "bold", fill: css("--hl2")}, "⚠ a képlet szerint elérhető, de túlterhelt");
  status.textContent = `A_total = ${ft(tot)} (párhuzamos rész ${ft(par)}); ` + (s.fail
     ? (n > 1 ? `kiesés után a túlélők (n − 1 = ${n - 1}) terhelése n·u/(n−1) = ${hu(load * 100, 0)}%` + (over ? " – a képlet szerint elérhető, de túlterhelt." : " – a tartalék elég.") : "egyetlen példány: kiesés = leállás.")
     : `normál üzemben példányonként ${hu(u * 100, 0)}%. Nyomd meg a „Példány kiesése” gombot.`);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
