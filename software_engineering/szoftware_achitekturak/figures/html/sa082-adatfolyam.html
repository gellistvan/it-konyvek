<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatfolyam-térkép adatkategóriákkal, céllal és bizalmi határral</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="setSteps(FLOWS)">Adatfolyamok (élenként)</button><button onclick="setSteps(DELS)">Törlési kérelem</button><span class="small">Egy élre kattintva megjelenik az adatleltár sora.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Adatfolyam-térkép: Ügyfél, Webfrontend, API Gateway, Ügyfél-szolgáltatás, adatbázisok, naplózás, marketing és külső e-mail-szolgáltató; élenként adatkategória és cél."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Vastag él: személyes adat; pontozott: álnevesített; szaggatott keret: bizalmi határ. A jogalapok és a megőrzési idők fiktívek (a fejezet retention_policies példájához igazítva).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Ügyfél → Webfrontend: HTTPS · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 0, "nodes": [], "line": -1}, {"msg": "Webfrontend → API Gateway: HTTPS · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 1, "nodes": [], "line": -1}, {"msg": "API Gateway → Ügyfél-szolgáltatás: HTTPS + JWT · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 2, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Ügyfél-adatbázis: SQL · név, e-mail, cím, rendelés · cél: rendelés, számla · jogalap: szerződés; számla: jogi kötelezettség · megőrzés: ügyféladat: a szerződés végéig; számla: 3650 nap", "e": 3, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Naplózó szolgáltatás: JSON, aszinkron · álnév, eseménytípus · cél: biztonság · jogalap: jogos érdek · megőrzés: – (átvitel)", "e": 4, "nodes": [], "line": -1}, {"msg": "Naplózó szolgáltatás → Napló-adatbázis: SQL · álnév, esemény, IP-prefix · cél: biztonság · jogalap: jogos érdek · megőrzés: 90 nap, majd törlés", "e": 5, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Marketing szolgáltatás: HTTPS · e-mail (csak hozzájárulás esetén) · cél: marketing · jogalap: hozzájárulás (külön jogalap) · megőrzés: a hozzájárulás visszavonásáig · FIGYELEM: célhoz kötöttség, külön jogalap", "e": 6, "nodes": [], "line": -1}, {"msg": "Marketing szolgáltatás → E-mail-szolgáltató: HTTPS · e-mail, keresztnév · cél: hírlevél kiküldése · jogalap: hozzájárulás; adatfeldolgozói szerződés · megőrzés: a kiküldésig + a szerződés szerinti törlés", "e": 7, "nodes": [], "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"nodes": {"A": [2.0, 8.0, "Ügyfél", "person"], "B": [6.2, 8.0, "Webfrontend", "svc"], "C": [10.6, 8.0, "API Gateway", "svc"], "D": [15.0, 8.0, "Ügyfél-\nszolgáltatás", "svc"], "E": [15.0, 4.6, "Ügyfél-adatbázis\nszámla: 3650 nap", "store"], "F": [10.4, 4.6, "Naplózó\nszolgáltatás", "svc"], "G": [6.2, 4.6, "Napló-adatbázis\nmegőrzés: 90 nap", "store"], "H": [10.4, 1.0, "Marketing\nszolgáltatás", "svc"], "I": [18.85, 1.0, "E-mail-\nszolgáltató", "ext"]}, "edges": [["A", "B", "HTTPS", "név, e-mail, cím", "rendelés", "szerződés teljesítése", "– (átvitel)", "pd"], ["B", "C", "HTTPS", "név, e-mail, cím", "rendelés", "szerződés teljesítése", "– (átvitel)", "pd"], ["C", "D", "HTTPS + JWT", "név, e-mail, cím", "rendelés", "szerződés teljesítése", "– (átvitel)", "pd"], ["D", "E", "SQL", "név, e-mail, cím,\nrendelés", "rendelés, számla", "szerződés; számla: jogi kötelezettség", "ügyféladat: a szerződés végéig; számla: 3650 nap", "pd"], ["D", "F", "JSON, aszinkron", "álnév, eseménytípus", "biztonság", "jogos érdek", "– (átvitel)", "pseudo"], ["F", "G", "SQL", "álnév, esemény, IP-prefix", "biztonság", "jogos érdek", "90 nap, majd törlés", "pseudo"], ["D", "H", "HTTPS", "e-mail (csak hozzá-\njárulás esetén)", "marketing", "hozzájárulás (külön jogalap)", "a hozzájárulás visszavonásáig", "pd"], ["H", "I", "HTTPS", "e-mail, keresztnév", "hírlevél kiküldése", "hozzájárulás; adatfeldolgozói szerződés", "a kiküldésig + a szerződés szerinti törlés", "pd"]], "warn": ["D", "H"], "fin": [4.1, 0.15, 16.95, 9.95], "fex": [17.2, 0.15, 20.55, 2.85], "W": 3.6, "H": 1.5, "NW": {"I": 3.0}}, FLOWS = [{"msg": "Ügyfél → Webfrontend: HTTPS · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 0, "nodes": [], "line": -1}, {"msg": "Webfrontend → API Gateway: HTTPS · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 1, "nodes": [], "line": -1}, {"msg": "API Gateway → Ügyfél-szolgáltatás: HTTPS + JWT · név, e-mail, cím · cél: rendelés · jogalap: szerződés teljesítése · megőrzés: – (átvitel)", "e": 2, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Ügyfél-adatbázis: SQL · név, e-mail, cím, rendelés · cél: rendelés, számla · jogalap: szerződés; számla: jogi kötelezettség · megőrzés: ügyféladat: a szerződés végéig; számla: 3650 nap", "e": 3, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Naplózó szolgáltatás: JSON, aszinkron · álnév, eseménytípus · cél: biztonság · jogalap: jogos érdek · megőrzés: – (átvitel)", "e": 4, "nodes": [], "line": -1}, {"msg": "Naplózó szolgáltatás → Napló-adatbázis: SQL · álnév, esemény, IP-prefix · cél: biztonság · jogalap: jogos érdek · megőrzés: 90 nap, majd törlés", "e": 5, "nodes": [], "line": -1}, {"msg": "Ügyfél-szolgáltatás → Marketing szolgáltatás: HTTPS · e-mail (csak hozzájárulás esetén) · cél: marketing · jogalap: hozzájárulás (külön jogalap) · megőrzés: a hozzájárulás visszavonásáig · FIGYELEM: célhoz kötöttség, külön jogalap", "e": 6, "nodes": [], "line": -1}, {"msg": "Marketing szolgáltatás → E-mail-szolgáltató: HTTPS · e-mail, keresztnév · cél: hírlevél kiküldése · jogalap: hozzájárulás; adatfeldolgozói szerződés · megőrzés: a kiküldésig + a szerződés szerinti törlés", "e": 7, "nodes": [], "line": -1}], DELS = [{"msg": "Törlési kérelem: az érintett (Ügyfél) törlést kér; a 17. cikk (3) kivételeit előbb meg kell vizsgálni.", "e": -1, "nodes": [], "line": -1}, {"msg": "Törlés 1/5: Ügyfél-adatbázis: az ügyfél adatainak törlése; a számla-adat jogi kötelezettség miatt megmarad (anonimizálás a 3650 napos lejáratkor), ezt indoklással dokumentálni kell.", "e": -1, "nodes": ["E"], "line": -1}, {"msg": "Törlés 2/5: Napló-adatbázis: az álnév-leképezés törlése, így a naplóbejegyzés nem köthető vissza; a bejegyzés a 90 napos megőrzés végén törlődik.", "e": -1, "nodes": ["E", "G"], "line": -1}, {"msg": "Törlés 3/5: Marketing szolgáltatás: az e-mail és a hozzájárulás törlése, tiltólista (hash) a további küldés ellen.", "e": -1, "nodes": ["E", "G", "H"], "line": -1}, {"msg": "Törlés 4/5: E-mail-szolgáltató (adatfeldolgozó): törlési utasítás a szerződés szerint, a végrehajtás igazolása.", "e": -1, "nodes": ["E", "G", "H", "I"], "line": -1}, {"msg": "Törlés 5/5: Mentések: nincs azonnali fizikai törlés – zárolt hozzáférés, lejárat, és visszaállítás után a törlési lista újraalkalmazása.", "e": -1, "nodes": ["E", "G", "H", "I", "bk"], "line": -1}];
let PICK = -1;
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-4 26 772 432");
  const S = 37, T = 41, X = v => v * S, Y = v => 452 - v * T, hl = css("--hl2"), cur = PICK >= 0 ? PICK : s.e;
  el("defs", {}).innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--fg") + '"/></marker><marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + hl + '"/></marker>';
  [[D.fin, "Adatkezelő rendszerhatára"], [D.fex, "Külső adatfeldolgozó"]].forEach(([f, t], fi) => {
    el("rect", {x: X(f[0]), y: Y(f[3]), width: (f[2] - f[0]) * S, height: (f[3] - f[1]) * T, fill: "none", stroke: css("--fg"), "stroke-dasharray": "8 4", "stroke-width": 1.4});
    el("text", {x: X(f[0]) + 6, y: fi ? Y(f[3]) - 6 : Y(f[1]) - 6, "font-size": 12, "font-style": "italic"}, t);
  });
  const cut = (u, v) => { const a = D.nodes[u], b = D.nodes[v], dx = b[0] - a[0], dy = b[1] - a[1];
    const c = (ex, ey, ww) => { const tx = ex ? (ww / 2) / Math.abs(ex) : 1e9, ty = ey ? (D.H / 2) / Math.abs(ey) : 1e9, t = Math.min(tx, ty); return [ex * t, ey * t]; };
    const p = c(dx, dy, D.NW[u] || D.W), q = c(-dx, -dy, D.NW[v] || D.W); return [a[0] + p[0], a[1] + p[1], b[0] + q[0], b[1] + q[1]]; };
  D.edges.forEach((e, i) => {
    const [x0, y0, x1, y1] = cut(e[0], e[1]), on = i === cur;
    const ln = el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: on ? hl : css("--fg"), "stroke-width": (e[7] === "pd" ? 3.2 : 1.8) + (on ? 1.5 : 0), "stroke-dasharray": e[7] === "pd" ? "" : "2 4", "marker-end": on ? "url(#ahh)" : "url(#ah)"});
    const hit = el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), stroke: "transparent", "stroke-width": 16, style: "cursor:pointer"});
    hit.addEventListener("click", () => { PICK = i; render(STEPS[k]); PICK = -1; status.textContent = FLOWS[i].msg; });
    if (e[0] === D.warn[0] && e[1] === D.warn[1]) {
      const mx = X((x0 + x1) / 2) - 26, my = Y((y0 + y1) / 2);
      el("path", {d: `M ${mx - 11} ${my + 9} L ${mx + 11} ${my + 9} L ${mx} ${my - 11} Z`, fill: css("--bg"), stroke: on ? hl : css("--fg"), "stroke-width": 1.6});
      el("text", {x: mx, y: my + 7, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, "!");
    }
  });
  for (const n in D.nodes) {
    const v = D.nodes[n], gone = s.nodes.includes(n), store = v[3] === "store", ww = D.NW[n] || D.W;
    el("rect", {x: X(v[0] - ww / 2), y: Y(v[1] + D.H / 2), width: ww * S, height: D.H * T, rx: store ? 20 : 6, fill: gone ? css("--cellhl") : (v[3] === "svc" || v[3] === "ext" ? css("--cellhl") : css("--cell")), stroke: gone ? hl : css("--line"), "stroke-width": gone ? 3 : (store ? 2.2 : 1.2)});
    v[2].split("\n").forEach((l, i, a) => el("text", {x: X(v[0]), y: Y(v[1]) + 5 + (i - (a.length - 1) / 2) * 15, "text-anchor": "middle", "font-size": 12.5}, l));
    if (gone) el("text", {x: X(v[0] + ww / 2) - 4, y: Y(v[1] + D.H / 2) + 14, "text-anchor": "end", "font-size": 13, "font-weight": "bold", fill: hl}, "törölve");
  }
  const bk = s.nodes.includes("bk");
  el("rect", {x: X(17.4), y: Y(6.4), width: 3.0 * S, height: 1.2 * T, rx: 4, fill: css("--cell"), stroke: bk ? hl : css("--muted"), "stroke-width": bk ? 3 : 1, "stroke-dasharray": "3 3"});
  el("text", {x: X(18.9), y: Y(6.4) + 18, "text-anchor": "middle", "font-size": 12}, "Mentések");
  el("text", {x: X(18.9), y: Y(6.4) + 36, "text-anchor": "middle", "font-size": 10.5, fill: css("--muted")}, bk ? "újraalkalmazási lista" : "zárolt, lejáró");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
