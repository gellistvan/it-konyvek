<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stakeholder, aggodalom, nézőpont, nézet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy sor: Termékmenedzser, Fejlesztő, Üzemeltető, Biztonsági vezető; mindegyiknél egy aggodalom, egy nézőpont (C4 context, C4 container, telepítési, adatfolyam) és egy nézet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">ISO/IEC/IEEE 42010 fogalmai a könyv egységes fordításával: concern = aggodalom, viewpoint = nézőpont, view = nézet. A bélyegképek a Rendelőpont szemléltető vázlatai.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"row": 2, "stage": 0, "line": -1, "msg": "1/4 Stakeholder: Üzemeltető"}, {"row": 2, "stage": 1, "line": -1, "msg": "2/4 Aggodalom: „Hol futnak és hogyan állnak helyre?”"}, {"row": 2, "stage": 2, "line": -1, "msg": "3/4 Nézőpont: telepítési nézőpont (szabály: csomópontok, podok, hálózat, helyreállítás)"}, {"row": 2, "stage": 3, "line": -1, "msg": "4/4 Nézet: telepítési diagram (podok, hálózati szabályok)"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"rows": [{"sh": "Termékmenedzser", "concern": "Hogyan skálázódik a rendelésfelvétel csúcsidőben?", "vp": "C4 context", "vpr": "rendszerhatár, külső szereplők és forgalmi források", "view": "context", "vname": "context diagram (Vevő, külső szolgáltatók, rendszerhatár)"}, {"sh": "Fejlesztő", "concern": "Mely egységek és milyen protokollal beszélnek?", "vp": "C4 container", "vpr": "futtatható egységek és protokollok", "view": "container", "vname": "container diagram (Web, Rendeléskezelő, Számlázó, adatbázis)"}, {"sh": "Üzemeltető", "concern": "Hol futnak és hogyan állnak helyre?", "vp": "telepítési nézőpont", "vpr": "csomópontok, podok, hálózat, helyreállítás", "view": "deployment", "vname": "telepítési diagram (podok, hálózati szabályok)"}, {"sh": "Biztonsági vezető", "concern": "Merre halad a kártyaadat?", "vp": "adatfolyam-nézőpont", "vpr": "adatutak, bizalmi határok, titkosítás", "view": "dataflow", "vname": "adatfolyam-diagram (bizalmi határ, titkosítási pontok)"}], "th": {"context": [["box", 0.27, 0.38, 0.46, 0.26, "Rendelőpont", false], ["box", 0.02, 0.76, 0.26, 0.22, "Vevő", false], ["box", 0.02, 0.02, 0.3, 0.22, "Fizető", false], ["box", 0.68, 0.02, 0.3, 0.22, "Email", false], ["arr", 0.16, 0.76, 0.34, 0.64, false], ["arr", 0.36, 0.38, 0.2, 0.24, false], ["arr", 0.64, 0.38, 0.8, 0.24, false]], "container": [["box", 0.01, 0.02, 0.98, 0.96, "", true], ["box", 0.03, 0.56, 0.21, 0.28, "Web", false], ["box", 0.29, 0.56, 0.41, 0.28, "Rendelés", false], ["db", 0.38, 0.06, 0.24, 0.32, "DB"], ["box", 0.73, 0.46, 0.26, 0.48, "Szám-\nlázó", false], ["arr", 0.24, 0.7, 0.29, 0.7, false], ["arr", 0.5, 0.56, 0.5, 0.38, false], ["arr", 0.7, 0.7, 0.73, 0.7, true]], "deployment": [["box", 0.01, 0.02, 0.98, 0.96, "", true], ["box", 0.02, 0.52, 0.32, 0.36, "web×2", false], ["box", 0.38, 0.52, 0.61, 0.36, "rendelés ×3", false], ["db", 0.36, 0.06, 0.28, 0.36, "PV"], ["arr", 0.34, 0.7, 0.38, 0.7, false], ["arr", 0.68, 0.52, 0.6, 0.42, false]], "dataflow": [["box", 0.0, 0.3, 0.23, 0.32, "Vevő", false], ["box", 0.26, 0.04, 0.48, 0.9, "", true], ["box", 0.285, 0.3, 0.43, 0.32, "Rendelés", false], ["box", 0.77, 0.3, 0.22, 0.32, "PSP", false], ["arr", 0.23, 0.46, 0.285, 0.46, false], ["arr", 0.715, 0.46, 0.77, 0.46, false], ["lock", 0.26, 0.8], ["lock", 0.74, 0.8]]}, "stages": ["Stakeholder", "Aggodalom", "Nézőpont", "Nézet"], "arrows": ["feltesz", "keretet ad", "alkalmazva a rendszerre"]};
function rowSteps(i){
  const r = D.rows[i];
  const vals = [r.sh, `„${r.concern}”`, `${r.vp} (szabály: ${r.vpr})`, r.vname];
  return [0, 1, 2, 3].map(k => ({row: i, stage: k, line: -1, msg: `${k + 1}/4 ${D.stages[k]}: ${vals[k]}`}));
}
function thumb(prims, x, y, w, h, fs){
  prims.forEach(p => {
    const X = v => x + v * w, Y = v => y + (1 - v) * h;
    if (p[0] === "box"){
      el("rect", {x: X(p[1]), y: Y(p[2] + p[4]), width: p[3] * w, height: p[4] * h, fill: p[6] ? "none" : css("--cell"), stroke: css("--line"), "stroke-width": 0.8, "stroke-dasharray": p[6] ? "4 3" : ""});
      if (p[5]) p[5].split("\n").forEach((t, j, a) => el("text", {x: X(p[1] + p[3] / 2), y: Y(p[2] + p[4] / 2) + (j - (a.length - 1) / 2) * fs * 1.1 + fs * 0.35, "text-anchor": "middle", "font-size": fs}, t));
    } else if (p[0] === "db"){
      el("rect", {x: X(p[1]), y: Y(p[2] + p[4] * 0.85), width: p[3] * w, height: p[4] * 0.85 * h, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 0.8});
      el("ellipse", {cx: X(p[1] + p[3] / 2), cy: Y(p[2] + p[4] * 0.85), rx: p[3] * w / 2, ry: p[4] * h * 0.15, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": 0.8});
      el("text", {x: X(p[1] + p[3] / 2), y: Y(p[2] + p[4] * 0.4) + fs * 0.35, "text-anchor": "middle", "font-size": fs}, p[5]);
    } else if (p[0] === "arr"){
      el("line", {x1: X(p[1]), y1: Y(p[2]), x2: X(p[3]), y2: Y(p[4]), stroke: css("--line"), "stroke-width": 1, "stroke-dasharray": p[5] ? "4 3" : "", "marker-end": "url(#am)"});
    } else if (p[0] === "lock"){
      el("rect", {x: X(p[1]) - fs * 0.45, y: Y(p[2]) - fs * 0.2, width: fs * 0.9, height: fs * 0.7, fill: css("--fg")});
      el("circle", {cx: X(p[1]), cy: Y(p[2]) - fs * 0.3, r: fs * 0.3, fill: "none", stroke: css("--fg"), "stroke-width": 1.2});
    }
  });
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 420");
  svg.innerHTML = "";
  const defs = document.createElementNS(NS, "defs"); svg.appendChild(defs);
  defs.innerHTML = `<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="${css("--line")}"/></marker>`;
  const XS = [8, 130, 300, 470], W = [110, 160, 160, 120], RH = 52, Y0 = 44;
  D.stages.forEach((t, k) => el("text", {x: XS[k] + W[k] / 2, y: 18, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, t));
  D.arrows.forEach((t, k) => el("text", {x: (XS[k] + W[k] + XS[k + 1]) / 2, y: 34, "text-anchor": "middle", "font-size": 10, "font-style": "italic", fill: css("--muted")}, t));
  D.rows.forEach((r, i) => {
    const y = Y0 + i * RH, on = i === s.row;
    const g = document.createElementNS(NS, "g"); svg.appendChild(g);
    g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("aria-label", r.sh + " sora");
    g.style.cursor = "pointer";
    const add = (tag, a, t) => { const n = el(tag, a, t); g.appendChild(n); return n; };
    add("rect", {x: 2, y: y - 2, width: 600, height: RH - 4, fill: on ? css("--cellhl") : "transparent", opacity: on ? 0.55 : 1});
    const vals = [r.sh, r.concern, r.vp, ""];
    for (let k = 0; k < 4; k++){
      const act = on && k <= s.stage;
      const st = {x: XS[k], y: y + 2, width: W[k], height: RH - 12, rx: k === 1 ? 12 : 3, fill: css("--cell"), stroke: act ? css("--hl") : css("--line"), "stroke-width": act ? 3 : 1};
      if (k === 0) { st.rx = 18; }
      add("rect", st);
      if (k < 3){
        const words = vals[k].split(" "), lines = [];
        let cur = "";
        words.forEach(w => { if ((cur + " " + w).trim().length > (k === 1 ? 28 : 18)) { lines.push(cur.trim()); cur = w; } else cur += " " + w; });
        lines.push(cur.trim());
        lines.forEach((t, j) => add("text", {x: XS[k] + W[k] / 2, y: y + 2 + (RH - 12) / 2 + (j - (lines.length - 1) / 2) * 12 + 4, "text-anchor": "middle", "font-size": 11, "font-weight": k !== 1 ? "bold" : "normal"}, t));
      }
      if (k < 3) add("line", {x1: XS[k] + W[k] + 2, y1: y + RH / 2 - 4, x2: XS[k + 1] - 3, y2: y + RH / 2 - 4, stroke: act && k < s.stage ? css("--hl") : css("--line"), "stroke-width": act && k < s.stage ? 2.5 : 1, "marker-end": "url(#am)"});
    }
    thumb(D.th[r.view], XS[3] + 4, y + 4, W[3] - 8, RH - 16, 7);
    const pick = () => { setSteps(rowSteps(i)); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
  });
  // nagyított nézet / szabálylap
  const r = D.rows[s.row], yb = Y0 + 4 * RH + 6;
  el("line", {x1: 0, y1: yb, x2: 640, y2: yb, stroke: css("--muted"), "stroke-width": 0.6});
  if (s.stage === 3){
    el("text", {x: 8, y: yb + 18, "font-size": 12, "font-weight": "bold"}, "Nézet (nagyítva): " + r.vname);
    thumb(D.th[r.view], 150, yb + 26, 340, 170 - 40, 12);
  } else {
    el("text", {x: 8, y: yb + 18, "font-size": 12}, "Válasszon stakeholdert (kattintás vagy Tab + Enter), majd „Lépés ▶”: a 4. lépés a nézetet nagyítva mutatja.");
    el("text", {x: 8, y: yb + 40, "font-size": 12, fill: css("--muted")}, "nézőpont = szabály (mit, milyen jelöléssel ábrázolunk); nézet = a szabály szerint készült konkrét leírás.");
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
