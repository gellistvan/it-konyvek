<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvórum és versenyhelyzet</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N <input id="N" type="range" min="3" max="5" value="3" oninput="upd()" aria-label="N" style="width:90px"> <span id="Nv">3</span></label> <label>W <input id="W" type="range" min="1" max="3" value="2" oninput="upd()" aria-label="W" style="width:90px"> <span id="Wv">2</span></label> <label>R <input id="R" type="range" min="1" max="3" value="2" oninput="upd()" aria-label="R" style="width:90px"> <span id="Rv">2</span></label> <label><input type="checkbox" id="cas" onchange="upd()"> CAS a leaderen (különben kvórumos írás)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három replika (érték, verzió) párral, írási és olvasási kvórum; két kliens egyszerre foglalja az utolsó darabot: kvórumos írással mindkettő sikeres, feltételes frissítéssel a második 409-et kap."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Rögzített replikahalmaz, nincs sloppy quorum. Írási halmaz: az első W replika (B a saját írásakor az utolsó W-t éri el), olvasási halmaz: az utolsó R replika; az olvasás a legnagyobb verziót adja vissza. Szemléltető modell, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"rep": [[1, 7], [1, 7], [1, 7]], "hl": [1, 2], "cl": {"A": "olvasott: 1 db, v7"}, "succ": [], "msg": "A olvas az olvasási kvórumból {R2, R3}: 1 darab (v7).", "cas": false}, {"rep": [[1, 7], [1, 7], [1, 7]], "hl": [1, 2], "cl": {"A": "olvasott: 1 db, v7", "B": "olvasott: 1 db, v7"}, "succ": [], "msg": "B is olvas ugyanonnan: 1 darab (v7) – mindkettő úgy látja, van még 1 darab.", "cas": false}, {"rep": [[0, 8], [0, 8], [1, 7]], "hl": [0, 1], "cl": {"A": "foglalás sikeres", "B": "olvasott: 1 db, v7"}, "succ": ["A"], "msg": "A 0-t ír az írási kvórumra {R1, R2} (v8): W = 2 megerősítés, siker.", "cas": false}, {"rep": [[0, 8], [0, 8], [0, 8]], "hl": [1, 2], "cl": {"A": "foglalás sikeres", "B": "foglalás sikeres"}, "succ": ["A", "B"], "msg": "B is 0-t ír a saját kvórumára {R2, R3} (v8): ez is W = 2 megerősítés, siker.", "cas": false}, {"rep": [[0, 8], [0, 8], [0, 8]], "hl": [], "cl": {"A": "201 (foglalva)", "B": "201 (foglalva) – túlfoglalás"}, "succ": ["A", "B"], "msg": "Eredmény: két sikeres foglalás egyetlen darabra – duplikált foglalás = 1. A kvórum-metszet friss olvasást ad, de az olvasás–módosítás–írás versenyt nem zárja ki.", "cas": false}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function g(id){ return +document.getElementById(id).value; }
function qsets(N, W, R){ const w = [...Array(W).keys()], r = [...Array(R).keys()].map(i => N - R + i); return [w, r, w.filter(i => r.includes(i))]; }
function race(N, W, R, cas){
  const rep = [...Array(N)].map(() => [1, 7]), sw = qsets(N, W, R), wA = sw[0], rS = sw[1], wB = [...Array(W).keys()].map(i => N - W + i), steps = [], succ = [];
  const nm = a => "{" + a.map(i => "R" + (i + 1)).join(", ") + "}";
  const snap = (msg, hl, cl) => steps.push({rep: rep.map(x => x.slice()), hl: hl.slice(), cl: Object.assign({}, cl), succ: succ.slice(), msg: msg, cas: cas});
  const read = rs => rs.map(i => rep[i]).reduce((b, x) => x[1] > b[1] ? x : b).slice();
  const a = read(rS);
  snap(`A olvas az olvasási kvórumból ${nm(rS)}: ${a[0]} darab (v${a[1]}).`, rS, {A: `olvasott: ${a[0]} db, v${a[1]}`});
  const b = read(rS);
  snap(`B is olvas ugyanonnan: ${b[0]} darab (v${b[1]}) – mindkettő úgy látja, van még 1 darab.`, rS, {A: `olvasott: ${a[0]} db, v${a[1]}`, B: `olvasott: ${b[0]} db, v${b[1]}`});
  if (!cas) {
    wA.forEach(i => rep[i] = [a[0] - 1, a[1] + 1]); succ.push("A");
    snap(`A 0-t ír az írási kvórumra ${nm(wA)} (v${a[1] + 1}): W = ${W} megerősítés, siker.`, wA, {A: "foglalás sikeres", B: `olvasott: ${b[0]} db, v${b[1]}`});
    wB.forEach(i => rep[i] = [b[0] - 1, b[1] + 1]); succ.push("B");
    snap(`B is 0-t ír a saját kvórumára ${nm(wB)} (v${b[1] + 1}): ez is W = ${W} megerősítés, siker.`, wB, {A: "foglalás sikeres", B: "foglalás sikeres"});
    snap(`Eredmény: két sikeres foglalás egyetlen darabra – duplikált foglalás = ${succ.length - 1}. A kvórum-metszet friss olvasást ad, de az olvasás–módosítás–írás versenyt nem zárja ki.`, [], {A: "201 (foglalva)", B: "201 (foglalva) – túlfoglalás"});
  } else {
    const ver = rep[0][1];
    rep[0] = [0, ver + 1]; wA.slice(1).forEach(i => rep[i] = [0, ver + 1]); succ.push("A");
    snap(`A: CAS a leaderen (R1): ha verzió = v${a[1]}, akkor készlet := 0, v${ver + 1} – siker; replikálás W = ${W}.`, wA, {A: "201 Created", B: `olvasott: ${b[0]} db, v${b[1]}`});
    snap(`B: CAS a leaderen: expected v${b[1]}, aktuális v${rep[0][1]} – version mismatch, a készlet nem változik.`, [0], {A: "201 Created", B: "409 Conflict"});
    for (let i = 0; i < N; i++) rep[i] = [0, ver + 1];
    snap(`Eredmény: pontosan egy 201 és egy 409; a replikák a felzárkózás után mind (0, v${ver + 1}).`, [], {A: "201 Created", B: "409 Conflict"});
  }
  return steps;
}
function upd(){
  let N = g("N"); const W = Math.min(g("W"), N), R = Math.min(g("R"), N);
  document.getElementById("W").max = N; document.getElementById("R").max = N;
  document.getElementById("W").value = W; document.getElementById("R").value = R;
  ["N", "W", "R"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  setSteps(race(N, W, R, document.getElementById("cas").checked));
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const fg = css("--fg"), mu = css("--muted"), hl = css("--hl2");
  const N = g("N"), W = Math.min(g("W"), N), R = Math.min(g("R"), N), sw = qsets(N, W, R), inter = sw[2];
  const cw = Math.min(120, 640 / N), x0 = (760 - N * cw) / 2;
  const X = i => x0 + i * cw;
  // halmazok
  el("rect", {x: X(0) + 4, y: 40, width: W * cw - 8, height: 98, rx: 10, fill: "none", stroke: fg, "stroke-width": 2});
  el("rect", {x: X(N - R) + 8, y: 34, width: R * cw - 16, height: 110, rx: 10, fill: "none", stroke: fg, "stroke-width": 2, "stroke-dasharray": "7 4"});
  el("text", {x: X(0) + 8, y: 28, "font-size": 12}, `írási halmaz (W = ${W}, folytonos)`);
  el("text", {x: X(N) - 8, y: 162, "text-anchor": "end", "font-size": 12}, `olvasási halmaz (R = ${R}, szaggatott)`);
  s.rep.forEach((v, i) => {
    const on = s.hl.includes(i), common = inter.includes(i);
    el("rect", {x: X(i) + 14, y: 52, width: cw - 28, height: 74, rx: 6, fill: common ? css("--cellhl") : css("--cell"), stroke: on ? hl : fg, "stroke-width": on ? 3.5 : 1.3});
    el("text", {x: X(i) + cw / 2, y: 80, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, "R" + (i + 1) + (i === 0 && s.cas ? " (leader)" : ""));
    el("text", {x: X(i) + cw / 2, y: 108, "text-anchor": "middle", "font-size": 15}, `(${v[0]}, v${v[1]})`);
  });
  const ok = W + R > N;
  el("text", {x: 380, y: 192, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, ok ? `W + R = ${W + R} > N = ${N}: közös replika ${inter.map(i => "R" + (i + 1)).join(", ")}` : `W + R = ${W + R} ≤ N = ${N}: metszet nem garantált (a két halmaz itt diszjunkt)`);
  // kliensek
  [["A", 120], ["B", 500]].forEach(([c, x]) => {
    const t = s.cl[c] || "–", bad = /409|túlfoglalás/.test(t);
    el("rect", {x: x, y: 214, width: 160, height: 54, rx: 8, fill: css("--cell"), stroke: fg, "stroke-width": 1.3});
    el("text", {x: x + 80, y: 236, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "Kliens " + c);
    el("text", {x: x + 80, y: 257, "text-anchor": "middle", "font-size": 12, "text-decoration": /409/.test(t) ? "line-through" : "none"}, t);
  });
  el("text", {x: 380, y: 300, "text-anchor": "middle", "font-size": 13}, `sikeres foglalások: ${s.succ.length}` + (s.succ.length > 1 ? `  (duplikált: ${s.succ.length - 1})` : ""));
  el("text", {x: 380, y: 322, "text-anchor": "middle", "font-size": 11, fill: mu}, s.cas ? "mód: feltételes frissítés (CAS) a leaderen" : "mód: kvórumos írás feltétel nélkül");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
