<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p95 CI és döntési küszöb</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--sys:#e6e6e6;--ext:#cfcfcf;--comp:#f3f3f3;--wait:#bdbdbd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--sys:#3a3a3a;--ext:#4a4a4a;--comp:#303030;--wait:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{font-weight:bold;outline:2px solid var(--hl)}
input[type=range]{min-width:90px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block;margin:0 auto}
svg text{font-family:system-ui,sans-serif}
svg text:not([fill]){fill:var(--fg);}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:right}
th:first-child,td:first-child{text-align:left}
td.on{outline:2px solid var(--hl);font-weight:bold}

</style>
</head>
<body>

<div class="ctl" role="group" aria-label="gRPC futamok">
 <span>gRPC futamszintű p95 (ms):</span> <label>1. <input id="g0" type="range" min="70" max="95" step="1" value="80" style="width:90px" aria-label="1. futam p95"> <span id="g0v">80</span></label> <label>2. <input id="g1" type="range" min="70" max="95" step="1" value="82" style="width:90px" aria-label="2. futam p95"> <span id="g1v">82</span></label> <label>3. <input id="g2" type="range" min="70" max="95" step="1" value="79" style="width:90px" aria-label="3. futam p95"> <span id="g2v">79</span></label> <label>4. <input id="g3" type="range" min="70" max="95" step="1" value="83" style="width:90px" aria-label="4. futam p95"> <span id="g3v">83</span></label> <label>5. <input id="g4" type="range" min="70" max="95" step="1" value="81" style="width:90px" aria-label="5. futam p95"> <span id="g4v">81</span></label> 
</div>
<div class="ctl">
 <label><input id="unc" type="checkbox"> a küszöb bizonytalanságának figyelembevétele</label>
 <button id="p0">alapeset</button><button id="p1">határeset</button><button id="p2">elutasítás példa</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 200" role="img" aria-label="Futamok, átlag és 95%-os CI a küszöbhöz képest"></svg>

<p class="small">Kezdőállapot: a fejezet alapesete (CI [79,0; 83,0] → elfogadás). A „határeset” gomb a 82, 85, 83, 87, 84 ms futamokat tölti be (CI [81,8; 86,6] → további vizsgálat). Szimulált szemléltető adatok, nem mérés; 5 futam, 10 perces ablak, t₀,₉₇₅(4) = 2,776.</p>
<script>

const REST = [120, 121, 124, 119, 123], T975 = 2.776, PRE = [[80, 82, 79, 83, 81], [82, 85, 83, 87, 84], [88, 90, 89, 92, 91]];
const NS = "http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(p, tag, a, t){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;p.appendChild(e);return e;}
function f(v){ return (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
function ci(x){ const n = x.length, m = x.reduce((a, b) => a + b, 0) / n, s = Math.sqrt(x.reduce((a, v) => a + (v - m) * (v - m), 0) / (n - 1)), h = T975 * s / Math.sqrt(n); return [m, s, m - h, m + h]; }
const R = ci(REST), THR = 0.7 * R[0], BAND = [0.7 * R[2], 0.7 * R[3]];
function upd(){
  const g = [0, 1, 2, 3, 4].map(i => +document.getElementById("g" + i).value);
  g.forEach((v, i) => document.getElementById("g" + i + "v").textContent = v);
  const C = ci(g), unc = document.getElementById("unc").checked;
  const lo = unc ? BAND[0] : THR, hi = unc ? BAND[1] : THR;
  const dec = C[3] < lo ? "elfogadás" : (C[2] > hi ? "elutasítás" : "további vizsgálat");
  document.getElementById("status").textContent = `gRPC: átlag ${f(C[0])} ms, szórás ${f(C[1])} ms, 95%-os CI [${f(C[2])}; ${f(C[3])}] ms; küszöb ${unc ? "[" + f(BAND[0]) + "; " + f(BAND[1]) + "] (bizonytalansággal)" : f(THR)} ms → döntés: ${dec.toUpperCase()}. (Szimulált szemléltető adatok, nem mérés.)`;
  const svg = document.getElementById("v"); svg.innerHTML = "";
  const X = v => 130 + (v - 70) / 60 * 480;
  const defs = mk(svg, "defs", {}); defs.innerHTML = `<pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css('--muted')}"/></pattern>`;
  mk(svg, "rect", {x: X(BAND[0]), y: 20, width: X(BAND[1]) - X(BAND[0]), height: 130, fill: "url(#hb)", opacity: unc ? 0.9 : 0.4});
  mk(svg, "line", {x1: X(THR), x2: X(THR), y1: 14, y2: 152, stroke: css("--hl2"), "stroke-width": 2, "stroke-dasharray": "6 4"});
  mk(svg, "text", {x: X(THR), y: 11, "text-anchor": "middle", "font-size": 11}, "küszöb 85,0 ms");
  for (let v = 70; v <= 130; v += 10) { mk(svg, "text", {x: X(v), y: 168, "text-anchor": "middle", "font-size": 11}, String(v)); mk(svg, "line", {x1: X(v), x2: X(v), y1: 20, y2: 152, stroke: css("--muted"), "stroke-dasharray": "1 3", "stroke-width": 0.6}); }
  mk(svg, "text", {x: 370, y: 186, "text-anchor": "middle", "font-size": 11.5}, "futamszintű p95 (ms)");
  [["REST", REST, R, 55], ["gRPC", g, C, 115]].forEach(([lab, x, c, y]) => {
    mk(svg, "text", {x: 4, y: y + 4, "font-size": 12}, lab);
    mk(svg, "line", {x1: X(c[2]), x2: X(c[3]), y1: y, y2: y, stroke: css("--fg"), "stroke-width": 2});
    [c[2], c[3]].forEach(v => mk(svg, "line", {x1: X(v), x2: X(v), y1: y - 7, y2: y + 7, stroke: css("--fg"), "stroke-width": 2}));
    x.forEach(v => mk(svg, "circle", {cx: X(v), cy: y - 14, r: 4, fill: css("--bg"), stroke: css("--fg")}));
    mk(svg, "path", {d: `M${X(c[0])},${y-6} l6,6 l-6,6 l-6,-6 z`, fill: css("--fg")});
  });
  mk(svg, "text", {x: 628, y: 119, "text-anchor": "end", "font-size": 12, "font-weight": "bold"}, dec);
}
for (let i = 0; i < 5; i++) document.getElementById("g" + i).oninput = upd;
document.getElementById("unc").onchange = upd;
PRE.forEach((p, j) => document.getElementById("p" + j).onclick = () => { p.forEach((v, i) => document.getElementById("g" + i).value = v); upd(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
upd();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
