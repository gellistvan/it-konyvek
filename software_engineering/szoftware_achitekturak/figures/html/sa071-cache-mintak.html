<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A négy cache-minta</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Minta"><button class="pat" data-p="cache-aside" aria-pressed="true" onclick="pick('cache-aside')">cache-aside</button> <button class="pat" data-p="read-through" aria-pressed="false" onclick="pick('read-through')">read-through</button> <button class="pat" data-p="write-through" aria-pressed="false" onclick="pick('write-through')">write-through</button> <button class="pat" data-p="write-behind" aria-pressed="false" onclick="pick('write-behind')">write-behind</button></span> <button id="crashb" disabled onclick="crashCache()">Cache összeomlik</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három életvonal (alkalmazás, cache, adatbázis) számozott nyilakkal a kiválasztott cache-mintára; jobbra állapottábla a cache, az adatbázis és a kliens által látott értékkel."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egy kulcs (product:123), egy író, ár 100 → 120; szemléltető modell. A write-behind mintánál a „Cache összeomlik” gomb a kötegelt adatbázis-írás előtti összeomlást mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"frm": 0, "to": 1, "label": "1 GET product:123 → miss", "sync": true, "cache": null, "db": 100, "seen": null, "msg": "Az alkalmazás a cache-t kérdezi: nincs találat (miss).", "lost": false, "line": -1}, {"frm": 0, "to": 2, "label": "2 SELECT → 100", "sync": true, "cache": null, "db": 100, "seen": null, "msg": "Az ALKALMAZÁS olvas az adatbázisból: ár = 100.", "lost": false, "line": -1}, {"frm": 0, "to": 1, "label": "3 SET 100", "sync": true, "cache": 100, "db": 100, "seen": 100, "msg": "Az alkalmazás beírja a cache-be (lusta betöltés).", "lost": false, "line": -1}, {"frm": 0, "to": 2, "label": "4 UPDATE ár = 120", "sync": true, "cache": 100, "db": 120, "seen": 120, "msg": "Írás: az alkalmazás közvetlenül az adatbázist frissíti.", "lost": false, "line": -1}, {"frm": 0, "to": 1, "label": "5 DEL product:123", "sync": true, "cache": null, "db": 120, "seen": 120, "msg": "…és a cache-bejegyzést TÖRLI (érvénytelenítés, nem SET); a következő olvasás 120-at tölt be.", "lost": false, "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL = {"cache-aside": [{"frm": 0, "to": 1, "label": "1 GET product:123 → miss", "sync": true, "cache": null, "db": 100, "seen": null, "msg": "Az alkalmazás a cache-t kérdezi: nincs találat (miss).", "lost": false, "line": -1}, {"frm": 0, "to": 2, "label": "2 SELECT → 100", "sync": true, "cache": null, "db": 100, "seen": null, "msg": "Az ALKALMAZÁS olvas az adatbázisból: ár = 100.", "lost": false, "line": -1}, {"frm": 0, "to": 1, "label": "3 SET 100", "sync": true, "cache": 100, "db": 100, "seen": 100, "msg": "Az alkalmazás beírja a cache-be (lusta betöltés).", "lost": false, "line": -1}, {"frm": 0, "to": 2, "label": "4 UPDATE ár = 120", "sync": true, "cache": 100, "db": 120, "seen": 120, "msg": "Írás: az alkalmazás közvetlenül az adatbázist frissíti.", "lost": false, "line": -1}, {"frm": 0, "to": 1, "label": "5 DEL product:123", "sync": true, "cache": null, "db": 120, "seen": 120, "msg": "…és a cache-bejegyzést TÖRLI (érvénytelenítés, nem SET); a következő olvasás 120-at tölt be.", "lost": false, "line": -1}], "read-through": [{"frm": 0, "to": 1, "label": "1 GET product:123", "sync": true, "cache": null, "db": 100, "seen": null, "msg": "Az alkalmazás csak a cache-hez fordul.", "lost": false, "line": -1}, {"frm": 1, "to": 2, "label": "2 SELECT → 100", "sync": true, "cache": 100, "db": 100, "seen": null, "msg": "Miss: a CACHE maga tölt be a forrásból.", "lost": false, "line": -1}, {"frm": 1, "to": 0, "label": "3 válasz 100", "sync": true, "cache": 100, "db": 100, "seen": 100, "msg": "A cache visszaadja az értéket; az alkalmazás nem ismeri a forrást.", "lost": false, "line": -1}], "write-through": [{"frm": 0, "to": 1, "label": "1 SET ár = 120", "sync": true, "cache": 120, "db": 100, "seen": null, "msg": "Az alkalmazás a cache-be ír.", "lost": false, "line": -1}, {"frm": 1, "to": 2, "label": "2 UPDATE (szinkron)", "sync": true, "cache": 120, "db": 120, "seen": null, "msg": "A cache szinkron módon továbbítja az írást a forrásba.", "lost": false, "line": -1}, {"frm": 2, "to": 1, "label": "3 ack", "sync": true, "cache": 120, "db": 120, "seen": null, "msg": "Az adatbázis nyugtáz.", "lost": false, "line": -1}, {"frm": 1, "to": 0, "label": "4 ack", "sync": true, "cache": 120, "db": 120, "seen": 120, "msg": "Csak a forrásírás után kap az alkalmazás nyugtát.", "lost": false, "line": -1}], "write-behind": [{"frm": 0, "to": 1, "label": "1 SET ár = 120", "sync": true, "cache": 120, "db": 100, "seen": null, "msg": "Az alkalmazás a cache-be ír.", "lost": false, "line": -1}, {"frm": 1, "to": 0, "label": "2 ack azonnal", "sync": true, "cache": 120, "db": 100, "seen": 120, "msg": "A cache AZONNAL nyugtáz – az adatbázisban még 100 van (inkonzisztencia-ablak).", "lost": false, "line": -1}, {"frm": 1, "to": 2, "label": "3 kötegelt UPDATE", "sync": false, "cache": 120, "db": 120, "seen": 120, "msg": "Később, aszinkron kötegben frissül az adatbázis.", "lost": false, "line": -1}], "write-behind-crash": [{"frm": 0, "to": 1, "label": "1 SET ár = 120", "sync": true, "cache": 120, "db": 100, "seen": null, "msg": "Az alkalmazás a cache-be ír.", "lost": false, "line": -1}, {"frm": 1, "to": 0, "label": "2 ack azonnal", "sync": true, "cache": 120, "db": 100, "seen": 120, "msg": "A cache AZONNAL nyugtáz – az adatbázisban még 100 van (inkonzisztencia-ablak).", "lost": false, "line": -1}, {"frm": 1, "to": 1, "label": "cache összeomlik", "sync": false, "cache": null, "db": 100, "seen": 120, "lost": true, "line": -1, "msg": "A cache összeomlik a kötegelt írás előtt: az adatbázisban 100 marad, a kliens 120-at látott – az írás elveszett."}]};
let PAT = "cache-aside";
function pick(p){ PAT = p; document.querySelectorAll("button.pat").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p)); document.getElementById("crashb").disabled = p !== "write-behind"; setSteps(ALL[p]); }
function crashCache(){ if (PAT !== "write-behind") return; PAT = "write-behind-crash"; setSteps(ALL["write-behind-crash"]); show(STEPS.length - 1); }
function fmt(v){ return v === null ? "—" : String(v); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 330");
  const XS = [110, 300, 490], A = ["Alkalmazás", "Cache", "Adatbázis"], n = STEPS.length;
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker><pattern id="hb" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern>`;
  svg.appendChild(defs);
  el("text", {x: 10, y: 20, "font-size": 14, "font-weight": "bold"}, PAT.replace("-crash", " – cache-összeomlással") + "   (product:123)");
  A.forEach((a, i) => { el("rect", {x: XS[i] - 55, y: 34, width: 110, height: 28, rx: 6, fill: css("--cell"), stroke: css("--line")}); el("text", {x: XS[i], y: 53, "text-anchor": "middle", "font-size": 13}, a); el("line", {x1: XS[i], y1: 62, x2: XS[i], y2: 320, stroke: css("--muted"), "stroke-dasharray": "3 4"}); });
  const dy = Math.min(48, 240 / n);
  STEPS.forEach((q, j) => {
    if (j > k) return;
    const y = 90 + j * dy, cur = j === k;
    if (q.lost) {
      el("text", {x: XS[1], y: y + 5, "text-anchor": "middle", "font-size": 20, "font-weight": "bold", fill: css("--hl2")}, "ϟ");
      el("text", {x: XS[1] - 60, y: y + 30, "font-size": 12.5, "font-weight": "bold"}, "cache összeomlik – az írás elveszett");
      return;
    }
    const x0 = XS[q.frm], x1 = XS[q.to];
    el("line", {x1: x0, y1: y, x2: x1 + (x1 > x0 ? -3 : 3), y2: y, stroke: cur ? css("--hl") : css("--fg"), "stroke-width": cur ? 3 : 1.5, "stroke-dasharray": q.sync ? "" : "8 5", "marker-end": "url(#ah)"});
    el("text", {x: (x0 + x1) / 2, y: y - 6, "text-anchor": "middle", "font-size": 12.5, "font-weight": cur ? "bold" : "normal"}, q.label);
  });
  if (PAT.startsWith("write-behind") && k >= 1 && (s.db !== s.cache)) el("rect", {x: XS[2] - 9, y: 90 + dy - 4, width: 18, height: Math.max(dy, 20), fill: "url(#hb)", stroke: css("--line")});
  const T = 590;
  el("rect", {x: T, y: 80, width: 160, height: 125, fill: "none", stroke: css("--line")});
  el("text", {x: T + 8, y: 100, "font-size": 12.5, "font-weight": "bold"}, "Állapot (ár)");
  el("text", {x: T + 8, y: 125, "font-size": 12.5}, `cache: ${fmt(s.cache)}`);
  el("text", {x: T + 8, y: 150, "font-size": 12.5}, `adatbázis: ${fmt(s.db)}`);
  el("text", {x: T + 8, y: 175, "font-size": 12.5}, `kliens utoljára: ${fmt(s.seen)}`);
  if (s.lost) el("text", {x: T + 8, y: 197, "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "elveszett írás!");
  el("text", {x: 10, y: 322, "font-size": 11.5, fill: css("--muted")}, "folytonos nyíl = szinkron, szaggatott = aszinkron; sraffozott sáv = a cache és a DB eltér");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
