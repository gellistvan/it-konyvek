<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatszerződés v1 → v2 átállás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>effectiveDate: <input type="range" id="eff" min="0" max="120" value="31" style="width:100px"> <b id="veff">2026-02-01</b></label> <label>notice (nap): <input type="range" id="nd" min="15" max="180" value="90" style="width:90px"> <b id="vnd">90</b></label> <label>parallelSupportUntil: <input type="range" id="psu" min="90" max="260" value="212" style="width:100px"> <b id="vpsu">2026-08-01</b></label> <label>ma: <input type="range" id="today" min="0" max="272" value="104" style="width:120px"> <b id="vtoday">2026-04-15</b></label> <label><input type="checkbox" id="g0"> minden ismert fogyasztó migrált</label> <label><input type="checkbox" id="g1"> v2-integráció tesztelt</label> <label><input type="checkbox" id="g2"> v1 hívások = 0</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="v2 február 1-jétől, v1 augusztus 1-jéig párhuzamosan; az értesítés legkésőbb május 3-án megy ki; a visszavonás feltétele a nulla v1-forgalom."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A notice határideje = parallelSupportUntil − notice napjai (90 napnál 2026-05-03, 60 napnál 2026-06-02). A visszavonás csak akkor hajtható végre, ha a kapu mindhárom migrációs bizonyítéka teljesül.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Ma: 2026-04-15. v2 érvényes; a deprecation noticenak legkésőbb 2026-05-03-ig ki kell mennie (még 18 nap); v1 párhuzamosan támogatott 2026-08-01-ig.", "e": 1769904000000, "p": 1785542400000, "dl": 1777766400000, "today": 1776211200000, "g": [false, false, false]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const T0 = Date.UTC(2026, 0, 1), DAY = 86400000, GATE = ["minden ismert fogyasztó migrált", "v2-integráció tesztelt", "v1 hívások = 0"];
function iso(t){ return new Date(t).toISOString().slice(0, 10); }
function st(){ const e = T0 + (+document.getElementById("eff").value) * DAY, p = T0 + (+document.getElementById("psu").value) * DAY,
  n = +document.getElementById("nd").value, today = T0 + (+document.getElementById("today").value) * DAY, dl = p - n * DAY,
  g = [0, 1, 2].map(i => document.getElementById("g" + i).checked);
  document.getElementById("veff").textContent = iso(e); document.getElementById("vpsu").textContent = iso(p); document.getElementById("vnd").textContent = n; document.getElementById("vtoday").textContent = iso(today);
  const due = [];
  if (today < e) due.push("v2 még nem érvényes (effectiveDate " + iso(e) + ")"); else due.push("v2 érvényes");
  if (today <= dl) due.push("a deprecation noticenak legkésőbb " + iso(dl) + "-ig ki kell mennie (még " + Math.round((dl - today) / DAY) + " nap)");
  else if (today < p) due.push("a notice határideje (" + iso(dl) + ") lejárt – a noticenak már kint kell lennie");
  if (today < p) due.push("v1 párhuzamosan támogatott " + iso(p) + "-ig");
  else due.push(g.every(x => x) ? "visszavonás végrehajtható: mindhárom migrációs bizonyíték teljesül" : "visszavonás TILTOTT: hiányzó bizonyíték – " + GATE.filter((x, i) => !g[i]).join(", "));
  return {msg: "Ma: " + iso(today) + ". " + due.join("; ") + ".", e: e, p: p, dl: dl, today: today, g: g}; }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 300");
  svg.innerHTML = ""; defs0();
  const X = t => 30 + (t - T0) / DAY * 2.2, end = T0 + 272 * DAY;
  for (let m = 0; m < 10; m++) { const t = Date.UTC(2026, m, 1); L(X(t), 236, X(t), 242); if (m < 9) T(X(t) + 32, 256, (m + 1 < 10 ? "0" : "") + (m + 1) + ".", {"font-size": 11, "text-anchor": "middle"}); }
  L(X(T0), 236, X(end), 236);
  R(X(T0), 130, X(s.p) - X(T0), 26, {rx: 0, fill: "url(#hat)"}); R(X(T0) + 4, 136, 26, 14, {rx: 1, fill: css("--bg"), stroke: "none"}); T(X(T0) + 8, 148, "v1", {"font-size": 12, "font-weight": "bold"});
  R(X(s.e), 170, X(end) - X(s.e), 26, {rx: 0, fill: css("--fg")}); T(X(s.e) + 6, 188, "v2", {"font-size": 12, "font-weight": "bold", fill: css("--bg")});
  [[s.e, "effectiveDate"], [s.dl, "notice határideje"], [s.p, "retirement"]].forEach(([t, l], i) => { L(X(t), 40 + i * 22, X(t), 236, {"stroke-dasharray": "5 4"}); T(X(t) + 3, 36 + i * 22, l + " " + iso(t), {"font-size": 11}); });
  const ok = s.g.every(x => x), gx = X(s.p) - 14;
  el("polygon", {points: [gx, 200, gx + 12, 212, gx, 224, gx - 12, 212].join(","), fill: ok ? css("--cell") : "url(#hat)", stroke: ok ? css("--line") : css("--hl2"), "stroke-width": 2});
  if (!ok) { L(X(s.p) - 40, 128, X(s.p) + 40, 158, {stroke: css("--hl2"), "stroke-width": 3}); T(X(s.p) + 8, 126, "visszavonás tiltott", {"font-size": 11, fill: css("--hl2"), "font-weight": "bold"}); }
  L(X(s.today), 30, X(s.today), 246, {stroke: css("--hl"), "stroke-width": 2.5}); T(X(s.today), 274, "ma", {"font-size": 12, "text-anchor": "middle", fill: css("--hl"), "font-weight": "bold"});
}
function upd(){ setSteps([st()]); }
["eff", "psu", "nd", "today", "g0", "g1", "g2"].forEach(id => document.getElementById(id).addEventListener("input", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
