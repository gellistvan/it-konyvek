<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az online könyvtár context mapje</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="hlk"> „Könyv” vs. „Példány” kiemelése</label> <span class="small">Élre vagy kontextusra kattintva a kártyája jelenik meg.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy bounded context; a Katalógus nyílt szolgáltatást ad, a Kölcsönzés ACL-lel fordít, a Számlázás a késedelmi díj eseményéhez alkalmazkodik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">U/D: upstream/downstream; OHS: Open Host Service, PL: Published Language, ACL: Anticorruption Layer, CF: Conformist. Folytonos: szinkron REST; szaggatott: aszinkron esemény. Szemléltető példa a 15.1.9 definíciói szerint.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Él: Katalógus (U, OHS/PL) → Kölcsönzés (D, ACL); Könyv-adatok, REST, szinkron, timeout 3 s. Hibatűrés: timeout 3 s; a Kölcsönzés a saját Példány-modelljével tovább működik. Mi tör el, ha az upstream változik? a Katalógus publikált nyelvének (PL) törő változása csak az ACL fordítóját érinti, a Kölcsönzés modelljét nem.", "on": "k1"}, {"msg": "Él: Kölcsönzés (U, PL) → Számlázás (D, CF); KesedelmiDijKeletkezett v1, aszinkron, retry. Hibatűrés: üzenetsor + retry; idempotens fogyasztó. Mi tör el, ha az upstream változik? a Számlázás conformist: az esemény sémájának törő változása a Számlázást töri, ezért verziózott (v1) esemény kell.", "on": "k2"}, {"msg": "Él: Számlázás (U, OHS) → Kölcsönzés (D, ACL); tartozás lekérdezése, REST, szinkron. Hibatűrés: timeout; elérhetetlenségnél a hosszabbítás tiltva (biztonságos alapérték). Mi tör el, ha az upstream változik? a Számlázás OHS-ének változását a Kölcsönzés ACL-je fordítja; a két irány külön kapcsolat, kölcsönös függés.", "on": "k3"}, {"msg": "Él: Olvasó (U, OHS) → Kölcsönzés (D, CF); tagság ellenőrzése, REST, szinkron. Hibatűrés: timeout; cache-elt tagsági állapot. Mi tör el, ha az upstream változik? a Kölcsönzés conformist az Olvasó modelljéhez: a Tagság szerkezetének változása közvetlenül érinti.", "on": "k4"}, {"msg": "Katalógus: Könyv = bibliográfiai rekord (szerző, cím, ISBN, kiadó, leírás). Publikált nyelvet (PL) ad nyílt szolgáltatáson (OHS).", "on": "kat"}, {"msg": "Kölcsönzés: Példány (leltári szám, állapot, polc), Kölcsönzés (aggregate root), Hosszabbítás (értékobjektum), Lejárat. Itt nem „Könyv”, hanem „Példány”.", "on": "kol"}, {"msg": "Számlázás: Díj (értékobjektum), Számla (aggregate root), Befizetés.", "on": "sza"}, {"msg": "Olvasó: Olvasó, Tagság, elérhetőségek.", "on": "olv"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const CTX = {"kat": [4, 56, 38, 28, "Katalógus", ["Könyv (bibliográfiai rekord)", "szerző, cím, ISBN"]], "kol": [64, 28, 40, 34, "Kölcsönzés", ["Példány (leltári szám)", "Kölcsönzés", "Hosszabbítás", "Lejárat"]], "sza": [122, 28, 36, 34, "Számlázás", ["Díj", "Számla", "Befizetés"]], "olv": [4, 4, 38, 24, "Olvasó", ["Olvasó", "Tagság"]]}, ED = [["k1", "kat", "kol", "OHS/PL", "ACL", "Könyv-adatok\nREST, szinkron, timeout 3 s", true, "timeout 3 s; a Kölcsönzés a saját Példány-modelljével tovább működik", "a Katalógus publikált nyelvének (PL) törő változása csak az ACL fordítóját érinti, a Kölcsönzés modelljét nem"], ["k2", "kol", "sza", "PL", "CF", "KesedelmiDijKeletkezett v1\naszinkron, retry", false, "üzenetsor + retry; idempotens fogyasztó", "a Számlázás conformist: az esemény sémájának törő változása a Számlázást töri, ezért verziózott (v1) esemény kell"], ["k3", "sza", "kol", "OHS", "ACL", "tartozás lekérdezése\nREST, szinkron", true, "timeout; elérhetetlenségnél a hosszabbítás tiltva (biztonságos alapérték)", "a Számlázás OHS-ének változását a Kölcsönzés ACL-je fordítja; a két irány külön kapcsolat, kölcsönös függés"], ["k4", "olv", "kol", "OHS", "CF", "tagság ellenőrzése\nREST, szinkron", true, "timeout; cache-elt tagsági állapot", "a Kölcsönzés conformist az Olvasó modelljéhez: a Tagság szerkezetének változása közvetlenül érinti"]];
let HL = false;
function render(s){
  svg.setAttribute("viewBox", "0 0 162 92");
  svg.innerHTML = ""; defs0();
  const dd = el("defs", {}); dd.innerHTML = `<marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker><marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.4" markerHeight="3.4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--hl")}"/></marker>`;
  const Y = (y, h) => 88 - y - h;
  Object.keys(CTX).forEach(k => { const c = CTX[k], on = s.on === k, y = Y(c[1], c[3]);
    const r = R(c[0], y, c[2], c[3], {rx: 4, "stroke-width": on ? 0.9 : 0.45, stroke: on ? css("--hl") : css("--line"), fill: on ? css("--cellhl") : css("--cell")});
    r.style.cursor = "pointer"; r.addEventListener("click", () => show(4 + Object.keys(CTX).indexOf(k)));
    T(c[0] + c[2] / 2, y + 5, c[4], {"font-size": 3.4, "font-weight": "bold", "text-anchor": "middle", "pointer-events": "none"});
    c[5].forEach((it, i) => { const hot = HL && (it.startsWith("Könyv") || it.startsWith("Példány"));
      if (hot) R(c[0] + 2, y + 8.3 + i * 4, c[2] - 4, 4, {rx: 1, fill: "url(#hat)", "stroke-width": 0.3});
      T(c[0] + c[2] / 2, y + 11.3 + i * 4, it, {"font-size": 2.8, "text-anchor": "middle", "font-weight": hot ? "bold" : "normal", "pointer-events": "none"}); }); });
  const P = {k1: [[42, 18], [64, 33]], k2: [[104, 33.5], [122, 33.5]], k3: [[122, 51.5], [104, 51.5]], k4: [[42, 72], [64, 53]]};
  ED.forEach((e, i) => { const p = P[e[0]], on = s.on === e[0];
    const ln = L(p[0][0], p[0][1], p[1][0], p[1][1], {"stroke-width": on ? 0.9 : 0.45, stroke: on ? css("--hl") : css("--line"), "stroke-dasharray": e[6] ? "" : "2 1.2", "marker-end": on ? "url(#mh)" : "url(#ms)"});
    const hit = L(p[0][0], p[0][1], p[1][0], p[1][1], {"stroke-width": 4, stroke: "transparent"}); hit.style.cursor = "pointer"; hit.addEventListener("click", () => show(i));
    T(p[0][0] + (p[1][0] > p[0][0] ? 1 : -1) * 1, p[0][1] - 1.5, "U·" + e[3], {"font-size": 2.6, "font-weight": "bold", "text-anchor": p[1][0] > p[0][0] ? "start" : "end"});
    T(p[1][0] + (p[1][0] > p[0][0] ? -1 : 1) * 1, p[1][1] + 3.6, "D·" + e[4], {"font-size": 2.6, "font-weight": "bold", "text-anchor": p[1][0] > p[0][0] ? "end" : "start"}); });
}
document.getElementById("hlk").addEventListener("change", e => { HL = e.target.checked; show(+document.getElementById("pos").value); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
