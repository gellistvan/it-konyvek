<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatter-gather</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>A: <input type="range" id="tA" min="10" max="600" step="10" value="120" style="width:90px"> <b id="vA">120</b> ms <input type="checkbox" id="lA"> elveszett</label> <label>B: <input type="range" id="tB" min="10" max="600" step="10" value="450" style="width:90px"> <b id="vB">450</b> ms <input type="checkbox" id="lB"> elveszett</label> <label>C: <input type="range" id="tC" min="10" max="600" step="10" value="200" style="width:90px"> <b id="vC">200</b> ms <input type="checkbox" id="lC" checked> elveszett</label> <label>határidő: <input type="range" id="dl" min="50" max="600" step="10" value="300" style="width:90px"> <b id="vdl">300</b> ms</label> <label>stratégia: <select id="strat"><option value="deadline">határidőre</option><option value="first">első győz</option><option value="all">mindre várj</option></select></label> <button id="rst">aggregátor újraindul</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három szolgáltatásnak kiküldött kérés, két válasz eltérő időben, egy elveszett; a három aggregációs stratégia eltérő eredményt ad."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az „aggregátor újraindul” gomb az aktuális lépés után törli a nem perzisztált állapotot. Az időadatok elméleti modell, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "t = 0 ms: scatter – a router kiküldi a kérést A, B, C felé, correlation_id = k-17.", "t": 0, "got": [], "state": true, "done": null}, {"msg": "t = 120 ms: A válasza beérkezik (k-17); beérkezett {A} / várt 3.", "t": 120, "got": ["A"], "state": true, "done": null}, {"msg": "t = 300 ms: határidő – kimenet: {A} (részleges).", "t": 300, "got": ["A"], "state": true, "done": [300, ["A"]]}, {"msg": "t = 450 ms: B válasza későn érkezik – a kimenet már elment, eldobva/naplózva.", "t": 450, "got": ["A"], "state": true, "done": [300, ["A"]]}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

function evs(cfg, strat, restart){
  const ev = [[0, "send", null]]; ["A", "B", "C"].forEach(s => { if (cfg[s] !== null) ev.push([cfg[s], "resp", s]); });
  if (strat === "deadline") ev.push([cfg.deadline, "deadline", null]);
  if (restart !== null) ev.push([restart, "restart", null]);
  const ord = {send: 0, resp: 1, restart: 2, deadline: 3};
  ev.sort((a, b) => a[0] - b[0] || ord[a[1]] - ord[b[1]]);
  let state = true, got = [], done = null; const st = [];
  ev.forEach(([t, kind, s]) => { let msg;
    if (kind === "send") msg = "t = 0 ms: scatter – a router kiküldi a kérést A, B, C felé, correlation_id = k-17.";
    else if (kind === "restart") { state = false; got = []; msg = "t = " + t + " ms: az aggregátor újraindul – a nem perzisztált állapot (k-17) elveszett."; }
    else if (kind === "resp") {
      if (!state) msg = "t = " + t + " ms: " + s + " válasza (k-17) ismeretlen korreláció – eldobva/naplózva.";
      else if (done !== null) msg = "t = " + t + " ms: " + s + " válasza későn érkezik – a kimenet már elment, eldobva/naplózva.";
      else { got.push(s); msg = "t = " + t + " ms: " + s + " válasza beérkezik (k-17); beérkezett {" + got.join(", ") + "} / várt 3.";
        if (strat === "first") { done = [t, [s]]; msg += " Első győz → kimenet: {" + s + "}."; }
        else if (strat === "all" && got.length === 3) { done = [t, got.slice().sort()]; msg += " Mind megjött → kimenet."; } }
    } else {
      if (state && done === null) { done = [t, got.slice().sort()]; msg = "t = " + t + " ms: határidő – kimenet: {" + got.slice().sort().join(", ") + "}" + (got.length < 3 ? " (részleges)." : "."); }
      else msg = "t = " + t + " ms: határidő – nincs állapot, nincs kimenet.";
    }
    st.push({msg: msg, t: t, got: got.slice(), state: state, done: done}); });
  if (done === null) st.push({msg: "Nincs kimenet: " + (strat === "all" && state ? "valamelyik válasz hiányzik, a „mindre várj” végtelenül vár (időkorlát nélkül)." : "az állapot elveszett, a folyamat újrapróbálása kell."), t: st[st.length - 1].t, got: got.slice(), state: state, done: null});
  return st;
}
let CUR = {A: 120, B: 450, C: null, deadline: 300}, RST = null;
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330");
  svg.innerHTML = ""; defs0();
  const XT = t => 96 + t * 0.9, Y = {Agg: 40, A: 110, B: 160, C: 210};
  [["Agg", "aggregátor"], ["A", "A"], ["B", "B"], ["C", "C"]].forEach(([k, n]) => { T(88, Y[k] + 4, n, {"font-size": 12, "text-anchor": "end", "font-weight": "bold"}); L(96, Y[k], 650, Y[k], {stroke: css("--muted"), "stroke-width": 0.7, "stroke-dasharray": "3 3"}); });
  for (let t = 0; t <= 600; t += 100) T(XT(t), 250, t + " ms", {"font-size": 10.5, "text-anchor": "middle", fill: css("--muted")});
  L(XT(CUR.deadline), 22, XT(CUR.deadline), 236, {"stroke-width": 2, "stroke-dasharray": "6 4"}); T(XT(CUR.deadline) + 4, 26, "határidő " + CUR.deadline + " ms", {"font-size": 11});
  L(XT(s.t), 30, XT(s.t), 236, {stroke: css("--hl"), "stroke-width": 2});
  ["A", "B", "C"].forEach(k => { A(XT(0), Y.Agg, XT(0) + 14, Y[k], {}); const t = CUR[k];
    if (t === null) { X(XT(0) + 60, Y[k], 7); T(XT(0) + 74, Y[k] + 4, "elveszett", {"font-size": 11}); }
    else if (t <= s.t) { A(XT(t), Y[k], XT(t) + 0.5, Y.Agg + 6, {"stroke-dasharray": "5 3"}); T(XT(t) + 4, Y[k] - 5, k + ": " + t + " ms", {"font-size": 11}); }
    else T(XT(t) + 4, Y[k] - 5, k + ": " + t + " ms (még nincs)", {"font-size": 11, fill: css("--muted")}); });
  if (RST !== null) { X(XT(RST), Y.Agg, 8); T(XT(RST) + 10, Y.Agg - 8, "újraindulás", {"font-size": 11}); }
  R(10, 262, 640, 60, {rx: 2, fill: css("--code")});
  T(18, 280, "aggregátor állapot: " + (s.state ? "k-17: várt 3, beérkezett {" + s.got.join(", ") + "}" : "ÜRES (újraindult, nem perzisztált)"), {"font-size": 12.5, "font-family": "ui-monospace,monospace"});
  T(18, 304, "kimenet: " + (s.done ? "{" + s.done[1].join(", ") + "} @ " + s.done[0] + " ms" : "– (még nincs)"), {"font-size": 12.5, "font-weight": "bold"});
}
function recompute(){
  ["A", "B", "C"].forEach(k => { const v = +document.getElementById("t" + k).value; document.getElementById("v" + k).textContent = v; CUR[k] = document.getElementById("l" + k).checked ? null : v; });
  CUR.deadline = +document.getElementById("dl").value; document.getElementById("vdl").textContent = CUR.deadline;
  setSteps(evs(CUR, document.getElementById("strat").value, RST));
}
["tA", "tB", "tC", "lA", "lB", "lC", "dl", "strat"].forEach(id => document.getElementById(id).addEventListener("input", () => { RST = null; recompute(); }));
document.getElementById("rst").addEventListener("click", () => { RST = STEPS[+document.getElementById("pos").value].t + 1; recompute(); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
