<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esettanulmány-elemzés négy lépése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy egymást követő lépés kimeneteikkel; szaggatott nyilak minden későbbi lépésből a korábbiakba."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 29.1 négy elemzési lépése és a sablonszakaszok (2–5.) kimenetei; az 5. lépés a Rendeléskezelő-példa két visszacsatolását emeli ki, a 6. az összeset.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"on": [1], "fw": 0, "fb": [], "msg": "1. Kontextus rekonstruálása → kontextustáblázat: idő, üzlet, technika, forrással, információtípussal és bizonyossággal; a hiányzó elemek listája (Rendeléskezelő: a csapatméret ismeretlen)."}, {"on": [2], "fw": 1, "fb": [], "msg": "2. Döntések rekonstruálása → döntési napló (D-1: monolitikus PHP, 2017)."}, {"on": [3], "fw": 2, "fb": [], "msg": "3. Következmények értékelése → szándékolt és nem szándékolt következmények, reverzibilitás, korrekciós döntések."}, {"on": [4], "fw": 3, "fb": [], "msg": "4. Tanulságok kivonása → kontextusfüggő, feltételes és elv szintű tanulság."}, {"on": [], "fw": 3, "fb": [[3, 2], [4, 1]], "msg": "Visszacsatolás a példán: a következmények értékelésekor kiderül a D-2 (2019, ajánlószolgáltatás), ezért vissza a döntési naplóhoz (3→2); a tanulság nem igazolható a hiányzó csapatméret nélkül, ezért vissza a kontextushoz (4→1)."}, {"on": [], "fw": 3, "fb": [[2, 1], [3, 2], [3, 1], [4, 2], [4, 1]], "msg": "Minden visszacsatolás: bármely későbbi lépés felfedezése árnyalhatja a korábbi lépések megállapításait (2→1, 3→1, 3→2, 4→1, 4→2) – az elemzés iteratív."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"W": 6.4, "H": 3.65, "BW": 1.39, "BH": 1.1, "BY": 1.55, "XC": [0.7550000000000003, 2.3850000000000002, 4.015000000000001, 5.6450000000000005], "X0": 0.060000000000000386, "steps": [["1. Kontextus\nrekonstruálása", "kontextustáblázat\n(idő, üzlet, technika)"], ["2. Döntések\nrekonstruálása", "döntési napló\n(D-1, D-2 …)"], ["3. Következmények\nértékelése", "szándékolt / nem\nszándékolt hatás,\nreverzibilitás"], ["4. Tanulságok\nkivonása", "három szint:\nkontextusfüggő,\nfeltételes, elvi"]], "lanes": [{"a": 2, "b": 1, "t": "kontextusadat\nkerül elő", "side": "fel", "pts": [[2.1350000000000002, 2.6500000000000004], [2.1350000000000002, 2.95], [1.0050000000000003, 2.95], [1.0050000000000003, 2.6500000000000004]], "lab": [1.5700000000000003, 3.1500000000000004]}, {"a": 3, "b": 2, "t": "új döntés\nderül ki", "side": "fel", "pts": [[3.7650000000000006, 2.6500000000000004], [3.7650000000000006, 2.95], [2.6350000000000002, 2.95], [2.6350000000000002, 2.6500000000000004]], "lab": [3.2, 3.1500000000000004]}, {"a": 3, "b": 1, "t": "új kényszer derül ki", "side": "le", "pts": [[3.6950000000000007, 1.55], [3.6950000000000007, 1.25], [1.0750000000000004, 1.25], [1.0750000000000004, 1.55]], "lab": [2.0100000000000002, 1.25]}, {"a": 4, "b": 2, "t": "döntés újravizsgálata", "side": "le", "pts": [[5.325, 1.55], [5.325, 0.93], [2.705, 0.93], [2.705, 1.55]], "lab": [4.015000000000001, 0.93]}, {"a": 4, "b": 1, "t": "hiányzó kontextus", "side": "le", "pts": [[5.965000000000001, 1.55], [5.965000000000001, 0.6100000000000001], [0.43500000000000033, 0.6100000000000001], [0.43500000000000033, 1.55]], "lab": [3.2000000000000006, 0.6100000000000001]}]}, S = 125;
function X(v){ return v * S; } function Y(v){ return (G.H - v) * S; }
function tx(x, y, t, o){
  const lines = String(t).split("\n"), e = el("text", Object.assign({x: x, y: y, "font-size": 12, "text-anchor": "middle"}, o || {}));
  lines.forEach((l, j) => { const s = document.createElementNS(NS, "tspan"); s.setAttribute("x", x); s.setAttribute("dy", j ? "1.1em" : (-(lines.length - 1) * 0.55 + 0.35) + "em"); s.textContent = l; e.appendChild(s); });
  return e;
}
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${G.W * S} ${G.H * S}`);
  const fg = css("--fg"), hl = css("--hl"), hl2 = css("--hl2"), mu = css("--muted");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${fg}"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${hl2}"/></marker>`;
  svg.appendChild(defs);
  G.steps.forEach((st, i) => {
    const on = s.on.includes(i + 1), x = G.XC[i] - G.BW / 2, done = i <= s.fw;
    el("rect", {x: X(x), y: Y(G.BY + G.BH), width: X(G.BW), height: X(G.BH), rx: 8, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? hl : (done ? fg : mu), "stroke-width": on ? 3.5 : 1.6});
    tx(X(G.XC[i]), Y(G.BY + G.BH - 0.24), st[0], {"font-weight": "bold", fill: done ? fg : mu});
    if (done) tx(X(G.XC[i]), Y(G.BY + 0.3), "→ " + st[1], {"font-style": "italic", "font-size": 11.5});
    if (i < 3 && i < s.fw) el("line", {x1: X(x + G.BW), y1: Y(G.BY + G.BH / 2), x2: X(G.XC[i + 1] - G.BW / 2) - 2, y2: Y(G.BY + G.BH / 2), stroke: fg, "stroke-width": 3, "marker-end": "url(#ah)"});
  });
  G.lanes.forEach(L => {
    const act = s.fb.some(f => f[0] === L.a && f[1] === L.b);
    if (!act) return;
    const ex = s.fb.length < 5, col = ex ? hl2 : fg;
    el("polyline", {points: L.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: col, "stroke-width": ex ? 2.6 : 1.6, "stroke-dasharray": "8 5", "marker-end": ex ? "url(#ah2)" : "url(#ah)"});
    tx(X(L.lab[0]), Y(L.lab[1]), L.t, {"font-size": 11.5, stroke: css("--bg"), "stroke-width": 5, "paint-order": "stroke", fill: col});
  });
  el("rect", {x: X(G.X0), y: Y(0.36), width: X(G.W - 2 * G.X0), height: X(0.3), fill: css("--cellhl"), stroke: fg});
  tx(X(G.W / 2), Y(0.21), "Források és bizonytalanság jelölése – minden lépésben", {"font-size": 12});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
