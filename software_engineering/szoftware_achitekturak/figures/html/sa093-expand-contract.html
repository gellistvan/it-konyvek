<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expand–contract és rollback</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="rbbtn" type="button">Rollback most</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal öt fázissal (T0–T4): a futó kódverzió, a sémaállapot és a lehetséges rollback-mód; alatta az orders tábla négy sora. A Rollback most gomb a v2.3.0 nézetét mutatja: a T2 után soft delete-elt 103-as rendelés újra aktívként jelenik meg, kompenzáció kell."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szintetikus adat; közös adatbázis blue-greennél. A release-terv adatai a fejezet laborvázlatából (v2.3.0 → v2.4.0, a kék 1 órán át készenlétben).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "msg": "T0: fut a v2.3.0, séma S0 (az orders táblában nincs deleted_at oszlop).", "ph": [{"name": "T0", "time": "13:00", "title": "kiinduló állapot", "code": "v2.3.0", "code2": "", "schema": "S0", "schema_txt": "S0: nincs deleted_at", "rb": "nincs változás", "rbk": "none", "msg": "T0: fut a v2.3.0, séma S0 (az orders táblában nincs deleted_at oszlop)."}, {"name": "T1", "time": "13:30", "title": "expand", "code": "v2.3.0", "code2": "", "schema": "S1", "schema_txt": "S1: + deleted_at NULL", "rb": "csak kód", "rbk": "code", "msg": "T1 expand: ALTER TABLE orders ADD COLUMN deleted_at TIMESTAMP NULL; a v2.3.0 tovább fut, a nullable oszlopot nem látja. Rollback: csak kód (a séma maradhat)."}, {"name": "T2", "time": "14:00", "title": "átkapcsolás v2.4.0-ra", "code": "v2.4.0", "code2": "v2.3.0 készenlétben", "schema": "S1", "schema_txt": "S1", "rb": "kód + kompenzáció", "rbk": "comp", "msg": "T2: a forgalom a zöld v2.4.0-ra kerül, a kék v2.3.0 1 órán át készenlétben (közös adatbázis). 14:05-kor a 103-as rendelést soft delete-elik: deleted_at = 2025-06-15 14:05."}, {"name": "T3", "time": "15:00", "title": "visszakapcsolási ablak vége", "code": "v2.4.0", "code2": "", "schema": "S1", "schema_txt": "S1", "rb": "újratelepítés + kompenzáció", "rbk": "comp", "msg": "T3: a visszakapcsolási ablak lejárt, a kék környezet leáll; a kódrollback már újratelepítés, a soft delete-elt sorokhoz továbbra is kompenzáció kell."}, {"name": "T4", "time": "köv. release", "title": "contract", "code": "v2.4.0", "code2": "", "schema": "S1", "schema_txt": "S1 (contract: nincs eltávolítandó elem)", "rb": "forward fix; szűkítés után: mentés (RPO)", "rbk": "backup", "msg": "T4 contract: ennél a változásnál nincs eltávolítandó elem (az oszlop additív volt). Ha egy contract oszlopot törölne, a visszaút már csak mentésből való helyreállítás lenne (RPO)."}], "rows": [[101, "új", "12 400", null], [102, "fizetve", "8 990", null], [103, "új", "23 150", null], [104, "kiszállítva", "4 300", null]], "has_col": false, "v24": [101, 102, 103, 104], "rb": {"level": 0, "txt": "Nincs mit visszaállítani.", "v23": [101, 102, 103, 104], "resurrect": []}}, {"i": 1, "msg": "T1 expand: ALTER TABLE orders ADD COLUMN deleted_at TIMESTAMP NULL; a v2.3.0 tovább fut, a nullable oszlopot nem látja. Rollback: csak kód (a séma maradhat).", "rows": [[101, "új", "12 400", "NULL"], [102, "fizetve", "8 990", "NULL"], [103, "új", "23 150", "NULL"], [104, "kiszállítva", "4 300", "NULL"]], "has_col": true, "v24": [101, 102, 103, 104], "rb": {"level": 1, "txt": "Csak kód: A kód és a konfiguráció visszaállítása csak a telepített verziót cseréli vissza; a már végrehajtott tranzakciók mellékhatásait nem vonja vissza. Itt még nincs mellékhatás, a kibővített séma maradhat.", "v23": [101, 102, 103, 104], "resurrect": []}}, {"i": 2, "msg": "T2: a forgalom a zöld v2.4.0-ra kerül, a kék v2.3.0 1 órán át készenlétben (közös adatbázis). 14:05-kor a 103-as rendelést soft delete-elik: deleted_at = 2025-06-15 14:05.", "rows": [[101, "új", "12 400", "NULL"], [102, "fizetve", "8 990", "NULL"], [103, "új", "23 150", "2025-06-15 14:05"], [104, "kiszállítva", "4 300", "NULL"]], "has_col": true, "v24": [101, 102, 104], "rb": {"level": 2, "txt": "A kód és a konfiguráció visszaállítása csak a telepített verziót cseréli vissza; a már végrehajtott tranzakciók mellékhatásait nem vonja vissza. A tranzakció-kompenzáció üzleti műveletekkel ellensúlyozza ezeket a hatásokat. A v2.3.0 a 103-as rendelést aktívként látja: kompenzáció szükséges.", "v23": [101, 102, 103, 104], "resurrect": [103]}}, {"i": 3, "msg": "T3: a visszakapcsolási ablak lejárt, a kék környezet leáll; a kódrollback már újratelepítés, a soft delete-elt sorokhoz továbbra is kompenzáció kell.", "rows": [[101, "új", "12 400", "NULL"], [102, "fizetve", "8 990", "NULL"], [103, "új", "23 150", "2025-06-15 14:05"], [104, "kiszállítva", "4 300", "NULL"]], "has_col": true, "v24": [101, 102, 104], "rb": {"level": 2, "txt": "A kód és a konfiguráció visszaállítása csak a telepített verziót cseréli vissza; a már végrehajtott tranzakciók mellékhatásait nem vonja vissza. A tranzakció-kompenzáció üzleti műveletekkel ellensúlyozza ezeket a hatásokat. A v2.3.0 a 103-as rendelést aktívként látja: kompenzáció szükséges.", "v23": [101, 102, 103, 104], "resurrect": [103]}}, {"i": 4, "msg": "T4 contract: ennél a változásnál nincs eltávolítandó elem (az oszlop additív volt). Ha egy contract oszlopot törölne, a visszaút már csak mentésből való helyreállítás lenne (RPO).", "rows": [[101, "új", "12 400", "NULL"], [102, "fizetve", "8 990", "NULL"], [103, "új", "23 150", "2025-06-15 14:05"], [104, "kiszállítva", "4 300", "NULL"]], "has_col": true, "v24": [101, 102, 104], "rb": {"level": 3, "txt": "Ennél a változásnál a contract nem töröl semmit, így a visszaút forward fix vagy kód + kompenzáció; szűkítő contract után: A mentésből való helyreállítás a legdurvább eszköz: RPO-val kell számolni.", "v23": [101, 102, 103, 104], "resurrect": [103]}}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let RBON = false, LASTI = -1;
const PHS = STEPS[0].ph;
const SH = ["kiinduló", "expand", "átkapcsolás", "ablak vége", "contract"], TM = ["13:00", "13:30", "14:00", "15:00", "később"];
const SCHS = ["S0", "S1: + deleted_at", "S1", "S1", "S1, nincs mit törölni"];
const RBS = ["nincs változás", "csak kód", "kód + kompenzáció", "újratelep. + kompenz.", "forward fix / mentés"];
function render(s){
  if (s.i !== LASTI) { RBON = false; LASTI = s.i; }
  document.getElementById("rbbtn").textContent = RBON ? "Vissza a normál nézethez" : "Rollback most";
  svg.setAttribute("viewBox", "0 0 760 360");
  svg.innerHTML = "";
  const X0 = 100, SW = 128;
  const lab = [["futó kód", 70], ["séma", 140], ["rollback-mód", 205]];
  lab.forEach(([t, y]) => el("text", {x: X0 - 8, y: y, "text-anchor": "end", "font-size": 13, "font-weight": "bold"}, t));
  PHS.forEach((p, i) => {
    const x = X0 + i * SW, cur = i === s.i, past = i <= s.i;
    el("text", {x: x + 4, y: 16, "font-size": 13, "font-weight": "bold", fill: cur ? css("--hl") : css("--fg")}, `${p.name} ${TM[i]}`);
    el("text", {x: x + 4, y: 32, "font-size": 11}, SH[i]);
    const op = past ? 1 : 0.3;
    el("rect", {x: x, y: 45, width: SW, height: 40, fill: p.code === "v2.4.0" ? css("--cellhl") : css("--cell"), stroke: css("--line"), opacity: op});
    el("text", {x: x + SW/2, y: 70, "text-anchor": "middle", "font-size": 12, opacity: op}, p.code + (p.code2 ? " + kék v2.3.0" : ""));
    el("rect", {x: x + 3, y: 118, width: SW - 6, height: 38, fill: "none", stroke: css("--line"), "stroke-width": p.schema === "S0" ? 1 : 2, "stroke-dasharray": p.schema === "S0" ? "" : "6 3", opacity: op});
    el("text", {x: x + SW/2, y: 141, "text-anchor": "middle", "font-size": 11, opacity: op}, SCHS[i]);
    el("rect", {x: x, y: 185, width: SW, height: 34, fill: p.rbk === "comp" ? css("--cellhl") : (p.rbk === "backup" ? css("--cellhl") : css("--cell")), "stroke-width": p.rbk === "backup" ? 2.5 : 1, stroke: css("--line"), opacity: op});
    el("text", {x: x + SW/2, y: 206, "text-anchor": "middle", "font-size": 11, opacity: op}, RBS[i]);
  });
  el("rect", {x: X0 + s.i * SW, y: 2, width: SW, height: 222, fill: "none", stroke: css("--hl"), "stroke-width": 3});
  // tábla
  const ty = 250;
  const view = RBON ? "Rollback után: a v2.3.0 nézete (nem ismeri a deleted_at oszlopot)" : (s.i >= 2 ? "orders tábla, a v2.4.0 nézete" : "orders tábla, a v2.3.0 nézete");
  el("text", {x: 10, y: ty, "font-size": 13, "font-weight": "bold"}, view);
  const cols = (s.has_col && !RBON) ? ["id", "státusz", "összeg", "deleted_at"] : ["id", "státusz", "összeg"];
  const cx = [10, 70, 180, 280];
  cols.forEach((c, j) => el("text", {x: cx[j], y: ty + 22, "font-size": 12, "font-weight": "bold"}, c));
  s.rows.forEach((r, q) => {
    const y = ty + 42 + q * 20;
    const hidden = !RBON && s.i >= 2 && s.v24.indexOf(r[0]) < 0;
    const res = RBON && s.rb.resurrect.indexOf(r[0]) >= 0;
    if (res) el("rect", {x: 4, y: y - 15, width: 300, height: 19, fill: css("--cellhl"), stroke: css("--hl2"), "stroke-width": 2});
    cols.forEach((c, j) => el("text", {x: cx[j], y: y, "font-size": 12, fill: hidden ? css("--muted") : css("--fg"), "text-decoration": hidden ? "line-through" : "none"}, String(r[j] === null ? "" : r[j])));
    if (res) el("text", {x: 312, y: y, "font-size": 12, "font-weight": "bold", fill: css("--hl2")}, "újra aktív \u2013 kompenzáció szükséges");
    if (hidden) el("text", {x: 420, y: y, "font-size": 11, fill: css("--muted")}, "(soft delete: a v2.4.0 nem listázza)");
  });
  if (RBON) status.textContent = `Rollback ${PHS[s.i].name} után (${PHS[s.i].rb}): ` + s.rb.txt;
}
document.getElementById("rbbtn").addEventListener("click", () => { RBON = !RBON; show(k); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
