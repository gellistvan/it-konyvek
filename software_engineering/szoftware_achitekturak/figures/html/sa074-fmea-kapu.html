<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMEA: RPN-küszöb és súlyossági kapu</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>RPN-küszöb (>): <input id="thr" type="range" min="10" max="300" step="1" value="80" oninput="recalc()" style="width:100px" aria-label="RPN-küszöb (>):"> <span id="thrv">80</span></label> <label>súlyossági kapu S ≥ <input id="sg" type="range" min="5" max="10" step="1" value="9" oninput="recalc()" style="width:100px" aria-label="súlyossági kapu S ≥"> <span id="sgv">9</span></label> <label>detektálási kapu D ≥ <input id="dg" type="range" min="5" max="10" step="1" value="8" oninput="recalc()" style="width:100px" aria-label="detektálási kapu D ≥"> <span id="dgv">8</span></label> <button onclick="addRow()">Új sor</button> <button onclick="rescore()">Újrapontozás</button></div><div style="overflow-x:auto"><table id="tbl" class="small" style="border-collapse:collapse"></table></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szórásdiagram az előfordulás és a súlyosság síkján; a hibamódok jelölőjének alakja mutatja, hogy az RPN-küszöb, a súlyossági kapu vagy a detektálási kapu miatt kapnak-e intézkedést; felette szerkeszthető S, O, D táblázat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szabály: intézkedés kell, ha RPN > küszöb vagy S ≥ súlyossági kapu; D ≥ detektálási kapu esetén legalább detektálási intézkedés. A küszöböt és a kapukat a csapat rögzíti; a pontszámok a 20.1.9 szemléltető példái. Újrapontozás: az S′, O′, D′ oszlopba az intézkedés utáni értékek írhatók.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let ROWS = [{"name": "A (szövegpélda)", "S": 10, "O": 2, "D": 2, "S2": 10, "O2": 2, "D2": 2}, {"name": "B (szövegpélda)", "S": 4, "O": 5, "D": 5, "S2": 4, "O2": 5, "D2": 5}, {"name": "OOM crash", "S": 8, "O": 3, "D": 2, "S2": 8, "O2": 3, "D2": 2}, {"name": "DB lock", "S": 5, "O": 4, "D": 5, "S2": 5, "O2": 4, "D2": 5}, {"name": "kerekítési hiba", "S": 9, "O": 2, "D": 8, "S2": 9, "O2": 2, "D2": 8}, {"name": "shard-kiesés", "S": 7, "O": 3, "D": 4, "S2": 7, "O2": 3, "D2": 4}], RESC = false;
function g(id){ return +document.getElementById(id).value; }
function cls(S, O, D){ const thr = g("thr"), sg = g("sg"), dg = g("dg"), rpn = S * O * D, why = [];
  if (rpn > thr) why.push(`RPN ${rpn} > ${thr}`); if (S >= sg) why.push(`S ≥ ${sg} (kapu)`); if (D >= dg) why.push(`D ≥ ${dg} (detektálás)`);
  return {rpn: rpn, act: why.length > 0, why: why, mk: D >= dg ? "star" : rpn > thr ? "square" : S >= sg ? "triangle" : "circle"}; }
function cell(i, f, v){ return `<td><input type="number" min="1" max="10" value="${v}" data-i="${i}" data-f="${f}" oninput="edit(this)" style="width:3.2em" aria-label="${f} sor ${i + 1}"></td>`; }
function buildTable(){
  const t = document.getElementById("tbl");
  let h = `<tr><th>hibamód</th><th>S</th><th>O</th><th>D</th><th>RPN</th><th>intézkedés kell / miért</th>` + (RESC ? `<th>S′</th><th>O′</th><th>D′</th><th>maradék RPN / még kell?</th>` : "") + `</tr>`;
  ROWS.forEach((r, i) => { h += `<tr><td><input value="${r.name}" data-i="${i}" data-f="name" oninput="edit(this)" style="width:9em" aria-label="hibamód neve ${i + 1}"></td>` + cell(i, "S", r.S) + cell(i, "O", r.O) + cell(i, "D", r.D) + `<td id="rpn${i}"></td><td id="why${i}"></td>` + (RESC ? cell(i, "S2", r.S2) + cell(i, "O2", r.O2) + cell(i, "D2", r.D2) + `<td id="res${i}"></td>` : "") + `</tr>`; });
  t.innerHTML = h;
}
function edit(inp){ const r = ROWS[+inp.dataset.i], f = inp.dataset.f; if (f === "name") r.name = inp.value; else { const v = Math.max(1, Math.min(10, Math.round(+inp.value || 1))); r[f] = v; } show(0); }
function addRow(){ ROWS.push({name: "új hibamód", S: 5, O: 5, D: 5, S2: 5, O2: 5, D2: 5}); buildTable(); show(0); }
function rescore(){ RESC = !RESC; ROWS.forEach(r => { if (r.S2 === undefined) { r.S2 = r.S; r.O2 = r.O; r.D2 = r.D; } }); buildTable(); show(0); }
function recalc(){ ["thr", "sg", "dg"].forEach(id => document.getElementById(id + "v").textContent = g(id)); show(0); }
function render(s){
  if (!document.getElementById("tbl").rows.length) buildTable();
  ["thr", "sg", "dg"].forEach(id => document.getElementById(id + "v").textContent = g(id));
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 340");
  const X = o => 60 + (o - 0.5) / 10 * 480, Y = v => 310 - (v - 0.5) / 10 * 290, sg = g("sg");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="hb" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--muted")}" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  el("rect", {x: X(0.5), y: Y(10.5), width: 480, height: Y(sg - 0.5) - Y(10.5), fill: "url(#hb)", opacity: 0.6});
  el("line", {x1: X(0.5), y1: Y(sg - 0.5), x2: X(10.5), y2: Y(sg - 0.5), stroke: css("--fg"), "stroke-width": 1.8, "stroke-dasharray": "7 4"});
  el("text", {x: X(10.5) - 4, y: Y(sg - 0.5) - 5, "text-anchor": "end", "font-size": 11.5}, `súlyossági kapu S ≥ ${sg}`);
  for (let v = 1; v <= 10; v++) { el("text", {x: X(v), y: 326, "text-anchor": "middle", "font-size": 11}, String(v)); el("text", {x: 52, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, String(v)); el("line", {x1: X(v), y1: Y(0.5), x2: X(v), y2: Y(10.5), stroke: css("--muted"), "stroke-width": 0.3}); el("line", {x1: X(0.5), y1: Y(v), x2: X(10.5), y2: Y(v), stroke: css("--muted"), "stroke-width": 0.3}); }
  el("text", {x: 300, y: 340, "text-anchor": "middle", "font-size": 11.5}, "előfordulás (O)");
  el("text", {x: 6, y: 14, "font-size": 11.5}, "súlyosság (S)");
  const mark = (mk, x, y, fill) => {
    if (mk === "circle") el("circle", {cx: x, cy: y, r: 8, fill: fill, stroke: css("--fg"), "stroke-width": 1.5});
    else if (mk === "square") el("rect", {x: x - 8, y: y - 8, width: 16, height: 16, fill: fill, stroke: css("--fg"), "stroke-width": 1.5});
    else if (mk === "triangle") el("path", {d: `M ${x} ${y - 10} L ${x + 9} ${y + 7} L ${x - 9} ${y + 7} z`, fill: fill, stroke: css("--fg"), "stroke-width": 1.5});
    else { let d = ""; for (let j = 0; j < 10; j++) { const r = j % 2 ? 5 : 12, a = -Math.PI / 2 + j * Math.PI / 5; d += (j ? " L " : "M ") + (x + r * Math.cos(a)) + " " + (y + r * Math.sin(a)); } el("path", {d: d + " z", fill: fill, stroke: css("--fg"), "stroke-width": 1.5}); }
  };
  let n = 0;
  ROWS.forEach((r, i) => {
    const c = cls(r.S, r.O, r.D), x = X(r.O), y = Y(r.S);
    if (c.act) n++;
    if (RESC && (r.S2 !== r.S || r.O2 !== r.O || r.D2 !== r.D)) { const c2 = cls(r.S2, r.O2, r.D2); el("line", {x1: x, y1: y, x2: X(r.O2), y2: Y(r.S2), stroke: css("--fg"), "stroke-dasharray": "4 3", "marker-end": "url(#ah)"}); mark(c2.mk, X(r.O2), Y(r.S2), c2.act ? css("--cellhl") : css("--bg")); }
    mark(c.mk, x, y, c.act ? css("--cellhl") : css("--bg"));
    el("text", {x: x + 13, y: y - 6, "font-size": 11}, `${r.name} (D=${r.D}, ${c.rpn})`);
    document.getElementById("rpn" + i).textContent = c.rpn;
    document.getElementById("why" + i).textContent = c.act ? "igen: " + c.why.join("; ") : "nem";
    if (RESC) { const c2 = cls(r.S2, r.O2, r.D2); document.getElementById("res" + i).textContent = `${c2.rpn} / ${c2.act ? "igen: " + c2.why.join("; ") : "nem"}`; }
  });
  const L = 565; let y = 30;
  [["circle", "nincs intézkedés"], ["square", "RPN > küszöb"], ["triangle", "csak a kapu miatt"], ["star", "D ≥ kapu: detektálás"]].forEach(([m, t]) => { mark(m, L + 10, y, m === "circle" ? css("--bg") : css("--cellhl")); el("text", {x: L + 28, y: y + 4, "font-size": 11.5}, t); y += 28; });
  status.textContent = `Küszöb RPN > ${g("thr")}, kapu S ≥ ${g("sg")}, D ≥ ${g("dg")}: ${n} hibamód kap intézkedést a ${ROWS.length}-ból. ` + ROWS.filter(r => !cls(r.S, r.O, r.D).act).map(r => r.name).join(", ") + (ROWS.some(r => !cls(r.S, r.O, r.D).act) ? " – nem kell." : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
