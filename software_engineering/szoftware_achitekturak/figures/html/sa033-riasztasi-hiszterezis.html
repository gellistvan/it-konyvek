<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riasztási hiszterézis</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>küszöb: <input id="thr" type="range" min="200" max="300" step="5" value="250" oninput="recalc()" aria-label="Küszöb ms"> <span id="thrv">250</span> ms</label> <label>bekapcsolás: <input id="non" type="range" min="1" max="5" value="3" oninput="recalc()" aria-label="Bekapcsolási számláló"> <span id="nonv">3</span> ablak</label> <label>kikapcsolás: <input id="noff" type="range" min="1" max="5" value="2" oninput="recalc()" aria-label="Kikapcsolási számláló"> <span id="noffv">2</span> ablak</label> <button onclick="document.getElementById('thr').value=250;document.getElementById('non').value=1;document.getElementById('noff').value=1;recalc()">hiszterézis nélkül (1/1)</button> <button onclick="document.getElementById('thr').value=250;document.getElementById('non').value=3;document.getElementById('noff').value=2;recalc()">könyv (3/2)</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="14 ötperces ablak p95-értéke 210 és 290 ms között, küszöb 250 ms, SLO 300 ms; a riasztás a 8. ablak végén kapcsol be és a 12. ablak végén ki; a 3. ablak egyedüli sértése nem riaszt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető mintaadat (nem mérés). Sértés: p95 > küszöb. A bekapcsoláshoz N_BE egymást követő sértés, a kikapcsoláshoz N_KI egymást követő határ alatti ablak kell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdőállapot: küszöb 250 ms, bekapcsolás 3 egymást követő sértésnél, kikapcsolás 2 határ alatti ablaknál; riasztás: KI.", "line": -1, "k": 0, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "1. ablak: p95 = 210 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 1, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "2. ablak: p95 = 240 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 2, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "3. ablak: p95 = 270 ms (sért); sértés-számláló: 1/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 3, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "4. ablak: p95 = 230 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 4, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "5. ablak: p95 = 220 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 5, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "6. ablak: p95 = 260 ms (sért); sértés-számláló: 1/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 6, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "7. ablak: p95 = 280 ms (sért); sértés-számláló: 2/3, visszatérés-számláló: 0/2, riasztás: KI.", "line": 2, "k": 7, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "8. ablak: p95 = 290 ms (sért); sértés-számláló: 3/3, visszatérés-számláló: 0/2, riasztás: BE → a riasztás BEKAPCSOL.", "line": 3, "k": 8, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "9. ablak: p95 = 240 ms (nem sért); sértés-számláló: 3/3, visszatérés-számláló: 1/2, riasztás: BE.", "line": 5, "k": 9, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "10. ablak: p95 = 270 ms (sért); sértés-számláló: 3/3, visszatérés-számláló: 0/2, riasztás: BE.", "line": 5, "k": 10, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "11. ablak: p95 = 230 ms (nem sért); sértés-számláló: 3/3, visszatérés-számláló: 1/2, riasztás: BE.", "line": 5, "k": 11, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "12. ablak: p95 = 220 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 2/2, riasztás: KI → a riasztás KIKAPCSOL.", "line": 6, "k": 12, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "13. ablak: p95 = 210 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 2/2, riasztás: KI.", "line": 2, "k": 13, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}, {"msg": "14. ablak: p95 = 200 ms (nem sért); sértés-számláló: 0/3, visszatérés-számláló: 2/2, riasztás: KI. Összesen 1 bekapcsolás és 1 kikapcsolás.", "line": 2, "k": 14, "sim": [false, false, false, false, false, false, false, true, true, true, true, false, false, false], "viol": [false, false, true, false, false, true, true, true, false, true, false, false, false, false], "thr": 250}];
const CODE = ["for p95 in ablakok:", "    if not riasztas:", "        sert = sert + 1 if p95 > kuszob else 0", "        if sert >= N_BE: riasztas, vissza = True, 0      # bekapcsol", "    else:", "        vissza = vissza + 1 if p95 <= kuszob else 0", "        if vissza >= N_KI: riasztas, sert = False, 0     # kikapcsol"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VALS=[210, 240, 270, 230, 220, 260, 280, 290, 240, 270, 230, 220, 210, 200];
function simJS(thr,non,noff){let on=false,s=0,r=0;const res=[];for(const v of VALS){const viol=v>thr;let ev="";
 if(!on){s=viol?s+1:0;if(s>=non){on=true;r=0;ev="BE";}}else{r=!viol?r+1:0;if(r>=noff){on=false;s=0;ev="KI";}}
 res.push({viol:viol,s:s,r:r,on:on,ev:ev});}return res;}
function stepsJS(thr,non,noff){const sim=simJS(thr,non,noff),ons=sim.map(t=>t.on),vi=sim.map(t=>t.viol);
 const out=[{msg:`Kezdőállapot: küszöb ${thr} ms, bekapcsolás ${non} egymást követő sértésnél, kikapcsolás ${noff} határ alatti ablaknál; riasztás: KI.`,line:-1,k:0,sim:ons,viol:vi,thr:thr}];
 let prev=false;sim.forEach((t,i)=>{const line=!prev?(t.ev==="BE"?3:2):(t.ev==="KI"?6:5);
  const ev=t.ev==="BE"?" → a riasztás BEKAPCSOL":(t.ev==="KI"?" → a riasztás KIKAPCSOL":"");
  out.push({msg:`${i+1}. ablak: p95 = ${VALS[i]} ms (${t.viol?"sért":"nem sért"}); sértés-számláló: ${t.s}/${non}, visszatérés-számláló: ${t.r}/${noff}, riasztás: ${t.on?"BE":"KI"}${ev}.`,line:line,k:i+1,sim:ons,viol:vi,thr:thr});prev=t.on;});
 const nb=sim.filter(t=>t.ev==="BE").length,nk=sim.filter(t=>t.ev==="KI").length;
 out[out.length-1].msg+=` Összesen ${nb} bekapcsolás és ${nk} kikapcsolás.`;return out;}
function render(s){
 svg.setAttribute("viewBox","0 0 640 300");svg.innerHTML="";
 const thr=s.thr||250,X0=60,DX=40,Y=v=>230-(v-180)*1.5;
 const L=css("--line");
 el("line",{x1:X0-10,y1:Y(300),x2:X0+13*DX+20,y2:Y(300),stroke:L,"stroke-dasharray":"2 4","stroke-width":1.5});
 el("text",{x:X0+13*DX+20,y:Y(300)-5,"text-anchor":"end","font-size":12},"SLO: 300 ms");
 el("line",{x1:X0-10,y1:Y(thr),x2:X0+13*DX+20,y2:Y(thr),stroke:css("--hl2"),"stroke-dasharray":"8 5","stroke-width":1.5});
 el("text",{x:X0+13*DX+20,y:Y(thr)-5,"text-anchor":"end","font-size":12,fill:css("--hl2")},"küszöb: "+thr+" ms");
 [200,250,300].forEach(v=>el("text",{x:X0-16,y:Y(v)+4,"text-anchor":"end","font-size":11},String(v)));
 el("text",{x:8,y:Y(305),"font-size":11},"p95 (ms)");
 let pts=[];
 for(let i=0;i<VALS.length;i++){const x=X0+i*DX;
  const shown=i<s.k;
  el("text",{x:x,y:282,"text-anchor":"middle","font-size":11,"font-weight":i===s.k-1?"bold":"normal"},String(i+1));
  // riasztási sáv
  const on=i>0&&(i-1)<s.k&&s.sim[i-1];
  el("rect",{x:x-DX/2,y:248,width:DX,height:18,fill:on?css("--cellhl"):css("--cell"),stroke:L,"stroke-width":0.6});
  if(on) for(let h=0;h<4;h++) el("line",{x1:x-DX/2+h*10,y1:266,x2:x-DX/2+h*10+10,y2:248,stroke:L,"stroke-width":0.8});
  if(!shown) continue;
  pts.push(x+","+Y(VALS[i]));
 }
 if(pts.length>1) el("polyline",{points:pts.join(" "),fill:"none",stroke:L,"stroke-width":1.2});
 for(let i=0;i<s.k;i++){const x=X0+i*DX,y=Y(VALS[i]);
  if(s.viol[i]) el("path",{d:`M${x},${y-7} L${x+7},${y+5} L${x-7},${y+5} Z`,fill:L});
  else el("circle",{cx:x,cy:y,r:5,fill:css("--bg")||"#fff",stroke:L,"stroke-width":1.5});
  if(i===s.k-1) el("circle",{cx:x,cy:y,r:11,fill:"none",stroke:css("--hl"),"stroke-width":2});}
 el("text",{x:8,y:262,"font-size":11},"riasztás");
 el("text",{x:X0-20,y:298,"font-size":11,fill:css("--muted")},"▲ sért, ○ nem sért; sraffozott sáv: riasztás BE (5 perces ablakok, szemléltető mintaadat)");
}
function recalc(){const t=+document.getElementById("thr").value,a=+document.getElementById("non").value,b=+document.getElementById("noff").value;
 document.getElementById("thrv").textContent=t;document.getElementById("nonv").textContent=a;document.getElementById("noffv").textContent=b;
 setSteps(stepsJS(t,a,b));}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
