<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesztpiramis, trófea, jégkrémkúp</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{width:140px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
#info{background:var(--code);padding:6px 10px;min-height:7.5em}
#info ul{margin:4px 0 4px 18px;padding:0}
.small{font-size:12px;color:var(--muted)}
g.layer{cursor:pointer}
g.layer:focus rect{stroke:var(--hl);stroke-width:3}
</style></head><body>
<div class="ctl" role="group" aria-label="Alakzat és arányok">
  <label for="preset">Alakzat:</label>
  <select id="preset"><option value="pyr">tesztpiramis (70/20/10)</option><option value="tro" selected>teszt-trófea (25.1.7: 35/60/5)</option><option value="cone">jégkrémkúp (anti-minta)</option></select>
  <label><input type="checkbox" id="stat" checked> statikus talapzat</label>
</div>
<div class="ctl" role="group" aria-label="Futásidejű arányok">
  <label>Egység <input type="range" id="r_unit" min="0" max="100" step="1"> <span id="v_unit"></span></label>
  <label>Integrációs <input type="range" id="r_integ" min="0" max="100" step="1"> <span id="v_integ"></span></label>
  <label>UI/E2E <input type="range" id="r_e2e" min="0" max="100" step="1"> <span id="v_e2e"></span></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Három tesztalakzat rétegei: egység, integrációs és UI/E2E réteg a futásidejű arányoknak megfelelő szélességgel, a trófeánál statikus talapzattal."></svg>
<div id="info" aria-live="polite"></div>
<p class="small">Az arányok szemléltetők (tesztesetszám szerint), nem mért értékek; a csúszkák egymáshoz képesti értékét a lap 100%-ra normálja. Kattints (vagy Tab + Enter) egy rétegre a négy dimenzióért és a 25.1.7 példatesztjéért.</p>
<script>
const PRESETS = {"pyr": {"unit": 70, "integ": 20, "e2e": 10}, "tro": {"unit": 35, "integ": 60, "e2e": 5}, "cone": {"unit": 10, "integ": 20, "e2e": 30, "manual": 40}}, INFO = {"unit": {"dim": ["terjedelem: egy osztály, függvény vagy modul", "felület: kód-API", "izoláció: a tesztelt egység határa kontrollált (mock, fake vagy memóriabeli függőség)", "megközelítés: előre rögzített forgatókönyv"], "ex": "Fizetésre váró rendelés + sikeres fizetési visszaigazolás: a rendelés Kifizetve állapotba kerül, és outbox rekord jön létre."}, "integ": {"dim": ["terjedelem: néhány valódi komponens", "felület: REST API, adatbázis, Kafka", "izoláció: valódi PostgreSQL és Kafka Testcontainersben", "megközelítés: előre rögzített forgatókönyv"], "ex": "Az OpenAPI-specifikációból generált kliens ellenőrzi, hogy a válasz sémája megfelel a szerződésnek."}, "e2e": {"dim": ["terjedelem: a teljes rendszer, rendszerhatártól rendszerhatárig", "felület: nyilvános REST API (UI nélkül is lehet E2E)", "izoláció: valós függőségek", "megközelítés: előre rögzített forgatókönyv"], "ex": "REST API-n létrehozott rendelés, fizetési visszaigazolás, majd a RendelésKifizetve esemény ellenőrzése a Kafka topicban."}, "static": {"dim": ["nem futásidejű: a kódot futtatás nélkül elemzi", "felület: forráskód, függőséglista", "izoláció: nem értelmezhető", "megközelítés: automatikus szabályellenőrzés"], "ex": "ESLint (vagy hasonló), típusellenőrzés és függőségi sebezhetőség-vizsgálat a pipeline első lépéseként."}, "manual": {"dim": ["terjedelem: a teljes rendszer", "felület: UI", "izoláció: valós környezet", "megközelítés: kézi, szkriptelt kattintgatás"], "ex": "Jégkrémkúp anti-minta: a legtöbb ellenőrzés lassú, törékeny kézi és UI-szinten fut."}}, NAMES = {"unit": "Egység", "integ": "Integrációs", "e2e": "UI/E2E", "manual": "Kézi UI-teszt", "static": "Statikus elemzés"};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, attrs, parent, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;(parent||svg).appendChild(e);return e;}
let manual = 0, sel = null;
const R = ["unit", "integ", "e2e"];
function setPreset(p){ const d = PRESETS[p]; R.forEach(k => document.getElementById("r_" + k).value = d[k]); manual = d.manual || 0; document.getElementById("stat").checked = p === "tro"; draw(); }
function ratios(){ const v = {}; let s = manual; R.forEach(k => { v[k] = +document.getElementById("r_" + k).value; s += v[k]; }); if (s === 0) s = 1; R.forEach(k => v[k] = Math.round(100 * v[k] / s)); if (manual) v.manual = 100 - v.unit - v.integ - v.e2e; return v; }
function classify(v){ const top = (v.e2e || 0) + (v.manual || 0);
  if (top > v.unit && top >= v.integ) return "jégkrémkúp-jellegű (anti-minta): a teszt súlya a lassú, törékeny felső szinteken van";
  if (v.integ >= v.unit && v.integ > top) return "trófea-jellegű: a súlypont az integrációs rétegen van";
  if (v.unit >= v.integ && v.integ >= top) return "piramis-jellegű: alul széles, felül keskeny";
  return "vegyes alakzat"; }
function draw(){
  const v = ratios(); R.forEach(k => document.getElementById("v_" + k).textContent = v[k] + "%");
  svg.innerHTML = "";
  const cx = 330, LH = 46, base = 270, S = 4.2;
  let y = base;
  mk("text", {x: 20, y: 30, "font-size": 12}, null, "lassabb, drágább, törékenyebb ↑");
  mk("text", {x: 20, y: base + 18, "font-size": 12}, null, "gyorsabb, olcsóbb, jobban lokalizál ↓");
  const layers = [];
  if (document.getElementById("stat").checked) layers.push(["static", null]);
  R.forEach(k => layers.push([k, v[k]])); if (v.manual) layers.push(["manual", v.manual]);
  const pat = {unit: "", integ: "url(#h1)", e2e: "url(#h2)", manual: "url(#h3)", static: "url(#h4)"};
  const defs = mk("defs", {});
  [["h1", "M0,8 L8,0"], ["h2", "M0,0 L8,8 M0,8 L8,0"], ["h3", "M0,0 L8,8"], ["h4", "M3,3 l0.1,0"]].forEach(([id, d]) => {
    const p = mk("pattern", {id: id, width: 8, height: 8, patternUnits: "userSpaceOnUse"}, defs);
    mk("path", {d: d, stroke: css("--fg"), "stroke-width": id === "h4" ? 2.5 : 0.8, "stroke-linecap": "round"}, p); });
  layers.forEach(([k, p]) => {
    const h = k === "static" ? 34 : LH;
    const w = k === "static" ? 300 : Math.max(p, 6) * S;
    y -= h;
    const g = mk("g", {class: "layer", tabindex: 0, role: "button", "aria-label": NAMES[k] + (p === null ? " (nem futásidejű)" : ` ${p}%`)});
    mk("rect", {x: cx - w/2, y: y, width: w, height: h, fill: css(k === "integ" || k === "manual" ? "--cellhl" : "--cell"), stroke: css("--line"), "stroke-width": sel === k ? 3 : 1, "stroke-dasharray": k === "static" ? "5 3" : ""}, g);
    if (pat[k]) mk("rect", {x: cx - w/2, y: y, width: w, height: h, fill: pat[k], stroke: "none", opacity: 0.5}, g);
    const lab = NAMES[k] + (p === null ? " (nem futásidejű)" : ` ${p}%`);
    const tw = lab.length * 6.6 + 10;
    mk("rect", {x: cx - tw/2, y: y + h/2 - 10, width: tw, height: 19, fill: css("--bg"), opacity: 0.9}, g);
    mk("text", {x: cx, y: y + h/2 + 5, "text-anchor": "middle", "font-size": 13}, g, lab);
    const act = () => { sel = k; showInfo(k); draw(); };
    g.addEventListener("click", act);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
  });
  document.getElementById("status").textContent = `Futásidejű arányok: egység ${v.unit}%, integrációs ${v.integ}%, UI/E2E ${v.e2e}%` + (v.manual ? `, kézi UI ${v.manual}%` : "") + ` – ${classify(v)}.`;
}
function showInfo(k){ const d = INFO[k]; const box = document.getElementById("info"); box.innerHTML = "";
  const b = document.createElement("b"); b.textContent = NAMES[k]; box.appendChild(b);
  const ul = document.createElement("ul"); d.dim.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); }); box.appendChild(ul);
  const p = document.createElement("div"); p.textContent = "Példa (25.1.7): " + d.ex; box.appendChild(p); }
document.getElementById("preset").addEventListener("change", e => setPreset(e.target.value));
document.getElementById("stat").addEventListener("change", draw);
R.forEach(k => document.getElementById("r_" + k).addEventListener("input", () => { manual = 0; draw(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
setPreset("tro"); sel = "integ"; showInfo("integ"); draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
