<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFC, design review és ADR-életciklus</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="RFC-státuszok, a design review döntési pontja és az ADR-állapotgép; kiemelt út: RFC-0007, review, ADR-0012 elfogadott, ADR-0019 felváltja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Dupla keret = végállapot; szaggatott vonal = kölcsönös hivatkozás. Az állapotokra kattintva (vagy Enterrel) a fejezet definíciója jelenik meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"on": ["rfc_draft"], "msg": "1/6 – RFC-0007 „Aszinkron értesítés bevezetése” vázlat állapotban: a szerző leírja a problémát és a javaslatot.", "line": -1}, {"on": ["rfc_rev", "adr_prop"], "msg": "2/6 – RFC-0007 véleményezés alatt; a döntés ADR-0012-ként javasolt állapotban előkészíthető.", "line": -1}, {"on": ["review"], "msg": "3/6 – Design review: elfogad / elutasít / módosítással vagy PoC után vissza. Itt: elfogad.", "line": -1}, {"on": ["rfc_acc", "adr_acc"], "msg": "4/6 – RFC-0007 elfogadott → a döntést az ADR-0012 rögzíti Elfogadott állapottal (2025-04-01).", "line": -1}, {"on": ["adr19", "adr_sup"], "msg": "5/6 – Később a fiktív ADR-0019 felváltja az ADR-0012-t: a régi Felváltott, és kölcsönösen hivatkoznak egymásra.", "line": -1}, {"on": ["rfc_rej", "adr_rej", "adr_dep"], "msg": "6/6 – A többi kimenet: elutasított RFC (és elvetett ADR); okafogyott döntésnél Elavult ADR. Kattints egy állapotra a definícióért.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const N = {"rfc_draft": {"x": 10.0, "y": 43.00000000000001, "lab": "vázlat", "fin": false, "d": "RFC vázlat: a szerző megírja a javaslatot, tisztázza a problémát, a lehetséges megoldásokat és a nyitott kérdéseket (3.1, 1. lépés)."}, "rfc_rev": {"x": 10.0, "y": 138.0, "lab": "véleményezés\nalatt", "fin": false, "d": "Véleményezés alatt: a stakeholderek kommentelnek, a szerző beépíti a visszajelzéseket, szükség esetén új verziót ad ki (3.1, 2–3. lépés)."}, "rfc_acc": {"x": 170.0, "y": 238.0, "lab": "elfogadott", "fin": false, "d": "Elfogadott RFC: a döntéshozó elfogadta a javaslatot; a döntést ADR-ben rögzítik, és a megvalósítás megkezdődhet (3.1, 5. lépés)."}, "rfc_rej": {"x": 10.0, "y": 238.0, "lab": "elutasított", "fin": true, "d": "Elutasított RFC: a döntéshozó indoklással elutasította a javaslatot (3.1, 4. lépés)."}, "adr_prop": {"x": 385.0, "y": 43.00000000000001, "lab": "javasolt", "fin": false, "d": "Javasolt ADR: a döntés előkészítése, gyakran RFC formájában (2.3, 1. lépés)."}, "adr_acc": {"x": 385.0, "y": 238.0, "lab": "elfogadott", "fin": false, "d": "Elfogadott ADR: a döntés meghozatala, az ADR létrehozása Elfogadott állapottal (2.3, 2. lépés)."}, "adr_rej": {"x": 585.0, "y": 43.00000000000001, "lab": "elvetett", "fin": true, "d": "Elvetett ADR: a javasolt döntést nem fogadták el; az ADR a történeti hűség kedvéért megmarad (2.1 Állapot mező)."}, "adr_sup": {"x": 585.0, "y": 238.0, "lab": "felváltott", "fin": true, "d": "Felváltott ADR: később új döntés született; a régi ADR Felváltott állapotba kerül, és hivatkozik az újra (2.3, 3. lépés)."}, "adr_dep": {"x": 385.0, "y": 323.0, "lab": "elavult", "fin": true, "d": "Elavult ADR: a döntés okafogyottá vált (például a technológia megszűnt) (2.3, 4. lépés)."}, "adr19": {"x": 585.0, "y": 138.0, "lab": "ADR-0019\n(elfogadott)", "fin": false, "d": "ADR-0019 (fiktív): az új döntés, amely felváltja az ADR-0012-t; a két ADR kölcsönösen hivatkozik egymásra."}}, ED = [{"a": [72.5, 85.0], "b": [72.5, 138.0], "lab": "megosztás", "ls": "-", "rad": 0, "off": [40.0, 0]}, {"a": [135.0, 159.0], "b": [172.5, 159.0], "lab": "", "ls": "-", "rad": 0, "off": [0, 0]}, {"a": [232.5, 201.0], "b": [232.5, 238.0], "lab": "elfogad", "ls": "-", "rad": 0, "off": [32.0, 0]}, {"a": [202.5, 180.0], "b": [72.5, 238.0], "lab": "elutasít", "ls": "-", "rad": 0, "off": [-38.0, -5.0]}, {"a": [232.5, 117.0], "b": [135.0, 64.0], "lab": "módosítással /\nPoC után vissza", "ls": "-", "rad": 0.3, "off": [75.0, -12.0]}, {"a": [295.0, 259.0], "b": [385.0, 259.0], "lab": "rögzítés\nADR-ben", "ls": "-", "rad": 0, "off": [0, -24.0]}, {"a": [447.5, 85.0], "b": [447.5, 238.0], "lab": "elfogad", "ls": "-", "rad": 0, "off": [32.0, -30.0]}, {"a": [510.0, 64.0], "b": [585.0, 64.0], "lab": "elvet", "ls": "-", "rad": 0, "off": [0, -12.0]}, {"a": [510.0, 259.0], "b": [585.0, 259.0], "lab": "új ADR", "ls": "-", "rad": 0, "off": [0, -12.0]}, {"a": [447.5, 280.0], "b": [447.5, 323.0], "lab": "okafogyott", "ls": "-", "rad": 0, "off": [50.0, 0]}, {"a": [647.5, 180.0], "b": [647.5, 238.0], "lab": "felváltja /\nhivatkozik", "ls": "--", "rad": 0, "off": [-55.00000000000001, 0]}], RV = [232.50000000000003, 159.0, 60.0, 42.0], RDEF = "Design review: strukturált visszacsatolás; a kimenet elfogadás, elutasítás, vagy módosítással / további vizsgálat (PoC) után visszaküldés (3.1, 4. lépés; 4. szakasz).", BW = 125.0, BH = 42.0;
function info(t){ document.getElementById("status").textContent = t; }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 375");
  const d = document.createElementNS(NS, "defs"); d.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker>'; svg.appendChild(d);
  el("text", {x:10, y:30, "font-weight":"bold", "font-size":13}, "RFC-státusz (RFC-0007)");
  el("text", {x:258, y:65, "font-weight":"bold", "font-size":13}, "döntési pont");
  el("text", {x:385, y:30, "font-weight":"bold", "font-size":13}, "ADR-állapot (ADR-0012)");
  ED.forEach(e => { const [x0, y0] = e.a, [x1, y1] = e.b, mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const cx = mx - e.rad * (y1 - y0), cy = my + e.rad * (x1 - x0);
    const p = el("path", {d:`M${x0},${y0} Q${cx},${cy} ${x1},${y1}`, fill:"none", stroke:css("--line"), "stroke-width":1.3, "marker-end":"url(#ah)"});
    if (e.ls === "--") { p.setAttribute("stroke-dasharray", "6 4"); p.setAttribute("marker-start", "url(#ah)"); }
    if (e.lab) e.lab.split("\n").forEach((ln, i, a) => el("text", {x:mx + e.off[0], y:my + e.off[1] + 4 + (i - (a.length - 1) / 2) * 13, "text-anchor":"middle", "font-size":11, fill:css("--muted")}, ln)); });
  const on = s.on || [];
  const [rx, ry, rw, rh] = RV, ron = on.includes("review");
  const dm = el("polygon", {points:`${rx-rw},${ry} ${rx},${ry-rh} ${rx+rw},${ry} ${rx},${ry+rh}`, fill: ron ? css("--cellhl") : css("--cell"), stroke: ron ? css("--hl") : css("--line"), "stroke-width": ron ? 3.5 : 1.3, tabindex:0, role:"button", "aria-label":"design review", style:"cursor:pointer"});
  dm.onclick = () => info(RDEF); dm.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") info(RDEF); };
  el("text", {x:rx, y:ry - 2, "text-anchor":"middle", "font-size":13}, "design"); el("text", {x:rx, y:ry + 13, "text-anchor":"middle", "font-size":13}, "review");
  for (const k in N) { const n = N[k], h = on.includes(k);
    const r = el("rect", {x:n.x, y:n.y, width:BW, height:BH, rx:9, fill: h ? css("--cellhl") : css("--cell"), stroke: h ? css("--hl") : css("--line"), "stroke-width": h ? 3.5 : 1.3, tabindex:0, role:"button", "aria-label":n.lab.replace("\n", " "), style:"cursor:pointer"});
    if (k === "adr19") r.setAttribute("stroke-dasharray", "6 3");
    r.onclick = () => info(n.d); r.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") info(n.d); };
    if (n.fin) el("rect", {x:n.x + 4, y:n.y + 4, width:BW - 8, height:BH - 8, rx:6, fill:"none", stroke:css("--line"), "pointer-events":"none"});
    n.lab.split("\n").forEach((ln, i, a) => el("text", {x:n.x + BW / 2, y:n.y + BH / 2 + 5 + (i - (a.length - 1) / 2) * 14, "text-anchor":"middle", "font-size":13, "pointer-events":"none"}, ln)); }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
