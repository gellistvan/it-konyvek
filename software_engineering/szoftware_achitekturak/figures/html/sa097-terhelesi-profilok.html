<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terhelési profilok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre#code{margin:6px 0 0;padding:6px 8px;background:var(--code);font:12px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
g.ev{cursor:pointer}
g.ev:focus circle{stroke:var(--hl);stroke-width:3}
</style></head><body>
<div class="ctl" role="group" aria-label="Panel és idő">
  <label for="pan">Panel:</label>
  <select id="pan"><option value="load">(1) terheléses teszt</option><option value="stress">(2) stresszteszt</option><option value="soak">(3) tartóssági teszt</option></select>
  <button id="play" type="button">▶ Lejátszás</button>
  <input id="tm" type="range" min="0" max="1000" value="500" aria-label="Időpont">
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 300" role="img" aria-label="Terhelési profilok: a terheléses teszt k6-szcenáriói a mérési ablakkal, a stresszteszt lépcsői a töréspont-eseményekkel és a tartóssági teszt heap- és kapcsolat-pool idősora."></svg>
<pre id="code" aria-label="k6-szkript"></pre>
<p class="small">Szintetikus görbék, nem mért adat. A terheléses panel a T-S10-056 szerint javított k6-időzítést mutatja (a fejezet jelenlegi szkriptje pontozott vonallal); a stressz panel számozott jelölőjére kattintva (vagy Tab + Enter) a 25.4.2.2 mondata jelenik meg.</p>
<script>
const D = {"load": {"t": [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0, 3.25, 3.5, 3.75, 4.0, 4.25, 4.5, 4.75, 5.0, 5.25, 5.5, 5.75, 6.0, 6.25, 6.5, 6.75, 7.0, 7.25, 7.5, 7.75, 8.0, 8.25, 8.5, 8.75, 9.0, 9.25, 9.5, 9.75, 10.0, 10.25, 10.5, 10.75, 11.0, 11.25, 11.5, 11.75, 12.0, 12.25, 12.5, 12.75, 13.0, 13.25, 13.5, 13.75, 14.0, 14.25, 14.5, 14.75, 15.0, 15.25, 15.5, 15.75, 16.0, 16.25, 16.5, 16.75, 17.0], "vu": [0, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800, 850, 900, 950, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 875, 750, 625, 500, 375, 250, 125, 0], "cur": [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 1000, 875, 750, 625, 500, 375, 250, 125, 0], "ph": ["warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "warmup", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "steady", "ramp_down", "ramp_down", "ramp_down", "ramp_down", "ramp_down", "ramp_down", "ramp_down", "ramp_down", "ramp_down"], "p95": [550, 509, 473, 440, 411, 385, 362, 342, 323, 307, 292, 279, 267, 257, 247, 239, 232, 225, 219, 214, 209, 205, 201, 198, 195, 192, 190, 188, 186, 184, 183, 181, 180, 179, 178, 177, 176, 176, 175, 175, 174, 174, 173, 173, 173, 172, 172, 172, 172, 171, 171, 171, 171, 171, 171, 171, 171, 171, 171, 170, 170, null, null, null, null, null, null, null, null]}, "stress": {"steps": [[800, 0, 5], [900, 5, 10], [1000, 10, 15], [1100, 15, 20], [1200, 20, 25], [1300, 25, 30], [1400, 30, 35]], "events": [[1200, "1", "lineáris skálázás vége", "A rendszer 1200 egyidejű felhasználóig lineárisan skálázódik."], [1300, "2", "p99 > 800 ms", "1300-nál a p99 válaszidő 800 ms fölé emelkedik."], [1400, "3", "DB-kapcsolatok kimerülnek, hibaarány > 5%", "1400-nál az adatbázis-kapcsolatok száma kimerül, és a hibaarány 5% fölé ugrik."]]}, "soak": {"t": [0.0, 0.167, 0.333, 0.5, 0.667, 0.833, 1.0, 1.167, 1.333, 1.5, 1.667, 1.833, 2.0, 2.167, 2.333, 2.5, 2.667, 2.833, 3.0, 3.167, 3.333, 3.5, 3.667, 3.833, 4.0, 4.167, 4.333, 4.5, 4.667, 4.833, 5.0, 5.167, 5.333, 5.5, 5.667, 5.833, 6.0, 6.167, 6.333, 6.5, 6.667, 6.833, 7.0, 7.167, 7.333, 7.5, 7.667, 7.833, 8.0], "heap": [1.2, 1.216, 1.229, 1.237, 1.241, 1.24, 1.236, 1.232, 1.23, 1.233, 1.24, 1.253, 1.268, 1.284, 1.298, 1.307, 1.312, 1.311, 1.307, 1.303, 1.301, 1.303, 1.31, 1.322, 1.337, 1.353, 1.367, 1.377, 1.382, 1.382, 1.379, 1.375, 1.372, 1.373, 1.379, 1.39, 1.405, 1.421, 1.436, 1.447, 1.453, 1.454, 1.451, 1.446, 1.443, 1.443, 1.449, 1.459, 1.473], "pool": [38.0, 39.3, 40.5, 41.4, 42.1, 42.5, 42.7, 42.6, 42.4, 42.2, 42.1, 42.1, 42.4, 43.0, 43.9, 45.0, 46.2, 47.5, 48.8, 49.8, 50.6, 51.2, 51.4, 51.4, 51.2, 51.0, 50.8, 50.8, 51.0, 51.5, 52.2, 53.3, 54.5, 55.8, 57.0, 58.2, 59.1, 59.7, 60.1, 60.2, 60.1, 59.8, 59.6, 59.5, 59.6, 60.0, 60.7, 61.6, 62.7], "vu": 400}, "k6": ["export const options = { scenarios: {        // javított időzítés (T-S10-056)", "  warmup: { executor: 'ramping-vus', startVUs: 0,", "    stages: [{ duration: '5m', target: 1000 }, { duration: '5m', target: 1000 }],", "    tags: { phase: 'warmup' } },", "  steady: { executor: 'constant-vus', vus: 1000, duration: '5m', startTime: '10m',", "    tags: { phase: 'measurement' } },", "  ramp_down: { executor: 'ramping-vus', startVUs: 1000,", "    stages: [{ duration: '2m', target: 0 }], startTime: '15m', tags: { phase: 'ramp_down' } },", "}, thresholds: { 'http_req_duration{phase:measurement}': ['p(95)<300'] } };"], "k6lines": {"warmup": [1, 2, 3], "steady": [4, 5], "ramp_down": [6, 7]}};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v"), st = document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag, a, p, txt){const e=document.createElementNS(NS,tag);for(const q in a)e.setAttribute(q,a[q]);if(txt!==undefined)e.textContent=txt;(p||svg).appendChild(e);return e;}
const codeEl = document.getElementById("code");
codeEl.innerHTML = D.k6.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
let timer = null, evMsg = "";
function axes(x0, x1, y0, y1, tmax, vmax, xl, yl, ticks, vmin){
  mk("line", {x1: x0, y1: y1, x2: x1, y2: y1, stroke: css("--line")}); mk("line", {x1: x0, y1: y0, x2: x0, y2: y1, stroke: css("--line")});
  ticks.forEach(t => mk("text", {x: x0 + (x1 - x0) * t / tmax, y: y1 + 16, "text-anchor": "middle", "font-size": 11}, null, String(t)));
  mk("text", {x: x1, y: y1 + 32, "text-anchor": "end", "font-size": 11}, null, xl);
  mk("text", {x: x0 - 6, y: y0 + 4, "text-anchor": "end", "font-size": 11}, null, String(vmax));
  mk("text", {x: x0 - 6, y: y1, "text-anchor": "end", "font-size": 11}, null, vmin === undefined ? "0" : vmin);
  mk("text", {x: x0 + 4, y: y0 - 6, "font-size": 11}, null, yl);
}
function draw(){
  const pan = document.getElementById("pan").value, f = +document.getElementById("tm").value / 1000;
  svg.innerHTML = ""; codeEl.style.display = pan === "load" ? "block" : "none";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  const x0 = 60, x1 = 690, y0 = 30, y1 = 250;
  if (pan === "load") {
    const L = D.load, tmax = 17, X = t => x0 + (x1 - x0) * t / tmax, Y = v => y1 - (y1 - y0) * v / 1200;
    mk("rect", {x: X(10), y: y0, width: X(15) - X(10), height: y1 - y0, fill: css("--cellhl"), opacity: 0.6});
    mk("text", {x: X(12.5), y: y0 + 14, "text-anchor": "middle", "font-size": 11}, null, "mérési ablak (phase:measurement)");
    axes(x0, x1, y0, y1, tmax, 1200, "idő (perc)", "VU / p95 (ms, szaggatott-pontozott)", [0, 5, 10, 15, 17]);
    let d = "", c = "", p = "";
    L.t.forEach((t, i) => { d += (i ? " L " : "M ") + X(t) + " " + Y(L.vu[i]); c += (i ? " L " : "M ") + X(t) + " " + Y(L.cur[i]); });
    L.t.forEach((t, i) => { if (L.p95[i] !== null) p += (p ? " L " : "M ") + X(t) + " " + Y(L.p95[i]); });
    mk("path", {d: c, fill: "none", stroke: css("--hl2"), "stroke-width": 1.5, "stroke-dasharray": "2 3"});
    mk("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2.6});
    mk("path", {d: p, fill: "none", stroke: css("--fg"), "stroke-width": 1.4, "stroke-dasharray": "8 3 2 3"});
    mk("line", {x1: x0, x2: x1, y1: Y(300), y2: Y(300), stroke: css("--muted"), "stroke-dasharray": "6 4"});
    mk("text", {x: x1, y: Y(300) - 4, "text-anchor": "end", "font-size": 11}, null, "p95-küszöb 300 ms");
    const i = Math.round(f * (L.t.length - 1)), t = L.t[i];
    mk("line", {x1: X(t), x2: X(t), y1: y0, y2: y1, stroke: css("--hl"), "stroke-width": 2});
    (D.k6lines[L.ph[i]] || []).forEach(n => document.getElementById("L" + n).classList.add("on"));
    st.textContent = `t = ${t.toFixed(2).replace(".", ",")} perc – szcenárió: ${L.ph[i]}, VU = ${L.vu[i]} (jelenlegi szkript: ${L.cur[i]})` + (L.p95[i] !== null ? `, szemléltető p95 = ${L.p95[i]} ms` : "") + (t >= 10 && t <= 15 ? "; mérési ablak, a küszöbök csak itt érvényesek." : ".");
  } else if (pan === "stress") {
    const S = D.stress, tmax = 35, X = t => x0 + (x1 - x0) * t / tmax, Y = v => y1 - (y1 - y0) * (v - 700) / 800;
    axes(x0, x1, y0, y1, tmax, 1500, "idő (perc)", "VU", [0, 5, 10, 15, 20, 25, 30, 35], "700");
    let d = ""; S.steps.forEach(([v, a, b], i) => d += (i ? " L " : "M ") + X(a) + " " + Y(v) + " L " + X(b) + " " + Y(v));
    mk("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2.6});
    S.events.forEach(([v, n, lab, txt]) => { const s = S.steps.find(q => q[0] === v), cx = X(s[1] + 2.5), cy = Y(v);
      const g = mk("g", {class: "ev", tabindex: 0, role: "button", "aria-label": `${n}. jelölő: ${lab}`});
      mk("circle", {cx: cx, cy: cy, r: 11, fill: css("--bg"), stroke: css("--line"), "stroke-width": 1.4}, g);
      mk("text", {x: cx, y: cy + 4, "text-anchor": "middle", "font-size": 12, "font-weight": "bold"}, g, n);
      mk("text", {x: cx - 14, y: cy - 14, "text-anchor": "end", "font-size": 11}, g, lab);
      const act = () => { evMsg = `${n}. jelölő (${v} VU): „${txt}”`; draw(); };
      g.addEventListener("click", act); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }); });
    const t = f * tmax, s = S.steps.find(q => t >= q[1] && t <= q[2]) || S.steps[S.steps.length - 1];
    mk("line", {x1: X(t), x2: X(t), y1: y0, y2: y1, stroke: css("--hl"), "stroke-width": 2});
    st.textContent = evMsg || `t = ${t.toFixed(1).replace(".", ",")} perc – lépcső: ${s[0]} VU.`;
  } else {
    const S = D.soak, tmax = 8, X = t => x0 + (x1 - x0) * t / tmax;
    axes(x0, x1, y0, y1, tmax, "", "idő (óra)", "heap (GB, folytonos) és pool-foglaltság (%, szaggatott) – VU = " + S.vu, [0, 1, 2, 3, 4, 5, 6, 7, 8], "");
    const Yh = v => y1 - (y1 - y0) * (v - 1.0) / 0.7, Yp = v => y1 - (y1 - y0) * (v - 20) / 60;
    let a = "", b = ""; S.t.forEach((t, i) => { a += (i ? " L " : "M ") + X(t) + " " + Yh(S.heap[i]); b += (i ? " L " : "M ") + X(t) + " " + Yp(S.pool[i]); });
    mk("path", {d: a, fill: "none", stroke: css("--fg"), "stroke-width": 2});
    mk("path", {d: b, fill: "none", stroke: css("--muted"), "stroke-width": 2, "stroke-dasharray": "7 4"});
    const i = Math.round(f * (S.t.length - 1));
    mk("line", {x1: X(S.t[i]), x2: X(S.t[i]), y1: y0, y2: y1, stroke: css("--hl"), "stroke-width": 2});
    st.textContent = `t = ${S.t[i].toFixed(1).replace(".", ",")} óra – GC utáni heap ${String(S.heap[i]).replace(".", ",")} GB, kapcsolat-pool ${String(S.pool[i]).replace(".", ",")}% (szintetikus). A mérvadó a GC utáni heap trendje.`;
  }
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("play").addEventListener("click", () => { if (timer) { stop(); return; }
  const r = document.getElementById("tm"); if (+r.value >= 1000) r.value = 0; evMsg = "";
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { r.value = Math.min(1000, +r.value + 20); draw(); if (+r.value >= 1000) stop(); }, 120); });
document.getElementById("tm").addEventListener("input", () => { stop(); evMsg = ""; draw(); });
document.getElementById("pan").addEventListener("change", () => { stop(); evMsg = ""; draw(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
