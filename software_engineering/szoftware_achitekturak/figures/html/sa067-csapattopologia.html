<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csapattopológia és interakciós módok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="now">Most</button><button id="later">6 hónap múlva</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 780 600" role="img" aria-label="Team Topologies térkép: három stream-aligned csapat, platform sáv, enabling és complicated-subsystem csapat, interakciós módok"></svg>
<div class="ctl" id="rel" role="group" aria-label="Kapcsolatok"></div>
<p class="small">Nyíl = X-as-a-Service (szolgáltató → fogyasztó), sraffozott átfedés = collaboration, pontozott átfedés = facilitating, szaggatott keret = szervezeti határ. Domináns interakciók; az együttműködés időben korlátozott.</p>
<script>
const DATA = {"now": {"H": 12.0, "S": 50, "frames": [{"id": "org", "x": 0.3, "y": 0.3, "w": 11.4, "h": 11.4, "label": "Szervezeti határ: online kiskereskedelmi vállalat"}], "nodes": [{"id": "ena", "shape": "box", "cx": 2.3, "cy": 7.05, "w": 3.0, "h": 7.6, "fill": "white", "ls": "-", "lw": 1.6, "text": "Enabling:\nBiztonság\n\n(időkeret:\npl. 2 hónap)", "fs": 8.4}, {"id": "kat", "shape": "box", "cx": 6.6000000000000005, "cy": 10.0, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nKatalógus és ajánlók", "weight": "bold"}, {"id": "ren", "shape": "box", "cx": 6.6000000000000005, "cy": 7.6, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nRendeléskezelés", "weight": "bold"}, {"id": "ugy", "shape": "box", "cx": 6.6000000000000005, "cy": 3.85, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nÜgyfélszámla és hűségprogram", "weight": "bold"}, {"id": "cs", "shape": "oct", "cx": 7.6, "cy": 6.45, "w": 2.9, "h": 1.6, "fill": "white", "lw": 1.6, "text": "Complicated-\nsubsystem:\nAjánló motor"}, {"id": "f1", "shape": "box", "cx": 3.6, "cy": 10.0, "w": 0.4, "h": 1.1, "fill": "dots", "lw": 0.6, "text": ""}, {"id": "f2", "shape": "box", "cx": 3.6, "cy": 7.6, "w": 0.4, "h": 1.1, "fill": "dots", "lw": 0.6, "text": ""}, {"id": "f3", "shape": "box", "cx": 3.6, "cy": 3.85, "w": 0.4, "h": 1.1, "fill": "dots", "lw": 0.6, "text": ""}, {"id": "col", "shape": "box", "cx": 7.6, "cy": 7.15, "w": 1.95, "h": 0.2, "fill": "hatch", "lw": 0.6, "text": ""}, {"id": "plat", "shape": "box", "cx": 5.9, "cy": 1.45, "w": 10.4, "h": 1.3, "fill": "g2", "text": "Platform: konténerplatform, megfigyelhetőség, CI/CD", "weight": "bold"}, {"id": "pay", "shape": "box", "cx": 13.75, "cy": 7.6, "w": 3.3, "h": 1.6, "fill": "white", "text": "Külső fizetési\nszolgáltató\n(a rendeléskezelés\nfogyasztja)"}], "edges": [{"id": "p1", "pts": [[10.3, 2.1], [10.3, 9.75], [9.42, 9.75]]}, {"id": "p2", "pts": [[10.3, 7.35], [9.42, 7.35]]}, {"id": "p3", "pts": [[10.3, 3.85], [9.42, 3.85]], "label": "X-as-a-Service:\nmindhárom csapat", "lpos": [10.3, 2.75]}, {"id": "ak", "pts": [[9.05, 6.45], [9.8, 6.45], [9.8, 10.25], [9.42, 10.25]], "label": "XaaS", "lpos": [9.8, 8.8]}, {"id": "kr", "pts": [[5.0, 9.45], [5.0, 8.15]], "label": "XaaS: árak, elérhetőség", "lpos": [5.25, 8.8], "ha": "left"}, {"id": "py", "pts": [[12.05, 7.6], [11.75, 7.6]], "ls": "--"}]}, "later": {"H": 12.0, "S": 50, "frames": [{"id": "org", "x": 0.3, "y": 0.3, "w": 11.4, "h": 11.4, "label": "Szervezeti határ: online kiskereskedelmi vállalat"}], "nodes": [{"id": "kat", "shape": "box", "cx": 6.6000000000000005, "cy": 10.0, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nKatalógus és ajánlók", "weight": "bold"}, {"id": "ren", "shape": "box", "cx": 6.6000000000000005, "cy": 7.6, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nRendeléskezelés", "weight": "bold"}, {"id": "ugy", "shape": "box", "cx": 6.6000000000000005, "cy": 3.85, "w": 5.6, "h": 1.1, "fill": "g1", "text": "Stream-aligned:\nÜgyfélszámla és hűségprogram", "weight": "bold"}, {"id": "cs", "shape": "oct", "cx": 7.6, "cy": 5.7, "w": 2.9, "h": 1.6, "fill": "white", "lw": 1.6, "text": "Complicated-\nsubsystem:\nAjánló motor"}, {"id": "plat", "shape": "box", "cx": 5.9, "cy": 1.45, "w": 10.4, "h": 1.3, "fill": "g2", "text": "Platform: konténerplatform, megfigyelhetőség, CI/CD", "weight": "bold"}, {"id": "pay", "shape": "box", "cx": 13.75, "cy": 7.6, "w": 3.3, "h": 1.6, "fill": "white", "text": "Külső fizetési\nszolgáltató\n(a rendeléskezelés\nfogyasztja)"}], "edges": [{"id": "p1", "pts": [[10.3, 2.1], [10.3, 9.75], [9.42, 9.75]]}, {"id": "p2", "pts": [[10.3, 7.35], [9.42, 7.35]]}, {"id": "p3", "pts": [[10.3, 3.85], [9.42, 3.85]], "label": "X-as-a-Service:\nmindhárom csapat", "lpos": [10.3, 2.75]}, {"id": "ak", "pts": [[9.05, 5.7], [9.8, 6.45], [9.8, 10.25], [9.42, 10.25]], "label": "XaaS", "lpos": [9.8, 8.8]}, {"id": "kr", "pts": [[5.0, 9.45], [5.0, 8.15]], "label": "XaaS: árak, elérhetőség", "lpos": [5.25, 8.8], "ha": "left"}, {"id": "py", "pts": [[12.05, 7.6], [11.75, 7.6]], "ls": "--"}, {"id": "cr", "pts": [[7.6, 6.5], [7.6, 7.03]], "label": "XaaS", "lpos": [8.15, 6.78]}]}, "rel": [["Platform → stream-aligned (X-as-a-Service)", ["plat", "kat", "ren", "ugy"], ["p1", "p2", "p3"], "A platform csapat mindhárom stream-aligned csapatnak X-as-a-Service módon adja a deploymentet: pipeline-definíció, namespace-konfiguráció, erőforráskérés a platform API-ján."], ["Enabling ↔ stream-aligned (facilitating)", ["ena", "f1", "f2", "f3"], [], "A biztonsági enabling csapat időszakosan facilitál: workshop, közös fenyegetésmodellezés, majd a csapatok átveszik a napi biztonsági gondolkodást; időkeret és kimeneti cél kell (pl. két hónap)."], ["Ajánló motor ↔ Rendeléskezelés (collaboration)", ["cs", "ren", "col"], [], "A rendelés pillanatában a kosár alapján kell ajánlatot kérni; a két csapat közösen alakítja ki a szerződést (adatok, időkorlát, hibamódok). Ideiglenes: a szerződés stabilizálásáig."], ["Ajánló motor → Katalógus és ajánlók (X-as-a-Service)", ["cs", "kat"], ["ak"], "A complicated-subsystem csapat a bonyolult alrendszert szolgáltatásként, stabil, verziózott API-val teszi elérhetővé a katalógus és ajánlók értékfolyamnak."], ["Katalógus → Rendeléskezelés (X-as-a-Service)", ["kat", "ren"], ["kr"], "A rendeléskezelés a katalógus API-ján kérdezi le a termékárakat és az elérhetőséget, a belső adatséma ismerete nélkül."]]};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let mode = "now", sel = -1;
const g = id => document.getElementById(id);
const box = g("rel");
DATA.rel.forEach((r, i) => { const b = document.createElement("button"); b.textContent = r[0]; b.dataset.i = i;
  b.onclick = () => { sel = sel === i ? -1 : i; draw(); }; box.appendChild(b); });
function draw(){
  svg.innerHTML = ""; patterns(svg);
  const D = mode === "now" ? DATA.now : DATA.later;
  const r = sel >= 0 ? DATA.rel[sel] : null;
  let hlN = new Set(r ? r[1] : []), hlE = new Set(r ? r[2] : []);
  if (r && mode === "later" && sel === 2) { hlN = new Set(["cs", "ren"]); hlE = new Set(["cr"]); }
  const gone = r && mode === "later" && sel === 1;
  drawDiagram(svg, D, {hlN, hlE});
  if (mode === "now") wrapText(svg, 7.6 * 50, (DATA.now.H - 5.4) * 50, "collaboration: ideiglenes,\na szerződés stabilizálásáig", {"text-anchor": "middle", "font-size": 11, "font-style": "italic"}, 12);
  [...box.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i === sel)));
  g("now").setAttribute("aria-pressed", String(mode === "now")); g("later").setAttribute("aria-pressed", String(mode === "later"));
  let msg = mode === "now" ? "Most: " : "6 hónap múlva: a rendeléskezelés és az ajánló motor szerződése stabil, a kapcsolat X-as-a-Service; az enabling csapat kivonult (a facilitálás sikeres, ha kivonulhat). ";
  if (r) msg += gone ? "A facilitálás véget ért: a stream-aligned csapatok önállóan végzik a fenyegetésmodellezést." :
    (mode === "later" && sel === 2 ? "Ajánló motor → Rendeléskezelés: X-as-a-Service a stabilizált szerződésen keresztül." : r[3]);
  else if (mode === "now") msg += "kattints egy kapcsolatra az indoklásért.";
  status.textContent = msg;
}
g("now").onclick = () => { mode = "now"; draw(); };
g("later").onclick = () => { mode = "later"; draw(); };

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
