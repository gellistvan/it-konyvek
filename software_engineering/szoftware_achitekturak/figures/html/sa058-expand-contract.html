<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expand–contract sémamigráció</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="s2"> kihagyom a 2. fázist</label> <label><input type="checkbox" id="ed"> túl korai DROP (v2 még fut)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Új oszlop hozzáadása, kettős írás, adatfeltöltés, átállás, majd a régi oszlop törlése; minden fázisban a futó verziók kompatibilisek. A kapcsolókkal látszik, melyik verzió törik el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: v1 ar-t ír/olvas; v2 mindkettőbe ír, ar-ból olvas; v3 netto_ar-ból olvas (v2 kifutásáig mindkettőbe ír). Sraffozott: futó verzió; X: eltört verzió.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. fázis – expand: ALTER TABLE termek ADD COLUMN netto_ar integer NULL. Futó verziók: v1. Minden futó verzió kompatibilis.", "n": 1, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1"], "bad": []}, {"msg": "2. fázis – app v2: app v2: mindkét oszlopba ír, ar-ból olvas. Futó verziók: v1, v2. Minden futó verzió kompatibilis.", "n": 2, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1", "v2"], "bad": []}, {"msg": "3. fázis – backfill: UPDATE termek SET netto_ar = ar WHERE netto_ar IS NULL (kötegekben). Futó verziók: v2. Minden futó verzió kompatibilis.", "n": 3, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2"], "bad": []}, {"msg": "4. fázis – app v3: app v3: netto_ar-ból olvas (v2 kifutásáig mindkettőbe ír). Futó verziók: v2, v3. Minden futó verzió kompatibilis.", "n": 4, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2", "v3"], "bad": []}, {"msg": "5. fázis – contract: ALTER TABLE termek DROP COLUMN ar (csak ha v2 már nem fut). Futó verziók: v3. Minden futó verzió kompatibilis.", "n": 5, "cols": ["netto_ar"], "filled": true, "run": ["v3"], "bad": []}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const ALL = {"00": [{"msg": "1. fázis – expand: ALTER TABLE termek ADD COLUMN netto_ar integer NULL. Futó verziók: v1. Minden futó verzió kompatibilis.", "n": 1, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1"], "bad": []}, {"msg": "2. fázis – app v2: app v2: mindkét oszlopba ír, ar-ból olvas. Futó verziók: v1, v2. Minden futó verzió kompatibilis.", "n": 2, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1", "v2"], "bad": []}, {"msg": "3. fázis – backfill: UPDATE termek SET netto_ar = ar WHERE netto_ar IS NULL (kötegekben). Futó verziók: v2. Minden futó verzió kompatibilis.", "n": 3, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2"], "bad": []}, {"msg": "4. fázis – app v3: app v3: netto_ar-ból olvas (v2 kifutásáig mindkettőbe ír). Futó verziók: v2, v3. Minden futó verzió kompatibilis.", "n": 4, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2", "v3"], "bad": []}, {"msg": "5. fázis – contract: ALTER TABLE termek DROP COLUMN ar (csak ha v2 már nem fut). Futó verziók: v3. Minden futó verzió kompatibilis.", "n": 5, "cols": ["netto_ar"], "filled": true, "run": ["v3"], "bad": []}], "01": [{"msg": "1. fázis – expand: ALTER TABLE termek ADD COLUMN netto_ar integer NULL. Futó verziók: v1. Minden futó verzió kompatibilis.", "n": 1, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1"], "bad": []}, {"msg": "2. fázis – app v2: app v2: mindkét oszlopba ír, ar-ból olvas. Futó verziók: v1, v2. Minden futó verzió kompatibilis.", "n": 2, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1", "v2"], "bad": []}, {"msg": "3. fázis – backfill: UPDATE termek SET netto_ar = ar WHERE netto_ar IS NULL (kötegekben). Futó verziók: v2. Minden futó verzió kompatibilis.", "n": 3, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2"], "bad": []}, {"msg": "4. fázis – túl korai DROP: az ar oszlop eltűnik, miközben v2 fut. Futó verziók: v2, v3. TÖRIK: v2 (v2 ar-ból olvas és mindkettőbe ír – kell mindkét oszlop).", "n": 4, "cols": ["netto_ar"], "filled": true, "run": ["v2", "v3"], "bad": ["v2"]}], "10": [{"msg": "1. fázis – expand: ALTER TABLE termek ADD COLUMN netto_ar integer NULL. Futó verziók: v1. Minden futó verzió kompatibilis.", "n": 1, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1"], "bad": []}, {"msg": "2. fázis – 2. fázis kihagyva: v3 közvetlenül v1 mellé. Futó verziók: v1, v3. TÖRIK: v3 (v3 NULL netto_ar-t olvasna (nincs backfill, vagy v1 csak ar-ba ír)).", "n": 2, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1", "v3"], "bad": ["v3"]}, {"msg": "3. fázis – backfill: UPDATE termek SET netto_ar = ar WHERE netto_ar IS NULL (kötegekben). Futó verziók: v3. Minden futó verzió kompatibilis.", "n": 3, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v3"], "bad": []}, {"msg": "4. fázis – app v3: app v3: netto_ar-ból olvas (v2 kifutásáig mindkettőbe ír). Futó verziók: v2, v3. Minden futó verzió kompatibilis.", "n": 4, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v2", "v3"], "bad": []}, {"msg": "5. fázis – contract: ALTER TABLE termek DROP COLUMN ar (csak ha v2 már nem fut). Futó verziók: v3. Minden futó verzió kompatibilis.", "n": 5, "cols": ["netto_ar"], "filled": true, "run": ["v3"], "bad": []}], "11": [{"msg": "1. fázis – expand: ALTER TABLE termek ADD COLUMN netto_ar integer NULL. Futó verziók: v1. Minden futó verzió kompatibilis.", "n": 1, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1"], "bad": []}, {"msg": "2. fázis – 2. fázis kihagyva: v3 közvetlenül v1 mellé. Futó verziók: v1, v3. TÖRIK: v3 (v3 NULL netto_ar-t olvasna (nincs backfill, vagy v1 csak ar-ba ír)).", "n": 2, "cols": ["ar", "netto_ar"], "filled": false, "run": ["v1", "v3"], "bad": ["v3"]}, {"msg": "3. fázis – backfill: UPDATE termek SET netto_ar = ar WHERE netto_ar IS NULL (kötegekben). Futó verziók: v3. Minden futó verzió kompatibilis.", "n": 3, "cols": ["ar", "netto_ar"], "filled": true, "run": ["v3"], "bad": []}, {"msg": "4. fázis – túl korai DROP: az ar oszlop eltűnik, miközben v2 fut. Futó verziók: v2, v3. TÖRIK: v2 (v2 ar-ból olvas és mindkettőbe ír – kell mindkét oszlop).", "n": 4, "cols": ["netto_ar"], "filled": true, "run": ["v2", "v3"], "bad": ["v2"]}]}, NAMES = {"1": "expand", "2": "app v2", "3": "backfill", "4": "app v3", "5": "contract"};
function render(s){
  svg.setAttribute("viewBox", "0 0 660 260");
  svg.innerHTML = ""; defs0();
  const cur = STEPS, W = 118;
  T(6, 44, "séma", {"font-size": 12, "font-weight": "bold"});
  [["v1", 96], ["v2", 136], ["v3", 176]].forEach(([v, y]) => T(6, y + 5, "app " + v, {"font-size": 12, "font-weight": "bold"}));
  cur.forEach((p, i) => { const x = 60 + i * W, on = i <= cur.indexOf(s), here = p === s;
    T(x + W / 2, 16, p.n + ". " + NAMES[p.n], {"font-size": 12, "text-anchor": "middle", "font-weight": here ? "bold" : "normal", fill: here ? css("--hl") : css("--fg")});
    if (!on) return;
    R(x + 2, 28, W - 4, 26, {rx: 0, fill: css("--fg")}); T(x + W / 2, 45, p.cols.join("+") + (p.filled && p.cols.length > 1 ? " ✓" : ""), {"font-size": 11, "text-anchor": "middle", fill: css("--bg")});
    p.run.forEach(v => { const y = {v1: 96, v2: 136, v3: 176}[v], bad = p.bad.includes(v);
      R(x + 2, y - 12, W - 4, 24, {rx: 0, fill: bad ? css("--cell") : "url(#hat)", stroke: bad ? css("--hl2") : css("--line"), "stroke-width": bad ? 3 : 1.2});
      if (bad) { X(x + W / 2, y, 9); } });
    T(x + W / 2, 214, p.bad.length ? "✗ " + p.bad.join(", ") + " törik" : "✓ kompatibilis", {"font-size": 12, "text-anchor": "middle", "font-weight": "bold", fill: p.bad.length ? css("--hl2") : css("--fg")});
    if (p.n < 5 && !(p.cols.length === 1)) el("polygon", {points: [x + W, 228, x + W + 8, 236, x + W, 244, x + W - 8, 236].join(","), fill: css("--cell"), stroke: css("--line")}); });
  T(6, 256, "rombusz: visszaállítási pont; a DROP után nincs visszaút", {"font-size": 11, fill: css("--muted")});
}
function upd(){ const k = (document.getElementById("s2").checked ? "1" : "0") + (document.getElementById("ed").checked ? "1" : "0"); setSteps(ALL[k]); }
["s2", "ed"].forEach(id => document.getElementById(id).addEventListener("change", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
