<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adatminőségi mutatók a mintán</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button data-k="telj">Teljesség</button><button data-k="dup">Duplikáció</button><button data-k="nn">NOT NULL</button><button data-k="inv">Érvénytelenség</button><button data-k="late">Késve érkezés</button><button data-k="trap">Csapda</button><label>forrásoldali várható rendelés <input id="exp" type="number" min="0" max="99" value="4" style="width:4em"></label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 270" role="img" aria-label="A hat mintasor; a választott mutató számlálója sraffozva, nevezője vastag kerettel, a kizárt sorok áthúzva"></svg>
<div class="ctl" role="group" aria-label="Saját sor"><span class="small">Saját sor:</span><label>order_id <input id="oid" value="ORD-20250301-000006" style="width:13em"></label><label>total_amount <input id="amt" value="250.00" style="width:6em"></label><label>order_date <select id="dt"><option>2025-03-01</option><option>2025-02-28</option></select></label><button id="add">Saját sor hozzáadása</button><button id="reset">Visszaállítás</button></div><pre class="code" id="sql" aria-label="Használt SQL"></pre>
<p class="small">Ablak: 2025-03-01 (UTC), T+2 állapot. A teljesség nevezője a forrásrendszer által igazolt rendelésszám (a NULL kulcsú sor a 000003-as rendelés hibás betöltése); az érvénytelenség nevezője a deduplikált, nem NULL order_id-jű sorok száma (T-S7-011 szerinti definíció).</p>
<script>
const DATA = {"rows": [["ORD-20250301-000001", "C-001", 12000.0, "2025-03-01"], ["ORD-20250301-000002", "C-002", 8500.0, "2025-03-01"], [null, "C-003", 4200.0, "2025-03-01"], ["ORD-20250301-000004", "C-004", -100.0, "2025-03-01"], ["ORD-20250301-000004", "C-004", -100.0, "2025-03-01"], ["ORD-20250301-000005", "C-005", 1990.0, "2025-02-28"]], "day": "2025-03-01", "sql": {"telj": "SELECT COUNT(DISTINCT order_id) FROM t WHERE order_date = :day  -- / forrásoldali várható (4)", "dup": "SELECT order_id FROM t WHERE order_date = :day AND order_id IS NOT NULL GROUP BY order_id HAVING COUNT(*) > 1", "nn": "SELECT COUNT(*) FROM t WHERE order_date = :day AND order_id IS NULL", "inv": "SELECT SUM(total_amount IS NULL OR total_amount < 0), COUNT(*) FROM (SELECT DISTINCT order_id, total_amount FROM t WHERE order_date = :day AND order_id IS NOT NULL)", "late": "SELECT COUNT(*) FROM t WHERE order_date < :day  -- a 03-01-i futás után érkezett, korábbi ablak", "trap": "SELECT COUNT(*) - COUNT(DISTINCT order_id) FROM t WHERE order_date = :day"}, "names": {"telj": "Teljesség", "dup": "Duplikáció", "nn": "NOT NULL (order_id)", "inv": "Érvénytelenség", "late": "Késve érkezés", "trap": "Csapda: COUNT(*) − DISTINCT"}};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let cur = "telj";
const rows = DATA.rows.map(r => r.slice());
const DAY = DATA.day;
function classify(rows, expected){
  const inw = rows.map(r => r[3] === DAY), seen = new Set(), first = [], cnt = {};
  rows.forEach((r, i) => { const f = inw[i] && r[0] !== null && !seen.has(r[0]); if (f) seen.add(r[0]); first.push(f); });
  rows.forEach((r, i) => { if (inw[i] && r[0] !== null) cnt[r[0]] = (cnt[r[0]] || 0) + 1; });
  const isInv = r => r[2] === null || r[2] < 0;
  const out = {
    telj: rows.map((r, i) => first[i] ? "num" : (inw[i] && r[0] === null ? "den" : "ex")),
    dup: rows.map((r, i) => (inw[i] && r[0] !== null) ? (cnt[r[0]] > 1 ? "num" : "den") : "ex"),
    nn: rows.map((r, i) => inw[i] ? (r[0] === null ? "num" : "den") : "ex"),
    inv: rows.map((r, i) => first[i] ? (isInv(r) ? "num" : "den") : "ex"),
    late: rows.map((r, i) => r[3] < DAY ? "num" : (inw[i] ? "den" : "ex")),
    trap: rows.map((r, i) => inw[i] ? (first[i] ? "num" : (r[0] === null ? "n" : "d")) : "ex"),
  };
  const nFirst = first.filter(Boolean).length;
  const res = {
    telj: [nFirst, expected], dup: Object.values(cnt).filter(v => v > 1).length,
    nn: rows.filter((r, i) => inw[i] && r[0] === null).length,
    inv: [rows.filter((r, i) => first[i] && isInv(r)).length, nFirst],
    late: rows.filter(r => r[3] < DAY).length, trap: [inw.filter(Boolean).length, nFirst]};
  return {out, res};
}
const pc = (a, b) => b ? fmt(100 * a / b, 1) + "%" : "nincs adat";
function verdict(key, res, exp){
  const r = res[key];
  if (key === "telj") return r[1] ? `${r[0]} / ${r[1]} = ${pc(r[0], r[1])} – küszöb ≥ 99,5% → ${100*r[0]/r[1] >= 99.5 ? "OK" : "HIBA"}` : "nincs adat (üres ablak: külön riasztás)";
  if (key === "dup") return `${r} csoport – küszöb 0 csoport → ${r === 0 ? "OK" : "HIBA"}`;
  if (key === "nn") return `${r} NULL kulcsú sor – küszöb 0 → ${r === 0 ? "OK" : "HIBA"}`;
  if (key === "inv") return r[1] ? `${r[0]} / ${r[1]} = ${pc(r[0], r[1])} – küszöb ≤ 0,5% → ${100*r[0]/r[1] <= 0.5 ? "OK" : "HIBA"}` : "nincs adat";
  if (key === "late") return `${r} késve érkező sor a korábbi ablakba – a mutatót T+2 állapoton mérjük`;
  return `COUNT(*) − COUNT(DISTINCT order_id) = ${r[0]} − ${r[1]} = ${r[0]-r[1]} „duplikátum” – félrevezető: a NULL kulcsú sorokat is beszámolja`;
}
function draw(){
  const exp = +document.getElementById("exp").value;
  const {out, res} = classify(rows, exp);
  svg.setAttribute("viewBox", `0 0 760 ${60 + rows.length * 34}`);
  svg.innerHTML = ""; patterns(svg);
  const fg = css("--fg");
  const cols = [[10, "order_id"], [250, "customer_id"], [370, "total_amount"], [510, "order_date"], [640, "szerep"]];
  cols.forEach(c => mk(svg, "text", {x: c[0] + 6, y: 22, "font-size": 13, "font-weight": "bold"}, c[1]));
  const roleTxt = {den: "nevező", num: "számláló", ex: "kizárva", n: "különbség: NULL", d: "különbség: dupl."};
  rows.forEach((r, i) => {
    const role = out[cur][i], y = 34 + i * 34;
    mk(svg, "rect", {x: 6, y, width: 748, height: 28, fill: role === "num" ? "url(#ph)" : css("--bg"), stroke: fg,
      "stroke-width": role === "ex" ? .6 : 2.4, "stroke-dasharray": role === "ex" ? "3 3" : ""});
    const vals = [r[0] === null ? "(NULL)" : r[0], r[1], r[2] === null ? "(NULL)" : fmt(r[2], 2), r[3], roleTxt[role]];
    vals.forEach((v, j) => {
      if (role === "num") mk(svg, "rect", {x: cols[j][0] + 3, y: y + 5, width: String(v).length * 7.4 + 6, height: 18, fill: css("--bg")});
      mk(svg, "text", {x: cols[j][0] + 6, y: y + 19, "font-size": 13, fill: role === "ex" ? css("--muted") : fg, "font-weight": j === 4 ? "bold" : "normal"}, v);
    });
    if (role === "ex") mk(svg, "line", {x1: 6, x2: 600, y1: y + 14, y2: y + 14, stroke: fg, "stroke-width": 1.2});
    if (role === "n") mk(svg, "circle", {cx: 622, cy: y + 14, r: 6, fill: fg});
    if (role === "d") mk(svg, "path", {d: `M622,${y+6} L629,${y+21} L615,${y+21}Z`, fill: css("--bg"), stroke: fg, "stroke-width": 1.5});
  });
  document.getElementById("sql").textContent = DATA.sql[cur];
  status.textContent = DATA.names[cur] + ": " + verdict(cur, res, exp);
  document.querySelectorAll("button[data-k]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.k === cur)));
}
document.querySelectorAll("button[data-k]").forEach(b => b.onclick = () => { cur = b.dataset.k; draw(); });
document.getElementById("exp").oninput = draw;
document.getElementById("add").onclick = () => {
  const id = document.getElementById("oid").value.trim(), a = document.getElementById("amt").value.trim();
  const amt = a === "" ? null : parseFloat(a.replace(",", "."));
  rows.push([id === "" ? null : id, "C-new", (amt === null || isNaN(amt)) ? null : amt, document.getElementById("dt").value]);
  draw();
};
document.getElementById("reset").onclick = () => { rows.length = 0; DATA.rows.forEach(r => rows.push(r.slice())); draw(); };

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
