<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A PaymentHighErrorRate szabály állapota négy esetben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

  const cmp = e.ratio === null ? "" : (e.ratio > 0.05 ? " > 0,05" : " ≤ 0,05"); let s = e.state;
  if (s === "pending") s += " " + cm(e.pend, 1) + " perc (for: " + cm(FOR, 0) + " perc)"; else if (s === "firing") s += " (fennáll " + cm(e.pend, 1) + " perce)";
  return "t = " + mmss(e.t) + ", arány " + r + cmp + ", állapot: " + s + "; absent-szabály: " + e.absent; }
function par(){ const g = id => +document.getElementById(id).value;
  ["L", "E", "F", "W"].forEach(id => document.getElementById(id + "v").textContent = " " + g(id) + (id === "E" ? "%" : " perc") + " ");
  return {L: g("L"), E: g("E") / 100, F: g("F"), W: g("W")}; }
function rebuild(keep){ const p = par(); SIMR = simulate(CASE, p.L, p.E, p.F, p.W); setSteps(SIMR.map((e, i) => ({msg: msgOf(e, p.F), i: i, line: -1}))); if (keep !== undefined) show(keep); }
function pickC(c){ CASE = c; rebuild(); }
function render(s){
  if (!SIMR) { const p = par(); SIMR = simulate(CASE, p.L, p.E, p.F, p.W); }
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 306");
  const ev = SIMR, X = t => 60 + (t - T0) / (T1 - T0) * 680, Y = v => 30 + (1 - (Math.log10(v) + 0.7) / 2.9) * 190;
  el("defs", {}).innerHTML = '<pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="' + css("--fg") + '" stroke-width="1.5"/></pattern>';
  [0.5, 5, 50].forEach(v => { el("line", {x1: 60, y1: Y(v), x2: 740, y2: Y(v), stroke: css("--muted"), "stroke-width": 0.5}); el("text", {x: 54, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, cm(v, v < 1 ? 1 : 0) + "%"); });
  el("line", {x1: 60, y1: Y(5), x2: 740, y2: Y(5), stroke: css("--fg"), "stroke-dasharray": "6 4"});
  el("text", {x: 738, y: Y(5) - 4, "text-anchor": "end", "font-size": 11}, "küszöb 0,05");
  if (CASE >= 3) el("rect", {x: X(60), y: 30, width: X(80) - X(60), height: 190, fill: CASE === 3 ? "url(#hz)" : "none", stroke: css("--fg"), "stroke-dasharray": "2 3", opacity: 0.5});
  let d = "";
  for (let i = 0; i <= s.i; i++) { const e = ev[i]; if (e.ratio === null || e.ratio <= 0) { d += " "; continue; }
    const y = Y(Math.max(0.2, Math.min(150, 100 * e.ratio))); d += (d.trim() === "" || d.endsWith(" ") ? " M " : " L ") + X(e.t) + " " + y; }
  el("path", {d: d.trim() || "M 0 0", fill: "none", stroke: css("--fg"), "stroke-width": 2.4});
  const e = ev[s.i]; el("line", {x1: X(e.t), y1: 26, x2: X(e.t), y2: 300, stroke: css("--hl2"), "stroke-width": 1.5});
  const strips = [["riasztás", "state", 232]].concat(CASE === 4 ? [["absent()", "absent", 256]] : []);
  strips.forEach(([lab, key, y]) => { el("text", {x: 54, y: y + 14, "text-anchor": "end", "font-size": 11}, lab);
    el("rect", {x: 60, y: y, width: 680, height: 20, fill: "none", stroke: css("--line")});
    for (let i = 0; i <= s.i; i++) { const st = ev[i][key]; if (st === "inactive") continue;
      el("rect", {x: X(ev[i].t), y: y, width: X(STP + T0) - X(T0) + 0.5, height: 20, fill: st === "firing" ? css("--fg") : "url(#hz)"}); } });
  for (let t = 50; t <= 100; t += 5) el("text", {x: X(t), y: 292, "text-anchor": "middle", "font-size": 11}, String(t));
  el("text", {x: 4, y: 16, "font-size": 12.5}, "5 perces ablakos hibaarány (log) és a riasztás állapota – elméleti modell");
  el("text", {x: 4, y: 300, "font-size": 10.5, fill: css("--muted")}, SELFT ? "önellenőrzés: a JS-modell egyezik a Python-számítással" : "önellenőrzés: ELTÉRÉS a Python-számítástól");
}
["L", "E", "F", "W"].forEach(id => document.getElementById(id).addEventListener("input", () => rebuild(k)));
let SELFT = (function(){ for (const c of [1, 2, 3, 4]) { const ev = simulate(c, 5, 1, 15, 5);
  const sg = ev.map(e => e.state[0]).join("") + "|" + ev.map(e => e.absent[0]).join(""); if (sg !== EXPS[c]) return false; } return true; })();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 250);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
