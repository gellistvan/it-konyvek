<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A traceparent terjedése és a rendelés span-fája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input id="smp" type="checkbox" checked> mintavételezett (trace-flags 01; kikapcsolva 00)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvencia: Client, Frontend, OrderService, PaymentService, DB; minden hopon a traceparent értéke; alatta a négy span idővonala."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A még nyitott spanek (Frontend, OrderService) halványak, amíg a válasz vissza nem ér. Szemléltető időpontok, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. A kliens kérése (POST /orders) traceparent nélkül érkezik; a Frontend új trace-t indít: trace-id 4bf92f3577b34da6a3ce929d0e0e4736, gyökérspan 00f067aa0ba902b7 (0 ms).", "hop": 0, "spans": 1, "line": -1}, {"msg": "2. Frontend → OrderService: traceparent 00-4bf9…4736-00f067aa0ba902b7-01 – a parent-id a hívó (Frontend) span-id-je.", "hop": 1, "spans": 1, "line": -1}, {"msg": "3. Az OrderService a bejövő parent-id-t szülőként használja, új spant nyit: b7ad6b7169203331 (15 ms).", "hop": 1, "spans": 2, "line": -1}, {"msg": "4. OrderService → PaymentService: traceparent 00-4bf9…4736-b7ad6b7169203331-01 – a trace-id változatlan, a parent-id már az OrderService span-id-je.", "hop": 2, "spans": 2, "line": -1}, {"msg": "5. A PaymentService új spant nyit: 53995c3f42cd8ad8 (30–250 ms), szülője b7ad6b7169203331.", "hop": 2, "spans": 3, "line": -1}, {"msg": "6. Az OrderService kliens-spant nyit az adatbázis-íráshoz: e457b5a2e4d86bd1 (260–300 ms); a kontextus 00-4bf9…4736-b7ad6b7169203331-01, nem HTTP-fejlécként.", "hop": 3, "spans": 4, "line": -1}, {"msg": "7. A válaszok visszafelé: OrderService 410 ms-nál, a Frontend 420 ms-nál zárja a spanjét. Négy span, egy trace-id; a parent-id hoponként a hívó span-id-je.", "hop": 3, "spans": 4, "line": -1, "done": true}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const D = {"trace": "4bf92f3577b34da6a3ce929d0e0e4736", "spans": [["Frontend", "00f067aa0ba902b7", null, "POST /orders", 0, 420], ["OrderService", "b7ad6b7169203331", "00f067aa0ba902b7", "POST /api/orders", 15, 410], ["PaymentService", "53995c3f42cd8ad8", "b7ad6b7169203331", "POST /payments", 30, 250], ["DB", "e457b5a2e4d86bd1", "b7ad6b7169203331", "INSERT order", 260, 300]], "hops": [["Client", "Frontend", "POST /orders", null, true], ["Frontend", "OrderService", "POST /api/orders", "Frontend", true], ["OrderService", "PaymentService", "POST /payments", "OrderService", true], ["OrderService", "DB", "INSERT order", "OrderService", false]], "lanes": ["Client", "Frontend", "OrderService", "PaymentService", "DB"], "span_of": {"Frontend": "00f067aa0ba902b7", "OrderService": "b7ad6b7169203331", "PaymentService": "53995c3f42cd8ad8", "DB": "e457b5a2e4d86bd1"}};
const PAT = {Frontend: "", OrderService: "url(#p1)", PaymentService: "url(#p2)", DB: "url(#p3)"};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 780 470");
  const fl = document.getElementById("smp").checked ? "01" : "00", hl = css("--hl2");
  el("defs", {}).innerHTML = '<pattern id="p1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="' + css("--cell") + '"/><line x1="0" y1="0" x2="0" y2="7" stroke="' + css("--fg") + '" stroke-width="1.4"/></pattern>'
    + '<pattern id="p2" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="' + css("--cell") + '"/><circle cx="3" cy="3" r="1.2" fill="' + css("--fg") + '"/></pattern>'
    + '<pattern id="p3" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="' + css("--cellhl") + '"/><path d="M0,0 L8,8 M8,0 L0,8" stroke="' + css("--fg") + '" stroke-width="1"/></pattern>';
  const LX = {}; D.lanes.forEach((n, i) => { LX[n] = 70 + i * 160;
    el("rect", {x: LX[n] - 66, y: 4, width: 132, height: 24, rx: 5, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x: LX[n], y: 21, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, n);
    el("line", {x1: LX[n], y1: 28, x2: LX[n], y2: 250, stroke: css("--muted"), "stroke-dasharray": "3 3"}); });
  D.hops.forEach((h, i) => {
    if (i > s.hop) return;
    const y = 52 + i * 52, cur = i === s.hop && !s.done, col = cur ? hl : css("--fg"), x0 = LX[h[0]], x1 = LX[h[1]];
    el("line", {x1: x0, y1: y, x2: x1 - 6, y2: y, stroke: col, "stroke-width": cur ? 3 : 1.5});
    el("path", {d: `M ${x1} ${y} l -10 -5 l 0 10 z`, fill: col});
    el("text", {x: x0 + 6, y: y - 6, "font-size": 12}, h[2]);
    if (h[3] === null) { el("text", {x: 8, y: y + 19, "font-size": 11.5, "font-style": "italic", fill: css("--muted")}, "nincs traceparent → új trace, gyökérspan " + D.span_of.Frontend); return; }
    const pid = D.span_of[h[3]], yy = y + 19;
    const t = el("text", {x: 8, y: yy, "font-size": 12});
    const ts = (txt, a) => { const e = document.createElementNS(NS, "tspan"); for (const q in a) e.setAttribute(q, a[q]); e.textContent = txt; t.appendChild(e); };
    ts(h[4] ? "traceparent: " : "kontextus (nem HTTP-fejléc): ", {"font-style": "italic"});
    ts("00-", {"font-family": "ui-monospace,monospace"});
    ts(D.trace, {"font-family": "ui-monospace,monospace", "text-decoration": "underline"});
    ts("-", {"font-family": "ui-monospace,monospace"});
    ts(pid, {"font-family": "ui-monospace,monospace", "font-weight": "bold", fill: cur ? hl : css("--hl")});
    ts("-" + fl, {"font-family": "ui-monospace,monospace", "font-weight": fl === "00" ? "bold" : "normal"});
    ts("   (parent-id = " + h[3] + " span-id-je)", {"font-size": 11, fill: css("--muted")});
  });
  // vízesés
  const X = ms => 160 + ms * 1.1, y0 = 280;
  el("text", {x: 4, y: y0 - 8, "font-size": 12.5, "font-weight": "bold"}, "Vízesés-nézet (ms)" + (fl === "00" ? " – flags 00: a spanek nem kerülnek rögzítésre, a kontextus terjed" : ""));
  D.spans.forEach((sp, i) => {
    const y = y0 + i * 40, shown = i < s.spans, cur = i === s.spans - 1 && !s.done;
    el("text", {x: 4, y: y + 20, "font-size": 12}, sp[0]);
    el("text", {x: 4, y: y + 34, "font-size": 10.5, fill: css("--muted"), "font-family": "ui-monospace,monospace"}, sp[1]);
    if (!shown) return;
    const end = s.done || sp[0] === "PaymentService" || sp[0] === "DB" ? sp[5] : Math.min(sp[5], [0, 15, 30, 260, 300][s.spans] || sp[5]);
    el("rect", {x: X(sp[4]), y: y + 8, width: Math.max(4, X(s.done ? sp[5] : (sp[0] === "Frontend" || sp[0] === "OrderService" ? sp[5] : sp[5])) - X(sp[4])), height: 22,
      fill: fl === "00" ? "none" : (PAT[sp[0]] || css("--cellhl")), stroke: cur ? hl : (fl === "00" ? css("--muted") : css("--fg")), "stroke-width": cur ? 3 : 1.2, "stroke-dasharray": fl === "00" ? "4 3" : "", opacity: (!s.done && (sp[0] === "Frontend" || sp[0] === "OrderService")) ? 0.55 : 1});
    el("text", {x: X(sp[5]) + 6, y: y + 24, "font-size": 11}, sp[3] + " " + sp[4] + "–" + sp[5] + " ms");
  });
  [0, 100, 200, 300, 400].forEach(ms => { el("line", {x1: X(ms), y1: y0 + 162, x2: X(ms), y2: y0 + 168, stroke: css("--fg")}); el("text", {x: X(ms), y: y0 + 182, "text-anchor": "middle", "font-size": 11}, String(ms)); });
}
document.getElementById("smp").addEventListener("change", () => show(k));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
