<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VQE hibrid hurok</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram öt résztvevővel; a loop keretben iterációnként egy QPU-futás, mellette iterációszámláló és szintetikus energiatáblázat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szaggatott nyíl: aszinkron üzenet, folytonos: szinkron hívás. A QPU-hívás aszinkron, várólistázott; a shotszám és ε konfigurációs paraméter (itt ε = 0,02). Az E(θₖ) értékek szintetikusak, nem mért eredmények.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"m": "m1", "it": -1, "msg": "k = – | Az alkalmazás aszinkron feladatot ad le az orchestrátornak (θ₀, shotszám, ε); nem blokkol.", "line": 0}, {"m": "m2", "it": 0, "msg": "k = 0 | Az orchestrátor a kört θₖ paraméterekkel a QPU várólistájára teszi (aszinkron).", "line": 2}, {"m": "m3", "it": 0, "msg": "k = 0 | A kör a várakozás után a QPU-n fut (iterációnként egyszer).", "line": 3}, {"m": "m4", "it": 0, "msg": "k = 0 | A QPU visszaadja a mérési statisztikát (callback/eseményként).", "line": 4}, {"m": "m5", "it": 0, "msg": "k = 0 | Az orchestrátor átadja az energiabecslést az optimalizálónak. E(θ0) = −0,820", "line": 5}, {"m": "m6", "it": 0, "msg": "k = 0 | Az optimalizáló új paramétereket és konvergencia-jelzőt ad vissza. Első iteráció: nincs összehasonlítás, folytatás.", "line": 6}, {"m": "m2", "it": 1, "msg": "k = 1 | Az orchestrátor a kört θₖ paraméterekkel a QPU várólistájára teszi (aszinkron).", "line": 2}, {"m": "m3", "it": 1, "msg": "k = 1 | A kör a várakozás után a QPU-n fut (iterációnként egyszer).", "line": 3}, {"m": "m4", "it": 1, "msg": "k = 1 | A QPU visszaadja a mérési statisztikát (callback/eseményként).", "line": 4}, {"m": "m5", "it": 1, "msg": "k = 1 | Az orchestrátor átadja az energiabecslést az optimalizálónak. E(θ1) = −1,050", "line": 5}, {"m": "m6", "it": 1, "msg": "k = 1 | Az optimalizáló új paramétereket és konvergencia-jelzőt ad vissza. |E1 − E0| = 0,230 > ε = 0,02 → folytatás.", "line": 6}, {"m": "m2", "it": 2, "msg": "k = 2 | Az orchestrátor a kört θₖ paraméterekkel a QPU várólistájára teszi (aszinkron).", "line": 2}, {"m": "m3", "it": 2, "msg": "k = 2 | A kör a várakozás után a QPU-n fut (iterációnként egyszer).", "line": 3}, {"m": "m4", "it": 2, "msg": "k = 2 | A QPU visszaadja a mérési statisztikát (callback/eseményként).", "line": 4}, {"m": "m5", "it": 2, "msg": "k = 2 | Az orchestrátor átadja az energiabecslést az optimalizálónak. E(θ2) = −1,120", "line": 5}, {"m": "m6", "it": 2, "msg": "k = 2 | Az optimalizáló új paramétereket és konvergencia-jelzőt ad vissza. |E2 − E1| = 0,070 > ε = 0,02 → folytatás.", "line": 6}, {"m": "m2", "it": 3, "msg": "k = 3 | Az orchestrátor a kört θₖ paraméterekkel a QPU várólistájára teszi (aszinkron).", "line": 2}, {"m": "m3", "it": 3, "msg": "k = 3 | A kör a várakozás után a QPU-n fut (iterációnként egyszer).", "line": 3}, {"m": "m4", "it": 3, "msg": "k = 3 | A QPU visszaadja a mérési statisztikát (callback/eseményként).", "line": 4}, {"m": "m5", "it": 3, "msg": "k = 3 | Az orchestrátor átadja az energiabecslést az optimalizálónak. E(θ3) = −1,135", "line": 5}, {"m": "m6", "it": 3, "msg": "k = 3 | Az optimalizáló új paramétereket és konvergencia-jelzőt ad vissza. |E3 − E2| = 0,015 < ε = 0,02 → konvergált, a hurok véget ér.", "line": 6}, {"m": "m7", "it": 3, "msg": "k = 3 | Konvergencia: az orchestrátor visszaadja a végső θ*, E* eredményt.", "line": 8}];
const CODE = ["App -) Orch: feladat(θ₀, shots, ε)", "loop amíg |Eₖ − Eₖ₋₁| > ε és k < k_max", "    Orch -) QPU-sor: kör(θₖ, shots)", "    QPU-sor -) QPU: futtatás (várakozás után)", "    QPU -) Orch: mérési statisztika", "    Orch ->> Opt: E(θₖ)", "    Opt ->> Orch: θₖ₊₁, konvergencia-jelző", "end", "Orch -) App: végső θ*, E*"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const G = {"W": 760, "H": 470, "PX": {"App": 80, "Orch": 240, "Sor": 400, "QPU": 540, "Opt": 680}, "NAMES": {"App": ["Klasszikus", "alkalmazás"], "Orch": ["Kvantum-", "orchestrátor"], "Sor": ["QPU-sor", "(várólista)"], "QPU": ["QPU"], "Opt": ["Klasszikus", "optimalizáló"]}, "MSG": [{"id": "m1", "a": "App", "b": "Orch", "y": 100, "asy": true, "lab": "feladat(θ₀, shots, ε)"}, {"id": "m2", "a": "Orch", "b": "Sor", "y": 178, "asy": true, "lab": "kör(θₖ, shots)"}, {"id": "m3", "a": "Sor", "b": "QPU", "y": 228, "asy": true, "lab": "futtatás"}, {"id": "m4", "a": "QPU", "b": "Orch", "y": 272, "asy": true, "lab": "mérési statisztika"}, {"id": "m5", "a": "Orch", "b": "Opt", "y": 316, "asy": false, "lab": "E(θₖ)"}, {"id": "m6", "a": "Opt", "b": "Orch", "y": 360, "asy": false, "lab": "θₖ₊₁, konvergencia-jelző"}, {"id": "m7", "a": "Orch", "b": "App", "y": 440, "asy": true, "lab": "végső θ*, E*"}], "LOOP": [150, 120, 740, 385], "WAIT": [178, 228], "E": [-0.82, -1.05, -1.12, -1.135], "fs": 14.241622574955908};
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", `0 0 ${G.W + 190} ${G.H}`);
  const fs = G.fs, defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="a0" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--line')}"/></marker><marker id="a1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="${css('--hl2')}"/></marker><pattern id="dt" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${css('--fg')}"/></pattern>`;
  svg.appendChild(defs);
  for (const p in G.PX) {
    const x = G.PX[p];
    el("rect", {x: x - 62, y: 10, width: 124, height: 44, rx: 6, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.4});
    G.NAMES[p].forEach((l, i, a) => el("text", {x: x, y: 32 + (i - (a.length - 1) / 2) * fs * 1.1 + fs * 0.35, "text-anchor": "middle", "font-size": fs}, l));
    el("line", {x1: x, x2: x, y1: 54, y2: G.H - 22, stroke: css("--muted"), "stroke-dasharray": "4 4"});
  }
  const [x0, y0, x1, y1] = G.LOOP;
  el("rect", {x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: "none", stroke: css("--line"), "stroke-width": s.it >= 0 && s.m !== "m7" ? 2.4 : 1.2});
  el("rect", {x: x0, y: y0, width: 54, height: 20, fill: css("--cellhl"), stroke: css("--line")});
  el("text", {x: x0 + 27, y: y0 + 15, "text-anchor": "middle", "font-size": fs, "font-weight": "bold"}, "loop");
  el("text", {x: x0 + 60, y: y0 + 15, "font-size": fs}, "[amíg |Eₖ − Eₖ₋₁| > ε és k < k_max]");
  const sorWait = s.m === "m3";
  el("rect", {x: G.PX.Sor - 7, y: G.WAIT[0], width: 14, height: G.WAIT[1] - G.WAIT[0], fill: sorWait ? css("--hl2") : css("--cellhl"), stroke: css("--line")});
  el("rect", {x: G.PX.Sor - 7, y: G.WAIT[0], width: 14, height: G.WAIT[1] - G.WAIT[0], fill: "url(#dt)", stroke: "none"});
  el("text", {x: G.PX.Sor - 12, y: (G.WAIT[0] + G.WAIT[1]) / 2 + 4, "text-anchor": "end", "font-size": fs * 0.95}, "várakozás a sorban");
  G.MSG.forEach(m => {
    const on = m.id === s.m, xa = G.PX[m.a], xb = G.PX[m.b];
    el("line", {x1: xa, x2: xb, y1: m.y, y2: m.y, stroke: on ? css("--hl2") : css("--line"), "stroke-width": on ? 3 : 1.4, "stroke-dasharray": m.asy ? "7 4" : "none", "marker-end": on ? "url(#a1)" : "url(#a0)"});
    el("text", {x: (xa + xb) / 2, y: m.y - 6, "text-anchor": "middle", "font-size": fs, "font-weight": on ? "bold" : "normal"}, m.lab);
  });
  el("line", {x1: 10, x2: 50, y1: G.H - 6, y2: G.H - 6, stroke: css("--line"), "stroke-width": 1.4});
  el("text", {x: 56, y: G.H - 2, "font-size": fs}, "szinkron hívás");
  el("line", {x1: 250, x2: 290, y1: G.H - 6, y2: G.H - 6, stroke: css("--line"), "stroke-width": 1.4, "stroke-dasharray": "7 4"});
  el("text", {x: 296, y: G.H - 2, "font-size": fs}, "aszinkron üzenet");
  // iterációszámláló és E-táblázat
  const tx = G.W + 10;
  el("text", {x: tx, y: 30, "font-size": fs * 1.15, "font-weight": "bold"}, "k = " + (s.it < 0 ? "–" : s.it));
  el("text", {x: tx, y: 60, "font-size": fs}, "E(θₖ), szintetikus");
  el("text", {x: tx, y: 78, "font-size": fs * 0.9, fill: css("--muted")}, "(nem mért)");
  G.E.forEach((v, i) => {
    const shown = i < s.it || (i === s.it && ["m5", "m6", "m7"].includes(s.m)), cur = i === s.it;
    el("rect", {x: tx, y: 90 + i * 26, width: 160, height: 24, fill: cur ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": cur ? 2 : 0.8});
    el("text", {x: tx + 8, y: 107 + i * 26, "font-size": fs}, `k = ${i}: ` + (shown ? v.toFixed(3).replace(".", ",").replace("-", "−") : "…"));
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
