<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hatmezős forgatókönyv és négymezős sablon</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button onclick="toggleOwn()" aria-controls="ownbox">Saját példa</button><div id="ownbox" hidden style="flex-basis:100%"><label style="display:block;margin:2px 0">Forrás: <input id="f_forras" size="48" value="regisztrált vásárló (mobilapp)"></label><label style="display:block;margin:2px 0">Inger: <input id="f_inger" size="48" value="„Rendelés leadása” kérés"></label><label style="display:block;margin:2px 0">Környezet: <input id="f_korny" size="48" value="normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s"></label><label style="display:block;margin:2px 0">Artifact: <input id="f_artifact" size="48" value="checkout API + order-service"></label><label style="display:block;margin:2px 0">Válasz: <input id="f_valasz" size="48" value="rendelés rögzítve, visszaigazolás, fulfillment sor"></label><label style="display:block;margin:2px 0">Mérőszám: <input id="f_mero" size="48" value="P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"></label><button onclick="setSteps(ownSteps())">Saját példa lejátszása</button> <button onclick="resetOwn()">Könyv példája</button></div></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Forrás, inger, környezet (benne az artifact), válasz és mérőszám láncként; a 7. lépésben a négymezős tömörítés: forrás és inger az Inger mezőbe, az artifact a Válasz mezőbe kerül."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Mintaadat: a 9.1 rendelési forgatókönyve. Vastag folytonos keret: a négy kötelező elem; vékony szaggatott: a két opcionális (forrás, artifact).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. Forrás (opcionális) → „Inger” mező: Az inger szövegében szerepel a forrás, például „regisztrált vásárló mobilalkalmazásból”.", "on": 1, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "2. Inger (kötelező) → „Inger” mező: Változatlan; a konkrét eseményt és annak paramétereit tartalmazza.", "on": 2, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "3. Környezet (kötelező) → „Környezet” mező: Változatlan; a terhelést, a rendszerállapotot és az időzítést tartalmazza.", "on": 3, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "4. Artifact (opcionális) → „Válasz” mező: A válasz nevezi meg az érintett elemet (például „a checkout API rögzíti a rendelést”), vagy zárójelben szerepel.", "on": 4, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "5. Válasz (kötelező) → „Válasz” mező: A megfigyelhető reakció; az artifactot is tartalmazza.", "on": 5, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "6. Mérőszám (kötelező) → „Mérőszám” mező: A mutató, a célérték és a mérési ablak/terhelés három külön eleme; a négymezős sablonban egy cellába írva is mindhárom szerepel.", "on": 6, "compact": false, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}, {"msg": "7. Tömörítés: a forrás az inger, az artifact a válasz szövegébe épül; a környezet és a mérőszám változatlan. Feltétel: a rövid formából a forrás és az artifact visszakereshető legyen.", "on": 6, "compact": true, "vals": {"forras": "regisztrált vásárló (mobilapp)", "inger": "„Rendelés leadása” kérés", "korny": "normál csúcs, 200 kérés/perc, replikakésés ≤ 2 s", "artifact": "checkout API + order-service", "valasz": "rendelés rögzítve, visszaigazolás, fulfillment sor", "mero": "P95 ≤ 800 ms, siker ≥ 99,9 %, 5 perces ablak"}}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const KEYS=["forras","inger","korny","artifact","valasz","mero"];
const NAMES=["Forrás","Inger","Környezet","Artifact","Válasz","Mérőszám"];
const REQ=[false,true,true,false,true,true];
function wrapT(x,y,str,maxc,fs,anchor,bold){const words=String(str).split(/\s+/);let line="",lines=[];
 words.forEach(w=>{if((line+" "+w).trim().length>maxc&&line){lines.push(line);line=w;}else line=(line+" "+w).trim();});
 if(line)lines.push(line);lines.forEach((l,i)=>{const t=el("text",{x:x,y:y+i*(fs+3),"font-size":fs,"text-anchor":anchor||"middle"},l);if(bold)t.setAttribute("font-weight","bold");});return lines.length;}
function bx(x,y,w,h,req,lit,fillv){el("rect",{x:x,y:y,width:w,height:h,rx:8,fill:fillv||(lit?css("--cellhl"):css("--cell")),
 stroke:css("--line"),"stroke-width":req?(lit?3.5:2.5):1.2,"stroke-dasharray":req?"":"6 4",opacity:lit?1:0.35});}
function arr(x0,y0,x1,y1,dash){el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:css("--line"),"stroke-width":1.6,"stroke-dasharray":dash?"5 4":"","marker-end":"url(#ah)"});}
function render(s){
 svg.setAttribute("viewBox","0 0 760 380");svg.innerHTML="";
 const d=el("defs",{});const m=document.createElementNS(NS,"marker");
 [["id","ah"],["markerWidth","8"],["markerHeight","8"],["refX","7"],["refY","4"],["orient","auto"]].forEach(a=>m.setAttribute(a[0],a[1]));
 const p=document.createElementNS(NS,"path");p.setAttribute("d","M0,0 L8,4 L0,8 z");p.setAttribute("fill",css("--line"));m.appendChild(p);d.appendChild(m);
 const v=s.vals,on=s.on;
 const lit=i=>on>i; // i: 0..5
 // felső sor
 const X=[5,135,270,300,505,635],W=[115,120,215,155,115,120];
 const Y=40,H=110;
 // környezet keret
 bx(270,20,215,190,true,lit(2),lit(2)?css("--cellhl"):css("--cell"));
 el("text",{x:377,y:38,"text-anchor":"middle","font-size":13,"font-weight":"bold",opacity:lit(2)?1:0.35},"Környezet");
 if(lit(2)) wrapT(377,54,v.korny,34,11);
 [0,1,4,5].forEach(i=>{bx(X[i],Y+30,W[i],H,REQ[i],lit(i));
   el("text",{x:X[i]+W[i]/2,y:Y+48,"text-anchor":"middle","font-size":13,"font-weight":"bold",opacity:lit(i)?1:0.35},NAMES[i]);
   if(lit(i)) wrapT(X[i]+W[i]/2,Y+66,v[KEYS[i]],17,11);});
 bx(300,95,155,95,false,lit(3),css("--cell"));
 el("text",{x:377,y:113,"text-anchor":"middle","font-size":13,"font-weight":"bold",opacity:lit(3)?1:0.35},"Artifact");
 if(lit(3)) wrapT(377,130,v.artifact,24,11);
 if(lit(1))arr(120,125,133,125); if(lit(2))arr(255,125,268,125); if(lit(4))arr(485,125,503,125); if(lit(5))arr(620,125,633,125);
 // alsó sor: négy mező
 if(s.compact){
  const F=[["Inger",v.forras+": "+v.inger,5,250,"forrás + inger"],["Környezet",v.korny,262,180,""],
           ["Válasz",v.valasz+" ("+v.artifact+")",450,165,"válasz + artifact"],["Mérőszám",v.mero,622,135,""]];
  F.forEach(f=>{el("rect",{x:f[2],y:250,width:f[3],height:120,rx:8,fill:css("--cellhl"),stroke:css("--line"),"stroke-width":3});
   el("text",{x:f[2]+f[3]/2,y:268,"text-anchor":"middle","font-size":13,"font-weight":"bold"},"„"+f[0]+"” mező");
   wrapT(f[2]+f[3]/2,286,f[1],Math.floor(f[3]/6.2),11);
   if(f[4]) el("text",{x:f[2]+f[3]/2,y:244,"text-anchor":"middle","font-size":11,"font-style":"italic",fill:css("--hl2")},f[4]);});
  arr(62,176,62,232);arr(195,176,130,232);arr(377,212,350,232);arr(377,190,520,232,true);arr(562,176,537,232);arr(695,176,695,232);
 } else {
  el("text",{x:380,y:300,"text-anchor":"middle","font-size":12,fill:css("--muted")},"A 7. lépés mutatja a négymezős tömörítést.");
 }
 el("rect",{x:5,y:2,width:22,height:12,fill:"none",stroke:css("--line"),"stroke-width":2.5});
 el("text",{x:32,y:12,"font-size":11},"kötelező");
 el("rect",{x:95,y:2,width:22,height:12,fill:"none",stroke:css("--line"),"stroke-width":1.2,"stroke-dasharray":"6 4"});
 el("text",{x:122,y:12,"font-size":11},"opcionális");
}
const RULEMSG = ["1. Forrás (opcionális) → „Inger” mező: Az inger szövegében szerepel a forrás, például „regisztrált vásárló mobilalkalmazásból”.", "2. Inger (kötelező) → „Inger” mező: Változatlan; a konkrét eseményt és annak paramétereit tartalmazza.", "3. Környezet (kötelező) → „Környezet” mező: Változatlan; a terhelést, a rendszerállapotot és az időzítést tartalmazza.", "4. Artifact (opcionális) → „Válasz” mező: A válasz nevezi meg az érintett elemet (például „a checkout API rögzíti a rendelést”), vagy zárójelben szerepel.", "5. Válasz (kötelező) → „Válasz” mező: A megfigyelhető reakció; az artifactot is tartalmazza.", "6. Mérőszám (kötelező) → „Mérőszám” mező: A mutató, a célérték és a mérési ablak/terhelés három külön eleme; a négymezős sablonban egy cellába írva is mindhárom szerepel.", "7. Tömörítés: a forrás az inger, az artifact a válasz szövegébe épül; a környezet és a mérőszám változatlan. Feltétel: a rövid formából a forrás és az artifact visszakereshető legyen."];
function ownSteps(){
 const vals={};KEYS.forEach(k=>{vals[k]=document.getElementById("f_"+k).value.trim()||"(üres)";});
 const out=[];for(let i=0;i<6;i++)out.push({msg:RULEMSG[i],on:i+1,compact:false,vals:vals});
 out.push({msg:RULEMSG[6],on:6,compact:true,vals:vals});return out;}
function toggleOwn(){const b=document.getElementById("ownbox");b.hidden=!b.hidden;}
function resetOwn(){KEYS.forEach(k=>{document.getElementById("f_"+k).value=STEPS0[0].vals[k];});setSteps(STEPS0.slice());}
const STEPS0 = STEPS.slice();


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
