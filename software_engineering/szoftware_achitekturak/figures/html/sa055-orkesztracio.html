<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orkesztráció és koreográfia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="hb"> hiba a számlázásnál</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felül központi orkesztrátor parancsokkal, alul eseményláncolat; a hibás számlázásra mindkettő kompenzál, de központi állapot csak az orkesztrációban van."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Folytonos: parancs; szaggatott: esemény vagy válasz; pontozott: kompenzáció. Az Acme Retail rendelési folyamata (szemléltető).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. lépés – (a) orkesztráció: indítás (order-42); a folyamat állapotát az orkesztrátor tudja (lépés 0/3). (b) koreográfia: RendelesLetrejott; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott.", "o": 0, "c": 0, "mode": "ok"}, {"msg": "2. lépés – (a) orkesztráció: FoglaldLeKeszletet; a folyamat állapotát az orkesztrátor tudja (lépés 1/3). (b) koreográfia: KeszletLefoglalva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva.", "o": 1, "c": 1, "mode": "ok"}, {"msg": "3. lépés – (a) orkesztráció: foglalva; a folyamat állapotát az orkesztrátor tudja (lépés 1/3 kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 2, "c": 2, "mode": "ok"}, {"msg": "4. lépés – (a) orkesztráció: AllitsdKiSzamlat; a folyamat állapotát az orkesztrátor tudja (lépés 2/3). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 3, "c": 2, "mode": "ok"}, {"msg": "5. lépés – (a) orkesztráció: kiállítva; a folyamat állapotát az orkesztrátor tudja (lépés 2/3 kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 4, "c": 2, "mode": "ok"}, {"msg": "6. lépés – (a) orkesztráció: KuldjErtesitest; a folyamat állapotát az orkesztrátor tudja (lépés 3/3 – kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 5, "c": 2, "mode": "ok"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});

  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const LA = ["Rendeléskezelő", "Orkesztrátor\n(ESB)", "Készletkezelő", "Számlakezelő", "Értesítés"], LB = ["Rendeléskezelő", "Készletkezelő", "Számlakezelő", "Értesítés"], OR = {"ok": [[0, 1, "indítás (order-42)", "cmd", "lépés 0/3"], [1, 2, "FoglaldLeKeszletet", "cmd", "lépés 1/3"], [2, 1, "foglalva", "rep", "lépés 1/3 kész"], [1, 3, "AllitsdKiSzamlat", "cmd", "lépés 2/3"], [3, 1, "kiállítva", "rep", "lépés 2/3 kész"], [1, 4, "KuldjErtesitest", "cmd", "lépés 3/3 – kész"]], "hiba": [[0, 1, "indítás (order-42)", "cmd", "lépés 0/3"], [1, 2, "FoglaldLeKeszletet", "cmd", "lépés 1/3"], [2, 1, "foglalva", "rep", "lépés 1/3 kész"], [1, 3, "AllitsdKiSzamlat", "cmd", "lépés 2/3"], [3, 1, "HIBA: számlázás meghiúsult", "fail", "lépés 2/3 hibás"], [1, 2, "OldjFelFoglalast (kompenzáció)", "comp", "kompenzáció"], [1, 4, "KuldjErtesitest (sikertelen)", "cmd", "lezárva: sikertelen"]]}, CH = {"ok": [[0, 1, "RendelesLetrejott", "evt"], [1, 2, "KeszletLefoglalva", "evt"], [2, 3, "SzamlaKiallitva", "evt"]], "hiba": [[0, 1, "RendelesLetrejott", "evt"], [1, 2, "KeszletLefoglalva", "evt"], [2, 1, "SzamlazasSikertelen → foglalás feloldása", "comp"], [2, 3, "SzamlazasSikertelen", "evt"]]}, SA = {"ok": [{"msg": "1. lépés – (a) orkesztráció: indítás (order-42); a folyamat állapotát az orkesztrátor tudja (lépés 0/3). (b) koreográfia: RendelesLetrejott; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott.", "o": 0, "c": 0, "mode": "ok"}, {"msg": "2. lépés – (a) orkesztráció: FoglaldLeKeszletet; a folyamat állapotát az orkesztrátor tudja (lépés 1/3). (b) koreográfia: KeszletLefoglalva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva.", "o": 1, "c": 1, "mode": "ok"}, {"msg": "3. lépés – (a) orkesztráció: foglalva; a folyamat állapotát az orkesztrátor tudja (lépés 1/3 kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 2, "c": 2, "mode": "ok"}, {"msg": "4. lépés – (a) orkesztráció: AllitsdKiSzamlat; a folyamat állapotát az orkesztrátor tudja (lépés 2/3). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 3, "c": 2, "mode": "ok"}, {"msg": "5. lépés – (a) orkesztráció: kiállítva; a folyamat állapotát az orkesztrátor tudja (lépés 2/3 kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 4, "c": 2, "mode": "ok"}, {"msg": "6. lépés – (a) orkesztráció: KuldjErtesitest; a folyamat állapotát az orkesztrátor tudja (lépés 3/3 – kész). (b) koreográfia: SzamlaKiallitva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlaKiallitva.", "o": 5, "c": 2, "mode": "ok"}], "hiba": [{"msg": "1. lépés – (a) orkesztráció: indítás (order-42); a folyamat állapotát az orkesztrátor tudja (lépés 0/3). (b) koreográfia: RendelesLetrejott; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott.", "o": 0, "c": 0, "mode": "hiba"}, {"msg": "2. lépés – (a) orkesztráció: FoglaldLeKeszletet; a folyamat állapotát az orkesztrátor tudja (lépés 1/3). (b) koreográfia: KeszletLefoglalva; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva.", "o": 1, "c": 1, "mode": "hiba"}, {"msg": "3. lépés – (a) orkesztráció: foglalva; a folyamat állapotát az orkesztrátor tudja (lépés 1/3 kész). (b) koreográfia: SzamlazasSikertelen → foglalás feloldása; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlazasSikertelen.", "o": 2, "c": 2, "mode": "hiba"}, {"msg": "4. lépés – (a) orkesztráció: AllitsdKiSzamlat; a folyamat állapotát az orkesztrátor tudja (lépés 2/3). (b) koreográfia: SzamlazasSikertelen; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlazasSikertelen → SzamlazasSikertelen.", "o": 3, "c": 3, "mode": "hiba"}, {"msg": "5. lépés – (a) orkesztráció: HIBA: számlázás meghiúsult; a folyamat állapotát az orkesztrátor tudja (lépés 2/3 hibás). (b) koreográfia: SzamlazasSikertelen; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlazasSikertelen → SzamlazasSikertelen.", "o": 4, "c": 3, "mode": "hiba"}, {"msg": "6. lépés – (a) orkesztráció: OldjFelFoglalast (kompenzáció); a folyamat állapotát az orkesztrátor tudja (kompenzáció). (b) koreográfia: SzamlazasSikertelen; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlazasSikertelen → SzamlazasSikertelen.", "o": 5, "c": 3, "mode": "hiba"}, {"msg": "7. lépés – (a) orkesztráció: KuldjErtesitest (sikertelen); a folyamat állapotát az orkesztrátor tudja (lezárva: sikertelen). (b) koreográfia: SzamlazasSikertelen; központi állapot nincs – senki sem tudja, csak a trace-ből (order-42) rekonstruálható: RendelesLetrejott → KeszletLefoglalva → SzamlazasSikertelen → SzamlazasSikertelen.", "o": 6, "c": 3, "mode": "hiba"}]};
function lane(names, y0, h, xs){ names.forEach((n, i) => { R(xs[i] - 58, y0, 116, 24, {rx: 2, "stroke-width": n.startsWith("Orkesztrátor") ? 2.6 : 1.2}); T(xs[i], y0 + 16, n.replace("\n", " "), {"font-size": 11.5, "text-anchor": "middle"}); L(xs[i], y0 + 24, xs[i], y0 + h, {stroke: css("--muted"), "stroke-dasharray": "3 3", "stroke-width": 0.8}); }); }
function msgs(ms, upto, xs, y0){ ms.forEach((m, r) => { if (r > upto) return; const y = y0 + r * 19, on = r === upto, dash = {cmd: "", rep: "5 3", evt: "6 3", comp: "2 3", fail: "5 3"}[m[3]];
  L(xs[m[0]], y, xs[m[1]], y, {"stroke-dasharray": dash, "stroke-width": on ? 2 : (m[3] === "comp" ? 1.8 : 1.2), stroke: on ? css("--hl") : css("--line"), "marker-end": on ? "url(#arh)" : "url(#ar)"});
  T((xs[m[0]] + xs[m[1]]) / 2, y - 4, m[2], {"font-size": 11, "text-anchor": "middle"}); if (m[3] === "fail") X((xs[m[0]] + xs[m[1]]) / 2, y, 6); }); }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 400");
  svg.innerHTML = ""; defs0();
  const xa = [62, 192, 322, 452, 582], xb = [62, 192, 322, 452];
  T(4, 14, "(a) orkesztráció", {"font-size": 12.5, "font-weight": "bold"});
  lane(LA, 20, 160, xa); msgs(OR[s.mode], s.o, xa, 62);
  R(132, 186, 200, 22, {rx: 2, fill: css("--cellhl"), "stroke-width": 2}); T(232, 201, "állapot: " + OR[s.mode][s.o][4], {"font-size": 11.5, "text-anchor": "middle", "font-weight": "bold"});
  T(4, 228, "(b) koreográfia", {"font-size": 12.5, "font-weight": "bold"});
  lane(LB, 234, 120, xb); msgs(CH[s.mode], s.c, xb, 276);
  R(520, 300, 136, 92, {rx: 2, fill: "url(#dots)", "stroke-dasharray": "5 3"}); R(526, 306, 124, 80, {rx: 2, fill: css("--bg"), stroke: "none"});
  T(530, 320, "trace (order-42):", {"font-size": 11, "font-weight": "bold"});
  CH[s.mode].slice(0, s.c + 1).forEach((m, i) => T(530, 336 + i * 14, m[2].split(" ")[0], {"font-size": 10.5}));
}
document.getElementById("hb").addEventListener("change", e => { const keep = +document.getElementById("pos").value; setSteps(SA[e.target.checked ? "hiba" : "ok"]); show(keep); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
