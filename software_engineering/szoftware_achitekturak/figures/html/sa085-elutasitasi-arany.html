<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csoportonkénti elutasítási arány: kis és nagy minta bizonytalansága</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
fieldset{border:1px solid var(--muted);padding:4px 8px;margin:0}
input[type=number]{width:6.5em;font:inherit}
input[type=range]{width:130px}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
  <fieldset><legend>A csoport (kör)</legend>
    <label>n <input id="nA" type="number" min="1" max="100000" value="20"></label>
    <label>elutasítva <input id="kA" type="number" min="0" max="100000" value="4"></label>
    <input id="kAr" type="range" min="0" max="20" value="4" aria-label="A elutasítások csúszka">
  </fieldset>
  <fieldset><legend>B csoport (háromszög)</legend>
    <label>n <input id="nB" type="number" min="1" max="100000" value="5"></label>
    <label>elutasítva <input id="kB" type="number" min="0" max="100000" value="2"></label>
    <input id="kBr" type="range" min="0" max="5" value="2" aria-label="B elutasítások csúszka">
  </fieldset>
</div>
<div class="ctl"><span class="small">A példák visszaállítása:</span>
  <button onclick="setCase(4,20,2,5)">1. kis minta (4/20, 2/5)</button>
  <button onclick="setCase(1000,10000,1100,10000)">2. nagy minta (1000/10 000, 1100/10 000)</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 300" role="img" aria-label="Két csoport elutasítási aránya Wilson-intervallummal és a különbség intervalluma"></svg>
<p class="small">Szintetikus adat; Wilson 95%-os intervallum, a különbségé Newcombe-féle (hibrid Wilson); p-érték: Fisher-egzakt (kétoldalú) és kétmintás z-próba. Az alaparányra korrigálatlan – a különbség önmagában nem bizonyít diszkriminációt.</p>
<script>
const Z = 1.959963984540054, svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(t, a, x){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (x !== undefined) e.textContent = x; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function cm(x, d){ return x.toFixed(d).replace(".", ",").replace("-", "−"); }
function wilson(k, n){ const p = k / n, d = 1 + Z * Z / n, c = (p + Z * Z / (2 * n)) / d, h = Z * Math.sqrt(p * (1 - p) / n + Z * Z / (4 * n * n)) / d; return [p, Math.max(0, c - h), Math.min(1, c + h)]; }
function lgam(x){ const g = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015; for (let j = 0; j < 6; j++) s += g[j] / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
function lfact(n){ return lgam(n + 1); }
function fisher(k1, n1, k2, n2){ const K = k1 + k2, N = n1 + n2;
  const lp = x => lfact(K) + lfact(N - K) + lfact(n1) + lfact(n2) - lfact(N) - lfact(x) - lfact(K - x) - lfact(n1 - x) - lfact(n2 - K + x);
  const lo = Math.max(0, K - n2), hi = Math.min(K, n1), p0 = lp(k1); let s = 0;
  for (let x = lo; x <= hi; x++) { const v = lp(x); if (v <= p0 + 1e-7) s += Math.exp(v); } return Math.min(1, s); }
function erfc(x){ const t = 1 / (1 + 0.5 * Math.abs(x)); const r = t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277))))))))); return x >= 0 ? r : 2 - r; }
function ztest(k1, n1, k2, n2){ const p = (k1 + k2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2)); if (!se) return 1; const z = (k2 / n2 - k1 / n1) / se; return erfc(Math.abs(z) / Math.SQRT2); }
function g(id){ return Math.max(0, Math.round(+document.getElementById(id).value || 0)); }
function setCase(a, b, c, d){ document.getElementById("kA").value = a; document.getElementById("nA").value = b; document.getElementById("kB").value = c; document.getElementById("nB").value = d; draw(); }
function draw(src){
  let nA = Math.max(1, g("nA")), nB = Math.max(1, g("nB")), kA = Math.min(g("kA"), nA), kB = Math.min(g("kB"), nB);
  if (src === "rA") kA = Math.min(g("kAr"), nA); if (src === "rB") kB = Math.min(g("kBr"), nB);
  document.getElementById("nA").value = nA; document.getElementById("kA").value = kA; document.getElementById("nB").value = nB; document.getElementById("kB").value = kB;
  const rA = document.getElementById("kAr"), rB = document.getElementById("kBr"); rA.max = nA; rA.value = kA; rB.max = nB; rB.value = kB;
  const wa = wilson(kA, nA), wb = wilson(kB, nB), d = wb[0] - wa[0];
  const dl = d - Math.sqrt((wb[0] - wb[1]) ** 2 + (wa[2] - wa[0]) ** 2), dh = d + Math.sqrt((wb[2] - wb[0]) ** 2 + (wa[0] - wa[1]) ** 2);
  const pf = fisher(kA, nA, kB, nB), pz = ztest(kA, nA, kB, nB);
  document.getElementById("status").textContent = `A: ${kA}/${nA} = ${cm(100 * wa[0], 1)}% [${cm(100 * wa[1], 1)}; ${cm(100 * wa[2], 1)}] · B: ${kB}/${nB} = ${cm(100 * wb[0], 1)}% [${cm(100 * wb[1], 1)}; ${cm(100 * wb[2], 1)}] · B − A = ${cm(100 * d, 1)} százalékpont [${cm(100 * dl, 1)}; ${cm(100 * dh, 1)}] · Fisher p = ${cm(pf, 3)}, z-próba p = ${cm(pz, 3)}` + (dl > 0 || dh < 0 ? " – a különbség intervalluma nem tartalmazza a 0-t." : " – a különbség intervalluma tartalmazza a 0-t.");
  svg.innerHTML = "";
  let lo = Math.min(wa[1], wb[1]) * 100, hi = Math.max(wa[2], wb[2]) * 100, pad = Math.max(0.5, (hi - lo) * 0.12);
  lo = Math.max(0, lo - pad); hi = Math.min(100, hi + pad); if (hi - lo > 60) { lo = 0; hi = 100; }
  const X = v => 90 + (v - lo) / (hi - lo) * 560, fg = css("--fg");
  el("text", {x: 4, y: 18, "font-size": 13}, "Elutasítási arány (%), skála: " + cm(lo, 1) + "–" + cm(hi, 1) + (hi - lo < 99 ? " (nagyított)" : ""));
  [[wa, "A", 70, "c", kA, nA], [wb, "B", 130, "t", kB, nB]].forEach(([w, lab, y, mk, k, n]) => {
    el("text", {x: 50, y: y + 5, "font-size": 14, "font-weight": "bold"}, lab);
    el("line", {x1: X(100 * w[1]), y1: y, x2: X(100 * w[2]), y2: y, stroke: fg, "stroke-width": 2.5});
    [w[1], w[2]].forEach(v => el("line", {x1: X(100 * v), y1: y - 8, x2: X(100 * v), y2: y + 8, stroke: fg, "stroke-width": 1.5}));
    if (mk === "c") el("circle", {cx: X(100 * w[0]), cy: y, r: 7, fill: css("--bg"), stroke: fg, "stroke-width": 2});
    else el("path", {d: `M ${X(100 * w[0]) - 8} ${y + 6} L ${X(100 * w[0]) + 8} ${y + 6} L ${X(100 * w[0])} ${y - 8} Z`, fill: css("--bg"), stroke: fg, "stroke-width": 2});
    el("text", {x: X(100 * w[0]), y: y - 14, "text-anchor": "middle", "font-size": 12}, `${k}/${n} = ${cm(100 * w[0], 1)}%`);
    el("text", {x: Math.min(X(100 * w[2]) + 8, 660), y: y + 4, "font-size": 12}, `[${cm(100 * w[1], 1)}; ${cm(100 * w[2], 1)}]`);
  });
  el("line", {x1: 90, y1: 160, x2: 650, y2: 160, stroke: fg});
  for (let i = 0; i <= 5; i++) { const v = lo + (hi - lo) * i / 5; el("line", {x1: X(v), y1: 160, x2: X(v), y2: 165, stroke: fg}); el("text", {x: X(v), y: 178, "text-anchor": "middle", "font-size": 11}, cm(v, hi - lo < 10 ? 1 : 0)); }
  // különbség
  let a = Math.min(dl, 0) * 100, b = Math.max(dh, 0) * 100, p2 = Math.max(0.2, (b - a) * 0.1); a -= p2; b += p2;
  const XD = v => 90 + (v - a) / (b - a) * 560;
  el("text", {x: 4, y: 208, "font-size": 13}, "Különbség B − A (százalékpont), Newcombe 95%");
  el("line", {x1: XD(0), y1: 220, x2: XD(0), y2: 262, stroke: css("--muted"), "stroke-dasharray": "2 2"});
  el("text", {x: XD(0), y: 290, "text-anchor": "middle", "font-size": 11, fill: css("--muted")}, "0");
  el("line", {x1: XD(100 * dl), y1: 242, x2: XD(100 * dh), y2: 242, stroke: fg, "stroke-width": 2.5, "stroke-dasharray": "8 4"});
  el("rect", {x: XD(100 * d) - 5, y: 237, width: 10, height: 10, fill: fg, transform: `rotate(45 ${XD(100 * d)} 242)`});
  el("text", {x: XD(100 * d), y: 232, "text-anchor": "middle", "font-size": 12}, `${cm(100 * d, 1)} [${cm(100 * dl, 1)}; ${cm(100 * dh, 1)}]`);
  el("text", {x: 660, y: 246, "font-size": 12}, "p = " + cm(Math.min(pf, pz) === pf ? pf : pf, 3) + " (Fisher)");
  el("text", {x: 660, y: 262, "font-size": 12}, "p = " + cm(pz, 3) + " (z)");
}
["nA", "kA", "nB", "kB"].forEach(id => document.getElementById(id).addEventListener("input", () => draw()));
document.getElementById("kAr").addEventListener("input", () => draw("rA"));
document.getElementById("kBr").addEventListener("input", () => draw("rB"));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
