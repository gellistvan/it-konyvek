<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kvórum: R + W > N</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N: <input type="range" id="nn" min="3" max="7" value="3" style="width:80px"> <b id="vn">3</b></label> <label>W: <input type="range" id="ww" min="1" max="3" value="2" style="width:80px"> <b id="vw">2</b></label> <label>R: <input type="range" id="rr" min="1" max="3" value="2" style="width:80px"> <b id="vr">2</b></label> <button id="wbtn">írás (véletlen W replikára)</button> <button id="rbtn">olvasás (véletlen R replikáról)</button> <label><input type="checkbox" id="dn"> egy replika kiesik</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Replikák írási és olvasási halmazzal; ha R + W > N, az olvasási halmaz mindig metszi az írásit és friss értéket ad, különben elavult értéket kaphat."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Az olvasó a válaszok közül a nagyobb verziót választja. A véletlen próbák rögzített seeddel futnak (determinisztikus számlálás, nem mérés). Kiesett replikánál a kvórum akkor teljesíthető, ha az elérhető replikák száma legalább W, illetve R.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"N": 3, "W": 2, "R": 2, "w": [0, 1], "r": [1, 2], "v": [2, 2, 1], "down": false, "stale": 0, "msg": "Írás v2 → {A, B}, olvasás {B, C}: metszet: {B} → friss (v2). A számláló N = 3, W = 2, R = 2 mellett 0 elavult olvasást mutat."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let RND = rng(42);
function pick(n, k, avail){ const a = avail.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RND() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k).sort((x, y) => x - y); }
function trials(N, W, R){ const r = rng(7); let stale = 0; const all = [...Array(N).keys()];
  for (let t = 0; t < 1000; t++) { const sh = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const w = sh(all).slice(0, W), rd = sh(all).slice(0, R); if (!rd.some(x => w.includes(x))) stale++; } return stale; }
function render(s){
  svg.setAttribute("viewBox", "0 0 660 260");
  svg.innerHTML = ""; defs0();
  const N = s.N, dx = 600 / N;
  for (let i = 0; i < N; i++) { const x = 30 + dx * i + dx / 2, y = 110, down = s.down && i === N - 1;
    const inW = s.w.includes(i), inR = s.r.includes(i);
    if (inW) R(x - 38, y - 44, 76, 88, {rx: 10, fill: "none", "stroke-width": 3});
    if (inR) R(x - 30, y - 36, 60, 72, {rx: 8, fill: "none", "stroke-width": 2.2, "stroke-dasharray": "6 4", stroke: css("--hl")});
    el("circle", {cx: x, cy: y, r: 22, fill: down ? "url(#hat)" : (s.v[i] === 2 ? css("--fg") : css("--cell")), stroke: css("--line"), "stroke-width": 1.5});
    T(x, y + 5, String.fromCharCode(65 + i) + (down ? "" : " v" + s.v[i]), {"font-size": 12, "text-anchor": "middle", fill: s.v[i] === 2 && !down ? css("--bg") : css("--fg"), "font-weight": "bold"});
    if (down) X(x, y, 14); }
  T(30, 190, "folytonos keret: írási halmaz (W = " + s.W + "), szaggatott: olvasási halmaz (R = " + s.R + ")", {"font-size": 12});
  T(30, 212, "R + W = " + (s.R + s.W) + (s.R + s.W > N ? " > " : " ≤ ") + "N = " + N + (s.R + s.W > N ? ": a halmazok mindig metszik egymást" : ": lehet metszet nélküli olvasás"), {"font-size": 12.5, "font-weight": "bold"});
  T(30, 236, "1000 véletlen próba (seed 7): elavult olvasás " + s.stale + " esetben (" + (s.stale / 10).toFixed(1).replace(".", ",") + "%)", {"font-size": 12.5});
}
let CUR = {N: 3, W: 2, R: 2, w: [0, 1], r: [1, 2], v: [2, 2, 1], down: false, stale: 0};
function cfg(){ const N = +document.getElementById("nn").value; ["ww", "rr"].forEach(id => { const e = document.getElementById(id); e.max = N; if (+e.value > N) e.value = N; });
  const W = +document.getElementById("ww").value, R = +document.getElementById("rr").value, down = document.getElementById("dn").checked;
  ["vn", "vw", "vr"].forEach((id, i) => document.getElementById(id).textContent = [N, W, R][i]);
  return {N: N, W: W, R: R, down: down}; }
function msg(s, extra){ const avail = s.N - (s.down ? 1 : 0); let m = extra;
  if (s.down) m += " Elérhető replikák: " + avail + "; írás " + (avail >= s.W ? "teljesíthető" : "NEM teljesíthető (W > elérhető)") + ", olvasás " + (avail >= s.R ? "teljesíthető." : "NEM teljesíthető (R > elérhető).");
  return m; }
function reset(){ const c = cfg(); RND = rng(42); CUR = Object.assign(c, {w: [], r: [], v: Array(c.N).fill(1), stale: trials(c.N, c.W, c.R)});
  setSteps([Object.assign({}, CUR, {msg: msg(CUR, "Kezdetben minden replika v1-et tárol. Nyomd meg az „írás”, majd az „olvasás” gombot.")})]); }
function avail(){ return [...Array(CUR.N).keys()].filter(i => !(CUR.down && i === CUR.N - 1)); }
document.getElementById("wbtn").addEventListener("click", () => { const a = avail(); if (a.length < CUR.W) { setSteps([Object.assign({}, CUR, {msg: msg(CUR, "Írás sikertelen: nincs meg az írási kvórum.")})]); return; }
  CUR.w = pick(CUR.N, CUR.W, a); CUR.r = []; CUR.v = Array(CUR.N).fill(1); CUR.w.forEach(i => CUR.v[i] = 2);
  setSteps([Object.assign({}, CUR, {msg: msg(CUR, "Írás v2 → {" + CUR.w.map(i => String.fromCharCode(65 + i)).join(", ") + "}.")})]); });
document.getElementById("rbtn").addEventListener("click", () => { const a = avail(); if (a.length < CUR.R) { setSteps([Object.assign({}, CUR, {msg: msg(CUR, "Olvasás sikertelen: nincs meg az olvasási kvórum.")})]); return; }
  CUR.r = pick(CUR.N, CUR.R, a); const met = CUR.r.filter(i => CUR.w.includes(i)), best = Math.max(...CUR.r.map(i => CUR.v[i]));
  setSteps([Object.assign({}, CUR, {msg: msg(CUR, "Olvasás {" + CUR.r.map(i => String.fromCharCode(65 + i)).join(", ") + "}: " + (met.length ? "metszet: {" + met.map(i => String.fromCharCode(65 + i)).join(", ") + "} → friss (v" + best + ")." : "nincs metszet → elavult lehet (v" + best + ")."))})]); });
["nn", "ww", "rr", "dn"].forEach(id => document.getElementById(id).addEventListener("input", reset));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
