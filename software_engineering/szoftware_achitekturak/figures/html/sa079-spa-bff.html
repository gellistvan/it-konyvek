<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPA + PKCE és BFF</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span role="group" aria-label="Profil"><button class="pf" data-p="spa" aria-pressed="true" onclick="pick('spa')">SPA + PKCE</button> <button class="pf" data-p="bff" aria-pressed="false" onclick="pick('bff')">BFF</button></span> <label><input type="checkbox" id="pkce" checked onchange="recalc()"> PKCE</label> <label><input type="checkbox" id="state" checked onchange="recalc()"> state</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram a kiválasztott profilra (SPA + PKCE vagy BFF) a támadó, a böngésző, a BFF, az IdP és az API életvonalával; vastag nyíl a tokent hordozó üzenet, szaggatott a támadás; alatta, hogy a böngésző, a BFF és a támadó mit tud az adott lépésben."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Egyszerűsített modell; a refresh token kezelése a profiltól függ. SPA: a tokenek a böngésző memóriájában; BFF: a tokenek a szerveroldali BFF-ben, a böngésző csak HttpOnly, Secure, SameSite munkamenet-sütit kap. A PKCE/state kapcsoló kikapcsolásakor a megfelelő támadás sikeresként jelenik meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"a": "br", "b": "idp", "lab": "1 redirect /authorize\n(S256(verifier), state, nonce)", "kind": "msg", "atk": null, "i": 0, "msg": "", "line": -1}, {"a": "br", "b": "idp", "lab": "2 login + MFA", "kind": "msg", "atk": null, "i": 1, "msg": "", "line": -1}, {"a": "idp", "b": "br", "lab": "3 redirect ?code&state", "kind": "msg", "atk": null, "i": 2, "msg": "", "line": -1}, {"a": "att", "b": "idp", "lab": "ellopott code beváltása", "kind": "attack", "atk": "code", "i": 3, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "CSRF: idegen code a callbackre", "kind": "attack", "atk": "csrf", "i": 4, "msg": "", "line": -1}, {"a": "br", "b": "idp", "lab": "4 POST /token: code + code_verifier", "kind": "token", "atk": null, "i": 5, "msg": "", "line": -1}, {"a": "idp", "b": "br", "lab": "5 ID token + access token", "kind": "token", "atk": null, "i": 6, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "ID token visszajátszása", "kind": "attack", "atk": "replay", "i": 7, "msg": "", "line": -1}, {"a": "br", "b": "api", "lab": "6 API-hívás: Bearer access token", "kind": "token", "atk": null, "i": 8, "msg": "", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LANES = {"spa": [["att", "Támadó", 0.7], ["br", "Böngésző /\nSPA", 3.0], ["idp", "IdP\n/authorize, /token", 6.2], ["api", "API", 9.0]], "bff": [["att", "Támadó", 0.6], ["br", "Böngésző", 2.55], ["bff", "BFF", 4.75], ["idp", "IdP", 7.0], ["api", "API", 9.2]]}, ALL = {"spa": [{"a": "br", "b": "idp", "lab": "1 redirect /authorize\n(S256(verifier), state, nonce)", "kind": "msg", "atk": null, "i": 0, "msg": "", "line": -1}, {"a": "br", "b": "idp", "lab": "2 login + MFA", "kind": "msg", "atk": null, "i": 1, "msg": "", "line": -1}, {"a": "idp", "b": "br", "lab": "3 redirect ?code&state", "kind": "msg", "atk": null, "i": 2, "msg": "", "line": -1}, {"a": "att", "b": "idp", "lab": "ellopott code beváltása", "kind": "attack", "atk": "code", "i": 3, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "CSRF: idegen code a callbackre", "kind": "attack", "atk": "csrf", "i": 4, "msg": "", "line": -1}, {"a": "br", "b": "idp", "lab": "4 POST /token: code + code_verifier", "kind": "token", "atk": null, "i": 5, "msg": "", "line": -1}, {"a": "idp", "b": "br", "lab": "5 ID token + access token", "kind": "token", "atk": null, "i": 6, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "ID token visszajátszása", "kind": "attack", "atk": "replay", "i": 7, "msg": "", "line": -1}, {"a": "br", "b": "api", "lab": "6 API-hívás: Bearer access token", "kind": "token", "atk": null, "i": 8, "msg": "", "line": -1}], "bff": [{"a": "br", "b": "bff", "lab": "1 GET /login", "kind": "msg", "atk": null, "i": 0, "msg": "", "line": -1}, {"a": "bff", "b": "idp", "lab": "2 /authorize (state, nonce, PKCE)", "kind": "msg", "atk": null, "i": 1, "msg": "", "line": -1}, {"a": "idp", "b": "bff", "lab": "3 code a BFF redirect URI-jára", "kind": "msg", "atk": null, "i": 2, "msg": "", "line": -1}, {"a": "att", "b": "idp", "lab": "ellopott code beváltása", "kind": "attack", "atk": "code", "i": 3, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "CSRF: idegen code a callbackre", "kind": "attack", "atk": "csrf", "i": 4, "msg": "", "line": -1}, {"a": "bff", "b": "idp", "lab": "4 POST /token: client secret + verifier", "kind": "token", "atk": null, "i": 5, "msg": "", "line": -1}, {"a": "idp", "b": "bff", "lab": "5 tokenek a BFF-ben", "kind": "token", "atk": null, "i": 6, "msg": "", "line": -1}, {"a": "bff", "b": "br", "lab": "5b HttpOnly, Secure, SameSite süti", "kind": "msg", "atk": null, "i": 7, "msg": "", "line": -1}, {"a": "att", "b": "br", "lab": "ID token visszajátszása", "kind": "attack", "atk": "replay", "i": 8, "msg": "", "line": -1}, {"a": "br", "b": "bff", "lab": "6 kérés + süti", "kind": "msg", "atk": null, "i": 9, "msg": "", "line": -1}, {"a": "bff", "b": "api", "lab": "6b Bearer access token", "kind": "token", "atk": null, "i": 10, "msg": "", "line": -1}]}, KN = {"spa": [{"br": ["code_verifier", "state", "nonce"], "att": []}, null, {"br": ["code"], "att": []}, null, null, null, {"br": ["ID token", "access token (memóriában)"]}, null, null], "bff": [null, {"bff": ["code_verifier", "state", "nonce"]}, {"bff": ["code"]}, null, null, null, {"bff": ["ID token", "access token", "refresh token"]}, {"br": ["munkamenet-süti"]}, null, null, null]};
let PROF = "spa";
function chk(id){ return document.getElementById(id).checked; }
function attackOk(p, kind){ const pk = chk("pkce"), st = chk("state");
  if (kind === "code") return p === "bff" ? [false, pk ? "a /token híváshoz client secret is kell (és PKCE)" : "PKCE nélkül is kell a client secret – a támadónak nincs meg"] : [!pk, pk ? "PKCE: code_verifier nélkül az IdP elutasítja" : "PKCE nélkül a nyilvános kliens code-ja önmagában beváltható – SIKERES"];
  if (kind === "csrf") return [!st, st ? "state: a callback state-je nem egyezik, elutasítva" : "state nélkül a kliens elfogadja a támadó code-ját (bejelentkezési CSRF) – SIKERES"];
  return [false, "nonce: a visszajátszott ID token nonce-a nem egyezik, elutasítva"]; }
function knows(p, upto){ const k = {br: [], bff: [], att: []};
  ALL[p].slice(0, upto + 1).forEach((s, j) => { const kn = KN[p][j]; if (kn) for (const w in kn) kn[w].forEach(x => { if (!k[w].includes(x)) k[w].push(x); });
    if (s.kind === "attack") { const [ok] = attackOk(p, s.atk), it = {code: "ellopott code", csrf: "saját code-ja", replay: "régi ID token"}[s.atk]; if (!k.att.includes(it)) k.att.push(it); if (ok && s.atk === "code") k.att.push("access token (!)"); if (ok && s.atk === "csrf") k.att.push("az áldozat a támadó fiókjába lép be (!)"); } });
  return k; }
function pick(p){ PROF = p; document.querySelectorAll("button.pf").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === p)); setSteps(ALL[p]); }
function recalc(){ show(k); }
function render(s){
  const p = PROF, L = {}; LANES[p].forEach(([id, lab, x]) => L[id] = 30 + x * 52);
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 " + (p === "bff" ? 470 : 420));
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--fg")}"/></marker>`;
  svg.appendChild(defs);
  const N = ALL[p].length, dy = Math.min(30, 300 / N);
  LANES[p].forEach(([id, lab, x]) => { const X = L[id]; el("rect", {x: X - 50, y: 8, width: 100, height: 34, rx: 6, fill: id === "att" ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-dasharray": id === "att" ? "5 3" : ""});
    lab.split("\n").forEach((t, j, arr) => el("text", {x: X, y: 25 + (j - (arr.length - 1) / 2) * 13 + 4, "text-anchor": "middle", "font-size": 11.5}, t));
    el("line", {x1: X, y1: 42, x2: X, y2: 60 + N * dy, stroke: css("--muted"), "stroke-dasharray": "3 4"}); });
  ALL[p].forEach((q, j) => { if (j > k) return; const y = 62 + j * dy, x0 = L[q.a], x1 = L[q.b], cur = j === k;
    if (q.kind === "attack") { const [ok] = attackOk(p, q.atk);
      el("line", {x1: x0, y1: y, x2: x1 + (x1 > x0 ? -4 : 4), y2: y, stroke: ok ? css("--hl2") : css("--fg"), "stroke-width": cur ? 2.5 : 1.4, "stroke-dasharray": "7 4", "marker-end": "url(#ah)"});
      el("text", {x: x1 + (x1 > x0 ? -14 : 14), y: y + 6, "text-anchor": "middle", "font-size": 17, "font-weight": "bold", fill: ok ? css("--hl2") : css("--fg")}, ok ? "!" : "×");
      el("text", {x: (x0 + x1) / 2, y: y - 4, "text-anchor": "middle", "font-size": 11, "font-style": "italic", "font-weight": cur ? "bold" : "normal"}, q.lab + (ok ? " – SIKERES" : " – meghiúsul"));
    } else {
      el("line", {x1: x0, y1: y, x2: x1 + (x1 > x0 ? -3 : 3), y2: y, stroke: cur ? css("--hl") : css("--fg"), "stroke-width": q.kind === "token" ? 3.2 : 1.4, "marker-end": "url(#ah)"});
      el("text", {x: (x0 + x1) / 2, y: y - 4, "text-anchor": "middle", "font-size": 11, "font-weight": cur ? "bold" : "normal"}, q.lab);
    } });
  const K = knows(p, k), y0 = 72 + N * dy;
  el("text", {x: 10, y: y0, "font-size": 12, "font-weight": "bold"}, "Ki mit tud?");
  el("text", {x: 10, y: y0 + 18, "font-size": 12}, "böngésző: " + (K.br.join(", ") || "—"));
  if (p === "bff") el("text", {x: 10, y: y0 + 36, "font-size": 12}, "BFF (szerveroldal): " + (K.bff.join(", ") || "—"));
  el("text", {x: 10, y: y0 + (p === "bff" ? 54 : 36), "font-size": 12, fill: K.att.some(x => x.includes("!")) ? css("--hl2") : css("--fg")}, "támadó: " + (K.att.join(", ") || "—"));
  status.textContent = s.kind === "attack" ? `${s.lab}: ${attackOk(p, s.atk)[1]}.` : `${s.lab.replace("\n", " ")}.` + (s.kind === "token" ? " (tokent hordozó üzenet)" : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
