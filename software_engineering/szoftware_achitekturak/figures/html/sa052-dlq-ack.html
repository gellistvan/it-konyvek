<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retry, dead letter, nyugtázás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>teszteset: <select id="case"><option value="1">1. átmeneti hiba</option><option value="2">2. végleges hiba</option><option value="3">3. DLQ-írási hiba</option><option value="saj">saját</option></select></label><span id="own" style="display:none"><label> 1. kísérlet: <select id="k1"><option value="siker">siker</option><option value="atmeneti">átmeneti hiba</option><option value="vegleges">végleges hiba</option></select></label><label> 2. kísérlet: <select id="k2"><option value="siker">siker</option><option value="atmeneti">átmeneti hiba</option><option value="vegleges">végleges hiba</option></select></label><label> 3. kísérlet: <select id="k3"><option value="siker">siker</option><option value="atmeneti">átmeneti hiba</option><option value="vegleges">végleges hiba</option></select></label> <label>DLQ-írás: <select id="dlq"><option value="ok">sikeres</option><option value="hiba">sikertelen</option></select></label></span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Állapotgép: átmeneti hibánál visszalépés backoff-fal, végleges hibánál dead letter, nyugtázás csak sikeres feldolgozás vagy sikeres DLQ-írás után."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell: legfeljebb 3 kísérlet, exponenciális backoff (1 s, 2 s); a végleges hiba azonnal a DLQ-ra kerül. ACK csak sikeres feldolgozás vagy sikeres DLQ-írás után. Nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "üzenet fogadva (még nincs ACK)", "st": "Fogadva", "log": ["üzenet fogadva (még nincs ACK)"], "case": "1"}, {"msg": "kísérlet 1/3: átmeneti hiba", "st": "Feldolgozás", "log": ["üzenet fogadva (még nincs ACK)", "kísérlet 1/3: átmeneti hiba"], "case": "1"}, {"msg": "kísérlet 1/3 sikertelen, backoff 1 s", "st": "Várakozás", "log": ["üzenet fogadva (még nincs ACK)", "kísérlet 1/3: átmeneti hiba", "kísérlet 1/3 sikertelen, backoff 1 s"], "case": "1"}, {"msg": "kísérlet 2/3: sikeres", "st": "Feldolgozás", "log": ["üzenet fogadva (még nincs ACK)", "kísérlet 1/3: átmeneti hiba", "kísérlet 1/3 sikertelen, backoff 1 s", "kísérlet 2/3: sikeres"], "case": "1"}, {"msg": "ACK elküldve – a feldolgozás tartósan megtörtént", "st": "ACK", "log": ["üzenet fogadva (még nincs ACK)", "kísérlet 1/3: átmeneti hiba", "kísérlet 1/3 sikertelen, backoff 1 s", "kísérlet 2/3: sikeres", "ACK elküldve – a feldolgozás tartósan megtörtént"], "case": "1"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: w, height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function X(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }

const POS = {"Fogadva": [8, 30], "Feldolgozás": [32, 30], "Várakozás": [32, 10], "DLQ-írás": [62, 18], "ACK": [90, 30], "NINCS ACK": [90, 6]}, EDGES = [["Fogadva", "Feldolgozás", "kézbesítés"], ["Feldolgozás", "ACK", "siker"], ["Feldolgozás", "Várakozás", "átmeneti hiba,\nkísérlet < 3"], ["Várakozás", "Feldolgozás", "backoff\n1 s, 2 s"], ["Feldolgozás", "DLQ-írás", "végleges hiba vagy\nkimerült (3/3)"], ["DLQ-írás", "ACK", "írás sikeres"], ["DLQ-írás", "NINCS ACK", "írás sikertelen"]], MAXK = 3;
function sim(outs, dlqOk){
  const st = [["Fogadva", "üzenet fogadva (még nincs ACK)"]], nm = {siker: "sikeres", atmeneti: "átmeneti hiba", vegleges: "végleges hiba (érvénytelen séma)"};
  let i;
  for (i = 1; i <= MAXK; i++) {
    const o = outs[i - 1] || "atmeneti";
    st.push(["Feldolgozás", "kísérlet " + i + "/" + MAXK + ": " + nm[o]]);
    if (o === "siker") { st.push(["ACK", "ACK elküldve – a feldolgozás tartósan megtörtént"]); return st; }
    if (o === "vegleges") break;
    if (i < MAXK) st.push(["Várakozás", "kísérlet " + i + "/" + MAXK + " sikertelen, backoff " + Math.pow(2, i - 1) + " s"]);
    else { st.push(["DLQ-írás", "kísérletszám kimerült (" + MAXK + "/" + MAXK + ") → dead letter"]); break; }
  }
  if (st[st.length - 1][0] !== "DLQ-írás") st.push(["DLQ-írás", "végleges hiba: azonnal a dead letterre (nincs retry)"]);
  if (dlqOk) st.push(["ACK", "DLQ-írás sikeres → ACK elküldve"]);
  else { st.push(["NINCS ACK", "DLQ-írás sikertelen → ACK visszatartva"]); st.push(["Fogadva", "a broker újrakézbesíti az üzenetet (nincs vesztés)"]); }
  return st;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 660 330");
  svg.innerHTML = ""; defs0();
  const P = n => [POS[n][0] * 6.4 + 10, (40 - POS[n][1]) * 5.2 + 4];
  EDGES.forEach(e => { const a = P(e[0]), b = P(e[1]), dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
    const off = (e[0] === "Várakozás" ? 14 : e[1] === "Várakozás" ? -14 : 0);
    A(a[0] + ux * 50 + off, a[1] + uy * 20, b[0] - ux * 50 + off, b[1] - uy * 20, {stroke: css("--muted")}); });
  const LB = [[138, 48, "middle"], [400, 48, "middle"], [196, 112, "end"], [234, 112, "start"], [330, 80, "start"], [505, 108, "start"], [482, 168, "end"]];
  EDGES.forEach((e, i) => T(LB[i][0], LB[i][1], e[2].replace("\n", " "), {"font-size": 11, "text-anchor": LB[i][2], fill: css("--muted")}));
  el("polyline", {points: "586,193 586,212 61,212 61,74", fill: "none", stroke: css("--muted"), "stroke-width": 1.3, "stroke-dasharray": "2 3", "marker-end": "url(#ar)"});
  T(320, 207, "újrakézbesítés (nincs ACK)", {"font-size": 11, "text-anchor": "middle", fill: css("--muted")});
  Object.keys(POS).forEach(n => { const p = P(n), on = n === s.st;
    R(p[0] - 48, p[1] - 16, 96, 32, {rx: 8, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3.5 : (n === "ACK" ? 2.5 : 1.2), "stroke-dasharray": n === "NINCS ACK" ? "6 3" : ""});
    T(p[0], p[1] + 5, n, {"font-size": 13, "font-weight": "bold", "text-anchor": "middle"}); });
  R(10, 222, 640, 100, {rx: 2, fill: css("--code")});
  T(18, 240, "napló:", {"font-size": 12, "font-weight": "bold"});
  s.log.slice(-5).forEach((l, i) => T(18, 258 + i * 14, "• " + l, {"font-size": 12}));
}
const CASES = {"1": [["atmeneti", "siker"], true], "2": [["vegleges"], true], "3": [["vegleges"], false]};
function stepsOf(tr){ return tr.map((x, i) => ({msg: x[1], st: x[0], log: tr.slice(0, i + 1).map(y => y[1])})); }
function recompute(){
  const c = document.getElementById("case").value, own = c === "saj";
  document.getElementById("own").style.display = own ? "" : "none";
  const tr = own ? sim([1, 2, 3].map(i => document.getElementById("k" + i).value), document.getElementById("dlq").value === "ok") : sim(CASES[c][0], CASES[c][1]);
  setSteps(stepsOf(tr));
}
["case", "k1", "k2", "k3", "dlq"].forEach(id => document.getElementById(id).addEventListener("change", recompute));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
