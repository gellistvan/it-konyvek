<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDP komponensek és integrációk</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#bdbdbd;--fill3:#e6e6e6}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
pre.code{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
pre.code span{display:block;padding:0 4px}
pre.code span.on{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők"><button id="first">⏮ Áttekintés</button><button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 800 484" role="img" aria-label="C4 container nézet: a belső fejlesztői platform kilenc komponenscsoportja a rendszerhatáron belül, külső rendszerek kívül, protokollokkal"></svg>

<p class="small">Mintaarchitektúra, termékfüggetlen. Belső komponens: szürke lekerekített doboz; külső rendszer: szaggatott keret; szinkron él folytonos, aszinkron szaggatott.</p>
<script>
const DATA = {"D": {"H": 11.6, "S": 50, "frames": [{"id": "idp", "x": 2.45, "y": 2.2, "w": 8.25, "h": 9.15, "label": "Rendszerhatár: belső fejlesztői platform (IDP)"}], "nodes": [{"id": "dev", "shape": "actor", "cx": 1.1, "cy": 9.3, "w": 1.6, "h": 1.6, "fill": "white", "text": "Fejlesztő"}, {"id": "pt", "shape": "actor", "cx": 1.1, "cy": 6.0, "w": 1.6, "h": 1.6, "fill": "white", "text": "Platform-\ncsapat"}, {"id": "sec", "shape": "actor", "cx": 1.1, "cy": 3.05, "w": 1.6, "h": 1.6, "fill": "white", "text": "Biztonsági /\nmegfelelési\nfelelős"}, {"id": "portal", "shape": "rbox", "cx": 4.5, "cy": 10.3, "w": 3.0, "h": 0.85, "fill": "g1", "text": "Fejlesztői portál\nböngésző"}, {"id": "cli", "shape": "rbox", "cx": 4.5, "cy": 8.95, "w": 3.0, "h": 0.85, "fill": "g1", "text": "CLI\nszkriptelhető"}, {"id": "api", "shape": "rbox", "cx": 4.5, "cy": 7.6, "w": 3.0, "h": 0.85, "fill": "g1", "text": "Platform API\nverziózott, SLO", "weight": "bold"}, {"id": "doc", "shape": "rbox", "cx": 4.5, "cy": 4.15, "w": 3.0, "h": 0.85, "fill": "g1", "text": "Dokumentáció\ngolden path-ok"}, {"id": "audit", "shape": "rbox", "cx": 4.5, "cy": 2.95, "w": 3.0, "h": 0.85, "fill": "g1", "text": "Audit napló\nki, mikor, mit"}, {"id": "tpl", "shape": "rbox", "cx": 8.5, "cy": 10.3, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Sablonmotor\nrepo, IaC, policy"}, {"id": "cat", "shape": "rbox", "cx": 8.5, "cy": 8.95, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Katalógus\nREST API, widget"}, {"id": "pipe", "shape": "rbox", "cx": 8.5, "cy": 7.75, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Pipeline-sablonok\nbuild, deploy"}, {"id": "env", "shape": "rbox", "cx": 8.5, "cy": 5.95, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Környezetkezelő\ndev, staging, prod"}, {"id": "sec_i", "shape": "rbox", "cx": 8.5, "cy": 4.15, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Titok-integráció\ninjektálás"}, {"id": "obs_i", "shape": "rbox", "cx": 8.5, "cy": 2.95, "w": 3.3, "h": 0.85, "fill": "g1", "text": "Megfigyelhetőség\nOTel-telemetria"}, {"id": "git", "shape": "dbox", "cx": 14.0, "cy": 10.3, "w": 3.5, "h": 0.85, "fill": "white", "text": "Verziókezelő\n(git-szolgáltató)"}, {"id": "ci", "shape": "dbox", "cx": 14.0, "cy": 8.95, "w": 3.5, "h": 0.85, "fill": "white", "text": "CI/CD futtató"}, {"id": "reg", "shape": "dbox", "cx": 14.0, "cy": 7.75, "w": 3.5, "h": 0.85, "fill": "white", "text": "Konténerregiszter"}, {"id": "k8s", "shape": "dbox", "cx": 14.0, "cy": 6.55, "w": 3.5, "h": 0.85, "fill": "white", "text": "Kubernetes-klaszter"}, {"id": "cloud", "shape": "dbox", "cx": 14.0, "cy": 5.35, "w": 3.5, "h": 0.85, "fill": "white", "text": "Felhős erőforrás-API\n(Terraform)"}, {"id": "vault", "shape": "dbox", "cx": 14.0, "cy": 4.15, "w": 3.5, "h": 0.85, "fill": "white", "text": "Titokkezelő\n(pl. Vault)"}, {"id": "mon", "shape": "dbox", "cx": 14.0, "cy": 2.95, "w": 3.5, "h": 0.85, "fill": "white", "text": "Megfigyelő rendszer"}], "edges": [{"id": "d1", "pts": [[1.65, 9.75], [3.0, 10.2]]}, {"id": "d2", "pts": [[1.65, 9.45], [3.0, 9.0]]}, {"id": "pa", "pts": [[3.0, 10.05], [2.75, 10.05], [2.75, 7.75], [3.0, 7.75]]}, {"id": "ca", "pts": [[4.5, 8.52], [4.5, 8.03]], "label": "HTTPS,\nszinkron", "lpos": [4.75, 8.28], "ha": "left"}, {"id": "t1", "pts": [[1.65, 6.2], [3.0, 7.45]]}, {"id": "s1", "pts": [[1.65, 3.2], [3.0, 2.95]]}, {"id": "at", "pts": [[6.0, 7.85], [6.85, 10.15]]}, {"id": "ac", "pts": [[6.0, 7.75], [6.85, 8.9]]}, {"id": "ap", "pts": [[6.0, 7.6], [6.85, 7.7]]}, {"id": "ae", "pts": [[6.0, 7.45], [6.85, 6.1]]}, {"id": "g1", "pts": [[10.15, 10.3], [12.25, 10.3]], "label": "HTTPS,\nszinkron", "lpos": [11.5, 10.62]}, {"id": "wh", "pts": [[12.25, 10.05], [10.15, 9.1]], "ls": "--", "label": "aszinkron\nwebhook", "lpos": [11.5, 9.35]}, {"id": "pc", "pts": [[10.15, 7.95], [12.25, 8.85]]}, {"id": "pr", "pts": [[10.15, 7.65], [12.25, 7.75]], "label": "HTTPS,\nszinkron", "lpos": [11.5, 7.35]}, {"id": "ek", "pts": [[10.15, 6.15], [12.25, 6.55]]}, {"id": "ec", "pts": [[10.15, 5.8], [12.25, 5.35]], "label": "HTTPS, szinkron,\nretry", "lpos": [12.15, 4.95], "ha": "right"}, {"id": "sv", "pts": [[10.15, 4.15], [12.25, 4.15]]}, {"id": "om", "pts": [[10.15, 2.95], [12.25, 2.95]]}]}, "steps": [["1. Kérés indítása: a fejlesztő a portálon vagy CLI-n kiválasztja a sablont és megadja a paramétereket.", ["dev", "portal", "cli", "api"], ["d1", "d2", "pa", "ca"]], ["2. Validáció és jóváhagyás: a platform a szervezeti házirendek alapján ellenőrzi a paramétereket; a döntés auditálódik.", ["api", "tpl", "audit"], ["at"]], ["3. Erőforrás-létrehozás: repository, pipeline-definíció, namespace, adatbázis, katalógus-bejegyzés, monitoring – kompenzálható lépésekben.", ["tpl", "env", "cat", "obs_i", "git", "k8s", "cloud"], ["at", "ac", "ae", "g1", "ek", "ec"]], ["4. Első deploy: a pipeline buildel, tesztel, a képet a regiszterbe tölti, és fejlesztői környezetbe telepít.", ["pipe", "ci", "reg", "env", "k8s"], ["ap", "pc", "pr", "ek"]], ["5. Fejlesztés és iteráció: commit → webhook a katalógusnak, pipeline-futás, PR-onként preview környezet.", ["git", "cat", "pipe", "ci", "env"], ["wh", "pc", "ek"]], ["6. Üzemeltetés: a portál és a riasztások mutatják az állapotot; az SLO-kat és a hibakeretet a platform számolja.", ["portal", "obs_i", "mon", "sec_i", "vault"], ["om", "sv"]], ["7. Továbbfejlesztés és megszüntetés: erőforrások törlése, az audit napló archiválása, a katalógus frissítése.", ["env", "k8s", "cloud", "cat", "audit"], ["ek", "ec", "ac"]]]};

const NS="http://www.w3.org/2000/svg";
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(par,tag,attrs,text){const e=document.createElementNS(NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function fmt(x,d){return (d===undefined?String(x):x.toFixed(d)).replace(".",",").replace("-","−");}
function patterns(svg){
  const d=mk(svg,"defs",{});const fg=css("--fg");
  d.innerHTML=`<pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1.3"/></pattern>`+
  `<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`+
  `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0L7 7M7 0L0 7" stroke="${fg}" stroke-width="0.9"/></pattern>`+
  `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
  `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${css("--hl2")}"/></marker>`;
}
function wrapText(par,x,y,txt,attrs,lh){const lines=String(txt).split("\n");lines.forEach((l,i)=>mk(par,"text",Object.assign({x:x,y:y+i*(lh||13)},attrs||{}),l));}


// D = {H, S, frames, nodes, edges}; o = {hlN:Set, hlE:Set, dimN:Set, dimE:Set, hide:Set}
function drawDiagram(svg, D, o){
  o = o || {}; const S = D.S || 50, H = D.H, X = x => x * S, Y = y => (H - y) * S;
  const fg = css("--fg"), hl = css("--hl2");
  const has = (s, id) => s && s.has(id);
  const dash = {"-": "", "--": "7 4", ":": "2 4", "-.": "8 3 2 3"};
  const fillOf = f => ({white: css("--bg"), g1: css("--fill3"), g2: css("--fill2"), hatch: "url(#ph)", dots: "url(#pd)"})[f || "white"] || f;
  D.frames.forEach(f => {
    if (has(o.hide, f.id)) return;
    mk(svg, "rect", {x: X(f.x), y: Y(f.y + f.h), width: X(f.w), height: X(f.h), fill: f.fill ? fillOf(f.fill === "#eeeeee" || f.fill === "#f0f0f0" ? "g1" : f.fill) : "none",
      stroke: fg, "stroke-width": f.lw || 1.3, "stroke-dasharray": dash[f.ls || "--"]});
    if (f.label) wrapText(svg, X(f.x) + 5, Y(f.y + f.h) + 15, f.label, {"font-size": 13, "font-style": "italic", "font-weight": f.weight || "normal"}, 15);
  });
  D.edges.forEach(e => {
    if (has(o.hide, e.id)) return;
    const on = has(o.hlE, e.id), dim = has(o.dimE, e.id);
    const a = e.arrow || "end";
    mk(svg, "polyline", {points: e.pts.map(p => X(p[0]) + "," + Y(p[1])).join(" "), fill: "none", stroke: on ? hl : fg,
      "stroke-width": on ? 3.6 : (e.lw || 1.3) * 1.3, "stroke-dasharray": dash[e.ls || "-"], opacity: dim ? .2 : 1,
      "marker-end": (a === "end" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : "",
      "marker-start": (a === "start" || a === "both") ? (on ? "url(#arh)" : "url(#ar)") : ""});
    if (e.label && !dim) {
      const ls = e.label.split("\n"), wl = Math.max(...ls.map(t => t.length)) * 6.4 + 6, hh = ls.length * 13 + 4;
      const lx = X(e.lpos[0]), ly = Y(e.lpos[1]);
      const anc = e.ha === "left" ? "start" : (e.ha === "right" ? "end" : "middle");
      const rx = anc === "start" ? lx - 3 : (anc === "end" ? lx - wl + 3 : lx - wl / 2);
      mk(svg, "rect", {x: rx, y: ly - hh / 2, width: wl, height: hh, fill: css("--bg"), opacity: .9});
      wrapText(svg, lx, ly - (ls.length - 1) * 6.5 + 4, e.label, {"text-anchor": anc, "font-size": 12, "font-style": "italic", fill: on ? hl : fg}, 13);
    }
  });
  D.nodes.forEach(n => {
    if (has(o.hide, n.id)) return;
    const on = has(o.hlN, n.id), dim = has(o.dimN, n.id);
    const st = on ? hl : fg, sw = on ? 4 : (n.lw || 1.2) * 1.2, g = mk(svg, "g", {opacity: dim ? .25 : 1});
    const x0 = X(n.cx - n.w / 2), y0 = Y(n.cy + n.h / 2), w = X(n.w), h = X(n.h), cx = X(n.cx), cy = Y(n.cy);
    const fill = fillOf(n.fill), ls = n.shape === "dbox" ? "7 4" : dash[n.ls || "-"];
    let ty = cy;
    if (n.shape === "box" || n.shape === "dbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "rbox") mk(g, "rect", {x: x0, y: y0, width: w, height: h, rx: 10, fill, stroke: st, "stroke-width": sw, "stroke-dasharray": ls});
    else if (n.shape === "diamond") mk(g, "path", {d: `M${x0},${cy} L${cx},${y0} L${x0+w},${cy} L${cx},${y0+h}Z`, fill, stroke: st, "stroke-width": sw});
    else if (n.shape === "oct") { const a = Math.min(w, h) * .29;
      mk(g, "path", {d: `M${x0+a},${y0} L${x0+w-a},${y0} L${x0+w},${y0+a} L${x0+w},${y0+h-a} L${x0+w-a},${y0+h} L${x0+a},${y0+h} L${x0},${y0+h-a} L${x0},${y0+a}Z`, fill, stroke: st, "stroke-width": sw}); }
    else if (n.shape === "cyl") { const ry = 6;
      mk(g, "path", {d: `M${x0},${y0} L${x0},${y0+h} A${w/2},${ry} 0 0 0 ${x0+w},${y0+h} L${x0+w},${y0}`, fill, stroke: st, "stroke-width": sw});
      mk(g, "ellipse", {cx, cy: y0, rx: w / 2, ry, fill: css("--fill3"), stroke: st, "stroke-width": sw}); }
    else if (n.shape === "actor") { const r = 8, hy = y0 + r + 1;
      mk(g, "circle", {cx, cy: hy, r, fill: css("--bg"), stroke: st, "stroke-width": sw});
      mk(g, "path", {d: `M${cx},${hy+r} L${cx},${hy+r+18} M${cx-12},${hy+r+6} L${cx+12},${hy+r+6} M${cx-10},${hy+r+31} L${cx},${hy+r+18} L${cx+10},${hy+r+31}`, fill: "none", stroke: st, "stroke-width": sw});
      ty = hy + r + 44; wrapText(g, cx, ty, n.text, {"text-anchor": "middle", "font-size": 12}, 13); return; }
    const L = n.text.split("\n");
    if (n.fill === "hatch" || n.fill === "dots") L.forEach((t, i) => mk(g, "rect", {x: cx - t.length * 3.4 - 2, y: ty - (L.length - 1) * 6.5 - 10 + i * 13, width: t.length * 6.8 + 4, height: 14, fill: css("--bg")}));
    wrapText(g, cx, ty - (L.length - 1) * 6.5 + 4, n.text, {"text-anchor": "middle", "font-size": n.fs ? 12 * n.fs / 8.4 : 12, "font-weight": n.weight || "normal"}, 13);
  });
}

const svg=document.getElementById("v"), status=document.getElementById("status");

let k = -1;
const g = id => document.getElementById(id);
function draw(){
  svg.innerHTML = ""; patterns(svg);
  if (k < 0) { drawDiagram(svg, DATA.D, {}); status.textContent = "A 18.3.3 hét lépése: Lépés ▶ – lépésenként kiemelődnek az érintett komponensek és élek."; }
  else { const s = DATA.steps[k], allN = DATA.D.nodes.map(n => n.id), allE = DATA.D.edges.map(e => e.id);
    drawDiagram(svg, DATA.D, {hlN: new Set(s[1]), hlE: new Set(s[2]), dimN: new Set(allN.filter(x => !s[1].includes(x))), dimE: new Set(allE.filter(x => !s[2].includes(x)))});
    status.textContent = s[0]; }
  g("cnt").textContent = `${k + 1}/${DATA.steps.length}`;
}
g("first").onclick = () => { k = -1; draw(); };
g("prev").onclick = () => { k = Math.max(-1, k - 1); draw(); };
g("next").onclick = () => { k = Math.min(DATA.steps.length - 1, k + 1); draw(); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") g("next").click(); if (e.key === "ArrowLeft") g("prev").click(); });

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
