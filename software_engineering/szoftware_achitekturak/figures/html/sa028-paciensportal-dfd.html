<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Páciensportál adatfolyam-diagram</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Adatfolyam-diagram: külső entitások, DMZ-gateway, belső szolgáltatások és adattárak négy bizalmi határral és hat STRIDE-címkével; lejátszható leletlekérdezési út."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kattints (vagy Enter) egy STRIDE-betűre: kiemelődik az érintett adatfolyam és határ, és megjelenik a fenyegetéslista megfelelő sora. Téglalap = külső entitás, lekerekített = folyamat, nyitott téglalap = adattár, szaggatott = bizalmi határ.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"on": [], "fl": [], "msg": "Leletlekérdezés útja – kezdőállapot. Kattints egy STRIDE-betűre a fenyegetés és az ellenintézkedés megjelenítéséhez.", "line": -1}, {"on": ["pat", "gw"], "fl": ["f_pat"], "msg": "1/6 – A páciens HTTPS-en (TLS 1.2+) kéri a leletét; átlépi a B1 Internet | DMZ határt (D: sebességkorlátozás, WAF).", "line": -1}, {"on": ["gw", "authz"], "fl": ["f_authz"], "msg": "2/6 – A gateway mTLS-en az engedélyezési komponenshez fordul (B2); ABAC-szabály: a kért rekord a páciens SAJÁT rekordja? (E: minimális jog).", "line": -1}, {"on": ["gw", "lelet"], "fl": ["f_lelet"], "msg": "3/6 – Engedélyezett kérés: a gateway továbbítja a leletszolgáltatásnak (mTLS, B2).", "line": -1}, {"on": ["lelet", "db"], "fl": ["f_db"], "msg": "4/6 – A leletszolgáltatás TLS-en lekérdezi a páciensrekordot a titkosított DB-ből (B3; I: titkosítás, RBAC).", "line": -1}, {"on": ["lelet", "audit"], "fl": ["f_aud"], "msg": "5/6 – A hozzáférési döntés és a lekérdezés az auditnaplóba kerül (hash-lánc, B3; R: integritásvédett napló).", "line": -1}, {"on": ["pat", "gw", "authz", "lelet", "db", "audit"], "fl": ["f_pat", "f_authz", "f_lelet", "f_db", "f_aud"], "msg": "6/6 – Teljes út: páciens → gateway → engedélyezés → leletszolgáltatás → DB → auditnapló; az engedélyezésen és az auditnaplón is áthalad.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const N = {"pat": {"x": 9.6, "y": 93.60000000000002, "w": 132.0, "h": 50.4, "lab": "Páciens\n(böngésző)", "t": "ent"}, "doc": {"x": 9.6, "y": 171.6, "w": 132.0, "h": 38.4, "lab": "Orvos", "t": "ent"}, "asst": {"x": 9.6, "y": 231.6, "w": 132.0, "h": 38.4, "lab": "Asszisztens", "t": "ent"}, "oidc": {"x": 9.6, "y": 303.59999999999997, "w": 132.0, "h": 50.4, "lab": "OIDC-\nszolgáltató", "t": "ent"}, "lab": {"x": 9.6, "y": 441.59999999999997, "w": 132.0, "h": 50.4, "lab": "Külső\nlaboratórium", "t": "ent"}, "gw": {"x": 192.0, "y": 165.6, "w": 120.0, "h": 74.4, "lab": "Front-end /\nAPI-gateway", "t": "proc"}, "authz": {"x": 360.0, "y": 87.59999999999994, "w": 156.0, "h": 50.4, "lab": "Engedélyezés\n(ABAC)", "t": "proc"}, "book": {"x": 360.0, "y": 181.19999999999996, "w": 156.0, "h": 40.800000000000004, "lab": "Időpontfoglalás", "t": "proc"}, "msg": {"x": 360.0, "y": 253.2, "w": 156.0, "h": 40.800000000000004, "lab": "Üzenetküldés", "t": "proc"}, "lelet": {"x": 360.0, "y": 351.59999999999997, "w": 156.0, "h": 50.4, "lab": "Leletszolgáltatás", "t": "proc"}, "db": {"x": 566.4, "y": 135.6, "w": 150.0, "h": 50.4, "lab": "Páciensrekord-DB\n(titkosítva, KMS)", "t": "store"}, "audit": {"x": 566.4, "y": 351.59999999999997, "w": 150.0, "h": 50.4, "lab": "Auditnapló\n(hash-lánc)", "t": "store"}, "backup": {"x": 566.4, "y": 243.59999999999997, "w": 150.0, "h": 50.4, "lab": "Mentés\n(titkosítva)", "t": "store"}}, F = {"f_pat": {"p": [[141.6, 118.8], [192.0, 182.4]], "lab": "HTTPS, TLS 1.2+", "lp": [237.6, 93.60000000000002]}, "f_doc": {"p": [[141.6, 190.8], [192.0, 204.0]], "lab": "", "lp": null}, "f_asst": {"p": [[141.6, 250.8], [192.0, 222.0]], "lab": "", "lp": null}, "f_oidc": {"p": [[192.0, 236.4], [141.6, 328.8]], "lab": "OIDC", "lp": [201.6, 297.6]}, "f_authz": {"p": [[312.0, 180.0], [360.0, 112.8]], "lab": "mTLS", "lp": [300.0, 120.0]}, "f_book": {"p": [[312.0, 201.6], [360.0, 201.6]], "lab": "", "lp": null}, "f_msg": {"p": [[312.0, 222.0], [360.0, 273.6]], "lab": "", "lp": null}, "f_lelet": {"p": [[312.0, 234.0], [360.0, 376.8]], "lab": "mTLS", "lp": [300.0, 330.0]}, "f_db": {"p": [[516.0, 388.8], [534.0, 388.8], [534.0, 160.8], [566.4, 160.8]], "lab": "", "lp": null}, "f_aud": {"p": [[516.0, 374.4], [566.4, 374.4]], "lab": "", "lp": null}, "f_authz_aud": {"p": [[516.0, 120.0], [552.0, 120.0], [552.0, 360.0], [566.4, 360.0]], "lab": "", "lp": null}, "f_bak": {"p": [[641.4, 186.0], [641.4, 243.6]], "lab": "mentés", "lp": [650.4, 214.8]}, "f_lab": {"p": [[141.6, 466.8], [438.0, 466.8], [438.0, 402.0]], "lab": "mTLS, aláírt lelet", "lp": [330.0, 450.0]}}, B = {"B1": {"p": [166.79999999999998, 371.99999999999994, 166.79999999999998, 65.99999999999997], "lab": "B1 Internet | DMZ"}, "B2": {"p": [336.0, 461.99999999999994, 336.0, 65.99999999999997], "lab": "B2 DMZ | belső"}, "B3": {"p": [542.4, 431.99999999999994, 542.4, 65.99999999999997], "lab": "B3 belső | adattárak"}, "B4": {"p": [240.0, 501.59999999999997, 240.0, 420.0], "lab": "B4 saját | külső labor"}}, SS = {"S": {"x": 166.79999999999998, "y": 282.6, "nm": "Megszemélyesítés", "where": "Bejelentkezési folyamat", "cm": "OIDC, többfaktoros hitelesítés, munkamenet-kezelés", "f": "f_oidc", "b": "B1"}, "T": {"x": 240.0, "y": 466.79999999999995, "nm": "Módosítás", "where": "Leletrekord (feltöltés a labortól)", "cm": "Digitális aláírás, verziózás, audit napló", "f": "f_lab", "b": "B4"}, "R": {"x": 542.4, "y": 374.4, "nm": "Letagadás", "where": "Módosítási művelet → auditnapló", "cm": "Integritásvédett napló, hitelesített műveletek", "f": "f_aud", "b": "B3"}, "I": {"x": 542.4, "y": 160.79999999999998, "nm": "Információszivárgás", "where": "Páciensrekord-lekérdezés", "cm": "TLS 1.2+, at rest titkosítás, RBAC", "f": "f_db", "b": "B3"}, "D": {"x": 166.79999999999998, "y": 150.6, "nm": "Szolgáltatásmegtagadás", "where": "Belépési komponens (front-end)", "cm": "Sebességkorlátozás, WAF, kapacitástartalék", "f": "f_pat", "b": "B1"}, "E": {"x": 336.0, "y": 146.39999999999998, "nm": "Jogosultság-kiterjesztés", "where": "API-végpontok", "cm": "Minimális jog, ABAC, rendszeres jogosultság-felülvizsgálat", "f": "f_authz", "b": "B2"}};
let SEL = null;
function pick(k){ SEL = (SEL === k) ? null : k; show(Math.max(0, +document.getElementById("pos").value)); }
function render(s){
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 720 636");
  const d = document.createElementNS(NS, "defs"); d.innerHTML = '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--hl") + '"/></marker>'; svg.appendChild(d);
  [["Internet / külső", 10], ["DMZ", 230], ["Belső szolgáltatások", 438], ["Adattárak", 630]].forEach(([t, x], i) => el("text", {x:x, y:22, "font-weight":"bold", "font-size":13, "text-anchor": i ? "middle" : "start"}, t));
  for (const k in B) { const b = B[k], hot = SEL && SS[SEL].b === k;
    el("line", {x1:b.p[0], y1:b.p[1], x2:b.p[2], y2:b.p[3], stroke: hot ? css("--hl2") : css("--line"), "stroke-width": hot ? 3 : 1.6, "stroke-dasharray":"8 5"});
    const vert = b.p[0] === b.p[2]; el("text", {x: vert ? b.p[0] : b.p[0] + 3, y: vert ? b.p[3] - 6 : b.p[1] - 6, "text-anchor": vert ? "middle" : "start", "font-size":11.5, "font-style":"italic"}, b.lab); }
  const fon = new Set(s.fl || []); if (SEL) fon.add(SS[SEL].f);
  for (const k in F) { const f = F[k], hot = fon.has(k);
    el("polyline", {points:f.p.map(p => p.join(",")).join(" "), fill:"none", stroke: hot ? css("--hl") : css("--line"), "stroke-width": hot ? 3 : 1.2, "marker-end": hot ? "url(#ah2)" : "url(#ah)"}); }
  const on = new Set(s.on || []);
  for (const k in N) { const n = N[k], hot = on.has(k);
    if (n.t === "store") { el("rect", {x:n.x, y:n.y, width:n.w, height:n.h, fill: hot ? css("--cellhl") : css("--bg"), stroke:"none"});
      el("polyline", {points:`${n.x + n.w},${n.y} ${n.x},${n.y} ${n.x},${n.y + n.h} ${n.x + n.w},${n.y + n.h}`, fill:"none", stroke: hot ? css("--hl") : css("--line"), "stroke-width": hot ? 3 : 1.4}); }
    else el("rect", {x:n.x, y:n.y, width:n.w, height:n.h, rx: n.t === "proc" ? Math.min(n.h / 2, 20) : 0, fill: hot ? css("--cellhl") : (n.t === "proc" ? css("--code") : css("--cell")), stroke: hot ? css("--hl") : css("--line"), "stroke-width": hot ? 3 : 1.3});
    n.lab.split("\n").forEach((t, i, a) => el("text", {x:n.x + n.w / 2, y:n.y + n.h / 2 + 4.5 + (i - (a.length - 1) / 2) * 14, "text-anchor":"middle", "font-size":12}, t)); }
  for (const k in F) if (F[k].lab) { const [x, y] = F[k].lp, a = F[k].lab === "mentés" ? "start" : "middle";
    F[k].lab.split("\n").forEach((t, i, arr) => el("text", {x:x, y:y + 4 + (i - (arr.length - 1) / 2) * 13, "text-anchor":a, "font-size":11, fill:css("--muted")}, t)); }
  for (const k in SS) { const z = SS[k], hot = SEL === k;
    const g = el("circle", {cx:z.x, cy:z.y, r:12, fill: hot ? css("--hl") : css("--bg"), stroke:css("--line"), "stroke-width":1.6, tabindex:0, role:"button", "aria-label":"STRIDE " + k + ": " + z.nm, style:"cursor:pointer"});
    g.onclick = () => pick(k); g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(k); } };
    el("text", {x:z.x, y:z.y + 5, "text-anchor":"middle", "font-size":13, "font-weight":"bold", fill: hot ? css("--bg") : css("--fg"), "pointer-events":"none"}, k); }
  if (SEL) { const z = SS[SEL]; document.getElementById("status").textContent = `${SEL} – ${z.nm} | érintett: ${z.where} | határ: ${B[z.b].lab} | ellenintézkedés: ${z.cm}`; }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
