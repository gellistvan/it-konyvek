<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Költség és szénlábnyom</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>VM/node EUR/h: <input id="pvm" type="text" value="0,12" size="5" oninput="recalc()" aria-label="VM/node EUR/h:" style="width:56px"></label> <label>felügyelt DB EUR/h: <input id="pdb" type="text" value="0,15" size="5" oninput="recalc()" aria-label="felügyelt DB EUR/h:" style="width:56px"></label> <label>tárolás EUR/GB-hó: <input id="pst" type="text" value="0,10" size="5" oninput="recalc()" aria-label="tárolás EUR/GB-hó:" style="width:56px"></label> <label>kimenő EUR/GB: <input id="peg" type="text" value="0,09" size="5" oninput="recalc()" aria-label="kimenő EUR/GB:" style="width:56px"></label> </div><div class="ctl"><label>jelenlegi W: <input id="w1" type="text" value="150" size="5" oninput="recalc()" aria-label="jelenlegi W:" style="width:56px"></label> <label>javasolt W: <input id="w2" type="text" value="200" size="5" oninput="recalc()" aria-label="javasolt W:" style="width:56px"></label> <label>PUE: <input id="pue" type="text" value="1,2" size="5" oninput="recalc()" aria-label="PUE:" style="width:56px"></label> <label>CI g/kWh: <input id="ci" type="text" value="300" size="5" oninput="recalc()" aria-label="CI g/kWh:" style="width:56px"></label> <label><input id="bnd" type="checkbox" checked onchange="recalc()"> létesítményhatár (PUE-vel)</label></div><div class="ctl"><label>éjszakai node-leállás (h/nap): <input id="night" type="range" min="0" max="12" step="1" value="0" oninput="recalc()" style="width:110px" aria-label="Éjszakai node-leállás óra per nap"> <span id="nightv">0</span></label> <label>bizonytalanság ±%: <input id="unc" type="range" min="0" max="30" step="5" value="0" oninput="recalc()" style="width:90px" aria-label="Bizonytalansági sáv százalékban"> <span id="uncv">0</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két halmozott oszlopdiagram: balra a havi költség tételenként a két változatban, jobbra a havi szénlábnyom IT- és PUE-részre bontva; a beviteli mezők és kapcsolók élőben frissítik az összegeket."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">ExampleCloud fiktív árlista (2024. jan.), 730 h/hó; 100 GB tárolás, 500 GB kimenő forgalom; a snapshot (0 vagy 1,00 EUR) nincs benne. Az éjszakai leállás csak a node díját csökkenti (a felügyelt DB-ét nem); az energiát az átlagos teljesítmény (W) adja. Becslés ±20–30%, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function v(id){ const x = parseFloat(String(document.getElementById(id).value).replace(",", ".")); return isFinite(x) ? x : 0; }
function hu(x, d){ return x.toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }
function recalc(){ show(0); }
function render(s){
  const H = 730, night = v("night"), unc = v("unc") / 100, facility = document.getElementById("bnd").checked;
  document.getElementById("nightv").textContent = night; document.getElementById("uncv").textContent = Math.round(unc * 100);
  const nodeH = H * (24 - night) / 24;
  const cur = [["VM", H * v("pvm"), "s"], ["tárolás", 100 * v("pst"), "d"], ["kimenő forgalom", 500 * v("peg"), "x"]];
  const nw = [["node", nodeH * v("pvm"), "s"], ["felügyelt DB", H * v("pdb"), "h"], ["tárolás", 100 * v("pst"), "d"], ["kimenő forgalom", 500 * v("peg"), "x"]];
  const sum = a => a.reduce((t, x) => t + x[1], 0), sc = sum(cur), sn = sum(nw);
  const pue = v("pue"), ci = v("ci");
  const cb = (pw, hrs) => { const eit = pw * hrs / 1000, etot = eit * pue; return {eit: eit, etot: etot, it: eit * ci / 1000, pu: (etot - eit) * ci / 1000}; };
  const k1 = cb(v("w1"), H), k2 = cb(v("w2"), H);   // az energia a teljes órával számol (a node-leállás a teljesítményátlagban van)
  svg.innerHTML = ""; svg.setAttribute("viewBox", "0 0 760 340");
  const defs = document.createElementNS(NS, "defs");
  defs.innerHTML = `<pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${css("--fg")}" stroke-width="1.2"/></pattern><pattern id="d" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="${css("--fg")}"/></pattern><pattern id="x" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M4 0 V8 M0 4 H8" stroke="${css("--fg")}" stroke-width="1"/></pattern>`;
  svg.appendChild(defs);
  const fillOf = t => t === "s" ? css("--muted") : "url(#" + t + ")";
  const cmax = Math.max(sc, sn) * 1.25, Yc = x => 290 - x / cmax * 250;
  el("text", {x: 20, y: 20, "font-size": 13, "font-weight": "bold"}, "Havi költség (EUR)");
  [[cur, sc, 40, "Jelenlegi"], [nw, sn, 240, "Javasolt"]].forEach(([items, tot, x, lab]) => {
    let y = 0;
    items.forEach(([n, val, t]) => { el("rect", {x: x, y: Yc(y + val), width: 70, height: Yc(y) - Yc(y + val), fill: fillOf(t), stroke: css("--line")}); el("text", {x: x + 74, y: (Yc(y) + Yc(y + val)) / 2 + 4, "font-size": 10.5}, `${n} ${hu(val)}`); y += val; });
    el("text", {x: x + 35, y: Yc(tot) - 8, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, hu(tot) + " EUR");
    el("text", {x: x + 35, y: 308, "text-anchor": "middle", "font-size": 12}, lab);
  });
  el("line", {x1: 20, y1: 290, x2: 440, y2: 290, stroke: css("--line")});
  el("text", {x: 20, y: 332, "font-size": 11.5}, `különbség: ${hu(sn - sc)} EUR/hó` + (night ? ` (éjszakai node-leállás ${night} h/nap)` : ""));
  // szén
  const tot1 = facility ? k1.it + k1.pu : k1.it, tot2 = facility ? k2.it + k2.pu : k2.it;
  const kmax = Math.max(tot1, tot2) * (1 + unc) * 1.2, Yk = x => 290 - x / kmax * 250;
  el("text", {x: 470, y: 20, "font-size": 13, "font-weight": "bold"}, `Szénlábnyom, kg CO₂e (${facility ? "létesítményhatár" : "IT-határ"})`);
  [[k1, tot1, 530, "Jelenlegi"], [k2, tot2, 650, "Javasolt"]].forEach(([kk, tot, x, lab]) => {
    el("rect", {x: x, y: Yk(kk.it), width: 70, height: 290 - Yk(kk.it), fill: css("--muted"), stroke: css("--line")});
    if (facility) el("rect", {x: x, y: Yk(kk.it + kk.pu), width: 70, height: Yk(kk.it) - Yk(kk.it + kk.pu), fill: css("--bg"), stroke: css("--line")});
    if (unc > 0) { el("line", {x1: x + 35, y1: Yk(tot * (1 - unc)), x2: x + 35, y2: Yk(tot * (1 + unc)), stroke: css("--fg"), "stroke-width": 1.5}); [1 - unc, 1 + unc].forEach(f => el("line", {x1: x + 28, y1: Yk(tot * f), x2: x + 42, y2: Yk(tot * f), stroke: css("--fg"), "stroke-width": 1.5})); }
    el("text", {x: x + 35, y: Yk(tot * (1 + unc)) - 8, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, hu(tot) + " kg");
    el("text", {x: x + 35, y: 308, "text-anchor": "middle", "font-size": 12}, lab);
  });
  el("line", {x1: 500, y1: 290, x2: 750, y2: 290, stroke: css("--line")});
  const dk = facility ? k2.etot - k1.etot : k2.eit - k1.eit;
  el("text", {x: 470, y: 332, "font-size": 11.5}, `különbség: ${hu(dk, 1)} kWh / ${hu(tot2 - tot1)} kg CO₂e havonta`);
  status.textContent = `Költség: ${hu(sc)} vs ${hu(sn)} EUR/hó (különbség ${hu(sn - sc)}). Szénlábnyom (${facility ? "létesítményhatár" : "IT-határ"}): ${hu(tot1)} vs ${hu(tot2)} kg CO₂e/hó, különbség ${hu(dk, 1)} kWh / ${hu(tot2 - tot1)} kg` + (unc > 0 ? `, sáv ±${Math.round(unc * 100)}%.` : ".");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
