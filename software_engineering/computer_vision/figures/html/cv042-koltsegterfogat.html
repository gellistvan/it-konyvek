<style>

@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#333;--frame:#666;

label.toggle{display:flex;align-items:center;gap:4px}

@media (prefers-color-scheme:dark){:root{--inlier:#7ab3ff;--outlier:#ff7b72;--epi:#81d68a;--cam:#a8a8a8;--ax-x:#ff7b72;--ax-y:#7fd48a;--ax-z:#7aa7ff;

  --outlier:#d50000;--epi:#00852a;--cam:#555;--fg:#000;--band:rgba(18,87,201,.15);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 .6px #fff)}

<body>
<div id="controls"></div>
<div id="status" aria-live="polite"></div>
<svg id="view" viewBox="0 0 720 668" role="img" aria-label="Bal kép kijelölt sorral, a sor költségszelete és a blokkillesztés, illetve az SGM diszparitása"></svg>
<p class="note">320 × 240-es sztereó pár, 64 diszparitás; a lap a Python-számítás képein, a v = 40…219 sorokon dolgozik. Csak a két vízszintes SGM-út látszik: a függőlegesekhez a teljes kép kellene.</p>
<script>
// Hibát látható módon jelezzük (a statikus PNG a lap alatt lenyitható tartalék marad).
function figError(m) { const s = document.getElementById("status");
  if (s) { s.textContent = "Hiba az interaktív ábrában: " + m; s.className = "error"; } }
window.addEventListener("error", e => figError(e.message + " (sor " + e.lineno + ")"));
window.addEventListener("unhandledrejection", e => figError(String(e.reason)));
</script>
<script>
/* kf.js – a könyv interaktív lapjainak számítási magja (külső függőség nélkül).
   A kftrack Python-csomag tükre: ugyanazok a képletek, ugyanaz az állapotsorrend
   ([x, y, vx, vy]), a paritást a figures/web/test/ teszt ellenőrzi.
   Mátrix: tömbök tömbje (sorok), vektor: sima tömb. */
"use strict";
const KF = (() => {
  // ---------- mátrixok ----------
  const zeros = (r, c) => Array.from({length: r}, () => new Array(c).fill(0));
  const eye = n => { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; };
  const T = A => A[0].map((_, j) => A.map(row => row[j]));
  const mul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const mv = (A, x) => A.map(row => row.reduce((s, a, k) => s + a * x[k], 0));
  const add = (A, B) => A.map((row, i) => row.map((a, j) => a + B[i][j]));
  const sub = (A, B) => A.map((row, i) => row.map((a, j) => a - B[i][j]));
  const scale = (A, s) => A.map(row => row.map(a => a * s));
  const vadd = (a, b) => a.map((v, i) => v + b[i]);
  const vsub = (a, b) => a.map((v, i) => v - b[i]);
  const vscale = (a, s) => a.map(v => v * s);
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sym = P => P.map((row, i) => row.map((a, j) => 0.5 * (a + P[j][i])));
  const diag = d => { const D = zeros(d.length, d.length); d.forEach((v, i) => D[i][i] = v); return D; };
  const kron = (A, B) => {
    const r = A.length * B.length, c = A[0].length * B[0].length, K = zeros(r, c);
    A.forEach((ra, i) => ra.forEach((a, j) => B.forEach((rb, k) => rb.forEach((b, l) => {
      K[i * B.length + k][j * B[0].length + l] = a * b; }))));
    return K;
  };
  const clone = A => A.map(r => r.slice());
  const select = (A, rows, cols) => rows.map(i => cols.map(j => A[i][j]));
  /* A X = B megoldása Gauss-eliminációval, részleges főelemkiválasztással (kf004: „solve, ne inv”).
     B lehet vektor vagy mátrix. */
  function solve(A, B) {
    const n = A.length, vec = !Array.isArray(B[0]);
    const M = A.map((row, i) => row.concat(vec ? [B[i]] : B[i]));
    const w = M[0].length;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("szinguláris mátrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k < w; k++) M[r][k] -= f * M[c][k];
      }
    }
    const X = zeros(n, w - n);
    for (let r = n - 1; r >= 0; r--) for (let k = 0; k < w - n; k++) {
      let s = M[r][n + k];
      for (let j = r + 1; j < n; j++) s -= M[r][j] * X[j][k];
      X[r][k] = s / M[r][r];
    }
    return vec ? X.map(r => r[0]) : X;
  }
  const inv = A => solve(A, eye(A.length));
  function chol(P) {          // P = L Lᵀ, L alsó háromszög (kf006)
    const n = P.length, L = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = P[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) throw new Error("nem pozitív definit"); L[i][i] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
    return L;
  }
  function eig2(P) {          // szimmetrikus 2×2: sajátértékek (nagy, kicsi) és a nagyobbik iránya
    const a = P[0][0], b = 0.5 * (P[0][1] + P[1][0]), d = P[1][1];
    const tr = a + d, disc = Math.sqrt(Math.max(0, 0.25 * (a - d) * (a - d) + b * b));
    return {l1: 0.5 * tr + disc, l2: 0.5 * tr - disc, angle: 0.5 * Math.atan2(2 * b, a - d)};
  }
  const mat = {zeros, eye, T, mul, mv, add, sub, scale, vadd, vsub, vscale, dot, sym, diag, kron,
               clone, select, solve, inv, chol, eig2};

  // ---------- szögek (kf028) ----------
  const TAU = 2 * Math.PI;
  function wrap(a) { let w = ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; return w === -Math.PI ? Math.PI : w; }
  function wrapHalf(a) { let w = ((a + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
                         return w === -Math.PI / 2 ? Math.PI / 2 : w; }
  const angles = {wrap, wrapHalf, diff: (a, b) => wrap(a - b),
    mean: (as, ws) => { ws = ws || as.map(() => 1 / as.length);
      return Math.atan2(as.reduce((s, a, i) => s + ws[i] * Math.sin(a), 0),
                        as.reduce((s, a, i) => s + ws[i] * Math.cos(a), 0)); }};

  // ---------- modellek (kf016–kf018, kf027) ----------
  const models = {
    cvF: (dt, dim = 2) => kron([[1, dt], [0, 1]], eye(dim)),
    caF: (dt, dim = 2) => kron([[1, dt, 0.5 * dt * dt], [0, 1, dt], [0, 0, 1]], eye(dim)),
    cvQc: (dt, q, dim = 2) => scale(kron([[dt ** 3 / 3, dt ** 2 / 2], [dt ** 2 / 2, dt]], eye(dim)), q),
    caQd: (dt, sj, dim = 2) => { const g = [dt ** 3 / 6, dt * dt / 2, dt]; return scale(kron(g.map(a => g.map(b => a * b)), eye(dim)), sj * sj); },
    cvQd: (dt, sa, dim = 2) => scale(kron([[dt ** 4 / 4, dt ** 3 / 2], [dt ** 3 / 2, dt * dt]], eye(dim)), sa * sa),
    posH: (order = 2, dim = 2) => { const e = [new Array(order).fill(0)]; e[0][0] = 1; return kron(e, eye(dim)); },
    ctf(x, dt) {
      const [px, py, v, phi, w] = x, a = w * dt;
      const s = Math.abs(a) < 1e-4 ? dt * (1 - a * a / 6) : Math.sin(a) / w;
      const c = Math.abs(a) < 1e-4 ? dt * (a / 2 - a ** 3 / 24) : (1 - Math.cos(a)) / w;
      const cp = Math.cos(phi), sp = Math.sin(phi);
      return [px + v * (s * cp - c * sp), py + v * (s * sp + c * cp), v, phi + w * dt, w];
    },
  };
  models.ctF = (x, dt, eps = 1e-6) => {
    const J = zeros(5, 5);
    for (let i = 0; i < 5; i++) {
      const xp = x.slice(), xm = x.slice(); xp[i] += eps; xm[i] -= eps;
      const fp = models.ctf(xp, dt), fm = models.ctf(xm, dt);
      for (let r = 0; r < 5; r++) J[r][i] = (fp[r] - fm[r]) / (2 * eps);
    }
    return J;
  };

  // ---------- szűrő (kf019–kf024) ----------
  function predict(x, P, F, Q, u) {
    const xn = mv(F, x);
    return {x: u ? vadd(xn, u) : xn, P: sym(add(mul(mul(F, P), T(F)), Q))};
  }
  function update(x, P, z, H, R, opt = {}) {
    const zhat = mv(H, x);
    const y = opt.residual ? opt.residual(z, zhat) : vsub(z, zhat);
    const S = sym(add(mul(mul(H, P), T(H)), R));
    const K = T(solve(S, mul(H, P)));                 // K = P Hᵀ S⁻¹
    const xn = vadd(x, mv(K, y));
    let Pn;
    if (opt.joseph === false) Pn = sub(P, mul(mul(K, S), T(K)));
    else { const IKH = sub(eye(x.length), mul(K, H));
           Pn = add(mul(mul(IKH, P), T(IKH)), mul(mul(K, R), T(K))); }
    return {x: xn, P: sym(Pn), y, S, K, nis: dot(y, solve(S, y))};
  }
  function selectRows(z, H, R, mask) {
    const idx = mask.map((m, i) => m ? i : -1).filter(i => i >= 0);
    return {z: idx.map(i => z[i]), H: idx.map(i => H[i].slice()), R: select(R, idx, idx)};
  }
  class Filter {
    constructor(x0, P0) { this.x = x0.slice(); this.P = clone(P0); }
    predict(F, Q, u) { const r = predict(this.x, this.P, F, Q, u); this.x = r.x; this.P = r.P; return this; }
    update(z, H, R, opt = {}) {
      if (opt.mask) { const s = selectRows(z, H, R, opt.mask); if (!s.z.length) return null; z = s.z; H = s.H; R = s.R; }
      const r = update(this.x, this.P, z, H, R, opt); this.x = r.x; this.P = r.P; return r;
    }
    forecast(F, Q, steps) { let x = this.x, P = this.P; const out = [];
      for (let i = 0; i < steps; i++) { ({x, P} = predict(x, P, F, Q)); out.push({x, P}); } return out; }
  }

  // ---------- Gauss (kf009) ----------
  const gauss = {
    coverage2d: k => 1 - Math.exp(-0.5 * k * k),
    kForCoverage2d: p => Math.sqrt(-2 * Math.log(1 - p)),
    mahalanobis2: (x, m, P) => { const d = vsub(x, m); return dot(d, solve(P, d)); },
    block: (P, i0 = 0, n = 2) => select(P, [...Array(n).keys()].map(i => i + i0), [...Array(n).keys()].map(i => i + i0)),
    /* k-szigma ellipszis; szinguláris vagy szemidefinit P2-re (pl. vetítés) a sajátfelbontásból
       rajzol (szakasz lesz belőle), indefinit P2-re üres tömb. */
    ellipse(m, P2, k = 2, n = 72) {
      let L;
      try { L = chol(add(P2, scale(eye(2), 1e-12))); }
      catch (e) {
        const E = eig2(P2); if (E.l2 < -1e-9 * Math.max(1, Math.abs(E.l1))) return [];
        const a = Math.sqrt(Math.max(E.l1, 0)), b = Math.sqrt(Math.max(E.l2, 0)), c = Math.cos(E.angle), s = Math.sin(E.angle), pts = [];
        for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), u = a * Math.cos(t), v = b * Math.sin(t);
          pts.push([m[0] + k * (c * u - s * v), m[1] + k * (s * u + c * v)]); }
        return pts;
      }
      const pts = [];
      for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), c = Math.cos(t), s = Math.sin(t);
        pts.push([m[0] + k * (L[0][0] * c), m[1] + k * (L[1][0] * c + L[1][1] * s)]); }
      return pts;
    },
  };

  // ---------- véletlen: determinisztikus, magolt (mulberry32 + Box–Muller) ----------
  function rng(seed = 1) {
    let a = seed >>> 0, spare = null;
    const uniform = (lo = 0, hi = 1) => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return lo + (hi - lo) * (((t ^ (t >>> 14)) >>> 0) / 4294967296); };
    const normal = () => { if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = uniform(); const v = uniform(), r = Math.sqrt(-2 * Math.log(u));
      spare = r * Math.sin(TAU * v); return r * Math.cos(TAU * v); };
    const poisson = lam => { const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= uniform(); } while (p > L); return k - 1; };
    return {uniform, normal, poisson};
  }

  // ---------- szimulátor (a kftrack.sim tükre; más véletlenszám-generátorral) ----------
  const sim = {
    sigmaFromScore: (s, lo = 2, hi = 12) => lo * Math.pow(hi / lo, 1 - s),
    curvedTrack({K = 60, dt = 0.1, speed = 120, turn = 0.9, x0 = [80, 120], heading = 0.35, wobble = 1.6} = {}) {
      const t = [], truth = []; let pos = x0.slice(), prev = null;
      for (let k = 0; k < K; k++) {
        const tk = k * dt, phi = heading + turn * Math.sin(wobble * tk), v = speed * (1 + 0.15 * Math.sin(0.7 * tk));
        const vel = [v * Math.cos(phi), v * Math.sin(phi)];
        if (prev) pos = [pos[0] + 0.5 * (vel[0] + prev[0]) * dt, pos[1] + 0.5 * (vel[1] + prev[1]) * dt];
        t.push(tk); truth.push([pos[0], pos[1], vel[0], vel[1]]); prev = vel;
      }
      return {t, truth};
    },
    detectPoints(r, t, truth, {pMiss = 0.15, clutterRate = 0, area = [[0, 640], [0, 360]], scoreRange = [0.25, 1]} = {}) {
      return t.map((tk, k) => {
        const dets = [];
        if (r.uniform() >= pMiss) { const s = r.uniform(...scoreRange), sig = sim.sigmaFromScore(s);
          dets.push({t: tk, z: [truth[k][0] + sig * r.normal(), truth[k][1] + sig * r.normal()], score: s, sigma: sig}); }
        for (let i = r.poisson(clutterRate); i > 0; i--)
          dets.push({t: tk, z: [r.uniform(...area[0]), r.uniform(...area[1])], score: r.uniform(0.05, 0.4), sigma: NaN, clutter: true});

    Draw.el(g, "rect", {x, y, width: w, height: h, class: "frame"});
    for (let k = 0; k < ticks; k++) { const f = k / (ticks - 1); Draw.el(g, "text", {x: x + w + 4, y: y + h * (1 - f) + 4, class: "tick"}, Draw.fmt(vmin + f * (vmax - vmin), d)); }

})();

/* view3d.js – egérrel/érintéssel forgatható 3D nézet SVG-ben (festő-algoritmus). API: README.md.
   A nézőkamera a könyv konvenciója szerinti (x jobbra, y le, z előre); az „up” irány alapból
   a világ +Z tengelye (asztali jelenet). Szögek fokban. */
"use strict";
const View3D = (() => {
  class View {
    constructor(svg, {box, az = -60, el = 25, dist = 5, target = [0, 0, 0], up = [0, 0, 1], fov = 35, ortho = false,

      Object.assign(this, {svg, box: box || [0, 0, vb.width, vb.height], az, el, dist, target, fov, ortho, frame, hint: hint && orbit, onChange});
      this.up = VK.normalize(up);
      const a = Math.abs(this.up[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0], d = VK.dot(a, this.up);
      this.e1 = VK.normalize(a.map((v, i) => v - d * this.up[i])); this.e2 = VK.cross(this.up, this.e1);
      this.home = {az, el, dist, target: target.slice()}; this.items = []; this.handlers = {};
      const id = "clip3d" + Math.random().toString(36).slice(2, 9), cp = Draw.el(Draw.el(svg, "defs"), "clipPath", {id});
      const [x, y, w, h] = this.box; Draw.el(cp, "rect", {x, y, width: w, height: h});
      this.g = Draw.el(svg, "g", {"clip-path": `url(#${id})`});
      if (orbit) this._listen();
    }
    // ---------- vetítés ----------
    _setup() {
      const r = Math.PI / 180, ce = Math.cos(this.el * r), se = Math.sin(this.el * r), ca = Math.cos(this.az * r), sa = Math.sin(this.az * r);
      this.eye = this.target.map((v, i) => v + this.dist * (ce * (ca * this.e1[i] + sa * this.e2[i]) + se * this.up[i]));
      const {R, t} = VK.lookAt(this.eye, this.target, this.up), [x, y, w, h] = this.box;
      this.R = R; this.t = t; this.cx = x + w / 2; this.cy = y + h / 2; this.f = 0.5 * Math.min(w, h) / Math.tan(this.fov * r / 2);
      this.near = this.ortho ? -Infinity : 0.05 * this.dist;
    }
    _cam(p) { const R = this.R, t = this.t; return [0, 1, 2].map(i => R[i][0] * p[0] + R[i][1] * p[1] + R[i][2] * p[2] + t[i]); }
    _screen(q) { const k = this.f / (this.ortho ? this.dist : q[2]); return [this.cx + k * q[0], this.cy + k * q[1]]; }

    project(p) { this._setup(); const q = this._cam(p); return q[2] < this.near ? [NaN, NaN, q[2]] : [...this._screen(q), q[2]]; }

    nearest(pts, s, tol = 12) { let best = -1, bd = tol; pts.forEach((p, i) => { const q = this.project(p), d = Math.hypot(q[0] - s[0], q[1] - s[1]); if (d < bd) { bd = d; best = i; } }); return best; }

    // ---------- primitívek (3D-ben tárolva; draw() vetíti és mélység szerint rendezi) ----------
    clear() { this.items = []; return this; }
    _add(type, pts, cls, o = {}) { const {layer = 0, ...attrs} = o; this.items.push({type, pts, cls, layer, attrs}); return this; }
    line(pts, cls = "truth", o = {}) {                       // split: true → szakaszonkénti mélységrendezés
      const {split, ...rest} = o;
      if (split) { for (let i = 1; i < pts.length; i++) this._add("line", [pts[i - 1], pts[i]], cls, rest); return this; }
      return this._add("line", pts, cls, rest);
    }
    polygon(pts, cls = "face", o) { return this._add("poly", pts, cls, o); }

      ["ax-x", "ax-y", "ax-z"].forEach((cls, k) => {

    _clipLine(q) {                       // közeli sík és nem véges pontok → szakaszsorozatok
      const runs = []; let run = []; const flush = () => { if (run.length > 1) runs.push(run); run = []; };
      const ok = p => p.every(Number.isFinite), cut = (a, b) => { const s = (this.near - a[2]) / (b[2] - a[2]); return a.map((v, i) => v + s * (b[i] - v)); };

    _clipPoly(q) {
      if (!q.every(p => p.every(Number.isFinite))) return [];

      this._setup();
      const list = [], depth = q => q.reduce((s, p) => s + p[2], 0) / q.length;
      this.items.forEach((it, order) => {
        const q = it.pts.map(p => this._cam(p)), push = c => list.push({it, c, d: depth(c), order});
        if (it.type === "line") this._clipLine(q).forEach(push);
        else if (it.type === "poly") { const c = this._clipPoly(q); if (c.length) push(c); }
        else if (it.type === "arrow") this._clipLine(q).forEach(push);

      list.sort((a, b) => a.it.layer - b.it.layer || b.d - a.d || a.order - b.order);

      const [x, y, w, h] = this.box;
      if (this.frame) Draw.el(this.g, "rect", {x, y, width: w, height: h, class: "frame"});
      list.forEach(({it, c}) => {
        const s = c.map(p => this._screen(p)), P = s.map(p => p[0].toFixed(2) + "," + p[1].toFixed(2)).join(" "), [sx, sy] = s[0];
        const {r, s: sz, str, head, ...extra} = it.attrs, cls = it.cls;
        if (it.type === "line") Draw.el(this.g, "polyline", {points: P, class: cls, fill: "none", ...extra});
        else if (it.type === "poly") Draw.el(this.g, "polygon", {points: P, class: cls, ...extra});
        else if (it.type === "arrow") Draw.arrowPx(this.g, sx, sy, s[s.length - 1][0], s[s.length - 1][1], cls, head === undefined ? 8 : head);
        else if (it.type === "dot") Draw.el(this.g, "circle", {cx: sx, cy: sy, r, class: cls, ...extra});
        else if (it.type === "cross") Draw.el(this.g, "path", {d: `M${sx - sz},${sy - sz}l${2 * sz},${2 * sz}m0,${-2 * sz}l${-2 * sz},${2 * sz}`, class: cls, ...extra});
        else Draw.el(this.g, "text", {x: sx, y: sy, class: cls, ...extra}, str);
      });
      if (this.hint) Draw.el(this.g, "text", {x: x + 6, y: y + h - 6, class: "tick"}, "forgatás: húzás");
      return this;
    }
    /* Nézet átállítása: set({az, el, dist, fov, ortho, target}) + újrarajzolás, majd onChange
       (az onChange-ből indított újabb set() már nem hívja vissza). */
    set(o) { Object.assign(this, o); this.draw();
      if (this.onChange && !this._busy) { this._busy = true; try { this.onChange(this); } finally { this._busy = false; } }
      return this; }
    reset() { return this.set({...this.home, target: this.home.target.slice()}); }
    /* type: "click" → fn([sx, sy], event) (forgatás nélküli kattintás) */
    on(type, fn) { this.handlers[type] = fn; return this; }

      const inside = e => { const [a, b] = local(e), [x, y, w, h] = this.box; return a >= x && a <= x + w && b >= y && b <= y + h; };
      const zoom = k => this.set({dist: Math.max(0.15 * this.home.dist, Math.min(8 * this.home.dist, this.dist * k))});

      svg.addEventListener("pointerdown", e => { if (svg._grab || !inside(e)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
        start = [e.clientX, e.clientY]; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
      svg.addEventListener("pointermove", e => {
        const old = pts.get(e.pointerId); if (!old) return;
        const now = [e.clientX, e.clientY], other = [...pts].find(([k]) => k !== e.pointerId);
        pts.set(e.pointerId, now);
        if (other) { const o = other[1], d0 = Math.hypot(old[0] - o[0], old[1] - o[1]), d1 = Math.hypot(now[0] - o[0], now[1] - o[1]); if (d1 > 1) zoom(d0 / d1); return; }

})();

/* ui.js – lejátszó és vezérlők az interaktív lapokhoz.

   UI.app({
     title, frames: N | (state) => N, fps: 8,
     params:  [{id, label, min, max, step, value, fmt: v => "…", rebuild: true}],
     toggles: [{id, label, value}],
     buttons: [{id, label, action: (app) => {…}}],
     build(p, app) → state       // paraméterváltozáskor (rebuild) újraszámol; elhagyható
     render(state, frame, p, app) → státuszszöveg (string, opcionális)
   })
   A „rebuild: false” paraméter csak újrarajzol. frames = 0: statikus (nincs lejátszósáv). */
"use strict";
const UI = (() => {
  const $ = (tag, attrs = {}, text) => { const e = document.createElement(tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; return e; };
  function app(spec) {
    const root = document.getElementById("controls"), status = document.getElementById("status");
    const p = {}, a = {frame: 0, playing: false, state: null, spec, timer: null};
    const bar = $("div", {class: "ctl", role: "group", "aria-label": "Lejátszás"});
    const btn = (label, title, fn) => { const b = $("button", {type: "button", title}, label); b.onclick = fn; bar.appendChild(b); return b; };
    const nFrames = () => typeof spec.frames === "function" ? spec.frames(a.state) : (spec.frames || 0);
    const pos = $("input", {type: "range", min: 0, max: 0, value: 0, "aria-label": "Időpillanat"});
    const cnt = $("span", {class: "small"});
    let playBtn;
    if (spec.frames) {
      btn("⏮", "Elejére", () => { stop(); go(0); });
      btn("◀", "Egy lépés vissza", () => { stop(); go(a.frame - 1); });
      playBtn = btn("▶ Lejátszás", "Lejátszás / szünet", () => a.playing ? stop() : play());
      btn("▶|", "Egy lépés előre", () => { stop(); go(a.frame + 1); });
      bar.appendChild(pos); bar.appendChild(cnt);
      const sp = $("select", {"aria-label": "Sebesség", title: "Lejátszási sebesség"});
      [["0.5", "0,5×"], ["1", "1×"], ["2", "2×"], ["4", "4×"]].forEach(([v, l]) => { const o = $("option", {value: v}, l); if (v === "1") o.selected = true; sp.appendChild(o); });
      sp.onchange = () => { a.speed = +sp.value; if (a.playing) { stop(); play(); } };
      bar.appendChild(sp); a.speed = 1;
      pos.oninput = () => { stop(); go(+pos.value); };
      root.appendChild(bar);
    }
    const prm = $("div", {class: "params"});
    const inputs = {};
    (spec.params || []).forEach(q => {
      // log: true → a csúszka log10-skálán mozog (min/max a valódi értékek, > 0)
      const toPos = v => q.log ? Math.log10(v) : v, fromPos = v => q.log ? Math.pow(10, v) : v;
      p[q.id] = q.value;
      const lab = $("label", {class: "param"}), out = $("output", {}), inp = $("input", {type: "range", min: toPos(q.min), max: toPos(q.max),
        step: q.log ? "any" : (q.step || "any"), value: toPos(q.value), "aria-label": q.label});
      const show = () => out.textContent = q.fmt ? q.fmt(p[q.id]) : Draw.fmt(p[q.id], 2);
      inp.oninput = () => { p[q.id] = fromPos(+inp.value); show(); q.rebuild === false ? draw() : rebuild(); };
      inputs[q.id] = {inp, show, lab, toPos, q};
      lab.append($("span", {}, q.label), inp, out); prm.appendChild(lab); show();
    });
    // Választómező: {id, label, options: [[érték, felirat], …], value}; az érték szöveg.
    (spec.selects || []).forEach(q => {
      p[q.id] = q.value;
      const lab = $("label", {class: "param"}), sel = $("select", {"aria-label": q.label});
      q.options.forEach(([v, l]) => { const o = $("option", {value: v}, l); if (v === q.value) o.selected = true; sel.appendChild(o); });
      sel.onchange = () => { p[q.id] = sel.value; q.rebuild === false ? draw() : rebuild(); };
      inputs[q.id] = {inp: sel, lab, toPos: v => v, show: () => {}, select: true};
      lab.append($("span", {}, q.label), sel); prm.appendChild(lab);
    });
    (spec.toggles || []).forEach(q => {
      p[q.id] = !!q.value;
      const lab = $("label", {class: "toggle"}), inp = $("input", {type: "checkbox"});
      inputs[q.id] = {inp, lab, toggle: true};
      inp.checked = p[q.id]; inp.onchange = () => { p[q.id] = inp.checked; q.rebuild ? rebuild() : draw(); };
      lab.append(inp, $("span", {}, q.label)); prm.appendChild(lab);
    });
    (spec.buttons || []).forEach(q => { const b = $("button", {type: "button"}, q.label); b.onclick = () => q.action(api); prm.appendChild(b); });
    if (prm.childNodes.length) root.appendChild(prm);

    function draw() { const msg = spec.render(a.state, a.frame, p, api); if (typeof msg === "string") status.textContent = msg; }
    function go(f) { const n = nFrames(); a.frame = Math.max(0, Math.min(n - 1, f)); pos.max = Math.max(0, n - 1); pos.value = a.frame;
      cnt.textContent = n ? `${a.frame + 1}/${n}` : ""; draw(); }
    function play() { if (a.frame >= nFrames() - 1) a.frame = 0; a.playing = true; if (playBtn) playBtn.textContent = "⏸ Szünet";

    function stop() { a.playing = false; clearInterval(a.timer); if (playBtn) playBtn.textContent = "▶ Lejátszás"; }
    function rebuild() { a.state = spec.build ? spec.build(p, api) : null; go(Math.min(a.frame, nFrames() - 1)); }
    /* Programozott beállítás (előbeállítás-gombokhoz): a vezérlő is frissül. set({a: 1, b: 2}) több
       értéket egyszerre állít, egyetlen újraszámolással; {rebuild: false} esetén csak újrarajzol. */
    function set(id, value, opt = {}) {
      const pairs = typeof id === "object" ? Object.entries(id) : [[id, value]];
      if (typeof id === "object") opt = value || {};
      pairs.forEach(([k, v]) => { const c = inputs[k]; p[k] = v; if (!c) return;
        if (c.toggle) c.inp.checked = !!v; else { c.inp.value = c.toPos(v); c.show(); } });
      opt.rebuild === false ? draw() : rebuild();
    }
    /* Vezérlő letiltása/engedélyezése (pl. ha egy kapcsoló mellett hatástalan). */
    function disable(id, off = true) { const c = inputs[id]; if (!c) return; c.inp.disabled = off; c.lab.classList.toggle("disabled", off); }
    const message = text => { status.textContent = text; };      // pl. egérmozgatás eseménykezelőjéből
    const api = {params: p, rebuild, redraw: draw, go, play, stop, set, disable, message, get frame() { return a.frame; }, get state() { return a.state; }, set state(s) { a.state = s; }};
    rebuild();
    // #frame=N a lap címében: indulás az N-edik képkockától (hivatkozáshoz és teszteléshez).
    // További hash-paraméterek: #frame=3&q=100&on=0 → a megnevezett csúszkák/kapcsolók beállítása (teszteléshez).
    const hp = {}; (location.hash || "").slice(1).split("&").forEach(kv => { const [k, v] = kv.split("=");
      if (k && k !== "frame" && inputs[k] && v !== undefined) hp[k] = inputs[k].toggle ? v !== "0" && v !== "false" : inputs[k].select ? decodeURIComponent(v) : +decodeURIComponent(v); });
    if (Object.keys(hp).length) set(hp);
    const hf = /frame=(\d+)/.exec(location.hash || ""); if (hf) go(+hf[1]);
    if (spec.autoplay && !hf) play();
    return api;
  }
  return {app};
})();

const clamp = (x, a, b) => x < a ? a : x > b ? b : x, fr = Math.fround;
const POP = x => { x -= (x >>> 1) & 0x55555555; x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
  return (((x + (x >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; };
function censusAt(im, u, v) {                    // 5×5, bit = 1, ha a szomszéd sötétebb
  const c = im.data[v * W + u]; let code = 0;
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
    if (!i && !j) continue;

}
function costRow(L, R, v, w, method) {           // mint stereo.cost_volume a v sorban
  const r = (w - 1) / 2, rows = [], C = new Float64Array(W * D), diff = new Float64Array(W);
  for (let i = -r; i <= r; i++) rows.push(v + i);
  const code = method === "census" ? [L, R].map(im => rows.map(y => Array.from({length: W}, (_, u) => censusAt(im, u, y)))) : null;
  for (let d = 0; d < D; d++) {
    diff.fill(0);
    rows.forEach((y, k) => { for (let u = 0; u < W; u++) {
      const s = clamp(u - d, 0, W - 1);
      diff[u] += method === "census" ? POP(code[0][k][u] ^ code[1][k][s]) : Math.abs(L.data[y * W + u] - R.data[y * W + s]); } });
    for (let u = 0; u < W; u++) {
      let sum = 0;
      for (let j = -r; j <= r; j++) sum += diff[clamp(u + j, 0, W - 1)];

function path(C, dir, P1, P2) {                  // egy vízszintes SGM-út (float32-aritmetika)
  const L = new Float64Array(W * D); let prev = null;
  P1 = fr(P1); P2 = fr(P2);
  for (let k = 0; k < W; k++) {
    const u = dir > 0 ? k : W - 1 - k, cur = new Float64Array(D);
    if (!prev) for (let d = 0; d < D; d++) cur[d] = C[u * D + d];

      for (let d = 0; d < D; d++) {

        if (d > 0) best = Math.min(best, fr(prev[d - 1] + P1));
        if (d < D - 1) best = Math.min(best, fr(prev[d + 1] + P1));

function wtaRow(V) {                             // WTA parabolás finomítással

function compute(imgs, v, w, method, P1, P2, mode) {

  const dirs = mode === "both" ? [1, -1] : mode === "lr" ? [1] : [-1];

DATA.check.forEach(q => {                        // egyezés a visionkit.stereo eredményével
  const r = compute(q.noisy ? noisy : clean, q.v, q.w, q.method, q.P1, q.P2, "both");
  for (let u = 0; u < W; u++)

});
let row = DATA.row, col = DATA.u;
const A = new Img.Panel(svg, {box: [8, 22, 396, 222], width: W, height: H, title: "bal kép (kattints egy sorra)"});
const Q = new Draw.Plot(svg, {box: [446, 24, 262, 190], xlim: [0, 40], ylim: [0, 1], title: "költség a kijelölt u-nál", xlabel: "d [px]"});
const B = new Img.Panel(svg, {box: [34, 282, 674, 190], width: W, height: 41, equal: false,
                              extent: [-0.5, W - 0.5, -0.5, 40.5], title: "költségszelet (vízszintes: u, függőleges: d, felfelé nő)"});
const R2 = new Draw.Plot(svg, {box: [34, 506, 674, 130], xlim: [0, W - 1], ylim: [0, 32], title: "diszparitás a sorban", xlabel: "u [px]"});
const ticks = hi => { const st = hi > 20 ? 10 : hi > 8 ? 4 : hi > 2 ? 1 : hi > 0.4 ? 0.2 : 0.05;
  return Array.from({length: Math.floor(hi / st) + 1}, (_, i) => i * st); };
[0, 10, 20, 30, 40].forEach(d => Draw.el(svg, "text", {x: 28, y: B.Y(40 - d) + 4, class: "tick", "text-anchor": "end"}, String(d)));
const app = UI.app({
  params: [
    {id: "w", label: "ablak w", min: 1, max: 15, step: 2, value: 1, fmt: v => `${v}×${v}`},
    {id: "p1", label: "P₁", min: 0, max: 16, step: 0.5, value: 4, fmt: v => Draw.fmt(v, 1)},
    {id: "p2", label: "P₂", min: 0, max: 96, step: 1, value: 24, fmt: v => Draw.fmt(v, 0)}],
  selects: [
    {id: "m", label: "költség", value: "census", options: [["census", "census 5×5 (bit)"], ["sad", "SAD (P-k ×0,01)"]]},
    {id: "dir", label: "SGM-utak", value: "both", options: [["both", "→ és ←"], ["lr", "csak →"], ["rl", "csak ←"]]},
    {id: "show", label: "szelet", value: "C", options: [["C", "C (nyers)"], ["S", "S (SGM)"]], rebuild: false}],
  toggles: [{id: "noise", label: "zajos képek (σ = 0,01)", value: false, rebuild: true},
            {id: "gt", label: "alapigazság", value: true}],
  build(p) {
    const k = p.m === "sad" ? 0.01 : 1, P1 = p.p1 * k, P2 = Math.max(p.p2, p.p1) * k;
    return {...compute(p.noise ? noisy : clean, row, p.w, p.m, P1, P2, p.dir), P1, P2};
  },
  render(s, f, p) {
    const v = row - TOP, im = (p.noise ? noisy : clean)[0];
    A.show(im).clear();
    A.line([[-0.5, v], [W - 0.5, v]], "accent"); A.line([[col, v - 9], [col, v + 9]], "accent");
    const V = p.show === "C" ? s.C : s.S, n = p.show === "C" ? 1 : s.n;
    const img = new Float64Array(W * 41);
    let top = 0;
    for (let u = 0; u < W; u++) for (let d = 0; d <= 40; d++) { const x = V[u * D + d] / n; img[(40 - d) * W + u] = x; if (u >= d) top = Math.max(top, x); }
    B.show(VK.image(W, 41, 1, img), {cmap: "gray", vmin: 0, vmax: top * 0.85});
    B.clear();
    const gtv = Array.from({length: W}, (_, u) => G[v * W + u] ? G[v * W + u] / 8 : NaN);
    if (p.gt) B.line(gtv.map((d, u) => [u, 40 - d]), "truth");
    const dd = p.show === "C" ? s.bm : s.sg;
    dd.forEach((d, u) => { if (d <= 40) B.dot([u, 40 - d], 1.3, p.show === "C" ? "mark-det" : "est-dot"); });
    B.line([[col, 0], [col, 40]], "accent");
    const cu = Array.from({length: 41}, (_, d) => [d, s.C[col * D + d]]), su = Array.from({length: 41}, (_, d) => [d, s.S[col * D + d] / s.n]);
    const hi = Math.max(...cu.map(q => q[1]), ...su.map(q => q[1])) * 1.45;
    Q.setLimits([0, 40], [0, hi]); Q.clear(); Q.axes(ticks(hi), [0, 10, 20, 30, 40]); Q.line(cu, "det"); Q.line(su, "est");
    if (isFinite(gtv[col])) Q.line([[gtv[col], 0], [gtv[col], hi]], "truth");
    Draw.legend(svg, [["det", "C", "line"], ["est", "S (SGM)", "line"], ["truth", "alapig.", "line"]], 590, 40, 15);
    [[s.bm, s.C, 1, "mark-det"], [s.sg, s.S, s.n, "est-dot"]].forEach(([dd2, V2, n2, cls]) => {
      const k = Math.round(dd2[col]); if (k <= 40) Q.dot([k, V2[col * D + k] / n2], 4, cls); });
    R2.clear(); R2.axes([0, 8, 16, 24, 32], [0, 50, 100, 150, 200, 250, 300]);
    s.bm.forEach((d, u) => R2.dot([u, Math.min(d, 31.8)], 1.5, "mark-det"));
    if (p.gt) R2.line(gtv.map((d, u) => [u, d]), "truth");

    const err = a => { let n = 0, b = 0; for (let u = 0; u < W; u++) if (isFinite(gtv[u])) { n++; if (Math.abs(a[u] - gtv[u]) > 1) b++; } return 100 * b / n; };

      `SGM ${fm(err(s.sg), 1)}%. u = ${col}: alapigazság ${fm(gtv[col])}, blokk ${fm(s.bm[col])}, SGM ${fm(s.sg[col])} ` +
      `(narancs: nyers C, kék: S).`;
  }});
A.on("click", q => { row = Math.min(210, Math.max(49, q.j + TOP)); col = q.i; app.rebuild(); });
B.on("click", q => { col = Math.max(0, Math.min(W - 1, Math.round(q.u))); app.redraw(); });

</script>
