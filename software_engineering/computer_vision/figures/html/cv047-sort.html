<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SORT-típusú követő</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--grid:#e6e6e6;--frame:#999;
  --truth:#000;--det:#c55a11;--pred:#1f4e79;--est:#1f4e79;--naive:#777;--gate:#548235;--occ:#bbb;--band:rgba(31,78,121,.15);--accent:#7030a0}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--grid:#333;--frame:#666;
  --truth:#f2f2f2;--det:#f0a060;--pred:#8fb8e8;--est:#8fb8e8;--naive:#999;--gate:#9fd27f;--occ:#555;--band:rgba(143,184,232,.18);--accent:#c9a0f0}}
*{box-sizing:border-box}
body{margin:0;padding:8px 10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl,.params{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:2px 9px;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:120px}
label.param{display:flex;align-items:center;gap:6px}
label.param input{width:120px}
label.param output{min-width:4.2em;font-variant-numeric:tabular-nums}
label.toggle{display:flex;align-items:center;gap:4px}
#status{min-height:2.9em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block;font-family:system-ui,sans-serif}
.small,.note{font-size:12px;color:var(--muted)}
/* jelrendszer */
.frame{fill:none;stroke:var(--frame);stroke-width:1}
.grid{stroke:var(--grid);stroke-width:.7}
.truth{stroke:var(--truth);stroke-width:1.6;fill:none}
.truth-dot{fill:var(--truth)}
.det{stroke:var(--det);stroke-width:1.8;fill:none}
.det-low{stroke:var(--det);stroke-width:1.4;fill:none;opacity:.45}
.det-clip{stroke:var(--det);stroke-width:1.8;stroke-dasharray:5 3;fill:none}
.clutter{stroke:var(--det);stroke-width:1.2;fill:none;opacity:.5}
.pred-ell{stroke:var(--pred);stroke-width:1.3;stroke-dasharray:5 3;fill:none}
.est{stroke:var(--est);stroke-width:2;fill:none}
.est-dot{fill:var(--est)}
.est-ell{stroke:var(--est);stroke-width:1.5;fill:var(--band)}
.naive{stroke:var(--naive);stroke-width:1.6;stroke-dasharray:1.5 3;fill:none}
.gate{stroke:var(--gate);stroke-width:1.4;stroke-dasharray:1 3;fill:none}
.occluder{fill:url(#hatch);stroke:var(--occ)}
.hatch-line{stroke:var(--occ);stroke-width:2}
.band{fill:var(--band);stroke:none}
.cursor{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.vel{stroke:var(--est);stroke-width:1.4}
.arrowhead{fill:var(--est)}
.accent{stroke:var(--accent);stroke-width:1.6;fill:none}
text{fill:var(--fg);font-size:12px}
.label{font-size:12px}.tick{font-size:10.5px;fill:var(--muted)}.plot-title{font-size:12px;font-weight:600}
.legend-text{font-size:11.5px}
#status.error{color:#c00;font-weight:600}
/* bővítések (2026-11-25): mintapontok, jelölők, letiltott vezérlő */
.sample{stroke:var(--naive);opacity:.45;fill:none}
.sample-est{stroke:var(--est);opacity:.35;fill:none}
.mark{fill:var(--bg);stroke:var(--fg);stroke-width:1.3}
.mark-est{fill:var(--est);stroke:var(--est)}
.mark-det{fill:none;stroke:var(--det);stroke-width:1.6}

.ghost{opacity:.35}
label.disabled{opacity:.45}
.mark-det-fill{fill:var(--det);stroke:var(--det);stroke-width:1.2}
/* látás-jelrendszer (context.md „Színek és jelek”): belső kék, kiugró piros üres kör, epipoláris zöld
   pontvonal, kamera szürke, tengelyek x piros / y zöld / z kék */
:root{--inlier:#1f5fbf;--outlier:#c62828;--epi:#1e7d32;--cam:#6e6e6e;--ax-x:#d32f2f;--ax-y:#2e7d32;--ax-z:#1f5fd0;
  --face:rgba(120,120,120,.14);--truth-face:rgba(0,0,0,.07);--est-face:rgba(31,78,121,.16)}
@media (prefers-color-scheme:dark){:root{--inlier:#7ab3ff;--outlier:#ff7b72;--epi:#81d68a;--cam:#a8a8a8;--ax-x:#ff7b72;--ax-y:#7fd48a;--ax-z:#7aa7ff;
  --face:rgba(180,180,180,.16);--truth-face:rgba(255,255,255,.09);--est-face:rgba(143,184,232,.2)}}
.inlier{fill:var(--inlier);stroke:var(--inlier);stroke-width:1.2}
.outlier{fill:none;stroke:var(--outlier);stroke-width:1.8}
.inlier-line{fill:none;stroke:var(--inlier);stroke-width:1.4}
.outlier-line{fill:none;stroke:var(--outlier);stroke-width:1.4;stroke-dasharray:5 3}
.epi{fill:none;stroke:var(--epi);stroke-width:2.2;stroke-dasharray:.5 4;stroke-linecap:round}
.cam{fill:none;stroke:var(--cam);stroke-width:1.3}
.cam-face{fill:var(--face);stroke:none}
.cam-up{fill:var(--cam);stroke:none}
.face{fill:var(--face);stroke:var(--cam);stroke-width:.8}
.truth-face{fill:var(--truth-face);stroke:var(--truth);stroke-width:1.2}
.est-face{fill:var(--est-face);stroke:var(--est);stroke-width:1.4}
.ax-x{stroke:var(--ax-x);stroke-width:2;fill:none}.ax-y{stroke:var(--ax-y);stroke-width:2;fill:none}.ax-z{stroke:var(--ax-z);stroke-width:2;fill:none}
text.ax-x-text{fill:var(--ax-x);font-weight:600}text.ax-y-text{fill:var(--ax-y);font-weight:600}text.ax-z-text{fill:var(--ax-z);font-weight:600}
.truth-box{fill:none;stroke:var(--truth);stroke-width:1.8}
.det-box{fill:none;stroke:var(--det);stroke-width:2;stroke-dasharray:6 3}
.est-box{fill:none;stroke:var(--est);stroke-width:2}
.px-hl{fill:none;stroke:var(--accent);stroke-width:2.2}
.px-grid{stroke:#888;stroke-width:.5;opacity:.7}
.bracket{fill:none;stroke:var(--fg);stroke-width:1.2}
.num{font-variant-numeric:tabular-nums}
.hl{fill:var(--accent);font-weight:700}
/* képpanel: canvas az SVG alatt; a rárajzolás színei a képen mindkét témában a világos paletta, fehér peremmel */

.vwrap>canvas{position:absolute;image-rendering:pixelated;z-index:0}
.vwrap>svg{position:relative;z-index:1}
.imgpanel{--truth:#000;--det:#e0660f;--pred:#1f4e79;--est:#1257c9;--naive:#555;--gate:#2e7d32;--accent:#a000c8;--inlier:#1257c9;
  --outlier:#d50000;--epi:#00852a;--cam:#555;--fg:#000;--band:rgba(18,87,201,.15);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 .6px #fff)}
.imgpanel .frame{stroke:var(--frame)}
.imgpanel.nohalo{filter:none}
.imgpanel text.px-val{paint-order:stroke;stroke:#fff;stroke-width:2.4px;stroke-linejoin:round}

<body>
<div id="controls"></div>
<div id="status" aria-live="polite"></div>
<svg id="view" viewBox="0 0 720 428" role="img" aria-label="Mozgó alakzatok zajos detekciókkal, a követők dobozai, költségmátrix és idővonal"></svg>
<p class="note">Narancs szaggatott: detekció; kék: a követő kimenete (#azonosító); kék szaggatott: predikció; zöld pontvonal: detekció nélkül tovább élő megerősített követő. A lap a visionkit.track átiratát futtatja, és betöltéskor 12 beállításon ellenőrzi az egyezést.</p>
<script>
// Hibát látható módon jelezzük (a statikus PNG a lap alatt lenyitható tartalék marad).
function figError(m) { const s = document.getElementById("status");
  if (s) { s.textContent = "Hiba az interaktív ábrában: " + m; s.className = "error"; } }
window.addEventListener("error", e => figError(e.message + " (sor " + e.lineno + ")"));
window.addEventListener("unhandledrejection", e => figError(String(e.reason)));
</script>
<script>
/* kf.js – a könyv interaktív lapjainak számítási magja (külső függőség nélkül).
   A kftrack Python-csomag tükre: ugyanazok a képletek, ugyanaz az állapotsorrend
   ([x, y, vx, vy]), a paritást a figures/web/test/ teszt ellenőrzi.
   Mátrix: tömbök tömbje (sorok), vektor: sima tömb. */
"use strict";
const KF = (() => {
  // ---------- mátrixok ----------
  const zeros = (r, c) => Array.from({length: r}, () => new Array(c).fill(0));
  const eye = n => { const I = zeros(n, n); for (let i = 0; i < n; i++) I[i][i] = 1; return I; };
  const T = A => A[0].map((_, j) => A.map(row => row[j]));
  const mul = (A, B) => A.map(row => B[0].map((_, j) => row.reduce((s, a, k) => s + a * B[k][j], 0)));
  const mv = (A, x) => A.map(row => row.reduce((s, a, k) => s + a * x[k], 0));
  const add = (A, B) => A.map((row, i) => row.map((a, j) => a + B[i][j]));
  const sub = (A, B) => A.map((row, i) => row.map((a, j) => a - B[i][j]));
  const scale = (A, s) => A.map(row => row.map(a => a * s));
  const vadd = (a, b) => a.map((v, i) => v + b[i]);
  const vsub = (a, b) => a.map((v, i) => v - b[i]);
  const vscale = (a, s) => a.map(v => v * s);
  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sym = P => P.map((row, i) => row.map((a, j) => 0.5 * (a + P[j][i])));
  const diag = d => { const D = zeros(d.length, d.length); d.forEach((v, i) => D[i][i] = v); return D; };
  const kron = (A, B) => {
    const r = A.length * B.length, c = A[0].length * B[0].length, K = zeros(r, c);
    A.forEach((ra, i) => ra.forEach((a, j) => B.forEach((rb, k) => rb.forEach((b, l) => {
      K[i * B.length + k][j * B[0].length + l] = a * b; }))));
    return K;
  };
  const clone = A => A.map(r => r.slice());
  const select = (A, rows, cols) => rows.map(i => cols.map(j => A[i][j]));
  /* A X = B megoldása Gauss-eliminációval, részleges főelemkiválasztással (kf004: „solve, ne inv”).
     B lehet vektor vagy mátrix. */
  function solve(A, B) {
    const n = A.length, vec = !Array.isArray(B[0]);
    const M = A.map((row, i) => row.concat(vec ? [B[i]] : B[i]));
    const w = M[0].length;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-300) throw new Error("szinguláris mátrix");
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) {
        const f = M[r][c] / M[c][c];
        if (f) for (let k = c; k < w; k++) M[r][k] -= f * M[c][k];
      }
    }
    const X = zeros(n, w - n);
    for (let r = n - 1; r >= 0; r--) for (let k = 0; k < w - n; k++) {
      let s = M[r][n + k];
      for (let j = r + 1; j < n; j++) s -= M[r][j] * X[j][k];
      X[r][k] = s / M[r][r];
    }
    return vec ? X.map(r => r[0]) : X;
  }
  const inv = A => solve(A, eye(A.length));
  function chol(P) {          // P = L Lᵀ, L alsó háromszög (kf006)
    const n = P.length, L = zeros(n, n);
    for (let i = 0; i < n; i++) for (let j = 0; j <= i; j++) {
      let s = P[i][j];
      for (let k = 0; k < j; k++) s -= L[i][k] * L[j][k];
      if (i === j) { if (s <= 0) throw new Error("nem pozitív definit"); L[i][i] = Math.sqrt(s); }
      else L[i][j] = s / L[j][j];
    }
    return L;
  }
  function eig2(P) {          // szimmetrikus 2×2: sajátértékek (nagy, kicsi) és a nagyobbik iránya
    const a = P[0][0], b = 0.5 * (P[0][1] + P[1][0]), d = P[1][1];
    const tr = a + d, disc = Math.sqrt(Math.max(0, 0.25 * (a - d) * (a - d) + b * b));
    return {l1: 0.5 * tr + disc, l2: 0.5 * tr - disc, angle: 0.5 * Math.atan2(2 * b, a - d)};
  }
  const mat = {zeros, eye, T, mul, mv, add, sub, scale, vadd, vsub, vscale, dot, sym, diag, kron,
               clone, select, solve, inv, chol, eig2};

  // ---------- szögek (kf028) ----------
  const TAU = 2 * Math.PI;
  function wrap(a) { let w = ((a + Math.PI) % TAU + TAU) % TAU - Math.PI; return w === -Math.PI ? Math.PI : w; }
  function wrapHalf(a) { let w = ((a + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
                         return w === -Math.PI / 2 ? Math.PI / 2 : w; }
  const angles = {wrap, wrapHalf, diff: (a, b) => wrap(a - b),
    mean: (as, ws) => { ws = ws || as.map(() => 1 / as.length);
      return Math.atan2(as.reduce((s, a, i) => s + ws[i] * Math.sin(a), 0),
                        as.reduce((s, a, i) => s + ws[i] * Math.cos(a), 0)); }};

  // ---------- modellek (kf016–kf018, kf027) ----------
  const models = {
    cvF: (dt, dim = 2) => kron([[1, dt], [0, 1]], eye(dim)),
    caF: (dt, dim = 2) => kron([[1, dt, 0.5 * dt * dt], [0, 1, dt], [0, 0, 1]], eye(dim)),
    cvQc: (dt, q, dim = 2) => scale(kron([[dt ** 3 / 3, dt ** 2 / 2], [dt ** 2 / 2, dt]], eye(dim)), q),
    caQd: (dt, sj, dim = 2) => { const g = [dt ** 3 / 6, dt * dt / 2, dt]; return scale(kron(g.map(a => g.map(b => a * b)), eye(dim)), sj * sj); },
    cvQd: (dt, sa, dim = 2) => scale(kron([[dt ** 4 / 4, dt ** 3 / 2], [dt ** 3 / 2, dt * dt]], eye(dim)), sa * sa),
    posH: (order = 2, dim = 2) => { const e = [new Array(order).fill(0)]; e[0][0] = 1; return kron(e, eye(dim)); },
    ctf(x, dt) {
      const [px, py, v, phi, w] = x, a = w * dt;
      const s = Math.abs(a) < 1e-4 ? dt * (1 - a * a / 6) : Math.sin(a) / w;
      const c = Math.abs(a) < 1e-4 ? dt * (a / 2 - a ** 3 / 24) : (1 - Math.cos(a)) / w;
      const cp = Math.cos(phi), sp = Math.sin(phi);
      return [px + v * (s * cp - c * sp), py + v * (s * sp + c * cp), v, phi + w * dt, w];
    },
  };
  models.ctF = (x, dt, eps = 1e-6) => {
    const J = zeros(5, 5);
    for (let i = 0; i < 5; i++) {
      const xp = x.slice(), xm = x.slice(); xp[i] += eps; xm[i] -= eps;
      const fp = models.ctf(xp, dt), fm = models.ctf(xm, dt);
      for (let r = 0; r < 5; r++) J[r][i] = (fp[r] - fm[r]) / (2 * eps);
    }
    return J;
  };

  // ---------- szűrő (kf019–kf024) ----------
  function predict(x, P, F, Q, u) {
    const xn = mv(F, x);
    return {x: u ? vadd(xn, u) : xn, P: sym(add(mul(mul(F, P), T(F)), Q))};
  }
  function update(x, P, z, H, R, opt = {}) {
    const zhat = mv(H, x);
    const y = opt.residual ? opt.residual(z, zhat) : vsub(z, zhat);
    const S = sym(add(mul(mul(H, P), T(H)), R));
    const K = T(solve(S, mul(H, P)));                 // K = P Hᵀ S⁻¹
    const xn = vadd(x, mv(K, y));
    let Pn;
    if (opt.joseph === false) Pn = sub(P, mul(mul(K, S), T(K)));
    else { const IKH = sub(eye(x.length), mul(K, H));
           Pn = add(mul(mul(IKH, P), T(IKH)), mul(mul(K, R), T(K))); }
    return {x: xn, P: sym(Pn), y, S, K, nis: dot(y, solve(S, y))};
  }
  function selectRows(z, H, R, mask) {
    const idx = mask.map((m, i) => m ? i : -1).filter(i => i >= 0);
    return {z: idx.map(i => z[i]), H: idx.map(i => H[i].slice()), R: select(R, idx, idx)};
  }
  class Filter {
    constructor(x0, P0) { this.x = x0.slice(); this.P = clone(P0); }
    predict(F, Q, u) { const r = predict(this.x, this.P, F, Q, u); this.x = r.x; this.P = r.P; return this; }
    update(z, H, R, opt = {}) {
      if (opt.mask) { const s = selectRows(z, H, R, opt.mask); if (!s.z.length) return null; z = s.z; H = s.H; R = s.R; }
      const r = update(this.x, this.P, z, H, R, opt); this.x = r.x; this.P = r.P; return r;
    }
    forecast(F, Q, steps) { let x = this.x, P = this.P; const out = [];
      for (let i = 0; i < steps; i++) { ({x, P} = predict(x, P, F, Q)); out.push({x, P}); } return out; }
  }

  // ---------- Gauss (kf009) ----------
  const gauss = {
    coverage2d: k => 1 - Math.exp(-0.5 * k * k),
    kForCoverage2d: p => Math.sqrt(-2 * Math.log(1 - p)),
    mahalanobis2: (x, m, P) => { const d = vsub(x, m); return dot(d, solve(P, d)); },
    block: (P, i0 = 0, n = 2) => select(P, [...Array(n).keys()].map(i => i + i0), [...Array(n).keys()].map(i => i + i0)),
    /* k-szigma ellipszis; szinguláris vagy szemidefinit P2-re (pl. vetítés) a sajátfelbontásból
       rajzol (szakasz lesz belőle), indefinit P2-re üres tömb. */
    ellipse(m, P2, k = 2, n = 72) {
      let L;
      try { L = chol(add(P2, scale(eye(2), 1e-12))); }
      catch (e) {
        const E = eig2(P2); if (E.l2 < -1e-9 * Math.max(1, Math.abs(E.l1))) return [];
        const a = Math.sqrt(Math.max(E.l1, 0)), b = Math.sqrt(Math.max(E.l2, 0)), c = Math.cos(E.angle), s = Math.sin(E.angle), pts = [];
        for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), u = a * Math.cos(t), v = b * Math.sin(t);
          pts.push([m[0] + k * (c * u - s * v), m[1] + k * (s * u + c * v)]); }
        return pts;
      }
      const pts = [];
      for (let i = 0; i < n; i++) { const t = TAU * i / (n - 1), c = Math.cos(t), s = Math.sin(t);
        pts.push([m[0] + k * (L[0][0] * c), m[1] + k * (L[1][0] * c + L[1][1] * s)]); }
      return pts;
    },
  };

  // ---------- véletlen: determinisztikus, magolt (mulberry32 + Box–Muller) ----------
  function rng(seed = 1) {
    let a = seed >>> 0, spare = null;
    const uniform = (lo = 0, hi = 1) => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return lo + (hi - lo) * (((t ^ (t >>> 14)) >>> 0) / 4294967296); };
    const normal = () => { if (spare !== null) { const s = spare; spare = null; return s; }
      let u = 0; while (u === 0) u = uniform(); const v = uniform(), r = Math.sqrt(-2 * Math.log(u));
      spare = r * Math.sin(TAU * v); return r * Math.cos(TAU * v); };
    const poisson = lam => { const L = Math.exp(-lam); let k = 0, p = 1; do { k++; p *= uniform(); } while (p > L); return k - 1; };
    return {uniform, normal, poisson};
  }

  // ---------- szimulátor (a kftrack.sim tükre; más véletlenszám-generátorral) ----------
  const sim = {
    sigmaFromScore: (s, lo = 2, hi = 12) => lo * Math.pow(hi / lo, 1 - s),
    curvedTrack({K = 60, dt = 0.1, speed = 120, turn = 0.9, x0 = [80, 120], heading = 0.35, wobble = 1.6} = {}) {
      const t = [], truth = []; let pos = x0.slice(), prev = null;
      for (let k = 0; k < K; k++) {
        const tk = k * dt, phi = heading + turn * Math.sin(wobble * tk), v = speed * (1 + 0.15 * Math.sin(0.7 * tk));
        const vel = [v * Math.cos(phi), v * Math.sin(phi)];
        if (prev) pos = [pos[0] + 0.5 * (vel[0] + prev[0]) * dt, pos[1] + 0.5 * (vel[1] + prev[1]) * dt];
        t.push(tk); truth.push([pos[0], pos[1], vel[0], vel[1]]); prev = vel;
      }
      return {t, truth};
    },
    detectPoints(r, t, truth, {pMiss = 0.15, clutterRate = 0, area = [[0, 640], [0, 360]], scoreRange = [0.25, 1]} = {}) {
      return t.map((tk, k) => {
        const dets = [];
        if (r.uniform() >= pMiss) { const s = r.uniform(...scoreRange), sig = sim.sigmaFromScore(s);

/* ui.js – lejátszó és vezérlők az interaktív lapokhoz.

   UI.app({

     params:  [{id, label, min, max, step, value, fmt: v => "…", rebuild: true}],
     toggles: [{id, label, value}],
     buttons: [{id, label, action: (app) => {…}}],

    // További hash-paraméterek: #frame=3&q=100&on=0 → a megnevezett csúszkák/kapcsolók beállítása (teszteléshez).
    const hp = {}; (location.hash || "").slice(1).split("&").forEach(kv => { const [k, v] = kv.split("=");

  }

})();
