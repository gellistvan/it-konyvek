<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Az Okta 2022-es incidensének igazolt lánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra: a támadó a Sitel-környezet kompromittálásával megszerzi egy Sitel support mérnök laptopját; onnan igazolt hozzáférése van az Okta támogatási rendszeréhez; 2022. január 21-én kb. 25 percig két aktív ügyféltenant érintett."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Csak a végső vizsgálat által megerősített lánclépések; a cookie-lopás, az ügyfél-MFA letiltása és a C2-csatornás adatkivitel nem igazolt.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiinduló állapot: a csomópontok; a nyilak lépésenként jelennek meg.", "n": 0}, {"msg": "1. lépés: Támadó → Sitel support mérnök laptop (Sitel-környezet\nkompromittálása)", "n": 1}, {"msg": "2. lépés: Sitel support mérnök laptop → Okta támogatási rendszer (Igazolt hozzáférés)", "n": 2}, {"msg": "3. lépés: Okta támogatási rendszer → Két aktív ügyféltenant (2022-01-21,\nkb. 25 perc)", "n": 3}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = {"W": 520, "H": 440, "clusters": [], "nodes": [{"id": "A", "x": 150, "y": 30, "w": 80.80000000000001, "h": 35.0, "kind": "box", "fill": 0.8, "ls": "-", "lines": ["Támadó"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "B", "x": 150, "y": 150, "w": 142.4, "h": 54.0, "kind": "box", "fill": 0.9, "ls": "-", "lines": ["Sitel support", "mérnök laptop"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "C", "x": 150, "y": 270, "w": 160.0, "h": 54.0, "kind": "box", "fill": 0.9, "ls": "-", "lines": ["Okta támogatási", "rendszer"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "D", "x": 150, "y": 390, "w": 133.60000000000002, "h": 54.0, "kind": "box", "fill": 0.9, "ls": "-", "lines": ["Két aktív", "ügyféltenant"], "bold": false, "hatch": "", "lw": 1.4}], "edges": [{"pts": [[150.0, 47.5], [150.0, 123.0]], "ls": "-", "label": "Sitel-környezet\nkompromittálása", "lab": [340, 90], "g": 0}, {"pts": [[150.0, 177.0], [150.0, 243.0]], "ls": "-", "label": "Igazolt hozzáférés", "lab": [340, 210], "g": 1}, {"pts": [[150.0, 297.0], [150.0, 363.0]], "ls": "-", "label": "2022-01-21,\nkb. 25 perc", "lab": [300, 330], "g": 2}]};
function gfill(g){ return g >= 0.99 ? css("--cell") : css("--cellhl"); }
function dash(ls){ return ls === "--" ? "7 4" : "none"; }
function poly(p){ return p.map(q => q[0] + "," + q[1]).join(" "); }
function render(s){
  svg.setAttribute("viewBox", "0 0 " + SC.W + " " + SC.H); svg.innerHTML = "";
  const fg = css("--line"), hl = css("--hl2"), muted = css("--muted");
  const defs = el("defs", {});
  for (const [id, col] of [["ah", fg], ["ahh", hl], ["ahf", muted]]) {
    const m = document.createElementNS(NS, "marker");
    m.setAttribute("id", id); m.setAttribute("viewBox", "0 0 10 10"); m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "8"); m.setAttribute("markerHeight", "8"); m.setAttribute("orient", "auto");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", col);
    m.appendChild(p); defs.appendChild(m);
  }
  SC.clusters.forEach(c => {
    el("rect", {x: c.x, y: c.y, width: c.w, height: c.h, fill: gfill(c.fill), "fill-opacity": c.fill >= 0.99 ? 0 : 0.6,
                stroke: fg, "stroke-width": c.lw, "stroke-dasharray": dash(c.ls)});
    const ll = c.label.split("\n");
    ll.forEach((l, i) => el("text", {x: c.x + c.lab_dx, y: (c.bottom ? c.y + c.h - 9 - (ll.length - 1 - i) * 17 : c.y + 20 + i * 17), "font-size": 14, "font-weight": "bold"}, l));
  });
  SC.edges.forEach(e => {
    const cur = s.n > 0 && e.g === s.n - 1, shown = e.g < s.n;
    const col = cur ? hl : (shown ? fg : muted);
    el("polyline", {points: poly(e.pts), fill: "none", stroke: col, "stroke-width": cur ? 3.2 : 1.8,
                    "stroke-dasharray": dash(e.ls), "marker-end": "url(#" + (cur ? "ahh" : (shown ? "ah" : "ahf")) + ")",
                    opacity: shown ? 1 : 0.22});
  });
  SC.nodes.forEach(n => {
    const x0 = n.x - n.w / 2, y0 = n.y - n.h / 2;
    const sty = {fill: gfill(n.fill), stroke: fg, "stroke-width": n.lw, "stroke-dasharray": dash(n.ls)};
    if (n.kind === "decision") { const d = n.h / 2 * 0.7;
      el("polygon", Object.assign({points: poly([[x0, n.y], [x0 + d, y0], [x0 + n.w - d, y0], [x0 + n.w, n.y], [x0 + n.w - d, y0 + n.h], [x0 + d, y0 + n.h]])}, sty)); }
    else if (n.kind === "db") { const ry = 8;
      el("path", Object.assign({d: `M${x0},${y0 + ry} a${n.w / 2},${ry} 0 0 1 ${n.w},0 v${n.h - 2 * ry} a${n.w / 2},${ry} 0 0 1 ${-n.w},0 z`}, sty));
      el("path", {d: `M${x0},${y0 + ry} a${n.w / 2},${ry} 0 0 0 ${n.w},0`, fill: "none", stroke: fg, "stroke-width": n.lw}); }
    else el("rect", Object.assign({x: x0, y: y0, width: n.w, height: n.h, rx: n.kind === "round" ? 12 : 4}, sty));
    const off = n.kind === "db" ? 4 : 0, t0 = n.y + off - (n.lines.length - 1) * 9.5;
    n.lines.forEach((l, i) => el("text", {x: n.x, y: t0 + i * 19 + 5, "text-anchor": "middle", "font-size": 15,
                                          "font-weight": n.bold ? "bold" : "normal"}, l));
  });
  SC.edges.forEach(e => { if (e.label && e.g < s.n) {
    const ll = e.label.split("\n"), w = Math.max(...ll.map(x => x.length)) * 8 + 10, h = ll.length * 18 + 4;
    el("rect", {x: e.lab[0] - w / 2, y: e.lab[1] - h / 2, width: w, height: h, fill: css("--bg"), opacity: 0.9});
    ll.forEach((l, i) => el("text", {x: e.lab[0], y: e.lab[1] - h / 2 + 15 + i * 18, "text-anchor": "middle", "font-size": 14, "font-weight": e.g === s.n - 1 ? "bold" : "normal"}, l)); } });
  svg.insertBefore(defs, svg.firstChild);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
