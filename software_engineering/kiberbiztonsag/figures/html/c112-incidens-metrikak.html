<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidensmetrikák kezdő- és végpontjai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--err:#c00000;--b1:#dddddd;--b2:#bbbbbb;--b3:#e8e8e8;--b4:#999999}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--err:#ff7070;--b1:#555;--b2:#666;--b3:#3a3a3a;--b4:#777}}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:max-content 1fr 6em;gap:4px 10px;align-items:center;max-width:760px}
input[type=range]{width:100%}
#status{margin:8px 0;min-height:3em;white-space:pre-line}
#warn{color:var(--err);font-weight:bold;min-height:1.4em}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
fieldset{border:1px solid var(--muted);margin:6px 0;padding:6px 10px}
</style></head><body>
<fieldset><legend>Időpontok (perc az első telemetriától)</legend><div class="ctl" id="pts"></div></fieldset>
<fieldset><legend>Célértékek</legend><div class="ctl" id="tgs"></div></fieldset>
<label><input type="checkbox" id="lab"> a 6.3 labor log_event-címkéi (T0–T5)</label>
<label style="margin-left:14px"><input type="checkbox" id="dec"> a kiesést a védő döntése okozza</label>
<div id="warn" aria-live="assertive"></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 330" role="img" aria-label="Négy sáv egy idővonalon: MTTD, elszigetelési, helyreállítási és leállási idő, a leállás tartalmazza a helyreállítást."></svg>
<p class="small">Elméleti minta, nem mérés; a mért értéket a saját telemetriából kell előállítani (hiányzó napló: „nem mérhető”). Célok a T-B12-025 szerint konzisztensen.</p>
<script>
const DATA = {"P": {"tel": 0, "alert": 15, "contain": 45, "out_attack": 10, "out_decision": 45, "restore": 1245}, "TARGET": {"mttd": 15, "contain": 30, "recover": 1200, "down": 1440}, "LAB": {"alert": "T0_detection_end", "contain": "T1_isolation_end", "restore": "T5_verification_end"}};
const PTS=[["alert","megerősített riasztás",0,240],["contain","elszigetelés megerősítése",0,360],["out_attack","kiesés (támadás okozta)",0,240],["out_decision","kiesés (védői döntés)",0,360],["restore","visszaállítás + ellenőrzés",60,2880]];
const TGS=[["mttd","MTTD cél",5,120],["contain","elszigetelés cél",5,240],["recover","helyreállítás cél",60,2880],["down","leállás cél (RTO)",60,4320]];
function fmt(m){m=Math.round(m);const h=Math.floor(m/60),mm=m%60;return h?(mm?`${h} ó ${mm} p`:`${h} ó`):`${mm} p`;}
function mk(host,arr,src){arr.forEach(([k,lab,lo,hi])=>{const l=document.createElement("label");l.textContent=lab;l.htmlFor="r_"+k+host;
 const r=document.createElement("input");r.type="range";r.min=lo;r.max=hi;r.step=5;r.value=src[k];r.id="r_"+k+host;r.dataset.k=k;
 const o=document.createElement("output");o.id="o_"+k+host;document.getElementById(host).append(l,r,o);r.addEventListener("input",draw);});}
mk("pts",PTS,DATA.P);mk("tgs",TGS,DATA.TARGET);
document.getElementById("lab").addEventListener("change",draw);document.getElementById("dec").addEventListener("change",draw);
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("v");
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function val(id){return +document.getElementById(id).value;}
function draw(){
 const p={tel:0},t={};PTS.forEach(([k])=>{p[k]=val("r_"+k+"pts");document.getElementById("o_"+k+"pts").textContent=fmt(p[k]);});
 TGS.forEach(([k])=>{t[k]=val("r_"+k+"tgs");document.getElementById("o_"+k+"tgs").textContent="≤ "+fmt(t[k]);});
 const dec=document.getElementById("dec").checked, out=dec?p.out_decision:p.out_attack;
 const alert=Math.max(p.alert,0), cont=Math.max(p.contain,alert), rest=Math.max(p.restore,cont);
 const M={mttd:[0,alert],contain:[alert,cont],recover:[cont,rest],down:[Math.min(out,cont),rest]};
 const xmax=Math.max(24*60,rest+60,Math.min(out,cont)+t.down+30), X=m=>170+m*(800/xmax);
 svg.innerHTML="";
 const pat=`<defs><pattern id="h1" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--fg")}" stroke-width="1"/></pattern><pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${css("--fg")}"/></pattern><pattern id="h3" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${css("--fg")}"/><line x1="0" y1="0" x2="7" y2="0" stroke="${css("--fg")}"/></pattern></defs>`;
 svg.insertAdjacentHTML("beforeend",pat);
 const rows=[["mttd","MTTD","--b1",""],["contain","Elszigetelés","--b2","h1"],["recover","Helyreállítás","--b3","h2"],["down","Leállás","--b4","h3"]];
 rows.forEach(([k,lab,c,h],i)=>{const y=40+i*56,[a,b]=M[k];
  el("text",{x:10,y:y+22,"font-size":16},lab);
  el("rect",{x:X(a),y:y,width:Math.max(1,X(b)-X(a)),height:32,fill:css(c),stroke:css("--fg")});
  if(h)el("rect",{x:X(a),y:y,width:Math.max(1,X(b)-X(a)),height:32,fill:`url(#${h})`,opacity:.55});
  const over=(b-a)>t[k];
  el("line",{x1:X(a+t[k]),x2:X(a+t[k]),y1:y-5,y2:y+37,stroke:css("--err"),"stroke-width":2,"stroke-dasharray":"4 3"});
  el("text",{x:Math.min(X(b)+6,940),y:y+22,"font-size":15,fill:over?css("--err"):css("--fg"),"font-weight":over?"bold":"normal"},`${fmt(b-a)} (cél ≤ ${fmt(t[k])})${over?" ✗":""}`);});
 el("line",{x1:170,x2:975,y1:275,y2:275,stroke:css("--fg")});
 const step=xmax>1800?360:(xmax>600?120:30);
 for(let m=0;m<=xmax;m+=step){el("line",{x1:X(m),x2:X(m),y1:271,y2:279,stroke:css("--fg")});el("text",{x:X(m),y:296,"font-size":13,"text-anchor":"middle"},fmt(m));}
 if(document.getElementById("lab").checked){[["alert","T0_detection_end"],["contain","T1_isolation_end"],["restore","T5_verification_end"]].forEach(([k,n],j)=>{
  const x=X(k==="alert"?alert:(k==="contain"?cont:rest));el("line",{x1:x,x2:x,y1:30,y2:275,stroke:css("--hl"),"stroke-dasharray":"2 3"});
  el("text",{x:x,y:22-0,"font-size":12,fill:css("--hl"),"text-anchor":j===0?"start":(j===1?"middle":"end")},n);});}
 const w=document.getElementById("warn");
 w.textContent = t.down < t.recover ? "Figyelem: a leállási cél kisebb a helyreállítási célnál – mivel a leállás tartalmazza a helyreállítást, a két cél egyszerre nem értelmes." : "";
 document.getElementById("status").textContent=`MTTD ${fmt(M.mttd[1]-M.mttd[0])}, elszigetelés ${fmt(M.contain[1]-M.contain[0])}, helyreállítás ${fmt(M.recover[1]-M.recover[0])}, leállás ${fmt(M.down[1]-M.down[0])} (kiesés: ${dec?"védői döntés":"támadás"}, ${fmt(Math.min(out,cont))}-kor). A leállás a kiesés és a visszaállítás+ellenőrzés közötti teljes időt méri, ezért ≥ helyreállítás.`;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
