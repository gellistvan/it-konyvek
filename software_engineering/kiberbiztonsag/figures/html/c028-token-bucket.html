<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token bucket lejátszó</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--bad:#b00020;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--bad:#ff8a9a;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
label{display:inline-flex;gap:6px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-x:auto}
pre span{display:block;padding:0 4px}
pre span.on{outline:2px solid var(--hl);font-weight:bold}
code{font:12.5px ui-monospace,monospace;background:var(--code);padding:0 3px}
.small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div role="region" aria-label="Token bucket: a vödör szintje, elfogadott és elutasított kérések, retry_after">

<div class="ctl">
  <button id="pa">A) FakeClock-teszt</button><button id="pb">B) labor</button><button id="rs">⏮ Visszaállítás</button>
</div>
<div class="ctl">
  <label>capacity <input id="cap" type="range" min="1" max="20" value="5"><b id="capv">5</b></label>
  <label>refill_rate (token/s) <input id="rate" type="range" min="0.1" max="5" step="0.1" value="3"><b id="ratev">3</b></label>
</div>
<div class="ctl">
  <button id="req">Kérés</button><button id="tick">Idő +1 s</button>
  <span id="now" class="small"></span>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 230" role="img" aria-label="A vödör szintje az idő és a kérések függvényében"></svg>
<pre id="code"></pre>

</div>
<p class="small">A fejezet TokenBucket-kódjának JS-átirata virtuális órával (FakeClock); elméleti modell, nem mérés. Alapállapot az A) teszt: 5 + 2 elutasított, majd 1 s után 3 + 1. A B) labor: 5×200, 5×429, Retry-After 5, 5 s után 200. A retry_after a labor math.ceil-es változata.</p>
<script>
const DATA = {"code": ["now = self.clock()", "elapsed = max(0.0, now - self.last_refill)", "self.tokens = min(self.capacity, self.tokens + elapsed * self.refill_rate)", "self.last_refill = now", "if self.tokens >= amount:", "    self.tokens -= amount; return True", "return False", "retry_after(): max(1, ceil((amount - self.tokens) / self.refill_rate))"]};

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const $ = id => document.getElementById(id);
const CODE = DATA.code;
$("code").innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
let S;   // állapot
function fmt(x){ return (Math.round(x * 100) / 100).toString().replace(".", ","); }
function reset(){
  S = {cap: +$("cap").value, rate: +$("rate").value, now: 0, tokens: +$("cap").value, last: 0, ev: [], slot: {}};
  $("capv").textContent = S.cap; $("ratev").textContent = fmt(S.rate);
  hl(-1); show("Új vödör: tokens = capacity = " + S.cap + ".");
}
function retry(){ return S.tokens >= 1 ? 0 : Math.max(1, Math.ceil((1 - S.tokens) / S.rate - 1e-9)); }
function consume(){
  const el = Math.max(0, S.now - S.last);
  S.tokens = Math.min(S.cap, S.tokens + el * S.rate); S.last = S.now;
  const k = S.slot[S.now] || 0; S.slot[S.now] = k + 1;
  const before = S.tokens;
  let ok = false;
  if (S.tokens >= 1 - 1e-9) { S.tokens -= 1; ok = true; }
  S.ev.push({x: S.now + k * 0.06, t: S.now, k: k, before: before, after: S.tokens, ok: ok});
  hl(ok ? 5 : 6);
  show((ok ? "200 – elfogadva" : "429 – elutasítva, Retry-After: " + retry()) + ". tokens = " + fmt(S.tokens) + ", retry_after() = " + retry() + ".");
}
function tick(){
  S.now += 1;
  hl(2);
  const lv = Math.min(S.cap, S.tokens + (S.now - S.last) * S.rate);
  show("Idő +1 s (FakeClock.advance): t = " + S.now + " s. A következő kérésnél tokens = min(capacity, tokens + elapsed · rate) = " + fmt(lv) + ".");
}
function hl(i){ document.querySelectorAll("#code span").forEach((s, j) => s.classList.toggle("on", j === i)); }
function show(msg){ $("status").textContent = msg; $("now").textContent = "t = " + S.now + " s, tokens (utolsó kérés után) = " + fmt(S.tokens); draw(); }
function draw(){
  const V = $("v"); V.innerHTML = "";
  const tmax = Math.max(2, S.now + 1), X = t => 50 + t / tmax * 640, Y = v => 170 - v / S.cap * 140;
  mk(V, "line", {x1: 50, y1: Y(S.cap), x2: 690, y2: Y(S.cap), stroke: cv("--muted"), "stroke-dasharray": "6 4"});
  mk(V, "text", {x: 690, y: Y(S.cap) - 5, "text-anchor": "end", "font-size": 12}, "capacity = " + S.cap);
  mk(V, "line", {x1: 50, y1: 170, x2: 690, y2: 170, stroke: cv("--line")});
  mk(V, "line", {x1: 50, y1: 20, x2: 50, y2: 170, stroke: cv("--line")});
  for (let t = 0; t <= tmax; t++) mk(V, "text", {x: X(t), y: 186, "text-anchor": "middle", "font-size": 11}, t + " s");
  // szintgörbe: valós idejű visszatöltés a kapacitásig; a burst lépcsői vizuálisan széthúzva
  const pts = [[0, S.cap]];
  let xe = 0, te = 0, le = S.cap;
  const seg = (x1, t1) => {   // visszatöltés (xe, te, le) → (x1, t1)
    if (t1 <= te) return;
    const tf = te + (S.cap - le) / S.rate;
    if (le < S.cap && tf < t1) pts.push([xe + (x1 - xe) * (tf - te) / (t1 - te), S.cap]);
    pts.push([x1, Math.min(S.cap, le + (t1 - te) * S.rate)]);
  };
  S.ev.forEach(e => {
    if (e.k === 0) seg(e.x, e.t); else pts.push([e.x, pts[pts.length - 1][1]]);
    pts.push([e.x, e.after]); xe = e.x; te = e.t; le = e.after;
  });
  if (S.now > te) seg(S.now, S.now);
  mk(V, "polyline", {points: pts.map(([x, y]) => X(x) + "," + Y(y)).join(" "), fill: "none", stroke: cv("--hl"), "stroke-width": 2.5});
  S.ev.forEach(({x, ok}) => {
    if (ok) mk(V, "circle", {cx: X(x), cy: 210, r: 5, fill: cv("--fg")});
    else { mk(V, "line", {x1: X(x) - 5, y1: 205, x2: X(x) + 5, y2: 215, stroke: cv("--fg"), "stroke-width": 2}); mk(V, "line", {x1: X(x) - 5, y1: 215, x2: X(x) + 5, y2: 205, stroke: cv("--fg"), "stroke-width": 2}); }
  });
  mk(V, "text", {x: 6, y: 214, "font-size": 11}, "kérés");
  mk(V, "text", {x: 6, y: 30, "font-size": 11}, "tokens");
}
function preset(cap, rate, script, label){
  $("cap").value = cap; $("rate").value = rate; reset();
  let n = 0;
  for (const [t, k] of script) { while (S.now < t) tick(); for (let i = 0; i < k; i++) { consume(); n++; } }
  const ok = S.ev.filter(e => e.ok).length;
  show(label + ": " + ok + " elfogadva, " + (S.ev.length - ok) + " elutasítva; tokens = " + fmt(S.tokens) + ", retry_after() = " + retry() + ".");
}
$("pa").onclick = () => preset(5, 3, [[0, 7], [1, 4]], "A) t=0: 7 kérés, t=1 s: 4 kérés");
$("pb").onclick = () => preset(5, 0.2, [[0, 10]], "B) 10 gyors kérés (Retry-After a burst után: 5); utána 5× Idő +1 s és Kérés → 200");
$("rs").onclick = reset;
$("cap").oninput = reset; $("rate").oninput = reset;
$("req").onclick = consume; $("tick").onclick = tick;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
preset(5, 3, [[0, 7], [1, 4]], "A) t=0: 7 kérés, t=1 s: 4 kérés");

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
