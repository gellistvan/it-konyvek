<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nonce-újrahasználat CTR/GCM módban</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
 input[type=text]{width:13em;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lépések">
 <button id="prev" type="button">◀ Lépés</button><button id="next" type="button">Lépés ▶</button>
 <input id="st" type="range" min="0" max="5" value="5" aria-label="Lépés"><span id="cnt" class="small"></span>
</div>
<div class="ctl" role="group" aria-label="Bemenetek">
 <label>P1 <input type="text" id="p1" value="UTALAS 1000 EUR" maxlength="24"></label>
 <label>P2 <input type="text" id="p2" value="UTALAS 9999 EUR" maxlength="24"></label>
 <label><input type="radio" name="nm" id="same" checked> azonos nonce</label>
 <label><input type="radio" name="nm" id="uniq"> egyedi nonce</label>
 <button id="newks" type="button">Új játék-kulcsfolyam</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 470" role="img" aria-label="Bájtcellák soronként: P1, kulcsfolyam, C1, P2, kulcsfolyam, C2, C1 XOR C2 és a visszanyert P2."></svg>
<p class="small">Játék-kulcsfolyam: a lap állítja elő (alapból rögzített), nem AES és nem valódi kulcs; valós rendszerhez nem kapcsolódik. Csak az ASCII 32–126 karakterek kerülnek a cellákba (24 bájtig).</p>
<script>
let KSA = [44, 76, 83, 175, 81, 160, 215, 67, 151, 115, 229, 40, 224, 244, 43, 1, 55, 140, 217, 102, 166, 142, 157, 213, 102, 183, 126, 67, 241, 121, 177, 252], KSB = [190, 219, 249, 130, 236, 44, 137, 147, 186, 71, 201, 88, 116, 46, 205, 45, 244, 237, 135, 93, 187, 84, 141, 73, 74, 140, 214, 15, 29, 0, 178, 139];
const svg=document.getElementById("v"), st=document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(t,a,txt){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function bytes(s){return Array.from(s).map(c=>c.charCodeAt(0)).filter(x=>x>=32&&x<127).slice(0,24);}
function xor(a,b){const n=Math.min(a.length,b.length),r=[];for(let i=0;i<n;i++)r.push(a[i]^b[i]);return r;}
function h2(x){return x.toString(16).padStart(2,"0");}
const NAMES=["Nyílt szövegek","Kulcsfolyam","C1 = P1 ⊕ KS","C2 = P2 ⊕ KS","C1 ⊕ C2","P2 visszanyerése"];
function draw(){
 const k=+document.getElementById("st").value, same=document.getElementById("same").checked;
 const p1=bytes(document.getElementById("p1").value), p2=bytes(document.getElementById("p2").value);
 const ks1=KSA.slice(0,24), ks2=same?KSA.slice(0,24):KSB.slice(0,24);
 const c1=xor(p1,ks1), c2=xor(p2,ks2), d=xor(c1,c2), rec=xor(d,p1), n=Math.max(p1.length,p2.length,1);
 document.getElementById("cnt").textContent=(k+1)+"/6 – "+NAMES[k];
 const rows=[["P1 (ASCII)",p1,"a"],[same?"KS":"KS1",ks1.slice(0,p1.length),"k",1],["C1 = P1 ⊕ "+(same?"KS":"KS1"),c1,"h",2],
  ["P2 (ASCII)",p2,"a"],[same?"KS":"KS2",ks2.slice(0,p2.length),"k",1],["C2 = P2 ⊕ "+(same?"KS":"KS2"),c2,"h",3],
  ["C1 ⊕ C2",d,"z",4],["C1 ⊕ C2 ⊕ P1",rec,same?"a":"h",5]];
 svg.innerHTML="";
 const fg=css("--fg"), cw=Math.min(52,(1000-200)/n), chh=44, x0=195;
 const defs=mk("defs",{}); defs.innerHTML=`<pattern id="hk" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="0.8"/></pattern><pattern id="hz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="6" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
 for(let i=0;i<n;i++)mk("text",{x:x0+i*cw+cw/2,y:20,"text-anchor":"middle","font-size":15,fill:css("--muted")},String(i));
 let y=28;
 rows.forEach(r=>{ if((r[3]||0)>k){y+=chh+8;return;}
  mk("text",{x:x0-8,y:y+chh/2+6,"text-anchor":"end","font-size":18},r[0]);
  r[1].forEach((b,i)=>{const z=r[2]==="z"&&b===0;
   mk("rect",{x:x0+i*cw,y:y,width:cw,height:chh,fill:z?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":1});
   if(r[2]==="k"||z)mk("rect",{x:x0+i*cw,y:y,width:cw,height:chh,fill:r[2]==="k"?"url(#hk)":"url(#hz)",opacity:0.45});
   let t=r[2]==="a"?String.fromCharCode(b):h2(b); if(r[2]==="a"&&b===32)t="␣"; if(r[2]==="a"&&(b<32||b>126))t="·";
   mk("text",{x:x0+i*cw+cw/2,y:y+chh/2+6,"text-anchor":"middle","font-size":Math.min(20,cw*0.42),"font-family":"ui-monospace,monospace","font-weight":z?"bold":"normal"},t);});
  y+=chh+8;});
 const z=d.filter(x=>x===0).length, okrec=rec.length&&rec.every((x,i)=>x===p2[i]);
 const msgs=["A két üzenet: P1 és P2 (bájtonként, ASCII).",
  same?"Azonos (K, nonce): ugyanaz a KS kulcsfolyam mindkét üzenethez.":"Egyedi nonce: két különböző kulcsfolyam, KS1 ≠ KS2.",
  "C1 = P1 ⊕ "+(same?"KS":"KS1")+" (bájtonkénti XOR).","C2 = P2 ⊕ "+(same?"KS":"KS2")+".",
  same?`C1 ⊕ C2 = P1 ⊕ P2: a kulcsfolyam kiesik; ${z} bájt 00 – ott a két nyílt szöveg azonos.`:`C1 ⊕ C2 véletlennek látszik (${z} db 00 bájt); nem egyenlő P1 ⊕ P2-vel.`,
  same?(okrec?"Ismert P1-ből: C1 ⊕ C2 ⊕ P1 = P2 – a második üzenet felfedve. GCM-ben ráadásul a GHASH-kulcsra is lehet következtetni.":"A visszanyerés a rövidebb üzenet hosszáig működik."):"C1 ⊕ C2 ⊕ P1 nem adja vissza P2-t: egyedi nonce mellett az ismert P1 nem segít."];
 st.textContent=msgs[k];
}
const sEl=document.getElementById("st");
document.getElementById("prev").onclick=()=>{sEl.value=Math.max(0,+sEl.value-1);draw();};
document.getElementById("next").onclick=()=>{sEl.value=Math.min(5,+sEl.value+1);draw();};
sEl.addEventListener("input",draw);
["p1","p2"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
["same","uniq"].forEach(id=>document.getElementById(id).addEventListener("change",draw));
document.getElementById("newks").onclick=()=>{const a=new Uint8Array(32),b=new Uint8Array(32);crypto.getRandomValues(a);crypto.getRandomValues(b);KSA=Array.from(a);KSB=Array.from(b);draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
