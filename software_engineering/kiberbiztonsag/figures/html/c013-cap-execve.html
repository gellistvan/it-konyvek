<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability-halmazok execve után</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#999;--code:#f3f3f3;--ok:#1e6b2e;--err:#b00000}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#666;--code:#2a2a2a;--ok:#7fd08f;--err:#ff8080}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
button{font:inherit;padding:3px 10px;cursor:pointer}
table{border-collapse:collapse;margin:4px 0 8px}
th,td{border:1px solid var(--line);padding:2px 6px;text-align:center}
th.grp{font-weight:bold;font-style:italic}
td.cap{text-align:left;font-family:ui-monospace,monospace}
td.out{font-size:18px;min-width:2em}
td.on{color:var(--fg)} td.off{color:var(--muted)}
#status{min-height:2.6em;margin:6px 0}
.rules{background:var(--code);padding:6px 8px;font:13px/1.6 ui-monospace,monospace}
.rules span.on{outline:2px solid var(--hl2);font-weight:bold}
.small{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="ctl" role="group" aria-label="Forgatókönyvek">
 <span>Forgatókönyv:</span>
 <button onclick="preset('a')">(a) nem root, csak bounding</button>
 <button onclick="preset('b')">(b) + setcap +ep</button>
 <button onclick="preset('c')">(c) setuid root</button>
</div>
<div class="ctl">
 <label>UID: <select id="uid" onchange="calc()"><option value="10001">10001 (nem root)</option><option value="0">0 (root)</option></select></label>
 <label><input type="checkbox" id="suid" onchange="calc()"> setuid root bit a fájlon</label>
 <label><input type="checkbox" id="fe" onchange="calc()"> fájl effective bit (F(E))</label>
</div>
<table id="t" aria-label="Halmazok: jelölőnégyzetek a bemenetekhez, ■/□ az eredményhez"></table>
<div id="status" aria-live="polite"></div>
<div class="rules" id="rules"></div>
<p class="small">capabilities(7) szerinti modell három szemléltető képességgel; a setuid root a no_new_privs (allowPrivilegeEscalation: false) nélkül érvényes. Nem futtatott kernel-kísérlet.</p>
<script>
const CAPS = ["NET_BIND_SERVICE", "CHOWN", "SYS_ADMIN"], SETS = ["I","P","E","A","B"], PRESETS = {"a": {"proc": {"I": [], "P": [], "E": [], "A": [], "B": ["NET_BIND_SERVICE"]}, "fcap": {"P": [], "I": [], "E": false}, "uid": 10001, "suid": false, "expectE": []}, "b": {"proc": {"I": [], "P": [], "E": [], "A": [], "B": ["NET_BIND_SERVICE"]}, "fcap": {"P": ["NET_BIND_SERVICE"], "I": [], "E": true}, "uid": 10001, "suid": false, "expectE": ["NET_BIND_SERVICE"]}, "c": {"proc": {"I": [], "P": [], "E": [], "A": [], "B": ["CHOWN", "NET_BIND_SERVICE"]}, "fcap": {"P": [], "I": [], "E": false}, "uid": 10001, "suid": true, "expectE": ["CHOWN", "NET_BIND_SERVICE"]}};
const NAME = {I:"inheritable",P:"permitted",E:"effective",A:"ambient",B:"bounding"};
const t = document.getElementById("t");
let h = '<tr><th rowspan="2">képesség</th><th class="grp" colspan="5">folyamat (előtte)</th><th class="grp" colspan="2">fájl</th><th class="grp" colspan="5">execve után</th></tr><tr>';
SETS.forEach(s => h += `<th title="${NAME[s]}">${s}</th>`); h += '<th>F(P)</th><th>F(I)</th>';
SETS.forEach(s => h += `<th title="${NAME[s]}">${s}′</th>`); h += '</tr>';
CAPS.forEach((c, i) => {
  h += `<tr><td class="cap">${c}</td>`;
  SETS.forEach(s => h += `<td><input type="checkbox" id="p${s}${i}" aria-label="folyamat ${NAME[s]} ${c}" onchange="calc()"></td>`);
  h += `<td><input type="checkbox" id="fP${i}" aria-label="fájl permitted ${c}" onchange="calc()"></td>`;
  h += `<td><input type="checkbox" id="fI${i}" aria-label="fájl inheritable ${c}" onchange="calc()"></td>`;
  SETS.forEach(s => h += `<td class="out" id="n${s}${i}"></td>`);
  h += '</tr>';
});
t.innerHTML = h;
const RULES = [
  ["amb", "P′(A) = privilegizált fájl ? ∅ : P(A)"],
  ["t1", "(P(I) ∩ F(I))"], ["t2", "(F(P) ∩ P(B))"], ["t3", "P′(A)"],
  ["eff", "P′(E) = F(E) ? P′(P) : P′(A)"]];
function S(prefix, s){ const out = new Set(); CAPS.forEach((c, i) => { if (document.getElementById(prefix + s + i).checked) out.add(c); }); return out; }
function inter(a, b){ return new Set([...a].filter(x => b.has(x))); }
function uni(...xs){ const o = new Set(); xs.forEach(x => x.forEach(y => o.add(y))); return o; }
function fmt(s){ return s.size ? "{" + CAPS.filter(c => s.has(c)).join(", ") + "}" : "∅"; }
function execve(p, FP, FI, FE, uid, suid){
  const euid = suid ? 0 : uid, priv = FP.size > 0 || FI.size > 0 || FE || suid, root = euid === 0 || uid === 0;
  if (root) { FP = new Set(CAPS); FI = new Set(CAPS); FE = true; }
  const A2 = priv ? new Set() : new Set(p.A), t1 = inter(p.I, FI), t2 = inter(FP, p.B);
  const P2 = uni(t1, t2, A2), E2 = FE ? new Set(P2) : new Set(A2);
  return {n: {I: new Set(p.I), P: P2, E: E2, A: A2, B: new Set(p.B)}, t1, t2, A2, FE, priv, root};
}
function calc(){
  const p = {}; SETS.forEach(s => p[s] = S("p", s));
  const r = execve(p, S("f", "P"), S("f", "I"), document.getElementById("fe").checked, +document.getElementById("uid").value, document.getElementById("suid").checked);
  SETS.forEach(s => CAPS.forEach((c, i) => { const td = document.getElementById("n" + s + i), on = r.n[s].has(c); td.textContent = on ? "■" : "□"; td.className = "out " + (on ? "on" : "off"); }));
  const act = {amb: r.priv && p.A.size > 0, t1: r.t1.size > 0, t2: r.t2.size > 0, t3: r.A2.size > 0, eff: r.FE};
  document.getElementById("rules").innerHTML =
    `<div><span class="${act.amb ? "on" : ""}">${RULES[0][1]}</span></div>` +
    `<div>P′(P) = <span class="${act.t1 ? "on" : ""}">${RULES[1][1]}</span> ∪ <span class="${act.t2 ? "on" : ""}">${RULES[2][1]}</span> ∪ <span class="${act.t3 ? "on" : ""}">${RULES[3][1]}</span></div>` +
    `<div><span class="${act.eff ? "on" : ""}">${RULES[4][1]}</span>;  P′(I) = P(I);  P′(B) = P(B)</div>` +
    (r.root ? "<div>root (euid 0): F(P) = F(I) = minden, F(E) = 1</div>" : "");
  document.getElementById("status").textContent = `Új effective: E′ = ${fmt(r.n.E)}; permitted: P′ = ${fmt(r.n.P)}; ambient: A′ = ${fmt(r.n.A)}.` +
    (r.n.E.size === 0 ? " A folyamat nem kap aktív képességet." : "");
  return r;
}
function preset(key){
  const s = PRESETS[key];
  SETS.forEach(x => CAPS.forEach((c, i) => document.getElementById("p" + x + i).checked = s.proc[x].includes(c)));
  CAPS.forEach((c, i) => { document.getElementById("fP" + i).checked = s.fcap.P.includes(c); document.getElementById("fI" + i).checked = s.fcap.I.includes(c); });
  document.getElementById("fe").checked = s.fcap.E; document.getElementById("uid").value = String(s.uid); document.getElementById("suid").checked = s.suid;
  const r = calc();
  if (fmt(r.n.E) !== fmt(new Set(s.expectE))) console.error("eltérés a Python-számítástól:", key);
}
preset("a");
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
