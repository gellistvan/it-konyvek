<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECB blokk-átrendezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
 input[type=text]{width:9em;font-family:ui-monospace,monospace}</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lépések">
 <button id="prev" type="button">◀ Lépés</button><button id="next" type="button">Lépés ▶</button>
 <input id="st" type="range" min="0" max="5" value="5" aria-label="Lépés"><span id="cnt" class="small"></span>
</div>
<div class="ctl" role="group" aria-label="Bemenetek">
 <label>felhasználónév <input type="text" id="user" value="alice" maxlength="20" spellcheck="false"></label>
 <label><input type="checkbox" id="tgt" checked> célblokk elérhető (2. előfeltétel)</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 450" role="img" aria-label="A cookie-k 16 bájtos blokkjai, a szimbolikus ECB-rejtjelblokkok, a hamisított cookie és az AEAD-változat."></svg>
<p class="small">Szimbolikus rejtjelblokkok (az azonos plaintext-blokk azonos azonosítót kap), kulcs és valódi titkosítás nélkül. A felhasználónév mező a blokkhatárok eltolódását mutatja.</p>
<script>
const svg=document.getElementById("v"), st=document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(t,a,txt){const e=document.createElementNS("http://www.w3.org/2000/svg",t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function enc(s){return Array.from(new TextEncoder().encode(s));}
function pkcs7(b){const k=16-b.length%16;return b.concat(new Array(k).fill(k));}
function blocks(b){const r=[];for(let i=0;i<b.length;i+=16)r.push(b.slice(i,i+16));return r;}
function key(b){return b.join(",");}
const NAMES=["Cookie-k","Blokkosítás","Célblokk","Csere","Visszafejtés","AEAD"];
function draw(){
 let k=+document.getElementById("st").value; const tgt=document.getElementById("tgt").checked;
 const user=document.getElementById("user").value.replace(/["\\]/g,"");
 if(!tgt&&k>2){k=2;document.getElementById("st").value=2;}
 const A=pkcs7(enc('{"user":"'+user+'","role":"user"}')), X=pkcs7(enc('{"user":"bob01","role":"admin"}'));
 const BA=blocks(A), BX=blocks(X), ids={};
 function cid(b,name){const kk=key(b); if(!ids[kk])ids[kk]=name; return ids[kk];}
 const CA=BA.map((b,i)=>cid(b,"C_A"+(i+1))), CX=BX.map((b,i)=>cid(b,"C_X"+(i+1)));
 const forgedB=[BA[0],BX[1]], forged=[].concat(...forgedB), padn=forged[forged.length-1];
 const plain=new TextDecoder().decode(new Uint8Array(forged.slice(0,forged.length-padn)));
 let okjson=false; try{const o=JSON.parse(plain); okjson=o.role==="admin";}catch(e){}
 document.getElementById("cnt").textContent=(k+1)+"/6 – "+NAMES[k];
 svg.innerHTML="";
 const fg=css("--fg"), x0=170, maxc=Math.max(A.length,X.length,32), cw=Math.min(25,820/maxc), ch=30;
 const defs=mk("defs",{}); defs.innerHTML=`<pattern id="pd" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${fg}"/></pattern><pattern id="ph" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/></pattern>`;
 function lab(y,s){s.split("\n").forEach((l,i)=>mk("text",{x:8,y:y+ch/2+5+(i-(s.split("\n").length-1)/2)*17,"font-size":15},l));}
 function bytesRow(y,b,showB){b.forEach((v,i)=>{const p=v<32;
   mk("rect",{x:x0+i*cw,y:y,width:cw,height:ch,fill:css("--cell"),stroke:css("--muted"),"stroke-width":0.6});
   if(p)mk("rect",{x:x0+i*cw,y:y,width:cw,height:ch,fill:"url(#pd)",opacity:0.5});
   mk("text",{x:x0+i*cw+cw/2,y:y+ch/2+5,"text-anchor":"middle","font-size":Math.min(15,cw*0.62),"font-family":"ui-monospace,monospace","font-weight":p?"bold":"normal"},p?v.toString(16).padStart(2,"0"):String.fromCharCode(v));});
  if(showB)for(let j=0;j<=b.length/16;j++)mk("line",{x1:x0+16*j*cw,y1:y-3,x2:x0+16*j*cw,y2:y+ch+3,stroke:fg,"stroke-width":3});}
 function cRow(y,names,hlIdx,hatchIdx){names.forEach((n,i)=>{
   mk("rect",{x:x0+16*i*cw,y:y,width:16*cw,height:ch,fill:css("--cellhl"),stroke:i===hlIdx?css("--hl"):fg,"stroke-width":i===hlIdx?3.5:1.6});
   if(i===hatchIdx)mk("rect",{x:x0+16*i*cw,y:y,width:16*cw,height:ch,fill:"url(#ph)",opacity:0.45});
   mk("rect",{x:x0+16*i*cw+8*cw-34,y:y+5,width:68,height:ch-10,fill:css("--bg"),opacity:0.9});
   mk("text",{x:x0+16*i*cw+8*cw,y:y+ch/2+5,"text-anchor":"middle","font-size":15,"font-weight":"bold"},n);});}
 let y=20;
 lab(y,"cookie (te)"); bytesRow(y,A,k>=1); y+=ch+6;
 if(k>=1){lab(y,"ECB"); cRow(y,CA,-1,-1);} y+=ch+18;
 lab(y,"admin cookie"); bytesRow(y,X,k>=1); y+=ch+6;
 if(k>=1){lab(y,"ECB"); cRow(y,CX,k===2&&tgt?1:-1,tgt?1:-1);} y+=ch+24;
 if(k>=3){lab(y,"hamisított"); cRow(y,[CA[0],CX[1]],k===3?1:-1,1);} y+=ch+10;
 if(k>=4){lab(y,"visszafejtve"); bytesRow(y,forged,true); y+=ch+22;
   mk("text",{x:x0,y:y,"font-size":15,"font-weight":"bold"},(okjson?"✓ ":"✗ ")+plain+(okjson?"  (ECB: elfogadva)":"  – érvénytelen JSON: az igazítás (1) nem teljesül"));}
 y+=24;
 if(k>=5){lab(y,"AEAD"); cRow(y,["blokk A1","blokk X2"],-1,-1); y+=ch+22;
   mk("text",{x:x0,y:y,"font-size":15,"font-weight":"bold"},"✗ ugyanaz a csere: InvalidTag – a cookie elutasítva");}
 const same=CA.filter(c=>CX.includes(c)).length;
 const aligned=BA[0].length===16&&enc('{"user":"'+user+'",').length===16;
 const msgs=["Két cookie: a saját (\""+user+"\") és egy admin szerepkörű cookie, amelynek 2. blokkja \"role\":\"admin\"} + 0x01.",
  "Blokkosítás 16 bájtonként, PKCS#7-padding a végén. ECB: azonos plaintext-blokk → azonos rejtjelblokk ("+same+" közös blokk)."+(aligned?" Az 1. blokk pontosan a \"user\" mezővel zárul (igazítás teljesül).":" A felhasználónév hossza eltolja a blokkhatárt: az igazítás (1) nem teljesül."),
  tgt?"(2) A célblokk elérhető: C_X2 = E(\"role\":\"admin\"} 0x01).":"A célblokk nem érhető el: a támadó csak a blokkazonosságot látja (azonos vagy eltérő blokkok) – ez információszivárgás, de nem jogosultságszerzés. A lejátszás itt megáll.",
  "(3) Csere: C_A1 ‖ C_X2 – a kulcs ismerete nélkül, mert az ECB blokkonként független.",
  "Visszafejtés: "+(okjson?"{\"user\":\""+user+"\",\"role\":\"admin\"}, a padding egy 0x01 bájt – ha a szerver nem ellenőrzi az integritást, elfogadja.":"a kapott szöveg nem érvényes cookie, mert az igazítás nem teljesül."),
  "AEAD (AES-GCM): a címke a teljes cookie-ra vonatkozik, ezért ugyanaz a csere InvalidTag kivételt ad, a szerver elutasítja."];
 st.textContent=msgs[k];
}
const sEl=document.getElementById("st");
document.getElementById("prev").onclick=()=>{sEl.value=Math.max(0,+sEl.value-1);draw();};
document.getElementById("next").onclick=()=>{sEl.value=Math.min(5,+sEl.value+1);draw();};
sEl.addEventListener("input",draw);
document.getElementById("user").addEventListener("input",draw);
document.getElementById("tgt").addEventListener("change",()=>{if(document.getElementById("tgt").checked&&+sEl.value===2)sEl.value=5;draw();});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
