<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kockázati mátrix – KR-01–KR-05</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--line:#000;--b0:#fff;--b1:#f0f0f0;--b2:#dcdcdc;--b3:#bdbdbd;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--line:#ddd;--b0:#262626;--b1:#333;--b2:#454545;--b3:#5c5c5c;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;max-width:640px;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
svg text.inv{fill:var(--bg)}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
[tabindex]:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Nézet">
 <label>Nézet: <select id="view"><option value="both">mindkettő</option><option value="o">eredeti</option><option value="r">maradvány</option></select></label>
 <label><input type="checkbox" id="relabel"> I-címkék 1, 2, 3, 4, 10 (sorrendtartó átcímkézés)</label>
</div>
<div class="ctl" role="group" aria-label="Sávhatárok">
 <label>Közepes ≥ <input type="range" id="t1" min="2" max="24" value="5"><span id="v1"></span></label>
 <label>Magas ≥ <input type="range" id="t2" min="3" max="49" value="10"><span id="v2"></span></label>
 <label>Kritikus ≥ <input type="range" id="t3" min="4" max="50" value="17"><span id="v3"></span></label>
 <button id="strict" type="button">Szigorú szervezet (kritikus ≥ 10)</button>
 <button id="reset" type="button">Alapértelmezés</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 560" role="img" aria-label="5×5 kockázati mátrix, sor = L, oszlop = I, cellában R = L × I; a KR-01–KR-05 eredeti és maradvány pozíciója nyíllal összekötve."></svg>
<table id="rank" aria-label="A regiszter tételei R szerint"></table>
<p class="small">Cella fölé húzva vagy Tab-bal kijelölve: L, I, R és sáv. Teli kör = eredeti, üres kör = maradvány (kezelés után). Az I = 5 oszlop vastag kerete a kötelező eszkalációt jelzi. A sávhatár helyi szabály, nem univerzális.</p>
<script>
const DATA = {"items": [{"id": "KR-01", "name": "Jelszavas bejelentkezés elleni támadások (brute force, jelszópermetezés, credential stuffing)", "L": 3, "I": 4, "rL": 2, "rI": 4}, {"id": "KR-02", "name": "SQL injection a profil lekérdezésben", "L": 2, "I": 5, "rL": 1, "rI": 5}, {"id": "KR-03", "name": "Nyilvános S3 bucket", "L": 4, "I": 5, "rL": 1, "rI": 5}, {"id": "KR-04", "name": "IDOR az admin API-n", "L": 2, "I": 4, "rL": 1, "rI": 4}, {"id": "KR-05", "name": "Jelszó vagy token naplóba kerül", "L": 4, "I": 3, "rL": 2, "rI": 3}], "bands": [1, 5, 10, 17], "names": ["Alacsony", "Közepes", "Magas", "Kritikus"]};
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v"), st=document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;p.appendChild(e);return e;}
const t1=document.getElementById("t1"),t2=document.getElementById("t2"),t3=document.getElementById("t3");
const view=document.getElementById("view"), rel=document.getElementById("relabel");
function lab(i){return rel.checked && i===5 ? 10 : i;}
function bandIdx(r){const b=[1,+t1.value,+t2.value,+t3.value];let k=0;for(let j=0;j<4;j++)if(r>=b[j])k=j;return k;}
function draw(){
  if(+t2.value<=+t1.value)t2.value=+t1.value+1; if(+t3.value<=+t2.value)t3.value=+t2.value+1;
  document.getElementById("v1").textContent=t1.value;document.getElementById("v2").textContent=t2.value;document.getElementById("v3").textContent=t3.value;
  svg.innerHTML="";
  const fg=css("--fg"), defs=mk(svg,"defs",{});
  defs.innerHTML=`<pattern id="pd" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1" fill="${fg}"/></pattern>`+
   `<pattern id="ph" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/></pattern>`+
   `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`+
   `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`;
  const C=88, X0=70, Y0=30, fills=["--b0","--b1","--b2","--b3"], pats=["","url(#pd)","url(#ph)","url(#px)"];
  const cnt=[0,0,0,0];
  for(let L=1;L<=5;L++)for(let I=1;I<=5;I++){
    const r=L*lab(I), k=bandIdx(r); cnt[k]++;
    const x=X0+(I-1)*C, y=Y0+(5-L)*C;
    const g=mk(svg,"g",{tabindex:0,role:"img","aria-label":`L=${L}, I=${lab(I)}, R=${r}, ${DATA.names[k]}`});
    mk(g,"rect",{x:x,y:y,width:C,height:C,fill:css(fills[k]),stroke:css("--line"),"stroke-width":1});
    if(pats[k])mk(g,"rect",{x:x,y:y,width:C,height:C,fill:pats[k],opacity:0.5});
    mk(g,"rect",{x:x+C/2-17,y:y+6,width:34,height:22,fill:css("--bg"),opacity:0.92});
    mk(g,"text",{x:x+C/2,y:y+23,"text-anchor":"middle","font-size":17,"font-weight":"bold"},String(r));
    const info=()=>{st.textContent=`L = ${L}, I = ${lab(I)}${rel.checked&&I===5?" (eredeti címke: 5)":""}, R = ${r} – ${DATA.names[k]}`;};
    g.addEventListener("mouseenter",info); g.addEventListener("focus",info);
  }
  mk(svg,"rect",{x:X0+4*C,y:Y0,width:C,height:5*C,fill:"none",stroke:css("--line"),"stroke-width":4});
  mk(svg,"text",{x:X0+4.5*C,y:Y0-8,"text-anchor":"middle","font-size":13},"I = 5: kötelező eszkaláció");
  for(let k=1;k<=5;k++){mk(svg,"text",{x:X0+(k-0.5)*C,y:Y0+5*C+20,"text-anchor":"middle","font-size":15},String(lab(k)));
    mk(svg,"text",{x:X0-12,y:Y0+(5-k+0.5)*C+5,"text-anchor":"end","font-size":15},String(k));}
  mk(svg,"text",{x:X0+2.5*C,y:Y0+5*C+42,"text-anchor":"middle","font-size":15},"I (hatás)");
  mk(svg,"text",{x:18,y:Y0+2.5*C,"text-anchor":"middle","font-size":15,transform:`rotate(-90 18 ${Y0+2.5*C})`},"L (valószínűség)");
  // jelölők
  const occ={}, P={};
  function slot(L,I){const key=L+","+I, n=occ[key]||0; occ[key]=n+1; return [X0+(I-1+(n===0?0.28:0.72))*C, Y0+(5-L+0.64)*C];}
  DATA.items.forEach(d=>P[d.id+"o"]=slot(d.L,d.I)); DATA.items.forEach(d=>P[d.id+"r"]=slot(d.rL,d.rI));
  const v=view.value;
  if(v==="both")DATA.items.forEach(d=>{const a=P[d.id+"o"],b=P[d.id+"r"],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;
     mk(svg,"line",{x1:a[0]+dx/l*14,y1:a[1]+dy/l*14,x2:b[0]-dx/l*15,y2:b[1]-dy/l*15,stroke:fg,"stroke-width":1.6,"marker-end":"url(#ar)"});});
  DATA.items.forEach(d=>{const n=d.id.slice(-1);
    if(v!=="r"){const p=P[d.id+"o"];mk(svg,"circle",{cx:p[0],cy:p[1],r:13,fill:fg,stroke:fg});mk(svg,"text",{x:p[0],y:p[1]+5,"text-anchor":"middle","font-size":14,"font-weight":"bold",class:"inv"},n);}
    if(v!=="o"){const p=P[d.id+"r"];mk(svg,"circle",{cx:p[0],cy:p[1],r:13,fill:css("--bg"),stroke:fg,"stroke-width":2});mk(svg,"text",{x:p[0],y:p[1]+5,"text-anchor":"middle","font-size":14,"font-weight":"bold"},n);}
  });
  // rangsor
  const rows=DATA.items.map(d=>({id:d.id,name:d.name,o:d.L*lab(d.I),r:d.rL*lab(d.rI),L:d.L,I:d.I,rL:d.rL,rI:d.rI}));
  const key=v==="r"?"r":"o"; rows.sort((a,b)=>b[key]-a[key]||a.id.localeCompare(b.id));
  let h="<tr><th>Tétel</th><th>Eredeti (L×I = R, sáv)</th><th>Maradvány (L×I = R, sáv)</th></tr>";
  rows.forEach(x=>{h+=`<tr><td>${x.id} – ${x.name}</td><td>${x.L}×${lab(x.I)} = ${x.o}, ${DATA.names[bandIdx(x.o)]}</td><td>${x.rL}×${lab(x.rI)} = ${x.r}, ${DATA.names[bandIdx(x.r)]}</td></tr>`;});
  document.getElementById("rank").innerHTML=h;
  const ko=DATA.items.filter(d=>bandIdx(d.L*lab(d.I))===3).map(d=>d.id), kr=DATA.items.filter(d=>bandIdx(d.rL*lab(d.rI))===3).map(d=>d.id);
  st.textContent=`Sávok: alacsony < ${t1.value} ≤ közepes < ${t2.value} ≤ magas < ${t3.value} ≤ kritikus. Kritikus eredeti tétel: ${ko.join(", ")||"nincs"}; kritikus maradvány: ${kr.join(", ")||"nincs"}.`+(rel.checked?" Átcímkézve: az I = 5 oszlop címkéje 10, a táblázat sorrendje ehhez igazodik.":"");
}
[t1,t2,t3].forEach(e=>e.addEventListener("input",draw)); view.addEventListener("change",draw); rel.addEventListener("change",draw);
document.getElementById("strict").onclick=()=>{t1.value=5;t2.value=8;t3.value=10;draw();};
document.getElementById("reset").onclick=()=>{t1.value=5;t2.value=10;t3.value=17;rel.checked=false;view.value="both";draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
