<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Use-after-free két aliassal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="raii" aria-pressed="false">RAII / unique_ptr: ki</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="p és q ugyanarra a heap-blokkra mutat; free és p = NULL után q egy felszabadított blokkra mutat"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Állapotmodell a fejezet hibás C-blokkjából (a kódot nem futtatjuk). Sraffozott, szaggatott keret = felszabadított blokk; szaggatott nyíl = lógó mutató. A RAII-váltó a javítás elvét mutatja: egyetlen tulajdonos, nincs túlélő alias.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "p: blokk / q: – / blokk: foglalt (malloc(32))", "line": 0, "p": "B", "q": "-", "block": "foglalt", "uaf": false}, {"msg": "p: blokk / q: blokk / blokk: foglalt – két alias ugyanarra az objektumra", "line": 1, "p": "B", "q": "B", "block": "foglalt", "uaf": false}, {"msg": "p: blokk / q: blokk / blokk: felszabadított – mindkét mutató lógó", "line": 2, "p": "B", "q": "B", "block": "felszabadított", "uaf": false}, {"msg": "p: NULL / q: blokk / blokk: felszabadított – a nullázás csak p-t védi", "line": 3, "p": null, "q": "B", "block": "felszabadított", "uaf": false}, {"msg": "strcpy(q, \"x\"): írás a felszabadított blokkba → use-after-free (nem definiált viselkedés)", "line": 4, "p": null, "q": "B", "block": "felszabadított", "uaf": true}];
const CODE = ["char *p = malloc(32);", "char *q = p;          /* második alias ugyanarra az objektumra */", "free(p);", "p = NULL;             /* q változatlanul a felszabadított objektumra mutat */", "strcpy(q, \"x\");       /* use-after-free */"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const C_ORIG = ["char *p = malloc(32);", "char *q = p;          /* második alias ugyanarra az objektumra */", "free(p);", "p = NULL;             /* q változatlanul a felszabadított objektumra mutat */", "strcpy(q, \"x\");       /* use-after-free */"], RAII = [{"msg": "p: blokk (egyetlen tulajdonos) / blokk: foglalt", "line": 0, "p": "B", "q": "none", "block": "foglalt", "uaf": false, "raii": true}, {"msg": "A második tulajdonos-alias nem jön létre: a másolás fordítási hiba.", "line": 1, "p": "B", "q": "none", "block": "foglalt", "uaf": false, "raii": true}, {"msg": "Kölcsönzés (p.get()) csak p élettartamán belül; nincs túlélő alias.", "line": 2, "p": "B", "q": "none", "block": "foglalt", "uaf": false, "raii": true}, {"msg": "Hatókör vége: a blokk felszabadul, p == nullptr, és nincs olyan mutató, amely rá mutatna.", "line": 3, "p": null, "q": "none", "block": "felszabadított", "uaf": false, "raii": true}], RAIICODE = ["auto p = std::make_unique<char[]>(32);", "// auto q = p;   → fordítási hiba: a unique_ptr nem másolható", "{ /* használat p.get()-en át, kölcsönzésként, p élettartamán belül */ }", "} // hatókör vége: a unique_ptr destruktora felszabadít, p == nullptr"], ORIG = STEPS.slice();
let raiiOn = false;
function setCode(lines){ codeEl.innerHTML = lines.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join(""); }
document.getElementById("raii").onclick = e => {
  raiiOn = !raiiOn;
  e.target.textContent = "RAII / unique_ptr: " + (raiiOn ? "be" : "ki");
  e.target.setAttribute("aria-pressed", raiiOn ? "true" : "false");
  setCode(raiiOn ? RAIICODE : C_ORIG);
  setSteps(raiiOn ? RAII : ORIG);
};
function render(s){
  svg.setAttribute("viewBox", "0 0 560 260");
  svg.innerHTML = "";
  const defs = el("defs", {});
  const mkr = document.createElementNS(NS, "marker");
  [["id","ah"],["viewBox","0 0 10 10"],["refX",9],["refY",5],["markerWidth",7],["markerHeight",7],["orient","auto"]].forEach(([a, b]) => mkr.setAttribute(a, b));
  const pth = document.createElementNS(NS, "path"); pth.setAttribute("d", "M0,0 L10,5 L0,10 z"); pth.setAttribute("fill", css("--fg")); mkr.appendChild(pth); defs.appendChild(mkr);
  const pat = document.createElementNS(NS, "pattern");
  [["id","hatch"],["width",8],["height",8],["patternUnits","userSpaceOnUse"],["patternTransform","rotate(45)"]].forEach(([a, b]) => pat.setAttribute(a, b));
  const ln = document.createElementNS(NS, "line"); [["x1",0],["y1",0],["x2",0],["y2",8],["stroke",css("--fg")],["stroke-width",2]].forEach(([a, b]) => ln.setAttribute(a, b)); pat.appendChild(ln); defs.appendChild(pat);
  el("text", {x: 40, y: 24, "font-size": 14, "font-style": "italic"}, "verem");
  el("text", {x: 330, y: 24, "font-size": 14, "font-style": "italic"}, "heap");
  const freed = s.block === "felszabadított";
  el("rect", {x: 330, y: 50, width: 170, height: 160, fill: freed ? "url(#hatch)" : css("--cellhl"), stroke: css("--fg"), "stroke-width": 2.5, "stroke-dasharray": freed ? "8 5" : "none"});
  el("rect", {x: 360, y: 108, width: 110, height: 44, fill: css("--bg"), stroke: "none"});
  el("text", {x: 415, y: 127, "text-anchor": "middle", "font-size": 14}, "32 bájt");
  el("text", {x: 415, y: 146, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, s.block || "");
  const rows = s.raii ? [["p", 70, s.p]] : [["p", 70, s.p], ["q", 160, s.q]];
  rows.forEach(([n, y, v]) => {
    el("text", {x: 30, y: y + 26, "text-anchor": "end", "font-size": 17, "font-weight": "bold", "font-family": "ui-monospace,monospace"}, n);
    el("rect", {x: 40, y: y, width: 110, height: 40, fill: css("--cell"), stroke: css("--fg"), "stroke-width": 1.5});
    el("text", {x: 95, y: y + 26, "text-anchor": "middle", "font-size": 15, "font-family": "ui-monospace,monospace"}, v === "B" ? "• (blokk)" : (v === "-" ? "–" : (s.raii ? "nullptr" : "NULL")));
    if (v === "B") el("line", {x1: 140, y1: y + 20, x2: 328, y2: n === "p" ? 100 : 160, stroke: s.uaf && n === "q" ? css("--hl2") : css("--fg"), "stroke-width": freed ? 3.5 : 2, "stroke-dasharray": freed ? "9 5" : "none", "marker-end": "url(#ah)"});
  });
  if (s.raii) el("text", {x: 40, y: 190, "font-size": 13}, "q: nincs második tulajdonos (a unique_ptr nem másolható)");
  if (s.uaf) el("text", {x: 280, y: 245, "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: css("--hl2")}, "use-after-free: strcpy(q, \"x\") a felszabadított blokkba ír");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
