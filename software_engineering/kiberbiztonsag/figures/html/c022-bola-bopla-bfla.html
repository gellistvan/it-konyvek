<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOLA, BOPLA és BFLA összevetése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--bad:#b00020;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--bad:#ff8a9a;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
label{display:inline-flex;gap:6px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-x:auto}
pre span{display:block;padding:0 4px}
pre span.on{outline:2px solid var(--hl);font-weight:bold}
code{font:12.5px ui-monospace,monospace;background:var(--code);padding:0 3px}
.small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div role="region" aria-label="Három jogosultsághiba összevetése: a változó dimenzió és a szerver válasza sebezhető és javított esetben">

<div class="ctl" role="tablist" aria-label="Hibatípus">
  <button role="tab" id="t0" aria-selected="true">BOLA / IDOR</button>
  <button role="tab" id="t1" aria-selected="false">BOPLA</button>
  <button role="tab" id="t2" aria-selected="false">BFLA</button>
  <span style="flex:1"></span>
  <button id="mode" aria-pressed="false" title="Sebezhető / javított szerver">Szerver: sebezhető</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="grid2">
  <div><div class="small">Kérés</div><pre id="req"></pre></div>
  <div><div class="small">Szerveroldali döntés</div><pre id="line"></pre>
  <div class="small" style="margin-top:6px">Válasz</div><pre id="resp"></pre></div>
</div>
<svg id="g" viewBox="0 0 752 300" role="img" aria-label="Összevető rács; a kiválasztott hibatípus oszlopa kiemelve"></svg>

</div>
<p class="small">Fül váltása: gombok vagy ←/→. A szerver válaszai a fejezet példáiból előre megadottak (nem valódi kérés); a BOPLA végpontja szemléltető. 404: a fejezet tudatos elrejtési mintája.</p>
<script>
const DATA = {"tabs": [{"id": "bola", "name": "BOLA / IDOR", "vary": "Melyik objektum?", "req": "GET /api/documents/200 HTTP/1.1\nHost: lab.terrasecure.invalid\nAuthorization: Bearer <TOKEN – Alice, id=1>", "check": "tulajdonos (objektum ↔ alany)", "vuln": {"code": 200, "body": "{\"id\": 200, \"owner_id\": 2, \"content\": \"Bob fiktív jegyzete\"}", "line": "doc = DOCUMENTS.get(doc_id)   # csak a token érvényességét nézi", "msg": "Sebezhető: a szerver csak a token érvényességét nézi, a tulajdonost nem → 200, Alice Bob dokumentumát látja."}, "fixed": {"code": 404, "body": "{\"error\": \"not found\"}", "line": "if doc.owner_id != current_user.id: return 404", "msg": "Javított: owner_id (2) ≠ alany (1) → 404; a válasz megegyezik a nem létező dokumentuméval (tudatos elrejtés)."}}, {"id": "bopla", "name": "BOPLA", "vary": "Melyik mező?", "req": "PATCH /api/users/1 HTTP/1.1   (szemléltető végpont: Alice saját profilja)\nContent-Type: application/json\n\n{\"name\": \"Támadó\", \"role\": \"admin\"}", "check": "mező-engedélyezőlista", "vuln": {"code": 200, "body": "{\"id\": 1, \"name\": \"Támadó\", \"role\": \"admin\"}", "line": "user.update(request.json)   # minden kliensmezőt átvesz", "msg": "Sebezhető: a szerver a teljes JSON-t beolvassa (mass assignment) → 200, Alice szerepköre admin lett."}, "fixed": {"code": 400, "body": "{\"error\": \"nem engedélyezett mező: role\"}", "line": "ALLOWED = {\"name\"}; extra = set(body) - ALLOWED → 400", "msg": "Javított: a role nincs a mező-engedélyezőlistán → 400; a szerepkör nem változik."}}, {"id": "bfla", "name": "BFLA", "vary": "Melyik funkció?", "req": "DELETE /api/admin/users/2 HTTP/1.1\nHost: lab.terrasecure.invalid\nAuthorization: Bearer <TOKEN – Alice, szerepkör: user>", "check": "funkció ↔ szerepkör", "vuln": {"code": 200, "body": "{\"deleted\": 2}", "line": "@app.delete('/api/admin/users/<id>')   # csak bejelentkezést kér", "msg": "Sebezhető: az adminisztratív végpont csak bejelentkezést kér → 200, a 2-es felhasználó törölve."}, "fixed": {"code": 403, "body": "{\"error\": \"forbidden\"}", "line": "if 'admin' not in current_user.roles: return 403", "msg": "Javított: Alice szerepköre nem admin → 403; a funkciószintű ellenőrzés a végpont előtt fut."}}], "grid": {"cols": ["BOLA / IDOR", "BOPLA", "BFLA"], "rows": [["Ki kér?", ["Alice (id=1)", "Alice (id=1)", "Alice (id=1)"]], ["Melyik objektum?", ["document:100 → document:200", "user:1 (saját profil)", "–"]], ["Melyik mező / funkció?", ["read (olvasás)", "role mező", "DELETE /api/admin/users/2"]], ["Minta kérés", ["GET /api/documents/200", "{\"name\":\"Támadó\",\n \"role\":\"admin\"}", "DELETE /api/admin/users/2"]], ["Hiányzó ellenőrzés", ["tulajdonos\n(objektum ↔ alany)", "mező-engedélyezőlista", "funkció ↔ szerepkör"]], ["Javítás", ["owner_id == alany", "allowlist mezők", "szerepkör-ellenőrzés"]], ["Válasz: sebezhető → javított", ["200 → 404", "200 → 400", "200 → 403"]]], "vary": {"0": 1, "1": 2, "2": 2}}};

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

let tab = 0, fixed = false;
const g = document.getElementById("g");
function draw(){
  g.innerHTML = "";
  const L = 200, C = 184, H0 = 34, RH = 36;
  DATA.grid.cols.forEach((c, j) => {
    const on = j === tab;
    mk(g, "rect", {x: L + j*C, y: 0, width: C, height: H0, fill: on ? cv("--cellhl") : cv("--cell2"), stroke: cv("--line"), "stroke-width": 1});
    mk(g, "text", {x: L + j*C + C/2, y: 22, "text-anchor": "middle", "font-size": 14, "font-weight": "bold"}, c);
  });
  DATA.grid.rows.forEach((r, i) => {
    const y = H0 + i*RH;
    mk(g, "rect", {x: 0, y: y, width: L, height: RH, fill: cv("--cell2"), stroke: cv("--line"), "stroke-width": 1});
    mk(g, "text", {x: 6, y: y + 22, "font-size": 12, "font-weight": "bold"}, r[0]);
    r[1].forEach((v, j) => {
      const vary = DATA.grid.vary[j] === i, on = j === tab;
      mk(g, "rect", {x: L + j*C, y: y, width: C, height: RH, fill: on ? cv("--cellhl") : cv("--cell"), stroke: cv("--line"), "stroke-width": vary ? 3.5 : 1});
      mk(g, "text", {x: L + j*C + C/2, y: y + 22, "text-anchor": "middle", "font-size": 11}, (vary ? "★ " : "") + v.replace(/\n/g, " "));
    });
  });
}
function show(){
  const t = DATA.tabs[tab], s = fixed ? t.fixed : t.vuln;
  for (let i = 0; i < 3; i++) document.getElementById("t" + i).setAttribute("aria-selected", i === tab ? "true" : "false");
  for (let i = 0; i < 3; i++) document.getElementById("t" + i).style.fontWeight = i === tab ? "bold" : "normal";
  const m = document.getElementById("mode");
  m.textContent = "Szerver: " + (fixed ? "javított" : "sebezhető");
  m.setAttribute("aria-pressed", fixed ? "true" : "false");
  document.getElementById("req").textContent = t.req;
  document.getElementById("line").textContent = s.line + "\n(hiányzó ellenőrzés: " + t.check + ")";
  const r = document.getElementById("resp");
  r.textContent = "HTTP/1.1 " + s.code + "\n" + s.body;
  r.style.color = s.code === 200 ? cv("--bad") : cv("--ok");
  document.getElementById("status").textContent = t.name + " – változó dimenzió: " + t.vary + " " + s.msg;
  draw();
}
for (let i = 0; i < 3; i++) document.getElementById("t" + i).onclick = () => { tab = i; show(); };
document.getElementById("mode").onclick = () => { fixed = !fixed; show(); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { tab = (tab + 1) % 3; show(); } if (e.key === "ArrowLeft") { tab = (tab + 2) % 3; show(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", show);
show();

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
