<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mTLS-labor: négy kliens</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button class="cl" data-i="0" aria-pressed="true">allowed_client</button><button class="cl" data-i="1" aria-pressed="false">other_client</button><button class="cl" data-i="2" aria-pressed="false">nincs tanúsítvány</button><button class="cl" data-i="3" aria-pressed="false">Rogue CA kliens</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A négy labor-kliens TLS 1.3 kézfogása és alkalmazásszintű ellenőrzése a 127.0.0.1:8443 szerveren"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A lap nem futtat TLS-t: a kézfogás üzenetei a TLS 1.3 sorrendjét, a kimenetek a fejezet várt kimeneteit mutatják. A pontos TLS-figyelmeztetés szövege implementációfüggő; a kliens a tanúsítványt a szerver Finished üzenete után küldi.</p>

const CODE = ["context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)", "context.load_cert_chain(certfile=\"server.crt\", keyfile=\"server.key\")", "context.load_verify_locations(cafile=\"ca.crt\")", "context.verify_mode = ssl.CERT_REQUIRED   # kötelező kliens tanúsítvány, láncellenőrzés", "def do_GET(self):", "    uris = peer_uri_names(self.request)", "    if ALLOWED_URI not in uris:", "        body = b\"hiteles, de nem engedelyezett kliensidentitas\\n\"   # 403", "    body = b\"MTLS OK\\n\"   # 200"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

erraSecure Test CA)", "line": 2, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (other_client.crt), CertificateVerify, Finished"]], "layer": "app", "client": "other_client", "cert": "other_client.crt", "res": ""}, {"msg": "TLS-réteg: a lánc a TerraSecure Test CA-ig érvényes.", "line": 2, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (other_client.crt), CertificateVerify, Finished"], ["✓", "kézfogás kész (lánc érvényes)"]], "layer": "app", "client": "other_client", "cert": "other_client.crt", "res": ""}, {"msg": "Alkalmazás: peer_uri_names → [spiffe://terrasecure.local/service/other]", "line": 5, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (other_client.crt), CertificateVerify, Finished"], ["✓", "kézfogás kész (lánc érvényes)"], ["→", "GET / (HTTP a TLS-csatornán)"]], "layer": "app", "client": "other_client", "cert": "other_client.crt", "res": ""}, {"msg": "ALLOWED_URI nincs a kliens URI SAN-jai között. Várt kimenet: 403 hiteles, de nem engedelyezett kliensidentitas", "line": 7, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (other_client.crt), CertificateVerify, Finished"], ["✓", "kézfogás kész (lánc érvényes)"], ["→", "GET / (HTTP a TLS-csatornán)"], ["✗", "HTTP 403"]], "layer": "app", "client": "other_client", "cert": "other_client.crt", "res": "403 hiteles, de nem engedelyezett kliensidentitas"}], [{"msg": "kliens → szerver: TLS 1.3 ClientHello", "line": 0, "seq": [["→", "ClientHello"]], "layer": "tls", "client": "no_ o"], ["←", "ServerHello, EncryptedExtensions"]], "layer": "tls", "client": "rogue_client", "cert": "rogue_client.crt", "res": ""}, {"msg": "szerver → kliens: CertificateRequest (verify_mode = CERT_REQUIRED)", "line": 3, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"]], "layer": "tls", "client": "rogue_client", "cert": "rogue_client.crt", "res": ""}, {"msg": "szerver → kliens: server.crt (SAN DNS:localhost) – a kliens a ca.crt-vel ellenőrzi", "line": 1, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"]], "layer": "tls", "client": "rogue_client", "cert": "rogue_client.crt", "res": ""}, {"msg": "kliens → szerver: rogue_client.crt (kibocsátó: Rogue CA)", "line": 2, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (rogue_client.crt), CertificateVerify, Finished"]], "layer": "tls", "client": "rogue_client", "cert": "rogue_client.crt", "res": ""}, {"msg": "A Rogue CA nincs a ca.crt-ben: a láncellenőrzés elbukik. Várt kimenet: ELVÁRT: a szerver a hibás CA-t nem fogadta el: ...", "line": 2, "seq": [["→", "ClientHello"], ["←", "ServerHello, EncryptedExtensions"], ["←", "CertificateRequest"], ["←", "Certificate (server.crt), CertificateVerify, Finished"], ["→", "Certificate (rogue_client.crt), CertificateVerify, Finished"], ["✗", "alert: unknown_ca"]], "layer": "tls", "client": "rogue_client", "cert": "rogue_client.crt", "res": "TLS elutasítva (unknown ca)"}]];
document.querySelectorAll("button.cl").forEach(b => b.onclick = () => {

  setSteps(SC[+b.dataset.i]);
});
function render(s){
  const n = s.seq.length, H = 120 + n * 30;
  svg.setAttribute("viewBox", "0 0 720 " + H);
  svg.innerHTML = "";
  const xc = 90, xs = 630;
  el("text", {x: xc, y: 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, s.client);
  el("text", {x: xc, y: 38, "text-anchor": "middle", "font-size": 11.5}, "tanúsítvány: " + s.cert);
  el("text", {x: xs, y: 20, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, "szerver 127.0.0.1:8443");
  el("text", {x: xs, y: 38, "text-anchor": "middle", "font-size": 11.5}, "CERT_REQUIRED + ca.crt");
  el("line", {x1: xc, y1: 48, x2: xc, y2: H - 30, stroke: css("--line"), "stroke-width": 1.5});
  el("line", {x1: xs, y1: 48, x2: xs, y2: H - 30, stroke: css("--line"), "stroke-width": 1.5});
  s.seq.forEach(([d, t], i) => {
    const y = 72 + i * 30, last = i === n - 1;
    if (d === "→" || d === "←") {
      const a = d === "→" ? xc : xs, b = d === "→" ? xs : xc;
      el("line", {x1: a, y1: y, x2: b, y2: y, stroke: css("--line"), "stroke-width": last ? 2.5 : 1.3});
      el("polygon", {points: d === "→" ? `${b},${y} ${b-9},${y-5} ${b-9},${y+5}` : `${b},${y} ${b+9},${y-5} ${b+9},${y+5}`, fill: css("--line")});
    } else {
      el("rect", {x: xs - 220, y: y - 12, width: 220, height: 22, fill: css("--cellhl"), stroke: css("--line"), "stroke-width": d === "✗" ? 3 : 1.2});
      el("text", {x: xs - 230, y: y + 5, "text-anchor": "end", "font-size": 18, "font-weight": "bold"}, d);
    }
    el("text", {x: d === "✗" || d === "✓" ? xs - 110 : (xc + xs) / 2, y: y - 5 + (d === "✗" || d === "✓" ? 10 : 0), "text-anchor": "middle", "font-size": 12, "font-weight": last ? "bold" : "normal"}, t);
  });
  // két sáv: melyik rétegben dől el
  const ly = H - 22;
  const tlsBad = s.res && s.layer === "tls", appBad = s.res && s.layer === "app";
  el("rect", {x: 150, y: ly - 16, width: 200, height: 24, fill: css("--cell"), stroke: css("--line"), "stroke-width": tlsBad ? 3.5 : 1});
  el("text", {x: 250, y: ly, "text-anchor": "middle", "font-size": 12}, "TLS-kézfogás" + (tlsBad ? " ✗" : ""));
  el("rect", {x: 370, y: ly - 16, width: 200, height: 24, fill: css("--cell"), stroke: css("--line"), "stroke-width": appBad ? 3.5 : 1});
  el("text", {x: 470, y: ly, "text-anchor": "middle", "font-size": 12}, "Alkalmazás (ALLOWED_URI)" + (appBad ? " ✗" : ""));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
