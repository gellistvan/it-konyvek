<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A PE-fejléc mutatólánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="badsw"> hibás e_lfanew (0x1000, a fájl 0x200 bájtos)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hexnézet: MZ a 0x00-n, e_lfanew a 0x3C-n, PE aláírás a 0x80-on, COFF- és opcionális fejléc, Import Directory a 0x100-n; hibás e_lfanew esetén csak MZ."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szintetikus, szemléltető fejléc (nem valós minta); a valós eltolások fájlonként eltérnek. A kiemelt bájtok az adott lépésben olvasott mezők.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "1. MZ: 0x00: 4D 5A = „MZ” – csak DOS-fejlécet jelez, még nem PE. Érvényes PE-jel: még nem eldönthető.", "line": 0, "a": 0, "b": 2, "ok": true, "bad": false}, {"msg": "2. e_lfanew: 0x3C: e_lfanew = 80 00 00 00 (little-endian) = 0x80. Érvényes PE-jel: még nem eldönthető.", "line": 1, "a": 60, "b": 64, "ok": true, "bad": false}, {"msg": "3. PE\\0\\0: 0x80: 50 45 00 00 = „PE\\0\\0” – érvényes PE-aláírás. Érvényes PE-jel: még nem eldönthető.", "line": 2, "a": 128, "b": 132, "ok": true, "bad": false}, {"msg": "4. COFF + opc.: 0x84: COFF Machine = 0x014C (i386); 0x98: Magic = 0x10B (PE32). Érvényes PE-jel: még nem eldönthető.", "line": 4, "a": 132, "b": 154, "ok": true, "bad": false}, {"msg": "5. import: 0x100: Import Directory RVA = 0x2000, méret = 0x3C → a szakasztáblán át az importtáblához (DLL- és függvénynevek). Érvényes PE-jel: igen.", "line": 5, "a": 256, "b": 264, "ok": true, "bad": false}];
const CODE = ["if buf[0:2] != b'MZ': return 'nem PE'", "e_lfanew = int.from_bytes(buf[0x3C:0x40], 'little')", "if e_lfanew + 4 <= len(buf) and buf[e_lfanew:e_lfanew+4] == b'PE\\0\\0': ...", "else: return 'csak MZ, nem érvényes PE'", "machine = u16(e_lfanew+4); magic = u16(e_lfanew+24)   # 0x014C, 0x10B", "imp_rva, imp_size = u32(opt+0x68), u32(opt+0x6C)        # 1. adatkönyvtár: Import"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SHOW=[0, 16, 32, 48, null, 128, 144, 160, 176, 192, 208, 224, 240, 256], DG={"0": ["4D", "5A", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "10": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "20": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "30": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "80", "00", "00", "00"], "80": ["50", "45", "00", "00", "4C", "01", "03", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "90": ["00", "00", "00", "00", "E0", "00", "02", "01", "0B", "01", "00", "00", "00", "00", "00", "00"], "A0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "B0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "C0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "D0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "E0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "F0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "100": ["00", "20", "00", "00", "3C", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"]}, DB={"0": ["4D", "5A", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "10": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "20": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "30": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "10", "00", "00"], "80": ["50", "45", "00", "00", "4C", "01", "03", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "90": ["00", "00", "00", "00", "E0", "00", "02", "01", "0B", "01", "00", "00", "00", "00", "00", "00"], "A0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "B0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "C0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "D0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "E0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "F0": ["00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"], "100": ["00", "20", "00", "00", "3C", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00", "00"]}, SG=[{"msg": "1. MZ: 0x00: 4D 5A = „MZ” – csak DOS-fejlécet jelez, még nem PE. Érvényes PE-jel: még nem eldönthető.", "line": 0, "a": 0, "b": 2, "ok": true, "bad": false}, {"msg": "2. e_lfanew: 0x3C: e_lfanew = 80 00 00 00 (little-endian) = 0x80. Érvényes PE-jel: még nem eldönthető.", "line": 1, "a": 60, "b": 64, "ok": true, "bad": false}, {"msg": "3. PE\\0\\0: 0x80: 50 45 00 00 = „PE\\0\\0” – érvényes PE-aláírás. Érvényes PE-jel: még nem eldönthető.", "line": 2, "a": 128, "b": 132, "ok": true, "bad": false}, {"msg": "4. COFF + opc.: 0x84: COFF Machine = 0x014C (i386); 0x98: Magic = 0x10B (PE32). Érvényes PE-jel: még nem eldönthető.", "line": 4, "a": 132, "b": 154, "ok": true, "bad": false}, {"msg": "5. import: 0x100: Import Directory RVA = 0x2000, méret = 0x3C → a szakasztáblán át az importtáblához (DLL- és függvénynevek). Érvényes PE-jel: igen.", "line": 5, "a": 256, "b": 264, "ok": true, "bad": false}], SB=[{"msg": "1. MZ: 0x00: 4D 5A = „MZ” – csak DOS-fejlécet jelez, még nem PE. Érvényes PE-jel: még nem eldönthető.", "line": 0, "a": 0, "b": 2, "ok": true, "bad": true}, {"msg": "2. e_lfanew: 0x3C: e_lfanew = 00 10 00 00 (little-endian) = 0x1000. Érvényes PE-jel: még nem eldönthető.", "line": 1, "a": 60, "b": 64, "ok": true, "bad": true}, {"msg": "3. PE\\0\\0: 0x1000 a fájlvégen (0x200) túl van, ott nincs PE\\0\\0: csak MZ, nem érvényes PE. Érvényes PE-jel: nem.", "line": 3, "a": 60, "b": 64, "ok": false, "bad": true}];
function render(s){
  svg.innerHTML=""; svg.setAttribute("viewBox","0 0 640 420");
  const D=s.bad?DB:DG, cw=30, ch=24, x0=78, y0=34;
  el("text",{x:8,y:20,"font-size":14,fill:css("--muted")},"eltolás");
  for(let c=0;c<16;c++)el("text",{x:x0+c*cw+cw/2,y:20,"text-anchor":"middle","font-size":12,fill:css("--muted")},c.toString(16).toUpperCase());
  let y=y0;
  SHOW.forEach(r=>{
    if(r===null){el("text",{x:x0+8*cw,y:y+16,"text-anchor":"middle","font-size":14,fill:css("--muted")},"… 0x40–0x7F: DOS-stub („This program cannot be run in DOS mode”) …");y+=ch;return;}
    el("text",{x:8,y:y+16,"font-size":14,"font-family":"ui-monospace,monospace"},"0x"+r.toString(16).toUpperCase().padStart(3,"0"));
    D[r.toString(16).toUpperCase()].forEach((h,c)=>{const o=r+c, on=(o>=s.a&&o<s.b);
      el("rect",{x:x0+c*cw,y:y,width:cw,height:ch,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":on?2.6:0.5});
      el("text",{x:x0+c*cw+cw/2,y:y+16,"text-anchor":"middle","font-size":13,"font-family":"ui-monospace,monospace","font-weight":on?"bold":"normal"},h);});
    y+=ch;});
  const ok=s.ok; el("text",{x:8,y:y+30,"font-size":16,"font-weight":"bold",fill:ok?css("--fg"):css("--hl2")},
     s.bad&&!ok?"✗ csak MZ, nem érvényes PE":(s.line===5?"✓ érvényes PE-jel: igen":"vizsgálat folyik…"));
}
document.getElementById("badsw").addEventListener("change",ev=>setSteps(ev.target.checked?SB:SG));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
