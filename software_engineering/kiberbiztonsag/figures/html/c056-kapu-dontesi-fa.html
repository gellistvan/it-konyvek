<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A policy-kapu döntési fája</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><style>:root{--err:#c00000;--ok:#1e6b2e;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8}@media (prefers-color-scheme:dark){:root{--err:#ff7070;--ok:#7fd08f;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838}}#logl{font:12.5px/1.4 ui-monospace,monospace;white-space:pre-wrap;margin:0}</style><label>Futás: <select id="run" onchange="pickRun(+this.value)"><option value="0">(1) csak W-2026-001</option><option value="1">(2) + W-2026-002</option><option value="2">(3) W-001 expiry = 2025-01-01</option><option value="3">(4) W-001 attribute = versioning</option><option value="4">(5) bad-plan.json (hibás JSON)</option><option value="5">(6) unknown-plan.json (9.9)</option></select></label><pre id="logl" aria-label="JSONL-naplósor"></pre></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Döntési fa: opa eval, plan_errors, a találatok azonosítója, találatonkénti waiver-egyeztetés, unwaived és findings vizsgálata; kimenetek error/2, deny/1, allow_with_waiver/0, allow/0; jobbra a labor futásainak táblázata."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kódpanel a gate.py rövidített kivonata. Az OPA-kimenetet a fejezet policy.rego-jából vezettük le (nem futtatva); a waiver-egyeztetés a gate.py waiver_matches/evaluate átirata, --now 2026-01-01T00:00:00Z.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "(1) csak W-2026-001: az opa eval sikeres, van findings és plan_errors kimenet.", "hl": ["q1", "row0"], "line": 0, "wvl": "", "uwl": "", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: a plan_errors üres.", "hl": ["q2", "row0"], "line": 1, "wvl": "", "uwl": "", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: mind a(z) 2 találatnak van rule_id, resource és attribute mezője.", "hl": ["q3", "row0"], "line": 4, "wvl": "", "uwl": "", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: a(z) [S3] találat (aws_s3_bucket.customer_data, acl) a waiverek között keres.", "hl": ["q4", "row0"], "line": 6, "wvl": "", "uwl": "", "tok": "▶ [S3]", "log": ""}, {"msg": "(1) csak W-2026-001: [S3] → waived (W-2026-001: pontos hármas egyezés, hiteles, nem lejárt).", "hl": ["q4", "wv", "row0"], "line": 7, "wvl": "[S3]", "uwl": "", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: a(z) [IAM] találat (aws_iam_policy.admin_star, Statement[0].Action/Resource) a waiverek között keres.", "hl": ["q4", "row0"], "line": 6, "wvl": "[S3]", "uwl": "", "tok": "▶ [IAM]", "log": ""}, {"msg": "(1) csak W-2026-001: [IAM] → unwaived (nincs rá szóló waiver).", "hl": ["q4", "uw", "row0"], "line": 8, "wvl": "[S3]", "uwl": "[IAM]", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: az unwaived lista nem üres → deny / 1 (a részleges mentesítés nem enged).", "hl": ["q5", "deny", "row0"], "line": 9, "wvl": "[S3]", "uwl": "[IAM]", "tok": "", "log": ""}, {"msg": "(1) csak W-2026-001: naplósor (JSONL, rövidítve): {\"decision\": \"deny\", \"exit_code\": 1, \"waived\": [\"S3_PUBLIC_ACL→W-2026-001\"], \"unwaived\": [\"IAM_STAR_STAR\"]}", "hl": ["deny", "row0"], "line": 12, "wvl": "[S3]", "uwl": "[IAM]", "tok": "", "log": "{\"decision\": \"deny\", \"exit_code\": 1, \"waived\": [\"S3_PUBLIC_ACL→W-2026-001\"], \"unwaived\": [\"IAM_STAR_STAR\"]}"}];
const CODE = ["findings, plan_errors = opa_findings(policy, input)   # opa eval hiba → GateError → error/2", "if plan_errors:", "    return {\"decision\": \"error\", \"exit_code\": EXIT_ERROR}   # invalid_plan", "for finding in findings:", "    if hiányzik a rule_id / resource / attribute:", "        return {\"decision\": \"error\", \"exit_code\": EXIT_ERROR}", "    matches = [w for w in waivers if waiver_matches(finding, w, now)]", "    if matches: waived.append({**finding, \"waiver_id\": matches[0][\"id\"]})", "    else:       unwaived.append(finding)", "if unwaived:   decision, exit_code = \"deny\", EXIT_DENY            # 1", "elif findings: decision, exit_code = \"allow_with_waiver\", EXIT_ALLOW  # 0", "else:          decision, exit_code = \"allow\", EXIT_ALLOW          # 0", "write_audit(audit_path, record)                 # egy JSONL-sor a naplóba"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a.style="font-family:'DejaVu Sans Mono',ui-monospace,monospace";
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

function render(s){
  const D = JSON.parse(JSON.stringify(BASE));
  D.nodes.forEach(n => { if ((s.hl||[]).includes(n.id)) n.hl = true; if (n.id==="uw" && s.uwl) n.col="err"; });
  if (s.wvl) D.texts.push({x:102, y:452, s:s.wvl, fs:18, bold:true});
  if (s.uwl) D.texts.push({x:318, y:452, s:s.uwl + " ✗", fs:18, bold:true, col:"err"});
  if (s.tok) D.texts.push({x:470, y:318, s:s.tok, fs:18, bold:true, col:"hl"});
  dg_draw(svg, D);
  document.getElementById("logl").textContent = s.log || "";
}
function pickRun(i){ setSteps(ALLRUNS[i]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
