<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verziózás és Object Lock</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Műveletek">
  <button type="button" id="put">PUT</button>
  <button type="button" id="putlock">PUT + lock (30 nap)</button>
  <button type="button" id="del">DELETE</button>
  <label>DELETE verzióval <select id="ver"></select></label><button type="button" id="delver">törlés</button>
  <button type="button" id="delm">delete marker törlése</button>
</div>
<div class="ctl" role="group" aria-label="A könyv példája">
  <span class="small">A könyv példája:</span>
  <button type="button" id="bprev">◀ Lépés</button><button type="button" id="bnext">Lépés ▶</button>
  <span id="bcnt" class="small"></span>
  <button type="button" id="reset">Üres kulcs</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 600 330" role="img" aria-label="A report.csv kulcs verzióverme: verziók, delete marker, aktuális mutató és lock jelölés"></svg>
<p class="small">Elméleti modell (verziózott, S3-szerű bucket): a lock a konkrét verziót védi, nem a kulcsot; a delete marker
csak elrejti az aktuális verziót. Nem futtatott felhőhívás.</p>
<script>
const BOOK = [{"stack": [{"id": "v1", "kind": "ver", "lock": true}], "ok": true, "msg": "PUT: új verzió (v1, lock: 30 nap) – ez az aktuális.", "cap": "1) PUT\n(lock)", "cur": "v1"}, {"stack": [{"id": "v1", "kind": "ver", "lock": true}, {"id": "v2", "kind": "ver", "lock": false}], "ok": true, "msg": "PUT: új verzió (v2) – ez az aktuális.", "cap": "2) PUT", "cur": "v2"}, {"stack": [{"id": "v1", "kind": "ver", "lock": true}, {"id": "v2", "kind": "ver", "lock": false}, {"id": "marker", "kind": "marker", "lock": false}], "ok": true, "msg": "DELETE verzióazonosító nélkül: delete marker kerül a tetejére – az aktuális objektum nem látható (GET 404), de a korábbi verziók megmaradnak. A v1 a verzióazonosítójával helyreállítható.", "cap": "3) DELETE", "cur": null}, {"stack": [{"id": "v1", "kind": "ver", "lock": true}, {"id": "marker", "kind": "marker", "lock": false}], "ok": true, "msg": "DELETE v2 (verzióazonosítóval): sikerült ✓ – a v2-n nincs lock, véglegesen törölve.", "cap": "4) DELETE\nverzió v2", "cur": null}, {"stack": [{"id": "v1", "kind": "ver", "lock": true}, {"id": "marker", "kind": "marker", "lock": false}], "ok": false, "msg": "DELETE v1 (verzióazonosítóval): elutasítva ✗ – a v1 Object Lock (retention) alatt áll.", "cap": "5) DELETE\nverzió v1", "cur": null}, {"stack": [{"id": "v1", "kind": "ver", "lock": true}], "ok": true, "msg": "A delete marker törölve: az aktuális ismét a legfelső megmaradt verzió (v1).", "cap": "6) marker\ntörlése", "cur": "v1"}];
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("v"), statusEl=document.getElementById("status");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function mk(tag,a,txt){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
let stack=[], bk=-1, last="", lastOk=true;
function current(s){return (!s.length||s[s.length-1].kind==="marker")?null:s[s.length-1].id;}
function apply(op,arg){
  let s=stack.map(e=>Object.assign({},e));
  if(op==="put"){let n=s.filter(e=>e.kind==="ver").length+1; while(s.some(e=>e.id==="v"+n)) n++;
    s.push({id:"v"+n,kind:"ver",lock:arg==="lock"}); return [s,true,`PUT: új verzió (v${n}${arg==="lock"?", lock: 30 nap":""}) – ez az aktuális.`];}
  if(op==="delete"){s.push({id:"marker",kind:"marker",lock:false});
    return [s,true,"DELETE verzióazonosító nélkül: delete marker kerül a tetejére – az aktuális objektum nem látható (GET 404), de a korábbi verziók megmaradnak."];}
  if(op==="delver"){const e=s.find(x=>x.id===arg); if(!e) return [s,false,`Nincs ${arg} verzió.`];
    if(e.lock) return [s,false,`DELETE ${arg} (verzióazonosítóval): elutasítva ✗ – a ${arg} Object Lock (retention) alatt áll.`];
    s=s.filter(x=>x.id!==arg); return [s,true,`DELETE ${arg} (verzióazonosítóval): sikerült ✓ – a ${arg}-n nincs lock, véglegesen törölve.`];}
  if(op==="delmarker"){if(!s.length||s[s.length-1].kind!=="marker") return [s,false,"A verem tetején nincs delete marker."];
    s=s.slice(0,-1); return [s,true,`A delete marker törölve: az aktuális ismét a legfelső megmaradt verzió (${current(s)||"–"}).`];}
}
function hidden(){const c=current(stack); return stack.filter(e=>e.kind==="ver"&&e.id!==c).map(e=>e.id);}
function draw(){
  svg.innerHTML=""; const fg=css("--fg");
  mk("defs",{}).innerHTML=`<pattern id="hx" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0L8 8M8 0L0 8" stroke="${fg}" stroke-width="1"/></pattern>`;
  mk("text",{x:300,y:22,"text-anchor":"middle","font-size":16,"font-weight":"bold"},"report.csv – verzióverem (alulról felfelé)");
  const bw=220,bh=44,x=190,yb=300;
  mk("line",{x1:150,y1:yb,x2:450,y2:yb,stroke:fg,"stroke-width":2});
  stack.forEach((e,j)=>{const y=yb-(j+1)*(bh+8), top=j===stack.length-1;
    const isCur=top&&e.kind==="ver";
    if(e.kind==="marker"){mk("rect",{x,y,width:bw,height:bh,fill:"url(#hx)",stroke:fg,"stroke-dasharray":"7 4"});
      mk("rect",{x:x+50,y:y+10,width:bw-100,height:24,fill:css("--bg")});
      mk("text",{x:x+bw/2,y:y+27,"text-anchor":"middle","font-size":15},"delete marker");}
    else{mk("rect",{x,y,width:bw,height:bh,fill:isCur?css("--cellhl"):css("--cell"),stroke:fg,"stroke-width":isCur?3:1.3});
      if(e.lock) mk("rect",{x:x+5,y:y+5,width:bw-10,height:bh-10,fill:"none",stroke:fg,"stroke-width":1.2});
      mk("text",{x:x+bw/2,y:y+28,"text-anchor":"middle","font-size":17,"font-weight":isCur?"bold":"normal"},e.id+(e.lock?" – lock, 30 nap":""));}
    if(top){mk("text",{x:x-10,y:y+28,"text-anchor":"end","font-size":15,"font-weight":"bold"},"aktuális ▶");}
  });
  const c=current(stack);
  mk("text",{x:470,y:yb-10,"font-size":15},c?`GET → ${c}`:(stack.length?"GET → 404":"(üres kulcs)"));
  const sel=document.getElementById("ver"); const v=sel.value; sel.innerHTML="";
  stack.filter(e=>e.kind==="ver").forEach(e=>{const o=document.createElement("option");o.value=e.id;o.textContent=e.id;sel.appendChild(o);});
  if([...sel.options].some(o=>o.value===v)) sel.value=v;
  const h=hidden(); let extra="";
  if(h.length) extra=` Helyreállítható régi verzió(k) a verzióazonosítóval: ${h.join(", ")}.`;
  statusEl.textContent=(last||"Kezdj egy PUT-tal, vagy lépkedj a könyv példáján!")+extra;
  document.getElementById("bcnt").textContent=bk>=0?`${bk+1}/${BOOK.length}`:"";
}
function op(o,a){const r=apply(o,a); stack=r[0]; last=r[2]; lastOk=r[1]; bk=-1; draw();}
document.getElementById("put").onclick=()=>op("put",null);
document.getElementById("putlock").onclick=()=>op("put","lock");
document.getElementById("del").onclick=()=>op("delete");
document.getElementById("delver").onclick=()=>{const v=document.getElementById("ver").value; if(v) op("delver",v);};
document.getElementById("delm").onclick=()=>op("delmarker");
function book(i){bk=Math.max(0,Math.min(BOOK.length-1,i)); stack=BOOK[bk].stack.map(e=>Object.assign({},e)); last=BOOK[bk].cap.replace("\n"," ")+": "+BOOK[bk].msg; draw(); document.getElementById("bcnt").textContent=`${bk+1}/${BOOK.length}`;}
document.getElementById("bprev").onclick=()=>book(bk<0?0:bk-1);
document.getElementById("bnext").onclick=()=>book(bk+1);
document.getElementById("reset").onclick=()=>{stack=[];last="";bk=-1;draw();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
book(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
