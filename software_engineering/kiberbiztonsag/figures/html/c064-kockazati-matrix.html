<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kockázati mátrix</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

.mk{cursor:grab} .mk:focus{outline:none} .mk:focus circle{stroke-width:4}
ol{margin:2px 0 0 1.2em;padding:0} .cols{display:flex;gap:24px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Nézet">
<label><input type="checkbox" id="waf"> V1 WAF nélkül (L 3 → 4)</label>
<label><input type="checkbox" id="lab"> Labor A–E tételek (T-B7-031 mintamegoldás)</label>
<button id="reset" type="button">Alapállapot</button>
</div>
<div id="status" aria-live="polite"></div>
<div class="cols">
<svg id="v" viewBox="0 0 380 380" style="max-width:420px" role="img" aria-label="5×5 kockázati mátrix, vízszintesen a hatás, függőlegesen a valószínűség; a jelölők húzhatók vagy nyílbillentyűvel mozgathatók"></svg>
<div><b>CVSS szerint</b><ol id="lc"></ol><br><b>R = L × I szerint</b><ol id="lr"></ol></div>
</div>
<p class="small">A jelölőt egérrel húzd, vagy Tab-bal válaszd ki és nyílbillentyűkkel mozgasd. Fiktív adatok; a sávok a c003
helyi heurisztikája, nem arányos kockázati mérték. SLA: a 17.4.8 példái.</p>
<script>
const BANDS = [[1, 4, "alacsony", "", "90 nap / következő karbantartási ablak"], [5, 9, "közepes", "..", "30 nap"], [10, 16, "magas", "///", "7 nap"], [17, 25, "kritikus", "xxx", "24–72 óra"]];
const V0 = [["V1", 9.8, 3, 5], ["V2", 6.1, 2, 3], ["V3", 8.8, 4, 4], ["V4", 5.3, 4, 1]], LAB = [["A", 9.8, 4, 5], ["B", 6.1, 2, 3], ["C", 8.8, 4, 3], ["D", 5.3, 4, 1], ["E", 8.8, 4, 4]];
let items = [], sel = 0;
function band(r){return BANDS.find(b=>b[0]<=r&&r<=b[1]);}
function c(x){return x.toFixed(1).replace(".",",");}
const svg=document.getElementById("v"), NS="http://www.w3.org/2000/svg", S=64, X0=50, Y0=10;
function mk(t,a,txt,par){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;(par||svg).appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function cellXY(L,I){return [X0+(I-1)*S, Y0+(5-L)*S];}
function load(){
  const lab=document.getElementById("lab").checked, waf=document.getElementById("waf").checked;
  document.getElementById("waf").disabled=lab;
  items=(lab?LAB:V0).map(v=>v.slice());
  if(!lab&&waf) items.forEach(v=>{if(v[0]==="V1")v[2]=4;});
  sel=0; draw();
}
function draw(){
  svg.innerHTML=""; const fg=css("--fg"), bg=css("--bg");
  const d=mk("defs",{});
  d.innerHTML=`<pattern id="p.." width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${fg}"/></pattern>`+
   `<pattern id="p///" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/></pattern>`+
   `<pattern id="pxxx" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="5" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  for(let L=1;L<=5;L++)for(let I=1;I<=5;I++){const [x,y]=cellXY(L,I), r=L*I, b=band(r);
    mk("rect",{x:x,y:y,width:S,height:S,fill:bg,stroke:fg}); if(b[3])mk("rect",{x:x,y:y,width:S,height:S,fill:`url(#p${b[3]})`,opacity:0.6});
    mk("rect",{x:x+S-24,y:y+S-19,width:21,height:16,fill:bg}); mk("text",{x:x+S-5,y:y+S-6,"text-anchor":"end","font-size":12},String(r));}
  for(let k=1;k<=5;k++){mk("text",{x:X0+(k-0.5)*S,y:Y0+5*S+16,"text-anchor":"middle","font-size":12},String(k));
    mk("text",{x:X0-8,y:Y0+(5-k+0.5)*S+4,"text-anchor":"end","font-size":12},String(k));}
  mk("text",{x:X0+2.5*S,y:Y0+5*S+34,"text-anchor":"middle","font-size":13},"hatás I");
  const t=mk("text",{x:14,y:Y0+2.5*S,"text-anchor":"middle","font-size":13,transform:`rotate(-90 14 ${Y0+2.5*S})`},"valószínűség L");
  // jelölők (azonos cellában eltolva)
  const seen={};
  items.forEach((v,i)=>{const key=v[2]+"_"+v[3]; const n=seen[key]=(seen[key]||0)+1; const [x,y]=cellXY(v[2],v[3]);
    const g=mk("g",{class:"mk",tabindex:0,role:"button","aria-label":`${v[0]}: L=${v[2]}, I=${v[3]}`});
    const cx=x+18+(n-1)*22, cy=y+20+(n-1)*6;
    mk("circle",{cx:cx,cy:cy,r:15,fill:bg,stroke:i===sel?css("--hl"):fg,"stroke-width":i===sel?3:1.6},undefined,g);
    mk("text",{x:cx,y:cy+4,"text-anchor":"middle","font-size":12,"font-weight":"bold"},v[0],g);
    g.addEventListener("pointerdown",ev=>{sel=i;drag=i;svg.setPointerCapture(ev.pointerId);draw();});
    g.addEventListener("keydown",ev=>{const m={ArrowUp:[1,0],ArrowDown:[-1,0],ArrowRight:[0,1],ArrowLeft:[0,-1]}[ev.key];
      if(m){ev.preventDefault();sel=i;v[2]=Math.min(5,Math.max(1,v[2]+m[0]));v[3]=Math.min(5,Math.max(1,v[3]+m[1]));draw();svg.querySelectorAll(".mk")[i].focus();}});
    g.addEventListener("focus",()=>{if(sel!==i){sel=i;draw();svg.querySelectorAll(".mk")[i].focus();}});});
  const rr=items.slice().sort((a,b)=>(b[2]*b[3]-a[2]*a[3])||(b[1]-a[1])), lc=items.slice().sort((a,b)=>b[1]-a[1]);
  document.getElementById("lc").innerHTML=lc.map(v=>`<li>${v[0]} – CVSS ${c(v[1])}</li>`).join("");
  document.getElementById("lr").innerHTML=rr.map((v,k)=>{const r=v[2]*v[3];return `<li>${k===0?"<b>":""}${v[0]} – R = ${v[2]} × ${v[3]} = ${r} (${band(r)[2]})${k===0?"</b>":""}</li>`;}).join("");
  const s=items[sel], r=s[2]*s[3], b=band(r);
  document.getElementById("status").textContent=`${s[0]}: L = ${s[2]}, I = ${s[3]}, R = ${r} → ${b[2]} (${b[0]}–${b[1]}), példa-SLA: ${b[4]}. Az R-lista első eleme: ${rr[0][0]}.`;
}
let drag=null;
svg.addEventListener("pointermove",ev=>{if(drag===null)return; const p=svg.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY;
  const q=p.matrixTransform(svg.getScreenCTM().inverse()); const I=Math.min(5,Math.max(1,Math.floor((q.x-X0)/S)+1)), L=Math.min(5,Math.max(1,5-Math.floor((q.y-Y0)/S)));
  const v=items[drag]; if(v[2]!==L||v[3]!==I){v[2]=L;v[3]=I;draw();}});
svg.addEventListener("pointerup",()=>{drag=null;});
document.getElementById("waf").addEventListener("change",load);
document.getElementById("lab").addEventListener("change",load);
document.getElementById("reset").onclick=()=>{document.getElementById("waf").checked=false;document.getElementById("lab").checked=false;load();};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
load();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
