<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triázs és prioritás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Találat">
  <label>Találat <select id="fsel"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="own">saját</option></select></label>
  <button id="prev" type="button">◀ Lépés</button><button id="next" type="button">Lépés ▶</button>
  <span id="cnt" class="small"></span>
</div>
<div class="ctl" id="own" role="group" aria-label="Saját találat mezői" style="display:none">
  <label><input type="checkbox" id="o_app" checked> alkalmazható</label>
  <label><input type="checkbox" id="o_kev"> KEV</label>
  <label>elérhetőség <select id="o_reach"><option value="internet">internet</option><option value="partner">partner</option><option value="vpn">csak VPN</option><option value="nem">nem elérhető</option></select></label>
  <label>L <input type="number" id="o_L" min="1" max="5" value="3"></label>
  <label>I <input type="number" id="o_I" min="1" max="5" value="3"></label>
  <label>CVSS <select id="o_ver"><option>3.1</option><option>4.0</option></select> <input type="number" id="o_cvss" min="0" max="10" step="0.1" value="7.5"></label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 1300" role="img" aria-label="Triázs-döntési folyamat: alkalmazhatóság, KEV, elérhetőség, érintett adat, kompenzáló kontroll, L és I becslése, R = L × I, prioritás és SLA."></svg>
<p class="small">Prioritási kulcs (helyi határok): nem alkalmazható → lezárás; KEV és elérhető → P0; egyébként R ≥ 15 → P0, 10–14 → P1, 5–9 → P2, ≤ 4 → P3. SLA: P0 72 óra, P1 7 nap, P2 30 nap, P3 90 nap. A CVSS csak az L becslésének bemenete.</p>
<script>
const DBASE = {"W": 1000, "H": 1332, "nodes": [{"id": "q1", "x": 305.0, "y": 260, "w": 350, "h": 100, "label": "1) Alkalmazható?", "shape": "diamond", "fs": 18}, {"id": "q2", "x": 305.0, "y": 396, "w": 350, "h": 100, "label": "2) Aktív kihasználás\n(KEV)?", "shape": "diamond", "fs": 18}, {"id": "q3", "x": 305.0, "y": 532, "w": 350, "h": 100, "label": "3) Elérhető? (internet /\npartner / VPN)", "shape": "diamond", "fs": 18}, {"id": "q4", "x": 325.0, "y": 672, "w": 310, "h": 62, "label": "4) Mit érint? (adat, funkció)", "shape": "rect", "fs": 18}, {"id": "q5", "x": 325.0, "y": 774, "w": 310, "h": 62, "label": "5) Kompenzáló kontroll?", "shape": "rect", "fs": 18}, {"id": "q6", "x": 325.0, "y": 876, "w": 310, "h": 62, "label": "L és I becslése (1–5)", "shape": "rect", "fs": 18}, {"id": "q7", "x": 325.0, "y": 978, "w": 310, "h": 62, "label": "R = L × I", "shape": "rect", "fs": 18}, {"id": "q8", "x": 325.0, "y": 1080, "w": 310, "h": 92, "label": "prioritás R alapján: R ≥ 15 → P0\n10–14 → P1 · 5–9 → P2 · ≤ 4 → P3", "shape": "rect", "fs": 18}, {"id": "lA", "x": 740, "y": 262, "w": 256, "h": 96, "label": "lezárva:\nnem alkalmazható,\nnincs SLA", "shape": "rect", "fs": 18, "ls": "dash"}, {"id": "lB", "x": 740, "y": 542, "w": 256, "h": 76, "label": "P0 – 72 óra\n(KEV + elérhető)", "shape": "rect", "fs": 18, "lw": 3.0, "fill": "g"}, {"id": "lC", "x": 325.0, "y": 1222, "w": 310, "h": 70, "label": "prioritás + SLA", "shape": "rect", "fs": 18, "lw": 3.0, "fill": "g"}], "edges": [{"id": "lgA", "pts": [[8, 18], [70, 18]], "label": "", "arrow": "none", "ls": "solid", "lw": 2.6}, {"id": "lgB", "pts": [[8, 92], [70, 92]], "label": "", "arrow": "none", "ls": "dash", "lw": 2.6}, {"id": "lgC", "pts": [[8, 166], [70, 166]], "label": "", "arrow": "none", "ls": "dot", "lw": 2.6}, {"id": "eq1", "pts": [[480, 360], [480, 396]], "label": "igen", "lx": 510, "ly": 378.0, "bg": true}, {"id": "eq2", "pts": [[480, 496], [480, 532]], "label": "", "lx": 510, "ly": 514.0, "bg": true}, {"id": "eq3", "pts": [[480, 632], [480, 672]], "label": "", "lx": 510, "ly": 652.0, "bg": true}, {"id": "eq4", "pts": [[480, 734], [480, 774]], "label": "", "lx": 510, "ly": 754.0, "bg": true}, {"id": "eq5", "pts": [[480, 836], [480, 876]], "label": "", "lx": 510, "ly": 856.0, "bg": true}, {"id": "eq6", "pts": [[480, 938], [480, 978]], "label": "", "lx": 510, "ly": 958.0, "bg": true}, {"id": "eq7", "pts": [[480, 1040], [480, 1080]], "label": "", "lx": 510, "ly": 1060.0, "bg": true}, {"id": "xA", "pts": [[655.0, 310.0], [740, 310.0]], "label": "nem", "lx": 697.5, "ly": 294.0}, {"id": "xB", "pts": [[655.0, 582.0], [740, 582.0]], "label": "igen +\nKEV", "lx": 697.5, "ly": 556.0}, {"id": "xC", "pts": [[480, 1172], [480, 1222]], "label": ""}], "texts": [{"x": 80, "y": 18, "s": "A: CVSS 3.1 · 9,8 – a sebezhető komponens nincs telepítve", "fs": 18, "ha": "left"}, {"x": 80, "y": 48, "s": "AV:N/AC:L/PR:N/UI:N/…/C:H/I:H/A:H", "fs": 18, "ha": "left", "mono": true}, {"x": 80, "y": 92, "s": "B: CVSS 3.1 · 6,5 – KEV-ben szerepel, internetről elérhető", "fs": 18, "ha": "left"}, {"x": 80, "y": 122, "s": "AV:N/AC:L/PR:L/UI:N/…/C:H/I:N/A:N", "fs": 18, "ha": "left", "mono": true}, {"x": 80, "y": 166, "s": "C: CVSS 4.0 · 9,3 – belső, csak VPN-ről; WAF; nincs érzékeny adat", "fs": 18, "ha": "left"}, {"x": 80, "y": 196, "s": "AV:N/AC:L/AT:N/PR:N/…/VC:H/VI:H/VA:H", "fs": 18, "ha": "left", "mono": true}]};
const FIND = {"A": {"name": "A", "cvss": "CVSS 3.1 · 9,8", "vec": "AV:N/AC:L/PR:N/UI:N/…/C:H/I:H/A:H", "applicable": false, "kev": false, "reach": "internet", "L": null, "I": null, "impact": "–", "comp": "–", "note": "a sebezhető komponens nincs telepítve"}, "B": {"name": "B", "cvss": "CVSS 3.1 · 6,5", "vec": "AV:N/AC:L/PR:L/UI:N/…/C:H/I:N/A:N", "applicable": true, "kev": true, "reach": "internet", "L": null, "I": null, "impact": "(nem kell: KEV + internet)", "comp": "–", "note": "KEV-ben szerepel, internetről elérhető"}, "C": {"name": "C", "cvss": "CVSS 4.0 · 9,3", "vec": "AV:N/AC:L/AT:N/PR:N/…/VC:H/VI:H/VA:H", "applicable": true, "kev": false, "reach": "vpn", "L": 2, "I": 3, "impact": "nem érzékeny", "comp": "WAF", "note": "belső, csak VPN-ről; WAF; nincs érzékeny adat"}};
const GRID = {"1,1": "P3", "1,2": "P3", "1,3": "P3", "1,4": "P3", "1,5": "P2", "2,1": "P3", "2,2": "P3", "2,3": "P2", "2,4": "P2", "2,5": "P1", "3,1": "P3", "3,2": "P2", "3,3": "P2", "3,4": "P1", "3,5": "P0", "4,1": "P3", "4,2": "P2", "4,3": "P1", "4,4": "P0", "4,5": "P0", "5,1": "P2", "5,2": "P1", "5,3": "P0", "5,4": "P0", "5,5": "P0"};
const SLA = {"P0": "72 óra", "P1": "7 nap", "P2": "30 nap", "P3": "90 nap"};
const RAIL = {"A": 26, "B": 62, "C": 98}, RLS = {"A": "solid", "B": "dash", "C": "dot"}, QY = {"q1": 260, "q2": 396, "q3": 532, "q4": 672, "q5": 774, "q6": 876, "q7": 978, "q8": 1080}, QH = {"q1": 100, "q2": 100, "q3": 100, "q4": 62, "q5": 62, "q6": 62, "q7": 62, "q8": 92};
const CX = 480, X0 = 305.0;

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a["font-family"]="ui-monospace,monospace";
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}
  return g;
}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));
  return out;
}

const svgEl = document.getElementById("v"), statusEl = document.getElementById("status");
let K = 0;
function prioFromR(r){ return r >= 15 ? "P0" : r >= 10 ? "P1" : r >= 5 ? "P2" : "P3"; }
function triage(f){ if(!f.applicable) return [null,"q1"]; const re = f.reach !== "nem"; if(f.kev && re) return ["P0","q3"]; return [prioFromR(f.L*f.I),"q8"]; }
function answers(f){
  const o = [];
  o.push(["q1", f.applicable ? "igen" : "nem", f.applicable ? "alkalmazható" : "nem alkalmazható: " + (f.note||"")]);
  if (!f.applicable) return o;
  o.push(["q2", f.kev ? "igen" : "nem", f.kev ? "KEV-ben szerepel" : "nincs ismert aktív kihasználás"]);
  const rr = {internet:"internetről", partner:"partnerhálózatról", vpn:"csak VPN-ről", nem:"nem elérhető"}[f.reach];
  o.push(["q3", rr, "elérhetőség: " + rr + ((f.kev && f.reach !== "nem") ? " → KEV + elérhető: P0, a többi kérdés nem módosítja" : "")]);
  if (f.kev && f.reach !== "nem") return o;
  o.push(["q4", f.impact||"", "érintett: " + (f.impact||"")]);
  o.push(["q5", f.comp||"", "kompenzáló kontroll: " + (f.comp||"")]);
  o.push(["q6", `L = ${f.L}, I = ${f.I}`, `becslés: L = ${f.L}, I = ${f.I}`]);
  const r = f.L*f.I;
  o.push(["q7", `R = ${r}`, `R = ${f.L} × ${f.I} = ${r}`]);
  const p = prioFromR(r);
  o.push(["q8", p, `R = ${r} → ${p}, SLA ${SLA[p]}`]);
  return o;
}
function ownFinding(){
  const L = Math.max(1, Math.min(5, Math.round(+document.getElementById("o_L").value || 1)));
  const I = Math.max(1, Math.min(5, Math.round(+document.getElementById("o_I").value || 1)));
  return {name:"saját", applicable: document.getElementById("o_app").checked, kev: document.getElementById("o_kev").checked,
          reach: document.getElementById("o_reach").value, L, I, impact:`I = ${I}`, comp:`(L = ${L} becslésében)`, note:"a beállított mezők szerint",
          cvss: +document.getElementById("o_cvss").value, ver: document.getElementById("o_ver").value};
}
function cur(){ const v = document.getElementById("fsel").value; return v === "own" ? ownFinding() : FIND[v]; }
function draw(){
  const f = cur(), A = answers(f), sel = document.getElementById("fsel").value;
  K = Math.max(0, Math.min(A.length - 1, K));
  const D = JSON.parse(JSON.stringify(DBASE));
  const passed = A.slice(0, K + 1).map(a => a[0]);
  D.nodes.forEach(n => { if (passed.includes(n.id)) n.fill = "g"; if (n.id === A[K][0]) n.hl = true; });
  const [p, stop] = triage(f), done = K === A.length - 1;
  if (sel !== "own") {
    const x = RAIL[sel], y = QY[A[K][0]] + QH[A[K][0]] / 2, xe = (A[K][0] === "q1" || A[K][0] === "q2" || A[K][0] === "q3") ? X0 : X0 + 20;
    D.edges.push({id:"rail", pts:[[x,150+110],[x,y],[xe,y]], label:"", ls:RLS[sel], lw:2.6});
    D.texts.push({x:x, y:136+110, s:sel, fs:19, bold:true});
  }
  A.slice(0, K + 1).forEach(a => { if (a[1] && !["q6","q7","q8"].includes(a[0])) D.texts.push({x:118, y:QY[a[0]] + 14, s:a[1], fs:18, ha:"left", italic:true}); });
  const lc = D.nodes.find(n => n.id === "lC");
  if (done && stop === "q1") D.nodes.find(n => n.id === "lA").hl = true;
  if (done && stop === "q3") D.nodes.find(n => n.id === "lB").hl = true;
  if (done && stop === "q8") { lc.hl = true; lc.label = `L = ${f.L}, I = ${f.I}, R = ${f.L*f.I}\n→ ${p} – ${SLA[p]}`; }
  dg_draw(svgEl, D);
  document.getElementById("cnt").textContent = `${K + 1}/${A.length}`;
  let msg = `${f.name || "saját"} – ${A[K][2]}.`;
  if (done) {
    msg += p ? `\nVégeredmény: ${p}, SLA ${SLA[p]}.` : "\nVégeredmény: lezárva, nem alkalmazható – nincs SLA.";
    let cv = sel === "own" ? f.cvss : parseFloat(String(FIND[sel].cvss).split("·")[1].replace(",", "."));
    if (p && ((cv >= 7 && (p === "P2" || p === "P3")) || (cv < 4 && (p === "P0" || p === "P1"))))
      msg += ` Figyelem: a CVSS (${String(cv).replace(".", ",")}) és a környezetre szabott prioritás (${p}) ellentétes irányba mutat – a döntést a ticketben indokolni kell.`;
  }
  statusEl.textContent = msg;
}
