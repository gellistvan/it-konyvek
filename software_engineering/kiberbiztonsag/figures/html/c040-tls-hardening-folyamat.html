<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TLS-konfiguráció megerősítése: döntések és visszacsatolás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Folyamatábra: az induló TLS-konfiguráció után sorban döntések: csak TLS 1.2/1.3 a protokoll?, AEAD-only a cipher?, csak ECDHE/DHE legalább 2048 bit a kulcscsere?, aktív a tanúsítvány-ellenőrzés?, be van állítva a HSTS? Nem esetén javító lépés (SSL 2/3 és TLS 1.0/1.1 tiltása; RC4, 3DES, CBC tiltása; statikus RSA és gyenge DH tiltása; kliensoldali hiba javítása; HSTS fokozatos hozzáadása), majd a következő döntés; végül scan, naplózás, dokumentáció, hiba esetén vissza a protokoll-ellenőrzéshez."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A folyamat iteratív: a scan és a naplózás visszacsatolást ad, a hibák javítása után újra ellenőrizni kell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kiinduló állapot: a csomópontok; a nyilak lépésenként jelennek meg.", "n": 0}, {"msg": "1. lépés: Induló TLS-konfiguráció → Protokoll: csak TLS 1.2/1.3?", "n": 1}, {"msg": "2. lépés: Protokoll: csak TLS 1.2/1.3? → SSL 2/3, TLS 1.0/1.1 tiltása (Nem)", "n": 2}, {"msg": "3. lépés: SSL 2/3, TLS 1.0/1.1 tiltása → Cipher: AEAD-only?", "n": 3}, {"msg": "4. lépés: Protokoll: csak TLS 1.2/1.3? → Cipher: AEAD-only? (Igen)", "n": 4}, {"msg": "5. lépés: Cipher: AEAD-only? → RC4, 3DES, CBC tiltása (Nem)", "n": 5}, {"msg": "6. lépés: RC4, 3DES, CBC tiltása → Kulcscsere: csak ECDHE/DHE ≥ 2048 bit?", "n": 6}, {"msg": "7. lépés: Cipher: AEAD-only? → Kulcscsere: csak ECDHE/DHE ≥ 2048 bit? (Igen)", "n": 7}, {"msg": "8. lépés: Kulcscsere: csak ECDHE/DHE ≥ 2048 bit? → Statikus RSA és gyenge DH tiltása (Nem)", "n": 8}, {"msg": "9. lépés: Statikus RSA és gyenge DH tiltása → Tanúsítvány- ellenőrzés aktív?", "n": 9}, {"msg": "10. lépés: Kulcscsere: csak ECDHE/DHE ≥ 2048 bit? → Tanúsítvány- ellenőrzés aktív? (Igen)", "n": 10}, {"msg": "11. lépés: Tanúsítvány- ellenőrzés aktív? → Kliensoldali hiba javítása (Nem)", "n": 11}, {"msg": "12. lépés: Kliensoldali hiba javítása → HSTS beállítva?", "n": 12}, {"msg": "13. lépés: Tanúsítvány- ellenőrzés aktív? → HSTS beállítva? (Igen)", "n": 13}, {"msg": "14. lépés: HSTS beállítva? → HSTS hozzáadása fokozatosan (Nem)", "n": 14}, {"msg": "15. lépés: HSTS hozzáadása fokozatosan → Scan, naplózás, dokumentáció", "n": 15}, {"msg": "16. lépés: HSTS beállítva? → Scan, naplózás, dokumentáció (Igen)", "n": 16}, {"msg": "17. lépés: Scan, naplózás, dokumentáció → Protokoll: csak TLS 1.2/1.3? (hiba)", "n": 17}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SC = {"W": 620, "H": 690, "clusters": [], "nodes": [{"id": "A", "x": 230, "y": 28, "w": 230.4, "h": 35.0, "kind": "round", "fill": 1.0, "ls": "-", "lines": ["Induló TLS-konfiguráció"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "B", "x": 230, "y": 118, "w": 178.0, "h": 60.0, "kind": "decision", "fill": 0.9, "ls": "-", "lines": ["Protokoll: csak", "TLS 1.2/1.3?"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "D", "x": 230, "y": 218, "w": 134.0, "h": 60.0, "kind": "decision", "fill": 0.9, "ls": "-", "lines": ["Cipher:", "AEAD-only?"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "K", "x": 230, "y": 318, "w": 230.8, "h": 60.0, "kind": "decision", "fill": 0.9, "ls": "-", "lines": ["Kulcscsere: csak", "ECDHE/DHE ≥ 2048 bit?"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "F", "x": 230, "y": 418, "w": 195.60000000000002, "h": 60.0, "kind": "decision", "fill": 0.9, "ls": "-", "lines": ["Tanúsítvány-", "ellenőrzés aktív?"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "H", "x": 230, "y": 518, "w": 134.0, "h": 60.0, "kind": "decision", "fill": 0.9, "ls": "-", "lines": ["HSTS", "beállítva?"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "J", "x": 230, "y": 628, "w": 274.40000000000003, "h": 35.0, "kind": "round", "fill": 1.0, "ls": "-", "lines": ["Scan, naplózás, dokumentáció"], "bold": true, "hatch": "", "lw": 1.4}, {"id": "C", "x": 505, "y": 118, "w": 204.0, "h": 54.0, "kind": "box", "fill": 1.0, "ls": "-", "lines": ["SSL 2/3, TLS 1.0/1.1", "tiltása"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "E", "x": 505, "y": 218, "w": 151.20000000000002, "h": 54.0, "kind": "box", "fill": 1.0, "ls": "-", "lines": ["RC4, 3DES, CBC", "tiltása"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "L", "x": 505, "y": 318, "w": 177.60000000000002, "h": 54.0, "kind": "box", "fill": 1.0, "ls": "-", "lines": ["Statikus RSA és", "gyenge DH tiltása"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "G", "x": 505, "y": 418, "w": 177.60000000000002, "h": 54.0, "kind": "box", "fill": 1.0, "ls": "-", "lines": ["Kliensoldali hiba", "javítása"], "bold": false, "hatch": "", "lw": 1.4}, {"id": "I", "x": 505, "y": 518, "w": 160.0, "h": 54.0, "kind": "box", "fill": 1.0, "ls": "-", "lines": ["HSTS hozzáadása", "fokozatosan"], "bold": false, "hatch": "", "lw": 1.4}], "edges": [{"pts": [[230.0, 45.5], [230.0, 88.0]], "ls": "-", "label": "", "lab": [230.0, 66.75], "g": 0}, {"pts": [[319.0, 118.0], [403.0, 118.0]], "ls": "-", "label": "Nem", "lab": [361.0, 118.0], "g": 1}, {"pts": [[505.0, 145.0], [505, 166], [230, 166], [230.0, 188.0]], "ls": "-", "label": "", "lab": [367.5, 166.0], "g": 2}, {"pts": [[230.0, 148.0], [230.0, 188.0]], "ls": "-", "label": "Igen", "lab": [256, 154], "g": 3}, {"pts": [[297.0, 218.0], [429.4, 218.0]], "ls": "-", "label": "Nem", "lab": [363.2, 218.0], "g": 4}, {"pts": [[505.0, 245.0], [505, 266], [230, 266], [230.0, 288.0]], "ls": "-", "label": "", "lab": [367.5, 266.0], "g": 5}, {"pts": [[230.0, 248.0], [230.0, 288.0]], "ls": "-", "label": "Igen", "lab": [256, 254], "g": 6}, {"pts": [[345.4, 318.0], [416.2, 318.0]], "ls": "-", "label": "Nem", "lab": [380.79999999999995, 318.0], "g": 7}, {"pts": [[505.0, 345.0], [505, 366], [230, 366], [230.0, 388.0]], "ls": "-", "label": "", "lab": [367.5, 366.0], "g": 8}, {"pts": [[230.0, 348.0], [230.0, 388.0]], "ls": "-", "label": "Igen", "lab": [256, 354], "g": 9}, {"pts": [[327.8, 418.0], [416.2, 418.0]], "ls": "-", "label": "Nem", "lab": [372.0, 418.0], "g": 10}, {"pts": [[505.0, 445.0], [505, 466], [230, 466], [230.0, 488.0]], "ls": "-", "label": "", "lab": [367.5, 466.0], "g": 11}, {"pts": [[230.0, 448.0], [230.0, 488.0]], "ls": "-", "label": "Igen", "lab": [256, 454], "g": 12}, {"pts": [[297.0, 518.0], [425.0, 518.0]], "ls": "-", "label": "Nem", "lab": [361.0, 518.0], "g": 13}, {"pts": [[505.0, 545.0], [505, 566], [230, 566], [230.0, 610.5]], "ls": "-", "label": "", "lab": [367.5, 566.0], "g": 14}, {"pts": [[230.0, 548.0], [230.0, 610.5]], "ls": "-", "label": "Igen", "lab": [256, 554], "g": 15}, {"pts": [[92.79999999999998, 628.0], [36, 628], [36, 118], [141.0, 118.0]], "ls": "-", "label": "hiba", "lab": [36, 380], "g": 16}]};
function gfill(g){ return g >= 0.99 ? css("--cell") : css("--cellhl"); }
function dash(ls){ return ls === "--" ? "7 4" : "none"; }
function poly(p){ return p.map(q => q[0] + "," + q[1]).join(" "); }
function render(s){
  svg.setAttribute("viewBox", "0 0 " + SC.W + " " + SC.H); svg.innerHTML = "";
  const fg = css("--line"), hl = css("--hl2"), muted = css("--muted");
  const defs = el("defs", {});
  for (const [id, col] of [["ah", fg], ["ahh", hl], ["ahf", muted]]) {
    const m = document.createElementNS(NS, "marker");
    m.setAttribute("id", id); m.setAttribute("viewBox", "0 0 10 10"); m.setAttribute("refX", "9"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "8"); m.setAttribute("markerHeight", "8"); m.setAttribute("orient", "auto");
    const p = document.createElementNS(NS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z"); p.setAttribute("fill", col);
    m.appendChild(p); defs.appendChild(m);
  }
  SC.clusters.forEach(c => {
    el("rect", {x: c.x, y: c.y, width: c.w, height: c.h, fill: gfill(c.fill), "fill-opacity": c.fill >= 0.99 ? 0 : 0.6,
                stroke: fg, "stroke-width": c.lw, "stroke-dasharray": dash(c.ls)});
    const ll = c.label.split("\n");
    ll.forEach((l, i) => el("text", {x: c.x + c.lab_dx, y: (c.bottom ? c.y + c.h - 9 - (ll.length - 1 - i) * 17 : c.y + 20 + i * 17), "font-size": 14, "font-weight": "bold"}, l));
  });
  SC.edges.forEach(e => {
    const cur = s.n > 0 && e.g === s.n - 1, shown = e.g < s.n;
    const col = cur ? hl : (shown ? fg : muted);
    el("polyline", {points: poly(e.pts), fill: "none", stroke: col, "stroke-width": cur ? 3.2 : 1.8,
                    "stroke-dasharray": dash(e.ls), "marker-end": "url(#" + (cur ? "ahh" : (shown ? "ah" : "ahf")) + ")",
                    opacity: shown ? 1 : 0.22});
  });
  SC.nodes.forEach(n => {
    const x0 = n.x - n.w / 2, y0 = n.y - n.h / 2;
    const sty = {fill: gfill(n.fill), stroke: fg, "stroke-width": n.lw, "stroke-dasharray": dash(n.ls)};
    if (n.kind === "decision") { const d = n.h / 2 * 0.7;
      el("polygon", Object.assign({points: poly([[x0, n.y], [x0 + d, y0], [x0 + n.w - d, y0], [x0 + n.w, n.y], [x0 + n.w - d, y0 + n.h], [x0 + d, y0 + n.h]])}, sty)); }
    else if (n.kind === "db") { const ry = 8;
      el("path", Object.assign({d: `M${x0},${y0 + ry} a${n.w / 2},${ry} 0 0 1 ${n.w},0 v${n.h - 2 * ry} a${n.w / 2},${ry} 0 0 1 ${-n.w},0 z`}, sty));
      el("path", {d: `M${x0},${y0 + ry} a${n.w / 2},${ry} 0 0 0 ${n.w},0`, fill: "none", stroke: fg, "stroke-width": n.lw}); }
    else el("rect", Object.assign({x: x0, y: y0, width: n.w, height: n.h, rx: n.kind === "round" ? 12 : 4}, sty));
    const off = n.kind === "db" ? 4 : 0, t0 = n.y + off - (n.lines.length - 1) * 9.5;
    n.lines.forEach((l, i) => el("text", {x: n.x, y: t0 + i * 19 + 5, "text-anchor": "middle", "font-size": 15,
                                          "font-weight": n.bold ? "bold" : "normal"}, l));
  });
  SC.edges.forEach(e => { if (e.label && e.g < s.n) {
    const ll = e.label.split("\n"), w = Math.max(...ll.map(x => x.length)) * 8 + 10, h = ll.length * 18 + 4;
    el("rect", {x: e.lab[0] - w / 2, y: e.lab[1] - h / 2, width: w, height: h, fill: css("--bg"), opacity: 0.9});
    ll.forEach((l, i) => el("text", {x: e.lab[0], y: e.lab[1] - h / 2 + 15 + i * 18, "text-anchor": "middle", "font-size": 14, "font-weight": e.g === s.n - 1 ? "bold" : "normal"}, l)); } });
  svg.insertBefore(defs, svg.firstChild);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
