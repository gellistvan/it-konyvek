<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPV ikonrács</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

.big{font-size:18px;font-weight:bold}
output{display:inline-block;min-width:3.6em;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
<label>Előzetes valószínűség P(V=1) <input type="range" id="p" min="0.001" max="0.5" step="0.001"><output id="po"></output></label>
<label>Érzékenység <input type="range" id="se" min="0.5" max="1" step="0.01"><output id="seo"></output></label>
<label>Hamis pozitív ráta <input type="range" id="fp" min="0" max="0.2" step="0.005"><output id="fpo"></output></label>
<button id="book" type="button">Könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 470" role="img" aria-label="1000 gazdagép ikonrácsa: sebezhető és nem sebezhető, jelzett és nem jelzett cellák"></svg>
<p class="small">Feltételezett, szemléltető értékek, nem egy adott scanner mérése. A rácson a várható hamis pozitív szám
egészre kerekítve; a PPV a pontos képletből számolva.</p>
<script>
const BOOK = {"p": 0.01, "sens": 0.9, "fpr": 0.05}, N=1000, COLS=40, ROWS=25;
const svg=document.getElementById("v"), NS="http://www.w3.org/2000/svg";
function mk(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function c(x,d){return x.toFixed(d).replace(".",",");}
function counts(p,se,fp){const v=Math.round(N*p), tp=Math.round(v*se), fpe=(N-v)*fp, fpn=Math.round(fpe);
  return {v:v,tp:tp,fn:v-tp,fpe:fpe,fp:fpn,tn:N-v-fpn,ppv:(p*se+fp*(1-p))>0? p*se/(p*se+fp*(1-p)) : 0,flag:v*se+fpe};}
function draw(){
  const p=+document.getElementById("p").value, se=+document.getElementById("se").value, fp=+document.getElementById("fp").value;
  document.getElementById("po").textContent=c(p,3); document.getElementById("seo").textContent=c(se,2); document.getElementById("fpo").textContent=c(fp,3);
  const C=counts(p,se,fp);
  svg.innerHTML="";
  const fg=css("--fg"), dark=css("--fill1"), mut=css("--muted");
  const d=mk("defs",{}); d.innerHTML=`<pattern id="hh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="${fg}" stroke-width="1"/></pattern>`;
  const cats=[].concat(Array(C.tp).fill("tp"),Array(C.fn).fill("fn"),Array(C.fp).fill("fp"),Array(Math.max(C.tn,0)).fill("tn"));
  const s=15.5, g=3;
  cats.forEach((cat,i)=>{const r=Math.floor(i/COLS), col=i%COLS, x=10+col*s, y=8+r*s, w=s-g;
    const vul=(cat==="tp"||cat==="fn");
    mk("rect",{x:x,y:y,width:w,height:w,fill:vul?dark:css("--bg"),stroke:vul?fg:mut,"stroke-width":0.5});
    if(cat==="fp")mk("rect",{x:x,y:y,width:w,height:w,fill:"url(#hh)"});
    if(cat==="tp"||cat==="fp")mk("rect",{x:x-1.2,y:y-1.2,width:w+2.4,height:w+2.4,fill:"none",stroke:fg,"stroke-width":1.6});});
  const L=[["tp","valódi pozitív: "+C.tp],["fn","hamis negatív: "+C.fn],["fp","hamis pozitív: "+c(C.fpe,1)+" ≈ "+C.fp],["tn","nem sebezhető, nem jelzett: "+C.tn]];
  L.forEach((l,k)=>{const x=10+(k%2)*310, y=405+Math.floor(k/2)*24, vul=(l[0]==="tp"||l[0]==="fn");
    mk("rect",{x:x,y:y,width:12,height:12,fill:vul?dark:css("--bg"),stroke:vul?fg:mut});
    if(l[0]==="fp")mk("rect",{x:x,y:y,width:12,height:12,fill:"url(#hh)"});
    if(l[0]==="tp"||l[0]==="fp")mk("rect",{x:x-1.2,y:y-1.2,width:14.4,height:14.4,fill:"none",stroke:fg,"stroke-width":1.6});
    mk("text",{x:x+20,y:y+11,"font-size":14},l[1]);});
  const num=c(se,2)+" · "+c(p,3), den=num+" + "+c(fp,3)+" · "+c(1-p,3);
  document.getElementById("status").innerHTML=`<span class="big">PPV = ${c(C.ppv,2)} (${c(C.ppv*100,1)}%)</span><br>P(V=1 | S=1) = ${num} / (${den}) · Jelzett: ${C.tp} + ${c(C.fpe,1)} → ${C.tp} valódi`;
}
function setv(o){document.getElementById("p").value=o.p;document.getElementById("se").value=o.sens;document.getElementById("fp").value=o.fpr;draw();}
["p","se","fp"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
document.getElementById("book").onclick=()=>setv(BOOK);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
setv(BOOK);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
