<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPO és RTO idővonal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--bar:#cfcfcf;--hl:#1f4e79;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--bar:#5a5a5a;--hl:#8fb8e8;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:max-content 1fr 5.5em;gap:4px 10px;align-items:center;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
button{font:inherit;padding:3px 10px;cursor:pointer}
#status{margin:6px 0;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Időpontok és célértékek">
  <label for="last">utolsó sikeres mentés</label><input type="range" id="last" min="360" max="840" step="5"><output id="o_last"></output>
  <label for="out">kiesés</label><input type="range" id="out" min="360" max="840" step="5"><output id="o_out"></output>
  <label for="done">helyreállítás vége</label><input type="range" id="done" min="360" max="840" step="5"><output id="o_done"></output>
  <label for="rpo">RPO-cél (perc)</label><input type="range" id="rpo" min="15" max="240" step="5"><output id="o_rpo"></output>
  <label for="rto">RTO-cél (perc)</label><input type="range" id="rto" min="30" max="480" step="10"><output id="o_rto"></output>
</div>
<div class="row">
  <button id="tog" type="button" aria-pressed="false">08:00-s mentés sikeres</button>
  <button id="reset" type="button">a könyv példája</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 330" role="img" aria-label="Időtengely 06:00 és 14:00 UTC között: az adatvesztési ablak a kieséstől visszafelé az utolsó sikeres mentésig, a helyreállítás a kieséstől előre; mellettük szaggatott keretben az RPO- és az RTO-cél."></svg>
<p class="small">Szemléltetés, nem valós incidens; a kezdőállapot a fejezet példája (07:00 mentés, 08:00 kimaradt, 08:25 kiesés, 12:20 helyreállítás, RPO 1 óra, RTO 4 óra). A hatórás visszaállítási teszt (6 óra &gt; 4 óra RTO, +2 óra) a statikus ábra alsó paneljén.</p>
<script>
const EX = {"last": 420, "outage": 505, "done": 740, "rpo": 60, "rto": 240};
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function mk(tag, a, t){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (t !== undefined) e.textContent = t; svg.appendChild(e); return e; }
function cv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function hm(x){ const h = Math.floor(x / 60), mm = x % 60; return String(h).padStart(2, "0") + ":" + String(mm).padStart(2, "0"); }
function dur(x){ x = Math.abs(Math.round(x)); const h = Math.floor(x / 60), mm = x % 60; if (h && mm) return `${h} óra ${mm} perc`; return h ? `${h} óra` : `${mm} perc`; }
const T0 = 360, T1 = 840, XL = 40, XR = 980;
function X(t){ return XL + (t - T0) * (XR - XL) / (T1 - T0); }
const ids = ["last", "out", "done", "rpo", "rto"];
function val(id){ return +document.getElementById(id).value; }
function setv(id, v){ document.getElementById(id).value = v; }
function reset(){ setv("last", EX.last); setv("out", EX.outage); setv("done", EX.done); setv("rpo", EX.rpo); setv("rto", EX.rto); draw(); }
function draw(){
  let last = val("last"), out = val("out"), done = val("done");
  const rpo = val("rpo"), rto = val("rto");
  if (last > out) { last = out; setv("last", out); }
  if (done < out) { done = out; setv("done", out); }
  document.getElementById("o_last").textContent = hm(last);
  document.getElementById("o_out").textContent = hm(out);
  document.getElementById("o_done").textContent = hm(done);
  document.getElementById("o_rpo").textContent = dur(rpo);
  document.getElementById("o_rto").textContent = dur(rto);
  document.getElementById("tog").setAttribute("aria-pressed", String(last === 480));
  const loss = out - last, rec = done - out, rpoOk = loss <= rpo, rtoOk = rec <= rto;
  svg.innerHTML = "";
  const d = mk("defs", {});
  d.innerHTML = `<pattern id="hp" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${cv("--fg")}" stroke-width="1.2"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${cv("--fg")}"/></marker>`;
  for (let t = T0; t <= T1; t += 60) { mk("line", {x1: X(t), y1: 20, x2: X(t), y2: 300, stroke: cv("--muted"), "stroke-dasharray": "2 4"}); mk("text", {x: X(t), y: 322, "text-anchor": "middle", "font-size": 14}, hm(t)); }
  // RTO-cél és mért helyreállítás
  mk("rect", {x: X(out), y: 22, width: X(out + rto) - X(out), height: 32, fill: "none", stroke: cv("--fg"), "stroke-dasharray": "7 4", "stroke-width": 1.6});
  mk("text", {x: X(out) + 6, y: 43, "font-size": 14}, `RTO-cél ${dur(rto)}`);
  mk("rect", {x: X(out), y: 62, width: Math.max(1, X(done) - X(out)), height: 32, fill: cv("--bar"), stroke: cv("--fg")});
  if (rec > rto) mk("rect", {x: X(out + rto), y: 62, width: X(done) - X(out + rto), height: 32, fill: "url(#hp)", stroke: cv("--fg")});
  mk("text", {x: X(out) + 6, y: 83, "font-size": 14}, `mért helyreállítás ${dur(rec)}`);
  // események
  const ye = 140;
  mk("line", {x1: XL, y1: ye, x2: XR, y2: ye, stroke: cv("--fg")});
  mk("circle", {cx: X(last), cy: ye, r: 8, fill: cv("--fg")});
  mk("text", {x: X(last), y: ye - 16, "text-anchor": "middle", "font-size": 13}, `${hm(last)} mentés`);
  if (last < 480 && out > 480) { mk("circle", {cx: X(480), cy: ye, r: 8, fill: cv("--bg"), stroke: cv("--fg"), "stroke-width": 1.5});
    mk("path", {d: `M${X(480) - 6} ${ye - 6}L${X(480) + 6} ${ye + 6}M${X(480) - 6} ${ye + 6}L${X(480) + 6} ${ye - 6}`, stroke: cv("--fg"), "stroke-width": 1.8});
    mk("text", {x: X(480), y: ye + 26, "text-anchor": "middle", "font-size": 13}, "08:00 kimaradt"); }
  mk("text", {x: X(out), y: ye + 7, "text-anchor": "middle", "font-size": 22}, "⚡");
  mk("text", {x: X(out) + 4, y: ye - 16, "font-size": 13}, `${hm(out)} kiesés`);
  mk("text", {x: X(done), y: ye + 7, "text-anchor": "middle", "font-size": 20, "font-weight": "bold"}, "✓");
  mk("text", {x: X(done), y: ye + 26, "text-anchor": "middle", "font-size": 13}, `${hm(done)} kész`);
  // mért adatvesztési ablak és RPO-cél
  mk("rect", {x: X(last), y: 186, width: Math.max(1, X(out) - X(last)), height: 32, fill: cv("--bar"), stroke: cv("--fg")});
  if (loss > rpo) mk("rect", {x: X(last), y: 186, width: X(out - rpo) - X(last), height: 32, fill: "url(#hp)", stroke: cv("--fg")});
  mk("text", {x: X(out) + 6, y: 207, "font-size": 14}, `mért adatvesztési ablak ${dur(loss)}`);
  mk("rect", {x: X(Math.max(T0, out - rpo)), y: 228, width: X(out) - X(Math.max(T0, out - rpo)), height: 32, fill: "none", stroke: cv("--fg"), "stroke-dasharray": "7 4", "stroke-width": 1.6});
  mk("text", {x: X(out) + 6, y: 249, "font-size": 14}, `RPO-cél ${dur(rpo)} (visszafelé)`);
  mk("line", {x1: X(out), y1: 274, x2: X(last), y2: 274, stroke: cv("--fg"), "marker-end": "url(#ar)"});
  mk("text", {x: (X(out) + X(last)) / 2, y: 292, "text-anchor": "middle", "font-size": 12, "font-style": "italic"}, "visszafelé");
  mk("line", {x1: X(out), y1: 108, x2: X(done), y2: 108, stroke: cv("--fg"), "marker-end": "url(#ar)"});
  const s1 = `adatvesztési ablak: ${dur(loss)}, RPO ${rpoOk ? "teljesült" : "nem teljesült"}` + (loss === rpo ? "" : ` (eltérés: ${loss > rpo ? "+" : "−"}${dur(loss - rpo)})`);
  const s2 = `helyreállítás: ${dur(rec)}, RTO ${rtoOk ? "teljesült" : "nem teljesült"}` + (rec === rto ? "" : ` (eltérés: ${rec > rto ? "+" : "−"}${dur(rec - rto)})`);
  document.getElementById("status").textContent = s1 + "\n" + s2;
}
ids.forEach(id => document.getElementById(id).addEventListener("input", draw));
document.getElementById("tog").onclick = () => { setv("last", val("last") === 480 ? 420 : 480); draw(); };
document.getElementById("reset").onclick = reset;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
reset();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
