<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SameSite és a cookie csatolása</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--ok:#1e6b2e;--bad:#b00020;--cell:#fff;--cellhl:#d9d9d9;--cell2:#eeeeee;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--ok:#7fd08f;--bad:#ff8a9a;--cell:#262626;--cellhl:#4a4a4a;--cell2:#333;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{flex:1;min-width:120px}
label{display:inline-flex;gap:6px;align-items:center}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-x:auto}
pre span{display:block;padding:0 4px}
pre span.on{outline:2px solid var(--hl);font-weight:bold}
code{font:12.5px ui-monospace,monospace;background:var(--code);padding:0 3px}
.small{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div role="region" aria-label="SameSite-attribútum és kéréstípus szerint csatolja-e a böngésző a cookie-t">

<div class="ctl">
  <label>Attribútum: <select id="a"><option value="strict">Strict</option><option value="lax" selected>Lax (explicit)</option><option value="default">nincs SameSite (default Lax)</option><option value="none">None; Secure</option><option value="none_insecure">None, Secure nélkül</option></select></label>
  <label>Kérés: <select id="r"><option value="same">azonos site-ról bármilyen kérés</option><option value="top_get">cross-site felső szintű GET (link)</option><option value="top_post" selected>cross-site felső szintű POST (űrlap)</option><option value="sub">cross-site <img> / iframe / fetch</option><option value="subdomain">same-site, cross-origin aldomain: app.example.invalid → login.example.invalid</option></select></label>
  <button id="go">▶ Kérés lejátszása</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="anim" viewBox="0 0 720 150" role="img" aria-label="Animált kérés: oldal, böngésző cookie-tára, szerver"></svg>
<svg id="mat" viewBox="0 0 720 285" role="img" aria-label="SameSite-mátrix: kattints egy cellára"></svg>

</div>
<p class="small">A lap valós cookie-t nem állít be; a döntés a fejezet 1.3 szakaszának szabályaiból előre számolt. Az aldomain-példa same-site (közös regisztrált domain), de cross-origin.</p>
<script>
const DATA = {"strict": {"same": ["send", "Azonos oldali (same-site) kérésnél a böngésző minden SameSite-érték mellett csatolja a cookie-t."], "top_get": ["no", "A Strict a cookie-t csak azonos oldalról indított kérésnél küldi el, cross-site top-level navigációnál sem."], "top_post": ["no", "A Strict a cookie-t csak azonos oldalról indított kérésnél küldi el, cross-site top-level navigációnál sem."], "sub": ["no", "A Strict a cookie-t csak azonos oldalról indított kérésnél küldi el, cross-site top-level navigációnál sem."], "subdomain": ["send", "Az app.example.invalid → login.example.invalid kérés cross-origin, de same-site (közös regisztrált domain), ezért a SameSite nem korlátozza: a cookie csatolódik."]}, "lax": {"same": ["send", "Azonos oldali (same-site) kérésnél a böngésző minden SameSite-érték mellett csatolja a cookie-t."], "top_get": ["send", "A Lax a felső szintű, biztonságos metódusú cross-site navigációnál (linkre kattintásból származó GET) csatolja a cookie-t."], "top_post": ["no", "A Lax a cross-site POST űrlapnál nem csatolja a cookie-t."], "sub": ["no", "A Lax cross-site alerőforrás-kérésben (kép, iframe, AJAX) nem küldi el a cookie-t."], "subdomain": ["send", "Az app.example.invalid → login.example.invalid kérés cross-origin, de same-site (közös regisztrált domain), ezért a SameSite nem korlátozza: a cookie csatolódik."]}, "default": {"same": ["send", "Azonos oldali (same-site) kérésnél a böngésző minden SameSite-érték mellett csatolja a cookie-t."], "top_get": ["send", "Hiányzó SameSite: a modern böngészők default Lax módot alkalmaznak. A Lax a felső szintű, biztonságos metódusú cross-site navigációnál (linkre kattintásból származó GET) csatolja a cookie-t."], "top_post": ["dep", "Hiányzó SameSite: default Lax, de egyes böngészőknél a nemrég (kb. 2 percen belül) létrehozott cookie-kra a felső szintű cross-site POST kivételt élvezhet – böngészőfüggő."], "sub": ["no", "Hiányzó SameSite: a modern böngészők default Lax módot alkalmaznak. A Lax cross-site alerőforrás-kérésben (kép, iframe, AJAX) nem küldi el a cookie-t."], "subdomain": ["send", "Az app.example.invalid → login.example.invalid kérés cross-origin, de same-site (közös regisztrált domain), ezért a SameSite nem korlátozza: a cookie csatolódik."]}, "none": {"same": ["send", "Azonos oldali (same-site) kérésnél a böngésző minden SameSite-érték mellett csatolja a cookie-t."], "top_get": ["send", "A None a cross-site kérésnél is elküldheti a cookie-t; a böngésző adatvédelmi szabályai (harmadik féltől származó cookie-k tiltása, ITP, particionálás) ezt felülírhatják."], "top_post": ["send", "A None a cross-site kérésnél is elküldheti a cookie-t; a böngésző adatvédelmi szabályai (harmadik féltől származó cookie-k tiltása, ITP, particionálás) ezt felülírhatják."], "sub": ["send", "A None a cross-site kérésnél is elküldheti a cookie-t; a böngésző adatvédelmi szabályai (harmadik féltől származó cookie-k tiltása, ITP, particionálás) ezt felülírhatják."], "subdomain": ["send", "Az app.example.invalid → login.example.invalid kérés cross-origin, de same-site (közös regisztrált domain), ezért a SameSite nem korlátozza: a cookie csatolódik."]}, "none_insecure": {"same": ["rejected", "A böngészők elutasítják a SameSite=None cookie-t Secure nélkül: a cookie el sem tárolódik, így semmilyen kéréshez nem csatolódik."], "top_get": ["rejected", "A böngészők elutasítják a SameSite=None cookie-t Secure nélkül: a cookie el sem tárolódik, így semmilyen kéréshez nem csatolódik."], "top_post": ["rejected", "A böngészők elutasítják a SameSite=None cookie-t Secure nélkül: a cookie el sem tárolódik, így semmilyen kéréshez nem csatolódik."], "sub": ["rejected", "A böngészők elutasítják a SameSite=None cookie-t Secure nélkül: a cookie el sem tárolódik, így semmilyen kéréshez nem csatolódik."], "subdomain": ["rejected", "A böngészők elutasítják a SameSite=None cookie-t Secure nélkül: a cookie el sem tárolódik, így semmilyen kéréshez nem csatolódik."]}};

const NS = "http://www.w3.org/2000/svg";
function mk(parent, tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;parent.appendChild(e);return e;}
function cv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const AK = ["strict","lax","default","none","none_insecure"], RK = ["same","top_get","top_post","sub","subdomain"];
const AL = ["Strict","Lax (explicit)","nincs SameSite","None; Secure","None, Secure nélkül"];
const AH = ["Strict","Lax (explicit)","nincs SameSite","None; Secure","None, Secure ∅"];
const RL = ["azonos site-ról bármi","cross-site felső szintű GET","cross-site felső szintű POST","cross-site img/iframe/fetch","same-site aldomain (app→login)"];
const WORD = {send: "csatolja", no: "nem csatolja", dep: "böngészőfüggő", rejected: "elutasítva (nincs tárolva)"};
const A = document.getElementById("anim"), Mx = document.getElementById("mat");
let raf = null;
function sym(g, x, y, k){
  if (k === "send") { mk(g, "circle", {cx: x, cy: y, r: 11, fill: cv("--fg")}); mk(g, "text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 14, fill: cv("--bg")}, "✓"); }
  else if (k === "no") { mk(g, "circle", {cx: x, cy: y, r: 11, fill: "none", stroke: cv("--fg"), "stroke-width": 1.5}); mk(g, "text", {x: x, y: y + 5, "text-anchor": "middle", "font-size": 14}, "✗"); }
  else if (k === "dep") { mk(g, "circle", {cx: x, cy: y, r: 11, fill: "none", stroke: cv("--fg"), "stroke-width": 1.5}); mk(g, "path", {d: `M${x} ${y-11} A11 11 0 0 0 ${x} ${y+11} Z`, fill: cv("--muted")}); mk(g, "text", {x: x + 16, y: y + 5, "font-size": 14, "font-weight": "bold"}, "?"); }
  else { mk(g, "rect", {x: x - 10, y: y - 10, width: 20, height: 20, fill: "none", stroke: cv("--fg"), "stroke-dasharray": "3 2"}); mk(g, "line", {x1: x - 10, y1: y + 10, x2: x + 10, y2: y - 10, stroke: cv("--fg")}); }
}
function matrix(a, r){
  Mx.innerHTML = "";
  const L = 230, C = 98, H0 = 40, RH = 40;
  AL.forEach((t, j) => { mk(Mx, "rect", {x: L + j*C, y: 0, width: C, height: H0, fill: AK[j] === a ? cv("--cellhl") : cv("--cell2"), stroke: cv("--line")}); mk(Mx, "text", {x: L + j*C + C/2, y: 24, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, AH[j]); });
  RL.forEach((t, i) => {
    const y = H0 + i*RH;
    mk(Mx, "rect", {x: 0, y: y, width: L, height: RH, fill: RK[i] === r ? cv("--cellhl") : cv("--cell2"), stroke: cv("--line")});
    mk(Mx, "text", {x: 6, y: y + 25, "font-size": 12}, t);
    AK.forEach((ak, j) => {
      const on = ak === a && RK[i] === r;
      const c = mk(Mx, "rect", {x: L + j*C, y: y, width: C, height: RH, fill: cv("--cell"), stroke: cv("--line"), "stroke-width": on ? 3.5 : 1, tabindex: 0, role: "button", "aria-label": AL[j] + ", " + t + ": " + WORD[DATA[ak][RK[i]][0]]});
      c.style.cursor = "pointer";
      c.addEventListener("click", () => pick(ak, RK[i]));
      c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(ak, RK[i]); } });
      sym(Mx, L + j*C + C/2, y + RH/2, DATA[ak][RK[i]][0]);
    });
  });
  mk(Mx, "text", {x: 0, y: H0 + 5*RH + 20, "font-size": 11.5, fill: cv("--muted")}, "? hiányzó SameSite: a ~2 perces Lax+POST kivétel böngészőfüggő. ∅ = Secure nélkül: a cookie-t a böngésző elutasítja.");
  mk(Mx, "text", {x: 0, y: H0 + 5*RH + 38, "font-size": 11.5, fill: cv("--muted")}, "None: a harmadik féltől származó cookie-k tiltása / particionálás felülírhatja.");
}
function scene(a, r, t){
  // t: 0..1 animációs fázis
  A.innerHTML = "";
  const [k] = DATA[a][r];
  const cross = !(r === "same" || r === "subdomain");
  const box = (x, lab, sub) => { mk(A, "rect", {x: x, y: 30, width: 150, height: 70, rx: 8, fill: cv("--cell2"), stroke: cv("--line")}); mk(A, "text", {x: x + 75, y: 58, "text-anchor": "middle", "font-size": 13, "font-weight": "bold"}, lab); mk(A, "text", {x: x + 75, y: 80, "text-anchor": "middle", "font-size": 11, fill: cv("--muted")}, sub); };
  box(10, "Kezdeményező oldal", r === "subdomain" ? "app.example.invalid" : (cross ? "más site" : "azonos site"));
  box(285, "Böngésző cookie-tára", k === "rejected" ? "üres (None Secure nélkül)" : "sessionid (" + AL[AK.indexOf(a)] + ")");
  box(560, "Szerver", r === "subdomain" ? "login.example.invalid" : "app.example.invalid");
  mk(A, "line", {x1: 160, y1: 65, x2: 285, y2: 65, stroke: cv("--line"), "stroke-width": 1.5});
  mk(A, "line", {x1: 435, y1: 65, x2: 560, y2: 65, stroke: cv("--line"), "stroke-width": 1.5});
  // kérés-boríték
  const x = 160 + t * 380;
  mk(A, "rect", {x: x, y: 108, width: 60, height: 26, rx: 4, fill: cv("--cell"), stroke: cv("--line"), "stroke-width": 1.5});
  mk(A, "text", {x: x + 30, y: 126, "text-anchor": "middle", "font-size": 11}, "kérés");
  const attached = (k === "send" || k === "dep") && t > 0.45;
  const cx = attached ? x + 64 : 360, cy = attached ? 121 : (t > 0.45 && k !== "rejected" ? 140 : 121);
  if (k !== "rejected") { mk(A, "circle", {cx: cx, cy: cy, r: 9, fill: k === "dep" ? cv("--muted") : cv("--hl2"), stroke: cv("--line")}); mk(A, "text", {x: cx, y: cy + 4, "text-anchor": "middle", "font-size": 10, fill: cv("--bg")}, "C"); }
  if (t >= 1) mk(A, "text", {x: 560, y: 20, "font-size": 12, "font-weight": "bold"}, k === "send" ? "Cookie megérkezett" : (k === "dep" ? "Böngészőfüggő" : "Cookie nélkül érkezett"));
}
function pick(a, r){
  document.getElementById("a").value = a; document.getElementById("r").value = r;
  const [k, q] = DATA[a][r];
  document.getElementById("status").textContent = AL[AK.indexOf(a)] + " × " + RL[RK.indexOf(r)] + " → " + WORD[k] + ". " + q;
  matrix(a, r); scene(a, r, 1);
}
function play(){
  const a = document.getElementById("a").value, r = document.getElementById("r").value;
  pick(a, r);
  if (raf) cancelAnimationFrame(raf);
  const t0 = performance.now();
  const step = now => { const t = Math.min(1, (now - t0) / 1600); scene(a, r, t); if (t < 1) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}
document.getElementById("a").onchange = () => pick(document.getElementById("a").value, document.getElementById("r").value);
document.getElementById("r").onchange = () => pick(document.getElementById("a").value, document.getElementById("r").value);
document.getElementById("go").onclick = play;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => pick(document.getElementById("a").value, document.getElementById("r").value));
pick("lax", "top_post");

</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
