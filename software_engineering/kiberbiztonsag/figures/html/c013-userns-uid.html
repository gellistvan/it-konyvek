<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User namespace UID-leképezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl"><label for="c">konténer-UID: <b id="cv">1000</b></label><input id="c" type="range" min="0" max="65535" step="1" value="1000" oninput="update()" aria-label="Konténer-UID"><button onclick="document.getElementById('c').value=0;update()">0</button><button onclick="document.getElementById('c').value=1000;update()">1000</button><button onclick="document.getElementById('c').value=65535;update()">65535</button></div><div class="ctl"><label><input type="checkbox" id="ns" onchange="update()"> user namespace (hostUsers: false, uid_map 0 100000 65536)</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 880 400" role="img" aria-label="Két számegyenes: konténer-UID 0–65535 és host-UID 0–200000; a kiválasztott konténer-UID nyíllal a host-UID-re képződik le; user namespace nélkül azonos, uid_map 0 100000 65536 mellett host = 100000 + c."></svg>
<p class="small">Leképezés a uid_map sora szerint: belső kezdet 0, külső kezdet 100000, hossz 65536. Kezdőállapot: runAsUser 1000, user namespace nélkül (host-UID 1000).</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

const SC_COL = {fg: "--fg", muted: "--muted", bg: "--bg", g1: "--sc-g1", g2: "--sc-g2", g3: "--sc-g3",
  hl: "--hl", hl2: "--hl2", hlf: "--sc-hlf", hl2f: "--sc-hl2f", ok: "--sc-ok", err: "--sc-err", okf: "--sc-okf", errf: "--sc-errf"};
const SC_DASH = {solid: "", dash: "6 3.5", dot: "1.2 2.2", dashdot: "7 3 1.5 3", longdash: "10 4"};
function scCol(c, d){ c = c || d; if (c === "none") return "none"; const v = SC_COL[c]; return v ? css(v) : c; }
function scDefs(){
  const d = document.createElementNS(NS, "defs"), f = css("--fg");
  const pat = (id, body) => `<pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse">${body}</pattern>`;
  d.innerHTML =
    ["fg", "muted", "hl", "hl2", "g3", "ok", "err"].map(c => `<marker id="scah-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${scCol(c)}"/></marker>`).join("") +
    pat("h-sl", `<path d="M0,7L7,0M-1,1L1,-1M6,8L8,6" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-bs", `<path d="M0,0L7,7M6,-1L8,1M-1,6L1,8" stroke="${f}" stroke-width="0.9"/>`) +
    pat("h-dt", `<circle cx="3.5" cy="3.5" r="1" fill="${f}"/>`) +
    pat("h-xx", `<path d="M0,7L7,0M0,0L7,7" stroke="${f}" stroke-width="0.8"/>`) +
    pat("h-hz", `<path d="M0,3.5L7,3.5" stroke="${f}" stroke-width="0.9"/>`);
  svg.appendChild(d);
}
const SC_HATCH = {"//": "h-sl", "///": "h-sl", "////": "h-sl", "\\\\": "h-bs", "\\\\\\\\": "h-bs", "..": "h-dt", "...": "h-dt", "xx": "h-xx", "--": "h-hz"};
function scDraw(prims, ox, oy){
  ox = ox || 0; oy = oy || 0;
  for (const p of prims) {
    const st = p[p.length - 1] || {};
    if (p[0] === "rect") {
      const x = p[1], y = p[2], w = p[3], h = p[4], ec = scCol(st.stroke, "fg"), lw = st.lw === undefined ? 1.2 : st.lw;
      const a = {x: x + ox, y: y + oy, width: w, height: h, fill: scCol(st.fill, "bg"), stroke: ec, "stroke-width": lw};
      if (st.rx) a.rx = st.rx;
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      el("rect", a);
      if (st.hatch && SC_HATCH[st.hatch]) el("rect", {x: x + ox, y: y + oy, width: w, height: h, fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none", rx: st.rx || 0});
      if (st.cross) { el("line", {x1: x + ox, y1: y + oy, x2: x + ox + w, y2: y + oy + h, stroke: ec, "stroke-width": lw * 1.1});
                      el("line", {x1: x + ox, y1: y + oy + h, x2: x + ox + w, y2: y + oy, stroke: ec, "stroke-width": lw * 1.1}); }
    } else if (p[0] === "circ") {
      const a = {cx: p[1] + ox, cy: p[2] + oy, r: p[3], fill: scCol(st.fill, "bg"), stroke: scCol(st.stroke, "fg"), "stroke-width": st.lw === undefined ? 1.2 : st.lw};
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      el("circle", a);
      if (st.hatch && SC_HATCH[st.hatch]) el("circle", {cx: p[1] + ox, cy: p[2] + oy, r: p[3], fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"});
    } else if (p[0] === "line" || p[0] === "poly") {
      const pts = p[0] === "line" ? [[p[1], p[2]], [p[3], p[4]]] : p[1];
      const c = scCol(st.color, "fg"), lw = st.lw === undefined ? 1.2 : st.lw;
      const d = pts.map((q, i) => (i ? "L" : "M") + (q[0] + ox).toFixed(1) + "," + (q[1] + oy).toFixed(1)).join(" ") + (st.closed ? " Z" : "");
      if (st.fill && st.fill !== "none") {
        el("path", {d: d + " Z", fill: scCol(st.fill), stroke: "none"});
        if (st.hatch && SC_HATCH[st.hatch]) el("path", {d: d + " Z", fill: `url(#${SC_HATCH[st.hatch]})`, stroke: "none"});
      }
      const mk = `url(#scah-${["muted", "hl", "hl2", "g3", "ok", "err"].includes(st.color) ? st.color : "fg"})`;
      const a = {d: d, fill: "none", stroke: c, "stroke-width": Math.max(lw, 0.01)};
      if (lw < 0.05) a.stroke = "none";
      if (st.ls && st.ls !== "solid") a["stroke-dasharray"] = SC_DASH[st.ls];
      if (st.arrow) a["marker-end"] = mk;
      if (st.arrow0) a["marker-start"] = mk;
      if (lw < 0.05 && st.arrow) { // csak nyílhegy (dupla nyílnál)
        const n = pts.length, q0 = pts[n - 2], q1 = pts[n - 1], ang = Math.atan2(q1[1] - q0[1], q1[0] - q0[0]);
        const x = q1[0] + ox, y = q1[1] + oy, s = 11;
        el("path", {d: `M${x},${y}L${x - s * Math.cos(ang) + s * 0.5 * Math.sin(ang)},${y - s * Math.sin(ang) - s * 0.5 * Math.cos(ang)}L${x - s * Math.cos(ang) - s * 0.5 * Math.sin(ang)},${y - s * Math.sin(ang) + s * 0.5 * Math.cos(ang)}Z`, fill: c});
      } else el("path", a);
    } else if (p[0] === "text") {
      const a = {x: p[1] + ox, y: p[2] + oy, "font-size": st.size || 15, "text-anchor": st.anchor || "start"};
      if (st.color && st.color !== "fg") a.fill = scCol(st.color);
      if (st.weight && st.weight !== "normal") a["font-weight"] = st.weight;
      if (st.italic) a["font-style"] = "italic";
      if (st.mono) a["font-family"] = "ui-monospace,Menlo,Consolas,monospace";
      el("text", a, p[3]);
    }
  }
}
(function(){
  const s = document.createElement("style");
  s.textContent = ":root{--sc-g1:#ececec;--sc-g2:#c8c8c8;--sc-g3:#8a8a8a;--sc-hlf:#d6e4f2;--sc-hl2f:#f8dcc8;--sc-ok:#1e6b2e;--sc-err:#b00000;--sc-okf:#dcefdc;--sc-errf:#f6d5d5}" +
    "@media (prefers-color-scheme:dark){:root{--sc-g1:#2e2e2e;--sc-g2:#4a4a4a;--sc-g3:#7a7a7a;--sc-hlf:#1f3550;--sc-hl2f:#4a2e1a;--sc-ok:#7fd08f;--sc-err:#ff8080;--sc-okf:#1d3a22;--sc-errf:#4a1f1f}}";
  document.head.appendChild(s);
})();


const X0 = 160, X1 = 850, HMAX = 200000, CMAX = 65535, UIDMAP = [0, 100000, 65536];
function hx(u){ return X0 + (X1 - X0) * u / HMAX; }
function cx(u){ return X0 + (X1 - X0) * u / CMAX; }
function toHost(c, ns){ if (!ns) return c; const [a, b, n] = UIDMAP; return (c >= a && c < a + n) ? b + (c - a) : null; }
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function axis(y, hi, ticks, label, f){
  el("line", {x1: f(0), y1: y, x2: f(hi), y2: y, stroke: css("--fg"), "stroke-width": 1.8});
  ticks.forEach(t => { el("line", {x1: f(t), y1: y - 6, x2: f(t), y2: y + 6, stroke: css("--fg"), "stroke-width": 1.2});
    el("text", {x: f(t), y: y + 26, "font-size": 16, "text-anchor": "middle"}, fmt(t)); });
  el("text", {x: 10, y: y + 6, "font-size": 16, "font-weight": "bold"}, label);
}
function update(){
  const c = +document.getElementById("c").value, ns = document.getElementById("ns").checked;
  document.getElementById("cv").textContent = c;
  svg.setAttribute("viewBox", "0 0 880 260"); svg.innerHTML = ""; scDefs();
  el("text", {x: 10, y: 22, "font-size": 18, "font-weight": "bold"}, ns ? "hostUsers: false, uid_map: 0 100000 65536" : "runAsUser, user namespace nélkül");
  const yc = 80, yh = 200;
  axis(yc, 65535, [0, 65535], "konténer-UID", cx);
  axis(yh, HMAX, ns ? [0, 100000, 165535, 200000] : [0, 65535, 200000], "host-UID", hx);
  if (ns) {
    scDraw([["rect", hx(0), yh - 16, hx(99999) - hx(0), 14, {fill: "g2", hatch: "//", lw: 0.8}],
            ["rect", hx(100000), yh - 16, hx(165535) - hx(100000), 14, {fill: "g1", lw: 0.8}],
            ["rect", hx(165536), yh - 16, hx(HMAX) - hx(165536), 14, {fill: "bg", hatch: "..", lw: 0.8}]]);
    el("text", {x: (hx(0) + hx(99999)) / 2, y: yh - 24, "font-size": 15, "text-anchor": "middle", "font-style": "italic"}, "0–99 999: nem érhető el");
  } else scDraw([["rect", hx(0), yh - 16, hx(65535) - hx(0), 14, {fill: "g1", lw: 0.8}]]);
  const h = toHost(c, ns);
  scDraw([["line", cx(c), yc + 4, hx(h), yh - 18, {lw: 2.4, color: "hl2", arrow: true}]]);
  el("text", {x: Math.max(60, Math.min(cx(c), 820)), y: yc - 14, "font-size": 16, "text-anchor": "middle", "font-weight": "bold", fill: css("--hl2")}, "c = " + fmt(c));
  el("text", {x: Math.max(220, Math.min(hx(h), 790)), y: yh + 52, "font-size": 16, "text-anchor": "middle", "font-weight": "bold", fill: css("--hl2")}, "host = " + fmt(h));
  document.getElementById("status").textContent = ns
    ? `Konténerben id -u = ${c}; a hoston a folyamat UID-je 100000 + ${c} = ${fmt(h)} (nem privilegizált host-UID).`
    : `Konténerben id -u = ${c}; user namespace nélkül a hoston is ${fmt(h)}` + (c === 0 ? " – ez a host root-ja!" : ".");
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => update());
update();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
