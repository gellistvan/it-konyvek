<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fájdalompiramis</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

#detail{white-space:pre-line;background:var(--code);padding:6px 10px;min-height:5.8em}
g.lv{cursor:pointer} g.lv:focus{outline:none} g.lv:focus polygon{stroke-width:4}
</style></head><body>
<div id="status" aria-live="polite">Kattints egy szintre (vagy Tab + Enter): megjelenik a leírása, egy fejezetbeli példa és a megkerülés módja.</div>
<svg id="v" viewBox="0 0 1000 680" role="img" aria-label="Hatszintű fájdalompiramis alulról felfelé: hash-értékek, IP-címek, domainnevek, hálózati és hoszt-artefaktumok, eszközök, TTP-k."></svg>
<div id="detail"></div>
<p class="small">Modell, nem szabvány; a szintnevek Bianco eredeti angol címkéinek fordításai. Minél magasabb a szint, annál nagyobb a támadó költsége, ha a védő arra épít.</p>
<script>
const L = [{"name": "hash-értékek", "lines": ["hash-értékek"], "en": "Hash Values", "diff": "triviális", "ex": "SHA-256 a hash meta mezőben (<SHA256_PLACEHOLDER>)", "byp": "egyetlen bájt módosítása → új hash", "desc": "a fájl kriptográfiai lenyomata; pontos, de törékeny", "poly": [[55.0, 630.0], [565.0, 630.0], [522.5, 530.0], [97.5, 530.0]], "g": 0.97}, {"name": "IP-címek", "lines": ["IP-címek"], "en": "IP Addresses", "diff": "könnyű", "ex": "192.0.2.10 (a c082 labor fake HTTP szervere)", "byp": "új szerver, proxy vagy felhőcím → új IP", "desc": "a támadói infrastruktúra címe", "poly": [[97.5, 530.0], [522.5, 530.0], [480.0, 430.0], [140.0, 430.0]], "g": 0.9}, {"name": "domainnevek", "lines": ["domainnevek"], "en": "Domain Names", "diff": "egyszerű", "ex": "example.invalid (a c082 minta Host fejléce)", "byp": "új domain regisztrálása – kis költség, némi idő", "desc": "névfeloldáshoz kötött infrastruktúra", "poly": [[140.0, 430.0], [480.0, 430.0], [437.5, 330.0], [182.5, 330.0]], "g": 0.82}, {"name": "hálózati/hoszt-artefaktumok", "lines": ["hálózati/hoszt-", "artefaktumok"], "en": "Network/Host Artifacts", "diff": "bosszantó", "ex": "C:\\TerraSecure\\payload.bin; registry Run kulcs, mutex név", "byp": "a kódban más útvonal, kulcs vagy mutex → újrafordítás", "desc": "a rendszeren vagy a forgalomban hagyott nyom", "poly": [[182.5, 330.0], [437.5, 330.0], [395.0, 230.0], [225.0, 230.0]], "g": 0.74}, {"name": "eszközök", "lines": ["eszközök"], "en": "Tools", "diff": "kihívás", "ex": "$h1 = { 68 ?? ?? ?? ?? 6A 00 …} és CreateProcessA (4–5. szint)", "byp": "új vagy átírt eszköz fejlesztése, beszerzése", "desc": "a támadó által használt program, loader", "poly": [[225.0, 230.0], [395.0, 230.0], [352.5, 130.0], [267.5, 130.0]], "g": 0.66}, {"name": "TTP-k", "lines": ["TTP-k"], "en": "TTPs", "diff": "nehéz", "ex": "„Word indít PowerShellt” processzlánc", "byp": "új eljárás megtanulása, a működés átalakítása", "desc": "taktika, technika, eljárás: a viselkedés", "poly": [[267.5, 130.0], [352.5, 130.0], [310.0, 30.0], [310.0, 30.0]], "g": 0.58}];
const NS="http://www.w3.org/2000/svg";
function mk(p,t,a,x){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(x!==undefined)e.textContent=x;p.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
const svg=document.getElementById("v"); let sel=-1;
function draw(){
  svg.innerHTML="";
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;
  mk(svg,"line",{x1:30,y1:630,x2:30,y2:50,stroke:css("--fg"),"stroke-width":2.5});
  mk(svg,"path",{d:"M20 58L30 36L40 58Z",fill:css("--fg")});
  const t=mk(svg,"text",{x:0,y:0,"font-size":18,"text-anchor":"middle",transform:"translate(14 330) rotate(-90)"},"a támadó költsége a változtatáskor");
  L.forEach((l,k)=>{
    const g=mk(svg,"g",{class:"lv",tabindex:0,role:"button","aria-label":l.name+" ("+l.diff+")"});
    const v=dark?Math.round(40+(1-l.g)*160):Math.round(255*l.g);
    mk(g,"polygon",{points:l.poly.map(p=>p.join(",")).join(" "),fill:`rgb(${v},${v},${v})`,stroke:sel===k?css("--hl"):css("--line"),"stroke-width":sel===k?5:1.4});
    const yc=(l.poly[0][1]+l.poly[2][1])/2;
    const top=(k===5)?24:0, n=l.lines.length;
    l.lines.forEach((s,i)=>mk(g,"text",{x:310,y:yc+top-4-(n-1-i)*20,"text-anchor":"middle","font-size":(k===5?17:19),"font-weight":"bold"},s));
    mk(g,"text",{x:310,y:yc+top+16,"text-anchor":"middle","font-size":15},"("+l.diff+")");
    mk(svg,"line",{x1:l.poly[1][0]-(l.poly[1][0]-l.poly[2][0])/2+6,y1:yc,x2:592,y2:yc,stroke:css("--muted"),"stroke-dasharray":"2 3"});
    mk(svg,"text",{x:600,y:yc-4,"font-size":16,"font-weight":"bold",fill:sel===k?css("--hl"):css("--fg")},(k+1)+". "+l.en);
    mk(svg,"text",{x:600,y:yc+16,"font-size":14,fill:css("--muted")},l.ex.length>46?l.ex.slice(0,45)+"…":l.ex);
    const f=()=>{sel=k;draw();show(k);};
    g.addEventListener("click",f);
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});
  });
}
function show(k){const l=L[k];
  document.getElementById("status").textContent=`${k+1}. szint: ${l.name} (${l.en}) – ${l.diff}`;
  document.getElementById("detail").textContent=`Leírás: ${l.desc}.\nFejezetbeli példa: ${l.ex}\nMegkerülés: ${l.byp}.`;}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
