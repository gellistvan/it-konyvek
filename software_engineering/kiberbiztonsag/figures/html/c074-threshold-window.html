<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Csúszóablakos küszöbkiértékelés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Teszt: <select id="tsel"><option value="in">határ belül: 0/30/60 s</option><option value="out">határ kívül: 0/30/61 s</option><option value="two">két felhasználó: alice 0/10/20, bob 5/15</option><option value="swap">sorrendcsere: 20/0/10 s</option><option value="dup">duplikátum: d-1, d-1, d-2, d-3</option></select></label><details><summary>Saját bemenet</summary><textarea id="tin" rows="6" cols="44" aria-label="Események: másodperc user IP request_id">0 admin 192.0.2.88 b-1
30 admin 192.0.2.88 b-2
60 admin 192.0.2.88 b-3</textarea><br><button id="trun" type="button">Kiértékelés</button> <span class="small">soronként: másodperc user IP request_id (threshold = 3, 60 s)</span></details></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A failed_login_bruteforce szabály csúszóablaka a teszteseteken"></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>

function render(s){
  svg.innerHTML = "";
  const keys = s.order.slice();
  s.dedup.forEach(d => { if (!keys.includes(d.g)) keys.push(d.g); });
  const H = 70 + Math.max(1, keys.length) * 70;
  svg.setAttribute("viewBox", `0 0 640 ${H}`);
  const x = t => 190 + (t + 3) * 430 / 69;
  [0,10,20,30,40,50,60].forEach(t => {
    el("line", {x1:x(t), y1:20, x2:x(t), y2:H-36, stroke:css("--muted"), "stroke-dasharray":"1.5 3"});
    el("text", {x:x(t), y:H-18, "text-anchor":"middle", "font-size":13}, String(t));
  });
  el("text", {x:180, y:H-18, "text-anchor":"end", "font-size":13}, "s (08:00:00-tól)");
  keys.forEach((k, r) => {
    const yc = 50 + r * 70, times = (s.groups[k] || []);
    const [u, ip] = k.split("|");
    const curg = (s.gk === k) || (s.win && s.win.g === k);
    el("text", {x:6, y:yc+5, "font-size":14, "font-weight": curg ? "bold" : "normal"}, `(${u}, ${ip})`);
    el("line", {x1:x(0), y1:yc, x2:x(65), y2:yc, stroke:css("--muted")});
    const w = s.win && s.win.g === k ? s.win : (s.alerts[k] ? {a:s.alerts[k].a, b:s.alerts[k].b, ok:true} : null);
    if (w) {
      el("rect", {x:x(w.a), y:yc-20, width:x(w.a+60)-x(w.a), height:40, fill:"none", stroke: w.ok ? css("--hl") : css("--fg"),
        "stroke-width": w.ok ? 3.5 : 1.6, "stroke-dasharray": w.ok ? "" : "6 4"});
      el("circle", {cx:x(w.a+60), cy:yc, r:6, fill:css("--fg")});
      el("text", {x:x(w.a+60)-4, y:yc-26, "text-anchor":"end", "font-size":13, "font-weight":"bold"},
         w.ok ? "ALERT" : `${w.b - w.a} s > 60 s`);
    }
    times.forEach((t, i) => {
      const inwin = w && t >= w.a && t <= w.a + 60;
      const isB = s.win && s.win.g === k && (i === s.win.i || i === s.win.i + 2);
      el("circle", {cx:x(t), cy:yc, r: isB ? 9 : 7, fill: inwin || !w ? css("--cellhl") : css("--cell"),
        stroke:css("--line"), "stroke-width": isB ? 3 : 1.4});
      if (s.win && s.win.g === k) el("text", {x:x(t), y:yc+36, "text-anchor":"middle", "font-size":12, fill:css("--muted")}, "[" + i + "]");
    });
    s.dedup.filter(d => d.g === k).forEach(d => {
      el("text", {x:x(d.t), y:yc+7, "text-anchor":"middle", "font-size":22, "font-weight":"bold"}, "×");
      el("text", {x:x(d.t), y:yc+36, "text-anchor":"middle", "font-size":12, "font-style":"italic"}, "dedup " + d.rid);
    });
  });
  if (s.done) el("text", {x:620, y:22, "text-anchor":"end", "font-size":15, "font-weight":"bold"}, "alerted = " + (s.alerted ? "True" : "False"));
}

// --- ugyanaz a logika JavaScriptben (saját bemenethez) ---
function evaluateJS(events, thr, tf){
  const steps = [], seen = new Set(), groups = {}, dedup = [], order = [], alerts = {};
  let win = null;
  const K = e => e.user + "|" + e.ip, KK = k => k.replace("|", ", ");
  const snap = (msg, line, cur, extra) => { const s = {msg:msg, line:line, groups:JSON.parse(JSON.stringify(groups)),
     order:order.slice(), dedup:JSON.parse(JSON.stringify(dedup)), cur:(cur===undefined?null:cur), win:win, alerts:JSON.parse(JSON.stringify(alerts))};
     Object.assign(s, extra || {}); steps.push(s); };
  snap(`${events.length} esemény, threshold = ${thr}, timeframe = ${tf} s, csoport = (user, IP).`, -1);
  events.forEach((e, i) => {
    if (seen.has(e.rid)) { dedup.push({t:e.t, g:K(e), rid:e.rid});
      snap(`${e.t} s, ${e.rid}: már látott request_id → deduplikált, kihagyva.`, 1, i); return; }
    seen.add(e.rid); const k = K(e);
    if (!(k in groups)) { groups[k] = []; order.push(k); }
    groups[k].push(e.t);
    snap(`${e.t} s, ${e.rid} → csoport (${e.user}, ${e.ip}): [${groups[k].join(", ")}]`, 2, i);
  });
  let alerted = false;
  order.forEach(k => {
    const times = groups[k]; times.sort((a, b) => a - b);
    snap(`(${KK(k)}) rendezve: times = [${times.join(", ")}]`, 4, undefined, {gk:k});
    if (times.length < thr) snap(`(${KK(k)}): csak ${times.length} esemény < ${thr}, nincs ablak.`, 5, undefined, {gk:k});
    for (let idx = 0; idx < times.length - thr + 1; idx++) {
      const a = times[idx], b = times[idx + thr - 1], ok = b - a <= tf;
      win = {g:k, i:idx, a:a, b:b, ok:ok};
      snap(`index=${idx}: times[${idx}] = ${a} s, times[${idx + thr - 1}] = ${b} s, különbség ${b - a} s ${ok ? "≤" : ">"} ${tf} s → ${ok ? "ALERT" : "nincs"}`, 6, undefined, {gk:k});
      if (ok) { alerts[k] = {a:a, b:b}; alerted = true;
        snap(`riasztás: csoport (${KK(k)}), ablak ${a}–${a + tf} s, count = ${thr}; break.`, 7, undefined, {gk:k}); break; }
    }
    win = null;
  });
  snap(`alerted = ${alerted ? "True" : "False"}; deduplikált: ${dedup.length}; csoportok: ` +
       order.map(k => `(${KK(k)}): ${groups[k].length}`).join(", "), 8, undefined, {done:true, alerted:alerted});
  return steps;
}
function parseInput(txt){
  return txt.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#")).map(l => {
    const p = l.split(/\s+/); const t = Number(p[0]);
    if (p.length < 4 || !Number.isFinite(t)) throw new Error("hibás sor: " + l);
    return {t:t, user:p[1], ip:p[2], rid:p[3]}; });
}
function loadTest(){
  const k = document.getElementById("tsel").value, T = PRESETS[k];
  document.getElementById("tin").value = T.events.map(e => `${e.t} ${e.user} ${e.ip} ${e.rid}`).join("\n");
  setSteps(PY_STEPS[k]);
}
function runOwn(){
  try { setSteps(evaluateJS(parseInput(document.getElementById("tin").value), 3, 60)); }
  catch (err) { status.textContent = err.message; }
}
document.getElementById("tsel").addEventListener("change", loadTest);
document.getElementById("trun").addEventListener("click", runOwn);
if (location.hash === "#selftest") {
  const bad = Object.keys(PRESETS).filter(k => JSON.stringify(evaluateJS(PRESETS[k].events, 3, 60).map(s => [s.msg, s.line]))
     !== JSON.stringify(PY_STEPS[k].map(s => [s.msg, s.line])));
  setTimeout(() => { status.textContent = bad.length ? "SELFTEST HIBA: " + bad.join(",") : "SELFTEST OK"; }, 0);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
