<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A három XSS-típus adatútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg text[font-family]{font-family:ui-monospace,"DejaVu Sans Mono",monospace}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}
</style>
</head>

const STAGE_CTL = "st";

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_col(c){return {"":dg_css("--fg"),err:dg_css("--err"),ok:dg_css("--ok"),mut:dg_css("--muted"),hl:dg_css("--hl")}[c||""];}
function dg_defs(root){
  const fg=dg_css("--fg");
  const d=dg_mk(root,"defs",{});
  let m="";
  [["",fg],["err",dg_css("--err")],["ok",dg_css("--ok")],["mut",dg_css("--muted")],["hl",dg_css("--hl")]].forEach(([n,c])=>{
    m+=`<marker id="dgar${n}" viewBox="0 0 10 10" refX="9.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`;});
  m+=`<pattern id="dgp_diag" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
  m+=`<pattern id="dgp_cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  m+=`<pattern id="dgp_dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${fg}"/></pattern>`;
  m+=`<pattern id="dgp_horiz" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="${fg}" stroke-width="1"/></pattern>`;
  d.innerHTML=m;
}
const DG_HATCH={"//":"dgp_diag","\\\\":"dgp_back","xx":"dgp_cross","..":"dgp_dots","--":"dgp_horiz"};
function dg_fill(f){return {w:dg_css("--cell"),g:dg_css("--fill3"),d:dg_css("--fill2"),k:dg_css("--fill1"),n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.55, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg"),opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    if(o.mono)a["font-family"]="ui-monospace,monospace";
    dg_mk(g,"text",a,l);});

}
function dg_node(par,n){
  const on=!!n.hl, c=dg_col(n.col);
  const st={stroke:on?dg_css("--hl"):c,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  let shp="rect", geo={x:x,y:y,width:w,height:h};
  if(n.shape==="frame"){st.fill="none";}
  else if(n.shape==="round"){const r=Math.min(w,h)*0.22;geo.rx=r;geo.ry=r;}
  else if(n.shape==="diamond"){shp="polygon";geo={points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`};}
  if(n.shape==="circle"){dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+h/2,rx:w/2,ry:h/2},st));}
  else if(n.shape==="store"){dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:st.fill});
    dg_mk(g,"path",{d:`M${x} ${y}H${x+w}M${x} ${y+h}H${x+w}`,stroke:st.stroke,"stroke-width":st["stroke-width"],"stroke-dasharray":st["stroke-dasharray"],fill:"none"});}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    if(n.hatch)dg_mk(g,"rect",{x:x,y:y+e/2,width:w,height:h-e,fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55});

  else{dg_mk(g,shp,Object.assign({},geo,st));
    if(n.hatch)dg_mk(g,shp,Object.assign({},geo,{fill:`url(#${DG_HATCH[n.hatch]})`,opacity:0.55}));}
  if(n.double){const d=5;dg_mk(g,"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,fill:"none",stroke:on?dg_css("--hl"):c,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    const tf = n.fill==="k" ? dg_css("--bg") : (n.tcol?dg_col(n.tcol):undefined);
    if(n.shape==="frame")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic,fill:tf});
    else dg_text(g,x+w/2,y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||on,italic:!!n.italic,fill:tf,bg:!!n.bg,mono:!!n.mono});}
  return g;
}
function dg_edge(par,e){
  const on=!!e.hl, c=dg_col(e.col);

  const a={d:d,fill:"none",stroke:c,"stroke-width":on?3.6:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=`url(#dgar${e.col||""})`;
  if(arr==="both")a["marker-start"]=`url(#dgar${e.col||""})`;
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||18,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic,fill:e.col?c:undefined,mono:!!e.mono});}

}
function dg_draw(root,D){
  root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.nodes.filter(n=>n.shape!=="frame").forEach(n=>out[n.id]=dg_node(L1,n));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg,fill:t.col?dg_col(t.col):undefined,mono:!!t.mono}));

}

const svgEl=document.getElementById("v"), statusEl=document.getElementById("status");
function ctlVal(c){const e=document.getElementById(c.id);
  if(c.type==="step")return c.options[+e.value][0];
  if(c.type==="check")return e.checked?"1":"0"; return e.value;}
function setCtl(id,val){const c=CONTROLS.find(x=>x.id===id); if(!c)return; const e=document.getElementById(id);
  if(c.type==="step")e.value=c.options.findIndex(o=>o[0]===val);
  else if(c.type==="check")e.checked=(val==="1"); else e.value=val; draw();}
let post=null;

function draw(){
  const vals={}; CONTROLS.forEach(c=>vals[c.id]=ctlVal(c));
  CONTROLS.filter(c=>c.type==="step").forEach(c=>{document.getElementById(c.id+"_cnt").textContent=
     (+document.getElementById(c.id).value+1)+"/"+c.options.length+" – "+c.options[+document.getElementById(c.id).value][1];});
  const S=STATES[CONTROLS.filter(c=>c.id!==STAGE_CTL).map(c=>vals[c.id]).join("|")];
  const D=JSON.parse(JSON.stringify(S.D));
  if(STAGE_CTL){const sv=+vals[STAGE_CTL];
    ["nodes","edges","texts"].forEach(f=>{D[f]=(D[f]||[]).filter(o=>!(o.stage>sv));
      D[f].forEach(o=>{if(o.stage===sv){if(f==="texts")o.bold=true; else o.hl=true;}});});}
  const out=dg_draw(svgEl,D);
  [...D.nodes,...D.edges].forEach(o=>{ if(o.act&&out[o.id]){const g=out[o.id];
     g.setAttribute("data-act","1"); g.setAttribute("tabindex","0"); g.setAttribute("role","button");
     g.setAttribute("aria-label",o.actlabel||o.id);
     const f=()=>setCtl(o.act.ctl,o.act.val); g.addEventListener("click",f);
     g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});}});
  statusEl.textContent=(S.msgs&&STAGE_CTL)?S.msgs[+vals[STAGE_CTL]]:S.msg;
  const ce=document.getElementById("cmd"); if(ce)ce.textContent=S.cmd||"";
  if(post)post(D,vals,out);
}
CONTROLS.forEach(c=>{const e=document.getElementById(c.id);
  e.addEventListener(c.type==="step"?"input":"change",draw);
  if(c.type==="step"){const n=c.options.length;
    document.getElementById(c.id+"_prev").onclick=()=>{e.value=Math.max(0,+e.value-1);draw();};
    document.getElementById(c.id+"_next").onclick=()=>{e.value=Math.min(n-1,+e.value+1);draw();};}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
// kezdőállapot URL-hashből (pl. #st=4&miss=1) – ellenőrzéshez/hivatkozáshoz
try{(location.hash||"").slice(1).split("&").forEach(p=>{const [a,b]=p.split("="); const c=CONTROLS.find(x=>x.id===a);
  if(!c||b===undefined)return; const e=document.getElementById(a);
  if(c.type==="step")e.value=+b; else if(c.type==="check")e.checked=(b==="1"); else e.value=decodeURIComponent(b);});}catch(err){}
draw();
</script>
