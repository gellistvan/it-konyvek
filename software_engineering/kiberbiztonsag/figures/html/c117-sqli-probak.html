 function truthy(v){return typeof v==="boolean"?v:(typeof v==="number"?v!==0:(+v||0)!==0);}
 function cmp(row){let a=prim(row);while(pk()&&pk().k==="op"){const o=nx().v,b=prim(row);
   const x=(typeof a==="boolean")?+a:a,y=(typeof b==="boolean")?+b:b;
   a=({"=":x==y,"==":x==y,"<>":x!=y,"!=":x!=y,"<":x<y,">":x>y,"<=":x<=y,">=":x>=y})[o];}return a;}
 function andE(row){let a=truthy(cmp(row));while(pk()&&pk().k==="AND"){p++;const b=truthy(cmp(row));a=a&&b;}return a;}
 function orE(row){let a=andE(row);while(pk()&&pk().k==="OR"){p++;const b=andE(row);a=a||b;}return a;}
 return row=>{p=0;const v=orE(row);if(p<toks.length&&toks[p].k!==";")throw {sql:'near "'+(toks[p].v||toks[p].k)+'": syntax error'};return truthy(v);};}
function vuln(u){const q="SELECT name, email FROM users WHERE id = "+u;
 try{const toks=tokenize(u);const semi=toks.findIndex(t=>t.k===";");const first=semi<0?toks:toks.slice(0,semi);
   if(!first.length)throw {sql:'incomplete input'};const f=evalWhere(first);
   if(semi>=0&&semi<toks.length-1)return [q,500,"Database error: You can only execute one statement at a time."];
   for(const id of [1,2]){if(f({id:id}))return [q,200,`Name: ${REC[id][0]}, Email: ${REC[id][1]}`];}
   return [q,404,"User not found"];}
 catch(e){if(e.unk!==undefined)return [q,null,`(a szimuláció a(z) „${e.unk}” szót nem értelmezi – a laborban, valódi SQLite-tal próbáld ki)`];
   return [q,500,"Database error: "+e.sql];}}
function fixd(u){if(!/^[0-9]+$/.test(u))return ["isdigit() = hamis → nincs lekérdezés",404,"User not found"];
 const id=+u;return [`SELECT name, email FROM users WHERE id = ?   paraméter: (${id},)`,REC[id]?200:404,REC[id]?`Name: ${REC[id][0]}, Email: ${REC[id][1]}`:"User not found"];}
function run(){const u=document.getElementById("inp").value;const side=document.getElementById("side").value;
 if(!u){document.getElementById("sim").textContent="400 Missing id parameter";return;}
 const v=vuln(u),f=fixd(u);let out=`kérés: GET /user?${enc(u)}\n`;
 if(side!=="f")out+=`sebezhető app.py:\n  ${v[0]}\n  → ${v[1]===null?"":"HTTP "+v[1]+" "}${v[2]}\n`;
 if(side!=="v")out+=`javított app_fixed.py:\n  ${f[0]}\n  → HTTP ${f[1]} ${f[2]}`;
 document.getElementById("sim").textContent=out;}
document.getElementById("go").onclick=run;
document.getElementById("inp").addEventListener("keydown",e=>{if(e.key==="Enter")run();});
document.querySelectorAll("button[data-p]").forEach(b=>b.onclick=()=>{document.getElementById("inp").value=b.dataset.p;run();});
post=function(){run();};

function draw(){
  const vals={}; CONTROLS.forEach(c=>vals[c.id]=ctlVal(c));
  CONTROLS.filter(c=>c.type==="step").forEach(c=>{document.getElementById(c.id+"_cnt").textContent=
     (+document.getElementById(c.id).value+1)+"/"+c.options.length+" – "+c.options[+document.getElementById(c.id).value][1];});
  const S=STATES[CONTROLS.filter(c=>c.id!==STAGE_CTL).map(c=>vals[c.id]).join("|")];
  const D=JSON.parse(JSON.stringify(S.D));
  if(STAGE_CTL){const sv=+vals[STAGE_CTL];
    ["nodes","edges","texts"].forEach(f=>{D[f]=(D[f]||[]).filter(o=>!(o.stage>sv));
      D[f].forEach(o=>{if(o.stage===sv){if(f==="texts")o.bold=true; else o.hl=true;}});});}
  const out=dg_draw(svgEl,D);
  [...D.nodes,...D.edges].forEach(o=>{ if(o.act&&out[o.id]){const g=out[o.id];
     g.setAttribute("data-act","1"); g.setAttribute("tabindex","0"); g.setAttribute("role","button");
     g.setAttribute("aria-label",o.actlabel||o.id);
     const f=()=>setCtl(o.act.ctl,o.act.val); g.addEventListener("click",f);
     g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f();}});}});
  statusEl.textContent=(S.msgs&&STAGE_CTL)?S.msgs[+vals[STAGE_CTL]]:S.msg;
  const ce=document.getElementById("cmd"); if(ce)ce.textContent=S.cmd||"";
  if(post)post(D,vals,out);
}
CONTROLS.forEach(c=>{const e=document.getElementById(c.id);
  e.addEventListener(c.type==="step"?"input":"change",draw);
  if(c.type==="step"){const n=c.options.length;
    document.getElementById(c.id+"_prev").onclick=()=>{e.value=Math.max(0,+e.value-1);draw();};
    document.getElementById(c.id+"_next").onclick=()=>{e.value=Math.min(n-1,+e.value+1);draw();};}});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
// kezdőállapot URL-hashből (pl. #st=4&miss=1) – ellenőrzéshez/hivatkozáshoz
try{(location.hash||"").slice(1).split("&").forEach(p=>{const [a,b]=p.split("="); const c=CONTROLS.find(x=>x.id===a);
  if(!c||b===undefined)return; const e=document.getElementById(a);
  if(c.type==="step")e.value=+b; else if(c.type==="check")e.checked=(b==="1"); else e.value=decodeURIComponent(b);});}catch(err){}
draw();
</script>
