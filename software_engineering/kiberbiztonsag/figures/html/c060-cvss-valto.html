<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVSS 3.1 vektor-váltó</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

.vec{font:13px ui-monospace,monospace;background:var(--code);padding:4px 6px;display:inline-block}
.big{font-size:20px;font-weight:bold}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Alapmetrikák"><label>AV <select id="mAV"><option value="N">Hálózat (N)</option><option value="A">Szomszédos (A)</option><option value="L">Helyi (L)</option><option value="P">Fizikai (P)</option></select></label><label>AC <select id="mAC"><option value="L">Alacsony (L)</option><option value="H">Magas (H)</option></select></label><label>PR <select id="mPR"><option value="N">Nincs (N)</option><option value="L">Alacsony (L)</option><option value="H">Magas (H)</option></select></label><label>UI <select id="mUI"><option value="N">Nincs (N)</option><option value="R">Szükséges (R)</option></select></label><label>S <select id="mS"><option value="U">Változatlan (U)</option><option value="C">Változó (C)</option></select></label><label>C <select id="mC"><option value="H">Magas (H)</option><option value="L">Alacsony (L)</option><option value="N">Nincs (N)</option></select></label><label>I <select id="mI"><option value="H">Magas (H)</option><option value="L">Alacsony (L)</option><option value="N">Nincs (N)</option></select></label><label>A <select id="mA"><option value="H">Magas (H)</option><option value="L">Alacsony (L)</option><option value="N">Nincs (N)</option></select></label></div>
<div class="ctl"><button id="bEx" type="button">Példa (9,8)</button><button id="bLab" type="button">Labor (6,5)</button>
<span class="vec" id="vec"></span></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="A kiválasztott vektor alappontszámának felbontása Exploitability és Impact részpontszámra, a példa és a labor vektorával összevetve"></svg>
<p class="small">A CVSS technikai súlyosság, nem üzleti kockázat (R = L × I). Képlet: CVSS v3.1 specifikáció, 7. fejezet
(ISS, Impact, Exploitability, Roundup). Az ábra a vektorok közti különbséget szemlélteti.</p>
<script>
const W = {"AV": {"N": 0.85, "A": 0.62, "L": 0.55, "P": 0.2}, "AC": {"L": 0.77, "H": 0.44}, "PR_U": {"N": 0.85, "L": 0.62, "H": 0.27}, "PR_C": {"N": 0.85, "L": 0.68, "H": 0.5}, "UI": {"N": 0.85, "R": 0.62}, "CIA": {"H": 0.56, "L": 0.22, "N": 0.0}};
const CHECK = {"CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H": 9.8, "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H": 8.8, "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N": 6.5};
const VECS = [["Hitelesítés nélküli példa", "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"], ["Csak PR:L", "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"], ["Labor: PR:L, C:H/I:N/A:N", "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"]];
function roundup(x){const i=Math.round(x*100000); return (i%10000===0)? i/100000 : (Math.floor(i/10000)+1)/10;}
function parse(v){const m={}; v.split("/").slice(1).forEach(p=>{const [a,b]=p.split(":"); m[a]=b;}); return m;}
function score(v){const m=parse(v);
  const iss=1-(1-W.CIA[m.C])*(1-W.CIA[m.I])*(1-W.CIA[m.A]); const ch=m.S==="C";
  const imp= ch ? 7.52*(iss-0.029)-3.25*Math.pow(iss-0.02,15) : 6.42*iss;
  const ex=8.22*W.AV[m.AV]*W.AC[m.AC]*W[ch?"PR_C":"PR_U"][m.PR]*W.UI[m.UI];
  const base = imp<=0 ? 0 : roundup(Math.min((ch?1.08:1)*(imp+ex),10));
  return {iss:iss, impact:imp, expl:ex, base:base};}
function rating(b){return b===0?"Nincs":b<4?"Alacsony":b<7?"Közepes":b<9?"Magas":"Kritikus";}
function c(x,d){return x.toFixed(d).replace(".",",").replace("-","−");}
for (const v in CHECK) if (score(v).base!==CHECK[v]) document.title="HIBA: JS≠Python";
const KEYS=["AV","AC","PR","UI","S","C","I","A"];
function cur(){return "CVSS:3.1/"+KEYS.map(k=>k+":"+document.getElementById("m"+k).value).join("/");}
function load(v){const m=parse(v); KEYS.forEach(k=>document.getElementById("m"+k).value=m[k]); draw();}
const svg=document.getElementById("v"), NS="http://www.w3.org/2000/svg";
function mk(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function draw(){
  const v=cur(), s=score(v);
  document.getElementById("vec").textContent=v;
  document.getElementById("status").innerHTML=`<span class="big">${c(s.base,1)} – ${rating(s.base)}</span>  ISS = ${c(s.iss,4)}, Impact = ${c(Math.max(s.impact,0),2)}, Exploitability = ${c(s.expl,2)}`+(parse(v).S==="C"?" (S:C: ×1,08)":"");
  svg.innerHTML="";
  const fg=css("--fg");
  const d=mk("defs",{}); d.innerHTML=`<pattern id="hh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.2"/></pattern>`;
  const bars=[["Kiválasztott",v],["Példa",VECS[0][1]],["Labor",VECS[2][1]]];
  const y0=250, k=20;
  mk("line",{x1:40,x2:620,y1:y0-10*k,y2:y0-10*k,stroke:fg,"stroke-dasharray":"2 4"});
  mk("text",{x:620,y:y0-10*k-5,"text-anchor":"end","font-size":12},"10");
  bars.forEach((b,i)=>{const r=score(b[1]); const x=70+i*190, w=110; const imp=Math.max(r.impact,0);
    mk("rect",{x:x,y:y0-r.expl*k,width:w,height:r.expl*k,fill:"url(#hh)",stroke:fg,"stroke-width":i===0?2.5:1.2});
    mk("rect",{x:x,y:y0-(r.expl+imp)*k,width:w,height:imp*k,fill:css("--fill1"),stroke:fg,"stroke-width":i===0?2.5:1.2});
    mk("text",{x:x+w/2,y:y0-(r.expl+imp)*k-8,"text-anchor":"middle","font-size":15,"font-weight":"bold"},c(r.base,1)+" – "+rating(r.base));
    mk("text",{x:x+w/2,y:y0+18,"text-anchor":"middle","font-size":13},b[0]);
    mk("text",{x:x+w+6,y:y0-r.expl*k/2+4,"font-size":12},"E "+c(r.expl,2));
    if(imp>0)mk("text",{x:x+w+6,y:y0-(r.expl+imp/2)*k+4,"font-size":12},"I "+c(imp,2));});
  mk("line",{x1:40,x2:620,y1:y0,y2:y0,stroke:fg});
  mk("text",{x:40,y:y0+38,"font-size":12,fill:css("--muted")},"sraffozott = Exploitability (E), tömör = Impact (I); a felirat a Roundup utáni alappontszám");
}
KEYS.forEach(k=>document.getElementById("m"+k).addEventListener("change",draw));
document.getElementById("bEx").onclick=()=>load(VECS[0][1]);
document.getElementById("bLab").onclick=()=>load(VECS[2][1]);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
load(VECS[2][1]);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
