<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanúsítványlánc és a kliens négy kapuja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:160px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Hibák"><label><input type="checkbox" id="expired" onchange="update()"> lejárt leaf</label><label><input type="checkbox" id="san_mismatch" onchange="update()"> SAN eltér</label><label><input type="checkbox" id="unknown_root" onchange="update()"> ismeretlen gyökér</label><label><input type="checkbox" id="verify_off" onchange="update()"> verify=False</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 880 400" role="img" aria-label="Bal oldalt a leaf, a köztes CA és a gyökér CA tanúsítványa, a gyökér a kliens trust store-jában; jobb oldalt négy számozott kapu: lánc és trust anchor, érvényességi idő, hostnév a SAN-ban, megszakítás hibánál."></svg>
<p class="small">A -servername csak az SNI-t állítja be, nem ellenőriz nevet. A verify=False / InsecureSkipVerify minden kaput kikapcsol.</p>
