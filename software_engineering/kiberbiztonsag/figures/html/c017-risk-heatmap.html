<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kockázati hőtérkép</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill1:#555;--fill2:#c4c4c4;--fill3:#e8e8e8;--err:#c00000;--ok:#1e6b2e}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill1:#bbb;--fill2:#6a6a6a;--fill3:#383838;--err:#ff7070;--ok:#7fd08f}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
input[type=range]{min-width:110px}
input[type=number]{width:4.5em}
#status{margin:4px 0 6px;min-height:2.9em;white-space:pre-line}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
svg text[font-family]{font-family:ui-monospace,"DejaVu Sans Mono",monospace}
.small{font-size:12px;color:var(--muted)}
pre.cmd{margin:4px 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap}
[data-act]{cursor:pointer}
[data-act]:focus{outline:2px dashed var(--hl)}

table{border-collapse:collapse;margin-top:6px;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 8px;text-align:left}
input[type=text]{width:16em}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Kijelölt cella">
 <label>L (valószínűség) <input id="L" type="range" min="1" max="5" value="2"> <span id="Lv">2</span></label>
 <label>I (hatás) <input id="I" type="range" min="1" max="5" value="5"> <span id="Iv">5</span></label>
</div>
<div class="ctl" role="group" aria-label="Saját fenyegetés felvétele">
 <label>Fenyegetés <input id="nm" type="text" value="saját fenyegetés"></label>
 <button type="button" id="add">Felvétel a kijelölt L, I értékkel</button>
 <button type="button" id="clr">Saját tételek törlése</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 560 420" role="img" aria-label="5×5-ös kockázati hőtérkép: a cellákban R = L·I; a két fejezetpélda a (2,5) és az (5,4) cellában, R=10 és R=20."></svg>
<table aria-label="Prioritáslista"><thead><tr><th>#</th><th>Fenyegetés</th><th>L</th><th>I</th><th>R</th><th>Sáv</th></tr></thead><tbody id="tb"></tbody></table>
<p class="small">A sávhatárok szemléltetők; a saját dokumentumban rögzítsd őket. A fejezet példái: belső, CVSS 9,8 (L=2, I=5, R=10) és internetes XSS, CVSS 6,1 (L=5, I=4, R=20). A saját tételek csak ebben a lapban élnek.</p>
<script>
const BANDS=[{"lo": 1, "hi": 4, "name": "alacsony"}, {"lo": 5, "hi": 9, "name": "közepes"}, {"lo": 10, "hi": 16, "name": "magas"}, {"lo": 17, "hi": 25, "name": "kritikus"}];
const EX=[{"name": "belső szolgáltatás, CVSS 9,8", "L": 2, "I": 5}, {"name": "internetes XSS, CVSS 6,1", "L": 5, "I": 4}];
let items=EX.map(e=>Object.assign({},e,{ex:true}));
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("v");
function mk(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function band(r){return BANDS.find(b=>r>=b.lo&&r<=b.hi).name;}
const PAT={"alacsony":"pd","közepes":"pl","magas":"px","kritikus":null};
function draw(){
  const L=+document.getElementById("L").value, I=+document.getElementById("I").value;
  document.getElementById("Lv").textContent=L; document.getElementById("Iv").textContent=I;
  svg.innerHTML=""; const fg=css("--fg");
  const d=mk("defs",{});
  d.innerHTML=`<pattern id="pd" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="0.9" fill="${fg}"/></pattern>`+
   `<pattern id="pl" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/></pattern>`+
   `<pattern id="px" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1"/><line x1="0" y1="0" x2="7" y2="0" stroke="${fg}" stroke-width="1"/></pattern>`;
  const c=60, x0=90, y0=20;
  for(let l=1;l<=5;l++)for(let i=1;i<=5;i++){
    const r=l*i, b=band(r), x=x0+(i-1)*c, y=y0+(5-l)*c;
    mk("rect",{x:x,y:y,width:c,height:c,fill:b==="kritikus"?css("--fill1"):css("--cell"),stroke:css("--line"),"stroke-width":1});
    if(PAT[b]) mk("rect",{x:x,y:y,width:c,height:c,fill:`url(#${PAT[b]})`,opacity:0.45});
    if(b!=="kritikus") mk("rect",{x:x+c/2-13,y:y+c/2-11,width:26,height:22,fill:css("--bg"),opacity:0.9});
    mk("text",{x:x+c/2,y:y+c/2+6,"text-anchor":"middle","font-size":16,"font-weight":"bold",fill:b==="kritikus"?css("--bg"):fg},String(r));
    if(l===L&&i===I) mk("rect",{x:x+2,y:y+2,width:c-4,height:c-4,fill:"none",stroke:css("--hl"),"stroke-width":4});
  }
  for(let i=1;i<=5;i++) mk("text",{x:x0+(i-0.5)*c,y:y0+5*c+18,"text-anchor":"middle","font-size":13},String(i));
  for(let l=1;l<=5;l++) mk("text",{x:x0-10,y:y0+(5-l+0.5)*c+5,"text-anchor":"end","font-size":13},String(l));
  mk("text",{x:x0+2.5*c,y:y0+5*c+40,"text-anchor":"middle","font-size":13},"I – üzleti hatás");
  const t=mk("text",{x:22,y:y0+2.5*c,"text-anchor":"middle","font-size":13,transform:`rotate(-90 22 ${y0+2.5*c})`},"L – valószínűség");
  // jelölők: cellánként egymás mellett
  const per={};
  items.forEach((it,k)=>{const key=it.L+","+it.I; const n=per[key]=(per[key]||0)+1;
    const x=x0+(it.I-1)*c+10+(n-1)*14, y=y0+(5-it.L)*c+10;
    mk("circle",{cx:x,cy:y,r:7,fill:css("--bg"),stroke:fg,"stroke-width":2});
    mk("text",{x:x,y:y+4,"text-anchor":"middle","font-size":10,"font-weight":"bold"},String(k+1));});
  // jelmagyarázat
  BANDS.forEach((b,k)=>{const y=y0+10+k*28;
    mk("rect",{x:420,y:y,width:20,height:20,fill:b.name==="kritikus"?css("--fill1"):css("--cell"),stroke:css("--line")});
    if(PAT[b.name]) mk("rect",{x:420,y:y,width:20,height:20,fill:`url(#${PAT[b.name]})`,opacity:0.6});
    mk("text",{x:446,y:y+15,"font-size":13},`${b.lo}–${b.hi}: ${b.name}`);});
  mk("text",{x:420,y:y0+140,"font-size":12,fill:css("--muted")},"(szemléltető sávhatárok)");
  const r=L*I;
  document.getElementById("status").textContent=`Kijelölt cella: L=${L}, I=${I} → R = ${L} · ${I} = ${r} (${band(r)}).`;
  // rendezett prioritáslista
  const tb=document.getElementById("tb"); tb.innerHTML="";
  items.map((it,k)=>Object.assign({k:k+1,R:it.L*it.I},it)).sort((a,b)=>b.R-a.R||a.k-b.k).forEach(it=>{
    const tr=document.createElement("tr");
    [it.k,it.name+(it.ex?" (fejezetpélda)":""),it.L,it.I,it.R,band(it.R)].forEach(v=>{const td=document.createElement("td");td.textContent=String(v);tr.appendChild(td);});
    tb.appendChild(tr);});
}
document.getElementById("L").addEventListener("input",draw);
document.getElementById("I").addEventListener("input",draw);
document.getElementById("add").addEventListener("click",()=>{
  const nm=(document.getElementById("nm").value||"").trim()||"névtelen";
  items.push({name:nm.slice(0,60),L:+document.getElementById("L").value,I:+document.getElementById("I").value}); draw();});
document.getElementById("clr").addEventListener("click",()=>{items=items.filter(x=>x.ex);draw();});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
