<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canary kernelváltás állapotgépe</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hiba injektálása <select id="fault" onchange="inj()" aria-label="hiba injektálása"><option value="none">nincs (normál út)</option><option value="dkms">DKMS build (S2)</option><option value="initramfs">initramfs (S3)</option><option value="secureboot">Secure Boot (S4)</option><option value="bootentry">boot entry (S4)</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Állapotgép: S0 baseline, S1 csomagfrissítés, S2 DKMS és initramfs, S3 reboot, S4 smoke test, S5 elfogadás; hibaágak a DKMS, initramfs, Secure Boot és boot entry tünetével, rollback R1 grub-reboot, R2 konzol, R3 snapshot."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Illusztratív verziók: 6.8.0-45-generic → 6.8.0-50-generic. A grub-reboot a next_entry-t állítja (egyszeri), nem a saved_entry-t. Secure Boot alatt az aláíratlan modul betöltése „Key was rejected by service” hibát ad.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "S3: systemctl reboot (konzol elérhető).  [grubenv next_entry: —]", "cur": "S3", "edge": null, "line": 3}, {"msg": "S4 smoke test: uname -r = 6.8.0-50-generic, lab-app active, health 200, lab_net_driver betöltve, aláírás OK.  [grubenv next_entry: —]", "cur": "S4", "edge": null, "line": 4}, {"msg": "S5 elfogadás: a canary után a flotta következik.  [grubenv next_entry: —]", "cur": "S5", "edge": null, "line": 5}];
const CODE = ["S0 baseline: uname -r; dkms status; grub-editenv list", "S1 apt-get install --only-upgrade …", "S2 dkms autoinstall; update-initramfs -c -k all; update-grub", "S3 systemctl reboot", "S4 smoke test", "S5 elfogadás → flotta", "hibaág: tünet + adatgyűjtés", "rollback: M3 / R1 grub-reboot \"1>2\" / R2 konzol / R3 snapshot"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL={"none": [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "S3: systemctl reboot (konzol elérhető).  [grubenv next_entry: —]", "cur": "S3", "edge": null, "line": 3}, {"msg": "S4 smoke test: uname -r = 6.8.0-50-generic, lab-app active, health 200, lab_net_driver betöltve, aláírás OK.  [grubenv next_entry: —]", "cur": "S4", "edge": null, "line": 4}, {"msg": "S5 elfogadás: a canary után a flotta következik.  [grubenv next_entry: —]", "cur": "S5", "edge": null, "line": 5}], "dkms": [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "HIBA (S2): DKMS build failed: hiányzó linux-headers-6.8.0-50-generic  | adatgyűjtés: dkms status; ls /lib/modules/6.8.0-50-generic/updates", "cur": "F1", "edge": ["S2", "F1"], "line": 6}, {"msg": "Rollback/recovery: Reboot előtt javítható: linux-headers telepítése + dkms autoinstall, utána tovább S3-ra; a futó kernel érintetlen.  [grubenv next_entry: —]", "cur": "S2", "edge": ["F1", "S2"], "line": 7, "rb": ["S2"]}], "initramfs": [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "S3: systemctl reboot (konzol elérhető).  [grubenv next_entry: —]", "cur": "S3", "edge": null, "line": 3}, {"msg": "HIBA (S3): (initramfs) gave up waiting for root device  | adatgyűjtés: lsinitramfs /boot/initrd.img-6.8.0-50-generic | grep <modul>", "cur": "F3", "edge": ["S3", "F3"], "line": 6}, {"msg": "Rollback/recovery: R2: konzol GRUB-menü → előző kernel; update-initramfs -c -k 6.8.0-50-generic, majd újrapróba.  [grubenv next_entry: —]", "cur": "R2", "edge": ["F3", "R2"], "line": 7, "rb": ["R2", "S0"]}], "secureboot": [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "S3: systemctl reboot (konzol elérhető).  [grubenv next_entry: —]", "cur": "S3", "edge": null, "line": 3}, {"msg": "S4 smoke test: uname -r = 6.8.0-50-generic, lab-app active, health 200, lab_net_driver betöltve, aláírás OK.  [grubenv next_entry: —]", "cur": "S4", "edge": null, "line": 4}, {"msg": "HIBA (S4): modprobe lab-net-driver: Key was rejected by service  | adatgyűjtés: mokutil --sb-state; modinfo lab-net-driver | grep -i sig", "cur": "F2", "edge": ["S4", "F2"], "line": 6}, {"msg": "Rollback/recovery: M3: a DKMS-modul MOK-aláírása és enroll (MokManager); ha nem megy: R1 grub-reboot \"1>2\" + reboot → next_entry=1>2 (egyszeri), a saved_entry változatlan.  [grubenv next_entry: 1>2]", "cur": "M3", "edge": ["F2", "M3"], "line": 7, "rb": ["M3", "R1", "S0"]}], "bootentry": [{"msg": "S0 baseline: uname -r = 6.8.0-45-generic, dkms status installed, grub-editenv list (saved_entry).  [grubenv next_entry: —]", "cur": "S0", "edge": null, "line": 0}, {"msg": "S1: apt-get install --only-upgrade linux-image-generic linux-headers-generic linux-firmware → 6.8.0-50-generic.  [grubenv next_entry: —]", "cur": "S1", "edge": null, "line": 1}, {"msg": "S2: dkms autoinstall, update-initramfs -c -k all, update-grub.  [grubenv next_entry: —]", "cur": "S2", "edge": null, "line": 2}, {"msg": "S3: systemctl reboot (konzol elérhető).  [grubenv next_entry: —]", "cur": "S3", "edge": null, "line": 3}, {"msg": "S4 smoke test: uname -r = 6.8.0-50-generic, lab-app active, health 200, lab_net_driver betöltve, aláírás OK.  [grubenv next_entry: —]", "cur": "S4", "edge": null, "line": 4}, {"msg": "HIBA (S4): uname -r = 6.8.0-45-generic (a régi kernel indult)  | adatgyűjtés: sudo grub-editenv list; grep '^menuentry' /boot/grub/grub.cfg", "cur": "F4", "edge": ["S4", "F4"], "line": 6}, {"msg": "Rollback/recovery: update-grub, a saved_entry ellenőrzése, majd újra S3 (reboot).  [grubenv next_entry: —]", "cur": "S2", "edge": ["F4", "S2"], "line": 7, "rb": ["S2"]}]}, NODES={"S0": [0.6, 10.2, "S0 baseline", "uname -r = 6.8.0-45-generic\ndkms: installed; grubenv"], "S1": [0.6, 8.3, "S1 csomagfrissítés", "célkernel 6.8.0-50-generic"], "S2": [0.6, 6.4, "S2 DKMS + initramfs\n+ update-grub", ""], "S3": [0.6, 4.5, "S3 reboot", ""], "S4": [0.6, 2.6, "S4 smoke test", "5 ellenőrzés: új kernel, lab-app,\nhealth 200, modul, aláírás"], "S5": [0.6, 0.7, "S5 elfogadás", "canary → flotta"], "F1": [7.4, 6.4, "DKMS build failed", "hiányzó linux-headers"], "F3": [7.4, 4.5, "(initramfs) gave up waiting\nfor root device", ""], "F2": [7.4, 2.95, "Key was rejected by service", "Secure Boot: aláíratlan modul"], "F4": [7.4, 1.35, "uname -r = 6.8.0-45-generic", "boot entry: régi kernel indult"], "R1": [13.6, 8.3, "R1 grub-reboot \"1>2\"", "+ reboot (futó rendszerből)"], "R2": [13.6, 5.6, "R2 konzol GRUB-menü", "előző kernel → S0"], "R3": [13.6, 10.2, "R3 snapshot visszaállítás", "hypervisor"], "M3": [13.6, 2.95, "M3 MOK-aláírás/enroll", "Secure Boot marad bekapcsolva"]}, FAULTS={"dkms": {"at": "S2", "node": "F1", "sym": "DKMS build failed: hiányzó linux-headers-6.8.0-50-generic", "cmd": "dkms status; ls /lib/modules/6.8.0-50-generic/updates", "rb": ["S2"], "ne": "—", "rbmsg": "Reboot előtt javítható: linux-headers telepítése + dkms autoinstall, utána tovább S3-ra; a futó kernel érintetlen."}, "initramfs": {"at": "S3", "node": "F3", "sym": "(initramfs) gave up waiting for root device", "cmd": "lsinitramfs /boot/initrd.img-6.8.0-50-generic | grep <modul>", "rb": ["R2", "S0"], "ne": "—", "rbmsg": "R2: konzol GRUB-menü → előző kernel; update-initramfs -c -k 6.8.0-50-generic, majd újrapróba."}, "secureboot": {"at": "S4", "node": "F2", "sym": "modprobe lab-net-driver: Key was rejected by service", "cmd": "mokutil --sb-state; modinfo lab-net-driver | grep -i sig", "rb": ["M3", "R1", "S0"], "ne": "1>2", "rbmsg": "M3: a DKMS-modul MOK-aláírása és enroll (MokManager); ha nem megy: R1 grub-reboot \"1>2\" + reboot → next_entry=1>2 (egyszeri), a saved_entry változatlan."}, "bootentry": {"at": "S4", "node": "F4", "sym": "uname -r = 6.8.0-45-generic (a régi kernel indult)", "cmd": "sudo grub-editenv list; grep '^menuentry' /boot/grub/grub.cfg", "rb": ["S2"], "ne": "—", "rbmsg": "update-grub, a saved_entry ellenőrzése, majd újra S3 (reboot)."}}, ORDER=["S0", "S1", "S2", "S3", "S4", "S5"];
function inj(){ setSteps(ALL[document.getElementById("fault").value]); }
function render(s){
  svg.setAttribute("viewBox","0 0 640 410"); svg.innerHTML="";
  const X=v=>10+v*32, Y=v=>390-(v+1.25)*31, w=5.3*32, h=1.25*31;
  const f=FAULTS[document.getElementById("fault").value];
  const visited=new Set(); STEPS.slice(0,k+1).forEach(t=>{visited.add(t.cur); if(t.rb) t.rb.forEach(r=>visited.add(r));});
  function edge(a,b,dash,on){const A=NODES[a],B=NODES[b];
    const ax=X(A[0])+w/2, ay=Y(A[1])+h/2, bx=X(B[0])+w/2, by=Y(B[1])+h/2;
    el("line",{x1:ax,y1:ay,x2:bx,y2:by,stroke:on?css("--hl2"):css("--muted"),"stroke-width":on?3.5:1.3,"stroke-dasharray":dash});}
  for(let i=0;i<ORDER.length-1;i++) edge(ORDER[i],ORDER[i+1],"",false);
  for(const kk in FAULTS){const F=FAULTS[kk]; edge(F.at,F.node,"7 4",s.edge&&s.edge[1]===F.node);}
  if(s.edge) edge(s.edge[0],s.edge[1],s.edge[0][0]==="F"?"2 4":"7 4",true);
  for(const n in NODES){const p=NODES[n], on=s.cur===n, vis=visited.has(n);
    el("rect",{x:X(p[0]),y:Y(p[1]),width:w,height:h,rx:12,fill:on?css("--cellhl"):(vis?css("--cell"):css("--bg")),stroke:on?css("--hl2"):css("--line"),"stroke-width":on?3.5:1,"stroke-dasharray":n[0]==="F"?"6 3":""});
    p[2].split("\n").forEach((l,j)=>el("text",{x:X(p[0])+w/2,y:Y(p[1])+15+j*13,"text-anchor":"middle","font-size":10.5,"font-weight":"bold"},l));}
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
