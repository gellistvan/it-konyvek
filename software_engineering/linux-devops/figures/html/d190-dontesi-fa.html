<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konténerhiba döntési fa</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--s2:#e6e6e6;--s3:#bfbfbf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--s2:#333;--s3:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.mono{font-family:ui-monospace,monospace}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
 .q{font-size:17px;font-weight:600;margin:8px 0} .ans button{margin-right:6px;padding:6px 14px} .leaf{border:3px solid var(--line);padding:8px 12px;margin:8px 0}</style></head><body>
<div class="ctl"><label>Példa betöltése (38.5.5 1. feladat): <select id="ex"><option value="">– válassz –</option><option value="a">a) Cannot connect to the Docker daemon</option><option value="b">b) lab-app OOMKilled=true</option><option value="c">c) curl …:8081/health → 502 Bad Gateway</option><option value="d">d) lab-proxy nem indul: hiányzik az upstream sor</option></select></label>
<button id="restart">⟲ Újrakezdés</button></div>
<div id="status" aria-live="polite"></div>
<div id="box"></div>
<p class="small">Bejárt út:</p><pre id="path"></pre>
<script>
const Q = {"q1": ["Válaszol a daemon?", "docker info", [["nem", "runtime"], ["igen", "q2"]]], "q2": ["Létrejött / elindult\na konténer?", "docker compose ps", [["nem", "img1"], ["igen, de kilép", "q3"], ["fut", "q4"]]], "q3": ["ExitCode 137 /\noom esemény?", "inspect: OOMKilled", [["igen", "host"], ["nem", "img2"]]], "q4": ["Feloldja a nevet,\neléri a portot?", "getent hosts lab-db", [["nem", "net"], ["igen", "netapp"]]]}, L = {"runtime": ["Runtime", "systemctl status\ndocker", "38.5.2 runtime-ellenőrzés: docker info, systemctl status docker, docker events"], "img1": ["Image/config", "docker compose\nconfig\ndocker logs", "Image pull „manifest unknown”; Permission denied a volume mountnál"], "img2": ["Image/config", "docker logs\ndocker inspect", "Image pull „manifest unknown”; Permission denied a volume mountnál"], "host": ["Host/cgroup", "docker events\n--filter event=oom\njournalctl -k", "OOM-killed és restart loop"], "net": ["Network", "getent hosts lab-db\nss -ltnp", "DNS-feloldás sikertelen a lab-db névre; Port ütközés"], "netapp": ["Network/app.", "curl a bridge IP-re\ndocker logs\nlab-proxy", "DNS-feloldás sikertelen a lab-db névre"]}, EX = {"a": ["Cannot connect to the Docker daemon", [["q1", "nem"]]], "b": ["lab-app OOMKilled=true", [["q1", "igen"], ["q2", "igen, de kilép"], ["q3", "igen"]]], "c": ["curl …:8081/health → 502 Bad Gateway", [["q1", "igen"], ["q2", "fut"], ["q4", "igen"]]], "d": ["lab-proxy nem indul: hiányzik az upstream sor", [["q1", "igen"], ["q2", "nem"]]]};
let node = "q1", path = [], auto = null;
function show(){
  const box = document.getElementById("box"); box.innerHTML = "";
  if (Q[node]) {
    const [t, cmd, outs] = Q[node];
    box.innerHTML = `<div class="q">${t}</div><div class="small">Ellenőrzés: <code>${cmd}</code></div>`;
    const a = document.createElement("div"); a.className = "ans ctl";
    outs.forEach(([ans, nx]) => { const b = document.createElement("button"); b.textContent = ans; b.onclick = () => go(ans, nx); a.appendChild(b); });
    box.appendChild(a);
    document.getElementById("status").textContent = "Kérdés: " + t + " (" + cmd + ")";
  } else {
    const [lay, cmd, ref] = L[node];
    box.innerHTML = `<div class="leaf"><div class="q">Réteg: ${lay}</div><div>Első parancs(ok):</div><pre>${cmd}</pre>
      <div class="small">Lásd: <a href="../../d190.html#hibák-és-ellenpróbák" target="_top">38.5.4 Hibák és ellenpróbák</a> – ${ref}</div></div>`;
    document.getElementById("status").textContent = "Eredmény: " + lay + " réteg. Első parancs: " + cmd.replace(/\n/g, "; ");
  }
  document.getElementById("path").textContent = path.length ? path.join("\n") : "(még nincs)";
}
function go(ans, nx){ path.push(Q[node][0] + " → " + ans); node = nx; show(); }
function reset(){ if (auto) { clearInterval(auto); auto = null; } node = "q1"; path = []; show(); }
document.getElementById("restart").onclick = () => { document.getElementById("ex").value = ""; reset(); };
document.getElementById("ex").onchange = e => { reset(); const k = e.target.value; if (!k) return; const steps = EX[k][1].slice();
  path.push("Tünet: " + EX[k][0]); show();
  auto = setInterval(() => { if (!steps.length) { clearInterval(auto); auto = null; return; } const [q, ans] = steps.shift();
    const nx = Q[q][2].find(o => o[0] === ans)[1]; go(ans, nx); }, 700); };
show();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
