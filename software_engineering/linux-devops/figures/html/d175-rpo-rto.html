<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovery rehearsal: RPO és RTO</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<label>backup-gyakoriság <input id="iv" type="range" min="600" max="7200" step="300" value="3600" aria-label="backup-gyakoriság másodpercben"> <b id="ivv"></b> s</label>
<label>failure ideje az utolsó backup után <input id="tf" type="range" min="0" max="7200" step="60" value="2400" aria-label="failure ideje"> <b id="tfv"></b> s</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Idővonal: utolsó backup, elveszett adat, host failure, majd a helyreállítás lépései a postcondition OK-ig; RPO a failure és az utolsó backup, RTO a failure és a sikeres postcondition között."></svg>
<div id="extra"></div>
<p class="small">Szemléltető lépésidők, nem mérés. A tengely két szakaszra bontott (backup–failure, illetve helyreállítás), nem lineáris. A profil céljai: rpo_s 3600, rto_s 900. A „saját mérés” mezőkbe a rehearsal naplójának időbélyegei írhatók (epoch másodperc).</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}


const ST = [["golden image checksum", 30], ["seed ISO build", 10], ["qcow2 létrehozás", 5], ["define + start", 40], ["cloud-init smoke", 120], ["restic restore", 60], ["postcondition check", 20]], RTO_GOAL = 900, RPO_GOAL = 3600;
const g = id => document.getElementById(id);
const ex = document.getElementById("extra");
ex.innerHTML = '<div class="ctl" role="group" aria-label="Lépésidők">' + ST.map((s, i) =>
  `<label>${s[0]} <input id="d${i}" type="number" min="0" max="3600" value="${s[1]}" style="width:5em" aria-label="${s[0]} másodpercben"> s</label>`).join("") +
  '</div><div class="ctl" role="group" aria-label="Saját mérés"><b>Saját mérés (epoch s):</b>' +
  '<label>utolsó backup <input id="m0" type="number" style="width:9em"></label>' +
  '<label>failure <input id="m1" type="number" style="width:9em"></label>' +
  '<label>postcondition OK <input id="m2" type="number" style="width:9em"></label> <span id="mres" aria-live="polite"></span></div>';
document.querySelectorAll("input").forEach(i => i.addEventListener("input", draw));
function draw(){
  const iv = +g("iv").value; let tf = +g("tf").value; g("ivv").textContent = iv; g("tfv").textContent = tf;
  const durs = ST.map((s, i) => Math.max(0, +(g("d" + i) || {value: s[1]}).value || 0));
  const lastB = Math.floor(tf / iv) * iv, rpo = tf - lastB, rto = durs.reduce((a, b) => a + b, 0);
  svg.setAttribute("viewBox", "0 0 640 250"); svg.innerHTML = ""; D();
  const sx = tt => tt <= tf ? 20 + 280 * tt / Math.max(tf, 1) : 320 + 290 * (tt - tf) / Math.max(rto, 1);
  A(20, 160, 300, 160, {noh: 1, sw: 1}); A(300, 160, 320, 160, {noh: 1, sw: 1, dash: "2 3"}); A(320, 160, 610, 160, {noh: 1, sw: 3});
  for (let b = 0; b <= tf; b += iv) { el("circle", {cx: sx(b), cy: 160, r: 5, fill: css("--fg")}); }
  R(sx(lastB), 152, Math.max(sx(tf) - sx(lastB), 1), 16, {rx: 0, fill: "url(#hatch)", sw: 0.8});
  T(sx(lastB) + 2, 186, "utolsó backup", {a: "start", fs: 10.5}); T(300, 186, "failure", {a: "end", fs: 10.5, bold: 1});
  el("path", {d: `M300 150 l-6 -10 h12 z`, fill: css("--fg")});
  let t = tf; durs.forEach((d, i) => { const x0 = sx(t), x1 = sx(t + d), y = 22 + i*17;
    R(x0, y, Math.max(x1 - x0, 2), 12, {rx: 0, fill: css("--muted"), sw: 0.5});
    T(x0 - 4, y + 10, `${ST[i][0]} (${d} s)`, {a: "end", fs: 10}); t += d; });
  T(610, 186, "postcondition OK", {a: "end", fs: 10.5});
  const bad1 = rpo > RPO_GOAL, bad2 = rto > RTO_GOAL;
  A(sx(lastB), 215, sx(tf), 215, {both: 1, sw: 1.5, stroke: bad1 ? css("--hl2") : css("--fg")});
  T(Math.max((sx(lastB) + sx(tf))/2, 110), 236, `RPO ${rpo} s (cél ≤ ${RPO_GOAL})`, {fs: 11, bold: 1, fill: bad1 ? css("--hl2") : undefined});
  A(sx(tf), 215, sx(t), 215, {both: 1, sw: 1.5, stroke: bad2 ? css("--hl2") : css("--fg")});
  T((sx(tf) + sx(t))/2, 236, `RTO ${rto} s (cél ≤ ${RTO_GOAL})`, {fs: 11, bold: 1, fill: bad2 ? css("--hl2") : undefined});
  status.textContent = `RPO = failure − utolsó sikeres backup = ${rpo} s (legrosszabb eset a gyakoriság: ${iv} s); RTO = postcondition OK − failure = ${rto} s. ` +
    ((bad1 || bad2) ? "CÉL MEGSÉRTVE: " + [bad1 ? `RPO > ${RPO_GOAL} s` : "", bad2 ? `RTO > ${RTO_GOAL} s` : ""].filter(Boolean).join(", ") : "Mindkét cél teljesül.") +
    (iv > RPO_GOAL ? ` (A ${iv} s-os gyakoriság mellett a legrosszabb RPO már a cél fölött van.)` : "");
  const m = [0, 1, 2].map(i => g("m" + i).value), mr = g("mres");
  if (m.every(v => v !== "")) { const r1 = m[1] - m[0], r2 = m[2] - m[1];
    mr.textContent = `mért RPO ${r1} s ${r1 <= RPO_GOAL ? "OK" : "CÉL MEGSÉRTVE"}, mért RTO ${r2} s ${r2 <= RTO_GOAL ? "OK" : "CÉL MEGSÉRTVE"}`; }
  else mr.textContent = "";
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
