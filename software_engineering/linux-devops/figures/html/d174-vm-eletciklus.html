<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>libvirt domain életciklus</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span id="info" class="small" aria-live="polite">Kattintson egy állapotra (kimenő élek) vagy egy élcímkére (részletek); Tab + Enter is működik.</span></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Állapotgép: nem definiált, shut off, running, paused, pmsuspended, managedsave-elt shut off, migrálás alatt, running a célhoston; élek a virsh-parancsokkal; a lejátszó a kidolgozott példa runbookját mutatja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">[M]: a memóriaállapot megmarad; [C]: crash-consistent lemez. A suspend paused állapotba visz (a vCPU-k állnak), az ACPI S3 a dompmsuspend. A runbook a managedsave-et futó domainen hívja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"state": "undef", "cmd": null, "msg": "1/7: kiinduló: a lab-cpp-vm nincs definiálva", "line": -1}, {"state": "off", "cmd": "define", "msg": "2/7: sudo virsh define lab-cpp-vm.xml", "line": -1}, {"state": "run", "cmd": "start", "msg": "3/7: sudo virsh start lab-cpp-vm → domstate: running", "line": -1}, {"state": "ms", "cmd": "managedsave", "msg": "4/7: virsh managedsave lab-cpp-vm (futó domainen!) → shut off + memóriakép", "line": -1}, {"state": "run", "cmd": "start", "msg": "5/7: virsh start lab-cpp-vm → a managedsave-kép visszatöltődik", "line": -1}, {"state": "mig", "cmd": "migrate --live", "msg": "6/7: virsh snapshot-create-as … pre-migrate; virsh migrate --live --persistent … lab-hv-b", "line": -1}, {"state": "dst", "cmd": "", "msg": "7/7: a lab-hv-b-n running, health check OK; ezután a forráson undefine (a pre-migrate snapshot metaadatával együtt)", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}

const ST = {"undef": ["nem definiált", [1.4, 5.6]], "off": ["shut off\n(perzisztens)", [1.4, 3.0]], "run": ["running", [5.4, 3.0]], "paused": ["paused", [9.4, 4.6]], "pm": ["pmsuspended", [9.4, 1.4]], "ms": ["shut off +\nmanagedsave-kép", [1.4, 0.4]], "mig": ["migrálás alatt", [5.4, 5.6]], "dst": ["running\n(célhoston)", [9.4, 6.9]]}, ED = [["undef", "off", "define", "", 0.3, "a domain XML létezik", "virsh list --all mutatja, shut off", "undefine"], ["off", "undef", "undefine", "", 0.3, "shut off, lease lejárt, owner jóváhagyta", "virsh list --all nem mutatja", "backupból újraépítés"], ["undef", "run", "create (tranziens)", "", 0.0, "XML + erőforrások", "running; leálláskor a definíció elvész", "destroy"], ["off", "run", "start", "", 0.14, "disk, hálózat, XML, jogosultság", "domstate: running", "shutdown"], ["run", "off", "shutdown", "", 0.14, "ACPI vagy guest agent válaszol", "domstate: shut off (rendezett)", "start"], ["run", "off", "destroy", "C", 0.62, "a rendezett leállítás nem válaszol", "shut off; a lemez crash-consistent, journal replay", "start + fájlrendszer-ellenőrzés"], ["run", "paused", "suspend", "M", 0.14, "running", "paused: a vCPU-k állnak, a memória a hoston", "resume"], ["paused", "run", "resume", "M", 0.14, "paused", "running", "suspend"], ["run", "pm", "dompmsuspend", "M", 0.14, "guest agent + vendég S3-támogatás", "pmsuspended (ACPI S3)", "dompmwakeup"], ["pm", "run", "dompmwakeup", "M", 0.14, "pmsuspended", "running", "dompmsuspend"], ["run", "ms", "managedsave", "M", 0.14, "running vagy paused", "shut off, a memóriakép lemezen", "start (visszatölt)"], ["ms", "run", "start", "M", 0.14, "managedsave-kép létezik", "running a mentett memóriaállapottal", "managedsave"], ["paused", "ms", "managedsave (paused-ból)", "M", null, "running vagy paused", "shut off, a memóriakép lemezen", "start (visszatölt)"], ["run", "mig", "migrate --live", "M", 0.0, "kompatibilis cél, nincs passthrough, storage elérhető", "a forráson nem fut", "pre-migrate snapshot, XML-mentés"], ["mig", "dst", "", "M", 0.0, "a memória átvitele kész", "a célhoston running, a health check válaszol", "a forráson újraindítás a mentésből"]], GEO = [[[[1.7, 5.114999999999999], [1.7, 3.485]], [2.0, 4.3], "center"], [[[1.0999999999999999, 3.485], [1.0999999999999999, 5.114999999999999]], [0.7999999999999998, 4.3], "center"], [[[2.146153846153846, 5.114999999999999], [4.653846153846154, 3.485]], [3.5634965051786245, 4.551533084890191], "center"], [[[2.685, 3.14], [4.115, 3.14]], [3.4000000000000004, 3.44], "center"], [[[4.115, 2.86], [2.685, 2.86]], [3.4000000000000004, 2.56], "center"], [[[4.8500000000000005, 3.485], [4.8500000000000005, 3.925], [1.9, 3.925], [1.9, 3.485]], [3.5000000000000004, 3.925], "center"], [[[6.560505305310426, 3.614986736723936], [8.135505305310426, 4.244986736723936]], [7.236588102404196, 4.208529743989514], "center"], [[[8.239494694689574, 3.985013263276063], [6.664494694689576, 3.3550132632760636]], [7.563411897595805, 3.3914702560104852], "center"], [[[6.664494694689576, 2.6449867367239364], [8.239494694689574, 2.014986736723936]], [7.563411897595805, 2.608529743989514], "center"], [[[8.135505305310426, 1.7550132632760636], [6.560505305310426, 2.385013263276064]], [7.236588102404196, 1.7914702560104856], "center"], [[[4.730144522929512, 2.397617893717911], [2.222452215237204, 0.7676178937179108]], [3.6397948742619826, 1.3310848088277198], "center"], [[[2.069855477070488, 1.0023821062820892], [4.577547784762796, 2.632382106282089]], [3.160205125738018, 2.0689151911722803], "center"], [[[10.685, 4.6], [10.9, 4.6], [10.9, -0.55], [1.4, -0.55], [1.4, -0.08499999999999996]], [6.6, -0.55], "center"], [[[5.4, 3.485], [5.4, 5.114999999999999]], [5.1000000000000005, 4.3], "center"], [[[6.6850000000000005, 6.017625], [8.115, 6.482375]], [7.307274178298733, 6.535310220619285], "center"]];
let SELS = null;
function P(p){ return [p[0]*56, 30 + (7.45 - p[1])*44]; }
function pick(text){ document.getElementById("info").textContent = text; }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 400"); svg.innerHTML = ""; D();
  const prev = (STEPS[k-1] || {}).state;
  ED.forEach((e, i) => { const [a, b, cmd, mark] = e, g = GEO[i];
    const out = SELS === a, cur = k > 0 && prev === a && s.state === b && (s.cmd === cmd || (!cmd && !s.cmd));
    const pts = g[0].map(P);
    el("polyline", {points: pts.map(p => p.join(",")).join(" "), fill: "none",
      stroke: cur ? css("--hl2") : (out ? css("--hl") : css("--line")), "stroke-width": cur || out ? 3 : 1.2,
      "stroke-dasharray": cmd === "destroy" ? "6 4" : "", "marker-end": cur ? "url(#ahh)" : (out ? "url(#ahb)" : "url(#ah)")});
    if (!cmd && !mark) return;
    const lab = (cmd === "destroy" ? "⚠ " : "") + (cmd || "") + (mark ? ` [${mark}]` : ""), q = P(g[1]);
    const w = lab.length * 6 + 8;
    const r = R(q[0] - w/2, q[1] - 9, w, 18, {fill: css("--bg"), stroke: "none", rx: 3});
    const t = T(q[0], q[1] + 4, lab, {fs: 10.5, bold: cur || out});
    [r, t].forEach(n => { n.style.cursor = "pointer"; });
    r.setAttribute("tabindex", "0"); r.setAttribute("role", "button"); r.setAttribute("aria-label", lab);
    const f = () => pick(`${cmd || "migráció vége"} (${ST[a][0].replace("\n", " ")} → ${ST[b][0].replace("\n", " ")}): előfeltétel: ${e[5]}; postcondition: ${e[6]}; rollback: ${e[7]}.` + (mark === "C" ? " A lemez crash-consistent." : (mark === "M" ? " A memóriaállapot megmarad." : "")));
    [r, t].forEach(n => n.addEventListener("click", f)); r.addEventListener("keydown", ev => { if (ev.key === "Enter") f(); });
  });
  Object.entries(ST).forEach(([key, v]) => { const p = P(v[1]), on = s.state === key;
    const r = R(p[0] - 68, p[1] - 18, 136, 36, {rx: 14, fill: on ? css("--cellhl") : css("--cell"), sw: on ? 3.5 : (SELS === key ? 2.5 : 1.2), stroke: SELS === key ? css("--hl") : css("--line"), dash: key === "mig" ? "5 3" : ""});
    r.style.cursor = "pointer"; r.setAttribute("tabindex", "0"); r.setAttribute("role", "button"); r.setAttribute("aria-label", v[0]);
    const f = () => { SELS = SELS === key ? null : key; pick(`${v[0].replace("\n", " ")}: kimenő élek: ` + (ED.filter(e => e[0] === key).map(e => e[2] || "→ célhost").join(", ") || "nincs")); render(STEPS[k]); };
    r.addEventListener("click", f); r.addEventListener("keydown", ev => { if (ev.key === "Enter") f(); });
    v[0].split("\n").forEach((t, j, a) => { const n = T(p[0], p[1] + 4 + (j - (a.length - 1)/2)*13, t, {fs: 11, bold: on}); n.style.pointerEvents = "none"; });
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
