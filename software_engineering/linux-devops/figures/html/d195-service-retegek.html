<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service-adatút és diagnosztikai rétegek</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--s2:#e6e6e6;--s3:#bfbfbf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--s2:#333;--s3:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.mono{font-family:ui-monospace,monospace}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
 g.st{cursor:pointer} g.st:focus{outline:none}</style></head><body>
<div class="ctl"><label><input type="checkbox" id="brk"> readiness elront (lab-app → ready: false)</label></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 720 400" role="img" aria-label="Service-adatút és kattintható diagnosztikai lépcső"></svg>
<pre id="row" aria-label="A 39.5.4 táblázat megfelelő sora"></pre>
<p class="small">Kattints (vagy Tab + Enter) egy lépcsőfokra: kiemeli az érintett elemet és megmutatja a 39.5.4 hibatáblázat sorát (Tünet | Hipotézis | Adatgyűjtés | Javítás). Illusztratív Pod-IP-k.</p>
<script>
const D = {"chain": [["debug", "Pod lab-debug\ncurl http://lab-app-svc:8080/healthz"], ["dns", "DNS: lab-app-svc.lab-d195.svc\n→ ClusterIP"], ["svc", "Service lab-app-svc (ClusterIP)\nport 8080 → targetPort http"], ["sel", "selector: app=lab-app"], ["eps", "EndpointSlice"]], "eps": [["10.244.1.5:8080", true, "Pod lab-app\napp :8080 (http)"], ["10.244.2.7:8080", false, "2. Pod (hibás)\nReady=False"]], "stair": [["image pull", "ImagePullBackOff", "kubectl describe pod lab-app  (Events)", "pod", "ImagePullBackOff | digest / registry / auth | describe: Failed to pull image | helyes digest, imagePullSecret"], ["konténer start", "CreateContainerConfigError,\nCrashLoopBackOff", "kubectl logs lab-app --previous", "pod", "CrashLoopBackOff | a C++ process nem nulla kóddal lép ki | logs, describe: Last State | LISTEN_PORT, kódhiba"], ["konfiguráció", "LISTEN_PORT ≠ 8080", "kubectl get configmap -o yaml", "pod", "CrashLoopBackOff / Ready=False | rossz LISTEN_PORT | ConfigMap, logs | LISTEN_PORT=8080"], ["erőforrás", "OOMKilled, Exit Code 137", "kubectl describe pod lab-app  (Last State)", "pod", "OOMKilled | túl alacsony memórialimit | describe: Reason OOMKilled, 137 | limits.memory növelése"], ["probe", "Ready=False (Unhealthy)", "kubectl describe pod lab-app  (Events)", "eps", "Ready=False | readiness 400/500 vagy timeout | describe: Readiness probe failed | readiness path / logika"], ["endpoint", "Service elérhető", "kubectl get endpointslice -n lab-d195", "svc", "– | a Pod IP-je az EndpointSlice-ban ready: true | get endpointslice | –"]]};
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(tag, a, txt, par){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; (par || svg).appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let sel = 5;
function draw(){
  const brk = document.getElementById("brk").checked, hl = D.stair[sel][3];
  svg.innerHTML = "";
  const eps = D.eps.map((e, i) => [e[0], i === 0 ? !brk : e[1], e[2]]);
  D.chain.slice(0, 4).forEach(([k, t], i) => { const y = 10 + i * 52, on = (hl === "svc" && (k === "svc" || k === "sel"));
    el("rect", {x: 10, y: y, width: 330, height: 40, rx: 5, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1});
    t.split("\n").forEach((l, j) => el("text", {x: 18, y: y + 16 + j * 15, "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, l));
    if (i < 3) el("line", {x1: 175, x2: 175, y1: y + 40, y2: y + 52, stroke: css("--line"), "stroke-width": 1.5}); });
  const ye = 222, epson = hl === "eps" || hl === "svc";
  el("rect", {x: 10, y: ye, width: 330, height: 62, fill: epson ? css("--cellhl") : css("--cell"), stroke: epson ? css("--hl") : css("--line"), "stroke-width": epson ? 3 : 1});
  el("text", {x: 18, y: ye + 16, "font-size": 12, "font-weight": "bold"}, "EndpointSlice");
  eps.forEach(([ip, ok], i) => el("text", {x: 24, y: ye + 34 + i * 17, "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, ip + "  ready: " + ok));
  eps.forEach(([ip, ok, t], i) => { const x = 10 + i * 170, on = hl === "pod" && i === 0;
    el("line", {x1: x + 80, x2: x + 80, y1: ye + 62, y2: 320, stroke: css("--line"), "stroke-width": ok ? 2.5 : 1, "stroke-dasharray": ok ? "" : "3 3"});
    if (!ok) el("text", {x: x + 80, y: 308, "text-anchor": "middle", "font-size": 20, "font-weight": "bold", fill: css("--hl2")}, "✗");
    el("rect", {x: x, y: 320, width: 160, height: 44, rx: 5, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": ok ? "" : "5 3"});
    t.split("\n").forEach((l, j) => el("text", {x: x + 8, y: 337 + j * 15, "font-size": 11}, j === 1 && i === 0 && brk ? "Ready=False (readiness)" : l)); });
  D.stair.forEach(([lay, sym, cmd], i) => { const y = 350 - i * 56, x = 370 + i * 10, on = i === sel;
    const g = el("g", {class: "st", tabindex: 0, role: "button", "aria-label": (i + 1) + ". " + lay + ": " + sym.replace("\n", " ")});
    el("rect", {x: x, y: y - 44, width: 710 - x, height: 50, fill: on ? css("--cellhl") : css("--cell"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1, "stroke-dasharray": i < 5 ? "5 3" : ""}, undefined, g);
    el("text", {x: x + 8, y: y - 26, "font-size": 12.5, "font-weight": "bold"}, (i + 1) + ". " + lay, g);
    el("text", {x: 700, y: y - 26, "text-anchor": "end", "font-size": 10}, sym.replace("\n", " "), g);
    el("text", {x: x + 8, y: y - 8, "font-size": 10.5, style: "font-family:ui-monospace,monospace"}, cmd, g);
    g.addEventListener("click", () => { sel = i; draw(); });
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sel = i; draw(); } }); });
  document.getElementById("row").textContent = "39.5.4 – " + D.stair[sel][4];
  document.getElementById("status").textContent = (sel + 1) + ". réteg: " + D.stair[sel][0] + " – első parancs: " + D.stair[sel][2] + ". " +
    (brk ? "A lab-app ready: false → a Service nem küld rá forgalmat (curl hiba), bár a Pod Running." : "A curl a ready: true végponthoz (10.244.1.5:8080) jut.");
}
document.getElementById("brk").addEventListener("input", draw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
