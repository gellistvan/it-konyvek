<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPU-idő: futás, throttling és steal</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>quota: <input type="range" id="q" min="50000" max="400000" step="10000" value="200000" aria-label="cpu.max quota µs"> <span id="qv">200000</span> µs</label> <label>szálak: <input type="range" id="n" min="1" max="4" step="1" value="3" aria-label="szálszám"> <span id="nv">3</span></label> <label><input type="checkbox" id="st" checked> steal (10 ms, vCPU1)</label><script>function upd(){ const q = +document.getElementById("q").value, n = +document.getElementById("n").value, st = document.getElementById("st").checked; document.getElementById("qv").textContent = q; document.getElementById("nv").textContent = n; SIM = simulate(q, n, st); setSteps(mkSteps(SIM)); } ["q","n","st"].forEach(id => document.getElementById(id).addEventListener("input", upd));</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három szál két 100 ms-os periódusban: a kvóta 66,7 ms után elfogy, a szálak throttled állapotba kerülnek; a második periódusban egy vCPU-ról a hypervisor 10 ms-ot ellop."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell, nem mérés (100 µs-os rács, periódusonként újratöltődő kvóta, burst nélkül). A steal a kvótát nem fogyasztja, és a cpu.stat-ban nem jelenik meg.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "usage": 0, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 5000, "usage": 15000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 10000, "usage": 30000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 15000, "usage": 45000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 20000, "usage": 60000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 25000, "usage": 75000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 30000, "usage": 90000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 35000, "usage": 105000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 40000, "usage": 120000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 45000, "usage": 135000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 50000, "usage": 150000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 55000, "usage": 165000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 60000, "usage": 180000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 65000, "usage": 195000, "nr_periods": 1, "nr_throttled": 0, "thr": 0, "st": 0, "line": -1, "msg": ""}, {"t": 70000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 9900, "st": 0, "line": -1, "msg": ""}, {"t": 75000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 24900, "st": 0, "line": -1, "msg": ""}, {"t": 80000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 39900, "st": 0, "line": -1, "msg": ""}, {"t": 85000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 54900, "st": 0, "line": -1, "msg": ""}, {"t": 90000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 69900, "st": 0, "line": -1, "msg": ""}, {"t": 95000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 84900, "st": 0, "line": -1, "msg": ""}, {"t": 100000, "usage": 200100, "nr_periods": 1, "nr_throttled": 1, "thr": 99900, "st": 0, "line": -1, "msg": ""}, {"t": 105000, "usage": 210100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 5000, "line": -1, "msg": ""}, {"t": 110000, "usage": 220100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 115000, "usage": 235100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 120000, "usage": 250100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 125000, "usage": 265100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 130000, "usage": 280100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 135000, "usage": 295100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 140000, "usage": 310100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 145000, "usage": 325100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 150000, "usage": 340100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 155000, "usage": 355100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 160000, "usage": 370100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 165000, "usage": 385100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 170000, "usage": 400100, "nr_periods": 2, "nr_throttled": 1, "thr": 99900, "st": 10000, "line": -1, "msg": ""}, {"t": 175000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 114900, "st": 10000, "line": -1, "msg": ""}, {"t": 180000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 129900, "st": 10000, "line": -1, "msg": ""}, {"t": 185000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 144900, "st": 10000, "line": -1, "msg": ""}, {"t": 190000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 159900, "st": 10000, "line": -1, "msg": ""}, {"t": 195000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 174900, "st": 10000, "line": -1, "msg": ""}, {"t": 200000, "usage": 400100, "nr_periods": 2, "nr_throttled": 2, "thr": 189900, "st": 10000, "line": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const P = 100000, DT = 100;
function simulate(Q, n, steal){
  const T = 2*P, N = T/DT, kinds = [];
  for (let i = 0; i < n; i++) kinds.push(new Array(N));
  let remaining = 0, nrThr = 0, thr = 0, usage = 0, st = 0, throttledP = false;
  const snaps = [];
  for (let tick = 0; tick < N; tick++) {
    const t = tick*DT;
    if (t % P === 0) { remaining = Q; throttledP = false; }
    const stolen = []; let nrun = 0;
    for (let i = 0; i < n; i++) { stolen.push(steal && i === 1 && t >= P && t < P + 10000); if (!stolen[i]) nrun++; }
    if (remaining <= 0 && !throttledP) { throttledP = true; nrThr++; }
    for (let i = 0; i < n; i++) {
      if (stolen[i]) { kinds[i][tick] = "steal"; st += DT; }
      else if (remaining > 0) { kinds[i][tick] = "run"; usage += DT; }
      else { kinds[i][tick] = "thr"; thr += DT; }
    }
    if (remaining > 0) remaining -= nrun*DT;
    if ((t + DT) % 5000 === 0) snaps.push({t:t+DT, usage:usage, nr_periods:Math.floor(t/P)+1, nr_throttled:nrThr, thr:thr, st:st});
  }
  const segs = [];
  for (let i = 0; i < n; i++) {
    let cur = kinds[i][0], start = 0;
    for (let tick = 1; tick <= N; tick++) {
      const kd = tick < N ? kinds[i][tick] : null;
      if (kd !== cur) { segs.push([i, start*DT, tick*DT, cur]); cur = kd; start = tick; }
    }
  }
  return {segs:segs, snaps:snaps, Q:Q, n:n, steal:steal};
}
let SIM = simulate(200000, 3, true);
function mkSteps(sim){ return [{t:0, usage:0, nr_periods:1, nr_throttled:0, thr:0, st:0}].concat(sim.snaps).map(s => Object.assign({line:-1, msg:""}, s)); }

function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const x0 = 70, W = 550, sc = W/200000, n = SIM.n;
  const d = el("defs", {});
  d.innerHTML = '<pattern id="pu" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="' + css("--cell") + '"/><line x1="1" y1="0" x2="1" y2="5" stroke="' + css("--line") + '" stroke-width="1"/></pattern>' +
    '<pattern id="pst" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="' + css("--cellhl") + '"/><path d="M0,0 L7,7 M7,0 L0,7" stroke="' + css("--line") + '" stroke-width="0.8"/></pattern>';
  for (let i = 0; i < n; i++) el("text", {x:8, y:40 + i*44 + 5, "font-size":12}, "vCPU" + i);
  SIM.segs.forEach(([i, a, b, kd]) => {
    const y = 24 + i*44;
    if (kd === "run") el("rect", {x:x0 + a*sc, y:y, width:(b-a)*sc, height:32, fill:"url(#pu)", stroke: css("--line"), "stroke-width":0.8});
    else if (kd === "thr") { el("rect", {x:x0 + a*sc, y:y, width:(b-a)*sc, height:32, fill: css("--bg"), stroke: css("--hl2"), "stroke-width":2, "stroke-dasharray":"5 3"}); if ((b-a)*sc > 52) el("text", {x:x0 + (a+b)/2*sc, y:y+21, "text-anchor":"middle", "font-size":11}, "throttled"); }
    else el("rect", {x:x0 + a*sc, y:y, width:(b-a)*sc, height:32, fill:"url(#pst)", stroke: css("--line"), "stroke-width":0.8});
  });
  const yb = 24 + n*44;
  el("line", {x1:x0 + 100000*sc, y1:14, x2:x0 + 100000*sc, y2:yb, stroke: css("--line"), "stroke-width":1.5});
  for (let t = 0; t <= 200; t += 20) el("text", {x:x0 + t*1000*sc, y:yb + 16, "text-anchor":"middle", "font-size":10.5}, String(t));
  el("text", {x:x0 + W/2, y:yb + 32, "text-anchor":"middle", "font-size":11}, "idő [ms]");
  el("line", {x1:x0 + s.t*sc, y1:12, x2:x0 + s.t*sc, y2:yb + 4, stroke: css("--hl"), "stroke-width":2.5});
  const yt = yb + 58;
  el("text", {x:10, y:yt, "font-size":12, "font-family":"ui-monospace,monospace"}, `cpu.stat @ ${s.t/1000} ms: usage_usec ${fmt(s.usage)}  nr_periods ${s.nr_periods}  nr_throttled ${s.nr_throttled}  throttled_usec ${fmt(s.thr)}`);
  const pct = s.t ? (100*s.usage/s.t).toFixed(0) : 0;
  el("text", {x:10, y:yt + 20, "font-size":12, "font-family":"ui-monospace,monospace"}, `time (user+sys) ${(s.usage/1000).toFixed(1).replace(".", ",")} ms   top %CPU ≈ ${pct}%   mpstat %st (vCPU1): ${s.t ? (100*s.st/s.t).toFixed(1).replace(".", ",") : "0"}%`);
  status.textContent = `t = ${s.t/1000} ms; cpu.max = ${SIM.Q} 100000; ${n} szál` + (SIM.steal ? "; steal: 10 ms a vCPU1-en (100–110 ms) – csak az mpstat %st-ben látszik" : "") + `. nr_throttled = ${s.nr_throttled}, throttled_usec = ${fmt(s.thr)}.`;
  el("text", {x:10, y:yt + 42, "font-size":10.5, fill: css("--muted")}, "minta: függőleges csík = fut (user+sys) · szaggatott keret = throttled · keresztsraff = steal · számított modell, nem mérés");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 400);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
