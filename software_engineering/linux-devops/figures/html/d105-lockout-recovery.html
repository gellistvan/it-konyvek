<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllowGroups-elírás: lockout és recovery</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="rb"> rollback ág (T6: a drop-in félretéve a javítás helyett)</label><script>document.getElementById("rb").addEventListener("change", e => { RB = e.target.checked; show(k); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Idővonal: hibás AllowGroups után a pozitív SSH-teszt elbukik, a recovery console-ról javított konfiguráció után a pozitív teszt sikeres, a negatívak elutasítottak."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 21.5.3–21.5.4 laborjának várt kimenetei, nem mérés. PASS = a kívánt eredmény. A rollback ág a baseline gyenge SSH-policyját állítja vissza: a jelszó-negatív teszt nem teljesül.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "line": -1, "msg": "T0 – baseline mentés"}, {"i": 1, "line": -1, "msg": "T1 – 20-lab-hardening.conf AllowGroups labssh (hiba!)"}, {"i": 2, "line": -1, "msg": "T2 – sshd -t: OK (szintaktikailag helyes!)"}, {"i": 3, "line": -1, "msg": "T3 – restart"}, {"i": 4, "line": -1, "msg": "T4 – pozitív teszt: FAIL"}, {"i": 5, "line": -1, "msg": "T5 – konzol: sshd -T"}, {"i": 6, "line": -1, "msg": "T6 – javítás: labssh-admin sshd -t && restart"}, {"i": 7, "line": -1, "msg": "T7 – pozitív: PASS uid=1000(labops) negatívak: elutasítva"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let RB = false;
const P = [{"t": "T0", "lane": "ssh", "short": "baseline mentés", "cmd": "mkdir -p ~/security-baseline/2025-01-15 && sudo sshd -T > …/sshd-effective.txt", "out": "a baseline mentve (gyenge policy: jelszó engedett)", "st": {"ssh": true, "pw": true, "root": false, "hard": false}}, {"t": "T1", "lane": "ssh", "short": "20-lab-hardening.conf\nAllowGroups labssh (hiba!)", "cmd": "sudoedit /etc/ssh/sshd_config.d/20-lab-hardening.conf   # AllowGroups labssh", "out": "a drop-in elírással kerül fel", "st": {"ssh": true, "pw": true, "root": false, "hard": true}}, {"t": "T2", "lane": "ssh", "short": "sshd -t: OK\n(szintaktikailag helyes!)", "cmd": "sudo sshd -t", "out": "(nincs kimenet, kilépési kód 0) – a csoportnév-elírást nem jelzi", "st": null}, {"t": "T3", "lane": "ssh", "short": "restart", "cmd": "sudo systemctl restart ssh", "out": "az új policy él: AllowGroups labssh", "st": {"ssh": false, "pw": false, "root": false, "hard": true}}, {"t": "T4", "lane": "ssh", "short": "pozitív teszt: FAIL", "cmd": "ssh -oBatchMode=yes -i ~/.ssh/id_ed25519 labops@lab-worker-1 -- id", "out": "labops@lab-worker-1: Permission denied (publickey).  → LOCKOUT", "st": null}, {"t": "T5", "lane": "con", "short": "konzol: sshd -T", "cmd": "sudo sshd -T | grep '^allowgroups'", "out": "allowgroups labssh", "st": null}, {"t": "T6", "lane": "con", "short": "javítás: labssh-admin\nsshd -t && restart", "cmd": "sudoedit …/20-lab-hardening.conf; sudo sshd -t && sudo systemctl restart ssh", "out": "allowgroups labssh-admin", "st": {"ssh": true, "pw": false, "root": false, "hard": true}, "rb": {"short": "rollback: drop-in félretéve", "cmd": "sudo mv /etc/ssh/sshd_config.d/20-lab-hardening.conf ~/rollback-2025-01-15-20-lab-hardening.conf && sudo sshd -t && sudo systemctl restart ssh", "out": "a baseline SSH-policy él újra (jelszó engedett)", "st": {"ssh": true, "pw": true, "root": false, "hard": true}}}, {"t": "T7", "lane": "ssh", "short": "pozitív: PASS uid=1000(labops)\nnegatívak: elutasítva", "cmd": "ssh -oBatchMode=yes -i ~/.ssh/id_ed25519 labops@lab-worker-1 -- id", "out": "uid=1000(labops) … ; jelszó és root: elutasítva", "st": null}], M = [["PASS", "FAIL", "PASS", "FAIL", "FAIL"], ["PASS", "FAIL", "PASS", "PASS", "PASS"], ["PASS", "FAIL", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["PASS", "PASS", "PASS", "PASS", "PASS"], ["PASS", "PASS", "PASS", "PASS", "PASS"]], MR = [["PASS", "FAIL", "PASS", "FAIL", "FAIL"], ["PASS", "FAIL", "PASS", "PASS", "PASS"], ["PASS", "FAIL", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["FAIL", "PASS", "PASS", "PASS", "PASS"], ["PASS", "FAIL", "PASS", "PASS", "PASS"], ["PASS", "FAIL", "PASS", "PASS", "PASS"]], TESTS = ["pozitív SSH (labops, kulcs)", "negatív: jelszó", "negatív: root", "AppArmor-negatív", "DAC-negatív"];
function render(s){
  svg.setAttribute("viewBox", "0 0 640 430");
  svg.innerHTML = "";
  const p = P[s.i];
  const alt = RB && p.rb;
  const cmd = alt ? p.rb.cmd : p.cmd, out = alt ? p.rb.out : p.out, sh = alt ? p.rb.short : p.short;
  status.textContent = p.t + " – " + sh.replace("\n", " ") + "  |  $ " + cmd + "  →  " + out;
  const X = P.map((_, i) => 150 + i * 66), YS = 70, YC = 160;
  el("text", {x:6, y:YS-6, "font-size":11.5, "font-weight":"bold"}, "SSH út");
  el("text", {x:6, y:YS+10, "font-size":10}, "labws → lab-worker-1:22");
  el("text", {x:6, y:YC-6, "font-size":11.5, "font-weight":"bold"}, "Recovery console");
  el("text", {x:6, y:YC+10, "font-size":10}, "hypervisor → labadmin");
  const cut = s.i >= 3;
  el("line", {x1:X[0]-10, y1:YS, x2:X[3], y2:YS, stroke: css("--line"), "stroke-width":3});
  const healed = s.i >= 6;
  el("line", {x1:X[3], y1:YS, x2:X[6], y2:YS, stroke: cut ? css("--hl2") : css("--line"), "stroke-width":3, "stroke-dasharray": cut && !healed ? "3 5" : (cut ? "3 5" : "")});
  el("line", {x1:X[6], y1:YS, x2:X[7]+10, y2:YS, stroke: css("--line"), "stroke-width":3, opacity: healed ? 1 : 0.35});
  if (cut) el("text", {x:(X[3]+X[6])/2, y:YS-14, "text-anchor":"middle", "font-size":11.5, "font-weight":"bold", fill: css("--hl2")}, "lockout (T3–T6)");
  el("line", {x1:X[0]-10, y1:YC, x2:X[7]+10, y2:YC, stroke: css("--line"), "stroke-width":2});
  P.forEach((q, i) => {
    const y = q.lane === "ssh" ? YS : YC, on = i === s.i, done = i <= s.i;
    el("circle", {cx:X[i], cy:y, r: on ? 9 : 6, fill: done ? (on ? css("--hl") : css("--cellhl")) : css("--bg"), stroke: css("--line"), "stroke-width":1.5});
    el("text", {x:X[i], y:y+ (q.lane === "ssh" ? 28 : 28), "text-anchor":"middle", "font-size":11.5, "font-weight": on ? "bold" : "normal"}, q.t);
  });
  el("text", {x:10, y:206, "font-size":12, "font-family":"ui-monospace,monospace"}, "$ " + (cmd.length > 84 ? cmd.slice(0, 84) + "…" : cmd));
  el("text", {x:10, y:226, "font-size":12, "font-family":"ui-monospace,monospace", fill: css("--hl")}, out);
  const MM = RB ? MR : M;
  const cols = [0, 4, s.i];
  const heads = ["T0", "T4", p.t + " (aktuális)"];
  el("text", {x:10, y:258, "font-size":12, "font-weight":"bold"}, "Tesztmátrix (PASS = desired)" + (RB ? " – rollback ág" : ""));
  heads.forEach((h, j) => el("text", {x:300 + j*110, y:258, "text-anchor":"middle", "font-size":11.5, "font-weight":"bold"}, h));
  TESTS.forEach((t, r) => {
    const y = 280 + r*28;
    el("text", {x:10, y:y+4, "font-size":11.5}, t);
    cols.forEach((c, j) => {
      const v = MM[c][r];
      el("rect", {x:250 + j*110, y:y-12, width:100, height:22, fill: v === "PASS" ? css("--cell") : css("--cellhl"), stroke: v === "PASS" ? css("--line") : css("--hl2"), "stroke-width": v === "PASS" ? 1 : 2.5, "stroke-dasharray": v === "PASS" ? "" : "5 3"});
      el("text", {x:300 + j*110, y:y+4, "text-anchor":"middle", "font-size":11.5, "font-weight":"bold"}, v);
    });
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
