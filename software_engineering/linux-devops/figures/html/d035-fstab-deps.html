<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hibás fstab-sor és a systemd boot-gráf</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="nofail" onchange="nf()"> nofail az fstab-sorban</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Függőségi gráf: fstab-sor, fstab-generator, lab-data mount unit, a címke szerinti device unit 90 másodperces timeouttal, local-fs.target, OnFailure emergency.target; nofail esetén multi-user.target, de a /lab-data nincs csatolva."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A naplósorok a fejezet várt kimenetéből. A mount unit neve escape-elt (lab\x2ddata.mount, T-D2-087). A nofail elfedi a függőséghibát, de nem teszi elérhetővé az adatot (7.5.4).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"t": 0, "msg": "t = 0 s: kernel → initrd → systemd PID 1; a generátor az fstab-sorból mount unitot készít (local-fs.target Requires=).", "cur": "gen", "failed": [], "log": -1, "cmd": "systemctl cat lab\\x2ddata.mount", "line": 0, "nofail": false, "reached": null}, {"t": 0, "msg": "t = 0 s: A lab\\x2ddata.mount indítása a dev-disk-by\\x2dlabel-lab\\x2ddata.device-ra vár (BindsTo + After).", "cur": "dev", "failed": [], "log": -1, "cmd": "systemctl list-dependencies local-fs.target", "line": 1, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A device job lejár (90 s), a LABEL=lab-data eszköz nem jelent meg.", "cur": "dev", "failed": ["dev"], "log": 0, "cmd": "journalctl -b -p err", "line": 2, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A mount unit függősége elbukott; a /lab-data nincs csatolva.", "cur": "mnt", "failed": ["dev", "mnt"], "log": 1, "cmd": "systemctl status lab\\x2ddata.mount", "line": 3, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A local-fs.target Requires-függése elbukott.", "cur": "lfs", "failed": ["dev", "mnt", "lfs"], "log": 2, "cmd": "systemctl status local-fs.target", "line": 4, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: OnFailure=emergency.target: a boot az emergency konzolon áll meg (nem kernel panic).", "cur": "em", "failed": ["dev", "mnt", "lfs"], "log": 2, "cmd": "journalctl -b -p err", "line": 5, "nofail": false, "reached": "em"}];
const CODE = ["systemd-fstab-generator → lab\\x2ddata.mount", "mount vár a device unitra (BindsTo + After)", "device timeout 90 s", "Dependency failed for /lab-data", "local-fs.target (Requires / nofail: Wants)", "OnFailure=emergency.target  |  nofail: multi-user.target"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL={"0": [{"t": 0, "msg": "t = 0 s: kernel → initrd → systemd PID 1; a generátor az fstab-sorból mount unitot készít (local-fs.target Requires=).", "cur": "gen", "failed": [], "log": -1, "cmd": "systemctl cat lab\\x2ddata.mount", "line": 0, "nofail": false, "reached": null}, {"t": 0, "msg": "t = 0 s: A lab\\x2ddata.mount indítása a dev-disk-by\\x2dlabel-lab\\x2ddata.device-ra vár (BindsTo + After).", "cur": "dev", "failed": [], "log": -1, "cmd": "systemctl list-dependencies local-fs.target", "line": 1, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A device job lejár (90 s), a LABEL=lab-data eszköz nem jelent meg.", "cur": "dev", "failed": ["dev"], "log": 0, "cmd": "journalctl -b -p err", "line": 2, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A mount unit függősége elbukott; a /lab-data nincs csatolva.", "cur": "mnt", "failed": ["dev", "mnt"], "log": 1, "cmd": "systemctl status lab\\x2ddata.mount", "line": 3, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: A local-fs.target Requires-függése elbukott.", "cur": "lfs", "failed": ["dev", "mnt", "lfs"], "log": 2, "cmd": "systemctl status local-fs.target", "line": 4, "nofail": false, "reached": null}, {"t": 90, "msg": "t = 90 s: OnFailure=emergency.target: a boot az emergency konzolon áll meg (nem kernel panic).", "cur": "em", "failed": ["dev", "mnt", "lfs"], "log": 2, "cmd": "journalctl -b -p err", "line": 5, "nofail": false, "reached": "em"}], "1": [{"t": 0, "msg": "t = 0 s: kernel → initrd → systemd PID 1; a generátor az fstab-sorból mount unitot készít (nofail: local-fs.target csak Wants=).", "cur": "gen", "failed": [], "log": -1, "cmd": "systemctl cat lab\\x2ddata.mount", "line": 0, "nofail": true, "reached": null}, {"t": 0, "msg": "t = 0 s: A lab\\x2ddata.mount indítása a dev-disk-by\\x2dlabel-lab\\x2ddata.device-ra vár (BindsTo + After).", "cur": "dev", "failed": [], "log": -1, "cmd": "systemctl list-dependencies local-fs.target", "line": 1, "nofail": true, "reached": null}, {"t": 90, "msg": "t = 90 s: A device job lejár (90 s), a LABEL=lab-data eszköz nem jelent meg.", "cur": "dev", "failed": ["dev"], "log": 0, "cmd": "journalctl -b -p err", "line": 2, "nofail": true, "reached": null}, {"t": 90, "msg": "t = 90 s: A mount unit függősége elbukott; a /lab-data nincs csatolva.", "cur": "mnt", "failed": ["dev", "mnt"], "log": 1, "cmd": "systemctl status lab\\x2ddata.mount", "line": 3, "nofail": true, "reached": null}, {"t": 90, "msg": "t = 90 s: nofail: a local-fs.target nem Requires-szal függ a mounttól, ezért nem bukik el (a boot nem várt rá).", "cur": "lfs", "failed": ["dev", "mnt"], "log": -1, "cmd": "systemctl list-dependencies local-fs.target", "line": 4, "nofail": true, "reached": null}, {"t": 90, "msg": "t = 90 s: multi-user.target elérve – de a /lab-data NINCS csatolva (az adat nem elérhető, 7.5.4).", "cur": "mu", "failed": ["dev", "mnt"], "log": -1, "cmd": "findmnt /lab-data; systemctl is-system-running", "line": 5, "nofail": true, "reached": "mu"}]}, NODES={"fstab": [0.1, 8.0, "/etc/fstab:\nLABEL=lab-data /lab-data\next4 defaults 0 2"], "gen": [0.1, 5.6, "systemd-fstab-generator"], "mnt": [0.1, 3.2, "lab\\x2ddata.mount"], "dev": [8.0, 3.2, "dev-disk-by\\x2dlabel-\nlab\\x2ddata.device\ninactive, timeout 90 s"], "lfs": [0.1, 0.8, "local-fs.target"], "em": [8.0, 0.8, "emergency.target"], "mu": [0.1, -1.6, "multi-user.target"]}, LOG=["Timed out waiting for device dev-disk-by\\x2dlabel-lab\\x2ddata.device.", "Dependency failed for /lab-data.", "Dependency failed for local-fs.target."];
function nf(){ setSteps(ALL[document.getElementById("nofail").checked?"1":"0"]); }
function render(s){
  svg.setAttribute("viewBox","0 0 640 410"); svg.innerHTML="";
  const X=v=>10+v*42, Y=v=>290-v*26, w=6.0*42, h=1.5*26;
  const C=(k,sd)=>{const p=NODES[k]; return {r:[X(p[0])+w,Y(p[1])-h/2],l:[X(p[0]),Y(p[1])-h/2],t:[X(p[0])+w/2,Y(p[1]+1.5)],b:[X(p[0])+w/2,Y(p[1])]}[sd];};
  const E=(p,q,dash,lab)=>{el("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:css("--line"),"stroke-width":1.5,"stroke-dasharray":dash});
    el("circle",{cx:q[0],cy:q[1],r:3.5,fill:css("--line")}); if(lab) el("text",{x:(p[0]+q[0])/2+5,y:(p[1]+q[1])/2-4,"font-size":10.5,fill:css("--muted")},lab);};
  E(C("fstab","b"),C("gen","t"),"","generál"); E(C("gen","b"),C("mnt","t"),"","");
  E(C("mnt","r"),C("dev","l"),"","BindsTo + After");
  E(C("lfs","t"),C("mnt","b"),s.nofail?"3 3":"",s.nofail?"Wants":"Requires");
  E(C("mu","t"),C("lfs","b"),"","Requires");
  if(!s.nofail) E(C("lfs","r"),C("em","l"),"2 4","OnFailure");
  for(const kk in NODES){const p=NODES[kk], on=s.cur===kk, fl=s.failed.includes(kk), rc=s.reached===kk;
    if(kk==="em" && s.nofail) continue;
    el("rect",{x:X(p[0]),y:Y(p[1]+1.5),width:w,height:h,rx:8,fill:rc?css("--cellhl"):css("--cell"),stroke:fl?css("--hl2"):(on?css("--hl"):css("--line")),"stroke-width":on||rc?3.5:1.2,"stroke-dasharray":fl?"6 3":""});
    p[2].split("\n").forEach((l,j,arr)=>el("text",{x:X(p[0])+w/2,y:Y(p[1]+1.5)+h/2+4+(j-(arr.length-1)/2)*13,"text-anchor":"middle","font-size":10,"font-family":"monospace","text-decoration":fl?"line-through":"none"},l));}
  el("text",{x:280,y:20,"font-size":12,"font-weight":"bold"},"t = "+s.t+" s");
  LOG.forEach((l,i)=>el("text",{x:280,y:40+i*16,"font-size":9.5,"font-family":"monospace",fill:i===s.log?css("--hl2"):(i<s.log?css("--fg"):css("--muted")),"font-weight":i===s.log?"bold":"normal"},l));
  el("text",{x:280,y:100,"font-size":11,"font-family":"monospace",fill:css("--hl")},"$ "+s.cmd);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
