<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet runner: állapotgép és circuit breaker</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select id="sc"><option value="ok">minden ok</option><option value="h2" selected>lab-host-02 hibás</option><option value="h1">lab-host-01 hibás</option><option value="h12">lab-host-01 + 02 hibás</option></select></label> <label>max_parallel <select id="mp"><option>1</option><option>2</option></select></label> <label>limit <input type="range" id="lim" min="0.2" max="0.9" step="0.05" value="0.5"> <span id="limv">0,50</span></label> <label><input type="checkbox" id="me"> min_ended = 2 (javaslat)</label><script>function u(){ CFG = {sc: document.getElementById("sc").value, maxp: +document.getElementById("mp").value, limit: +document.getElementById("lim").value, minEnded: document.getElementById("me").checked ? 2 : 0}; document.getElementById("limv").textContent = CFG.limit.toFixed(2).replace(".", ","); recompute(); } ["sc","mp","lim","me"].forEach(id => document.getElementById(id).addEventListener("input", u));</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Minden host preflight, check, apply lépésen megy át; a breaker a befejezett hostok hibaaránya alapján a többi hostot aborted állapotba teszi."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 23.4.3 lab-maint-wrapper.sh breaker-logikájának átirata, szemléltető időzítéssel (nem mérés). A min_ended a T-D6-084 javaslata; a könyv kódjában nincs.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"kind": "check", "t": 0, "host": 0, "ended": 0, "failed": 0, "ratio": 0.0, "opened": false, "msg": "t=0: breaker-ellenőrzés lab-host-01 indítása előtt: failed/ended = 0/0 = 0,00 ≤ 0,50 → zárva", "hs": ["pending", "pending", "pending"], "state": [], "line": -1}, {"kind": "start", "t": 0, "host": 0, "msg": "t=0: lab-host-01 indul (preflight → check → apply)", "hs": ["fut", "pending", "pending"], "state": [], "line": -1}, {"kind": "end", "t": 3, "host": 0, "msg": "t=3: lab-host-01 → ok", "hs": ["ok", "pending", "pending"], "state": [["lab-host-01", "ok"]], "line": -1}, {"kind": "check", "t": 3, "host": 1, "ended": 1, "failed": 0, "ratio": 0.0, "opened": false, "msg": "t=3: breaker-ellenőrzés lab-host-02 indítása előtt: failed/ended = 0/1 = 0,00 ≤ 0,50 → zárva", "hs": ["ok", "pending", "pending"], "state": [["lab-host-01", "ok"]], "line": -1}, {"kind": "start", "t": 3, "host": 1, "msg": "t=3: lab-host-02 indul (preflight → check → apply)", "hs": ["ok", "fut", "pending"], "state": [["lab-host-01", "ok"]], "line": -1}, {"kind": "end", "t": 4, "host": 1, "msg": "t=4: lab-host-02 → preflight_failed", "hs": ["ok", "preflight_failed", "pending"], "state": [["lab-host-01", "ok"], ["lab-host-02", "preflight_failed"]], "line": -1}, {"kind": "check", "t": 4, "host": 2, "ended": 2, "failed": 1, "ratio": 0.5, "opened": false, "msg": "t=4: breaker-ellenőrzés lab-host-03 indítása előtt: failed/ended = 1/2 = 0,50 ≤ 0,50 → zárva", "hs": ["ok", "preflight_failed", "pending"], "state": [["lab-host-01", "ok"], ["lab-host-02", "preflight_failed"]], "line": -1}, {"kind": "start", "t": 4, "host": 2, "msg": "t=4: lab-host-03 indul (preflight → check → apply)", "hs": ["ok", "preflight_failed", "fut"], "state": [["lab-host-01", "ok"], ["lab-host-02", "preflight_failed"]], "line": -1}, {"kind": "end", "t": 7, "host": 2, "msg": "t=7: lab-host-03 → ok", "hs": ["ok", "preflight_failed", "ok"], "state": [["lab-host-01", "ok"], ["lab-host-02", "preflight_failed"], ["lab-host-03", "ok"]], "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const HOSTS = ["lab-host-01","lab-host-02","lab-host-03"], SCB = {ok:[], h2:[1], h1:[0], h12:[0,1]}, CLOCK = ["12:00:01","12:00:03","12:00:05","12:00:07"];
function simulate(sc, maxp, limit, minEnded){
  const bad = SCB[sc]; let t = 0, running = []; const state = [], ev = [], hs = HOSTS.map(() => "pending");
  const snap = () => ({hs: hs.slice(), state: state.map(r => r.slice())});
  function finishUntil(tt){ running.sort((a, b) => a[0] - b[0]); while (running.length && running[0][0] <= tt) { const [end, h] = running.shift(); const res = bad.indexOf(h) >= 0 ? "preflight_failed" : "ok"; hs[h] = res; state.push([HOSTS[h], res]); ev.push(Object.assign({kind:"end", t:end, host:h, msg:`t=${end}: ${HOSTS[h]} → ${res}`}, snap())); } }
  for (let i = 0; i < HOSTS.length; i++) {
    while (running.length >= maxp) { t = Math.min(...running.map(r => r[0])); finishUntil(t); }
    const ended = state.length, failed = state.filter(r => r[1] !== "ok").length, rr = ended ? failed/ended : 0;
    const opened = ended > 0 && ended >= minEnded && rr > limit;
    ev.push(Object.assign({kind:"check", t:t, host:i, ended:ended, failed:failed, ratio:rr, opened:opened,
      msg:`t=${t}: breaker-ellenőrzés ${HOSTS[i]} indítása előtt: failed/ended = ${failed}/${ended} = ${rr.toFixed(2).replace(".", ",")} ${rr > limit ? ">" : "≤"} ${limit.toFixed(2).replace(".", ",")}` + (ended && ended < minEnded ? ` (de ended < min_ended = ${minEnded})` : "") + (opened ? " → NYIT" : " → zárva")}, snap()));
    if (opened) { for (let j = i; j < HOSTS.length; j++) { hs[j] = "aborted"; state.push([HOSTS[j], "aborted"]); } ev.push(Object.assign({kind:"abort", t:t, host:i, msg:"Circuit breaker open: a hátralévő hostok aborted (exit 3)"}, snap())); running.slice().forEach(r => finishUntil(r[0])); return ev; }
    const dur = bad.indexOf(i) >= 0 ? 1 : 3; hs[i] = "fut"; running.push([t + dur, i]);
    ev.push(Object.assign({kind:"start", t:t, host:i, msg:`t=${t}: ${HOSTS[i]} indul (preflight → check → apply)`}, snap()));
  }
  while (running.length) finishUntil(Math.min(...running.map(r => r[0])));
  return ev;
}
let CFG = {sc:"h2", maxp:1, limit:0.5, minEnded:0};
function recompute(){ setSteps(simulate(CFG.sc, CFG.maxp, CFG.limit, CFG.minEnded).map(e => Object.assign({line:-1}, e))); }

function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const col = {pending: css("--cell"), fut: css("--cellhl"), ok: css("--cell"), preflight_failed: css("--cellhl"), aborted: css("--bg")};
  HOSTS.forEach((h, i) => {
    const st = s.hs[i], x = 20 + i*205, cur = s.host === i;
    el("rect", {x:x, y:14, width:190, height:66, rx:8, fill: col[st] || css("--cell"), stroke: cur ? css("--hl") : (st === "preflight_failed" ? css("--hl2") : css("--line")), "stroke-width": cur ? 3.5 : (st === "ok" || st === "preflight_failed" ? 3 : 1.2), "stroke-dasharray": st === "aborted" ? "7 4" : ""});
    el("text", {x:x+95, y:40, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, h);
    el("text", {x:x+95, y:62, "text-anchor":"middle", "font-size":12.5, fill: st === "preflight_failed" || st === "aborted" ? css("--hl2") : css("--fg")}, st);
  });
  el("text", {x:20, y:112, "font-size":12, "font-weight":"bold"}, "maintenance-state.tsv");
  el("rect", {x:20, y:118, width:400, height:84, fill: css("--code"), stroke: css("--muted")});
  s.state.forEach((r, i) => el("text", {x:28, y:138 + i*20, "font-size":12, "font-family":"ui-monospace,monospace", style:"white-space:pre"}, r[0] + "   " + r[1].padEnd(17) + CLOCK[i]));
  const ended = s.state.filter(r => r[1] !== "aborted").length, failed = s.state.filter(r => r[1] !== "ok" && r[1] !== "aborted").length;
  el("text", {x:440, y:138, "font-size":12.5}, "ended = " + ended);
  el("text", {x:440, y:158, "font-size":12.5}, "failed = " + failed);
  el("text", {x:440, y:178, "font-size":12.5}, "ratio = " + (ended ? (failed/ended).toFixed(2).replace(".", ",") : "–"));
  el("text", {x:440, y:198, "font-size":12.5}, "limit = " + CFG.limit.toFixed(2).replace(".", ","));
  if (s.kind === "check") {
    el("polygon", {points:"320,222 420,252 320,282 220,252", fill: s.opened ? css("--cellhl") : css("--cell"), stroke: s.opened ? css("--hl2") : css("--hl"), "stroke-width":3});
    el("text", {x:320, y:248, "text-anchor":"middle", "font-size":12, "font-weight":"bold"}, "breaker");
    el("text", {x:320, y:265, "text-anchor":"middle", "font-size":12}, s.opened ? "NYIT" : "zárva");
  }
  if (s.kind === "abort") el("text", {x:320, y:258, "text-anchor":"middle", "font-size":14, "font-weight":"bold", fill: css("--hl2")}, "aborted: a hátralévő hostok nem indulnak (exit 3)");
  el("text", {x:20, y:318, "font-size":10.5, fill: css("--muted")}, "állapotok: pending → preflight → check → apply → ok | *_failed | aborted (breaker)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
