<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%util, aqu-sz és latencia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:140px}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;overflow-x:auto;margin:6px 0}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>λ: <input id="lam" type="range" min="0" max="5.5" step="0.01" value="5" aria-label="beérkezési ráta, log10"></label>
  <span id="lamv"></span>
</div>
<div class="ctl">
  <label>kiszolgálók (c): <input id="c" type="range" min="1" max="64" step="1" value="32" aria-label="kiszolgálók száma"></label> <span id="cv"></span>
  <label>szervizidő: <select id="s" aria-label="szervizidő"><option value="0.005">5 ms (HDD-szerű)</option><option value="0.0001" selected>0,1 ms (NVMe-szerű)</option></select></label>
</div>
<div class="ctl">
  <button id="pA">A: soros, λ = 190</button><button id="pB">B: párhuzamos, λ = 100 000</button><button id="p9">22.4.9 konzisztens sora (r/s 80 000)</button>
</div>
<pre id="out" aria-live="polite"></pre>
<svg id="v" viewBox="0 0 640 300" role="img" aria-label="Soros eszköznél a 100% util a latencia robbanásával esik egybe, párhuzamos eszköznél a 100% util mellett a latencia még alacsony."></svg>
<p class="small">M/M/c modell (Erlang C), számított, nem mérés. %util = P(legalább egy kérés úton) = 1 − P0; aqu-sz = λ·W (Little); minden λ-ra aqu-sz ≥ %util/100.</p>
<script>
function mmc(lam, c, s){
  const mu = 1/s, a = lam/mu, rho = a/c;
  if (rho >= 1) return null;
  let t = 1, sum = 0;
  for (let k = 0; k < c; k++) { if (k > 0) t *= a/k; sum += t; }
  const tc = t*a/c, p0 = 1/(sum + tc/(1-rho)), pc = tc/(1-rho)*p0, W = pc/(c*mu - lam) + s;
  return [1 - p0, lam*W, W];
}
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, at, tx){ const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (tx !== undefined) e.textContent = tx; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function f(x, d){ return x.toFixed(d).replace(".", ","); }
function sp(x){ return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function draw(){
  const lam = Math.pow(10, +document.getElementById("lam").value), c = +document.getElementById("c").value, s = +document.getElementById("s").value;
  document.getElementById("lamv").textContent = sp(lam) + " IOPS";
  document.getElementById("cv").textContent = c + " (kapacitás " + sp(c/s) + " IOPS)";
  const r = mmc(lam, c, s);
  const out = document.getElementById("out");
  if (!r) out.textContent = "Device   r/s = " + sp(lam) + "  → túlterhelt (λ ≥ c·μ = " + sp(c/s) + "): a sor korlát nélkül nő.";
  else out.textContent = "Device            r/s   r_await   aqu-sz   %util\nlab-disk  " + sp(lam).padStart(11) + "   " + f(r[2]*1000, 2).padStart(7) + "   " + (r[1] < 10 ? f(r[1], 3) : f(r[1], 1)).padStart(6) + "   " + f(r[0]*100, 1).padStart(5) +
      "\naqu-sz ≥ %util/100: " + (r[1] >= r[0] - 1e-12 ? "teljesül" : "NEM") + " (" + f(r[1], 3) + " ≥ " + f(r[0], 3) + ")";
  svg.innerHTML = "";
  const x0 = 60, W = 560, panels = [["%util [%]", 0, 100, false], ["aqu-sz", 1e-3, 300, true], ["W [ms]", 0.05, 3000, true]];
  const lx = v => x0 + (Math.log10(v) - 0)/5.6*W;
  panels.forEach(([lab, lo, hi, lg], p) => {
    const y0 = 10 + p*92, H = 76;
    const ly = v => lg ? y0 + H - (Math.log10(Math.max(v, lo)) - Math.log10(lo))/(Math.log10(hi) - Math.log10(lo))*H : y0 + H - (v - lo)/(hi - lo)*H;
    el("rect", {x:x0, y:y0, width:W, height:H, fill:"none", stroke: css("--grid")});
    el("text", {x:x0-6, y:y0+H/2+4, "text-anchor":"end", "font-size":11}, lab);
    let d = "", first = true;
    for (let i = 0; i <= 224; i++) { const L = Math.pow(10, i/40); const q = mmc(L, c, s); if (!q) break; const v = p === 0 ? q[0]*100 : (p === 1 ? q[1] : q[2]*1000); const yy = Math.max(y0, ly(v)); d += (first ? "M" : "L") + lx(L).toFixed(1) + "," + yy.toFixed(1); first = false; }
    el("path", {d:d, fill:"none", stroke: css("--hl"), "stroke-width":2});
    el("line", {x1:lx(lam), y1:y0, x2:lx(lam), y2:y0+H, stroke: css("--hl2"), "stroke-width":2, "stroke-dasharray":"5 3"});
    if (r) { const v = p === 0 ? r[0]*100 : (p === 1 ? r[1] : r[2]*1000); el("circle", {cx:lx(lam), cy:Math.max(y0, ly(v)), r:5, fill: css("--hl2")}); }
  });
  [1, 10, 100, 1000, 10000, 100000].forEach(v => el("text", {x:lx(v), y:294, "text-anchor":"middle", "font-size":10.5}, sp(v)));
}
["lam","c","s"].forEach(id => document.getElementById(id).addEventListener("input", draw));
function preset(lam, c, s){ document.getElementById("lam").value = Math.log10(lam); document.getElementById("c").value = c; document.getElementById("s").value = s; draw(); }
document.getElementById("pA").onclick = () => preset(190, 1, "0.005");
document.getElementById("pB").onclick = () => preset(100000, 32, "0.0001");
document.getElementById("p9").onclick = () => preset(80000, 32, "0.0001");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
