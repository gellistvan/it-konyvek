<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UEFI bootlánc lépésenként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hiba injektálása <select id="fault" onchange="inj()" aria-label="hiba injektálása"><option value="none">nincs</option><option value="uuid">rossz root UUID</option><option value="initrd">hiányzó initrd</option><option value="grubcfg">hibás grub.cfg</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt sáv: UEFI, GRUB, kernel, initramfs, systemd; nyolc átadás a shimx64.efi-től a systemd PID 1-ig; hiba injektálásakor a lánc a megfelelő sávban áll meg."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Ubuntu 24.04, GRUB 2; a UUID rövidítve (0f2b…). A root átadása az initramfs run-init-je (switch_root jellegű), a rossz UUID Ubuntun (initramfs) shellt ad, nem kernel panicot.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Bekapcsolás: a firmware (UEFI) inicializálja a hardvert, kiválasztja a boot entryt.", "k": -1, "lane": 0, "cmd": "", "err": "", "rec": "", "line": -1}, {"msg": "1. ESP: EFI/ubuntu/shimx64.efi – Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "k": 0, "lane": 0, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 0}, {"msg": "2. shim → grubx64.efi – A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "k": 1, "lane": 1, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 1}, {"msg": "3. /boot/grub/grub.cfg – A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "k": 2, "lane": 1, "cmd": "grep -n menuentry /boot/grub/grub.cfg", "err": "", "rec": "", "line": 2}, {"msg": "4. linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash – A GRUB betölti a kernelt és az initrd-t, átadja a parancssort.", "k": 3, "lane": 2, "cmd": "cat /proc/cmdline", "err": "", "rec": "", "line": 3}, {"msg": "5. kernel → initramfs /init – A kernel kicsomagolja az initramfs-t, és elindítja a /init-et (PID 1 az initramfs-ben).", "k": 4, "lane": 3, "cmd": "lsinitramfs /boot/initrd.img-6.8.0-31-generic | head", "err": "", "rec": "", "line": 4}, {"msg": "6. mount root (UUID=0f2b…) – Az initramfs betölti a modulokat, megkeresi és csatolja a root fájlrendszert.", "k": 5, "lane": 3, "cmd": "blkid; cat /proc/cmdline", "err": "", "rec": "", "line": 5}, {"msg": "7. run-init (switch_root) – Az initramfs a valódi rootra vált (run-init), és exec-eli a /sbin/init-et.", "k": 6, "lane": 4, "cmd": "systemd-analyze", "err": "", "rec": "", "line": 6}, {"msg": "8. /sbin/init = systemd (PID 1) – A systemd felhúzza a default.target-et (graphical/multi-user). Boot kész.", "k": 7, "lane": 4, "cmd": "systemctl is-system-running", "err": "", "rec": "", "line": 7}];
const CODE = ["1. ESP: EFI/ubuntu/shimx64.efi", "2. shim → grubx64.efi", "3. /boot/grub/grub.cfg", "4. linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash", "5. kernel → initramfs /init", "6. mount root (UUID=0f2b…)", "7. run-init (switch_root)", "8. /sbin/init = systemd (PID 1)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL={"none": [{"msg": "Bekapcsolás: a firmware (UEFI) inicializálja a hardvert, kiválasztja a boot entryt.", "k": -1, "lane": 0, "cmd": "", "err": "", "rec": "", "line": -1}, {"msg": "1. ESP: EFI/ubuntu/shimx64.efi – Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "k": 0, "lane": 0, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 0}, {"msg": "2. shim → grubx64.efi – A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "k": 1, "lane": 1, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 1}, {"msg": "3. /boot/grub/grub.cfg – A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "k": 2, "lane": 1, "cmd": "grep -n menuentry /boot/grub/grub.cfg", "err": "", "rec": "", "line": 2}, {"msg": "4. linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash – A GRUB betölti a kernelt és az initrd-t, átadja a parancssort.", "k": 3, "lane": 2, "cmd": "cat /proc/cmdline", "err": "", "rec": "", "line": 3}, {"msg": "5. kernel → initramfs /init – A kernel kicsomagolja az initramfs-t, és elindítja a /init-et (PID 1 az initramfs-ben).", "k": 4, "lane": 3, "cmd": "lsinitramfs /boot/initrd.img-6.8.0-31-generic | head", "err": "", "rec": "", "line": 4}, {"msg": "6. mount root (UUID=0f2b…) – Az initramfs betölti a modulokat, megkeresi és csatolja a root fájlrendszert.", "k": 5, "lane": 3, "cmd": "blkid; cat /proc/cmdline", "err": "", "rec": "", "line": 5}, {"msg": "7. run-init (switch_root) – Az initramfs a valódi rootra vált (run-init), és exec-eli a /sbin/init-et.", "k": 6, "lane": 4, "cmd": "systemd-analyze", "err": "", "rec": "", "line": 6}, {"msg": "8. /sbin/init = systemd (PID 1) – A systemd felhúzza a default.target-et (graphical/multi-user). Boot kész.", "k": 7, "lane": 4, "cmd": "systemctl is-system-running", "err": "", "rec": "", "line": 7}], "uuid": [{"msg": "Bekapcsolás: a firmware (UEFI) inicializálja a hardvert, kiválasztja a boot entryt.", "k": -1, "lane": 0, "cmd": "", "err": "", "rec": "", "line": -1}, {"msg": "1. ESP: EFI/ubuntu/shimx64.efi – Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "k": 0, "lane": 0, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 0}, {"msg": "2. shim → grubx64.efi – A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "k": 1, "lane": 1, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 1}, {"msg": "3. /boot/grub/grub.cfg – A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "k": 2, "lane": 1, "cmd": "grep -n menuentry /boot/grub/grub.cfg", "err": "", "rec": "", "line": 2}, {"msg": "4. linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash – A GRUB betölti a kernelt és az initrd-t, átadja a parancssort.", "k": 3, "lane": 2, "cmd": "cat /proc/cmdline", "err": "", "rec": "", "line": 3}, {"msg": "5. kernel → initramfs /init – A kernel kicsomagolja az initramfs-t, és elindítja a /init-et (PID 1 az initramfs-ben).", "k": 4, "lane": 3, "cmd": "lsinitramfs /boot/initrd.img-6.8.0-31-generic | head", "err": "", "rec": "", "line": 4}, {"msg": "✕ A boot itt megáll (initramfs): ALERT! UUID=0f2b… does not exist. Dropping to a shell! → (initramfs)", "k": 5, "lane": 3, "cmd": "blkid; cat /proc/cmdline", "err": "ALERT! UUID=0f2b… does not exist. Dropping to a shell! → (initramfs)", "rec": "Recovery: (initramfs) shell: blkid, majd a GRUB-ban `e` → helyes root=UUID=…", "line": 5}], "initrd": [{"msg": "Bekapcsolás: a firmware (UEFI) inicializálja a hardvert, kiválasztja a boot entryt.", "k": -1, "lane": 0, "cmd": "", "err": "", "rec": "", "line": -1}, {"msg": "1. ESP: EFI/ubuntu/shimx64.efi – Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "k": 0, "lane": 0, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 0}, {"msg": "2. shim → grubx64.efi – A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "k": 1, "lane": 1, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 1}, {"msg": "3. /boot/grub/grub.cfg – A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "k": 2, "lane": 1, "cmd": "grep -n menuentry /boot/grub/grub.cfg", "err": "", "rec": "", "line": 2}, {"msg": "4. linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash – A GRUB betölti a kernelt és az initrd-t, átadja a parancssort.", "k": 3, "lane": 2, "cmd": "cat /proc/cmdline", "err": "", "rec": "", "line": 3}, {"msg": "✕ A boot itt megáll (Kernel): Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)", "k": 4, "lane": 2, "cmd": "lsinitramfs /boot/initrd.img-6.8.0-31-generic | head", "err": "Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)", "rec": "Recovery: GRUB-menü → régi kernel; update-initramfs -c -k 6.8.0-31-generic", "line": 4}], "grubcfg": [{"msg": "Bekapcsolás: a firmware (UEFI) inicializálja a hardvert, kiválasztja a boot entryt.", "k": -1, "lane": 0, "cmd": "", "err": "", "rec": "", "line": -1}, {"msg": "1. ESP: EFI/ubuntu/shimx64.efi – Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "k": 0, "lane": 0, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 0}, {"msg": "2. shim → grubx64.efi – A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "k": 1, "lane": 1, "cmd": "efibootmgr -v", "err": "", "rec": "", "line": 1}, {"msg": "3. /boot/grub/grub.cfg – A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "k": 2, "lane": 1, "cmd": "grep -n menuentry /boot/grub/grub.cfg", "err": "", "rec": "", "line": 2}, {"msg": "✕ A boot itt megáll (Bootloader / GRUB): error: file '/vmlinuz-6.8.0-31-generic' not found → grub>", "k": 3, "lane": 1, "cmd": "cat /proc/cmdline", "err": "error: file '/vmlinuz-6.8.0-31-generic' not found → grub>", "rec": "Recovery: grub> ls; linux/initrd kézzel, majd update-grub", "line": 3}]}, LANES=["Firmware / UEFI", "Bootloader / GRUB", "Kernel", "initramfs", "systemd"], XS=[0.5, 1.6, 2.6, 3.7, 4.7, 5.7, 6.8, 7.9], REC=["UEFI setup,\nefibootmgr", "grub> + e", "kernel\ncmdline", "(initramfs)\nshell", "emergency/\nrescue"], HAND=[[0, "ESP: EFI/ubuntu/shimx64.efi", "Az UEFI boot entry a shim-et indítja az ESP-ről (Secure Boot-aláírt).", "efibootmgr -v"], [1, "shim → grubx64.efi", "A shim ellenőrzi és elindítja a GRUB-ot (grubx64.efi).", "efibootmgr -v"], [1, "/boot/grub/grub.cfg", "A GRUB beolvassa a grub.cfg-t, megjeleníti a menüt.", "grep -n menuentry /boot/grub/grub.cfg"], [2, "linux /vmlinuz-6.8.0-31-generic root=UUID=0f2b… ro quiet splash\ninitrd /initrd.img-6.8.0-31-generic", "A GRUB betölti a kernelt és az initrd-t, átadja a parancssort.", "cat /proc/cmdline"], [3, "kernel → initramfs /init", "A kernel kicsomagolja az initramfs-t, és elindítja a /init-et (PID 1 az initramfs-ben).", "lsinitramfs /boot/initrd.img-6.8.0-31-generic | head"], [3, "mount root (UUID=0f2b…)", "Az initramfs betölti a modulokat, megkeresi és csatolja a root fájlrendszert.", "blkid; cat /proc/cmdline"], [4, "run-init (switch_root)", "Az initramfs a valódi rootra vált (run-init), és exec-eli a /sbin/init-et.", "systemd-analyze"], [4, "/sbin/init = systemd (PID 1)", "A systemd felhúzza a default.target-et (graphical/multi-user).", "systemctl is-system-running"]];
function inj(){ setSteps(ALL[document.getElementById("fault").value]); }
function render(s){
  svg.setAttribute("viewBox","0 0 640 330"); svg.innerHTML="";
  const X=v=>150+v*58, Y=r=>30+r*44;
  LANES.forEach((n,r)=>{const on=s.lane===r;
    el("rect",{x:120,y:Y(r)-18,width:510,height:36,fill:on?css("--cellhl"):css("--cell"),stroke:css("--line"),"stroke-width":on?2.5:0.8});
    el("text",{x:114,y:Y(r)+5,"text-anchor":"end","font-size":12,"font-weight":on?"bold":"normal"},n);});
  let prev=null;
  for(let i=0;i<=Math.max(s.k,-1)&&i<HAND.length;i++){const x=X(XS[i]), y=Y(HAND[i][0]), cur=i===s.k;
    if(prev) el("line",{x1:prev[0],y1:prev[1],x2:x,y2:y,stroke:css("--line"),"stroke-width":1.5});
    const bad=cur&&s.err;
    el("circle",{cx:x,cy:y,r:cur?11:8,fill:bad?css("--hl2"):(cur?css("--hl"):css("--fg"))});
    el("text",{x:x,y:y+4,"text-anchor":"middle","font-size":10,fill:css("--bg"),"font-weight":"bold"},bad?"✕":String(i+1));
    prev=[x,y];}
  el("text",{x:10,y:258,"font-size":12,"font-weight":"bold"},"Megfigyelés:"); el("text",{x:100,y:258,"font-size":12,"font-family":"monospace"},s.cmd||"–");
  if(s.err){el("text",{x:10,y:282,"font-size":12,"font-weight":"bold",fill:css("--hl2")},"Üzenet: "+s.err);
            el("text",{x:10,y:304,"font-size":12},s.rec);}
  else if(s.lane>=0) el("text",{x:10,y:282,"font-size":12,fill:css("--muted")},"Recovery ebben a szakaszban: "+REC[s.lane].replace("\n"," "));
  if(s.k>=0 && !s.err){const t=HAND[s.k][1].split("\n"); t.forEach((l,j)=>el("text",{x:10,y:236-(t.length-1-j)*15,"font-size":11.5,"font-family":"monospace"},l));}
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
