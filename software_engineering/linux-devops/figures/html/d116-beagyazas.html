<!doctype html>
<html lang="hu">
<head>

<title>Egy HTTP-kérés beágyazása és útja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}

*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

</div>

<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A HTTP-adatot TCP-, IPv4- és Ethernet-fejléc veszi körül, 1058 bájtos keret; a keret a lab-c és lab-p veth-páron halad."></svg>

</div>
<p class="small">A 24.1.6 labor várt lépései; a MAC-címek és a forrásport illusztratívak, a tcpdump-sorok várt formátumúak, nem futtatott capture. Az 1058 B és a 8,624 µs számított modell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"id": "getent", "st": "hosts", "msg": "1) getent ahostsv4 lab-web.test → 10.116.0.2 (kliensoldali hosts-bejegyzés; nincs DNS-csomag)", "tcp": "(nincs csomag: a névfeloldás a hosts-fájlból jön)", "line": -1}, {"id": "route", "st": "route", "msg": "2) ip -n lab-client route get 10.116.0.2 → 10.116.0.2 dev lab-c src 10.116.0.1 (közvetlen link)", "tcp": "(nincs csomag: útvonal-döntés a kliens névterében)", "line": -1}, {"id": "arp", "st": "neigh", "msg": "3) ARP: who-has 10.116.0.2 tell 10.116.0.1 → 10.116.0.2 is-at lab-p MAC; a szomszédbejegyzés REACHABLE", "tcp": "02:00:00:00:01:01 > ff:ff:ff:ff:ff:ff, ethertype ARP (0x0806), length 42: Request who-has 10.116.0.2 tell 10.116.0.1", "line": -1}, {"id": "syn", "st": "socket", "msg": "4) SYN: 10.116.0.1:45678 → 10.116.0.2:8080", "tcp": "02:00:00:00:01:01 > 02:00:00:00:01:02, ethertype IPv4 (0x0800), length 74: 10.116.0.1.45678 > 10.116.0.2.8080: Flags [S], seq 1000", "line": -1}, {"id": "synack", "st": "socket", "msg": "5) SYN-ACK: a lab-peer figyelő socketje (10.116.0.2:8080, LISTEN) válaszol", "tcp": "02:00:00:00:01:02 > 02:00:00:00:01:01, ethertype IPv4 (0x0800), length 74: 10.116.0.2.8080 > 10.116.0.1.45678: Flags [S.], seq 5000, ack 1001", "line": -1}, {"id": "ack", "st": "socket", "msg": "6) ACK: a kapcsolat ESTABLISHED", "tcp": "02:00:00:00:01:01 > 02:00:00:00:01:02, ethertype IPv4 (0x0800), length 66: 10.116.0.1.45678 > 10.116.0.2.8080: Flags [.], ack 5001", "line": -1}, {"id": "http", "st": "app", "msg": "7) HTTP: GET /lab-index.txt (Host: lab-web.test:8080) → HTTP/1.0 200 OK, törzs: lab-ok", "tcp": "02:00:00:00:01:01 > 02:00:00:00:01:02, ethertype IPv4 (0x0800), length …: 10.116.0.1.45678 > 10.116.0.2.8080: Flags [P.], … HTTP: GET /lab-index.txt HTTP/1.1", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let NEIGH = false, DOWN = false;
function render(s){
  svg.setAttribute("viewBox", "0 0 640 330");
  svg.innerHTML = "";
  const st = s.st;
  function node(x, title, ifc, lines){
    el("rect", {x:x, y:20, width:230, height:150, rx:10, fill: css("--cell"), stroke: css("--line"), "stroke-width":1.5});
    el("text", {x:x+115, y:42, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, title);
    el("text", {x:x+115, y:60, "text-anchor":"middle", "font-size":11.5}, ifc);
    lines.forEach(([key, t], i) => {
      const on = st === key;
      el("rect", {x:x+10, y:72+i*24, width:210, height:20, rx:4, fill: on ? css("--cellhl") : css("--bg"), stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 2.5 : 0.8});
      el("text", {x:x+16, y:86+i*24, "font-size":11, "font-family":"ui-monospace,monospace"}, t);
    });
  }
  node(10, "lab-client", "lab-c 10.116.0.1/30", [["hosts", "hosts: lab-web.test → .2"], ["route", "route: 10.116.0.0/30 dev lab-c"], ["neigh", NEIGH || s.id !== "arp" && ["syn","synack","ack","http","rst"].indexOf(s.id) >= 0 ? "neigh: 10.116.0.2 REACHABLE" : "neigh: (üres)"]]);
  node(400, "lab-peer", "lab-p 10.116.0.2/30", [["socket", DOWN ? "ss: nincs LISTEN :8080" : "ss: LISTEN 10.116.0.2:8080"], ["app", "http.server → lab-index.txt"], ["x", "neigh: 10.116.0.1"]]);
  el("line", {x1:240, y1:120, x2:400, y2:120, stroke: css("--line"), "stroke-width":3});
  el("text", {x:320, y:110, "text-anchor":"middle", "font-size":11.5}, "veth");
  const dir = {arp:1, syn:1, synack:-1, ack:1, http:1, rst:-1}[s.id];
  if (dir) {
    const x0 = dir > 0 ? 250 : 390, x1 = dir > 0 ? 390 : 250, col = s.id === "rst" ? css("--hl2") : css("--hl");
    el("line", {x1:x0, y1:140, x2:x1, y2:140, stroke: col, "stroke-width":3});
    el("polygon", {points:`${x1},140 ${x1-10*dir},134 ${x1-10*dir},146`, fill: col});
    el("text", {x:320, y:160, "text-anchor":"middle", "font-size":12, "font-weight":"bold", fill: col}, {arp:"ARP who-has", syn:"SYN", synack:"SYN-ACK", ack:"ACK", http:"GET → 200 OK", rst:"RST"}[s.id]);
  }
  // beágyazási sáv
  const segs = [["Eth 14", 14], ["IPv4 20", 20], ["TCP 20", 20], ["HTTP-adat 1000", 1000], ["FCS 4", 4]];
  let x = 20; const WD = [62, 62, 62, 354, 54];
  const show = ["syn","synack","ack","http","rst"].indexOf(s.id) >= 0 || s.id === "arp";
  segs.forEach(([t, b], i) => {
    const w = WD[i], isArp = s.id === "arp";
    const on = show && !(isArp && i >= 1 && i <= 3) && !(s.id !== "http" && i === 3);
    el("rect", {x:x, y:200, width:w, height:30, fill: on ? (i === 3 ? css("--bg") : css("--cellhl")) : css("--bg"), stroke: on ? css("--line") : css("--muted"), "stroke-dasharray": on ? "" : "3 3"});
    el("text", {x:x+w/2, y:220, "text-anchor":"middle", "font-size":10.5, opacity: on ? 1 : 0.45}, t);
    x += w + 2;
  });
  el("text", {x:20, y:250, "font-size":11, fill: css("--muted")}, "számított példa: 1000 + 20 + 20 + 14 + 4 = 1058 B keret (nem méretarányos sáv)");
  el("text", {x:20, y:266, "font-size":11, fill: css("--muted")}, "+ 8 B előtag + 12 B szünet → 8,624 µs 1 Gbit/s-on (számított modell)");
  el("text", {x:10, y:290, "font-size":11, "font-weight":"bold"}, "tcpdump -nn -e -i lab-c (illusztratív):");
  const cut = s.tcp.length > 92 ? s.tcp.lastIndexOf(" ", 92) : -1;
  el("text", {x:10, y:308, "font-size":10, "font-family":"ui-monospace,monospace"}, cut > 0 ? s.tcp.slice(0, cut) : s.tcp);
  if (cut > 0) el("text", {x:22, y:324, "font-size":10, "font-family":"ui-monospace,monospace"}, s.tcp.slice(cut + 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
