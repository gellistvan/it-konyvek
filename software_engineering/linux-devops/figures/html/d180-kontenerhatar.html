<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konténerhatár és bizonyítékai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<span class="small">Kattintson egy rétegre (vagy Tab + Enter).</span>
<label><input type="checkbox" id="badpid"> rossz PID (nem konténerfolyamat)</label>
<label><input type="checkbox" id="nou"> hiányzó -u az nsenternél</label>
<label><input type="checkbox" id="oom"> OOM</label>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Egymásba ágyazott rétegek a hoszt-PID 17542 körül: PID-, UTS-, mount- és user-névtér, cgroup v2, biztonság; rétegenként a bizonyító parancs és a várt kimenet."></svg>
<div id="extra"></div>
<p class="small">Szemléltető értékek a fejezet példájából (rootless Podman, lab-vm1). A hibaszimuláció kapcsolói a tipikus téves bizonyítékot mutatják.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}


const LY = [["PID-névtér", "grep NSpid /proc/17542/status", "NSpid: 17542 1  (külső → legbelső)"], ["UTS-névtér", "sudo nsenter -t 17542 -u hostname", "lab-sh"], ["mount-névtér", "grep -E 'overlay|/srv/data' /proc/17542/mountinfo", "/ overlay … upperdir=…/diff; /srv/data ← labvol"], ["user-névtér", "cat /proc/17542/uid_map", "0 1000 1 | 1 100000 65536"], ["cgroup v2", "cat /proc/17542/cgroup; cat …/libpod-….scope/{memory,cpu,pids}.max", "…/user@1000.service/…/libpod-….scope; memory.max 67108864; cpu.max 100000 100000; pids.max 128"], ["biztonság", "grep -E 'Seccomp|CapEff' /proc/17542/status; cat /proc/17542/attr/current", "Seccomp: 2; CapEff: a runtime alapkészlete; AppArmor: containers-default-… (enforce)"]], FA = {"badpid": {"0": ["grep NSpid /proc/1234/status", "NSpid: 1234  (egyetlen érték: nem konténerfolyamat)"], "4": ["cat /proc/1234/cgroup", "0::/system.slice/… (nem libpod-….scope)"], "3": ["cat /proc/1234/uid_map", "0 0 4294967295  (a hoszt user-névtere)"]}, "nou": {"1": ["sudo nsenter -t 17542 -m -p -- hostname", "lab-vm1  (a hoszt hostneve: hiányzik a -u)"]}, "oom": {"4": ["cat …/libpod-….scope/memory.events", "oom 1, oom_kill 1  (a konténer folyamata OOM-ölve)"]}}, PID = 17542;
let SEL = 4;
const g = id => document.getElementById(id);
["badpid","nou","oom"].forEach(id => g(id).addEventListener("change", () => draw()));
function ev(i){ let c = LY[i][1], o = LY[i][2], bad = false;
  ["badpid","nou","oom"].forEach(f => { if (g(f).checked && FA[f][i]) { c = FA[f][i][0]; o = FA[f][i][1]; bad = true; } });
  return [c, o, bad]; }
function draw(){
  svg.setAttribute("viewBox", "0 0 640 330"); svg.innerHTML = ""; D();
  const n = LY.length, dash = ["", "8 4", "2 3", "8 3 2 3", "12 3", "1 2"];
  for (let i = n - 1; i >= 0; i--) { const kk = n - 1 - i, x = 10 + kk*22, y = 10 + kk*20, w = 360 - kk*44, h = 310 - kk*40;
    const on = i === SEL, bad = ev(i)[2];
    const r = R(x, y, w, h, {rx: 10, fill: on ? css("--cellhl") : css("--cell"), sw: on ? 3 : 1.4, stroke: bad ? css("--hl2") : (on ? css("--hl") : css("--line")), dash: dash[i]});
    r.style.cursor = "pointer"; r.setAttribute("tabindex", "0"); r.setAttribute("role", "button"); r.setAttribute("aria-label", LY[i][0]);
    const f = () => { SEL = i; draw(); }; r.addEventListener("click", f); r.addEventListener("keydown", e => { if (e.key === "Enter") f(); });
    const t = T(x + 10, y + 15, `${i + 1} ${LY[i][0]}` + (bad ? " ⚠" : ""), {a: "start", fs: 11, bold: on, fill: bad ? css("--hl2") : undefined}); t.style.pointerEvents = "none"; }
  R(120, 140, 140, 52, {fill: css("--bg"), sw: 2}); T(190, 162, g("badpid").checked ? "PID 1234 (?)" : `hoszt-PID ${PID}`, {fs: 12, bold: 1}); T(190, 180, "konténerben PID 1", {fs: 10.5, fill: css("--muted")});
  const e = ev(SEL);
  R(385, 30, 245, 270, {fill: css("--code"), rx: 4});
  T(395, 52, `${SEL + 1} ${LY[SEL][0]}`, {a: "start", fs: 12, bold: 1});
  const wrap = (s, w) => s.match(new RegExp(`.{1,${w}}(\\s|$)|.{1,${w}}`, "g")).map(x => x.trim());
  let y = 76; T(395, y, "parancs:", {a: "start", fs: 10.5, fill: css("--muted")}); y += 16;
  wrap(e[0], 34).forEach(l => { T(395, y, l, {a: "start", fs: 10, mono: 1}); y += 15; });
  y += 8; T(395, y, "várt kimenet:", {a: "start", fs: 10.5, fill: css("--muted")}); y += 16;
  wrap(e[1], 34).forEach(l => { T(395, y, l, {a: "start", fs: 10, mono: 1, fill: e[2] ? css("--hl2") : undefined}); y += 15; });
  status.textContent = `${LY[SEL][0]}: ${e[0]} → ${e[1]}`;
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
