<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host trust és user trust egy SSH-belépésben</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>sshd: <select id="mode" aria-label="Hardening állapota"><option value="utan">hardening után</option><option value="elott">hardening előtt</option></select></label> <label>3. lépés, known_hosts: <select id="br" aria-label="known_hosts egyeztetés eredménye"><option value="ok">OK</option><option value="uj">új host</option><option value="changed">CHANGED</option></select></label><script>document.getElementById("mode").addEventListener("change", e => { MODE = e.target.value; show(k); });document.getElementById("br").addEventListener("change", e => { BR = e.target.value; show(k); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hét lépéses szekvencia: a kliens a known_hosts-szal ellenőrzi a szerver host keyét, a szerver az authorized_keys-szel a felhasználó kulcsát."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 21.2 kidolgozott példájából (labws → lab-ssh1, labops); nem mérés. A CHANGED ág diagnosztikája a 21.2.3 szerint.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 1, "d": "c2s", "kind": "net", "short": "TCP SYN → 22/tcp", "msg": "1) TCP-kapcsolat a lab-ssh1 22-es portjára.", "line": -1}, {"n": 2, "d": "s2c", "kind": "host", "short": "kulcscsere + host key: ssh-ed25519", "msg": "2) Kulcscsere; a szerver bemutatja a host keyét (ssh-ed25519) – host trust: szerver → kliens.", "line": -1}, {"n": 3, "d": "c", "kind": "host", "short": "~/.ssh/known_hosts egyeztetés", "msg": "3) A kliens a ~/.ssh/known_hosts fájlban keresi a lab-ssh1 bejegyzést (host trust).", "line": -1}, {"n": 4, "d": "s2c", "kind": "user", "short": "Authentications that can continue: …", "msg": "4) A szerver felsorolja az engedélyezett módszereket.", "line": -1}, {"n": 5, "d": "c2s", "kind": "user", "short": "aláírás ~/.ssh/id_ed25519-tel", "msg": "5) A kliens a privát kulccsal (~/.ssh/id_ed25519) aláírja a munkamenet-azonosítót – user trust: kliens → szerver.", "line": -1}, {"n": 6, "d": "s", "kind": "user", "short": "~labops/.ssh/authorized_keys ellenőrzés", "msg": "6) A szerver a ~labops/.ssh/authorized_keys fájlban keresi a publikus kulcsot (könyvtár 700, fájl 600, StrictModes yes), majd ellenőrzi: AllowUsers labops, AllowGroups lab-admins.", "line": -1}, {"n": 7, "d": "c2s", "kind": "net", "short": "session (shell: id; hostname)", "msg": "7) Sikeres hitelesítés: interaktív session / parancs.", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let MODE = "utan", BR = "ok";
const METHODS = {"elott": "publickey,password", "utan": "publickey"}, BRANCH = {"ok": "OK: a bejegyzés egyezik → a kapcsolat folytatódik.", "uj": "új host: nincs bejegyzés → a kliens ujjlenyomatot mutat, és megerősítést kér (StrictHostKeyChecking=ask); elfogadás után a kulcs a known_hosts-ba kerül.", "changed": "CHANGED: @@@ WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED! @@@ – a kapcsolat megszakad. Diagnosztika: szerveren `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`, kliensen `ssh-keygen -F lab-ssh1`; csak igazolt jogos csere után `ssh-keygen -R lab-ssh1`."};
function render(s){
  svg.setAttribute("viewBox", "0 0 600 470");
  svg.innerHTML = "";
  let msg = s.msg;
  if (s.n === 4) msg = "4) A szerver: Authentications that can continue: " + METHODS[MODE] + (MODE === "utan" ? "  (hardening után: csak kulcs)" : "  (hardening előtt: jelszó is)");
  if (s.n === 3) msg += "  → " + BRANCH[BR];
  const stopped = BR === "changed" && s.n > 3;
  if (stopped) msg = "A 3. lépésben CHANGED: a kapcsolat nem jut tovább. " + BRANCH.changed;
  status.textContent = msg;
  const XC = 150, XS = 450;
  [[XC, "labws.lab.internal", "devuser (UID 1000)"], [XS, "lab-ssh1.lab.internal", "sshd → labops (UID 1001)"]].forEach(([x, h, u]) => {
    el("rect", {x:x-110, y:6, width:220, height:42, fill: css("--cellhl"), stroke: css("--line")});
    el("text", {x:x, y:24, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, h);
    el("text", {x:x, y:41, "text-anchor":"middle", "font-size":11.5}, u);
    el("line", {x1:x, y1:48, x2:x, y2:360, stroke: css("--muted"), "stroke-dasharray":"2 4"});
  });
  STEPS.forEach((m, i) => {
    const y = 70 + i * 40, cur = m.n === s.n, done = m.n < s.n, dead = BR === "changed" && m.n > 3;
    const col = cur ? css("--hl") : (dead ? css("--muted") : css("--line"));
    const op = (done || cur) && !dead ? 1 : 0.35;
    const dash = m.kind === "user" ? "8 5" : "";
    let lab = m.n + ") " + (m.n === 4 ? "Authentications that can continue: " + METHODS[MODE] : m.short);
    if (m.d === "c2s" || m.d === "s2c") {
      const x0 = m.d === "c2s" ? XC : XS, x1 = m.d === "c2s" ? XS : XC;
      el("line", {x1:x0, y1:y, x2:x1 + (x1 > x0 ? -8 : 8), y2:y, stroke: col, "stroke-width": cur ? 3 : 1.6, "stroke-dasharray": dash, opacity: op});
      const dir = x1 > x0 ? 1 : -1;
      el("polygon", {points:`${x1},${y} ${x1-10*dir},${y-5} ${x1-10*dir},${y+5}`, fill: col, opacity: op});
      el("text", {x:300, y:y-6, "text-anchor":"middle", "font-size":11.5, opacity: op, "font-weight": cur ? "bold" : "normal"}, lab);
    } else {
      const x = m.d === "c" ? XC : XS, sg = m.d === "c" ? 1 : -1;
      el("path", {d:`M${x},${y-8} q${30*sg},0 ${30*sg},12 q0,12 ${-30*sg},12`, fill:"none", stroke: col, "stroke-width": cur ? 3 : 1.6, "stroke-dasharray": dash, opacity: op});
      el("text", {x: x + 36*sg, y:y+8, "text-anchor": sg > 0 ? "start" : "end", "font-size":11.5, opacity: op, "font-weight": cur ? "bold" : "normal"}, lab);
      if (m.n === 3 && (done || cur)) {
        const t = BR === "ok" ? "OK" : (BR === "uj" ? "új host: megerősítés kérése" : "CHANGED → megszakítás!");
        el("text", {x: XC + 36, y: y + 24, "font-size":11.5, fill: BR === "changed" ? css("--hl2") : css("--hl")}, t);
      }
    }
  });
  function filebox(x, y, w, lines, on){
    el("rect", {x:x, y:y, width:w, height:16*lines.length+10, fill: css("--code"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 3 : 1.2});
    lines.forEach((l, i) => el("text", {x:x+6, y:y+18+16*i, "font-size":11, "font-family":"ui-monospace,monospace"}, l));
  }
  filebox(20, 370, 250, ["~/.ssh/known_hosts  (host keyek)", "~/.ssh/id_ed25519   (user key)"], s.n === 3 || s.n === 5);
  filebox(310, 370, 280, ["/etc/ssh/ssh_host_ed25519_key", "~labops/.ssh/authorized_keys 700/600", "AllowUsers labops", "AllowGroups lab-admins"], s.n === 2 || s.n === 6);
  el("text", {x:20, y:462, "font-size":11, fill: css("--muted")}, "folytonos: host trust (szerver → kliens) · szaggatott: user trust (kliens → szerver)");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2000);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
