<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szűrési döntések node-onként</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>a <input id="ala" type="number" value="7500" step="100" style="width:6em" onchange="d197run()"></label><label>b <input id="alb" type="number" value="3000" step="100" style="width:6em" onchange="d197run()"></label><label>c <input id="alc" type="number" value="3000" step="100" style="width:6em" onchange="d197run()"></label><label>Pod request (m) <input id="rq" type="number" value="2000" step="100" style="width:6em" onchange="d197run()"></label><label>replicas <input id="rp" type="range" min="1" max="8" value="3" oninput="d197run()"> <span id="rpv">3</span></label><label><input type="checkbox" id="tol" onchange="d197tol()"> toleration a reserved taintre</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három node, replikánkénti elhelyezés; Pending esetén a scheduler által generált FailedScheduling üzenet."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Hipotetikus értékek (a T-D10-116 javítása: b, c = 3000 m). Egyszerűsített pontozás: a szűrőn átjutó, legtöbb szabad CPU-jú node; a toleration bekapcsolása csak a Pending replikákat ütemezi újra.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"upto": [], "cur": null, "tol": false, "req": 2000, "msg": "Lépés ▶: replikánként futtatja a szűrést."}, {"upto": [{"rep": 1, "node": "lab-node-b", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": true, "free": 3000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "1. replika → lab-node-b"}], "cur": {"rep": 1, "node": "lab-node-b", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": true, "free": 3000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "1. replika → lab-node-b"}, "tol": false, "req": 2000, "msg": "1. replika → lab-node-b"}, {"upto": [{"rep": 1, "node": "lab-node-b", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": true, "free": 3000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "1. replika → lab-node-b"}, {"rep": 2, "node": "lab-node-c", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": false, "free": 1000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "2. replika → lab-node-c"}], "cur": {"rep": 2, "node": "lab-node-c", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": false, "free": 1000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "2. replika → lab-node-c"}, "tol": false, "req": 2000, "msg": "2. replika → lab-node-c"}, {"upto": [{"rep": 1, "node": "lab-node-b", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": true, "free": 3000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "1. replika → lab-node-b"}, {"rep": 2, "node": "lab-node-c", "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": false, "free": 1000}, "lab-node-c": {"taint": true, "cpu": true, "free": 3000}}, "msg": "2. replika → lab-node-c"}, {"rep": 3, "node": null, "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": false, "free": 1000}, "lab-node-c": {"taint": true, "cpu": false, "free": 1000}}, "msg": "3. replika: Pending – 0/3 nodes are available: 1 node(s) had untolerated taint {node-role.lab.example.com/reserved: NoSchedule}, 2 Insufficient cpu."}], "cur": {"rep": 3, "node": null, "cells": {"lab-node-a": {"taint": false, "cpu": true, "free": 7500}, "lab-node-b": {"taint": true, "cpu": false, "free": 1000}, "lab-node-c": {"taint": true, "cpu": false, "free": 1000}}, "msg": "3. replika: Pending – 0/3 nodes are available: 1 node(s) had untolerated taint {node-role.lab.example.com/reserved: NoSchedule}, 2 Insufficient cpu."}, "tol": false, "req": 2000, "msg": "3. replika: Pending – 0/3 nodes are available: 1 node(s) had untolerated taint {node-role.lab.example.com/reserved: NoSchedule}, 2 Insufficient cpu."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const TAINT = "{node-role.lab.example.com/reserved: NoSchedule}";
function schedule(nodes, req, repl, tol, placed){
  const used = {}; nodes.forEach(n => used[n.name] = 0); const res = [];
  (placed || []).forEach(p => { if (p !== null) used[p] += req; });
  for (let r = 0; r < repl; r++) {
    if (placed && r < placed.length && placed[r] !== null) { res.push({rep: r + 1, node: placed[r], cells: null, msg: `${r + 1}. replika: már fut a ${placed[r]} node-on`}); continue; }
    const cells = {}, feas = []; let nt = 0, ncpu = 0;
    nodes.forEach(n => { const free = n.alloc - used[n.name], t_ok = (!n.taint) || tol, c_ok = free >= req;
      cells[n.name] = {taint: t_ok, cpu: c_ok, free: free}; if (!t_ok) nt++; else if (!c_ok) ncpu++; else feas.push([free, n.name]); });
    if (feas.length) { const best = Math.max(...feas.map(f => f[0])), node = feas.filter(f => f[0] === best)[0][1]; used[node] += req;
      res.push({rep: r + 1, node: node, cells: cells, msg: `${r + 1}. replika → ${node}`}); }
    else { const parts = []; if (nt) parts.push(`${nt} node(s) had untolerated taint ${TAINT}`); if (ncpu) parts.push(`${ncpu} Insufficient cpu`);
      const m = `0/${nodes.length} nodes are available: ` + parts.join(", ") + ".";
      res.push({rep: r + 1, node: null, cells: cells, msg: `${r + 1}. replika: Pending – ${m}`}); }
  }
  return res;
}

let NODES = [{"name": "lab-node-a", "alloc": 7500, "taint": true}, {"name": "lab-node-b", "alloc": 3000, "taint": false}, {"name": "lab-node-c", "alloc": 3000, "taint": false}], PLACED = null;
function render(s){
  svg.setAttribute("viewBox", "0 0 640 280");
  svg.innerHTML = "";
  NODES.forEach((n, j) => { const x = 20 + j * 205;
    el("rect", {x: x, y: 20, width: 190, height: 200, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, "stroke-dasharray": n.taint && !s.tol ? "6 3" : ""});
    el("text", {x: x + 8, y: 40, "font-size": 13, "font-weight": "bold", style: "font-family:ui-monospace,monospace"}, n.name);
    el("text", {x: x + 8, y: 58, "font-size": 11.5}, `allocatable ${n.alloc} m` + (n.taint ? " · taint" + (s.tol ? " (tolerált)" : "") : ""));
    const pods = s.upto.filter(p => p.node === n.name);
    pods.forEach((p, i) => { el("rect", {x: x + 10, y: 70 + i * 34, width: 170, height: 28, rx: 4, fill: css("--cellhl"), stroke: css("--line")});
      el("text", {x: x + 18, y: 89 + i * 34, "font-size": 12}, `${p.rep}. replika (${s.req} m)`); });
    if (s.cur && s.cur.cells) { const c = s.cur.cells[n.name];
      el("text", {x: x + 8, y: 210, "font-size": 11.5}, (c.taint ? "✓ taint" : "✗ taint") + " · " + (c.taint ? (c.cpu ? "✓" : "✗") + ` szabad ${c.free} m` : "– cpu")); } });
  const pend = s.upto.filter(p => p.node === null);
  el("text", {x: 20, y: 250, "font-size": 12.5, "font-weight": "bold"}, pend.length ? `Pending: ${pend.map(p => p.rep + ". replika").join(", ")}` : "Minden replika elhelyezve");
}
function mk(res, tol, req){ const out = [{upto: [], cur: null, tol: tol, req: req, msg: "Lépés ▶: replikánként futtatja a szűrést."}];
  res.forEach((x, i) => out.push({upto: res.slice(0, i + 1), cur: x, tol: tol, req: req, msg: x.msg})); return out; }
function d197run(){
  NODES = ["a", "b", "c"].map((k, i) => ({name: "lab-node-" + k, alloc: +document.getElementById("al" + k).value, taint: i === 0}));
  const req = +document.getElementById("rq").value, repl = +document.getElementById("rp").value;
  document.getElementById("rpv").textContent = repl;
  const res = schedule(NODES, req, repl, false); PLACED = res.map(x => x.node); setSteps(mk(res, false, req));
  document.getElementById("tol").checked = false;
}
function d197tol(){
  const req = +document.getElementById("rq").value, repl = +document.getElementById("rp").value, tol = document.getElementById("tol").checked;
  if (!PLACED) PLACED = schedule(NODES, req, repl, false).map(x => x.node);
  const res = tol ? schedule(NODES, req, repl, true, PLACED) : schedule(NODES, req, repl, false); setSteps(mk(res, tol, req)); show(STEPS.length - 1);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
