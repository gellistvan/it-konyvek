<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Záróprojekt I labstack topológia</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button class="dp" data-n="1">(1) külső → lab-edge :443</button> <button class="dp" data-n="2">(2) lab-edge → lab-app :8080</button> <button class="dp" data-n="3">(3) lab-app → lab-data :5432</button> <button class="dp" data-n="4">(4) lab-data → lab-app :9091</button> <button class="dp" data-n="5">(5) admin → mind :22</button> <label>failure: <select id="fl"><option>nincs</option><option>lab-edge</option><option>lab-app</option><option>lab-data</option><option>VM-datastore</option><option>hypervisor</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Három VM két hálózaton; a kliens HTTPS-en az edge-re, onnan 8080-on az appra, az app 5432-n a DB-re csatlakozik; a Prometheus a lab-data-ról a 9091-es porton scrape-el; SSH csak a management hálózaton."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 4. adatút a Prometheus pull-modelljét követi (lab-data → lab-app:9091), és a backup repository a javított, külön failure domainben van. Az nft-sorok szemléltető szabályrészletek (inet filter input lánc), nem teljes ruleset.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "(1) külső kliens → lab-edge, HTTPS/TCP 443 | nft: inet filter input: tcp dport 443 accept (lab-edge) | ellenőrzés: ss -ltn 'sport = :443' ; curl -sI https://lab-edge/ (TLS-végpont) || Kiesés: nincs – Minden adatút él; SLO 99,5% (SLI forrása: edge access log / Prometheus), RPO 15 perc, RTO 2 óra vállalható."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const PATHS = [[1, "külső kliens", "lab-edge", "HTTPS/TCP", 443, "inet filter input: tcp dport 443 accept (lab-edge)", "ss -ltn 'sport = :443' ; curl -sI https://lab-edge/ (TLS-végpont)"], [2, "lab-edge", "lab-app", "HTTP/TCP", 8080, "lab-app: ip saddr 192.0.2.10 tcp dport 8080 accept", "nc -z 192.0.2.20 8080 ; curl -s http://192.0.2.20:8080/healthz"], [3, "lab-app", "lab-data", "PostgreSQL/TCP", 5432, "lab-data: ip saddr 192.0.2.20 tcp dport 5432 accept", "nc -z 192.0.2.30 5432 ; ss -ltn 'sport = :5432'"], [4, "lab-data (Prometheus)", "lab-app", "HTTP/TCP", 9091, "lab-app: ip saddr 192.0.2.30 tcp dport 9091 accept", "curl -s http://192.0.2.20:9091/metrics | head ; Prometheus targets: UP"], [5, "admin workstation", "mind a három host", "SSH/TCP", 22, "mindhárom hoston: ip daddr 198.51.100.0/24 tcp dport 22 accept (csak management)", "ss -ltn 'sport = :22' ; ssh labadmin@198.51.100.20 true"]], FAIL = {"nincs": [[], "Minden adatút él; SLO 99,5% (SLI forrása: edge access log / Prometheus), RPO 15 perc, RTO 2 óra vállalható."], "lab-edge": [["lab-edge", 1, 2], "lab-edge kiesett: az 1–2. adatút megszakad, a szolgáltatás elérhetetlen → az SLO-budget fogy (RTO-óra indul); adat nem vész el."], "lab-app": [["lab-app", 2, 3, 4], "lab-app kiesett: 2–4. adatút megszakad → SLO sérül; a scrape DOWN, riasztás az Alertmanagerből; adat nem vész el."], "lab-data": [["lab-data", 3, 4], "lab-data kiesett: DB és monitoring leáll → SLO sérül; a backup repository külön failure domainben ÉP marad, restore-ral RPO ≤ 15 perc, RTO 2 óra tartható."], "VM-datastore": [["lab-edge", "lab-app", "lab-data", 1, 2, 3, 4, 5], "A VM-ek datastore-ja kiesett: mindhárom VM leáll; a backup repository más datastore-on van → restore lehetséges (RTO 2 óra a próbán múlik)."], "hypervisor": [["lab-edge", "lab-app", "lab-data", "backup", 1, 2, 3, 4, 5], "A hypervisor kiesett: minden elem, a backup repository is → RPO/RTO nem tartható; off-host másolat nélkül ez a kontraktus nyitott kockázata."]};
let SEL = 1, FL = "nincs";
function msgFor(){ const p = PATHS[SEL - 1], f = FAIL[FL];
  return "(" + p[0] + ") " + p[1] + " → " + p[2] + ", " + p[3] + " " + p[4] + " | nft: " + p[5] + " | ellenőrzés: " + p[6] + " || Kiesés: " + FL + " – " + f[1]; }
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = ""; defs0();
  const dn = FAIL[FL][0], off = x => dn.includes(x);
  R(120, 8, 572, 316, {rx: 0, fill: "none", "stroke-dasharray": "2 3", "stroke-width": 1.5}); T(126, 24, "hypervisor", {"font-size": 11});
  L(125, 90, 690, 90, {"stroke-width": 3}); T(688, 84, "app subnet 192.0.2.0/24", {"font-size": 11, "text-anchor": "end"});
  L(125, 280, 690, 280, {"stroke-width": 2.5, "stroke-dasharray": "8 5"}); T(688, 298, "management 198.51.100.0/24", {"font-size": 11, "text-anchor": "end"});
  const V = {"lab-edge": [140, ".10", "Nginx, TLS"], "lab-app": [330, ".20", "C++ :8080, /metrics :9091"], "lab-data": [520, ".30", "PostgreSQL, Prometheus"]};
  for (const h in V) { const [x, sf, r] = V[h], o = off(h);
    R(x, 120, 160, 120, {fill: o ? css("--muted") : "url(#hat)", opacity: o ? 0.45 : 1});
    R(x + 8, 128, 144, 22, {fill: css("--bg"), stroke: "none"}); T(x + 80, 144, h, {"font-size": 13, "text-anchor": "middle", "font-weight": "bold"});
    R(x + 8, 172, 144, 22, {fill: css("--bg"), stroke: "none"}); T(x + 80, 188, r, {"font-size": 10, "text-anchor": "middle"});
    T(x + 80, 110, "192.0.2" + sf, {"font-size": 10, "text-anchor": "middle"}); T(x + 80, 262, "198.51.100" + sf, {"font-size": 10, "text-anchor": "middle"});
    L(x + 80, 92, x + 80, 120); L(x + 80, 240, x + 80, 278, {"stroke-dasharray": "4 3"}); if (o) XM(x + 145, 135, 8); }
  const bo = off("backup"); R(500, 36, 170, 40, {fill: bo ? css("--muted") : "url(#dots)", opacity: bo ? 0.45 : 1});
  R(512, 46, 146, 20, {fill: css("--bg"), stroke: "none"}); T(585, 61, "backup repository", {"font-size": 11, "text-anchor": "middle"}); if (bo) XM(660, 46, 8);
  R(6, 40, 100, 40, {}); T(56, 65, "külső kliens", {"font-size": 11, "text-anchor": "middle"});
  R(6, 290, 100, 34, {}); T(56, 312, "admin", {"font-size": 11, "text-anchor": "middle"});
  const arrows = {1: [[106, 62, 180, 118]], 2: [[300, 165, 328, 165]], 3: [[490, 165, 518, 165]], 4: [[518, 215, 490, 215]], 5: [[106, 300, 220, 282], [220, 282, 410, 282], [410, 282, 600, 282]]};
  const lab = {1: [130, 70, "443"], 2: [315, 152, "8080"], 3: [505, 152, "5432"], 4: [505, 235, "9091"], 5: [150, 305, "22"]};
  for (const n in arrows) { const on = +n === SEL, broke = off(+n);
    arrows[n].forEach(a => A(a[0], a[1], a[2], a[3], {stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 4 : 1.8, "marker-end": on ? "url(#arh)" : "url(#ar)", "stroke-dasharray": broke ? "3 4" : (+n === 5 ? "6 4" : ""), opacity: broke ? 0.5 : 1}));
    T(lab[n][0], lab[n][1] - (n > 1 && n < 5 ? 12 : 0), "(" + n + ")" + (n > 1 && n < 5 ? "\n" : " ") + lab[n][2], {"font-size": 10, "text-anchor": "middle", "font-weight": on ? "bold" : "normal", fill: on ? css("--hl") : css("--fg")}); }
}
function upd(){ setSteps([{msg: msgFor()}]); }
document.querySelectorAll("button.dp").forEach(b => b.addEventListener("click", () => { SEL = +b.dataset.n; upd(); }));
document.getElementById("fl").addEventListener("change", e => { FL = e.target.value; upd(); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
