<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>External snapshot lánc állapotai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button id="forb" type="button">tiltott művelet: qemu-img resize a használt base-en</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A lab-vm1 lemezlánca öt lépésben: kiinduló base, külső snapshot (aktív a snap1), blockresize 25 GiB-ra, blockcommit pivot (aktív újra a base), mentés."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szimulált kimenetek a fejezet fájlneveivel. A qemu-img info futó VM képénél -U (force-share) kapcsolót igényel. A „tiltott művelet” gomb a használatban lévő kép módosításának veszélyét magyarázza.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"st": {"cmd": "kiinduló állapot", "layers": [{"f": "lab-vm1.qcow2", "size": 20, "ro": false}], "active": "lab-vm1.qcow2"}, "t": "1. kiinduló", "line": 0, "msg": "1. kiinduló: aktív réteg = lab-vm1.qcow2. virsh domblklist lab-vm1 → vda /var/lib/libvirt/images/lab-vm1.qcow2", "dl": "Target   Source\n vda     /var/lib/libvirt/images/lab-vm1.qcow2", "bc": "image: lab-vm1.qcow2\nvirtual size: 20 GiB"}, {"st": {"cmd": "virsh snapshot-create-as lab-vm1 snap-before-resize --disk-only --quiesce --diskspec vda,file=/var/lib/libvirt/images/lab-vm1-snap1.qcow2", "layers": [{"f": "lab-vm1.qcow2", "size": 20, "ro": true}, {"f": "lab-vm1-snap1.qcow2", "size": 20, "ro": false}], "active": "lab-vm1-snap1.qcow2"}, "t": "2. külső snapshot", "line": 1, "msg": "2. külső snapshot: aktív réteg = lab-vm1-snap1.qcow2. virsh domblklist lab-vm1 → vda /var/lib/libvirt/images/lab-vm1-snap1.qcow2", "dl": "Target   Source\n vda     /var/lib/libvirt/images/lab-vm1-snap1.qcow2", "bc": "image: lab-vm1-snap1.qcow2\nvirtual size: 20 GiB\nbacking file: /var/lib/libvirt/images/lab-vm1.qcow2\n\nimage: lab-vm1.qcow2\nvirtual size: 20 GiB"}, {"st": {"cmd": "virsh blockresize lab-vm1 vda 25G", "layers": [{"f": "lab-vm1.qcow2", "size": 20, "ro": true}, {"f": "lab-vm1-snap1.qcow2", "size": 25, "ro": false}], "active": "lab-vm1-snap1.qcow2"}, "t": "3. blockresize", "line": 2, "msg": "3. blockresize: aktív réteg = lab-vm1-snap1.qcow2. virsh domblklist lab-vm1 → vda /var/lib/libvirt/images/lab-vm1-snap1.qcow2", "dl": "Target   Source\n vda     /var/lib/libvirt/images/lab-vm1-snap1.qcow2", "bc": "image: lab-vm1-snap1.qcow2\nvirtual size: 25 GiB\nbacking file: /var/lib/libvirt/images/lab-vm1.qcow2\n\nimage: lab-vm1.qcow2\nvirtual size: 20 GiB"}, {"st": {"cmd": "virsh blockcommit lab-vm1 vda --active --pivot --wait --verbose", "layers": [{"f": "lab-vm1.qcow2", "size": 25, "ro": false}], "active": "lab-vm1.qcow2", "note": "a snap1 kikerül a láncból"}, "t": "4. commit + pivot", "line": 3, "msg": "4. commit + pivot: aktív réteg = lab-vm1.qcow2. virsh domblklist lab-vm1 → vda /var/lib/libvirt/images/lab-vm1.qcow2", "dl": "Target   Source\n vda     /var/lib/libvirt/images/lab-vm1.qcow2", "bc": "image: lab-vm1.qcow2\nvirtual size: 25 GiB"}, {"st": {"cmd": "mentés: offline (virsh shutdown + ellenőrzött shut off, majd másolás) vagy virsh backup-begin", "layers": [{"f": "lab-vm1.qcow2", "size": 25, "ro": false}], "active": "lab-vm1.qcow2"}, "t": "5. mentés", "line": 4, "msg": "5. mentés: aktív réteg = lab-vm1.qcow2. virsh domblklist lab-vm1 → vda /var/lib/libvirt/images/lab-vm1.qcow2", "dl": "Target   Source\n vda     /var/lib/libvirt/images/lab-vm1.qcow2", "bc": "image: lab-vm1.qcow2\nvirtual size: 25 GiB"}];
const CODE = ["kiinduló állapot", "virsh snapshot-create-as lab-vm1 snap-before-resize --disk-only --quiesce --diskspec vda,file=/var/lib/libvirt/images/lab-vm1-snap1.qcow2", "virsh blockresize lab-vm1 vda 25G", "virsh blockcommit lab-vm1 vda --active --pivot --wait --verbose", "mentés: offline (virsh shutdown + ellenőrzött shut off, majd másolás) vagy virsh backup-begin"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}

document.getElementById("forb").onclick = () => { status.textContent =
  "TILOS: a qemu-img a futó VM által megnyitott képet nem módosíthatja – a lemezkép megsérülhet; a snapshot után a base " +
  "ráadásul csak olvasható backing. Helyette: virsh blockresize az aktív rétegen, vagy leállított VM-en (ellenőrzött shut off) qemu-img resize."; };
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = ""; D();
  const st = s.st;
  T(150, 22, s.t, {fs: 13, bold: 1});
  st.layers.forEach((L, j) => { const y = 190 - j*90, act = L.f === st.active;
    R(40, y, 220, 64, {fill: L.ro ? "url(#hatch)" : css("--cell"), sw: act ? 4 : 1.2, stroke: act ? css("--hl") : css("--line")});
    R(62, y + 12, 176, 40, {fill: css("--bg"), stroke: "none"});
    T(150, y + 28, L.f, {fs: 12, bold: act}); T(150, y + 46, `${L.size} GiB` + (L.ro ? " – csak olvasható" : ""), {fs: 11, fill: css("--muted")});
    if (act) T(150, y - 8, "▼ aktív réteg (a VM ide ír)", {fs: 11, bold: 1, fill: css("--hl")});
  });
  if (st.layers.length === 2) { A(150, 164, 150, 188); T(200, 180, "backing", {a: "start", fs: 10, fill: css("--muted")}); }
  R(290, 40, 340, 60, {fill: css("--code"), rx: 3}); T(298, 56, "virsh domblklist lab-vm1", {a: "start", fs: 10, bold: 1});
  s.dl.split("\n").forEach((l, i) => T(298, 74 + i*15, l, {a: "start", fs: 9.5, mono: 1}));
  const bc = s.bc.split("\n"); R(290, 110, 340, 22 + bc.length*15, {fill: css("--code"), rx: 3});
  T(298, 126, "qemu-img info -U --backing-chain", {a: "start", fs: 10, bold: 1});
  bc.forEach((l, i) => T(298, 144 + i*15, l, {a: "start", fs: 9.5, mono: 1}));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
