<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eszközgyorsítási adatutak</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><button type="button" data-c="e1000">emulált e1000</button><button type="button" data-c="virtio">virtio-net (QEMU)</button><button type="button" data-c="vhost">virtio-net + vhost-net</button><button type="button" data-c="vf">SR-IOV VF</button><label><input type="checkbox" id="mig"> migrálhatóság</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy oszlop (emulált e1000, virtio-net QEMU-val, vhost-net, SR-IOV VF) azonos rétegekkel; egy TX-csomag útja lépésenként, a határátmenetek számával."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető, nem mért modell. A gombok az oszlopot választják; a lépések egy TX-csomag útját mutatják. Átmenet: VM exit vagy userspace ↔ kernel váltás.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"col": "e1000", "i": 0, "line": -1, "msg": "emulált e1000 – 1/6: vendég userspace: alkalmazás: send(). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "e1000", "i": 1, "line": -1, "msg": "emulált e1000 – 2/6: vendég kernel driver: e1000 driver: TX-leíró + regiszterírás. Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "e1000", "i": 2, "line": -1, "msg": "emulált e1000 – 3/6: VM-határ: minden MMIO/PIO regiszterírás VM exit. Átmenetek eddig: 1. Ki dolgozik: KVM."}, {"col": "e1000", "i": 3, "line": -1, "msg": "emulált e1000 – 4/6: QEMU userspace: QEMU e1000-emuláció: leíró olvasása, regiszterhatás. Átmenetek eddig: 2. Ki dolgozik: QEMU."}, {"col": "e1000", "i": 4, "line": -1, "msg": "emulált e1000 – 5/6: host kernel: write() a TAP-ra → bridge → NIC-driver. Átmenetek eddig: 3. Ki dolgozik: host kernel."}, {"col": "e1000", "i": 5, "line": -1, "msg": "emulált e1000 – 6/6: fizikai NIC: fizikai NIC DMA (host-driver), kiküldés. Átmenetek eddig: 3. Ki dolgozik: HW."}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}

const ROWS = ["vendég userspace", "vendég kernel driver", "VM-határ", "QEMU userspace", "host kernel", "IOMMU", "fizikai NIC"], COLS = [{"key": "e1000", "name": "emulált e1000", "driver": "e1000", "migr": true, "control": [], "steps": [[0, "alkalmazás: send()", "vendég", 0], [1, "e1000 driver: TX-leíró + regiszterírás", "vendég", 0], [2, "minden MMIO/PIO regiszterírás VM exit", "KVM", 1], [3, "QEMU e1000-emuláció: leíró olvasása, regiszterhatás", "QEMU", 1], [4, "write() a TAP-ra → bridge → NIC-driver", "host kernel", 1], [6, "fizikai NIC DMA (host-driver), kiküldés", "HW", 0]]}, {"key": "virtio", "name": "virtio-net (QEMU)", "driver": "virtio_net", "migr": true, "control": [], "steps": [[0, "alkalmazás: send()", "vendég", 0], [1, "virtio_net: puffer a virtqueue-ba (megosztott memória)", "vendég", 0], [2, "kick (ioeventfd): egy VM exit akár több csomagra", "KVM", 1], [3, "QEMU virtio-backend olvassa a gyűrűt", "QEMU", 1], [4, "write() a TAP-ra → bridge → NIC-driver", "host kernel", 1], [6, "fizikai NIC DMA, kiküldés", "HW", 0]]}, {"key": "vhost", "name": "virtio-net + vhost-net", "driver": "virtio_net", "migr": true, "control": [[3, 4]], "steps": [[0, "alkalmazás: send()", "vendég", 0], [1, "virtio_net: puffer a virtqueue-ba", "vendég", 0], [2, "kick: ioeventfd a kernelben (nincs userspace-váltás)", "KVM", 1], [4, "vhost-net worker szál olvassa a gyűrűt → TAP → NIC", "vhost (host kernel)", 0], [6, "fizikai NIC DMA, kiküldés", "HW", 0]]}, {"key": "vf", "name": "SR-IOV VF", "driver": "ixgbevf / iavf", "migr": false, "control": [[3, 5]], "steps": [[0, "alkalmazás: send()", "vendég", 0], [1, "VF-driver: leíró + doorbell közvetlenül a VF regiszterébe (nincs VM exit)", "vendég", 0], [6, "a VF DMA-val olvassa a vendég memóriáját", "HW", 0], [5, "az IOMMU a vendég fizikai címét host fizikai címre fordítja", "HW (IOMMU)", 0], [6, "kiküldés a fizikai porton (PF/VF switch)", "HW", 0]]}], ALLS = {"e1000": [{"col": "e1000", "i": 0, "line": -1, "msg": "emulált e1000 – 1/6: vendég userspace: alkalmazás: send(). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "e1000", "i": 1, "line": -1, "msg": "emulált e1000 – 2/6: vendég kernel driver: e1000 driver: TX-leíró + regiszterírás. Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "e1000", "i": 2, "line": -1, "msg": "emulált e1000 – 3/6: VM-határ: minden MMIO/PIO regiszterírás VM exit. Átmenetek eddig: 1. Ki dolgozik: KVM."}, {"col": "e1000", "i": 3, "line": -1, "msg": "emulált e1000 – 4/6: QEMU userspace: QEMU e1000-emuláció: leíró olvasása, regiszterhatás. Átmenetek eddig: 2. Ki dolgozik: QEMU."}, {"col": "e1000", "i": 4, "line": -1, "msg": "emulált e1000 – 5/6: host kernel: write() a TAP-ra → bridge → NIC-driver. Átmenetek eddig: 3. Ki dolgozik: host kernel."}, {"col": "e1000", "i": 5, "line": -1, "msg": "emulált e1000 – 6/6: fizikai NIC: fizikai NIC DMA (host-driver), kiküldés. Átmenetek eddig: 3. Ki dolgozik: HW."}], "virtio": [{"col": "virtio", "i": 0, "line": -1, "msg": "virtio-net (QEMU) – 1/6: vendég userspace: alkalmazás: send(). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "virtio", "i": 1, "line": -1, "msg": "virtio-net (QEMU) – 2/6: vendég kernel driver: virtio_net: puffer a virtqueue-ba (megosztott memória). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "virtio", "i": 2, "line": -1, "msg": "virtio-net (QEMU) – 3/6: VM-határ: kick (ioeventfd): egy VM exit akár több csomagra. Átmenetek eddig: 1. Ki dolgozik: KVM."}, {"col": "virtio", "i": 3, "line": -1, "msg": "virtio-net (QEMU) – 4/6: QEMU userspace: QEMU virtio-backend olvassa a gyűrűt. Átmenetek eddig: 2. Ki dolgozik: QEMU."}, {"col": "virtio", "i": 4, "line": -1, "msg": "virtio-net (QEMU) – 5/6: host kernel: write() a TAP-ra → bridge → NIC-driver. Átmenetek eddig: 3. Ki dolgozik: host kernel."}, {"col": "virtio", "i": 5, "line": -1, "msg": "virtio-net (QEMU) – 6/6: fizikai NIC: fizikai NIC DMA, kiküldés. Átmenetek eddig: 3. Ki dolgozik: HW."}], "vhost": [{"col": "vhost", "i": 0, "line": -1, "msg": "virtio-net + vhost-net – 1/5: vendég userspace: alkalmazás: send(). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "vhost", "i": 1, "line": -1, "msg": "virtio-net + vhost-net – 2/5: vendég kernel driver: virtio_net: puffer a virtqueue-ba. Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "vhost", "i": 2, "line": -1, "msg": "virtio-net + vhost-net – 3/5: VM-határ: kick: ioeventfd a kernelben (nincs userspace-váltás). Átmenetek eddig: 1. Ki dolgozik: KVM."}, {"col": "vhost", "i": 3, "line": -1, "msg": "virtio-net + vhost-net – 4/5: host kernel: vhost-net worker szál olvassa a gyűrűt → TAP → NIC. Átmenetek eddig: 1. Ki dolgozik: vhost (host kernel)."}, {"col": "vhost", "i": 4, "line": -1, "msg": "virtio-net + vhost-net – 5/5: fizikai NIC: fizikai NIC DMA, kiküldés. Átmenetek eddig: 1. Ki dolgozik: HW."}], "vf": [{"col": "vf", "i": 0, "line": -1, "msg": "SR-IOV VF – 1/5: vendég userspace: alkalmazás: send(). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "vf", "i": 1, "line": -1, "msg": "SR-IOV VF – 2/5: vendég kernel driver: VF-driver: leíró + doorbell közvetlenül a VF regiszterébe (nincs VM exit). Átmenetek eddig: 0. Ki dolgozik: vendég."}, {"col": "vf", "i": 2, "line": -1, "msg": "SR-IOV VF – 3/5: fizikai NIC: a VF DMA-val olvassa a vendég memóriáját. Átmenetek eddig: 0. Ki dolgozik: HW."}, {"col": "vf", "i": 3, "line": -1, "msg": "SR-IOV VF – 4/5: IOMMU: az IOMMU a vendég fizikai címét host fizikai címre fordítja. Átmenetek eddig: 0. Ki dolgozik: HW (IOMMU)."}, {"col": "vf", "i": 4, "line": -1, "msg": "SR-IOV VF – 5/5: fizikai NIC: kiküldés a fizikai porton (PF/VF switch). Átmenetek eddig: 0. Ki dolgozik: HW."}]};
let CUR = "e1000";
document.querySelectorAll("button[data-c]").forEach(b => b.onclick = () => { CUR = b.dataset.c; setSteps(ALLS[CUR]); });
document.getElementById("mig").addEventListener("change", () => show(k));
function render(s){
  svg.setAttribute("viewBox", "0 0 640 360"); svg.innerHTML = ""; D();
  const x0 = 150, cw = 120, rh = 38, y0 = 50;
  ROWS.forEach((n, r) => T(x0 - 8, y0 + r*rh + 24, n, {a: "end", fs: 11}));
  COLS.forEach((c, ci) => {
    const x = x0 + ci*cw, act = c.key === s.col;
    T(x + cw/2, 22, c.name, {fs: 11, bold: act}); T(x + cw/2, 38, "(" + c.driver + ")", {fs: 9.5, fill: css("--muted")});
    ROWS.forEach((n, r) => R(x, y0 + r*rh, cw, rh, {rx: 0, sw: 0.6, stroke: css("--muted"),
      fill: r === 2 ? css("--cellhl") : (r === 5 && c.key === "vf" ? "url(#hatch)" : css("--cell"))}));
    const pts = c.steps.map((st, i) => [x + cw/2 + (c.key === "vf" && i === 2 ? 22 : 0) - (c.key === "vf" && i === 4 ? 22 : 0), y0 + st[0]*rh + rh/2]);
    pts.forEach((p, i) => { if (i) { const q = pts[i-1], on = act && i <= s.i;
      A(q[0], q[1] + 6, p[0], p[1] - 6, {sw: on ? 3.5 : 1.5, stroke: on ? css("--hl") : css("--muted"), m: on ? "ahb" : "ah"}); } });
    pts.forEach((p, i) => { const on = act && i === s.i;
      el("circle", {cx: p[0], cy: p[1], r: on ? 8 : 5, fill: on ? css("--hl2") : (act && i < s.i ? css("--fg") : css("--muted"))}); });
    c.control.forEach(([a, b]) => { A(x + 14, y0 + a*rh + rh/2, x + 14, y0 + b*rh + rh/2 - 4, {dash: "4 3", sw: 1.2, stroke: css("--muted")}); });
    if (document.getElementById("mig").checked) T(x + cw/2, y0 + 7*rh + 20, c.migr ? "migrálható" : "élőben ált. nem", {fs: 10.5, bold: 1, fill: c.migr ? css("--fg") : css("--hl2")});
  });
  T(10, 350, "vastag kék: eddig bejárt TX-út; szaggatott: QEMU control (beállítás); szürke sor: VM-határ", {a: "start", fs: 10, fill: css("--muted")});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
