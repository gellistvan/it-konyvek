<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTP-időbélyegek és aszimmetriahiba</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:grid;grid-template-columns:auto 1fr 5em;gap:2px 10px;align-items:center;max-width:640px}
input[type=range]{width:100%}
button{font:inherit;padding:2px 10px;cursor:pointer;margin:6px 6px 6px 0}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
#status{min-height:2.9em;margin:6px 0;font-weight:bold}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl">
 <label for="off">valódi offset (szerver − kliens)</label><input id="off" type="range" min="-50" max="50" step="0.5" value="5"><span id="offv"></span>
 <label for="out">odaút</label><input id="out" type="range" min="0" max="50" step="0.5" value="2"><span id="outv"></span>
 <label for="back">visszaút</label><input id="back" type="range" min="0" max="50" step="0.5" value="8"><span id="backv"></span>
 <label for="proc">szerverfeldolgozás</label><input id="proc" type="range" min="0" max="10" step="0.5" value="1"><span id="procv"></span>
</div>
<button id="sym" type="button">szimmetrikus</button><button id="book" type="button">könyv példája</button>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 760 230" role="img" aria-label="A kliens és a szerver órájának időtengelye a négy NTP-időbélyeggel"></svg>
<pre id="calc"></pre>
<p class="small">Számított példa, nem mérés. t1 és t4 a kliens (lab-time-client, 10.139.0.20), t2 és t3 a szerver
(lab-time-ref, 10.139.0.10) naptári órája szerint. θ = ((t2 − t1) + (t3 − t4)) / 2, δ = (t4 − t1) − (t3 − t2);
a becslés hibája (odaút − visszaút) / 2.</p>
<script>
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mk(tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svg.appendChild(e); return e; }
function f(v){ return (Math.round(v * 10) / 10).toFixed(1).replace(".", ",").replace("-", "−"); }
function ntp(off, out, back, proc){ const t1 = 0, t2 = t1 + out + off, t3 = t2 + proc, t4 = t1 + out + proc + back;
  const theta = ((t2 - t1) + (t3 - t4)) / 2, delta = (t4 - t1) - (t3 - t2); return {t1, t2, t3, t4, theta, delta, err: theta - off}; }
const ids = ["off", "out", "back", "proc"], el = {};
ids.forEach(i => { el[i] = document.getElementById(i); el[i].addEventListener("input", upd); });
function set(v){ ids.forEach((i, j) => el[i].value = v[j]); upd(); }
document.getElementById("sym").onclick = () => set([+el.off.value, 5, 5, +el.proc.value]);
document.getElementById("book").onclick = () => set([5, 2, 8, 1]);
function upd(){
  const off = +el.off.value, out = +el.out.value, back = +el.back.value, proc = +el.proc.value;
  ids.forEach(i => document.getElementById(i + "v").textContent = f(+el[i].value) + " ms");
  const r = ntp(off, out, back, proc);
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="' + css("--line") + '"/></marker></defs>';
  const span = Math.max(12, out + proc + back + 2), x0 = 120, x1 = 740, X = t => x0 + (x1 - x0) * t / span, yc = 60, ys = 160;
  mk("line", {x1: x0, x2: x1, y1: yc, y2: yc, stroke: css("--line"), "stroke-width": 1.2});
  mk("line", {x1: x0, x2: x1, y1: ys, y2: ys, stroke: css("--line"), "stroke-width": 3});
  mk("text", {x: 10, y: yc + 4, "font-size": 12}, "kliens órája"); mk("text", {x: 10, y: ys + 4, "font-size": 12}, "szerver órája");
  const step = span > 40 ? 10 : (span > 20 ? 5 : 2);
  for (let t = 0; t <= span; t += step){ mk("line", {x1: X(t), x2: X(t), y1: yc - 4, y2: yc + 4, stroke: css("--line")}); mk("text", {x: X(t), y: yc - 8, "font-size": 10.5, "text-anchor": "middle"}, f(t).replace(",0", ""));
    mk("line", {x1: X(t), x2: X(t), y1: ys - 4, y2: ys + 4, stroke: css("--line")}); mk("text", {x: X(t), y: ys + 18, "font-size": 10.5, "text-anchor": "middle"}, f(t + off).replace(",0", "")); }
  const a = 0, b = out, c = out + proc, d = out + proc + back;
  mk("line", {x1: X(a), y1: yc + 6, x2: X(b), y2: ys - 6, stroke: css("--hl"), "stroke-width": 2.5, "marker-end": "url(#ah)"});
  mk("line", {x1: X(c), y1: ys - 6, x2: X(d), y2: yc + 6, stroke: css("--hl2"), "stroke-width": 2.5, "stroke-dasharray": "7 5", "marker-end": "url(#ah)"});
  mk("text", {x: X(a), y: yc - 24, "font-size": 12, "text-anchor": "middle", "font-weight": "bold"}, "t1 = " + f(r.t1));
  mk("text", {x: X(d), y: yc - 24, "font-size": 12, "text-anchor": "middle", "font-weight": "bold"}, "t4 = " + f(r.t4));
  mk("text", {x: X(b) - 6, y: ys + 40, "font-size": 12, "text-anchor": "end", "font-weight": "bold"}, "t2 = " + f(r.t2));
  mk("text", {x: X(c) + 6, y: ys + 40, "font-size": 12, "text-anchor": "start", "font-weight": "bold"}, "t3 = " + f(r.t3));
  document.getElementById("status").textContent = "θ = " + f(r.theta) + " ms, δ = " + f(r.delta) + " ms, becslési hiba = " + f(r.err) + " ms (valódi offset " + f(off) + " ms)";
  document.getElementById("calc").textContent =
    "t1 = " + f(r.t1) + "   t2 = " + f(r.t2) + "   t3 = " + f(r.t3) + "   t4 = " + f(r.t4) + "  (ms)\n" +
    "θ = ((t2 − t1) + (t3 − t4)) / 2 = ((" + f(r.t2 - r.t1) + ") + (" + f(r.t3 - r.t4) + ")) / 2 = " + f(r.theta) + " ms\n" +
    "δ = (t4 − t1) − (t3 − t2) = " + f(r.t4 - r.t1) + " − " + f(r.t3 - r.t2) + " = " + f(r.delta) + " ms\n" +
    "becslési hiba = θ − offset = (odaút − visszaút) / 2 = (" + f(out) + " − " + f(back) + ") / 2 = " + f(r.err) + " ms";
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
upd();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
