<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cwnd-modellek: Reno-szerű AIMD és CUBIC</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--grid:#ddd}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--grid:#444}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:14px}
.pan{flex:1;min-width:300px}
.ctl{display:grid;grid-template-columns:auto 1fr 4em;gap:2px 8px;align-items:center;margin:6px 0}
input[type=range]{width:100%}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
#status{min-height:2.9em;margin:6px 0}
.small{font-size:12px;color:var(--muted)}
button{font:inherit;padding:2px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="status" aria-live="polite"></div>
<div class="row">
 <div class="pan">
  <b>(a) Reno-szerű AIMD</b> (idő: RTT)
  <div class="ctl">
   <label for="iw">IW [MSS]</label><input id="iw" type="range" min="1" max="20" value="10"><span id="iwv"></span>
   <label for="la">loss ennél a cwnd-nél</label><input id="la" type="range" min="40" max="1280" step="20" value="640"><span id="lav"></span>
  </div>
  <svg id="sa" viewBox="0 0 380 260" role="img" aria-label="Reno-szerű AIMD cwnd-görbe"></svg>
 </div>
 <div class="pan">
  <b>(b) CUBIC</b> (idő: s a loss után)
  <div class="ctl">
   <label for="wm">Wmax [MSS]</label><input id="wm" type="range" min="50" max="1000" step="2" value="512"><span id="wmv"></span>
   <label for="be">β</label><input id="be" type="range" min="0.5" max="0.9" step="0.05" value="0.7"><span id="bev"></span>
   <label for="cc">C</label><input id="cc" type="range" min="0.1" max="1" step="0.05" value="0.4"><span id="ccv"></span>
  </div>
  <svg id="sb" viewBox="0 0 380 260" role="img" aria-label="CUBIC ablakfüggvény a loss után"></svg>
 </div>
</div>
<button id="rst" type="button">A könyv értékei</button>
<p class="small">Számított modellek, nem mért adatok. (a) slow start: duplázás RTT-nként, loss után felezés
(β = 0,5), majd +1 MSS/RTT. (b) W(t) = C·(t − K)³ + Wmax, K = ∛(Wmax·(1 − β)/C) (RFC 8312/9438).</p>
<script>
const DEF = {"iw": 10, "la": 640, "wmax": 512, "beta": 0.7, "c": 0.4};
const NS = "http://www.w3.org/2000/svg";
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function mk(svgEl, tag, a, txt){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; svgEl.appendChild(e); return e; }
function f(v, d){ return v.toFixed(d).replace(".", ","); }
function aimd(iw, la){ let w = iw, lost = false; const out = [];
  for (let t = 0; t <= 10; t++){ out.push([t, w]); if (!lost && w >= la){ w = Math.floor(w / 2); lost = true; } else if (!lost) w *= 2; else w += 1; }
  return out; }
function cubic(c, b, wm){ const K = Math.cbrt(wm * (1 - b) / c); const out = [];
  for (let t = 0; t <= 12; t++) out.push([t, c * Math.pow(t - K, 3) + wm]); return [K, out]; }
function plot(svgEl, pts, xmax, ymin, ymax, xl, extra){
  svgEl.innerHTML = ""; const L = 50, R = 370, T = 12, B = 220;
  const X = x => L + (R - L) * x / xmax, Y = y => B - (B - T) * (y - ymin) / (ymax - ymin);
  for (let i = 0; i <= 4; i++){ const v = ymin + (ymax - ymin) * i / 4; mk(svgEl, "line", {x1: L, x2: R, y1: Y(v), y2: Y(v), stroke: css("--grid")});
    mk(svgEl, "text", {x: L - 6, y: Y(v) + 4, "text-anchor": "end", "font-size": 11}, f(v, 0)); }
  for (let x = 0; x <= xmax; x += 2) mk(svgEl, "text", {x: X(x), y: B + 16, "text-anchor": "middle", "font-size": 11}, String(x));
  mk(svgEl, "line", {x1: L, x2: R, y1: B, y2: B, stroke: css("--line")}); mk(svgEl, "line", {x1: L, x2: L, y1: T, y2: B, stroke: css("--line")});
  mk(svgEl, "text", {x: (L + R) / 2, y: B + 34, "text-anchor": "middle", "font-size": 12}, xl);
  mk(svgEl, "text", {x: 12, y: (T + B) / 2, "text-anchor": "middle", "font-size": 12, transform: "rotate(-90 12 " + (T + B) / 2 + ")"}, "cwnd [MSS]");
  if (extra) extra(X, Y);
  mk(svgEl, "polyline", {points: pts.map(p => X(p[0]) + "," + Y(Math.max(ymin, Math.min(ymax, p[1])))).join(" "), fill: "none", stroke: css("--hl"), "stroke-width": 2.2});
  pts.forEach(p => { if (p[1] >= ymin && p[1] <= ymax) mk(svgEl, "circle", {cx: X(p[0]), cy: Y(p[1]), r: 3, fill: css("--hl")}); });
}
function upd(){
  const iw = +iwEl.value, la = +laEl.value, wm = +wmEl.value, b = +beEl.value, c = +ccEl.value;
  document.getElementById("iwv").textContent = iw; document.getElementById("lav").textContent = la;
  document.getElementById("wmv").textContent = wm; document.getElementById("bev").textContent = f(b, 2); document.getElementById("ccv").textContent = f(c, 2);
  const A = aimd(iw, la), ya = Math.max(...A.map(p => p[1])) * 1.1;
  plot(document.getElementById("sa"), A, 10, 0, ya, "idő [RTT]");
  const r = cubic(c, b, wm), K = r[0], CU = r[1];
  const lo = Math.min(...CU.map(p => p[1])), hi = Math.max(...CU.map(p => p[1]));
  plot(document.getElementById("sb"), CU, 12, Math.floor(lo * 0.95), Math.ceil(hi * 1.03), "idő a loss után [s]", (X, Y) => {
    mk(document.getElementById("sb"), "line", {x1: X(0), x2: X(12), y1: Y(wm), y2: Y(wm), stroke: css("--hl2"), "stroke-dasharray": "6 4"});
    mk(document.getElementById("sb"), "text", {x: X(0.2), y: Y(wm) - 5, "font-size": 11, fill: css("--hl2")}, "Wmax");
    if (K <= 12){ mk(document.getElementById("sb"), "line", {x1: X(K), x2: X(K), y1: 12, y2: 220, stroke: css("--muted"), "stroke-dasharray": "2 3"});
      mk(document.getElementById("sb"), "text", {x: X(K) + 4, y: 26, "font-size": 11}, "K ≈ " + f(K, 2) + " s"); } });
  const lossIdx = A.findIndex(p => p[1] >= la);
  document.getElementById("status").textContent = "AIMD: IW " + iw + " MSS" + (lossIdx >= 0 && lossIdx < 10 ? ", loss " + A[lossIdx][1] + " MSS-nél (" + lossIdx + ". RTT) → " + A[lossIdx + 1][1] + ", majd +1 MSS/RTT; 10. RTT: " + A[10][1] + " MSS." : ", 10 RTT alatt nincs loss.") +
    " CUBIC: W(0) = β·Wmax = " + f(b * wm, 1) + ", K ≈ " + f(K, 2) + " s, W(12) = " + f(CU[12][1], 1) + " MSS.";
}
const iwEl = document.getElementById("iw"), laEl = document.getElementById("la"), wmEl = document.getElementById("wm"), beEl = document.getElementById("be"), ccEl = document.getElementById("cc");
[iwEl, laEl, wmEl, beEl, ccEl].forEach(e => e.addEventListener("input", upd));
document.getElementById("rst").onclick = () => { iwEl.value = DEF.iw; laEl.value = DEF.la; wmEl.value = DEF.wmax; beEl.value = DEF.beta; ccEl.value = DEF.c; upd(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", upd);
upd();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
