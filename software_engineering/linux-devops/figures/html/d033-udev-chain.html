<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eszközhozzáadás eseménylánca</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>szabálykulcs <select id="rule" onchange="mode()" aria-label="szabálykulcs"><option value="env">ENV{ID_SERIAL_SHORT}</option><option value="attr">ATTR{serial}</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Hat lépés: kernel regisztrálja az sdz lemezt, a devtmpfs létrehozza a /dev/sdz node-ot, uevent, systemd-udevd beállítja az ID_SERIAL_SHORT változót, a 99-lab-disk szabály ENV kulccsal illeszkedik és szimlinket ad, udev-adatbázis."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A major:minor 65:144 illusztratív. ATTR{serial} a blokkeszközön nem létezik (T-D2-077); a /dev node-ot a kernel devtmpfs-e hozza létre, az udev jogosultságot és szimlinket ad (T-D2-080).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Lemez csatolása előtt: nincs /sys/block/sdz, nincs /dev/sdz.", "k": -1, "ok": true, "line": -1, "mode": "env"}, {"msg": "1 kernel: SCSI-lemez regisztrálása: /sys/block/sdz dev = 65:144", "k": 0, "ok": true, "line": 0, "cmd": "cat /sys/block/sdz/dev", "mode": "env"}, {"msg": "2 devtmpfs: /dev/sdz node: a kernel devtmpfs-e hozza létre (nem az udev)", "k": 1, "ok": true, "line": 1, "cmd": "ls -l /dev/sdz; findmnt /dev", "mode": "env"}, {"msg": "3 uevent (netlink): ACTION=add SUBSYSTEM=block DEVTYPE=disk DEVPATH=/devices/…/block/sdz", "k": 2, "ok": true, "line": 2, "cmd": "udevadm monitor --kernel --udev --property", "mode": "env"}, {"msg": "4 systemd-udevd: 60-persistent-storage.rules: ID_SERIAL_SHORT=LABDISK01 ID_SERIAL=0QEMU_QEMU_HARDDISK_ LABDISK01", "k": 3, "ok": true, "line": 3, "cmd": "udevadm info --query=property --name=/dev/sdz", "mode": "env"}, {"msg": "5 99-lab-disk.rules: ENV{ID_SERIAL_SHORT}==\"LABDISK01\" SYMLINK+=\"disk/by-serial/labdata\"", "k": 4, "ok": true, "line": 4, "cmd": "udevadm test /sys/block/sdz", "mode": "env"}, {"msg": "6 udev-adatbázis: /run/udev/data/b65:144 /dev/disk/by-serial/labdata → ../../sdz", "k": 5, "ok": true, "line": 5, "cmd": "ls -l /dev/disk/by-serial/labdata", "mode": "env"}];
const CODE = ["1 kernel: SCSI-lemez regisztrálása", "2 devtmpfs: /dev/sdz node", "3 uevent (netlink)", "4 systemd-udevd: 60-persistent-storage.rules", "5 99-lab-disk.rules", "6 udev-adatbázis"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ALL={"env": [{"msg": "Lemez csatolása előtt: nincs /sys/block/sdz, nincs /dev/sdz.", "k": -1, "ok": true, "line": -1, "mode": "env"}, {"msg": "1 kernel: SCSI-lemez regisztrálása: /sys/block/sdz dev = 65:144", "k": 0, "ok": true, "line": 0, "cmd": "cat /sys/block/sdz/dev", "mode": "env"}, {"msg": "2 devtmpfs: /dev/sdz node: a kernel devtmpfs-e hozza létre (nem az udev)", "k": 1, "ok": true, "line": 1, "cmd": "ls -l /dev/sdz; findmnt /dev", "mode": "env"}, {"msg": "3 uevent (netlink): ACTION=add SUBSYSTEM=block DEVTYPE=disk DEVPATH=/devices/…/block/sdz", "k": 2, "ok": true, "line": 2, "cmd": "udevadm monitor --kernel --udev --property", "mode": "env"}, {"msg": "4 systemd-udevd: 60-persistent-storage.rules: ID_SERIAL_SHORT=LABDISK01 ID_SERIAL=0QEMU_QEMU_HARDDISK_ LABDISK01", "k": 3, "ok": true, "line": 3, "cmd": "udevadm info --query=property --name=/dev/sdz", "mode": "env"}, {"msg": "5 99-lab-disk.rules: ENV{ID_SERIAL_SHORT}==\"LABDISK01\" SYMLINK+=\"disk/by-serial/labdata\"", "k": 4, "ok": true, "line": 4, "cmd": "udevadm test /sys/block/sdz", "mode": "env"}, {"msg": "6 udev-adatbázis: /run/udev/data/b65:144 /dev/disk/by-serial/labdata → ../../sdz", "k": 5, "ok": true, "line": 5, "cmd": "ls -l /dev/disk/by-serial/labdata", "mode": "env"}], "attr": [{"msg": "Lemez csatolása előtt: nincs /sys/block/sdz, nincs /dev/sdz.", "k": -1, "ok": true, "line": -1, "mode": "attr"}, {"msg": "1 kernel: SCSI-lemez regisztrálása: /sys/block/sdz dev = 65:144", "k": 0, "ok": true, "line": 0, "cmd": "cat /sys/block/sdz/dev", "mode": "attr"}, {"msg": "2 devtmpfs: /dev/sdz node: a kernel devtmpfs-e hozza létre (nem az udev)", "k": 1, "ok": true, "line": 1, "cmd": "ls -l /dev/sdz; findmnt /dev", "mode": "attr"}, {"msg": "3 uevent (netlink): ACTION=add SUBSYSTEM=block DEVTYPE=disk DEVPATH=/devices/…/block/sdz", "k": 2, "ok": true, "line": 2, "cmd": "udevadm monitor --kernel --udev --property", "mode": "attr"}, {"msg": "4 systemd-udevd: 60-persistent-storage.rules: ID_SERIAL_SHORT=LABDISK01 ID_SERIAL=0QEMU_QEMU_HARDDISK_ LABDISK01", "k": 3, "ok": true, "line": 3, "cmd": "udevadm info --query=property --name=/dev/sdz", "mode": "attr"}, {"msg": "5 99-lab-disk.rules: ATTR{serial}==\"LABDISK01\" – NINCS ILLESZKEDÉS: a /sys/block/sdz alatt nincs `serial` fájl (ATTR csak az eszköz saját sysfs-könyvtárát nézi), ezért a szimlink nem jön létre.", "k": 4, "ok": false, "line": 4, "cmd": "udevadm test /sys/block/sdz", "mode": "attr"}, {"msg": "6 udev-adatbázis: /run/udev/data/b65:144 létrejön, de DEVLINKS-ben nincs disk/by-serial/labdata → ls: No such file or directory.", "k": 5, "ok": false, "line": 5, "cmd": "ls -l /dev/disk/by-serial/labdata", "mode": "attr"}]}, DEF=[["kernel", "1 kernel: SCSI-lemez regisztrálása", "/sys/block/sdz\ndev = 65:144", "cat /sys/block/sdz/dev"], ["kernel", "2 devtmpfs: /dev/sdz node", "a kernel devtmpfs-e hozza létre\n(nem az udev)", "ls -l /dev/sdz; findmnt /dev"], ["kernel", "3 uevent (netlink)", "ACTION=add SUBSYSTEM=block\nDEVTYPE=disk\nDEVPATH=/devices/…/block/sdz", "udevadm monitor --kernel --udev --property"], ["user", "4 systemd-udevd: 60-persistent-storage.rules", "ID_SERIAL_SHORT=LABDISK01\nID_SERIAL=0QEMU_QEMU_HARDDISK_\nLABDISK01", "udevadm info --query=property --name=/dev/sdz"], ["user", "5 99-lab-disk.rules", "ENV{ID_SERIAL_SHORT}==\"LABDISK01\"\nSYMLINK+=\"disk/by-serial/labdata\"", "udevadm test /sys/block/sdz"], ["user", "6 udev-adatbázis", "/run/udev/data/b65:144\n/dev/disk/by-serial/labdata\n→ ../../sdz", "ls -l /dev/disk/by-serial/labdata"]];
function mode(){ setSteps(ALL[document.getElementById("rule").value]); }
function render(s){
  svg.setAttribute("viewBox","0 0 620 330"); svg.innerHTML="";
  const P=[[10,30],[215,30],[420,30],[10,160],[215,160],[420,160]];
  DEF.forEach((d,i)=>{const p=P[i], on=i===s.k, done=i<=s.k, bad=on&&!s.ok, dk=d[0]==="kernel";
    el("rect",{x:p[0],y:p[1],width:190,height:104,rx:8,fill:done?(dk?css("--fg"):css("--cellhl")):css("--cell"),stroke:bad?css("--hl2"):(on?css("--hl"):css("--line")),"stroke-width":on?4:1.2,"stroke-dasharray":dk?"":"6 3"});
    const tc = done&&dk ? css("--bg") : css("--fg");
    const tt=d[1].split(": "); tt.forEach((l,j)=>el("text",{x:p[0]+95,y:p[1]+17+j*14,"text-anchor":"middle","font-size":11,"font-weight":"bold",fill:tc},l+(j<tt.length-1?":":"")));
    let det=d[2].split("\n"); if(i===4 && s.mode==="attr") det=['ATTR{serial}=="LABDISK01"','SYMLINK+="disk/by-serial/labdata"'];
    det.forEach((l,j)=>el("text",{x:p[0]+95,y:p[1]+54+j*13,"text-anchor":"middle","font-size":8.8,"font-family":"monospace",fill:tc},l));
    if(bad) el("text",{x:p[0]+95,y:p[1]+96,"text-anchor":"middle","font-size":12,"font-weight":"bold",fill:css("--hl2")},"✕ nincs illeszkedés");
  });
  [[200,82,215,82],[405,82,420,82],[200,212,215,212],[405,212,420,212]].forEach(a=>el("line",{x1:a[0],y1:a[1],x2:a[2],y2:a[3],stroke:css("--line"),"stroke-width":2}));
  el("path",{d:"M515,134 C515,150 105,140 105,160",fill:"none",stroke:css("--line"),"stroke-width":1.5});
  el("text",{x:300,y:150,"text-anchor":"middle","font-size":11,fill:css("--muted")},"uevent (netlink) → systemd-udevd");
  if(s.k>=0) el("text",{x:10,y:292,"font-size":12,"font-family":"monospace",fill:css("--hl")},"$ "+s.cmd);
  el("text",{x:10,y:318,"font-size":11,fill:css("--muted")},"ATTR{} = saját sysfs-könyvtár · ATTRS{} = szülők · ENV{} = udev-változók");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
