<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP és RDMA adatút</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>RDMA-művelet <select id="mode" onchange="pickMode()" aria-label="RDMA művelet"><option value="write">WRITE</option><option value="send">SEND/RECV</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Két sáv: TCP-n 2 CPU-másolás, 2 syscall és fogadó oldali interrupt; RDMA WRITE-on 0 másolás, a post_send userspace doorbell, a távoli CPU nem vesz részt."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés. A kódpanel a TCP || RDMA WRITE lépéspárokat mutatja. SEND/RECV-nél a távoli oldal előre recv WR-t ad fel, és a CQ-t pollozza (eseménycsatornával interruptot is kérhet).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kezdés: 4 KiB-os üzenet; felül TCP, alul RDMA WRITE.", "a": -1, "b": -1, "ca": [0, 0, 0], "cb": [0, 0, 0], "line": -1}, {"msg": "TCP: 1 send() syscall  |  RDMA: 1 MR regisztrálva (előkészítés): lkey/rkey", "a": 0, "b": 0, "ca": [0, 1, 0], "cb": [0, 0, 0], "line": 0}, {"msg": "TCP: 2 copy user → socket buf  |  RDMA: 2 ibv_post_send: WR az SQ-ba + doorbell (userspace)", "a": 1, "b": 1, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 1}, {"msg": "TCP: 3 TCP/IP, NIC DMA read  |  RDMA: 3 RNIC DMA read a helyi MR-ből", "a": 2, "b": 2, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 2}, {"msg": "TCP: 4 hálózat  |  RDMA: 4 hálózat (RDMA WRITE, rkey)", "a": 3, "b": 3, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 3}, {"msg": "TCP: 5 NIC DMA → RX, IRQ + softirq  |  RDMA: 5 távoli RNIC DMA write a távoli MR-be", "a": 4, "b": 4, "ca": [1, 1, 1], "cb": [0, 0, 0], "line": 4}, {"msg": "TCP: 6 recv() syscall  |  RDMA: 6 távoli CPU: nem vesz részt", "a": 5, "b": 5, "ca": [1, 2, 1], "cb": [0, 0, 0], "line": 5}, {"msg": "TCP: 7 copy socket buf → user  |  RDMA: 7 CQ-bejegyzés a küldőnél (poll_cq)", "a": 6, "b": 6, "ca": [2, 2, 1], "cb": [0, 0, 0], "line": 6}];
const CODE = ["1 send() syscall   ||   1 MR regisztrálva (előkészítés): lkey/rkey", "2 copy user → socket buf   ||   2 ibv_post_send: WR az SQ-ba + doorbell (userspace)", "3 TCP/IP, NIC DMA read   ||   3 RNIC DMA read a helyi MR-ből", "4 hálózat   ||   4 hálózat (RDMA WRITE, rkey)", "5 NIC DMA → RX, IRQ + softirq   ||   5 távoli RNIC DMA write a távoli MR-be", "6 recv() syscall   ||   6 távoli CPU: nem vesz részt", "7 copy socket buf → user   ||   7 CQ-bejegyzés a küldőnél (poll_cq)"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const SW=[{"msg": "Kezdés: 4 KiB-os üzenet; felül TCP, alul RDMA WRITE.", "a": -1, "b": -1, "ca": [0, 0, 0], "cb": [0, 0, 0], "line": -1}, {"msg": "TCP: 1 send() syscall  |  RDMA: 1 MR regisztrálva (előkészítés): lkey/rkey", "a": 0, "b": 0, "ca": [0, 1, 0], "cb": [0, 0, 0], "line": 0}, {"msg": "TCP: 2 copy user → socket buf  |  RDMA: 2 ibv_post_send: WR az SQ-ba + doorbell (userspace)", "a": 1, "b": 1, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 1}, {"msg": "TCP: 3 TCP/IP, NIC DMA read  |  RDMA: 3 RNIC DMA read a helyi MR-ből", "a": 2, "b": 2, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 2}, {"msg": "TCP: 4 hálózat  |  RDMA: 4 hálózat (RDMA WRITE, rkey)", "a": 3, "b": 3, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 3}, {"msg": "TCP: 5 NIC DMA → RX, IRQ + softirq  |  RDMA: 5 távoli RNIC DMA write a távoli MR-be", "a": 4, "b": 4, "ca": [1, 1, 1], "cb": [0, 0, 0], "line": 4}, {"msg": "TCP: 6 recv() syscall  |  RDMA: 6 távoli CPU: nem vesz részt", "a": 5, "b": 5, "ca": [1, 2, 1], "cb": [0, 0, 0], "line": 5}, {"msg": "TCP: 7 copy socket buf → user  |  RDMA: 7 CQ-bejegyzés a küldőnél (poll_cq)", "a": 6, "b": 6, "ca": [2, 2, 1], "cb": [0, 0, 0], "line": 6}], SS=[{"msg": "Kezdés: 4 KiB-os üzenet; felül TCP, alul RDMA SEND/RECV.", "a": -1, "b": -1, "ca": [0, 0, 0], "cb": [0, 0, 0], "line": -1}, {"msg": "TCP: 1 send() syscall  |  RDMA: 1 MR regisztrálva; a távoli oldal recv WR-t ad fel az RQ-ba", "a": 0, "b": 0, "ca": [0, 1, 0], "cb": [0, 0, 0], "line": 0}, {"msg": "TCP: 2 copy user → socket buf  |  RDMA: 2 ibv_post_send (SEND): WR + doorbell (userspace)", "a": 1, "b": 1, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 1}, {"msg": "TCP: 3 TCP/IP, NIC DMA read  |  RDMA: 3 RNIC DMA read a helyi MR-ből", "a": 2, "b": 2, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 2}, {"msg": "TCP: 4 hálózat  |  RDMA: 4 hálózat (SEND)", "a": 3, "b": 3, "ca": [1, 1, 0], "cb": [0, 0, 0], "line": 3}, {"msg": "TCP: 5 NIC DMA → RX, IRQ + softirq  |  RDMA: 5 távoli RNIC DMA a következő RQ-bejegyzés pufferébe", "a": 4, "b": 4, "ca": [1, 1, 1], "cb": [0, 0, 0], "line": 4}, {"msg": "TCP: 6 recv() syscall  |  RDMA: 6 távoli CQ-bejegyzés: a távoli CPU pollozza (nincs másolás)", "a": 5, "b": 5, "ca": [1, 2, 1], "cb": [0, 0, 0], "line": 5}, {"msg": "TCP: 7 copy socket buf → user  |  RDMA: 7 CQ-bejegyzés a küldőnél (poll_cq)", "a": 6, "b": 6, "ca": [2, 2, 1], "cb": [0, 0, 0], "line": 6}], NODES={"su": [0.3, 2.2], "sk": [0.3, 0.95], "sn": [3.4, -0.3], "rn": [8.4, -0.3], "rk": [11.5, 0.95], "ru": [11.5, 2.2]}, NAMES={"tcp": {"su": "user puffer (4 KiB)", "sk": "socket buffer", "sn": "NIC TX ring", "rn": "NIC RX ring", "rk": "socket buffer", "ru": "user puffer"}, "write": {"su": "MR (lkey)", "sk": "kernel: csak setup", "sn": "RNIC: SQ, CQ", "rn": "távoli RNIC", "rk": "távoli CPU: nem vesz részt", "ru": "távoli MR (rkey)"}, "send": {"su": "MR (lkey)", "sk": "kernel: csak setup", "sn": "RNIC: SQ, CQ", "rn": "távoli RNIC: RQ, CQ", "rk": "távoli CPU: recv WR, poll CQ", "ru": "RQ-puffer (MR)"}}, LA=[["su", "sk", "sys", "1 send() syscall", [0, 1, 0]], ["su", "sk", "copy", "2 copy user → socket buf", [1, 0, 0]], ["sk", "sn", "dma", "3 TCP/IP, NIC DMA read", [0, 0, 0]], ["sn", "rn", "wire", "4 hálózat", [0, 0, 0]], ["rn", "rk", "dma", "5 NIC DMA → RX, IRQ + softirq", [0, 0, 1]], ["ru", "rk", "sys", "6 recv() syscall", [0, 1, 0]], ["rk", "ru", "copy", "7 copy socket buf → user", [1, 0, 0]]], LW=[["su", "su", "setup", "1 MR regisztrálva (előkészítés): lkey/rkey", [0, 0, 0]], ["su", "sn", "db", "2 ibv_post_send: WR az SQ-ba + doorbell (userspace)", [0, 0, 0]], ["su", "sn", "dma", "3 RNIC DMA read a helyi MR-ből", [0, 0, 0]], ["sn", "rn", "wire", "4 hálózat (RDMA WRITE, rkey)", [0, 0, 0]], ["rn", "ru", "dma", "5 távoli RNIC DMA write a távoli MR-be", [0, 0, 0]], ["rk", "rk", "none", "6 távoli CPU: nem vesz részt", [0, 0, 0]], ["sn", "su", "cq", "7 CQ-bejegyzés a küldőnél (poll_cq)", [0, 0, 0]]], LS=[["su", "su", "setup", "1 MR regisztrálva; a távoli oldal recv WR-t ad fel az RQ-ba", [0, 0, 0]], ["su", "sn", "db", "2 ibv_post_send (SEND): WR + doorbell (userspace)", [0, 0, 0]], ["su", "sn", "dma", "3 RNIC DMA read a helyi MR-ből", [0, 0, 0]], ["sn", "rn", "wire", "4 hálózat (SEND)", [0, 0, 0]], ["rn", "ru", "dma", "5 távoli RNIC DMA a következő RQ-bejegyzés pufferébe", [0, 0, 0]], ["rn", "rk", "cq", "6 távoli CQ-bejegyzés: a távoli CPU pollozza (nincs másolás)", [0, 0, 0]], ["sn", "su", "cq", "7 CQ-bejegyzés a küldőnél (poll_cq)", [0, 0, 0]]];
let MODE="write";
function pickMode(){MODE=document.getElementById("mode").value; setSteps(MODE==="write"?SW:SS);}
function drawLane(y0, names, steps, cur, cnt, title){
  const X=v=>20+v*38, Y=v=>y0+(3-v)*38;
  el("text",{x:20,y:y0+10,"font-size":14,"font-weight":"bold"},title);
  el("line",{x1:X(-0.2),y1:Y(1.82),x2:X(6.2),y2:Y(1.82),stroke:css("--muted"),"stroke-dasharray":"4 4"});
  el("line",{x1:X(8.6),y1:Y(1.82),x2:X(14.8),y2:Y(1.82),stroke:css("--muted"),"stroke-dasharray":"4 4"});
  const act = cur>=0 ? steps[cur] : null;
  for(const n in NODES){const p=NODES[n], on=act&&(act[0]===n||act[1]===n);
    el("rect",{x:X(p[0]),y:Y(p[1]+0.65),width:2.6*38,height:0.65*38,rx:6,fill:on?css("--cellhl"):css("--cell"),stroke:on?css("--hl2"):css("--line"),"stroke-width":on?3:1});
    el("text",{x:X(p[0]+1.3),y:Y(p[1]+0.33)+4,"text-anchor":"middle","font-size":10.5},names[n]);}
  if(act){const a=NODES[act[0]], b=NODES[act[1]];
    const dash={sys:"",copy:"10 5",dma:"2 4",wire:"",db:"",cq:"8 3 2 3"}[act[2]];
    if(act[0]!==act[1] && dash!==undefined){
      el("line",{x1:X(a[0]+1.3),y1:Y(a[1]+0.33),x2:X(b[0]+1.3),y2:Y(b[1]+0.33),stroke:css("--hl"),"stroke-width":act[2]==="copy"?5:3,"stroke-dasharray":dash});
      el("circle",{cx:X(b[0]+1.3),cy:Y(b[1]+0.33),r:6,fill:css("--hl")});}
    el("text",{x:X(7.4),y:Y(-0.3),"text-anchor":"middle","font-size":12,"font-weight":"bold",fill:css("--hl2")},act[3]);}
  el("text",{x:X(7.4),y:Y(2.6),"text-anchor":"middle","font-size":13,"font-weight":"bold"},"másolás "+cnt[0]+" · syscall "+cnt[1]+" · távoli IRQ "+cnt[2]);
}
function render(s){
  svg.setAttribute("viewBox","0 0 600 360"); svg.innerHTML="";
  drawLane(10, NAMES.tcp, LA, s.a, s.ca, "TCP");
  drawLane(185, MODE==="write"?NAMES.write:NAMES.send, MODE==="write"?LW:LS, s.b, s.cb, MODE==="write"?"RDMA WRITE":"RDMA SEND/RECV");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
