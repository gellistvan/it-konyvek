<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling karbantartás és headroom</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>N <input type="range" id="N" min="3" max="10" value="5" aria-label="N"> <span id="Nv">5</span></label> <label>M_min <input type="range" id="M" min="1" max="9" value="3" aria-label="M_min"> <span id="Mv">3</span></label> <label>r <input type="range" id="R" min="0" max="3" value="1" aria-label="r"> <span id="Rv">1</span></label> <label>b <input type="range" id="B" min="1" max="5" value="1" aria-label="b"> <span id="Bv">1</span></label> <label><input type="checkbox" id="F"> váratlan kiesés a batch alatt</label> <button id="P6">23.2.5.1: N=6, M_min=4, r=1</button><script>function upd(){ const g = id => +document.getElementById(id).value; const M = Math.min(g("M"), g("N") - 1); ["N","M","R","B"].forEach(id => document.getElementById(id + "v").textContent = id === "M" ? M : g(id)); SIM = simulate(g("N"), M, g("R"), g("B"), document.getElementById("F").checked); setSteps(mkSteps(SIM)); show(STEPS.length - 1); } ["N","M","R","B","F"].forEach(id => document.getElementById(id).addEventListener("input", upd)); document.getElementById("P6").addEventListener("click", () => { document.getElementById("N").value = 6; document.getElementById("M").value = 4; document.getElementById("R").value = 1; document.getElementById("B").value = 1; upd(); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Öt hoszt egyesével frissül; az egészséges hosztok száma 4-re csökken, egy váratlan kiesésnél 3-ra, és nem esik az M_min alá."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szemléltető modell (időegységek: drain 1, patch 2, reboot 1, smoke 1, observe 2), nem mérés. A canary mindig egy hoszt; a többi batch b méretű.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "t": 0, "bi": 0, "msg": ""}, {"line": -1, "t": 9, "bi": 1, "msg": ""}, {"line": -1, "t": 16, "bi": 2, "msg": ""}, {"line": -1, "t": 23, "bi": 3, "msg": ""}, {"line": -1, "t": 30, "bi": 4, "msg": ""}, {"line": -1, "t": 37, "bi": -1, "msg": ""}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const PH = [["drain",1],["patch",2],["reboot",1],["smoke",1],["observe",2]], GAP = 2;
function plan(N, b){ const rest = []; for (let i = 1; i < N; i++) rest.push(i); const out = [[0]]; for (let i = 0; i < rest.length; i += Math.max(1, b)) out.push(rest.slice(i, i + Math.max(1, b))); return out; }
function simulate(N, Mmin, r, b, fail){
  const batches = plan(N, b), blen = 7, segs = [], starts = []; let t = 0;
  batches.forEach((bt, kk) => { if (kk === 1) t += GAP; starts.push(t); bt.forEach(h => { let tt = t; PH.forEach(([ph, d]) => { segs.push([h, tt, tt + d, ph]); tt += d; }); }); t += blen; });
  const T = t, fk = Math.min(2, batches.length - 1);
  let failHost = null;
  if (fail) { const cand = []; for (let h = 0; h < N; h++) if (batches[fk].indexOf(h) < 0) cand.push(h); if (cand.length) { failHost = cand[cand.length - 1]; segs.push([failHost, starts[fk] + 2.5, starts[fk] + 5, "fail"]); } }
  const curve = []; let mn = N;
  for (let x = 0; x < T; x += 0.5) { const down = new Set(); segs.forEach(([h, a, bb, ph]) => { if (a <= x && x < bb && ph !== "observe") down.add(h); }); curve.push([x, N - down.size]); mn = Math.min(mn, N - down.size); }
  return {N:N, Mmin:Mmin, r:r, b:b, fail:fail, segs:segs, curve:curve, T:T, starts:starts, batches:batches, min:mn, okFormula: b <= N - Mmin - r, slo: mn >= Mmin, failHost:failHost};
}
let SIM = simulate(5, 3, 1, 1, false);
function mkSteps(sim){ return sim.starts.map((s, i) => ({line:-1, t:s, bi:i, msg:""})).concat([{line:-1, t:sim.T, bi:-1, msg:""}]); }

function render(s){
  svg.setAttribute("viewBox", "0 0 640 " + (110 + SIM.N*30 + 150));
  svg.innerHTML = "";
  const N = SIM.N, x0 = 100, W = 520, sc = W/SIM.T, X = t => x0 + t*sc, lane = h => 40 + h*30;
  const d = el("defs", {});
  const pat = {drain:'<path d="M0,6 L6,0" stroke="#000" stroke-width="1"/>', patch:'<circle cx="3" cy="3" r="1" fill="#000"/>', reboot:'<path d="M0,0 L6,6 M6,0 L0,6" stroke="#000" stroke-width="0.8"/>', smoke:'<path d="M0,3 L6,3" stroke="#000" stroke-width="1"/>'};
  d.innerHTML = Object.entries(pat).map(([k, v]) => `<pattern id="p_${k}" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#ddd"/>${v}</pattern>`).join("");
  for (let h = 0; h < N; h++) el("text", {x:6, y:lane(h)+16, "font-size":11.5}, "lab-host-" + String(h+1).padStart(2, "0"));
  el("rect", {x:X(7), y:28, width:GAP*sc, height:N*30+8, fill: css("--code")});
  el("text", {x:X(8), y:22, "text-anchor":"middle", "font-size":10}, "24 h");
  SIM.segs.forEach(([h, a, b, ph]) => {
    const vis = a < s.t + 1e-9;
    if (ph === "fail") { if (vis) { el("rect", {x:X(a), y:lane(h)+2, width:(b-a)*sc, height:22, fill: css("--hl2")}); el("text", {x:X(b)+4, y:lane(h)+17, "font-size":11, "font-weight":"bold"}, "← kiesés"); } return; }
    el("rect", {x:X(a), y:lane(h)+4, width:(b-a)*sc, height:18, fill: ph === "observe" ? css("--cell") : `url(#p_${ph})`, stroke: css("--line"), "stroke-width":0.6, opacity: vis ? 1 : 0.25});
  });
  el("line", {x1:X(s.t), y1:30, x2:X(s.t), y2:lane(N)+150, stroke: css("--hl"), "stroke-width":2});
  // görbe
  const yb = lane(N) + 130, ysc = 100/Math.max(N, 1), Y = v => yb - v*ysc;
  [[SIM.Mmin, "M_min = " + SIM.Mmin, "6 3"], [SIM.Mmin + SIM.r, "M_min + r = " + (SIM.Mmin + SIM.r), "2 3"]].forEach(([v, t, dash]) => { el("line", {x1:x0, y1:Y(v), x2:x0+W, y2:Y(v), stroke: css("--muted"), "stroke-dasharray":dash}); el("text", {x:x0+W, y:Y(v)-3, "text-anchor":"end", "font-size":10.5, fill: css("--muted")}, t); });
  let dd = "";
  SIM.curve.forEach(([x, c], i) => { if (x > s.t) return; dd += (i ? "L" : "M") + X(x) + "," + Y(c) + "L" + X(Math.min(x + 0.5, s.t)) + "," + Y(c); });
  el("path", {d:dd, fill:"none", stroke: SIM.slo ? css("--hl") : css("--hl2"), "stroke-width":2.5});
  for (let v = 0; v <= N; v++) if (v % Math.ceil(N/5) === 0 || v === N) el("text", {x:x0-6, y:Y(v)+4, "text-anchor":"end", "font-size":10}, String(v));
  el("text", {x:6, y:Y(N/2), "font-size":11}, "egészséges");
  const seen = SIM.curve.filter(([x]) => x <= s.t).map(([, c]) => c), cur = seen.length ? Math.min(...seen) : N;
  const viol = cur < SIM.Mmin;
  if (viol) el("text", {x:x0 + W/2, y:Y(SIM.Mmin) + 26, "text-anchor":"middle", "font-size":14, "font-weight":"bold", fill: css("--hl2")}, "SLO-sértés: az egészséges hosztok száma M_min alá esett");
  const bi = s.bi >= 0 ? s.bi : SIM.batches.length;
  status.textContent = (s.bi >= 0 ? `${bi+1}. batch (${SIM.batches[bi].map(h => "lab-host-" + String(h+1).padStart(2, "0")).join(", ")})` : "vége") +
    ` · b ≤ N − M_min − r = ${SIM.N} − ${SIM.Mmin} − ${SIM.r} = ${SIM.N - SIM.Mmin - SIM.r}; b = ${SIM.b} ` + (SIM.okFormula ? "✓" : "✗ (túl nagy)") +
    ` · eddigi minimum: ${cur}` + (viol ? " – SLO-SÉRTÉS" : "");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
