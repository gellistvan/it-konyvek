<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCI index, manifest, config és layer</title><style>:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--s2:#e6e6e6;--s3:#bfbfbf}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--s2:#333;--s3:#555}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.mono{font-family:ui-monospace,monospace}
pre{margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
.small{font-size:12px;color:var(--muted)}
 g.node{cursor:pointer} g.node:focus{outline:none} g.node:focus rect{stroke-width:3.5}</style></head><body>
<div class="ctl"><label>host platform: <select id="plat"><option value="arm64">arm64</option><option value="amd64">amd64</option></select></label>
<button id="retag">tag átállítása új indexre</button><button id="reset">visszaállítás</button></div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 470" role="img" aria-label="OCI hivatkozási gráf: tag, index, két manifest, configok és layerek"></svg>
<pre id="json" aria-label="Kiválasztott objektum JSON-részlete"></pre>
<p class="small">Kattints (vagy Tab + Enter) egy csomópontra a minta JSON-részletért. A digestek rövidített, illusztratív értékek; a szaggatott nyíl a mutálható tag, a folytonos a digest-hivatkozás.</p>
<script>
const D = {"N": {"tag": {"x": 0.0, "y": 2.05, "w": 1.05, "h": 0.75, "t": "tag\nlab-hello:v1\n(mutálható)", "typ": "tag", "plat": null}, "idx": {"x": 1.35, "y": 1.95, "w": 1.3, "h": 0.95, "t": "image index\nsha256:aaaa…\nmediaType: …index", "typ": "index", "plat": null}, "m1": {"x": 2.95, "y": 2.95, "w": 1.3, "h": 0.8, "t": "manifest\nsha256:bbbb…\nlinux/amd64", "typ": "manifest", "plat": "amd64"}, "m2": {"x": 2.95, "y": 1.1, "w": 1.3, "h": 0.8, "t": "manifest\nsha256:cccc…\nlinux/arm64", "typ": "manifest", "plat": "arm64"}, "c1": {"x": 4.55, "y": 3.55, "w": 1.6, "h": 0.62, "t": "config sha256:dddd…\nEntrypoint [\"/hello\"]\narchitecture: amd64", "typ": "config", "plat": "amd64"}, "l1": {"x": 4.55, "y": 2.8, "w": 1.6, "h": 0.55, "t": "layer sha256:eeee…\n/hello (tar+gzip)", "typ": "layer", "plat": "amd64"}, "c2": {"x": 4.55, "y": 1.7, "w": 1.6, "h": 0.62, "t": "config sha256:ffff…\nEntrypoint [\"/hello\"]\narchitecture: arm64", "typ": "config", "plat": "arm64"}, "l2": {"x": 4.55, "y": 0.95, "w": 1.6, "h": 0.55, "t": "layer sha256:9999…\n/hello (tar+gzip)", "typ": "layer", "plat": "arm64"}}, "E": [{"a": "tag", "b": "idx", "kind": "tag", "lab": ""}, {"a": "idx", "b": "m1", "kind": "digest", "lab": "platform\namd64"}, {"a": "idx", "b": "m2", "kind": "digest", "lab": "platform\narm64"}, {"a": "m1", "b": "c1", "kind": "digest", "lab": ""}, {"a": "m1", "b": "l1", "kind": "digest", "lab": ""}, {"a": "m2", "b": "c2", "kind": "digest", "lab": ""}, {"a": "m2", "b": "l2", "kind": "digest", "lab": ""}], "S": {"tag": "labregistry.example.test:5000/lab-hello:v1\n→ GET /v2/lab-hello/manifests/v1\n   Docker-Content-Digest: sha256:aaaa… (illusztratív)\nA tag átírható (podman tag / push) – mutálható mutató.", "idx": "{\n \"schemaVersion\": 2,\n \"mediaType\": \"application/vnd.oci.image.index.v1+json\",\n \"manifests\": [\n  {\n   \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n   \"digest\": \"sha256:bbbb…\",\n   \"size\": 482,\n   \"platform\": {\n    \"architecture\": \"amd64\",\n    \"os\": \"linux\"\n   }\n  },\n  {\n   \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n   \"digest\": \"sha256:cccc…\",\n   \"size\": 482,\n   \"platform\": {\n    \"architecture\": \"arm64\",\n    \"os\": \"linux\"\n   }\n  }\n ]\n}", "m1": "{\n \"schemaVersion\": 2,\n \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n \"config\": {\n  \"mediaType\": \"application/vnd.oci.image.config.v1+json\",\n  \"digest\": \"sha256:dddd…\",\n  \"size\": 1104\n },\n \"layers\": [\n  {\n   \"mediaType\": \"application/vnd.oci.image.layer.v1.tar+gzip\",\n   \"digest\": \"sha256:eeee…\",\n   \"size\": 612340\n  }\n ]\n}", "m2": "{\n \"schemaVersion\": 2,\n \"mediaType\": \"application/vnd.oci.image.manifest.v1+json\",\n \"config\": {\n  \"mediaType\": \"application/vnd.oci.image.config.v1+json\",\n  \"digest\": \"sha256:ffff…\",\n  \"size\": 1108\n },\n \"layers\": [\n  {\n   \"mediaType\": \"application/vnd.oci.image.layer.v1.tar+gzip\",\n   \"digest\": \"sha256:9999…\",\n   \"size\": 598712\n  }\n ]\n}", "c1": "{\n \"architecture\": \"amd64\",\n \"os\": \"linux\",\n \"config\": {\n  \"Entrypoint\": [\n   \"/hello\"\n  ]\n },\n \"rootfs\": {\n  \"type\": \"layers\",\n  \"diff_ids\": [\n   \"sha256:…\"\n  ]\n }\n}", "l1": "blob application/vnd.oci.image.layer.v1.tar+gzip\ndigest: sha256:eeee… (a tömörített tar bájtjainak hash-e)\nsize: 612340\ntartalom: /hello (statikus ELF, amd64)", "c2": "{\n \"architecture\": \"arm64\",\n \"os\": \"linux\",\n \"config\": {\n  \"Entrypoint\": [\n   \"/hello\"\n  ]\n },\n \"rootfs\": {\n  \"type\": \"layers\",\n  \"diff_ids\": [\n   \"sha256:…\"\n  ]\n }\n}", "l2": "blob application/vnd.oci.image.layer.v1.tar+gzip\ndigest: sha256:9999… (a tömörített tar bájtjainak hash-e)\nsize: 598712\ntartalom: /hello (statikus ELF, arm64)"}, "H": 4.55};
const svg = document.getElementById("v"), NS = "http://www.w3.org/2000/svg";
function el(tag, a, txt, par){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (txt !== undefined) e.textContent = txt; (par || svg).appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
let sel = "idx", retag = false;
const S = 100, Y = y => (D.H - y) * S + 10, X = x => x * S + 10;
function draw(){
  const plat = document.getElementById("plat").value;
  svg.innerHTML = "";
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`;
  const nodes = JSON.parse(JSON.stringify(D.N));
  if (retag) nodes.idx2 = {x: 1.35, y: 3.25, w: 1.3, h: 0.75, t: "új image index\nsha256:1234…\n(v1 újrabuild)", typ: "index", plat: null};
  const R = (k, s) => { const n = nodes[k]; return s === "r" ? [X(n.x + n.w), Y(n.y + n.h / 2)] : [X(n.x), Y(n.y + n.h / 2)]; };
  const edges = D.E.map(e => Object.assign({}, e));
  if (retag) edges[0].b = "idx2";
  edges.forEach(e => {
    const [x0, y0] = R(e.a, "r"), [x1, y1] = R(e.b, "l"), on = nodes[e.b].plat === plat;
    el("line", {x1: x0, y1: y0, x2: x1 - 2, y2: y1, stroke: css("--line"), "stroke-width": on ? 3 : 1.3, "stroke-dasharray": e.kind === "tag" ? "7 4" : "", "marker-end": "url(#ah)"});
    if (e.lab) el("text", {x: (x0 + x1) / 2 - 40, y: (y0 + y1) / 2 + (y1 < y0 ? -8 : 16), "text-anchor": "middle", "font-size": 11}, e.lab.replace("\n", " "));
  });
  Object.entries(nodes).forEach(([k, n]) => {
    const on = n.plat === plat, g = el("g", {class: "node", tabindex: 0, role: "button", "aria-label": n.t.replace(/\n/g, ", ")});
    el("rect", {x: X(n.x), y: Y(n.y + n.h), width: n.w * S, height: n.h * S, rx: 6, fill: on ? css("--cellhl") : css("--cell"),
               stroke: k === sel ? css("--hl") : css("--line"), "stroke-width": on || k === sel ? 3 : 1.2, "stroke-dasharray": n.typ === "tag" ? "6 4" : ""}, undefined, g);
    const L = n.t.split("\n");
    L.forEach((l, i) => el("text", {x: X(n.x + n.w / 2), y: Y(n.y + n.h / 2) + (i - (L.length - 1) / 2) * 14 + 4, "text-anchor": "middle", "font-size": 11.5}, l, g));
    g.addEventListener("click", () => { sel = k; draw(); });
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); sel = k; draw(); } });
  });
  if (retag) el("text", {x: X(1.35), y: Y(4.3), "font-size": 11.5}, "a régi index (sha256:aaaa…) és ágai változatlanok, csak a tag mozdult");
  el("text", {x: X(0), y: Y(0.4), "font-size": 12, "font-weight": "bold"}, plat + " host: a kliens az index platformlistájából a linux/" + plat + " manifestet választja");
  document.getElementById("json").textContent = sel === "idx2" ? "új index: sha256:1234… (illusztratív)\nA régi index digestje (sha256:aaaa…) nem változik; aki digesttel hivatkozott rá, ugyanazt kapja." : D.S[sel];
  const st = retag ? "A tag (lab-hello:v1) most az új indexre (sha256:1234…) mutat; a régi index sha256:aaaa… változatlanul letölthető digesttel." :
    "A tag (lab-hello:v1) az sha256:aaaa… indexre mutat – ez az egyetlen mutálható hivatkozás.";
  document.getElementById("status").textContent = st + " Kiválasztva: " + (nodes[sel] ? nodes[sel].t.replace(/\n/g, " ") : "") + ".";
}
document.getElementById("plat").addEventListener("change", draw);
document.getElementById("retag").onclick = () => { retag = true; draw(); };
document.getElementById("reset").onclick = () => { retag = false; if (sel === "idx2") sel = "idx"; draw(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script><script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body></html>
