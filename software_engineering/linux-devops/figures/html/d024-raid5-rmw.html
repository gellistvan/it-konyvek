<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAID5 RMW és degraded olvasás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>szint <select id="lvl" onchange="gen()" aria-label="RAID-szint"><option value="5">RAID5</option><option value="6">RAID6</option><option value="10">RAID10</option></select></label> <label><input type="checkbox" id="fail" checked onchange="gen()"> lemez kiesése (D1)</label> <label>B' (hex) <input id="bn" value="3C" size="3" maxlength="2" aria-label="új B bájt hexában"></label> <button onclick="gen()">Újraszámol</button></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="RAID5 sáv négy lemezen: régi B és P olvasása, P' = 0x66 számítása, B' és P' írása (2 olvasás, 2 írás); D1 kiesése után B' = A xor C xor P' = 0x3C."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Modell, nem mérés. RAID6: P és Q paritás (Q GF(2⁸)-ban, x⁸+x⁴+x³+x²+1, g = 2), a kis írás 3 R + 3 W = 6; RAID10: 2 W, olvasás nélkül. A lépéssor a beállításokból számolódik újra.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"disks": [["D0", "A", 15], ["D1", "B", 51], ["D2", "C", 85], ["D3", "P", 105]], "msg": "Ép RAID5: P = A⊕B⊕C = 0x69. Frontend írás: B ← 0x3C — backend R = 0, W = 0", "expr": "P = 0x0F ⊕ 0x33 ⊕ 0x55 = 0x69", "io": [], "line": 0, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "B", 51], ["D2", "C", 85], ["D3", "P", 105]], "msg": "1. régi B olvasása (0x33) — backend R = 1, W = 0", "expr": "", "io": [["R", 1]], "line": 1, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "B", 51], ["D2", "C", 85], ["D3", "P", 105]], "msg": "2. régi P olvasása (0x69) — backend R = 2, W = 0", "expr": "", "io": [["R", 3]], "line": 2, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "B", 51], ["D2", "C", 85], ["D3", "P", 105]], "msg": "3. P' = P⊕B⊕B' — backend R = 2, W = 0", "expr": "P' = 0x69 ⊕ 0x33 ⊕ 0x3C = 0x66", "io": [], "line": 3, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "B'", 60], ["D2", "C", 85], ["D3", "P", 105]], "msg": "4. B' írása (0x3C) — backend R = 2, W = 1", "expr": "", "io": [["W", 1]], "line": 4, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "B'", 60], ["D2", "C", 85], ["D3", "P'", 102]], "msg": "5. P' írása (0x66): P_w = R+W = 4 — backend R = 2, W = 2", "expr": "", "io": [["W", 3]], "line": 5, "failed": -1}, {"disks": [["D0", "A", 15], ["D1", "—", null], ["D2", "C", 85], ["D3", "P'", 102]], "msg": "D1 kiesik: a tömb degraded — backend R = 0, W = 0", "expr": "", "io": [], "line": 6, "failed": 1}, {"disks": [["D0", "A", 15], ["D1", "—", null], ["D2", "C", 85], ["D3", "P'", 102]], "msg": "Degraded olvasás: B' = A⊕C⊕P' (n−1 = 3 lemez olvasása) — backend R = 3, W = 0", "expr": "B' = 0x0F ⊕ 0x55 ⊕ 0x66 = 0x3C", "io": [["R", 0], ["R", 2], ["R", 3]], "line": 7, "failed": 1}];
const CODE = ["frontend írás: B ← B'", "R: régi B", "R: régi P (RAID6: régi Q is)", "P' = P ⊕ B ⊕ B'  (Q' = Q ⊕ g·(B ⊕ B'))", "W: B'", "W: P' (RAID6: Q')", "lemez kiesik", "degraded olvasás: B' = A ⊕ C ⊕ P'"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function gm(a,b){let r=0;while(b){if(b&1)r^=a;a<<=1;if(a&0x100)a^=0x11D;b>>=1;}return r;}
function hx(v){return "0x"+v.toString(16).toUpperCase().padStart(2,"0");}
function gen(){
  const lvl=document.getElementById("lvl").value, fail=document.getElementById("fail").checked;
  let bn=parseInt(document.getElementById("bn").value,16); if(isNaN(bn)||bn<0||bn>255){bn=0x3C;}
  const A=0x0F,B=0x33,C=0x55, P=A^B^C, PN=P^B^bn, Q=gm(1,A)^gm(2,B)^gm(4,C), QN=Q^gm(2,B^bn);
  const S=[]; let r=0,w=0;
  function st(disks,msg,expr,io,line,failed){S.push({disks:disks.map(d=>d.slice()),msg:msg+" — backend R = "+r+", W = "+w,expr:expr,io:io,line:line,failed:(failed===undefined?-1:failed)});}
  if(lvl==="5"){
    let d=[["D0","A",A],["D1","B",B],["D2","C",C],["D3","P",P]];
    st(d,"Ép RAID5: P = A⊕B⊕C = "+hx(P)+". Frontend írás: B ← "+hx(bn),"P = "+hx(A)+" ⊕ "+hx(B)+" ⊕ "+hx(C)+" = "+hx(P),[],0,-1);
    r++; st(d,"1. régi B olvasása ("+hx(B)+")","",[["R",1]],1,-1);
    r++; st(d,"2. régi P olvasása ("+hx(P)+")","",[["R",3]],2,-1);
    st(d,"3. P' = P⊕B⊕B'","P' = "+hx(P)+" ⊕ "+hx(B)+" ⊕ "+hx(bn)+" = "+hx(PN),[],3,-1);
    w++; d[1]=["D1","B'",bn]; st(d,"4. B' írása ("+hx(bn)+")","",[["W",1]],4,-1);
    w++; d[3]=["D3","P'",PN]; st(d,"5. P' írása ("+hx(PN)+"): P_w = R+W = 4","",[["W",3]],5,-1);
    if(fail){ r=0; w=0;
      d[1]=["D1","—",null]; st(d,"D1 kiesik: a tömb degraded","",[],6,1);
      r=3; st(d,"Degraded olvasás: B' = A⊕C⊕P' (n−1 = 3 lemez olvasása)","B' = "+hx(A)+" ⊕ "+hx(C)+" ⊕ "+hx(PN)+" = "+hx(A^C^PN),[["R",0],["R",2],["R",3]],7,1);
    }
  } else if(lvl==="6"){
    let d=[["D0","A",A],["D1","B",B],["D2","C",C],["D3","P",P],["D4","Q",Q]];
    st(d,"Ép RAID6: P = A⊕B⊕C = "+hx(P)+", Q = A⊕2·B⊕4·C = "+hx(Q)+" (GF(2⁸))","",[],0,-1);
    r++; st(d,"1. régi B olvasása","",[["R",1]],1,-1);
    r++; st(d,"2. régi P olvasása","",[["R",3]],2,-1);
    r++; st(d,"2b. régi Q olvasása","",[["R",4]],2,-1);
    st(d,"3. P' és Q' számítása","P' = "+hx(PN)+",  Q' = Q ⊕ 2·(B⊕B') = "+hx(QN),[],3,-1);
    w++; d[1]=["D1","B'",bn]; st(d,"4. B' írása","",[["W",1]],4,-1);
    w++; d[3]=["D3","P'",PN]; st(d,"5. P' írása","",[["W",3]],5,-1);
    w++; d[4]=["D4","Q'",QN]; st(d,"5b. Q' írása: P_w = 3+3 = 6","",[["W",4]],5,-1);
    if(fail){ r=0; w=0; d[1]=["D1","—",null]; st(d,"D1 kiesik (RAID6 még egy hibát elvisel)","",[],6,1);
      r=3; st(d,"Degraded olvasás P-ből: B' = A⊕C⊕P'","B' = "+hx(A^C^PN),[["R",0],["R",2],["R",3]],7,1);}
  } else {
    let d=[["D0","A",A],["D0'","A",A],["D1","B",B],["D1'","B",B]];
    st(d,"Ép RAID10 (két tükörpár): nincs paritás","",[],0,-1);
    w++; d[2]=["D1","B'",bn]; st(d,"B' írása az egyik tükörre","",[["W",2]],4,-1);
    w++; d[3]=["D1'","B'",bn]; st(d,"B' írása a másik tükörre: P_w = 2 (olvasás nélkül)","",[["W",3]],4,-1);
    if(fail){ r=0; w=0; d[2]=["D1","—",null]; st(d,"D1 kiesik","",[],6,2);
      r=1; st(d,"Degraded olvasás: B' a tükörről (1 olvasás, XOR nélkül)","B' = "+hx(bn),[["R",3]],7,2);}
  }
  setSteps(S);
}
function render(s){
  svg.setAttribute("viewBox","0 0 600 300"); svg.innerHTML="";
  const n=s.disks.length, wd=96, gap=(600-n*wd)/(n+1);
  el("rect",{x:110,y:20,width:380,height:46,fill:css("--cell"),stroke:css("--line")});
  el("text",{x:300,y:40,"text-anchor":"middle","font-size":13},"RAID-vezérlő (md)");
  el("text",{x:300,y:58,"text-anchor":"middle","font-size":13,"font-weight":"bold"},s.expr||"");
  s.disks.forEach((d,i)=>{const x=gap+i*(wd+gap), dead=s.failed===i;
    el("rect",{x:x,y:190,width:wd,height:70,fill:dead?css("--cell"):css("--cellhl"),stroke:css("--line"),"stroke-width":1.5});
    if(dead){el("line",{x1:x,y1:190,x2:x+wd,y2:260,stroke:css("--fg"),"stroke-width":2});el("line",{x1:x,y1:260,x2:x+wd,y2:190,stroke:css("--fg"),"stroke-width":2});}
    el("text",{x:x+wd/2,y:215,"text-anchor":"middle","font-size":14,"font-weight":"bold"},d[0]);
    el("text",{x:x+wd/2,y:240,"text-anchor":"middle","font-size":13},d[2]===null?"kiesett":d[1]+" = "+hx(d[2]));
    (s.io||[]).forEach(o=>{ if(o[1]!==i) return; const ax=x+wd/2;
      if(o[0]==="R"){el("line",{x1:ax,y1:188,x2:ax,y2:74,stroke:css("--hl"),"stroke-width":3,"stroke-dasharray":"7 5"});el("path",{d:`M${ax-7},${82} L${ax},${68} L${ax+7},${82} Z`,fill:css("--hl")});el("text",{x:ax+10,y:130,"font-size":14,"font-weight":"bold"},"R");}
      else {el("line",{x1:ax,y1:68,x2:ax,y2:182,stroke:css("--hl2"),"stroke-width":3});el("path",{d:`M${ax-7},${176} L${ax},${190} L${ax+7},${176} Z`,fill:css("--hl2")});el("text",{x:ax+10,y:130,"font-size":14,"font-weight":"bold"},"W");}
    });
  });
  el("text",{x:300,y:288,"text-anchor":"middle","font-size":13,fill:css("--muted")},"R: szaggatott nyíl (olvasás), W: folytonos nyíl (írás). Modell, nem mérés.");
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
