<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qcow2 backing-lánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<span class="small">Kattintson egy clusterre (vagy Tab + Enter) az olvasás útjához.</span>
<button id="wr" type="button">írás a kijelölt clusterre</button>
<button id="mg" type="button">golden C3 módosítása (TILOS)</button>
<button id="rs" type="button">alaphelyzet</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Három réteg 8-8 clusterrel: clone (C5, C6), golden (C2, C5), base (C0–C7). A kijelölt cluster olvasása az első olyan rétegből történik felülről, amelyben a cluster megvan."></svg>
<div id="extra"></div>
<p class="small">Modell. A qemu-img map depth értéke: 0 = clone, 1 = golden, 2 = base. A backing réteg (golden, base) módosítása minden ráépülő réteg nézetét megváltoztatja – ezért tilos.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}


const LAYERS = ["clone", "golden", "base"], FILES = {"clone": "lab-d171-clone01.qcow2", "golden": "lab-d171-golden.qcow2", "base": "ubuntu-24.04-server-cloudimg-amd64.img"}, INIT = {"base": {"0": "b", "1": "b", "2": "b", "3": "b", "4": "b", "5": "b", "6": "b", "7": "b"}, "golden": {"2": "g", "5": "g"}, "clone": {"5": "c", "6": "c"}};
let ST = JSON.parse(JSON.stringify(INIT)), SEL = 3, MOD = false;
const g = id => document.getElementById(id);
function rd(c){ for (let d = 0; d < 3; d++) { const L = LAYERS[d]; if (ST[L][c] !== undefined) return [d, L, ST[L][c]]; } }
g("wr").onclick = () => { ST.clone[SEL] = "c"; draw(`írás C${SEL}-re: a cluster a clone rétegbe kerül (copy-on-write); a backing rétegek nem változnak.`); };
g("mg").onclick = () => { const before = rd(3); ST.golden[3] = "g'"; MOD = true; SEL = 3;
  draw(`TILOS: a golden C3 módosítva. A clone C3-olvasása eddig ${before[1]} (depth ${before[0]}) volt, most golden (depth 1) „g'” – a clone fájlja nem változott, a nézete igen; a clone C5 a régi golden C5-ből készült.`); };
g("rs").onclick = () => { ST = JSON.parse(JSON.stringify(INIT)); MOD = false; SEL = 3; draw(); };
function draw(extra){
  svg.setAttribute("viewBox", "0 0 640 300"); svg.innerHTML = ""; D();
  const x0 = 235, cw = 46, rh = 62, y0 = 70, hatch = {base: "url(#hatch)", golden: "url(#dots)", clone: css("--cell")};
  const r = rd(SEL);
  for (let c = 0; c < 8; c++) T(x0 + c*cw + 20, y0 + 3*rh - 2, "C" + c, {fs: 11, bold: c === SEL});
  LAYERS.forEach((L, d) => { const y = y0 + d*rh;
    T(x0 - 8, y + 18, FILES[L], {a: "end", fs: 10}); T(x0 - 8, y + 34, `${L} – depth ${d}`, {a: "end", fs: 10, fill: css("--muted")});
    for (let c = 0; c < 8; c++) { const has = ST[L][c] !== undefined, hit = r && c === SEL && r[0] === d;
      const box = R(x0 + c*cw, y, 40, 44, {rx: 2, fill: has ? hatch[L] : css("--cell"), sw: hit ? 3.5 : (has ? 1.6 : 0.7), dash: has ? "" : "2 3", stroke: hit ? css("--hl") : css("--line")});
      box.setAttribute("tabindex", "0"); box.setAttribute("role", "button"); box.setAttribute("aria-label", `C${c} ${L}`); box.style.cursor = "pointer";
      const pick = () => { SEL = c; draw(); };
      box.addEventListener("click", pick); box.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      if (has) { R(x0 + c*cw + 10, y + 12, 20, 20, {rx: 3, fill: css("--bg"), stroke: "none"}); T(x0 + c*cw + 20, y + 27, ST[L][c], {fs: 12, bold: 1}); }
      if (MOD && L === "golden" && c === 3) X(x0 + c*cw + 20, y + 22, 18);
    } });
  if (r) { const x = x0 + SEL*cw + 20; A(x, 40, x, y0 + r[0]*rh - 2, {dash: "5 3", stroke: css("--hl"), m: "ahb", sw: 2}); }
  T(10, 282, "olvasás: az első réteg felülről, amelyben a cluster megvan; írás: mindig a clone-ba", {a: "start", fs: 10.5, fill: css("--muted")});
  status.textContent = (extra ? extra + " " : "") + `C${SEL} olvasása: ${r[1]} rétegből („${r[2]}”) – qemu-img map szerinti depth ${r[0]}.`;
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
