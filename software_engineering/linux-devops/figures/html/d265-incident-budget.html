<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lab-svc incidens: hibaarány és error budget</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><span>1. szakasz: <input id="s0" value="09:00" style="width:64px">–<input id="e0" value="09:05" style="width:64px"> <input id="r0" type="number" min="0" max="100" step="0.1" value="100" style="width:60px">%</span> <span>2. szakasz: <input id="s1" value="09:05" style="width:64px">–<input id="e1" value="09:20" style="width:64px"> <input id="r1" type="number" min="0" max="100" step="0.1" value="2" style="width:60px">%</span> <label>SLO <input id="slo" type="number" min="90" max="99.999" step="0.01" value="99" style="width:70px">%</label> <label>budget-ablak <input id="days" type="number" min="1" max="90" value="30" style="width:50px"> nap</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Felső panel: 5 perc 100%-os hiba, majd 15 perc 2%; alsó panel: a 30 napos budget kb. 1,2%-a fogy el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Számított modell, nem mérés. Budget = (1 − SLO) · ablak percben (99%, 30 nap → 432 perc-egyenérték). Az idővonal függőleges vonalaira kattintva az adott timeline-sor jelenik meg; a szakaszok hh:mm formában szerkeszthetők.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "09:00 Első 503, alert: lab-svc p95 hiba – eddig 0,00 perc-egyenérték = a budget 0,00%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 0, "t": 540, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:03 Diagnosis: DB connection exhausted – eddig 3,00 perc-egyenérték = a budget 0,69%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 1, "t": 543, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:05 Mitigation: max_connections 20, reload – eddig 5,00 perc-egyenérték = a budget 1,16%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 2, "t": 545, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:10 Redis BGSAVE hiba; disk pressure – eddig 5,10 perc-egyenérték = a budget 1,18%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 3, "t": 550, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:12 Cleanup: bigfile.bin törlése – eddig 5,14 perc-egyenérték = a budget 1,19%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 4, "t": 552, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:20 Queue lag észlelés – eddig 5,30 perc-egyenérték = a budget 1,23%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 5, "t": 560, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:25 Consumer restart – eddig 5,30 perc-egyenérték = a budget 1,23%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 6, "t": 565, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:40 PITR restore teszt és data smoke test – eddig 5,30 perc-egyenérték = a budget 1,23%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 7, "t": 580, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}, {"msg": "09:45 Utóteszt: lab-api p95 < 200 ms – eddig 5,30 perc-egyenérték = a budget 1,23%-a (budget 432,0 perc). Teljes incidens: 1,23%; 09:00–09:30 ablak hibaaránya 17,7% > SLO-küszöb: sérült.", "i": 8, "t": 585, "segs": [[540, 545, 1.0], [545, 560, 0.02]], "budget": 432.0000000000004, "slo": 0.99}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const EV = [["09:00", "Első 503, alert: lab-svc p95 hiba", null], ["09:03", "Diagnosis: DB connection exhausted", "A"], ["09:05", "Mitigation: max_connections 20, reload", "B"], ["09:10", "Redis BGSAVE hiba; disk pressure", null], ["09:12", "Cleanup: bigfile.bin törlése", "C"], ["09:20", "Queue lag észlelés", null], ["09:25", "Consumer restart", "D"], ["09:40", "PITR restore teszt és data smoke test", "E"], ["09:45", "Utóteszt: lab-api p95 < 200 ms", null]], T0 = 535, T1 = 590;
function mm(s){ const p = s.split(":"); return (+p[0]) * 60 + (+p[1]); }
function f2(t){ return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); }
function burnedAt(t, segs){ let s = 0; for (let m = T0 - 60; m < t; m++) { let r = 0; segs.forEach(g => { if (m >= g[0] && m < g[1]) r = Math.max(r, g[2]); }); s += r; } return s; }
function readSegs(){ const out = [];
  for (let i = 0; i < 2; i++) { const a = mm(document.getElementById("s" + i).value), b = mm(document.getElementById("e" + i).value), r = (+document.getElementById("r" + i).value) / 100;
    if (b > a) out.push([a, b, r]); } return out; }
function build(){
  const segs = readSegs(), slo = (+document.getElementById("slo").value) / 100, days = +document.getElementById("days").value;
  const budget = (1 - slo) * days * 1440, w = (burnedAt(570, segs) - burnedAt(540, segs)) / 30;
  return EV.map((e, i) => { const t = mm(e[0]), b = burnedAt(t, segs);
    return {msg: e[0] + " " + e[1] + " – eddig " + hu(b, 2) + " perc-egyenérték = a budget " + hu(budget > 0 ? b / budget * 100 : 0, 2) + "%-a (budget " + hu(budget, 1) + " perc). "
      + "Teljes incidens: " + hu(burnedAt(T1, segs) / budget * 100, 2) + "%; 09:00–09:30 ablak hibaaránya " + hu(w * 100, 1) + "% " + (w > 1 - slo ? "> SLO-küszöb: sérült." : "≤ SLO-küszöb."),
      i: i, t: t, segs: segs, budget: budget, slo: slo}; });
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = ""; defs0();
  const x0 = 70, W = 600, X = t => x0 + (t - T0) * W / (T1 - T0);
  const Y1 = r => 120 - Math.min(1, r) * 100 - (r > 0 ? 0 : 0), lim = 1 - s.slo;
  L(x0, 120, x0 + W, 120); L(x0, 20, x0, 120); T(x0 - 6, 24, "100%", {"font-size": 10, "text-anchor": "end"}); T(x0 - 6, 124, "0", {"font-size": 10, "text-anchor": "end"});
  let d = "M " + X(T0) + " 120";
  for (let t = T0; t < T1; t++) { const r = s.segs.reduce((a, g) => (t >= g[0] && t < g[1]) ? Math.max(a, g[2]) : a, 0); d += " L " + X(t) + " " + Y1(r) + " L " + X(t + 1) + " " + Y1(r); }
  el("path", {d: d, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  L(x0, Y1(lim), x0 + W, Y1(lim), {"stroke-dasharray": "6 4"}); T(x0 + W, Y1(lim) - 4, "SLO-küszöb " + hu(lim * 100, 2) + "%", {"font-size": 10, "text-anchor": "end"});
  T(x0 - 6, 70, "hiba", {"font-size": 10, "text-anchor": "end"});
  const top = Math.max(1.5, burnedAt(T1, s.segs) / s.budget * 100 * 1.15), Y2 = p => 280 - p / top * 130;
  L(x0, 280, x0 + W, 280); L(x0, 150, x0, 280); T(x0 - 6, 154, hu(top, 1) + "%", {"font-size": 10, "text-anchor": "end"}); T(x0 - 6, 284, "0", {"font-size": 10, "text-anchor": "end"});
  T(x0 - 6, 215, "budget", {"font-size": 10, "text-anchor": "end"});
  let d2 = ""; for (let t = T0; t <= T1; t++) d2 += (t === T0 ? "M " : " L ") + X(t) + " " + Y2(burnedAt(t, s.segs) / s.budget * 100);
  el("path", {d: d2, fill: "none", stroke: css("--fg"), "stroke-width": 2});
  for (let t = T0; t <= T1; t += 5) { L(X(t), 280, X(t), 285); T(X(t), 298, f2(t), {"font-size": 10, "text-anchor": "middle"}); }
  EV.forEach((e, i) => { const t = mm(e[0]), on = i === s.i;
    const ln = L(X(t), 20, X(t), 280, {"stroke-dasharray": "2 3", stroke: on ? css("--hl") : css("--muted"), "stroke-width": on ? 2.5 : 1});
    const hit = el("rect", {x: X(t) - 6, y: 20, width: 12, height: 260, fill: "transparent", style: "cursor:pointer"});
    hit.addEventListener("click", () => { stop(); show(i); });
    if (e[2]) T(X(t) + 2, 145, e[2], {"font-size": 11, "font-weight": "bold"}); });
  const b = burnedAt(s.t, s.segs) / s.budget * 100; el("circle", {cx: X(s.t), cy: Y2(b), r: 5, fill: css("--hl")});
  T(x0, 322, EV[s.i][0] + " – " + EV[s.i][1], {"font-size": 12, "font-weight": "bold", fill: css("--hl")});
}
function upd(){ const kk = k; setSteps(build()); show(kk); }
["s0", "e0", "r0", "s1", "e1", "r1", "slo", "days"].forEach(id => document.getElementById(id).addEventListener("change", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
