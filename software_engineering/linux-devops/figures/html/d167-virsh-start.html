<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>virsh start: control és data path</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="perr"> hiba: /dev/kvm permission</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram öt életvonallal: virsh (labuser), virtqemud/libvirtd (root), qemu-system-x86_64 (libvirt-qemu), KVM, host I/O; kilenc üzenet a VM indításától a KVM_RUN ciklusig."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szaggatott: control path; vastag folytonos: data path (a libvirt daemonon nem halad át). A KVM-ioctl-ok jogosultsága a /dev/kvm megnyitásán múlik; CAP_SYS_ADMIN nem kell.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"i": 0, "msg": "1/9: virsh (labuser) → virtqemud / libvirtd: API-hívás (virDomainCreate) – Unix socket /var/run/libvirt/virtqemud-sock [control; lista 1. pont]", "line": -1}, {"i": 1, "msg": "2/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: név → UUID → /etc/libvirt/qemu/labdemo.xml – daemon belső állapot [control; lista 2. pont]", "line": -1}, {"i": 2, "msg": "3/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: XML-validálás, jogosultság (libvirt csoport / polkit) – daemon [control; lista 3. pont]", "line": -1}, {"i": 3, "msg": "4/9: virtqemud / libvirtd (root) → qemu-system-x86_64: QEMU-parancssor, fork/exec; QMP monitor socket – fork/exec, setuid libvirt-qemu [control; lista 4. pont]", "line": -1}, {"i": 4, "msg": "5/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): open(/dev/kvm) – fájljog: crw-rw---- root:kvm [control; lista 5. pont]", "line": -1}, {"i": 5, "msg": "6/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): KVM_CREATE_VM, KVM_CREATE_VCPU, memória – ioctl [control; lista 5. pont]", "line": -1}, {"i": 6, "msg": "7/9: qemu-system-x86_64 (libvirt-qemu) → qemu-system-x86_64: firmware betöltése a vendég memóriába – QEMU [control; lista 6. pont]", "line": -1}, {"i": 7, "msg": "8/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): KVM_RUN ciklus (vCPU szál) – ioctl [data; lista 7. pont]", "line": -1}, {"i": 8, "msg": "9/9: qemu-system-x86_64 (libvirt-qemu) → host I/O: VM exit → QEMU device model → pwrite / sendmsg – KVM_RUN visszatér (KVM_EXIT_IO / MMIO), majd syscall [data; lista 7. pont]", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}

const M = [[0, 1, "API-hívás (virDomainCreate)", "control", "Unix socket /var/run/libvirt/virtqemud-sock", 1], [1, 1, "név → UUID → /etc/libvirt/qemu/labdemo.xml", "control", "daemon belső állapot", 2], [1, 1, "XML-validálás, jogosultság (libvirt csoport / polkit)", "control", "daemon", 3], [1, 2, "QEMU-parancssor, fork/exec; QMP monitor socket", "control", "fork/exec, setuid libvirt-qemu", 4], [2, 3, "open(/dev/kvm)", "control", "fájljog: crw-rw---- root:kvm", 5], [2, 3, "KVM_CREATE_VM, KVM_CREATE_VCPU, memória", "control", "ioctl", 5], [2, 2, "firmware betöltése a vendég memóriába", "control", "QEMU", 6], [2, 3, "KVM_RUN ciklus (vCPU szál)", "data", "ioctl", 7], [2, 4, "VM exit → QEMU device model → pwrite / sendmsg", "data", "KVM_RUN visszatér (KVM_EXIT_IO / MMIO), majd syscall", 7]], L = [["virsh", "labuser"], ["virtqemud / libvirtd", "root"], ["qemu-system-x86_64", "libvirt-qemu"], ["KVM (/dev/kvm)", "kernel"], ["host I/O", "fájl / hálózat"]], OKS = [{"i": 0, "msg": "1/9: virsh (labuser) → virtqemud / libvirtd: API-hívás (virDomainCreate) – Unix socket /var/run/libvirt/virtqemud-sock [control; lista 1. pont]", "line": -1}, {"i": 1, "msg": "2/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: név → UUID → /etc/libvirt/qemu/labdemo.xml – daemon belső állapot [control; lista 2. pont]", "line": -1}, {"i": 2, "msg": "3/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: XML-validálás, jogosultság (libvirt csoport / polkit) – daemon [control; lista 3. pont]", "line": -1}, {"i": 3, "msg": "4/9: virtqemud / libvirtd (root) → qemu-system-x86_64: QEMU-parancssor, fork/exec; QMP monitor socket – fork/exec, setuid libvirt-qemu [control; lista 4. pont]", "line": -1}, {"i": 4, "msg": "5/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): open(/dev/kvm) – fájljog: crw-rw---- root:kvm [control; lista 5. pont]", "line": -1}, {"i": 5, "msg": "6/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): KVM_CREATE_VM, KVM_CREATE_VCPU, memória – ioctl [control; lista 5. pont]", "line": -1}, {"i": 6, "msg": "7/9: qemu-system-x86_64 (libvirt-qemu) → qemu-system-x86_64: firmware betöltése a vendég memóriába – QEMU [control; lista 6. pont]", "line": -1}, {"i": 7, "msg": "8/9: qemu-system-x86_64 (libvirt-qemu) → KVM (/dev/kvm): KVM_RUN ciklus (vCPU szál) – ioctl [data; lista 7. pont]", "line": -1}, {"i": 8, "msg": "9/9: qemu-system-x86_64 (libvirt-qemu) → host I/O: VM exit → QEMU device model → pwrite / sendmsg – KVM_RUN visszatér (KVM_EXIT_IO / MMIO), majd syscall [data; lista 7. pont]", "line": -1}], BADS = [{"i": 0, "msg": "1/9: virsh (labuser) → virtqemud / libvirtd: API-hívás (virDomainCreate) – Unix socket /var/run/libvirt/virtqemud-sock [control; lista 1. pont]", "line": -1}, {"i": 1, "msg": "2/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: név → UUID → /etc/libvirt/qemu/labdemo.xml – daemon belső állapot [control; lista 2. pont]", "line": -1}, {"i": 2, "msg": "3/9: virtqemud / libvirtd (root) → virtqemud / libvirtd: XML-validálás, jogosultság (libvirt csoport / polkit) – daemon [control; lista 3. pont]", "line": -1}, {"i": 3, "msg": "4/9: virtqemud / libvirtd (root) → qemu-system-x86_64: QEMU-parancssor, fork/exec; QMP monitor socket – fork/exec, setuid libvirt-qemu [control; lista 4. pont]", "line": -1}, {"i": 4, "msg": "5/9: qemu-system-x86_64 (libvirt-qemu) → open(/dev/kvm) – fájljog: EACCES. A QEMU leáll: „Could not access KVM kernel module: Permission denied”. Javítás: a /dev/kvm jogosultsága (udev, kvm csoport), nem CAP_SYS_ADMIN.", "line": -1, "err": true}];
document.getElementById("perr").addEventListener("change", e => setSteps(e.target.checked ? BADS : OKS));
function render(s){
  svg.setAttribute("viewBox", "0 0 640 430"); svg.innerHTML = ""; D();
  const XP = [60, 190, 330, 470, 590];
  [[0,1,"socket + polkit"],[1,2,"root → libvirt-qemu"],[2,3,"user / kernel"]].forEach(([a, b, t]) => {
    const xm = (XP[a] + XP[b]) / 2; R(xm - 4, 50, 8, 360, {rx: 0, fill: css("--cellhl"), stroke: "none"});
    T(xm, 424, t, {fs: 9.5, fill: css("--muted")}); });
  L.forEach((l, i) => { R(XP[i] - 58, 6, 116, 36, {fill: css("--cell")}); T(XP[i], 21, l[0], {fs: 10.5, bold: 1}); T(XP[i], 36, "(" + l[1] + ")", {fs: 9.5, fill: css("--muted")});
    A(XP[i], 42, XP[i], 408, {noh: 1, dash: "2 3", sw: 1, stroke: css("--muted")}); });
  M.forEach((m, i) => { const y = 66 + i * 38, on = i === s.i, past = i < s.i, vis = past || on;
    const col = on ? (s.err ? css("--hl2") : css("--hl")) : (vis ? css("--fg") : css("--muted"));
    const op = vis ? 1 : 0.35, dash = m[3] === "control" ? "6 4" : "", sw = m[3] === "control" ? 1.6 : 3;
    const g0 = svg.childNodes.length;
    if (m[0] === m[1]) { el("path", {d: `M${XP[m[0]]} ${y-6} h26 v14 h-22`, fill: "none", stroke: col, "stroke-width": sw, "stroke-dasharray": dash, "marker-end": "url(#ah)"}); }
    else A(XP[m[0]], y, XP[m[1]] - (on && s.err ? 70 : 0), y, {stroke: col, sw: sw, dash: dash, m: on ? (s.err ? "ahh" : "ahb") : "ah"});
    const tx = m[0] === m[1] ? XP[m[0]] + 34 : (XP[m[0]] + XP[m[1]]) / 2, an = m[0] === m[1] ? "start" : "middle";
    T(tx, y - 5, `${i + 1}. ${m[2]}`, {a: an, fs: 10, bold: on, fill: on ? col : undefined});
    if (on && s.err) X(XP[m[1]] - 60, y, 9);
    for (let j = g0; j < svg.childNodes.length; j++) svg.childNodes[j].setAttribute("opacity", op);
  });
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
