<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopponkénti keret-átírás és szomszédfeloldás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>

</div>

  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A keret cél-MAC-je A oldalán a router lab-r0 címe; a router új keretet készít a lab-b0 felé, az IP-címpár marad, a TTL 64-ről 63-ra csökken."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.3.5 labor várt lépései; a MAC-címek szimbolikusak, a tcpdump-sorok várt formájúak (nem futtatott capture). Az IPv6-továbbítás a laborban külön sysctl (net.ipv6.conf.all.forwarding).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "msg": "1) A: ip route get 10.118.2.2 → 10.118.2.2 via 10.118.1.1 dev lab-a0 src 10.118.1.2: a next hop 10.118.1.1 (R), nem B.", "link": null, "frame": null, "hl": [], "tcp": "(nincs csomag)", "nA": {}, "nR": {}, "nB": {}}, {"line": -1, "msg": "2) A neigh: 10.118.1.1 INCOMPLETE – a next hop linkcíme még ismeretlen.", "link": null, "frame": null, "hl": [], "tcp": "(várakozó csomag)", "nA": {"10.118.1.1": "INCOMPLETE"}, "nR": {}, "nB": {}}, {"line": -1, "msg": "3) ARP who-has 10.118.1.1 tell 10.118.1.2 – szórás (ff:ff:ff:ff:ff:ff).", "link": "AR", "frame": {"dst": "ff:ff:ff:ff:ff:ff", "src": "MAC-A0", "ip": "ARP", "ttl": "–"}, "hl": ["dst"], "tcp": "MAC-A0 > ff:ff:ff:ff:ff:ff, ethertype ARP (0x0806), length 42: Request who-has 10.118.1.1 tell 10.118.1.2", "nA": {"10.118.1.1": "INCOMPLETE"}, "nR": {}, "nB": {}}, {"line": -1, "msg": "4) ARP reply: 10.118.1.1 is-at MAC-R0 → A neigh REACHABLE (R megtanulja A-t: STALE).", "link": "RA", "frame": {"dst": "MAC-A0", "src": "MAC-R0", "ip": "ARP", "ttl": "–"}, "hl": [], "tcp": "MAC-R0 > MAC-A0, ethertype ARP (0x0806), length 42: Reply 10.118.1.1 is-at MAC-R0", "nA": {"10.118.1.1": "MAC-R0 REACHABLE"}, "nR": {"10.118.1.2": "MAC-A0 STALE"}, "nB": {}}, {"line": -1, "msg": "5) Echo Request: Ethernet MAC-A0 → MAC-R0, IP 10.118.1.2 → 10.118.2.2, TTL 64.", "link": "AR", "frame": {"dst": "MAC-R0", "src": "MAC-A0", "ip": "10.118.1.2 → 10.118.2.2", "ttl": "64"}, "hl": ["dst", "ttl"], "tcp": "MAC-A0 > MAC-R0, ethertype IPv4 (0x0800): 10.118.1.2 > 10.118.2.2: ICMP echo request, ttl 64", "nA": {"10.118.1.1": "MAC-R0 REACHABLE"}, "nR": {"10.118.1.2": "MAC-A0 STALE"}, "nB": {}}, {"line": -1, "msg": "6) R: route lookup 10.118.2.0/24 dev lab-r1 (közvetlen); ARP who-has 10.118.2.2 a lab-r1-en → MAC-B0.", "link": "RB", "frame": {"dst": "ff:ff:ff:ff:ff:ff", "src": "MAC-R1", "ip": "ARP", "ttl": "–"}, "hl": [], "tcp": "MAC-R1 > ff:ff:ff:ff:ff:ff, ethertype ARP (0x0806), length 42: Request who-has 10.118.2.2 tell 10.118.2.1", "nA": {"10.118.1.1": "MAC-R0 REACHABLE"}, "nR": {"10.118.1.2": "MAC-A0 STALE", "10.118.2.2": "MAC-B0 REACHABLE"}, "nB": {"10.118.2.1": "MAC-R1 STALE"}}, {"line": -1, "msg": "7) R új keretet készít: MAC-R1 → MAC-B0, IP 10.118.1.2 → 10.118.2.2 VÁLTOZATLAN, TTL 63, az IPv4-fejléc-ellenőrzőösszeg frissítve.", "link": "RB", "frame": {"dst": "MAC-B0", "src": "MAC-R1", "ip": "10.118.1.2 → 10.118.2.2", "ttl": "63"}, "hl": ["dst", "src", "ttl"], "tcp": "MAC-R1 > MAC-B0, ethertype IPv4 (0x0800): 10.118.1.2 > 10.118.2.2: ICMP echo request, ttl 63", "nA": {"10.118.1.1": "MAC-R0 REACHABLE"}, "nR": {"10.118.1.2": "MAC-A0 STALE", "10.118.2.2": "MAC-B0 REACHABLE"}, "nB": {"10.118.2.1": "MAC-R1 STALE"}}, {"line": -1, "msg": "8) Echo Reply visszafelé: B saját route-jával (10.118.2.1 a next hop), R újra keretet cserél (MAC-R0 → MAC-A0).", "link": "BA", "frame": {"dst": "MAC-R1", "src": "MAC-B0", "ip": "10.118.2.2 → 10.118.1.2", "ttl": "64"}, "hl": ["ip"], "tcp": "MAC-B0 > MAC-R1: 10.118.2.2 > 10.118.1.2: ICMP echo reply", "nA": {"10.118.1.1": "MAC-R0 REACHABLE"}, "nR": {"10.118.1.2": "MAC-A0 STALE", "10.118.2.2": "MAC-B0 REACHABLE"}, "nB": {"10.118.2.1": "MAC-R1 STALE"}}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let FAM = 4;
function render(s){
  svg.setAttribute("viewBox", "0 0 640 360");
  svg.innerHTML = "";
  const X = {A:20, R:250, B:480}, W = 140;
  [["A","lab-a"],["R","lab-r"],["B","lab-b"]].forEach(([k, n]) => {
    el("rect", {x:X[k], y:14, width:W, height:46, rx:8, fill: css("--cell"), stroke: css("--line"), "stroke-width":1.5});
    el("text", {x:X[k]+W/2, y:42, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, n);
  });
  el("line", {x1:160, y1:37, x2:250, y2:37, stroke: css("--line"), "stroke-width":3});
  el("line", {x1:390, y1:37, x2:480, y2:37, stroke: css("--line"), "stroke-width":3});
  const arr = {AR:[160,250], RA:[250,160], RB:[390,480], BA:[480,390]}[s.link];
  if (arr) { const [a, b] = arr, d = b > a ? 1 : -1; el("line", {x1:a, y1:72, x2:b, y2:72, stroke: css("--hl"), "stroke-width":3}); el("polygon", {points:`${b},72 ${b-9*d},66 ${b-9*d},78`, fill: css("--hl")}); }
  if (s.link === "R") el("text", {x:320, y:80, "text-anchor":"middle", "font-size":13, "font-weight":"bold", fill: css("--hl2")}, "✕ eldobva R-en");
  if (s.frame) {
    const rows = [["cél-MAC", s.frame.dst, "dst"], ["forrás-MAC", s.frame.src, "src"], ["IP", s.frame.ip, "ip"], [FAM === 4 ? "TTL" : "Hop Limit", s.frame.ttl, "ttl"]];
    rows.forEach(([k, v, id], i) => { const on = s.hl.indexOf(id) >= 0; el("rect", {x:160, y:92+i*26, width:320, height:22, fill: on ? css("--cellhl") : css("--bg"), stroke: on ? css("--hl") : css("--line"), "stroke-width": on ? 2.5 : 0.8}); el("text", {x:168, y:108+i*26, "font-size":11.5, "font-family":"ui-monospace,monospace"}, k + ": " + v); });
  }
  [["A", s.nA], ["R", s.nR], ["B", s.nB]].forEach(([k, t], j) => {
    const x = 10 + j*210;
    el("text", {x:x, y:216, "font-size":11.5, "font-weight":"bold"}, "lab-" + k.toLowerCase() + " neigh");
    const ent = Object.entries(t);
    if (!ent.length) el("text", {x:x, y:234, "font-size":10.5, fill: css("--muted")}, "(üres)");
    ent.forEach(([ip, st], i) => el("text", {x:x, y:234 + i*16, "font-size":10, "font-family":"ui-monospace,monospace"}, ip + " " + st));
  });
  el("text", {x:10, y:300, "font-size":11, "font-weight":"bold"}, "tcpdump -n -e (illusztratív):");
  const t = s.tcp, cut = t.length > 96 ? t.lastIndexOf(" ", 96) : -1;
  el("text", {x:10, y:318, "font-size":10, "font-family":"ui-monospace,monospace"}, cut > 0 ? t.slice(0, cut) : t);
  if (cut > 0) el("text", {x:22, y:334, "font-size":10, "font-family":"ui-monospace,monospace"}, t.slice(cut + 1));
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
