<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ack-lánc és hibapontok a lab-orders queue-n</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>összeomlás: <select id="crash"><option value="none">nincs</option><option value="A">A: COMMIT előtt</option><option value="B">B: COMMIT után, ack előtt</option><option value="C">C: kézbesítés után</option><option value="poison">poison üzenet (mindig hiba)</option></select></label> <label><input type="checkbox" id="aa"> auto-ack</label> <label><input type="checkbox" id="dd" checked> dedup kulcs</label> <label><input type="checkbox" id="rq" checked> requeue=true</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Producer–queue–fogyasztó–adatbázis–ack lánc; a DB-commit és az ack közötti összeomlás duplikátumot, az auto-ack melletti összeomlás veszteséget okoz."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Logikai modell a kidolgozott példa neveivel, nem futtatott broker. A quorum queue a kézbesítéseket számolja (x-delivery-count), és a delivery-limitet meghaladó visszaadás után dead-letterel; a pontos viselkedést az adott RabbitMQ-verzió dokumentációjával ellenőrizd.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"ready": 1, "unacked": 0, "deliv": 0, "events": 0, "dlq": 0, "msg": "1. publish: persistent üzenet a lab-orders queue-ba (amq.default, routing_key=lab-orders).", "line": 0, "node": "q", "out": "", "xdc": 0}, {"ready": 1, "unacked": 0, "deliv": 0, "events": 0, "dlq": 0, "msg": "2. publisher confirm: a broker (quorum: a többség) tartósan átvette – a producer kész.", "line": 0, "node": "q", "out": "", "xdc": 0}, {"ready": 0, "unacked": 1, "deliv": 1, "events": 0, "dlq": 0, "msg": "3. kézbesítés manual ack-kal: messages_unacknowledged = 1.", "line": 1, "node": "c", "out": "", "xdc": 0}, {"ready": 0, "unacked": 1, "deliv": 1, "events": 1, "dlq": 0, "msg": "4. DB-tranzakció: INSERT + dedup kulcs, COMMIT → order_events 1 sor.", "line": 3, "node": "db", "out": "", "xdc": 0}, {"ready": 0, "unacked": 0, "deliv": 1, "events": 1, "dlq": 0, "msg": "5. basic.ack → lab-orders 0 0 (OK).", "line": 4, "node": "ok", "out": "OK", "xdc": 0}, {"ready": 0, "unacked": 0, "deliv": 1, "events": 1, "dlq": 0, "msg": "6. nincs újrakézbesítés; 1 kézbesítés, order_events 1 sor.", "line": 4, "node": "ok", "out": "OK", "xdc": 0}, {"ready": 0, "unacked": 0, "deliv": 1, "events": 1, "dlq": 0, "msg": "7. delivery-limit nem érintett; 1 kézbesítés, order_events 1 sor.", "line": 4, "node": "ok", "out": "OK", "xdc": 0}, {"ready": 0, "unacked": 0, "deliv": 1, "events": 1, "dlq": 0, "msg": "8. DLQ üres; 1 kézbesítés, order_events 1 sor.", "line": 4, "node": "ok", "out": "OK", "xdc": 0}];
const CODE = ["publish(amq.default, 'lab-orders', delivery_mode=2); wait publisher confirm", "msg = deliver('lab-orders')          // manual ack: unacked = 1", "BEGIN; INSERT INTO order_events ... ON CONFLICT (order_id) DO NOTHING", "COMMIT                               // tartós side effect", "ch.ack(msg.delivery_tag)             // basic.ack: törlés a queue-ból", "catch: ch.nack(tag, requeue)         // quorum: x-delivery-count++", "x-delivery-count > delivery-limit → lab-dlx → lab-orders.dlq"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

function sim(crash, autoAck, dedup, requeue){
  const st = {ready: 0, unacked: 0, deliv: 0, events: 0, dlq: 0}, steps = [];
  function push(msg, line, node, out){ const s = Object.assign({}, st); Object.assign(s, {msg: msg, line: line, node: node, out: out || "", xdc: Math.max(0, st.deliv - 1)}); steps.push(s); }
  function deliver(){ st.deliv += 1; st.ready = 0; st.unacked = autoAck ? 0 : 1; }
  st.ready = 1;
  push("1. publish: persistent üzenet a lab-orders queue-ba (amq.default, routing_key=lab-orders).", 0, "q");
  push("2. publisher confirm: a broker (quorum: a többség) tartósan átvette – a producer kész.", 0, "q");
  if (crash === "poison") {
    deliver(); push("3. kézbesítés: a feldolgozás kivételt dob (hibás payload).", 1, "c");
    if (autoAck) { while (steps.length < 8) push((steps.length + 1) + ". auto-ack: a broker már törölte, a nack hatástalan – nincs DLQ, nincs sor → veszteség.", -1, "x", "veszteség"); return steps; }
    if (!requeue) { st.unacked = 0; st.dlq = 1; push("4. basic.nack(requeue=false) → azonnal lab-dlx-re kerül.", 5, "dlx");
      for (let i = 5; i < 9; i++) push(i + ". a DLQ-ban 1 üzenet; nincs újrakézbesítés.", 6, "dlq", "DLQ (requeue=false)"); return steps; }
    st.unacked = 0; st.ready = 1; push("4. basic.nack(requeue=true) → vissza a queue-ba, x-delivery-count = 1.", 5, "q");
    deliver(); st.unacked = 0; st.ready = 1; push("5. 2. kézbesítés, ismét hiba → nack, x-delivery-count = 2.", 5, "q");
    deliver(); deliver(); st.deliv = 4; st.unacked = 0; st.ready = 1; push("6. 3. és 4. kézbesítés, hiba → x-delivery-count = 4 > delivery-limit 3.", 5, "q");
    st.ready = 0; push("7. a quorum queue a limit túllépésekor dead-letterel: lab-dlx (routing key lab-orders).", 6, "dlx");
    st.dlq = 1; push("8. lab-orders.dlq: 1 üzenet, lab-orders üres; order_events: 0 sor.", 6, "dlq", "DLQ"); return steps;
  }
  deliver();
  if (autoAck) push("3. kézbesítés AUTO-ACK módban: a broker kézbesítéskor törli az üzenetet (unacked = 0).", 1, "c");
  else push("3. kézbesítés manual ack-kal: messages_unacknowledged = 1.", 1, "c");
  function crashRe(label, line){
    if (autoAck) { push(label + " – az üzenet auto-ack miatt már törölve: nincs mit újrakézbesíteni.", line, "x", "veszteség");
      while (steps.length < 8) push((steps.length + 1) + ". lab-orders üres, DLQ üres, order_events " + st.events + " sor → " + (st.events === 0 ? "ÜZENETVESZTÉS." : "a hibát senki nem látja (nincs újrapróba)."), -1, "x", "veszteség"); return false; }
    st.unacked = 0; st.ready = 1; push(label + " – a csatorna lezárul, a broker requeue-olja (ready = 1).", line, "q"); return true; }
  if (crash === "C") { if (!crashRe("4. (C) összeomlás kézbesítés után, a DB előtt", 1)) return steps;
    deliver(); push("5. 2. kézbesítés (redelivered, x-delivery-count = 1).", 1, "c");
    st.events += 1; push("6. DB-tranzakció + COMMIT: order_events 1 sor.", 3, "db");
    st.unacked = 0; push("7. basic.ack → a queue üres.", 4, "q"); push("8. Eredmény: 2 kézbesítés, 1 sor – OK (at-least-once).", 4, "ok", "OK"); return steps; }
  if (crash === "A") { push("4. (A) összeomlás a COMMIT előtt: a tranzakció rollback, order_events 0 sor.", 2, "db");
    if (!crashRe("5. a fogyasztó kiesett", 5)) return steps;
    deliver(); push("6. 2. kézbesítés (x-delivery-count = 1).", 1, "c");
    st.events += 1; push("7. DB-tranzakció + COMMIT: order_events 1 sor.", 3, "db");
    st.unacked = 0; push("8. basic.ack – 2 kézbesítés, 1 sor: nincs duplikátum (OK).", 4, "ok", "OK"); return steps; }
  st.events += 1; push("4. DB-tranzakció: INSERT + dedup kulcs, COMMIT → order_events 1 sor.", 3, "db");
  if (crash === "B") { if (!crashRe("5. (B) összeomlás a COMMIT után, az ack ELŐTT", 4)) return steps;
    deliver(); push("6. 2. kézbesítés (x-delivery-count = 1): DUPLIKÁTUM érkezik.", 1, "c");
    let out;
    if (dedup) { push("7. INSERT ... ON CONFLICT DO NOTHING: a dedup kulcs elnyeli, order_events marad 1.", 2, "db"); out = "duplikátum, elnyelve"; }
    else { st.events += 1; push("7. dedup kulcs nélkül a második INSERT is lefut: order_events 2 sor!", 2, "db"); out = "duplikált üzleti művelet"; }
    st.unacked = 0; push("8. basic.ack – 2 kézbesítés, " + st.events + " sor: " + out + ".", 4, "ok", out); return steps; }
  st.unacked = 0; push("5. basic.ack → lab-orders 0 0 (OK).", 4, "ok", "OK");
  [[6, "nincs újrakézbesítés"], [7, "delivery-limit nem érintett"], [8, "DLQ üres"]].forEach(p => push(p[0] + ". " + p[1] + "; 1 kézbesítés, order_events 1 sor.", 4, "ok", "OK"));
  return steps;
}

function render(s){
  svg.setAttribute("viewBox", "0 0 700 300"); svg.innerHTML = ""; defs0();
  const N = {p: [10, 40, 80, "producer"], q: [180, 40, 120, "lab-orders\n(quorum, limit 3)"], c: [350, 40, 120, "OrderProcessor"],
             db: [520, 40, 150, "PostgreSQL\norder_events"], dlx: [180, 150, 120, "lab-dlx"], dlq: [10, 150, 140, "lab-orders.dlq"]};
  const hot = {q: "q", c: "c", db: "db", dlx: "dlx", dlq: "dlq", ok: "q", x: "c"}[s.node];
  for (const k in N) { const n = N[k], on = k === hot;
    R(n[0], n[1], n[2], 50, {fill: k === "dlq" ? "url(#hat)" : css("--cell"), "stroke-width": on ? 3.5 : 1.2, stroke: on ? css("--hl") : css("--line")});
    T(n[0] + n[2] / 2, n[1] + (n[3].includes("\n") ? 21 : 30), n[3], {"font-size": 12, "text-anchor": "middle"}); }
  A(90, 65, 178, 65); A(300, 65, 348, 65); A(470, 65, 518, 65);
  el("path", {d: "M 410 92 Q 330 135 250 92", fill: "none", stroke: css("--line"), "stroke-dasharray": "6 4", "marker-end": "url(#ar)"});
  T(330, 128, "redelivery", {"font-size": 11, "text-anchor": "middle"});
  A(240, 92, 240, 148, {"stroke-dasharray": "2 3"}); A(180, 175, 152, 175, {"stroke-dasharray": "2 3"});
  if (s.node === "x") XM(410, 30, 12);
  const rows = [["lab-orders messages_ready", s.ready], ["messages_unacknowledged", s.unacked], ["kézbesítések", s.deliv],
                ["x-delivery-count", s.xdc], ["order_events sorok", s.events], ["lab-orders.dlq", s.dlq]];
  rows.forEach((r, i) => { T(340, 170 + i * 19, r[0], {"font-size": 12}); T(560, 170 + i * 19, String(r[1]), {"font-size": 12, "font-weight": "bold"}); });
  if (s.out) T(10, 250, "kimenet: " + s.out, {"font-size": 14, "font-weight": "bold", fill: s.out === "veszteség" || s.out.startsWith("duplikált") ? css("--hl2") : css("--hl")});
}
function upd(){ setSteps(sim(document.getElementById("crash").value, document.getElementById("aa").checked,
  document.getElementById("dd").checked, document.getElementById("rq").checked)); }
["crash", "aa", "dd", "rq"].forEach(id => document.getElementById(id).addEventListener("input", upd));


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1300);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
