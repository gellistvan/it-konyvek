<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boot-lánc: ellenőrzés és mérés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="radio" name="mode" value="ok" checked onchange="variant()"> alap</label><label><input type="radio" name="mode" value="module" onchange="variant()"> hibamód: aláíratlan modul</label><label><input type="radio" name="mode" value="bootorder" onchange="variant()"> hibamód: BootOrder 0000,0001</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Nyolclépéses boot-lánc: bekapcsolás, UEFI firmware, shim, GRUB, kernel, initramfs, ExitBootServices, userspace; alatta a Secure Boot ellenőrzése (az initramfs-nél nincs), a TPM-mérés és a BMC sávja."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A firmware a shimet, a shim a GRUB-ot és a kernelt ellenőrzi; az initramfs csak mérésre kerül (T-D1-094). A PCR-sorszámok illusztratívak és platformfüggők. A BootOrder/Boot#### értékek a 4.4.3 kidolgozott példájából.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"id": "power", "lab": "bekapcsolás", "sb": null, "pcr": null, "key": "—", "trace": "—", "msg": "1. Bekapcsolás: a CPU a firmware-ből indul; a BMC már ettől függetlenül fut.", "i": 0, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "fw", "lab": "UEFI firmware\n(Boot Services)", "sb": "root", "pcr": "0–7", "key": "PK/KEK/db/dbx (NVRAM)", "trace": "efibootmgr -v → BootOrder: 0001,0000", "msg": "2. UEFI firmware (Boot Services): a BootOrder 0001,0000 szerint a Boot0001* ubuntu …\\shimx64.efi bejegyzést indítja. A firmware saját kódját és beállításait PCR 0–7 méri.", "i": 1, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "shim", "lab": "shim\n(shimx64.efi)", "sb": "ok", "pcr": "4", "key": "db: Microsoft UEFI CA", "trace": "mokutil --sb-state → SecureBoot enabled", "msg": "3. shim: a firmware a db-ben lévő Microsoft-kulccsal ellenőrzi az aláírását; mérés PCR 4-be (EFI-alkalmazás).", "i": 2, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "grub", "lab": "GRUB\n(grubx64.efi)", "sb": "ok", "pcr": "4", "key": "shim: beépített Canonical-kulcs / MOK", "trace": "efibootmgr -v → …\\EFI\\ubuntu\\shimx64.efi", "msg": "4. GRUB: a shim a beépített Canonical-kulccsal (vagy MOK-kal) ellenőrzi; mérés PCR 4-be.", "i": 3, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "kernel", "lab": "kernel\n(vmlinuz)", "sb": "ok", "pcr": "8–9", "key": "shim-protokoll: Canonical-kulcs", "trace": "journalctl -k | grep -i 'secure boot'", "msg": "5. Kernel: a GRUB a shim-protokollon át ellenőrizteti (Canonical-aláírás); a GRUB méri a kernelt és a parancssort (PCR 8–9).", "i": 4, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "initrd", "lab": "initramfs", "sb": "no", "pcr": "9", "key": "nincs: a host generálja (update-initramfs)", "trace": "— (nincs aláírás; csak a mért lenyomat)", "msg": "6. initramfs: a GRUB betölti – NINCS aláírás-ellenőrzés (a hoston generált, aláíratlan fájl), csak mérés PCR 9-be.", "i": 5, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "ebs", "lab": "ExitBoot-\nServices", "sb": null, "pcr": null, "key": "—", "trace": "— (a kernel EFI-stubja hívja)", "msg": "7. ExitBootServices: a kernel EFI-stubja lezárja a Boot Services-t; innen csak a Runtime Services (pl. NVRAM-változók) érhető el.", "i": 6, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "user", "lab": "Linux userspace\n/ systemd", "sb": null, "pcr": null, "key": "—", "trace": "efibootmgr | grep BootOrder (Runtime Services)", "msg": "8. A kernel elindítja az initramfs /init-jét, majd a systemd-t. A Secure Boot innen nem véd: ez boot integrity, nem runtime védelem.", "i": 7, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const VAR = {"ok": [{"id": "power", "lab": "bekapcsolás", "sb": null, "pcr": null, "key": "—", "trace": "—", "msg": "1. Bekapcsolás: a CPU a firmware-ből indul; a BMC már ettől függetlenül fut.", "i": 0, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "fw", "lab": "UEFI firmware\n(Boot Services)", "sb": "root", "pcr": "0–7", "key": "PK/KEK/db/dbx (NVRAM)", "trace": "efibootmgr -v → BootOrder: 0001,0000", "msg": "2. UEFI firmware (Boot Services): a BootOrder 0001,0000 szerint a Boot0001* ubuntu …\\shimx64.efi bejegyzést indítja. A firmware saját kódját és beállításait PCR 0–7 méri.", "i": 1, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "shim", "lab": "shim\n(shimx64.efi)", "sb": "ok", "pcr": "4", "key": "db: Microsoft UEFI CA", "trace": "mokutil --sb-state → SecureBoot enabled", "msg": "3. shim: a firmware a db-ben lévő Microsoft-kulccsal ellenőrzi az aláírását; mérés PCR 4-be (EFI-alkalmazás).", "i": 2, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "grub", "lab": "GRUB\n(grubx64.efi)", "sb": "ok", "pcr": "4", "key": "shim: beépített Canonical-kulcs / MOK", "trace": "efibootmgr -v → …\\EFI\\ubuntu\\shimx64.efi", "msg": "4. GRUB: a shim a beépített Canonical-kulccsal (vagy MOK-kal) ellenőrzi; mérés PCR 4-be.", "i": 3, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "kernel", "lab": "kernel\n(vmlinuz)", "sb": "ok", "pcr": "8–9", "key": "shim-protokoll: Canonical-kulcs", "trace": "journalctl -k | grep -i 'secure boot'", "msg": "5. Kernel: a GRUB a shim-protokollon át ellenőrizteti (Canonical-aláírás); a GRUB méri a kernelt és a parancssort (PCR 8–9).", "i": 4, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "initrd", "lab": "initramfs", "sb": "no", "pcr": "9", "key": "nincs: a host generálja (update-initramfs)", "trace": "— (nincs aláírás; csak a mért lenyomat)", "msg": "6. initramfs: a GRUB betölti – NINCS aláírás-ellenőrzés (a hoston generált, aláíratlan fájl), csak mérés PCR 9-be.", "i": 5, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "ebs", "lab": "ExitBoot-\nServices", "sb": null, "pcr": null, "key": "—", "trace": "— (a kernel EFI-stubja hívja)", "msg": "7. ExitBootServices: a kernel EFI-stubja lezárja a Boot Services-t; innen csak a Runtime Services (pl. NVRAM-változók) érhető el.", "i": 6, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "user", "lab": "Linux userspace\n/ systemd", "sb": null, "pcr": null, "key": "—", "trace": "efibootmgr | grep BootOrder (Runtime Services)", "msg": "8. A kernel elindítja az initramfs /init-jét, majd a systemd-t. A Secure Boot innen nem véd: ez boot integrity, nem runtime védelem.", "i": 7, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}], "module": [{"id": "power", "lab": "bekapcsolás", "sb": null, "pcr": null, "key": "—", "trace": "—", "msg": "1. Bekapcsolás: a CPU a firmware-ből indul; a BMC már ettől függetlenül fut.", "i": 0, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "fw", "lab": "UEFI firmware\n(Boot Services)", "sb": "root", "pcr": "0–7", "key": "PK/KEK/db/dbx (NVRAM)", "trace": "efibootmgr -v → BootOrder: 0001,0000", "msg": "2. UEFI firmware (Boot Services): a BootOrder 0001,0000 szerint a Boot0001* ubuntu …\\shimx64.efi bejegyzést indítja. A firmware saját kódját és beállításait PCR 0–7 méri.", "i": 1, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "shim", "lab": "shim\n(shimx64.efi)", "sb": "ok", "pcr": "4", "key": "db: Microsoft UEFI CA", "trace": "mokutil --sb-state → SecureBoot enabled", "msg": "3. shim: a firmware a db-ben lévő Microsoft-kulccsal ellenőrzi az aláírását; mérés PCR 4-be (EFI-alkalmazás).", "i": 2, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "grub", "lab": "GRUB\n(grubx64.efi)", "sb": "ok", "pcr": "4", "key": "shim: beépített Canonical-kulcs / MOK", "trace": "efibootmgr -v → …\\EFI\\ubuntu\\shimx64.efi", "msg": "4. GRUB: a shim a beépített Canonical-kulccsal (vagy MOK-kal) ellenőrzi; mérés PCR 4-be.", "i": 3, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "kernel", "lab": "kernel\n(vmlinuz)", "sb": "ok", "pcr": "8–9", "key": "shim-protokoll: Canonical-kulcs", "trace": "journalctl -k | grep -i 'secure boot'", "msg": "5. Kernel: a GRUB a shim-protokollon át ellenőrizteti (Canonical-aláírás); a GRUB méri a kernelt és a parancssort (PCR 8–9).", "i": 4, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "initrd", "lab": "initramfs", "sb": "no", "pcr": "9", "key": "nincs: a host generálja (update-initramfs)", "trace": "— (nincs aláírás; csak a mért lenyomat)", "msg": "6. initramfs: a GRUB betölti – NINCS aláírás-ellenőrzés (a hoston generált, aláíratlan fájl), csak mérés PCR 9-be.", "i": 5, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "ebs", "lab": "ExitBoot-\nServices", "sb": null, "pcr": null, "key": "—", "trace": "— (a kernel EFI-stubja hívja)", "msg": "7. ExitBootServices: a kernel EFI-stubja lezárja a Boot Services-t; innen csak a Runtime Services (pl. NVRAM-változók) érhető el.", "i": 6, "line": -1, "err": "", "boot": "Boot0001 ubuntu"}, {"id": "user", "lab": "Linux userspace\n/ systemd", "sb": "fail", "pcr": null, "key": "—", "trace": "modinfo <modul> | grep sig → (nincs aláírás)", "msg": "8. HIBAMÓD (4.4.4, 3. tünet): egy aláíratlan kernelmodul betöltését a kernel Secure Boot alatt elutasítja; ellenőrzés: mokutil --sb-state, modinfo <modul> | grep sig, dmesg | grep -i signature.", "i": 7, "line": -1, "err": "aláíratlan modul elutasítva", "boot": "Boot0001 ubuntu"}], "bootorder": [{"id": "power", "lab": "bekapcsolás", "sb": null, "pcr": null, "key": "—", "trace": "—", "msg": "1. Bekapcsolás: a CPU a firmware-ből indul; a BMC már ettől függetlenül fut.", "i": 0, "line": -1, "err": "", "boot": "Boot0000 lab-rescue-usb"}, {"id": "fw", "lab": "UEFI firmware\n(Boot Services)", "sb": "root", "pcr": "0–7", "key": "PK/KEK/db/dbx (NVRAM)", "trace": "efibootmgr -v → BootOrder: 0000,0001", "msg": "2. HIBAMÓD (3. feladat): a BootOrder 0000,0001, ezért a firmware a Boot0000* UEFI lab-rescue-usb …\\EFI\\BOOT\\BOOTX64.EFI bejegyzést indítja.", "i": 1, "line": -1, "err": "", "boot": "Boot0000 lab-rescue-usb"}, {"id": "shim", "lab": "lab-rescue-usb\n(BOOTX64.EFI)", "sb": "ok", "pcr": "4", "key": "db (csak aláírt image indulhat)", "trace": "mokutil --sb-state → SecureBoot enabled", "msg": "3. A lab-rescue-usb indul a rescue USB-ről (Secure Boot mellett csak aláírt image). Javítás: efibootmgr -o 0001,0000, ellenőrzés: efibootmgr -v | grep BootOrder.", "i": 2, "line": -1, "err": "rossz boot-bejegyzés", "boot": "Boot0000 lab-rescue-usb"}]};
function render(s){
  svg.setAttribute("viewBox", "0 0 760 380"); svg.innerHTML = "";
  const L = css("--line"), C = css("--cell"), H = css("--hl"), W = css("--hl2"), HL = css("--cellhl"), M = css("--muted");
  const list = STEPS, x0 = 96, bw = 80, gap = 3;
  el("text", {x: 4, y: 150, "font-size": 12, "font-weight": "bold"}, "Secure Boot");
  el("text", {x: 4, y: 205, "font-size": 12, "font-weight": "bold"}, "TPM (PCR)");
  el("text", {x: 4, y: 262, "font-size": 12, "font-weight": "bold"}, "BMC");
  list.forEach((st, i) => {
    const x = x0 + i * (bw + gap), on = i === k, done = i <= k, ok = st.sb === "ok" || st.sb === "root";
    el("rect", {x, y: 40, width: bw, height: 64, rx: 6, fill: done ? HL : C, stroke: st.err && on ? W : (on ? H : L),
      "stroke-width": on ? 3.5 : (ok ? 2 : 1.2), "stroke-dasharray": (st.sb === "no") ? "6 4" : ""});
    st.lab.split("\n").forEach((t, j, a) => el("text", {x: x + bw / 2, y: 72 + (j - (a.length - 1) / 2) * 14, "text-anchor": "middle", "font-size": 10}, t));
    if (i) el("line", {x1: x - gap, y1: 72, x2: x, y2: 72, stroke: L});
    if (!done) return;
    if (st.sb === "ok") el("text", {x: x + bw / 2, y: 150, "text-anchor": "middle", "font-size": 14, "font-weight": "bold", fill: H}, "✓");
    else if (st.sb === "no") el("text", {x: x + bw / 2, y: 150, "text-anchor": "middle", "font-size": 11, "font-weight": "bold", fill: W}, "nincs ellenőrzés");
    else if (st.sb === "fail") el("text", {x: x + bw / 2, y: 150, "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: W}, "✗ elutasít");
    else if (st.sb === "root") el("text", {x: x + bw / 2, y: 150, "text-anchor": "middle", "font-size": 11}, "PK/KEK/db");
    if (st.pcr){ el("circle", {cx: x + bw / 2, cy: 200, r: 16, fill: C, stroke: L, "stroke-width": 1.5});
      el("text", {x: x + bw / 2, y: 204, "text-anchor": "middle", "font-size": 11}, st.pcr); }
  });
  el("rect", {x: x0, y: 245, width: 8 * (bw + gap) - gap, height: 26, fill: HL, stroke: L});
  el("text", {x: x0 + 4 * (bw + gap), y: 262, "text-anchor": "middle", "font-size": 12}, "BMC: végig fut, az OS-től függetlenül; SoL-konzol a firmware-szakaszhoz");
  el("line", {x1: x0 + (bw + gap) + 8, y1: 245, x2: x0 + (bw + gap) + 8, y2: 106, stroke: M, "stroke-width": 1.5, "stroke-dasharray": "2 4"});
  el("text", {x: 4, y: 300, "font-size": 12.5}, "ellenőrző kulcs: " + s.key);
  el("text", {x: 4, y: 322, "font-size": 12.5}, "mért PCR: " + (s.pcr || "—") + "   (illusztratív, platformfüggő)");
  el("text", {x: 4, y: 344, "font-size": 12.5, "font-family": "ui-monospace,monospace"}, "Linuxból: " + s.trace);
  el("text", {x: 4, y: 366, "font-size": 12.5}, "indított bejegyzés: " + s.boot);
  if (s.err) el("text", {x: 756, y: 24, "text-anchor": "end", "font-size": 14, "font-weight": "bold", fill: W}, "⚠ " + s.err);
}
function variant(){ const v = document.querySelector('input[name="mode"]:checked').value; setSteps(VAR[v]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
