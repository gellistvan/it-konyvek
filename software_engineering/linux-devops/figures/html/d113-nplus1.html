<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N+1 kapacitás</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--line:#000;--code:#f3f3f3;--cellhl:#d9d9d9}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--line:#ddd;--code:#2a2a2a;--cellhl:#4a4a4a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
input[type=range]{width:130px}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;overflow-x:auto;margin:6px 0}
svg{width:100%;height:auto;display:block}
svg text{font-family:system-ui,sans-serif;fill:var(--fg)}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Paraméterek">
  <label>N <input id="n" type="range" min="2" max="6" value="3"> <span id="nv"></span></label>
  <label>CPU-csúcs u <input id="u" type="range" min="40" max="95" value="72"> <span id="uv"></span>%</label>
  <label>növekedés G <input id="g" type="range" min="0" max="20" value="8"> <span id="gv"></span>%</label>
  <label>cél <input id="t" type="range" min="60" max="95" value="85"> <span id="tv"></span>%</label>
  <label><input type="checkbox" id="w"> hibás modell (egy node / két node)</label>
</div>
<pre id="out" aria-live="polite"></pre>
<svg id="v" viewBox="0 0 640 260" role="img" aria-label="CPU- és RAM-igény a két megmaradt node 85%-os kapacitása felett, a hálózat alatta."></svg>
<p class="small">Számított modell a 23.3.5 hipotetikus adataiból (node: 4 vCPU, 8 GiB, 1 Gbit/s; mért csúcs a mostani 3 node-on: CPU u, RAM 5,8 GiB, hálózat 210 Mbit/s node-onként), nem mérés. A fleet-igény rögzített; N változtatásakor a kiesés után N−1 node marad.</p>
<script>
const NODE = {cpu:4, ram:8, net:1000}, N0 = 3;
const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("v");
function el(tag, at, tx){ const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (tx !== undefined) e.textContent = tx; svg.appendChild(e); return e; }
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function f(x, d){ return x.toFixed(d).replace(".", ","); }
function draw(){
  const N = +document.getElementById("n").value, u = +document.getElementById("u").value/100, G = +document.getElementById("g").value/100, T = +document.getElementById("t").value/100, wrong = document.getElementById("w").checked;
  ["n","u","g","t"].forEach(id => document.getElementById(id + "v").textContent = document.getElementById(id).value);
  const dem = {cpu: N0*NODE.cpu*u*(1+G), ram: N0*5.8, net: N0*210};
  const pct = {}; for (const k in dem) pct[k] = 100*dem[k]/((N-1)*NODE[k]*T);
  if (wrong) pct.cpu = 100*NODE.cpu*u*(1+G)/(2*NODE.cpu);
  const out = document.getElementById("out");
  out.textContent = (wrong ? "HIBÁS MODELL (a mai szöveg): egy node igénye / két node kapacitása = " + f(NODE.cpu*u*(1+G), 2) + " / 8 = " + f(pct.cpu, 0) + "% – a teljes fleet-igényt elhanyagolja!\n" :
    "util_after_failure = fleet-igény / ((N−1)·C·cél) = " + f(dem.cpu, 2) + " vCPU / (" + (N-1) + "·4·" + f(T, 2) + ") = " + f(pct.cpu, 1) + "%\n") +
    "RAM: " + f(dem.ram, 1) + " GiB → " + f(pct.ram, 0) + "%   hálózat: " + dem.net + " Mbit/s → " + f(pct.net, 0) + "%   " +
    (Math.max(pct.cpu, pct.ram, pct.net) > 100 ? "→ N+1 NEM teljesül" : "→ N+1 teljesül");
  svg.innerHTML = "";
  const x0 = 70, y0 = 220, sc = 160/200;
  el("line", {x1:x0, y1:y0 - 100*sc, x2:620, y2:y0 - 100*sc, stroke: css("--line"), "stroke-dasharray":"6 4"});
  el("text", {x:620, y:y0 - 100*sc - 4, "text-anchor":"end", "font-size":11}, "100% = (N−1) node × cél");
  [0, 50, 100, 150, 200].forEach(v => el("text", {x:x0-6, y:y0 - v*sc + 4, "text-anchor":"end", "font-size":10.5}, v + "%"));
  [["cpu","CPU"],["ram","RAM"],["net","hálózat"]].forEach(([k, lab], i) => {
    const v = Math.min(pct[k], 200), x = x0 + 40 + i*180, h = v*sc, over = pct[k] > 100;
    el("rect", {x:x, y:y0 - h, width:90, height:h, fill: over ? css("--hl2") : css("--hl"), opacity:0.85});
    el("text", {x:x + 45, y:y0 - h - 6, "text-anchor":"middle", "font-size":13, "font-weight":"bold"}, f(pct[k], 0) + "%");
    el("text", {x:x + 45, y:y0 + 18, "text-anchor":"middle", "font-size":12}, lab + (k === "cpu" && wrong ? " (hibás)" : ""));
  });
  el("line", {x1:x0, y1:y0, x2:620, y2:y0, stroke: css("--line")});
}
["n","u","g","t","w"].forEach(id => document.getElementById(id).addEventListener("input", draw));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
