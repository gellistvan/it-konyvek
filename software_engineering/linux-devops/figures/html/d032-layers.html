<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Userspace–kernel–periféria rétegek</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label><input type="checkbox" id="ub" checked onchange="show(k)"> cerr unitbuf (alapértelmezés: be)</label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Rétegoszlop: C++ stream, glibc wrapper, syscall határ stable ABI-val, VFS, ext4 builtin, blokkréteg, driver modul internal kernel API-val, hardver és firmware a periférián."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A strace-sorok a syscall_demo helyi futtatásából (T-D2-072). unitbuf nélkül (pufferelt cerr) a stderr egyetlen write(2, …, 14) hívással ürülne. A stdout/stderr itt terminálra megy (tty), a rétegoszlop egy fájlba író std::ofstream útját mutatja.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Egy write() útja a rétegeken át; kattints egy rétegre a megfigyelő parancsért.", "k": -1, "line": -1}, {"msg": "1/7 C++ stream: std::ofstream << / std::cerr <<: C++ puffer (unitbuf: minden << után flush)", "k": 0, "line": 0}, {"msg": "2/7 glibc: write() wrapper / syscall(): argumentumok regiszterbe, syscall utasítás", "k": 1, "line": 1}, {"msg": "3/7 VFS: vfs_write(): fd → struct file → f_op->write_iter", "k": 2, "line": 2}, {"msg": "4/7 ext4 (builtin, CONFIG_EXT4=y): page cache, journal", "k": 3, "line": 3}, {"msg": "5/7 blokkréteg (blk-mq): bio → request, ütemező", "k": 4, "line": 4}, {"msg": "6/7 driver: nvme.ko / e1000e.ko (modul): /lib/modules/$(uname -r)/…", "k": 5, "line": 5}, {"msg": "7/7 hardver + firmware blob: a periférián fut; request_firmware() a /lib/firmware alól", "k": 6, "line": 6}];
const CODE = ["1. C++ stream: std::ofstream << / std::cerr <<", "2. glibc: write() wrapper / syscall()", "3. VFS: vfs_write()", "4. ext4 (builtin, CONFIG_EXT4=y)", "5. blokkréteg (blk-mq)", "6. driver: nvme.ko / e1000e.ko (modul)", "7. hardver + firmware blob"];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const LAYERS=[["C++ stream: std::ofstream << / std::cerr <<", "C++ puffer (unitbuf: minden << után flush)", "user", "strace -e trace=write ./syscall_demo"], ["glibc: write() wrapper / syscall()", "argumentumok regiszterbe, syscall utasítás", "user", "strace -e trace=write ./syscall_demo"], ["VFS: vfs_write()", "fd → struct file → f_op->write_iter", "kernel", "grep -w __NR_write /usr/include/x86_64-linux-gnu/asm/unistd_64.h"], ["ext4 (builtin, CONFIG_EXT4=y)", "page cache, journal", "kernel", "grep CONFIG_EXT4 /boot/config-$(uname -r)"], ["blokkréteg (blk-mq)", "bio → request, ütemező", "kernel", "cat /sys/block/nvme0n1/queue/scheduler"], ["driver: nvme.ko / e1000e.ko (modul)", "/lib/modules/$(uname -r)/…", "module", "lsmod | grep nvme; modinfo nvme"], ["hardver + firmware blob", "a periférián fut; request_firmware() a /lib/firmware alól", "periph", "sudo dmesg | grep -i firmware"]], SU=["write(1, \"hello from userspace\\n\", 21) = 21", "write(1, \"hello from userspace\\n\", 21) = 21", "write(2, \"results=\", 8) = 8", "write(2, \"21\", 2) = 2", "write(2, \",\", 1) = 1", "write(2, \"21\", 2) = 2", "write(2, \"\\n\", 1) = 1"], SB=["write(1, \"hello from userspace\\n\", 21) = 21", "write(1, \"hello from userspace\\n\", 21) = 21", "write(2, \"results=21,21\\n\", 14) = 14"];
let PICK=-1;
function render(s){
  svg.setAttribute("viewBox","0 0 620 460"); svg.innerHTML="";
  const ys=[10,62,140,192,244,312,384];
  LAYERS.forEach((L,i)=>{const y=ys[i], on=(i===s.k)||(i===PICK);
    const r=el("rect",{x:10,y:y,width:330,height:44,rx:6,fill:on?css("--cellhl"):css("--cell"),stroke:on?css("--hl2"):css("--line"),"stroke-width":on?3.5:(L[2]==="periph"?2:1),"stroke-dasharray":L[2]==="user"?"6 3":"",tabindex:0,role:"button","aria-label":L[0]});
    r.style.cursor="pointer"; r.addEventListener("click",()=>{PICK=i; render(s); status.textContent=L[0]+" → megfigyelés: "+L[3];});
    el("text",{x:175,y:y+19,"text-anchor":"middle","font-size":12.5,"font-weight":"bold"},L[0]);
    el("text",{x:175,y:y+36,"text-anchor":"middle","font-size":11},L[1]);
    if(i<6) el("line",{x1:175,y1:y+44,x2:175,y2:ys[i+1],stroke:css("--line"),"stroke-width":1.5});});
  el("line",{x1:0,y1:122,x2:620,y2:122,stroke:css("--fg"),"stroke-width":2.5,"stroke-dasharray":"8 5"});
  el("text",{x:350,y:116,"font-size":11.5,"font-weight":"bold"},"stable userspace ABI: syscall, SYS_write = 1");
  el("line",{x1:0,y1:300,x2:350,y2:300,stroke:css("--fg"),"stroke-width":1.5,"stroke-dasharray":"10 3 2 3"});
  el("text",{x:350,y:304,"font-size":11.5},"internal kernel API (vermagic)");
  el("line",{x1:0,y1:372,x2:620,y2:372,stroke:css("--fg"),"stroke-width":1.5,"stroke-dasharray":"2 4"});
  el("text",{x:350,y:368,"font-size":11.5},"kernel ↑ / periféria ↓ (firmware a periférián)");
  const ub=document.getElementById("ub").checked, L=ub?SU:SB;
  el("text",{x:350,y:150,"font-size":11.5,"font-weight":"bold"},"strace ("+(ub?"unitbuf":"pufferelt cerr")+"): "+L.length+" write");
  L.forEach((t,i)=>el("text",{x:350,y:168+i*15,"font-size":10,"font-family":"monospace"},t.length>36?t.slice(0,35)+"…":t));
  if(s.k>=0) el("text",{x:10,y:452,"font-size":12,"font-family":"monospace",fill:css("--hl")},"$ "+LAYERS[s.k][3]);
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1100);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
