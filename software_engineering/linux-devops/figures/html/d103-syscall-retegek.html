<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egy open() hívás rétegei és a tagadás bizonyítékai</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>Forgatókönyv: <select id="sc" aria-label="Forgatókönyv"><option value="A">A: minden engedélyezett</option><option value="B" selected>B: AppArmor-profil szabály nélkül (21.3.7 kezdőállapot)</option><option value="C">C: DAC – a fájl 0600 root:root</option><option value="D">D: seccomp tiltja az openat-ot</option></select></label><script>document.getElementById("sc").addEventListener("change", e => { SC = e.target.value; setSteps(ALL[SC]); });</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Az open hívás sorban átmegy a seccompon, a DAC-on és az LSM-hookon; mindegyik tagadásnak saját hibakódja és naplóforrása van."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Szerkezeti vázlat a 21.3.7 példájával (lab-svc, UID 2001); a kimenet- és logsorok a fejezet várt kimenetei, nem mérés. A seccomp-tagadás jele a szűrő akciójától függ (SIGSYS vagy EPERM).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"at": "call", "res": "start", "msg": "Indítás: sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data → open(\"/var/lib/lab-svc/data\", O_RDONLY)  →  openat syscall.", "line": -1}, {"at": "seccomp", "res": "allow", "msg": "1. réteg (seccomp): engedélyez – tovább.", "line": -1}, {"at": "dac", "res": "allow", "msg": "2. réteg (dac): engedélyez – tovább.", "line": -1}, {"at": "lsm", "res": "deny", "msg": "3. réteg (lsm) TAGAD → kimenet: open: Permission denied; bizonyíték: apparmor=\"DENIED\" operation=\"open\" profile=\"lab-svc\" name=\"/var/lib/lab-svc/data\" requested_mask=\"r\" denied_mask=\"r\" fsuid=2001 ouid=2001", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

let SC = "B";
const ALL = {"A": [{"at": "call", "res": "start", "msg": "Indítás: sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data → open(\"/var/lib/lab-svc/data\", O_RDONLY)  →  openat syscall.", "line": -1}, {"at": "seccomp", "res": "allow", "msg": "1. réteg (seccomp): engedélyez – tovább.", "line": -1}, {"at": "dac", "res": "allow", "msg": "2. réteg (dac): engedélyez – tovább.", "line": -1}, {"at": "lsm", "res": "allow", "msg": "3. réteg (lsm): engedélyez – tovább.", "line": -1}, {"at": "fd", "res": "ok", "msg": "4) fd visszaadva; a program kiírja: lab-svc data.", "line": -1}], "B": [{"at": "call", "res": "start", "msg": "Indítás: sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data → open(\"/var/lib/lab-svc/data\", O_RDONLY)  →  openat syscall.", "line": -1}, {"at": "seccomp", "res": "allow", "msg": "1. réteg (seccomp): engedélyez – tovább.", "line": -1}, {"at": "dac", "res": "allow", "msg": "2. réteg (dac): engedélyez – tovább.", "line": -1}, {"at": "lsm", "res": "deny", "msg": "3. réteg (lsm) TAGAD → kimenet: open: Permission denied; bizonyíték: apparmor=\"DENIED\" operation=\"open\" profile=\"lab-svc\" name=\"/var/lib/lab-svc/data\" requested_mask=\"r\" denied_mask=\"r\" fsuid=2001 ouid=2001", "line": -1}], "C": [{"at": "call", "res": "start", "msg": "Indítás: sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data → open(\"/var/lib/lab-svc/data\", O_RDONLY)  →  openat syscall.", "line": -1}, {"at": "seccomp", "res": "allow", "msg": "1. réteg (seccomp): engedélyez – tovább.", "line": -1}, {"at": "dac", "res": "deny", "msg": "2. réteg (dac) TAGAD → kimenet: open: Permission denied; bizonyíték: nincs LSM-sor; namei -l: -rw------- root root data", "line": -1}], "D": [{"at": "call", "res": "start", "msg": "Indítás: sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data → open(\"/var/lib/lab-svc/data\", O_RDONLY)  →  openat syscall.", "line": -1}, {"at": "seccomp", "res": "deny", "msg": "1. réteg (seccomp) TAGAD → kimenet: Bad system call (SIGSYS) – vagy EPERM: Operation not permitted; bizonyíték: audit: type=SECCOMP … comm=\"lab-svc\" … syscall=257 (openat)", "line": -1}]}, SCN = {"A": {"name": "A: minden engedélyezett", "deny": null, "out": "lab-svc data", "log": "nincs denial-sor"}, "B": {"name": "B: AppArmor-profil szabály nélkül (21.3.7 kezdőállapot)", "deny": "lsm", "out": "open: Permission denied", "log": "apparmor=\"DENIED\" operation=\"open\" profile=\"lab-svc\" name=\"/var/lib/lab-svc/data\" requested_mask=\"r\" denied_mask=\"r\" fsuid=2001 ouid=2001"}, "C": {"name": "C: DAC – a fájl 0600 root:root", "deny": "dac", "out": "open: Permission denied", "log": "nincs LSM-sor; namei -l: -rw------- root root data"}, "D": {"name": "D: seccomp tiltja az openat-ot", "deny": "seccomp", "out": "Bad system call (SIGSYS) – vagy EPERM: Operation not permitted", "log": "audit: type=SECCOMP … comm=\"lab-svc\" … syscall=257 (openat)"}}, LAY = [{"id": "seccomp", "q": "1) seccomp-szűrő\n(SystemCallFilter=)", "deny": "SIGSYS, vagy EPERM, ha\nSystemCallErrorNumber=EPERM\naudit: type=SECCOMP\nsyscall=257 (openat)", "ls": ":"}, {"id": "dac", "q": "2) path-feloldás + DAC\nUID 2001, mód 0640,\nowner lab-svc", "deny": "EACCES\nbizonyíték: namei -l\n/var/lib/lab-svc/data\n(tulajdonos, mód)", "ls": "-"}, {"id": "lsm", "q": "3) LSM-hook\nAppArmor profil lab-svc\n/ SELinux", "deny": "EACCES\napparmor=\"DENIED\"\noperation=\"open\"\nSELinux: avc: denied { read }", "ls": "double"}];
function render(s){
  svg.setAttribute("viewBox", "0 0 620 460");
  svg.innerHTML = "";
  const st = STEPS;
  const seen = {}; st.slice(0, k + 1).forEach(x => seen[x.at] = x.res);
  el("text", {x:10, y:20, "font-size":12, "font-family":"ui-monospace,monospace"}, "$ sudo -u lab-svc /opt/lab/bin/lab-svc /var/lib/lab-svc/data");
  el("text", {x:10, y:40, "font-size":12, "font-family":"ui-monospace,monospace"}, 'open("/var/lib/lab-svc/data", O_RDONLY) → openat');
  const cx = 170, ys = [100, 200, 300];
  LAY.forEach((L, i) => {
    const y = ys[i], r = seen[L.id];
    const cur = s.at === L.id;
    const col = r === "deny" ? css("--hl2") : (cur ? css("--hl") : css("--line"));
    const dash = L.ls === ":" ? "2 3" : "";
    el("polygon", {points:`${cx},${y-38} ${cx+140},${y} ${cx},${y+38} ${cx-140},${y}`, fill: r ? css("--cellhl") : css("--cell"), stroke: col, "stroke-width": (cur || r === "deny") ? 3.5 : (L.ls === "double" ? 4 : 1.5), "stroke-dasharray": r === "deny" ? "7 4" : dash});
    if (L.ls === "double") el("polygon", {points:`${cx},${y-33} ${cx+131},${y} ${cx},${y+33} ${cx-131},${y}`, fill:"none", stroke: col, "stroke-width":1});
    const q = L.q.split("\n");
    el("text", {x:cx, y:y-4, "text-anchor":"middle", "font-size":12, "font-weight":"bold"}, q[0]);
    el("text", {x:cx, y:y+13, "text-anchor":"middle", "font-size":10.5}, q[1]);
    const res = r === "allow" ? "igen ✓" : (r === "deny" ? "NEM ✗" : "");
    if (res) el("text", {x:cx+150, y:y-12, "font-size":12, "font-weight":"bold", fill: r === "deny" ? css("--hl2") : css("--fg")}, res);
    // tagadás-doboz
    el("line", {x1:cx+140, y1:y, x2:388, y2:y, stroke: r === "deny" ? css("--hl2") : css("--muted"), "stroke-width": r === "deny" ? 3 : 1.2, "stroke-dasharray":"7 4"});
    el("rect", {x:390, y:y-36, width:222, height:72, fill: r === "deny" ? css("--cellhl") : css("--bg"), stroke: r === "deny" ? css("--hl2") : css("--muted"), "stroke-width": r === "deny" ? 3 : 1, "stroke-dasharray": dash});
    L.deny.split("\n").forEach((t, j) => el("text", {x:396, y:y-18+j*16, "font-size":10.5, opacity: r === "deny" ? 1 : 0.55}, t));
    if (i < 2) el("line", {x1:cx, y1:y+38, x2:cx, y2:ys[i+1]-38, stroke: seen[LAY[i+1].id] ? css("--hl") : css("--line"), "stroke-width":2});
  });
  el("line", {x1:cx, y1:338, x2:cx, y2:372, stroke: seen.fd ? css("--hl") : css("--line"), "stroke-width":2});
  el("rect", {x:cx-110, y:372, width:220, height:34, rx:6, fill: seen.fd ? css("--cellhl") : css("--cell"), stroke: seen.fd ? css("--hl") : css("--line"), "stroke-width": seen.fd ? 3 : 1.2});
  el("text", {x:cx, y:394, "text-anchor":"middle", "font-size":12}, "4) fd visszaadva");
  const last = st[st.length - 1];
  if (k === st.length - 1) {
    el("text", {x:10, y:432, "font-size":12, "font-weight":"bold"}, "Kimenet: " + (last.res === "deny" ? SCN[SC].out : "lab-svc data"));
    el("text", {x:10, y:452, "font-size":10, "font-family":"ui-monospace,monospace"}, "Log: " + SCN[SC].log.slice(0, 96));
  }
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
