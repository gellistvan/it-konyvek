<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHCPv4 bérlet: T1, T2, lejárat és szerverkiesés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>bérletidő <input id="d7L" type="range" min="60" max="3600" step="30" value="120" oninput="d7recalc()"> <span id="d7Lv">120 s (T1 60,0, T2 105,0)</span></label> <label>SIGSTOP <input id="d7a" type="range" min="1" max="3000" value="10" oninput="d7recalc()"> <span id="d7av">10 s</span></label> <label>SIGCONT <input id="d7b" type="range" min="2" max="5000" value="150" oninput="d7recalc()"> <span id="d7bv">150 s</span></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="120 s-os bérletnél 60 s-nál unicast megújítás, 105 s-nál broadcast újrakötés, 120 s-nál lejárat; felfüggesztett szervernél a cím csak a lejáratkor tűnik el."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">RFC 2131 alapértelmezett arányai (T1 = 50%, T2 = 87,5%), számított. Modell: válasz nélkül egy-egy ismétlés a hátralévő idő felénél, lejárat után Discover 3 s-onként; az udhcpc tényleges ütemezése implementációfüggő, nem mért. A lab-client.state a hook szerint csak bound/renew eseménynél íródik.</p>

function d7sim(lease, stop, cont, horizon){
  const up = t => !(stop <= t && t < cont);
  const ev = [], valid = []; let tb = 0;
  ev.push([0, "dora", "b", true, "DORA: Discover 0.0.0.0:68 → 255.255.255.255:67, Offer, Request, ACK → 10.77.38.20/24, DNS 10.77.38.53; udhcpc: bound"]);
  for (let guard = 0; guard < 200; guard++){
    const t1 = tb + 0.5 * lease, t2 = tb + 0.875 * lease, te = tb + lease;
    const tries = [[t1, "renew", "u"], [t1 + (t2 - t1) / 2, "renew", "u"], [t2, "rebind", "b"], [t2 + (te - t2) / 2, "rebind", "b"]];
    let got = null;
    for (const tr of tries){ if (tr[0] > horizon) break; const ok = up(tr[0]);
      ev.push([tr[0], tr[1], tr[2], ok, (tr[1] === "renew" ? "DHCPREQUEST unicast az eredeti szervernek (renew)" : "DHCPREQUEST broadcast (rebind), bármely szerver válaszolhat") + (ok ? " → ACK; udhcpc: renew, új bérlet" : " – nincs válasz")]);
      if (ok){ got = tr[0]; break; } }
    if (got !== null){ valid.push([tb, got]); tb = got; continue; }
    if (te > horizon){ valid.push([tb, horizon]); break; }
    valid.push([tb, te]);
    ev.push([te, "deconfig", "", false, "Lejárat: udhcpc deconfig → ip -4 address flush dev lab-c0; a 10.77.38.20 eltűnik. (A lab-client.state változatlan: a hook deconfignál nem ír.)"]);
    let t = te, found = false;
    while (t <= horizon){ if (up(t)){ ev.push([t, "dora", "b", true, "Discover → Offer → Request → ACK: a cím visszatér; udhcpc: bound"]); tb = t; found = true; break; }
      ev.push([t, "discover", "b", false, "Discover (broadcast) – nincs válasz"]); t += 3; }
    if (!found) break;
  }
  return [ev, valid];
}
function d7build(lease, stop, cont){
  const horizon = Math.max(1.5 * lease, cont + 0.5 * lease);

  return ev.map(e => { if (e[1] === "dora") { st = "event=bound ip=10.77.38.20 dns=10.77.38.53"; has = true; }
      else if (e[3]) st = "event=renew ip=10.77.38.20 dns=10.77.38.53"; else if (e[1] === "deconfig") has = false;
      return {t: e[0], kind: e[1], d: e[2], ok: e[3], ev: ev, valid: valid, lease: lease, stop: stop, cont: cont, horizon: horizon,
              state: st, has: has, msg: "t = " + d7fmt(e[0], 1) + " s – " + e[4]}; });
}

let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");

function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";

  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });

show(0);
