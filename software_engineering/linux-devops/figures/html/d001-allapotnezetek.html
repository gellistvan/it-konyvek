<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-status négy állapotnézete</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Négy doboz: kívánt, konfigurációforrás, megfigyelt, tárolt állapot; csak az indítóparancs hat a futó folyamatra."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A kerettípus kódol: szaggatott = kívánt, pontozott = konfigurációforrás, vastag = megfigyelt, dupla = tárolt; kiemelt (narancs) keret = eltérés. Az értékek a 1.1.6 kidolgozott példájából; a PASS a várt, nem mért eredmény.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"yaml": "127.0.0.1:18080", "run": "127.0.0.1:18080", "body": "ok", "code": 200, "cmp": true, "passed": true, "drift": false, "msg": "1/3 Alapállapot: a YAML kívánt címe, az indítóparancs és a megfigyelés is 127.0.0.1:18080; a próba PASS.", "line": -1}, {"yaml": "127.0.0.1:18081", "run": "127.0.0.1:18080", "body": "ok", "code": 200, "cmp": true, "passed": true, "drift": true, "msg": "2/3 A lab-contract.yaml desired.listen értéke 18081 lett. A futó folyamat nem olvassa a YAML-t, ezért a megfigyelt listener továbbra is 18080: dokumentáció ≠ futó állapot (1.1.7, 4. sor).", "line": -1}, {"yaml": "127.0.0.1:18080", "run": "127.0.0.1:18080", "body": "broken", "code": 200, "cmp": false, "passed": false, "drift": false, "msg": "3/3 A lab-health.txt tartalma „broken”: a szerver kiszolgálja, HTTP 200 jön, de a cmp eltérést jelez, ezért nincs PASS (3. feladat).", "line": -1}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function render(s){
  svg.setAttribute("viewBox", "0 0 760 420"); svg.innerHTML = "";
  const L = css("--line"), C = css("--cell"), H = css("--hl"), W = css("--hl2"), M = css("--muted");
  function frame(x, y, w, h, kind, warn){
    const st = warn ? W : L;
    if (kind === "double"){ el("rect",{x,y,width:w,height:h,fill:C,stroke:st,"stroke-width":1.5});
      el("rect",{x:x+5,y:y+5,width:w-10,height:h-10,fill:"none",stroke:st,"stroke-width":1.2}); return; }
    el("rect",{x,y,width:w,height:h,fill:C,stroke:st,"stroke-width":kind==="solid"?3.5:2,
      "stroke-dasharray":kind==="dash"?"9 5":(kind==="dot"?"2 4":"")});
  }
  function tx(x, y, t, o){ const a = Object.assign({x, y, "text-anchor":"middle","font-size":13}, o||{}); return el("text", a, t); }
  function mono(x, y, t, o){ return tx(x, y, t, Object.assign({"font-family":"ui-monospace,monospace","font-size":12.5}, o||{})); }
  frame(10, 10, 270, 160, "dash", s.drift);
  tx(145, 34, "Kívánt állapot (desired)", {"font-weight":"bold"});
  mono(145, 70, "lab-contract.yaml"); mono(145, 94, "desired.listen =");
  mono(145, 118, s.yaml, {"font-weight":"bold", fill: s.drift ? W : css("--fg")});
  tx(145, 155, "leíró szerződés", {"font-style":"italic", fill:M, "font-size":12});
  frame(10, 230, 270, 170, "dot", false);
  tx(145, 254, "Konfiguráció forrása", {"font-weight":"bold"});
  mono(145, 290, "python3 -m http.server 18080"); mono(145, 312, "--bind 127.0.0.1"); mono(145, 334, "--directory …/lab-www");
  tx(145, 380, "az indítóparancs argumentumai", {"font-style":"italic", fill:M, "font-size":12});
  el("ellipse", {cx:380, cy:215, rx:88, ry:50, fill:css("--cellhl"), stroke:L, "stroke-width":1.5});
  tx(380, 205, "futó folyamat"); mono(380, 228, s.run, {"font-weight":"bold"});
  frame(480, 10, 270, 160, "solid", !s.passed);
  tx(615, 34, "Megfigyelt állapot (observed)", {"font-weight":"bold"});
  mono(615, 66, "ss -ltn 'sport = :18080'"); mono(615, 88, "→ LISTEN " + s.run);
  mono(615, 116, "curl → HTTP " + s.code + ", cmp: " + (s.cmp ? "OK" : "differ"), {fill: s.cmp ? css("--fg") : W});
  tx(615, 150, s.passed ? "✓ PASS" : "✗ nincs PASS", {"font-size":16, "font-weight":"bold", fill: s.passed ? H : W});
  frame(480, 230, 270, 170, "double", s.body !== "ok" || s.drift);
  tx(615, 256, "Tárolt állapot (stored)", {"font-weight":"bold"});
  mono(615, 290, "lab-health.txt: " + (s.body === "ok" ? "ok" : "broken"), {fill: s.body === "ok" ? css("--fg") : W, "font-weight": s.body==="ok" ? "normal" : "bold"});
  mono(615, 314, "lab-data.txt"); mono(615, 338, "lab-inventory.txt");
  mono(615, 362, "lab-contract.yaml" + (s.drift ? " (18081)" : ""), {fill: s.drift ? W : css("--fg")});
  function arrow(x0,y0,x1,y1,dash,lab,lx,ly){
    el("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:L,"stroke-width":2,"stroke-dasharray":dash||""});
    const a = Math.atan2(y1-y0, x1-x0), h = 10;
    el("polygon",{points:`${x1},${y1} ${x1-h*Math.cos(a-0.4)},${y1-h*Math.sin(a-0.4)} ${x1-h*Math.cos(a+0.4)},${y1-h*Math.sin(a+0.4)}`, fill:L});
    if (lab) tx(lx, ly, lab, {"font-size":12});
  }
  arrow(280, 300, 320, 252, "", "indítás", 318, 300);
  arrow(458, 190, 480, 150, "", "megfigyelés", 430, 150);
  arrow(480, 300, 440, 252, "6 4"); tx(472, 322, "kiszolgált fájl", {"font-size":12, "text-anchor":"end"});
  el("line",{x1:280,y1:120,x2:315,y2:175,stroke:M,"stroke-width":1.5,"stroke-dasharray":"2 4"});
  tx(298, 152, "✕", {"font-size":20, "font-weight":"bold", fill: W});
  tx(345, 120, "nincs vezérlő", {"font-size":12});
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 2500);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
