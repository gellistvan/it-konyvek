function arrowSV(p, q, col, dash, w){
  const ang = Math.atan2(q[1] - p[1], q[0] - p[0]), sh = 26, a = [p[0] + sh * Math.cos(ang), p[1] + sh * Math.sin(ang)], b = [q[0] - sh * Math.cos(ang), q[1] - sh * Math.sin(ang)];
  el("line", {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, "stroke-width": w, "stroke-dasharray": dash});
  el("polygon", {points: `${b[0]},${b[1]} ${b[0] - 12 * Math.cos(ang - 0.4)},${b[1] - 12 * Math.sin(ang - 0.4)} ${b[0] - 12 * Math.cos(ang + 0.4)},${b[1] - 12 * Math.sin(ang + 0.4)}`, fill: col});
}
function render(s){
  svg.setAttribute("viewBox", "0 0 760 400"); svg.innerHTML = "";
  const L = css("--line"), C = css("--cell"), H = css("--hl"), W = css("--hl2"), HL = css("--cellhl"), M = css("--muted");
  const defs = el("defs", {}); const pat = document.createElementNS(NS, "pattern");
  pat.setAttribute("id", "hat"); pat.setAttribute("width", 7); pat.setAttribute("height", 7); pat.setAttribute("patternUnits", "userSpaceOnUse"); pat.setAttribute("patternTransform", "rotate(45)");
  const pl = document.createElementNS(NS, "line"); pl.setAttribute("x1", 0); pl.setAttribute("y1", 0); pl.setAttribute("x2", 0); pl.setAttribute("y2", 7); pl.setAttribute("stroke", L); pl.setAttribute("stroke-width", 1.5);
  pat.appendChild(pl); defs.appendChild(pat);
  el("rect", {x: X(0.2), y: Y(3.4), width: 6.3 * 46, height: 3.0 * 40, fill: "none", stroke: M});
  el("text", {x: X(3.35), y: Y(3.4) + 16, "text-anchor": "middle", "font-size": 12, fill: M}, "DRAM");
  const act = s.arrow;
  [["cpu", "CPU-mag (driver)"], ["ctrl", "NVMe-vezérlő"], ["sq", "SQ"], ["cq", "CQ"], ["page", "lap (4 KiB)"], ["iommu", "IOMMU"]].forEach(([kk, lab]) => {
    const [x, y, w, h] = POS[kk], on = act.includes(kk);
    let fill = C;
    if (kk === "page") fill = s.owner === "device" ? "url(#hat)" : HL;
    if (kk === "sq" && s.sqe !== "üres") fill = HL; if (kk === "cq" && s.cqe) fill = HL;
    const bad = s.err && ((kk === "sq" && s.err === "hibás descriptor") || (kk === "page" && s.err === "versenyhelyzet"));
    el("rect", {x: X(x), y: Y(y + h), width: w * 46, height: h * 40, fill, stroke: bad ? W : (on ? H : L), "stroke-width": bad ? 5 : (on ? 3 : 1.2)});
    el("text", {x: X(x + w / 2), y: Y(y + h) + 18, "text-anchor": "middle", "font-size": 12.5, "font-weight": "bold"}, lab);
  });
  el("text", {x: X(8.35), y: Y(1.6), "text-anchor": "middle", "font-size": 12, "font-family": "ui-monospace,monospace"}, s.iommu ? "IOVA 0xfff00000" : "nincs bejegyzés");
  if (s.iommu) el("text", {x: X(8.35), y: Y(1.6) + 18, "text-anchor": "middle", "font-size": 12, "font-family": "ui-monospace,monospace"}, "→ PA 0x12345000");
  el("text", {x: X(1.3), y: Y(1.2), "text-anchor": "middle", "font-size": 11}, s.sqe === "üres" ? "" : "SQE: " + s.sqe);
  el("text", {x: X(3.3), y: Y(1.2), "text-anchor": "middle", "font-size": 11}, s.cqe ? "CQE" : "");
  const [a, b, kind] = act;
  if (a !== b){
    if (kind === "dma" && b === "page"){ arrowSV(ctr(a), ctr("sq"), W, "8 5", 2.5); arrowSV(ctr(a), ctr("iommu"), W, "8 5", 3); arrowSV(ctr("iommu"), ctr("page"), W, "8 5", 3); }
    else arrowSV(ctr(a), ctr(b), kind === "dma" ? W : H, kind === "dma" ? "8 5" : "", 3);
  } else el("text", {x: X(2.3), y: Y(5.3), "text-anchor": "middle", "font-size": 13, "font-weight": "bold", fill: H}, s.title);
  if (s.n === 6) { arrowSV(ctr("ctrl"), ctr("cpu"), W, "2 4", 2.5); el("text", {x: X(5.0), y: Y(7.6), "text-anchor": "middle", "font-size": 12}, "MSI-X: nvme0q1 (IRQ 25)"); }
  if (s.err) el("text", {x: X(5), y: Y(-0.1), "text-anchor": "middle", "font-size": 15, "font-weight": "bold", fill: W}, "⚠ " + s.err);
  // állapottábla
  const rows = [["puffer tulajdonosa", s.owner === "device" ? "device-owned" : "CPU-owned"], ["IOMMU-bejegyzés", s.iommu ? "él" : "nincs"],
                ["SQ farok (doorbell)", String(s.sq_db)], ["CQ fej", String(s.cq_head)], ["folyamat", s.woke ? "felébredt" : "vár"]];
  rows.forEach(([kk, v], i) => { el("text", {x: 500, y: 300 + i * 20, "font-size": 12.5, fill: M}, kk + ":");
    el("text", {x: 650, y: 300 + i * 20, "font-size": 12.5, "font-weight": "bold"}, v); });
}
function variant(){ const old = k; setSteps(VAR[(document.getElementById("nb").checked ? "1" : "0") + (document.getElementById("lu").checked ? "1" : "0")]); show(old); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1800);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
