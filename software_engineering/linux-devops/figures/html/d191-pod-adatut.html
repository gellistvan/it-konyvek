<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A lab-pod létrehozásának adatútja</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>hibainjektálás: <select id="flt" onchange="d191upd()"><option value="none">nincs hiba</option><option value="sel">rossz nodeSelector</option><option value="img">rossz image</option><option value="kubelet">kubelet leállítva</option></select></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Szekvenciadiagram: kubectl, kube-apiserver, etcd, kube-scheduler, kubelet, containerd; a Pod YAML-részlete lépésenként."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Pontozott nyíl = watch-esemény (nem parancs), folytonos = írás. Csak az apiserver ír etcd-be. A node neve <node> (illusztratív).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"n": 0, "stop": false, "msg": "kubectl --context lab-cluster apply -f lab-pod.yaml – Lépés ▶", "y": {"nodeName": "", "phase": "(nincs)", "cond": ""}}, {"n": 1, "stop": false, "msg": "1. kubectl → kube-apiserver: POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 2, "stop": false, "msg": "2. kube-apiserver → etcd: írás: Pod, spec.nodeName üres", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": false, "msg": "3. kube-apiserver → kube-scheduler: watch: új Pod, nodeName üres – watch: értesítés, nem parancs", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 4, "stop": false, "msg": "4. kube-scheduler → kube-apiserver: POST …/pods/lab-pod/binding (Event: Scheduled)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 5, "stop": false, "msg": "4. kube-apiserver → etcd: írás: spec.nodeName=<node>", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 6, "stop": false, "msg": "5. kube-apiserver → kubelet@<node>: watch: Pod a <node>-hoz kötve – watch: értesítés, nem parancs", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 7, "stop": false, "msg": "6. kubelet@<node> → containerd (CRI): RunPodSandbox, PullImage, CreateContainer, StartContainer (Event: Pulling, Pulled, Created, Started)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 8, "stop": false, "msg": "7. kubelet@<node> → kube-apiserver: PATCH …/pods/lab-pod/status", "y": {"nodeName": "<node>", "phase": "Running", "cond": "PodScheduled=True, Initialized=True, ContainersReady=True, Ready=True"}}, {"n": 9, "stop": false, "msg": "7. kube-apiserver → etcd: írás: phase Running, Ready True – a Pod Running és Ready.", "y": {"nodeName": "<node>", "phase": "Running", "cond": "PodScheduled=True, Initialized=True, ContainersReady=True, Ready=True"}}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const MS = [{"a": "kubectl", "b": "kube-apiserver", "lab": "POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "kind": "write", "st": 1}, {"a": "kube-apiserver", "b": "etcd", "lab": "írás: Pod, spec.nodeName üres", "kind": "write", "st": 2}, {"a": "kube-apiserver", "b": "kube-scheduler", "lab": "watch: új Pod, nodeName üres", "kind": "watch", "st": 3}, {"a": "kube-scheduler", "b": "kube-apiserver", "lab": "POST …/pods/lab-pod/binding", "kind": "write", "st": 4}, {"a": "kube-apiserver", "b": "etcd", "lab": "írás: spec.nodeName=<node>", "kind": "write", "st": 4}, {"a": "kube-apiserver", "b": "kubelet@<node>", "lab": "watch: Pod a <node>-hoz kötve", "kind": "watch", "st": 5}, {"a": "kubelet@<node>", "b": "containerd (CRI)", "lab": "RunPodSandbox, PullImage, CreateContainer, StartContainer", "kind": "cri", "st": 6}, {"a": "kubelet@<node>", "b": "kube-apiserver", "lab": "PATCH …/pods/lab-pod/status", "kind": "write", "st": 7}, {"a": "kube-apiserver", "b": "etcd", "lab": "írás: phase Running, Ready True", "kind": "write", "st": 7}], LIFE = ["kubectl", "kube-apiserver", "etcd", "kube-scheduler", "kubelet@<node>", "containerd (CRI)"], ALLF = {"none": [{"n": 0, "stop": false, "msg": "kubectl --context lab-cluster apply -f lab-pod.yaml – Lépés ▶", "y": {"nodeName": "", "phase": "(nincs)", "cond": ""}}, {"n": 1, "stop": false, "msg": "1. kubectl → kube-apiserver: POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 2, "stop": false, "msg": "2. kube-apiserver → etcd: írás: Pod, spec.nodeName üres", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": false, "msg": "3. kube-apiserver → kube-scheduler: watch: új Pod, nodeName üres – watch: értesítés, nem parancs", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 4, "stop": false, "msg": "4. kube-scheduler → kube-apiserver: POST …/pods/lab-pod/binding (Event: Scheduled)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 5, "stop": false, "msg": "4. kube-apiserver → etcd: írás: spec.nodeName=<node>", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 6, "stop": false, "msg": "5. kube-apiserver → kubelet@<node>: watch: Pod a <node>-hoz kötve – watch: értesítés, nem parancs", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 7, "stop": false, "msg": "6. kubelet@<node> → containerd (CRI): RunPodSandbox, PullImage, CreateContainer, StartContainer (Event: Pulling, Pulled, Created, Started)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 8, "stop": false, "msg": "7. kubelet@<node> → kube-apiserver: PATCH …/pods/lab-pod/status", "y": {"nodeName": "<node>", "phase": "Running", "cond": "PodScheduled=True, Initialized=True, ContainersReady=True, Ready=True"}}, {"n": 9, "stop": false, "msg": "7. kube-apiserver → etcd: írás: phase Running, Ready True – a Pod Running és Ready.", "y": {"nodeName": "<node>", "phase": "Running", "cond": "PodScheduled=True, Initialized=True, ContainersReady=True, Ready=True"}}], "sel": [{"n": 0, "stop": false, "msg": "kubectl --context lab-cluster apply -f lab-pod.yaml – Lépés ▶", "y": {"nodeName": "", "phase": "(nincs)", "cond": ""}}, {"n": 1, "stop": false, "msg": "1. kubectl → kube-apiserver: POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 2, "stop": false, "msg": "2. kube-apiserver → etcd: írás: Pod, spec.nodeName üres", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": false, "msg": "3. kube-apiserver → kube-scheduler: watch: új Pod, nodeName üres – watch: értesítés, nem parancs", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": true, "xrow": 3, "msg": "4. A scheduler nem talál a nodeSelectornak megfelelő node-ot: Event FailedScheduling, a Pod Pending marad, nincs binding.", "y": {"nodeName": "", "phase": "Pending", "cond": "PodScheduled=False (Unschedulable)"}}], "img": [{"n": 0, "stop": false, "msg": "kubectl --context lab-cluster apply -f lab-pod.yaml – Lépés ▶", "y": {"nodeName": "", "phase": "(nincs)", "cond": ""}}, {"n": 1, "stop": false, "msg": "1. kubectl → kube-apiserver: POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 2, "stop": false, "msg": "2. kube-apiserver → etcd: írás: Pod, spec.nodeName üres", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": false, "msg": "3. kube-apiserver → kube-scheduler: watch: új Pod, nodeName üres – watch: értesítés, nem parancs", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 4, "stop": false, "msg": "4. kube-scheduler → kube-apiserver: POST …/pods/lab-pod/binding (Event: Scheduled)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 5, "stop": false, "msg": "4. kube-apiserver → etcd: írás: spec.nodeName=<node>", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 6, "stop": false, "msg": "5. kube-apiserver → kubelet@<node>: watch: Pod a <node>-hoz kötve – watch: értesítés, nem parancs", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 7, "stop": true, "xrow": 6, "msg": "6. PullImage sikertelen: Event Failed / ErrImagePull, majd ImagePullBackOff; a konténer nem indul, a Pod Pending.", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True, ContainersReady=False (ErrImagePull)"}}], "kubelet": [{"n": 0, "stop": false, "msg": "kubectl --context lab-cluster apply -f lab-pod.yaml – Lépés ▶", "y": {"nodeName": "", "phase": "(nincs)", "cond": ""}}, {"n": 1, "stop": false, "msg": "1. kubectl → kube-apiserver: POST /api/v1/namespaces/lab-d191/pods  (lab-pod)", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 2, "stop": false, "msg": "2. kube-apiserver → etcd: írás: Pod, spec.nodeName üres", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 3, "stop": false, "msg": "3. kube-apiserver → kube-scheduler: watch: új Pod, nodeName üres – watch: értesítés, nem parancs", "y": {"nodeName": "", "phase": "Pending", "cond": ""}}, {"n": 4, "stop": false, "msg": "4. kube-scheduler → kube-apiserver: POST …/pods/lab-pod/binding (Event: Scheduled)", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 5, "stop": false, "msg": "4. kube-apiserver → etcd: írás: spec.nodeName=<node>", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}, {"n": 5, "stop": true, "xrow": 5, "msg": "5. A <node> kubeletje nem fut (a node NotReady/Unknown): a watch-eseményt senki nem dolgozza fel, a Pod Pending marad, bár spec.nodeName ki van töltve.", "y": {"nodeName": "<node>", "phase": "Pending", "cond": "PodScheduled=True"}}]};
function render(s){
  const X = {}, top = 50, dy = 30; LIFE.forEach((n, i) => X[n] = 50 + i * 100);
  svg.setAttribute("viewBox", `0 0 760 ${top + MS.length * dy + 120}`);
  svg.innerHTML = "";
  el("defs", {}).innerHTML = `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${css("--line")}"/></marker>`;
  LIFE.forEach(n => { el("text", {x: X[n], y: 20, "text-anchor": "middle", "font-size": 11, "font-weight": "bold"}, n);
    el("line", {x1: X[n], x2: X[n], y1: 28, y2: top + MS.length * dy, stroke: css("--muted")}); });
  MS.forEach((m, i) => { if (i >= s.n) return; const y = top + i * dy, cur = i === s.n - 1, col = cur ? (s.stop ? css("--hl2") : css("--hl")) : css("--line");
    el("line", {x1: X[m.a], x2: X[m.b] + (X[m.b] > X[m.a] ? -2 : 2), y1: y, y2: y, stroke: col, "stroke-width": cur ? 2.6 : 1.2, "stroke-dasharray": m.kind === "watch" ? "2 4" : "", "marker-end": "url(#ah)"});
    const cri = m.kind === "cri";
    el("text", {x: cri ? X[m.b] - 4 : Math.min(X[m.a], X[m.b]) + 4, y: y - 4, "text-anchor": cri ? "end" : "start", "font-size": 10.5, style: "font-family:ui-monospace,monospace"}, m.st + " " + m.lab); });
  if (s.stop) { const m = MS[s.xrow], y = top + s.xrow * dy;
    el("text", {x: X[m.b] + 8, y: y + 5, "font-size": 18, "font-weight": "bold", fill: css("--hl2")}, "✗"); }
  const Y = s.y, y0 = top + MS.length * dy + 22;
  el("rect", {x: 10, y: y0 - 14, width: 740, height: 86, fill: css("--code"), stroke: "none"});
  ["# kubectl get pod lab-pod -n lab-d191 -o yaml (részlet)", "spec:", "  nodeName: " + (Y.nodeName || '""  # még üres'), "status:",
   "  phase: " + Y.phase + (Y.cond ? "   conditions: " + Y.cond : "")].forEach((l, i) =>
    el("text", {x: 18, y: y0 + i * 15, "font-size": 11.5, style: "font-family:ui-monospace,monospace"}, l.replace(/^ +/, m => "\u00a0".repeat(m.length))));
}
function d191upd(){ setSteps(ALLF[document.getElementById("flt").value]); }


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1200);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
