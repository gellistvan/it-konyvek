<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leghosszabb prefixegyezés</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>célcím <input id="dst" value="10.203.117.74" size="15" aria-label="célcím"></label> <label><input type="checkbox" id="f2"> 2. feladat: /64-es útvonal via .1</label> <label><input type="checkbox" id="f3"> 3. feladat: téves /64 dev lab-a0</label> <br><label>számolómód: <input id="cidr" value="192.0.2.190/27" size="18" aria-label="CIDR"></label> <button id="cb">Számol</button> <span id="calcout" class="small" aria-live="polite"></span><script>document.getElementById("dst").addEventListener("change", () => rebuild());["f2","f3"].forEach(id => document.getElementById(id).addEventListener("change", () => rebuild()));document.getElementById("cb").addEventListener("click", () => calc());document.getElementById("cidr").addEventListener("change", () => calc());</script></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="A 10.203.117.74 célra a default és a 10.203.117.64/26 útvonal illeszkedik; a hosszabb prefix nyer, hibás közvetlen útvonalnál a csomag a router helyett közvetlenül az A linkjén próbálkozik."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">A 24.2.5 labor lab-cidr-a útvonaltáblája; a route get kimenetek várt értékek. A számolómód kezdőértéke a 24.2.7 1. feladata (192.0.2.190/27 → 192.0.2.160/27, 255.255.255.224, .191, .161–.190).</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"line": -1, "dst": "10.203.117.74", "keys": ["kernel", "default"], "cur": "kernel", "msg": "10.203.117.0/26: (10.203.117.74 AND /26-maszk) = 10.203.117.64 ≠ 10.203.117.0 → nem illeszkedik ✗"}, {"line": -1, "dst": "10.203.117.74", "keys": ["kernel", "default"], "cur": "default", "msg": "0.0.0.0/0: (10.203.117.74 AND /0-maszk) = 0.0.0.0 = 0.0.0.0 → illeszkedik ✓"}, {"line": -1, "dst": "10.203.117.74", "keys": ["kernel", "default"], "cur": "default", "best": "default", "msg": "Nyertes: 0.0.0.0/0 (leghosszabb illeszkedő prefix). $ ip -n lab-cidr-a route get 10.203.117.74 → 10.203.117.74 via 10.203.117.1 dev lab-a0 src 10.203.117.10"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

const ROUTES = {"kernel": {"pfx": "10.203.117.0/26", "txt": "10.203.117.0/26 dev lab-a0 proto kernel src 10.203.117.10", "via": null}, "default": {"pfx": "0.0.0.0/0", "txt": "default via 10.203.117.1 dev lab-a0", "via": "10.203.117.1"}, "f2": {"pfx": "10.203.117.64/26", "txt": "10.203.117.64/26 via 10.203.117.1 dev lab-a0 (2. feladat)", "via": "10.203.117.1"}, "f3": {"pfx": "10.203.117.64/26", "txt": "10.203.117.64/26 dev lab-a0 (3. feladat hibája)", "via": null}}, SRC = "10.203.117.10";
function ip2n(s){ const p = s.trim().split("."); if (p.length !== 4 || p.some(x => !/^\d+$/.test(x) || +x > 255)) return null; return ((+p[0] << 24) | (+p[1] << 16) | (+p[2] << 8) | +p[3]) >>> 0; }
function n2ip(n){ return [n >>> 24, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join("."); }
function mask(L){ return L === 0 ? 0 : (0xFFFFFFFF << (32 - L)) >>> 0; }
function bitsOf(n){ return n.toString(2).padStart(32, "0"); }
function mkSteps(dst, keys){
  const d = ip2n(dst); if (d === null) return [{line:-1, msg:"Érvénytelen IPv4-cím.", bad:true}];
  const out = [], hits = [];
  keys.forEach(k => {
    const [a, L] = ROUTES[k].pfx.split("/"), net = ip2n(a), m = mask(+L), ok = ((d & m) >>> 0) === net;
    if (ok) hits.push([+L, k]);
    out.push({line:-1, dst:dst, keys:keys, cur:k, msg:`${ROUTES[k].pfx}: (${dst} AND /${L}-maszk) = ${n2ip((d & m) >>> 0)} ${ok ? "= " : "≠ "}${a} → ${ok ? "illeszkedik ✓" : "nem illeszkedik ✗"}`});
  });
  hits.sort((x, y) => y[0] - x[0]);
  const best = hits.length ? hits[0][1] : null, r = best ? ROUTES[best] : null;
  out.push({line:-1, dst:dst, keys:keys, cur:best, best:best, msg: best ? `Nyertes: ${r.pfx} (leghosszabb illeszkedő prefix). $ ip -n lab-cidr-a route get ${dst} → ${dst} ${r.via ? "via " + r.via + " " : ""}dev lab-a0 src ${SRC}` : "Nincs illeszkedő útvonal: Network is unreachable"});
  return out;
}
function render(s){
  svg.setAttribute("viewBox", "0 0 640 300");
  svg.innerHTML = "";
  if (s.bad) return;
  const d = ip2n(s.dst), db = bitsOf(d), cw = 13.5, X = j => 120 + j*cw + Math.floor(j/8)*6;
  el("text", {x:6, y:30, "font-size":12, "font-weight":"bold"}, s.dst);
  for (let j = 0; j < 32; j++) { el("rect", {x:X(j), y:16, width:cw-1, height:20, fill: css("--cell"), stroke: css("--line"), "stroke-width":0.5}); el("text", {x:X(j)+cw/2-0.5, y:31, "text-anchor":"middle", "font-size":11, "font-family":"ui-monospace,monospace"}, db[j]); }
  s.keys.forEach((k, i) => {
    const y = 56 + i*36, [a, L] = ROUTES[k].pfx.split("/"), pb = bitsOf(ip2n(a)), cur = s.cur === k;
    const ok = ((d & mask(+L)) >>> 0) === ip2n(a);
    const reached = s.keys.indexOf(s.cur) >= i || s.best !== undefined;
    el("text", {x:6, y:y+15, "font-size":11.5, "font-weight": (s.best === k) ? "bold" : "normal", fill: s.best === k ? css("--hl") : css("--fg")}, (s.best === k ? "► " : "") + (k === "default" ? "default /0" : ROUTES[k].pfx));
    for (let j = 0; j < 32; j++) {
      const inp = j < +L, bad = inp && pb[j] !== db[j];
      el("rect", {x:X(j), y:y, width:cw-1, height:20, fill: (reached && bad) ? css("--cellhl") : css("--bg"), stroke: inp ? (cur ? css("--hl") : css("--line")) : css("--muted"), "stroke-width": inp ? (cur ? 2.2 : 1.4) : 0.4, "stroke-dasharray": inp ? "" : "2 2"});
      el("text", {x:X(j)+cw/2-0.5, y:y+15, "text-anchor":"middle", "font-size":11, "font-family":"ui-monospace,monospace", fill: inp ? css("--fg") : css("--muted")}, inp ? (reached && bad ? "✗" : pb[j]) : "·");
    }
    if (reached) el("text", {x:X(31)+18, y:y+15, "font-size":12, "font-weight":"bold", fill: ok ? css("--hl") : css("--hl2")}, ok ? "✓" : "✗");
  });
  const yb = 66 + s.keys.length*36;
  if (s.best !== undefined && s.best) { const r = ROUTES[s.best]; el("text", {x:6, y:yb+10, "font-size":12, "font-family":"ui-monospace,monospace", fill: css("--hl")}, `${s.dst} ${r.via ? "via " + r.via + " " : ""}dev lab-a0 src ${SRC}`); }
  el("text", {x:6, y:290, "font-size":10.5, fill: css("--muted")}, "vastag keret = prefixbit · ✗ = eltérő bit · ► = nyertes (leghosszabb illeszkedő prefix)");
}
function rebuild(){
  const keys = ["kernel", "default"]; if (document.getElementById("f2").checked) keys.push("f2"); if (document.getElementById("f3").checked) keys.push("f3");
  setSteps(mkSteps(document.getElementById("dst").value, keys));
}
function calc(){
  const v = document.getElementById("cidr").value.trim().split("/"), a = ip2n(v[0] || ""), L = +v[1];
  const o = document.getElementById("calcout");
  if (a === null || !(L >= 0 && L <= 32) || v.length !== 2) { o.textContent = "Érvénytelen CIDR."; return; }
  const m = mask(L), net = (a & m) >>> 0, bc = (net | (~m >>> 0)) >>> 0;
  o.textContent = `hálózat ${n2ip(net)}/${L}, maszk ${n2ip(m)}, broadcast ${n2ip(bc)}, kiosztható ${L >= 31 ? "(/31–/32: különleges eset)" : n2ip(net + 1) + "–" + n2ip(bc - 1)}`;
}


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 1600);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
