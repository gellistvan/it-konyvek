<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pod → Vault → PostgreSQL credential-lánc</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3;--fill2:#c4c4c4;--fill3:#e8e8e8}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a;--fill2:#6a6a6a;--fill3:#383838}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.ctl label{display:flex;align-items:center;gap:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid var(--hl);font-weight:bold}
input[type=range]{min-width:110px}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg)}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
table{border-collapse:collapse;font-size:13px}
td,th{border:1px solid var(--muted);padding:2px 6px;text-align:left}
tr.on td{outline:2px solid var(--hl);font-weight:bold}
.clickable{cursor:pointer}
.clickable:focus{outline:2px dashed var(--hl)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<button id="prev">◀ Lépés</button><button id="next">Lépés ▶</button><span id="cnt" class="small"></span>
</div><div class="ctl">
<label>idő <input id="iT" type="range" min="0" max="300" step="5" value="20"><span id="vT"></span></label>
<button id="bL">leak → revoke most</button><button id="bR">renew most</button><button id="bP">pod törlése most</button><button id="bX">alaphelyzet</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 1000 360" role="img" aria-label="A pod projected tokenje (aud vault.lab.internal, 1 h) a Vault JWT auth role-on át 1 órás Vault tokent ad, amellyel a database/creds path 1 órás lease-szel dinamikus PostgreSQL-usert hoz létre; revoke vagy TTL-lejárat után a DB role megszűnik."></svg>
<svg id="tl" viewBox="0 0 1000 200" role="img" aria-label="Idősáv: token, lease, DB role"></svg><pre id="cmd" style="margin:6px 0 0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap"></pre>
<p class="small">Idősáv: modell, nem mérés (default_ttl 1h, max_ttl 4h). A gombok az aktuális időpontban hatnak. A projected token külön projected volume-ból jön (audience: vault.lab.internal).</p>
<script>
const DATA = {"D": {"W": 1000, "H": 360, "nodes": [{"id": "pod", "x": 20, "y": 45, "w": 290, "h": 60, "label": "Pod lab-app /\nSA lab-api-sa", "shape": "rect", "fs": 16}, {"id": "tok", "x": 20, "y": 145, "w": 290, "h": 75, "label": "projected token\naud=vault.lab.internal, exp 1h", "shape": "rect", "fs": 14, "double": true}, {"id": "iss", "x": 20, "y": 270, "w": 290, "h": 60, "label": "EKS OIDC issuer (JWKS)", "shape": "rect", "fs": 15}, {"id": "role", "x": 350, "y": 25, "w": 350, "h": 150, "label": "auth/jwt/role/\nlab-db-reader\n(bound_subject,\nbound_audiences)", "shape": "diamond", "fs": 14}, {"id": "vt", "x": 360, "y": 185, "w": 330, "h": 70, "label": "Vault token (ttl 1h)\npolicy lab-db-reader-policy", "shape": "rect", "fs": 15, "double": true}, {"id": "cred", "x": 360, "y": 285, "w": 330, "h": 55, "label": "database/creds/lab-db-reader", "shape": "rect", "fs": 15}, {"id": "db", "x": 730, "y": 120, "w": 260, "h": 150, "label": "PostgreSQL 16 lab-db\nCREATE ROLE v-…\nVALID UNTIL +1h", "shape": "cyl", "fs": 15}], "edges": [{"id": "c1", "pts": [[165, 105], [165, 145]], "label": "1", "lx": 180, "ly": 125, "fs": 14, "bg": false}, {"id": "c2", "pts": [[310, 180], [330, 180], [330, 100], [360, 100]], "label": "2", "lx": 320, "ly": 140, "fs": 14, "bg": false}, {"id": "c3", "pts": [[310, 300], [345, 300], [345, 130], [410, 130]], "label": "", "ls": "dash"}, {"id": "c4", "pts": [[525, 175], [525, 185]], "label": "", "arrow": "end"}, {"id": "c5", "pts": [[525, 255], [525, 285]], "label": "4", "lx": 540, "ly": 270, "fs": 14, "bg": false}, {"id": "c6", "pts": [[690, 312], [860, 312], [860, 270]], "label": "5: lease 3600 s", "lx": 790, "ly": 296, "fs": 14, "bg": false}, {"id": "b1", "pts": [[340, 20], [340, 350]], "label": "", "arrow": "none", "lw": 3.5}, {"id": "b2", "pts": [[710, 20], [710, 350]], "label": "", "arrow": "none", "lw": 3.5}], "texts": [{"x": 175, "y": 15, "s": "Kubernetes", "fs": 16, "bold": true}, {"x": 525, "y": 15, "s": "Vault", "fs": 16, "bold": true}, {"x": 860, "y": 15, "s": "DB", "fs": 16, "bold": true}, {"x": 165, "y": 245, "s": "JWKS-aláírás-ellenőrzés (szaggatott)", "fs": 13, "italic": true}, {"x": 540, "y": 180, "s": "3", "fs": 14, "ha": "left"}, {"x": 985, "y": 345, "s": "dupla keret = token;\nrombusz = policy-döntés", "fs": 13, "ha": "right"}]}, "steps": [{"msg": "1. Pod indul; a kubelet projected tokent ad (aud=vault.lab.internal, exp 1 h).", "hl": ["pod", "tok", "c1"], "cmd": "# projected volume: serviceAccountToken, audience: vault.lab.internal, expirationSeconds: 3600"}, {"msg": "2. Login: a pod a tokent bemutatja a Vault JWT auth role-nak.", "hl": ["c2", "role"], "cmd": "vault write auth/jwt/login role=lab-db-reader jwt=\"$TOKEN\""}, {"msg": "3. A Vault a JWKS-sel ellenőrzi az aláírást, a bound_subject és a bound_audiences egyezik → Vault token (ttl 1h).", "hl": ["c3", "role", "vt", "c4"], "cmd": "bound_subject=system:serviceaccount:lab-app:lab-api-sa\nbound_audiences=vault.lab.internal"}, {"msg": "4. A policy csak a database/creds/lab-db-reader olvasását engedi.", "hl": ["vt", "cred", "c5"], "cmd": "vault read -format=json database/creds/lab-db-reader"}, {"msg": "5. A database engine dinamikus DB-usert hoz létre (lease 3600 s, VALID UNTIL +1h).", "hl": ["cred", "db", "c6"], "cmd": "CREATE ROLE \"v-…\" WITH LOGIN PASSWORD '…' VALID UNTIL '<+1h>'"}, {"msg": "6. Leak esetén: vault lease revoke → a DB role megszűnik; ellenőrzés a creds válasz pontos usernevével.", "hl": ["db"], "cmd": "vault lease revoke <lease_id>\npsql … -c \"SELECT rolname FROM pg_roles WHERE rolname = '<username>';\""}], "TTL": 60, "MAX": 240};

const DG_NS="http://www.w3.org/2000/svg";
function dg_css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function dg_mk(par,tag,attrs,text){const e=document.createElementNS(DG_NS,tag);for(const a in (attrs||{}))e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;par.appendChild(e);return e;}
function dg_defs(root){
  const fg=dg_css("--fg")||"#111", hl=dg_css("--hl")||"#1f4e79";
  const d=dg_mk(root,"defs",{});
  d.innerHTML=`<marker id="dgar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${fg}"/></marker>`+
   `<marker id="dgarh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${hl}"/></marker>`+
   `<pattern id="dghatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="${fg}" stroke-width="1.1"/></pattern>`;
}
function dg_fill(f){return {w:dg_css("--cell")||"#fff",g:dg_css("--fill3")||"#e8e8e8",d:dg_css("--fill2")||"#c4c4c4",n:"none"}[f||"w"];}
const DG_DASH={solid:"",dash:"7 4",dot:"1.5 3.5",dashdot:"7 3 1.5 3"};
function dg_text(par,x,y,s,fs,o){
  o=o||{}; const lines=String(s).split("\n"), lh=fs*1.18;
  const y0 = o.va==="top" ? y+fs*0.9 : y-(lines.length-1)*lh/2+fs*0.35;
  const g=dg_mk(par,"g",{});
  if(o.bg){ // fehér háttér a felirat mögé
    const wmax=Math.max(...lines.map(l=>l.length))*fs*0.54, hh=lines.length*lh;
    const xa = o.anchor==="start"? x-2 : (o.anchor==="end"? x-wmax-2 : x-wmax/2-2);
    dg_mk(g,"rect",{x:xa,y:(o.va==="top"?y:y-hh/2)-1,width:wmax+4,height:hh+2,fill:dg_css("--bg")||"#fff",opacity:0.92});
  }
  lines.forEach((l,i)=>{const a={x:x,y:y0+i*lh,"font-size":fs,"text-anchor":o.anchor||"middle"};
    if(o.bold)a["font-weight"]="bold"; if(o.italic)a["font-style"]="italic"; if(o.fill)a.fill=o.fill;
    dg_mk(g,"text",a,l);});
  return g;
}
function dg_node(par,n,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const st={stroke:on?hl:fg,"stroke-width":on?3.5:(n.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[n.ls||"solid"],fill:on?(dg_css("--cellhl")||"#d9d9d9"):dg_fill(n.fill)};
  const g=dg_mk(par,"g",{"data-id":n.id});
  const x=n.x,y=n.y,w=n.w,h=n.h;
  if(n.shape==="rect"||n.shape==="lane"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st));}
  else if(n.shape==="frame"){dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h},st,{fill:"none"}));}
  else if(n.shape==="round"||n.shape==="person"){const r=Math.min(w,h)*0.22;dg_mk(g,"rect",Object.assign({x:x,y:y,width:w,height:h,rx:r,ry:r},st));
    if(n.shape==="person"){const cx=x+14,cy=y+h/2,s={stroke:fg,"stroke-width":1.3,fill:"none"};
      dg_mk(g,"circle",Object.assign({cx:cx,cy:cy-9,r:4.5},s));dg_mk(g,"path",Object.assign({d:`M${cx} ${cy-4.5}V${cy+6}M${cx-6} ${cy-1}H${cx+6}M${cx-5} ${cy+13}L${cx} ${cy+6}L${cx+5} ${cy+13}`},s));}}
  else if(n.shape==="diamond"){dg_mk(g,"polygon",Object.assign({points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`},st));}
  else if(n.shape==="cyl"){const e=Math.min(14,h*0.25);
    dg_mk(g,"path",Object.assign({d:`M${x} ${y+e/2}V${y+h-e/2}A${w/2} ${e/2} 0 0 0 ${x+w} ${y+h-e/2}V${y+e/2}`},st));
    dg_mk(g,"ellipse",Object.assign({cx:x+w/2,cy:y+e/2,rx:w/2,ry:e/2},st));}
  if(n.hatch){ if(n.shape==="diamond")dg_mk(g,"polygon",{points:`${x+w/2},${y} ${x+w},${y+h/2} ${x+w/2},${y+h} ${x},${y+h/2}`,fill:"url(#dghatch)",opacity:0.5});
    else dg_mk(g,"rect",{x:x,y:y,width:w,height:h,fill:"url(#dghatch)",opacity:0.5});}
  if(n.double){const d=5;dg_mk(g,n.shape==="round"?"rect":"rect",{x:x+d,y:y+d,width:w-2*d,height:h-2*d,rx:n.shape==="round"?Math.min(w,h)*0.18:0,fill:"none",stroke:on?hl:fg,"stroke-width":1.2});}
  if(n.label){const fs=n.fs||18;
    if(n.shape==="frame"||n.shape==="lane")dg_text(g,x+8,y+6,n.label,fs,{anchor:"start",va:"top",bold:n.bold!==false,italic:!!n.italic});
    else dg_text(g,x+w/2+(n.shape==="person"?12:0),y+h/2+(n.dy||0),n.label,fs,{bold:!!n.bold||(on&&!n.nobold),italic:!!n.italic});}
  return g;
}
function dg_edge(par,e,on){
  const fg=dg_css("--fg"), hl=dg_css("--hl");
  const g=dg_mk(par,"g",{"data-id":e.id});
  const d="M"+e.pts.map(p=>p[0]+" "+p[1]).join("L");
  const a={d:d,fill:"none",stroke:on?hl:fg,"stroke-width":on?3.4:(e.lw||1.2)*1.4,"stroke-dasharray":DG_DASH[e.ls||"solid"]};
  const arr=e.arrow||"end";
  if(arr!=="none")a["marker-end"]=on?"url(#dgarh)":"url(#dgar)";
  if(arr==="both")a["marker-start"]=on?"url(#dgarh)":"url(#dgar)";
  dg_mk(g,"path",a);
  if(e.label){let lx=e.lx,ly=e.ly; if(lx===undefined||lx===null){const m=Math.floor(e.pts.length/2);const p=e.pts[m-1],q=e.pts[m];lx=(p[0]+q[0])/2;ly=(p[1]+q[1])/2;}
    dg_text(g,lx,ly,e.label,e.fs||17,{anchor:{left:"start",right:"end"}[e.ha]||"middle",bg:e.bg!==false,bold:on,italic:!!e.italic});}
  return g;
}
function dg_draw(root,D,hl,opts){
  opts=opts||{}; hl=hl||new Set();
  if(!opts.keep){root.innerHTML="";root.setAttribute("viewBox",`0 0 ${D.W} ${D.H}`);dg_defs(root);}
  const out={};
  const L1=dg_mk(root,"g",{}),L2=dg_mk(root,"g",{}),L3=dg_mk(root,"g",{});
  D.nodes.filter(n=>n.shape==="frame"||n.shape==="lane").forEach(n=>out[n.id]=dg_node(L1,n,hl.has(n.id)));
  D.nodes.filter(n=>!(n.shape==="frame"||n.shape==="lane")).forEach(n=>out[n.id]=dg_node(L3,n,hl.has(n.id)));
  D.edges.forEach(e=>out[e.id]=dg_edge(L2,e,hl.has(e.id)));
  (D.texts||[]).forEach(t=>dg_text(L3,t.x,t.y,t.s,t.fs||18,{anchor:{left:"start",right:"end"}[t.ha]||"middle",va:t.va,bold:!!t.bold,italic:!!t.italic,bg:!!t.bg}));
  return out;
}

const svg=document.getElementById("v"), status=document.getElementById("status");

function hu(v,d){return Number(v).toFixed(d===undefined?1:d).replace(".",",").replace("-","−");}

let K=0, EV=[], PD=null;
const $=id=>document.getElementById(id), tl=$("tl");
function leaseEnd(){let exp=DATA.TTL;for(const [t,e] of EV.slice().sort((a,b)=>a[0]-b[0])){if(t>=exp)break;if(e==="renew")exp=Math.min(t+DATA.TTL,DATA.MAX);else if(e==="revoke")return [t,"revoke"];}return [exp,"ttl"];}
function draw(){
  const s=DATA.steps[K]; $("cnt").textContent=`${K+1}/${DATA.steps.length}`; $("cmd").textContent=s.cmd;
  dg_draw(svg,DATA.D,new Set(s.hl));
  const T=+$("iT").value; $("vT").textContent=`${Math.floor(T/60)} h ${T%60} perc`;
  const [end,why]=leaseEnd(); const tokEnd=why==="revoke"?end:Math.max(DATA.TTL,end);
  tl.innerHTML=""; dg_defs(tl);
  const X=m=>170+m/300*810, fg=dg_css("--fg");
  [["projected token",DATA.TTL],["Vault token",tokEnd],["lease + DB role",end]].forEach((r,i)=>{const y=15+i*42;
    dg_text(tl,160,y+14,r[0],14,{anchor:"end"}); const on=T<r[1];
    dg_mk(tl,"rect",{x:X(0),y:y,width:X(r[1])-X(0),height:28,fill:on?dg_css("--fill2"):dg_css("--fill3"),stroke:fg,"stroke-width":1.2});});
  dg_mk(tl,"rect",{x:X(end),y:99,width:Math.max(0,X(DATA.MAX)-X(end)),height:28,fill:"none",stroke:fg,"stroke-dasharray":"2 4"});
  dg_text(tl,X(DATA.MAX)+4,113,"max_ttl 4 h",12,{anchor:"start"});
  for(let m=0;m<=300;m+=60){dg_text(tl,X(m),160,`${m/60} h`,13,{});dg_mk(tl,"path",{d:`M${X(m)} 10V140`,stroke:dg_css("--muted"),"stroke-dasharray":"1 3"});}
  if(PD!==null){dg_mk(tl,"path",{d:`M${X(PD)} 10V140`,stroke:fg,"stroke-width":2,"stroke-dasharray":"6 4"});dg_text(tl,X(PD)+4,185,"pod törölve",12,{anchor:"start"});}
  dg_mk(tl,"path",{d:`M${X(T)} 5V145`,stroke:dg_css("--hl"),"stroke-width":2.5});
  const v=(a)=>a?"érvényes":"lejárt/visszavonva";
  status.textContent=`${s.msg} — t = ${T} perc: projected token ${v(T<DATA.TTL)}, Vault token ${v(T<tokEnd)}, lease és DB role ${T<end?"él":(why==="revoke"?"visszavonva (DROP ROLE)":"lejárt (automatikus revoke)")}`+
    ` (lease vége: ${end} perc${why==="revoke"?", revoke":""}).`+(PD!==null&&T>=PD&&T<end?" A pod már nincs, de a lease a TTL végéig él.":"");
}
$("prev").onclick=()=>{K=Math.max(0,K-1);draw();}; $("next").onclick=()=>{K=Math.min(DATA.steps.length-1,K+1);draw();};
$("iT").addEventListener("input",draw);
$("bL").onclick=()=>{EV.push([+$("iT").value,"revoke"]);K=5;draw();};
$("bR").onclick=()=>{EV.push([+$("iT").value,"renew"]);draw();};
$("bP").onclick=()=>{PD=+$("iT").value;draw();};
$("bX").onclick=()=>{EV=[];PD=null;draw();};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){K=Math.min(DATA.steps.length-1,K+1);draw();}if(e.key==="ArrowLeft"){K=Math.max(0,K-1);draw();}});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
