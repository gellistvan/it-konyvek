<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>payment-api függőségi gráf</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
button{font:inherit;padding:3px 10px;cursor:pointer}
input[type=range]{flex:1;min-width:120px}
#status{margin:4px 0 6px;min-height:2.9em}
/* A pszeudokód a rajz ALATT, teljes szélességben (hosszú sorok ne görgessenek oldalra) */
.wrap{display:flex;flex-direction:column;gap:10px;align-items:stretch}
svg{width:100%;height:auto;display:block}
pre#code{width:100%;margin:0;padding:6px 8px;background:var(--code);font:12.5px/1.5 ui-monospace,monospace;white-space:pre;overflow-x:auto}
pre#code span{display:block;padding:0 4px}
pre#code span.on{outline:2px solid var(--hl);font-weight:bold}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Lejátszás vezérlői">
  <button id="first" title="Első lépés">⏮</button>
  <button id="prev" title="Előző lépés">◀ Lépés</button>
  <button id="play" title="Lejátszás / szünet">▶ Lejátszás</button>
  <button id="next" title="Következő lépés">Lépés ▶</button>
  <input id="pos" type="range" min="0" max="0" value="0" aria-label="Lépés kiválasztása">
  <span id="cnt" class="small"></span>
</div>
<div class="ctl"><label>nézet: <select id="mode"><option value="base">kiinduló</option><option value="fixed">javított</option></select></label> <button id="reset">kiesések törlése</button> <label>A<sub>LB</sub> <input id="alb" type="number" step="0.0001" min="0.9" max="1" value="0.9999" style="width:80px"></label> <label>A<sub>node</sub> <input id="anode" type="number" step="0.001" min="0.9" max="1" value="0.99" style="width:70px"></label> <label>A<sub>DB</sub> <input id="adb" type="number" step="0.0001" min="0.9" max="1" value="0.999" style="width:80px"></label></div>
<div id="status" aria-live="polite"></div>
<div class="wrap">
  <svg id="v" viewBox="0 0 560 300" role="img" aria-label="Bal: egy LB SPOF, közös image/config és Ceph a három app node és a két adatbázis-példány alatt. Jobb: redundáns LB, külön config revision, eltérő rackben lévő standby; a lánc availability 0,9986."></svg>
  <pre id="code" aria-label="Pszeudokód"></pre>
</div>
<p class="small">Kattintás: csomópont vagy rack kiesése (újra kattintva visszaáll). Modell: az app tier 2-of-3, a DB a primaryn vagy – etcd-quorum (2/3) mellett – a standbyra failoverrel írható; Redis és Partner API soft dependency (degradált mód). A-értékek az 54.1.7.3 számaiból, nem mérés.</p>
<script>
// ---- Adat: lépések (a Python-szkript számolja ki és illeszti be, a könyv példájával egyezően) ----
// Minden lépés: {msg: "állapotsor szövege", line: kiemelt pszeudokódsor indexe vagy -1, ...saját mezők}
let STEPS = [{"msg": "Kattints egy csomópontra vagy rack-feliratra a kiesés szimulálásához. Írási út: OK | A_app (2-of-3) = 3·0,9900² − 2·0,9900³ = 0,99970; lánc = 0,9999 · 0,99970 · 0,9990 = 0,99860 < 0,9995 cél"}];
const CODE = [];          // pszeudokód sorai (üres lista: a panel elrejtve)

// ---- Rajzolás: ezt a függvényt kell az ábrához igazítani ----
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
const svg = document.getElementById("v");
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function render(s){
  // Példa: tömb cellákként, s.a = értékek, s.hl = kiemelt indexek
  svg.innerHTML = "";
  const a = s.a || [], w = 48, x0 = (560 - a.length * w) / 2, y0 = 110;
  a.forEach((v, i) => {
    const on = (s.hl || []).includes(i);
    el("rect", {x: x0 + i * w, y: y0, width: w, height: w, fill: on ? css("--cellhl") : css("--cell"), stroke: css("--line"), "stroke-width": on ? 3 : 1.2});
    el("text", {x: x0 + i * w + w / 2, y: y0 + w / 2 + 6, "text-anchor": "middle", "font-size": 18}, String(v));
    el("text", {x: x0 + i * w + w / 2, y: y0 + w + 18, "text-anchor": "middle", "font-size": 12, fill: css("--muted")}, String(i));
  });
}

function defs0(){
  const d = el("defs", {});
  const ln = css("--line"), mu = css("--muted"), hl = css("--hl"), h2 = css("--hl2");
  d.innerHTML = `<pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${mu}" stroke-width="1.6"/></pattern>`
   + `<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="${mu}"/></pattern>`
   + `<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${ln}"/></marker>`
   + `<marker id="arh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${hl}"/></marker>`
   + `<marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${h2}"/></marker>`;
}
function R(x, y, w, h, a){ return el("rect", Object.assign({x: x, y: y, width: Math.max(0, w), height: h, fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.2, rx: 4}, a || {})); }
function T(x, y, t, a){
  const lines = String(t).split("\n"), fs = (a && a["font-size"]) || 12, out = [];
  lines.forEach((s, i) => out.push(el("text", Object.assign({x: x, y: y + i * fs * 1.2, "font-size": fs}, a || {}), s)));
  return out;
}
function L(x1, y1, x2, y2, a){ return el("line", Object.assign({x1: x1, y1: y1, x2: x2, y2: y2, stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function A(x1, y1, x2, y2, a){ return L(x1, y1, x2, y2, Object.assign({"marker-end": "url(#ar)"}, a || {})); }
function XM(cx, cy, r, a){ const o = Object.assign({stroke: css("--hl2"), "stroke-width": 3}, a || {}); L(cx - r, cy - r, cx + r, cy + r, o); L(cx - r, cy + r, cx + r, cy - r, o); }
function DIA(cx, cy, r, a){ return el("polygon", Object.assign({points: [cx, cy - r, cx + r, cy, cx, cy + r, cx - r, cy].join(","), fill: css("--cell"), stroke: css("--line"), "stroke-width": 1.3}, a || {})); }
function hu(x, d){ return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ",").replace("-", "−"); }

const LAY = {"base": {"nodes": {"app1": [24, 56, "App 1"], "app2": [66, 56, "App 2"], "app3": [86, 56, "App 3"], "primary": [24, 34, "PostgreSQL\nprimary"], "standby": [76, 34, "standby"], "etcd3": [10, 18, "etcd 3"], "etcd1": [64, 18, "etcd 1"], "etcd2": [86, 18, "etcd 2"], "redis": [8, 76, "Redis"], "partner": [92, 76, "Partner API"], "lb": [50, 76, "LB"], "ceph": [50, 1, "Ceph pool"]}, "rackA": ["app1", "primary", "etcd3"], "rackB": ["app2", "app3", "standby", "etcd1", "etcd2"], "ceph": ["primary", "standby"], "cfg": ["app1", "app2", "app3"], "spof": ["lb"]}, "fixed": {"nodes": {"app1": [24, 56, "App 1"], "app2": [66, 56, "App 2"], "app3": [86, 56, "App 3"], "primary": [24, 34, "PostgreSQL\nprimary"], "standby": [76, 34, "standby"], "etcd3": [10, 18, "etcd 3"], "etcd1": [64, 18, "etcd 1"], "etcd2": [86, 18, "etcd 2"], "redis": [8, 76, "Redis"], "partner": [92, 76, "Partner API"], "lbA": [40, 76, "LB A\n(A táp)"], "lbB": [60, 76, "LB B\n(B táp)"], "ceph": [30, 1, "Ceph pool"], "stor2": [76, 1, "külön storage\n(B domain)"]}, "rackA": ["app1", "primary", "etcd3", "lbA"], "rackB": ["app2", "app3", "standby", "etcd1", "etcd2", "lbB", "stor2"], "ceph": ["primary"], "cfg": [], "spof": []}}, EDGES = {"base": {"hard": [["lb", "app1"], ["lb", "app2"], ["lb", "app3"], ["app1", "primary"], ["app2", "primary"], ["app3", "primary"], ["primary", "ceph"], ["primary", "standby"], ["standby", "ceph"], ["standby", "etcd1"], ["standby", "etcd2"], ["standby", "etcd3"]], "soft": [["app1", "redis"], ["app3", "partner"]]}, "fixed": {"hard": [["lbA", "app1"], ["lbA", "app2"], ["lbA", "app3"], ["lbB", "app1"], ["lbB", "app2"], ["lbB", "app3"], ["app1", "primary"], ["app2", "primary"], ["app3", "primary"], ["primary", "ceph"], ["primary", "standby"], ["standby", "stor2"], ["standby", "etcd1"], ["standby", "etcd2"], ["standby", "etcd3"]], "soft": [["app1", "redis"], ["app3", "partner"]]}};
let MODE = "base", FAILED = [];
function impact(mode, failed){
  const L = LAY[mode], down = new Set();
  failed.forEach(f => { if (["rackA", "rackB", "ceph", "cfg"].includes(f)) { L[f].forEach(n => down.add(n)); if (f === "ceph") down.add("ceph"); } else down.add(f); });
  if (down.has("ceph")) L.ceph.forEach(n => down.add(n));
  if (down.has("stor2")) down.add("standby");
  const lbs = mode === "base" ? ["lb"] : ["lbA", "lbB"], lbOk = lbs.some(l => !down.has(l));
  const apps = ["app1", "app2", "app3"].filter(a => !down.has(a)).length, etcd = ["etcd1", "etcd2", "etcd3"].filter(e => !down.has(e)).length;
  let db = null; if (!down.has("primary")) db = "primary"; else if (!down.has("standby") && etcd >= 2) db = "failover a standbyra";
  const rs = []; if (!lbOk) rs.push("nincs működő LB"); if (apps < 2) rs.push("csak " + apps + " app node (2 kell)");
  if (db === null) rs.push("nincs írható DB (" + (etcd < 2 ? "etcd-quorum " + etcd + "/3" : "primary és standby is kiesett") + ")");
  let st = rs.length ? "LEÁLL: " + rs.join(", ") : (db === "primary" ? "OK" : "OK " + db + "-ral (etcd " + etcd + "/3)");
  if (!rs.length && (down.has("redis") || down.has("partner"))) st += "; degradált (soft dependency kiesett)";
  return [down, st];
}
function avail(){
  const g = id => +document.getElementById(id).value, a = g("anode"), app = 3 * a * a - 2 * a * a * a;
  const ch = g("alb") * app * g("adb");
  return "A_app (2-of-3) = 3·" + hu(a, 4) + "² − 2·" + hu(a, 4) + "³ = " + hu(app, 5) + "; lánc = " + hu(g("alb"), 4) + " · " + hu(app, 5) + " · " + hu(g("adb"), 4) + " = " + hu(ch, 5) + (ch >= 0.9995 ? " ≥ 0,9995 cél" : " < 0,9995 cél");
}
function msgFor(){
  const r = impact(MODE, FAILED), N = LAY[MODE].nodes;
  const lab = f => ({rackA: "Rack A", rackB: "Rack B", ceph: "Ceph pool", cfg: "configmap/image"}[f] || N[f][2].replace("\n", " "));
  const hit = [...r[0]].filter(n => N[n]).map(n => N[n][2].replace("\n", " "));
  return (FAILED.length ? "kiesett: " + FAILED.map(lab).join(", ") + " → érintett: " + hit.join(", ") + "; írási út: " + r[1] : "Kattints egy csomópontra vagy rack-feliratra a kiesés szimulálásához. Írási út: OK") + " | " + avail();
}
function render(s){
  svg.setAttribute("viewBox", "0 0 700 330"); svg.innerHTML = ""; defs0();
  const L = LAY[MODE], N = L.nodes, X = x => 20 + x * 6.6, Y = y => 312 - y * 3.4, down = impact(MODE, FAILED)[0];
  const rk = (x0, x1, id, lab, fill) => { const r = R(X(x0), Y(63), X(x1) - X(x0), Y(8) - Y(63), {rx: 0, fill: fill, "stroke-width": FAILED.includes(id) ? 3 : 1, stroke: FAILED.includes(id) ? css("--hl2") : css("--line"), style: "cursor:pointer"});
    r.addEventListener("click", () => toggle(id)); T(X(x0) + 4, Y(9.5), lab + (FAILED.includes(id) ? " (kiesett)" : ""), {"font-size": 11, "font-weight": "bold"}); };
  rk(1, 39, "rackA", "Rack A", "url(#hat)"); rk(55, 100, "rackB", "Rack B", "url(#dots)");
  const E = EDGES[MODE];
  const HW = n => ["stor2", "primary", "partner"].includes(n) ? 52 : 43;
  const clipP = (x0, y0, x1, y1, hx, hy) => { const dx = x1 - x0, dy = y1 - y0, t = Math.min(dx ? hx / Math.abs(dx) : 1e9, dy ? hy / Math.abs(dy) : 1e9); return [x0 + dx * t, y0 + dy * t]; };
  if (L.cfg.length) { const on = FAILED.includes("cfg"), b = R(X(14), Y(61.5), X(96) - X(14), Y(50.5) - Y(61.5), {rx: 0, fill: "transparent", "stroke-dasharray": "2 3", "stroke-width": on ? 3 : 1.6, stroke: on ? css("--hl2") : css("--line"), style: "cursor:pointer"});
    b.addEventListener("click", () => toggle("cfg")); T(X(45), Y(46.5), "common: közös configmap + image (kattintható)", {"font-size": 10, "text-anchor": "middle"}); }
  [["hard", ""], ["soft", "6 4"]].forEach(([k, da]) => E[k].forEach(([u, v]) => {
    const a = N[u], b = N[v], p0 = clipP(X(a[0]), Y(a[1]), X(b[0]), Y(b[1]), HW(u), 17), p1 = clipP(X(b[0]), Y(b[1]), X(a[0]), Y(a[1]), HW(v), 17);
    const off = down.has(u) || down.has(v);
    A(p0[0], p0[1], p1[0], p1[1], {"stroke-dasharray": da, opacity: off ? 0.3 : 1}); }));
  for (const n in N) { const [x, y, t] = N[n], dn = down.has(n), w = 2 * HW(n) - 2;
    const r = R(X(x) - w / 2, Y(y) - 15, w, 30, {fill: dn ? css("--muted") : css("--cell"), "stroke-width": L.spof.includes(n) ? 3.5 : 1.2, style: "cursor:pointer"});
    r.addEventListener("click", () => toggle(n));
    const tt = T(X(x), Y(y) + (t.includes("\n") ? -2 : 4), t, {"font-size": 11, "text-anchor": "middle", "pointer-events": "none"});
    if (dn) XM(X(x) + w / 2 - 6, Y(y) - 10, 4); }
}
function toggle(n){ const i = FAILED.indexOf(n); if (i >= 0) FAILED.splice(i, 1); else FAILED.push(n); setSteps([{msg: msgFor()}]); }
document.getElementById("mode").addEventListener("change", e => { MODE = e.target.value; FAILED = []; setSteps([{msg: msgFor()}]); });
["alb", "anode", "adb"].forEach(id => document.getElementById(id).addEventListener("change", () => setSteps([{msg: msgFor()}])));
document.getElementById("reset").addEventListener("click", () => { FAILED = []; setSteps([{msg: msgFor()}]); });


// ---- Vezérlés (általában nem kell módosítani) ----
let k = 0, timer = null;
const pos = document.getElementById("pos"), status = document.getElementById("status");
const codeEl = document.getElementById("code");
if (!CODE.length) codeEl.style.display = "none";
else codeEl.innerHTML = CODE.map((l, i) => `<span id="L${i}">${l.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`).join("");
pos.max = STEPS.length - 1;
// Új lépéssor betöltése (pl. saját bemenetből számolva): setSteps(lista)
function setSteps(list){ stop(); STEPS = list; pos.max = STEPS.length - 1; show(0); }
function show(i){
  k = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[k];
  pos.value = k;
  document.getElementById("cnt").textContent = `${k + 1}/${STEPS.length}`;
  status.textContent = s.msg || "";
  codeEl.querySelectorAll("span").forEach(x => x.classList.remove("on"));
  if (s.line !== undefined && s.line >= 0) { const L = document.getElementById("L" + s.line); if (L) L.classList.add("on"); }
  render(s);
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } document.getElementById("play").textContent = "▶ Lejátszás"; }
document.getElementById("first").onclick = () => { stop(); show(0); };
document.getElementById("prev").onclick = () => { stop(); show(k - 1); };
document.getElementById("next").onclick = () => { stop(); show(k + 1); };
document.getElementById("play").onclick = () => {
  if (timer) { stop(); return; }
  if (k >= STEPS.length - 1) show(0);
  document.getElementById("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { if (k >= STEPS.length - 1) stop(); else show(k + 1); }, 900);
};
pos.oninput = () => { stop(); show(+pos.value); };
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { stop(); show(k + 1); } if (e.key === "ArrowLeft") { stop(); show(k - 1); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => show(k));
show(0);
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
