<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steal-idő keletkezése</title>
<style>
:root{--fg:#111;--bg:#fff;--muted:#666;--hl:#1f4e79;--hl2:#c55a11;--cell:#fff;--cellhl:#d9d9d9;--line:#000;--code:#f3f3f3}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#1b1b1b;--muted:#aaa;--hl:#8fb8e8;--hl2:#f0a060;--cell:#262626;--cellhl:#4a4a4a;--line:#ddd;--code:#2a2a2a}}
*{box-sizing:border-box}
body{margin:0;padding:10px;font:14px/1.45 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
button,select,input{font:inherit}
button{padding:3px 10px;cursor:pointer}
#status{margin:4px 0 6px;min-height:2.9em}
svg{width:100%;height:auto;display:block}
svg text:not([fill]){fill:var(--fg);}
svg text{font-family:system-ui,sans-serif}
.small{font-size:12px;color:var(--muted)}
pre{background:var(--code);padding:6px 8px;font:12.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<div class="ctl" role="group" aria-label="Vezérlők">
<label><input type="checkbox" id="tb" checked> target terhelés</label>
<label><input type="checkbox" id="nb" checked> noisy terhelés (stress-ng)</label>
<label>pinning <select id="pin" aria-label="pinning"><option value="nincs">nincs (8 CPU)</option><option value="átfedő" selected>átfedő (mind a 2–3. CPU-n)</option><option value="szétválasztott">szétválasztott (noisy 4–5.)</option></select></label>
<button id="play" type="button">▶ Lejátszás</button>
</div>
<div id="status" aria-live="polite"></div>
<svg id="v" viewBox="0 0 640 330" role="img" aria-label="Négy vCPU-szál (target és noisy, 2-2) állapota 0 és 1000 ms között: fut, vár (steal) vagy alszik; a pinning és a terhelés kapcsolható."></svg>
<div id="extra"></div>
<p class="small">Modell, nem mérés: egy host CPU-n a futtatható szálak 50 ms-os szeletekben osztoznak. A steal a „futtatható, de nem fut” idő; az alvó (HLT) vCPU nem gyűjt stealt.</p>
<script>
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("v");
const status = document.getElementById("status");
function el(tag, attrs, text){const e=document.createElementNS(NS,tag);for(const a in attrs)e.setAttribute(a,attrs[a]);if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

function D(){
  const d = document.createElementNS(NS, "defs"); svg.appendChild(d);
  const c = css("--line"), m = css("--muted"), h = css("--hl2"), b = css("--hl");
  d.innerHTML =
    `<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${c}"/></marker>` +
    `<marker id="ahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${h}"/></marker>` +
    `<marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="${b}"/></marker>` +
    `<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${m}" stroke-width="1.3"/></pattern>` +
    `<pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="0.9" fill="${m}"/></pattern>` +
    `<pattern id="cross" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0,0L6,6M6,0L0,6" stroke="${m}" stroke-width="0.8"/></pattern>`;
}
function R(x, y, w, h, o){
  o = o || {};
  const a = {x: x, y: y, width: w, height: h, rx: (o.rx === undefined ? 4 : o.rx),
             fill: o.fill || css("--cell"), stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.2};
  if (o.dash) a["stroke-dasharray"] = o.dash;
  const r = el("rect", a);
  if (o.title) { const t = document.createElementNS(NS, "title"); t.textContent = o.title; r.appendChild(t); }
  return r;
}
function T(x, y, s, o){
  o = o || {};
  const a = {x: x, y: y, "text-anchor": o.a || "middle", "font-size": o.fs || 12};
  if (o.fill) a.fill = o.fill;
  if (o.bold) a["font-weight"] = "bold";
  if (o.mono) a["font-family"] = "ui-monospace,monospace";
  return el("text", a, s);
}
function A(x1, y1, x2, y2, o){
  o = o || {};
  const a = {x1: x1, y1: y1, x2: x2, y2: y2, stroke: o.stroke || css("--line"), "stroke-width": o.sw || 1.5};
  if (!o.noh) a["marker-end"] = "url(#" + (o.m || "ah") + ")";
  if (o.both) a["marker-start"] = "url(#" + (o.m || "ah") + ")";
  if (o.dash) a["stroke-dasharray"] = o.dash;
  return el("line", a);
}
function X(x, y, r, o){
  o = o || {};
  const c = o.stroke || css("--hl2"), w = o.sw || 3;
  el("line", {x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: c, "stroke-width": w});
  el("line", {x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: c, "stroke-width": w});
}


const ALL = {"nincs-0-0":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":0,"target vCPU1":1,"noisy vCPU0":6,"noisy vCPU1":7}},"nincs-0-1":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"run"]],"noisy vCPU1":[[0,1000,"run"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":0,"target vCPU1":1,"noisy vCPU0":6,"noisy vCPU1":7}},"nincs-1-0":{"seg":{"target vCPU0":[[0,1000,"run"]],"target vCPU1":[[0,1000,"run"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":100.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":0,"target vCPU1":1,"noisy vCPU0":6,"noisy vCPU1":7}},"nincs-1-1":{"seg":{"target vCPU0":[[0,1000,"run"]],"target vCPU1":[[0,1000,"run"]],"noisy vCPU0":[[0,1000,"run"]],"noisy vCPU1":[[0,1000,"run"]]},"st":{"usr":100.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":0,"target vCPU1":1,"noisy vCPU0":6,"noisy vCPU1":7}},"átfedő-0-0":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":2,"noisy vCPU1":3}},"átfedő-0-1":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"run"]],"noisy vCPU1":[[0,1000,"run"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":2,"noisy vCPU1":3}},"átfedő-1-0":{"seg":{"target vCPU0":[[0,1000,"run"]],"target vCPU1":[[0,1000,"run"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":100.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":2,"noisy vCPU1":3}},"átfedő-1-1":{"seg":{"target vCPU0":[[0,50,"run"],[50,100,"wait"],[100,150,"run"],[150,200,"wait"],[200,250,"run"],[250,300,"wait"],[300,350,"run"],[350,400,"wait"],[400,450,"run"],[450,500,"wait"],[500,550,"run"],[550,600,"wait"],[600,650,"run"],[650,700,"wait"],[700,750,"run"],[750,800,"wait"],[800,850,"run"],[850,900,"wait"],[900,950,"run"],[950,1000,"wait"]],"target vCPU1":[[0,50,"run"],[50,100,"wait"],[100,150,"run"],[150,200,"wait"],[200,250,"run"],[250,300,"wait"],[300,350,"run"],[350,400,"wait"],[400,450,"run"],[450,500,"wait"],[500,550,"run"],[550,600,"wait"],[600,650,"run"],[650,700,"wait"],[700,750,"run"],[750,800,"wait"],[800,850,"run"],[850,900,"wait"],[900,950,"run"],[950,1000,"wait"]],"noisy vCPU0":[[0,50,"wait"],[50,100,"run"],[100,150,"wait"],[150,200,"run"],[200,250,"wait"],[250,300,"run"],[300,350,"wait"],[350,400,"run"],[400,450,"wait"],[450,500,"run"],[500,550,"wait"],[550,600,"run"],[600,650,"wait"],[650,700,"run"],[700,750,"wait"],[750,800,"run"],[800,850,"wait"],[850,900,"run"],[900,950,"wait"],[950,1000,"run"]],"noisy vCPU1":[[0,50,"wait"],[50,100,"run"],[100,150,"wait"],[150,200,"run"],[200,250,"wait"],[250,300,"run"],[300,350,"wait"],[350,400,"run"],[400,450,"wait"],[450,500,"run"],[500,550,"wait"],[550,600,"run"],[600,650,"wait"],[650,700,"run"],[700,750,"wait"],[750,800,"run"],[800,850,"wait"],[850,900,"run"],[900,950,"wait"],[950,1000,"run"]]},"st":{"usr":50.0,"steal":50.0,"wait_ns":[500000000,500000000]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":2,"noisy vCPU1":3}},"szétválasztott-0-0":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":4,"noisy vCPU1":5}},"szétválasztott-0-1":{"seg":{"target vCPU0":[[0,1000,"idle"]],"target vCPU1":[[0,1000,"idle"]],"noisy vCPU0":[[0,1000,"run"]],"noisy vCPU1":[[0,1000,"run"]]},"st":{"usr":0.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":4,"noisy vCPU1":5}},"szétválasztott-1-0":{"seg":{"target vCPU0":[[0,1000,"run"]],"target vCPU1":[[0,1000,"run"]],"noisy vCPU0":[[0,1000,"idle"]],"noisy vCPU1":[[0,1000,"idle"]]},"st":{"usr":100.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":4,"noisy vCPU1":5}},"szétválasztott-1-1":{"seg":{"target vCPU0":[[0,1000,"run"]],"target vCPU1":[[0,1000,"run"]],"noisy vCPU0":[[0,1000,"run"]],"noisy vCPU1":[[0,1000,"run"]]},"st":{"usr":100.0,"steal":0.0,"wait_ns":[0,0]},"pin":{"target vCPU0":2,"target vCPU1":3,"noisy vCPU0":4,"noisy vCPU1":5}}}, TH = ["target vCPU0", "target vCPU1", "noisy vCPU0", "noisy vCPU1"];
const g = id => document.getElementById(id);
let tcur = 1000, timer = null;
["tb","nb","pin"].forEach(id => g(id).addEventListener("change", () => { stopP(); tcur = 1000; draw(); }));
function stopP(){ if (timer) { clearInterval(timer); timer = null; } g("play").textContent = "▶ Lejátszás"; }
g("play").onclick = () => { if (timer) { stopP(); return; } tcur = 0; g("play").textContent = "⏸ Szünet";
  timer = setInterval(() => { tcur += 25; if (tcur >= 1000) { tcur = 1000; stopP(); } draw(); }, 60); };
function draw(){
  const key = `${g("pin").value}-${g("tb").checked ? 1 : 0}-${g("nb").checked ? 1 : 0}`, d = ALL[key];
  svg.setAttribute("viewBox", "0 0 640 270"); svg.innerHTML = ""; D();
  const x0 = 170, w = 450, sx = t => x0 + w * t / 1000;
  let run = 0, wait = 0;
  TH.forEach((t, r) => { const y = 30 + r*48;
    T(x0 - 8, y + 20, `${t} → CPU ${d.pin[t]}`, {a: "end", fs: 11.5});
    d.seg[t].forEach(([a, b, s]) => { if (a >= tcur) return; const bb = Math.min(b, tcur);
      R(sx(a), y, sx(bb) - sx(a), 30, {rx: 0, sw: 0.6, fill: s === "run" ? css("--fg") : (s === "wait" ? "url(#hatch)" : css("--cell"))});
      if (t.startsWith("target")) { if (s === "run") run += bb - a; if (s === "wait") wait += bb - a; } }); });
  A(sx(tcur), 22, sx(tcur), 222, {noh: 1, stroke: css("--hl2"), sw: 2});
  [0, 250, 500, 750, 1000].forEach(t => T(sx(t), 240, String(t), {fs: 10, fill: css("--muted")}));
  T(x0 + w/2, 258, "idő [ms]", {fs: 10, fill: css("--muted")});
  R(10, 230, 18, 12, {rx: 0, fill: css("--fg")}); T(32, 240, "fut", {a: "start", fs: 10});
  R(60, 230, 18, 12, {rx: 0, fill: "url(#hatch)"}); T(82, 240, "vár (steal)", {a: "start", fs: 10});
  R(10, 250, 18, 12, {rx: 0, fill: css("--cell")}); T(32, 260, "alszik/HLT", {a: "start", fs: 10});
  const n = 2 * Math.max(tcur, 1), steal = 100 * wait / n, usr = 100 * run / n;
  status.textContent = `0–${tcur} ms: target %usr ≈ ${usr.toFixed(0)}, %steal ≈ ${steal.toFixed(0)}; „futtatható, de nem fut” idő ` +
    `vCPU-nként ${(wait / 2).toFixed(0)} ms (host: vcpu.N.wait). Modell, nem mérés.`;
}

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => draw());
draw();
</script>
<script>(function(){function s(){var b=document.body;parent.postMessage({figResize:Math.ceil(b.getBoundingClientRect().height)},"*")}addEventListener("load",s);addEventListener("resize",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);s()})()</script></body>
</html>
